description: A phrase-by-phrase companion to the book of Haggai, grounded in the restored gospel of Jesus Christ.
divisionsBlurb: Two chapters and four messages, each dated to the day, from the sixth month to the ninth of one year. The Lord calls the returned exiles to finish His house, and they obey; then He promises that the house they are building will be filled with glory, teaches them what makes a people clean, and chooses Zerubbabel as His signet.
home:
  blurb: A prophet of the return from exile who called the people of Jerusalem to stop waiting and build the Lord’s house, and promised that its glory would be greater than that of Solomon’s temple.

intro: |
  Haggai prophesied in Jerusalem “in the second year of Darius the king” ([[Hag. 1:1]]), about 520 B.C., some eighteen years after Cyrus of Persia let the exiles of Judah go home and rebuild their temple. They had set up the altar and laid the foundation, and then the work stopped ([[Ezra 3:2–3]]; [[Ezra 3:10]]; [[Ezra 4:24]]). “This people say,” the Lord told Haggai, “The time is not come, the time that the LORD’s house should be built” ([[Hag. 1:2]]). His answer was a question, “Is it time for you, O ye, to dwell in your ceiled houses, and this house lie waste?” ([[Hag. 1:4]]), and a command given twice: “Consider your ways” ([[Hag. 1:5]]; [[Hag. 1:7]]). Before the month was out, Zerubbabel the governor, Joshua the high priest and “all the remnant of the people” had come “and did work in the house of the LORD of hosts, their God” ([[Hag. 1:12–15]]). Haggai and Zechariah encouraged the work until the temple was finished and dedicated ([[Ezra 5:1–2]]; [[Ezra 6:14–16]]).

  To those who remembered Solomon’s temple and found the new one “in comparison of it as nothing” ([[Hag. 2:3]]), the Lord said, “be strong, all ye people of the land, saith the LORD, and work: for I am with you” ([[Hag. 2:4]]). He promised that “the desire of all nations shall come” and that “the glory of this latter house shall be greater than of the former” ([[Hag. 2:7]]; [[Hag. 2:9]]), words the Epistle to the Hebrews takes up ([[Heb. 12:26–27]]). A question put to the priests about holy flesh and the touch of the dead showed the people what their neglect had done to all their work ([[Hag. 2:11–14]]), and the book ends with the Lord’s word to Zerubbabel, the grandson of King Jehoiachin: “will make thee as a signet: for I have chosen thee” ([[Hag. 2:23]]). Latter-day Saints hear in Haggai the Lord’s rebuke to the Saints at Kirtland, who had “not considered the great commandment” to build His house ([[D&C 95:3]]). This companion goes through both chapters and tries to anticipate the questions a careful reader would ask.

  For the return from exile and the rebuilding of the temple, see [A Timeline of the Old Testament](/old-testament/guides/israels-story/#return) and [Persia and the Return](/old-testament/guides/persia-and-the-return/#rulers).

# Proposed (BRIEF.md, “Divisions”): one division a chapter, following the book's dated messages (1:1–15; 2:1–9, 10–19, 20–23).
# Keys must not repeat another book’s (the colors are global variables).
divisions:
  - key: hagbuild
    range: [1, 1]
    name: Consider Your Ways
    blurb: The people say the time has not come to build the Lord’s house. The Lord asks why they live in finished houses while His lies waste, and shows them their harvests, wages and drought. Zerubbabel, Joshua and the remnant of the people obey, and the Lord stirs up their spirits to work.
    color: '#8a5a2b'
    darkColor: '#e0b88a'
  - key: hagglory
    range: [2, 2]
    name: The Glory of This Latter House
    blurb: To those who think the new temple nothing beside Solomon’s, the Lord tells the people to be strong and work, and promises to shake the nations and fill the house with glory. A question to the priests shows that holiness is not passed on by touch, but uncleanness is, and from the day the foundation is laid the Lord will bless them. Zerubbabel is chosen as the Lord’s signet.
    color: '#2f6f73'
    darkColor: '#8fd0d3'

