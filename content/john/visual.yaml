summary: >-
  John writes that his readers "might believe that Jesus is the Christ, the Son of God,"
  and his last scene shows the risen Lord already on the shore at daybreak, with a fire
  and a meal laid, calling His disciples to come and eat. The book's center is the Son
  who gives life and feeds His own: the meal is ready before they come ashore, and the net they draw in holds every fish.
  The picture is the shore just after He has prepared it.
look: >-
  A realistic painted illustration, as a skilled landscape illustrator would paint a
  full-page plate in gouache for a fine book: true proportions and scale, natural color,
  believable light and cast shadows, real-looking cloth, bronze, rock and water. It is
  plainly a painting and not a photograph: forms are slightly simplified, surfaces are
  smooth washes of color with little fine texture (no gravel, pebbles or grain picked out
  one by one), and edges are clean and soft. It is not a cartoon or a flat poster either:
  no outlines, no faceted or stylized shapes, no exaggerated color.
motifs:
  - "Primary: a fire of glowing coals inside a ring of grey stones on the shore, with two fish lying on the coals and a thin thread of smoke rising, and one round flat loaf on a flat stone beside it (John 21:9)."
  - "Supporting: beside the fire, a full fishing net heaped on the shore with many large silver fish in its mesh, whole and unbroken (John 21:11), and a dark wet trail in the sand where it was dragged up from the water (John 21:8)."
  - "Supporting: a small empty wooden fishing boat with its sail lowered, in the shallows at the left, held by a line (John 21:8)."
composition: >-
  A wide shore scene with a low horizon. The fire, loaf and net fill the lower half, the
  fire right of center and the net to its left; the boat sits small at the water's edge at
  the left. Beyond, the lake lies calm with mist on it and low hills on the far side. One
  light, the sun just risen over the hills at the far right, laying a path of gold on the
  water, so that the shadows fall to the left and toward the viewer; the coals add a small
  red-orange glow of their own. Grass and a few white flowers at the lower left edge.
  Palette of warm sand, grey stone, silver, lavender and rose in the sky, and restrained
  gold. No figures, animals other than the fish, or buildings.
# “What's in this picture” under the image on the book page: one line for each thing, with the verse it shows.
key:
  - '**The fire of coals, with fish on it and bread beside it** is the meal the disciples found already laid when they came ashore: “they saw a fire of coals there, and fish laid thereon, and bread” ([[John 21:9]]). He had asked them from the shore, “Children, have ye any meat?” and they had answered, “No” ([[John 21:5]]); now He says, “Come and dine” ([[John 21:12]]).'
  - '**The net heaped full of fish and not torn** is the catch Peter drew to land: “full of great fishes, an hundred and fifty and three: and for all there were so many, yet was not the net broken” ([[John 21:11]]).'
  - '**The small boat and the wet trail up the sand** recall the disciples coming in “in a little ship; (for they were not far from land, but as it were two hundred cubits,) dragging the net with fishes” ([[John 21:8]]).'
  - '**The sun just risen over the lake** marks the hour: “when the morning was now come, Jesus stood on the shore: but the disciples knew not that it was Jesus” ([[John 21:4]]).'
