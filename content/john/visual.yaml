alt: At sunrise on a lake shore, two fish lie on a fire of glowing coals inside a ring of stones, with a thin line of smoke rising and a round flat loaf on a flat stone beside it; next to the fire a full net heaped with silver fish lies unbroken at the end of a wet trail from the water, and a small empty boat rests in the misty shallows at the left.
