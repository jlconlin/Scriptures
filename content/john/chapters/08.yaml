chapter: 8
title: Before Abraham Was, I Am
tagline: In the temple after the feast of tabernacles, Jesus sends away the accusers of a woman taken in adultery and tells her to sin no more; then He declares Himself the light of the world, promises that the truth will make free those who continue in His word, tells those who claim Abraham as their father that they do not do Abraham's works, and answers “Before Abraham was, I am,” and they take up stones.
when: 'In the temple at Jerusalem, probably soon after the feast of tabernacles ([[John 7:37]]; [[John 8:2]])'

setting: |
  Chapter 8 goes on with the visit to Jerusalem that began at the feast of tabernacles in chapter 7. The feast is over, and likely not long over: early in the morning Jesus is back in the temple, sitting and teaching the people who come to Him (verse 2). He taught in the part of the temple called the treasury, which opened on the Court of the Women (verse 20), the court where the feast's great lamps had been lit. What He says here is said where the feast's ceremonies had been held.

  The chapter has two parts. The first is the account of the woman taken in adultery (verses 1–11), which begins with the last verse of chapter 7. Where the account stands in the manuscripts is told in the note on [[John 7:53]]; what that means for reading it is in the note on verse 1 here. The second is a long exchange in the temple (verses 12–59), told only by John. Jesus's hearers are named by turns: the Pharisees (verse 13), “the Jews” (verses 22, 48, 52, 57), and Jews who had believed on Him (verse 31). It opens with “I am the light of the world” and ends with “Before Abraham was, I am,” and with stones.

thread: |
  **The chapter is a long answer to the question the hearers put in verse 25: “Who art thou?”**

  Jesus answers it in pieces. He is the light of the world (verse 12); He is from above and they are from beneath (verse 23); unless they believe that “I am,” they will die in their sins (verse 24); when they have lifted Him up, they will know that “I am” (verse 28). They hear the words without hearing what is in them. At the end He says it plainly, “Before Abraham was, I am” (verse 58), and this time they seem to grasp the claim, for they reach for stones.

  A second question runs beside the first: who is your father? The hearers claim Abraham, then God. Jesus answers that children are known by what they do, and that seeking to kill a man who told them the truth is not what Abraham did (verses 39–40). The chapter that began with men who wanted a woman stoned walking away, convicted by their own consciences, ends with men taking up stones against Jesus Himself.

sections:
  - range: 1-11
    heading: The woman taken in adultery
    plain: |
      Jesus went to the Mount of Olives. Early in the morning He came again into the temple, and all the people came to Him, and He sat down and taught them. The scribes and Pharisees brought Him a woman caught in adultery, stood her in the middle of everyone, and said to Him, “Teacher, this woman was caught in adultery, in the very act. In the law Moses commanded us to stone such women. What do you say?” They said this to test Him, so that they would have something to accuse Him of. But Jesus bent down and wrote on the ground with His finger, as if He had not heard them.

      When they kept on asking Him, He stood up and said to them, “Let the one among you who is without sin be the first to throw a stone at her.” And again He bent down and wrote on the ground. Those who heard it, convicted by their own consciences, went out one by one, beginning with the oldest, down to the last, and Jesus was left alone with the woman standing there. Jesus stood up, and seeing no one but the woman, He said to her, “Woman, where are your accusers? Has no one condemned you?” She said, “No one, Lord.” And Jesus said, “Neither do I condemn you. Go, and sin no more.”
  - range: 12-20
    heading: The light of the world
    plain: |
      Jesus spoke to them again: “I am the light of the world. Whoever follows me will not walk in darkness but will have the light of life.” So the Pharisees said to Him, “You are bearing witness about yourself; your witness is not valid.” Jesus answered, “Even if I bear witness about myself, my witness is true, because I know where I came from and where I am going; but you do not know where I come from or where I am going. You judge after the flesh; I judge no one. And even if I do judge, my judgment is true, because I am not alone: it is I and the Father who sent me. It is written in your own law that the testimony of two men is true. I am one who bears witness of myself, and the Father who sent me bears witness of me.”

      Then they said to Him, “Where is your Father?” Jesus answered, “You know neither me nor my Father. If you had known me, you would have known my Father also.” He spoke these words in the treasury, as He taught in the temple, and no one arrested Him, because His hour had not yet come.
  - range: 21-30
    heading: Whither I go, ye cannot come
    plain: |
      Again He said to them, “I am going away, and you will look for me, and you will die in your sins. Where I am going, you cannot come.” So the Jews said, “Will he kill himself, since he says, ‘Where I am going, you cannot come’?” He said to them, “You are from below; I am from above. You are of this world; I am not of this world. That is why I told you that you would die in your sins: for unless you believe that I am, you will die in your sins.”

      They said to Him, “Who are you?” Jesus said, “Just what I have been telling you from the beginning. I have many things to say about you and to judge in you. But He who sent me is true, and I tell the world what I have heard from Him.” They did not understand that He was speaking to them of the Father. So Jesus said, “When you have lifted up the Son of man, then you will know that I am, and that I do nothing on my own, but speak just as my Father taught me. And He who sent me is with me. The Father has not left me alone, for I always do what pleases Him.” As He said these things, many believed in Him.
  - range: 31-47
    heading: The truth shall make you free
    plain: |
      Then Jesus said to the Jews who had believed Him, “If you continue in my word, you are truly my disciples, and you will know the truth, and the truth will make you free.” They answered Him, “We are Abraham's descendants and have never been slaves to anyone. How can you say, ‘You will be made free’?” Jesus answered, “I tell you the solemn truth: everyone who commits sin is a slave of sin. A slave does not stay in the house forever; the son stays forever. So if the Son makes you free, you will be free indeed. I know you are Abraham's descendants, but you are trying to kill me, because my word has no place in you. I speak of what I have seen with my Father, and you do what you have seen with your father.”

      They answered, “Abraham is our father.” Jesus said, “If you were Abraham's children, you would do the works Abraham did. But now you are trying to kill me, a man who has told you the truth that I heard from God. Abraham did not do that. You are doing the works of your father.” They said to Him, “We were not born of fornication. We have one Father, God.” Jesus said, “If God were your Father, you would love me, for I came forth from God and am here. I did not come on my own; He sent me. Why do you not understand what I say? It is because you cannot hear my word. You are of your father the devil, and you want to do what your father desires. He was a murderer from the beginning and did not stand in the truth, because there is no truth in him. When he lies, he speaks from what is his own, for he is a liar and the father of lies. But because I tell the truth, you do not believe me. Which of you convicts me of sin? If I tell the truth, why do you not believe me? Whoever is of God hears the words of God. The reason you do not hear them is that you are not of God.”
  - range: 48-59
    heading: Before Abraham was, I am
    plain: |
      The Jews answered Him, “Are we not right in saying that you are a Samaritan and have a devil?” Jesus answered, “I do not have a devil. I honor my Father, and you dishonor me. I do not seek my own glory; there is One who seeks it, and He is the judge. I tell you the solemn truth: if anyone keeps my word, he will never see death.” The Jews said to Him, “Now we know that you have a devil. Abraham died, and so did the prophets, and you say, ‘If anyone keeps my word, he will never taste death.’ Are you greater than our father Abraham, who died? The prophets died too. Who do you make yourself out to be?”

      Jesus answered, “If I honor myself, my honor is nothing. It is my Father who honors me, the One you call your God. You have not known Him, but I know Him. If I said I did not know Him, I would be a liar like you. But I do know Him, and I keep His word. Your father Abraham rejoiced that he would see my day; he saw it and was glad.” So the Jews said to Him, “You are not yet fifty years old, and you have seen Abraham?” Jesus said to them, “I tell you the solemn truth: before Abraham was born, I am.” Then they picked up stones to throw at Him, but Jesus hid Himself and went out of the temple, passing through the midst of them.

notes:
  - ref: 1
    phrase: Jesus went unto the mount of Olives.
    kind: history
    title: What the missing manuscripts mean
    body: |
      The story of the woman is scripture in the Church's Bible, and what the manuscripts show does not make it less likely to have happened. The facts are set out in the note on [[John 7:53]]: the earliest manuscripts leave the passage out, and some put it elsewhere. The earliest Greek manuscript known to have it is Codex Bezae, of the fifth century; it is missing from many manuscripts of different kinds; and its style and vocabulary differ from the rest of John. On that evidence the case against John's having written it has been judged conclusive.

      That is a question of where the account was first written down, not of whether it happened. The story itself has been judged to show strong signs of being historical, and Latter-day Saint scholars who discuss the manuscripts keep it as an event from the life of Jesus with good support behind it. Even if it was not first part of John, it need not be legend. Joseph Smith's translation keeps it and adds a line at its end (see the note on verse 11). The notes that follow read it as the Church's edition prints it: an account of something Jesus did.
    sources: [densley-adultery, lds-scriptures]
  - ref: 5
    phrase: Moses in the law commanded us, that such should be stoned
    kind: history
    title: The law and the trap
    body: |
      The accusers have the law on their side, and they are not using it honestly. The law of Moses made adultery, a man's relations with another man's wife, a capital crime, and it named both offenders: “the adulterer and the adulteress shall surely be put to death” ([[Lev. 20:10]]; [[Deut. 22:22]]). The scribes and Pharisees bring only the woman. John does not say where the man is, and his absence is the first sign that this is something other than justice. A woman caught “in the very act” also suggests that she was watched for, and quite possibly set up.

      Verse 6 says what they wanted: they asked “tempting him, that they might have to accuse him.” Under Roman law adultery was not a capital crime until the third century, and the Jewish council may not have had the right to put anyone to death. If Jesus said, Stone her, they could report Him to the Romans; if He said, Do not, they could charge Him with setting aside the law of Moses. Either answer would serve them.
    sources: [densley-adultery]
  - ref: 7
    phrase: He that is without sin among you, let him first cast a stone at her
    kind: history
    title: Let him first cast a stone
    body: |
      Jesus answers with the law, not against it. The law that commanded stoning also said how it was to be done: no one could be put to death on the word of one witness, and “the hands of the witnesses shall be first upon him to put him to death, and afterward the hands of all the people” ([[Deut. 17:6–7]]), the verse the footnote gives here. The first stone belonged to the witnesses. By saying who must throw it, Jesus turned the question from the woman to her accusers and compelled them to examine themselves.

      The words can also be read as a point of law rather than a plea for leniency. On that reading the question was not whether the law's penalty was just but whether these accusers were fit to carry it out, and the accusers may themselves have been subject to the very penalty they meant to impose.

      What Jesus wrote on the ground, twice, John does not say, and no one knows. Some have thought He wrote the accusers' names, as Jeremiah said that those who forsake the Lord “shall be written in the earth” ([[Jer. 17:13]]); others, a verse of the law about witnesses. The act itself recalls the law written “with the finger of God” ([[Ex. 31:18]]). What John records is the effect: convicted by their own consciences, the accusers went out one by one, the eldest first.
    sources: [lds-scriptures, densley-adultery, oaks-stand-for-truth]
  - ref: 11
    phrase: 'Neither do I condemn thee: go, and sin no more'
    kind: prophets
    title: Neither do I condemn thee
    body: |
      Jesus does not condemn the woman, and He does not excuse what she did. The two halves of the verse belong together: the Savior declined in mercy to condemn her, and then “affirmed the law by saying, ‘Go, and sin no more.’” Declining to condemn her did not set the law aside. It moved the judgment from that morning, when her accusers wanted it carried out, to a later day, when she would be judged on the whole of her life, repentance included. Mercy gave her time to repent.

      The verse says nothing of forgiveness, and the footnote sends the reader to the revelation that does: one who “has committed adultery and repents with all his heart, and forsaketh it, and doeth it no more, thou shalt forgive” ([[D&C 42:25]]). Joseph Smith's translation tells what she did with the time she was given: “And the woman glorified God from that hour, and believed on his name.”
    sources: [oaks-stand-for-truth, lds-scriptures]
  - ref: 12
    phrase: I am the light of the world
    kind: symbol
    title: The light of the world
    body: |
      Jesus says it in the court where the feast's light had shone. At the feast of tabernacles four lampstands, each over seventy feet tall, were lit in the Court of the Women, and their light was said to reach every courtyard in Jerusalem. The treasury where Jesus was teaching (verse 20) was connected with that court, and ancient sources say that Zechariah 14, with its promise of light, was read at the lighting. With the lamps fresh in His hearers' minds, Jesus claimed their meaning for Himself. Heard in that setting, the words amount to a claim to be the Messiah the prophets had promised.

      The lamps lit one city during one feast. Jesus says He is the light “of the world,” and that whoever follows Him “shall have the light of life.” Latter-day revelation says how far that reaches: Christ is the light of the world because He is the source of the light that “proceedeth forth from the presence of God to fill the immensity of space” ([[D&C 88:12]]), the light that quickens understanding.
    sources: [gardner-tabernacles, talmage-jesus-christ-25, oaks-light-life-world]
  - ref: 14
    phrase: Though I bear record of myself, yet my record is true
    kind: history
    title: Yet my record is true
    body: |
      At the pool of Bethesda Jesus had said, “If I bear witness of myself, my witness is not true” ([[John 5:31]]); here He says, “Though I bear record of myself, yet my record is true.” The Pharisees' objection is one He had Himself granted: by that rule, a man's testimony about himself does not stand alone. He does not take back the rule. He keeps it, as He did in chapter 5, by naming a second witness, the Father (verses 17–18; see the note on [[John 5:31]]).

      But first He says why the rule cannot finally judge Him. What He testifies to, where He came from and where He is going, is a truth no human witness could confirm. They ask for a witness of the kind a court would hear, to something no such witness ever saw.
    sources: [ellicott-john]
  - ref: 22
    phrase: Will he kill himself?
    kind: history
    title: Will he kill himself?
    body: |
      “Will he kill himself?” is a sneer from the crowd in the temple. “The Jews” in this exchange are the people gathered round Jesus there, a mixed crowd that probably included Pharisees, scribes, rabbis, priests and Levites as well as ordinary people; the Pharisees are named in verse 13.

      When Jesus says that where He goes they cannot come, some ask whether He means to kill Himself. Their teaching, it seems, put suicides in Gehenna, the name of a valley by Jerusalem used for the place of everlasting punishment, so the question carries its own answer: if that is where He is going, they will certainly not follow. Jesus means the opposite direction. They are “from beneath” and He is “from above” (verse 23), and He is going to the Father who sent Him ([[John 16:28]]).
    sources: [talmage-jesus-christ-25, strongs-greek]
  - ref: 24
    phrase: if ye believe not that I am he
    kind: words
    title: That I am he
    body: |
      The “he” is not in the Greek. Jesus says, “if ye believe not that I am (*egō eimi*), ye shall die in your sins”; the King James translators supplied “he,” as they did in [[John 4:26]] and again in verse 28. Without it the words are an absolute “I am,” with nothing after it, and in the Septuagint, the Greek translation of the Old Testament, *egō eimi* is the phrase that renders God's name to Moses, “I Am That I Am” ([[Ex. 3:14]]).

      The hearers' reply, “Who art thou?” (verse 25), shows that they heard a claim without grasping what it was. The same words come back in verse 28, and again in verse 58, where the claim is made plainly.
    sources: [greek-nt, huntsman-gospel-john, ellicott-john]
  - ref: 28
    phrase: When ye have lifted up the Son of man
    kind: christ
    title: When ye have lifted up the Son of man
    body: |
      “Lifted up” is John's word for the cross. Jesus used it to Nicodemus, “even so must the Son of man be lifted up” ([[John 3:14]]), and uses it again near the end of His ministry, where John explains it: “This he said, signifying what death he should die” ([[John 12:33]]). The Greek verb means to raise on high, to exalt, and set beside [[John 12:32]] this verse suggests that Jesus meant both at once: the lifting onto the cross, and the exaltation He would reach through it.

      Here the ones who will lift Him up are His hearers: “When ye have lifted up the Son of man.” And then, He says, they will know “that I am.” The death they will bring about is where they will come to know who He is.
    sources: [thayer, lds-scriptures]
  - ref: 31
    phrase: If ye continue in my word, then are ye my disciples indeed
    kind: history
    title: Disciples indeed
    body: |
      The men Jesus speaks to here had believed Him (verse 30), and within a few verses He tells them that they are seeking to kill Him (verse 37). Nothing in the text marks a new group of speakers in verse 33, so the likeliest reading is that the same people answer. Their belief may have gone no further than accepting Him as a prophet or as a political Messiah, and they may have been of the ruling class, whose party was already seeking His life.

      Jesus tests that belief at once with a condition: “If ye continue in my word, then are ye my disciples indeed.” Their answer, offended at the thought that they need to be made free, shows them failing the first step of discipleship and taking the side of His opponents. The word that matters is “continue.” Believing for a moment is not yet discipleship; continuing in His word is, and the knowledge of the truth and the freedom it brings follow from it (verse 32).
    sources: [ellicott-john, gardner-tabernacles]
  - ref: 33
    phrase: were never in bondage to any man
    kind: history
    title: Never in bondage
    body: |
      The boast is strange on its face. The hearers had just spent a week living in booths to remember how God brought Israel out of bondage in Egypt, and they lived under the emperor of Rome. But they seem to have understood that Jesus meant another kind of bondage, and to have answered with their descent from Abraham: as his heirs, they held, they were free whatever their outward state.

      Jesus answers that the bondage He means is sin's: “Whosoever committeth sin is the servant of sin” (verse 34). Then He draws on the household. A servant lives in his master's house by permission and can be sent away or sold; a son has his place there by right. Descent from Abraham in the flesh had not made them his heirs in spirit or in works. Only the Son can make them free, and the freedom He gives is freedom “indeed” (verse 36).
    sources: [gardner-tabernacles, talmage-jesus-christ-25]
  - ref: 44
    phrase: Ye are of your father the devil
    kind: history
    title: Whose children?
    body: |
      Jesus is not denying their descent from Abraham. He grants it outright: “I know that ye are Abraham's seed” (verse 37). The question is whose children they are in what they do, since a true child bears the likeness of his father in his works. These men are seeking to kill the one who told them the truth he heard from God, and “this did not Abraham” (verse 40). They answer that they are not “born of fornication,” the prophets' figure for idolatry: they have one Father, God (verse 41). Jesus answers that God's children would love the one God sent, and names the father whose works they are doing: the devil, “a murderer from the beginning.” “Murderer” fits because they are seeking to kill Him.

      The words are addressed to the men in this exchange who sought His life, and they describe what those men were doing. The test is the one John's first letter sets out more fully, in the verse the footnote gives: “In this the children of God are manifest, and the children of the devil: whosoever doeth not righteousness is not of God” ([[1 Jn. 3:10]]). Joseph Smith's translation turns verses 43 and 47 from hearing to receiving: they cannot “bear” His word, and “He that is of God receiveth God's words; ye therefore receive them not, because ye are not of God.” Their reply in verse 48 is an insult in kind: “Samaritan,” a word the rabbis used in contempt, and the charge that He has a devil.
    sources: [ellicott-john, lds-scriptures]
  - ref: 51
    phrase: he shall never see death
    kind: scripture
    title: He shall never see death
    body: |
      Jesus does not promise that His disciples will not die. His hearers repeat His words as “never taste of death” and point to Abraham and the prophets in their graves (verse 52). What He means is the life He promised at the pool of Bethesda, where the one who hears and believes “is passed from death unto life” ([[John 5:24]]), the first verse the footnote gives here. The believer already has a life that death cannot reach, and passes through death into a fuller one.

      The revelation the footnote gives for “taste” answers the objection in its own words: “those that die in me shall not taste of death, for it shall be sweet unto them” ([[D&C 42:46]]).
    sources: [ellicott-john, lds-scriptures]
  - ref: 56
    phrase: Your father Abraham rejoiced to see my day
    kind: scripture
    title: Abraham rejoiced to see my day
    body: |
      They have asked whether He is greater than their father Abraham (verse 53). He answers that Abraham himself rejoiced to see His coming, saw it from afar, and was glad, while they reject Him now that He stands among them. “My day” here means His coming on earth, and the Book of Mormon, in a verse the footnote gives, says in plain words that Abraham saw it: “Abraham saw of his coming, and was filled with gladness and did rejoice” ([[Hel. 8:17]]).

      The hearers take Him literally: “Thou art not yet fifty years old, and hast thou seen Abraham?” Fifty is a round number, the age of full manhood. The sense is, you are still a young man, and Abraham has been dead for twenty centuries.
    sources: [ellicott-john, lds-scriptures]
  - ref: 58
    phrase: Before Abraham was, I am.
    kind: christ
    title: Before Abraham was, I am
    body: |
      Jesus answers the question of His age with two verbs. Of Abraham He uses a word for coming into being: before Abraham was born. Of Himself He uses the plain present, *egō eimi*, “I am.” Abraham came to be, and there was a time when he was not. There was never a time when the Son was not.

      The words claim more than great age. The footnote says that this “I Am” in the Greek “is identical with the Septuagint usage in Ex. 3:14 which identifies Jehovah,” and the chapter heading renders the verse “Before Abraham was I, Jehovah.” The name Jehovah denotes “the eternal I Am,” and the Greek phrase is close to the root of the name itself, which comes from the Hebrew verb “to be.” Jehovah, the God of Israel, is the premortal Jesus Christ. The man not yet fifty is He.

      This time His hearers seem to have grasped the claim. They would not accept it, but they sensed that He had made it; the words sounded to them like blasphemy, and they took up stones. The hour of His death had not yet come (verse 20), and He passed through them and out of the temple.
    sources: [greek-nt, ellicott-john, lds-scriptures, bd-jehovah, huntsman-gospel-john, talmage-jesus-christ-25]

christ: |
  The chapter's answer to “Who art thou?” is the name God gave Moses at the bush: the one who sat in the temple teaching was Jehovah, the God of Abraham, come in the flesh. He is the light of the world, and the Son who makes free those who are slaves of sin (verses 12, 34–36).

  That light reaches every person now. It is given “to every man, that he may know good from evil” ([[Moro. 7:16]]), and His teachings and example light the path back to the Father. The freedom He promises does not come by descent or by a moment's belief; it comes to those who continue in His word, and the Son gives it (verses 31, 36).

explore: |
  - **The feast behind the chapter.** “Jesus Christ and the Feast of Tabernacles,” in *Learn of Me*, reads John 7–9 against the feast's booths, lamps, sacrifices and water-drawing.
  - **The name.** [[Ex. 3:13–15]]; [[John 4:26]]; [[John 18:5–6]].
  - **The light of the world again.** [[John 9:5]], where Jesus says it once more and opens the eyes of a man born blind.

