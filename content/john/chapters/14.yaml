chapter: 14
title: I Am the Way, the Truth, and the Life
tagline: On the night of the Last Supper Jesus calms His troubled disciples. He is going to prepare a place for them in His Father's house; He is Himself the way to the Father, who is seen in Him; and He will not leave them orphans, but will send another Comforter and come to them Himself, leaving them His peace.
when: 'The evening of the Last Supper, “before the feast of the passover” ([[John 13:1]]), in the room where Jesus and the Twelve had eaten'

setting: |
  Chapter 14 opens the farewell discourses, the teaching that runs to the end of [[John 16]] and is followed by the prayer of [[John 17]]. John alone records them. The evening began, as [[John 13:1]] says, with Jesus knowing “that his hour was come,” and that verse sets the tone for all five chapters: love and service given with the cross in view.

  The chapter division hides how closely this chapter follows the last. In the closing verses of chapter 13 Jesus has named His betrayer, who has gone out into the night ([[John 13:30]]); He has told the rest, “Whither I go, ye cannot come” ([[John 13:33]]); and He has told Peter that he will deny Him three times before the cock crows ([[John 13:38]]). Through this chapter three of the disciples (Thomas, Philip and the other Judas) break in with questions.

  Chapters 14 and 16 form a pair. Both teach why Jesus must go away, and both meet the disciples' sorrow with the promise of the Comforter and of the Father's peace and love; the allegory of the vine stands between them ([[John 15:1–17]]). In this dispensation the chapter has been read closely: Joseph Smith taught from verses 16–23 the doctrine of the two Comforters, and revelations given through him take up its words ([[D&C 88:3–4]]; [[D&C 130:3]]).

thread: |
  **Jesus is going away, and the whole chapter is His answer to the trouble that causes: where He goes, the disciples will follow, and until then He and His Father will not leave them alone.**

  He begins with a home: “In my Father's house are many mansions … I go to prepare a place for you” (verse 2). He ends the promises with a home as well: the Father and the Son “will come unto him, and make our abode with him” (verse 23). The Greek word behind “mansions” and “abode” is the same, so the dwelling Jesus goes to prepare in heaven and the dwelling He and His Father make with the one who loves Him are put side by side. In between, each question the disciples ask (where, how, show us the Father, why only us) is answered by pointing to Jesus Himself: He is the way, the Father is seen in Him, He will come to them though the world sees Him no more, and the Comforter sent in His name will bring His words to their remembrance.

sections:
  - range: 1-4
    heading: In my Father's house
    plain: |
      “Do not let your hearts be troubled. You believe in God; believe also in me. In my Father's house there are many dwelling places. If it were not so, I would have told you. I am going to prepare a place for you. And if I go and prepare a place for you, I will come again and take you to myself, so that where I am, you may be also. And you know where I am going, and you know the way.”
  - range: 5-14
    heading: Thomas and Philip
    plain: |
      Thomas said to Him, “Lord, we do not know where you are going. How can we know the way?” Jesus said to him, “I am the way, the truth, and the life. No one comes to the Father except through me. If you had known me, you would have known my Father also. From now on you know Him, and you have seen Him.”

      Philip said to Him, “Lord, show us the Father, and that will be enough for us.” Jesus said to him, “Have I been with you all this time, Philip, and you still do not know me? Whoever has seen me has seen the Father. How can you say, ‘Show us the Father’? Do you not believe that I am in the Father and the Father is in me? The words I speak to you I do not speak on my own; it is the Father who dwells in me who does His works. Believe me that I am in the Father and the Father in me; or else believe me because of the works themselves.

      “Truly, truly, I tell you: whoever believes on me will do the works that I do, and he will do greater works than these, because I am going to my Father. Whatever you ask in my name, I will do, so that the Father may be glorified in the Son. If you ask anything in my name, I will do it.”
  - range: 15-26
    heading: Another Comforter
    plain: |
      “If you love me, keep my commandments. And I will pray to the Father, and He will give you another Comforter, to be with you for ever: the Spirit of truth. The world cannot receive Him, because it neither sees Him nor knows Him. But you know Him, because He dwells with you and will be in you. I will not leave you orphans; I will come to you. In a little while the world will see me no more, but you will see me. Because I live, you will live also. On that day you will know that I am in my Father, and you in me, and I in you. Whoever has my commandments and keeps them is the one who loves me. And whoever loves me will be loved by my Father, and I will love him and show myself to him.”

      Judas (not Iscariot) said to Him, “Lord, how is it that you will show yourself to us, and not to the world?” Jesus answered him, “If anyone loves me, he will keep my words, and my Father will love him, and we will come to him and make our home with him. Whoever does not love me does not keep my sayings. And the word you hear is not mine but the Father's who sent me.

      “I have told you these things while I am still with you. But the Comforter, the Holy Ghost, whom the Father will send in my name, will teach you all things and bring to your remembrance everything I have said to you.”
  - range: 27-31
    heading: My peace I give unto you
    plain: |
      “Peace I leave with you; my peace I give to you. I do not give to you as the world gives. Do not let your hearts be troubled, and do not let them be afraid. You heard me say to you, ‘I am going away, and I will come back to you.’ If you loved me, you would rejoice that I am going to the Father, for my Father is greater than I. I have told you now, before it happens, so that when it does happen you may believe.

      “I will not talk with you much longer, for the prince of this world is coming, and he has nothing in me. But so that the world may know that I love the Father, and that I do just as the Father commanded me: get up, let us go from here.”

notes:
  - ref: 1
    phrase: 'Let not your heart be troubled'
    kind: history
    title: Let not your heart be troubled
    body: |
      The trouble Jesus calms comes from what the disciples have just heard, and the break between chapters hides it. In the last minutes of chapter 13 He pointed out His betrayer, announced that He was leaving them, and foretold Peter's denial. Jesus Himself had been troubled as the hour came near ([[John 12:27]]; [[John 13:21]]), and now He reads the same fear in His friends.

      His remedy is faith in Himself. The Greek has the same verb form, *pisteuete*, in both halves of “ye believe in God, believe also in me,” and that form can be a statement or a command. The King James translators read the first as a statement and the second as a command; it reads as naturally as two commands, “Believe in God, believe also in me.” Either way, the trust in God that the disciples already professed is to become trust in the Son who is about to leave them. Verse 27 comes back to the same words once the promises have been made: “Let not your heart be troubled, neither let it be afraid.”
    sources: [ellicott-john, greek-nt]
  - ref: 2
    phrase: 'In my Father’s house are many mansions'
    kind: words
    title: Many mansions
    body: |
      A mansion in 1611 was not a great house but a dwelling, a place to stay. The Greek *monē* comes from the verb *menō*, “abide,” and means “a staying, abiding, dwelling, abode.” Earlier English Bibles had “dwellings”; the King James translators took “mansions” from the Latin Vulgate's *mansiones*, which meant no more than that. John uses the noun only once more, in verse 23, where it is translated “abode”: the Father and the Son “will come unto him, and make our abode with him.” John uses the same word for the dwellings Jesus goes to prepare in His Father's house and for the dwelling He and the Father make with the one who loves Him.

      Latter-day prophets hear more in “many” than room enough for all. Preaching in 1843 against the belief in a single heaven where all are “equally happy,” Joseph Smith set the verse beside Paul's three glories and the man “caught up to the third heaven” ([[1 Cor. 15:40–42]]; [[2 Cor. 12:2]]): “Jesus said their were many mansions in my fathers Kingdom.” [[D&C 76]] describes the three: the celestial, the terrestrial and the telestial. So God's plan offers more than a heaven for the righteous and hell for everyone else; there are “multiple kingdoms—many mansions,” so that each of His children inherits a kingdom whose laws they can abide.
    sources: [thayer, ellicott-john, ehat-cook-words-1843-06-11, oaks-kingdoms-of-glory-2023]
  - ref: 6
    phrase: 'I am the way, the truth, and the life'
    kind: christ
    title: The way, the truth, and the life
    body: |
      Jesus answers Thomas by turning his question from a place to a person. Thomas wants the destination first: “we know not whither thou goest; and how can we know the way?” He may still have thought, as the others did, that the Messiah would reign on earth, and so could not think where this royal house with room for everyone might be. Jesus puts the way first and says that He is it. The “I” is emphatic, and the three words belong together: He is the way by which people come to the Father because the Father is shown to them in Him, and He is Himself the truth and the source of life. The “whither” Thomas could not name is the Father: “no man cometh unto the Father, but by me.” To be with the Father is to be home.
    sources: [ellicott-john]
  - ref: 9
    phrase: 'he that hath seen me hath seen the Father'
    kind: prophets
    title: He that hath seen me hath seen the Father
    body: |
      Philip asks to see the Father, and Jesus answers that he has been seeing Him all along. The words do not erase the difference between the Son and the Father; in this very chapter Jesus prays to the Father (verse 16), goes to Him (verse 12) and calls Him greater (verse 28). They mean that the two are so completely of one heart and mind that to know either is to know both. Had the Father Himself stood among the disciples in the Son's place, He would have done just what the Son did; yet the Father is reached only through the Son (verse 6).

      Latter-day prophets add a second sense. The Son is “the express image” of the Father's person ([[Heb. 1:3]]); so the Father too “is in the form of man,” and it was in that form that the Father and the Son, “as two personages,” appeared to the boy Joseph Smith in the First Vision. Verses 10–11 (“I am in the Father, and the Father in me”) speak of the same unity: the words the Son speaks and the works He does are the Father's. Latter-day Saints believe the Father, the Son and the Holy Ghost to be one “in every significant and eternal aspect imaginable except believing Them to be three persons combined in one substance.”
    sources: [talmage-jesus-christ-33, teachings-joseph-f-smith-37, holland-only-true-god, lds-scriptures]
  - ref: 12
    phrase: 'greater works than these shall he do; because I go unto my Father'
    kind: christ
    title: Greater works than these
    body: |
      The promise comes with its reason: “because I go unto my Father.” Jesus's ministry in the flesh had only hours left. Those who believed on Him would go on with His work, and the unfolding of the Father's plan would call for still greater miracles than His few years among them had seen.

      One reading explains how His going makes the works greater. Once He is at the Father's side, the disciples act for Him on earth as He acts for them in heaven, so their works are His own, done with His power from where He now is. The next verse names the link between the two: “whatsoever ye shall ask in my name, that will I do.”
    sources: [talmage-jesus-christ-33, ellicott-john]
  - ref: 13
    phrase: 'whatsoever ye shall ask in my name, that will I do'
    kind: words
    title: Ask in my name
    body: |
      Here, for the first time, Jesus tells the disciples to pray to the Father in His name. To ask in His name is more than closing a prayer with the words. “We pray in Christ’s name when our mind is the mind of Christ, and our wishes the wishes of Christ.” Then His words abide in us, as He says in the next chapter, and we ask for what God can grant. The promise “I will do it” is made to prayer of that kind, and its purpose is stated with it, “that the Father may be glorified in the Son.” A prayer that springs from selfishness is not in His name at all, however it ends.
    sources: [talmage-jesus-christ-33, bd-prayer]
  - ref: 16
    phrase: 'he shall give you another Comforter'
    kind: words
    title: Another Comforter
    body: |
      The word translated “Comforter” is *paraklētos*, at root “one who is called to someone’s aid”: a helper, an advocate. In John's Gospel it names the Holy Spirit, and verse 26 says so outright: “the Comforter, which is the Holy Ghost.” John's first letter uses the same word of Jesus, where the King James renders it “advocate” ([[1 Jn. 2:1]]). That is why “another” matters. Another Comforter implies a first, and the first is Jesus, who has been the disciples' helper and is about to leave them. The Holy Ghost will come to their side in His absence, and will stay, “that he may abide with you for ever.” Across these chapters He is advocate, teacher, witness and revealer; in this chapter He “shall teach you all things, and bring all things to your remembrance” (verse 26).

      The Lord took up the words again in a latter-day revelation: “I now send upon you another Comforter … even the Holy Spirit of promise; which other Comforter is the same that I promised unto my disciples, as is recorded in the testimony of John” ([[D&C 88:3]]). The revelation does not contradict John 14 but expands it, saying what this Comforter does in a person's progress toward exaltation: He is “the promise … of eternal life” ([[D&C 88:4]]).
    sources: [huntsman-lamb-of-god, ellicott-john, frederick-life-eternal, lds-scriptures]
  - ref: 18
    phrase: 'I will not leave you comfortless'
    kind: words
    title: Comfortless
    body: |
      In English “comfortless” sounds like a play on “Comforter,” but the Greek words are not related. The word is *orphanous*, “orphans,” the word translated “fatherless” in [[James 1:27]]. Jesus has just called the Eleven “little children” ([[John 13:33]]), and He will not leave them bereaved. To be left an orphan is to be left without comfort or the means of life; after His death He will come and be a father to them, and the life He gives is eternal life. How He will come is the subject of verses 19–23 (see the next note).
    sources: [ellicott-john, huntsman-lamb-of-god]
  - ref: 21
    phrase: 'I will love him, and will manifest myself to him'
    kind: prophets
    title: The other Comforter
    body: |
      Joseph Smith taught that verses 16–23 promise two Comforters, and he counted them in the order a disciple receives them: the Holy Ghost first, then the Lord. (Verse 16 counts the other way, calling the Holy Ghost “another” beside Jesus; see the note on verse 16.) In 1839, as Willard Richards reported him, he described the order. A person has faith in Christ, repents, is baptized, and “receives the Holy Ghost (by the laying on of hands) which is the first Comforter.” If he goes on humbling himself before God, “hungering & thirsting after Righteousness,” until the Lord has proved him and his calling and election is made sure, “then it will be his privilige to receive the other Comforter which the Lord hath promised the saints” in this chapter, and he pointed to verses 16, 17, 18, 21 and 23. “Now what is this other Comforter? It is no more or less than the Lord Jesus Christ himself.” Such a person will have the Lord “to attend him or appear unto him from time to time,” and the Lord will show him the Father too; this, Joseph Smith said, is what Isaiah, Ezekiel, John on Patmos and Paul had come to.

      Verse 23 extends the promise to the Father: “we will come unto him, and make our abode with him.” A later revelation says how to read it: “The appearing of the Father and the Son, in that verse, is a personal appearance; and the idea that the Father and the Son dwell in a man’s heart is an old sectarian notion, and is false” ([[D&C 130:3]]). Each time the chapter states the promise it states the condition with it (verses 15, 21, 23): those who love Him keep His commandments.
    sources: [jsp-discourse-1839-comforter, lds-scriptures]
  - ref: 22
    phrase: 'Judas saith unto him, not Iscariot'
    kind: history
    title: Judas, not Iscariot
    body: |
      John adds “not Iscariot” because the other Judas has gone out into the night ([[John 13:30]]) and is no longer with them. This is the apostle Luke lists as “Judas the brother of James” ([[Luke 6:16]]), commonly identified with the “Lebbæus, whose surname was Thaddæus” of [[Matt. 10:3]].

      Judas seems to have been puzzled by a Messiah who would be known only to a chosen few and not to Israel at large, which was not what his people expected. Jesus answers by saying who will have Him: His and the Father's company is given to the faithful, to the one who loves Him and keeps His words (verse 23). Of the one who does not love Him He says only that he “keepeth not my sayings” (verse 24).
    sources: [ellicott-john, talmage-jesus-christ-33, lds-scriptures]
  - ref: 27
    phrase: 'Peace I leave with you, my peace I give unto you'
    kind: words
    title: My peace I give unto you
    body: |
      Jesus takes His leave as people did in His day. “Peace be with you” (*shalom*) was an everyday greeting among the Jews, said when they met and when they parted. He uses it in a higher sense and says what makes the difference: it is “my peace,” and He gives it “not as the world giveth.” The world's peace at a parting is a wish; His is a possession He leaves with them, like a bequest. When He comes back to them from the grave, it is the first word He says ([[John 20:19]]).
    sources: [talmage-jesus-christ-33, ellicott-john]
  - ref: 28
    phrase: 'my Father is greater than I'
    kind: prophets
    title: My Father is greater than I
    body: |
      The disciples should be glad that He goes to the Father, Jesus says, because the Father is greater than He. The saying belongs with the Son's “always deferential subordination to His Father” that runs through His words in the Gospels, from “The Son can do nothing of himself” ([[John 5:19]]) to the prayer of [[John 17]]. Sayings like it are why Latter-day Saints declare it “self-evident from the scriptures that the Father, the Son, and the Holy Ghost are separate persons, three divine beings,” and to say so is not polytheism but “part of the great revelation Jesus came to deliver concerning the nature of divine beings.”

      Verse 28 does not take back verse 9. The Son shows the Father perfectly, and He is going home to a Father who is greater than He.
    sources: [holland-only-true-god]
  - ref: 30
    phrase: 'the prince of this world cometh, and hath nothing in me'
    kind: scripture
    title: The prince of this world
    body: |
      The prince of this world is Satan, whom Jesus has already said would be “cast out” ([[John 12:31]]). Joseph Smith's translation calls him “the prince of darkness” and lengthens the verse: “for the prince of darkness, who is of this world, cometh, but hath no power over me, but he hath power over you.”

      “Hath nothing in me” is best taken to mean that Satan has no claim on Jesus and no foothold in Him. So when Jesus gives Himself up that night, He does it of His own will ([[John 10:18]]). The translation's last clause adds that the adversary does have power over the disciples Jesus is speaking to.
    sources: [lds-scriptures, ellicott-john]
  - ref: 31
    phrase: 'Arise, let us go hence'
    kind: history
    title: Arise, let us go hence
    body: |
      Jesus's call to rise and leave sounds like the end of the evening, yet three more chapters of teaching and prayer follow before John says that Jesus “went forth with his disciples over the brook Cedron” ([[John 18:1]]). Part of the discourse was certainly given in the room where they had eaten; the rest (chapters 15–17) may have been spoken outdoors, as Jesus and the Eleven walked toward the Mount of Olives. John 18:1 can also be read to mean that they left only after the whole discourse and the prayer. John does not settle it, and nothing Jesus said that night depends on where He said it.
    sources: [talmage-jesus-christ-33]

christ: |
  Jesus is the way to the Father because the Father is seen in Him: to know the Son is to know the Father, and no one comes to the Father but by Him. On the night He was leaving His friends He promised them another Comforter, the Holy Ghost, and promised that He would come to them Himself, and the Father with Him.

  Those promises reach a disciple now. In Joseph Smith's teaching, the Holy Ghost given after baptism is the first Comforter, and one who goes on humbling himself and “living by every word of God” may receive the other Comforter, the Lord Himself. The peace He leaves is His own, given “not as the world giveth” (verse 27).

explore: |
  - **The farewell discourses as a whole.** “The Lamb of God: Unique Aspects of the Passion Narrative in John,” in *Behold the Lamb of God*, reads chapters 13–17 together, with chapters 14 and 16 as a pair around the vine of chapter 15.
  - **Joseph Smith on the two Comforters.** The discourse of summer 1839 reported by Willard Richards, pages 19–21, in the Joseph Smith Papers.
  - **The other half of the pair.** [[John 16:7–24]], where the Comforter's coming and the disciples' sorrow return.

