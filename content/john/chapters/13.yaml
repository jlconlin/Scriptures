chapter: 13
title: He Loved Them unto the End
tagline: At supper on His last night, Jesus lays aside His garments and washes the disciples’ feet, Judas’s apparently among them, and bids them do as He has done; He names the betrayer with a morsel, Judas goes out into the night, and Jesus gives the new commandment, to love one another as He has loved them, and warns Peter that he will deny Him three times.
when: 'At supper before the feast of the passover ([[John 13:1–2]]), the night before the Crucifixion'

setting: |
  With chapter 13 John's Gospel turns. The public ministry has closed with Jesus hiding Himself from the crowds ([[John 12:36]]), and the second half of the Gospel begins, often called the Book of Glory, because John presents Jesus's death and resurrection as the means by which He is glorified and glorifies the Father. Chapters 13 to 17 are one evening, the last of His mortal life. The discourses He gives that night are found only in John.

  John tells the supper as no other Gospel does. Matthew, Mark and Luke record the bread and the cup ([[Matt. 26:26–28]]; [[Mark 14:22–24]]; [[Luke 22:19–20]]); John, strikingly, does not, and he records instead the washing of the disciples' feet, which no other Gospel recounts. Luke keeps the teaching that goes with it, Jesus among the Twelve “as he that serveth” ([[Luke 22:27]]). John's timing differs as well: this supper comes “before the feast of the passover” (verse 1), and the note on that verse explains why. The naming of the betrayer and the warning to Peter are told in the other Gospels as well ([[Matt. 26:21–25]]; [[Matt. 26:34]]; [[Luke 22:21–23]]; [[Luke 22:34]]), each in its own way.

thread: |
  **“Having loved his own which were in the world, he loved them unto the end” (verse 1).**

  The opening verse sets the emphasis of the whole farewell, chapters 13 to 17: the loving service of Jesus, given with His coming sacrifice firmly in mind. The chapter shows that love before it names it. The Lord into whose hands the Father has given all things (verse 3) takes a towel and does a servant's work, washes the disciples' feet, Judas's apparently among them, and gives the betrayer a morsel from His own hand. When Judas has gone out into the night, Jesus speaks of His glory, and then gives the commandment that turns what He has done into what they must do: “as I have loved you, that ye also love one another” (verse 34). The “as” points back to the basin and the towel. The chapter ends with Peter's promise to die for Him and Jesus's warning that Peter will deny Him; it is Jesus, not Peter, who is about to lay down His life for the other, and Jesus promises that Peter will follow Him afterward (verse 36).

sections:
  - range: 1-3
    heading: His hour was come
    plain: |
      It was before the feast of the Passover. Jesus knew that His hour had come to leave this world and go to the Father. He had loved His own who were in the world, and He loved them to the end.

      They were at supper. The devil had already put it into the heart of Judas Iscariot, Simon's son, to betray Him. Jesus knew that the Father had given all things into His hands, and that He had come from God and was going to God.
  - range: 4-11
    heading: He washes their feet
    plain: |
      He rose from supper, laid aside His outer garments, took a towel and tied it around Himself. Then He poured water into a basin and began to wash the disciples' feet and to dry them with the towel He had tied around Himself.

      He came to Simon Peter, and Peter said to Him, “Lord, are you going to wash my feet?” Jesus answered, “You do not understand now what I am doing, but you will understand later.” Peter said, “You shall never wash my feet.” Jesus answered, “If I do not wash you, you have no share with me.” Simon Peter said to Him, “Lord, then not my feet only, but my hands and my head too.” Jesus said to him, “Whoever has bathed needs only to wash his feet, and is clean all over. And you are clean, but not all of you.” For He knew who would betray Him; that was why He said, “You are not all clean.”
  - range: 12-20
    heading: I have given you an example
    plain: |
      When He had washed their feet, put His garments back on and taken His place again, He said to them, “Do you understand what I have done to you? You call me Teacher and Lord, and you are right, for that is what I am. If I, then, your Lord and Teacher, have washed your feet, you also ought to wash one another's feet. I have given you an example, so that you should do as I have done to you. Truly, truly, I tell you, a servant is not greater than his master, nor is one who is sent greater than the one who sent him. If you know these things, you are blessed if you do them.

      “I am not speaking of all of you. I know whom I have chosen. But the scripture must be fulfilled: ‘He who eats bread with me has lifted up his heel against me.’ I am telling you now, before it happens, so that when it does happen you may believe that I am He. Truly, truly, I tell you, whoever receives anyone I send receives me, and whoever receives me receives Him who sent me.”
  - range: 21-30
    heading: One of you shall betray me
    plain: |
      When Jesus had said this, He was troubled in spirit, and He testified, “Truly, truly, I tell you, one of you will betray me.” The disciples looked at one another, unsure which of them He meant. One of His disciples, the one whom Jesus loved, was reclining next to Him, close against His chest. Simon Peter signaled to him to ask whom He meant. So that disciple, leaning back against Jesus, asked Him, “Lord, who is it?”

      Jesus answered, “It is the one to whom I give this morsel when I have dipped it.” He dipped the morsel and gave it to Judas Iscariot, the son of Simon. After the morsel, Satan entered into him. Jesus said to him, “What you are going to do, do quickly.” No one at the table knew why He said this to him. Since Judas kept the money bag, some thought Jesus was telling him to buy what they needed for the feast, or to give something to the poor. As soon as he had taken the morsel, Judas went out. And it was night.
  - range: 31-35
    heading: A new commandment
    plain: |
      When he had gone out, Jesus said, “Now the Son of Man is glorified, and God is glorified in Him. If God is glorified in Him, God will also glorify Him in Himself, and will glorify Him at once.

      “Little children, I am with you only a little while longer. You will look for me, and as I said to the Jews, ‘Where I am going, you cannot come,’ so I now say to you. A new commandment I give you: love one another. As I have loved you, so you also are to love one another. By this everyone will know that you are my disciples, if you have love for one another.”
  - range: 36-38
    heading: Peter's denial foretold
    plain: |
      Simon Peter said to Him, “Lord, where are you going?” Jesus answered, “Where I am going you cannot follow me now, but you will follow me later.” Peter said to Him, “Lord, why can I not follow you now? I will lay down my life for you.” Jesus answered, “Will you lay down your life for me? Truly, truly, I tell you, the cock will not crow before you have denied me three times.”

notes:
  - ref: 1
    phrase: Now before the feast of the passover
    kind: history
    title: Before the feast of the passover
    body: |
      John's first words date the supper before the Passover, and he holds to that timing to the end. In Matthew, Mark and Luke the Last Supper is a Passover meal ([[Mark 14:12–17]]). In John the feast begins at sunset after Jesus has died on the cross: the next morning the leaders will not enter Pilate's hall, so that they may still “eat the passover” ([[John 18:28]]), and Jesus is condemned on “the preparation of the passover” ([[John 19:14]]).

      Reconciling the two is not easy, and several explanations are given. Elder James E. Talmage thought it very probable that the “passover” the leaders still meant to eat ([[John 18:28]]) was not the supper at which the lamb was eaten but the Chagigah, a sacrificial meal that followed it, so that John 13 could be the Passover supper after all. Others take one account's timing as shaped for its meaning. The Synoptics may be right, with John moving the Passover to the next evening so that Jesus dies even as the paschal lambs are being sacrificed in the temple. Or John may be right, since an arrest, trial and execution during the festival itself would have been unlikely (the leaders had wanted no arrest on the feast day, [[Mark 14:2]]); the Synoptics would then have moved the Passover's timing to underscore its likeness to the sacrament. A third proposal is that the Passover did fall after the Crucifixion, and Jesus, knowing He would be dead by then, held a symbolic Passover meal with His friends a day early. Whichever is right, John's timing ties Jesus's death to the Passover lamb, and so to his witness that Jesus is the Lamb of God ([[John 1:29]]).
    sources: [huntsman-gospel-john, talmage-jesus-christ-33]
  - ref: 1
    phrase: he loved them unto the end
    kind: words
    title: He loved them unto the end
    body: |
      “Unto the end” is *eis telos*, which can mean “at the last” or, as others read it here, “to the uttermost, completely.” Both senses fit the night. Jesus knows that “his hour was come” (in John He knows all things before they happen, and verses 1 and 3 say what He knew that night), and He sets aside His own growing anguish to spend His last hours serving and strengthening the men He is leaving.
    sources: [thayer, huntsman-gospel-john, holland-loved-unto-end]
  - ref: 2
    phrase: And supper being ended
    kind: words
    title: Supper being ended
    body: |
      The King James “supper being ended” makes the meal sound finished, but what John goes on to tell shows that it was not. Jesus “riseth from supper” to wash their feet (verse 4), takes His place at the table again when He has finished (verse 12), and afterward dips a morsel and gives it to Judas (verse 26). The washing came while they were still at table, not as they arrived.
    sources: [lds-scriptures]
  - ref: 4
    phrase: laid aside his garments
    kind: symbol
    title: He laid aside his garments
    body: |
      John's words for laying aside and taking up His garments are the words Jesus used of laying down and taking up His life. He “laid aside” (*tithēsin*) His outer garments, and afterward “had taken” (*elaben*) them again (verse 12), as He had said, “I lay down my life, that I might take it again” ([[John 10:17]]). The undressing and dressing again is a small picture of the death and resurrection soon to come. In between, with a towel tied about Him, He takes the appearance of a servant and does the lowliest servant's task.

      The scene also answers another one. At Bethany, six days before the Passover, Mary anointed Jesus's feet and wiped them with her hair, and Jesus said she had done it for the day of His burial ([[John 12:1–7]]). Now Jesus washes and dries His disciples' feet with the towel He wears. Both acts stand in the shadow of His death.
    sources: [huntsman-thursday, olson-new-commandment]
  - ref: 5
    phrase: began to wash the disciples’ feet
    kind: history
    title: Why wash their feet?
    body: |
      Washing feet was ordinary; who did it mattered. Guests usually washed their own feet on entering a house; at a special dinner a poor host might do it for them on arrival. Otherwise it was done by servants, by a wife for her husband, or by disciples for their teacher. And Jesus does it not as they arrive but later in the evening, which was unusual and gives the act special attention.

      Why John tells this and not the bread and the cup is a question no verse answers, and two proposals are made. John may have left it out because he had already recorded the sacrament's symbolism in the bread of life discourse: “He that eateth my flesh, and drinketh my blood, dwelleth in me, and I in him” ([[John 6:56]]). Or John kept the imagery of the Passover for the day of the crucifixion, when the Lamb is slain; a sacrament that is above all a remembrance may have mattered less to him until the sacrifice had been made.
    sources: [huntsman-thursday, huntsman-lamb-of-god]
  - ref: 8
    phrase: If I wash thee not, thou hast no part with me
    kind: words
    title: No part with me
    body: |
      Peter objects not to having his feet washed but to who is doing it: the Lord should not stoop to a slave's work for him. Joseph Smith's translation gives his refusal in verse 8 as “Thou needest not to wash my feet.”

      Jesus's reply raises the stakes. “Part” is *meros*, a share or portion, a word that can mean an inheritance; to have no part with Him suggests having no place with Him in the kingdom to come. The washing, then, is not chiefly about clean feet. It is tied to belonging to Him, and Peter, once he hears that, asks for his hands and head as well (verse 9), as if to show his whole commitment.
    sources: [belnap-dust-feet, huntsman-thursday, lds-scriptures]
  - ref: 10
    phrase: He that is washed needeth not save to wash his feet
    kind: words
    title: Bathed, and washed
    body: |
      The King James Version uses “washed” and “wash” for two different Greek verbs: *louō*, to bathe the whole body, and *niptō*, to wash a part of it. A man who has bathed needs only to wash his feet. Christian commentary has often read the first as baptism and the second as the repentance that follows it, and Latter-day Saints may see allusions to other sacred ordinances.

      Joseph Smith's translation makes the verse about hands and head: “He that has washed his hands and his head, needeth not save to wash his feet,” and adds, “Now this was the custom of the Jews under their law; wherefore, Jesus did this that the law might be fulfilled.” Which instruction of the law is meant is not clear. The law did require the priests to wash their hands and feet before they ministered at the tabernacle ([[Ex. 30:19–21]]), but no such rule is recorded for other Israelites beyond the custom of hospitality.

      “Ye are clean, but not all” implies that Judas was among those whose feet Jesus washed. Verse 11 explains the exception: He knew who would betray Him.
    sources: [huntsman-thursday, lds-scriptures, belnap-dust-feet]
  - ref: 14
    phrase: ye also ought to wash one another’s feet
    kind: scripture
    title: Ye also ought to wash one another’s feet
    body: |
      Jesus explains the washing Himself, as an example His disciples are to follow. He accepts the titles they give Him, Teacher and Lord, and draws the conclusion: a servant is not greater than his lord (verse 16), so if their Lord has washed their feet, they ought to wash one another's. The washing is set here as the paramount example of service, the greatest serving the least, the more striking because John has shown so plainly that Jesus is divine.

      The command was also kept as a rite. In 1832 the Lord required those who entered the School of the Prophets to be received “by the ordinance of the washing of feet,” administered by the presiding elder, who “is to gird himself according to the pattern given in the thirteenth chapter of John's testimony concerning me” ([[D&C 88:139–141]]). Joseph Smith taught that the ordinance restored the New Testament practice, “calculated to unite our hearts,” and that it prepared the elders for an endowment of spiritual power.
    sources: [huntsman-lamb-of-god, lds-scriptures, church-history-topics-washing-feet]
  - ref: 19
    phrase: ye may believe that I am he
    kind: christ
    title: That I am he
    body: |
      Jesus tells the Twelve of the betrayal before it happens, and quotes the psalm that foretold it, “He that eateth bread with me hath lifted up his heel against me” (verse 18; see the note on [[Ps. 41:9]]). He wants them, when it comes, to see that He knew beforehand and that the scriptures were fulfilled.

      What they are to believe is that “I am he.” Here too the “he” was supplied by the translators: the Greek has *egō eimi*, “I am,” one of John's “I am” sayings with nothing after it (see the notes on [[John 4:26]] and [[John 8:24]]). Joseph Smith's translation has “the Christ” in place of “he.”
    sources: [huntsman-gospel-john, lds-scriptures]
  - ref: 23
    phrase: leaning on Jesus’ bosom one of his disciples, whom Jesus loved
    kind: history
    title: The disciple whom Jesus loved
    body: |
      The disciple “whom Jesus loved” was reclining next to Jesus. The guests did not sit, as most paintings of the Last Supper show, but reclined around a low, three-sided table, each leaning on his left arm, so a man's head came near the chest of the one beside him. This disciple could lean back against Jesus and ask Him who it was (verse 25).

      This is the first time the Gospel speaks of a disciple “whom Jesus loved,” and it never gives his name. Latter-day Saints know him as John, the son of Zebedee, the Gospel's own author, who refers to himself this way here and in [[John 19:26]], [[John 20:2]] and [[John 21:7, 20]]. Latter-day revelation makes the identification: the revelation given when Joseph Smith and Oliver Cowdery asked about the fate of the Apostle John ([[D&C 7:1–3]]) equates him with the disciple whom Jesus loved of [[John 21:20–23]], and there the Lord calls him “John, my beloved.” (How his witness came to be written down is taken up in the note on [[John 21:24]].) John describes his place in the words he used of Jesus Himself: he rests in the bosom of Jesus, as Jesus is “in the bosom of the Father” ([[John 1:18]]). He can serve as the ideal disciple, a model each reader may aspire to.
    sources: [olson-new-commandment, ellicott-john, huntsman-thursday, bd-john, lds-scriptures]
  - ref: 27
    phrase: And after the sop Satan entered into him
    kind: history
    title: Satan entered into him
    body: |
      John tells Judas's fall in two steps. Before the washing, the devil had already put the betrayal into his heart (verse 2); only after the morsel does John write that “Satan entered into him.” What moved Judas, John does not say beyond the devil's prompting. Joseph Smith's translation of Mark gives a reason from Judas's own side: he went to the chief priests “for he turned away from him, and was offended because of his words” ([[Mark 14:10]], footnote). The emphasis of that addition is not on money but on Judas's apostasy.

      The morsel (“sop”) was the sign Jesus had given the beloved disciple: “He it is, to whom I shall give a sop, when I have dipped it” (verse 26). Yet “no man at the table knew” why He then spoke to Judas as He did; since Judas kept the bag, some supposed he was being sent to buy for the feast or to give to the poor (verses 28–29). “That thou doest, do quickly” uses a comparative in Greek, *tachion*, “more quickly,” which one lexicon takes to mean sooner than Judas seemed to have resolved.
    sources: [lds-scriptures, jackson-shedding-light, thayer]
  - ref: 30
    phrase: and it was night
    kind: symbol
    title: And it was night
    body: |
      The words record the hour: when Judas went out, it was night. But night can carry more than the time in John's Gospel, where light and darkness are among the great contrasts through which its themes are told. Nicodemus “at the first came to Jesus by night” ([[John 19:39]]; [[John 3:2]]), and at the burial he comes into the light as one who loved Jesus. The verse need not mean more than the hour, but one reading hears the same weight here: Judas steps out of the presence of the Light of the World into the dark, and the words recall Jesus's saying, “If a man walk in the night, he stumbleth, because there is no light in him” ([[John 11:10]]).
    sources: [lds-scriptures, huntsman-gospel-john, huntsman-lamb-of-god, ellicott-john]
  - ref: 31
    phrase: Now is the Son of man glorified
    kind: christ
    title: Now is the Son of man glorified
    body: |
      The moment Judas is gone, Jesus speaks of glory. The betrayer's going out means His death is at hand, and in John that death, with the resurrection that follows it, is the means by which Jesus is glorified and glorifies the Father. So He speaks of the glory as already present, “Now is the Son of man glorified,” and then of what is still to come (verse 32): God “shall straightway glorify him.”
    sources: [ellicott-john, huntsman-gospel-john]
  - ref: 34
    phrase: A new commandment I give unto you
    kind: scripture
    title: A new commandment
    body: |
      The commandment to love one another is new even though Jesus had taught love from the beginning, and the law already commanded, “thou shalt love thy neighbour as thyself” ([[Lev. 19:18]]). What is new is the standard. The old commandment measured love by oneself: as thyself. The new one measures it by the Lord: “as I have loved you.” The “as” points to what He had just done; the washing of their feet is the example in front of them.

      John himself later called the commandment both old and new: old because they had it “from the beginning,” and new because it “is true in him and in you: because the darkness is past, and the true light now shineth” ([[1 Jn. 2:7–8]]). The Lord is that “true light,” the commandment lived out in a person, so the newness lies in Him. The commandment is also pointed: it names love for one another, not only for mankind in general, and that love is what will show the world whose disciples they are (verse 35).
    sources: [yarn-night-before, ellicott-john]
  - ref: 36
    phrase: thou shalt follow me afterwards
    kind: scripture
    title: Thou shalt follow me afterwards
    body: |
      Peter's first response here is not a boast but what seems a genuine question: where are you going, and why can I not come? Jesus does not answer where; He says only that Peter cannot follow now, but will afterward. Peter would in time follow his Master even to death. After the Resurrection Jesus told him how he would die, “signifying by what death he should glorify God,” and then said to him, “Follow me” ([[John 21:18–19]]).
    sources: [huntsman-peters-denial, lds-scriptures]
  - ref: 38
    phrase: The cock shall not crow, till thou hast denied me thrice
    kind: words
    title: Till thou hast denied me thrice
    body: |
      Peter's “I will lay down my life for thy sake” (verse 37) seems deliberately to echo the good shepherd's words, “the good shepherd giveth his life for the sheep” ([[John 10:11]]). Jesus turns them back on him as a question. Peter is not yet ready to die for Jesus, as the night will show; it is Jesus who is about to lay down His life for Peter.

      Some Latter-day Saints have read Jesus's words in Matthew, “thou shalt deny me thrice” ([[Matt. 26:34]]), as an instruction, so that Peter could escape arrest that night and survive to lead the Church. John's wording leaves no room for that reading. It has a main clause, “The cock shall not crow,” made emphatic in Greek with a double negative, and the denial comes only in a clause of time, “till thou hast denied me,” which says when the cock will crow, not what Peter must do. Jesus is foretelling what Peter will do, not telling him to do it. The fulfillment is in [[John 18:15–27]].
    sources: [huntsman-peters-denial]

christ: |
  The chapter shows Jesus knowing that the Father had given all things into His hands, and using those hands to wash His disciples' feet: the greatest serving the least, on the night before He laid down His life. The Lamb who is about to be sacrificed is the servant at the basin, and the new commandment asks His disciples to love one another as He has loved them.

  His love did not run out that night and does not now; Elder Jeffrey R. Holland testified that “having loved us who are in the world, Christ loves us to the end. His pure love never fails us.” By His own word the mark of His disciples is the same love shown to one another (verse 35).

explore: |
  - **The foot washing and the farewell.** “A New Commandment,” in *His Majesty and Mission*, reads the foot washing in John 13 with the vine of [[John 15]] and the prayer of [[John 17]].
  - **Hospitality in John 13–17.** “Those Who Receive You Not,” in *By Our Rites of Worship*, reads the washing as a rite of hospitality, with guest, host and servant underlying the whole discourse.
  - **The commandment lived.** [[John 15:12–13]]; [[1 Jn. 3:16–18]].

