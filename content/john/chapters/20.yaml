chapter: 20
title: My Lord and My God
tagline: On the first day of the week Mary Magdalene finds the tomb open, Peter and the beloved disciple find the grave clothes, and the risen Lord calls Mary by name; that evening He shows His wounds to the disciples, breathes on them and sends them, and a week later Thomas, who would not believe without seeing, confesses Him Lord and God.
when: 'At the tomb and in Jerusalem on the first day of the week after the crucifixion ([[John 20:1]], [[John 20:19]]), and a week later ([[John 20:26]])'

setting: |
  Jesus was laid in a new tomb in a garden near the place of crucifixion, in haste, because the Sabbath was coming ([[John 19:41–42]]). Chapter 20 begins at that tomb on the first day of the week, while it is still dark, and ends a week later in a closed room in Jerusalem.

  Matthew, Mark and Luke also tell of the empty tomb and the first appearances of the risen Lord ([[Matt. 28]]; [[Mark 16]]; [[Luke 24]]), but John's account differs from theirs enough to be read on its own. In John, Mary Magdalene comes to the tomb alone, and her meeting with the risen Lord is told nowhere else in full. John often builds a scene around one person who stands for a group, or who serves as a type of others, the Gospel's later readers among them. The story of Thomas is John's alone. “The other disciple, whom Jesus loved” (verse 2) is John himself, the Gospel's own witness.

  The chapter ends with a statement of why the book was written (verses 30–31). It reads like the close of the Gospel, and chapter 21 takes up a story that seemed to have ended there.

thread: |
  **Each witness in this chapter sees something, and the chapter asks what the seeing leads to.**

  The other disciple sees the grave clothes lying in order and believes, though he has not yet seen the Lord (verse 8). Mary sees Jesus and does not know Him until He calls her by name (verses 14–16): seeing Him is not yet knowing Him. The disciples behind shut doors see His hands and side and are glad (verse 20). Thomas will not believe unless he sees and touches, and when Jesus stands before him and invites him to do both, he answers with one of the strongest confessions in the Gospel (verses 27–28). John's figures are real people and real witnesses, and they are also types of the ways people respond to the news that He lives.

  Then Jesus turns from those who saw to those who will not: “blessed are they that have not seen, and yet have believed” (verse 29). The last two verses say what the witness is for. Its readers will not see what Thomas saw. The apostles' witness is written down so that they may believe, and believing have life (verse 31).

sections:
  - range: 1-10
    heading: The empty tomb
    plain: |
      Early on the first day of the week, while it was still dark, Mary Magdalene came to the tomb and saw that the stone had been taken away from it. So she ran to Simon Peter and to the other disciple, the one Jesus loved, and told them, “They have taken the Lord out of the tomb, and we don't know where they have laid him.”

      Peter and the other disciple set out for the tomb. The two ran together, but the other disciple outran Peter and reached the tomb first. He stooped and looked in and saw the linen cloths lying there, but he did not go in. Then Simon Peter came after him and went into the tomb. He saw the linen cloths lying there, and the cloth that had been around Jesus's head, not lying with the linen cloths but wrapped up in a place by itself. Then the other disciple, who had reached the tomb first, went in too, and he saw and believed. For as yet they did not understand the scripture that He must rise from the dead. Then the disciples went back to their homes.
  - range: 11-18
    heading: Mary Magdalene
    plain: |
      But Mary stood outside the tomb weeping. As she wept she stooped and looked into the tomb, and saw two angels in white sitting where the body of Jesus had lain, one at the head and one at the feet. They said to her, “Woman, why are you weeping?” She said, “Because they have taken away my Lord, and I don't know where they have laid him.”

      When she had said this, she turned around and saw Jesus standing there, but she did not know that it was Jesus. Jesus said to her, “Woman, why are you weeping? Whom are you looking for?” Thinking He was the gardener, she said, “Sir, if you have carried him away, tell me where you have laid him, and I will take him away.” Jesus said to her, “Mary.” She turned and said to Him, “Rabboni!” which means Teacher. Jesus said to her, “Do not hold on to me, for I have not yet ascended to my Father. But go to my brethren and tell them, ‘I am ascending to my Father and your Father, to my God and your God.’” Mary Magdalene went and told the disciples that she had seen the Lord, and that He had said these things to her.
  - range: 19-23
    heading: Behind shut doors
    plain: |
      On the evening of that same day, the first day of the week, the disciples were gathered with the doors shut, for fear of the Jews. Jesus came and stood among them and said, “Peace be with you.” When He had said this, He showed them His hands and His side, and the disciples were glad when they saw the Lord.

      Jesus said to them again, “Peace be with you. As my Father has sent me, so I send you.” When He had said this, He breathed on them and said to them, “Receive the Holy Ghost. If you remit anyone's sins, they are remitted; if you retain anyone's sins, they are retained.”
  - range: 24-29
    heading: Thomas
    plain: |
      But Thomas, one of the Twelve, who was called Didymus, was not with them when Jesus came. So the other disciples told him, “We have seen the Lord.” But he said to them, “Unless I see the marks of the nails in his hands, and put my finger into the marks of the nails, and put my hand into his side, I will not believe.”

      Eight days later His disciples were inside again, and Thomas was with them. Jesus came, though the doors were shut, stood among them, and said, “Peace be with you.” Then He said to Thomas, “Put your finger here, and look at my hands; reach out your hand and put it into my side. Do not be faithless, but believing.” Thomas answered Him, “My Lord and my God!” Jesus said to him, “Thomas, you have believed because you have seen me. Blessed are those who have not seen and yet have believed.”
  - range: 30-31
    heading: That ye might believe
    plain: |
      Jesus did many other signs in the presence of His disciples that are not written in this book. But these are written so that you may believe that Jesus is the Christ, the Son of God, and that by believing you may have life through His name.

notes:
  - ref: 2
    phrase: the other disciple, whom Jesus loved
    kind: history
    title: The other disciple, whom Jesus loved
    body: |
      The disciple who runs to the tomb with Peter is John, the son of Zebedee, who in his own Gospel calls himself “the disciple whom Jesus loved” and “that other disciple” (see the note on [[John 13:23]]). This is the third time he appears so. He lay close to Jesus at the supper, he stood at the cross ([[John 19:26]]), and now he is among the first at the empty tomb.

      Mary's report is in the plural: “*we* know not where they have laid him.” It could mean that she had come with other women, as the other Gospels say she did ([[Luke 24:10]]). As often in John, one figure stands at the center of the scene for a group, and he tells the morning through Mary alone.
    sources: [bd-john, huntsman-easter-sunday]
  - ref: 7
    phrase: the napkin, that was about his head, not lying with the linen clothes, but wrapped together in a place by itself
    kind: history
    title: The grave clothes left in order
    body: |
      What the two disciples found was not only an empty tomb but the grave clothes left behind: the linen wrappings lying there, and the cloth for the face (*soudarion*, the King James “napkin”) “wrapped together in a place by itself.” Their careful placement seems to have convinced the two disciples that the body had not been stolen, since robbers would hardly have stopped to unwrap the body and then fold the face cloth and lay it aside. That the cloth was folded is the kind of detail an eyewitness remembers.

      The face cloth also points back to Lazarus, who came out of his tomb “bound hand and foot with graveclothes: and his face was bound about with a napkin” ([[John 11:44]]). Lazarus was raised to mortal life and would need grave clothes again. Jesus left His behind, because He would never die again.
    sources: [huntsman-easter-sunday, ellicott-john]
  - ref: 8
    phrase: he saw, and believed
    kind: scripture
    title: He saw, and believed
    body: |
      The beloved disciple is the one at the tomb who grasps what it means, and he believes before he has seen the risen Lord. What he saw was an empty tomb and grave clothes with no body in them. Verse 9 explains why that was a turning point. Until that morning the disciples had not understood the scripture that foretold the Resurrection; now, in the absent body, he recognized the truth it had foretold, that He must rise from the dead. John had said the same of an earlier saying of Jesus, “in three days I will raise it up”: only “when therefore he was risen from the dead” did the disciples remember it, and they “believed the scripture, and the word which Jesus had said” ([[John 2:19–22]]).

      Peter's response is not told here. Luke and Paul show that he went on pondering until the Lord appeared to him ([[Luke 24:34]]; [[1 Cor. 15:5]]). The beloved disciple becomes the pattern for those who come later: he had not seen the Lord, yet he believed, which is what the Lord will ask of others (verse 29).
    sources: [ellicott-john, huntsman-easter-sunday, draper-he-has-risen]
  - ref: 16
    phrase: Jesus saith unto her, Mary.
    kind: christ
    title: Called by name
    body: |
      Mary sees Jesus and does not know Him. John gives no reason, and several have been suggested: the dim light of early morning, eyes full of tears, or something different about the risen body, since others also fail at first to know Him ([[Luke 24:16]]; [[John 21:4]]). She was looking for a body, and she took the man near the tomb to be the gardener.

      One word changes everything. When He calls her by name she knows Him at once, turns to Him, and answers with His title, “Rabboni,” “Master” or “Teacher.” It is what Jesus had said of His sheep: “he calleth his own sheep by name”; “My sheep hear my voice, and I know them, and they follow me” ([[John 10:3]]; [[John 10:27]]).
    sources: [huntsman-easter-sunday, pierce-recognizing-christ]
  - ref: 17
    phrase: Touch me not
    kind: words
    title: Hold me not
    body: |
      “Touch me not” sounds as if Mary must not lay a hand on Him at all. That would sit oddly beside verse 27, where Jesus tells Thomas to touch His wounds, and beside Matthew, where the women “held him by the feet” ([[Matt. 28:9]]). Joseph Smith's translation reads “Hold me not,” and the Greek bears it out. The verb (*haptomai*) means to fasten oneself to, to cling to, and its form here, a command about an action already under way, suggests that He is asking her to stop what she has begun: in effect, “Stop clinging to me.” Mary seems already to have fallen at His feet and taken hold of Him.

      The reason He gives, “for I am not yet ascended to my Father,” has been read in more than one way, and the verse does not settle which is right. In one reading He will be with the disciples only a short while before He goes to the Father, and Mary must not try to hold Him back; she has her own work to do, beginning with the message He gives her. In another, He would not always be with her in the body to cling to as her teacher, but would be present to her by the Spirit as she grew in understanding herself. A third takes the second clause as the reason for the first: no one was to touch the risen body until He had presented Himself to the Father, and it is “reasonable and probable” that He ascended and returned before the other women held Him by the feet (see the note on [[Matt. 28:9]]). Whichever is right, the verse lays down no rule about touching a resurrected being. A week later Thomas is told to reach out his hand.
    sources: [lds-scriptures, thayer, huntsman-easter-sunday, pierce-recognizing-christ, talmage-jesus-christ-37]
  - ref: 17
    phrase: I ascend unto my Father, and your Father; and to my God, and your God
    kind: christ
    title: My Father, and your Father
    body: |
      Risen, Jesus calls the disciples “my brethren,” and from the risen Lord the word declares that He still shares their nature. He does not say “our Father,” as though He and they stood alike. He says “my Father, and your Father.” Because God is His Father, He is theirs as well, and they are His brethren. His victory over death opens the way for them.

      Mary carries the message at once: “she had seen the Lord” (verse 18). The verb John uses for her telling is the word for a solemn proclamation, and that, with her eyewitness testimony, earned her the traditional title “apostle to the apostles.” At a time when a woman's testimony was generally distrusted in legal settings, the risen Lord appeared first to Mary Magdalene ([[Mark 16:9]]) and sent her to the apostles.
    sources: [ellicott-john, huntsman-easter-sunday]
  - ref: 19
    phrase: when the doors were shut where the disciples were assembled for fear of the Jews
    kind: history
    title: The doors were shut
    body: |
      “The Jews” whom the disciples feared were the Jewish authorities; the disciples, Jews themselves, had gathered in secret. John mentions the shut doors twice (verses 19 and 26): Jesus came and stood among them while the doors were shut.

      The next verse shows that He came with a real body, so the shut doors seem to say something about what a resurrected body can do, something like what Joseph Smith reports of the resurrected Moroni, who came into his room and left it the same way. When Moroni left, Joseph saw “a conduit open right up into heaven, and he ascended till he entirely disappeared” ([[JS—H 1:43]]).
    sources: [huntsman-easter-sunday, bowen-our-hands-have-handled, lds-scriptures]
  - ref: 20
    phrase: he shewed unto them his hands and his side
    kind: christ
    title: His hands and his side
    body: |
      After His greeting, the first thing the risen Lord does is show His wounds. The disciples feared that they were seeing a spirit, as Luke tells it ([[Luke 24:37–39]]), and the hands and side answer the fear: this is the same Jesus who was crucified, risen with a body. John does not say here that they handled them, though the showing implies it and Thomas's demand (verse 25) suggests they had; he saves his most exact words for Thomas (verse 27). The wounds are also tokens of His death, signs that He had in fact finished His atoning sacrifice.

      The Lord did the same at Bountiful, and there He gave the reason in His own words: “that ye may know that I am the God of Israel, and the God of the whole earth, and have been slain for the sins of the world” ([[3 Ne. 11:14]]). The multitude went forward one by one to feel the prints of the nails, and bore record “that it was he, of whom it was written by the prophets, that should come” ([[3 Ne. 11:15]]).
    sources: [bowen-our-hands-have-handled, huntsman-easter-sunday, lds-scriptures]
  - ref: 22
    phrase: he breathed on them, and saith unto them, Receive ye the Holy Ghost
    kind: scripture
    title: Receive ye the Holy Ghost
    body: |
      Earlier John said that “the Holy Ghost was not yet given; because that Jesus was not yet glorified,” and the Joseph Smith Translation turned the absence into a promise: the Holy Ghost “was promised unto them who believe, after that Jesus was glorified” (see the note on [[John 7:39]]). Now He is risen, and He gives what was promised. Elder Harold B. Lee taught that the breathing and the words “in all likelihood” were “the confirmation and the commission to receive the Holy Ghost, or the baptism of the Spirit, by the laying on of hands,” since that was how His disciples gave the gift afterward. The Holy Ghost then came upon them with power at Pentecost ([[Acts 2:1–4]]): what began in this room was accomplished there.

      The act itself recalls the Creation. The word John uses for “breathed” occurs nowhere else in the New Testament, but it is the word of the Greek Old Testament where God “breathed into his nostrils the breath of life; and man became a living soul” ([[Gen. 2:7]]). One reading sees a symbolic re-creation: as Adam was given life by God's breath, the disciples are made new creatures in Christ.
    sources: [lee-cr-1955-04, huntsman-easter-sunday, ellicott-john, lds-scriptures]
  - ref: 23
    phrase: Whose soever sins ye remit, they are remitted unto them
    kind: prophets
    title: Whose soever sins ye remit
    body: |
      The power Jesus gives here depends on the two things He has just said: they are sent as He was sent (verse 21), and they receive the Holy Ghost (verse 22). It belongs with the power of the keys He had promised Peter, to bind and to loose ([[Matt. 16:19]]). It works through the ordinances, as Lorenzo Snow taught: everyone who came “in humility, sincerely repenting of his sins,” and was baptized by the apostles had his sins forgiven “through the atoning blood of Jesus Christ” and received the Holy Ghost by the laying on of hands; those who refused what the apostles offered kept their sins. The blessings follow only when the ordinances are administered by “one who is actually sent of God.”

      In this dispensation the Lord gave Joseph Smith the same power in nearly the same words: “whosesoever sins you remit on earth shall be remitted eternally in the heavens; and whosesoever sins you retain on earth shall be retained in heaven” ([[D&C 132:46]]). Lorenzo Snow bore witness that an angel had restored “the priesthood,—the keys of the kingdom.”
    sources: [ellicott-john, ttp-lorenzo-snow-2, lds-scriptures]
  - ref: 25
    phrase: Except I shall see in his hands the print of the nails
    kind: history
    title: Except I shall see
    body: |
      Thomas (the name means “twin,” which is what the Greek *Didymus* means too) was absent when Jesus came, and the witness of his friends did not move him. He sets his own terms: he must see the nail prints, put his finger in them, and thrust his hand into the side. The terms seem to suggest that the others had done more than see Jesus; as in Luke, they had touched Him.

      Thomas should be judged with caution and charity. Earlier in the Gospel he was ready to go and die with Jesus ([[John 11:16]]), and his honest question drew out “I am the way” ([[John 14:5–6]]). He could hardly have doubted the empty tomb or the honesty of the others. What he seems to have balked at was a resurrection of the body, a Lord of flesh and bones who could be seen and handled. He was also an apostle, to be sent into the world as a witness that Jesus had died for the sins of the world and now lived, and he may have wanted the same sure witness his fellows had received.
    sources: [bd-thomas, huntsman-easter-sunday, talmage-jesus-christ-37]
  - ref: 28
    phrase: My Lord and my God
    kind: christ
    title: My Lord and my God
    body: |
      Thomas, who demanded the most proof, makes one of the strongest confessions in the Gospel. He speaks to Jesus, and he calls Him not only Lord but God; the words are a confession that his Lord is also God, not an exclamation addressed to heaven. “My Lord and my God” is the Greek Old Testament's standard rendering of the Hebrew *YHWH ʾĔlōhāy*, the LORD my God, so Thomas in effect testifies that Jesus is Jehovah, the God of Israel. His words close the circle the Gospel opened in its first verse, “the Word was God” ([[John 1:1]]).

      They also answer his own question at the supper. “How can we know the way?” he had asked, and Jesus had said, “If ye had known me, ye should have known my Father also” ([[John 14:5–7]]). Now Thomas knows Him. Jesus accepts the worship.
    sources: [huntsman-easter-sunday, ellicott-john, bowen-our-hands-have-handled, talmage-jesus-christ-37]
  - ref: 29
    phrase: blessed are they that have not seen, and yet have believed
    kind: christ
    title: Blessed are they that have not seen
    body: |
      Jesus's answer to Thomas is, if a rebuke at all, a gentle one. He does not say that those who believe without seeing will be more fortunate than Thomas, only that they too are blessed. The words look past the room to everyone after it, who will have to believe in the Resurrection on the testimony of those who saw, not by touching the wounds. The beloved disciple had already believed that way (verse 8).

      At Bountiful the Lord put it more strongly. Those who believed after seeing Him were blessed, “and again, more blessed are they who shall believe in your words because that ye shall testify that ye have seen me, and that ye know that I am” ([[3 Ne. 12:1–2]]). One Latter-day Saint reading finds the reason in agency: by not compelling belief, the Lord leaves room for choice and for faith, and the faith a person chooses is what brings God and Christ into a life and changes it.
    sources: [huntsman-easter-sunday, draper-he-has-risen, wilcox-be-not-faithless, lds-scriptures]
  - ref: 31
    phrase: that ye might believe that Jesus is the Christ, the Son of God
    kind: words
    title: That ye might believe
    body: |
      These two verses read like the end of the book, and they say why it was written. Jesus did many other signs; John chose these so that his readers might believe that Jesus is the Christ, the Son of God, and have life through His name. The apostles' faith has grown step by step until it reached its height in Thomas's confession, and here the writer states his purpose.

      The best manuscripts differ in the form of the verb. Some read *hina pisteusēte*, “that you may believe,” which the King James “that ye might believe” renders. Others read *hina pisteuēte*, “that you may continue to believe.” Either way, the book serves both readers: it can bring someone to Christ for the first time, and it deepens the faith of those who already believe.
    sources: [ellicott-john, huntsman-easter-sunday]

christ: |
  The risen Lord of this chapter is the Jesus who was crucified. He bears the wounds in His hands and side, calls Mary by name, greets His frightened disciples with peace, and sends them as the Father sent Him. Thomas gives Him the name the Gospel gave Him in its first verse: Lord and God ([[John 1:1]]; [[John 20:28]]).

  After that room, others would believe in the Resurrection on the testimony of those who saw, not by touching the wounds, and the Lord calls such believers blessed ([[John 20:29]]); at Bountiful He called those who believe the words of His witnesses “more blessed” ([[3 Ne. 12:2]]). The written witness stands in place of the sight, so that those who believe may have life through His name ([[John 20:31]]).

explore: |
  - **From seeing to knowing.** “Seeing, Knowing, and Recognizing the True Identity of Christ,” in *He Was Seen: Witnessing the Risen Christ*, follows Mary Magdalene and the disciples on the road to Emmaus from seeing the risen Lord to recognizing Him.
  - **A body that was handled.** “‘Our Hands Have Handled’: Ensuring the Reassuring Doctrine of the Resurrection in the Lucan and Johannine Writings,” in *Interpreter*, reads John 20 and Luke 24 with [[1 Jn. 1:1]] as witnesses of the bodily resurrection.
  - **The epilogue.** [[John 21]], which takes up the story again by the Sea of Galilee.

