chapter: 4
title: The Saviour of the World
tagline: On the road from Judea to Galilee Jesus asks a Samaritan woman for a drink, offers her living water and tells her plainly who He is; her town comes out to hear Him, and back in Cana a king’s officer believes His word and his son lives.
when: 'Early in the ministry, after the first Passover in Jerusalem ([[John 2:13]]); in this site’s chronology, the Ministry to the Samaritans and the beginning of the Second Ministry in Galilee'

setting: |
  Chapter 4 closes the first part of John’s Gospel, which opens and ends at Cana in Galilee: the water made wine ([[John 2:1–11]]) and the nobleman’s son are its two signs, and between them come the temple, Nicodemus and the woman at the well. Its theme is newness, the new life Jesus came to bring. Two long conversations stand at its center, set as dialogues: personal conversations with Jesus that a reader can identify with. The woman of Samaria is Nicodemus’s mirror image: he was a man, a ruler of the Jews, who came to Jesus by night; she is a woman of a despised people, met at noon, and this time Jesus begins.

  The Samaritans, whose land lay on the road from Judea to Galilee (verses 3–4), were descendants both of the colonists the kings of Assyria and Babylon settled there and of Israelites left behind when the northern kingdom fell. The hostility between them and the Jews runs through the chapter: what the woman says to Jesus, what the disciples marvel at, and what her townsmen finally call Him.

  The Joseph Smith Translation changes the chapter at its first verses, at “God is a Spirit” (verse 24) and at the harvest (verse 38); the notes take each where the reader would ask. The woman at the well, the nobleman’s son and the harvest in Samaria are told only by John. The return to Galilee (verses 43–45) is the point at which the other Gospels begin Jesus’s Galilean ministry.

thread: |
  **Coming to see who He is.**

  Every scene in the chapter turns on recognizing Jesus. The woman first sees only “a Jew” (verse 9), which to her means an enemy. Then He is “Sir,” someone who may be greater than Jacob (verse 12), then “a prophet” (verse 19), then perhaps “the Christ” (verse 29). Jesus Himself has already declared, “I that speak unto thee am he” (verse 26). Her townsmen believe first because of what she tells them, then because they have heard Him themselves, and they give Him the title that ends their story: “the Saviour of the world” (verse 42).

  The same growth of faith comes again in the last scene. The king’s officer comes asking for a miracle; Jesus answers that “except ye see signs and wonders, ye will not believe”; the man takes Jesus at His word and goes home, and when he learns the hour, he and his whole house believe. The Samaritans believed without a miracle, first for the woman’s word and then for His own. The Galilean officer believed the word before he saw the sign.

sections:
  - range: 1-4
    heading: He must needs go through Samaria
    plain: |
      The Pharisees heard that Jesus was making and baptizing more disciples than John (though Jesus Himself did not baptize; His disciples did). When the Lord knew of it, He left Judea and went back to Galilee. And He had to go through Samaria.
  - range: 5-15
    heading: Living water
    plain: |
      So He came to a Samaritan town called Sychar, near the plot of land Jacob gave his son Joseph. Jacob’s well was there, and Jesus, tired from the journey, sat down by the well. It was about noon.

      A Samaritan woman came to draw water, and Jesus said to her, “Give me a drink.” (His disciples had gone into the town to buy food.) The woman said to Him, “How is it that you, a Jew, ask a drink of me, a Samaritan woman?” For Jews and Samaritans do not get along.

      Jesus answered, “If you knew the gift of God, and who it is that is saying to you, ‘Give me a drink,’ you would have asked him, and he would have given you living water.”

      “Sir,” the woman said, “you have nothing to draw with, and the well is deep. Where do you get that living water? Are you greater than our father Jacob, who gave us the well and drank from it himself, with his sons and his cattle?”

      Jesus answered, “Everyone who drinks this water will be thirsty again. But whoever drinks the water I give him will never thirst. The water I give him will become in him a spring of water welling up to eternal life.”

      The woman said, “Sir, give me this water, so that I won’t be thirsty or have to keep coming here to draw.”
  - range: 16-26
    heading: In spirit and in truth
    plain: |
      He said to her, “Go, call your husband, and come back.” “I have no husband,” she answered. Jesus said, “You are right to say you have no husband, for you have had five husbands, and the man you have now is not your husband. What you said is true.”

      “Sir,” the woman said, “I see that you are a prophet. Our fathers worshipped on this mountain, but you Jews say that Jerusalem is the place where people ought to worship.”

      Jesus said to her, “Woman, believe me, the time is coming when you will worship the Father neither on this mountain nor in Jerusalem. You worship what you do not know; we worship what we know, for salvation comes from the Jews. But the time is coming, and is already here, when the true worshippers will worship the Father in spirit and in truth, for the Father is seeking such people to worship Him. God is a Spirit, and those who worship Him must worship in spirit and in truth.”

      The woman said, “I know that the Messiah is coming, the one called Christ. When he comes, he will tell us everything.” Jesus said to her, “I am he, the one speaking to you.”
  - range: 27-38
    heading: Fields white to harvest
    plain: |
      Just then His disciples came back. They were surprised to find Him talking with a woman, but none of them asked, “What do you want?” or, “Why are you talking with her?”

      The woman left her water jar, went back into the town and said to the people, “Come, see a man who told me everything I ever did. Could this be the Christ?” They came out of the town and made their way toward Him.

      Meanwhile the disciples urged Him, “Master, eat.” But He said, “I have food to eat that you do not know about.” The disciples said to one another, “Has someone brought Him something to eat?” Jesus said, “My food is to do the will of Him who sent me and to finish His work. Don’t you say, ‘Four more months and then the harvest’? I tell you, look up and see the fields: they are already white for harvest. The reaper receives wages and gathers a crop for eternal life, so that the sower and the reaper may rejoice together. Here the saying holds true, ‘One sows and another reaps.’ I sent you to reap what you did not work for. Others have done the hard work, and you have entered into their labor.”
  - range: 39-42
    heading: The Saviour of the world
    plain: |
      Many Samaritans from that town believed in Him because of the woman’s testimony, “He told me everything I ever did.” So when the Samaritans came to Him, they asked Him to stay with them, and He stayed two days. And many more believed because of His own word. They said to the woman, “We no longer believe just because of what you said; we have heard for ourselves, and we know that this man really is the Christ, the Savior of the world.”
  - range: 43-45
    heading: Received in Galilee
    plain: |
      After the two days He left for Galilee. For Jesus Himself had declared that a prophet has no honor in his own country. When He arrived in Galilee, the Galileans welcomed Him; they had seen all He had done in Jerusalem at the feast, for they too had gone to the feast.
  - range: 46-54
    heading: Thy son liveth
    plain: |
      So He came again to Cana in Galilee, where He had made the water wine. There was a royal official whose son lay sick at Capernaum. When he heard that Jesus had come from Judea into Galilee, he went to Him and begged Him to come down and heal his son, who was close to death. Jesus said to him, “Unless you people see signs and wonders, you will not believe.” The official said, “Sir, come down before my child dies.” Jesus told him, “Go; your son lives.” The man believed what Jesus said to him and went on his way.

      While he was still on his way down, his servants met him with the news that his son was alive. He asked them at what hour the boy had begun to get better. They said, “The fever left him yesterday at the seventh hour.” Then the father knew that this was the very hour when Jesus had said to him, “Your son lives.” So he himself believed, and his whole household. This was the second sign Jesus did after coming from Judea into Galilee.

notes:
  - ref: 1
    phrase: the Pharisees had heard that Jesus made and baptized more disciples than John
    kind: history
    title: Why He left Judea
    body: |
      The King James verses leave two puzzles: why news of His success should send Jesus out of Judea, and how He “made and baptized” disciples when verse 2 says He “baptized not,” though [[John 3:22]] says He did. Joseph Smith’s translation rewrites the passage and answers both. The Pharisees, hearing of His success, “sought more diligently some means that they might put him to death; for many received John as a prophet, but they believed not on Jesus” (JST John 4:2). In that account it is the danger, not the numbers, that sends Him away.

      The same translation says that Jesus did baptize, only “not so many as his disciples” (JST John 4:3); the reason it gives is in the note on [[John 3:22]].
    sources: [jst-john-4]
  - ref: 4
    phrase: he must needs go through Samaria
    kind: words
    title: He must needs go through Samaria
    body: |
      “Must needs” means He had to, and on a map He did not. A traveler from Judea to Galilee could go around Samaria; going through it was simply the shorter road. So the necessity is not geography but purpose: He took the shorter course, “and doubtless His choice was guided by purpose.” John does not say here what the purpose was, and the question stays with the reader through the rest of the chapter.
    sources: [smith-written-believe, talmage-jesus-christ-13]
  - ref: 9
    phrase: for the Jews have no dealings with the Samaritans
    kind: history
    title: No dealings with the Samaritans
    body: |
      The quarrel between Jews and Samaritans was old. After Assyria carried away the northern kingdom, Samaria was resettled by foreign colonists who mixed with the Israelites left behind, and their worship was mixed too. When the Samaritans claimed a share in rebuilding the temple at Jerusalem ([[Ezra 4:1–3]]) and were refused, they became bitter opponents of the Jews and built a rival temple on Mount Gerizim. Here, as the woman’s “thou, being a Jew” shows, “the Jews” are simply the people of Judea and their faith, set against the Samaritans and theirs. The woman sees in Jesus only “a Jew,” and in her eyes a Jew is an enemy.

      The Greek verb means to use something together with someone, to associate with, to have dealings with. That cannot mean no trade at all, since the disciples have just gone into a Samaritan town to buy food (verse 8). The sense is rather that the two peoples kept apart, and the verb can be rendered “are not on friendly terms with.” That is why His simple request, “Give me to drink,” startles her.
    sources: [bd-samaritans, thayer, strathearn-johannine-dialogues]
  - ref: 10
    phrase: living water
    kind: symbol
    title: Living water
    body: |
      “Living water” meant flowing water, water bubbling up from a spring or running in a stream, as against the still water of a cistern or pool. The woman hears it that way. Jesus has no bucket and the well is deep, so where would He get fresh water better than Jacob’s? Like Nicodemus before her, she takes His words at the earthly level, and her request in verse 15 is a tired woman’s wish to be done with the daily walk to the well.

      In the Gospel the phrase is a figure for what God gives the soul to satisfy its thirst. John himself says what it means when Jesus uses the image again at the Feast of Tabernacles: whoever believes, “out of his belly shall flow rivers of living water. (But this spake he of the Spirit, which they that believe on him should receive …)” ([[John 7:38–39]]). The Lord used the words of verse 14 again in this dispensation: “unto him that keepeth my commandments I will give the mysteries of my kingdom, and the same shall be in him a well of living water, springing up unto everlasting life” ([[D&C 63:23]]). In verse 14 and in the revelation alike, the water becomes a spring inside the one who receives it.
    sources: [thayer, strathearn-johannine-dialogues, lds-scriptures]
  - ref: 18
    phrase: thou hast had five husbands
    kind: history
    title: Five husbands
    body: |
      The text does not say how she came to have five husbands, how old she was, or whether her husbands died or divorced her, and a reader should not fill that in. What it says is that the man she now lived with was not her husband, and that she told the truth when she said she had none.

      What the exchange does make plain is something about Jesus. He had just met her, yet He knew her life, a display of “superhuman powers of discernment.” She sees it at once: “Sir, I perceive that thou art a prophet” (verse 19). Later she will tell the town, as the best evidence she has, that He “told me all things that ever I did” (verse 29).
    sources: [sc-knowhy-658, talmage-jesus-christ-13]
  - ref: 20
    phrase: Our fathers worshipped in this mountain
    kind: history
    title: This mountain, and Jerusalem
    body: |
      The mountain is Gerizim, just south of Sychar and in plain sight of the well. The Samaritans had built their own temple there, and the Jewish ruler John Hyrcanus had destroyed it in 109 BC; the woman’s past tense, “our fathers worshipped,” fits that history, though Samaritans went on worshipping and sacrificing on the mountain. Having met a prophet, she puts to Him the question that divided their peoples: which is the place to worship?

      Jesus answers that the question is about to lose its force: the hour is coming when the Father will be worshipped neither on Gerizim nor in Jerusalem (verse 21). He does not pretend the two sides are equal, though. “Ye worship ye know not what: we know what we worship: for salvation is of the Jews” (verse 22). The Samaritans had the books of Moses but rejected the fuller teaching of the prophets, and the Jews, whatever their failings, had been the keepers of God’s word. And salvation was “of the Jews” in a nearer sense still: the source of salvation was standing before her, and He was a Jew.
    sources: [strathearn-johannine-dialogues, bd-samaritans, ellicott-john]
  - ref: 24
    phrase: God is a Spirit
    kind: scripture
    title: God is a Spirit
    body: |
      Read alone, the King James words seem to say that God has no body. Joseph Smith and Sidney Rigdon came to this verse while working through John, shortly before February 16, 1832, and Joseph changed it: “For unto such hath God promised his Spirit. And they who worship him, must worship in spirit and in truth” (JST John 4:26). The change keeps the verse’s point, that true worship is in spirit and in truth, and turns the first clause into a promise: God gives His Spirit to those who worship Him so. Joseph had very likely learned by then, from his own experience with God, that the Father is not a spirit without a body. The Greek, too, is terse: two nouns, *pneuma ho theos*, “spirit” and “God,” open to more than one reading.

      Restoration scripture says it plainly: “The Father has a body of flesh and bones as tangible as man’s; the Son also; but the Holy Ghost has not a body of flesh and bones, but is a personage of Spirit” ([[D&C 130:22]]). Read with the translation, the verse is not about what God is made of. It is about how He is worshipped, which is the question the woman asked.
    sources: [jst-john-4, welch-tangible-bodies]
  - ref: 25
    phrase: I know that Messias cometh, which is called Christ
    kind: history
    title: The Samaritans’ hope
    body: |
      The woman’s hope was probably for a prophet and teacher, not a king from David’s line. What is known of the Samaritans’ hope comes from traditions written down nearly two hundred years after the close of the Second Temple period, the era in which Jesus lived, so it is uncertain how much of it she held; in those traditions they waited for the Taheb, a descendant of Jacob and a great prophet and teacher. The figure goes back to the prophet like Moses promised in Deuteronomy, of whom the Lord said, “he shall speak unto them all that I shall command him” ([[Deut. 18:18]]; the footnote at “tell” points there). That hope probably lies behind her words: “when he is come, he will tell us all things.”

      Jesus is the fulfillment of that hope. When He came to the Nephites He said it in so many words: “Behold, I am he of whom Moses spake” ([[3 Ne. 20:23]]). The woman, for her part, said what she understood and then listened, and that let Him take her further.
    sources: [matson-fourth-gospel, strathearn-johannine-dialogues, lds-scriptures]
  - ref: 26
    phrase: I that speak unto thee am he
    kind: christ
    title: I that speak unto thee am he
    body: |
      Here Jesus reveals fully who He is, and He does it for a Samaritan woman. The King James “he” is not in the Greek, which says, literally, “The one who speaks to you [is] I Am.” “I Am” here is the same as the words of the Septuagint (the ancient Greek translation of the Old Testament) in [[Ex. 3:14]], where the God of Israel gives His name to Moses, so the verse may be rendered “I AM is speaking to you.”

      So the answer goes beyond her question. She asked about the Messiah, a prophet who would tell all things, and He is that; read with [[Ex. 3:14]], His words also name Him as Jehovah, the God who spoke to Moses. The same words return when He says, “Before Abraham was, I am” ([[John 8:58]]), and the people take up stones.
    sources: [lds-scriptures, sc-knowhy-658, strathearn-johannine-dialogues]
  - ref: 27
    phrase: marvelled that he talked with the woman
    kind: history
    title: Talking with a woman
    body: |
      What surprised the disciples was that He was speaking with a woman at all. John’s Greek has no article here: they marvelled that He spoke “with a woman” (*meta gynaikos*), and this one a Samaritan besides. A teacher who talked with a woman in public has been read as going against the rabbis’ rules of conduct. Yet none of the disciples asked Him what He wanted or why He was talking with her. John does not say why; His manner, it seems, impressed on them how serious the moment was.
    sources: [greek-nt, talmage-jesus-christ-13, ellicott-john]
  - ref: 28
    phrase: The woman then left her waterpot
    kind: symbol
    title: She left her waterpot
    body: |
      She had come for water and goes away without her jar. John keeps the small detail, and it can suggest that she leaves with water of a kind no pot could carry: the living water Jesus had promised her. She also carries word of Him to her town, with an invitation, “Come, see a man,” and an honest question, “is not this the Christ?” (verse 29).

      John never gives her name. Like the mother of Jesus and the man born blind, she is left unnamed, and that lets her stand both as a real woman and as a figure a reader can see himself or herself in.
    sources: [strathearn-johannine-dialogues, huntsman-gospel-john]
  - ref: 35
    phrase: they are white already to harvest
    kind: symbol
    title: White already to harvest
    body: |
      The disciples have just shown, in verse 33, that they hear Him at the level of bread, as the woman heard Him at the level of water. Now He turns to the fields. In that land wheat was sown with the autumn rains and cut in early summer, and “four months” is probably a note of the season in which He spoke rather than a proverb: months would pass before the wheat and the barley were ready for the sickle. Yet He tells them to look on fields already white, while the people of Sychar are coming out of the town toward Him (verse 30). The harvest of souls, of which that approaching crowd was the example, was ready now; many of them believed (verse 39).

      Restoration scripture uses the same image for people brought to God. Ammon, rejoicing that thousands of the Lamanites had “been brought into the fold of God,” told his brethren, “the field was ripe, … and behold the number of your sheaves!” ([[Alma 26:4–5]]). In February 1829 the Lord told Joseph Smith Sr. that “the field is white already to harvest,” and that whoever thrusts in his sickle with his might “bringeth salvation to his soul” ([[D&C 4:4]]), as the reaper here “gathereth fruit unto life eternal” (verse 36).
    sources: [ball-plants-nt, ellicott-john, talmage-jesus-christ-13, lds-scriptures]
  - ref: 38
    phrase: other men laboured
    kind: scripture
    title: Other men laboured
    body: |
      Who are the “other men” whose labor the disciples have entered? Joseph Smith’s translation answers: “the prophets have labored” (JST John 4:40, in the footnote). The disciples enter into the prophets’ labor.

      The seed He sowed in these two days was probably the beginning of the rich harvest the Apostles reaped in Samaria in later years. After the Resurrection they were sent there by name ([[Acts 1:8]]), and Philip did a very successful work there ([[Acts 8:4–25]]).
    sources: [lds-scriptures, talmage-jesus-christ-13, bd-samaritans]
  - ref: 42
    phrase: Now we believe, not because of thy saying
    kind: christ
    title: Not because of thy saying
    body: |
      The townspeople tell the woman that their faith no longer rests on her word. She had shared her witness, and it brought them to Him; hearing Him themselves made the knowledge their own.

      What they knew they put in a title: “the Saviour of the world.” It is Samaritans, a despised people, who give Him that name. Jesus did not share the hostility toward them that verse 9 describes; an honest soul was acceptable to Him, “come whence he may.”
    sources: [talmage-jesus-christ-13, matson-fourth-gospel]
  - ref: 44
    phrase: a prophet hath no honour in his own country
    kind: history
    title: No honour in his own country
    body: |
      Verse 44 gives a proverb about a prophet without honor as the reason He went into Galilee, and verse 45 says at once that the Galileans received Him. The proverb is the one Jesus spoke when His own people turned from Him. Mark gives it in full, “A prophet is not without honour, but in his own country, and among his own kin, and in his own house” ([[Mark 6:4]]), and John says later that “neither did his brethren believe in him” ([[John 7:5]]). Luke sets it in the synagogue at Nazareth, where the townspeople wanted Him to do “also here in thy country” what they had heard He did in Capernaum ([[Luke 4:23–24]]); the footnote to “Capernaum” in verse 46 points there. John gives the Galileans’ own reason for receiving Him now: they had seen “all the things that he did at Jerusalem at the feast” (verse 45). One reading takes “his own country” to be Nazareth, the town where He was brought up: knowing that the people of Nazareth would be slow to see Him as more than the carpenter, He went first to Cana (verse 46).

      Matthew and Mark begin the ministry in Galilee at this point, after John the Baptist was put in prison ([[Matt. 4:12–17]]; [[Mark 1:14–15]]), and Luke tells of the imprisonment just before it ([[Luke 3:19–20]]; [[Luke 4:14–15]]); John has first told of time in Judea and Samaria, while “John was not yet cast into prison” ([[John 3:24]]). Where the others follow a single journey to Jerusalem, John follows Jesus between Galilee and Jerusalem several times.
    sources: [lds-scriptures, strathearn-gospels, huntsman-gospel-john, talmage-jesus-christ-13]
  - ref: 46
    phrase: a certain nobleman
    kind: words
    title: A king’s officer
    body: |
      “Nobleman” translates a Greek word formed from the word for king: a royal official, an officer or minister of a prince, a courtier. In Galilee the “king” was almost certainly Herod Antipas, whom Matthew and Mark also call king ([[Matt. 14:9]]; [[Mark 6:14]]), so “king’s officer” is close to the sense. Who he was, John does not say.

      His son lay sick at Capernaum, about twenty miles away, and the father came the whole distance to Cana to find Jesus. He is not the centurion of Capernaum whose servant Jesus healed in Matthew and Luke ([[Matt. 8:5–13]]; [[Luke 7:1–10]]): this man is a king’s officer, the sick one is his son, and he begs Jesus to come down to his house.
    sources: [thayer, ellicott-john, van-dyke-miracles-john, lds-scriptures]
  - ref: 48
    phrase: Except ye see signs and wonders, ye will not believe
    kind: words
    title: Except ye see signs and wonders
    body: |
      The answer sounds harsh to a father whose son is dying, and the plural “ye” shows it is not for him alone. Jesus speaks to the man, but through him to those standing by and to the kind of people he stands for: Galileans who, like the crowds at the Passover in Jerusalem ([[John 2:23]]), were ready to believe because of what they saw. The Samaritans had just believed without a miracle.

      The words also test the man, probably to show him the true state of his own heart, and his answer meets the test. He does not argue or turn away; he only pleads the harder, “Sir, come down ere my child die.”
    sources: [ellicott-john, talmage-jesus-christ-13, van-dyke-miracles-john]
  - ref: 50
    phrase: the man believed the word that Jesus had spoken unto him
    kind: history
    title: The man believed the word
    body: |
      He asked Jesus to come; Jesus sent him home with a word instead, and he went. The timing may suggest how fully he trusted it. Jesus spoke at the seventh hour, about one in the afternoon, which left time enough to cover the twenty miles to Capernaum that day and see for himself. Yet his servants met him on the road and spoke of the healing as “yesterday” (verse 52). He seems not to have hurried home to check. When he heard that the fever left the boy at the very hour Jesus spoke, “himself believed, and his whole house” (verse 53): faith in a word became faith in the One who spoke it, and it spread to his household.
    sources: [van-dyke-miracles-john]
  - ref: 54
    phrase: This is again the second miracle that Jesus did
    kind: christ
    title: The second sign
    body: |
      John’s word here is “sign” (*sēmeion*), the word he uses for Jesus’s miracles throughout, where the other Gospels most often speak of a “mighty work” (*dynamis*). A sign points past itself to who Jesus is. John numbers this one as the second, tying it back to the water made wine at the same Cana ([[John 2:11]]), and the two frame the chapters between them.

      As the Word once created the world, His signs can be seen as acts of divine reorganization: at Cana water remade into wine, here a dying body restored to wholeness, from a distance, by His word alone. The people He healed can also be read as types, persons who stand for something beyond themselves: here, fallen men and women, so that His restoring their bodies becomes a figure of what His atoning work does for the fallen. The theme of these chapters is the new life He came to bring, and the sign ends them with the words that sound three times in the scene: “Thy son liveth.”
    sources: [huntsman-gospel-john]

christ: |
  Jesus Christ is the one who offers the living water, the Messiah the Samaritans awaited, and the great I AM who spoke to Moses, and He made Himself known plainly to a Samaritan woman at a well and gave a king’s officer his son’s life by a word. Her neighbors’ confession is the chapter’s witness: “this is indeed the Christ, the Saviour of the world.” He “must needs go through Samaria” (verse 4), and there He sought her out and spoke first, before she knew to seek Him.

  He knew her life before she told it (verse 18). “The message of the woman at the well is that He knows our life situations and that we can always walk with Him no matter where we stand,” and a disciple who has heard Him can say, like her neighbors, that faith no longer rests on another’s saying.

explore: |
  - **The three dialogues.** “Johannine Christology through the Lens of Three of Its Dialogues,” in *Thou Art the Christ* (Religious Studies Center, 2018), on Nicodemus, the woman at the well and the man born blind.
  - **Hopes for a Messiah.** “The Fourth Gospel and Expectations of the Jewish Messiah,” in the same volume, with a section on the Samaritans.

