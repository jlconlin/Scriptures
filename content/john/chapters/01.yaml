chapter: 1
title: In the Beginning Was the Word
tagline: John opens before creation with the Word who was God and was made flesh; then the Baptist bears witness of the Lamb of God, and the first disciples come and see.
when: "Before the world was (verses 1–18); then four days at Bethabara beyond Jordan and on the way to Galilee, as Jesus gathers His first disciples (verses 19–51)"

setting: |
  The Gospel of John never names its author. He is John, the son of Zebedee and one of the Twelve, who in his own Gospel calls himself “the disciple whom Jesus loved”; the revelation in [[D&C 7:1–3]] speaks to that same beloved disciple of [[John 21:20–23]] as John. Joseph Smith's translation titles the book “The Testimony of St. John.” Scholars frequently date it to the AD 90s, though some features (it never mentions the fall of Jerusalem in AD 70) could suggest an earlier date.

  John's record is quite different from the other three Gospels in vocabulary, phrasing and the way it presents events. He seems to have written for members of the Church who already knew the basic story, and his chief purpose was to show the divine nature of Jesus as the Only Begotten Son of God in the flesh.

  Chapter 1 is the Gospel's prologue, in two parts. Verses 1–18, often called the Logos Hymn (*logos* is the Greek for “Word”), present Jesus in cosmic terms, as the Word who was with God in the beginning and was made flesh. Verses 19–51 then show how disciples first come to Him. Both parts turn on John the Baptist, known by that title in the other Gospels, whose one work in this Gospel is to bear witness. John does not narrate the baptism of Jesus; the Baptist tells what he saw.

thread: |
  The chapter moves from eternity to a fig tree. It opens before creation, with the Word who was with God and was God, by whom all things were made, and it ends with a man in Galilee being promised that he will see heaven opened above the Son of man. In between, the Word crosses the distance: He “was made flesh, and dwelt among us” (verse 14).

  What ties the two halves together is **witness**. The prologue sums up the Baptist's whole work in a phrase: he “came for a witness, to bear witness of the Light” (verse 7). The rest of the chapter shows what witness does. The Baptist tells the delegation from Jerusalem that he is only a voice; he tells two of his disciples, “Behold the Lamb of God”; they follow, Jesus says “Come and see,” and the testimony passes from Andrew to Simon and from Philip to Nathanael. Each gives Him another title (Rabbi, the Messias, the one of whom Moses and the prophets wrote, the Son of God, the King of Israel), and the prologue's “as many as received him” (verse 12) becomes a list of names.

sections:
  - range: 1-5
    heading: The Word in the beginning
    plain: |
      In the beginning the Word already was. The Word was with God, and the Word was God. He was with God in the beginning. Everything was made through Him; nothing that exists was made without Him. In Him was life, and that life was the light of mankind. The light shines in the darkness, and the darkness has not taken hold of it.
  - range: 6-14
    heading: The light comes into the world
    plain: |
      God sent a man named John. He came as a witness, to testify about the light, so that through him everyone might believe. He was not the light himself; he was sent to testify about the light. The true light, which gives light to every person, was coming into the world.

      He was in the world, and the world was made through Him, yet the world did not recognize Him. He came to His own, and His own people did not receive Him. But to all who did receive Him, to those who believe in His name, He gave the right to become children of God: born not of human descent, nor of the desire of the flesh, nor of a man's will, but of God.

      And the Word became flesh and made His dwelling among us. We saw His glory, the glory of the Only Begotten of the Father, full of grace and truth.
  - range: 15-18
    heading: John's testimony and the fulness
    plain: |
      John testified about Him and cried out, “This is the one I spoke of: He who comes after me ranks above me, because He existed before me.” From His fulness we have all received, grace for grace. The law was given through Moses; grace and truth came through Jesus Christ. No one has ever seen God; the Only Begotten Son, who is at the Father's side, has made Him known.
  - range: 19-28
    heading: The record of John
    plain: |
      This was John's testimony when the Jews sent priests and Levites from Jerusalem to ask him, “Who are you?” He did not evade the question; he said plainly, “I am not the Christ.” They asked, “Then what? Are you Elias?” He said, “I am not.” “Are you the Prophet?” He answered, “No.” So they said, “Who are you? We have to give an answer to those who sent us. What do you say about yourself?” He said, “I am the voice of one crying in the wilderness, ‘Make straight the way of the Lord,’ as the prophet Isaiah said.”

      Those who had been sent were from the Pharisees. They asked him, “Then why are you baptizing, if you are not the Christ, nor Elias, nor the Prophet?” John answered, “I baptize with water, but among you stands one you do not know. He is the one who comes after me and ranks above me; I am not worthy to untie the strap of His sandal.” This took place at Bethabara, on the far side of the Jordan, where John was baptizing.
  - range: 29-34
    heading: Behold the Lamb of God
    plain: |
      The next day John saw Jesus coming toward him and said, “Look, the Lamb of God, who takes away the sin of the world! This is the one I meant when I said, ‘After me comes a man who ranks above me, because He existed before me.’ I did not know Him, but I came baptizing with water so that He might be revealed to Israel.”

      John testified, “I saw the Spirit come down from heaven like a dove, and it remained on Him. I did not know Him, but the one who sent me to baptize with water told me, ‘The man on whom you see the Spirit come down and remain is the one who baptizes with the Holy Ghost.’ I have seen it, and I testify that this is the Son of God.”
  - range: 35-42
    heading: Come and see
    plain: |
      The next day John was standing there again with two of his disciples. Seeing Jesus walk by, he said, “Look, the Lamb of God!” The two disciples heard him and followed Jesus. Jesus turned, saw them following, and asked, “What are you looking for?” They said, “Rabbi” (which means Master), “where are you staying?” He said, “Come and see.” So they went and saw where He was staying and spent the rest of that day with Him; it was about the tenth hour counted from sunrise, late in the afternoon.

      One of the two who heard John and followed Jesus was Andrew, Simon Peter's brother. He first found his own brother Simon and told him, “We have found the Messiah” (which means the Christ). He brought him to Jesus. Jesus looked at him and said, “You are Simon the son of Jona; you will be called Cephas,” which means a stone.
  - range: 43-51
    heading: Philip and Nathanael
    plain: |
      The next day Jesus decided to leave for Galilee. He found Philip and said to him, “Follow me.” Philip was from Bethsaida, the town of Andrew and Peter. Philip found Nathanael and told him, “We have found the one Moses wrote about in the law, and the prophets too: Jesus of Nazareth, the son of Joseph.” Nathanael said, “Can anything good come out of Nazareth?” Philip said, “Come and see.”

      When Jesus saw Nathanael coming, He said of him, “Here is a true Israelite, in whom there is no deceit!” Nathanael asked, “How do you know me?” Jesus answered, “Before Philip called you, when you were under the fig tree, I saw you.” Nathanael answered, “Rabbi, you are the Son of God; you are the King of Israel!” Jesus said, “You believe because I told you I saw you under the fig tree? You will see greater things than that.” And He added, “Truly, truly, I tell you, from now on you will see heaven opened and the angels of God going up and coming down upon the Son of man.”

notes:
  - ref: 1
    phrase: In the beginning was the Word
    kind: words
    title: Why Jesus is called the Word
    body: |
      John opens with the first words of Genesis on purpose. “In the beginning God created” ([[Gen. 1:1]]) becomes “In the beginning was the Word,” and the title he gives Jesus comes from the way God creates in Genesis 1: by speaking. The Greek is *logos*, “word,” a term with a wide range of related meanings. Set beside the creation story, in which God brings forth light and then everything else by His word, it presents Jesus as God's will, plan and intent, and as the means by which God communicates with His creation and acts in it.

      Behind the Greek stands the Old Testament's Hebrew *dabar*, the word of God that carries His creating power: “He sendeth out his word, and melteth them” ([[Ps. 147:18]]). Greek philosophers had their own ideas about the *logos*, but John's Gospel is distinct from them; it seems to use biblical language that its first readers would have understood.

      The Lord Himself explained the title to Joseph Smith, in a revelation that speaks in the language of John's prologue: “in the beginning the Word was, for he was the Word, even the messenger of salvation” ([[D&C 93:8]]).
    sources: [lane-word-made-flesh, huntsman-gospel-john, lds-scriptures]
  - ref: 1
    phrase: and the Word was God
    kind: scripture
    title: 'The Joseph Smith Translation: the gospel preached through the Son'
    body: |
      Joseph Smith's translation recasts the opening: “In the beginning was the gospel preached through the Son. And the gospel was the word, and the word was with the Son, and the Son was with God, and the Son was of God” (JST John 1:1). In this first verse the word is the gospel the Son preached, and the Son Himself stands where the King James Version has the Word, “with God.” The verses that follow carry the identification through. Verse 10 gains “Even the Son of God,” and after verse 15 the translation says it outright: “For in the beginning was the Word, even the Son, who is made flesh, and sent unto us by the will of the Father” (JST John 1:16). The changes in the prologue have one theme: they make unmistakable that “the Word” is the Son of God.

      This is unusual for John. His Gospel already presents Jesus more fully as divine than any other, and Joseph Smith's translation changes little else in it that bears on who Jesus is. Here it adds much.
    sources: [jst-john-1, lefevre-christology-jst]
  - ref: 5
    phrase: the darkness comprehended it not
    kind: words
    title: 'Comprehended: the darkness did not take hold of the light'
    body: |
      “Comprehended” suggests understanding to a modern reader, but the Greek verb, *katalambanō*, means to lay hold of something so as to make it one's own. The darkness did not take the light in or make it its own. Joseph Smith's translation puts the point in plain words: “the light shineth in the world, and the world perceiveth it not” (JST John 1:5). Verses 10–11 then say the same of the world and of His own people: they “knew him not” and “received him not.”

      A revelation to Joseph Smith repeats the King James words and turns them into a promise: “The light shineth in darkness, and the darkness comprehendeth it not; nevertheless, the day shall come when you shall comprehend even God, being quickened in him and by him” ([[D&C 88:49]]). The darkness did not take hold of the light, but those to whom the Lord speaks are promised that they will one day comprehend God Himself.
    sources: [thayer, jst-john-1, lds-scriptures]
  - ref: 12
    phrase: to them gave he power to become the sons of God
    kind: christ
    title: Power to become the sons of God
    body: |
      Latter-day Saints teach that every person is a spirit child of God, so a reader may wonder why John says that believers are given power to *become* sons of God. Both are true. The Restoration doctrine of our being spirit children of Heavenly Father stands; John adds that Christ has a unique standing as the Only Begotten, and that He is the one through whom we become “the sons [and daughters] of God.”

      The prologue has just said that “all things were made by him” (verse 3), and that is the ground of the promise. Becoming a son or daughter of God in John's sense is a new creation, and the One who made the world is the One who can make its people new, re-creating them in His image as His sons and daughters. Verse 13 describes that new creation as a birth “not of blood, nor of the will of the flesh, nor of the will of man, but of God,” and that new life in Christ comes with the gift of the Holy Ghost.

      The Lord repeated the promise in this dispensation and said how it is received: “to as many as received me, gave I power to become my sons” ([[D&C 39:4]]); “he that receiveth my gospel receiveth me,” and “this is my gospel—repentance and baptism by water, and then cometh the baptism of fire and the Holy Ghost” ([[D&C 39:5–6]]).
    sources: [lane-word-made-flesh, lds-scriptures]
  - ref: 14
    phrase: dwelt among us
    kind: words
    title: 'Dwelt: He pitched His tent among us'
    body: |
      The Greek verb behind “dwelt” is *eskēnōsen*, from *skēnoō*, to live in a tent or tabernacle; the phrase could be translated “tabernacled among us.”

      The word recalls the tabernacle in the wilderness, built so that God could live among His people (“let them make me a sanctuary; that I may dwell among them,” [[Ex. 25:8]]) and filled with His glory when it was finished ([[Ex. 40:34–35]]). John carries the connection into his next words: “and we beheld his glory.” The God who once dwelt with Israel in a tent now dwells among them in a body of flesh; read this way, from this point John portrays Jesus as Jehovah only thinly veiled in flesh, walking and working among His people.

      The Book of Mormon uses the same image for the same event. An angel told King Benjamin that the Lord Omnipotent “shall come down from heaven among the children of men, and shall dwell in a tabernacle of clay” ([[Mosiah 3:5]]). The tent was temporary, and so was the mortal body.
    sources: [lane-word-made-flesh, huntsman-gospel-john, thayer]
  - ref: 16
    phrase: grace for grace
    kind: scripture
    title: Grace for grace
    body: |
      In John, “grace for grace” is what believers receive out of Christ's fulness. A revelation to Joseph Smith takes John's words and applies them first to Christ Himself: “And I, John, saw that he received not of the fulness at the first, but received grace for grace; and he received not of the fulness at first, but continued from grace to grace, until he received a fulness” ([[D&C 93:12–13]]). The Gospel of John says nothing about the Son's not receiving the fulness at first; in section 93 the same language is reworked so that the Son is the one who grows from grace to grace until He has it all. (Which John the revelation quotes is not always clear; it may be the Baptist or the Apostle.)

      Then the promise turns to the reader: “if you keep my commandments you shall receive of his fulness, and be glorified in me as I am in the Father; therefore, I say unto you, you shall receive grace for grace” ([[D&C 93:20]]). As the Son progressed to the fulness, so those who follow Him may progress until they receive of it. Joseph Smith's translation names what the fulness is: “And of his fullness have all we received, even immortality and eternal life, through his grace” (JST John 1:16).
    sources: [lds-scriptures, frederick-dc-john, sc-knowhy-809, jst-john-1]
  - ref: 18
    phrase: No man hath seen God at any time
    kind: scripture
    title: No man hath seen God?
    body: |
      John's statement that no man has seen God seems to contradict a good deal of scripture, and Joseph Smith's own experience. Moses “saw God face to face, and he talked with him” ([[Moses 1:2]]), and in the First Vision Joseph Smith “saw two Personages” ([[JS—H 1:17]]). Joseph Smith's translation brings the verse into harmony with the rest: “And no man hath seen God at any time, except he hath borne record of the Son; for except it is through him no man can be saved” (JST John 1:19). The change emphasizes the Father's role in bearing witness of the Son.

      A revelation to Joseph Smith explains how anyone can see God at all: “no man has seen God at any time in the flesh, except quickened by the Spirit of God” ([[D&C 67:11]]). Moses said the same of his vision. He saw God “not my natural, but my spiritual eyes, for my natural eyes could not have beheld” ([[Moses 1:11]]).
    sources: [sc-knowhy-628, jst-john-1, lds-scriptures]
  - ref: 19
    phrase: the Jews sent priests and Levites from Jerusalem
    kind: history
    title: Who sent the priests and Levites
    body: |
      This is the first time John's Gospel says “the Jews,” and the phrase needs care, because Jesus was a Jew ([[John 4:9]]), as were the Baptist and every disciple in this chapter. When John uses the expression in a hostile sense, as he often does, it appears to mean the Jewish leadership or a particular group opposed to Jesus, not a people.

      Here it means the authorities in Jerusalem, most likely the council (the Sanhedrin): the Baptist's work had drawn so much attention that they sent an official inquiry. The messengers were priests and Levites, and part of the Levites' work was teaching the law; verse 24 adds that they “were of the Pharisees.” So the questions in verses 19–25 read as an official examination: who is this man, and by what right does he baptize?
    sources: [matson-fourth-gospel, ellicott-john]
  - ref: 21
    phrase: Art thou Elias?
    kind: scripture
    title: Elias, and that prophet
    body: |
      John's flat “I am not” to “Art thou Elias?” puzzles readers, because Jesus later says that “Elias is come already,” meaning John ([[Matt. 17:12–13]]). The delegation's questions come from scripture. Elias is the Greek form of Elijah, and Malachi had promised, “I will send you Elijah the prophet before the coming of the great and dreadful day of the Lord” ([[Mal. 4:5]]). Moses had promised “a Prophet from the midst of thee, of thy brethren, like unto me” ([[Deut. 18:15]]).

      Joseph Smith's translation answers the puzzle. John “denied not that he was Elias”; asked “How then art thou Elias?” he answered, “I am not that Elias who was to restore all things.” And of Jesus he said, “He is that prophet, even Elias” (JST John 1:21–22, 28). Elias is also a title, and two Eliases were spoken of anciently, a preparer and a restorer. John was sent to prepare the way; Jesus was the Restorer, who brought back the gospel and the Melchizedek Priesthood in His day. The questions themselves show that the questioners knew something of this doctrine, but the fragments in the Bible are not enough to understand it; only revelation to Joseph Smith brings it into focus. He taught that “the spirit of Elias was a going before to prepare the way for the greater, which was the case with John the Baptist.”

      As for “that prophet,” the risen Lord told the Nephites plainly whom Moses meant: “Behold, I am he of whom Moses spake” ([[3 Ne. 20:23]]).
    sources: [bd-elias, jst-john-1, tpjs-2007-ch-6, lds-scriptures]
  - ref: 28
    phrase: Bethabara beyond Jordan
    kind: history
    title: Bethabara, the place Lehi named
    body: |
      Lehi had prophesied that the forerunner “should baptize in Bethabara, beyond Jordan” ([[1 Ne. 10:9]]). Just where the ancient site lay is uncertain today; “beyond Jordan” normally means the east side of the river.

      Readers of modern translations will find “Bethany” here instead. The earliest surviving manuscripts of this verse read “Bethany,” while the early Church fathers Origen and John Chrysostom claimed that most of the early and accurate manuscripts, which apparently have not survived, read “Bethabara.” If they were right, the Book of Mormon confirms “Bethabara” as the original reading. If “Bethany” is original, the two names are spelled so much alike in Greek that “Bethabara” may have arisen as a copyist's error, and Joseph Smith may have followed the King James wording when he translated 1 Nephi 10:9. Either way, Lehi's prophecy places the Baptist where John does. Joseph Smith's translation keeps “Bethabara,” moving the sentence to the end of the Baptist's testimony (JST John 1:34).
    sources: [lds-scriptures, judd-nephi-vision, jst-john-1]
  - ref: 29
    phrase: Behold the Lamb of God, which taketh away the sin of the world
    kind: christ
    title: The Lamb of God
    body: |
      The Baptist's title for Jesus looks ahead to His death. In John, Jesus dies on the day of preparation for the Passover ([[John 19:14]]), which suggests that He died about the time the Passover lambs were being slaughtered in the temple, and that association is at least one explanation of the name.

      Yet scholars have noted that the Passover lamb had no role in remitting sins; the only sacrificial animals understood to do that were those offered on the Day of Atonement. So a Lamb who “taketh away the sin of the world” has been read as a composite figure, drawing on both sacrifices, with several strands of meaning at once.

      The Book of Mormon knew the title long before. Lehi foresaw that the forerunner, after baptizing the Messiah, “should behold and bear record that he had baptized the Lamb of God, who should take away the sins of the world” ([[1 Ne. 10:10]]).
    sources: [sc-knowhy-845, sc-knowhy-675, lds-scriptures]
  - ref: 31
    phrase: And I knew him not
    kind: scripture
    title: Did John not know Him?
    body: |
      Twice the Baptist says “I knew him not” (verses 31 and 33). Joseph Smith's translation reads the opposite in both places: “for he was before me, and I knew him, and that he should be made manifest to Israel; therefore am I come baptizing with water,” and “And I knew him; for he who sent me to baptize with water, the same said unto me; Upon whom thou shalt see the Spirit descending, and remaining on him, the same is he who baptizeth with the Holy Ghost” (JST John 1:30, 32).

      In the translation, then, John already knew Jesus; the descending Spirit was the sign promised by the One who sent him, and the translation places it at the baptism itself: “When he was baptized of me, I saw the Spirit descending from heaven like a dove” (JST John 1:31). What John saw, he testified: “this is the Son of God” (verse 34).
    sources: [jst-john-1]
  - ref: 32
    phrase: like a dove
    kind: prophets
    title: The sign of the dove
    body: |
      John does not say that the Spirit became a dove, but that he saw it descend “like a dove.” Joseph Smith taught the difference: “The Holy Ghost is a personage, and is in the form of a personage. It does not confine itself to the form of the dove, but in sign of the dove.” The sign “was given to John to signify the truth of the deed, as the dove is an emblem or token of truth and innocence.”

      Nephi saw the same moment in vision: “the Holy Ghost come down out of heaven and abide upon him in the form of a dove” ([[1 Ne. 11:27]]). Both Nephi and John stress that the Spirit stayed. “It abode upon him,” John says, and that was the sign he had been told to watch for: the Spirit “descending, and remaining on him” (verse 33).
    sources: [tpjs-2007-ch-6, lds-scriptures]
  - ref: 39
    phrase: Come and see
    kind: structure
    title: 'Come and see: one witness brings another'
    body: |
      “Come and see” is how the first disciples come to Jesus. He answers the two disciples' question with it, and Philip answers Nathanael's doubt with the same words (verse 46). These first disciples set a pattern for those who hear another's testimony and then come and see for themselves that Jesus is the Master, the Messiah, the Son of God and the King of Israel.

      The narrator remembers the very hour: “about the tenth hour,” counted from sunrise, so late in the afternoon. One of the two disciples is named as Andrew (verse 40); the other is not named, and may well be John himself, the writer of the Gospel. If so, one explanation of the remembered hour is that this afternoon was the turning point of the writer's own life.
    sources: [huntsman-gospel-john, ellicott-john, bd-john, bd-hour]
  - ref: 41
    phrase: We have found the Messias
    kind: words
    title: Messias, the Anointed
    body: |
      *Messias* is the form of Messiah used here, an Aramaic word meaning “the anointed.” The word appears in the Bible only in [[Dan. 9:25–26]] and in John (here and [[John 4:25]]), and John translates it for his readers: “the Christ,” its Greek equivalent. As the title of an office, it named the King and Deliverer the Jews were eagerly expecting, though many looked only for deliverance from Roman power and for national prosperity.

      Andrew's way of putting it, “We have found,” suggests that finding the Messiah was something these men had talked about and looked for before.
    sources: [bd-messiah, matthews-found-messiah]
  - ref: 42
    phrase: thou shalt be called Cephas, which is by interpretation, A stone
    kind: scripture
    title: 'Cephas: a seer, or a stone'
    body: |
      At their first meeting Jesus gives Simon a new name: Cephas, from the Aramaic *kepha*, “stone,” the name that is Peter in Greek ([[Matt. 16:18]]). Joseph Smith's translation enlarges the interpretation: “thou shalt be called Cephas, which is, by interpretation, a seer, or a stone” (JST John 1:42).

      One Latter-day Saint reading asks why a stone and a seer would belong together for Jesus's disciples, and finds the answer in Israel's sacred stones. The high priest, the leading priesthood authority in Israel, bore the Urim and Thummim, through which the Lord gave revelation, and the Book of Mormon's interpreters were stones prepared to give men the light of revelation. On this reading Peter's new name described his calling: he would be a seer, one who receives the knowledge of Jesus by revelation. The translation also completes the scene: “And they were fishermen. And they straightway left all, and followed Jesus.”
    sources: [hopkin-peter-stones-seers, jst-john-1]
  - ref: 46
    phrase: Can there any good thing come out of Nazareth?
    kind: history
    title: Why Nathanael doubted Nazareth
    body: |
      Nathanael's doubt turns on the town Philip names. Philip has identified the one “of whom Moses in the law, and the prophets, did write” as “Jesus of Nazareth.” Scripture taught that the Messiah would come from Bethlehem ([[Micah 5:2]]). Jesus had been born there, but He grew up in Nazareth in Galilee, and His seeming to come from Nazareth rather than Bethlehem was likely one reason Nathanael doubted.

      Galilee had a prophecy of its own, in [[Isa. 9:1–2]], which Matthew applies to Jesus's Galilean home ([[Matt. 4:13–16]]). The same objection returns later in John, in sharper form: “Search, and look: for out of Galilee ariseth no prophet” ([[John 7:52]]). Philip does not argue. He repeats Jesus's invitation: “Come and see.”
    sources: [sc-knowhy-869]
  - ref: 47
    phrase: in whom is no guile
    kind: words
    title: An Israelite without guile
    body: |
      Jesus names in Nathanael the opposite of deceit: the Greek word for “guile,” *dolos*, means craft or deceit. “An Israelite indeed” may also look back to the man who first bore the name: Jacob, who took Esau's blessing “with subtilty” ([[Gen. 27:35]]) and was then told, “Thy name shall be called no more Jacob, but Israel” ([[Gen. 32:28]]). The Greek Old Testament uses this same word for Jacob's subtilty (*meta dolou*, “with guile”), so the greeting can be read as naming a man true to the name of Israel, with nothing of the old Jacob in him.

      The Lord used these words again in this dispensation, of Edward Partridge when He called him as the Church's first bishop: “his heart is pure before me, for he is like unto Nathanael of old, in whom there is no guile” ([[D&C 41:11]]). To be without guile is to have a heart that is pure before God.

      The doubter of verse 46 changed when Jesus said He had seen him “before that Philip called thee, when thou wast under the fig tree” (verse 48); John does not say what Nathanael was doing there. Nathanael broke at once into testimony, “thou art the Son of God; thou art the King of Israel” (verse 49), the first disciple John records to say aloud that Jesus was the Son of God, in words no one had given him. Jesus answers that this is only the beginning: “thou shalt see greater things than these” (verse 50).
    sources: [thayer, lds-scriptures, swete-lxx-genesis, ellicott-john, welch-creeds]
  - ref: 51
    phrase: the angels of God ascending and descending upon the Son of man
    kind: scripture
    title: Jacob's ladder and the Son of man
    body: |
      Jesus ends with Jacob again, this time with his dream at Bethel, where “a ladder set up on the earth” reached to heaven, “and behold the angels of God ascending and descending on it” ([[Gen. 28:12]]). Jacob awoke and said, “this is none other but the house of God, and this is the gate of heaven” ([[Gen. 28:17]]).

      In Jesus's promise the angels ascend and descend not on a ladder but “upon the Son of man.” Read beside Jacob's dream, the promise makes Jesus Himself the ladder, the link that unites heaven and earth, and the new Beth-el, the true gate of heaven.
    sources: [frederick-use-of-ot, lds-scriptures]

christ: |
  John's first chapter names Jesus again and again (the Word, the true Light, the Only Begotten of the Father, the Lamb of God, the Messias, the Son of God, the King of Israel, the Son of man), and each witness names Him from what he has seen. Its last promise is that He is the place where heaven opens to earth: the One who makes God known, and through whom every soul who will can come to God.

  In the revelation that gives Joseph Smith part of John's record ([[D&C 93:6–18]]), the Lord promises: “every soul who forsaketh his sins and cometh unto me, and calleth on my name, and obeyeth my voice, and keepeth my commandments, shall see my face and know that I am” ([[D&C 93:1]]). The way to Him still runs as it did by the Jordan, from one who has come and seen to another who is told to come and see, and those who keep His commandments receive of His fulness, “grace for grace” ([[D&C 93:20]]).

explore: |
