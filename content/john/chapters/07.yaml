chapter: 7
title: If Any Man Thirst
tagline: Jesus goes up to Jerusalem for the feast of tabernacles after His unbelieving brothers have gone, teaches in the temple that His doctrine is the Father's, answers the charge about the Sabbath, and on the last day of the feast cries out that whoever thirsts should come to Him and drink; the crowd divides over whether He is the Christ, the officers sent to arrest Him come back empty-handed, and Nicodemus asks the council to hear Him first.
when: 'The feast of tabernacles in the autumn, about five months after the Passover that was near in [[John 6:4]]; Galilee, then the temple in Jerusalem'

setting: |
  Chapters 5 through 10 of John are set at the feasts of the Jews, the Sabbath, the Passover, Tabernacles and Dedication, and in them what Jesus does and says shows Him to be what the law and Israel's hopes looked for. Chapter 7 begins the longest of these settings. The feast of tabernacles, kept in the seventh month (about September), was one of the three feasts every man of Israel was to keep before the Lord, and Josephus called it the holiest and greatest of them. What happens at it runs through chapters 7 and 8, and its ceremonies stand behind what Jesus says there, the water in chapter 7 and the light in chapter 8.

  Since the healing at Bethesda ([[John 5:16–18]]) the authorities in Jerusalem had sought to kill Jesus, so He stayed in Galilee until the feast had begun and came up without the usual company of pilgrims.

  The last verse of the chapter, “And every man went unto his own house,” belongs with the account of the woman taken in adultery that follows it ([[John 8:1–11]]), and the earliest manuscripts leave the two out together (see the note on verse 53).

thread: |
  **Everyone at the feast is arguing about where Jesus comes from, and He keeps telling them: from the one who sent Him.**

  The crowd judges by what it can see. This man never studied with the scribes (verse 15); He is from Galilee, and the scripture says the Christ comes from Bethlehem (verses 41–42); we know where He is from, and no one will know where the Christ is from (verse 27). Jesus answers each time with the same word. His doctrine is His “that sent me” (verse 16); He seeks the glory of “him that sent him” (verse 18); He is not come of Himself, “he that sent me is true” (verse 28); soon He goes “unto him that sent me” (verse 33). When He says “him that sent me” again in [[John 9:4]], the word has come ten times since this chapter began.

  So the question “Where is He from?” turns into “Will you believe Him?” Some say “He is a good man,” others “he deceiveth the people” (verse 12); some say “the Prophet,” some “the Christ,” and some would arrest Him (verses 40–44). Facts about Bethlehem do not settle it, and the miracles that move some to believe (verse 31) do not move the rest; what separates them is belief, and Jesus has told them how that knowledge comes: whoever will do the Father's will shall know whether the doctrine is from God (verse 17). On the last day of the feast He offers what the feast's own water pointed to: “If any man thirst, let him come unto me, and drink” (verse 37).

sections:
  - range: 1-9
    heading: His brothers, and His time
    plain: |
      After this Jesus traveled about in Galilee. He would not go about in Judea, because the Jews were seeking to kill Him. The Jews' feast of tabernacles was near. So His brothers said to Him, “Leave here and go to Judea, so that your disciples there can see the works you are doing too. No one who wants to be known publicly does things in secret. If you are doing these things, show yourself to the world.” For not even His brothers believed in Him.

      Jesus said to them, “My time has not yet come, but any time is right for you. The world cannot hate you, but it hates me, because I testify against it that its works are evil. You go up to this feast. I am not going up to this feast yet, because my time has not yet fully come.” When He had said this, He stayed on in Galilee.
  - range: 10-13
    heading: Sought at the feast
    plain: |
      But after His brothers had gone up, He went up to the feast too, not openly but as if in secret. The Jews were looking for Him at the feast and asking, “Where is he?” There was a great deal of muttering about Him among the crowds. Some said, “He is a good man.” Others said, “No, he is leading the people astray.” But no one spoke about Him openly, for fear of the Jews.
  - range: 14-24
    heading: My doctrine is not mine
    plain: |
      About the middle of the feast Jesus went up into the temple and taught. The Jews were astonished and said, “How does this man have such learning, when he has never studied?” Jesus answered them, “My teaching is not mine, but His who sent me. If anyone is willing to do His will, he will know whether the teaching is from God or whether I speak on my own. Whoever speaks on his own seeks his own glory, but whoever seeks the glory of the one who sent him is true, and there is nothing false in him. Didn't Moses give you the law? Yet none of you keeps the law. Why are you trying to kill me?”

      The crowd answered, “You have a devil! Who is trying to kill you?” Jesus answered them, “I did one work, and you are all astonished. Moses gave you circumcision (though it did not begin with Moses but with the fathers), and you circumcise a man on the Sabbath. If a man receives circumcision on the Sabbath so that the law of Moses will not be broken, are you angry with me because I made a man completely well on the Sabbath? Stop judging by appearances, and judge with right judgment.”
  - range: 25-36
    heading: Whence He came, and whither He goes
    plain: |
      Then some of the people of Jerusalem said, “Isn't this the man they are trying to kill? Yet here he is, speaking openly, and they say nothing to him. Can it be that the rulers really know that this is the Christ? But we know where this man comes from, and when the Christ comes, no one will know where he comes from.”

      So Jesus cried out as He taught in the temple, “You know me, and you know where I am from. Yet I have not come on my own. The one who sent me is true, and Him you do not know. But I know Him, because I come from Him, and He sent me.” At this they tried to seize Him, but no one laid a hand on Him, because His hour had not yet come. Many in the crowd believed in Him and said, “When the Christ comes, will he do more miracles than this man has done?”

      The Pharisees heard the crowd muttering these things about Him, and the Pharisees and the chief priests sent officers to arrest Him. Then Jesus said, “I am with you only a little while longer, and then I go to the one who sent me. You will look for me and not find me, and where I am you cannot come.” The Jews said to one another, “Where is he going, that we will not find him? Will he go to those dispersed among the Greeks and teach the Greeks? What does he mean by saying, ‘You will look for me and not find me, and where I am you cannot come’?”
  - range: 37-44
    heading: The last day of the feast
    plain: |
      On the last day, the great day of the feast, Jesus stood and cried out, “If anyone is thirsty, let him come to me and drink. Whoever believes in me, as the scripture has said, out of his inmost being will flow rivers of living water.” (He said this about the Spirit, whom those who believed in Him were to receive; for the Holy Ghost had not yet been given, because Jesus had not yet been glorified.)

      When they heard these words, many in the crowd said, “This really is the Prophet.” Others said, “This is the Christ.” But some said, “Is the Christ to come from Galilee? Doesn't the scripture say that the Christ comes from the family of David, and from Bethlehem, the town where David lived?” So the crowd was divided over Him. Some of them wanted to seize Him, but no one laid hands on Him.
  - range: 45-53
    heading: Never man spake like this man
    plain: |
      Then the officers came back to the chief priests and Pharisees, who asked them, “Why haven't you brought him?” The officers answered, “No one ever spoke the way this man speaks.” The Pharisees answered, “Have you been led astray too? Has any of the rulers or of the Pharisees believed in him? But this crowd, which does not know the law, is accursed.”

      Nicodemus, the man who had come to Jesus by night and who was one of them, said to them, “Does our law judge a man without first hearing him and finding out what he is doing?” They answered him, “Are you from Galilee too? Search and you will see that no prophet arises out of Galilee.” And everyone went home.

notes:
  - ref: 1
    phrase: because the Jews sought to kill him
    kind: history
    title: Who sought to kill Him
    body: |
      “The Jews” who sought to kill Jesus are most likely the authorities in Jerusalem, the men who began to plot His death after the healing at Bethesda ([[John 5:16–18]]). John often appears to use the phrase this way (see the note on [[John 1:19]]). This chapter shows the difference plainly. The crowds have come up to keep “the Jews' feast” (verse 2), yet they will not speak of Him openly “for fear of the Jews” (verse 13), which points to those in power.

      The groups in the chapter do not even know the same things. When Jesus asks why they want to kill Him, the people in the temple deny it: “Thou hast a devil: who goeth about to kill thee?” (verse 20). Some of the people of Jerusalem know better: “Is not this he, whom they seek to kill?” (verse 25). The council itself comes into the chapter in verse 32, as “the Pharisees and the chief priests.”
    sources: [matson-fourth-gospel]
  - ref: 2
    phrase: feast of tabernacles
    kind: history
    title: The feast of tabernacles
    body: |
      Tabernacles, or booths, was the autumn feast of the seventh month, also called the feast of ingathering. It ran seven days, from the fifteenth to the twenty-first of the month, with an eighth day added at the end, and it remembered two things: Israel's living in booths in the wilderness after the Lord brought them out of Egypt ([[Lev. 23:42–43]]), and the gathering in of the year's harvest. For the week the people lived in shelters made of the boughs of trees. Later Jews called it simply “the Feast” and counted it the greatest and most joyful of the year. In Jesus' day it was a feast of remembered deliverance kept under Roman rule, and any prayer for freedom offered at it would have been a hope for a deliverance still to come.

      Two ceremonies had been added by then, and John's account turns on both. Each morning water was drawn from the pool of Siloam and poured out on the altar, and the courts of the temple were lit by four great golden lampstands. Jesus' words on the last day, “If any man thirst, let him come unto me, and drink” (verse 37), and His words soon after, “I am the light of the world” ([[John 8:12]]), are most likely spoken against these ceremonies.
    sources: [bd-feasts, gardner-tabernacles]
  - ref: 5
    phrase: For neither did his brethren believe in him
    kind: history
    title: His brothers' unbelief
    body: |
      “His brethren” are the sons of Joseph and Mary born after Jesus, James, Joses, Simon and Judas; He had sisters as well ([[Matt. 13:55–56]]). John gives the reason for their advice in verses 3–4 (go up to Judea and show yourself to the world): “For neither did his brethren believe in him.” Those who had grown up with Him did not yet believe what He was.

      They did not stay that way. The risen Lord “was seen of James” ([[1 Cor. 15:7]]), and before Pentecost His brothers were gathered in prayer with the apostles and with Mary His mother ([[Acts 1:14]]). James, the brother of the Lord ([[Gal. 1:19]]), became a leader of the Church at Jerusalem and was probably the writer of the Epistle of James.
    sources: [bd-brethren-of-the-lord, bd-james, lds-scriptures]
  - ref: 6
    phrase: My time is not yet come
    kind: christ
    title: My time is not yet come
    body: |
      Jesus' “time” is the season the Father has appointed for what He does, and the moment His brothers want, to go up to Judea at the feast and show Himself to the world, has not come. Their time “is alway ready” because nothing they do waits on such an appointment. There would be a time for Him to enter Jerusalem with a throng of pilgrims going up to a feast, a few months later, at the Passover at which He died ([[John 12:12–13]]); it was not this joyful harvest feast. So He goes up to Tabernacles quietly, “not openly, but as it were in secret” (verse 10), apart from the usual company of travelers.

      John uses the same idea when the crowd tries to seize Him: “no man laid hands on him, because his hour was not yet come” (verse 30). The crowd was divided, and though some wanted to seize Him, no one laid hands on Him (verses 43–44). The reason John gives lies deeper: the hour appointed by God had not yet come, and until it came no one could take Him.
    sources: [ellicott-john, lds-scriptures]
  - ref: 15
    phrase: How knoweth this man letters, having never learned?
    kind: history
    title: Learning without the schools
    body: |
      “Letters” means learning, the scholarship of the schools. Jesus had never been trained as a rabbi, yet He handled the law and the scriptures like one who had, and what astonished His hearers was less what He taught than that a man without that training could teach it. Teachers in that day were known by their credentials. The scribes were trained professionals and recognized as authorized teachers, and Jesus held no authorization from them.

      Jesus' answer says where His learning came from: “My doctrine is not mine, but his that sent me” (verse 16). The officers sent to arrest Him are struck by the same thing: “Never man spake like this man” (verse 46).
    sources: [ellicott-john, richardson-unorthodox-teacher]
  - ref: 17
    phrase: If any man will do his will, he shall know of the doctrine
    kind: prophets
    title: Knowing by doing
    body: |
      Jesus meets the question of His authority with a test anyone can make. “Will do” is not the plain future: the sense is “If any man willeth to do His will.” The will to do what God wants comes first, and knowledge of the teaching is promised to the one who has it, not to the one who waits to be convinced before he acts. His hearers would have taken God's will to be what the law and the prophets set out, and He goes straight on to ask why none of them keeps the law (verse 19).

      President Dallin H. Oaks taught from this verse that “acquiring a testimony is not a passive thing but a process in which we are expected to do something,” and that obedience and knowledge reinforce each other: “knowledge encourages obedience,” and “obedience enhances knowledge.” Verse 18 gives the matching test for the teacher. One who speaks of himself seeks his own glory; one who seeks the glory of the one who sent him is true.
    sources: [ellicott-john, oaks-testimony-2008]
  - ref: 23
    phrase: because I have made a man every whit whole on the sabbath day
    kind: history
    title: Circumcision on the Sabbath
    body: |
      The “one work” that made them marvel (verse 21) is most likely the healing at Bethesda, the Sabbath healing that began the plot against Him ([[John 5:8–18]]). Jesus defends it from their own practice. A boy was to be circumcised on the eighth day ([[Lev. 12:3]]), and when that day fell on a Sabbath they circumcised him anyway: a commandment bound to a fixed day outweighed the Sabbath rest, though a circumcision on any other day was still forbidden on it. Circumcision was older than Moses, Jesus adds; it came from the fathers ([[Gen. 17:10–12]]).

      The argument runs from the lighter case to the heavier, a form of reasoning, called *qal vahomer*, that sources from a little later show was common in that century. If they could work on the Sabbath on one part of a child's body, to bring him into the covenant, how could they be angry that He had made a whole man well? “Every whit whole” may reach past the man's body, too: on one reading, his healing stood for the greater work of renewal Jesus came to do. The Joseph Smith Translation sharpens the charge that closes the argument (verse 24): they are not to judge according to “your traditions,” but to judge righteous judgment.
    sources: [huntsman-sabbath-john, lds-scriptures]
  - ref: 27
    phrase: when Christ cometh, no man knoweth whence he is
    kind: history
    title: No man knoweth whence he is
    body: |
      No Jewish writing that survives from antiquity says that no one would know where the Christ came from, but some in the temple that day must have held the belief, for it was among them that men soon “sought to take him” (verse 30). Their reasoning was simple. They knew where Jesus came from, so He could not be the Christ.

      Jesus answers by crying out as He teaches (verse 28), raising His voice, it seems, so that everyone in the court will hear, not only the men questioning Him. Yes, they know whence He is; but He has not come of Himself. He is from the Father who sent Him, and the Father they do not know (verses 28–29). His origin is not a town but the Father: the words teach, as John does throughout, that the Son lived before His birth. Within a few verses others in the same crowd will turn the objection the other way round and say He cannot be the Christ because the Christ must come from Bethlehem (verse 42).
    sources: [matson-fourth-gospel]
  - ref: 37
    phrase: If any man thirst, let him come unto me, and drink
    kind: symbol
    title: Living water on the last day
    body: |
      On each morning of the feast a procession of priests went down from the temple to the pool of Siloam with singing and flutes, and a priest filled a golden flask with water while a choir sang “With joy shall ye draw water out of the wells of salvation” ([[Isa. 12:3]]). They came back through the Water Gate to a blast of the ram's horn, and the priest poured the water on the altar with the morning sacrifice while the people circled it; on the seventh day they circled it seven times. It was said that whoever had not seen the joy of the drawing of water did not know what joy is. Siloam was fed by the Gihon spring, so its water was “living water,” water from God's own sources, fit for the purifications of the law.

      On the eighth day, “that great day of the feast,” there was no water ceremony. That is the day Jesus stands, where a teacher would sit, and cries aloud for the crowd to come to Him and drink. Where the water had been, He offers Himself. In the prophets the Lord is “the fountain of living waters” ([[Jer. 2:13]]; [[Jer. 17:13]]), and in calling Himself the source of living water Jesus claims what belongs to Israel's God.

      “As the scripture hath said” points to no single verse: the words “out of his belly shall flow rivers of living water” are not found in the Old Testament as they stand, though the thought runs all through it, from the water out of the rock ([[Ex. 17:6]]) to the waters flowing out from the temple and from Jerusalem ([[Ezek. 47:1]]; [[Zech. 14:8]]). “Belly” is a Hebrew way of speaking of the inmost self, the heart, the seat of thought and feeling. What Jesus gives does not stay a drink; it becomes a river, and those who receive it carry it to others by the Spirit.
    sources: [gardner-tabernacles, bd-feasts, ellicott-john, thayer]
  - ref: 39
    phrase: for the Holy Ghost was not yet given
    kind: scripture
    title: The Holy Ghost not yet given
    body: |
      John does not mean that the Holy Ghost had never worked before; He was at work in earlier dispensations. The statement belongs to that dispensation only, and it concerns the gift of the Holy Ghost, not His power. The power of the Holy Ghost was at work in the ministries of John the Baptist and of Jesus, or no one would have gained a testimony of what they taught, as Peter did when “flesh and blood” had not revealed it to him ([[Matt. 16:16–17]]). Why the gift did not come in its fulness among the Jews during the Lord's mortal life the scriptures do not fully explain.

      The Joseph Smith Translation turns the absence into a promise: “for the Holy Ghost was promised unto them who believe, after that Jesus was glorified.” In John, Jesus is glorified by His death and resurrection, and He told the disciples that the Comforter would come only if He went away ([[John 16:7]]).
    sources: [bd-holy-ghost, huntsman-gospel-john, lds-scriptures]
  - ref: 42
    phrase: out of the town of Bethlehem, where David was
    kind: scripture
    title: The Prophet, the Christ, and Bethlehem
    body: |
      Verses 40–42 set three opinions side by side. “The Prophet” is the prophet like Moses that Moses promised ([[Deut. 18:15]]), whom Nephi names as Christ Himself (see the note on [[John 5:46]]). “The Christ” is the promised son of David, and the objection to Him came from scripture too. Of all the ancestors the prophecies give the Messiah, David is the only one this Gospel names ([[2 Sam. 7:12–16]]), and Micah had named Bethlehem as the place ([[Micah 5:2]]).

      Jesus had in fact been born in Bethlehem ([[Matt. 2:1]]), though He grew up in Galilee. John does not stop to correct the crowd with the fact, any more than he answers the question “will he do more miracles?” (verse 31). Those who called Him the Christ did so because they believed, not because every objection had been answered, and belief is what divides the crowd (verse 43).
    sources: [matson-fourth-gospel, sc-knowhy-869, lds-scriptures]
  - ref: 49
    phrase: this people who knoweth not the law are cursed
    kind: history
    title: This people who knoweth not the law
    body: |
      The officers sent to arrest Jesus were the temple police, and they came back without Him. The Pharisees answer them with a claim to authority. “The rulers” are the council, the Sanhedrin, whose duties included keeping false teaching out of Israel, and the Pharisees were the orthodox party of the day; none of these, they say, has believed. The crowd that has believed knows nothing of the law, and is accursed. The rabbis' writings are full of scorn for the untaught common people, as against those learned in the law, and the words here are that scorn.

      The boast is shaky even in the room where it is made. One of the rulers and Pharisees, Nicodemus, had come to Jesus by night and now asks that He be heard (verses 50–51), and before long, as He teaches again in the temple, many more will believe on Him ([[John 8:30]]).
    sources: [richardson-unorthodox-teacher, ellicott-john]
  - ref: 51
    phrase: Doth our law judge any man, before it hear him, and know what he doeth?
    kind: history
    title: Nicodemus speaks for a hearing
    body: |
      Nicodemus, “a man of the Pharisees” and “a ruler of the Jews” who had come to Jesus by night ([[John 3:1–2]]), is the one voice in the council raised for Jesus. He argues only from procedure: the law does not judge a man unless it first hears from him and learns what he has done. He asks for a hearing, not a verdict.

      Mild as the words are, it took courage to say them in that room. As a member of the council he could hardly have been ignorant of the plot that the people in the streets already knew of (verse 25), and he may well have expected a hostile answer; the rulers who believed kept their belief to themselves for fear of being put out of the synagogue ([[John 12:42]]). He did not press the point when they mocked him, and he is not yet an open disciple. But John follows him further. After the crucifixion he came openly with Joseph of Arimathea and a hundred pounds of myrrh and aloes to bury Jesus ([[John 19:39]]).
    sources: [ellicott-john, sandstrom-nicodemus, wilson-nicodemus]
  - ref: 52
    phrase: out of Galilee ariseth no prophet
    kind: scripture
    title: No prophet out of Galilee
    body: |
      The council's retort was not even true. Jonah the son of Amittai was “of Gath-hepher” ([[2 Kgs. 14:25]]), a town of Zebulun in Lower Galilee. Telling Nicodemus to search the records, they were not careful with the records themselves; Judean contempt for Galilee may have turned the saying into a byword.

      And there was a prophecy for Galilee. Isaiah promised light to “Galilee of the nations”: “The people that walked in darkness have seen a great light” ([[Isa. 9:1–2]]), and Matthew applies the promise to Jesus' coming to live in Capernaum ([[Matt. 4:13–16]]). When Jesus speaks again at the feast, after the account of the woman taken in adultery, His words echo that prophecy: “I am the light of the world: he that followeth me shall not walk in darkness” ([[John 8:12]]). Read that way, the man from Galilee is Himself the light Isaiah promised to Galilee.
    sources: [ellicott-john, sc-knowhy-869, lds-scriptures]
  - ref: 53
    phrase: And every man went unto his own house.
    kind: history
    title: The verse that begins the next story
    body: |
      This verse opens the account of the woman taken in adultery, which runs to [[John 8:11]]. The earliest manuscripts of the New Testament leave out this verse along with 8:1–11, and some manuscripts put the story elsewhere: after 7:36, at the end of John, or after [[Luke 21:38]]. The story nonetheless appears to have strong support as an event from the life of Jesus, though it may not first have stood here. What that means for the account itself is taken up with [[John 8:1–11]].
    sources: [densley-adultery]

christ: |
  At the feast of tabernacles water was drawn from Siloam and poured out before the Lord, and on the day the ceremony stopped Jesus stood and offered Himself in its place, the fountain of living waters, the one the Father sent (verses 37–38; [[Jer. 2:13]]). What He gives is the Spirit (verse 39), and it flows out from those who receive it.

  The way to it is the one He gave in the temple: whoever is willing to do the Father's will comes to know the doctrine (verse 17), because obedience enhances knowledge. The Lord gave the same promise in this dispensation: to the one who keeps His commandments He gives the mysteries of His kingdom, and they become in him a well of living water ([[D&C 63:23]]; see the note on [[John 4:10]]). Faithful obedience is how a disciple draws on that well now.

explore: |
  - **The feast behind John 7–9.** “Jesus Christ and the Feast of Tabernacles,” in *Learn of Me* (Religious Studies Center), reads the booths, the lamps, the water and the healing at Siloam together.
  - **Living water in John.** [[John 4:10–14]]; and at the same feast, the light of the world, [[John 8:12]].
  - **Nicodemus in John.** [[John 3:1–21]]; [[John 19:38–42]].

