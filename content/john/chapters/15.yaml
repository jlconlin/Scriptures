chapter: 15
title: I Am the True Vine
tagline: On the night before His death Jesus tells the eleven that He is the true vine and they are the branches; they bear fruit only as they abide in Him and in His love, and He calls them friends, for He is about to lay down His life for them; the world that hated Him will hate them, but the Comforter will testify of Him, and they will bear witness too.
when: 'The night before the crucifixion, after the supper ([[John 13:2]]; [[John 14:31]]), in the upper room or on the way out of the city'

setting: |
  John 15 is the middle of the farewell discourses, the long teaching Jesus gave the eleven after the supper ([[John 14:1]]–[[John 16:33]]), before the prayer of chapter 17. The other Gospels have nothing like these final words. They have something of a patriarch's or prophet's testament, the counsel given by a man about to die, and they draw in disciples of every age along with the first ones.

  Chapter 14 ends, “Arise, let us go hence” ([[John 14:31]]), yet the teaching goes straight on, and where this chapter was spoken is not certain (see the note on [[John 14:31]]). Not one word of the discourse depends on the place.

  The discourses have a shape. Chapters 14 and 16 speak of Jesus's going away; chapter 15, at the centre, speaks of His abiding presence with those who abide in Him.

thread: |
  **The branches live only by abiding in the vine; abiding in Him, they abide in His love, love one another, and stand together against a world that hates them.**

  The chapter turns on one word, “abide.” The first half (verses 1–17) is the disciples' union with Christ: the branch bears fruit only while it stays in the vine (verse 4), and the same union is put without the figure as keeping His commandments and continuing in His love (verses 9–10), which ends in love for one another (verses 12, 17). The second half (verses 18–27) turns to the world, and the contrast is sharp: love in verse 17, hatred in verse 18. They will need one another and their Lord the more, because of the hatred waiting for them. Against it stand two witnesses: the Spirit of truth, and the disciples themselves (verses 26–27).

sections:
  - range: 1-8
    heading: The vine and the branches
    plain: |
      “I am the true vine, and my Father is the vinedresser. Every branch in me that bears no fruit He takes away, and every branch that bears fruit He prunes, so that it will bear more fruit. You are already clean because of the word I have spoken to you. Abide in me, and I in you. A branch cannot bear fruit by itself unless it stays in the vine; neither can you unless you abide in me.

      “I am the vine; you are the branches. Whoever abides in me, and I in him, bears much fruit, for without me you can do nothing. Anyone who does not abide in me is thrown out like a branch and withers; such branches are gathered, thrown into the fire, and burned. If you abide in me and my words abide in you, ask whatever you will, and it will be done for you. My Father is glorified in this, that you bear much fruit; so you will be my disciples.”
  - range: 9-17
    heading: Continue in my love
    plain: |
      “As the Father has loved me, so I have loved you. Continue in my love. If you keep my commandments, you will abide in my love, just as I have kept my Father's commandments and abide in His love. I have told you these things so that my joy may be in you and your joy may be full.

      “This is my commandment: love one another as I have loved you. No one has greater love than this, to lay down his life for his friends. You are my friends if you do what I command you. I no longer call you servants, for a servant does not know what his master is doing; but I have called you friends, because I have made known to you everything I have heard from my Father. You did not choose me; I chose you and ordained you to go and bear fruit, fruit that will last, so that whatever you ask the Father in my name He may give you. These things I command you, so that you will love one another.”
  - range: 18-25
    heading: The world's hatred
    plain: |
      “If the world hates you, know that it hated me before it hated you. If you belonged to the world, the world would love its own. But you do not belong to the world; I chose you out of it, and that is why the world hates you. Remember what I told you: a servant is not greater than his master. If they persecuted me, they will persecute you; if they kept my word, they will keep yours. They will do all this to you because of my name, for they do not know the One who sent me.

      “If I had not come and spoken to them, they would not have sin; but now they have no excuse for their sin. Whoever hates me hates my Father too. If I had not done among them the works no one else did, they would not have sin; but now they have both seen and hated both me and my Father. This has happened to fulfil the word written in their law: ‘They hated me without a cause.’”
  - range: 26-27
    heading: The Spirit's witness and theirs
    plain: |
      “But when the Comforter comes, whom I will send to you from the Father, the Spirit of truth who comes from the Father, He will testify of me. And you also will bear witness, because you have been with me from the beginning.”

notes:
  - ref: 1
    phrase: I am the true vine, and my Father is the husbandman
    kind: symbol
    title: The true vine
    body: |
      The disciples knew this image from their scriptures, where the vine is Israel, planted and tended by the Lord. “Thou hast brought a vine out of Egypt: thou hast cast out the heathen, and planted it” ([[Ps. 80:8]]). Isaiah's song of the vineyard ends, “the vineyard of the LORD of hosts is the house of Israel,” and it had brought forth “wild grapes” ([[Isa. 5:2]], [[Isa. 5:7]]); through Jeremiah the Lord says, “I had planted thee a noble vine,” and asks how it has turned into “the degenerate plant of a strange vine” ([[Jer. 2:21]]). The figure that had stood for Israel Jesus now takes to Himself, and He calls Himself the “true” vine, meaning the real one: He is the reality of which every natural vine is only a picture. The husbandman is the owner who works his own vine and trains it, and that is the Father's part through the chapter.

      What brought the image to mind that night is unknown. A vineyard seen on the road, the vine carved on the temple doors, a vine at the window, and the cup they had just drunk, “the fruit of the vine,” have all been suggested, the cup perhaps most plausibly; the text does not say.

      This is one of John's “I am” sayings with a predicate, in which Jesus names Himself by an image that reflects His divine role. Nephi used the same name for the Messiah. Of the day when Israel comes to know its Redeemer, he asks, “will they not receive the strength and nourishment from the true vine?” and in the next breath speaks of Israel “grafted in” to “the true olive-tree” ([[1 Ne. 15:15–16]]), bringing the two images together. In both, the true vine is Christ.
    sources: [lds-scriptures, ellicott-john, huntsman-gospel-john, benson-joseph-smith-messiah]
  - ref: 2
    phrase: he purgeth it, that it may bring forth more fruit
    kind: words
    title: He purgeth it; ye are clean
    body: |
      “Purgeth” is the vinedresser's word for pruning. The Greek verb *kathairō* means to cleanse; of trees and vines, it means to clear away useless shoots, to prune. The word for “clean” in the next verse, *katharos*, is its root. The English hides a play in the Greek: the Father cleanses the fruitful branch, and “Now ye are clean” (verse 3). The vinedresser's two duties picture the Father's care of souls: He takes away the branch that bears nothing, and He cleans the one that bears so that it bears more.

      Pruning is not gentle. It cuts back shoots that run to waste, and sometimes a shoot that looked full of promise, and in a life it can come “by a pang sharp as the edge of the pruner's knife.” The verse gives the reason: “that it may bring forth more fruit.” The branch that is cut is the one that is bearing.

      The disciples are clean already “through the word which I have spoken unto you.” The word is His whole teaching, the revelation of God that had cleansed them by its power, not only what He said at the washing of feet ([[John 13:10]]). As branches of the vine they were that night clean and healthy “through the instructions and authoritative ordinances with which they had been blessed, and by the reverent obedience they had manifested.”
    sources: [thayer, greek-nt, ellicott-john, talmage-jesus-christ-33]
  - ref: 4
    phrase: Abide in me, and I in you
    kind: prophets
    title: Abide in me
    body: |
      To abide is to stay: to remain fixed and steady and to endure without giving way. The Greek verb, *menō*, also means to dwell or continue, and the idea of dwelling in Jesus runs through the farewell discourses. It is related to the “mansions” of [[John 14:2]], the places to dwell that Jesus goes to prepare; here, before He goes, He asks the disciples to dwell in Him now. The two halves of the command are cause and effect: “Abide in me” is the command, “and I in you” the promise that does not fail when the command is kept. The union is placed within the disciple's own will.

      In this dispensation, abiding in Christ begins with taking His yoke upon oneself in the covenants and ordinances of the restored gospel. Verse 10 gives the Lord's own summary of how it continues: “If ye keep my commandments, ye shall abide in my love.”

      The Lord said the same words to Enoch: “thou shalt abide in me, and I in you; therefore walk with me” ([[Moses 6:34]]). Enoch did not begin as a mighty prophet; his capacity grew over time as he learned to abide in and walk with the Son of God.
    sources: [bednar-abide-in-me, huntsman-thursday, ellicott-john, lds-scriptures]
  - ref: 5
    phrase: for without me ye can do nothing
    kind: christ
    title: Without me ye can do nothing
    body: |
      The branch has no life of its own. It bears fruit only by the sap that comes to it from the rooted vine, and cut off, it withers and is good for nothing but the fire. The men Jesus said this to had been ordained apostles, and they would be strong and fruitful in good works only while they stayed in steadfast communion with Him. “Without Christ what were they, but unschooled Galileans, some of them fishermen, one a publican, the rest of undistinguished attainments, and all of them weak mortals?”

      The figure also says how the fruit comes. A branch does not strain to produce grapes; it grows them because it is joined to the vine. The covenants are Christ's way of joining us to the source of life so that we can bring forth fruit and have His power in our lives.
    sources: [talmage-jesus-christ-33, lane-covenants-true-vine]
  - ref: 6
    phrase: he is cast forth as a branch, and is withered
    kind: symbol
    title: Cast forth as a branch
    body: |
      Verse 6 pictures the end of a branch that will not abide. In a vineyard such a branch was cut away, left to wither, gathered into bundles with others, and burned. In the Greek the verbs move from the past tense to the present (“they burn”). One explanation is that the burning of withered branches suggests the final judgment, and the verse is spoken as if from that day.

      The branches cast forth are not the world outside. They are branches “in me” (verse 2): people joined to the true vine at least in name, whom the Father knows from within. The difference between the fruitful branch and the withered one is the one verse 4 puts in the disciple's own hands. The man in verse 6 is one who will not abide.
    sources: [ellicott-john]
  - ref: 7
    phrase: ye shall ask what ye will, and it shall be done unto you
    kind: scripture
    title: Ask what ye will
    body: |
      The promise is wide, and the condition is in the same sentence: “If ye abide in me, and my words abide in you.” His words abiding in them are both the means by which they abide in Him and the proof that they do. Those in whom His words abide pray in His name, and the promise is the one He has just given about asking in His name ([[John 14:13–14]]).

      Prayer, in the Restoration's teaching, is the act by which the will of the Father and the will of the child are brought into correspondence. Its object is not to change God's will but to obtain blessings He is already willing to give and has made conditional on our asking. The risen Lord gave the Nephites the same promise with its condition spelled out: “whatsoever ye shall ask the Father in my name, which is right, believing that ye shall receive, behold it shall be given unto you” ([[3 Ne. 18:20]]).
    sources: [ellicott-john, bd-prayer, lds-scriptures]
  - ref: 10
    phrase: If ye keep my commandments, ye shall abide in my love
    kind: prophets
    title: Abide in my love
    body: |
      Verse 10 sets a condition on abiding in His love, and it means what it says. Divine love can be called perfect, infinite, enduring and universal, but it “cannot correctly be characterized as unconditional.” The word is not in the scriptures; many verses instead tie the higher levels of the love of the Father and the Son, and the blessings that come from it, to conditions, and this verse is one of them: if ye keep my commandments, then ye shall abide in my love.

      The condition is not arbitrary. Jesus gives Himself as the pattern: “even as I have kept my Father's commandments, and abide in his love.” Keeping the commandments is what love does, and it is as true of the Son's love for the Father as of the disciple's love for the Son. The Son abides in the Father's love by obeying Him, and the disciple abides in the Son's love the same way.
    sources: [nelson-divine-love, ellicott-john]
  - ref: 13
    phrase: Greater love hath no man than this, that a man lay down his life for his friends
    kind: christ
    title: Greater love hath no man
    body: |
      Jesus has just made His own love the measure of theirs: “love one another, as I have loved you” (verse 12; compare [[John 13:34]]). Verse 13 says what His love was. Nothing greater than giving one's life can be thought of, and He was about to give that supreme proof of His love. The good shepherd had said He would give His life for the sheep ([[John 10:11]]); now He says it to the sheep themselves.

      He says “friends” because the men He was speaking to were His friends, not to limit whom He died for. Paul's “while we were yet sinners, Christ died for us” ([[Rom. 5:8]]) does not contradict it; the verse is about how great the love is. John drew the consequence in his first epistle: “Hereby perceive we the love of God, because he laid down his life for us: and we ought to lay down our lives for the brethren” ([[1 Jn. 3:16]]).
    sources: [ellicott-john, talmage-jesus-christ-33, lds-scriptures]
  - ref: 15
    phrase: Henceforth I call you not servants
    kind: scripture
    title: Not servants, but friends
    body: |
      The word for “servant” is *doulos*, a bond-servant or slave. In the contrast Jesus draws, such a servant obeys without being told his master's purpose; a friend is told. Jesus had treated the disciples as sharers in His work, keeping back from them nothing they could understand of what the Father had given Him. That He had more to say ([[John 16:12]]) is no contradiction: the limit was in what they could then receive, and the Spirit would teach them the rest.

      The friendship did not make Him any less their Lord and Master; they had been chosen and ordained by Him, and the apostles went on calling themselves His servants (as in [[Rom. 1:1]] and [[James 1:1]]). The Lord has called His servants friends in the latter days too: in 1832 He told the high priests of the Church, “you are mine apostles, even God's high priests; … ye are my friends” ([[D&C 84:63]]), the passage the Gospel Library's footnote to verse 14 points to.
    sources: [ellicott-john, talmage-jesus-christ-33, lds-scriptures]
  - ref: 16
    phrase: I have chosen you, and ordained you
    kind: words
    title: Chosen and ordained
    body: |
      Jesus, not the disciples, made the choice, and He appointed them to bear fruit that would last. He had said it before: “Have not I chosen you twelve?” ([[John 6:70]]). The Twelve rarely appear as a group in John, and this is one of the few places they are addressed together. The word translated “ordained” is *etheka*, from *tithēmi*, to set or place; with a purpose clause, as here, it means to appoint someone to a service. The service is in the verse: “that ye should go and bring forth fruit, and that your fruit should remain.”

      The King James word also holds. The men in the room had received the authority of the Holy Priesthood from Him. Chosen and set apart from the world by ordination, they could not hope to escape its hatred, and that is where Jesus turns next: “I have chosen you out of the world, therefore the world hateth you” (verse 19).
    sources: [lds-scriptures, huntsman-gospel-john, thayer, greek-nt, talmage-jesus-christ-33]
  - ref: 19
    phrase: I have chosen you out of the world, therefore the world hateth you
    kind: words
    title: Chosen out of the world
    body: |
      In John, “the world” stands over against those who come to know Jesus and believe: much of it rejects Him. Its love is selfish: it would love in the disciples only what was its own. Earlier Jesus told His brothers that the world could not hate them, “but me it hateth, because I testify of it, that the works thereof are evil” ([[John 7:7]]). Now the disciples are to be hated too, and that very hatred shows the change in them: they no longer belong to the world.

      The warning has a purpose. Jesus wanted them forewarned, so that the persecution to come would not take them by surprise and make them stumble ([[John 16:1]]). The hatred was even a bond with their Master: “it hated me before it hated you” (verse 18), and they would suffer it “for my name's sake” (verse 21). Its cause, He says, is not knowing God: “because they know not him that sent me.”
    sources: [huntsman-gospel-john, ellicott-john, talmage-jesus-christ-33]
  - ref: 22
    phrase: now they have no cloak for their sin
    kind: words
    title: No cloak for their sin
    body: |
      A cloak covers a thing and hides it; here the sense is an excuse, something to cover a sin that is plain to see. Those who heard Jesus speak, saw His works and still hated Him (verse 24) were left without excuse. The truth was before them, and it would have convinced and saved them; instead they answered His works by saying that He was a sinner and had a devil.

      The verse rests on a principle Restoration scripture states plainly. Where there is no law given, there is no condemnation ([[2 Ne. 9:25]]); but “he who sins against the greater light shall receive the greater condemnation” ([[D&C 82:3]]). Jesus said the same to the Pharisees after He healed the man born blind: “now ye say, We see; therefore your sin remaineth” ([[John 9:41]]).
    sources: [ellicott-john, talmage-jesus-christ-33, lds-scriptures]
  - ref: 25
    phrase: that the word might be fulfilled that is written in their law, They hated me without a cause
    kind: scripture
    title: Written in their law
    body: |
      The words are from the Psalms, not the law of Moses. As at [[John 12:34]], “the law” means the scriptures as a whole, as when Jesus quotes a psalm as “your law” ([[John 10:34]]). The line is most likely from Psalm 69, “They that hate me without a cause are more than the hairs of mine head” ([[Ps. 69:4]]), a psalm John has quoted before ([[John 2:17]]); it is in Psalm 35 as well ([[Ps. 35:19]]).

      Many a sufferer before Him could have said the words truly. They were “fulfilled,” true in their full sense, only in the one Sufferer who had no sin, whom the world hated with no reason at all.
    sources: [ellicott-john, lds-scriptures]
  - ref: 26
    phrase: he shall testify of me
    kind: scripture
    title: Two witnesses
    body: |
      The Comforter, who in [[John 14:26]] is named the Holy Ghost (on the word, see the note on [[John 14:16]]), will come after Jesus goes. The Spirit will do for the disciples what Jesus did while He was with them, and one of those things is to bear witness of Him. Because He “proceedeth from the Father,” His witness is the Father's own.

      Verse 27 adds a second witness: “And ye also shall bear witness, because ye have been with me from the beginning.” The beginning is the start of the ministry they were to testify of, and when the apostles later chose a man to take Judas's place, they set the same condition, one who had been with them “beginning from the baptism of John” ([[Acts 1:22]]). The apostles kept the two witnesses apart and named both, what they had seen and heard for themselves and what the Holy Ghost bore witness of: “we are his witnesses of these things; and so is also the Holy Ghost, whom God hath given to them that obey him” ([[Acts 5:32]]).
    sources: [huntsman-thursday, ellicott-john, lds-scriptures]

christ: |
  Jesus is the true vine, and the life of every branch flows from Him; without Him His disciples can do nothing. He loved His friends to the limit of love, laying down His life for them within hours of these words, and He sent the Spirit of truth to testify of Him when He was gone.

  The promise of verse 4 is not reserved for the eleven: “The Savior's promise to abide in us is true and available to every covenant-keeping member of His restored Church.” A disciple abides in Him through the covenants and ordinances, through prayer in His name, through the sacrament and through serving others, and as the disciple abides, He abides in that disciple, and much fruit follows.

explore: |
  - **How to abide.** Elder David A. Bednar's “Abide in Me, and I in You; Therefore Walk with Me” (April 2023 general conference) reads verse 4 with the Lord's words to Enoch.
  - **The vine and the covenants.** “Covenants and the True Vine,” in *Finding Christ in the Covenant Path*, reads verse 5 as a picture of life through covenant.
  - **The vine of Israel.** [[Isa. 5:1–7]] and [[Ps. 80:8–19]], the vine the Lord planted; and [[1 Ne. 15:12–16]], where Nephi joins the true vine to the olive tree.
  - **The rest of the discourse.** [[John 14]], where the Comforter is first promised, and [[John 16]], where Jesus tells them more of the Spirit's work and of His going away.

