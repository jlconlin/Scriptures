chapter: 15
title: I Am the True Vine
tagline: On the night before His death Jesus tells the eleven that He is the true vine and they are the branches; they bear fruit only as they abide in Him and in His love, and He calls them friends, for He is about to lay down His life for them; the world that hated Him will hate them, but the Comforter will testify of Him, and they will bear witness too.
when: 'The night before the crucifixion, after the supper ([[John 13:2]]), between “Arise, let us go hence” ([[John 14:31]]) and the going out over the brook Cedron ([[John 18:1]])'

setting: |
  John 15 stands in the middle of the discourses Jesus gave His disciples on the night of the Last Supper, chapters 13–17, before He went out to the garden where He would be arrested. No other Gospel has them. In them He taught His followers, those in the room and those who would come after, the principles of love and service, all of it focused on Himself as Savior and friend.

  Chapter 14 ends, “Arise, let us go hence” ([[John 14:31]]), yet the teaching goes straight on, and John says that Jesus “went forth with his disciples over the brook Cedron” only after the prayer of chapter 17 ([[John 18:1]]). So where this chapter was spoken is not known; they may already have left the upper room and been walking toward Gethsemane (see the note on [[John 14:31]]).

  The discourses have a shape. Chapters 14 and 16 are a pair: in both Jesus teaches why He must go, and in both He sets against their sorrow the promise of the Comforter. Between them stands the vine. Though He would no longer be with them in body, they could still abide in Him and draw their life from Him, as branches draw theirs from the vine.

thread: |
  **The branches live only by abiding in the vine; abiding in Him, they abide in His love, love one another, and stand together against a world that hates them.**

  The chapter turns on one word, “abide,” which Jesus uses seven times in verses 4–7. The first half (verses 1–17) is the disciples' union with Christ: the branch bears fruit only while it stays in the vine (verse 4), and the same union is put without the figure as keeping His commandments and continuing in His love (verses 9–10), which ends in love for one another (verses 12, 17). He was about to leave them, and abiding is how they would live from Him when He was gone. The second half (verses 18–27) turns to the world: verse 17 ends “that ye love one another,” and verse 18 begins, “If the world hate you.” Against that hatred stand two witnesses: the Spirit of truth, and the disciples themselves (verses 26–27).

sections:
  - range: 1-8
    heading: The vine and the branches
    plain: |
      “I am the true vine, and my Father is the vinedresser. Every branch in me that bears no fruit He takes away, and every branch that bears fruit He prunes, so that it will bear more fruit. You are already clean because of the word I have spoken to you. Abide in me, and I in you. A branch cannot bear fruit by itself unless it stays in the vine; neither can you unless you abide in me.

      “I am the vine; you are the branches. Whoever abides in me, and I in him, bears much fruit, for without me you can do nothing. Anyone who does not abide in me is thrown out like a branch and withers; such branches are gathered, thrown into the fire, and burned. If you abide in me and my words abide in you, ask whatever you will, and it will be done for you. My Father is glorified in this, that you bear much fruit; so you will be my disciples.”
  - range: 9-17
    heading: Continue in my love
    plain: |
      “As the Father has loved me, so I have loved you. Continue in my love. If you keep my commandments, you will abide in my love, just as I have kept my Father's commandments and abide in His love. I have told you these things so that my joy may be in you and your joy may be full.

      “This is my commandment: love one another as I have loved you. No one has greater love than this, to lay down his life for his friends. You are my friends if you do what I command you. I no longer call you servants, for a servant does not know what his master is doing; but I have called you friends, because I have made known to you everything I have heard from my Father. You did not choose me; I chose you and ordained you to go and bear fruit, fruit that will last, so that whatever you ask the Father in my name He may give you. These things I command you, so that you will love one another.”
  - range: 18-25
    heading: The world's hatred
    plain: |
      “If the world hates you, know that it hated me before it hated you. If you belonged to the world, the world would love its own. But you do not belong to the world; I chose you out of it, and that is why the world hates you. Remember what I told you: a servant is not greater than his master. If they persecuted me, they will persecute you; if they kept my word, they will keep yours. They will do all this to you because of my name, for they do not know the One who sent me.

      “If I had not come and spoken to them, they would not have sin; but now they have no excuse for their sin. Whoever hates me hates my Father too. If I had not done among them the works no one else did, they would not have sin; but now they have both seen and hated both me and my Father. This has happened to fulfil the word written in their law: ‘They hated me without a cause.’”
  - range: 26-27
    heading: The Spirit's witness and theirs
    plain: |
      “But when the Comforter comes, whom I will send to you from the Father, the Spirit of truth who comes from the Father, He will testify of me. And you also will bear witness, because you have been with me from the beginning.”

notes:
  - ref: 1
    phrase: I am the true vine, and my Father is the husbandman
    kind: symbol
    title: The true vine
    body: |
      The disciples knew this image from their scriptures, where the vine is Israel, planted and tended by the Lord. “Thou hast brought a vine out of Egypt: thou hast cast out the heathen, and planted it” ([[Ps. 80:8]]). Isaiah's song of the vineyard ends, “the vineyard of the LORD of hosts is the house of Israel,” and it had brought forth “wild grapes” ([[Isa. 5:2]], [[Isa. 5:7]]); through Jeremiah the Lord says, “I had planted thee a noble vine,” and asks how it has turned into “the degenerate plant of a strange vine” ([[Jer. 2:21]]). The figure that had stood for Israel Jesus now takes to Himself, and He calls Himself the “true” vine. The Greek *alēthinos* is the word for what is genuine, set against what is imperfect, defective or frail, and John uses it of the “true bread from heaven” as well ([[John 6:32]]). The husbandman is the owner who works his own vine and trains it, and that is the Father's part through the chapter.

      This is one of John's “I am” sayings with a predicate, in which Jesus names Himself by an image that reflects His divine role. Nephi used the same name for the Messiah. Of the day when Israel comes to know its Redeemer, he asks, “will they not receive the strength and nourishment from the true vine?” and in the next breath speaks of Israel “grafted in” to “the true olive-tree” ([[1 Ne. 15:15–16]]), bringing the two images together. In both, the true vine is Christ.
    sources: [lds-scriptures, thayer, ellicott-john, huntsman-gospel-john, benson-joseph-smith-messiah]
  - ref: 2
    phrase: he purgeth it, that it may bring forth more fruit
    kind: words
    title: He purgeth it; ye are clean
    body: |
      “Purgeth” is the vinedresser's word for pruning. The Greek verb *kathairō* means to cleanse; of trees and vines, it means to clear away useless shoots, to prune, and the footnote gives it as “purifies.” The word for “clean” in the next verse, *katharos*, is its root. The English hides a play in the Greek: the Father cleanses the fruitful branch, and “Now ye are clean” (verse 3).

      A vinedresser prunes in two steps. In winter he cuts off and carries away the dry and withered branches; in spring, when the vine puts out new leaves, he pinches the smaller shoots off the fruit-bearing branches, so that the nourishment goes to the good branches and they bear still more. Both of the Father's acts in verse 2 are there: He takes away the branch that bears nothing, and He prunes the branch that bears, “that it may bring forth more fruit.” The branch that is cut is the one that is bearing. Elsewhere the same word is rendered “cleanse” or “purify,” of being free from moral stain, and for a disciple that cleansing comes by repenting, in faith that Christ will purge the evil away.

      The disciples are clean already “through the word which I have spoken unto you”: the cleansing comes through His word, heard and heeded.
    sources: [thayer, greek-nt, olson-new-commandment, lds-scriptures]
  - ref: 4
    phrase: Abide in me, and I in you
    kind: prophets
    title: Abide in me
    body: |
      To abide is to stay: to remain fixed and steady and to endure without giving way. The Greek verb, *menō*, also means to dwell, to continue in, or to persist with. Jesus was about to leave them, and what He asks is that they go on dwelling in Him when He is gone, and He in them.

      In this dispensation, abiding in Christ begins with taking His yoke upon oneself in the covenants and ordinances of the restored gospel. Verse 10 gives the Lord's own summary of how it continues: “If ye keep my commandments, ye shall abide in my love.”

      The Lord said the same words to Enoch: “thou shalt abide in me, and I in you; therefore walk with me” ([[Moses 6:34]]). Enoch did not begin as a mighty prophet; his capacity grew over time as he learned to abide in and walk with the Son of God.
    sources: [bednar-abide-in-me, huntsman-thursday, lds-scriptures]
  - ref: 5
    phrase: for without me ye can do nothing
    kind: christ
    title: Without me ye can do nothing
    body: |
      The branch has no life of its own. It bears fruit only by the sap that comes to it from the rooted vine, and cut off, it withers and is good for nothing but the fire, as Ezekiel had said of the vine's wood: “Behold, it is cast into the fire for fuel” ([[Ezek. 15:4]]); verse 6 says it of the man who does not abide. The men Jesus said this to had been ordained apostles, and they would be strong and fruitful in good works only while they stayed in steadfast communion with Him. “Without Christ what were they, but unschooled Galileans, some of them fishermen, one a publican, the rest of undistinguished attainments, and all of them weak mortals?”

      The figure also says how the fruit comes. A branch does not strain to produce grapes; it grows them because it is joined to the vine. The covenants are Christ's way of joining us to the source of life so that we can bring forth fruit and have His power in our lives.
    sources: [talmage-jesus-christ-33, lane-covenants-true-vine, lds-scriptures]
  - ref: 7
    phrase: ye shall ask what ye will, and it shall be done unto you
    kind: scripture
    title: Ask what ye will
    body: |
      The promise is wide, and the condition is in the same sentence: “If ye abide in me, and my words abide in you.” It is one of the passages that teach disciples to pray in Christ's name (see the note on [[John 14:13]]; [[John 16:23–24]]), and what it adds is the condition. Where His words abide in us, we ask for what God can grant, and it is to prayer of that kind that the promise is made.

      Prayer, in the Restoration's teaching, is the act by which the will of the Father and the will of the child are brought into correspondence. Its object is not to change God's will but to obtain blessings He is already willing to give and has made conditional on our asking. The risen Lord gave the Nephites the same promise with its condition spelled out: “whatsoever ye shall ask the Father in my name, which is right, believing that ye shall receive, behold it shall be given unto you” ([[3 Ne. 18:20]]).
    sources: [bd-prayer, lds-scriptures]
  - ref: 10
    phrase: If ye keep my commandments, ye shall abide in my love
    kind: prophets
    title: Abide in my love
    body: |
      Verse 10 sets a condition on abiding in His love. Divine love can be called perfect, infinite, enduring and universal, but it “cannot correctly be characterized as unconditional.” The word “unconditional” does not appear in the scriptures; many verses instead tie the higher levels of the love of the Father and the Son, and the blessings that come from it, to conditions, and this verse is one of them: if ye keep my commandments, then ye shall abide in my love.

      Jesus gives Himself as the pattern for the condition: “even as I have kept my Father's commandments, and abide in his love.” The Son abides in the Father's love by keeping His commandments, and the disciple abides in the Son's love the same way.
    sources: [nelson-divine-love]
  - ref: 13
    phrase: Greater love hath no man than this, that a man lay down his life for his friends
    kind: christ
    title: Greater love hath no man
    body: |
      Jesus has just made His own love the measure of theirs: “love one another, as I have loved you” (verse 12; compare [[John 13:34]]). Verse 13 says what His love was. He said it on the eve of His crucifixion, shortly before Gethsemane, knowing that His hour had come, and the next day He laid down His own life ([[John 19:30]]).

      The friends of verse 13 are the men in the room: “Ye are my friends,” He goes on, “if ye do whatsoever I command you” (verse 14). Paul names what makes such love greater still: “while we were yet sinners, Christ died for us” ([[Rom. 5:8]]). John drew the consequence for disciples in his first epistle, the passage the footnote to this verse gives: “Hereby perceive we the love of God, because he laid down his life for us: and we ought to lay down our lives for the brethren” ([[1 Jn. 3:16]]).
    sources: [olson-new-commandment, lds-scriptures]
  - ref: 15
    phrase: Henceforth I call you not servants
    kind: scripture
    title: Not servants, but friends
    body: |
      The word for “servant” is *doulos*, a slave or bondman. The verse gives the contrast itself: “the servant knoweth not what his lord doeth,” but a friend is told, and Jesus has made known to them “all things that I have heard of my Father.” The footnote sets beside it His words later in the same discourse, “I have yet many things to say unto you, but ye cannot bear them now” ([[John 16:12]]): what He had not yet told them waited on what they could bear.

      The Lord has called His servants friends in the latter days too, in the same words. In 1832 He told the high priests of the Church, “you are mine apostles, even God's high priests; … ye are my friends” ([[D&C 84:63]]), the passage the footnote to verse 14 points to. Later in the same revelation He said, “from henceforth I shall call you friends,” and bade them become “even as my friends in days when I was with them, traveling to preach the gospel in my power” ([[D&C 84:77]]).
    sources: [thayer, greek-nt, lds-scriptures]
  - ref: 16
    phrase: I have chosen you, and ordained you
    kind: words
    title: Chosen and ordained
    body: |
      Jesus, not the disciples, made the choice, and He appointed them to bear fruit that would last. He had said it before: “Have not I chosen you twelve?” ([[John 6:70]]). The word translated “ordained” is *etheka*, from *tithēmi*, to set or place; with a purpose clause, as here, it means to appoint someone to a service. The service is in the verse: “that ye should go and bring forth fruit, and that your fruit should remain.”

      The King James word also holds. These were the Twelve, whom He chose and ordained to be His closest disciples and would send forth to represent Him after His Ascension. Chosen and set apart in this way, they could not hope to escape the world's hatred, and that is where Jesus turns next: “I have chosen you out of the world, therefore the world hateth you” (verse 19).
    sources: [lds-scriptures, thayer, greek-nt, bd-apostle]
  - ref: 19
    phrase: I have chosen you out of the world, therefore the world hateth you
    kind: words
    title: Chosen out of the world
    body: |
      In John, “the world” stands over against those who come to know Jesus and believe: much of it rejects Him. The verse gives the reason for its hatred of the disciples: the world loves “his own,” and they are no longer its own, because Jesus has chosen them out of it. Earlier He told His brothers that the world could not hate them, “but me it hateth, because I testify of it, that the works thereof are evil” ([[John 7:7]]). Now the disciples, chosen out of the world, are to be hated as He was.

      The warning has a purpose. Jesus wanted them forewarned, so that the persecution to come would not take them by surprise and make them stumble ([[John 16:1]]). They would share His lot: “it hated me before it hated you” (verse 18), and they would suffer it “for my name's sake” (verse 21). Its cause, He says, is not knowing God: “because they know not him that sent me.”
    sources: [huntsman-gospel-john, ellicott-john, talmage-jesus-christ-33]
  - ref: 22
    phrase: now they have no cloak for their sin
    kind: words
    title: No cloak for their sin
    body: |
      “Cloak” here means, as the footnote gives it, a “pretext, excuse.” The Greek *prophasis* is an alleged reason or pretended cause, and to have none “for their sin” is to have nothing left to plead. Those who had heard Jesus speak and seen His works, and still hated Him and His Father (verses 22, 24), were in that place.

      The verse rests on a principle Restoration scripture states plainly, and the footnotes give it. Where there is no law given, there is no condemnation ([[2 Ne. 9:25]]); but “he who sins against the greater light shall receive the greater condemnation” ([[D&C 82:3]]). Alma says it of knowing God's will: “how much more cursed is he that knoweth the will of God and doeth it not” ([[Alma 32:19]]). Jesus said the same to the Pharisees after He healed the man born blind: “now ye say, We see; therefore your sin remaineth” ([[John 9:41]]).
    sources: [lds-scriptures, thayer]
  - ref: 25
    phrase: that the word might be fulfilled that is written in their law, They hated me without a cause
    kind: scripture
    title: Written in their law
    body: |
      The words are from the Psalms, not the law of Moses. “Law” here reaches beyond the five books of Moses to the scriptures they headed, as when Jesus quotes Psalm 82 as “your law” ([[John 10:34]]). “Hate me without a cause” is the same Hebrew phrase in two psalms, [[Ps. 35:19]] and [[Ps. 69:4]], and John does not say which the Lord had in mind; the note on Psalm 35:19 sets them side by side.

      Psalm 69 is headed “A messianic psalm of David,” and its sufferer says, “They that hate me without a cause are more than the hairs of mine head.” His enemies are his enemies “wrongfully,” and he is made to restore “that which I took not away” ([[Ps. 69:4]]): he has done nothing to earn their hatred. Jesus says the line was “fulfilled” in Him. Those who hated Him had heard His words and seen His works (verses 22–24), and hated Him still, without a cause.
    sources: [bdb, lds-scriptures]
  - ref: 26
    phrase: he shall testify of me
    kind: scripture
    title: Two witnesses
    body: |
      Verses 26–27 name two witnesses who will testify of Jesus after He goes: the Comforter and the disciples themselves. The Comforter, who in [[John 14:26]] is named the Holy Ghost (on the word, see the note on [[John 14:16]]), is sent to believers because Jesus will no longer be with them, and here His work is to bear witness: “he shall testify of me.” It is by the power of the Holy Ghost that a person receives a testimony of Jesus Christ and of His work.

      The second witness is theirs: “And ye also shall bear witness, because ye have been with me from the beginning,” from the start of the teaching and works they were to testify of. When the Eleven chose a man to take Judas's place, he had to be one who had been with them “beginning from the baptism of John,” to be “a witness with us of his resurrection” ([[Acts 1:22]]). That remains the Apostles' calling: to be special witnesses of the name of Jesus Christ in all the world, above all of His divinity and of His bodily resurrection ([[D&C 107:23]]).
    sources: [huntsman-lamb-of-god, bd-holy-ghost, ellicott-john, bd-apostle, lds-scriptures]

christ: |
  Jesus is the true vine, and the life of every branch flows from Him; without Him His disciples can do nothing. He loved His friends with the greatest love there is, laying down His life for them the day after these words, and He sent the Spirit of truth to testify of Him when He was gone.

  The promise of verse 4 is not reserved for the eleven: “The Savior's promise to abide in us is true and available to every covenant-keeping member of His restored Church.” A disciple abides in Him through the covenants and ordinances, through the sacrament and through serving others, and as the disciple abides, He abides in that disciple, and much fruit follows.

explore: |
  - **How to abide.** Elder David A. Bednar's “Abide in Me, and I in You; Therefore Walk with Me” (April 2023 general conference) reads verse 4 with the Lord's words to Enoch.
  - **The vine and the covenants.** “Covenants and the True Vine,” in *Finding Christ in the Covenant Path*, reads verse 5 as a picture of life through covenant.
  - **The vine of Israel.** [[Isa. 5:1–7]] and [[Ps. 80:8–19]], the vine the Lord planted; and [[1 Ne. 15:12–16]], where Nephi joins the true vine to the olive tree.
  - **The rest of the discourse.** [[John 14]], where the Comforter is first promised, and [[John 16]], where Jesus tells them more of the Spirit's work and of His going away.

