chapter: 2
title: Thou Hast Kept the Good Wine until Now
tagline: At a wedding in Cana Jesus turns the water of purification into the best wine of the feast, His first sign; at the Passover in Jerusalem He drives the traders from His Father’s house and speaks of a temple to be destroyed and raised in three days.
when: 'The start of Jesus’s ministry, days after the first disciples follow Him ([[John 1:35–51]]), and the first Passover John names'

setting: |
  Chapter 1 ended with the first disciples: two of the Baptist’s followers, Andrew and another, then Simon, Philip and Nathanael ([[John 1:35–51]]). “The third day” after that, Jesus and these disciples are at a wedding in Cana, Nathanael’s own town ([[John 21:2]]). From there they go down to Capernaum, and then up to Jerusalem for the Passover.

  Neither story is told in another Gospel. Matthew, Mark and Luke each tell of a clearing of the temple in the last week of Jesus’s life ([[Matt. 21:12–13]]; [[Mark 11:15–17]]; [[Luke 19:45–46]]); John sets a clearing here, at the beginning of His ministry.

  The chapter opens a unit of John that runs to the end of chapter 4 and is framed by two miracles at Cana, the water made wine and the healing of the nobleman’s son ([[John 4:46–54]]). The stories between them, Nicodemus and the woman at the well among them, stress newness, above all the new life Jesus has come to bring. The Passover of verse 13 is the first of three that John names (2:13; 6:4; 11:55); a fourth feast (5:1) is often taken to be a Passover as well, so in John the ministry lasts two or three years.

thread: |
  **John 2 sets Jesus beside two things at the heart of Israel’s worship, the water of purification and the temple, and in both He brings something new.**

  At Cana six stone jars stand ready for the washings the law required, and when Jesus has spoken, they hold the best wine of the feast. Traditional readings have seen in this the old law fulfilled by the richer life Christ offers. In Jerusalem He clears the temple courts of the traders and the money changers, and when He is asked for a sign, He speaks of another temple, destroyed and raised in three days. John explains that He meant His body.

  Both scenes look ahead. At Cana He says His hour has not yet come, and that hour, in John, is the cross. At the temple His disciples understand His words only after He has risen (verse 22). Between the two runs a contrast in belief. The disciples see His glory at Cana and believe on Him (verse 11). At the feast many believe because they see His signs, and the next verse uses the same verb to say that He did not entrust Himself to them (verses 23–24).

sections:
  - range: 1-12
    heading: The marriage at Cana
    plain: |
      On the third day there was a wedding at Cana in Galilee, and the mother of Jesus was there. Jesus and His disciples had been invited to the wedding too. When the wine ran out, His mother said to Him, “They have no wine.” Jesus said to her, “Woman, what have I to do with you? My hour has not yet come.” His mother said to the servants, “Do whatever He tells you.”

      Six stone water jars stood there, kept for the Jewish rites of purification, each holding about eighteen to twenty-seven gallons. Jesus said to the servants, “Fill the jars with water,” and they filled them to the brim. Then He said, “Now draw some out and take it to the master of the feast,” and they did. The master of the feast tasted the water that had become wine. He did not know where it had come from, though the servants who had drawn the water knew. He called the bridegroom and said to him, “Everyone serves the good wine first, and the poorer wine after the guests have drunk freely. But you have kept the good wine until now.”

      This, at Cana in Galilee, was the first of the signs Jesus did. In it He showed His glory, and His disciples believed in Him. After this He went down to Capernaum with His mother, His brothers and His disciples, and they stayed there only a few days.
  - range: 13-22
    heading: The first clearing of the temple
    plain: |
      The Passover of the Jews was near, and Jesus went up to Jerusalem. In the temple courts He found people selling oxen, sheep and doves, and the money changers sitting at their tables. He made a whip out of cords and drove them all out of the temple, with the sheep and the oxen. He poured out the money changers’ coins and overturned their tables, and He said to those who sold doves, “Take these things out of here. Do not make my Father’s house a marketplace.” His disciples remembered that it is written, “Zeal for your house has consumed me.”

      Then the Jews answered Him, “What sign do you show us for doing these things?” Jesus answered, “Destroy this temple, and in three days I will raise it up.” The Jews said, “This temple has been under construction for forty-six years, and you will raise it up in three days?” But the temple He spoke of was His body. So when He had risen from the dead, His disciples remembered that He had said this, and they believed the scripture and the word Jesus had spoken.
  - range: 23-25
    heading: Belief at the feast
    plain: |
      While He was in Jerusalem at the Passover feast, many believed in His name when they saw the signs He was doing. But Jesus did not entrust Himself to them, because He knew all people. He did not need anyone to tell Him about a person, for He knew what was in each one.

notes:
  - ref: 1
    phrase: there was a marriage in Cana of Galilee
    kind: history
    title: A wedding in Cana
    body: |
      John never says whose wedding it was or names the bride and groom. Jesus and His disciples were “called,” invited as guests. Cana is the town of Nathanael, who had just become a disciple ([[John 21:2]]). Mary had some responsibility at the feast, it seems: she brings the need to Jesus, and she gives the servants their instructions (verse 5). Jesus’s presence can be taken, at the least, to show that He approved of marriage and was glad to celebrate it.
    sources: [huntsman-family-john, talmage-jesus-christ-11]
  - ref: 4
    phrase: Woman, what have I to do with thee?
    kind: words
    title: Woman, what wilt thou have me to do?
    body: |
      To an English reader, “Woman” sounds cold from a son to his mother, but here it was likely meant the other way. As a form of address, the Greek *gynai* could carry indignation, admiration, kindness or respect, and this verse belongs with the respectful uses. Jesus uses the same word to His mother from the cross, as He gives her into the care of the beloved disciple ([[John 19:26]]).

      Mary’s “They have no wine” was a request, and perhaps already a respectful expectation that He would act. “What have I to do with thee?” is the harder phrase, and Joseph Smith’s translation makes it a question and a promise: “Woman, what wilt thou have me to do for thee? that will I do; for mine hour is not yet come” (JST John 2:4). So read, the Son honors His mother by taking her concern as His own. Her next words show that she trusted Him with it: “Whatsoever he saith unto you, do it” (verse 5). The water became wine in answer to her request.
    sources: [thayer, lund-saviors-respect-women, lds-scriptures]
  - ref: 4
    phrase: mine hour is not yet come
    kind: christ
    title: Not yet His hour
    body: |
      This is the first time Jesus speaks of His “hour,” and John returns to the word until it arrives, on the eve of the cross: “The hour is come, that the Son of man should be glorified” ([[John 12:23]]); “Jesus knew that his hour was come that he should depart out of this world unto the Father” ([[John 13:1]]). John’s narrative builds toward that hour.

      The Joseph Smith Translation keeps “for mine hour is not yet come” while making His answer a promise to act, so the help He gives at Cana does not wait for the hour. A Latter-day Saint reading takes the change from water to wine, together with the words about His hour, to look toward His sacrifice, when blood and water came from His side ([[John 19:34]]). Read so, the first sign is real help given at a wedding and also a first glimpse of the hour to come.
    sources: [lane-word-made-flesh, lds-scriptures]
  - ref: 6
    phrase: six waterpots of stone, after the manner of the purifying of the Jews
    kind: history
    title: Stone jars for purifying
    body: |
      The jars were there for the washings the law of Moses and its customs required. Water for these rites was kept in a Jewish home as a matter of course, and it was drawn off as needed; the jars were reservoirs, not basins. Guests at a feast washed with water the host provided before they ate, so a wedding needed a good supply.

      That they were stone mattered. Under the law an earthen vessel made unclean had to be broken ([[Lev. 15:12]]), while a stone vessel could be cleansed and used again. A “firkin” was a liquid measure of a little under nine gallons, so the six jars together held more than a hundred gallons, filled “to the brim.” What Jesus turned to wine was the water set apart for purification, and there was a great deal of it.
    sources: [talmage-jesus-christ-11, van-dyke-miracles-john, thayer]
  - ref: 10
    phrase: thou hast kept the good wine until now
    kind: symbol
    title: The good wine kept until now
    body: |
      The master of the feast, the one given charge of the celebration, tastes the new wine and calls the bridegroom, the real host, to ask why he has turned the custom around and kept the best for last. He does not know where the wine came from; the servants do, and so does the reader.

      One traditional reading takes the six jars of water to stand for the law of Moses and the fine wine for the new and fuller life Christ offers, which fulfills it. The setting adds to the image. The prophets described the covenant between the Lord and Israel as a marriage, one the people often broke through sin ([[Isa. 54:5]]; [[Hosea 2:19–20]]). At a wedding, at the very start of His ministry, the Lord made flesh has come in person to His people, and in the next chapter the Baptist calls Him “the bridegroom” ([[John 3:29]]). Later Jesus says He came that His sheep “might have life, and that they might have it more abundantly” ([[John 10:10]]), and the good wine of Cana is one picture of that abundance.
    sources: [talmage-jesus-christ-11, huntsman-family-john, huntsman-gospel-john]
  - ref: 11
    phrase: This beginning of miracles did Jesus
    kind: christ
    title: The first sign
    body: |
      The word translated “miracles” here is *sēmeia*, “signs.” Matthew, Mark and Luke usually speak of Jesus’s mighty works (*dynameis*). John calls them signs because each is as much a revelation of who Jesus is and what He came to do as it is a deed of power that blesses someone. John counts this one as the first and the healing of the nobleman’s son, also at Cana, as the second ([[John 4:54]]).

      Latter-day Saint readers have found what this sign reveals in John’s first chapter. The Word by whom “all things were made” ([[John 1:3]]) created, or organized, the world; at Cana the Word made flesh reorganizes the elements, and so the miracle shows Him to be Jehovah. John adds that the sign “manifested forth his glory,” and few saw it. The master of the feast did not know where the wine came from; the servants knew, and the disciples saw it and believed on Him. The first sign seems to have been given chiefly for them, to deepen their faith in who He was.
    sources: [huntsman-family-john, huntsman-gospel-john, van-dyke-miracles-john]
  - ref: 13
    phrase: Jesus went up to Jerusalem
    kind: history
    title: At the start, not the end
    body: |
      John sets this clearing of the temple at the start of the ministry. Matthew, Mark and Luke tell of a clearing in the last week, after the triumphal entry ([[Matt. 21:12–13]]; [[Mark 11:15–17]]; [[Luke 19:45–46]]). Each account takes place when Jesus comes to Jerusalem for a Passover. It is possible that He cleared the temple twice.

      In John the scene has been read as less about the temple as a building than a foreshadowing of the death of Jesus’s body, the subject the dialogue of verses 18–22 turns to.
    sources: [cochran-house-of-prayer, huntsman-gospel-john]
  - ref: 14
    phrase: those that sold oxen and sheep and doves, and the changers of money sitting
    kind: history
    title: A market in the temple courts
    body: |
      The scene is in the outer courts of the temple, the wide enclosure with its covered walkways and courts (Greek *hieron*), not the sanctuary itself. At Passover the courtyard was crowded with hundreds or thousands of pilgrims bringing animals to be inspected for sacrifice, paying the yearly temple tax, or listening to teachers. Only John mentions the oxen and sheep, brought in for the feast.

      The trade served the pilgrims, but the sellers were likely taking advantage of them, and prices rose even for doves. The law allowed doves so that the poor could offer a sacrifice they could afford ([[Lev. 5:7]]; [[Lev. 12:8]]), and the market would have made even that offering more expensive.
    sources: [thayer, cochran-house-of-prayer]
  - ref: 15
    phrase: a scourge of small cords
    kind: history
    title: A whip of small cords
    body: |
      Only John mentions the whip, and it was probably for the animals. Oxen and sheep in any number are hard to move without a tool of the herdsman’s trade, and Jesus stopped to make one, likely gathering cords from His disciples or from nearby. That suggests someone who had decided what to do, not someone who had lost his temper.

      The doves show the same control. He overthrew the changers’ tables, but He did not throw down the birds’ cages; to the dove sellers He said only, “Take these things hence” (verse 16).
    sources: [cochran-house-of-prayer]
  - ref: 16
    phrase: make not my Father’s house an house of merchandise
    kind: christ
    title: My Father’s house
    body: |
      Jesus gives His reason for clearing the temple in one phrase: it is His Father’s house. Those charged with its care had let it become a market, and the Son, acting for the Father, had come home to cleanse it.

      The phrase “my Father’s house” comes only once more in John, at the Last Supper: “In my Father’s house are many mansions … I go to prepare a place for you” ([[John 14:2]]). There too the house can be read as a temple, not the building in Jerusalem but the heavenly temple where God dwells, into which Jesus promises to bring His disciples: “that where I am, there ye may be also” ([[John 14:3]]).
    sources: [cochran-house-of-prayer, sc-knowhy-674]
  - ref: 17
    phrase: The zeal of thine house hath eaten me up
    kind: scripture
    title: The zeal of thine house
    body: |
      The disciples remembered a psalm whose speaker is set apart from his own family by his zeal for God’s house: “I am become a stranger unto my brethren … For the zeal of thine house hath eaten me up” ([[Ps. 69:8–9]]). By recalling it here, John sets Jesus in the psalmist’s place, set apart by His love for His Father and His desire for a true sanctuary where the Father could be worshipped. John returns often to that zeal: Jesus says He was sent by the Father, that He does the Father’s will, and that His work is to glorify the Father ([[John 5:30]]; [[John 17:1–4]]).
    sources: [cochran-house-of-prayer, lds-scriptures]
  - ref: 18
    phrase: What sign shewest thou unto us
    kind: history
    title: What sign shewest thou?
    body: |
      “The Jews” who ask for a sign are the priestly officials and rulers of the people, those charged with the temple (on the phrase, see the note on [[John 1:19]]). John does not record them objecting to the clearing itself. What they questioned was His authority: by what right had He done what was their own duty? So they asked for a sign, a credential. His answer, in the next verse, was one even His disciples understood only after He had risen.
    sources: [talmage-jesus-christ-12, cochran-house-of-prayer]
  - ref: 19
    phrase: Destroy this temple, and in three days I will raise it up
    kind: christ
    title: The temple of His body
    body: |
      John uses two Greek words for the temple in this scene, one for the courts Jesus has just cleared and another for the temple He tells them to destroy. The courts are the *hieron* (verses 14–15), the whole enclosure. The temple He tells them to destroy is the *naos*, the sanctuary itself, the holy place and the holy of holies. The hearers took Him to mean the building. John explains, “he spake of the temple of his body” (verse 21).

      Even His disciples did not understand the saying until after He had risen (verse 22). Others heard it only of the building. At His trial false witnesses said, “We heard him say, I will destroy this temple that is made with hands, and within three days I will build another made without hands” ([[Mark 14:58]]), and at the cross the passers-by mocked, “Thou that destroyest the temple, and buildest it in three days, save thyself” ([[Matt. 27:40]]). John alone gives the saying’s meaning, in verses 21–22: the temple was His body, and the disciples believed when He had risen.
    sources: [thayer, greek-nt, lds-scriptures]
  - ref: 20
    phrase: Forty and six years was this temple in building
    kind: history
    title: Forty and six years
    body: |
      The temple Jesus stood in was Herod’s rebuilding of the second temple. Herod proposed the work in the eighteenth year of his reign, 17 B.C. as the Bible Dictionary dates it. The sanctuary itself was built by priests in a year and a half, but the courts and buildings around it took much longer. Work went on all through the Lord’s life and was not finished until A.D. 64, six years before the temple was destroyed.

      So the hearers’ “forty and six years” is the time the work had already been going on, and it was still not finished.
    sources: [bd-temple-of-herod]
  - ref: 24
    phrase: Jesus did not commit himself unto them
    kind: words
    title: He did not entrust Himself
    body: |
      In Greek, verses 23 and 24 use the same verb, a link the English hides. Many *episteusan* (“believed”) in His name, but Jesus did not *episteuen* (“commit,” entrust) Himself to them. In John this verb covers every degree of faith, from its first stirring in the soul to full assurance, and the belief of verse 23 can be read as the first kind. It came “when they saw the miracles which he did,” the signs (*sēmeia*) of this Passover.

      John gives the reason Jesus held back in the same breath: He “knew all men,” and “knew what was in man” (verses 24–25). Such faith was a beginning, not yet one He could trust. In the next chapter Nicodemus may have had the clearing of the temple in mind when he came to Jesus by night and said, “No man can do these miracles that thou doest, except God be with him” ([[John 3:2]]).
    sources: [greek-nt, thayer, huntsman-gospel-john]

christ: |
  John 2 shows Jesus Christ bringing something new to the water of purification and to the temple. The water kept for purification becomes the best wine of the feast, and the temple He clears points to the temple of His own body, destroyed on the cross and raised on the third day. John says outright that the temple saying looked to His death and resurrection (verses 21–22), and the words at Cana about His hour have been read the same way; in that death His humanity made it possible for Him to die and His divinity made His dying glorious and redemptive. His zeal in the temple courts was to restore the temple’s purpose, communion with God in His dwelling place.

  Mary’s word to the servants, “Whatsoever he saith unto you, do it” (verse 5), still describes how His help comes: the servants filled the jars and drew from them as He said, and the wine was there. And as His disciples understood His saying only after He had risen, and then “believed the scripture, and the word which Jesus had said” (verse 22), understanding of His words can come long after they are first heard.

explore: |
  - **The second sign at Cana.** [[John 4:46–54]], which closes the unit this chapter opens.
  - **The hour.** [[John 7:30]], [[John 12:23–33]], [[John 13:1]] and [[John 17:1]], where the hour that was not yet come at Cana arrives.
  - **The other clearing.** [[Matt. 21:12–16]], [[Mark 11:15–18]] and [[Luke 19:45–48]], in the last week.
  - **The temple of His body remembered.** [[Mark 14:57–59]] and [[Matt. 27:39–40]], where the saying of verse 19 returns at the trial and the cross.

