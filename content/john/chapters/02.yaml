chapter: 2
title: Thou Hast Kept the Good Wine until Now
tagline: At a wedding in Cana Jesus turns the water of purification into the best wine of the feast, His first sign; at the Passover in Jerusalem He drives the traders from His Father’s house and speaks of a temple to be destroyed and raised in three days.
when: 'The start of Jesus’s ministry, days after the first disciples follow Him ([[John 1:35–51]]), and the first Passover John names'

setting: |
  Chapter 1 ended with the first disciples: two of the Baptist’s followers, Andrew and another, then Simon, Philip and Nathanael ([[John 1:35–51]]). “The third day” after that, Jesus and these disciples are at a wedding in Cana, Nathanael’s own town ([[John 21:2]]). From there they go down to Capernaum, and then up to Jerusalem for the Passover.

  Neither story is told in another Gospel. Matthew, Mark and Luke each tell of a clearing of the temple in the last week of Jesus’s life ([[Matt. 21:12–13]]; [[Mark 11:15–17]]; [[Luke 19:45–46]]); John sets a clearing here, at the beginning of His ministry.

  The chapter opens a unit of John that runs to the end of chapter 4 and is framed by two miracles at Cana, the water made wine and the healing of the nobleman’s son ([[John 4:46–54]]). The stories between them, Nicodemus and the woman at the well among them, stress newness, above all the new life Jesus has come to bring. The Passover of verse 13 is the first of three that John names (2:13; 6:4; 11:55); a fourth feast (5:1) is often taken to be a Passover as well, so in John the ministry lasts two or three years.

thread: |
  **John 2 sets Jesus beside two things at the heart of Israel’s worship, the water of purification and the temple, and in both He brings something new.**

  At Cana six stone jars stand ready for the washings the law required, and when Jesus has spoken, they hold the best wine of the feast. A long tradition of readers has seen in this the old law fulfilled by the richer life Christ offers. In Jerusalem He clears the temple courts of the traders and the money changers, and when He is asked for a sign, He speaks of another temple, destroyed and raised in three days. John explains that He meant His body. In John the clearing of the temple is less about the building than a foreshadowing of His death.

  Both scenes look ahead. At Cana He says His hour has not yet come, and that hour, in John, is the cross. At the temple His disciples understand His words only after He has risen (verse 22). Between the two runs a contrast in belief. The disciples see His glory at Cana and believe on Him (verse 11). At the feast many believe because they see His signs, and the next verse uses the same verb to say that He did not entrust Himself to them (verses 23–24).

sections:
  - range: 1-12
    heading: The marriage at Cana
    plain: |
      On the third day there was a wedding at Cana in Galilee, and the mother of Jesus was there. Jesus and His disciples had been invited to the wedding too. When the wine ran out, His mother said to Him, “They have no wine.” Jesus said to her, “Woman, what have I to do with you? My hour has not yet come.” His mother said to the servants, “Do whatever He tells you.”

      Six stone water jars stood there, kept for the Jewish rites of purification, each holding about eighteen to twenty-seven gallons. Jesus said to the servants, “Fill the jars with water,” and they filled them to the brim. Then He said, “Now draw some out and take it to the master of the feast,” and they did. The master of the feast tasted the water that had become wine. He did not know where it had come from, though the servants who had drawn the water knew. He called the bridegroom and said to him, “Everyone serves the good wine first, and the poorer wine after the guests have drunk freely. But you have kept the good wine until now.”

      This, at Cana in Galilee, was the first of the signs Jesus did. In it He showed His glory, and His disciples believed in Him. After this He went down to Capernaum with His mother, His brothers and His disciples, and they stayed there only a few days.
  - range: 13-22
    heading: The first clearing of the temple
    plain: |
      The Passover of the Jews was near, and Jesus went up to Jerusalem. In the temple courts He found people selling oxen, sheep and doves, and the money changers sitting at their tables. He made a whip out of cords and drove them all out of the temple, with the sheep and the oxen. He poured out the money changers’ coins and overturned their tables, and He said to those who sold doves, “Take these things out of here. Do not make my Father’s house a marketplace.” His disciples remembered that it is written, “Zeal for your house has consumed me.”

      Then the Jews answered Him, “What sign do you show us for doing these things?” Jesus answered, “Destroy this temple, and in three days I will raise it up.” The Jews said, “This temple has been under construction for forty-six years, and you will raise it up in three days?” But the temple He spoke of was His body. So when He had risen from the dead, His disciples remembered that He had said this, and they believed the scripture and the word Jesus had spoken.
  - range: 23-25
    heading: Belief at the feast
    plain: |
      While He was in Jerusalem at the Passover feast, many believed in His name when they saw the signs He was doing. But Jesus did not entrust Himself to them, because He knew all people. He did not need anyone to tell Him about a person, for He knew what was in each one.

notes:
  - ref: 1
    phrase: there was a marriage in Cana of Galilee
    kind: history
    title: A wedding in Cana
    body: |
      John says nothing about whose wedding it was. Jesus and His disciples were “called,” invited as guests, and the text never names the bride or the groom. Cana is the town of Nathanael, who had just become a disciple ([[John 21:2]]). Mary seems to have had some responsibility at the feast, which would explain why the servants did as she told them (verse 5). Jesus’s presence can be taken, at the least, to show that He approved of marriage and was glad to celebrate it.
    sources: [huntsman-family-john, talmage-jesus-christ-11]
  - ref: 4
    phrase: Woman, what have I to do with thee?
    kind: words
    title: Woman, what wilt thou have me to do?
    body: |
      To an English reader, “Woman” sounds cold from a son to his mother, but here it carried respect. As a form of address, the Greek *gynai* could carry indignation, admiration, kindness or respect, and in this verse it is respect. Jesus uses the same word to His mother from the cross, as He gives her into the care of the beloved disciple ([[John 19:26]]).

      “What have I to do with thee?” is harder. Mary’s report that the wine had run out probably hinted that He might use His power, and His answer can be read as a gentle reminder that the time for that was His to choose, not hers: in that reading He does not say He cannot help, only that He will act when the time is right and that He decides when it has come. Joseph Smith’s translation makes the reply a promise: “Woman, what wilt thou have me to do for thee? that will I do; for mine hour is not yet come” (JST John 2:4). Mary understood Him, in part at least, and left the matter in His hands: “Whatsoever he saith unto you, do it.”
    sources: [thayer, talmage-jesus-christ-11, lds-scriptures]
  - ref: 4
    phrase: mine hour is not yet come
    kind: christ
    title: Not yet His hour
    body: |
      This is the first time Jesus speaks of His “hour,” and John returns to the word until it arrives: “The hour is come, that the Son of man should be glorified” ([[John 12:23]]); “Jesus knew that his hour was come that he should depart out of this world unto the Father” ([[John 13:1]]). The whole of John’s narrative builds toward that hour, the cross, and in John the verb “glorify” is used in a particular way for Jesus’s dying.

      So the first sign already points beyond the wedding. The change from water to wine, together with the words about His hour, looks toward His sacrifice, when blood and water came from His side ([[John 19:34]]). The Joseph Smith Translation keeps “for mine hour is not yet come” while making His answer a promise to act. The miracle at Cana is real help given at a wedding, and it also anticipates the hour when His glory would be shown on the cross.
    sources: [lane-word-made-flesh, lds-scriptures]
  - ref: 6
    phrase: six waterpots of stone, after the manner of the purifying of the Jews
    kind: history
    title: Stone jars for purifying
    body: |
      The jars were there for the washings the law of Moses and its customs required. Water for these rites was kept in a Jewish home as a matter of course, and it was drawn off as needed; the jars were reservoirs, not basins. Guests at a feast washed with water the host provided before they ate, so a wedding needed a good supply.

      That they were stone mattered. Under the law an earthen vessel made unclean had to be broken ([[Lev. 15:12]]), while a stone vessel could be cleansed and used again. The “firkin” of the King James Version translates the Greek *metrētēs*, a liquid measure of a little under nine gallons. At “two or three firkins apiece,” each jar held about eighteen to twenty-seven gallons, and the six together held more than a hundred gallons, filled “to the brim.” What Jesus turned to wine was the water set apart for purification, and there was a great deal of it.
    sources: [talmage-jesus-christ-11, van-dyke-miracles-john, thayer]
  - ref: 10
    phrase: thou hast kept the good wine until now
    kind: symbol
    title: The good wine kept until now
    body: |
      The master of the feast, the one given charge of the celebration, tastes the new wine and chides the bridegroom, the real host, for breaking the custom of serving the best first. He does not know where the wine came from; the servants do, and so does the reader.

      A long tradition of readers has taken the six jars of water to stand for the law of Moses and the fine wine for the new and fuller life Christ offers, which fulfills it. The setting adds to the image. The prophets described the covenant between the Lord and Israel as a marriage, one the people often broke through sin ([[Isa. 54:5]]; [[Hosea 2:19–20]]). At a wedding, at the very start of His ministry, the Lord made flesh has come in person to His people, and in the next chapter the Baptist calls Him “the bridegroom” ([[John 3:29]]). Later Jesus says He came that His sheep “might have life, and that they might have it more abundantly” ([[John 10:10]]), and the good wine of Cana is one picture of that abundance.
    sources: [talmage-jesus-christ-11, huntsman-family-john, huntsman-gospel-john]
  - ref: 11
    phrase: This beginning of miracles did Jesus
    kind: christ
    title: The first sign
    body: |
      The word translated “miracles” here is *sēmeia*, “signs.” Matthew, Mark and Luke usually speak of Jesus’s mighty works (*dynameis*). John calls them signs because each is as much a revelation of who Jesus is and what He came to do as it is a deed of power that blesses someone. John counts this one as the first and the healing of the nobleman’s son, also at Cana, as the second ([[John 4:54]]).

      Latter-day Saint readers have found what this sign reveals in John’s first chapter. The Word by whom “all things were made” ([[John 1:3]]) created, or organized, the world; at Cana the Word made flesh reorganizes the elements, and so the miracle shows Him to be Jehovah. John adds that the sign “manifested forth his glory,” and few saw it. The master of the feast did not know where the wine came from; the servants knew, and the disciples saw it and believed on Him. The first sign seems to have been given chiefly for them, to deepen their faith in who He was.
    sources: [huntsman-family-john, huntsman-gospel-john, van-dyke-miracles-john]
  - ref: 13
    phrase: Jesus went up to Jerusalem
    kind: history
    title: At the start, not the end
    body: |
      John sets this clearing of the temple at the start of the ministry. Matthew, Mark and Luke tell of a clearing in the last week, after the triumphal entry ([[Matt. 21:12–13]]; [[Mark 11:15–17]]; [[Luke 19:45–46]]). Each account takes place when Jesus comes to Jerusalem for a Passover. It is possible that He cleared the temple twice, and the Gospels do not settle the question.

      John’s placement shapes what the scene means. Coming so early, it is less about the temple as a building than a foreshadowing of the death of Jesus’s body, which the dialogue in verses 18–22 makes plain.
    sources: [cochran-house-of-prayer, huntsman-gospel-john]
  - ref: 14
    phrase: those that sold oxen and sheep and doves, and the changers of money sitting
    kind: history
    title: A market in the temple courts
    body: |
      The scene is in the outer courts of the temple, the wide enclosure with its covered walkways and courts (Greek *hieron*), not the sanctuary itself. At Passover the courtyard was crowded with hundreds or thousands of pilgrims bringing animals to be inspected for sacrifice, paying the yearly temple tax, or listening to teachers. Only John mentions the oxen and sheep, brought in for the feast.

      The trade served the pilgrims, but the sellers were not innocent. They were likely taking advantage of worshippers, and prices rose even for doves. The law allowed doves so that the poor could offer a sacrifice they could afford ([[Lev. 5:7]]; [[Lev. 12:8]]), and the market would have made even that offering more expensive.
    sources: [thayer, cochran-house-of-prayer]
  - ref: 15
    phrase: a scourge of small cords
    kind: history
    title: A whip of small cords
    body: |
      Only John mentions the whip, and it was probably for the animals. Oxen and sheep in any number are hard to move without a tool of the herdsman’s trade, and Jesus stopped to make one, likely gathering cords from His disciples or from nearby. That suggests someone who had decided what to do, not someone who had lost his temper.

      The doves show the same control. Animals and men can be driven, but cages thrown down would have harmed the birds. Jesus did not overturn the cages; He told the dove sellers, “Take these things hence.”
    sources: [cochran-house-of-prayer]
  - ref: 16
    phrase: make not my Father’s house an house of merchandise
    kind: christ
    title: My Father’s house
    body: |
      Jesus gives His reason for clearing the temple in one phrase: it is His Father’s house. In Matthew’s account of the clearing in the last week He calls it “my house” ([[Matt. 21:13]]). Elder James E. Talmage, who read the Gospels as telling of two clearings, saw the difference as fitting each time: at the first, before Jesus had declared Himself the Messiah, He spoke of His Father’s house; at the last, when He had openly said He was the Christ, He spoke of His own. To Elder Talmage the two expressions meant nearly the same, since the Son and the Father are one in possession and dominion.
    sources: [talmage-jesus-christ-30]
  - ref: 17
    phrase: The zeal of thine house hath eaten me up
    kind: scripture
    title: The zeal of thine house
    body: |
      The disciples remembered a psalm whose speaker is set apart from his own family by his zeal for God’s house: “I am become a stranger unto my brethren … For the zeal of thine house hath eaten me up” ([[Ps. 69:8–9]]). Their remembering it suggests that they saw Jesus in the psalmist’s place, set apart by His love for His Father and His desire for a true sanctuary where the Father could be worshipped. John returns often to that zeal: Jesus says He was sent by the Father, that He does the Father’s will, and that His work is to glorify the Father ([[John 5:30]]; [[John 17:1–4]]).
    sources: [cochran-house-of-prayer, lds-scriptures]
  - ref: 18
    phrase: What sign shewest thou unto us
    kind: history
    title: What sign shewest thou?
    body: |
      “The Jews” who ask for a sign are the priestly officials and rulers of the people, as Elder James E. Talmage read the verse (on the phrase, see the note on [[John 1:19]]). John does not record them objecting to the clearing itself. What they questioned was His authority: by what right had He done what was their own duty? So they asked for a sign, a credential. His answer, in the next verse, was one even His disciples understood only after He had risen.
    sources: [talmage-jesus-christ-12, cochran-house-of-prayer]
  - ref: 19
    phrase: Destroy this temple, and in three days I will raise it up
    kind: christ
    title: The temple of His body
    body: |
      John uses two Greek words for the temple in this scene, one for the courts Jesus has just cleared and another for the temple He tells them to destroy. The courts are the *hieron* (verses 14–15), the whole enclosure. The temple He tells them to destroy is the *naos*, the sanctuary itself, the holy place and the holy of holies, a word that comes from a verb meaning “to dwell.” The hearers took Him to mean the building. John explains, “he spake of the temple of his body” (verse 21).

      Elder Talmage called this saying His first recorded prediction of His death and resurrection, and even His disciples did not understand it until after He had risen (verse 22). His enemies did not forget it. At His trial false witnesses twisted it into a threat against the building ([[Mark 14:58]]), at the cross it was thrown back at Him ([[Matt. 27:40]]), and the chief priests seem to have had it in mind when they asked Pilate to guard the tomb, remembering that He had said, “After three days I will rise again” ([[Matt. 27:63]]).
    sources: [thayer, greek-nt, talmage-jesus-christ-12]
  - ref: 20
    phrase: Forty and six years was this temple in building
    kind: history
    title: Forty and six years
    body: |
      The temple Jesus stood in was Herod’s rebuilding of the second temple. Herod proposed the work in the eighteenth year of his reign, 17 B.C. as the Bible Dictionary dates it. The sanctuary itself was built by priests in a year and a half, but the courts and buildings around it took much longer. Work went on all through the Lord’s life and was not finished until A.D. 64, six years before the temple was destroyed.

      So the hearers’ “forty and six years” is the time the work had already been going on, and it was still not finished.
    sources: [bd-temple-of-herod]
  - ref: 24
    phrase: Jesus did not commit himself unto them
    kind: words
    title: He did not entrust Himself
    body: |
      In Greek, verses 23 and 24 use the same verb, a wordplay the English hides. Many *episteusan* (“believed”) in His name, but Jesus did not *episteuen* (“commit,” entrust) Himself to them. In John this verb covers every degree of faith, from its first stirring in the soul to full assurance, and the belief of verse 23 is the first kind. It rested on the signs they saw.

      Jesus knew how insecure a footing that was; John says He “knew what was in man.” As Elder Talmage read the verse, He did not want a following drawn by wonders but sought those who received the witness of His Messiahship from the Father. One of those the works of this Passover had moved was Nicodemus, who came to Him by night in the next chapter ([[John 3:1–2]]).
    sources: [greek-nt, thayer, talmage-jesus-christ-12]

christ: |
  John 2 shows Jesus Christ bringing something new to the water of purification and to the temple. The water kept for purification becomes the best wine of the feast, and the temple He clears points to the temple of His own body, destroyed on the cross and raised on the third day. Both look to His death, Cana through His hour and the temple through the saying of verse 19, and in that death His humanity made it possible for Him to die and His divinity made His dying glorious and redemptive. The Jesus who made a whip and overturned the tables is the same Jesus of love and compassion: His zeal was to restore the temple’s purpose, communion with God in His dwelling place. The demands He makes of His disciples come from that same love.

explore: |
  - **The second sign at Cana.** [[John 4:46–54]], which closes the unit this chapter opens.
  - **The hour.** [[John 7:30]], [[John 12:23–33]], [[John 13:1]] and [[John 17:1]], where the hour that was not yet come at Cana arrives.
  - **The other clearing.** [[Matt. 21:12–16]], [[Mark 11:15–18]] and [[Luke 19:45–48]], in the last week.
  - **The temple of His body remembered.** [[Mark 14:57–59]] and [[Matt. 27:39–40]], where the saying of verse 19 returns at the trial and the cross.

