chapter: 5
title: My Father Worketh Hitherto, and I Work
tagline: At a feast in Jerusalem Jesus heals a man who had lain ill thirty-eight years beside the pool of Bethesda, on the Sabbath; accused of breaking the Sabbath and making Himself equal with God, He answers that the Son does what He sees the Father do, gives life, will raise the dead and judge them, and has the witness of John, of His works, of the Father and of the scriptures.
when: 'At a feast in Jerusalem that John does not name ([[John 5:1]])'

setting: |
  Chapter 5 opens a new movement in John. Chapters 5 through 10 move from feast to feast (the Passover is near in [[John 6:4]], then come Tabernacles and Dedication, [[John 7:2]]; [[John 10:22]]), and what Jesus does at them shows how He fulfilled what the feasts meant. This first feast John does not name. Many later Greek manuscripts read “the feast,” which suggests the Passover, but older and arguably more reliable ones have no article, so any of the annual feasts may be meant. Nothing hangs on it: the miracle and the discourse that follows it lose nothing if the date is never settled.

  The healing at the pool of Bethesda is the first of two healings John tells that Jesus did on the Sabbath; the second is the man born blind in chapter 9, and the two stories run along the same lines. Like every miracle in John it is a “sign,” and like the others it is followed by teaching in which Jesus speaks of who He is. Here the sign takes eighteen verses and the teaching twenty-nine. The teaching answers a charge: that Jesus broke the Sabbath and said that God was His Father, “making himself equal with God” (verse 18).

  The story is told only by John. The Synoptic Gospels have Sabbath healings of their own ([[Mark 3:1–6]]; [[Luke 13:10–17]]; [[Luke 14:1–6]]), but not this one.

thread: |
  **The healing is the sermon in small: the Son does on the Sabbath what the Father does, and what He does is give life.**

  A man who cannot rise is told, “Rise, take up thy bed, and walk” (verse 8), and he does. Accused of working on the Sabbath, Jesus answers that His Father has never stopped working, and that He works as His Father does (verse 17). Then He names the Father’s works the Son will do: He “quickeneth whom he will” (verse 21), and the hour is coming when all that are in the graves will hear His voice and come forth (verses 28–29). Giving life and judging belong to God, and the Father has given both to the Son. The man’s rising at the pool is a small picture of that larger rising.

  The rest of the chapter answers the next charge, that a man who speaks this way of himself is only bearing witness of himself. Jesus calls four witnesses: John the Baptist, the works the Father gave Him to do, the Father Himself, and the scriptures, Moses above all. The men who accuse Him of dishonoring God are the ones, He says, who do not receive the witness God has sent.

sections:
  - range: 1-9
    heading: The man at the pool of Bethesda
    plain: |
      After this there was a feast of the Jews, and Jesus went up to Jerusalem. In Jerusalem, by the sheep gate, there is a pool called in Hebrew Bethesda, with five covered porches. In them lay a great crowd of sick people, the blind, the lame and those with withered limbs, waiting for the water to move. For at certain times an angel went down into the pool and stirred the water, and whoever stepped in first after the water was stirred was healed of whatever disease he had.

      One man there had been ill for thirty-eight years. When Jesus saw him lying there and knew that he had been that way a long time, He asked him, “Do you want to be made whole?” The sick man answered, “Sir, I have no one to put me into the pool when the water is stirred. While I am making my way there, someone else steps down ahead of me.” Jesus said to him, “Get up, pick up your bed, and walk.” At once the man was made whole; he picked up his bed and walked. That day was the Sabbath.
  - range: 10-18
    heading: The Sabbath, and the Father’s work
    plain: |
      So the Jews said to the man who had been healed, “It is the Sabbath. It is not lawful for you to carry your bed.” He answered, “The man who made me whole told me, ‘Pick up your bed, and walk.’” They asked him, “Who is the man who told you, ‘Pick up your bed, and walk’?” But the man who had been healed did not know who it was, for Jesus had slipped away into the crowd that was there.

      Later Jesus found him in the temple and said to him, “Look, you have been made whole. Sin no more, so that nothing worse happens to you.” The man went away and told the Jews that it was Jesus who had made him whole. That is why the Jews persecuted Jesus and sought to kill Him: because He had done these things on the Sabbath. But Jesus answered them, “My Father has been working until now, and I am working.” So the Jews sought all the more to kill Him, because He was not only breaking the Sabbath but was also saying that God was His Father, making Himself equal with God.
  - range: 19-30
    heading: What the Son does
    plain: |
      Jesus answered them, “Truly, truly, I say to you: the Son can do nothing on His own, but only what He sees the Father doing. Whatever the Father does, the Son does too. For the Father loves the Son and shows Him everything He Himself is doing, and He will show Him greater works than these, so that you will marvel. As the Father raises the dead and gives them life, so the Son gives life to whom He will. The Father judges no one; He has given all judgment to the Son, so that everyone will honor the Son just as they honor the Father. Whoever does not honor the Son does not honor the Father who sent Him.

      “Truly, truly, I say to you: whoever hears my word and believes on Him who sent me has everlasting life, and will not come into condemnation, but has passed from death to life. Truly, truly, I say to you: the hour is coming, and is now here, when the dead will hear the voice of the Son of God, and those who hear will live. For as the Father has life in Himself, so He has given the Son to have life in Himself, and He has given Him authority to judge, because He is the Son of man. Do not marvel at this, for the hour is coming when all who are in the graves will hear His voice and come out: those who have done good, to the resurrection of life, and those who have done evil, to the resurrection of damnation. I can do nothing on my own. I judge as I hear, and my judgment is just, because I do not seek my own will but the will of the Father who sent me.
  - range: 31-47
    heading: The witnesses
    plain: |
      “If I bear witness of myself, my witness is not true. There is another who bears witness of me, and I know that the witness He bears of me is true. You sent to John, and he bore witness to the truth. Yet I do not take my testimony from a man; I say these things so that you may be saved. John was a lamp that burned and shone, and for a while you were glad to rejoice in his light. But I have a greater witness than John’s: the works the Father has given me to finish, the very works I am doing, bear witness that the Father has sent me. And the Father Himself, who sent me, has borne witness of me. You have never heard His voice or seen His form, and His word does not abide in you, for you do not believe the one He sent.

      “Search the scriptures, for you think that in them you have eternal life; and they are the ones that bear witness of me. Yet you will not come to me to have life. I do not take honor from men. But I know you: you do not have the love of God in you. I have come in my Father’s name, and you do not receive me; if someone else comes in his own name, him you will receive. How can you believe, when you take honor from one another and do not seek the honor that comes from God alone? Do not think that I will accuse you to the Father. The one who accuses you is Moses, in whom you have set your hope. If you believed Moses, you would believe me, for he wrote of me. But if you do not believe his writings, how will you believe my words?”

notes:
  - ref: 2
    phrase: by the sheep market a pool
    kind: history
    title: The pool by the sheep gate
    body: |
      John’s Greek has only an adjective, “pertaining to sheep,” and leaves the noun to be understood. The noun usually supplied is “gate”: Nehemiah names a sheep gate in the wall of Jerusalem ([[Neh. 3:1]]), and on that reading the pool lay near it. Some interpreters join the adjective to the pool instead, a “sheep pool.” Either way the pool was close to the temple.

      The five porches were covered colonnades that gave shade, and in them lay the “great multitude” of verse 3, the blind, the lame and the withered, waiting for the water to move.
    sources: [thayer, van-dyke-miracles-john]
  - ref: 4
    phrase: For an angel went down at a certain season into the pool
    kind: history
    title: The angel and the troubled water
    body: |
      Verse 4 gives the explanation people of the day told for the pool’s power. The water seems to have stirred from time to time, perhaps from an intermittent spring that bubbled up into it, and its healing virtue was “popularly attributed to the ‘troubling’ of the waters by an angel.” Whoever reached the water first after it moved, the tradition said, would be healed.

      The verse has a history of its own. It stands in the Greek text behind the King James Version, but it is most likely an explanation of the moving water that was inserted into later copies of John. The moving of the water itself may still belong to the original story: the sick man speaks of it in verse 7.

      What the story answers is not what moved the water but who healed the man. He never reaches the pool; he has “no man” to carry him (verse 7), and he is made whole by a word from Jesus, without the water at all. The miracle invited those who saw it to look away from the pool to Christ and His power.
    sources: [bd-bethesda, huntsman-sabbath-john, van-dyke-miracles-john]
  - ref: 6
    phrase: Wilt thou be made whole?
    kind: history
    title: Wilt thou be made whole?
    body: |
      The question sounds needless, since the man has lain by the pool for years hoping for exactly that. But it turns his attention to the one asking and stirs a fresh longing in him. His answer shows where his hope still lay: he thinks only of the pool, and of the others who always step down before him (verse 7).

      The man does not ask to be healed, and he does not know who Jesus is (verse 13). Jesus is the one who sees him, knows how long he has lain there, and speaks first. John tells the healing of the man born blind the same way: there too Jesus takes the initiative ([[John 9:1–7]]).
    sources: [talmage-jesus-christ-15, huntsman-sabbath-john]
  - ref: 8
    phrase: Rise, take up thy bed, and walk
    kind: christ
    title: Rise
    body: |
      The verb Jesus uses for “rise” (*egeire*), and the picture of a man getting up from where he lay, hint at resurrection. The discourse that follows makes the hint plain: the Son quickens whom He will (verse 21), and the hour is coming when all who are in the graves will hear the Son’s voice and come forth (verses 28–29). A man who had been infirm for thirty-eight years stands up at a word: a small picture of what the Son will do for all the dead, when, in the Book of Mormon’s words, “every limb and joint shall be restored to its body” ([[Alma 40:23]]).

      The “bed” is a mat, a small and light thing to carry. Carrying it is what brings on the conflict of the next verses.
    sources: [huntsman-sabbath-john, ellicott-john]
  - ref: 10
    phrase: it is not lawful for thee to carry thy bed
    kind: history
    title: Not lawful to carry thy bed
    body: |
      “The Jews” in this chapter are the authorities in Jerusalem who opposed Jesus (see the note on [[John 1:19]]). They had law to point to. Jeremiah told Judah to “bear no burden on the sabbath day” ([[Jer. 17:21]]), and Nehemiah shut the city gates against those who carried loads on it ([[Neh. 13:15–19]]). The rabbis pressed the rule to cover a burden of any kind. Whether rules that strict were already kept by most Jews in Jesus’s day is not known; they seem to have begun among particular groups, such as the Pharisees and the community at Qumran, and became the norm only later. Nor were they meant to be burdensome: such “hedges about the law” grew out of a sincere wish to keep God’s law more fully.

      What the authorities do next shows what troubles them. They do not punish the man; they want to know who told him to carry his bed (verse 12). Jesus had not only healed on the Sabbath but had taken it on Himself to say what the Sabbath allowed.
    sources: [ellicott-john, huntsman-sabbath-john]
  - ref: 14
    phrase: sin no more, lest a worse thing come unto thee
    kind: history
    title: Sin no more
    body: |
      Jesus’s warning makes a reader ask whether the man’s illness had come from his sin. The verse does not say, and readers take it differently. One reading hears the warning as looking forward only: it does not make past sin the cause of the illness, but warns that going on in sin could bring something worse than a crippled body, the death of the spirit. Some older commentators instead hear in it a link between his long suffering and sin of his own, now healed together with its effects. In John, sin is above all a failure to believe, so “sin no more” can also be read as a call to put his trust in the one who healed him. The command is in the present tense and points to a lasting way of life: be a sinner no longer.

      Only now, found again in the temple, does the man learn who healed him, and he goes and tells the authorities (verse 15). John does not say why. Nothing in the story makes it a betrayal; he may simply be giving the answer he could not give before (verse 13), and naming a prophet he supposed they too would recognize.
    sources: [ellicott-john, huntsman-sabbath-john]
  - ref: 17
    phrase: My Father worketh hitherto, and I work
    kind: christ
    title: My Father worketh hitherto
    body: |
      Jesus answers the charge of Sabbath-breaking with something His accusers already believed: God did not stop working after the Creation. He goes on sustaining what He made, causing the sun to rise and keeping life going, Sabbath or not, and no one thinks He breaks the Sabbath by it. “My Father worketh hitherto,” until now, “and I work”: the Son does what the Father does, on the Sabbath as on any day. Because “hitherto” stands before the verb for emphasis, it may also mean “even until now”: God has been working toward this moment, when Christ has come to bring the promised Sabbath rest to its fulfillment. The rest the Sabbath asks for, on this reading, is not rest from every labor but rest from worldly pursuits.

      The authorities heard the claim inside the answer. Jesus had called God His Father, and they took Him to be “making himself equal with God” (verse 18); the same charge comes back at the feast of Dedication and at His trial ([[John 10:33]]; [[John 19:7]]). The Greek behind “had broken the sabbath” is in a tense of continuing action, which may mean they saw Him as one who broke the Sabbath again and again.
    sources: [huntsman-sabbath-john, van-dyke-miracles-john]
  - ref: 19
    phrase: The Son can do nothing of himself, but what he seeth the Father do
    kind: prophets
    title: What he seeth the Father do
    body: |
      Jesus explains His claim to be equal with God by describing the Son’s dependence on the Father. The Son does nothing of Himself, and He does all that the Father does. His sonship expresses “at once subordination and unity,” and it puts His works on the level of the Father’s, so that to refuse honor to the Son is to refuse it to the Father who sent Him (verse 23).

      Joseph Smith took the verse further. In his sermon of 7 April 1844 he joined it to words close to verse 26 and asked what it is the Son does that He saw the Father do: “Jesus said, as the Father hath power in himself, even so hath the Son power; to do what? why what the Father did, that answer is obvious; in a manner to lay down his body and take it up again.” He counted such teaching among “the simple and first principles of the gospel, to know for a certainty the character of God.”
    sources: [ellicott-john, jsp-discourse-1844-04-07]
  - ref: 21
    phrase: even so the Son quickeneth whom he will
    kind: christ
    title: The works of God given to the Son
    body: |
      Verses 21–29 say what the “greater works” of verse 20 are: raising the dead and judging. In Israel’s scriptures both belong to God. “I kill, and I make alive,” the Lord says ([[Deut. 32:39]]); He “bringeth down to the grave, and bringeth up” ([[1 Sam. 2:6]]). Jesus claims both. The Son quickens “whom he will,” and the Father has committed all judgment to Him (verse 22), so that all should honor the Son as they honor the Father. To the men who accused Him of making Himself equal with God, this is the fullest answer: the Father Himself has given the Son the works that only God does.
    sources: [ellicott-john]
  - ref: 24
    phrase: hath everlasting life
    kind: words
    title: Hath everlasting life, now
    body: |
      Jesus speaks in the present tense: the one who hears and believes “hath” everlasting life and “is passed” from death to life. In John, eternal life begins now, as a new life of the spirit for those who believe, while the resurrection of the body waits for the hour of verses 28–29. Both stand in this chapter, four verses apart.

      A Latter-day Saint usually means by “eternal life” the exalted life God lives in His presence. John’s own definition is the relationship that leads there: “this is life eternal, that they might know thee the only true God, and Jesus Christ, whom thou hast sent” ([[John 17:3]]). That relationship, and the fuller life Jesus brings with it, begin in this life for those who believe.
    sources: [huntsman-sabbath-john]
  - ref: 25
    phrase: the dead shall hear the voice of the Son of God
    kind: scripture
    title: The dead shall hear
    body: |
      The dead of this verse are the dead in the spirit world: the chapter heading reads Jesus’s words here as a promise “to take the gospel to the dead,” and names the resurrection of verses 28–29 after it as a separate thing. Verse 25 speaks of an hour that “now is”; verse 28, of an hour that “is coming,” when all who are in the graves will come forth. President Joseph F. Smith’s vision tells how the promise was kept. He received it while pondering Peter’s words, “for this cause was the gospel preached also to them that are dead” ([[D&C 138:10]]). Among the spirits of the righteous dead “the Son of God appeared, declaring liberty to the captives who had been faithful,” and preached to them the everlasting gospel ([[D&C 138:18–19]]); then He organized messengers from among them to carry the gospel to the rest ([[D&C 138:30]]).
    sources: [lds-scriptures]
  - ref: 27
    phrase: because he is the Son of man
    kind: words
    title: Because he is the Son of man
    body: |
      The title explains why judgment is His. In the Gospels “Son of man” is the name Jesus uses for Himself, and one of the ideas that probably lie behind it is His honor as head of the kingdom of God and judge of all men ([[Matt. 25:31]]). Latter-day revelation confirms that the name is sacred: “in the language of Adam, Man of Holiness is his name, and the name of his Only Begotten is the Son of Man” ([[Moses 6:57]]).
    sources: [bd-son-of-man]
  - ref: 29
    phrase: unto the resurrection of damnation
    kind: scripture
    title: The resurrection of the just and of the unjust
    body: |
      “Damnation” translates the Greek word for judgment, the same word Jesus uses in verse 27 (“authority to execute judgment”) and verse 24, where the believer “shall not come into condemnation.” Set against the “resurrection of life,” the judgment here is one that ends in condemnation.

      On 16 February 1832, at work on the translation in John Johnson’s home in Hiram, Ohio, Joseph Smith and Sidney Rigdon “came to the twenty-ninth verse of the fifth chapter of John,” and it was given to them in other words: “they who have done good, in the resurrection of the just; and they who have done evil, in the resurrection of the unjust” ([[D&C 76:15–17]]). “This caused us to marvel,” they wrote, “for it was given unto us of the Spirit,” and as they meditated on it, “the Lord touched the eyes of our understandings and they were opened” ([[D&C 76:18–19]]). What they then saw was the vision of the three kingdoms of glory, recorded in [[D&C 76]].
    sources: [greek-nt, thayer, sc-knowhy-799, lds-scriptures]
  - ref: 31
    phrase: If I bear witness of myself, my witness is not true
    kind: history
    title: The law of witnesses
    body: |
      Jesus is not saying that what He says of Himself is false. He is granting a rule of law. The law of Moses would not settle a matter on one witness: “at the mouth of two witnesses, or at the mouth of three witnesses, shall the matter be established” ([[Deut. 19:15]]). On those grounds a man’s word about himself, standing alone, would not be credited. So Jesus calls other witnesses; the chapter heading says He “obeys the divine law of witnesses.” “Another” bears witness of Him (verse 32); since He goes on to say that He does not rest on “testimony from man” (verse 34), that other is most likely the Father, named in verse 37. With the Father come John the Baptist (verses 33–35), the works the Father gave Him to do (verse 36), and the scriptures (verses 39–47). He makes the same argument at the feast of Tabernacles: the law asks for two witnesses, and the Father is the second ([[John 8:17–18]]).
    sources: [ellicott-john, lds-scriptures]
  - ref: 35
    phrase: He was a burning and a shining light
    kind: words
    title: A lamp, not the Light
    body: |
      The Greek word here is *lychnos*, a lamp: John the Baptist was “the lamp that is lighted and (then) giveth light.” That fits the prologue exactly, where John “was not that Light, but was sent to bear witness of that Light” ([[John 1:8]]). A lamp gives light it has received. A great teacher could be called a lamp, and the people had been glad of John’s brightness for a while without accepting what he asked of them.
    sources: [ellicott-john, thayer]
  - ref: 39
    phrase: Search the scriptures
    kind: words
    title: Search the scriptures, or ye search them
    body: |
      The Greek form can be a command, “Search the scriptures,” as the King James Version has it, or a statement, “Ye search the scriptures.” Latter-day Saint teaching uses the verse as the command, counsel that reaches past the books Jesus’s hearers knew: all scripture “should be searched, pondered, and applied in the lives of disciples of Christ everywhere.” Interpreters have been almost evenly divided between the two for as long as the verse has been explained, and the verbs around it describe what His hearers do and fail to do (verses 37–40), which is why many read a statement. Read that way, Jesus is not faulting them for neglecting the scriptures: they studied them closely, believing eternal life was to be found in them, and still would not come to the one the scriptures testify of (verse 40).

      Either way the center of the verse is the same: “they are they which testify of me.”
    sources: [ellicott-john, sc-knowhy-217]
  - ref: 46
    phrase: for he wrote of me
    kind: scripture
    title: Moses wrote of me
    body: |
      Moses wrote that the Lord would raise up “a Prophet from the midst of thee, of thy brethren, like unto me,” and that Israel must hearken to him ([[Deut. 18:15]]). The Book of Mormon says plainly who that prophet is: “this prophet of whom Moses spake was the Holy One of Israel” ([[1 Ne. 22:21]]), and the risen Lord claimed the title for Himself (see the note on [[John 1:21]]).

      But Jesus’s claim reaches beyond one prophecy. The worship, sacrifice and priesthood of the law Moses gave were all meant to teach, and those who had truly believed Moses would have been led by him to the fuller manifestation of God in Christ. That is why Moses, in whom they trusted, is the one who accuses them (verse 45).
    sources: [lds-scriptures, ellicott-john]

christ: |
  The chapter is about who Jesus is. He does what the Father does: He gives life, He will raise the dead, and He will judge them, and the Father has given Him these works so that all should honor the Son as they honor the Father (verses 21–23).

  That life reaches a disciple now, not only at the resurrection. Whoever hears His word and believes on the Father who sent Him “is passed from death unto life” (verse 24). Forgiveness of sin and the healing of the heart can be had in this life; the full healing, the rising of the body, waits for the hour when all who are in the graves hear His voice (verses 28–29).

explore: |
  - **The Sabbath in John.** “Bringing Forth a New Creation: The Sabbath in the Gospel of John,” in *Sacred Time: The Sabbath as a Perpetual Covenant*, reads this healing with the man born blind and with the dispute over it at the feast of Tabernacles ([[John 7:21–24]]).
  - **The other Sabbath healing in John.** [[John 9:1–41]].
  - **The vision this chapter opened.** [[D&C 76:11–24]].

