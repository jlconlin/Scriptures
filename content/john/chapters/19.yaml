chapter: 19
title: It Is Finished
tagline: Pilate has Jesus scourged and brings Him out crowned with thorns, first as “the man” and then as “your King”; condemned at noon on the day the Passover is prepared, Jesus carries His own cross to Golgotha, gives His mother to the disciple He loves, says “It is finished,” and is buried by Joseph of Arimathaea and Nicodemus in a new tomb in a garden.
when: 'In Jerusalem, on the day of the preparation of the Passover ([[John 19:14]]; [[John 19:31]])'

setting: |
  Chapter 19 goes on with the trial that began “early” in [[John 18:28]]. Jesus has been arrested in the garden, questioned before Annas, sent to Caiaphas, and brought to Pilate, the Roman governor, who has told the chief priests, “I find in him no fault at all,” and offered them Barabbas, whom they chose instead ([[John 18:38–40]]). The chapter carries the story from Pilate's hall to the tomb, all on one day, the day of “the preparation of the passover” (verse 14).

  All four Gospels tell of the condemnation, the crucifixion and the burial, in the same order. Much of John's account is his alone: Pilate's second conversation with Jesus, “Behold the man!”, the Pavement, the chief priests' objection to the title, the seamless coat, Jesus's mother at the cross, “I thirst” and “It is finished,” the legs that were not broken, the spear, and Nicodemus with his spices. John also leaves things out: there is no Simon of Cyrene, for Jesus carries His own cross. Many of these differences follow from what John has said of Jesus since his first chapter: He is “the Lamb of God” ([[John 1:29]]), and in John He dies on the day the Passover lambs were made ready.

  The disciple whom Jesus loved stands by the cross, and in verse 35 a witness steps forward to say that he saw what is recorded; the Gospel's last chapter names the disciple whom Jesus loved as the one who “wrote these things” ([[John 21:24]]).

thread: |
  **Pilate presents Jesus as a King, and His own leaders refuse Him; on the cross He is the King and the Lamb they would not see.**

  The word “king” runs through the chapter. The soldiers mock it with thorns and purple: “Hail, King of the Jews!” (verse 3). Pilate brings Jesus out, “Behold your King!” (verse 14), and asks, “Shall I crucify your King?” The chief priests answer, “We have no king but Cæsar” (verse 15), and Pilate writes the charge over the cross in three languages and will not change a word (verses 19–22). Pilate's words are bitter irony, but the charge is the truth: it was about who Jesus is, the Christ.

  Beneath the kingship runs the Passover. Jesus is condemned at noon on the day of preparation (verse 14), the sponge is lifted to Him on hyssop (verse 29), and none of His bones is broken (verse 36), as none of the lamb's could be. Through all of it John shows a Jesus who is in command: He carries His own cross, gives His mother a son, knows when “all things were now accomplished,” and gives up His spirit Himself (verses 17, 26–30).

sections:
  - range: 1-7
    heading: Behold the man
    plain: |
      Then Pilate took Jesus and had Him whipped. The soldiers twisted thorns into a crown and put it on His head, and dressed Him in a purple robe. They said, “Hail, King of the Jews!” and struck Him with their hands.

      Pilate went out again and said to them, “Look, I am bringing Him out to you, so that you may know that I find no case against Him.” So Jesus came out, wearing the crown of thorns and the purple robe, and Pilate said to them, “Here is the man!” When the chief priests and their officers saw Him, they shouted, “Crucify Him! Crucify Him!” Pilate said to them, “You take Him and crucify Him, for I find no case against Him.” The Jews answered him, “We have a law, and by that law He ought to die, because He made Himself the Son of God.”
  - range: 8-16
    heading: Behold your King
    plain: |
      When Pilate heard that, he was more afraid than before. He went back into the judgment hall and said to Jesus, “Where are you from?” But Jesus gave him no answer. So Pilate said to Him, “Will you not speak to me? Do you not know that I have authority to crucify you and authority to release you?” Jesus answered, “You would have no authority over me at all if it had not been given you from above. That is why the one who handed me over to you has the greater sin.”

      From then on Pilate tried to release Him, but the Jews shouted, “If you let this man go, you are no friend of Caesar. Anyone who makes himself a king speaks against Caesar.” When Pilate heard that, he brought Jesus out and sat down on the judgment seat at a place called the Pavement, in Hebrew Gabbatha. It was the day of preparation for the Passover, about noon. He said to the Jews, “Here is your King!” They shouted, “Away with Him, away with Him, crucify Him!” Pilate said to them, “Shall I crucify your King?” The chief priests answered, “We have no king but Caesar.” Then Pilate handed Him over to them to be crucified, and they took Jesus and led Him away.
  - range: 17-24
    heading: Golgotha
    plain: |
      Carrying His own cross, He went out to the place called the Place of a Skull, in Hebrew Golgotha. There they crucified Him, and two others with Him, one on each side, with Jesus in the middle. Pilate also wrote a notice and had it put on the cross. It read: JESUS OF NAZARETH THE KING OF THE JEWS. Many of the Jews read this notice, because the place where Jesus was crucified was near the city, and it was written in Hebrew, Greek and Latin. So the chief priests of the Jews said to Pilate, “Do not write ‘The King of the Jews,’ but ‘He said, I am King of the Jews.’” Pilate answered, “What I have written, I have written.”

      When the soldiers had crucified Jesus, they took His clothes and divided them into four shares, one for each soldier. They also took His tunic, which was seamless, woven in one piece from the top down. So they said to one another, “Let us not tear it, but cast lots for it to see whose it will be.” This was to fulfill the scripture that says, “They divided my garments among them, and for my clothing they cast lots.” So that is what the soldiers did.
  - range: 25-30
    heading: It is finished
    plain: |
      Standing near the cross of Jesus were His mother, His mother's sister, Mary the wife of Clopas, and Mary Magdalene. When Jesus saw His mother there, and the disciple whom He loved standing beside her, He said to His mother, “Woman, here is your son.” Then He said to the disciple, “Here is your mother.” And from that hour the disciple took her into his own home.

      After this, Jesus, knowing that everything was now accomplished, said, so that the scripture would be fulfilled, “I thirst.” A jar full of sour wine stood there, so they soaked a sponge in the wine, put it on a stalk of hyssop, and held it to His mouth. When Jesus had received the wine, He said, “It is finished.” Then He bowed His head and gave up His spirit.
  - range: 31-37
    heading: The pierced side
    plain: |
      It was the day of preparation, and the coming Sabbath was a great day. So that the bodies would not remain on the crosses on the Sabbath, the Jews asked Pilate to have the men's legs broken and the bodies taken away. The soldiers came and broke the legs of the first man, and then of the other who had been crucified with Jesus. But when they came to Jesus and saw that He was already dead, they did not break His legs. Instead, one of the soldiers pierced His side with a spear, and at once blood and water came out.

      The man who saw it has given his testimony, and his testimony is true. He knows that he is telling the truth, so that you also may believe. These things happened so that the scripture would be fulfilled, “Not one of His bones will be broken.” And another scripture says, “They will look on the one whom they pierced.”
  - range: 38-42
    heading: The burial
    plain: |
      After this, Joseph of Arimathaea, who was a disciple of Jesus, though secretly because he feared the Jews, asked Pilate for permission to take away the body of Jesus, and Pilate gave it. So he came and took the body. Nicodemus came too, the man who had first come to Jesus by night, bringing a mixture of myrrh and aloes weighing about a hundred pounds. They took the body of Jesus and wrapped it in linen cloths with the spices, as the Jews do in burying. In the place where He was crucified there was a garden, and in the garden a new tomb in which no one had yet been laid. Because it was the Jews' day of preparation, and the tomb was close at hand, they laid Jesus there.

notes:
  - ref: 1
    phrase: took Jesus, and scourged him
    kind: history
    title: Scourged and mocked
    body: |
      In John, Pilate has Jesus whipped before he sentences Him, while he is still trying to set Him free (verses 4, 6 and 12). In Luke, Pilate offers to have Jesus beaten and then released ([[Luke 23:22]]); in John he does it. John's verb is the one for a severe flogging, like the Jewish punishment of “forty stripes save one” ([[2 Cor. 11:24]]; [[Deut. 25:2–3]]), serious but not meant to kill. The scourging that Matthew and Mark describe is a different and worse thing: it came after the sentence, as the prelude to crucifixion, and it could kill a man before he ever reached the cross ([[Mark 15:15]]).

      The soldiers then turn the charge against Him into a game. He is accused of making Himself a king, so they crown Him with thorns, wrap Him in a king's purple, and salute Him with blows. They meant it to shame Him; it fulfilled what the prophets had said He would suffer, and Abinadi had said it in so many words: He “suffereth himself to be mocked, and scourged, and cast out, and disowned by his people” ([[Mosiah 15:5]]).
    sources: [huntsman-good-friday, lds-scriptures]
  - ref: 5
    phrase: Behold the man!
    kind: christ
    title: Behold the man!
    body: |
      Pilate brings Jesus out bleeding, crowned with thorns and dressed in the purple, and shows Him to the crowd: “Behold the man!” He may have meant the sight of a beaten, bleeding prisoner to sway them, so that someone would ask for mercy and spare Him the death the council wants.

      No one does. The chief priests and their officers answer with “Crucify him, crucify him” (verse 6). But the sight Pilate offered them was one the prophets had foreseen. Isaiah's Servant had a face “so marred more than any man” ([[Isa. 52:14]]) and was “wounded for our transgressions” ([[Isa. 53:5]]). Pilate shows the crowd a beaten prisoner, and the reader sees the Servant of the Lord.
    sources: [huntsman-good-friday]
  - ref: 7
    phrase: by our law he ought to die, because he made himself the Son of God
    kind: history
    title: Because he made himself the Son of God
    body: |
      Now the accusers bring out the charge they had held back. Before Pilate they had called Jesus an evildoer and a would-be king ([[John 18:30]]; [[John 18:33]]); now they say that under their own law He must die for making Himself the Son of God. The law they mean is the law against blasphemy, “he that blasphemeth the name of the LORD, he shall surely be put to death” ([[Lev. 24:16]]), and it is the charge on which they had tried to kill Him before ([[John 5:18]]; [[John 10:33]]). Pilate had already refused to take their verdict on that charge as his own.

      “The Jews” who say this are the chief priests and their officers who have just cried “Crucify him” (verse 6). In John the phrase usually means the leaders who opposed Jesus, and here it does: the same accusers are named “the chief priests” in verses 15 and 21. Not every “Jews” in the chapter is the council, though: the “many of the Jews” who read the title over the cross (verse 20) are the people passing by the city.
    sources: [lds-scriptures, huntsman-good-friday, ellicott-john]
  - ref: 9
    phrase: Whence art thou? But Jesus gave him no answer.
    kind: history
    title: Whence art thou?
    body: |
      Pilate is “the more afraid” (verse 8), most likely because he begins to wonder who Jesus really is. He has heard Jesus speak of a kingdom “not of this world” ([[John 18:36]]), and now he hears that Jesus claims to be the Son of God. So he does not ask where Jesus lives; he knew already that He was a Galilean. He asks what He is and where He comes from, the question Jesus had answered in the temple: “I know whence I came, and whither I go” ([[John 8:14]]).

      To Pilate He gives no answer at all. His silence is the Servant's, who “opened not his mouth” ([[Mosiah 14:7]]), and Abinadi says it of the Messiah's trial: “he shall be led, yea, even as Isaiah said, as a sheep before the shearer is dumb, so he opened not his mouth” ([[Mosiah 15:6]]).
    sources: [ellicott-john, lds-scriptures]
  - ref: 11
    phrase: Thou couldest have no power at all against me, except it were given thee from above
    kind: christ
    title: Given thee from above
    body: |
      Pilate has just boasted of his power twice in one breath (verse 10). The word is authority, and Jesus tells him he has none against Him except what was given him “from above,” that is, by God. And “from above” answers Pilate's own question, “Whence art thou?”: as John wrote earlier, “He that cometh from above is above all” ([[John 3:31]]).

      “Therefore he that delivered me unto thee hath the greater sin.” Pilate's sin is real, but it is the lesser. One reading explains the difference: Pilate acts against his own better judgment, but not against the full light. And since Judas handed Jesus over to the Jewish leaders, not to Pilate, the one who “delivered me unto thee” is in that reading the council, and above all Caiaphas the high priest, who professed to represent God and handed over His Son. The footnote to “sin” points the same way, to Caiaphas's counsel that one man should die for the people ([[John 18:14]]).
    sources: [ellicott-john, huntsman-good-friday, lds-scriptures]
  - ref: 12
    phrase: thou art not Cæsar’s friend
    kind: history
    title: Not Caesar’s friend
    body: |
      The leaders' appeal to Caesar is the threat that moves Pilate. They now say what they will report to Rome if he lets Jesus go: that the governor released a man who made himself a king. Under the emperor Tiberius that was a dangerous thing to have said of you. Rome was full of treason trials over real and imagined plots against the emperor, and the accusation was nearly as good as a conviction. Pilate may have had his own reason to fear: his possible patron in Rome, Sejanus, had lately been brought down for conspiring against the emperor.

      Roman law gave the words more weight still. A decree of Augustus in AD 11 had made prophecy and magic aimed against the emperor punishable by death, and the accusers' charge that a self-made king “speaketh against Cæsar” may reach for such a law. The kingdom Jesus claimed was “not of this world” ([[John 18:36]]) and no threat to Caesar's; what served the accusers was the charge, not its truth.
    sources: [huntsman-good-friday, sc-knowhy-676, ellicott-john]
  - ref: 13
    phrase: a place that is called the Pavement, but in the Hebrew, Gabbatha
    kind: history
    title: The Pavement, Gabbatha
    body: |
      Pilate now takes his seat on the “judgment seat,” the raised tribunal from which a Roman magistrate gave judgment, and John is careful to say where it stood. The Greek name, *Lithostrōton*, means “strewn stones,” a floor laid with stones. It most likely refers to the famous and costly mosaic floor of the courtyard of the palace that Herod the Great had built, of white cubes set among colored stones. The flagstones long shown to pilgrims near the Chapel of the Condemnation are not the place; they were thought to belong to the Fortress Antonia, wrongly. The Aramaic name, *Gabbatha*, seems to mean “an elevated place,” so that one name describes the floor and the other the height on which it lay.

      The setting has its own meaning. A Roman governor sits in judgment in the palace of the king Rome had replaced, and the scene has the look of a formal sentence.
    sources: [huntsman-good-friday, ellicott-john]
  - ref: 14
    phrase: it was the preparation of the passover, and about the sixth hour
    kind: history
    title: The preparation of the passover, the sixth hour
    body: |
      John dates the sentence with care. It is “the preparation of the passover,” the day on which the Passover was made ready, and the feast will begin at sunset, after Jesus has died. “The sixth hour” is about noon. Mark says Jesus was crucified at “the third hour,” about nine in the morning ([[Mark 15:25]]), which leaves little time for all the trial requires; John may remember it differently, or may have seen that the morning's events needed more time. In John's account Jesus hangs on the cross for a shorter time.

      The hour matters to John because of what was happening in the temple that afternoon. John's timing suggests that Jesus, condemned at noon, died while the Passover lambs were being slaughtered in the temple for the meal that evening. Matthew, Mark and Luke make the Last Supper a Passover meal, and the ways of reconciling the accounts are set out at [[John 13:1]]. However they are reconciled, Jesus's death fell at the Passover, and John has called Him “the Lamb of God” from the start ([[John 1:29]]; [[John 1:36]]).
    sources: [huntsman-gospel-john, huntsman-lamb-of-god, sc-knowhy-845]
  - ref: 15
    phrase: We have no king but Cæsar
    kind: history
    title: No king but Caesar
    body: |
      “Behold your King!” (verse 14) is bitter irony, and so is “Shall I crucify your King?” Pilate taunts the accusers with the man they have brought him. Their answer is meant to frighten him again with Rome, and it does: in the next verse he hands Jesus over.

      But the words cost them more than they cost Pilate. The chief priests of a people who looked for God's own rule, and for an anointed king who would free them from Rome, now say that Caesar is their only king. In the temple Jesus's hearers had boasted, “We be Abraham's seed, and were never in bondage to any man” ([[John 8:33]]); now, to be rid of Jesus, the chief priests confess Caesar as their only king and give up the hope of Israel's own.
    sources: [ellicott-john]
  - ref: 17
    phrase: he bearing his cross went forth
    kind: scripture
    title: Bearing his cross
    body: |
      Matthew, Mark and Luke tell how the soldiers made Simon of Cyrene carry the cross ([[Mark 15:21]]). John says only that Jesus went out “bearing his cross,” and names no one else. The silence fits the Jesus of this Gospel, who needs no help: in John's telling He bears His own cross the whole way and accomplishes His sacrifice on His own.

      Isaac had carried wood too: “Abraham took the wood of the burnt offering, and laid it upon Isaac his son” ([[Gen. 22:6]]). Both sons carried the wood on which they were to be offered, and both went willingly. Isaac was strong enough to carry a load of wood up the mountain, and so likely strong enough to resist his aged father if he had wanted to; Jesus offered no resistance at all. The Book of Mormon reads Abraham's offering of Isaac as “a similitude of God and his Only Begotten Son” ([[Jacob 4:5]]).
    sources: [huntsman-lamb-of-god, sc-knowhy-412, lds-scriptures]
  - ref: 19
    phrase: JESUS OF NAZARETH THE KING OF THE JEWS
    kind: history
    title: The title on the cross
    body: |
      The “title” was the Roman notice of the crime for which a man was crucified, here fixed to His cross. All four Gospels describe it and give its words a little differently ([[Mark 15:26]]), but the sense is the same in all. John gives the charge in its fullest form, written in three languages: in Hebrew (that is, the Aramaic the people spoke), in Greek, the most widely known language of the day, and in Latin, the language of Rome's government. The place was near the city, so many who passed could read it.

      That is why the chief priests object. They want it to read as a claim Jesus made, not as a fact, because the title “King of the Jews” over a crucified man holds the Messiah's name up to scorn before everyone. They are the same men who have just said, “We have no king but Cæsar.” Pilate's reply, “What I have written I have written,” was a set way of saying that a thing was done and would not be undone. The charge was about who Jesus is, the Christ, and Pilate leaves it standing over Him, in the languages of the whole world.
    sources: [ellicott-john, huntsman-good-friday]
  - ref: 23
    phrase: the coat was without seam, woven from the top throughout
    kind: symbol
    title: The coat without seam
    body: |
      The soldiers who carried out a crucifixion had a right to the condemned man's belongings, and all four Gospels say they cast lots for His clothes. Matthew and John see in it the psalm: “They part my garments among them, and cast lots upon my vesture” ([[Ps. 22:18]]). John reads the psalm's two lines as two acts. The “garments” are Jesus's outer clothing, divided four ways; the “vesture” is His inner tunic (the King James “coat”), which the soldiers will not cut up, and for which they cast lots.

      John stops to describe the tunic: seamless, woven in one piece from the top down. He seems to mean something by it. The robe of the high priest was specially woven ([[Ex. 39:22–26]]), and if the seamless tunic recalls it, then John shows Jesus as a priest as well as a king, about to offer Himself as the sacrifice. The reading is a suggestion, not a certainty; John does not explain the detail.
    sources: [huntsman-good-friday, lds-scriptures]
  - ref: 25
    phrase: his mother, and his mother’s sister, Mary the wife of Cleophas, and Mary Magdalene
    kind: history
    title: The women by the cross
    body: |
      In Matthew, Mark and Luke the women who followed Jesus from Galilee watch “afar off” ([[Mark 15:40]]). John puts a group of women and the beloved disciple at the foot of the cross. Of that day Elder Jeffrey R. Holland said, “Especially and always the blessed women in the Savior’s life stayed as close to Him as they could.”

      How many women John names is uncertain, because the Greek list has no “and” where a reader would want one. It can be read as three, with “Mary the wife of Cleophas” as the sister of Jesus's mother, or as four in two pairs: His mother and her sister, then Mary the wife of Cleophas (or Clopas) and Mary Magdalene. On balance four is the likelier reading, though it cannot be settled, and an early Syriac translation already added the “and.” Read that way, the unnamed sister may be the mother of John himself, Salome, whom he never names, as he never names himself.
    sources: [holland-none-with-him, ellicott-john]
  - ref: 26
    phrase: Woman, behold thy son!
    kind: christ
    title: Woman, behold thy son!
    body: |
      From the cross Jesus provides for His mother. (“Woman” is not cold here, any more than at Cana; see the note on [[John 2:4]].) Joseph does not appear in the Gospels' story of Jesus's ministry and was presumably dead, so Jesus, about to die, gives her into the care of the disciple He loved. That disciple is John, who in his Gospel calls himself “the disciple whom Jesus loved” (see the note on [[John 13:23]]). He did as he was asked, “from that hour.”

      The scene can also be read as more than provision for a widow. John names neither the mother nor the disciple, and both can stand for disciples in general. Read so, the cross makes a new family: the one who had been a follower and student of the Master is brought into a closer relationship with Him, and so is every believer after him.
    sources: [ellicott-john, bd-john, huntsman-good-friday]
  - ref: 28
    phrase: that the scripture might be fulfilled, saith, I thirst
    kind: scripture
    title: I thirst
    body: |
      Jesus asks for a drink on purpose. John says He knew that “all things were now accomplished,” and spoke so that the scripture might be fulfilled, the psalm in which the sufferer says, “in my thirst they gave me vinegar to drink” ([[Ps. 69:21]]). “Accomplished” here is the same Greek word Jesus will speak two verses later, “It is finished” (*tetelestai*): He knows the work is done before He says so.

      The vinegar was a cheap sour wine, and the sponge was lifted on “hyssop,” where Matthew and Mark say a reed ([[Mark 15:36]]). Hyssop is a small, bushy plant, probably too short to reach a man on a cross and too weak to hold up a soaked sponge, so John's word is likely chosen for its meaning. Hyssop was the plant Israel used to put the blood of the first Passover lamb on their doorposts ([[Ex. 12:22]]).
    sources: [lds-scriptures, huntsman-good-friday, thayer, sc-knowhy-845, huntsman-lamb-of-god]
  - ref: 30
    phrase: 'It is finished: and he bowed his head, and gave up the ghost'
    kind: christ
    title: It is finished
    body: |
      “It is finished” is one word in Greek, *tetelestai*, and it means more than “it is over.” The verb is used of carrying a task through to its last act: everything the Father had appointed, and the scriptures had foretold, that Jesus must do and bear has been done. As Elder Robert D. Hales said of it, “He completed the work He had been sent to do.”

      The words can also be read as spoken to the Father. In Matthew, Joseph Smith's translation gives Jesus's last cry as “Father, it is finished, thy will is done” (JST Matt. 27:54, in the footnote to [[Matt. 27:50]]). Elder Hales set John's “It is finished” beside Luke's “Father, into thy hands I commend my spirit” ([[Luke 23:46]]) and said, “We know He was praying to His Heavenly Father.”

      Then He “gave up the ghost.” John's verb is the one used all through the Passion for handing Jesus over (verse 16), and here Jesus hands over His own spirit. In the other Gospels and in Acts, Jesus is put to death by His enemies and raised by God. In John He lays His life down Himself, as He had said He would: “No man taketh it from me, but I lay it down of myself” ([[John 10:18]]).
    sources: [thayer, hales-gaining-testimony, lds-scriptures, huntsman-good-friday, huntsman-lamb-of-god]
  - ref: 31
    phrase: that their legs might be broken
    kind: history
    title: That their legs might be broken
    body: |
      Rome usually left the crucified on their crosses. The law of Moses did not: “His body shall not remain all night upon the tree, but thou shalt in any wise bury him that day” ([[Deut. 21:23]]). The leaders were the more anxious because the coming Sabbath was “an high day.” In John's reckoning the Passover began at sunset, and probably the weekly Sabbath as well, so the bodies had to come down before evening. Another reading takes the “sabbath” of this verse to be the first day of the feast itself, which was kept as a sabbath whatever day of the week it fell on, and so may have fallen on a Friday.

      Breaking the legs was a known Roman punishment. How often it went with crucifixion is uncertain: an older commentary says it sometimes did, while a recent study finds little evidence of it, probably because crucifixion was not meant to be quick. In John's account the purpose is plainly to make sure the men died before sunset. Jesus was dead already.
    sources: [lds-scriptures, ellicott-john, huntsman-good-friday, sc-knowhy-300, strathearn-crucifixion]
  - ref: 34
    phrase: forthwith came there out blood and water
    kind: symbol
    title: Blood and water
    body: |
      The soldier's spear was meant to make sure that Jesus was dead, and what came out was blood and water. John stops the story to swear to it: “he that saw it bare record, and his record is true” (verse 35). The writer speaks of himself in the third person, and he insists that this is an eyewitness's testimony, given “that ye might believe.” Only John tells of the wound in the side.

      What it means, John does not say, and the readings agree on the blood more than on the water. In these readings the blood stands for Jesus's humanity and His mortal death. The water has been read as the Spirit, which Jesus said would flow like “rivers of living water” ([[John 7:38–39]]), or as the water of cleansing. Perhaps more in keeping with the rest of John is water as everlasting life ([[John 4:14]]). Read that way, the two together show who Jesus is: from His mortal mother came the blood by which He could lay down His life, and from His immortal Father the life by which He could take it up again.

      The risen Lord made this wound a sign of His sacrifice. In Jerusalem He showed the disciples His hands and then His side ([[John 20:20]], [[John 20:27]]). At Bountiful He reversed the order and invited the people first to “thrust your hands into my side” ([[3 Ne. 11:14]]), for the wound in the side showed them He had been slain as a sacrifice.
    sources: [huntsman-good-friday, ellicott-john, huntsman-lamb-of-god, sc-knowhy-759]
  - ref: 36
    phrase: A bone of him shall not be broken
    kind: scripture
    title: A bone of him shall not be broken
    body: |
      John sees a scripture fulfilled in what the soldiers did not do, and his words fit two passages. One is the psalm of the righteous man whom the Lord delivers: “He keepeth all his bones: not one of them is broken” ([[Ps. 34:20]]). The other is the law of the Passover lamb: “neither shall ye break a bone thereof” ([[Ex. 12:46]]; [[Num. 9:12]]). An unbroken lamb was as much a requirement of the Passover as a lamb without blemish, so the soldiers' restraint fulfills in Jesus the law of the lamb, and John has called Him “the Lamb of God” from the start ([[John 1:29]]).
    sources: [huntsman-lamb-of-god]
  - ref: 37
    phrase: They shall look on him whom they pierced
    kind: scripture
    title: They shall look on him whom they pierced
    body: |
      The “another scripture” of verse 37 is from Zechariah, where the Lord says, “they shall look upon me whom they have pierced, and they shall mourn for him” ([[Zech. 12:10]]). The prophecy speaks of the Lord Himself, Jehovah, as pierced by His people. The Greek translation of the prophets avoided the strong word “pierced” where it was said of Jehovah and put “insulted” in its place; John's wording follows the Hebrew, keeps “pierced,” and sees it fulfilled in the Messiah pierced on the cross.

      The Lord has given the rest of that prophecy in this dispensation. On the day He appears, those who look on Him will ask about His wounds, and He will answer: “These wounds are the wounds with which I was wounded in the house of my friends. I am he who was lifted up. I am Jesus that was crucified. I am the Son of God” ([[D&C 45:52]]). The wounds John saw made are the marks by which the Messiah will be known.
    sources: [ellicott-john, sc-knowhy-790]
  - ref: 39
    phrase: about an hundred pound weight
    kind: history
    title: An hundred pound weight
    body: |
      The two men who bury Jesus are both members of the council that condemned Him. Joseph of Arimathaea was a respected and wealthy member of the Sanhedrin and a disciple, “but secretly for fear of the Jews,” his fellow leaders. John has spoken before of rulers who believed but would not confess it, “lest they should be put out of the synagogue: for they loved the praise of men more than the praise of God” ([[John 12:42–43]]). Now Joseph goes to Pilate and asks for the body.

      Nicodemus is the one “which at the first came to Jesus by night” ([[John 3:2]]). That night he had heard that “the Son of man” must “be lifted up” ([[John 3:14]]). Now he has seen it, and he comes into the open as one who loved Jesus, to honor Him in death. The spices he brings weigh about seventy-five pounds by modern measure, far more than could be wrapped in the linen with the body: a gift of love, and an amount fit for a king, as when King Asa was laid in a bed “filled with sweet odours and divers kinds of spices” ([[2 Chr. 16:14]]).
    sources: [huntsman-good-friday, lds-scriptures, huntsman-lamb-of-god, ellicott-john]

christ: |
  John 19 shows Jesus as the King whom His accusers refuse and Pilate proclaims in irony, and as the Lamb of God, condemned on the day of preparation and dying with no bone broken. To the end He is the one who acts: He carries His own cross, gives His mother a son, knows when all is accomplished, and lays down His life Himself, as He said: “No man taketh it from me, but I lay it down of myself” ([[John 10:18]]). “It is finished” is the word of one who has done all the Father gave Him to do.

  Because He finished that work, and walked the way to it alone, no disciple has to walk the hard part of his own way alone (see the Witness of Christ in [[John 16]]).

explore: |
  - **John's Passion as a whole.** “The Lamb of God: Unique Aspects of the Passion Narrative in John,” in *Behold the Lamb of God*, sets out what John alone tells of the last day, from Jesus carrying His own cross to the blood and water.
  - **The other accounts.** [[Matt. 27]], [[Mark 15]] and [[Luke 23]] tell the same day, with the darkness, the cry from Psalm 22, and the thief who repented.
  - **What follows.** [[John 20:1–18]]: the tomb in the garden is found empty, and Mary Magdalene meets the risen Lord there.

