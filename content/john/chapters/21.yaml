chapter: 21
title: Feed My Sheep
tagline: At the sea of Tiberias the risen Lord fills the nets of seven disciples who had fished all night for nothing, feeds them at a fire of coals, asks Peter three times whether he loves Him and charges him to feed His sheep, foretells Peter's death, and answers Peter's question about the beloved disciple; the Gospel closes on the witness of that disciple.
when: 'At the sea of Galilee, some time after the first Easter and within the forty days before the Ascension ([[Acts 1:3]])'

setting: |
  The Gospel seemed to have ended. Chapter 20 closes with John's statement of why he wrote, “that ye might believe that Jesus is the Christ, the Son of God” ([[John 20:31]]), and then chapter 21 takes the story up again. Its style may suggest it was added later; it is the Gospel's epilogue, and it is scripture like the rest.

  The scene has moved from Jerusalem to Galilee. Some of the disciples have gone home, apparently because on Easter morning they had been told to go there ([[Mark 16:7]]). Jesus was seen by His apostles for forty days before He ascended, but most of those appearances were never written down; the Gospels record two in Galilee, this one by the lake (called here by its other name, the sea of Tiberias) and one on a mountain ([[Matt. 28:16–20]]).

  The chapter has three parts: a last appearance, to seven disciples at their boats; Jesus's talk with Peter, which turns the story from the Lord's ministry to the Church Peter will lead; and the fate and the witness of the beloved disciple. Its question about that disciple, whether he would die, is the one Joseph Smith and Oliver Cowdery asked in 1829, and the Lord's answer is [[D&C 7]].

thread: |
  **The risen Lord calls His disciples a second time, by the same lake and with the same kind of miracle as the first, and turns them from fishing to feeding His sheep.**

  The chapter begins with Peter going back to the work he left three years before, and with a night in which the nets take nothing. It ends with the fishermen made shepherds: Peter, who denied his Lord three times by a fire of coals, is asked three times, after a meal at another such fire, whether he loves Him, and each answer is met with a charge, “Feed my sheep.” The disciples will leave their nets a second time. The story now looks ahead to the Church Peter will lead and care for.

  Two words of Jesus carry the chapter's last movement: “Follow me” (verse 19), which costs Peter his life, and “what is that to thee? follow thou me” (verse 22), which leaves the beloved disciple's very different path in the Lord's hands.

sections:
  - range: 1-14
    heading: The Lord on the shore
    plain: |
      After this Jesus showed Himself again to the disciples, at the sea of Tiberias, and this is how it happened. Simon Peter, Thomas called Didymus, Nathanael of Cana in Galilee, the sons of Zebedee and two other disciples were together. Simon Peter said to them, “I am going fishing.” They said, “We will come with you.” They went out and got into the boat, and that night they caught nothing.

      Just as day was breaking, Jesus stood on the shore, but the disciples did not know it was Jesus. Jesus called to them, “Children, have you any fish?” They answered, “No.” He said, “Cast the net on the right side of the boat, and you will find some.” So they cast it, and now they could not haul it in for the number of fish. Then the disciple whom Jesus loved said to Peter, “It is the Lord.” When Simon Peter heard that it was the Lord, he wrapped his fisher's coat around him (for he was naked) and threw himself into the sea. The other disciples came in the small boat, dragging the net full of fish, for they were not far from land, only about two hundred cubits.

      When they came ashore, they saw a charcoal fire there with fish laid on it, and bread. Jesus said, “Bring some of the fish you have just caught.” Simon Peter went up and hauled the net ashore, full of large fish, a hundred and fifty-three of them; and though there were so many, the net was not torn. Jesus said to them, “Come and eat.” None of the disciples dared ask Him, “Who are you?” They knew it was the Lord. Jesus came and took the bread and gave it to them, and the fish as well. This was now the third time Jesus showed Himself to His disciples after He was raised from the dead.
  - range: 15-19
    heading: Lovest thou me?
    plain: |
      When they had eaten, Jesus said to Simon Peter, “Simon, son of Jonas, do you love me more than these?” He said, “Yes, Lord; you know that I love you.” Jesus said, “Feed my lambs.” He asked him a second time, “Simon, son of Jonas, do you love me?” He said, “Yes, Lord; you know that I love you.” Jesus said, “Shepherd my sheep.” He asked him the third time, “Simon, son of Jonas, do you love me?” Peter was grieved that He asked him the third time, “Do you love me?” and he said, “Lord, you know all things; you know that I love you.” Jesus said, “Feed my sheep.”

      “Truly, truly, I tell you: when you were young, you fastened your own belt and walked where you wanted. But when you are old, you will stretch out your hands, and another will fasten a belt on you and take you where you do not want to go.” He said this to show by what kind of death Peter would glorify God. And after saying it He told him, “Follow me.”
  - range: 20-23
    heading: What shall this man do?
    plain: |
      Peter turned and saw the disciple whom Jesus loved following them, the one who had leaned on His breast at the supper and asked, “Lord, who is it that will betray you?” Seeing him, Peter said to Jesus, “Lord, and what about this man?” Jesus said to him, “If I will that he remain until I come, what is that to you? You follow me.” So the saying spread among the brethren that this disciple would not die. Yet Jesus did not tell him he would not die, but only, “If I will that he remain until I come, what is that to you?”
  - range: 24-25
    heading: His testimony is true
    plain: |
      This is the disciple who bears witness of these things and who wrote them down, and we know that his testimony is true. Jesus did many other things as well. If every one of them were written down, I suppose the world itself could not hold the books that would be written. Amen.

notes:
  - ref: 2
    phrase: There were together Simon Peter, and Thomas called Didymus
    kind: symbol
    title: Seven disciples
    body: |
      John names five of the seven and leaves two unnamed. The first two named are the two whose faltering the Gospel has just told: Peter, who three times said he was not Jesus's disciple ([[John 18:17–27]]), and Thomas, who would not believe without seeing ([[John 20:25]]). Nathanael is the man of Cana whom Jesus saw under the fig tree ([[John 1:45–51]]). The sons of Zebedee, never named in this Gospel, are James and John, fishermen called by this same sea ([[Matt. 4:21–22]]), and John is the disciple whom Jesus loved.

      The list can also be read as a picture of discipleship. On one Latter-day Saint reading, Peter and Thomas stand at its head as men taken back after they stumbled; Nathanael, who may not have been one of the Twelve, stands for those who follow Jesus fully without that office; and the two unnamed stand for any disciple in any age, so that seven, the number of fullness, gathers all disciples into the scene. That is a reading of the list, not something John says.
    sources: [lds-scriptures, bd-john, huntsman-postlude]
  - ref: 3
    phrase: I go a fishing
    kind: prophets
    title: I go a fishing
    body: |
      John gives no reason why Peter went fishing. The disciples were in Galilee, apparently because they had been told to go there ([[Mark 16:7]]). But the words have been heard as more than a night's work. In a retelling of the scene that takes “nonscriptural liberty,” Peter tells the others that he means to return to his former life, rejoicing, and they answer, “We also go with thee.”

      In that retelling the Lord's answer, given at the same shore and the same nets, is that He needs disciples, not fish, and asks Peter a second time to leave all this. The Resurrection is a beginning, not an ending: “We can't quit and we can't go back. After an encounter with the living Son of the living God, nothing is ever again to be as it was before.”
    sources: [huntsman-postlude, holland-first-great-commandment]
  - ref: 5
    phrase: Children, have ye any meat?
    kind: words
    title: Children, have ye any meat?
    body: |
      Neither “meat” nor “children” means here what a modern reader hears. The Greek word behind “meat,” found only here in the New Testament, means anything eaten with bread, and on the lake that was fish: the stranger on the shore is asking whether they have caught anything. “Children” renders a word of affectionate address, something like “dear ones.”

      Their one-word answer, “No,” is the answer no fisherman wants to give. A moment later they let down the net at a stranger's word, and they were rightly called children.
    sources: [thayer, holland-first-great-commandment]
  - ref: 6
    phrase: Cast the net on the right side of the ship
    kind: scripture
    title: Cast the net on the right side
    body: |
      The scene repeats the morning Peter was first called. Then too he and his partners had “toiled all the night, and … taken nothing”; Jesus, speaking from Simon's boat, told them to let down their nets, and the catch was so great that the nets broke and two boats began to sink; He told Simon, “from henceforth thou shalt catch men,” and they left everything and followed Him ([[Luke 5:4–11]]). Like Mary Magdalene and the two on the road to Emmaus, the disciples do not at first know the risen Lord when they see Him. The repetition seems to be what opened the beloved disciple's eyes: the night of nothing, the command, the full net. The men called at the first are being called again by the same sea, and they will leave their nets a second time.
    sources: [huntsman-postlude, holland-first-great-commandment]
  - ref: 9
    phrase: a fire of coals
    kind: symbol
    title: A fire of coals
    body: |
      John's word for the fire, *anthrakia*, a heap of burning coals, is found in the New Testament only here and at [[John 18:18]], the fire in the high priest's courtyard where Peter stood warming himself and denied his Lord. The detail looks like a passing one, but it ties the two scenes together. Peter last stood beside such a fire as the man who said three times that he was not Jesus's disciple; now he comes ashore to another, and the Lord is standing by it. The threefold question of verses 15–17 comes after a meal at the very kind of fire that witnessed the threefold denial.

      The fire was also for them. The men came ashore cold, tired and hungry after a night of catching nothing, and before He asked Peter anything the Lord had made a fire to warm them and cooked their breakfast on it.
    sources: [thayer, huntsman-postlude, skinner-peter-chief-apostle]
  - ref: 11
    phrase: yet was not the net broken
    kind: symbol
    title: Yet was not the net broken
    body: |
      The net that held points back to the first call, when “their net brake” ([[Luke 5:6]]). One reading takes the broken nets of that morning as a picture of the disciples' first call to the ministry, which was still imperfect. This time the net holds and nothing is lost: the men called to be fishers of men tow the full net all the way to shore and bring every fish to present to Jesus. It is the Gospel's last miracle, a final sign.

      The number has drawn many explanations (one fish of every known kind, the nations, the Trinity), none of them with any clue in the text. One simple explanation is in the verse itself: the fish were all “great,” and a haul like that would be counted. Such a catch would be talked about, and John recorded it with his usual eye for exact detail.
    sources: [huntsman-postlude, ellicott-john, huntsman-gospel-john]
  - ref: 13
    phrase: taketh bread, and giveth them
    kind: christ
    title: Taketh bread, and giveth them
    body: |
      Jesus is the host, and the meal shows what He is about to ask of Peter. He invites them to eat, takes the bread and gives it to them, and the fish too. The Savior who had already wrought the Atonement for all humankind did not think it beneath Him to cook for tired fishermen and serve them with His own hands, and in that setting He taught Peter the work of the rest of his life: to feed the Savior's sheep as the Savior had fed him that morning (verses 15–17).

      Bread and fish from His hands also recall the feeding of the five thousand ([[John 6:1–14]]), which by tradition took place not far from this shore. The Gospel's ministry began at a wedding feast in Cana and ends at a meal on the beach, and one Latter-day Saint reading sees in this meal a figure of both the sacrament and the messianic banquet to come.
    sources: [skinner-peter-chief-apostle, huntsman-postlude]
  - ref: 14
    phrase: This is now the third time that Jesus shewed himself to his disciples
    kind: history
    title: The third time
    body: |
      Mary Magdalene saw Him first ([[John 20:14–17]]), so “the third time” counts something narrower, as the verse says: His showing Himself “to his disciples.” John has told of two such appearances. The first was on the evening of Easter day, when Thomas was absent ([[John 20:19–24]]); the second was a week later, with Thomas present ([[John 20:26]]). This is the third, and the last the Gospel records.
    sources: [lds-scriptures]
  - ref: 15
    phrase: lovest thou me more than these?
    kind: history
    title: More than these
    body: |
      Jesus does not say what “these” are. The message is clearest if “these” are the boats, the nets and the pile of 153 fish, the old life Peter had gone back to that night, so that the question is, “Peter, do you love me more than you love all this?” Some take “these” to be the other disciples dining with them. The question would then recall Peter's boast on the night of the Supper, “Though all men shall be offended because of thee, yet will I never be offended” ([[Matt. 26:33]]), and however tenderly put it must have wrung his heart. Peter's answer makes no comparison at all; he appeals to what the Lord knows.

      Jesus also calls him “Simon, son of Jonas,” the name he bore before Jesus called him Cephas ([[John 1:42]]), not the name Peter, perhaps addressing him as one who had been true to his natural name rather than to his apostolic one.
    sources: [ellicott-john, talmage-jesus-christ-37, holland-first-great-commandment, ball-peters-witness]
  - ref: 16
    phrase: Simon, son of Jonas, lovest thou me?
    kind: words
    title: Two words for love, two for feeding
    body: |
      The English uses one word for love and one for feed, but the Greek has two of each. Jesus's first two questions use *agapaō*, the word often thought of as godly love and elsewhere translated “charity”; His third uses *phileō*, the love of friends. Peter answers all three times with *phileō*. The charges vary too: “feed” (*boskō*, to pasture or nourish) the lambs, “feed” (*poimainō*, to tend or shepherd) the sheep, and “feed” (*boskō*) the sheep. Some commentators have read a lesson in each pairing: the Lord asked whether Peter had both charity and brotherly love for Him, and taught him to nourish and to shepherd the young and the old of His flock.

      Others caution that John often uses the two words for love interchangeably, so the change may carry no special weight. On either reading the point lies in the charges: love for the Master is shown by caring for His sheep.
    sources: [ball-peters-witness, huntsman-postlude]
  - ref: 17
    phrase: Peter was grieved because he said unto him the third time
    kind: christ
    title: Three times
    body: |
      Peter is grieved by the third question, perhaps thinking the Lord did not trust him, or perhaps remembering that only days before he had been asked another question three times and had answered just as firmly, but in denial. He had denied his Lord three times; now he is given three times to say that he loves Him. Each time he says it, the Lord gives him work to do. The charge itself is a mark of the Lord's confidence in him, and of Peter's place at the head of the apostles.

      Peter had failed, and through Jesus Christ he was fully redeemed and served faithfully afterward; his long ministry of feeding Christ's sheep shows it.
    sources: [huntsman-peters-denial, talmage-jesus-christ-37, holland-first-great-commandment]
  - ref: 18
    phrase: thou shalt stretch forth thy hands, and another shall gird thee
    kind: history
    title: Thou shalt stretch forth thy hands
    body: |
      The young man fastens his own belt and goes where he likes; the old man stretches out his hands, is bound by another and taken where he would not go. John explains it himself in verse 19: Jesus was showing “by what death he should glorify God.” Peter had said he was ready to follow his Master to prison and to death ([[Luke 22:33]]), and now the Lord tells him he will.

      Years later Peter wrote that he must shortly put off his body, “even as our Lord Jesus Christ hath shewed me” ([[2 Pet. 1:14]]), words that undoubtedly look back to this prophecy. Early Christian writers record that he died a martyr in Rome in the last years of Nero, and Origen reports that he was crucified head downward. Outstretched hands fit that death, though the words are less exact than the tradition: a prisoner would be bound before he was crucified, not after, and “by what death” may mark only a martyr's death as distinct from a natural one.

      Then comes “Follow me,” the call Peter first heard by this same sea ([[Matt. 4:18–19]]), now spoken just after the prophecy of how he would die. At the Supper he had been told that he could not follow now but would follow afterward (see the note on [[John 13:36]]).
    sources: [skinner-peter-chief-apostle, ellicott-john]
  - ref: 22
    phrase: If I will that he tarry till I come
    kind: scripture
    title: Till I come
    body: |
      Peter has just learned how he will die, and seeing the beloved disciple following, he asks what will become of him. The answer sends him back to his own path: “what is that to thee? follow thou me.” The revelation that explains these words (below) shows why the two paths differ. One Latter-day Saint reading also takes the exchange as a pattern for any disciple: a few, like Peter, are asked to die for their testimony, most are asked to live for it, and none is to judge another's discipleship.

      Whether the beloved disciple would die, this verse alone does not say, and the confusion it caused began, as verse 23 shows, among the first disciples. In April 1829 Joseph Smith and Oliver Cowdery asked whether John “tarried in the flesh or had died.” The answer, [[D&C 7]], is a translated version of a record John made on parchment. In it the Lord asks John what he desires, and John asks for “power over death, that I may live and bring souls unto thee”; the Lord grants it: “thou shalt tarry until I come in my glory.” The revelation then gives the words of this verse with their reason: “For he desired of me that he might bring souls unto me, but thou desiredst that thou mightest speedily come unto me in my kingdom” ([[D&C 7:4]]). The Lord tells them, “ye both joy in that which ye have desired” ([[D&C 7:5]]).

      So John did not die. He remains on the earth as a ministering servant until the Second Coming; to tarry until the Lord comes is to be translated, changed so that he is immortal though not yet resurrected. The Book of Mormon confirms it: three of the Nephite disciples desired “the thing which John, my beloved … desired of me” ([[3 Ne. 28:6]]), and what 3 Nephi 28 says of them illuminates John's translation as well.

      Verse 23 then separates what Jesus said from what the brethren concluded. He did not say, “He shall not die”; He said, “If I will that he tarry till I come,” words that left John's fate open. Taken at face value, the denial seems to cast doubt on John's translation, but it likely reflects an editor's answer to the speculation about John, correcting the rumor by returning to the Lord's exact words, not correcting the Lord. Joseph Smith's translation leaves these verses as they are; what the words left open, the revelation answered.
    sources: [lds-scriptures, bd-john, judd-szink-dc7, huntsman-postlude]
  - ref: 24
    phrase: we know that his testimony is true
    kind: history
    title: We know that his testimony is true
    body: |
      Someone other than the beloved disciple is speaking here. The verse says he “wrote these things,” and then others add, “we know that his testimony is true.” It is an editorial addition, made early and found in every important manuscript. Who “we” were cannot be known. The verse may mean that John wrote the Gospel himself, or that he had his witness written down by a scribe; either way the testimony is his. Latter-day revelation supports the traditional view that the beloved disciple is John (see the setting of [[John 1]] and [[D&C 7:1–3]]).

      The last verse changes voice again, from “we know” to “I suppose,” and these last two verses seem to have been added by a later editor. What he says, the Gospel has already said at the end of chapter 20: many other things Jesus did “are not written in this book,” and these were written “that ye might believe” ([[John 20:30–31]]).
    sources: [huntsman-gospel-john, ellicott-john, huntsman-postlude, lds-scriptures]

christ: |
  The risen Lord comes to men who have gone back to their nets, fills the nets, and feeds them before He asks them anything. Then He lets the disciple who denied Him three times say three times that he loves Him, and each time entrusts His flock to him. He restores Peter, and He shows what love for Him looks like: “Feed my sheep.”

  The Lord gave the same charge to the Twelve in this dispensation: “follow me, and feed my sheep” ([[D&C 112:14]]). Love for Him is shown by caring for others, as King Benjamin taught: “when ye are in the service of your fellow beings ye are only in the service of your God” ([[Mosiah 2:17]]). A disciple who has failed can be redeemed and renew that devotion by ministering, each on the path the Lord gives, without measuring another's.

explore: |
  - **The seashore and after.** “Postlude: Later Appearances and the Ongoing Apostolic Witness,” in *Greater Love Hath No Man*, reads this chapter's disciples as types of every disciple, and follows the risen Lord's manifestations to His witnesses down to our own dispensation.
  - **John who tarries.** “John the Beloved in Latter-day Scripture (D&C 7),” in *Revelations in Context*, sets [[D&C 7]] beside [[3 Ne. 28]] on translated beings.
  - **The first call.** [[Luke 5:1–11]], the miracle this chapter repeats.

