chapter: 21
title: Feed My Sheep
tagline: At the sea of Tiberias the risen Lord fills the nets of seven disciples who had fished all night for nothing, feeds them at a fire of coals, asks Peter three times whether he loves Him and charges him to feed His sheep, foretells Peter's death, and answers Peter's question about the beloved disciple; the Gospel closes on the witness of that disciple.
when: 'At the sea of Galilee, some time after the first Easter and within the forty days before the Ascension ([[Acts 1:3]])'

setting: |
  The Gospel seemed to have ended. Chapter 20 closes with John's statement of why he wrote, “that ye might believe that Jesus is the Christ, the Son of God” ([[John 20:31]]), and then chapter 21 takes the story up again. Its style may suggest it was added later; it is the Gospel's epilogue, and it is scripture like the rest.

  The scene has moved from Jerusalem to Galilee. Some of the disciples have gone home, apparently because on Easter morning they had been told to go there ([[Mark 16:7]]). Jesus was seen by His apostles for forty days before He ascended, but most of those appearances were never written down; the Gospels record two in Galilee, this one by the lake (called here by its other name, the sea of Tiberias) and one on a mountain ([[Matt. 28:16–20]]).

  The chapter has three parts: a last appearance, to seven disciples at their boats; Jesus's talk with Peter, which turns the story from the Lord's ministry to the Church Peter will lead; and the fate and the witness of the beloved disciple. Its question about that disciple, whether he would die, is the one Joseph Smith and Oliver Cowdery asked in 1829, and the Lord's answer is [[D&C 7]].

thread: |
  **The risen Lord calls His disciples a second time, by the same lake and with the same kind of miracle as the first, and turns them from fishing to feeding His sheep.**

  The chapter begins with Peter going back to the work he left three years before, and with a night in which the nets take nothing. It ends with the fishermen made shepherds: Peter, who denied his Lord three times by a fire of coals, is asked three times, after a meal at another such fire, whether he loves Him, and each answer is met with a charge, “Feed my sheep.” The disciples will leave their nets a second time. The story now looks ahead to the Church Peter will lead and care for.

  Two words of Jesus carry the chapter's last movement: “Follow me” (verse 19), which costs Peter his life, and “what is that to thee? follow thou me” (verse 22), which leaves the beloved disciple's very different path in the Lord's hands.

sections:
  - range: 1-14
    heading: The Lord on the shore
    plain: |
      After this Jesus showed Himself again to the disciples, at the sea of Tiberias, and this is how it happened. Simon Peter, Thomas called Didymus, Nathanael of Cana in Galilee, the sons of Zebedee and two other disciples were together. Simon Peter said to them, “I am going fishing.” They said, “We will come with you.” They went out and got into the boat, and that night they caught nothing.

      Just as day was breaking, Jesus stood on the shore, but the disciples did not know it was Jesus. Jesus called to them, “Lads, have you any fish?” They answered, “No.” He said, “Cast the net on the right side of the boat, and you will find some.” So they cast it, and now they could not haul it in for the number of fish. Then the disciple whom Jesus loved said to Peter, “It is the Lord.” When Simon Peter heard that it was the Lord, he tied his outer garment around him (he had stripped for work) and threw himself into the sea. The other disciples came in the small boat, dragging the net full of fish, for they were not far from land, only about two hundred cubits.

      When they came ashore, they saw a charcoal fire there with fish laid on it, and bread. Jesus said, “Bring some of the fish you have just caught.” Simon Peter went aboard and hauled the net ashore, full of large fish, a hundred and fifty-three of them; and though there were so many, the net was not torn. Jesus said to them, “Come and eat.” None of the disciples dared ask Him, “Who are you?” They knew it was the Lord. Jesus came and took the bread and gave it to them, and the fish as well. This was now the third time Jesus showed Himself to His disciples after He was raised from the dead.
  - range: 15-19
    heading: Lovest thou me?
    plain: |
      When they had eaten, Jesus said to Simon Peter, “Simon, son of Jonas, do you love me more than these?” He said, “Yes, Lord; you know that I love you.” Jesus said, “Feed my lambs.” He asked him a second time, “Simon, son of Jonas, do you love me?” He said, “Yes, Lord; you know that I love you.” Jesus said, “Shepherd my sheep.” He asked him the third time, “Simon, son of Jonas, do you love me?” Peter was grieved that He asked him the third time, “Do you love me?” and he said, “Lord, you know all things; you know that I love you.” Jesus said, “Feed my sheep.

      “Truly, truly, I tell you: when you were young, you fastened your own belt and walked where you wanted. But when you are old, you will stretch out your hands, and another will fasten a belt on you and take you where you do not want to go.” He said this to show by what kind of death Peter would glorify God. And after saying it He told him, “Follow me.”
  - range: 20-23
    heading: What shall this man do?
    plain: |
      Peter turned and saw the disciple whom Jesus loved following them, the one who had leaned on His breast at the supper and asked, “Lord, who is it that will betray you?” Seeing him, Peter said to Jesus, “Lord, and what about this man?” Jesus said to him, “If I will that he remain until I come, what is that to you? You follow me.” So the saying spread among the brethren that this disciple would not die. Yet Jesus did not tell him he would not die, but only, “If I will that he remain until I come, what is that to you?”
  - range: 24-25
    heading: His testimony is true
    plain: |
      This is the disciple who bears witness of these things and who wrote them down, and we know that his testimony is true. Jesus did many other things as well. If every one of them were written down, I suppose the world itself could not hold the books that would be written. Amen.

notes:
  - ref: 2
    phrase: There were together Simon Peter, and Thomas called Didymus
    kind: symbol
    title: Seven disciples
    body: |
      John names five of the seven and leaves two unnamed, and the list itself may teach something. It begins with the two whose discipleship had faltered: Peter, who denied knowing Jesus, and Thomas, who would not believe without seeing ([[John 20:25]]). Their place at the head of the group can suggest that they have been taken back. Nathanael, called in the first chapter, may not have been one of the Twelve, and so stands for those who follow Jesus fully without that office. The sons of Zebedee, never named in this Gospel, are James and John, and John is the disciple whom Jesus loved.

      The two who go unnamed can stand for any disciple in any age, and since seven is the number of fullness, the little company can be read as all disciples. That is a reading of the scene, not something John says outright; but it fits a chapter that uses its characters as types of how disciples go on following Jesus.
    sources: [huntsman-postlude]
  - ref: 3
    phrase: I go a fishing
    kind: prophets
    title: I go a fishing
    body: |
      John gives no reason why Peter went fishing. The disciples were in Galilee, apparently because they had been told to go there ([[Mark 16:7]]). But the words have been heard as more than a night's work. In a retelling of the scene that takes “nonscriptural liberty,” Peter tells the others that the Lord's work is finished and that he means to return to his former life, rejoicing; and six others say, “We also go with thee.”

      The rest of the chapter answers that reading. The Lord meets them at the nets and turns them back to the work He gave them. The Resurrection is a beginning, not an ending: “We can't quit and we can't go back. After an encounter with the living Son of the living God, nothing is ever again to be as it was before.”
    sources: [huntsman-postlude, holland-first-great-commandment]
  - ref: 5
    phrase: Children, have ye any meat?
    kind: words
    title: Children, have ye any meat?
    body: |
      Both words mislead a modern reader. The Greek word translated “children” could express affection, but it was also how one called out to workmen, much like “lads” or “boys”; the disciples, who do not yet know Him, seem to hear it as a passer-by hoping to buy part of their catch. The Greek word behind “meat,” found only here in the New Testament, means whatever was eaten with bread, which on the lake meant fish. The stranger is simply asking the lads whether they have caught anything.

      Their one-word answer, “No,” is the answer no fisherman wants to give. Yet the plain address fits them better than they know: they are His children, and in a moment they will be fed.
    sources: [ellicott-john, holland-first-great-commandment]
  - ref: 6
    phrase: Cast the net on the right side of the ship
    kind: scripture
    title: Cast the net on the right side
    body: |
      The scene repeats the morning Peter was first called. Then too he and his partners had “toiled all the night, and … taken nothing”; Jesus, speaking from Simon's boat, told them to let down their nets, and the catch was so great that the nets broke and two boats began to sink; He told Simon, “from henceforth thou shalt catch men,” and they left everything and followed Him ([[Luke 5:4–11]]). Like Mary Magdalene and the two on the road to Emmaus, the disciples do not at first know the risen Lord when they see Him. The repetition seems to be what opened the beloved disciple's eyes: the night of nothing, the command, the full net. He recognized the miracle before he recognized the man.

      The likeness also tells the reader what the miracle is for. It is a second call, by the same lake, to Peter and the sons of Zebedee, who had been there at the first.
    sources: [huntsman-postlude, holland-first-great-commandment]
  - ref: 7
    phrase: saith unto Peter, It is the Lord
    kind: history
    title: It is the Lord
    body: |
      The two disciples act as they do elsewhere in the Gospel: John, the disciple whom Jesus loved, is quick to see, and Peter is quick to move. At the tomb John “saw, and believed” ([[John 20:8]]); here he is the first to know, and Peter is in the water before the boat can reach shore.
    sources: [talmage-jesus-christ-37, huntsman-gospel-john]
  - ref: 9
    phrase: a fire of coals
    kind: symbol
    title: A fire of coals
    body: |
      John's word for the fire, *anthrakia*, a charcoal fire, appears in only one other place in the New Testament: the fire in the high priest's courtyard, where Peter stood warming himself and denied his Lord ([[John 18:18]]). The detail looks like a passing one, but it ties the two scenes together. Peter last stood beside such a fire as the man who said three times that he did not know Jesus; now he comes ashore to another, and the Lord who knows all things is standing by it.

      That prepares what follows. The threefold question of verses 15–17 comes after a meal at the very kind of fire that witnessed the threefold denial. And before He asks Peter anything, Jesus has already made breakfast for the men who spent the night failing to catch it.
    sources: [huntsman-postlude, ellicott-john]
  - ref: 11
    phrase: yet was not the net broken
    kind: symbol
    title: Yet was not the net broken
    body: |
      The net that held points back to the first call, when “their net brake” ([[Luke 5:6]]). One reading takes the broken nets of that morning as a picture of a first call to the ministry that was still imperfect; this time the disciples, called to be fishers of men, bring the whole net to shore and present all of its catch to Jesus. It is the Gospel's last miracle, a final sign.

      The number has drawn many explanations (one fish of every known kind, the nations, the Trinity), none of them with any clue in the text. One simple explanation is in the verse itself: the fish were all “great,” and a haul like that would be counted. Such a catch would be talked about, and John recorded it with his usual eye for exact detail.
    sources: [huntsman-postlude, ellicott-john, huntsman-gospel-john]
  - ref: 13
    phrase: taketh bread, and giveth them
    kind: christ
    title: Taketh bread, and giveth them
    body: |
      Jesus is the host. He invites them to eat, takes the bread and gives it to them, and the fish too. Bread and fish from His hands recall the feeding of the five thousand ([[John 6:1–14]]), which by tradition took place not far from this shore. The Gospel's ministry began at a wedding feast in Cana and ends at a meal on the beach, and one reading sees in this meal, where the Lord breaks bread for His disciples, a figure of both the sacrament and the messianic banquet to come.

      John says nothing of Jesus eating with them. They knew it was the Lord, yet as at His other appearances after He rose, there was an awe about Him. They came to Him in reverent silence, and though they knew who He was, none of them dared to ask.
    sources: [huntsman-postlude, talmage-jesus-christ-37, ellicott-john]
  - ref: 14
    phrase: This is now the third time that Jesus shewed himself to his disciples
    kind: history
    title: The third time
    body: |
      Mary Magdalene saw Him first ([[John 20:14–17]]), so “the third time” is a count of something narrower: His appearances to the disciples gathered together. The first was on the evening of Easter day, when Thomas was absent ([[John 20:19–24]]); the second was a week later, with Thomas present ([[John 20:26]]); this is the third. If the appearances to Mary Magdalene, to the other women, to Peter alone and to the two on the road to Emmaus are counted too, it is by one reckoning the seventh recorded appearance of the risen Lord.
    sources: [ellicott-john, talmage-jesus-christ-37]
  - ref: 15
    phrase: lovest thou me more than these?
    kind: history
    title: More than these
    body: |
      Jesus does not say what “these” are, and faithful readers have taken it two ways. It may mean these other disciples. On the night of the Supper Peter had set himself above them: “Though all men shall be offended because of thee, yet will I never be offended” ([[Matt. 26:33]]). The question would then recall that boast, and it may have hurt. Peter no longer compares himself with anyone. He answers only for himself, and appeals to what the Lord knows.

      Or “these” may be the boats, the nets and the pile of 153 fish, the old life Peter had gone back to that night, so that the question is, “Peter, do you love me more than you love all this?” Both readings fit what follows, a charge to leave the nets and feed the flock.

      Jesus also calls him by his old name, “Simon, son of Jonas,” not the name Peter that He Himself had given ([[John 1:42]]), perhaps as though speaking to the man who had not lived up to the name of the Rock.
    sources: [ellicott-john, talmage-jesus-christ-37, holland-first-great-commandment, ball-peters-witness]
  - ref: 16
    phrase: Simon, son of Jonas, lovest thou me?
    kind: words
    title: Two words for love, two for feeding
    body: |
      The English uses one word for love and one for feed, but the Greek has two of each. Jesus's first two questions use *agapaō*, the word often thought of as godly love and elsewhere translated “charity”; His third uses *phileō*, the love of friends. Peter answers all three times with *phileō*. The charges vary too: “feed” (*boskō*, to pasture or nourish) the lambs, “feed” (*poimainō*, to tend or shepherd) the sheep, and “feed” (*boskō*) the sheep. Some Latter-day Saint teachers have read a lesson in each pairing: the Lord asked whether Peter had both charity and brotherly love for Him, and taught him to nourish and to shepherd the young and the old of His flock.

      Others caution that John often uses the two words for love interchangeably, so the change may carry no special weight. On either reading the point lies in the charges: love for the Master is shown by caring for His sheep.
    sources: [ball-peters-witness, huntsman-postlude]
  - ref: 17
    phrase: Peter was grieved because he said unto him the third time
    kind: christ
    title: Three times
    body: |
      Peter is grieved by the third question, perhaps thinking the Lord did not trust him, or perhaps remembering that only days before he had been asked another question three times and had answered just as firmly, but in denial. He had denied his Lord three times; now he is given three times to say that he loves Him. Each time he says it, the Lord gives him work to do. The charge itself is a mark of the Lord's confidence in him, and of Peter's place at the head of the apostles.

      Peter had failed, and through Jesus Christ he was fully redeemed and served faithfully afterward; his long ministry of feeding Christ's sheep shows it.
    sources: [huntsman-peters-denial, talmage-jesus-christ-37, holland-first-great-commandment]
  - ref: 18
    phrase: thou shalt stretch forth thy hands, and another shall gird thee
    kind: history
    title: Thou shalt stretch forth thy hands
    body: |
      The young man fastens his own belt and goes where he likes; the old man stretches out his hands, is bound by another and taken where he would not go. John explains it himself in verse 19: Jesus was showing “by what death he should glorify God.” Peter had said he was ready to follow his Master to prison and to death ([[Luke 22:33]]), and now the Lord tells him he will.

      The image points to crucifixion, and the tradition from Tertullian on, which no other tradition contradicts, is that Peter died that way. The words are less exact than the tradition: the binding of a prisoner would come before a crucifixion, not after his hands were stretched out, and John's comment, “by what death,” can be read as marking only a martyr's death as distinct from a natural one. Peter appears to have understood what had been told him. Years later he wrote that he must shortly put off his body, “even as our Lord Jesus Christ hath shewed me” ([[2 Pet. 1:14]]).
    sources: [talmage-jesus-christ-37, ellicott-john]
  - ref: 19
    phrase: he saith unto him, Follow me
    kind: scripture
    title: Follow me
    body: |
      “Follow me” was the call Peter first heard from Jesus by this lake ([[Matt. 4:19]]), and now they come again, after a prophecy of his death. At the Supper Peter had asked where Jesus was going and was told, “thou canst not follow me now; but thou shalt follow me afterwards” ([[John 13:36]]). Here “afterwards” begins. The command meant something at once, for Jesus seems to have drawn apart from the others and Peter went with Him (verse 20); and it meant something years away, when Peter would follow his Lord to a cross.
    sources: [ellicott-john, talmage-jesus-christ-37]
  - ref: 21
    phrase: Lord, and what shall this man do?
    kind: christ
    title: What shall this man do?
    body: |
      Peter has just learned how he will die, and he turns to see his friend following and asks what will become of him. The answer turns him back to himself: “what is that to thee? follow thou me,” with the “thou” stressed. Peter is to look to his own course of duty and follow wherever it leads.

      The verb for the beloved disciple “following” often implies following as a disciple, so the scene can also stand for one disciple asking about another's calling and mission. Peter was asked to die for his testimony; most disciples are asked to live for theirs. Jesus's answer leaves John's mission in the Lord's hands and sends Peter back to his own, and in the same way a disciple's part is to follow, not to judge how others follow.
    sources: [talmage-jesus-christ-37, ellicott-john, huntsman-postlude]
  - ref: 22
    phrase: If I will that he tarry till I come
    kind: scripture
    title: Till I come
    body: |
      Whether the beloved disciple would die, this verse alone does not say, and the confusion it caused began, as verse 23 shows, among the first disciples. In April 1829 Joseph Smith and Oliver Cowdery asked whether John “tarried in the flesh or had died.” The answer, [[D&C 7]], is a translated version of a record John made on parchment. In it the Lord asks John what he desires, and John asks for “power over death, that I may live and bring souls unto thee”; the Lord grants it: “thou shalt tarry until I come in my glory.” The revelation then gives the words of this verse with their reason: “For he desired of me that he might bring souls unto me, but thou desiredst that thou mightest speedily come unto me in my kingdom” ([[D&C 7:4]]). The Lord tells them, “ye both joy in that which ye have desired” ([[D&C 7:5]]).

      So John did not die. He remains on the earth as a ministering servant until the Second Coming; to tarry until the Lord comes is to be translated, changed so that he is immortal though not yet resurrected. The Book of Mormon confirms it: three of the Nephite disciples desired “the thing which John, my beloved … desired of me” ([[3 Ne. 28:6]]), and what 3 Nephi 28 says of them illuminates John's translation as well.

      Verse 23 then separates what Jesus said from what the brethren concluded. He did not say, “He shall not die”; He said, “If I will that he tarry till I come,” words that left John's fate open. Taken at face value, the denial seems to cast doubt on John's translation, but it likely reflects an editor's answer to the speculation about John, correcting the rumor by returning to the Lord's exact words, not correcting the Lord. Joseph Smith's translation leaves these verses as they are; what the words left open, the revelation answered.
    sources: [lds-scriptures, bd-john, judd-szink-dc7]
  - ref: 24
    phrase: we know that his testimony is true
    kind: history
    title: We know that his testimony is true
    body: |
      Someone other than the beloved disciple is speaking here. The verse says he “wrote these things,” and then others add, “we know that his testimony is true.” It is an editorial addition, made early and found in every important manuscript. Who “we” were cannot be known. The verse may mean that John wrote the Gospel himself, or that he had his witness written down by a scribe; either way the testimony is his. Latter-day revelation supports the traditional view that the beloved disciple is John (see the setting of [[John 1]] and [[D&C 7:1–3]]).
    sources: [huntsman-gospel-john, ellicott-john]
  - ref: 25
    phrase: even the world itself could not contain the books that should be written
    kind: scripture
    title: The world itself could not contain the books
    body: |
      The voice changes again, from “we know” to “I suppose,” probably to a single writer, perhaps the scribe, adding his own testimony. The verse says what John said at the end of chapter 20: this Gospel is a selection, written “that ye might believe” ([[John 20:30–31]]). Full as it is, it is only part of what Jesus did.
    sources: [ellicott-john]

christ: |
  The risen Lord comes to men who have gone back to their nets, fills the nets, and feeds them before He asks them anything. Then He lets the disciple who denied Him three times say three times that he loves Him, and each time entrusts His flock to him. He restores Peter, and He shows what love for Him looks like: “Feed my sheep.”

  The Lord gave the same charge to the Twelve in this dispensation: “follow me, and feed my sheep” ([[D&C 112:14]]). Love for Him is shown by caring for others, as King Benjamin taught: “when ye are in the service of your fellow beings ye are only in the service of your God” ([[Mosiah 2:17]]). A disciple who has failed can be redeemed and renew that devotion by ministering, each on the path the Lord gives, without measuring another's.

explore: |
  - **The seashore and after.** “Postlude: Later Appearances and the Ongoing Apostolic Witness,” in *Greater Love Hath No Man*, reads this chapter's disciples as types of every disciple, and follows the risen Lord's appearances on to the apostles of this dispensation.
  - **John who tarries.** “John the Beloved in Latter-day Scripture (D&C 7),” in *Revelations in Context*, sets [[D&C 7]] beside [[3 Ne. 28]] on translated beings.
  - **The first call.** [[Luke 5:1–11]], the miracle this chapter repeats.

