  - **The other sheep.** [[3 Ne. 15:11–24]]; [[3 Ne. 16:1–5]].
  - **Laying down His life.** [[John 15:13]]; [[1 Jn. 3:16]]; [[2 Ne. 2:8]].
  - **The shepherd-king.** The article “Jesus, the Great Shepherd-King” (*Celebrating Easter*, 2007) traces the royal side of the shepherd title through the Bible and the ancient Near East.

