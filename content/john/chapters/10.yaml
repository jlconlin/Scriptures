chapter: 10
title: The Good Shepherd
tagline: Jesus calls Himself the door of the sheep and the good shepherd who lays down His life and takes it again; at the Feast of the Dedication He says, “I and my Father are one,” and escapes those who would stone Him.
when: 'After the Feast of Tabernacles (autumn) and at the Feast of the Dedication (winter), at Jerusalem; then beyond the Jordan'

setting: |
  John 10 holds two scenes at Jerusalem, a few months apart, and then a withdrawal. The first is the discourse of the good shepherd. John gives it no new time or place: it follows straight on from the healing of the man born blind, and the nearest hearers he names are “some of the Pharisees” who had just asked, “Are we blind also?” ([[John 9:40]]). They had cast the healed man out ([[John 9:34]]), and their treatment of him seems to have prompted Jesus's talk of good and bad shepherds.

  The second scene is in the temple at the Feast of the Dedication, in winter. Tabernacles had come at the end of September ([[John 7:2]]), and whether the sermon belongs to that feast or comes later is debated; one proposal, that it was given between the two feasts, makes better sense of its ties to what comes before and after. It is one of the discourses John sets in Jerusalem, which were spoken often to hostile crowds. The chapter ends with Jesus leaving Jerusalem for the place beyond the Jordan where John first baptized ([[John 1:28]]).

  The risen Lord quoted verse 16 to the Nephites and told them, “ye are they of whom I said: Other sheep I have” ([[3 Ne. 15:21]]).

thread: |
  **The shepherd's voice.** In Jesus's figure the sheep know their shepherd by his voice, not by the look of him (verses 3–5), and the chapter keeps returning to hearing. The man of chapter 9 had heard Jesus and obeyed before he ever saw Him, and his question to the Pharisees, “will ye also be his disciples?” ([[John 9:27]]), amounted to asking whether they would hear Jesus and be His sheep. They would not. So the good shepherd sets Himself against the thieves and the hireling who do not care for the sheep, and promises other sheep who “shall hear my voice” (verse 16).

  At the Feast of the Dedication what seems to be the same audience asks Him to speak plainly, and He answers with the same figure. He has told them, and they have not believed, because they are not His sheep: “My sheep hear my voice, and I know them, and they follow me” (verse 27). Behind the figure stands the claim that the shepherd is one with the Father, and it brings stones. Far from the temple, beyond the Jordan, many believe.

sections:
  - range: 1-6
    heading: The shepherd and the sheepfold
    plain: |
      “I tell you truly, whoever does not come into the sheepfold through the door but climbs in some other way is a thief and a robber. The one who comes in through the door is the shepherd of the sheep. The doorkeeper opens to him, and the sheep hear his voice. He calls his own sheep by name and leads them out. When he has brought out his own sheep, he goes ahead of them, and the sheep follow him, because they know his voice. They will not follow a stranger; they will run from him, because they do not know strangers' voices.” Jesus told them this figure, but they did not understand what He was saying to them.
  - range: 7-18
    heading: The door and the good shepherd
    plain: |
      So Jesus said again, “I tell you truly, I am the door of the sheep. All who came before me are thieves and robbers, but the sheep did not listen to them. I am the door. Whoever enters through me will be saved, and will go in and out and find pasture. The thief comes only to steal and kill and destroy. I have come that they may have life, and have it in abundance. I am the good shepherd. The good shepherd gives his life for the sheep. The hired man, who is not the shepherd and does not own the sheep, sees the wolf coming and leaves the sheep and runs; and the wolf seizes them and scatters the flock. He runs because he is a hired man and does not care about the sheep. I am the good shepherd. I know my sheep, and my sheep know me, as the Father knows me and I know the Father; and I lay down my life for the sheep. I have other sheep that are not of this fold. I must bring them too, and they will hear my voice, and there will be one fold and one shepherd. This is why my Father loves me: because I lay down my life, so that I may take it up again. No one takes it from me; I lay it down of my own accord. I have authority to lay it down, and I have authority to take it up again. This commandment I received from my Father.”
  - range: 19-21
    heading: A division
    plain: |
      Once again the Jews were divided over these words. Many of them said, “He has a devil and is out of His mind. Why listen to Him?” Others said, “These are not the words of a man who has a devil. Can a devil open the eyes of the blind?”
  - range: 22-30
    heading: At the Feast of the Dedication
    plain: |
      Then came the Feast of the Dedication at Jerusalem. It was winter, and Jesus was walking in the temple, in Solomon's porch. The Jews gathered around Him and said, “How long will you keep us in suspense? If you are the Christ, tell us plainly.” Jesus answered, “I told you, and you do not believe. The works I do in my Father's name testify of me. But you do not believe, because you are not my sheep, as I told you. My sheep hear my voice, and I know them, and they follow me. I give them eternal life, and they will never perish, and no one will pluck them out of my hand. My Father, who gave them to me, is greater than all, and no one can pluck them out of my Father's hand. I and my Father are one.”
  - range: 31-39
    heading: Ye are gods
    plain: |
      The Jews picked up stones again to stone Him. Jesus answered them, “I have shown you many good works from my Father. For which of them are you stoning me?” The Jews answered, “We are not stoning you for a good work but for blasphemy, because you, a man, make yourself God.” Jesus answered, “Is it not written in your law, ‘I said, You are gods’? If He called them gods to whom the word of God came, and the scripture cannot be set aside, do you say of the One whom the Father set apart and sent into the world, ‘You are blaspheming,’ because I said, ‘I am the Son of God’? If I am not doing my Father's works, do not believe me. But if I am, then even if you do not believe me, believe the works, so that you may know and understand that the Father is in me and I am in Him.” They tried again to seize Him, but He escaped out of their hands.
  - range: 40-42
    heading: Beyond the Jordan
    plain: |
      He went away again across the Jordan to the place where John had first baptized, and He stayed there. Many people came to Him, and they said, “John did no sign, but everything John said about this man was true.” And many believed in Him there.

notes:
  - ref: 1
    phrase: entereth not by the door into the sheepfold, but climbeth up some other way
    kind: symbol
    title: The sheepfold and the thief
    body: |
      Jesus begins from a scene His hearers knew. By day a shepherd led his flock to pasture and water; at night he brought it into a cave or a fold, a small enclosure, often against a hillside. Many folds were open-air pens with low walls of field stone. There were two ways in. One was the gate, kept by a porter. The other was over the wall, and only someone with no right to the sheep came that way. The fold may have held the flocks of several owners, which is why the shepherd calls out “his own sheep” (verse 3) and leaves the rest. In the figure, then, the shepherd is known by how he comes. He uses the gate, the porter opens it to him, and the sheep answer to his voice.
    sources: [pike-shepherd, judd-other-sheep]
  - ref: 3
    phrase: he calleth his own sheep by name
    kind: symbol
    title: By name
    body: |
      The point of the call is that shepherd and sheep know each other. Jesus does not quote the Old Testament here, but the picture recalls the Lord's word to Israel: “I have called thee by thy name; thou art mine” ([[Isa. 43:1]]). Jesus says the same of Himself a few verses on: “I … know my sheep, and am known of mine” (verse 14).

      The sheep know the shepherd by hearing, and John has just shown what that looks like. The man born blind could not see Jesus when they first met. He heard His voice, did what it told him, and “came seeing” ([[John 9:7]]). Sight followed hearing.
    sources: [judd-other-sheep]
  - ref: 7
    phrase: I am the door of the sheep
    kind: christ
    title: The door of the sheep
    body: |
      Jesus is both the door and the shepherd who goes through it, and the two figures say different things. As the shepherd He leads; as the door He is the only lawful way into the fold's safety and out again to pasture (verse 9). In the upper room He says, “I am the way, the truth, and the life: no man cometh unto the Father, but by me” ([[John 14:6]]).

      The Book of Mormon has the same image. Jacob says that “the keeper of the gate is the Holy One of Israel; and he employeth no servant there; and there is none other way save it be by the gate” ([[2 Ne. 9:41]]). Applied to the parable, Jacob's words make the porter of verse 3 the Savior too: He is the way in, and He keeps the way.
    sources: [judd-other-sheep, lds-scriptures]
  - ref: 8
    phrase: All that ever came before me are thieves and robbers
    kind: words
    title: Thieves and robbers
    body: |
      Taken alone, “all that ever came before me” would sweep in Abraham, Moses and John the Baptist, men Jesus has already honored in this Gospel. Some later copyists, possibly to protect the good name of such men, left out either “all” or “before me.” The Joseph Smith Translation answers the difficulty by naming whom Jesus meant: the thieves and robbers are those “who testified not of me” (JST John 10:8). Read that way, the thieves are any leaders who did not bear witness of Him, and the prophets, who did, are not among them.
    sources: [lds-scriptures, judd-other-sheep]
  - ref: 10
    phrase: that they might have it more abundantly
    kind: words
    title: Life more abundantly
    body: |
      The thief takes life; the shepherd gives it, and gives more than enough. The Greek word, *perisson*, means beyond the ordinary, to a remarkable degree. John has already shown this kind of plenty in the good wine at Cana, the living water promised at the well, and the rivers of living water Jesus promised at Tabernacles ([[John 7:37–38]]). So the life meant is more than staying alive: the word suggests a richer, spiritual life in this world that already looks forward to everlasting life in the next.
    sources: [huntsman-gospel-john]
  - ref: 11
    phrase: I am the good shepherd
    kind: christ
    title: The good shepherd
    body: |
      The usual Greek word for “good” is *agathos*. Here it is *kalos*, closer to “noble” or “genuine”: the shepherd as a shepherd ought to be, the model of the kind. And the mark of this shepherd is the strangest thing in the figure. He “giveth his life for the sheep,” though a dead shepherd would seem to be no use to a flock. Jesus means it of Himself, “I lay down my life for the sheep” (verse 15), and the offering shows the shepherd's love for his flock.

      His hearers would have heard a larger claim. The shepherd of Israel in their scriptures is the Lord Himself: “The LORD is my shepherd” ([[Ps. 23:1]]). Through Ezekiel He promised to “set up one shepherd over them, … even my servant David” ([[Ezek. 34:23]]), long after David was dead, a promise Latter-day Saints read as messianic. When Jesus calls Himself the shepherd, He claims the place of Jehovah and of the promised king. The leaders, it seems, would have found nothing offensive in a kind man willing to die; what troubled them was more likely the royal and divine claim inside the title.
    sources: [judd-other-sheep, pike-shepherd]
  - ref: 12
    phrase: he that is an hireling
    kind: scripture
    title: The hireling and the wolf
    body: |
      The hireling is a hired hand. The sheep are not his, so when the wolf comes he runs. Jesus quotes no prophet here, but the figure is often read against Ezekiel 34, where the Lord says, “Woe be to the shepherds of Israel that do feed themselves! should not the shepherds feed the flocks?” ([[Ezek. 34:2]]). Ezekiel's shepherds left the sick unhealed and let the scattered sheep be lost ([[Ezek. 34:4–6]]).

      Read that way, chapter 9 shows the same neglect. A man had been healed, and the shepherds of Israel had questioned him, reviled him and cast him out ([[John 9:28–34]]).
    sources: [judd-other-sheep]
  - ref: 16
    phrase: other sheep I have, which are not of this fold
    kind: scripture
    title: Other sheep
    body: |
      The other sheep are the Nephites; on this verse the Book of Mormon explains the New Testament. The risen Lord told the Nephites, “ye are they of whom I said: Other sheep I have which are not of this fold” ([[3 Ne. 15:21]]). The Nephites were a branch of the house of Israel, of the tribes that had been lost to the rest.

      He also told them how His first hearers had taken it: “they supposed it had been the Gentiles” ([[3 Ne. 15:22]]). Many modern scholars still read it so. The Lord's answer set the Gentiles apart: they would not hear His voice, “save it were by the Holy Ghost” ([[3 Ne. 15:23]]), while the Nephites had “both heard my voice, and seen me” ([[3 Ne. 15:24]]). And the Nephites were not the last of them. He had “other sheep, which are not of this land, neither of the land of Jerusalem” ([[3 Ne. 16:1]]), and He was going to show Himself to them as well ([[3 Ne. 16:3]]).
    sources: [sc-knowhy-207, judd-other-sheep]
  - ref: 18
    phrase: I have power to lay it down, and I have power to take it again
    kind: christ
    title: Power to lay it down
    body: |
      The “power” is authority, the right as well as the strength to lay down His life and take it up again, and He had it from His Father. Jesus would be killed, but not against His will. His spirit ruled His body, and He gave up His mortal life when His work in the flesh was finished, and not before. The rising again was His Father's power too. Lehi calls Him the Messiah “who layeth down his life according to the flesh, and taketh it again by the power of the Spirit” ([[2 Ne. 2:8]]), and Mormon says that “by the power of the Father he hath risen again” ([[Morm. 7:5]]).

      The verse ends on obedience: “This commandment have I received of my Father.” The authority was His, and the choice to use it was obedience to His Father.
    sources: [lds-scriptures, ostler-divine-nature]
  - ref: 19
    phrase: There was a division therefore again among the Jews
    kind: history
    title: A division among the Jews
    body: |
      “Again” points back to the Pharisees of chapter 9, who split over the healing of the blind man. Some said Jesus was not of God because He healed on the Sabbath, and others asked, “How can a man that is a sinner do such miracles?” ([[John 9:16]]). “The Jews” of this verse are those same hearers, the Pharisees who had been present through the discourse ([[John 9:40]]), and they divide the same way over the same healing: some say He has a devil, and others answer, “Can a devil open the eyes of the blind?”
    sources: [ellicott-john, judd-other-sheep]
  - ref: 22
    phrase: the feast of the dedication
    kind: history
    title: The Feast of the Dedication
    body: |
      This is the feast now called Hanukkah, instituted under Judas Maccabaeus for the dedication of a new altar after Antiochus Epiphanes had profaned the temple. It ran eight days from the 25th of Kislev, in parts of November and December, and was kept with the gladness of Tabernacles, with palm branches and lights.

      John adds “it was winter.” Solomon's temple and the temple rebuilt after the exile had their dedications too, but no yearly feast is known that kept them; a feast that fell in winter makes it almost certain that John means the one begun under Judas Maccabaeus.
    sources: [bd-feasts, ellicott-john, judd-other-sheep]
  - ref: 23
    phrase: Solomon’s porch
    kind: history
    title: Solomon’s porch
    body: |
      Solomon's porch was a cloister or covered colonnade rather than a porch in the modern sense, though just where it stood in Herod's temple is not certain. Along one wall of the Court of the Gentiles, probably the south, though some place it on the east, ran a long colonnaded hall with rows of columns, where people gathered to teach and be taught. It is probably what the New Testament calls Solomon's porch, and Peter later preached to a crowd there ([[Acts 3:11–12]]). Wherever it stood, it was a covered walk, offering shelter in winter.
    sources: [seely-temple-herod, ellicott-john]
  - ref: 24
    phrase: How long dost thou make us to doubt?
    kind: words
    title: Kept in suspense
    body: |
      Their question in Greek asks literally how long He will lift up their soul, with the verb for lifting up, *airō*, and *psychē*, “soul.” Said of the soul, the idiom means to hold the mind in suspense between doubt and hope, and they ask Him to end it by telling them “plainly” whether He is the Christ. Jesus answers that He has told them already, by His words and His works (verse 25), and that they do not believe (verse 26). Within a few verses the same crowd has taken up stones again (verse 31).
    sources: [greek-nt, thayer, lds-scriptures]
  - ref: 30
    phrase: I and my Father are one
    kind: prophets
    title: One
    body: |
      The Greek word for “one” is *hen*. Said of persons, “to be one” can mean “to be united most closely (in will, spirit),” and that is its sense in this verse as in Jesus's prayer that His disciples be one ([[John 17:21–22]]). The verse comes straight after the two hands: the sheep are in the Son's hand and in the Father's hand, and no one can take them from either.

      Restoration teaching holds that the Father, the Son and the Holy Ghost are three persons. As Elder Jeffrey R. Holland taught, They are “united in purpose, in manner, in testimony, in mission,” and Latter-day Saints believe Them “one in every significant and eternal aspect imaginable except believing Them to be three persons combined in one substance.” Jesus's hearers took His words as a claim to be God, and picked up stones (verses 31–33).
    sources: [greek-nt, thayer, holland-only-true-god]
  - ref: 34
    phrase: Is it not written in your law, I said, Ye are gods?
    kind: scripture
    title: Ye are gods
    body: |
      Jesus answers the charge of blasphemy from their own scriptures. In Psalm 82 God says, “Ye are gods” ([[Ps. 82:6]]), to those whom Jesus calls the ones “unto whom the word of God came,” and “the scripture cannot be broken.” His argument seems to run from the lesser to the greater. If scripture could call men “gods” because the word of God came to them, the charge of blasphemy cannot stand against the One whom the Father Himself sanctified and sent, when He calls Himself only “the Son of God.” The irony is that He was more than His argument needed. As the prologue says, He is God made flesh ([[John 1:1–3]], [[John 1:14]]).

      “Sanctified” means set apart: the Father chose the Son for His service and gave Him the office of Messiah, then sent Him into the world. Who the “gods” of the psalm are is explained in the note on [[Ps. 82:6]].
    sources: [frederick-ot-in-nt-gospels, thayer]
  - ref: 41
    phrase: John did no miracle
    kind: history
    title: John did no sign
    body: |
      Beyond the Jordan the people compare the Baptist with Jesus. John worked no sign (the King James “miracle” is John's word *sēmeion*, a sign that shows who Jesus is). But everything he said of the one coming after him had come true, and that was his work: he “came for a witness, to bear witness of the Light” ([[John 1:7]]). They say it at the place where he had borne that witness ([[John 1:28]]), and there many believed.
    sources: [huntsman-gospel-john, lds-scriptures]

christ: |
  John 10 points to Jesus Christ as the good shepherd, Jehovah the shepherd of Israel come in the flesh, who lays down His life for the sheep of His own will and takes it again by His Father's power ([[2 Ne. 2:8]]). His sheep know Him by His voice, and the Lord's word to this dispensation is the same: “hear my voice and follow me” ([[D&C 38:22]]). Hearing Him means hearing what the Savior says and heeding it, and His voice is heard today in the scriptures and in the temple.

explore: |
