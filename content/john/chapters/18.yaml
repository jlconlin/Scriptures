chapter: 18
title: My Kingdom Is Not of This World
tagline: Jesus goes out to meet the band that comes for Him in the garden and answers “I am he,” and they fall to the ground; He is bound and questioned by Annas, while Peter, by the fire in the courtyard, three times says “I am not”; at dawn the chief priests bring Him to Pilate, and to the governor He speaks of a kingdom not of this world and of the truth, and the crowd asks for Barabbas.
when: 'The night and early morning before the Passover ([[John 18:28]]), in a garden across the Kidron, at the high priest’s house and at Pilate’s residence in Jerusalem'

setting: |
  Jesus has finished His last teaching and His prayer for the disciples ([[John 17]]), and now He leaves the city for the garden. From chapter 12 on, John follows the same order of events as the other Gospels for the last week, and chapters 18 and 19 tell what they tell: the arrest, the hearing before the high priest, Peter's denials, the trial before Pilate and the crucifixion. But John tells it in his own way. He says nothing of the agony in the garden, and the Jesus of his account is the Word who knows all things beforehand (verse 4): no one surprises Him, and He goes out to meet the men who come for Him.

  John alone tells that Jesus was taken first to Annas, the former high priest, and he alone records most of what Pilate and Jesus said to each other. His account of the questioning by Pilate is much longer than the others', and it is there, inside the governor's residence, that Jesus speaks of His kingdom and of the truth.

  The chapter runs from night to early morning (verse 28). It begins in a garden and ends with a crowd choosing a prisoner to be released. The scourging, “Behold the man!” and the sentence follow in [[John 19]].

thread: |
  **Jesus, bound and on trial, is the one in command; the others are the ones who are being tried.**

  In the garden He identifies Himself before Judas can do it, and His “I am” throws the arresting party to the ground. He asks freedom for His disciples and tells Peter to put away his sword, for He means to drink the cup. In the courtyard, Peter is asked three times whether he is one of Jesus's disciples and denies it; his “I am not” is the reverse of the “I am” so often on his Master's lips. Before Annas, Jesus objects to being questioned without witnesses, and asks the officer who strikes Him for evidence.

  Before Pilate, the questions turn round. Pilate asks whether He is a king; Jesus asks Pilate what he means by it, and turns the talk from kingship to truth. By the end of the chapter it is Pilate, and the crowd that prefers Barabbas, who stand judged by what they make of Him.

sections:
  - range: 1-11
    heading: The arrest in the garden
    plain: |
      When Jesus had said these things, He went out with His disciples across the Kidron valley to a place where there was a garden, and He and His disciples went into it. Judas, who was betraying Him, also knew the place, because Jesus had often met there with His disciples. So Judas came there with a band of soldiers and with officers from the chief priests and Pharisees, carrying lanterns, torches and weapons.

      Jesus, knowing everything that was going to happen to Him, went out and asked them, “Whom are you looking for?” They answered, “Jesus of Nazareth.” Jesus said to them, “I am he.” Judas, who was betraying Him, was standing with them. When Jesus said to them, “I am he,” they drew back and fell to the ground. So He asked them again, “Whom are you looking for?” And they said, “Jesus of Nazareth.” Jesus answered, “I told you that I am he. So if you are looking for me, let these men go.” This was so that the word He had spoken would be fulfilled: “Of those whom you gave me I have lost not one.”

      Then Simon Peter, who had a sword, drew it and struck the high priest's servant, cutting off his right ear. The servant's name was Malchus. Jesus said to Peter, “Put your sword back into its sheath. The cup that my Father has given me, shall I not drink it?”
  - range: 12-14
    heading: Bound and taken to Annas
    plain: |
      So the band of soldiers, their commander and the officers of the Jews seized Jesus and bound Him. They took Him first to Annas, for he was the father-in-law of Caiaphas, who was high priest that year. It was Caiaphas who had advised the Jews that it was better for one man to die for the people.
  - range: 15-18
    heading: Peter at the door
    plain: |
      Simon Peter followed Jesus, and so did another disciple. That disciple was known to the high priest, and he went with Jesus into the high priest's palace, but Peter stood outside at the door. So the other disciple, who was known to the high priest, went out and spoke to the woman who kept the door, and brought Peter in. The servant girl at the door said to Peter, “You are not one of this man's disciples too, are you?” He said, “I am not.” The servants and officers had made a fire of coals, because it was cold, and they were standing and warming themselves. Peter was standing with them, warming himself.
  - range: 19-24
    heading: The high priest questions Jesus
    plain: |
      The high priest then questioned Jesus about His disciples and His teaching. Jesus answered him, “I have spoken openly to the world. I always taught in the synagogue and in the temple, where all the Jews come together, and I have said nothing in secret. Why do you ask me? Ask those who heard me what I said to them. They know what I said.”

      When He had said this, one of the officers standing by struck Jesus with his hand and said, “Is that how you answer the high priest?” Jesus answered him, “If I have said something wrong, testify to what is wrong. But if I spoke rightly, why do you strike me?” Now Annas had sent Him, still bound, to Caiaphas the high priest.
  - range: 25-27
    heading: Peter denies again
    plain: |
      Simon Peter was still standing and warming himself. So they said to him, “You are not one of his disciples too, are you?” He denied it and said, “I am not.” One of the high priest's servants, a relative of the man whose ear Peter had cut off, said, “Didn't I see you in the garden with him?” Peter denied it again, and at once a rooster crowed.
  - range: 28-32
    heading: The accusation before Pilate
    plain: |
      Then they led Jesus from Caiaphas to the governor's residence. It was early morning. They themselves did not go into the residence, so that they would not be made ritually unclean but could eat the Passover. So Pilate came out to them and said, “What charge do you bring against this man?” They answered, “If he were not an evildoer, we would not have handed him over to you.” Pilate said to them, “Take him yourselves and judge him by your own law.” The Jews said to him, “It is not lawful for us to put anyone to death.” This was so that the word Jesus had spoken would be fulfilled, when He told by what kind of death He was going to die.
  - range: 33-38
    heading: Pilate questions Jesus
    plain: |
      So Pilate went back into the residence, called Jesus, and said to Him, “Are you the King of the Jews?” Jesus answered, “Do you say this of your own accord, or did others tell you about me?” Pilate answered, “Am I a Jew? Your own nation and the chief priests have handed you over to me. What have you done?”

      Jesus answered, “My kingdom is not of this world. If my kingdom were of this world, my servants would be fighting so that I would not be handed over to the Jews. But my kingdom is not from here.” So Pilate said to Him, “Then you are a king?” Jesus answered, “You say that I am a king. For this I was born, and for this I came into the world: to bear witness to the truth. Everyone who is of the truth hears my voice.” Pilate said to Him, “What is truth?” And after he had said this, he went out to the Jews again and told them, “I find no fault in him at all.”
  - range: 39-40
    heading: Barabbas
    plain: |
      “But you have a custom that I release one man to you at the Passover. So do you want me to release to you the King of the Jews?” They all shouted again, “Not this man, but Barabbas!” Now Barabbas was a robber.

notes:
  - ref: 1
    phrase: over the brook Cedron, where was a garden
    kind: history
    title: A garden, and no agony
    body: |
      John names no Gethsemane and no Mount of Olives, and tells nothing of what happened in the garden before the arrest. Jesus crosses the Cedron (the Kidron, the winter stream in the ravine east of Jerusalem, between the city and the Mount of Olives) and enters a garden, and in John the garden is simply the place where He is arrested. The other Gospels tell of His prayer and agony there, and Restoration scripture says what that agony was: suffering that caused “myself, even God, the greatest of all, to tremble because of pain, and to bleed at every pore” ([[D&C 19:18]]; see [[Mosiah 3:7]]).

      The silence is the more surprising because John was one of the three disciples Jesus took farthest into the garden. Why he left it out is not known. He may have passed over it from reverence; plain and precious parts may have been lost from his record; or, since his Gospel looks to the Lamb's death more than to His suffering, he may have left it out on purpose. One echo of that prayer survives in John: Jesus's words to Peter about “the cup which my Father hath given me” (see the note on verse 11).
    sources: [huntsman-lamb-of-god, ellicott-john, lds-scriptures]
  - ref: 3
    phrase: a band of men and officers from the chief priests and Pharisees
    kind: history
    title: A band of men and officers
    body: |
      The King James wording runs two groups together. The “officers” were the temple servants, sent by the chief priests and Pharisees as they had been sent once before to take Jesus ([[John 7:32]]; [[John 7:45]]). The “band” is the Greek *speira*, a word that can mean a Roman cohort, and some read it so here: soldiers of the Roman garrison from the fortress next to the temple, sent along to back the priests' authority.

      A mixed party of Roman soldiers and Jewish police is not the likeliest reading, though. More likely the whole party was made up of the armed bodyguards and retainers of members of the council, the men the King James calls “officers” (Greek *hypēretas*). What is certain is that the men who came for Jesus came armed and in numbers, with lanterns and torches.
    sources: [thayer, ellicott-john, huntsman-thursday]
  - ref: 6
    phrase: they went backward, and fell to the ground
    kind: christ
    title: I am he
    body: |
      Jesus does not wait to be pointed out. He goes out to the band and asks whom they seek, and when they say “Jesus of Nazareth,” He answers with two Greek words, *egō eimi*, “I am.” The King James adds “he” to make an English sentence. The words can be the plain “I am he,” but John often uses them for the divine name, Jehovah (see the note on [[John 8:58]]).

      John says twice that Jesus spoke the words, and that at them the whole party drew back and fell to the ground. Nothing in the account says that Jesus put forth power to strike them down. Later Jewish sources say that falling to the ground was the fitting response to hearing the divine name, and some read the scene in that light: the men fell at the name itself, and at the majesty of the one who spoke it. Others read it as a picture of the power of His divine voice. On either reading the men who came to take Him by force lie helpless before Him, and He gives Himself up because His hour has come. No one takes His life from Him.
    sources: [greek-nt, huntsman-thursday, ellicott-john]
  - ref: 9
    phrase: Of them which thou gavest me have I lost none
    kind: christ
    title: Of them which thou gavest me have I lost none
    body: |
      “Let these go their way” asks freedom for the disciples. The Shepherd steps forward to meet the danger and asks only that His disciples go free, so that none of them is taken to the trial and death He is about to face.

      John sees in it the fulfillment of the words Jesus had spoken in His prayer that same night: “those that thou gavest me I have kept, and none of them is lost” ([[John 17:12]]; see [[John 6:39]]). In the prayer the words were about keeping the disciples in the faith; here John applies them to keeping them safe in body. Words can be fulfilled in more than one sense, and John sees this saying fulfilled in the garden.
    sources: [huntsman-thursday, ellicott-john]
  - ref: 11
    phrase: the cup which my Father hath given me, shall I not drink it?
    kind: christ
    title: The cup which my Father hath given me
    body: |
      Jesus answers Peter's sword with the image of the cup, the image the other Gospels put in His prayer in the garden, where He asked that the cup might pass from Him. It is the only time John uses it, and it is as close as he comes to the prayer he does not record. Peter's blow works against what Jesus knows to be His Father's will, and Jesus calls the cup the one “my Father hath given me.” All four Gospels tell of the sword and the servant's ear; only John names the two men, Simon Peter and Malchus.

      The risen Lord used the same words when He first spoke to the Nephites: “I have drunk out of that bitter cup which the Father hath given me, and have glorified the Father in taking upon me the sins of the world” ([[3 Ne. 11:11]]). There He calls it bitter for the first time, and joins drinking it to His taking upon Him the sins of the world. In this dispensation He told what drinking it cost and how it ended: “Nevertheless, glory be to the Father, and I partook and finished my preparations unto the children of men” ([[D&C 19:19]]).
    sources: [ellicott-john, sc-knowhy-341, lds-scriptures]
  - ref: 13
    phrase: led him away to Annas first
    kind: history
    title: To Annas first
    body: |
      Annas was no longer high priest. Rome had appointed him in AD 7 and deposed him in AD 15; from AD 18 to 36 the office was held by his son-in-law, Joseph Caiaphas. But Annas kept the title, as Jewish custom allowed, and he remained a man of great influence in the council. John alone tells that Jesus was brought to him first.

      What happened before Annas seems to have been an informal, preliminary examination of Jesus's teaching. The legal high priest still had to hear the case with the council before Jesus could be handed to the governor (verses 24, 28). John reminds the reader who that high priest was: the Caiaphas who had said that it was expedient for one man to die for the people (verse 14). The note on [[John 11:51]] explains his words and what “high priest that same year” means.
    sources: [bd-annas, ellicott-john]
  - ref: 15
    phrase: 'so did another disciple: that disciple was known unto the high priest'
    kind: history
    title: Another disciple
    body: |
      John does not name the disciple who followed with Peter and got him past the door. He is often identified with the disciple “whom Jesus loved” ([[John 13:23]]), the Gospel's own witness and, by tradition, John himself. If so, a second witness beside Peter may account for some of the ways John's account of that night differs from the others, such as the hearing before Annas and the woman who kept the door. How he came to be known to the high priest no one can say.
    sources: [huntsman-peters-denial, ellicott-john]
  - ref: 17
    phrase: He saith, I am not.
    kind: words
    title: I am not
    body: |
      Peter's first denial is two words in Greek, *ouk eimi*, “I am not,” said to the woman who kept the door. *Egō eimi*, “I am,” is often on Jesus's lips in John, and He has just spoken it to the men who came to arrest Him (verses 5–8). Against it, Peter's “I am not” shows how far he has distanced himself from his Lord. Peter says the same again by the fire (verse 25).

      John tells the denials more gently than Matthew and Mark do. There is no cursing or swearing, and no worsening from one denial to the next. But he also leaves out Peter's tears: his account ends with the cock crowing. What Peter denied was his tie to Jesus, not his testimony that Jesus is the Christ, which he never denied; but to deny the tie was still to disown Him. Why Peter did it the Gospels do not say, and readers are not asked to judge his motives.
    sources: [huntsman-peters-denial, huntsman-thursday]
  - ref: 23
    phrase: 'If I have spoken evil, bear witness of the evil: but if well, why smitest thou me?'
    kind: history
    title: Why smitest thou me?
    body: |
      The high priest asks Jesus about His disciples and His teaching. Jesus answers that He has taught openly, in the synagogue and the temple; His followers are no secret society and no political party. If there is a charge, let those who heard Him testify. Hebrew law, as it was later written down, required the accusing witnesses to state the charge and protected the accused from being made to testify against himself; judged by it, the questioning was unlawful and Jesus's reply was a lawful objection.

      The officer's blow answers the objection with force, and Jesus answers the blow calmly, with the same appeal to justice: if He said something wrong, let it be shown; if not, why strike Him? How far those rules held in Jesus's day is less certain. They are known mostly from the Mishnah, written down about AD 200, and the Gospels give only an outline of what seems to have been a preliminary hearing. Whatever the rules were, the prisoner asks for evidence and receives a blow.
    sources: [ellicott-john, talmage-jesus-christ-34, huntsman-thursday]
  - ref: 24
    phrase: Now Annas had sent him bound unto Caiaphas the high priest.
    kind: words
    title: Now Annas had sent him bound
    body: |
      The King James “had sent” makes the verse look back, as if Jesus had already been sent to Caiaphas before the questioning of verses 19–23, so that “the high priest” who questioned Him was Caiaphas. But the Greek verb is a simple past, and it can be read as a plain statement that Annas therefore sent Him, bound, to Caiaphas. On that reading Annas did the questioning, and only now is Jesus taken to the high priest in office. Neither reading is certain: whether Annas or Caiaphas questioned Him is a matter of inference. Either way, Jesus is still bound, as He has been since the garden (verse 12).
    sources: [ellicott-john, talmage-jesus-christ-34]
  - ref: 28
    phrase: 'lest they should be defiled; but that they might eat the passover'
    kind: history
    title: That they might eat the passover
    body: |
      The men who brought Jesus to the governor would not go into his residence. To enter a Gentile's house could make them ritually unclean, and by John's reckoning the Passover would begin at sunset that day; unclean, they could not eat the Passover meal that evening. So Pilate comes out to them, and the trial goes back and forth between the crowd outside and Jesus within.

      The verse is one of the places where John's timing differs from that of the other Gospels. Matthew, Mark and Luke make the Last Supper a Passover meal; John's account seems to say that the Passover has not yet begun, so that Jesus dies on the day the Passover lambs were slain in the temple, at about the moment the priests began to slaughter them. That timing matters to John, who called Jesus “the Lamb of God” from the first chapter ([[John 1:29]]). How the accounts fit together is not settled (see the note on [[John 13:1]]).
    sources: [huntsman-good-friday, huntsman-lamb-of-god]
  - ref: 30
    phrase: If he were not a malefactor
    kind: words
    title: A malefactor
    body: |
      Pilate asks for a charge, and gets none. The priests say only that Jesus is a “malefactor,” in Greek *kakon poiōn*, an evildoer, someone who does wrong. They do not yet say that He claimed to be a king; the charges recorded before Pilate were stirring up sedition, making Himself a king, and forbidding tribute to Caesar ([[Luke 23:2]]). The word may be John's way of showing Jesus numbered with the wicked, as the servant of [[Isa. 53:9]] was.

      The word may also have meant more in a court. Its Greek and its Latin counterpart (*maleficus*) could mean, in legal contexts, a magician or sorcerer, and both Jewish and Roman law punished those who worked wonders by illicit power. On one reading, then, the case the chief priests first brought to Pilate was that Jesus was an illegal miracle worker, a threat to public order. That is a conclusion from the word and the circumstances; the verse itself leaves the charge unstated.
    sources: [huntsman-good-friday, welch-legal-cause, bd-pilate]
  - ref: 31
    phrase: It is not lawful for us to put any man to death
    kind: history
    title: It is not lawful for us to put any man to death
    body: |
      The answer shows why Jesus's accusers had come to Pilate at all: the council had no power to carry out a sentence of death, and the governor's consent had to be had. Why it lacked that power is less certain. Rome at times kept capital cases under the governor's review, so that local authorities could not use the courts to kill their opponents; it is just as likely that Jewish law itself forbade an execution so close to the Passover. A death by Jewish law would have been by stoning, the penalty for blasphemy. A death by Roman sentence, the penalty for rebellion against Rome, was crucifixion.

      That is why John adds verse 32. Jesus had said what death He would die: “And I, if I be lifted up from the earth, will draw all men unto me. This he said, signifying what death he should die” ([[John 12:32–33]]; see [[John 3:14]]). By bringing Him to Pilate, His accusers brought about the very death He had foretold.

      “The Jews” who answer Pilate here are the chief priests and their officers, the leaders who arrested Jesus and brought Him to the governor. Pilate himself calls them Jesus's “own nation and the chief priests” (verse 35): Jesus and His disciples were Jews as well.
    sources: [huntsman-good-friday, bd-pilate, lds-scriptures]
  - ref: 36
    phrase: My kingdom is not of this world
    kind: christ
    title: My kingdom is not of this world
    body: |
      To claim to be King of the Jews could be treason against Rome, so Pilate's question is the heart of the case. Jesus answers with a question: does Pilate ask on his own account, or because others have told him? A plain “yes” would have been true in the sense a Jew meant by Messiah and false in the sense a Roman meant by king; a plain “no” would have been false the other way. Pilate's answer, “Am I a Jew?”, suggests that he is thinking of a king in the Roman sense.

      So Jesus tells him what kind of king He is. His kingdom is not “of this world”: it does not come from the world and is not built as the world builds. It has no army, and the proof is that His servants are not fighting to rescue Him. That does not mean the kingdom has no place in the world, only that its nature and origin are elsewhere. Pilate understood enough to see that the prisoner before him was no insurrectionist.
    sources: [huntsman-good-friday, talmage-jesus-christ-34, ellicott-john]
  - ref: 37
    phrase: that I should bear witness unto the truth
    kind: christ
    title: To bear witness unto the truth
    body: |
      “Thou sayest that I am a king” lets Pilate's word stand, and then Jesus says what He was born for: to bear witness to the truth. His kingdom is set up by that witness, the truth He had known with the Father, and not by land or legions. The witness is also a witness of Himself, for He had told His disciples that night, “I am the way, the truth, and the life” ([[John 14:6]]).

      The last words turn the trial around. “Every one that is of the truth heareth my voice”: the prisoner is now judging the judge, and every hearer after him. Whoever hears Jesus's voice shows that he is of the truth.
    sources: [huntsman-good-friday, ellicott-john]
  - ref: 38
    phrase: What is truth?
    kind: prophets
    title: What is truth?
    body: |
      Pilate does not wait for an answer. He asks his question and goes out, so the tone is left to the reader. It has been heard as alarm, “rather exclaimed in apprehension than inquired in expectation of an answer,” and as “a certain weary cynicism,” the voice of a man who perhaps meant: how can anyone possibly know the truth? Either way he turns away from the one standing in front of him.

      The answer he did not wait for is the gospel of Jesus Christ. Jesus has just said that He came to bear witness to the truth, and that witness is of Himself, “the way, the truth, and the life” (see the note on verse 37); so the truth Pilate asks about is His gospel. Of truth itself the Lord said in this dispensation: “truth is knowledge of things as they are, and as they were, and as they are to come” ([[D&C 93:24]]). Pilate goes out and pronounces the prisoner innocent: “I find in him no fault at all.”
    sources: [talmage-jesus-christ-34, uchtdorf-what-is-truth, lds-scriptures]
  - ref: 40
    phrase: Not this man, but Barabbas
    kind: history
    title: Not this man, but Barabbas
    body: |
      Offered the King of the Jews, the crowd asks instead for a man guilty of rebellion against Rome, the very crime the priests were laying at Jesus's door. John calls Barabbas “a robber,” a word that also means a bandit, and the other Gospels say he had taken part in an insurrection ([[Mark 15:7]]). Where the custom of releasing a prisoner at the Passover came from is not clear; John has Pilate call it “a custom” of the people's. It suited the feast, which remembered Israel's deliverance from bondage.

      The name sharpens the irony. In Aramaic, Barabbas can mean “son of the father,” and so “one godless ‘son of the father’ was set free while a truly divine Son of His Heavenly Father moved on to crucifixion.” Some readers go further and see the two goats of the Day of Atonement ([[Lev. 16:7–10]]) in the scene: one goat was sacrificed, and the other carried away the people's impurities. On that reading Barabbas, released to the people, plays the part of the scapegoat, and Jesus is the one offered.
    sources: [huntsman-good-friday, holland-none-with-him, sc-knowhy-675]

christ: |
  John shows Jesus giving Himself up. He goes out to meet the band, answers “I am” and sees them fall to the ground, asks freedom for His disciples and chooses to drink the cup. As He had said, “No man taketh it from me, but I lay it down of myself” ([[John 10:18]]). Bound and struck, denied by Peter and judged by Pilate, He is still the King who bears witness to the truth.

  That night He also knew disloyalty, false judgment, arrest and rejection, and so He can succor those who are betrayed, abused or rejected.

explore: |
  - **John's account of the Passion.** “The Lamb of God: Unique Aspects of the Passion Narrative in John,” in *Behold the Lamb of God*, sets John's account beside the others: the timing of the Passover, the silence about the agony, and Jesus laying down His own life.
  - **The charge before Pilate.** “The Legal Cause of Action Against Jesus in John 18:29–30,” in *Celebrating Easter*, argues the case on “malefactor.”
  - **What follows.** The scourging and the sentence ([[John 19:1–16]]), and Peter's three answers to the risen Lord ([[John 21:15–17]]).

