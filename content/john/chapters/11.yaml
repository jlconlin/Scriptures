chapter: 11
title: I Am the Resurrection, and the Life
tagline: Jesus goes back into Judea to the grave of His friend Lazarus, four days dead; He tells Martha that He is the resurrection and the life, weeps with Mary, and calls Lazarus out of the tomb, and the council in Jerusalem, hearing of it, resolves that He must die, as Caiaphas says that one man should die for the people.
when: 'At Bethany, near Jerusalem, in the winter after the feast of Dedication ([[John 10:22]]); the Passover at which He died is near ([[John 11:55]])'

setting: |
  Chapter 10 left Jesus beyond the Jordan, “into the place where John at first baptized,” after the men in the temple at the feast of Dedication took up stones to stone Him ([[John 10:31]]; [[John 10:39–40]]). Word reaches Him there that Lazarus is sick. Lazarus and his sisters, Martha and Mary, lived in Bethany, on the eastern slope of the Mount of Olives, near Jerusalem (verse 18), and they were friends of Jesus; Luke tells of an earlier visit to Martha’s house ([[Luke 10:38–42]]). The Joseph Smith Translation makes the household plain: Mary “lived with her sister Martha, in whose house her brother Lazarus was sick” (JST John 11:2). The anointing that verse 2 mentions is told in the next chapter ([[John 12:1–8]]).

  The raising of Lazarus is the crowning sign of the first half of John, the Book of Signs. It shows Jesus’s power over death and points ahead to His own resurrection. With the supper at Bethany that follows it, the story is a bridge into the second half, the Book of Glory, which tells His last days, and the council that ends the chapter leads straight into them.

thread: |
  **The sign that shows Jesus has power over death is the deed that sends Him to His own.**

  The chapter opens with a promise that sounds as if it fails: “This sickness is not unto death” (verse 4), and Lazarus dies. Jesus goes back into Judea, where He has just been threatened with stoning, and His disciples, fearing He will be killed, go with Him, Thomas saying they will die with Him (verses 8, 16). At Bethany He tells Martha that resurrection is not only an event at the last day but a person standing in front of her (verse 25), weeps with Mary, and then shows what He said: at His voice a man four days in the tomb walks out.

  The same deed that makes many believe (verse 45) brings the council together, and from that day they plan His death (verse 53). In the way John tells it, Jesus gives His own life for His friend’s. Caiaphas, speaking as a politician, says more than he knows: one man will die for the people. The chapter closes with the Passover near, the crowds in the temple asking whether He will come, and an order out for anyone who knows where He is to report it.

sections:
  - range: 1-16
    heading: He whom thou lovest is sick
    plain: |
      A man named Lazarus was ill. He was from Bethany, the village of Mary and her sister Martha. (This is the Mary who anointed the Lord with ointment and wiped His feet with her hair; it was her brother Lazarus who was ill.) So the sisters sent word to Jesus: “Lord, the one you love is ill.” When Jesus heard it, He said, “This illness will not end in death. It is for the glory of God, so that the Son of God may be glorified through it.” Jesus loved Martha, her sister, and Lazarus. Yet when He heard that Lazarus was ill, He stayed where He was two more days.

      Then He said to His disciples, “Let us go back into Judea.” The disciples said, “Master, the Jews were just now trying to stone you, and you are going back there?” Jesus answered, “Are there not twelve hours in the day? Whoever walks in the daytime does not stumble, because he sees the light of this world. But whoever walks at night stumbles, because the light is not in him.”

      After saying this He told them, “Our friend Lazarus has fallen asleep, but I am going to wake him.” The disciples said, “Lord, if he is sleeping, he will get well.” Jesus had been speaking of his death, but they thought He meant ordinary sleep. So Jesus told them plainly, “Lazarus is dead. For your sakes I am glad I was not there, so that you may believe. But let us go to him.” Then Thomas, called Didymus, said to the other disciples, “Let us go too, so that we may die with Him.”
  - range: 17-27
    heading: I am the resurrection, and the life
    plain: |
      When Jesus arrived, He found that Lazarus had already been in the tomb four days. Bethany was close to Jerusalem, less than two miles away, and many of the Jews had come to Martha and Mary to comfort them over their brother. When Martha heard that Jesus was coming, she went out to meet Him, while Mary stayed sitting in the house.

      Martha said to Jesus, “Lord, if you had been here, my brother would not have died. But even now I know that whatever you ask of God, God will give you.” Jesus said to her, “Your brother will rise again.” Martha said, “I know that he will rise again in the resurrection at the last day.” Jesus said to her, “I am the resurrection and the life. Whoever believes in me, even though he dies, will live; and everyone who lives and believes in me will never die. Do you believe this?” She said, “Yes, Lord. I believe that you are the Christ, the Son of God, the one who was to come into the world.”
  - range: 28-37
    heading: Jesus wept
    plain: |
      When she had said this, she went and called her sister Mary aside and told her quietly, “The Master is here, and He is asking for you.” As soon as Mary heard it, she got up quickly and went to Him. Jesus had not yet come into the village but was still where Martha had met Him. The Jews who were in the house with Mary, comforting her, saw her get up and hurry out, and they followed her, thinking she was going to the tomb to weep there.

      When Mary came to where Jesus was and saw Him, she fell at His feet and said, “Lord, if you had been here, my brother would not have died.” When Jesus saw her weeping, and the Jews who had come with her weeping too, He was deeply moved in spirit and troubled, and He asked, “Where have you laid him?” They said, “Lord, come and see.” Jesus wept. So the Jews said, “See how He loved him!” But some of them said, “This man opened the eyes of the blind. Could He not have kept this man from dying?”
  - range: 38-44
    heading: Lazarus, come forth
    plain: |
      Deeply moved again within Himself, Jesus came to the tomb. It was a cave, with a stone laid against it. Jesus said, “Take away the stone.” Martha, the dead man’s sister, said, “Lord, by now there will be a stench, for he has been dead four days.” Jesus said to her, “Did I not tell you that if you would believe, you would see the glory of God?”

      So they took away the stone. Jesus looked up and said, “Father, I thank you that you have heard me. I knew that you always hear me, but I said this for the sake of the people standing here, so that they may believe that you sent me.” When He had said this, He cried with a loud voice, “Lazarus, come out!” And the dead man came out, his hands and feet bound with burial cloths and his face wrapped in a cloth. Jesus said to them, “Unbind him, and let him go.”
  - range: 45-57
    heading: That one man should die for the people
    plain: |
      Many of the Jews who had come to Mary and had seen what Jesus did believed in Him. But some of them went to the Pharisees and told them what Jesus had done. So the chief priests and the Pharisees called the council together and said, “What are we doing? This man is performing many signs. If we let Him go on like this, everyone will believe in Him, and the Romans will come and take away both our place and our nation.” But one of them, Caiaphas, who was high priest that year, said to them, “You know nothing at all. You do not see that it is better for us that one man should die for the people than that the whole nation should perish.” He did not say this on his own. Being high priest that year, he prophesied that Jesus would die for the nation, and not for the nation only, but to gather into one the children of God who were scattered abroad. So from that day on they plotted to put Him to death.

      Jesus therefore no longer went about openly among the Jews. He went from there to the country near the wilderness, to a town called Ephraim, and stayed there with His disciples. The Passover of the Jews was near, and many went up from the countryside to Jerusalem before the Passover to purify themselves. They kept looking for Jesus, and as they stood in the temple they said to one another, “What do you think? Will He not come to the feast?” For the chief priests and the Pharisees had given orders that anyone who knew where He was should report it, so that they might arrest Him.

notes:
  - ref: 4
    phrase: This sickness is not unto death
    kind: christ
    title: Not unto death, but for the glory of God
    body: |
      Jesus’s first words about the illness seem to be proved wrong within a few verses: He says the sickness is “not unto death,” and by verse 14 Lazarus is dead. A first reader is left to wonder whether the promise has failed. The story answers the worry at the tomb: Jesus has power over death, and that power is the “glory of God” He spoke of. The sickness was not unto death in the sense that it was not, at that time, unto final death.

      Verse 40 brings the saying back. When Martha worries about the stench, Jesus asks, “Said I not unto thee, that, if thou wouldest believe, thou shouldest see the glory of God?” The words may recall both what He had just told her in person (verses 25–26) and the message He had sent from beyond the Jordan (verse 4). The glory is not that Lazarus was spared dying but that he came out of the grave, and that “the Son of God might be glorified thereby” (verse 4), seen for who He is.
    sources: [smith-resurrection, talmage-jesus-christ-28]
  - ref: 6
    phrase: he abode two days still in the same place where he was
    kind: history
    title: Why He waited two days
    body: |
      John says that Jesus loved the family (verse 5) and then, in the same breath, that He stayed where He was two more days, which makes a reader ask whether the delay cost Lazarus his life. Counting the days suggests it did not. The custom was to bury on the day of death, and Lazarus had been four days in the grave when Jesus arrived (verse 17). On the likely assumption that the journey each way took a day, the day the messenger set out, the two days of waiting and the day of the return make up the four, so Lazarus must have died about the time the messenger left. On that reckoning he was already dead when the word reached Jesus.

      The waiting had a purpose that Jesus Himself names: “I am glad for your sakes that I was not there, to the intent ye may believe” (verse 15). What the four days added is the subject of the note on verse 17.
    sources: [talmage-jesus-christ-28, judd-caiaphas-prophecy]
  - ref: 8
    phrase: the Jews of late sought to stone thee
    kind: history
    title: Who the Jews are here
    body: |
      “The Jews” in this chapter are not the Jewish people at large: Jesus, His disciples, Lazarus and his sisters were all Jews, and John’s phrase changes its meaning with the scene. In verse 8 the disciples mean the men who had lately taken up stones against Him in the temple at the feast of Dedication ([[John 10:31]]). John uses the phrase often, and often negatively; in such places it seems to mean the Jewish leaders or a particular group opposed to Jesus, who meet Him with suspicion and from a distance.

      From verse 19 on, “the Jews” are the mourners who came to comfort Martha and Mary, and they are divided over Him. Some say, “Behold how he loved him!” (verse 36); many “which came to Mary, and had seen the things which Jesus did, believed on him” (verse 45); some go and report Him to the Pharisees (verse 46). At verse 54, where Jesus “therefore walked no more openly among the Jews,” the “therefore” ties His withdrawal to the council that has just resolved to kill Him (verse 53).
    sources: [matson-fourth-gospel, lds-scriptures]
  - ref: 9
    phrase: Are there not twelve hours in the day?
    kind: symbol
    title: Twelve hours in the day
    body: |
      Jesus answers the disciples’ fear with a saying about daylight. A working day has twelve hours, and while they last a man can walk without stumbling, because he walks in the light; it is the one who lets the hours pass and then tries to walk in the dark who stumbles. Applied to Jesus, the saying means that it is still His day, with the Father’s work to be done, and the danger in Judea will not turn Him from that work while the day lasts. He had spoken in nearly the same terms at the healing of the blind man: “I must work the works of him that sent me, while it is day: the night cometh, when no man can work” ([[John 9:4]]).
    sources: [talmage-jesus-christ-28, ellicott-john]
  - ref: 16
    phrase: Let us also go, that we may die with him
    kind: history
    title: That we may die with him
    body: |
      The “him” Thomas means is Jesus, not Lazarus, as the Joseph Smith Translation makes plain: the disciples feared that the Jews would take Jesus and put Him to death (JST John 11:16). They expect the return to Judea to end in His death and perhaps their own, and Thomas proposes that they go anyway.

      Thomas is remembered mostly for his questions after the Resurrection ([[John 20:24–29]]), but he and Peter can both be read as devoted, impulsive disciples who at times slipped or questioned and went on to great faith. Here his devotion is ready to die with a Master who is Himself risking His life to go to a friend, a first glimpse of what Jesus will say after the Last Supper: “Greater love hath no man than this, that a man lay down his life for his friends” ([[John 15:13]]). His two names mean the same thing, “twin”: Didymus is the Greek for Thomas.
    sources: [lds-scriptures, huntsman-gospel-john, huntsman-preludes-last-week, bd-thomas]
  - ref: 17
    phrase: he had lain in the grave four days already
    kind: history
    title: Four days in the grave
    body: |
      John counts the days twice (verses 17 and 39), and the count matters. Each day the body lay in the tomb added weight to what Jesus did when He called Lazarus out. Had He come at once and raised a man just dead, His critics might have said there was no miracle; after four days, with many mourners at hand, the conclusion that He had raised the dead was hard to escape.

      Jewish traditions recorded later than Jesus’s day held that the spirit of the dead stayed near the body for three days, hoping to return to it, and left for good on the fourth, and such a belief may lie behind John’s “four days.” Martha and Mary each believed that Jesus could have kept their brother alive (verses 21, 32), and Martha trusted that God would give Him whatever He asked “even now” (verse 22); yet her protest at the tomb (verse 39) suggests that neither sister looked for the death to be undone.
    sources: [judd-caiaphas-prophecy, van-dyke-miracles-john]
  - ref: 25
    phrase: I am the resurrection, and the life
    kind: christ
    title: I am the resurrection, and the life
    body: |
      Martha already believes in the resurrection. Most Jews of her day did (the Sadducees were the exception), and when Jesus says, “Thy brother shall rise again,” she hears the general hope of the faithful: he will rise “at the last day” (verse 24). Jesus moves her hope from a day to a person. The resurrection is not only something that will happen at the end; it is Jesus Himself, standing in front of her, the one to whom power over life and death has already been given. Her hope in the resurrection looked to the future and to all the faithful; He ties it to Himself and to the present.

      Martha does not claim to understand all of it. She answers by saying whom she trusts: “I believe that thou art the Christ, the Son of God, which should come into the world” (verse 27). It is one of the strongest confessions in John, close to Peter’s ([[Matt. 16:16]]; [[John 6:69]]), and she makes it before the tomb is opened.
    sources: [talmage-jesus-christ-28, smith-resurrection, huntsman-preludes-last-week]
  - ref: 26
    phrase: whosoever liveth and believeth in me shall never die
    kind: christ
    title: Shall never die
    body: |
      The promise cannot mean that believers never die in the body: Lazarus believed, and he had just died. The two halves of Jesus’s saying seem to speak of two deaths. “Though he were dead, yet shall he live” (verse 25) is the resurrection of the body. “Shall never die” is best understood of the other death, the spiritual death that separates a person from God, which the one who lives and believes in Christ need never know.

      In John this life begins now. Jesus had said that whoever hears His word and believes “hath everlasting life” and “is passed from death unto life” ([[John 5:24]]), and He defines that life as knowing the Father and the Son ([[John 17:3]]). So the raising of Lazarus that follows is a picture of two things: the resurrection to come, and the new life of everyone who comes to Christ.
    sources: [huntsman-gospel-john, huntsman-preludes-last-week]
  - ref: 33
    phrase: he groaned in the spirit, and was troubled
    kind: words
    title: Groaned in the spirit
    body: |
      The Greek verb behind “groaned” (*embrimaomai*, also in verse 38) is a strong word. It began as the snorting of a horse, and in use it means to be very angry or moved with indignation; elsewhere the King James Version renders it “straitly charged” ([[Matt. 9:30]]; [[Mark 1:43]]). Here John adds “in the spirit,” and in verse 38 “in himself”: the feeling is inward.

      What the verse names is what Jesus saw: Mary weeping, and the mourners who came with her weeping too. Latter-day Saint leaders have read His groaning as compassion for them, the same compassion that shows a moment later in His tears (verse 35). The Greek word points to sorrow joined with indignation, not grief alone, and the scene suggests what any indignation was at: in verse 33, perhaps the customary wailing that profaned the sisters’ real grief; in verse 38, perhaps the carping of verse 37, that a man who opened the eyes of the blind could surely have kept His friend from dying.
    sources: [thayer, lds-scriptures, hales-gratitude-goodness, ardern-love-neighbour, talmage-jesus-christ-28]
  - ref: 35
    phrase: Jesus wept
    kind: christ
    title: Jesus wept
    body: |
      Jesus weeps at a grave He is about to open, and John’s Greek marks His tears as different from the mourners’, a difference the English “weep” hides. Mary and the mourners are “weeping” with the word for weeping aloud (*klaiō*, verse 33), the crying of a house in mourning. Jesus “wept” with another word (*dakryō*), which strictly means to shed tears, to weep silently.

      He knows that in a few minutes Lazarus will walk out of the tomb, and He weeps anyway. The tears are not despair; they are compassion, born of love for the people He loves in their grief. The covenant the Book of Mormon’s believers made at the waters of Mormon asks the same of a disciple, to “mourn with those that mourn” ([[Mosiah 18:9]]), and at Bethany the Lord Himself does it.
    sources: [thayer, ardern-love-neighbour, huntsman-preludes-last-week]
  - ref: 42
    phrase: because of the people which stand by I said it
    kind: christ
    title: Father, I thank thee
    body: |
      At the open tomb Jesus asks the Father for nothing. He gives thanks for a prayer already heard (verse 41), and says aloud why He speaks it: He knew that the Father heard Him always, but He said it “because of the people which stand by,” so that they would believe the Father had sent Him (verse 42). What the crowd needs to hear is where the power comes from.

      Around the prayer, Jesus leaves to the people everything they could do themselves. They take away the stone (verse 41), and they unbind Lazarus (verse 44); only the call that brings the dead man out is His (verse 43). He could have moved the stone without a hand laid on it, and the pattern has been read as a lesson for His disciples: He expects them to do all they can, and He does what only He can do.
    sources: [lds-scriptures, bassett-after-fourth-day]
  - ref: 44
    phrase: bound hand and foot with graveclothes
    kind: symbol
    title: Bound with graveclothes
    body: |
      Lazarus comes out wrapped as the dead were wrapped, hands and feet bound and his face tied with the cloth that had held his jaw closed. The detail shows that he had truly been dead and buried, and John’s care with it may also point to what kind of miracle this was. Lazarus was not resurrected: he came back to mortal life, and one day he would be dressed in graveclothes again.

      John makes the contrast plain at Jesus’s own tomb. There the linen clothes lie in the tomb, and the napkin is “wrapped together in a place by itself,” left behind, never to be worn again ([[John 20:6–7]]). Lazarus needs others to loose him; the risen Lord leaves His graveclothes behind.
    sources: [van-dyke-miracles-john, talmage-jesus-christ-28]
  - ref: 48
    phrase: take away both our place and nation
    kind: history
    title: Our place and nation
    body: |
      The council that meets is the Sanhedrin, the ruling body in Jerusalem, where the chief priests sat with the Pharisees (verse 47) and the Sadducees held the most power. They do not deny the miracles (“this man doeth many miracles,” verse 47). Their fear is what the miracles will do. If Jesus goes on gathering followers, a riot may break out in Jerusalem against its leaders, and Rome, which had already dealt with men who drew the people after them, such as Judas of Galilee ([[Acts 5:37]]), may step in.

      “Our place” can mean their own position or the temple, and both were at risk: the council feared the Romans would take the temple away, and its loss would also have ruined the high priest and the Sadducees who profited from its tithes and offerings. The council weighs only what the signs will cost.
    sources: [judd-caiaphas-prophecy, huntsman-preludes-last-week, lds-scriptures]
  - ref: 51
    phrase: being high priest that year, he prophesied
    kind: christ
    title: Caiaphas prophesied
    body: |
      Caiaphas had held the office since the Roman governor appointed him in AD 18, so John’s “high priest that same year” (verses 49, 51) marks the year rather than his term: it has been read as “that fatal and decisive year” in which Jesus died.

      Caiaphas meant his words as politics: better that one troublemaker die than that Rome punish the whole people. John says that the words meant more than Caiaphas knew, and that he spoke them “not of himself.” There were ancient Jewish traditions that the high priest could prophesy by virtue of his office, and some Latter-day Saint commentators have read John’s words in a like way: the spirit of prophecy came on Caiaphas because of the office he held, in spite of his unworthiness, and he spoke for God unwittingly.

      Verse 52 is John’s own comment, not Caiaphas’s: Jesus would die not for that nation only but to “gather together in one the children of God that were scattered abroad.” Readers of the Book of Mormon may hear an echo of the Spirit’s words to Nephi, “It is better that one man should perish than that a nation should dwindle and perish in unbelief” ([[1 Ne. 4:13]]). The words are alike, but the likeness is more apparent than real. Nephi acted under a commandment of God and in obedience to it; Caiaphas spoke to protect his own interests.
    sources: [judd-caiaphas-prophecy, ellicott-john]
  - ref: 53
    phrase: from that day forth they took counsel together for to put him to death
    kind: history
    title: From that day forth
    body: |
      In John, the raising of Lazarus is the miracle that tips the scales. The authorities had opposed Jesus before and tried to stone Him ([[John 8:59]]; [[John 10:31]]), but from this council on, His death is decided policy. By the end of the chapter the chief priests and Pharisees have issued what amounts to a warrant for His arrest: anyone who knows where He is must report it (verse 57). Lazarus himself soon becomes a wanted man, because on his account many believed on Jesus ([[John 12:10–11]]).

      John tells the raising and the plot as cause and effect: the life given to Lazarus is the immediate reason the authorities resolve to take Jesus’s. Jesus no longer goes about openly; He withdraws with His disciples to Ephraim, a town “near to the wilderness” (verse 54), until the Passover draws near.
    sources: [welch-legal-cause, huntsman-preludes-last-week, lds-scriptures]
  - ref: 55
    phrase: to purify themselves
    kind: history
    title: To purify themselves
    body: |
      No one could keep the Passover while ceremonially unclean. Under the law of Moses, men “defiled by the dead body of a man” could not keep it on its day ([[Num. 9:6–10]]), and on the morning of Jesus’s trial those who brought Him to Pilate would not enter the judgment hall “lest they should be defiled; but that they might eat the passover” ([[John 18:28]]). Cleansing varied with the uncleanness: bathing the body and the clothes, for deeper uncleanness such as touching a corpse a sprinkling with purifying water, and in some cases offerings. So many came up to Jerusalem before the feast, and the crowds were already in the temple, watching for Jesus, before it began. The next chapter opens six days before the Passover ([[John 12:1]]).
    sources: [lds-scriptures, bd-purification]

christ: |
  Jesus tells Martha that He is the resurrection and the life, and then, in John’s telling, gives life to Lazarus at the cost of His own: the miracle at Bethany is what moves the council to decide His death. Caiaphas meant only that one man should be sacrificed to keep Rome quiet, but his words, as John heard them, describe the Atonement: one man dying for the people, to gather the scattered children of God into one.

  The promise reaches a disciple before the last day. If the death of verse 26 is the death that separates a person from God, as it seems to be, whoever lives and believes in Christ need never die it; and the Lord who wept with the mourners at a grave He was about to open did Himself what His covenant people promise, to “mourn with those that mourn” ([[Mosiah 18:9]]).

explore: |
  - **Caiaphas’s words.** “Interpreting Caiaphas’s ‘Prophecy’ of the Savior’s Death,” in *Behold the Lamb of God*, reads verses 45–53 with the history of the high priesthood and sets them beside [[1 Ne. 4:13]].
  - **Bethany as a prelude to Holy Week.** “Preludes to Jesus’s Last Week,” in *Greater Love Hath No Man*, reads [[John 11:1–57]] with the supper and anointing of [[John 12:1–11]].
  - **Martha and Mary in Luke.** [[Luke 10:38–42]].
  - **The empty tomb and the graveclothes left behind.** [[John 20:1–10]].

