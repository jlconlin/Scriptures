chapter: 3
title: Born from Above
tagline: Nicodemus comes to Jesus by night and hears that a man must be born of water and of the Spirit and that the Son of man must be lifted up; John the Baptist rejoices as the friend of the bridegroom.
when: 'Early in the ministry: at Jerusalem after the first Passover (2:23), then in the countryside of Judea, while John the Baptist was still baptizing at Ænon'

setting: |
  John 3 holds two scenes that only John tells. The first grows out of the Passover of [[John 2:13–25]], when many in Jerusalem believed on Jesus after seeing His signs. Nicodemus seems to have been one of them. He was a Pharisee and a member of the Sanhedrin, and his conversation with Jesus is the first long discourse in John's Gospel. He appears only in John, three times in all: here, defending Jesus before the council ([[John 7:50–51]]), and bringing spices to His burial ([[John 19:39]]).

  The second scene is in the Judean countryside, where Jesus's disciples are baptizing while John the Baptist still baptizes nearby. For a time the two ministries ran side by side, while the Baptist was still free (verse 24).

  Restoration scripture uses the chapter's language. In the Book of Moses the Lord tells Adam that he must be born again “of water, and of the Spirit,” and adds a third element, blood ([[Moses 6:59–60]]). Several Book of Mormon prophets read the brazen serpent, which Jesus brings up in verse 14, as a figure of Christ ([[Hel. 8:14–15]]; [[Alma 33:19–22]]).

thread: |
  **From above.** One Greek word holds the chapter together. Jesus tells Nicodemus that a man must be born *anōthen*, “again” or “from above” (verse 3), and the chapter closes with the same word: “He that cometh from above is above all” (verse 31). Between those two verses runs a contrast between earth and heaven. Nicodemus is *the* teacher of Israel (verse 10), yet he cannot follow what Jesus says about a birth from above or about heavenly things. Only the Son of man, who came down from heaven, can tell those things.

  A second contrast runs beside the first: light and darkness. Nicodemus comes “by night,” and Jesus ends their talk with men who love “darkness rather than light” (verse 19). John leaves Nicodemus there without telling how he answered, but the Gospel brings him back: when the Son of man has been lifted up as Jesus foretold, Nicodemus comes into the open to bury Him. The Baptist, meanwhile, shows what it looks like to receive the One from above. He is glad to grow less, the friend whose joy is the bridegroom's voice.

sections:
  - range: 1-8
    heading: Nicodemus by night
    plain: |
      There was a man named Nicodemus, a Pharisee and a ruler of the Jews, a member of their ruling council. He came to Jesus at night and said, “Rabbi, we know You are a teacher who has come from God, for no one could do the signs You are doing unless God were with him.” Jesus answered, “I tell you truly, unless someone is born again, from above, he cannot see the kingdom of God.” Nicodemus said, “How can a man be born when he is old? Can he go back into his mother's womb a second time and be born?” Jesus answered, “I tell you truly, unless someone is born of water and of the Spirit, he cannot enter the kingdom of God. What is born of the flesh is flesh, and what is born of the Spirit is spirit. Do not be surprised that I told you, ‘You must be born again.’ The wind blows where it pleases. You hear its sound, but you cannot tell where it comes from or where it is going. So it is with everyone born of the Spirit.”
  - range: 9-21
    heading: Heavenly things, and the Son lifted up
    plain: |
      “How can these things be?” Nicodemus asked. Jesus answered, “You are the teacher of Israel, and you do not understand these things? I tell you truly, we speak of what we know and testify of what we have seen, and yet you do not accept our testimony. If I have told you earthly things and you do not believe, how will you believe if I tell you heavenly things? No one has gone up into heaven except the One who came down from heaven, the Son of man who is in heaven. And as Moses lifted up the serpent in the wilderness, so the Son of man must be lifted up, so that everyone who believes in Him will not perish but have eternal life. For God loved the world so much that He gave His only begotten Son, so that everyone who believes in Him will not perish but have everlasting life. God did not send His Son into the world to condemn the world, but so that the world might be saved through Him. Whoever believes in Him is not condemned; but whoever does not believe is condemned already, because he has not believed in the name of the only begotten Son of God. And this is the condemnation: light has come into the world, and people loved darkness rather than light, because their deeds were evil. Everyone who does evil hates the light and will not come to it, for fear his deeds will be exposed. But whoever does what is true comes to the light, so that it may be plain that his deeds have been done in God.”
  - range: 22-30
    heading: He must increase
    plain: |
      After this Jesus and His disciples went into the countryside of Judea, and He stayed there with them and baptized. John too was baptizing at Ænon near Salim, because there was plenty of water there, and people kept coming to be baptized; John had not yet been put in prison. A dispute arose between some of John's disciples and the Jews about purification. They came to John and said, “Rabbi, the man who was with you on the other side of the Jordan, the one you testified about: look, He is baptizing, and everyone is going to Him.” John answered, “A man can receive nothing unless it is given him from heaven. You yourselves can testify that I said, ‘I am not the Christ, but I have been sent ahead of Him.’ The bride belongs to the bridegroom. The friend of the bridegroom, who stands by and listens for him, rejoices greatly at the bridegroom's voice. So this joy of mine is now complete. He must increase, and I must decrease.”
  - range: 31-36
    heading: He that cometh from above
    plain: |
      The One who comes from above is above all. The one who is of the earth belongs to the earth and speaks of the earth. The One who comes from heaven is above all. He testifies to what He has seen and heard, and yet no one accepts His testimony. Whoever does accept it has set his seal to this, that God is true. For the One whom God has sent speaks the words of God, because God does not give Him the Spirit in a limited measure. The Father loves the Son and has put all things into His hands. Whoever believes in the Son has everlasting life; whoever refuses to believe the Son will not see life, but the wrath of God remains on him.

notes:
  - ref: 1
    phrase: a ruler of the Jews
    kind: history
    title: A ruler of the Jews
    body: |
      John gives Nicodemus two titles. “A man of the Pharisees” names his party; “a ruler of the Jews” names his office. He sat in the Sanhedrin, the council that was the highest Jewish court in both civil and religious matters, with seventy-one members drawn from the chief priests, the scribes and the elders.

      Even this early in John's Gospel, “the Jews” has more to do with how people receive Jesus than with who they are by birth or religion. Here “a ruler of the Jews” marks Nicodemus as a man of standing in the Jewish community, one of its leaders (see the note on [[John 1:19]]). What surprises is that such a man came at all, and the next verse tells when he came.
    sources: [gs-sanhedrin, lds-scriptures, strathearn-johannine-dialogues]
  - ref: 2
    phrase: came to Jesus by night
    kind: history
    title: By night
    body: |
      John doesn't say why Nicodemus came at night, and readers have given practical reasons and fearful ones. Several practical ones are possible. It was Passover, the city was packed, and Jesus had just cleared the temple in front of everyone, so a quiet, private conversation may have been possible only after dark. Coming at night does not have to mean cowardice. It may only show a careful man who wanted to find out the truth.

      John, though, gives the hour more weight than a time of day. Light and darkness run through his Gospel from the prologue (“the light shineth in darkness,” [[John 1:5]]), and Jesus ends this very conversation by speaking of men who love “darkness rather than light” (verse 19). Read that way, Nicodemus is drawn to Jesus but is not yet ready to be seen with Him by day or to give Him his loyalty in the open. John never lets the reader forget the hour. At the burial he is still “Nicodemus, which at the first came to Jesus by night” ([[John 19:39]]).
    sources: [sandstrom-nicodemus, strathearn-johannine-dialogues]
  - ref: 2
    phrase: 'we know that thou art a teacher come from God: for no man can do these miracles that thou doest'
    kind: words
    title: A teacher come from God
    body: |
      Nicodemus opens with a compliment that is also a partial confession. “Rabbi” was a title of respect, and “a teacher come from God” grants that God is with Jesus. But elsewhere in John “Rabbi” is joined to “the Son of God” ([[John 1:49]]), and the reader has been told since the first verse that Jesus is the Word who was God. Nicodemus stops at teacher.

      The word for “miracles” is *sēmeia*, “signs.” Nicodemus may have had in mind the cleansing of the temple, an act that pointed less to the temple than to the death of Jesus's own body ([[John 2:19–22]]). His “we” ties him to the people in Jerusalem who believed when they saw the signs at Passover ([[John 2:23]]), whose belief Jesus did not trust, “because he knew all men” ([[John 2:24]]). Jesus's answer passes over the signs and speaks of the kingdom of God: He wants Nicodemus to move from watching the signs as a spectator to entering the kingdom and becoming part of it.
    sources: [strathearn-johannine-dialogues, huntsman-gospel-john]
  - ref: 3
    phrase: Except a man be born again
    kind: words
    title: Born again, or born from above
    body: |
      The Greek adverb behind “again” is *anōthen*, which can mean “anew” or “from above,” and the Gospel Library footnote gives both. Elsewhere John uses it for what comes from heaven: “He that cometh from above is above all” (verse 31), and Pilate's power was “given thee from above” ([[John 19:11]]). Nicodemus hears only “again,” and so he asks how a grown man can enter his mother's womb a second time.

      Which sense Jesus meant first is debated. One standard lexicon argues for “anew,” since Nicodemus did not ask how anyone could be born from heaven, and it records that others read “from above.” The conversation needs both senses. The birth is a second birth, and it comes from God, as verse 5 goes on to explain.
    sources: [thayer, strathearn-johannine-dialogues]
  - ref: 5
    phrase: born of water and of the Spirit
    kind: prophets
    title: Water and the Spirit
    body: |
      Jesus explains the new birth with two elements, and Joseph Smith taught that they are baptism in water and the gift of the Holy Ghost. Restoration scripture repeats them. In the Book of Moses the Lord teaches Adam that as he was born into the world “by water, and blood, and the spirit,” so “ye must be born again into the kingdom of heaven, of water, and of the Spirit, and be cleansed by blood, even the blood of mine Only Begotten” ([[Moses 6:59]]). Then He gives each element its work: “by the water ye keep the commandment; by the Spirit ye are justified, and by the blood ye are sanctified” ([[Moses 6:60]]). Moses 6 thus takes John's two elements and adds the third, the Savior's blood.

      The verb changes too. In verse 3 the one born from above can “see” the kingdom; here he can “enter” it. One reading ties the two verbs to the two elements: baptism in water lets a person see the kingdom, but to enter it and take full part in it he needs a baptism sanctified by the outpouring of the Spirit. Joseph Smith would not let the two be separated. A man, he said in a sermon of 9 July 1843 as it was reported, “might as well be baptize a bag of sand as a man if not done in view of the getting of the Holy Ghost.—baptism by water is but 1/2 a baptism.”
    sources: [bradshaw-bowen-born-again, strathearn-johannine-dialogues, wjs-1843-07-09]
  - ref: 8
    phrase: The wind bloweth where it listeth
    kind: words
    title: Wind and Spirit
    body: |
      Jesus makes a play on words that English cannot keep. The Greek *pneuma*, like the Hebrew *ruach*, means both “wind” and “spirit.” It is translated “wind” at the start of this verse and “Spirit” at its end, and the footnote gives both. No one can say where the wind began or where it will go, yet its sound is plain to hear. Jesus says the same is true of everyone born of the Spirit.
    sources: [thayer]
  - ref: 10
    phrase: Art thou a master of Israel
    kind: words
    title: The teacher of Israel
    body: |
      The King James “a master of Israel” hides a definite article. The Greek reads *ho didaskalos*: *the* teacher of Israel. The article suggests that Nicodemus stands for all of Israel's teachers, who speak “of the earth” (verse 31): the failure to understand is not his alone. No earthly study, his or theirs, reaches heavenly things. Those can be told only by the One who came down from heaven (verses 12–13).
    sources: [strathearn-johannine-dialogues]
  - ref: 14
    phrase: as Moses lifted up the serpent in the wilderness
    kind: scripture
    title: The serpent in the wilderness
    body: |
      Jesus turns to a story from Israel's years in the wilderness. When Israel murmured in the wilderness, the Lord sent fiery serpents among the people. When they repented, He told Moses to set a serpent of brass on a pole, “that every one that is bitten, when he looketh upon it, shall live” ([[Num. 21:8]]). The cure was nothing more than a look.

      A serpent seems a strange figure for the Savior. But in the ancient Near East a serpent could stand for healing, life and deliverance as well as for evil, and an Israelite who looked up at the pole likely saw more than a snake. Book of Mormon prophets read the serpent as a figure of Christ. Nephi the son of Helaman says that “as many as should look upon that serpent should live, even so as many as should look upon the Son of God with faith, having a contrite spirit, might live” ([[Hel. 8:15]]). Alma tells why some died anyway: “they did not believe that it would heal them” ([[Alma 33:20]]).
    sources: [sc-knowhy-657]
  - ref: 14
    phrase: even so must the Son of man be lifted up
    kind: christ
    title: Lifted up
    body: |
      “Lifted up” looks ahead to the cross, and this is the first time in John that Jesus uses the words of Himself. He does it again at [[John 8:28]] and [[John 12:32]], and John explains the last of them: “This he said, signifying what death he should die” ([[John 12:33]]). To the Nephites the risen Lord said it plainly: “my Father sent me that I might be lifted up upon the cross; and after that I had been lifted up upon the cross, that I might draw all men unto me” ([[3 Ne. 27:14]]). By the cross, the One who “came down from heaven” (verse 13) went back there.

      Nicodemus heard this prophecy at night. He saw it fulfilled at the end, and he came to the burial with Joseph of Arimathea, bringing a king's weight of spices for the man he now knew as the Christ ([[John 19:38–39]]).
    sources: [huntsman-lamb-of-god]
  - ref: 16
    phrase: he gave his only begotten Son
    kind: christ
    title: His only begotten Son
    body: |
      *Monogenēs*, “only begotten,” is the word for an only son or daughter. Used of Christ, it names the Son who has no brothers in the sense in which He is God's Son. The words are still Jesus speaking to Nicodemus: the Greek construction makes verses 11–21 one direct quotation.

      “Gave” is a father's word, and the footnote here sends the reader to Abraham, told to offer “thine only son Isaac, whom thou lovest” ([[Gen. 22:2]]). Jacob says what that offering was: “a similitude of God and his Only Begotten Son” ([[Jacob 4:5]]). God's motive is the plainest word in the verse: He *loved* the world. The next verse adds that He sent the Son to save the world, not to condemn it.
    sources: [lds-scriptures, thayer]
  - ref: 22
    phrase: and baptized
    kind: history
    title: Did Jesus baptize?
    body: |
      Verse 22 says Jesus baptized, and John later adds, “Jesus himself baptized not, but his disciples” ([[John 4:2]]). The Joseph Smith Translation of John 4 brings the two together: “though he himself baptized not so many as his disciples; For he suffered them for an example, preferring one another” (JST John 4:3–4). Jesus did baptize, then, but He gave most of the work to His disciples as an example.

      Their baptism also went beyond John's. Those baptized took upon themselves Christ's name, with the promise that the Spirit would follow, the second half of the birth Jesus had just described to Nicodemus (verse 5).
    sources: [jst-john-4, larsen-baptism-nt]
  - ref: 24
    phrase: For John was not yet cast into prison
    kind: history
    title: Before John was imprisoned
    body: |
      John's aside answers a question the other Gospels raise. Mark has Jesus begin His preaching in Galilee “after that John was put in prison” ([[Mark 1:14]]), and Matthew does the same ([[Matt. 4:12]]). John places this time of baptizing in Judea before that arrest, while the two ministries overlapped. His Gospel adds an early ministry in Judea that the other three pass over.
    sources: [ellicott-john, larsen-baptism-nt]
  - ref: 25
    phrase: a question between some of John’s disciples and the Jews about purifying
    kind: history
    title: A question about purifying
    body: |
      The dispute was over purifying, and the other side of it may have been one man rather than a group. The Textus Receptus behind the King James reads “the Jews,” but the modern critical editions read the singular, “a Jew.” On that reading some of John's disciples fell into an argument with one Jewish man. What the question was is not known, and there is no way to find out. It started on the side of John's disciples, and it was probably connected with the two baptisms going on so near each other. John preserves it for where it led: the Baptist's testimony that follows.
    sources: [greek-nt, ellicott-john]
  - ref: 29
    phrase: the friend of the bridegroom
    kind: symbol
    title: The friend of the bridegroom
    body: |
      The Baptist answers his worried disciples with a wedding. The friend of the bridegroom handled everything before the marriage. He arranged the contract, acted for the bridegroom during the betrothal and presided at the wedding feast. It was a place of honor, and all of it served another man's joy.

      In the prophets the bridegroom is the Lord and the bride is His covenant people (for example [[Isa. 54:5]]). When the Baptist calls Jesus the bridegroom, he gives Him the place that language gives Jehovah. John is content to stand by, hear the bridegroom's voice and step aside: “He must increase, but I must decrease.”
    sources: [ellicott-john, huntsman-family-john]
  - ref: 31
    phrase: He that cometh from above is above all
    kind: words
    title: He that cometh from above
    body: |
      “From above” is *anōthen*, the word Jesus used for the new birth in verse 3; here it says where the Son comes from. Verses 31–36 name no new speaker, and they can be read as the Baptist going on to explain “He must increase.” The Greek repeats “of the earth” three times: the one who is of the earth is of the earth, and of the earth he speaks. On that reading the Baptist puts himself on the earthly side of the line, earthly in origin and limited in what he can say, and sets the One from above over all.
    sources: [ellicott-john, strathearn-johannine-dialogues]
  - ref: 34
    phrase: God giveth not the Spirit by measure unto him
    kind: scripture
    title: Not by measure
    body: |
      The Joseph Smith Translation tells why the Son receives the Spirit without limit: “for God giveth him not the Spirit by measure, for he dwelleth in him, even the fullness” (JST John 3:34). The Joseph Smith Translation carries the word into verse 36: the one who believes “shall receive of his fullness,” and the one who does not “shall not receive of his fullness” (JST John 3:36).
    sources: [lds-scriptures]
  - ref: 36
    phrase: he that believeth not the Son
    kind: words
    title: Believeth not
    body: |
      The second “believeth” in this verse is not the same Greek word as the first. The first is *pisteuō*, “believe.” The second is *apeitheō*, “not to allow oneself to be persuaded; not to comply with.” Here it means to refuse belief, set as the opposite of *pisteuō*, and the footnote gives “disbelieves, disobeys, is uncompliant to.” The unbelief the verse warns of is a refusal, not a lack of information, so the belief set against it is more than agreeing with an idea.
    sources: [thayer, lds-scriptures]

christ: |
  John 3 points to Jesus Christ as the only begotten Son whom the Father gave because He loved the world, the One who came down from heaven and must be lifted up on the cross, as Moses lifted up the serpent, so that whoever believes in Him should not perish ([[3 Ne. 27:14]]). Healing still comes the way it came in the wilderness, by a look of faith toward the Son of God. Some Israelites died only because “they did not believe that it would heal them” ([[Alma 33:20]]). Being born from above begins in baptism and the gift of the Holy Ghost, the two halves of one birth that Joseph Smith would not let be separated.

explore: |
  - **Nicodemus again.** Before the council, [[John 7:45–52]]; at the burial, [[John 19:38–42]].
  - **The serpent in the Book of Mormon.** [[1 Ne. 17:41]]; [[2 Ne. 25:20]]; [[Alma 33:19–22]]; [[Hel. 8:14–15]].
  - **Born of God.** [[Mosiah 27:24–26]]; [[Alma 5:14]]; [[Moses 6:59–60]].
  - **Three dialogues.** The article “Johannine Christology through the Lens of Three of Its Dialogues” (*Thou Art the Christ*, 2018) reads Nicodemus beside the Samaritan woman of chapter 4 and the man born blind of chapter 9.

