chapter: 16
title: I Have Overcome the World
tagline: On the night before His death Jesus finishes His farewell to the Eleven, warning them of persecution, promising the Comforter who will convict the world and guide them into all truth, foretelling a little while of sorrow that will turn to joy, and ending, as they are about to scatter, with “be of good cheer; I have overcome the world.”
when: 'In Jerusalem, on the night of the Last Supper, after Judas had gone out ([[John 13:30]])'

setting: |
  Chapter 16 is the last part of what Jesus taught the Eleven on the night of the Last Supper. John alone preserves these discourses; the other Gospels have nothing like them beyond a few short parallels in Luke. They run from 14:1 to the end of this chapter, and the prayer of chapter 17 follows. Then Jesus goes out across the brook Cedron to the garden ([[John 18:1]]).

  The discourses circle round one fact, His going away. Chapters 14 and 16 are about His departure, and chapter 15, the vine, about His staying with those who abide in Him. So chapter 16 takes up again what chapter 14 began: the Comforter ([[John 14:16–17]]; [[John 14:26]]), the “little while” ([[John 14:19]]), asking in His name ([[John 14:13–14]]), and peace ([[John 14:27]]). Its first four verses finish the warning that began at [[John 15:18]], about the hatred the disciples will meet in the world.

  What is new here is how the Spirit will work, on the world and in the disciples, and the turn from sorrow to joy. The chapter closes with the last words of the last and most solemn discourse Christ gave in the flesh, before He prays for them and goes out to Gethsemane.

thread: |
  **Jesus is going away, and He tells the disciples why that is good for them.**

  They hear only the loss, and “sorrow hath filled your heart” (verse 6). He answers that His going is “expedient,” to their advantage (verse 7). Because He goes, the Comforter will come and do what Jesus has done among them: bear witness to the world and teach the disciples what they cannot yet bear (verses 7–15). Because He goes, the sorrow of a little while will be turned into a joy no man can take (verses 16–22). And because He goes to the Father, they will ask the Father themselves, in His name, and find that “the Father himself loveth you” (verses 23–27).

  Verse 28 puts the whole in one sentence: “I came forth from the Father, and am come into the world: again, I leave the world, and go to the Father.” Their belief that He came from the Father already holds the rest within it: the One who came from the Father returns to Him, and His return brings the Spirit. The disciples think they understand at last (verses 29–30). Their faith is weaker than they know, and within hours they will scatter. But the last word is His: “I have overcome the world.”

sections:
  - range: 1-4
    heading: Warned beforehand
    plain: |
      “I have told you these things so that you will not fall away. They will put you out of the synagogues. Indeed, the time is coming when whoever kills you will think he is offering a service of worship to God. They will do these things because they have not known the Father or me. I have told you these things so that when the time comes you will remember that I told you. I did not tell you this at the beginning, because I was with you.”
  - range: 5-15
    heading: The Spirit of truth
    plain: |
      “But now I am going to Him who sent me, and none of you asks me, ‘Where are you going?’ Because I have told you these things, sorrow has filled your hearts. Yet I tell you the truth: it is for your good that I go away. If I do not go away, the Comforter will not come to you; but if I go, I will send Him to you. When He comes, He will convict the world of sin, of righteousness, and of judgment: of sin, because they do not believe on me; of righteousness, because I am going to my Father and you will see me no more; of judgment, because the prince of this world has been judged.

      “I have many more things to tell you, but you cannot bear them now. When the Spirit of truth comes, He will guide you into all truth. He will not speak on His own, but will speak what He hears, and He will tell you of things to come. He will glorify me, for He will take what is mine and make it known to you. All that the Father has is mine; that is why I said He will take what is mine and make it known to you.”
  - range: 16-24
    heading: A little while
    plain: |
      “In a little while you will not see me, and again in a little while you will see me, because I am going to the Father.” Some of His disciples said to one another, “What does he mean by telling us, ‘A little while, and you will not see me, and again a little while, and you will see me,’ and, ‘Because I am going to the Father’? What is this ‘little while’? We do not understand what he is saying.”

      Jesus knew they wanted to ask Him, and He said, “Are you asking one another what I meant? Truly, truly, I tell you, you will weep and mourn, but the world will rejoice. You will be sorrowful, but your sorrow will be turned into joy. A woman in labour has sorrow, because her hour has come; but when her child is born she no longer remembers the anguish, for joy that a child has been born into the world. So you have sorrow now. But I will see you again, and your hearts will rejoice, and no one will take your joy from you. On that day you will not ask me anything. Truly, truly, I tell you, whatever you ask the Father in my name, He will give it to you. Until now you have asked nothing in my name. Ask, and you will receive, so that your joy may be full.”
  - range: 25-33
    heading: I have overcome the world
    plain: |
      “I have told you these things in figures of speech. The time is coming when I will no longer speak to you in figures, but will tell you plainly about the Father. On that day you will ask in my name. I do not say that I will ask the Father on your behalf, for the Father Himself loves you, because you have loved me and have believed that I came from God. I came from the Father and have come into the world; now I am leaving the world and going to the Father.”

      His disciples said, “Now you are speaking plainly and not in a figure of speech. Now we are sure that you know all things and have no need for anyone to question you. By this we believe that you came from God.” Jesus answered them, “So now you believe? Look, the hour is coming, indeed it has come, when you will be scattered, each to his own, and will leave me alone. Yet I am not alone, because the Father is with me. I have told you these things so that in me you may have peace. In the world you will have tribulation. But take heart: I have overcome the world.”

notes:
  - ref: 1
    phrase: that ye should not be offended
    kind: words
    title: That ye should not be offended
    body: |
      “Offended” here has nothing to do with hurt feelings. The Greek verb means to be made to stumble: to begin to distrust and desert someone you ought to trust and obey, and so to fall away. Jesus is warning the Eleven of what is coming so that it will not knock their faith over when it comes. When the persecution arrives, they will remember that He told them, and the warning itself will hold up their faith and assure them He is still with them (verse 4).

      Why had He not told them “at the beginning”? Because while He was with them the hatred fell on Him. Once He was gone they would stand for Him, and take the blows in His place.
    sources: [thayer, ellicott-john]
  - ref: 2
    phrase: whosoever killeth you will think that he doeth God service
    kind: history
    title: He doeth God service
    body: |
      Being put out of the synagogue was the ban already threatened in Jerusalem against anyone who confessed Jesus (see the note on [[John 9:22]]). Jesus says it will go further. The words for “doeth” and “service” are the words for offering sacrifice and for the service of worship: the killer will think he is bringing God an offering. The church's first years bore it out in the death of Stephen and in Saul's persecution, as Paul later told it: “I verily thought with myself, that I ought to do many things contrary to the name of Jesus of Nazareth” ([[Acts 26:9]]).

      Verse 3 gives the reason. Such men “have not known the Father, nor me.” They think they are serving God, but the God they think they serve is one they do not know, because they have not known Him as He is revealed in His Son.
    sources: [ellicott-john, lds-scriptures]
  - ref: 5
    phrase: none of you asketh me, Whither goest thou?
    kind: words
    title: None of you asketh me
    body: |
      Peter had asked exactly this a few hours before, “Lord, whither goest thou?” ([[John 13:36]]), and Thomas had come close to it ([[John 14:5]]), so Jesus cannot mean the words were never said. The sense seems to be that no one is asking now, out of love for Him, where He is going. Their thoughts are on their own loss: “because I have said these things unto you, sorrow hath filled your heart” (verse 6). The rest of the chapter answers the question they did not ask. He is going to the Father (verses 10, 16, 28), and that is why the going is good news.
    sources: [ellicott-john]
  - ref: 7
    phrase: It is expedient for you that I go away
    kind: christ
    title: It is expedient for you that I go away
    body: |
      In Jesus's absence the Comforter, the Holy Ghost (on the word, see the note on [[John 14:16]]), will do for the disciples what Jesus did while He was with them: teach, bear witness, and convict (verses 8–15).

      Why must Jesus leave first? The scriptures do not fully explain why the gift of the Holy Ghost was withheld while He was on earth (see the note on [[John 7:39]]), but the order itself is plain. The Son was to finish His work, offer Himself for sin, rise from the dead and return to the Father, and then the Advocate would come. Peter said so at Pentecost: “being by the right hand of God exalted, and having received of the Father the promise of the Holy Ghost, he hath shed forth this, which ye now see and hear” ([[Acts 2:33]]). The Spirit's work in the world rests on what Christ had first done.
    sources: [huntsman-thursday, ellicott-john, bd-holy-ghost, lds-scriptures]
  - ref: 8
    phrase: he will reprove the world of sin, and of righteousness, and of judgment
    kind: words
    title: Of sin, and of righteousness, and of judgment
    body: |
      “Reprove” is too weak. The verb means to convict: to prove someone wrong, usually to his shame. The Spirit brings the truth about Christ home to the world, and the conviction works two ways: those who accept it are brought to repentance and saved, and those who reject it harden their hearts and are condemned by it. Peter's sermon at Pentecost, when the hearers “were pricked in their heart” ([[Acts 2:37]]), is the first great example of it in the Church's history.

      Verses 9–11 say what the world will be convicted of. *Of sin, because they believe not on me*: one careful reading takes the sin as sin in general, with unbelief in Christ named as its cause rather than as one more sin on the list. *Of righteousness, because I go to my Father*: the world called Jesus a sinner ([[John 9:24]]) and crucified Him as a criminal, and His return to the Father is heaven's verdict that He was righteous. *Of judgment, because the prince of this world is judged*: the prince is Satan, and the verb is perfect, meaning he has been judged and stays judged. Christ's victory has already decided his case.
    sources: [thayer, huntsman-thursday, ellicott-john, talmage-jesus-christ-33]
  - ref: 12
    phrase: ye cannot bear them now
    kind: scripture
    title: Ye cannot bear them now
    body: |
      Jesus was not holding back out of reluctance. He had just told them that He made known to them all He had heard from the Father ([[John 15:15]]). The limit was in them, not in Him: what they could not bear now, the Spirit of truth would teach them later (verse 13).

      The Lord says the same thing in the Book of Mormon and the Doctrine and Covenants. At Bountiful He told the people, “I perceive that ye are weak, that ye cannot understand all my words,” and sent them home to “ponder upon the things which I have said, and ask of the Father, in my name, that ye may understand, and prepare your minds for the morrow” ([[3 Ne. 17:2–3]]). To the early Saints He said, “ye cannot bear all things now; ye must grow in grace and in the knowledge of the truth” ([[D&C 50:40]]), and, “ye cannot bear all things now; nevertheless, be of good cheer, for I will lead you along” ([[D&C 78:18]]). Revelation comes as His disciples grow able to receive it.
    sources: [lds-scriptures]
  - ref: 13
    phrase: he will guide you into all truth
    kind: christ
    title: He will guide you into all truth
    body: |
      The many things the disciples could not bear (verse 12) are the things of Christ Himself, and the Spirit will lead them into those things. The Spirit's teaching is trustworthy for the same reason the Son's is. He “shall not speak of himself” but speaks what He hears, as the Son does nothing of Himself ([[John 5:19]]), and unlike the devil, who “speaketh of his own” ([[John 8:44]]).

      “He will shew you things to come”: the Holy Ghost knows all things and can lead a person to know future events. The promise holds in every age, though its first fulfilment may be seen in the revelations given to the apostles, John's own Revelation among them. And whatever the Spirit shows, He shows of Christ: “He shall glorify me: for he shall receive of mine, and shall shew it unto you” (verse 14). What He brings is not a second revelation set beside Christ's but the things of Christ, fully given and imperfectly received until now, brought home to the heart.
    sources: [ellicott-john, bd-holy-ghost]
  - ref: 16
    phrase: 'A little while, and ye shall not see me: and again, a little while, and ye shall see me'
    kind: christ
    title: A little while
    body: |
      The disciples repeat the phrase to one another, puzzled (verses 17–19), and Jesus answers by telling them what the two little whiles will feel like rather than giving them a timetable. In the first, they will weep and mourn while the world rejoices: that is His death. After the second, their sorrow will be turned into joy: that rests on His resurrection, of which they would be witnesses. The chapter heading reads the verse the same way: He “tells of His death and resurrection.” John records the fulfilment on the day of the resurrection: “Then were the disciples glad, when they saw the Lord” ([[John 20:20]]).

      Jesus does not say only that joy will follow the sorrow. The sorrow itself will be turned into joy, because they will come to see that the parting had to come before the reunion (verse 7).
    sources: [talmage-jesus-christ-33, lds-scriptures, ellicott-john]
  - ref: 21
    phrase: A woman when she is in travail hath sorrow
    kind: symbol
    title: A woman when she is in travail
    body: |
      The image came from the prophets, who often compare Israel in distress to a woman in labour ([[Isa. 26:17–18]]; [[Isa. 66:7–8]]; [[Micah 4:9–10]]). Where scripture uses the birth pangs this way, as Micah does, it mostly speaks of the people passing through a crisis and then being delivered by the promised king, the Messiah. Jesus gives the image to the disciples. Their hour of pain is at hand, and it will pass.

      The point of the comparison is the passage from the worst suffering to the greatest joy, and it should not be pressed into an allegory. The woman's pain is real and so is her joy, but the joy is what lasts: she “remembereth no more the anguish.” So it will be with them: “your joy no man taketh from you” (verse 22).
    sources: [ellicott-john, sc-knowhy-93]
  - ref: 23
    phrase: in that day ye shall ask me nothing
    kind: words
    title: Ye shall ask me nothing
    body: |
      The verse uses “ask” twice, and the Greek has two different verbs. The second (*aiteō*) means to ask for something, to make a request. The first (*erōtaō*) usually means to ask a question, and the lexicon takes it that way here, though some read it as a request. On the first reading, “in that day” the Spirit will so light their minds that they will no longer need to question Jesus about what He means, as they have done all evening (verses 17–19). The Joseph Smith Translation, as the footnote gives it, carries the clause on: they will ask Him “nothing but it shall be done unto you.” That makes the first “ask” a request as well, and the clause a promise like the one that follows.

      On any of these readings, the verse goes on to the greater change, their access to the Father. They will go to the Father in prayer directly, in the name of the Son. To ask in His name is more than a form of words (see the note on [[John 14:13]]). They have not yet done that (verse 24), because the Spirit, by whom their wills and prayers would become His, had not yet come.
    sources: [thayer, ellicott-john, lds-scriptures, talmage-jesus-christ-33]
  - ref: 25
    phrase: I shall shew you plainly of the Father
    kind: words
    title: Plainly of the Father
    body: |
      The “proverbs” are figures of speech, and “these things” are what He has just said from verse 16 on: the little while, the woman in labour. Much of His teaching would stay figurative to the disciples until the Spirit brought it back to their minds and opened them to its meaning, as His words about the temple of His body became clear only after He rose ([[John 2:19–22]]). The time when He will speak “plainly” seems to be the time when He is with them through the Spirit.

      The disciples think that time has already come: “Lo, now speakest thou plainly” (verses 29–30). Jesus's answer, “Do ye now believe?”, need not be a question. It can be read as a statement, “Now ye do believe,” with the warning that follows. He does not doubt that they believe ([[John 17:8]]), but He knows the full light has not yet come, however sure they are that it has.
    sources: [ellicott-john, thayer]
  - ref: 26
    phrase: I say not unto you, that I will pray the Father for you
    kind: christ
    title: I say not unto you, that I will pray the Father for you
    body: |
      Jesus does not mean He will stop being their advocate. He means that once the Advocate has come, they will be able to pray to the Father in His name themselves, and verse 27 gives the reason: “the Father himself loveth you.” The Father loves them because they have loved the Son and believed that He was sent from God.

      The form of the words still leaves room for His pleading where it is needed: “if any man sin, we have an advocate with the Father, Jesus Christ the righteous” ([[1 Jn. 2:1]]). The access the disciples are promised rests on His mediation, and on the love of God shown in Him.
    sources: [ellicott-john]
  - ref: 32
    phrase: and yet I am not alone, because the Father is with me
    kind: prophets
    title: I am not alone
    body: |
      Jesus knows their new confidence will not last the night. They will be scattered “every man to his own,” and that same night, as Matthew records, He told them it was written, “I will smite the shepherd, and the sheep of the flock shall be scattered abroad” ([[Matt. 26:31]]). Then He adds, “yet I am not alone, because the Father is with me,” as He had said at the feast ([[John 8:29]]). His whole life had been lived in communion with the Father.

      Within a day He would cry from the cross, “My God, my God, why hast thou forsaken me?” ([[Matt. 27:46]]). The desertion of His friends He had foreseen in this verse; what He met on the cross was more. Even then “a perfect Father did not forsake His Son in that hour,” but briefly withdrew from Him the comfort of His Spirit, so that the sacrifice would be complete: to make an infinite Atonement, the Son had to feel what it is to die spiritually as well as physically. Only in that moment was the Father's presence hidden from Him.
    sources: [talmage-jesus-christ-33, ellicott-john, holland-none-with-him]
  - ref: 33
    phrase: be of good cheer; I have overcome the world
    kind: christ
    title: I have overcome the world
    body: |
      The last verse sums up the whole discourse: peace in Him, trouble in the world, and the trouble already overcome in Him. “I” is emphatic (“I have Myself overcome the world”), and the victory is spoken of as already won, though Gethsemane and the cross still lay ahead. The world He has overcome is the one that will hate and scatter them; the prince of it is already judged (verse 11).

      Having overcome the world Himself, He later asked each of His disciples to do the same: “I will that ye should overcome the world” ([[D&C 64:2]]). For a disciple it means not caring more for the things of this world than for the things of God, and “trusting the doctrine of Christ more than the philosophies of men.”
    sources: [ellicott-john, nelson-overcome-world]

christ: |
  In this chapter Jesus speaks as the one who came forth from the Father and is going back to Him (verse 28). His going is for the disciples' gain: by it the Comforter comes, their sorrow becomes a joy no one can take from them, and they may ask the Father in His name. Left alone by His friends, He is still not alone, and on the eve of Gethsemane and the cross He speaks of His victory as already won: “I have overcome the world.”

  Because Jesus Christ overcame the world, His disciples can too, and each time one of them follows the promptings of the Spirit, that disciple is overcoming the world. And because He walked His path utterly alone, they do not have to walk theirs that way: they “will never be left alone nor unaided, even if sometimes we may feel that we are.”

explore: |
  - **Alone, and not alone.** “None Were with Him” (general conference, April 2009) reads verse 32 with the cross and the Atonement.
  - **What it means to overcome the world.** “Overcome the World and Find Rest” (general conference, October 2022) builds on verse 33.
  - **The first promise of the Comforter.** [[John 14:15–31]], which this chapter takes up again.
  - **The prayer that follows.** [[John 17]], where Jesus asks the Father to keep in the world the disciples He leaves in it.

