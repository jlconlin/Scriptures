chapter: 16
title: I Have Overcome the World
tagline: On the night before His death Jesus finishes His farewell to the Eleven, warning them of persecution, promising the Comforter who will convict the world and guide them into all truth, foretelling a little while of sorrow that will turn to joy, and ending, as they are about to scatter, with “be of good cheer; I have overcome the world.”
when: 'In Jerusalem, on the night of the Last Supper, after Judas had gone out ([[John 13:30]])'

setting: |
  Chapter 16 is the last part of what Jesus taught the Eleven on the night of the Last Supper. The discourses and the prayer John records of that evening are told only in John. Within it the farewell discourses run from 14:1 to the end of this chapter, and the prayer of chapter 17 follows. At the end of chapter 14 Jesus had said, “Arise, let us go hence” ([[John 14:31]]); when the prayer is finished He goes out with His disciples across the brook Cedron to the garden ([[John 18:1]]).

  Chapters 14 and 16 are a pair. In both Jesus teaches why He must depart and answers the disciples' sorrow with the promise of the Comforter; between them stands the vine of chapter 15, the way they can abide in Him while He is absent. So chapter 16 takes up again what chapter 14 began: the Comforter ([[John 14:16–17]]; [[John 14:26]]), the “little while” ([[John 14:19]]), asking in His name ([[John 14:13–14]]), and peace ([[John 14:27]]). Its opening verses (1–4a) finish the warning that began at [[John 15:18]], about the hatred the disciples will meet in the world.

  The chapter heading names what is new: Jesus “discourses on the mission of the Holy Ghost,” tells of His death and resurrection, and says that He has overcome the world. Its close mirrors the end of chapter 13. There Peter's bold promise drew the prophecy of his denial ([[John 13:36–38]]); here, just when the disciples are sure they understand at last, Jesus foretells that they will all desert Him.

thread: |
  **Jesus is going away, and He tells the disciples why that is good for them.**

  They hear only the loss, and “sorrow hath filled your heart” (verse 6). He answers that His going is “expedient,” to their advantage (verse 7). Because He goes, the Comforter will come to them: He will convict the world and teach the disciples what they cannot yet bear (verses 7–15). His going to the Father brings a little while of sorrow, and the sorrow will be turned into a joy no man can take (verses 16–22). And with Him gone to the Father, they will ask the Father themselves, in His name, and find that “the Father himself loveth you” (verses 23–27).

  Verse 28 puts the whole in one sentence: “I came forth from the Father, and am come into the world: again, I leave the world, and go to the Father.” The disciples think they understand at last: “Lo, now speakest thou plainly” (verses 29–30). Jesus answers with the hour, now come, when they will be scattered and leave Him alone (verse 32). Yet the last word is His: “I have overcome the world.”

sections:
  - range: 1-4
    heading: Warned beforehand
    plain: |
      “I have told you these things so that you will not fall away. They will put you out of the synagogues. Indeed, the time is coming when whoever kills you will think he is offering a service of worship to God. They will do these things because they have not known the Father or me. I have told you these things so that when the time comes you will remember that I told you. I did not tell you this at the beginning, because I was with you.”
  - range: 5-15
    heading: The Spirit of truth
    plain: |
      “But now I am going to Him who sent me, and none of you asks me, ‘Where are you going?’ Because I have told you these things, sorrow has filled your hearts. Yet I tell you the truth: it is for your good that I go away. If I do not go away, the Comforter will not come to you; but if I go, I will send Him to you. When He comes, He will convict the world of sin, of righteousness, and of judgment: of sin, because they do not believe on me; of righteousness, because I am going to my Father and you will see me no more; of judgment, because the prince of this world has been judged.

      “I have many more things to tell you, but you cannot bear them now. When the Spirit of truth comes, He will guide you into all truth. He will not speak on His own, but will speak what He hears, and He will tell you of things to come. He will glorify me, for He will take what is mine and make it known to you. All that the Father has is mine; that is why I said He will take what is mine and make it known to you.”
  - range: 16-24
    heading: A little while
    plain: |
      “In a little while you will not see me, and again in a little while you will see me, because I am going to the Father.” Some of His disciples said to one another, “What does he mean by telling us, ‘A little while, and you will not see me, and again a little while, and you will see me,’ and, ‘Because I am going to the Father’? What is this ‘little while’? We do not understand what he is saying.”

      Jesus knew they wanted to ask Him, and He said, “Are you asking one another what I meant? Truly, truly, I tell you, you will weep and mourn, but the world will rejoice. You will be sorrowful, but your sorrow will be turned into joy. A woman in labour has sorrow, because her hour has come; but when her child is born she no longer remembers the anguish, for joy that a child has been born into the world. So you have sorrow now. But I will see you again, and your hearts will rejoice, and no one will take your joy from you. On that day you will not ask me anything. Truly, truly, I tell you, whatever you ask the Father in my name, He will give it to you. Until now you have asked nothing in my name. Ask, and you will receive, so that your joy may be full.”
  - range: 25-33
    heading: I have overcome the world
    plain: |
      “I have told you these things in figures of speech. The time is coming when I will no longer speak to you in figures, but will tell you plainly about the Father. On that day you will ask in my name. I do not say that I will ask the Father on your behalf, for the Father Himself loves you, because you have loved me and have believed that I came from God. I came from the Father and have come into the world; now I am leaving the world and going to the Father.”

      His disciples said, “Now you are speaking plainly and not in a figure of speech. Now we are sure that you know all things and have no need for anyone to question you. By this we believe that you came from God.” Jesus answered them, “So now you believe? Look, the hour is coming, indeed it has come, when you will be scattered, each to his own, and will leave me alone. Yet I am not alone, because the Father is with me. I have told you these things so that in me you may have peace. In the world you will have tribulation. But take heart: I have overcome the world.”

notes:
  - ref: 1
    phrase: that ye should not be offended
    kind: words
    title: That ye should not be offended
    body: |
      “Offended” here has nothing to do with hurt feelings. The Greek verb means to be made to stumble: to begin to distrust and desert someone you ought to trust and obey, and so to fall away. Jesus is warning the Eleven, in plain words and not for the first time that evening, that the world will hate them and kill them, so that the persecution will not knock their faith over when it comes: “that when the time shall come, ye may remember that I told you of them” (verse 4).

      Why had He not told them “at the beginning”? Verse 4 says only, “because I was with you.” While He was with them, the hatred of His enemies was aimed at Him; once He was gone, they would stand in His place. He had said as much a few verses before: “If the world hate you, ye know that it hated me before it hated you,” and “If they have persecuted me, they will also persecute you” ([[John 15:18]]; [[John 15:20]]).
    sources: [thayer, jackson-war-peace, ellicott-john, lds-scriptures]
  - ref: 2
    phrase: whosoever killeth you will think that he doeth God service
    kind: history
    title: He doeth God service
    body: |
      Being put out of the synagogue was the ban already threatened in Jerusalem against anyone who confessed Jesus (see the note on [[John 9:22]]). Jesus says it will go further: they will be killed by men who think they are doing God a favor, and the Greek says more than the English. “Doeth” is the verb used of offering sacrifices and gifts to God, and “service” is the word for the service of worship under the law; together they mean offering a sacrifice in service. The killer will think he is bringing God an offering. The church's first years bore it out, and Paul, looking back on his own persecution of the Saints, described just such a man: “I verily thought with myself, that I ought to do many things contrary to the name of Jesus of Nazareth,” and “when they were put to death, I gave my voice against them” ([[Acts 26:9–10]]).

      Verse 3 gives the reason, as Jesus had a few verses before (“because they know not him that sent me,” [[John 15:21]]). Such men “have not known the Father, nor me.” They think they are serving God, but He is a God they do not know.
    sources: [thayer, jackson-war-peace, ellicott-john, lds-scriptures]
  - ref: 5
    phrase: none of you asketh me, Whither goest thou?
    kind: words
    title: None of you asketh me
    body: |
      Peter had asked exactly this a few hours before, “Lord, whither goest thou?” ([[John 13:36]]), and Thomas had come close to it ([[John 14:5]]), so Jesus cannot mean the words were never said. What He remarks on is that no one is asking now, and verse 6 says what has taken the question's place: “because I have said these things unto you, sorrow hath filled your heart.” They hear only the loss. The rest of the chapter answers their sorrow with the promise of the Comforter, and answers the question they no longer ask: He is going to the Father (verses 10, 16, 28), and that is why the going is good news.
    sources: [brouwer-farewell, huntsman-lamb-of-god, lds-scriptures]
  - ref: 7
    phrase: It is expedient for you that I go away
    kind: christ
    title: It is expedient for you that I go away
    body: |
      The Comforter, the Holy Ghost (on the word, see the note on [[John 14:16]]), will be sent to the disciples because Jesus is going. Across the evening's promises He is their advocate and teacher, a witness, a prosecutor of the world, and a revealer ([[John 14:26]]; [[John 15:26]]; verses 8–15).

      Why must Jesus leave first? The scriptures do not fully explain why the gift of the Holy Ghost was withheld while He was on earth (see the note on [[John 7:39]]), but John gives the order: “the Holy Ghost was not yet given; because that Jesus was not yet glorified.” Peter said at Pentecost that it had come in that order: “being by the right hand of God exalted, and having received of the Father the promise of the Holy Ghost, he hath shed forth this, which ye now see and hear” ([[Acts 2:33]]). The Spirit's coming rests on Christ's going to the Father.
    sources: [huntsman-lamb-of-god, bd-holy-ghost, lds-scriptures]
  - ref: 8
    phrase: he will reprove the world of sin, and of righteousness, and of judgment
    kind: words
    title: Of sin, and of righteousness, and of judgment
    body: |
      “Reprove” is too weak. The verb means to convict: to prove someone wrong, usually to his shame. The Comforter, who comes to the disciples as their advocate, comes to the world as its prosecutor.

      Verses 9–11 name the three counts. *Of sin, because they believe not on me*: the first charge is the world's unbelief in Him. *Of righteousness, because I go to my Father*: the Pharisees called Jesus a sinner ([[John 9:24]]), He was handed to Pilate as a malefactor ([[John 18:30]]), and on one reading His return to the Father is heaven's verdict that He was righteous. *Of judgment, because the prince of this world is judged*: the same title stands in [[John 14:30]], where the Joseph Smith Translation reads, “The prince of darkness, or Satan, is of this world” (JST John 14:30). The Greek says “has been judged,” a judgment already passed: Jesus speaks of the case against him as decided.
    sources: [thayer, huntsman-lamb-of-god, ellicott-john, lds-scriptures, greek-nt]
  - ref: 12
    phrase: ye cannot bear them now
    kind: scripture
    title: Ye cannot bear them now
    body: |
      Jesus was not holding back out of reluctance. He had just told them that He made known to them all He had heard from the Father ([[John 15:15]]). The limit was in them, not in Him: what they could not bear now, the Spirit of truth would teach them later (verse 13).

      The Lord told the early Saints the same, and what they lacked: “ye cannot bear all things now; ye must grow in grace and in the knowledge of the truth” ([[D&C 50:40]]). Revelation comes as His disciples grow able to receive it.
    sources: [lds-scriptures]
  - ref: 13
    phrase: he will guide you into all truth
    kind: christ
    title: He will guide you into all truth
    body: |
      The Spirit would teach the disciples what they could not learn from Jesus while He was with them (verse 12), and the promise was kept. After they received the Holy Ghost the apostles who had been uncertain and confused became men with a clear vision of where the Church was going, and the Spirit guided them into truth they had not yet grasped, as when Peter learned that “God is no respecter of persons” and opened the gospel to the Gentiles ([[Acts 10:34–35]]).

      “He will shew you things to come”: the Holy Ghost knows all things and can lead a person to know future events. What He teaches is not His own: He “shall not speak of himself; but whatsoever he shall hear, that shall he speak,” and verses 14–15 say whose it is. “He shall glorify me: for he shall receive of mine, and shall shew it unto you,” and all that the Father has is the Son's.
    sources: [jackson-war-peace, bd-holy-ghost, lds-scriptures]
  - ref: 16
    phrase: 'A little while, and ye shall not see me: and again, a little while, and ye shall see me'
    kind: christ
    title: A little while
    body: |
      The disciples repeat the phrase to one another, puzzled (verses 17–19), and Jesus does not define it; He tells them what the two little whiles will bring. In the first, they will weep and lament while the world rejoices; after the second, “I will see you again, and your heart shall rejoice” (verse 22). In this chapter He “tells of His death and resurrection”: the first little while ends at His death, the second at His rising. John records the fulfilment on the day of the resurrection: “Then were the disciples glad, when they saw the Lord” ([[John 20:20]]).
    sources: [lds-scriptures]
  - ref: 21
    phrase: A woman when she is in travail hath sorrow
    kind: symbol
    title: A woman when she is in travail
    body: |
      Childbirth is an image of redemption in scripture: the prophets use it ([[Isa. 37:3]]; [[Micah 4:9–10]]), and so does Jesus here. Most such passages speak of the people of Israel passing through a time of crisis, compared to a woman in the pain of childbirth, and then being delivered by the promised king, the Messiah. Jesus gives the image to the disciples: “ye now therefore have sorrow” (verse 22), and their sorrow will end as hers does.

      The comparison dwells on what outlasts the pain. The woman's anguish is real, but once the child is born “she remembereth no more the anguish, for joy that a man is born into the world.” So it will be with them: “your joy no man taketh from you” (verse 22).
    sources: [sc-knowhy-93]
  - ref: 23
    phrase: in that day ye shall ask me nothing
    kind: words
    title: Ye shall ask me nothing
    body: |
      The verse uses “ask” twice, and the Greek has two different verbs. The second (*aiteō*) means to ask for something, to make a request. The first (*erōtaō*) can mean either to ask a question or to make a request. The Joseph Smith Translation carries the clause on, so that it reads as a promise: they will ask Him “nothing but it shall be done unto you.” Read in the other sense, to question, it means that “in that day” they will no longer need to question Jesus about what He means, as they had been wanting to do (verse 19).

      Either way, the verse goes on to the greater change: they will ask the Father Himself, in the name of the Son. To ask in His name is more than a form of words (see the note on [[John 14:13]]). “Hitherto have ye asked nothing in my name” (verse 24).
    sources: [thayer, lds-scriptures, bd-prayer]
  - ref: 25
    phrase: I shall shew you plainly of the Father
    kind: words
    title: Plainly of the Father
    body: |
      The “proverbs” are figurative sayings, words that shadow forth a truth rather than state it. Much of what Jesus said the disciples understood only later. “These things understood not his disciples at the first: but when Jesus was glorified, then remembered they” ([[John 12:16]]), and it was the Holy Ghost who brought His words back to their memory, as He had promised ([[John 14:26]]). On one reading, the time when He will speak “plainly” is the time when He is with them through the Spirit.

      The disciples think that time has already come: “Lo, now speakest thou plainly, and speakest no proverb” (verse 29). Jesus answers their certainty with the hour, now come, when they will be scattered (verse 32).
    sources: [thayer, jackson-war-peace, ellicott-john, lds-scriptures]
  - ref: 26
    phrase: I say not unto you, that I will pray the Father for you
    kind: christ
    title: I say not unto you, that I will pray the Father for you
    body: |
      Jesus does not mean He will stop being their advocate. That same night He prays for them (“I pray for them,” [[John 17:9]]), and to the Saints of this dispensation He is still “the advocate with the Father, who is pleading your cause before him” ([[D&C 45:3]]). He does not speak of praying for them because they will be able to pray to the Father in His name themselves, though the form of His words leaves room for His prayer if it is needed. Verse 27 gives the reason: “the Father himself loveth you, because ye have loved me, and have believed that I came out from God.”

      Their access still rests on Him. They come in His name (verse 26), and “if any man sin, we have an advocate with the Father, Jesus Christ the righteous” ([[1 Jn. 2:1]]). His plea, as the Doctrine and Covenants gives it, is His own suffering: “Father, behold the sufferings and death of him who did no sin… Wherefore, Father, spare these my brethren that believe on my name” ([[D&C 45:4–5]]).
    sources: [ellicott-john, lds-scriptures]
  - ref: 32
    phrase: and yet I am not alone, because the Father is with me
    kind: prophets
    title: I am not alone
    body: |
      Jesus knows their new confidence will not last the night. They will be scattered “every man to his own,” and that same night, as Matthew records, He told them it was written, “I will smite the shepherd, and the sheep of the flock shall be scattered abroad” ([[Matt. 26:31]]). Then He adds, “yet I am not alone, because the Father is with me,” as He had said at the feast ([[John 8:29]]).

      Within a day He would cry from the cross, “My God, my God, why hast thou forsaken me?” ([[Matt. 27:46]]). The desertion of His friends He had foreseen in this verse; what He met on the cross was more, and an apostle has testified to what it was. Even then “a perfect Father did not forsake His Son in that hour,” but, as that apostle taught, briefly withdrew from Him the comfort of His Spirit, so that the sacrifice would be complete: for the Atonement to be infinite, the Son had to feel what it is to die spiritually as well as physically.
    sources: [holland-none-with-him, lds-scriptures]
  - ref: 33
    phrase: be of good cheer; I have overcome the world
    kind: christ
    title: I have overcome the world
    body: |
      Jesus says “I have overcome,” as of a victory already won, though He spoke these words before the agony of Gethsemane and Calvary. The world He has overcome is the one that will hate and scatter them; the prince of it is already judged (verse 11).

      Having overcome the world Himself, He later asked each of His disciples to do the same: “I will that ye should overcome the world” ([[D&C 64:2]]). For a disciple it means not caring more for the things of this world than for the things of God, and “trusting the doctrine of Christ more than the philosophies of men.”
    sources: [nelson-overcome-world]

christ: |
  In this chapter Jesus speaks as the one who came forth from the Father and is going back to Him (verse 28). His going is for the disciples' gain: by it the Comforter comes, their sorrow becomes a joy no one can take from them, and they may ask the Father in His name. Left alone by His friends, He is still not alone, and on the eve of Gethsemane and the cross He speaks of His victory as already won: “I have overcome the world.”

  Because Jesus Christ overcame the world, His disciples can too, and each time one of them follows the promptings of the Spirit, that disciple is overcoming the world. And because He walked the last of His path deserted by His friends and, for a moment, without the comfort of the Spirit, they do not have to walk theirs alone: they “will never be left alone nor unaided, even if sometimes we may feel that we are.”

explore: |
  - **Alone, and not alone.** “None Were with Him” (general conference, April 2009) reads verse 32 with the cross and the Atonement.
  - **What it means to overcome the world.** “Overcome the World and Find Rest” (general conference, October 2022) builds on verse 33.
  - **The first promise of the Comforter.** [[John 14:15–31]], which this chapter takes up again.
  - **The prayer that follows.** [[John 17]], where Jesus asks the Father to keep in the world the disciples He leaves in it.

