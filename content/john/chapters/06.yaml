chapter: 6
title: The Bread of Life
tagline: Jesus feeds five thousand, walks on the sea, and in the synagogue at Capernaum declares Himself the bread of life; many disciples turn back, and Peter answers for the Twelve.
when: 'Near a Passover (verse 4): a mountain across the Sea of Galilee, the sea by night, and the next day Capernaum and its synagogue'

setting: |
  John 6 opens with two stories the other Gospels also tell. The feeding of the five thousand is the only miracle all four Gospels record, and Matthew and Mark also follow it with Jesus walking on the sea ([[Matt. 14:13–33]]; [[Mark 6:31–52]]). What comes after, the sermon on the bread of life and the disciples' answer to it, is John's alone.

  The chapter stands among the feasts of chapters 5–10. John dates it by the Passover (verse 4), one of three he names ([[John 2:13]]; [[John 11:55]]), and that count is why the ministry in John is reckoned at two or three years, depending on whether the unnamed feast of [[John 5:1]] was a Passover too. Chapter 5 was in Jerusalem; chapter 6 is in Galilee, first on the hills across the lake and then at Capernaum, where the discourse ends in the synagogue (verse 59).

  The sermon has three audiences in turn: the crowd that ate the loaves (verses 22–40), a group John calls “the Jews” (41–59), and the disciples and the Twelve (60–71). Each misunderstands in some way who He is or what He has come to do, and He answers each. One more thing sets the chapter apart: John's account of the Last Supper tells no institution of the sacrament, and it is here that John records Jesus speaking of eating His flesh and drinking His blood.

thread: |
  **Bread that perishes and bread that endures.** The crowd eats its fill of the loaves and draws the wrong conclusion: here is a king who can feed them, a new Moses who can bring back the manna. Jesus withdraws from the crown they would force on Him, and that night He comes to His disciples over the water with the words “It is I.” The next day He leads the crowd from the loaves to Himself: the true bread from heaven is not something He gives but who He is, and the bread He will give is His flesh, given for the life of the world. Each step costs Him hearers. The crowd wants the bread without the giver; the synagogue hearers balk at His claim to have come down from heaven, and still more at flesh and blood; at last many disciples find the saying too hard and go back. The chapter that began with five thousand following Him ends with many going back, and with Peter answering for the Twelve, one of whom is a traitor: “Lord, to whom shall we go?”

sections:
  - range: 1-14
    heading: The feeding of the five thousand
    plain: |
      After this Jesus crossed the Sea of Galilee, also called the Sea of Tiberias. A great crowd followed Him, because they had seen the miracles He did for the sick. Jesus went up on a mountain and sat there with His disciples. The Passover, a feast of the Jews, was near. When Jesus looked up and saw a great crowd coming toward Him, He said to Philip, “Where shall we buy bread for these people to eat?” He said this to test him, for He Himself knew what He would do. Philip answered, “Two hundred denarii worth of bread would not be enough for each of them to have even a little.” Another of His disciples, Andrew, Simon Peter's brother, said to Him, “There is a boy here who has five barley loaves and two small fish, but what are they among so many?” Jesus said, “Have the people sit down.” There was plenty of grass in that place, so they sat down, the men numbering about five thousand. Jesus took the loaves, gave thanks, and distributed them to the disciples, and the disciples to those who were seated, and the same with the fish, as much as they wanted. When they were full, He told His disciples, “Gather up the pieces left over, so that nothing is lost.” So they gathered them, and filled twelve baskets with the pieces of the five barley loaves that were left over by those who had eaten. When the people saw the miracle Jesus had done, they said, “This is truly the Prophet who is to come into the world.”
  - range: 15-21
    heading: Jesus walks on the sea
    plain: |
      Jesus, knowing that they were about to come and seize Him by force to make Him king, withdrew again to the mountain by Himself. When evening came, His disciples went down to the sea, got into a boat, and set out across the sea toward Capernaum. It was now dark, and Jesus had not yet come to them. A strong wind was blowing and the sea grew rough. When they had rowed about twenty-five or thirty furlongs, they saw Jesus walking on the sea and coming near the boat, and they were afraid. But He said to them, “It is I; do not be afraid.” Then they gladly took Him into the boat, and at once the boat reached the land they were heading for.
  - range: 22-40
    heading: The bread from heaven
    plain: |
      The next day the crowd that had stayed on the other side of the sea saw that there had been only one boat there, and that Jesus had not gone into it with His disciples, who had left without Him. (Other boats from Tiberias had come near the place where they ate the bread after the Lord gave thanks.) So when the crowd saw that neither Jesus nor His disciples were there, they got into the boats and went to Capernaum looking for Jesus. When they found Him on the other side of the sea, they asked Him, “Rabbi, when did you get here?” Jesus answered, “Truly, truly, I tell you, you are looking for me, not because you saw the miracles, but because you ate the loaves and were filled. Do not work for the food that perishes, but for the food that lasts to eternal life, which the Son of man will give you; for on Him God the Father has set His seal.” They asked Him, “What must we do to do the works of God?” Jesus answered, “This is the work of God: that you believe in the One He has sent.” So they said to Him, “What sign will you do, then, so that we may see it and believe you? What work will you do? Our fathers ate manna in the wilderness; as it is written, ‘He gave them bread from heaven to eat.’” Jesus said to them, “Truly, truly, I tell you, it was not Moses who gave you the bread from heaven, but my Father gives you the true bread from heaven. For the bread of God is He who comes down from heaven and gives life to the world.” “Lord,” they said, “give us this bread always.” Jesus said to them, “I am the bread of life. Whoever comes to me will never hunger, and whoever believes in me will never thirst. But as I told you, you have seen me and still do not believe. Everyone the Father gives me will come to me, and whoever comes to me I will never turn away. For I have come down from heaven, not to do my own will but the will of Him who sent me. And this is the will of the Father who sent me: that I should lose none of all He has given me, but raise it up at the last day. This is the will of Him who sent me: that everyone who sees the Son and believes in Him should have eternal life, and I will raise him up at the last day.”
  - range: 41-59
    heading: His flesh and His blood
    plain: |
      Then the Jews murmured against Him because He said, “I am the bread that came down from heaven.” They said, “Is this not Jesus, the son of Joseph, whose father and mother we know? How can He now say, ‘I have come down from heaven’?” Jesus answered them, “Stop murmuring among yourselves. No one can come to me unless the Father who sent me draws him, and I will raise him up at the last day. It is written in the prophets, ‘And they shall all be taught by God.’ Everyone who has heard and learned from the Father comes to me. Not that anyone has seen the Father, except the One who is from God; He has seen the Father. Truly, truly, I tell you, whoever believes in me has eternal life. I am the bread of life. Your fathers ate the manna in the wilderness, and they died. This is the bread that comes down from heaven, so that anyone may eat of it and not die. I am the living bread that came down from heaven. If anyone eats of this bread, he will live forever; and the bread that I will give is my flesh, which I will give for the life of the world.” Then the Jews argued sharply among themselves: “How can this man give us His flesh to eat?” Jesus said to them, “Truly, truly, I tell you, unless you eat the flesh of the Son of man and drink His blood, you have no life in you. Whoever eats my flesh and drinks my blood has eternal life, and I will raise him up at the last day. For my flesh is true food, and my blood is true drink. Whoever eats my flesh and drinks my blood abides in me, and I in him. As the living Father sent me and I live because of the Father, so whoever feeds on me will live because of me. This is the bread that came down from heaven, not like the manna your fathers ate, and died; whoever eats this bread will live forever.” He said these things as He taught in the synagogue in Capernaum.
  - range: 60-71
    heading: Many turn back; Peter's answer
    plain: |
      When many of His disciples heard this, they said, “This is a hard teaching. Who can accept it?” Jesus, knowing in Himself that His disciples were murmuring about it, said to them, “Does this offend you? What if you were to see the Son of man ascend to where He was before? It is the Spirit who gives life; the flesh is of no help at all. The words I have spoken to you are spirit and life. But there are some of you who do not believe.” For Jesus knew from the beginning who did not believe and who would betray Him. And He said, “That is why I told you that no one can come to me unless it is granted him by my Father.” From then on many of His disciples turned back and no longer walked with Him. So Jesus said to the Twelve, “Do you want to go away as well?” Simon Peter answered Him, “Lord, to whom would we go? You have the words of eternal life. And we have believed, and we know, that you are the Christ, the Son of the living God.” Jesus answered them, “Did I not choose you, the Twelve? And one of you is a devil.” He meant Judas Iscariot, the son of Simon, for he, one of the Twelve, was going to betray Him.

notes:
  - ref: 4
    phrase: the passover, a feast of the Jews, was nigh
    kind: history
    title: The Passover was nigh
    body: |
      John's note of the season sets the chapter against the first Passover and the Exodus that followed it. Jesus goes up into a mountain in a wilderness place, as Israel came after the Passover through the wilderness to Sinai, where the law was given ([[Ex. 19:1–3]]). He feeds a multitude in the wilderness and that night crosses the sea, walking on it where Israel had passed through the Red Sea on dry ground ([[Ex. 14:21–22]]; see the note on verse 20). The next day the crowd itself brings up the manna (verse 31), and the sermon that follows turns on it.

      This is the one Passover in John that Jesus does not keep in Jerusalem, and the setting prepares the hardest words of the chapter. At the Passover a lamb was killed, its blood warded off death, and its flesh was eaten in a festive meal ([[Ex. 12:6–8, 13]]). When Jesus speaks of His flesh given “for the life of the world” and of eating His flesh and drinking His blood (verses 51–56), that is the image the season sets before His hearers, and it ties this scene to the last Passover of His ministry, when He would die.
    sources: [sc-knowhy-664, huntsman-bread-of-life]
  - ref: 7
    phrase: Two hundred pennyworth of bread
    kind: words
    title: Two hundred pennyworth
    body: |
      The King James “penny” is the Roman *denarius*, a silver coin. A denarius was a laborer's pay for a day: in the parable of the vineyard the householder “agreed with the labourers for a penny a day” ([[Matt. 20:2]]). Philip's sum is about two hundred days' wages, and he says it still would not give each person a little. Jesus asked him “to prove him,” to test him (verse 6), already knowing what He would do.
    sources: [thayer, lds-scriptures]
  - ref: 9
    phrase: five barley loaves, and two small fishes
    kind: history
    title: A lad's barley loaves
    body: |
      Only John says the loaves were barley and that they belonged to a boy; in Matthew, Mark and Luke the disciples report only five loaves and two fishes ([[Matt. 14:17]]; [[Mark 6:38]]; [[Luke 9:13]]). Barley bread and fish were the everyday food of the poorer people of the region, and the five loaves and two little fish, probably salted or pickled, were likely the boy's lunch, all he had. That is what Jesus takes and blesses.

      The miracle was creative power: the twelve baskets of pieces left over (verse 13) were more than the whole of what the boy had brought. Gathering them up “that nothing be lost” (verse 12) was a lesson against waste.
    sources: [van-dyke-miracles-john, talmage-jesus-christ-21, lds-scriptures]
  - ref: 14
    phrase: that prophet that should come into the world
    kind: scripture
    title: That prophet
    body: |
      “That prophet” is the one Moses promised: “The Lord thy God will raise up unto thee a Prophet from the midst of thee, of thy brethren, like unto me; unto him ye shall hearken” ([[Deut. 18:15]]). The crowd had just been fed bread in the wilderness, as Israel had been fed under Moses, and they took the miracle as His sign: here was the new Moses.

      They were right about the title. The risen Lord claimed it at Bountiful ([[3 Ne. 20:23]]; see the note on [[John 1:21]]), in the same discourse in which He again gave a multitude bread they had not brought ([[3 Ne. 20:6–7]]). What they expected such a prophet to do, the next verse shows.
    sources: [sc-knowhy-664, lds-scriptures]
  - ref: 15
    phrase: they would come and take him by force, to make him a king
    kind: history
    title: To make him a king
    body: |
      John alone tells that the crowd meant to make Jesus king by force, and that this is why He withdrew; Matthew and Mark say only that He sent the multitude away and went up into a mountain to pray ([[Matt. 14:23]]; [[Mark 6:46]]). A prophet like Moses who could feed thousands in the wilderness fit what many hoped for in a Messiah: a tradition had arisen that the Messiah, as a second deliverer, would bring manna again as Moses had. At least since the time of the Maccabees that hope had taken a strongly political shape: a ruler who would free them from Herod's house and from Rome. Jesus would not be that kind of king, and He left rather than be made one. Before Pilate He gave the reason in a sentence: “My kingdom is not of this world” ([[John 18:36]]).

      The walking on the sea follows at once, and it corrects the same mistake. The feeding could be read too narrowly, as the sign of a king and no more; what the disciples saw on the water showed He was far more than a king.
    sources: [huntsman-bread-of-life, lds-scriptures]
  - ref: 20
    phrase: It is I; be not afraid
    kind: christ
    title: It is I
    body: |
      What the King James renders “It is I” is two Greek words, *egō eimi*, “I am” or “I am he.” Read with [[Ex. 3:14]], where the Lord gave Moses His name as “I AM THAT I AM,” the words can recall the divine name, so that Jesus was saying not only “It is I” but “I AM; be not afraid.” The same words return, with no predicate, at [[John 8:58]]. Spoken on the water, they fit the act: Jesus has just shown a power over the sea that the Old Testament gives to God alone, who “treadeth upon the waves of the sea” ([[Job 9:8]]). Read so, the words that reassured frightened men in a boat at night also said who He was.
    sources: [sc-knowhy-664, greek-nt, keller-jesus-jehovah]
  - ref: 26
    phrase: Ye seek me, not because ye saw the miracles, but because ye did eat of the loaves, and were filled
    kind: scripture
    title: Why they sought Him
    body: |
      Jesus tells the crowd plainly why they have followed Him across the lake: not for what the miracles showed but because they had eaten the loaves and were filled. Joseph Smith's translation names one more thing they had not come for: they sought Him “not because ye desire to keep my sayings, neither because ye saw the miracles” (JST John 6:26, in the footnote). That rebuke, a summons to respond to Him and not only to eat, is what prompts their next question. Told to labour for the food “which endureth unto everlasting life” (verse 27), they ask what work God requires, and He answers that the work of God is to believe on the One He has sent (verse 29): their question was about something to do, His answer about someone to trust.
    sources: [huntsman-bread-of-life, swift-bread-life-dialogue, lds-scriptures]
  - ref: 27
    phrase: for him hath God the Father sealed
    kind: words
    title: Him hath God the Father sealed
    body: |
      A seal could close, hide or mark; one use was to confirm or authenticate, as a ruler's ring set on a document made it his ([[Esth. 8:8]]). Here it means that the Father has attested the Son: by His testimony He has shown Him to be who He says He is. The Son of man can give food that lasts because the Father has put His own seal on Him.
    sources: [thayer]
  - ref: 30
    phrase: What sign shewest thou then, that we may see, and believe thee?
    kind: history
    title: What sign shewest thou?
    body: |
      The demand is strange from people who had eaten the loaves the day before, and verse 31 shows what lies behind it. Moses gave their fathers bread from heaven, and not for one meal but for forty years ([[Ex. 16:35]]). They seem still to be thinking of food, and to press Jesus to prove He is sent from God by doing as much. Even “Lord, evermore give us this bread” (verse 34) most likely asks for bread that would feed them as the manna fed their fathers.

      Jesus answers twice. It was not Moses who gave the manna but the Father, and the Father now gives “the true bread from heaven” (verse 32). And the manna did not keep anyone alive for ever: “Your fathers did eat manna in the wilderness, and are dead” (verse 49). At the close of the discourse He comes back to the same contrast, so that the whole sermon sets what they asked for against what He offers (verse 58).
    sources: [swift-bread-life-dialogue, lds-scriptures]
  - ref: 33
    phrase: he which cometh down from heaven
    kind: words
    title: He which cometh down
    body: |
      The Greek *ho katabainōn* can be read two ways: “he who comes down” or, agreeing with “bread,” “that which comes down.” The King James takes it as “he,” but the crowd may well have heard “that which.” Bread was an old figure for God's word: the prophets speak of eating it ([[Jer. 15:16]]), and Moses taught that “man doth not live by bread only, but by every word that proceedeth out of the mouth of the Lord” ([[Deut. 8:3]]); later Jewish teaching took the manna as a figure of the Law. Hearers who took it so would understand the bread of God as the Law given from heaven.

      Jesus removes the ambiguity in His next words: “I am the bread of life” (verse 35). The bread from heaven is not a teaching He brings, as Moses brought the Law. It is Himself.
    sources: [huntsman-bread-of-life, greek-nt]
  - ref: 35
    phrase: I am the bread of life
    kind: christ
    title: I am the bread of life
    body: |
      This is the first of seven sayings in John where Jesus joins “I am” to a title or image that reflects His divine role (the light, the door, the good shepherd and the rest come later), and the image is the plainest food there is. Nothing is more basic to life than bread and water, and the promise that follows doubles it: whoever comes to Him “shall never hunger,” whoever believes on Him “shall never thirst.”

      The risen Lord made the same promise at Bountiful, and there He made it over the sacrament. When He had given the multitude bread and wine that neither they nor His disciples had brought, He said, “He that eateth this bread eateth of my body to his soul; and he that drinketh of this wine drinketh of my blood to his soul; and his soul shall never hunger nor thirst, but shall be filled” ([[3 Ne. 20:8]]). And the multitude “were filled with the Spirit” ([[3 Ne. 20:9]]). There the promise of never hungering or thirsting is tied to the ordinance itself, the “fulfillment of the great sacramental promise to men and women in all ages.”
    sources: [huntsman-gospel-john, gong-bread-of-life, lds-scriptures]
  - ref: 41
    phrase: The Jews then murmured at him
    kind: history
    title: The Jews murmured
    body: |
      Until now John has called Jesus's hearers “the multitude,” “the company” and “the people.” Here, without a change of place being told, he calls them “the Jews,” and the tone sharpens at once. The shift seems to mark a new and more hostile audience in the synagogue at Capernaum, where verse 59 says the discourse was given, though the crowd and many of His disciples may well have followed Him in. The crowd and the disciples were Jews as well, so the word here names a narrower group, generally taken to be the religious leaders, national or local, who increasingly opposed Him. From John's first chapters the term has had more to do with refusing Jesus than with national or religious identity.

      What they refused was the claim itself. “Is not this Jesus, the son of Joseph?” answers “I came down from heaven” by naming a human father, which suggests they understood what He was claiming: to be the Son of the Father. Their murmuring echoes Israel's in the wilderness, when “the whole congregation of the children of Israel murmured against Moses and Aaron” and Moses told them, “your murmurings are not against us, but against the Lord” ([[Ex. 16:2]]; [[Ex. 16:8]]). Like their fathers who ate manna, they were keeping themselves from the One who fed them, which gives an edge to “Your fathers did eat manna in the wilderness, and are dead” (verse 49).
    sources: [huntsman-bread-of-life, strathearn-johannine-dialogues, lds-scriptures]
  - ref: 44
    phrase: No man can come to me, except the Father which hath sent me draw him
    kind: scripture
    title: Except the Father draw him
    body: |
      The verse raises the question whether God picks some to come to Christ and leaves the rest unable. Joseph Smith's translation answers it by making the condition one a person meets: no man can come “except he doeth the will of my Father who hath sent me,” and that will is “that ye receive the Son; for the Father beareth record of him” (JST John 6:44, in the appendix); verse 65 is revised to match. The next verse in the King James says the same from the other side: “Every man therefore that hath heard, and hath learned of the Father, cometh unto me” (verse 45). And the drawing reaches everyone. The risen Lord told the Nephites that the Father sent Him to be lifted up on the cross “that I might draw all men unto me,” and “according to the power of the Father I will draw all men unto me” ([[3 Ne. 27:14–15]]).

      The translation also says what the one who comes is raised to. Whoever “receiveth the testimony” is raised “in the resurrection of the just,” and the same words are added to “I will raise him up at the last day” in verses 40 and 54. They are the words in which [[John 5:29]] was given to Joseph Smith and Sidney Rigdon in the vision of [[D&C 76:15–17]] (see the note on [[John 5:29]]).
    sources: [jst-john-6, lds-scriptures]
  - ref: 52
    phrase: How can this man give us his flesh to eat?
    kind: history
    title: How can this man give us his flesh?
    body: |
      His hearers took the words only literally, and the meaning He intended was lost on them. He did not soften the words; He pressed further: “Except ye eat the flesh of the Son of man, and drink his blood, ye have no life in you” (verse 53).

      “Drinketh my blood” made it harder still. The law forbade eating blood: whoever “eateth any manner of blood,” the Lord said, “I will even set my face against that soul” ([[Lev. 17:10]]). The added words sharpened the rejection. Jesus spoke them anyway, because what they pointed to was the center of His work as the Christ: His flesh given and His blood shed in death, “for the life of the world” (verse 51). In scripture “flesh and blood” together consistently mean a living mortal body, and the discourse seems to look above all to His death on the cross.
    sources: [christofferson-living-bread, huntsman-bread-of-life, lds-scriptures]
  - ref: 56
    phrase: He that eateth my flesh, and drinketh my blood, dwelleth in me, and I in him
    kind: prophets
    title: Dwelleth in me, and I in him
    body: |
      Eating His flesh and drinking His blood is “a striking way of expressing how completely we must bring the Savior into our life—into our very being—that we may be one,” the indwelling this verse describes. A disciple partakes of His flesh and blood in two ways: in receiving the power and blessings of His Atonement, and in taking in His qualities and character, putting off the natural man.

      John's account of the Last Supper tells no institution of the sacrament, and this chapter does not institute it either. But the sacrament uses the same figure: its bread and water represent His flesh and blood, and the bread is broken in remembrance of His torn flesh. Restoration scripture speaks of the ordinance in John's terms, as “bread and wine—the emblems of the flesh and blood of Christ” ([[D&C 20:40]]). The two are not the same, though: the sacrament looks back to His death, as this discourse does, and in a sense also forward to His return, so its meaning is broader than these words.
    sources: [christofferson-living-bread, huntsman-bread-of-life, lds-scriptures]
  - ref: 63
    phrase: It is the spirit that quickeneth; the flesh profiteth nothing
    kind: words
    title: The spirit that quickeneth
    body: |
      “Quickeneth” translates a Greek verb meaning to make alive or give life, used in John of giving eternal life. The disciples had taken offense at the saying about His flesh (verse 61), and the verse turns them from the flesh to what gives life: the Spirit, and the words He speaks, which “are spirit, and they are life.” Paul uses the same verb, rendered “giveth life,” in “the letter killeth, but the spirit giveth life” ([[2 Cor. 3:6]]), of the life the Spirit's power gives where the letter cannot.
    sources: [thayer, lds-scriptures]
  - ref: 66
    phrase: many of his disciples went back, and walked no more with him
    kind: history
    title: Many went back
    body: |
      The discourse that began with five thousand following Him ends with many disciples leaving. These were not the hostile hearers of the synagogue but followers who had believed in Him in some measure. John does not say why they left, though the sermon suggests a reason: what they may not have understood or accepted was what the flesh and blood meant, that He had come to die for His people. The Twelve would struggle with the same thing when Jesus began to foretell His death ([[Mark 8:31–33]]).

      The effect was a sifting, the work of the fan John the Baptist had foretold in the hand of the One mightier than he, to “throughly purge his floor” ([[Matt. 3:11–12]]): “much chaff was blown aside.” John tells it with no reply from those who left: the dialogue breaks off, and their going is told only as an act.
    sources: [huntsman-bread-of-life, talmage-jesus-christ-21, swift-bread-life-dialogue]
  - ref: 68
    phrase: Lord, to whom shall we go? thou hast the words of eternal life
    kind: christ
    title: To whom shall we go?
    body: |
      Peter answers for the Twelve, and his answer is not that he understood the hard saying. The Twelve seem not to have grasped the deeper meaning of these teachings either, and to have been puzzled, yet none of them left. What held them was not comprehension but knowledge of who He was: “we believe and are sure that thou art that Christ, the Son of the living God” (verse 69). Peter's question carries its own answer: there is no one else to go to, because no one else has the words of eternal life.
    sources: [talmage-jesus-christ-21, huntsman-bread-of-life]
  - ref: 70
    phrase: one of you is a devil
    kind: words
    title: One of you is a devil
    body: |
      The Greek *diabolos* means a slanderer or false accuser, and as a title it names Satan. Applied to a man, it describes one who opposes the cause of God and so plays the devil's part or sides with him, as when Jesus told Peter, “Get thee behind me, Satan” ([[Matt. 16:23]]). John explains at once that He meant Judas (verse 71).

      Jesus sets two facts side by side: He chose all twelve, and one of them is a devil. The words fall just after Peter's confession for the Twelve. John has already said that Jesus “knew from the beginning … who should betray him” (verse 64), and the footnote there points to the Last Supper, where He washed the disciples' feet and still said, “Ye are not all clean,” for “he knew who should betray him” ([[John 13:11]]). He chose Judas knowing.
    sources: [thayer, lds-scriptures]

christ: |
  The chapter points to Jesus Christ as the bread that came down from heaven: the Son on whom the Father has set His seal, who came “not to do mine own will, but the will of him that sent me” (verse 38), and whose flesh was given “for the life of the world” (verse 51). The crowd wanted loaves and a king; He offered them Himself, and His death in place of the crown.

  Disciples receive that bread now in the sacrament, whose emblems are His flesh and blood ([[D&C 20:40]]), and in partaking of Him they make His attributes their own. When a teaching is hard to bear, Peter's answer still holds: no one else has the words of eternal life.

explore: |
  - The sacrament among the Nephites, where the risen Lord gave bread that no one had brought and repeated the promise of verse 35: [[3 Ne. 18:1–11]]; [[3 Ne. 20:1–9]].
  - The manna and Israel's murmuring, which the crowd and the synagogue hearers replay: [[Ex. 16]].
  - Living water beside the bread of life (“shall never thirst”): [[John 4:13–14]]; [[John 7:37–39]].
  - The study “The Bread of Life Sermon” (*Celebrating Easter*, 2007) follows the discourse through its three audiences and reads it against its Passover setting.

