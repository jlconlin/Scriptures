chapter: 17
title: That They All May Be One
tagline: At the close of the Last Supper Jesus lifts His eyes to heaven and prays aloud before His disciples, for His own glorifying in the hour now come, for the eleven He is leaving in the world, and for all who will believe through their word, that they may be kept, sanctified, made one, and brought to be with Him where He is.
when: 'Thursday evening, the night before the crucifixion, at the close of the Last Supper and before Jesus went out over the brook Cedron ([[John 18:1]])'

setting: |
  Chapter 17 ends the long evening John began in [[John 13]]. After the supper, the washing of feet and the discourses of chapters 14–16, which close with “be of good cheer; I have overcome the world” ([[John 16:33]]), Jesus turns from speaking to His disciples to speaking to His Father, within their hearing. When He had spoken these words He went out with them over the brook Cedron to the garden where He would be arrested ([[John 18:1–3]]).

  Only John records the prayer; Matthew, Mark and Luke have nothing like these last words, though they tell of the prayer in Gethsemane that followed. Like the discourses, it speaks first to the men who heard it, and it is written so that it speaks to disciples in every age: in verse 20 Jesus prays in so many words for those who would believe through the apostles' word.

  Restoration scripture has a companion to it. When the risen Lord ministered among the Nephites, He also offered an intercessory prayer for His disciples there, in words close to these ([[3 Ne. 19:19–29]]).

thread: |
  **On the night before He dies, Jesus reports to His Father that His work is done, and asks that those He leaves in the world be kept, made holy, made one, and brought to be with Him.**

  The prayer moves outward in three steps. Jesus prays first for Himself: the hour has come, and He asks to be glorified with the glory He had before the world was (verses 1–5). He prays next for the eleven, who have received His words and must stay in a world that hates them (verses 6–19). Last He prays for all who will believe through their word, that they may be one as the Father and the Son are one, and may be with Him to behold His glory (verses 20–26).

  What holds the three together is life with God. Eternal life is to know the Father and the Son (verse 3); the disciples are to be one with Them (verse 21) and to have in them the love with which the Father loved the Son (verse 26). The prayer ties eternal life to knowing God, being one with Him, and loving with His love.

sections:
  - range: 1-5
    heading: Glorify thy Son
    plain: |
      When Jesus had said these things, He lifted up His eyes to heaven and said, “Father, the hour has come. Glorify your Son, so that your Son may glorify you. For you have given Him authority over all people, so that He may give eternal life to all whom you have given Him. And this is eternal life: that they may know you, the only true God, and Jesus Christ, whom you have sent. I have glorified you on the earth; I have finished the work you gave me to do. And now, Father, glorify me in your own presence with the glory I had with you before the world was.”
  - range: 6-19
    heading: I pray for them
    plain: |
      “I have made your name known to the men you gave me out of the world. They were yours, and you gave them to me, and they have kept your word. Now they know that everything you have given me comes from you. For I have given them the words you gave me, and they have received them. They know for certain that I came from you, and they have believed that you sent me. I am praying for them. I am not praying for the world, but for those you have given me, because they are yours. All that is mine is yours, and all that is yours is mine, and I am glorified in them.

      “I am no longer in the world, but they are in the world, and I am coming to you. Holy Father, keep them in your name, the ones you have given me, so that they may be one as we are one. While I was with them in the world, I kept them in your name. I guarded those you gave me, and not one of them perished except the son of perdition, so that the scripture would be fulfilled. But now I am coming to you, and I say these things while I am still in the world, so that they may have my joy made full in themselves.

      “I have given them your word, and the world has hated them, because they do not belong to the world, just as I do not belong to the world. I do not ask you to take them out of the world, but to keep them from the evil. They do not belong to the world, just as I do not belong to the world. Make them holy by your truth: your word is truth. As you sent me into the world, so I have sent them into the world. And for their sake I consecrate myself, so that they too may be made holy by the truth.”
  - range: 20-26
    heading: For them also which shall believe
    plain: |
      “I do not pray for these alone, but also for those who will believe in me through their word, that they may all be one. As you, Father, are in me and I am in you, may they also be one in us, so that the world may believe that you sent me. The glory you gave me I have given them, so that they may be one as we are one: I in them and you in me, so that they may be made perfect in one, and so that the world may know that you sent me and have loved them as you have loved me.

      “Father, I want those you have given me to be with me where I am, so that they may see my glory, which you have given me, because you loved me before the foundation of the world. Righteous Father, the world has not known you, but I have known you, and these have known that you sent me. I have made your name known to them, and I will make it known, so that the love with which you have loved me may be in them, and I in them.”

notes:
  - ref: 1
    phrase: lifted up his eyes to heaven
    kind: history
    title: The Intercessory Prayer
    body: |
      The prayer has two traditional names. It is called the Intercessory Prayer because in it the Lord intercedes with His Father for His disciples: “I pray for them” (verse 9). It has also been called the High Priest's Prayer, a name that looks to verse 19, where He consecrates Himself for their sake (see the note there). It is a prayer that only the Son could offer.

      Where it was spoken is not certain (see the note on [[John 14:31]]), and the lifted eyes do not settle it: lifting the eyes to heaven is the posture of prayer anywhere, indoors or out. Nothing in the prayer depends on the place.
    sources: [nelson-lords-prayers, ellicott-john, talmage-jesus-christ-33]
  - ref: 1
    phrase: the hour is come; glorify thy Son
    kind: christ
    title: The hour is come
    body: |
      At Cana Jesus said, “mine hour is not yet come” ([[John 2:4]]). When the Greeks came seeking Him He said, “The hour is come, that the Son of man should be glorified” ([[John 12:23]]), and at the supper John wrote that Jesus knew “that his hour was come that he should depart out of this world unto the Father” ([[John 13:1]]). That verse sets the tone of chapters 13–17, all spoken with the sacrifice of the next day in view. The hour is His death and His departure to the Father, as 13:1 puts it, and here, as in 12:23, He calls it His glorifying.

      The request is not for honor for its own sake. The Son asks to be glorified so that He may glorify the Father, by giving eternal life to those the Father has given Him (verse 2). The glory He asks for can be defined from the Lord's words to Moses: “to bring to pass the immortality and eternal life of man” ([[Moses 1:39]]). Verse 4 is His report on the work assigned Him: the Father has been glorified on earth in the finishing of that work. Verse 5 then asks for the glory the Son had with the Father “before the world was,” a plain statement in His own prayer that He lived with the Father before His birth.
    sources: [ellicott-john, huntsman-lamb-of-god, huntsman-thursday, talmage-jesus-christ-33]
  - ref: 3
    phrase: this is life eternal, that they might know thee the only true God
    kind: prophets
    title: To know God
    body: |
      The knowing in this verse is more than information about God. Knowing about Him, or acknowledging that He exists, is not knowing Him: the evil spirits in the Gospels recognized Jesus and testified of Him. Jesus had already said how this knowledge comes: “If any man will do his will, he shall know of the doctrine” ([[John 7:17]]). It is learned by doing His will, not by hearing alone.

      Eternal life is the life the Father and the Son have, so to know Them is to share it: to live with Them, and to live as They live. The verse names two: “thee the only true God, and Jesus Christ, whom thou hast sent.” Joseph Smith learned in the grove that the Father and the Son are two distinct Personages, and Restoration teaching takes this verse in earnest. In his sermon of April 1844, which draws on John's Gospel throughout, he said, “Here then is eternal life, to know the only wise and true God.” A revelation recorded in July 1843 takes up the verse's very words and makes them plural: “This is eternal lives—to know the only wise and true God, and Jesus Christ, whom he hath sent” ([[D&C 132:24]]). The language is John's; the reading is Joseph Smith's, who meant by “eternal lives” the eternal increase of an exalted husband and wife. (On eternal life as begun already in this life, see the note on [[John 5:24]].)
    sources: [olson-know-god, jsp-discourse-1844-04-07, frederick-life-eternal, lds-scriptures]
  - ref: 6
    phrase: I have manifested thy name
    kind: history
    title: I have manifested thy name
    body: |
      To manifest the Father's name is to make Him known as He is, the only true God of verse 3; it is the same as glorifying Him on earth (verse 4). Jesus says it twice, here and at the close of the prayer: “I have declared unto them thy name, and will declare it” (verse 26).

      For Jewish hearers the words could have carried more. By Jesus's time God's name was held in sacred secrecy, and it could be spoken aloud only by priests in the temple: in the daily priestly blessing of [[Num. 6:22–27]], the Mishnah says, the priests spoke the Name as written in the temple but used a substitute elsewhere, and once a year the high priest spoke it in the temple on the Day of Atonement. One Latter-day Saint reading sets the verse against that background and finds two traditions in it. God first revealed His name to Moses at Sinai ([[Ex. 3:13–15]]), so the one who now reveals the Father's name stands where Moses stood, as the prophet like Moses. And since only the priests, and the high priest above all, might speak the Name, to claim to reveal it is to claim the high priest's authority, the authority the Father has given the Son in verse 2, “power over all flesh, that he should give eternal life.” That is an interpretation; the verse itself says only that He has made the Father known to those the Father gave Him.
    sources: [ellicott-john, hamblin-john-17]
  - ref: 9
    phrase: I pray not for the world
    kind: words
    title: I pray not for the world
    body: |
      The words do not mean that Jesus does not care for the world. The tense is a strict present: “I am praying for them: I am not praying for the world.” They describe this prayer, at this moment, not His practice. In verse 21 the same prayer asks “that the world may believe,” and on the cross He prayed for the men who crucified Him: “Father, forgive them; for they know not what they do” ([[Luke 23:34]]).

      This part of the prayer is for the disciples only, by its nature. He is leaving them, and He commends to His Father's care the men who have received His words (verse 8) and who will stay behind in a world that hates them (verse 14).
    sources: [ellicott-john]
  - ref: 12
    phrase: none of them is lost, but the son of perdition
    kind: words
    title: The son of perdition
    body: |
      Jesus's words about the son of perdition carry a play on words that the English loses. “Is lost” is *apōleto*, “perished,” and “perdition” is *apōleia*, “destruction,” a noun from the same root as the verb *apollymi*, “to destroy.” “Son of perdition” is a Hebrew way of speaking, like “children of light”: a son of something is one whose nature is that thing. So Jesus says, in effect, “none of them perished except the one whose nature it was to perish.”

      The one meant is the betrayer, who had gone out from the supper into the night ([[John 13:30]]). The scripture fulfilled is most likely the psalm Jesus had applied to him at the table, also “that the scripture may be fulfilled”: “He that eateth bread with me hath lifted up his heel against me” ([[John 13:18]]; [[Ps. 41:9]]).

      Judas was not left unguarded. He was among those the Father gave the Son, and he was kept with the same care as the eleven; he was lost by his own act. The title describes the course he took. It does not settle his final state, which, as Elder Jeffrey R. Holland has said, is not ours to judge.
    sources: [greek-nt, thayer, ellicott-john, holland-none-with-him]
  - ref: 15
    phrase: keep them from the evil
    kind: words
    title: Keep them from the evil
    body: |
      “The evil” is most likely a person: the Greek *tou ponērou* can mean “evil” or “the evil one,” and in the New Testament *ho ponēros* is used above all of the devil. John's own usage points that way, and so does the phrase's use for Satan in the first century; John calls him “the prince of this world” ([[John 14:30]]). It is likely, though not certain, that the request matches the one Jesus taught His disciples to pray: “deliver us from evil” ([[Matt. 6:13]]).

      What Jesus does not ask is as telling. He does not pray that they be taken out of the world, because they have work in it: He has finished His (verse 4), and He is sending them into the world as the Father sent Him (verse 18). The request is for their keeping while they do that work, not for their escape from it. They are to be in the world and not of it (verses 14, 16), kept from the evil one while they stay.
    sources: [greek-nt, thayer, ellicott-john, hamblin-john-17]
  - ref: 19
    phrase: for their sakes I sanctify myself
    kind: christ
    title: I sanctify myself
    body: |
      Jesus says He sanctifies Himself, and a reader asks why the Holy One would need to be made holy. The answer is in the word. “Sanctify” is *hagiazō*, which means first to set apart from common use and dedicate to God; it was used of the offerings set apart for the altar. Jesus used it of Himself before, as the one “whom the Father hath sanctified, and sent into the world” ([[John 10:36]]). Here He consecrates Himself to the sacrifice that is hours away. By undergoing death He gives Himself wholly to the Father's will, as both Priest and Sacrifice, and it is “for their sakes.” One Latter-day Saint reading sees the high priest of the Day of Atonement in it, who first sanctified himself and then, in that state, officiated to sanctify Israel.

      For the disciples the same verb has its fuller sense. “Sanctify them” (verse 17) asks God to make them holy, set apart to Him, the meaning that gives the name “saints”; and it asks that they be made pure within, “through thy truth: thy word is truth.” Elder D. Todd Christofferson ties that cleansing to His offering: “To be sanctified through the blood of Christ is to become clean, pure, and holy,” as sanctification removes the stain of sin. They are made holy because He first gave Himself, and they are sent as He was sent (verse 18).
    sources: [greek-nt, thayer, ellicott-john, hamblin-john-17, huntsman-thursday, christofferson-justification]
  - ref: 21
    phrase: That they all may be one; as thou, Father, art in me, and I in thee
    kind: prophets
    title: That they all may be one
    body: |
      The disciples are to be one in the way the Father and the Son are one, so the verse also tells what Their oneness is. Joseph Smith read it that way in a sermon on 16 June 1844, arguing against the idea of three persons in one God. As Thomas Bullock recorded him: “I am agreed with the Far. & the Far. is a greed with me & we are agreed as one—the Greek shews that is shod. be agreed.” He went on to read Jesus's prayer for His disciples “that they may be agreed.” George Laub's notes put it, “that we might be one, or to Say be of one mind in the unity of the faith,” and William McIntire's minutes record that he spoke of the Son as a distinct Personage, in the image of the Father. In this reading the oneness that joins Father and Son is the oneness the disciples can share: being agreed, of one mind, not one being. (For the same oneness in [[John 10:30]], see the note there.)

      The Book of Mormon makes the point plainly. Praying for the Nephite twelve, Jesus asked “that I may be in them as thou, Father, art in me, that we may be one” ([[3 Ne. 19:23]]). There the oneness of the Father and the Son is the pattern for the disciples' oneness with Them, and it is the oneness of separate persons who share one purpose, not of one being. In this dispensation the Lord has made it a condition: “be one; and if ye are not one ye are not mine” ([[D&C 38:27]]). The unity has a purpose beyond the disciples themselves: “that the world may believe that thou hast sent me.”
    sources: [ehat-cook-words-1844-06-16, sc-knowhy-213, christofferson-one-in-christ, lds-scriptures]
  - ref: 22
    phrase: the glory which thou gavest me I have given them
    kind: christ
    title: The glory which thou gavest me
    body: |
      Jesus says He has given the disciples the glory the Father gave Him, and He says why: “that they may be one, even as we are one.” They are not only to see His glory; they receive it from the Son as the Son received it from the Father, so that they may be one with Them. The verse does not define the glory; what it makes plain is that disciples can receive the glory of God and become one with the Father and the Son.

      Verse 24 carries the thought to its end: “Father, I will that they also, whom thou hast given me, be with me where I am; that they may behold my glory.” “Where I am” takes up the promise with which the discourse began, “that where I am, there ye may be also” ([[John 14:2–3]]), so the whole evening is framed by Jesus's going to prepare a place and His prayer that they will be with Him there. The revelation of July 1843 that reads verse 3 takes up this promise too: “then shall ye know me, and shall receive your exaltation; that where I am ye shall be also” ([[D&C 132:23]]).
    sources: [hamblin-john-17, frederick-life-eternal]

christ: |
  The chapter shows Jesus as High Priest and Advocate on the night before His sacrifice. He reports a finished work, consecrates Himself for the sake of His disciples, and asks the Father to keep them, make them holy, make them one, and bring them where He is. He prays as Mediator for men who will be scattered within hours ([[John 16:32]]), and He gives them the glory the Father gave Him.

  The prayer of verse 20 takes in everyone who has believed through the apostles' word, and the same Lord still pleads as “the advocate with the Father,” “pleading your cause before him” ([[D&C 45:3]]). The oneness He prayed for comes in a disciple's life now “only in and through our individual loyalty to and love of Jesus Christ”: one within, one at home, one in the Church, and in the end one with the Father and the Son.

explore: |
  - **The prayer among the Nephites.** [[3 Ne. 19:19–29]], where the risen Lord prays for His disciples that they “may be purified in me” and “that we may be one.”
  - **The temple in John 17.** “‘I Have Revealed Your Name’: The Hidden Temple in John 17,” in *Interpreter* 1 (2012), reads the name, the sanctifying and the oneness of the prayer against the temple of Jesus's day.
  - **Knowing God.** “To Know God Is Life Eternal,” in *Let Us Reason Together*, follows verse 3 through John's letters and the Restoration.
  - **Where the evening began.** [[John 13:1]], the hour that had come, and [[John 14:1–3]], the place prepared.

parallels:
  - { ref: '3 Ne. 19:19–29', note: 'The risen Lord’s prayer for His Nephite disciples, that they may be one' }

