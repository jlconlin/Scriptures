chapter: 9
title: Whereas I Was Blind, Now I See
tagline: In Jerusalem on a Sabbath Jesus gives sight to a man blind from birth, sending him to wash in the pool of Siloam; questioned by his neighbours and twice by the Pharisees, who cast him out, the man comes step by step to believe on the Son of God and worship Him, while those who say “We see” remain in their sin.
when: 'In Jerusalem on a Sabbath ([[John 9:14]]), during or soon after the feast of Tabernacles ([[John 7:2]])'

setting: |
  Chapter 9 follows straight on from chapter 8, at or soon after the feast of Tabernacles. Jesus has just left the temple, where His hearers took up stones against Him ([[John 8:59]]), and on a Sabbath in the autumn, about six months before His death, He and His disciples pass a man who has been blind from birth and lives by begging. John alone tells the story, with unusual detail.

  The other Gospels tell of blind men given their sight ([[Mark 8:22–26]]; [[Mark 10:46–52]]), but here the man has never seen at all, and the chapter says so again and again. The healing also runs along the same lines as the healing at Bethesda in [[John 5]]: Jesus takes the first step, the water of a pool has a part in it, it is the Sabbath, the authorities object, and the man at first does not know who Jesus is. The story builds on that one and carries it further.

  The miracle itself takes seven verses. Most of the chapter is questioning. Jesus is with the man at the beginning and the end; between them the man stands alone, first before his neighbours and then twice before the Pharisees, with his parents called in between. The teaching on the good shepherd follows in [[John 10]], and its hearers are still arguing about this sign: “Can a devil open the eyes of the blind?” ([[John 10:21]]).

thread: |
  **A man born blind is given his sight, and then, step by step, he comes to see who Jesus is; the men who are sure they see grow blinder.**

  Each time he is questioned, the man says a little more. First Jesus is “a man that is called Jesus” (verse 11); then “a prophet” (verse 17); then a man “of God,” since God does not hear sinners (verses 31–33). Cast out, he is found by Jesus, and he ends in worship: “Lord, I believe. And he worshipped him” (verse 38). The Pharisees move the other way. They begin divided (verse 16), end certain that Jesus is a sinner (verse 24), and cannot see what is before them.

  Jesus says what the sign means before He does it, “I am the light of the world” (verse 5), and after it: He came “that they which see not might see; and that they which see might be made blind” (verse 39). The man's eyes are a picture of the sight that matters more.

sections:
  - range: 1-7
    heading: The man born blind
    plain: |
      As Jesus was passing by, He saw a man who had been blind from birth. His disciples asked Him, “Master, who sinned, this man or his parents, that he was born blind?” Jesus answered, “Neither this man sinned nor his parents; but the works of God are to be shown in him. I must do the works of Him who sent me while it is day. The night is coming, when no one can work. As long as I am in the world, I am the light of the world.”

      When He had said this, He spat on the ground, made mud with the spittle, and spread the mud on the blind man's eyes. He said to him, “Go, wash in the pool of Siloam” (the name means “Sent”). So the man went and washed, and came back seeing.
  - range: 8-12
    heading: The neighbours
    plain: |
      His neighbours, and those who had seen him before as a blind man, said, “Isn't this the man who used to sit and beg?” Some said, “It is he.” Others said, “He looks like him.” But he said, “I am the man.” So they asked him, “How were your eyes opened?” He answered, “A man called Jesus made mud and spread it on my eyes and told me, ‘Go to the pool of Siloam and wash.’ So I went and washed, and I received my sight.” They asked him, “Where is he?” He said, “I don't know.”
  - range: 13-23
    heading: The Pharisees and the parents
    plain: |
      They brought the man who had been blind to the Pharisees. It was the Sabbath day on which Jesus had made the mud and opened his eyes. So the Pharisees asked him again how he had received his sight. He told them, “He put mud on my eyes, and I washed, and I see.” Some of the Pharisees said, “This man is not from God, because he does not keep the Sabbath.” Others said, “How can a man who is a sinner do such signs?” And they were divided. So they asked the blind man again, “What do you say about him, since he opened your eyes?” He said, “He is a prophet.”

      But the Jews did not believe that he had been blind and had received his sight until they called his parents. They asked them, “Is this your son, who you say was born blind? How then does he now see?” His parents answered, “We know that this is our son and that he was born blind. But how he now sees we do not know, nor do we know who opened his eyes. He is of age; ask him. He will speak for himself.” His parents said this because they were afraid of the Jews, for the Jews had already agreed that anyone who confessed that Jesus was the Christ would be put out of the synagogue. That is why his parents said, “He is of age; ask him.”
  - range: 24-34
    heading: Cast out
    plain: |
      So a second time they called the man who had been blind and said to him, “Give glory to God and tell the truth. We know that this man is a sinner.” He answered, “Whether he is a sinner I do not know. One thing I do know: I was blind, and now I see.” They asked him, “What did he do to you? How did he open your eyes?” He answered, “I have told you already, and you would not listen. Why do you want to hear it again? Do you want to become his disciples too?”

      Then they abused him and said, “You are his disciple; we are disciples of Moses. We know that God spoke to Moses, but as for this man, we do not know where he comes from.” The man answered, “Now that is a marvel: you do not know where he comes from, and yet he opened my eyes. We know that God does not listen to sinners, but if anyone worships God and does His will, God listens to him. Never since the world began has anyone heard of a man opening the eyes of someone born blind. If this man were not from God, he could do nothing.” They answered, “You were born wholly in sin, and you are teaching us?” And they threw him out.
  - range: 35-41
    heading: Sight and blindness
    plain: |
      Jesus heard that they had thrown him out, and when He found him, He said, “Do you believe on the Son of God?” He answered, “Who is he, Lord, so that I may believe on him?” Jesus said to him, “You have seen him, and it is he who is speaking with you.” He said, “Lord, I believe,” and he worshipped Him.

      Jesus said, “I came into this world for judgment, so that those who do not see may see, and those who see may become blind.” Some of the Pharisees who were with Him heard this and said to Him, “Are we blind too?” Jesus said to them, “If you were blind, you would have no sin. But now you say, ‘We see,’ so your sin remains.”

notes:
  - ref: 2
    phrase: who did sin, this man, or his parents
    kind: history
    title: Who did sin, this man, or his parents?
    body: |
      The disciples take it for granted that the blindness is a punishment, and ask only whose sin it punishes. Both of their answers had grounds in what they knew. That children suffer for their parents' sins was taught in the Second Commandment, where the Lord visits “the iniquity of the fathers upon the children” ([[Ex. 20:5]]), and the belief was widespread in their day. The other answer is the harder one. The man was born blind, so if his own sin had caused it, he must have sinned before he was born.

      The question therefore implies a belief “in a state of moral agency and choice antedating mortality.” The disciples were wrong to make bodily affliction a sure sign of personal sin; that generalization was too broad. But Jesus does not correct the assumption behind the question. He answers only that this man's blindness was not punishment for anyone's sin. Restoration scripture teaches plainly the life that the question takes for granted: “Man was also in the beginning with God” ([[D&C 93:29]]), and Abraham was shown “the intelligences that were organized before the world was” ([[Abr. 3:22]]). The disciples, it appears, had been taught that truth; the verse does not say when or by whom, and it is not an occasion on which Jesus taught it.
    sources: [ellicott-john, talmage-jesus-christ-25, sc-knowhy-808, lds-scriptures]
  - ref: 3
    phrase: that the works of God should be made manifest in him
    kind: prophets
    title: That the works of God should be made manifest
    body: |
      Jesus's answer is limited to the question asked: no sin of this man or of his parents caused the blindness. It stands as a warning against reading the misfortunes of others as the result of their sins, or as a proof that God is displeased with them.

      What He puts in place of the disciples' question is a purpose. The man's blindness will become the occasion of God's works, and by the end of the chapter it has: he sees, and more than that, he believes and worships (verse 38). The answer reaches beyond this man. Hardships belong to a life in which we are sent to be tested and to grow through opposition, and Jesus taught that lesson with the man born blind: “If we see life through the lens of spirituality, we can see many examples of the works of God being furthered through the adversities of His children.” The verse does not say that God struck the man blind in order to heal him; it says what God would make of the blindness.
    sources: [ellicott-john, oaks-give-thanks]
  - ref: 4
    phrase: 'while it is day: the night cometh, when no man can work'
    kind: scripture
    title: While it is day
    body: |
      Jesus speaks of His own ministry as a working day, in which the works of the Father who sent Him must be done. Joseph Smith's translation makes the day and the night plain. In place of “while it is day,” it reads “while I am with you; the time cometh when I shall have finished my work, then I go unto the Father.” The day is His time on earth, the time verse 5 calls “as long as I am in the world”; the night comes when that work is finished and He returns to the Father.

      “The night cometh, when no man can work” was a proverb of the day of opportunity that passes, and Jesus does not except Himself from it: His own work on earth would end. The footnote to “day” sets beside the verse Amulek's plea, which uses the same picture for every life: “this day of life, which is given us to prepare for eternity,” after which “cometh the night of darkness wherein there can be no labor performed” ([[Alma 34:33]]). The Savior's own working day had an end, and so does each disciple's.
    sources: [lds-scriptures, ellicott-john]
  - ref: 5
    phrase: I am the light of the world
    kind: christ
    title: The light of the world
    body: |
      Jesus had said these words in the temple soon after the feast of Tabernacles: “I am the light of the world: he that followeth me shall not walk in darkness, but shall have the light of life” ([[John 8:12]]). The great lampstands lit in the temple during the feast were still fresh in His hearers' minds. Now He says it again beside a man who has lived in darkness all his life, and then gives him light.

      The sign enacts the saying, and the rest of the chapter carries it further. The man who receives his sight goes on to know who Jesus is, the true Light of the World, and the last verses of the chapter set him beside those who say they see and do not (verses 39–41).
    sources: [gardner-tabernacles, huntsman-sabbath-john]
  - ref: 6
    phrase: made clay of the spittle
    kind: symbol
    title: Clay of the spittle
    body: |
      In John, Jesus usually heals with a word, so the mud stands out and asks to be explained. Saliva was in fact counted a remedy for blindness: Roman writers and the rabbis both mention it. But the healing of a man blind from birth was beyond any remedy, and the mud points elsewhere.

      One reading, a very old one, sees the Creation in it. The Lord God formed man “of the dust of the ground” and breathed into him “the breath of life” ([[Gen. 2:7]]), and here Jesus mixes dust from the ground with what came from His own mouth. Water often stands for spirit in John, and saliva is water from Jesus's own mouth; mixed with the dust, it may recall God putting spirit into the first man. The reading is found as early as Irenaeus, in the second century. It suits the miracle, which seems to have been a new creation more than a cure. The man at Bethesda was brought back to the health he had once had; this man's eyes had never seen at all.
    sources: [huntsman-sabbath-john, ellicott-john, van-dyke-miracles-john]
  - ref: 7
    phrase: Go, wash in the pool of Siloam, (which is by interpretation, Sent.)
    kind: symbol
    title: Siloam, which is Sent
    body: |
      John stops to translate the pool's name because it ties the pool to a word he has been repeating. Since chapter 7 Jesus has spoken again and again of the Father who “sent” Him, and He has just said it once more, “I must work the works of him that sent me” (verse 4). The man is sent to the pool called Sent, and the pool becomes a sign of the Sent One who healed him. Whether *Shiloah* (the Hebrew name, the “waters of Shiloah that go softly” of [[Isa. 8:6]]) really comes from the verb “to send” is uncertain; some derive it from a word for a water channel. For John the meaning is enough.

      The pool mattered for other reasons too. Its water came from the Gihon spring, so it was “living water,” fit for ritual purification; it was the water drawn for the altar at Tabernacles (see the note on [[John 7:37]]), and the pool was probably a ritual bath. And it was not the nearest pool: Bethesda was about half as far away. The longer walk may have been a call to faith, and the command is like Elisha's to Naaman, who was told to go and wash in the Jordan ([[2 Kgs. 5:10]]).
    sources: [gardner-tabernacles, ellicott-john]
  - ref: 14
    phrase: it was the sabbath day when Jesus made the clay
    kind: history
    title: On the sabbath day
    body: |
      John names the Sabbath only after the miracle, as he did at Bethesda ([[John 5:9]]), and he names what Jesus did: He “made the clay.” Making the mud was work, and rules of the rabbis forbade, on the Sabbath, the very act of anointing eyes with spittle. Healing was allowed on the Sabbath only where a life was in immediate danger, and a man blind from birth was in no such danger.

      The Pharisees divide over it (verse 16). Some reason from the law: a man who does such work on the Sabbath cannot be from God. Others reason from the miracle: a sinner could not do such things. John's two Sabbath healings do not do away with the Sabbath. They show it as a day for the work of salvation and redemption, the Father's work that Jesus said He goes on doing ([[John 5:17]]).
    sources: [ellicott-john, huntsman-sabbath-john]
  - ref: 17
    phrase: He is a prophet
    kind: christ
    title: He is a prophet
    body: |
      The man's answers grow as he is questioned. To his neighbours Jesus was only “a man that is called Jesus” (verse 11). Pressed by the Pharisees, he has had to think about what happened to him. Many men had likely passed him in his years of blindness without doing any such thing, and he seems to have concluded that this one was more than a man: “He is a prophet.” He has not yet learned that Jesus is the Christ.

      The questioning that was meant to break his story only makes him think harder about it. By verse 33 he has reasoned that Jesus must be “of God,” and when Jesus finds him he is ready to believe on the Son of God (verses 35–38). The Pharisees' cross-examination becomes the means of his coming to see.
    sources: [strathearn-johannine-dialogues, talmage-jesus-christ-25]
  - ref: 22
    phrase: he should be put out of the synagogue
    kind: history
    title: Put out of the synagogue
    body: |
      “The Jews” of verses 18 and 22 are Jesus's opponents among the Jewish leaders, who question the parents and threaten them with the synagogue's ban. The Pharisees to whom the man was first brought (verse 13) were not the council, which did not meet on the Sabbath, but a body of leading Pharisees, and the agreement of verse 22 was one the leaders had made and made known to the people. The parents who fear them, and the son they question, are Jews as well.

      The word John uses, *aposynagōgos*, means excluded from the sacred assemblies of Israel: excommunicated. Later Jewish practice knew several degrees of the ban; in Jesus's day it probably meant, for as long as it lasted, exclusion from the privileges an Israelite cherished in the worship and life of his people. Whether it also cut a man off from all contact with other Israelites is uncertain. The parents had good reason to say only what they knew and to send the questioners back to their son. Many scholars think the threat also reflects what Jewish Christians later in the first century suffered when they were expelled from their synagogues. That is their reading of the Gospel's setting; the verse itself places the agreement in Jesus's lifetime (“had agreed already”).
    sources: [huntsman-sabbath-john, ellicott-john, thayer, talmage-jesus-christ-25, huntsman-gospel-john]
  - ref: 24
    phrase: Give God the praise
    kind: words
    title: Give God the praise
    body: |
      The words sound like a call to thank God for the cure instead of Jesus, but they are something else. In the Greek the Pharisees tell him to give glory to God, a formula that charged a man to acknowledge that God knows all things and to show it by a true confession. Joshua used it when he called on Achan to confess: “give, I pray thee, glory to the LORD God of Israel, and make confession unto him; and tell me now what thou hast done; hide it not from me” ([[Josh. 7:19]]). The Pharisees charge the man to confess the truth, and then tell him what the truth is: “we know that this man is a sinner,” for in their minds Jesus had broken the Sabbath.

      For now the man will not argue the point. He leaves aside whether Jesus is a sinner and holds to the one thing he knows: “whereas I was blind, now I see” (verse 25).
    sources: [thayer, lds-scriptures, strathearn-johannine-dialogues]
  - ref: 32
    phrase: Since the world began was it not heard that any man opened the eyes of one that was born blind
    kind: scripture
    title: Since the world began
    body: |
      The man is right: no skill of his day could give sight to someone blind from birth, and no one had heard of such a thing. That sets this sign apart from the healings of the blind in the other Gospels: this man had never seen at all.

      Joseph Smith's translation ends the verse “blind, except he be of God.” In the King James text the man states a fact in verse 32 and draws the inference in verse 33; the translation joins the inference to the fact in the same verse.
    sources: [ellicott-john, huntsman-sabbath-john, lds-scriptures]
  - ref: 34
    phrase: And they cast him out
    kind: history
    title: They cast him out
    body: |
      “Cast him out” most likely means that the Pharisees excommunicated him, the penalty his parents had feared in verse 22 (see the note there for what it meant). Against his reasoning that a man who opened the eyes of the born blind must be “of God” (verse 33), they have only an insult: “Thou wast altogether born in sins, and dost thou teach us?” Unable to answer him, they used the authority they had. John gives no account of a formal sentence, though, and the man had not yet confessed Jesus to be the Christ, the offence verse 22 names; so the words may mean no more than that they drove him from their presence.

      Either way, the sight he was gaining got him cast out, but it also opened a door.
    sources: [talmage-jesus-christ-25, ellicott-john, strathearn-johannine-dialogues]
  - ref: 38
    phrase: Lord, I believe. And he worshipped him.
    kind: christ
    title: Lord, I believe
    body: |
      Jesus heard that the man had been cast out, and went and found him (verse 35). As at the start of the chapter, when Jesus saw the man and healed him (verses 1, 6–7), Jesus is the one who comes to him and begins the conversation. The man has never seen Jesus, who sent him off to wash before his eyes were opened, so Jesus tells him who He is: “Thou hast both seen him, and it is he that talketh with thee” (verse 37).

      The man's answer is the end of his journey. “Lord, I believe,” and he worships. Everywhere else in John, the Greek word for “worshipped” is used of the worship of God ([[John 4:20–24]]; [[John 12:20]]).
    sources: [huntsman-sabbath-john, strathearn-johannine-dialogues, ellicott-john]
  - ref: 39
    phrase: that they which see might be made blind
    kind: christ
    title: That they which see might be made blind
    body: |
      Jesus did not come to condemn the world but to save it ([[John 3:17]]). Yet His coming judges. The word He uses, *krima*, is the judgment passed, the sentence, rather than the act of judging: as people receive Him or refuse Him, they pass sentence on themselves. The man who knew he was blind came to see. The men who were sure they saw refused the light in front of them, and their blindness grew.

      “Are we blind also?” (verse 40) gets a sharp answer. If they were blind, aware of their need and willing to be taught, their ignorance would not be counted as sin. But they say “We see,” and so their sin remains. To reject the one who heals is to reject the healing and the forgiveness He offers. The footnote to verse 41 sets beside it what Jesus later says of the world that hated Him: “If I had not come and spoken unto them, they had not had sin: but now they have no cloak for their sin” ([[John 15:22]]).
    sources: [ellicott-john, thayer, huntsman-sabbath-john, lds-scriptures]

christ: |
  The chapter shows Jesus as the Light of the world, who gives sight to a man born blind and then gives him the greater sight of knowing who He is. He is the one the Father sent, and He sends the man to a pool whose very name means “Sent.” When the man is cast out for what he would not deny, Jesus finds him, and the man worships Him as Lord.

  Jesus would not let His disciples read the man's blindness as a punishment (verse 3). In His hands an affliction can become a place where the works of God are made manifest (verse 3): “the Lord will not only consecrate our afflictions for our gain, but He will use them to bless the lives of countless others.” And sometimes, as with this man, He is the one who seeks a disciple out.

explore: |
  - **The three dialogues.** “Johannine Christology through the Lens of Three of Its Dialogues,” in *Thou Art the Christ, the Son of the Living God*, reads the man born blind beside Nicodemus ([[John 3]]) and the woman at the well ([[John 4]]).
  - **The feast behind John 7–9.** “Jesus Christ and the Feast of Tabernacles,” in *Learn of Me*, sets the light, the water of Siloam and this healing against the rites of the feast.
  - **The teaching that follows.** [[John 10:1–21]], which ends with the question, “Can a devil open the eyes of the blind?”

