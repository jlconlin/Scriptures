chapter: 12
title: The Hour Is Come
tagline: At Bethany Mary anoints Jesus's feet against the day of His burial; the next day the crowds hail Him as the King of Israel; when Greeks ask to see Him, Jesus says the hour has come for the Son of man to be glorified, and a voice from heaven answers His prayer; John then weighs the unbelief that met Him, and gives His last public words.
when: 'Six days before the Passover and the day after ([[John 12:1]]; [[John 12:12]]), in Bethany and Jerusalem, at the start of the last week of Jesus’s life'

setting: |
  Chapter 12 follows the raising of Lazarus and the council's resolve to put Jesus to death ([[John 11:47–53]]). After a time out of sight at Ephraim ([[John 11:54]]), Jesus comes back, six days before the Passover, to Bethany, just over the Mount of Olives from Jerusalem, and the next day He rides into the city. It is the beginning of the last week of His life.

  The chapter is a bridge. It closes the first half of the Gospel, which tells the signs and discourses of Jesus's ministry, and opens the second, often called the “Book of Glory,” because John speaks of Jesus's death and resurrection as the means by which He is glorified and glorifies the Father. Two of its stories are told in the other Gospels as well. Matthew and Mark tell of an anointing at Bethany two days before the Passover, by an unnamed woman who pours the ointment on His head ([[Matt. 26:2–7]]; [[Mark 14:1–3]]); whether it is the same event is uncertain (see the note on verse 7). All four Gospels tell of the entry into Jerusalem. The coming of the Greeks and the discourse that follows are John's alone. After verse 36 Jesus withdraws from public teaching, and John stops to weigh the result of His ministry (verses 37–43) before he closes with words Jesus “cried” aloud (verses 44–50), for which he gives no time or place.

thread: |
  **The hour that Jesus said at Cana was “not yet come” ([[John 2:4]]) has come, and the glory it brings turns out to pass through a death.** Mary anoints Jesus as though for burial; the crowds hail Him as King; and when Greeks ask to see Him, Jesus says, “The hour is come, that the Son of man should be glorified” (verse 23), and explains it at once with a seed that must fall into the ground and die (verse 24). He will be “lifted up from the earth” and so draw all men to Himself (verse 32), and John says plainly that the words pointed to the manner of His death (verse 33).

  The chapter is also a reckoning. The crowds come out because of Lazarus, the chief priests plan to kill Lazarus too, and though Jesus had done so many signs, “yet they believed not on him” (verse 37). John explains the unbelief from Isaiah, who had seen this same Lord's glory (verse 41), and sets beside it the rulers who believed and kept silent, because they “loved the praise of men more than the praise of God” (verse 43). The word for “praise” there is the word for “glory,” and the choice between the two kinds of glory is the one the chapter leaves with its reader.

sections:
  - range: 1-11
    heading: The supper at Bethany
    plain: |
      Six days before the Passover, Jesus came to Bethany, where Lazarus lived, the man He had raised from the dead. They gave a supper for Him there. Martha served, and Lazarus was one of those at the table with Him. Then Mary took a pound of very costly ointment of spikenard and anointed Jesus's feet and wiped His feet with her hair, and the house was filled with the fragrance of the ointment.

      One of His disciples, Judas Iscariot, Simon's son, who was going to betray Him, said, “Why was this ointment not sold for three hundred pence and the money given to the poor?” He said this not because he cared about the poor, but because he was a thief: he kept the money box and used to take what was put in it. Then Jesus said, “Let her alone. She has kept this for the day of my burial. You always have the poor with you, but you do not always have me.”

      A great crowd of the Jews learned that He was there, and they came, not only because of Jesus but also to see Lazarus, whom He had raised from the dead. So the chief priests made plans to put Lazarus to death as well, because on his account many of the Jews were going away and believing on Jesus.
  - range: 12-19
    heading: The King of Israel
    plain: |
      The next day the great crowd that had come to the feast heard that Jesus was coming to Jerusalem. They took branches of palm trees and went out to meet Him, crying, “Hosanna! Blessed is the King of Israel who comes in the name of the Lord!” Jesus found a young donkey and sat on it, as it is written: “Fear not, daughter of Zion. Behold, your King is coming, sitting on a donkey's colt.”

      His disciples did not understand these things at first. But when Jesus was glorified, they remembered that these things had been written of Him and that they had done these things to Him. The crowd that had been with Him when He called Lazarus out of the tomb and raised him from the dead kept bearing witness. That is why the crowd went out to meet Him: they had heard that He had done this sign. So the Pharisees said to one another, “You see that you are getting nowhere. Look, the world has gone after Him.”
  - range: 20-26
    heading: Greeks come to see Jesus
    plain: |
      Among those who went up to worship at the feast were some Greeks. They came to Philip, who was from Bethsaida in Galilee, and asked him, “Sir, we would like to see Jesus.” Philip went and told Andrew, and then Andrew and Philip told Jesus.

      Jesus answered them, “The hour has come for the Son of man to be glorified. Truly, truly, I say to you, unless a grain of wheat falls into the ground and dies, it remains alone; but if it dies, it bears much fruit. Whoever loves his life will lose it, and whoever hates his life in this world will keep it to eternal life. If anyone serves me, let him follow me, and where I am, there my servant will be also. If anyone serves me, my Father will honor him.”
  - range: 27-36
    heading: A voice from heaven
    plain: |
      “Now my soul is troubled. And what shall I say? Father, save me from this hour. But it was for this very purpose that I came to this hour. Father, glorify your name.” Then a voice came from heaven: “I have glorified it, and I will glorify it again.” The crowd standing there heard it and said that it had thundered; others said, “An angel has spoken to Him.” Jesus answered, “This voice did not come for my sake, but for yours. Now is the judgment of this world; now the prince of this world will be cast out. And I, if I am lifted up from the earth, will draw all men to myself.” He said this to show by what manner of death He was going to die.

      The crowd answered Him, “We have heard from the law that the Christ remains forever. How can you say that the Son of man must be lifted up? Who is this Son of man?” Jesus said to them, “The light is with you for a little while longer. Walk while you have the light, so that darkness does not overtake you; whoever walks in the darkness does not know where he is going. While you have the light, believe in the light, so that you may be children of light.” When Jesus had said these things, He went away and hid Himself from them.
  - range: 37-43
    heading: Yet they believed not
    plain: |
      Though He had done so many signs before them, they still did not believe on Him. So the word of the prophet Isaiah was fulfilled: “Lord, who has believed our report? And to whom has the arm of the Lord been revealed?” Therefore they could not believe, because Isaiah also said, “He has blinded their eyes and hardened their heart, so that they would not see with their eyes, nor understand with their heart, and be converted, and I would heal them.” Isaiah said these things when he saw His glory, and he spoke of Him.

      Even so, many even among the rulers believed on Him, but because of the Pharisees they did not confess it, so that they would not be put out of the synagogue. For they loved the glory that comes from men more than the glory that comes from God.
  - range: 44-50
    heading: Jesus cried and said
    plain: |
      Then Jesus cried out, “Whoever believes on me believes not on me but on Him who sent me. And whoever sees me sees Him who sent me. I have come as a light into the world, so that whoever believes on me should not remain in darkness. If anyone hears my words and does not believe, I do not judge him, for I did not come to judge the world but to save the world. Whoever rejects me and does not receive my words has one who judges him: the word that I have spoken will judge him on the last day. For I have not spoken on my own; the Father who sent me has given me a commandment, what I should say and what I should speak. And I know that His commandment is eternal life. So whatever I speak, I speak just as the Father has told me.”

notes:
  - ref: 3
    phrase: a pound of ointment of spikenard, very costly
    kind: history
    title: A pound of spikenard
    body: |
      Mary's gift was extravagant, and John wants the reader to feel it. Spikenard, or nard, is an aromatic oil from a small plant of the Himalayas. Because it came so far, it was costly in the lands of the New Testament, and it was usually imported in sealed alabaster jars that were opened only on special occasions. The pound was a measure of twelve ounces. Judas values it at three hundred pence (verse 5), and a penny was a laborer's pay for a day ([[Matt. 20:2]]): the ointment was worth most of a year's work.

      What she did with it was as striking as what it cost. Anointing a guest's head with ordinary oil honored him, and anointing his feet as well showed unusual regard; spikenard poured out in such abundance was a homage rarely given even to kings. Then she wiped His feet with her hair. For a woman to uncover her hair in company was a scandal in her day, and the shock of it may have helped to embolden Judas's rebuke. John notes the fragrance that filled the house: no one present could miss what she had done.
    sources: [ball-plants-nt, ellicott-john, talmage-jesus-christ-29, van-dyke-huntington-marys, lds-scriptures]
  - ref: 6
    phrase: because he was a thief, and had the bag
    kind: history
    title: He was a thief
    body: |
      Matthew says “his disciples” were indignant at the waste and Mark says “some” ([[Matt. 26:8]]; [[Mark 14:4]]); John names Judas, and says why he spoke: not because he cared for the poor. Judas kept the disciples' common purse. When he left the supper on the night of the betrayal, some of the disciples supposed that Jesus had sent him to buy what they needed for the feast, or to “give something to the poor” ([[John 13:29]]). The “bag” is a purse or money box. “Bare what was put therein” can be read as no more than “carried it,” but the verb also means to carry a thing off, as it does of the body in [[John 20:15]], and here it means that he pilfered from it.

      John has already named Judas as the one “which should betray him” (verse 4); the betrayal itself waits for the next chapter ([[John 13:2]]).
    sources: [lds-scriptures, thayer]
  - ref: 7
    phrase: 'against the day of my burying hath she kept this'
    kind: christ
    title: Against the day of my burying
    body: |
      Jesus takes Mary's act as a preparation for His death. The King James wording is hard to follow, and Joseph Smith's translation makes it plain: “for she hath preserved this ointment until now, that she might anoint me in token of my burial.” In Israel it was common to anoint bodies for burial; Mary anoints Him while He is alive, and Jesus gives the deed a prophetic meaning. How much she understood, the record does not say. Elder Bruce R. McConkie taught that she acted “as guided by the Spirit,” and for a purpose beyond the burial: “so that, the next day, the ten thousands of Israel might acclaim him King and shout Hosanna to his name” (verses 12–15). That purpose fits what anointing meant in Israel, which anointed living men as well, to serve as rightful kings or as high priests; “Messiah,” like the Greek “Christ,” means “the anointed one.”

      Matthew and Mark tell of a similar anointing, which they place later in the week, when a woman pours the ointment on His head in the house of Simon the leper ([[Matt. 26:6–13]]; [[Mark 14:3–9]]). John names Mary, has her anoint His feet, and places the supper six days before the Passover, before the entry. Elder McConkie told them as one event, with Mary anointing both head and feet in Simon's house; the differences also leave room for two anointings.
    sources: [lds-scriptures, huntsman-reflections-last-week, seely-messiah, huntsman-wednesday]
  - ref: 10
    phrase: the chief priests consulted that they might put Lazarus also to death
    kind: history
    title: Lazarus also
    body: |
      Lazarus had done nothing; his offense was to be alive. “The Jews” of verses 9 and 11 are not Jesus's enemies here. In the Lazarus story the term probably means people of the upper classes, friendly to the family (they had come to comfort Martha and Mary, [[John 11:19]]) and divided over Jesus: many came to believe because of Lazarus ([[John 11:45]]; verses 9–11), while others reported to the Pharisees ([[John 11:46]]). The hostility in this verse belongs to the chief priests.

      The chief priests were for the most part Sadducees, who taught that there is no resurrection ([[Acts 23:8]]). A man walking about Bethany after four days in the grave ([[John 11:17]]) was a living witness to the One they had resolved to kill, and a denial of their own doctrine. The verse says they “consulted,” took counsel on it, not that they settled on a plan. In John the raising of Lazarus is what finally sets the authorities against Jesus, and the entry of the next day makes it worse: the crowd that saw Lazarus come out of the grave keeps telling of it, the people go out to meet Jesus because of the sign (verses 17–18; John's word, which the King James Version renders “miracle,” is *sēmeion*, “sign”), and the Pharisees despair: “behold, the world is gone after him” (verse 19).
    sources: [huntsman-preludes-last-week, ellicott-john, huntsman-palm-sunday, huntsman-gospel-john]
  - ref: 13
    phrase: 'Hosanna: Blessed is the King of Israel that cometh in the name of the Lord'
    kind: words
    title: Hosanna to the King of Israel
    body: |
      The crowd's cry is made of Old Testament words. “Hosanna” means “Save now”; it is taken from [[Ps. 118:25]], one of the psalms of the Hallel, which were sung at the great feasts, and “Blessed be he that cometh in the name of the LORD” is the next verse ([[Ps. 118:26]]). At the Feast of Tabernacles this psalm was chanted as palm branches were waved, and the waving of branches was also associated with the crowning of Israel's kings; at this Passover the crowd brought both the psalm and the branches out to meet Jesus. Into the psalm's blessing John's crowd puts a title, “the King of Israel,” as Matthew's puts “the Son of David” ([[Matt. 21:9]]). Such titles were not used lightly: they were kept for the hope of a Messiah who would restore the kingdom of David.

      The donkey belongs to the same picture. Old Testament kings, David above all, rode donkeys (David had Solomon ride his own mule to his anointing, [[1 Kgs. 1:33–39]]), and Zechariah had promised that Zion's King would come “lowly, and riding upon an ass” ([[Zech. 9:9]]), in a prophecy of the day when the Lord will rule the earth in peace. A horse was a beast of war; Jesus came as the Prince of Peace. The entry was meant to proclaim who He was, and so it was itself a sign of the reign to come.
    sources: [bd-hosanna, bd-hallel, huntsman-reflections-last-week, jackson-ot-easter]
  - ref: 16
    phrase: These things understood not his disciples at the first
    kind: scripture
    title: Understood not at the first
    body: |
      John says plainly that the disciples did not at first see that the entry fulfilled Zechariah. Only “when Jesus was glorified” did they remember the scripture and see what they had done. The footnote sets this beside Luke's account of the Twelve when Jesus foretold His death: “they understood none of these things: and this saying was hid from them” ([[Luke 18:34]]). John does not say when that glorifying was; one Latter-day Saint reading places their understanding after His ascension, once they had received the Holy Ghost.
    sources: [lds-scriptures, jackson-ot-easter]
  - ref: 20
    phrase: certain Greeks among them that came up to worship at the feast
    kind: history
    title: Certain Greeks
    body: |
      These were most likely Gentiles who honored the God of Israel, not Jews who spoke Greek: John calls them *Hellēnes*, “Greeks,” and they had “come up to worship at the feast.” The footnotes set them beside the Ethiopian who “had come to Jerusalem for to worship” ([[Acts 8:27]]) and the “devout Greeks” who heard Paul at Thessalonica ([[Acts 17:4]]). The synagogues of the time drew two kinds of such Gentiles: proselytes, who were circumcised and were expected to keep the whole law of Moses, and the “God-fearing” or “devout,” who attended the services and kept only part of the law. These Greeks were probably of the second kind, worshippers of Israel's God who had not become proselytes.

      They come to Philip, who was from Bethsaida in Galilee, and Philip goes to Andrew, who came from the same town ([[John 1:44]]); the two bring the request together. Both were Galileans with Greek names, from a Hellenized town, and presumably spoke some Greek. John never says whether the Greeks were brought in. What he records is what their coming meant to Jesus (verse 23).
    sources: [huntsman-monday, bd-proselytes, lds-scriptures]
  - ref: 23
    phrase: The hour is come, that the Son of man should be glorified
    kind: christ
    title: The hour is come
    body: |
      Until now the hour has always been future: “Mine hour is not yet come,” Jesus told His mother at Cana ([[John 2:4]]), and twice in Jerusalem no one could lay hands on Him “because his hour was not yet come” ([[John 7:30]]; [[John 8:20]]). Now, at the request of a few Gentiles, He says it has come. Their coming answers the Pharisees' complaint of a moment before, “behold, the world is gone after him” (verse 19), and shows that He came to save all, Jew and Gentile alike.

      John describes Jesus's saving death and resurrection as the means by which He is glorified and glorifies the Father, and Jesus explains at once that the way to that glory leads through death (verse 24). For Latter-day Saint readers the Lord's own words to Moses fit the chapter: “this is my work and my glory—to bring to pass the immortality and eternal life of man” ([[Moses 1:39]]).
    sources: [huntsman-monday, ellicott-john, huntsman-gospel-john]
  - ref: 24
    phrase: Except a corn of wheat fall into the ground and die
    kind: symbol
    title: A corn of wheat
    body: |
      “Corn” here means grain or seed, and the image is a farmer's. A grain of wheat kept back stays a single grain: it “abideth alone.” Sown in the ground, it dies as a seed and “bringeth forth much fruit.” Jesus gives the image in answer to the hour of His glory (verse 23), and in John that glory comes through His death and resurrection. The dying seed that bears new life is Jesus Himself, as He makes clear when He speaks of being lifted up (verse 32). The verses that follow apply the same law to His disciples (verses 25–26).

      The footnote points to Paul, who used the same seed for the resurrection: “that which thou sowest is not quickened, except it die,” and God gives it a body ([[1 Cor. 15:36–38]]).
    sources: [lds-scriptures, huntsman-gospel-john, huntsman-monday]
  - ref: 25
    phrase: he that hateth his life in this world
    kind: words
    title: Hateth his life
    body: |
      “Hate” is the ordinary Greek word for hatred, and Jesus does not ask His disciples to despise the life God gave them. The language of love and hate here, as in [[Luke 14:26]], states a preference in the strongest terms, where English would speak of caring about one thing and setting another aside. The life loved so much that it is held back from God is lost; the life put second to Him, and given up when He asks it, is kept unto life eternal, like the grain that is lost to sight in the ground (verse 24).

      The footnote points to Joseph Smith's translation of the parallel saying in Luke, which puts the same thought as a matter of willingness: “whosoever will save his life, must be willing to lose it for my sake” (JST Luke 9:24).
    sources: [thayer, lds-scriptures, talmage-jesus-christ-29]
  - ref: 27
    phrase: Now is my soul troubled
    kind: christ
    title: Now is my soul troubled
    body: |
      Jesus's troubled soul, days before His arrest and in the temple, anticipates the agony He will suffer in Gethsemane. John does not tell of that agony: he names the garden only as the place of the arrest ([[John 18:1–12]]), though he was one of the three who were nearest to Jesus there, and the note on [[John 18:1]] takes up why. The words here are close to the prayer in the garden: “O my Father, if it be possible, let this cup pass from me: nevertheless not as I will, but as thou wilt” ([[Matt. 26:39]]).

      Whether “Father, save me from this hour” is a prayer or a question He puts to Himself is uncertain, and the King James punctuation leaves both open. Either way He turns from it at once, as He will in the garden: it was for this hour that He came, and what He asks is “Father, glorify thy name.”
    sources: [huntsman-monday, huntsman-lamb-of-god, ellicott-john, lds-scriptures]
  - ref: 31
    phrase: now shall the prince of this world be cast out
    kind: scripture
    title: The prince of this world
    body: |
      The prince of this world is the devil, the ruler of the part of mankind that has turned from God. John gives him the title three times, and each time with his defeat: here he is to be “cast out”; in the upper room, where Joseph Smith's translation names him “the prince of darkness, who is of this world,” he “cometh, but hath no power over me” (JST John 14:30); and the Comforter will convince the world “of judgment, because the prince of this world is judged” ([[John 16:11]]). Here, with the cross days away, Jesus says “now”: His suffering, death and resurrection are about to overthrow Satan's power.
    sources: [lds-scriptures, thayer, huntsman-monday]
  - ref: 32
    phrase: if I be lifted up from the earth, will draw all men unto me
    kind: christ
    title: Lifted up from the earth
    body: |
      This is the third time in John that Jesus speaks of being “lifted up.” He told Nicodemus that the Son of man must be lifted up as Moses lifted up the serpent in the wilderness ([[John 3:14–15]]), and told His hearers at the feast of Tabernacles, “When ye have lifted up the Son of man, then shall ye know that I am he” ([[John 8:28]]). John now says what the words meant: “This he said, signifying what death he should die” (verse 33). The words may also carry the sense of being raised to glory; read that way, the cross of shame is also the throne of glory.

      “All men” means what it says: lifted up on the cross, He draws Jew and Greek alike, and the Greeks who have come seeking Him can be read as the first of them. The risen Lord used these very words to the Nephites, and added what the drawing is for: “my Father sent me that I might be lifted up upon the cross; and after that I had been lifted up upon the cross, that I might draw all men unto me, that as I have been lifted up by men even so should men be lifted up by the Father, to stand before me, to be judged of their works” ([[3 Ne. 27:14]]). In the Book of Mormon the cross draws every person to stand before the Savior and be judged.
    sources: [huntsman-lamb-of-god, huntsman-monday, ellicott-john, lds-scriptures]
  - ref: 34
    phrase: We have heard out of the law that Christ abideth for ever
    kind: scripture
    title: Christ abideth for ever
    body: |
      The crowd's objection shows that they heard “lifted up” as a death, and could not square it with what they had been taught. “The law” here means the scriptures as a whole. The footnote points to the promise to David that his throne “shall be established for ever” ([[2 Sam. 7:16]]), and a psalm says that his seed “shall endure for ever” ([[Ps. 89:36]]); from such words some in Jesus's day concluded that the Messiah would live forever. The Jewish writings before Jesus looked for a Messiah who would triumph over Israel's enemies, and the thought that He would suffer and die is almost absent from them.

      Jesus does not answer “Who is this Son of man?” directly. He tells them instead to walk in the light while it is with them, and then He withdraws (verses 35–36).
    sources: [thayer, lds-scriptures, matson-fourth-gospel, hatch-messianism]
  - ref: 40
    phrase: He hath blinded their eyes, and hardened their heart
    kind: scripture
    title: Therefore they could not believe
    body: |
      Jesus has hidden Himself from them (verse 36), and John looks back on the result of His ministry: “though he had done so many miracles before them, yet they believed not on him” (verse 37). The footnote there points to King Benjamin, who foresaw that after all His mighty works men would “consider him a man” and crucify Him ([[Mosiah 3:9]]). John answers with two passages of Isaiah. The first is “Lord, who hath believed our report?” ([[Isa. 53:1]]). The second is from Isaiah's call ([[Isa. 6:9–10]]), the passage Jesus quoted when He taught in parables ([[Matt. 13:14–15]]) and Paul quoted to the Jews at Rome ([[Acts 28:26–27]]).

      “They could not believe” sounds like fate. John explains it no further than Isaiah's words, but he does not leave them as his last word: many of the rulers believed (verse 42), and what kept them silent was what they loved, the praise of men (verse 43). Matthew's form of the passage puts the closing of the eyes with the people themselves: “their eyes they have closed” ([[Matt. 13:15]]). The site's notes on [[Isa. 6:9–10]] take up who does the hardening in the prophet's commission, with the Book of Mormon's reading of it.
    sources: [lds-scriptures]
  - ref: 41
    phrase: These things said Esaias, when he saw his glory, and spake of him
    kind: christ
    title: When he saw his glory
    body: |
      Isaiah tells of his vision in the temple: “I saw also the Lord sitting upon a throne,” and “mine eyes have seen the King, the LORD of hosts” ([[Isa. 6:1]]; [[Isa. 6:5]]). John says the glory he saw was Jesus's. The footnote files the verse under the Savior's appearances before His birth, and Restoration scripture names Him: Jehovah, the God of Israel, whose name the King James Version prints as “LORD,” is the premortal Jesus Christ. Nephi says the same of Isaiah: “he verily saw my Redeemer, even as I have seen him” ([[2 Ne. 11:2]]). The note on [[Isa. 6:1]] says more.
    sources: [lds-scriptures, bd-jehovah]
  - ref: 43
    phrase: they loved the praise of men more than the praise of God
    kind: words
    title: The praise of men
    body: |
      Not all the leaders refused Him. Many “among the chief rulers,” John's word for members of the council ([[John 3:1]]; [[John 7:48]]), believed on Him, but feared the Pharisees, who could put them out of the synagogue, the threat that had already silenced the blind man's parents ([[John 9:22]]). John shows the cost of believing on Him openly. The footnote to “confess” points to one such man whom John names at the end: Joseph of Arimathea, a disciple “secretly for fear of the Jews” ([[John 19:38]]).

      The word translated “praise,” twice in this verse, is *doxa*, the word John uses for “glory,” and the same word stands two verses earlier, where Isaiah saw “his glory” (verse 41). They preferred the glory that comes from men to the glory that comes from God. Among the passages the footnote to “praise” gives is the Lord's rebuke to Joseph Smith: “you should not have feared man more than God” ([[D&C 3:7]]).
    sources: [thayer, matson-fourth-gospel, greek-nt, lds-scriptures]
  - ref: 49
    phrase: he gave me a commandment, what I should say, and what I should speak
    kind: scripture
    title: What I should say
    body: |
      Verses 44–50 are given as public teaching. Jesus “cried,” the word for teaching given aloud and in public, as when He taught in the temple at the feasts ([[John 7:28]]; [[John 7:37]]), though John gives these words no time or place after Jesus withdrew (verse 36). In them He gathers up His message: to believe on Him is to believe on the Father who sent Him, He came as a light, and He came to save the world, not to judge it.

      Yet His word judges. The one who rejects Him is judged by the very word he rejected, “in the last day” (verse 48), because that word was not Jesus's own but the Father's. The footnote to “speak” in verse 50 points to Moses' promise of a prophet like himself: “I will … put my words in his mouth; and he shall speak unto them all that I shall command him” ([[Deut. 18:18]]). The risen Lord told the Nephites plainly that He is that prophet: “Behold, I am he of whom Moses spake” ([[3 Ne. 20:23]]).
    sources: [thayer, lds-scriptures]

christ: |
  The chapter shows Jesus going to His death as Israel's King and the Lord of glory. Mary anoints Him for His burial, the crowds hail Him as the King of Israel, and He names His death as the hour of His glory: the grain of wheat that dies and bears much fruit, the Son of man lifted up on the cross to draw all men to Himself. John adds that the glory Isaiah saw in the temple was His.

  The same law reaches His servants. A life held back from God abides alone, as the kept seed does, and a life yielded in His service is kept unto life eternal (verses 24–25); “where I am, there shall also my servant be” (verse 26). The praise of God lasts, where the praise of men, which kept the believing rulers silent, is usually fleeting.

explore: |
  - **Isaiah's vision.** The notes on [[Isa. 6:1]] and [[Isa. 6:9–10]], the passage John quotes in verses 40–41.
  - **Lifted up.** [[John 3:14–15]], [[John 8:28]] and the risen Lord's words at Bountiful, [[3 Ne. 27:13–16]].
  - **The entry and the Old Testament.** “The Old Testament and Easter,” in *Ascending the Mountain of the Lord* (2013), reads the crowd's words and Zechariah's prophecy as signs of who Jesus is.

