chapter: 12
title: The Hour Is Come
tagline: At Bethany Mary anoints Jesus's feet against the day of His burial; the next day the crowds hail Him as the King of Israel; when Greeks ask to see Him, Jesus says the hour has come for the Son of man to be glorified, and a voice from heaven answers His prayer; John then weighs the unbelief that met Him, and gives His last public words.
when: 'Six days before the Passover and the day after ([[John 12:1]]; [[John 12:12]]), in Bethany and Jerusalem, at the start of the last week of Jesus’s life'

setting: |
  Chapter 12 follows the raising of Lazarus and the council's resolve to put Jesus to death ([[John 11:47–53]]). After a time out of sight at Ephraim ([[John 11:54]]), Jesus comes back, six days before the Passover, to Bethany, just over the Mount of Olives from Jerusalem, and the next day He rides into the city. It is the beginning of the last week of His life.

  The chapter is a bridge. It closes the first half of the Gospel, which tells the signs and discourses of Jesus's ministry, and opens the second, often called the “Book of Glory,” because John speaks of Jesus's death and resurrection as the means by which He is glorified and glorifies the Father. Two of its stories are told in the other Gospels as well. Matthew and Mark tell of an anointing at Bethany two days before the Passover, by an unnamed woman who pours the ointment on His head ([[Matt. 26:2–7]]; [[Mark 14:1–3]]); whether it is the same event is uncertain (see the note on verse 7). All four Gospels tell of the entry into Jerusalem. The coming of the Greeks and the discourse that follows are John's alone. After verse 36 Jesus withdraws from public teaching, and John stops to weigh the result of His ministry (verses 37–43) before he gives Jesus's last public words (verses 44–50).

thread: |
  **The hour that Jesus said at Cana was “not yet come” ([[John 2:4]]) has come, and the glory it brings turns out to pass through a death.** Mary anoints Jesus as though for burial; the crowds hail Him as King; and when Greeks ask to see Him, Jesus says, “The hour is come, that the Son of man should be glorified” (verse 23), and explains it at once with a seed that must fall into the ground and die (verse 24). He will be “lifted up from the earth” and so draw all men to Himself (verse 32), and John says plainly that the words pointed to the manner of His death (verse 33).

  The chapter is also a reckoning. The crowds come out because of Lazarus, the chief priests plan to kill Lazarus too, and though Jesus had done so many signs, “yet they believed not on him” (verse 37). John explains the unbelief from Isaiah, who had seen this same Lord's glory (verse 41), and sets beside it the rulers who believed and kept silent, because they “loved the praise of men more than the praise of God” (verse 43). The word for “praise” there is the word for “glory,” and the choice between the two kinds of glory is the one the chapter leaves with its reader.

sections:
  - range: 1-11
    heading: The supper at Bethany
    plain: |
      Six days before the Passover, Jesus came to Bethany, where Lazarus lived, the man He had raised from the dead. They gave a supper for Him there. Martha served, and Lazarus was one of those at the table with Him. Then Mary took a pound of very costly ointment of spikenard and anointed Jesus's feet and wiped His feet with her hair, and the house was filled with the fragrance of the ointment.

      One of His disciples, Judas Iscariot, Simon's son, who was going to betray Him, said, “Why was this ointment not sold for three hundred pence and the money given to the poor?” He said this not because he cared about the poor, but because he was a thief: he kept the money box and used to take what was put in it. Then Jesus said, “Let her alone. She has kept this for the day of my burial. You always have the poor with you, but you do not always have me.”

      A great crowd of the Jews learned that He was there, and they came, not only because of Jesus but also to see Lazarus, whom He had raised from the dead. So the chief priests made plans to put Lazarus to death as well, because on his account many of the Jews were going away and believing on Jesus.
  - range: 12-19
    heading: The King of Israel
    plain: |
      The next day the great crowd that had come to the feast heard that Jesus was coming to Jerusalem. They took branches of palm trees and went out to meet Him, crying, “Hosanna! Blessed is the King of Israel who comes in the name of the Lord!” Jesus found a young donkey and sat on it, as it is written: “Fear not, daughter of Zion. Behold, your King is coming, sitting on a donkey's colt.”

      His disciples did not understand these things at first. But when Jesus was glorified, they remembered that these things had been written of Him and that they had done these things to Him. The crowd that had been with Him when He called Lazarus out of the tomb and raised him from the dead kept bearing witness. That is why the crowd went out to meet Him: they had heard that He had done this sign. So the Pharisees said to one another, “You see that you are getting nowhere. Look, the world has gone after Him.”
  - range: 20-26
    heading: Greeks come to see Jesus
    plain: |
      Among those who went up to worship at the feast were some Greeks. They came to Philip, who was from Bethsaida in Galilee, and asked him, “Sir, we would like to see Jesus.” Philip went and told Andrew, and then Andrew and Philip told Jesus.

      Jesus answered them, “The hour has come for the Son of man to be glorified. Truly, truly, I say to you, unless a grain of wheat falls into the ground and dies, it remains alone; but if it dies, it bears much fruit. Whoever loves his life will lose it, and whoever hates his life in this world will keep it to eternal life. If anyone serves me, let him follow me, and where I am, there my servant will be also. If anyone serves me, my Father will honor him.”
  - range: 27-36
    heading: A voice from heaven
    plain: |
      “Now my soul is troubled. And what shall I say? Father, save me from this hour. But it was for this very purpose that I came to this hour. Father, glorify your name.” Then a voice came from heaven: “I have glorified it, and I will glorify it again.” The crowd standing there heard it and said that it had thundered; others said, “An angel has spoken to Him.” Jesus answered, “This voice did not come for my sake, but for yours. Now is the judgment of this world; now the prince of this world will be cast out. And I, if I am lifted up from the earth, will draw all men to myself.” He said this to show by what manner of death He was going to die.

      The crowd answered Him, “We have heard from the law that the Christ remains forever. How can you say that the Son of man must be lifted up? Who is this Son of man?” Jesus said to them, “The light is with you for a little while longer. Walk while you have the light, so that darkness does not overtake you; whoever walks in the darkness does not know where he is going. While you have the light, believe in the light, so that you may be children of light.” When Jesus had said these things, He went away and hid Himself from them.
  - range: 37-43
    heading: Yet they believed not
    plain: |
      Though He had done so many signs before them, they still did not believe on Him. So the word of the prophet Isaiah was fulfilled: “Lord, who has believed our report? And to whom has the arm of the Lord been revealed?” Therefore they could not believe, because Isaiah also said, “He has blinded their eyes and hardened their heart, so that they would not see with their eyes, nor understand with their heart, and be converted, and I would heal them.” Isaiah said these things when he saw His glory, and he spoke of Him.

      Even so, many even among the rulers believed on Him, but because of the Pharisees they did not confess it, so that they would not be put out of the synagogue. For they loved the glory that comes from men more than the glory that comes from God.
  - range: 44-50
    heading: Jesus cried and said
    plain: |
      Then Jesus cried out, “Whoever believes on me believes not on me but on Him who sent me. And whoever sees me sees Him who sent me. I have come as a light into the world, so that whoever believes on me should not remain in darkness. If anyone hears my words and does not believe, I do not judge him, for I did not come to judge the world but to save the world. Whoever rejects me and does not receive my words has one who judges him: the word that I have spoken will judge him on the last day. For I have not spoken on my own; the Father who sent me has given me a commandment, what I should say and what I should speak. And I know that His commandment is eternal life. So whatever I speak, I speak just as the Father has told me.”

notes:
  - ref: 3
    phrase: a pound of ointment of spikenard, very costly
    kind: history
    title: A pound of spikenard
    body: |
      Mary's gift was extravagant, and John wants the reader to feel it. Spikenard, or nard, is an aromatic oil from a small plant of the Himalayas. Because it came so far, it was costly in the lands of the New Testament, and it was usually imported in sealed alabaster jars that were opened only on special occasions. A pound was about twelve ounces, a great quantity of it. Judas values it at three hundred pence (verse 5), and a penny was a laborer's pay for a day ([[Matt. 20:2]]): the ointment was worth most of a year's work.

      What she did with it was as striking as what it cost. To anoint a guest's feet showed him unusual regard, and to do it with spikenard, in such abundance, was a homage rarely given even to kings. Then she wiped His feet with her hair. For a woman to uncover her hair in company was a scandal in her day, and the shock of it may have helped to embolden Judas's rebuke. John notes the fragrance that filled the house: no one present could miss what she had done.
    sources: [ball-plants-nt, ellicott-john, talmage-jesus-christ-29, van-dyke-huntington-marys, lds-scriptures]
  - ref: 6
    phrase: because he was a thief, and had the bag
    kind: history
    title: He was a thief
    body: |
      Matthew says “his disciples” were indignant at the waste and Mark says “some” ([[Matt. 26:8]]; [[Mark 14:4]]); John names Judas, and says why he spoke: not because he cared for the poor. He was the treasurer of the Twelve, keeper of the common fund from which their needs were met and gifts to the poor were made. The “bag” is a word for a small box or purse for money (the same word is used of it in [[John 13:29]]). “Bare what was put therein” can be read as no more than “carried it,” but John uses the same verb for carrying a thing away ([[John 20:15]]), and the clause probably means that he helped himself to it.

      John has already named Judas as the one “which should betray him” (verse 4); the betrayal itself waits for the next chapter ([[John 13:2]]).
    sources: [ellicott-john, thayer]
  - ref: 7
    phrase: 'against the day of my burying hath she kept this'
    kind: christ
    title: Against the day of my burying
    body: |
      Jesus takes Mary's act as a preparation for His death. The King James wording is hard to follow, and Joseph Smith's translation makes it plain: “for she hath preserved this ointment until now, that she might anoint me in token of my burial.” Bodies were anointed for the grave; Mary anoints Him while He is alive, and Jesus gives the deed a prophetic meaning. Whether she knew how near His death was, the record does not say. She may have been told, given her family's closeness to Him; she may have gathered it from His words to the apostles; or she may have been moved by inspiration.

      The anointing also points the other way, toward the entry of the next day. In ancient Israel rightful kings and priests were anointed, and “Messiah,” like its Greek equivalent “Christ,” means “the anointed.” Anointed at Bethany, Jesus rides into Jerusalem as its true King (verses 12–15).

      Matthew and Mark tell of a woman who anoints His head, later in the week, in the house of Simon the leper ([[Matt. 26:6–13]]; [[Mark 14:3–9]]). Many scholars take the two as accounts of one event. But John names Mary, has her anoint His feet, and places the supper before the entry, so it is possible that there were two anointings.
    sources: [lds-scriptures, ellicott-john, huntsman-preludes-last-week, bd-messiah, huntsman-wednesday, talmage-jesus-christ-29]
  - ref: 10
    phrase: the chief priests consulted that they might put Lazarus also to death
    kind: history
    title: Lazarus also
    body: |
      Lazarus had done nothing; his offense was to be alive. “The Jews” of verses 9 and 11 are not Jesus's enemies here. They are the people of standing who had come out from Jerusalem to comfort Martha and Mary ([[John 11:19]]), and they were divided: many of them came to believe in Jesus because of Lazarus, while others reported to the Pharisees. The hostility in this verse belongs to the chief priests.

      The chief priests were for the most part Sadducees, who taught that there is no resurrection ([[Acts 23:8]]). A man walking about Bethany four days after his burial was a living witness to the One they had resolved to kill, and a denial of their own doctrine. The verse says they “consulted,” took counsel on it, not that they settled on a plan. In John the raising of Lazarus is what finally sets the authorities against Jesus, and the entry of the next day makes it worse: the crowd that saw Lazarus come out of the grave keeps telling of it, the people go out to meet Jesus because of the sign (verses 17–18; John's word, which the King James Version renders “miracle,” is *sēmeion*, “sign”), and the Pharisees despair: “behold, the world is gone after him” (verse 19).
    sources: [huntsman-preludes-last-week, ellicott-john, huntsman-palm-sunday, huntsman-gospel-john]
  - ref: 13
    phrase: 'Hosanna: Blessed is the King of Israel that cometh in the name of the Lord'
    kind: words
    title: Hosanna to the King of Israel
    body: |
      The crowd's cry comes from Psalm 118, the last of the psalms sung at the Passover, and a psalm that seems first to have been sung in processions going up to the temple, which suited a crowd going up to Jerusalem in the days before the feast. “Hosanna” is an Aramaic form of the Hebrew of [[Ps. 118:25]], “Save now” or “Save us, we pray,” and “Blessed be he that cometh in the name of the LORD” is the next verse ([[Ps. 118:26]]). John's crowd adds a title of its own, “the King of Israel,” and so makes the welcome a royal acclamation, as Matthew does with “the Son of David” ([[Matt. 21:9]]).

      The donkey belongs to the same picture. Solomon rode his father's mule to his anointing at Gihon while the people shouted “God save king Solomon” ([[1 Kgs. 1:33–39]]), and Zechariah had promised that Zion's King would come “lowly, and riding upon an ass” ([[Zech. 9:9]]). John quotes Zechariah in a shortened form (verse 15). The entry was an acted prophecy, one of the few moments in His ministry when Jesus was openly hailed as the Messiah He was.
    sources: [huntsman-palm-sunday, ellicott-john]
  - ref: 16
    phrase: These things understood not his disciples at the first
    kind: scripture
    title: Understood not at the first
    body: |
      John says plainly that the disciples did not at first see that the entry fulfilled Zechariah. Only “when Jesus was glorified” did they remember the scripture and see what they had done. He says the same of the cleansing of the temple ([[John 2:22]]). The remembering came by the Spirit, as Jesus had promised them: the Comforter, the Holy Ghost, would “bring all things to your remembrance, whatsoever I have said unto you” ([[John 14:26]]).
    sources: [ellicott-john]
  - ref: 20
    phrase: certain Greeks among them that came up to worship at the feast
    kind: history
    title: Certain Greeks
    body: |
      These were not Greek-speaking Jews but Greeks by birth, Gentiles. That they “came up to worship at the feast” suggests they were converts to the God of Israel who went up to Jerusalem for the feasts. Such people were admitted to the temple's outer court, the court of the Gentiles, but could go no farther.

      They come to Philip, and Philip goes to Andrew. The two are the only apostles with Greek names, and they came from the same town ([[John 1:44]]). John names Philip's town here perhaps to explain why the Greeks came to him: they may have come from near Bethsaida, or from one of the Greek cities of the Decapolis. Philip then consults Andrew, who was closer to the Lord, and the two bring the request together. John never says whether the Greeks were brought in. What he records is what their coming meant to Jesus (verse 23).
    sources: [ellicott-john, talmage-jesus-christ-29]
  - ref: 23
    phrase: The hour is come, that the Son of man should be glorified
    kind: christ
    title: The hour is come
    body: |
      Until now the hour has always been future: “Mine hour is not yet come,” Jesus told His mother at Cana ([[John 2:4]]), and twice in Jerusalem no one could lay hands on Him “because his hour was not yet come” ([[John 7:30]]; [[John 8:20]]). Now, at the request of a few Gentiles, He says it has come. Men from outside Israel seek Him at the very moment the priests and rulers are seeking to kill Him, and they recall the “other sheep” for whose gathering the Shepherd must lay down His life ([[John 10:16–18]]). They are the first fruits of the world He will draw to Himself (verse 32).

      John describes Jesus's saving death and resurrection as the means by which He is glorified and glorifies the Father, and Jesus explains at once that the way to that glory leads through death (verse 24). For Latter-day Saint readers the Lord's own words to Moses fit the chapter: “this is my work and my glory—to bring to pass the immortality and eternal life of man” ([[Moses 1:39]]).
    sources: [ellicott-john, huntsman-gospel-john]
  - ref: 24
    phrase: Except a corn of wheat fall into the ground and die
    kind: symbol
    title: A corn of wheat
    body: |
      “Corn” here means grain or seed, and the image is a farmer's. A grain of wheat kept in the barn stays a single grain. Sown in the ground, it is lost to sight, and its life breaks out into blade and stalk and ear, and the one grain becomes many. The farmer who keeps his seed to save it gets no increase.

      Jesus applies the law first to Himself. His death is not life lost but life multiplied: as the one buried grain becomes a harvest, so through His dying He will bring forth a harvest of all who come to Him. The verses that follow apply the same law to His disciples (verses 25–26).
    sources: [ellicott-john, talmage-jesus-christ-29, lds-scriptures]
  - ref: 25
    phrase: he that hateth his life in this world
    kind: words
    title: Hateth his life
    body: |
      “Hate” is the ordinary Greek word for hatred, and Jesus does not ask His disciples to despise the life God gave them. The language of love and hate here, as in [[Luke 14:26]], states a preference in the strongest terms, where English would speak of caring about one thing and setting another aside. To cling to life so that one will not put it at risk in God's service, or give it up when that is asked, is to lose the eternal life it might have become. To put God's call so far above life that the love of life looks like hatred beside it is to keep it, though for a time it seems lost, like the grain in the ground.

      Joseph Smith's translation of the parallel saying in Luke puts the same thought as a matter of willingness: “whosoever will save his life, must be willing to lose it for my sake” (JST Luke 9:24).
    sources: [thayer, talmage-jesus-christ-29, lds-scriptures]
  - ref: 27
    phrase: Now is my soul troubled
    kind: christ
    title: Now is my soul troubled
    body: |
      John does not tell of Jesus's agony in Gethsemane. He names the garden only as the place of the arrest ([[John 18:1–12]]), though he was one of the three who were nearest to Jesus there. Why he left it out is taken up in the note on [[John 18:1]]. But the troubled soul is here, days before, probably in the temple courts, and the words echo the prayer in the garden: “O my Father, if it be possible, let this cup pass from me: nevertheless not as I will, but as thou wilt” ([[Matt. 26:39]]).

      The struggle is real and brief. Whether “Father, save me from this hour” is a prayer or a question He puts to Himself is uncertain, and the King James punctuation leaves both open. Either way He turns from it at once: it was for this hour that He came. What He asks is “Father, glorify thy name.” The Lord's own account of His suffering, given to Joseph Smith, runs the same way: He would “that I might not drink the bitter cup, and shrink—Nevertheless, glory be to the Father, and I partook” ([[D&C 19:18–19]]).
    sources: [huntsman-lamb-of-god, ellicott-john, lds-scriptures]
  - ref: 29
    phrase: said that it thundered
    kind: history
    title: It thundered
    body: |
      The Father answers aloud. The voice was not an inner whisper of comfort to Jesus alone but an outward reality, heard by the people around Him, who made of it what they could. Some heard only thunder; others said an angel had spoken; some may have understood the words as Jesus did.

      Jesus tells them the voice came “for your sakes” (verse 30). He did not need it to know that the Father heard Him (compare [[John 11:41–42]]). It was a witness to them, for ears ready to hear, that the Father stood behind the mission of His Son.
    sources: [talmage-jesus-christ-29, ellicott-john]
  - ref: 31
    phrase: now shall the prince of this world be cast out
    kind: scripture
    title: The prince of this world
    body: |
      The prince of this world is Satan. Where Jesus uses the title again in the upper room, Joseph Smith's translation names him “the prince of darkness, who is of this world,” who “cometh, but hath no power over me” (JST John 14:30). Here, with the cross only days away, Jesus speaks as though the cross were already past and Satan's defeat already sealed.

      The verse's two halves differ in tense, and one reading makes the difference its point: the judgment of this world is the immediate result of His death, while the casting out of its prince is put in the future, with the drawing of all men in the next verse, as a victory that the truth goes on winning over time.
    sources: [lds-scriptures, talmage-jesus-christ-29, ellicott-john]
  - ref: 32
    phrase: if I be lifted up from the earth, will draw all men unto me
    kind: christ
    title: Lifted up from the earth
    body: |
      This is the third time in John that Jesus speaks of being “lifted up.” He told Nicodemus that the Son of man must be lifted up as Moses lifted up the serpent in the wilderness ([[John 3:14–15]]), and told His hearers at the feast of Tabernacles, “When ye have lifted up the Son of man, then shall ye know that I am he” ([[John 8:28]]). John now says what the words meant: “This he said, signifying what death he should die” (verse 33). The words can also carry the sense of being raised to glory, and looking back John saw both in the cross: in the cross of shame he saw the throne of glory.

      “All men” means what it says. The Greeks who have come seeking Him are only the first. The risen Lord used these very words to the Nephites, and added what the drawing is for: “my Father sent me that I might be lifted up upon the cross; and after that I had been lifted up upon the cross, that I might draw all men unto me, that as I have been lifted up by men even so should men be lifted up by the Father, to stand before me, to be judged of their works” ([[3 Ne. 27:14]]). In the Book of Mormon the cross draws every person to stand before the Savior and be judged.
    sources: [huntsman-lamb-of-god, ellicott-john, lds-scriptures]
  - ref: 34
    phrase: We have heard out of the law that Christ abideth for ever
    kind: scripture
    title: Christ abideth for ever
    body: |
      The crowd's objection shows that they heard “lifted up” as a death, and could not square it with what they had been taught. “The law” here means the scriptures as a whole, and they may have had in mind passages like the promise that David's seed “shall endure for ever, and his throne as the sun before me” ([[Ps. 89:36]]), or Isaiah's “Of the increase of his government and peace there shall be no end” ([[Isa. 9:7]]). The teachers of the day read such passages of a Messiah who would reign on earth, which left no room for one who would die, and a crowd that had hailed Him as King the day before may well have expected a Christ who would free them from Rome.

      Jesus does not answer “Who is this Son of man?” directly. He tells them instead to walk in the light while it is with them, and then He withdraws (verses 35–36).
    sources: [ellicott-john, talmage-jesus-christ-29]
  - ref: 40
    phrase: He hath blinded their eyes, and hardened their heart
    kind: scripture
    title: Therefore they could not believe
    body: |
      After verse 36 Jesus's public teaching is over, and John looks back on its result: “though he had done so many miracles before them, yet they believed not on him” (verse 37). He answers with two passages of Isaiah. The first is “Lord, who hath believed our report?” ([[Isa. 53:1]]). The second is from Isaiah's call ([[Isa. 6:9–10]]), the passage Jesus had used to explain why He taught in parables ([[Matt. 13:13–15]]) and Paul would use of the Jews at Rome who rejected the gospel ([[Acts 28:25–28]]).

      “They could not believe” sounds like fate. One reading takes it through the principle of Jesus's last public words, “Walk while ye have the light, lest darkness come upon you” (verse 35): light used grows and light neglected is lost, until a rejection long chosen becomes a blindness the will no longer masters. On that reading the blinding comes only to eyes that will not see, and the same passages show eyes that were not blinded: Isaiah, John and Paul were themselves of Israel, and John adds at once that many of the rulers believed (verse 42). The site's notes on [[Isa. 6:9–10]] take up the hard words of the prophet's commission itself.
    sources: [ellicott-john]
  - ref: 41
    phrase: These things said Esaias, when he saw his glory, and spake of him
    kind: christ
    title: When he saw his glory
    body: |
      Isaiah tells of his vision in the temple: “I saw also the Lord sitting upon a throne, high and lifted up” ([[Isa. 6:1]]). John says the glory he saw was Jesus's. The Lord on the throne in Isaiah 6 was the Word before He was made flesh, who was in the beginning with God and was God ([[John 1:1]]), and so Isaiah, having seen Him, spoke of Him. The Book of Mormon says the same: Nephi says of Isaiah that “he verily saw my Redeemer, even as I have seen him” ([[2 Ne. 11:2]]). The note on [[Isa. 6:1]] says more.
    sources: [ellicott-john, lds-scriptures]
  - ref: 43
    phrase: they loved the praise of men more than the praise of God
    kind: words
    title: The praise of men
    body: |
      Not all the leaders refused Him. Many “among the chief rulers,” even members of the council, believed on Him, but feared the Pharisees, who could put them out of the synagogue, the threat already made in [[John 9:22]]. The footnote to “confess” points to one such man whom John names at the end: Joseph of Arimathea, a disciple “secretly for fear of the Jews” ([[John 19:38]]).

      The word translated “praise,” twice in this verse, is *doxa*, the word John uses for “glory,” and the same word stands two verses earlier, where Isaiah saw “his glory” (verse 41). They preferred the glory that comes from men to the glory that comes from God. Jesus had put the same choice to His hearers in Jerusalem as a question: “How can ye believe, which receive honour one of another, and seek not the honour that cometh from God only?” ([[John 5:44]]).
    sources: [ellicott-john, greek-nt, lds-scriptures]
  - ref: 49
    phrase: he gave me a commandment, what I should say, and what I should speak
    kind: scripture
    title: What I should say
    body: |
      Verses 44–50 are not a private word to the disciples. Jesus “cried,” as He did in the temple at the feasts ([[John 7:28]]; [[John 7:37]]), so this is public teaching, which John sets at the close of His public ministry: to believe on Him is to believe on the Father who sent Him, He came as a light, and He came to save the world, not to judge it.

      Yet His word judges. The one who rejects Him is judged by the very word he rejected, “in the last day” (verse 48), because that word was not Jesus's own but the Father's. The footnote to “speak” in verse 50 points to Moses' promise of a prophet like himself: “I will … put my words in his mouth; and he shall speak unto them all that I shall command him” ([[Deut. 18:18]]). The risen Lord told the Nephites plainly that He is that prophet: “Behold, I am he of whom Moses spake” ([[3 Ne. 20:23]]).
    sources: [ellicott-john, lds-scriptures]

christ: |
  The chapter shows Jesus going to His death as Israel's King and the Lord of glory. Mary anoints Him for His burial, the crowds hail Him as the King of Israel, and He names His death as the hour of His glory: the grain of wheat that dies and bears much fruit, the Son of man lifted up on the cross to draw all men to Himself. John adds that the glory Isaiah saw in the temple was His.

  The same law reaches His servants. A life held back from God abides alone, as the kept seed does, and a life yielded in His service is kept unto life eternal (verses 24–25); “where I am, there shall also my servant be” (verse 26). The praise of God lasts, where the praise of men, which kept the believing rulers silent, is fleeting.

explore: |
  - **Isaiah's vision.** The notes on [[Isa. 6:1]] and [[Isa. 6:9–10]], the passage John quotes in verses 40–41.
  - **Lifted up.** [[John 3:14–15]], [[John 8:28]] and the risen Lord's words at Bountiful, [[3 Ne. 27:13–16]].
  - **The entry for Holy Week.** “Palm Sunday: The True King Comes to Jerusalem,” in *Greater Love Hath No Man*, reads the four accounts of the entry together, with Zechariah and Psalm 118.

