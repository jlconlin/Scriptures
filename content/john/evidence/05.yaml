chapter: 5
claims:
  # ---- setting, thread, plain words
  - where: setting
    claim: 'The Sabbath miracles of John 5 and 9 fall within a part of John showing how Jesus fulfilled the meaning of the feasts'
    key: huntsman-sabbath-john
    url: 'https://rsc.byu.edu/sacred-time/bringing-forth-new-creation'
    quote: 'These Johannine Sabbath miracles also fall within a subsection of the Book of Signs that illustrates how Jesus fulfilled the meaning of various Jewish festivals such as Passover, Tabernacles, and Dedication.'
  - where: setting
    claim: 'Later manuscripts read “the feast,” suggesting Passover; older ones lack the article, so any feast may be meant'
    key: huntsman-sabbath-john
    url: 'https://rsc.byu.edu/sacred-time/bringing-forth-new-creation'
    quote: 'Although many later Byzantine manuscripts read “the feast” (Greek, hē heortē),[14] perhaps suggesting Passover, older and arguably more secure manuscripts lack the definite article'
  - where: setting
    claim: 'The value of the miracle and discourse does not depend on identifying the feast'
    key: talmage-jesus-christ-15
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-15?lang=eng'
    quote: 'The miracle wrought on the occasion, and the doctrinal discourse delivered as a result thereof, depend for their value in no degree on the determination of date.'
  - where: setting
    claim: 'The Bethesda and man-born-blind stories run along the same lines; both on the Sabbath'
    key: huntsman-sabbath-john
    url: 'https://rsc.byu.edu/sacred-time/bringing-forth-new-creation'
    quote: 'Both stories in John have Jesus take the initiative (5:6; 9:6); both involve the waters of pools (5:2; 9:7); both occur on the Sabbath'
  - where: setting
    claim: 'Each of John’s miracles is a sign followed by teaching about who Jesus is'
    key: huntsman-sabbath-john
    url: 'https://rsc.byu.edu/sacred-time/bringing-forth-new-creation'
    quote: 'Additionally, each of the miracles is followed by typically Johannine teaching in which Jesus speaks about himself, his divine identity, and his saving and exalting mission.'
  - where: setting
    claim: 'The Synoptics have Sabbath healings of their own (Mark 3; Luke 13; Luke 14)'
    key: huntsman-sabbath-john
    url: 'https://rsc.byu.edu/sacred-time/bringing-forth-new-creation'
    quote: 'Just as Jesus restores a man with a withered hand (Mark 3:1–6; parallels Matthew 12:1–8; Luke 6:1–5), releases a woman bent over from a long infirmity (Luke 13:10–17), and heals a man with “dropsy,”'
  - where: thread
    claim: 'The command to rise intimates resurrection'
    key: huntsman-sabbath-john
    url: 'https://rsc.byu.edu/sacred-time/bringing-forth-new-creation'
    quote: 'uses a Greek verb (egeire) and an image that intimates resurrection'
  - where: thread
    claim: 'The greater works of 5:20 are resurrection and judgment, shown in 5:21–29'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/5.htm'
    quote: 'The following verses (John 5:21-29) show what these greater works are. They are the Resurrection and the judgment'
  - where: thread
    claim: 'The discourse ends with the witnesses to His divinity and the scriptures as witnesses'
    key: huntsman-sabbath-john
    url: 'https://rsc.byu.edu/sacred-time/bringing-forth-new-creation'
    quote: 'concludes with discussion of witnesses of his divinity (vv. 31–38) and the role of scripture as additional, vital witnesses of him and his saving work (vv. 39–47)'
  - where: section 1 plain
    claim: '“Sheep market” is the sheep gate'
    key: thayer
    url: 'https://biblehub.com/greek/4262.htm'
    quote: 'the sheep gate, John 5:2'
  - where: section 2 plain
    claim: 'Jesus passed away among the crowd'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/5.htm'
    quote: 'it would be better to give a freer rendering—For Jesus disappeared among the multitude which was in the place.'
  - where: section 2 plain
    claim: '“Had broken” is imperfect: was breaking'
    key: huntsman-sabbath-john
    url: 'https://rsc.byu.edu/sacred-time/bringing-forth-new-creation'
    quote: 'While the KJV reads “had broken the Sabbath,” the Greek verb (eluen) is actually in the imperfect tense'
  - where: 'note 5:2 “The pool by the sheep gate”'
    claim: 'The Greek adjective means pertaining to sheep, with “gate” understood, as in Nehemiah'
    key: thayer
    url: 'https://biblehub.com/greek/4262.htm'
    quote: 'pertaining to sheep: ἡ προβατικῇ, SC. πύλη (which is added in Nehemiah 3:1, 32; Nehemiah 12:39, for הַצֹּאן שַׁעַר), the sheep gate, John 5:2'
  - where: 'note 5:2 “The pool by the sheep gate”'
    claim: 'Some join the adjective to the pool instead'
    key: thayer
    url: 'https://biblehub.com/greek/4262.htm'
    quote: 'would connect προβατικός with the immediately following κολυμβήθρα'
  - where: 'note 5:2 “The pool by the sheep gate”'
    claim: 'Near the temple; the porches were covered colonnades giving shade'
    key: van-dyke-miracles-john
    url: 'https://rsc.byu.edu/vol-9-no-3-2008/miracles-jesus-gospel-john'
    quote: 'Near the temple at Jerusalem there was a pool with five porches that was called Bethesda. The porches were shaded by covered colonnades'
  - where: 'note 5:4 “The angel and the troubled water”'
    claim: 'Healing powers were popularly attributed to an angel; possibly an intermittent spring'
    key: bd-bethesda
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/bethesda?lang=eng'
    quote: 'It seems to have had medicinal properties, popularly attributed to the “troubling” of the waters by an angel (John 5:4). There was possibly an intermittent spring flowing into the pool, which produced a bubbling at the surface.'
  - where: 'note 5:4 “The angel and the troubled water”'
    claim: 'The angel explanation was inserted into later versions of the text'
    key: huntsman-sabbath-john
    url: 'https://rsc.byu.edu/sacred-time/bringing-forth-new-creation'
    quote: 'This movement of water was subsequently explained by the curious story of an angel coming down to trouble the waters (John 5:4), an explanation that was inserted into later versions of the text.'
  - where: 'note 5:4 “The angel and the troubled water”'
    claim: 'The moving of the water may belong to the original story'
    key: huntsman-sabbath-john
    url: 'https://rsc.byu.edu/sacred-time/bringing-forth-new-creation'
    quote: 'Nevertheless, the moving of the water, from whatever cause, that preceded healing may have been part of the original story.'
  - where: 'note 5:4 “The angel and the troubled water”'
    claim: 'The tradition of the angel; the miracle turned people to Christ’s power'
    key: van-dyke-miracles-john
    url: 'https://rsc.byu.edu/vol-9-no-3-2008/miracles-jesus-gospel-john'
    quote: 'It invited people to look to Christ and His power rather than to trust in superstition or false traditions of the day.'
  - where: 'note 5:6 “Wilt thou be made whole?”'
    claim: 'The question fixed the man’s attention on Jesus and woke his yearning; he thought only of the pool'
    key: talmage-jesus-christ-15
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-15?lang=eng'
    quote: 'The man’s attention was drawn to Him, fixed upon Him; the question aroused in the sufferer’s heart renewed yearning for the health and strength of which he had been bereft since the days of his youth.'
  - where: 'note 5:6 “Wilt thou be made whole?”'
    claim: 'The man’s answer shows he thought only of the pool'
    key: talmage-jesus-christ-15
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-15?lang=eng'
    quote: 'he thought only of the rumored virtues of Bethesda pool'
  - where: 'note 5:6 “Wilt thou be made whole?”'
    claim: 'In both John 5 and John 9 Jesus takes the initiative'
    key: huntsman-sabbath-john
    url: 'https://rsc.byu.edu/sacred-time/bringing-forth-new-creation'
    quote: 'Both stories in John have Jesus take the initiative (5:6; 9:6)'
  - where: 'note 5:8 “Rise”'
    claim: 'Egeire intimates resurrection; Alma 40:23'
    key: huntsman-sabbath-john
    url: 'https://rsc.byu.edu/sacred-time/bringing-forth-new-creation'
    quote: 'uses a Greek verb (egeire) and an image that intimates resurrection, the healing of his particular infirmity representing the full, complete healing of the body that comes at the Resurrection.'
  - where: 'note 5:8 “Rise”'
    claim: 'The bed is a mat, a small light item'
    key: huntsman-sabbath-john
    url: 'https://rsc.byu.edu/sacred-time/bringing-forth-new-creation'
    quote: 'developing interpretations of the Jewish law may have prohibited the transport of even such a small, light item on the Sabbath.'
  - where: 'note 5:10 “Not lawful to carry thy bed”'
    claim: '“The Jews” here are His opponents among the Jewish leadership in Jerusalem'
    key: huntsman-sabbath-john
    url: 'https://rsc.byu.edu/sacred-time/bringing-forth-new-creation'
    quote: 'Jesus engages in a sharp exchange with “the Jews” (John 5:16–18), his opponents among the Jewish leadership'
  - where: 'note 5:10 “Not lawful to carry thy bed”'
    claim: 'The opponents were the Jewish leaders in Jerusalem'
    key: huntsman-sabbath-john
    url: 'https://rsc.byu.edu/sacred-time/bringing-forth-new-creation'
    quote: 'By undercutting the interpretations of the Jewish leaders in Jerusalem, however, he was threatening their power.'
  - where: 'note 5:10 “Not lawful to carry thy bed”'
    claim: 'Jeremiah forbade bearing burdens on the Sabbath; Nehemiah; the rabbis extended it to any burden'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/5.htm'
    quote: 'the bearing of burdens was specially forbidden in the Prophecy of Jeremiah: “Take heed to yourselves, and bear no burden on the Sabbath day” (Jeremiah 17:21; comp. Nehemiah 13:15 et seq.), and that the Rabbis pressed this to include a burden of any kind.'
  - where: 'note 5:10 “Not lawful to carry thy bed”'
    claim: 'Such rules began among groups like the Pharisees and Qumran and were not normative until later'
    key: huntsman-sabbath-john
    url: 'https://rsc.byu.edu/sacred-time/bringing-forth-new-creation'
    quote: 'Such regulations began in certain sectarian circles—in groups such as the Pharisees and the Qumran community—but do not appear to have been normative until later in the rabbinic period'
  - where: 'note 5:10 “Not lawful to carry thy bed”'
    claim: 'The hedges about the law were sincere efforts'
    key: huntsman-sabbath-john
    url: 'https://rsc.byu.edu/sacred-time/bringing-forth-new-creation'
    quote: 'such “hedges about the law” likely developed as sincere efforts to worship God and live his law more fully.'
  - where: 'note 5:10 “Not lawful to carry thy bed”'
    claim: 'They did not punish the man; the issue was the authority Jesus assumed over the Sabbath'
    key: huntsman-sabbath-john
    url: 'https://rsc.byu.edu/sacred-time/bringing-forth-new-creation'
    quote: 'The bigger issue, however, may have been the authority that Jesus’s opponents felt he had assumed in determining what was and was not appropriate for the Sabbath'
  - where: 'note 5:14 “Sin no more”'
    claim: 'One reading connects his past suffering with his own sin'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/5.htm'
    quote: 'These words connect his past sufferings with individual sin.'
  - where: 'note 5:14 “Sin no more”'
    claim: 'The present imperative: be a sinner no longer'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/5.htm'
    quote: 'The imperative is present, and points to a permanent condition of life—“Be not any more a sinner.”'
  - where: 'note 5:14 “Sin no more”'
    claim: 'Another reading: not past sin as cause, but continuing sin could bring spiritual death; in John sin is failing to believe'
    key: huntsman-sabbath-john
    url: 'https://rsc.byu.edu/sacred-time/bringing-forth-new-creation'
    quote: 'This does not suggest that previous sin had been the direct cause of his ailment but rather that continuing in sin might bring about something worse—spiritual death rather than a more severe illness.'
  - where: 'note 5:14 “Sin no more”'
    claim: 'In John sin is primarily failing to believe; the call is to trust in Jesus'
    key: huntsman-sabbath-john
    url: 'https://rsc.byu.edu/sacred-time/bringing-forth-new-creation'
    quote: 'Because in John sin is primarily a function of failing to believe, Jesus’s admonition that the man “stop sinning” is actually a call for him to leave his unbelief and instead place his trust in Jesus.'
  - where: 'note 5:14 “Sin no more”'
    claim: 'His report to the Jews need not have been in defiance; he may have supposed they would recognize the prophet'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/5.htm'
    quote: 'he felt that this power came from a prophet sent by God, and that he told this to those who were God’s representatives to the nation, supposing that they would recognise Him too.'
  - where: 'note 5:17 “My Father worketh hitherto”'
    claim: 'Contemporary Jewish belief that God continued to work in sustaining creation'
    key: huntsman-sabbath-john
    url: 'https://rsc.byu.edu/sacred-time/bringing-forth-new-creation'
    quote: 'acknowledged contemporary Jewish belief that God had continued to work since the Creation through his constant nurture, sustaining, and preservation of that creation.'
  - where: 'note 5:17 “My Father worketh hitherto”'
    claim: 'Hitherto traditionally until now; its emphatic position may suggest culmination, even until now'
    key: huntsman-sabbath-john
    url: 'https://rsc.byu.edu/sacred-time/bringing-forth-new-creation'
    quote: 'The emphatic position of this adverbial phrase before the verb, however, could suggest culmination, meaning that God has been working “even until now,” the time when Christ has come to bring the promised Sabbath rest to fruition.'
  - where: 'note 5:17 “My Father worketh hitherto”'
    claim: 'God does not break the Sabbath by sustaining life'
    key: van-dyke-miracles-john
    url: 'https://rsc.byu.edu/vol-9-no-3-2008/miracles-jesus-gospel-john'
    quote: 'does God break the Sabbath when He oversees the rising of the sun, the rotation of the earth, and other conditions essential for sustaining life on His holy day?'
  - where: 'note 5:17 “My Father worketh hitherto”'
    claim: 'Sabbath rest is rest from worldly pursuits, not all labor'
    key: van-dyke-miracles-john
    url: 'https://rsc.byu.edu/vol-9-no-3-2008/miracles-jesus-gospel-john'
    quote: 'God’s rest and therefore our rest on the Sabbath is not a rest from all labor but a rest from worldly pursuits.'
  - where: 'note 5:17 “My Father worketh hitherto”'
    claim: 'The verb is imperfect, perhaps meaning repeated violation'
    key: huntsman-sabbath-john
    url: 'https://rsc.byu.edu/sacred-time/bringing-forth-new-creation'
    quote: 'the Greek verb (eluen) is actually in the imperfect tense, which might suggest that their anger was not due to this single incident but because he had, in their view, repeatedly violated the Sabbath. Interestingly, this very verb can be used to mean “to loose”'
  - where: 'note 5:19 “What he seeth the Father do”'
    claim: 'Joseph Smith, in words close to verse 26: the Son does what the Father did, lay down his body and take it up again'
    key: jsp-discourse-1844-04-07
    url: 'https://www.josephsmithpapers.org/paper-summary/discourse-7-april-1844-as-published-in-times-and-seasons/3'
    quote: 'Jesus said, as the Father hath power in himself, even so hath the Son power; to do what? why what the Father did, that answer is obvious; in a manner to lay down his body and take it up again.'
  - where: 'note 5:19 “What he seeth the Father do”'
    claim: 'Joseph Smith called these first principles, to know the character of God'
    key: jsp-discourse-1844-04-07
    url: 'https://www.josephsmithpapers.org/paper-summary/discourse-7-april-1844-as-published-in-times-and-seasons/3'
    quote: 'These are incomprehensible ideas to some, but they are the simple and first principles of the gospel, to know for a certainty the character of God'
  - where: 'note 5:24 “Hath everlasting life, now”'
    claim: 'Believers already have eternal life, a new spiritual life'
    key: huntsman-sabbath-john
    url: 'https://rsc.byu.edu/sacred-time/bringing-forth-new-creation'
    quote: 'Those who believe are described as already having eternal life, and they have passed from spiritual death to a new kind of spiritual life.'
  - where: 'note 5:24 “Hath everlasting life, now”'
    claim: 'Four verses later the resurrection is future'
    key: huntsman-sabbath-john
    url: 'https://rsc.byu.edu/sacred-time/bringing-forth-new-creation'
    quote: 'Just four verses after Jesus taught that those who hear and believe already have eternal life, he went on to prophesy'
  - where: 'note 5:24 “Hath everlasting life, now”'
    claim: 'Latter-day Saint usage of eternal life differs; John defines it in 17:3'
    key: huntsman-sabbath-john
    url: 'https://rsc.byu.edu/sacred-time/bringing-forth-new-creation'
    quote: 'Because Restoration teaching usually defines eternal life as the kind of immortal, exalted life that God and the Risen Christ have enjoyed forever in their presence, Latter-day Saint readers in particular must bear in mind the way eternal life is understood in John.'
  - where: 'note 5:25 “The dead shall hear”'
    claim: 'Jesus promises to take the gospel to the dead; the resurrection is named after it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/5?lang=eng'
    quote: 'Jesus promises to take the gospel to the dead—Man is resurrected, judged, and assigned his glory by the Son'
  - where: 'note 5:27 “Because he is the Son of man”'
    claim: 'The title is Jesus’s own for Himself; it carries the idea of head of the kingdom and judge of all'
    key: bd-son-of-man
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/son-of-man?lang=eng'
    quote: '(2) honor and dignity, as head and founder of the kingdom of God, and judge of all men (Matt. 13:41; 16:28; 19:28; 24:30–31; 25:31; 26:64; Mark 2:10, 28)'
  - where: 'note 5:27 “Because he is the Son of man”'
    claim: 'Latter-day revelation gives the title its special meaning (Moses 6:57)'
    key: bd-son-of-man
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/son-of-man?lang=eng'
    quote: 'Latter-day revelation confirms the special meaning and sacredness of this phrase when used as a name of the Savior, as in D&C 45:39; 49:6, 22; 58:65; Moses 6:57.'
  - where: 'note 5:29 “The resurrection of the just and of the unjust”'
    claim: '“Damnation” is the Greek word for judgment'
    key: greek-nt
    url: 'https://biblehub.com/interlinear/john/5-29.htm'
    quote: 'kriseōs'
  - where: 'note 5:29 “The resurrection of the just and of the unjust”'
    claim: 'The same word in 5:27 (execute judgment) and 5:24 (condemnation)'
    key: thayer
    url: 'https://biblehub.com/greek/2920.htm'
    quote: 'κρίσιν, to execute judgment, John 5:27; ἔρχεσθαι εἰς κρίσιν, to come into the state of one condemned, John 5:24'
  - where: 'note 5:29 “The resurrection of the just and of the unjust”'
    claim: 'In this phrase the judgment is condemnation'
    key: thayer
    url: 'https://biblehub.com/greek/2920.htm'
    quote: 'ἀνάστασις κρίσεως, followed by condemnation'
  - where: 'note 5:29 “The resurrection of the just and of the unjust”'
    claim: 'Date and place of D&C 76: 16 Feb 1832, John Johnson’s home in Hiram'
    key: sc-knowhy-799
    url: 'https://scripturecentral.org/knowhy/why-is-joseph-s-vision-of-the-three-kingdoms-so-important'
    quote: 'On February 16, 1832, the Prophet Joseph Smith and Sidney Rigdon were busily engaged in the translation of the Bible.'
  - where: 'note 5:29 “The resurrection of the just and of the unjust”'
    claim: 'They lived in Hiram, working in John Johnson’s home'
    key: sc-knowhy-799
    url: 'https://scripturecentral.org/knowhy/why-is-joseph-s-vision-of-the-three-kingdoms-so-important'
    quote: 'Joseph and Sidney were living about thirty miles south of Kirtland, Ohio, in a town called Hiram and were working in John Johnson’s home there.'
  - where: 'note 5:29 “The resurrection of the just and of the unjust”'
    claim: 'The vision that followed was of the three kingdoms'
    key: sc-knowhy-799
    url: 'https://scripturecentral.org/knowhy/why-is-joseph-s-vision-of-the-three-kingdoms-so-important'
    quote: 'When Joseph and Sidney reached John 5:29, Joseph rendered this verse as follows'
  - where: 'note 5:35 “A lamp, not the Light”'
    claim: 'A lamp; those rejoiced in the teacher who would not comply with his demands'
    key: thayer
    url: 'https://biblehub.com/greek/3088.htm'
    quote: 'to the brightness of a lamp that cheers the beholders a teacher is compared, whom even those rejoiced in who were unwilling to comply with his demands, John 5:35'
  - where: 'note 5:39 “Search the scriptures, or ye search them”'
    claim: 'Imperative or indicative: long debated, opinion nearly evenly divided'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/5.htm'
    quote: 'is one which has been discussed through the whole history of New Testament exposition, and one on which the opinion of those best qualified to judge has been, and is, almost equally divided.'
  - where: 'note 5:39 “Search the scriptures, or ye search them”'
    claim: 'The parallel verbs are indicative, favoring “ye search”'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/5.htm'
    quote: 'He should observe that all the parallel verbs in the context are in the indicative'
  - where: 'note 5:39 “Search the scriptures, or ye search them”'
    claim: 'All scripture is to be searched, pondered and applied (John 5:39)'
    key: sc-knowhy-217
    url: 'https://scripturecentral.org/knowhy/why-would-jesus-call-isaiahs-words-great'
    quote: 'all scripture should be searched, pondered, and applied in the lives of disciples of Christ everywhere (see John 5:39; 2 Timothy 3:16).'
  - where: 'note 5:46 “Moses wrote of me”'
    claim: 'Nephi identifies the prophet of whom Moses spake as the Holy One of Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/22?lang=eng'
    quote: 'And now I, Nephi, declare unto you, that this prophet of whom Moses spake was the Holy One of Israel'
  - where: christ
    claim: 'Forgiveness and healing of the heart are realized now; full healing at the resurrection'
    key: huntsman-sabbath-john
    url: 'https://rsc.byu.edu/sacred-time/bringing-forth-new-creation'
    quote: 'whereas forgiveness of sin, the healing of hearts and souls, and the restoration of people to a full relationship with Deity can be realized now.'
  - where: christ
    claim: 'The full healing awaits the resurrection'
    key: huntsman-sabbath-john
    url: 'https://rsc.byu.edu/sacred-time/bringing-forth-new-creation'
    quote: 'his full healing, in the sense of resurrection, awaits the resurrection at the end of the world.'
  - where: explore
    claim: 'The study reads the Bethesda healing with John 9 and the Tabernacles dispute of John 7'
    key: huntsman-sabbath-john
    url: 'https://rsc.byu.edu/sacred-time/bringing-forth-new-creation'
    quote: 'The story of Jesus’s healing the man blind from birth and its aftermath (John 9:1–41) parallels and builds on the story of the man at Bethesda'
  - where: 'note 5:39 “Search the scriptures, or ye search them”'
    claim: 'The statement reading: Ye search the Scriptures'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/5.htm'
    quote: 'Better, Ye search the Scriptures.'
  - where: section 4 plain
    claim: 'John was a lamp'
    key: thayer
    url: 'https://biblehub.com/greek/3088.htm'
    quote: 'to the brightness of a lamp that cheers the beholders a teacher is compared'
  - where: 'note 5:21 “The works of God given to the Son”'
    claim: 'The discourse goes on to His role in judgment, life and resurrection (vv. 21–30)'
    key: huntsman-sabbath-john
    url: 'https://rsc.byu.edu/sacred-time/bringing-forth-new-creation'
    quote: 'Jesus’s discourse on his identity and role as the Divine Son continues by attesting his role with judgment, life, and resurrection (vv. 21–30)'
  - where: 'note 5:21 “The works of God given to the Son”'
    claim: '“Quickeneth” glossed: causes to become alive'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/5?lang=eng'
    quote: 'GR causes to become alive'
  - where: 'note 5:21 “The works of God given to the Son”'
    claim: 'The healings at Bethesda and elsewhere as acts of divine reorganization by the Word who organized the world'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'Just as the Divine Word had first created, or organized, the world, the Incarnate Word reorganizes. Establishing this correspondence, the healings of the nobleman’s son (4:46–54), the man at the pool of Bethesda (5:1–18), and the man born blind (9:1–41) can be seen as acts of divine reorganization, restoring infirm bodies to their correct, whole state.'
  - where: 'note 5:31 “The law of witnesses”'
    claim: 'The law of Moses: a matter established at the mouth of two or three witnesses'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/19?lang=eng'
    quote: 'One witness shall not rise up against a man for any iniquity, or for any sin, in any sin that he sinneth: at the mouth of two witnesses, or at the mouth of three witnesses, shall the matter be established.'
  - where: 'note 5:31 “The law of witnesses”'
