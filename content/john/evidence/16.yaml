chapter: 16
claims:
  # ---- setting, thread, sections
  - where: when
    claim: 'The Last Supper was held in a room in Jerusalem'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'disciples was a Passover feast, celebrated in a specially arranged room in Jerusalem'
  - where: setting
    claim: 'John alone records the last discourse to the apostles'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'For such information as we have concerning the last discourse delivered by Jesus to the apostles before His crucifixion, we are indebted to John alone among the Gospel-writers'
  - where: setting
    claim: 'The discourses run from 14:1 to 16:33 and the prayer of chapter 17 follows; the Synoptics have nothing like them apart from a few short parallels in Luke'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'In the Gospel of John at the conclusion of the Last Supper Jesus delivers several extended discourses to his disciples (John 14:1‒16:33), after which he delivers an intimate prayer to his Father (John 17:1‒26). Except for a few short parallels in Luke … the Synoptics contain nothing like Jesus’s final words'
  - where: setting
    claim: 'Chapters 14 and 16 focus on His departure, chapter 15 on His continuing presence'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'As they now appear in John, they present a chiastic structure, with chapters 14 and 16 focusing on Jesus’s imminent departure and chapter 15 emphasizing his continuous presence with those who continue to dwell in him through the spirit.'
  - where: setting
    claim: 'From 15:18 to 16:4 He speaks of the tribulation awaiting them'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/16.htm'
    quote: 'He had spoken of this from John 14:1 onwards, and from John 15:18 to John 16:4 specially of the tribulation which awaited them.'
  - where: setting
    claim: 'Verse 33 concludes the last and most solemn discourse Christ gave in the flesh'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'In conclusion of this last and most solemn of the discourses delivered by Christ in the flesh, the Lord said: “These things I have spoken unto you, that in me ye might have peace.'
  - where: thread
    claim: 'Verse 28 restates the Incarnation, and in it the Ascension and the gift of the Paraclete are implied'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/16.htm'
    quote: 'They had accepted the truth of the Incarnation, but in this there was already implied the truth of the Ascension, and in the truth of the Ascension there was implied the gift of the Paraclete'
  - where: thread
    claim: 'The disciples think their faith strong though it is weak; tribulation lies ahead, but He has overcome the world'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/16.htm'
    quote: 'Their faith is now weak, though they think it strong (John 16:29-32); their future shall be one of tribulation, but He has overcome the world (John 16:33).'
  - where: section 1 plain
    claim: '“Be offended” here means to be caused to fall away'
    key: thayer
    url: 'https://biblehub.com/greek/4624.htm'
    quote: '"to cause a person to begin to distrust and desert one whom he ought to trust and obey; to cause to fall away," and in the passive, to fall away … (John 16:1)'
  - where: section 1 plain
    claim: '“Doeth God service” is better “offers to God a service of worship”'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/16.htm'
    quote: 'Better, will think that he offereth to God a sacrificial service. The word rendered “doeth” in the Authorised version, is the technical word for offering sacrifice.'
  - where: section 2 plain
    claim: '“Reprove” is better “convince” or “convict”'
    key: thayer
    url: 'https://biblehub.com/greek/1651.htm'
    quote: '1. to convict, refute, confute, generally with a suggestion of the shame of the person convicted … followed by περί with the genitive of thing, John 8:46; John 16:8'
  - where: section 4 plain
    claim: '“Proverbs” are figurative sayings'
    key: thayer
    url: 'https://biblehub.com/greek/3942.htm'
    quote: '2. any dark saying which shadows forth some didactic truth, especially a symbolic or figurative saying: παροιμίαν λέγειν, John 16:29; ἐν παροιμίαις λαλεῖν, ibid. 25'
  # ---- notes
  - where: 'note 16:1 “That ye should not be offended”'
    claim: 'The verb means to be caused to distrust and desert one who should be trusted, to fall away'
    key: thayer
    url: 'https://biblehub.com/greek/4624.htm'
    quote: '"to cause a person to begin to distrust and desert one whom he ought to trust and obey; to cause to fall away," and in the passive, to fall away … (John 16:1)'
  - where: 'note 16:1 “That ye should not be offended”'
    claim: 'He strengthens them by forewarning; they will remember and find support for faith; while He was with them the hatred was directed at Him'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/16.htm'
    quote: 'He strengthens them by forewarning them. When the persecution comes they will remember His word, and find in it support for their faith and evidence of His presence with them.'
  - where: 'note 16:1 “That ye should not be offended”'
    claim: 'While He was with them, the hatred was directed against Himself'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/16.htm'
    quote: 'While with them, He would spare them, and it was against Himself that the hatred of His foes was directed. When He shall have left them they will represent Him, and must stand in the foreground of the battle.'
  - where: 'note 16:2 “He doeth God service”'
    claim: 'The words are those of offering sacrifice and the service of worship; Stephen and Paul as persecutor show the fulfilment'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/16.htm'
    quote: 'The word rendered “service” means the service of worship. … The martyrdom of Stephen, or St. Paul’s account of himself as a persecutor (Acts 26:9; Galatians 1:13-14), shows how these words were fulfilled in the first years of the Church’s history'
  - where: 'note 16:2 “He doeth God service”'
    claim: 'Verse 3 gives ignorance of God as revealed in Christ as the cause of the persecution'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/16.htm'
    quote: 'He repeats that ignorance of God is the cause of the world’s hatred and persecution, and adds here that it is ignorance of God revealed in Himself.'
  - where: 'note 16:2 “He doeth God service”'
    claim: 'Paul says he thought he ought to act against the name of Jesus'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/26?lang=eng'
    quote: 'I verily thought with myself, that I ought to do many things contrary to the name of Jesus of Nazareth.'
  - where: 'note 16:5 “None of you asketh me”'
    claim: 'Peter had asked the question and Thomas implied it; the sense is that none asks out of love for Him'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/16.htm'
    quote: 'Peter had asked this very question (John 13:36), and Thomas had implied it (John 14:5), but what the words here mean is, “None of you are out of love for Me asking about the place whither I am going. Your thoughts are not with Me.'
  - where: 'note 16:7 “It is expedient for you that I go away”'
    claim: 'The Holy Ghost will do in His absence what Jesus did when present'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'how in his absence the Holy Ghost will perform those roles that Jesus had done when present'
  - where: 'note 16:7 “It is expedient for you that I go away”'
    claim: 'The order fixed was that the Son complete His work, sacrifice, rise and ascend before the Advocate came; cf. Acts 2:33'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/16.htm'
    quote: 'the order fixed in these counsels was that the Son of Man should complete His work on earth, and offer the sacrifice of Himself for sin, and rise from the dead, and ascend to the Father’s throne, before the Advocate should come.'
  - where: 'note 16:7 “It is expedient for you that I go away”'
    claim: 'Why the gift of the Holy Ghost was withheld during Jesus’s mortal life is not fully explained in scripture'
    key: bd-holy-ghost
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/holy-ghost?lang=eng'
    quote: 'For some reason not fully explained in the scriptures, the Holy Ghost did not operate in the fulness among the Jews during the years of Jesus’ mortal sojourn (John 7:39; 16:7). … it has reference only to the gift of the Holy Ghost not being present'
  - where: 'note 16:7 “It is expedient for you that I go away”'
    claim: 'Peter at Pentecost: exalted, He received the promise of the Holy Ghost and shed it forth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/2?lang=eng'
    quote: 'Therefore being by the right hand of God exalted, and having received of the Father the promise of the Holy Ghost, he hath shed forth this, which ye now see and hear.'
  - where: 'note 16:8 “Of sin, and of righteousness, and of judgment”'
    claim: 'The verb means to convict, refute, with a suggestion of shame; John 16:8 cited'
    key: thayer
    url: 'https://biblehub.com/greek/1651.htm'
    quote: '1. to convict, refute, confute, generally with a suggestion of the shame of the person convicted … followed by περί with the genitive of thing, John 8:46; John 16:8'
  - where: 'note 16:8 “Of sin, and of righteousness, and of judgment”'
    claim: 'The Holy Ghost convicts or convinces of sin, righteousness and judgment, a role Jesus had done when present'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'serving as a Helper who teaches (John 14:26); witnesses (John 15:26‒27); convicts or convinces (Greek, elenxei; KJV, “reproves”) us of sin, righteousness, and judgment (John 16:8‒11)'
  - where: 'note 16:8 “Of sin, and of righteousness, and of judgment”'
    claim: 'The conviction works two ways, saving those who accept it and condemning those who reject it; Peter’s Pentecost sermon is the first comment on the verse'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/16.htm'
    quote: 'The result of this conviction is two-fold, according as men embrace it, accept its chastening discipline, and are saved by it; or reject it, and in the rejection harden their hearts, and are thus condemned by it. … The effect of St. Peter’s sermon on the Day of Pentecost is the first great historical comment on this verse'
  - where: 'note 16:8 “Of sin, and of righteousness, and of judgment”'
    claim: 'Of sin: unbelief in Christ as the cause of sin generally'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/16.htm'
    quote: 'This should not be interpreted, as it very frequently is, of the sin of unbelief, but of sin generally; unbelief in Christ is stated as the cause of sin.'
  - where: 'note 16:8 “Of sin, and of righteousness, and of judgment”'
    claim: 'Of righteousness: Christ’s, whom men called a sinner, vindicated by His return to the Father'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/16.htm'
    quote: 'Men had called Him a sinner (John 9:24), and His crucifixion was the world’s assertion that He was a malefactor (John 18:30); … and moreover His return to the Father was Heaven’s witness to His righteousness.'
  - where: 'note 16:8 “Of sin, and of righteousness, and of judgment”'
    claim: 'Of judgment: the tense is perfect; the prince of this world has been judged'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/16.htm'
    quote: 'The tense here is perfect, marking the completion of the condemnation. “The prince of this world hath been and remaineth judged.”'
  - where: 'note 16:8 “Of sin, and of righteousness, and of judgment”'
    claim: 'Satan is “the prince of this world,” met and overcome in Gethsemane'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'In that hour of anguish Christ met and overcame all the horrors that Satan, “the prince of this world” could inflict.'
  - where: 'note 16:12 “Ye cannot bear them now”'
    claim: 'The footnote to “bear” points to 3 Ne. 17:2 and D&C 50:40; 78:18; D&C 78:18 text'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/78?lang=eng'
    quote: 'And ye cannot bear all things now; nevertheless, be of good cheer, for I will lead you along.'
  - where: 'note 16:12 “Ye cannot bear them now”'
    claim: 'D&C 50:40 text'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/50?lang=eng'
    quote: 'Behold, ye are little children and ye cannot bear all things now; ye must grow in grace and in the knowledge of the truth.'
  - where: 'note 16:12 “Ye cannot bear them now”'
    claim: '3 Ne. 17:2–3 text'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/17?lang=eng'
    quote: 'Therefore, go ye unto your homes, and ponder upon the things which I have said, and ask of the Father, in my name, that ye may understand, and prepare your minds for the morrow, and I come unto you again.'
  - where: 'note 16:13 “He will guide you into all truth”'
    claim: 'The Spirit’s guidance will reveal the many things of Christ they cannot bear now'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/16.htm'
    quote: 'The thought is that the future guidance of the Spirit promised in John 16:13, will be the revelation of the many things of Christ Himself which they cannot bear now (John 16:12).'
  - where: 'note 16:13 “He will guide you into all truth”'
    claim: 'He shall not speak of himself, like the Son (5:19); contrast the devil who speaks of his own'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/16.htm'
    quote: 'Comp. Notes on John 5:19; John 7:17-18. The Holy Spirit’s power to guide into the truth depends upon the fact that He, like the Son Himself, will represent to the world the eternal truth of God. … (Comp., on the other hand, John 8:44, where the essence of the lie is that the devil speaketh of his own.)'
  - where: 'note 16:13 “He will guide you into all truth”'
    claim: '“Things to come” fulfilled in all time, first in revelation to the apostolic church such as the Apocalypse'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/16.htm'
    quote: 'These words, too, have their fulfilment in the Spirit’s illumination in all time; but we may still find their first and special meaning in the Revelation to the Apostolic Church, of which St. John’s Apocalypse is the most prominent example.'
  - where: 'note 16:13 “He will guide you into all truth”'
    claim: 'The Holy Ghost knows all things and can lead one to know future events'
    key: bd-holy-ghost
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/holy-ghost?lang=eng'
    quote: 'The Holy Ghost knows all things (D&C 35:19) and can lead one to know of future events (2 Pet. 1:21).'
  - where: 'note 16:13 “He will guide you into all truth”'
    claim: 'The revelation of Christ is full but imperfectly received; the Spirit brings home the things of Christ'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/16.htm'
    quote: 'The revelation of Christ is not an imperfect revelation which the Holy Spirit is to supplement. It is a full revelation imperfectly received, and His office is to illumine the heart, and bring home to it the things of Christ.'
  - where: 'note 16:16 “A little while”'
    claim: 'Weeping refers to His death; the joy rests on His resurrection, of which they would be witnesses'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'they would soon weep and lament while the world rejoiced; this had reference to His death; but He promised that their sorrow should be turned into joy; and this was based on His resurrection to which they should be witnesses.'
  - where: 'note 16:16 “A little while”'
    claim: 'The chapter heading: He tells of His death and resurrection'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/16?lang=eng'
    quote: 'Jesus discourses on the mission of the Holy Ghost—He tells of His death and resurrection, announces that He is the Son of God, and says that He has overcome the world.'
  - where: 'note 16:16 “A little while”'
    claim: 'The sorrow itself becomes joy; the separation had to come before the union'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/16.htm'
    quote: 'It is not simply that they shall pass from sorrow to joy, but that the sorrow itself shall become joy. They will rejoice in the presence of the Lord, when after a little while they will see Him and will feel that the separation necessarily went before the union, and that the sorrow was itself a matter of joy because it was the necessary cause of the joy (John 16:7, and John 20:20).'
  - where: 'note 16:21 “A woman when she is in travail”'
    claim: 'The figure was frequent in the prophets'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/16.htm'
    quote: 'This figure was of frequent use in the prophets. (Comp. Isaiah 21:3; Isaiah 26:17-18, and especially Isaiah 66:7-8; Jeremiah 4:31; Jeremiah 22:23; Jeremiah 30:6; Hosea 13:13-14; Micah 4:9-10.)'
  - where: 'note 16:21 “A woman when she is in travail”'
    claim: 'Most of these passages speak of Israel in crisis, compared to a woman in childbirth, delivered by the promised king, the Messiah'
    key: sc-knowhy-93
    url: 'https://scripturecentral.org/knowhy/why-does-abinadi-use-the-phrase-the-bands-of-death'
    quote: 'Most of these passages speak of the people of Israel going through a time of crisis (which is compared to a woman in the pain of childbirth) and then being delivered by the promised king, the Messiah.'
  - where: 'note 16:21 “A woman when she is in travail”'
    claim: 'The point of comparison is the passage from extreme suffering to extreme joy; not to be read as a parable of Christ’s death'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/16.htm'
    quote: 'Their sorrow would be but temporary; their joy would be abiding. The point of comparison between their state, and the familiar illustration of a woman in travail, is the passage from extreme suffering to extreme joy. We are not justified in taking the illustration as a parable'
  - where: 'note 16:21 “A woman when she is in travail”'
    claim: 'The hour of their travail-pangs was at hand, but would pass'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/16.htm'
    quote: 'The hour of their travail-pangs was at hand; but it would pass away, and the fulness of joy would come in the constant presence of their Lord.'
  - where: 'note 16:23 “Ye shall ask me nothing”'
    claim: 'The first “ask” (erōtaō) is classed with asking a question at 16:23, though others take it as request'
    key: thayer
    url: 'https://biblehub.com/greek/2065.htm'
    quote: '1. as in Greek writings from Homer down to question: … John 16:23 (others refer this to 2)'
  - where: 'note 16:23 “Ye shall ask me nothing”'
    claim: 'The second “ask” (aiteō) is to ask for, request'
    key: thayer
    url: 'https://biblehub.com/greek/154.htm'
    quote: 'αἰτέω … to ask; middle to ask for oneself, request for oneself'
  - where: 'note 16:23 “Ye shall ask me nothing”'
    claim: 'In that day the Spirit will illumine them so they need not ask the meaning of His words'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/16.htm'
    quote: 'the time of the gift of the Paraclete, who shall fully illumine them, so that they shall not need to ask the meaning of new thoughts and words as they have done hitherto.'
  - where: 'note 16:23 “Ye shall ask me nothing”'
    claim: 'JST 16:23 reading'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/16?lang=eng'
    quote: 'JST John 16:23 … nothing but it shall be done unto you. Verily, verily, I say …'
  - where: 'note 16:23 “Ye shall ask me nothing”'
    claim: 'They would approach the Father in prayer directly, in the name of the Son'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'They were to be advanced to such honor and exalted recognition that they should approach the Father in prayer direct, but in the name of the Son'
  - where: 'note 16:23 “Ye shall ask me nothing”'
    claim: 'Hitherto they had not received the Spirit and had not learned to pray in His name'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/16.htm'
    quote: 'They had not up to this time received the Holy Spirit. … Under His influence their will became the will of Christ, and their thoughts the thoughts of Christ, and their prayers the prayers of Christ.'
  - where: 'note 16:25 “Plainly of the Father”'
    claim: '“These things” refers to what He said from verse 16; teaching stays parabolic until the Spirit brings it to mind (cf. 2:20–22)'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/16.htm'
    quote: '“These things” refers specially to what He had just said from John 16:16 onwards. … For the disciples much of Christ’s teaching remained in a parabolic form, until the Spirit brought all things which He had said to the mind … (Comp. e.g., John 2:20-22.)'
  - where: 'note 16:25 “Plainly of the Father”'
    claim: 'In that time He will be present with them in the Advocate and communicate the truth of the Father plainly'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/16.htm'
    quote: 'In that time He will be present with them in the Advocate, and will no longer need parables or words, but will, to the depth of their spirit, communicate to them in all fulness and plainness the eternal truth of the Father'
  - where: 'note 16:25 “Plainly of the Father”'
    claim: 'The disciples think the day has already come'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/16.htm'
    quote: 'They think that the day has already come when they shall ask Him nothing, for He knows all things, and communicates to them the fulness of truth.'
  - where: 'note 16:25 “Plainly of the Father”'
    claim: '“Do ye now believe” may be a statement; He did not doubt their faith, but full illumination had not come'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/16.htm'
    quote: 'Here, as there, the words do not necessarily ask a question … Our Lord did not doubt their present faith (John 17:8); but He knew that the hour of their full illumination had not yet come, firmly as they believed it had. … It is this thought which He expresses to them—“Now ye do believe: Behold, the hour cometh . . .”'
  - where: 'note 16:25 “Plainly of the Father”'
    claim: '“Proverbs” are figurative sayings'
    key: thayer
    url: 'https://biblehub.com/greek/3942.htm'
    quote: '2. any dark saying which shadows forth some didactic truth, especially a symbolic or figurative saying: παροιμίαν λέγειν, John 16:29; ἐν παροιμίαις λαλεῖν, ibid. 25'
  - where: 'note 16:26 “I say not unto you, that I will pray the Father for you”'
    claim: 'Not “of course I will pray”; rather, with the Advocate they will pray themselves; the form implies He will pray if needed; 1 John 2:1'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/16.htm'
    quote: 'The thought is rather, “I do not speak of praying for you, because in the presence of the Advocate you will yourselves be able to pray in My name to the Father.” His prayer is thought of as not necessary for them, and yet the form of the words implies that He will pray for them if it should be needed.'
  - where: 'note 16:26 “I say not unto you, that I will pray the Father for you”'
    claim: 'All still depends on His mediation and the manifestation of God’s love in Him'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/16.htm'
    quote: 'the very words which tell them that it will be independent of mediation, tell them that all depends upon His own mediation and the manifestation of the love of God in His own person.'
  - where: 'note 16:32 “I am not alone”'
    claim: 'In the same connection He told them they would be offended, as written, “I will smite the shepherd”'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'In the same connection He told them that before the night had passed every one of them would be offended because of Him, even as it had been written: “I will smite the shepherd, and the sheep of the flock shall be scattered abroad.”'
  - where: 'note 16:32 “I am not alone”'
    claim: 'His life was one of constant communion with the Father; once only was the Father’s presence eclipsed'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/16.htm'
    quote: 'And yet He was never alone, for His life was one of constant communion with the Father. (Comp. the consciousness of this in John 8:29.) Once only do we find the vision of the Father’s presence eclipsed for a moment by the thick darkness of the world’s sin'
  - where: 'note 16:32 “I am not alone”'
    claim: 'He anticipated the loss of mortal support, but apparently not the withdrawal; Holland quotes 16:32'
    key: holland-none-with-him
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2009/04/none-were-with-him?lang=eng'
    quote: 'The loss of mortal support He had anticipated, but apparently He had not comprehended this. Had He not said to His disciples, “Behold, the hour … is now come, that ye shall be scattered, every man to his own, and shall leave me alone'
  - where: 'note 16:32 “I am not alone”'
    claim: 'The Father did not forsake His Son but briefly withdrew His Spirit, that the sacrifice be complete; He had to feel spiritual death'
    key: holland-none-with-him
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2009/04/none-were-with-him?lang=eng'
    quote: 'a perfect Father did not forsake His Son in that hour. … that the supreme sacrifice of His Son might be as complete as it was voluntary and solitary, the Father briefly withdrew from Jesus the comfort of His Spirit, the support of His personal presence.'
  - where: 'note 16:32 “I am not alone”'
    claim: 'For the Atonement to be infinite He had to feel what it was to die spiritually'
    key: holland-none-with-him
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2009/04/none-were-with-him?lang=eng'
    quote: 'For His Atonement to be infinite and eternal, He had to feel what it was like to die not only physically but spiritually, to sense what it was like to have the divine Spirit withdraw'
  - where: 'note 16:33 “I have overcome the world”'
    claim: 'Peace in Him, tribulation in the world: the sum of the discourse'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/16.htm'
    quote: 'At the conclusion of the discourse He sums up in a single thought what was the object of it, “Peace in Him. In the world, indeed, tribulation, but this as conquered in Him, and not interrupting the true peace in Him.”'
  - where: 'note 16:33 “I have overcome the world”'
    claim: 'The pronoun is emphatic; He speaks of the victory as already accomplished'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/16.htm'
    quote: 'The pronoun is strongly emphatic, “I have Myself overcome the world.” He speaks of the assured victory as though it were already accomplished.'
  - where: 'note 16:33 “I have overcome the world”'
    claim: 'Said before Gethsemane and Calvary; Jesus asks us to overcome the world too (D&C 64:2)'
    key: nelson-overcome-world
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2022/10/47nelson?lang=eng'
    quote: 'Before the Savior submitted Himself to the agony of Gethsemane and Calvary, He declared to His Apostles, “In the world ye shall have tribulation: but be of good cheer; I have overcome the world.” Subsequently, Jesus entreated each of us to do the same'
  - where: 'note 16:33 “I have overcome the world”'
    claim: 'What it means to overcome the world'
    key: nelson-overcome-world
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2022/10/47nelson?lang=eng'
    quote: 'It means overcoming the temptation to care more about the things of this world than the things of God. It means trusting the doctrine of Christ more than the philosophies of men.'
