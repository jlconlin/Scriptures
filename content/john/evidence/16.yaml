chapter: 16
claims:
  # ---- when, setting, thread, sections
  - where: when
    claim: 'Jesus had come to Jerusalem for the feast'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/12?lang=eng'
    quote: 'On the next day much people that were come to the feast, when they heard that Jesus was coming to Jerusalem,'
  - where: when
    claim: 'Judas went out, and it was night'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/13?lang=eng'
    quote: 'He then having received the sop went immediately out: and it was night.'
  - where: setting
    claim: 'The discourses of 13–17, at the supper and on the way to the garden, are unique to John'
    key: huntsman-lamb-of-god
    url: 'https://rsc.byu.edu/behold-lamb-god/lamb-god-unique-aspects-passion-narrative-john'
    quote: 'The discourses of chapters 13–17 that Jesus delivers to His disciples, both at the Last Supper and along the way to the garden that would be the scene of His arrest, are unique to the Gospel of John.'
  - where: setting
    claim: 'The Farewell Discourses run 14:1–16:33, then the Intercessory Prayer 17:1–26'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'the Farewell Discourses (14:1–16:33), the Intercessory Prayer (17:1–26)'
  - where: setting
    claim: '“Arise, let us go hence” at the end of chapter 14'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/14?lang=eng'
    quote: 'But that the world may know that I love the Father; and as the Father gave me commandment, even so I do. Arise, let us go hence.'
  - where: setting
    claim: 'After the prayer He goes out over the brook Cedron to the garden'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/18?lang=eng'
    quote: 'When Jesus had spoken these words, he went forth with his disciples over the brook Cedron, where was a garden, into the which he entered, and his disciples.'
  - where: setting
    claim: 'Chapters 14 and 16 are a doublet on His departure, balancing sorrow with the Comforter; the vine stands between them'
    key: huntsman-lamb-of-god
    url: 'https://rsc.byu.edu/behold-lamb-god/lamb-god-unique-aspects-passion-narrative-john'
    quote: 'Chapters 14 and 16 form a recognized doublet, in which Jesus teaches the necessity of His departing … In both chapters, Jesus balances the disciples’ sorrow at His departure with promises of the coming of a “helper” or “advocate” … Chiastically placed between the chapters is Jesus’s allegory of the vine'
  - where: setting
    claim: 'Chapter 16 takes up again the little while, the asking, and the peace of chapter 14'
    key: brouwer-farewell
    url: 'https://byustudies.byu.edu/article/rethinking-the-structure-of-the-farewell-discourse-john-13-17-through-a-chiastic-lens'
    quote: '16:16–28 brings back Jesus’ talk of leaving “in a little while” and the comfort to be provided by the Father that was first presented in 14:1–14.'
  - where: setting
    claim: 'Asking and peace in both chapters'
    key: brouwer-farewell
    url: 'https://byustudies.byu.edu/article/rethinking-the-structure-of-the-farewell-discourse-john-13-17-through-a-chiastic-lens'
    quote: 'Jesus declares his “peace” upon the disciples (14:1, 27; 16:33).'
  - where: setting
    claim: 'The section on the world’s hatred runs from 15:18 to 16:4'
    key: brouwer-farewell
    url: 'https://byustudies.byu.edu/article/rethinking-the-structure-of-the-farewell-discourse-john-13-17-through-a-chiastic-lens'
    quote: 'Troubling encounter with the world (15:18–16:4a)'
  - where: setting
    claim: 'The chapter heading names its subjects'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/16?lang=eng'
    quote: 'Jesus discourses on the mission of the Holy Ghost—He tells of His death and resurrection, announces that He is the Son of God, and says that He has overcome the world.'
  - where: setting
    claim: 'The close (16:29–33) mirrors 13:36–38: after declarations of faith, Jesus foretells their desertion'
    key: brouwer-farewell
    url: 'https://byustudies.byu.edu/article/rethinking-the-structure-of-the-farewell-discourse-john-13-17-through-a-chiastic-lens'
    quote: 'Then, when it seems as if clarity in all things has arrived (16:29) and the disciples are affirming confidence in the teachings Jesus has spoken, the dark shadows of 13:36–38 return. … here in 16:29–33, after the disciples together speak declarations of great faith, Jesus foretells their communal desertion from him.'
  - where: thread
    claim: '“Expedient” means to their advantage'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/16?lang=eng'
    quote: '“expedient”: GR beneficial, profitable, advantageous.'
  - where: thread
    claim: 'The Comforter is sent because of Jesus’s absence'
    key: huntsman-lamb-of-god
    url: 'https://rsc.byu.edu/behold-lamb-god/lamb-god-unique-aspects-passion-narrative-john'
    quote: 'Jesus suggests that the Comforter is sent to do these things for believers because of Jesus’s absence (see John 16:7).'
  - where: thread
    claim: 'Verses 28–32: He came from the Father and goes to Him; they think He speaks plainly; He foretells their scattering'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/16?lang=eng'
    quote: 'Behold, the hour cometh, yea, is now come, that ye shall be scattered, every man to his own, and shall leave me alone: and yet I am not alone, because the Father is with me.'
  - where: section 1 plain
    claim: '“Be offended” here means to be caused to fall away'
    key: thayer
    url: 'https://biblehub.com/greek/4624.htm'
    quote: '"to cause a person to begin to distrust and desert one whom he ought to trust and obey; to cause to fall away," and in the passive, to fall away … (John 16:1)'
  - where: section 1 plain
    claim: '“Doeth God service” is to offer God a service of worship'
    key: thayer
    url: 'https://biblehub.com/greek/2999.htm'
    quote: 'λατρείαν προσφέρειν τῷ Θεῷ (to offer service to God) equivalent to θυσίαν προσφέρειν εἰς λατρείαν (to offer a sacrifice in service), John 16:2'
  - where: section 2 plain
    claim: '“Reprove” is better “convince” or “convict”'
    key: thayer
    url: 'https://biblehub.com/greek/1651.htm'
    quote: '1. to convict, refute, confute, generally with a suggestion of the shame of the person convicted … followed by περί with the genitive of thing, John 8:46; John 16:8'
  - where: section 4 plain
    claim: '“Proverbs” are figurative sayings'
    key: thayer
    url: 'https://biblehub.com/greek/3942.htm'
    quote: '2. any dark saying which shadows forth some didactic truth, especially a symbolic or figurative saying: παροιμίαν λέγειν, John 16:29; ἐν παροιμίαις λαλεῖν, ibid. 25'
  # ---- notes
  - where: 'note 16:1 “That ye should not be offended”'
    claim: 'The verb means to be caused to distrust and desert one who should be trusted, to fall away'
    key: thayer
    url: 'https://biblehub.com/greek/4624.htm'
    quote: '"to cause a person to begin to distrust and desert one whom he ought to trust and obey; to cause to fall away," and in the passive, to fall away … (John 16:1)'
  - where: 'note 16:1 “That ye should not be offended”'
    claim: 'He warned them again, in clear language, that the world would hate them and kill them'
    key: jackson-war-peace
    url: 'https://rsc.byu.edu/save-lost/war-peace-lessons-upper-room'
    quote: 'He warned them again, in very clear language, that the world would hate them. … People would kill them, he said, thinking that in doing so they would be doing God a favor (see John 15:18–19; 16:2).'
  - where: 'note 16:1 “That ye should not be offended”'
    claim: 'John 15:18 and 15:20: the world hated Him first; they will persecute you'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/15?lang=eng'
    quote: 'If they have persecuted me, they will also persecute you; if they have kept my saying, they will keep yours also.'
  - where: 'note 16:1 “That ye should not be offended”'
    claim: 'While He was with them the hatred was aimed at Him'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/16.htm'
    quote: 'While with them, He would spare them, and it was against Himself that the hatred of His foes was directed. When He shall have left them they will represent Him'
  - where: 'note 16:2 “He doeth God service”'
    claim: 'People would kill them thinking they were doing God a favor (16:2)'
    key: jackson-war-peace
    url: 'https://rsc.byu.edu/save-lost/war-peace-lessons-upper-room'
    quote: 'People would kill them, he said, thinking that in doing so they would be doing God a favor (see John 15:18–19; 16:2).'
  - where: 'note 16:2 “He doeth God service”'
    claim: '“Service” is the worship of God under the law; with prospherein, to offer a sacrifice in service (John 16:2)'
    key: thayer
    url: 'https://biblehub.com/greek/2999.htm'
    quote: 'in the Greek Bible, the service or worship of God according to the requirements of the levitical law … λατρείαν προσφέρειν τῷ Θεῷ (to offer service to God) equivalent to θυσίαν προσφέρειν εἰς λατρείαν (to offer a sacrifice in service), John 16:2'
  - where: 'note 16:2 “He doeth God service”'
    claim: '“Doeth” (prospherō) is used of offering sacrifices and gifts to God, with John 16:2 cited'
    key: thayer
    url: 'https://biblehub.com/greek/4374.htm'
    quote: 'used, as often in the Sept., of persons offering sacrifices, gifts, prayers to God … θυσίαν, Hebrews 11:4; λατρείαν, John 16:2'
  - where: 'note 16:2 “He doeth God service”'
    claim: 'The first years of the Church, and Paul’s account of himself as persecutor, show the words fulfilled'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/16.htm'
    quote: 'The martyrdom of Stephen, or St. Paul’s account of himself as a persecutor (Acts 26:9; Galatians 1:13-14), shows how these words were fulfilled in the first years of the Church’s history'
  - where: 'note 16:2 “He doeth God service”'
    claim: 'Paul thought he ought to act against the name of Jesus, and voted for the Saints’ deaths'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/26?lang=eng'
    quote: 'Which thing I also did in Jerusalem: and many of the saints did I shut up in prison, having received authority from the chief priests; and when they were put to death, I gave my voice against them.'
  - where: 'note 16:2 “He doeth God service”'
    claim: 'John 15:21: because they know not Him that sent me'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/15?lang=eng'
    quote: 'But all these things will they do unto you for my name’s sake, because they know not him that sent me.'
  - where: 'note 16:5 “None of you asketh me”'
    claim: 'The statement in 16:5 recalls Peter’s question in 13:36'
    key: brouwer-farewell
    url: 'https://byustudies.byu.edu/article/rethinking-the-structure-of-the-farewell-discourse-john-13-17-through-a-chiastic-lens'
    quote: 'Jesus’ statement in 16:5 that “none of you asks me, ‘Where are you going?’” reminds us immediately of Peter’s question to that effect back in 13:36.'
  - where: 'note 16:5 “None of you asketh me”'
    claim: 'Peter’s question, 13:36'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/13?lang=eng'
    quote: 'Simon Peter said unto him, Lord, whither goest thou?'
  - where: 'note 16:5 “None of you asketh me”'
    claim: 'Thomas, 14:5'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/14?lang=eng'
    quote: 'Thomas saith unto him, Lord, we know not whither thou goest; and how can we know the way?'
  - where: 'note 16:5 “None of you asketh me”'
    claim: 'Jesus answers their sorrow at His departure with the promise of the Comforter'
    key: huntsman-lamb-of-god
    url: 'https://rsc.byu.edu/behold-lamb-god/lamb-god-unique-aspects-passion-narrative-john'
    quote: 'In both chapters, Jesus balances the disciples’ sorrow at His departure with promises of the coming of a “helper” or “advocate” (paraklētos, King James Version “Comforter”; see John 14:15–26; 16:8–15)'
  - where: 'note 16:5 “None of you asketh me”'
    claim: 'He is going to the Father: 16:5–7, 16, 28'
    key: brouwer-farewell
    url: 'https://byustudies.byu.edu/article/rethinking-the-structure-of-the-farewell-discourse-john-13-17-through-a-chiastic-lens'
    quote: 'Jesus is about to leave the disciples and go to the Father (13:1, 3, 33, 36; 14:2–4, 12, 28–29; 16:5–7, 16, 28).'
  - where: 'note 16:7 “It is expedient for you that I go away”'
    claim: 'The Comforter is sent because of Jesus’s absence, as advocate, teacher, witness, prosecutor and revealer'
    key: huntsman-lamb-of-god
    url: 'https://rsc.byu.edu/behold-lamb-god/lamb-god-unique-aspects-passion-narrative-john'
    quote: 'identify His role not just as advocate but also as teacher, witness, prosecutor, and revealer (see John 14:15–18, 25–26; 15:26–27; 16:7–15). Jesus suggests that the Comforter is sent to do these things for believers because of Jesus’s absence (see John 16:7).'
  - where: 'note 16:7 “It is expedient for you that I go away”'
    claim: 'Why the gift of the Holy Ghost was withheld during Jesus’s mortal life is not fully explained in scripture'
    key: bd-holy-ghost
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/holy-ghost?lang=eng'
    quote: 'For some reason not fully explained in the scriptures, the Holy Ghost did not operate in the fulness among the Jews during the years of Jesus’ mortal sojourn (John 7:39; 16:7). … it has reference only to the gift of the Holy Ghost not being present'
  - where: 'note 16:7 “It is expedient for you that I go away”'
    claim: 'John 7:39: the Holy Ghost not yet given because Jesus not yet glorified'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/7?lang=eng'
    quote: '(But this spake he of the Spirit, which they that believe on him should receive: for the Holy Ghost was not yet given; because that Jesus was not yet glorified.)'
  - where: 'note 16:7 “It is expedient for you that I go away”'
    claim: 'Peter at Pentecost: exalted, He received the promise of the Holy Ghost and shed it forth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/2?lang=eng'
    quote: 'Therefore being by the right hand of God exalted, and having received of the Father the promise of the Holy Ghost, he hath shed forth this, which ye now see and hear.'
  - where: 'note 16:8 “Of sin, and of righteousness, and of judgment”'
    claim: 'The verb means to convict, refute, with a suggestion of shame; John 16:8 cited'
    key: thayer
    url: 'https://biblehub.com/greek/1651.htm'
    quote: '1. to convict, refute, confute, generally with a suggestion of the shame of the person convicted … followed by περί with the genitive of thing, John 8:46; John 16:8'
  - where: 'note 16:8 “Of sin, and of righteousness, and of judgment”'
    claim: 'The Comforter is advocate and also prosecutor'
    key: huntsman-lamb-of-god
    url: 'https://rsc.byu.edu/behold-lamb-god/lamb-god-unique-aspects-passion-narrative-john'
    quote: 'Even the five so-called Paraclete Sayings, which focus on the Holy Ghost as Comforter, or helper, identify His role not just as advocate but also as teacher, witness, prosecutor, and revealer'
  - where: 'note 16:8 “Of sin, and of righteousness, and of judgment”'
    claim: 'Of righteousness, one reading: men called Him a sinner, the crucifixion declared Him a malefactor, and His return to the Father was heaven’s witness to His righteousness'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/16.htm'
    quote: 'Men had called Him a sinner (John 9:24), and His crucifixion was the world’s assertion that He was a malefactor (John 18:30); … and moreover His return to the Father was Heaven’s witness to His righteousness.'
  - where: 'note 16:8 “Of sin, and of righteousness, and of judgment”'
    claim: 'JST John 14:30 names the prince of this world as Satan'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-john/14?lang=eng'
    quote: 'The prince of darkness, or Satan, is of this world.'
  - where: 'note 16:8 “Of sin, and of righteousness, and of judgment”'
    claim: 'The verb in 16:11 is perfect, “has been judged”'
    key: greek-nt
    url: 'https://biblehub.com/interlinear/john/16-11.htm'
    quote: 'κέκριται . has been judged V-RIM/P-3S'
  - where: 'note 16:12 “Ye cannot bear them now”'
    claim: 'D&C 50:40 text'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/50?lang=eng'
    quote: 'Behold, ye are little children and ye cannot bear all things now; ye must grow in grace and in the knowledge of the truth.'
  - where: 'note 16:13 “He will guide you into all truth”'
    claim: 'The Spirit would teach them things they could not learn from Jesus (16:12–13)'
    key: jackson-war-peace
    url: 'https://rsc.byu.edu/save-lost/war-peace-lessons-upper-room'
    quote: 'Jesus told them that the Holy Spirit would be able to teach them things that they could not learn from him.'
  - where: 'note 16:13 “He will guide you into all truth”'
    claim: 'After receiving the Holy Ghost the Twelve were changed, with a clear vision; it guided them to truth (Acts 10:1–35)'
    key: jackson-war-peace
    url: 'https://rsc.byu.edu/save-lost/war-peace-lessons-upper-room'
    quote: 'After their reception of the Holy Ghost, the Twelve were changed men. Whereas they are sometimes depicted in the Gospels as uncertain and confused, they are shown in Acts and in their letters to be powerful men with a clear vision of where the Church was going … guided them to truth (see Acts 10:1–35).'
  - where: 'note 16:13 “He will guide you into all truth”'
    claim: 'Acts 10:34–35: God is no respecter of persons'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/10?lang=eng'
    quote: 'Then Peter opened his mouth, and said, Of a truth I perceive that God is no respecter of persons:'
  - where: 'note 16:13 “He will guide you into all truth”'
    claim: 'The Holy Ghost knows all things and can lead one to know future events'
    key: bd-holy-ghost
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/holy-ghost?lang=eng'
    quote: 'The Holy Ghost knows all things (D&C 35:19) and can lead one to know of future events (2 Pet. 1:21).'
  - where: 'note 16:16 “A little while”'
    claim: 'The chapter heading: He tells of His death and resurrection'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/16?lang=eng'
    quote: 'Jesus discourses on the mission of the Holy Ghost—He tells of His death and resurrection, announces that He is the Son of God, and says that He has overcome the world.'
  - where: 'note 16:16 “A little while”'
    claim: 'John 20:20: the disciples were glad when they saw the Lord'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/20?lang=eng'
    quote: 'And when he had so said, he shewed unto them his hands and his side. Then were the disciples glad, when they saw the Lord.'
  - where: 'note 16:21 “A woman when she is in travail”'
    claim: 'Most of these passages speak of Israel in crisis, compared to a woman in childbirth, delivered by the promised king, the Messiah'
    key: sc-knowhy-93
    url: 'https://scripturecentral.org/knowhy/why-does-abinadi-use-the-phrase-the-bands-of-death'
    quote: 'Most of these passages speak of the people of Israel going through a time of crisis (which is compared to a woman in the pain of childbirth) and then being delivered by the promised king, the Messiah.'
  - where: 'note 16:21 “A woman when she is in travail”'
    claim: 'Childbirth as redemption imagery in Isaiah 37:3, Micah 4:9–10 and John 16:20–22'
    key: sc-knowhy-93
    url: 'https://scripturecentral.org/knowhy/why-does-abinadi-use-the-phrase-the-bands-of-death'
    quote: 'Similar childbirth and atonement/redemption imagery can be found in Isaiah 37:3, Hosea 13:9–14, Micah 4:9–10'
  - where: 'note 16:23 “Ye shall ask me nothing”'
    claim: 'The first “ask” (erōtaō) is classed with asking a question at 16:23, though others take it as request'
    key: thayer
    url: 'https://biblehub.com/greek/2065.htm'
    quote: '1. as in Greek writings from Homer down to question: … John 16:23 (others refer this to 2)'
  - where: 'note 16:23 “Ye shall ask me nothing”'
    claim: 'The second “ask” (aiteō) is to ask for, request'
    key: thayer
    url: 'https://biblehub.com/greek/154.htm'
    quote: 'αἰτέω … to ask; middle to ask for oneself, request for oneself'
  - where: 'note 16:23 “Ye shall ask me nothing”'
    claim: 'They had been wanting to ask Him what He meant (16:19)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/16?lang=eng'
    quote: 'Now Jesus knew that they were desirous to ask him, and said unto them, Do ye inquire among yourselves of that I said'
  - where: 'note 16:23 “Ye shall ask me nothing”'
    claim: 'JST 16:23 reading'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/16?lang=eng'
    quote: 'JST John 16:23 … nothing but it shall be done unto you. Verily, verily, I say …'
  - where: 'note 16:23 “Ye shall ask me nothing”'
    claim: 'John 16:23–24 is among the passages that teach praying in Christ’s name, which is a matter of the mind, not only of words'
    key: bd-prayer
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/prayer?lang=eng'
    quote: 'Christians are taught to pray in Christ’s name (John 14:13–14; 15:7, 16; 16:23–24). We pray in Christ’s name when our mind is the mind of Christ, and our wishes the wishes of Christ—when His words abide in us (John 15:7). We then ask for things it is possible for God to grant.'
  - where: 'note 16:25 “Plainly of the Father”'
    claim: '“Proverbs” are figurative sayings'
    key: thayer
    url: 'https://biblehub.com/greek/3942.htm'
    quote: '2. any dark saying which shadows forth some didactic truth, especially a symbolic or figurative saying: παροιμίαν λέγειν, John 16:29; ἐν παροιμίαις λαλεῖν, ibid. 25'
  - where: 'note 16:25 “Plainly of the Father”'
    claim: 'John 12:16: understood not at the first, remembered when He was glorified'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/12?lang=eng'
    quote: 'These things understood not his disciples at the first: but when Jesus was glorified, then remembered they that these things were written of him'
  - where: 'note 16:25 “Plainly of the Father”'
    claim: 'The Holy Ghost brought back to their memory what they could not understand without it, as promised in 14:26, and brought things to memory (12:16)'
    key: jackson-war-peace
    url: 'https://rsc.byu.edu/save-lost/war-peace-lessons-upper-room'
    quote: 'Among other things, it would bring back to their memory things that Jesus had taught them that they could not understand without its influence.'
  - where: 'note 16:25 “Plainly of the Father”'
    claim: 'As promised: the Holy Ghost brought things to their memory (see John 12:16)'
    key: jackson-war-peace
    url: 'https://rsc.byu.edu/save-lost/war-peace-lessons-upper-room'
    quote: 'As promised, the Holy Ghost brought things to their memory (see John 12:16)'
  - where: 'note 16:25 “Plainly of the Father”'
    claim: 'One reading: teaching stayed figurative for the disciples until the Spirit brought it to mind; then He is present with them in the Advocate and speaks plainly'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/16.htm'
    quote: 'In that time He will be present with them in the Advocate, and will no longer need parables or words, but will, to the depth of their spirit, communicate to them in all fulness and plainness the eternal truth of the Father'
  - where: 'note 16:26 “I say not unto you, that I will pray the Father for you”'
    claim: 'John 17:9: I pray for them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/17?lang=eng'
    quote: 'I pray for them: I pray not for the world, but for them which thou hast given me; for they are thine.'
