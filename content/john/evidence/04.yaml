chapter: 4
claims:
  - where: when
    claim: 'The chapter follows the first Passover of the ministry, on the return from Jerusalem to Galilee'
    key: van-dyke-miracles-john
    url: 'https://rsc.byu.edu/vol-9-no-3-2008/miracles-jesus-gospel-john'
    quote: 'Following the first Passover feast of His public ministry, Jesus returned to Galilee from Jerusalem'
  # ---- when, setting, thread
  - where: setting
    claim: 'John 2:1–4:54 is a unit framed by the two signs at Cana, stressing newness and new life'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'The first signs and dialogues comprise a discrete unit, framed by miracles performed in the Galilean town of Cana (2:1–4:54). These all stress the theme of newness, particularly the new life that Jesus has come to bring.'
  - where: setting
    claim: 'The discourse on the water of life (4:7–26) is set as a dialogue, like the discourse with Nicodemus; personal conversations readers can identify with'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'The first of Jesus’s speeches, the Discourse on the New Birth (3:1–15) and the Discourse on the Water of Life (4:7–26), are set as dialogues with Nicodemus and a woman from Samaria. As such, they present very personal interactions and conversations with Jesus, with which readers can identify.'
  - where: setting
    claim: 'The Samaritan woman is a mirror image of Nicodemus: a woman, a Samaritan, by day, and Jesus begins the conversation'
    key: strathearn-johannine-dialogues
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/johannine-christology-through-lens-three-its-dialogues'
    quote: 'In John’s second extended dialogue, the qualities of his dialogue partner are “a mirror image” of Nicodemus.[18] This time Jesus engages a woman, a Samaritan, and does so in broad daylight (John 4:6). Unlike Nicodemus who came in search of Jesus, in this instance Jesus initiates the dialogue.'
  - where: setting
    claim: 'The Samaritans were descended from foreign colonists and Israelites left after the captivity of the northern kingdom'
    key: bd-samaritans
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/samaritans?lang=eng'
    quote: 'They were the descendants of (1) foreign colonists placed there by kings of Assyria and Babylonia (2 Kgs. 17:24; Ezra 4:2, 10); (2) Israelites who escaped at the time of the captivity.'
  - where: thread
    claim: 'The woman at first sees Jesus only as “a Jew”; her perception rises to prophet and then to Christ'
    key: strathearn-johannine-dialogues
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/johannine-christology-through-lens-three-its-dialogues'
    quote: 'Her questions highlight that at the beginning of this dialogue, from her earthly perspective, the woman saw Jesus simply as “a Jew,” which in her mind would have been the equivalent of an enemy.'
  - where: thread
    claim: 'John stresses the development of faith, in the Samaritans and again in the courtier'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/4.htm'
    quote: 'There is here, as frequently in St. John, stress laid upon the development of faith. We shall find it again in the following verses, which mark it in the case of the courtier.'
  - where: thread
    claim: 'The Samaritans believed without a miracle; the faith that demands a miracle is sight'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/4.htm'
    quote: 'How different from this faith, which demanded a miracle, and therefore was not faith, but sight, was the acceptance by the Samaritans without a miracle, who believed for the woman’s word, and more fully when they heard the word of Christ Himself.'

  # ---- notes
  - where: 'note 4:1 “Why He left Judea”'
    claim: 'JST: the Pharisees sought more diligently to put Jesus to death; many received John as a prophet but did not believe on Jesus'
    key: jst-john-4
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-john/4?lang=eng'
    quote: 'They sought more diligently some means that they might put him to death; for many received John as a prophet, but they believed not on Jesus.'
  - where: 'note 4:1 “Why He left Judea”'
    claim: 'JST: Jesus baptized, but not so many as His disciples, and allowed them to as an example, preferring one another'
    key: jst-john-4
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-john/4?lang=eng'
    quote: 'Now the Lord knew this, though he himself baptized not so many as his disciples; For he suffered them for an example, preferring one another.'
  - where: 'note 4:4 “He must needs go through Samaria”'
    claim: 'A traveler from Judea to Galilee did not have to go through Samaria; the necessity is theological, not geographical'
    key: smith-written-believe
    url: 'https://rsc.byu.edu/vol-5-no-3-2004/written-ye-might-believe-literary-features-gospels'
    quote: 'a careful reader would consult a map and notice that when traveling from Judea to Galilee (see verse 3), a traveler does not necessarily have to go through Samaria. Consequently, the detail-oriented reader realizes that verse 4 describes not a geographical necessity but a theological one.'
  - where: 'note 4:4 “He must needs go through Samaria”'
    claim: 'Samaria was the shorter course, and the choice was guided by purpose'
    key: talmage-jesus-christ-13
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-13?lang=eng'
    quote: 'In His journey to Galilee Jesus took the shorter course, through Samaria; and doubtless His choice was guided by purpose, for we read that “He must needs go” that way.'
  - where: 'note 4:9 “No dealings with the Samaritans”'
    claim: 'The Samaritans’ claim to help rebuild the temple was refused; they became opponents of the Jews and built a rival temple on Gerizim; the New Testament shows the antagonism'
    key: bd-samaritans
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/samaritans?lang=eng'
    quote: 'This claim not being allowed, they became, as the books of Ezra and Nehemiah show, bitter opponents of the Jews, and started a rival temple of their own on Mount Gerizim.'
  - where: 'note 4:9 “No dealings with the Samaritans”'
    claim: 'The Samaritans’ religion was mixed'
    key: bd-samaritans
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/samaritans?lang=eng'
    quote: 'The population was therefore partly Israelite and partly gentile. Their religion was also of a mixed character (see 2 Kgs. 17:24–41)'
  - where: 'note 4:9 “No dealings with the Samaritans”'
    claim: 'synchraomai: to use jointly, to associate with, to have dealings with'
    key: thayer
    url: 'https://biblehub.com/greek/4798.htm'
    quote: 'to use with anyone, use jointly (Polybius, Diodorus (Philo)); with the dative of a person, to associate with, to have dealings with: John 4:9'
  - where: 'note 4:9 “No dealings with the Samaritans”'
    claim: 'Because the disciples were buying food in the town, the clause means “not on friendly terms”'
    key: strathearn-johannine-dialogues
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/johannine-christology-through-lens-three-its-dialogues'
    quote: 'I have chosen to translate synchraomai as “are not on friendly terms with” instead of the KJV’s “have no dealings with” because in verse 2 clearly the disciples are having dealings with the Samaritans as they go into the city to buy food.'
  - where: 'note 4:10 “Living water”'
    claim: 'Living water is flowing water as against cisterns, used figuratively of the spirit and truth of God (John 4:10; 7:38)'
    key: thayer
    url: 'https://biblehub.com/greek/2198.htm'
    quote: 'living water, i. e. bubbling up, gushing forth, flowing, with the suggested idea of refreshment and salubrity (opposed to the water of cisterns and pools (cf. our spring water)), is figuratively used of the spirit and truth of God as satisfying the needs and desires of the soul: John 4:10; John 7:38'
  - where: 'note 4:10 “Living water”'
    claim: 'The footnote at 4:14 points to John 7:37–39'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/4?lang=eng'
    quote: 'Ps. 42:2 (1–3); 143:6 (5–12); Isa. 55:1 (1–3); John 6:35; 7:37 (37–39).'
  - where: 'note 4:10 “Living water”'
    claim: 'The footnote at 4:14 points to D&C 63:23'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/4?lang=eng'
    quote: 'D&C 63:23.'
  - where: 'note 4:10 “Living water”'
    claim: 'The woman takes the words from an earthly perspective; the daily chore of drawing water'
    key: strathearn-johannine-dialogues
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/johannine-christology-through-lens-three-its-dialogues'
    quote: 'Like Nicodemus before her, the Samaritan woman misunderstood the intent of Jesus’s teachings, understanding them only from an earthly perspective'
  - where: 'note 4:18 “Five husbands”'
    claim: 'Nothing is said of how she came to have five husbands; some may have died or divorced her'
    key: sc-knowhy-658
    url: 'https://scripturecentral.org/knowhy/how-can-jesus-provide-to-all-people-the-waters-of-life'
    quote: 'We are given no information about how old this woman was or how she came to be married five times. Some of her husbands may have died or may have divorced her.'
  - where: 'note 4:18 “Five husbands”'
    claim: 'Jesus revealed superhuman discernment by telling her life; the man she lived with was not her husband'
    key: talmage-jesus-christ-13
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-13?lang=eng'
    quote: 'To her reply that she had no husband Jesus revealed to her His superhuman powers of discernment, by telling her she had spoken truthfully, inasmuch as she had had five husbands, while the man with whom she was then living was not her husband.'
  - where: 'note 4:20 “This mountain, and Jerusalem”'
    claim: 'The mountain is Gerizim, visible from the well; the Samaritan temple was destroyed by John Hyrcanus in 109 BC; worship continued there'
    key: strathearn-johannine-dialogues
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/johannine-christology-through-lens-three-its-dialogues'
    quote: 'The Samaritans had built a temple there that had been destroyed by the Jewish leader John Hyrcanus in 109 BC. The past tense of the woman’s statement that her ancestors worshipped on Mount Gerizim reflects the historical reality of Hyrcanus’s actions.'
  - where: 'note 4:20 “This mountain, and Jerusalem”'
    claim: 'Gerizim lay just south of Sychar and was visible to both'
    key: strathearn-johannine-dialogues
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/johannine-christology-through-lens-three-its-dialogues'
    quote: 'The mountain that the Samaritans worshipped on was Mount Gerizim, located just to the south of Sychar, and would have been clearly visible to both Jesus and the woman.'
  - where: 'note 4:20 “This mountain, and Jerusalem”'
    claim: 'Salvation was of the Jews because the source of salvation standing before her was a Jew'
    key: strathearn-johannine-dialogues
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/johannine-christology-through-lens-three-its-dialogues'
    quote: 'Salvation was “of the Jews” because the prophet standing before her was the source of salvation and because he, as she had quickly recognized at the beginning of their interaction, was a Jew.'
  - where: 'note 4:20 “This mountain, and Jerusalem”'
    claim: 'Samaritan worship rejected the fuller teaching of the prophets; the Jews were guardians of the oracles of God'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/4.htm'
    quote: 'The contrast between the Samaritan and the Jewish worship lay in its history, its state at that time, and its rejection of the fuller teaching of the prophetical books of the Old Testament.'
  - where: 'note 4:20 “This mountain, and Jerusalem”'
    claim: 'The Samaritans built a rival temple on Gerizim'
    key: bd-samaritans
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/samaritans?lang=eng'
    quote: 'started a rival temple of their own on Mount Gerizim'
  - where: 'note 4:24 “God is a Spirit”'
    claim: 'Joseph Smith and Sidney Rigdon reached John 4:24 shortly before February 16, 1832, and revised it'
    key: welch-tangible-bodies
    url: 'https://byustudies.byu.edu/article/when-did-joseph-smith-know-the-father-and-the-son-have-tangible-bodies'
    quote: 'Shortly before February 16, 1832, as Joseph Smith and Sidney Rigdon were working through the Gospel of John, they encountered the words of Jesus to the Samaritan woman at the well.'
  - where: 'note 4:24 “God is a Spirit”'
    claim: 'Joseph knew from his experience that the Father is not a spirit; the Greek is two terse nouns, open to interpretation'
    key: welch-tangible-bodies
    url: 'https://byustudies.byu.edu/article/when-did-joseph-smith-know-the-father-and-the-son-have-tangible-bodies'
    quote: 'Joseph had learned by his own experiences in communing with God that the Father is not a spirit. And actually, the Greek in this verse, while being ordinary enough, is open to interpretation and elaboration.'
  - where: 'note 4:24 “God is a Spirit”'
    claim: 'JST John 4:26 reading'
    key: jst-john-4
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-john/4?lang=eng'
    quote: 'For unto such hath God promised his Spirit. And they who worship him, must worship in spirit and in truth.'
  - where: 'note 4:25 “The Samaritans’ hope”'
    claim: 'Samaritan expectations differed, rested on oral traditions recorded about two centuries later; the Taheb, a prophet-teacher descended from Jacob'
    key: matson-fourth-gospel
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/fourth-gospel-expectations-jewish-messiah'
    quote: 'Unfortunately, records about the messianic expectations of the Samaritans are reliant upon records that postdate the Second Temple period by nearly two hundred years.[27] According to these traditions, Samaritans expected the coming of a figure named Taheb, a descendant of Jacob and a great prophet-teacher'
  - where: 'note 4:25 “The Samaritans’ hope”'
    claim: 'Allusions to the Taheb are preserved in John 4; the woman let Jesus expand her understanding'
    key: matson-fourth-gospel
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/fourth-gospel-expectations-jewish-messiah'
    quote: 'Allusions to the traditions of Taheb are preserved in the dialogue between the Samaritan woman and Jesus in John 4.[29] However, like those in the temple at Jerusalem, the Samaritan woman followed the expression of her understanding of the coming messiah with a listening ear that allowed Jesus to expand her knowledge.'
  - where: 'note 4:25 “The Samaritans’ hope”'
    claim: 'The Samaritans expected the prophet like Moses (Deut. 18:15–18), a revealer, not a Davidic king; Jesus fulfilled that hope (3 Ne. 20:23)'
    key: strathearn-johannine-dialogues
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/johannine-christology-through-lens-three-its-dialogues'
    quote: 'The Samaritans did not anticipate a messianic Davidic king. Having used the dialogue to create a teaching moment, Jesus was then ready to reveal fully his identity to the Samaritan woman. He was the fulfillment of this Samaritan hope; he was the prophet “like unto [Moses]” (compare 3 Nephi 20:23).'
  - where: 'note 4:25 “The Samaritans’ hope”'
    claim: 'The footnote at “tell” points to Deut. 18:18'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/4?lang=eng'
    quote: '25b “tell”: Deut. 18:18.'
  - where: 'note 4:26 “I that speak unto thee am he”'
    claim: 'The footnote: the Greek “I Am” is the Septuagint usage of Ex. 3:14 which identifies Jehovah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/4?lang=eng'
    quote: 'The term I Am used here in the Greek is identical with the Septuagint usage in Ex. 3:14 which identifies Jehovah. John 8:58.'
  - where: 'note 4:26 “I that speak unto thee am he”'
    claim: 'The Greek uses “I am”; the verse may be rendered “I AM is speaking to you”'
    key: sc-knowhy-658
    url: 'https://scripturecentral.org/knowhy/how-can-jesus-provide-to-all-people-the-waters-of-life'
    quote: 'It may not be apparent in the King James Version, but the underlying Greek text uses the phrase “I am,” drawing to mind Moses’s encounter with the Lord on Mount Sinai, where “God said unto Moses, I AM THAT I AM” (Exodus 3:14). As such, this passage may be alternatively rendered as “I AM is speaking to you.”'
  - where: 'note 4:26 “I that speak unto thee am he”'
    claim: 'Literal rendering: The one who speaks to you [is] I Am'
    key: strathearn-johannine-dialogues
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/johannine-christology-through-lens-three-its-dialogues'
    quote: 'Literally, he says, “The one who speaks to you [is] I Am [Greek, egō eimi]” (4:26; author’s translation; compare John 8:58; Exodus 3:11–14).'
  - where: 'note 4:27 “Talking with a woman”'
    claim: 'A reading (kept as a reading): talking in public with a woman was contrary to the rabbis’ precepts'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/4.htm'
    quote: 'They are surprised, not at His talking with a Samaritan, but at His talking in public with a woman, which was directly contrary to the Rabbinic precepts.'
  - where: 'note 4:27 “Talking with a woman”'
    claim: 'The Greek has no article: “with a woman” (meta gynaikos)'
    key: greek-nt
    url: 'https://biblehub.com/texts/john/4-27.htm'
    quote: 'καὶ ἐθαύμαζον ὅτι μετὰ γυναικὸς ἐλάλει'
  - where: 'note 4:27 “Talking with a woman”'
    claim: 'The disciples marvelled that He talked with a woman, and a Samaritan; none asked, His manner impressing them with the seriousness of the occasion'
    key: talmage-jesus-christ-13
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-13?lang=eng'
    quote: 'They marveled at finding the Master in conversation with a woman, and a Samaritan woman at that, yet none of them asked of Him an explanation. His manner must have impressed them with the seriousness and solemnity of the occasion.'
  - where: 'note 4:28 “She left her waterpot”'
    claim: 'She came with a waterpot and left with water she could not carry in a pot; she found the living water'
    key: strathearn-johannine-dialogues
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/johannine-christology-through-lens-three-its-dialogues'
    quote: 'At the beginning of the narrative she had come to the well with her waterpot in search of water, and she did indeed leave with water, but it was not the kind that she could carry in a pot. She had found the living water that Jesus had promised her.'
  - where: 'note 4:28 “She left her waterpot”'
    claim: 'The woman is unnamed, so she serves as a type with whom readers can identify'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'Other anonymous characters include the mother of Jesus (John 2:1–12; 19:25–27), the woman at the well in Samaria (John 4), and the man born blind (John 9). By not naming them, John allows them to serve not only as historical figures but also as literary types with whom readers can identify.'
  - where: 'note 4:35 “White already to harvest”'
    claim: 'Wheat was sown with the autumn winter rains and harvested in early summer'
    key: ball-plants-nt
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/plants-new-testament'
    quote: 'sown at the beginning of the winter rains in September and October; and harvested, threshed, and winnowed during early summer, typically in late June or July.'
  - where: 'note 4:35 “White already to harvest”'
    claim: 'Alma 26:4–5: thousands brought into the fold of God; the field was ripe, behold your sheaves'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/26?lang=eng'
    quote: 'Behold, the field was ripe, and blessed are ye, for ye did thrust in the sickle, and did reap with your might, yea, all the day long did ye labor; and behold the number of your sheaves!'
  - where: 'note 4:35 “White already to harvest”'
    claim: 'D&C 4:4: the field white; he that thrusteth in his sickle bringeth salvation to his soul'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/4?lang=eng'
    quote: 'For behold the field is white already to harvest; and lo, he that thrusteth in his sickle with his might, the same layeth up in store that he perisheth not, but bringeth salvation to his soul;'
  - where: 'note 4:35 “White already to harvest”'
    claim: 'Months would pass before the wheat and barley were ready, but the harvest of souls, exemplified by the approaching crowd, was ready then'
    key: talmage-jesus-christ-13
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-13?lang=eng'
    quote: 'while months would elapse before the wheat and the barley were ready for the sickle, the harvest of souls, exemplified by the approaching crowd, was even then ready'
  - where: 'note 4:35 “White already to harvest”'
    claim: '“Four months” is probably a note of time, putting the conversation about January'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/4.htm'
    quote: 'Four months.—This gives us probably a note on time. There is no evidence that it was a proverbial saying'
  - where: 'note 4:35 “White already to harvest”'
    claim: 'D&C 4 was given to Joseph Smith Sr. in February 1829'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/4?lang=eng'
    quote: 'Revelation given through Joseph Smith the Prophet to his father, Joseph Smith Sr., at Harmony, Pennsylvania, February 1829.'
  - where: 'note 4:38 “Other men laboured”'
    claim: 'JST John 4:40 reads “the prophets have labored”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/4?lang=eng'
    quote: 'JST John 4:40 … the prophets have labored …'
  - where: 'note 4:38 “Other men laboured”'
    claim: 'The seed sown in Samaria in these two days was probably that from which the Apostles reaped a rich harvest in later years'
    key: talmage-jesus-christ-13
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-13?lang=eng'
    quote: 'Probably the seed sown during this brief stay of our Lord among the despised people of Samaria was that from which so rich a harvest was reaped by the apostles in after years.'
  - where: 'note 4:38 “Other men laboured”'
    claim: 'Samaria was included among those the Apostles were sent to, and Philip did a very successful work there'
    key: bd-samaritans
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/samaritans?lang=eng'
    quote: 'but the people of Samaria were included among those to whom the Apostles were directed to preach the gospel (Acts 1:8), and a very successful work was done there by Philip (Acts 8:4–25).'
  - where: 'note 4:42 “Not because of thy saying”'
    claim: 'The Samaritans believed first on the woman’s testimony, then by their own conviction; Jesus did not share the national prejudice'
    key: talmage-jesus-christ-13
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-13?lang=eng'
    quote: 'Many of the Samaritans believed on Christ, at first on the strength of the woman’s testimony, then because of their own conviction'
  - where: 'note 4:42 “Not because of thy saying”'
    claim: 'An honest soul was acceptable to Him wherever from'
    key: talmage-jesus-christ-13
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-13?lang=eng'
    quote: 'It is beyond question that Jesus did not share in the national prejudice of the Jews against the people of Samaria; an honest soul was acceptable to Him come whence he may.'
  - where: 'note 4:42 “Not because of thy saying”'
    claim: 'The woman, converted, shared her witness with her neighbors'
    key: matson-fourth-gospel
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/fourth-gospel-expectations-jewish-messiah'
    quote: 'By choosing to believe that Jesus was the Christ, the Samaritan woman received a personal witness and shared it with her friends and neighbors (John 4:29).'
  - where: 'note 4:44 “No honour in his own country”'
    claim: 'Mark 6:4 gives the saying with “his own kin” and “his own house”; John confirms His brothers rejected Him (John 7:3–5)'
    key: strathearn-gospels
    url: 'https://rsc.byu.edu/vol-8-no-2-2007/distinctive-testimonies-four-gospels'
    quote: 'Jesus himself asserted that “A prophet is not without honor, but in his own country, and among his own kin, and in his own house” (Mark 6:4; emphasis added). In any event, John’s Gospel confirms that at least Jesus’s brothers rejected Him during His mortal ministry (see John 7:3–5).'
  - where: 'note 4:44 “No honour in his own country”'
    claim: 'John 7:5: neither did his brethren believe in him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/7?lang=eng'
    quote: 'For neither did his brethren believe in him.'
  - where: 'note 4:44 “No honour in his own country”'
    claim: 'Luke 4:23–24: the Nazareth saying, “do also here in thy country” what was done in Capernaum'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/4?lang=eng'
    quote: 'whatsoever we have heard done in Capernaum, do also here in thy country.'
  - where: 'note 4:44 “No honour in his own country”'
    claim: 'The footnote to “Capernaum” in John 4:46 points to Luke 4:23–24'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/4?lang=eng'
    quote: 'Luke 4:23 (23–24)'
  - where: 'note 4:44 “No honour in his own country”'
    claim: 'Matthew: Jesus departed into Galilee when John was cast into prison'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/4?lang=eng'
    quote: 'Now when Jesus had heard that John was cast into prison, he departed into Galilee;'
  - where: 'note 4:44 “No honour in his own country”'
    claim: 'John 3:24: John was not yet cast into prison'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/3?lang=eng'
    quote: 'For John was not yet cast into prison.'
  - where: 'note 4:44 “No honour in his own country”'
    claim: 'The Synoptics follow a single visit to Jerusalem; John has Jesus travel from Galilee to Jerusalem several times'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'Unlike Matthew and Luke, which follow the basic chronological and geographic progression of Mark that culminates in a single visit to Jerusalem, John portrays Jesus as traveling from Galilee to Jerusalem several times'
  - where: 'note 4:44 “No honour in his own country”'
    claim: 'A reading (kept as a reading): knowing Nazareth would be loath to acknowledge Him as more than the carpenter, He went first to Cana'
    key: talmage-jesus-christ-13
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-13?lang=eng'
    quote: 'Realizing that the people of Nazareth, the town in which He had been brought up, would be probably loath to acknowledge Him as other than the carpenter, or, as He stated, knowing that “a prophet hath no honour in his own country,” He went first to Cana.'
  - where: 'note 4:46 “A king’s officer”'
    claim: 'basilikos: of a man, the officer or minister of a prince, a courtier (John 4:46, 49)'
    key: thayer
    url: 'https://biblehub.com/greek/937.htm'
    quote: 'of or belonging to a king, kingly, royal, regal; of a man, the officer or minister of a prince, a courtier: John 4:46, 49'
  - where: 'note 4:46 “A king’s officer”'
    claim: 'The king was almost certainly Herod Antipas; “king’s officer” best represents the word'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/4.htm'
    quote: 'The king, whose “king’s man” is here spoken of, was almost certainly Herod Antipas, who was left the kingdom in his father’s first will, and is called “king” by St. Matthew (Matthew 14:9) and by St. Mark (Mark 6:14).'
  - where: 'note 4:46 “A king’s officer”'
    claim: 'The centurion’s story in Luke is of a servant, not a son; the centurion sends elders to Jesus'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/7?lang=eng'
    quote: 'And a certain centurion’s servant, who was dear unto him, was sick, and ready to die.'
  - where: 'note 4:46 “A king’s officer”'
    claim: 'Capernaum about twenty miles from Cana'
    key: van-dyke-miracles-john
    url: 'https://rsc.byu.edu/vol-9-no-3-2008/miracles-jesus-gospel-john'
    quote: 'There He encountered a nobleman whose son was sick to the point of death at Capernaum, about twenty miles away.'
  - where: 'note 4:46 “A king’s officer”'
    claim: '“King’s officer” best represents the original'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/4.htm'
    quote: 'Perhaps “king’s officer” represents the vagueness of the original better than any other English term.'
  - where: 'note 4:48 “Except ye see signs and wonders”'
    claim: 'The “ye” extends the words to those standing near and the class he represents, as with the Jews in Jerusalem'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/4.htm'
    quote: 'They are spoken to him, but the ye extends them to others standing near and to the class of persons whom he represents. It had been so with the Jews in Jerusalem (John 2:18; John 2:23), and it was so with the Jews in Galilee.'
  - where: 'note 4:48 “Except ye see signs and wonders”'
    claim: 'Jesus spoke with the probable design of showing the man the true condition of his mind'
    key: talmage-jesus-christ-13
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-13?lang=eng'
    quote: 'With the probable design of showing the man the true condition of his mind, for we cannot doubt that Jesus could read his thoughts'
  - where: 'note 4:48 “Except ye see signs and wonders”'
    claim: 'The nobleman was not fazed by the test and pleaded more fervently'
    key: van-dyke-miracles-john
    url: 'https://rsc.byu.edu/vol-9-no-3-2008/miracles-jesus-gospel-john'
    quote: 'The nobleman was not fazed by the challenge; instead he more fervently submitted his faith in the power of Jesus to heal his son.'
  - where: 'note 4:50 “The man believed the word”'
    claim: 'The seventh hour was about 1:00 p.m.; he had time to reach Capernaum that day, but did not rush, and was met the next day'
    key: van-dyke-miracles-john
    url: 'https://rsc.byu.edu/vol-9-no-3-2008/miracles-jesus-gospel-john'
    quote: 'The seventh hour, then, would be 1:00 p.m. This would have given the nobleman ample time to travel from Cana to Capernaum in that day to confirm the validity of Jesus’s words. His faith was secure, however, and he did not rush home.'
  - where: 'note 4:54 “The second sign”'
    claim: 'John’s word is sēmeion, sign, where the Synoptics use dynamis; the miracles reveal something about Jesus'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'The most common Greek word in the Synoptics for miracle is dynamis, or “mighty deed,” indicating the great thing he does for those whom he blesses. On the other hand, the narrator of this Gospel consistently uses the word sēmeion.'
  - where: 'note 4:54 “The second sign”'
    claim: 'The healing of the nobleman’s son is divine reorganization, restoring the body; the healed are types of fallen men and women, and their restoration a symbol of His atoning work'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'the healings of the nobleman’s son (4:46–54), the man at the pool of Bethesda (5:1–18), and the man born blind (9:1–41) can be seen as acts of divine reorganization, restoring infirm bodies to their correct, whole state.'
  - where: 'note 4:54 “The second sign”'
    claim: 'The infirm healed by Jesus can be types of fallen men and women'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'Similarly, the infirm healed by Jesus can be types of fallen men and women, making Jesus’s restoration of them symbols of his atoning work.'

  - where: 'setting'
    claim: 'The sixth hour was about 12 o’clock'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/4.htm'
    quote: 'About the sixth hour—i.e., as elsewhere in St. John, following the ordinary mode of counting, about 12 o’clock.'
  - where: 'setting'
    claim: 'The Samaritans were a despised people'
    key: talmage-jesus-christ-13
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-13?lang=eng'
    quote: 'Probably the seed sown during this brief stay of our Lord among the despised people of Samaria'
  - where: 'setting'
    claim: 'The earlier Gospels begin the ministry in Galilee; John first tells of a ministry in Judea and Samaria'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/4.htm'
    quote: 'The narrative of the earlier Gospels places the commencement of the ministry in Galilee. John has in these opening chapters told of an earlier ministry in Judæa and Samaria.'
  - where: 'note 4:10 “Living water”'
    claim: 'Drawing water was a laborious daily chore she was anxious to be rid of'
    key: strathearn-johannine-dialogues
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/johannine-christology-through-lens-three-its-dialogues'
    quote: 'When the Samaritan woman arrived at the well in the middle of the day, her mind was undoubtedly focused on the grind of her daily chore, which the narrative suggests she was anxious to eliminate (John 4:15).'
  - where: 'note 4:20 “This mountain, and Jerusalem”'
    claim: 'The Samaritans had a copy of the Pentateuch'
    key: bd-samaritans
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/samaritans?lang=eng'
    quote: 'he took refuge with the Samaritans, taking with him a copy of the Pentateuch'
  - where: 'note 4:25 “The Samaritans’ hope”'
    claim: 'The Samaritans anticipated the prophet like Moses (Deut. 18:15–18), the Taheb'
    key: strathearn-johannine-dialogues
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/johannine-christology-through-lens-three-its-dialogues'
    quote: 'The Samaritans anticipated the coming of a prophet like unto Moses (Deuteronomy 18:15–18), which they identified as a Taheb, or a revealer.'
  - where: 'note 4:26 “I that speak unto thee am he”'
    claim: 'Jesus reveals His identity fully and applies the divine title to Himself'
    key: strathearn-johannine-dialogues
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/johannine-christology-through-lens-three-its-dialogues'
    quote: 'Jesus was then ready to reveal fully his identity to the Samaritan woman.'
  - where: 'note 4:26 “I that speak unto thee am he”'
    claim: 'He was the prophet like Moses and also the God who directed Moses'
    key: strathearn-johannine-dialogues
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/johannine-christology-through-lens-three-its-dialogues'
    quote: 'Jesus was indeed the prophet like unto Moses, but he was also the God who directed Moses.'
  - where: 'note 4:42 “Not because of thy saying”'
    claim: 'The Samaritans were a despised people'
    key: talmage-jesus-christ-13
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-13?lang=eng'
    quote: 'among the despised people of Samaria'
  - where: 'note 4:48 “Except ye see signs and wonders”'
    claim: 'The Samaritans believed without a miracle'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/4.htm'
    quote: 'was the acceptance by the Samaritans without a miracle, who believed for the woman’s word'
  - where: 'note 4:54 “The second sign”'
    claim: 'As the Divine Word first created, the Incarnate Word reorganizes (water to wine)'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'Instead, it reveals Jesus as Jehovah. Just as the Divine Word had first created, or organized, the world, the Incarnate Word reorganizes.'
  - where: 'note 4:54 “The second sign”'
    claim: 'The first signs frame 2:1–4:54 and stress new life'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'The first signs and dialogues comprise a discrete unit, framed by miracles performed in the Galilean town of Cana (2:1–4:54). These all stress the theme of newness, particularly the new life that Jesus has come to bring.'
  - where: 'christ'
    claim: 'Sometimes Jesus seeks us out and begins the dialogue, as with the Samaritan woman'
    key: strathearn-johannine-dialogues
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/johannine-christology-through-lens-three-its-dialogues'
    quote: 'Sometimes, as was the case with both the Samaritan woman and the blind man, he will be the one to seek us out and initiate the dialogue.'
  # ---- christ
  - where: christ
    claim: 'Elder Robert C. Gay: the message of the woman at the well is that He knows our life situations'
    key: gay-taking-name
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2018/10/taking-upon-ourselves-the-name-of-jesus-christ?lang=eng'
    quote: 'The message of the woman at the well is that He knows our life situations and that we can always walk with Him no matter where we stand.'
