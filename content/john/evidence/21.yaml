chapter: 21
claims:
  # ---- when, setting, thread
  - where: when
    claim: 'The appearance came at some point after the first Easter, when disciples had returned to Galilee'
    key: huntsman-postlude
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/postlude-later-appearances-ongoing-apostolic-witness'
    quote: 'At some point after the first Easter, a group of Jesus’s disciples returned to Galilee, apparently in response to the direction that they had received Easter morning (Mark 16:7; parallel Matt 28:7, 10).'
  - where: when
    claim: 'Jesus was seen by the apostles over forty days before His ascension'
    key: huntsman-postlude
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/postlude-later-appearances-ongoing-apostolic-witness'
    quote: 'The opening of the book of Acts reports that Jesus was seen by his apostles over the course of forty days before his ascension (Acts 1:2‒4).'
  - where: setting
    claim: 'The epilogue resumes a narrative that seemed to end at 20:30–31; its style may suggest a later addition'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'The style of the epilogue (21:1–25) may suggest that it was a later addition; it certainly resumes a narrative that seemed to end with the programmatic statement of John 20:30–31.'
  - where: setting
    claim: 'The epilogue: a last appearance to seven disciples, Peter’s threefold proclamation, a turn to the future of the Church, the beloved disciple'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'Jesus’s loving dialogue with Peter not only provides the leader of the Twelve with a chance to proclaim his love three times after his earlier threefold denial, it also shifts the story of Jesus to the future of his Church, which Peter will lead and care for (21:15–19).'
  - where: setting
    claim: 'The disciples went to Galilee in response to the direction of Easter morning'
    key: huntsman-postlude
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/postlude-later-appearances-ongoing-apostolic-witness'
    quote: 'a group of Jesus’s disciples returned to Galilee, apparently in response to the direction that they had received Easter morning (Mark 16:7; parallel Matt 28:7, 10).'
  - where: setting
    claim: 'The Gospels record two appearances in Galilee, by the seashore and on a mountain; most of the forty days’ appearances are not preserved'
    key: huntsman-postlude
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/postlude-later-appearances-ongoing-apostolic-witness'
    quote: 'While records of most of these appearances have not been preserved in the canonical books of the New Testament, the Gospels contain accounts of two important visitations in Galilee, one by the seashore (John 21:1‒22) and another on a mountain (Matt 28:16–20).'
  - where: setting
    claim: 'The Sea of Galilee was also called the Sea of Tiberias; the traditional site is near Tabgha'
    key: huntsman-postlude
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/postlude-later-appearances-ongoing-apostolic-witness'
    quote: 'According to tradition, the site of this appearance was near a place called Heptapegon (the modern Tabgha), northwest of the Sea Galilee, which was also known in this period as the Sea of Tiberias.'
  - where: setting
    claim: 'D&C 7 was received when Joseph Smith and Oliver Cowdery asked whether John tarried in the flesh or had died'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/7?lang=eng'
    quote: 'Revelation given to Joseph Smith the Prophet and Oliver Cowdery, at Harmony, Pennsylvania, April 1829, when they inquired through the Urim and Thummim as to whether John, the beloved disciple, tarried in the flesh or had died.'
  - where: thread
    claim: 'The Galilean fishermen-turned-again-Apostles left their nets a second time'
    key: holland-first-great-commandment
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2012/10/the-first-great-commandment?lang=eng'
    quote: 'It was this truth, this reality, that allowed a handful of Galilean fishermen-turned-again-Apostles without “a single synagogue or … sword” to leave those nets a second time and go on to shape the history of the world in which we now live.'
  - where: thread
    claim: 'The dialogue with Peter shifts the story to the future of the Church'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'it also shifts the story of Jesus to the future of his Church, which Peter will lead and care for (21:15–19).'
  # ---- section plain
  - where: section 1 plain
    claim: '“Children” was an address like “lads”; “meat” is anything eaten with bread, i.e. fish'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/21.htm'
    quote: 'appears also to have been used as an address to workmen or inferiors, not unlike our own words “boys” or “lads.”'
  - where: section 2 plain
    claim: 'The second and third “feed” is better “be a shepherd of”'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/21.htm'
    quote: 'Feed my sheep.—Better, be a shepherd of My sheep.'
  # ---- notes
  - where: 'note 21:2 “Seven disciples”'
    claim: 'The seven serve as types; Peter and Thomas had stumbled and are rehabilitated; Nathanael may stand for non-apostolic disciples; the unnamed two for any disciples; seven is fullness'
    key: huntsman-postlude
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/postlude-later-appearances-ongoing-apostolic-witness'
    quote: 'The first two listed are Simon Peter and Thomas, which is significant because they are usually seen as having stumbled in their discipleship, Peter through his denial of knowing Jesus and Thomas for his initial doubt.[2] Their appearance in this select group thus signals their rehabilitation'
  - where: 'note 21:2 “Seven disciples”'
    claim: 'The two unnamed serve as types of any disciples; seven represents fullness, so the group can represent all disciples'
    key: huntsman-postlude
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/postlude-later-appearances-ongoing-apostolic-witness'
    quote: 'their anonymity here allows them to serve as types of any disciples in any age. Given that the number seven represents fullness or completeness, symbolically the group can represent all disciples.'
  - where: 'note 21:2 “Seven disciples”'
    claim: 'Nathanael may have been a non-apostolic disciple; the sons of Zebedee are James and John'
    key: huntsman-postlude
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/postlude-later-appearances-ongoing-apostolic-witness'
    quote: 'he may well have been an early important, nonapostolic disciple, in which case he can represent those who fully follow Jesus even though they are not members of the Twelve.[3] Although the sons of Zebedee are never named in John, from the Synoptics we know that they are the apostles James and John'
  - where: 'note 21:3 “I go a fishing”'
    claim: 'Elder Holland, with acknowledged nonscriptural liberty, portrays Peter as proposing a return to their former life'
    key: holland-first-great-commandment
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2012/10/the-first-great-commandment?lang=eng'
    quote: 'Here I ask your indulgence as I take some nonscriptural liberty in my portrayal of this exchange. … I don’t know more to tell you than to return to your former life, rejoicing. I intend to ‘go a fishing.’”'
  - where: 'note 21:3 “I go a fishing”'
    claim: 'An encounter with the risen Lord means one cannot go back; the Resurrection begins a Christian life'
    key: holland-first-great-commandment
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2012/10/the-first-great-commandment?lang=eng'
    quote: 'We can’t quit and we can’t go back. After an encounter with the living Son of the living God, nothing is ever again to be as it was before. The Crucifixion, Atonement, and Resurrection of Jesus Christ mark the beginning of a Christian life, not the end of it.'
  - where: 'note 21:3 “I go a fishing”'
    claim: 'The disciples had gone to Galilee in response to the direction of Easter morning'
    key: huntsman-postlude
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/postlude-later-appearances-ongoing-apostolic-witness'
    quote: 'a group of Jesus’s disciples returned to Galilee, apparently in response to the direction that they had received Easter morning (Mark 16:7; parallel Matt 28:7, 10).'
  - where: 'note 21:5 “Children, have ye any meat?”'
    claim: 'The word for “children” was used to address workmen, like “lads”; the disciples seem to have taken it so, as from a passer-by wanting fish'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/21.htm'
    quote: 'It is a word which, indeed, may express His love for them (comp. John 4:49), but which appears also to have been used as an address to workmen or inferiors, not unlike our own words “boys” or “lads.” They seem to take it in this sense, as though some traveller passing by asked the question because he wished to purchase some of their fish.'
  - where: 'note 21:5 “Children, have ye any meat?”'
    claim: 'The word rendered “meat” means anything eaten with bread, the fish being the ordinary relish'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/21.htm'
    quote: 'The word rendered “meat” occurs here only in the New Testament. It means anything eaten with bread, and was used as equivalent to the fish which was the ordinary relish.'
  - where: 'note 21:5 “Children, have ye any meat?”'
    claim: 'Elder Holland: the apostles were rightly called “children”'
    key: holland-first-great-commandment
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2012/10/the-first-great-commandment?lang=eng'
    quote: 'These “children,” as they were rightly called, eagerly lowered their net, and “they were not able to draw it for the multitude of fishes.”'
  - where: 'note 21:6 “Cast the net on the right side”'
    claim: 'The night of catching nothing recalls Peter’s first call in Luke 5; like Mary and the Emmaus disciples they did not at first recognize Him'
    key: huntsman-postlude
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/postlude-later-appearances-ongoing-apostolic-witness'
    quote: 'The seven have spent the night fishing but have not caught anything, which is reminiscent of Peter’s first call in Luke 5:1‒11. As with Mary of Magdala and the two disciples on the road to Emmaus, the group does not at first recognize Jesus when he appears on the shore'
  - where: 'note 21:6 “Cast the net on the right side”'
    claim: 'The similarity to the first call seems to have been what made the beloved disciple realize it was the Lord'
    key: huntsman-postlude
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/postlude-later-appearances-ongoing-apostolic-witness'
    quote: 'The similarity to the original calling of Peter, Andrew, James, and John, when a miraculous catch of fish resulted in the nets breaking (Luke 5:6‒7), seems to have been what caused the Beloved Disciple to realize, “It is the Lord!” (John 21:6‒8).'
  - where: 'note 21:6 “Cast the net on the right side”'
    claim: 'With the stranger’s words recognition begins; three years earlier they had fished this sea and toiled all night'
    key: holland-first-great-commandment
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2012/10/the-first-great-commandment?lang=eng'
    quote: '“Cast the net on the right side of the ship, and ye shall find,” the stranger calls out—and with those simple words, recognition begins to flood over them. Just three years earlier these very men had been fishing on this very sea.'
  - where: 'note 21:7 “It is the Lord”'
    claim: 'John, quick to discern, spoke; Peter girt his coat and sprang into the sea to reach his Master'
    key: talmage-jesus-christ-37
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-37?lang=eng'
    quote: 'John, quick to discern, said to Peter, “It is the Lord”; and Peter, impulsive as ever, hastily girt his fisher’s coat about him and sprang into the sea, the sooner to reach land and prostrate himself at his Master’s feet.'
  - where: 'note 21:7 “It is the Lord”'
    claim: 'The disciple whom Jesus loved is John (D&C 7, which answers this chapter’s question about him)'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'Doctrine and Covenants 7:1–3, a revelation that seems to have been received because of a discussion that Joseph Smith and Oliver Cowdery had about the fate of the Apostle John, directly equates John with the “the disciple whom Jesus loved” in John 21:20–23.'
  - where: 'note 21:9 “A fire of coals”'
    claim: 'The charcoal fire (anthrakia) connects the scene to Peter’s denial by the charcoal fire of 18:18'
    key: huntsman-postlude
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/postlude-later-appearances-ongoing-apostolic-witness'
    quote: 'A detail, seemingly mentioned in passing about the charcoal fire on which Jesus had cooked the fish and bread for his friends (John 21:9), connects the scene closely with the episode of Peter’s earlier denial, where he had warmed himself in John 18:18 by “a charcoal fire” (Greek, anthrakian; KJV, “fire of coals”).'
  - where: 'note 21:9 “A fire of coals”'
    claim: '18:18 is the only other place the word occurs; the lake, the nets and the fire would bring back his call and his denial'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/21.htm'
    quote: 'By the side of the “fire of coals” (see Note on John 18:18, the only other place where the word occurs) he had denied his Lord. As the eye rests upon the “fire of coals” before him, and he is conscious of the presence of the Lord'
  - where: 'note 21:9 “A fire of coals”'
    claim: 'Jesus had already prepared a breakfast for them'
    key: huntsman-postlude
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/postlude-later-appearances-ongoing-apostolic-witness'
    quote: 'When they arrive, they find that Jesus has already prepared for them a breakfast of fish and bread'
  - where: 'note 21:11 “Yet was not the net broken”'
    claim: 'At the first call the nets broke, perhaps symbolizing an imperfect first call; now the full net is brought to shore with all 153 fish'
    key: huntsman-postlude
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/postlude-later-appearances-ongoing-apostolic-witness'
    quote: 'Jesus had called his first disciples “to be fishers of men,” yet whereas their first call to the ministry was imperfect, perhaps symbolized by the broken nets, this time they are able to tow the full net all the way to shore, bringing all one hundred fifty-three fish with them to present to Jesus.'
  - where: 'note 21:11 “Yet was not the net broken”'
    claim: 'The size and number led to an exact count; no clue to a mystical meaning of 153'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/21.htm'
    quote: 'These were all “great,” and their size and number led to an exact account being taken of them. … We have no clue to any mystical interpretation of this number, and it is probably not intended to convey one.'
  - where: 'note 21:11 “Yet was not the net broken”'
    claim: 'John calls the catch the final sign, in the epilogue'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'John records far fewer miracles than the Synoptics, with seven in the first major section of his gospel, the Book of Signs, and a final sign, the miraculous catch of 153 fish, in the epilogue.'
  - where: 'note 21:13 “Taketh bread, and giveth them”'
    claim: 'The breakfast recalls the feeding of the five thousand, near this site; the meal symbolizes the sacrament and the messianic banquet'
    key: huntsman-postlude
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/postlude-later-appearances-ongoing-apostolic-witness'
    quote: 'reminiscent of the earlier great miracle of provision known as the feeding of the five thousand (Mark 6:31‒34; parallels Matt 14:13‒21; Luke 9:12‒18; also John 6:1‒14), which traditionally occurred not far from this very site. Similarly, just as the ministry had begun in this Gospel at a wedding feast, the story comes to an end in this episode meal symbolizing both the sacrament and the future messianic banquet.'
  - where: 'note 21:13 “Taketh bread, and giveth them”'
    claim: 'Jesus served as Host; we are not told He ate; there was an awe about Him; they durst not question'
    key: talmage-jesus-christ-37
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-37?lang=eng'
    quote: 'as the Host at the meal, He divided and distributed the bread and fish. We are not told that He ate with His guests. Everyone knew that it was the Lord who so hospitably served; yet on this, as on all other occasions of His appearing in the resurrected state, there was about Him an awe-inspiring and restraining demeanor.'
  - where: 'note 21:13 “Taketh bread, and giveth them”'
    claim: 'They approached in reverent silence, knowing it was the Lord, and did not dare to ask'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/21.htm'
    quote: 'They approach Him in reverent silence. Knowing it is the Lord, they yet desire the assurance in His own words, and still they do not dare to ask, “Who art thou?”'
  - where: 'note 21:14 “The third time”'
    claim: 'The count is of appearances to the apostles assembled; with the others, this is the seventh recorded'
    key: talmage-jesus-christ-37
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-37?lang=eng'
    quote: 'by which we understand the occasion to have been the third on which Christ had manifested Himself to the apostles, in complete or partial assembly; for, including also the appearing to Mary Magdalene, to the other women, to Peter, and to the two disciples on the country road, this was the seventh recorded appearance of the risen Lord.'
  - where: 'note 21:14 “The third time”'
    claim: 'John counts only appearances to the disciples: to the Ten on Easter day and the Eleven a week later'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/21.htm'
    quote: 'He passes over, therefore, the appearances to Mary Magdalene and others, and counting only those “to the disciples”—to the Ten on the first Easter day, and to the Eleven on its octave—gives this appearance as the third.'
  - where: 'note 21:15 “More than these”'
    claim: '“These” are the other disciples, recalling Peter’s confident comparison of himself with them'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/21.htm'
    quote: 'Lovest thou me more than these?—i.e., than these disciples who are present here with thee. … The obvious reference is to Peter’s own comparison of himself with others in the confidence of love which he thought could never fail. (Comp. Matthew 26:33; Mark 14:29.)'
  - where: 'note 21:15 “More than these”'
    claim: 'The question recalled Peter’s protestation “Though all men shall be offended … yet will I never be offended”'
    key: talmage-jesus-christ-37
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-37?lang=eng'
    quote: 'The question, however tenderly put, must have wrung Peter’s heart, coupled as it was with the reminder of his bold but undependable protestation, “Though all men shall be offended because of thee, yet will I never be offended”'
  - where: 'note 21:15 “More than these”'
    claim: 'Elder Holland reads the question as love for Him more than the boats, nets and fish'
    key: holland-first-great-commandment
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2012/10/the-first-great-commandment?lang=eng'
    quote: 'Looking at their battered little boats, their frayed nets, and a stunning pile of 153 fish, Jesus said to His senior Apostle, “Peter, do you love me more than you love all this?”'
  - where: 'note 21:15 “More than these”'
    claim: '“Simon, son of Jonas” addresses him by his natural rather than his apostolic name'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/21.htm'
    quote: 'Our Lord’s words would seem to address him as one who had fallen from the steadfastness of the Rock-man, and had been true rather to his natural than to his apostolic name.'
  - where: 'note 21:16 “Two words for love, two for feeding”'
    claim: 'Some read agapaō (twice by Jesus) and phileō (Peter each time; Jesus the third time) as teaching different aspects; feed = boskō, tend = poimainō; lambs and sheep'
    key: ball-peters-witness
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/whom-say-ye-i-am-peters-witness-christ'
    quote: 'the Savior twice asked Peter “lovest thou me” using the Greek agapao for love … The third time Jesus asked Peter, “Lovest thou me,” he used the term phileo for love, meaning friendship, affection, or brotherly love. Interestingly, in answer to each of the three questions Peter affirmed his love using phileo.'
  - where: 'note 21:16 “Two words for love, two for feeding”'
    claim: 'Boskō means to pasture or nourish, poimainō to tend or shepherd; Peter is to nourish and shepherd young and old'
    key: ball-peters-witness
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/whom-say-ye-i-am-peters-witness-christ'
    quote: 'Thus by asking the question three times in three ways the Savior asked the disciple if he had both charity and brotherly love for him, and in his subsequent commandments the Savior taught Peter that he was to not only nourish but also shepherd both the young and old of his flock.'
  - where: 'note 21:16 “Two words for love, two for feeding”'
    claim: 'John often uses the two love words interchangeably; the lesson is that love is shown by tending His sheep'
    key: huntsman-postlude
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/postlude-later-appearances-ongoing-apostolic-witness'
    quote: 'While some commentators have attempted to explain the different Greek words that Jesus and Peter used for love in this passage, the evangelist often uses these terms interchangeably in this Gospel.[8] Instead, Jesus teaches Peter—and through him, us—that the way to show love for the Master is tending to the needs of his sheep'
  - where: 'note 21:17 “Three times”'
    claim: 'The triple question let Peter proclaim his love three times, compensating for the threefold denial; his later service showed his full rehabilitation'
    key: huntsman-peters-denial
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/accounts-peters-denial-understanding-texts-motifs'
    quote: 'Jesus’ triple questioning of Peter, asking whether Peter loved him, at the end of John’s Gospel provided an opportunity for Peter to proclaim his love three times, compensating for his earlier threefold denial (John 21:15–19). His subsequent faithfulness in feeding Christ’s sheep through the course of his faithful ministry thus illustrated his complete rehabilitation.'
  - where: 'note 21:17 “Three times”'
    claim: 'The greatest lesson: Peter, like us, could make mistakes and through Christ be fully redeemed'
    key: huntsman-peters-denial
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/accounts-peters-denial-understanding-texts-motifs'
    quote: 'What should perhaps be the greatest lesson drawn from the denial stories is that Peter, like all of us, could make mistakes, but through Jesus Christ he could be fully redeemed, rehabilitated, and able to serve faithfully.'
  - where: 'note 21:17 “Three times”'
    claim: 'Peter was grieved, perhaps thinking the Lord mistrusted him; as he had three times denied, he was given a triple confession'
    key: talmage-jesus-christ-37
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-37?lang=eng'
    quote: 'Peter was pained and grieved at this reiteration, thinking perhaps that the Lord mistrusted him; but as the man had three times denied, so now was he given opportunity for a triple confession.'
  - where: 'note 21:17 “Three times”'
    claim: 'Holland: perhaps Peter remembered being asked another question three times only days before'
    key: holland-first-great-commandment
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2012/10/the-first-great-commandment?lang=eng'
    quote: 'Perhaps there is in his heart the memory of only a few days earlier when he had been asked another question three times and he had answered equally emphatically—but in the negative.'
  - where: 'note 21:17 “Three times”'
    claim: 'The commission was an assurance of the Lord’s confidence and of Peter’s presidency'
    key: talmage-jesus-christ-37
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-37?lang=eng'
    quote: 'The commission “Feed my Sheep” was an assurance of the Lord’s confidence, and of the reality of Peter’s presidency among the apostles.'
  - where: 'note 21:18 “Thou shalt stretch forth thy hands”'
    claim: 'The analogy points to crucifixion, and tradition is without contradiction that Peter died so; his later writings show he understood'
    key: talmage-jesus-christ-37
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-37?lang=eng'
    quote: 'the analogy points to crucifixion, and traditional history is without contradiction as to this being the death by which Peter sealed his testimony of the Christ.'
  - where: 'note 21:18 “Thou shalt stretch forth thy hands”'
    claim: 'Peter comprehended the reference to his martyrdom, as his later writings indicate'
    key: talmage-jesus-christ-37
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-37?lang=eng'
    quote: 'Without doubt Peter comprehended the reference to his martyrdom, as his writings, years later, indicate.'
  - where: 'note 21:18 “Thou shalt stretch forth thy hands”'
    claim: 'Tradition from Tertullian on says Peter was crucified, and Tertullian read this verse so'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/21.htm'
    quote: 'Tradition, from Tertullian downwards (Scorp. xv.; De Praescr. xxxv.), states that he was crucified, and, interpreting this prophecy by the event, asserts that they do.'
  - where: 'note 21:18 “Thou shalt stretch forth thy hands”'
    claim: 'Peter had announced readiness to follow to prison and death'
    key: talmage-jesus-christ-37
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-37?lang=eng'
    quote: 'He had emphatically announced his readiness to follow his Master even to prison and death.'
  - where: 'note 21:19 “Follow me”'
    claim: 'By this lake Peter first heard “Follow me”; at the Supper he was told he would follow afterwards; now it comes with the prophecy of martyrdom'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/21.htm'
    quote: 'By the side of that lake he had first heard the command “Follow Me” (Matthew 4:19); … to his question at the Last Supper came the answer, “Whither I go, thou canst not follow Me now; but thou shalt follow Me afterwards” (John 13:36); and now the command has come again with the prophecy of martyrdom'
  - where: 'note 21:19 “Follow me”'
    claim: 'The command had immediate and future meaning: Peter followed Jesus apart, and would follow Him to the cross'
    key: talmage-jesus-christ-37
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-37?lang=eng'
    quote: 'The command had both immediate and future significance. The man followed as Jesus drew apart from the others on the shore; yet a few years and Peter would follow his Lord to the cross.'
  - where: 'note 21:21 “What shall this man do?”'
    claim: '“Following” (akolouthounta) also implies discipleship; Peter’s question can stand for one asking about another’s mission; we should not judge others’ discipleship; most are called to live for Him'
    key: huntsman-postlude
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/postlude-later-appearances-ongoing-apostolic-witness'
    quote: 'Because the verb used (Greek, akolouthounta) frequently also implies discipleship, this passage may be more than just Peter asking about the future of the historical figure of John. In addition, it can represent one person asking about the discipleship and mission of another.'
  - where: 'note 21:21 “What shall this man do?”'
    claim: 'Not to concern oneself with another’s mission; not to judge; most are called to live for Him'
    key: huntsman-postlude
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/postlude-later-appearances-ongoing-apostolic-witness'
    quote: 'While select figures through history, like Peter, have been willing to die for their testimonies of Jesus, most of us are called to live for him. Further, just as Jesus directed Peter to not concern himself about the particular mission of John the Beloved, so we should not seek to judge the discipleship of others.'
  - where: 'note 21:21 “What shall this man do?”'
    claim: 'Peter wished to know his companion’s fate; the reply was an admonition to look to his own duty'
    key: talmage-jesus-christ-37
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-37?lang=eng'
    quote: 'Peter wished to peer into the future as to his companion’s fate—was John also to die for the faith? … It was an admonition to Peter to look to his own course of duty, and to follow the Master, wherever the road should lead.'
  - where: 'note 21:21 “What shall this man do?”'
    claim: 'The “thou” of “follow thou me” is strongly emphatic'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/21.htm'
    quote: 'Follow thou me.—The pronoun “thou” is strongly emphatic.'
  - where: 'note 21:22 “Till I come”'
    claim: 'D&C 7: John asked for power over death to bring souls; he would tarry until the Lord comes in glory'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/7?lang=eng'
    quote: 'And for this cause the Lord said unto Peter: If I will that he tarry till I come, what is that to thee? For he desired of me that he might bring souls unto me, but thou desiredst that thou mightest speedily come unto me in my kingdom.'
  - where: 'note 21:22 “Till I come”'
    claim: 'D&C 7 is a translated version of John’s parchment record, given in answer to whether John tarried or died'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/7?lang=eng'
    quote: 'The revelation is a translated version of the record made on parchment by John and hidden up by himself.'
  - where: 'note 21:22 “Till I come”'
    claim: 'Latter-day revelation clarifies John 21:20–23: John did not die but remains as a ministering servant until the Second Coming'
    key: bd-john
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/john?lang=eng'
    quote: 'We especially have a clarification of John 21:20–23, ascertaining that John did not die but has been allowed to remain on the earth as a ministering servant until the time of the Lord’s Second Coming (3 Ne. 28:6; D&C 7).'
  - where: 'note 21:22 “Till I come”'
    claim: 'To tarry until He comes means John would be translated; translated beings are changed, immortal but not resurrected'
    key: judd-szink-dc7
    url: 'https://rsc.byu.edu/doctrine-covenants-revelations-context/john-beloved-latter-day-scripture-dc-7'
    quote: 'The Lord responded by confirming to John that he would “tarry until I come in my glory” (D&C 7:3)—in other words, he would be translated.'
  - where: 'note 21:22 “Till I come”'
    claim: 'Translated beings are not celestial or resurrected but immortal'
    key: judd-szink-dc7
    url: 'https://rsc.byu.edu/doctrine-covenants-revelations-context/john-beloved-latter-day-scripture-dc-7'
    quote: 'Translated beings are not celestial or resurrected, but they are immortal.'
  - where: 'note 21:22 “Till I come”'
    claim: '3 Nephi 28 is essentially a commentary on D&C 7 and John 21:21–23'
    key: judd-szink-dc7
    url: 'https://rsc.byu.edu/doctrine-covenants-revelations-context/john-beloved-latter-day-scripture-dc-7'
    quote: 'Thus, the information we learn about the translation of the Three Nephites illuminates us about the translation of John as well. In other words, 3 Nephi 28 is essentially a commentary on Doctrine and Covenants 7 (and John 21:21–23).'
  - where: 'note 21:22 “Till I come”'
    claim: 'The second half of v. 23 seems to discount John’s translation and likely reflects an editor’s view of the speculation'
    key: judd-szink-dc7
    url: 'https://rsc.byu.edu/doctrine-covenants-revelations-context/john-beloved-latter-day-scripture-dc-7'
    quote: 'Taken at face value, the second part of this statement seems to discount the idea of John’s being translated. Those words likely reflect an editor’s view of the speculation about John.'
  - where: 'note 21:22 “Till I come”'
    claim: 'Without modern revelation the passage is ambiguous enough to have caused much confusion'
    key: judd-szink-dc7
    url: 'https://rsc.byu.edu/doctrine-covenants-revelations-context/john-beloved-latter-day-scripture-dc-7'
    quote: 'Without the additional truth that modern revelation supplies, the information contained in John 21:20–23 is ambiguous enough to have fostered a great deal of confusion concerning the fate of John the Beloved.'
  - where: 'note 21:22 “Till I come”'
    claim: 'The JST does not change John 21:20–23; the fuller answer came in D&C 7, expanded in 1835'
    key: judd-szink-dc7
    url: 'https://rsc.byu.edu/doctrine-covenants-revelations-context/john-beloved-latter-day-scripture-dc-7'
    quote: 'Although the Joseph Smith Translation does not change the text of John 21:20–23, it is interesting to note that while work on the Joseph Smith Translation led Joseph Smith to receive further inspiration, that revealed information was not always included in the translation but sometimes in the Doctrine and Covenants.'
  - where: 'note 21:22 “Till I come”'
    claim: 'The 1835 expanded version added detail about John’s mission as a translated being'
    key: judd-szink-dc7
    url: 'https://rsc.byu.edu/doctrine-covenants-revelations-context/john-beloved-latter-day-scripture-dc-7'
    quote: 'Much of what was added in 1835 is a more detailed elaboration of these basic concepts, especially concerning the specifics of John’s future mission as a translated being.'
  - where: 'note 21:24 “We know that his testimony is true”'
    claim: 'Verse 24 is an editorial addition; it may mean the disciple caused his witness to be written by a scribe'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'An editorial addition at the very end of the Gospel maintains, “This is the disciple which testifieth of these things, and wrote these things: and we know that his testimony is true” (John 21:24; emphasis added). While this passage seems to suggest that this disciple was the author of the text, it could mean that he caused his witness to be written by a scribe or other intermediary.'
  - where: 'note 21:24 “We know that his testimony is true”'
    claim: 'The “we know” words are a contemporaneous addition, in every important manuscript and version; we cannot tell whose'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/21.htm'
    quote: 'But though the words are an addition, they are a contemporaneous addition present in every important MS. and version, and an undoubted part of the original text. We cannot tell who are the persons whose words we here read'
  - where: 'note 21:24 “We know that his testimony is true”'
    claim: 'Latter-day revelations seem to confirm that John wrote it'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'This propensity is understandable because Latter-day revelations seem to confirm that John wrote it (see Doctrine and Covenants 7; 77:1–15; 88:141; see also 1 Nephi 14:18–27 and Ether 4:16, which directly link the book of Revelation with John).'
  - where: 'note 21:25 “The world itself could not contain the books”'
    claim: 'The shift from “we know” to “I suppose” suggests the individual testimony of an amanuensis; the Gospel is only part of the fulness; written that we may believe'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/21.htm'
    quote: 'The transference from the plural to the singular—“We know” (John 21:24), “I suppose” (in this verse)—has led to the supposition, which is in every way probable, that it is the individual testimony of an amanuensis'
  - where: 'note 21:25 “The world itself could not contain the books”'
    claim: 'Full as the Gospel is, it is only part of the fulness; the disciples wrote that we may believe'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/21.htm'
    quote: 'feels that full beyond all human thought as this Gospel is, it is but a part of the greater fulness. No book could record, no words could tell, what that life was, or what things Jesus did. The disciples saw and believed, and wrote these things that we may believe'
  - where: 'note 21:2 “Seven disciples”'
    claim: 'The appearance uses its characters as types of how disciples continue to follow Jesus'
    key: huntsman-postlude
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/postlude-later-appearances-ongoing-apostolic-witness'
    quote: 'it is also one that serves an important literary function, using its characters as important types of how different disciples continue to follow Jesus.'
  - where: 'note 21:5 “Children, have ye any meat?”'
    claim: 'They gave the answer no fisherman wants to give'
    key: holland-first-great-commandment
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2012/10/the-first-great-commandment?lang=eng'
    quote: 'Glumly these Apostles-turned-again-fishermen gave the answer no fisherman wants to give.'
  - where: 'note 21:11 “Yet was not the net broken”'
    claim: 'Explanations of 153: one of every kind of fish, the nations, the Trinity'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/21.htm'
    quote: 'such as that it represents one of every kind of fish known to the natural history of the day; or that one hundred represents the Gentile nations, fifty the Jews, and three the Trinity'
  - where: 'note 21:11 “Yet was not the net broken”'
    claim: 'The catch would be talked of, and John records it with his characteristic exactness'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/21.htm'
    quote: 'This would be talked of among the Apostles and their friends and fellow-craftsmen, and is, with the picturesque exactness which is characteristic of St. John, recorded here.'
  - where: 'note 21:16 “Two words for love, two for feeding”'
    claim: 'Latter-day Saint commentaries of this type exist (Lund, Webb)'
    key: ball-peters-witness
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/whom-say-ye-i-am-peters-witness-christ'
    quote: 'For Latter-day Saint commentaries of this type, see Anthon H. Lund, in Conference Report, October 1908, 119'
  - where: 'note 21:18 “Thou shalt stretch forth thy hands”'
    claim: '“By what death” marks martyrdom as distinct from natural death, without special reference to crucifixion'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/21.htm'
    quote: 'indicates generally the martyrdom of Peter as distinct from a natural death, without special reference to the crucifixion.'
  - where: 'note 21:22 “Till I come”'
    claim: 'D&C 7 was given in April 1829 when they asked whether John tarried or died'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/7?lang=eng'
    quote: 'Revelation given to Joseph Smith the Prophet and Oliver Cowdery, at Harmony, Pennsylvania, April 1829, when they inquired through the Urim and Thummim as to whether John, the beloved disciple, tarried in the flesh or had died.'
  # ---- christ
  - where: christ
    claim: 'The way to show love for the Master is tending to His sheep, as King Benjamin taught'
    key: huntsman-postlude
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/postlude-later-appearances-ongoing-apostolic-witness'
    quote: 'Jesus teaches Peter—and through him, us—that the way to show love for the Master is tending to the needs of his sheep, just as King Benjamin taught “when ye are in the service of your fellow beings, ye are only in the service of your God” (Mosiah 2:17).'
  - where: christ
    claim: 'Though we fail, we can be redeemed and renew devotion by ministering'
    key: huntsman-postlude
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/postlude-later-appearances-ongoing-apostolic-witness'
    quote: 'though we fail, we can be redeemed, proceeding as faithful but fallible disciples to renew our devotion to the Risen Lord by ministering to others.'
  - where: christ
    claim: 'The Lord gave the Twelve of this dispensation the same charge, “feed my sheep”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/112?lang=eng'
    quote: 'Now, I say unto you, and what I say unto you, I say unto all the Twelve: Arise and gird up your loins, take up your cross, follow me, and feed my sheep.'
  - where: christ
    claim: 'The crowning characteristic of love is loyalty'
    key: holland-first-great-commandment
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2012/10/the-first-great-commandment?lang=eng'
    quote: 'And if at such a moment we can stammer out, “Yea, Lord, thou knowest that I love thee,” then He may remind us that the crowning characteristic of love is always loyalty.'
  # ---- explore
  - where: explore
    claim: 'The Postlude reads the seashore appearance and the ongoing apostolic witness'
    key: huntsman-postlude
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/postlude-later-appearances-ongoing-apostolic-witness'
    quote: 'Eric D. Huntsman and Trevan G. Hatch, "Postlude: Later Appearances and the Ongoing Apostolic Witness," in Greater Love Hath No Man: A Latter-Day Saint Guide to Celebrating the Easter Season (Provo, UT: Religious Studies Center, Brigham Young University; Salt Lake City: Deseret Book), 239‒56.'
  - where: explore
    claim: 'Judd and Szink on D&C 7 and translated beings'
    key: judd-szink-dc7
    url: 'https://rsc.byu.edu/doctrine-covenants-revelations-context/john-beloved-latter-day-scripture-dc-7'
    quote: 'Latter-day scripture not only confirms that John did not die but also provides valuable information about translated beings.'
  - where: 'note 21:15 “More than these”'
    claim: 'Some take “these” as the other disciples, but the message is clearer if “these” are the fish'
    key: ball-peters-witness
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/whom-say-ye-i-am-peters-witness-christ'
    quote: 'Some understand the antecedent of these in this verse to be the other disciples dining with them, but the message is clearer if we understand these as a reference to the fish.'
  - where: 'note 21:18 “Thou shalt stretch forth thy hands”'
    claim: 'Against reading the words as crucifixion: the girding would precede, not follow, a crucifixion'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/21.htm'
    quote: 'the girding (with chains) would precede, not follow, the crucifixion'
