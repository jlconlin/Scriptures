chapter: 7
claims:
  # ---- when, setting, thread, plain words
  - where: when
    claim: 'Tabernacles came about five months after the Passover'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/7.htm'
    quote: 'The interval, then, from Passover to Tabernacles is one of about five months.'
  - where: setting
    claim: 'John 5–10 is set at the Jewish feasts and shows Jesus as the fulfillment of the law and expectations'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'The next collection of signs and discourses occurs in the context of Jewish feasts, including the weekly festival of the Sabbath and the annual celebrations of Passover, Tabernacles, and Dedication (5:1–10:42). In this section, Jesus’s actions and teachings reveal him as the fulfillment of the Jewish law and expectations.'
  - where: setting
    claim: 'Tabernacles fell in the seventh month, about September; Josephus called it the holiest and greatest feast'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/7.htm'
    quote: 'This began on “the fifteenth day of the seventh month” (Leviticus 23:34), i.e., the 15th of Tishri, which answers to our September. … Josephus speaks of it as the holiest and greatest of the feasts.'
  - where: setting
    claim: 'Tabernacles was one of the three feasts at which all males were to appear before the Lord'
    key: bd-feasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/feasts?lang=eng'
    quote: 'The law commanded that three times a year all the males of the covenant people were to appear before the Lord in the place that He should choose; that is, in the Feast of Unleavened Bread, in the Feast of Weeks, and in the Feast of Tabernacles'
  - where: setting
    claim: 'The water ceremony and the lampstands stand behind John 7:37–39 and 8:12'
    key: gardner-tabernacles
    url: 'https://rsc.byu.edu/learn-me/jesus-christ-feast-tabernacles'
    quote: 'In the Savior’s declarations in John 7:37–39 and John 8:12, reference to two key features of the Feast of Tabernacles—the water-pouring ceremony and the lighted lampstands—may be seen as rather overt.'
  - where: setting
    claim: 'The opponents in John are the Jerusalem Jews, or at least their leaders'
    key: matson-fourth-gospel
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/fourth-gospel-expectations-jewish-messiah'
    quote: 'The Fourth Gospel makes no attempt to veil the fact that the Jews from Jerusalem, or at least their leaders, are the most unwilling to accept Jesus as the Christ'
  - where: setting
    claim: 'He went up in secret, not with the usual company of pilgrims'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/7.htm'
    quote: 'Not openly, but as it were in secret—i.e., not with the usual company.'
  - where: setting
    claim: 'The earliest manuscripts omit 7:53 together with 8:1–11'
    key: densley-adultery
    url: 'https://interpreterfoundation.org/journal/procedural-violations-in-the-trial-of-the-woman-taken-in-adultery'
    quote: 'The earliest manuscripts of the New Testament omit this verse and John 8:1–11.'
  - where: thread
    claim: 'By John 9:4 “sent” has occurred ten times since John 7 began; Jesus stresses His role as the one sent'
    key: gardner-tabernacles
    url: 'https://rsc.byu.edu/learn-me/jesus-christ-feast-tabernacles'
    quote: 'When Jesus says, “I must work the works of him that sent me” (John 9:4; emphasis added), it is the tenth time we have read the word sent since the beginning of John 7.'
  - where: thread
    claim: 'John does not answer the objections with facts; what separated those who followed from those who left was belief'
    key: matson-fourth-gospel
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/fourth-gospel-expectations-jewish-messiah'
    quote: 'It appears that the separating factor between those in Jerusalem who listened to and followed Jesus and those who left was belief.'
  - where: section 3 plain
    claim: '“Letters” means learning (plain words: “such learning”)'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/7.htm'
    quote: '(See Acts 26:24, “much learning,” where “learning” represents the word here rendered “letters.”)'
  - where: section 3 plain
    claim: '“Will do” means “is willing to do” (plain words)'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/7.htm'
    quote: 'Better, If any man willeth to do His will, he shall know of the teaching.'
  - where: section 4 plain
    claim: 'The “Gentiles” of verse 35 are in the Greek “Greeks”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/7?lang=eng'
    quote: 'GR Greeks'
  - where: section 5 plain
    claim: '“Belly” in 7:38 means the inmost self (plain words: “inmost being”)'
    key: thayer
    url: 'https://biblehub.com/greek/2836.htm'
    quote: 'tropically, the innermost part of a man, the soul, heart, as the seat of thought, feeling, choice'
  # ---- notes
  - where: 'note 7:1 “Who sought to kill Him”'
    claim: '“The Jews” in John often means the Jewish leadership or a group of opponents'
    key: matson-fourth-gospel
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/fourth-gospel-expectations-jewish-messiah'
    quote: 'The expression “the Jews” (Greek hoi Ioudaioi) occurs frequently in John, often negatively. In these instances, it appears to refer to either the Jewish leadership or a specific group of opponents to Jesus.'
  - where: 'note 7:2 “The feast of tabernacles”'
    claim: 'Dates, eighth day, name “the Feast,” greatest and most joyful'
    key: bd-feasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/feasts?lang=eng'
    quote: 'called by later Jews the Feast (John 7:37) and reckoned by them to be the greatest and most joyful of all, was celebrated on the 15th to 21st days of the seventh month. To the seven days was added an eighth'
  - where: 'note 7:2 “The feast of tabernacles”'
    claim: 'It remembered the wilderness and the harvest; booths of boughs'
    key: bd-feasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/feasts?lang=eng'
    quote: 'The events celebrated were the sojourning of the children of Israel in the wilderness (Lev. 23:43) and the gathering-in of all the fruits of the year (Ex. 23:16). … The characteristic rite of the Feast of Tabernacles was the dwelling in booths made of the boughs of trees.'
  - where: 'note 7:2 “The feast of tabernacles”'
    claim: 'Water from Siloam and four golden lampstands; probably behind John 7:37 and 8:12'
    key: bd-feasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/feasts?lang=eng'
    quote: '(1) the drawing of water from Siloam and its libation on the altar … and (2) the illumination of the temple courts by four golden candelabra. It is probably to these ceremonies that our Lord refers in John 7:37 and 8:12.'
  - where: 'note 7:2 “The feast of tabernacles”'
    claim: 'In Jesus’ day the feast’s prayers hoped for deliverance from Rome'
    key: gardner-tabernacles
    url: 'https://rsc.byu.edu/learn-me/jesus-christ-feast-tabernacles'
    quote: 'However, in Jesus’s day, if celebrants pondered such freedom, their prayers would have been offered as a hope for future deliverance from Roman subjugation.'
  - where: 'note 7:2 “The feast of tabernacles”'
    claim: 'The water ceremony was each morning'
    key: gardner-tabernacles
    url: 'https://rsc.byu.edu/learn-me/jesus-christ-feast-tabernacles'
    quote: 'During the preparation of the [morning] burnt offering, a procession of priests, with the accompaniment of singing and flute playing, wended their way from the temple down to the Pool of Siloam'
  - where: 'note 7:5 “His brothers'' unbelief”'
    claim: 'His brethren were James, Joses, Simon and Judas, children of Joseph and Mary born after Jesus; there were sisters'
    key: bd-brethren-of-the-lord
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/brethren-of-the-lord?lang=eng'
    quote: 'A title given to James, Joses, Simon, and Judas (Matt. 13:55 … They were children of Joseph and Mary, born after Jesus’ birth. Matt. 13:56 shows that there were also sisters.'
  - where: 'note 7:5 “His brothers'' unbelief”'
    claim: 'James the Lord’s brother led in the Jerusalem church and probably wrote the Epistle of James'
    key: bd-james
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/james?lang=eng'
    quote: 'Brother of the Lord (Gal. 1:19) … He occupied an important position in the Church of Jerusalem (Acts 12:17; 15:13; 21:18; 1 Cor. 15:7; Gal. 2:9–12) and was probably the writer of the Epistle of James.'
  - where: 'note 7:5 “His brothers'' unbelief”'
    claim: 'His brethren were with the apostles and Mary in prayer'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/1?lang=eng'
    quote: 'These all continued with one accord in prayer and supplication, with the women, and Mary the mother of Jesus, and with his brethren.'
  - where: 'note 7:6 “My time is not yet come”'
    claim: 'His time is a divinely ordered season; the time to enter Jerusalem with pilgrims comes in a few months, at the Passover'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/7.htm'
    quote: 'Here, as there, He regards the events of life as marked out by divinely-ordered seasons. There is for Him a time for solemnly entering Jerusalem with a throng of pilgrims going up to a feast, and in a few months it will have come'
  - where: 'note 7:6 “My time is not yet come”'
    claim: 'At the Passover feast of the Lamb, not at the harvest feast'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/7.htm'
    quote: 'It is at the feast of the Paschal Lamb, already set apart, and not with the joyous shouts of harvest-tide.'
  - where: 'note 7:6 “My time is not yet come”'
    claim: 'Went up not with the usual company'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/7.htm'
    quote: 'Not openly, but as it were in secret—i.e., not with the usual company.'
  - where: 'note 7:6 “My time is not yet come”'
    claim: 'At 7:30 the reason John gives is the hour appointed by God'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/7.htm'
    quote: 'in the uncertainty of what the consequences may be, no one was bold enough to take the decisive step. … every deed of that life, as every deed of every life, had its hour mapped out in the eternal counsels of God.'
  - where: 'note 7:6 “My time is not yet come”'
    claim: 'The footnote to “hour” in 7:30 points to John 12:23'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/7?lang=eng'
    quote: 'John 12:23 (23–27)'
  - where: 'note 7:15 “Learning without the schools”'
    claim: 'They marveled that one not trained as a rabbi knew the literature of the schools'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/7.htm'
    quote: 'It is not the substance of His teaching that excites their attention, but the fact that He who has never been technically trained as a Rabbi is acquainted with the literature of the schools.'
  - where: 'note 7:15 “Learning without the schools”'
    claim: 'Scribes were trained, authorized teachers; Jesus lacked their credentials'
    key: richardson-unorthodox-teacher
    url: 'https://rsc.byu.edu/jesus-christ-son-god-savior/jesus-unorthodox-teacher'
    quote: '“For he taught them as one having authority from God, and not as having authority from the Scribes” … The scribes were trained professionals and regarded as authorized teachers. Even though Jesus was a quality teacher, He did not bear a teacher’s credentials of the time'
  - where: 'note 7:17 “Knowing by doing”'
    claim: 'Better rendered “willeth to do”'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/7.htm'
    quote: 'Better, If any man willeth to do His will, he shall know of the teaching.'
  - where: 'note 7:17 “Knowing by doing”'
    claim: '“Will do” means “willeth to do”; the will precedes the deed and is the condition of knowing'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/7.htm'
    quote: 'The stress is upon “willeth,” which in our version reads as if it were only the auxiliary verb. It is not deed, which is the outcome of faith; but will, which precedes it, that is here spoken of.'
  - where: 'note 7:17 “Knowing by doing”'
    claim: 'The hearers would take God’s will as that of the law and the prophets (7:19)'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/7.htm'
    quote: 'Those who heard them would naturally understand them, as it was intended they should, of the divine will expressed in the Law and the Prophets (John 7:19)'
  - where: 'note 7:17 “Knowing by doing”'
    claim: 'President Oaks: acquiring a testimony is not passive (John 7:17)'
    key: oaks-testimony-2008
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2008/04/testimony?lang=eng'
    quote: 'acquiring a testimony is not a passive thing but a process in which we are expected to do something. Jesus taught, “If any man will do his will, he shall know of the doctrine, whether it be of God, or whether I speak of myself” (John 7:17).'
  - where: 'note 7:17 “Knowing by doing”'
    claim: 'Obedience and knowledge reinforce each other'
    key: oaks-testimony-2008
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2008/04/testimony?lang=eng'
    quote: 'These two channels are mutually reinforcing: knowledge encourages obedience (see Deuteronomy 5:27; Moses 5:11), and obedience enhances knowledge (see John 7:17; D&C 93:1).'
  - where: 'note 7:23 “Circumcision on the Sabbath”'
    claim: 'The “one work” is probably the Bethesda healing'
    key: huntsman-sabbath-john
    url: 'https://rsc.byu.edu/sacred-time/bringing-forth-new-creation'
    quote: 'Then referring to one “work” (Greek, ergon), probably the healing of the man at the Pool of Bethesda, that had made them marvel (v. 21)'
  - where: 'note 7:23 “Circumcision on the Sabbath”'
    claim: 'Eighth-day circumcision, being time-bound, superseded the Sabbath; other circumcisions were forbidden on it'
    key: huntsman-sabbath-john
    url: 'https://rsc.byu.edu/sacred-time/bringing-forth-new-creation'
    quote: 'it was because circumcision on the eighth day was a time-bound commandment that it could supersede the weekly Sabbath; any circumcisions other than those performed on the eighth day of a boy’s life were still forbidden on Sabbath'
  - where: 'note 7:23 “Circumcision on the Sabbath”'
    claim: 'The argument is qal vahomer, light to heavy, common in the first century per slightly later sources'
    key: huntsman-sabbath-john
    url: 'https://rsc.byu.edu/sacred-time/bringing-forth-new-creation'
    quote: 'This was a type of qal vahomer, or “light to heavy,” argumentation that slightly later sources suggest was common in the first century'
  - where: 'note 7:23 “Circumcision on the Sabbath”'
    claim: 'Circumcising a part to bring into the covenant; healing the whole a symbol of the greater work of restoring'
    key: huntsman-sabbath-john
    url: 'https://rsc.byu.edu/sacred-time/bringing-forth-new-creation'
    quote: 'if Jews redeemed an infant boy by the “work” they performed circumcising a part of him to bring him into the covenant, even more so Jesus’s healing the whole body was a symbol of his greater work of redeeming and restoring fallen men and women.'
  - where: 'note 7:23 “Circumcision on the Sabbath”'
    claim: 'JST John 7:24 reads “your traditions”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/7?lang=eng'
    quote: 'JST John 7:24 … your traditions, but judge …'
  - where: 'note 7:27 “No man knoweth whence he is”'
    claim: 'The belief of 7:27 is in no preserved Jewish text but resonated with some, who sought to take Him'
    key: matson-fourth-gospel
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/fourth-gospel-expectations-jewish-messiah'
    quote: 'the belief that the Messiah would come from an unknown land (John 7:27), a claim that is not in any preserved Jewish texts from antiquity but must have resonated with some of those in the temple since they then sought to take him away (John 7:30).'
  - where: 'note 7:27 “No man knoweth whence he is”'
    claim: 'He cried out to reach all present; His answer teaches His premortality'
    key: matson-fourth-gospel
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/fourth-gospel-expectations-jewish-messiah'
    quote: 'a suggestion that Jesus is attempting through an elevated voice to garner the attention not only of those mocking him but all present. … Jesus’s statement teaches a doctrinal truth related to John’s preexistence Christology (a view emphasizing the premortality of Jesus)'
  - where: 'note 7:37 “Living water on the last day”'
    claim: 'The procession to Siloam, the golden flask, Isaiah 12:3'
    key: gardner-tabernacles
    url: 'https://rsc.byu.edu/learn-me/jesus-christ-feast-tabernacles'
    quote: 'a procession of priests, with the accompaniment of singing and flute playing, wended their way from the temple down to the Pool of Siloam, where a priest filled a golden flask with water while a choir repeated Isaiah 12:3'
  - where: 'note 7:37 “Living water on the last day”'
    claim: 'Water poured on the altar with the morning offering while the procession circled it'
    key: gardner-tabernacles
    url: 'https://rsc.byu.edu/learn-me/jesus-christ-feast-tabernacles'
    quote: 'The priest carrying the golden flask filled with water ascended the altar and prepared to pour the libation on the morning burnt offering. While doing this, the procession [carrying their lulabs and citrons] that had followed the priest circled the altar.'
  - where: 'note 7:37 “Living water on the last day”'
    claim: 'They returned through the Water Gate with a blast of the shofar'
    key: gardner-tabernacles
    url: 'https://rsc.byu.edu/learn-me/jesus-christ-feast-tabernacles'
    quote: 'The priests returned to the temple via the Water Gate … When they arrived at the Water Gate, a blast was made on a shofar, or ram’s horn.'
  - where: 'note 7:37 “Living water on the last day”'
    claim: 'Daily, and seven circuits on the seventh day'
    key: gardner-tabernacles
    url: 'https://rsc.byu.edu/learn-me/jesus-christ-feast-tabernacles'
    quote: 'It was performed every day of the feast in the same way, “except on the seventh day, when the priests (and perhaps the pilgrims) circled the altar seven times instead of just once.”'
  - where: 'note 7:37 “Living water on the last day”'
    claim: 'The saying about the joy of the water-drawing'
    key: bd-feasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/feasts?lang=eng'
    quote: 'of this it was said that he who has not seen the joy of the drawing of water at the Feast of Tabernacles does not know what joy is'
  - where: 'note 7:37 “Living water on the last day”'
    claim: 'Siloam was fed by Gihon, so its water was living water, from God, used for purification'
    key: gardner-tabernacles
    url: 'https://rsc.byu.edu/learn-me/jesus-christ-feast-tabernacles'
    quote: 'The Pool of Siloam received its water from the Gihon Spring, a natural water source, making the water in Siloam “living water,” or water suitable for ritual purification. … Living water had to come directly from God'
  - where: 'note 7:37 “Living water on the last day”'
    claim: 'No water ceremony on the great day; His words invited them to Him as the true source'
    key: gardner-tabernacles
    url: 'https://rsc.byu.edu/learn-me/jesus-christ-feast-tabernacles'
    quote: 'The Savior waited until the “great day of the feast,” on which there was no water-pouring ceremony, to publicly declare that he was the source of “living water.” In the absence of the celebration involving the waters of Siloam, his words invited the people to come unto him'
  - where: 'note 7:37 “Living water on the last day”'
    claim: 'Teachers sat; Jesus stood and spoke loudly'
    key: gardner-tabernacles
    url: 'https://rsc.byu.edu/learn-me/jesus-christ-feast-tabernacles'
    quote: 'The typical position of teachers was to sit while they taught. Jesus emphasized his declaration by standing and speaking in a loud voice.'
  - where: 'note 7:37 “Living water on the last day”'
    claim: 'Calling Himself the source of living water, the fountain of living waters, He proclaimed His divinity'
    key: gardner-tabernacles
    url: 'https://rsc.byu.edu/learn-me/jesus-christ-feast-tabernacles'
    quote: 'By referring to himself as the source of “living water,” Jesus proclaimed his divinity—he is the “fountain of living waters.”'
  - where: 'note 7:37 “Living water on the last day”'
    claim: 'The scripture is not easily identified; Jeremiah 2:13 and 17:13 call God the fountain of living waters'
    key: gardner-tabernacles
    url: 'https://rsc.byu.edu/learn-me/jesus-christ-feast-tabernacles'
    quote: '“The scripture” the Savior referred to is not easily identifiable. … Or he may have been referring to Isaiah 58:11 or Jeremiah 2:13 and Jeremiah 17:13, in which the God of Israel is directly referred to as the “fountain of living waters.”'
  - where: 'note 7:37 “Living water on the last day”'
    claim: 'The exact words are not in the Old Testament; the thought recurs (Ex. 17:6, Ezek. 47:1, Zech. 14:8)'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/7.htm'
    quote: 'The exact words “Out of his belly shall flow rivers of living water,” are not found in any part of the Canonical Scriptures of the Old Testament … The thought meets us again and again in the Old Testament. See the following passages: Exodus 17:6'
  - where: 'note 7:37 “Living water on the last day”'
    claim: '“Belly” here is, after the Hebrew, the inmost self'
    key: thayer
    url: 'https://biblehub.com/greek/2836.htm'
    quote: 'in imitation of the Hebrew בֶּטֶן, tropically, the innermost part of a man, the soul, heart, as the seat of thought, feeling, choice'
  - where: 'note 7:37 “Living water on the last day”'
    claim: 'Those who receive the living water share it with others by the Spirit'
    key: gardner-tabernacles
    url: 'https://rsc.byu.edu/learn-me/jesus-christ-feast-tabernacles'
    quote: 'Recipients of this living water would then be able to share their witness of Christ by the power of the Spirit with others, who could then receive the “living water” also.'
  - where: 'note 7:39 “The Holy Ghost not yet given”'
    claim: 'The statement refers to that dispensation and to the gift, not the power; the power was operative under John and Jesus; not fully explained'
    key: bd-holy-ghost
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/holy-ghost?lang=eng'
    quote: 'For some reason not fully explained in the scriptures, the Holy Ghost did not operate in the fulness among the Jews during the years of Jesus’ mortal sojourn (John 7:39; 16:7). Statements to the effect that the Holy Ghost did not come until after Jesus was resurrected must of necessity refer to that particular dispensation only'
  - where: 'note 7:39 “The Holy Ghost not yet given”'
    claim: 'Only the gift was absent; the power gave testimony (Matt. 16:16–17)'
    key: bd-holy-ghost
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/holy-ghost?lang=eng'
    quote: 'it has reference only to the gift of the Holy Ghost not being present, since the power of the Holy Ghost was operative during the ministries of John the Baptist and Jesus; otherwise no one would have received a testimony of the truths that these men taught (Matt. 16:16–17'
  - where: 'note 7:39 “The Holy Ghost not yet given”'
    claim: 'JST John 7:39'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/7?lang=eng'
    quote: 'JST John 7:39 … for the Holy Ghost was promised unto them who believe, after that Jesus was glorified.)'
  - where: 'note 7:39 “The Holy Ghost not yet given”'
    claim: 'In John, Jesus is glorified by His death and resurrection'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'John frequently describes the saving death and resurrection of Jesus as the means by which he is both glorified and glorifies the Father.'
  - where: 'note 7:42 “The Prophet, the Christ, and Bethlehem”'
    claim: 'Of the Messiah’s ancestors only David is named in John’s messianic expectations'
    key: matson-fourth-gospel
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/fourth-gospel-expectations-jewish-messiah'
    quote: 'However, among these, only David is mentioned in the messianic expectations of the Fourth Gospel (see John 7:42).'
  - where: 'note 7:42 “The Prophet, the Christ, and Bethlehem”'
    claim: 'John does not answer them with facts; those who proclaimed Him did so out of belief'
    key: matson-fourth-gospel
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/fourth-gospel-expectations-jewish-messiah'
    quote: 'the author of the Fourth Gospel does not combat these inquiries with facts, such as “Well, didn’t you know that Jesus was born in Bethlehem!” or “What further miracles would you like to see?” Instead, he records that those who proclaimed him as the Christ did so out of belief'
  - where: 'note 7:42 “The Prophet, the Christ, and Bethlehem”'
    claim: 'Jesus was born in Bethlehem but grew up in Galilee; Micah 5:2'
    key: sc-knowhy-869
    url: 'https://scripturecentral.org/knowhy/why-was-isaiah-9-important-for-defending-jesus-s-galilean-origin'
    quote: 'Of course, Jesus was born in Bethlehem while his parents were briefly there (see Matthew 2:1), but He spent most of his early life prior to His ministry in Nazareth and the Galilee region'
  - where: 'note 7:42 “The Prophet, the Christ, and Bethlehem”'
