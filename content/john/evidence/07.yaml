    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/22?lang=eng'
    quote: 'And now I, Nephi, declare unto you, that this prophet of whom Moses spake was the Holy One of Israel'
  - where: 'note 7:49 “This people who knoweth not the law”'
    claim: 'The officers were the temple guard and did not arrest Him'
    key: richardson-unorthodox-teacher
    url: 'https://rsc.byu.edu/jesus-christ-son-god-savior/jesus-unorthodox-teacher'
    quote: 'the group of officers, also known as the temple guard or police, listened to Jesus teaching in the temple but did not arrest Him.'
  - where: 'note 7:49 “This people who knoweth not the law”'
    claim: 'The rulers were the Sanhedrin, charged with preventing false doctrine; the Pharisees the orthodox party; many will believe during the feast'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/7.htm'
    quote: 'The rulers were the Sanhedrin, among whose official duties it was to prevent the introduction of false doctrines. … “The Pharisees” were the orthodox party of the day … during this very feast many of the chief Jews will believe on Him (John 8:30-31).'
  - where: 'note 7:49 “This people who knoweth not the law”'
    claim: 'Rabbinic scorn for the untaught multitude; 7:49 expresses it'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/7.htm'
    quote: 'The writings of the Rabbis are full of scorn and contempt for the untutored multitude, whom they called ‘am hāāretz, “people of the earth,” as opposed to those instructed in the Law … These words are an expression of this contempt.'
  - where: 'note 7:51 “Nicodemus speaks for a hearing”'
    claim: 'The better reading: unless it first hear from him'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/7.htm'
    quote: 'Before it hear him.—The better reading is, unless it hear first from him.'
  - where: 'note 7:51 “Nicodemus speaks for a hearing”'
    claim: 'Nicodemus was the lone voice in Jesus’ defense'
    key: sandstrom-nicodemus
    url: 'https://rsc.byu.edu/vol-9-no-3-2008/nicodemus-coward-convert'
    quote: 'A lone voice spoke in Jesus’s defense in that hotbed of hatred. That lone voice was Nicodemus’s'
  - where: 'note 7:51 “Nicodemus speaks for a hearing”'
    claim: 'As a council member he would have known the plot and the rebuke he would receive'
    key: sandstrom-nicodemus
    url: 'https://rsc.byu.edu/vol-9-no-3-2008/nicodemus-coward-convert'
    quote: 'Being a Pharisee himself and a member of that esteemed council, he probably would have been privy to their planning. … He had to know the vitriolic rebuke he would receive if he said anything in Jesus’s defense.'
  - where: 'note 7:51 “Nicodemus speaks for a hearing”'
    claim: 'He backed down after their answer; later made his discipleship public at the burial'
    key: wilson-nicodemus
    url: 'https://rsc.byu.edu/vol-1-no-1-2000/message-nicodemus'
    quote: 'Nicodemus questions the Sanhedrin in a bold move, but then he backs down even after they give a flimsy answer. (7:52)'
  - where: 'note 7:51 “Nicodemus speaks for a hearing”'
    claim: 'He made his discipleship public at the burial'
    key: wilson-nicodemus
    url: 'https://rsc.byu.edu/vol-1-no-1-2000/message-nicodemus'
    quote: 'Nicodemus makes his discipleship public as he assists Joseph of Arimathea with the burial. (19:39)'
  - where: 'note 7:52 “No prophet out of Galilee”'
    claim: 'Jonah was of Gath-hepher in Zebulun, Lower Galilee; the saying may have been a byword from Judean contempt'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/7.htm'
    quote: 'Jonah is described in 2Kings 14:25 as of Gathhepher, which was a town of Zebulun, in Lower Galilee. … it is not unlikely that, in the general contempt of Judæans for Galilee, this assertion had become a by-word'
  - where: 'note 7:52 “No prophet out of Galilee”'
    claim: '“Search, and look” means search the records'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/7.htm'
    quote: 'The words mean, “Search the records, examine, scrutinize the authorities.”'
  - where: 'note 7:52 “No prophet out of Galilee”'
    claim: 'Jonah was of Gath-hepher'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/14?lang=eng'
    quote: 'his servant Jonah, the son of Amittai, the prophet, which was of Gath-hepher.'
  - where: 'note 7:52 “No prophet out of Galilee”'
    claim: 'Matthew applies Isaiah 9 to Jesus in Capernaum'
    key: sc-knowhy-869
    url: 'https://scripturecentral.org/knowhy/why-was-isaiah-9-important-for-defending-jesus-s-galilean-origin'
    quote: 'Matthew applies this prophecy to Jesus and to His Galilean homeland: Matthew 4:13-14 states, “And leaving Nazareth, he came and dwelt in Capernaum'
  - where: 'note 7:52 “No prophet out of Galilee”'
    claim: 'John 8:12 answers 7:52 with the language of Isaiah 9; Jesus is the light promised to Galilee'
    key: sc-knowhy-869
    url: 'https://scripturecentral.org/knowhy/why-was-isaiah-9-important-for-defending-jesus-s-galilean-origin'
    quote: 'Here, Jesus uses phraseology from Isaiah 9 to indicate that there was indeed a prophecy of an important figure related to Galilee. In other words, Jesus himself is that child who would come and give light to the people of Galilee'
  - where: 'note 7:53 “The verse that begins the next story”'
    claim: 'Earliest manuscripts omit 7:53 and 8:1–11; some place it at 7:36, after 21:25 or after Luke 21:38'
    key: densley-adultery
    url: 'https://interpreterfoundation.org/journal/procedural-violations-in-the-trial-of-the-woman-taken-in-adultery'
    quote: 'The earliest manuscripts of the New Testament omit this verse and John 8:1–11. Some manuscripts place the story of the woman caught in adultery at John 7:36, after John 21:25, or after Luke 21:38.'
  - where: 'note 7:53 “The verse that begins the next story”'
    claim: 'The story appears to have strong support as coming from Jesus, though it may not first have stood here'
    key: densley-adultery
    url: 'https://interpreterfoundation.org/journal/procedural-violations-in-the-trial-of-the-woman-taken-in-adultery'
    quote: 'The story appears to have strong external support that it originated with Jesus, but it may not have originally been placed here in the Gospel of John'
