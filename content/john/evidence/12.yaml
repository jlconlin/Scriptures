chapter: 12
claims:
  - where: setting
    claim: 'Bethany was just over the Mount of Olives from Jerusalem'
    key: huntsman-preludes-last-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/preludes-jesuss-last-week'
    quote: 'Jesus proposes that he and his followers go to Bethany, which was just over the Mount of Olives from Jerusalem.'
  - where: setting
    claim: 'After a time out of sight, Jesus returns to Bethany shortly before Passover'
    key: huntsman-preludes-last-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/preludes-jesuss-last-week'
    quote: 'After spending some time out of sight with his disciples, shortly before Passover Jesus and his disciples return to Bethany, where he joins a special dinner hosted by Martha.'
  - where: setting
    claim: 'The Bethany episodes are a bridge between the Book of Signs and the Book of Glory'
    key: huntsman-preludes-last-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/preludes-jesuss-last-week'
    quote: 'occupy a pivotal position in the Gospel of John, overlapping with and serving as a bridge between “The Book of Signs,” which narrates the miraculous signs and the doctrinal discourses of Jesus’s ministry (John 2:1‒11:57), and “The Book of Glory,”'
  - where: setting
    claim: 'The second division is called the Book of Glory because John describes Jesus’s death and resurrection as the means of His glorifying and being glorified'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'The Gospel’s second major division is often called “The Book of Glory” because John frequently describes the saving death and resurrection of Jesus as the means by which he is both glorified and glorifies the Father.'
  - where: setting
    claim: 'Whether the anointing in Matthew and Mark is the same event is uncertain; there may have been two'
    key: huntsman-wednesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/wednesday'
    quote: 'John’s naming Mary of Bethany, having her anoint Jesus’s feet rather than his head, and placing the story before the triumphal entry makes it possible that there were, in fact, two different anointings.'
  - where: setting
    claim: 'After verse 36 Jesus retired from public teaching'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/12.htm'
    quote: 'The last words of the discourse (John 12:36) do, however, intimate that they were followed by a retirement from public teaching, and from public appearance in Jerusalem.'
  - where: setting
    claim: 'Verse 37 is John’s comment on the result of Jesus’s work at the close of His public teaching'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/12.htm'
    quote: 'This is the writer’s comment on the general result of Christ’s work at the close of His public teaching.'
  - where: setting
    claim: 'Verse 44’s “cried” implies public teaching, given at some time after verse 36'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/12.htm'
    quote: 'The phrase implies public teaching addressed to the multitude, and it may be inferred that there was some such teaching after John 12:36.'
  - where: thread
    claim: 'John describes Jesus’s death and resurrection as the means of His glory'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'John frequently describes the saving death and resurrection of Jesus as the means by which he is both glorified and glorifies the Father.'
  - where: thread
    claim: 'Jesus regards His death as the path that must be trodden before glory'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/12.htm'
    quote: 'The connection implies also that He regards His own death as the dark path which must be trodden before the path of glory can be entered.'
  - where: thread
    claim: '“Praise” in verse 43 is “glory”'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/12.htm'
    quote: 'For “praise” read in both instances glory. “The glory which comes from men more than the glory which came from God.”'
  - where: thread
    claim: 'The Greek of verse 43 has doxa twice'
    key: greek-nt
    url: 'https://biblehub.com/interlinear/john/12-43.htm'
    quote: '1391 [e] doxan δόξαν glory N-AFS'
  - where: section 1 plain
    claim: 'The “bag” is a money box or purse'
    key: thayer
    url: 'https://biblehub.com/greek/1101.htm'
    quote: 'a small box for other uses also; especially a casket, purse to keep money in: John 12:6; John 13:29'
  - where: section 2 plain
    claim: 'John’s word for Jesus’s miracles is sēmeia, signs'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'some Jews in Jerusalem begin to believe in Jesus “when they saw the miracles [Greek, sēmeia] which he did” (2:23).'
  - where: section 5 plain
    claim: '“Praise” rendered “glory”'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/12.htm'
    quote: 'For “praise” read in both instances glory.'
  - where: section 5 plain
    claim: '“Miracles” in verse 37 are signs'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'some Jews in Jerusalem begin to believe in Jesus “when they saw the miracles [Greek, sēmeia] which he did” (2:23).'
  - where: 'note 12:3 “A pound of spikenard”'
    claim: 'Spikenard is a Himalayan plant whose oil was costly, imported in sealed alabaster jars opened only on special occasions'
    key: ball-plants-nt
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/plants-new-testament'
    quote: 'A native of Nepal and other parts of the Himalayas … Because of its distant origin, it was a costly commodity in the New Testament lands, typically imported in sealed alabaster containers that were only broken open for special occasions.'
  - where: 'note 12:3 “A pound of spikenard”'
    claim: 'The pound was the litra of twelve ounces'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/12.htm'
    quote: 'This pound was the Greek litra, the Latin “libra,” the pound of twelve ounces.'
  - where: 'note 12:3 “A pound of spikenard”'
    claim: 'A penny was a laborer’s pay for a day'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/20?lang=eng'
    quote: 'when he had agreed with the labourers for a penny a day, he sent them into his vineyard'
  - where: 'note 12:3 “A pound of spikenard”'
    claim: 'Anointing head and feet with such abundance of spikenard was homage rarely given even to kings'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'To anoint the head of a guest with ordinary oil was to do him honor; to anoint his feet also was to show unusual and signal regard; but the anointing of head and feet with spikenard, and in such abundance, was an act of reverential homage rarely rendered even to kings.'
  - where: 'note 12:3 “A pound of spikenard”'
    claim: 'For a woman to uncover her hair in company was a scandal; the shock may have emboldened Judas'
    key: van-dyke-huntington-marys
    url: 'https://rsc.byu.edu/vol-5-no-3-2004/sorting-out-seven-marys-new-testament'
    quote: 'For a woman to uncover her hair in the company of anyone but her husband was an act of scandal in Mary’s day. The shock of her action likely resonated through the room and may have emboldened Judas Iscariot to rebuke Mary'
  - where: 'note 12:6 “He was a thief”'
    claim: 'The “bag” is a box or purse for money, used also in 13:29'
    key: thayer
    url: 'https://biblehub.com/greek/1101.htm'
    quote: 'a small box for other uses also; especially a casket, purse to keep money in: John 12:6; John 13:29'
  - where: 'note 12:7 “Against the day of my burying”'
    claim: 'The Joseph Smith Translation of 12:7'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/12?lang=eng'
    quote: 'JST John 12:7 … for she hath preserved this ointment until now, that she might anoint me in token of my burial.'
  - where: 'note 12:10 “Lazarus also”'
    claim: '“The Jews” at Bethany were people of the upper classes, friendly to the family and divided over Jesus'
    key: huntsman-preludes-last-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/preludes-jesuss-last-week'
    quote: 'we suggest that they represent the upper classes more broadly who were often, though not always, opposed to Jesus. … In this episode, members of this group are friendly to Lazarus’s family and divided in their response to Jesus'
  - where: 'note 12:10 “Lazarus also”'
    claim: 'Many believed, some told the Pharisees; the raising of Lazarus is the proximate cause of the final opposition'
    key: huntsman-preludes-last-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/preludes-jesuss-last-week'
    quote: 'On the one hand, many of them begin to believe in Jesus (see John 11:45; 12:9‒11). On the other, some of them go and tell the Pharisees … Thus, in John, the raising of Lazarus is the proximate cause of final opposition to Jesus'
  - where: 'note 12:10 “Lazarus also”'
    claim: 'The chief priests were mostly Sadducees; Lazarus’s life witnessed against them and their denial of the resurrection; they took counsel, not a final decision'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/12.htm'
    quote: 'The chief priests were for the most part Sadducees (Acts 5:17). … his life is a witness to the divinity of Him whom they have condemned to death, and a denial of their own doctrine that there is no resurrection (Acts 23:8). The words do not mean that they came to a final decision'
  - where: 'note 12:10 “Lazarus also”'
    claim: 'John notes the effect of the entry on Jesus’s opponents, galvanizing their opposition'
    key: huntsman-palm-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/palm-sunday'
    quote: 'It also notes the effect that Jesus’s reception had on his opponents, galvanizing their violent opposition to him (12:19).'
  - where: 'note 12:10 “Lazarus also”'
    claim: 'John’s word for Jesus’s miracles is sēmeia, signs'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'some Jews in Jerusalem begin to believe in Jesus “when they saw the miracles [Greek, sēmeia] which he did” (2:23).'
  - where: 'note 12:23 “The hour is come”'
    claim: 'John describes Jesus’s death and resurrection as the means of His glory; Moses 1:39 fits'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'John frequently describes the saving death and resurrection of Jesus as the means by which he is both glorified and glorifies the Father.[31] The title is apt, especially for Latter-day Saint readers, because in Restoration scripture the Lord directly declares'
  - where: 'note 12:23 “The hour is come”'
    claim: 'His death is the path that leads to glory'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/12.htm'
    quote: 'The connection implies also that He regards His own death as the dark path which must be trodden before the path of glory can be entered.'
  - where: 'note 12:24 “A corn of wheat”'
    claim: '“Corn” means grain, seed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/12?lang=eng'
    quote: '24a “corn”: GR grain, seed.'
  - where: 'note 12:25 “Hateth his life”'
    claim: 'In Luke 14:26 and John 12:25 miseō is the strong language of love and hate where English would speak of interest or disregard'
    key: thayer
    url: 'https://biblehub.com/greek/3404.htm'
    quote: '‘the Orientals, in accordance with their greater excitability, are accustomed both to feel and to profess love and hate where we Occidentals, with our cooler temperament, feel and express nothing more than interest in, or disregard and indifference to a thing’'
  - where: 'note 12:25 “Hateth his life”'
    claim: 'JST Luke 9:24'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-luke/9?lang=eng'
    quote: 'For whosoever will save his life, must be willing to lose it for my sake; and whosoever will be willing to lose his life for my sake, the same shall save it.'
  - where: 'note 12:27 “Now is my soul troubled”'
    claim: 'John omits the suffering in Gethsemane; the garden is only the scene of the arrest'
    key: huntsman-lamb-of-god
    url: 'https://rsc.byu.edu/behold-lamb-god/lamb-god-unique-aspects-passion-narrative-john'
    quote: 'John simply states that Jesus crossed the brook Cedron and came to a garden, not even mentioning the names Gethsemane or Mount of Olives (see John 18:1). … for John the garden is simply the scene of Jesus’s betrayal and arrest'
  - where: 'note 12:27 “Now is my soul troubled”'
    claim: 'John was one of the three near witnesses'
    key: huntsman-lamb-of-god
    url: 'https://rsc.byu.edu/behold-lamb-god/lamb-god-unique-aspects-passion-narrative-john'
    quote: 'John was the only one who was one of the three near witnesses'
  - where: 'note 12:27 “Now is my soul troubled”'
    claim: 'Whether “Father, save me from this hour” is a prayer or a question is uncertain'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/12.htm'
    quote: 'It is uncertain whether the first words of this sentence are a prayer, or whether they should be read as a question.'
  - where: 'note 12:31 “The prince of this world”'
    claim: 'JST John 14:30: the prince of darkness, Satan'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-john/14?lang=eng'
    quote: 'Hereafter I will not talk much with you; for the prince of darkness, who is of this world, cometh, but hath no power over me, but he hath power over you.'
  - where: 'note 12:32 “Lifted up from the earth”'
    claim: 'The lifted-up sayings: 3:14, 8:28 and 12:32–34'
    key: huntsman-lamb-of-god
    url: 'https://rsc.byu.edu/behold-lamb-god/lamb-god-unique-aspects-passion-narrative-john'
    quote: 'Other references to Jesus being lifted up include one in John 8:28 during the Light of the World discourse and two in John 12:32–34 as Jesus reflects on the coming hour shortly after His Triumphal Entry to Jerusalem.'
  - where: 'note 12:32 “Lifted up from the earth”'
    claim: '“Lifted up” includes the thought of the ascension'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/12.htm'
    quote: 'The words “lifted up” have occurred before in John 3:14; John 8:28; but the context here shows that they include the thought of the ascension into heaven.'
  - where: 'note 12:32 “Lifted up from the earth”'
    claim: 'Looking back, John sees in the cross the throne of glory'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/12.htm'
    quote: 'The words bear the double sense, and looking back upon the fact of the Crucifixion, he sees in that a lifting up which was part of the great moral victory over the world, and in the very cross of shame he sees the throne of glory.'
  - where: 'note 12:32 “Lifted up from the earth”'
    claim: '“All men” means all; the Greeks are first fruits'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/12.htm'
    quote: 'are to be taken in all the fulness of their width as meaning simply what they say—“all.” … These Greeks who are drawn to Him now are the first-fruits of the harvest'
  - where: 'note 12:32 “Lifted up from the earth”'
    claim: 'The risen Lord confirmed the saying to the Nephites (3 Ne. 27:14)'
    key: huntsman-lamb-of-god
    url: 'https://rsc.byu.edu/behold-lamb-god/lamb-god-unique-aspects-passion-narrative-john'
    quote: 'Then, after His resurrection, He confirmed to the Nephites, “my Father sent me that I might be lifted up upon the cross; and after that I had been lifted up upon the cross, that I might draw all men unto me'
  - where: 'note 12:32 “Lifted up from the earth”'
    claim: '3 Ne. 27:14: drawn to stand before Him and be judged'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/27?lang=eng'
    quote: 'that as I have been lifted up by men even so should men be lifted up by the Father, to stand before me, to be judged of their works, whether they be good or whether they be evil—'
  - where: 'note 12:41 “When he saw his glory”'
    claim: '2 Ne. 11:2: Isaiah saw the Redeemer'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/11?lang=eng'
    quote: 'for he verily saw my Redeemer, even as I have seen him.'
  - where: 'note 12:43 “The praise of men”'
    claim: 'The footnote to “confess” points to John 19:38'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/12?lang=eng'
    quote: '42c “confess”: Prov. 29:25; John 19:38.'
  - where: 'note 12:43 “The praise of men”'
    claim: 'The Greek has doxa twice in verse 43'
    key: greek-nt
    url: 'https://biblehub.com/interlinear/john/12-43.htm'
    quote: '1391 [e] doxan δόξαν glory N-AFS'
  - where: 'note 12:43 “The praise of men”'
    claim: 'The Greek has doxa in verse 41'
    key: greek-nt
    url: 'https://biblehub.com/interlinear/john/12-41.htm'
    quote: '1391 [e] doxan δόξαν glory N-AFS'
  - where: 'note 12:49 “What I should say”'
    claim: 'The footnote to verse 50 points to Deut. 18:18'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/12?lang=eng'
    quote: '50a “speak”: Deut. 18:18.'
  - where: 'note 12:49 “What I should say”'
    claim: '3 Ne. 20:23: the risen Lord is the prophet of whom Moses spoke'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/20?lang=eng'
    quote: 'Behold, I am he of whom Moses spake, saying: A prophet shall the Lord your God raise up unto you of your brethren, like unto me'
  - where: christ
    claim: 'One who yields his life in the service of God keeps it, like the buried grain'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'shall find the life he freely yields or is willing to yield, though for the time being it disappear like the grain buried in the soil; and he shall rejoice in the bounty of eternal development.'
  - where: christ
    claim: 'The praise of God persists; the praise of men is fleeting'
    key: tanner-praise-of-men
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1975/10/for-they-loved-the-praise-of-men-more-than-the-praise-of-god?lang=eng'
    quote: 'How much more satisfying it is when we receive the praise of God, knowing that it is fully justified and that his love and respect for us will persist, when usually the praise of men is fleeting and most disappointing.'
  - where: 'when'
    claim: 'The anointing came before Jesus entered Jerusalem for His last week'
    key: huntsman-reflections-last-week
    url: 'https://www.churchofjesuschrist.org/study/ensign/2009/04/reflections-on-the-saviors-last-week?lang=eng'
    quote: 'before the Master entered Jerusalem for His final week'
  - where: 'section 1 plain'
    claim: '“Bare” in verse 6 means pilfered, took away'
    key: thayer
    url: 'https://biblehub.com/greek/941.htm'
    quote: 'to bear away, carry off … John 12:6 (ἐβασταζε used to pilfer (R. V. text took away'
  - where: 'section 3 plain'
    claim: '“Corn” is grain, seed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/12?lang=eng'
    quote: '24a “corn”: GR grain, seed.'
  - where: 'section 4 plain'
    claim: '“What death” asks of what sort: what manner of death'
    key: thayer
    url: 'https://biblehub.com/greek/4169.htm'
    quote: 'of what sort or nature'
  - where: 'note 12:6 “He was a thief”'
    claim: 'The footnote glosses the bag as a money bag and points to 13:29'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/12?lang=eng'
    quote: '6b “bag”: GR purse, money bag. John 13:29.'
  - where: 'note 12:6 “He was a thief”'
    claim: 'The verb means to carry off; in 12:6 to pilfer; used of carrying off in 20:15'
    key: thayer
    url: 'https://biblehub.com/greek/941.htm'
    quote: 'to bear away, carry off … John 12:6 (ἐβασταζε used to pilfer (R. V. text took away'
  - where: 'note 12:7 “Against the day of my burying”'
    claim: 'Bodies were anointed for burial; Messiah and Christ mean the anointed one; living kings and high priests were anointed'
    key: huntsman-reflections-last-week
    url: 'https://www.churchofjesuschrist.org/study/ensign/2009/04/reflections-on-the-saviors-last-week?lang=eng'
    quote: 'In ancient Israel it was common to anoint bodies as part of burial rituals. The Hebrew word Messiah and the Greek word Christ both mean “the anointed one,” … the Israelites also anointed living people to serve either as rightful kings or as high priests.'
  - where: 'note 12:7 “Against the day of my burying”'
    claim: 'Matthew and Mark preserve a similar incident, placed later in the week'
    key: huntsman-reflections-last-week
    url: 'https://www.churchofjesuschrist.org/study/ensign/2009/04/reflections-on-the-saviors-last-week?lang=eng'
    quote: 'Matthew 26:6–13 and Mark 14:3–9 preserve a similar incident, which they place later in the week'
  - where: 'note 12:7 “Against the day of my burying”'
    claim: 'Elder McConkie: Mary acted as guided by the Spirit, so that Israel might acclaim Him King the next day'
    key: seely-messiah
    url: 'https://rsc.byu.edu/approaching-holiness/jesus-messiah-prophet-priest-king'
    quote: 'So Mary of Bethany, in the home of Simon the leper, as guided by the Spirit, … so that, the next day, the ten thousands of Israel might acclaim him King and shout Hosanna to his name.'
  - where: 'note 12:13 “Hosanna to the King of Israel”'
    claim: 'Hosanna means “save now,” from Ps. 118:25, a Hallel psalm chanted with palm branches at Tabernacles; hence the crowd’s use'
    key: bd-hosanna
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hosanna?lang=eng'
    quote: 'Save now. The word is taken from Ps. 118:25, one of the Psalms of the Hallel. The chanting of this psalm was connected at the Feast of Tabernacles with the waving of palm branches'
  - where: 'note 12:13 “Hosanna to the King of Israel”'
    claim: 'The Hallel psalms were recited at the great feasts'
    key: bd-hallel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hallel?lang=eng'
    quote: 'A name given to the group of Psalms (113–18) recited by Jews at the great feasts'
  - where: 'note 12:13 “Hosanna to the King of Israel”'
    claim: 'Kings rode donkeys; Zechariah foretold it; branches belonged to Tabernacles, associated with the crowning of kings'
    key: huntsman-reflections-last-week
    url: 'https://www.churchofjesuschrist.org/study/ensign/2009/04/reflections-on-the-saviors-last-week?lang=eng'
    quote: 'Old Testament kings, especially David, commonly rode donkeys. … The waving of tree branches is often associated with Sukkot, … but was also associated with the coronation of Israelite kings.'
  - where: 'note 12:13 “Hosanna to the King of Israel”'
    claim: 'All the crowd’s words come from the Old Testament; the titles were reserved for messianic hopes of a restored kingdom'
    key: jackson-ot-easter
    url: 'https://rsc.byu.edu/ascending-mountain-lord/old-testament-easter'
    quote: 'All of the words and phrases spoken by the multitude in response to Jesus’ presence come from the Old Testament. … Titles like these were not chosen lightly by Jews in Jesus’ time but were reserved to identify messianic hopes.'
  - where: 'note 12:13 “Hosanna to the King of Israel”'
    claim: 'Zechariah’s prophecy is set in the time of peace to come'
    key: jackson-ot-easter
    url: 'https://rsc.byu.edu/ascending-mountain-lord/old-testament-easter'
    quote: 'The setting in Zechariah’s prophecy is clearly millennial. With images familiar from other Old Testament prophecies, it points to a day in which the Lord will establish peace throughout the earth.'
  - where: 'note 12:13 “Hosanna to the King of Israel”'
    claim: 'The entry proclaimed who Jesus was; a donkey, not a war horse, as Prince of Peace; His ministry a sign of His reign'
    key: jackson-ot-easter
    url: 'https://rsc.byu.edu/ascending-mountain-lord/old-testament-easter'
    quote: 'The purpose of the Triumphal Entry was to proclaim who Jesus was … He rode a donkey rather than a horse (as we might expect) because in biblical times, a horse was primarily military equipment, and he was coming as the Prince of Peace.'
  - where: 'note 12:16 “Understood not at the first”'
    claim: 'The footnote to “understood” points to Luke 9:45 and 18:34'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/12?lang=eng'
    quote: '16a “understood”: Luke 9:45; 18:34 (31–34).'
  - where: 'note 12:16 “Understood not at the first”'
    claim: 'The apostles understood fully after the ascension, when they had received the Holy Ghost'
    key: jackson-ot-easter
    url: 'https://rsc.byu.edu/ascending-mountain-lord/old-testament-easter'
    quote: 'John tells us that it was only after Jesus’ ascension—after the Apostles had received the Holy Ghost—that they understood fully what had happened (see John 12:16).'
  - where: 'note 12:20 “Certain Greeks”'
    claim: 'Proselytes were circumcised and expected to keep the whole law'
    key: bd-proselytes
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/proselytes?lang=eng'
    quote: 'Men of gentile birth who had been incorporated into the Jewish church. The ceremony of admission included circumcision, baptism, and a sacrifice. They were expected to observe the whole Mosaic law.'
  - where: 'note 12:20 “Certain Greeks”'
    claim: 'God-fearing or devout Gentiles attended the synagogues and kept part of the law'
    key: bd-proselytes
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/proselytes?lang=eng'
    quote: 'there were attached to most Jewish synagogues a number of “God-fearing” or “devout” Gentiles, who attended the services but only observed part of the ceremonial law'
  - where: 'note 12:20 “Certain Greeks”'
    claim: 'The footnotes point to Acts 17:4 and Acts 8:27'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/12?lang=eng'
    quote: '20a “Greeks”: Acts 17:4 (1–9).'
  - where: 'note 12:20 “Certain Greeks”'
    claim: 'The footnote to “worship” points to Acts 8:27'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/12?lang=eng'
    quote: '20b “worship”: Acts 8:27.'
  - where: 'note 12:24 “A corn of wheat”'
    claim: 'The footnote to “die” points to 1 Cor. 15:36'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/12?lang=eng'
    quote: '24b “die”: 1 Cor. 15:36 (35–38).'
  - where: 'note 12:24 “A corn of wheat”'
    claim: 'In John Jesus’s glory comes through His death and resurrection'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'John frequently describes the saving death and resurrection of Jesus as the means by which he is both glorified and glorifies the Father.'
  - where: 'note 12:25 “Hateth his life”'
    claim: 'The footnote to “life” points to JST Luke 9:24–25'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/12?lang=eng'
    quote: '25a “life”: See JST Luke 9:24–25 (Appendix).'
  - where: 'note 12:31 “The prince of this world”'
    claim: 'The footnote to “prince” points to the devil'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/12?lang=eng'
    quote: '31a “prince”: TG Devil.'
  - where: 'note 12:31 “The prince of this world”'
    claim: 'The prince of this world: the ruler of the irreligious mass of mankind, in John 12:31, 14:30, 16:11'
    key: thayer
    url: 'https://biblehub.com/greek/758.htm'
    quote: 'ὁ ἄρχων τοῦ κόσμου, the ruler of the irreligious mass of mankind, John 12:31; John 14:30; John 16:11'
  - where: 'note 12:34 “Christ abideth for ever”'
    claim: '“The law” in 12:34 is the whole Old Testament'
    key: thayer
    url: 'https://biblehub.com/greek/3551.htm'
    quote: 'is put for the entire collection of the sacred books of the O. T.'
  - where: 'note 12:34 “Christ abideth for ever”'
    claim: 'The footnote to “Christ” points to 2 Sam. 7:16'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/12?lang=eng'
    quote: '34a “Christ”: 2 Sam. 7:16.'
  - where: 'note 12:34 “Christ abideth for ever”'
    claim: 'From Ps. 89:36 some concluded the Messiah would live forever'
    key: matson-fourth-gospel
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/fourth-gospel-expectations-jewish-messiah'
    quote: 'Some groups concluded that the Messiah, the seed of David, is the one whowould live forever.'
  - where: 'note 12:34 “Christ abideth for ever”'
    claim: 'In 12:34 the people return to prophecies that the Messiah would endure forever'
    key: matson-fourth-gospel
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/fourth-gospel-expectations-jewish-messiah'
    quote: 'the people (including the Jewish leaders) return to their questions regarding prophecies that the Messiah would endure forever (Psalm 89: 36–37).'
  - where: 'note 12:34 “Christ abideth for ever”'
    claim: 'Before Jesus a suffering, dying Messiah was virtually absent; a victorious Messiah was expected'
    key: hatch-messianism
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/messianism-jewish-messiahs-new-testament-period'
    quote: 'overshadowed by the many other expectations of a victorious messiah … Thus, in pre-Christian Jewish texts of the Second Temple period the notion that the messiah was to suffer and die was virtually nonexistent.'
  - where: 'note 12:40 “Therefore they could not believe”'
    claim: 'The footnote to “believed not” points to Mosiah 3:9'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/12?lang=eng'
    quote: '37b “believed not”: Mosiah 3:9 (9–11).'
  - where: 'note 12:40 “Therefore they could not believe”'
    claim: 'The footnote to Isa. 6:9 points to Matt. 13:14–15 and Acts 28:26–27'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/6?lang=eng'
    quote: '9a “Hear”: Matt. 13:14–15; Acts 28:26–27.'
  - where: 'note 12:41 “When he saw his glory”'
    claim: 'The footnote to “saw” files the verse under the antemortal appearances of Jesus Christ'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/12?lang=eng'
    quote: '41a “saw”: TG Jesus Christ, Appearances, Antemortal.'
  - where: 'note 12:41 “When he saw his glory”'
    claim: 'Jehovah, printed LORD in the KJV, is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'the name is generally denoted by Lord or God, printed in small capitals. … Jehovah is the premortal Jesus Christ'
  - where: 'note 12:43 “The praise of men”'
    claim: '“Rulers” in 12:42 (as in 3:1 and 7:48) are members of the Sanhedrin'
    key: thayer
    url: 'https://biblehub.com/greek/758.htm'
    quote: 'Of the members of the Jewish Sanhedrin: Luke 23:13, 35; Luke 24:20; John 3:1; John 7:26, 48; John 12:42'
  - where: 'note 12:43 “The praise of men”'
    claim: 'The rulers’ silence matches the blind man’s parents; John shows the cost of believing'
    key: matson-fourth-gospel
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/fourth-gospel-expectations-jewish-messiah'
    quote: 'This response is nearly identical to that of the parents of the lifelong blind man in John 9. … It appears that the Fourth Gospel is emphasizing the cost that one must be willing to pay for truly believing in the Messiah.'
  - where: 'note 12:43 “The praise of men”'
    claim: 'The footnote to “praise” points to D&C 3:7'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/12?lang=eng'
    quote: '43a “praise”: Mark 12:38 (38–40); 1 Cor. 1:26 (26–31); 1 Ne. 8:28 (26–28); Alma 11:24; D&C 3:7 (5–8).'
  - where: 'note 12:49 “What I should say”'
    claim: '“Cried” is John’s word for public, solemn teaching aloud, as in 7:28 and 7:37'
    key: thayer
    url: 'https://biblehub.com/greek/2896.htm'
    quote: 'of those who utter or teach a thing publicly and solemnly, Romans 9:27; κέκραγε and ἔκραξε λέγων, followed by direct discourse, John 1:15; John 7:37; ἔκραξε διδάσκων καί λέγων, John 7:28; ἔκραξεν καί εἶπεν, John 12:44'
  - where: 'explore'
    claim: 'Jackson reads the crowd’s words and Zechariah as proclaiming who Jesus was'
    key: jackson-ot-easter
    url: 'https://rsc.byu.edu/ascending-mountain-lord/old-testament-easter'
    quote: 'The purpose of the Triumphal Entry was to proclaim who Jesus was, to identify the man Jesus of Nazareth with the holy Messiah who would come at the end of time.'
  - where: 'note 12:7 “Against the day of my burying”'
    claim: 'Elder McConkie told the anointing as one event, Mary anointing head and feet in Simon’s house'
    key: seely-messiah
    url: 'https://rsc.byu.edu/approaching-holiness/jesus-messiah-prophet-priest-king'
    quote: 'So Mary of Bethany, in the home of Simon the leper, as guided by the Spirit, poured costly spikenard from her alabaster box upon the head of Jesus, and also anointed his feet'
  - where: 'note 12:7 “Against the day of my burying”'
    claim: 'The differences leave room for two anointings'
    key: huntsman-wednesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/wednesday'
    quote: 'John’s naming Mary of Bethany, having her anoint Jesus’s feet rather than his head, and placing the story before the triumphal entry makes it possible that there were, in fact, two different anointings.'
  - where: 'note 12:20 “Certain Greeks”'
    claim: 'John’s word is hellēnes, so they were most likely God-fearers who honored the God of Israel without becoming proselytes'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'John uses the term hellēnes, making it most likely that these were in fact Greek God-fearers who worshipped or honored the God of Israel without actually becoming proselytes.'
  - where: 'note 12:20 “Certain Greeks”'
    claim: 'Philip and Andrew were Galileans with Greek names from Hellenized Bethsaida and presumably spoke Greek'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'Both Philip and Andrew were Galileans with Greek names who came from the Hellenized city of Bethsaida and presumably spoke some Greek'
  - where: 'note 12:23 “The hour is come”'
    claim: 'The Greeks’ coming fulfills the Pharisees’ complaint and shows He came to save all, Jew and Gentile'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'their bringing the Greek visitors to Jesus fulfilled the worried claim of leading Pharisees at the triumphal entry, “Look, the world has gone after him!” … this encounter with the visiting Greeks represents that Jesus came to save all, both Jew and Gentile.'
  - where: 'note 12:24 “A corn of wheat”'
    claim: 'The dying seed is Jesus Himself, as verse 32 makes clear'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'Jesus then makes clear that the dying seed that brings forth new life is in fact him, saying, “And when I am lifted up from the earth, I will draw all to myself”'
  - where: 'note 12:25 “Hateth his life”'
    claim: 'The life freely yielded is kept, like the grain buried in the soil'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'shall find the life he freely yields or is willing to yield, though for the time being it disappear like the grain buried in the soil'
  - where: 'note 12:27 “Now is my soul troubled”'
    claim: 'The troubled soul anticipates the agony of Gethsemane; He at once expresses willingness'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'he expresses apprehension over his coming suffering in words that anticipate the beginning of the agony that he will experience in Gethsemane'
  - where: 'note 12:27 “Now is my soul troubled”'
    claim: 'The prediction was given in the temple after the entry'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'Jesus makes one of his clearest predictions of his coming suffering and death while in the temple at some point after his triumphal entry.'
  - where: 'note 12:31 “The prince of this world”'
    claim: 'His suffering, death and resurrection will overthrow the power of Satan'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'Proclaiming that his suffering, death, and resurrection will overthrow the power of Satan'
  - where: 'note 12:32 “Lifted up from the earth”'
    claim: 'Lifted up on the cross, He draws all, Jew and Greek'
    key: huntsman-monday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/monday'
    quote: 'Lifted up upon the cross, he thus draws all, both Jew and Greek, to himself.'
