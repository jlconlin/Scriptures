chapter: 12
claims:
  # ---- when, setting, thread
  - where: when
    claim: 'The entry marks the first day of the week of the Lord’s passion'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'The record of the first day of what has come to be known as the week of our Lord’s passion is thus concluded by Mark'
  - where: setting
    claim: 'Bethany was just over the Mount of Olives from Jerusalem'
    key: huntsman-preludes-last-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/preludes-jesuss-last-week'
    quote: 'Jesus proposes that he and his followers go to Bethany, which was just over the Mount of Olives from Jerusalem.'
  - where: setting
    claim: 'After a time out of sight, Jesus returns to Bethany shortly before Passover'
    key: huntsman-preludes-last-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/preludes-jesuss-last-week'
    quote: 'After spending some time out of sight with his disciples, shortly before Passover Jesus and his disciples return to Bethany, where he joins a special dinner hosted by Martha.'
  - where: setting
    claim: 'The Bethany episodes are a bridge between the Book of Signs and the Book of Glory'
    key: huntsman-preludes-last-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/preludes-jesuss-last-week'
    quote: 'occupy a pivotal position in the Gospel of John, overlapping with and serving as a bridge between “The Book of Signs,” which narrates the miraculous signs and the doctrinal discourses of Jesus’s ministry (John 2:1‒11:57), and “The Book of Glory,”'
  - where: setting
    claim: 'The second division is called the Book of Glory because John describes Jesus’s death and resurrection as the means of His glorifying and being glorified'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'The Gospel’s second major division is often called “The Book of Glory” because John frequently describes the saving death and resurrection of Jesus as the means by which he is both glorified and glorifies the Father.'
  - where: setting
    claim: 'Whether the anointing in Matthew and Mark is the same event is uncertain; there may have been two'
    key: huntsman-wednesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/wednesday'
    quote: 'John’s naming Mary of Bethany, having her anoint Jesus’s feet rather than his head, and placing the story before the triumphal entry makes it possible that there were, in fact, two different anointings.'
  - where: setting
    claim: 'After verse 36 Jesus retired from public teaching'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/12.htm'
    quote: 'The last words of the discourse (John 12:36) do, however, intimate that they were followed by a retirement from public teaching, and from public appearance in Jerusalem.'
  - where: setting
    claim: 'Verse 37 is John’s comment on the result of Jesus’s work at the close of His public teaching'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/12.htm'
    quote: 'This is the writer’s comment on the general result of Christ’s work at the close of His public teaching.'
  - where: setting
    claim: 'Verses 44–50 are public teaching, given at some time after verse 36'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/12.htm'
    quote: 'The phrase implies public teaching addressed to the multitude, and it may be inferred that there was some such teaching after John 12:36.'
  - where: thread
    claim: 'John describes Jesus’s death and resurrection as the means of His glory'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'John frequently describes the saving death and resurrection of Jesus as the means by which he is both glorified and glorifies the Father.'
  - where: thread
    claim: 'Jesus regards His death as the path that must be trodden before glory'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/12.htm'
    quote: 'The connection implies also that He regards His own death as the dark path which must be trodden before the path of glory can be entered.'
  - where: thread
    claim: '“Praise” in verse 43 is “glory”'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/12.htm'
    quote: 'For “praise” read in both instances glory. “The glory which comes from men more than the glory which came from God.”'
  - where: thread
    claim: 'The Greek of verse 43 has doxa twice'
    key: greek-nt
    url: 'https://biblehub.com/interlinear/john/12-43.htm'
    quote: '1391 [e] doxan δόξαν glory N-AFS'
  # ---- sections
  - where: section 1 plain
    claim: 'The “bag” is a money box or purse'
    key: thayer
    url: 'https://biblehub.com/greek/1101.htm'
    quote: 'a small box for other uses also; especially a casket, purse to keep money in: John 12:6; John 13:29'
  - where: section 1 plain
    claim: '“Bare what was put therein” may mean he took it away'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/12.htm'
    quote: 'this clause would then mean “and purloined what was put therein.”'
  - where: section 2 plain
    claim: 'John’s word for Jesus’s miracles is sēmeia, signs'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'some Jews in Jerusalem begin to believe in Jesus “when they saw the miracles [Greek, sēmeia] which he did” (2:23).'
  - where: section 3 plain
    claim: '“Corn of wheat” is a grain of wheat'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/12.htm'
    quote: 'All knew that a grain of wheat, though containing in itself the germs of life, would remain alone, and not really live unless it fell to the earth.'
  - where: section 4 plain
    claim: '“What death” is better “what manner of death”'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/12.htm'
    quote: '(33) By what death he should die.—Better, by what manner of death'
  - where: section 5 plain
    claim: '“Praise” rendered “glory”'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/12.htm'
    quote: 'For “praise” read in both instances glory.'
  - where: section 5 plain
    claim: '“Miracles” in verse 37 are signs'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'some Jews in Jerusalem begin to believe in Jesus “when they saw the miracles [Greek, sēmeia] which he did” (2:23).'
  # ---- note 12:3
  - where: 'note 12:3 “A pound of spikenard”'
    claim: 'Spikenard is a Himalayan plant whose oil was costly, imported in sealed alabaster jars opened only on special occasions'
    key: ball-plants-nt
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/plants-new-testament'
    quote: 'A native of Nepal and other parts of the Himalayas … Because of its distant origin, it was a costly commodity in the New Testament lands, typically imported in sealed alabaster containers that were only broken open for special occasions.'
  - where: 'note 12:3 “A pound of spikenard”'
    claim: 'The pound was the litra of twelve ounces'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/12.htm'
    quote: 'This pound was the Greek litra, the Latin “libra,” the pound of twelve ounces.'
  - where: 'note 12:3 “A pound of spikenard”'
    claim: 'A penny was a laborer’s pay for a day'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/20?lang=eng'
    quote: 'when he had agreed with the labourers for a penny a day, he sent them into his vineyard'
  - where: 'note 12:3 “A pound of spikenard”'
    claim: 'Anointing head and feet with such abundance of spikenard was homage rarely given even to kings'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'To anoint the head of a guest with ordinary oil was to do him honor; to anoint his feet also was to show unusual and signal regard; but the anointing of head and feet with spikenard, and in such abundance, was an act of reverential homage rarely rendered even to kings.'
  - where: 'note 12:3 “A pound of spikenard”'
    claim: 'For a woman to uncover her hair in company was a scandal; the shock may have emboldened Judas'
    key: van-dyke-huntington-marys
    url: 'https://rsc.byu.edu/vol-5-no-3-2004/sorting-out-seven-marys-new-testament'
    quote: 'For a woman to uncover her hair in the company of anyone but her husband was an act of scandal in Mary’s day. The shock of her action likely resonated through the room and may have emboldened Judas Iscariot to rebuke Mary'
  # ---- note 12:6
  - where: 'note 12:6 “He was a thief”'
    claim: 'Judas was treasurer of the common fund, which supplied their wants and gifts to the poor'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/12.htm'
    quote: 'We have to think of Judas as treasurer of the common fund which supplied the wants of the little band, and from which gifts to the poor were made.'
  - where: 'note 12:6 “He was a thief”'
    claim: 'The “bag” is a box or purse for money, used also in 13:29'
    key: thayer
    url: 'https://biblehub.com/greek/1101.htm'
    quote: 'a small box for other uses also; especially a casket, purse to keep money in: John 12:6; John 13:29'
  - where: 'note 12:6 “He was a thief”'
    claim: '“Bare” can mean “bare away,” as John uses it in 20:15: he purloined it'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/12.htm'
    quote: 'But we may certainly render the word “bare away,” for St. John himself uses it in this sense in John 20:15; and this clause would then mean “and purloined what was put therein.”'
  # ---- note 12:7
  - where: 'note 12:7 “Against the day of my burying”'
    claim: 'The Joseph Smith Translation of 12:7'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/12?lang=eng'
    quote: 'JST John 12:7 … for she hath preserved this ointment until now, that she might anoint me in token of my burial.'
  - where: 'note 12:7 “Against the day of my burying”'
    claim: 'The anointing recalls the embalming of the dead; the preparations for the grave have begun'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/12.htm'
    quote: 'This reminds Him of the embalmment of the dead, which had been but lately in that very place … Before the week ends His body will be carried to the sepulchre. The preparations for the grave have already been begun.'
  - where: 'note 12:7 “Against the day of my burying”'
    claim: 'Jesus declares Mary’s act prophetic, anticipating His death and burial'
    key: huntsman-preludes-last-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/preludes-jesuss-last-week'
    quote: 'Jesus, however, insists that Mary’s actions are prophetic: this act of anointing in fact is anticipating his coming death and burial (12:7).'
  - where: 'note 12:7 “Against the day of my burying”'
    claim: 'Whether Mary knew His death was near is uncertain; she may have been told, gathered it, or been inspired'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'We are left without certain information as to whether Mary knew that within a few days her beloved Lord would be in the tomb. She may have been so informed … or perhaps by inspired intuition she was impelled'
  - where: 'note 12:7 “Against the day of my burying”'
    claim: 'Kings and priests were anointed; thus anointed, Jesus enters Jerusalem as its true king; many scholars take the anointings as one event'
    key: huntsman-preludes-last-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/preludes-jesuss-last-week'
    quote: 'leading many scholars to believe they are based upon the same event. … Because rightful kings and priests were anointed in ancient Israel … Thus anointed, Jesus is prepared to enter Jerusalem as its true king.'
  - where: 'note 12:7 “Against the day of my burying”'
    claim: 'Messiah means “the anointed”; Christ is its Greek equivalent'
    key: bd-messiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/messiah?lang=eng'
    quote: 'An Aramaic word meaning “the anointed.” … In the New Testament the deliverer is called the Christ, which is the Greek equivalent of Messiah'
  - where: 'note 12:7 “Against the day of my burying”'
    claim: 'John’s differences make two anointings possible'
    key: huntsman-wednesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/wednesday'
    quote: 'John’s naming Mary of Bethany, having her anoint Jesus’s feet rather than his head, and placing the story before the triumphal entry makes it possible that there were, in fact, two different anointings.'
  # ---- note 12:10
  - where: 'note 12:10 “Lazarus also”'
    claim: '“The Jews” at Bethany were people of the upper classes, friendly to the family and divided over Jesus'
    key: huntsman-preludes-last-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/preludes-jesuss-last-week'
    quote: 'we suggest that they represent the upper classes more broadly who were often, though not always, opposed to Jesus. … In this episode, members of this group are friendly to Lazarus’s family and divided in their response to Jesus'
  - where: 'note 12:10 “Lazarus also”'
    claim: 'Many believed, some told the Pharisees; the raising of Lazarus is the proximate cause of the final opposition'
    key: huntsman-preludes-last-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/preludes-jesuss-last-week'
    quote: 'On the one hand, many of them begin to believe in Jesus (see John 11:45; 12:9‒11). On the other, some of them go and tell the Pharisees … Thus, in John, the raising of Lazarus is the proximate cause of final opposition to Jesus'
  - where: 'note 12:10 “Lazarus also”'
    claim: 'The chief priests were mostly Sadducees; Lazarus’s life witnessed against them and their denial of the resurrection; they took counsel, not a final decision'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/12.htm'
    quote: 'The chief priests were for the most part Sadducees (Acts 5:17). … his life is a witness to the divinity of Him whom they have condemned to death, and a denial of their own doctrine that there is no resurrection (Acts 23:8). The words do not mean that they came to a final decision'
  - where: 'note 12:10 “Lazarus also”'
    claim: 'John notes the effect of the entry on Jesus’s opponents, galvanizing their opposition'
    key: huntsman-palm-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/palm-sunday'
    quote: 'It also notes the effect that Jesus’s reception had on his opponents, galvanizing their violent opposition to him (12:19).'
  # ---- note 12:13
  - where: 'note 12:10 “Lazarus also”'
    claim: 'John’s word for Jesus’s miracles is sēmeia, signs'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'some Jews in Jerusalem begin to believe in Jesus “when they saw the miracles [Greek, sēmeia] which he did” (2:23).'
  - where: 'note 12:13 “Hosanna to the King of Israel”'
    claim: 'Psalm 118 closes the Passover Hallel and was a procession psalm; Hosanna is Aramaic for “save now”; Matthew and John make the cry royal'
    key: huntsman-palm-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/palm-sunday'
    quote: 'Psalm 118, which is the last of what came to be known as the Egyptian Hallel, a group of religious songs (Pss 113–18) that was sung as part of the celebration of Passover. Originally, however, Psalm 118 appears to have been used in liturgical processions'
  - where: 'note 12:13 “Hosanna to the King of Israel”'
    claim: 'Hosanna is an Aramaic form of Ps. 118:25; John makes the ovation a royal acclamation'
    key: huntsman-palm-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/palm-sunday'
    quote: 'they were using an Aramaic form of the Hebrew hôšîʿânnāʾ from Psalm 118:25, which means “save now” (KJV) or “save us, we beseech you” (NRSV). … Matthew and John, however, vary the crowd’s acclamation to make it more explicitly a royal acclamation.'
  - where: 'note 12:13 “Hosanna to the King of Israel”'
    claim: 'Solomon rode his donkey to his anointing while the people shouted “God save King Solomon”'
    key: huntsman-palm-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/palm-sunday'
    quote: 'King Solomon also rode his donkey at the base of the Mount of Olives, where he was anointed king over Israel (1 Kgs 1:32–37). During the royal procession, his constituents shouted, “God save King Solomon,”'
  - where: 'note 12:13 “Hosanna to the King of Israel”'
    claim: 'The entry was one of the few times Jesus was recognized as the Messiah, a prophetic sign'
    key: huntsman-palm-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/palm-sunday'
    quote: 'the triumphal entry was one of the few times during his ministry when Jesus was recognized as the Messiah he actually was. … Both these episodes can be categorized as “prophetic signs” or symbolic, dramatic enactments'
  - where: 'note 12:13 “Hosanna to the King of Israel”'
    claim: 'John quotes Zechariah freely, in a shortened form'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/12.htm'
    quote: 'The quotation is made freely, and in an abbreviated form.'
  # ---- note 12:16
  - where: 'note 12:16 “Understood not at the first”'
    claim: 'The Spirit afterwards brought the words of the scriptures to the disciples’ memory'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/12.htm'
    quote: 'He remembers the difference between the spiritual receptivity, before and after Pentecost, in the Apostolic band itself. He remembers how the Old Testament Scriptures became filled with a new life and meaning, as the Spirit brought to the memory their words'
  # ---- note 12:20
  - where: 'note 12:20 “Certain Greeks”'
    claim: 'They were Hellenes, Gentiles, not Greek-speaking Jews'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/12.htm'
    quote: 'They were not Hellenists, i.e., Greek Jews, but Hellenes, i.e., Gentiles.'
  - where: 'note 12:20 “Certain Greeks”'
    claim: 'They went up to the feasts and had been admitted to Judaism'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/12.htm'
    quote: 'The words imply that they were in the habit of going up to Jerusalem at the feasts, i.e., that though Greeks by birth, they had been admitted to the privileges of Judaism.'
  - where: 'note 12:20 “Certain Greeks”'
    claim: 'Converts were admitted only to the court of the Gentiles'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'they were admitted to the temple precincts, but were not allowed to pass beyond the court of the Gentiles.'
  - where: 'note 12:20 “Certain Greeks”'
    claim: 'Bethsaida is named perhaps to explain why the Greeks came to Philip'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/12.htm'
    quote: 'The mention of this place again here seems to intend that it should be told as explaining why these Greeks came to Philip. They may have themselves come from the neighbourhood of Bethsaida, or from one of the Greek cities of Decapolis.'
  - where: 'note 12:20 “Certain Greeks”'
    claim: 'Philip and Andrew are the only apostles with Greek names, fellow townsmen; Andrew was closer to the Lord'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/12.htm'
    quote: 'the Greeks thus came into connection with the only Apostles who bear Greek names … they were fellow-townsmen and friends. … Philip consults his friend Andrew, who is in a position of greater intimacy with the Lord than he himself is'
  # ---- note 12:23
  - where: 'note 12:23 “The hour is come”'
    claim: 'Gentiles seek Him while priests and rulers seek to kill Him; they recall the other sheep and are the first fruits'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/12.htm'
    quote: 'who now, when priests and rulers are seeking to kill Him, are seeking to render Him homage, brings back again the thought of the scattered sheep, for whose gathering the Shepherd’s life must be laid down (John 10:16-19). They are the first-fruits'
  - where: 'note 12:23 “The hour is come”'
    claim: 'John describes Jesus’s death and resurrection as the means of His glory; Moses 1:39 fits'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'John frequently describes the saving death and resurrection of Jesus as the means by which he is both glorified and glorifies the Father.[31] The title is apt, especially for Latter-day Saint readers, because in Restoration scripture the Lord directly declares'
  - where: 'note 12:23 “The hour is come”'
    claim: 'His death is the path that leads to glory'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/12.htm'
    quote: 'The connection implies also that He regards His own death as the dark path which must be trodden before the path of glory can be entered.'
  # ---- note 12:24
  - where: 'note 12:24 “A corn of wheat”'
    claim: '“Corn” means grain, seed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/12?lang=eng'
    quote: '24a “corn”: GR grain, seed.'
  - where: 'note 12:24 “A corn of wheat”'
    claim: 'The single grain dies and gives life to blade, stalk and ear; His death releases life into a harvest'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/12.htm'
    quote: 'the single grain, in its own death, would give life to blade, and stalk, and ear of corn. … in His death it will burst forth, and grow up, and multiply itself in the great spiritual harvest of the world.'
  - where: 'note 12:24 “A corn of wheat”'
    claim: 'A farmer who keeps his wheat has no increase; His death was life glorified, not lost'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'A farmer who neglects or refuses to cast his wheat into the earth, because he wants to keep it, can have no increase … but His death, far from being life lost, was to be life glorified.'
  # ---- note 12:25
  - where: 'note 12:25 “Hateth his life”'
    claim: 'In Luke 14:26 and John 12:25 miseō is the strong language of love and hate where English would speak of interest or disregard'
    key: thayer
    url: 'https://biblehub.com/greek/3404.htm'
    quote: '‘the Orientals, in accordance with their greater excitability, are accustomed both to feel and to profess love and hate where we Occidentals, with our cooler temperament, feel and express nothing more than interest in, or disregard and indifference to a thing’'
  - where: 'note 12:25 “Hateth his life”'
    claim: 'Talmage’s explanation of loving and hating one’s life'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'he that loves his life so well that he will not imperil it, or, if need be, give it up, in the service of God, shall forfeit his opportunity to win the bounteous increase of eternal life; while he who esteems the call of God as so greatly superior to life that his love of life is as hatred in comparison'
  - where: 'note 12:25 “Hateth his life”'
    claim: 'JST Luke 9:24'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-luke/9?lang=eng'
    quote: 'For whosoever will save his life, must be willing to lose it for my sake; and whosoever will be willing to lose his life for my sake, the same shall save it.'
  - where: 'note 12:27 “Now is my soul troubled”'
    claim: 'John omits the suffering in Gethsemane; the garden is only the scene of the arrest'
    key: huntsman-lamb-of-god
    url: 'https://rsc.byu.edu/behold-lamb-god/lamb-god-unique-aspects-passion-narrative-john'
    quote: 'John simply states that Jesus crossed the brook Cedron and came to a garden, not even mentioning the names Gethsemane or Mount of Olives (see John 18:1). … for John the garden is simply the scene of Jesus’s betrayal and arrest'
  - where: 'note 12:27 “Now is my soul troubled”'
    claim: 'John was one of the three near witnesses'
    key: huntsman-lamb-of-god
    url: 'https://rsc.byu.edu/behold-lamb-god/lamb-god-unique-aspects-passion-narrative-john'
    quote: 'John was the only one who was one of the three near witnesses'
  - where: 'note 12:27 “Now is my soul troubled”'
    claim: 'The agony of Gethsemane is here, and Matt. 26:39 is echoed; the shrinking is real'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/12.htm'
    quote: 'There is a real shrinking from the darkness of the death which is at hand. The conflict exists but for a moment … Men have sometimes wondered that St. John passes over the agony of the garden of Gethsemane, but the agony of Gethsemane is here, and the very words of Matthew 26:39 are echoed.'
  - where: 'note 12:27 “Now is my soul troubled”'
    claim: 'The words were spoken probably in the court of the Gentiles'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/12.htm'
    quote: 'They were uttered, probably, in the Court of the Gentiles'
  - where: 'note 12:27 “Now is my soul troubled”'
    claim: 'Whether “Father, save me from this hour” is a prayer or a question is uncertain'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/12.htm'
    quote: 'It is uncertain whether the first words of this sentence are a prayer, or whether they should be read as a question.'
  - where: 'note 12:27 “Now is my soul troubled”'
    claim: 'D&C 19:18–19'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/19?lang=eng'
    quote: 'and would that I might not drink the bitter cup, and shrink—'
  # ---- note 12:29
  - where: 'note 12:29 “It thundered”'
    claim: 'The voice was objective, heard and variously interpreted by the bystanders'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'The voice was real; it was no subjective whisper of comfort to the inner consciousness of Jesus, but an external, objective reality. … some said it was thunder; others, of better spiritual discernment, said: “An angel spake to him”; and some may have understood the words as had Jesus.'
  - where: 'note 12:29 “It thundered”'
    claim: 'Jesus knew the Father heard Him; the voice was a sign to others witnessing to the Son’s mission'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/12.htm'
    quote: 'Jesus Himself knew that the Father heareth Him always, but this answer is a sign to others. (Comp. John 11:41-42.) … should have been, to ears ready to hear and minds willing to receive, the voice of God witnessing to the mission of His Son.'
  # ---- note 12:31
  - where: 'note 12:31 “The prince of this world”'
    claim: 'JST John 14:30: the prince of darkness, Satan'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-john/14?lang=eng'
    quote: 'Hereafter I will not talk much with you; for the prince of darkness, who is of this world, cometh, but hath no power over me, but he hath power over you.'
  - where: 'note 12:31 “The prince of this world”'
    claim: 'Jesus speaks as though the cross were past; Satan was doomed'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'as though the cross and the sepulchre were already of the past: “Now is the judgment of this world: now shall the prince of this world be cast out.” Satan, the prince of the world was doomed.'
  - where: 'note 12:31 “The prince of this world”'
    claim: 'The tenses differ: judgment immediate, the casting out a gradual victory'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/12.htm'
    quote: 'It should be noted, however, that the tenses differ. The one is thought of as the immediate result of His death; the other is the gradual victory of truth, and is spoken of in the same future as the drawing all men of the following verse.'
  # ---- note 12:32
  - where: 'note 12:32 “Lifted up from the earth”'
    claim: 'The lifted-up sayings: 3:14, 8:28 and 12:32–34'
    key: huntsman-lamb-of-god
    url: 'https://rsc.byu.edu/behold-lamb-god/lamb-god-unique-aspects-passion-narrative-john'
    quote: 'Other references to Jesus being lifted up include one in John 8:28 during the Light of the World discourse and two in John 12:32–34 as Jesus reflects on the coming hour shortly after His Triumphal Entry to Jerusalem.'
  - where: 'note 12:32 “Lifted up from the earth”'
    claim: '“Lifted up” includes the thought of the ascension'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/12.htm'
    quote: 'The words “lifted up” have occurred before in John 3:14; John 8:28; but the context here shows that they include the thought of the ascension into heaven.'
  - where: 'note 12:32 “Lifted up from the earth”'
    claim: 'Looking back, John sees in the cross the throne of glory'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/12.htm'
    quote: 'The words bear the double sense, and looking back upon the fact of the Crucifixion, he sees in that a lifting up which was part of the great moral victory over the world, and in the very cross of shame he sees the throne of glory.'
  - where: 'note 12:32 “Lifted up from the earth”'
    claim: '“All men” means all; the Greeks are first fruits'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/12.htm'
    quote: 'are to be taken in all the fulness of their width as meaning simply what they say—“all.” … These Greeks who are drawn to Him now are the first-fruits of the harvest'
  - where: 'note 12:32 “Lifted up from the earth”'
    claim: 'The risen Lord confirmed the saying to the Nephites (3 Ne. 27:14)'
    key: huntsman-lamb-of-god
    url: 'https://rsc.byu.edu/behold-lamb-god/lamb-god-unique-aspects-passion-narrative-john'
    quote: 'Then, after His resurrection, He confirmed to the Nephites, “my Father sent me that I might be lifted up upon the cross; and after that I had been lifted up upon the cross, that I might draw all men unto me'
  - where: 'note 12:32 “Lifted up from the earth”'
    claim: '3 Ne. 27:14: drawn to stand before Him and be judged'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/27?lang=eng'
    quote: 'that as I have been lifted up by men even so should men be lifted up by the Father, to stand before me, to be judged of their works, whether they be good or whether they be evil—'
  # ---- note 12:34
  - where: 'note 12:34 “Christ abideth for ever”'
    claim: '“The law” is the whole Old Testament; such passages as Ps. 89:36 and Isa. 9:6; read as a temporal reign; they expected Him to free them from Rome'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/12.htm'
    quote: 'The term “law” refers to the whole of the Old Testament Scripture … They may have referred to such passages as Psalm 89:36; Psalm 110:4; Isaiah 9:6; Daniel 7:13-14. … They expected Him to free them from Roman bondage'
  - where: 'note 12:34 “Christ abideth for ever”'
    claim: 'The Lord refrained from a direct avowal and told them to walk in the light'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'the Lord refrained from a direct avowal, but admonished them to walk in the light while the light was with them'
  # ---- note 12:40
  - where: 'note 12:40 “Therefore they could not believe”'
    claim: 'Verse 37 is John’s comment at the close of the public teaching'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/12.htm'
    quote: 'This is the writer’s comment on the general result of Christ’s work at the close of His public teaching.'
  - where: 'note 12:40 “Therefore they could not believe”'
    claim: 'Power used increases, power neglected destroys itself; willful rejection followed by rejection beyond the will'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/12.htm'
    quote: 'that power used is increased, and power neglected destroys itself. Here, then, in these prophetic words was the reason they could not believe. Wilful rejection had been followed by rejection which was no longer within the power of the will.'
  - where: 'note 12:40 “Therefore they could not believe”'
    claim: 'Quoted by Jesus for the parables and by Paul at Rome; Isaiah, John and Paul were Jews; blinding comes only to eyes that will not see'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/12.htm'
    quote: 'Our Lord, as we have seen, quotes them as explaining His own teaching (Matthew 13:14) … Isaiah, and John, and Paul, were all Jews … but these come only to eyes that will not to see, and to hearts that will not to hear'
  - where: 'note 12:41 “When he saw his glory”'
    claim: 'The glory Isaiah saw was of the pre-incarnate Word'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/12.htm'
    quote: 'The result of seeing His glory was that he spake of Him. This is St. John’s interpretation of the prophecy. … This glory was of the pre-incarnate Word, who was in the beginning with God, and was God.'
  - where: 'note 12:41 “When he saw his glory”'
    claim: '2 Ne. 11:2: Isaiah saw the Redeemer'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/11?lang=eng'
    quote: 'for he verily saw my Redeemer, even as I have seen him.'
  # ---- note 12:43
  - where: 'note 12:43 “The praise of men”'
    claim: 'Many even in the Sanhedrin believed'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/12.htm'
    quote: 'There were, notwithstanding, many even in the Sanhedrin itself who believed on Him.'
  - where: 'note 12:43 “The praise of men”'
    claim: 'The footnote to “confess” points to John 19:38'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/12?lang=eng'
    quote: '42c “confess”: Prov. 29:25; John 19:38.'
  - where: 'note 12:43 “The praise of men”'
    claim: '“Praise” is glory; John 5:44 puts the same truth as a question'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/12.htm'
    quote: 'For “praise” read in both instances glory. “The glory which comes from men more than the glory which came from God.” Comp. Note on John 5:44, where the truth is put in the form of a question by our Lord.'
  - where: 'note 12:43 “The praise of men”'
    claim: 'The Greek has doxa twice in verse 43'
    key: greek-nt
    url: 'https://biblehub.com/interlinear/john/12-43.htm'
    quote: '1391 [e] doxan δόξαν glory N-AFS'
  - where: 'note 12:43 “The praise of men”'
    claim: 'The Greek has doxa in verse 41'
    key: greek-nt
    url: 'https://biblehub.com/interlinear/john/12-41.htm'
    quote: '1391 [e] doxan δόξαν glory N-AFS'
  - where: 'note 12:49 “What I should say”'
    claim: '“Cried” implies public teaching to the multitude, after verse 36'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/12.htm'
    quote: 'This forbids our understanding these words of any private discourse addressed to the disciples. The phrase implies public teaching addressed to the multitude, and it may be inferred that there was some such teaching after John 12:36.'
  - where: 'note 12:49 “What I should say”'
    claim: 'The rejection of the word is itself the judgment'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/12.htm'
    quote: 'The very fact that He was so rejected was itself the judgment of those who rejected it.'
  - where: 'note 12:49 “What I should say”'
    claim: 'The footnote to verse 50 points to Deut. 18:18'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/12?lang=eng'
    quote: '50a “speak”: Deut. 18:18.'
  - where: 'note 12:49 “What I should say”'
    claim: '3 Ne. 20:23: the risen Lord is the prophet of whom Moses spoke'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/20?lang=eng'
    quote: 'Behold, I am he of whom Moses spake, saying: A prophet shall the Lord your God raise up unto you of your brethren, like unto me'
  # ---- christ, explore
  - where: christ
    claim: 'One who yields his life in the service of God keeps it, like the buried grain'
    key: talmage-jesus-christ-29
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-29?lang=eng'
    quote: 'shall find the life he freely yields or is willing to yield, though for the time being it disappear like the grain buried in the soil; and he shall rejoice in the bounty of eternal development.'
  - where: christ
    claim: 'The praise of God persists; the praise of men is fleeting'
    key: tanner-praise-of-men
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1975/10/for-they-loved-the-praise-of-men-more-than-the-praise-of-god?lang=eng'
    quote: 'How much more satisfying it is when we receive the praise of God, knowing that it is fully justified and that his love and respect for us will persist, when usually the praise of men is fleeting and most disappointing.'
  - where: explore
    claim: 'The Palm Sunday chapter gives the accounts of the entry and reads them with Zechariah 9 and Psalm 118'
    key: huntsman-palm-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/palm-sunday'
    quote: 'Drawing upon Zechariah 9 and Psalm 118, the triumphal entry illustrated that Jesus was the Son of David, the rightful king of Israel.'
