chapter: 20
claims:
  # ---- when, setting, thread
  - where: when
    claim: '“After eight days” means a week later, the next Sunday'
    key: talmage-jesus-christ-37
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-37?lang=eng'
    quote: 'A week later, for so the Jewish designation, “after eight days,” is to be understood, therefore on the next Sunday'
  - where: setting
    claim: 'John’s account of the tomb differs enough to stand on its own: Mary comes alone, and her meeting with the risen Lord is unique to John'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'John’s account of the events at the empty tomb that first Easter morning is different enough to warrant particular attention. First, it portrays Mary of Magdala coming to the tomb alone, without the other women. … Second, it records the moving encounter of Mary with the Risen Lord, a unique scene'
  - where: setting
    claim: 'John stages scenes with single characters who represent a group or serve as types of others, including later readers'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'John’s Gospel, however, frequently “stages” scenes with individual characters for dramatic effect, having one character representing a group of historical figures or, as we shall see, serving as a type of others, including future readers.'
  - where: setting
    claim: 'Chapter 21 resumes a narrative that seemed to end with 20:30–31'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'The style of the epilogue (21:1–25) may suggest that it was a later addition; it certainly resumes a narrative that seemed to end with the programmatic statement of John 20:30–31.'
  - where: setting
    claim: 'The other disciple of 20:2–8 is John, who refers to himself this way'
    key: bd-john
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/john?lang=eng'
    quote: 'In his own Gospel he refers to himself as “the disciple whom Jesus loved” (John 13:23; 19:26; 20:2; 21:7, 20) and that “other disciple” (John 20:2–8).'
  - where: thread
    claim: 'The figures of John 20 are real witnesses and also types of how people respond to the news of the risen Lord'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'the evangelist also uses it to craft a powerful dramatic scene, one in which the historical figures—real people and powerful witnesses—serve as paradigmatic characters or important types of how people respond to the news of the Risen Lord.'
  - where: thread
    claim: 'There is a difference between physically seeing Jesus and knowing Him'
    key: pierce-recognizing-christ
    url: 'https://rsc.byu.edu/he-was-seen/seeing-knowing-recognizing-true-identity-christ'
    quote: 'she turned and “saw Jesus standing, and knew not that it was Jesus,” demonstrating that there is a difference between physically “seeing” Jesus and spiritually “knowing” Jesus (John 20:14).'
  - where: thread
    claim: 'The Thomas episode offers the apostolic witness on which later faith is built, which is the purpose stated in 20:31'
    key: bowen-our-hands-have-handled
    url: 'https://interpreterfoundation.org/journal/our-hands-have-handled-ensuring-the-reassuring-doctrine-of-the-resurrection-in-the-lucan-and-johannine-writings'
    quote: 'Thus the Thomas episode offers the concrete apostolic witness upon which saving faith can be built: “blessed are they that have not seen, and yet have believed.” This constitutes the very [Page 386]purpose of the Johannine gospel'

  # ---- notes
  - where: 'note 20:2 “The other disciple, whom Jesus loved”'
    claim: 'The other disciple is John, who calls himself the disciple whom Jesus loved and that other disciple'
    key: bd-john
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/john?lang=eng'
    quote: 'In his own Gospel he refers to himself as “the disciple whom Jesus loved” (John 13:23; 19:26; 20:2; 21:7, 20) and that “other disciple” (John 20:2–8).'
  - where: 'note 20:2 “The other disciple, whom Jesus loved”'
    claim: 'This is the third appearance of the beloved disciple: at the supper, at the cross, at the tomb'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'This is the third appearance of this character, the first being when he reclined in the arms of Jesus at the Last Supper and the second when he stood at the foot of the cross (John 13:23; 19:26).'
  - where: 'note 20:2 “The other disciple, whom Jesus loved”'
    claim: 'Mary’s “we” could mean she came with other women; John stages scenes around one figure who stands for a group'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'This could suggest that she had, in fact, gone to the tomb with other women; John’s Gospel, however, frequently “stages” scenes with individual characters for dramatic effect, having one character representing a group of historical figures'
  - where: 'note 20:7 “The grave clothes left in order”'
    claim: 'The face cloth (soudarion) was folded and placed apart from the wrappings; their careful placement convinced the disciples the body had not been stolen'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'the face cloth (Greek, to soudarion; KJV, “napkin”) was folded and placed separately. … their careful placement convinced the two disciples that Jesus’s body had not been stolen, since grave robbers would probably not have taken the time to unwrap the body and then carefully fold and place the face cloth.'
  - where: 'note 20:7 “The grave clothes left in order”'
    claim: 'The face cloth links the scene to Lazarus, who would need grave clothes again; Jesus left His behind, never to die again'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'Because Jesus had restored to Lazarus to mortal life, the implication was that he would need them again. Jesus, on the other hand, had risen from tomb once and for all, leaving his graveclothes behind since he would never die again.'
  - where: 'note 20:7 “The grave clothes left in order”'
    claim: 'The folded napkin is the detail of an eyewitness'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/20.htm'
    quote: 'In this description and in this verse the minute knowledge and remembrance of an eye-witness reaches its climax. The very fact that the napkin was folded did not escape the writer’s eye, nor fade from his memory.'
  - where: 'note 20:8 “He saw, and believed”'
    claim: 'Until then they had not understood the scripture foretelling the Resurrection; from the absent body they recognized He must rise; compare John 2:21–22'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/20.htm'
    quote: 'Up to this time they knew not the meaning of the Scripture which foretold the Resurrection; but from that moment at least they recognised in the fact of the absent body of Christ the truth that He must rise again. (Comp. Notes on John 2:21-22.)'
  - where: 'note 20:8 “He saw, and believed”'
    claim: 'Peter’s response is not detailed; Luke and Paul show he went on pondering until the Lord appeared to him'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'Peter’s response to the signs of the empty tomb and the discarded graveclothes is not detailed; only with the notices of Luke and Paul … do we realize that these signs led him to continue to ponder, which led to a subsequent, intensely personal revelation of the Risen Lord.'
  - where: 'note 20:8 “He saw, and believed”'
    claim: 'John believed without having seen the Lord, and Jesus asked the others to follow his example'
    key: draper-he-has-risen
    url: 'https://rsc.byu.edu/sperry-symposium-classics-new-testament/he-has-risen'
    quote: 'John alone among the disciples realized the significance of the empty tomb. He had not seen the Lord, yet he believed. Jesus asked the others to follow his example.'
  - where: 'note 20:16 “Called by name”'
    claim: 'Reasons offered for Mary’s not knowing Him: early light, tears, or the recurring motif of the resurrected body’s difference'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'Mary does not at first recognize Jesus, mistaking him for the gardener (John 20:15), perhaps because of the early light or her own tear-filled eyes. Alternatively, it may have resulted from a motif we will see again when others do not at first recognize the Risen Lord (cf. Luke 24:16; John 21:4)'
  - where: 'note 20:16 “Called by name”'
    claim: 'When He calls her name she knows Him at once, fulfilling John 10:3, 27'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'However, when Jesus calls her name, she immediately realizes who he is (John 20:16), fulfilling the earlier promise of Jesus, “The sheep hear his voice, and he calls his own sheep by name.'
  - where: 'note 20:16 “Called by name”'
    claim: 'She expected a gardener near the tomb'
    key: pierce-recognizing-christ
    url: 'https://rsc.byu.edu/he-was-seen/seeing-knowing-recognizing-true-identity-christ'
    quote: 'She knew she was near the tomb, where she expected to find a gardener, whom she identified as the man she was watching (John 20:15).'
  - where: 'note 20:16 “Called by name”'
    claim: 'One word, her name, made her turn and know Him; rabboni means master or teacher'
    key: pierce-recognizing-christ
    url: 'https://rsc.byu.edu/he-was-seen/seeing-knowing-recognizing-true-identity-christ'
    quote: 'It took only one specific word from the Lord for Mary to truly recognize him as the risen Christ. Jesus said to her, “Mary,” reciting her personal name, causing her to actively turn toward him and call him by his title rabboni, which means “master” or “teacher”'
  - where: 'note 20:17 “Hold me not”'
    claim: 'The Joseph Smith Translation reads “Hold me not”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/20?lang=eng'
    quote: 'JST John 20:17 … Hold me not'
  - where: 'note 20:17 “Hold me not”'
    claim: 'The verb haptomai (middle) means to fasten oneself to, cling to'
    key: thayer
    url: 'https://biblehub.com/greek/680.htm'
    quote: 'properly, to fasten oneself to, adhere to, cling to (Homer, Iliad 8. 67);'
  - where: 'note 20:17 “Hold me not”'
    claim: 'The present imperative mē mou haptou asks her to stop an action already begun: “Stop clinging to me”; she had apparently fallen at His feet and embraced Him'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'Mary’s response apparently is to fall at Jesus’s feet, embracing him and leading him to respond, “Stop clinging to me!” (John 20:17). This is the actual meaning of the Greek, with a present imperative form (mē mou haptou) suggesting that he is asking her to stop an action that she has already begun'
  - where: 'note 20:17 “Hold me not”'
    claim: 'Most likely explanation of “not yet ascended”: He will be with them a short time, then ascend; Mary must not hold Him back but finish her mission'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'the most likely explanation is that although Jesus will be with his earthly disciples for a short period, he in time will ascend to his Father and Mary must not seek to hold him back but continue on earth to finish her own mortal mission.'
  - where: 'note 20:17 “Hold me not”'
    claim: 'Pierce: He would not always be physically present for her to cling to; she would seek Him through the Spirit'
    key: pierce-recognizing-christ
    url: 'https://rsc.byu.edu/he-was-seen/seeing-knowing-recognizing-true-identity-christ'
    quote: 'The Savior was explaining to Mary that he will not always be physically present for her to cling to in her learning and understanding of the gospel but instead will be spiritually present as she takes an active position in studying and growing in knowledge herself.'
  - where: 'note 20:17 “Hold me not”'
    claim: 'Talmage: if the second clause explains the first, no hand was to touch the body until He presented Himself to the Father; probably He ascended between Mary’s meeting and the women’s holding His feet, and returned'
    key: talmage-jesus-christ-37
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-37?lang=eng'
    quote: 'If the second clause was spoken in explanation of the first, we have to infer that no human hand was to be permitted to touch the Lord’s resurrected and immortalized body until after He had presented Himself to the Father. It appears reasonable and probable that … Christ did ascend to the Father, and that later He returned'
  - where: 'note 20:17 “My Father, and your Father”'
    claim: '“Brethren” from the risen Lord declares the continuance of His human nature'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/20.htm'
    quote: 'There is a special force in the word “brethren” as spoken by the risen Lord, in that it declares the continuance of His human nature.'
  - where: 'note 20:17 “My Father, and your Father”'
    claim: '“My Father, and your Father” is more emphatic than “our Father”: because He is My Father, He is also yours'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/20.htm'
    quote: 'It is a more emphatic expression than “our Father” would have been. “I ascend unto My Father. Because He is My Father, He is also your Father, and you are My brethren. My victory over death was the victory of man'
  - where: 'note 20:17 “My Father, and your Father”'
    claim: 'Mary’s telling uses the technical term for proclaiming; with her eyewitness testimony it earned her the title “apostle to the apostles”; women’s testimony was generally distrusted'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'The use again of this technical term for proclaim, together with the eyewitness testimony, earned Mary the traditional title “apostle to the apostles” (Latin, apostolorum apostola). … Given the level of constraints upon women, including the general distrust of their testimonies in legal settings'
  - where: 'note 20:19 “The doors were shut”'
    claim: 'The disciples had gathered secretly because of concerns about the Jewish authorities'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'John also speaks of a group of disciples who had gathered secretly because of concerns about the Jewish authorities (John 20:19).'
  - where: 'note 20:19 “The doors were shut”'
    claim: 'The shut doors show the resurrected Jesus doing something like the resurrected Moroni, entering by a “conduit” (JS—H 1:30, 43)'
    key: bowen-our-hands-have-handled
    url: 'https://interpreterfoundation.org/journal/our-hands-have-handled-ensuring-the-reassuring-doctrine-of-the-resurrection-in-the-lucan-and-johannine-writings'
    quote: 'John’s mention that “the doors were shut” additionally serves the function of showing that the resurrected Jesus was able to do something similar to what Joseph Smith reports the resurrected Moroni doing: appearing into a room through some kind of “conduit” (see Joseph Smith—History 1:30, 43).'
  - where: 'note 20:19 “The doors were shut”'
    claim: 'Joseph Smith saw a conduit open into heaven as Moroni departed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/js-h/1?lang=eng'
    quote: 'when, instantly I saw, as it were, a conduit open right up into heaven, and he ascended till he entirely disappeared'
  - where: 'note 20:20 “His hands and his side”'
    claim: 'Showing hands and side answers the disciples’ fear that He was a spirit; the implication is that they handled them'
    key: bowen-our-hands-have-handled
    url: 'https://interpreterfoundation.org/journal/our-hands-have-handled-ensuring-the-reassuring-doctrine-of-the-resurrection-in-the-lucan-and-johannine-writings'
    quote: 'The disciples’ misconception that he was a disembodied spirit (cf. Luke) explains Jesus’s next actions: showing them his hands and his side. The clear implication is that they handled both'
  - where: 'note 20:20 “His hands and his side”'
    claim: 'The wounds were tokens of His sacrificial death, signs that He had completed His atoning sacrifice'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'Perhaps most significantly, he presented the tokens of his sacrificial death in his hands, feet, and side as tangible signs that he had, in fact, completed his atoning sacrifice.'
  - where: 'note 20:20 “His hands and his side”'
    claim: 'Thomas’s demand suggests the disciples had touched Jesus as well as seen Him'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'seems to suggest that the disciples had more than just seen Jesus. Rather, as in Luke, they had “touched” or “handled” him as well'
  - where: 'note 20:20 “His hands and his side”'
    claim: 'At Bountiful the Lord gave the reason for feeling the wounds; the Church’s footnote at John 20:27 points there'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/11?lang=eng'
    quote: 'that ye may know that I am the God of Israel, and the God of the whole earth, and have been slain for the sins of the world.'
  - where: 'note 20:22 “Receive ye the Holy Ghost”'
    claim: 'What appears to occur is a symbolic re-creation of the disciples, as Adam received the breath of life'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'What appears to be occurring here is a symbolic re-creation of the disciples'
  - where: 'note 20:22 “Receive ye the Holy Ghost”'
    claim: 'The word for “breathed” occurs nowhere else in the New Testament and is the word of the Septuagint’s Genesis 2:7; what began here was accomplished at Pentecost'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/20.htm'
    quote: 'The word rendered “breathed” occurs nowhere else in the New Testament, but was familiar from its use in the Greek (LXX.) of Genesis 2:7. … It was the first step in that great moral change which passed over the disciples after the Crucifixion, and of which the day of Pentecost witnessed the accomplishment.'
  - where: 'note 20:22 “Receive ye the Holy Ghost”'
    claim: 'Elder Harold B. Lee: the breathing was in all likelihood the confirmation and commission to receive the Holy Ghost by the laying on of hands, the procedure His disciples followed afterward'
    key: lee-cr-1955-04
    url: 'https://archive.org/stream/conferencereport1955a/conferencereport1955a_djvu.txt'
    quote: 'which in all likelihood was the confirmation and the commis- sion to receive the Holy Ghost, or the baptism of the Spirit, by the laying on of hands for that was the procedure followed thereafter by His disciples.'
  - where: 'note 20:22 “Receive ye the Holy Ghost”'
    claim: 'JST John 7:39: the Holy Ghost promised after Jesus was glorified'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/7?lang=eng'
    quote: 'JST John 7:39 … for the Holy Ghost was promised unto them who believe, after that Jesus was glorified.)'
  - where: 'note 20:23 “Whose soever sins ye remit”'
    claim: 'The power rests on their being sent as He was sent and on receiving the Holy Ghost; compare the power of the keys, Matt. 16:19'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/20.htm'
    quote: 'Comp. for the “power of the keys,” the Notes on Matthew 16:19; Matthew 18:18. … this power is here immediately connected with the representative character of the disciples as apostles sent by Christ, as He was Himself sent by the Father (John 20:21), and that its validity is dependent upon their reception of the Holy Ghost'
  - where: 'note 20:23 “Whose soever sins ye remit”'
    claim: 'Lorenzo Snow: those who repented and were baptized by the apostles had sins forgiven through the atoning blood and received the Holy Ghost; those who refused had their sins remain; ordinances bless only when done by one sent of God'
    key: ttp-lorenzo-snow-2
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-of-presidents-of-the-church-lorenzo-snow/chapter-2-baptism-and-the-gift-of-the-holy-ghost?lang=eng'
    quote: 'every man that would come in humility, sincerely repenting of his sins, and receive baptism from the apostles should have his sins forgiven through the atoning blood of Jesus Christ, and through the laying on of hands should receive the Holy Ghost; but those that would refuse … would have their sins remain upon them.'
  - where: 'note 20:23 “Whose soever sins ye remit”'
    claim: 'Ordinances bring their blessings only when administered by one sent of God'
    key: ttp-lorenzo-snow-2
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-of-presidents-of-the-church-lorenzo-snow/chapter-2-baptism-and-the-gift-of-the-holy-ghost?lang=eng'
    quote: 'Unless [ordinances] are administered by one who is actually sent of God, the same blessings will not follow.'
  - where: 'note 20:23 “Whose soever sins ye remit”'
    claim: 'Lorenzo Snow testified that an angel restored the priesthood and the keys of the kingdom'
    key: ttp-lorenzo-snow-2
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-of-presidents-of-the-church-lorenzo-snow/chapter-2-baptism-and-the-gift-of-the-holy-ghost?lang=eng'
    quote: 'an Angel from God has visited man in these last days and restored that which has long been lost, even the priesthood,—the keys of the kingdom,—the fulness of the everlasting Gospel.'
  - where: 'note 20:23 “Whose soever sins ye remit”'
    claim: 'D&C 132:46 gives the same power in this dispensation'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/132?lang=eng'
    quote: 'and whosesoever sins you remit on earth shall be remitted eternally in the heavens; and whosesoever sins you retain on earth shall be retained in heaven.'
  - where: 'note 20:25 “Except I shall see”'
    claim: 'Thomas means “twin,” translated Didymus in Greek'
    key: bd-thomas
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/thomas?lang=eng'
    quote: 'The name means a “twin,” and so it is translated in John 11:16 by the Greek Didymus.'
  - where: 'note 20:25 “Except I shall see”'
    claim: 'Thomas’s demand suggests the others had touched Jesus as well as seen Him; his reaction surprises after his earlier depictions; as an apostle he may have wanted the same sure witness'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'seems to suggest that the disciples had more than just seen Jesus. Rather, as in Luke, they had “touched” or “handled” him as well … Thomas’s reaction here is surprising given his earlier, positive depictions in this Gospel (John 11:16; 14:5‒6) … he may have desired the same sure testimony that his fellows had received.'
  - where: 'note 20:25 “Except I shall see”'
    claim: 'Caution and charity in judging Thomas; he could hardly have doubted the empty tomb or his friends; he balked at a corporeal resurrection'
    key: talmage-jesus-christ-37
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-37?lang=eng'
    quote: 'Caution and charity must attend our judgment in any conclusion as to the incredulous attitude of this man. He could scarcely have doubted the well attested circumstance of the empty sepulchre … It was the corporeal manifestation of the risen Lord … to which Thomas demurred.'
  - where: 'note 20:28 “My Lord and my God”'
    claim: '“My Lord and my God” is the Septuagint’s rendering of YHWH ʾĔlōhāy; Thomas testified Jesus was Jehovah, tying back to John 1:1'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'Because this is the standard way that the Septuagint rendered the Hebrew title YHWH ʾĔlōhāy, Thomas effectively testified that Jesus was Jehovah, the God of the Old Testament, a declaration that ties back to the first verse of the Gospel, “the Word was God” (John 1:1).'
  - where: 'note 20:28 “My Lord and my God”'
    claim: 'The words are addressed to Christ, a confession that his Lord was also God, not an exclamation to God'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/20.htm'
    quote: 'The sentence cannot therefore, without violence to the context, be taken as an exclamation addressed to God, and is to be understood in the natural meaning of a confession by the Apostle that his Lord was also God.'
  - where: 'note 20:28 “My Lord and my God”'
    claim: 'John wishes us to remember Thomas’s question in John 14:5–7; Thomas now knows'
    key: bowen-our-hands-have-handled
    url: 'https://interpreterfoundation.org/journal/our-hands-have-handled-ensuring-the-reassuring-doctrine-of-the-resurrection-in-the-lucan-and-johannine-writings'
    quote: 'John here wishes us to remember Thomas’s question on the night of his suffering in Gethsemane “how can we know the way?” and Jesus’s response'
  - where: 'note 20:28 “My Lord and my God”'
    claim: 'His adoration was accepted'
    key: talmage-jesus-christ-37
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-37?lang=eng'
    quote: 'exclaiming in worshipful acknowledgment of Christ’s Deity: “My Lord and my God.” His adoration was accepted'
  - where: 'note 20:29 “Blessed are they that have not seen”'
    claim: 'If a rebuke, a gentle one; He does not say those who believe without seeing are more fortunate than Thomas, only that they too are blessed'
    key: huntsman-easter-sunday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/easter-sunday'
    quote: 'if it were a rebuke, it is perhaps a gentle rebuke. He does not say that those who believe without seeing will be more fortunate than Thomas, simply that they, too, are fortunate (Greek, makarioi; KJV, “blessed”).'
  - where: 'note 20:29 “Blessed are they that have not seen”'
