  - where: 'note 20:31 “That ye might believe”'
    claim: 'The manuscripts divide between the aorist hina pisteusēte (KJV “that ye might believe”) and the present hina pisteuēte, “continue to believe”; the Gospel serves both unbelievers and believers'
