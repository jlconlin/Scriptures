chapter: 11
claims:
  # ---- when, setting, thread, plain words
  - where: setting
    claim: 'The raising of Lazarus is the seventh and crowning sign of the Book of Signs, showing power over death and foreshadowing His resurrection'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'The seventh and crowning miracle in the Book of Signs is the raising of Lazarus (11:38–44), showing not only Jesus’s power over death but foreshadowing his own resurrection'
  - where: setting
    claim: 'Lazarus, Mary and Martha lived in Bethany on the eastern slope of the Mount of Olives'
    key: van-dyke-miracles-john
    url: 'https://rsc.byu.edu/vol-9-no-3-2008/miracles-jesus-gospel-john'
    quote: 'Lazarus and his two sisters, Mary and Martha, made their home in Bethany on the eastern slope of the Mount of Olives near Jerusalem.'
  - where: setting
    claim: 'The Bethany episodes form a bridge between the Book of Signs and the Book of Glory'
    key: huntsman-preludes-last-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/preludes-jesuss-last-week'
    quote: 'The Bethany episodes, consisting of the story of the death and miraculous raising of Lazarus followed by a feast that Martha and Mary held for Jesus and their brother afterward, occupy a pivotal position in the Gospel of John, overlapping with and serving as a bridge between “The Book of Signs,”'
  - where: setting
    claim: 'JST John 11:2: Mary lived with Martha, in whose house Lazarus was sick'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/11?lang=eng'
    quote: 'And Mary, his sister, who anointed the Lord with ointment and wiped his feet with her hair, lived with her sister Martha, in whose house her brother Lazarus was sick.'
  - where: thread
    claim: 'The raising of Lazarus is the proximate cause of the leadership’s resolve to kill Jesus and anticipates His death and resurrection'
    key: huntsman-preludes-last-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/preludes-jesuss-last-week'
    quote: 'provides both the proximate cause of the Jerusalem leadership’s resolve to have Jesus killed even as it provides anticipations of Jesus’s coming death and resurrection'
  - where: thread
    claim: 'In the narrative Jesus trades His own life for Lazarus’s'
    key: smith-resurrection
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/resurrection'
    quote: 'Thus, in terms of the narrative there is a very real sense in which Jesus trades his own life for Lazarus’s life'
  - where: section 1 plain
    claim: '“Do well” (11:12) means be cured, saved'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/11?lang=eng'
    quote: 'be cured, saved'
  - where: section 2 plain
    claim: 'A furlong (stadium) is about 185 meters, so fifteen is under two miles'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/11?lang=eng'
    quote: 'about 185 meters'
  - where: section 3 plain
    claim: '“Groaned” renders a verb of strong inner agitation'
    key: thayer
    url: 'https://biblehub.com/greek/1690.htm'
    quote: 'to be very angry, to be moved with indignation'

  # ---- notes
  - where: 'note 11:4 “Not unto death, but for the glory of God”'
    claim: 'Lazarus’s death surprises the reader; only Jesus’s power over life and death resolves it'
    key: smith-resurrection
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/resurrection'
    quote: 'It is only the reality of Jesus’s power over life and death that can solve this problem at the heart of the story'
  - where: 'note 11:4 “Not unto death, but for the glory of God”'
    claim: 'His power over death is what shows the glory of God'
    key: smith-resurrection
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/resurrection'
    quote: 'it is Jesus’s power over death that shows “the glory of God.”'
  - where: 'note 11:4 “Not unto death, but for the glory of God”'
    claim: 'The sickness was not unto final death at that time'
    key: talmage-jesus-christ-28
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-28?lang=eng'
    quote: 'the illness of Lazarus was not unto final death at that time, but for the glory of God and that the Son of God might be glorified thereby'

  - where: 'note 11:6 “Why He waited two days”'
    claim: 'Lazarus died soon after the messenger set out'
    key: talmage-jesus-christ-28
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-28?lang=eng'
    quote: 'Lazarus had died in the interval; indeed he must have expired soon after the messenger had started with the tidings of the young man’s illness.'
  - where: 'note 11:6 “Why He waited two days”'
    claim: 'A day for the messenger, two days waiting and a day’s return make the four days'
    key: talmage-jesus-christ-28
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-28?lang=eng'
    quote: 'Lazarus must have died on the day of the messenger’s departure; for this day and the two days that elapsed before Jesus started toward Judea, and the day required for the return, would no more than cover the four days specified.'
  - where: 'note 11:6 “Why He waited two days”'
    claim: 'Verse 15 suggests the delay was deliberate, to teach'
    key: judd-caiaphas-prophecy
    url: 'https://rsc.byu.edu/behold-lamb-god/interpreting-caiaphass-prophecy-saviors-death'
    quote: 'The Savior’s statement seems to indicate that He deliberately waited in Galilee with the express intent to create a teaching moment.'

  - where: 'note 11:9 “Twelve hours in the day”'
    claim: 'It is still day, and He and they must do the Father’s work'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/11.htm'
    quote: 'it is as yet full day, and in that day He and they must do the work which is appointed of the Father.'

  - where: 'note 11:16 “That we may die with him”'
    claim: 'JST 11:16: they feared the Jews would take Jesus and put him to death'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/11?lang=eng'
    quote: 'for they feared lest the Jews should take Jesus and put him to death, for as yet they did not understand the power of God.'
  - where: 'note 11:16 “That we may die with him”'
    claim: 'Jesus’s risking His life to return to Judea foreshadows John 15:13'
    key: huntsman-preludes-last-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/preludes-jesuss-last-week'
    quote: 'his willingness to risk his own life by returning to Judea is a foreshadowing of his later statement after the Last Supper, “Greater love hath no man than this, that a man lay down his life for his friends”'
  - where: 'note 11:25 “I am the resurrection, and the life”'
    claim: 'Jews other than the Sadducees believed in a resurrection; Martha heard only a general assurance'
    key: talmage-jesus-christ-28
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-28?lang=eng'
    quote: 'for they, the Sadducees excepted, believed in a resurrection; and Martha failed to find in the Lord’s promise anything more than a general assurance'
  - where: 'note 11:25 “I am the resurrection, and the life”'
    claim: 'Martha had to learn that power over life and death was already committed to Jesus'
    key: talmage-jesus-christ-28
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-28?lang=eng'
    quote: 'she had to learn that unto Jesus had already been committed power over life and death.'
  - where: 'note 11:25 “I am the resurrection, and the life”'
    claim: 'She believed in the Speaker without fully understanding'
    key: talmage-jesus-christ-28
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-28?lang=eng'
    quote: 'she believed in the Speaker even while unable to fully comprehend His words.'
  - where: 'note 11:25 “I am the resurrection, and the life”'
    claim: 'Martha’s faith was general and future; Jesus ties the resurrection to Himself, specific and immediate'
    key: smith-resurrection
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/resurrection'
    quote: 'Martha has a faith in the Resurrection that is generic and future-oriented; Jesus instructs her that the Resurrection is, in some unexplained way, personally tied to him and thus specific and immediate.'
  - where: 'note 11:25 “I am the resurrection, and the life”'
    claim: 'Martha’s confession echoes Peter’s'
    key: huntsman-preludes-last-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/preludes-jesuss-last-week'
    quote: 'she responds with one of the strongest confessions in John, one that echoes versions of Peter’s apostolic confession'

  - where: 'note 11:26 “Shall never die”'
    claim: 'Since believers die, the death meant is spiritual death'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'Because many believers in Jesus die (indeed, Martha’s brother Lazarus has just died), the suggestion seems to be that the death Jesus is talking about is spiritual death,'
  - where: 'note 11:26 “Shall never die”'
    claim: 'The raising is a symbol of spiritual rebirth as well as of future resurrection'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'making the raising of Lazarus that follows this scene as much a symbol of the spiritual rebirth of people who come to Christ as it is an anticipation of a future resurrection.'
  - where: 'note 11:26 “Shall never die”'
    claim: 'Eternal life in Latter-day Saint teaching is the life God and Christ have, knowing them (17:3)'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'As Latter-day Saint doctrine teaches, it is having the kind of life that God and Christ have in their presence for eternity'

  - where: 'note 11:33 “Groaned in the spirit”'
    claim: 'The verb first means to snort, then to be very angry or moved with indignation'
    key: thayer
    url: 'https://biblehub.com/greek/1690.htm'
    quote: 'to snort in (of horses; German dareinschnauben): Aeschylus sept. 461; to be very angry, to be moved with indignation'
  - where: 'note 11:35 “Jesus wept”'
    claim: 'dakryō is to shed tears silently; klaiō to weep audibly'
    key: thayer
    url: 'https://biblehub.com/greek/2799.htm'
    quote: 'strictly, δακρύω denotes to shed tears, weep silently; κλαίω to weep audibly, to cry as a child'
  - where: 'note 11:35 “Jesus wept”'
    claim: 'Knowing He would raise Lazarus, His tears show mourning with those who mourn (Mosiah 18:9)'
    key: huntsman-preludes-last-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/preludes-jesuss-last-week'
    quote: 'Even though he knows full well he is about to raise Lazarus from the dead, Jesus’s compassion at this moment provides a powerful example of the importance of mourning with those who mourn (see Mosiah 18:9).'

  - where: 'note 11:44 “Bound with graveclothes”'
    claim: 'Lazarus was not resurrected; he was still mortal and would die again'
    key: van-dyke-miracles-john
    url: 'https://rsc.byu.edu/vol-9-no-3-2008/miracles-jesus-gospel-john'
    quote: 'It is significant to note that Lazarus was not resurrected. He was still mortal and would eventually die again.'
  - where: 'note 11:44 “Bound with graveclothes”'
    claim: 'The graveclothes signal he would one day wear them again'
    key: van-dyke-miracles-john
    url: 'https://rsc.byu.edu/vol-9-no-3-2008/miracles-jesus-gospel-john'
    quote: 'Figuratively, it conveys to the reader that he was not leaving death behind permanently but would one day be dressed in grave clothes a second time.'
  - where: 'note 11:44 “Bound with graveclothes”'
    claim: 'Jesus’s burial clothes were left in the tomb, never to be worn again (20:6–8)'
    key: van-dyke-miracles-john
    url: 'https://rsc.byu.edu/vol-9-no-3-2008/miracles-jesus-gospel-john'
    quote: 'when Christ was resurrected, John carefully describes how Jesus’s burial clothes were left in the tomb, never to be worn again'
  - where: 'note 11:44 “Bound with graveclothes”'
    claim: 'The napkin had held the jaw in place'
    key: talmage-jesus-christ-28
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-28?lang=eng'
    quote: 'his face was still bound by the napkin by which the lifeless jaw had been held in place.'

  - where: 'note 11:51 “Caiaphas prophesied”'
    claim: 'Caiaphas was appointed high priest in AD 18'
    key: judd-caiaphas-prophecy
    url: 'https://rsc.byu.edu/behold-lamb-god/interpreting-caiaphass-prophecy-saviors-death'
    quote: 'Eventually, after deposing and appointing another high priest, Valerius Gratus appointed Joseph Caiaphas as high priest in AD 18.'
  - where: 'note 11:51 “Caiaphas prophesied”'
    claim: '“That same year” means that fatal and decisive year'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/11.htm'
    quote: 'They are used with a solemnity of meaning to express “that fatal and decisive year.”'
  - where: 'note 11:51 “Caiaphas prophesied”'
    claim: 'Ancient Jewish traditions held that the high priest prophesied by virtue of his office'
    key: judd-caiaphas-prophecy
    url: 'https://rsc.byu.edu/behold-lamb-god/interpreting-caiaphass-prophecy-saviors-death'
    quote: 'The Jewish historian Josephus mentions traditions that say the high priest acquired the gift of prophecy simply by virtue of his position in the priesthood.'
  - where: 'note 11:51 “Caiaphas prophesied”'
    claim: 'Some Latter-day Saint commentators reason that God spoke through the office, not the man'
    key: judd-caiaphas-prophecy
    url: 'https://rsc.byu.edu/behold-lamb-god/interpreting-caiaphass-prophecy-saviors-death'
    quote: 'some Latter-day Saint commentators have discussed possible meanings of this verse, reasoning that God spoke through the holy priesthood office rather than the unholy man.'
  - where: 'note 11:51 “Caiaphas prophesied”'
    claim: 'Caiaphas did not intend a prophecy of the Atonement'
    key: judd-caiaphas-prophecy
    url: 'https://rsc.byu.edu/behold-lamb-god/interpreting-caiaphass-prophecy-saviors-death'
    quote: 'a prophecy of the atoning sacrifice of the Savior is not what the high priest himself intended.'
  - where: 'note 11:51 “Caiaphas prophesied”'
    claim: 'Verse 52 is John’s comment, not Caiaphas’s words'
    key: judd-caiaphas-prophecy
    url: 'https://rsc.byu.edu/behold-lamb-god/interpreting-caiaphass-prophecy-saviors-death'
    quote: 'this last statement—applying the death of Jesus not only to the Jews, but to other nations—is an editorial comment and not the words of Caiaphas himself.'
  - where: 'note 11:51 “Caiaphas prophesied”'
    claim: 'Caiaphas acted from political expediency'
    key: judd-caiaphas-prophecy
    url: 'https://rsc.byu.edu/behold-lamb-god/interpreting-caiaphass-prophecy-saviors-death'
    quote: 'Caiaphas was concerned with political expediency, not with justice.'
  - where: 'note 11:51 “Caiaphas prophesied”'
    claim: 'The likeness to 1 Nephi 4:13 is more apparent than real'
    key: judd-caiaphas-prophecy
    url: 'https://rsc.byu.edu/behold-lamb-god/interpreting-caiaphass-prophecy-saviors-death'
    quote: 'The similarities between this declaration and Caiaphas’s statement are more apparent than real.'
  - where: 'note 11:51 “Caiaphas prophesied”'
    claim: 'Nephi acted in obedience; Caiaphas from selfish interest'
    key: judd-caiaphas-prophecy
    url: 'https://rsc.byu.edu/behold-lamb-god/interpreting-caiaphass-prophecy-saviors-death'
    quote: 'Nephi’s whole focus was obedience to the commandments of God. The words of Caiaphas, on the other hand, had little to do with righteous desires.'

  - where: 'note 11:53 “From that day forth”'
    claim: 'The raising of Lazarus tipped the scales against Jesus'
    key: welch-legal-cause
    url: 'https://rsc.byu.edu/celebrating-easter/legal-cause-action-against-jesus-john-1829-30'
    quote: 'As Jesus came to Jerusalem for the very last time, one final miracle tipped the scales against Him—the raising of Lazarus.'
  - where: 'note 11:53 “From that day forth”'
    claim: 'Verse 57 amounts to a warrant for His arrest'
    key: welch-legal-cause
    url: 'https://rsc.byu.edu/celebrating-easter/legal-cause-action-against-jesus-john-1829-30'
    quote: 'The equivalent of a warrant for the arrest of Jesus was issued'
  - where: 'note 11:53 “From that day forth”'
    claim: 'Lazarus too was treated as leading people astray'
    key: welch-legal-cause
    url: 'https://rsc.byu.edu/celebrating-easter/legal-cause-action-against-jesus-john-1829-30'
    quote: 'In the chief priests’ minds, Lazarus too was leading people into apostasy by colluding with Jesus.'

  - where: christ
    claim: 'Jesus trades His life for Lazarus’s'
    key: smith-resurrection
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/resurrection'
    quote: 'Thus, in terms of the narrative there is a very real sense in which Jesus trades his own life for Lazarus’s life'
  - where: christ
    claim: 'Caiaphas’s words carry a further meaning that applies to the Atonement'
    key: judd-caiaphas-prophecy
    url: 'https://rsc.byu.edu/behold-lamb-god/interpreting-caiaphass-prophecy-saviors-death'
    quote: 'But Christians like John can, in hindsight, look at the statement and detect further meaning that applies to the Atonement.'
  - where: christ
    claim: 'Those who have faith in Christ need never experience spiritual death, separation from God'
    key: huntsman-preludes-last-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/preludes-jesuss-last-week'
    quote: 'those who have faith in Christ will never need to experience spiritual death, or separation from God.'
  - where: explore
    claim: 'Judd’s study of Caiaphas’s prophecy'
    key: judd-caiaphas-prophecy
    url: 'https://rsc.byu.edu/behold-lamb-god/interpreting-caiaphass-prophecy-saviors-death'
    quote: 'In this chapter, I will examine this important issue.'
  - where: explore
    claim: 'Preludes to Jesus’s Last Week reads John 11:1–12:11 as preparation for Holy Week'
    key: huntsman-preludes-last-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/preludes-jesuss-last-week'
    quote: 'reading and reflecting upon Mark 8:22‒10:52 and John 11:1‒12:11 can help Latter-day Saints prepare themselves and their families for a more meaningful experience during Holy Week.'

  # ---- rows added in revision
  - where: 'note 11:9 “Twelve hours in the day”'
    claim: 'Ellicott sets the saying beside John 9:4 and the sayings on His hour'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/11.htm'
    quote: '(Comp. John 11:6; and Notes on John 2:4; John 7:30; John 8:20; John 9:4; John 12:27; John 17:1.)'
  - where: 'note 11:26 “Shall never die”'
    claim: 'In 5:24 the present tenses mean believers have eternal life now'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'By using present and present perfect tenses here, he suggests that believers have eternal life and have passed from death to life now.'
  - where: 'note 11:26 “Shall never die”'
    claim: 'Those who believe need never experience spiritual death, separation from God'
    key: huntsman-preludes-last-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/preludes-jesuss-last-week'
    quote: 'those who have faith in Christ will never need to experience spiritual death, or separation from God.'
  - where: 'note 11:51 “Caiaphas prophesied”'
    claim: 'Caiaphas’s words were a selfish attempt to protect his interests'
    key: judd-caiaphas-prophecy
    url: 'https://rsc.byu.edu/behold-lamb-god/interpreting-caiaphass-prophecy-saviors-death'
    quote: 'his “prophecy” was a selfish attempt to protect his own interests and silence the Savior.'
  - where: 'note 11:53 “From that day forth”'
    claim: 'The raising is the proximate cause of the final opposition'
    key: huntsman-preludes-last-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/preludes-jesuss-last-week'
    quote: 'Thus, in John, the raising of Lazarus is the proximate cause of final opposition to Jesus'
  - where: 'note 11:4 “Not unto death, but for the glory of God”'
    claim: 'Verse 40 may refer both to what He told Martha and to the message from Perea'
    key: talmage-jesus-christ-28
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-28?lang=eng'
    quote: 'This may have had reference both to His promise spoken to Martha in person'
  - where: christ
    claim: 'Jesus’s tears at the grave are an example of mourning with those who mourn (Mosiah 18:9)'
    key: huntsman-preludes-last-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/preludes-jesuss-last-week'
    quote: 'Jesus’s compassion at this moment provides a powerful example of the importance of mourning with those who mourn (see Mosiah 18:9).'

  # ---- rows added in the repair of parts that rested on verse-by-verse commentaries
  - where: when
    claim: 'The feast of Dedication, just before, was in winter'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/10?lang=eng'
    quote: 'And it was at Jerusalem the feast of the dedication, and it was winter.'

  - where: 'note 11:8 “Who the Jews are here”'
    claim: 'In John “the Jews” is often negative and seems to mean the leaders or a group of opponents, who meet Jesus cynically and from a distance'
    key: matson-fourth-gospel
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/fourth-gospel-expectations-jewish-messiah'
    quote: 'The expression “the Jews” (Greek hoi Ioudaioi) occurs frequently in John, often negatively. In these instances, it appears to refer to either the Jewish leadership or a specific group of opponents to Jesus. In the Fourth Gospel, this collective group always engages with Jesus cynically and often from a distance'
  - where: 'note 11:8 “Who the Jews are here”'
    claim: 'Many of the Jews who came to Mary believed (v. 45)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/11?lang=eng'
    quote: 'Then many of the Jews which came to Mary, and had seen the things which Jesus did, believed on him.'
  - where: 'note 11:8 “Who the Jews are here”'
    claim: 'Verse 54: “therefore” He walked no more openly among the Jews'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/11?lang=eng'
    quote: 'Jesus therefore walked no more openly among the Jews; but went thence unto a country near to the wilderness, into a city called Ephraim, and there continued with his disciples.'

  - where: 'note 11:16 “That we may die with him”'
    claim: 'Peter and Thomas were devoted but impulsive disciples who went on to great faith'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'Peter and Thomas were devoted but impulsive disciples: at times each slipped or questioned, but both went on to have great faith.'
  - where: 'note 11:16 “That we may die with him”'
    claim: 'Thomas means “twin,” translated in John 11:16 by the Greek Didymus'
    key: bd-thomas
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/thomas?lang=eng'
    quote: 'The name means a “twin,” and so it is translated in John 11:16 by the Greek Didymus.'

  - where: 'note 11:17 “Four days in the grave”'
    claim: 'Each day in the grave added force; after four days the conclusion that Jesus raised him was inescapable'
    key: judd-caiaphas-prophecy
    url: 'https://rsc.byu.edu/behold-lamb-god/interpreting-caiaphass-prophecy-saviors-death'
    quote: 'Certainly, each additional day that Lazarus’s body lay in the grave would have added to the force of the testimony of the Savior when He called Lazarus forth. If Jesus had arrived in Bethany immediately following Lazarus’s death and then Lazarus had come forth from the tomb alive, some of the Savior’s critics may have concluded that it was not a miracle.'
  - where: 'note 11:17 “Four days in the grave”'
    claim: 'Later Jewish traditions: the spirit stayed near the body three days and left on the fourth; this may lie behind “four days”'
    key: judd-caiaphas-prophecy
    url: 'https://rsc.byu.edu/behold-lamb-god/interpreting-caiaphass-prophecy-saviors-death'
    quote: 'There exist later Jewish traditions referring to a belief that after death the spirit of the deceased remained near the body for three days, hoping to return to life with the body, but on the fourth day the spirit departed permanently. Such a belief may lay behind the reference to Lazarus being dead for “four days”'
  - where: 'note 11:17 “Four days in the grave”'
    claim: 'It seems the sisters, for all their faith, did not look for the death to be reversed'
    key: van-dyke-miracles-john
    url: 'https://rsc.byu.edu/vol-9-no-3-2008/miracles-jesus-gospel-john'
    quote: 'It seems apparent that while Mary and Martha exercised mighty faith in Jesus, they saw no way that the death of their brother could be reversed.'

  - where: 'note 11:33 “Groaned in the spirit”'
    claim: 'The King James Version renders the same verb “straitly charged” (Matt. 9:30)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/9?lang=eng'
    quote: 'And their eyes were opened; and Jesus straitly charged them, saying, See that no man know it.'
  - where: 'note 11:33 “Groaned in the spirit”'
    claim: 'The King James Version renders the same verb “straitly charged” (Mark 1:43)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/1?lang=eng'
    quote: 'And he straitly charged him, and forthwith sent him away;'
  - where: 'note 11:33 “Groaned in the spirit”'
    claim: 'Jesus groaned in the spirit in great compassion'
    key: hales-gratitude-goodness
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1992/04/gratitude-for-the-goodness-of-god?lang=eng'
    quote: 'Jesus saw her weeping, and the Jews who came with her were also weeping. Jesus, in great compassion, “groaned in the spirit, and was troubled” (John 11:33).'
  - where: 'note 11:33 “Groaned in the spirit”'
    claim: 'His compassion caused Him to groan in the spirit before He wept'
    key: ardern-love-neighbour
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2023/10/16ardern?lang=eng'
    quote: 'When we read that “Jesus wept” (John 11:35), we are witnesses, as were Mary and Martha, of His compassion, which caused Him first to groan in the spirit and be troubled (see John 11:33).'

  - where: 'note 11:35 “Jesus wept”'
    claim: 'His weeping shows His compassion, an attribute of Christ born of love that knows no boundaries'
    key: ardern-love-neighbour
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2023/10/16ardern?lang=eng'
    quote: 'Compassion is an attribute of Christ. It is born of love for others and knows no boundaries. Jesus, the Saviour of the world, is the epitome of compassion. When we read that “Jesus wept” (John 11:35), we are witnesses, as were Mary and Martha, of His compassion'

  - where: 'note 11:42 “Father, I thank thee”'
    claim: 'Verse 42: He spoke because of the people standing by, that they might believe the Father sent Him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/11?lang=eng'
    quote: 'And I knew that thou hearest me always: but because of the people which stand by I said it, that they may believe that thou hast sent me.'
  - where: 'note 11:42 “Father, I thank thee”'
    claim: 'He could have moved the stone Himself, yet told the others to do it'
    key: bassett-after-fourth-day
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2023/04/55bassett?lang=eng'
    quote: 'With the power that the Savior had, could not He have miraculously moved the stone without effort? This would have been impressive to see and an unforgettable experience, yet He said to the others, “Take ye away the stone.”'
  - where: 'note 11:42 “Father, I thank thee”'
    claim: 'The stone, coming forth and the graveclothes needed no divine power; what the disciples could do, He told them to do'
    key: bassett-after-fourth-day
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2023/04/55bassett?lang=eng'
    quote: 'Each of these three things had something in common—none required the use of Christ’s divine power. That which His disciples could do, He instructed them to do.'
  - where: 'note 11:42 “Father, I thank thee”'
    claim: 'Only Christ could raise Lazarus; He expects us to do all we can, and He does what only He can'
    key: bassett-after-fourth-day
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2023/04/55bassett?lang=eng'
    quote: 'However, it was only the Christ who had the power and authority to raise Lazarus from the dead. My impression is that the Savior expects us to do all we can do, and He will do what only He can do.'

  - where: 'note 11:48 “Our place and nation”'
    claim: 'The council feared a riot against the leadership that would bring consequences on the temple and the Jews; Judas of Galilee had led a revolt (Acts 5:37)'
    key: judd-caiaphas-prophecy
    url: 'https://rsc.byu.edu/behold-lamb-god/interpreting-caiaphass-prophecy-saviors-death'
    quote: 'if Jesus is allowed to continue gathering followers, He may cause a riot in Jerusalem against the Jewish leadership, which in turn would lead to serious consequences against the temple and the Jews in Jerusalem. Underlying this statement is the fact that other Jewish charismatics had caused, and would yet cause, significant problems in the eyes of the Romans.'
  - where: 'note 11:48 “Our place and nation”'
    claim: 'A riot might make the Romans shut the temple; its loss would ruin Caiaphas and the Sadducee-dominated Sanhedrin'
    key: judd-caiaphas-prophecy
    url: 'https://rsc.byu.edu/behold-lamb-god/interpreting-caiaphass-prophecy-saviors-death'
    quote: 'the loss of the temple—a very profitable enterprise because of the constant receipt of tithes and offerings—would have been financially devastating to him and many other members of the Sadducee-dominated Sanhedrin.'
  - where: 'note 11:48 “Our place and nation”'
    claim: 'The council feared the Romans would take away the temple'
    key: judd-caiaphas-prophecy
    url: 'https://rsc.byu.edu/behold-lamb-god/interpreting-caiaphass-prophecy-saviors-death'
    quote: 'It is noteworthy that the Sanhedrin was concerned the Romans would take away the temple, not destroy it'

  - where: 'note 11:53 “From that day forth”'
    claim: 'Jesus withdrew to Ephraim, near the wilderness, with His disciples (v. 54)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/11?lang=eng'
    quote: 'Jesus therefore walked no more openly among the Jews; but went thence unto a country near to the wilderness, into a city called Ephraim, and there continued with his disciples.'

  - where: 'note 11:55 “To purify themselves”'
    claim: 'Men defiled by a dead body could not keep the Passover on its day'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/9?lang=eng'
    quote: 'And there were certain men, who were defiled by the dead body of a man, that they could not keep the passover on that day'
  - where: 'note 11:55 “To purify themselves”'
    claim: 'The leaders would not enter the judgment hall lest they be defiled and unable to eat the Passover'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/18?lang=eng'
    quote: 'they themselves went not into the judgment hall, lest they should be defiled; but that they might eat the passover.'
  - where: 'note 11:55 “To purify themselves”'
    claim: 'Purification meant bathing body and clothes; deeper uncleanness, such as contact with a corpse, needed a sprinkling water; some cases, offerings'
    key: bd-purification
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/purification?lang=eng'
    quote: 'Bathing the flesh and the clothes in running water was used in all and sufficed in the simplest cases. When the uncleanness was of a deeper character, a purifying water for sprinkling was provided: for example, after contact with a corpse'
  - where: 'note 11:55 “To purify themselves”'
    claim: 'In some cases sin and trespass offerings were also made'
    key: bd-purification
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/purification?lang=eng'
    quote: 'In some cases sin and trespass offerings were also made'

  # ---- rows added in review
  - where: 'note 11:6 “Why He waited two days”'
    claim: 'Burial was on the day of death; the one-day journey is a probable assumption'
    key: talmage-jesus-christ-28
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-28?lang=eng'
    quote: 'On the very probable assumption that the journey from Bethany in Judea to the place where Jesus was, in Perea, would require one day'
  - where: 'note 11:6 “Why He waited two days”'
    claim: 'It was the custom to bury on the day of death'
    key: talmage-jesus-christ-28
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-28?lang=eng'
    quote: 'It was and still is the custom in Palestine as in other oriental countries to bury on the day of death.'
  - where: 'note 11:9 “Twelve hours in the day”'
    claim: 'The working day is twelve hours; one walks in the light without stumbling; it was His day to work and He would not be deterred'
    key: talmage-jesus-christ-28
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-28?lang=eng'
    quote: 'Jesus made clear to them that He was not to be deterred from duty in the time thereof, nor should others be; for as He illustrated, the working day is twelve hours long; and during that period a man may walk without stumbling'
  - where: 'note 11:9 “Twelve hours in the day”'
    claim: 'He walks in the light; letting the hours pass and walking in darkness, one stumbles; it was His day to work'
    key: talmage-jesus-christ-28
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-28?lang=eng'
    quote: 'but if he let the hours pass and then try to walk or work in darkness, he stumbles. It was then His day to work, and He was making no mistake in returning to Judea.'
  - where: 'note 11:33 “Groaned in the spirit”'
    claim: 'The Greek expresses sorrowful indignation, not grief alone'
    key: talmage-jesus-christ-28
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-28?lang=eng'
    quote: 'All philological authorities agree that the words in the original Greek express sorrowful indignation, or as some aver, anger, and not alone a sympathetic emotion of grief.'
  - where: 'note 11:33 “Groaned in the spirit”'
    claim: 'Indignation in verse 33 may have been at the customary wailing that profaned the sisters’ grief; in verse 38 at the carping of verse 37'
    key: talmage-jesus-christ-28
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-28?lang=eng'
    quote: 'Any indignation the Lord may have felt, as intimated in verse 33, may be attributed to disapproval of the customary wailing over death, which as vented by the Jews on this occasion, profaned the real and soulful grief of Martha and Mary'
  - where: 'note 11:33 “Groaned in the spirit”'
    claim: 'Indignation in verse 38 may have been at the criticism of verse 37'
    key: talmage-jesus-christ-28
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-28?lang=eng'
    quote: 'His indignation, expressed by groaning as mentioned in verse 38, may have been due to the carping criticism uttered by some of the Jews as recorded in verse 37.'
  - where: 'note 11:48 “Our place and nation”'
    claim: '“Our place” can mean their position or the temple'
    key: huntsman-preludes-last-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/preludes-jesuss-last-week'
    quote: 'resulting in the loss of their position and the temple (both possible meanings of “our place” in 11:48)'
