chapter: 11
claims:
  # ---- when, setting, thread, plain words
  - where: when
    claim: 'Jesus spent the rest of the winter, and probably early spring, at Ephraim before the last Passover'
    key: talmage-jesus-christ-28
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-28?lang=eng'
    quote: 'Thus did our Lord spend the rest of the winter and probably the early days of the succeeding spring.'
  - where: setting
    claim: 'The raising of Lazarus is the seventh and crowning sign of the Book of Signs, showing power over death and foreshadowing His resurrection'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'The seventh and crowning miracle in the Book of Signs is the raising of Lazarus (11:38–44), showing not only Jesus’s power over death but foreshadowing his own resurrection'
  - where: setting
    claim: 'Lazarus, Mary and Martha lived in Bethany on the eastern slope of the Mount of Olives'
    key: van-dyke-miracles-john
    url: 'https://rsc.byu.edu/vol-9-no-3-2008/miracles-jesus-gospel-john'
    quote: 'Lazarus and his two sisters, Mary and Martha, made their home in Bethany on the eastern slope of the Mount of Olives near Jerusalem.'
  - where: setting
    claim: 'The Bethany episodes form a bridge between the Book of Signs and the Book of Glory'
    key: huntsman-preludes-last-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/preludes-jesuss-last-week'
    quote: 'The Bethany episodes, consisting of the story of the death and miraculous raising of Lazarus followed by a feast that Martha and Mary held for Jesus and their brother afterward, occupy a pivotal position in the Gospel of John, overlapping with and serving as a bridge between “The Book of Signs,”'
  - where: setting
    claim: 'JST John 11:2: Mary lived with Martha, in whose house Lazarus was sick'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/11?lang=eng'
    quote: 'And Mary, his sister, who anointed the Lord with ointment and wiped his feet with her hair, lived with her sister Martha, in whose house her brother Lazarus was sick.'
  - where: thread
    claim: 'The raising of Lazarus is the proximate cause of the leadership’s resolve to kill Jesus and anticipates His death and resurrection'
    key: huntsman-preludes-last-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/preludes-jesuss-last-week'
    quote: 'provides both the proximate cause of the Jerusalem leadership’s resolve to have Jesus killed even as it provides anticipations of Jesus’s coming death and resurrection'
  - where: thread
    claim: 'In the narrative Jesus trades His own life for Lazarus’s'
    key: smith-resurrection
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/resurrection'
    quote: 'Thus, in terms of the narrative there is a very real sense in which Jesus trades his own life for Lazarus’s life'
  - where: section 1 plain
    claim: '“Do well” (11:12) means be cured, saved'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/11?lang=eng'
    quote: 'be cured, saved'
  - where: section 2 plain
    claim: 'A furlong (stadium) is about 185 meters, so fifteen is under two miles'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/11?lang=eng'
    quote: 'about 185 meters'
  - where: section 3 plain
    claim: '“Groaned” renders a verb of strong inner agitation'
    key: thayer
    url: 'https://biblehub.com/greek/1690.htm'
    quote: 'to be very angry, to be moved with indignation'

  # ---- notes
  - where: 'note 11:4 “Not unto death, but for the glory of God”'
    claim: 'Lazarus’s death surprises the reader; only Jesus’s power over life and death resolves it'
    key: smith-resurrection
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/resurrection'
    quote: 'It is only the reality of Jesus’s power over life and death that can solve this problem at the heart of the story'
  - where: 'note 11:4 “Not unto death, but for the glory of God”'
    claim: 'His power over death is what shows the glory of God'
    key: smith-resurrection
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/resurrection'
    quote: 'it is Jesus’s power over death that shows “the glory of God.”'
  - where: 'note 11:4 “Not unto death, but for the glory of God”'
    claim: 'The sickness was not unto final death at that time'
    key: talmage-jesus-christ-28
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-28?lang=eng'
    quote: 'the illness of Lazarus was not unto final death at that time, but for the glory of God and that the Son of God might be glorified thereby'

  - where: 'note 11:6 “Why He waited two days”'
    claim: 'Lazarus died soon after the messenger set out'
    key: talmage-jesus-christ-28
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-28?lang=eng'
    quote: 'Lazarus had died in the interval; indeed he must have expired soon after the messenger had started with the tidings of the young man’s illness.'
  - where: 'note 11:6 “Why He waited two days”'
    claim: 'A day for the messenger, two days waiting and a day’s return make the four days'
    key: talmage-jesus-christ-28
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-28?lang=eng'
    quote: 'Lazarus must have died on the day of the messenger’s departure; for this day and the two days that elapsed before Jesus started toward Judea, and the day required for the return, would no more than cover the four days specified.'
  - where: 'note 11:6 “Why He waited two days”'
    claim: 'Verse 15 suggests the delay was deliberate, to teach'
    key: judd-caiaphas-prophecy
    url: 'https://rsc.byu.edu/behold-lamb-god/interpreting-caiaphass-prophecy-saviors-death'
    quote: 'The Savior’s statement seems to indicate that He deliberately waited in Galilee with the express intent to create a teaching moment.'
  - where: 'note 11:6 “Why He waited two days”'
    claim: 'After four days no one could doubt that the raising was a miracle'
    key: judd-caiaphas-prophecy
    url: 'https://rsc.byu.edu/behold-lamb-god/interpreting-caiaphass-prophecy-saviors-death'
    quote: 'But because four days had passed since Lazarus died, the conclusion was inescapable: Jesus had miraculously raised Lazarus from the dead.'

  - where: 'note 11:8 “Who the Jews are here”'
    claim: 'Jesus and His disciples were Jews; the expression refers to a particular group often set against Jesus'
    key: huntsman-preludes-last-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/preludes-jesuss-last-week'
    quote: 'Of course, Jesus and his disciples were themselves Jewish, but the expression seems to refer to a different group, one that is often arrayed against Jesus and depicted negatively.'
  - where: 'note 11:8 “Who the Jews are here”'
    claim: 'In this episode the group is friendly to the family and divided over Jesus'
    key: huntsman-preludes-last-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/preludes-jesuss-last-week'
    quote: 'In this episode, members of this group are friendly to Lazarus’s family and divided in their response to Jesus, some even coming to believe in him but others spurring the Jerusalem leadership to seek to have him killed.'
  - where: 'note 11:8 “Who the Jews are here”'
    claim: 'In 11:54 “the Jews” are the hostile party, though Jesus was among Jews at Ephraim'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/11.htm'
    quote: '“The Jews” are, as before, the hostile party. The passage is a good illustration of St. John’s use of the term, for He was of course among Jews, in the ordinary meaning of the word, during the sojourn at Ephraim.'

  - where: 'note 11:9 “Twelve hours in the day”'
    claim: 'The night cannot come before its hour; the day of His life has fixed limits'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/11.htm'
    quote: 'The natural night would come not until its appointed hour, until the twelve hours of the day had run their course. The day of His life is marked out by limits no less sure.'
  - where: 'note 11:9 “Twelve hours in the day”'
    claim: 'It is still day, and He and they must do the Father’s work'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/11.htm'
    quote: 'it is as yet full day, and in that day He and they must do the work which is appointed of the Father.'

  - where: 'note 11:16 “That we may die with him”'
    claim: 'JST 11:16: they feared the Jews would take Jesus and put him to death'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/11?lang=eng'
    quote: 'for they feared lest the Jews should take Jesus and put him to death, for as yet they did not understand the power of God.'
  - where: 'note 11:16 “That we may die with him”'
    claim: 'Thomas, remembered for his doubt, is here a model of love'
    key: huntsman-preludes-last-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/preludes-jesuss-last-week'
    quote: 'Thomas, who is perhaps unfairly remembered mostly for his momentary doubt following the Resurrection'
  - where: 'note 11:16 “That we may die with him”'
    claim: 'Jesus’s risking His life to return to Judea foreshadows John 15:13'
    key: huntsman-preludes-last-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/preludes-jesuss-last-week'
    quote: 'his willingness to risk his own life by returning to Judea is a foreshadowing of his later statement after the Last Supper, “Greater love hath no man than this, that a man lay down his life for his friends”'
  - where: 'note 11:16 “That we may die with him”'
    claim: 'Thomas and Didymus both mean “twin”'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/11.htm'
    quote: 'The second of these names is the Greek translation of the first, which is Hebrew. Both mean “twin.”'

  - where: 'note 11:17 “Four days in the grave”'
    claim: 'A belief of the time held that the spirit lingered near the body up to three days, so four days meant irrevocably dead'
    key: huntsman-preludes-last-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/preludes-jesuss-last-week'
    quote: 'The significance of the period seems to reflect Jewish belief at the time that the spirit of someone who had died lingered near the body for up to three days, so four days would indicate that Lazarus was irrevocably dead,'
  - where: 'note 11:17 “Four days in the grave”'
    claim: 'A greater miracle than the widow’s son or Jairus’s daughter'
    key: huntsman-preludes-last-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/preludes-jesuss-last-week'
    quote: 'making Jesus’s calling forth from the tomb a greater miracle than the raising of the son of the widow of Nain'
  - where: 'note 11:17 “Four days in the grave”'
    claim: 'Burial on the day of death'
    key: talmage-jesus-christ-28
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-28?lang=eng'
    quote: 'It was and still is the custom in Palestine as in other oriental countries to bury on the day of death.'
  - where: 'note 11:17 “Four days in the grave”'
    claim: 'His death was witnessed and he was buried in the usual way, so no one could question it'
    key: talmage-jesus-christ-28
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-28?lang=eng'
    quote: 'No question as to the actual death of Lazarus could be raised, for his demise had been witnessed, his body had been prepared and buried in the usual way, and he had lain in the grave four days.'

  - where: 'note 11:25 “I am the resurrection, and the life”'
    claim: 'Jews other than the Sadducees believed in a resurrection; Martha heard only a general assurance'
    key: talmage-jesus-christ-28
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-28?lang=eng'
    quote: 'for they, the Sadducees excepted, believed in a resurrection; and Martha failed to find in the Lord’s promise anything more than a general assurance'
  - where: 'note 11:25 “I am the resurrection, and the life”'
    claim: 'Martha had to learn that power over life and death was already committed to Jesus'
    key: talmage-jesus-christ-28
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-28?lang=eng'
    quote: 'she had to learn that unto Jesus had already been committed power over life and death.'
  - where: 'note 11:25 “I am the resurrection, and the life”'
    claim: 'She believed in the Speaker without fully understanding'
    key: talmage-jesus-christ-28
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-28?lang=eng'
    quote: 'she believed in the Speaker even while unable to fully comprehend His words.'
  - where: 'note 11:25 “I am the resurrection, and the life”'
    claim: 'Martha’s faith was general and future; Jesus ties the resurrection to Himself, specific and immediate'
    key: smith-resurrection
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/resurrection'
    quote: 'Martha has a faith in the Resurrection that is generic and future-oriented; Jesus instructs her that the Resurrection is, in some unexplained way, personally tied to him and thus specific and immediate.'
  - where: 'note 11:25 “I am the resurrection, and the life”'
    claim: 'Martha’s confession echoes Peter’s'
    key: huntsman-preludes-last-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/preludes-jesuss-last-week'
    quote: 'she responds with one of the strongest confessions in John, one that echoes versions of Peter’s apostolic confession'

  - where: 'note 11:26 “Shall never die”'
    claim: 'Since believers die, the death meant is spiritual death'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'Because many believers in Jesus die (indeed, Martha’s brother Lazarus has just died), the suggestion seems to be that the death Jesus is talking about is spiritual death,'
  - where: 'note 11:26 “Shall never die”'
    claim: 'The raising is a symbol of spiritual rebirth as well as of future resurrection'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'making the raising of Lazarus that follows this scene as much a symbol of the spiritual rebirth of people who come to Christ as it is an anticipation of a future resurrection.'
  - where: 'note 11:26 “Shall never die”'
    claim: 'Eternal life in Latter-day Saint teaching is the life God and Christ have, knowing them (17:3)'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'As Latter-day Saint doctrine teaches, it is having the kind of life that God and Christ have in their presence for eternity'

  - where: 'note 11:33 “Groaned in the spirit”'
    claim: 'The verb first means to snort, then to be very angry or moved with indignation'
    key: thayer
    url: 'https://biblehub.com/greek/1690.htm'
    quote: 'to snort in (of horses; German dareinschnauben): Aeschylus sept. 461; to be very angry, to be moved with indignation'
  - where: 'note 11:33 “Groaned in the spirit”'
    claim: 'In the moral sense it is vehement agitation of mind'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/11.htm'
    quote: 'Passing to the moral sense, it expresses disturbance of the mind—vehement agitation.'
  - where: 'note 11:33 “Groaned in the spirit”'
    claim: 'Here it is righteous indignation whose object is not named'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/11.htm'
    quote: 'point to the inner moral depth of His righteous indignation; the object of it, however, is not expressed.'
  - where: 'note 11:33 “Groaned in the spirit”'
    claim: 'The grief of the sisters and the mourners caused Him to sorrow'
    key: talmage-jesus-christ-28
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-28?lang=eng'
    quote: 'The sight of the two women so overcome by grief, and of the people wailing with them, caused Jesus to sorrow'
  - where: 'note 11:33 “Groaned in the spirit”'
    claim: 'The second groaning (v. 38) followed the unbelieving question of v. 37'
    key: talmage-jesus-christ-28
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-28?lang=eng'
    quote: 'This manifestation of malignant unbelief caused Jesus again to groan with sorrow if not indignation.'

  - where: 'note 11:35 “Jesus wept”'
    claim: 'dakryō is to shed tears silently; klaiō to weep audibly'
    key: thayer
    url: 'https://biblehub.com/greek/2799.htm'
    quote: 'strictly, δακρύω denotes to shed tears, weep silently; κλαίω to weep audibly, to cry as a child'
  - where: 'note 11:35 “Jesus wept”'
    claim: 'The word used of Mary and the mourners suggests loud wailing'
    key: huntsman-preludes-last-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/preludes-jesuss-last-week'
    quote: 'suggests loud, uncontrolled crying, even wailing, rather than the traditional translation of “weeping.”'
  - where: 'note 11:35 “Jesus wept”'
    claim: 'Knowing He would raise Lazarus, His tears show mourning with those who mourn (Mosiah 18:9)'
    key: huntsman-preludes-last-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/preludes-jesuss-last-week'
    quote: 'Even though he knows full well he is about to raise Lazarus from the dead, Jesus’s compassion at this moment provides a powerful example of the importance of mourning with those who mourn (see Mosiah 18:9).'

  - where: 'note 11:42 “Father, I thank thee”'
    claim: 'He did not ask for power but gave thanks, acknowledging the Father before the people'
    key: talmage-jesus-christ-28
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-28?lang=eng'
    quote: 'He did not ask the Father for power or authority; such had already been given Him; but He gave thanks, and in the hearing of all who stood by acknowledged the Father and expressed the oneness of His own and the Father’s purposes.'
  - where: 'note 11:42 “Father, I thank thee”'
    claim: 'What people could do (the stone, the graveclothes) He left to them'
    key: talmage-jesus-christ-28
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-28?lang=eng'
    quote: 'All that human agency could do was left to man.'

  - where: 'note 11:44 “Bound with graveclothes”'
    claim: 'Lazarus was not resurrected; he was still mortal and would die again'
    key: van-dyke-miracles-john
    url: 'https://rsc.byu.edu/vol-9-no-3-2008/miracles-jesus-gospel-john'
    quote: 'It is significant to note that Lazarus was not resurrected. He was still mortal and would eventually die again.'
  - where: 'note 11:44 “Bound with graveclothes”'
    claim: 'The graveclothes signal he would one day wear them again'
    key: van-dyke-miracles-john
    url: 'https://rsc.byu.edu/vol-9-no-3-2008/miracles-jesus-gospel-john'
    quote: 'Figuratively, it conveys to the reader that he was not leaving death behind permanently but would one day be dressed in grave clothes a second time.'
  - where: 'note 11:44 “Bound with graveclothes”'
    claim: 'Jesus’s burial clothes were left in the tomb, never to be worn again (20:6–8)'
    key: van-dyke-miracles-john
    url: 'https://rsc.byu.edu/vol-9-no-3-2008/miracles-jesus-gospel-john'
    quote: 'when Christ was resurrected, John carefully describes how Jesus’s burial clothes were left in the tomb, never to be worn again'
  - where: 'note 11:44 “Bound with graveclothes”'
    claim: 'The napkin had held the jaw in place'
    key: talmage-jesus-christ-28
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-28?lang=eng'
    quote: 'his face was still bound by the napkin by which the lifeless jaw had been held in place.'

  - where: 'note 11:48 “Our place and nation”'
    claim: 'The chief priests were mostly Sadducees'
    key: talmage-jesus-christ-28
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-28?lang=eng'
    quote: 'The chief priests, who were mostly Sadducees, and the Pharisees with them assembled in council'
  - where: 'note 11:48 “Our place and nation”'
    claim: 'They feared losing the people and that the Romans would take their “place”'
    key: talmage-jesus-christ-28
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-28?lang=eng'
    quote: 'they thought only of the possible effect of Christ’s influence in alienating the people from the established theocracy, and of the fear that the Romans, taking advantage of the situation, would deprive the hierarchs of their “place”'
  - where: 'note 11:48 “Our place and nation”'
    claim: '“Our place” can mean their position or the temple'
    key: huntsman-preludes-last-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/preludes-jesuss-last-week'
    quote: 'resulting in the loss of their position and the temple (both possible meanings of “our place” in 11:48) and their destruction as a nation.'
  - where: 'note 11:48 “Our place and nation”'
    claim: 'Pharisees in John are almost always leaders of a faction in the Jerusalem establishment'
    key: huntsman-preludes-last-week
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/preludes-jesuss-last-week'
    quote: 'some of them go and tell the Pharisees, who in John are almost always the leaders of that faction who are part of the Jerusalem establishment.'

  - where: 'note 11:51 “Caiaphas prophesied”'
    claim: 'Caiaphas was appointed high priest in AD 18'
    key: judd-caiaphas-prophecy
    url: 'https://rsc.byu.edu/behold-lamb-god/interpreting-caiaphass-prophecy-saviors-death'
    quote: 'Eventually, after deposing and appointing another high priest, Valerius Gratus appointed Joseph Caiaphas as high priest in AD 18.'
  - where: 'note 11:51 “Caiaphas prophesied”'
    claim: '“That same year” means that fatal and decisive year'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/11.htm'
    quote: 'They are used with a solemnity of meaning to express “that fatal and decisive year.”'
  - where: 'note 11:51 “Caiaphas prophesied”'
    claim: 'Josephus reports traditions that the high priest prophesied by virtue of his office'
    key: judd-caiaphas-prophecy
    url: 'https://rsc.byu.edu/behold-lamb-god/interpreting-caiaphass-prophecy-saviors-death'
    quote: 'The Jewish historian Josephus mentions traditions that say the high priest acquired the gift of prophecy simply by virtue of his position in the priesthood.'
  - where: 'note 11:51 “Caiaphas prophesied”'
    claim: 'The spirit of prophecy came on Caiaphas by virtue of his office, despite his unworthiness'
    key: talmage-jesus-christ-28
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-28?lang=eng'
    quote: 'John solemnly avers that Caiaphas spake not of himself, but by the spirit of prophecy, which, in spite of his implied unworthiness, came upon him by virtue of his office'
  - where: 'note 11:51 “Caiaphas prophesied”'
    claim: 'Some Latter-day Saint commentators reason that God spoke through the office, not the man'
    key: judd-caiaphas-prophecy
    url: 'https://rsc.byu.edu/behold-lamb-god/interpreting-caiaphass-prophecy-saviors-death'
    quote: 'some Latter-day Saint commentators have discussed possible meanings of this verse, reasoning that God spoke through the holy priesthood office rather than the unholy man.'
  - where: 'note 11:51 “Caiaphas prophesied”'
    claim: 'Caiaphas did not intend a prophecy of the Atonement'
    key: judd-caiaphas-prophecy
    url: 'https://rsc.byu.edu/behold-lamb-god/interpreting-caiaphass-prophecy-saviors-death'
    quote: 'a prophecy of the atoning sacrifice of the Savior is not what the high priest himself intended.'
  - where: 'note 11:51 “Caiaphas prophesied”'
    claim: 'Verse 52 is John’s comment, not Caiaphas’s words'
    key: judd-caiaphas-prophecy
    url: 'https://rsc.byu.edu/behold-lamb-god/interpreting-caiaphass-prophecy-saviors-death'
    quote: 'this last statement—applying the death of Jesus not only to the Jews, but to other nations—is an editorial comment and not the words of Caiaphas himself.'
  - where: 'note 11:51 “Caiaphas prophesied”'
    claim: 'Caiaphas acted from political expediency'
    key: judd-caiaphas-prophecy
    url: 'https://rsc.byu.edu/behold-lamb-god/interpreting-caiaphass-prophecy-saviors-death'
    quote: 'Caiaphas was concerned with political expediency, not with justice.'
  - where: 'note 11:51 “Caiaphas prophesied”'
    claim: 'The likeness to 1 Nephi 4:13 is more apparent than real'
    key: judd-caiaphas-prophecy
    url: 'https://rsc.byu.edu/behold-lamb-god/interpreting-caiaphass-prophecy-saviors-death'
    quote: 'The similarities between this declaration and Caiaphas’s statement are more apparent than real.'
