chapter: 2
claims:
  # ---- setting, thread
  - where: setting
    claim: 'Chapters 2–4 are a unit framed by miracles at Cana, stressing newness and new life'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'The first signs and dialogues comprise a discrete unit, framed by miracles performed in the Galilean town of Cana (2:1–4:54). These all stress the theme of newness, particularly the new life that Jesus has come to bring.'
  - where: setting
    claim: 'John names three Passovers and a feast often taken as one; the ministry lasts two or three years'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'This ministry lasts two or three years, depending on how many Passover festivals are mentioned (2:13, 6:4, and 11:55 refer specifically to Passover, but 5:1 refers to an unspecified feast often taken to be a Passover).'
  - where: setting
    claim: 'John places the cleansing at the beginning of the ministry, the Synoptics in the last week'
    key: cochran-house-of-prayer
    url: 'https://rsc.byu.edu/vol-25-no-2-2024/house-prayer-all-people'
    quote: 'The synoptic Gospels—Matthew, Mark, and Luke—each describe the cleansing of the temple during the final week of the Savior’s mortal ministry. … On the other hand, John situates the cleansing at the beginning of Christ’s ministry.'
  - where: thread
    claim: 'A traditional reading: the six jars stand for the law of Moses, fulfilled by the new life Christ offers, symbolized by the wine'
    key: huntsman-family-john
    url: 'https://rsc.byu.edu/household-god/family-god-gospel-john'
    quote: 'Traditional interpretations of this first sign have included the fulfillment of the older law of Moses, represented by the six large jars of water, by the new rich life and blessings offered by Christ, symbolized by the fine wine that replaced the water.'
  - where: thread
    claim: 'The hour at Cana points to the final sacrifice'
    key: lane-word-made-flesh
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/god-incarnate-word-made-flesh'
    quote: 'In chapter 2, at the wedding at Cana, the shift from water to wine and Jesus’s comment that “mine hour is not yet come” (John 2:4) point toward his final sacrifice because at the cross blood and water come out of his side.'
  - where: thread
    claim: 'John uses “believe” of degrees of faith from its first beginnings, as in 2:23'
    key: thayer
    url: 'https://biblehub.com/greek/4100.htm'
    quote: 'πιστεύειν is used by John of various degrees of faith, from its first beginnings, its incipient stirring within the soul, up to the fullest assurance, John 2:23 (cf. John 2:24)'
  # ---- notes
  - where: 'note 2:1 “A wedding in Cana”'
    claim: 'Jesus’s presence shows He approved of marriage; the text is silent on who bride and groom were; He was invited (eklēthē) as a guest'
    key: huntsman-family-john
    url: 'https://rsc.byu.edu/household-god/family-god-gospel-john'
    quote: 'Although there has been speculation from time to time as to the identity of the bride and bridegroom at Cana,[42] the text itself is silent as to who they were. While the narrative in John stresses that Jesus was invited (Greek eklēthē; KJV “called”), presumably as a guest'
  - where: 'note 2:1 “A wedding in Cana”'
    claim: 'At the least His presence shows He approved of marriage and was eager to celebrate it'
    key: huntsman-family-john
    url: 'https://rsc.byu.edu/household-god/family-god-gospel-john'
    quote: 'Jesus’s presence at the wedding feast held at Cana can be seen, at the very least, to show that he approved of marriage and was eager to celebrate it'
  - where: 'note 2:1 “A wedding in Cana”'
    claim: 'Mary’s position at the wedding was likely one of responsibility'
    key: talmage-jesus-christ-11
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-11?lang=eng'
    quote: 'Here again is evidence of her position of responsibility and domestic authority at the social gathering.'
  - where: 'note 2:4 “Woman, what wilt thou have me to do?”'
    claim: 'The vocative gunai is used in respect at John 2:4 and 19:26'
    key: thayer
    url: 'https://biblehub.com/greek/1135.htm'
    quote: 'γύναι, as a form of address, may be used — either in indignation, Luke 22:57; or in admiration, Matthew 15:28; or in kindness and favor, Luke 13:12; John 4:21; or in respect, John 2:4; John 19:26'
  - where: 'note 2:4 “Woman, what wilt thou have me to do?”'
    claim: 'JST 2:4: “Woman, what wilt thou have me to do for thee? that will I do; for mine hour is not yet come.”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/2?lang=eng'
    quote: 'JST John 2:4 … Woman, what wilt thou have me to do for thee? that will I do; for mine hour is not yet come.'
  - where: 'note 2:4 “Not yet His hour”'
    claim: 'At Cana the water and wine and “mine hour is not yet come” point toward the final sacrifice, where blood and water come from His side'
    key: lane-word-made-flesh
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/god-incarnate-word-made-flesh'
    quote: 'In chapter 2, at the wedding at Cana, the shift from water to wine and Jesus’s comment that “mine hour is not yet come” (John 2:4) point toward his final sacrifice because at the cross blood and water come out of his side.'
  - where: 'note 2:4 “Not yet His hour”'
    claim: 'John’s whole narrative builds up to His hour; His death in John is His glorifying'
    key: lane-word-made-flesh
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/god-incarnate-word-made-flesh'
    quote: 'John’s entire Gospel narrative builds up to his “hour,”'
  - where: 'note 2:4 “Not yet His hour”'
    claim: 'In John “glorify” signifies Jesus’s dying'
    key: lane-word-made-flesh
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/god-incarnate-word-made-flesh'
    quote: 'In the Gospel of John, the verb glorify “is used distinctively to signify the dying of Jesus.'
  - where: 'note 2:4 “Not yet His hour”'
    claim: 'The JST keeps “for mine hour is not yet come”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/2?lang=eng'
    quote: 'JST John 2:4 … Woman, what wilt thou have me to do for thee? that will I do; for mine hour is not yet come.'
  - where: 'note 2:6 “Stone jars for purifying”'
    claim: 'The jars were reservoirs for the ceremonial washings, not vessels used in the washing'
    key: talmage-jesus-christ-11
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-11?lang=eng'
    quote: 'Vessels of water were provided, as a matter of prescribed order in Jewish homes, to facilitate the ceremonial washings enjoined by the law. From these pots or jars the water was drawn off as required; they were reservoirs holding the supply'
  - where: 'note 2:6 “Stone jars for purifying”'
    claim: 'Guests washed before eating; stone was preferred because unclean pottery had to be destroyed while stone could be cleansed'
    key: van-dyke-miracles-john
    url: 'https://rsc.byu.edu/vol-9-no-3-2008/miracles-jesus-gospel-john'
    quote: 'Stone pots were preferable to ceramic because if a ceramic pot came in contact with an unclean person or substance the law required that it be destroyed (see Leviticus 6:24–28; 11:29–30; 15:12). A stone vessel, on the other hand, could be ritually cleansed and used again.'
  - where: 'note 2:6 “Stone jars for purifying”'
    claim: 'Guests cleansed themselves with water provided by the host before eating'
    key: van-dyke-miracles-john
    url: 'https://rsc.byu.edu/vol-9-no-3-2008/miracles-jesus-gospel-john'
    quote: 'Before partaking of food, guests at the feast, would ritually cleanse themselves with water provided by the host. This would require many water pots and much water.'
  - where: 'note 2:6 “Stone jars for purifying”'
    claim: 'Each jar held about eighteen to twenty-seven gallons'
    key: van-dyke-miracles-john
    url: 'https://rsc.byu.edu/vol-9-no-3-2008/miracles-jesus-gospel-john'
    quote: 'Each large pot was ritually clean and held approximately eighteen to twenty-seven gallons apiece (see John 2:6).'
  - where: 'note 2:6 “Stone jars for purifying”'
    claim: 'The “firkin” (metrētēs) was a liquid measure of somewhat less than nine English gallons'
    key: thayer
    url: 'https://biblehub.com/greek/3355.htm'
    quote: 'the name of a utensil known as an amphora, which is a species of measure used for liquids and containing 72 sextarii or ξεστοι (i. e. somewhat less than nine English gallons'
  - where: 'note 2:10 “The good wine kept until now”'
    claim: 'A traditional reading: the jars stand for the law of Moses, fulfilled by the new life Christ offers, symbolized by the wine'
    key: huntsman-family-john
    url: 'https://rsc.byu.edu/household-god/family-god-gospel-john'
    quote: 'Traditional interpretations of this first sign have included the fulfillment of the older law of Moses, represented by the six large jars of water, by the new rich life and blessings offered by Christ, symbolized by the fine wine that replaced the water.'
  - where: 'note 2:10 “The good wine kept until now”'
    claim: 'Symbolically Jesus is the groom; the prophets used marriage for the covenant; Jehovah-made-flesh came to His people; the Baptist names Him the bridegroom in 3:29'
    key: huntsman-family-john
    url: 'https://rsc.byu.edu/household-god/family-god-gospel-john'
    quote: 'With the opening of Jesus’s public ministry with the miracle at Cana, however, Jehovah-now-made-flesh had now come in person to be with his people and reconcile them to himself,[43] … In the next chapter, John the Baptist explicitly refers to Jesus as the bridegroom (John 3:29)'
  - where: 'note 2:10 “The good wine kept until now”'
    claim: 'The prophets used marital terms for the covenant, from which the Lord’s people were often separated by sin'
    key: huntsman-family-john
    url: 'https://rsc.byu.edu/household-god/family-god-gospel-john'
    quote: 'While prophecy in the Hebrew Bible frequently drew upon marital terminology to describe the covenant relationship between YHWH and his people Israel, frequently the Lord’s people were separated from him through sin and apostasy'
  - where: 'note 2:10 “The good wine kept until now”'
    claim: 'The abundant life of 10:10 is suggested by the good wine of Cana'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'abundantly (Greek, perisson) refers to a richer, deeper life such as that suggested by the good wine of Cana, the living water of Samaria, or the flowing rivers promised by Jesus.'
  - where: 'note 2:10 “The good wine kept until now”'
    claim: 'The governor of the feast was a chairman or master of ceremonies; the bridegroom was the real host'
    key: talmage-jesus-christ-11
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-11?lang=eng'
    quote: 'was made governor of the feast, or, as we say in this day, chairman, or master of ceremonies. To this functionary the new wine was first served; and he, calling the bridegroom, who was the real host'
  - where: 'note 2:11 “The first sign”'
    claim: 'John’s word is sēmeia, signs, not dynameis as in the Synoptics, because they reveal Jesus’s identity'
    key: huntsman-family-john
    url: 'https://rsc.byu.edu/household-god/family-god-gospel-john'
    quote: 'These are miraculous signs (Greek sēmeia) rather than simply miracles (Greek dynameis) as in the Synoptics because they are as much about revealing the identity and mission of Jesus as they are powerful deeds that bless the lives of those who receive them.'
  - where: 'note 2:11 “The first sign”'
    claim: 'The miracle reveals Jesus as Jehovah: the Divine Word created, the Incarnate Word reorganizes'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'The changing of water into wine at the wedding at Cana (John 2:1–11) is more than just a miracle of provision. Instead, it reveals Jesus as Jehovah. Just as the Divine Word had first created, or organized, the world, the Incarnate Word reorganizes.'
  - where: 'note 2:11 “The first sign”'
    claim: 'The miracle was done privately, seen by the servants and disciples, to manifest His glory and deepen their belief'
    key: van-dyke-miracles-john
    url: 'https://rsc.byu.edu/vol-9-no-3-2008/miracles-jesus-gospel-john'
    quote: 'However, it was performed in private and witnessed only by the servants and the disciples. One of the Savior’s intentions seems clear: He desired to manifest His glory and bring His disciples to a deeper belief in His divinity through this glorious act'
  - where: 'note 2:11 “The first sign”'
    claim: 'Latter-day Saint commenters see in the reorganizing of elements a sign that Christ was Jehovah'
    key: huntsman-family-john
    url: 'https://rsc.byu.edu/household-god/family-god-gospel-john'
    quote: 'Latter-day Saint commenters, noting that the Divine Word had created or “organized” all things (John 1:1–3), point out that the Incarnate Word’s ability to reorganize elements in this miracle, was a sign that Christ was, in fact, Jehovah.'
  - where: 'note 2:17 “The zeal of thine house”'
    claim: 'John repeatedly emphasizes Jesus’s zeal for the Father’s will: sent by the Father, glorifying Him, doing His will'
    key: cochran-house-of-prayer
    url: 'https://rsc.byu.edu/vol-25-no-2-2024/house-prayer-all-people'
    quote: 'Indeed, one of the repeated emphases in the Gospel of John is Jesus’s zeal for doing the will of his Father.'
  - where: 'note 2:18 “What sign shewest thou?”'
    claim: 'They all knew the temple needed cleansing'
    key: talmage-jesus-christ-12
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-12?lang=eng'
    quote: 'That the sacred premises were in sore need of a cleansing they all knew'
  - where: 'note 2:13 “At the start, not the end”'
    claim: 'The Synoptics put the cleansing in the last week, John at the beginning; Jesus may have cleansed the temple twice; each is at Passover'
    key: cochran-house-of-prayer
    url: 'https://rsc.byu.edu/vol-25-no-2-2024/house-prayer-all-people'
    quote: 'John situates the cleansing at the beginning of Christ’s ministry. It is possible that Jesus cleansed the temple twice during his ministry.[1] Either way, in each recounting, Jesus is visiting Jerusalem to celebrate Passover.'
  - where: 'note 2:13 “At the start, not the end”'
    claim: 'In John the cleansing comes earlier than in the Synoptics and foreshadows the death of His body'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'the cleansing of the temple, which occurs earlier in Jesus’s ministry in John than it does in the Synoptics, is less about the temple than it is a foreshadowing of the death of Jesus’s body (John 2:13–22).'
  - where: 'note 2:14 “A market in the temple courts”'
    claim: 'The Court of the Gentiles was packed at Passover with people bringing animals for inspection and paying the annual tax'
    key: cochran-house-of-prayer
    url: 'https://rsc.byu.edu/vol-25-no-2-2024/house-prayer-all-people'
    quote: 'The bustling courtyard would be packed by hundreds, if not thousands, of people bringing animals to be inspected for sacrifice, coming to pay their annual tax, or simply coming to learn from rabbinic teachers'
  - where: 'note 2:14 “A market in the temple courts”'
    claim: 'Only John has the oxen and sheep, brought for the Passover'
    key: cochran-house-of-prayer
    url: 'https://rsc.byu.edu/vol-25-no-2-2024/house-prayer-all-people'
    quote: 'in John’s account, the oxen and sheep that had also been brought in specifically for the Passover celebration (2:14).'
  - where: 'note 2:14 “A market in the temple courts”'
    claim: 'Vendors likely took advantage of pilgrims; prices of doves, meant to ease the cost for the poor, were raised'
    key: cochran-house-of-prayer
    url: 'https://rsc.byu.edu/vol-25-no-2-2024/house-prayer-all-people'
    quote: 'the point of offering doves as an acceptable sacrifice was to lessen the financial cost for the poor, not increase it (Leviticus 1:14–17; 5:7; 12:8).'
  - where: 'note 2:14 “A market in the temple courts”'
    claim: 'Vendors likely took advantage of the pilgrims and charged exorbitant prices'
    key: cochran-house-of-prayer
    url: 'https://rsc.byu.edu/vol-25-no-2-2024/house-prayer-all-people'
    quote: 'Not themselves entirely innocent, these moneychangers and animal sellers were likely taking advantage of the pilgrims and worshippers at the temple.'
  - where: 'note 2:14 “A market in the temple courts”'
    claim: 'hieron is the whole sacred enclosure with its courts, as against naos, the sanctuary'
    key: thayer
    url: 'https://biblehub.com/greek/2411.htm'
    quote: 'τό ἱερόν and ὁ ναός differ, in that the former designates the whole compass of the sacred enclosure, embracing the entire aggregate of buildings, balconies, porticos, courts'
  - where: 'note 2:15 “A whip of small cords”'
    claim: 'Only John has the scourge, likely made to drive the oxen and sheep'
    key: cochran-house-of-prayer
    url: 'https://rsc.byu.edu/vol-25-no-2-2024/house-prayer-all-people'
    quote: 'John’s inclusion of those larger animals is coupled with the unique detail that, upon seeing the scene, Jesus made a scourge of small cords—likely with the intent of driving out the oxen and sheep from the temple courtyard (v. 15).'
  - where: 'note 2:15 “A whip of small cords”'
    claim: 'Making the scourge took time, a deliberate act rather than an instinctive reaction'
    key: cochran-house-of-prayer
    url: 'https://rsc.byu.edu/vol-25-no-2-2024/house-prayer-all-people'
    quote: 'Rather than act in the moment, Jesus deliberately halted, recognizing the difficulty of moving great numbers of large animals without a tool of the trade. His creation of the scourge likely required some gathering of cords from his disciples or the area nearby'
  - where: 'note 2:15 “A whip of small cords”'
    claim: 'He did not throw down the doves’ cages but told their sellers to take them away'
    key: cochran-house-of-prayer
    url: 'https://rsc.byu.edu/vol-25-no-2-2024/house-prayer-all-people'
    quote: 'Rather than throw down or assault the cages, Christ displayed “tender regard for the imprisoned and helpless birds,” reflecting a deliberate and thoughtful approach to his task.'
  - where: 'note 2:17 “The zeal of thine house”'
    claim: 'Psalm 69 shows David set apart by his zeal for God and for a sanctuary; John shows Jesus set apart in the same way; Jesus’s zeal to do the Father’s will is a repeated emphasis in John'
    key: cochran-house-of-prayer
    url: 'https://rsc.byu.edu/vol-25-no-2-2024/house-prayer-all-people'
    quote: 'By referencing this specific psalm, John illustrated that Jesus was also set apart from his peers owing to his enthusiastic love of God and his desire to create a sanctuary for the worship of his Father.'
  - where: 'note 2:17 “The zeal of thine house”'
    claim: 'The psalm recounts how David was viewed by his contemporaries because of his zeal for God and for a sanctuary'
    key: cochran-house-of-prayer
    url: 'https://rsc.byu.edu/vol-25-no-2-2024/house-prayer-all-people'
    quote: 'the entire psalm recounts just how different David was viewed by his contemporaries because of his enthusiasm for God and his unfulfilled zeal for building a sanctuary or temple for his God.'
  - where: 'note 2:18 “What sign shewest thou?”'
    claim: '“The Jews” here are the priestly officials and rulers; they asked for credentials of His authority'
    key: talmage-jesus-christ-12
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-12?lang=eng'
    quote: 'The Jews, by which term we mean the priestly officials and rulers of the people, dared not protest this vigorous action on the ground of unrighteousness'
  - where: 'note 2:18 “What sign shewest thou?”'
    claim: 'They questioned only why He took their duty on Himself, and asked for credentials'
    key: talmage-jesus-christ-12
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-12?lang=eng'
    quote: 'the one point upon which they dared to question the Cleanser was as to why He should thus take to Himself the doing of what was their duty.'
  - where: 'note 2:18 “What sign shewest thou?”'
    claim: 'John records their concern with His authority rather than His actions'
    key: cochran-house-of-prayer
    url: 'https://rsc.byu.edu/vol-25-no-2-2024/house-prayer-all-people'
    quote: 'John does not record that the chief priests were concerned with Christ’s actions, but rather focused on whether he has the authority to do so.'
  - where: 'note 2:19 “The temple of His body”'
    claim: 'naos is the sanctuary itself, the Holy place and Holy of holies; Thayer lists John 2:19'
    key: thayer
    url: 'https://biblehub.com/greek/3485.htm'
    quote: 'ναός, ναοῦ, ὁ (ναίω to dwell), the Sept. for הֵיכָל, used of the temple at Jerusalem, but only of the sacred edifice (or sanctuary) itself, consisting of the Holy place and the Holy of holies'
  - where: 'note 2:19 “The temple of His body”'
    claim: 'The temple of 2:14 is hieron'
    key: greek-nt
    url: 'https://biblehub.com/texts/john/2-14.htm'
    quote: 'καὶ εὗρεν ἐν τῷ ἱερῷ τοὺς πωλοῦντας βόας'
  - where: 'note 2:19 “The temple of His body”'
    claim: 'The temple of 2:19 is naos'
    key: greek-nt
    url: 'https://biblehub.com/texts/john/2-19.htm'
    quote: 'Λύσατε τὸν ναὸν τοῦτον καὶ ἐν τρισὶν ἡμέραις ἐγερῶ αὐτόν.'
  - where: 'note 2:20 “Forty and six years”'
    claim: 'Herod proposed the rebuilding in his 18th year (17 B.C.); the sanctuary took a year and a half; work went on through Jesus’s life and was finished only in A.D. 64'
    key: bd-temple-of-herod
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-herod?lang=eng'
    quote: 'To win popularity with the Jews, Herod, in the 18th year (17 B.C.) of his reign, proposed to rebuild the temple of Zerubbabel.'
  - where: 'note 2:20 “Forty and six years”'
    claim: 'The work continued through Jesus’s life until A.D. 64, six years before the temple’s destruction'
    key: bd-temple-of-herod
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-herod?lang=eng'
    quote: 'The temple proper was built by the priests themselves in a year and six months. … The work was proceeding all through our Lord’s earthly life, and the design was not complete till the year A.D. 64, only six years before the temple’s final destruction.'
  - where: 'note 2:24 “He did not entrust Himself”'
    claim: '“Believed” (2:23) and “commit” (2:24) are the same verb, pisteuō; transitively it means to entrust, with John 2:24 cited'
    key: thayer
    url: 'https://biblehub.com/greek/4100.htm'
    quote: '2. transitively, τίνι τί, to intrust a thing to one, i. e. to his fidelity : Luke 16:11; ἑαυτόν τίνι, John 2:24'
  - where: 'note 2:24 “He did not entrust Himself”'
    claim: 'John uses pisteuō of faith from its first beginnings, citing 2:23'
    key: thayer
    url: 'https://biblehub.com/greek/4100.htm'
    quote: 'πιστεύειν is used by John of various degrees of faith, from its first beginnings, its incipient stirring within the soul, up to the fullest assurance, John 2:23 (cf. John 2:24)'
  - where: 'note 2:24 “He did not entrust Himself”'
    claim: '“Believed” in 2:23 is episteusan'
    key: greek-nt
    url: 'https://biblehub.com/texts/john/2-23.htm'
    quote: 'πολλοὶ ἐπίστευσαν εἰς τὸ ὄνομα αὐτοῦ, θεωροῦντες αὐτοῦ τὰ σημεῖα ἃ ἐποίει'
  - where: 'note 2:24 “He did not entrust Himself”'
    claim: '“Commit” in 2:24 is the same verb, episteuen'
    key: greek-nt
    url: 'https://biblehub.com/texts/john/2-24.htm'
    quote: 'αὐτὸς δὲ Ἰησοῦς οὐκ ἐπίστευεν αὑτὸν αὐτοῖς'
  # ---- christ
  - where: christ
    claim: 'The water made wine and “mine hour is not yet come” have been read as pointing toward His final sacrifice'
    key: lane-word-made-flesh
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/god-incarnate-word-made-flesh'
    quote: 'In chapter 2, at the wedding at Cana, the shift from water to wine and Jesus’s comment that “mine hour is not yet come” (John 2:4) point toward his final sacrifice because at the cross blood and water come out of his side.'
  - where: christ
    claim: 'His humanity made His death possible; His divinity made it glorious and redemptive'
    key: lane-word-made-flesh
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/god-incarnate-word-made-flesh'
    quote: 'Jesus’s humanity made his death possible and his divinity made his death glorious and redemptive.'
  - where: christ
    claim: 'Jesus’s zeal was to restore the temple’s purpose of communion with God in His dwelling place'
    key: cochran-house-of-prayer
    url: 'https://rsc.byu.edu/vol-25-no-2-2024/house-prayer-all-people'
    quote: 'Jesus needed to restore the temple’s purpose of enabling communion with God in his dwelling place'
