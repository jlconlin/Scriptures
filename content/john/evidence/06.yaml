    url: 'https://rsc.byu.edu/celebrating-easter/bread-life-sermon'
    quote: 'Jesus’s followers, collectively referred to as “his disciples” (v. 61), do not reject the idea of a divine Son who came down from heaven: they accept who Jesus is. Indeed the Twelve had a particular testimony of this.'
  - where: 'note 6:70 “One of you is a devil”'
