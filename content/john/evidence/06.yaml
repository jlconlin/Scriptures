  - where: 'note 6:41 “The Jews murmured”'
    claim: 'The crowd and the followers were Jews; “the Jews” here a specific group, generally taken as the religious leadership, national or local'
    key: huntsman-bread-of-life
    url: 'https://rsc.byu.edu/celebrating-easter/bread-life-sermon'
    quote: 'Clearly “the Jews” who are the target of Jesus’s harsher words here are a specific group, generally regarded as the religious and political leadership who increasingly opposed Him during His ministry.'
  - where: 'note 6:41 “The Jews murmured”'
    claim: 'The crowd and the followers were all Jewish; “the Jews” here the national or local leadership'
    key: huntsman-bread-of-life
    url: 'https://rsc.byu.edu/celebrating-easter/bread-life-sermon'
    quote: 'His own followers, whom He will speak to in the final part of the discourse, were all Jewish. … “the Jews” of verses 41 and 52 include either the national leadership or the local aristocracy and religious leaders.'
