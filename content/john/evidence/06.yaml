    url: 'https://biblehub.com/greek/1228.htm'
    quote: 'The name διάβολος is figuratively applied to a man who, by opposing the cause of God, may be said to act the part of the devil or to side with him: John 6:70, cf. Matthew 16:23; Mark 8:33.'
  - where: 'note 6:70 “One of you is a devil”'
