    quote: 'It appears that even the Twelve were unable to comprehend the deeper meaning of these latest teachings; they were puzzled, though none actually deserted. … Though they were unable to comprehend in fulness the doctrine, they knew Jesus to be the Christ'
  - where: 'note 6:68 “To whom shall we go?”'
    claim: 'The disciples accepted who Jesus is; the Twelve had a particular testimony'
