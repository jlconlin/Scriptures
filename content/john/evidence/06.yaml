    url: 'https://rsc.byu.edu/celebrating-easter/bread-life-sermon'
    quote: 'Associating the two miracle stories of John 6—the feeding of the five thousand (John 6:5–15; parallels Matthew 14:13–21; Mark 6:33–44; Luke 9:11–17) and Jesus’s walking on water (John 6:16–21; parallels Matthew 14:22–36; Mark 6:47–51)—with the Passover helps establish the imagery of the Bread of Life sermon.'
