chapter: 6
claims:
  - where: setting
    claim: 'The feeding of the five thousand is the only miracle in all four Gospels'
    key: brown-testimony-luke
    url: 'https://byustudies.byu.edu/online-book/the-testimony-of-luke/luke-chapter-9-104'
    quote: 'The feeding of the five thousand is the only miracle common to all four New Testament Gospels.'
  - where: setting
    claim: 'John names three Passovers; the ministry lasts two or three years depending on whether 5:1 is a Passover'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'This ministry lasts two or three years, depending on how many Passover festivals are mentioned (2:13, 6:4, and 11:55 refer specifically to Passover, but 5:1 refers to an unspecified feast often taken to be a Passover).'
  - where: setting
    claim: 'Three audiences: the crowd (26–40), “the Jews” (41–59), the disciples and the Twelve (60–71); each misunderstood; John omits the institution of the sacrament'
    key: huntsman-bread-of-life
    url: 'https://rsc.byu.edu/celebrating-easter/bread-life-sermon'
    quote: 'the Gospel of John strikingly omits any reference to the institution of the sacrament in its account of the Last Supper in John 13–14. … Each of these groups misunderstood in some way either who Jesus was or what His mission was'
  - where: thread
    claim: 'The crowd took the feeding as the sign of a king and wanted more bread; Jesus moved them beyond manna and loaves'
    key: huntsman-bread-of-life
    url: 'https://rsc.byu.edu/celebrating-easter/bread-life-sermon'
    quote: 'the crowd’s desire for more bread betrays a worldly conception of a Messiah whose primary purposes are not only to deliver them politically but also to provide for their temporal needs.'
  - where: thread
    claim: 'Many fell away at the hard saying; the effect was sifting'
    key: talmage-jesus-christ-21
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-21?lang=eng'
    quote: 'Many deserted Him, and from that time sought Him no more. The occasion was crucial; the effect was that of sifting and separation.'
  - where: 'note 6:4 “The Passover was nigh”'
    claim: 'Mountain and wilderness echo Israel’s wilderness after the first Passover and Sinai'
    key: sc-knowhy-664
    url: 'https://scripturecentral.org/knowhy/why-did-jesus-use-passover-imagery-in-his-bread-of-life-sermon'
    quote: 'This mountain-wilderness context echoes the wilderness through which the children of Israel wandered after the very first Passover as well as Mount Sinai, where they received the law of Moses (Exodus 12:11–13; 19:1–3).'
  - where: 'note 6:4 “The Passover was nigh”'
    claim: 'Walking on the sea recalls the Red Sea crossing'
    key: sc-knowhy-664
    url: 'https://scripturecentral.org/knowhy/why-did-jesus-use-passover-imagery-in-his-bread-of-life-sermon'
    quote: 'Jesus miraculously crossed the Sea of Galilee by literally walking upon it (John 6:19)—akin to the Israelites traversing through the Red Sea on dry ground (Exodus 14:21–22). … Jesus’s direct control over the elements showed that He possessed power typically attributed to Jehovah'
  - where: 'note 6:4 “The Passover was nigh”'
    claim: 'Unlike other Passovers in John, Jesus does not attend in Jerusalem; the setting associates the scene with the final Passover'
    key: huntsman-bread-of-life
    url: 'https://rsc.byu.edu/celebrating-easter/bread-life-sermon'
    quote: 'Unlike other Passovers in John, in this instance Jesus does not attend the festival in Jerusalem. … it does associate this scene closely with the final Passover of Jesus’s ministry.'
  - where: 'note 6:4 “The Passover was nigh”'
    claim: 'The Paschal Lamb, whose blood warded off death and whose flesh was eaten, connects to the flesh and blood words'
    key: huntsman-bread-of-life
    url: 'https://rsc.byu.edu/celebrating-easter/bread-life-sermon'
    quote: 'connects this flesh and blood symbolism directly to the original discourse that Jesus delivered—namely, the Paschal Lamb which was sacrificed so that its blood would ward off death and whose flesh was eaten in a festive meal.'
  - where: 'note 6:7 “Two hundred pennyworth”'
    claim: 'The penny is the denarius, a silver coin, the pay of a workman'
    key: thayer
    url: 'https://biblehub.com/greek/1220.htm'
    quote: 'a denarius, a silver coin … John 6:7 … the pay of a denarius apiece promised to each workman, Matthew 20:10'
  - where: 'note 6:7 “Two hundred pennyworth”'
    claim: 'A penny a day for laborers'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/20?lang=eng'
    quote: 'And when he had agreed with the labourers for a penny a day, he sent them into his vineyard.'
  - where: 'note 6:9 “A lad''s barley loaves”'
    claim: 'Likely the boy’s lunch, all he had; the fish probably cured or pickled'
    key: van-dyke-miracles-john
    url: 'https://rsc.byu.edu/vol-9-no-3-2008/miracles-jesus-gospel-john'
    quote: 'It was all the boy had. The food was likely the boy’s lunch: the small fishes were probably cured with salt or were pickled.'
  - where: 'note 6:9 “A lad''s barley loaves”'
    claim: 'Creative power; leftovers exceeded the original store; a lesson against waste; barley bread and fish the food of the poor'
    key: talmage-jesus-christ-21
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-21?lang=eng'
    quote: 'It was a manifestation of creative power … The broken but unused portion exceeded in bulk and weight the whole of the original little store. Our Lord’s direction to gather up the fragments was an impressive object-lesson against waste … Barley bread and fish constituted the usual food of the poorer classes of the region.'
  - where: 'note 6:14 “That prophet”'
    claim: 'The crowd recognized Jesus as the new Moses, the prophet of Deut. 18:15'
    key: sc-knowhy-664
    url: 'https://scripturecentral.org/knowhy/why-did-jesus-use-passover-imagery-in-his-bread-of-life-sermon'
    quote: 'Having witnessed this miracle, many present clearly recognized Jesus as a “new Moses,” stating that “this is of a truth that prophet that should come into the world” who would be like Moses (John 6:14; as prophesied in Deuteronomy 18:15).'
  - where: 'note 6:14 “That prophet”'
    claim: 'The risen Lord: I am he of whom Moses spake'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/20?lang=eng'
    quote: 'Behold, I am he of whom Moses spake, saying: A prophet shall the Lord your God raise up unto you of your brethren, like unto me'
  - where: 'note 6:14 “That prophet”'
    claim: 'The Church’s footnote links the miracle of John 6:14 to 3 Ne. 20:7'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/6?lang=eng'
    quote: '14a “miracle”: 3 Ne. 8:1; 20:7 (1–9)'
  - where: 'note 6:15 “To make him a king”'
    claim: 'Political messianic expectations since the Maccabees; the walk on the water shows He was far more than a king'
    key: huntsman-bread-of-life
    url: 'https://rsc.byu.edu/celebrating-easter/bread-life-sermon'
    quote: 'Whereas the feeding miracle could be interpreted too narrowly, as a sign that Jesus was only a messianic king, His walking on the water and miraculous completion of the sea voyage serves as a sign that He was far more.'
  - where: 'note 6:15 “To make him a king”'
    claim: 'Expectations of a political ruler who would deliver from Herodian rule and Rome'
    key: huntsman-bread-of-life
    url: 'https://rsc.byu.edu/celebrating-easter/bread-life-sermon'
    quote: 'at least since the time of the Maccabees, have suffered an overly political interpretation which actually presented a false Christology of who the Messiah would be—a political ruler—and what He would do—deliver them from Herodian rule and Roman occupation.'
  - where: 'note 6:15 “To make him a king”'
    claim: 'My kingdom is not of this world'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/18?lang=eng'
    quote: 'Jesus answered, My kingdom is not of this world'
  - where: 'note 6:20 “It is I”'
    claim: '“It is I” is ego eimi, “I AM,” as in Exodus 3:14, identifying Jesus as the God of the Old Testament'
    key: sc-knowhy-664
    url: 'https://scripturecentral.org/knowhy/why-did-jesus-use-passover-imagery-in-his-bread-of-life-sermon'
    quote: 'The beginning of Jesus’s statement uses the Greek words for “I AM” (ego eimi); thus He was not saying “It is I” but “I AM, be not afraid.” This same expression was spoken by Jehovah to Moses'
  - where: 'note 6:20 “It is I”'
    claim: 'The Greek of 6:20'
    key: greek-nt
    url: 'https://biblehub.com/texts/john/6-20.htm'
    quote: 'ὁ δὲ λέγει αὐτοῖς· Ἐγώ εἰμι, μὴ φοβεῖσθε.'
  - where: 'note 6:20 “It is I”'
    claim: 'Job 9:8: God alone treads the waves; ego eimi'
    key: keller-jesus-jehovah
    url: 'https://rsc.byu.edu/jesus-christ-son-god-savior/jesus-jehovah-yhwh'
    quote: 'Job states that it is God “which alone spreadeth out the heavens, and treadeth upon the waves of the sea” (Job 9:8). More definite, however, than this allusion is another clue in the text itself. Jesus said, “It is I,” in Greek, ego eimi.'
  - where: 'note 6:26 “Why they sought Him”'
    claim: 'The crowd wanted bread without effort; Jesus’s answer is about whom they must believe'
    key: swift-bread-life-dialogue
    url: 'https://rsc.byu.edu/how-new-testament-came-be/bread-life-discourse-dialogue'
    quote: 'His reply is not about what the crowd of people has to do, but in whom they must believe. The crowd’s reply reveals that they are still interested in what they experienced the previous night with the miraculous feeding—they want bread without effort.'
  - where: 'note 6:27 “Him hath God the Father sealed”'
    claim: 'sphragizō: to seal, for security, to hide, to mark, to confirm; at John 6:27 to prove by testimony that one is what he professes'
    key: thayer
    url: 'https://biblehub.com/greek/4972.htm'
    quote: 'in order to prove, confirm, or attest a thing; hence, tropically, to confirm, authenticate, place beyond doubt (a written document τῷ δακτυλίῳ, Esther 8:8): … τινα, to prove by one''s testimony to a person that he is what he professes to be, John 6:27.'
  - where: 'note 6:30 “What sign shewest thou?”'
    claim: 'The crowd still wants food and tries to make Jesus prove God sent Him; “evermore give us this bread” probably still means manna-like bread'
    key: swift-bread-life-dialogue
    url: 'https://rsc.byu.edu/how-new-testament-came-be/bread-life-discourse-dialogue'
    quote: 'it is probable that they are still thinking of the manna they have asked about and assume that the “true bread from heaven” will feed them literally as the manna had fed their ancestors.'
  - where: 'note 6:30 “What sign shewest thou?”'
    claim: 'The discourse returns to its beginning: more than the manna they sought'
    key: swift-bread-life-dialogue
    url: 'https://rsc.byu.edu/how-new-testament-came-be/bread-life-discourse-dialogue'
    quote: 'He brings the discourse back to its beginning, teaching how what He has to offer is so much more than the manna they sought.'
  - where: 'note 6:30 “What sign shewest thou?”'
    claim: 'Manna for forty years'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/16?lang=eng'
    quote: 'And the children of Israel did eat manna forty years, until they came to a land inhabited'
  - where: 'note 6:33 “He which cometh down”'
    claim: 'ho katabainōn can be “he who comes down” or “that which came down”; the crowd may have heard the law'
    key: huntsman-bread-of-life
    url: 'https://rsc.byu.edu/celebrating-easter/bread-life-sermon'
    quote: 'the Greek for “he which cometh down” (ho katabainōn) is ambiguous because ho katabainōn can either be taken substantively as “he who comes down” or in agreement with the preceding “bread” (artos) as “that which came down.”'
  - where: 'note 6:33 “He which cometh down”'
    claim: 'Eating God’s word in the prophets; later Jewish understanding of manna as Torah; Deut. 8:3'
    key: huntsman-bread-of-life
    url: 'https://rsc.byu.edu/celebrating-easter/bread-life-sermon'
    quote: 'Old Testament images of eating and drinking, wherein God’s people eat His word (see Jeremiah 15:16; Exekiel 2:8, 3:1), specifically established food as a metaphor for spiritual sustenance. The later Jewish understanding that manna represented the Torah, or Law'
  - where: 'note 6:33 “He which cometh down”'
    claim: 'Identifying Himself as the Bread of Life corrected the idea that He was a new lawgiver'
    key: huntsman-bread-of-life
    url: 'https://rsc.byu.edu/celebrating-easter/bread-life-sermon'
    quote: 'By identifying Himself as the Bread of Life, He corrected the idea that He was a new prophet and giver of law in the mode of Moses.'
  - where: 'note 6:33 “He which cometh down”'
    claim: 'The Greek of 6:33'
    key: greek-nt
    url: 'https://biblehub.com/texts/john/6-33.htm'
    quote: 'ὁ γὰρ ἄρτος τοῦ θεοῦ ἐστιν ὁ καταβαίνων ἐκ τοῦ οὐρανοῦ καὶ ζωὴν διδοὺς τῷ κόσμῳ.'
  - where: 'note 6:35 “I am the bread of life”'
    claim: 'Seven predicated “I am” sayings, equating Jesus with a title or symbol of His divine role; bread of life the first'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'in seven instances Jesus uses the expression to equate himself with a Christological title or symbol, such as “I am the bread of life” (John 6:35) or “I am the good shepherd” (10:11, 14), that are reflective of his divine role'
  - where: 'note 6:35 “I am the bread of life”'
    claim: 'Nothing more basic than bread and water'
    key: gong-bread-of-life
    url: 'https://rsc.byu.edu/vol-18-no-3-2017/i-am-bread-life'
    quote: 'There is nothing more basic, more essential, or more universal than bread and water.'
  - where: 'note 6:35 “I am the bread of life”'
    claim: 'At Bountiful the Lord gave bread and wine miraculously and promised the partakers should never hunger nor thirst; a sacramental promise fulfilled'
    key: gong-bread-of-life
    url: 'https://rsc.byu.edu/vol-18-no-3-2017/i-am-bread-life'
    quote: 'He promises that those who ate of the bread and wine to their soul “shall never hunger nor thirst, but shall be filled.”'
  - where: 'note 6:35 “I am the bread of life”'
    claim: 'The sacrament at Bountiful as the fulfillment of the sacramental promise'
    key: gong-bread-of-life
    url: 'https://rsc.byu.edu/vol-18-no-3-2017/i-am-bread-life'
    quote: 'This is fulfillment of the great sacramental promise to men and women in all ages'
  - where: 'note 6:35 “I am the bread of life”'
    claim: '3 Ne. 20:8 text'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/20?lang=eng'
    quote: 'He that eateth this bread eateth of my body to his soul; and he that drinketh of this wine drinketh of my blood to his soul; and his soul shall never hunger nor thirst, but shall be filled.'
  - where: 'note 6:41 “The Jews murmured”'
    claim: 'The audience shifts from the multitude to “the Jews”; sharper tone; perhaps the synagogue; a new, more hostile audience'
    key: huntsman-bread-of-life
    url: 'https://rsc.byu.edu/celebrating-easter/bread-life-sermon'
    quote: 'While members of the multitude and certainly many of Jesus’s disciples may have followed Him into the synagogue and heard this second part of His discourse, the sudden change of tone and markedly sharper rhetoric in verses 41–59 strongly suggests that Jesus is focusing His attention on a new, more hostile audience.'
  - where: 'note 6:41 “The Jews murmured”'
    claim: 'Naming Joseph shows they understood the claim; the murmuring echoes Israel’s in the Exodus; “your fathers … are dead” takes on significance'
    key: huntsman-bread-of-life
    url: 'https://rsc.byu.edu/celebrating-easter/bread-life-sermon'
    quote: 'Their emphasis on Jesus’s presumed parentage suggests that they fully understood the implications of the claim that Jesus had come down from heaven. … its murmuring echoes the murmuring of the children of Israel against both Moses and the Lord during the Exodus'
  - where: 'note 6:41 “The Jews murmured”'
    claim: 'In John “the Jews” has more to do with lack of receptivity than with national or religious identity'
    key: strathearn-johannine-dialogues
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/johannine-christology-through-lens-three-its-dialogues'
    quote: 'even this early in John’s Gospel, the term “Jews” has more to do with a lack of receptivity to Jesus than it does with national or religious identity'
  - where: 'note 6:41 “The Jews murmured”'
    claim: 'Ex. 16:8: your murmurings are against the Lord'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/16?lang=eng'
    quote: 'your murmurings are not against us, but against the Lord.'
  - where: 'note 6:44 “Except the Father draw him”'
    claim: 'Verse 45 quotes the Septuagint of Isaiah 54:13'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/6.htm'
    quote: 'The immediate reference is to the LXX. translation of Isaiah 54:13'
  - where: 'note 6:44 “Except the Father draw him”'
    claim: 'JST John 6:44 in the appendix'
    key: jst-john-6
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-john/6?lang=eng'
    quote: 'No man can come unto me, except he doeth the will of my Father who hath sent me. And this is the will of him who hath sent me, that ye receive the Son; for the Father beareth record of him; and he who receiveth the testimony, and doeth the will of him who sent me, I will raise up in the resurrection of the just.'
  - where: 'note 6:44 “Except the Father draw him”'
    claim: 'JST 6:65, 6:40 and 6:54 in the footnotes'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/6?lang=eng'
    quote: 'JST John 6:65 … except he doeth the will of my Father who hath sent me.'
  - where: 'note 6:44 “Except the Father draw him”'
    claim: 'D&C 76: John 5:29 given as the resurrection of the just'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/76?lang=eng'
    quote: 'we came to the twenty-ninth verse of the fifth chapter of John, which was given unto us as follows'
  - where: 'note 6:52 “How can this man give us his flesh?”'
    claim: 'The hearers understood the words only literally'
    key: christofferson-living-bread
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2017/10/the-living-bread-which-came-down-from-heaven?lang=eng'
    quote: 'The Savior’s intended meaning was totally lost on His hearers who understood His statement only literally.'
  - where: 'note 6:52 “How can this man give us his flesh?”'
    claim: 'Blood prohibition sharpened the rejection'
    key: huntsman-bread-of-life
    url: 'https://rsc.byu.edu/celebrating-easter/bread-life-sermon'
    quote: 'Given biblical injunctions against consuming blood,[23] the addition of “drinketh my blood” sharpened the rejection from “the Jews,” but this is vital for correctly understanding Jesus’s teaching here.'
  - where: 'note 6:52 “How can this man give us his flesh?”'
    claim: 'Flesh and blood means a living mortal body; the discourse focuses on the Crucifixion'
    key: huntsman-bread-of-life
    url: 'https://rsc.byu.edu/celebrating-easter/bread-life-sermon'
    quote: 'the phrase “flesh and blood” consistently refers to living, albeit mortal, bodies … the Bread of Life discourse seems to focus on His Crucifixion.'
  - where: 'note 6:52 “How can this man give us his flesh?”'
    claim: 'Lev. 17:10 forbids eating blood'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/17?lang=eng'
    quote: 'that eateth any manner of blood; I will even set my face against that soul that eateth blood'
  - where: 'note 6:56 “Dwelleth in me, and I in him”'
    claim: 'A striking way of expressing how completely the Savior is brought into one’s life, to be one'
    key: christofferson-living-bread
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2017/10/the-living-bread-which-came-down-from-heaven?lang=eng'
    quote: 'To eat His flesh and drink His blood is a striking way of expressing how completely we must bring the Savior into our life—into our very being—that we may be one.'
  - where: 'note 6:56 “Dwelleth in me, and I in him”'
    claim: 'First meaning: receiving the power and blessings of His Atonement'
    key: christofferson-living-bread
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2017/10/the-living-bread-which-came-down-from-heaven?lang=eng'
    quote: 'we partake of His flesh and drink His blood when we receive from Him the power and blessings of His Atonement.'
  - where: 'note 6:56 “Dwelleth in me, and I in him”'
    claim: 'Further meaning: internalizing His character; pursuing holiness'
    key: christofferson-living-bread
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2017/10/the-living-bread-which-came-down-from-heaven?lang=eng'
    quote: 'figuratively eating His flesh and drinking His blood has a further meaning, and that is to internalize the qualities and character of Christ, putting off the natural man'
  - where: 'note 6:56 “Dwelleth in me, and I in him”'
    claim: 'To eat and drink means to pursue holiness'
    key: christofferson-living-bread
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2017/10/the-living-bread-which-came-down-from-heaven?lang=eng'
    quote: 'To eat the flesh and drink the blood of Christ means to pursue holiness.'
  - where: 'note 6:56 “Dwelleth in me, and I in him”'
    claim: 'The bread and water represent His flesh and blood; the broken bread recalls His torn flesh'
    key: christofferson-living-bread
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2017/10/the-living-bread-which-came-down-from-heaven?lang=eng'
    quote: 'The bread and water represent the flesh and blood of Him who is the Bread of Life and the Living Water, poignantly reminding us of the price He paid to redeem us. As the bread is broken, we remember the Savior’s torn flesh.'
  - where: 'note 6:56 “Dwelleth in me, and I in him”'
    claim: 'John omits the institution of the sacrament; D&C 20:40 calls the emblems the flesh and blood'
    key: huntsman-bread-of-life
    url: 'https://rsc.byu.edu/celebrating-easter/bread-life-sermon'
    quote: 'see also Doctrine and Covenants 20:40, which refers to “administering the bread and wine—the emblems of the flesh and blood.”'
  - where: 'note 6:63 “The spirit that quickeneth”'
    claim: '“Quickeneth” means “giveth life”'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/6.htm'
    quote: '“It is the spirit that giveth life . . . the words . . . are spirit and are life.”'
  - where: 'note 6:63 “The spirit that quickeneth”'
    claim: 'The ascension implied; only through the Spirit could they comprehend'
    key: talmage-jesus-christ-21
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-21?lang=eng'
    quote: 'His ascension, which was to follow His death and resurrection, is here definitely implied. The spiritual significance of His teachings was put beyond question by the explanation that only through the Spirit could they comprehend'
  - where: 'note 6:66 “Many went back”'
    claim: 'The disciples accept who Jesus is but cannot accept that He came to die'
    key: huntsman-bread-of-life
    url: 'https://rsc.byu.edu/celebrating-easter/bread-life-sermon'
    quote: 'many of the disciples do not understand or cannot accept what Jesus has come to do as it is represented by “flesh and blood” passages of the sermon—namely that He has come to die for His people.'
  - where: 'note 6:66 “Many went back”'
    claim: 'Parallels the Twelve’s reaction to the predictions of His suffering'
    key: huntsman-bread-of-life
    url: 'https://rsc.byu.edu/celebrating-easter/bread-life-sermon'
    quote: 'The general reaction of the disciples here parallels the reaction of the Twelve to Jesus when He began to teach them more directly that He must go to Jerusalem to suffer and die, as told in the synoptics.'
  - where: 'note 6:66 “Many went back”'
    claim: 'Those who left had professed some belief; the Baptist’s fan; chaff blown aside'
    key: talmage-jesus-christ-21
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-21?lang=eng'
    quote: 'Whose fan is in his hand, and he will thoroughly purge his floor, and gather his wheat into the garner; but he will burn up the chaff with unquenchable fire.” The fan was in operation, and much chaff was blown aside.'
  - where: 'note 6:66 “Many went back”'
    claim: 'Not alone the hostile, but those with some belief fell away'
    key: talmage-jesus-christ-21
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-21?lang=eng'
    quote: 'Not alone critical Jews of the official class, whose hostility was openly avowed, but those who had professed some measure of belief in Him were affected.'
  - where: 'note 6:66 “Many went back”'
