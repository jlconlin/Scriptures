    url: 'https://rsc.byu.edu/how-new-testament-came-be/bread-life-discourse-dialogue'
    quote: 'This is an example of what Alter referred to as a time when the dialogue is broken off sharply, with anticipated rejoinders withheld.'
  - where: 'note 6:68 “To whom shall we go?”'
