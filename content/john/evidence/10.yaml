chapter: 10
claims:
  - where: setting
    claim: 'Tabernacles (7:2) fell toward the end of September; a few months later came the Feast of Dedication, Hanukkah, with the good shepherd sermon between them'
    key: judd-other-sheep
    url: 'https://rsc.byu.edu/they-shall-grow-together/good-shepherd-his-other-sheep-john-10-3-nephi-15-16'
    quote: 'This journey must have been toward the end of September because the “feast of tabernacles was at hand” (7:2). … A few months later, “it was winter” and time for “the feast of the dedication” (10:22), or in other words, Hanukkah.'
  - where: setting
    claim: 'The nearest audience named is the Pharisees of 9:40; the leaders’ treatment of the healed man prompted the talk of good and bad shepherds'
    key: judd-other-sheep
    url: 'https://rsc.byu.edu/they-shall-grow-together/good-shepherd-his-other-sheep-john-10-3-nephi-15-16'
    quote: 'The hostile reaction of the Jewish leaders toward the healed man in John 9:24–34 seems to provide an impetus for the Savior’s discussion of good and bad shepherds. In addition, the most proximate identification of an audience for the sermon is the reference to “some of the Pharisees” (v. 40)'
  - where: setting
    claim: 'Placing the sermon between the two festivals makes sense of its connections before and after'
    key: judd-other-sheep
    url: 'https://rsc.byu.edu/they-shall-grow-together/good-shepherd-his-other-sheep-john-10-3-nephi-15-16'
    quote: 'The proposal that John presents Jesus’s sermon on the Good Shepherd as having taken place sometime between the two festivals helps make better sense of the literary connections that both precede and follow the discourse.'
  - where: setting
    claim: 'The good shepherd discourse is one of the discourses given in Jerusalem, often to hostile crowds, in the section of signs and discourses at the Jewish feasts'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'The Discourses on the Divine Son (5:17–47), the Life-Giving Spirit (7:16–52), the Light of the World (8:12–59), and the Good Shepherd (10:1–18) were delivered in Jerusalem, often to hostile crowds'
  - where: thread
    claim: 'The sheep know the shepherd by hearing his voice, as the man born blind heard Jesus before he saw Him'
    key: judd-other-sheep
    url: 'https://rsc.byu.edu/they-shall-grow-together/good-shepherd-his-other-sheep-john-10-3-nephi-15-16'
    quote: 'Jesus says that they know him not from sight but specifically because they hear him and recognize his voice (see vv. 3–4). This describes the experience of the man who was born blind.'
  - where: thread
    claim: 'The healed man in effect asked the leaders whether they would hear Jesus and be His sheep; they refused'
    key: judd-other-sheep
    url: 'https://rsc.byu.edu/they-shall-grow-together/good-shepherd-his-other-sheep-john-10-3-nephi-15-16'
    quote: 'the healed man’s question to the Jewish leaders was essentially “Will ye hear him and be his sheep?” Their answer was an emphatic no'
  - where: thread
    claim: 'At the Feast of Dedication Jesus speaks again of sheep who hear His voice, to what seems the same audience'
    key: judd-other-sheep
    url: 'https://rsc.byu.edu/they-shall-grow-together/good-shepherd-his-other-sheep-john-10-3-nephi-15-16'
    quote: 'Jesus spoke of other sheep who hear his voice while he was at the temple during Hanukkah (see 10:26–27), a conversation that assumes the same audience who heard the earlier sermon.'
  - where: 'note 10:1 “The sheepfold and the thief”'
    claim: 'A sheepfold was an open-air pen with low stone walls where the flock was kept at night; it was entered by the gate kept by the porter, or by climbing the wall'
    key: judd-other-sheep
    url: 'https://rsc.byu.edu/they-shall-grow-together/good-shepherd-his-other-sheep-john-10-3-nephi-15-16'
    quote: '“sheepfold” (v. 1), or sheep pen—an open-air enclosure typically consisting of low walls made with field stones where the flock would have been corralled at night for protection. … guarded by “the porter” (v. 3), or gatekeeper. … The other way was to climb over the wall.'
  - where: 'note 10:1 “The sheepfold and the thief”'
    claim: 'The fold might hold sheep of several flocks, and the shepherd calls only his own'
    key: judd-other-sheep
    url: 'https://rsc.byu.edu/they-shall-grow-together/good-shepherd-his-other-sheep-john-10-3-nephi-15-16'
    quote: 'The phrase “his own sheep” may presuppose that within the sheep pen are sheep from different flocks of the local community, and the shepherd calls for only the sheep that belong to him.'
  - where: 'note 10:1 “The sheepfold and the thief”'
    claim: 'By day a shepherd led his flock to food and water and protected it; at night he led it into a cave or fold'
    key: pike-shepherd
    url: 'https://rsc.byu.edu/celebrating-easter/jesus-great-shepherd-king'
    quote: 'At night, shepherds often led their sheep into a cave or a “fold,” a minicorral often built against the side of a hill, to keep the sheep from straying and to protect them from danger.'
  - where: 'note 10:3 “By name”'
    claim: 'The main point is that sheep and shepherd know each other, recalling Isaiah 43:1'
    key: judd-other-sheep
    url: 'https://rsc.byu.edu/they-shall-grow-together/good-shepherd-his-other-sheep-john-10-3-nephi-15-16'
    quote: 'But the main point, as some scholars have concluded, is that “the sheep and shepherd know each other.”[20] Though it is not quoted directly in this parable, such an intimate relationship between shepherd and sheep recalls these words of Jehovah in the book of Isaiah'
  - where: 'note 10:3 “By name”'
    claim: 'The blind man heard Jesus’s voice and obeyed before he could see Him'
    key: judd-other-sheep
    url: 'https://rsc.byu.edu/they-shall-grow-together/good-shepherd-his-other-sheep-john-10-3-nephi-15-16'
    quote: 'When he initially encountered the Savior, he did not see Jesus, but he heard his voice, followed his instructions, and as a result “came seeing” (9:7).'
  - where: 'note 10:7 “The door of the sheep”'
    claim: 'Jesus is the only legitimate way in and out of the fold; Jacob’s gatekeeper (2 Ne. 9:41) makes both door and porter the Savior'
    key: judd-other-sheep
    url: 'https://rsc.byu.edu/they-shall-grow-together/good-shepherd-his-other-sheep-john-10-3-nephi-15-16'
    quote: 'Jesus is the only legitimate means by which his sheep may enter the protection of the sheep pen and exit in order to safely find food'
  - where: 'note 10:7 “The door of the sheep”'
    claim: 'Applying Jacob’s words, both the door and the porter represent the Savior'
    key: judd-other-sheep
    url: 'https://rsc.byu.edu/they-shall-grow-together/good-shepherd-his-other-sheep-john-10-3-nephi-15-16'
    quote: 'Thus, applying Jacob’s statement to the parable, both “the door” (John 10:9) or gate to the sheepfold and “the porter” (v. 3) or gatekeeper represent the Savior himself.'
  - where: 'note 10:7 “The door of the sheep”'
    claim: 'The footnote to “door” points to John 14:6'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/10?lang=eng'
    quote: 'John 14:6 (4–7)'
  - where: 'note 10:8 “Thieves and robbers”'
    claim: 'The Joseph Smith Translation reads “who testified not of me are thieves”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/10?lang=eng'
    quote: 'who testified not of me are thieves'
  - where: 'note 10:8 “Thieves and robbers”'
    claim: 'Some later scribes dropped “all” or “before me,” apparently to protect Abraham, Moses and John the Baptist; Jesus condemned leaders who do not point to Him, as the JST makes plain'
    key: judd-other-sheep
    url: 'https://rsc.byu.edu/they-shall-grow-together/good-shepherd-his-other-sheep-john-10-3-nephi-15-16'
    quote: 'some later scribes who were possibly wishing to protect the reputation of such notable past leaders as Abraham, Moses, and John the Baptist … omitted either the word all or the phrase “before me” from the text.'
  - where: 'note 10:8 “Thieves and robbers”'
    claim: 'The JST supports reading the thieves as leaders who did not testify of Jesus'
    key: judd-other-sheep
    url: 'https://rsc.byu.edu/they-shall-grow-together/good-shepherd-his-other-sheep-john-10-3-nephi-15-16'
    quote: 'This interpretation is supported by the Joseph Smith Translation, where the Savior clarifies that these illegitimate leaders “testified not of me” (JST John 10:8).'
  - where: 'note 10:10 “Life more abundantly”'
    claim: '“Abundantly” is perisson, “to an extent remarkable or extraordinary,” a richer, deeper life now that anticipates everlasting life'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'Meaning “to an extent remarkable or extraordinary,” abundantly (Greek, perisson) refers to a richer, deeper life such as that suggested by the good wine of Cana, the living water of Samaria, or the flowing rivers promised by Jesus.'
  - where: 'note 10:10 “Life more abundantly”'
    claim: 'It is a spiritual quality of life on earth that anticipates everlasting life'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'It suggests a spiritual quality of life here on the earth that anticipates the everlasting life'
  - where: 'note 10:11 “The good shepherd”'
    claim: '“Good” here is kalos, not agathos: noble or genuine, the model of what a shepherd should be'
    key: judd-other-sheep
    url: 'https://rsc.byu.edu/they-shall-grow-together/good-shepherd-his-other-sheep-john-10-3-nephi-15-16'
    quote: 'The typical Greek word translated as “good” in the New Testament is agathos, but in this case the word is kalos and may be better translated as “noble” or “genuine.”'
  - where: 'note 10:11 “The good shepherd”'
    claim: 'A shepherd dying seems to defeat his purpose, but Jesus’s death is the way He protects the sheep'
    key: judd-other-sheep
    url: 'https://rsc.byu.edu/they-shall-grow-together/good-shepherd-his-other-sheep-john-10-3-nephi-15-16'
    quote: 'One might think it would make better sense to say that a good shepherd is willing to die for his sheep, because a dead shepherd cannot protect the flock any longer.'
  - where: 'note 10:11 “The good shepherd”'
    claim: 'By calling Himself the good shepherd, Jesus identified Himself with Jehovah, the shepherd of Psalm 23'
    key: pike-shepherd
    url: 'https://rsc.byu.edu/celebrating-easter/jesus-great-shepherd-king'
    quote: 'Jesus proclaimed during His mortal ministry that He was “the good shepherd [poimēn]” (John 10:14), thus making a specific identification: He and Jehovah were the same being, the same Shepherd.'
  - where: 'note 10:11 “The good shepherd”'
    claim: 'The leaders would not have objected to a compassionate shepherd; the royal and divine sense of the title troubled them'
    key: pike-shepherd
    url: 'https://rsc.byu.edu/celebrating-easter/jesus-great-shepherd-king'
    quote: 'the Jewish leaders, who would have found nothing offensive or inflammatory in Jesus’s claims to be a compassionate person who was willing to give up His life. It was the royal and divine dimensions of the symbolism of the title “Shepherd” that was so troublesome to them.'
  - where: 'note 10:11 “The good shepherd”'
    claim: 'Ezekiel’s promised shepherd “David” is read by Latter-day Saints as the Messiah'
    key: pike-shepherd
    url: 'https://rsc.byu.edu/celebrating-easter/jesus-great-shepherd-king'
    quote: 'Most Christians, and certainly Latter-day Saints, accept these as messianic prophecies about the future deliverer of Israel, of whom the shepherd-turned-king David was a tragically flawed “type.”'
  - where: 'note 10:12 “The hireling and the wolf”'
    claim: 'The sermon is read in light of Ezekiel 34’s bad shepherds and of the leaders’ treatment of the healed man'
    key: judd-other-sheep
    url: 'https://rsc.byu.edu/they-shall-grow-together/good-shepherd-his-other-sheep-john-10-3-nephi-15-16'
    quote: 'numerous scholars have proposed that it should be read in light of Jehovah’s pronouncements upon bad shepherds in Ezekiel 34 as well as the Jewish leaders’ treatment of the healed man in John 9.'
  - where: 'note 10:12 “The hireling and the wolf”'
    claim: 'Like Ezekiel’s shepherds, the leaders neglected the sick sheep and cast the healed man out'
    key: judd-other-sheep
    url: 'https://rsc.byu.edu/they-shall-grow-together/good-shepherd-his-other-sheep-john-10-3-nephi-15-16'
    quote: 'Thus, just like the leaders in the days of the prophet Ezekiel, these self-proclaimed shepherds of Israel were also neglecting the sick and diseased sheep'
  - where: 'note 10:12 “The hireling and the wolf”'
    claim: 'The hirelings were hired hands, not shepherds to whom the sheep belonged'
    key: judd-other-sheep
    url: 'https://rsc.byu.edu/they-shall-grow-together/good-shepherd-his-other-sheep-john-10-3-nephi-15-16'
    quote: 'They were not really shepherds to whom the sheep belonged and whom the sheep trusted, but rather “hirelings,” or hired hands, who “careth not for the sheep” (John 10:12–13).'
  - where: 'note 10:16 “Other sheep”'
    claim: 'The risen Lord told the Nephites they were among the other sheep; the Nephites belonged to the lost tribes'
    key: sc-knowhy-207
    url: 'https://scripturecentral.org/knowhy/why-did-jesus-say-that-there-were-other-sheep-who-would-hear-his-voice'
    quote: 'When He appeared to the Nephites, He told them that they were among the “other sheep” that must be brought into the fold (3 Nephi 15:21). The Nephites were actually part of some of the tribes that were “lost.”'
  - where: 'note 10:16 “Other sheep”'
    claim: 'On this verse the Book of Mormon explains the New Testament'
    key: sc-knowhy-207
    url: 'https://scripturecentral.org/knowhy/why-did-jesus-say-that-there-were-other-sheep-who-would-hear-his-voice'
    quote: 'Scholars are divided on what John 10:16 actually means, so this is one occasion when the Book of Mormon can help readers to understand the New Testament, rather than the other way around.'
  - where: 'note 10:16 “Other sheep”'
    claim: 'The first hearers took it to mean the Gentiles, as many modern scholars still do'
    key: judd-other-sheep
    url: 'https://rsc.byu.edu/they-shall-grow-together/good-shepherd-his-other-sheep-john-10-3-nephi-15-16'
    quote: '“And they understood me not, for they supposed it had been the Gentiles” (3 Nephi 15:22). This is, as was mentioned above, the standard conclusion of modern scholarship as well.'
  - where: 'note 10:18 “Power to lay it down”'
    claim: 'The footnote glosses “power” as authority, full power'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/10?lang=eng'
    quote: 'GR authority, full power'
  - where: 'note 10:18 “Power to lay it down”'
    claim: 'The chapter heading: He gained power over death from His Father'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/10?lang=eng'
    quote: 'He gained power over death from His Father'
  - where: 'note 10:18 “Power to lay it down”'
    claim: 'Jesus had power over the life and death of His body and gave up His life only when His work in the flesh was done'
    key: ostler-divine-nature
    url: 'https://rsc.byu.edu/jesus-christ-son-god-savior/divine-nature-jesus-christ-during-mortality'
    quote: 'When Christ fulfilled all that He was to accomplish in the flesh, and only then, He gave up His mortal life. His spirit had complete control over His body.'
  - where: 'note 10:18 “Power to lay it down”'
    claim: 'His spirit, by the power of the Father, raised His body (2 Ne. 2:8; Morm. 7:5)'
    key: ostler-divine-nature
    url: 'https://rsc.byu.edu/jesus-christ-son-god-savior/divine-nature-jesus-christ-during-mortality'
    quote: 'Hence, the spirit of Jesus Christ, by the power of the Father, raised His body from the tomb three days after He breathed His last mortal breath while on the cross at Calvary.'
  - where: 'note 10:19 “A division among the Jews”'
    claim: '“Again” recalls the division of 9:16'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/10.htm'
    quote: 'The words carry us back to those of John 9:16, where a like division was noted.'
  - where: 'note 10:19 “A division among the Jews”'
    claim: 'In 9:16 some Pharisees condemned Jesus while others asked how a sinner could do such miracles'
    key: judd-other-sheep
    url: 'https://rsc.byu.edu/they-shall-grow-together/good-shepherd-his-other-sheep-john-10-3-nephi-15-16'
    quote: 'Evidently not everyone was against Jesus, however, because we are told that others responded by asking, “How can a man that is a sinner do such miracles?” (v. 16).'
  - where: 'note 10:19 “A division among the Jews”'
    claim: 'The Pharisees of 9:40 were present through the discourse, and “the Jews” is here applied to them'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/10.htm'
    quote: 'The Pharisees are mentioned before, and they are the persons who have been present all through this discourse. (Comp. John 9:40.) The wider word is here, and in John 9:18, applied to them.'
  - where: 'note 10:22 “The Feast of the Dedication”'
    claim: 'The feast was instituted under Judas Maccabaeus for the rededication of the altar after Antiochus Epiphanes profaned the temple; eight days, like Tabernacles, with lights'
    key: bd-feasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/feasts?lang=eng'
    quote: 'The Feast of the Dedication was instituted in the days of Judas Maccabaeus to commemorate the dedication of the new altar of burnt offering after the profanation of the temple and the old altar by Antiochus Epiphanes.'
  - where: 'note 10:22 “The Feast of the Dedication”'
    claim: 'It was kept like Tabernacles, with a general illumination that gave it the name Feast of Lights'
    key: bd-feasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/feasts?lang=eng'
    quote: 'It was kept like the Feast of Tabernacles with great gladness and with the bearing of the branches of palms and of other trees. There was also a general illumination, from which circumstance the feast received the name Feast of Lights.'
  - where: 'note 10:22 “The Feast of the Dedication”'
    claim: 'Eight days from 25 Kislev, in parts of November and December; “winter” shows it is the Maccabean feast'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/10.htm'
    quote: 'It extended over eight days, beginning on the 25th of the month Kisleu, which answers to parts of our November and December.'
  - where: 'note 10:22 “The Feast of the Dedication”'
    claim: 'The feast of the dedication is Hanukkah'
    key: judd-other-sheep
    url: 'https://rsc.byu.edu/they-shall-grow-together/good-shepherd-his-other-sheep-john-10-3-nephi-15-16'
    quote: '“it was winter” and time for “the feast of the dedication” (10:22), or in other words, Hanukkah.'
  - where: 'note 10:23 “Solomon’s porch”'
    claim: 'A long colonnaded porch along the Court of the Gentiles, probably the Royal Stoa'
    key: seely-temple-herod
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/temple-herod'
    quote: 'Along the south wall (some believe along the east wall) of this court was a long colonnaded porch forming a basilica-like room running east and west with rows of 162 beautiful columns with Corinthian capitals. Called the Royal Stoa, it is probably Solomon’s porch of the New Testament (John 10:23).'
  - where: 'note 10:23 “Solomon’s porch”'
    claim: 'It was a covered cloister; the winter and His walking there explain each other'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/10.htm'
    quote: 'It was rather a cloister or arcade than what we usually call a porch. … The fact that it was winter, and the fact that He was walking in this covered cloister or crypt, explain each other.'
  - where: 'note 10:24 “Kept in suspense”'
    claim: 'The Greek of the question is literally “How long do you lift up our soul?” (psychē with airō)'
    key: greek-nt
    url: 'https://biblehub.com/texts/john/10-24.htm'
    quote: 'Ἕως πότε τὴν ψυχὴν ἡμῶν αἴρεις; εἰ σὺ εἶ ὁ χριστός, εἰπὲ ἡμῖν παρρησίᾳ.'
  - where: 'note 10:24 “Kept in suspense”'
    claim: 'Airō means to lift up; with the soul, the idiom in John 10:24 means to hold the mind in suspense between doubt and hope'
    key: thayer
    url: 'https://biblehub.com/greek/142.htm'
    quote: 'to raise upward, elevate, lift up … τήν ψυχήν, to raise the mind … in John 10:24 to hold the mind in suspense between doubt and hope'
  - where: 'note 10:24 “Kept in suspense”'
    claim: 'They ask Him to tell them plainly; within a few verses they take up stones again'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/10?lang=eng'
    quote: 'If thou be the Christ, tell us plainly. … Then the Jews took up stones again to stone him.'
  - where: 'note 10:30 “One”'
    claim: 'The Greek of 10:30 has hen, “one”'
    key: greek-nt
    url: 'https://biblehub.com/texts/john/10-30.htm'
    quote: 'ἐγὼ καὶ ὁ πατὴρ ἕν ἐσμεν.'
  - where: 'note 10:30 “One”'
    claim: 'To be one here means to be united most closely in will and spirit, as in John 17'
    key: thayer
    url: 'https://biblehub.com/greek/1520.htm'
    quote: 'ἐν εἶναι, to be united most closely (in will, spirit), John 10:30; John 17:11, 21-23'
  - where: 'note 10:30 “One”'
    claim: 'The Father and the Son are separate persons, one in purpose and in every eternal aspect except one substance'
    key: holland-only-true-god
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2007/10/the-only-true-god-and-jesus-christ-whom-he-hath-sent?lang=eng'
    quote: 'We believe these three divine persons constituting a single Godhead are united in purpose, in manner, in testimony, in mission.'
  - where: 'note 10:30 “One”'
    claim: 'One in every significant and eternal aspect except one substance'
    key: holland-only-true-god
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2007/10/the-only-true-god-and-jesus-christ-whom-he-hath-sent?lang=eng'
    quote: 'I think it is accurate to say we believe They are one in every significant and eternal aspect imaginable except believing Them to be three persons combined in one substance'
  - where: 'note 10:34 “Ye are gods”'
    claim: 'If scripture calls beings other than Jehovah gods, the charge fails, and “Son of God” is the lesser claim; the irony is that Jesus is God made flesh'
    key: frederick-ot-in-nt-gospels
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/use-old-testament-new-testament-gospels'
    quote: 'how can the Jews condemn him for “making himself God” when their own scriptures apply the title of “God” to beings other than Jehovah? Even more so, Jesus argues that he is simply the “Son of God,”'
  - where: 'note 10:34 “Ye are gods”'
    claim: 'The irony: Jesus actually is God made flesh'
    key: frederick-ot-in-nt-gospels
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/use-old-testament-new-testament-gospels'
    quote: 'The irony, of course, lost on most of his audience is that Jesus actually is God made flesh, as John’s prologue so carefully establishes (cf. John 1:1-3).'
  - where: 'note 10:41 “John did no sign”'
    claim: 'The King James “miracle” is John’s word sēmeion, a sign that reveals something about Jesus'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'Although this word is usually translated simply as “miracle” in our King James Version, the Greek word choice emphasizes that in the Fourth Gospel the miracles are primarily signs that reveal something about Jesus himself.'
  - where: 'note 10:41 “John did no sign”'
    claim: 'The Baptist came as a witness (John 1:7), and baptized at Bethabara beyond Jordan (John 1:28)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/1?lang=eng'
    quote: 'The same came for a witness, to bear witness of the Light'
  - where: christ
    claim: 'Hearing Him means hearing and heeding, in the scriptures and the temple'
    key: nelson-hear-him
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2020/04/45nelson?lang=eng'
    quote: 'To hearken means to “hear Him”—to hear what the Savior says and then to heed His counsel.'
  - where: christ
    claim: 'We can hear Him in the scriptures and in the temple'
    key: nelson-hear-him
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2020/04/45nelson?lang=eng'
    quote: 'We can also hear Him in the temple.'
  - where: christ
    claim: 'We can go to the scriptures to hear Him'
    key: nelson-hear-him
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2020/04/45nelson?lang=eng'
