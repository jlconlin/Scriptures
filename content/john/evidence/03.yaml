chapter: 3
claims:
  - where: setting
    claim: 'Nicodemus appears to have been among those who believed at the first Passover when they saw the signs'
    key: strathearn-johannine-dialogues
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/johannine-christology-through-lens-three-its-dialogues'
    quote: 'Nicodemus appears to have been among those who had “believed” (Greek, episteusan) when they saw the miracles Jesus performed during the first Passover of his ministry (John 2:23; compare 3:2).'
  - where: setting
    claim: 'The dialogue with Nicodemus is the Gospel’s first extended discourse; he is mentioned three times, all in John'
    key: strathearn-johannine-dialogues
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/johannine-christology-through-lens-three-its-dialogues'
    quote: 'Jesus’s dialogue with Nicodemus “is the first extended discourse in the Fourth Gospel.”[7] We know little about the man himself. He is mentioned only three times in the New Testament, all of which are in John’s Gospel.'
  - where: setting
    claim: 'Nicodemus was a member of the Sanhedrin'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/3?lang=eng'
    quote: 'This testimony of Jesus was given to a member of the Sanhedrin.'
  - where: setting
    claim: 'The ministries of the Baptist and Jesus overlap in John 3'
    key: larsen-baptism-nt
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/baptism-new-testament'
    quote: 'In John 3, we see that the ministries of the Baptist and Jesus overlap.'
  - where: setting
    claim: 'Moses 6:59–60 takes up John 3’s water and spirit and adds blood'
    key: bradshaw-bowen-born-again
    url: 'https://interpreterfoundation.org/journal/by-the-blood-ye-are-sanctified-the-symbolic-salvific-interrelated-additive-retrospective-and-anticipatory-nature-of-the-ordinances-of-spiritual-rebirth-in-john-3-and-moses-6'
    quote: 'In chapter 3 of the Gospel of John, Jesus described spiritual rebirth as consisting of two parts: being “born of water and of the spirit.”1 To this requirement … Moses 6:59–60 adds that one must “be cleansed by blood'
  - where: setting
    claim: 'Book of Mormon prophets used the brazen serpent as a symbol for Christ'
    key: sc-knowhy-657
    url: 'https://scripturecentral.org/knowhy/why-did-jesus-compare-himself-to-the-brazen-serpent'
    quote: 'Several Book of Mormon prophets also used the brazen serpent as a symbol for Jesus Christ.'

  - where: thread
    claim: 'The word for “again” in 3:3 is the word for “from above” in 3:31'
    key: strathearn-johannine-dialogues
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/johannine-christology-through-lens-three-its-dialogues'
    quote: 'The Greek word translated as “again” is anōthen. While it can refer to a repeated action, it is the same word used later in chapter 3 to describe Jesus as being “from above” (3:31; 19:11)'
  - where: thread
    claim: 'Nicodemus stands for the teachers who speak of the earth; only the Son who came down can teach heavenly things'
    key: strathearn-johannine-dialogues
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/johannine-christology-through-lens-three-its-dialogues'
    quote: 'The definite article suggests that Nicodemus represents all the teachers of Israel who “speaketh of the earth.” It is not just he who fails to understand.'
  - where: thread
    claim: '“By night” sets Nicodemus within John’s light and darkness, taken up again in 3:19–21'
    key: strathearn-johannine-dialogues
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/johannine-christology-through-lens-three-its-dialogues'
    quote: 'This phrase is more important than just indicating time. The contrast between light and darkness is an important theme frequently woven throughout John’s narrative.'
  - where: thread
    claim: 'At the burial Nicodemus comes into the light, the lifting up fulfilled'
    key: huntsman-lamb-of-god
    url: 'https://rsc.byu.edu/behold-lamb-god/lamb-god-unique-aspects-passion-narrative-john'
    quote: 'Now, with the fulfillment on the cross of the prophecy that Jesus had made to Nicodemus that he would see the Son of Man lifted up (see John 3:14; 8:28), Nicodemus comes into the light as one who loved Jesus'

  - where: section 1 plain
    claim: '“Again” (anōthen) also means “from above”'
    key: thayer
    url: 'https://biblehub.com/greek/509.htm'
    quote: 'John 3:3, 7 ἄνωθεν γεννηθῆναι, where others explain it from above, i. e. from heaven.'
  - where: section 2 plain
    claim: 'The Greek of 3:10 reads “the teacher of Israel”'
    key: strathearn-johannine-dialogues
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/johannine-christology-through-lens-three-its-dialogues'
    quote: 'Jesus responds to Nicodemus, “Art thou the teacher [Greek, ho didaskalos] of Israel, and knowest not these things?” (3:10; my translation).'

  - where: 'note 3:1 “A ruler of the Jews”'
    claim: 'The Sanhedrin was the highest Jewish court, of seventy-one members from the chief priests, scribes and elders'
    key: gs-sanhedrin
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/sanhedrin?lang=eng'
    quote: 'The Jewish senate and the highest Jewish court in both civil and ecclesiastical matters. The Sanhedrin consisted of seventy-one members drawn from among the chief priests, scribes, and elders.'
  - where: 'note 3:1 “A ruler of the Jews”'
    claim: 'Jesus’s testimony here was given to a member of the Sanhedrin'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/3?lang=eng'
    quote: 'This testimony of Jesus was given to a member of the Sanhedrin.'
  - where: 'note 3:1 “A ruler of the Jews”'
    claim: 'Nicodemus is a representative of the leadership; “the Jews” in John has more to do with a lack of receptivity than with national identity'
    key: strathearn-johannine-dialogues
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/johannine-christology-through-lens-three-its-dialogues'
    quote: 'Clearly he is someone of stature in the Jewish community, a representative of the leadership … even this early in John’s Gospel, the term “Jews” has more to do with a lack of receptivity to Jesus than it does with national or religious identity'

  - where: 'note 3:2 “By night”'
    claim: 'Night may have been the only time for a private conversation amid Passover crowds, after the public cleansing of the temple'
    key: sandstrom-nicodemus
    url: 'https://rsc.byu.edu/vol-9-no-3-2008/nicodemus-coward-convert'
    quote: 'An opportunity to have that personal conversation with Jesus in or around Jerusalem during Passover would likely have been available only at night especially after the very public cleansing of the temple.'
  - where: 'note 3:2 “By night”'
    claim: 'Other explanations than cowardice: a private conversation away from the crowds, a cautious investigation'
    key: sandstrom-nicodemus
    url: 'https://rsc.byu.edu/vol-9-no-3-2008/nicodemus-coward-convert'
    quote: 'Besides cowardice, there are other possible explanations why Nicodemus would seek an audience with Jesus at night. He may have had a sincere desire to have a serious private conversation away from the crowded, county-fair atmosphere of the Passover-choked streets'
  - where: 'note 3:2 “By night”'
    claim: 'John’s light and darkness, from the prologue; Nicodemus not yet ready to confess openly; 3:19–21; identified at the burial as the one who came by night'
    key: strathearn-johannine-dialogues
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/johannine-christology-through-lens-three-its-dialogues'
    quote: 'Thus, while Nicodemus seems to have been genuinely intrigued by Jesus’s miracles, the narrative indicates that he was not yet ready to openly confess and give his loyalty to Jesus. He still valued the things of the world'

  - where: 'note 3:2 “A teacher come from God”'
    claim: '“Rabbi … a teacher come from God” is a respectful but partial confession; at 1:49 “Rabbi” is joined to “Son of God”'
    key: strathearn-johannine-dialogues
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/johannine-christology-through-lens-three-its-dialogues'
    quote: 'His use of the title rabbi is certainly a title of respect, used by others in John’s Gospel (see John 1:38, 49; 6:25). But it is “a partial confession of faith.”'
  - where: 'note 3:2 “A teacher come from God”'
    claim: 'Jesus did not trust the belief of those at the Passover (2:24)'
    key: strathearn-johannine-dialogues
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/johannine-christology-through-lens-three-its-dialogues'
    quote: 'He records that Jesus did not reciprocate the trust (Greek, episteusan) of the believers who were at the Passover “because he knew all men” (2:24).'
  - where: 'note 3:2 “A teacher come from God”'
    claim: 'Jesus wants Nicodemus to move from spectator of miracles to one who enters the kingdom'
    key: strathearn-johannine-dialogues
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/johannine-christology-through-lens-three-its-dialogues'
    quote: 'He wants Nicodemus to transition from being a spectator watching Jesus’s miracles to one who enters and becomes a part of the kingdom of God.'
  - where: 'note 3:2 “A teacher come from God”'
    claim: '“Miracles” is sēmeia; Nicodemus may have had the temple cleansing in mind, which foreshadowed the death of Jesus’s body'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'the cleansing of the temple … is less about the temple than it is a foreshadowing of the death of Jesus’s body (John 2:13–22). … Likewise, Nicodemus may have had this action in mind as well when he said, “We know that thou art a teacher come from God: for no man can do these miracles [sēmeia]'

  - where: 'note 3:3 “Born again, or born from above”'
    claim: 'anōthen means from above (used of what comes from heaven, 3:31; 19:11) and also anew'
    key: thayer
    url: 'https://biblehub.com/greek/509.htm'
    quote: 'Often (also in Greek writings) used of things which come from heaven, or from God as dwelling in heaven: John 3:31; John 19:11'
  - where: 'note 3:3 “Born again, or born from above”'
    claim: 'Lexicographers disagree; Thayer argues for “anew” because Nicodemus did not ask how one could be born from heaven'
    key: thayer
    url: 'https://biblehub.com/greek/509.htm'
    quote: 'c. anew, over again, indicating repetition … John 3:3, 7 ἄνωθεν γεννηθῆναι, where others explain it from above, i. e. from heaven. But, according to this explanation, Nicodemus ought to have wondered how it was possible for anyone to be born from heaven'
  - where: 'note 3:3 “Born again, or born from above”'
    claim: 'Nicodemus takes anōthen in the first sense, “again”'
    key: strathearn-johannine-dialogues
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/johannine-christology-through-lens-three-its-dialogues'
    quote: 'Nicodemus misunderstands the spiritual intent of Jesus’s statement and interprets anōthen according to the first definition'

  - where: 'note 3:5 “Water and the Spirit”'
    claim: 'Moses 6:59–60 takes up John 3’s water and spirit and adds blood'
    key: bradshaw-bowen-born-again
    url: 'https://interpreterfoundation.org/journal/by-the-blood-ye-are-sanctified-the-symbolic-salvific-interrelated-additive-retrospective-and-anticipatory-nature-of-the-ordinances-of-spiritual-rebirth-in-john-3-and-moses-6'
    quote: 'In chapter 3 of the Gospel of John, Jesus described spiritual rebirth as consisting of two parts: being “born of water and of the spirit.”1 To this requirement … Moses 6:59–60 adds that one must “be cleansed by blood'
  - where: 'note 3:5 “Water and the Spirit”'
    claim: 'Born from above is born of water and the spirit; baptism enables one to see, the Spirit to be fully engaged in the kingdom'
    key: strathearn-johannine-dialogues
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/johannine-christology-through-lens-three-its-dialogues'
    quote: 'This type of transition is facilitated not just by the ordinance of baptism—that only enables a person to “see the kingdom of God” (John 3:3). Rather, to be fully engaged in the kingdom, one needs a baptism that is sanctified by the outpouring of the Spirit.'
  - where: 'note 3:5 “Water and the Spirit”'
    claim: 'Joseph Smith: baptism by water is but half a baptism without the Holy Ghost'
    key: wjs-1843-07-09
    url: 'https://rsc.byu.edu/words-joseph-smith/9-july-1843-sunday-morning-temple-stand'
    quote: 'might as well be baptize a bag of sand as a man if not done in view of the getting of the Holy Ghost.—baptism by water is but 1/2 a baptism'

  - where: 'note 3:8 “Wind and Spirit”'
    claim: 'pneuma means wind (John 3:8) and corresponds to Hebrew ruach'
    key: thayer
    url: 'https://biblehub.com/greek/4151.htm'
    quote: 'πνεῦμα, πνεύματος, τό (πνέω), Greek writings from Aeschylus and Herodotus down; Hebrew רוּחַ, Latinspiritus; i. e.: … a. of the wind: … hence, the wind itself, John 3:8'

  - where: 'note 3:10 “The teacher of Israel”'
    claim: 'The Greek has the article: the teacher of Israel; Nicodemus stands for all the teachers who speak of the earth'
    key: strathearn-johannine-dialogues
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/johannine-christology-through-lens-three-its-dialogues'
    quote: 'The definite article suggests that Nicodemus represents all the teachers of Israel who “speaketh of the earth.” It is not just he who fails to understand.'
  - where: 'note 3:10 “The teacher of Israel”'
    claim: 'Heavenly things cannot be learned by earthly study; the Son of Man came down from heaven to teach them'
    key: strathearn-johannine-dialogues
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/johannine-christology-through-lens-three-its-dialogues'
    quote: 'Neither Nicodemus nor any other teacher can understand the things of heaven, including understanding who Jesus is, through their earthly study.'

  - where: 'note 3:14 “The serpent in the wilderness”'
    claim: 'Numbers 21: the people murmured, fiery serpents, repented; the brass serpent on a pole'
    key: sc-knowhy-657
    url: 'https://scripturecentral.org/knowhy/why-did-jesus-compare-himself-to-the-brazen-serpent'
    quote: 'After the people repented, the Lord instructed Moses to make a “serpent of brass” and raise it on a pole, which would cause those bitten to live if they only would look at it (Numbers 21:8–9).'
  - where: 'note 3:14 “The serpent in the wilderness”'
    claim: 'To Israel the serpent was a symbol of healing, life, deliverance; Christ fulfills what it symbolized'
    key: sc-knowhy-657
    url: 'https://scripturecentral.org/knowhy/why-did-jesus-compare-himself-to-the-brazen-serpent'
    quote: 'They would have seen a symbol of healing, a symbol of life, a symbol of salvation and deliverance.'
  - where: 'note 3:14 “The serpent in the wilderness”'
    claim: 'Serpents had both negative and positive associations in the ancient Near East'
    key: sc-knowhy-657
    url: 'https://scripturecentral.org/knowhy/why-did-jesus-compare-himself-to-the-brazen-serpent'
    quote: 'In the ancient Near East, serpents actually had both negative and positive symbolic attributes—and several of the positive symbolic associations directly relate to the attributes of Jesus Christ.'
  - where: 'note 3:14 “The serpent in the wilderness”'
    claim: 'Book of Mormon prophets used the brazen serpent as a symbol for Christ'
    key: sc-knowhy-657
    url: 'https://scripturecentral.org/knowhy/why-did-jesus-compare-himself-to-the-brazen-serpent'
    quote: 'Several Book of Mormon prophets also used the brazen serpent as a symbol for Jesus Christ.'

  - where: 'note 3:14 “Lifted up”'
    claim: 'The first of John’s references to Jesus lifted up; others in 8:28 and 12:32–34; they foreshadow the cross'
    key: huntsman-lamb-of-god
    url: 'https://rsc.byu.edu/behold-lamb-god/lamb-god-unique-aspects-passion-narrative-john'
    quote: 'Christ on the cross is foreshadowed in the early chapters of the Gospel by repeated references to Jesus being lifted up. The first of these occurs during the dialogue with Nicodemus in chapter 3'
  - where: 'note 3:14 “Lifted up”'
    claim: 'The cross was the means by which the Word who came down from heaven returned there; 3 Ne. 27:14'
    key: huntsman-lamb-of-god
    url: 'https://rsc.byu.edu/behold-lamb-god/lamb-god-unique-aspects-passion-narrative-john'
    quote: 'Thus the cross and Jesus’s sacrificial death were the means by which the Divine Word, who had come down from heaven, returned there again'
  - where: 'note 3:14 “Lifted up”'
    claim: 'Nicodemus, seeing the prophecy fulfilled, came into the light at the burial with a kingly amount of spices'
    key: huntsman-lamb-of-god
    url: 'https://rsc.byu.edu/behold-lamb-god/lamb-god-unique-aspects-passion-narrative-john'
    quote: 'he was joined by Nicodemus, who brought a kingly amount of spices to honor the man he now recognized as the Christ'

  - where: 'note 3:16 “His only begotten Son”'
    claim: 'The Greek construction suggests verses 11–21 are a direct quotation of Jesus'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/3?lang=eng'
    quote: 'The Greek construction suggests that verses 11–21 contain a direct quotation.'
  - where: 'note 3:16 “His only begotten Son”'
    claim: 'monogenēs: single of its kind, only; used of only sons; of Christ, the one who has no brethren as Son of God'
    key: thayer
    url: 'https://biblehub.com/greek/3439.htm'
    quote: 'single of its kind, only (A. V. only-begotten); used of only sons or daughters … used of Christ, denotes the only son of God or one who in the sense in which he himself is the son of God has no brethren.'
  - where: 'note 3:16 “His only begotten Son”'
    claim: 'The footnote to “only” points to Gen. 22:2 and Jacob 4:5'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/3?lang=eng'
    quote: 'Gen. 22:2 (1–14); Jacob 4:5.'

  - where: 'note 3:22 “Did Jesus baptize?”'
    claim: 'JST John 4:3–4: He baptized fewer than His disciples, for an example'
    key: jst-john-4
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-john/4?lang=eng'
    quote: 'Now the Lord knew this, though he himself baptized not so many as his disciples; For he suffered them for an example, preferring one another.'
  - where: 'note 3:22 “Did Jesus baptize?”'
    claim: 'Jesus did baptize but gave the work mainly to His disciples as an example'
    key: larsen-baptism-nt
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/baptism-new-testament'
    quote: 'These verses make it clear that Jesus was indeed performing the ordinance of baptism himself, but primarily gave that responsibility over to his disciples so they could be an example.'
  - where: 'note 3:22 “Did Jesus baptize?”'
    claim: 'Their baptism differed from John’s: converts took Christ’s name, with the promise of the Spirit'
    key: larsen-baptism-nt
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/baptism-new-testament'
    quote: 'For one, those who were baptized would have taken upon themselves Christ’s name. In addition to this a promise was added “that in due course his converts would be baptized by the Spirit.”'

  - where: 'note 3:22 “Did Jesus baptize?”'
    claim: 'Jesus joins the water and the Spirit that were separate in John’s baptism (John 3:3, 5)'
    key: larsen-baptism-nt
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/baptism-new-testament'
    quote: 'Thus, Jesus brings together the two elements of baptism that were separate in John’s baptism.'

  - where: 'note 3:24 “Before John was imprisoned”'
    claim: 'This Judean ministry preceded the Galilean ministry of the other Gospels'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/3.htm'
    quote: 'This Judæan ministry, then, preceded the Galilean ministry of the earlier Gospels.'
  - where: 'note 3:24 “Before John was imprisoned”'
    claim: 'The two ministries overlap'
    key: larsen-baptism-nt
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/baptism-new-testament'
    quote: 'In John 3, we see that the ministries of the Baptist and Jesus overlap.'

  - where: 'note 3:25 “A question about purifying”'
    claim: 'Some manuscripts read “a Jew”; the nature of the question is unknown; it arose from the baptisms nearby'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/3.htm'
    quote: 'For “the Jews,” the reading of the better MSS. is, a Jew. The question arose on the side of John’s disciples. What the exact nature of it was we do not know, and have no means of judging.'
  - where: 'note 3:25 “A question about purifying”'
    claim: 'The Textus Receptus reads the plural “the Jews”; the SBL and other critical editions read the singular “a Jew”'
    key: greek-nt
    url: 'https://biblehub.com/texts/john/3-25.htm'
    quote: 'Ἐγένετο οὖν ζήτησις ἐκ τῶν μαθητῶν Ἰωάννου μετὰ Ἰουδαίου περὶ καθαρισμοῦ.'
  - where: 'note 3:25 “A question about purifying”'
    claim: 'It concerned external rites, was tied to the baptisms nearby, and introduces the Baptist’s testimony'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/3.htm'
    quote: 'This arose in some way from the fact of the disciples of Jesus baptising near to the place where John was baptising, and doubtless was closely connected with these baptisms. The fact is only preserved as an incidental introduction to the remarkable testimony of the Baptist'

  - where: 'note 3:29 “The friend of the bridegroom”'
    claim: 'The friend of the bridegroom (shoshben) arranged the contract, acted for the bridegroom in the betrothal and presided at the wedding'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/3.htm'
    quote: 'The “friend of the bridegroom”—called by the Hebrews “Shōshbēn,” and by the Greeks “Paranymph”—was charged with the preliminaries of the marriage. He arranged the contract, acted for the bridegroom during the betrothal, and arranged for, and presided at, the festivities'
  - where: 'note 3:29 “The friend of the bridegroom”'
    claim: 'Bridegroom language is prophetic covenant language for Jehovah and Israel'
    key: huntsman-family-john
    url: 'https://rsc.byu.edu/household-god/family-god-gospel-john'
    quote: 'This is typically prophetic language denoting the covenant bond that reflects the relationship of YHWH, or Jehovah, to his people Israel.'
  - where: 'note 3:29 “The friend of the bridegroom”'
    claim: 'The bridegroom image of Jehovah is applied to Jesus, Jehovah made flesh; the Baptist explicitly calls Jesus the bridegroom'
    key: huntsman-family-john
    url: 'https://rsc.byu.edu/household-god/family-god-gospel-john'
    quote: 'Jehovah-now-made-flesh had now come in person to be with his people and reconcile them to himself … In the next chapter, John the Baptist explicitly refers to Jesus as the bridegroom (John 3:29)'

  - where: 'note 3:31 “He that cometh from above”'
    claim: '“From above” in 3:31 is anōthen, the word of 3:3'
    key: strathearn-johannine-dialogues
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/johannine-christology-through-lens-three-its-dialogues'
    quote: 'The Greek word translated as “again” is anōthen. While it can refer to a repeated action, it is the same word used later in chapter 3 to describe Jesus as being “from above” (3:31; 19:11)'
  - where: 'note 3:31 “He that cometh from above”'
    claim: 'The verse contrasts the Baptist’s earthly origin with Him from above; the Greek repeats “of the earth” three times'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/3.htm'
    quote: 'the force of the words is lessened by not preserving the three-fold “of the earth” which is in the Greek. “He who is of the earth, of the earth he is, and of the earth he speaketh.” The first marks out the Baptist’s origin'
  - where: 'note 3:31 “He that cometh from above”'
    claim: 'The Baptist is still speaking, expounding “He must increase”'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/3.htm'
    quote: 'It will be noted that John is still expounding to his disciples the meaning of his own declaration, “He must increase, but I must decrease.”'

  - where: 'note 3:34 “Not by measure”'
    claim: 'JST John 3:34: he dwelleth in him, even the fullness'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/3?lang=eng'
    quote: 'for God giveth him not the Spirit by measure, for he dwelleth in him, even the fullness.'
  - where: 'note 3:34 “Not by measure”'
    claim: 'JST John 3:36: the believer shall receive of his fullness'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/3?lang=eng'
    quote: 'And he who believeth on the Son hath everlasting life; and shall receive of his fullness. But he who believeth not the Son, shall not receive of his fullness; for the wrath of God is upon him.'

