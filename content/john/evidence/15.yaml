  # ---- note 15:19
  - where: 'note 15:19 “Chosen out of the world”'
    claim: 'Much of “the world” rejects Him, against those who come to know Him'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'While much of the “the world” rejects him, those who come to know him'
  - where: 'note 15:19 “Chosen out of the world”'
    claim: 'The world''s love is selfish, loving what is its own'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/15.htm'
    quote: 'The force of the expression indicates the utter selfishness of the world’s love. It would love not them, but that in them which was its own.'
  - where: 'note 15:19 “Chosen out of the world”'
    claim: 'Compare 7:7; the hatred proves they no longer belong to the world'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/15.htm'
    quote: 'Comp. John 15:16, and Note on John 7:7. There He had told them that the world could not hate them. The very fact of its hatred would prove a moral change in them, by which they had ceased to belong to the world'
  - where: 'note 15:19 “Chosen out of the world”'
    claim: 'The hatred is a bond with their Master'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/15.htm'
    quote: 'The very hatred, then, is a bond of union with their Master'
  - where: 'note 15:19 “Chosen out of the world”'
    claim: 'The cause of the hatred is ignorance of God'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/15.htm'
    quote: 'The hatred is here traced to its true cause, which is ignorance of God.'
  - where: 'note 15:19 “Chosen out of the world”'
    claim: 'He forewarned them so they would not be taken by surprise and stumble'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'These things had Jesus declared unto them that they might not “be offended,” or in other words, taken by surprise, misled, and caused to doubt and stumble by the unprecedented events then impending.'

  # ---- note 15:22
  - where: 'note 15:22 “No cloak for their sin”'
    claim: 'A cloak covers and hides; here the sense is excuse for manifest sin'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/15.htm'
    quote: 'The idea is rather to cover up, to hide as with a garment, so that they may not be seen; whereas here the idea is of excuse for manifest sin.'
  - where: 'note 15:22 “No cloak for their sin”'
    claim: 'Had they not shut eyes and ears, the truth would have saved them; they were left without excuse'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'they would have been convinced of the truth, and the truth would have saved them; but they were left without cloak or excuse for their sin'
  - where: 'note 15:22 “No cloak for their sin”'
    claim: 'They answered His works by calling Him a sinner with a devil'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/15.htm'
    quote: 'They met the evidence of works by the assertion that He was a sinner, and possessed a devil.'
  - where: 'note 15:22 “No cloak for their sin”'
    claim: 'Where no law is given there is no condemnation'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/9?lang=eng'
    quote: 'Wherefore, he has given a law; and where there is no law given there is no punishment; and where there is no punishment there is no condemnation'
  - where: 'note 15:22 “No cloak for their sin”'
    claim: 'Greater light, greater condemnation; the footnote to 15:22 points to D&C 82:3, 2 Ne. 9:25 and John 9:41'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/82?lang=eng'
    quote: 'For of him unto whom much is given much is required; and he who sins against the greater light shall receive the greater condemnation.'

  # ---- note 15:25
  - where: 'note 15:25 “Written in their law”'
    claim: '“Law” in John can mean the whole Old Testament, as at 10:34 and 15:25'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/10.htm'
    quote: 'the term “Law” is here used in a wide sense for the whole of the Old Testament. There are other examples of this usage in John 7:49; John 12:34; John 15:25'
  - where: 'note 15:25 “Written in their law”'
    claim: 'The source is probably Psalm 69:4, also Psalm 35:19; compare John 2:17'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/15.htm'
    quote: 'The passage immediately referred to is probably that of the Messianic Psalm (69:4). The words are found also in Psalm 35:19'
  - where: 'note 15:25 “Written in their law”'
    claim: 'Fulfilled in full only in the sinless Sufferer'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/15.htm'
    quote: 'True were these words of many an earlier sufferer; but they were in their fulness true, they were “fulfilled,” only in the one sinless Sufferer.'
  - where: 'note 15:25 “Written in their law”'
    claim: 'Psalm 69:4 text'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/69?lang=eng'
    quote: 'They that hate me without a cause are more than the hairs of mine head'

  # ---- note 15:26
  - where: 'note 15:26 “Two witnesses”'
    claim: 'The Spirit does in His absence what Jesus did, including witnessing (15:26–27)'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'how in his absence the Holy Ghost will perform those roles that Jesus had done when present, serving as a Helper who teaches (John 14:26); witnesses (John 15:26‒27)'
  - where: 'note 15:26 “Two witnesses”'
    claim: 'Proceeding from the Father, the Spirit''s witness is the Father''s'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/15.htm'
    quote: 'He is also and emphatically the Spirit of Truth proceeding from the Father, and His witness therefore will be that of the Father Himself.'
  - where: 'note 15:26 “Two witnesses”'
    claim: 'The apostles distinguished their own witness from the Spirit''s; compare Acts 5:32'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/15.htm'
    quote: 'The Apostles themselves distinguished between their own witness of things which had come within their own experience and the witness borne by the power of the Holy Spirit'
  - where: 'note 15:26 “Two witnesses”'
    claim: '“The beginning” is the beginning of the ministry; compare Acts 1:21–22'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/15.htm'
    quote: 'Comp. John 1:7; and Notes on Acts 1:21-22. The “beginning” of course means the beginning of the Messianic teaching and works of which they were to be witnesses.'
  - where: 'note 15:26 “Two witnesses”'
    claim: 'Acts 1:22: the condition for Judas''s replacement'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/1?lang=eng'
    quote: 'Beginning from the baptism of John, unto that same day that he was taken up from us, must one be ordained to be a witness with us of his resurrection.'
  - where: 'note 15:26 “Two witnesses”'
    claim: 'Acts 5:32 text'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/5?lang=eng'
    quote: 'And we are his witnesses of these things; and so is also the Holy Ghost, whom God hath given to them that obey him.'

