chapter: 15
claims:
  # ---- when, setting, thread, sections
  - where: when
    claim: 'Part of the discourse was given in the upper room; chapters 15–17 may have been spoken outdoors on the way to the Mount of Olives'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'It is certain that part of the discourse following the last supper was delivered in the upper room where Christ and the Twelve had eaten; it is possible that the latter portion was spoken and the prayer offered (John 15, 16, 17) outdoors'
  - where: setting
    claim: 'The farewell discourses (14:1–16:33) follow the supper, then the prayer of 17; the Synoptics have nothing like them'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'Jesus delivers several extended discourses to his disciples (John 14:1‒16:33), after which he delivers an intimate prayer to his Father (John 17:1‒26). … the Synoptics contain nothing like Jesus’s final words to his disciples found in John.'
  - where: setting
    claim: 'The discourses have some characteristics of the testament of a patriarch or prophet before his death'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'Sometimes called “The Testament of Jesus” because they contain some, though not all, of the characteristics of the final words of a patriarch, prophet, or apostle before his death'
  - where: setting
    claim: 'The first disciples serve as types of believers in every age'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'These discourses are intimate instructions and, at times, conversations with his original disciples, who serve as types of believers in all ages, including us.'
  - where: setting
    claim: 'John 14 ends with “Arise, let us go hence” and the discourse continues; John 18:1 places the going out after the whole discourse; the place affects nothing in it'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'The 14th chapter of John ends with “Arise, let us go hence”; the next chapter opens with another section of the discourse. … Not one of our Lord’s sublime utterances on that night … is affected by the circumstance of place.'
  - where: setting
    claim: 'The discourses are chiastic: 14 and 16 on His departure, 15 on His continuing presence with those who dwell in Him'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'they present a chiastic structure, with chapters 14 and 16 focusing on Jesus’s imminent departure and chapter 15 emphasizing his continuous presence with those who continue to dwell in him through the spirit'
  - where: thread
    claim: 'Dwelling or continuing in Jesus is woven through the discourses, above all in the true vine'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'the concept of dwelling or continuing in Jesus is woven throughout the Farewell Discourses, particularly in Jesus’s declaration, “I Am the True Vine” (John 15:1‒17).'
  - where: thread
    claim: 'From verse 18 the chapter turns to the world; love in 17 is set against hatred in 18; they need one another the more because of it'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/15.htm'
    quote: 'He proceeds in the remainder of the chapter to speak of their relation to the world. There is a striking contrast between the “love” in the last verse, and the “hatred” in this. There was the more need for them to be close bound to each other'
  - where: thread
    claim: 'In verse 7 the discourse passes from the figure'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/15.htm'
    quote: 'He is now passing from the figure, which recurs again only in John 15:8; John 15:16.'
  - where: section 1 plain
    claim: '“Purgeth” rendered “prunes”'
    key: thayer
    url: 'https://biblehub.com/greek/2508.htm'
    quote: 'trees and vines (from useless shoots), to prune, John 15:2'
  - where: section 3 plain
    claim: '“No cloak” rendered “no excuse”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/15?lang=eng'
    quote: 'IE pretext, excuse.'

  # ---- note 15:1
  - where: 'note 15:1 “The true vine”'
    claim: 'Israel as the vine the Lord brought out of Egypt and planted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/80?lang=eng'
    quote: 'Thou hast brought a vine out of Egypt: thou hast cast out the heathen, and planted it.'
  - where: 'note 15:1 “The true vine”'
    claim: 'Isaiah: the vineyard is the house of Israel; it brought forth wild grapes'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/5?lang=eng'
    quote: 'For the vineyard of the LORD of hosts is the house of Israel, and the men of Judah his pleasant plant'
  - where: 'note 15:1 “The true vine”'
    claim: 'The image was familiar from the Old Testament; what prompted it that night is unknown, the cup the most probable suggestion; “true” means the ideal reality the natural vine figures'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/15.htm'
    quote: 'The ideal truth, of which the natural vine is a figure, is fulfilled in Him. … or the vine suggested by “the fruit of the vine” of which they had drunk, have been suggested. Of these the last has most probability'
  - where: 'note 15:1 “The true vine”'
    claim: 'Other suggestions: a vineyard on the way, a vine growing into the room, the vine carved on the temple doors; the image was familiar from the Old Testament'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/15.htm'
    quote: 'a vine whose tendrils grew into the room, or the vine carved on the doors of the Temple … It was, as in the case of the Good Shepherd, familiar to them from the Old Testament'
  - where: 'note 15:1 “The true vine”'
    claim: 'The husbandman is the owner who cultivates and trains the vine'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/15.htm'
    quote: 'The thought here is of the owner of the vine, who himself cultivates and trains it.'
  - where: 'note 15:1 “The true vine”'
    claim: 'The true vine is one of the predicated “I am” sayings, reflecting His divine role'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'in seven instances Jesus uses the expression to equate himself with a Christological title or symbol, such as “I am the bread of life” (John 6:35) or “I am the good shepherd” (10:11, 14), that are reflective of his divine role'
  - where: 'note 15:1 “The true vine”'
    claim: 'Nephi brings together the true vine and the olive tree in 1 Ne. 15:15–16'
    key: benson-joseph-smith-messiah
    url: 'https://rsc.byu.edu/vol-3-no-3-2002/joseph-smith-messiah-prophetically-linked'
    quote: 'Nephi brings together the metaphors of the true vine and olive tree when he says, “Yea, at that day, will they not receive the strength and nourishment from the true vine?'
  - where: 'note 15:1 “The true vine”'
    claim: 'The true vine and the true olive tree are Christ'
    key: benson-joseph-smith-messiah
    url: 'https://rsc.byu.edu/vol-3-no-3-2002/joseph-smith-messiah-prophetically-linked'
    quote: 'that all might have roots and branches grafted into the “true vine” and the “true olive tree,” who is Christ.'

  # ---- note 15:2
  - where: 'note 15:2 “He purgeth it; ye are clean”'
    claim: 'Kathairō means to cleanse, and of vines to prune; it is from katharos'
    key: thayer
    url: 'https://biblehub.com/greek/2508.htm'
    quote: 'καθαίρω; perfect passive participle κεκαθαρμενος; (καθαρός); to cleanse, properly, from filth, impurity, etc.; trees and vines (from useless shoots), to prune, John 15:2'
  - where: 'note 15:2 “He purgeth it; ye are clean”'
    claim: 'Verse 2 has kathairei'
    key: greek-nt
    url: 'https://biblehub.com/texts/john/15-2.htm'
    quote: 'καὶ πᾶν τὸ καρπὸν φέρον καθαίρει αὐτὸ ἵνα καρπὸν πλείονα φέρῃ.'
  - where: 'note 15:2 “He purgeth it; ye are clean”'
    claim: 'Verse 3 has katharoi'
    key: greek-nt
    url: 'https://biblehub.com/texts/john/15-3.htm'
    quote: 'ἤδη ὑμεῖς καθαροί ἐστε διὰ τὸν λόγον ὃν λελάληκα ὑμῖν·'
  - where: 'note 15:2 “He purgeth it; ye are clean”'
    claim: 'The vinedresser''s two duties picture the Father''s training of souls'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/15.htm'
    quote: 'The two chief duties of the vine-dresser, cutting off all fruitless tendrils, and cleansing those that bear fruit, supply illustrations of the training of human souls by the Divine Husbandman.'
  - where: 'note 15:2 “He purgeth it; ye are clean”'
    claim: 'Pruning cuts off wasteful shoots, even promising ones; in life by a sharp pang'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/15.htm'
    quote: 'the removal of everything, even though it be by a pang sharp as the edge of the pruner’s knife, which can misdirect or weaken the energy of the spiritual life'
  - where: 'note 15:2 “He purgeth it; ye are clean”'
    claim: 'The word that cleansed them is His whole teaching, not only 13:10'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/15.htm'
    quote: 'The word was the revelation of God to them, and by reason of its moral power they had been cleansed. We are not to limit the reference to John 13:10, but are to understand it of our Lord’s whole teaching.'
  - where: 'note 15:2 “He purgeth it; ye are clean”'
    claim: 'They were clean through instruction, ordinances and obedience'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'As branches of the Vine they were at that hour clean and healthful, through the instructions and authoritative ordinances with which they had been blessed, and by the reverent obedience they had manifested.'

  # ---- note 15:4
  - where: 'note 15:4 “Abide in me”'
    claim: 'To abide is to remain fixed and stable, enduring without yielding'
    key: bednar-abide-in-me
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2023/04/57bednar?lang=eng'
    quote: 'The word abide denotes remaining fixed or stable and enduring without yielding.'
  - where: 'note 15:4 “Abide in me”'
    claim: 'Menō is connected with monai, “mansions,” of 14:2'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'While “places to live” (Greek, monai; KJV, “mansions”) refers to dwellings or places to stay, the term is also connected etymologically to a verb meaning “to dwell” as well as “continue in” or “persist with” (Greek, menō; KJV, “abide”).'
  - where: 'note 15:4 “Abide in me”'
    claim: 'The two clauses are cause and effect; the union is within the power of the will'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/15.htm'
    quote: 'The clauses are here connected as cause and effect. The second is the promise, which will not fail if the command of the first be observed. The union then, and all that follows from it, is placed within the power of the human will.'
  - where: 'note 15:4 “Abide in me”'
    claim: 'We begin to abide through covenants and ordinances'
    key: bednar-abide-in-me
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2023/04/57bednar?lang=eng'
    quote: 'We begin to abide in the Lord by exercising our moral agency to take upon ourselves His yoke through the covenants and ordinances of the restored gospel.'
  - where: christ
    claim: 'We begin to abide through covenants and ordinances'
    key: bednar-abide-in-me
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2023/04/57bednar?lang=eng'
    quote: 'We begin to abide in the Lord by exercising our moral agency to take upon ourselves His yoke through the covenants and ordinances of the restored gospel.'
  - where: christ
    claim: 'We abide by prayer, feasting on His words, the sacrament and repentance, and service'
    key: bednar-abide-in-me
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2023/04/57bednar?lang=eng'
    quote: 'We abide in Him by preparing earnestly to participate in the ordinance of the sacrament, reviewing and reflecting on our covenant promises, and repenting sincerely.'
  - where: 'note 15:4 “Abide in me”'
    claim: 'The Lord spoke the same words to Enoch'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/6?lang=eng'
    quote: 'and thou shalt abide in me, and I in you; therefore walk with me.'
  - where: 'note 15:4 “Abide in me”'
    claim: 'Enoch''s capacity grew over time as he learned to abide in the Son'
    key: bednar-abide-in-me
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2023/04/57bednar?lang=eng'
    quote: 'Enoch ultimately became a mighty prophet and a tool in God’s hands to accomplish a great work, but he did not start his ministry that way! Rather, his capacity over time was magnified as he learned to abide in and walk with the Son of God.'

  # ---- note 15:5
  - where: 'note 15:5 “Without me ye can do nothing”'
    claim: 'The apostles were fruitful only in communion with Him; without Him, weak mortals'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'Without Christ what were they, but unschooled Galileans, some of them fishermen, one a publican, the rest of undistinguished attainments, and all of them weak mortals?'
  - where: 'note 15:5 “Without me ye can do nothing”'
    claim: 'The branch is fruitful only by the sap; cut off it withers and is fit only for burning'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'As the branch is made fruitful only by virtue of the nourishing sap it receives from the rooted trunk, and if cut away or broken off withers, dries, and becomes utterly worthless except as fuel for the burning'
  - where: 'note 15:5 “Without me ye can do nothing”'
    claim: 'Covenants connect us to the source of life so that we bring forth fruit'
    key: lane-covenants-true-vine
    url: 'https://rsc.byu.edu/finding-christ-covenant-path/covenants-true-vine'
    quote: 'Covenants are Christ’s way of inviting us to connect to the source of life so that we can bring forth fruit and have his power in our lives'
  - where: 'note 15:5 “Without me ye can do nothing”'
    claim: 'The branch does not toil; it grows fruit'
    key: lane-covenants-true-vine
    url: 'https://rsc.byu.edu/finding-christ-covenant-path/covenants-true-vine'
    quote: 'The branch of the grapevine doesn’t punch a time card—it brings forth much fruit.'

  # ---- note 15:6
  - where: 'note 15:6 “Cast forth as a branch”'
    claim: 'The fruitless branches are not the unbelieving world or the Jews but those in name joined to the vine, whom the Father knows'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/15.htm'
    quote: 'We are not to interpret these words, as they frequently have been interpreted, of the unbelieving world, or of the Jews; but of Christians in name, who claim to be branches of the true vine. … He knoweth them, and readeth the inner realities of their lives'
  - where: 'note 15:6 “Cast forth as a branch”'
    claim: 'In a vineyard the branch was cast forth, withered, bundled and burned; it pictures a man who will not abide'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/15.htm'
    quote: 'In the natural vineyard such a branch was cast forth, and then withered, and was gathered with others into bundles, and burned. The vivid picture illustrates the fearful history of a man who willeth not to abide in Christ.'
  - where: 'note 15:6 “Cast forth as a branch”'
    claim: 'The tenses move from past to present; the burning suggests the final judgment'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/15.htm'
    quote: 'Better, and they burn. The tenses of this verse should be carefully observed. The burning of the withered branches of the natural vine suggests the final judgment, and the whole is thought of from that time.'

  # ---- note 15:7
  - where: 'note 15:7 “Ask what ye will”'
    claim: 'His words abiding in them are the means and proof of their abiding; such cannot pray except in His name; same promise as 14:13–14'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/15.htm'
    quote: 'The promise in all its width is the same as that in John 14:13-14 (see Note there), and it is attended by the same condition, for they who abide in Christ, and in whom Christ’s words abide, cannot pray otherwise than in His name.'
  - where: 'note 15:7 “Ask what ye will”'
    claim: 'The abiding of His words is the means and the proof of abiding in Him'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/15.htm'
    quote: 'The abiding of His words in them is the means by which, and the proof that they do abide in Him.'
  - where: 'note 15:7 “Ask what ye will”'
    claim: 'Prayer brings the wills of Father and child into correspondence; it does not change God''s will'
    key: bd-prayer
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/prayer?lang=eng'
    quote: 'Prayer is the act by which the will of the Father and the will of the child are brought into correspondence with each other. The object of prayer is not to change the will of God but to secure for ourselves and for others blessings that God is already willing to grant'
  - where: 'note 15:7 “Ask what ye will”'
    claim: 'The promise to the Nephites with “which is right”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/18?lang=eng'
    quote: 'And whatsoever ye shall ask the Father in my name, which is right, believing that ye shall receive, behold it shall be given unto you.'

  # ---- note 15:10
  - where: 'note 15:10 “Abide in my love”'
    claim: 'Divine love is perfect, infinite, enduring and universal, but not unconditional'
    key: nelson-divine-love
    url: 'https://www.churchofjesuschrist.org/study/ensign/2003/02/divine-love?lang=eng'
    quote: 'While divine love can be called perfect, infinite, enduring, and universal, it cannot correctly be characterized as unconditional.'
  - where: 'note 15:10 “Abide in my love”'
    claim: 'The word is not in scripture; higher levels of love and the blessings from it are conditional'
    key: nelson-divine-love
    url: 'https://www.churchofjesuschrist.org/study/ensign/2003/02/divine-love?lang=eng'
    quote: 'The word does not appear in the scriptures. On the other hand, many verses affirm that the higher levels of love the Father and the Son feel for each of us—and certain divine blessings stemming from that love—are conditional.'
  - where: 'note 15:10 “Abide in my love”'
    claim: 'John 15:10 is one of the conditional verses, read with “then”'
    key: nelson-divine-love
    url: 'https://www.churchofjesuschrist.org/study/ensign/2003/02/divine-love?lang=eng'
    quote: '“If ye keep my commandments, [then] ye shall abide in my love; even as I have kept my Father’s commandments, and abide in his love.”'
  - where: 'note 15:10 “Abide in my love”'
    claim: 'Keeping the commandments is not an arbitrary condition but the result of love, true of the Son toward the Father'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/15.htm'
    quote: 'the keeping of the commandments is not an arbitrary condition imposed upon human love; but a necessary result of love itself, and therefore as true in the relation of the Son to the Father as it is in our relation to Him.'

  # ---- note 15:13
  - where: 'note 15:13 “Greater love hath no man”'
    claim: 'His love is the measure of theirs; nothing greater is conceivable; compare 1 John 3:16'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/15.htm'
    quote: 'Nothing greater is conceivable in the thought of love. He has spoken of His own love for them as the measure of their love for each other. … (Comp. especially Note on 1John 3:16.)'
  - where: 'note 15:13 “Greater love hath no man”'
    claim: '“Friends” because they were His friends; no opposition with Romans 5; the point is the greatness of the love'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/15.htm'
    quote: 'The term “friends” is here used because those whom He is addressing were His friends. There is no opposition between this passage and Romans 5:6 et seq. The point dwelt upon is the greatness of the love'
  - where: 'note 15:13 “Greater love hath no man”'
    claim: 'He was about to give the supreme proof of His love'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'He was about to give the supreme proof of His affection, as foreshadowed in His words, “Greater love hath no man than this, that a man lay down his life for his friends.”'
  - where: 'note 15:13 “Greater love hath no man”'
    claim: 'John''s epistle draws the duty from it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-jn/3?lang=eng'
    quote: 'Hereby perceive we the love of God, because he laid down his life for us: and we ought to lay down our lives for the brethren.'

  # ---- note 15:15
  - where: 'note 15:15 “Not servants, but friends”'
    claim: '“Servant” is bond-servant, slave; the apostles later took it as their title'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/15.htm'
    quote: 'The word here rendered “servant” means literally “bond-servant,” “slave.” He will not apply this to them, but the foremost Apostles felt that His service was perfect freedom, and it became the common title which they applied to themselves.'
  - where: 'note 15:15 “Not servants, but friends”'
    claim: 'The slave obeys mechanically, without love, not knowing the master''s purpose'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/15.htm'
    quote: 'The part of the slave is mechanical obedience, without any principle of love between his master and himself. He knows nothing of the purpose or aim of his master'
  - where: 'note 15:15 “Not servants, but friends”'
    claim: 'He kept back nothing they could understand; no contradiction with 16:12; the Spirit would declare the rest'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/15.htm'
    quote: 'He had treated them as friends and sharers in their common work. … There is no contradiction with John 16:12. The reason He had not told them more was not on His part, but on theirs.'
  - where: 'note 15:15 “Not servants, but friends”'
    claim: 'The friendship did not change His being their Lord and Master'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'This intimate relationship in no sense modified the position of Christ as their Lord and Master, for by Him they had been chosen and ordained'
  - where: 'note 15:15 “Not servants, but friends”'
    claim: 'D&C 84 was given in September 1832'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'Revelation given through Joseph Smith the Prophet, at Kirtland, Ohio, September 22 and 23, 1832.'
  - where: 'note 15:15 “Not servants, but friends”'
    claim: 'D&C 84:63: apostles and high priests are His friends'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'for you are mine apostles, even God’s high priests; ye are they whom my Father hath given me; ye are my friends;'
  - where: 'note 15:15 “Not servants, but friends”'
    claim: 'The footnote to John 15:14 points to D&C 84:63'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/15?lang=eng'
    quote: 'D&C 84:63.'
  - where: 'note 15:16 “Chosen and ordained”'
    claim: 'The Twelve rarely appear as a group in John; 15:16 is one of the places'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'the Twelve only appear explicitly as a group at the end of the Bread of Life Discourse, at the Last Supper and the following Farewell Discourses, and, minus Judas, in the upper room after Jesus’s resurrection (John 6:67, 70; 13:18; 15:16, 19; 20:19–29).'
  - where: 'note 15:16 “Chosen and ordained”'
    claim: 'The verb is etheka'
    key: greek-nt
    url: 'https://biblehub.com/texts/john/15-16.htm'
    quote: 'ἀλλ’ ἐγὼ ἐξελεξάμην ὑμᾶς, καὶ ἔθηκα ὑμᾶς ἵνα ὑμεῖς ὑπάγητε καὶ καρπὸν φέρητε'
  - where: 'note 15:16 “Chosen and ordained”'
    claim: 'Tithēmi with hina in John 15:16: to appoint one to a service'
    key: thayer
    url: 'https://biblehub.com/greek/5087.htm'
    quote: 'to appoint one to one''s service, 1 Timothy 1:12 … τιθέναι τινα ἵνα, John 15:16'
  - where: 'note 15:16 “Chosen and ordained”'
    claim: 'He had conferred the authority of the Holy Priesthood on them'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'those upon whom He had conferred the authority of the Holy Priesthood'
  - where: 'note 15:16 “Chosen and ordained”'
    claim: 'Chosen and set apart from the world by ordination, they could not escape its hatred'
