    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'they had been chosen and by ordination had been set apart from the world; therefore they must not hope to escape the world’s hatred.'
  - where: 'note 15:16 “Chosen and ordained”'
