chapter: 15
claims:
  # ---- when, setting, thread, sections
  - where: section 1 plain
    claim: '“Purgeth” rendered “prunes”'
    key: thayer
    url: 'https://biblehub.com/greek/2508.htm'
    quote: 'trees and vines (from useless shoots), to prune, John 15:2'
  - where: section 3 plain
    claim: '“No cloak” rendered “no excuse”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/15?lang=eng'
    quote: 'IE pretext, excuse.'

  # ---- note 15:1
  - where: 'note 15:1 “The true vine”'
    claim: 'Israel as the vine the Lord brought out of Egypt and planted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/80?lang=eng'
    quote: 'Thou hast brought a vine out of Egypt: thou hast cast out the heathen, and planted it.'
  - where: 'note 15:1 “The true vine”'
    claim: 'Isaiah: the vineyard is the house of Israel; it brought forth wild grapes'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/5?lang=eng'
    quote: 'For the vineyard of the LORD of hosts is the house of Israel, and the men of Judah his pleasant plant'
  - where: 'note 15:1 “The true vine”'
    claim: 'The husbandman is the owner who cultivates and trains the vine'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/15.htm'
    quote: 'The thought here is of the owner of the vine, who himself cultivates and trains it.'
  - where: 'note 15:1 “The true vine”'
    claim: 'The true vine is one of the predicated “I am” sayings, reflecting His divine role'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'in seven instances Jesus uses the expression to equate himself with a Christological title or symbol, such as “I am the bread of life” (John 6:35) or “I am the good shepherd” (10:11, 14), that are reflective of his divine role'
  - where: 'note 15:1 “The true vine”'
    claim: 'Nephi brings together the true vine and the olive tree in 1 Ne. 15:15–16'
    key: benson-joseph-smith-messiah
    url: 'https://rsc.byu.edu/vol-3-no-3-2002/joseph-smith-messiah-prophetically-linked'
    quote: 'Nephi brings together the metaphors of the true vine and olive tree when he says, “Yea, at that day, will they not receive the strength and nourishment from the true vine?'
  - where: 'note 15:1 “The true vine”'
    claim: 'The true vine and the true olive tree are Christ'
    key: benson-joseph-smith-messiah
    url: 'https://rsc.byu.edu/vol-3-no-3-2002/joseph-smith-messiah-prophetically-linked'
    quote: 'that all might have roots and branches grafted into the “true vine” and the “true olive tree,” who is Christ.'

  # ---- note 15:2
  - where: 'note 15:2 “He purgeth it; ye are clean”'
    claim: 'Kathairō means to cleanse, and of vines to prune; it is from katharos'
    key: thayer
    url: 'https://biblehub.com/greek/2508.htm'
    quote: 'καθαίρω; perfect passive participle κεκαθαρμενος; (καθαρός); to cleanse, properly, from filth, impurity, etc.; trees and vines (from useless shoots), to prune, John 15:2'
  - where: 'note 15:2 “He purgeth it; ye are clean”'
    claim: 'Verse 2 has kathairei'
    key: greek-nt
    url: 'https://biblehub.com/texts/john/15-2.htm'
    quote: 'καὶ πᾶν τὸ καρπὸν φέρον καθαίρει αὐτὸ ἵνα καρπὸν πλείονα φέρῃ.'
  - where: 'note 15:2 “He purgeth it; ye are clean”'
    claim: 'Verse 3 has katharoi'
    key: greek-nt
    url: 'https://biblehub.com/texts/john/15-3.htm'
    quote: 'ἤδη ὑμεῖς καθαροί ἐστε διὰ τὸν λόγον ὃν λελάληκα ὑμῖν·'
  # ---- note 15:4
  - where: 'note 15:4 “Abide in me”'
    claim: 'To abide is to remain fixed and stable, enduring without yielding'
    key: bednar-abide-in-me
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2023/04/57bednar?lang=eng'
    quote: 'The word abide denotes remaining fixed or stable and enduring without yielding.'
  - where: 'note 15:4 “Abide in me”'
    claim: 'Menō means to dwell, continue in, persist with'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'While “places to live” (Greek, monai; KJV, “mansions”) refers to dwellings or places to stay, the term is also connected etymologically to a verb meaning “to dwell” as well as “continue in” or “persist with” (Greek, menō; KJV, “abide”).'
  - where: 'note 15:4 “Abide in me”'
    claim: 'We begin to abide through covenants and ordinances'
    key: bednar-abide-in-me
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2023/04/57bednar?lang=eng'
    quote: 'We begin to abide in the Lord by exercising our moral agency to take upon ourselves His yoke through the covenants and ordinances of the restored gospel.'
  - where: christ
    claim: 'We begin to abide through covenants and ordinances'
    key: bednar-abide-in-me
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2023/04/57bednar?lang=eng'
    quote: 'We begin to abide in the Lord by exercising our moral agency to take upon ourselves His yoke through the covenants and ordinances of the restored gospel.'
  - where: christ
    claim: 'We abide through the sacrament and repentance'
    key: bednar-abide-in-me
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2023/04/57bednar?lang=eng'
    quote: 'We abide in Him by preparing earnestly to participate in the ordinance of the sacrament, reviewing and reflecting on our covenant promises, and repenting sincerely.'
  - where: 'note 15:4 “Abide in me”'
    claim: 'The Lord spoke the same words to Enoch'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/6?lang=eng'
    quote: 'and thou shalt abide in me, and I in you; therefore walk with me.'
  - where: 'note 15:4 “Abide in me”'
    claim: 'Enoch''s capacity grew over time as he learned to abide in the Son'
    key: bednar-abide-in-me
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2023/04/57bednar?lang=eng'
    quote: 'Enoch ultimately became a mighty prophet and a tool in God’s hands to accomplish a great work, but he did not start his ministry that way! Rather, his capacity over time was magnified as he learned to abide in and walk with the Son of God.'

  # ---- note 15:5
  - where: 'note 15:5 “Without me ye can do nothing”'
    claim: 'The apostles were fruitful only in communion with Him; without Him, weak mortals'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'Without Christ what were they, but unschooled Galileans, some of them fishermen, one a publican, the rest of undistinguished attainments, and all of them weak mortals?'
  - where: 'note 15:5 “Without me ye can do nothing”'
    claim: 'The branch is fruitful only by the sap; cut off it withers and is fit only for burning'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'As the branch is made fruitful only by virtue of the nourishing sap it receives from the rooted trunk, and if cut away or broken off withers, dries, and becomes utterly worthless except as fuel for the burning'
  - where: 'note 15:5 “Without me ye can do nothing”'
    claim: 'Covenants connect us to the source of life so that we bring forth fruit'
    key: lane-covenants-true-vine
    url: 'https://rsc.byu.edu/finding-christ-covenant-path/covenants-true-vine'
    quote: 'Covenants are Christ’s way of inviting us to connect to the source of life so that we can bring forth fruit and have his power in our lives'
  - where: 'note 15:5 “Without me ye can do nothing”'
    claim: 'The branch does not toil; it grows fruit'
    key: lane-covenants-true-vine
    url: 'https://rsc.byu.edu/finding-christ-covenant-path/covenants-true-vine'
    quote: 'The branch of the grapevine doesn’t punch a time card—it brings forth much fruit.'

  # ---- note 15:6
  # ---- note 15:7
  - where: 'note 15:7 “Ask what ye will”'
    claim: 'Prayer brings the wills of Father and child into correspondence; it does not change God''s will'
    key: bd-prayer
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/prayer?lang=eng'
    quote: 'Prayer is the act by which the will of the Father and the will of the child are brought into correspondence with each other. The object of prayer is not to change the will of God but to secure for ourselves and for others blessings that God is already willing to grant'
  - where: 'note 15:7 “Ask what ye will”'
    claim: 'The promise to the Nephites with “which is right”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/18?lang=eng'
    quote: 'And whatsoever ye shall ask the Father in my name, which is right, believing that ye shall receive, behold it shall be given unto you.'

  # ---- note 15:10
  - where: 'note 15:10 “Abide in my love”'
    claim: 'Divine love is perfect, infinite, enduring and universal, but not unconditional'
    key: nelson-divine-love
    url: 'https://www.churchofjesuschrist.org/study/ensign/2003/02/divine-love?lang=eng'
    quote: 'While divine love can be called perfect, infinite, enduring, and universal, it cannot correctly be characterized as unconditional.'
  - where: 'note 15:10 “Abide in my love”'
    claim: 'The word is not in scripture; higher levels of love and the blessings from it are conditional'
    key: nelson-divine-love
    url: 'https://www.churchofjesuschrist.org/study/ensign/2003/02/divine-love?lang=eng'
    quote: 'The word does not appear in the scriptures. On the other hand, many verses affirm that the higher levels of love the Father and the Son feel for each of us—and certain divine blessings stemming from that love—are conditional.'
  - where: 'note 15:10 “Abide in my love”'
    claim: 'John 15:10 is one of the conditional verses, read with “then”'
    key: nelson-divine-love
    url: 'https://www.churchofjesuschrist.org/study/ensign/2003/02/divine-love?lang=eng'
    quote: '“If ye keep my commandments, [then] ye shall abide in my love; even as I have kept my Father’s commandments, and abide in his love.”'
  - where: 'note 15:13 “Greater love hath no man”'
    claim: 'John''s epistle draws the duty from it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-jn/3?lang=eng'
    quote: 'Hereby perceive we the love of God, because he laid down his life for us: and we ought to lay down our lives for the brethren.'

  # ---- note 15:15
  - where: 'note 15:15 “Not servants, but friends”'
    claim: 'D&C 84 was given in September 1832'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'Revelation given through Joseph Smith the Prophet, at Kirtland, Ohio, September 22 and 23, 1832.'
  - where: 'note 15:15 “Not servants, but friends”'
    claim: 'D&C 84:63: apostles and high priests are His friends'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'for you are mine apostles, even God’s high priests; ye are they whom my Father hath given me; ye are my friends;'
  - where: 'note 15:15 “Not servants, but friends”'
    claim: 'The footnote to John 15:14 points to D&C 84:63'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/15?lang=eng'
    quote: 'D&C 84:63.'
  - where: 'note 15:16 “Chosen and ordained”'
    claim: 'The verb is etheka'
    key: greek-nt
    url: 'https://biblehub.com/texts/john/15-16.htm'
    quote: 'ἀλλ’ ἐγὼ ἐξελεξάμην ὑμᾶς, καὶ ἔθηκα ὑμᾶς ἵνα ὑμεῖς ὑπάγητε καὶ καρπὸν φέρητε'
  - where: 'note 15:16 “Chosen and ordained”'
    claim: 'Tithēmi with hina in John 15:16: to appoint one to a service'
    key: thayer
    url: 'https://biblehub.com/greek/5087.htm'
    quote: 'to appoint one to one''s service, 1 Timothy 1:12 … τιθέναι τινα ἵνα, John 15:16'
  - where: 'note 15:16 “Chosen and ordained”'
    claim: 'Earlier choosing of the Twelve'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/6?lang=eng'
    quote: 'Jesus answered them, Have not I chosen you twelve, and one of you is a devil?'

  # ---- note 15:19
  - where: 'note 15:19 “Chosen out of the world”'
    claim: 'Much of “the world” rejects Him, against those who come to know Him'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'While much of the “the world” rejects him, those who come to know him'
  - where: 'note 15:19 “Chosen out of the world”'
    claim: 'Compare 7:7, where the world could not hate His brothers'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/15.htm'
    quote: 'Comp. John 15:16, and Note on John 7:7. There He had told them that the world could not hate them. The very fact of its hatred would prove a moral change in them, by which they had ceased to belong to the world'
  - where: 'note 15:19 “Chosen out of the world”'
    claim: 'He forewarned them so they would not be taken by surprise and stumble'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'These things had Jesus declared unto them that they might not “be offended,” or in other words, taken by surprise, misled, and caused to doubt and stumble by the unprecedented events then impending.'

  # ---- note 15:22
  - where: 'note 15:22 “No cloak for their sin”'
    claim: 'Where no law is given there is no condemnation'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/9?lang=eng'
    quote: 'Wherefore, he has given a law; and where there is no law given there is no punishment; and where there is no punishment there is no condemnation'
  - where: 'note 15:22 “No cloak for their sin”'
    claim: 'Greater light, greater condemnation; the footnote to 15:22 points to D&C 82:3, 2 Ne. 9:25 and John 9:41'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/82?lang=eng'
    quote: 'For of him unto whom much is given much is required; and he who sins against the greater light shall receive the greater condemnation.'

  # ---- note 15:25
  - where: 'note 15:25 “Written in their law”'
    claim: 'Psalm 69:4 text'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/69?lang=eng'
    quote: 'They that hate me without a cause are more than the hairs of mine head'

  # ---- note 15:26
  - where: 'note 15:26 “Two witnesses”'
    claim: 'Acts 1:22: the condition for Judas''s replacement'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/1?lang=eng'
    quote: 'Beginning from the baptism of John, unto that same day that he was taken up from us, must one be ordained to be a witness with us of his resurrection.'
  # ---- christ, explore
  - where: christ
    claim: 'The promise to abide is for every covenant-keeping member'
    key: bednar-abide-in-me
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2023/04/57bednar?lang=eng'
    quote: 'The Savior’s promise to abide in us is true and available to every covenant-keeping member of His restored Church.'
  - where: christ
    claim: 'Abiding brings much fruit'
    key: bednar-abide-in-me
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2023/04/57bednar?lang=eng'
    quote: 'If we abide in Him, He will abide in us. And as we walk in and with Him, we will be blessed to bring forth much fruit.'
  - where: explore
    claim: 'Bednar''s talk reads 15:4 with the Lord''s words to Enoch'
    key: bednar-abide-in-me
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2023/04/57bednar?lang=eng'
    quote: 'We should always remember the Lord’s instruction to Enoch: “Thou shalt abide in me, and I in you.”'
  - where: explore
    claim: 'Lane''s essay reads 15:5 as the power of the covenant path'
    key: lane-covenants-true-vine
    url: 'https://rsc.byu.edu/finding-christ-covenant-path/covenants-true-vine'
    quote: 'I know of no better explanation for the power of the covenant path.'

  # ---- when, setting, thread (repaired)
  - where: when
    claim: 'The supper was ended before the discourse'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/13?lang=eng'
    quote: 'And supper being ended, the devil having now put into the heart of Judas Iscariot, Simon’s son, to betray him;'
  - where: when
    claim: 'Chapter 14 ends with the call to go'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/14?lang=eng'
    quote: 'Arise, let us go hence.'
  - where: when
    claim: 'They went out over the brook Cedron when He had spoken these words'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/18?lang=eng'
    quote: 'When Jesus had spoken these words, he went forth with his disciples over the brook Cedron, where was a garden'
  - where: when
    claim: 'The upper-room teaching was on the eve of the crucifixion'
    key: olson-new-commandment
    url: 'https://rsc.byu.edu/his-majesty-mission/new-commandment'
    quote: 'On the eve before his crucifixion and shortly before his suffering in Gethsemane, fully aware that his “hour had come,” Jesus orchestrated events in an upper room'
  - where: setting
    claim: 'The discourses of 13–17, at the supper and on the way to the garden, are unique to John; taught to followers then and now; love and service, focused on Him as Savior and friend'
    key: huntsman-lamb-of-god
    url: 'https://rsc.byu.edu/behold-lamb-god/lamb-god-unique-aspects-passion-narrative-john'
    quote: 'The discourses of chapters 13–17 that Jesus delivers to His disciples, both at the Last Supper and along the way to the garden that would be the scene of His arrest, are unique to the Gospel of John. Here Jesus taught His followers, both then and now, fundamental principles of love and service, all firmly focused on His own role as Savior and friend.'
  - where: setting
    claim: 'John 14 ends with the call to go, and the going out over Cedron comes at 18:1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/18?lang=eng'
    quote: 'When Jesus had spoken these words, he went forth with his disciples over the brook Cedron, where was a garden'
  - where: setting
    claim: 'After “Arise, let us go hence” they may have left the upper room and been walking toward Gethsemane'
    key: olson-new-commandment
    url: 'https://rsc.byu.edu/his-majesty-mission/new-commandment'
    quote: 'Considering the sentence that immediately precedes the vine imagery, “Arise, let us go hence,” (John 14:31), perhaps Jesus and the Eleven had left the upper room and were walking toward Gethsemane'
  - where: setting
    claim: 'Chapters 14 and 16 are a pair on His departing, both setting the promise of the Comforter against their sorrow'
    key: huntsman-lamb-of-god
    url: 'https://rsc.byu.edu/behold-lamb-god/lamb-god-unique-aspects-passion-narrative-john'
    quote: 'Chapters 14 and 16 form a recognized doublet, in which Jesus teaches the necessity of His departing … In both chapters, Jesus balances the disciples’ sorrow at His departure with promises of the coming of a “helper” or “advocate”'
  - where: setting
    claim: 'Between them stands the vine: though He is not with them in body, they can abide in Him and draw life from Him'
    key: huntsman-lamb-of-god
    url: 'https://rsc.byu.edu/behold-lamb-god/lamb-god-unique-aspects-passion-narrative-john'
    quote: 'Chiastically placed between the chapters is Jesus’s allegory of the vine: even while He is not physically present with them, they can nonetheless abide in Him, drawing sustenance and life from Him as branches do from the main stem of a vine'
  - where: thread
    claim: '“Abide” seven times in verses 4–7'
    key: olson-new-commandment
    url: 'https://rsc.byu.edu/his-majesty-mission/new-commandment'
    quote: 'Jesus used the word abide seven times in four verses to describe the necessary relationship between fruitful branches and the vine.'
  - where: thread
    claim: 'Abiding is how they would live from Him when He was no longer present'
    key: huntsman-lamb-of-god
    url: 'https://rsc.byu.edu/behold-lamb-god/lamb-god-unique-aspects-passion-narrative-john'
    quote: 'even while He is not physically present with them, they can nonetheless abide in Him, drawing sustenance and life from Him'
  - where: thread
    claim: 'Verse 17 ends with love; verse 18 begins with the world''s hatred'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/15?lang=eng'
    quote: 'If the world hate you, ye know that it hated me before it hated you.'
  - where: thread
    claim: 'The Spirit is a witness in 15:26–27'
    key: huntsman-lamb-of-god
    url: 'https://rsc.byu.edu/behold-lamb-god/lamb-god-unique-aspects-passion-narrative-john'
    quote: 'identify His role not just as advocate but also as teacher, witness, prosecutor, and revealer (see John 14:15–18, 25–26; 15:26–27; 16:7–15)'

  # ---- note 15:2 (repaired)
  - where: 'note 15:2 “He purgeth it; ye are clean”'
    claim: 'The footnote glosses “purgeth” as purifies'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/15?lang=eng'
    quote: 'GR purifies.'
  - where: 'note 15:2 “He purgeth it; ye are clean”'
    claim: 'The two-step pruning: winter removal of dry branches; spring pinching of shoots on fruit-bearing branches for more fruit'
    key: olson-new-commandment
    url: 'https://rsc.byu.edu/his-majesty-mission/new-commandment'
    quote: 'In the winter, he cuts off and removes dry and withered branches, and when the vine spouts new leaves in the spring, he “purges” or pinches off smaller shoots from the fruit-bearing branches to concentrate nourishment on the good branches to produce even more fruit.'
  - where: 'note 15:2 “He purgeth it; ye are clean”'
    claim: 'Verse 2 gives the consequences for not bearing fruit and the pruning of fruitful branches'
    key: olson-new-commandment
    url: 'https://rsc.byu.edu/his-majesty-mission/new-commandment'
    quote: 'Jesus explained to the Eleven the consequences for not bearing fruit and the pruning necessary for branches if they will continue to produce good fruit.'
  - where: 'note 15:2 “He purgeth it; ye are clean”'
    claim: 'Elsewhere the word is rendered cleanse or purify, of moral stain; cleansing comes, which comes by repentance through faith that Christ will purge the evil'
    key: olson-new-commandment
    url: 'https://rsc.byu.edu/his-majesty-mission/new-commandment'
    quote: 'The Greek word here, translated “purge,” is other places rendered as “cleanse” or “purify,” as in morally free from stain, or “moral purity.” To be morally free from worldly stains requires us to repent through faith in Christ that he will purify or purge us from the evil.'
  - where: 'note 15:2 “He purgeth it; ye are clean”'
    claim: 'The cleansing is supported by hearing and heeding His word'
    key: olson-new-commandment
    url: 'https://rsc.byu.edu/his-majesty-mission/new-commandment'
    quote: 'these verses indicate that purging, propping up, and purifying are supported by spiritual nourishment received through hearing and heeding his spoken “word.”'

  # ---- note 15:6 (repaired)
  - where: 'note 15:5 “Without me ye can do nothing”'
    claim: 'Ezekiel 15:4: the vine is cast into the fire for fuel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/15?lang=eng'
    quote: 'Behold, it is cast into the fire for fuel; the fire devoureth both the ends of it, and the midst of it is burned. Is it meet for any work?'
  - where: 'note 15:7 “Ask what ye will”'
    claim: 'John 15:7 is among the passages on praying in Christ''s name, with the condition that His words abide in us'
    key: bd-prayer
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/prayer?lang=eng'
    quote: 'Christians are taught to pray in Christ’s name (John 14:13–14; 15:7, 16; 16:23–24). We pray in Christ’s name when our mind is the mind of Christ, and our wishes the wishes of Christ—when His words abide in us (John 15:7).'
  - where: 'note 15:7 “Ask what ye will”'
    claim: 'Where His words abide in us, we ask for what God can grant'
    key: bd-prayer
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/prayer?lang=eng'
    quote: 'We then ask for things it is possible for God to grant. Many prayers remain unanswered because they are not in Christ’s name at all; they in no way represent His mind but spring out of the selfishness of man’s heart.'

  # ---- note 15:13 (repaired)
  - where: 'note 15:13 “Greater love hath no man”'
    claim: 'He said it on the eve of the crucifixion, shortly before Gethsemane, aware His hour had come'
    key: olson-new-commandment
    url: 'https://rsc.byu.edu/his-majesty-mission/new-commandment'
    quote: 'On the eve before his crucifixion and shortly before his suffering in Gethsemane, fully aware that his “hour had come,” Jesus orchestrated events in an upper room to teach his disciples the transformative power of perfect love.'
  - where: 'note 15:13 “Greater love hath no man”'
    claim: 'Romans 5:8 makes the love greater still'
    key: olson-new-commandment
    url: 'https://rsc.byu.edu/his-majesty-mission/new-commandment'
    quote: 'The fact that “while we were yet sinners, Christ died for us” makes the power of such love all the more transcendent (Romans 5:8).'
  - where: 'note 15:13 “Greater love hath no man”'
    claim: 'The footnote to 15:13 “love” gives 1 John 3:16'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/15?lang=eng'
    quote: '1 Jn. 3:16 (10–18).'

