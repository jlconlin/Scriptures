  # ---- note 15:26 (repaired)
  - where: 'note 15:26 “Two witnesses”'
    claim: 'The Comforter is sent to believers because of Jesus''s absence; one role is witness'
    key: huntsman-lamb-of-god
    url: 'https://rsc.byu.edu/behold-lamb-god/lamb-god-unique-aspects-passion-narrative-john'
    quote: 'Even the five so-called Paraclete Sayings … identify His role not just as advocate but also as teacher, witness, prosecutor, and revealer (see John 14:15–18, 25–26; 15:26–27; 16:7–15). Jesus suggests that the Comforter is sent to do these things for believers because of Jesus’s absence'
  - where: 'note 15:26 “Two witnesses”'
    claim: 'By the power of the Holy Ghost one receives a testimony of Christ'
    key: bd-holy-ghost
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/holy-ghost?lang=eng'
    quote: 'The power can come upon one before baptism and is the convincing witness that the gospel is true. By the power of the Holy Ghost a person receives a testimony of Jesus Christ and of His work'
  - where: 'note 15:26 “Two witnesses”'
    claim: 'An Apostle''s calling is to be a special witness of Christ''s name, divinity and resurrection (Acts 1:22; D&C 107:23)'
    key: bd-apostle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/apostle?lang=eng'
    quote: 'The calling of an Apostle is to be a special witness of the name of Jesus Christ in all the world, particularly of His divinity and of His bodily resurrection from the dead (Acts 1:22; D&C 107:23).'
  - where: 'note 15:26 “Two witnesses”'
    claim: 'D&C 107:23 text'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/107?lang=eng'
    quote: 'The twelve traveling councilors are called to be the Twelve Apostles, or special witnesses of the name of Christ in all the world'
  - where: 'note 15:1 “The true vine”'
    claim: 'Alēthinos: genuine, opposed to what is imperfect, defective, frail'
    key: thayer
    url: 'https://biblehub.com/greek/228.htm'
    quote: 'c. opposed to what is imperfect, defective, frail, uncertain'
  - where: 'note 15:1 “The true vine”'
    claim: 'Thayer gives John 15:1 and John 6:32 under this sense'
    key: thayer
    url: 'https://biblehub.com/greek/228.htm'
    quote: 'ἄρτος, as nourishing the soul unto life everlasting, John 6:32; ἄμπελος, John 15:1'
  - where: 'note 15:26 “Two witnesses”'
    claim: '“From the beginning” is the beginning of the teaching and works they were to witness; compare Acts 1:21–22'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/15.htm'
    quote: 'Comp. John 1:7; and Notes on Acts 1:21-22. The “beginning” of course means the beginning of the Messianic teaching and works of which they were to be witnesses.'
  - where: 'note 15:16 “Chosen and ordained”'
    claim: 'The Twelve whom Jesus chose and ordained (John 15:16), sent forth to represent Him after His Ascension'
    key: bd-apostle
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/apostle?lang=eng'
    quote: 'It was the title Jesus gave (Luke 6:13) to the Twelve whom He chose and ordained (John 15:16) to be His closest disciples during His ministry on earth and whom He sent forth to represent Him after His Ascension into heaven.'
