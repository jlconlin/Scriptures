chapter: 13
claims:
  # ---- when, setting, thread
  - where: when
    claim: 'In the devotional chronology of Holy Week the last evening of Jesus’s life is Thursday'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'The events of the last evening of Jesus’s life, which in our devotional chronology occurred on Thursday, are some of the most significant'
  - where: setting
    claim: 'The second division of John is called the Book of Glory; Jesus is glorified and glorifies the Father through His death and resurrection'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'The Gospel’s second major division is often called “The Book of Glory” because John frequently describes the saving death and resurrection of Jesus as the means by which he is both glorified and glorifies the Father.'
  - where: setting
    claim: 'The discourses of chapters 13–17, at the supper and on the way to the garden, are found only in John'
    key: huntsman-lamb-of-god
    url: 'https://rsc.byu.edu/behold-lamb-god/lamb-god-unique-aspects-passion-narrative-john'
    quote: 'The discourses of chapters 13–17 that Jesus delivers to His disciples, both at the Last Supper and along the way to the garden that would be the scene of His arrest, are unique to the Gospel of John.'
  - where: setting
    claim: 'John does not record the institution of the sacrament at the supper'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'Given the importance of the institution of the sacrament of the Lord’s Supper, its absence in John’s account of the Last Supper is striking.'
  - where: setting
    claim: 'Luke does not tell of the foot washing but keeps the teaching that goes with it'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'While Luke does not directly recount the foot washing, it does preserve the associated teaching'
  - where: thread
    claim: 'Verse 1 sets the emphasis of chapters 13–17: Jesus’s loving service, with His sacrifice in mind'
    key: huntsman-lamb-of-god
    url: 'https://rsc.byu.edu/behold-lamb-god/lamb-god-unique-aspects-passion-narrative-john'
    quote: 'This verse establishes the emphasis of chapters 13–17, in which is found the loving service of Jesus, given with His coming sacrifice at Golgotha firmly in mind.'
  - where: thread
    claim: '“As I have loved you” has the foot washing in view'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/13.htm'
    quote: 'the special instance of love then present to the mind was the feet-washing upon which the whole of this discourse has followed.'

  # ---- note 13:1 Before the feast of the passover
  - where: 'note 13:1 “Before the feast of the passover”'
    claim: 'The Synoptics make the supper a Passover meal; in John the feast begins at sunset after Jesus dies'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'Whereas the Synoptics portray the Last Supper as a Passover meal (Matthew 26:17–20; Mark 14:12–17; Luke 22:1, 7–14), in John the festival began at sunset after Jesus died on the cross'
  - where: 'note 13:1 “Before the feast of the passover”'
    claim: 'First explanation: John moved the Passover for literary reasons, so that Jesus died as the lambs were sacrificed'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'One possibility is that the Synoptics are correct but John moved the Passover to the next evening for literary reasons so that Jesus’s death on the cross was taking place even as the paschal lambs were being sacrificed in the temple.'
  - where: 'note 13:1 “Before the feast of the passover”'
    claim: 'Second: John’s timing is the more historical, since the leaders wanted no arrest during the feast'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'John’s version bears more historical verisimilitude, since it was unlikely that an arrest, trial, and execution would have taken place during the festival itself'
  - where: 'note 13:1 “Before the feast of the passover”'
    claim: 'Third: Jesus held a symbolic Passover meal a day early'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'A third possibility is that Passover actually occurred after the Crucifixion but Jesus, knowing he would be dead before it was celebrated, held a symbolic Passover meal with his friends a day early.'

  # ---- note 13:1 Unto the end
  - where: 'note 13:1 “He loved them unto the end”'
    claim: 'Thayer: eis telos in John 13:1 is taken by some as to the uttermost, completely'
    key: thayer
    url: 'https://biblehub.com/greek/5056.htm'
    quote: 'John 13:1 (others, to the uttermost, completely (cf. our to the very last)'
  - where: 'note 13:1 “He loved them unto the end”'
    claim: 'In John Jesus knows all things before they happen, including 13:1–3'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'He knows the will of the Father perfectly and knows all things even before they happen (3:11; 7:29; 8:55; 10:15; 13:1–3; 18:4; 19:28).'
  - where: 'note 13:1 “He loved them unto the end”'
    claim: 'Verse 1 sets the emphasis of the chapters that follow'
    key: huntsman-lamb-of-god
    url: 'https://rsc.byu.edu/behold-lamb-god/lamb-god-unique-aspects-passion-narrative-john'
    quote: 'This verse establishes the emphasis of chapters 13–17, in which is found the loving service of Jesus, given with His coming sacrifice at Golgotha firmly in mind.'
  - where: 'note 13:1 “He loved them unto the end”'
    claim: 'Elder Holland: He set aside His own anguish to serve them, to the final hour and beyond'
    key: holland-loved-unto-end
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1989/10/he-loved-them-unto-the-end?lang=eng'
    quote: 'he would set aside his own increasing anguish in order that he might yet once more serve and strengthen them. It does not matter that no one washed his feet. In transcendent humility he would continue to teach and to cleanse them. He would to the final hour—and beyond—be their sustaining servant.'

  # ---- note 13:2 Supper being ended
  - where: 'note 13:2 “Supper being ended”'
    claim: 'The words should probably be rendered “supper time having come”; the supper was not ended'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/13.htm'
    quote: 'It should probably be, “And it now becoming supper time.” As a matter of fact, the supper was not ended (John 13:12; John 13:26); but they had already reclined, and were, as we say, ready for supper.'
  - where: 'note 13:2 “Supper being ended”'
    claim: 'Another reading: the supper proper was over, and the sop does not contradict it'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'is not inconsistent with John’s statement that the supper proper was ended before the washing of feet was performed; the act does not appear to have been so unusual as to cause surprise.'

  # ---- note 13:4 Laid aside his garments
  - where: 'note 13:4 “He laid aside his garments”'
    claim: '“Laid aside” and “taken” are the verbs of John 10:17–18, laying down and taking up His life'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'when Jesus removed (Greek, tithēsin; KJV, “laid aside”) his outer garments and then put them on again (Greek, elaben; KJV, “taken”), these are the same words Jesus used when he had earlier declared'
  - where: 'note 13:4 “He laid aside his garments”'
    claim: 'The washing and drying parallel Mary of Bethany’s anointing, which Jesus tied to His burial'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'are to some extent parallel to those of Mary of Bethany, who had anointed Jesus’s feet and then dried them with her hair, which Jesus had interpreted as being in anticipation of his death and burial'
  - where: 'note 13:4 “He laid aside his garments”'
    claim: 'With the towel about Him Jesus took the appearance of a servant, doing the lowliest servant’s task'
    key: olson-new-commandment
    url: 'https://rsc.byu.edu/his-majesty-mission/new-commandment'
    quote: 'Jesus replaced his traditional clothing with a towel draped around him, taking upon him the appearance of a servant and doing a task of the lowliest of servants.'

  # ---- note 13:5 The washing of feet
  - where: 'note 13:5 “Why wash their feet?”'
    claim: 'People usually washed their own feet on arriving; a poor host might do it for guests at a special dinner'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'Generally people washed their own feet upon entering a home, though it was a gesture of hospitality at an event such as a special dinner with the host, if poor, performing it for his guests upon their arrival.'
  - where: 'note 13:5 “Why wash their feet?”'
    claim: 'Otherwise servants, wives or disciples washed feet; doing it after the dinner was unusual'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'Usually, however, foot washing was done by servants, by a wife for her husband, or by disciples for their teacher.[34] Its performance after the dinner, however, was unusual and gives Jesus’s action special attention'
  - where: 'note 13:5 “Why wash their feet?”'
    claim: 'The task was so demeaning that aristocrats gave it only to non-Jewish slaves'
    key: olson-new-commandment
    url: 'https://rsc.byu.edu/his-majesty-mission/new-commandment'
    quote: 'Washing of feet was considered so demeaning that Jewish aristocrats would not assign their Jewish servants to perform the task; only non-Jewish slaves could be so charged.'
  - where: 'note 13:5 “Why wash their feet?”'
    claim: 'Two proposals for why John has no sacrament: its symbolism already in John 6, and paschal imagery kept for the crucifixion'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'John may have omitted it because he had already recorded Jesus’s use of its symbolism in the discourse on the bread of life'
  - where: 'note 13:5 “Why wash their feet?”'
    claim: 'Second proposal: John reserved the paschal imagery for the day of the crucifixion'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'Perhaps it is because this Gospel’s chronology and its imagery of Jesus as the Lamb of God reserved paschal imagery for the day of the crucifixion'
  - where: 'note 13:5 “Why wash their feet?”'
    claim: 'The commemorative sacrament may have mattered less to John until the sacrifice was made'
    key: huntsman-lamb-of-god
    url: 'https://rsc.byu.edu/behold-lamb-god/lamb-god-unique-aspects-passion-narrative-john'
    quote: 'Perhaps for John, who focused so single-mindedly on the death of Jesus as a sacrifice, the symbolism of the sacrament, which is above all commemorative, was not as significant until Jesus was actually sacrificed.'

  # ---- note 13:8 No part with me
  - where: 'note 13:8 “No part with me”'
    claim: '“Part” (meros) can mean a share or inheritance, the disciple’s place in the kingdom'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: '“a place” (Greek, meros; KJV, “part”) can refer to a share or inheritance, again suggesting the future place of the disciple in the future kingdom.'
  - where: 'note 13:8 “No part with me”'
    claim: 'Peter objects not to being washed but to Christ being the one to do it'
    key: belnap-dust-feet
    url: 'https://rsc.byu.edu/our-rites-worship/those-who-receive-you-not-rite-wiping-dust-off-feet'
    quote: 'It is important to note that Peter is not saying that he does not need his feet washed, only that he desires that Christ not be the one to do it.'
  - where: 'note 13:8 “No part with me”'
    claim: 'The rite is not chiefly for cleansing but tied to having part with Him'
    key: belnap-dust-feet
    url: 'https://rsc.byu.edu/our-rites-worship/those-who-receive-you-not-rite-wiping-dust-off-feet'
    quote: 'Thus the purpose of the rite is not solely to clean, and apparently not to purify, but is associated with “having part with him.”'
  - where: 'note 13:8 “No part with me”'
    claim: 'JST 13:8: “Thou needest not to wash my feet”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-john/13?lang=eng'
    quote: 'Peter saith unto him, Thou needest not to wash my feet.'

  # ---- note 13:10 He that is washed
  - where: 'note 13:10 “Bathed, and washed”'
    claim: 'Two Greek verbs, louō (bathe) and niptō (wash), both rendered “wash”'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'Because of the difference between the verbs for bathe (Greek, louō; KJV, “wash”) and wash (Greek, niptō; KJV, also “wash”), traditional commentary has often distinguished between initial baptism, or bathing, and subsequent repentance, or washing,'
  - where: 'note 13:10 “Bathed, and washed”'
    claim: 'Latter-day Saints may see allusions to other ordinances'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'Latter-day Saints may see allusions to other sacred ordinances.'
  - where: 'note 13:10 “Bathed, and washed”'
    claim: 'JST 13:10 reads hands and head, and adds the custom of the Jews under their law'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-john/13?lang=eng'
    quote: 'He that has washed his hands and his head, needeth not save to wash his feet, but is clean every whit; and ye are clean, but not all. Now this was the custom of the Jews under their law; wherefore, Jesus did this that the law might be fulfilled.'
  - where: 'note 13:10 “Bathed, and washed”'
    claim: 'It is unclear which instruction of the law the JST refers to'
    key: belnap-dust-feet
    url: 'https://rsc.byu.edu/our-rites-worship/those-who-receive-you-not-rite-wiping-dust-off-feet'
    quote: 'Unfortunately, it is unclear which specific instruction found in the law of Moses is being referenced'
  - where: 'note 13:10 “Bathed, and washed”'
    claim: 'Exodus 30:19–21: priests washed hands and feet before service in the tabernacle'
    key: belnap-dust-feet
    url: 'https://rsc.byu.edu/our-rites-worship/those-who-receive-you-not-rite-wiping-dust-off-feet'
    quote: 'In Exodus 30:19–21, we are told that Aaron and his sons, as priests, are to wash hands and feet prior to service in the tabernacle so that they do not die.'
  - where: 'note 13:10 “Bathed, and washed”'
    claim: 'The text implies Jesus washed the feet of Judas too'
    key: belnap-dust-feet
    url: 'https://rsc.byu.edu/our-rites-worship/those-who-receive-you-not-rite-wiping-dust-off-feet'
    quote: 'Moreover, the text implies that he washes the feet of Judas, who the author says is the one who is unclean.'

  # ---- note 13:14 Wash one another's feet
  - where: 'note 13:14 “Ye also ought to wash one another’s feet”'
    claim: 'The washing is used here as the paramount example of service, the greatest serving the least'
    key: huntsman-lamb-of-god
    url: 'https://rsc.byu.edu/behold-lamb-god/lamb-god-unique-aspects-passion-narrative-john'
    quote: 'The washing of the disciples’ feet, while no doubt connected with other higher ordinances, is used here as a paramount example of service.'
  - where: 'note 13:14 “Ye also ought to wash one another’s feet”'
    claim: 'D&C 88:141: the one who administers the ordinance girds himself after the pattern of John 13'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/88?lang=eng'
    quote: 'It is to be commenced with prayer; and after partaking of bread and wine, he is to gird himself according to the pattern given in the thirteenth chapter of John’s testimony concerning me.'
  - where: 'note 13:14 “Ye also ought to wash one another’s feet”'
    claim: 'An 1832 revelation required members of the School of the Prophets to take part in the washing of feet'
    key: church-history-topics-washing-feet
    url: 'https://www.churchofjesuschrist.org/study/history/topics/washing-of-feet?lang=eng'
    quote: 'A revelation to Joseph Smith in December 1832 required participants in the School of the Prophets to participate in the washing of feet.'
  - where: 'note 13:14 “Ye also ought to wash one another’s feet”'
    claim: 'Joseph Smith called it a restoration of the New Testament practice, to unite hearts and prepare for an endowment'
    key: church-history-topics-washing-feet
    url: 'https://www.churchofjesuschrist.org/study/history/topics/washing-of-feet?lang=eng'
    quote: 'Joseph Smith explained to members of the school that the “ordinance of washing of feet” was a restoration of the New Testament practice “calculated to unite our hearts” and prepare the elders for an endowment of spiritual power.'

  # ---- note 13:19 That I am he
  - where: 'note 13:19 “That I am he”'
    claim: 'JST 13:19 reads “the Christ” for “he”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/13?lang=eng'
    quote: 'JST John 13:19 … the Christ.'
  - where: 'note 13:19 “That I am he”'
    claim: '13:19 is one of John’s absolute “I am” sayings'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'Absolute “I Am” statements: 4:26, 6:20, 8:24, 8:28, 8:58, 13:19, and 18:5'
  - where: 'note 13:19 “That I am he”'
    claim: 'Egō eimi renders the divine name of Exodus 3:14 in the Septuagint'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'The Greek phrase egō eimi was used in the Septuagint, or Greek translation of the Old Testament, to render the phrase “I Am that I Am”'

  # ---- note 13:23 The disciple whom Jesus loved
  - where: 'note 13:23 “The disciple whom Jesus loved”'
    claim: 'They reclined at a low three-sided table'
    key: olson-new-commandment
    url: 'https://rsc.byu.edu/his-majesty-mission/new-commandment'
    quote: 'Remembering that the men would have been reclining around a triclinium, the traditional three-sided table that rested on or near the ground, makes this scene easier to imagine.'
  - where: 'note 13:23 “The disciple whom Jesus loved”'
    claim: 'Each guest leaned on his left arm, his head near the bosom of the guest beside him'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/13.htm'
    quote: 'like most paintings of the Lord’s Supper, has not represented the method in which the guests reclined rather than sat at table. Each leaned on his left arm, leaving the right arm free.'
  - where: 'note 13:23 “The disciple whom Jesus loved”'
    claim: 'Here the beloved disciple is first named so, in Jesus’s bosom as Jesus is in the Father’s (1:18)'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'at the Last Supper he is identified for the first time as “the one whom Jesus loved,” resting in Jesus’s embrace (ēn anakeimenos. . . en tōi kolpōi tou Iēsou; KJV, “leaning on Jesus’s bosom) just as Jesus himself is in the bosom of the Father'
  - where: 'note 13:23 “The disciple whom Jesus loved”'
    claim: 'The beloved disciple can serve as the ideal disciple'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'Accordingly, the Beloved Disciple can serve as the ideal disciple, a model to which each of us can aspire as he invites us to rest in the arms of the Lord’s love.'
  - where: 'note 13:23 “The disciple whom Jesus loved”'
    claim: 'The Bible Dictionary: John refers to himself as the disciple whom Jesus loved'
    key: bd-john
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/john?lang=eng'
    quote: 'In his own Gospel he refers to himself as “the disciple whom Jesus loved” (John 13:23; 19:26; 20:2; 21:7, 20)'
  - where: 'note 13:23 “The disciple whom Jesus loved”'
    claim: 'D&C 7:1: the Lord calls John “my beloved”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/7?lang=eng'
    quote: 'And the Lord said unto me: John, my beloved, what desirest thou?'

  # ---- note 13:27 Satan entered into him
  - where: 'note 13:27 “Satan entered into him”'
    claim: 'Verse 2: the devil had put it into Judas’s heart to betray Him'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/13.htm'
    quote: 'The better reading is, The devil having now put it into the heart, that Judas Iscariot, Simon’s son, should betray Him. But the sense must be that of our version, “The heart of Judas” (the devil having suggested).'
  - where: 'note 13:27 “Satan entered into him”'
    claim: 'Handing a dipped morsel to another at table was nothing unusual'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'There was nothing unusual for a person at table, particularly the host, to dip a piece of bread into the dish of gravy or savory mixture, and hand it to another. Such action on the part of Jesus attracted no general attention.'
  - where: 'note 13:27 “Satan entered into him”'
    claim: 'One reading: Judas’s heart was hardened further by finding that Jesus knew'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'His heart was all the more hardened by the discovery that Jesus knew of his infamous plans, and he was maddened by the humiliation he felt in the Master’s presence.'
  - where: 'note 13:27 “Satan entered into him”'
    claim: 'One reading: after the morsel the mind finally cast out love and gave itself to Satan'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/13.htm'
    quote: 'The Greek expresses more vividly the very moment when the mind finally cast out love, and left itself as a possession for Satan.'
  - where: 'note 13:27 “Satan entered into him”'
    claim: '“Quickly” is literally “more quickly”'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/13.htm'
    quote: 'That thou doest, do quickly.—The Greek is exactly, more quickly. “Carry out your plans even more quickly than you have proposed. Do the fatal deed at once. It is resolved, and every effort to win thee has failed. A fixed resolve is nothing less than the deed itself.”'

  # ---- note 13:30 It was night
  - where: 'note 13:30 “And it was night”'
    claim: 'The words state the fact that night had fallen'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/13.htm'
    quote: 'These words doubtless state the physical fact that at the time when Judas left the room the darkness of night had already come on.'
  - where: 'note 13:30 “And it was night”'
    claim: 'He went from the Light of the World into darkness'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/13.htm'
    quote: 'he stepped forth from light into darkness; from the presence and guidance of the Light of the World, to be possessed by and guided by the prince of darkness.'
  - where: 'note 13:30 “And it was night”'
    claim: 'The words recall John 11:10'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/13.htm'
    quote: 'St. John could hardly have written these words without remembering those he had written but a short time before: “If a man walk in the night, he stumbleth, because there is no light in him.”'

  # ---- note 13:31 Now is the Son of man glorified
  - where: 'note 13:31 “Now is the Son of man glorified”'
    claim: 'Judas’s going out signals that the death is at hand; Jesus speaks of the glory as present'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/13.htm'
    quote: 'The going out of Judas is the sign that the betrayal and death of the Son of Man was at hand. In that was the glory of His accomplished work, and He speaks of this glory as present.'
  - where: 'note 13:31 “Now is the Son of man glorified”'
    claim: 'In verse 32 the tense turns to the future, the glory of the Father’s throne'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/13.htm'
    quote: 'The tense now changes to the future, and the glory thought of is that of the Father’s throne.'
  - where: 'note 13:31 “Now is the Son of man glorified”'
    claim: 'In John’s second half Jesus is glorified and glorifies the Father through His death and resurrection'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'John frequently describes the saving death and resurrection of Jesus as the means by which he is both glorified and glorifies the Father.'

  # ---- note 13:34 A new commandment
  - where: 'note 13:34 “A new commandment”'
    claim: 'The question why it is new, when He had taught love from the start'
    key: yarn-night-before
    url: 'https://www.churchofjesuschrist.org/study/ensign/1975/07/the-night-before-he-died?lang=eng'
    quote: 'For one acquainted with Jesus’ teachings it is natural to ask, “Why did he call this a new commandment when he had been teaching love from the beginning of his ministry?”'
  - where: 'note 13:34 “A new commandment”'
    claim: 'The new criterion: not oneself, but the Lord'
    key: yarn-night-before
    url: 'https://www.churchofjesuschrist.org/study/ensign/1975/07/the-night-before-he-died?lang=eng'
    quote: 'No longer was it adequate for man to use his own mortal self as the criterion for loving, but he was to use the divine criterion, namely the Lord himself.'
  - where: 'note 13:34 “A new commandment”'
    claim: '1 John 2:7–8: old and new; the Lord the embodiment of the commandment'
    key: yarn-night-before
    url: 'https://www.churchofjesuschrist.org/study/ensign/1975/07/the-night-before-he-died?lang=eng'
    quote: 'The Lord was “the true light,” the personal embodiment or personification of that commandment.'
  - where: 'note 13:34 “A new commandment”'
    claim: 'Disciples must love one another specifically, not only mankind in general'
    key: yarn-night-before
    url: 'https://www.churchofjesuschrist.org/study/ensign/1975/07/the-night-before-he-died?lang=eng'
    quote: 'to love mankind in general is not sufficient; disciples must love each other specifically.'
  - where: 'note 13:34 “A new commandment”'
    claim: '“As I have loved you” points to the fact of His love, and the foot washing in particular'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/13.htm'
    quote: 'The word “as,” or “even as,” does not refer to the degree of His love, but to the fact; and the special instance of love then present to the mind was the feet-washing'
  - where: 'note 13:34 “A new commandment”'
    claim: '“Little children” is a word of tenderness Jesus uses only here; John uses it in his first epistle'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/13.htm'
    quote: 'He addresses them as “Little children,” with a word of tenderness spoken only here by Him. The word impressed itself upon the mind of St. John, and it occurs elsewhere in the New Testament only in his First Epistle'

  # ---- note 13:36 Thou shalt follow me afterwards
  - where: 'note 13:36 “Thou shalt follow me afterwards”'
    claim: 'In John Peter first asks a genuine question rather than boasting'
    key: huntsman-peters-denial
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/accounts-peters-denial-understanding-texts-motifs'
    quote: 'Peter’s response in this Gospel is not at first a self-confident declaration that he will never be offended but a seemingly genuine question'
  - where: 'note 13:36 “Thou shalt follow me afterwards”'
    claim: 'Peter would later follow his Master more literally than he knew (John 21:18–19)'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/13.htm'
    quote: 'he would hereafter follow his Master in a more literal sense than any of which he thought. (See Notes on John 21:18-19.)'

  # ---- note 13:38 The cock shall not crow
  - where: 'note 13:38 “Till thou hast denied me thrice”'
    claim: 'Peter echoes the good shepherd’s words of John 10:11'
    key: huntsman-peters-denial
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/accounts-peters-denial-understanding-texts-motifs'
    quote: 'Here Peter seems to be purposefully echoing the words of Jesus in the Discourse on the Good Shepherd (see John 10:11) as he affirms his willingness to die for Jesus.'
  - where: 'note 13:38 “Till thou hast denied me thrice”'
    claim: 'Peter would be able to follow because his Lord would lay down His life for him'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/13.htm'
    quote: 'there is a solemn emphasis in the repetition of what St. Peter had said. He was using words of which he knew not the full meaning. He spoke of laying down his life for his Lord. He would hereafter be able to follow, because his Lord would lay down His own life for him.'
  - where: 'note 13:38 “Till thou hast denied me thrice”'
    claim: 'Some Latter-day Saints have read the words as a command so Peter could survive to lead the Church'
    key: huntsman-peters-denial
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/accounts-peters-denial-understanding-texts-motifs'
    quote: 'Such commentators have suggested that Jesus had given such direction to Peter so that the Apostle, otherwise an ardent supporter and defender of his lord, could elude arrest and trial that terrible night, thereby surviving to lead the church.'
  - where: 'note 13:38 “Till thou hast denied me thrice”'
    claim: 'John’s construction cannot be a command'
    key: huntsman-peters-denial
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/accounts-peters-denial-understanding-texts-motifs'
    quote: 'On the other hand, neither the Lucan nor the Johannine accounts allow the verb to be a future.'
  - where: 'note 13:38 “Till thou hast denied me thrice”'
    claim: 'John makes “shall not crow” emphatic with a double negative'
    key: huntsman-peters-denial
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/accounts-peters-denial-understanding-texts-motifs'
    quote: 'which differs only in making “shall not crow” more emphatic with a double negative in Greek'

  # ---- christ, explore
