  # ---- rows added in revision
  - where: 'note 13:1 “Before the feast of the passover”'
    claim: 'If John is right, the Synoptics may have moved the timing to underscore the likeness to the sacrament'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'In this case, perhaps the Synoptics had moved the timing of the Passover to underscore the feast’s similarity with the sacrament, the institution of which they record but John does not.'
  - where: 'note 13:1 “Before the feast of the passover”'
    claim: 'Jesus as the Lamb of God, the Passover lamb, explains John’s timing'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'This association of Jesus with the Passover lamb explains many of the unique features of the Passion narrative in John that differ from the versions presented by the Synoptics. First, it helps explain differences in the timing of the Last Supper and the Crucifixion.'
  - where: 'note 13:4 “He laid aside his garments”'
    claim: 'The laying aside of garments pictures His laying down and taking up His life'
    key: olson-new-commandment
    url: 'https://rsc.byu.edu/his-majesty-mission/new-commandment'
    quote: 'Like his garments that he laid aside to pour out water to cleanse others, the Savior laid down his life, poured out or emptied himself, and took up his life again—all to save each one of us.'
  - where: 'note 13:8 “No part with me”'
