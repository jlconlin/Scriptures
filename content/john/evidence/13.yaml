    key: belnap-dust-feet
    url: 'https://rsc.byu.edu/our-rites-worship/those-who-receive-you-not-rite-wiping-dust-off-feet'
    quote: 'the assumption being that if the washing of feet allows one to have “part” with Christ, then the washing of everything demonstrates Peter’s full commitment.'
