chapter: 1
claims:
  - where: setting
    claim: 'The Gospel never names its author'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'Like the other Gospels, the Gospel of John is formally anonymous, meaning that its text never directly identifies its author.'
  - where: setting
    claim: 'The Bible Dictionary: John son of Zebedee, who calls himself the disciple whom Jesus loved'
    key: bd-john
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/john?lang=eng'
    quote: 'One of the Twelve; son of Zebedee and brother of James. … In his own Gospel he refers to himself as “the disciple whom Jesus loved” (John 13:23; 19:26; 20:2; 21:7, 20)'
  - where: setting
    claim: 'D&C 7:1–3 equates John with the beloved disciple of John 21:20–23'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'Doctrine and Covenants 7:1–3, a revelation that seems to have been received because of a discussion that Joseph Smith and Oliver Cowdery had about the fate of the Apostle John, directly equates John with the “the disciple whom Jesus loved” in John 21:20–23.'
  - where: setting
    claim: 'The JST titles the book “The Testimony of St. John”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/1?lang=eng'
    quote: 'JST entitles this book “The Testimony of St. John.”'
  - where: setting
    claim: 'Dating: often the AD 90s; some evidence could suggest earlier'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'Scholars frequently suggest a date in the A.D. 90s … On the other hand, the lack of any reference to the destruction of Jerusalem in A.D. 70, present tense statements in the description of the pool of Bethesda in John 5:2, and the fact that it seems to be unaware of the other Gospels could be taken to suggest an earlier date'
  - where: setting
    claim: 'John differs from the other three; written to members who already knew the basics, to emphasize the divine nature of Jesus'
    key: bd-gospels
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/gospels?lang=eng'
    quote: 'John’s account does not contain much of the fundamental information that the other records contain, and it is evident that he was writing to members of the Church who already had basic information about the Lord. His primary purpose was to emphasize the divine nature of Jesus'
  - where: setting
    claim: 'John is different in vocabulary, phraseology and presentation'
    key: bd-gospels
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/gospels?lang=eng'
    quote: 'John’s record is quite different from the other three in vocabulary, phraseology, and presentation of events.'
  - where: setting
    claim: 'Chapter 1 is the prologue: the Logos Hymn (1–18) presents Jesus in cosmic terms'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'The prologue is an introduction that first presents Jesus in cosmic and thematic terms and then provides the first template of how his disciples come to believe in and follow him. John first presents Jesus in what is often called the Logos Hymn (1:1–18)'
  - where: setting
    claim: 'In John the Baptist’s primary role is to bear witness; he is called “the Baptist” in the Synoptics'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'the prophet John (1:6–8, 15), known as “the Baptist” in the Synoptics.[28] In the Fourth Gospel his primary role is to bear witness of the Word.'
  - where: thread
    claim: 'The second half of the chapter is a chain of witnesses and sets the “come and see” template'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'he is the first in a chain of witnesses when he declares to two of his own followers that Jesus is the Lamb of God (1:29, 39). As they then go and find others who become Jesus’s first disciples, they set the pattern'
  - where: setting
    claim: 'Logos is the Greek for “word”'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'logos is the Greek term for “word”'
  - where: 'note 1:1 “Why Jesus is called the Word”'
    claim: 'John 1:1 deliberately echoes Genesis 1:1; the Logos is the means by which God creates'
    key: lane-word-made-flesh
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/god-incarnate-word-made-flesh'
    quote: 'The Gospel of John sets out a clear preexistence Christology, beginning by referencing Genesis 1 and the Creation'
  - where: 'note 1:1 “Why Jesus is called the Word”'
    claim: 'Logos is the equivalent of the Hebrew daḇar; Psalm 147:18 ties God’s word to His creative power'
    key: lane-word-made-flesh
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/god-incarnate-word-made-flesh'
    quote: 'The Logos is the equivalent of the Old Testament Hebrew term daḇar. In addition to the repetition of “God said” in the creation account of Genesis, in Psalm 147:18 God’s creative power is connected to his word'
  - where: 'note 1:1 “Why Jesus is called the Word”'
    claim: 'John uses biblical language his audience understood, not the philosophers’ Logos'
    key: lane-word-made-flesh
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/god-incarnate-word-made-flesh'
    quote: 'While there were contemporary philosophical issues related to the concept of the Logos, the Gospel of John is distinct from the philosophical or theological efforts of contemporary Jews or later Christians.'
  - where: 'note 1:1 “Why Jesus is called the Word”'
    claim: 'Logos has a wide range of meanings; the Word represents God’s will, plan and intent and the means by which He communicates'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'logos is the Greek term for “word” as well as a wide semantic range of related concepts. Echoing the opening of the creation story when God brought forth first light and then all of creation by speaking (Genesis 1:3–2:3), John describes Jesus as the Word, representing God’s will, plan, and intent'
  - where: 'note 1:1 “Why Jesus is called the Word”'
    claim: 'D&C 93:8: the Word, the messenger of salvation'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/93?lang=eng'
    quote: 'Therefore, in the beginning the Word was, for he was the Word, even the messenger of salvation—'
  - where: 'note 1:1 “The Joseph Smith Translation: the gospel preached through the Son”'
    claim: 'JST John 1:1'
    key: jst-john-1
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-john/1?lang=eng'
    quote: 'In the beginning was the gospel preached through the Son. And the gospel was the word, and the word was with the Son, and the Son was with God, and the Son was of God.'
  - where: 'note 1:1 “The Joseph Smith Translation: the gospel preached through the Son”'
    claim: 'The theme of the JST changes in John 1: the Word is unambiguously the Son of God'
    key: lefevre-christology-jst
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/christology-joseph-smith-translation-gospel'
    quote: 'The JST makes several changes in this chapter; the theme of the changes is making the identification of “the Word” unambiguous: he is “the Son of God.”'
  - where: 'note 1:1 “The Joseph Smith Translation: the gospel preached through the Son”'
    claim: 'JST John has few christological changes, John’s Christology already being high'
    key: lefevre-christology-jst
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/christology-joseph-smith-translation-gospel'
    quote: 'the already high Christology of John may have required fewer changes. Indeed, JST John includes very few christological changes, and not many of significance.'
  - where: 'note 1:1 “The Joseph Smith Translation: the gospel preached through the Son”'
    claim: 'JST 1:10 and 1:16 add “Even the Son of God” and “the Word, even the Son … sent unto us by the will of the Father”'
    key: jst-john-1
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-john/1?lang=eng'
    quote: 'For in the beginning was the Word, even the Son, who is made flesh, and sent unto us by the will of the Father.'
  - where: 'note 1:1 “The Joseph Smith Translation: the gospel preached through the Son”'
    claim: 'John presents both that Jesus is sent by the Father and does His will, and that He is God'
    key: lane-word-made-flesh
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/god-incarnate-word-made-flesh'
    quote: 'The Gospel of John gives a witness of two equally true points of Christ’s nature: his divinity and his obedience to the Father.'
  - where: 'note 1:5 “Comprehended: the darkness did not take hold of the light”'
    claim: 'Thayer: katalambanō in John 1:5, to lay hold of so as to make one’s own'
    key: thayer
    url: 'https://biblehub.com/greek/2638.htm'
    quote: '1. to lay hold of so as to make one''s own, to obtain, attain to'
  - where: 'note 1:5 “Comprehended: the darkness did not take hold of the light”'
    claim: 'JST John 1:5: the world perceiveth it not'
    key: jst-john-1
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-john/1?lang=eng'
    quote: 'And the light shineth in the world, and the world perceiveth it not.'
  - where: 'note 1:5 “Comprehended: the darkness did not take hold of the light”'
    claim: 'D&C 88:49 repeats the verse and adds a promise'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/88?lang=eng'
    quote: 'The light shineth in darkness, and the darkness comprehendeth it not; nevertheless, the day shall come when you shall comprehend even God, being quickened in him and by him.'
  - where: 'note 1:12 “Power to become the sons of God”'
    claim: 'The Restoration doctrine of spirit children stands with Christ’s unique standing as the one through whom we become sons and daughters of God'
    key: lane-word-made-flesh
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/god-incarnate-word-made-flesh'
    quote: 'While we do want to preserve the power of this Restoration doctrine of our being spirit children of God, it must be combined with an appreciation and reverence for the unique status of Christ as the Only Begotten and the one through whom we become “the sons [and daughters] of God” (John 1:12).'
  - where: 'note 1:12 “Power to become the sons of God”'
    claim: 'Because Jesus created the world, He can re-create us as His sons and daughters'
    key: lane-word-made-flesh
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/god-incarnate-word-made-flesh'
    quote: 'Having confidence that Jesus created the world gives confidence that he can re-create us in his image, as his sons and daughters.'
  - where: 'note 1:12 “Power to become the sons of God”'
    claim: 'The gift of the Holy Ghost and new life in Christ explain being “born of God”'
    key: lane-word-made-flesh
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/god-incarnate-word-made-flesh'
    quote: 'The connection between the reception of the gift of the Holy Ghost and a new life in Christ is a critical gospel insight that can help to explain the concept of being “born of God.”'
  - where: 'note 1:14 “Dwelt: He pitched His tent among us”'
    claim: 'The Greek is eskēnōsen from skēnoō, to dwell in a tent; it could be translated “tabernacled among us”'
    key: lane-word-made-flesh
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/god-incarnate-word-made-flesh'
    quote: 'this could literally be translated “tabernacled [eskēnōsen] among us” from skeneoō, to dwell in a tent. In the Septuagint the noun form of that verb, skēnē, is used to translate the Hebrew term for tabernacle (miškān). John is the only New Testament Gospel to use this verb.'
  - where: 'note 1:14 “Dwelt: He pitched His tent among us”'
    claim: 'Thayer: skēnoō, to have one’s tabernacle, live in a tent'
    key: thayer
    url: 'https://biblehub.com/greek/4637.htm'
    quote: '"to fix one''s tabernacle, have one''s tabernacle, abide (or live) in a tabernacle (or tent), tabernacle"'
  - where: 'note 1:14 “Dwelt: He pitched His tent among us”'
    claim: 'The tabernacle was where the glory of the Lord was manifest; John ties it to “we beheld his glory”'
    key: lane-word-made-flesh
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/god-incarnate-word-made-flesh'
    quote: 'John continues this connection to the Old Testament Tabernacle by emphasizing the “glory” that was made manifest in the incarnation.'
  - where: 'note 1:14 “Dwelt: He pitched His tent among us”'
    claim: 'The verb connects Jesus with Jehovah who dwelt with Israel in the wilderness; Jesus portrayed as Jehovah thinly veiled in flesh'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'it connects Jesus with YHWH, or Jehovah, who had earlier dwelt with his people in the wilderness. … From that point on, John’s portrayal of Jesus is that of Jehovah only thinly veiled in flesh as he walks and works among his people.'
  - where: 'note 1:14 “Dwelt: He pitched His tent among us”'
    claim: '“Tabernacled among us” sheds light on Mosiah 3:5'
    key: lane-word-made-flesh
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/god-incarnate-word-made-flesh'
    quote: 'John’s use of the expression “tabernacled among us” gives deeper insight to the angel’s teaching to King Benjamin in Mosiah 3'
  - where: 'note 1:16 “Grace for grace”'
    claim: 'D&C 93:12–13: He received not of the fulness at first'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/93?lang=eng'
    quote: 'And I, John, saw that he received not of the fulness at the first, but received grace for grace;'
  - where: 'note 1:16 “Grace for grace”'
    claim: 'D&C 93 reworks John’s words so that the Son progresses from grace to grace'
    key: frederick-dc-john
    url: 'https://rsc.byu.edu/you-shall-have-my-word/illuminating-text-doctrine-covenants-through-gospel-john'
    quote: 'In the Gospel of John , no mention is made about the Son not receiving of the fulness; rather, it is we who receive “grace for grace” due to our encounter with him.'
  - where: 'note 1:16 “Grace for grace”'
    claim: 'D&C 93:20 promises grace for grace to the obedient'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/93?lang=eng'
    quote: 'For if you keep my commandments you shall receive of his fulness, and be glorified in me as I am in the Father; therefore, I say unto you, you shall receive grace for grace.'
  - where: 'note 1:16 “Grace for grace”'
    claim: 'It is not always clear which John D&C 93 means'
    key: sc-knowhy-809
    url: 'https://scripturecentral.org/knowhy/the-fulness-of-the-record-of-john'
    quote: 'it is not always clear which John (John the Baptist or the Apostle John) is referenced.'
  - where: 'note 1:16 “Grace for grace”'
    claim: 'JST John 1:16: the fulness is immortality and eternal life'
    key: jst-john-1
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-john/1?lang=eng'
    quote: 'And of his fullness have all we received, even immortality and eternal life, through his grace.'
  - where: 'note 1:18 “No man hath seen God?”'
    claim: 'The KJV verse seems to contradict passages and Joseph Smith’s experience; the JST harmonizes it and stresses the Father’s witness of the Son'
    key: sc-knowhy-628
    url: 'https://scripturecentral.org/knowhy/why-did-joseph-smith-produce-a-new-translation-of-the-bible'
    quote: 'a confusing teaching which contradicts a fair number of passages in both the Old and New Testaments as well as the experiences of the Prophet Joseph Smith in the First Vision and on other occasions.'
  - where: 'note 1:18 “No man hath seen God?”'
    claim: 'The JST change emphasizes the Father’s witness on behalf of the Son'
    key: sc-knowhy-628
    url: 'https://scripturecentral.org/knowhy/why-did-joseph-smith-produce-a-new-translation-of-the-bible'
    quote: 'emphasizing the divine role of God the Father in witnessing on behalf of the Son'
  - where: 'note 1:18 “No man hath seen God?”'
    claim: 'JST John 1:19'
    key: jst-john-1
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-john/1?lang=eng'
    quote: 'And no man hath seen God at any time, except he hath borne record of the Son; for except it is through him no man can be saved.'
  - where: 'note 1:18 “No man hath seen God?”'
    claim: 'D&C 67:11'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/67?lang=eng'
    quote: 'For no man has seen God at any time in the flesh, except quickened by the Spirit of God.'
  - where: 'note 1:18 “No man hath seen God?”'
    claim: 'Moses saw God with spiritual eyes, transfigured'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/1?lang=eng'
    quote: 'But now mine own eyes have beheld God; but not my natural, but my spiritual eyes, for my natural eyes could not have beheld'
  - where: 'note 1:18 “No man hath seen God?”'
    claim: 'Joseph Smith saw two Personages'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/js-h/1?lang=eng'
    quote: 'When the light rested upon me I saw two Personages, whose brightness and glory defy all description, standing above me in the air.'
  - where: 'note 1:19 “Who sent the priests and Levites”'
    claim: '“The Jews” used negatively in John refers to the leadership or a group of opponents'
    key: matson-fourth-gospel
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/fourth-gospel-expectations-jewish-messiah'
    quote: 'The expression “the Jews” (Greek hoi Ioudaioi) occurs frequently in John, often negatively. In these instances, it appears to refer to either the Jewish leadership or a specific group of opponents to Jesus.'
  - where: 'note 1:19 “Who sent the priests and Levites”'
    claim: 'The Baptist’s work drew enough attention that the council (Sanhedrin) sent an official inquiry from Jerusalem'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/1.htm'
    quote: 'Emphasis is laid upon the fact that the work of John had excited so much attention that the Sanhedrin sent from Jerusalem to make an official inquiry. The judgment of the case of a false prophet is specially named in the Mishna as belonging to the Council of the Seventy One.'
  - where: 'note 1:19 “Who sent the priests and Levites”'
    claim: 'Part of the Levites’ work was to teach the law'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/1.htm'
    quote: 'part of the function of the Levites was to give instruction in the Law'
  - where: 'note 1:21 “Elias, and that prophet”'
    claim: 'Elias is the Greek form of Elijah; also a title for a forerunner and for a restorer; John the preparer, Jesus the Restorer'
    key: bd-elias
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/elias?lang=eng'
    quote: 'These passages are sufficiently clarified to show that anciently two Eliases were spoken of, one as a preparer and the other a restorer. John was sent to prepare the way for Jesus, Jesus Himself being the Restorer who brought back the gospel and the Melchizedek Priesthood to the Jews in His day'
  - where: 'note 1:21 “Elias, and that prophet”'
    claim: 'Elias as the Greek form of Elijah'
    key: bd-elias
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/elias?lang=eng'
    quote: 'It is the New Testament (Greek) form of Elijah (Hebrew)'
  - where: 'note 1:21 “Elias, and that prophet”'
    claim: 'The questioners knew something of the doctrine of Elias; only revelation to Joseph Smith brings it into focus'
    key: bd-elias
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/elias?lang=eng'
    quote: 'It is evident from the questions they asked that both the Jewish leaders and the disciples of Jesus knew something about the doctrine of Elias, but the fragmentary information in our current Bibles is not sufficient'
  - where: 'note 1:21 “Elias, and that prophet”'
    claim: 'JST John 1:22: not that Elias who was to restore all things'
    key: jst-john-1
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-john/1?lang=eng'
    quote: 'And they asked him, saying; How then art thou Elias? And he said, I am not that Elias who was to restore all things.'
  - where: 'note 1:21 “Elias, and that prophet”'
    claim: 'JST John 1:28: Jesus is that prophet, even Elias'
    key: jst-john-1
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-john/1?lang=eng'
    quote: 'He it is of whom I bear record. He is that prophet, even Elias, who, coming after me, is preferred before me'
  - where: 'note 1:21 “Elias, and that prophet”'
    claim: 'Jesus said “Elias is come already” and yet John says in the questioners’ sense he is not Elias; “the prophet” draws on Deut. 18:15 and Mal. 4:5'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/1.htm'
    quote: 'The Lord declared “Elias is come already” (Matthew 18:12-13), and yet the Forerunner can assert that, in the literal sense in which they ask the question and would understand the answer, he is not Elias'
  - where: 'note 1:21 “Elias, and that prophet”'
    claim: 'Joseph Smith: the spirit of Elias is a going before to prepare the way'
    key: tpjs-2007-ch-6
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-6?lang=eng'
    quote: 'for the spirit of Elias was a going before to prepare the way for the greater, which was the case with John the Baptist.'
  - where: 'note 1:21 “Elias, and that prophet”'
    claim: 'The risen Lord identifies Himself as the prophet of whom Moses spoke'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/20?lang=eng'
    quote: 'Behold, I am he of whom Moses spake, saying: A prophet shall the Lord your God raise up unto you of your brethren, like unto me'
  - where: 'note 1:28 “Bethabara, the place Lehi named”'
    claim: 'The site of Bethabara is uncertain'
    key: judd-nephi-vision
    url: 'https://rsc.byu.edu/things-which-my-father-saw/what-nephis-vision-teaches-about-bible-book-mormon'
    quote: 'Even though it is uncertain precisely where the ancient site of Bethabara is located today, Lehi’s prophecy nonetheless confirms the location mentioned in John 1:28.'
  - where: 'note 1:28 “Bethabara, the place Lehi named”'
    claim: '“Beyond Jordan” means the east side; earliest manuscripts read Bethany; Origen and Chrysostom claimed most early manuscripts read Bethabara'
    key: judd-nephi-vision
    url: 'https://rsc.byu.edu/things-which-my-father-saw/what-nephis-vision-teaches-about-bible-book-mormon'
    quote: 'The phrase “beyond Jordan” normally refers to the east side of the Jordan River (see John 10:40). The earliest extant manuscripts containing John 1:28 actually read “Bethany” rather than “Bethabara.”'
  - where: 'note 1:28 “Bethabara, the place Lehi named”'
    claim: 'Origen and Chrysostom on the manuscripts'
    key: judd-nephi-vision
    url: 'https://rsc.byu.edu/things-which-my-father-saw/what-nephis-vision-teaches-about-bible-book-mormon'
    quote: 'The early Church fathers Origen and John Chrysostom, however, claimed that most early and accurate manuscripts, which apparently have not survived to the present day, contained the reading “Bethabara.”'
  - where: 'note 1:28 “Bethabara, the place Lehi named”'
    claim: 'If Origen and Chrysostom were right, the Book of Mormon confirms Bethabara; or Bethany is original and Bethabara a corruption from the similar Greek spelling'
    key: judd-nephi-vision
    url: 'https://rsc.byu.edu/things-which-my-father-saw/what-nephis-vision-teaches-about-bible-book-mormon'
    quote: 'It is possible that Origen and Chrysostom were correct and that the Book of Mormon confirms that “Bethabara” is the original reading. Or it is possible that the original reading is “Bethany” and that, because the two names are spelled so similarly in Greek'
  - where: 'note 1:28 “Bethabara, the place Lehi named”'
    claim: 'If so, Joseph Smith may have relied on the KJV wording in translating 1 Ne. 10:9; either way Lehi’s prophecy confirms John’s account of the location'
    key: judd-nephi-vision
    url: 'https://rsc.byu.edu/things-which-my-father-saw/what-nephis-vision-teaches-about-bible-book-mormon'
    quote: 'it may be that Joseph Smith simply relied upon his knowledge of the wording in the King James Version of the Bible when translating 1 Nephi 10:9'
  - where: 'note 1:28 “Bethabara, the place Lehi named”'
    claim: 'Either way, Lehi’s prophecy confirms John’s account of the location'
    key: judd-nephi-vision
