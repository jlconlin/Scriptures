    quote: '“Abraham”: Gen. 22:8 (8–14); Hel. 8:17 (16–19).'
  - where: 'note 8:56 “Abraham rejoiced to see my day”'
    claim: 'Abraham saw the Messiah’s coming from afar; they reject Him present; “my day” is His coming on earth'
