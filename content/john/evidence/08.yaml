chapter: 8
claims:
  # ---- setting, thread
  - where: setting
    claim: 'The Feast of Tabernacles was over by John 8, likely not long over; Jesus was still teaching in the temple'
    key: gardner-tabernacles
    url: 'https://rsc.byu.edu/learn-me/jesus-christ-feast-tabernacles'
    quote: 'Although the Feast of Tabernacles was over by the time we come to John 8, it had likely not been over for very long (see John 8:2). Jesus was still teaching in the temple in Jerusalem.'
  - where: setting
    claim: 'Jesus taught in the Treasury, connected with the Court of the Women'
    key: talmage-jesus-christ-25
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-25?lang=eng'
    quote: 'Sitting within the temple enclosure in the division known as the Treasury, which was connected with the Court of the Women, our Lord continued His teaching'
  - where: thread
    claim: 'They heard the I AM at 8:24 without perceiving it; at 8:58 there is no room for doubt'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/8.htm'
    quote: 'They had heard this I AM before (John 8:24) without perceiving that in it He applied to Himself the name Jehovah. Now there is no room for doubt.'
  - where: thread
    claim: 'The argument over fathers: their works show they are not Abraham’s true children; a spiritual father is meant'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/8.htm'
    quote: 'their works prove that they are not the true children of Abraham (John 8:39-40). They see that a spiritual father is intended, and they will claim God as their Father.'

  - where: setting
    claim: 'The lampstands of the feast were lit in the Court of the Women'
    key: gardner-tabernacles
    url: 'https://rsc.byu.edu/learn-me/jesus-christ-feast-tabernacles'
    quote: 'the gates of the temple were left open so the public could gather in the Court of the Women[12] and participate in the lighting of four giant lampstands'
  - where: thread
    claim: 'The men in the temple drop their stones against the woman and take them up against Jesus minutes later'
    key: densley-adultery
    url: 'https://interpreterfoundation.org/journal/procedural-violations-in-the-trial-of-the-woman-taken-in-adultery'
    quote: 'it is curious that those present in the temple would feel inspired to drop the stones they held for use against the adulteress and then pick them up again to use against Jesus only a few minutes later (John 8:59).'
  - where: section 3 plain
    claim: '8:24 has egō eimi with no predicate; the KJV supplies “he”'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'While the King James Version sometimes provides the predicate he, yielding “I am he,” these passages are better read as an appositive to the main clause.'
  - where: section 3 plain
    claim: 'The Greek of 8:24'
    key: greek-nt
    url: 'https://biblehub.com/texts/john/8-24.htm'
    quote: 'ἐὰν γὰρ μὴ πιστεύσητε ὅτι ἐγώ εἰμι'
  - where: section 4 plain
    claim: '8:31 is better rendered “those Jews who had believed Him”'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/8.htm'
    quote: '(31) Then said Jesus to those Jews which believed on him.—Better, to those Jews who had believed Him.'

  # ---- sections
  - where: section 4 plain
    claim: '“Convinceth” means convicts, reproves'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/8?lang=eng'
    quote: '“convinceth”: GR convicts, reproves.'
  - where: section 5 plain
    claim: '8:58 is better rendered “Before Abraham was born, I am”'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/8.htm'
    quote: '(58) Before Abraham was, I am.—Better, Before Abraham was born, I am.'

  # ---- notes
  - where: 'note 8:1 “What the missing manuscripts mean”'
    claim: 'The earliest Greek manuscript with the passage is Codex Bezae, fifth century'
    key: densley-adultery
    url: 'https://interpreterfoundation.org/journal/procedural-violations-in-the-trial-of-the-woman-taken-in-adultery'
    quote: 'The earliest Greek manuscript known to contain the passage is Codex Bezae, of the fifth century'
  - where: 'note 8:1 “What the missing manuscripts mean”'
    claim: 'Absent from many diverse manuscripts; style and vocabulary differ from the rest of John'
    key: densley-adultery
    url: 'https://interpreterfoundation.org/journal/procedural-violations-in-the-trial-of-the-woman-taken-in-adultery'
    quote: 'It was absent from a large number of diverse manuscripts, no Greek Church Father for 1,000 years after Christ referred to the passage as being part of the fourth Gospel, the style and vocabulary differ from the rest of the Gospel of John'
  - where: 'note 8:1 “What the missing manuscripts mean”'
    claim: 'Metzger: the story shows strong signs of historical veracity; possibly an authentic story not authored by John'
    key: densley-adultery
    url: 'https://interpreterfoundation.org/journal/procedural-violations-in-the-trial-of-the-woman-taken-in-adultery'
    quote: 'Metzger has observed that the story shows strong signs of historical veracity.'
  - where: 'note 8:1 “What the missing manuscripts mean”'
    claim: 'Wayment: strong external support that it originated with Jesus; included because it likely describes a historical event'
    key: densley-adultery
    url: 'https://interpreterfoundation.org/journal/procedural-violations-in-the-trial-of-the-woman-taken-in-adultery'
    quote: 'it is included in the text because it has a reasonable likelihood of describing a historical event from the life of Jesus.'
  - where: 'note 8:1 “What the missing manuscripts mean”'
    claim: 'Even if not an original part of John, the story need not be apocryphal'
    key: densley-adultery
    url: 'https://interpreterfoundation.org/journal/procedural-violations-in-the-trial-of-the-woman-taken-in-adultery'
    quote: 'even if the episode was not an original part of the Gospel of John, we need not necessarily conclude that the story was apocryphal.'
  - where: 'note 8:1 “What the missing manuscripts mean”'
    claim: 'The Joseph Smith Translation keeps the story and adds to 8:11'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/8?lang=eng'
    quote: 'JST John 8:11 … more. And the woman glorified God from that hour, and believed on his name.'

  - where: 'note 8:5 “The law and the trap”'
    claim: 'Adultery in the law meant intercourse between a man and a married woman'
    key: densley-adultery
    url: 'https://interpreterfoundation.org/journal/procedural-violations-in-the-trial-of-the-woman-taken-in-adultery'
    quote: 'Adultery in the law referred specifically to sexual intercourse between a man and a married woman (Leviticus 20:10; Deuteronomy 22:22–24).'
  - where: 'note 8:5 “The law and the trap”'
    claim: 'The law required both to be executed; the man is conspicuously absent'
    key: densley-adultery
    url: 'https://interpreterfoundation.org/journal/procedural-violations-in-the-trial-of-the-woman-taken-in-adultery'
    quote: 'A further indication that the accusers were corrupt is the conspicuous absence of the male offender. The law required that both culprits be executed (Leviticus 20:10; Deuteronomy 22:22).'
  - where: 'note 8:5 “The law and the trap”'
    claim: 'The woman was likely set up to be caught in the act'
    key: densley-adultery
    url: 'https://interpreterfoundation.org/journal/procedural-violations-in-the-trial-of-the-woman-taken-in-adultery'
    quote: 'it does seem likely the woman was entrapped or set up to be caught in the act.'
  - where: 'note 8:5 “The law and the trap”'
    claim: 'Roman law did not make adultery capital until the third century; the Sanhedrin may not have been allowed to try capital cases'
    key: densley-adultery
    url: 'https://interpreterfoundation.org/journal/procedural-violations-in-the-trial-of-the-woman-taken-in-adultery'
    quote: 'Under Roman law, adultery was not a capital offense until the third century ad. Furthermore, Derrett claims the Sanhedrin was not allowed to try cases involving capital crimes.'
  - where: 'note 8:5 “The law and the trap”'
    claim: 'Either answer could be used against Him: before Rome, or as contrary to Moses'
    key: densley-adultery
    url: 'https://interpreterfoundation.org/journal/procedural-violations-in-the-trial-of-the-woman-taken-in-adultery'
    quote: 'If Jesus were to say that the woman should be stoned, as Mosaic law provided, the accusers could go to the Roman authorities … if Jesus said the woman should not be executed, they could have accused Jesus of preaching doctrine contrary to the law of Moses.'

  - where: 'note 8:7 “Let him first cast a stone”'
    claim: 'The footnote at “first” points to Deut. 17:7'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/8?lang=eng'
    quote: '“first”: Deut. 17:7.'
  - where: 'note 8:7 “Let him first cast a stone”'
    claim: 'The law required two witnesses, who cast the first stones'
    key: densley-adultery
    url: 'https://interpreterfoundation.org/journal/procedural-violations-in-the-trial-of-the-woman-taken-in-adultery'
    quote: 'The Law of Moses required that in the case of capital punishment, at least two witnesses to the offense were required, and that the witnesses should be those to initiate the execution by casting the first stones (Deuteronomy 17:6–7).'
  - where: 'note 8:7 “Let him first cast a stone”'
    claim: 'Jesus’s words may have been a legal reference implying the accusers were liable themselves'
    key: densley-adultery
    url: 'https://interpreterfoundation.org/journal/procedural-violations-in-the-trial-of-the-woman-taken-in-adultery'
    quote: 'the words of Jesus may actually have been a legal reference that implied that the accusers may be'
  - where: 'note 8:7 “Let him first cast a stone”'
    claim: 'The issue was the competence of the accusers, not capital punishment'
    key: densley-adultery
    url: 'https://interpreterfoundation.org/journal/procedural-violations-in-the-trial-of-the-woman-taken-in-adultery'
    quote: 'Clearly, capital punishment was not the issue but rather the competence of the accusers to carry out the punishment.'
  - where: 'note 8:7 “Let him first cast a stone”'
    claim: 'No one knows what Jesus wrote'
    key: densley-adultery
    url: 'https://interpreterfoundation.org/journal/procedural-violations-in-the-trial-of-the-woman-taken-in-adultery'
    quote: 'Although no one really knows what Jesus scribbled in the dust, many have speculated about what Jesus might have written there.'
  - where: 'note 8:7 “Let him first cast a stone”'
    claim: 'Proposals: the accusers’ names, after Jer. 17:13; a text of the law on witnesses'
    key: densley-adultery
    url: 'https://interpreterfoundation.org/journal/procedural-violations-in-the-trial-of-the-woman-taken-in-adultery'
    quote: 'Some have suggested that Jesus wrote the names of the wicked accusers on the floor of the temple, acting out the prophecy of Jeremiah 17:13'
  - where: 'note 8:7 “Let him first cast a stone”'
    claim: 'Derrett proposes a text of law on accusation and execution'
    key: densley-adultery
    url: 'https://interpreterfoundation.org/journal/procedural-violations-in-the-trial-of-the-woman-taken-in-adultery'
    quote: 'Derrett further speculates that the writing was a text of law having to do with accusation and execution of offenders.'
  - where: 'note 8:7 “Let him first cast a stone”'
    claim: 'The finger writing recalls the finger of Jehovah writing the commandments'
    key: densley-adultery
    url: 'https://interpreterfoundation.org/journal/procedural-violations-in-the-trial-of-the-woman-taken-in-adultery'
    quote: 'brings to mind the finger of Jehovah writing the words of the ten commandments (Exodus 31:18; Deuteronomy 9:10).'
  - where: 'note 8:7 “Let him first cast a stone”'
    claim: 'Jesus disarmed them by compelling them to examine themselves'
    key: oaks-stand-for-truth
    url: 'https://www.churchofjesuschrist.org/study/broadcasts/worldwide-devotional-for-young-adults/2023/05/11oaks?lang=eng'
    quote: 'First, the Savior effectively disarmed those who sought immediate application of the law. He did this by compelling them to examine themselves.'

  - where: 'note 8:11 “Neither do I condemn thee”'
    claim: 'He declined to condemn; the law would apply later, at a judgment on her whole life including repentance'
    key: oaks-stand-for-truth
    url: 'https://www.churchofjesuschrist.org/study/broadcasts/worldwide-devotional-for-young-adults/2023/05/11oaks?lang=eng'
    quote: 'He mercifully declined to condemn the woman, and that loving act lifted her to a new life. The application of the law would come later, when she would be judged on the whole of her life, including repentance.'
  - where: 'note 8:11 “Neither do I condemn thee”'
    claim: '“Go, and sin no more” affirmed the law'
    key: oaks-stand-for-truth
    url: 'https://www.churchofjesuschrist.org/study/broadcasts/worldwide-devotional-for-young-adults/2023/05/11oaks?lang=eng'
    quote: 'the Savior extended love and mercy by refraining from condemning, and then affirmed the law by saying, “Go, and sin no more.”'
  - where: 'note 8:11 “Neither do I condemn thee”'
    claim: 'The footnote at “sin” points to D&C 42:25'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/8?lang=eng'
    quote: '“sin”: D&C 42:25.'
  - where: 'note 8:11 “Neither do I condemn thee”'
    claim: 'JST 8:11 adds that she glorified God and believed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/8?lang=eng'
    quote: 'And the woman glorified God from that hour, and believed on his name.'

  - where: 'note 8:12 “The light of the world”'
    claim: 'Four giant lampstands lit in the Court of the Women at Tabernacles'
    key: gardner-tabernacles
    url: 'https://rsc.byu.edu/learn-me/jesus-christ-feast-tabernacles'
    quote: 'the gates of the temple were left open so the public could gather in the Court of the Women[12] and participate in the lighting of four giant lampstands, each over seventy feet (twenty-one meters) tall.'
  - where: 'note 8:12 “The light of the world”'
    claim: 'Said to light every courtyard in Jerusalem'
    key: gardner-tabernacles
    url: 'https://rsc.byu.edu/learn-me/jesus-christ-feast-tabernacles'
    quote: 'The light from the lampstands was so bright that it was said to light up every courtyard in Jerusalem.'
  - where: 'note 8:12 “The light of the world”'
    claim: 'The lampstands were fresh in the hearers’ minds'
    key: gardner-tabernacles
    url: 'https://rsc.byu.edu/learn-me/jesus-christ-feast-tabernacles'
    quote: 'Undoubtedly, the recent display of the giant burning lampstands was fresh in the minds of those who heard Jesus proclaim, “I am the light of the world'
  - where: 'note 8:12 “The light of the world”'
    claim: 'Zechariah 14 was read at the lighting; by the claim Jesus declared Himself the Messiah'
    key: gardner-tabernacles
    url: 'https://rsc.byu.edu/learn-me/jesus-christ-feast-tabernacles'
    quote: 'By proclaiming himself as the Light of the World and the Light of Life in context of these recently transpired festivities, Jesus declared unequivocally that he was indeed the Messiah of whom the prophets of old had testified.'
  - where: 'note 8:12 “The light of the world”'
    claim: 'Zechariah 14 was read during the lighting ceremony'
    key: gardner-tabernacles
    url: 'https://rsc.byu.edu/learn-me/jesus-christ-feast-tabernacles'
    quote: 'Zechariah 14 was read during the lighting ceremony previously described.'
  - where: 'note 8:12 “The light of the world”'
    claim: 'The Treasury was connected with the Court of the Women, where the lamps stood'
    key: talmage-jesus-christ-25
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-25?lang=eng'
    quote: 'Sitting within the temple enclosure in the division known as the Treasury, which was connected with the Court of the Women, our Lord continued His teaching'
  - where: 'note 8:12 “The light of the world”'
    claim: 'Christ is the light of the world as the source of the light that fills space (D&C 88:12)'
    key: oaks-light-life-world
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1987/10/the-light-and-life-of-the-world?lang=eng'
    quote: 'Jesus Christ is the light of the world because he is the source of the light which “proceedeth forth from the presence of God to fill the immensity of space” (D&C 88:12).'
  - where: 'note 8:12 “The light of the world”'
    claim: 'Three ways: the light that quickens understanding, teachings and example, power that persuades to good'
    key: oaks-light-life-world
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1987/10/the-light-and-life-of-the-world?lang=eng'
    quote: 'Jesus Christ is the light of the world because he is the source of the light that quickens our understanding, because his teachings and his example illuminate our path, and because his power persuades us to do good.'

  - where: 'note 8:14 “Yet my record is true”'
    claim: 'The Pharisees bring a technical objection He had Himself admitted (5:31)'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/8.htm'
    quote: 'The Pharisees, standing probably in the front of the crowd listening to Him, bring a technical objection to His statement, and one which He had Himself admitted the force of.'
  - where: 'note 8:14 “Yet my record is true”'
    claim: 'He fulfilled the law of evidence and will again (8:17–18), but claims first that the law cannot apply to Him'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/8.htm'
    quote: 'He had before quoted their law of evidence (John 5:31), and showed that He fulfilled its canons. He is about to show this again (John 8:17-18), but He claims first that in reality the law cannot apply to Him.'
  - where: 'note 8:14 “Yet my record is true”'
    claim: 'No human witness could testify to such a truth'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/8.htm'
    quote: 'They claim the evidence of a witness, to a truth for which there could not possibly be a human witness.'

  - where: 'note 8:22 “Will he kill himself?”'
    claim: 'The hearers were a mixed assemblage of Pharisees, scribes, rabbis, priests, Levites and lay people'
    key: talmage-jesus-christ-25
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-25?lang=eng'
    quote: 'Again addressing the mixed assemblage, which probably comprized Pharisees, scribes, rabbis, priests, Levites, and lay people'
  - where: 'note 8:22 “Will he kill himself?”'
    claim: 'The question implied they would not follow Him, since in their teaching Gehenna was the place of suicides'
    key: talmage-jesus-christ-25
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-25?lang=eng'
    quote: 'Some of them asked querulously, “Will he kill himself?” the implication being that in such case they surely would not follow Him; for according to their dogma, Gehenna was the place of suicides'
  - where: 'note 8:22 “Will he kill himself?”'
    claim: 'Gehenna is a valley of Jerusalem, used figuratively for the place of everlasting punishment'
    key: strongs-greek
    url: 'https://biblehub.com/greek/1067.htm'
    quote: 'ge-henna (or Ge-Hinnom), a valley of Jerusalem, used (figuratively) as a name for the place (or state) of everlasting punishment'

  - where: 'note 8:24 “That I am he”'
    claim: 'The Greek of 8:24 ends with egō eimi, no “he”'
    key: greek-nt
    url: 'https://biblehub.com/texts/john/8-24.htm'
    quote: 'ἐὰν γὰρ μὴ πιστεύσητε ὅτι ἐγώ εἰμι, ἀποθανεῖσθε ἐν ταῖς ἁμαρτίαις ὑμῶν.'
  - where: 'note 8:24 “That I am he”'
    claim: 'Absolute I Am sayings have no predicate; the KJV supplies “he”'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'More significantly, however, are seven absolute “I Am” sayings, where egō eimi appears without a predicate. While the King James Version sometimes provides the predicate he, yielding “I am he,” these passages are better read as an appositive to the main clause.'
  - where: 'note 8:24 “That I am he”'
    claim: 'egō eimi rendered Ex. 3:14 in the Septuagint'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'The Greek phrase egō eimi was used in the Septuagint, or Greek translation of the Old Testament, to render the phrase “I Am that I Am”'
  - where: 'note 8:24 “That I am he”'
    claim: 'They heard the I AM at 8:24 without perceiving it'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/8.htm'
    quote: 'They had heard this I AM before (John 8:24) without perceiving that in it He applied to Himself the name Jehovah.'

  - where: 'note 8:28 “When ye have lifted up the Son of man”'
    claim: 'Hypsoō is used of the elevation of Jesus on the cross'
    key: thayer
    url: 'https://biblehub.com/greek/5312.htm'
    quote: 'used of the elevation of Jesus on the cross, John 3:14'
  - where: 'note 8:28 “When ye have lifted up the Son of man”'
    claim: 'Comparing 8:28 and 12:32, Jesus likely meant also the exaltation He would reach through the cross'
    key: thayer
    url: 'https://biblehub.com/greek/5312.htm'
    quote: 'a careful comparison of John 8:28 and John 12:32 renders it probable that Jesus spoke of the heavenly exaltation which he was to attain by the crucifixion'
  - where: 'note 8:28 “When ye have lifted up the Son of man”'
    claim: 'John interprets “lifted up” as the manner of His death'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/12?lang=eng'
    quote: 'This he said, signifying what death he should die.'

  - where: 'note 8:31 “Disciples indeed”'
    claim: 'Those who believe are of the rulers'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/8.htm'
    quote: 'Those who believe are of the rulers (“those Jews,” John 8:31).'
  - where: 'note 8:31 “Disciples indeed”'
    claim: 'He tested their faith and they failed the first steps of discipleship'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/8.htm'
    quote: 'He has tested their faith, and they fail in the first steps of discipleship.'
  - where: 'note 8:31 “Disciples indeed”'
    claim: 'As a party they were seeking to kill Him; by their answer the believers identified themselves with His opponents'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/8.htm'
    quote: 'As a party, they had been, and still were, seeking to kill Him. These believers, by their question in John 8:33, were showing the spirit which declined discipleship, were identifying themselves with His opponents.'
  - where: 'note 8:31 “Disciples indeed”'
    claim: 'They may have accepted Jesus as a prophet or potential political Messiah'
    key: gardner-tabernacles
    url: 'https://rsc.byu.edu/learn-me/jesus-christ-feast-tabernacles'
    quote: 'Speaking to a group who may have consented to accept Jesus as a prophet or as a potential political Messiah'

  - where: 'note 8:33 “Never in bondage”'
    claim: 'At Tabernacles they lived in booths remembering deliverance from Egypt'
    key: gardner-tabernacles
    url: 'https://rsc.byu.edu/learn-me/jesus-christ-feast-tabernacles'
    quote: 'For a whole week, the pilgrims who gathered to Jerusalem for the Feast of Tabernacles lived in booths to commemorate their wandering in the wilderness after God delivered them from bondage in Egypt'
  - where: 'note 8:33 “Never in bondage”'
    claim: 'The claim came after a week commemorating deliverance from Pharaoh, while subject to Rome'
    key: gardner-tabernacles
    url: 'https://rsc.byu.edu/learn-me/jesus-christ-feast-tabernacles'
    quote: 'How could they say that they were “never in bondage to any man” (John 8:33) when they had just spent a week commemorating their deliverance from Pharaoh and when they were currently subject to the emperor of Rome?'
  - where: 'note 8:33 “Never in bondage”'
    claim: 'They followed His turn from physical to spiritual bondage'
    key: gardner-tabernacles
    url: 'https://rsc.byu.edu/learn-me/jesus-christ-feast-tabernacles'
    quote: 'they seem to have followed his transition from physical bondage and deliverance to spiritual bondage.'
  - where: 'note 8:33 “Never in bondage”'
    claim: 'A servant stays in the house by sufferance; a son has his place by right'
    key: talmage-jesus-christ-25
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-25?lang=eng'
    quote: 'was allowed in the master’s house by sufferance only; it was not his inherent right to remain there; his owner could send him away at any time, and might even sell him to another; but a son of the family had of his own right a place in his father’s home.'

  - where: 'note 8:44 “Whose children?”'
    claim: 'Physical seed of Abraham but not his ethical children; a true child bears the father’s moral impress in works'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/8.htm'
    quote: 'They are the physical seed of the patriarch, but they are not the ethical children, for the true child would bear the moral impress of the father which would be seen in his works.'
  - where: 'note 8:44 “Whose children?”'
    claim: '“Fornication” in the prophets was a symbol of idolatry; they claim never to have been idolaters'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/8.htm'
    quote: 'the word became in the Old Testament prophets a frequent symbol for idolatry.'
  - where: 'note 8:44 “Whose children?”'
    claim: 'The father of the thoughts and acts of those He addresses is the devil'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/8.htm'
    quote: 'The relation between father and son is maintained, but the father of the thoughts and acts of those to whom He speaks was not God, not Abraham, but the devil.'
  - where: 'note 8:44 “Whose children?”'
    claim: '“Murderer” is suggested by their seeking to kill Him'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/8.htm'
