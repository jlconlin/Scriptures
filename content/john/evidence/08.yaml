    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/8.htm'
    quote: 'The thought is, “Thou art still a young man, and hast thou seen Abraham who died twenty centuries ago?”'

  - where: 'note 8:58 “Before Abraham was, I am”'
    claim: 'The Greek: prin Abraam genesthai, egō eimi'
    key: greek-nt
    url: 'https://biblehub.com/texts/john/8-58.htm'
    quote: 'πρὶν Ἀβραὰμ γενέσθαι, ἐγώ εἰμι.'
  - where: 'note 8:58 “Before Abraham was, I am”'
    claim: 'Abraham came into being; the Son never did'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/8.htm'
    quote: 'The answer is that Abraham, like all men, came into being. There was a time when he was not. But there was never a time when the Son of God was not.'
  - where: 'note 8:58 “Before Abraham was, I am”'
    claim: 'The footnote: the Greek I Am is the Septuagint usage of Ex. 3:14 which identifies Jehovah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/8?lang=eng'
    quote: 'The term I Am used here in the Greek is identical with the Septuagint usage in Ex. 3:14 which identifies Jehovah.'
  - where: 'note 8:58 “Before Abraham was, I am”'
    claim: 'Jehovah means the eternal I Am'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'The covenant or proper name of the God of Israel. It denotes the “Unchangeable One,” “the eternal I Am”'
  - where: 'note 8:58 “Before Abraham was, I am”'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: 'note 8:58 “Before Abraham was, I am”'
    claim: 'egō eimi is the Septuagint’s rendering of Ex. 3:14 and close to the root of YHWH'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'It is also close to the root meaning of the name-title YHWH, which comes from the Hebrew verb to be.'
  - where: 'note 8:58 “Before Abraham was, I am”'
    claim: 'They heard it as blasphemy and took up stones'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/8.htm'
    quote: 'They will not acknowledge the claim, but they feel that He has made it. They have heard the fearful words which seemed to them as blasphemy'

