    url: 'https://biblehub.com/commentaries/ellicott/john/8.htm'
    quote: 'contrasts the exultation of him whom they claimed as father, when he saw from afar the Messianic advent, with their rejection of the Messiah who is actually among them.'
  - where: 'note 8:56 “Abraham rejoiced to see my day”'
