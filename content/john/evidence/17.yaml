chapter: 17
claims:
  # ---- when, setting, thread
  - where: when
    claim: 'The prayer came at the end of the Last Supper, the evening before the trials and crucifixion'
    key: christofferson-one-in-christ
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2023/04/41christofferson?lang=eng'
    quote: 'The evening before the trials and crucifixion that awaited Him, Jesus joined in a Passover meal with His Apostles. At the end of this Last Supper, in a sacred Intercessory Prayer, Jesus petitioned His Father'
  - where: setting
    claim: 'After the discourses of 14–16 Jesus prays to His Father; the Synoptics contain nothing like these final words'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'In the Gospel of John at the conclusion of the Last Supper Jesus delivers several extended discourses to his disciples (John 14:1‒16:33), after which he delivers an intimate prayer to his Father (John 17:1‒26). … the Synoptics contain nothing like Jesus’s final words to his disciples found in John.'
  - where: setting
    claim: 'The discourses were given in the upper room and then apparently on the walk to Gethsemane; they apply to disciples in every age; the prayer is called the Intercessory Prayer or the Great High Priestly Prayer'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'first in the Upper Room and then, apparently, as they walked from the city through the Qidron Valley to the Garden of Gethsemane. … written in a way that they apply to disciples in every age. They conclude in John 17:1‒26 with a powerful prayer … known as either the “Intercessory Prayer” or sometimes as the “Great High Priestly Prayer.”'
  - where: setting
    claim: 'The prayer is followed at once by the departure to Gethsemane and the arrest'
    key: hamblin-john-17
    url: 'https://interpreterfoundation.org/journal/i-have-revealed-your-name-the-hidden-temple-in-john-17'
    quote: 'John 17, the conclusion of this discourse, is an extended prayer, in which Jesus blesses the disciples. It is immediately followed by Jesus’s departure to Gethsemane, arrest (John 18:1–19)'
  - where: setting
    claim: 'Jesus also gave an intercessory prayer for the people of ancient America'
    key: nelson-lords-prayers
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2009/04/lessons-from-the-lords-prayers?lang=eng'
    quote: 'An intercessory prayer was also given by Jesus for the people of ancient America.'
  - where: setting
    claim: 'The Synoptics describe Jesus’s experiences in Gethsemane'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'Matthew and Luke largely parallel Mark’s description of Jesus’s experiences in Gethsemane'
  - where: setting
    claim: 'The Nephite prayer has the words of John 17:11, 21–23'
    key: sc-knowhy-213
    url: 'https://scripturecentral.org/knowhy/why-is-3-nephi-important-for-understanding-the-godhead'
    quote: 'He prayed that His disciples may be one with Him just as He and the Father are one (3 Nephi 19:23, 29; cf. John 17:11, 21–23).'
  - where: 'note 17:3 “To know God”'
    claim: 'D&C 132 was recorded July 12, 1843'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/132?lang=eng'
    quote: 'Revelation given through Joseph Smith the Prophet, at Nauvoo, Illinois, recorded July 12, 1843'
  - where: thread
    claim: 'In the prayer Jesus linked eternal life with knowing God, being one with God, and loving with God’s love'
    key: olson-know-god
    url: 'https://rsc.byu.edu/let-us-reason-together/know-god-life-eternal'
    quote: 'In his prayer, Jesus linked eternal life with knowing God, being one with God, and loving others with God’s pure love.'
  - where: thread
    claim: 'The prayer is for Himself (1–5), for the disciples (6–19), and for all believers (20–26)'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/17.htm'
    quote: '(a)For Himself; the glory of the Son (John 17:1-5); … (b)For the disciples; their union with the Father and the Son (John 17:6-19); … (c)For all believers; their union (John 17:20-21)'
  # ---- sections
  - where: 'note 17:9 “I pray not for the world”'
    claim: '“I pray for them” is a strict present: “I am praying for them”'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/17.htm'
    quote: 'Better, I am praying for them: I am not praying for the world.'
  - where: section 2 plain
    claim: '“Is lost” is better “perished”'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/17.htm'
    quote: 'Better, None of them perished, except the son of perdition.'
  # ---- note 17:1 “The Intercessory Prayer”
  - where: 'note 17:1 “The Intercessory Prayer”'
    claim: 'It is called intercessory because the Lord interceded with His Father for His disciples'
    key: nelson-lords-prayers
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2009/04/lessons-from-the-lords-prayers?lang=eng'
    quote: 'They are so named because the Lord prayerfully interceded with His Father for the benefit of His disciples.'
  - where: 'note 17:1 “The Intercessory Prayer”'
    claim: 'Also called the High Priest’s Prayer, with reference to 17:19'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/17.htm'
    quote: 'It is often spoken of as the High Priest’s Prayer (comp. John 17:19).'
  - where: 'note 17:1 “The Intercessory Prayer”'
    claim: '“To heaven” does not imply the open air; the upward look expresses feeling irrespective of place'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/17.htm'
    quote: 'The words “to heaven” ought not to be taken to imply that he looked up to the sky, and must, therefore, have been in the open air. The upward look is naturally expressive of feeling, and irrespective of place.'
  - where: 'note 17:1 “The Intercessory Prayer”'
    claim: 'Called the High-Priestly Prayer; a prayer none but the Son could offer'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'The impressive discourse to the apostles was followed by a prayer such as could be addressed to none but the Eternal Father, and such as none but the Son of that Father could offer. It has been called, and not inappropriately, the Lord’s High-Priestly Prayer.'
  # ---- note 17:1 “The hour is come”
  - where: 'note 17:1 “The hour is come”'
    claim: 'The hour of 17:1 is the hour of 12:23, 28; 13:1, 31–32'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/17.htm'
    quote: 'For the thought of the hour, comp. John 12:23; John 12:28; John 13:1; John 13:31-32.'
  - where: 'note 17:1 “The hour is come”'
    claim: '13:1 sets the emphasis of chapters 13–17, given with the coming sacrifice in mind'
    key: huntsman-lamb-of-god
    url: 'https://rsc.byu.edu/behold-lamb-god/lamb-god-unique-aspects-passion-narrative-john'
    quote: 'This verse establishes the emphasis of chapters 13–17, in which is found the loving service of Jesus, given with His coming sacrifice at Golgotha firmly in mind.'
  - where: 'note 17:1 “The hour is come”'
    claim: 'The glory He asks for can be defined as bringing about the immortality and eternal life of man (Moses 1:39)'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'Jesus begins by praying for himself, pleading with the Father to glorify him (John 17:1‒8), which glory can be defined as bringing about the immortality and eternal life of man (Moses 1:39).'
  - where: 'note 17:1 “The hour is come”'
    claim: 'God was glorified in the completion of Christ’s work (17:4)'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/17.htm'
    quote: 'Better, I glorified Thee on earth: I finished the work . . . The former sentence is .explained by the latter. God was glorified in the completion of the Messianic work of Christ.'
  - where: 'note 17:1 “The hour is come”'
    claim: '17:4 is a report on the work assigned Him'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'By way of reverent report as to the work assigned Him, the Son said: “I have glorified thee on the earth: I have finished the work which thou gavest me to do.'
  - where: 'note 17:1 “The hour is come”'
    claim: '17:5 claims the glory He had in His state before the world was'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/17.htm'
    quote: 'This clause admits of but one meaning—viz., that Jesus claimed for Himself the possession of the divine glory in His pre-existent state before the world was'
  # ---- note 17:3 “To know God”
  - where: 'note 17:3 “To know God”'
    claim: 'Knowing about God or acknowledging Him is not knowing Him; evil spirits recognize Jesus'
    key: olson-know-god
    url: 'https://rsc.byu.edu/let-us-reason-together/know-god-life-eternal'
    quote: 'Simply knowing about God or his Son and acknowledging their existence, however, does not constitute knowing them. In the extreme, evil spirits recognize Jesus and even testify of his divinity'
  - where: 'note 17:3 “To know God”'
    claim: 'Doing God’s will is how one comes to know (John 7:17); such knowing requires living it'
    key: olson-know-god
    url: 'https://rsc.byu.edu/let-us-reason-together/know-god-life-eternal'
    quote: 'When Jesus observed that eternal life is inseparably connected with knowing him and the Father, he conceived a depth of understanding that requires a willing heart, an engaged mind, active ears, and authentically living that knowledge in everyday life.'
  - where: 'note 17:3 “To know God”'
    claim: 'Eternal life is the life the Father and the Son have, lived with them and like them'
    key: olson-know-god
    url: 'https://rsc.byu.edu/let-us-reason-together/know-god-life-eternal'
    quote: 'Because the Father and the Son have eternal life, it is eternal life to know them (see John 5:26). Eternal life is experiencing life as God knows it. It is living forever with the Father and the Son and living like the Father and Son.'
  - where: 'note 17:3 “To know God”'
    claim: 'The First Vision showed the Father and the Son as two distinct personages'
    key: olson-know-god
    url: 'https://rsc.byu.edu/let-us-reason-together/know-god-life-eternal'
    quote: 'For example, the Father and the Son are two distinct “Personages” whose glorious light banishes all darkness, who know us by our names, and who provide direct answers to our questions (see Joseph Smith—History 1:17–20).'
  - where: 'note 17:3 “To know God”'
    claim: 'Joseph Smith in April 1844: here is eternal life, to know the only wise and true God'
    key: jsp-discourse-1844-04-07
    url: 'https://www.josephsmithpapers.org/paper-summary/discourse-7-april-1844-as-published-in-times-and-seasons/3'
    quote: 'Here then is eternal life, to know the only wise and true God. You have got to learn how to be Gods yourselves'
  - where: 'note 17:3 “To know God”'
    claim: 'D&C 132:24 modifies the language of John 17:3 into “eternal lives,” reading it in terms of family; the language is John’s, the explication Joseph’s'
    key: frederick-life-eternal
    url: 'https://rsc.byu.edu/approaching-antiquity-joseph-smith-ancient-world/life-eternal-eternal-lives-joseph-smiths-engagement-gospel-john'
    quote: 'Joseph’s solution was to interpret John 17:3 in terms of familial relationships. … Joseph included a passage modifying the language of John 17:3 … “This is eternal lives—to know the only wise and true God, and Jesus Christ, whom he hath sent.'
  - where: 'note 17:3 “To know God”'
    claim: '“Eternal lives” means the continuation of spirit offspring by an exalted husband and wife'
    key: frederick-life-eternal
    url: 'https://rsc.byu.edu/approaching-antiquity-joseph-smith-ancient-world/life-eternal-eternal-lives-joseph-smiths-engagement-gospel-john'
    quote: 'Instead of emphasizing “eternal life,” like in John 17, Joseph created a new category, “eternal lives,” by which he meant the procreation of spiritual offspring by an exalted husband and wife.'
  # ---- note 17:6 “I have manifested thy name”
  - where: 'note 17:6 “I have manifested thy name”'
    claim: 'To manifest the name is to make God known as the only true God (17:3–4)'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/17.htm'
    quote: 'This manifestation of the name of God is the making Him known as the only true God, and the glorifying Him on earth of John 17:3-4.'
  - where: 'note 17:6 “I have manifested thy name”'
    claim: 'By Jesus’s time the name could be pronounced only by priests in the temple; God revealed His name to Moses on Sinai, so revealing it makes Jesus the prophet like Moses; it implies the High Priest’s authority, the authority of 17:2'
    key: hamblin-john-17
    url: 'https://interpreterfoundation.org/journal/i-have-revealed-your-name-the-hidden-temple-in-john-17'
    quote: 'By the time of Jesus there was a strong tradition of the sacred secrecy of God’s name, which could only be pronounced by priests in the temple. … First, the revelation of the names Yhwh and I Am to Moses on Sinai, making Jesus the “prophet like unto Moses,” … would also imply that Jesus claimed the authority of the High Priest to reveal the Name, reflecting the divine authority/eksousia Jesus claims in John 17:2'
  - where: 'note 17:6 “I have manifested thy name”'
    claim: 'The high priest pronounced the name in the temple on the Day of Atonement'
    key: hamblin-john-17
    url: 'https://interpreterfoundation.org/journal/i-have-revealed-your-name-the-hidden-temple-in-john-17'
    quote: 'The first, and foremost, was the pronunciation of the name Yhwh by the High Priest in the temple on the Day of Atonement.'
  - where: 'note 17:6 “I have manifested thy name”'
    claim: 'The priests pronounced the name in the temple in the priestly benediction, a substitute elsewhere'
    key: hamblin-john-17
    url: 'https://interpreterfoundation.org/journal/i-have-revealed-your-name-the-hidden-temple-in-john-17'
    quote: 'The name of Yhwh was also invoked during the daily recitation of the priestly benediction described in Numbers 6:22–27. The Mishnah tells us that when the priests pronounced this blessing, “in the Temple they pronounced the Name as it was written, but in the provinces by a substituted word,”'
  # ---- note 17:9 “I pray not for the world”
  - where: 'note 17:9 “I pray not for the world”'
    claim: 'The tense is present, of this prayer only; against limiting His prayer see 17:21 and Luke 23:34; He commends the disciples He is leaving'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/17.htm'
    quote: 'The tense is the strict present, referring to the prayer which He is at this moment uttering, and not to His general practice … Against any limitation of the prayer of our Lord, see John 17:21, and His own prayer for His enemies'
  - where: 'note 17:9 “I pray not for the world”'
    claim: 'He is leaving them and commends them to His Father’s care'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/17.htm'
    quote: 'It is from its very nature applicable only to disciples. He is leaving them, and commends them to His Father’s care.'
  # ---- note 17:12 “The son of perdition”
  - where: 'note 17:12 “The son of perdition”'
    claim: 'The Greek has apōleto (perished) and apōleias (perdition)'
    key: greek-nt
    url: 'https://biblehub.com/texts/john/17-12.htm'
    quote: 'καὶ οὐδεὶς ἐξ αὐτῶν ἀπώλετο, εἰ μὴ ὁ υἱὸς τῆς ἀπωλείας'
  - where: 'note 17:12 “The son of perdition”'
    claim: 'Apōleia is derived from apollymi, “destroy”'
    key: thayer
    url: 'https://biblehub.com/greek/684.htm'
    quote: 'Word Origin: [from a presumed derivative of G622 (ἀπόλλυμι - destroy)]'
  - where: 'note 17:12 “The son of perdition”'
    claim: 'Apōleia means destruction'
    key: thayer
    url: 'https://biblehub.com/greek/684.htm'
    quote: 'apóleia: Destruction, ruin, loss, perdition'
  - where: 'note 17:12 “The son of perdition”'
    claim: '“Son of perdition” is a Hebrew idiom for one whose nature is perdition; the wordplay can’t be kept in English: none perished except him whose nature it was to perish'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/17.htm'
    quote: 'other common instances are “children of light,” “children of darkness.” A “son of perdition” is one in whose nature there is the quality expressed by “perdition.” … No exact translation can therefore give in English the point of our Lord’s words, “And none of them perished except him whose nature it was to perish.”'
  - where: 'note 17:12 “The son of perdition”'
    claim: 'He was among those given and kept; he was lost by his own act'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/17.htm'
    quote: 'He, then, was included in “them which Thou gavest Me.” For him there was the same preservation and the same guardianship as for those who remained in the fold. The sheep wandered from the flock, and was lost by his own act.'
  - where: 'note 17:12 “The son of perdition”'
    claim: 'We are not the ones to judge Judas’s fate'
    key: holland-none-with-him
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2009/04/none-were-with-him?lang=eng'
    quote: 'could betray Him and all that He was for 30 pieces of silver. Never in the history of this world has so little money purchased so much infamy. We are not the ones to judge Judas’s fate'
  - where: 'note 17:12 “The son of perdition”'
    claim: 'The scripture fulfilled is the one of John 13:18'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/17.htm'
    quote: 'That the scripture might be fulfilled.—Comp. Note on John 13:18, and Acts 1:20.'
  # ---- note 17:15 “Keep them from the evil”
  - where: 'note 17:15 “Keep them from the evil”'
    claim: 'The Greek ends tou ponērou'
    key: greek-nt
    url: 'https://biblehub.com/texts/john/17-15.htm'
    quote: 'ἀλλ’ ἵνα τηρήσῃς αὐτοὺς ἐκ τοῦ πονηροῦ.'
  - where: 'note 17:15 “Keep them from the evil”'
    claim: 'Ho ponēros is used pre-eminently of the devil, the evil one, John 17:15 among the passages'
    key: thayer
    url: 'https://biblehub.com/greek/4190.htm'
    quote: 'ὁ πονηρός is used pre-eminently of the devil, the evil one: Matthew 5:37; Matthew 6:13; Matthew 13:19, 38; Luke 11:4 R L; John 17:15'
  - where: 'note 17:15 “Keep them from the evil”'
    claim: 'John’s usage favours the masculine; likely but not certain “the evil one”; compare the Lord’s Prayer'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/17.htm'
    quote: 'The usage of St. John is, beyond question, in favour of the masculine. … the present passage occurs in the second “Lord’s Prayer,” and that His prayer for them may with probability be interpreted in the same sense as the words in which He taught them to pray.'
  - where: 'note 17:15 “Keep them from the evil”'
    claim: 'In its first-century context ho ponēros meant Satan, the ruler of this world'
    key: hamblin-john-17
    url: 'https://interpreterfoundation.org/journal/i-have-revealed-your-name-the-hidden-temple-in-john-17'
    quote: 'But in its first century context, ho ponēros meant the Evil One, that is Satan. … The Evil One here is described elsewhere in John as the archōn tou kosmou (ἄρχων του κόσμου)—the “ruler of the world.”'
  - where: 'note 17:15 “Keep them from the evil”'
    claim: 'He does not ask that they be taken out of the world before their work is done'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/17.htm'
    quote: 'He prays not that they should be taken out of the world before their work is done.'
  # ---- note 17:19 “I sanctify myself”
  - where: 'note 17:19 “I sanctify myself”'
    claim: 'The same verb for the Son and the disciples: hagiazō … hēgiasmenoi'
    key: greek-nt
    url: 'https://biblehub.com/texts/john/17-19.htm'
    quote: 'καὶ ὑπὲρ αὐτῶν ἐγὼ ἁγιάζω ἐμαυτόν, ἵνα καὶ αὐτοὶ ὦσιν ἡγιασμένοι ἐν ἀληθείᾳ.'
  - where: 'note 17:19 “I sanctify myself”'
    claim: 'Hagiazō: to separate from the profane and dedicate to God; Christ by undergoing death consecrates himself to God, John 17:19; to purify internally, John 17:17, 19'
    key: thayer
    url: 'https://biblehub.com/greek/37.htm'
    quote: '2. to separate from things profane and dedicate to God, to consecrate … So Christ is said by undergoing death to consecrate himself to God, whose will he in that way fulfills, John 17:19'
  - where: 'note 17:19 “I sanctify myself”'
    claim: 'Hagiazō also means to purify internally, through knowledge of the truth, John 17:17, 19'
    key: thayer
    url: 'https://biblehub.com/greek/37.htm'
    quote: 'c. to purify internally by reformation of soul: John 17:17, 19 (through knowledge of the truth, cf. John 8:32)'
  - where: 'note 17:19 “I sanctify myself”'
    claim: 'The consecration is to His sacrifice; the word used of offerings; as Priest and Sacrifice He enters the heavenly Holy of Holies and sends the Holy Ghost who will consecrate them'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/17.htm'
    quote: 'the offering Himself as a sacrifice. The word was in frequent use in the special sense of an offering or sacrifice set apart to God. … He will, as both Priest and Sacrifice, enter into the Holy of Holies of the heavenly temple, and will send the Holy Ghost, who will consecrate them.'
  - where: 'note 17:19 “I sanctify myself”'
    claim: 'The same word in 10:36: He was set apart and sent; He sends them the same way (17:18)'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/17.htm'
    quote: 'Hence our Lord can use it of Himself in John 10:36, and in this context (John 17:19; these are the only places where it occurs in St. John’s writings). He was Himself “set apart and sent into the world.” He has to send them into the world in the same way'
  - where: 'note 17:19 “I sanctify myself”'
    claim: 'Hamblin compares the high priest on the Day of Atonement, who sanctifies himself first and then the people'
    key: hamblin-john-17
    url: 'https://interpreterfoundation.org/journal/i-have-revealed-your-name-the-hidden-temple-in-john-17'
    quote: 'This is, of course, precisely what the High Priest does in the Day of Atonement ritual (Leviticus 16). … he first sanctifies himself, after which, in his sanctified state, he can officiate in the temple to sanctify the community of Israel'
  - where: 'note 17:19 “I sanctify myself”'
    claim: '“Sanctify them” means make them holy, consecrated to God; literally saints'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'that God will “make them holy” (Greek, hagiason; KJV, “sanctify them”), which means consecrated or set apart to God (literally hagioi or “saints”).'
  - where: 'note 17:19 “I sanctify myself”'
    claim: 'To be sanctified through Christ’s blood is to become clean, pure and holy; sanctification removes the stain of sin'
    key: christofferson-justification
    url: 'https://www.churchofjesuschrist.org/study/ensign/2001/06/justification-and-sanctification?lang=eng'
    quote: 'To be sanctified through the blood of Christ is to become clean, pure, and holy. If justification removes the punishment for past sin, then sanctification removes the stain or effects of sin.'
  # ---- note 17:21 “That they all may be one”
  - where: 'note 17:21 “That they all may be one”'
    claim: 'Joseph Smith, 16 June 1844, as Thomas Bullock reported: agreed as one; the Greek shows it should be agreed; against three in one'
    key: ehat-cook-words-1844-06-16
    url: 'https://rsc.byu.edu/words-joseph-smith/16-june-1844-1-sunday-morning-grove-east-temple'
    quote: 'it is a strange God any how 3 in 1. & 1 in 3. … I am agreed with the Far. & the Far. is a greed with me & we are agreed as one [20]—the Greek shews that is shod. be agreed [21]—Far. I pray for them that thou hast given me out of the world &c &c [22] that they may be agreed'
  - where: 'note 17:21 “That they all may be one”'
    claim: 'The first report in the source is Thomas Bullock’s'
    key: ehat-cook-words-1844-06-16
    url: 'https://rsc.byu.edu/words-joseph-smith/16-june-1844-1-sunday-morning-grove-east-temple'
    quote: 'The original source for the account of this discourse in History of the Church and Teachings is the Thomas Bullock report.'
  - where: 'note 17:21 “That they all may be one”'
    claim: 'George Laub’s report: be of one mind in the unity of the faith'
    key: ehat-cook-words-1844-06-16
    url: 'https://rsc.byu.edu/words-joseph-smith/16-june-1844-1-sunday-morning-grove-east-temple'
