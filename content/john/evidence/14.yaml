  - where: 'note 14:12 “Greater works than these”'
    claim: 'The Nephite disciples worked miracles only in the name of Jesus'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/4-ne/1?lang=eng'
    quote: 'and in nothing did they work miracles save it were in the name of Jesus.'
  - where: 'note 14:12 “Greater works than these”'
    claim: 'The Lectures on Faith set 14:12 beside John 17:24: the greater works are done in eternity'
    key: lectures-on-faith-7
    url: 'https://rsc.byu.edu/lectures-faith-historical-perspective/lecture-7'
    quote: 'These sayings taken together make it very plain that the greater works which those who believed on his name were to do were to be done in eternity, where he was going and where they should behold his glory.'
  - where: 'note 14:12 “Greater works than these”'
    claim: 'By being made one with Him as He and the Father are one'
    key: lectures-on-faith-7
    url: 'https://rsc.byu.edu/lectures-faith-historical-perspective/lecture-7'
