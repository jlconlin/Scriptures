  - where: 'note 14:1 “Let not your heart be troubled”'
    claim: 'What grieves Him is that His people do not feel confident in His care or secure in His hands'
    key: holland-come-unto-me
    url: 'https://www.churchofjesuschrist.org/study/ensign/1998/04/come-unto-me?lang=eng'
    quote: 'his people do not feel confident in his care or secure in his hands or trust in his commandments'
  - where: 'note 14:6 “The way, the truth, and the life”'
    claim: '14:6 is among John’s predicated “I am” sayings'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: '“I am the way, the truth, and the life” (14:6)'
  - where: 'note 14:6 “The way, the truth, and the life”'
    claim: 'Seven predicated sayings join “I am” to a title or symbol reflecting His divine role'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'in seven instances Jesus uses the expression to equate himself with a Christological title or symbol, such as “I am the bread of life” (John 6:35) or “I am the good shepherd” (10:11, 14), that are reflective of his divine role'
  - where: 'note 14:6 “The way, the truth, and the life”'
    claim: 'Christ is not a rest stop but the Way and the destination'
    key: uchtdorf-heartfelt-all
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2022/04/57uchtdorf?lang=eng'
    quote: 'He is not a rest stop in our journey. He is not a scenic byway or even a major landmark. He is “the way, the truth, and the life'
  - where: 'note 14:6 “The way, the truth, and the life”'
    claim: 'The one and only Way back to the Father'
    key: uchtdorf-heartfelt-all
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2022/04/57uchtdorf?lang=eng'
    quote: 'our one and only Way back to our beloved Father in Heaven'
