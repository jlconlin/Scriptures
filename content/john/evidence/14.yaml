    claim: 'Until that night the disciples had asked nothing in His name'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/16?lang=eng'
    quote: 'Hitherto have ye asked nothing in my name'
  - where: 'note 14:22 “Judas, not Iscariot”'
    claim: 'Judas not Iscariot was one of the Twelve, Judas of James, probably Lebbaeus or Thaddaeus'
    key: bd-judas
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/judas?lang=eng'
    quote: '“Not Iscariot,” one of the Twelve, also called Judas (son or brother) of James (Luke 6:16; John 14:22; Acts 1:13); probably the same as Lebbaeus or Thaddaeus (Matt. 10:3; Mark 3:18).'
  - where: 'note 14:27 “My peace I give unto you”'
    claim: 'The promise transcends a setting of warnings of rejection, persecution and death; His peace, not the world’s'
    key: jackson-war-peace
    url: 'https://rsc.byu.edu/save-lost/war-peace-lessons-upper-room'
    quote: 'This passage has great power because its words so dramatically transcend the somber setting in which they were spoken, with warnings of rejection, persecution, wars, and murder.'
  - where: 'note 14:27 “My peace I give unto you”'
    claim: 'The same evening He concluded with 16:33, surprising and reassuring after His warnings'
