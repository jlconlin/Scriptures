chapter: 14
claims:
  # ---- when, setting, thread
  - where: when
    claim: 'At least part of the discourse after the Last Supper was given in the room where they had eaten'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'It is certain that part of the discourse following the last supper was delivered in the upper room where Christ and the Twelve had eaten'
  - where: setting
    claim: 'The farewell discourses are John 14:1–16:33, followed by the Intercessory Prayer'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'Also, the Farewell Discourses (14:1–16:33), the Intercessory Prayer (17:1–26), and the final dialogue with Peter (21:15–19)'
  - where: setting
    claim: 'John 13:1 sets the emphasis of chapters 13–17: loving service given with the sacrifice in mind'
    key: huntsman-lamb-of-god
    url: 'https://rsc.byu.edu/behold-lamb-god/lamb-god-unique-aspects-passion-narrative-john'
    quote: 'This verse establishes the emphasis of chapters 13–17, in which is found the loving service of Jesus, given with His coming sacrifice at Golgotha firmly in mind.'
  - where: setting
    claim: 'Chapters 14 and 16 are a doublet on His departure, balancing sorrow with the promised helper and peace; the vine sits between them'
    key: huntsman-lamb-of-god
    url: 'https://rsc.byu.edu/behold-lamb-god/lamb-god-unique-aspects-passion-narrative-john'
    quote: 'Chapters 14 and 16 form a recognized doublet, in which Jesus teaches the necessity of His departing … Jesus balances the disciples’ sorrow at His departure with promises of the coming of a “helper” or “advocate”'
  - where: setting
    claim: 'Only John records the last discourse'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'For such information as we have concerning the last discourse delivered by Jesus to the apostles before His crucifixion, we are indebted to John alone among the Gospel-writers'
  - where: thread
    claim: 'The Greek word for “mansions” occurs again only in 14:23, rendered “abode”'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/14.htm'
    quote: 'The Greek word for “mansions” occurs again in the New Testament only in John 14:23, where it is rendered abode.”'
  - where: 'section 2 plain'
    claim: '“Comfortless” is better rendered “orphans”'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/14.htm'
    quote: 'Better with the margin, I will not leave you orphans, which exactly represents the Greek word.'
  - where: 'section 1 plain'
    claim: '“Mansions” meant dwellings'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/14.htm'
    quote: 'Wiclif and the Geneva version read “dwellings.”'

  # ---- notes
  - where: 'note 14:1 “Let not your heart be troubled”'
    claim: 'The chapter break hides the link with 13: the traitor, Peter’s denial, the departure; Jesus Himself had been troubled'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/14.htm'
    quote: 'The prophecy of St. Peter’s denial had followed upon the indication of Judas as the traitor, and upon the announcement of the Lord’s departure. These thoughts may well have brought troubled hearts. The Lord had Himself been troubled'
  - where: 'note 14:1 “Let not your heart be troubled”'
    claim: 'Both clauses may be read as commands; the KJV takes the second as a statement'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/14.htm'
    quote: 'It is more natural to take both these clauses as imperative—Believe in God, believe also in Me. Our English version reads the first and last clauses of the verse as imperative, and the second as an indicative'
  - where: 'note 14:1 “Let not your heart be troubled”'
    claim: 'The same verb form, pisteuete, stands in both clauses'
    key: greek-nt
    url: 'https://biblehub.com/texts/john/14-1.htm'
    quote: 'Μὴ ταρασσέσθω ὑμῶν ἡ καρδία· πιστεύετε εἰς τὸν θεόν, καὶ εἰς ἐμὲ πιστεύετε.'

  - where: 'note 14:2 “Many mansions”'
    claim: 'monē, from menō, means a staying, abiding, dwelling, abode; used in 14:2 and 14:23'
    key: thayer
    url: 'https://biblehub.com/greek/3438.htm'
    quote: 'μόνη, μόνης, ἡ (μένω) (from Herodotus down), a staying, abiding, dwelling, abode: John 14:2; μόνην ποιεῖν … to make an (one''s) abode … John 14:23'
  - where: 'note 14:2 “Many mansions”'
    claim: 'The translators followed the Vulgate’s mansiones; in Elizabethan English the word meant only a dwelling'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/14.htm'
    quote: 'Our translators here followed the Vulgate, which has “mansiones “with the exact meaning of the Greek, that is; “resting-places,” “dwellings.” In Elizabethan English the word meant no more than this'
  - where: 'note 14:2 “Many mansions”'
    claim: 'Joseph Smith in 1843 set the many mansions beside Paul’s three glories against one heaven and one hell'
    key: ehat-cook-words-1843-06-11
    url: 'https://rsc.byu.edu/words-joseph-smith/11-june-1843-sunday-morning-temple-stand'
    quote: 'I believe in one hell & one heaven all are equally miserable or equally happy, but St Paul informs us of three glories [31] & three heavens … & Jesus said their were many mansions in my fathers Kingdom'
  - where: 'note 14:2 “Many mansions”'
    claim: 'The editors’ notes give 1 Cor. 15:41 and 2 Cor. 12:1–4 for Paul’s glories and heavens'
    key: ehat-cook-words-1843-06-11
    url: 'https://rsc.byu.edu/words-joseph-smith/11-june-1843-sunday-morning-temple-stand'
    quote: '[13] 1 Corinthians 15:41 (40-42).'
  - where: 'note 14:2 “Many mansions”'
    claim: 'Many mansions are multiple kingdoms of glory, so all inherit one whose laws they can abide'
    key: oaks-kingdoms-of-glory-2023
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2023/10/17oaks?lang=eng'
    quote: 'Under that loving plan, there are multiple kingdoms—many mansions—so that all of God’s children will inherit a kingdom of glory whose laws they can comfortably “abide.”'
  - where: 'note 14:2 “Many mansions”'
    claim: 'God’s plan is more than one heaven for the righteous and hell for the rest'
    key: oaks-kingdoms-of-glory-2023
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2023/10/17oaks?lang=eng'
    quote: 'the ultimate destiny of all who live on the earth is not the inadequate idea of heaven for the righteous and the eternal sufferings of hell for the rest.'

  - where: 'note 14:2 “Many mansions”'
    claim: 'D&C 76 describes the celestial, terrestrial and telestial glories'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/76?lang=eng'
    quote: 'And the glory of the celestial is one, even as the glory of the sun is one; and the glory of the terrestrial is one, even as the glory of the moon is one.'

  - where: 'note 14:6 “The way, the truth, and the life”'
    claim: 'Thomas stresses the whither; the disciples thought the Messiah would reign on earth'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/14.htm'
    quote: 'Our Lord’s words had laid stress upon the “way.” Thomas lays stress upon the “whither.” … The Messiah, they thought, was to reign upon earth. Where was this vast royal home'
  - where: 'note 14:6 “The way, the truth, and the life”'
    claim: 'The pronoun is emphatic; the way is put first, reversing Thomas’s order'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/14.htm'
    quote: 'I am the way.—The pronoun is emphatic. “I, and none besides Me.” “The way” is again made prominent, reversing the order which Thomas had used.'
  - where: 'note 14:6 “The way, the truth, and the life”'
    claim: 'He is the way because in Him the Father is revealed and He is the source of life'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/14.htm'
    quote: 'The thought of His being the Way through which men come to the Father is the reverse side of the thought, that in Him the Father is revealed to men, that He is Himself the Eternal Truth'
  - where: 'note 14:6 “The way, the truth, and the life”'
    claim: 'The Father is the true whither; to be with the Father is home'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/14.htm'
    quote: 'This was the answer to the doubt of Thomas. This was the true “whither” which they knew not. … To be with the Father is home.'

  - where: 'note 14:9 “He that hath seen me hath seen the Father”'
    claim: 'The Father and Son so one in heart and mind that to know one was to know both; the Father would have done as the Son did; yet the Father reached only through the Son'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'Had the Eternal Father stood amongst them, in Person, under the conditions there existing, He would have done as did the Well Beloved and Only Begotten Son … So absolutely were the Father and the Son of one heart and mind, that to know either was to know both'
  - where: 'note 14:9 “He that hath seen me hath seen the Father”'
    claim: 'The Son is the express image of the Father, so the Father is in the form of man; they appeared as two personages to Joseph Smith'
    key: teachings-joseph-f-smith-37
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-f-smith/chapter-37?lang=eng'
    quote: 'if the Son of God be the express image (that is, likeness) of His Father’s person, then His Father is in the form of man … the Father and the Son, as two personages, appeared to Joseph Smith'
  - where: 'note 14:9 “He that hath seen me hath seen the Father”'
    claim: 'The Godhead are one in every aspect except one substance'
    key: holland-only-true-god
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2007/10/the-only-true-god-and-jesus-christ-whom-he-hath-sent?lang=eng'
    quote: 'we believe They are one in every significant and eternal aspect imaginable except believing Them to be three persons combined in one substance'

  - where: 'note 14:12 “Greater works than these”'
    claim: 'His mortal mission had only hours; the unfolding plan would call for greater miracles than in His brief ministry'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'for His mortal mission was of but a few hours further duration, and the unfolding of the divine plan of the ages would call for yet greater miracles than those wrought by Jesus in the brief period of His ministry.'
  - where: 'note 14:12 “Greater works than these”'
    claim: 'One reading: believers will be His representatives on earth as He theirs in heaven, and the works are greater because He is at the Father’s right hand'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/14.htm'
    quote: 'The believers will be then His representatives on earth, as He will be their representative in heaven. Therefore will they do His works, and the works shall be greater because He will be at the Father’s right hand'

  - where: 'note 14:13 “Ask in my name”'
    claim: 'Here for the first time the Lord directed the disciples to pray in His name'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'For the first time the Lord directed His disciples to pray in his name to the Father'
  - where: 'note 14:13 “Ask in my name”'
    claim: 'We pray in Christ’s name when our mind and wishes are His; prayers from selfishness are not in His name'
    key: bd-prayer
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/prayer?lang=eng'
    quote: 'We pray in Christ’s name when our mind is the mind of Christ, and our wishes the wishes of Christ—when His words abide in us (John 15:7). We then ask for things it is possible for God to grant.'
  - where: 'note 14:13 “Ask in my name”'
    claim: 'Unanswered prayers are often not in His name'
    key: bd-prayer
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/prayer?lang=eng'
    quote: 'Many prayers remain unanswered because they are not in Christ’s name at all; they in no way represent His mind but spring out of the selfishness of man’s heart.'

  - where: 'note 14:16 “Another Comforter”'
    claim: 'paraklētos means one called to someone’s aid; the Holy Ghost is a helper in Jesus’s absence'
    key: huntsman-lamb-of-god
    url: 'https://rsc.byu.edu/behold-lamb-god/lamb-god-unique-aspects-passion-narrative-john'
    quote: 'Remembering that the root meaning of paraklētos is “one who is called to someone’s aid,” [24] the suggestion is that the Holy Ghost is an advocate or helper in the absence of Jesus.'
  - where: 'note 14:16 “Another Comforter”'
    claim: '“Another Comforter” implies a first, and the saying is about Jesus Himself'
    key: huntsman-lamb-of-god
    url: 'https://rsc.byu.edu/behold-lamb-god/lamb-god-unique-aspects-passion-narrative-john'
    quote: 'the first of these sayings is actually about Jesus Himself and about the Holy Ghost only by comparison, [23] since another Comforter by definition suggests a first Comforter'
  - where: 'note 14:16 “Another Comforter”'
    claim: 'The Comforter sayings give the Holy Ghost the roles of teacher, witness and revealer'
    key: huntsman-lamb-of-god
    url: 'https://rsc.byu.edu/behold-lamb-god/lamb-god-unique-aspects-passion-narrative-john'
    quote: 'identify His role not just as advocate but also as teacher, witness, prosecutor, and revealer'
  - where: 'note 14:16 “Another Comforter”'
    claim: 'The word is used of the Holy Spirit in the Gospel and of Jesus in 1 John 2:1, rendered “Advocate”'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/14.htm'
    quote: 'It is found once again in the New Testament, and is there applied by St. John to our Lord Himself (1John 2:1). In the Gospel the English version uniformly translates it by “Comforter.” “In the Epistle it is rendered by “Advocate.”'
  - where: 'note 14:16 “Another Comforter”'
    claim: 'D&C 88 expands John 14 without contradicting it, on the Spirit’s role toward exaltation'
    key: frederick-life-eternal
    url: 'https://rsc.byu.edu/approaching-antiquity-joseph-smith-ancient-world/life-eternal-eternal-lives-joseph-smiths-engagement-gospel-john'
    quote: 'Section 88 takes the language of John 14 and expands upon it, adding nuances to the nature of this other “Comforter,” … Significantly, Joseph Smith is not presenting any doctrine or teaching that contradicts or challenges John 14.'
  - where: 'note 14:16 “Another Comforter”'
    claim: 'D&C 88:3 names the other Comforter the Holy Spirit of promise, the one promised in John'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/88?lang=eng'
    quote: 'even the Holy Spirit of promise; which other Comforter is the same that I promised unto my disciples, as is recorded in the testimony of John.'

  - where: 'note 14:18 “Comfortless”'
    claim: '“Comfortless” suggests a link with “Comforter” that the Greek lacks; the word is “fatherless” in James 1:27; He thinks of them as His children'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/14.htm'
    quote: '“Comfortless” is unfortunate, as it suggests a connection with “Comforter” which does not exist in the original. Our translators have rendered the word by “fatherless” in James 1:27 … He thinks of them as His children'
  - where: 'note 14:18 “Comfortless”'
    claim: 'orphanous means orphans; He will come and be a father to them through eternal life'
    key: huntsman-lamb-of-god
    url: 'https://rsc.byu.edu/behold-lamb-god/lamb-god-unique-aspects-passion-narrative-john'
    quote: '“comfortless” in John 14:18 is a translation of the Greek orphanous, literally “orphans,” [25] suggesting that the Lamb of God will not leave believers fatherless … but that He, after His sacrificial death, will come and be a father to them'

  - where: 'note 14:21 “The other Comforter”'
    claim: 'After faith, repentance, baptism and the Holy Ghost, the first Comforter; then humbling oneself until the calling and election is made sure'
    key: jsp-discourse-1839-comforter
    url: 'https://www.josephsmithpapers.org/paper-summary/discourse-between-circa-26-june-and-circa-2-july-1839-as-reported-by-willard-richards/5'
    quote: 'receives the Holy Ghost (by the laying on of hands) which is the first Comforter. then let him continue to humble himself before God, hungering & thirsting after Righteousness. & living by every word of God'
  - where: 'note 14:21 “The other Comforter”'
    claim: 'When proved, his calling and election made sure'
    key: jsp-discourse-1839-comforter
    url: 'https://www.josephsmithpapers.org/paper-summary/discourse-between-circa-26-june-and-circa-2-july-1839-as-reported-by-willard-richards/5'
    quote: 'When the Lord has thorougly proved him & finds that the man is determined to serve him at all hazard. then the man will find his calling & Election made sure'
  - where: 'note 14:21 “The other Comforter”'
    claim: 'Then he may receive the other Comforter promised in John 14, verses 16–18, 21, 23 noted; it is the Lord Jesus Christ himself'
    key: jsp-discourse-1839-comforter
    url: 'https://www.josephsmithpapers.org/paper-summary/discourse-between-circa-26-june-and-circa-2-july-1839-as-reported-by-willard-richards/6'
    quote: 'then it will be his privilige to receive the other Comforter which the Lord hath promised the saints as is recorded in the testimony of St John in the XIV ch from the 12th to the 27 verses Note the 16.17.18.21.23. verses.'
  - where: 'note 14:21 “The other Comforter”'
    claim: 'The other Comforter is the Lord Jesus Christ himself'
    key: jsp-discourse-1839-comforter
    url: 'https://www.josephsmithpapers.org/paper-summary/discourse-between-circa-26-june-and-circa-2-july-1839-as-reported-by-willard-richards/6'
    quote: 'Now what is this other Comforter? It is no more or less than the Lord Jesus Christ himself'
  - where: 'note 14:21 “The other Comforter”'
    claim: 'He will attend or appear from time to time and manifest the Father; the ancient saints such as Isaiah, Ezekiel, John and Paul came to this'
    key: jsp-discourse-1839-comforter
    url: 'https://www.josephsmithpapers.org/paper-summary/discourse-between-circa-26-june-and-circa-2-july-1839-as-reported-by-willard-richards/7'
    quote: 'he will have the personage of Jesus Christ to attend him or appear unto him from time to time. & even he will manifest the Father unto him … Isaiah, Ezekiel, John upon the Isle of patmos, St Paul in the third heavens'
  - where: 'note 14:21 “The other Comforter”'
    claim: 'D&C 130:3: the appearing in John 14:23 is personal'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/130?lang=eng'
    quote: 'John 14:23—The appearing of the Father and the Son, in that verse, is a personal appearance; and the idea that the Father and the Son dwell in a man’s heart is an old sectarian notion, and is false.'

  - where: 'note 14:22 “Judas, not Iscariot”'
    claim: '“Not Iscariot” distinguishes him from the one who had gone out; commonly identified with Lebbaeus Thaddaeus'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/14.htm'
    quote: 'That he was “not Iscariot” is mentioned to distinguish him beyond all possibility of confusion from him who had gone out into the darkness … He is commonly identified with “Lebbæus whose surname was Thaddæus”'
  - where: 'note 14:22 “Judas, not Iscariot”'
    claim: 'Judas was puzzled by a Messiah known only to a few; Jesus answered that the companionship is only for the faithful'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'was puzzled over the untraditional and un-Jewish thought of a Messiah who would be known but to the chosen few and not to Israel at large … Jesus explained that His and the Father’s companionship was attainable only by the faithful.'

  - where: 'note 14:27 “My peace I give unto you”'
    claim: '“Peace be with you” was an everyday Jewish greeting; Jesus gave it in a higher sense'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'that they might realize that this meant more than the conventional salutation of the times, for “Peace be with you” was an every-day greeting among the Jews, the Lord affirmed that He gave that invocation in a higher sense'
  - where: 'note 14:27 “My peace I give unto you”'
    claim: 'Shalom was said at meeting and parting'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/14.htm'
    quote: 'Men said to each other when they met and parted, “Shalom! Shalom!” (Peace! Peace!)'
  - where: 'note 14:27 “My peace I give unto you”'
    claim: 'He leaves it as a legacy, an actual possession; the risen Lord greeted them with it'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/14.htm'
    quote: 'He will leave them as a legacy the gift of “peace.” … He repeats it with the emphatic “My,” and speaks of it as an actual possession which He imparts to them.'

  - where: 'note 14:28 “My Father is greater than I”'
    claim: 'The saying belongs with the Son’s deferential subordination to the Father'
    key: holland-only-true-god
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2007/10/the-only-true-god-and-jesus-christ-whom-he-hath-sent?lang=eng'
    quote: 'And there is, of course, that always deferential subordination to His Father that had Jesus say, “Why callest thou me good? there is none good but one, that is, God.” “My Father is greater than I.”'
  - where: 'note 14:28 “My Father is greater than I”'
    claim: 'Father, Son and Holy Ghost are separate persons, three divine beings'
    key: holland-only-true-god
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2007/10/the-only-true-god-and-jesus-christ-whom-he-hath-sent?lang=eng'
    quote: 'We declare it is self-evident from the scriptures that the Father, the Son, and the Holy Ghost are separate persons, three divine beings'
  - where: 'note 14:28 “My Father is greater than I”'
    claim: 'Separate beings is not polytheism but part of what Jesus came to reveal'
    key: holland-only-true-god
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2007/10/the-only-true-god-and-jesus-christ-whom-he-hath-sent?lang=eng'
    quote: 'is not to be guilty of polytheism; it is, rather, part of the great revelation Jesus came to deliver concerning the nature of divine beings.'

  - where: 'note 14:30 “The prince of this world”'
    claim: 'JST 14:30: the prince of darkness, Satan, of this world, has no power over Him but has power over them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-john/14?lang=eng'
    quote: 'Hereafter I will not talk much with you; for the prince of darkness, who is of this world, cometh, but hath no power over me, but he hath power over you.'
  - where: 'note 14:30 “The prince of this world”'
    claim: 'The JST heading names him Satan'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-john/14?lang=eng'
    quote: 'The prince of darkness, or Satan, is of this world.'
  - where: 'note 14:30 “The prince of this world”'
    claim: '“Hath nothing in me”: Satan has never ruled in Him, so His surrender is voluntary'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/14.htm'
    quote: 'they assert that the prince of this world possesses nothing in the person of Christ. In Him he has never for a moment ruled. … It follows from this that His surrender of Himself is entirely voluntary.'

  - where: 'note 14:31 “Arise, let us go hence”'
    claim: 'Chapter 14 ends with “Arise”; 15–17 may have been spoken outdoors on the way; 18:1 may mean after the whole discourse; the place affects nothing'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'it is possible that the latter portion was spoken and the prayer offered (John 15, 16, 17) outdoors as Jesus and the Eleven wended their way toward the Mount of Olives.'
  - where: 'note 14:31 “Arise, let us go hence”'
    claim: 'John 18:1 says He went forth when He had spoken the whole; no saying is affected by the place'
    key: talmage-jesus-christ-33
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-33?lang=eng'
    quote: 'John (18:1) states that “when Jesus had spoken these words,” namely, the whole discourse, and the concluding prayer, “he went forth with his disciples over the brook Cedron.” Not one of our Lord’s sublime utterances … is affected by the circumstance of place.'

  # ---- christ, explore
