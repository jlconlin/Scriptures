chapter: 9
claims:
  # ---- when, setting, thread, sections
  - where: when
    claim: 'The healing took place during or soon after the Feast of Tabernacles'
    key: huntsman-sabbath-john
    url: 'https://rsc.byu.edu/sacred-time/bringing-forth-new-creation'
    quote: 'Recalling that this miracle took place during or soon after the Feast of Tabernacles with its association with light, the miracle takes on further associations.'
  - where: setting
    claim: 'In the fall, about six months before His death, Jesus went to Jerusalem for Tabernacles and there on a Sabbath met the man'
    key: van-dyke-miracles-john
    url: 'https://rsc.byu.edu/vol-9-no-3-2008/miracles-jesus-gospel-john'
    quote: 'In the fall, approximately six months before Jesus’s death and Resurrection, He traveled to Jerusalem to participate in the Feast of Tabernacles. There, on a Sabbath day, Jesus encountered a man who was blind from his birth.'
  - where: setting
    claim: 'The story begins after Jesus had left the temple at 8:59'
    key: strathearn-johannine-dialogues
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/johannine-christology-through-lens-three-its-dialogues'
    quote: 'The narrative begins after Jesus had left the temple (John 8:59).'
  - where: setting
    claim: 'The miracle is recorded by John alone; the man lived by begging'
    key: talmage-jesus-christ-25
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-25?lang=eng'
    quote: 'It is recorded by John alone, and, as usual with that writer, his narrative is given with descriptive detail. Jesus and His disciples saw the sightless one upon the street. The poor man lived by begging.'
  - where: setting
    claim: 'The Synoptics have restorations of sight, but John’s is greater: a man born blind'
    key: huntsman-sabbath-john
    url: 'https://rsc.byu.edu/sacred-time/bringing-forth-new-creation'
    quote: 'While there were several cases of restored sight in the Synoptics (Mark 8:22–26; 10:46–52 … Matthew 9:27–31), in typical Johannine fashion the miracle in this Gospel is greater and more momentous'
  - where: setting
    claim: 'The story parallels and builds on the Bethesda healing, and adds a theological point'
    key: huntsman-sabbath-john
    url: 'https://rsc.byu.edu/sacred-time/bringing-forth-new-creation'
    quote: 'The story of Jesus’s healing the man blind from birth and its aftermath (John 9:1–41) parallels and builds on the story of the man at Bethesda, following the basic outline in most of its points while simultaneously adding detail, further personalizing it, and adding an additional theological point.'
  - where: setting
    claim: 'Jesus’s dealings with the man are bookends around dialogues with the neighbours and then the Pharisees'
    key: strathearn-johannine-dialogues
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/johannine-christology-through-lens-three-its-dialogues'
    quote: 'his interactions with Jesus act as bookends for a narrative that is interrupted by an ongoing dialogue, first with the man’s neighbors and then with the Pharisees, both of whom question him extensively about how he received his sight.'
  - where: thread
    claim: 'The main focus is the spiritual sight of recognizing who Jesus is; coming to see Him is progressive'
    key: strathearn-johannine-dialogues
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/johannine-christology-through-lens-three-its-dialogues'
    quote: 'the major focus in John’s narrative is the spiritual aspect of helping him to see and recognize the eternal nature of Jesus’s identity. His story reiterates that the process of coming to “see” Jesus is a progressive one.'
  - where: thread
    claim: 'The Pharisees had physical sight but lacked the spiritual sight the man gained'
    key: strathearn-johannine-dialogues
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/johannine-christology-through-lens-three-its-dialogues'
    quote: 'They had always had their physical sight, but they lacked the spiritual sight that this man had now gained. For them Jesus was a sinner.'
  - where: thread
    claim: 'The chapter ends on the difference between physical and spiritual blindness, Jesus as the Light of the World, and rejection leaving sin'
    key: huntsman-sabbath-john
    url: 'https://rsc.byu.edu/sacred-time/bringing-forth-new-creation'
    quote: 'lead Jesus to confront them about the difference between physical and spiritual blindness, underscoring that he is the true Light of the World and that rejecting him results in the persistence of sin (9:39–41).'
  - where: section 1 plain
    claim: '“Clay” is mud or paste; “anointed” is better “spread”'
    key: huntsman-sabbath-john
    url: 'https://rsc.byu.edu/sacred-time/bringing-forth-new-creation'
    quote: 'Jesus making mud or a paste (Greek pēlos; KJV “clay”) by spitting on the ground, anointing the man’s eyes with it'
  - where: section 1 plain
    claim: '“Anointed” may be rendered “spread the clay upon”'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/9.htm'
    quote: 'The marginal rendering, and He spread the clay upon the eyes of the blind man (or, upon his eyes), is to be preferred.'
  - where: setting
    claim: 'Both stories: Jesus takes the initiative, pools, Sabbath, leaders criticize, the man does not know Jesus'
    key: huntsman-sabbath-john
    url: 'https://rsc.byu.edu/sacred-time/bringing-forth-new-creation'
    quote: 'Both stories in John have Jesus take the initiative (5:6; 9:6); both involve the waters of pools (5:2; 9:7); both occur on the Sabbath … both have Jewish leaders criticize Jesus … and in neither does the man initially know Jesus'
  - where: 'note 9:6 “Clay of the spittle”'
    claim: 'In John miracles generally need only Jesus’s word or will'
    key: huntsman-sabbath-john
    url: 'https://rsc.byu.edu/sacred-time/bringing-forth-new-creation'
    quote: 'Because of the even greater divinity of the Johannine Jesus, miracles in the Fourth Gospel generally just need Jesus to speak or will something for it to be done'
  - where: 'note 9:6 “Clay of the spittle”'
    claim: 'Irenaeus, a second-century theologian, read it as an allusion to the creation of Adam'
    key: strathearn-johannine-dialogues
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/johannine-christology-through-lens-three-its-dialogues'
    quote: 'The second-century Christian theologian Irenaeus understood Jesus’s actions as an allusion to the creation of Adam in Genesis 2:7 (Against Heresies 5.15.2).'
  - where: 'note 9:6 “Clay of the spittle”'
    claim: 'No skill of the time could remove blindness from birth'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/9.htm'
    quote: 'no science or skill had at that time been equal to the removal of blindness which had accompanied birth.'
  - where: 'note 9:7 “Siloam, which is Sent”'
    claim: '“Sent” in 9:4 is the tenth use since John 7; the Savior has emphasized He was sent'
    key: gardner-tabernacles
    url: 'https://rsc.byu.edu/learn-me/jesus-christ-feast-tabernacles'
    quote: 'it is the tenth time we have read the word sent since the beginning of John 7. The Savior has been emphasizing his role as the one “sent” by the Father for several chapters.'
  - where: 'note 9:32 “Since the world began”'
    claim: 'Born-blind differentiates this miracle from the others in cases of blindness'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/9.htm'
    quote: 'This differentiates the miracle from the others in cases of blindness, and still more from all ordinary cures of maladies of the eyes.'
  # ---- notes
  - where: 'note 9:2 “Who did sin, this man, or his parents?”'
    claim: 'The parents’ alternative was taught in the Second Commandment and widely believed then'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/9.htm'
    quote: 'The latter alternative is familiar to us, and daily experience shows us that within limits it holds good in both the moral and the physical worlds. It was clearly taught in the Second Commandment, and there is abundant evidence that the belief was at this time widely spread.'
  - where: 'note 9:2 “Who did sin, this man, or his parents?”'
    claim: 'The punishment, as they saw it, came with birth, before any possibility of sin'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/9.htm'
    quote: 'What is special to the question, as it meets us here, is that what is deemed to be the punishment had come with birth before possibility of thought or action, and therefore, as we think, before possibility of sin.'
  - where: 'note 9:2 “Who did sin, this man, or his parents?”'
    claim: 'The question implied belief in agency and choice before mortality; they took affliction as the result of personal sin, a generalization too broad'
    key: talmage-jesus-christ-25
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-25?lang=eng'
    quote: 'The disciples’ question implied their belief in a state of moral agency and choice antedating mortality; else, how could they have thought of the man having sinned so as to bring upon himself congenital blindness?'
  - where: 'note 9:2 “Who did sin, this man, or his parents?”'
    claim: 'The disciples looked on bodily affliction as the result of personal sin; their generalization was too broad'
    key: talmage-jesus-christ-25
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-25?lang=eng'
    quote: 'It is further to be seen that they looked upon bodily affliction as the result of personal sin. Their generalization was too broad'
  - where: 'note 9:2 “Who did sin, this man, or his parents?”'
    claim: 'Jesus did not challenge the premise of a premortal life but said the man had not sinned to deserve the blindness'
    key: sc-knowhy-808
    url: 'https://scripturecentral.org/knowhy/why-do-latter-day-saints-believe-in-a-premortal-existence'
    quote: 'Jesus did not challenge the disciples on the reality of a premortal life but explained that the man had not committed a sin justifying his lifelong blindness.'
  - where: 'note 9:2 “Who did sin, this man, or his parents?”'
    claim: 'Restoration scripture teaches a premortal life (D&C 93:29; Abraham 3:22–23); the footnote points to the Topical Guide on it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/9?lang=eng'
    quote: '2a “man”: TG Man, Antemortal Existence of.'
  - where: 'note 9:3 “That the works of God should be made manifest”'
    claim: 'The answer means neither’s sin caused the blindness; a warning against tracing others’ misfortunes to their sin'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/9.htm'
    quote: 'Neither his special sin nor theirs was the cause of the blindness. … our Lord’s words remain a warning against the spirit of judging other men’s lives, and tracing in the misfortunes and sorrows which they have to bear the results of individual sin'
  - where: 'note 9:3 “That the works of God should be made manifest”'
    claim: 'Elder Oaks: hardships are seen in the purpose of life, in which we are sent to be tested and to grow through opposition (the lesson he then says Jesus taught with the man born blind)'
    key: oaks-give-thanks
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2003/04/give-thanks-in-all-things?lang=eng'
    quote: 'we see hardships and adversities in the context of the purpose of life. We are sent here to be tested. There must be opposition in all things. We are meant to learn and grow through that opposition'
  - where: 'note 9:3 “That the works of God should be made manifest”'
    claim: 'Elder Oaks: Jesus taught this lesson with the man born blind; the works of God furthered through adversities'
    key: oaks-give-thanks
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2003/04/give-thanks-in-all-things?lang=eng'
    quote: 'Jesus taught this lesson when He and His disciples met a man who was born blind. … If we see life through the lens of spirituality, we can see many examples of the works of God being furthered through the adversities of His children.'
  - where: 'note 9:4 “While it is day”'
    claim: 'JST 9:4 reads “while I am with you; the time cometh when I shall have finished my work, then I go unto the Father”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/9?lang=eng'
    quote: 'JST John 9:4 … while I am with you; the time cometh when I shall have finished my work, then I go unto the Father.'
  - where: 'note 9:4 “While it is day”'
    claim: '“The night cometh” is a proverb of the passing day of opportunity; Jesus does not except Himself: His work on earth ceased when the night came'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/9.htm'
    quote: 'He does not except even Himself from the proverbial law. The day of opportunity passes, never to return. … the work of His own human activity on earth ceased when the night came.'
  - where: 'note 9:5 “The light of the world”'
    claim: 'The giant lampstands of Tabernacles were fresh in the hearers’ minds when Jesus said “I am the light of the world” (8:12)'
    key: gardner-tabernacles
    url: 'https://rsc.byu.edu/learn-me/jesus-christ-feast-tabernacles'
    quote: 'Undoubtedly, the recent display of the giant burning lampstands was fresh in the minds of those who heard Jesus proclaim, “I am the light of the world'
  - where: 'note 9:5 “The light of the world”'
    claim: 'The miracle near Tabernacles: a man in physical darkness sees and comes to know Jesus as the true Light of the World'
    key: huntsman-sabbath-john
    url: 'https://rsc.byu.edu/sacred-time/bringing-forth-new-creation'
    quote: 'Not only was a man who once lived in physical darkness now able to see, but he has also come to know who Jesus is, the true Light of the World (8:12).'
  - where: 'note 9:6 “Clay of the spittle”'
    claim: 'The details of the mud are unusual for John and call for explanation; they may refer to the Creation of Gen 2:7, saliva standing for spirit'
    key: huntsman-sabbath-john
    url: 'https://rsc.byu.edu/sacred-time/bringing-forth-new-creation'
    quote: 'the details of Jesus making mud … are so unusual for John that they demand some explanation. … the answer might be found in seeing in the making of mud a reference to the original Creation story.'
  - where: 'note 9:6 “Clay of the spittle”'
    claim: 'Because water symbolizes spirit in John, the saliva mixed with dust could represent God putting spirit in the first man; the washing points to baptism'
    key: huntsman-sabbath-john
    url: 'https://rsc.byu.edu/sacred-time/bringing-forth-new-creation'
    quote: 'Because water so often serves as a symbol of spirit in John,[48] Jesus’s using his saliva to mix with the dust or dirt on the ground in front of him could represent God’s putting spirit in the first man.'
  - where: 'note 9:6 “Clay of the spittle”'
    claim: 'Saliva was held a remedy for blindness by Roman writers and the rabbis'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/9.htm'
    quote: 'We know from the pages of Pliny, and Tacitus, and Suetonius, that the saliva jejuna was held to be a remedy in cases of blindness, and that the same remedy was used by the Jews is established by the writings of the Rabbis.'
  - where: 'note 9:6 “Clay of the spittle”'
    claim: 'A new creation of eyes was likely needed, unlike the Bethesda man restored to former health'
    key: van-dyke-miracles-john
    url: 'https://rsc.byu.edu/vol-9-no-3-2008/miracles-jesus-gospel-john'
    quote: 'In the case of the man born blind, it seems reasonable to conclude that a new creation was essential. The miracle likely necessitated the creation of cells, tissues, and nerves that were either present but had never functioned or were altogether absent'
  - where: 'note 9:7 “Siloam, which is Sent”'
    claim: 'John interprets Siloam as “Sent” to match his repeated use of “sent” for the Savior’s commission; the pool becomes a symbol of the Savior'
    key: gardner-tabernacles
    url: 'https://rsc.byu.edu/learn-me/jesus-christ-feast-tabernacles'
    quote: 'John interprets Siloam to mean simply “Sent” (John 9:7) to correspond with his repeated usage of the term to refer to the divine commission of the Savior.[44] Thus, the Pool of Siloam becomes a symbol for the Savior himself'
  - where: 'note 9:7 “Siloam, which is Sent”'
    claim: 'The derivation of Shiloah from “to send” is uncertain; some derive it from a word for water channels'
    key: gardner-tabernacles
    url: 'https://rsc.byu.edu/learn-me/jesus-christ-feast-tabernacles'
    quote: 'Although this term may be derived from the lexical root sh-l-h, “to send,” some scholars derive it from a homonym used outside the Bible to designate water channels or canals.'
  - where: 'note 9:7 “Siloam, which is Sent”'
    claim: 'Siloam is the Shiloah of Isaiah 8:6 and Siloah of Nehemiah 3:15'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/9.htm'
    quote: 'there is every reason to believe that in the present pool we have the Siloah of Nehemiah 3:15, the Shiloah of Isaiah 8:6, and the Siloam of the present passage.'
  - where: 'note 9:7 “Siloam, which is Sent”'
    claim: 'Siloam’s water came from the Gihon spring, “living water”; the pool was likely a mikveh for ritual purification'
    key: gardner-tabernacles
    url: 'https://rsc.byu.edu/learn-me/jesus-christ-feast-tabernacles'
    quote: 'The Pool of Siloam received its water from the Gihon Spring, a natural water source, making the water in Siloam “living water,” or water suitable for ritual purification. … the Pool of Siloam was likely a mikveh'
  - where: 'note 9:7 “Siloam, which is Sent”'
    claim: 'At Tabernacles a procession of priests drew water at Siloam for the altar'
    key: gardner-tabernacles
    url: 'https://rsc.byu.edu/learn-me/jesus-christ-feast-tabernacles'
    quote: 'a procession of priests, with the accompaniment of singing and flute playing, wended their way from the temple down to the Pool of Siloam, where a priest filled a golden flask with water'
  - where: 'note 9:7 “Siloam, which is Sent”'
    claim: 'Siloam was farther than Bethesda; the distance required faith'
    key: gardner-tabernacles
    url: 'https://rsc.byu.edu/learn-me/jesus-christ-feast-tabernacles'
    quote: 'The closest mikveh would have been the Pool of Bethesda, which was only approximately 1,000 feet (300 meters) away, while the Pool of Siloam was approximately 2,100 feet (640 meters) away.[45] The extra distance required the man to exercise faith'
  - where: 'note 9:7 “Siloam, which is Sent”'
    claim: 'The command recalls Naaman (2 Kings 5:10)'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/9.htm'
    quote: 'The command recalls that to Naaman the Syrian (2Kings 5:10), and not improbably recalled it to the mind of the blind man. In any case, it is a further stage in his spiritual education.'
  - where: 'note 9:14 “On the sabbath day”'
    claim: 'Making clay was a servile work; anointing eyes with spittle on the Sabbath was forbidden by rabbinic decrees; healing only in immediate danger'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/9.htm'
    quote: 'This is mentioned as a servile work which contravened the Sabbath law. The anointing the eyes with spittle on the Sabbath was specially forbidden by the decrees of the Rabbis. They held that no work of healing might be performed on the Sabbath except in cases of immediate danger.'
  - where: 'note 9:14 “On the sabbath day”'
    claim: 'The Pharisees saw the simple act of making paste as a work'
    key: huntsman-sabbath-john
    url: 'https://rsc.byu.edu/sacred-time/bringing-forth-new-creation'
    quote: 'In any case, Jesus’s opponents, who in this account are specifically identified as Pharisees, saw the simple act of making paste as a work (v. 16).'
  - where: 'note 9:14 “On the sabbath day”'
    claim: 'As at 5:9, the Sabbath is mentioned only after the miracle, perhaps pointing to the eschatological Sabbath'
    key: huntsman-sabbath-john
    url: 'https://rsc.byu.edu/sacred-time/bringing-forth-new-creation'
    quote: 'Again, the notice that the miracle took place on the Sabbath is delayed until after the miracle (John 9:14),[51] perhaps suggesting that the meaningful Sabbath is the eschatological Sabbath that follows the completion of Jesus’s work.'
  - where: 'note 9:14 “On the sabbath day”'
    claim: 'John’s Sabbath healings clarify that the day is for the work of salvation and redemption'
    key: huntsman-sabbath-john
    url: 'https://rsc.byu.edu/sacred-time/bringing-forth-new-creation'
    quote: 'the incidents in John instead present a “clarification,” illustrating that this holy day should instead be used for the work of salvation and redemption.'
  - where: 'note 9:17 “He is a prophet”'
    claim: 'Repeated questioning moved the man from “some man” to “a prophet”; then to seeing Jesus could not be a sinner'
    key: strathearn-johannine-dialogues
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/johannine-christology-through-lens-three-its-dialogues'
    quote: 'Initially he had simply considered him to be some man. But was he? In all his years of blindness many “men” must have passed by without performing such a miracle. Surely this Jesus must be more than a man'
  - where: 'note 9:17 “He is a prophet”'
    claim: 'The questioning made him reflect more deeply; he came to see Jesus could not be a sinner'
    key: strathearn-johannine-dialogues
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/johannine-christology-through-lens-three-its-dialogues'
    quote: 'they served a purpose because they apparently caused the man to move beyond the sensory overload that the miracle must have stimulated and forced him to reflect more deeply on what had happened to him.'
  - where: 'note 9:17 “He is a prophet”'
    claim: 'He knew his benefactor was more than ordinary but did not yet know Him as the Christ'
    key: talmage-jesus-christ-25
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-25?lang=eng'
    quote: 'The man knew his Benefactor to be more than any ordinary being; as yet, however, he had no knowledge of Him as the Christ.'
  - where: 'note 9:22 “Put out of the synagogue”'
    claim: 'Jesus’s opponents in this account (v. 16) are identified as Pharisees'
    key: huntsman-sabbath-john
    url: 'https://rsc.byu.edu/sacred-time/bringing-forth-new-creation'
    quote: 'Jesus’s opponents, who in this account are specifically identified as Pharisees'
  - where: 'note 9:22 “Put out of the synagogue”'
    claim: '“The Pharisees” here are a body of leading Pharisees, not the Sanhedrin, which did not meet on the Sabbath'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/9.htm'
    quote: 'we are not to understand the Sanhedrin, which did not meet on the Sabbath, and which is not spoken of by St. John as simply “the Pharisees,” but a body of the leading Pharisees who were the most bitter foes of Christ'
  - where: 'note 9:22 “Put out of the synagogue”'
    claim: 'aposynagōgos: excluded from the sacred assemblies of the Israelites; excommunicated'
    key: thayer
    url: 'https://biblehub.com/greek/656.htm'
    quote: 'excluded from the sacred assemblies of the Israelites; excommunicated, (A. V. put out of the synagogue): John 9:22'
  - where: 'note 9:22 “Put out of the synagogue”'
    claim: 'In Jesus’s time the ban probably meant exclusion, while it lasted, from all the cherished privileges of an Israelite'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/9.htm'
    quote: 'probably the only practice known in the time of our Lord was that which was later regarded as the intermediate form, falling short of perpetual banishment, but being, while the ban lasted, exclusion from all the cherished privileges of an Israelite.'
  - where: 'note 9:22 “Put out of the synagogue”'
    claim: 'The rulers had decreed that anyone confessing Jesus as Christ be cast out of the synagogue, as we would say excommunicated'
    key: talmage-jesus-christ-25
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-25?lang=eng'
    quote: 'knowing the rulers had decreed that any one who confessed Jesus to be the Christ should be cast out from the community of the synagog, or, as we would say today, excommunicated from the Church.'
  - where: 'note 9:22 “Put out of the synagogue”'
    claim: 'Many scholars think the threat reflects later expulsions of Jewish Christians from synagogues'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'Jesus’s opponents in the Jewish leadership threatened him and his parents with being “put out of the synagogue” (9:22; compare 12:42; 16:2), something that many scholars feel might have been a sadly familiar experience to many Jewish Christians who were expelled from their synagogues later in the century.'
  - where: 'note 9:32 “Since the world began”'
    claim: 'JST 9:32 adds “except he be of God”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/9?lang=eng'
    quote: 'JST John 9:32 … blind, except he be of God.'
  - where: 'note 9:32 “Since the world began”'
    claim: 'No skill then could cure blindness from birth; he regards the gift as from God'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/9.htm'
    quote: 'The man expresses what was simply true, that no science or skill had at that time been equal to the removal of blindness which had accompanied birth.'
  - where: 'note 9:32 “Since the world began”'
    claim: 'John’s miracle is greater than the Synoptic restorations of sight'
    key: huntsman-sabbath-john
    url: 'https://rsc.byu.edu/sacred-time/bringing-forth-new-creation'
    quote: 'in typical Johannine fashion the miracle in this Gospel is greater and more momentous: “Since the world began was it not heard that any man opened the eyes of one that was born blind” (John 9:32).'
  - where: 'note 9:38 “Lord, I believe”'
    claim: 'Jesus sometimes seeks us out and initiates the dialogue, as with the blind man'
    key: strathearn-johannine-dialogues
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/johannine-christology-through-lens-three-its-dialogues'
