    url: 'https://rsc.byu.edu/sacred-time/bringing-forth-new-creation'
    quote: 'After he is cast out by “the Jews,” Jesus finds him, giving the man a chance to express faith and worship him (vv. 35–38).'
  - where: 'note 9:38 “Lord, I believe”'
