    quote: 'It should be noted that St. John uses the word here rendered “worshipped” only when speaking of the worship of God.'
  - where: 'note 9:39 “That they which see might be made blind”'
    claim: '“Judgment” here is the result, the sentence; men pronounced sentence on themselves by accepting or rejecting Him'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/9.htm'
    quote: 'Judgment is not the ultimate end of His coming, for He came to save the world; but it is an end, and therefore a result. … as men accepted or rejected Him they pronounced a judicial sentence upon themselves.'
  - where: 'note 9:39 “That they which see might be made blind”'
