  - where: 'note 9:24 “Give God the praise”'
    claim: 'The Pharisees were convinced Jesus was a sinner because, in their minds, He had broken the Sabbath; the man answered simply with what he knew'
    key: strathearn-johannine-dialogues
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/johannine-christology-through-lens-three-its-dialogues'
    quote: 'More and more they were convinced that Jesus must have been a sinner because, in their minds, he had broken the Sabbath day. They therefore confronted the man again: “Give God the praise,” they declared, “we know that this man is a sinner.” But his response was simply'
  - where: 'note 9:34 “They cast him out”'
    claim: 'Unable to answer him, the Pharisees used their official authority and excommunicated him'
    key: talmage-jesus-christ-25
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-25?lang=eng'
    quote: 'Unable to cope with the sometime sightless beggar in argument or demonstration, they could at least exercise their official authority, however unjustly, by excommunicating him; and this they promptly did.'
  - where: 'note 9:34 “They cast him out”'
    claim: 'His growing spiritual sight led to his being cast out, but it also opened a door'
    key: strathearn-johannine-dialogues
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/johannine-christology-through-lens-three-its-dialogues'
    quote: 'This increasing spiritual sight that he was gaining resulted in the Pharisees casting him out (John 9:34), but it also opened a door.'
  - where: 'note 9:34 “They cast him out”'
    claim: 'The man had not technically fallen under the ban, not having confessed Jesus as Christ; the words may mean they thrust him from their presence'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/9.htm'
    quote: 'The man with all his boldness has not technically fallen under the ban they had threatened, for he has not “confessed that He was Christ” (John 9:22). … They can only heap reproaches upon him, and thrust him by force out of their presence.'
