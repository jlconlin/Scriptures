  - where: 'note 9:24 “Give God the praise”'
    claim: 'Joshua to Achan: give glory to the Lord and make confession'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/7?lang=eng'
