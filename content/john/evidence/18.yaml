  - where: 'note 18:31 “It is not lawful for us to put any man to death”'
    claim: 'The view that only the governor could execute rests on two pieces of evidence: Josephus on Coponius, and John 18:31'
    key: trotter-judea-province
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/judea-roman-province-ad-6-66'
    quote: 'The assertion that the Jewish authorities could not legally execute Jesus primarily relies on two pieces of evidence. The first is a statement made by Josephus indicating that Coponius became the first Roman governor of Judea “after he received authority to govern from Caesar, including the infliction of capital punishment.”'
  - where: 'note 18:31 “It is not lawful for us to put any man to death”'
    claim: 'They feared the people; a sentence by Pilate would put the blame and any tumult on him'
    key: trotter-judea-province
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/judea-roman-province-ad-6-66'
    quote: 'restrained themselves because “they feared the people” (Mark 12:12; Luke 20:19; 22:2). … By having Pilate pass the death sentence against Jesus, the Jewish leaders could deflect his disciples’ blame onto Pilate while simultaneously forcing the prefect to take responsibility for any ensuing tumult.'
  - where: 'note 18:31 “It is not lawful for us to put any man to death”'
    claim: 'The words may have been deferential; on some occasions the Jews had or took power to put people to death'
    key: welch-legal-cause
    url: 'https://rsc.byu.edu/celebrating-easter/legal-cause-action-against-jesus-john-1829-30'
    quote: 'It is possible that the Jews were just being careful and deferential toward Pilate, or perhaps even a bit disingenuous, hoping that he would take responsibility for executing Jesus. New Testament evidence (as in the attempts to stone Jesus in Nazareth or the incident of the woman taken in adultery) shows that on some occasions the Jews had or took power to put people to death.'
  - where: 'note 18:31 “It is not lawful for us to put any man to death”'
    claim: 'For the Romans crucifixion was a political and military punishment, used on the unruly of rebellious provinces such as Judea'
    key: holzapfel-passion
    url: 'https://rsc.byu.edu/sperry-symposium-classics-new-testament/passion-jesus-christ'
    quote: 'for the Romans it was a political and military punishment, inflicted primarily on the lower classes, slaves, violent criminals, and the unruly elements in rebellious provinces, not the least of which was Judea.'
  - where: 'note 18:31 “It is not lawful for us to put any man to death”'
    claim: 'The law of Moses: the blasphemer stoned'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/24?lang=eng'
    quote: 'And he that blasphemeth the name of the Lord, he shall surely be put to death, and all the congregation shall certainly stone him'
  - where: 'note 18:31 “It is not lawful for us to put any man to death”'
    claim: '“The Jews” here are the leaders who delivered Jesus to Pilate'
    key: trotter-judea-province
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/judea-roman-province-ad-6-66'
    quote: 'the Jewish leaders delivered Jesus to Pilate for trial, hoping the Roman governor would execute the punishment they had already determined he deserved.'
  - where: 'note 18:36 “My kingdom is not of this world”'
    claim: 'The servants of 18:36 (hypēretai) are a king’s retinue, the soldiers He would have if He were a king'
    key: thayer
    url: 'https://biblehub.com/greek/5257.htm'
    quote: 'of the attendants of a king, οἱ ὑπηρετοι οἱ ἐμοί, my servants, retinue, the soldiers I should have if I were a king, John 18:36'
  - where: 'note 18:36 “My kingdom is not of this world”'
    claim: 'An unarmed man; from His answer Pilate was satisfied He posed little threat to Rome'
    key: welch-legal-cause
    url: 'https://rsc.byu.edu/celebrating-easter/legal-cause-action-against-jesus-john-1829-30'
    quote: 'He was an unarmed pacifist, a Galilean peasant who said, “All they that take the sword shall perish with the sword” (Matthew 26:52). When asked by Pilate about His kingship, Jesus answered, “My kingdom is not of this world” (John 18:36). From his response, it appears that Pilate was satisfied that Jesus posed little, if any, threat to Rome'
  - where: 'note 18:37 “To bear witness unto the truth”'
