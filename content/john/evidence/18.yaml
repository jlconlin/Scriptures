chapter: 18
claims:
  # ---- when, setting, thread, sections
  - where: when
    claim: 'In John the Passover begins at sunset on the day of the crucifixion, so the arrest and trials come before it'
    key: huntsman-lamb-of-god
    url: 'https://rsc.byu.edu/behold-lamb-god/lamb-god-unique-aspects-passion-narrative-john'
    quote: 'the narrative of John seems to suggest that the Passover actually began at sunset on the day that Jesus was crucified—in other words, according to traditional reckoning on Friday evening rather than Thursday evening (see John 18:28; 19:31'
  - where: setting
    claim: 'From chapter 12 John joins the other Gospels for the sequence of the last week, yet differs: no suffering in Gethsemane among the differences'
    key: huntsman-lamb-of-god
    url: 'https://rsc.byu.edu/behold-lamb-god/lamb-god-unique-aspects-passion-narrative-john'
    quote: 'the Gospel of John, in chapters 12–20, joins the other Gospel accounts for the basic sequence of events of Jesus’s last week … the Johannine Passion narrative still exhibits some surprising differences … the omission of any report of Jesus’s suffering in the Garden of Gethsemane'
  - where: setting
    claim: 'John’s Jesus is the Divine Word who knows all things beforehand (13:1; 18:4)'
    key: huntsman-lamb-of-god
    url: 'https://rsc.byu.edu/behold-lamb-god/lamb-god-unique-aspects-passion-narrative-john'
    quote: 'the Johannine Jesus continues to be the powerful Divine Word who knows all things beforehand (see John 13:1, 18:4)'
  - where: setting
    claim: 'Only John has Jesus taken first to Annas; Matthew and Mark take Him directly to Caiaphas'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'Mark and Matthew, for instance, have Jesus taken directly to the home of the current high priest, whom Matthew identifies as Caiaphas, while John recounts that Jesus was first taken before Annas'
  - where: setting
    claim: 'John’s account of Pilate and Jesus is much expanded beyond the Synoptics'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'John’s account of Pilate’s interaction with Jesus is considerably expanded and frequently quite different from the versions presented by the Synoptics.'
  - where: thread
    claim: 'John portrays Jesus as fully in control at the arrest; He identifies Himself'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'As always, John’s account portrays Jesus as fully in control: he identifies himself rather than allowing Judas to do it (John 18:2‒7).'
  - where: thread
    claim: 'Peter’s “I am not” contrasts with Jesus’s “I am”'
    key: huntsman-peters-denial
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/accounts-peters-denial-understanding-texts-motifs'
    quote: 'his response “I am not” in the first and second denials contrast markedly with Jesus’ response to the high priest as preserved in Mark'
  - where: thread
    claim: 'Jesus, on trial, puts Pilate and all of us on trial'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'Jesus, himself on trial, instead puts Pilate, and all of us, on trial, calling upon us to take his side.'
  - where: 'note 18:1 “A garden, and no agony”'
    claim: 'John says only that Jesus crossed the Cedron to a garden; the garden is the scene of the arrest; Restoration scripture teaches the suffering there'
    key: huntsman-lamb-of-god
    url: 'https://rsc.byu.edu/behold-lamb-god/lamb-god-unique-aspects-passion-narrative-john'
    quote: 'the lack of any account of what happened in Gethsemane in John’s Gospel is striking, especially to Latter-day Saints who have a deeper understanding of the significance of this first step in the atoning journey that ended on the cross (see Mosiah 3:7; D&C 19:16–19).'
  - where: 'note 18:1 “A garden, and no agony”'
    claim: 'John was one of the three near witnesses; reverence, lost parts, or a literary focus on the death rather than the suffering'
    key: huntsman-lamb-of-god
    url: 'https://rsc.byu.edu/behold-lamb-god/lamb-god-unique-aspects-passion-narrative-john'
    quote: 'John was the only one who was one of the three near witnesses … It is not clear whether John passed over these details out of reverence or whether such plain and precious parts were later lost from his record. An additional possibility, however, is that because the theological focus of John’s Gospel is on the death of the Lamb of God rather than on His suffering, he omitted the suffering'
  - where: 'note 18:1 “A garden, and no agony”'
    claim: 'The Cedron is a winter torrent in the ravine east of Jerusalem, between the city and the Mount of Olives'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/18.htm'
    quote: 'The Greek words mean exactly “the winter torrent Kedron,” … the ravine through which it flowed, on the east of Jerusalem, between the city and the Mount of Olives.'
  - where: 'note 18:1 “A garden, and no agony”'
    claim: 'Mosiah 3:7 and D&C 19:16–19 on the suffering'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/19?lang=eng'
    quote: 'Which suffering caused myself, even God, the greatest of all, to tremble because of pain, and to bleed at every pore'
  - where: 'note 18:3 “A band of men and officers”'
    claim: 'Speira: a Roman military cohort'
    key: thayer
    url: 'https://biblehub.com/greek/4686.htm'
    quote: '2. (figuratively) a mass of men (a Roman military cohort)'
  - where: 'note 18:3 “A band of men and officers”'
    claim: 'Some propose a mixed Roman and Jewish party; more likely armed retainers of members of the Sanhedrin'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'some have proposed that the arresting party consisted of a mixed group of Roman soldiers and Jewish police. More likely, the party was made up of bodyguards and other retainers, or servants who had been armed (Greek, hypēretas; KJV, “officers”), of members of the Sanhedrin.'
  - where: 'note 18:6 “I am he”'
    claim: 'The Greek has egō eimi, “I am,” with no word for “he”'
    key: greek-nt
    url: 'https://biblehub.com/texts/john/18-5.htm'
    quote: 'λέγει αὐτοῖς· Ἐγώ εἰμι.'
  - where: 'note 18:11 “The cup which my Father hath given me”'
    claim: 'Only John names Peter and Malchus'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/18.htm'
    quote: 'The fact is recorded by all the Evangelists. St. John only tells us that it was done by Peter, and that the servant’s name was Malchus.'
  - where: 'note 18:11 “The cup which my Father hath given me”'
    claim: 'The only use of the cup image in John; Peter’s act opposes the Father’s will; an echo of the unrecorded Gethsemane prayer'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/18.htm'
    quote: 'This is the only instance of the occurrence of this familiar imagery in St. John. St. Peter’s act is one of opposition to what Jesus Himself knew to be the will of the Father. … They are, as it were, an echo of the prayer in the Garden of Gethsemane, which is not recorded by St. John.'
  - where: 'note 18:11 “The cup which my Father hath given me”'
    claim: 'At Bountiful He first calls it the bitter cup; drinking it is taking on the sins of the world'
    key: sc-knowhy-341
    url: 'https://scripturecentral.org/knowhy/what-can-we-learn-from-the-saviors-first-words-at-bountiful'
    quote: 'It is here, speaking to the Nephites and Lamanites, however, that He first calls it the “bitter cup.” … Drinking “the bitter cup” is thus an apt metaphor for “taking upon [Himself] … the sins of the world.”'
  - where: 'note 18:11 “The cup which my Father hath given me”'
    claim: '3 Ne. 11:11 and D&C 19:18–19 on the cup'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/11?lang=eng'
    quote: 'I have drunk out of that bitter cup which the Father hath given me, and have glorified the Father in taking upon me the sins of the world'
  - where: 'note 18:13 “To Annas first”'
    claim: 'Annas appointed AD 7, deposed AD 15; Caiaphas high priest AD 18–36; Annas influential and kept the title'
    key: bd-annas
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/annas?lang=eng'
    quote: 'Appointed high priest in A.D. 7 by the Roman legate Quirinius and deposed in A.D. 15 by Valerius Gratus. From A.D. 18–36 his son-in-law (John 18:13) Joseph Caiaphas was high priest, and during this time Annas was a person of great influence in the Sanhedrin. … he kept the title “high priest” after he was deposed'
  - where: 'note 18:15 “Another disciple”'
    claim: 'The other disciple is frequently identified with the Beloved Disciple, traditionally John; his being an informant may explain differences'
    key: huntsman-peters-denial
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/accounts-peters-denial-understanding-texts-motifs'
    quote: 'This other disciple is frequently identified with the main source and possible author of the Gospel, the figure of the Beloved Disciple, who has been traditionally identified with John himself.[51] The existence of another informant beside Peter himself may account in part for some of the differences in the Johannine version.'
  - where: 'note 18:15 “Another disciple”'
    claim: 'How he was known to the high priest cannot be judged'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/18.htm'
    quote: 'How he was known we have no means of judging.'
  - where: 'note 18:17 “I am not”'
    claim: 'The maid is the doorkeeper; Peter’s first denial is the single statement ouk eimi'
    key: huntsman-peters-denial
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/accounts-peters-denial-understanding-texts-motifs'
    quote: 'the maid (paidiskē; KJV, “damsel”) is specifically identified as a thyrōros or doorkeeper … his first denial in the Johannine account consists of the single statement, “I am not [ouk eimi]” (John 18:17).'
  - where: 'note 18:17 “I am not”'
    claim: 'John’s denials are softer, without cursing and swearing; the cock crow is the last word, no weeping'
    key: huntsman-peters-denial
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/accounts-peters-denial-understanding-texts-motifs'
    quote: 'John’s account of Peter’s denials is actually softer, without the progressively more severe denials found in Mark and Matthew, and likewise lacking the accompanying cursing and swearing.'
  - where: 'note 18:17 “I am not”'
    claim: 'The egō eimi formula on Jesus’s lips highlights Peter’s disassociation; John ends on the crow'
    key: huntsman-peters-denial
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/accounts-peters-denial-understanding-texts-motifs'
    quote: 'the egō eimi formula is a common expression on the lips of Jesus in that Gospel, highlighting the extent of Peter’s disassociation from the Lord. John’s account leaves the condemnatory crow as the last word, omitting any references to Peter’s crying'
  - where: 'note 18:17 “I am not”'
    claim: 'Peter never denied his testimony that Jesus is the Christ; arneomai means to repudiate or disown'
    key: huntsman-peters-denial
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/accounts-peters-denial-understanding-texts-motifs'
    quote: 'While President Kimball is correct that Peter never denied the revelation he had received at Caesarea Philippi regarding Jesus’ divine identity and mission,[54] his denial of Jesus and his association is consonant with the still serious meaning of arneomai, which is to repudiate or disown.'
  - where: 'note 18:17 “I am not”'
    claim: 'We should not judge Peter’s motivations'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'Although we do not know, and should not judge, the motivations of the historical figure of Peter'
  - where: 'note 18:28 “That they might eat the passover”'
    claim: 'They feared defilement by entering a Gentile dwelling, which would bar them from the Passover meal that evening'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'they refuse to enter the governor’s residence because, according to John’s chronology, Passover would begin at sunset that day, and they did not want to ritually defile themselves by entering a Gentile dwelling where a number of different impurities might prevent them from eating the Passover meal that evening'
  - where: 'note 18:28 “That they might eat the passover”'
    claim: 'The Synoptics make the Last Supper a Passover meal; John’s timing ties Jesus’s death to the slaying of the lambs'
    key: huntsman-lamb-of-god
    url: 'https://rsc.byu.edu/behold-lamb-god/lamb-god-unique-aspects-passion-narrative-john'
    quote: 'This timing appears to have been significant for John because of its connection to the slaying of the Paschal Lambs before the Passover festival.'
  - where: 'note 18:30 “A malefactor”'
    claim: 'Kakon poiōn, an evildoer; perhaps John’s way of showing Isaiah 53:9 fulfilled'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'which might have been this Gospel’s way of showing that Jesus was fulfilling Isaiah 53:9, which portrayed the Suffering Servant as being numbered among the wicked'
  - where: 'note 18:30 “A malefactor”'
    claim: 'The word can mean magician or sorcerer in legal contexts; Welch concludes the charge was illegal miracle working'
    key: welch-legal-cause
    url: 'https://rsc.byu.edu/celebrating-easter/legal-cause-action-against-jesus-john-1829-30'
    quote: 'the English word malefactor is the translation of the Greek work kakopoios, which (like its closely related Latin word, maleficus) in legal contexts can mean “magician” or “sorcerer.”'
  - where: 'note 18:30 “A malefactor”'
    claim: 'Welch’s conclusion: the cause of action was that He was an illegal miracle worker'
    key: welch-legal-cause
    url: 'https://rsc.byu.edu/celebrating-easter/legal-cause-action-against-jesus-john-1829-30'
    quote: 'I conclude that the legal cause of action brought by the chief priests against Jesus as they ushered Him into Pilate’s chamber was that He was an illegal miracle worker or magician, using illicit powers to threaten the public order, both Roman and Jewish'
  - where: 'note 18:31 “It is not lawful for us to put any man to death”'
    claim: 'The Sanhedrin had no power to carry out a death sentence; Pilate’s consent was needed'
    key: bd-pilate
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/pilate?lang=eng'
    quote: 'As the Sanhedrin had no power to carry out their sentence of death, Pilate’s consent had to be obtained.'
  - where: 'note 18:36 “My kingdom is not of this world”'
    claim: 'Jesus’s counter-question asks whether Pilate means an earthly kingdom or the Messianic sense; yes or no would each mislead'
    key: talmage-jesus-christ-34
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-34?lang=eng'
    quote: 'Do you ask this in the Roman and literal sense—as to whether I am a king of an earthly kingdom—or with the Jewish and more spiritual meaning? A direct answer “Yes” would have been true in the Messianic sense, but untrue in the worldly signification'
  - where: 'note 18:36 “My kingdom is not of this world”'
    claim: 'A claim to be King of the Jews could be seen as treasonous'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'When Pilate asks whether Jesus is in fact the King of the Jews, a claim that could be seen as treasonous to Roman rule'
  - where: 'note 18:37 “To bear witness unto the truth”'
    claim: 'The turn from kingship to truth: His witness of truth is a witness of Himself (John 14:6)'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'The shift of the discussion from kingship to truth accomplishes two things. First, Jesus’s bearing witness of the truth is, in effect, a witness of himself inasmuch as he had taught his disciples in the Farewell Discourses, “I Am the Way / and the Truth / and the Life” (John 14:6)'
  - where: 'note 18:38 “What is truth?”'
    claim: 'Elder Uchtdorf hears weary cynicism; Pilate was not inviting dialogue; perhaps asking how anyone can know the truth'
    key: uchtdorf-what-is-truth
    url: 'https://speeches.byu.edu/talks/dieter-f-uchtdorf/what-is-truth/'
    quote: 'I sense a certain weary cynicism in Pilate’s reply. … I don’t believe Pilate was encouraging a dialogue when he responded with three simple words: “What is truth?” … I wonder if what he really was asking was “How can anyone possibly know the truth?”'
  - where: 'note 18:38 “What is truth?”'
    claim: 'The Father knows truth as it was, is and will be; the truth is the gospel of Jesus Christ'
    key: uchtdorf-what-is-truth
    url: 'https://speeches.byu.edu/talks/dieter-f-uchtdorf/what-is-truth/'
    quote: 'He knows truth as it was, as it is, and as it yet will be.14'
  - where: 'note 18:38 “What is truth?”'
    claim: 'The truth is the gospel; Jesus Christ is the way, the truth and the life'
    key: uchtdorf-what-is-truth
    url: 'https://speeches.byu.edu/talks/dieter-f-uchtdorf/what-is-truth/'
    quote: 'It is His gospel. It is the gospel of Jesus Christ. Jesus Christ is “the way, the truth, and the life.”'
  - where: 'note 18:38 “What is truth?”'
    claim: 'Talmage: exclaimed in apprehension, not expecting an answer; Pilate announced acquittal'
    key: talmage-jesus-christ-34
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-34?lang=eng'
    quote: '“What is truth?” he rather exclaimed in apprehension than inquired in expectation of an answer, as he started to leave the hall. To the Jews without he announced officially the acquittal of the Prisoner.'
  - where: 'note 18:38 “What is truth?”'
    claim: 'D&C 93:24 defines truth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/93?lang=eng'
    quote: 'And truth is knowledge of things as they are, and as they were, and as they are to come'
  - where: 'note 18:40 “Not this man, but Barabbas”'
    claim: 'Whose custom the release was is unclear; it accorded with the Passover theme of deliverance'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'Whether this was Pilate’s own practice (Mark 15:6), possibly that of all Roman governors (Matt 27:15; Luke 23:17), or a Jewish custom that Pilate had adopted is unclear; nevertheless, freeing a prisoner certainly accorded with an important theme of Passover, which was the deliverance of the children of Israel from bondage.'
  - where: 'note 18:40 “Not this man, but Barabbas”'
    claim: 'Lēistēs can mean bandit; Barabbas was an insurgent, guilty of what the leaders implied of Jesus'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'the Greek term it translates [lēistēs] can mean a “bandit” or “brigand”), references in the Synoptic accounts to revolutionaries (Greek, stasiastai) and an uprising (Greek, stasis) make it clear that Barabbas was an insurgent of some kind.[33] In other words, he was guilty of actual insurrection against Rome, the very thing that the Jewish leadership implied Jesus was fomenting'
  - where: 'note 18:40 “Not this man, but Barabbas”'
    claim: 'Barabbas means “son of the father”; the irony'
    key: holland-none-with-him
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2009/04/none-were-with-him?lang=eng'
    quote: 'a murderer and revolutionary known as Barabbas, a name or title in Aramaic meaning “son of the father.” … So one godless “son of the father” was set free while a truly divine Son of His Heavenly Father moved on to crucifixion.'
  - where: 'note 18:40 “Not this man, but Barabbas”'
    claim: 'Barabbas fits the role of the scapegoat; two goats of Leviticus 16 (a reading)'
    key: sc-knowhy-675
    url: 'https://scripturecentral.org/knowhy/how-does-the-gospel-of-john-reflect-the-day-of-atonement'
    quote: 'Barabbas, who was released by Pilate into the hands of the people, then thematically fits the role of the scapegoat (see John 18:39–40). … the two goats from Leviticus 16 were symbolically involved in John: the one was sacrificed and the other carried away the impurities.'
  - where: 'note 18:28 “That they might eat the passover”'
    claim: 'Jesus died as the priests began slaughtering the Passover lambs'
    key: huntsman-lamb-of-god
    url: 'https://rsc.byu.edu/behold-lamb-god/lamb-god-unique-aspects-passion-narrative-john'
    quote: 'In other words, Jesus, the Lamb of God, died as a sacrifice on the cross at the moment that the priests of the temple began slaughtering the Paschal Lambs.'
  - where: 'note 18:30 “A malefactor”'
    claim: 'Both Jews and Romans had laws punishing magicians and miracle workers'
    key: welch-legal-cause
    url: 'https://rsc.byu.edu/celebrating-easter/legal-cause-action-against-jesus-john-1829-30'
    quote: 'In certain cases, both Jews and Romans had strict laws that punished magicians, sorcerers, fortune-tellers, diviners, those in contact with spirits, and miracle workers.'
  - where: 'section 1 plain'
    claim: 'The “band” (speira) is a military cohort'
    key: thayer
    url: 'https://biblehub.com/greek/4686.htm'
    quote: 'b. a military cohort'
  - where: 'section 1 plain'
    claim: 'The “officers” are the officers of the Sanhedrin, as in 7:32, 45'
    key: thayer
    url: 'https://biblehub.com/greek/5257.htm'
    quote: 'of the servants or officers of the Sanhedrin, Matthew 26:58; Mark 14:54, 65; John 7:32, 45; John 18:3, 12, 22'
  - where: 'section 6 plain'
    claim: 'The “hall of judgment” (praitōrion) is the governor’s residence'
    key: thayer
    url: 'https://biblehub.com/greek/4232.htm'
    quote: 'the palace in which the governor or procurator of a province resided'
  - where: 'section 6 plain'
    claim: '“Malefactor” (kakopoios) is an evildoer'
    key: thayer
    url: 'https://biblehub.com/greek/2555.htm'
    quote: 'doing evil; a substantive, an evil-doer, malefactor: John 18:30'
  - where: 'note 18:3 “A band of men and officers”'
    claim: 'The “captain” of 18:12 (chiliarchos) is the commander of a thousand soldiers'
    key: strongs-greek
    url: 'https://biblehub.com/greek/5506.htm'
    quote: 'the commander of a thousand soldiers ("chiliarch")'
  - where: 'note 18:3 “A band of men and officers”'
    claim: 'The officers (hypēretai) are the officers of the Sanhedrin, as in 7:32, 45'
    key: thayer
    url: 'https://biblehub.com/greek/5257.htm'
    quote: 'of the servants or officers of the Sanhedrin, Matthew 26:58; Mark 14:54, 65; John 7:32, 45; John 18:3, 12, 22'
  - where: 'note 18:3 “A band of men and officers”'
    claim: 'The chief priests and Pharisees had sent officers to take Him before'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/7?lang=eng'
    quote: 'the Pharisees and the chief priests sent officers to take him'
  - where: 'note 18:6 “I am he”'
    claim: 'The fall read beside the Day of Atonement, when the people prostrated themselves on hearing the high priest speak the name'
    key: sc-knowhy-675
    url: 'https://scripturecentral.org/knowhy/how-does-the-gospel-of-john-reflect-the-day-of-atonement'
    quote: 'John also records that “as soon then as he had said unto them, I am he [egō eimi], they went backward, and fell to the ground”—similar to how the people would prostrate themselves on the Day of Atonement upon hearing the High Priest speak that holy name (John 18:6).'
  - where: 'note 18:6 “I am he”'
    claim: 'Egō eimi can be “I am he” or “I Am,” the divine name; or a picture of the power of His divine voice'
    key: huntsman-thursday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/thursday'
    quote: 'this expression can be rendered either “I am he” or “I Am,” with the latter frequently being used in John to render the Hebrew divine name YHWH, or Jehovah. … Alternately, the evangelist was painting a picture of the power of Jesus’s divine voice'
  - where: 'note 18:13 “To Annas first”'
    claim: 'In John the council had already ruled, at Caiaphas’s word, that Jesus should die (11:47–53)'
    key: welch-roman-law
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/roman-law-relating-new-testament'
    quote: 'Caiaphas had issued a ruling of the “council” (John 11:47, sanhedrion) by speaking, “not of himself” (11:51) but as the high priest, that Jesus should die'
  - where: 'note 18:13 “To Annas first”'
    claim: 'So the night hearing was no retrial: He was questioned about His teachings and followers, and taken to Pilate in hope he would carry out the decision'
    key: welch-roman-law
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/roman-law-relating-new-testament'
    quote: 'there was no need for a retrial. Jesus was asked questions about his teachings and his followers … they apparently hoped that the Roman prefect would show deference to the Sanhedrin’s decision and carry out the execution.'
  - where: 'note 18:23 “Why smitest thou me?”'
    claim: 'In a Jewish court each party brought witnesses, who were examined'
