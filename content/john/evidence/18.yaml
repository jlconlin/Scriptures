    url: 'https://interpreterfoundation.org/journal/jesuss-courtroom-in-john'
    quote: 'Each party brought forth witnesses who were examined.'
  - where: 'note 18:23 “Why smitest thou me?”'
    claim: 'The rules come from the Mishnah, a second-century text, but the trial of Jesus shows something like them in use'
    key: gee-courtroom-john
    url: 'https://interpreterfoundation.org/journal/jesuss-courtroom-in-john'
    quote: 'The Jewish model comes from the Mishnah which is a second century text rather than a first century one, but the trial of Jesus before the Sanhedrin shows that something like the prescriptions in the Mishnah was in use in Jesus’s day.'
