  - where: 'note 18:40 “Not this man, but Barabbas”'
    claim: 'Whose custom the release was is unclear; it accorded with the Passover theme of deliverance'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'Whether this was Pilate’s own practice (Mark 15:6), possibly that of all Roman governors (Matt 27:15; Luke 23:17), or a Jewish custom that Pilate had adopted is unclear; nevertheless, freeing a prisoner certainly accorded with an important theme of Passover, which was the deliverance of the children of Israel from bondage.'
  - where: 'note 18:40 “Not this man, but Barabbas”'
    claim: 'Lēistēs can mean bandit; Barabbas was an insurgent, guilty of what the leaders implied of Jesus'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'the Greek term it translates [lēistēs] can mean a “bandit” or “brigand”), references in the Synoptic accounts to revolutionaries (Greek, stasiastai) and an uprising (Greek, stasis) make it clear that Barabbas was an insurgent of some kind.[33] In other words, he was guilty of actual insurrection against Rome, the very thing that the Jewish leadership implied Jesus was fomenting'
  - where: 'note 18:40 “Not this man, but Barabbas”'
    claim: 'Barabbas means “son of the father”; the irony'
    key: holland-none-with-him
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2009/04/none-were-with-him?lang=eng'
    quote: 'a murderer and revolutionary known as Barabbas, a name or title in Aramaic meaning “son of the father.” … So one godless “son of the father” was set free while a truly divine Son of His Heavenly Father moved on to crucifixion.'
  - where: 'note 18:40 “Not this man, but Barabbas”'
    claim: 'Barabbas fits the role of the scapegoat; two goats of Leviticus 16 (a reading)'
    key: sc-knowhy-675
    url: 'https://scripturecentral.org/knowhy/how-does-the-gospel-of-john-reflect-the-day-of-atonement'
    quote: 'Barabbas, who was released by Pilate into the hands of the people, then thematically fits the role of the scapegoat (see John 18:39–40). … the two goats from Leviticus 16 were symbolically involved in John: the one was sacrificed and the other carried away the impurities.'
  - where: 'note 18:3 “A band of men and officers”'
    claim: 'The officers are the temple servants of 7:32, 45, sent here as there by the chief priests and Pharisees, backed by the civil power'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/18.htm'
    quote: 'the “officers” were the Temple servants, of whom we read in John 7:32; John 7:45. These were sent, here, as there, by the chief priests and Pharisees, with Judas for their guide, and their authority was supported by the civil power.'
  - where: 'note 18:9 “Of them which thou gavest me have I lost none”'
    claim: 'The Good Shepherd goes forth to meet the danger and shields the flock'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/18.htm'
    quote: 'the Good Shepherd, who Himself goes forth to meet the danger, will shield the flock from it.'
  - where: 'note 18:28 “That they might eat the passover”'
    claim: 'Jesus died as the priests began slaughtering the Passover lambs'
    key: huntsman-lamb-of-god
    url: 'https://rsc.byu.edu/behold-lamb-god/lamb-god-unique-aspects-passion-narrative-john'
    quote: 'In other words, Jesus, the Lamb of God, died as a sacrifice on the cross at the moment that the priests of the temple began slaughtering the Paschal Lambs.'
  - where: 'note 18:30 “A malefactor”'
    claim: 'Both Jews and Romans had laws punishing magicians and miracle workers'
    key: welch-legal-cause
    url: 'https://rsc.byu.edu/celebrating-easter/legal-cause-action-against-jesus-john-1829-30'
    quote: 'In certain cases, both Jews and Romans had strict laws that punished magicians, sorcerers, fortune-tellers, diviners, those in contact with spirits, and miracle workers.'
  - where: 'note 18:31 “It is not lawful for us to put any man to death”'
    claim: 'Rome sometimes curtailed local executions, giving the governor review of capital cases to prevent judicial murder of opponents'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'While there were instances when Rome curtailed the ability of local authorities to execute convicted criminals, usually giving the governor the power to review capital cases to avoid instances of judicial murder aimed at political opponents'
