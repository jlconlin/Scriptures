chapter: 19
claims:
  # ---- when, setting, thread
  - where: when
    claim: 'In John the Passover began at sunset after Jesus died; the preparation day was the day the Passover was prepared'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'in John the festival began at sunset after Jesus died on the cross (John 18:28; 19:31, in which the preparation day was likely the day when the Passover was prepared).'
  - where: setting
    claim: 'John joins the other accounts for the basic sequence of the last week, yet differs: the timing before the Passover, Jesus carrying His own cross without Simon, and “It is finished”'
    key: huntsman-lamb-of-god
    url: 'https://rsc.byu.edu/behold-lamb-god/lamb-god-unique-aspects-passion-narrative-john'
    quote: 'the timing of the Last Supper and the Crucifixion, which John actually places before the Passover; … the portrayal of Jesus’s carrying His own cross all the way to Golgotha without any reference to Simon of Cyrene; and the words “It is finished”'
  - where: setting
    claim: 'Only John has the request to break the legs, the spear, and Nicodemus with the spices'
    key: strathearn-crucifixion
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/crucifixion'
    quote: 'Only John records that the Jews came to Pilate asking him to break the victims’ legs … but John alone identifies Nicodemus as the one who brought spices to prepare the body for burial (John 19:39–40).'
  - where: setting
    claim: 'The association of Jesus with the Passover lamb explains many unique features of John’s Passion narrative'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'This association of Jesus with the Passover lamb explains many of the unique features of the Passion narrative in John that differ from the versions presented by the Synoptics.'
  - where: thread
    claim: '“Behold your King!” is bitter irony, as are the words of verse 15 and the title on the cross'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/19.htm'
    quote: 'The words are spoken in bitter irony towards the Jews, as those in the following verse and those written over the cross (John 19:19).'
  - where: thread
    claim: 'The charge “King of the Jews” focused on His identity as the Christ'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'the charge that the Sanhedrin lodged with Pilate against Jesus, that he was the King of the Jews, focused on his identity as the Christ.'
  - where: thread
    claim: 'John portrays Jesus at His death as strong, in control and divine'
    key: huntsman-lamb-of-god
    url: 'https://rsc.byu.edu/behold-lamb-god/lamb-god-unique-aspects-passion-narrative-john'
    quote: 'the significance of John’s choice is that Jesus is portrayed in a manner consistent with His image elsewhere in this Gospel: strong, in control, and divine.'
  # ---- notes
  - where: 'note 19:1 “Scourged and mocked”'
    claim: 'Luke has Pilate offer to beat Jesus; in John he does it, a whipping (emastigōsen) like the thirty-nine stripes, before presenting Him'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'In the longer trial narrative of John, Pilate actually follows through and has Jesus whipped (Greek, emastigōsen), which is a more severe form of flogging or beating threatened in Luke and one similar to the serious but not fatal Jewish punishment of “thirty-nine stripes”'
  - where: 'note 19:1 “Scourged and mocked”'
    claim: 'In Mark and Matthew the scourging (phragellōsas) follows the sentence and could kill'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'In Mark and Matthew, Pilate then has Jesus scourged (Greek, phragellōsas), a terrible and severe whipping preliminary to execution that could kill the condemned even before crucifixion'
  - where: 'note 19:1 “Scourged and mocked”'
    claim: 'Abinadi: He suffers Himself to be mocked and scourged (the footnote to 19:1 gives Mosiah 15:5)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/15?lang=eng'
    quote: 'suffereth himself to be mocked, and scourged, and cast out, and disowned by his people.'
  - where: 'note 19:5 “Behold the man!”'
    claim: 'Pilate may have meant to sway the crowd; the marred appearance fulfilled the Suffering Servant prophecy'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'While Pilate might have intended to sway the crowd with the sight of a tortured and bleeding Jesus, the Lord’s marred appearance was, in fact, a fulfillment of the prophesied image of the Suffering Servant (Isa 52:14; 53:5, 10).'
  - where: 'note 19:7 “Because he made himself the Son of God”'
    claim: 'The footnote to “law” gives Leviticus 24:16; to “Son of God” John 5:18 and 10:33'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/19?lang=eng'
    quote: '“Son of God”: John 5:18 (17–18); 10:33; Mosiah 15:2.'
  - where: 'note 19:9 “Whence art thou?”'
    claim: 'The footnote to “answer” gives Mosiah 14:7 and 15:6'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/19?lang=eng'
    quote: '9a “answer”: Mosiah 14:7; 15:6.'
  - where: 'note 19:9 “Whence art thou?”'
    claim: 'Abinadi: as a sheep before the shearer is dumb, so he opened not his mouth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/15?lang=eng'
    quote: 'he shall be led, yea, even as Isaiah said, as a sheep before the shearer is dumb, so he opened not his mouth.'
  - where: 'note 19:11 “Given thee from above”'
    claim: 'The footnote to “sin” gives John 18:14'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/19?lang=eng'
    quote: '11b “sin”: John 18:14.'
  - where: 'note 19:12 “Not Caesar’s friend”'
    claim: 'The threat to report Pilate to Rome, amid treason trials under Tiberius; his possible patron Sejanus recently purged'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'Threatening to report Pilate to authorities in Rome if he releases Jesus would have made a powerful impression upon Pilate, given the flurry of treason trials in Rome over real and perceived conspiracies against the emperor Tiberius at that time.'
  - where: 'note 19:12 “Not Caesar’s friend”'
    claim: 'Sejanus, Pilate’s possible patron, had been purged; Pilate may have felt in jeopardy'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'because Pilate’s possible patron, Sejanus, had recently been purged for a plot against the emperor, Pilate may have felt in jeopardy himself, making him particularly susceptible to this kind of pressure.'
  - where: 'note 19:12 “Not Caesar’s friend”'
    claim: 'Prophecy and miracle working against the emperor had become punishable by death by a decree of Augustus in AD 11; for this reason the chief priests said Jesus spoke against Caesar'
    key: sc-knowhy-676
    url: 'https://scripturecentral.org/knowhy/why-was-jesus-put-on-trial-and-crucified'
    quote: 'It is for this reason that the chief priests said that Jesus “speaketh against Caesar” … These outlawed forms of prophecy and miracle working “had recently become punishable by death” by a decree of Augustus Caesar in AD 11'
  - where: 'note 19:12 “Not Caesar’s friend”'
    claim: 'Under Tiberius the accusation of treason was practically the proof; they knew His kingship was no threat to Caesar'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/19.htm'
    quote: 'The jealous fear of Tiberius had made “treason” a crime, of which the accusation was practically the proof, and the proof was death. … They knew, indeed, that it was a claim to be “king” in a sense widely different from any which would have affected the empire of Cæsar'
  - where: 'note 19:14 “The preparation of the passover, the sixth hour”'
    claim: 'Mark has the crucifixion at the third hour; John has Pilate deliver Jesus at the sixth hour, noon; Jesus hangs for a shorter time'
    key: huntsman-lamb-of-god
    url: 'https://rsc.byu.edu/behold-lamb-god/lamb-god-unique-aspects-passion-narrative-john'
    quote: 'John, either recollecting differently or perhaps realizing that this did not provide enough time for all the activities involved in the trial and abuse of Jesus, states instead that Pilate did not even present Jesus to the hostile crowd and deliver Him over for crucifixion until the sixth hour, or about noon'
  - where: 'note 19:14 “The preparation of the passover, the sixth hour”'
    claim: 'John 19:14 suggests Jesus was killed when the Passover lambs were slaughtered; the important thing is His death coincided with the Passover; the Lamb of God'
    key: sc-knowhy-845
    url: 'https://scripturecentral.org/knowhy/why-is-the-passover-important-for-understanding-easter'
    quote: 'suggesting that Jesus was killed at the same time the Passover lambs were being slaughtered in the temple prior to their meal after sundown. … Regardless, the important thing is that His death coincided with the Passover season.'
  - where: 'note 19:17 “Bearing his cross”'
    claim: 'John omits Simon of Cyrene; Jesus bears His own cross the whole way, accomplishing His sacrifice on His own'
    key: huntsman-lamb-of-god
    url: 'https://rsc.byu.edu/behold-lamb-god/lamb-god-unique-aspects-passion-narrative-john'
    quote: 'The Johannine Jesus, however, does not need any help, bearing His own cross the entire way (see John 19:17) and accomplishing His atoning sacrifice completely on His own.'
  - where: 'note 19:17 “Bearing his cross”'
    claim: 'Isaac carried the wood for the offering, Christ the wood of the cross; both offered themselves voluntarily'
    key: sc-knowhy-412
    url: 'https://scripturecentral.org/knowhy/how-abrahams-sacrifice-of-isaac-illuminates-the-atonement'
    quote: 'Both Isaac and Christ carried wood with them when they were being offered up: Isaac carried the wood for the burnt offering (Genesis 22:6) and Christ carried the wood of the cross upon which he would become an offering (John 19:17).'
  - where: 'note 19:17 “Bearing his cross”'
    claim: 'Isaac, strong enough to carry the wood, offered himself voluntarily, as Christ did'
    key: sc-knowhy-412
    url: 'https://scripturecentral.org/knowhy/how-abrahams-sacrifice-of-isaac-illuminates-the-atonement'
    quote: 'Both Isaac and Christ offered themselves voluntarily. If Isaac was strong enough to carry the wood for a burnt offering on his back, he was likely strong enough to overpower his aged father'
  - where: 'note 19:19 “The title on the cross”'
    claim: 'The charge King of the Jews focused on His identity as the Christ'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'the charge that the Sanhedrin lodged with Pilate against Jesus, that he was the King of the Jews, focused on his identity as the Christ.'
  - where: 'note 19:23 “The coat without seam”'
    claim: 'Psalm 22:18: they part my garments and cast lots upon my vesture (the footnote to “raiment”)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/19?lang=eng'
    quote: '“raiment”: Ps. 22:18.'
  - where: 'note 19:25 “The women by the cross”'
    claim: 'Three or four women? The balance favors four in two pairs; the Peshitta inserted “and”; Clopas usually identified with Alphaeus'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/19.htm'
    quote: 'The question cannot be answered with certainty; but upon the whole, the balance of evidence inclines to the view that we have four persons here mentioned in two pairs'
  - where: 'note 19:25 “The women by the cross”'
    claim: 'The unnamed sister may be John’s own mother, Salome, whom he nowhere names'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/19.htm'
    quote: 'or does St. John mean by “His mother’s sister” an unnamed woman, who may not improbably be his own mother, Salome, whom he nowhere mentions?'
  - where: 'note 19:25 “The women by the cross”'
    claim: 'Elder Holland: John stood at the foot of the cross with Jesus’s mother; the women stayed as close as they could'
    key: holland-none-with-him
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2009/04/none-were-with-him?lang=eng'
    quote: 'John stood at the foot of the cross with Jesus’s mother. Especially and always the blessed women in the Savior’s life stayed as close to Him as they could.'
  - where: 'note 19:26 “Woman, behold thy son!”'
    claim: 'John refers to himself as the disciple whom Jesus loved'
    key: bd-john
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/john?lang=eng'
    quote: 'In his own Gospel he refers to himself as “the disciple whom Jesus loved” (John 13:23; 19:26; 20:2; 21:7, 20)'
  - where: 'note 19:28 “I thirst”'
    claim: 'The footnote to “vinegar” gives Psalm 69:21'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/19?lang=eng'
    quote: '29a “vinegar”: Ps. 69:21.'
  - where: 'note 19:28 “I thirst”'
    claim: 'In John Jesus purposely asks for a drink to fulfill scripture; the vinegar was cheap wine vinegar'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'In John, however, Jesus purposely asks for something to drink in order to fulfill scripture, and, interestingly, the soldier uses a hyssop branch to lift it to his mouth (John 19:28‒29).'
  - where: 'note 19:28 “I thirst”'
    claim: '“Accomplished” in verse 28 and “It is finished” in verse 30 are the same Greek word, tetelestai'
    key: thayer
    url: 'https://biblehub.com/greek/5055.htm'
    quote: 'to perform the last act which completes a process, to accomplish, fulfill … πάντα, passive, John 19:28'
  - where: 'note 19:28 “I thirst”'
    claim: 'John mentions hyssop to evoke the Passover command of Exodus 12:22'
    key: sc-knowhy-845
    url: 'https://scripturecentral.org/knowhy/why-is-the-passover-important-for-understanding-easter'
    quote: 'Whereas Matthew and Mark simply mention a "reed" was used, John likely mentions hyssop more specifically to evoke the command to use a sprig of hyssop to smear the blood of the Passover lamb on their doorposts as recorded in Exodus 12:22.'
  - where: 'note 19:28 “I thirst”'
    claim: 'The hyssop’s branches were too short and its stalk too flimsy to bear the sponge'
    key: huntsman-lamb-of-god
    url: 'https://rsc.byu.edu/behold-lamb-god/lamb-god-unique-aspects-passion-narrative-john'
    quote: 'A short shrub, the hyssop’s branches would probably not have been long enough to reach the lips of a man suspended on a cross, even if the cross was relatively short, and its stalk would have been too flimsy to bear the sponge.'
  - where: 'note 19:30 “It is finished”'
    claim: 'Tetelestai: everything has been accomplished which by the appointment of the Father as revealed in the Scriptures I must do and bear'
    key: thayer
    url: 'https://biblehub.com/greek/5055.htm'
    quote: 'τετέλεσται (A. V. it is finished) everything has been accomplished which by the appointment of the Father as revealed in the Scriptures I must do and bear, John 19:30.'
  - where: 'note 19:30 “It is finished”'
    claim: 'Jesus on His own gave up the ghost; no one could take His life; John 10:17–18'
    key: huntsman-lamb-of-god
    url: 'https://rsc.byu.edu/behold-lamb-god/lamb-god-unique-aspects-passion-narrative-john'
    quote: 'In all other accounts of Jesus’s death and Resurrection—including those in the other Gospels, the speeches of Peter in Acts, and the writings of Paul—Jesus is slain by His enemies and raised by God.'
  - where: 'note 19:30 “It is finished”'
    claim: '“Gave up the ghost” is paredōken, “handed over his spirit,” continuing the chain of handing over'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: '“Handing over” his spirit not only continues the chain of handing Jesus over to his destined death, but it also is in harmony with the Christology of John'
  - where: 'note 19:31 “That their legs might be broken”'
    claim: 'The Romans left bodies on the cross; to the Jews this was defilement (Deut. 21:22–23), the more so before a high day'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/19.htm'
    quote: 'The Roman custom was to allow the bodies to remain on the cross. To the Jews this was defilement (Deuteronomy 21:22-23), against which they were the more anxious to take precaution because the approaching Sabbath was “an high day.”'
  - where: 'note 19:31 “That their legs might be broken”'
    claim: 'Breaking legs as a punishment is well attested but little associated with crucifixion; the spear has support (Quintilian)'
    key: strathearn-crucifixion
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/crucifixion'
    quote: 'That the Romans broke people’s legs as a form of severe punishment is well attested, but there is little evidence to suggest that it was associated with crucifixion—probably because crucifixion was not meant to be sped up.'
  - where: 'note 19:31 “That their legs might be broken”'
    claim: 'In John’s chronology both Passover and probably the weekly Sabbath would begin at sunset'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'Because both Passover and probably the weekly Sabbath will begin at the setting of the sun according to this Gospel’s chronology, the Jewish leaders ask that the legs of the condemned be broken to hasten their deaths.'
  - where: 'note 19:31 “That their legs might be broken”'
    claim: 'Another reading: the high day was the first day of Passover, a festival Sabbath that may have fallen on Friday'
    key: sc-knowhy-300
    url: 'https://scripturecentral.org/knowhy/how-does-the-book-of-mormon-help-date-christs-death'
    quote: 'this allows for the possibility that the Sabbath after the crucifixion was not Saturday (the regular Jewish Sabbath), but the first day of Passover (a special “Sabbath,” or “high day”), which most likely fell on Friday in AD 30.'
  - where: 'note 19:34 “Blood and water”'
    claim: 'The spear confirmed He was dead'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'Instead, to confirm that Jesus is actually dead, they pierce his side with a spear, causing blood and water to pour out of the wound.'
  - where: 'note 19:34 “Blood and water”'
    claim: 'The blood represents His humanity and mortality; some see the water as the Spirit (7:37–39), or as purification'
    key: huntsman-lamb-of-god
    url: 'https://rsc.byu.edu/behold-lamb-god/lamb-god-unique-aspects-passion-narrative-john'
    quote: 'Treatments of this symbol have rightly noted that the blood represents the humanity—and the mortality—of Jesus, but they often differ on the significance of the water.'
  - where: 'note 19:34 “Blood and water”'
    claim: 'Water as everlasting life; blood from His mother, by which He could lay down His life; water from His Father, by which He could take it again'
    key: huntsman-lamb-of-god
    url: 'https://rsc.byu.edu/behold-lamb-god/lamb-god-unique-aspects-passion-narrative-john'
    quote: 'Due to His mortal inheritance from His mother, Mary, represented by the flowing blood, Jesus was able to lay down His life as a sacrifice for sin. Because of His divine, immortal inheritance from God, His Father, represented by the stream of water, He was able to take His life up again'
  - where: 'note 19:34 “Blood and water”'
    claim: 'The writer speaks of himself in the third person and stresses that an eyewitness testified'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/19.htm'
    quote: 'The writer speaks of himself in the third person (comp. Introduction, p. 375), laying stress upon the specially important fact that it was an eye-witness—“he that saw it”—who testified to the fact'
  - where: 'note 19:34 “Blood and water”'
    claim: 'Only John mentions the side wound; in Bountiful the Lord invited the people first to thrust their hands into His side, the sign of His sacrificial death'
    key: sc-knowhy-759
    url: 'https://scripturecentral.org/knowhy/how-did-the-nephites-recognize-jesus-christ-as-having-been-sacrificed-for-the-world'
    quote: 'The wound in Christ’s side would be a clear, universal indicator that Jesus was once dead but was now alive, enabling the Nephites to recognize Him as the “infinite and eternal sacrifice” spoken of by past prophets like Amulek.'
  - where: 'note 19:34 “Blood and water”'
    claim: 'Only John mentions the piercing of the side; the order of the invitation is reversed in the Book of Mormon'
    key: sc-knowhy-759
    url: 'https://scripturecentral.org/knowhy/how-did-the-nephites-recognize-jesus-christ-as-having-been-sacrificed-for-the-world'
    quote: 'Similarly, in John—which is the only Gospel to mention Jesus being pierced in the side—Jesus first invited the Apostles to touch the wounds in His hands and feet and only secondarily invited them to feel the wound in His side'
  - where: 'note 19:36 “A bone of him shall not be broken”'
    claim: 'The unbroken bones fulfilled Psalm 34 and the requirement of the Paschal Lamb (Ex. 12:46; Num. 9:12), as significant as being without blemish'
    key: huntsman-lamb-of-god
    url: 'https://rsc.byu.edu/behold-lamb-god/lamb-god-unique-aspects-passion-narrative-john'
    quote: 'While this was a fulfillment of the prophecy of Psalm 34:21, not breaking any bones was a particular requirement of the Paschal Lamb, one that was as significant as the prerequisite that the Paschal Lamb, like Jesus, be without blemish'
  - where: 'note 19:37 “They shall look on him whom they pierced”'
    claim: 'John’s “on him” follows a reading of Zechariah 12:10 found in many manuscripts, where the King James has “upon me”'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/19.htm'
    quote: 'The words, as they occur in the Authorised version, of the prophecy are, “They shall look upon Me whom they have pierced,” but the reading which St. John has followed is that of many MSS.'
  - where: 'note 19:37 “They shall look on him whom they pierced”'
    claim: 'The prophecy spoke of Jehovah pierced by His people; John sees it fulfilled in the Messiah'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/19.htm'
    quote: 'He thinks of the prophecy which spoke of Jehovah as pierced by His people, and sees it fulfilled in the Messiah pierced on the cross.'
  - where: 'note 19:37 “They shall look on him whom they pierced”'
    claim: 'D&C 45 draws on Zechariah 12:10; John 19:37 cites it of the wounds, which identify Jesus as the Messiah'
    key: sc-knowhy-790
    url: 'https://scripturecentral.org/knowhy/why-does-doctrine-and-covenants-45-quote-the-book-of-zechariah'
    quote: 'Moreover, this passage was cited in John 19:37 to specifically refer to the wounds Jesus received as He was crucified, and these wounds further identifying Jesus as the Messiah.'
  - where: 'note 19:39 “An hundred pound weight”'
    claim: 'Joseph was a respected, wealthy member of the Sanhedrin, a secret disciple for fear of his fellow leaders'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'a respected, wealthy member of the Sanhedrin named Joseph of Arimathea asked Pilate for permission to bury him. … though John says he kept his discipleship secret because of his fear of his fellow Jewish leaders'
  - where: 'note 19:39 “An hundred pound weight”'
    claim: 'The footnote to “fear” gives John 7:13 and 12:42–43'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/19?lang=eng'
    quote: '38b “fear”: Prov. 29:25; John 7:13; 12:42 (42–43).'
  - where: 'note 19:39 “An hundred pound weight”'
    claim: 'About seventy-five pounds in modern measure, a kingly amount'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'who brought a kingly amount of spices, about seventy-five pounds in modern measurements, to use in burying Jesus (John 19:39‒40).'
  - where: 'note 19:39 “An hundred pound weight”'
    claim: 'Nicodemus, having seen the Son of man lifted up, comes into the light to honor the man he now recognized as the Christ'
    key: huntsman-lamb-of-god
    url: 'https://rsc.byu.edu/behold-lamb-god/lamb-god-unique-aspects-passion-narrative-john'
    quote: 'Now, with the fulfillment on the cross of the prophecy that Jesus had made to Nicodemus that he would see the Son of Man lifted up (see John 3:14; 8:28), Nicodemus comes into the light as one who loved Jesus, eager to honor Him in death.'
  - where: 'note 19:39 “An hundred pound weight”'
    claim: 'More than could be placed in the linen; an offering of love; Asa’s burial among spices (2 Chr. 16:14)'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/19.htm'
    quote: 'The quantity is clearly much more than could have been placed in the linen which surrounded the body; but the offering was one of love, and part of it may have been placed in the sepulchre.'
  # ---- christ, explore
  - where: christ
    claim: 'Elder Hales: the Savior completed the work He had been sent to do'
    key: hales-gaining-testimony
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2008/04/gaining-a-testimony-of-god-the-father-his-son-jesus-christ-and-the-holy-ghost?lang=eng'
    quote: 'He completed the work He had been sent to do.'
  - where: christ
    claim: 'Because Jesus walked that path alone, we do not have to'
    key: holland-none-with-him
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2009/04/none-were-with-him?lang=eng'
    quote: 'because Jesus walked such a long, lonely path utterly alone, we do not have to do so.'
  - where: explore
    claim: 'Huntsman’s study of the unique aspects of John’s Passion narrative'
    key: huntsman-lamb-of-god
    url: 'https://rsc.byu.edu/behold-lamb-god/lamb-god-unique-aspects-passion-narrative-john'
    quote: 'Eric D. Huntsman, “The Lamb of God: Unique Aspects of the Passion Narrative in John,” in Behold the Lamb of God: An Easter Celebration'
  # ---- added after the draft
  - where: setting
    claim: 'In verse 35 the writer speaks of himself as the eyewitness'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/19.htm'
    quote: 'The writer speaks of himself in the third person (comp. Introduction, p. 375), laying stress upon the specially important fact that it was an eye-witness—“he that saw it”—who testified to the fact'
  - where: 'note 19:14 “The preparation of the passover, the sixth hour”'
    claim: 'In John the festival began at sunset after Jesus died; the Synoptics make the supper a Passover meal'
    key: huntsman-gospel-john
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/gospel-john'
    quote: 'Whereas the Synoptics portray the Last Supper as a Passover meal (Matthew 26:17–20; Mark 14:12–17; Luke 22:1, 7–14), in John the festival began at sunset after Jesus died on the cross'
  - where: 'note 19:17 “Bearing his cross”'
    claim: 'The footnote to “bearing” gives Genesis 22:6'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/19?lang=eng'
    quote: '17a “bearing”: Gen. 22:6.'
  - where: 'note 19:17 “Bearing his cross”'
    claim: 'Jacob calls the offering of Isaac a similitude of God and His Only Begotten Son, the key to the story'
    key: sc-knowhy-412
    url: 'https://scripturecentral.org/knowhy/how-abrahams-sacrifice-of-isaac-illuminates-the-atonement'
    quote: 'Jacob told his people that Abraham’s sacrifice of Isaac was “a similitude of God and his Only Begotten Son” (Jacob 4:5).'
  - where: 'note 19:31 “That their legs might be broken”'
    claim: 'The footnote to “broken” gives Deuteronomy 21:23'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/19?lang=eng'
    quote: '31e “broken”: Deut. 21:23 (22–23).'
  - where: 'note 19:31 “That their legs might be broken”'
    claim: 'The footnote to “high” reads the high day as the day before the weekly Sabbath, the day after the Passover meal'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/19?lang=eng'
    quote: 'The previous day was the weekly Sabbath. The day before the Sabbath, being also the day after the Passover meal, could be the “high” day.'
  - where: 'note 19:31 “That their legs might be broken”'
    claim: 'That the leg-breaking was to cause death is the impression derived from the context'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/19.htm'
    quote: 'It is not otherwise clear that its purpose was, or that its effect would be, to cause death, but this is the impression we derive from the present context (John 19:33).'
  - where: 'note 19:39 “An hundred pound weight”'
    claim: 'Nicodemus was a Pharisee and another member of the Sanhedrin'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'In John’s account, Joseph was joined by Nicodemus, a Pharisee and another member of the Sanhedrin, who brought a kingly amount of spices'
  - where: 'note 19:19 “The title on the cross”'
    claim: 'All four Gospels describe the notice; John gives the full form of the charge in three languages'
    key: huntsman-good-friday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/good-friday'
    quote: 'All four describe the official notice, or placard (Latin, titulus), that is attached to the cross, with John giving the full form of form of the charge written in three languages'
  - where: 'note 19:31 “That their legs might be broken”'
    claim: 'Breaking the legs was a Roman punishment that sometimes accompanied crucifixion'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/19.htm'
    quote: 'was a Roman punishment, known by the name of crurifragium, which sometimes accompanied crucifixion'
