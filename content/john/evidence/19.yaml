  - where: 'note 19:1 “Scourged and mocked”'
    claim: 'Elder Uchtdorf: Pilate had Jesus scourged in a last effort to satisfy the crowd'
    key: uchtdorf-behold-the-man
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2018/04/behold-the-man?lang=eng'
    quote: 'In one final effort to satisfy the mob, Pilate ordered his men to scourge Jesus. This they did, leaving Him bloodied and bruised.'
  - where: 'note 19:1 “Scourged and mocked”'
    claim: 'By Roman times torture, most often scourging, usually preceded crucifixion'
    key: strathearn-crucifixion
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/crucifixion'
    quote: 'By Roman times, some form of torture usually preceded crucifixion. These tortures most frequently included scourging'
  - where: 'note 19:1 “Scourged and mocked”'
    claim: 'The scourging and mocking fulfilled Book of Mormon prophecies (1 Ne. 19:9; 2 Ne. 6:9; Mosiah 3:9)'
    key: strathearn-crucifixion
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/crucifixion'
    quote: 'During his arraignment before Pilate, Jesus was scourged and mocked (Mark 15:15–17, Matthew 27:26–31; John 19:2; see also the Book of Mormon prophecies: 1 Nephi 19:9; 2 Nephi 6:9; Mosiah 3:9).'
  - where: 'note 19:1 “Scourged and mocked”'
    claim: 'Nephi: they scourge him, and he suffereth it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/19?lang=eng'
    quote: 'wherefore they scourge him, and he suffereth it; and they smite him, and he suffereth it.'
  - where: 'note 19:1 “Scourged and mocked”'
    claim: 'Luke: Pilate offers to chastise Him and release Him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/23?lang=eng'
    quote: 'I will therefore chastise him, and release him.'
  - where: 'note 19:5 “Behold the man!”'
    claim: 'Elder Uchtdorf: Pilate may have hoped the sight would satisfy the crowd or move them to pity'
    key: uchtdorf-behold-the-man
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2018/04/behold-the-man?lang=eng'
    quote: 'Perhaps Pilate thought this would satisfy the mob’s lust for blood. Perhaps they would take pity on the man.'
  - where: 'note 19:5 “Behold the man!”'
    claim: 'They saw Jesus but did not behold Him'
    key: uchtdorf-behold-the-man
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2018/04/behold-the-man?lang=eng'
    quote: 'They could see Jesus, but they did not truly behold Him.'
  - where: 'note 19:5 “Behold the man!”'
    claim: 'We too are invited to behold the man'
    key: uchtdorf-behold-the-man
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2018/04/behold-the-man?lang=eng'
    quote: 'In a figurative sense, we too are invited to “behold the man.”'
  - where: 'note 19:7 “Because he made himself the Son of God”'
    claim: 'The footnote to “law” gives Leviticus 24:16'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/19?lang=eng'
    quote: '7a “law”: Lev. 24:16.'
  - where: 'note 19:7 “Because he made himself the Son of God”'
    claim: 'Pilate had told them to judge Him by their law; they said they could not put a man to death'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/18?lang=eng'
    quote: 'Then said Pilate unto them, Take ye him, and judge him according to your law. The Jews therefore said unto him, It is not lawful for us to put any man to death:'
  - where: 'note 19:7 “Because he made himself the Son of God”'
    claim: 'In John “the Jews” often means the Jewish leadership or a group of opponents'
    key: matson-fourth-gospel
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/fourth-gospel-expectations-jewish-messiah'
    quote: 'The expression “the Jews” (Greek hoi Ioudaioi) occurs frequently in John, often negatively. In these instances, it appears to refer to either the Jewish leadership or a specific group of opponents to Jesus.'
  - where: 'note 19:9 “Whence art thou?”'
    claim: 'Pilate reacted with fear on hearing “Son of God”; John’s words are strong'
    key: welch-factor-fear
    url: 'https://rsc.byu.edu/jesus-christ-son-god-savior/factor-fear-trial-jesus'
    quote: 'When Pilate heard the words “he has made himself the son of God,” Pilate’s reaction was fear (John 19:7). In fact, John states that Pilate “was really afraid” (mallon ephobethe).'
  - where: 'note 19:9 “Whence art thou?”'
    claim: 'The chief priests feared Jesus'
    key: welch-factor-fear
    url: 'https://rsc.byu.edu/jesus-christ-son-god-savior/factor-fear-trial-jesus'
    quote: 'But the chief priests were also deeply afraid, particularly of Jesus.'
  - where: 'note 19:9 “Whence art thou?”'
    claim: 'Fear of the supernatural, of the miracles, underlay the trial'
    key: welch-factor-fear
    url: 'https://rsc.byu.edu/jesus-christ-son-god-savior/factor-fear-trial-jesus'
    quote: 'While they surely feared several things, strong evidence indicates that they were deeply afraid of the supernatural.'
  - where: 'note 19:11 “Given thee from above”'
    claim: 'Exousia in John 19:10–11: the power of judicial decision'
    key: thayer
    url: 'https://biblehub.com/greek/1849.htm'
    quote: 'of the power of judicial decision; ἐξουσίαν ἔχειν with an infinitive of the thing decided: σταυρῶσαι and ἀπολῦσαι τινα, John 19:10; followed by κατά τίνος, the power of deciding against one, John 19:11'
  - where: 'note 19:11 “Given thee from above”'
    claim: 'The footnote to “power” gives Romans 13:1 and D&C 134:1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/19?lang=eng'
    quote: '11a “power”: Rom. 13:1; D&C 134:1.'
  - where: 'note 19:11 “Given thee from above”'
    claim: 'D&C 134:1: governments were instituted of God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/134?lang=eng'
    quote: 'We believe that governments were instituted of God for the benefit of man'
  - where: 'note 19:11 “Given thee from above”'
    claim: 'Anōthen is the word used of Jesus as “from above” in 3:31 and 19:11'
    key: strathearn-johannine-dialogues
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/johannine-christology-through-lens-three-its-dialogues'
    quote: 'The Greek word translated as “again” is anōthen. While it can refer to a repeated action, it is the same word used later in chapter 3 to describe Jesus as being “from above” (3:31; 19:11), as we have noted.'
  - where: 'note 19:11 “Given thee from above”'
    claim: 'In John Jesus’s powers came from above; His death was in God’s plan; He was not a victim'
    key: welch-factor-fear
    url: 'https://rsc.byu.edu/jesus-christ-son-god-savior/factor-fear-trial-jesus'
    quote: 'His powers came “from above” (John 3:31). There may have been miscarriages of earthly justice, but John does not want us to think of the death of Jesus that way. Jesus was not a victim.'
  - where: 'note 19:11 “Given thee from above”'
    claim: 'Caiaphas counseled that one man should die for the people'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/18?lang=eng'
    quote: 'Now Caiaphas was he, which gave counsel to the Jews, that it was expedient that one man should die for the people.'
  - where: 'note 19:13 “The Pavement, Gabbatha”'
    claim: 'Bēma: a raised place mounted by steps, the official seat of a judge'
    key: thayer
    url: 'https://biblehub.com/greek/968.htm'
    quote: 'a raised place mounted by steps; a platform, tribune: used of the official seat of a judge, Matthew 27:19; John 19:13'
  - where: 'note 19:13 “The Pavement, Gabbatha”'
    claim: 'Lithostrōton: spread with stones; a mosaic or tessellated pavement near the praetorium'
    key: thayer
    url: 'https://biblehub.com/greek/3038.htm'
    quote: 'spread (paved) with stones … τό λιθόστρωτον, substantively, a mosaic or tessellated pavement: so of a place near the praetorium or palace at Jerusalem, John 19:13'
  - where: 'note 19:13 “The Pavement, Gabbatha”'
    claim: 'Gabbatha: a raised place; John adds Greek only to names of fixed localities; named from its shape and its pavement'
    key: thayer
    url: 'https://biblehub.com/greek/1042.htm'
    quote: 'hence, a raised place, an elevation'
  - where: 'note 19:13 “The Pavement, Gabbatha”'
    claim: 'John adds a Greek interpretation only to names of fixed localities (5:2; 9:7; 19:17)'
    key: thayer
    url: 'https://biblehub.com/greek/1042.htm'
    quote: 'John is not accustomed to add a Greek interpretation except to the Hebrew names of fixed Jewish localities, cf. John 5:2; John 9:7; John 19:17'
  - where: 'note 19:13 “The Pavement, Gabbatha”'
    claim: 'The Aramaic name from the spot’s shape, the Greek from its pavement'
    key: thayer
    url: 'https://biblehub.com/greek/1042.htm'
    quote: 'Doubtless the Chaldaic name was given to the spot from its shape, the Greek name from the nature of its pavement.'
  - where: 'note 19:13 “The Pavement, Gabbatha”'
    claim: 'The praetorium at Jerusalem was Herod’s palace, used by the procurators; Romans took over kings’ palaces'
    key: thayer
    url: 'https://biblehub.com/greek/4232.htm'
    quote: 'the palace in which the governor or procurator of a province resided, to which use the Romans were accustomed to appropriate the palaces already existing, and formerly dwelt in by the kings or princes'
  - where: 'note 19:13 “The Pavement, Gabbatha”'
    claim: 'At Jerusalem the praetorium was the palace Herod the Great built'
    key: thayer
    url: 'https://biblehub.com/greek/4232.htm'
    quote: 'at Jerusalem it was that magnificent palace which Herod the Great had built for himself, and which the Roman procurators seem to have occupied whenever they came from Caesarea to Jerusalem'
  - where: 'note 19:19 “The title on the cross”'
    claim: 'Titlos: an inscription giving the accusation for which a criminal suffered'
    key: thayer
    url: 'https://biblehub.com/greek/5102.htm'
    quote: 'an inscription, giving the accusation or crime for which a criminal suffered: John 19:19, 20'
  - where: 'note 19:19 “The title on the cross”'
    claim: '“King of the Jews” was Herod the Great’s official title from Augustus; usurping it a possible cause; the legal issue left vague'
    key: welch-factor-fear
    url: 'https://rsc.byu.edu/jesus-christ-son-god-savior/factor-fear-trial-jesus'
    quote: 'Pilate eventually wrote on the sign placed above the cross another possible cause of action, namely usurping the title “THE KING OF THE JEWS” … which was the official title carried several years earlier by Herod the Great as a privilege personally conferred on him by Augustus Caesar.'
  - where: 'note 19:19 “The title on the cross”'
    claim: 'The Gospels leave the legal issue vague'
    key: welch-factor-fear
    url: 'https://rsc.byu.edu/jesus-christ-son-god-savior/factor-fear-trial-jesus'
    quote: 'Which of these many causes provides the reason why Jesus was crucified? It is impossible to tell.'
  - where: 'note 19:19 “The title on the cross”'
    claim: 'The footnote to “King of the Jews” gives D&C 45:53'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/19?lang=eng'
    quote: '3a “King of the Jews”: D&C 45:53.'
  - where: 'note 19:19 “The title on the cross”'
    claim: 'D&C 45:53: they shall lament because they persecuted their king'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/45?lang=eng'
    quote: 'then shall they lament because they persecuted their king.'
  - where: 'note 19:23 “The coat without seam”'
    claim: 'The soldiers divided the outer garments in four and cast lots for the inner tunic, fulfilling Psalm 22:18; only John notes the seamless coat; it may represent the priestly garment'
    key: huntsman-lamb-of-god
    url: 'https://rsc.byu.edu/behold-lamb-god/lamb-god-unique-aspects-passion-narrative-john'
    quote: 'the soldiers who were crucifying Him divided His outer garments (ta himatia) into four parts and distributed them among themselves but that they cast dice for His inner tunic (ton chitōna, King James Version “coat”), thus fulfilling the prophecy of Psalm 22:18'
  - where: 'note 19:23 “The coat without seam”'
    claim: 'The seamless coat may represent the priestly garment: Jesus as Paschal Lamb and high priest'
    key: huntsman-lamb-of-god
    url: 'https://rsc.byu.edu/behold-lamb-god/lamb-god-unique-aspects-passion-narrative-john'
    quote: 'Commentators have observed that this may suggest that it may have represented the priestly garment, reinforcing the image of Jesus not only as the Paschal Lamb being offered but as the high priest who made sacrifice for His people.'
  - where: 'note 19:23 “The coat without seam”'
    claim: 'A tunic was usually two pieces joined at the shoulder; Jesus’s was one piece, which seems to have been the rule for priestly tunics'
    key: ellicott-john
    url: 'https://biblehub.com/commentaries/ellicott/john/19.htm'
    quote: 'Ordinarily the tunic consisted of two pieces connected at the shoulder by clasps; but that worn by Jesus was made in one piece. This seems to have been the rule with the priestly tunics.'
  - where: 'note 19:26 “Woman, behold thy son!”'
    claim: 'The footnote to “disciple” gives D&C 7:1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/19?lang=eng'
    quote: '26a “disciple”: John 20:2 (2–9); D&C 7:1.'
  - where: 'note 19:26 “Woman, behold thy son!”'
    claim: 'His brethren did not believe in Him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/7?lang=eng'
    quote: 'For neither did his brethren believe in him.'
  - where: 'note 19:26 “Woman, behold thy son!”'
    claim: 'The entrusting is usually seen as care for her well-being; the disciple’s anonymity makes him a type of all followers'
    key: huntsman-family-john
    url: 'https://rsc.byu.edu/household-god/family-god-gospel-john'
    quote: 'This disciple’s anonymity allows him to serve as a type for all followers of Jesus, which allows for some significant symbolism in the scene.'
  - where: 'note 19:26 “Woman, behold thy son!”'
    claim: 'Usually seen as His concern for her care and well-being'
    key: huntsman-family-john
    url: 'https://rsc.byu.edu/household-god/family-god-gospel-john'
    quote: 'Jesus’s entrusting of his mother to his friend is usually seen as a sign of his concern for her care and well-being'
  - where: 'note 19:26 “Woman, behold thy son!”'
    claim: 'The disciple, and every believer, brought into a deeper relationship, part of His family; a brother by choice where Mary’s other sons did not believe'
    key: huntsman-family-john
    url: 'https://rsc.byu.edu/household-god/family-god-gospel-john'
    quote: 'Now in the position of a son to the mother of Jesus, the disciple has become part of his family.[57] While the other sons of Mary were earlier portrayed as not believing in Jesus, this brother by choice assumes the sibling relationship'
