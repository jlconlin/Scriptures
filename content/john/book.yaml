# Sources for the intro: Bible Dictionary, “John” (one of the Twelve, son of Zebedee, a fisherman; calls
# himself “the disciple whom Jesus loved,” John 13:23; 19:26; 20:2; 21:7, 20; did not die but remains as a
# ministering servant, 3 Ne. 28:6; D&C 7) and “Gospels” (writing to members who already had basic information;
# to emphasize the divine nature of Jesus; about 92 percent exclusive); JST title, “The Testimony of St. John”
# (the footnote to the book's title); D&C 7 (the beloved disciple tarries); John 20:30–31 (the stated purpose).
# The structure (prologue, signs and feasts, the hour and the Passion, epilogue) is BRIEF.md, “Divisions.”
# The last paragraph must point to a New Testament volume guide once one exists (DEVELOPMENT.md, step 2); none is
# written yet (content/volumes/new-testament/GUIDES.md), so the pointer is left out of this draft.
intro: |
  John was one of the Twelve, a son of Zebedee and a fisherman, one of the three who were with the Lord at the raising of Jairus’s daughter, on the mount of Transfiguration and in Gethsemane. In his Gospel he never gives his own name; he is “the disciple whom Jesus loved” ([[John 13:23]]; [[John 21:20]]), and the Lord’s revelation to Joseph Smith calls him “John, my beloved” and promises that he will “tarry until I come in my glory” ([[D&C 7:1–3]]). The Joseph Smith Translation names the book “The Testimony of St. John.” The Bible Dictionary judges that he wrote for members of the Church who already knew the basic story, and that his first purpose was to show the divine nature of Jesus as the Only Begotten Son.

  John’s Gospel is unlike the other three. It begins before the creation, with the Word who “was with God, and … was God” ([[John 1:1]]); nearly all of it is told in no other Gospel: the water made wine, Nicodemus, the woman at the well, the man born blind, the raising of Lazarus, the washing of feet, the long talk in the upper room and the prayer that ends it. Its miracles are “signs,” its Jesus goes up to Jerusalem at the feasts, and its story turns on His “hour.” John says why he wrote: “that ye might believe that Jesus is the Christ, the Son of God; and that believing ye might have life through his name” ([[John 20:31]]). This companion goes through all twenty-one chapters and tries to anticipate the questions a careful reader asks: *Who were “the Jews” Jesus argued with? What did Joseph Smith change, and why? What does “I am” mean? Who is the other Comforter? Is John still on the earth?*

# John's own shape (BRIEF.md, “Divisions”): the prologue, the signs from Cana to Cana, the feasts, Lazarus and
# the hour, the upper room, the Passion, the resurrection, the epilogue. Keys must not repeat another book’s
# (the colors are global variables).
divisions:
  - key: johnword
    range: [1, 1]
    name: The Word Was Made Flesh
    blurb: The Word who was in the beginning with God becomes flesh, John the Baptist bears record of the Lamb of God, and the first disciples come and see.
    color: '#a0682e'
    darkColor: '#dfa56b'
  - key: johncana
    range: [2, 4]
    name: From Cana to Cana
    blurb: Water becomes wine at a wedding, Jesus cleanses the temple, teaches Nicodemus to be born again and a Samaritan woman of living water, and heals a nobleman’s son with a word.
    color: '#3f7f5f'
    darkColor: '#82c7a2'
  - key: johnfeasts
    range: [5, 10]
    name: At the Feasts of the Jews
    blurb: At a Sabbath, a Passover, the Feast of Tabernacles and the Feast of Dedication, Jesus heals, feeds five thousand, and declares Himself the bread of life, the light of the world, the great I Am and the good shepherd.
    color: '#3a6a9a'
    darkColor: '#88b3e0'
  - key: johnhour
    range: [11, 12]
    name: The Resurrection and the Life
    blurb: Jesus raises Lazarus, the council resolves on His death, Mary anoints Him at Bethany, He enters Jerusalem, and when Greeks ask to see Him He says, “The hour is come.”
    color: '#7a5296'
    darkColor: '#bf9adc'
  - key: johnupper
    range: [13, 17]
    name: In the Upper Room
    blurb: Jesus washes His disciples’ feet, gives a new commandment, promises the Comforter and a place in His Father’s house, calls Himself the true vine, and prays for His disciples and for all who believe through them.
    color: '#8a7a2e'
    darkColor: '#d4c47a'
  - key: johncross
    range: [18, 19]
    name: The Lamb of God Lifted Up
    blurb: Jesus is arrested in a garden, questioned by Annas and Caiaphas, tried before Pilate, crucified as the King of the Jews, and says, “It is finished.”
    color: '#9a4a4a'
    darkColor: '#e09a9a'
  - key: johnrisen
    range: [20, 20]
    name: That Ye Might Believe
    blurb: Mary Magdalene finds the tomb empty and meets the risen Lord in the garden, He breathes on the disciples, and Thomas, who would not believe without seeing, says, “My Lord and my God.”
    color: '#5a6478'
    darkColor: '#a9b4c9'
  - key: johnsea
    range: [21, 21]
    name: Feed My Sheep
    blurb: By the sea of Tiberias the risen Lord fills the net, asks Peter three times whether he loves Him, and speaks of the beloved disciple who would tarry.
    color: '#3f6f8f'
    darkColor: '#8fc0e0'

