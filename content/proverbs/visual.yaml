summary: >-
  Proverbs sets two ways before the reader, and Wisdom's house stands at the end of the
  righteous path: “Wisdom hath builded her house, she hath hewn out her seven pillars” (9:1), with
  her table laid for whoever will come. The image is that choice: a bright path climbing to
  her house, and a road turning away into shadow.
motifs:
  - "Most important: Wisdom's house (Proverbs 9:1–2), the one building in the picture, on a rise in the upper right at the end of the bright path: a stately building of Solomon's Israel, of pale dressed limestone banded with cedar beams, with a flat roof and an open porch whose seven plain square pillars have no capitals and support the beams. The doorway is open and dark; on the porch a table is laid with loaves and a pitcher, and nobody is at it."
  - "Supporting: the two ways (Proverbs 4:18–19). A pale stone path climbs from the lower left foreground to the porch in full gold light; near the foreground a dark dirt road turns off to the lower right and goes down into shadow."
  - "Supporting: one old olive tree at the left edge, its crown framing the top left (Proverbs 3:18)."
composition: >-
  A wide hillside landscape in low gold light from the upper right, behind and to the right
  of the house. The house's front and the climbing path are lit; the road that turns away
  falls into the hill's shadow. Few, large shapes: bare grassy slopes, a few large rocks along
  the path, distant soft hills. No people, animals, statues, text, lamps or smoke.
key:
  - '**The building with seven pillars** at the top of the hill is Wisdom''s house: “Wisdom hath builded her house, she hath hewn out her seven pillars” ([[Prov. 9:1]]). It is drawn as a building of Solomon''s day, of dressed stone banded with cedar.'
  - '**The table on the porch**, laid with bread and a pitcher, is her feast, set out for anyone who will come in: “she hath mingled her wine; she hath also furnished her table,” and she calls, “Come, eat of my bread, and drink of the wine which I have mingled” ([[Prov. 9:2]]; [[Prov. 9:5]]).'
  - '**The bright path** climbing to the house is the way of the righteous: “the path of the just is as the shining light, that shineth more and more unto the perfect day” ([[Prov. 4:18]]).'
  - '**The dark road** that turns off and goes down into shadow is the other way: “The way of the wicked is as darkness: they know not at what they stumble” ([[Prov. 4:19]]).'
  - '**The old tree** at the left stands for what Wisdom gives: “She is a tree of life to them that lay hold upon her” ([[Prov. 3:18]]).'
