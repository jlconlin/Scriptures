chapter: 10
title: A Well of Life
tagline: The proverbs of Solomon begin, two-line sayings that set the righteous against the wicked again and again and keep returning to three things, wealth and how it is gained, what comes out of the mouth, and the righteous who cannot be moved.
when: 'The proverbs of Solomon'

setting: |
  Chapter 10 opens the second division of Proverbs under a heading of its own, “The proverbs of Solomon” (on Solomon's name over the book, see [[Prov. 1:1]]). After nine chapters of a father's lectures and Wisdom's speeches, the book turns to separate sayings, and they run on to [[Prov. 22:16]]. On one Latter-day Saint reading, which follows an earlier commentary, that section has 375 lines in Hebrew, and the letters of Solomon's name in Hebrew add up to 375, “good evidence that this section was deliberately crafted.”

  The sayings are two lines each, “for the most part antithetical”: the two lines set up “an opposition or contrast of thoughts” (the volume guide [Hebrew Poetry](/old-testament/guides/hebrew-poetry/#parallelism) explains the form, and [[Ps. 1:1]]). So each saying is read as one thought in two halves, as in “The memory of the just is blessed: but the name of the wicked shall rot” (verse 7).

  The book “is built on the assumption that proper action will lead to proper outcomes,” and this chapter says so often: the righteous are fed, made rich, given long life and never moved. The book that follows Proverbs “seems to say, ‘It’s not that simple,’” and how far such promises reach is taken up at [[Prov. 22:6]].

thread: |
  Chapter 10 is a string of separate sayings, not an argument. They fall into small groups, set side by side “according to certain common characteristics,” though in one older reading the order as a whole “follows no systematic scheme.” Each saying is whole by itself.

  What recurs is a pair: the righteous and the wicked, named in line after line, with the wise and the fool beside them. Three subjects return. Wealth and work come first (verses 2–5, then 15–16 and 22), set beside the contrast of righteousness and wickedness: treasure gained by wickedness profits nothing, and it is “The blessing of the LORD” that makes rich. Speech fills the middle, in a run of sayings on “sins of the mouth and their contrary” that begins at verse 8, and it returns at the close (verses 31–32). And from verse 25 comes a run on the righteous who cannot be moved, “broken by only one dissimilar proverb” (the sluggard of verse 26). The path of chapters 1–9 is still here: the upright man “walketh surely” (verse 9), whoever keeps instruction “is in the way of life” (verse 17), and “The way of the LORD is strength to the upright” (verse 29).

sections:
  - range: 1-5
    heading: The wise son, wealth and work
    plain: |
      The proverbs of Solomon. A wise son makes his father glad; a foolish son is his mother's grief. Treasure gained by wickedness does no good, but righteousness saves from death. The LORD does not let the righteous go hungry, but he pushes back what the wicked crave. A slack hand makes a man poor, but a diligent hand makes him rich. A son who gathers the crop in summer is wise; a son who sleeps through the harvest brings shame.
  - range: 6-14
    heading: The mouth of the righteous and of the wicked
    plain: |
      Blessings rest on the head of the just, but violence covers the mouth of the wicked (the line can be read two ways: see the note). The just are remembered with blessing; the name of the wicked rots. The wise in heart accept commandments, but a babbling fool comes to ruin. Whoever walks with integrity walks safely, but whoever twists his ways will be found out. Whoever winks his eye causes trouble, and the babbling fool comes to ruin. The mouth of the righteous is a spring of life, but the mouth of the wicked hides violence. Hatred stirs up quarrels, but love covers every sin. Wisdom is on the lips of a man of understanding, but the rod is for the back of one who lacks it (the rod is discussed at [[Prov. 13:24]]). The wise store up knowledge, but a fool's mouth brings ruin near.
  - range: 15-17
    heading: Wealth and wages
    plain: |
      The rich man's wealth is his fortified city; poverty is what ruins the poor. The work of the righteous leads to life; what the wicked earn leads to sin. Whoever keeps instruction is on the road to life, but whoever refuses correction goes astray.
  - range: 18-21
    heading: Lips and tongue
    plain: |
      Whoever hides hatred behind lying lips, and whoever spreads slander, is a fool. Where words are many, sin is not lacking, but whoever holds his lips in check is wise. The tongue of the just is fine silver; the heart of the wicked is worth little. The lips of the righteous feed many, but fools die for lack of sense.
  - range: 22-24
    heading: What comes from the LORD
    plain: |
      The LORD's blessing is what makes rich, and no sorrow comes with it (or, toil adds nothing to it: see the note). Doing wrong is a game to a fool, but a man of understanding has wisdom. What the wicked dread will come on them, but what the righteous desire will be given.
  - range: 25-32
    heading: The righteous stand
    plain: |
      When the storm passes, the wicked are gone, but the righteous are a foundation that lasts forever. Like vinegar on the teeth and smoke in the eyes, so is a sluggard to those who send him on an errand (the sluggard is at [[Prov. 6:6]]). The fear of the LORD lengthens life ([[Prov. 1:7]]), but the years of the wicked are cut short. The hope of the righteous ends in gladness, but what the wicked expect comes to nothing. The LORD's way is a stronghold for the upright, but ruin for those who do evil. The righteous will never be moved, and the wicked will not remain on the earth (as at [[Prov. 2:21]]). The mouth of the just brings forth wisdom, but the perverse tongue will be cut out. The lips of the righteous know what is pleasing, but the mouth of the wicked speaks what is perverse.

notes:
  - ref: 2
    phrase: righteousness delivereth from death
    kind: scripture
    title: Delivered from death
    body: |
      Wealth gained by wickedness cannot save its owner; righteousness can, even from death. “Treasures of wickedness” are, as a modern translation has it, “Treasures gained by wickedness.”

      The second line returns word for word at the close of another saying, which names the occasion it has in view: “Riches profit not in the day of wrath: but righteousness delivereth from death” ([[Prov. 11:4]]).
    sources: [nrsvue]
  - ref: 6
    phrase: violence covereth the mouth of the wicked
    kind: structure
    title: The same line twice
    body: |
      The second line of verse 6 returns word for word in verse 11, and the Hebrew can be read two ways. Either the mouth of the wicked “covers (hides under a mask) violence,” or the violence “that has gone out from it covereth the mouth of the wicked, i.e., it falls back upon his foul mouth.” A modern translation takes the first sense in both verses: “the mouth of the wicked conceals violence.”

      One older reading takes the second sense here because of the line it answers: blessings come down on the head of the just, and the wicked man's own violence comes back on his mouth. In verse 11, beside “a well of life,” it takes the first: the wicked man's mouth “conceals with deceitful words the intention, directed not to that which is best, but to the disadvantage and ruin of his neighbours.” Lines repeated in Proverbs, on that reading, “often show a change of the meaning” in their new place.
    sources: [delitzsch-proverbs, nrsvue]

  - ref: 8
    phrase: a prating fool shall fall
    kind: words
    title: A prating fool
    body: |
      “Prating” is an older English word for empty talk: to prate is “To talk much and without weight, or to little purpose.” A modern translation gives the line as “one with foolish lips will come to ruin,” and the verb behind “shall fall” means to “be thrust down, away, i.e. ruined.” The first line gives the contrast: the wise in heart receive commandments, and the fool of many words comes to ruin.

      The same line closes verse 10, after the man who winks with his eye (the gesture is explained at [[Prov. 6:13]]). There the Septuagint, the ancient Greek translation, has a different second line: “he that reproves boldly is a peacemaker.” A modern translation follows the Greek at verse 10, “one who rebukes boldly makes peace”; the King James keeps the Hebrew, which repeats the line of verse 8.
    sources: [webster-1828, bdb, nrsvue, lxx-rahlfs]
  - ref: 12
    phrase: love covereth all sins
    kind: scripture
    title: Love covereth all sins
    body: |
      Hatred stirs wrongs up into quarrels; love covers them, in one older reading “by pardoning them, concealing them, excusing them, if possible, with mitigating circumstances, or restraining them before they are executed.” The sins covered, in that reading, are “the sins of the neighbour,” not the sins of the one who loves.

      In the same reading, Peter's “charity shall cover the multitude of sins” ([[1 Pet. 4:8]]) and James's “shall hide a multitude of sins” both render the proverb, following the Hebrew, which the Septuagint translates “improperly.” James gives the line “another rendering”: whoever turns a sinner “from the error of his way shall save a soul from death” ([[James 5:20]]), and the sins are covered “from the eyes of a holy God.” The Joseph Smith Translation of Peter's verse, in the Church's footnote there, reads “charity preventeth a multitude of sins,” and the footnote at “hide” in James points to it.
    sources: [delitzsch-proverbs, lds-scriptures]
  - ref: 22
    phrase: he addeth no sorrow with it
    kind: words
    title: No sorrow, or no toil
    body: |
      The second line can mean that the LORD's blessing brings no sorrow or that toil adds nothing to it. The Hebrew word the King James renders “sorrow” means “pain, hurt, toil,” and the lexicon places this verse under “pain,” with the pain of childbirth in [[Gen. 3:16]]: on that reading, the LORD's blessing brings no grief with it. A modern translation takes the other sense of the word: “The blessing of the Lord makes rich, and toil adds nothing to it.”

      On either reading the first line stands, and it puts the source of the riches in “The blessing of the LORD.”
    sources: [bdb, nrsvue]

christ: |
  Verse 25 sets the wicked, gone when the storm passes, beside the righteous, “an everlasting foundation.” In one older reading the proverb recalls “the close of the Sermon on the Mount.” There Jesus Christ likens the one who stands to a builder: “whoso heareth these sayings of mine and doeth them, I will liken him unto a wise man, who built his house upon a rock” ([[3 Ne. 14:24]]; [[Matt. 7:24–27]]). The rain, the floods and the winds still beat on that house, “and it fell not, for it was founded upon a rock” ([[3 Ne. 14:25]]).

  The storms of a disciple's life are not prevented by righteousness, as they were not for the wise man's house. What stands through them is a life built on hearing the words of Jesus Christ and doing them.

explore: |
  - **Sayings that return.** The first line of verse 1 returns at [[Prov. 15:20]], with a different second line; the first line of verse 15 returns at [[Prov. 18:11]], where the rich man's wall stands “in his own conceit.”

