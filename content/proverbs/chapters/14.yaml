chapter: 14
title: A Way That Seemeth Right
tagline: Separate sayings on the wise and the fool, the house that stands and the house that falls, the way that only seems right, the poor man whose Maker takes his part, and the righteousness that lifts a nation.
when: 'The proverbs of Solomon'

setting: |
  Chapter 14 stands in the first collection of Solomon's proverbs, which opens with its own heading at [[Prov. 10:1]] and runs to [[Prov. 22:16]]; the setting of chapter 10 says what kind of sayings these are and how to read them. Like the chapters around it, this one is a string of two-line sayings, most of them setting one line against the other: the wise and the fool, the upright and the wicked, the poor and the rich. One older reading finds the proverbs of this collection grouped “without any comprehensive plan, but only according to their more or fewer conspicuous common characteristics,” each of them “a small perfected and finished whole.”

  Some of the sayings appear again in the book: verse 12 returns at [[Prov. 16:25]], and the first line of verse 31, a little changed, at [[Prov. 17:5]]; verse 27 shares a line with [[Prov. 13:14]] (see the notes at verses 12, 27 and 31). Verse 34 is quoted in Latter-day Saint studies of the Book of Mormon's promise that a righteous people will prosper in the land (see the note at verse 34).

thread: |
  This is a collection, not an argument: thirty-five sayings, each complete in itself, loosely grouped by what they share (see the setting). What returns in it is the book's old contrast, given one line at a time: the wise and the fool (verses 1, 3, 7–9, 15–18, 24, 29, 33), the upright and the wicked (verses 2, 11, 19, 32). Two early sayings are about houses. The wise woman builds hers and the foolish one tears hers down with her own hands (verse 1); the house of the wicked falls and the tent of the upright flourishes (verse 11). In one older reading the second saying turns expectation over: “the apparently firmly-founded house is assigned to the godless,” and the tent, “easily destroyed,” to the righteous.

  Three subjects come back more than once. The witness: the faithful one will not lie, and the true one “delivereth souls” (verses 5, 25). The poor: disliked by his own neighbor (verse 20), defended in the next breath (verse 21), and at last tied to “his Maker,” whom the oppressor of the poor reproaches (verse 31). And the fear of the LORD, which marks the upright man's walk (verse 2), gives his children a refuge (verse 26), and is “a fountain of life” (verse 27). Set together, the sayings fill in the two ways of chapters 1–9 (see [[Prov. 4:18]]): the way that “seemeth right unto a man” but ends in death (verse 12), and the way of the wise man who “feareth, and departeth from evil” (verse 16).

sections:
  - range: 1-9
    heading: The wise and the fool
    plain: |
      A wise woman builds up her household; a foolish one pulls it down with her own hands. The man who walks uprightly reveres the LORD; the one whose ways are crooked despises Him. In a fool's mouth is a rod of pride, but the words of the wise keep them safe. Where there are no oxen the manger stays empty, but a large harvest comes by the strength of the ox. A faithful witness will not lie; a false witness pours out lies. The scorner looks for wisdom and doesn't find it, but knowledge comes easily to one who understands. Leave a fool's company when you find no knowledge in what he says. The wisdom of the prudent is to understand where he is going; the folly of fools is deceit. Fools mock at guilt, but among the upright there is goodwill.
  - range: 10-13
    heading: Joy and sorrow
    plain: |
      Only the heart knows its own bitterness, and no outsider can share its joy. The house of the wicked will be overthrown, but the tent of the upright will flourish. There is a way that seems right to a man, but it ends in the ways of death. Even in laughter the heart can ache, and mirth can end in grief.
  - range: 14-19
    heading: The good and the wicked, the prudent and the simple
    plain: |
      The one whose heart has turned away will get his fill of his own ways, and a good man will be satisfied from what is his own. The simple believe whatever they are told, but the prudent watch their steps. A wise man is cautious and turns from evil, but the fool is hot-headed and sure of himself. A quick-tempered man acts foolishly, and a schemer is hated. The simple inherit folly, and the prudent are crowned with knowledge. The evil bow before the good, and the wicked at the gates of the righteous.
  - range: 20-24
    heading: The poor and the rich
    plain: |
      The poor man is disliked even by his neighbor, while the rich man has many friends. Whoever looks down on his neighbor sins, but happy is the one who is kind to the poor. Those who plan evil go astray; those who plan good will meet mercy and truth. All hard work brings some gain, but mere talk leads only to want. Riches are the crown of the wise, but the folly of fools is only folly.
  - range: 25-33
    heading: Sayings on several subjects
    plain: |
      A true witness saves lives; a deceitful one speaks lies. In reverence for the LORD there is strong confidence, and the children of one who fears Him will have a refuge. The fear of the LORD is a spring of life that lets a man escape the snares of death. A king's glory is a large people; without people a prince is ruined. Whoever is slow to anger has great understanding, but the quick-tempered make a show of folly. A sound heart gives life to the body, but envy rots the bones. Whoever oppresses the poor insults the One who made him, and the one who honors Him is kind to the poor. The wicked man is thrown down in his own wickedness, but the righteous has a refuge even in his death. Wisdom rests in the heart of one who understands, but what is inside fools is made known.
  - range: 34-35
    heading: The nation and its king
    plain: |
      Righteousness lifts up a nation, but sin is a disgrace to any people. The king favors a servant who acts wisely, but his anger falls on the one who brings shame.

notes:
  - ref: 1
    phrase: Every wise woman buildeth her house
    kind: symbol
    title: Wisdom builds the house
    body: |
      The verse puts the household in the hands of the woman who keeps it: her wisdom builds it up, and folly pulls it down. The Hebrew reads literally “wisdom of women” (*chokmot nashim*); one older reading points the word as at [[Prov. 9:1]], where Wisdom builds her own house, and renders the line “The wisdom of the woman buildeth her house.” In that reading, to build a house is “to regulate well the affairs of a house, and to keep them in a good condition,” and it adds: “the oneness of the house is more dependent on the mother than on the father. A wise mother can, if her husband be dead or neglectful of his duty, always keep the house together.”

      The foolish woman's ruin is her own work: she tears the house down “with her hands.”
    sources: [nrsvue, oshb-wlc, delitzsch-proverbs]

  - ref: 4
    phrase: Where no oxen are, the crib is clean
    kind: symbol
    title: An empty manger
    body: |
      The saying weighs an empty manger against a harvest: without oxen the stall stays clean, and there is no grain either. “Crib” is the King James word for “The manger of a stable, in which oxen and cows feed”; a modern translation reads the first line “Where there are no oxen, there is no grain.” The second line says what the ox is for: “much increase,” the crop, comes “by the strength of the ox.”
    sources: [webster-1828, nrsvue]

  - ref: 9
    phrase: Fools make a mock at sin
    kind: words
    title: Mocking at guilt
    body: |
      The meaning of the Hebrew here is uncertain, and the translations read the line differently. The word rendered “sin” is *'asham*, “guilt,” which in the law of Moses is also the name of the trespass offering, a sacrifice for wrongs “that could be estimated and so covered by compensation.” A modern translation reads “Fools mock at the guilt offering,” and adds that the meaning of the Hebrew is uncertain; the Septuagint has a different line altogether, “The houses of transgressors will need purification.”
    sources: [bdb, oshb-wlc, nrsvue, lxx-rahlfs]

  - ref: 12
    phrase: There is a way which seemeth right unto a man
    kind: scripture
    title: A way that seems right
    body: |
      The proverb warns that being sure of a road is no proof of where it ends. It is one of the sayings the book gives twice: [[Prov. 16:25]] repeats it, with “that” for “which.” Its end is plural, “the ways of death,” as the Hebrew has it, and the Septuagint makes the end deeper still: “the ends of it reach to the depths of hell.”
    sources: [lds-scriptures, nrsvue, lxx-rahlfs]

  - ref: 21
    phrase: He that despiseth his neighbour sinneth
    kind: structure
    title: What people do, and what God asks
    body: |
      Verse 20 reports how people treat the poor, and verse 21, set right after it, judges that treatment. That the poor man “is hated even of his own neighbour” while “the rich hath many friends” is an observation of how things go, not approval of it. The next saying takes up “neighbour” again and gives the verdict: to despise him is sin, and the one who “hath mercy on the poor” is happy. The chapter comes back to the poor in verse 31, where the poor man is tied to his Maker.
    sources: [lds-scriptures]

  - ref: 27
    phrase: The fear of the LORD is a fountain of life
    kind: scripture
    title: A fountain of life
    body: |
      Verses 26 and 27 tell what the fear of the LORD gives, the reverence explained at [[Prov. 1:7]]: a strong confidence, a refuge for one's children, and life. The second saying shares a line with the chapter before. [[Prov. 13:14]] says, “The law of the wise is a fountain of life, to depart from the snares of death”; verse 27 says the same of “the fear of the LORD.” The Septuagint, the Greek translation of the Old Testament, reads “The commandment of the Lord is a fountain of life.”
    sources: [lds-scriptures, lxx-rahlfs]

  - ref: 31
    phrase: He that oppresseth the poor reproacheth his Maker
    kind: scripture
    title: The poor man’s Maker
    body: |
      The saying ties the way a poor man is treated to the God who made him: to oppress him is to insult his Maker, and to honor God is to be kind to him. One older reading grounds that kindness in “a common relation to one Creator, and … respect towards a personality bearing the image of God.” The first line comes back, a little changed, at [[Prov. 17:5]]: “Whoso mocketh the poor reproacheth his Maker.” The same reading calls the Savior's words about the judgment “a New Testament side-piece” to the second line (see the closing section).
    sources: [delitzsch-proverbs, lds-scriptures]

  - ref: 32
    phrase: the righteous hath hope in his death
    kind: words
    title: Hope in death
    body: |
      The Hebrew says the righteous man finds refuge “in his death” (*bemoto*), and the ancient translations read it otherwise. The Septuagint has “he who is secure in his own holiness is just,” and a modern translation follows the Greek and Syriac: “the righteous find a refuge in their integrity.” One older reading explains the Greek as a change of “in his death” into “in his uprightness” (*betummo*), and keeps the Hebrew. The verb behind “hath hope” is the one a modern translation renders “find a refuge,” and in that older reading it is everywhere “the exclusive … designation of confidence resting itself in God”; “no Scripture word commends in so contradictory a manner self-righteousness.” So the line means that the righteous man, “in his death, even in the midst of extremity, is comforted, viz., in God in whom he confides.” The faithful of Israel, the same reading says, died, “though without any explicit knowledge, yet not without the hope of eternal life.”
    sources: [oshb-wlc, lxx-rahlfs, nrsvue, delitzsch-proverbs]

  - ref: 34
    phrase: Righteousness exalteth a nation
    kind: scripture
    title: Righteousness and a nation
    body: |
      The saying makes righteousness the measure of a people, and Latter-day Saint studies of the Book of Mormon quote it. One study of the promise the Lord spoke to Lehi, “Inasmuch as ye shall keep my commandments, ye shall prosper in the land” ([[Alma 9:13]]), finds it “the same as that given to Israel as a whole” and quotes this verse among the Old Testament's forms of it. Another says Mormon's abridgment, “a selection of the best that nearly a thousand years of Nephite history had to offer,” “would illustrate the principle, ‘Righteousness exalteth a nation: but sin is a reproach to any people.’”
    sources: [sc-knowhy-116, ricks-small-plates]

christ: |
  Verse 31 says that what is done to the poor is done against, or in honor of, the God who made them. In one older reading its New Testament counterpart is the Savior's account of the judgment, where the King says of what was done for “the least of these,” “Inasmuch as ye have done it unto one of the least of these my brethren, ye have done it unto me” ([[Matt. 25:40]]).

  The Lord gives the same measure to His disciples now, in His word in this dispensation: “remember in all things the poor and the needy, the sick and the afflicted, for he that doeth not these things, the same is not my disciple” ([[D&C 52:40]]). Care for the poor is part of what it means to follow Him.

explore: |
  - **The judgment of the nations.** [[Matt. 25:31–46]], beside verses 21 and 31.
  - **The way that seems right.** [[Prov. 16:25]] and [[Isa. 55:8–9]], beside verse 12.
  - **Righteousness and the land.** [[Alma 9:13]] and [[4 Ne. 1:15–17]], beside verse 34.

