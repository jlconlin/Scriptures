chapter: 25
title: A Word Fitly Spoken
tagline: The second collection of Solomon's proverbs, copied out by Hezekiah's men, opens with the king and fills its sayings with pictures, from golden apples in silver to a city without walls. Among them stands the saying Paul quoted, bread and water for an enemy.
when: 'Copied out under Hezekiah'

setting: |
  Chapter 25 opens the second collection of Solomon's proverbs, chapters 25–29, which the heading says “the men of Hezekiah king of Judah copied out” (the note on verse 1 says who they were). It sounds different from the first collection ([[Prov. 10:1]] to [[Prov. 22:16]]). One older reading observes that in the first collection “the figurative proverbs are almost entirely wanting, while in the second collection, chap. 25-29, on the contrary, they prevail.” This chapter is full of comparisons: “as … so,” “is like.” The same reading calls the Hezekiah collection “a people's book suited to the time of Hezekiah,” one that “takes its start not, like the first, from the duties of the child, but from those of the king,” and it opens with “a series of the king's sayings” (verses 2–7).

  Two of the chapter's sayings return in the New Testament. The counsel of verses 6–7 on taking the lower place matches the counsel Jesus gave at a feast ([[Luke 14:7–11]]), and Paul quotes verses 21–22 on feeding an enemy ([[Rom. 12:20]]).

thread: |
  Chapter 25, like the collections around it, is a string of separate sayings, and no argument runs from its first verse to its last. What marks it is its form: many sayings set a picture beside a kind of person. The faithful messenger is cold drink at harvest (verse 13); the boaster is cloud and wind with no rain (verse 14); the false witness is a war club, a sword and an arrow (verse 18); the man who cannot rule himself is a city with its walls broken down (verse 28).

  Two subjects return. The first is the king and his court (verses 2–7, and the ruler won by patience in verse 15): what the king must search out, and what a courtier must not presume. The second is speech, which runs through the middle of the chapter: the quarrel and the betrayed secret (verses 8–10), the word in season (verse 11), the wise rebuke heard by a willing ear (verse 12), the soft tongue that breaks bone (verse 15), the backbiting tongue (verse 23). Honey comes twice, each time as a warning against too much (verses 16 and 27). And one saying reaches past the court and the household to the enemy, who is to be fed (verses 21–22); Paul quotes it to the Saints at Rome.

sections:
  - range: 1-1
    heading: The heading of the collection
    plain: |
      These too are proverbs of Solomon, which the men of Hezekiah, king of Judah, copied out.
  - range: 2-7
    heading: Sayings about the king
    plain: |
      It is God's glory to keep a matter hidden, and a king's honor to search a matter out. As the heavens are high and the earth is deep, so the hearts of kings cannot be searched. Take the dross out of the silver, and the smith has metal for a vessel; take the wicked away from the king, and his throne will stand firm in righteousness. Do not put yourself forward before the king or take your stand where the great men stand. It is better to be told to come up higher than to be moved down in front of a prince you have seen.
  - range: 8-15
    heading: Quarrels, secrets and fitting words
    plain: |
      Do not rush into a quarrel, or what will you do at the end of it, when your neighbor has put you to shame? Argue your case with your neighbor himself, and do not reveal a secret to someone else, or whoever hears it will shame you and your bad name will never leave you. A word spoken at the right time is like golden apples in a silver setting. A wise man's rebuke to an ear that listens is like a gold earring or an ornament of fine gold. A faithful messenger is like a snow-cooled drink at harvest to those who send him: he refreshes his masters. A man who boasts of a gift he never gives is like clouds and wind that bring no rain. With patience a ruler is won over, and a gentle tongue breaks bone (on the soft answer, see [[Prov. 15:1]]).
  - range: 16-20
    heading: Too much of a good thing, and people who fail you
    plain: |
      If you find honey, eat only as much as you need, or you will have too much and vomit it. Set foot in your neighbor's house seldom, or he will tire of you and hate you. A man who bears false witness against his neighbor is a war club, a sword and a sharp arrow. Trusting a faithless man in a time of trouble is like leaning on a broken tooth or a foot out of joint. Singing songs to a heavy heart is like taking off a coat on a cold day, or pouring vinegar on soda.
  - range: 21-22
    heading: Bread for an enemy
    plain: |
      If your enemy is hungry, give him bread; if he is thirsty, give him water. So you will heap burning coals on his head, and the LORD will reward you.
  - range: 23-28
    heading: Sayings on several subjects
    plain: |
      As the north wind brings rain, so a backbiting tongue brings angry looks (the King James reads the line the other way; see the note). Better to live in a corner of the roof than share a large house with a quarrelsome woman (the saying has come before, at [[Prov. 21:9]]). Good news from a far country is like cold water to a thirsty soul. A righteous man who gives way before the wicked is like a trampled spring or a fouled fountain. Eating much honey is not good, and seeking one's own glory is no glory (see the note). A man who cannot rule his own spirit is like a city broken into and left without walls.

notes:
  - ref: 1
    phrase: the men of Hezekiah king of Judah copied out
    kind: history
    title: Copied out by Hezekiah’s men
    body: |
      The heading names the editors of this collection: men of King Hezekiah, who gathered proverbs already credited to Solomon. Hezekiah was the king of Judah who “suppressed idolatry and reconstituted the temple services,” with “the great prophet Isaiah” beside him in his reforms (his reign and the Assyrian invasion are at [[Isa. 36:1]]); he reigned in the late eighth century BC.

      “Copied out” is *he'tiqu*, from a verb meaning to “move, proceed, advance.” Here, in a very late use, it means to “transcribe (remove from one book or roll to another).” The Greek translators read it the same way, saying that “the friends of Ezekias king of Judea copied out” these sayings.

      The heading's date matters for the Book of Mormon. Since the copying was done in Hezekiah's reign, and Lehi “did not leave Jerusalem until around 600 BC, it is plausible that some proverbs were recorded on the brass plates”; if not, the Lehites “would likely have been familiar with the broader range of wisdom literature of their day.” Both are offered as likelihoods, not as known facts.
    sources: [bd-hezekiah, allis-pike-words-wise, oshb-wlc, bdb, lxx-rahlfs]
  - ref: 2
    phrase: It is the glory of God to conceal a thing
    kind: history
    title: What God conceals and the king searches out
    body: |
      The saying sets God and the king side by side by what brings each glory: God, what He keeps hidden; the king, what he brings to light. On one older reading God's glory is “to place before men mystery upon mystery, in which they become conscious of the limitation and insufficiency of their knowledge,” and the line agrees with Moses: “The secret things belong unto the LORD our God: but those things which are revealed belong unto us and to our children for ever” ([[Deut. 29:29]]). The king, as judge, earns his honor “by research, which brings out the true state of the matter,” so that hidden wrongs are found and judged. The same reading cautions that the thought that God hides things to “excite to activity human research, is not said in this proverb”: the searching here belongs to kings and to the cases brought before them.

      The next saying turns the point on the courtier. Like the height of heaven and the depth of the earth, the heart of kings cannot be searched (verse 3), and the same reading takes it as “a warning against the delusion of being flattered by the favour of the king.”
    sources: [delitzsch-proverbs]
  - ref: 7
    phrase: Come up hither
    kind: scripture
    title: The lower seat
    body: |
      Jesus gave the same counsel in a parable at a meal, “when he marked how they chose out the chief rooms” ([[Luke 14:7]]). He told the guests to take the lowest seat, so that the host might say, “Friend, go up higher” ([[Luke 14:10]]); the Church's footnote at verse 7 points to the parable.

      The proverb's reason is a courtier's: better to be called up before the great than to be sent down in front of them. The Savior names the law beneath it, which reaches beyond any court: “For whosoever exalteth himself shall be abased; and he that humbleth himself shall be exalted” ([[Luke 14:11]]).
    sources: [lds-scriptures]
  - ref: 11
    phrase: apples of gold in pictures of silver
    kind: symbol
    title: Golden fruit in silver
    body: |
      A word spoken in the right circumstances is as fine as golden fruit set in silver. “Fitly” renders *'al-ophnav*, “in (right) circumstances,” from a noun for “circumstance, condition (perhaps literally turning)”: a word that fits its moment. The Church's footnote sets beside it “a word spoken in due season, how good is it!” ([[Prov. 15:23]]).

      The “pictures” are not paintings. The Hebrew word is a “show-piece,” used for carved figures, and here means “silver carvings”; a modern translation reads “apples of gold in a setting of silver.” The golden apples sit in worked silver as a fitting word sits in its occasion.
    sources: [bdb, lds-scriptures, nrsvue]
  - ref: 20
    phrase: as vinegar upon nitre
    kind: symbol
    title: Vinegar on soda
    body: |
      Singing to the grieving is set beside two acts that do not suit their moment: taking off a coat on a cold day, and pouring vinegar on “nitre.” The nitre is *neter*, “natron, or carbonate of soda, a mineral alkali,” not the saltpeter the English word names now, and vinegar poured on it is “figurative of the incompatible.” Cheerful songs meet a heavy heart the way vinegar meets soda.

      A modern translation follows the Greek in this verse, reading “Like vinegar on a wound is one who sings songs to a heavy heart,” and adds a couplet from the Greek, Syriac and Targum that its footnote says the Hebrew lacks: “Like a moth in clothing or a worm in wood, sorrow gnaws at the human heart.” The King James follows the Hebrew.
    sources: [oshb-wlc, bdb, nrsvue]
  - ref: 21
    phrase: If thine enemy be hungry, give him bread to eat
    kind: scripture
    title: Bread for an enemy, coals on his head
    body: |
      Paul quotes this saying between two commands that set revenge aside. “Dearly beloved, avenge not yourselves,” he writes, for vengeance belongs to the Lord ([[Rom. 12:19]]); then comes the proverb: “if thine enemy hunger, feed him; if he thirst, give him drink: for in so doing thou shalt heap coals of fire on his head” ([[Rom. 12:20]]); and he closes, “Be not overcome of evil, but overcome evil with good” ([[Rom. 12:21]]).

      Read alone, the verses can sound like doing right for the wrong reason, so that an enemy “will receive a worse torment”; Romans 12 and other scriptures “suggest a different interpretation”: bringing him to repentance by sharpening his conscience. The coals are “a figure of self-accusing repentance,” brought about by “the showing of good to an enemy,” and the proverb gives two reasons for the kindness: “first, that thereby his injustice is brought home to his conscience; and, secondly, that thus God is well-pleased in such practical love toward an enemy, and will reward it.” The same commentary sets aside the reading that the good is done to make an enemy smart: done “from a revengeful aim,” it “loses all its moral worth.” The law had already told Israel to help an enemy whose donkey had fallen under its load ([[Ex. 23:4–5]]).
    sources: [lds-scriptures, ot-manual-proverbs, delitzsch-proverbs]
  - ref: 23
    phrase: The north wind driveth away rain
    kind: words
    title: The wind that brings rain
    body: |
      In the Hebrew the north wind brings rain; it does not drive rain away. The verb is *techolel*, from a root meaning to “writhe in travail with, bear, bring forth,” and this verse is the one where it is used “of north wind bringing forth rain.” A modern translation reads the whole saying so: “The north wind produces rain, and a backbiting tongue, angry looks.” Read that way, the two lines run the same direction: as the wind brings the storm, the whispered slander brings the angry faces.
    sources: [oshb-wlc, bdb, nrsvue]
  - ref: 26
    phrase: A righteous man falling down before the wicked is as a troubled fountain
    kind: symbol
    title: A trampled spring
    body: |
      “Falling down” here is giving way: a modern translation reads “the righteous who give way before the wicked.”

      Most readers, one older commentary says, take the yielding as forced: the righteous man is “driven from his dwelling or his possession by an unrighteous man,” and the people who drew from him lose their spring. That commentary reads it as his own failure. He ought to stand firm, but if “from the fear of man, or the desire to please man, or from a false love of peace he yields,” then “his character, hitherto pure, is now corrupted by his own guilt,” and instead of a spring for others “his wavering is a cause of sorrow to the righteous, and an offence to the weak.”
    sources: [nrsvue, delitzsch-proverbs]
  - ref: 27
    phrase: so for men to search their own glory is not glory
    kind: words
    title: Too much honey, too much glory
    body: |
      The verse sets the hunt for one's own glory beside the honey of verse 16: good in measure, sickening in excess. The King James makes the second line a warning against seeking one's own glory, and a modern translation gives the same sense more plainly: “It is not good to eat much honey or to seek honor on top of honor.”
    sources: [nrsvue]

christ: |
  The Savior's teaching meets two of this chapter's sayings. He gave the counsel of verses 6–7 in a parable at a feast and named the law beneath it (see the note on verse 7). The Church's footnote at verse 21 sets the command to feed an enemy beside His words to the Nephites: “love your enemies, bless them that curse you, do good to them that hate you” ([[3 Ne. 12:44]]), “That ye may be the children of your Father who is in heaven” ([[3 Ne. 12:45]]).

  A disciple who feeds a hungry enemy is acting as a child of that Father, and leaves the reckoning with the Lord, who “shall reward thee” ([[Prov. 25:22]]).

