  - **Love for an enemy.** [[Ex. 23:4–5]], [[Matt. 5:43–48]], [[3 Ne. 12:43–45]] and [[Rom. 12:17–21]].
  - **A word in season.** [[Prov. 15:23]], [[Isa. 50:4]] and [[D&C 121:41–43]].
  - **Ruling one's spirit.** [[Prov. 16:32]] and [[Alma 38:12]].

