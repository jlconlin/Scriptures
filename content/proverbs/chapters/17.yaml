chapter: 17
title: A Friend Loveth at All Times
tagline: Separate sayings on the quiet house and the house of strife, the heart the LORD tries, the bribe that seems to work, the quarrel let out like water, the friend and the brother, and the fool who would be thought wise if he kept still.
when: 'The proverbs of Solomon'

setting: |
  Chapter 17 stands in the first collection of Solomon's proverbs, which opens with its own heading at [[Prov. 10:1]] and runs to [[Prov. 22:16]]; the setting of chapter 10 says what kind of sayings these are and how their two lines are read together. Like the chapters around it, this one is a string of two-line sayings, each complete in itself.

  Several of them have been heard before or will be heard again. The first line of verse 5 is the saying of [[Prov. 14:31]], a little changed (see the note there); the crucible and furnace of verse 3 return at [[Prov. 27:21]] with a different test; the man who “striketh hands” in verse 18 is the surety warned against at [[Prov. 6:1]]; and the foolish son who grieves his parents (verses 21 and 25) is the son of [[Prov. 10:1]]. This is also one of the book's chapters on the fool; the kinds of fool Proverbs names are explained at [[Prov. 1:22]].

thread: |
  Three subjects come back among the chapter's twenty-eight sayings. The fool is the most frequent: no fine speech suits him (verse 7), a hundred blows teach him less than one rebuke teaches a wise man (verse 10), he is worse to meet than a bear robbed of her cubs (verse 12), money in his hand buys no wisdom (verse 16), he grieves the father and the mother who raised him (verses 21, 25), his eyes wander to the ends of the earth (verse 24), and only his silence makes him look wise (verse 28).

  The second is the quarrel. The chapter opens by preferring dry bread in peace to a feast with strife (verse 1), warns that strife once begun runs like water from a broken dam (verse 14), and says that whoever loves strife loves sin (verse 19). Set against the quarrel is the friend who forgives instead of repeating the matter (verse 9) and who loves at all times (verse 17). The third is justice bought and sold: the bribe that seems to its holder to open every door (verse 8) is taken from the bosom “to pervert the ways of judgment” (verse 23), the LORD abhors both the acquittal of the guilty and the condemning of the innocent (verse 15), and to punish the just “is not good” (verse 26). Over all of it stands the LORD who “trieth the hearts” (verse 3), as the crucible tries silver.

sections:
  - range: 1-6
    heading: The household and the heart
    plain: |
      A dry crust eaten in peace is better than a house full of feasting where there is quarreling. A servant who acts wisely will rule over a son who brings shame, and will have a hand in the inheritance among the brothers. The crucible tests silver and the furnace tests gold, but the LORD tests hearts. An evildoer listens to wicked lips, and a liar listens to a mischievous tongue. Whoever mocks the poor insults the God who made him, and whoever is glad at another's disaster will be punished. Grandchildren are the crown of the old, and children take their glory from their fathers.
  - range: 7-12
    heading: Speech, bribes and reproof
    plain: |
      Fine speech does not suit a fool, and lying lips suit a ruler far less. A bribe looks like a precious stone to the one who holds it; wherever he turns, it seems to work. Whoever forgives an offense promotes love, but whoever keeps bringing it up separates close friends. A rebuke goes deeper into a wise man than a hundred blows into a fool. An evil man is bent only on rebellion, so a merciless messenger will be sent against him. Better to meet a bear robbed of her cubs than a fool in his folly.
  - range: 13-19
    heading: Strife and friendship
    plain: |
      Whoever repays good with evil will never be rid of evil in his house. Starting a quarrel is like letting out water, so drop it before it breaks out. To acquit the guilty and to condemn the innocent are both abhorrent to the LORD. Why does a fool hold money to buy wisdom when he has no mind for it? A friend loves at all times, and a brother is born for hard times. A man without sense shakes on a pledge to guarantee another's debt in front of his friend (see [[Prov. 6:1]]). Whoever loves strife loves sin, and whoever builds his gate high is asking for ruin.
  - range: 20-28
    heading: The fool, his parents and the closed mouth
    plain: |
      A crooked heart finds no good, and a twisted tongue falls into trouble. Whoever fathers a fool does it to his sorrow, and the father of a fool has no joy. A cheerful heart does good like medicine, but a crushed spirit dries up the bones. A wicked man takes a bribe from the fold of his robe to bend the course of justice. The man of understanding keeps wisdom in front of him, but a fool's eyes wander to the ends of the earth. A foolish son grieves his father and is bitterness to the mother who bore him. It is not right to punish the innocent, or to flog the noble for their integrity. A man who knows much uses few words, and a man of understanding has an excellent spirit. Even a fool who keeps quiet is thought wise; with his lips shut he is counted intelligent.

notes:
  - ref: 1
    phrase: an house full of sacrifices with strife
    kind: history
    title: A house full of feasts
    body: |
      The “sacrifices” are slain animals, whether offerings or the meat of a feast, so the saying most likely sets the plainest meal against the richest. The Hebrew word means “slain animals, i.e., either offerings or banquets of slain beasts”; it is “the old name” of the peace offerings, “part of which only were offered on the altar, and part presented as a banquet” (on that meal, see [[Prov. 7:14]]), and it can be rendered simply “a house full of feasting.” The “dry morsel” is bread “without savoury drink,” nothing with it.

      One older reading supposes that such feasts, with their drink, “brought quarrels and strife, so that the poor who ate his dry bread in quiet peace could look on all this noise and tumult without envy.”
    sources: [delitzsch-proverbs, nrsvue]

  - ref: 2
    phrase: shall have part of the inheritance among the brethren
    kind: words
    title: A share, or the dividing
    body: |
      The verse may mean that the wise servant shares the inheritance or that he divides it, and the translations differ. A modern translation has him “share the inheritance as one of the family.” The Septuagint has him “divide portions among brethren,” and one older reading holds that the verb with a direct object means “nothing else than to distribute,” as “all translators, from the lxx to Luther” took it. On that reading the servant is not made an heir: he is trusted to divide the estate among the sons, while “the degenerate … loses his inheritance, and the intelligent servant steps into his place.”
    sources: [nrsvue, lxx-rahlfs, delitzsch-proverbs]

  - ref: 3
    phrase: The fining pot is for silver, and the furnace for gold
    kind: symbol
    title: The fining pot
    body: |
      A “fining pot” is a crucible, the vessel in which metal is refined. The saying is a comparison: what the crucible is to silver and the furnace to gold, the LORD is to the heart. At [[Prov. 27:21]] the same two figures return, but there the test of a man is “his praise.”
    sources: [bdb]

  - ref: 8
    phrase: A gift is as a precious stone in the eyes of him that hath it
    kind: words
    title: A bribe that works
    body: |
      The “gift” is a bribe, and the proverb describes how a bribe looks; it does not approve of it. The Hebrew word is the one the law uses when it forbids judges to “take a gift: for a gift doth blind the eyes of the wise” ([[Deut. 16:19]]; see the note at [[Deut. 16:18]]), and it is the word of verse 23 and of [[Prov. 21:14]]. Here, “as always,” it is “the gift of bribery,” and “The proverb expresses a fact of experience.”

      Translations differ over whose eyes see the “precious stone.” A modern translation says the bribe is “a magic stone in the eyes of those who give it; wherever they turn they prosper.” Another reading takes it of the one who receives it: the bribe “appears a jewel to its receiver.”

      The chapter itself passes judgment on it. In verse 23 the bribe comes out “of the bosom,” the fold of the robe where it was hidden, “to pervert the ways of judgment,” so “the giver of the bribe has not right on his side.” Verse 15 says that to justify the wicked is “abomination to the LORD.”
    sources: [bdb, delitzsch-proverbs, nrsvue]

  - ref: 11
    phrase: a cruel messenger shall be sent against him
    kind: history
    title: A cruel messenger
    body: |
      The “messenger” may be human or heavenly, and in one older reading the proverb holds either way. The Hebrew word is the common one for anyone sent with a message. The Septuagint makes God the sender: “the Lord will send out against him an unmerciful messenger.” The line need not be taken “directly and exclusively of an angel of punishment”: an earthly king might send a messenger with an unlimited commission against rebels, or an officer against one man dangerous to the state. The rebel who seeks only rebellion will in the end meet someone sent to stop him who will show no mercy.
    sources: [bdb, lxx-rahlfs, delitzsch-proverbs]

  - ref: 14
    phrase: The beginning of strife is as when one letteth out water
    kind: symbol
    title: Letting out water
    body: |
      The beginning of a quarrel is pictured as water let loose, which is why the second line says to stop before it breaks out. The verb means to “separate, remove, set free.” In one older reading the one who lets out water is one who “breaks through a water-dam, withdraws the restraint of the water, opens a sluice,” and “thus conditioned is the beginning of a strife.”
    sources: [bdb, delitzsch-proverbs]


  - ref: 17
    phrase: A friend loveth at all times, and a brother is born for adversity
    kind: structure
    title: A friend and a brother
    body: |
      The “brother” of the second line may be the friend of the first, proved in trouble, or a brother by birth; the translations read it both ways. In the first, “Brother is more than friend”: the true friend proves himself “as a brother” in adversity, born for the need “to bear it in sympathy, and to help to bear it.” A modern translation reads the line as a fact about families, “kinsfolk are born to share adversity,” and the Septuagint, “let brethren be useful in distress; for on this account are they born.”
    sources: [delitzsch-proverbs, nrsvue, lxx-rahlfs]

  - ref: 19
    phrase: he that exalteth his gate seeketh destruction
    kind: symbol
    title: A high gate
    body: |
      The man who “exalteth his gate” may be building the entrance of his house high, and the line says he is courting his own ruin. The ruin may be pictured as a fall over the doorstep: “one who builds a high threshold invites broken bones.” The two lines may also describe one man: love of quarrels and love of display are both “symptoms of selfishness,” and “he who cannot have the door of his house high enough and splendid enough, prepares thereby for himself, against his will, the destruction of his house.” The Septuagint carries a line of the same kind: “He that exalts his own house seeks ruin.” On pride before a fall, see [[Prov. 16:18]].
    sources: [nrsvue, delitzsch-proverbs, lxx-rahlfs]


christ: |
  The LORD who “trieth the hearts” (verse 3) is, in the scripture the Church's footnote sets beside the verse, the Lord who comes to His temple and “shall sit as a refiner and purifier of silver” ([[Mal. 3:3]]). Jesus said that John the Baptist was the messenger sent before that coming: “this is he, of whom it is written, Behold, I send my messenger before thy face” ([[Matt. 11:10]]). The friend who “covereth a transgression” (verse 9) does what the Lord asks of His disciples in this dispensation: “ye ought to forgive one another; for he that forgiveth not his brother his trespasses standeth condemned before the Lord,” and “of you it is required to forgive all men” ([[D&C 64:9–10]]).

explore: |
  - **Love that covers.** [[Prov. 10:12]] and its use in [[1 Pet. 4:8]], beside verse 9.
  - **Bribes and justice.** [[Deut. 16:18–20]] and [[Isa. 5:23]], beside verses 8, 15 and 23.

