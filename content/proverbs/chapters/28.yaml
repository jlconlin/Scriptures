chapter: 28
title: Bold as a Lion
tagline: Twenty-eight separate sayings in which the wicked keep rising to power and the poor keep paying for it. The guilty run when no one chases them, the righteous stand like a lion, and the one who confesses and forsakes his sins finds mercy.
when: 'Copied out under Hezekiah'

setting: |
  Chapter 28 belongs to the second collection of Solomon's proverbs, the sayings “which the men of Hezekiah king of Judah copied out” ([[Prov. 25:1]]; on that heading see the note there). It is made of separate sayings, almost all of two lines, and most of them set the wicked against the righteous.

  One older reading sees the collector's hand in how the sayings are grouped. A run of sayings that open with “He that …” begins at verse 7. The first group ends at verse 11 with a saying about riches, and the second, verses 12–20, closes the same way; a new group begins at verse 21 with a line that repeats [[Prov. 24:23]]. The sections below follow those seams. The same reading notices that in this collection, unlike the first, the kingdom “is seen almost only … on its dark side”: here, a land with many rulers (verse 2) and the tyrant over the poor (verses 15–16).

thread: |
  Chapter 28 is a string of separate sayings, not an argument, but two subjects keep returning. One is power in the wrong hands. A land given to transgression gets many rulers (verse 2); the oppressor of the poor is a flood (verse 3); a wicked ruler is a lion and a bear (verse 15). Twice the chapter says what happens when the wicked “rise”: people go into hiding (verses 12 and 28, whose first line is one older reading's “variation” of the second line of verse 12). The other is the poor. They appear six times (verses 3, 6, 8, 11, 15, 27), and the chapter is always on their side: the upright poor man is better than the crooked rich one, he sees through the rich man's conceit, and the one who gives to him lacks nothing.

  Under these runs the book's picture of the two ways (see [[Prov. 4:18]]). On one older reading, the “two ways” of the crooked man in verses 6 and 18 are “the evil way which the deceiver truly walks in, and the good way which he pretends to walk in.” Against that doubleness the chapter sets the man who keeps the law (verses 4, 7, 9), who seeks the LORD (verse 5), and who brings his sins into the open (verse 13).

sections:
  - range: 1-6
    heading: The wicked, the ruler and the law
    plain: |
      The wicked run when no one is chasing them, but the righteous are as bold as a lion. When a land transgresses, it has many rulers; but through one man of understanding and knowledge, its order lasts long. A poor man who oppresses the poor is like a driving rain that leaves no food (the Hebrew is read two ways; see the note). Those who forsake the law praise the wicked, but those who keep it contend with them. Evil men do not understand what is right, but those who seek the LORD understand all things. Better the poor man who walks in integrity than the crooked one who is rich (a variation of [[Prov. 19:1]]).
  - range: 7-11
    heading: Gain and the poor
    plain: |
      Whoever keeps the law is a wise son, but the companion of gluttons and wastrels shames his father. Whoever increases his wealth by interest and unjust gain gathers it for someone who will be kind to the poor. Whoever turns his ear away from hearing the law, even his prayer is an abomination. Whoever leads the upright astray into an evil way will fall into his own pit, but the upright will inherit good. The rich man is wise in his own eyes, but a poor man with understanding sees right through him.
  - range: 12-20
    heading: When the wicked rise
    plain: |
      When the righteous triumph there is great glory, but when the wicked rise, people hide. Whoever covers his sins will not prosper, but whoever confesses and forsakes them will find mercy. Happy is the man who is always wary (on one older reading, wary of sin), but the man who hardens his heart falls into trouble (on the fear of the LORD, see [[Prov. 1:7]]). Like a roaring lion and a prowling bear is a wicked ruler over a poor people. A prince who lacks understanding is a great oppressor, but the one who hates covetousness will live long. A man weighed down by another's blood will flee to the grave; let no one hold him up. Whoever walks uprightly will be saved, but the one who is crooked in his two ways will fall all at once. Whoever works his land will have plenty of bread, but whoever chases worthless things will have plenty of poverty (the same saying as [[Prov. 12:11]], in other words). A faithful man will abound with blessings, but whoever hurries to be rich will not be innocent.
  - range: 21-24
    heading: Partiality and haste to be rich
    plain: |
      To show partiality is not good (the line of [[Prov. 24:23]] again), for a man will do wrong for a mere piece of bread. The man with an evil eye, envious and grasping, hurries after riches and does not see that want will come upon him. Whoever rebukes a man will in the end find more favor than one who flatters with his tongue. Whoever robs his father or his mother and says, “That is no wrong,” is the companion of a destroyer.
  - range: 25-28
    heading: Trusting the LORD, and the poor
    plain: |
      The proud heart stirs up strife, but whoever trusts in the LORD will be made fat (on trust in the LORD, see [[Prov. 3:5]]). Whoever trusts in his own heart is a fool, but whoever walks wisely will be delivered. Whoever gives to the poor will not lack, but whoever shuts his eyes so as not to see their need will have many a curse. When the wicked rise, people hide themselves, but when the wicked perish, the righteous increase (the first line is close to verse 12).

notes:
  - ref: 1
    phrase: The wicked flee when no man pursueth
    kind: symbol
    title: Fleeing when no one pursues
    body: |
      The guilty run from a pursuer who isn't there, because the fear that drives them is their own. The same words stand in the covenant curses of the law, to which the Church's footnote points: Israel, if it broke the covenant, would “flee when none pursueth” ([[Lev. 26:17]]). A few verses on, the curse says where the fear comes from and how far it goes: “I will send a faintness into their hearts in the lands of their enemies; and the sound of a shaken leaf shall chase them; and they shall flee, as fleeing from a sword; and they shall fall when none pursueth” ([[Lev. 26:36]]). The righteous man of the second line carries no such fear, and stands his ground like a lion.
    sources: [lds-scriptures]
  - ref: 3
    phrase: A poor man that oppresseth the poor
    kind: words
    title: A poor man, or a ruler?
    body: |
      The Hebrew can be read as “a poor man” or as “a head,” a ruler, and readers divide over which. The word is *rash*, “poor,” and the King James and a modern translation keep it: “A poor person who oppresses the poor is a beating rain that leaves no food.” One older reading finds “a poor man” (*gever rash*) a phrase “without a parallel,” since the book elsewhere says simply *rash*. It takes the letters as a spelling of *rosh*, “head,” as Phoenician spelled that word, and reads a man who “is the head … and oppresses the helpless.” Another modern translation reads the same way: “A ruler who oppresses the poor is like a driving rain that leaves no crops.”

      The image works either way. Rain should water the fields; a driving rain “only destroys instead of promoting the growth of the corn.” So with the oppressor: on that reading, those under a master have “to expect from him that which is good,” and he ruins them instead.
    sources: [oshb-wlc, nrsvue, niv, delitzsch-proverbs]
  - ref: 4
    phrase: They that forsake the law
    kind: words
    title: Whose law?
    body: |
      “The law” in these sayings (verses 4, 7 and 9) is *torah*, “direction, instruction, law,” and readers differ over whose instruction is meant. All three verses can be read as the “human” instruction of the sages, beside the law of a mother and of a father in [[Prov. 1:8]] and [[Prov. 3:1]]. One older reading hears more in verse 4: those who praise the wicked “turn away from the revealed word of God,” while at verse 7 the word “includes the father's instruction regarding the right way of life.”

      At verse 9 the same reading points to [[Prov. 15:8]] and [[1 Sam. 15:22]]: the prayer of one who will not hear the law is an abomination because in it “the whole soul, the whole will of the suppliant, is not present.”
    sources: [bdb, delitzsch-proverbs]
  - ref: 5
    phrase: they that seek the LORD understand all things
    kind: scripture
    title: Understanding all things
    body: |
      The “all things” of the second line answers the “judgment” of the first: evil men do not understand what is right, and those who seek the LORD do. On one older reading, the one whose end is God gains, “in every situation of life, even amid the greatest difficulties, the knowledge of that which is morally right.” That reading sets beside it John's words to the Saints: “ye have an unction from the Holy One, and ye know all things” ([[1 Jn. 2:20]]).
    sources: [delitzsch-proverbs]
  - ref: 8
    phrase: He that by usury and unjust gain increaseth his substance
    kind: history
    title: Usury
    body: |
      “Usury” once meant any interest on a loan, not only an excessive rate: in 1828 the word “formerly denoted any legal interest.” The law of Moses forbade an Israelite to take it from a poor brother: “Take thou no usury of him, or increase” ([[Lev. 25:36]]). On one older reading the two words of this verse are the two of that law: *neshek*, “interest taken in money,” and *tarbit*, interest “taken in kind,” when a man lends grain or oil and the borrower “gives back more than he has received.”

      The saying's turn is in its second line. Such wealth, that reading says, “does not remain with him who has scraped it together,” but goes “finally into the possession of one who is merciful towards the poor.” It is the turn of an earlier saying: “the wealth of the sinner is laid up for the just” ([[Prov. 13:22]]).
    sources: [webster-1828, delitzsch-proverbs]
  - ref: 13
    phrase: 'He that covereth his sins shall not prosper: but whoso confesseth and forsaketh them shall have mercy'
    kind: scripture
    title: Confess and forsake
    body: |
      Mercy comes to the one who does two things, confesses his sins and forsakes them; the one who covers them does not prosper. The Lord gives the same two marks in latter-day revelation: “By this ye may know if a man repenteth of his sins—behold, he will confess them and forsake them” ([[D&C 58:43]]). Of one man who would not, He says, “he confesseth them not, and he thinketh to hide them” ([[D&C 58:60]]).

      In Latter-day Saint teaching, confession is “a key element of repentance,” though “not a mechanical requirement, nor is it an ordinance”; it is made “to a bishop, to God, or to offended parties,” and “Pride and fear prevent confession.” Whatever the manner, sins “must be brought to light and purged.”
    sources: [kimball-confession, lds-scriptures]
  - ref: 17
    phrase: shall flee to the pit; let no man stay him
    kind: history
    title: The murderer’s flight
    body: |
      The man with blood on his hands is left to his flight, and no one is to shelter him. The “pit” is the grave. On one older reading the murderer, “inwardly bowed down by the blood of a man whom he has murdered,” runs “to escape the avenger of blood, the punishment of his guilt, and his own inward torment,” until the grave receives him.

      On that reading, “Let no man stay him” does not forbid laying hold of him; it forbids helping him. No one is to “afford him any support, any refuge, any covering or security against the vengeance which pursues him,” or “rescue him from the arm of justice.” The same reading notes that the book elsewhere urges saving a life wherever possible ([[Prov. 24:11]]), and holds both together: “Grace cannot come into the place of justice till justice has been fully recognised.” The same reading allows that the line may instead state what cannot be done, not what must not: “let no one seek to deliver him from the unrest which drives him from place to place.”
    sources: [delitzsch-proverbs]

christ: |
  The mercy promised in verse 13 is the Lord's own to give. In latter-day revelation He says of the one who confesses and forsakes his sins, “he who has repented of his sins, the same is forgiven, and I, the Lord, remember them no more” ([[D&C 58:42]]). The Church's footnote on “covereth” points to John's warning that “If we say that we have not sinned, we make him a liar” ([[1 Jn. 1:10]]), and John goes straight on: “if any man sin, we have an advocate with the Father, Jesus Christ the righteous” ([[1 Jn. 2:1]]).

  For a disciple, sin brought into the open and forsaken is met by an Advocate with the Father, and by a Lord who forgives it and remembers it no more.

explore: |
