  - **Rulers who devour.** [[Hosea 8:4]], [[Jer. 22:13–19]], [[Prov. 29:2]] and [[Prov. 29:16]].
  - **The poor.** [[Lev. 25:35–37]], [[Prov. 14:31]], [[Prov. 19:17]] and [[Alma 32:12–13]].

