chapter: 5
title: Drink from Your Own Well
tagline: The father warns his son that the strange woman’s sweet words lead down to death, counts what her road would cost him, and sets against her the wife of his youth, under the eyes of the LORD who weighs every path.
when: 'A father’s instruction, under Solomon’s name'

setting: |
  Proverbs 5 belongs to the book’s first collection (chapters 1–9), the father’s instruction to his son ([[Prov. 1:8]]). It is one of a series of lessons; one Latter-day Saint study of their form lists it as the eighth, “Another man’s wife and one’s own.” The strange woman, whose name and broken covenant are explained at [[Prov. 2:16]], is the subject of this lesson; she returns at [[Prov. 6:24]] and in the story of chapter 7.

  Chapters 1–9 are built on two paths: Wisdom calls the son to the shining path of the righteous, and the strange woman leads on the dark path of the wicked ([[Prov. 4:18–19]]). Chapter 5 puts those two paths inside a young man’s household, making them, in one reading, “more concrete for the young man: his wife and another’s wife.” Its last verses widen the view to the LORD, before whose eyes every path lies.

thread: |
  Proverbs 5 is an argument about where a road ends. The father asks for his son’s ear (5:1–2), and the reason is the strange woman: her words are sweet, but her road goes down to death, and, as modern translations read verse 6, she never weighs where it leads (5:3–6). He then counts what that road costs, in honor, years, strength and labor, and lets the son hear himself at the end of it, groaning that he would not listen and ruined before the whole assembly (5:7–14).

  Then the chapter turns, and the turn is its answer. Against the strange woman the father does not set only distance but delight: water from the son’s own well, the wife of his youth, and her love, in which he is to be “ravished always” (5:15–19). The verb is the one the father uses next for being carried away by a stranger (5:20) and, at the end, for the fool who “shall go astray” (5:23). The last verses bring in the LORD, who “pondereth” every path, the verb the father used of the woman’s path in verse 6 (5:21), and sin itself, which ties its own cords (5:22).

sections:
  - range: 1-6
    heading: The strange woman’s road
    plain: |
      My son, pay attention to my wisdom, and listen closely to what I understand, so that you keep good judgment and your lips guard knowledge. The lips of the strange woman drip honey, and her speech is smoother than oil, but in the end she is as bitter as wormwood and as sharp as a two-edged sword. Her feet go down to death; her steps lead straight to Sheol, the world of the dead. She never weighs the path of life (so modern translations read the line; the King James makes it a warning to the son); her tracks wander, and she does not know it.
  - range: 7-14
    heading: What her road costs
    plain: |
      So listen to me now, children, and do not turn from what I say. Keep your way far from her, and do not go near the door of her house. Otherwise you will give your honor to others and your years to someone cruel; strangers will take their fill of your strength, and what you worked for will end up in a stranger’s house. At the end you will groan, when your body is wasted, and say: “How I hated discipline, and how my heart despised correction! I did not obey my teachers or listen to those who taught me. I came close to complete ruin in front of the whole assembly.”
  - range: 15-23
    heading: Your own well
    plain: |
      Drink water from your own cistern, fresh water from your own well. Should your springs spill out into the street, your streams into the streets? Let them be yours alone, not shared with strangers. Let your fountain be blessed, and rejoice in the wife of your youth, a loving doe, a graceful deer; let her breasts satisfy you always, and be carried away always by her love. Why, my son, be carried away by a strange woman and embrace a stranger? Every person’s ways are before the eyes of the LORD, and He weighs all their paths. The wicked man’s own sins catch him, and he is held fast in the cords of his sin. He dies for lack of discipline, and in his great folly he goes astray.

notes:
  - ref: 3
    phrase: strange woman
    kind: history
    title: Another man’s wife
    body: |
      The strange woman is another man’s wife, the woman of [[Prov. 2:16–17]] who has left the guide of her youth and forgotten the covenant of her God; the two Hebrew words and the covenant are explained there. Chapter 5 makes the book’s two ways concrete for the son: “his wife and another’s wife.” What marks her throughout these chapters, and in verse 3 here, is her speech, “smooth, flattering,” and her “disloyalty to her husband.”

      The son is the one who answers for the choice: it is he, not she, who groans at the end of verses 11–14. One Latter-day Saint study adds a caution: “we do have to be cautious that the images of the strange woman as a seducing temptress do not add to a general assumption that women should be treated as dangerous and that any interaction with them is hazardous.” The chapter itself sets another woman beside her, the wife the son is told to rejoice in (5:18–19).
    sources: [ot-minute-proverbs-1-9, von-feldt-instructional-wisdom]

  - ref: 4
    phrase: her end is bitter as wormwood, sharp as a twoedged sword
    kind: symbol
    title: Sweet at first, bitter at the end
    body: |
      Honey and oil describe how her words taste; wormwood and a sword describe what they leave. The “mouth” of verse 3 is in Hebrew the “palate.” Wormwood, the herb *Artemisia*, stands in scripture for “bitter calamity or sorrow.” “Her end” is what comes after the first taste, and a modern translation makes the turn plain: “but in the end she is bitter as wormwood, sharp as a two-edged sword.”
    sources: [bd-wormwood, esv, nrsvue]

  - ref: 5
    phrase: her steps take hold on hell
    kind: symbol
    title: Down to Sheol
    body: |
      “Hell” here is *Sheol*, the Hebrew name for “the abode of departed spirits,” which the King James Version renders “grave,” “pit,” or “hell” as the context seems to ask; a modern translation reads, “her steps follow the path to Sheol.” “Take hold on” is in Hebrew “lay hold of.” The picture is of direction, feet going down toward the dead.

      A Latter-day Saint study reads death and hell here as metaphors: the son who follows her “arrives at death and hell, metaphors for a blighted life where positive growth ceases and moral decay prevails.”
    sources: [bd-sheol, nrsvue, esv, allis-pike-words-wise]

  - ref: 6
    phrase: Lest thou shouldest ponder the path of life
    kind: words
    title: She does not weigh the path of life
    body: |
      Modern translations make the woman, not the son, the subject of this line, which one renders “She does not keep straight to the path of life; her ways wander, and she does not know it.” An old Jewish interpretation took the line as said to the son, as the King James Version does; the Septuagint and Jerome read it of her, and one older reading argues that “the subject … is the adulteress.” Read that way, the verse says she never stops to weigh where her road goes, and her tracks drift without her noticing.

      The verb (*pillēs*) which the King James renders “ponder,” means to level or smooth a path. It returns in verse 21, where the LORD “pondereth all his goings,” and the same older reading draws the lesson there: “man can take no step in any direction without God; and that not only does not exempt him from moral responsibility,” but makes it sharper.
    sources: [esv, nrsvue, delitzsch-proverbs, bdb]

  - ref: 14
    phrase: I was almost in all evil in the midst of the congregation and assembly
    kind: history
    title: Ruined before the assembly
    body: |
      The man’s last lament is that he has come to the edge of ruin in public. One Latter-day Saint rendering is “I was almost completely ruined in the midst of the congregation and assembly,” and a modern translation reads “at the point of utter ruin in the public assembly.” “Almost in all evil” is a disaster nearly complete, and it comes “in the midst of the congregation and assembly,” in public.

      What began behind the door of her house (5:8) ends in front of everyone. The book, in the same study’s words, “is emphatic that our actions always take place within a community and, because of this, ultimately affect others, including God. Thus, what may have seemed secret and private will always affect a community.” Her path, in the same study, “puts one’s household in danger,” and the father’s warning that strangers will be filled with the son’s wealth (5:10) says how.
    sources: [ot-minute-proverbs-1-9, nrsvue]

  - ref: 16
    phrase: Let thy fountains be dispersed abroad
    kind: symbol
    title: Water from your own well
    body: |
      In verses 15–18 the father speaks in images of water, and verse 18 sets “thy fountain” beside “the wife of thy youth.” Water is “life-giving and vitally important for the well-being of a household.”

      Verse 16 is better read as a question, as modern translations print it: “Should your springs be scattered abroad, streams of water in the streets?” The answer is in the next line: “Let them be only thine own, and not strangers’ with thee” ([[Prov. 5:17]]). The passage can be read, in one Latter-day Saint study’s words, “as a general plea for faithfulness to family in building and providing for one’s household.”
    sources: [ot-minute-proverbs-1-9, nrsvue]

  - ref: 19
    phrase: be thou ravished always with her love
    kind: words
    title: Ravished, and led astray
    body: |
      “Ravished” renders the Hebrew *shagah*, to stray or reel, and so to be intoxicated, whether with wine ([[Prov. 20:1]]) or with love, as here and in verse 20; a modern translation reads “be intoxicated always in her love.”

      The father uses the verb three times. The son is to be carried away “always” by his wife’s love (5:19); why be carried away by a stranger (5:20)?; and the fool at the end “shall go astray” (5:23), the same verb, which one older reading calls “repeated purposely from Proverbs 5:20.” The same reading calls the delight of verse 19 “a morally permissible love-ecstasy,” an intensity of love “connected with the feeling of superabundant happiness.”
    sources: [bdb, esv, delitzsch-proverbs]

  - ref: 22
    phrase: he shall be holden with the cords of his sins
    kind: scripture
    title: The cords of his sins
    body: |
      The wicked man is caught by his own sins; no one else has to set the trap. Nephi uses a like image for how the devil works: “he leadeth them by the neck with a flaxen cord, until he bindeth them with his strong cords forever” ([[2 Ne. 26:22]]). A single thread of flax is “a very weak cord,” and a Latter-day Saint study reads the two passages together: if a person “does not repent and turn away from their sins, then Satan can twist or braid the individual ‘cords of sin’ (Proverbs 5:22) into ‘strong cords’ which bind down his victims ‘forever.’ Like a flax rope soaked in water, the knots become difficult—perhaps even impossible—to untie.”
    sources: [sc-knowhy-551]

christ: |
  The chapter ends with a man who cannot free himself: he is “holden with the cords of his sins” (5:22). Scripture names the One who can. “The LORD is righteous: he hath cut asunder the cords of the wicked” ([[Ps. 129:4]]), words a Latter-day Saint reading applies to “the power of his Atonement.” Alma knew those cords from the inside. Remembering his father’s words about Christ, he cried, “O Jesus, thou Son of God, have mercy on me, who am in the gall of bitterness, and am encircled about by the everlasting chains of death” ([[Alma 36:18]]), and his pain gave way to joy ([[Alma 36:19–20]]).

  The father’s counsel stands in modern revelation in plain form: “Thou shalt love thy wife with all thy heart, and shalt cleave unto her and none else” ([[D&C 42:22]]). And for a disciple already bound, the cords of verse 22 are not the last word: through Christ’s Atonement they can be cut, and in this life “it is never too late to repent.”

explore: |
  - The strange woman across the father’s lessons: [[Prov. 2:16–19]], [[Prov. 6:20–35]], and the story of [[Prov. 7]], with the two houses of Wisdom and Folly in [[Prov. 9]].
  - [[Alma 39]], Alma’s counsel to Corianton, which a Latter-day Saint study pairs line by line with this chapter (5:1 with Alma 39:2; 5:12–13 with Alma 39:1).
  - The cords and chains of sin in the Book of Mormon: [[Alma 12:11]], [[2 Ne. 1:13]].

