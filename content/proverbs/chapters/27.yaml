chapter: 27
title: Faithful Are the Wounds of a Friend
tagline: Sayings on boasting and praise, the friend who wounds and the enemy who kisses, the face in the water and the man tried by his praise, and a closing poem on the flock that outlasts the crown.
when: 'Copied out under Hezekiah'

setting: |
  Chapter 27 belongs to the second collection of Solomon's proverbs, the one headed “These are also proverbs of Solomon, which the men of Hezekiah king of Judah copied out” ([[Prov. 25:1]]), which runs until the words of Agur begin at [[Prov. 30:1]]; the note at 25:1 says who those men were. Like the chapters before it, this one is a string of separate sayings.

  Several have come before in the book. Verse 12 repeats [[Prov. 22:3]] almost word for word, and verse 13 repeats the surety's garment of [[Prov. 20:16]]. In one older reading verse 15 takes the saying of [[Prov. 19:13]], that a wife's contentions are “a continual dropping,” and “expanded” it into a full verse, and the first line of verse 21 repeats [[Prov. 17:3]], the fining pot for silver and the furnace for gold.

  The New Testament takes up the first saying. The Church's footnote at verse 1 points to James, who warns those who plan a year of trade that “ye know not what shall be on the morrow” ([[James 4:13–14]]). He does not forbid the plan; he tells them how to make it: “For that ye ought to say, If the Lord will, we shall live, and do this, or that” ([[James 4:15]]). The chapter ends with a short poem of five verses on tending the flock (verses 23–27).

thread: |
  This is a collection, not an argument, but the sayings come in small groups. In one older reading the first six verses go two by two, and “The first pair is directed against unseemly boasting”: do not boast of tomorrow, and let another praise you (verses 1–2). The same reading pairs the open rebuke of verse 5 with the friend's wounds of verse 6. What returns most in the chapter is the friend. He wounds faithfully (verse 6), counsels sweetly (verse 9), and is not to be forsaken, nor the friend of one's father (verse 10); he can be flattered so loudly that the blessing becomes a curse (verse 14), and he is sharpened as iron sharpens iron (verse 17). Praise, too, opens and nearly closes the chapter: a man should not praise himself (verse 2), and he is tried by the praise he receives (verse 21).

  The last five verses are a single poem, which the same older reading calls the conclusion of the series. Riches and the crown do not last (verse 24), but the flock and the field, looked after, clothe and feed a household.

sections:
  - range: 1-6
    heading: Boasting, anger and the honest friend
    plain: |
      Don't boast about tomorrow, for you don't know what a day will bring. Let someone else praise you, not your own mouth; a stranger, not your own lips. A stone is heavy and sand is a load, but a fool's anger is heavier than both. Wrath is cruel and anger overwhelming, but who can stand before jealousy? An open rebuke is better than love that is kept hidden. The wounds a friend gives can be trusted, but an enemy's kisses are many and false.
  - range: 7-10
    heading: Hunger, home and the near neighbor
    plain: |
      A man who has eaten his fill turns away from honey, but to a hungry man even bitter food is sweet. Like a bird that has strayed from its nest is a man who has strayed from his home. Ointment and perfume gladden the heart, and so does the sweetness of a friend's heartfelt counsel. Don't abandon your friend, or your father's friend; and in your day of trouble don't go to your brother's house: a neighbor close by is better than a brother far away (on the friend who is more than a brother, see [[Prov. 18:24]]).
  - range: 11-16
    heading: Sayings on several subjects
    plain: |
      Be wise, my son, and make my heart glad, so that I can answer the man who taunts me. The prudent man sees trouble coming and takes cover; the simple go on and pay for it (the saying of [[Prov. 22:3]]). Take the garment of the man who has stood surety for a stranger, and hold him to his pledge for a foreign woman (the saying of [[Prov. 20:16]]; surety is explained at [[Prov. 6:1]]). Whoever blesses his friend at the top of his voice, early in the morning, will have it counted as a curse. A steady dripping on a day of pouring rain and a quarrelsome wife are alike: to hold her back is to hold back the wind, or to grip oil in the right hand.
  - range: 17-22
    heading: One man and another
    plain: |
      As iron sharpens iron, so one man sharpens another. Whoever looks after a fig tree eats its fruit, and whoever looks after his master is honored. As a face is reflected in water, so a man's heart is answered in another man. The world of the dead and the place of destruction are never full (the two names are explained at [[Prov. 15:11]]), and neither are a man's eyes ever satisfied. The fining pot tests silver and the furnace gold, and a man is tested by the praise he receives. Pound a fool in a mortar with a pestle along with the grain, and his folly still will not leave him.
  - range: 23-27
    heading: The flock and the field
    plain: |
      Know well how your flocks are doing, and give your mind to your herds, for riches do not last forever, and the crown does not pass down to every generation. The hay comes up, the new grass shows itself, and the herbs of the mountains are gathered in. The lambs will give you clothing, and the goats will pay for a field. There will be goats' milk enough to feed you, to feed your household, and to keep your servant girls.

notes:
  - ref: 6
    phrase: Faithful are the wounds of a friend; but the kisses of an enemy are deceitful
    kind: words
    title: The wounds of a friend and the kisses of an enemy
    body: |
      “Faithful” means trustworthy: the friend's blows can be relied on because the friend means well, and a modern translation reads “Well meant are the wounds a friend inflicts.” The word behind “deceitful” is uncertain. One older reading weighs several meanings and settles on “to heap up”: the enemy's kisses “are too abundant, so much the more plentiful to veil over the hatred.” The modern translation has “profuse are the kisses of an enemy.” On the older reading and the modern one alike, the kisses are many, and they hide the hatred.

      The verse before makes the same contrast: “Open rebuke is better than secret love” (verse 5). In the older reading, it is better to be corrected openly “than to be the object of a love which may exist indeed in the heart, but which fails to make itself manifest in outward act.”
    sources: [nrsvue, delitzsch-proverbs, lds-scriptures]

  - ref: 14
    phrase: He that blesseth his friend with a loud voice, rising early in the morning
    kind: history
    title: A blessing too loud and too early
    body: |
      The man who shouts his good wishes to his friend at dawn is a flatterer, and in one older reading his blessing is counted a curse because its affected zeal is “a sign of a selfish, calculating, servile soul,” plain “before God and every one who can judge correctly of human nature.” The first line, that reading says, “is intentionally very heavy, in order to portray the empressement” (the eager show) “of the maker of compliments”: he calls out “with a loud voice, so as to make the impression of deep veneration,” but “in reality to gain favour thereby.” He gets up early “to offer his captatio benevolentiae” (his bid for goodwill) “as speedily as possible.”

      The Septuagint says it more simply: such a man “shall seem to differ nothing from one who curses him.” In the older reading the saying, set apart by three others, belongs with the sayings on friends in verses 9–10.
    sources: [delitzsch-proverbs, lxx-rahlfs]

  - ref: 16
    phrase: the ointment of his right hand, which bewrayeth itself
    kind: words
    title: Holding the wind, and oil in the hand
    body: |
      Verse 16 finishes the picture of the contentious wife in verse 15: whoever tries to hold her in is trying to hold the wind. “Bewray” is an old English word: “To disclose perfidiously; to betray; to show or make visible,” as when Peter was told “thy speech bewrayeth thee” ([[Matt. 26:73]]). In the King James, then, the ointment in a man's right hand makes itself known.

      The Hebrew of the line is hard, and a modern translation marks its “Meaning of Heb uncertain.” That translation reads, “to restrain her is to restrain the wind or to grasp oil in the right hand.” The Septuagint reads something else entirely: “The north wind is sharp, but it is called by name propitious.” On the modern translation's reading, she can no more be held in than the wind or a handful of oil. The Church's footnotes at verse 15 point to the same wife at [[Prov. 19:13]] and [[Prov. 21:19]].
    sources: [webster-1828, nrsvue, lxx-rahlfs, lds-scriptures]

  - ref: 17
    phrase: so a man sharpeneth the countenance of his friend
    kind: symbol
    title: Iron sharpens iron
    body: |
      As one iron blade puts an edge on another, so one man puts an edge on his friend. “Countenance” is the Hebrew's word “face,” and a modern translation renders the line “one person sharpens the wits of another,” with the note “Heb face.” The Septuagint keeps the face: “a man sharpens his friend's countenance.”
    sources: [nrsvue, lxx-rahlfs]

  - ref: 19
    phrase: As in water face answereth to face, so the heart of man to man
    kind: symbol
    title: A face in the water
    body: |
      A man who looks into still water sees his own face, and the proverb says that one heart finds itself in another in the same way. A modern translation reads it so: “Just as water reflects the face, so one human heart reflects another.”

      The Septuagint reads the opposite: “As faces are not like other faces, so neither are the thoughts of men.” The King James and the modern translation both say that hearts answer one another, as faces do in water.
    sources: [nrsvue, lxx-rahlfs]

  - ref: 21
    phrase: so is a man to his praise
    kind: words
    title: Tried by praise
    body: |
      The line is short in Hebrew, and a modern translation supplies the verb it leaves out: “so a person is tested by being praised,” with the note “Heb lacks is tested.” The first line is the line of [[Prov. 17:3]], “The fining pot is for silver, and the furnace for gold”; there the second line is “but the Lord trieth the hearts,” and here it is a man and his praise. The Septuagint makes praise the furnace: “a man is tried by the mouth of them that praise him.” On that reading praise is a trial, as fire is for silver and gold.
    sources: [nrsvue, lxx-rahlfs, lds-scriptures]

  - ref: 23
    phrase: Be thou diligent to know the state of thy flocks
    kind: history
    title: The flock outlasts the crown
    body: |
      Verses 23–27 are a short poem urging a man to look after his flocks, because the flock goes on providing when money and rank are gone. In one older reading it is “An exhortation to rural industry, and particularly to the careful tending of cattle for breeding,” and it forms “the conclusion of the foregoing series of proverbs.” “The state of thy flocks” is how they look, “the appearance which the sheep present; thus their condition as seen externally.” The “crown” of verse 24 is the mark of royal or princely rank, and the same reading gives the reason in another scholar's words: “ready money, moveable property, and on the other hand the highest positions of honour, are far more easily torn away from a man, and secure to him far less of quiet prosperity, than husbandry.”

      Verses 25–27 then show the farm at harvest: when the hay is in and the new grass has grown and the mountain herbs are gathered, the lambs give clothing, the goats can be sold for the price of a field, and there is milk for the whole household. In the older reading the herdsman with his barns full “is guaranteed against the future on all sides by his stock of cattle.”
    sources: [delitzsch-proverbs]

christ: |
  Verse 6 sets the friend's wounds against the enemy's kisses, and the Church's footnote at “kisses” points to the night Judas came with a kiss and Jesus asked him, “Judas, betrayest thou the Son of man with a kiss?” ([[Luke 22:48]]). The Savior received the enemy's kiss the proverb warns of, from one of the Twelve. The footnote at “wounds” points to the Lord's word in this dispensation on how a rebuke is given: “Reproving betimes with sharpness, when moved upon by the Holy Ghost; and then showing forth afterwards an increase of love toward him whom thou hast reproved, lest he esteem thee to be his enemy” ([[D&C 121:43]]).

  So a disciple who must correct a friend does it when the Spirit prompts and follows it with more love, not less, “That he may know that thy faithfulness is stronger than the cords of death” ([[D&C 121:44]]). That is the faithful wound of verse 6, given the Lord's way.

explore: |
  - **Friends who tell the truth.** [[Ps. 141:5]] and [[D&C 121:41–44]], beside verses 5–6; on friends in the book, [[Prov. 17:17]] and [[Prov. 18:24]].
  - **Planning and the Lord's will.** [[James 4:13–15]], beside verse 1, and the rich man of [[Luke 12:16–21]], which one older reading sets beside it.
  - **Shepherds who watch the flock.** [[Alma 5:37–60]], where the Church's footnote at verse 23 points.

