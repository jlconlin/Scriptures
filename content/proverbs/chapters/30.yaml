  - **God's pure word.** [[Deut. 4:2]] and [[Ps. 18:30]].
  - **Riches, poverty and forgetting God.** [[Deut. 8:10–18]], [[Matt. 6:11]], [[Hel. 12:1–2]] and [[Jacob 2:17–19]].
  - **Counting sayings.** [[Prov. 6:16–19]] and [[Amos 1:3–2:6]].

