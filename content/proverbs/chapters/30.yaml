chapter: 30
title: The Words of Agur
tagline: An otherwise unknown wise man confesses how little a man knows of God, holds to God's pure word, and prays for neither poverty nor riches; then he counts what he sees in the world, three things and then four.
when: 'The words of Agur'

setting: |
  Chapter 30 opens with a new heading, “The words of Agur the son of Jakeh” (verse 1). It is the first of two short collections that close the book after the proverbs Hezekiah's men copied out (chapters 25–29); the second is the words of king Lemuel ([[Prov. 31:1]]). The “words of Agur” (30:1–14) are among the book's “additional collections and units not directly attributed to Solomon”; with the words of Lemuel's mother, they hint at the book's “eclectic nature.” (On the book's headings and collections, see [[Prov. 1:1]].)

  The chapter is unlike the two-line sayings before it. It opens with a confession and a prayer (verses 1–9), and most of what follows is a string of counting sayings, “three things … yea, four” (on the form, see the note at verse 15): things that are never satisfied, ways too wonderful to know, things the earth cannot bear, small things that are wise, and things stately in their going. It closes with a counsel to keep silent (verses 32–33).

thread: |
  Agur begins by saying how little he knows. He calls himself more beast than man, without wisdom or “the knowledge of the holy” ([[Prov. 30:3]]), and asks the questions no man can answer: who has gone up to heaven and come down, who holds the wind and binds the waters, and what is his name. On one older reading this is not a doubter's speech but the confession of “one who is thirsting after God”: “the thought of a man does not penetrate to the essence of God.” The next two sayings turn from what a man cannot know to God's pure word (verses 5–6). Then comes his prayer, to be kept from lies and from both riches and want, since each can turn a man against God.

  The rest of the chapter looks at the world and counts. Some things are never satisfied; some ways are too wonderful to trace; some reversals the earth cannot bear; some small creatures are wiser than their size; some move in stately dignity. Sayings against those who curse father and mother are set among them (verses 11 and 17). On one older reading, the prayer's fear of profaning God's name leads into the two proverbs after it, which both begin with cursing (verses 10–11).

sections:
  - range: 1-4
    heading: Agur's confession
    plain: |
      These are the words of Agur son of Jakeh, a solemn utterance (or “of Massa”), spoken to Ithiel and Ucal; the Hebrew of verse 1 is uncertain (see the note). Agur confesses that he is more like a beast than a man, without a man's understanding; he has not learned wisdom, nor does he have the knowledge of the Holy One (on “the holy,” see [[Prov. 9:10]]). Who has gone up to heaven and come down? Who has gathered the wind in his fists, wrapped the waters in a garment, and set up all the ends of the earth? What is his name, and what is his son's name, if you know?
  - range: 5-9
    heading: The pure word, and a prayer
    plain: |
      Every word of God is pure, and He is a shield to those who trust in Him. Do not add to His words, or He will rebuke you and you will be shown a liar. Agur asks God for two things before he dies: keep falsehood and lies far from him, and give him neither poverty nor riches, only the bread that is his portion. Otherwise, being full, he might deny God and say, “Who is the LORD?” or, being poor, he might steal and profane the name of his God.
  - range: 10-17
    heading: Those who curse, and four that are never satisfied
    plain: |
      Do not slander a servant to his master, lest he curse you and you be found guilty. There is a kind of people that curses its father and does not bless its mother; a kind pure in its own eyes and yet not washed of its filth; a kind with lofty eyes and lifted eyelids; and a kind whose teeth are swords and knives, devouring the poor from the earth and the needy from among men. The leech has two daughters who cry, “Give, give.” Three things are never satisfied, four never say, “Enough”: the grave, the barren womb, the earth that never has water enough, and fire. The eye that mocks a father and scorns to obey a mother, the ravens of the valley will pick it out and the young eagles eat it.
  - range: 18-23
    heading: Four ways too wonderful, four things the earth cannot bear
    plain: |
      Three things are too wonderful for Agur, four he does not understand: the way of an eagle in the air, of a serpent on a rock, of a ship on the high sea, and of a man with a young woman. Such is the way of an adulterous woman: she eats, wipes her mouth, and says she has done no wrong (on these verses, see the note). Under three things the earth trembles, under four it cannot bear up: a servant who becomes king, a fool who has plenty to eat, a hated woman who gets a husband, and a maidservant who becomes heir to her mistress.
  - range: 24-31
    heading: Four small and wise, four stately in going
    plain: |
      Four things on the earth are small and yet very wise: the ants, a people without strength, who lay up their food in summer (on the ant, see [[Prov. 6:6]]); the conies, small rock animals, a feeble folk who make their homes in the rocks; the locusts, which have no king and yet go out together in ranks; and the lizard (the King James “spider”; see the note), which can be caught in the hand and is found in kings' palaces. Three things move with dignity, four are stately in their going: the lion, strongest of beasts, which turns back for nothing; the animal the King James calls a “greyhound” (the Hebrew is uncertain; perhaps “warhorse”); the he-goat; and a king whom no one can rise against.
  - range: 32-33
    heading: A hand upon the mouth
    plain: |
      If you have played the fool by exalting yourself, or have planned evil, put your hand over your mouth. For pressing milk brings out butter, pressing the nose brings out blood, and pressing anger brings out strife (on the wordplay, see the note).

notes:
  - ref: 1
    phrase: 'The words of Agur the son of Jakeh, even the prophecy'
    kind: history
    title: Agur the son of Jakeh
    body: |
      Agur is known only from this verse, and its first hard word is the one the King James renders “the prophecy.” That word is *massa*, the word that heads the prophets' oracles (“The burden of Babylon,” [[Isa. 13:1]]): an “utterance, oracle.” Modern translations print “An oracle” or “an inspired utterance.”

      But *Massa* is also the name of a son of Ishmael ([[Gen. 25:14]]); it is a “proper name, of a people and territory,” and at [[Prov. 31:1]], where the same word follows Lemuel's name, it stands for the “realm of king Lemuel.” On the older reading it is a name here too: “The words of Agur the son of Jakeh, of the tribe (the country) of Massa.” The modern translations take the word one way and the older reading the other.

      The rest of the verse is as uncertain. The King James takes Ithiel and Ucal as the men Agur speaks to. One modern translation, dividing the same Hebrew letters differently, reads “I am weary, God, but I can prevail”; another reads “I am weary, O God; I am weary, O God, and am wasting away,” and marks the Hebrew “uncertain.” The Septuagint, the old Greek translation, has no names at all: “These things says the man to them that trust in God.”
    sources: [delitzsch-proverbs, bdb, nrsvue, niv, lxx-rahlfs]
  - ref: 4
    phrase: 'what is his name, and what is his son’s name, if thou canst tell?'
    kind: scripture
    title: What is his son's name
    body: |
      Agur's questions name deeds no man has done (going up to heaven, holding the wind, binding the waters, setting the ends of the earth), and they show how far above any man the one who did them stands. On one older reading the garment that binds the waters is “a figure of the clouds which contain the upper waters,” and “if thou canst tell” sounds like the Lord's questions to Job, “when Jahve brings home to the consciousness of Job human weakness and ignorance”: “Who hath laid the measures thereof, if thou knowest?” ([[Job 38:5]]). That reading allows two ways of hearing the questions: as pointing to “a Being highly exalted above all creatures,” or as a challenge, “What man has the ability? - if there is one, then name him!” On either hearing, no man has done these things.

      The last question, “what is his son's name?”, gets no answer in the chapter. The Septuagint reads “what is the name of his children?”
    sources: [delitzsch-proverbs, lxx-rahlfs]
  - ref: 6
    phrase: Add thou not unto his words
    kind: scripture
    title: Add thou not unto his words
    body: |
      The warning not to add to God's words is close to the law's own: “Ye shall not add unto the word which I command you, neither shall ye diminish ought from it” ([[Deut. 4:2]]). On one older reading verse 6 depends on that warning and verse 5 on David's psalm, “the word of the LORD is tried: he is a buckler to all those that trust in him” ([[Ps. 18:30]]), so that “the self-testimony of God given to Israel, and recorded in the book of the Tôra, is here meant.” On that reading the two verses answer Agur's confession: “The more limited a man is in his knowledge of God … so much the more firmly has he to hold fast by the pure word of the divine revelation.” The one who adds to God's words, “either by an overstraining of them or by repressing them,” will be exposed as a liar.
    sources: [delitzsch-proverbs]
  - ref: 8
    phrase: give me neither poverty nor riches
    kind: scripture
    title: Neither poverty nor riches
    body: |
      Agur asks for the middle because each extreme has its own temptation, and verse 9 names both: the full man says, “Who is the LORD?” and the poor man steals and profanes God's name. A modern translation's cross-references set beside verse 9 the danger of fullness Moses warned of: “Lest when thou hast eaten and art full … Then thine heart be lifted up, and thou forget the LORD thy God” ([[Deut. 8:12–14]]).

      “Food convenient for me” is the bread of his portion, his allotted food (the footnote gives the Hebrew). A modern translation renders it “my daily bread,” and its cross-references point to the Lord's Prayer, “Give us this day our daily bread” ([[Matt. 6:11]]).
    sources: [niv, lds-scriptures]
  - ref: 15
    phrase: There are three things that are never satisfied, yea, four things say not, It is enough
    kind: structure
    title: Three things, yea, four
    body: |
      “Three things … yea, four” is a counting form of Hebrew poetry, and Agur uses it for most of the rest of the chapter. Biblical poets set numbers in two lines, “with the second line increasing the first number by one,” and “This exaggerated comparison heightens the sense of multitude, lending greater importance to the thing being described.” The form returns at verses 18, 21 and 29; at verses 7 and 24 Agur names a single number (“Two things,” “four things”) without the step. The same form names the six things, yea seven, that the LORD hates ([[Prov. 6:16]]).

      The leech (the King James “horseleach”) opens the list: its two daughters cry “Give, give,” and the four things named after it never say “It is enough.”
    sources: [parry-number-parallelism]
  - ref: 19
    phrase: the way of a man with a maid
    kind: symbol
    title: The way of a man with a maid
    body: |
      On one older reading the four “ways” of verse 19 are ways whose consequences leave no track, and the fourth, a man with a young woman, is the one the saying is about (“The turning-point lies in the fourth”); the other three are only foil to it. That reading takes the fourth way as a man's sexual union with a young woman, not “love unsought, suddenly taking possession of and captivating a man.”

      Verse 20 follows it: “Such is the way of an adulterous woman; she eateth, and wipeth her mouth, and saith, I have done no wickedness” ([[Prov. 30:20]]). On the same reading her eating “is just a figure,” like the bread eaten in secret at Folly's house ([[Prov. 9:17]]), and “the wiping of the mouth belongs to this figure.” On that reading verse 20 is an appendix to the saying, and it confirms what the four ways share: she too leaves no trace, wiping her mouth and saying she has done no wrong.
    sources: [delitzsch-proverbs]
  - ref: 28
    phrase: The spider taketh hold with her hands
    kind: words
    title: The spider or the lizard
    body: |
      Modern translations read the fourth of the small, wise creatures as a lizard, not a spider: “the lizard can be grasped in the hand, yet it is found in kings' palaces,” one with the footnote “Or spider.” Either way, the line's point is the same: a creature small enough to catch in the hand gets into the king's house.

      The same pattern runs through all four (verses 24–28): each line sets a weakness against a “yet.” The ants are “not strong, yet” lay up their food; the conies are “feeble,” yet live in the rocks; the locusts have “no king, yet” go out in bands (on the ant, see [[Prov. 6:6]]).
    sources: [nrsvue, niv]
  - ref: 33
    phrase: the wringing of the nose bringeth forth blood
    kind: words
    title: Pressing milk, nose and anger
    body: |
      Verse 33 is a play on words that the King James spreads over three English verbs. The Hebrew uses one word, *mits*, “squeezing, pressing, wringing,” three times, where the King James has “churning,” “wringing” and “forcing”; a modern translation keeps it: “as pressing milk produces curds and pressing the nose produces blood, so pressing anger produces strife.” The nouns play too. *'Aph*, “nose,” is also the Hebrew for anger, and “wrath” in the last line is another form of it, *'appayim*; the verse turns on the “play upon different meaning” of the two words. Squeeze a nose and it bleeds; squeeze anger, that is, keep up “pressure, insistence,” and a quarrel comes out.

      The verse gives the reason for the one before it: whoever has exalted himself or planned evil should put his hand over his mouth, because pressing on brings strife.
    sources: [oshb-wlc, bdb, nrsvue]

christ: |
  Agur asks, “Who hath ascended up into heaven, or descended?” and “what is his son's name” ([[Prov. 30:4]]). A modern translation's cross-references set beside it the Savior's words to Nicodemus: “no man hath ascended up to heaven, but he that came down from heaven, even the Son of man which is in heaven” ([[John 3:13]]). Set side by side, the question no man could answer reads as answered by the Son who came down from heaven.

  Agur confesses that he lacks “the knowledge of the holy” ([[Prov. 30:3]]), and then he turns to the word of God, which “is pure,” and to God, who “is a shield unto them that put their trust in him” ([[Prov. 30:5]]). A disciple who knows how little of God his own understanding can reach has the same word to hold to and the same shield to trust.

