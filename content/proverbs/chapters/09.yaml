chapter: 9
title: Two Banquets
tagline: Wisdom builds her house, sets her table and sends out the invitation; across the city Folly sits at her own door and calls the same passersby in the same words. Her guests are among the dead.
when: 'A father’s instruction, under Solomon’s name'

setting: |
  Chapter 9 closes the first division of Proverbs, the father's lectures that began at [[Prov. 1:8]]; it is “the conclusion to this introduction,” and the proverbs of Solomon begin at [[Prov. 10:1]]. One Latter-day Saint outline of these chapters as lectures and interludes (see chapter 6's setting, [[Prov. 6:1]]) makes the whole chapter the last interlude, “Two banquets.”

  The father does not speak here. Wisdom, who called in the streets at [[Prov. 1:20]] and spoke in chapter 8 of being with the LORD before the earth was made ([[Prov. 8:22]]), speaks for the last time, and then a second woman answers her: Folly (verse 13).

  It also brings the introduction back to where it began. The book's motto, “The fear of the LORD is the beginning of knowledge” ([[Prov. 1:7]]), returns at verse 10 with “wisdom” for “knowledge,” so that “Lady Wisdom finishes this section” with the words that opened it.

thread: |
  The chapter is a diptych, two panels hung side by side. In the first (verses 1–6), Wisdom has done everything a host can do: built the house, slaughtered the meat, mixed the wine, laid the table, and sent her servant girls out to the city. In the second (verses 13–18), Folly has done nothing but sit at her door. Yet both call from the heights of the city, and both use almost the same words: “Whoso is simple, let him turn in hither: as for him that wanteth understanding, she saith to him” (verses 4 and 16). They want the same guests, the simple, who could still go either way. What differs is why they want them: “Lady Folly calls to the simple because they are her prey, whereas Lady Wisdom calls to them because she wants to help them.”

  Between the panels stand sayings about who can be taught (verses 7–12), which one older reading hears as Wisdom's own words, explaining why she calls the simple. The scorner will not be taught, and correcting him only earns abuse; the wise man takes correction and loves the one who gives it. Among them stands the motto of the book, the fear of the LORD (verse 10). The section ends on the point the whole introduction has pressed: the choice is the hearer's own, and so are its results (verse 12).

  Then Folly speaks, and her offer is the shortest speech in the chapter: what is stolen tastes sweeter. The last line tells what the simple do not know when they turn in: her guests are already “in the depths of hell” (verse 18).

sections:
  - range: 1-6
    heading: Wisdom’s feast
    plain: |
      Wisdom has built her house and set up its seven pillars. She has slaughtered the meat, mixed the wine, and laid the table. She has sent out her serving girls, and she calls from the highest points of the city: “Whoever is inexperienced, come in here!” To anyone who lacks sense she says, “Come, eat my bread and drink the wine I have mixed. Leave the foolish behind, and live; walk in the way of understanding.”
  - range: 7-12
    heading: Whom wisdom can teach
    plain: |
      Whoever corrects a mocker gets insulted for it; whoever rebukes a wicked man gets hurt. Don't rebuke a mocker, or he will hate you; rebuke a wise man, and he will love you. Teach a wise man, and he will grow wiser; teach a righteous man, and he will learn more. Reverence for the LORD is where wisdom begins, and to know the Holy One is understanding. Through me your days will be many and years will be added to your life. If you are wise, the wisdom is your own gain; if you mock, you alone will carry the cost.
  - range: 13-18
    heading: Folly’s invitation
    plain: |
      The woman Folly is loud; she is simple and knows nothing. She sits at the door of her house, on a seat at the high points of the city, calling to people walking by who are going straight on their way: “Whoever is inexperienced, come in here!” To anyone who lacks sense she says, “Stolen water is sweet, and bread eaten in secret tastes good.” But he doesn't know that the shades of the dead are there, that her guests are down in the depths of Sheol.

notes:
  - ref: 1
    phrase: Wisdom hath builded her house, she hath hewn out her seven pillars
    kind: symbol
    title: Two women, two houses
    body: |
      Chapter 9 sets two women at the doors of two houses, and the reader is to choose which house to enter. The picture gathers up a theme that runs through the father's lectures, “the obligation for young people to build their own households with wisdom and provide for those households with wisdom.” Here Wisdom does it first: “In this scene, Wisdom has built her own house, has provided for it,” and only then asks the simple in. The other house, whose door leads down to the dead, was described at [[Prov. 2:18]], and its mistress appears at verse 13.

      The text does not say what the seven pillars stand for, and no reading of them is certain. One older reading takes them as “the seven virtues of her nature,” which “bear up and adorn the dwelling which she establishes among men,” and holds that an older interpretation still, “the seven gifts of the Holy Ghost” after [[Isa. 11:2]], “is on the right path.” One Latter-day Saint study reads the house as the temple (“the pillars point to the temple and to ritual”) and the slaughtered beasts as “cultic sacrifice,” with the table as the table of shewbread; that is its author's reading. The verb for killing the beasts in verse 2 is the ordinary word for slaughtering meat, not the word for sacrifice.
    sources: [ot-minute-proverbs-1-9, delitzsch-proverbs, von-feldt-instructional-wisdom]

  - ref: 3
    phrase: She hath sent forth her maidens
    kind: scripture
    title: Maidens sent through the city
    body: |
      Wisdom does not wait for her guests to find her: she sends her serving girls out and calls from the heights of the city herself. One Latter-day Saint study sets the scene beside the Savior's parable of the wedding feast ([[Matt. 22:1–14]]): she sends “maidens” to get the word out, “much like the king in the parable of the marriage of the king’s son sends servants to the highways.” What she offers “is not reserved for a cadre of claimants privileged by status or inheritance.” The same study goes further and reads the maidens “more plainly” as “angels and prophets”; that is its own reading.

      Folly takes the same high ground. She sits “on a seat in the high places of the city” (verse 14), calling “not unlike Wisdom.”
    sources: [von-feldt-instructional-wisdom]

  - ref: 5
    phrase: Come, eat of my bread, and drink of the wine which I have mingled
    kind: scripture
    title: An invitation like the prophets’
    body: |
      Wisdom's call to come and eat has its like in the invitations of later prophets. Her “mingled” wine is mixed wine, made ready for her guests: the verb is the one for mixing a drink, used here of Wisdom's wine.

      Isaiah's call to the thirsty to “buy wine and milk without money and without price” ([[Isa. 55:1]]) is set beside this verse in the note there. Jacob, in an invitation “much like Wisdom’s,” speaks to the Nephites in Isaiah's words: “Come, my brethren, every one that thirsteth, come ye to the waters; and he that hath no money, come buy and eat” ([[2 Ne. 9:50]]). Wisdom asks one thing of her guests, in the next line: “Forsake the foolish, and live” (verse 6).
    sources: [bdb, von-feldt-instructional-wisdom]

  - ref: 8
    phrase: Reprove not a scorner, lest he hate thee
    kind: structure
    title: Sayings between the banquets
    body: |
      Verses 7–12 interrupt the banquet with sayings about who can be taught. A modern translation heads them “General Maxims,” as though they stood apart. One older reading hears them as Wisdom's own words, showing “why Wisdom, turning from the wise, who already are hers, directs herself only to the simple”: she passes over the scorner “because she can there hope for no receptivity for her invitation,” and to press it on him would go against the Savior's command, “Give not that which is holy unto the dogs” ([[Matt. 7:6]]). The scorner is described at [[Prov. 1:22]].

      The wise man is the opposite case. Rebuke him “and he will love thee”; teach him and “he will increase in learning” (verses 8–9). The Church's footnote at verse 9 sets beside it the Savior's rule, “whosoever hath, to him shall be given, and he shall have more abundance” ([[Matt. 13:12]]).
    sources: [nrsvue, delitzsch-proverbs, lds-scriptures]

  - ref: 10
    phrase: the knowledge of the holy is understanding
    kind: words
    title: The Holy One
    body: |
      “The holy” in this line is God Himself, the Holy One. The Hebrew word, *qedoshim*, is plural in form; the King James reads “the holy,” and modern translations “the knowledge of the Holy One.” The plural is used of God, as one older reading explains, meaning “Him who is absolutely Holy,” as again in [[Prov. 30:3]], where the Church's footnote at this verse points. The Septuagint reads “the counsel of saints is understanding.”

      The first line is the book's motto from [[Prov. 1:7]] (explained there), returning at the end of the introduction (see the setting).
    sources: [oshb-wlc, nrsvue, delitzsch-proverbs, lds-scriptures, lxx-rahlfs]

  - ref: 13
    phrase: A foolish woman is clamorous
    kind: words
    title: The woman Folly
    body: |
      The second woman is Folly herself, drawn as Wisdom's opposite. The Hebrew names her *'eshet kesilut*, and a modern translation prints it “The woman Folly.” One Latter-day Saint study takes her as the strange woman of the earlier lectures ([[Prov. 2:16]]), the figure “most fully developed in Proverbs 9:13–18.”

      “Clamorous” is the word used of the adulteress in chapter 7, “She is loud and stubborn” ([[Prov. 7:11]]); in both verses it describes a “shameless woman.”
    sources: [oshb-wlc, esv, von-feldt-instructional-wisdom, bdb]

  - ref: 17
    phrase: Stolen waters are sweet, and bread eaten in secret is pleasant
    kind: symbol
    title: Stolen water
    body: |
      Folly offers stolen water and secret bread where Wisdom offered her own bread and mixed wine, and the appeal of her meal is that it is forbidden. The father has already used water for married love: the son is to “drink waters out of thine own cistern” ([[Prov. 5:15]]; see [[Prov. 5:16]]), “meaning that he should find sexual pleasure with his own wife.” Stolen water is then, in one older reading, intercourse “stolen from him who has a right thereto,” and bread eaten in secret is desire that, “because it is contrary to the law, must seek … concealment.” The Septuagint adds lines at the end of the chapter that say it outright: “abstain from strange water, and drink not of a strange fountain.”

      The verse grants that the stolen thing is sweet. The next verse says what the sweetness hides: the guests in her house are *rephaim*, the “shades” of the dead in Sheol (see [[Prov. 2:18]]).
    sources: [von-feldt-instructional-wisdom, delitzsch-proverbs, lxx-rahlfs, bdb]

christ: |
  One Latter-day Saint study reads Wisdom's feast (verses 1–5) beside the Lord's invitation in Alma, where “the tree of life and the bread and waters of life are matched”: “Come unto me and ye shall partake of the fruit of the tree of life; yea, ye shall eat and drink of the bread and the waters of life freely” ([[Alma 5:34]]). The invitation goes to everyone: “he sendeth an invitation unto all men, for the arms of mercy are extended towards them” ([[Alma 5:33]]).

  That invitation stands open to every person now, and as freely. Verse 12 makes the answer to it each person's own, “If thou be wise, thou shalt be wise for thyself,” and the Church's footnote there sets beside it Paul's word that “every man shall bear his own burden” ([[Gal. 6:5]]).

explore: |
  - **The wedding feast.** [[Matt. 22:1–14]] and [[Luke 14:15–24]], beside verses 1–6.
  - **Come and eat.** [[Isa. 55:1–3]], [[2 Ne. 9:50–51]] and [[Alma 5:33–35]].
  - **The two women of Proverbs 1–9.** [[Prov. 1:20–33]], [[Prov. 7:1–27]] and [[Prov. 8:1–36]], read before this chapter. The study “‘His Secret Is with the Righteous’: Instructional Wisdom in the Book of Mormon” (*Interpreter* 66, 2025) reads them beside the Book of Mormon.

