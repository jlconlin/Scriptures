chapter: 2
title: Seek Her as Silver
tagline: 'A father lays out the whole course of wisdom in one long “if … then”: search for wisdom as for buried silver, and the LORD will give it, and it will keep you from the evil man, from the strange woman, and on the path that leads to the land.'
when: 'A father’s instruction, under Solomon’s name'

setting: |
  Proverbs 2 is the second of the father’s lessons that open the book. A father speaks to “my son” (on the address, see [[Prov. 1:8]]), and chapters 1–9 have been read as “a series of ten lessons” set at the head of the book. This one has been called “a kind of prospectus of the ‘course’ in wisdom” that those lessons give, “since its several parts are later resumed as the subjects of separate discourses.”

  The chapter names no time, place or occasion. Its heading is the book’s (see [[Prov. 1:1]] for the collections and Solomon’s name). Wisdom is “her” in verse 4, as she is in chapter 1, where she calls in the streets (see [[Prov. 1:20]]). What wisdom is, and what “the fear of the LORD” means, are explained at [[Prov. 1:2]] and [[Prov. 1:7]].

  The Book of Mormon knows this chapter’s words. Abinadi’s rebuke of Noah’s priests and King Benjamin’s opening appeal both echo verse 2, and Alma’s charge to Helaman, that keeping the commandments brings prosperity in the land, has been set beside the promise of verses 21–22. The notes on verses 2 and 21 take them up.

thread: |
  The chapter is one long argument in the form “if … then.” Verses 1–4 are the conditions: if the son receives his father’s words, inclines his ear, cries out for understanding and searches for wisdom as for silver. Verses 5–11 give the result twice, each time opening with “Then”: he will understand the fear of the LORD (verse 5), and he will understand righteousness and “every good path” (verse 9). After that come the purposes. Wisdom will keep him from the evil man (verses 12–15) and from the strange woman (verses 16–19), “That thou mayest walk in the way of good men” (verse 20).

  What holds the argument together is the path. The LORD keeps “the paths of judgment” (verse 8), and wisdom shows “every good path” (verse 9). The evil men leave “the paths of uprightness” and are “froward in their paths” (verses 13, 15). The strange woman’s paths run “unto the dead,” and those who go to her never again “take hold of the paths of life” (verses 18–19). The son is to “keep the paths of the righteous” (verse 20). Proverbs dwells on the path because how a life is lived matters, not only where it arrives: “The journey is as important as the destination.” The chapter closes with the upright in the land and the wicked rooted out of it (on the two ways, see [[Prov. 4:18]]).

sections:
  - range: 1-4
    heading: If you search for wisdom
    plain: |
      My son, if you take in what I say and store up my commandments inside you, so that you turn your ear toward wisdom and set your heart on understanding; if you call out for insight and raise your voice for understanding; if you look for her as for silver and dig for her as for buried treasure:
  - range: 5-8
    heading: Then the LORD gives it
    plain: |
      then you will understand the fear of the LORD and find the knowledge of God. For it is the LORD who gives wisdom; knowledge and understanding come from His mouth. He stores up sound wisdom for the upright and is a shield to those whose walk is blameless. He guards the paths of justice and watches over the way of His saints.
  - range: 9-11
    heading: Then wisdom keeps you
    plain: |
      Then you will understand righteousness, justice and fairness, every good path. When wisdom comes into your heart and knowledge is pleasant to your soul, discretion will watch over you and understanding will guard you,
  - range: 12-15
    heading: From the evil man
    plain: |
      to rescue you from the way of evil, from men who speak perverse things, who leave the straight paths to walk in the ways of darkness, who enjoy doing wrong and delight in the perversity of evil, whose ways are crooked and whose paths are devious.
  - range: 16-19
    heading: From the strange woman
    plain: |
      It will rescue you from the strange woman, the outsider with smooth words, who has left the companion of her youth and forgotten the covenant of her God. Her house sinks down to death, and her tracks lead to the dead. No one who goes in to her comes back or reaches the paths of life again.
  - range: 20-22
    heading: On the way of the good
    plain: |
      So you will walk in the way of good men and keep to the paths of the righteous. For the upright will live in the land, and the blameless will remain in it; but the wicked will be cut off from the land, and the treacherous torn out of it.

notes:
  - ref: 2
    phrase: apply thine heart to understanding
    kind: scripture
    title: Ear and heart, in the Book of Mormon
    body: |
      Verse 2 asks for more than attention, and two Book of Mormon teachers used its words. In Hebrew thought the heart was the “closest equivalent to our concept of ‘mind,’” and to apply the heart “means to desire and choose something, not only pay attention”: the line asks for “an eager receptivity toward the teachings.” Proverbs uses the phrase as a teacher’s opening call, here and again where new lessons begin ([[Prov. 22:17]]; [[Prov. 23:12]]).

      Abinadi turned the saying against the priests of King Noah, who claimed to understand Isaiah: “Ye have not applied your hearts to understanding; therefore, ye have not been wise” ([[Mosiah 12:27]]). On this reading he “drew on a traditional saying about true wisdom” to show that their learning had missed what the saying requires. King Benjamin, drawing on the same wisdom tradition, opened his address by asking his people to “open your ears that ye may hear, and your hearts that ye may understand” ([[Mosiah 2:9]]): the ear and the heart of this verse, in the same order.
    sources: [sc-knowhy-644, sc-knowhy-308]

  - ref: 4
    phrase: If thou seekest her as silver, and searchest for her as for hid treasures
    kind: symbol
    title: Treasure sought and treasure laid up
    body: |
      The father pictures wisdom as buried wealth, worth the effort a man spends digging for silver. Wisdom, and with it the son’s relationship with the Lord, is so important that “we should search for it like we search for the earth’s most valuable objects.” The book returns to the measure: wisdom “is more precious than rubies” ([[Prov. 3:15]]), and at its close the woman of strength, read as “the earthly counterpart to Lady Wisdom,” has a price “far above rubies” ([[Prov. 31:10]]).

      The treasure lies on both sides of the search. “Hide” in verse 1 is the verb *tsafan*, to “treasure up” a thing “in thine own keeping”: the son is to store his father’s commandments like valuables. The same verb returns in verse 7 with the LORD as its subject, where it is used of blessings God holds in reserve: “He layeth up sound wisdom for the righteous” ([[Prov. 2:7]]). The son treasures the commandments; the LORD has treasure laid up for the one who keeps them.
    sources: [ot-minute-proverbs-1-9, bdb, oshb-wlc]

  - ref: 5
    phrase: Then shalt thou understand the fear of the LORD, and find the knowledge of God
    kind: structure
    title: The search ends with the LORD
    body: |
      The “Then” of verse 5 answers all the “if”s of verses 1–4, and what the searcher finds at the end of them can be understood as a relationship with God. The son set out after wisdom; he arrives at “the fear of the LORD” and “the knowledge of God,” two phrases used here “synonymously,” since “both terms can refer to a relationship with God” (for the fear of the LORD, see [[Prov. 1:7]]).

      Verse 6 gives the reason, and it reverses the picture of the search. The son had to cry out and dig, but “the LORD giveth wisdom” ([[Prov. 2:6]]). The one who strives after wisdom “reaches in this way fellowship with God; for just as He gives wisdom, it is nowhere else than with Him.” Wisdom comes “out of his mouth,” that is, “through the medium of His word.” Verses 7–8 then say who receives it: the upright, those who walk in integrity, “his saints.” The word is *hasid*, “a pious man, the godly” (explained at [[Ps. 4:3]]).
    sources: [delitzsch-proverbs, ot-minute-proverbs-1-9, bdb]

  - ref: 16
    phrase: the strange woman
    kind: words
    title: The strange woman
    body: |
      The two words for the “strange woman” mean an outsider, and in Proverbs both are used of a harlot. “Strange” is *zarah*, a word for what belongs to someone else, used here of the “strange woman, harlot.” “Stranger” is *nokriyyah*, which elsewhere means a foreigner, but in Proverbs is used “as technical term … for harlot (perhaps because harlots were originally chiefly foreigners).” Lady Wisdom is set against this “adulterous” strange woman.

      Verse 17 describes what she has broken: she “forsaketh the guide of her youth, and forgetteth the covenant of her God” ([[Prov. 2:17]]). “Guide” is *alluf*, a “friend, intimate,” here “of a woman’s husband.” Jeremiah gives the same title to the LORD as the husband of His people: “My father, thou art the guide of my youth” ([[Jer. 3:4]]). On one older reading this verse and Malachi’s “the wife of thy covenant” ([[Mal. 2:14]]) show “that the celebration of marriage was a religious act,” in which husband and wife “called God to witness and ratify the vows.” On a Latter-day Saint reading, that broken covenant is what makes her a stranger: she is one “because she has ‘forsaken the guide of her youth.’”
    sources: [bdb, scripture-helps-proverbs, ot-minute-proverbs-1-9, delitzsch-proverbs]

  - ref: 18
    phrase: her house inclineth unto death, and her paths unto the dead
    kind: symbol
    title: A house that slopes down to the dead
    body: |
      Her house and her paths both lead down to the underworld. “The dead” here is *rephaim*, the “shades, ghosts,” a name for the dead in the underworld that Proverbs uses again of Folly’s guests ([[Prov. 9:18]]) and of “the congregation of the dead” ([[Prov. 21:16]]). The Septuagint, the ancient Greek translation, read the line as a picture of her house set at the edge of the grave: “For she has fixed her house near death, and guided her wheels near Hades with the giants.”

      Both images are central to the book. Proverbs teaches a young man “how to live life,” which “takes the form of building a household and providing for it,” and it speaks of that life as a path; here “both metaphors, those of the household and the path, find expression.” Those who enter do not come back (verse 19). The same contrast returns in chapter 9, where Lady Folly, “represented by an adulterous woman,” keeps a house whose guests are among the dead (see [[Prov. 9:1]]).
    sources: [bdb, lxx-rahlfs, ot-minute-proverbs-1-9]

  - ref: 21
    phrase: the upright shall dwell in the land
    kind: scripture
    title: Dwelling in the land
    body: |
      The chapter ends with the father applying the covenant promise of the land to his son: the upright stay in it and the wicked are torn out of it. The father here states “the most basic covenant found in the Old Testament between God and his people, or between God and a person,” and the verbs for the wicked, “cut off” and “rooted out,” “suggest sharp and wrenching violence.” “Land” in verse 21 and “earth” in verse 22 are one Hebrew word, *erets*, as in Psalm 37 (see the note on [[Ps. 37:11]]).

      The Book of Mormon gives the same promise from father to son. Alma tells Helaman, “inasmuch as ye shall keep the commandments of God ye shall prosper in the land” ([[Alma 36:1]]), an instruction that has been read as reflecting both these verses and the Lord’s promise in [[1 Ne. 2:20]]. Alma also gives the other half: “inasmuch as ye will not keep the commandments of God ye shall be cut off from his presence” ([[Alma 36:30]]). Where Proverbs says “cut off from the earth,” Alma says cut off from God’s “presence,” and “in both cases they lose the blessings and gifts that come from God’s watchcare.” Whether such promises hold for every single life is taken up at [[Prov. 22:6]].
    sources: [allis-pike-words-wise, oshb-wlc, sc-knowhy-744]

christ: |
  The chapter’s search ends in a gift. The son who digs for wisdom “as silver” learns that “the LORD giveth wisdom” ([[Prov. 2:6]]), and in Christ “are hid all the treasures of wisdom and knowledge” ([[Col. 2:3]]).

  Verse 2’s call to “incline” the ear and “apply” the heart can be turned “to understand that Jesus Christ can bless and heal each of us.” Joseph Smith “took literally the biblical promise in James 1:5.” The wisdom of this chapter is the LORD’s to give, and He gives it to the one who seeks it with ear, heart and voice.

explore: |
  - **The strange woman in the later lessons.** [[Prov. 5:1–23]], [[Prov. 6:20–35]] and [[Prov. 7:1–27]].
  - **Wisdom worth more than rubies.** [[Prov. 3:13–18]] and [[Prov. 8:10–11]].
  - **Abinadi and the priests of Noah.** [[Mosiah 12:19–27]].
  - **Alma’s counsel to his sons beside the father’s.** [[Alma 36:1–3]] and [[Alma 37:35]].

