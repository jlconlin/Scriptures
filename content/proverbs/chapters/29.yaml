chapter: 29
title: Where There Is No Vision
tagline: The last chapter of the proverbs Hezekiah's men copied out. Rulers make a people rejoice or mourn, the one who will not be corrected is broken without remedy, and a people without revelation runs wild; the one who trusts in the LORD is safe.
when: 'Copied out under Hezekiah'

setting: |
  Chapter 29 closes the second collection of Solomon's proverbs, the sayings “which the men of Hezekiah king of Judah copied out” ([[Prov. 25:1]]; on that heading see the note there). After it come the words of Agur (chapter 30) and of Lemuel (chapter 31).

  It is made of separate sayings, almost all of two lines. One older reading finds the collector's seams: a series of six sayings opens at verse 4 with a saying about the king; verses 10–14 belong together; verse 15 “begins a group of proverbs regarding discipline in the house and among the people”; and a last group runs from verse 22 to the end of the collection. The sections below follow those seams. The same reading notes that in this collection the kingdom “is seen almost only (with exception of Proverbs 29:14) on its dark side,” and that the collection ends as it began, “with a proverb concerning the king” (verse 26) and one on the great contrast of the just and the wicked (verse 27).

thread: |
  Chapter 29 is a string of separate sayings, not an argument, but two subjects keep returning. One is the ruler. Whether the righteous or the wicked are in power decides whether a people rejoices or mourns (verse 2); a king's justice holds a land up and his greed pulls it down (verse 4); a ruler who listens to lies gets lying servants (verse 12); the king who judges the poor faithfully is the one whose throne lasts (verse 14). The last word on rulers puts them in their place: many seek the ruler's favour, but judgment comes from the LORD (verse 26).

  The other is correction. The chapter opens with the man who has been reproved again and again and stiffens his neck, and its second line is the warning of [[Prov. 6:15]]: he will be broken suddenly, “without remedy.” On one older reading, “The door of penitence, to which earnest, well-meant admonition calls a man, does not always remain open.” At verse 15 a group of sayings on correction begins: the rod joined with “reproof,” which that reading takes as “discipline by means of words,” the son who gives his parents rest, the servant whom words do not reach.

sections:
  - range: 1-3
    heading: The stiff neck, the ruler and the wise son
    plain: |
      A man who has been corrected many times and still stiffens his neck will be broken suddenly, beyond healing. When the righteous are in power the people rejoice, but when the wicked rule they groan. Whoever loves wisdom gladdens his father (a variation of [[Prov. 10:1]]), but the companion of harlots squanders his wealth.
  - range: 4-9
    heading: The king, the flatterer and the city
    plain: |
      A king makes the land stand firm by justice, but a man of exactions tears it down (see the note). Whoever flatters his neighbour spreads a net for his feet. The evil man's own wrongdoing is a snare to him, but the righteous man sings and rejoices. The righteous man knows what is due to the poor; the wicked man does not care to know it. Scoffers set a city in an uproar, but the wise turn anger away. When a wise man contends with a fool, whether the fool rages or laughs, there is no rest.
  - range: 10-14
    heading: The upright, the ruler and the poor
    plain: |
      Men of blood hate the blameless, and they seek the life of the upright (on the second line, see the note). A fool pours out all that is in him, but a wise man holds it back until later. If a ruler listens to lies, all his officials become wicked. The poor man and the oppressor meet, and the LORD gives light to the eyes of both. The king who judges the poor faithfully will have his throne established for ever (on the king in the proverbs, see [[Prov. 16:10]]).
  - range: 15-21
    heading: Discipline in the house and among the people
    plain: |
      The rod and correction give wisdom, but a child left to himself shames his mother (on the rod, see [[Prov. 13:24]]). When the wicked multiply, wrongdoing multiplies, but the righteous will see their fall. Correct your son, and he will give you rest and delight your soul. Where there is no revelation from God, the people throw off restraint; but happy is the one who keeps the law. A servant is not corrected by words: he understands, but does not respond. Do you see a man who is hasty with his words? There is more hope for a fool than for him. Whoever pampers his servant from childhood will in the end find him taking the place of a son (the last word is uncertain; see the note).
  - range: 22-27
    heading: Anger, pride and the fear of man
    plain: |
      An angry man stirs up strife, and a hot-tempered man does much wrong. A man's pride will bring him low, but the humble in spirit will gain honour (on pride and its fall, see [[Prov. 16:18]]). Whoever shares with a thief hates his own life: he hears the curse and does not tell what he knows (see the note). Fear of men lays a snare, but whoever trusts in the LORD will be kept safe (on trust in the LORD, see [[Prov. 3:5]]). Many seek the ruler's favour, but a man's justice comes from the LORD. The unjust man is an abomination to the just, and the one whose way is upright is an abomination to the wicked.

notes:
  - ref: 2
    phrase: 'but when the wicked beareth rule, the people mourn'
    kind: scripture
    title: When the wicked rule
    body: |
      Who holds power decides whether a people rejoices or groans, and latter-day revelation repeats the second line and draws a duty from it.

      The Lord takes up the saying in the Doctrine and Covenants: “Nevertheless, when the wicked rule the people mourn” ([[D&C 98:9]]). He goes on to what follows from it: “Wherefore, honest men and wise men should be sought for diligently, and good men and wise men ye should observe to uphold; otherwise whatsoever is less than these cometh of evil” ([[D&C 98:10]]). What the proverb observes, the revelation turns into counsel to those who choose their rulers.
    sources: [lds-scriptures]
  - ref: 4
    phrase: he that receiveth gifts overthroweth it
    kind: words
    title: Gifts or exactions
    body: |
      The man who “receiveth gifts” is most likely a ruler who demands payments of his people rather than one who takes bribes. The Hebrew calls him a man of *terumot*, a word for something “lifted off, separated”: mostly the contributions set apart for the sanctuary and the priests, and in Ezekiel the contribution paid to the prince ([[Ezek. 45:13–16]]). The standard lexicon takes the phrase here as “a man of contributions, i.e. demanding them, = man of exactions,” and a modern translation reads “one who makes heavy exactions ruins it.”

      The saying then sets a king who makes the land stand by justice beside one who tears it down by what he takes from it. A reader who takes the line of bribes will find the book's sayings on gifts at [[Prov. 17:8]].
    sources: [bdb, nrsvue]
  - ref: 10
    phrase: but the just seek his soul
    kind: words
    title: Who seeks whose life
    body: |
      The bloodthirsty, not the upright, are most likely the ones who seek a life in this saying; the King James wording leaves that unclear. To “seek the soul” of someone is the Bible's ordinary phrase for trying to kill him: the standard lexicon gives it as “seek to take one's life” and lists this verse beside others such as [[1 Sam. 20:1]] and [[1 Kgs. 19:10]]. The upright of the second line are the ones whose life is sought, and modern translations read it so: “they seek the life of the upright,” or “seek to kill the upright.”
    sources: [bdb, nrsvue, niv]
  - ref: 13
    phrase: The poor and the deceitful man meet together
    kind: scripture
    title: The poor man and the oppressor
    body: |
      The poor man and the man who preys on him live under the same God, who gives them both their life. The saying is, on one older reading, a variation of an earlier one, “The rich and poor meet together: the LORD is the maker of them all” ([[Prov. 22:2]]), and is read by it. The King James “deceitful man” stands for a Hebrew phrase that reading takes as “a man who makes oppressive taxes, high previous payments of interest”; modern translations print “the oppressor.”

      “The LORD lighteneth both their eyes” is the language of life itself, as in the psalm: “lighten mine eyes, lest I sleep the sleep of death” ([[Ps. 13:3]]). On the same reading, both “owe the light of life … to God,” and so both “stand under His control, and have to give to Him an account.” The oppressor's eyes are lit by the same Lord as his victim's, and he will answer to Him.
    sources: [delitzsch-proverbs, nrsvue, lds-scriptures]
  - ref: 18
    phrase: 'Where there is no vision, the people perish'
    kind: words
    title: Where there is no vision
    body: |
      The “vision” of this verse is revelation from God, and the people do not so much die without it as run wild. The word is *chazon*, the word for a prophet's vision, “divine communication in a vision, oracle, prophecy”; it is the word in [[1 Sam. 3:1]], “the word of the Lord was precious in those days; there was no open vision.” Modern translations read “Where there is no prophecy” or “Where there is no revelation.” The verb rendered “perish” means to let loose, to “remove restraint”; it is the word used of Israel at the golden calf, when “the people were naked” ([[Ex. 32:25]]), which one older reading takes as “disorderly.” Hence a modern translation's “the people cast off restraint.”

      On one older reading, “a people is in a dissolute condition when the voice of the preacher, speaking from divine revelation, … is silent amongst them,” as in Amos's “famine … of hearing the words of the LORD” ([[Amos 8:11]]). The “law” of the second line is then “divine teaching, the word of God,” whether given at Sinai or through the prophets. The two lines together say that a people needs both the living voice of revelation and the keeping of what has been revealed.

      One Latter-day Saint reading ties revelation to obedience: because “the word ‘vision’ could also be translated as ‘revelation,’” the verse implies “that revelation constitutes a portion of the promised blessings for keeping the commandments.”
    sources: [bdb, nrsvue, niv, delitzsch-proverbs, sc-knowhy-367, lds-scriptures]
  - ref: 21
    phrase: shall have him become his son at the length
    kind: words
    title: A pampered servant
    body: |
      What the pampered servant becomes “at the length” is uncertain, because the saying's last word, *manon*, occurs only here. The first verb is clear: it means to “indulge, pamper.” The standard lexicon marks the last word “dubious” and lists the guesses: a “thankless one”; one older reading's “father of numerous progeny”; or the word read as *madon*, “strife.”

      Modern translations guess from the context: “will come to a bad end,” with a note that the meaning of the Hebrew is uncertain, or “will turn out to be insolent.”
    sources: [bdb, nrsvue, niv]
  - ref: 24
    phrase: he heareth cursing, and bewrayeth it not
    kind: history
    title: He heareth cursing
    body: |
      The “cursing” may be the oath laid on witnesses, which the thief's partner hears and then keeps silent; the Hebrew is uncertain. If so, the law behind the saying is in Leviticus: “if a soul sin, and hear the voice of swearing, and is a witness, whether he hath seen or known of it; if he do not utter it, then he shall bear his iniquity” ([[Lev. 5:1]]). One modern translation, which points to that verse, reads “they are put under oath and dare not testify”; another takes the curse as the victim's and marks the Hebrew uncertain. “Bewray,” already “nearly antiquated” in 1828, means “To disclose perfidiously; to betray”: the partner does not tell what he knows.
    sources: [lds-scriptures, niv, nrsvue, webster-1828]
  - ref: 25
    phrase: The fear of man bringeth a snare
    kind: prophets
    title: The fear of man
    body: |
      The “fear of man” is the pull to please people before God, and the proverb says it traps the one who gives way to it. In general conference it has been described as the great commandments turned upside down: “Trying to please others before pleasing God is inverting the first and second great commandments,” and “when this fear of men tempts us to condone sin, it becomes a ‘snare’ according to the book of Proverbs.” The same talk finds the snare in the scriptures' own stories, among them King Saul, who kept the spoils because he “feared the people, and obeyed their voice” ([[1 Sam. 15:24]]).

      The proverb's second line sets the other trust beside it: the one who trusts in the LORD “shall be safe” (on trust in the LORD, see [[Prov. 3:5]]).
    sources: [robbins-which-way]

christ: |
  The Church's footnote at verse 25 sends the reader to the rulers in Jerusalem who “believed on him; but because of the Pharisees they did not confess him, lest they should be put out of the synagogue: For they loved the praise of men more than the praise of God” ([[John 12:42–43]]). In this dispensation the Lord rebuked Joseph Smith after the lost manuscript, “you should not have feared man more than God,” and told him that had he been faithful the Lord “would have extended his arm and supported you against all the fiery darts of the adversary; and he would have been with you in every time of trouble” ([[D&C 3:7–8]]).

  The snare of verse 25 is the pull to please others before God. A disciple meets it wherever the praise of men and the praise of God point different ways, and the proverb and the Lord's word to Joseph both place safety with the Lord, not with the people.

