chapter: 7
title: The Way to Her House
tagline: The father tells what he saw from his window one dark night, a young man with no sense walking to the strange woman's corner, and what she said to him. He went after her like an ox to the slaughter. Her house is the way to hell.
when: 'A father’s instruction, under Solomon’s name'

setting: |
  Chapter 7 is the last of the father's lectures on the strange woman, after [[Prov. 2:16–22]], [[Prov. 5:1–13]] and [[Prov. 6:20–35]]. Proverbs 1–9 can be read as ten instructions, or lectures, with this chapter the tenth, “Beware the seductress.” [[Prov. 2:16]] identifies her as another man's wife who has left the covenant of her God; this chapter shows her at work.

  It does so by telling a story. After the familiar opening appeal (verses 1–5), the father gives “an account of witnessing a young man succumb to the ‘strange woman’ (verses 6–23),” with her invitation in her own words, and closes with the warning the story was told for (verses 24–27).

  Chapter 8 answers it (see [[Prov. 8:1–3]]).

thread: |
  The father opens as he has before: keep my words, bind them on your fingers, write them on your heart (verses 1–3; on binding and writing them, see [[Prov. 3:3]]), and take Wisdom as a sister, so that she will keep you from the woman who flatters (verses 4–5). Then he shows why by telling what he saw.

  The story moves step by step toward a trap. The young man is “void of understanding” (verse 7), and he walks of his own accord toward her corner while the evening deepens into black night (verses 8–9). She comes out to meet him dressed for the part, takes hold of him, kisses him, and talks: of the sacrifice she has just offered, the bed she has made ready, the husband who is far away and will not be back until “the day appointed” (verses 13–20). The story gives her many words and the young man none. He yields to her “much fair speech” and goes after her “straightway,” like an ox to the slaughter or a bird into a snare, “and knoweth not that it is for his life” (verses 21–23).

  Then the father turns from the story to his children (verse 24). The house she has painted as a place of feasting and love is “the way to hell” (verse 27). Where a young man's life leads is the concern of all these lectures: “The importance of this young man’s being able to build a house and a household that will endure is constantly emphasized in Proverbs 1–9.”

sections:
  - range: 1-5
    heading: Wisdom your sister
    plain: |
      My son, keep my words and store up my commandments. Keep my commandments and live; guard my teaching as you guard the pupil of your eye. Tie them on your fingers; write them on your heart. Call wisdom your sister and understanding your close kin, so that they will keep you from the strange woman, the stranger with her flattering words.
  - range: 6-9
    heading: From the window
    plain: |
      I was at the window of my house, looking out through the lattice, and among the simple young men I noticed one who had no sense. He was walking down the street near her corner, taking the road to her house, at dusk, as evening came on, in the black middle of the night.
  - range: 10-12
    heading: She comes out to meet him
    plain: |
      And there a woman came out to meet him, dressed like a harlot, and wily of heart. She is loud and stubborn; she never stays at home. Now she is outside, now in the streets, lying in wait at every corner.
  - range: 13-20
    heading: Her invitation
    plain: |
      She took hold of him and kissed him, and with a brazen face she said: “I had peace offerings to make, and today I paid my vows. That is why I came out to meet you. I was looking for you, and I have found you.” She describes the bed she has spread with fine Egyptian linen and perfumed with myrrh, aloes and cinnamon, and invites him to spend the night with her. “My husband is not at home; he has gone on a long journey. He took the bag of money with him, and he will not be home until the full moon.”
  - range: 21-23
    heading: Like an ox to the slaughter
    plain: |
      With all her persuasion she won him over; with her smooth talk she swept him along. He follows her at once, like an ox going to the slaughter, like a fool to the fetters, until an arrow pierces his liver; like a bird rushing into a snare, not knowing it will cost him his life.
  - range: 24-27
    heading: The way to hell
    plain: |
      So now, children, listen to me and pay attention to what I say. Don't let your heart turn aside to her ways; don't wander into her paths. She has brought down many victims, and strong men without number have been killed by her. Her house is the road to the grave, going down to the rooms of death (on Sheol, the place of the dead, see [[Prov. 5:5]]).

notes:
  - ref: 2
    phrase: my law as the apple of thine eye
    kind: words
    title: 'The apple of the eye: its pupil'
    body: |
      The “apple” of the eye is its pupil, and the father asks the son to guard his teaching as he would guard his own eyes. The Hebrew word, *'ishon*, is literally a “little man” of the eye. It means the “pupil of eye,” and in the three places the Bible uses it of the eye ([[Deut. 32:10]]; [[Ps. 17:8]]; and here) it is a “simile of preciousness.” The Septuagint, the ancient Greek translation, reads “as the pupils of thine eyes.” “We instinctively protect our eyes, and our commitment to wise instruction should be just as instinctive.”

      The same word returns in verse 9. The “black” of “the black and dark night” is *'ishon* again, there meaning the “middle, midst of night”: the young man goes out in the very center of the dark.
    sources: [oshb-wlc, nrsvue, bdb, lxx-rahlfs, ot-minute-proverbs-1-9]

  - ref: 4
    phrase: Say unto wisdom, Thou art my sister
    kind: symbol
    title: Wisdom as a sister
    body: |
      The son is to make Wisdom as close to him as family, and “sister” can be read in two ways. In one reading the son “is encouraged to marry Lady Wisdom,” since “The term ‘sister’ can be used to refer to a spouse,” as in the Song of Solomon, where the lover calls his bride “my sister, my spouse” ([[Song 4:9]]). In the other, sister and kinswoman mean what they say: “A wise son looks to benevolent female relatives, a sister or kinswoman as sources of wisdom and understanding. They are family, are familiar, and are not sexualized.”

      The closeness has a purpose: it is to “keep thee from the strange woman” (verse 5). Protection from her comes “by keeping the commandments and embracing Wisdom as one’s friend and intimate.”
    sources: [ot-minute-proverbs-1-9, allis-pike-words-wise, von-feldt-instructional-wisdom]

  - ref: 6
    phrase: at the window of my house I looked through my casement
    kind: history
    title: The father at the lattice
    body: |
      The father tells this story as an eyewitness, looking out from his own window.

      The Septuagint tells it differently. There the woman is the one at the window: “For she looks from a window out of her house into the streets,” watching for a young man void of understanding. In the Hebrew, which the King James Version follows, the watcher is the father, and the story is a warning from someone who saw it happen.
    sources: [lxx-rahlfs]

  - ref: 10
    phrase: there met him a woman with the attire of an harlot, and subtil of heart
    kind: scripture
    title: Isabel and Corianton
    body: |
      The Book of Mormon tells a story like this one, of Alma's son Corianton and the harlot Isabel. The woman of verse 10 is dressed as a harlot; in the father's lecture “foolishness is personified” in her. Corianton “did go over into the land of Siron among the borders of the Lamanites, after the harlot Isabel” ([[Alma 39:3]]), and “Corianton is a prime example of a man ensnared by Woman Folly as described in detail by the father in Proverbs.” The warnings match as well. The father's “Let not thine heart decline to her ways” (verse 25) stands beside Alma's “suffer not the devil to lead away your heart again after those wicked harlots” ([[Alma 39:11]]).

      Alma holds his son responsible. Isabel “did steal away the hearts of many,” but Alma tells his son that “this was no excuse for thee” ([[Alma 39:4]]): “Corianton is responsible for his own downfall.” (On why the danger is drawn as a woman, and a caution against reading it as a judgment on women, see [[Prov. 5:3]].)
    sources: [sc-knowhy-744, allis-pike-words-wise]

  - ref: 14
    phrase: I have peace offerings with me; this day have I payed my vows
    kind: history
    title: A sacrifice that left meat for a feast
    body: |
      Her talk of sacrifice, on one older reading, tells the young man that there is meat for a feast at her house. The peace offering was the sacrifice the worshipper shared in: “only one part of the flesh of the sacrifice was Jahve's, consumed by fire”; “the priests received one part; those who brought the offering received back another part as it were from the altar of God, that they might eat it with holy joy along with their household.” The law set a time limit on that meal. An offering made for a vow “shall be eaten the same day that he offereth his sacrifice: and on the morrow also the remainder of it shall be eaten” ([[Lev. 7:16]]).

      “This day have I payed my vows” then means there is meat to eat tonight, and “the prospect of the gay festival which she can prepare for him” is what she gives as her reason for coming out to meet him (verse 15). The holy meal has become her invitation: where the law sanctions a feast, worldliness “can conceal itself behind the mask of piety.”
    sources: [delitzsch-proverbs, lds-scriptures]

  - ref: 19
    phrase: For the goodman is not at home
    kind: history
    title: Away until the full moon
    body: |
      She assures the young man that there is nothing to fear. “Goodman” is an old English word, “A familiar appellation of a husband; also, the master of a family.” In Hebrew she says only “the man” (*ha-'ish*), and one older reading notices that she does not say “my husband” but “speaks of him as one standing at a distance from her.”

      He has gone far; he has taken a bag of money with him; and he will come home “at the day appointed,” which a modern translation renders “at full moon he will come home.” On that older reading, the word means the full moon, which would set the night of the story at the new moon, “when the night is without moonlight.”
    sources: [delitzsch-proverbs, webster-1828, oshb-wlc, esv]

  - ref: 22
    phrase: as an ox goeth to the slaughter, or as a fool to the correction of the stocks
    kind: words
    title: An ox, a fool in fetters, a bird
    body: |
      The second image of verse 22 is obscure in the Hebrew, and the translations differ. The word the King James Version renders “stocks,” *'ekes*, means elsewhere an “anklet, bangle,” one of the ornaments of [[Isa. 3:18]]. A modern translation, comparing the Greek, reads the line as another animal: the young man “bounds like a stag toward the trap,” “until an arrow pierces its entrails,” and notes, “Meaning of Heb uncertain.” The Septuagint has “as a dog to bonds, or as a hart shot in the liver with an arrow.”

      Whatever the middle line meant, the verse sets it between the ox that goes “to the slaughter” and the bird that “hasteth to the snare, and knoweth not that it is for his life” (verse 23).
    sources: [oshb-wlc, bdb, nrsvue, lxx-rahlfs]

christ: |
  The father's story ends at the door of death; the story of Corianton does not. Alma's counsel to Corianton, who went “after the harlot Isabel” ([[Alma 39:3]]), has been read through this chapter (see the note at verse 10), and Alma did not stop at the warning. “I would that ye should repent and forsake your sins, and go no more after the lusts of your eyes,” he told his son ([[Alma 39:9]]), and he turned to Christ: “it is he that surely shall come to take away the sins of the world” ([[Alma 39:15]]). Corianton was sent back to “declare the word with truth and soberness, that thou mayest bring souls unto repentance” ([[Alma 42:31]]), and he is named among those by whom the word was declared in a time of “continual peace” ([[Alma 49:30]]).

  The father looks to the heart for protection: his words are to be written “upon the table of thine heart” (verse 3), and the heart is not to “decline to her ways” (verse 25). A disciple who has already gone down that road is still within reach of the Savior, who came to take away the sins of the world, and can be called again, as Corianton was, to the work of God.

explore: |
  - **Corianton.** [[Alma 39:1–19]] and [[Alma 42:29–31]], with the study “Words from the Wise,” which reads Alma's counsel to his sons beside these chapters.
  - **The two women.** Wisdom calling in public in [[Prov. 8:1–3]], and Folly at her door in [[Prov. 9:13–18]].
  - **The apple of the eye.** [[Deut. 32:10]] and [[Ps. 17:8]].
  - **Written on the heart.** [[Deut. 6:6–8]] and [[Jer. 31:33]].

