chapter: 11
title: A Just Weight Is His Delight
tagline: Thirty-one separate sayings, most of them setting the upright beside the wicked. Honest scales, a guarded tongue, open hands with grain and money, and a closing line whose Greek form Peter's letter carries to suffering Saints.
when: 'The proverbs of Solomon'

setting: |
  Chapter 11 is the second chapter of the collection headed “The proverbs of Solomon” ([[Prov. 10:1]]–[[Prov. 22:16]]). Chapter 10's setting explains the collection and how its two-line sayings are read, one saying at a time.

  Most of these sayings say that the upright are delivered and the wicked fall; how far such a saying is a promise is taken up at [[Prov. 22:6]].

  The last verse reaches the New Testament: the words of [[1 Pet. 4:18]] are, nearly word for word, the Greek translation of it.

thread: |
  This is a chapter of separate sayings. What returns, line after line, is a contrast. The upright, the righteous, the merciful and the liberal are set against the wicked, the transgressors, the cruel and the one who “withholdeth.” Verses 3–8, six sayings in a row, set the deliverance of the upright beside the downfall of the wicked. Verse 18 puts the same thing in the language of sowing and reward. The chapter ends with the largest form of it: if even the righteous are repaid on earth, how much more the wicked (verse 31).

  Two other subjects return in small clusters. Verses 9–13 are about the mouth and the neighbor: the hypocrite who destroys with his mouth, the city overthrown by the mouth of the wicked, the man who despises his neighbor, and the talebearer, set against the one who “holdeth his peace” and “concealeth the matter.” Verses 24–26 and 28 are about money and grain: the one who scatters and grows richer, the generous soul who is made fat, the hoarder whom the people curse, and the one who trusts in riches and falls. The chapter opens with the scales of the market (verse 1) and keeps coming back to what a person does with what he has. These sayings are the two ways of chapters 1–9 ([[Prov. 4:18]]) turned into single lines.

sections:
  - range: 1-8
    heading: Honest scales, and integrity that delivers
    plain: |
      Rigged scales the LORD detests, but an honest weight pleases Him (on false balances, see [[Amos 8:5]]; on “abomination,” [[Prov. 3:32]]). When pride comes, disgrace follows, but wisdom is with the humble. Integrity guides the upright, but the crookedness of the treacherous ruins them. Wealth is no help on the day of wrath, but righteousness saves from death (the second line is [[Prov. 10:2]]'s). The righteousness of the blameless keeps his road straight, but the wicked man falls by his own wickedness. The righteousness of the upright rescues them, but the treacherous are caught by their own craving. When a wicked man dies, what he hoped for dies with him; the hope of the wicked comes to nothing. The righteous man is rescued from trouble, and the wicked man falls into it in his place.
  - range: 9-14
    heading: The mouth, the neighbor and the city
    plain: |
      With his mouth the godless man ruins his neighbor, but the righteous are rescued by knowledge. When the righteous prosper, the city rejoices, and when the wicked perish, there are shouts of joy. The blessing of the upright lifts a city up; the mouth of the wicked tears it down. A man without sense looks down on his neighbor, but a man of understanding keeps quiet. A gossip gives away secrets, but a trustworthy man keeps a matter to himself. Without counsel a people falls, but with many counselors it is safe.
  - range: 15-23
    heading: What each one reaps, and other sayings
    plain: |
      Whoever stands surety for a stranger will suffer for it, and whoever refuses to pledge himself is secure (on surety, see [[Prov. 6:1]]). A gracious woman holds on to honor, and ruthless men hold on to wealth. The kind man does good to himself, but the cruel man harms his own body. The wicked man earns wages that deceive him, but whoever sows righteousness has a sure reward. As righteousness leads to life, so whoever chases evil chases his own death. The LORD detests those whose hearts are crooked, but He delights in those whose way is blameless. However the wicked join hands, they will not go unpunished, but the descendants of the righteous will escape. A beautiful woman without good judgment is like a gold ring in a pig's snout. The righteous desire only what is good; what the wicked expect is wrath.
  - range: 24-31
    heading: Open hands and closed hands
    plain: |
      One man gives freely and still grows richer; another holds back more than is right and ends in want. The generous soul will be made prosperous, and whoever gives water will himself be watered. The people curse the one who hoards grain, but blessing rests on the head of the one who sells it. Whoever earnestly seeks good finds favor, but whoever looks for trouble will find it coming to him. Whoever trusts in his riches will fall, but the righteous will flourish like a green leaf. Whoever brings trouble on his own household will inherit only wind, and the fool will be servant to the wise. The fruit of the righteous is a tree of life, and the wise man wins souls. If the righteous are repaid on the earth, how much more the wicked and the sinner.

notes:
  - ref: 14
    phrase: 'in the multitude of counsellors there is safety'
    kind: prophets
    title: Counsellors in a presidency
    body: |
      President Gordon B. Hinckley applied this verse to the counselors in the Church's presidencies, in a general conference address that takes it as its title. “A counselor is a partner,” he said. “Such a partnership provides a safety valve. The wise writer of Proverbs tells us that ‘in … counsellors there is safety’ (Prov. 11:14). When problems arise, when difficult decisions face us, it is wonderful to have those with whom we can talk with confidence and trust.”

      In the proverb itself the saying is about a people: “Where no counsel is, the people fall.” A later saying applies the same line to war: “by wise counsel thou shalt make thy war: and in multitude of counsellors there is safety” ([[Prov. 24:6]]).
    sources: [hinckley-counsellors, lds-scriptures]

  - ref: 16
    phrase: 'A gracious woman retaineth honour: and strong men retain riches'
    kind: words
    title: A gracious woman, and ruthless men
    body: |
      The “strong men” of the second line are *ʿārîṣîm*, a word for the “awe-inspiring, terror-striking,” used in late Hebrew “of wicked in general, as ruthless.” A modern translation renders them “the aggressive.” So the saying is a contrast between a gracious woman and men of force. Both hold on to something: she to honor, they to riches.

      The Greek translation has four lines here instead of two: “A gracious wife brings glory to her husband: but a woman hating righteousness is a theme of dishonour. The slothful come to want: but the diligent support themselves with wealth.” The modern translation just cited prints four lines as well, taking the two the Hebrew lacks from the Greek (“A gracious woman gets honor, but she who hates virtue is covered with shame. The timid become destitute, but the aggressive gain riches”). The King James follows the Hebrew's two.
    sources: [oshb-wlc, bdb, nrsvue, lxx-rahlfs]

  - ref: 22
    phrase: 'As a jewel of gold in a swine’s snout'
    kind: symbol
    title: A gold ring in a pig’s snout
    body: |
      The “jewel” is a nose ring, a “woman's ornament.” It is the gift Abraham's servant put on Rebekah's face ([[Gen. 24:47]]) and one of the “nose jewels” Isaiah lists among the finery of Jerusalem's women ([[Isa. 3:21]]). Gold rings in the nose were familiar, but in a pig's snout such a jewel was “unthinkable because swine were held in such contempt among the Israelites.”

      Set on a woman without discretion, beauty is that ring on that animal: the proverb “dismisses the value of physical beauty when it is not accompanied with self-control and righteousness.”
    sources: [bdb, oshb-wlc, ot-manual-proverbs]

  - ref: 30
    phrase: 'he that winneth souls is wise'
    kind: words
    title: He that winneth souls
    body: |
      The Hebrew says, word for word, that the one *taking* souls is wise (*lōqēaḥ nəp̄āšôt*). Elsewhere the same verb with the same noun means taking a life: the greedy man's gain “taketh away the life of the owners thereof” ([[Prov. 1:19]]), and Elijah says of his pursuers, “they seek my life, to take it away” ([[1 Kgs. 19:10]]). A modern translation keeps the literal words, “the wise capture souls.” The Greek translation reads the line quite differently, of the wicked: “the souls of transgressors are cut off before their time.”

      The King James “winneth” takes the words in a good sense. One older reading draws that sense from the first line: “the fruit of the righteous, i.e., his external influence, itself is a tree of life, namely for others” (on the tree of life, see [[Prov. 3:18]]), and so the wise man “becomes a winner of souls … or, as expressed in the N.T. (Matthew 4:19), a fisher of men.”
    sources: [oshb-wlc, nrsvue, lxx-rahlfs, delitzsch-proverbs]

  - ref: 31
    phrase: 'the righteous shall be recompensed in the earth'
    kind: scripture
    title: The righteous scarcely saved
    body: |
      The Hebrew argues from the lesser to the greater: if the righteous are repaid in the earth, “how much more the wicked and the sinner!” as a modern translation renders it. The verb denotes “full requital, i.e., according to the reference, either righteous reward or righteous punishment.” One older reading takes it as punishment in both lines: “if the righteous does not remain unrevenged, so much more shall not the godless and the sinner remain.”

      The Greek translation says it another way: “If the righteous scarcely be saved, where shall the ungodly and the sinner appear?” On that older reading, the Greek “may be a free translation.” The Greek of [[1 Pet. 4:18]] has the same words nearly to the letter. Peter sets the line just after his word to Saints who suffer “as a Christian” ([[1 Pet. 4:16]]): “judgment must begin at the house of God: and if it first begin at us, what shall the end be of them that obey not the gospel of God?” ([[1 Pet. 4:17]]).
    sources: [nrsvue, delitzsch-proverbs, lxx-rahlfs, greek-nt, lds-scriptures]

christ: |
  Peter's letter carries this chapter's last saying, in the words of its Greek translation, to Saints suffering for the name of Christ. He told them not to think the “fiery trial” strange, but to rejoice, “inasmuch as ye are partakers of Christ's sufferings” ([[1 Pet. 4:12–13]]). After the saying comes the counsel that closes his chapter: “let them that suffer according to the will of God commit the keeping of their souls to him in well doing, as unto a faithful Creator” ([[1 Pet. 4:19]]).

  A disciple who suffers for doing right is among those Peter wrote to, and the answer he gives is to keep doing good and to entrust the soul to the Creator who is faithful.

