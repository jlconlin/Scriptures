chapter: 16
title: The LORD Directeth His Steps
tagline: Thirty-three separate sayings, opening with a run about the LORD and a run about the king. People plan and the LORD decides, pride runs ahead of a fall, and even the lot cast into the lap falls as the LORD disposes.
when: 'The proverbs of Solomon'

setting: |
  Chapter 16 stands in the first collection of Solomon's proverbs, the two-line sayings that begin at [[Prov. 10:1]] (where the collection and its heading are explained) and run until “the words of the wise” at [[Prov. 22:17]]. Each saying is complete in itself, but this chapter begins with two runs that one older reading marks out. It opens with “Four proverbs of God, the disposer of all things” (verses 1–4), follows them with “three proverbs of divine punishment” and reconciliation (verses 5–7), and then gives “Five proverbs of the king” among sayings on righteous conduct, until, after verse 15, “The proverbs relating to the king are now at an end.” The same reading notes that verse 18, “Pride goeth before destruction,” “stands in the very centre of the Book of Proverbs.”

  Several of the book's subjects are explained here for the rest of it: the LORD's rule over human plans (verses 1 and 9), the king (verse 10), pride (verse 18) and the lot (verse 33). *Come, Follow Me* reads verses 24–32 with chapter 15 under the heading of the soft answer (see [[Prov. 15:1]]).

thread: |
  Like the chapters before it, chapter 16 is a string of separate sayings, but two runs in it are marked by the text. Verses 1–9 are sayings about the LORD (His name is in every one but verse 8), and they share one claim: people plan, and the LORD decides. The heart arranges its thoughts and the LORD gives the answer (verse 1); a man approves his own ways and the LORD weighs the spirit (verse 2); the heart plans the road and the LORD directs the steps (verse 9). Verses 10–15 turn to the king, whose word carries the weight of an oracle and whose favor and anger decide lives, and who must himself answer to righteousness (verse 12).

  The rest of the chapter sets wisdom against its opposites. Wisdom is worth more than gold (verse 16); pride runs ahead of a fall, and humility is better than plunder (verses 18–19); wise words are as sweet as honey (verses 21–24); and a row of portraits shows the man who digs up evil, sows strife and leads his neighbor astray (verses 27–30). The last verse returns to where the chapter began: even the lot, cast to leave a decision to God, falls as the LORD decides.

sections:
  - range: 1-9
    heading: The LORD and human plans
    plain: |
      People arrange their thoughts, but the fitting answer on the tongue comes from the LORD. A man thinks all his ways are pure, but the LORD weighs the spirits. Roll your works onto the LORD (see [[Ps. 37:5]]), and your plans will stand. The LORD has made everything for its purpose, even the wicked for the day of trouble. The LORD loathes everyone who is proud in heart (on “abomination,” see [[Prov. 3:32]]); be sure of it, he will not go unpunished (the second line has come before, at [[Prov. 11:21]]). By mercy and faithfulness iniquity is atoned for, and by the fear of the LORD (see [[Prov. 1:7]]) a person turns away from evil. When a man's ways please the LORD, He makes even his enemies be at peace with him (on sayings that describe how things go, see [[Prov. 22:6]]). Better a little with righteousness than great income gained without right. A man's heart plans his way, but the LORD directs his steps.
  - range: 10-15
    heading: Sayings about the king
    plain: |
      The king's lips speak with the weight of an oracle; his mouth must not betray justice. Honest balances and scales belong to the LORD; all the weights in the bag are His work (on false weights, see [[Amos 8:5]]). Kings loathe doing wrong, for a throne stands on righteousness. Kings delight in righteous lips and love the one who speaks what is right. A king's anger is like messengers of death, but a wise man will appease it. In the light of the king's face is life, and his favor is like a cloud that brings the spring rain.
  - range: 16-24
    heading: Wisdom, humility and gracious words
    plain: |
      How much better to get wisdom than gold, and to choose understanding rather than silver! The highway of the upright turns aside from evil; whoever watches his way keeps his life. Pride goes before destruction, and a haughty spirit before a fall. Better to be humble in spirit with the lowly than to divide the spoil with the proud. Whoever handles a matter wisely finds good, and happy is the one who trusts in the LORD (see [[Prov. 3:5]]). The wise in heart are called prudent, and sweet speech adds to learning. Understanding is a fountain of life to the one who has it, but the instruction of fools is folly. The heart of the wise teaches his mouth and adds learning to his lips. Pleasant words are a honeycomb, sweet to the soul and health to the bones.
  - range: 25-30
    heading: A false way, and the man who stirs up evil
    plain: |
      There is a way that seems right to a man, but its end is the ways of death (the saying has come before, at [[Prov. 14:12]]). A laborer's hunger works for him, for his mouth drives him on. An ungodly man digs up evil, and on his lips is something like a burning fire. A perverse man sows strife, and a whisperer separates close friends. A violent man entices his neighbor and leads him down a way that is not good. He shuts his eyes to plot perverse things; moving his lips, he brings evil to pass.
  - range: 31-33
    heading: Gray hair, self-mastery and the lot
    plain: |
      Gray hair is a crown of glory when it is found in the way of righteousness. Whoever is slow to anger is better than the mighty, and whoever rules his own spirit better than one who captures a city. The lot is cast into the lap, but every decision it gives comes from the LORD.

notes:
  - ref: 1
    phrase: 'the answer of the tongue, is from the LORD'
    kind: words
    title: Man’s plans, the LORD’s answer
    body: |
      The saying gives the planning to man and the outcome to the LORD. A modern translation gives the first line as “The plans of the mind belong to mortals.” “The answer of the tongue” is the “ability to answer”: the thinking is a person's own work, and the fitting word, when it comes, comes from the LORD.

      Verse 9 says the same of a life's road: the heart plans the way, “but the LORD directeth his steps.” The book's other sayings on the LORD's rule over human plans ([[Prov. 19:21]]; [[Prov. 20:24]]; [[Prov. 21:1]]; [[Prov. 21:30–31]]) point here.
    sources: [nrsvue, bdb]

  - ref: 4
    phrase: 'The LORD hath made all things for himself: yea, even the wicked for the day of evil'
    kind: words
    title: For its purpose
    body: |
      The verse says that all the LORD has made has its place in His purpose, the wicked included; it does not say that He made anyone wicked. “For himself” translates a phrase built on *ma'aneh*, the noun of “the answer of the tongue” in verse 1. One older reading, noting that everywhere else the noun means answer, takes it here as aim or end: “Jahve hath made everything for its contemplated end.” Two modern translations agree: “The Lord has made everything for its purpose, even the wicked for the day of trouble.”

      The same reading answers the hard question directly. “God has not indeed made the wicked as such, but He has made the being which is capable of wickedness, and which has decided for it,” and the “day of evil” is the day of adversity that will come upon him. It denies that the verse teaches a predestination to evil decreed before the Fall, since that teaching “makes God the author of evil.” What the verse affirms is narrower: “The free actions of men create no situation by which God would be surprised,” and “the wicked also has his place in God's order of the world.” The choice is the wicked man's; where it ends is the LORD's.
    sources: [delitzsch-proverbs, bdb, nrsvue, esv]

  - ref: 6
    phrase: By mercy and truth iniquity is purged
    kind: words
    title: Iniquity covered over
    body: |
      “Purged” is the verb of atonement, *kipper*: the line says iniquity is atoned for by mercy and truth. The phrase means “by mercy and fidelity iniquity is covered over,” and modern translations read “iniquity is atoned for.” The same verb stands in verse 14, where the wise man will “pacify” the king's wrath.

      Whose mercy and truth? One older reading, setting the proverb beside the prophets ([[Hosea 6:6]]; [[Micah 6:6–8]]), takes them here as human “love and faithfulness in the relation of men to one another.” In that reading the ground of reconciliation is God's, and a person shares in it “when he accepts, in penitence and in faith, the offered mercy of God”; but no one can “trust to this mercy if he is not zealous, in his relations to his fellow-men, to practise love and truth.” The second line gives the other half: by the fear of the LORD a person turns from evil.
    sources: [bdb, nrsvue, esv, delitzsch-proverbs]

  - ref: 10
    phrase: A divine sentence is in the lips of the king
    kind: history
    title: The king’s word as an oracle
    body: |
      The verse calls the king's word an oracle and in the same breath requires him to judge rightly. “A divine sentence” is *qesem*, the word for divination, which the law forbids ([[Deut. 18:10]]) and Samuel condemns ([[1 Sam. 15:23]]); here it is used “in good sense,” of the “king's lips as oracle.” A modern translation reads, “Inspired decisions are on the lips of a king.” The second line binds that authority to justice, and verse 12 says where it rests: “the throne is established by righteousness.”

      Verses 10–15 are the chapter's sayings about the king, and this is where the book's king is explained (the others, at [[Prov. 20:2]], [[Prov. 20:8]], [[Prov. 20:26]], [[Prov. 20:28]], [[Prov. 25:2–7]] and [[Prov. 29:14]], point here). His throne stands on righteousness (verse 12), he loves honest speech (verse 13), his anger is deadly and his favor gives life (verses 14–15).
    sources: [bdb, nrsvue]

  - ref: 15
    phrase: his favour is as a cloud of the latter rain
    kind: symbol
    title: A cloud of the latter rain
    body: |
      The king's favor is compared to the rain cloud of spring, the last rain of the season. In the land the “early rain” falls in autumn, the winter rain “soaks the soil and fills the cisterns,” and “The biblical ‘latter rain’ comes in March and April.” After it, “rain hardly ever falls until the end of September.” The king's favor is likened to the cloud that brings the season's last rain before months with almost none. Set after verse 14, where his wrath is like messengers of death, the saying gives the other side: his anger brings death, his favor life.
    sources: [bd-rain]

  - ref: 18
    phrase: Pride goeth before destruction, and an haughty spirit before a fall
    kind: prophets
    title: Pride before a fall
    body: |
      Pride comes first and the fall follows: the saying names what pride leads to, and says it twice. The book has already said the reverse, “before honour is humility” ([[Prov. 15:33]]), and the next verse here is in praise of humility: better a humble spirit with the lowly than a share of the spoil with the proud. The other sayings on pride ([[Prov. 11:2]]; [[Prov. 18:12]]; [[Prov. 29:23]]) point here.

      President Ezra Taft Benson set this verse among scripture's “evidences of the severe consequences of the sin of pride to individuals, groups, cities, and nations.” Pride, he said, “destroyed the Nephite nation and the city of Sodom,” and he quoted the Book of Mormon's own verdict: “the pride of this nation, or the people of the Nephites, hath proven their destruction” ([[Moro. 8:27]]), and the Lord warned the latter-day Church, “Beware of pride, lest ye become as the Nephites of old” ([[D&C 38:39]]). His remedy is the virtue verse 19 praises: “The antidote for pride is humility—meekness, submissiveness.”
    sources: [benson-pride]

  - ref: 33
    phrase: The lot is cast into the lap
    kind: history
    title: The lot and the LORD’s decision
    body: |
      The proverb says that the decision the lot gives is the LORD's. In one older reading the “lap” is the loose fold of clothing over the breast, where the lot was shaken and then “drawn out,” and “disposing” is a decision of the kind the Urim and Thummim gave ([[Num. 27:21]]). The same reading notes that the law never commands the lot, yet Israel used it, as at [[Josh. 7:14]] and [[1 Sam. 14:40–42]], “within the domain of public justice, as well as for the detection of the guilty.” The proverb gives the practice no special sanction: it says only that “where the lot is cast, all the decision that results from it is determined by God.” The land was divided by lot (see [[Num. 26:55]]), and the book returns to the lot where it “causeth contentions to cease” ([[Prov. 18:18]]).

    sources: [delitzsch-proverbs]

christ: |
  Verse 1 says the fitting answer of the tongue comes from the LORD, and the Savior promised such answers to those He sent. Sending out the Twelve, He told them, “take no thought how or what ye shall speak: for it shall be given you in that same hour what ye shall speak” ([[Matt. 10:19]]), the verse one older reading sets beside this proverb. The Church's footnote at verse 1 points to the same promise in this dispensation, given to Joseph Smith and Sidney Rigdon: “speak the thoughts that I shall put into your hearts” ([[D&C 100:5]]), “For it shall be given you in the very hour, yea, in the very moment, what ye shall say” ([[D&C 100:6]]).

  The preparation is still the disciple's to make, as the chapter keeps saying (verses 1, 3, 9). The word needed in the hour is the Lord's to give, as He promised the Twelve and, in this dispensation, Joseph Smith and Sidney Rigdon.

