  - **Lots in scripture.** [[Josh. 7:14–18]], [[1 Sam. 14:40–42]], [[Jonah 1:7]], [[Acts 1:23–26]] and [[1 Ne. 3:11]].
  - **Righteous and wicked kings.** [[Deut. 17:18–20]] and [[Mosiah 29:13–23]].

