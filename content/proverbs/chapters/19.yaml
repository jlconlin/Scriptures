chapter: 19
title: Lendeth unto the LORD
tagline: Separate sayings on the poor man whose friends desert him and whose loan the LORD repays, the false witness, the angry man and the forbearing one, the prudent wife who comes from the LORD, and a son told to stop listening if he will only stray.
when: 'The proverbs of Solomon'

setting: |
  Chapter 19 stands in the first collection of Solomon's proverbs, which opens with its own heading at [[Prov. 10:1]] and runs to [[Prov. 22:16]]; chapter 10's setting says what kind of sayings these are, and the note at [[Prov. 22:6]] how far such sayings promise.

  Many of the chapter's sayings appear more than once in the book, some within this collection and some in the later one copied out under Hezekiah. Verse 4 is a slightly changed form of [[Prov. 14:20]], verse 9 repeats verse 5 with one word changed, and the first line of verse 12 comes back in [[Prov. 20:2]]. Verse 1 returns at [[Prov. 28:6]] and verse 24 at [[Prov. 26:15]], the same in meaning with the wording changed, and verse 13's dripping is drawn out into a whole saying at [[Prov. 27:15]]. Verse 7 is the one saying in the chapter with three lines (see the note there).

thread: |
  The chapter is a string of separate sayings, each complete in itself. The sections below are runs of verses named for what their sayings share, not stages of an argument; the false witness of verse 5 comes back almost word for word at verse 9, four sayings later.

  What recurs is plain enough. The poor man comes back five times (verses 1, 4, 7, 17, 22): in verses 1 and 22 he is set not against a rich man but against the fool and the liar, his brothers and friends leave him, and the LORD takes up his cause as a debt owed. Lying and false witness return in verses 5, 9, 22 and 28; fathers and sons in verses 13, 14, 18, 26 and 27; anger, the king's and a man's own, in verses 11, 12 and 19. The LORD is named five times (verses 3, 14, 17, 21, 23): men blame Him for the ruin their folly made, He gives the prudent wife no inheritance can, He repays what is given to the poor, and His counsel stands over all the plans in a man's heart.

sections:
  - range: 1-4
    heading: The poor man and the fool
    plain: |
      Better a poor man who walks in integrity than a man of crooked speech who is a fool (the saying returns, with the rich man named, at [[Prov. 28:6]]). It is not good for a soul to be without knowledge, and the one who rushes ahead on his feet misses the way. A man's own folly overturns his road, and then his heart rages against the LORD. Wealth gathers many friends, but the poor man is left by the friend he has (the saying is close to [[Prov. 14:20]]).
  - range: 5-8
    heading: A false witness, and friends who leave
    plain: |
      A false witness will not go unpunished, and the one who speaks lies will not escape. Many seek the favor of a prince, and everyone is a friend to the man who gives gifts. If a poor man's own brothers hate him, how much more will his friends keep their distance; he calls after them, and they are gone (the Hebrew of this last line is uncertain: see the note). Whoever gets wisdom loves his own soul, and whoever keeps understanding will find good.
  - range: 9-16
    heading: Anger, the king and the household
    plain: |
      The saying of verse 5 comes again: a false witness will not go unpunished, and the liar will perish. Luxury does not suit a fool, much less does it suit a servant to rule over princes. Good sense makes a man slow to anger, and it is his glory to let an offense go by. The king's anger is like a lion's roar, his favor like dew on the grass (on the king in Proverbs, see [[Prov. 16:10]]). A foolish son is ruin to his father, and a quarrelsome wife is like rain that keeps dripping. House and wealth come by inheritance from fathers, but a prudent wife comes from the LORD. Laziness sinks a man into deep sleep, and the idle soul goes hungry. Whoever keeps the commandment keeps his soul, and whoever takes no heed to his ways will die.
  - range: 17-21
    heading: Giving, correcting and counsel
    plain: |
      Whoever is kind to the poor lends to the LORD, and the LORD will repay him for what he gave. Correct your son while there is still hope, but do not set your heart on his death (see the note; on the rod, see [[Prov. 13:24]]). A man of great anger must bear his penalty; rescue him, and you will only have to do it again. Listen to counsel and accept correction, so that you will be wise at the last. A man's heart holds many plans, but it is the counsel of the LORD that will stand (on the LORD's rule over human plans, see [[Prov. 16:1]]).
  - range: 22-29
    heading: Scorners, and sons who shame
    plain: |
      What is desired in a man is his kindness, and a poor man is better than a liar. The fear of the LORD leads to life (see [[Prov. 1:7]]); whoever has it rests satisfied, and no evil will visit him. The lazy man buries his hand in the dish and will not even bring it back to his mouth. Strike a scorner and the simple will take warning; correct a man of understanding and he will gain knowledge (on the scorner and the simple, see [[Prov. 1:22]]; compare [[Prov. 21:11]]). A son who ruins his father and drives away his mother brings shame and disgrace. Stop listening to instruction, my son, if you will only stray from the words of knowledge (see the note). An ungodly witness mocks justice, and the mouth of the wicked gulps down iniquity. Judgments are ready for scorners, and blows for the backs of fools.

notes:
  - ref: 7
    phrase: 'he pursueth them with words, yet they are wanting to him'
    kind: words
    title: The saying with a third line
    body: |
      Verse 7 has three lines where the sayings around it have two, and in one older reading the third is beyond doubt what is left of a saying otherwise lost. The first two lines are clear: if a poor man's own brothers hate him, “how much more” will his friends go far from him. The third line is not. Its last words are written in the Hebrew text with *lo'*, not, while the Masoretes' marginal reading (the *qere*, what is to be read, against the *ketiv*, what is written) has *lo*, to him. Read with the margin, the poor man chases after “mere words” that are all he receives; read as written, they are “words which are not,” “the empty assurances and promises of his brethren and friends.”

      The Greek translation adds two sayings that the Hebrew lacks, and in the same older reading the second of them preserves “the line lost from the Heb. text,” though it “is difficult to restore.” Modern translations mark the Hebrew of the verse as uncertain; one renders the last line, “When they call after them, they are not there.” The King James reading, that the poor man calls after friends who are gone, is one sense the words can bear, not a settled one.
    sources: [delitzsch-proverbs, lxx-rahlfs, esv, nrsvue]
  - ref: 11
    phrase: it is his glory to pass over a transgression
    kind: scripture
    title: Passing over a transgression
    body: |
      To “pass over a transgression” is to let an offense go by without paying it back, and the same words are used of God. In one older reading it is a man's honor “to pass by a transgression (particularly that which affects himself), to let it go aside, i.e., to forbear revenge or punishment.” The Hebrew phrase, the verb “pass” with “over transgression,” is the same one Micah uses of the LORD: “Who is a God like unto thee, that pardoneth iniquity, and passeth by the transgression of the remnant of his heritage?” ([[Micah 7:18]]). The first line gives the reason a man can do it: good sense makes him slow to anger. Brigham Young set this verse beside the soft answer of [[Prov. 15:1]], in counsel quoted at that verse.
    sources: [delitzsch-proverbs, oshb-wlc, ot-manual-proverbs]
  - ref: 13
    phrase: the contentions of a wife are a continual dropping
    kind: symbol
    title: Rain that keeps dripping
    body: |
      The image is rain that keeps dripping, drop after drop, with no end to it. The word is “a dropping (of rain),” used here in a figure; a modern translation has “a continual dripping of rain.” The picture returns as a whole saying: “A continual dropping in a very rainy day and a contentious woman are alike” ([[Prov. 27:15]]). The very next verse speaks of the other kind of wife, the prudent one who comes from the LORD.
    sources: [bdb, nrsvue]
  - ref: 17
    phrase: He that hath pity upon the poor lendeth unto the LORD
    kind: symbol
    title: A loan to the LORD
    body: |
      The proverb makes the LORD the borrower: whoever is kind to the poor puts the LORD in his debt, and He repays. The verb is the one for lending, and in the lexicon the lender to the LORD of this verse is “one shewing favour to the poor”; a modern translation ends the verse, “will be repaid in full.” On the poor man's Maker, see [[Prov. 14:31]].

      The Church's footnote sends the reader to King Benjamin's sermon ([[Mosiah 4:16–18]]), which goes on to answer the man who would hold back because “The man has brought upon himself his misery” ([[Mosiah 4:17]]): “For behold, are we not all beggars? Do we not all depend upon the same Being, even God, for all the substance which we have” ([[Mosiah 4:19]]).
    sources: [bdb, nrsvue, lds-scriptures]
  - ref: 18
    phrase: let not thy soul spare for his crying
    kind: words
    title: Not to the point of death
    body: |
      The second line sets a limit on correction: in the Hebrew it warns a father against setting his heart on his son's death, not against sparing him for his crying. Its verb means to “bring to a premature death,” and modern translations render the line “do not set your heart on putting him to death” and “do not set your heart on their destruction.”

      So the verse says two things: correct a son while there is still hope for him, and never make his destruction the aim. What the book's sayings about the rod meant, and how the Church reads them, is at [[Prov. 13:24]].
    sources: [bdb, esv, nrsvue]
  - ref: 24
    phrase: hideth his hand in his bosom
    kind: symbol
    title: A hand in the dish
    body: |
      The sluggard has put his hand in the dish and is too lazy to lift it to his mouth. The word rendered “bosom” means “dish,” the word of the simile in [[2 Kgs. 21:13]], where the LORD will wipe Jerusalem as a dish is wiped. The King James “bosom” agrees with the Greek translation: “He that unjustly hides his hands in his bosom, will not even bring them up to his mouth.” The saying returns at [[Prov. 26:15]]; on the sluggard, see [[Prov. 6:6]].
    sources: [bdb, lxx-rahlfs]
  - ref: 27
    phrase: 'Cease, my son, to hear the instruction that causeth to err from the words of knowledge'
    kind: words
    title: Stop listening to instruction
    body: |
      The Hebrew says, “Cease, my son, to hear instruction, to depart from the words of knowledge,” and in one older reading it means: stop listening if all you will do is stray. The King James makes it a warning against teaching that misleads, but the word for “instruction” (*musar*), in the same reading, “always means either discipline weaning from evil, or education leading to good.” That reading takes the line as “a dissuasive from hypocrisy”: cease to hear instruction “if thou wilt make no other use of it than to depart,” the self-deception James warns of, “be ye doers of the word, and not hearers only, deceiving your own selves” ([[James 1:22]]). One modern translation reads the second line as the result, “and you will stray from the words of knowledge”; another corrects the text and marks its meaning uncertain.

      It is the one verse in the chapter where the father says “my son,” and in the same older reading it is the seed of the father's addresses to his son in chapters 1–9 (see [[Prov. 1:8]]).
    sources: [delitzsch-proverbs, esv, nrsvue]

christ: |
  Verse 11 praises the man who passes over a transgression, in the words Micah uses of the LORD, who “passeth by the transgression” ([[Micah 7:18]]). In one older reading Micah's words name the divine forbearance Paul writes of, where God sets forth Christ “to be a propitiation through faith in his blood … for the remission of sins that are past, through the forbearance of God” ([[Rom. 3:25]]). Verse 17 makes the LORD the debtor of whoever gives to the poor, and King Benjamin, to whose sermon the Church's footnote points, ties that giving to the remission of sins: the Saints impart of their substance to the poor “for the sake of retaining a remission of your sins from day to day” ([[Mosiah 4:26]]).

  For a disciple, letting an offense go by answers the forbearance God has shown, in Christ, to sins that are past. Giving to the poor is how, in King Benjamin's words, a disciple keeps the remission of sins already received.

explore: |
  - **The poor and their friends.** [[Prov. 14:20–21]], [[Prov. 17:17]], [[Prov. 18:23–24]] and [[Prov. 22:9]].
  - **Giving as to the Lord.** [[Prov. 14:31]], [[Mosiah 4:16–26]] and [[Matt. 25:34–40]].
  - **Slow to anger.** [[Prov. 14:29]], [[Prov. 16:32]] and [[Micah 7:18–19]].
  - **The sluggard.** [[Prov. 6:6–11]] and [[Prov. 26:13–16]].

