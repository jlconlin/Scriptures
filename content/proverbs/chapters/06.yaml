chapter: 6
title: Six Things, Yea, Seven
tagline: The father breaks off for four short warnings (the pledge, the sluggard, the worthless man, the seven things the LORD hates), then takes up his lecture again. His commandment is a lamp against another man's wife, a fire no man can carry in his bosom.
when: 'A father’s instruction, under Solomon’s name'

setting: |
  Chapter 6 belongs to the first division of Proverbs, the father's lectures to his son that run through chapter 9 (on the book's name and its collections, see [[Prov. 1:1]]). One Latter-day Saint reading counts in these chapters “ten instructions,” “interspersed with five interludes,” and here the first half of this chapter is the odd one out. The other interludes praise wisdom, but 6:1–19 is “Four epigrams on folly and evil”: a pledge for a debt, the sluggard, the worthless man, and the seven things the LORD hates. Each is short and complete in itself.

  At verse 20 the lecture resumes, under that reading's blunt title, “Adultery kills.” It is one of four lectures on the strange woman, after [[Prov. 2:16–22]] and [[Prov. 5:1–13]], and it leads into chapter 7, which tells the story of a young man who did not listen.

  Several of these lines come back later in the book. Verses 10–11 return word for word after the sluggard's overgrown field ([[Prov. 24:30–34]]); Agur returns to the ant ([[Prov. 30:25]]) and to the counting form of verse 16 ([[Prov. 30:15–31]]). The later sayings about pledging for a debt ([[Prov. 11:15]]; [[Prov. 17:18]]; [[Prov. 20:16]]; [[Prov. 22:26–27]]; [[Prov. 27:13]]) are single lines that point back here.

thread: |
  Each of the four warnings says quickly where the folly ends. The son who has pledged himself for a friend is “snared with the words of thy mouth” and must break free like a roe from the hunter (verses 2, 5). The sluggard who wants “a little sleep” finds poverty coming on him “as an armed man” (verses 10–11). The worthless man, all crooked mouth and secret signals, is broken “suddenly” and “without remedy” (verse 15). Then the father names the seven things the LORD hates, and the list uses the same body as the portrait just before it: the eyes, the mouth, the heart that “deviseth,” the feet, and last of all the one who “soweth discord” (verses 13–14, 17–19).

  At verse 20 “My son” begins again. The father's commandment and the mother's law ([[Prov. 1:8]]), bound on the heart ([[Prov. 3:3]]), will lead, guard and talk with the son. They are a lamp and a light, given “to keep thee from the evil woman” (verse 24; on the “strange woman,” see [[Prov. 2:16]]). The case against adultery follows: what it costs (verse 26); that it can no more be done without harm than fire can be carried against one's chest (verses 27–29); and that, unlike theft, it cannot be paid off (verses 30–35). The last word goes to the wronged husband, who will take no ransom.

sections:
  - range: 1-5
    heading: A pledge for a friend
    plain: |
      My son, if you have pledged yourself for your friend's debt, if you have struck hands on it for someone else, you are trapped by your own words, caught by what you said. So do this, my son, and get yourself free, since you have put yourself in your friend's power: go, humble yourself, and keep pressing your friend. Don't let your eyes sleep or your eyelids close. Get yourself free, like a roe from the hunter's hand, like a bird from the fowler's.
  - range: 6-11
    heading: Go to the ant
    plain: |
      Go to the ant, you lazy man; watch how she lives, and learn. She has no chief, no overseer, no ruler, yet she lays in her food in the summer and gathers her supplies at harvest. How long will you lie there, lazy man? When will you get up? A little sleep, a little slumber, a little folding of the hands to rest, and poverty will come on you like a traveler on the road, and need like an armed man.
  - range: 12-15
    heading: The worthless man
    plain: |
      A worthless, wicked man goes about with a crooked mouth. He winks with his eyes, signals with his feet, points with his fingers. His heart is twisted; he is always plotting harm and stirring up quarrels. So disaster will come on him suddenly; in an instant he will be broken past mending.
  - range: 16-19
    heading: Six things, yea, seven
    plain: |
      There are six things the LORD hates, seven that He loathes: a haughty look, a lying tongue, hands that shed innocent blood, a heart that plots wicked schemes, feet quick to run to do harm, a false witness who speaks lies, and the one who stirs up quarrels among brothers.
  - range: 20-23
    heading: The commandment is a lamp
    plain: |
      My son, keep your father's commandment, and don't abandon your mother's teaching. Bind them always on your heart; tie them around your neck. When you walk, they will lead you; when you lie down, they will guard you; when you wake, they will talk with you. For the commandment is a lamp, the teaching is light, and corrective instruction is the way to life,
  - range: 24-35
    heading: Another man's wife
    plain: |
      to keep you from the evil woman, from the flattering tongue of the strange woman. Don't desire her beauty in your heart, and don't let her catch you with her glances. For a prostitute can bring a man down to his last loaf of bread, but another man's wife hunts for life itself. Can a man carry fire against his chest and his clothes not burn? Can he walk on hot coals and his feet not be scorched? So it is with the man who goes in to his neighbor's wife: no one who touches her will be held innocent. People don't despise a thief who steals to fill himself when he is starving; still, if he is caught he must pay back sevenfold, even giving up everything in his house. But the man who commits adultery with a woman has no sense; whoever does it destroys himself. Wounds and disgrace are what he will get, and his shame will never be wiped away. For jealousy makes a husband furious, and he will show no mercy on the day he takes revenge. He will accept no payment; he will not be satisfied, however many gifts you offer.

notes:
  - ref: 1
    phrase: if thou be surety for thy friend, if thou hast stricken thy hand with a stranger
    kind: history
    title: 'Surety: a pledge for another’s debt'
    body: |
      To be “surety” was to pledge yourself for someone else's debt: if he did not pay, you would. The second line names the gesture that sealed it: striking the palm was a “gesture ratifying a bargain, specifically pledging oneself to become surety.” Doing so “makes one liable and responsible for a friend’s financial choices,” and perhaps the nearest thing now is cosigning a loan.

      The father tells his son that he has trapped himself “with the words of thy mouth” (verse 2) and must get free before he sleeps (verse 4). The way out in verse 3 is undignified. “Humble thyself” renders a verb that means to stamp oneself down, and so to “humble thyself, become a suppliant”; “make sure thy friend” renders a verb meaning “beset, importune, thy friend”; in a modern rendering, “Go, humble yourself, and appeal firmly to your neighbor.” The son is to go to the man he vouched for and keep pressing him, struggling like the roe and the bird of verse 5.
    sources: [bdb, ot-minute-proverbs-1-9]
  - ref: 6
    phrase: Go to the ant, thou sluggard; consider her ways, and be wise
    kind: symbol
    title: The sluggard sent to the ant
    body: |
      The father sends the lazy man to be taught by an insect that works with no one over her: she has “no guide, overseer, or ruler,” and still she lays in her food while it can be had. “Even the ant knows that one must work hard in summer and in harvest to survive.”

      Verse 10 asks for only “a little” more sleep, three times over, and verse 11 answers that the sleeper's lack “will attack them like ‘an armed man.’” The saying is against laziness, but “the broader principle is that doing hard things provides benefits in the long term.”

      The wake-up call of verse 9, “How long wilt thou sleep, O sluggard?”, has been set beside King Benjamin's words to a people whom the knowledge of God's goodness had “awakened” ([[Mosiah 4:5]]), as one of the wisdom motifs the Book of Mormon shares with Proverbs. That is one reader's comparison, not a quotation.
    sources: [ot-minute-proverbs-1-9, von-feldt-instructional-wisdom, lds-scriptures]
  - ref: 12
    phrase: A naughty person, a wicked man
    kind: words
    title: '“Naughty”: a man of Belial'
    body: |
      “Naughty” here renders *'adam beliyya'al*, a “man of Belial,” from a word that joins “not, without” to “worth, use, profit”: “the quality of being useless, good for nothing.” The same word describes the “worthless, good-for-nothing, base fellows” of Israel's stories, among them Eli's sons, who “were sons of Belial; they knew not the LORD” ([[1 Sam. 2:12]]). Verse 12 describes the same kind of man.

      The portrait that follows (verses 12–15) shows what such a man produces: a crooked mouth, a heart always plotting, quarrels wherever he goes, and at the end a sudden ruin that cannot be mended.
    sources: [bdb]
  - ref: 13
    phrase: He winketh with his eyes, he speaketh with his feet, he teacheth with his fingers
    kind: symbol
    title: Signals behind the words
    body: |
      The worthless man's gestures can be read as signals his mouth does not give openly. Winking with the eyes is “the action of the deceiver, who thereby gives the sign to others that they help or at least do not hinder him from bantering and mocking, belying and deceiving a third person.” “Speaketh with his feet” has been read as the same kind of signal: he “scrapes with his feet, draws them backwards and forwards on the ground in order thereby to give a sign to others.” On that older reading, he says one thing aloud and passes another to his accomplices. The next line names where it comes from: “Frowardness is in his heart” (verse 14).
    sources: [delitzsch-proverbs]
  - ref: 16
    phrase: 'These six things doth the LORD hate: yea, seven are an abomination unto him'
    kind: structure
    title: Six, yea, seven
    body: |
      “Six … yea, seven” is a counting form of Hebrew poetry: a number, then the next one up. Amos opens his oracles against the nations with it ([[Amos 1:3]]). Here the list is given in full, all seven. The form, a “Recalling of what has been said, in order to correct it as by an Afterthought,” works “to add beauty and power to expressions and to convey the idea of completeness.” It is called number parallelism, and Agur uses it again ([[Prov. 30:15]]; [[Prov. 30:18]]).

      The seven are five parts of the body and two kinds of person: eyes, tongue, hands, heart and feet, then the false witness and the one who sows discord. “Each of the abominations are about one’s relationship with others,” and bearing false witness is “a graver crime than lying.” The seventh, “he that soweth discord among brethren,” repeats the last thing said of the worthless man in verse 14, so the list ends where his portrait ended. (On “abomination,” see [[Prov. 3:32]].)

      President J. Reuben Clark Jr. read these verses as a list of things the Lord has left no doubt about, and said, “We add these to the Ten Commandments.”
    sources: [ot-manual-proverbs, parry-number-parallelism, ot-minute-proverbs-1-9]
  - ref: 26
    phrase: by means of a whorish woman a man is brought to a piece of bread
    kind: symbol
    title: A loaf of bread, and a precious life
    body: |
      The verse sets what a harlot costs a man, bread, against what another man's wife costs him, his life. The King James follows the Hebrew, which reads, literally, “because of a harlot to a piece of bread”: a man is brought down to his last loaf. Modern translations, comparing the Greek, Syriac and Latin, read the line as her price instead: “a prostitute’s fee is only a loaf of bread.” The Greek Septuagint has “the value of a harlot is as much as of one loaf.” One footnoted alternative keeps the King James sense: “a prostitute leaves a man with nothing but a loaf of bread.”

      On either reading, the second line names the greater loss. Modern translations render “the adulteress” as “a married woman” or “the wife of another,” and she does not cost bread: she “stalks a man’s precious life.” The father says it outright in verse 32: “he that doeth it destroyeth his own soul.”
    sources: [nrsvue, esv, lxx-rahlfs]
  - ref: 31
    phrase: he shall restore sevenfold; he shall give all the substance of his house
    kind: history
    title: The thief can pay; the adulterer cannot
    body: |
      Verses 30–35 set theft beside adultery: “theft may be made good, and that abundantly; but adultery and its consequences are irreparable.” The thief who steals because he is starving is not despised, but when he is caught he must still repay “sevenfold.” The law of Moses asked double, or four- or fivefold for livestock ([[Ex. 22:1]]; [[Ex. 22:4]]), and one older reading takes the number as no legal rate at all, since “a sevenfold compensation of the thing stolen is unheard of in the Israelitish law.” On that reading it means repaying “superabundantly,” even giving up “the whole possessions” of the house.

      The adulterer, by contrast, “destroyeth his own soul” and earns a reproach that “shall not be wiped away” (verses 32–33). The husband he has wronged “will not regard any ransom” (verse 35). A ransom is the payment by which “non-punishment, pardon of the crime” might be had; here no amount will buy it.
    sources: [delitzsch-proverbs]

christ: |
  The father's commandment is “a lamp,” his teaching “light,” and his correction “the way of life” (verse 23). Verse 23 is one of a few Old Testament passages that join “light” and “life.” The risen Lord brought the two words together in His first words at Bountiful: “I am the light and the life of the world” ([[3 Ne. 11:11]]). In Jerusalem He had promised that “he that followeth me shall not walk in darkness, but shall have the light of life” ([[John 8:12]]). One older reading hears in the warning of verse 25, “Lust not after her beauty in thine heart,” the spirit of His teaching on the mount, that a man who looks on a woman to lust after her “hath committed adultery with her already in his heart” ([[Matt. 5:28]]), taught again at Bountiful ([[3 Ne. 12:28]]).

  The father promises that his words, kept close, will lead, guard and “talk with thee” (verse 22), and the scriptures do the same for a disciple who studies them with questions: they “truly do talk back.” The Savior's commandment at Bountiful, “that ye suffer none of these things to enter into your heart” ([[3 Ne. 12:29]]), sets a disciple's protection in the heart, before a look becomes an act.

explore: |
  - **The sluggard through the book.** [[Prov. 24:30–34]], [[Prov. 26:13–16]] and the ants of [[Prov. 30:25]].
  - **The father's lectures on the strange woman.** [[Prov. 2:16–19]], [[Prov. 5:1–23]] and [[Prov. 7:1–27]], read in order.
  - **Counting sayings.** [[Prov. 30:15–31]] and [[Amos 1:3–2:6]].
  - **Light and life.** [[Ps. 119:105]], [[John 8:12]] and [[3 Ne. 11:10–11]].

