chapter: 3
title: Trust in the LORD with All Thine Heart
tagline: A father asks his son to lean his whole weight on the Lord, to accept His correction as love, to prize Wisdom above every treasure, and to give his neighbor the good he is owed.
when: 'A father’s instruction, under Solomon’s name'

setting: |
  Proverbs 3 belongs to chapters 1–9, the part of the book written as a father’s instruction to his son (on the speaker and “my son,” see [[Prov. 1:8]]). It holds the third of those instructions (verses 1–12), then an interlude in praise of Wisdom (verses 13–20), and then the father’s charge again (verses 21–35). He calls his teaching “my law” (verse 1), a word that joins heeding an earthly father with heeding the Father in Heaven.

  The New Testament quotes it. Hebrews quotes verses 11–12 to Christians enduring hardship ([[Heb. 12:5–6]]), and James and Peter both quote verse 34 ([[James 4:6]]; [[1 Pet. 5:5]]). The Church’s *Come, Follow Me* takes the title of its week on Proverbs from verse 6: “He Shall Direct Thy Paths.” Readers of the Book of Mormon will meet the chapter’s images again, in Lehi’s tree of life and in Alma’s counsel to his sons; the notes below give the studies that set them side by side.

thread: |
  Proverbs 3 describes a life that leans on the Lord.

  The first ten verses are a run of commands, and each comes with its result attached: the counselor wants “with the good to which he advises, at the same time to present its good results.” Keep the father’s teaching and gain long life and peace. Keep loyal love and faithfulness and find favor with God and people. Trust the Lord rather than your own understanding, and He will make the path straight. Give Him the first of the harvest, and the barns will fill. The promises describe what trusting the Lord brings over a life: it “is always better—if not always perfect” (how the book’s promises are read is at [[Prov. 22:6]]).

  Then the chapter turns to hardship (verses 11–12). Just as God is not to be forgotten in good days, He is not to be abandoned when He corrects, because correction is what a father gives the son he loves.

  The middle of the chapter praises Wisdom herself: worth more than any merchandise, a tree of life, and the skill by which the Lord built the world (verses 13–20). The last part brings that down to daily life. First comes safety on the road and in sleep (verses 21–26). Then comes the neighbor, who is owed the good one is able to do and owed no harm (verses 27–32). The chapter closes with two houses and their two ends: curse and blessing, scorn and grace, honor and shame (verses 33–35).

sections:
  - range: 1-10
    heading: Commands with promises
    plain: |
      My son, don’t forget my teaching; keep my commandments in your heart, for they will give you long life and peace. Don’t let loyal love and faithfulness leave you. Tie them around your neck and write them on the tablet of your heart, and you will find favor and good understanding with God and with people. Trust the Lord with all your heart, and don’t lean on your own understanding. In all your ways know Him, and He will make your paths straight. Don’t be wise in your own eyes; fear the Lord and turn away from evil. That will bring healing to your body (literally, “your navel”) and refreshment to your bones. Honor the Lord with your wealth and with the first of all your harvest, and your barns will be filled and your vats will overflow with new wine.
  - range: 11-12
    heading: The Lord’s correction
    plain: |
      My son, don’t reject the Lord’s discipline or grow weary of His correction, for the Lord corrects the one He loves, as a father corrects the son he delights in.
  - range: 13-20
    heading: Wisdom above every treasure
    plain: |
      Happy is the person who finds wisdom and gains understanding. Trading for her pays better than trading for silver, and her profit is better than fine gold. She is more precious than rubies; nothing you could want compares with her. Long life is in her right hand, and riches and honor are in her left. Her ways are pleasant, and all her paths are peace. She is a tree of life to those who take hold of her, and everyone who holds on to her is happy. By wisdom the Lord laid the earth’s foundations; by understanding He set the heavens in place. By His knowledge the deep waters broke open, and the clouds drop dew.
  - range: 21-26
    heading: Safe on the way
    plain: |
      My son, keep sound wisdom and discretion before your eyes; don’t let them slip away. They will be life for you and an ornament for your neck. Then you will walk your road safely and not stumble. When you lie down you won’t be afraid; you will lie down and your sleep will be sweet. Don’t fear sudden terror, or the ruin that comes on the wicked, for the Lord will be your confidence and will keep your foot from being caught.
  - range: 27-35
    heading: The neighbor, and the two houses
    plain: |
      Don’t withhold good from those who have a right to it when you are able to give it. Don’t tell your neighbor, “Go, and come back; I’ll give it to you tomorrow,” when you have it with you. Don’t plot harm against your neighbor while he lives beside you in security. Don’t quarrel with someone for no reason when he has done you no harm. Don’t envy the oppressor or choose any of his ways, for the Lord detests the crooked, but He takes the upright into His confidence. The Lord’s curse is on the house of the wicked, but He blesses the home of the righteous. He mocks the mockers but gives grace to the humble. The wise will inherit honor, but shame is all the promotion fools get.

notes:
  - ref: 3
    phrase: bind them about thy neck; write them upon the table of thine heart
    kind: symbol
    title: Worn at the neck, written on the heart
    body: |
      The father asks his son to keep two virtues as close as a seal worn at the throat and as deep as words cut into a tablet. *Mercy* and *truth* are *ḥesed* and *ʾĕmet*. One older reading defines the first as “a loving disposition,” shown by God to people, by people to God, or by people to one another, and the second as “a standing to one’s promises, and not falsifying just expectations; thus fidelity.” A Latter-day Saint study renders the line “Let not loyalty and faithfulness forsake thee.” On the older reading, “them” in “bind them” refers to these two virtues, not to the father’s commandments.

      Binding them about the neck recalls the signet a man carried at his throat, as Judah did ([[Gen. 38:18]]): one older reading says it hung “on a string around the neck.” The two lines together recall the words bound on the hand and between the eyes in [[Deut. 6:8]], where an outward sign stands for “that which is required in the inward parts” (see the note at [[Deut. 6:6]]). The “table” is a writing tablet. To write on it is to impress the virtues so deeply “that one will be impelled to them from within outward,” as in the promise of the new covenant: “I will put my law in their inward parts, and write it in their hearts” ([[Jer. 31:33]]).
    sources: [delitzsch-proverbs, ot-minute-proverbs-1-9, lds-scriptures]

  - ref: 5
    phrase: Trust in the LORD with all thine heart; and lean not unto thine own understanding
    kind: scripture
    title: Leaning on the Lord
    body: |
      The verse asks where a person’s weight rests. The Hebrew verb behind “lean,” *šāʿan*, means to “lean, support oneself,” and is used figuratively for trust: to lean on a king or on God. So the two halves of the verse make one picture, setting one support against another. Verse 7 says it again from the other side: “Be not wise in thine own eyes” ([[Prov. 3:7]]).

      Two Latter-day Saint studies set the verse beside Alma’s words to his sons. One sets verses 5 and 7 beside Alma’s warning to Shiblon, “see that ye do not boast in your own wisdom, nor of your much strength” ([[Alma 38:11]]). Shiblon, it says, had to guard against believing that his wisdom and strength were “self-generated rather than gifts from an all-wise God.” Another study sets verse 5 beside Corianton, who had boasted of his own wisdom ([[Alma 39:2]]).

      President N. Eldon Tanner often quoted these verses. He drew from them that a person “must be prepared to acknowledge that there are certain things—many, many things—that he cannot understand.”
    sources: [bdb, allis-pike-words-wise, von-feldt-instructional-wisdom, ot-manual-proverbs]

  - ref: 6
    phrase: In all thy ways acknowledge him, and he shall direct thy paths
    kind: words
    title: Know Him, and the straight path
    body: |
      Both verbs of the verse say more than the English suggests: to acknowledge the Lord is to know Him, and to direct a path is to make it straight. “Acknowledge him” is one Hebrew word, *dāʿēhû*, from *yādaʿ*, “to know”: in all your ways, *know* Him.
      “Direct” (*yĕyaššēr*) is the verb “make smooth, straight,” the same one used for the highway in Isaiah: “make straight in the desert a highway for our God” ([[Isa. 40:3]]). With a road or path as its object, it means making the way “free from obstacles, successful.” What the Lord promises, then, is a road made straight and cleared.
    sources: [strongs-concordance, bdb]

  - ref: 8
    phrase: It shall be health to thy navel, and marrow to thy bones
    kind: words
    title: Health to the navel
    body: |
      The word behind “navel” is uncertain here, but every reading of it makes the line about the whole body. The Hebrew *šōr* is the “navel-string,” the umbilical cord, the word used of a newborn in [[Ezek. 16:4]], and its reading in this verse is questioned. The Greek translation reads “health to thy body,” and some scholars correct the Hebrew to “thy flesh”; others keep “navel” and take it, paired with “bones,” as a part standing for the whole body. On any of these readings, the fear of the Lord and turning from evil (verse 7) are said to bring health to the whole person.
    sources: [bdb, lxx-rahlfs, ot-minute-proverbs-1-9]

  - ref: 9
    phrase: Honour the LORD with thy substance, and with the firstfruits of all thine increase
    kind: history
    title: Firstfruits and full barns
    body: |
      The firstfruits were the first of the harvest ([[Ex. 22:29]]; [[Ex. 23:19]]), “regarded as belonging to God” and offered at the great feasts. One older reading takes verse 9 as commending tithes, and notes that it may surprise a reader to find a book of wisdom, which otherwise stands apart from the ritual law, doing so. It answers that the duty of giving tithes “is older than the Mosaic law” (Jacob’s vow, [[Gen. 28:22]]), and it sets the promise of verse 10 beside Malachi’s: “prove me now herewith, saith the Lord of hosts, if I will not open you the windows of heaven, and pour you out a blessing” ([[Mal. 3:10]]).

      A Latter-day Saint study widens the command. Because a person’s relationship with the Lord is bound up with relationships with others, honoring Him with one’s substance means caring for the poor as well as offering sacrifice. It grants that the promise sounds “paradoxical—how could we have our barns filled if we offer our substance to God and to others?” Its answer is that the full barns stop being the goal: “The only way that our lives can be full is by using our substance to care for others.”
    sources: [bd-firstfruits, delitzsch-proverbs, ot-minute-proverbs-1-9]

  - ref: 11
    phrase: despise not the chastening of the LORD; neither be weary of his correction
    kind: scripture
    title: The Lord’s correction
    body: |
      The Lord’s correction is evidence that He loves His child, not that He has rejected him. Hebrews quotes these two verses to Christians under trial ([[Heb. 12:5–6]]) in the wording of the Greek translation. Where the Hebrew says “neither be weary of his correction” and “even as a father the son in whom he delighteth,” the Greek has “nor faint when thou art rebuked of him” and “scourges every son whom he receives.” Hebrews follows the Greek: “For whom the Lord loveth he chasteneth, and scourgeth every son whom he receiveth” ([[Heb. 12:6]]). It then draws the lesson: chastening “yieldeth the peaceable fruit of righteousness unto them which are exercised thereby” ([[Heb. 12:11]]).

      The Lord says the same in this dispensation: “whom I love I also chasten that their sins may be forgiven” ([[D&C 95:1]]). Elder D. Todd Christofferson, quoting Hebrews, taught that “truly we ought to rejoice that God considers us worth the time and trouble to correct.” A Latter-day Saint study on Proverbs adds a caution: “Not every adversity comes because we have done something wrong, and God is not the author of every difficulty in our lives.”

      This is the Lord’s correction of His children. A father’s discipline with the rod is a different question, taken up at [[Prov. 13:24]].
    sources: [lxx-rahlfs, lds-scriptures, christofferson-chasten, ot-minute-proverbs-1-9]

  - ref: 18
    phrase: She is a tree of life to them that lay hold upon her
    kind: symbol
    title: A tree of life
    body: |
      Wisdom, the woman of this poem (see [[Prov. 1:20]]), is called a tree of life to those who take hold of her, an image that reaches back to Eden. The way to the tree was guarded after the Fall ([[Gen. 3:22–24]]), and a Latter-day Saint study reads verse 18 as saying that “true knowledge, or wisdom, will lead to life. We cannot find the tree of life by going backwards to the garden; we will only find it by moving forward.”

      Latter-day Saint readers have set the passage beside Lehi’s dream. Proverbs frames the tree with happiness: “Happy is the man that findeth wisdom” ([[Prov. 3:13]]) and “happy is every one that retaineth her.” Lehi saw “a tree, whose fruit was desirable to make one happy” ([[1 Ne. 8:10]]). Another study sets the line “all the things thou canst desire are not to be compared unto her” ([[Prov. 3:15]]) beside the fruit Lehi found “desirable above all other fruit” ([[1 Ne. 8:12]]). Nephi learned that the tree is “the love of God, which sheddeth itself abroad in the hearts of the children of men; wherefore, it is the most desirable above all things” ([[1 Ne. 11:22]]). That study notes that Nephi “never personifies wisdom at all,” but that his account of holding fast to the word of God on the path to the tree shares its terms with Proverbs 1–9.
    sources: [ot-minute-proverbs-1-9, sc-knowhy-325, von-feldt-instructional-wisdom, lds-scriptures]

  - ref: 19
    phrase: The LORD by wisdom hath founded the earth
    kind: symbol
    title: Built by wisdom
    body: |
      Verses 19–20 show the Lord as a builder who made the world with the same wisdom the father has been praising. A Latter-day Saint study points to the builder’s words, “founded” and “established”: God is “a divine architect that uses wisdom in building both heaven and earth,” and the cosmos is pictured as His house, which He then supplies with water (“the clouds drop down the dew”). Wisdom here is skill, “not just knowledge but also the ability to apply it.” It is the gift given to Bezaleel for building the tabernacle ([[Ex. 31:3]]). The study connects the verses with “Through wisdom is an house builded” ([[Prov. 24:3]]): a household built with wisdom follows the pattern God set in building His.

      Whether Wisdom here is more than an attribute of God, and how the Wisdom present at the creation in chapter 8 relates to Christ, is discussed at [[Prov. 8:22]].
    sources: [ot-minute-proverbs-1-9]

  - ref: 27
    phrase: Withhold not good from them to whom it is due
    kind: scripture
    title: Good owed to a neighbor
    body: |
      Verses 27–28 treat doing good to a neighbor as paying a debt. “Them to whom it is due” translates a form of *baʿal*, “lord, master, owner.” The good is pictured as already belonging to the person who needs it. One older reading explains him as “him to whom the good deed is done … him who is worthy of it,” and the command as refusing “nothing good … to him who has a right to it.” Verse 28 closes off the polite delay. “Go, and come again” is not a dismissal but a put-off, telling the neighbor to come back tomorrow for what could be given today.

      A study of King Benjamin’s sermon sets verse 27 beside his charge “ye ought to impart of the substance that ye have one to another” ([[Mosiah 4:21]]). A study of Proverbs reads verses 27–32 as the father’s counsel to care for the community: “To hurt others is the definition of wickedness, and to care for others is the definition of righteousness.”
    sources: [strongs-concordance, delitzsch-proverbs, von-feldt-instructional-wisdom, ot-minute-proverbs-1-9]

  - ref: 32
    phrase: 'For the froward is abomination to the LORD: but his secret is with the righteous'
    kind: words
    title: Abomination, and the Lord’s confidence
    body: |
      This is the first of more than ten places where Proverbs calls something an “abomination to the LORD” (*tôʿēbâ*; others are [[Prov. 6:16]] and [[Prov. 11:1]]). Elsewhere the word often has a ritual sense, as with unclean food or idols, but in Proverbs it is ethical: what the Lord detests is conduct. Here it is the “froward.”

      The contrast is *sôd*, “secret.” The word means a council, the counsel shared within it, and, as in this verse, intimate friendship. It is the word in Amos’s “he revealeth his secret unto his servants the prophets” ([[Amos 3:7]]). The upright are let into the Lord’s confidence. A Latter-day Saint study takes its title from this line and reads it as a clue that the wisdom of Proverbs 1–9 has “to do with the council of heaven and the mysteries of God.” That is its author’s reading, not a settled meaning of the word.
    sources: [bdb, von-feldt-instructional-wisdom]

  - ref: 34
    phrase: 'Surely he scorneth the scorners: but he giveth grace unto the lowly'
    kind: scripture
    title: Grace to the humble
    body: |
      James and Peter both quote this verse in a form close to the Greek translation, which reads “The Lord resists the proud; but he gives grace to the humble.” James writes, “God resisteth the proud, but giveth grace unto the humble” ([[James 4:6]]). Peter introduces it with “be clothed with humility” ([[1 Pet. 5:5]]). The Hebrew’s first line is different: there the Lord “scorneth the scorners.” (Who the scorner is in Proverbs is explained at [[Prov. 1:22]].)

      Both apostles use the verse to call the Saints to humility, and both draw from it the promise in its second line: the Lord gives His grace to the lowly.
    sources: [lxx-rahlfs, lds-scriptures]

christ: |
  Paul calls Christ “the power of God, and the wisdom of God” ([[1 Cor. 1:24]]) and says He “of God is made unto us wisdom” ([[1 Cor. 1:30]]). Nephi learned that the tree of life is “the love of God” ([[1 Ne. 11:22]]), and Alma taught that the word planted and nourished in the heart “will become a tree, springing up in you unto everlasting life” ([[Alma 33:23]]); a Latter-day Saint study reads Alma as teaching that inviting Jesus Christ into one’s life lets that tree grow within.

  A disciple who leans the whole weight of a life on the Lord, and not on his own understanding, has His promise to make the path straight ([[Prov. 3:5–6]]). When His correction comes, it is a sign of His love ([[Heb. 12:6]]), and with it He prepares “a way for their deliverance in all things out of temptation” ([[D&C 95:1]]). His grace is given to the humble ([[James 4:6]]).

explore: |
  - **A father’s counsel in the Book of Mormon.** Read Alma’s words to his sons ([[Alma 36–39]]) beside Proverbs 1–9; the Religious Studies Center’s “Words from the Wise: Alma 36–39 through the Lens of Proverbs 1–9” reads them together.
  - **The tree of life.** Follow it from [[Gen. 2:9]] and [[Gen. 3:22–24]] through [[1 Ne. 8:10–12]], [[1 Ne. 11:21–25]] and [[Alma 32:37–43]] to [[Rev. 22:2]].
  - **The Lord’s chastening.** Read [[Heb. 12:5–11]] with [[D&C 95:1]], [[D&C 101:4–5]] and [[Hel. 15:3]].
  - **Grace to the humble.** Read [[James 4:6–10]], [[1 Pet. 5:5–7]] and [[Ether 12:27]].

parallels:
  - ref: Heb. 12:5–6
    note: Hebrews quotes verses 11–12, in the Greek translation’s wording.
  - ref: James 4:6
    note: James quotes verse 34, “God resisteth the proud, but giveth grace unto the humble.”
  - ref: 1 Pet. 5:5
    note: Peter quotes verse 34 after “be clothed with humility.”
  - ref: 1 Ne. 8:10–12
    note: Lehi’s tree of life, whose fruit made him happy (compare verses 13–18).

