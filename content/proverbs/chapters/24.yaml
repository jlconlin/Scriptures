  - **Leaving judgment to God.** [[Prov. 20:22]], [[Rom. 12:17–21]] and [[D&C 64:9–11]], beside verses 17–18 and 29.
  - **The sluggard.** [[Prov. 6:6–11]] and [[Prov. 26:13–16]], beside verses 30–34.

