chapter: 24
title: A Just Man Falleth Seven Times
tagline: The last of the words of the wise, on envying the wicked, rescuing those led to death and not gloating over a fallen enemy; then a short supplement on judging fairly, honest answers, repaying wrongs and the sluggard's ruined field.
when: 'The words of the wise'

setting: |
  Chapter 24 finishes one collection and adds a short second one. Verses 1–22 are the end of the “Words of the Wise” that began at [[Prov. 22:17]], where the note says how this section resembles an Egyptian wisdom book. The teacher still speaks to “My son” (verses 13 and 21), and the counsels come in every length, from two-line sayings (verses 7–10) to one of six lines (verses 11–12).

  At verse 23 a new heading stands: “These things also belong to the wise.” Verses 23–34 are a second, shorter collection of sayings of the wise, headed “Further Sayings of the Wise” in a modern translation. They close with a short poem on the sluggard whose last two verses repeat [[Prov. 6:10–11]].

  Several sayings have their full treatment in other chapters: the house that wisdom builds (verses 3–4; [[Prov. 14:1]]), counsel and safety (verse 6; [[Prov. 11:14]]), the gate (verse 7; [[Prov. 22:22]]), and the refusal to pay back a wrong (verse 29; [[Prov. 20:22]]). Verse 19 is a variation of the opening words of [[Ps. 37:1]].

thread: |
  Like the sayings before it, this chapter is a string of separate counsels, but one warning frames its first half: do not envy evil men (verses 1 and 19), a warning the book gives in several forms ([[Prov. 3:31]]; [[Prov. 23:17]]). The reason, given the second time, turns on a word the King James renders “reward.” Wisdom, like honey, gives the one who finds it a “reward,” and his “expectation shall not be cut off” (verse 14); but “there shall be no reward to the evil man” (verse 20). The Hebrew word in both verses is the “end” of [[Prov. 23:18]] (see the note there), “a future, i.e. a happy close of life,” promised to the righteous and “withheld from the wicked.” Envy, in one older reading, “regards the present, and looks not on to the end”; the sayings look at how a life ends.

  Between the two warnings stand counsels about other people's falls: the man being led to his death whom the hearer could rescue (verses 11–12), the righteous man who falls and gets up again (verse 16), and the enemy whose fall must not be enjoyed (verses 17–18). The supplement at verse 23 turns to the court (verses 23–25 and 28) and to answering and repaying (verses 26 and 29), and it ends with something the teacher saw: a field gone to thorns, from which he “received instruction” (verse 32).

sections:
  - range: 1-9
    heading: Envy of the wicked, and the house wisdom builds
    plain: |
      Do not envy evil men or want their company, for their hearts plot violence and their lips talk of harm. A house is built by wisdom and made firm by understanding, and by knowledge its rooms are filled with precious and pleasant riches (see [[Prov. 14:1]]). A wise man is strong, and a man of knowledge grows in strength, for war is waged by wise counsel, and in many counselors there is safety (see [[Prov. 11:14]]). Wisdom is out of the fool's reach; in the assembly at the gate he has nothing to say. Whoever plans evil will be known as a schemer. The scheming of folly is sin, and people detest the scorner (see [[Prov. 1:22]]).
  - range: 10-12
    heading: Strength in trouble, and the duty to rescue
    plain: |
      If you give way in the day of trouble, your strength is small. Rescue those who are being taken away to death and those staggering toward slaughter. If you say, “We did not know,” does not the One who weighs hearts see it? Does not the One who keeps your soul know it? And will He not repay each person by what he has done?
  - range: 13-22
    heading: The future of the wise and of the wicked
    plain: |
      My son, eat honey, for it is good, and honey from the comb is sweet to the taste. Know that wisdom is like honey for your soul: if you find it, you have a future, and your hope will not be cut off. Do not lie in wait, wicked man, against the home of the righteous, or plunder his resting place, for the righteous man falls seven times and gets up again, but the wicked are brought down by calamity. Do not rejoice when your enemy falls or be glad when he stumbles, lest the LORD see it and be displeased, and turn His anger away from him. Do not fret over evildoers or envy the wicked (the words of [[Ps. 37:1]]), for the evil man has no future, and the lamp of the wicked will go out. My son, fear the LORD and the king, and do not associate with those given to change, for their ruin will come suddenly, and who knows the destruction that will fall on them both?
  - range: 23-29
    heading: 'Further sayings of the wise: the court and the tongue'
    plain: |
      These too are sayings of the wise. Partiality in judgment is not good. Peoples will curse and nations detest whoever says to the guilty, “You are in the right,” but those who convict the guilty will fare well, and a good blessing will come on them. An honest answer is like a kiss on the lips. Put your work in the fields in order and get it ready, and after that build your house. Do not testify against your neighbor without cause, or deceive with your lips. Do not say, “I will do to him what he did to me; I will pay the man back for what he has done.”
  - range: 30-34
    heading: The field of the slothful
    plain: |
      I went past the field of a lazy man, the vineyard of a man without sense, and it was all overgrown with thorns; nettles covered the ground, and its stone wall was broken down. I looked, I thought it over, and I learned from it: a little sleep, a little slumber, a little folding of the hands to rest, and poverty will come on you like a man on the march, and want like an armed man.

notes:
  - ref: 10
    phrase: thy strength is small
    kind: prophets
    title: Strength in the day of adversity
    body: |
      The saying measures strength by how it holds in trouble. “Adversity” is *tsarah*, “straits, distress,” and “small” is *tsar*, “narrow, tight”: in the lexicon the line reads “thy strength will be narrow, limited,” though it marks that reading of the word as uncertain.

      Adversity also has a purpose. Elder ElRay L. Christiansen taught that “the Lord permits the bitter to be mixed with the sweet. He knows that our individual faith must be tested in adversity as well as in serenity.” He also taught, “Even in times of trouble and tribulation, the gospel of Christ offers encouragement and gives assurance.”
    sources: [bdb, ot-manual-proverbs]

  - ref: 11
    phrase: them that are drawn unto death
    kind: history
    title: Those led away to death
    body: |
      The people of verse 11 are being taken to their death, and the saying requires the hearer to save them if he can: “Rescue those being led away to death,” in a modern translation. In one older reading they are condemned men “led to the tribunal,” and the verse “speaks of one condemned to death generally, and not expressly of one innocently condemned.”

      The excuse of verse 12, “we knew it not,” claims, in the same reading, that one did not know “that matters had come to an extremity with them.” It fails before God, “he who weighs the heart.” He who keeps the hearer's soul knows what the hearer knew, and He will “render to every man according to his works” (verse 12). Those words come back in verse 29.
    sources: [niv, delitzsch-proverbs, nrsvue]

  - ref: 16
    phrase: a just man falleth seven times, and riseth up again
    kind: words
    title: Falling and rising again
    body: |
      The righteous man's rising again is the reason (“For”) for the warning of verse 15: “Lay not wait, O wicked man, against the dwelling of the righteous.” Modern translations read it “though they fall seven times, they will rise again, but the wicked are overthrown by calamity,” or “the wicked stumble when calamity strikes.”

      So the contrast is not between a man who falls and a man who never does. Both fall; the righteous man gets up.
    sources: [nrsvue, niv]

  - ref: 18
    phrase: and he turn away his wrath from him
    kind: scripture
    title: Why not gloat over an enemy
    body: |
      Verse 18 can sound as though the hearer should hide his joy so that his enemy's punishment will go on; in one older reading, the reason not to gloat is rather to escape God's displeasure. The saying “extends the duty of love even to an enemy”; its point is not that one should keep from gloating so as not to interrupt “the process of the destruction of his enemy,” but that one should “abstain from this joy, so as not to experience the manifestation of God's displeasure thereat.” The LORD may turn His anger away from the enemy, and the one who rejoiced is left with God's displeasure.
    sources: [delitzsch-proverbs]

  - ref: 21
    phrase: meddle not with them that are given to change
    kind: words
    title: Those given to change
    body: |
      “Them that are given to change” are, in one older reading, men “otherwise disposed” toward God and the king: “dissidents, oppositionists, or revolutionaries, who recognise neither the monarchy of Jahve, the King of kings, nor that of the earthly king.” In the same reading, to “meddle” with them is “to make common cause with him.” The translations do not agree on the line. The Hebrew says “do not associate with those who change”; one modern translation, following the Greek, reads “do not disobey either of them,” and another “do not join with rebellious officials.”

      Who “them both” are in verse 22 is not certain. A modern translation makes them the LORD and the king (“those two will send sudden destruction”), and one older reading rejects that: “Certainly not to Jahve and the king.”
    sources: [delitzsch-proverbs, nrsvue, niv]

  - ref: 23
    phrase: It is not good to have respect of persons in judgment
    kind: history
    title: Respect of persons in court
    body: |
      “Respect of persons in judgment” is partiality in court, “Partiality in judging” in a modern translation. Moses used the same phrase in his charge to Israel's judges, “Ye shall not respect persons in judgment,” and gave the reason: “the judgment is God's” ([[Deut. 1:17]]).

      Verses 24–25 show the partial judge at work. He says to the guilty, “Thou art righteous,” a verdict, in a modern translation “You are innocent.” His opposite is the judge who rebukes the guilty man, “those who convict the guilty.”
    sources: [nrsvue, lds-scriptures, niv]

  - ref: 26
    phrase: Every man shall kiss his lips that giveth a right answer
    kind: symbol
    title: A kiss on the lips
    body: |
      The saying sets an honest answer beside a kiss on the lips. The King James has the hearers kiss the lips of the one who answers rightly; modern translations make the answer itself the kiss: “One who gives an honest answer gives a kiss on the lips,” and “An honest answer is like a kiss on the lips.”
    sources: [nrsvue, niv]

christ: |
  The One who weighs the heart and will “render to every man according to his works” (verse 12) is the LORD, Jehovah, the premortal Jesus Christ (see [[Ex. 3:14]]). The Church's footnote at verse 12 points to His own words: “the Son of man shall come in the glory of his Father with his angels; and then he shall reward every man according to his works” ([[Matt. 16:27]]). Verse 29 puts nearly the same words in the mouth of a man who means to repay a wrong himself, “I will render to the man according to his work.” In one older reading the line echoes verse 12, and the wronged man “ought to commit his case to God” instead (see [[Prov. 20:22]]).

  The Lord's word to the Saints in this dispensation draws the same line: “ye ought to say in your hearts—let God judge between me and thee, and reward thee according to thy deeds” ([[D&C 64:11]]). Because the reckoning is Christ's, a disciple who has been wronged can leave it with Him and is free to love the enemy, as the Savior taught ([[3 Ne. 12:44]]).

explore: |
