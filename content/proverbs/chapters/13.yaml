chapter: 13
title: The Son Who Hears
tagline: A string of separate sayings that opens with a son who hears his father's instruction and, near its end, lays on the father the duty to give it. Between them, riches pretended and real, and the pride that yields nothing but strife.
when: 'The proverbs of Solomon'

setting: |
  Chapter 13 belongs to the first long collection of single sayings in Proverbs, which begins with its own heading, “The proverbs of Solomon,” at [[Prov. 10:1]] (where the heading is explained) and runs until “the words of the wise” at [[Prov. 22:17]]. It is a string of two-line sayings, most of them built on a contrast between the two lines; a Latter-day Saint study of the form takes verse 9 of this chapter as its example of a saying that “differentiates the righteous from the wicked.” The form is explained in the volume guide, [Hebrew Poetry](/old-testament/guides/hebrew-poetry/#parallelism).

  Verse 24 is where the book's sayings on a father's rod are taken up in full; the others ([[Prov. 19:18]], [[Prov. 22:15]], [[Prov. 23:13–14]], [[Prov. 29:15]]) point here.

thread: |
  Chapter 13 is a string of separate sayings, and it does not argue from its first verse to its last: as one older reading says of this whole collection, no saying “stand[s] in necessary connection with one that precedes or that follows; each is in itself a small perfected and finished whole.” Most set two kinds of people side by side: the wise son and the scorner, the sluggard and the diligent, the righteous and the wicked, the companion of the wise and the companion of fools.

  Two subjects return. The first is the son and his instruction. The chapter opens with a son who hears his father's *musar*, his “instruction” or discipline (verse 1); it honors the one who heeds reproof (verse 18); and near its end it lays the duty on the father, who gives that discipline early (verse 24, where the same word stands behind “chasteneth”). The second is wealth: riches pretended and real (verse 7), riches that ransom a life (verse 8), wealth “gotten by vanity” and wealth gathered by labor (verse 11), an inheritance left to grandchildren (verse 22), and the poor man's field that injustice sweeps away (verse 23). Verses 21, 22 and 25 say how things go for the righteous and the wicked. The book's message is that “if you seek wisdom—especially God’s wisdom—life will go well”; how such sayings are read when a life does not go so is taken up at [[Prov. 22:6]].

sections:
  - range: 1-6
    heading: Listening, speaking and the upright way
    plain: |
      A wise son listens to his father's correction, but a mocker will not listen to a rebuke (the mocker is described at [[Prov. 1:22]]). A man enjoys good things from the fruit of his mouth, but transgressors get violence to eat. Whoever guards his mouth guards his life; whoever opens his lips wide comes to ruin. The sluggard craves and gets nothing (the sluggard is drawn at [[Prov. 6:6]]), but the diligent are fully satisfied. A righteous man hates lies, but a wicked man is loathsome and comes to shame. Righteousness guards the one whose way is upright, but wickedness overthrows the sinner.
  - range: 7-11
    heading: Riches real and pretended, with sayings on light and pride
    plain: |
      One man pretends to be rich and has nothing; another pretends to be poor and has great wealth. A man's riches may have to ransom his life, but the poor man hears no threat (or, on another reading, pays no heed to a rebuke). The light of the righteous shines gladly, but the lamp of the wicked goes out. Pride produces nothing but quarreling; wisdom is with those who take advice. Wealth gotten by vanity dwindles, but whoever gathers it by labor increases it.
  - range: 12-19
    heading: Desire, the word and instruction
    plain: |
      Hope put off makes the heart sick, but a longing fulfilled is a tree of life (the image is explained at [[Prov. 3:18]]). Whoever despises the word will be destroyed, but whoever reveres the commandment will be rewarded. The law of the wise is a spring of life, to turn a person from the snares of death. Good sense wins favor, but the way of transgressors is hard. Every prudent man acts with knowledge, but a fool spreads out his folly. A wicked messenger falls into trouble, but a faithful envoy brings health. Poverty and shame come to the one who refuses instruction, but whoever heeds reproof is honored. A longing fulfilled is sweet to the soul, but fools hate to turn away from evil.
  - range: 20-25
    heading: Companions, reward and the son
    plain: |
      Whoever walks with the wise becomes wise, but the companion of fools is ruined. Evil chases sinners, but the righteous are repaid with good. A good man leaves an inheritance to his grandchildren, and the sinner's wealth is stored up for the righteous. The fallow ground of the poor can yield plenty of food, but some are swept away through injustice. Whoever holds back his rod hates his son, but whoever loves him disciplines him early. The righteous eats until he is satisfied, but the stomach of the wicked goes empty.

notes:
  - ref: 7
    phrase: There is that maketh himself rich, yet hath nothing
    kind: words
    title: Pretending to be rich
    body: |
      The verse is about appearances: some people put on a show of wealth they do not have, and others hide wealth they do. Both Hebrew verbs are reflexive, “maketh himself”: the man of the first line is not getting rich by his own effort but passing himself off as rich. Two modern translations put it plainly: “Some pretend to be rich yet have nothing; others pretend to be poor yet have great wealth.”
    sources: [oshb-wlc, nrsvue, esv]

  - ref: 8
    phrase: 'The ransom of a man’s life are his riches: but the poor heareth not rebuke'
    kind: history
    title: What riches buy
    body: |
      The first line is plain: a rich man's money can buy back his life. The second is read two ways. The Hebrew word, *ge'arah*, is a rebuke, and one modern translation takes the poor man as one who “pays no attention to a rebuke.” Another reads that the poor man “hears no threat,” and one older reading explains the pair that way: the threat is to life, from robbers like those of [[Prov. 1:11–14]] or “in the times of war and commotion.” The rich man may have to hand over his riches as a ransom, while the poor man has nothing worth taking, so that “his poverty places the poor man in safety.”

      On that reading the saying is an observation, not a judgment of the poor: it notices that “riches endanger the life of their possessor,” while the poor man's poverty keeps him safe.
    sources: [bdb, nrsvue, esv, delitzsch-proverbs]

  - ref: 10
    phrase: Only by pride cometh contention
    kind: prophets
    title: Pride and contention
    body: |
      President Ezra Taft Benson used this verse to teach that contention is a form of pride. “Another face of pride is contention,” he said, and he drew the circle wide: “Arguments, fights, unrighteous dominion, generation gaps, divorces, spouse abuse, riots, and disturbances all fall into this category of pride.” Then he gave this verse as the scripture's word: “only by pride cometh contention.”

      Two modern translations render the word for pride as “insolence,” and one reads the line as a statement of what pride produces: “By insolence comes nothing but strife.” The second line sets the remedy beside it: wisdom belongs to those willing to take advice. Pride itself is the subject at [[Prov. 16:18]].
    sources: [benson-pride, nrsvue, esv]

  - ref: 23
    phrase: there is that is destroyed for want of judgment
    kind: words
    title: Without justice
    body: |
      “For want of judgment” here means through injustice, not for lack of good sense. The Hebrew is *belo mishpat*, “without right,” the same words the King James renders “great revenues without right” at [[Prov. 16:8]]. The “tillage” of the first line is *nir*, “the tillable, untilled or fallow ground,” which the lexicon reads as yielding abundant food for the poor with the LORD's blessing.

      Two modern translations read the verse as one picture: the field of the poor may yield much food, “but it is swept away through injustice.” The poor man's harvest is lost to someone else's wrong, not to his own mistake.
    sources: [oshb-wlc, bdb, nrsvue, esv]

  - ref: 24
    phrase: 'He that spareth his rod hateth his son: but he that loveth him chasteneth him betimes'
    kind: history
    title: The rod
    body: |
      The verse speaks of a real rod, and the Church reads it as a call to loving, consistent discipline, never as permission for violence. The Hebrew *shevet* is a “rod, staff, club, sceptre,” and in this saying, as one older reading puts it, “The rod represents here the means of punishment.” A saying later in the book speaks of beating with it: “if thou beatest him with the rod, he shall not die” ([[Prov. 23:13]]).

      The second line asks for something more than punishment. “Chasteneth him betimes” is in Hebrew “seeks him early (with) discipline”: the verb is to “look early, diligently for,” and the noun, *musar*, is “discipline, chastening, correction,” the word translated “instruction” in verses 1 and 18. Modern translations have “diligent to discipline,” and one gives “disciplines him early” in a footnote. The father who loves his son is the one who takes the trouble to teach him while he is young.

      The Church's own word on this verse and [[Prov. 22:15]] is that they “are best understood as figurative expressions emphasizing the importance of loving and consistent discipline. They should not be used as a justification for physical abuse.” The proclamation on the family warns that those “who abuse spouse or offspring … will one day stand accountable before God.” President Gordon B. Hinckley put it plainly: “In terms of physical abuse, I have never accepted the principle of ‘spare the rod and spoil the child.’” And again: “Children don’t need beating. They need love and encouragement.”

      Setting beside it the rod of iron that is the word of God ([[1 Ne. 15:23–24]]) and the shepherd's rod that comforts ([[Ps. 23:4]]), one Latter-day Saint study offers a further reading, as a choice and not a translation: “one might choose to read” the verse as “They who withhold the word of God hateth their children.”

      The Lord's own chastening of His children is a different matter, taken up at [[Prov. 3:11]].
    sources: [bdb, delitzsch-proverbs, nrsvue, esv, oshb-wlc, scripture-helps-proverbs, family-proclamation, hinckley-save-children, newell-rearing-children]

christ: |
  The Lord corrects those He loves: “whom I love I also chasten that their sins may be forgiven” ([[D&C 95:1]]). Modern revelation gives the pattern for such correction, persuasion and “love unfeigned,” reproof “when moved upon by the Holy Ghost; and then showing forth afterwards an increase of love toward him whom thou hast reproved” ([[D&C 121:41–43]]), and the Church's footnote at verse 24 points to King Benjamin's charge to parents ([[Mosiah 4:14]]), which goes on, “ye will teach them to walk in the ways of truth and soberness” ([[Mosiah 4:15]]).

  A parent's discipline now follows that pattern: early and diligent, as verse 24 asks, and given “in love and righteousness and never by force or violence.” Its aim is the son of verse 1, who hears his father's instruction.

explore: |
  - **Correction in love.** [[D&C 121:41–46]], [[Mosiah 4:14–15]] and [[Heb. 12:5–11]].
  - **Pride and contention.** [[Prov. 28:25]] and [[3 Ne. 11:29–30]].
  - **The rod and the word.** [[1 Ne. 15:23–24]] and [[Ps. 23:4]]. The study “Rearing Children in Love and Righteousness: Latitude, Limits, & Love,” in *By Divine Design* (Religious Studies Center, 2014), sets this verse among the prophets' teaching on discipline.

