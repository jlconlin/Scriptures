chapter: 22
title: Train Up a Child
tagline: The last of Solomon's sayings, on a good name, the rich and the poor, and the child trained in the way he should go; then the words of the wise begin, with a call to listen and a warning not to rob the poor in the gate.
when: 'The proverbs of Solomon; the words of the wise'

setting: |
  Chapter 22 is where one collection ends and another begins. Verses 1–16 close the proverbs of Solomon proper, the two-line sayings that began under the heading at [[Prov. 10:1]]. At verse 17 a teacher calls the hearer to “hear the words of the wise,” and the section called the “Words of the Wise” runs from here to [[Prov. 24:22]]. The resemblance of this section to an Egyptian wisdom book is taken up in the note at verse 17. The site's divisions follow whole chapters, so this chapter stays with the proverbs of Solomon, and the division *The Words of the Wise* begins with chapter 23.

  Several sayings point to places where their subject is treated in full: the strange woman of verse 14 ([[Prov. 2:16]]), the rod of verse 15 ([[Prov. 13:24]]), the surety of verses 26–27 ([[Prov. 6:1]]) and the ancient landmark of verse 28 ([[Deut. 19:14]]). Verse 6 takes up the question the sayings since chapter 10 keep raising: whether a proverb promises its outcome.

thread: |
  The first sixteen verses are a string of separate sayings, but one subject comes back in six of them: riches and the poor. A good name is worth more than great riches (verse 1); rich and poor have the same Maker (verse 2); humility and the fear of the LORD bring riches (verse 4); the rich rule the poor and the borrower serves the lender (verse 7); the generous man gives his bread to the poor (verse 9); and the man who oppresses the poor to grow rich comes to want (verse 16). Between them stand the sayings on the child (verses 6 and 15), the sluggard who will not go out for fear of a lion (verse 13), and the LORD who watches over knowledge (verse 12).

  At verse 17 the voice changes. The teacher speaks as “I” to “thee” and gives his reason: “That thy trust may be in the LORD” (verse 19). On one older reading, the first counsels that follow take up where Solomon's sayings stopped: verse 16 warned against oppressing the poor, and verses 22–23 forbid robbing the poor in court, because the LORD Himself will take their case. The chapter ends with sayings on the angry man, on pledges for debt, on boundary stones and on the skilled worker who serves kings.

sections:
  - range: 1-9
    heading: Riches, the poor and the right way
    plain: |
      A good name is better to choose than great riches, and goodwill better than silver and gold. The rich and the poor have this in common: the LORD made them all. A prudent man sees trouble coming and takes cover, but the simple go on and suffer for it. Humility and the fear of the LORD (see [[Prov. 1:7]]) bring riches, honor and life. Thorns and snares lie on the path of the perverse, and whoever guards his soul keeps far from them. Train a child in the way he should go, and when he is old he will not leave it. The rich rule over the poor, and the borrower is the lender's servant. Whoever sows injustice will reap calamity, and the rod of his anger will fail. The generous man is blessed, for he shares his bread with the poor.
  - range: 10-16
    heading: Sayings on several subjects
    plain: |
      Drive out the scorner and contention goes with him; quarreling and insult come to an end. Whoever loves purity of heart and speaks graciously has the king for his friend. The eyes of the LORD keep watch over knowledge, and He overturns the words of the faithless. The sluggard says there is a lion outside and he will be killed in the street (see [[Prov. 6:6]]). The mouth of the strange woman is a deep pit, and the man the LORD is angry with falls into it (see [[Prov. 2:16]]). Folly is bound up in a child's heart, but the rod of correction drives it far away (see [[Prov. 13:24]]). Oppressing the poor to enrich oneself, and giving to the rich, lead only to loss.
  - range: 17-21
    heading: 'The words of the wise: a call to listen'
    plain: |
      Bend your ear and hear the words of the wise, and set your heart on what I teach. It is good to keep them inside you and have them ready on your lips. I have made them known to you today, to you yourself, so that your trust may be in the LORD. Have I not written you choice sayings of counsel and knowledge, to teach you what is right and true, so that you can bring back a true answer to those who sent you?
  - range: 22-29
    heading: The first of the words of the wise
    plain: |
      Do not rob the poor because he is poor, and do not crush the afflicted in court, for the LORD will plead their cause and take the life of those who rob them. Make no friend of an angry man, and do not go about with a hothead, or you will learn his ways and catch your soul in a snare. Do not be one who shakes hands on a pledge or guarantees another's debts (see [[Prov. 6:1]]): if you have nothing to pay with, why should your bed be taken out from under you? Do not move the ancient boundary stone your fathers set (see [[Deut. 19:14]]; again at [[Prov. 23:10]]). Do you see a man skilled in his work? He will serve kings, not obscure men.

notes:
  - ref: 6
    phrase: when he is old, he will not depart from it
    kind: scripture
    title: A saying, not a guarantee
    body: |
      Verse 6 gives the ideal pattern of a child's training, and the child keeps the agency to leave it. On the Latter-day Saint reading of the verse, parents are training up children “in the way of the gospel.” Proverbs as a whole assumes that right action leads to right outcomes (see [[Prov. 10:1]]); the next book in the Bible, Ecclesiastes, seems to answer that it is not that simple. Read as a guarantee, this verse “can bring equal heartache and undue anxiety to the parent whose child has chosen to exercise his or her agency to wander from the covenant path, even after a childhood of diligent training,” and some “erroneously conclude” that the parents must bear the blame.

      The Book of Mormon answers that conclusion. It “teaches its modern audience that God respects the agency of all his children and will never interfere with one's ability to choose” (see [[2 Ne. 2:27]]), and its faithful parents saw children leave anyway: the outcome “does not always follow the ideal pattern of Proverbs 22:6.” Alma the Younger became “a very wicked and an idolatrous man” ([[Mosiah 27:8]]) in spite of his father's teaching. Yet when he was racked for his sins, what came back to him was that teaching: “I remembered also to have heard my father prophesy unto the people concerning the coming of one Jesus Christ” ([[Alma 36:17]]). On this Latter-day Saint reading, the promise of the verse is that children “will carry with them (even into old age) the true and wholesome teachings they received in their youth.”

      Elder D. Todd Christofferson warned against reading the promises of God mechanically: “We ought not to think of God's plan as a cosmic vending machine where we (1) select a desired blessing, (2) insert the required sum of good works, and (3) the order is promptly delivered.”
    sources: [ot-minute-proverbs, cfm-ot-2026-37, matson-training-child, christofferson-relationship-god]

  - ref: 17
    phrase: hear the words of the wise
    kind: history
    title: The words of the wise, and an Egyptian book
    body: |
      With these words a new collection begins, the “Words of the Wise” (22:17–24:22). A modern translation, correcting the Hebrew from the Greek, prints the words as the section's heading. On one Latter-day Saint reading this section “is thought to have been influenced by an earlier Egyptian text called ‘The Instructions of Amenemope,’” an Egyptian wisdom text from about 1186 to 1069 BC that was published in 1923. Amenemope “parallels some of the concepts and language found in the biblical book of Proverbs, and indeed may have been the source or inspiration for some of its axioms.” Egyptian wisdom works, Amenemope among them, were study material in scribal schools, and such schools for officials are assumed, “even if there is no direct evidence,” to have existed at Judah's royal court.

      On this reading, the resemblance is not a copy: the Hebrew author “freely adapts the Egyptian material in order to express his own unique beliefs,” and the text shows where he puts them: the purpose of the teaching is “That thy trust may be in the LORD” (verse 19). The call to “apply thine heart” also appears at [[Prov. 2:2]], and it opens another unit at [[Prov. 23:12]].
    sources: [nrsvue, ot-minute-proverbs, von-feldt-instructional-wisdom, sc-knowhy-539, sc-knowhy-644]

  - ref: 20
    phrase: excellent things
    kind: words
    title: Excellent things, or thirty sayings
    body: |
      The Hebrew behind “excellent things” is uncertain, and several modern translations read “thirty sayings” instead. The word as written (the *ketiv*; on the terms see the note on [[Prov. 19:7]]) is *shilshom*, “three days ago,” used for “formerly”; the word to be read (the *qere*) is *shalishim*, from the word for an officer, “best explained as third man (in chariot).” The written word is “difficult” and the read one “impossible.” One older reading defends the *qere* as “without doubt … the authentic word”: “The name of the chief men … is transferred to the chief proverbs.” That is the sense of the King James' “excellent things.”

      A modern translation prints “thirty sayings” and marks it in its note as a conjecture, since the Hebrew means “in the past or noble”; other modern translations read the same. “Thirty” fits the section that follows, which “divides into roughly thirty parts, which is formally similar to Amenemope's thirty-chapter arrangement” (the Egyptian book of the previous note). The reading is a correction, not the word the Hebrew text writes or reads, and the King James keeps the Hebrew's own reading.
    sources: [oshb-wlc, bdb, delitzsch-proverbs, nrsvue, niv, esv, reformation-study-bible]

  - ref: 22
    phrase: neither oppress the afflicted in the gate
    kind: history
    title: The poor in the gate
    body: |
      “In the gate” means in court. Cases were heard at the city gate before its elders: Boaz went up to the gate and settled the right to redeem Naomi's land there, before “ten men of the elders of the city” ([[Ruth 4:1–2]]). Verse 23 names the one who will take the poor man's side: “the LORD will plead their cause,” and a modern translation says He “despoils of life those who despoil them.” The Church's footnote points to the same promise for the fatherless of [[Prov. 23:10]]: “For their redeemer is mighty; he shall plead their cause with thee” ([[Prov. 23:11]]).
    sources: [nrsvue, niv, lds-scriptures]

christ: |
  The LORD who made both the rich and the poor (verse 2) and who will “plead their cause” (verse 23) is Jehovah, the premortal Jesus Christ (see [[Ex. 3:14]]). The Church's footnote at verse 2 points to King Benjamin's reminder that all depend on the same Being for all they have ([[Mosiah 4:19]]; see the note on [[Prov. 19:17]]). The footnote at verse 23 points to the Lord's charge in this dispensation to a servant who should “plead the cause of the poor and the needy” ([[D&C 124:75]]).

  For a disciple who has received a remission of sins, giving to the poor belongs to keeping it, as King Benjamin taught ([[Mosiah 4:26]]), and is more than good neighborliness.

explore: |
  - **Teaching children, and their agency.** [[Deut. 6:6–7]] and [[D&C 68:25–28]], beside verse 6, with the Religious Studies Center's “Training Up a Child: Parenting in the Book of Mormon.”
  - **Rich and poor before God.** [[Mosiah 4:16–26]], beside verses 2, 9 and 16.

