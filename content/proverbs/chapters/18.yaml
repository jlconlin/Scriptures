chapter: 18
title: A Strong Tower
tagline: Twenty-four separate sayings, many of them about the mouth, from the fool who only wants to air his mind to the tongue that holds death and life. In the middle stand two strongholds, the name of the LORD and the rich man's wall that exists only in his imagination.
when: 'The proverbs of Solomon'

setting: |
  Chapter 18 belongs to the first collection of Solomon's proverbs, the separate two-line sayings that begin at [[Prov. 10:1]] (on the collection and how its sayings are read, see chapter 10's setting there).

  Two of its sayings are heard twice in the book. Verse 8, on the talebearer's words, returns word for word at [[Prov. 26:22]], in the collection copied out by Hezekiah's men, and the first line of verse 11 has already appeared at [[Prov. 10:15]]. Verse 22, on finding a wife, carries the one Joseph Smith Translation reading among the Church's footnotes to Proverbs.

  At verse 21, “Death and life are in the power of the tongue,” the Church's footnote points to the Savior's warning, “by thy words thou shalt be justified, and by thy words thou shalt be condemned” ([[Matt. 12:37]]), and to Alma's teaching that “our words will condemn us” ([[Alma 12:14]]).

thread: |
  The chapter is a string of separate sayings, not an argument, but one subject returns in nearly half of them: speech. The fool wants only to air his own mind (verse 2); his lips walk into quarrels and his mouth is his ruin (verses 6–7); the talebearer's words are swallowed like sweets (verse 8); the man who answers before he has heard is shamed (verse 13); the first speaker in a dispute sounds right until the other side is heard (verse 17); and the chapter's last group returns to the mouth's fruit, which its owner has to eat (verses 20–21). One older reading finds smaller groups. Verses 3–7 end in two sayings on the fool's lips. Verses 8–19 form a series opened by the talebearer and framed by the word “brother” (verses 9 and 19). Verses 20–24 are a group of their own.

  The second thing the chapter keeps returning to is what a person relies on and who stands with him. At its center are two refuges set side by side: the name of the LORD, into which the righteous runs, and the rich man's wealth, a high wall in his own imagination (verses 10–11). Around them are the people a life is lived among: the man who cuts himself off (verse 1), the offended brother harder to win back than a walled city (verse 19), the wife who is a gift of the LORD's favor (verse 22), and the one friend who clings closer than a brother (verse 24).

sections:
  - range: 1-7
    heading: The man who withdraws, and the fool's mouth
    plain: |
      The man who cuts himself off from others pursues his own desire and quarrels with all sound judgment (the Hebrew is uncertain; see the note). A fool takes no pleasure in understanding, only in showing what is in his own mind. When the wicked man comes, contempt comes with him, and with disgrace comes reproach. The words of a man's mouth are deep waters, and the spring of wisdom is a flowing brook. It is not good to show favor to the wicked and so deprive the righteous of justice. A fool's lips walk into quarrels, and his mouth asks for a beating. A fool's mouth is his ruin, and his lips are a trap for his own life.
  - range: 8-12
    heading: Gossip, idleness, and two strongholds
    plain: |
      The talebearer's words are like tasty morsels; they go down into the depths of a man (the saying comes again at [[Prov. 26:22]]). The man who is slack in his work is brother to the one who destroys. The name of the LORD is a strong tower; the righteous man runs into it and is set safe on high. The rich man's wealth is his fortified city, and in his imagination a high wall. Before a fall a man's heart is proud, and humility comes before honor (on pride before destruction, see [[Prov. 16:18]]).
  - range: 13-19
    heading: Hearing a matter out
    plain: |
      Whoever answers before he has heard is shown a fool and put to shame. A man's spirit can hold him up in sickness, but a crushed spirit, who can bear? The heart of the prudent gains knowledge, and the ear of the wise looks for it. A man's gift opens a way for him and brings him before the great (on gifts and bribes, see [[Prov. 17:8]]). The first to state his case seems right, until the other party comes and cross-examines him. The lot ends quarrels and settles the matter between the powerful (on the lot, see [[Prov. 16:33]]). An offended brother is harder to win back than a fortified city, and their quarrels are like the bars across a castle gate.
  - range: 20-24
    heading: The tongue, a wife, and friends
    plain: |
      A man's belly is filled with the fruit of his mouth; he is satisfied with what his lips produce. Death and life are in the tongue's power, and those who love to use it will eat its fruit. Whoever finds a wife finds a good thing and has received favor from the LORD. The poor man pleads, but the rich man answers harshly. A man with many companions may come to ruin (the Hebrew is disputed; see the note), but there is a friend who clings closer than a brother.

notes:
  - ref: 1
    phrase: 'Through desire a man, having separated himself, seeketh and intermeddleth with all wisdom'
    kind: words
    title: The man who cuts himself off
    body: |
      The verse can be read as a warning against cutting oneself off rather than as praise of the scholar who withdraws to study, as the King James can sound. “Intermeddleth” renders a verb meaning to “break or burst out in contention.” Where the King James has “all wisdom,” modern translations have “all sound judgment,” and they read the line against him: the one who isolates himself “seeks his own desire; he breaks out against all sound judgment,” or “An unfriendly person pursues selfish ends and against all sound judgment starts quarrels.” The reading is not certain: another modern translation marks the meaning of the Hebrew “uncertain,” and a change to the verb has also been proposed.
    sources: [bdb, esv, niv, nrsvue]
  - ref: 8
    phrase: 'The words of a talebearer are as wounds'
    kind: symbol
    title: Morsels swallowed whole
    body: |
      The talebearer's words are pictured as delicacies, not as blows. The Hebrew word the King James renders “wounds” means “bits greedily swallowed, dainties,” and modern translations read “The words of a whisperer are like delicious morsels.” The point of the image is that gossip is pleasant to take in: the hearer swallows it eagerly, and it goes down into “the innermost parts of the belly.” The saying is repeated word for word at [[Prov. 26:22]], among the sayings on quarrels and the whisperer who feeds them.
    sources: [bdb, esv]
  - ref: 10
    phrase: 'The name of the LORD is a strong tower'
    kind: symbol
    title: Two strongholds
    body: |
      Verses 10 and 11 set refuge in the LORD beside the rich man's confidence in his wealth. One older reading heads them “Two proverbs, of the fortress of faith, and of the fortress of presumption.” The righteous man runs into the name of the LORD “to hide himself behind its walls, and is thus lifted … high above all danger”; “is safe” is a verb meaning to be high, out of reach. The same verb describes the rich man's wall in verse 11: it is “high,” but only “in his own conceit,” a word that means “imagination.” The tower is the LORD's own name; the wall stands in the rich man's mind.

      The first line of verse 11 repeats [[Prov. 10:15]], where the rich man's wealth is his strong city and the poor man's poverty is his ruin. Placed after verse 10, it becomes the second of the two fortresses.
    sources: [delitzsch-proverbs, bdb, oshb-wlc]
  - ref: 22
    phrase: 'Whoso findeth a wife findeth a good thing'
    kind: scripture
    title: A good wife
    body: |
      The Joseph Smith Translation adds one word, “good”: “Whoso findeth a good wife hath obtained favor of the Lord.” The Hebrew has no adjective with “wife”; “good” stands alone as what is found. The Greek translation, the Septuagint, also has the adjective: it reads “He that has found a good wife has found favours, and has received gladness from God,” then adds a line of its own, “He that puts away a good wife, puts away a good thing.”

      The second line uses the words of Wisdom herself, “whoso findeth me findeth life, and shall obtain favour of the LORD” ([[Prov. 8:35]]), and a later saying puts it another way: “a prudent wife is from the LORD” ([[Prov. 19:14]]).
    sources: [lds-scriptures, mcconkie-poetic-writings, oshb-wlc, lxx-rahlfs]
  - ref: 24
    phrase: 'A man that hath friends must shew himself friendly'
    kind: words
    title: Many companions, and one friend
    body: |
      The King James line is good counsel, but the Hebrew can also be read as a warning: a man with many companions may come to ruin. The verb is disputed. As the Hebrew text has it, it means to be “broken in pieces,” that is, “ruined,” while the ancient translations reflect a slightly different word. Modern translations divide: one follows the Hebrew, “A man of many companions may come to ruin”; another marks the meaning of the Hebrew “uncertain,” follows those ancient translations, and reads “Some friends play at friendship.”

      Either way, the second line sets one friend against the companions of the first. The friend who “sticketh closer” is described by an adjective meaning “clinging, cleaving,” the word used of Israel, “ye that did cleave unto the LORD your God” ([[Deut. 4:4]]).
    sources: [bdb, esv, nrsvue]

christ: |
  “The name of the LORD is a strong tower” (verse 10). The LORD of the Old Testament is Jehovah, and “Jehovah is the premortal Jesus Christ” (on the name, see [[Ex. 3:14]]). King Benjamin names Him as the one refuge: “there shall be no other name given nor any other way nor means whereby salvation can come unto the children of men, only in and through the name of Christ, the Lord Omnipotent” ([[Mosiah 3:17]]). So he asked his people to “take upon you the name of Christ” ([[Mosiah 5:8]]).

  A disciple takes that name by covenant and, at the sacrament, witnesses being “willing to take upon them the name of thy Son” ([[D&C 20:77]]). The tower of verse 10 is that name, and unlike the rich man's wall, it is not imagined.

explore: |
  - **The tongue.** [[Prov. 12:18]], [[Prov. 15:4]], [[Matt. 12:34–37]] and [[James 3:2–12]].
  - **The talebearer.** [[Lev. 19:16]], [[Prov. 11:13]] and [[Prov. 26:20–22]].
  - **The LORD as refuge.** [[2 Sam. 22:2–3]], [[Ps. 18:2]] and [[Ps. 61:3]], where the Church's footnotes at verse 10 point.
  - **Friends.** [[Prov. 17:17]], [[Prov. 27:10]], [[John 15:13–15]] and [[D&C 84:63]].

