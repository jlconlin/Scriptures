chapter: 4
title: The Path of the Just
tagline: A father passes on what his own father taught him, sets two paths before his son, one growing brighter to full day and one lost in the dark, and tells him to guard the heart that every step comes from.
when: 'A father’s instruction, under Solomon’s name'

setting: |
  Chapter 4 belongs to the first collection of Proverbs (chapters 1–9), a father’s discourses on wisdom gathered under Solomon’s name ([[Prov. 1:1]]; on “my son,” see [[Prov. 1:8]]). The discourses are what an older and wiser person passes to a younger one.

  The father calls for a hearing three times, marking the chapter’s three sections: verse 1, “Hear, ye children”; verse 10, “Hear, O my son”; and verse 20, “My son, attend to my words.” The first part is about getting wisdom, the second about two paths, the third about the heart and the body that walks the path. In verses 3–4 the father quotes his own father, so that three generations stand in the chapter at once.

thread: |
  The chapter makes one argument three times over: **what you receive guides where you walk.**

  In verses 1–9 the father explains why he is teaching at all. He was once a son whose father taught him, and he repeats his father’s words: “Get wisdom.” Wisdom comes first, before anything else he can get. Wisdom is spoken of as a woman to be loved and held, who honors and crowns the one who holds her. The father wants his son to see that relationship “as the most important aspect of his life.”

  Verses 10–19 turn the teaching into a road. The father has led his son in “right paths” ([[Prov. 4:11]]), where he can run without stumbling. Beside it runs the path of the wicked, and the son is told four times in one verse to keep off it ([[Prov. 4:15]]). The two paths end in opposite light: the one brightens like dawn to full day, the other is so dark its walkers cannot see what trips them.

  Verses 20–27 turn to the walker’s body. Ear, eyes, heart, flesh, mouth, lips, eyelids and feet are each given a charge, and the heart, from which life flows, is the one to keep “with all diligence.” The chapter that began with a son receiving words ends with his feet: the path is kept by keeping what he has received.

sections:
  - range: 1-9
    heading: Get wisdom
    plain: |
      Children, listen to a father’s teaching and pay attention, so that you will gain understanding. What I give you is good teaching; don’t abandon it. I too was a son to my father, tender, my mother’s only darling. He taught me and said: “Hold my words fast in your heart. Keep my commandments, and you will live. Get wisdom, get understanding; don’t forget or turn away from what I say. Don’t abandon wisdom, and she will protect you; love her, and she will guard you. Wisdom comes first, so get wisdom; whatever else you get, get understanding. Prize her, and she will raise you up; hold her close, and she will bring you honor. She will set a graceful wreath on your head and give you a glorious crown.”
  - range: 10-19
    heading: Two paths
    plain: |
      Listen, my son, take in what I say, and you will live many years. I have taught you the way of wisdom and led you along straight paths. When you walk, nothing will hem you in; when you run, you will not stumble. Hold on to instruction and don’t let go; guard her, for she is your life. Don’t set foot on the path of the wicked or walk the road of evil men. Avoid it, don’t go near it, turn away from it, and keep going. They cannot sleep until they have done harm; sleep is taken from them unless they have brought someone down. Wickedness is the bread they eat and violence the wine they drink. But the path of the righteous is like the light of dawn, shining brighter and brighter until full day. The way of the wicked is like darkness; they don’t know what they are stumbling over.
  - range: 20-27
    heading: Keep thy heart
    plain: |
      My son, pay attention to my words and listen closely to what I say. Don’t let them out of your sight; keep them deep in your heart. They are life to those who find them and health to their whole body. Above everything else you guard, guard your heart, for from it flow the springs of life. Put crooked talk away from you, and keep twisted speech far off. Let your eyes look straight ahead and your gaze stay fixed in front of you. Make level the path for your feet, and all your ways will be sure. Don’t swerve to the right or the left; keep your foot away from evil.

notes:
  - ref: 3
    phrase: For I was my father’s son, tender and only beloved in the sight of my mother.
    kind: history
    title: Three generations of teaching
    body: |
      The father teaches his son what his own father taught him. He remembers being a son, “tender and only beloved” to his mother, and then quotes his father’s words: “Let thine heart retain my words: keep my commandments, and live” ([[Prov. 4:4]]). Nothing in the text names the speaker, the father or the grandfather; what matters is that the teaching has been handed down.

      The Book of Mormon has the same pattern in Alma’s counsel to his sons. Alma begins with Helaman much as this father does: “give ear to my words; for I swear unto you, that inasmuch as ye shall keep the commandments of God ye shall prosper in the land” ([[Alma 36:1]]). And Alma’s own life shows what a father’s words can do years later. In his torment he “remembered also to have heard my father prophesy unto the people concerning the coming of one Jesus Christ, a Son of God, to atone for the sins of the world” ([[Alma 36:17]]). It was only when he remembered his father’s teaching “that he was steered aright, that he called upon Christ.”
    sources: [allis-pike-words-wise, sc-knowhy-744]
  - ref: 7
    phrase: Wisdom is the principal thing; therefore get wisdom
    kind: words
    title: The principal thing, or the beginning of wisdom
    body: |
      “The principal thing” translates *rēʾshît*, the word for “beginning” or “chief,” the same word as in “The fear of the LORD is the beginning of knowledge” ([[Prov. 1:7]]). Here it can mean “chief thing,” or, as a modern translation reads it, the line can define where wisdom begins: “The beginning of wisdom is this: get wisdom.” Either way the verse puts getting wisdom first. (What wisdom is, skill as well as knowledge, is explained at [[Prov. 1:2]].)

      “Get” is *qānâ*, to acquire; in Proverbs it is used of acquiring wisdom, and elsewhere it is the ordinary word for “buy.” On one older reading, the second line names a price: give everything for understanding, as the man in the Savior’s parable “sold all that he had” for the pearl of great price ([[Matt. 13:46]]), for “no price is too high, no sacrifice too great for it.” A modern translation reads the line more simply: “whatever else you get, get insight.”
    sources: [bdb, nrsvue, delitzsch-proverbs]
  - ref: 7
    phrase: with all thy getting get understanding
    kind: prophets
    title: Understanding of what?
    body: |
      President Gordon B. Hinckley read this line as a call for an education beyond secular learning. In a 1988 First Presidency Message titled with the line, he wrote that with so much learning in the world, “There is need for another education, without which the substance of secular learning may lead only to destruction. I refer to the education of the heart, of the conscience, of the character, of the spirit.” Then he asked what the verse means by understanding:

      > Understanding of what? Understanding of ourselves, of the purposes of life, of our relationship to God who is our Father, of the great divinely given principles that for centuries have provided the sinew of man’s real progress!

      The three principles he named were gratitude, virtue and faith.
    sources: [hinckley-getting-understanding]
  - ref: 8
    phrase: she shall bring thee to honour, when thou dost embrace her
    kind: symbol
    title: Loving Wisdom
    body: |
      Wisdom in verses 5–9 is a woman, and the father’s verbs are the verbs of love: “Forsake her not … love her” ([[Prov. 4:6]]), “Exalt her … embrace her” ([[Prov. 4:8]]). “Because wisdom is personified as a woman, the son is encouraged to maintain a loving relationship with her,” and she answers in kind: she preserves, keeps, promotes and honors him, and at last sets “a crown of glory” on his head ([[Prov. 4:9]]). (Why wisdom is drawn as a woman at all is explained at [[Prov. 1:20]].)

      The image is about a relationship, not an abstraction. On one Latter-day Saint reading, it “is not a relationship to a disembodied ideal but rather a relationship with God and one’s family.”
    sources: [ot-minute-proverbs-1-9]
  - ref: 18
    phrase: the path of the just is as the shining light, that shineth more and more unto the perfect day
    kind: symbol
    title: Light that grows to full day
    body: |
      The righteous walk in a light that keeps growing, like morning toward noon. Proverbs speaks of two paths, wisdom and righteousness leading “to the path of life and light,” folly and wickedness “to the path of death and darkness,” and verses 14–19 are one of the places it does so (Psalm 1 sets out the same two ways; see [[Ps. 1:6]]). Here the father says what each looks like. On one older reading, the image moves from dawn, “the light of the rising sun,” to midday: “It is the midday time that is meant, when the clearness of the day has reached its fullest intensity.” A modern translation gives the same sense: “like the light of dawn, which shines brighter and brighter until full day.”

      Verse 19 gives the reverse. The way of the wicked is not dim but dark, and those on it “know not at what they stumble.” The righteous, on the other hand, walk a path that is bright, and they “can see things as they are.”

      Brigham Young used the verse against the idea that the Christian life is gloom, a path “spread with gins [snares], pitfalls, and uncertainties, but this is a mistake, for ‘the path of the just is as the shining light, that shineth more and more unto the perfect day.’” And of himself: “The faith I have embraced has given me light for darkness, ease for pain, joy and gladness for sorrow and mourning, certainty for uncertainty, hope for despair.”
    sources: [delitzsch-proverbs, nrsvue, ot-minute-proverbs-1-9, ot-minute-proverbs, ot-manual-proverbs]
  - ref: 20
    phrase: incline thine ear unto my sayings
    kind: scripture
    title: Ear, eyes, heart, mouth, feet
    body: |
      The last address goes through the body part by part. Ear, eyes and heart (verses 20–21), flesh (22), heart again (23), mouth and lips (24), eyes and eyelids (25), feet (26–27): each is given its own charge, and the father “cautions the son to be diligent and deliberate in walking the path of life.”

      On one Latter-day Saint reading, the passage points both to “the many ways we can go wrong,” as King Benjamin warned that he could not number them, “But this much I can tell you, that if ye do not watch yourselves, and your thoughts, and your words and your deeds, and observe the commandments of God … ye must perish” ([[Mosiah 4:30]]). And it is also “a reminder of the power of our bodies and the God-given power of agency to do good,” for “the power is in them, wherein they are agents unto themselves” ([[D&C 58:28]]).
    sources: [ot-minute-proverbs-1-9]
  - ref: 23
    phrase: Keep thy heart with all diligence; for out of it are the issues of life.
    kind: symbol
    title: The heart as a spring
    body: |
      The heart is the source from which a whole life flows, so it is to be guarded with all vigilance. (On the heart as the mind, see the note on [[Prov. 2:2]].)

      “Issues” is used in its older English sense, “The act of passing or flowing out,” as “an issue of water … from a spring.” The Hebrew, *tôṣʾôt*, is glossed here, with a question mark, “sources of life,” and a modern translation reads “for from it flow the springs of life.”
    sources: [webster-1828, bdb, nrsvue]
  - ref: 26
    phrase: Ponder the path of thy feet
    kind: words
    title: 'Ponder: weigh, or make level'
    body: |
      “Ponder” in the King James means more than to think something over. The English word meant “To weigh in the mind,” and the Hebrew verb, *pillēs*, means “weigh, make level”; with a path as its object, as here, it means “make level, smooth.” A modern translation reads “Keep straight the path of your feet.”

      One older reading holds that the line is about clearing the road more than measuring it: it means “the preparation of the way by the removal of that which prevents unhindered progress.” The Septuagint, the ancient Greek translation, reads “Make straight paths for thy feet,” and Hebrews, “make straight paths for your feet” ([[Heb. 12:13]]).
    sources: [webster-1828, bdb, nrsvue, delitzsch-proverbs, lxx-rahlfs]

christ: |
  The father’s own father says “keep my commandments, and live” ([[Prov. 4:4]]), and the Church’s footnote to “life” in verse 22 points to the Savior’s answer to the young man who asked how to have eternal life: “if thou wilt enter into life, keep the commandments” ([[Matt. 19:17]]). The footnote to “path” in verse 18 points to Nephi’s strait and narrow path, entered by the gate of baptism ([[2 Ne. 31:17–18]]), of which he says, “this is the way; and there is none other way nor name given under heaven whereby man can be saved in the kingdom of God” ([[2 Ne. 31:21]]).

  A parent’s teaching about Jesus Christ may be remembered years later, when it matters most, as Alma remembered his father’s prophecy of Christ and called on Him ([[Alma 36:17]]; see the note at [[Prov. 4:3]]). The path of the just, as verse 18 says, is not lit all at once: it grows brighter toward the perfect day.

explore: |
  - **Fathers who teach their sons.** Read Alma’s counsel in [[Alma 36:1–5]], [[Alma 37:35–37]] and [[Alma 38:1–5]] beside this chapter.
  - **The two ways.** [[Deut. 30:15–20]], [[Ps. 1]] and [[2 Ne. 2:27]].
  - **The path and the light.** [[2 Ne. 31:17–21]], and holding fast to the word in [[1 Ne. 15:23–24]], where the Church’s footnote to verse 13 points.

