chapter: 23
title: Buy the Truth
tagline: The words of the wise on the ruler's table, riches that fly away and the grudging host; on the fatherless and their mighty Redeemer; a father's plea, “My son, give me thine heart”; and a poem on the drunkard who wakes only to seek wine again.
when: 'The words of the wise'

setting: |
  Chapter 23 lies wholly within the “Words of the Wise,” the collection that began at [[Prov. 22:17]] with a teacher's call to “hear the words of the wise” and runs to [[Prov. 24:22]]. Its resemblance to the Egyptian *Instruction of Amenemope*, and the “thirty sayings” some modern translations find in it, are taken up at [[Prov. 22:17]] and [[Prov. 22:20]]. A modern translation that numbers the thirty counts the seventh through the nineteenth in this chapter, from the ruler's table of verse 1 to the poem on wine of verses 29–35.

  These are not the two-line sayings of [[Prov. 10:1]]–[[Prov. 22:16]]. Each counsel is a command with its reason (“for …”), and they run from two lines to a poem; one older reading notes that “all the forms of proverbs run through” them. The teacher speaks as “I” to “my son” (verses 15, 19, 26), and verse 12, with the call “Apply thine heart unto instruction,” begins a new part of the collection.

  Several counsels point to places where their subject is treated in full: the landmark of verse 10 ([[Deut. 19:14]]), the rod of verses 13–14 ([[Prov. 13:24]]), wine ([[Prov. 20:1]]) and the strange woman of verse 27 ([[Prov. 2:16]]).

thread: |
  The chapter is a run of separate counsels, but two subjects keep coming back: appetite and wealth. It opens at a ruler's table (verses 1–3), turns to the riches that fly away (4–5) and to the meal of a grudging host (6–8), warns against the company of drunkards and gluttons, who come to poverty (20–21), and ends with the drunkard who wakes only to look for wine again (29–35).

  Between the warnings the teacher's own voice grows. He calls the hearer to apply his heart (12), says his own heart and reins will rejoice when his son speaks right things (15–16), tells him not to envy sinners, for “surely there is an end” (17–18), sets father and mother beside himself and bids him “Buy the truth, and sell it not” (22–25), and asks, “My son, give me thine heart, and let thine eyes observe my ways” (26).

sections:
  - range: 1-8
    heading: Appetite and riches
    plain: |
      When you sit down to eat with a ruler, consider carefully what is set before you. Put a knife to your throat if you have a big appetite, and do not crave his delicacies, for that food deceives. Do not wear yourself out to get rich; cease from your own wisdom in the matter. Will you fix your eyes on what is already gone? Riches grow wings and fly off like an eagle into the sky. Do not eat the bread of a stingy man or crave his delicacies, for he is a man always counting the cost. “Eat and drink,” he says to you, but his heart is not with you. You will vomit up the morsel you have eaten and will have wasted your compliments.
  - range: 9-11
    heading: The fool, and the fields of the fatherless
    plain: |
      Do not speak to a fool, for he will scorn the wisdom of your words. Do not move the ancient boundary stone or take over the fields of orphans, for their Redeemer is strong, and He will take up their case against you.
  - range: 12-18
    heading: 'Apply thine heart: correction and hope'
    plain: |
      Set your heart on instruction and your ears on words of knowledge. Do not hold back correction from a child: if you strike him with the rod, he will not die; strike him, and you will save his life from Sheol (on the rod, see [[Prov. 13:24]]; on Sheol, [[Prov. 15:11]]). My son, if your heart is wise, my own heart will be glad; my inmost being (in Hebrew, “my kidneys”) will rejoice when your lips speak what is right. Do not let your heart envy sinners, but keep to the fear of the LORD all day long; for surely there is a future, and your hope will not be cut off.
  - range: 19-28
    heading: Hear thy father
    plain: |
      Listen, my son, be wise, and keep your heart on the way. Do not join those who drink too much wine or gorge themselves on meat, for the drunkard and the glutton come to poverty, and drowsiness dresses a man in rags. Listen to the father who gave you life, and do not despise your mother when she is old. Buy the truth and never sell it, and wisdom, instruction and understanding with it. The father of a righteous son will greatly rejoice, and whoever has a wise child will be glad in him. Let your father and mother be glad, and let her who bore you rejoice. My son, give me your heart, and let your eyes keep to my ways. For a harlot is a deep ditch, and the strange woman a narrow pit (see [[Prov. 2:16]]); she lies in wait like a robber and increases the number of the faithless.
  - range: 29-35
    heading: The drunkard
    plain: |
      Who has woe? Who has sorrow, quarrels, complaining, wounds for no reason, red eyes? Those who linger long over wine and go looking for mixed wine. Do not gaze at wine when it is red, when it sparkles in the cup and goes down smoothly. In the end it bites like a snake and stings like an adder. Your eyes will see strange things, and your heart will speak perverse things. You will be like a man lying down in the middle of the sea, or lying on top of a mast. “They hit me,” you will say, “and I was not hurt; they beat me, and I did not feel it. When will I wake up? I will go looking for it again.”

notes:
  - ref: 2
    phrase: put a knife to thy throat
    kind: symbol
    title: A knife to the throat
    body: |
      The knife is a figure of restraint: at a ruler's table a man of large appetite is to check it as if his life depended on it. In one older reading the words are a proverbial expression, and the teacher “means to say: restrain thy too eager desire by means of the strongest threatening of danger - threaten as it were death to it.” The “throat” is the organ of swallowing, and “a man given to appetite” is, in a modern translation, one “given to gluttony.”

      The same reading explains the danger. The host “is not thine equal, but one higher, who can destroy thee as well as be useful to thee,” so the guest is to “consider diligently what is before thee” (verse 1). And his dainties “are deceitful meat” (verse 3): food that “appears to secure for him the lasting favour of princes, and often enough herein deceives him.”
    sources: [delitzsch-proverbs, niv]

  - ref: 5
    phrase: riches certainly make themselves wings
    kind: symbol
    title: Riches with wings
    body: |
      Riches are pictured as a bird that is gone the moment a man looks for it. The first line, “Wilt thou set thine eyes upon that which is not?”, reads in a modern translation “When your eyes light upon it, it is gone,” and the eagle flies off “toward heaven,” out of reach.
    sources: [nrsvue]

  - ref: 7
    phrase: For as he thinketh in his heart, so is he
    kind: words
    title: As he thinketh
    body: |
      In its setting the saying describes the grudging host of verse 6, and its verb is about reckoning a cost. The man “that hath an evil eye” is, in modern translations, “the stingy” or “a begrudging host.” The verb rendered “thinketh,” *sha'ar*, means to calculate or reckon; a standard lexicon reads the line “as he has calculated in his soul, so is he,” while marking the reading “dubious.” Modern translations follow it: “like one who is inwardly calculating,” or one “always thinking about the cost.” The guest who praised such a meal will want to vomit it up (verse 8). The Hebrew is uncertain enough that another modern translation, noting that its meaning is uncertain, prints “like a hair in the throat.”

      The King James words have also been taken as a principle of the mind. In a talk on reading the Book of Mormon, by which, he said, “we will fill and refresh our minds,” President Marion G. Romney quoted them so: “Inevitably he gravitates toward the subjects of his thoughts. Ages ago the wise man thus succinctly stated this great truth: ‘As he thinketh in his heart, so is he.’” He went on to the counsel that “we must keep in our minds and in their minds true and righteous principles for our thoughts and their thoughts to dwell upon.” The verse's own subject is the host whose words and heart do not agree (“his heart is not with thee”); President Romney drew from its words that what a person becomes follows what he dwells on within.
    sources: [nrsvue, niv, esv, oshb-wlc, bdb, romney-book-of-mormon-1980]

  - ref: 11
    phrase: For their redeemer is mighty
    kind: history
    title: The Redeemer of the fatherless
    body: |
      The “redeemer” is the *go'el*, the kinsman whose part was to buy back a relative's lost land ([[Lev. 25:25]]; the word is explained at [[Deut. 19:6]]), and the saying says the fatherless have one who is strong. The “old landmark” of verse 10 is the boundary stone of Israel's law (see [[Deut. 19:14]]), and to move it “was the equivalent of stealing another's property.”

      The Church's footnote sets the verse beside a saying that names the one who takes up the case of the poor: “For the LORD will plead their cause” ([[Prov. 22:23]]). Modern translations render the title “Redeemer,” “Defender,” or “vindicator” (with a note, “Or redeemer”). Chapter 22's note on the poor in the gate ([[Prov. 22:22]]) treats the court in which the case is pleaded.
    sources: [ot-manual-proverbs, oshb-wlc, lds-scriptures, esv, niv, nrsvue]

  - ref: 18
    phrase: surely there is an end
    kind: words
    title: An end, and a hope
    body: |
      The “end” is a future, as modern translations render it, and the promise is that the hope of the one who fears the LORD will not come to nothing. The word is *'acharit*, and modern translations read “Surely there is a future,” or “There is surely a future hope for you,” and the second line “and your hope will not be cut off.”

      The promise gives the reason for verse 17: do not envy sinners, but keep to the fear of the LORD (see [[Prov. 1:7]]) “all the day long,” for that hope has a future.
    sources: [oshb-wlc, nrsvue, niv]

  - ref: 20
    phrase: 'Be not among winebibbers; among riotous eaters of flesh'
    kind: scripture
    title: The drunkard and the glutton
    body: |
      The pair of drunkard and glutton is the law's description of the rebellious son. In [[Deut. 21:20]] parents bring their son before the elders and say, “he is a glutton, and a drunkard.” In one older reading the “degenerate and perverse son is more clearly described” there by the same two words, and “These two characteristics the poet distributes between 20a and 20b.” The flesh is “the prepared flesh which they consume at their luxurious banquets,” and a modern translation speaks of those who “gorge themselves on meat.”

      The father who warns “my son” here (verse 19) gives the reason in the next verse: “the drunkard and the glutton shall come to poverty: and drowsiness shall clothe a man with rags” ([[Prov. 23:21]]). Wine itself, and the Lord's word on strong drink in this dispensation, are taken up at [[Prov. 20:1]].
    sources: [delitzsch-proverbs, niv]

  - ref: 34
    phrase: as he that lieth upon the top of a mast
    kind: symbol
    title: Asleep on top of a mast
    body: |
      The drunkard is pictured lying where no one could lie, and the poem ends with him waking only to drink again. It opens with a riddle, “Who hath woe? who hath sorrow?”, and answers it: “They that tarry long at the wine” (verses 29–30). Verse 31 describes the wine's appeal, red in the cup and, where the King James says it “moveth itself aright,” going down “smoothly,” as modern translations have it.

      Then the effects. In verse 33 the King James has “strange women,” and the Church's footnote offers “foreign women” (the strange woman is at [[Prov. 2:16]]); the Hebrew word, *zarot*, is “strange” in the plural, and modern translations read “strange things.” The man is like one lying down “in the midst of the sea,” or on top of a mast. A standard lexicon gives “probably mast,” a word found “only in simile of drunken man,” and pictures him “in the lookout-basket at the mast-head”; a modern translation offers “rigging” in its note.

      In verse 35 he has been struck and has not felt it, and his first thought on waking is “I will seek it yet again,” or in a modern translation, “I will seek another drink.”
    sources: [lds-scriptures, nrsvue, oshb-wlc, bdb, esv]

christ: |
  The Redeemer of the fatherless in verse 11 is the LORD. One older reading calls Him “a mighty Saviour, Redemptor, who will restore to them that which they have lost - viz. God,” and points to Jeremiah: “Their Redeemer is strong; the LORD of hosts is his name: he shall throughly plead their cause” ([[Jer. 50:34]]). The LORD is Jehovah, the premortal Jesus Christ (see [[Ex. 3:14]]), and “Jesus Christ is the great Redeemer of mankind because He, through His Atonement, paid the price for the sins of mankind and made possible the resurrection of all people.”

  The Church's footnote at verse 4 points to Jacob, who set riches in their place: “before ye seek for riches, seek ye for the kingdom of God. And after ye have obtained a hope in Christ ye shall obtain riches, if ye seek them; and ye will seek them for the intent to do good” ([[Jacob 2:18–19]]). So “Labour not to be rich” reaches a disciple as an order of seeking: the kingdom of God and a hope in Christ first, and riches, if they come, held “to clothe the naked, and to feed the hungry” ([[Jacob 2:19]]).

explore: |
  - **The rebellious son.** [[Deut. 21:18–21]], beside verses 19–21.
  - **Riches in their place.** [[Jacob 2:12–19]], beside verses 4–5, where the Church's footnote points.
  - **The Word of Wisdom.** [[D&C 89]]; the Church's footnotes at verses 2 and 21 point to the Topical Guide's “Word of Wisdom.”

