chapter: 31
title: Who Can Find a Virtuous Woman?
tagline: The last chapter of Proverbs. A queen mother tells her son the king to keep his strength from women and wine and to open his mouth for those who cannot speak; then a poem from aleph to tav praises a woman of strength whose works praise her in the gates.
when: 'The words of Lemuel'

setting: |
  Proverbs ends with two pieces. The first is “The words of king Lemuel, the prophecy that his mother taught him” (verses 1–9), a mother's counsel to her son on how to be a king. Of Lemuel nothing is known beyond his name; he is thought to have been a king from outside Israel. His words stand after the words of Agur ([[Prov. 30:1]]).

  The second is the poem of verses 10–31. It “does not have a distinct heading,” and the Church's outline of the book sets it with “the words of King Lemuel’s mother to King Lemuel,” which “include a description of a virtuous woman.” It is an acrostic: in the Hebrew each of its twenty-two verses begins with the next letter of the alphabet, a pattern no translation can show (see [Hebrew Poetry](/old-testament/guides/hebrew-poetry/#acrostics)). Acrostics in general were likely “a mnemonic device or memorization tool,” a help to learning a poem by heart. What the woman is called, *'eshet chayil*, and why “woman of strength” renders it better than “virtuous woman,” is explained in [Women and marriage in the Old Testament](/old-testament/guides/women-and-marriage/#valued); the note on verse 10 says what is the poem's own.

thread: |
  The mother's counsel is about what a king does with his strength and his mouth. He is not to spend his strength on women, or on what has ruined kings before him (verse 3); he is not to drink, lest he “forget the law, and pervert the judgment of any of the afflicted” (verse 5). What he is to do with his mouth is said twice: “Open thy mouth for the dumb,” “Open thy mouth, judge righteously, and plead the cause of the poor and needy” (verses 8–9).

  The poem then draws a woman as the book's last picture, and the Church reads her as the outcome of living by the wisdom the whole book has taught. She is praised for what she does, and the text is concrete about it: she buys wool and flax, trades like a merchant ship, rises before dawn, buys a field and plants a vineyard from her earnings, sells linen, clothes her household against the winter, and opens her hand to the poor. A long part of the poem is a description of her “economic enterprises” (verses 13–22). She “openeth her mouth with wisdom,” and kindness is the law on her tongue (verse 26). The poem ends on what lasts: charm deceives and beauty passes, but “a woman that feareth the LORD, she shall be praised” (verse 30) (on that fear, see [[Prov. 1:7]]). Her own works are to praise her “in the gates,” where her husband sits among the elders (verses 23, 31).

sections:
  - range: 1-3
    heading: A mother's words to a king
    plain: |
      These are the words of King Lemuel, an oracle his mother taught him (on the word, see the note). What shall I tell you, my son, son of my womb, son of my vows? Do not give your strength to women, or your ways to what destroys kings.
  - range: 4-7
    heading: Wine is not for kings
    plain: |
      It is not for kings, Lemuel, not for kings to drink wine, nor for rulers to drink strong drink, lest they drink, forget what the law decrees, and twist the judgment of the afflicted. Give strong drink to the one who is perishing and wine to those who are bitter in soul: let him drink, forget his poverty, and remember his misery no more.
  - range: 8-9
    heading: Speak for those who cannot
    plain: |
      Open your mouth for those who cannot speak, in the cause of all who are left to perish. Open your mouth, judge righteously, and defend the cause of the poor and needy.
  - range: 10-12
    heading: A woman of strength
    plain: |
      A woman of strength, who can find her? Her worth is far above rubies. Her husband's heart trusts her, and he will lack no gain. She does him good and not harm all the days of her life.
  - range: 13-22
    heading: The work of her hands
    plain: |
      She seeks out wool and flax and works gladly with her hands. Like a merchant's ships, she brings her food from far away. She rises while it is still night to give food to her household and their portion to her maidservants. She looks a field over and buys it, and with what her hands have earned she plants a vineyard. She girds herself with strength and makes her arms strong. She sees that her trading is profitable, and her lamp does not go out at night. She puts her hands to the spindle and holds the distaff. She opens her hand to the poor and reaches out her hands to the needy. She does not fear the snow for her household, for all of them are clothed in scarlet. She makes her own coverings; her clothing is fine linen and purple.
  - range: 23-27
    heading: Her husband, her strength and her words
    plain: |
      Her husband is known in the city gates, where he sits among the elders of the land. She makes linen garments and sells them, and supplies the merchant with sashes. Strength and honour are her clothing, and she laughs at the time to come. She opens her mouth with wisdom, and the teaching of kindness is on her tongue. She watches over the ways of her household and does not eat the bread of idleness.
  - range: 28-31
    heading: Her praise
    plain: |
      Her children rise up and call her blessed, and her husband praises her: “Many daughters have done worthily, but you surpass them all.” Charm deceives and beauty is fleeting, but a woman who fears the LORD shall be praised. Give her a share of what her hands have made, and let her own works praise her in the gates.

notes:
  - ref: 1
    phrase: the prophecy that his mother taught him
    kind: history
    title: An oracle, or the land of Massa
    body: |
      “Prophecy” is *massa*, the prophets' word for an oracle, though it may also be the name of Lemuel's kingdom. As a noun it means “utterance, oracle,” used of a prophetic utterance such as “The burden of Babylon” ([[Isa. 13:1]]), and modern translations keep that sense: “An oracle that his mother taught him,” or “an inspired utterance his mother taught him.” The same Hebrew word is also a place name, the “realm of king Lemuel,” perhaps in north Arabia; that identification is a guess. Agur's words carry the same word in their heading ([[Prov. 30:1]]).

      On either reading the words are a king's, but the heading credits them to his mother: they are what “his mother taught him.” (On the mother's teaching in the book, see [[Prov. 1:8]].)
    sources: [bdb, oshb-wlc, nrsvue, niv]

  - ref: 2
    phrase: the son of my vows
    kind: history
    title: The son of my vows
    body: |
      “The son of my vows” ties Lemuel to a vow his mother made. In Israel “Vows often had an entreating character; they were offered in order to obtain some favor from Jehovah,” and one kind was “dedication—some person or thing was given to the Lord.” On one older reading Lemuel is “the son for whom with vows of thanksgiving she prayed to God; and as he was given her by God, so to His care she commits him.”

      A modern translation hears the opening as a warning instead: “No, my son! No, son of my womb! No, son of my vows!”
    sources: [bd-vows, delitzsch-proverbs, nrsvue]

  - ref: 3
    phrase: nor thy ways to that which destroyeth kings
    kind: scripture
    title: What destroys kings
    body: |
      A modern translation's cross-references set the mother's warning beside the law of the king and the story of Solomon's wives; the link rests on those cross-references, since the verse names no king. The law said of the king, “Neither shall he multiply wives to himself, that his heart turn not away” ([[Deut. 17:17]]). Of Solomon the history says, “his wives turned away his heart” ([[1 Kgs. 11:3]]), and Nehemiah later drew the lesson: “Did not Solomon king of Israel sin by these things? … nevertheless even him did outlandish women cause to sin” ([[Neh. 13:26]]).

      A modern translation notes that “strength” may also be read “wealth.”
    sources: [nrsvue, niv, lds-scriptures]

  - ref: 8
    phrase: Open thy mouth for the dumb
    kind: history
    title: Speaking for those who cannot
    body: |
      The “dumb” are those who cannot plead their own case, and the king is to speak for them; a modern translation renders the line, “Speak out for those who cannot speak.” “Such as are appointed to destruction” is in the Hebrew “all children of passing away,” those who are perishing. The same translation's cross-references set beside verse 8 Job's account of the judge he had been: “I was a father to the poor: and the cause which I knew not I searched out” ([[Job 29:16]]).

      Verse 9 repeats the charge and makes it a judge's: “judge righteously, and plead the cause of the poor and needy.”
    sources: [nrsvue, lds-scriptures]

  - ref: 10
    phrase: Who can find a virtuous woman
    kind: scripture
    title: Hard to find, not impossible
    body: |
      “Who can find” does not mean she cannot be found. On one older reading the question “conveys here only the idea of the difficulty of finding,” and recalls what was asked of a newly married man in ancient Jerusalem, “has he found?”, in the words of the proverb “Whoso findeth a wife findeth a good thing” ([[Prov. 18:22]]).

      A modern translation's cross-references set the verse beside that proverb and beside Wisdom's own promise, “whoso findeth me findeth life” ([[Prov. 8:35]]). The link to Wisdom rests on those cross-references alone.
    sources: [delitzsch-proverbs, niv]

  - ref: 11
    phrase: he shall have no need of spoil
    kind: words
    title: No need of spoil
    body: |
      “Spoil” here means gain: her husband will never lack for income. The Hebrew *shalal* is ordinarily “booty, spoil of war,” but this verse is the one place where it means simply “gain,” as a modern translation renders it: “he will have no lack of gain.”
    sources: [bdb, nrsvue]

  - ref: 21
    phrase: all her household are clothed with scarlet
    kind: symbol
    title: Scarlet against the snow
    body: |
      Why scarlet should keep a household safe from the snow is not obvious, and the Hebrew has been read two ways. The Septuagint read the word *shanim* not as “scarlet” but as “double”: in its next verse she “makes for her husband clothes of double texture,” and Jerome and Luther followed it with “double clothing.”

      One older reading keeps “scarlet” and explains it: “The scarlet clothing is of wool, which as such preserves warmth, and, as high-coloured, appears at the same time dignified,” as when Saul “clothed you in scarlet, with other delights” ([[2 Sam. 1:24]]). On either reading her household is warmly dressed.
    sources: [delitzsch-proverbs, oshb-wlc, lxx-rahlfs, lds-scriptures]

  - ref: 22
    phrase: her clothing is silk and purple
    kind: words
    title: Silk, or fine linen
    body: |
      The King James “silk” is a mistranslation of a word for linen. The Hebrew *shesh* “is translated in all other instances as ‘fine linen,’” as when Pharaoh “arrayed him in vestures of fine linen” ([[Gen. 41:42]]); modern translations read “fine linen and purple.”
    sources: [sc-knowhy-734, oshb-wlc, lds-scriptures, niv]

  - ref: 26
    phrase: in her tongue is the law of kindness
    kind: words
    title: The law of kindness
    body: |
      “The law of kindness” is kind teaching: *torah*, instruction, of *chesed*, kindness. The phrase means “instruction in kindness, kindly instruction”; a modern translation has “the teaching of kindness,” and *chesed* is kindness “especially as extended to the lowly, needy and miserable.”

      The first line of the verse joins her teaching to wisdom: “She openeth her mouth with wisdom.”
    sources: [bdb, nrsvue, oshb-wlc]

  - ref: 30
    phrase: a woman that feareth the LORD, she shall be praised
    kind: scripture
    title: Praised for the fear of the LORD
    body: |
      The poem sets the woman's reverence for the LORD above charm and beauty, and with it the book returns to the principle it opened with (see the note on [[Prov. 1:7]]). “Favour” is charm, as a modern translation has it: “Charm is deceitful and beauty is vain, but a woman who fears the Lord is to be praised.”

      The Septuagint names wisdom in the line itself: “for it is a wise woman that is blessed, and let her praise the fear the Lord.”
    sources: [nrsvue, lxx-rahlfs]

  - ref: 31
    phrase: let her own works praise her in the gates
    kind: history
    title: Praised in the gates
    body: |
      The gates were where a city did its public business, and the poem ends by asking that she be honoured there. “The gate of a city was often a place for public business”: it was in the gate, before the elders, that Boaz redeemed Elimelech's land and took Ruth as his wife ([[Ruth 4:1–11]]). Her husband is already “known in the gates, when he sitteth among the elders of the land” (verse 23); the last verse asks that her own works praise her in the same place.
    sources: [bd-gate]

christ: |
  What Lemuel's mother asked of a king, Isaiah saw in the King to come: “with righteousness shall he judge the poor, and reprove with equity for the meek of the earth” ([[Isa. 11:4]]), and of that stem of Jesse the Lord has said, “It is Christ” ([[D&C 113:2]]). He pleads the cause of His people as “the advocate with the Father, who is pleading your cause before him” ([[D&C 45:3]]).

  In this dispensation the Lord laid the mother's charge, in her own words, on one of His servants: to “lift up his voice long and loud, in the midst of the people, to plead the cause of the poor and the needy,” with the promise “I will accept of his offerings” ([[D&C 124:75]], where the Church's footnote to verse 9 points). For a disciple, then, pleading the cause of the poor and needy is not a king's duty only: the Lord has laid it on His servants in this dispensation.

