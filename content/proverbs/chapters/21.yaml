chapter: 21
title: Safety Is of the LORD
tagline: Thirty-one separate sayings that open and close with the LORD's rule over kings and armies. Justice pleases Him more than sacrifice, the man who will not hear the poor will not be heard, and the horse is made ready for battle, but the victory is His.
when: 'The proverbs of Solomon'

setting: |
  Chapter 21 falls late in the first collection of Solomon's proverbs, the separate two-line sayings that run from [[Prov. 10:1]] to [[Prov. 22:16]] (chapter 10's setting introduces the collection and its sayings in contrast, at [[Prov. 10:1]]). It has no story and no speaker but the sage, and each saying is complete in itself.

  One older reading finds the editor's hand in how the sayings are grouped. Verse 1, a saying about the king, closes the group before it, “like the preceding one.” The next group runs from verse 2 to verse 8, “where it closes as it began”: both verses speak of “the way of man.” The third runs to verse 18, and a new one begins at verse 19 “with a variation of its initial verse,” the quarrelsome woman of verse 9 again. The sections below follow those seams from verse 9 on, and keep verse 1 with the run that follows it.

  The chapter opens and closes with sayings about the LORD's rule over the plans of kings and armies (verses 1–2 and 30–31); [[Prov. 16:1]] treats the subject in full.

thread: |
  Like the chapters around it, chapter 21 is a string of separate sayings, not an argument. What recurs most is the LORD's oversight of what people plan and do. He turns the king's heart (verse 1) and weighs every heart that thinks its own way right (verse 2); He prefers justice to sacrifice and loathes the offering brought with a wicked mind (verses 3, 27); and the chapter ends with two sayings that put every kind of wisdom and every army under Him (verses 30–31). Doing “judgment,” justice, returns three times: it pleases the LORD (verse 3), the wicked refuse it (verse 7), and the just find joy in it (verse 15).

  Under these runs the book's picture of two ways (on which see [[Prov. 4:18]]). The man who wanders from the way of understanding comes to rest among the dead (verse 16); the one who follows after righteousness and mercy finds life (verse 21). Around them stand the familiar contrasts: the diligent and the hasty (verse 5), the sluggard who craves and the righteous man who gives (verses 25–26), the wicked man's hard face and the upright man's sure way (verse 29).

sections:
  - range: 1-8
    heading: The king's heart and the way of a man
    plain: |
      The king's heart is in the LORD's hand like channels of water; He turns it wherever He wishes. Every man thinks his own way is right, but the LORD weighs the heart. Doing what is right and just pleases the LORD more than sacrifice. Haughty eyes, a proud heart and the “plowing” of the wicked are all sin (the word is read two ways; see the note). The plans of the diligent lead to plenty, but everyone who hurries ends in want. Treasure gained by a lying tongue is an empty thing blown about, the pursuit of those who seek death. The robbery of the wicked will destroy them, because they refuse to do what is just. The way of man is perverse and strange, but the work of the pure is upright.
  - range: 9-18
    heading: Justice and its end
    plain: |
      Better to live in a corner of the roof than share a house with a quarrelsome woman. The wicked man's soul craves evil; his neighbor finds no kindness in his eyes. When the scorner is punished, the simple learn wisdom, and when the wise is taught, he gains knowledge. The righteous man considers the house of the wicked, and God overthrows the wicked for their evil. Whoever stops his ears at the cry of the poor will cry out himself and not be heard. A gift given in secret calms anger, and a present in the bosom calms fierce wrath (on gifts and bribes, see [[Prov. 17:8]]). Doing justice is a joy to the just, but ruin to those who do evil. Whoever wanders from the way of understanding will come to rest in the assembly of the dead (on the dead, the *rephaim*, see [[Prov. 2:18]]). Whoever loves pleasure, wine and oil will be poor. The wicked become a ransom for the righteous, and the faithless take the place of the upright.
  - range: 19-29
    heading: The wise and the wicked
    plain: |
      Better to live in the wilderness than with a quarrelsome, angry woman (verse 9 has said it before). Precious treasure and oil are stored in the house of the wise, but a foolish man swallows them up. Whoever pursues righteousness and mercy finds life, righteousness and honor. A wise man climbs the walls of a city of mighty men and brings down the fortress it trusted in. Whoever guards his mouth and tongue guards his soul from trouble. “Scorner” is the name of the proud, haughty man who acts in arrogant fury. The sluggard's craving kills him, because his hands refuse to work (on the sluggard, see [[Prov. 6:6]]); he craves greedily all day long, but the righteous man gives and does not hold back. The sacrifice of the wicked is an abomination; how much more when he brings it with a wicked mind. A false witness will perish, but the man who listens will speak, and his word will last. A wicked man puts on a hard face, but the upright man makes his way sure.
  - range: 30-31
    heading: Nothing against the LORD
    plain: |
      No wisdom, no understanding and no counsel can stand against the LORD. The horse is made ready for the day of battle, but the victory belongs to the LORD.

notes:
  - ref: 1
    phrase: 'as the rivers of water: he turneth it whithersoever he will'
    kind: symbol
    title: Channels of water
    body: |
      The image is irrigation: a king's heart is in the LORD's hand as water is in a channel, led wherever He wills. “Rivers” is *peleg*, a “channel, (artificial) canal,” the kind dug to water the land. One older reading finds the point in the second line: however high a king sits above his subjects, his heart “has yet One above it by whom it is moved by hidden influences, e.g., the prayer of the oppressed.” The same reading keeps agency in the same breath: “man is indeed free, yet he acts under the influence of divinely-directed circumstances.” The LORD's rule over human plans is taken up in full at [[Prov. 16:1]].
    sources: [bdb, delitzsch-proverbs]
  - ref: 3
    phrase: 'To do justice and judgment is more acceptable to the LORD than sacrifice'
    kind: scripture
    title: Justice before sacrifice
    body: |
      The saying ranks doing what is right above offering sacrifice. The sacrifice meant is the offering of the law of Moses, and the Lord reminded Israel often that inner righteousness pleases Him more than outward ritual, as Samuel told Saul: “to obey is better than sacrifice” ([[1 Sam. 15:22]]).

      The chapter comes back to it at verse 27, whose first line repeats [[Prov. 15:8]] (where the note on sacrifice and prayer stands) and then adds, “how much more, when he bringeth it with a wicked mind?” One older reading takes that line of a man who offers in order to pay for a sin he means to keep committing: such men brought offerings “to purchase for themselves the connivance of God for their dissolute life,” and so made God “directly a minister of sin.”
    sources: [ot-manual-proverbs, delitzsch-proverbs]
  - ref: 4
    phrase: the plowing of the wicked
    kind: words
    title: Plowing, or a lamp
    body: |
      The King James “plowing” and a modern translation's “the lamp of the wicked” come from one Hebrew word read two ways. The Hebrew text as it was handed down has *nir*, ground broken up for tilling, “the tillable, untilled or fallow ground.” The same consonants can be read *ner*, “lamp,” as the ancient translations read them, and the standard Hebrew lexicon prefers that reading here, with the lamp standing for “happiness, delight.”

      One older reading keeps the plowed field and takes it as “the whole conduct and life of the godless.” The verse is then one sentence: the proud look, the swollen heart and the wicked man's whole husbandry, “the whole of the field cultivated by them, with all that grows thereon, is sin.” On either reading the proud heart and what comes of it are called sin together.
    sources: [oshb-wlc, bdb, nrsvue, delitzsch-proverbs]
  - ref: 9
    phrase: 'It is better to dwell in a corner of the housetop, than with a brawling woman in a wide house'
    kind: symbol
    title: A corner of the roof
    body: |
      The man in the proverb would rather sit up on the edge of the roof, in danger and open to the weather, than share the house below with a quarrelsome woman. On one older reading the “corner” is “the battlement ... of the roof, the edge of the roof, or its summit,” and whoever sits there “does so not without danger, and is exposed to the storm.” The “wide house” is a house shared, “a ‘house of companionship, i.e., a common house.’” The saying returns word for word at [[Prov. 25:24]], and verse 19 is a variant of it that sends the man out into the wilderness.
    sources: [delitzsch-proverbs]
  - ref: 13
    phrase: Whoso stoppeth his ears at the cry of the poor
    kind: scripture
    title: The cry of the poor
    body: |
      The saying measures out to the hard-hearted man what he gave: he would not hear, and he will not be heard. One older reading names the principle with the Beatitude, “Only the merciful find mercy, Matthew 5:7”: the man “who has no ear for the cry” of the poor “will also remain unheard when he himself, in the time of need, calls upon God for help,” as in the parable of the unmerciful servant ([[Matt. 18:23–35]]).

      King Benjamin taught the same duty at length. His people “will not suffer that the beggar putteth up his petition to you in vain” ([[Mosiah 4:16]]), and the man who says that the beggar “has brought upon himself his misery” has “great cause to repent” ([[Mosiah 4:17–18]]).
    sources: [delitzsch-proverbs, lds-scriptures]
  - ref: 18
    phrase: The wicked shall be a ransom for the righteous
    kind: history
    title: A ransom for the righteous
    body: |
      On one older reading the saying means that the trouble that threatened the upright falls on the wicked instead. “Ransom” is *kopher*, “the price of a life, ransom,” the word for the payment that redeemed a forfeit life ([[Ex. 21:30]]) and for the nations the LORD gave in Israel's place in [[Isa. 43:3]]. That reading takes the thought as “the same as at Proverbs 11:8,” where “the righteous is delivered out of trouble, and the wicked cometh in his stead” ([[Prov. 11:8]]): “the wrath passes by the latter and falls upon the former.”

      It takes its examples from Israel's history. Cyrus, God's instrument “for inflicting punishment on many heathen nations, was Israel's liberator,” and Haman and Mordecai exchanged places: Haman was hanged on the gallows he had made ready for Mordecai ([[Esth. 7:10]]).
    sources: [bdb, delitzsch-proverbs]
  - ref: 28
    phrase: the man that heareth speaketh constantly
    kind: words
    title: Speaking so that it stands
    body: |
      “Speaketh constantly” says that the careful listener's word lasts, where the false witness comes to nothing. The last word of the line is *lanetsach*, “for continuance,” and one older reading weighs two senses: he will speak “without ever requiring to be silent,” or, as it prefers, “so that what he says stands.” “The man that heareth” is then “a man who attentively hears, carefully proves,” one who “may say nothing that he has not surely heard.” The liar, by contrast, comes to nothing, because “the lie has no feet on which it can stand.” A modern translation gives the same sense: “a good listener will testify successfully.” The first line is close to [[Prov. 19:9]].
    sources: [oshb-wlc, delitzsch-proverbs, nrsvue]
  - ref: 30
    phrase: There is no wisdom nor understanding nor counsel against the LORD
    kind: prophets
    title: No counsel against the LORD
    body: |
      Wisdom, understanding and counsel count for nothing when set against the LORD. Elder Gerrit W. Gong put the verse under a plain counsel: “Please be careful not to confuse man’s wisdom or understanding with that of the Lord.” Beside it he set Jacob's words on the learned who “hearken not unto the counsel of God, for they set it aside, supposing they know of themselves” ([[2 Ne. 9:28]]). On the LORD's rule over human plans, see [[Prov. 16:1]].
    sources: [gong-ear-wisdom]
  - ref: 31
    phrase: 'The horse is prepared against the day of battle: but safety is of the LORD'
    kind: symbol
    title: The horse and the victory
    body: |
      In Israel's world the horse meant war, and the proverb sets the whole arsenal beneath the LORD's decision. Anciently the horse was kept for battle and so became a symbol of war and conquest, and the saying warns those who would defend themselves by preparing for war when “their ultimate safety lies in trust and faith in God.”

      One older reading adds that “it depends on Him how the battle shall issue,” so that king and people “have thus to trust nothing in the multitude of their war-horses.” It points to David's word to Goliath, that the battle is the LORD's ([[1 Sam. 17:47]]), and to the psalm: “Some trust in chariots, and some in horses: but we will remember the name of the LORD our God” ([[Ps. 20:7]]).
    sources: [ot-manual-proverbs, delitzsch-proverbs]

christ: |
  The Church's footnote at verse 21 sets the man who “followeth after righteousness and mercy” beside the Savior's own words: “seek ye first the kingdom of God, and his righteousness” ([[Matt. 6:33]]), and His promise to the Nephites that all who “hunger and thirst after righteousness” “shall be filled with the Holy Ghost” ([[3 Ne. 12:6]]). The proverb promises “life, righteousness, and honour”; the Savior promises the Spirit.

  For a disciple, the pursuit of righteousness is met by the Lord's own gift of the Holy Ghost to the one who hungers for it. The chapter also puts the outcome of every plan with the Lord (verses 30–31), and so a disciple's safety rests with Him, not in his own preparations.

