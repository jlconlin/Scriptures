  - **Obedience and sacrifice.** [[1 Sam. 15:22]], [[Hos. 6:6]], [[Micah 6:6–8]] and [[Prov. 15:8]].
  - **The cry of the poor.** [[Mosiah 4:16–26]], [[Alma 34:28]] and [[James 1:27]].
  - **Horses and chariots.** [[Ps. 20:7]], [[Ps. 33:16–17]] and [[Isa. 31:1]].

