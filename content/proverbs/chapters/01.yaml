chapter: 1
title: Wisdom Crieth Without
tagline: The book states what it is for and the principle beneath it, the fear of the LORD. Then a father warns his son against the easy money of violent men, and Wisdom herself stands in the streets and calls.
when: 'A father’s instruction, under Solomon’s name'

setting: |
  Proverbs opens with its own title, and the title names Solomon. The book is not all his. Its later headings name “the wise” ([[Prov. 22:17]]; [[Prov. 24:23]]), the men of Hezekiah who “copied out” more of Solomon’s proverbs ([[Prov. 25:1]]), Agur ([[Prov. 30:1]]) and king Lemuel ([[Prov. 31:1]]). The book “can be seen as a library of Israelite wisdom literature that was collected over several centuries,” and on one Latter-day Saint reading it “was not likely compiled in its present form until, at the earliest, the sixth century BC.” What the name of Solomon means over it is the first note.

  Chapters 1–9 are “Ten speeches from a father to a son explaining true wisdom,” followed by “four poems that depict wisdom as a woman.” Chapter 1 begins both. Verses 1–7 are the “Introduction to the book” as a whole; verse 8 opens the “Instructions from father to son” that run to 9:18; and verses 20–33 are Wisdom’s first speech in her own voice.

  The chapter is Hebrew verse, and like many of the proverbs it uses parallelism, an idea stated and then repeated or contrasted “using a similar sentence structure but different words” (see the volume guide, [Hebrew Poetry](/old-testament/guides/hebrew-poetry/#parallelism), and [[Ps. 1:1]]). Paul took a line of it into his letter to the Romans (the note on verse 16), and Alma’s counsel to his sons in the Book of Mormon has been read beside the father’s speeches that begin here (the note on verse 8).

thread: |
  The chapter says what the book is for and then lets three voices speak. The prologue (verses 1–6) piles up the words for what the book gives (wisdom, instruction, understanding, justice, prudence, knowledge, discretion) and names who it is for: the simple and the young, and the wise as well, who “will hear, and will increase learning.” Verse 7 states the principle beneath all of it. The fear of the LORD is where knowledge begins, and only fools despise wisdom.

  Then the father speaks. He asks his son to keep his teaching and his mother’s, and he quotes another voice, a gang’s: “Come with us.” They offer plunder and fellowship, “one purse.” The father answers that their path runs to bloodshed, and that the ambush they lay for others is in the end laid for their own lives (verses 18–19). Verse 19 makes it the end of everyone “greedy of gain,” and “the poetic justice that awaits those who seek to harm others” is one of the “hallmarks of wisdom literature.”

  Last, Wisdom herself speaks, in the streets and at the city gates. She calls the simple, the scorners and the fools, and offers to pour out her spirit on them. Then, because they would not listen, she tells what will come, and the phrase of verse 7 returns: they “did not choose the fear of the LORD” (verse 29). They “eat of the fruit of their own way.” Her last line is the promise the chapter ends on: whoever listens to her “shall dwell safely.”

sections:
  - range: 1-6
    heading: What the book is for
    plain: |
      These are the proverbs of Solomon, David’s son, king of Israel. They are for learning wisdom and instruction and for understanding words of insight; for taking in the instruction of a wise life, which is righteousness, justice and fairness; for giving prudence to the simple and knowledge and good sense to the young. The wise will listen and add to what they have learned, and the person of understanding will gain sound guidance, so as to understand a proverb and its meaning, the sayings of the wise and their riddles.
  - range: 7
    heading: The beginning of knowledge
    plain: |
      Reverence for the LORD is the beginning of knowledge. It is fools who despise wisdom and instruction.
  - range: 8-9
    heading: Hear your father and your mother
    plain: |
      My son, listen to your father’s instruction, and do not abandon your mother’s teaching. They will be a graceful crown on your head and a necklace around your neck.
  - range: 10-19
    heading: Do not go with the violent
    plain: |
      My son, if sinners try to entice you, do not give in. They will say: “Come with us. Let us lie in wait to shed blood, let us ambush the innocent for no reason. Let us swallow them alive like the grave, whole, like those who go down to the pit. We will find all kinds of riches and fill our houses with plunder. Throw in your lot with us, and we will all share one purse.” My son, do not walk that road with them; keep your feet off their path. Their feet run to evil and hurry to shed blood. The net is spread in vain in the sight of the birds. These men lie in wait for their own blood; the ambush they set is for their own lives. That is how it ends for everyone greedy for gain: it takes the life of the one who gets it.
  - range: 20-33
    heading: Wisdom calls in the streets
    plain: |
      Wisdom cries aloud outside; she raises her voice in the streets. She calls where the crowds gather, in the entrances of the city gates, and there she speaks: “How long, you simple, will you love being simple? How long will scoffers delight in scoffing, and fools hate knowledge? Turn back when I rebuke you, and I will pour out my spirit to you and make my words known to you.

      “But I called, and you refused; I held out my hand, and no one paid attention. You ignored all my counsel and would have none of my rebuke. So I will laugh at your disaster and mock when what you fear comes on you, when it comes like ruin and destruction like a whirlwind, when distress and anguish come upon you. Then they will call on me, and I will not answer; they will search for me eagerly and will not find me. They hated knowledge and did not choose to fear the LORD. They would have none of my counsel and despised all my rebuke. So they will eat the fruit of their own way and be filled with their own schemes. The simple are killed by their turning away, and fools are destroyed by their prosperity. But whoever listens to me will live in safety, at ease, without fear of harm.”

notes:
  - ref: 1
    phrase: The proverbs of Solomon
    kind: history
    title: Solomon’s name over a collection
    body: |
      The title names Solomon as the source of the book, but it does not claim that he wrote every line, and the book itself names other authors. Scripture remembers him as the great maker of proverbs: “he spake three thousand proverbs” ([[1 Kgs. 4:32]]). “Some of his wisdom was undoubtedly preserved by later writers and editors.” The book gives his name a second heading of its own at [[Prov. 10:1]], and on one Latter-day Saint reading of its structure “The actual proverbs of Solomon are found in Proverbs 10:1–22:16.” And the father of chapters 1–9 is not drawn as Solomon speaking to his own son: these chapters “are not generally thought to be personal to him or his children. No son or child is named.”

      The word “proverbs” is also wider than the English suggests. The Hebrew *mashal* is “a similitude or parable, but the book contains many maxims and sayings not properly so called, and also connected poems of considerable length.” Elsewhere the same word is used for a by-word, for Balaam’s prophetic speeches, for a parable and for a poem. So the title fits a book that holds two-line sayings and long discourses alike, gathered under the name of the “famously wise King Solomon.”
    sources: [lds-scriptures, ot-manual-proverbs, ot-minute-proverbs, allis-pike-words-wise, bd-proverbs, bdb]

  - ref: 2
    phrase: To know wisdom and instruction
    kind: words
    title: Wisdom as a skill for living
    body: |
      The Hebrew word for “wisdom” covers practical skill as well as knowledge. *Chokmah* is used for “skill in war,” for skill “in technical work,” such as the craftsmen whom the LORD filled “with the spirit of wisdom” to make the priest’s garments ([[Ex. 28:3]]), and even of sailors; it also names wisdom that is “ethical and religious.” On one Latter-day Saint reading, “Wisdom is, in one sense, the infusion of God’s understanding into lived life.”

      The prologue uses a cluster of near-synonyms, words for wisdom that seem to share “a quite similar meaning,” and two of them are worth a closer look. In verse 3, the first of “justice, and judgment” is “usually translated as ‘righteousness,’” the second “is probably better translated as ‘justice,’” and “Both terms are about living together with others in a community.” In verse 4, “subtilty” sounds like a fault, but here it is a virtue. The Hebrew word can mean cunning (the King James renders it “guile” elsewhere), yet “in Proverbs, in good sense,” it means “prudence.” The adjective *‘arum* has the same two sides: it describes the serpent of Eden ([[Gen. 3:1]]), and in Proverbs it describes the sensible, prudent man. The simple, who are easily led, are the ones who need it (see the note on verse 22).
    sources: [bdb, allis-pike-words-wise, ot-minute-proverbs-1-9, strongs-concordance]

  - ref: 7
    phrase: The fear of the LORD is the beginning of knowledge
    kind: words
    title: The motto of the book
    body: |
      Verse 7 is the principle on which the whole book rests: knowledge begins in reverence for the LORD. The footnote beside the verse gives “reverence,” and Elder David A. Bednar’s teaching on godly fear is discussed with [[Ps. 111:10]], where the same saying stands. Though much in the book is practical, “throughout it is taken for granted that ‘the fear of the Lord is the beginning of wisdom.’”

      The saying comes here, at the end of the prologue, and comes back near the end of chapter 9 in almost the same words ([[Prov. 9:10]]); near its close the book praises “a woman that feareth the LORD” ([[Prov. 31:30]]). On one reading, even the sayings that never name the LORD “are not as ‘secular’ as often supposed”: what grows from awe of the Lord is “spiritual even when focused on the temporal.” In the same vein, “to the Lord all things are spiritual (see D&C 29:34).”

      The second half of the verse names those who refuse it: fools despise wisdom and instruction. Chapter 1 ends by showing what that refusal comes to (verse 29).
    sources: [bd-proverbs, allis-pike-words-wise, lds-scriptures, ot-manual-proverbs]

  - ref: 8
    phrase: hear the instruction of thy father, and forsake not the law of thy mother
    kind: history
    title: A father and a mother teaching a son
    body: |
      The “father” of chapters 1–9 is a teacher who speaks as a parent, and behind the figure there may well stand a real home. The discourses are not drawn as Solomon’s to a son of his own (the note on verse 1), and “son” can mean a pupil, but “it stands to reason that parents would have played a role in the training of their children,” and the home “may be regarded as perhaps the original site of wisdom teaching.” This father speaks to his son warmly and in the imperative: “hear,” “forsake not.”

      The mother is no afterthought. The two lines of the verse put father and mother in parallel, and that “places on similar, perhaps equal, footing the instruction of the father and the law of the mother.” The father calls her teaching “law,” *torah*, and expects his son to know it already. The same charge is repeated in [[Prov. 6:20]].

      Readers of the Book of Mormon will hear Alma in these chapters. Alma also speaks to his sons one by one and opens, “My son, give ear to my words” ([[Alma 36:1]]). His counsel to Helaman, Shiblon and Corianton has been read as wisdom of the same kind, “both temporal and spiritual advice” from father to son. A Latter-day Saint study reads Alma 36–39 through the lens of Proverbs 1–9 (see “Explore”).
    sources: [allis-pike-words-wise, sc-knowhy-744, lds-scriptures]

  - ref: 10
    phrase: if sinners entice thee, consent thou not
    kind: history
    title: Sinners who fill their houses with spoil
    body: |
      The first danger the father names is not a vice of private life but a gang that lives by violence and robbery. “A sinner is not just someone who makes incorrect choices but someone who actively attempts to harm those around them.” The gang’s offer is quoted in full (verses 11–14): an ambush, easy plunder, a share in the common purse. These men are “building their own houses and attempting to provide for themselves,” and the spoil they mean to fill them with is other people’s (verse 13).

      The father answers with the outcome rather than with a rule. The ambush they lay “for blood” (verse 11) is laid “for their own blood” (verse 18), and verse 19 makes it a law of life: greed “taketh away the life of the owners thereof.” In Proverbs “the path and the objective are equally important,” and the gang’s way of building, by destroying others, “puts them on a path to ruin.”
    sources: [ot-minute-proverbs-1-9]

  - ref: 16
    phrase: their feet run to evil, and make haste to shed blood
    kind: scripture
    title: Paul’s chain of scriptures
    body: |
      This line is one of the scriptures Paul strings together in Romans to show that Jews and Gentiles “are all under sin” ([[Rom. 3:9]]). In [[Rom. 3:10–18]] he introduces the string with “as it is written”; it is a “composite quotation” of phrases from several Psalms, from this verse and from Isaiah 59:7, and “Paul gives no indication of where these passages are coming from.” Its line “Their feet are swift to shed blood” ([[Rom. 3:15]]) is close to both this verse and Isaiah’s, which the footnote gives, and nothing in the passage says which of the two Paul had in mind. What the father says of one gang, Isaiah says of the sins of his own people, and Paul of all humankind.
    sources: [sc-knowhy-535, lds-scriptures]

  - ref: 17
    phrase: Surely in vain the net is spread in the sight of any bird
    kind: symbol
    title: A net spread in plain sight
    body: |
      On one older reading, the point of this line is that even a bird has the sense to avoid a net it has seen being set. If the net is spread “incautiously before the eyes of the birds to be caught, they forthwith fly away,” and the stress falls on “before the eyes” as the reason the net is spread “in vain.” So the son who has been warned “ought to make application of the similitude to himself”: he should be at least as wary as a bird. The same commentary records that others read the line the opposite way: the birds “see not the net, but only the scattered corn,” and are caught.

      Verse 18 then turns the picture around. The ones setting the trap are the ones caught in it: “they wish to murder others, but, as the result shows, they only murder themselves.”
    sources: [delitzsch-proverbs]

  - ref: 20
    phrase: Wisdom crieth without; she uttereth her voice in the streets
    kind: symbol
    title: Wisdom as a woman calling in the streets
    body: |
      Wisdom speaks here as a woman, and she speaks in public: the grammar of her name explains the first, and the places she stands explain the second.

      “Because the Hebrew word for wisdom is a feminine noun, wisdom is personified as a woman.” King Limhi in the Book of Mormon speaks of her the same way: his people “will not seek wisdom, neither do they desire that she should rule over them!” ([[Mosiah 8:20]]). The figure may also owe something to the home: “The wisdom of mothers may, to a real extent, account for the personification of wisdom as Woman Wisdom.”

      She calls in the streets, “in the chief place of concourse,” and at “the gates” of the city “from where all the roads of the city fan out.” These are “crowded, bustling places,” and “Her message is directed to the general public.”

      She will speak again, with more of her own story, in chapters 8 and 9 (see [[Prov. 8:22]] and [[Prov. 9:1]]); the woman set against her, the “strange woman,” is taken up at [[Prov. 2:16]].
    sources: [ot-minute-proverbs-1-9, allis-pike-words-wise, von-feldt-instructional-wisdom, lds-scriptures]

  - ref: 22
    phrase: ye simple ones
    kind: words
    title: The simple, the scorner and the fool
    body: |
      Wisdom addresses three kinds of people, and the book uses these words for them throughout.

      The **simple** (*peti*) are the inexperienced, “open to the instruction of wisdom or folly,” the kind who believe “every word” ([[Prov. 14:15]]). The word can be used in a good sense, but there is “usually tendency to bad sense”: here they “love” their simplicity. The prologue was written for them, to give “subtilty to the simple” (verse 4).

      The **scorner** (*lets*) is drawn across the book as one who “is proud and haughty,” “delights in scorning,” and “is incapable of discipline.” He is the scornful man whose seat the blessed man of [[Ps. 1:1]] will not take.

      The **fool** (*kesil*) is a “stupid fellow, dullard”: “he hates knowledge,” as this verse says, and “delights not in understanding.”

      The chapter ends with the simple and the fools still turned away (verse 32).
    sources: [bdb, lds-scriptures]

  - ref: 23
    phrase: I will pour out my spirit unto you
    kind: symbol
    title: Wisdom’s spirit poured out like a spring
    body: |
      The verb Wisdom uses for pouring out her spirit is the image of a spring, and her spirit comes with her words. The Hebrew *naba‘* means to “flow, spring, bubble up.” Proverbs uses it again for “a flowing wady,” a stream, as a “metaphor of” the “wellspring of wisdom” ([[Prov. 18:4]]). Here it has a parallel: “pour out” my spirit, “make known” my words. Wisdom “gives her pupils the divine spirit.”

      The offer has a condition: “Turn you at my reproof.” It is made to those who will turn back.

      One Latter-day Saint study sets this verse beside Nephi’s teaching that the Holy Ghost guides the disciple on the path by giving “the words of Christ” ([[2 Ne. 32:3]]). In Proverbs “the guide that opposes the strange woman is the wisdom figure,” while for Nephi the guide on the path “is the Holy Ghost,” and Nephi “closely associates the Holy Ghost with the word of God, just as Wisdom is linked to the law and the commandments in Proverbs 1–9.” That is a comparison, not a claim about what the proverb meant to its first readers.
    sources: [bdb, von-feldt-instructional-wisdom, lds-scriptures]

  - ref: 26
    phrase: I also will laugh at your calamity
    kind: scripture
    title: Wisdom’s laughter at the end of her call
    body: |
      Wisdom’s laughter is, on one older reading, a judge’s answer to people who refused every invitation, and it is spoken in words Isaiah and a psalm use of the LORD. The laughter and scorn here come “from the address of the Judge regarding the incorrigible.” Her outstretched hand (verse 24) is the gesture of someone “striving to beckon to the wandering,” as the LORD says, “I have spread out my hands all the day unto a rebellious people” ([[Isa. 65:2]]). Her “because I have called, and ye refused” matches the LORD’s “because when I called, none did answer” ([[Isa. 66:4]]). And her laughter echoes “He that sitteth in the heavens shall laugh” ([[Ps. 2:4]]; see the note there).

      The verses that follow say where the calamity comes from: “shall they eat of the fruit of their own way, and be filled with their own devices” (verse 31).
    sources: [delitzsch-proverbs, lds-scriptures]

christ: |
  Paul names Christ “the power of God, and the wisdom of God” ([[1 Cor. 1:24]]). Wisdom’s call in this chapter goes to everyone at the city gates, and one Latter-day Saint study sets that beside Nephi’s witness that the Lord “inviteth them all to come unto him and partake of his goodness; and he denieth none that come unto him” ([[2 Ne. 26:33]]). That is a comparison, not an identification of Wisdom with the Savior.

  On one older reading of verse 7, wisdom “comes from God, and whoever fears Him receives it,” and James promises it to anyone who asks: “If any of you lack wisdom, let him ask of God, that giveth to all men liberally, and upbraideth not” ([[James 1:5]]). Alma’s counsel to Helaman, “learn wisdom in thy youth; yea, learn in thy youth to keep the commandments of God” ([[Alma 37:35]]), has been set beside the book’s saying that the fear of the Lord is the beginning of wisdom.

  The wisdom this chapter calls for is not won by cleverness. It begins in reverence for the Lord, it is given by Him to whoever asks, and the call to turn at its reproof is made to everyone.

explore: |
  - **Wisdom’s other speeches.** [[Prov. 8:1–36]] and [[Prov. 9:1–6]], where she tells of her place at the creation and spreads her table.
  - **The father and the mother again.** [[Prov. 4:1–9]] (three generations of teaching) and [[Prov. 6:20–23]].
  - **Alma to his sons.** Alma 36–39, beginning at [[Alma 36:1]], best read with the study “Words from the Wise: Alma 36–39 through the Lens of Proverbs 1–9,” in *Give Ear to My Words* (Religious Studies Center, 2019).
  - **The two ways.** [[Prov. 4:10–19]], where the father sets the path of the just beside the way of the wicked.

