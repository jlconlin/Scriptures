chapter: 12
title: The Lip of Truth
tagline: A string of separate sayings, most of them about the tongue. The lie lasts a moment, the lip of truth for ever, and the chapter ends on a road with no death on it.
when: 'The proverbs of Solomon'

setting: |
  Chapter 12 belongs to Proverbs' second division, which runs from 10:1 to 22:16 under the heading “The proverbs of Solomon”; what that heading claims is taken up at [[Prov. 10:1]].

  The collection is put together differently from the father's lectures of chapters 1–9: it sets separate sayings side by side (see [[Prov. 10:1]]). Every verse is a two-line saying, and in this chapter most of them set the two lines in contrast (the form is explained in the volume guide, [Hebrew Poetry](/old-testament/guides/hebrew-poetry/#parallelism)).

thread: |
  This is not an argument but a string of separate sayings, and the contrast it draws most often is the one the book has drawn from the start, between the righteous and the wicked. With that contrast come two images of what lasts: the root of the righteous, which “shall not be moved” (verse 3) and “yieldeth fruit” (verse 12), and the house of the righteous, which “shall stand” (verse 7) when the wicked “are overthrown, and are not.”

  The subject that returns most is speech. One older reading groups the sayings from verse 13 on as “injurious and beneficial words, wise hearing and prudent silence”: lips that trap their owner, the false witness, words like sword thrusts, the lie that lasts a moment and the truthful lip that lasts for ever, and the prudent man who says less than he knows (verses 16, 23). The last verses turn to the diligent and the slothful and then, in the same reading, to “the two ways, the one of which leads to error, and the other to life” (verses 24–28), the two ways of chapters 1–9 ([[Prov. 4:18]]). The chapter ends on the road of life, with “no death” on it (verse 28).

sections:
  - range: 1-3
    heading: Correction and a root that holds
    plain: |
      Whoever loves being corrected loves knowledge; whoever hates rebuke is as dull as a beast. A good man wins the LORD's favor, but the LORD condemns a schemer. No one is made secure by wickedness, but the root of the righteous will not be pulled up.
  - range: 4-12
    heading: The wife, the house and the field
    plain: |
      A capable wife is her husband's crown, but a wife who shames him is rot in his bones. The plans of the righteous are just; the advice of the wicked is deceit. The words of the wicked lie in ambush for blood, but the speech of the upright rescues them. The wicked are overturned and are gone, but the house of the righteous stands. A man is praised for his good sense, but a twisted heart is despised. Better to be thought little of and have a servant than to think much of yourself and lack bread. A righteous man cares how his animal fares, but even the kindness of the wicked is cruel. Whoever works his land will have plenty of bread, but whoever chases empty men has no sense. The wicked man covets what evil men catch in their net, but the root of the righteous bears fruit.
  - range: 13-23
    heading: Words that wound and words that heal
    plain: |
      The wicked man is trapped by the sin of his own lips, but the righteous gets out of trouble. A man is filled with good by what his mouth produces, and what his hands have done comes back to him. A fool thinks his own way is right, but whoever listens to advice is wise. A fool shows his anger at once, but a prudent man passes over an insult. Whoever speaks the truth tells what is right, but a false witness tells lies. Some people's rash words are like sword thrusts, but the tongue of the wise brings healing. Truthful lips last for ever; a lying tongue lasts only a moment. Deceit is in the heart of those who plot evil, but those who counsel peace have joy. No evil comes to the righteous, but the wicked are full of trouble. Lying lips are an abomination to the LORD, but He delights in those who deal faithfully. A prudent man keeps his knowledge to himself, but a fool's heart blurts out folly.
  - range: 24-28
    heading: Diligence and the way to life
    plain: |
      The hand of the diligent will rule, but the lazy will be put to forced labor. Worry weighs a man's heart down, but a good word cheers it. The righteous man is better than his neighbor, but the way of the wicked leads them astray. The lazy man does not roast what he caught in the hunt, but a diligent man's wealth is precious. On the road of righteousness is life, and along its path there is no death.

notes:
  - ref: 4
    phrase: A virtuous woman is a crown to her husband
    kind: symbol
    title: A crown, or rot in the bones
    body: |
      The saying sets the best a wife can be to her husband beside the worst: a crown, an honor he wears where others see it, or rottenness in his bones, a decay inside him that no one sees. “Virtuous woman” is *'eshet chayil*, the phrase used of Ruth ([[Ruth 3:11]], where the Church's footnote points) and of the woman whose portrait closes the book ([[Prov. 31:10]]); what the word means is explained in [Women and marriage in the Old Testament](/old-testament/guides/women-and-marriage/#valued).
    sources: [oshb-wlc, lds-scriptures]

  - ref: 10
    phrase: A righteous man regardeth the life of his beast
    kind: scripture
    title: Knowing how an animal feels
    body: |
      Righteousness in this saying reaches to the animals a man owns, and one older reading renders the line “The righteous knows how his cattle feel,” taking the word behind “life” as “the state of feeling” and “regardeth” as “careful cognizance or investigation, in conformity with which one acts,” as in “Be thou diligent to know the state of thy flocks” ([[Prov. 27:23]]). It finds the Law behind the saying: the Sabbath rest given to working animals, “that thine ox and thine ass may rest” ([[Ex. 23:12]]), and the ox left unmuzzled while it threshed ([[Deut. 25:4]]).

      Restoration scripture, to which the Church's footnote at “beast” points, says more about animals than the proverb does: they “were also living souls” ([[Moses 3:19]]), and a latter-day revelation speaks of “the happiness of man, and of beasts, and of creeping things, and of the fowls of the air” ([[D&C 77:2]]).
    sources: [delitzsch-proverbs, lds-scriptures]

  - ref: 21
    phrase: There shall no evil happen to the just
    kind: words
    title: What evil does not befall the just
    body: |
      The saying seems to promise the just a life without trouble, but in one older reading its “evil” is narrower. The Hebrew word, *'aven*, “signifies evil as ethical wickedness,” and when used of misfortune “denotes especially such sorrow as is the harvest and product of sin.” Read so, the line says that the harm sin breeds does not come on the righteous: “no kind of evil, such as sin brings forth and produces, falls upon the righteous,” while the wicked are full of it, “for the moral evil which is their life-element brings out of itself all kinds of evil.” That is one reading of the word, not a settled sense of it.

      The sayings that seem to promise the righteous a life without trouble are read together at [[Prov. 22:6]]; a similar testimony is at [[Ps. 37:25]].
    sources: [oshb-wlc, delitzsch-proverbs]

  - ref: 24
    phrase: the slothful shall be under tribute
    kind: history
    title: Under tribute
    body: |
      “Under tribute” means forced labor; a modern translation reads “the lazy will be put to forced labor.” The Hebrew *mas* is the word used of Solomon's own labor gangs, drawn from the peoples left in the land: “upon those did Solomon levy a tribute of bondservice” ([[1 Kgs. 9:21]]). So the saying sets ruling against serving: the diligent hand rules, and the slothful one is put to work under another's.

      The lazy man returns in verse 27, where the meaning of the Hebrew is uncertain, so the King James picture of a hunter too idle to roast his catch is one rendering among several. The sluggard is introduced at [[Prov. 6:6]].
    sources: [oshb-wlc, nrsvue]

  - ref: 28
    phrase: in the pathway thereof there is no death
    kind: words
    title: No death
    body: |
      The chapter's last line may speak of life beyond death, and its Hebrew is disputed. The words are *'al mavet*, “no death,” with the negative *'al*. The ancient translations read the same consonants as “to death,” and the Septuagint, the ancient Greek translation, makes the line a contrast: “but the ways of those that remember injuries lead to death.” The Hebrew as it was handed down keeps the negative, and the King James and a modern translation follow it: “in walking its path there is no death.”

      One older reading defends the Hebrew and takes the two lines as saying the same thing, “the walking … of their way is immortality.” In this line, it says, Israel's wisdom “begins … to break through the limits of this present life, and to announce a life beyond the reach of death.” That is its reading, not a settled sense of the line.
    sources: [oshb-wlc, delitzsch-proverbs, lxx-rahlfs, nrsvue]

christ: |
  Verse 7, “the house of the righteous shall stand,” has a Church footnote pointing to the close of the Savior's sermon in the Book of Mormon. The one who hears His sayings and does them is “a wise man, who built his house upon a rock,” and when the rain and the floods came “it fell not, for it was founded upon a rock” ([[3 Ne. 14:24–25]]).

  A disciple's house stands now on the same terms. What is built on the Savior's words holds when the winds beat on it, and the house built on the sand, however it looks, falls ([[3 Ne. 14:26–27]]).

explore: |
  - **The tongue.** [[James 3:1–18]], beside verses 13–23.
  - **The house on the rock.** [[Matt. 7:24–27]] and [[3 Ne. 14:24–27]], beside verse 7.
  - **The woman of strength.** [[Ruth 3:11]] and [[Prov. 31:10–31]], beside verse 4.

