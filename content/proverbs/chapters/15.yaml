chapter: 15
title: A Soft Answer
tagline: Thirty-three separate sayings that keep returning to the tongue, to correction, and to the LORD who sees into Sheol and into every heart. A gentle answer turns away wrath, a dish of greens with love beats a feast with hatred, and humility comes before honor.
when: 'The proverbs of Solomon'

setting: |
  Chapter 15 stands in the middle of the first collection of Solomon's proverbs, the two-line sayings that run from [[Prov. 10:1]] to [[Prov. 22:16]] (on the collection and its sayings in contrast, see chapter 10's setting at [[Prov. 10:1]]). It has no story and no speaker but the sage.

  One older reading finds a seam in the chapter. The collection opened with a saying about honoring father and mother, “A wise son maketh a glad father” ([[Prov. 10:1]]), and a second section opened “in the same way” at [[Prov. 13:1]]. Verse 20 repeats the line of 10:1, and in that reading “a proverb of the same kind designates the beginning of a third chief section,” with the editor's design shown by the likeness of the sayings that close the first two sections ([[Prov. 12:28]] and verse 19 here).

  The chapter also leads into the next. Nine of its thirty-three sayings name the LORD (verses 3, 8, 9, 11, 16, 25, 26, 29 and 33), and its last verse, on the fear of the LORD and humility, comes just before the run of sayings about the LORD in [[Prov. 16:1–9]].

thread: |
  The chapter is a string of separate sayings, not an argument. Three subjects keep coming back. The first is speech: the soft answer and the word that hurts (verse 1), the tongue that heals or breaks (verse 4), the lips that scatter knowledge (verse 7), the word in season (verse 23), and the righteous man who weighs his answer while the wicked pour out evil (verse 28). The second is correction: the fool who despises his father's teaching (verse 5), the man who hates reproof and dies (verse 10), the scorner who will not go to the wise (verse 12), and the ear that hears reproof and stays among the wise (verses 31–32).

  The third is the LORD, who sees. His eyes are in every place (verse 3); even Sheol lies open before Him, and so the human heart (verse 11). He looks past the offering to the one who offers it (verses 8, 26), is far from the wicked and hears the righteous pray (verse 29), and guards the widow's field against the proud (verse 25). Under these runs the book's picture of two ways (on which see [[Prov. 4:18]]): the way of the wicked, which the LORD loathes (verse 9), the slothful man's way overgrown with thorns, the upright man's built up into a highway (verse 19), and the way of life that leads the wise upward (verse 24). The chapter ends where the book began, with “the fear of the LORD” (verse 33).

sections:
  - range: 1-7
    heading: The tongue
    plain: |
      A gentle answer turns anger away, but a word that hurts stirs it up. The tongue of the wise puts knowledge to good use, but the mouth of fools pours out folly. The LORD's eyes are everywhere, watching the evil and the good. A tongue that heals is a tree of life (see [[Prov. 3:18]]), but a crooked tongue breaks the spirit. A fool despises his father's teaching, but whoever takes correction to heart grows prudent. The house of the righteous holds great treasure, but the income of the wicked brings trouble. The lips of the wise scatter knowledge; the heart of the fool does not.
  - range: 8-11
    heading: Before the LORD
    plain: |
      The LORD loathes the sacrifice of the wicked, but the prayer of the upright delights Him. He loathes the way of the wicked, but He loves the one who pursues righteousness (on “abomination,” see [[Prov. 3:32]]). Correction is hard to bear for anyone who leaves the path, and whoever hates correction will die. Sheol and Abaddon, the world of the dead and the place of destruction, lie open before the LORD; how much more, then, the hearts of men!
  - range: 12-19
    heading: A merry heart, and what is better
    plain: |
      A scorner does not love the one who corrects him, and he will not go to the wise. A glad heart makes a cheerful face, but heartache breaks the spirit. The heart of the man of understanding looks for knowledge, but the mouth of fools feeds on folly. Every day is hard for the afflicted, but a cheerful heart has a feast that never ends. Better a little with the fear of the LORD than great wealth with turmoil. Better a dish of greens where there is love than a fattened ox with hatred. A hot-tempered man stirs up quarrels, but one slow to anger calms them. The lazy man's road is a hedge of thorns, but the road of the upright is a highway built up.
  - range: 20-24
    heading: A glad father, and a word in season
    plain: |
      A wise son makes his father glad, but a foolish man despises his mother (the first line has come before, at [[Prov. 10:1]]). Folly is a pleasure to the man who has no sense, but a man of understanding walks straight. Plans fail where there is no counsel, but with many counselors they stand. A man has joy in a fitting answer, and how good is a word spoken at the right time! The path of life leads the wise upward, to turn him away from Sheol below.
  - range: 25-29
    heading: The LORD, the proud and the wicked
    plain: |
      The LORD tears down the house of the proud, but He sets firm the boundary of the widow's land. The LORD loathes the schemes of the wicked, but the words of the pure are pleasing. The man greedy for gain brings trouble on his own household, but whoever hates gifts given to sway judgment will live (on such gifts, see [[Prov. 17:8]]). The heart of the righteous weighs its answer, but the mouth of the wicked pours out evil. The LORD is far from the wicked, but He hears the prayer of the righteous.
  - range: 30-33
    heading: Hearing correction
    plain: |
      Bright eyes gladden the heart, and good news does the whole body good. The ear that listens to correction that gives life will make its home among the wise. Whoever refuses instruction despises his own soul, but whoever listens to correction gains understanding. The fear of the LORD is the instruction that teaches wisdom (see [[Prov. 1:7]]), and humility comes before honor.

notes:
  - ref: 1
    phrase: 'A soft answer turneth away wrath: but grievous words stir up anger'
    kind: prophets
    title: A word that hurts
    body: |
      Verse 1 sets a gentle answer against a word meant to wound. “Grievous words” renders a Hebrew phrase for “a word that hurts,” the opposite of the “soft answer.” The saying is about which of the two a person brings to a quarrel, and verse 18 says the same of temper: “he that is slow to anger appeaseth strife.”

      President Brigham Young quoted the verse in counsel that Latter-day Saints, “and especially those who hold important positions in the kingdom of God, should maintain a uniform and even temper, both when at home and when abroad,” and not be found “speaking words full of bitterness and biting acrimony to their wives and children.” His conclusion was plain: “words suggested by angry feelings should never be permitted to pass our lips.”
    sources: [bdb, cfm-ot-2026-37, ot-manual-proverbs]
  - ref: 4
    phrase: 'A wholesome tongue is a tree of life: but perverseness therein is a breach in the spirit'
    kind: words
    title: A healing tongue and a broken spirit
    body: |
      “Wholesome” here means healing. The Hebrew *marpe'* is “healing, cure, health,” and with “tongue” it makes “a soothing tongue.” “Perverseness” is “crookedness, crooked dealing,” and “breach” is a breaking, the word used for the fracture of a limb. The verse sets a tongue that heals against a twisted tongue that breaks.

      Whose spirit is broken? One older reading answers that it is the hearer's: “the breaking (deep wounding) is not meant in regard to his own spirit, but to that of the neighbour.” In the same reading, gentle speech is a tree of life “whose fruits preserve life, heal the sick, and raise up the bowed down.” On the tree of life in Proverbs, see [[Prov. 3:18]].
    sources: [bdb, delitzsch-proverbs]
  - ref: 8
    phrase: 'The sacrifice of the wicked is an abomination to the LORD: but the prayer of the upright is his delight'
    kind: scripture
    title: Sacrifice and prayer
    body: |
      The LORD weighs the person who offers before the offering. The verse does not reject sacrifice; it says that from a wicked man it is “an abomination” (on the word, see [[Prov. 3:32]]), while an upright man's prayer delights the LORD. Sacrifice was not made unimportant by the saying: “the sacrifices of the righteous were always a delight unto the Lord.” Verse 29 adds that the LORD “heareth the prayer of the righteous,” and the first line returns at [[Prov. 21:27]]. Mormon says the same of the gift and the prayer of a man “being evil”: the gift is counted “as if he had retained” it, and the prayer “profiteth him nothing” ([[Moro. 7:6–9]]).
    sources: [sc-knowhy-479, lds-scriptures]
  - ref: 11
    phrase: Hell and destruction are before the LORD
    kind: words
    title: Sheol and Abaddon
    body: |
      “Hell” and “destruction” are two Hebrew names for the realm of the dead, and the verse argues from there to the human heart. “Hell” is *she'ol*, “the abode of departed spirits,” which the King James renders “grave,” “pit” or “hell” as the context suggests. “Destruction” is *'abaddon*, “the place of the lost,” a word of the wisdom books; in [[Rev. 9:11]] it is used “as a name of the devil.” If even the world of the dead lies open before the LORD, then “how much more” the hearts of men. With verse 3, where His eyes are “in every place,” the saying belongs to the chapter's picture of the LORD who sees.

      Sheol returns in verse 24 as the “hell beneath” that the wise man's upward way avoids: the way of life leads up and away from the grave.
    sources: [bd-sheol, bd-abaddon, oshb-wlc]
  - ref: 19
    phrase: 'The way of the slothful man is as an hedge of thorns: but the way of the righteous is made plain'
    kind: symbol
    title: A hedge of thorns and a raised road
    body: |
      The sluggard's road is overgrown with thorns; the upright man's road is built up. “Made plain” renders a verb meaning to “cast up a highway,” the verb of “cast up, cast up the highway” ([[Isa. 62:10]]), used here of the path of the upright. On the sluggard, see [[Prov. 6:6]].
    sources: [bdb]
  - ref: 25
    phrase: he will establish the border of the widow
    kind: history
    title: The widow’s boundary
    body: |
      The “border” is the boundary of the widow's land, and the LORD Himself guards it. The word is *gebul*, “border, boundary,” and one older reading takes the verse as “the border of the land-possession of the widows,” which the proud of the first line would remove. Israel's law forbade moving a neighbor's landmark and cursed the man who did ([[Deut. 19:14]]; [[Deut. 27:17]]), and in this verse the LORD appears as the boundary's guardian.
    sources: [bdb, delitzsch-proverbs]

christ: |
  The Savior lived the teaching of verses 1–4 and 18. When Pharisees and Herodians came “to catch him in his words,” He asked for a coin and answered, “Render to Cæsar the things that are Cæsar’s, and to God the things that are God’s” ([[Mark 12:13–17]]). When the accusers of a woman taken in adultery pressed Him, He stooped and wrote on the ground, then said, “He that is without sin among you, let him first cast a stone at her,” and to her, “Neither do I condemn thee: go, and sin no more” ([[John 8:6–11]]).

  A soft answer is a reasoned reply in disciplined words from a humble heart, and it does not compromise doctrinal truth: words firm in what they say can be soft in spirit. For a disciple it is the Lord's own way of answering, truth spoken without the word that hurts.

