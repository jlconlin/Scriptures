chapter: 26
title: Answer a Fool According to His Folly
tagline: Separate sayings on the fool who should not be honored, answered or sent on errands, the sluggard who turns on his bed like a door, the talebearer whose fire dies for lack of wood, and fair lips glazed over a hating heart.
when: 'Copied out under Hezekiah'

setting: |
  Chapter 26 stands in the second collection of Solomon's proverbs, the one the heading at [[Prov. 25:1]] says “the men of Hezekiah king of Judah copied out”; the note there says who they were. Like the chapters of the first collection, it is a string of two-line sayings, each complete in itself, but many of these are comparisons, “As … so,” which set an image from the field, the road or the house beside a kind of person.

  This collection repeats many proverbs and parts of proverbs from the first, and this chapter shows it. The talebearer's words of verse 22 are the saying of [[Prov. 18:8]] word for word, the sluggard's hand in the dish (verse 15) is [[Prov. 19:24]] a little changed, and his lion in the road (verse 13) is the excuse of [[Prov. 22:13]]. Within this collection, by one older reading, only one whole proverb returns, and with an altered sense: verse 12 comes back at [[Prov. 29:20]] with its second line kept and its first changed. The kinds of fool Proverbs names are explained at [[Prov. 1:22]], and the sluggard at [[Prov. 6:6]].

thread: |
  The chapter's sayings fall into runs more plainly than in most chapters, and one older reading counts four. Verses 1–12 are “a group of eleven proverbs of the fool,” with verse 2, “a proverb of different contents, but of similar form,” set among them. Verses 13–16 are “a group of proverbs regarding the slothful.” Verses 17–22 recommend “the love of peace” by presenting “caricatures of the opposite.” Verses 23–28 are on “hypocrisy (the art of dissembling).”

  The fool's run says what he cannot be trusted with: honor (verses 1, 8), a message (verse 6), a proverb (verses 7, 9), a job (verse 10, in a modern translation's reading), even an answer on his own terms (verse 4). He needs the rod as a horse needs the whip (verse 3), and he goes back to his folly as a dog to its vomit (verse 11). One phrase joins the first two runs: “wise in his own conceit” (or “own eyes”) in verses 5, 12 and 16. The fool must be answered so he does not think himself wise; the man who already does has less hope than a fool; and the sluggard thinks himself wiser than seven. The last two runs turn on the tongue: the meddler, the deceiver who calls it a joke, the talebearer, and the fair speaker with seven abominations in his heart. The chapter closes with the pit that swallows its own digger (verse 27) and the ruin a flattering mouth works (verse 28).

sections:
  - range: 1-12
    heading: The fool
    plain: |
      Snow in summer and rain at harvest are out of place, and so is honor for a fool. A curse without cause is like a sparrow or a swallow flitting about: it never lands. A whip is for the horse, a bridle for the donkey, and a rod for the fool's back (on the rod, see [[Prov. 13:24]]). Don't answer a fool according to his folly, or you will become like him; answer a fool according to his folly, or he will think himself wise. To send a message by a fool is to cut off your own feet and drink down harm. As the legs of a lame man hang limp, so does a proverb in a fool's mouth. Giving honor to a fool is like binding a stone into a sling. As a thorn in a drunkard's hand, so is a proverb in a fool's mouth. The meaning of verse 10 is uncertain (see the note on it). As a dog goes back to its vomit, a fool goes back to his folly. A man wise in his own eyes has less hope than a fool.
  - range: 13-16
    heading: The sluggard
    plain: |
      The lazy man says there is a lion on the road, a lion in the streets (the saying of [[Prov. 22:13]]). As a door turns on its hinges, so he turns in his bed. He buries his hand in the dish and finds it too much trouble to bring it back to his mouth (the saying of [[Prov. 19:24]], a little changed). He thinks himself wiser than seven men who can give a sensible answer.
  - range: 17-22
    heading: Meddling, mischief and the talebearer
    plain: |
      A passer-by who meddles in someone else's quarrel is like a man who grabs a dog by the ears. Like a madman throwing firebrands, arrows and death is the man who deceives his neighbor and then says he was only joking. Without wood the fire goes out, and without a talebearer the quarrel dies down. As charcoal feeds embers and wood feeds fire, a quarrelsome man kindles strife. The talebearer's words go down into the inmost parts (the saying of [[Prov. 18:8]], where its words are explained).
  - range: 23-28
    heading: Fair lips and a hating heart
    plain: |
      Fine words over an evil heart are like a clay pot glazed with silver dross. A man who hates disguises it with his lips and stores up deceit inside. When he speaks graciously, don't believe him, for his heart holds seven abominations. Though his hatred is hidden by guile, his wickedness will be exposed before the assembly. Whoever digs a pit falls into it, and the stone a man rolls comes back on him. A lying tongue hates those it crushes, and a flattering mouth brings ruin.

notes:
  - ref: 2
    phrase: so the curse causeless shall not come
    kind: symbol
    title: A curse without cause
    body: |
      A curse spoken without cause is like a small bird that flits about and never settles: it does not land on the one it was aimed at. The Hebrew text carries a marginal correction here. The word written (the *ketiv*) is *lo'*, “not”; the word to be read aloud (the *qere*) is *lo*, “to him,” which would make the curse come after all. The King James follows the written word, and so does a modern translation: “an undeserved curse goes nowhere.”
    sources: [oshb-wlc, nrsvue]

  - ref: 4
    phrase: Answer not a fool according to his folly
    kind: structure
    title: Answer not, and answer
    body: |
      The two sayings seem to contradict each other, but each gives its reason, and in one older reading the reasons show that “according to his folly” means two things. Verse 4 forbids answering the fool on his own terms, as though his premise deserved an answer: the phrase there means “recognising the foolish supposition and the foolish object of his question, and thereupon considering it,” and whoever does that “places himself on an equality with the fool, and easily himself becomes one.” Verse 5 commands answering the fool as his folly deserves, so that he does not go away “wise in his own conceit”: the phrase now means “as is due to his folly: decidedly and firmly rejecting it, making short work with it.”
    sources: [delitzsch-proverbs]

  - ref: 6
    phrase: cutteth off the feet, and drinketh damage
    kind: symbol
    title: Cutting off one’s own feet
    body: |
      The man who sends a message by a fool cripples himself: “It is like cutting off one’s foot and drinking down violence,” a modern translation reads, “to send a message by a fool.” The feet cut off are his own, and the harm he drinks down comes from his own errand.
    sources: [nrsvue]

  - ref: 7
    phrase: so is a parable in the mouth of fools
    kind: symbol
    title: A proverb in a fool’s mouth
    body: |
      Twice the chapter says what becomes of a proverb when a fool uses it: in one picture it is useless, in the other dangerous. The “parable” is a proverb (on the word, see [[Prov. 1:1]]). For the King James' “are not equal” in verse 7, a modern translation has “The legs of a lame person hang limp;” “so does a proverb in the mouth of a fool”: the saying is there, and it carries him nowhere. Verse 9 there is “Like a thornbush brandished by the hand of a drunkard”: a man who cannot govern his hand waves a thing that pricks, and the fool handles a proverb the same way.
    sources: [nrsvue]

  - ref: 8
    phrase: As he that bindeth a stone in a sling
    kind: symbol
    title: A stone in a sling
    body: |
      Honor given to a fool is honor thrown away, as a stone laid in a sling is there only to be flung off; in one older reading, “the fool makes the honour no honour; he is not capable of maintaining it; that which is conferred on him is uselessly wasted.” Verse 1 makes the same point with the weather: honor suits a fool no better than snow suits summer or rain the harvest, and “it will strengthen him in his folly, and only increase it.”
    sources: [delitzsch-proverbs]

  - ref: 10
    phrase: The great God that formed all things
    kind: words
    title: A verse no one is sure of
    body: |
      The Hebrew of verse 10 is uncertain, and the King James' “great God” is one reading among several. The verse opens with *rab*, which the King James renders “great”; no word for God stands in it. A modern translation reads the line as one more saying on the harm of employing a fool: “Like an archer who wounds everybody” in the first line and “is one who hires a passing fool or drunkard.” in the second, with the note “Meaning of Heb uncertain.” The Septuagint, the Greek translation, has another reading: “All the flesh of fools endures much hardship; for their fury is brought to nought.”
    sources: [oshb-wlc, nrsvue, lxx-rahlfs]

  - ref: 11
    phrase: As a dog returneth to his vomit
    kind: scripture
    title: The dog and its vomit
    body: |
      Peter quotes this proverb and the Book of Mormon uses its image, and both speak of people who had known the right way and went back to the wrong one. Peter calls it “the true proverb, The dog is turned to his own vomit again” ([[2 Pet. 2:22]]), and says whom it describes: those who “have escaped the pollutions of the world through the knowledge of the Lord and Saviour Jesus Christ” and “are again entangled therein,” so that “the latter end is worse with them than the beginning” ([[2 Pet. 2:20]]). The Book of Mormon uses it of the people who, within six years, “had turned from their righteousness, like the dog to his vomit, or like the sow to her wallowing in the mire” ([[3 Ne. 7:8]]). Both add the sow, which Proverbs does not have.
    sources: [lds-scriptures]

  - ref: 12
    phrase: there is more hope of a fool than of him
    kind: words
    title: Wise in his own eyes
    body: |
      The man who thinks himself wise is worse off than the fool because he sees no need to be taught. In one older reading the fool “who is conscious that he is not wise” is “more likely to be” put right “than … one deeming himself wise; for the greatest hindrance to any turning toward that which is better lies in the delusion that he does not need it.”
    sources: [delitzsch-proverbs]

  - ref: 23
    phrase: a potsherd covered with silver dross
    kind: symbol
    title: Silver glaze on clay
    body: |
      Fine words over a hating heart are like a cheap clay pot made to shine like silver. For the Hebrew's “silver of dross,” a modern translation conjecturally reads “Like the glaze covering an earthen vessel” in the first line, and in the second, “are smooth lips with an evil heart.” Its “smooth” for the Hebrew's “burning” comes from the Greek, where the Septuagint has “smooth lips cover a grievous heart.” The next three verses say the same of the man who “dissembleth with his lips”: his heart holds “seven abominations,” and what he covers will be “shewed before the whole congregation.”
    sources: [nrsvue, lxx-rahlfs]

christ: |
  The Church's footnote at verse 5 sets beside the command to answer a fool the Savior's answer to the Pharisees and Sadducees who “tempting desired him that he would shew them a sign from heaven” ([[Matt. 16:1]]). He called them “hypocrites” who could read the sky but not “the signs of the times,” told them “there shall no sign be given unto it, but the sign of the prophet Jonas,” and then “he left them, and departed” ([[Matt. 16:3–4]]). Verse 12 gives a fool more hope than a man wise in his own eyes, and one older reading sets it beside the Savior's words, “They that be whole need not a physician, but they that are sick” ([[Matt. 9:12]]).

  A disciple who knows he is not yet wise stands where verse 12 places its hope, among the sick the Physician came for. And the Lord, tempted by men who wanted a sign, answered them once and plainly, and then left them; a disciple's answer to scorn can be given the same way, without staying to contend.

explore: |
  - **The sluggard through the book.** [[Prov. 6:6–11]], [[Prov. 19:24]] and [[Prov. 24:30–34]], beside verses 13–16.
  - **The wise in their own eyes.** [[Isa. 5:21]] and [[2 Ne. 15:21]], beside verse 12.
  - **The pit that turns on its digger.** [[Ps. 7:15]], which one older reading names as verse 27's oldest form, and [[Eccl. 10:8]], which repeats it; and the same image in [[1 Ne. 14:3]] and [[2 Ne. 28:8]].

