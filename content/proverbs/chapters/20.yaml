chapter: 20
title: The Candle of the LORD
tagline: Separate sayings on wine and the king, the heart no one can call clean, honest weights and rash vows, the wrong left with the LORD, and the spirit of man as His lamp.
when: 'The proverbs of Solomon'

setting: |
  Chapter 20 stands in the first collection of Solomon's proverbs, which opens with its own heading at [[Prov. 10:1]] and runs to [[Prov. 22:16]]; the setting of chapter 10 says what kind of sayings these are and how to read them. Like the chapters around it, this one is a string of two-line sayings, each complete in itself.

  Several of them have companions elsewhere in the book. The king's anger as a lion's roar (verse 2) has come before at [[Prov. 19:12]]; the surety's garment (verse 16) returns almost word for word at [[Prov. 27:13]]; and verse 23 takes up the false weights of verse 10 again. The warning against wine and strong drink in verse 1 returns at [[Prov. 23:29–35]] and [[Prov. 31:4–7]]. Verse 24, that a man's goings are of the LORD, belongs with the sayings on the LORD's rule over human plans explained at [[Prov. 16:1]].


thread: |
  This is a collection, not an argument: thirty sayings loosely joined by what they share. The subject that recurs most is the king, who appears four times: his anger is a lion's roar (verse 2), his eyes winnow evil from the court (verse 8), he threshes the wicked (verse 26), and mercy and truth keep his throne (verse 28). The LORD appears as well: He made the ear and the eye (verse 12), directs a man's steps beyond his own understanding (verse 24), and has set in man a lamp that searches his inward parts (verse 27). No one, the chapter says, can claim a clean heart (verse 9).

  The rest is the old contrast of the two ways (see [[Prov. 4:18]]), given in matters of trade and speech: the honest weight and the false (verses 10, 23), the buyer who runs the goods down and then boasts of his bargain (verse 14), the bread of deceit that turns to gravel (verse 17), the talebearer (verse 19), the hasty inheritance and the hasty vow (verses 21, 25). A new group may begin at verse 20 with the commandment to honor father and mother, and three of the sayings after it name the LORD (verses 22–24).

sections:
  - range: 1-4
    heading: Sayings on several subjects
    plain: |
      Wine turns a man into a mocker and strong drink into a brawler; whoever is led astray by them is not wise. The king's anger is like a lion's roar, and whoever provokes him puts his own life at risk (the same picture as [[Prov. 19:12]]; the king in the proverbs is taken up at [[Prov. 16:10]]). It is honorable to stay out of a quarrel, but every fool will meddle in one. The sluggard won't plow when winter comes, after the autumn harvest; so at harvest he begs and gets nothing (on the sluggard, see [[Prov. 6:6]]).
  - range: 5-9
    heading: What lies in the heart
    plain: |
      The purposes in a man's heart are like deep water, but a man of understanding can draw them out. Many men announce their own goodness, but who can find a faithful one? The righteous man walks in his integrity, and his children are blessed after him. A king who sits in judgment winnows out all evil with his eyes. Who can say, “I have made my heart clean, I am free of my sin”?
  - range: 10-19
    heading: Buying, selling and speaking
    plain: |
      Two sets of weights and two sets of measures are both hateful to the LORD (on false balances, see [[Amos 8:5]]). Even a child shows by what he does whether his conduct is pure and right. The ear that hears and the eye that sees: the LORD made them both. Don't love sleep, or you will grow poor; open your eyes and you will have bread enough. “Bad, bad,” says the buyer; then he goes off and boasts of his bargain. There is gold and plenty of jewels, but lips that speak knowledge are a precious jewel. Take the garment of the man who has stood surety for a stranger, and hold him to his pledge. Bread got by fraud tastes sweet, but afterward the mouth is full of gravel. Plans are made firm by counsel; wage war with good advice. A gossip gives secrets away, so have nothing to do with a man whose lips run on.
  - range: 20-25
    heading: What is left to the LORD
    plain: |
      Whoever curses his father or his mother will have his lamp put out in the deepest darkness. An inheritance gained hastily at the start will not be blessed at the end. Don't say, “I will pay back the wrong”; wait on the LORD, and He will help you. Unequal weights are hateful to the LORD, and false scales are not good (verse 10 has said it already). A man's steps are directed by the LORD; how then can a man understand his own way (see [[Prov. 16:1]])? It is a trap to declare something holy in haste, and to start thinking only after the vow is made.
  - range: 26-30
    heading: The king and the inward parts
    plain: |
      A wise king winnows out the wicked and drives the threshing wheel over them. The spirit of man is the LORD's lamp, searching his innermost being. Mercy and truth keep the king safe, and mercy holds up his throne. The glory of young men is their strength, and the honor of old men is their gray hair. Blows that wound scour away evil, and strokes reach the innermost being.

notes:
  - ref: 1
    phrase: Wine is a mocker, strong drink is raging
    kind: words
    title: What wine does to a man
    body: |
      The saying names wine and strong drink for what they make of the man who drinks them. In one older reading their effects “are attributed to these liquors themselves as their property”: wine is a mocker “because he who is intoxicated with it readily scoffs at that which is holy,” and strong drink is “raging” (a modern translation: “a brawler”) because the drunk man “breaks through the limits of morality and propriety.” “Deceived” (in the modern translation, “led astray”) is taken, as at [[Isa. 28:7]], of “actual staggering, being overtaken in wine”: the one who is not wise “gives himself up to wine to such a degree that he is no longer master of himself.” The Septuagint makes it a judgment on the drinker, saying that every fool is entangled with wine and strong drink.

      The Church's footnote points to the Word of Wisdom, in which the Lord says that “strong drinks are not for the belly” ([[D&C 89:7]]).
    sources: [delitzsch-proverbs, nrsvue, lxx-rahlfs, lds-scriptures]

  - ref: 9
    phrase: Who can say, I have made my heart clean
    kind: scripture
    title: No one can say his heart is clean
    body: |
      The question expects the answer “no one.” In one older reading it carries “the same thought that Solomon expresses in his prayer at the consecration of the temple”: “there is no man that sinneth not” ([[1 Kgs. 8:46]]); no one can make the boast, “for man's knowledge of himself and of his sins remains always limited,” and “sin is so deeply rooted in his nature.”
    sources: [delitzsch-proverbs]

  - ref: 16
    phrase: Take his garment that is surety for a stranger
    kind: words
    title: The garment of a surety
    body: |
      The saying tells a lender to take a man's garment as security when he guarantees a stranger's debt. Surety, the pledge to pay another's debt, is explained at [[Prov. 6:1]].

      The Hebrew gives the end of the verse two ways (on the written and the read forms, see the note on [[Prov. 19:7]]). As written it reads “strangers,” in the plural; as read aloud, “a strange woman,” which the King James follows, and which is how the same proverb stands at [[Prov. 27:13]]. A modern translation follows the written form: “seize the pledge given as surety for foreigners.”
    sources: [oshb-wlc, nrsvue]

  - ref: 20
    phrase: his lamp shall be put out in obscure darkness
    kind: symbol
    title: A lamp put out
    body: |
      The lamp is the man's life and all that lights it, and the one who curses his parents loses it. The law set death as the penalty ([[Ex. 21:17]]), but in one older reading the proverb “does not mean this sentence against the criminal, which may only seldom be carried into execution, but the fearful end” of such a son. The book has said before that the lamp of the wicked goes out ([[Prov. 13:9]]): “there is suddenly an end to all that brightened, i.e., made happy and embellished their life.”

      The Hebrew word behind “obscure” means the “pupil of eye,” and of the night the “middle, midst of night,” the darkest hour: “your lamp will go out in utter darkness.” The Septuagint keeps the eye: “his eyeballs shall see darkness.”
    sources: [delitzsch-proverbs, bdb, nrsvue, lxx-rahlfs]

  - ref: 22
    phrase: Say not thou, I will recompense evil
    kind: scripture
    title: Wait on the LORD, not on revenge
    body: |
      The saying forbids paying back a wrong and gives the wronged man something else to do: wait on the LORD. What it promises is help, not revenge. In one older reading it asks men to act “according to the law of love, and not according to the jus talionis,” the law of retaliation, and it stands beside the apostles' counsel: “Recompense to no man evil for evil” and “avenge not yourselves” ([[Rom. 12:17]]; [[Rom. 12:19]]); “Not rendering evil for evil, or railing for railing” ([[1 Pet. 3:9]]). The Septuagint names the one who did the wrong: “Say not, I will avenge myself on my enemy.”
    sources: [delitzsch-proverbs, lxx-rahlfs]

  - ref: 25
    phrase: It is a snare to the man who devoureth that which is holy
    kind: history
    title: A vow made in haste
    body: |
      The saying warns against promising something to God on impulse and weighing the promise only afterward. The Hebrew of the first line is difficult, and the King James “devoureth” follows a sense of the verb that the same reading rejects. A modern translation reads, “It is a snare for one to say rashly, ‘It is holy,’ and begin to reflect only after making a vow.”

      On that reading “holy” is a word a man calls out, like the “Corban” of [[Mark 7:11]]: “the exclamation to which one suddenly gives utterance, thereby meaning that this or that among his possessions henceforth no longer belongs to him, but is consecrated to God.” The trap closes later, when “he comes to know that he has injured himself by the alienation of his property,” or “is overcome by repentance and is constrained to break his oath.” The Septuagint reads: “It is a snare to a man hastily to consecrate some of his own property: for in that case repentance comes after vowing.”
    sources: [delitzsch-proverbs, nrsvue, lxx-rahlfs]

  - ref: 26
    phrase: bringeth the wheel over them
    kind: symbol
    title: The threshing wheel
    body: |
      The wheel is a threshing cart's, and the king who drives it over the wicked is separating them as a farmer separates grain from chaff. For “scattereth” a modern translation has “winnows”: “A wise king winnows the wicked and drives the wheel over them.” In one older reading the wheel is “without doubt, the wheel of the threshing-cart” of [[Isa. 28:27]]: “We are not to think of the punishment of the wheel, which occurs only as a terrible custom of war.” The saying means “only … that a wise king, by sharp and vigorous procedure, separates the godless, and immediately visits them with merited punishment, as he who works with the winnowing shovel gives the chaff to the wind.” It is “a variant to Proverbs 20:8,” where the king winnows evil with his eyes alone.
    sources: [delitzsch-proverbs, nrsvue]

  - ref: 27
    phrase: The spirit of man is the candle of the LORD
    kind: symbol
    title: The lamp of the LORD
    body: |
      The saying calls the human spirit a lamp the LORD has lit, by whose light a man is searched to his depths. “Candle” is a lamp (a modern translation: “The human spirit is the lamp of the Lord”; the Septuagint, “a light of the Lord”). The word for “spirit” is *neshamah*, “breath,” in one older reading “so called as the principle of life breathed immediately by God into the body” (as when God “breathed into his nostrils the breath of life,” [[Gen. 2:7]]).

      In that reading “the spirit is that which penetrates that which is within,” and “the candle which God has kindled in man has as the nearest sphere of illumination … the condition of the man himself.” “The inward parts of the belly” are the inner self: the word “denotes the inner part of the body …, and generally of the personality.”
    sources: [delitzsch-proverbs, oshb-wlc, nrsvue, lxx-rahlfs]

  - ref: 30
    phrase: The blueness of a wound cleanseth away evil
    kind: symbol
    title: Wounds that cleanse
    body: |
      The saying holds that punishment that hurts can scour evil out of a man, down to his inner self. “Blueness” is the mark a blow leaves, “the streak, the stripe”; a modern translation reads “Blows that wound cleanse away evil.” The Septuagint reads the verse not as correction but as a sentence on the wicked: “Bruises and contusions befall bad men.” How the Church reads the book's sayings on bodily correction is set out at [[Prov. 13:24]].
    sources: [delitzsch-proverbs, nrsvue, lxx-rahlfs]

christ: |
  Verse 9 asks who can say he has made his heart clean, and the Church's footnote answers with Paul: “all have sinned, and come short of the glory of God” ([[Rom. 3:23]]). Paul goes straight on to what the proverb does not name, that sinners are “justified freely by his grace through the redemption that is in Christ Jesus” ([[Rom. 3:24]]).

  The footnote on “wait” in verse 22 points to the revelation in which the Lord told His afflicted Saints that their afflictions would work for their good and bade them go on “waiting patiently on the Lord” ([[D&C 98:2–3]]); a wronged disciple leaves the wrong with Him and looks to Him for help.

explore: |
  - **Not repaying evil.** [[Rom. 12:17–21]] and [[1 Pet. 3:8–9]], beside verse 22.
  - **Wine and strong drink.** [[Prov. 23:29–35]] and [[D&C 89:5–7]], beside verse 1.
  - **The farmer's threshing.** [[Isa. 28:23–29]], beside verse 26.

