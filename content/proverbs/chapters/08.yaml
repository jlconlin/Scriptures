chapter: 8
title: Wisdom at the Gates
tagline: Wisdom stands at the city gates and calls to everyone, says what she gives, tells how she was with the LORD before the earth was made, and ends with a choice between life and death.
when: 'A father’s instruction, under Solomon’s name'

setting: |
  Chapter 8 is Wisdom’s longest speech. The father who talks through most of chapters 1–9 (see [[Prov. 1:8]]) steps aside, and the woman Wisdom, who first called in the streets in [[Prov. 1:20]], speaks in her own voice from the first verse to the last. She speaks to everyone: “Unto you, O men, I call; and my voice is to the sons of man” (verse 4).

  The chapter is placed against the one before it. Chapter 7 told of a woman who meets a young man at nightfall, and here, near the close of chapters 1–9, Wisdom answers her in the open (the note on verse 1).

  The speech has three parts: her call and what she gives (verses 1–21); her place beside the LORD before the creation (verses 22–31); and her appeal, which opens “Now therefore” (verses 32–36). Whether the Wisdom of verses 22–31 is connected with Christ, the Word by whom all things were made, is taken up in the note on verse 22.

thread: |
  Wisdom asks to be heard, and the chapter is her case for listening to her.

  She begins with where she stands and what she says. She calls at the heights, the crossroads and the gates, where anyone can hear, and everything she says is true and straight (verses 1–9). What she gives is worth more than silver, gold and rubies (verses 10–11). Then she says who she is: she lives with prudence, hates pride and a twisted mouth, gives counsel and strength, and by her kings rule justly (verses 12–16). She loves those who love her, and her riches last (verses 17–21).

  Then she gives her credentials, and they are older than the world. Before there were depths, springs, mountains or fields she was there; when the LORD marked out the heavens, set the sea its limit and laid the foundations of the earth, she was beside Him, His daily delight, rejoicing before Him and delighting in the human race (verses 22–31). The one who calls in the street is the one who watched the world being made.

  So the appeal at the end has weight. “Now therefore hearken unto me” (verse 32): those who keep her ways are blessed, whoever watches at her doors is happy, and the choice is put plainly. “Whoso findeth me findeth life,” and “all they that hate me love death” (verses 35–36).

sections:
  - range: 1-21
    heading: Wisdom calls, and says what she gives
    plain: |
      Wisdom is calling out, isn’t she? Understanding is raising her voice. She takes her stand on the heights beside the road, where the paths meet. Beside the gates at the entrance to the town, at the doorways, she cries out: “To you, people, I call; my voice goes out to all humankind. You who are naive, understand wisdom; you fools, gain an understanding heart. Listen, for I will speak of noble things, and what comes from my lips is right. My mouth speaks the truth; wickedness is hateful to my lips. Everything I say is righteous; nothing in it is twisted or crooked. It is all plain to anyone with understanding, and right to those who have found knowledge. Take my instruction instead of silver, and knowledge rather than the finest gold. Wisdom is better than rubies, and nothing you could want compares with her.

      “I, Wisdom, live with prudence, and I find knowledge and discretion. To fear the LORD is to hate evil; pride, arrogance, the evil way and a twisted mouth I hate. Counsel and sound wisdom are mine; I am understanding, and strength is mine. By me kings reign and rulers make just decrees; by me princes rule, and nobles, all who judge on earth. I love those who love me, and those who seek me diligently find me. Riches and honor are with me, lasting wealth and righteousness. What I yield is better than gold, even fine gold, and my harvest better than choice silver. I lead in the way of righteousness, along the paths of justice, to give an inheritance to those who love me and fill their treasuries.
  - range: 22-31
    heading: Beside the LORD before the earth was made
    plain: |
      “The LORD possessed me at the beginning of His way, before His works of long ago. I was set up ages ago, from the beginning, before the earth was. When there were no depths I was brought forth, when there were no springs full of water. Before the mountains were settled in place, before the hills, I was brought forth, while He had not yet made the earth or the fields or the first of the dust of the world. When He set up the heavens, I was there, and when He drew a circle on the face of the deep. When He made firm the clouds above and made strong the fountains of the deep, when He set the sea its limit so that the waters would not go past His command, and when He marked out the foundations of the earth, I was beside Him, as one brought up with Him. I was His delight day after day, rejoicing before Him always, rejoicing in His inhabited world, and my delight was with the human race.
  - range: 32-36
    heading: Life or death
    plain: |
      “So now, children, listen to me: happy are those who keep my ways. Hear instruction and be wise; don’t refuse it. Happy is the one who listens to me, keeping watch at my gates every day, waiting beside my doorposts. Whoever finds me finds life and receives favor from the LORD. But whoever sins against me harms himself; all who hate me love death.”

notes:
  - ref: 1
    phrase: Doth not wisdom cry?
    kind: symbol
    title: Wisdom in the open, in the light of day
    body: |
      Wisdom calls in public, by day and to everyone, and the place she stands is part of her message. She takes the heights, the crossroads, the city gates and the doors (verses 2–3), where everyone passes. (Who she is, and why wisdom is a woman in these chapters, is explained at [[Prov. 1:20]].)

      The scene answers chapter 7. The woman there met the young man “In the twilight, in the evening, in the black and dark night” ([[Prov. 7:9]]), and “lieth in wait at every corner” ([[Prov. 7:12]]). Wisdom is the opposite on each count: “Just as the strange woman took action to tear others down in the shadow of secrecy, Lady Wisdom acts by standing and crying in public to those she might help.” She does not hunt the simple; “she finds the simple in order to instruct and help them,” and verse 5 calls them by name. She speaks “In dignity and in the light of day,” and “beseeches all to come and partake of her life-giving rewards.”
    sources: [ot-minute-proverbs-1-9, ot-manual-proverbs, lds-scriptures]

  - ref: 12
    phrase: find out knowledge of witty inventions
    kind: words
    title: Witty inventions
    body: |
      “Witty inventions” has nothing to do with jokes or gadgets: it means well-thought-out plans, or discretion. In older English “witty” could mean “Judicious; ingenious; inventive,” and an “invention” was “The action or operation of finding out something new,” or the “finding of things hidden.” Behind the phrase is one Hebrew word, *mezimmot*, which in Proverbs, as here, means the “power of devising, discretion.” A modern translation reads “I attain knowledge and discretion.”

      The same word can turn bad. Elsewhere it means “evil devices of men,” and Proverbs speaks of “a man of wicked devices” ([[Prov. 12:2]]). Wisdom claims the good side of it: the power to think a plan through.
    sources: [webster-1828, bdb, oshb-wlc, nrsvue]

  - ref: 17
    phrase: those that seek me early shall find me
    kind: words
    title: Seeking early
    body: |
      “Early” here means eagerly, more than early in the day or early in life. The Hebrew verb means to “look early, diligently for.” It is “usually of seeking God” earnestly, and Proverbs also uses it of seeking wisdom ([[Prov. 1:28]]). A modern translation reads “those who seek me diligently find me.”
    sources: [bdb, nrsvue]

  - ref: 22
    phrase: The LORD possessed me in the beginning of his way
    kind: words
    title: Possessed, or created
    body: |
      “Possessed” translates a Hebrew verb, *qanah*, that can mean either “acquired” or “created,” and the King James and modern translations differ over it. The ordinary sense is “get, acquire,” but the verb is also used “of God as originating, creating”: the same Hebrew verb stands behind Melchizedek’s “possessor of heaven and earth” ([[Gen. 14:19]]). A modern translation reads “The Lord created me at the beginning of his work,” and the Septuagint reads “The Lord made me.”

      One Latter-day Saint reading keeps both senses and lets each teach something. Taking the verb as “acquire” makes wisdom “an attribute that Jehovah got ‘in the beginning of his way,’” before He made the earth, and so “God models what the reader of Proverbs is asked to do,” to “acquire wisdom” ([[Prov. 4:5]]) and build a household by it. Taking it as “created” “helps us see Wisdom metaphorically as an individual rather than just an attribute.”

      A reader will ask whether this Wisdom is Christ. The New Testament speaks of Christ in the same terms: “All things were made by him” ([[John 1:3]]); “For by him were all things created, that are in heaven, and that are in earth” ([[Col. 1:16]]). John, on the same reading, “seems to appeal to the image of wisdom in describing Jesus Christ as the Word,” since “Wisdom was in the beginning with God and was used by God in Creation.” On that reading John draws on a likeness, without saying that the poem’s Wisdom is the Savior: in the poem she is “she,” and she is beside the LORD.
    sources: [bdb, oshb-wlc, nrsvue, lxx-rahlfs, ot-minute-proverbs-1-9, lds-scriptures]

  - ref: 30
    phrase: as one brought up with him
    kind: symbol
    title: Beside him as a master workman
    body: |
      The Hebrew word *’amon* has been read as a child being raised or as a skilled worker, and the King James chose the first, “foster-son.” The other reading is “artificer, architect, master-workman,” and a modern translation takes it: “then I was beside him, like a master worker.” The Septuagint renders the line differently again: “I was by him, suiting myself to him.” On the master-workman reading, Wisdom stands beside the Maker in verses 27–29 as a worker, not only a witness.

      The rest of the verse is joy. “Rejoicing” is a verb for play, to “make sport” in verses 30 and 31, the same verb used of music and dancing before the LORD ([[2 Sam. 6:5]]) and of children playing in the streets ([[Zech. 8:5]]). A modern translation reads “playing before him always, playing in his inhabited world and delighting in the human race.” On one older reading, the earth was her dearest delight because “the earth is the abode of man,” and the children of men were “her peculiar and dearest sphere of activity.”
    sources: [bdb, oshb-wlc, nrsvue, lxx-rahlfs, delitzsch-proverbs]

  - ref: 34
    phrase: watching daily at my gates, waiting at the posts of my doors
    kind: symbol
    title: Waiting at Wisdom’s doors
    body: |
      The happy man is pictured as someone waiting at a great house for the doors to open. On one older reading, the plural “gates” and “doors” suggest “the idea of a palace or temple,” and the doorposts show that he “holds himself in closest nearness to the entrance, that he might not miss the moment when it is opened.” “Daily” makes it a habit, not a single visit.
    sources: [delitzsch-proverbs]

  - ref: 35
    phrase: whoso findeth me findeth life
    kind: scripture
    title: The life Wisdom gives
    body: |
      On a reading drawn from the Book of Mormon, the life Wisdom offers is more than a long life. Wisdom’s promise of length of days is most often taken as “a long mortal life,” but “Nephi’s teachings, though, make it clear that on a deeper level, what is promised is eternal life”: the strait and narrow path “leads to eternal life” ([[2 Ne. 31:18]]). On that reading Proverbs 1–9 is “counsel of eternal import.”

      Verse 36 gives the other side. “He that sinneth against me” uses a verb whose first sense is to “miss,” and the line means “the one missing me (Wisdom) is one wronging himself,” the opposite of the one who finds her in verse 35. A modern translation reads “those who miss me injure themselves.” On one Latter-day Saint reading, right relationships are “what it means to be truly alive,” and a life spent using others is “what it means to be physically alive but spiritually dead.”
    sources: [von-feldt-instructional-wisdom, bdb, nrsvue, ot-minute-proverbs-1-9, lds-scriptures]

christ: |
  John says of the Word who was in the beginning with God, “All things were made by him” ([[John 1:3]]). Wisdom beside the LORD at the creation is set beside that Word as a likeness, not an identification (see the note on [[Prov. 8:22]]).

  Beside Wisdom’s last promise, “whoso findeth me findeth life” (verse 35), stands the Savior’s prayer: “And this is life eternal, that they might know thee the only true God, and Jesus Christ, whom thou hast sent” ([[John 17:3]]). The life a disciple looks for in wisdom is, in His words, found in knowing the Father and the Son.

explore: |
  - **Wisdom’s three speeches.** [[Prov. 1:20–33]], this chapter, and [[Prov. 9:1–6]], where she builds her house and spreads her table; with the woman of chapter 7 set between them.
  - **The creation in other scriptures.** [[Prov. 3:19–20]], [[Job 38:4–11]] and [[Ps. 104:1–9]], which also tell of the LORD setting the sea its bounds.
  - **The Word in the beginning.** [[John 1:1–14]], [[Col. 1:15–17]] and [[D&C 93:21–30]].

