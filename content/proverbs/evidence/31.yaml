chapter: 31
claims:
  - where: setting
    claim: 'The chapter holds the words of Lemuel (31:1–9) and then a poem about a virtuous woman'
    key: ot-minute-proverbs
    url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-overview'
    quote: 'Words of King Lemuel (31:1–9)'
  - where: setting
    claim: 'The closing poem has no heading of its own and is an alphabetic acrostic, each verse beginning with the next letter'
    key: ot-minute-proverbs
    url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-overview'
    quote: 'The book of Proverbs ends with a poem about a virtuous woman, and although it does not have a distinct heading, the poem is written as an alphabetic acrostic. This is a common poetic device in Hebrew poetry, and in it each verse begins with the next letter in the Hebrew alphabet.'
  - where: setting
    claim: 'A modern translation notes that verses 10–31 are an acrostic'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2031&version=NIV'
    quote: 'Verses 10-31 are an acrostic poem, the verses of which begin with the successive letters of the Hebrew alphabet.'
  - where: setting
    claim: 'Acrostics were likely a memory aid'
    key: sc-knowhy-234
    url: 'https://scripturecentral.org/knowhy/why-did-moroni-conclude-his-fathers-record-with-22-commands'
    quote: 'Acrostics were likely used in ancient times as a mnemonic device or memorization tool to help individuals to more easily memorize and recite compositions.'
  - where: setting
    claim: 'The Church outline counts chapter 31, poem included, among the words of Lemuel''s mother'
    key: scripture-helps-proverbs
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/35-proverbs-1-4-15-16-22-31-ecclesiastes-1-3-11-12?lang=eng'
    quote: 'Proverbs 30–31: The words of Agur and the words of King Lemuel’s mother to King Lemuel, which include a description of a virtuous woman.'
  - where: setting
    claim: 'Nothing is known of Lemuel beyond his name; he is thought to have been a non-Israelite king'
    key: scripture-helps-proverbs
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/35-proverbs-1-4-15-16-22-31-ecclesiastes-1-3-11-12?lang=eng'
    quote: 'Apart from his name, the scriptures provide no information about King Lemuel. He is thought to have been a non-Israelite king who recorded the wisdom and counsel given to him by his mother.'
  - where: thread
    claim: 'The Church reads the woman as a symbol of what living by the book''s wisdom produces'
    key: scripture-helps-proverbs
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/35-proverbs-1-4-15-16-22-31-ecclesiastes-1-3-11-12?lang=eng'
    quote: 'The book of Proverbs ends with an acrostic poem about a woman who symbolizes the outcome of living according to the wisdom found throughout Proverbs.'
  - where: thread
    claim: 'A long part of the poem describes her economic enterprises (31:13–22)'
    key: sc-knowhy-639
    url: 'https://scripturecentral.org/knowhy/why-were-women-important-in-ancient-israel'
    quote: 'A lengthy portion of this proverb includes a description of the virtuous woman’s economic enterprises, showing how women were vital to a household’s economic growth and support (Proverbs 31:10, 13–22).'
  - where: section 1 plain
    claim: 'Modern translations render massa in 31:1 as an oracle or inspired utterance'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2031&version=NRSVUE'
    quote: 'The words of King Lemuel. An oracle that his mother taught him'
  - where: section 4 plain
    claim: 'Shalal in 31:11 means gain'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2031&version=NRSVUE'
    quote: 'The heart of her husband trusts in her, and he will have no lack of gain.'
  - where: section 5 plain
    claim: 'Shesh in 31:22 is fine linen'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2031&version=NRSVUE'
    quote: 'her clothing is fine linen and purple'
  - where: section 6 plain
    claim: 'Torat chesed in 31:26 is the teaching of kindness; 31:25b laughs at the time to come'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2031&version=NRSVUE'
    quote: 'and she laughs at the time to come. … and the teaching of kindness is on her tongue.'
  - where: section 7 plain
    claim: 'Chen in 31:30 is charm'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2031&version=NRSVUE'
    quote: 'Charm is deceitful and beauty is vain'

  - where: 'note 31:1 “An oracle, or the land of Massa”'
    claim: 'Massa as a noun means utterance, oracle, of prophetic utterance, as in Isaiah 13:1'
    key: bdb
    url: 'https://biblehub.com/hebrew/4853.htm'
    quote: 'III. מַשָּׂא noun masculineIsaiah 14:28 utterance, oracle … of prophetic utterance: 2 Kings 9:25; Isaiah 14:28; Ezekiel 12:10; 2Chronicles 24:27 (with עַל); בָבֶל ׳מ Isaiah 13:1'
  - where: 'note 31:1 “An oracle, or the land of Massa”'
    claim: 'The Hebrew of 31:1 has massa'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Prov.xml'
    quote: 'מַ֝שָּׂ֗א'
  - where: 'note 31:1 “An oracle, or the land of Massa”'
    claim: 'The heading of Agur''s words (30:1) has the same word, hammassa'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Prov.xml'
    quote: 'הַ/מַּ֫שָּׂ֥א'
  - where: 'note 31:1 “An oracle, or the land of Massa”'
    claim: 'Massa may be the name of Lemuel''s realm, perhaps in north Arabia'
    key: bdb
    url: 'https://biblehub.com/hebrew/4854.htm'
    quote: '2 realm of king Lemuel Proverbs 31:1 De Now Str Wild. — Perhaps = North Arabic Mas''u'
  - where: 'note 31:1 “An oracle, or the land of Massa”'
    claim: 'One modern translation reads an oracle'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2031&version=NRSVUE'
    quote: 'The words of King Lemuel. An oracle that his mother taught him'
  - where: 'note 31:1 “An oracle, or the land of Massa”'
    claim: 'Another reads an inspired utterance'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2031&version=NIV'
    quote: 'The sayings(A) of King Lemuel—an inspired utterance his mother taught him.'
  - where: 'note 31:2 “The son of my vows”'
    claim: 'Vows were often made to obtain a favor from the Lord; one kind dedicated a person to the Lord'
    key: bd-vows
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/vows?lang=eng'
    quote: 'These were of two kinds: (a) dedication—some person or thing was given to the Lord … Vows often had an entreating character; they were offered in order to obtain some favor from Jehovah'
  - where: 'note 31:2 “The son of my vows”'
    claim: 'One older reading: the son she prayed for with vows and commits to God'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/31.htm'
    quote: 'the son for whom with vows of thanksgiving she prayed to God; and as he was given her by God, so to His care she commits him.'
  - where: 'note 31:2 “The son of my vows”'
    claim: 'A modern translation reads the opening as a warning, No, my son'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2031&version=NRSVUE'
    quote: '2 No, my son! No, son of my womb! No, son of my vows!'

  - where: 'note 31:3 “What destroys kings”'
    claim: 'A modern translation sets Deut. 17:17, 1 Kgs. 11:1 and Neh. 13:26 beside 31:3'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2031&version=NRSVUE'
    quote: '31.3 : Deut 17.17; 1 Kings 11.1; Neh 13.26; Prov 5.9'
  - where: 'note 31:3 “What destroys kings”'
    claim: 'Solomon''s wives turned away his heart (1 Kgs. 11:3)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/11?lang=eng'
    quote: 'And he had seven hundred wives, princesses, and three hundred concubines: and his wives turned away his heart.'
  - where: 'note 31:3 “What destroys kings”'
    claim: 'Nehemiah draws the lesson from Solomon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/13?lang=eng'
    quote: 'Did not Solomon king of Israel sin by these things? yet among many nations was there no king like him, who was beloved of his God, and God made him king over all Israel: nevertheless even him did outlandish women cause to sin.'
  - where: 'note 31:3 “What destroys kings”'
    claim: '“Strength” can be rendered wealth'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2031&version=NIV'
    quote: 'Proverbs 31:3 Or wealth'

  - where: 'note 31:8 “Speaking for those who cannot”'
    claim: 'The Hebrew of “appointed to destruction” is all children of passing away'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2031&version=NRSVUE'
    quote: '31.8 Heb all children of passing away'
  - where: 'note 31:8 “Speaking for those who cannot”'
    claim: 'A modern translation renders verse 8 Speak out for those who cannot speak'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2031&version=NRSVUE'
    quote: '8 Speak out for those who cannot speak, for the rights of all the destitute.'
  - where: 'note 31:8 “Speaking for those who cannot”'
    claim: 'A modern translation sets Job 29:12–17 beside verse 8'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2031&version=NRSVUE'
    quote: '31.8 : Job 29.12–17'
  - where: 'note 31:8 “Speaking for those who cannot”'
    claim: 'Job 29:16'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/29?lang=eng'
    quote: 'I was a father to the poor: and the cause which I knew not I searched out.'

  - where: 'note 31:10 “Hard to find, not impossible”'
    claim: 'One older reading: “who can find” conveys difficulty, not impossibility'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/31.htm'
    quote: 'The question מי ימצא, quis inveniat, which, Ecclesiastes 7:24, proceeds from the supposition of the impossibility of finding, conveys here only the idea of the difficulty of finding.'
  - where: 'note 31:10 “Hard to find, not impossible”'
    claim: 'That reading: in Jerusalem a newly married man was asked “has he found?”, as in 18:22'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/31.htm'
    quote: 'In ancient Jerusalem, when one was married, they were wont to ask: מצא אומוצא, i.e., has he found? thus as is said at Proverbs 18:22, or at Ecclesiastes 7:26.'
  - where: 'note 31:10 “Hard to find, not impossible”'
    claim: 'A modern translation cross-references 31:10 to Ruth 3:11 and Prov. 18:22'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2031&version=NIV'
    quote: 'Proverbs 31:10 : S Ru 3:11; S Pr 18:22'
  - where: 'note 31:10 “Hard to find, not impossible”'
    claim: 'A modern translation cross-references 31:10 to Prov. 8:35'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2031&version=NIV'
    quote: 'Proverbs 31:10 : Pr 8:35'

  - where: 'note 31:11 “No need of spoil”'
    claim: 'Shalal is booty, spoil of war; in 31:11 it means gain'
    key: bdb
    url: 'https://biblehub.com/hebrew/7998.htm'
    quote: '2 booty, spoil of war, of all kinds … 4 = gain Proverbs 31:11.'
  - where: 'note 31:11 “No need of spoil”'
    claim: 'A modern translation reads no lack of gain'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2031&version=NRSVUE'
    quote: 'and he will have no lack of gain.'
  - where: 'note 31:21 “Scarlet against the snow”'
    claim: 'One older reading: the scarlet clothing is wool, warm and dignified, cf. 2 Sam. 1:24'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/31.htm'
    quote: 'The scarlet clothing is of wool, which as such preserves warmth, and, as high-coloured, appears at the same time dignified (2 Samuel 1:24).'
  - where: 'note 31:21 “Scarlet against the snow”'
    claim: 'Jerome and Luther, following the Septuagint''s reading of the word, translate “with double clothing”'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/31.htm'
    quote: 'Therefore Rosenmller, Vaihinger, and Bttcher approve of the translation duplicibus (Jerome, Luther) [ equals with double clothing], because they read, with the lxx, שׁנים.'
  - where: 'note 31:21 “Scarlet against the snow”'
    claim: 'The Hebrew of 31:21 ends shanim'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Prov.xml'
    quote: 'שָׁנִֽים'
  - where: 'note 31:21 “Scarlet against the snow”'
    claim: 'The Septuagint has clothes of double texture in its verse 22'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/proverbs/31.htm'
    quote: '22She makes for her husband clothes of double texture, and garments for herself of fine linen and scarlet.'
  - where: 'note 31:21 “Scarlet against the snow”'
    claim: '2 Sam. 1:24, Saul clothed the daughters of Israel in scarlet'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/1?lang=eng'
    quote: 'Ye daughters of Israel, weep over Saul, who clothed you in scarlet, with other delights'

  - where: 'note 31:22 “Silk, or fine linen”'
    claim: 'KJV “silk” in 31:22 renders shesh, translated fine linen everywhere else'
    key: sc-knowhy-734
    url: 'https://scripturecentral.org/knowhy/did-book-of-mormon-peoples-wear-silk-and-linen'
    quote: 'The word silk in the King James Version of Proverbs 31:22 is mistranslated from the Hebrew shesh, which is translated in all other instances as “fine linen.” See Genesis 41:42'
  - where: 'note 31:22 “Silk, or fine linen”'
    claim: 'The Hebrew of 31:22 has shesh'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Prov.xml'
    quote: 'שֵׁ֖שׁ'
  - where: 'note 31:22 “Silk, or fine linen”'
    claim: 'Joseph was arrayed in fine linen (Gen. 41:42)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/41?lang=eng'
    quote: 'arrayed him in vestures of fine linen'
  - where: 'note 31:22 “Silk, or fine linen”'
    claim: 'Modern translations read fine linen and purple'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2031&version=NIV'
    quote: 'she is clothed in fine linen and purple.'

  - where: 'note 31:26 “The law of kindness”'
    claim: 'BDB: torat chesed in 31:26 is instruction in kindness, kindly instruction'
    key: bdb
    url: 'https://biblehub.com/hebrew/2617.htm'
    quote: '1 kindness of men towards men, in doing favours and benefits … ׳תּוֺרַתאח Proverbs 31:26 instruction in kindness, kindly instruction'
  - where: 'note 31:26 “The law of kindness”'
    claim: 'Chesed is kindness especially extended to the lowly and needy'
    key: bdb
    url: 'https://biblehub.com/hebrew/2617.htm'
    quote: '2 kindness (especially as extended to the lowly, needy and miserable), mercy'
  - where: 'note 31:26 “The law of kindness”'
    claim: 'The Hebrew of 31:26 has chesed'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Prov.xml'
    quote: 'חֶ֝֗סֶד'
  - where: 'note 31:26 “The law of kindness”'
    claim: 'A modern translation reads the teaching of kindness'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2031&version=NRSVUE'
    quote: 'and the teaching of kindness is on her tongue.'

  - where: 'note 31:30 “Praised for the fear of the LORD”'
    claim: 'A modern translation reads favour as charm'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2031&version=NRSVUE'
    quote: '30 Charm is deceitful and beauty is vain, but a woman who fears the Lord is to be praised.'
  - where: 'note 31:30 “Praised for the fear of the LORD”'
    claim: 'The Septuagint reads it is a wise woman that is blessed'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/proverbs/31.htm'
    quote: '30Charms are false, and woman''s beauty is vain: for it is a wise woman that is blessed, and let her praise the fear the Lord.'

  - where: 'note 31:31 “Praised in the gates”'
    claim: 'The city gate was a place of public business (Ruth 4:1–11 among others)'
    key: bd-gate
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/gate?lang=eng'
    quote: 'The gate of a city was often a place for public business (Deut. 21:19; Ruth 4:1–11; 2 Sam. 3:27; 15:2; Job 31:21; Ps. 69:12; 127:5; Isa. 29:21; Jer. 38:7; Lam. 5:14; Amos 5:10–15).'
  - where: christ
    claim: 'D&C 113:2 identifies the stem of Jesse as Christ'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/113?lang=eng'
    quote: 'Verily thus saith the Lord: It is Christ.'
  - where: christ
    claim: 'D&C 45:3, Christ the advocate pleading our cause'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/45?lang=eng'
    quote: 'Listen to him who is the advocate with the Father, who is pleading your cause before him—'
  - where: christ
    claim: 'D&C 124:75, Vinson Knight told to plead the cause of the poor and needy, and his offerings accepted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/124?lang=eng'
    quote: 'And let him lift up his voice long and loud, in the midst of the people, to plead the cause of the poor and the needy; and let him not fail, neither let his heart faint; and I will accept of his offerings'
  - where: christ
    claim: 'D&C 124:74 names Vinson Knight'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/124?lang=eng'
    quote: 'Therefore, I say unto you concerning my servant Vinson Knight'
