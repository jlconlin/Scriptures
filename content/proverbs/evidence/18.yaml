chapter: 18
claims:
  - where: setting
    claim: 'The saying of 18:8 is repeated at 26:22'
    key: bdb
    url: 'https://biblehub.com/hebrew/3859.htm'
    quote: 'Hithpa`el Participle מִתְלַהֲמִים Proverbs 18:8 i.e. bits greedily swallowed, dainties, = Proverbs 26:22, simile of tale-bearer''s words.'
  - where: setting
    claim: 'The first line of 18:11 repeats 10:15 (one older reading notes it)'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/18.htm'
    quote: 'Line first equals Proverbs 10:15.'
  - where: setting
    claim: 'The Church’s footnote at 18:22 gives the Joseph Smith Translation reading (the only JST footnote in the saved footnotes to Proverbs 1–31)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/18?lang=eng'
    quote: 'JST Prov. 18:22 Whoso findeth a good wife hath obtained favor of the Lord.'
  - where: setting
    claim: 'The Church’s footnote at 18:21 points to Matt. 12:37 and Alma 12:14'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/18?lang=eng'
    quote: '“tongue”: Matt. 12:37 (34–37); Alma 12:14.'
  - where: setting
    claim: 'Matt. 12:37 text'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/12?lang=eng'
    quote: 'For by thy words thou shalt be justified, and by thy words thou shalt be condemned.'
  - where: setting
    claim: 'Alma 12:14 text'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/12?lang=eng'
    quote: 'For our words will condemn us, yea, all our works will condemn us; we shall not be found spotless; and our thoughts will also condemn us'

  - where: thread
    claim: 'One older reading: 18:3–7 form a group that ends in two sayings on the fool’s lips and mouth'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/18.htm'
    quote: 'The group beginning with Proverbs 18:3 terminates in two proverbs (Proverbs 18:6 and Proverbs 18:7), related to the concluding verse of the foregoing:'
  - where: thread
    claim: 'One older reading: 18:8–19 is a series that begins with the talebearer and is framed by the catchword “brother” (9 and 19); 20–24 a group after it'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/18.htm'
    quote: 'With Proverbs 18:19, the series of proverbs which began with that of the flatterer closes. The catchword אח, which occurred at its commencement, 9b, is repeated at its close, and serves also as a landmark of the group following Proverbs 18:20-24.'
  - where: 'section 1 plain'
    claim: 'Verse 1: the one who separates himself seeks his own desire and breaks out against sound judgment (a modern translation)'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+18&version=ESV'
    quote: 'Whoever (A)isolates himself seeks his own desire; he breaks out against all sound judgment.'
  - where: 'section 1 plain'
    claim: '“That his heart may discover itself” means that his heart may reveal itself, show itself publicly'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/18.htm'
    quote: 'only that his heart, i.e., the understanding which he thinks that he already possesses, may reveal itself, show itself publicly.'
  - where: 'section 1 plain'
    claim: 'Verse 2: the fool takes pleasure only in expressing his opinion (a modern translation)'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+18&version=ESV'
    quote: 'A fool takes no pleasure in understanding, but only (B)in expressing his opinion.'

  - where: 'section 3 plain'
    claim: '“Searcheth him” in 18:17: the other party comes and cross-examines (a modern translation)'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+18&version=NRSVUE'
    quote: 'until the other comes and cross-examines.'
  - where: 'section 3 plain'
    claim: 'Verse 19: quarrels between those who had been friends are as hard to overcome as the bars of a castle gate (one older reading)'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/18.htm'
    quote: 'strifes and lawsuits between those who had been friends form as insurmountable a hindrance to their reconciliation, are as difficult to be raised, as the great bars at the gate of a castle (Fl.).'

  - where: 'note 18:1 “The man who cuts himself off”'
    claim: 'The verb of “separated himself” is used of one man separating from others; at 18:1 absolutely'
    key: bdb
    url: 'https://biblehub.com/hebrew/6504.htm'
    quote: '1 divide, separate (intransitive), Genesis 2:10 (of river, dividing into branches); of one man separating from another, with מֵעַל Genesis 13:9,11, מֵעִם Genesis 13:14 (all J), from others, מִן Judges 4:11; … absolute Proverbs 18:1'
  - where: 'note 18:1 “The man who cuts himself off”'
    claim: '“Intermeddleth” renders a verb meaning to break or burst out in contention'
    key: bdb
    url: 'https://biblehub.com/hebrew/1566.htm'
    quote: 'disclose oneself, break out, Proverbs 17:14 subject רִיב; break or burst out in contention, strife Proverbs 20:3 subject כָּלאֱֿוִיל; similarly Proverbs 18:1'
  - where: 'note 18:1 “The man who cuts himself off”'
    claim: 'A modern translation: whoever isolates himself seeks his own desire and breaks out against all sound judgment'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+18&version=ESV'
    quote: 'Whoever (A)isolates himself seeks his own desire; he breaks out against all sound judgment.'
  - where: 'note 18:1 “The man who cuts himself off”'
    claim: 'Another modern translation: an unfriendly person pursues selfish ends and starts quarrels'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+18&version=NIV'
    quote: 'An unfriendly person pursues selfish ends and against all sound judgment starts quarrels.'
  - where: 'note 18:8 “Morsels swallowed whole”'
    claim: 'The Hebrew word rendered “wounds” means bits greedily swallowed, dainties, a simile of the talebearer’s words; the same at 26:22'
    key: bdb
    url: 'https://biblehub.com/hebrew/3859.htm'
    quote: 'Hithpa`el Participle מִתְלַהֲמִים Proverbs 18:8 i.e. bits greedily swallowed, dainties, = Proverbs 26:22, simile of tale-bearer''s words.'
  - where: 'note 18:8 “Morsels swallowed whole”'
    claim: 'Modern translations: the words of a whisperer are like delicious morsels'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+18&version=ESV'
    quote: '8 (H)The words of a whisperer are like delicious morsels; they go down into (I)the inner parts of the body.'
  - where: 'note 18:10 “Two strongholds”'
    claim: '“Is safe” (18:10) and “high” (18:11) are the same verb, “be high”; used of walls at 18:11'
    key: bdb
    url: 'https://biblehub.com/hebrew/7682.htm'
    quote: '1 be high, walls Isaiah 30:13; Proverbs 18:11; city Isaiah 26:5; God''s knowledge Psalm 139:6 (unattainable).'
  - where: 'note 18:10 “Two strongholds”'
    claim: 'The same verb stands in 18:10 and 18:11'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Prov.xml'
    quote: 'נִ֝שְׂגָּבָ֗ה'
  - where: 'note 18:10 “Two strongholds”'
    claim: '“Conceit” renders a word meaning imagination, conceit'
    key: bdb
    url: 'https://biblehub.com/hebrew/4906.htm'
    quote: '2 imagination, conceit, Proverbs 18:11, לֵבָב ׳מ Psalm 73:7.'
  - where: 'note 18:22 “A good wife”'
    claim: 'The JST reads “Whoso findeth a good wife hath obtained favor of the Lord”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/18?lang=eng'
    quote: 'JST Prov. 18:22 Whoso findeth a good wife hath obtained favor of the Lord.'
  - where: 'note 18:22 “A good wife”'
    claim: 'McConkie calls 18:22 the most significant JST change in Proverbs'
    key: mcconkie-poetic-writings
    url: 'https://rsc.byu.edu/joseph-smith-translation/joseph-smith-poetic-writings'
    quote: 'The most significant change made in Proverbs is in the verse which states, “Whoso findeth a wife findeth a good thing, and obtaineth favour of the Lord” (Proverbs 18:22). The Prophet corrected the verse to read, “Whoso findeth a good wife hath obtained favor of the Lord.”'
  - where: 'note 18:22 “A good wife”'
    claim: 'The Septuagint reads “a good wife” and adds a line about putting away a good wife'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/proverbs/18.htm'
    quote: '22He that has found a good wife has found favours, and has received gladness from God. (18:22A) He that puts away a good wife, puts away a good thing, and he that keeps an adulteress is foolish and ungodly.'
  - where: 'note 18:22 “A good wife”'
    claim: 'The Hebrew of 18:22 has no adjective with “wife”; “good” stands alone after the second “findeth”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Prov.xml'
    quote: 'ט֑וֹב'

  - where: 'note 18:24 “Many companions, and one friend”'
    claim: 'The verb in 18:24a is uncertain: BDB gives “will be broken in pieces, ruined” (Delitzsch and others) and notes that the versions read another word'
    key: bdb
    url: 'https://biblehub.com/hebrew/7489.htm'
    quote: 'Infinitive construct לְהִתְרוֺעֵעַ Proverbs 18:24 will be broken in pieces (Ges§ 114i), ruined, De and others, but < read לְהִתְרָעוֺת Vrss Toy and others, see רעה Hithpa`el'
  - where: 'note 18:24 “Many companions, and one friend”'
    claim: 'A modern translation: a man of many companions may come to ruin'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+18&version=ESV'
    quote: '24 A man of many companions may come to ruin, but (AB)there is a friend who sticks closer than a brother.'
  - where: 'note 18:24 “Many companions, and one friend”'
    claim: 'Another modern translation: some friends play at friendship'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+18&version=NRSVUE'
    quote: '24 Some friends play at friendship, but a true friend sticks closer than one’s sibling.(Q)'
  - where: 'note 18:24 “Many companions, and one friend”'
    claim: '“Sticketh” renders an adjective “clinging, cleaving,” used also of those who cleave to the LORD (Deut. 4:4)'
    key: bdb
    url: 'https://biblehub.com/hebrew/1695.htm'
    quote: 'דָּבֵק adjective clinging, cleaving (to), ׳דּ absolute וְיֵשׁ אֹהֵב דָּבֵק מֵאָח Proverbs 18:24; … of cleaving to ׳הַדְּבֵקִים בְּ י Deuteronomy 4:4.'

  - where: 'note 18:1 “The man who cuts himself off”'
    claim: 'A modern translation: the one who isolates himself seeks his own desire'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+18&version=ESV'
    quote: 'seeks his own desire; he breaks out against all sound judgment.'
  - where: 'note 18:24 “Many companions, and one friend”'
    claim: 'The Hebrew verb means broken in pieces, ruined; the versions read a different word'
    key: bdb
    url: 'https://biblehub.com/hebrew/7489.htm'
    quote: 'will be broken in pieces (Ges§ 114i), ruined'

  - where: 'note 18:10 “Two strongholds”'
    claim: 'One older reading: verses 10 and 11 are two proverbs, the fortress of faith and the fortress of presumption'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/18.htm'
    quote: 'Two proverbs, of the fortress of faith, and of the fortress of presumption:'
  - where: 'note 18:10 “Two strongholds”'
    claim: 'One older reading: the righteous runs into the name to hide behind its walls and is lifted high above all danger'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/18.htm'
    quote: 'Into this the righteous runneth, to hide himself behind its walls, and is thus lifted (perf. consec.) high above all danger'
  - where: 'note 18:10 “Two strongholds”'
    claim: 'One older reading: the name of the LORD is His nature representing itself'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/18.htm'
    quote: 'His name is His nature representing itself, and therefore capable of being described and named'
  - where: 'note 18:10 “Two strongholds”'
    claim: 'One older reading: the first line of 18:11 repeats 10:15'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/18.htm'
    quote: 'Line first equals Proverbs 10:15.'

  - where: christ
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: christ
    claim: 'Mosiah 3:17 text: no other name than the name of Christ'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/3?lang=eng'
    quote: 'there shall be no other name given nor any other way nor means whereby salvation can come unto the children of men, only in and through the name of Christ, the Lord Omnipotent.'
  - where: christ
    claim: 'Mosiah 5:8 text: take upon you the name of Christ'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/5?lang=eng'
    quote: 'There is no other name given whereby salvation cometh; therefore, I would that ye should take upon you the name of Christ'
  - where: christ
    claim: 'D&C 20:77: those who partake witness they are willing to take upon them the name of the Son'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/20?lang=eng'
    quote: 'that they are willing to take upon them the name of thy Son, and always remember him and keep his commandments which he has given them'
  - where: 'note 18:1 “The man who cuts himself off”'
    claim: 'A modern translation marks the meaning of the Hebrew of 18:1 uncertain'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+18&version=NRSVUE'
    quote: '18.1 Meaning of Heb uncertain'
  - where: 'note 18:1 “The man who cuts himself off”'
    claim: 'The lexicon records a proposed correction of the verb in 18:1'
    key: bdb
    url: 'https://biblehub.com/hebrew/1566.htm'
    quote: 'Grl.c. proposes יִלְעַג or יַלְעִיג'
  - where: 'note 18:24 “Many companions, and one friend”'
    claim: 'The NRSVUE marks the Hebrew of 18:24 uncertain and corrects it by the versions'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+18&version=NRSVUE'
    quote: '18.24 Cn Compare Syr Vg Tg: Meaning of Heb uncertain'
