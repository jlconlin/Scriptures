chapter: 26
claims:
  - where: setting
    claim: 'The collection of 25–29 repeats many proverbs and parts of proverbs from the first collection'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/1.htm'
    quote: 'On the other hand, in this second collection we find numerous repetitions of proverbs and portions of proverbs from the first'
  - where: setting
    claim: 'One older reading: within 25–29 only one whole proverb returns, 26:12 at 29:20'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/1.htm'
    quote: 'only a single entire proverb is repeated in almost similar terms, but in an altered sense, Proverbs 29:20 equals Proverbs 26:12'
  - where: setting
    claim: 'The sluggard''s lion excuse appears at 22:13'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/22?lang=eng'
    quote: 'The slothful man saith, There is a lion without, I shall be slain in the streets.'
  - where: thread
    claim: 'One older reading groups 26:1–12 as proverbs of the fool, with verse 2 of different content but the same form'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/26.htm'
    quote: 'There now follows a group of eleven proverbs of the fool; only the first of the group has after it a proverb of different contents, but of similar form'
  - where: thread
    claim: '26:13–16 are a group on the slothful'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/26.htm'
    quote: 'There follows now a group of proverbs regarding the slothful'
  - where: thread
    claim: '26:17ff. recommend the love of peace by caricatures of its opposite'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/26.htm'
    quote: 'A series of proverbs which recommend the love of peace, for they present caricatures of the opposite'
  - where: thread
    claim: '26:23ff. treat hypocrisy'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/26.htm'
    quote: 'The proverbs next following treat of a cognate theme, hypocrisy (the art of dissembling)'
  - where: thread
    claim: 'The Church''s footnote gives “own eyes” for “own conceit” in verses 5, 12 and 16'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/26?lang=eng'
    quote: '“own conceit”: OR own eyes (also vv. 12, 16).'
  - where: section 1 plain
    claim: 'An undeserved curse goes nowhere (modern translation of v. 2)'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+26&version=NRSVUE'
    quote: 'an undeserved curse goes nowhere.'
  - where: section 1 plain
    claim: 'The lame man''s legs hang limp (modern translation of v. 7)'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+26&version=NRSVUE'
    quote: 'The legs of a lame person hang limp;'
  - where: section 2 plain
    claim: 'The sluggard buries his hand in the dish (v. 15)'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+26&version=NRSVUE'
    quote: 'The lazy person buries a hand in the dish'
  - where: section 2 plain
    claim: 'Seven men who can give a sensible answer (v. 16)'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+26&version=NRSVUE'
    quote: 'than seven who can answer discreetly.'
  - where: section 3 plain
    claim: 'The deceiver says he was only joking (v. 19)'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+26&version=NRSVUE'
    quote: 'and says, “I am only joking!”'
  - where: section 4 plain
    claim: 'The lying tongue hates those it bruises (v. 28)'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/26.htm'
    quote: '28 The lying tongue hateth those whom it bruiseth;'
  - where: 'note 26:2 “A curse without cause”'
    claim: 'At 26:2 the written text (ketiv) has lo'' “not” and the reading (qere) lo “to him”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Prov.xml'
    quote: 'לא'
  - where: 'note 26:2 “A curse without cause”'
    claim: 'A modern translation: an undeserved curse goes nowhere'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+26&version=NRSVUE'
    quote: 'an undeserved curse goes nowhere.'
  - where: 'note 26:4 “Answer not, and answer”'
    claim: 'In v. 4 “according to his folly” means taking up the fool''s foolish premise'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/26.htm'
    quote: 'After, or according to his folly, is here equivalent to recognising the foolish supposition and the foolish object of his question, and thereupon considering it'
  - where: 'note 26:4 “Answer not, and answer”'
    claim: 'Whoever sanctions such questions puts himself on the fool''s level'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/26.htm'
    quote: 'He who recognises such questions as justifiable, and thus sanctions them, places himself on an equality with the fool, and easily himself becomes one.'
  - where: 'note 26:4 “Answer not, and answer”'
    claim: 'In v. 5 the phrase means as his folly deserves: rejecting it firmly'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/26.htm'
    quote: 'after, or according to his folly, is this second time equivalent to, as is due to his folly: decidedly and firmly rejecting it, making short work with it'
  - where: 'note 26:6 “Cutting off one’s own feet”'
    claim: 'A modern translation of v. 6'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+26&version=NRSVUE'
    quote: 'It is like cutting off one’s foot and drinking down violence,'
  - where: 'note 26:7 “A proverb in a fool’s mouth”'
    claim: 'A modern translation of v. 7: the legs of the lame hang limp; so a proverb in a fool''s mouth'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+26&version=NRSVUE'
    quote: 'The legs of a lame person hang limp;'
  - where: 'note 26:7 “A proverb in a fool’s mouth”'
    claim: 'The “parable” of vv. 7, 9 is a proverb'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+26&version=NRSVUE'
    quote: 'so does a proverb in the mouth of a fool.'
  - where: 'note 26:8 “A stone in a sling”'
    claim: 'The fool makes the honour no honour'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/26.htm'
    quote: 'the fool makes the honour no honour; he is not capable of maintaining it; that which is conferred on him is uselessly wasted.'
  - where: 'note 26:8 “A stone in a sling”'
    claim: 'Honour strengthens the fool in his folly'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/26.htm'
    quote: 'it will strengthen him in his folly, and only increase it.'
  - where: 'note 26:10 “A verse no one is sure of”'
    claim: 'A modern translation renders v. 10 of an archer and notes the Hebrew is uncertain'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+26&version=NRSVUE'
    quote: '26.10 Meaning of Heb uncertain'
  - where: 'note 26:10 “A verse no one is sure of”'
    claim: 'A modern translation reads rab as archer'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+26&version=NRSVUE'
    quote: 'Like an archer who wounds everybody'
  - where: 'note 26:10 “A verse no one is sure of”'
    claim: 'A modern translation of v. 10'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+26&version=NRSVUE'
    quote: 'is one who hires a passing fool or drunkard.'
  - where: 'note 26:10 “A verse no one is sure of”'
    claim: 'The verse opens with rab and has no word for God (rab, mecholel, kol, wesoker, kesil, wesoker, ''obrim)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Prov.xml'
    quote: 'רַ֥ב'
  - where: 'note 26:10 “A verse no one is sure of”'
    claim: 'The Septuagint reads v. 10 differently'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/proverbs/26.htm'
    quote: '10All the flesh of fools endures much hardship; for their fury is brought to nought.'
  - where: 'note 26:11 “The dog and its vomit”'
    claim: 'Peter quotes the proverb of those who had known Christ and returned to the pollutions of the world'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/2-pet/2?lang=eng'
    quote: 'But it is happened unto them according to the true proverb, The dog is turned to his own vomit again; and the sow that was washed to her wallowing in the mire.'
  - where: 'note 26:11 “The dog and its vomit”'
    claim: 'The Book of Mormon uses it of people who turned from righteousness within six years'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/7?lang=eng'
    quote: 'And thus six years had not passed away since the more part of the people had turned from their righteousness, like the dog to his vomit, or like the sow to her wallowing in the mire.'
  - where: 'note 26:12 “Wise in his own eyes”'
    claim: 'One older reading: the fool aware he is not wise is likelier to be put right than the self-wise, whose delusion is the greatest hindrance'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/26.htm'
    quote: 'so the putting right of a fool, who is conscious that he is not wise (cf. Proverbs 24:7), is more likely to be effected than that of one deeming himself wise; for the greatest hindrance to any turning toward that which is better lies in the delusion that he does not need it.'
  - where: 'note 26:23 “Silver glaze on clay”'
    claim: 'A modern translation: glaze on an earthen vessel; smooth lips'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+26&version=NRSVUE'
    quote: 'Like the glaze covering an earthen vessel'
  - where: 'note 26:23 “Silver glaze on clay”'
    claim: 'A modern translation: smooth lips with an evil heart'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+26&version=NRSVUE'
    quote: 'are smooth lips with an evil heart.'
  - where: 'note 26:23 “Silver glaze on clay”'
    claim: 'The modern translation follows the Greek for “burning”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+26&version=NRSVUE'
    quote: '26.23 Gk: Heb burning'
  - where: 'note 26:23 “Silver glaze on clay”'
    claim: 'The Septuagint reads smooth lips'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/proverbs/26.htm'
    quote: 'smooth lips cover a grievous heart.'
  - where: explore
    claim: 'One older reading: 27a''s oldest original is Psalm 7 (Heb. v. 16), repeated in Ecclesiastes 10:8'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/26.htm'
    quote: 'in the form which it here receives, 27a has its oldest original in Psalm 7:16, whence it is repeated here and in Ecclesiastes 10:8'
  - where: explore
    claim: 'Nephi: the great pit dug by the great and abominable church will be filled by those who dug it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/14?lang=eng'
    quote: 'yea, that great pit which hath been digged for the destruction of men shall be filled by those who digged it'
  - where: christ
    claim: 'The Church''s footnote at v. 5 points to Matthew 16:1–4'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/26?lang=eng'
    quote: '“Answer”: Matt. 16:2 (1–4).'
  - where: christ
    claim: 'Jesus answered the sign-seekers and departed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/16?lang=eng'
    quote: 'A wicked and adulterous generation seeketh after a sign; and there shall no sign be given unto it, but the sign of the prophet Jonas. And he left them, and departed.'
  - where: christ
    claim: 'One older reading sets v. 12 beside Matthew 9:12'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/26.htm'
    quote: 'As the conversion of a sinner, who does not regard himself as righteous, is more to be expected than that of a self-righteous man (Matthew 9:12.)'
  - where: christ
    claim: 'Jesus: the sick need a physician'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/9?lang=eng'
    quote: 'They that be whole need not a physician, but they that are sick.'
  - where: 'note 26:7 “A proverb in a fool’s mouth”'
    claim: 'A modern translation of v. 9: a thornbush brandished by a drunkard'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+26&version=NRSVUE'
    quote: 'Like a thornbush brandished by the hand of a drunkard'
  - where: 'note 26:23 “Silver glaze on clay”'
    claim: 'A modern translation marks “glaze” as a conjecture; the Hebrew reads silver of dross'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+26&version=NRSVUE'
    quote: '26.23 Cn: Heb silver of dross'
  - where: explore
    claim: 'The Church''s footnote on “pit” at 26:27 lists 1 Ne. 14:3 and 2 Ne. 28:8'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/26?lang=eng'
    quote: '“pit”: Prov. 28:10; 1 Ne. 14:3; 22:14; 2 Ne. 28:8; D&C 109:25.'
  - where: explore
    claim: 'Isaiah''s woe on the wise in their own eyes'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/5?lang=eng'
    quote: 'Woe unto them that are wise in their own eyes, and prudent in their own sight!'
  - where: 'note 26:6 “Cutting off one’s own feet”'
    claim: 'A modern translation of v. 6, second line'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+26&version=NRSVUE'
    quote: 'to send a message by a fool.'
