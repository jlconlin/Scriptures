chapter: 14
claims:
  - where: setting
    claim: 'The proverbs of Solomon proper are 10:1–22:16, under the heading at 10:1'
    key: ot-minute-proverbs
    url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-overview'
    quote: 'The actual proverbs of Solomon are found in Proverbs 10:1–22:16. This section is 375 lines in the Hebrew text and corresponds to its heading found in Proverbs 10:1.'
  - where: setting
    claim: 'Verse 12 is repeated at 16:25'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/14.htm'
    quote: 'This is literally repeated in Proverbs 16:25.'
  - where: setting
    claim: 'The first line of verse 31 is repeated at 17:5, somewhat varied'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/14.htm'
    quote: 'Line first is repeated in Proverbs 17:5 somewhat varied'
  - where: setting
    claim: 'A Latter-day Saint study of the Book of Mormon promise to prosper in the land quotes 14:34'
    key: sc-knowhy-116
    url: 'https://scripturecentral.org/knowhy/what-does-it-mean-to-prosper-in-the-land'
    quote: 'the essence of the covenantal promise is the same as that given to Israel as a whole. … Proverbs 14:34 states, “Righteousness exalteth a nation: but sin is a reproach to any people.”'

  - where: thread
    claim: 'One older reading: in 14:11 the firm house is given to the wicked and the easily destroyed tent to the upright'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/14.htm'
    quote: 'here the apparently firmly-founded house is assigned to the godless, and on the contrary the tent, easily destroyed, and not set up under the delusion of lasting for ever, is assigned to the righteous.'

  - where: 'note 14:1 “Wisdom builds the house”'
    claim: 'The Hebrew of 14:1 reads “wisdom of women”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2014&version=NRSVUE'
    quote: '14.1 Heb Wisdom of women'
  - where: 'note 14:1 “Wisdom builds the house”'
    claim: 'The verse opens with chokmot, “wisdom of”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Prov.xml'
    quote: 'חַכְמ֣וֹת'
  - where: 'note 14:1 “Wisdom builds the house”'
    claim: 'One older reading renders “The wisdom of the woman buildeth her house” and reads the word as at 9:1'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/14.htm'
    quote: '1 The wisdom of the woman buildeth her house,'
  - where: 'note 14:1 “Wisdom builds the house”'
    claim: 'The same reading points the word as at 9:1'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/14.htm'
    quote: 'as at Proverbs 9:1 (especially since this passage rests on the one before us)'
  - where: 'note 14:1 “Wisdom builds the house”'
    claim: 'The oneness of the house depends more on the mother than on the father'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/14.htm'
    quote: 'In truth, the oneness of the house is more dependent on the mother than on the father. A wise mother can, if her husband be dead or neglectful of his duty, always keep the house together'
  - where: 'note 14:1 “Wisdom builds the house”'
    claim: 'In the reading Delitzsch relays, to build the house is to regulate its affairs well'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/14.htm'
    quote: 'to build the house is figuratively equivalent to, to regulate well the affairs of a house, and to keep them in a good condition'

  - where: 'note 14:4 “An empty manger”'
    claim: 'Crib means the manger of a stable where oxen feed'
    key: webster-1828
    url: 'https://webstersdictionary1828.com/Dictionary/crib'
    quote: '1. The manger of a stable, in which oxen and cows feed.'
  - where: 'note 14:4 “An empty manger”'
    claim: 'A modern translation: where there are no oxen, there is no grain'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2014&version=NRSVUE'
    quote: '4 Where there are no oxen, there is no grain; abundant crops come by the strength of the ox.'

  - where: 'note 14:9 “Mocking at guilt”'
    claim: 'BDB lists 14:9 under asham meaning guilt'
    key: bdb
    url: 'https://biblehub.com/hebrew/817.htm'
    quote: '2 guilt Genesis 26:10 (J) Proverbs 14:9; Jeremiah 51:5.'
  - where: 'note 14:9 “Mocking at guilt”'
    claim: 'The Hebrew word is asham'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Prov.xml'
    quote: 'אָשָׁ֑ם'
  - where: 'note 14:9 “Mocking at guilt”'
    claim: 'A modern translation: fools mock at the guilt offering; meaning of the Hebrew uncertain'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2014&version=NRSVUE'
    quote: '9 Fools mock at the guilt offering, but the upright enjoy God’s favor. … 14.9 Meaning of Heb uncertain'


  - where: 'note 14:27 “A fountain of life”'
    claim: 'Proverbs 13:14 says the same of the law of the wise'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/13?lang=eng'
    quote: 'The law of the wise is a fountain of life, to depart from the snares of death.'
  - where: 'note 14:27 “A fountain of life”'
    claim: 'The Septuagint reads “the commandment of the Lord” at 14:27'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/proverbs/14.htm'
    quote: '27The commandment of the Lord is a fountain of life; and it causes men to turn aside from the snare of death.'

  - where: 'note 14:31 “The poor man’s Maker”'
    claim: 'One older reading: kindness to the poor arises from a common relation to one Creator and respect for one bearing the image of God'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/14.htm'
    quote: 'The showing of forbearance and kindness to the poor arising from a common relation to one Creator, and from respect towards a personality bearing the image of God'
  - where: 'note 14:31 “The poor man’s Maker”'
    claim: 'The first line is repeated at 17:5 somewhat varied; Matt 25:40 is its New Testament side-piece'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/14.htm'
    quote: 'Line first is repeated in Proverbs 17:5 somewhat varied … Mat 25:40 is a New Testament side-piece to 31b.'
  - where: 'note 14:31 “The poor man’s Maker”'
    claim: 'Proverbs 17:5 text'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/17?lang=eng'
    quote: 'Whoso mocketh the poor reproacheth his Maker'

  - where: 'note 14:32 “Hope in death”'
    claim: 'The Hebrew reads bemoto, “in his death”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Prov.xml'
    quote: 'בְ/מוֹת֣/וֹ'
  - where: 'note 14:32 “Hope in death”'
    claim: 'The Greek and Syriac read “in their integrity”; the Hebrew “in their death”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2014&version=NRSVUE'
    quote: '32 The wicked are overthrown by their evildoing, but the righteous find a refuge in their integrity. … 14.32 Gk Syr: Heb in their death'
  - where: 'note 14:32 “Hope in death”'
    claim: 'The Septuagint: he who is secure in his own holiness is just'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/proverbs/14.htm'
    quote: '32The ungodly shall be driven away in his wickedness: but he who is secure in his own holiness is just.'
  - where: 'note 14:32 “Hope in death”'
    claim: 'One older reading: the Greek changes “in his death” to “in his uprightness”; no scripture so commends self-righteousness; the verb means confidence in God'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/14.htm'
    quote: 'changes במותו [in his death] into בתמּו [in his uprightness]'
  - where: 'note 14:32 “Hope in death”'
    claim: 'The verb designates confidence resting in God'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/14.htm'
    quote: 'is everywhere the exclusive (vid., Psalm 118:8.) designation of confidence resting itself in God'
  - where: 'note 14:32 “Hope in death”'
    claim: 'One older reading: the righteous in his death is comforted in God'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/14.htm'
    quote: 'the righteous in his death, even in the midst of extremity, is comforted, viz., in God in whom he confides.'
  - where: 'note 14:32 “Hope in death”'
    claim: 'They fell asleep, though without explicit knowledge, not without hope of eternal life'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/14.htm'
    quote: 'they fell asleep, though without any explicit knowledge, yet not without the hope of eternal life.'

  - where: 'note 14:34 “Righteousness and a nation”'
    claim: 'KnoWhy 116: the Book of Mormon promise to prosper in the land is the same promise given to Israel'
    key: sc-knowhy-116
    url: 'https://scripturecentral.org/knowhy/what-does-it-mean-to-prosper-in-the-land'
    quote: 'Though some commentators have called it the “Lehitic covenant,” the essence of the covenantal promise is the same as that given to Israel as a whole.'
  - where: 'note 14:34 “Righteousness and a nation”'
    claim: 'The promise spoken to Lehi, recalled at Alma 9:13'
    key: sc-knowhy-116
    url: 'https://scripturecentral.org/knowhy/what-does-it-mean-to-prosper-in-the-land'
    quote: '“Behold, do ye not remember the words which he spake unto Lehi, saying that: Inasmuch as ye shall keep my commandments, ye shall prosper in the land?'
  - where: 'note 14:34 “Righteousness and a nation”'
    claim: 'KnoWhy 116 quotes 14:34 among the Old Testament forms of the promise'
    key: sc-knowhy-116
    url: 'https://scripturecentral.org/knowhy/what-does-it-mean-to-prosper-in-the-land'
    quote: 'Proverbs 14:34 states, “Righteousness exalteth a nation: but sin is a reproach to any people.”'
  - where: 'note 14:34 “Righteousness and a nation”'
    claim: 'Mormon’s abridgment would illustrate the principle of 14:34'
    key: ricks-small-plates
    url: 'https://rsc.byu.edu/book-mormon-jacob-through-words-mormon-learn-joy/small-plates-nephi-words-mormon'
    quote: 'It would illustrate the principle, “Righteousness exalteth a nation: but sin is a reproach to any people” (Prov 14:34).'
  - where: 'note 14:34 “Righteousness and a nation”'
    claim: 'Mormon’s digest was a selection of the best of nearly a thousand years of Nephite history'
    key: ricks-small-plates
    url: 'https://rsc.byu.edu/book-mormon-jacob-through-words-mormon-learn-joy/small-plates-nephi-words-mormon'
    quote: 'It would be a selection of the best that nearly a thousand years of Nephite history had to offer'

  - where: christ
    claim: 'One older reading: Matt 25:40 is the New Testament side-piece to 14:31b'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/14.htm'
    quote: 'Mat 25:40 is a New Testament side-piece to 31b.'
  - where: christ
    claim: 'Matt 25:40 text'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/25?lang=eng'
    quote: 'Inasmuch as ye have done it unto one of the least of these my brethren, ye have done it unto me.'
  - where: christ
    claim: 'D&C 52:40 text'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/52?lang=eng'
    quote: 'And remember in all things the poor and the needy, the sick and the afflicted, for he that doeth not these things, the same is not my disciple.'

  - where: 'note 14:9 “Mocking at guilt”'
    claim: 'BDB: asham is also the trespass (guilt) offering of the law, for offences that could be covered by compensation'
    key: bdb
    url: 'https://biblehub.com/hebrew/817.htm'
    quote: '4 trespass-offering (AV, but guilt-offering RV) used only in Leviticus 5 … This offering seems to have been confined to offences against God or man that could be estimated and so covered by compensation.'
  - where: 'note 14:9 “Mocking at guilt”'
    claim: 'The Septuagint reads a different line at 14:9'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/proverbs/14.htm'
    quote: '9The houses of transgressors will need purification; but the houses of the just are acceptable.'
  - where: 'note 14:12 “A way that seems right”'
    claim: 'Proverbs 16:25 repeats 14:12 with “that” for “which”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/16?lang=eng'
    quote: 'There is a way that seemeth right unto a man, but the end thereof are the ways of death.'
  - where: 'note 14:12 “A way that seems right”'
    claim: 'The Septuagint: the ends of it reach to the depths of hell'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/proverbs/14.htm'
    quote: '12There is a way which seems to be right with men, but the ends of it reach to the depths of hell.'
  - where: 'note 14:21 “What people do, and what God asks”'
    claim: 'Verses 20 and 21 as printed: an observation, then a verdict'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/14?lang=eng'
    quote: 'The poor is hated even of his own neighbour: but the rich hath many friends. … He that despiseth his neighbour sinneth: but he that hath mercy on the poor, happy is he.'
  - where: 'section 2 plain'
    claim: 'A modern translation renders 14:10b “no stranger shares its joy”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2014&version=NRSVUE'
    quote: 'and no stranger shares its joy'
