chapter: 13
claims:
  - where: setting
    claim: 'Chapters 10–29 of Proverbs are full of antithetic parallelisms, uncounted in one scholar’s tally'
    key: parry-antithetical
    url: 'https://rsc.byu.edu/preserved-translation/antithetical-parallelism'
    quote: 'One scholar found some 521 instances therein but noted that his count does not include “the almost innumerable antithetic parallelisms in chaps. 10–29 of the book of Proverbs.”'
  - where: setting
    claim: 'Parry gives Proverbs 13:9 as an example of antithetical parallelism contrasting the righteous and the wicked'
    key: parry-antithetical
    url: 'https://rsc.byu.edu/preserved-translation/antithetical-parallelism'
    quote: 'Another example, Proverbs 13:9, differentiates the righteous from the wicked:'

  - where: thread
    claim: 'In 10:1–22:16 no saying stands in necessary connection with its neighbors; each is a finished whole (one older reading)'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/1.htm'
    quote: 'nowhere (not even Proverbs 19:19) does such a distich proverb stand in necessary connection with one that precedes or that follows; each is in itself a small perfected and finished whole.'
  - where: thread
    claim: 'Musar (lemma 4148) is the word behind “instruction” in 13:1'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Prov.xml'
    quote: 'מ֣וּסַר'
  - where: thread
    claim: 'Musar is the word behind “instruction” in 13:18 and in 13:24 (“chasteneth him … ” with musar)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Prov.xml'
    quote: 'מוּסָֽר'
  - where: thread
    claim: 'Musar means discipline, chastening, correction (and is translated “instruction”)'
    key: bdb
    url: 'https://biblehub.com/hebrew/4148.htm'
    quote: 'discipline (of the moral nature), chastening, correction'
  - where: thread
    claim: 'The main message of Proverbs is that seeking God’s wisdom makes life go well; Ecclesiastes says it is not that simple'
    key: cfm-ot-2026-37
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/37?lang=eng'
    quote: 'Its main message is that if you seek wisdom—especially God’s wisdom—life will go well. But Proverbs is followed by the book of Ecclesiastes, which seems to say, “It’s not that simple.”'

  - where: 'section 2 plain'
    claim: '13:7 read as pretending to be rich or poor'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2013&version=NRSVUE'
    quote: 'Some pretend to be rich yet have nothing; others pretend to be poor yet have great wealth.'
  - where: 'section 2 plain'
    claim: '13:8b read as hearing no threat; 13:10 pride yields nothing but strife'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2013&version=ESV'
    quote: 'but a poor man hears no threat. … By insolence comes nothing but strife,'
  - where: 'section 4 plain'
    claim: '13:23b read as swept away through injustice; 13:24b as diligent/early discipline'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2013&version=ESV'
    quote: 'but it is swept away through injustice.'

  - where: 'note 13:7 “Pretending to be rich”'
    claim: 'Both verbs in 13:7 are Hithpael (reflexive) participles'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Prov.xml'
    quote: 'מִ֭תְעַשֵּׁר'
  - where: 'note 13:7 “Pretending to be rich”'
    claim: 'A modern translation: pretend to be rich, pretend to be poor'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2013&version=NRSVUE'
    quote: 'Some pretend to be rich yet have nothing; others pretend to be poor yet have great wealth.'
  - where: 'note 13:7 “Pretending to be rich”'
    claim: 'A second modern translation also reads “pretends”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2013&version=ESV'
    quote: 'One pretends to be rich, yet has nothing; another pretends to be poor, yet has great wealth.'
  - where: 'note 13:8 “What riches buy”'
    claim: 'Ge’arah is a rebuke; BDB lists 13:8 under rebuke of man'
    key: bdb
    url: 'https://biblehub.com/hebrew/1606.htm'
    quote: 'גְּעָרָה noun feminine rebuke … 1 of man Proverbs 13:1,8'
  - where: 'note 13:8 “What riches buy”'
    claim: 'One modern translation: the poor pays no attention to a rebuke'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2013&version=NRSVUE'
    quote: 'Wealth is a ransom for a person’s life, but a poor person pays no attention to a rebuke.'
  - where: 'note 13:8 “What riches buy”'
    claim: 'Another modern translation: the poor hears no threat'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2013&version=ESV'
    quote: 'The ransom of a man''s life is his wealth, but a poor man hears no threat.'
  - where: 'note 13:8 “What riches buy”'
    claim: 'One older reading: the threat is to life from robbers (1:11–14) or in war; riches endanger their owner and serve as ransom; poverty keeps the poor safe'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/13.htm'
    quote: 'But one may think e.g., on waylayers as those introduced as speaking Proverbs 1:11-14. … Also in the times of war and commotion it may be seen that riches endanger the life of their possessor, and that in fortunate cases they are given as a ransom for his life, while his poverty places the poor man in safety.'

  - where: 'note 13:10 “Pride and contention”'
    claim: 'President Benson taught that contention is a face of pride, listing its forms'
    key: benson-pride
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1989/04/beware-of-pride?lang=eng'
    quote: 'Another face of pride is contention. Arguments, fights, unrighteous dominion, generation gaps, divorces, spouse abuse, riots, and disturbances all fall into this category of pride.'
  - where: 'note 13:10 “Pride and contention”'
    claim: 'President Benson cited Proverbs 13:10 for it'
    key: benson-pride
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1989/04/beware-of-pride?lang=eng'
    quote: 'The scriptures tell us that “only by pride cometh contention.” (Prov. 13:10; see also Prov. 28:25.)'
  - where: 'note 13:10 “Pride and contention”'
    claim: 'A modern translation renders pride as “insolence”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2013&version=NRSVUE'
    quote: 'By insolence the empty-headed person makes strife,'
  - where: 'note 13:10 “Pride and contention”'
    claim: 'A modern translation: by insolence comes nothing but strife'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2013&version=ESV'
    quote: 'By insolence comes nothing but strife,'

  - where: 'note 13:23 “Without justice”'
    claim: 'The Hebrew of 13:23b is belo mishpat; the same words stand in 16:8'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Prov.xml'
    quote: 'מִשְׁפָּֽט'
  - where: 'note 13:23 “Without justice”'
    claim: 'Nir is the tillable, untilled or fallow ground; at 13:23 it yields abundant food with the LORD’s blessing'
    key: bdb
    url: 'https://biblehub.com/hebrew/5215.htm'
    quote: 'נִיר noun [masculine] the tillable, untilled or fallow ground; … רָבאֹֿכֶל נִיר רָאשִׁים Proverbs 13:23 abundant food (yields) the fallow ground of poor men (i.e. with ׳יs blessing).'
  - where: 'note 13:23 “Without justice”'
    claim: 'A modern translation: the field of the poor may yield much food but it is swept away through injustice'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2013&version=NRSVUE'
    quote: 'The field of the poor may yield much food, but it is swept away through injustice.'
  - where: 'note 13:23 “Without justice”'
    claim: 'A second modern translation reads the same'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2013&version=ESV'
    quote: 'The fallow ground of the poor would yield much food, but it is swept away through injustice.'

  - where: 'note 13:24 “The rod”'
    claim: 'Shebet means rod, staff, club, sceptre'
    key: bdb
    url: 'https://biblehub.com/hebrew/7626.htm'
    quote: '1 rod, staff, club, sceptre.'
  - where: 'note 13:24 “The rod”'
    claim: 'At 13:24 shachar with musar means seeks him early with discipline; the verb is to look early, diligently for'
    key: bdb
    url: 'https://biblehub.com/hebrew/7836.htm'
    quote: '[שָׁחר] verb denominative look early, diligently for … שִׁחֲרוֺ מוּסָר Proverbs 13:24 seeks him early (with) discipline (chastises him be-times)'
  - where: 'note 13:24 “The rod”'
    claim: 'Musar means discipline, chastening, correction'
    key: bdb
    url: 'https://biblehub.com/hebrew/4148.htm'
    quote: 'discipline, chastening, correction'
  - where: 'note 13:24 “The rod”'
    claim: 'Musar is the word in 13:24 (and, as “instruction,” in 13:1 and 13:18)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Prov.xml'
    quote: 'מוּסָֽר'
  - where: 'note 13:24 “The rod”'
    claim: 'One older reading: the rod represents the means of punishment'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/13.htm'
    quote: 'The rod represents here the means of punishment, the patria potestas.'
  - where: 'note 13:24 “The rod”'
    claim: 'Modern translations: diligent to discipline (first of two)'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2013&version=NRSVUE'
    quote: 'but those who love them are diligent to discipline them.'
  - where: 'note 13:24 “The rod”'
    claim: 'A modern translation: diligent to discipline, with the footnote “disciplines him early”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2013&version=ESV'
    quote: 'but he who loves him is diligent to discipline him.'
  - where: 'note 13:24 “The rod”'
    claim: 'The ESV footnote at 13:24: “disciplines him early”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2013&version=ESV'
    quote: 'Or who loves him disciplines him early'
  - where: 'note 13:24 “The rod”'
    claim: 'Scripture Helps: 13:24 and 22:15 are figurative expressions for loving and consistent discipline, not a justification for physical abuse'
    key: scripture-helps-proverbs
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/35-proverbs-1-4-15-16-22-31-ecclesiastes-1-3-11-12?lang=eng'
    quote: 'These scriptures are best understood as figurative expressions emphasizing the importance of loving and consistent discipline. They should not be used as a justification for physical abuse. Modern revelation teaches that discipline should be done in love and righteousness and never by force or violence.'
  - where: 'note 13:24 “The rod”'
    claim: 'The proclamation warns that those who abuse offspring will stand accountable before God'
    key: family-proclamation
    url: 'https://www.churchofjesuschrist.org/study/scriptures/the-family-a-proclamation-to-the-world/the-family-a-proclamation-to-the-world?lang=eng'
    quote: 'We warn that individuals who violate covenants of chastity, who abuse spouse or offspring, or who fail to fulfill family responsibilities will one day stand accountable before God.'
  - where: 'note 13:24 “The rod”'
    claim: 'President Hinckley never accepted “spare the rod and spoil the child”'
    key: hinckley-save-children
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1994/10/save-the-children?lang=eng'
    quote: 'In terms of physical abuse, I have never accepted the principle of “spare the rod and spoil the child.”'
  - where: 'note 13:24 “The rod”'
    claim: 'President Hinckley: children don’t need beating; they need love and encouragement'
    key: hinckley-save-children
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1994/10/save-the-children?lang=eng'
    quote: 'Children don’t need beating. They need love and encouragement.'
  - where: 'note 13:24 “The rod”'
    claim: 'Newell and others suggest reading the rod of 13:24 as the word of God, as a choice'
    key: newell-rearing-children
    url: 'https://rsc.byu.edu/divine-design/rearing-children-love-righteousness-latitude-limits-love'
    quote: 'For example, Proverbs 13:24 states, “He that spareth his rod hateth his son: but he that loveth him chasteneth him betimes.” One might choose to read this as, “They who withhold the word of God hateth their children:'
  - where: 'note 13:24 “The rod”'
    claim: 'The same study uses the shepherd’s rod that comforts (Ps. 23:4) and the rod as the word of God (1 Ne. 15:23–24)'
    key: newell-rearing-children
    url: 'https://rsc.byu.edu/divine-design/rearing-children-love-righteousness-latitude-limits-love'
    quote: 'The shepherd’s rod is never used for beating sheep, else the passage “thy rod and thy staff . . . comfort me” (Psalm 23:4) makes little sense. … also translated from the Hebrew in other places as “the word of God” … (see Micah 6:9; Isaiah 11:4; 1 Nephi 15:23–24; Psalm 23:4).'

  - where: christ
    claim: 'The Church’s footnote at 13:24 points to Mosiah 4:14 and D&C 68:28'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/13?lang=eng'
    quote: '24b “chasteneth”: Mosiah 4:14; D&C 68:28.'
  - where: christ
    claim: 'Discipline should be done in love and righteousness, never by force or violence'
    key: scripture-helps-proverbs
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/35-proverbs-1-4-15-16-22-31-ecclesiastes-1-3-11-12?lang=eng'
    quote: 'Modern revelation teaches that discipline should be done in love and righteousness and never by force or violence.'

  - where: explore
    claim: 'The Newell study addresses this verse among prophets’ teaching on discipline'
    key: newell-rearing-children
    url: 'https://rsc.byu.edu/divine-design/rearing-children-love-righteousness-latitude-limits-love'
    quote: 'Prophets have particularly discouraged the overuse of physical punishment.'
