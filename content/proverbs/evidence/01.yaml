chapter: 1
claims:
  # setting
  - where: setting
    claim: 'Scripture Helps calls Proverbs a library collected over several centuries'
    key: scripture-helps-proverbs
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/35-proverbs-1-4-15-16-22-31-ecclesiastes-1-3-11-12?lang=eng'
    quote: 'While many of the proverbs are attributed to Solomon, the book of Proverbs can be seen as a library of Israelite wisdom literature that was collected over several centuries.'
  - where: setting
    claim: 'A Latter-day Saint study dates the compilation no earlier than the sixth century BC'
    key: allis-pike-words-wise
    url: 'https://rsc.byu.edu/give-ear-my-words/words-wise'
    quote: 'While the book of Proverbs was not likely compiled in its present form until, at the earliest, the sixth century BC, Proverbs reports that Hezekiah and his men “copied out” some of the proverbs of Solomon'
  - where: setting
    claim: 'Chapters 1–9 are ten speeches of a father followed by four poems of wisdom as a woman'
    key: scripture-helps-proverbs
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/35-proverbs-1-4-15-16-22-31-ecclesiastes-1-3-11-12?lang=eng'
    quote: 'Proverbs 1–9: Ten speeches from a father to a son explaining true wisdom. These speeches are followed by four poems that depict wisdom as a woman.'
  - where: setting
    claim: '1:1–7 is the introduction to the book; 1:8–9:18 the instructions from father to son'
    key: ot-minute-proverbs
    url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-overview'
    quote: 'Introduction to the book (1:1–7) … Instructions from father to son (1:8–9:18)'
  - where: setting
    claim: 'Wisdom is first introduced as a figure in 1:20–33'
    key: von-feldt-instructional-wisdom
    url: 'https://interpreterfoundation.org/journal/his-secret-is-with-the-righteous-instructional-wisdom-in-the-book-of-mormon'
    quote: 'One of the most remarkable features of Proverbs 1–9 is the personification of wisdom. This figure is first introduced in Proverbs 1:20–33.'
  - where: setting
    claim: 'Alma’s counsel to his sons has been read beside Proverbs 1–9'
    key: allis-pike-words-wise
    url: 'https://rsc.byu.edu/give-ear-my-words/words-wise'
    quote: 'When seen through the lens of Proverbs 1–9, Alma’s teachings to his sons in Alma 36–39 become deeper and more meaningful.'
  - where: setting
    claim: 'Paul quotes Proverbs 1:16 in Romans 3'
    key: sc-knowhy-535
    url: 'https://scripturecentral.org/knowhy/why-new-testament-words-and-phrases-are-in-the-book-of-mormon-part-6-why-do-similar-clusters'
    quote: 'Romans 3:10–18, where Paul declares that he is quoting from Scripture by using the introduction, “as it is written,” and then goes on to use a chain of partial scriptural quotations, including phrases from … Proverbs 1:16'

  - where: setting
    claim: 'Many proverbs use parallelism: an idea repeated or contrasted in similar structure'
    key: scripture-helps-proverbs
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/35-proverbs-1-4-15-16-22-31-ecclesiastes-1-3-11-12?lang=eng'
    quote: 'Many of the proverbs use of a form of poetry known as parallelism. This occurs when a writer expresses an idea and then repeats or contrasts the idea using a similar sentence structure but different words.'

  # thread
  - where: thread
    claim: 'Poetic justice for those who harm others is a hallmark of wisdom literature (1:19)'
    key: ot-minute-proverbs-1-9
    url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
    quote: 'One of the hallmarks of wisdom literature is emphasizing the poetic justice that awaits those who seek to harm others: “So are the ways of everyone that is greedy of gain'
  - where: thread
    claim: 'Verse 29 has the same Hebrew phrase as verse 7, yir’at YHWH'
    key: bdb
    url: 'https://biblehub.com/hebrew/3374.htm'
    quote: '"" the knowledge (of God) Proverbs 1:29; Proverbs 2:5; Isaiah 11:2; is the beginning of wisdom Psalm 111:10; Proverbs 9:10, and knowledge Proverbs 1:7'

  # section plains
  - where: section 1 plain
    claim: '“Justice” and “judgment” in 1:3 rendered righteousness and justice'
    key: ot-minute-proverbs-1-9
    url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
    quote: 'The word ṣedeq (here rendered “justice”) is usually translated as “righteousness,” and the word mišpat (here rendered “judgment”) is probably better translated as “justice.”'
  - where: section 1 plain
    claim: '“Subtilty” in 1:4 is prudence'
    key: bdb
    url: 'https://biblehub.com/hebrew/6195.htm'
    quote: '2 ׳ע in Proverbs, in good sense, prudence Proverbs 1:4; Proverbs 8:5,12.'
  - where: section 1 plain
    claim: '“Dark sayings” are riddles'
    key: ot-manual-proverbs
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-2?lang=eng'
    quote: 'The Hebrew idiom dark sayings connotes riddles or puzzles.'
  - where: section 3 plain
    claim: 'The ornament and chains of 1:9 are a crown and necklaces'
    key: ot-manual-proverbs
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-2?lang=eng'
    quote: 'wisdom won through obedience to parental counsel is as a lovely ornament (crown) to one’s head and as chains (necklaces) about one’s neck.'
  - where: section 5 plain
    claim: '“Seek me early” (1:28) means to seek eagerly'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/1.htm'
    quote: 'to go out and to seek with the morning twilight … to rise early, to be zealous'

  # note 1:1
  - where: 'note 1:1 “Solomon’s name over a collection”'
    claim: 'Solomon spoke three thousand proverbs (1 Kgs. 4:32), cited by the manual'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/4?lang=eng'
    quote: 'And he spake three thousand proverbs: and his songs were a thousand and five.'
  - where: 'note 1:1 “Solomon’s name over a collection”'
    claim: 'Some of Solomon’s wisdom was preserved by later writers and editors'
    key: ot-manual-proverbs
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-2?lang=eng'
    quote: 'Solomon spoke or compiled three thousand proverbs and wrote 1,005 songs (see 1 Kings 4:32). Some of his wisdom was undoubtedly preserved by later writers and editors of the Old Testament'
  - where: 'note 1:1 “Solomon’s name over a collection”'
    claim: 'The actual proverbs of Solomon are in 10:1–22:16, under the heading of 10:1'
    key: ot-minute-proverbs
    url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-overview'
    quote: 'the book is not composed entirely of proverbs, nor do they all come from Solomon. The actual proverbs of Solomon are found in Proverbs 10:1–22:16. This section … corresponds to its heading found in Proverbs 10:1.'
  - where: 'note 1:1 “Solomon’s name over a collection”'
    claim: 'Chapters 1–9 are not personal to Solomon; no son is named'
    key: allis-pike-words-wise
    url: 'https://rsc.byu.edu/give-ear-my-words/words-wise'
    quote: 'Though attributed to the famously wise King Solomon (Proverbs 1:1), these proverbs are not generally thought to be personal to him or his children. No son or child is named.'
  - where: 'note 1:1 “Solomon’s name over a collection”'
    claim: 'Mashal is a similitude or parable; the book also has maxims and long poems'
    key: bd-proverbs
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/proverbs-book-of?lang=eng'
    quote: 'The Hebrew word rendered proverb is mashal, a similitude or parable, but the book contains many maxims and sayings not properly so called, and also connected poems of considerable length.'
  - where: 'note 1:1 “Solomon’s name over a collection”'
    claim: 'Mashal is also used of a by-word, Balaam’s prophetic discourse, parable, poem'
    key: bdb
    url: 'https://biblehub.com/hebrew/4912.htm'
    quote: '2 by-word … 3 prophetic figurative discourse: … Numbers 23:7,18; Numbers 24:3,15,20,21,23 (all of Balaam) … 4 similitude, parable … 5 poem, of various kinds'

  # note 1:2
  - where: 'note 1:2 “Wisdom as a skill for living”'
    claim: 'Chokmah is used of skill in war, technical work, sailors; also ethical and religious wisdom'
    key: bdb
    url: 'https://biblehub.com/hebrew/2451.htm'
    quote: '1 skill in war Isaiah 10:13; in technical work Exodus 28:3; Exodus 31:3,6 … of sailors Psalm 107:27. … 5 wisdom, ethical and religious'
  - where: 'note 1:2 “Wisdom as a skill for living”'
    claim: 'Wisdom as the infusion of God’s understanding into lived life'
    key: allis-pike-words-wise
    url: 'https://rsc.byu.edu/give-ear-my-words/words-wise'
    quote: 'Wisdom is, in one sense, the infusion of God’s understanding into lived life.'
  - where: 'note 1:2 “Wisdom as a skill for living”'
    claim: 'The prologue’s many words for wisdom have similar meanings'
    key: allis-pike-words-wise
    url: 'https://rsc.byu.edu/give-ear-my-words/words-wise'
    quote: '“the concept of wisdom in particular can be difficult because there are so many words that appear to have a quite similar meaning.”'
  - where: 'note 1:2 “Wisdom as a skill for living”'
    claim: 'Sedeq usually righteousness, mishpat better justice; both about community'
    key: ot-minute-proverbs-1-9
    url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
    quote: 'The word ṣedeq (here rendered “justice”) is usually translated as “righteousness,” and the word mišpat (here rendered “judgment”) is probably better translated as “justice.” Both terms are about living together with others in a community.'
  - where: 'note 1:2 “Wisdom as a skill for living”'
    claim: '‘Ormah means craftiness, but prudence in Proverbs'
    key: bdb
    url: 'https://biblehub.com/hebrew/6195.htm'
    quote: 'עָרְמָה noun feminine craftiness, prudence; — 1 ׳בְע craftily Exodus 21:14 (E), Joshua 9:4 (JE). 2 ׳ע in Proverbs, in good sense, prudence Proverbs 1:4'
  - where: 'note 1:2 “Wisdom as a skill for living”'
    claim: 'The King James renders the word “guile” as well as “subtilty”'
    key: strongs-concordance
    url: 'https://biblehub.com/hebrew/6195.htm'
    quote: 'Feminine of orem; trickery; or (in a good sense) discretion -- guile, prudence, subtilty, wilily, wisdom.'
  - where: 'note 1:2 “Wisdom as a skill for living”'
    claim: 'The adjective ‘arum describes the serpent and, in Proverbs, the prudent man'
    key: bdb
    url: 'https://biblehub.com/hebrew/6175.htm'
    quote: 'עָרוּם adjective crafty, shrewd, sensible; — 1 crafty, ׳ע as predicate, of serpent Genesis 3:1 … 2 in Proverbs, in good sense … = prudent man Proverbs 14:15'

  # note 1:7
  - where: 'note 1:7 “The motto of the book”'
    claim: 'The footnote at 1:7 reads “reverence”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/1?lang=eng'
    quote: '7a “fear of the Lord”: OR reverence of the Lord. TG Reverence.'
  - where: 'note 1:7 “The motto of the book”'
    claim: 'The Bible Dictionary: throughout it is taken for granted'
    key: bd-proverbs
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/proverbs-book-of?lang=eng'
    quote: 'There is much in it that does not rise above the plane of worldly wisdom, but throughout it is taken for granted that “the fear of the Lord is the beginning of wisdom” (1:7; 9:10).'
  - where: 'note 1:7 “The motto of the book”'
    claim: 'Restated near the end of chapter 9; not as secular as supposed; spiritual even when temporal'
    key: allis-pike-words-wise
    url: 'https://rsc.byu.edu/give-ear-my-words/words-wise'
    quote: 'And near the end of chapter nine this sentiment is reiterated … are indeed founded in religion and therefore are not as ‘secular’ as often supposed.” … are spiritual even when focused on the temporal.'
  - where: 'note 1:7 “The motto of the book”'
    claim: 'Prov. 31:30 praises the woman who fears the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/31?lang=eng'
    quote: 'Favour is deceitful, and beauty is vain: but a woman that feareth the LORD, she shall be praised.'
  - where: 'note 1:7 “The motto of the book”'
    claim: 'The manual: to the Lord all things are spiritual'
    key: ot-manual-proverbs
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-2?lang=eng'
    quote: 'Though there is much in the book that does not rise above worldly wisdom, the whole serves as a reminder that to the Lord all things are spiritual (see D&C 29:34).'

  # note 1:8
  - where: 'note 1:8 “A father and a mother teaching a son”'
    claim: '“Son” may be a pupil, but parents taught and the home was the original site of wisdom teaching'
    key: allis-pike-words-wise
    url: 'https://rsc.byu.edu/give-ear-my-words/words-wise'
    quote: 'It is true that ‘son’ can be understood in the metaphorical sense to indicate a teacher-pupil relationship. … it stands to reason that parents would have played a role in the training of their children. The home may be regarded as perhaps the original site of wisdom teaching'
  - where: 'note 1:8 “A father and a mother teaching a son”'
    claim: 'The father speaks warmly and in the imperative'
    key: allis-pike-words-wise
    url: 'https://rsc.byu.edu/give-ear-my-words/words-wise'
    quote: 'Both Alma and the proverbial father use the imperative or command form. They address their children in a possessive, warm manner saying, “my son.”'
  - where: 'note 1:8 “A father and a mother teaching a son”'
    claim: 'Father’s instruction and mother’s law on equal footing; the son is presumed to know it'
    key: allis-pike-words-wise
    url: 'https://rsc.byu.edu/give-ear-my-words/words-wise'
    quote: 'The parallelism employed here places on similar, perhaps equal, footing the instruction of the father and the law of the mother. Though the father does not include the mother’s counsel, it is apparent that he presumes his son is familiar with it.'
  - where: 'note 1:8 “A father and a mother teaching a son”'
    claim: '“Law” in 1:8 is torah, used of a mother’s instruction'
    key: bdb
    url: 'https://biblehub.com/hebrew/8451.htm'
    quote: 'a. human: of a mother Proverbs 1:8; Proverbs 6:20,23; of a father Proverbs 3:1'
  - where: 'note 1:8 “A father and a mother teaching a son”'
    claim: 'Alma’s instructions are read as wisdom, temporal and spiritual advice like Proverbs 1–9'
    key: sc-knowhy-744
    url: 'https://scripturecentral.org/knowhy/why-are-alma-s-instructions-to-his-sons-filled-with-proverbial-wisdom'
    quote: 'Throughout Proverbs 1–9 and Alma 36–42, the father and Alma offer both temporal and spiritual advice to their sons'
  - where: 'note 1:8 “A father and a mother teaching a son”'
    claim: 'Alma opens “My son, give ear to my words”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/36?lang=eng'
    quote: 'My son, give ear to my words; for I swear unto you, that inasmuch as ye shall keep the commandments of God ye shall prosper in the land.'

  # note 1:10
  - where: 'note 1:10 “Sinners who fill their houses with spoil”'
    claim: 'A sinner actively harms others; they build their houses by undermining others'
    key: ot-minute-proverbs-1-9
    url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
    quote: 'A sinner is not just someone who makes incorrect choices but someone who actively attempts to harm those around them. … These sinners are in the business of building their own houses and attempting to provide for themselves'
  - where: 'note 1:10 “Sinners who fill their houses with spoil”'
    claim: 'Path and objective equally important; their way puts them on a path to ruin'
    key: ot-minute-proverbs-1-9
    url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
    quote: 'Their desire to use their God-given creative powers to destroy others puts them on a path to ruin. … In Proverbs, the path and the objective are equally important.'

  # note 1:16
  - where: 'note 1:16 “Paul’s chain of scriptures”'
    claim: 'Romans 3:10–18 is a composite quotation including Proverbs 1:16 and Isaiah 59:7'
    key: sc-knowhy-535
    url: 'https://scripturecentral.org/knowhy/why-new-testament-words-and-phrases-are-in-the-book-of-mormon-part-6-why-do-similar-clusters'
    quote: 'Another example of this type of “composite quotation” in the New Testament can be found in Romans 3:10–18 … including phrases from Psalms 5:9; 10:7; 14:1–3; 36:1; 140:3; Proverbs 1:16; and Isaiah 59:7. … Paul gives no indication of where these passages are coming from'
  - where: 'note 1:16 “Paul’s chain of scriptures”'
    claim: 'Romans 3:15 and Isaiah 59:7 read as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/3?lang=eng'
    quote: 'Their feet are swift to shed blood:'

  # note 1:17
  - where: 'note 1:17 “A net spread in plain sight”'
    claim: 'Birds fly from a net spread before their eyes; the stress is on “before the eyes”; the warned should apply it to himself'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/1.htm'
    quote: 'But if this is done incautiously before the eyes of the birds to be caught, they forthwith fly away. The principle stress lies on the בּעיני (before the eyes) as the reason of the חנּם (in vain)'
  - where: 'note 1:17 “A net spread in plain sight”'
    claim: 'The warned ought to apply the similitude to himself'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/1.htm'
    quote: 'Thus, as Ziegler has noticed, the warned ought to make application of the similitude to himself'
  - where: 'note 1:17 “A net spread in plain sight”'
    claim: 'Verse 18: they murder themselves'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/1.htm'
    quote: 'they wish to murder others, but, as the result shows, they only murder themselves.'

  - where: 'note 1:17 “A net spread in plain sight”'
    claim: 'Other interpreters read it that the birds see not the net but only the corn'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/1.htm'
    quote: 'Hitzig, Ewald, Zckler, and others, therefore interpret חנם, not in the sense of in vain, inasmuch as they do not let themselves be caught; but: in vain, for they see not the net, but only the scattered corn.'

  # note 1:20
  - where: 'note 1:20 “Wisdom as a woman calling in the streets”'
    claim: 'Wisdom is personified because the Hebrew noun is feminine'
    key: ot-minute-proverbs-1-9
    url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
    quote: 'Because the Hebrew word for wisdom is a feminine noun, wisdom is personified as a woman.'
  - where: 'note 1:20 “Wisdom as a woman calling in the streets”'
    claim: 'Limhi personifies wisdom as “she” (Mosiah 8:20); wisdom of mothers may account for the figure'
    key: allis-pike-words-wise
    url: 'https://rsc.byu.edu/give-ear-my-words/words-wise'
    quote: 'The wisdom of mothers may, to a real extent, account for the personification of wisdom as Woman Wisdom in Proverbs'
  - where: 'note 1:20 “Wisdom as a woman calling in the streets”'
    claim: 'Mosiah 8:20 reads as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/8?lang=eng'
    quote: 'they will not seek wisdom, neither do they desire that she should rule over them!'
  - where: 'note 1:20 “Wisdom as a woman calling in the streets”'
    claim: 'She calls in crowded public places; the message is for the general public'
    key: von-feldt-instructional-wisdom
    url: 'https://interpreterfoundation.org/journal/his-secret-is-with-the-righteous-instructional-wisdom-in-the-book-of-mormon'
    quote: 'in the “chief place of concourse,” and at “the gates” of the city from where all the roads of the city fan out (Proverbs 1:20–21). These are all crowded, bustling places. Her message is directed to the general public.'

  # note 1:22
  - where: 'note 1:22 “The simple, the scorner and the fool”'
    claim: 'Peti: open to wisdom or folly, believing every word, usually tending to bad sense'
    key: bdb
    url: 'https://biblehub.com/hebrew/6612.htm'
    quote: 'simple, as substantive concrete: open to the instruction of wisdom or folly, Proverbs 9:4,16; believing every word Proverbs 14:15 … in good sense … but usually tendency to bad sense; פתאים love פתי Proverbs 1:22'
  - where: 'note 1:22 “The simple, the scorner and the fool”'
    claim: 'The scorner is proud, delights in scorning, incapable of discipline; same word in Ps 1:1'
    key: bdb
    url: 'https://biblehub.com/hebrew/3887.htm'
    quote: 'plural לֵצִים Psalm 1:1 3t. … הַלֵּץ the scorner is proud and haughty Proverbs 21:24, delights in scorning Proverbs 1:22, is incapable of discipline Proverbs 9:7'
  - where: 'note 1:22 “The simple, the scorner and the fool”'
    claim: 'Kesil: stupid fellow, dullard; hates knowledge; delights not in understanding'
    key: bdb
    url: 'https://biblehub.com/hebrew/3684.htm'
    quote: 'כְּסִיל70 noun masculine stupid fellow, dullard, fool; … he hates knowledge Proverbs 1:22; delights not in understanding Proverbs 18:2'
  - where: 'note 1:22 “The simple, the scorner and the fool”'
    claim: 'Verses quoted and paraphrased (14:15; 21:24; 9:7; 18:2) read as given'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/14?lang=eng'
    quote: 'The simple believeth every word: but the prudent man looketh well to his going.'

  # note 1:23
  - where: 'note 1:23 “Wisdom’s spirit poured out like a spring”'
    claim: 'Naba: flow, spring, bubble up; Prov 18:4 a flowing wady as metaphor of the wellspring of wisdom; pour out figurative in 1:23 parallel to make known words'
    key: bdb
    url: 'https://biblehub.com/hebrew/5042.htm'
    quote: 'verb flow, spring, bubble up … נַ֫חַל נֹבֵעַ Proverbs 18:4 a flowing wady, metaphor of מְקוֺר חָכְמָה. … 1 pour out, figurative אַבִּיעָה לָכֶם רוּחִי Proverbs 1:23 ("" אוֺדִ֫יעָה דְבָרַי אֶתְכֶם).'
  - where: 'note 1:23 “Wisdom’s spirit poured out like a spring”'
    claim: 'Personified wisdom gives her pupils the divine spirit (1:23)'
    key: bdb
    url: 'https://biblehub.com/hebrew/2451.htm'
    quote: 'she teaches in public Proverbs 1:20; Proverbs 8:1,5,11,12 (see context); gives her pupils the divine spirit Proverbs 1:23'
  - where: 'note 1:23 “Wisdom’s spirit poured out like a spring”'
    claim: 'Von Feldt sets 1:23 beside Nephi’s teaching on the Holy Ghost as guide giving the words of Christ'
    key: von-feldt-instructional-wisdom
    url: 'https://interpreterfoundation.org/journal/his-secret-is-with-the-righteous-instructional-wisdom-in-the-book-of-mormon'
    quote: 'whereas in Proverbs the guide that opposes the strange woman is the wisdom figure, for Nephi, the guide on the strait and narrow path that is rejected by the great and abominable church is the Holy Ghost. … Nephi closely associates the Holy Ghost with the word of God, just as Wisdom is linked to the law and the commandments in Proverbs 1–9.'
  - where: 'note 1:23 “Wisdom’s spirit poured out like a spring”'
    claim: 'Von Feldt quotes 1:23 as similar to the Holy Ghost giving the words of Christ'
    key: von-feldt-instructional-wisdom
    url: 'https://interpreterfoundation.org/journal/his-secret-is-with-the-righteous-instructional-wisdom-in-the-book-of-mormon'
    quote: 'by giving them the “words of Christ” (2 Nephi 32:3). … This is similar to the counsel about the guidance of wisdom in Proverbs: “I will pour out my spirit unto you. I will make known my words unto you” (Proverbs 1:23).'
  - where: 'note 1:23 “Wisdom’s spirit poured out like a spring”'
    claim: 'Proverbs 18:4 has the wellspring of wisdom as a flowing brook'
    key: lds-scriptures
