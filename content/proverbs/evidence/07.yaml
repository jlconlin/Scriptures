chapter: 7
claims:
  - where: setting
    claim: 'Chapter 7 is one of the lectures on the strange woman, with 2:16–22, 5:1–13 and 6:20–35'
    key: von-feldt-instructional-wisdom
    url: 'https://interpreterfoundation.org/journal/his-secret-is-with-the-righteous-instructional-wisdom-in-the-book-of-mormon'
    quote: 'Lectures on the strange woman include Proverbs 2:16–22, 5:1–13, 6:20–35, and 7:1–27.'
  - where: setting
    claim: 'In one Latter-day Saint reading 7:1–27 is the tenth instruction, titled “Beware the seductress”'
    key: von-feldt-instructional-wisdom
    url: 'https://interpreterfoundation.org/journal/his-secret-is-with-the-righteous-instructional-wisdom-in-the-book-of-mormon'
    quote: 'Instruction X 7:1–27 Beware the seductress'
  - where: setting
    claim: 'Proverbs 1–9 is composed of ten instructions'
    key: von-feldt-instructional-wisdom
    url: 'https://interpreterfoundation.org/journal/his-secret-is-with-the-righteous-instructional-wisdom-in-the-book-of-mormon'
    quote: 'Proverbs 1–9 is composed of ten instructions, also known as lectures, discourses, or admonitions, which are interspersed with five interludes or hymns (table 1).'
  - where: setting
    claim: 'Verses 6–23 are the father’s account of witnessing a young man succumb to the strange woman'
    key: ot-minute-proverbs-1-9
    url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
    quote: 'The father then gives an account of witnessing a young man succumb to the “strange woman” (verses 6–23).'
  - where: setting
    claim: 'Chapter 8 sets Wisdom crying in public against the strange woman acting in secrecy'
    key: ot-minute-proverbs-1-9
    url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
    quote: 'Just as the strange woman took action to tear others down in the shadow of secrecy, Lady Wisdom acts by standing and crying in public to those she might help (Proverbs 8:1–3).'

  - where: thread
    claim: 'Building a house and household that will endure is constantly emphasized in Proverbs 1–9'
    key: ot-minute-proverbs-1-9
    url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
    quote: 'The importance of this young man’s being able to build a house and a household that will endure is constantly emphasized in Proverbs 1–9. The way that this house is built and provided for makes all the difference.'

  - where: section 1 plain
    claim: '“Apple of thine eye” rendered “pupil of your eye”'
    key: ot-minute-proverbs-1-9
    url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
    quote: 'This phrase is probably better translated as the “pupil of your eye.”'
  - where: section 2 plain
    claim: '“Black” night in verse 9 is the middle of the night, deep darkness'
    key: bdb
    url: 'https://biblehub.com/hebrew/380.htm'
    quote: '= middle, midst of night לַיְלָה וַאֲפֵלָה ׳בְּא Proverbs 7:9'
  - where: section 2 plain
    claim: 'The casement is a lattice'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/7.htm'
    quote: 'From behind the lattice I looked out;'
  - where: section 3 plain
    claim: '“Subtil of heart”: wily of heart'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+7&version=ESV'
    quote: 'dressed as a prostitute, wily of heart.'
  - where: section 4 plain
    claim: 'Her peace offerings leave her meat with which to regale him'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/7.htm'
    quote: 'the שׁלמי נדר have yielded much to her that she might therewith regale him, her true lover'
  - where: section 4 plain
    claim: '“At the day appointed”: at full moon; “goodman”: my husband'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+7&version=ESV'
    quote: 'at full moon he will come home.'
  - where: section 5 plain
    claim: '“Correction of the stocks”: the restraint of fetters'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/7.htm'
    quote: 'And as one bereft of reason to the restraint of fetters,'

  - where: 'note 7:2 “The apple of the eye: its pupil”'
    claim: 'The Hebrew of 7:2 has ’ishon, “apple” of the eye'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Prov.xml'
    quote: 'כְּ/אִישׁ֥וֹן'
  - where: 'note 7:2 “The apple of the eye: its pupil”'
    claim: 'The Hebrew is literally “little man”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+7&version=NRSVUE'
    quote: '7.2 Heb little man'
  - where: 'note 7:2 “The apple of the eye: its pupil”'
    claim: '’Ishon is the pupil of the eye, in Deut. 32:10, Prov. 7:2 and Ps. 17:8 a simile of preciousness; in 7:9 the middle of the night'
    key: bdb
    url: 'https://biblehub.com/hebrew/380.htm'
    quote: 'אִישׁוֺן noun [masculine] pupil of eye … ׳א all construct — עַיִן ׳א Deuteronomy 32:10; Proverbs 7:2; בַּתעַֿיִן ׳א Psalm 17:8 (in all, simile of preciousness); = middle, midst of night לַיְלָה וַאֲפֵלָה ׳בְּא Proverbs 7:9'
  - where: 'note 7:2 “The apple of the eye: its pupil”'
    claim: 'The phrase is better translated “pupil of your eye”; we protect our eyes instinctively'
    key: ot-minute-proverbs-1-9
    url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
    quote: 'This phrase is probably better translated as the “pupil of your eye.” We instinctively protect our eyes, and our commitment to wise instruction should be just as instinctive.'
  - where: 'note 7:2 “The apple of the eye: its pupil”'
    claim: 'The Septuagint reads “as the pupils of thine eyes”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/proverbs/7.htm'
    quote: '2keep my commandments, and thou shalt live; and keep my words as the pupils of thine eyes.'

  - where: 'note 7:4 “Wisdom as a sister”'
    claim: 'One reading: the son is encouraged to marry Lady Wisdom; “sister” can refer to a spouse (Song of Solomon 4:9–10)'
    key: ot-minute-proverbs-1-9
    url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
    quote: 'In the same vein, the son is encouraged to marry Lady Wisdom: “Say unto wisdom, Thou art my sister; and call understanding thy kinswoman” (verse 4). The term “sister” can be used to refer to a spouse.[fn]See Song of Solomon 4:9–10.'
  - where: 'note 7:4 “Wisdom as a sister”'
    claim: 'Another reading: the sister and kinswoman are female relatives, familiar and not sexualized'
    key: allis-pike-words-wise
    url: 'https://rsc.byu.edu/give-ear-my-words/words-wise'
    quote: 'A wise son looks to benevolent female relatives, a sister or kinswoman as sources of wisdom and understanding. They are family, are familiar, and are not sexualized.'
  - where: 'note 7:4 “Wisdom as a sister”'
    claim: 'Protection from the strange woman comes by embracing Wisdom as friend and intimate'
    key: von-feldt-instructional-wisdom
    url: 'https://interpreterfoundation.org/journal/his-secret-is-with-the-righteous-instructional-wisdom-in-the-book-of-mormon'
    quote: 'Protection from the seductive dangers of the strange woman comes by “attend[ing] to wisdom” (Proverbs 5:1), by keeping the commandments and embracing Wisdom as one’s friend and intimate.'

  - where: 'note 7:6 “The father at the lattice”'
    claim: 'The father gives an account of witnessing a young man succumb'
    key: ot-minute-proverbs-1-9
    url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
    quote: 'The father then gives an account of witnessing a young man succumb to the “strange woman” (verses 6–23).'
  - where: 'note 7:6 “The father at the lattice”'
    claim: 'In the Septuagint the woman looks out of the window'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/proverbs/7.htm'
    quote: '6For she looks from a window out of her house into the streets, at one whom she may see of the senseless ones, a young man void of understanding,'
  - where: 'note 7:10 “Isabel and Corianton”'
    claim: 'In Proverbs 7 foolishness is personified as the woman of verse 10'
    key: sc-knowhy-744
    url: 'https://scripturecentral.org/knowhy/why-are-alma-s-instructions-to-his-sons-filled-with-proverbial-wisdom'
    quote: 'In Proverbs 7, especially, foolishness is personified as “a woman with the attire of an harlot, and subtil of heart” (v. 10).'
  - where: 'note 7:10 “Isabel and Corianton”'
    claim: 'The father’s warning of 7:25 is set beside Alma 39:11'
    key: sc-knowhy-744
    url: 'https://scripturecentral.org/knowhy/why-are-alma-s-instructions-to-his-sons-filled-with-proverbial-wisdom'
    quote: 'The father also warns his children, “Let not thine heart decline to her ways, go not astray in her paths”, just as Alma warns Corianton, “Suffer not the devil to lead away your heart again after those wicked harlots”'
  - where: 'note 7:10 “Isabel and Corianton”'
    claim: 'Corianton is a prime example of a man ensnared by Woman Folly as the father describes'
    key: allis-pike-words-wise
    url: 'https://rsc.byu.edu/give-ear-my-words/words-wise'
    quote: 'Corianton is a prime example of a man ensnared by Woman Folly as described in detail by the father in Proverbs.'
  - where: 'note 7:10 “Isabel and Corianton”'
    claim: 'Alma holds Corianton responsible for his own downfall'
    key: allis-pike-words-wise
    url: 'https://rsc.byu.edu/give-ear-my-words/words-wise'
    quote: 'Yet Alma knows, ultimately, that Corianton is responsible for his own downfall: “But this was no excuse for thee, my son.'

  - where: 'note 7:14 “A sacrifice that left meat for a feast”'
    claim: 'In the peace offering the offerer received back part of the flesh to eat with his household'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/7.htm'
    quote: 'only one part of the flesh of the sacrifice was Jahve''s, consumed by fire (Leviticus 3:16); the priests received one part; those who brought the offering received back another part as it were from the altar of God, that they might eat it with holy joy along with their household.'
  - where: 'note 7:14 “A sacrifice that left meat for a feast”'
    claim: 'A vow offering was to be eaten the same day and the next'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/7?lang=eng'
    quote: 'But if the sacrifice of his offering be a vow, or a voluntary offering, it shall be eaten the same day that he offereth his sacrifice: and on the morrow also the remainder of it shall be eaten:'
  - where: 'note 7:14 “A sacrifice that left meat for a feast”'
    claim: 'The prospect of the festival she can prepare is why she came out to meet him; merrymaking hides behind piety'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/7.htm'
    quote: 'for with על־כּן she means to say that even the prospect of the gay festival which she can prepare for him moved her thus to meet him.'
  - where: 'note 7:14 “A sacrifice that left meat for a feast”'
    claim: 'Merrymaking can conceal itself behind the mask of piety'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/7.htm'
    quote: 'Secularization lies doubly near to merrymaking when the law sanctions this, and it can conceal itself behind the mask of piety.'
  - where: 'note 7:19 “Away until the full moon”'
    claim: '“Goodman”: a familiar name for a husband, the master of a family, cited for Prov. 7:19'
    key: webster-1828
    url: 'https://webstersdictionary1828.com/Dictionary/goodman'
    quote: '2. A familiar appellation of a husband; also, the master of a family. Proverbs 7:19.'
  - where: 'note 7:19 “Away until the full moon”'
    claim: 'The Hebrew is “the man,” with the article'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Prov.xml'
    quote: 'הָ/אִ֣ישׁ'
  - where: 'note 7:19 “Away until the full moon”'
    claim: 'She does not say “my husband” but speaks of him as at a distance'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/7.htm'
    quote: 'but on the other side it is characteristic that she does not say אישׁי (as e.g., Genesis 29:32), but ignores the relation of love and duty in which she is placed to him, and speaks of him as one standing at a distance from her (Aben-Ezra).'
  - where: 'note 7:19 “Away until the full moon”'
    claim: 'She removes his fear; the circumstances are as favourable as possible'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/7.htm'
    quote: 'The adulteress now deprives the youth of all fear; the circumstances under which her invitation is given are as favourable as possible.'
  - where: 'note 7:19 “Away until the full moon”'
    claim: 'The word means full moon, so the night of the story is the new moon, without moonlight'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/7.htm'
    quote: 'but the full moon, when it is covered, i.e., filled; so that thus the time of the night-scene here described is not that of the last quarter of the moon (Ewald), in which it rises at midnight, but that of the new moon (Hitzig), when the night is without moonlight.'
  - where: 'note 7:19 “Away until the full moon”'
    claim: 'A modern translation: “at full moon he will come home”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+7&version=ESV'
    quote: 'at full moon he will come home.'

  - where: 'note 7:22 “An ox, a fool in fetters, a bird”'
    claim: 'The word rendered “stocks” is ’ekes'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Prov.xml'
    quote: 'וּ֝/כְ/עֶ֗כֶס'
  - where: 'note 7:22 “An ox, a fool in fetters, a bird”'
    claim: '’Ekes elsewhere is an anklet, bangle (Isa. 3:18)'
    key: bdb
    url: 'https://biblehub.com/hebrew/5914.htm'
    quote: '[עֶ֫כֶס] noun [masculine] anklet, bangle; — plural absolute הָעֲכֶסִים Isaiah 3:18 bangles, anklets (as ornaments)'
  - where: 'note 7:22 “An ox, a fool in fetters, a bird”'
    claim: 'The lexicon proposes reading a different word (’egel) at Prov. 7:22'
    key: bdb
    url: 'https://biblehub.com/hebrew/5914.htm'
    quote: 'for singular absolute ׳ע Proverbs 7:22 read עֵגֶל Toy'
  - where: 'note 7:22 “An ox, a fool in fetters, a bird”'
    claim: 'A modern translation reads a stag toward the trap, an arrow through its entrails, and says the Hebrew is uncertain'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+7&version=NRSVUE'
    quote: 'or bounds like a stag toward the trap'
  - where: 'note 7:22 “An ox, a fool in fetters, a bird”'
    claim: 'The same translation: an arrow through its entrails'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+7&version=NRSVUE'
    quote: 'until an arrow pierces its entrails.'
  - where: 'note 7:22 “An ox, a fool in fetters, a bird”'
    claim: 'NRSVue footnote: corrected after the Greek; meaning of the Hebrew uncertain'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+7&version=NRSVUE'
    quote: '7.22 Cn Compare Gk: Meaning of Heb uncertain'
  - where: 'note 7:22 “An ox, a fool in fetters, a bird”'
    claim: 'The Septuagint: as a dog to bonds, as a hart shot in the liver'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/proverbs/7.htm'
    quote: '22And he followed her, being gently led on, and that as an ox is led to the slaughter, and as a dog to bonds, or as a hart shot in the liver with an arrow:'
  - where: christ
    claim: 'Alma’s counsel to Corianton is read through the lens of Proverbs 1–9'
    key: allis-pike-words-wise
    url: 'https://rsc.byu.edu/give-ear-my-words/words-wise'
    quote: 'Corianton is a prime example of a man ensnared by Woman Folly as described in detail by the father in Proverbs.'
  - where: christ
    claim: 'Corianton is named among those by whom the word was declared in a time of continual peace'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/49?lang=eng'
    quote: 'which was declared unto them by Helaman, and Shiblon, and Corianton, and Ammon and his brethren'

  - where: explore
    claim: 'Allis-Pike reads Alma 36–39 through the lens of Proverbs 1–9'
    key: allis-pike-words-wise
    url: 'https://rsc.byu.edu/give-ear-my-words/words-wise'
    quote: 'When seen through the lens of Proverbs 1–9, Alma’s teachings to his sons in Alma 36–39 become deeper and more meaningful.'
