chapter: 2
claims:
  - where: setting
    claim: 'Proverbs 1–9 is a series of ten lessons at the head of the book'
    key: sc-knowhy-644
    url: 'https://scripturecentral.org/knowhy/what-does-it-mean-to-apply-your-heart-to-understanding'
    quote: 'Proverbs 2 is part of a series of ten lessons (Proverbs 1–9) placed at the beginning of that book.'
  - where: setting
    claim: 'Proverbs 2 has been called a prospectus of the course in wisdom, its parts resumed later as separate discourses'
    key: sc-knowhy-644
    url: 'https://scripturecentral.org/knowhy/what-does-it-mean-to-apply-your-heart-to-understanding'
    quote: 'R. B. Y. Scott suggested that Proverbs 2 was “a kind of prospectus of the ‘course’ in wisdom” found in these ten lessons “since its several parts are later resumed as the subjects of separate discourses.”'
  - where: setting
    claim: 'Benjamin’s words in Mosiah 2:9 echo Proverbs 2:2'
    key: sc-knowhy-308
    url: 'https://scripturecentral.org/knowhy/how-are-acts-of-service-related-to-wisdom'
    quote: 'This statement echoes Proverbs 2:2, which instructs the hearer to “incline thine ear unto wisdom, and apply thine heart to understanding.”'
  - where: setting
    claim: 'Abinadi’s words echo Proverbs 2:2'
    key: sc-knowhy-644
    url: 'https://scripturecentral.org/knowhy/what-does-it-mean-to-apply-your-heart-to-understanding'
    quote: 'Abinadi’s words closely echo Proverbs 2:2, which admonishes the pupil to “incline thine ear unto wisdom, and apply thine heart to understanding.”'
  - where: setting
    claim: 'Alma’s promise to Helaman reflects Proverbs 2:21–22'
    key: sc-knowhy-744
    url: 'https://scripturecentral.org/knowhy/why-are-alma-s-instructions-to-his-sons-filled-with-proverbial-wisdom'
    quote: 'This instruction also reflects both Proverbs 2:21–22 and the covenant made to Lehi (see 1 Nefi 2:20 ).'
  - where: thread
    claim: 'The path is an important theme in Proverbs because how one lives matters, not only the goal'
    key: ot-minute-proverbs-1-9
    url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
    quote: 'it is how one accomplishes these tasks that is important— and that is why the path is an important theme. The journey is as important as the destination.'
  - where: 'note 2:2 “Ear and heart, in the Book of Mormon”'
    claim: 'In Hebrew thought the heart was the closest equivalent to the mind'
    key: sc-knowhy-644
    url: 'https://scripturecentral.org/knowhy/what-does-it-mean-to-apply-your-heart-to-understanding'
    quote: 'in Hebrew thought the heart was the “closest equivalent to our concept of ‘mind.’ The heart is the locus and organ of thought and the faculty of understanding.”'
  - where: 'note 2:2 “Ear and heart, in the Book of Mormon”'
    claim: '“Apply thine heart” means to desire and choose, an eager receptivity, not only attention'
    key: sc-knowhy-644
    url: 'https://scripturecentral.org/knowhy/what-does-it-mean-to-apply-your-heart-to-understanding'
    quote: '“means to desire and choose something, not only pay attention. … Hence the exhortation in [Proverbs] 2:2 is not an appeal for attention only; it is a demand for a certain attitude: an eager receptivity toward the teachings”'
  - where: 'note 2:2 “Ear and heart, in the Book of Mormon”'
    claim: 'The phrase is an introductory formula in Proverbs calling pupils to prepare for instruction (22:17; 23:12)'
    key: sc-knowhy-644
    url: 'https://scripturecentral.org/knowhy/what-does-it-mean-to-apply-your-heart-to-understanding'
    quote: 'The phrase is used most often in Proverbs, where it appears three times—in each instance as part of an introductory formula calling pupils to prepare themselves to receive instruction.'
  - where: 'note 2:2 “Ear and heart, in the Book of Mormon”'
    claim: 'Abinadi used the saying against Noah’s priests, who had not applied their hearts to understanding'
    key: sc-knowhy-644
    url: 'https://scripturecentral.org/knowhy/what-does-it-mean-to-apply-your-heart-to-understanding'
    quote: 'Abinadi thus drew on a traditional saying about true wisdom to correct the priests of Noah who were misinterpreting Isaiah.'
  - where: 'note 2:2 “Ear and heart, in the Book of Mormon”'
    claim: 'Benjamin’s invitation in Mosiah 2:9 echoes Proverbs 2:2'
    key: sc-knowhy-308
    url: 'https://scripturecentral.org/knowhy/how-are-acts-of-service-related-to-wisdom'
    quote: 'King Benjamin drew upon the themes and teachings of ancient wisdom writings in order to properly instruct his people. He invited them to “open your ears that ye may hear, and your hearts that ye may understand'
  - where: 'note 2:4 “Treasure sought and treasure laid up”'
    claim: 'Wisdom is to be searched for like the earth’s most valuable objects; 3:15 and 31:10 use the same measure of rubies'
    key: ot-minute-proverbs-1-9
    url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
    quote: 'Wisdom, and by extension our relationship with the Lord, is so important that we should search for it like we search for the earth’s most valuable objects. However, as we learn later on, wisdom “is more precious than rubies” (3:15).'
  - where: 'note 2:4 “Treasure sought and treasure laid up”'
    claim: 'The woman of 31:10 is the earthly counterpart of Lady Wisdom, priced above rubies'
    key: ot-minute-proverbs-1-9
    url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
    quote: 'The book of Proverbs closes with a poem about a virtuous woman (the earthly counterpart to Lady Wisdom), and we are told that “her price is far above rubies” (31:10).'
  - where: 'note 2:4 “Treasure sought and treasure laid up”'
    claim: 'The verb tsafan, “hide” in 2:1, means to treasure up, in one’s own keeping; with the LORD as subject it is used of blessings at 2:7'
    key: bdb
    url: 'https://biblehub.com/hebrew/6845.htm'
    quote: '= treasure up a thing, Proverbs 10:14, + אִתְּךָ with thyself, in thine own keeping Proverbs 2:1 = Proverbs 7:1, … subject ׳י 21:19 reserve penalty; blessings Psalm 31:20; Proverbs 2:7'
  - where: 'note 2:4 “Treasure sought and treasure laid up”'
    claim: 'The verb of 2:1, “hide,” is tsafan (lemma 6845)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Prov.xml'
    quote: 'תִּצְפֹּ֥ן'
  - where: 'note 2:4 “Treasure sought and treasure laid up”'
    claim: 'The verb of 2:7, “layeth up,” is the same tsafan (lemma 6845; qere)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Prov.xml'
    quote: 'יִצְפֹּ֣ן'
  - where: 'note 2:5 “The search ends with the LORD”'
    claim: 'The fear of the LORD and the knowledge of God are used synonymously, both for a relationship with God'
    key: ot-minute-proverbs-1-9
    url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
    quote: 'Seeking and finding wisdom translates into a relationship with God. The “fear of the Lord” and the “knowledge of God” are used synonymously. Both terms can refer to a relationship with God.'
  - where: 'note 2:5 “The search ends with the LORD”'
    claim: 'The one who seeks wisdom reaches fellowship with God, for wisdom is only with Him and comes only from Him'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/2.htm'
    quote: 'The thoughts revolve in a circle only apparently. He who strives after wisdom earnestly and really, reaches in this way fellowship with God; for just as He gives wisdom, it is nowhere else than with Him'
  - where: 'note 2:5 “The search ends with the LORD”'
    claim: '“Out of his mouth” means wisdom is communicated through His word'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/2.htm'
    quote: 'It comes (Proverbs 2:6) מפּיו (lxx erroneously מפּניו ylsuoe), i.e., it is communicated through the medium of His word, Job 22:22'
  - where: 'note 2:5 “The search ends with the LORD”'
    claim: '“Saints” (2:8) is hasid; as a substantive, singular, a pious man, the godly; Proverbs 2:8 listed in the entry'
    key: bdb
    url: 'https://biblehub.com/hebrew/2623.htm'
    quote: 'singular, a pious man, the godly Psalm 4:4'
  - where: 'note 2:16 “The strange woman”'
    claim: 'zarah: strange, of another household; to the person, another; “strange woman, harlot” at Prov 2:16'
    key: bdb
    url: 'https://biblehub.com/hebrew/2114.htm'
    quote: 'b. to the person, another Job 19:27; Proverbs 14:10; Proverbs 27:2; זָרָה (אִשָּׁה) strange woman, harlot Proverbs 2:16; Proverbs 5:3,20; Proverbs 7:5; Proverbs 22:14; Proverbs 23:33.'
  - where: 'note 2:16 “The strange woman”'
    claim: 'nokriyyah: foreign woman, used in Proverbs as a technical term for harlot, perhaps because harlots were chiefly foreigners'
    key: bdb
    url: 'https://biblehub.com/hebrew/5237.htm'
    quote: 'נָכְרִיָּה foreign woman, as technical term, in Proverbs, for harlot (perhaps because harlots were originally chiefly foreigners): Proverbs 2:16 ("" אִשָּׁה זָרָה), Proverbs 7:5 ("" id.), Proverbs 5:20'
  - where: 'note 2:16 “The strange woman”'
    claim: 'Scripture Helps calls her the adulterous strange woman, contrasted with Lady Wisdom'
    key: scripture-helps-proverbs
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/35-proverbs-1-4-15-16-22-31-ecclesiastes-1-3-11-12?lang=eng'
    quote: 'Lady Wisdom is contrasted with the adulterous “strange woman,” who seeks to lure the foolish from the path of righteousness.'
  - where: 'note 2:16 “The strange woman”'
    claim: 'alluf (“guide,” 2:17): friend, intimate; of a woman’s husband at 2:17; of the LORD as husband of Judah, Jer 3:4'
    key: bdb
    url: 'https://biblehub.com/hebrew/441.htm'
    quote: 'noun masculine friend, intimate Psalm 55:14 … of a woman''s husband נְעוּרֶיהָ ׳א Proverbs 2:17; figurative of ׳י as husband of Judah, id., Jeremiah 3:4.'
  - where: 'note 2:16 “The strange woman”'
    claim: 'She is a stranger because she has forsaken the guide of her youth and the covenant of her God'
    key: ot-minute-proverbs-1-9
    url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
    quote: 'This woman is a stranger because she has “forsaken the guide of her youth, and forgetteth the covenant of her God” (verse 17).'
  - where: 'note 2:16 “The strange woman”'
    claim: 'From 2:17 and Mal 2:14, marriage was a religious act in which God was called to witness the vows (one older reading)'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/2.htm'
    quote: 'from Proverbs 2:17, Malachi 2:14 (Ewald, Bertheau, Hitzig, but not Khler), it appears that the celebration of marriage was a religious act, and that they who were joined together in marriage called God to witness and ratify the vows they took upon themselves.'
  - where: 'note 2:18 “A house that slopes down to the dead”'
    claim: 'rephaim: shades, ghosts, name of the dead in Sheol; at 2:18, 9:18, 21:16'
    key: bdb
    url: 'https://biblehub.com/hebrew/7496.htm'
    quote: 'plural shades, ghosts … — Wisdom Literature and late, name of dead in She''ôl, … Proverbs 2:18 ("" מָוֶת), Proverbs 9:18 (in עִמְקֵי שְׁאוֺל), קְהַל רְפָאִים Proverbs 21:16'
  - where: 'note 2:18 “A house that slopes down to the dead”'
    claim: 'The Septuagint reads that she has fixed her house near death and her wheels near Hades with the giants'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/proverbs/2.htm'
    quote: '18For she has fixed her house near death, and guided her wheels near Hades with the giants.'
  - where: 'note 2:18 “A house that slopes down to the dead”'
    claim: 'The household and the path are both metaphors in 2:18; building and providing for a household is a main point of Proverbs'
    key: ot-minute-proverbs-1-9
    url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
    quote: 'One of the main points of the book of Proverbs is showing young people how to live life, and that takes the form of building a household and providing for it. … Both metaphors, those of the household and the path, find expression here.'
  - where: 'note 2:18 “A house that slopes down to the dead”'
    claim: 'Lady Folly of 9:13–18 is the counterpart of Lady Wisdom, represented by an adulterous woman'
    key: ot-minute-proverbs-1-9
    url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
    quote: 'The counterpart of Lady Wisdom is Lady Folly, who is referenced in Proverbs 9:13–18. Just as Lady Wisdom is represented by a virtuous woman, Lady Folly is represented by an adulterous woman.'
  - where: 'note 2:21 “Dwelling in the land”'
    claim: 'Verses 21–22 express the most basic covenant of the Old Testament; the verbs suggest wrenching violence'
    key: allis-pike-words-wise
    url: 'https://rsc.byu.edu/give-ear-my-words/words-wise'
    quote: 'The proverbial father expresses the most basic covenant found in the Old Testament between God and his people, or between God and a person. … The verbs employed suggest sharp and wrenching violence against the unrighteous either from mortal enemies or from a just God.'
  - where: 'note 2:21 “Dwelling in the land”'
    claim: 'Alma gives Helaman the same covenant; in Alma the disobedient are cut off from God’s presence, in Proverbs from the earth'
    key: allis-pike-words-wise
    url: 'https://rsc.byu.edu/give-ear-my-words/words-wise'
    quote: 'In Alma’s writings the disobedient are “cut off” from God’s “presence” while in Proverbs 2:22 they are “cut off from the earth.” In both cases they lose the blessings and gifts that come from God’s watchcare.'
  - where: 'note 2:21 “Dwelling in the land”'
    claim: 'Alma 36:1 reflects Proverbs 2:21–22 and the promise of 1 Nephi 2:20'
    key: sc-knowhy-744
    url: 'https://scripturecentral.org/knowhy/why-are-alma-s-instructions-to-his-sons-filled-with-proverbial-wisdom'
    quote: 'This instruction also reflects both Proverbs 2:21–22 and the covenant made to Lehi (see 1 Nefi 2:20 ).'
  - where: 'note 2:21 “Dwelling in the land”'
    claim: '“Land” in 2:21 is erets (lemma 776)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Prov.xml'
    quote: 'אָ֑רֶץ'
  - where: 'note 2:21 “Dwelling in the land”'
    claim: '“Earth” in 2:22 is the same word, erets (lemma 776)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Prov.xml'
    quote: 'מֵ/אֶ֣רֶץ'
  - where: christ
    claim: 'Elder Gong took Proverbs 2:2 as the theme of an address and applied it to understanding that Christ can bless and heal'
    key: gong-ear-wisdom
    url: 'https://rsc.byu.edu/vol-27-no-2-2026/ear-wisdom-heart-understanding'
    quote: 'Third, we will “incline” our ears and “apply” our hearts to understand that Jesus Christ can bless and heal each of us.'
  - where: christ
    claim: 'Elder Gong: Joseph Smith took literally the promise of James 1:5'
    key: gong-ear-wisdom
    url: 'https://rsc.byu.edu/vol-27-no-2-2026/ear-wisdom-heart-understanding'
    quote: 'As testified in Joseph Smith—History, the young Joseph Smith took literally the biblical promise in James 1:5 to seek wisdom and understanding:'
  - where: explore
    claim: 'Allis-Pike reads Alma 36–39 through the lens of Proverbs 1–9'
    key: allis-pike-words-wise
    url: 'https://rsc.byu.edu/give-ear-my-words/words-wise'
    quote: 'When seen through the lens of Proverbs 1–9, Alma’s teachings to his sons in Alma 36–39 become deeper and more meaningful.'
