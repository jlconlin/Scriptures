chapter: 24
claims:
  - where: setting
    claim: 'The words of the wise (22:17–24:22) come in every form, from two-line sayings such as 24:7–10 to longer ones'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/1.htm'
    quote: 'These "words of the wise" comprehend all the forms of the Mashal, from those of two lines in Proverbs 22:28; Proverbs 23:9; Proverbs 24:7-10, to the Mashal song Proverbs 23:29-35.'
  - where: setting
    claim: 'Verses 11–12 form a six-line saying'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/24.htm'
    quote: 'Now, again, we meet with proverbs of several lines. The first here is a hexastich:'
  - where: setting
    claim: 'The book''s headings ascribe sections to the wise at 22:17 and 24:23'
    key: ot-manual-proverbs
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-2?lang=eng'
    quote: 'Thus sections are ascribed to Solomon at 10:1 and to ‘the wise’ at 22:17 and 24:23.'
  - where: setting
    claim: 'A modern translation heads 24:23–34 “Further Sayings of the Wise”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+24&version=NRSVUE'
    quote: 'Further Sayings of the Wise'
  - where: setting
    claim: 'One older reading calls 24:23–34 a supplement of the words of some wise men'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/1.htm'
    quote: '(5) the second appendix, supplement of the words of some wise men, Proverbs 24:23.'
  - where: setting
    claim: 'Verses 33–34 are the same as 6:10–11'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/1.htm'
    quote: 'as Proverbs 24:33. are literally the same as Proverbs 6:10.'
  - where: setting
    claim: 'Verse 19 is a variation of Psalm 37:1'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/24.htm'
    quote: 'Ver. 19 is a variation of Psalm 37:1'
  - where: thread
    claim: 'The warning not to envy the wicked is found in several forms: 3:31; 23:17; 24:19'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/24.htm'
    quote: 'The warning, not to envy the godless, is also found at Proverbs 3:31; Proverbs 23:17; Proverbs 24:19, but is differently constructed in each of these passages.'
  - where: thread
    claim: 'The word rendered “reward” in 24:14 and 24:20 means a future, a happy close of life, promised to the righteous and withheld from the wicked'
    key: bdb
    url: 'https://biblehub.com/hebrew/319.htm'
    quote: 'a future, i.e. a happy close of life, suggesting sometimes the idea of a posterity, promised to the righteous Proverbs 23:18 ("" תִּקְוָה hope) Proverbs 24:14; Jeremiah 29:11 (וְתִקְוָה ׳לָתֵת לָכֶם א), withheld from the wicked Proverbs 24:20'
  - where: section 1 plain
    claim: 'Verse 2: their hearts plot violence'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+24&version=NIV'
    quote: 'for their hearts plot violence,'
  - where: section 1 plain
    claim: 'Verse 7: in the assembly at the gate the fool has nothing to say'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+24&version=NIV'
    quote: 'in the assembly at the gate they must not open their mouths.'
  - where: section 1 plain
    claim: 'Verse 8: the one who plots evil is known as a schemer'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+24&version=NIV'
    quote: 'will be known as a schemer.'
  - where: section 2 plain
    claim: 'Verse 11: rescue those led away to death, those staggering toward slaughter'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+24&version=NIV'
    quote: 'hold back those staggering toward slaughter.'
  - where: section 2 plain
    claim: 'Verse 12: the one who weighs the heart; he will repay all according to their deeds'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+24&version=NRSVUE'
    quote: 'And will he not repay all according to their deeds?'
  - where: section 3 plain
    claim: 'Verse 14: wisdom is like honey for you; a future hope'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+24&version=NIV'
    quote: 'Know also that wisdom is like honey for you:'
  - where: section 4 plain
    claim: 'Verse 25: those who convict the guilty fare well'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+24&version=NIV'
    quote: 'But it will go well with those who convict the guilty,'
  - where: section 4 plain
    claim: 'Verse 27: put outdoor work in order and get the fields ready'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+24&version=NIV'
    quote: 'Put your outdoor work in order'
  - where: section 5 plain
    claim: '“That travelleth” is in Hebrew marching, like a soldier'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/24?lang=eng'
    quote: '“that travelleth”: HEB marching (i.e., like a soldier).'
  - where: 'note 24:10 “Strength in the day of adversity”'
    claim: '“Adversity” is tsarah, straits, distress'
    key: bdb
    url: 'https://biblehub.com/hebrew/6869.htm'
    quote: 'straits, distress'
  - where: 'note 24:10 “Strength in the day of adversity”'
    claim: '“Small” is tsar, narrow, tight'
    key: bdb
    url: 'https://biblehub.com/hebrew/6862.htm'
    quote: 'I. צַר adjective narrow, tight'
  - where: 'note 24:10 “Strength in the day of adversity”'
    claim: '“Small” is tsar, narrow, tight; in 24:10 “thy strength will be narrow, limited,” if the reading is right'
    key: bdb
    url: 'https://biblehub.com/hebrew/6862.htm'
    quote: 'thy strength will be narrow, limited (si vera lectio'
  - where: 'note 24:10 “Strength in the day of adversity”'
    claim: 'Elder ElRay L. Christiansen on this verse: the Lord permits the bitter to be mixed with the sweet'
    key: ot-manual-proverbs
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-2?lang=eng'
    quote: 'the Lord permits the bitter to be mixed with the sweet. He knows that our individual faith must be tested in adversity as well as in serenity.'
  - where: 'note 24:10 “Strength in the day of adversity”'
    claim: 'Christiansen: the gospel of Christ offers encouragement'
    key: ot-manual-proverbs
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-2?lang=eng'
    quote: 'Even in times of trouble and tribulation, the gospel of Christ offers encouragement and gives assurance.'
  - where: 'note 24:11 “Those led away to death”'
    claim: 'A modern translation: rescue those being led away to death'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+24&version=NIV'
    quote: 'Rescue those being led away to death;'
  - where: 'note 24:11 “Those led away to death”'
    claim: 'One older reading: the excuse refers to men led to the tribunal; one did not know matters had come to an extremity'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/24.htm'
    quote: 'refers to the fact that men are led to the tribunal; only thus is explained the change of ידעתי, which was to be expected, into ידענוּ: the objection is, that one certainly did not know, viz., that matters had come to an extremity with them'
  - where: 'note 24:11 “Those led away to death”'
    claim: 'Verse 11 speaks of one condemned to death generally, not only the innocent'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/24.htm'
    quote: 'It is to be observed that Proverbs 24:11 speaks of one condemned to death generally, and not expressly of one innocently condemned'
  - where: 'note 24:11 “Those led away to death”'
    claim: '“Pondereth” rendered “weighs”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+24&version=NRSVUE'
    quote: 'does not he who weighs the heart perceive it?'
  - where: 'note 24:16 “Falling and rising again”'
    claim: 'A modern translation: though they fall seven times, they will rise again; the wicked are overthrown by calamity'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+24&version=NRSVUE'
    quote: 'for though they fall seven times, they will rise again, but the wicked are overthrown by calamity.'
  - where: 'note 24:16 “Falling and rising again”'
    claim: 'A modern translation: do not plunder their dwelling place; the wicked stumble when calamity strikes'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+24&version=NIV'
    quote: 'but the wicked stumble when calamity strikes.'
  - where: 'note 24:18 “Why not gloat over an enemy”'
    claim: 'One older reading: the proverb extends the duty of love even to an enemy'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/24.htm'
    quote: 'The proverb extends the duty of love even to an enemy; for it requires that we do good to him and not evil, and warns against rejoicing when evil befalls him.'
  - where: 'note 24:18 “Why not gloat over an enemy”'
    claim: 'The motive is not to let the destruction of the enemy go on, but to avoid God''s displeasure'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/24.htm'
    quote: 'but his meaning is not this, that one, from joy at the misfortune of others, ought to desist from interrupting the process of the destruction of his enemy, and let it go on to its end; but much rather, that one ought to abstain from this joy, so as not to experience the manifestation of God''s displeasure thereat'
  - where: 'note 24:21 “Those given to change”'
    claim: 'One older reading: involve not thyself with those who are otherwise disposed'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/24.htm'
    quote: 'And involve not thyself with those who are otherwise disposed;'
  - where: 'note 24:21 “Those given to change”'
    claim: 'They are dissidents or revolutionaries who recognize neither the LORD''s rule nor the king''s'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/24.htm'
    quote: 'dissidents, oppositionists, or revolutionaries, who recognise neither the monarchy of Jahve, the King of kings, nor that of the earthly king'
  - where: 'note 24:21 “Those given to change”'
    claim: '“Meddle” is to make common cause with someone'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/24.htm'
    quote: 'to mix oneself with some one, i.e., to make common cause with him.'
  - where: 'note 24:21 “Those given to change”'
    claim: 'The Hebrew: do not associate with those who change; a modern translation follows the Greek, do not disobey either of them'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+24&version=NRSVUE'
    quote: '24.21 Gk: Heb do not associate with those who change'
  - where: 'note 24:21 “Those given to change”'
    claim: 'The modern translation reads “do not disobey either of them”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+24&version=NRSVUE'
    quote: 'and do not disobey either of them,'
  - where: 'note 24:21 “Those given to change”'
    claim: 'Another modern translation: do not join with rebellious officials'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+24&version=NIV'
    quote: 'and do not join with rebellious officials,'
  - where: 'note 24:21 “Those given to change”'
    claim: 'Another modern translation: the two send sudden destruction'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+24&version=NIV'
    quote: 'for those two will send sudden destruction'
  - where: 'note 24:21 “Those given to change”'
    claim: 'One older reading rejects referring “them both” to the LORD and the king'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/24.htm'
    quote: 'Certainly not to Jahve and the king'
  - where: 'note 24:23 “Respect of persons in court”'
    claim: 'Modern translations: partiality in judging'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+24&version=NRSVUE'
    quote: 'Partiality in judging is not good.'
  - where: 'note 24:23 “Respect of persons in court”'
    claim: 'A modern translation: whoever says to the guilty, “You are innocent”; those who convict the guilty'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+24&version=NIV'
    quote: 'Whoever says to the guilty, “You are innocent,”'
  - where: 'note 24:23 “Respect of persons in court”'
    claim: 'Those who convict the guilty'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+24&version=NIV'
    quote: 'But it will go well with those who convict the guilty,'
  - where: 'note 24:23 “Respect of persons in court”'
    claim: 'The footnote at “respect” points to Deut. 1:17'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/24?lang=eng'
    quote: '“respect”: Deut. 1:17; Prov. 28:21; Matt. 22:16; D&C 1:35.'
  - where: 'note 24:26 “A kiss on the lips”'
    claim: 'A modern translation: one who gives an honest answer gives a kiss on the lips'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+24&version=NRSVUE'
    quote: 'One who gives an honest answer gives a kiss on the lips.'
  - where: 'note 24:26 “A kiss on the lips”'
    claim: 'Another modern translation: an honest answer is like a kiss on the lips'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+24&version=NIV'
    quote: 'An honest answer is like a kiss on the lips.'
  - where: christ
    claim: 'The wronged man should commit his case to God and oppose evil with good'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/24.htm'
    quote: 'Here he to whom injustice is done ought to commit his case to God, Proverbs 20:22, and to oppose to evil, not evil but good'
  - where: setting
    claim: 'The refusal to repay a wrong (24:29) is the counsel of 20:22'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/24.htm'
    quote: 'Here he to whom injustice is done ought to commit his case to God, Proverbs 20:22, and to oppose to evil, not evil but good'
  - where: christ
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: christ
    claim: 'The footnote at “works” (24:12) points to Matt. 16:27'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/24?lang=eng'
    quote: '“works”: Matt. 16:27; James 2:20 (14–20); D&C 1:10.'
  - where: christ
    claim: 'Verse 29 recalls verse 12; the wronged man commits his case to God'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/24.htm'
    quote: 'The expression 29b reminds of Proverbs 24:12.'
  - where: explore
    claim: 'The prosperity of the wicked as the occasion of envy: Ps. 73:3'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/24.htm'
    quote: 'The ground and occasion of being enraged, and on the other side, of jealousy or envy, is the prosperity of the godless, Psalm 73:3'
  - where: thread
    claim: 'One older reading: envy of the wicked regards the present and does not look to the end'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/24.htm'
    quote: 'rest on short-sightedness, which regards the present, and looks not on to the end.'
