chapter: 16
claims:
  - where: setting
    claim: 'One older reading: the chapter opens with four proverbs of God, the disposer of all things'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/16.htm'
    quote: 'Four proverbs of God, the disposer of all things:'
  - where: setting
    claim: 'The same reading: verses 5–7 are proverbs of divine punishment and reconciliation'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/16.htm'
    quote: 'Here follow three proverbs of divine punishment, expiatio [Vershnung] and reconciliatio [Vershnung].'
  - where: setting
    claim: 'The same reading: from verse 8, five proverbs of the king'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/16.htm'
    quote: 'Five proverbs of the king, together with three of righteousness in action and conduct:'
  - where: setting
    claim: 'The king sayings end at verse 15'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/16.htm'
    quote: 'The proverbs relating to the king are now at an end.'
  - where: setting
    claim: 'One older reading: verse 18 stands at the center of the book'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/16.htm'
    quote: 'This proverb, which stands in the very centre of the Book of Proverbs, is followed by another in praise of humility.'
  - where: setting
    claim: 'Come, Follow Me reads 16:24–32 with chapter 15 under the soft answer'
    key: cfm-ot-2026-37
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/37?lang=eng'
    quote: 'Proverbs 15; 16:24–32: “A soft answer turneth away wrath.”'
  - where: 'section 1 plain'
    claim: 'The answer of the tongue is the fitting reply that finally comes, from God'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/16.htm'
    quote: 'thus generally the satisfying reply to the demand placed before him, is from God.'
  - where: 'section 1 plain'
    claim: '“Commit” is the verb to roll'
    key: bdb
    url: 'https://biblehub.com/hebrew/1556.htm'
    quote: 'roll a stone Proverbs 26:27'
  - where: 'section 1 plain'
    claim: 'A modern translation of 16:4: everything for its purpose, the wicked for the day of trouble'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2016&version=NRSVUE'
    quote: 'The Lord has made everything for its purpose, even the wicked for the day of trouble.'
  - where: 'section 1 plain'
    claim: 'A modern translation renders “though hand join in hand” as “be assured”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2016&version=NRSVUE'
    quote: 'be assured, they will not go unpunished.'
  - where: 'section 1 plain'
    claim: 'The second line of 16:5 repeats 11:21'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/16.htm'
    quote: 'In 5b, Proverbs 11:21 is repeated.'
  - where: 'section 1 plain'
    claim: 'A modern translation of 16:6: by loyalty and faithfulness iniquity is atoned for'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2016&version=NRSVUE'
    quote: 'By loyalty and faithfulness iniquity is atoned for,'
  - where: 'section 2 plain'
    claim: 'The king''s lips as an oracle'
    key: bdb
    url: 'https://biblehub.com/hebrew/7081.htm'
    quote: '3 in good sense עַל שִׂפְתֵי ׳ק מֶלֶךְ Proverbs 16:10 (king''s lips as oracle).'
  - where: 'section 2 plain'
    claim: 'The latter rain comes in spring, March and April'
    key: bd-rain
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/rain?lang=eng'
    quote: 'The biblical “latter rain” comes in March and April.'
  - where: 'section 4 plain'
    claim: 'The saying of 16:25 has come before at 14:12'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/14?lang=eng'
    quote: 'There is a way which seemeth right unto a man, but the end thereof are the ways of death.'
  - where: 'section 4 plain'
    claim: '16:26: the laborer''s hunger works for him; his mouth urges him on'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/16.htm'
    quote: 'The hunger of the labourer laboureth for him,'
  - where: 'section 4 plain'
    claim: '16:26 second line: he is urged on by his mouth'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/16.htm'
    quote: 'For he is urged on by his mouth.'
  - where: 'section 5 plain'
    claim: 'The hoary head is the gray hair of old age'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/16?lang=eng'
    quote: 'IE The gray hair of old age.'
  - where: 'section 5 plain'
    claim: 'All the lot''s decision comes from the LORD'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/16.htm'
    quote: 'But all its decision cometh from Jahve.'
  - where: 'note 16:1 “Man’s plans, the LORD’s answer”'
    claim: 'A modern translation of the first line'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2016&version=NRSVUE'
    quote: 'The plans of the mind belong to mortals,'
  - where: 'note 16:1 “Man’s plans, the LORD’s answer”'
    claim: '“The answer of the tongue” is the ability to answer'
    key: bdb
    url: 'https://biblehub.com/hebrew/4617.htm'
    quote: 'compare לָשׁוֺן ׳מ Proverbs 16:1 (i.e. ability to answer)'
  - where: 'section 1 plain'
    claim: '“Commit” in 16:3 is the verb to roll, used figuratively as in Ps. 37:5'
    key: bdb
    url: 'https://biblehub.com/hebrew/1556.htm'
    quote: 'but also דַּרְכֶּ֑ךָ ׳גּוֺל עַליֿ Psalm 37:5, compare Psalm 22:9; Proverbs 16:3 (both followed by אֶלֿ).'
  - where: 'note 16:4 “For its purpose”'
    claim: 'Everywhere else the noun in “for himself” means answer'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/16.htm'
    quote: 'Everywhere else מענה means answer'
  - where: 'note 16:4 “For its purpose”'
    claim: 'The same noun is the “answer” of 16:1'
    key: bdb
    url: 'https://biblehub.com/hebrew/4617.htm'
    quote: 'compare לָשׁוֺן ׳מ Proverbs 16:1 (i.e. ability to answer)'
  - where: 'note 16:4 “For its purpose”'
    claim: 'One older reading: the LORD made everything for its contemplated end'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/16.htm'
    quote: '4 Jahve hath made everything for its contemplated end;'
  - where: 'note 16:4 “For its purpose”'
    claim: 'A modern translation: everything for its purpose'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2016&version=NRSVUE'
    quote: 'The Lord has made everything for its purpose,'
  - where: 'note 16:4 “For its purpose”'
    claim: 'A second modern translation reads the same'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2016&version=ESV'
    quote: 'The Lord has made everything for its purpose,'
  - where: 'note 16:4 “For its purpose”'
    claim: 'God did not make the wicked as such, but a being capable of wickedness who chose it; the day of evil is the day of adversity'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/16.htm'
    quote: 'God has not indeed made the wicked as such, but He has made the being which is capable of wickedness, and which has decided for it, viz., in view of the "day of adversity" (Ecclesiastes 7:14), which God will cause to come upon him'
  - where: 'note 16:4 “For its purpose”'
    claim: 'Predestination to evil is not taught here; it would make God the author of evil'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/16.htm'
    quote: 'A praedestinatio ad malum, and that in the supralapsarian sense, cannot be here taught, for this horrible dogma (horribile quidem decretrum, fateor, says Calvin himself) makes God the author of evil'
  - where: 'note 16:4 “For its purpose”'
    claim: 'Free actions of men do not surprise God; the wicked has his place in God''s order'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/16.htm'
    quote: 'The free actions of men create no situation by which God would be surprised and compelled to something which was not originally intended by Himself. That is what the above proverb says: the wicked also has his place in God''s order of the world.'
  - where: 'note 16:6 “Iniquity covered over”'
    claim: '“Purged” is kipper: by mercy and fidelity iniquity is covered over'
    key: bdb
    url: 'https://biblehub.com/hebrew/3722.htm'
    quote: 'Proverbs 16:6 by mercy and fidelity iniquity is covered over.'
  - where: 'note 16:6 “Iniquity covered over”'
    claim: 'The same verb is “pacify” in 16:14'
    key: bdb
    url: 'https://biblehub.com/hebrew/3722.htm'
    quote: 'suffix יְכַמְּרֶנָּה Proverbs 16:14'
  - where: 'note 16:6 “Iniquity covered over”'
    claim: 'A modern translation: iniquity is atoned for'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2016&version=NRSVUE'
    quote: 'By loyalty and faithfulness iniquity is atoned for,'
  - where: 'note 16:6 “Iniquity covered over”'
    claim: 'A second modern translation: steadfast love and faithfulness, atoned for'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2016&version=ESV'
    quote: 'steadfast love and faithfulness iniquity is atoned for,'
  - where: 'note 16:6 “Iniquity covered over”'
    claim: 'One older reading: mercy and truth here are human love and faithfulness toward one another'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/16.htm'
    quote: 'but, like Proverbs 20:28, Isaiah 39:8, love and faithfulness in the relation of men to one another.'
  - where: 'note 16:6 “Iniquity covered over”'
    claim: 'The ground of reconciliation is God''s; man shares it by accepting His mercy in penitence and faith'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/16.htm'
    quote: 'the objective ground of reconciliation is the decree of God, to which the blood in the typical offering points, and man is a partaker of this reconciliation, when he accepts, in penitence and in faith, the offered mercy of God'
  - where: 'note 16:6 “Iniquity covered over”'
    claim: 'One cannot trust God''s mercy without practicing love and truth toward others; the prophets say the same'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/16.htm'
    quote: 'cannot trust to this mercy if he is not zealous, in his relations to his fellow-men, to practise love and truth'
  - where: 'note 16:6 “Iniquity covered over”'
    claim: 'The reading sets the proverb beside Hosea 6:6 and Micah 6:6–8'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/16.htm'
    quote: 'herein according with the words of the prophets, as Hosea 6:6; Micah 6:6-8.'
  - where: 'note 16:10 “The king’s word as an oracle”'
    claim: 'qesem is divination, prohibited in Deut. 18:10 and condemned in 1 Sam. 15:23'
    key: bdb
    url: 'https://biblehub.com/hebrew/7081.htm'
    quote: 'prohibited Deuteronomy 18:10; 2 Kings 17:17; reprobated 1 Samuel 15:23'
  - where: 'note 16:10 “The king’s word as an oracle”'
    claim: 'At 16:10 the word is used in a good sense: the king''s lips as oracle'
    key: bdb
    url: 'https://biblehub.com/hebrew/7081.htm'
    quote: '3 in good sense עַל שִׂפְתֵי ׳ק מֶלֶךְ Proverbs 16:10 (king''s lips as oracle).'
  - where: 'note 16:10 “The king’s word as an oracle”'
    claim: 'A modern translation: inspired decisions on the lips of a king'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2016&version=NRSVUE'
    quote: 'Inspired decisions are on the lips of a king;'
  - where: 'note 16:15 “A cloud of the latter rain”'
    claim: 'The early rain falls in autumn, the winter rain soaks the soil, the latter rain comes in March and April'
    key: bd-rain
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/rain?lang=eng'
    quote: 'In Palestine rain begins to fall in October and continues in November and early December (the “early rain”). During January and February the vital “winter rain” soaks the soil and fills the cisterns. The biblical “latter rain” comes in March and April.'
  - where: 'note 16:18 “Pride before a fall”'
    claim: 'President Benson cited 16:18 among scripture''s evidences of pride''s consequences'
    key: benson-pride
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1989/04/beware-of-pride?lang=eng'
    quote: 'The scriptures abound with evidences of the severe consequences of the sin of pride to individuals, groups, cities, and nations. “Pride goeth before destruction.” (Prov. 16:18.)'
  - where: 'note 16:18 “Pride before a fall”'
    claim: 'President Benson gave Moroni 8:27 and D&C 38:39 as the Book of Mormon''s answer to why the Nephites fell'
    key: benson-pride
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1989/04/beware-of-pride?lang=eng'
    quote: '“Behold, the pride of this nation, or the people of the Nephites, hath proven their destruction.” (Moro. 8:27.) And then, lest we miss that momentous Book of Mormon message from that fallen people, the Lord warns us in the Doctrine and Covenants, “Beware of pride, lest ye become as the Nephites of old.” (D&C 38:39.)'
  - where: 'note 16:18 “Pride before a fall”'
    claim: 'The antidote for pride is humility'
    key: benson-pride
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1989/04/beware-of-pride?lang=eng'
    quote: 'The antidote for pride is humility—meekness, submissiveness.'
  - where: 'note 16:33 “The lot and the LORD’s decision”'
    claim: 'One older reading: the lap is the loose fold of clothing over the breast, where the lot was shaken and drawn out'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/16.htm'
    quote: 'the swelling, loose, external part of the clothing covering the bosom (the breast), where the lot covered by it is thrown by means of shaking and changing, and whence it is drawn out.'
  - where: 'note 16:33 “The lot and the LORD’s decision”'
    claim: '“Disposing” is decision as by the Urim and Thummim (Num. 27:21)'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/16.htm'
    quote: 'signifies here decision as by the Urim and Thummim, Numbers 27:21, but which was no lot-apparatus.'
  - where: 'note 16:33 “The lot and the LORD’s decision”'
    claim: 'The law does not ordain the lot, but it was used in public justice and to detect the guilty (Josh. 7:14; 1 Sam. 14:40–42)'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/16.htm'
    quote: 'The lot is nowhere ordained by it, but its use is supported by a custom running parallel with the Mosaic law; it was used not only in private life, but also in manifold ways within the domain of public justice, as well as for the detection of the guilty, Joshua 7:14., 1 Samuel 14:40-42.'
  - where: 'note 16:33 “The lot and the LORD’s decision”'
    claim: 'The proverb gives the lot no special sanction; it says the decision, where the lot is cast, is God''s'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/16.htm'
    quote: 'A particular sanction of the use of the lot does not lie in this, but it is only said, that where the lot is cast, all the decision that results from it is determined by God.'
  - where: christ
    claim: 'One older reading sets 16:1 beside Matt. 10:19: the fitting word is a gift from above'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/16.htm'
    quote: 'it is, as this cog. proverb expresses it, a gift from above (δοθήσεται, Matthew 10:19).'
  - where: christ
    claim: 'The Church’s footnote at 16:1 points to D&C 100:5–8'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/16?lang=eng'
    quote: 'D&C 100:5 (5–8).'

  - where: 'note 16:4 “For its purpose”'
    claim: 'A modern translation of the whole verse'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2016&version=NRSVUE'
    quote: 'The Lord has made everything for its purpose, even the wicked for the day of trouble.'
  - where: 'note 16:15 “A cloud of the latter rain”'
    claim: 'After the spring rains, rain hardly falls until the end of September'
    key: bd-rain
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/rain?lang=eng'
    quote: 'Showers may occur in May, but after this, rain hardly ever falls until the end of September'
  - where: 'note 16:18 “Pride before a fall”'
    claim: 'President Benson: pride destroyed the Nephite nation and Sodom'
    key: benson-pride
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1989/04/beware-of-pride?lang=eng'
    quote: 'It destroyed the Nephite nation and the city of Sodom.'
