chapter: 12
claims:
  - where: setting
    claim: 'One older reading: the proverbs of 10–22:16 are grouped without a plan, each a finished whole with no necessary connection to its neighbors, and every one a two-line saying'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/1.htm'
    quote: 'without any comprehensive plan, but only according to their more or fewer conspicuous common characteristics (Bertheau, p. xii), consist all and every one of distichs; … does such a distich proverb stand in necessary connection with one that precedes or that follows; each is in itself a small perfected and finished whole.'
  - where: thread
    claim: 'One older reading groups 13ff. as sayings on injurious and beneficial words, wise hearing and prudent silence'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/12.htm'
    quote: 'Proverbs regarding injurious and beneficial words, wise hearing and prudent silence.'
  - where: thread
    claim: 'Most of the remaining sayings from verse 17 concern the use and abuse of the tongue'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/12.htm'
    quote: 'Most of the remaining parables of this section refer to the right use and the abuse of the tongue.'
  - where: thread
    claim: 'Verses 24–28 are on the means of rising and on the two ways, to error and to life'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/12.htm'
    quote: 'We take Proverbs 12:24-28 together as a group. In these verses the subject is the means of rising (in the world), and the two ways, the one of which leads to error, and the other to life.'

  - where: 'section 2 plain'
    claim: 'Verses 4–12 form a group on the wife, the house and business'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/12.htm'
    quote: 'We now place together Proverbs 12:4-12. One proverb concerning the house-wife forms the beginning of this group, and four regarding the management of the house and business form the conclusion.'
  - where: 'section 2 plain'
    claim: 'Verse 9: the one who is lowly yet has a servant'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/12.htm'
    quote: 'A man of lowly rank, who is, however, not so poor that he cannot support a slave, is better than one who boasts himself and is yet a beggar'
  - where: 'section 3 plain'
    claim: '“Presently” in verse 16 means immediately, the same day'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/12.htm'
    quote: 'בּיּום signifies on the self-same day equals without delay, immediately'
  - where: 'section 3 plain'
    claim: '“Covereth shame”: the prudent man keeps silent about the dishonor done to him'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/12.htm'
    quote: 'the prudent man maintains silence as to the dishonour that is done to him, and represses his displeasure'
  - where: 'section 3 plain'
    claim: 'A modern translation: the prudent ignore an insult; rash words are like sword thrusts'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2012&version=NRSVUE'
    quote: 'Fools show their anger at once, but the prudent ignore an insult. … Rash words are like sword thrusts, but the tongue of the wise brings healing.'
  - where: 'section 4 plain'
    claim: 'A modern translation: the lazy will be put to forced labor'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2012&version=NRSVUE'
    quote: 'The hand of the diligent will rule, while the lazy will be put to forced labor.'

  - where: 'note 12:4 “A crown, or rot in the bones”'
    claim: 'The Church’s footnote at “virtuous” points to Ruth 3:11'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/12?lang=eng'
    quote: '“virtuous”: Ruth 3:11.'
  - where: 'note 12:4 “A crown, or rot in the bones”'
    claim: 'The Hebrew of 12:4 reads ’eshet chayil for “virtuous woman”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Prov.xml'
    quote: 'חַ֭יִל'
  - where: 'note 12:4 “A crown, or rot in the bones”'
    claim: 'Ruth 3:11 has the same phrase, ’eshet chayil'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ruth.xml'
    quote: 'חַ֖יִל'
  - where: 'note 12:10 “Knowing how an animal feels”'
    claim: 'One older reading: “The righteous knows how his cattle feel”'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/12.htm'
    quote: '10 The righteous knows how his cattle feel,'
  - where: 'note 12:10 “Knowing how an animal feels”'
    claim: 'The word for “life” can mean the state of feeling; the verb is careful knowledge on which one acts, as at 27:23'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/12.htm'
    quote: 'signifies also the state of one''s soul, the frame of mind, the state of feeling; but ידע has, as in the related proverb, Proverbs 27:23, the meaning of careful cognizance or investigation, in conformity with which one acts.'
  - where: 'note 12:10 “Knowing how an animal feels”'
    claim: 'The same reading sets the saying beside the Law’s Sabbath rest for beasts and the unmuzzled ox as its prefigurations'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/12.htm'
    quote: 'If the Tor includes in the law of the Sabbath (Exodus 20:10; Exodus 23:12) useful beasts and cattle, which are here especially meant, and secures to them the reward of their labour (Deuteronomy 25:4); … these are the prefigurations'
  - where: 'note 12:10 “Knowing how an animal feels”'
    claim: 'The Church’s footnote at “beast” points to D&C 77:2 and Moses 3:19, among others'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/12?lang=eng'
    quote: '“beast”: Gen. 1:26; D&C 29:24 (24–25); 49:19 (18–21); 77:2; Moses 3:19.'

  - where: 'note 12:21 “What evil does not befall the just”'
    claim: 'The word for “evil” in verse 21 is ’aven'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Prov.xml'
    quote: 'אָ֑וֶן'
  - where: 'note 12:21 “What evil does not befall the just”'
    claim: 'One older reading: ’aven is ethical wickedness, and as misfortune the sorrow that is the product of sin; no such evil falls on the righteous'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/12.htm'
    quote: 'the word signifies evil as ethical wickedness, and although it may be used of any misfortune in general … thus it denotes especially such sorrow as is the harvest and product of sin'
  - where: 'note 12:21 “What evil does not befall the just”'
    claim: 'The wicked are full of evil because moral evil is their element; no evil that sin produces falls on the righteous'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/12.htm'
    quote: 'The godless are full of evil, for the moral evil which is their life-element brings out of itself all kinds of evil; on the contrary, no kind of evil, such as sin brings forth and produces, falls upon the righteous.'
  - where: 'note 12:24 “Under tribute”'
    claim: 'The Hebrew of verse 24 ends with mas'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Prov.xml'
    quote: 'לָ/מַֽס'
  - where: 'note 12:24 “Under tribute”'
    claim: 'The same word mas is in 1 Kings 9:21, Solomon’s “tribute of bondservice”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Kgs.xml'
    quote: 'לְ/מַס'
  - where: 'note 12:24 “Under tribute”'
    claim: 'A modern translation: “the lazy will be put to forced labor”; the meaning of the Hebrew of verse 27 is uncertain'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2012&version=NRSVUE'
    quote: 'while the lazy will be put to forced labor. … 12.27 Meaning of Heb uncertain'
  - where: 'note 12:28 “No death”'
    claim: 'The Hebrew of 28b reads ’al mavet, with the negative particle'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Prov.xml'
    quote: 'מָֽוֶת'
  - where: 'note 12:28 “No death”'
    claim: 'The ancient versions read the word as “to” and so render “to death”'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/12.htm'
    quote: 'All the old versions to the Venet. give אל־ instead of אל־, and are therefore under the necessity of extracting from ודּרך נתיבה a meaning corresponding to this, εἰς θάνατον'
  - where: 'note 12:28 “No death”'
    claim: 'The Septuagint makes the second line lead to death'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/proverbs/12.htm'
    quote: '28In the ways of righteousness is life; but the ways of those that remember injuries lead to death.'
  - where: 'note 12:28 “No death”'
    claim: 'A modern translation keeps the negative: no death'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2012&version=NRSVUE'
    quote: 'In the path of righteousness there is life; in walking its path there is no death.'
  - where: 'note 12:28 “No death”'
    claim: 'One older reading: the line is synonymous; the walking of the way is immortality'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/12.htm'
    quote: 'Thus: the way of their step is immortality, or much rather … the walking (the stepping over and passing through) of their way is immortality. … The distich is synonymous'
  - where: 'note 12:28 “No death”'
    claim: 'The same reading: here wisdom begins to break through the limits of this life and announce a life beyond death'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/12.htm'
    quote: 'it is obvious that the Chokma begins (vid., Psychol. p. 410) to break through the limits of this present life, and to announce a life beyond the reach of death.'

  - where: christ
    claim: 'The Church’s footnote at “overthrown” (verse 7) points to 3 Nephi 14:24–27'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/12?lang=eng'
    quote: '“overthrown”: 3 Ne. 14:25 (24–27).'
