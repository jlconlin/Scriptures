chapter: 15
claims:
  - where: setting
    claim: 'The first collection of Solomon’s proverbs runs from 10:1 to 22:16'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/1.htm'
    quote: 'We begin with "The Proverbs of Solomon," chap. 10-22:16; for this collection is in relation to'
  - where: setting
    claim: 'The collection opened at 10:1 with a saying on honoring parents, and a second section opened at 13:1 the same way'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/15.htm'
    quote: 'This collection of Solomonic proverbs began, Proverbs 10:1, with a proverb having reference to the observance of the fourth commandment,'
  - where: setting
    claim: 'One older reading: 15:20 begins a third chief section, and the editor knew it, since 12:28 and 15:19, which close the first two sections, are alike'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/15.htm'
    quote: 'and a second chief section, Proverbs 13:1, began in the same way. Here a proverb of the same kind designates the beginning of a third chief section. That the editor was aware of this is shown by the homogeneity of the proverbs, Proverbs 15:19; Proverbs 12:28'

  - where: 'section 5 plain'
    claim: 'The “gifts” of 15:27 are gifts that pervert judgment'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/15.htm'
    quote: 'מתּנות are here gifts in the sense of Ecclesiastes 7:7, which pervert judgment, and cause respect of persons.'
  - where: 'section 6 plain'
    claim: '“The light of the eyes” is the light of the eye itself, bright or joyous eyes'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/15.htm'
    quote: 'the light of the eye itself [bright or joyous eyes].'
  - where: 'section 6 plain'
    claim: '“Maketh the bones fat” describes the bodily effect of good news'
    key: bdb
    url: 'https://biblehub.com/hebrew/1878.htm'
    quote: 'עָ֑צֶם ׳ד Proverbs 15:30 of bodily effect of good news'

  - where: 'note 15:1 “A word that hurts”'
    claim: '“Grievous words” renders a Hebrew phrase for a word that hurts, set against the soft answer'
    key: bdb
    url: 'https://biblehub.com/hebrew/6089.htm'
    quote: '2 hurt (of mind), ׳דְּבַרעֿ Proverbs 15:1 a word that hurts (opposed to מַעֲנֶהרַֿךְ).'
  - where: 'note 15:1 “A word that hurts”'
    claim: 'The Church’s home study sets 15:1 and 15:18 together'
    key: cfm-ot-2026-37
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/37?lang=eng'
    quote: 'Proverbs 15:1, 18: I can use kind words.'
  - where: 'note 15:1 “A word that hurts”'
    claim: 'Brigham Young counseled Latter-day Saints, especially those in important positions, to keep an even temper at home and abroad and not speak bitter words to their families'
    key: ot-manual-proverbs
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-2?lang=eng'
    quote: 'Latter-day Saints, and especially those who hold important positions in the kingdom of God, should maintain a uniform and even temper, both when at home and when abroad. … speaking words full of bitterness and biting acrimony to their wives and children'
  - where: 'note 15:1 “A word that hurts”'
    claim: 'Brigham Young: angry words should never pass our lips; he quoted 15:1'
    key: ot-manual-proverbs
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-2?lang=eng'
    quote: 'Anger should never be permitted to rise in our bosoms, and words suggested by angry feelings should never be permitted to pass our lips. ‘A soft answer turneth away wrath, but grievous words stir up anger.’'

  - where: 'note 15:4 “A healing tongue and a broken spirit”'
    claim: '“Wholesome” renders marpe’, healing; at 15:4 a healing, soothing tongue'
    key: bdb
    url: 'https://biblehub.com/hebrew/4832.htm'
    quote: 'healing, cure, health (usually figurative) … לְשׁוֺן ׳מ Eccl 15:4 healing of the tongue, = a soothing tongue (Toy).'
  - where: 'note 15:4 “A healing tongue and a broken spirit”'
    claim: '“Perverseness” is crookedness, crooked dealing'
    key: bdb
    url: 'https://biblehub.com/hebrew/5558.htm'
    quote: 'סֶ֫לֶף noun masculineProverbs 11:3 Qr crookedness, crooked dealing: — ׳ס absolute Proverbs 15:4 (of tongue)'
  - where: 'note 15:4 “A healing tongue and a broken spirit”'
    claim: '“Breach” is a breaking, fracture, used of a broken limb'
    key: bdb
    url: 'https://biblehub.com/hebrew/7667.htm'
    quote: 'breaking, fracture, crushing, breach, crash … 1 breaking of pottery Isaiah 30:14, fracture of member, limb Leviticus 21:19'
  - where: 'note 15:4 “A healing tongue and a broken spirit”'
    claim: 'One older reading: the breaking is done to the neighbor’s spirit, not the speaker’s'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/15.htm'
    quote: 'In any case, the breaking (deep wounding) is not meant in regard to his own spirit, but to that of the neighbour.'
  - where: 'note 15:4 “A healing tongue and a broken spirit”'
    claim: 'Such gentleness is a tree of life whose fruits preserve life and heal'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/15.htm'
    quote: 'Such gentleness is a tree of life, whose fruits preserve life, heal the sick, and raise up the bowed down.'

  - where: 'note 15:8 “Sacrifice and prayer”'
    claim: 'Sacrifice was not unimportant; the sacrifices of the righteous were a delight to the Lord'
    key: sc-knowhy-479
    url: 'https://scripturecentral.org/knowhy/how-is-the-day-of-atonement-understood-in-the-book-of-mormon'
    quote: 'this did not mean that sacrifice was unimportant. And while “the sacrifice of the wicked is an abomination” (Proverbs 15:8), the sacrifices of the righteous were always a delight unto the Lord'
  - where: 'note 15:8 “Sacrifice and prayer”'
    claim: 'Mormon’s teaching on gifts and prayers offered without real intent (Moroni 7:6–9)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/moro/7?lang=eng'
    quote: 'For behold, if a man being evil giveth a gift, he doeth it grudgingly; wherefore it is counted unto him the same as if he had retained the gift; wherefore he is counted evil before God.'

  - where: 'note 15:11 “Sheol and Abaddon”'
    claim: '“Hell” is Sheol, the abode of departed spirits, rendered grave, pit or hell'
    key: bd-sheol
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sheol?lang=eng'
    quote: 'The Hebrew name for the abode of departed spirits (corresponding to the Greek Hades), translated in the KJV “grave,” “pit,” and “hell,” depending on the context'
  - where: 'note 15:11 “Sheol and Abaddon”'
    claim: '“Destruction” is Abaddon, the place of the lost'
    key: bd-abaddon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/abaddon?lang=eng'
    quote: 'A Hebrew word found in the Wisdom literature of the Old Testament denoting “the place of the lost” (Job 26:6; Prov. 15:11; 27:20), which the King James Version translates as “destruction.” In Rev. 9:11 it is used as a name of the devil.'
  - where: 'note 15:11 “Sheol and Abaddon”'
    claim: '“Hell beneath” in 15:24 is Sheol, the same word as in 15:11'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Prov.xml'
    quote: 'מִ/שְּׁא֥וֹל'
  - where: 'note 15:19 “A hedge of thorns and a raised road”'
    claim: '“Made plain” renders salal, to cast up a highway, as in Isaiah 62:10, figurative here of the path of the upright'
    key: bdb
    url: 'https://biblehub.com/hebrew/5549.htm'
    quote: '1 cast up a highway: מְסִלָּה ׳ס Isaiah 62:10 (twice in verse), without object Isaiah 57:14 (twice in verse), דֶּרֶךְ לֹא סְלוּלָה Jeremiah 18:15; figurative of path of upright Proverbs 15:19.'
  - where: 'note 15:25 “The widow’s boundary”'
    claim: 'One older reading: the border of the widow’s land, which the proud remove; Israel’s law and wisdom guarded boundaries, and here the LORD is their guardian'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/15.htm'
    quote: 'It is the border of the land-possession of the widows, removed by the גּאים (lxx ὑβριστῶν), that is here meant. The possession of land in Israel was secured by severe punishment inflicted in him who removed the "landmark" (Deuteronomy 19:14; Deuteronomy 27:17)'
  - where: 'note 15:25 “The widow’s boundary”'
    claim: 'The LORD appears as guardian of the boundaries'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/15.htm'
    quote: 'inculcate the inviolability of the borders of the possession, as the guardian of which Jahve here Himself appears.'

  - where: christ
    claim: 'The Church’s home study points to the Savior exemplifying 15:1–4, 18 in Mark 12:13–17 and John 8:1–11'
    key: cfm-ot-2026-37
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/37?lang=eng'
    quote: 'You might also think of times when the Savior exemplified the teachings in Proverbs 15:1–4, 18 (see Mark 12:13–17; John 8:1–11).'
  - where: christ
    claim: 'A soft answer does not compromise truth; firm words can be soft in spirit'
    key: scripture-helps-proverbs
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/35-proverbs-1-4-15-16-22-31-ecclesiastes-1-3-11-12?lang=eng'
    quote: 'It does not mean we never speak directly or that we compromise doctrinal truth. Words that may be firm in information can be soft in spirit.'
  - where: christ
    claim: 'A soft answer is a reasoned response, disciplined words from a humble heart; it does not compromise doctrinal truth, and firm words can be soft in spirit'
    key: zwick-thinking-2014
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2014/04/what-are-you-thinking?lang=eng'
    quote: 'A “soft answer” consists of a reasoned response—disciplined words from a humble heart. It does not mean we never speak directly or that we compromise doctrinal truth. Words that may be firm in information can be soft in spirit.'
