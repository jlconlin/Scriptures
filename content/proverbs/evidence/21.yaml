chapter: 21
claims:
  - where: setting
    claim: 'The first collection of Solomon’s proverbs runs from 10:1 to 22:16'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/1.htm'
    quote: 'The 375 proverbs which are classed together in this part, chap. 10-22:16, without any comprehensive plan'
  - where: setting
    claim: 'One older reading: verse 1, a saying about the king, closes a group, as the preceding group closed'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/21.htm'
    quote: 'The group, like the preceding one, now closes with a proverb of the king.'
  - where: setting
    claim: 'The next group runs from 21:2 to 21:8 and closes as it began'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/21.htm'
    quote: 'The next group extends from Proverbs 21:2 to Proverbs 21:8, where it closes as it began.'
  - where: setting
    claim: 'The group from 21:9 runs to 21:18, and a new one begins with a variation of its first verse'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/21.htm'
    quote: 'The group now following extends to Proverbs 21:18, where a new one begins with a variation of its initial verse.'
  - where: setting
    claim: '21:19 is a doublet of 21:9 (and 25:24), and begins a new addition'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/21.htm'
    quote: 'With this verse, a doublet to Proverbs 21:9 (Proverbs 25:24), the collector makes a new addition'

  - where: 'section 2 plain'
    claim: 'The “wide house” of 21:9 is a house shared in common'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/21.htm'
    quote: 'Than a contentious wife and a house in common.'
  - where: 'section 2 plain'
    claim: '“Remain” in 21:16 is to dwell or come to rest'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/21.htm'
    quote: 'Shall dwell in the assembly of the dead.'
  - where: 'section 2 plain'
    claim: 'The “transgressor” of 21:18 is the faithless man'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/21.htm'
    quote: 'the faithless steps into the place of the upright'
  - where: 'section 3 plain'
    claim: '21:22: the wise man casts down the fortress the city trusted in'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/21.htm'
    quote: 'And casteth down the fortress in which they trusted.'
  - where: 'section 3 plain'
    claim: '21:28: the listener speaks for continuance; his word lasts'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/21.htm'
    quote: 'so that what he says stands'
  - where: 'section 4 plain'
    claim: '“Safety” in 21:31 is the victory'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/21.htm'
    quote: 'But with Jahve is the victory,'

  - where: 'note 21:1 “Channels of water”'
    claim: '“Rivers” is peleg, a channel or artificial canal, used of irrigating canals'
    key: bdb
    url: 'https://biblehub.com/hebrew/6388.htm'
    quote: 'channel, (artificial) canal'
  - where: 'note 21:1 “Channels of water”'
    claim: 'The king’s heart, however exalted, has One above it who moves it by hidden influences, such as the prayer of the oppressed; man is still free'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/21.htm'
    quote: 'has yet One above it by whom it is moved by hidden influences, e.g., the prayer of the oppressed; for man is indeed free, yet he acts under the influence of divinely-directed circumstances'

  - where: 'note 21:3 “Justice before sacrifice”'
    claim: 'Sacrifice here is the Mosaic ordinance; inner righteousness pleases the Lord more than outward ritual (1 Sam. 15:22)'
    key: ot-manual-proverbs
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-2?lang=eng'
    quote: 'Sacrifice as used here refers to the Mosaic ordinance of sacrifice.'
  - where: 'note 21:3 “Justice before sacrifice”'
    claim: 'The Lord often reminded Israel that inner righteousness pleases Him more than outward ritual (1 Sam. 15:22)'
    key: ot-manual-proverbs
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-2?lang=eng'
    quote: 'the Lord often reminded them that inner righteousness is more pleasing to Him than outward conformity to ritual (compare 1 Samuel 15:22'
  - where: 'note 21:3 “Justice before sacrifice”'
    claim: 'The first line of 21:27 equals 15:8'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/21.htm'
    quote: 'Line first equals Proverbs 15:8.'
  - where: 'note 21:3 “Justice before sacrifice”'
    claim: 'One older reading: the wicked brought offerings to buy God’s connivance in their sin, making God a minister of sin'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/21.htm'
    quote: 'in order thereby to recompense for their transgressions, and to purchase for themselves the connivance of God for their dissolute life.'
  - where: 'note 21:3 “Justice before sacrifice”'
    claim: 'Such an offerer makes God a minister of sin'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/21.htm'
    quote: 'he makes God directly a minister of sin.'

  - where: 'note 21:4 “Plowing, or a lamp”'
    claim: 'The Hebrew text has nir (lemma 5215) at 21:4'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Prov.xml'
    quote: 'נִ֖ר'
  - where: 'note 21:4 “Plowing, or a lamp”'
    claim: 'Nir is tillable or fallow ground'
    key: bdb
    url: 'https://biblehub.com/hebrew/5215.htm'
    quote: 'the tillable, untilled or fallow ground'
  - where: 'note 21:4 “Plowing, or a lamp”'
    claim: 'BDB takes the word at 21:4 as lamp, figuratively happiness or delight, with the versions'
    key: bdb
    url: 'https://biblehub.com/hebrew/5216.htm'
    quote: 'happiness, delight (construct) נִר רְשָׁעִים Proverbs 21:4 (so Vrss'
  - where: 'note 21:4 “Plowing, or a lamp”'
    claim: 'One older reading keeps the field: the whole conduct and life of the godless'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/21.htm'
    quote: 'so that נר רשׁעים may mean the cultivation of the fields, and generally the husbandry, i.e., the whole conduct and life of the godless.'
  - where: 'note 21:4 “Plowing, or a lamp”'
    claim: 'The whole field the godless cultivate, with all that grows on it, is sin'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/21.htm'
    quote: 'the whole husbandry of the godless, or the whole of the field cultivated by them, with all that grows thereon, is sin.'
  - where: 'note 21:4 “Plowing, or a lamp”'
    claim: 'A modern translation reads “the lamp of the wicked”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+21&version=NRSVUE'
    quote: 'the lamp of the wicked—are sin'

  - where: 'note 21:9 “A corner of the roof”'
    claim: 'The corner is the battlement or edge of the roof; one sitting there is exposed to the storm'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/21.htm'
    quote: 'is the battlement (Zephaniah 1:16) of the roof, the edge of the roof, or its summit; he who sits there does so not without danger, and is exposed to the storm'
  - where: 'note 21:9 “A corner of the roof”'
    claim: 'The “wide house” is a house of companionship, a common house'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/21.htm'
    quote: 'a "house of companionship, i.e., a common house,"'
  - where: 'note 21:9 “A corner of the roof”'
    claim: '21:19 is a doublet of 21:9, and 25:24 repeats it'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/21.htm'
    quote: 'a doublet to Proverbs 21:9 (Proverbs 25:24)'

  - where: 'note 21:13 “The cry of the poor”'
    claim: 'One older reading: only the merciful find mercy (Matt. 5:7); the unmerciful rich man will remain unheard when he calls on God'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/21.htm'
    quote: 'Only the merciful find mercy, Matthew 5:7; the unmerciful rich man, who has no ear for the cry'
  - where: 'note 21:13 “The cry of the poor”'
    claim: 'He will remain unheard when he calls on God in need; compare the parable of the unmerciful servant'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/21.htm'
    quote: 'will also remain unheard when he himself, in the time of need, calls upon God for help. Cf. the parable of the unmerciful servant of the merciful king, Matthew 18:23.'
  - where: 'note 21:13 “The cry of the poor”'
    claim: 'The Church’s footnote at “poor” points to Mosiah 4:16–18'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/4?lang=eng'
    quote: 'ye will not suffer that the beggar putteth up his petition to you in vain, and turn him out to perish.'

  - where: 'note 21:18 “A ransom for the righteous”'
    claim: 'Kopher is the price of a life, ransom; used at Ex. 21:30, Isa. 43:3 and Prov. 21:18'
    key: bdb
    url: 'https://biblehub.com/hebrew/3724.htm'
    quote: 'the price of a life, ransom'
  - where: 'note 21:18 “A ransom for the righteous”'
    claim: 'BDB lists Ex. 21:30 as a price for the ransom of a life and Prov. 21:18 as ransom for'
    key: bdb
    url: 'https://biblehub.com/hebrew/3724.htm'
    quote: 'a price for ransom of a life Job 33:24; Job 36:18'
  - where: 'note 21:18 “A ransom for the righteous”'
    claim: 'One older reading: the thought is that of 11:8; examples are Cyrus (Isa. 43:3) and the exchange of Haman and Mordecai'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/21.htm'
    quote: 'The thought is the same as at Proverbs 11:8. An example of this is, that the same world-commotion which brought the nations round Babylon for its destruction, put an end to Israel''s exile'
  - where: 'note 21:18 “A ransom for the righteous”'
    claim: 'Cyrus punished the nations and freed Israel; Haman and Mordecai exchanged places'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/21.htm'
    quote: 'Cyrus, the instrument in God''s hands for inflicting punishment on many heathen nations, was Israel''s liberator, Isaiah 43:3. Another example is in the exchange of places by Haman and Mordecai'
  - where: 'note 21:18 “A ransom for the righteous”'
    claim: 'The wrath passes by the upright and falls on the faithless'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/21.htm'
    quote: 'for the wrath passes by the latter and falls upon the former.'

  - where: 'note 21:28 “Speaking so that it stands”'
    claim: 'The Hebrew at the end of the line is lanetsach'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Prov.xml'
    quote: 'לָ/נֶ֥צַח'
  - where: 'note 21:28 “Speaking so that it stands”'
    claim: 'The man that heareth is one who attentively hears and carefully proves, and says nothing he has not surely heard'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/21.htm'
    quote: 'may say nothing that he has not surely heard. As לב שׁמע, 1 Kings 3:9, means an obedient heart, so here אישׁ שּׁומע means a man who attentively hears, carefully proves.'
  - where: 'note 21:28 “Speaking so that it stands”'
    claim: 'He will speak for continuance: either without ever needing to be silent, or (preferred) so that what he says stands'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/21.htm'
    quote: 'thus: he will speak for continuance, i.e., either: without ever requiring to be silent, or, which we prefer: so that what he says stands'
  - where: 'note 21:28 “Speaking so that it stands”'
    claim: 'The liar comes to nothing; the lie has no feet to stand on; 28a is close to 19:9'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/21.htm'
    quote: 'the lie has no feet on which it can stand, it comes to nothing sooner or later.'
  - where: 'note 21:28 “Speaking so that it stands”'
    claim: 'The first line equals 19:9'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/21.htm'
    quote: '(28a equals Proverbs 19:9, cf. 5)'
  - where: 'note 21:28 “Speaking so that it stands”'
    claim: 'A modern translation: a good listener will testify successfully'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+21%3A28&version=NRSVUE'
    quote: 'but a good listener will testify successfully.'

  - where: 'note 21:30 “No counsel against the LORD”'
    claim: 'Elder Gong quoted 21:30 under the counsel not to confuse man’s wisdom with the Lord’s'
    key: gong-ear-wisdom
    url: 'https://rsc.byu.edu/vol-27-no-2-2026/ear-wisdom-heart-understanding'
    quote: 'Please be careful not to confuse man’s wisdom or understanding with that of the Lord.'
  - where: 'note 21:30 “No counsel against the LORD”'
    claim: 'Elder Gong set 2 Ne. 9:28 beside 21:30'
    key: gong-ear-wisdom
    url: 'https://rsc.byu.edu/vol-27-no-2-2026/ear-wisdom-heart-understanding'
    quote: 'When they are learned they think they are wise, and they hearken not unto the counsel of God, for they set it aside, supposing they know of themselves, wherefore, their wisdom is foolishness. (2 Nephi 9:28)'

  - where: 'note 21:31 “The horse and the victory”'
    claim: 'The horse was used only in war and became a symbol of war and conquest'
    key: ot-manual-proverbs
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-2?lang=eng'
    quote: 'Anciently the horse was used only in warfare and battle; it therefore became a symbol of war and conquest'
  - where: 'note 21:31 “The horse and the victory”'
    claim: 'People prepare for war when their ultimate safety lies in trust in God'
    key: ot-manual-proverbs
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-2?lang=eng'
    quote: 'seek to defend themselves against their enemies by preparing for war, when their ultimate safety lies in trust and faith in God.'
  - where: 'note 21:31 “The horse and the victory”'
    claim: 'One older reading: it depends on the LORD how the battle issues; trust nothing in war-horses; 1 Sam. 17:47 and Ps. 20'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/21.htm'
    quote: 'it depends on Him how the battle shall issue; and king and people who have taken up arms in defence of their rights have thus to trust nothing in the multitude of their war-horses'
  - where: 'note 21:31 “The horse and the victory”'
    claim: 'Delitzsch cites 1 Sam. 17:47 and Ps. 20 for the point'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/21.htm'
    quote: 'the battle is the Lord''s, 1 Samuel 17:47'

  - where: christ
    claim: 'The Church’s footnote at “righteousness” in 21:21 points to Matt. 6:33 and 3 Ne. 12:6'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/21?lang=eng'
    quote: 'He that followeth after righteousness and mercy findeth life, righteousness, and honour.'
  - where: christ
    claim: '3 Ne. 12:6: those who hunger and thirst after righteousness shall be filled with the Holy Ghost'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/12?lang=eng'
    quote: 'shall be filled with the Holy Ghost'
