chapter: 20
claims:
  - where: setting
    claim: 'The proverbs of Solomon proper are 10:1–22:16, under the heading at 10:1'
    key: ot-minute-proverbs
    url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-overview'
    quote: 'The actual proverbs of Solomon are found in Proverbs 10:1–22:16. This section is 375 lines in the Hebrew text and corresponds to its heading found in Proverbs 10:1.'
  - where: setting
    claim: 'The Church footnote points verse 16 to 27:13'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/20?lang=eng'
    quote: '“garment”: Prov. 27:13.'
  - where: setting
    claim: 'The Church footnote points verse 2 to 19:12'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/20?lang=eng'
    quote: '“roaring”: Prov. 19:12.'

  - where: thread
    claim: 'One older reading: at verse 20 a new group begins with the commandment to honor parents'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/20.htm'
    quote: 'The following group begins, for once more the aim of this older Book of Proverbs becomes prominent, with an inculcation of the fourth'

  - where: section 1 plain
    claim: 'The “cold” of verse 4 is winter, after the autumn harvest'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/20?lang=eng'
    quote: '“cold”: HEB winter; i.e., after the autumn harvest.'
  - where: section 2 plain
    claim: 'The king of verse 8 winnows evil with his eyes'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2020&version=NRSVUE'
    quote: 'winnows all evil with his eyes.'
  - where: section 3 plain
    claim: 'The buyer of verse 14 says “Bad, bad”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2020&version=NRSVUE'
    quote: '“Bad, bad,” says the buyer,'

  - where: 'note 20:1 “What wine does to a man”'
    claim: 'One older reading: the effects of wine and strong drink are attributed to the drinks themselves'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/20.htm'
    quote: 'are attributed to these liquors themselves as their property.'
  - where: 'note 20:1 “What wine does to a man”'
    claim: 'Wine is a mocker because the drunk scoffs at the holy; strong drink boisterous because the drunk breaks the bounds of morality'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/20.htm'
    quote: 'Wine is a mocker, because he who is intoxicated with it readily scoffs at that which is holy; mead is boisterous'
  - where: 'note 20:1 “What wine does to a man”'
    claim: 'The drunk breaks through the limits of morality and propriety'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/20.htm'
    quote: 'because he who is inebriated in his dissolute madness breaks through the limits of morality and propriety.'
  - where: 'note 20:1 “What wine does to a man”'
    claim: 'The unwise man gives himself to wine until he is no longer master of himself; Isaiah 28:7 shows actual staggering'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/20.htm'
    quote: 'he gives himself up to wine to such a degree that he is no longer master of himself.'
  - where: 'note 20:1 “What wine does to a man”'
    claim: 'One older reading: Isaiah 28:7 shows that deceived means actual staggering'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/20.htm'
    quote: 'Isaiah 28:7, however, shows that one has to think on actual staggering, being overtaken in wine.'
  - where: 'note 20:1 “What wine does to a man”'
    claim: 'A modern translation: strong drink a brawler; led astray'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2020&version=NRSVUE'
    quote: 'Wine is a mocker, strong drink a brawler,'
  - where: 'note 20:1 “What wine does to a man”'
    claim: 'A modern translation reads “led astray”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2020&version=NRSVUE'
    quote: 'and whoever is led astray by it is not wise.'
  - where: 'note 20:1 “What wine does to a man”'
    claim: 'The Septuagint: every fool is entangled with them'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/proverbs/20.htm'
    quote: 'Wine is an intemperate thing, and strong drink full of violence: but every fool is entangled with them.'
  - where: 'note 20:1 “What wine does to a man”'
    claim: 'The Church footnote points verse 1 to the Word of Wisdom'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/20?lang=eng'
    quote: '“Wine”: TG Drunkenness; Temperance; Word of Wisdom.'

  - where: 'note 20:9 “No one can say his heart is clean”'
    claim: 'One older reading: verse 9 is the thought of Solomon''s temple prayer, 1 Kings 8:46'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/20.htm'
    quote: 'It is the same thought that Solomon expresses in his prayer at the consecration of the temple, 1 Kings 8:46 : there is no man who sinneth not.'
  - where: 'note 20:9 “No one can say his heart is clean”'
    claim: 'No one can boast of a clean heart: self-knowledge is limited and sin deeply rooted'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/20.htm'
    quote: 'No one can boast of this, for man''s knowledge of himself and of his sins remains always limited (Jeremiah 17:9.; Psalm 19:13); and sin is so deeply rooted in his nature'
  - where: 'note 20:16 “The garment of a surety”'
    claim: 'The Hebrew writes “strangers” (ketiv) and reads “a strange woman” (qere)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Prov.xml'
    quote: 'נכרים'
  - where: 'note 20:16 “The garment of a surety”'
    claim: 'The qere of 20:16 is “strange woman”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Prov.xml'
    quote: 'נָכְרִיָּ֣ה'
  - where: 'note 20:16 “The garment of a surety”'
    claim: 'A modern translation follows “foreigners”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2020&version=NRSVUE'
    quote: 'seize the pledge given as surety for foreigners.'

  - where: 'note 20:20 “A lamp put out”'
    claim: 'The law condemns the son who curses his parents; the proverb means not the sentence but his fearful end'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/20.htm'
    quote: 'The divine law, Exodus 21:17; Leviticus 20:9, condemns such an one to death. But the proverb does not mean this sentence against the criminal, which may only seldom be carried into execution, but the fearful end'
  - where: 'note 20:20 “A lamp put out”'
    claim: 'Of the godless it was said at 13:9 that their light is put out: an end to all that brightened their life'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/20.htm'
    quote: 'Of the godless, it has already been said that their light is extinguished, Proverbs 13:9, there is suddenly an end to all that brightened, i.e., made happy and embellished their life'
  - where: 'note 20:20 “A lamp put out”'
    claim: '“Obscure” is the Hebrew word for the pupil of the eye, here the middle of the night, deep darkness'
    key: bdb
    url: 'https://biblehub.com/hebrew/380.htm'
    quote: 'pupil of eye'
  - where: 'note 20:20 “A lamp put out”'
    claim: 'In 20:20 the word means the midst of night, deep darkness'
    key: bdb
    url: 'https://biblehub.com/hebrew/380.htm'
    quote: '= middle, midst of night'
  - where: 'note 20:20 “A lamp put out”'
    claim: 'The Septuagint: his eyeballs shall see darkness'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/proverbs/20.htm'
    quote: 'The lamp of him that reviles father or mother shall be put out, and his eyeballs shall see darkness.'

  - where: 'note 20:20 “A lamp put out”'
    claim: 'A modern translation: utter darkness'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2020&version=NRSVUE'
    quote: 'your lamp will go out in utter darkness.'

  - where: 'note 20:22 “Wait on the LORD, not on revenge”'
    claim: 'One older reading: the promise is that God will help, not that He will avenge'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/20.htm'
    quote: 'for the promise is not that He will avenge them, but that He will help them.'
  - where: 'note 20:22 “Wait on the LORD, not on revenge”'
    claim: 'The same reading: men should not recompense evil with evil, and it sets Romans 12:17–19 and 1 Peter 3:9 beside the verse'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/20.htm'
    quote: 'It does not, however, say that men ought to commit the taking of vengeance to God; but, in the sense of Romans 12:17-19; 1 Peter 3:9'
  - where: 'note 20:22 “Wait on the LORD, not on revenge”'
    claim: 'The same reading: act according to the law of love, not the law of retaliation'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/20.htm'
    quote: 'Men ought always to act toward their neighbours according to the law of love, and not according to the jus talionis, Proverbs 24:29'
  - where: 'note 20:22 “Wait on the LORD, not on revenge”'
    claim: 'The Septuagint: avenge myself on my enemy'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/proverbs/20.htm'
    quote: 'Say not, I will avenge myself on my enemy; but wait on the Lord, that he may help thee.'

  - where: 'note 20:25 “A vow made in haste”'
    claim: 'A modern translation: to say rashly “It is holy” and reflect after the vow'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2020&version=NRSVUE'
    quote: 'It is a snare for one to say rashly, “It is holy,”'
  - where: 'note 20:25 “A vow made in haste”'
    claim: 'A modern translation: begin to reflect only after making a vow'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2020&version=NRSVUE'
    quote: 'and begin to reflect only after making a vow.'
  - where: 'note 20:25 “A vow made in haste”'
    claim: 'The line is syntactically difficult; the meaning “devour” is rejected'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/20.htm'
    quote: 'Viewed syntactically, 25a is so difficult'
  - where: 'note 20:25 “A vow made in haste”'
    claim: 'One older reading rejects the meaning “devour”'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/20.htm'
    quote: 'Accordingly, nothing is to be done with the meaning καταπίεται (Aquila, the Venet.).'
  - where: 'note 20:25 “A vow made in haste”'
    claim: '“Holy” is an exclamation, like Corban (Mark 7:11), consecrating property to God'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/20.htm'
    quote: 'is like κορβᾶν, Mark 7:11, the exclamation to which one suddenly gives utterance, thereby meaning that this or that among his possessions henceforth no longer belongs to him, but is consecrated to God'
  - where: 'note 20:25 “A vow made in haste”'
    claim: 'The snare: he finds he has injured himself, or is constrained to break his oath'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/20.htm'
    quote: 'he comes to know that he has injured himself by the alienation of his property'
  - where: 'note 20:25 “A vow made in haste”'
    claim: 'Or he is overcome by repentance and constrained to break his oath'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/20.htm'
    quote: 'or it may be he is overcome by repentance and is constrained to break his oath.'
  - where: 'note 20:25 “A vow made in haste”'
    claim: 'The Septuagint of 20:25'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/proverbs/20.htm'
    quote: 'It is a snare to a man hastily to consecrate some of his own property: for in that case repentance comes after vowing.'

  - where: 'note 20:26 “The threshing wheel”'
    claim: 'A modern translation: winnows the wicked, drives the wheel over them'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2020&version=NRSVUE'
    quote: 'A wise king winnows the wicked'
  - where: 'note 20:26 “The threshing wheel”'
    claim: 'The wheel is the threshing cart''s (Isaiah 28:27), with the winnowing fork'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/20.htm'
    quote: 'is, without doubt, the wheel of the threshing-cart, עגלה, Isaiah 28:27.'
  - where: 'note 20:26 “The threshing wheel”'
    claim: 'Not the punishment of the wheel, a custom of war'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/20.htm'
    quote: 'We are not to think of the punishment of the wheel, which occurs only as a terrible custom of war (e.g., Amos 1:3).'
  - where: 'note 20:26 “The threshing wheel”'
    claim: 'The wise king separates the godless and punishes them, as the winnower gives chaff to the wind'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/20.htm'
    quote: 'It is only meant that a wise king, by sharp and vigorous procedure, separates the godless, and immediately visits them with merited punishment, as he who works with the winnowing shovel gives the chaff to the wind.'
  - where: 'note 20:26 “The threshing wheel”'
    claim: 'Verse 26 is a variant of verse 8'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/20.htm'
    quote: 'A variant to Proverbs 20:8, but here with the following out of the figure of the winnowing.'

  - where: 'note 20:27 “The lamp of the LORD”'
    claim: 'The Hebrew word for “spirit” in 20:27 is neshamah'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Prov.xml'
    quote: 'נִשְׁמַ֣ת'
  - where: 'note 20:27 “The lamp of the LORD”'
    claim: 'Neshamah is the self-conscious human spirit, the principle of life breathed by God into the body (Gen. 2:7)'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/20.htm'
    quote: 'it is so called as the principle of life breathed immediately by God into the body (vid., at Genesis 2:7; Genesis 7:22).'
  - where: 'note 20:27 “The lamp of the LORD”'
    claim: 'The proverb is to be understood ethically: the spirit penetrates what is within'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/20.htm'
    quote: 'The proverb is thus to be ethically understood: the spirit is that which penetrates that which is within'
  - where: 'note 20:27 “The lamp of the LORD”'
    claim: 'The candle God kindled in man illuminates first the man himself'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/20.htm'
    quote: 'But the candle which God has kindled in man has as the nearest sphere of illumination, which goes forth from it, the condition of the man himself'
  - where: 'note 20:27 “The lamp of the LORD”'
    claim: '“Belly” denotes the inner part of the body and of the personality'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/20.htm'
    quote: 'denotes the inner part of the body (R. בט, to be deepened), and generally of the personality'
  - where: 'note 20:27 “The lamp of the LORD”'
    claim: 'A modern translation: the lamp of the Lord, searching every inmost part'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2020&version=NRSVUE'
    quote: 'The human spirit is the lamp of the Lord,'
  - where: 'note 20:27 “The lamp of the LORD”'
    claim: 'The Septuagint: a light of the Lord'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/proverbs/20.htm'
    quote: 'The spirit of man is a light of the Lord, who searches the inmost parts of the belly.'

  - where: 'note 20:30 “Wounds that cleanse”'
    claim: 'A modern translation: blows that wound cleanse away evil'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2020&version=NRSVUE'
    quote: 'Blows that wound cleanse away evil;'
  - where: 'note 20:30 “Wounds that cleanse”'
    claim: 'The Septuagint: bruises befall bad men'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/proverbs/20.htm'
    quote: 'Bruises and contusions befall bad men; and plagues shall come in the inward parts of their belly.'

  - where: 'note 20:30 “Wounds that cleanse”'
    claim: 'The first word is properly the streak, the stripe'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/20.htm'
    quote: 'is properly the streak, the stripe'

  - where: christ
    claim: 'The Church footnote points verse 9 to Romans 3:23'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/20?lang=eng'
    quote: '“clean”: Rom. 3:23.'
  - where: christ
    claim: 'The Church footnote points verse 22 to D&C 98:2'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/20?lang=eng'
    quote: '“wait”: Ps. 25:5; 27:14; Isa. 40:31; 2 Ne. 6:13 (7, 13); D&C 98:2.'
  - where: christ
    claim: 'D&C 98:1–3 is about the afflictions of the Saints working for their good'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/98?lang=eng'
    quote: '1–3, The afflictions of the Saints will be for their good'
