chapter: 30
claims:
  - where: setting
    claim: 'Davis lists the words of Agur (30:1–14) among the collections not directly attributed to Solomon'
    key: ot-minute-proverbs
    url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-overview'
    quote: 'The book of Proverbs is made up of other additional collections and units not directly attributed to Solomon. For example, there are the “words of Agur” (30:1–14)'
  - where: setting
    claim: 'KnoWhy #744: the book hints at its eclectic nature with sayings attributed to Agur and to Lemuel''s mother'
    key: sc-knowhy-744
    url: 'https://scripturecentral.org/knowhy/why-are-alma-s-instructions-to-his-sons-filled-with-proverbial-wisdom'
    quote: 'The book of Proverbs hints at this eclectic nature with its addition by Hezekiah as well as sayings attributed to a man named Agur and the mother of a king named Lemuel.'
  - where: thread
    claim: 'One older reading: 30:1–4 is not a sceptic''s speech but the confession of one thirsting after God; human thought does not penetrate to the essence of God'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/30.htm'
    quote: 'The confession, 1b-4, is not that of a man who does not find himself in the right condition, but such as one who is thirsting after God must renounce: the thought of a man does not penetrate to the essence of God'
  - where: thread
    claim: 'The same: the prayer''s blaspheming of God''s name is tied to the two following proverbs, which begin with the catchword “curse”'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/30.htm'
    quote: 'is to be concluded from the two following proverbs, which begin with the catchword קלל'
  - where: section 1 plain
    claim: '“The holy” in 30:3 may be read as the Holy One'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+30&version=NRSVUE'
    quote: '30.3 Or Holy One'
  - where: section 3 plain
    claim: '“Accuse” in 30:10 is to slander'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+30&version=NRSVUE'
    quote: '10 Do not slander a servant to a master, lest the servant curse you, and you be held guilty.'
  - where: section 5 plain
    claim: 'The conies are small rock animals such as the rock badger'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/30?lang=eng'
    quote: '26a “conies”: IE small animals, such as the rock badger.'
  - where: section 5 plain
    claim: 'Another modern translation also marks the Hebrew of 30:31 uncertain'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+30&version=NIV'
    quote: 'Proverbs 30:31 The meaning of the Hebrew for this phrase is uncertain.'
  - where: section 6 plain
    claim: '30:33 read as pressing milk, the nose and anger'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+30&version=NRSVUE'
    quote: 'For as pressing milk produces curds and pressing the nose produces blood, so pressing anger produces strife.'
  - where: 'note 30:1 “Agur the son of Jakeh”'
    claim: 'One older reading: Agur is otherwise unknown'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/1.htm'
    quote: 'is by an otherwise unknown author, Agur the son of Jakeh'
  - where: 'note 30:1 “Agur the son of Jakeh”'
    claim: 'BDB: massa as utterance, oracle, of prophetic utterance (Isa. 13:1, the burden of Babylon)'
    key: bdb
    url: 'https://biblehub.com/hebrew/4853.htm'
    quote: 'III. מַשָּׂא noun masculineIsaiah 14:28 utterance, oracle … — of prophetic utterance: 2 Kings 9:25; Isaiah 14:28; Ezekiel 12:10; 2Chronicles 24:27 (with עַל); בָבֶל ׳מ Isaiah 13:1'
  - where: 'note 30:1 “Agur the son of Jakeh”'
    claim: 'Modern translations render hammassa “An oracle”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+30&version=NRSVUE'
    quote: '30 The words of Agur son of Jakeh. An oracle.'
  - where: 'note 30:1 “Agur the son of Jakeh”'
    claim: 'and “an inspired utterance”; and reads 1b with a different word division'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+30&version=NIV'
    quote: '30 The sayings(A) of Agur son of Jakeh—an inspired utterance. … “I am weary, God, but I can prevail. … Proverbs 30:1 With a different word division of the Hebrew; Masoretic Text utterance to Ithiel, / to Ithiel and Ukal:'
  - where: 'note 30:1 “Agur the son of Jakeh”'
    claim: 'BDB: Massa is a people and territory, a son of Ishmael (Gen. 25:14), and the realm of king Lemuel (Prov. 31:1)'
    key: bdb
    url: 'https://biblehub.com/hebrew/4854.htm'
    quote: 'I. מַשָּׂא proper name, of a people and territory … 1 ''son'' of Ishmael Genesis 25:14 = 1 Chronicles 1:30. … 2 realm of king Lemuel Proverbs 31:1'
  - where: 'note 30:1 “Agur the son of Jakeh”'
    claim: 'One older reading: Agur son of Jakeh, of the tribe or country of Massa'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/30.htm'
    quote: 'the expression is certainly, after the Arabic usus loq., to be thus explained: The words of Agur the son of Jakeh, of the tribe (the country) of Massa.'
  - where: 'note 30:1 “Agur the son of Jakeh”'
    claim: 'A modern translation reads 1b “I am weary, O God” and marks it uncertain'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+30&version=NRSVUE'
    quote: 'Thus says the man: I am weary, O God; I am weary, O God, and am wasting away. … 30.1 Meaning of Heb uncertain'
  - where: 'note 30:1 “Agur the son of Jakeh”'
    claim: 'The Septuagint has no names in 30:1'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/proverbs/30.htm'
    quote: '1These things says the man to them that trust in God; and I cease.'
  - where: 'note 30:4 “What is his son''s name”'
    claim: 'One older reading: the garment is a figure of the clouds holding the upper waters'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/30.htm'
    quote: 'the שׂמלה (from שׂמל, comprehendere) is a figure of the clouds which contain the upper waters, as Job 38:37, the bottles of heaven.'
  - where: 'note 30:4 “What is his son''s name”'
    claim: 'The same: “if thou canst tell” is like Job 38:5; the question is formed as when the Lord brings home to Job human weakness and ignorance'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/30.htm'
    quote: 'כּי תדע is in symphony with Job 38:5, cf. Job 38:18. The question is here formed as it is there, when Jahve brings home to the consciousness of Job human weakness and ignorance.'
  - where: 'note 30:4 “What is his son''s name”'
    claim: 'The Septuagint reads “the name of his children”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/proverbs/30.htm'
    quote: 'what is his name? or what is the name of his children?'
  - where: 'note 30:6 “Add thou not unto his words”'
    claim: 'One older reading: 30:5 depends on Ps. 18:30 (Heb. 18:31) and 30:6 on Deut. 4:2'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/30.htm'
    quote: 'In the dependent relation of Proverbs 30:5 to Psalm 18:31 (2 Samuel 22:31), and of Proverbs 30:6 to Deuteronomy 4:2, there is no doubt the self-testimony of God given to Israel, and recorded in the book of the Tôra, is here meant.'
  - where: 'note 30:6 “Add thou not unto his words”'
    claim: 'The same: the more limited a man''s knowledge of God, the more he must hold to the pure word of revelation'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/30.htm'
    quote: 'The more limited a man is in his knowledge of God - viz. in that which presents itself to him lumine naturae, - so much the more thankful must he be that God has revealed Himself in history, and so much the more firmly has he to hold fast by the pure word of the divine revelation.'
  - where: 'note 30:6 “Add thou not unto his words”'
    claim: 'The same: adding by overstraining or repressing God''s words; human tradition claiming the same divine authority as the written law'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/30.htm'
    quote: 'He who adds anything to them, either by an overstraining of them or by repressing them, will not escape the righteous judgment of God … so far as it claimed for itself the same divine authority as that of the written law'
  - where: 'note 30:8 “Neither poverty nor riches”'
    claim: 'A modern translation renders “daily bread”, with a cross-reference to Matt. 6:11, and sets Deut. 8:10–14 beside 30:9'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+30&version=NIV'
    quote: 'but give me only my daily bread.(K) … Proverbs 30:8 : Mt 6:11 … Proverbs 30:9 : Dt 6:12; 8:10-14; Hos 13:6'
  - where: 'note 30:15 “Three things, yea, four”'
    claim: 'Parry: number parallelism raises the first number by one in the second line; it heightens the sense of multitude'
    key: parry-number-parallelism
    url: 'https://rsc.byu.edu/preserved-translation/number-parallelism'
    quote: 'One is a form of parallelism in which the numbers are presented in two lines, with the second line increasing the first number by one. This exaggerated comparison heightens the sense of multitude, lending greater importance to the thing being described.'
  - where: 'note 30:15 “Three things, yea, four”'
    claim: 'Parry gives 30:15 as the example, and 30:18–19, 20–23, 29–31'
    key: parry-number-parallelism
    url: 'https://rsc.byu.edu/preserved-translation/number-parallelism'
    quote: 'Examples in biblical poetry and prophecy are Proverbs 30:18–19, 20–23, 29–31 and Amos 1:3, 6, 9, 11, 13.'
  - where: 'note 30:19 “The way of a man with a maid”'
    claim: 'One older reading: the turning point is the fourth way; the others are foil to it'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/30.htm'
    quote: 'The turning-point lies in the fourth; to that point the other three expressions gravitate, which have not an object in themselves, but are only as folie to the fourth.'
  - where: 'note 30:19 “The way of a man with a maid”'
    claim: 'The same: the fourth way is not unsought love but the sexual act'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/30.htm'
    quote: 'is not to be understood of love unsought, suddenly taking possession of and captivating a man toward this or that maid'
  - where: 'note 30:19 “The way of a man with a maid”'
    claim: 'The same: the eating of 30:20 is a figure like the secret bread of 9:17'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/30.htm'
    quote: 'But eating is just a figure, like the "secret bread," Proverbs 9:17, and the wiping of the mouth belongs to this figure.'
  - where: 'note 30:19 “The way of a man with a maid”'
    claim: 'The same: verse 20 confirms that the four ways refer to the tracklessness of the consequences'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/30.htm'
    quote: 'This appendix, with its כן, confirms it, that the intention of the four ways refers to the tracklessness of the consequences.'
  - where: 'note 30:28 “The spider or the lizard”'
    claim: 'One older reading: the word means not the spider but the lizard, after the Septuagint and Jerome'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/30.htm'
    quote: 'Accordingly, and after the lxx and Jerome, it may be regarded as a confirmed tradition that שממית means not the spider, for which the name עכּבישׁ is coined, but the lizard, and particularly the stellion (spotted lizard).'
  - where: 'note 30:28 “The spider or the lizard”'
    claim: 'A modern translation reads “the lizard … grasped in the hand” with the footnote “Or spider”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+30&version=NRSVUE'
    quote: '28 the lizard can be grasped in the hand, yet it is found in kings’ palaces. … 30.28 Or spider'
  - where: 'note 30:28 “The spider or the lizard”'
    claim: 'Another modern translation reads “a lizard” and “hyraxes”'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+30&version=NIV'
    quote: '26 hyraxes(AE) are creatures of little power, yet they make their home in the crags; … 28 a lizard can be caught with the hand, yet it is found in kings’ palaces.'
  - where: 'note 30:33 “Pressing milk, nose and anger”'
    claim: 'The Hebrew has the one word mits (three times in 30:33)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Prov.xml'
    quote: 'מִ֪יץ'
  - where: 'note 30:33 “Pressing milk, nose and anger”'
    claim: 'The last line has the dual ''appayim'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Prov.xml'
    quote: 'אַ֝פַּ֗יִם'
  - where: 'note 30:33 “Pressing milk, nose and anger”'
    claim: 'BDB: mits is squeezing, pressing; at 30:33 the squeezing of anger is pressure, insistence'
    key: bdb
    url: 'https://biblehub.com/hebrew/4330.htm'
    quote: 'מִיץ noun masculine squeezing, pressing, wringing (3 t.) … the squeezing of milk produceth curd … and the squeezing of the nose produceth blood, and (so) the squeezing of anger (i.e. pressure, insistence) produceth strife.'
  - where: 'note 30:33 “Pressing milk, nose and anger”'
    claim: 'BDB: ''aph is nostril, nose, face, anger; at 30:33 there is a play on the different meanings of ''aph and ''appayim'
    key: bdb
    url: 'https://biblehub.com/hebrew/639.htm'
    quote: 'I. אַף277 noun masculineGenesis 30:2 nostril, nose, face, anger … Proverbs 30:33 (where play upon different meaning of אַף & אַמַּיִם)'
  - where: 'note 30:33 “Pressing milk, nose and anger”'
    claim: 'A modern translation keeps the one verb three times'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+30&version=NRSVUE'
    quote: 'For as pressing milk produces curds and pressing the nose produces blood, so pressing anger produces strife.'
  - where: christ
    claim: 'A modern translation''s cross-references set 30:4 beside John 3:13'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+30&version=NIV'
    quote: 'Proverbs 30:4 : Dt 30:12; Ps 24:1-2; S Pr 8:22-31; Jn 3:13; Eph 4:7-10'
  - where: 'note 30:4 “What is his son''s name”'
    claim: 'One older reading: the questions may point to a Being exalted above all creatures, or ask what man has the ability'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/30.htm'
    quote: 'Either it aims at the answer: No man, but a Being highly exalted above all creatures, so that the question מה־שּׁמו [what his name?] refers to the name of this Being. Or the question is primarily meant of men: What man has the ability? - if there is one, then name him!'
  - where: 'note 30:8 “Neither poverty nor riches”'
    claim: 'The footnote: “food convenient for me” is in Hebrew the bread of my portion, allotted food'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/30?lang=eng'
    quote: '8c “food convenient for me”: HEB bread of my portion; i.e., allotted food.'
  - where: section 5 plain
    claim: 'The footnote at 30:31: “greyhound” is uncertain in the Hebrew, perhaps “warhorse”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/30?lang=eng'
    quote: '31a “greyhound”: Hebrew uncertain; perhaps “warhorse.”'
  - where: 'note 30:19 “The way of a man with a maid”'
    claim: 'The same: verse 20 is an appendix to the numerical proverb'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/30.htm'
    quote: 'This 20th verse does not appear to have been an original part of the numerical proverb, but is an appendix thereto'
