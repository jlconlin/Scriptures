chapter: 8
claims:
  # setting
  - where: setting
    claim: 'A modern translation heads verses 1–21 “The Gifts of Wisdom”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+8&version=NRSVUE'
    quote: 'The Gifts of Wisdom'
  - where: setting
    claim: 'A modern translation heads verses 22–31 “Wisdom’s Part in Creation”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+8&version=NRSVUE'
    quote: 'Wisdom’s Part in Creation'

  # note 8:1
  - where: 'note 8:1 “Wisdom in the open, in the light of day”'
    claim: 'Wisdom calls in dignity and in daylight, contrasted with the woman of chapter 7'
    key: ot-manual-proverbs
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-2?lang=eng'
    quote: 'Wisdom is enthroned and contrasted with the seductive, evil, and death-giving woman of Proverbs 7(see vv. 10–23). In dignity and in the light of day, Wisdom beseeches all to come and partake of her life-giving rewards.'
  - where: 'note 8:1 “Wisdom in the open, in the light of day”'
    claim: 'The strange woman works in secrecy to tear others down; Wisdom calls in public to help the simple'
    key: ot-minute-proverbs-1-9
    url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
    quote: 'Just as the strange woman took action to tear others down in the shadow of secrecy, Lady Wisdom acts by standing and crying in public to those she might help (Proverbs 8:1–3). Rather than prey upon the simple, she finds the simple in order to instruct and help them.'
  - where: 'note 8:1 “Wisdom in the open, in the light of day”'
    claim: 'Chapter 7’s woman meets the young man at night, at the corners (7:9, 12)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/7?lang=eng'
    quote: 'In the twilight, in the evening, in the black and dark night: … Now is she without, now in the streets, and lieth in wait at every corner.'

  # note 8:12
  - where: 'note 8:12 “Witty inventions”'
    claim: 'Webster 1828 gives “witty” the sense judicious, ingenious, inventive'
    key: webster-1828
    url: 'https://webstersdictionary1828.com/Dictionary/witty'
    quote: '2. Judicious; ingenious; inventive.'
  - where: 'note 8:12 “Witty inventions”'
    claim: 'Webster 1828: invention as finding out something new; also discovery, the finding of things hidden'
    key: webster-1828
    url: 'https://webstersdictionary1828.com/Dictionary/invention'
    quote: '1. The action or operation of finding out something new … 8. Discovery; the finding of things hidden or before unknown.'
  - where: 'note 8:12 “Witty inventions”'
    claim: 'BDB: mezimmah at 8:12 is the power of devising, discretion; elsewhere evil devices'
    key: bdb
    url: 'https://biblehub.com/hebrew/4209.htm'
    quote: '2 power of devising, discretion Proverbs 1:4 … דַּעַת מְזִמּוֺת Proverbs 8:12. … 3. a. evil thoughts of men Psalm 10:4, evil devices of men Job 21:27'
  - where: 'note 8:12 “Witty inventions”'
    claim: 'BDB: a man of (evil) devices, Prov. 12:2'
    key: bdb
    url: 'https://biblehub.com/hebrew/4209.htm'
    quote: 'note phrases: מְזִמּוֺת אישׁ a man of (evil) devices (or practices) Proverbs 12:2'
  - where: 'note 8:12 “Witty inventions”'
    claim: 'A modern translation: “I attain knowledge and discretion”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+8&version=NRSVUE'
    quote: '12 I, wisdom, live with prudence, and I attain knowledge and discretion.'
  - where: 'note 8:12 “Witty inventions”'
    claim: 'The Hebrew word behind “witty inventions” is mezimmot (H4209), a plural'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Prov.xml'
    quote: 'מְזִמּ֣וֹת'

  # note 8:17
  - where: 'note 8:17 “Seeking early”'
    claim: 'BDB: shachar, look early, diligently for; originally look for dawn; usually of seeking God earnestly; 8:17 listed'
    key: bdb
    url: 'https://biblehub.com/hebrew/7836.htm'
    quote: 'verb denominative look early, diligently for (late; originally look for dawn)'
  - where: 'note 8:17 “Seeking early”'
    claim: 'BDB: usually of seeking God earnestly, and of seeking wisdom (1:28; 8:17)'
    key: bdb
    url: 'https://biblehub.com/hebrew/7836.htm'
    quote: 'usually of seeking God (׳י) earnestly, Perfect וְשִׁחֲרוּאֵֿל Psalm 78:34 … and, accusative wisdom, Proverbs 1:28, Participle suffix מְשַׁחֲרַי Proverbs 8:17'
  - where: 'note 8:17 “Seeking early”'
    claim: 'A modern translation: “those who seek me diligently find me”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+8&version=NRSVUE'
    quote: '17 I love those who love me, and those who seek me diligently find me.'

  # note 8:22
  - where: 'note 8:22 “Possessed, or created”'
    claim: 'BDB: qanah, get, acquire; of God as originating, creating, Gen. 14:19, 22; Prov. 8:22'
    key: bdb
    url: 'https://biblehub.com/hebrew/7069.htm'
    quote: 'I. קָנָה84 verb get, acquire … a. of God as originating, creating, קֹנֵה שָׁמַיִם וָאָרֶץ Genesis 14:19,22; Deuteronomy 32:6 (Israel), Psalm 139:13 (כִּלְֹיתָ֑י); Proverbs 8:22'
  - where: 'note 8:22 “Possessed, or created”'
    claim: 'The Hebrew verb in 8:22 is qanah (H7069)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Prov.xml'
    quote: 'קָ֭נָ/נִי'
  - where: 'note 8:22 “Possessed, or created”'
    claim: 'Davis: qnh can mean both to acquire and to create; acquiring suggests wisdom as an attribute'
    key: ot-minute-proverbs-1-9
    url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
    quote: 'The word translated as “possessed” (Hebrew root, qnh) has two meanings in Hebrew. It can mean both “to acquire” and “to create.” … To think about God’s acquiring wisdom makes us think about wisdom as merely an attribute that Jehovah got “in the beginning of his way.”'
  - where: 'note 8:22 “Possessed, or created”'
    claim: 'Davis: God models what the reader is asked to do, acquire wisdom and build a household'
    key: ot-minute-proverbs-1-9
    url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
    quote: 'In this way, God models what the reader of Proverbs is asked to do—to “acquire wisdom” (4:5) and to build a household and provide for it through wisdom (24:3–4).'
  - where: 'note 8:22 “Possessed, or created”'
    claim: 'Davis: reading “created” helps see Wisdom metaphorically as an individual'
    key: ot-minute-proverbs-1-9
    url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
    quote: 'Reading Proverbs 8:22 as “the Lord created me in the beginning of his way” helps us see Wisdom metaphorically as an individual rather than just an attribute.'
  - where: 'note 8:22 “Possessed, or created”'
    claim: 'A modern translation: “The Lord created me at the beginning of his work”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+8&version=NRSVUE'
    quote: '22 “The Lord created me at the beginning of his work, the first of his acts of long ago.'
  - where: 'note 8:22 “Possessed, or created”'
    claim: 'The Septuagint (Brenton): “The Lord made me the beginning of his ways”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/proverbs/8.htm'
    quote: '22The Lord made me the beginning of his ways for his works.'
  - where: 'note 8:22 “Possessed, or created”'
    claim: 'Davis: John 1 seems to appeal to the image of wisdom in describing Christ as the Word'
    key: ot-minute-proverbs-1-9
    url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
    quote: 'The apostle John in John 1 seems to appeal to the image of wisdom in describing Jesus Christ as the Word, or Greek logos. … Just as Wisdom was in the beginning with God and was used by God in Creation'
  - where: 'note 8:22 “Possessed, or created”'
    claim: 'Colossians 1:16: by Christ were all things created'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/col/1?lang=eng'
    quote: 'For by him were all things created, that are in heaven, and that are in earth'


  # note 8:30
  - where: 'note 8:30 “Beside him as a master workman”'
    claim: 'BDB: amon at 8:30 is artificer, master-workman; the AV followed “foster-son”'
    key: bdb
    url: 'https://biblehub.com/hebrew/525.htm'
    quote: 'II. אָמוֺן noun masculine artificer, architect, master-workman, as firm and sure in his workman-ship: וָאֶהְיֶה אֶצְלוֺ אָמוֺן I was at his side architect, master-workman (ᵐ5 ᵑ6 ᵑ9 Ges Ew De MV RV, > foster-son AE Ki AV) Proverbs 8:30'
  - where: 'note 8:30 “Beside him as a master workman”'
    claim: 'The Hebrew word is ’amon (H525)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Prov.xml'
    quote: 'אָ֫מ֥וֹן'
  - where: 'note 8:30 “Beside him as a master workman”'
    claim: 'A modern translation: “like a master worker … playing before him always, playing in his inhabited world”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+8&version=NRSVUE'
    quote: '30 then I was beside him, like a master worker, and I was daily his delight, playing before him always, 31 playing in his inhabited world and delighting in the human race.'
  - where: 'note 8:30 “Beside him as a master workman”'
    claim: 'BDB: sachaq, make sport, play; 8:30, 31 listed under make sport'
    key: bdb
    url: 'https://biblehub.com/hebrew/7832.htm'
    quote: '1 make sport, Judges 16:25 (ל person) 2 Samuel 2:14 (לִפְנֵי person; in tournament), Proverbs 8:30 (לִפְנֵי), Proverbs 8:31 ב loc).'
  - where: 'note 8:30 “Beside him as a master workman”'
    claim: 'BDB: the same verb for music and dancing before the LORD and children’s play'
    key: bdb
    url: 'https://biblehub.com/hebrew/7832.htm'
    quote: '3 play: including instrumental music, singing and dancing 1 Samuel 18:7, c ׳לִפְנֵי י. 2 Samuel 6:5 … of children’s sport Zechariah 8:5'
  - where: 'note 8:30 “Beside him as a master workman”'
    claim: 'One older reading: the earth was Wisdom’s dearest delight because it is the abode of man'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/8.htm'
    quote: 'For the earth is the abode of man, and the heart-pleasure of Wisdom was with (את־, prep.) the children of men; with them she found her high enjoyment, these were her peculiar and dearest sphere of activity.'
  - where: 'note 8:30 “Beside him as a master workman”'
    claim: 'The Septuagint (Brenton): “I was by him, suiting myself to him”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/proverbs/8.htm'
    quote: '30I was by him, suiting myself to him, I was that wherein he took delight; and daily I rejoiced in his presence continually.'

  # note 8:34
  - where: 'note 8:34 “Waiting at Wisdom’s doors”'
    claim: 'One older reading: the plural doors suggest a palace or temple; the man stays near the entrance so as not to miss its opening'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/8.htm'
    quote: 'are amplifying plurs. of extension, suggesting the idea of a palace or temple; מזוּזת … is intended to indicate that he to whom the discourse refers holds himself in closest nearness to the entrance, that he might not miss the moment when it is opened'
  - where: 'note 8:34 “Waiting at Wisdom’s doors”'
    claim: 'One older reading: the verb means watching as a condition willingly maintained'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/8.htm'
    quote: 'שׁקד signifies watching as a condition, and that as one which a person willingly maintains'

  # note 8:35
  - where: 'note 8:35 “The life Wisdom gives”'
    claim: 'Davis: to be truly alive is right relationship; hating wisdom is being spiritually dead'
    key: ot-minute-proverbs-1-9
    url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
    quote: 'This is how the world that God created should work, and this is what it means to be truly alive, or as Wisdom tells us, “Whoso findeth me findeth life” (verse 35). … This kind of behavior is what it means to be physically alive but spiritually dead'
  - where: 'note 8:35 “The life Wisdom gives”'
    claim: 'Von Feldt: most commentators read the long life as mortal; Nephi shows eternal life is promised'
    key: von-feldt-instructional-wisdom
    url: 'https://interpreterfoundation.org/journal/his-secret-is-with-the-righteous-instructional-wisdom-in-the-book-of-mormon'
    quote: 'the length of days that wisdom promises (Proverbs 3:2, 16; see 8:34–35 and 9:11) refers to a long mortal life. Nephi’s teachings, though, make it clear that on a deeper level, what is promised is eternal life.'
  - where: 'note 8:35 “The life Wisdom gives”'
    claim: 'Von Feldt cites 2 Nephi 31:18 and calls Proverbs 1–9 counsel of eternal import'
    key: von-feldt-instructional-wisdom
    url: 'https://interpreterfoundation.org/journal/his-secret-is-with-the-righteous-instructional-wisdom-in-the-book-of-mormon'
    quote: 'Most explicitly, Nephi in his final testament says that the “straight and narrow path . . . leads to eternal life” (2 Nephi 31:18 … It is increasingly clear that Proverbs 1–9 is hardly mundane, practical advice but rather counsel of eternal import.'
  - where: 'note 8:35 “The life Wisdom gives”'
    claim: 'BDB: chata, first sense miss; at 8:36 the one missing Wisdom wrongs himself, opposed to the one finding her'
    key: bdb
    url: 'https://biblehub.com/hebrew/2398.htm'
    quote: '1 miss: … חֹטְאִי חֹמֵסנַפְשׁוֺ Proverbs 8:36 the one missing me (Wisdom) is one wronging himself (opposed to מֹצְאִי)'
  - where: 'note 8:35 “The life Wisdom gives”'
    claim: 'A modern translation of 8:36: “those who miss me injure themselves”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+8&version=NRSVUE'
    quote: '36 but those who miss me injure themselves; all who hate me love death.”'

  # christ
  - where: christ
    claim: 'Scripture: Christ the wisdom of God; life eternal is to know God and Jesus Christ'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/17?lang=eng'
    quote: 'And this is life eternal, that they might know thee the only true God, and Jesus Christ, whom thou hast sent.'
