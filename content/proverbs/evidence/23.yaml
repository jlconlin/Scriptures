    claim: 'Modern translations render the man with an evil eye as stingy or a begrudging host'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+23&version=NRSVUE'
    quote: 'Do not eat the bread of the stingy;'
