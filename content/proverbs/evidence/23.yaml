  - where: 'note 23:20 “The drunkard and the glutton”'
    claim: 'One older reading: Deut. 21:20 describes the rebellious son with the same two words, which the proverb distributes between its lines'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/23.htm'
    quote: 'The degenerate and perverse son is more clearly described, Deuteronomy 21:20, as זולל וסבא. These two characteristics the poet distributes between 20a and 20b.'
