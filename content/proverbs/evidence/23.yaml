    claim: 'BDB: sha''ar means calculate, reckon; 23:7 “as he has calculated in his soul, so is he,” marked dubious'
    key: bdb
    url: 'https://biblehub.com/hebrew/8176.htm'
    quote: 'Proverbs 23:7 as he has calculated in his soul, so is he, but dubious'
  - where: 'note 23:7 “As he thinketh”'
    claim: 'BDB gloss: calculate, reckon'
    key: bdb
    url: 'https://biblehub.com/hebrew/8176.htm'
    quote: 'II. שָׁעַר verb calculate, reakon'
