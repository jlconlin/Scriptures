chapter: 23
claims:
  - where: setting
    claim: 'The section called “Words of the Wise” is 22:17–24:22'
    key: ot-minute-proverbs
    url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-overview'
    quote: 'The section called “Words of the Wise” (Proverbs 22:17–24:22) is thought to have been influenced by an earlier Egyptian text called “The Instructions of Amenemope.”'
  - where: setting
    claim: 'A modern translation numbers the sayings; in chapter 23 they begin with Saying 7 and end with Saying 19'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+23&version=NIV'
    quote: 'Saying 7 When you sit to dine with a ruler'
  - where: setting
    claim: 'The last saying numbered in chapter 23 is Saying 19, the poem on wine (23:29–35)'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+23&version=NIV'
    quote: 'Saying 19 29 Who has woe? Who has sorrow?'
  - where: setting
    claim: 'Verse 12 begins a subsection of the Words of the Wise with the call to apply the heart'
    key: sc-knowhy-644
    url: 'https://scripturecentral.org/knowhy/what-does-it-mean-to-apply-your-heart-to-understanding'
    quote: 'Proverbs 23:12 begins a subsection within that unit with another exhortation to “apply thine heart unto instruction, and thine ears to the words of knowledge.”'

