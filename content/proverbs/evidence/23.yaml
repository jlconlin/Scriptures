    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+23&version=NRSVUE'
    quote: 'for like a hair in the throat, so are they.'
  - where: 'note 23:7 “As he thinketh”'
    claim: 'The NRSVue footnote: meaning of Hebrew uncertain at 23:7'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+23&version=NRSVUE'
    quote: '23.7 Meaning of Heb uncertain'
  - where: 'note 23:7 “As he thinketh”'
    claim: 'President Romney quoted 23:7 for the principle that a person gravitates toward his thoughts'
    key: romney-book-of-mormon-1980
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1980/04/the-book-of-mormon?lang=eng'
    quote: 'Inevitably he gravitates toward the subjects of his thoughts. Ages ago the wise man thus succinctly stated this great truth: “As he thinketh in his heart, so is he” (Prov. 23:7).'
  - where: 'note 23:7 “As he thinketh”'
    claim: 'Romney: keep true and righteous principles in our minds and our children’s'
    key: romney-book-of-mormon-1980
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1980/04/the-book-of-mormon?lang=eng'
    quote: 'we must keep in our minds and in their minds true and righteous principles for our thoughts and their thoughts to dwell upon.'
  - where: 'note 23:7 “As he thinketh”'
    claim: 'Romney gave this as a reason to read the Book of Mormon, which fills the mind'
    key: romney-book-of-mormon-1980
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1980/04/the-book-of-mormon?lang=eng'
    quote: 'There is another reason why we should read the Book of Mormon: By doing so we will fill and refresh our minds'

  - where: 'note 23:11 “The Redeemer of the fatherless”'
