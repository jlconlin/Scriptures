  - where: 'note 23:2 “A knife to the throat”'
    claim: 'One older reading: putting a knife to the throat is a proverbial expression for restraining desire as if under threat of death'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/23.htm'
    quote: 'the poet means to say: restrain thy too eager desire by means of the strongest threatening of danger - threaten as it were death to it'
  - where: 'note 23:2 “A knife to the throat”'
    claim: 'A modern translation: if you are given to gluttony'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+23&version=NIV'
    quote: 'if you are given to gluttony.'
  - where: 'note 23:2 “A knife to the throat”'
    claim: 'One older reading: the ruler is not the guest’s equal, but one who can destroy as well as help him'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/23.htm'
    quote: 'he is not thine equal, but one higher, who can destroy thee as well as be useful to thee'
  - where: 'note 23:2 “A knife to the throat”'
    claim: 'One older reading: the deceitful food seems to secure a prince’s favor and often deceives the eater'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/23.htm'
    quote: 'food which, as it were, deceives him who eats it, i.e., appears to secure for him the lasting favour of princes, and often enough herein deceives him'

  - where: 'note 23:5 “Riches with wings”'
    claim: 'A modern translation of the first line: when your eyes light upon it, it is gone'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+23&version=NRSVUE'
    quote: 'When your eyes light upon it, it is gone,'
