chapter: 10
claims:
  - where: setting
    claim: 'On one Latter-day Saint reading, 10:1–22:16 has 375 lines in Hebrew, the numerical value of the name Solomon, evidence of deliberate crafting'
    key: ot-minute-proverbs
    url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-overview'
    quote: 'This section is 375 lines in the Hebrew text and corresponds to its heading found in Proverbs 10:1. Hebrew letters developed a numerical value, and the name Solomon in Hebrew adds up to 375 … This is good evidence that this section was deliberately crafted.'
  - where: setting
    claim: 'Chapters 1–9 are larger connected discourses; the collection from 10:1 is of separate sayings'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/10.htm'
    quote: 'In the introduction, chap. 1-9, there are larger sections of interconnected thoughts having one common aim.'
  - where: setting
    claim: 'The collection from 10:1 is of two-line sayings, mostly antithetical'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/10.htm'
    quote: 'the Solomonic collection which now follows consists of pure distichs, for the most part antithetical'
  - where: setting
    claim: 'Antithetical parallelism is two lines set in contrast; Proverbs 10:7 is an example'
    key: parry-antithetical
    url: 'https://rsc.byu.edu/preserved-translation/antithetical-parallelism'
    quote: 'Antithetical parallelism generally consists of two lines and is characterized by an opposition or contrast of thoughts (that is, an antithesis) between two lines.'
  - where: setting
    claim: 'Proverbs 10:7 used as an example of antithetical parallelism'
    key: parry-antithetical
    url: 'https://rsc.byu.edu/preserved-translation/antithetical-parallelism'
    quote: 'but the name of the wicked shall rot. (Proverbs 10:7)'
  - where: setting
    claim: 'Proverbs is built on the assumption that proper action leads to proper outcomes'
    key: ot-minute-proverbs
    url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-overview'
    quote: 'The book of Proverbs is built on the assumption that proper action will lead to proper outcomes.'
  - where: setting
    claim: 'Ecclesiastes, which follows Proverbs, seems to say it is not that simple'
    key: cfm-ot-2026-37
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/37?lang=eng'
    quote: 'Its main message is that if you seek wisdom—especially God’s wisdom—life will go well. But Proverbs is followed by the book of Ecclesiastes, which seems to say, “It’s not that simple.”'

  - where: thread
    claim: 'The collector joined proverbs by common characteristics, in groups; the order follows no systematic scheme'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/10.htm'
    quote: 'the collector has connected together proverb with proverb according to certain common characteristics (Bertheau). … the progressive unfolding follows no systematic scheme'
  - where: thread
    claim: 'Verses 2ff. place possessions under a moral-religious point of view'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/10.htm'
    quote: 'There follows now a series of proverbs which place possessions and goods under a moral-religious point of view:'
  - where: thread
    claim: 'From verse 8 a series on sins of the mouth and their contrary'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/10.htm'
    quote: 'There follows now a series of proverbs in which reference to sins of the mouth and their contrary prevails:'
  - where: thread
    claim: 'From verse 25 a series on the immoveable continuance of the righteous, broken by one dissimilar proverb'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/10.htm'
    quote: 'There now follows a series of proverbs, broken by only one dissimilar proverb, on the immoveable continuance of the righteous:'

  - where: 'section 1 plain'
    claim: 'Verse 3b: the LORD thwarts or disappoints the craving of the wicked (KJV “substance”)'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+10&version=NRSVUE'
    quote: 'but he thwarts the craving of the wicked.'
  - where: 'section 1 plain'
    claim: 'The Hebrew of 3b means desire, which God pushes back'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/10.htm'
    quote: 'But the craving of the godless He disappointeth.'
  - where: 'section 2 plain'
    claim: 'Verse 9b: he will be found out; verse 10a: winking causes trouble'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+10&version=NRSVUE'
    quote: 'but whoever follows perverse ways will be found out. 10 Whoever winks the eye causes trouble,'
  - where: 'section 2 plain'
    claim: 'Winking is the conduct of the malicious, aimed at derision or injury'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/10.htm'
    quote: 'as the conduct of the malicious or malignant, which aims at the derision or injury of him to whom it refers, vid., under Proverbs 6:13'
  - where: 'section 5 plain'
    claim: 'Verse 22b can be rendered “toil adds nothing to it”; verse 23b “wise conduct is pleasure”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+10&version=NRSVUE'
    quote: 'and toil adds nothing to it.(P) 23 Doing wrong is like sport to a fool, but wise conduct is pleasure to a person of understanding.'
  - where: 'section 6 plain'
    claim: 'Verse 25: when the storm passes; verse 29: the way of the LORD is a stronghold'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+10&version=NRSVUE'
    quote: '25 When the tempest passes, the wicked are no more, but the righteous are established forever.'
  - where: 'section 6 plain'
    claim: 'Verse 29: a stronghold for the upright'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+10&version=NRSVUE'
    quote: '29 The way of the Lord is a stronghold for the upright'

  - where: 'note 10:2 “Delivered from death”'
    claim: 'A modern translation: treasures gained by wickedness'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+10&version=NRSVUE'
    quote: '2 Treasures gained by wickedness do not profit, but righteousness delivers from death.'

  - where: 'note 10:6 “The same line twice”'
    claim: 'The line can be read: the mouth of the wicked hides violence, or violence covers the mouth of the wicked and falls back on it'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/10.htm'
    quote: 'the mouth of the wicked covers (hides under a mask) violence … it is preserved if we interpret וּפי as object: the violence that has gone out from it covereth the mouth of the wicked, i.e., it falls back upon his foul mouth'
  - where: 'note 10:6 “The same line twice”'
    claim: 'Repeated parts of proverbs often change meaning'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/10.htm'
    quote: 'parts of proverbs repeating themselves in the Book of Proverbs often show a change of the meaning'
  - where: 'note 10:6 “The same line twice”'
    claim: 'At verse 11 the mouth of the wicked conceals wrong with deceitful words'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/10.htm'
    quote: 'the mouth of the godless covereth wrong (violentiam), i.e., conceals with deceitful words the intention, directed not to that which is best, but to the disadvantage and ruin of his neighbours'
  - where: 'note 10:6 “The same line twice”'
    claim: 'A modern translation reads both verses “conceals violence”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+10&version=NRSVUE'
    quote: 'but the mouth of the wicked conceals violence.(E)'

  - where: 'note 10:8 “A prating fool”'
    claim: 'To prate is to talk much and to little purpose'
    key: webster-1828
    url: 'https://webstersdictionary1828.com/Dictionary/prate'
    quote: 'PRATE, verb intransitive To talk much and without weight, or to little purpose; to be loquacious'
  - where: 'note 10:8 “A prating fool”'
    claim: 'A modern translation: one with foolish lips will come to ruin; at verse 10 it follows the Greek second line'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+10&version=NRSVUE'
    quote: 'but one with foolish lips will come to ruin.(G)'
  - where: 'note 10:8 “A prating fool”'
    claim: 'At verse 10 a modern translation reads “one who rebukes boldly makes peace”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+10&version=NRSVUE'
    quote: 'but one who rebukes boldly makes peace.(I)'
  - where: 'note 10:8 “A prating fool”'
    claim: 'The Septuagint has a different second line at verse 10'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/proverbs/10.htm'
    quote: 'He that winks with his eyes deceitfully, procures griefs for men; but he that reproves boldly is a peacemaker.'
  - where: 'note 10:8 “A prating fool”'
    claim: 'The verb (Niphal) means to be thrust down, i.e. ruined, in Prov. 10:8, 10'
    key: bdb
    url: 'https://biblehub.com/hebrew/3832.htm'
    quote: 'Niph`al Imperfect be thrust down, away, i.e. ruined'

  - where: 'note 10:12 “Love covereth all sins”'
    claim: 'Love covers sins by pardoning, concealing, excusing or restraining them (one older reading)'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/10.htm'
    quote: 'by pardoning them, concealing them, excusing them, if possible, with mitigating circumstances, or restraining them before they are executed'
  - where: 'note 10:12 “Love covereth all sins”'
    claim: 'The sins covered are the neighbour’s, not the lover’s'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/10.htm'
    quote: 'the multitudo peccatorum is not meant of the sins of him who cherishes love, but of the sins of the neighbour'
  - where: 'note 10:12 “Love covereth all sins”'
    claim: 'James 5:20 gives the line another rendering: love covers sins from the eyes of a holy God'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/10.htm'
    quote: 'James, however, gives it, James 5:20, another rendering: love covers them, viz., from the eyes of a holy God'
  - where: 'note 10:12 “Love covereth all sins”'
    claim: 'Peter and James render the line, unlike the Septuagint, which mistranslates it'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/10.htm'
    quote: 'The lxx improperly translate πάντας δὲ τοὺς μὴ φιλονεικοῦντας κελόπτει φιλία; but Peter (1 Peter 4:8) as well as James, but none of the Greek versions'
  - where: 'note 10:12 “Love covereth all sins”'
    claim: 'The Church’s footnote gives the JST of 1 Peter 4:8: charity preventeth a multitude of sins'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-pet/4?lang=eng'
    quote: 'for charity preventeth a multitude of sins.'
  - where: 'note 10:12 “Love covereth all sins”'
    claim: 'The footnote at James 5:20 “hide” points to the JST of 1 Peter 4:8'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/james/5?lang=eng'
    quote: 'See JST 1 Pet. 4:8 (1 Pet. 4:8 note a).'

  - where: 'note 10:22 “No sorrow, or no toil”'
    claim: 'The Hebrew noun means pain, hurt, toil; BDB lists Prov. 10:22 under “pain” with Gen. 3:16'
    key: bdb
    url: 'https://biblehub.com/hebrew/6089.htm'
    quote: 'I. עֶ֫צֶב noun [masculine] pain, hurt, toil; — … 1 ׳ע pain Genesis 3:16 (of travail), Proverbs 10:22.'
  - where: 'note 10:22 “No sorrow, or no toil”'
    claim: 'A modern translation reads “toil adds nothing to it”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+10&version=NRSVUE'
    quote: '22 The blessing of the Lord makes rich, and toil adds nothing to it.(P)'
  - where: 'note 10:22 “No sorrow, or no toil”'
    claim: 'Another modern translation gives “toil adds nothing to it” in its margin'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+10&version=ESV'
    quote: 'Proverbs 10:22 Or and toil adds nothing to it'
  - where: christ
    claim: 'Verse 25 recalls the close of the Sermon on the Mount (one older reading)'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/10.htm'
    quote: 'The proverb reminds us of the close of the Sermon on the Mount'
  - where: christ
    claim: 'The Savior gave the same sermon, with the parable of the house on the rock, to the Nephites (3 Nephi 14)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/14?lang=eng'
    quote: 'Therefore, whoso heareth these sayings of mine and doeth them, I will liken him unto a wise man, who built his house upon a rock—'
