chapter: 27
claims:
  - where: setting
    claim: 'Proverbs 22:3, which verse 12 repeats almost word for word'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/22?lang=eng'
    quote: 'A prudent man foreseeth the evil, and hideth himself; but the simple pass on, and are punished.'
  - where: setting
    claim: 'Verse 13 repeats the surety saying of 20:16 (the Church footnote)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/27?lang=eng'
    quote: '“garment”: Prov. 20:16.'
  - where: setting
    claim: 'One older reading: verse 15 expands 19:13 into a full verse'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/27.htm'
    quote: 'In Proverbs 27:15, Proverbs 19:13 is expanded into a distich, and made a complete verse.'
  - where: setting
    claim: 'The first line of verse 21 repeats 17:3'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/27.htm'
    quote: 'In line first, Proverbs 17:3 is repeated'
  - where: setting
    claim: 'The Church footnote at verse 1 points to James 4:13–14'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/27?lang=eng'
    quote: '“morrow”: James 4:13 (13–14).'
  - where: setting
    claim: 'Verses 23–27 are a short poem (a Mashal-ode)'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/27.htm'
    quote: 'It is one of the Mashal-odes spoken of vol. i. p. 12. It consists of 11 equals 4 + 7 lines.'

  - where: thread
    claim: 'One older reading: verses 1–6 go in pairs, the first against boasting'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/27.htm'
    quote: 'In the group Proverbs 27:1-6 of this chapter every two proverbs form a pair. The first pair is directed against unseemly boasting:'
  - where: thread
    claim: 'The third pair (verses 5–6) is on friends'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/27.htm'
    quote: 'The third pair of proverbs passes over from this special love between husband and wife to that subsisting between friends:'
  - where: thread
    claim: 'The poem of 23–27 concludes the series'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/27.htm'
    quote: 'forms the conclusion of the foregoing series of proverbs, in which we cannot always discern an intentional grouping.'

  - where: section 1 plain
    claim: 'Anger in verse 4 is “overwhelming” in a modern translation'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+27&version=NRSVUE'
    quote: 'Wrath is cruel, anger is overwhelming,'
  - where: section 1 plain
    claim: 'The enemy’s kisses of verse 6 are many (“profuse”)'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+27&version=NRSVUE'
    quote: 'but profuse are the kisses of an enemy.'
  - where: section 2 plain
    claim: 'The Church footnote at verse 10 points to 18:24'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/27?lang=eng'
    quote: '“neighbour”: Prov. 18:24. TG Neighbor.'
  - where: section 3 plain
    claim: 'The “strange woman” of verse 13 may be read as a foreign woman'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/27?lang=eng'
    quote: '“strange woman”: OR foreign woman.'
  - where: section 3 plain
    claim: 'Verse 16 read as holding back the wind or gripping oil'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+27&version=NRSVUE'
    quote: 'to restrain her is to restrain the wind or to grasp oil in the right hand.'
  - where: section 4 plain
    claim: 'Hell in verse 20 is the place of the dead'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/27?lang=eng'
    quote: '“Hell”: IE The spirit world, place of the dead, is never filled up.'
  - where: section 4 plain
    claim: 'A man is tested by the praise he receives (verse 21)'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+27&version=NRSVUE'
    quote: 'so a person is tested by being praised.'
  - where: section 4 plain
    claim: '“Bray” in verse 22 means pound'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/27?lang=eng'
    quote: '“bray”: OR pound, rub.'

  - where: explore
    claim: 'One older reading sets Luke 12:20 beside verse 1'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/27.htm'
    quote: 'One boasts of to-morrow when he boasts of that which he will then do and experience. This boasting is foolish and presumptuous (Luke 12:20), for the future is God''s; not a moment of the future is in our own power'
  - where: setting
    claim: 'James 4:15 tells how to make plans'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/james/4?lang=eng'
    quote: 'For that ye ought to say, If the Lord will, we shall live, and do this, or that.'

  - where: 'note 27:6 “The wounds of a friend and the kisses of an enemy”'
    claim: 'A modern translation: “Well meant are the wounds”; “profuse are the kisses”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+27&version=NRSVUE'
    quote: 'Well meant are the wounds a friend inflicts, but profuse are the kisses of an enemy.'
  - where: 'note 27:6 “The wounds of a friend and the kisses of an enemy”'
    claim: '“Faithful” means true, honourable'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/27.htm'
    quote: 'The contrast to נאמנים, true, i.e., honourable and good (with the transference of the character of the person to his act)'
  - where: 'note 27:6 “The wounds of a friend and the kisses of an enemy”'
    claim: 'One older reading weighs meanings and takes “to heap up”: the kisses are too abundant, to veil hatred'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/27.htm'
    quote: '(c) to heap up … This third meaning gives to the kisses of an enemy a natural adjective: they are too abundant, so much the more plentiful to veil over the hatred, like the kisses by means of which Judas betrayed his Lord, not merely denoted by φιλεῖν, but by καταφιλεῖν, Matthew 26:49.'
  - where: 'note 27:6 “The wounds of a friend and the kisses of an enemy”'
    claim: 'Verse 5 as the chapter has it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/27?lang=eng'
    quote: 'Open rebuke is better than secret love.'
  - where: 'note 27:6 “The wounds of a friend and the kisses of an enemy”'
    claim: 'One older reading of verse 5: better open correction than love never shown in act'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/27.htm'
    quote: 'it is better to be courageously and sternly corrected - on account of some fault committed - by any one, whether he be a foe or a friend, than to be the object of a love which may exist indeed in the heart, but which fails to make itself manifest in outward act.'
  - where: 'note 27:14 “A blessing too loud and too early”'
    claim: 'One older reading: the loud early blessing is the flatterer’s, to gain favour'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/27.htm'
    quote: 'The first line is intentionally very heavy, in order to portray the empressement of the maker of compliments: he calls out to another his good wishes with a loud voice, so as to make the impression of deep veneration'
  - where: 'note 27:14 “A blessing too loud and too early”'
    claim: 'In reality to gain favour; rising early to offer his bid for goodwill'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/27.htm'
    quote: 'but in reality to gain favour thereby, and to commend himself to greater acts of kindness; he sets himself to meet him, having risen up (השׁכּים, adverbial inf. abs.; cf. Jeremiah 44:4 with Jeremiah 25:4) early in the morning, to offer his captatio benevolentiae as speedily as possible'
  - where: 'note 27:14 “A blessing too loud and too early”'
    claim: 'The blessing is reckoned a curse before God and every one who judges human nature rightly, as a sign of a selfish, calculating soul'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/27.htm'
    quote: 'the affected zeal in presenting which is a sign of a selfish, calculating, servile soul, is reckoned to him as קללה, viz., before God and every one who can judge correctly of human nature'
  - where: 'note 27:14 “A blessing too loud and too early”'
    claim: 'The saying, passing over three, connects with verses 9–10'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/27.htm'
    quote: 'This proverb, passing over the three immediately intervening, connects itself with Proverbs 27:9 and Proverbs 27:10.'
  - where: 'note 27:14 “A blessing too loud and too early”'
    claim: 'Septuagint: shall seem to differ nothing from one who curses'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/proverbs/27.htm'
    quote: 'Whosoever shall bless a friend in the morning with a loud voice, shall seem to differ nothing from one who curses him.'

  - where: 'note 27:16 “Holding the wind, and oil in the hand”'
    claim: '“Bewray” means to betray, disclose, show; Matt. 26:73'
    key: webster-1828
    url: 'https://webstersdictionary1828.com/Dictionary/bewray'
    quote: 'BEWRA''Y, verb transitive beray. To disclose perfidiously; to betray; to show or make visible. Thy speech bewrayeth thee. Matthew 26:73.'
  - where: 'note 27:16 “Holding the wind, and oil in the hand”'
    claim: 'A modern translation: meaning uncertain; restrain the wind, grasp oil'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+27&version=NRSVUE'
    quote: '27.16 Meaning of Heb uncertain'
  - where: 'note 27:16 “Holding the wind, and oil in the hand”'
    claim: 'The modern translation’s reading of verse 16'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+27&version=NRSVUE'
    quote: 'to restrain her is to restrain the wind or to grasp oil in the right hand.'
  - where: 'note 27:16 “Holding the wind, and oil in the hand”'
    claim: 'The Septuagint reads the north wind'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/proverbs/27.htm'
    quote: 'The north wind is sharp, but it is called by name propitious.'
  - where: 'note 27:16 “Holding the wind, and oil in the hand”'
    claim: 'The footnotes at verse 15 point to 19:13 and 21:19'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/27?lang=eng'
    quote: '“continual”: Prov. 19:13. … “contentious”: Prov. 21:19; 3 Ne. 11:29.'

  - where: 'note 27:17 “Iron sharpens iron”'
    claim: 'A modern translation: “wits”, with the note that the Hebrew is “face”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+27&version=NRSVUE'
    quote: 'and one person sharpens the wits of another. … 27.17 Heb face'
  - where: 'note 27:17 “Iron sharpens iron”'
    claim: 'Septuagint keeps the countenance'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/proverbs/27.htm'
    quote: 'Iron sharpens iron; and a man sharpens his friend''s countenance.'

  - where: 'note 27:19 “A face in the water”'
    claim: 'A modern translation: one heart reflects another'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+27&version=NRSVUE'
    quote: 'Just as water reflects the face, so one human heart reflects another.'
  - where: 'note 27:19 “A face in the water”'
    claim: 'The Septuagint reads the opposite'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/proverbs/27.htm'
    quote: 'As faces are not like other faces, so neither are the thoughts of men.'

  - where: 'note 27:21 “Tried by praise”'
    claim: 'A modern translation supplies “is tested”, which the Hebrew lacks'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+27&version=NRSVUE'
    quote: 'so a person is tested by being praised. … 27.21 Heb lacks is tested'
  - where: 'note 27:21 “Tried by praise”'
    claim: 'Proverbs 17:3, whose first line verse 21 shares'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/17?lang=eng'
    quote: 'The fining pot is for silver, and the furnace for gold: but the Lord trieth the hearts.'
  - where: 'note 27:21 “Tried by praise”'
    claim: 'Septuagint: tried by the mouth of them that praise him'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/proverbs/27.htm'
    quote: 'Fire is the trial for silver and gold; and a man is tried by the mouth of them that praise him.'
  - where: 'note 27:23 “The flock outlasts the crown”'
    claim: 'One older reading: an exhortation to rural industry, concluding the series'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/27.htm'
    quote: 'An exhortation to rural industry, and particularly to the careful tending of cattle for breeding, forms the conclusion of the foregoing series of proverbs'
  - where: 'note 27:23 “The flock outlasts the crown”'
    claim: '“State” is the sheep’s appearance'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/27.htm'
    quote: 'here, the appearance which the sheep present; thus their condition as seen externally.'
  - where: 'note 27:23 “The flock outlasts the crown”'
    claim: 'The crown is the mark of royal or princely dignity'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/27.htm'
    quote: 'but נזר is always the mark of royal, and generally of princely dignity, and here denotes, per meton. signi pro re signata, that dignity itself.'
  - where: 'note 27:23 “The flock outlasts the crown”'
    claim: 'The reason, in another scholar’s words: money and honour are more easily lost than husbandry'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/27.htm'
    quote: 'Rightly Fleischer: "ready money, moveable property, and on the other hand the highest positions of honour, are far more easily torn away from a man, and secure to him far less of quiet prosperity, than husbandry'
  - where: 'note 27:23 “The flock outlasts the crown”'
    claim: 'Verses 25–27: when the hay and herbage are in, the stock provides; goats sold for money'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/27.htm'
    quote: 'and these will yield for thee, partly immediately and partly by the money derived therefrom (viz., from the valuable goats not needed for the flocks), all that is needful for thy life.'
  - where: 'note 27:23 “The flock outlasts the crown”'
    claim: 'The husbandman guaranteed against the future by his stock'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/27.htm'
    quote: 'when thus the barns are filled with plenty, the husbandman is guaranteed against the future on all sides by his stock of cattle.'

  - where: christ
    claim: 'The Church footnotes at “kisses” and “wounds” point to Luke 22:48 and D&C 121:43–44'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/27?lang=eng'
    quote: '“wounds”: Ps. 141:5; D&C 121:43 (43–44). … “kisses”: 2 Sam. 20:9; Luke 22:48 (47–48).'
  - where: christ
    claim: 'Judas was one of the Twelve'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/22?lang=eng'
    quote: 'he that was called Judas, one of the twelve, went before them, and drew near unto Jesus to kiss him.'

  - where: explore
    claim: 'The Church footnote at verse 23 points to Alma 5'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/27?lang=eng'
    quote: '“flocks”: Alma 5:59 (37–60); D&C 20:53 (38–60).'
