chapter: 11
claims:
  - where: setting
    claim: 'One older reading: each proverb of 10:1–22:16 is a finished whole, grouped without a comprehensive plan'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/1.htm'
    quote: 'The 375 proverbs which are classed together in this part, chap. 10-22:16, without any comprehensive plan, but only according to their more or fewer conspicuous common characteristics … each is in itself a small perfected and finished whole.'
  - where: setting
    claim: 'The Greek translation of the last verse, whose words 1 Pet. 4:18 has nearly word for word'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/proverbs/11.htm'
    quote: '31If the righteous scarcely be saved, where shall the ungodly and the sinner appear?'
  - where: thread
    claim: 'No proverb of 10:1–22:16 stands in necessary connection with the one before or after it'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/1.htm'
    quote: 'nowhere (not even Proverbs 19:19) does such a distich proverb stand in necessary connection with one that precedes or that follows; each is in itself a small perfected and finished whole.'
  - where: section 4 plain
    claim: '11:31 argues from the lesser to the greater: if the righteous are repaid on earth, how much more the wicked'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+11&version=NRSVUE'
    quote: '31 If the righteous are repaid on earth, how much more the wicked and the sinner!'

  - where: 'note 11:14 “Counsellors in a presidency”'
    claim: 'Prov. 24:6 repeats the line of 11:14 of war'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/24?lang=eng'
    quote: 'For by wise counsel thou shalt make thy war: and in multitude of counsellors there is safety.'
  - where: 'note 11:14 “Counsellors in a presidency”'
    claim: 'President Hinckley quoted 11:14 of the counselors in a presidency'
    key: hinckley-counsellors
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1990/10/in-counsellors-there-is-safety?lang=eng'
    quote: 'Such a partnership provides a safety valve. The wise writer of Proverbs tells us that “in … counsellors there is safety” (Prov. 11:14). When problems arise, when difficult decisions face us, it is wonderful to have those with whom we can talk with confidence and trust.'
  - where: 'note 11:14 “Counsellors in a presidency”'
    claim: 'Hinckley: a counselor is a partner; all three in a presidency share responsibility'
    key: hinckley-counsellors
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1990/10/in-counsellors-there-is-safety?lang=eng'
    quote: 'A counselor is a partner. A presidency can be a wonderful relationship, a friendship where three brethren, working unitedly, have a close and satisfying fellowship.'

  - where: 'note 11:16 “A gracious woman, and ruthless men”'
    claim: 'The word rendered “strong men” is ʿārîṣîm (Strong’s H6184)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Prov.xml'
    quote: 'עָרִיצִ֗ים'
  - where: 'note 11:16 “A gracious woman, and ruthless men”'
    claim: 'BDB: ʿārîṣ is awe-inspiring, terror-striking; in late use, of the wicked in general, as ruthless (Prov. 11:16 among them)'
    key: bdb
    url: 'https://biblehub.com/hebrew/6184.htm'
    quote: 'עָרִיץ adjective awe-inspiring, terror-striking; … late, of wicked in general, as ruthless'
  - where: 'note 11:16 “A gracious woman, and ruthless men”'
    claim: 'The Greek translation has four lines at 11:16'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/proverbs/11.htm'
    quote: '16A gracious wife brings glory to her husband: but a woman hating righteousness is a theme of dishonour. The slothful come to want: but the diligent support themselves with wealth.'
  - where: 'note 11:16 “A gracious woman, and ruthless men”'
    claim: 'A modern translation prints four lines, with “the aggressive” for the second group'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+11&version=NRSVUE'
    quote: '16 A gracious woman gets honor, but she who hates virtue is covered with shame. The timid become destitute, but the aggressive gain riches.'
  - where: 'note 11:16 “A gracious woman, and ruthless men”'
    claim: 'The modern translation supplies the two lines the Hebrew lacks from the Greek'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+11&version=NRSVUE'
    quote: '11.16 Gk: Heb lacks The timid . . . destitute'

  - where: 'note 11:22 “A gold ring in a pig’s snout”'
    claim: 'The “jewel” is nezem, a nose-ring, a woman’s ornament, as in Gen. 24:47 and Isa. 3:21'
    key: bdb
    url: 'https://biblehub.com/hebrew/5141.htm'
    quote: '1 nose-ring (Syriac ) woman''s ornament, עַלאַֿמָּהּ ׳נ Genesis 24:47 compare Genesis 24:22; Genesis 24:30 (J); נִזְמֵי הָאָף Isaiah 3:21'
  - where: 'note 11:22 “A gold ring in a pig’s snout”'
    claim: 'Gen. 24:47 has the same word nezem (the KJV’s “earring”)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'נֶּ֨זֶם֙'
  - where: 'note 11:22 “A gold ring in a pig’s snout”'
    claim: 'Nose jewels were common; a jewel in a swine’s snout was unthinkable because swine were held in contempt; the proverb dismisses beauty without self-control and righteousness'
    key: ot-manual-proverbs
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-2?lang=eng'
    quote: 'Nose jewels were a common adornment for the women of Israel and surrounding cultures, but a jewel in a swine’s snout was unthinkable because swine were held in such contempt among the Israelites. This proverb thus dismisses the value of physical beauty when it is not accompanied with self-control and righteousness.'

  - where: 'note 11:30 “He that winneth souls”'
    claim: '“Winneth” in 11:30 is lōqēaḥ, “taking” (lemma 3947)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Prov.xml'
    quote: 'לֹקֵ֖חַ'
  - where: 'note 11:30 “He that winneth souls”'
    claim: '“Souls” in 11:30 is nəp̄āšôt (lemma 5315)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Prov.xml'
    quote: 'נְפָשׂ֣וֹת'
  - where: 'note 11:30 “He that winneth souls”'
    claim: 'Prov. 1:19 “taketh away the life” uses the same verb with nefesh'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Prov.xml'
    quote: 'יִקָּֽח'
  - where: 'note 11:30 “He that winneth souls”'
    claim: '1 Kgs. 19:10 “to take it away” (my life) uses the same verb with nefesh'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Kgs.xml'
    quote: 'קַחְתָּֽ/הּ'
  - where: 'note 11:30 “He that winneth souls”'
    claim: 'One older reading: the fruit of the righteous is his influence, a tree of life for others; the phrase is taken in a good sense, a winner of souls, a fisher of men'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/11.htm'
    quote: 'the fruit of the righteous, i.e., his external influence, itself is a tree of life, namely for others … becomes a winner of souls (לקח as Proverbs 6:25, but taken in bonam partem), or, as expressed in the N.T. (Matthew 4:19), a fisher of men'
  - where: 'note 11:30 “He that winneth souls”'
    claim: 'A modern translation: “the wise capture souls”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+11&version=NRSVUE'
    quote: '30 The fruit of the righteous is a tree of life, and the wise capture souls.'
  - where: 'note 11:30 “He that winneth souls”'
    claim: 'The Greek translation reads the second line of the wicked: their souls cut off'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/proverbs/11.htm'
    quote: '30Out of the fruit of righteousness grows a tree of life; but the souls of transgressors are cut off before their time.'

  - where: 'note 11:31 “The righteous scarcely saved”'
    claim: 'One older reading: 11:31 is a conclusion from the lesser to the greater; the verb means full requital, reward or punishment'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/11.htm'
    quote: 'It is a vocabulum anceps, and denotes full requital, i.e., according to the reference, either righteous reward or righteous punishment.'
  - where: 'note 11:31 “The righteous scarcely saved”'
    claim: 'One older reading takes the verb the same way in both lines: the righteous does not go unrequited, so much less the wicked'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/11.htm'
    quote: 'if the righteous does not remain unrevenged, so much more shall not the godless and the sinner remain'
  - where: 'note 11:31 “The righteous scarcely saved”'
    claim: 'The Hebrew line read in a modern translation'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+11&version=NRSVUE'
    quote: '31 If the righteous are repaid on earth, how much more the wicked and the sinner!'
  - where: 'note 11:31 “The righteous scarcely saved”'
    claim: 'The Greek translation of 11:31'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/proverbs/11.htm'
    quote: '31If the righteous scarcely be saved, where shall the ungodly and the sinner appear?'
  - where: 'note 11:31 “The righteous scarcely saved”'
    claim: 'The Greek of 1 Pet. 4:18'
    key: greek-nt
    url: 'https://biblehub.com/texts/1_peter/4-18.htm'
    quote: 'καὶ εἰ ὁ δίκαιος μόλις σῴζεται, ὁ ἀσεβὴς καὶ ἁμαρτωλὸς ποῦ φανεῖται;'
  - where: 'note 11:31 “The righteous scarcely saved”'
    claim: 'One older reading: of the proverb read that way, the Greek of 11:31 may be a free translation'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/11.htm'
    quote: 'Of the proverb so understood the lxx version, εἰ ὁ μὲν δίκαιος μόλις (μόγις) σώζεται, ὁ ἀσεβὴς καὶ ἁμαρτωλὸς ποῦ φανεῖται (cf. 1 Peter 4:18) may be a free translation'
  - where: 'note 11:31 “The righteous scarcely saved”'
    claim: 'The words of 1 Pet. 4:18 in the King James'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-pet/4?lang=eng'
    quote: 'And if the righteous scarcely be saved, where shall the ungodly and the sinner appear?'

  - where: christ
    claim: '1 Pet. 4, to Saints suffering as Christians, has the words of the Greek of 11:31 at verse 18'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-pet/4?lang=eng'
    quote: 'And if the righteous scarcely be saved, where shall the ungodly and the sinner appear?'
