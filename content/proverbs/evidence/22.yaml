chapter: 22
claims:
  - where: setting
    claim: 'The proverbs of Solomon proper are 10:1–22:16, under the heading at 10:1'
    key: ot-minute-proverbs
    url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-overview'
    quote: 'The actual proverbs of Solomon are found in Proverbs 10:1–22:16. This section is 375 lines in the Hebrew text and corresponds to its heading found in Proverbs 10:1.'
  - where: setting
    claim: 'The section called “Words of the Wise” is 22:17–24:22'
    key: ot-minute-proverbs
    url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-overview'
    quote: 'The section called “Words of the Wise” (Proverbs 22:17–24:22) is thought to have been influenced by an earlier Egyptian text called “The Instructions of Amenemope.”'
  - where: setting
    claim: 'The Church’s footnotes point 22:26 to the surety sayings of 6:1 and 11:15, and 22:28 to Deut. 19:14 and Prov. 23:10'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/22?lang=eng'
    quote: '“sureties”: Prov. 6:1; 11:15.'

  - where: thread
    claim: 'One older reading: the first saying of the words of the wise (22:22–23) connects with the last Solomonic proverb, 22:16'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/22.htm'
    quote: 'A tetrastich which, in its contents, connects itself with the last proverb of the Solomonic collection, Proverbs 22:16, forms the commencement of this collection'

  - where: section 1 plain
    claim: '“Froward” means perverse'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/22?lang=eng'
    quote: '“froward”: OR perverse.'
  - where: section 1 plain
    claim: 'Verse 2: the rich and the poor have this in common; verse 3: the simple go on and suffer for it'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+22&version=NRSVUE'
    quote: 'The rich and the poor have this in common: the Lord is the maker of them all. 3 The clever see danger and hide, but the simple go on and suffer for it.'
  - where: section 1 plain
    claim: 'Verse 8: whoever sows injustice will reap calamity; verse 9: the generous share their bread'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+22&version=NRSVUE'
    quote: 'Whoever sows injustice will reap calamity, and the rod of anger will fail.(E) 9 Those who are generous are blessed, for they share their bread with the poor.'
  - where: section 2 plain
    claim: 'Verse 11: one who loves purity of heart and has grace on his lips has the king for his friend'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/22.htm'
    quote: 'one loving heart-purity, gracefulness on his lips - the king is his friend.'
  - where: section 2 plain
    claim: 'Verse 12: the LORD keeps watch over knowledge; verse 16: oppressing the poor and giving to the rich lead only to loss'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+22&version=NRSVUE'
    quote: 'Oppressing the poor in order to enrich oneself, and giving to the rich, will lead only to loss.'

  - where: section 3 plain
    claim: 'Verses 18 and 21: ready on your lips; a true answer to those who sent you'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+22&version=NRSVUE'
    quote: 'for it will be pleasant if you keep them within you, if all of them are ready on your lips.'
  - where: section 3 plain
    claim: 'One older reading: the senders of verse 21 are the parents who send the pupil to the teacher of wisdom'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/22.htm'
    quote: 'The שׁלחים [senders] are here the parents or guardians who send him who is to be instructed to the school of the teacher of wisdom (Hitzig).'

  - where: section 4 plain
    claim: 'To strike hands is to shake hands in agreement'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/22?lang=eng'
    quote: '“strike hands”: IE shake hands, showing agreement.'
  - where: section 4 plain
    claim: '“Mean men” are obscure men'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/22?lang=eng'
    quote: 'OR obscure, or wicked'
  - where: section 4 plain
    claim: 'Verse 29: the skillful will serve kings, not common people'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+22&version=NRSVUE'
    quote: 'Do you see those who are skillful in their work? They will serve kings; they will not serve common people.'
  - where: section 4 plain
    claim: 'One older reading: to stand before kings is to enter their service'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/22.htm'
    quote: 'i.e., he can enter into the service of kings, and needs not to enter into the service of mean men equals he is entitled to claim the highest official post.'

  - where: 'note 22:6 “A saying, not a guarantee”'
    claim: 'The way of the verse, on this reading, is the way of the gospel'
    key: matson-training-child
    url: 'https://rsc.byu.edu/book-mormon-insights/training-child'
    quote: 'we obtain insights into how to better approach training up children in the way of the gospel'
  - where: 'note 22:6 “A saying, not a guarantee”'
    claim: 'The book is built on the assumption that proper action leads to proper outcomes'
    key: ot-minute-proverbs
    url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-overview'
    quote: 'The book of Proverbs is built on the assumption that proper action will lead to proper outcomes.'
  - where: 'note 22:6 “A saying, not a guarantee”'
    claim: 'Come, Follow Me: Proverbs says life goes well with wisdom; Ecclesiastes, following it, says it is not that simple'
    key: cfm-ot-2026-37
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/37?lang=eng'
    quote: 'Its main message is that if you seek wisdom—especially God’s wisdom—life will go well. But Proverbs is followed by the book of Ecclesiastes, which seems to say, “It’s not that simple.”'
  - where: 'note 22:6 “A saying, not a guarantee”'
    claim: 'The verse can bring heartache to parents whose child has wandered, and some wrongly conclude the parents bear the blame'
    key: matson-training-child
    url: 'https://rsc.byu.edu/book-mormon-insights/training-child'
    quote: 'it can bring equal heartache and undue anxiety to the parent whose child has chosen to exercise his or her agency to wander from the covenant path, even after a childhood of diligent training'
  - where: 'note 22:6 “A saying, not a guarantee”'
    claim: 'Some erroneously conclude that the parents bear the burden'
    key: matson-training-child
    url: 'https://rsc.byu.edu/book-mormon-insights/training-child'
    quote: 'some may erroneously conclude that if a child chooses to wander from the gospel, the parents are the ones who are to bear the burden for inadequate training'
  - where: 'note 22:6 “A saying, not a guarantee”'
    claim: 'God respects the agency of all his children (2 Ne. 2:27)'
    key: matson-training-child
    url: 'https://rsc.byu.edu/book-mormon-insights/training-child'
    quote: 'The Book of Mormon teaches its modern audience that God respects the agency of all his children and will never interfere with one’s ability to choose (see 2 Nephi 2:27).'
  - where: 'note 22:6 “A saying, not a guarantee”'
    claim: 'The outcome does not always follow the ideal pattern of 22:6; faithful Book of Mormon parents saw children depart'
    key: matson-training-child
    url: 'https://rsc.byu.edu/book-mormon-insights/training-child'
    quote: 'the outcome of such training does not always follow the ideal pattern of Proverbs 22:6 … Because of the divine gift of agency, each of these parents saw their children choose to depart from the covenant path.'
  - where: 'note 22:6 “A saying, not a guarantee”'
    claim: 'Alma the Younger rebelled against the teachings of his father'
    key: matson-training-child
    url: 'https://rsc.byu.edu/book-mormon-insights/training-child'
    quote: 'Alma the Younger is characterized by Mormon as “a very wicked and an idolatrous man” (Mosiah 27:8).'
  - where: 'note 22:6 “A saying, not a guarantee”'
    claim: 'In his torment Alma the Younger remembered his father’s prophecy of Christ'
    key: matson-training-child
    url: 'https://rsc.byu.edu/book-mormon-insights/training-child'
    quote: 'During that harrowing experience he “remembered also to have heard [his] father prophesy unto the people concerning the coming of one Jesus Christ, a Son of God, to atone for the sins of the world” (v. 17).'
  - where: 'note 22:6 “A saying, not a guarantee”'
    claim: 'Matson’s reading of the promise: children carry the teachings of their youth into old age'
    key: matson-training-child
    url: 'https://rsc.byu.edu/book-mormon-insights/training-child'
    quote: 'they can trust in the promise of Proverbs 22:6—that children will carry with them (even into old age) the true and wholesome teachings they received in their youth.'
  - where: 'note 22:6 “A saying, not a guarantee”'
    claim: 'Elder Christofferson: God’s plan is not a cosmic vending machine'
    key: christofferson-relationship-god
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2022/04/41christofferson?lang=eng'
    quote: 'But things are not so mechanical in the divine economy. We ought not to think of God’s plan as a cosmic vending machine where we (1) select a desired blessing, (2) insert the required sum of good works, and (3) the order is promptly delivered.'

  - where: 'note 22:17 “The words of the wise, and an Egyptian book”'
    claim: 'A modern translation prints “The words of the wise” as a heading, by a correction from the Greek'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+22&version=NRSVUE'
    quote: '22.17 Cn Compare Gk: Heb Incline your ear, and hear the words of the wise'
  - where: 'note 22:17 “The words of the wise, and an Egyptian book”'
    claim: 'The words of the wise, 22:17–24:22, are thought to have been influenced by the Instruction of Amenemope'
    key: ot-minute-proverbs
    url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-overview'
    quote: 'The section called “Words of the Wise” (Proverbs 22:17–24:22) is thought to have been influenced by an earlier Egyptian text called “The Instructions of Amenemope.”'
  - where: 'note 22:17 “The words of the wise, and an Egyptian book”'
    claim: 'Amenemope was published in 1923 and dates from about 1186–1069 BC'
    key: von-feldt-instructional-wisdom
    url: 'https://interpreterfoundation.org/journal/his-secret-is-with-the-righteous-instructional-wisdom-in-the-book-of-mormon'
    quote: 'after the 1923 publication of The Instructions of Amenemopet, an Egyptian wisdom document from approximately 1186 to 1069 BC.'
  - where: 'note 22:17 “The words of the wise, and an Egyptian book”'
    claim: 'The author freely adapts the Egyptian material to express his own beliefs'
    key: von-feldt-instructional-wisdom
    url: 'https://interpreterfoundation.org/journal/his-secret-is-with-the-righteous-instructional-wisdom-in-the-book-of-mormon'
    quote: 'Even in the case of Proverbs 22:17–24:22, which clearly resembles The Instruction of Amenemopet, the author freely adapts the Egyptian material in order to express his own unique beliefs.'
  - where: 'note 22:17 “The words of the wise, and an Egyptian book”'
    claim: 'Amenemope parallels concepts and language in Proverbs and may have been the source or inspiration for some of its axioms'
    key: sc-knowhy-539
    url: 'https://scripturecentral.org/knowhy/why-did-samuel-say-the-wealth-of-some-nephites-would-become-slippery'
    quote: 'It has been widely recognized that the Instruction of Amenemope parallels some of the concepts and language found in the biblical book of Proverbs, and indeed may have been the source or inspiration for some of its axioms.'
  - where: 'note 22:17 “The words of the wise, and an Egyptian book”'
    claim: 'Egyptian wisdom works were studied in scribal schools; such schools may be assumed at Judah’s royal court, without direct evidence'
    key: sc-knowhy-539
    url: 'https://scripturecentral.org/knowhy/why-did-samuel-say-the-wealth-of-some-nephites-would-become-slippery'
    quote: 'One may assume, even if there is no direct evidence, that during the First Temple period such institutions dedicated to educating high-ranking officials existed in the royal court [of Judah].'
  - where: 'note 22:17 “The words of the wise, and an Egyptian book”'
    claim: 'Egyptian wisdom works, Amenemope among them, were study material in scribal schools'
    key: sc-knowhy-539
    url: 'https://scripturecentral.org/knowhy/why-did-samuel-say-the-wealth-of-some-nephites-would-become-slippery'
    quote: 'Most of the Egyptian wisdom works—including Amenemope—served as study material in scribal school and other educational frameworks.'
  - where: 'note 22:17 “The words of the wise, and an Egyptian book”'
    claim: 'The call to apply the heart opens a unit of instruction at 22:17 and again at 23:12'
    key: sc-knowhy-644
    url: 'https://scripturecentral.org/knowhy/what-does-it-mean-to-apply-your-heart-to-understanding'
    quote: 'Proverbs 22:17, for instance, begins a lengthy unit referred to as “Words of the Wise” with the call to “hear the words of the wise, and apply thine heart unto my knowledge.”'

  - where: 'note 22:20 “Excellent things, or thirty sayings”'
    claim: 'The read form (qere) of 22:20 is shalishim'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Prov.xml'
    quote: 'שָׁלִישִׁ֑ים'
  - where: 'note 22:20 “Excellent things, or thirty sayings”'
    claim: 'The written form (ketiv) of 22:20 is shilshom'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Prov.xml'
    quote: 'שלשום'
  - where: 'note 22:20 “Excellent things, or thirty sayings”'
    claim: 'Shilshom means three days ago, idiomatic for formerly'
    key: bdb
    url: 'https://biblehub.com/hebrew/8032.htm'
    quote: 'adverb = three days ago, specifically day before yesterday'
  - where: 'note 22:20 “Excellent things, or thirty sayings”'
    claim: 'Shalish is an officer, best explained as the third man in a chariot; BDB lists the qere of 22:20 under it'
    key: bdb
    url: 'https://biblehub.com/hebrew/7991.htm'
    quote: 'III. שָׁלִישׁ noun masculine adjutant or officer (best explained as third man (in chariot)'
  - where: 'note 22:20 “Excellent things, or thirty sayings”'
    claim: 'One older reading: the qere is authentic; Jewish interpreters gloss it as noble things; the name of chief men is transferred to chief proverbs'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/22.htm'
    quote: 'Also the Kerı̂ שׁלשׁים, which without doubt is the authentic word'
  - where: 'note 22:20 “Excellent things, or thirty sayings”'
    claim: 'The name of the chief men is transferred to the chief proverbs'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/22.htm'
    quote: 'The name of the chief men (members of the chief troop) is transferred to the chief proverbs'
  - where: 'note 22:20 “Excellent things, or thirty sayings”'
    claim: 'A modern translation reads “thirty sayings” by correction; the Hebrew says “in the past” or “noble”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+22&version=NRSVUE'
    quote: '22.20 Cn: Heb in the past or noble'
  - where: 'note 22:20 “Excellent things, or thirty sayings”'
    claim: 'Other modern translations also read “thirty sayings”'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+22&version=NIV'
    quote: 'Have I not written thirty sayings for you, sayings of counsel and knowledge'
  - where: 'note 22:20 “Excellent things, or thirty sayings”'
    claim: 'The ESV reads “thirty sayings”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+22&version=ESV'
    quote: 'Have I not written for you (AD)thirty sayings of counsel and knowledge'
  - where: 'note 22:20 “Excellent things, or thirty sayings”'
    claim: 'The reason for “thirty”: the section divides into roughly thirty parts, like Amenemope’s thirty chapters'
    key: reformation-study-bible
    url: 'https://www.biblegateway.com/resources/reformation-study-bible/Prov.22.20'
    quote: 'Section 22:17–24:22 divides into roughly thirty parts, which is formally similar to Amenemope’s thirty-chapter arrangement'

  - where: 'note 22:20 “Excellent things, or thirty sayings”'
    claim: 'BDB: the written form at 22:20 is difficult and the read form impossible'
    key: bdb
    url: 'https://biblehub.com/hebrew/8032.htm'
    quote: 'Proverbs 22:20 Kt is difficult; Qr שָׁלִשִׁים (see III. שָׁלִישׁ) is impossible'

  - where: 'note 22:22 “The poor in the gate”'
    claim: 'The Church’s footnote at 22:23 points to Prov. 23:11'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/22?lang=eng'
    quote: 'Ps. 35:10; Prov. 23:11.'
  - where: 'note 22:22 “The poor in the gate”'
    claim: 'Boaz settled the case at the gate before ten elders of the city'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ruth/4?lang=eng'
    quote: 'And he took ten men of the elders of the city, and said, Sit ye down here. And they sat down.'
  - where: 'note 22:22 “The poor in the gate”'
    claim: 'A modern translation: the LORD despoils of life those who despoil them'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+22&version=NRSVUE'
    quote: 'for the Lord pleads their cause and despoils of life those who despoil them.'

  - where: 'note 22:22 “The poor in the gate”'
    claim: 'A modern translation renders “in the gate” as “in court”'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+22&version=NIV'
    quote: 'do not crush the needy in court'

  - where: christ
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: christ
    claim: 'The Church’s footnote at 22:2 points to Mosiah 4:19'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/22?lang=eng'
    quote: '“rich”: Mosiah 4:19.'
  - where: christ
    claim: 'The Church’s footnote at 22:23 points to D&C 124:75'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/22?lang=eng'
    quote: '“cause”: D&C 124:75.'
