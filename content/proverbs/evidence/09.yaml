chapter: 9
claims:
  - where: setting
    claim: 'Proverbs 9 is the conclusion of the introduction (chapters 1–9) to the book'
    key: ot-minute-proverbs-1-9
    url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
    quote: 'Proverbs 1–9 serves as the introduction to the book of Proverbs and is a guide for how to read the rest of the book; Proverbs 9 is the conclusion to this introduction.'
  - where: setting
    claim: 'In one Latter-day Saint outline of 1–9, the whole of chapter 9 is the last interlude, “Two banquets”'
    key: von-feldt-instructional-wisdom
    url: 'https://interpreterfoundation.org/journal/his-secret-is-with-the-righteous-instructional-wisdom-in-the-book-of-mormon'
    quote: 'Interlude E 9:1–18 Two banquets'
  - where: setting
    claim: '1:7 opens the section and 9:10 finishes it with the fear of the Lord'
    key: ot-minute-proverbs-1-9
    url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
    quote: 'At the beginning of the section, Proverbs 1:7 tells us that “the fear of the Lord is the beginning of knowledge,” and Lady Wisdom finishes this section by telling us that “the fear of the Lord is the beginning of wisdom” (9:10).'
  - where: setting
    claim: 'The house of the adulteress is close to Hades already at 2:18 and 7:27; chapter 9 ends the introduction'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/9.htm'
    quote: 'How near to one another the house of the adulteress and Hades are, so that a man passes through the one into the other, is already stated in Proverbs 2:18; Proverbs 7:27. Here, in the concluding words of the introduction to the Book of Proverbs'

  - where: thread
    claim: 'Folly invites with the same words Wisdom used; both address the simple'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/9.htm'
    quote: 'That Folly invites to her, Proverbs 9:16, in the same words as are used by Wisdom, Proverbs 9:4, is not strange; both address themselves to the simple'
  - where: thread
    claim: 'Folly calls the simple as prey; Wisdom calls them to help them'
    key: ot-minute-proverbs-1-9
    url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
    quote: 'Lady Folly calls to the simple because they are her prey, whereas Lady Wisdom calls to them because she wants to help them.'
  - where: thread
    claim: 'The sayings of 7–12 are spoken by Wisdom, abandoning the figure of the banquet'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/9.htm'
    quote: 'the proverbial discourses in the mouth of Wisdom, abandoning the figure of a banquet, which besides are wholly in the spirit of the author of this book'

  - where: 'section 3 plain'
    claim: '“The dead” of 9:18 are the shades; “hell” is Sheol'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%209&version=NRSVUE'
    quote: 'But they do not know that the dead are there, that her guests are in the depths of Sheol. … 9.18 Heb shades'

  - where: 'note 9:1 “Two women, two houses”'
    claim: 'An introductory theme is building and providing for a household with wisdom; here Wisdom has done so and invites the simple'
    key: ot-minute-proverbs-1-9
    url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
    quote: 'An important theme in these introductory chapters has been the obligation for young people to build their own households with wisdom and provide for those households with wisdom. In this scene, Wisdom has built her own house, has provided for it'
  - where: 'note 9:1 “Two women, two houses”'
    claim: 'One older reading: the seven pillars are the seven virtues of Wisdom’s nature that bear up her dwelling'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/9.htm'
    quote: 'it is appropriate to understand by the seven pillars the seven virtues of her nature communicating themselves (apocalyptically expressed, the ἑπτὰ πνεύματα), which bear up and adorn the dwelling which she establishes among men'
  - where: 'note 9:1 “Two women, two houses”'
    claim: 'The old interpretation made the pillars the seven gifts of the Holy Ghost, after Isaiah 11:2'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/9.htm'
    quote: 'the old interpretation is on the right path, when it suggests that the seven pillars are the seven gifts of the Holy Ghost. The seven-foldness of the manifestation of the Spirit … is established by Isaiah 11:2'
  - where: 'note 9:1 “Two women, two houses”'
    claim: 'The verb for killing the beasts is the ordinary word for slaughter, not sacrifice'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/9.htm'
    quote: 'Michaelis rightly remarks that טבח, in contradistinction to זבח, is the usual word for mactatio extrasacrificialis.'
  - where: 'note 9:1 “Two women, two houses”'
    claim: 'One Latter-day Saint study reads the house as the temple and the pillars as pointing to the temple and ritual'
    key: von-feldt-instructional-wisdom
    url: 'https://interpreterfoundation.org/journal/his-secret-is-with-the-righteous-instructional-wisdom-in-the-book-of-mormon'
    quote: 'The house of Proverbs 9:1 is the temple: “Wisdom hath builded her house, she hath hewn out her seven pillars.” The pillars could be part of the temple structure. … In all cases, the pillars point to the temple and to ritual.'
  - where: 'note 9:1 “Two women, two houses”'
    claim: 'The same study reads the beasts as sacrifice and the table as the shewbread'
    key: von-feldt-instructional-wisdom
    url: 'https://interpreterfoundation.org/journal/his-secret-is-with-the-righteous-instructional-wisdom-in-the-book-of-mormon'
    quote: 'The killed beasts refer to cultic sacrifice, and the table, bread, and wine allude to the table of the shewbread and to ritual libations.'

  - where: 'note 9:3 “Maidens sent through the city”'
    claim: 'Wisdom’s maidens are like the servants of the king in the parable of the marriage of the king’s son; her offer is for all'
    key: von-feldt-instructional-wisdom
    url: 'https://interpreterfoundation.org/journal/his-secret-is-with-the-righteous-instructional-wisdom-in-the-book-of-mormon'
    quote: 'she sends forth “maidens” (v. 3) to help get the word out, much like the king in the parable of the marriage of the king’s son sends servants to the highways … What Wisdom has to offer is not reserved for a cadre of claimants privileged by status or inheritance'
  - where: 'note 9:3 “Maidens sent through the city”'
    claim: 'The study reads the maidens more plainly as angels and prophets'
    key: von-feldt-instructional-wisdom
    url: 'https://interpreterfoundation.org/journal/his-secret-is-with-the-righteous-instructional-wisdom-in-the-book-of-mormon'
    quote: 'More plainly, these messengers are angels and prophets, “the wise” of Proverbs 1:6, sent forth from the heavenly assembly to deliver the words of Christ to all nations.'
  - where: 'note 9:5 “An invitation like the prophets’”'
    claim: 'The verb “mingle” means to mix a drink; used of Wisdom’s wine in 9:2, 5'
    key: bdb
    url: 'https://biblehub.com/hebrew/4537.htm'
    quote: 'mix, with accusative שֵׁכָר Isaiah 5:22; … object יַיִן figurative, subject wisdom Proverbs 9:2,5'
  - where: 'note 9:5 “An invitation like the prophets’”'
    claim: 'Jacob’s invitation in 2 Nephi 9:50 is much like Wisdom’s in 9:5'
    key: von-feldt-instructional-wisdom
    url: 'https://interpreterfoundation.org/journal/his-secret-is-with-the-righteous-instructional-wisdom-in-the-book-of-mormon'
    quote: 'In an invitation much like Wisdom’s in Proverbs 9:5, which we will return to later, Jacob says: “Come, my brethren, every one that thirsteth, come ye to the waters; and he that hath no money, come buy and eat” (2 Nephi 9:50; compare Isaiah 55:1'

  - where: 'note 9:8 “Sayings between the banquets”'
    claim: 'A modern translation heads 9:7–12 “General Maxims”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%209&version=NRSVUE'
    quote: 'General Maxims'
  - where: 'note 9:8 “Sayings between the banquets”'
    claim: 'One older reading: 9:7ff show why Wisdom calls only the simple; she can expect no receptivity from the scorner (Matt. 7:6)'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/9.htm'
    quote: 'The course of thought in Proverbs 9:7 and onwards shows why Wisdom, turning from the wise, who already are hers, directs herself only to the simple … because she can there hope for no receptivity for her invitation; she would, contrary to Matthew 7:6, "give that which is holy to the dogs'
  - where: 'note 9:8 “Sayings between the banquets”'
    claim: 'The Church’s footnote at 9:9 points to Matthew 13:12'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/9?lang=eng'
    quote: '9b “increase”: Matt. 13:12 (11–12); D&C 88:118.'

  - where: 'note 9:10 “The Holy One”'
    claim: 'The Hebrew of “the holy” is qedoshim, a plural adjective'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Prov.xml'
    quote: 'קְדֹשִׁ֣ים'
  - where: 'note 9:10 “The Holy One”'
    claim: 'Modern translations read “the knowledge of the Holy One”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%209&version=NRSVUE'
    quote: 'and the knowledge of the Holy One is insight.'
  - where: 'note 9:10 “The Holy One”'
    claim: 'One older reading: the plural is used of God, Him who is absolutely holy, as in 30:3; knowledge is parallel with fear'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/9.htm'
    quote: 'as here קדושׁים, as the internally multiplicative plur. … as Proverbs 30:3, Joshua 24:9; Hosea 12:1, of God, the "Holy, holy, holy" (Isaiah 6:3), i.e., Him who is absolutely Holy. … The דּעת, parallel with יראת'
  - where: 'note 9:10 “The Holy One”'
    claim: 'The Church’s footnote at 9:10 points to Proverbs 30:3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/9?lang=eng'
    quote: '10c “knowledge”: Prov. 30:3.'
  - where: 'note 9:10 “The Holy One”'
    claim: 'The Septuagint reads “the counsel of saints”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/proverbs/9.htm'
    quote: '10The fear of the Lord is the beginning of wisdom, and the counsel of saints is understanding'
  - where: 'note 9:13 “The woman Folly”'
    claim: 'A modern translation reads “The woman Folly is loud”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%209&version=ESV'
    quote: 'The woman Folly is (AA)loud;'
  - where: 'note 9:13 “The woman Folly”'
    claim: 'The strange woman is most fully developed in 9:13–18, as Lady Folly'
    key: von-feldt-instructional-wisdom
    url: 'https://interpreterfoundation.org/journal/his-secret-is-with-the-righteous-instructional-wisdom-in-the-book-of-mormon'
    quote: 'The figure is most fully developed in Proverbs 9:13–18, and is sometimes referred to here as “Lady Folly” or “Dame Folly.”'
  - where: 'note 9:13 “The woman Folly”'
    claim: '“Clamorous” is the participle of hamah, used of the shameless woman in 7:11 and 9:13'
    key: bdb
    url: 'https://biblehub.com/hebrew/1993.htm'
    quote: 'be boisterous, turbulent, as with wine … of shameless woman Proverbs 7:11; Proverbs 9:13.'
  - where: 'note 9:13 “The woman Folly”'
    claim: 'The same form describes the woman of 7:11'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Prov.xml'
    quote: 'הֹמִיָּ֣ה'

  - where: 'note 9:17 “Stolen water”'
    claim: 'Drinking from one’s own cistern (5:15) means finding sexual pleasure with one’s own wife'
    key: von-feldt-instructional-wisdom
    url: 'https://interpreterfoundation.org/journal/his-secret-is-with-the-righteous-instructional-wisdom-in-the-book-of-mormon'
    quote: 'the youth in Proverbs 5:15–19 is encouraged to “drink waters out of thine own cistern,” meaning that he should find sexual pleasure with his own wife'
  - where: 'note 9:17 “Stolen water”'
    claim: 'One older reading: stolen waters are intercourse stolen from the one who has a right to it; secret bread is lust that must seek concealment'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/9.htm'
    quote: 'is sexual intercourse which is stolen from him who has a right thereto, thus carnal intercourse with אושׁת אישׁ; and לחם סתרים fleshly lust, which, because it is contrary to the law, must seek (cf. furtum, secret love intrigue) concealment'
  - where: 'note 9:17 “Stolen water”'
    claim: 'The Septuagint adds lines after 9:18 warning against strange water'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/proverbs/9.htm'
    quote: '(9:18C) but do thou abstain from strange water, and drink not of a strange fountain, (9:18D) that thou mayest live long'
  - where: 'note 9:17 “Stolen water”'
    claim: 'The dead of 9:18 are rephaim, the shades in Sheol'
    key: bdb
    url: 'https://biblehub.com/hebrew/7496.htm'
    quote: 'plural shades, ghosts … name of dead in She''ôl … Proverbs 9:18 (in עִמְקֵי שְׁאוֺל)'

  - where: christ
    claim: 'One Latter-day Saint study sets Wisdom’s feast beside Alma 5:34, where the tree of life and the bread and waters of life are matched'
    key: von-feldt-instructional-wisdom
    url: 'https://interpreterfoundation.org/journal/his-secret-is-with-the-righteous-instructional-wisdom-in-the-book-of-mormon'
    quote: 'The tree of life and the bread and waters of life are matched in Alma 5:34'
  - where: christ
    claim: 'The Church’s footnote at 9:12 points to Galatians 6:5'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/9?lang=eng'
    quote: '12b “bear”: Gal. 6:5 (4–5).'
