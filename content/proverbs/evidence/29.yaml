chapter: 29
claims:
  - where: setting
    claim: 'One older reading: the Hezekiah collection ends with 29:27, closing with a saying about the king and one about the great moral contrasts'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/29.htm'
    quote: 'With this doubled ת the Book of Proverbs, prepared by the men of Hezekiah, comes to an end. It closes, in accordance with its intention announced at the beginning, with a proverb concerning the king, and a proverb of the great moral contrasts'
  - where: setting
    claim: 'In the Hezekiah collection the kingdom is seen almost only on its dark side, except 29:14; tyranny (29:2), oppressive taxation (29:4), the court (29:12)'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/1.htm'
    quote: 'the kingdom is seen almost only (with exception of Proverbs 29:14) on its dark side, and is represented under the destructive dominion of tyranny (Proverbs 28:15-16; Proverbs 29:2), of oppressive taxation (Proverbs 29:4), of the Camarilla (Proverbs 25:5; Proverbs 29:12)'
  - where: setting
    claim: 'One older reading: a series of six sayings begins at 29:4 with a saying about the king'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/29.htm'
    quote: 'A series of six proverb follows, beginning with a proverb of the king:'
  - where: setting
    claim: 'One older reading groups 29:10–14 together'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/29.htm'
    quote: 'We now group together Proverbs 29:10-14.'
  - where: setting
    claim: 'One older reading: 29:15 begins a group of sayings on discipline in the house and among the people'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/29.htm'
    quote: 'it begins a group of proverbs regarding discipline in the house and among the people'
  - where: setting
    claim: 'One older reading: a last group begins at 29:22 and runs to the end of the Hezekiah collection'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/29.htm'
    quote: 'The following group begins with a proverb which rhymes by מדון, with מנון of the foregoing, and extends on to the end of this Hezekiah collection'

  - where: thread
    claim: 'One older reading of 29:1: the door of repentance to which admonition calls does not always remain open'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/29.htm'
    quote: 'The door of penitence, to which earnest, well-meant admonition calls a man, does not always remain open.'
  - where: thread
    claim: 'The second line of 29:1 equals 6:15'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/29.htm'
    quote: 'Line second equals Proverbs 6:15.'
  - where: thread
    claim: 'One older reading of 29:15: the reproof is discipline by words, which must accompany the rod'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/29.htm'
    quote: 'תּוכחת refers to discipline by means of words, which must accompany bodily discipline, and without them is also necessary'

  - where: section 1 plain
    claim: 'The first line of 29:3 is a variation of 10:1'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/29.htm'
    quote: 'Line first is a variation of Proverbs 10:1.'
  - where: section 2 plain
    claim: 'One older reading of 29:7: the righteous knows what is due to the poor'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/29.htm'
    quote: 'The righteous knoweth and recogniseth the righteous claims of people of low estate, i.e., what is due to them as men'
  - where: section 2 plain
    claim: 'One older reading of 29:8: scornful men set the city in an uproar, wise men allay anger'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/29.htm'
    quote: '8 Men of derision set the city in an uproar,'

  - where: 'note 29:2 “When the wicked rule”'
    claim: 'D&C 98:9–10 repeats the line and draws counsel to seek and uphold honest and wise men'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/98?lang=eng'
    quote: 'Nevertheless, when the wicked rule the people mourn. … Wherefore, honest men and wise men should be sought for diligently, and good men and wise men ye should observe to uphold'

  - where: 'note 29:13 “The poor man and the oppressor”'
    claim: '29:13 is a variation of 22:2, and the man set against the poor is a usurer or oppressor'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/29.htm'
    quote: 'A variation of Proverbs 22:2, according to which the proverb is to be understood in both of its parts.'
  - where: 'note 29:13 “The poor man and the oppressor”'
    claim: 'The man of tekakhim is one who exacts oppressive interest; the name carries reproach'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/29.htm'
    quote: 'אישׁ תככים is a man who makes oppressive taxes, high previous payments of interest'
  - where: 'note 29:13 “The poor man and the oppressor”'
    claim: 'The second line: both owe the light of life to God, and both answer to Him'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/29.htm'
    quote: 'the poor as well as the rich owe the light of life (Psalm 13:4) to God, the creator and ruler of all things - a fact which has also its moral side: both are conditioned by Him, stand under His control, and have to give to Him an account'
  - where: 'note 29:13 “The poor man and the oppressor”'
    claim: 'A modern translation: the poor and the oppressor'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+29:13&version=NRSVUE'
    quote: '13 The poor and the oppressor have this in common:'

  - where: 'note 29:18 “Where there is no vision”'
    claim: 'Chazon is divine communication in a vision, oracle, prophecy; used with “word” at 1 Sam. 3:1'
    key: bdb
    url: 'https://biblehub.com/hebrew/2377.htm'
    quote: '3 divine communication in a vision, oracle, prophecy'
  - where: 'note 29:18 “Where there is no vision”'
    claim: 'One older reading: chazon here is prophetic revelation; without it a people becomes ungovernable'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/29.htm'
    quote: 'חזון is, according to the sense, equivalent to נבוּאה, the prophetic revelation in itself, and as the contents of that which is proclaimed.'
  - where: 'note 29:18 “Where there is no vision”'
    claim: 'The verb means to let loose, remove restraint; it is used of the people at Exodus 32:25'
    key: bdb
    url: 'https://biblehub.com/hebrew/6544.htm'
    quote: '1 let go, let loose, people, i.e. remove restraint from them, Exodus 32:25 (twice in verse)'
  - where: 'note 29:18 “Where there is no vision”'
    claim: 'One older reading links the verb to Exodus 32:25 and to the silence of the preacher (Ps. 74:9; Amos 8:12)'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/29.htm'
    quote: 'it becomes פּרע, disorderly, Exodus 32:25'
  - where: 'note 29:18 “Where there is no vision”'
    claim: 'One older reading: a people is dissolute when the voice speaking from revelation is silent (Ps. 74:9; Amos 8:12)'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/29.htm'
    quote: 'a people is in a dissolute condition when the voice of the preacher, speaking from divine revelation, and enlightening their actions and sufferings by God''s word, is silent amongst them (Psalm 74:9, cf. Amos 8:12)'
  - where: 'note 29:18 “Where there is no vision”'
    claim: 'One older reading: torah here is divine teaching, the word of God, Sinaitic or prophetic'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/29.htm'
    quote: 'Tôra denotes divine teaching, the word of God; whether that of the Sinaitic or that of the prophetic law'
  - where: 'note 29:18 “Where there is no vision”'
    claim: 'A modern translation: no prophecy … cast off restraint'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+29:18&version=NRSVUE'
    quote: '18 Where there is no prophecy, the people cast off restraint,'
  - where: 'note 29:18 “Where there is no vision”'
    claim: 'A modern translation: no revelation … cast off restraint'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+29:18&version=NIV'
    quote: '18 Where there is no revelation, people cast off restraint;'
  - where: 'note 29:18 “Where there is no vision”'
    claim: 'KnoWhy #367: “vision” could be translated “revelation,” so revelation is part of the blessings for keeping the commandments'
    key: sc-knowhy-367
    url: 'https://scripturecentral.org/knowhy/what-does-it-really-mean-to-be-blessed-for-keeping-the-commandments'
    quote: 'In this verse, the word “vision” could also be translated as “revelation” implying that revelation constitutes a portion of the promised blessings for keeping the commandments.'

  - where: 'note 29:18 “Where there is no vision”'
    claim: '1 Sam. 3:1: there was no open vision'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/3?lang=eng'
    quote: 'And the word of the Lord was precious in those days; there was no open vision.'
  - where: 'note 29:18 “Where there is no vision”'
    claim: 'Ex. 32:25: the people were naked'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/32?lang=eng'
    quote: 'And when Moses saw that the people were naked'
  - where: 'note 29:18 “Where there is no vision”'
    claim: 'Amos 8:11: a famine of hearing the words of the Lord'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/amos/8?lang=eng'
    quote: 'not a famine of bread, nor a thirst for water, but of hearing the words of the Lord'
  - where: 'note 29:13 “The poor man and the oppressor”'
    claim: 'Prov. 22:2, the saying 29:13 varies'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/22?lang=eng'
    quote: 'The rich and poor meet together: the Lord is the maker of them all.'
  - where: 'note 29:13 “The poor man and the oppressor”'
    claim: 'Ps. 13:3: lighten mine eyes, lest I sleep the sleep of death'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/13?lang=eng'
    quote: 'Consider and hear me, O Lord my God: lighten mine eyes, lest I sleep the sleep of death;'

  - where: 'note 29:4 “Gifts or exactions”'
    claim: 'Terumah: properly something lifted off, separated; contributions for sacred uses, and for the prince in Ezekiel 45:13, 16'
    key: bdb
    url: 'https://biblehub.com/hebrew/8641.htm'
    quote: 'contribution, offering, for sacred uses … (properly something lifted off, separated) … 2 contribution for prince, in Ezekiel''s scheme: Ezekiel 45:13,16'
  - where: 'note 29:4 “Gifts or exactions”'
    claim: 'BDB on Prov. 29:4: a man of contributions, demanding them, a man of exactions'
    key: bdb
    url: 'https://biblehub.com/hebrew/8641.htm'
    quote: 'אִישׁ תְּרוּמוֺת Proverbs 29:4 a man of contributions, i.e. demanding them, = man of exactions.'
  - where: 'note 29:4 “Gifts or exactions”'
    claim: 'A modern translation: one who makes heavy exactions ruins the land'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+29:4&version=NRSVUE'
    quote: 'but one who makes heavy exactions ruins it.'

  - where: 'note 29:10 “Who seeks whose life”'
    claim: 'To seek the soul (biqqesh nefesh) is to seek to take a life; BDB lists Prov. 29:10 with 1 Sam. 20:1 and 1 Kgs. 19:10'
    key: bdb
    url: 'https://biblehub.com/hebrew/1245.htm'
    quote: 'בקשׁ נפשׁ seek to take one''s life Exodus 4:19 (J) 1 Samuel 20:1; … 1 Kings 19:10,14; … Proverbs 29:10'
  - where: 'note 29:10 “Who seeks whose life”'
    claim: 'A modern translation: they seek the life of the upright'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+29:10&version=NRSVUE'
    quote: 'and they seek the life of the upright.'
  - where: 'note 29:10 “Who seeks whose life”'
    claim: 'A modern translation: seek to kill the upright'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+29:10&version=NIV'
    quote: 'and seek to kill the upright.'

  - where: 'note 29:21 “A pampered servant”'
    claim: 'The verb of 29:21 means indulge, pamper'
    key: bdb
    url: 'https://biblehub.com/hebrew/6445.htm'
    quote: '[פָנַק] verb Pi`el indulge, pamper'
  - where: 'note 29:21 “A pampered servant”'
    claim: 'Manon is dubious, only in Prov. 29:21; proposals: thankless one; Delitzsch, father of numerous progeny; or read madon, strife'
    key: bdb
    url: 'https://biblehub.com/hebrew/4497.htm'
    quote: 'מָנוֺן noun masculine dubious; only in ׳וְאַחֲרִיתוֺ יִהְיֶה מ Proverbs 29:21 Ew Now thankless one (Ethiopic Di189); De "Brutstätte" i.e. father of numerous progeny (√ נון); < Be Str (who cites A. Müller), compare Wild., read מָדוֺן strife.'
  - where: 'note 29:21 “A pampered servant”'
    claim: 'A modern translation: will come to a bad end; meaning of the Hebrew uncertain'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+29:21&version=NRSVUE'
    quote: '21 A slave pampered from childhood will come to a bad end. … 29.21 Vg: Meaning of Heb uncertain'
  - where: 'note 29:21 “A pampered servant”'
    claim: 'A modern translation: will turn out to be insolent'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+29:21&version=NIV'
    quote: 'A servant pampered from youth will turn out to be insolent.'

  - where: 'note 29:24 “He heareth cursing”'
    claim: 'Lev. 5:1: a witness who hears the voice of swearing and does not utter it bears his iniquity'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/5?lang=eng'
    quote: 'And if a soul sin, and hear the voice of swearing, and is a witness, whether he hath seen or known of it; if he do not utter it, then he shall bear his iniquity.'
  - where: 'note 29:24 “He heareth cursing”'
    claim: 'A modern translation: put under oath and dare not testify, with a cross-reference to Lev. 5:1'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+29:24&version=NIV'
    quote: 'they are put under oath and dare not testify.(A) … Proverbs 29:24 : S Lev 5:1'
  - where: 'note 29:24 “He heareth cursing”'
    claim: 'Another modern translation reads the victim''s curse and marks the Hebrew uncertain'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+29:24&version=NRSVUE'
    quote: 'one hears the victim’s curse but discloses nothing.(A) … 29.24 Meaning of Heb uncertain'

  - where: 'note 29:25 “The fear of man”'
    claim: 'Robbins: pleasing others before God inverts the first and second great commandments'
    key: robbins-which-way
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2014/10/which-way-do-you-face?lang=eng'
    quote: 'Trying to please others before pleasing God is inverting the first and second great commandments (see Matthew 22:37–39).'
  - where: 'note 29:25 “The fear of man”'
    claim: 'Robbins: when fear of men tempts us to condone sin it becomes the snare of 29:25'
    key: robbins-which-way
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2014/10/which-way-do-you-face?lang=eng'
    quote: 'when this fear of men tempts us to condone sin, it becomes a “snare” according to the book of Proverbs (see Proverbs 29:25).'
  - where: 'note 29:25 “The fear of man”'
    claim: 'Robbins gives Saul, who feared the people, among the scriptures'' examples'
    key: robbins-which-way
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2014/10/which-way-do-you-face?lang=eng'
    quote: 'King Saul disobeyed the word of the Lord by keeping the spoils of war because he “feared the people, and obeyed their voice” (1 Samuel 15:24).'

  - where: christ
    claim: 'John 12:42–43: rulers believed on Jesus but did not confess Him because they loved the praise of men'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/12?lang=eng'
    quote: 'Nevertheless among the chief rulers also many believed on him; but because of the Pharisees they did not confess him, lest they should be put out of the synagogue'
  - where: christ
    claim: 'D&C 3:7: Joseph Smith should not have feared man more than God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/3?lang=eng'
    quote: 'For, behold, you should not have feared man more than God.'
  - where: christ
    claim: 'D&C 3:8: the Lord would have supported him and been with him in every time of trouble'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/3?lang=eng'
    quote: 'he would have extended his arm and supported you against all the fiery darts of the adversary; and he would have been with you in every time of trouble.'
  - where: 'christ'
    claim: 'D&C 3 was given after the loss of the manuscript'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/3?lang=eng'
    quote: 'relating to the loss of 116 pages of manuscript translated from the first part of the Book of Mormon'
  - where: 'christ'
    claim: 'The fear of man in Prov. 29:25 is pleasing others before God'
    key: robbins-which-way
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2014/10/which-way-do-you-face?lang=eng'
    quote: 'Trying to please others before pleasing God is inverting the first and second great commandments (see Matthew 22:37–39).'
