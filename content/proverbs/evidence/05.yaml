chapter: 5
claims:
  # ---- setting / thread ----
  - where: 'setting'
    claim: 'Proverbs 5:1–23 is listed as the eighth instruction of chapters 1–9, “Another man’s wife and one’s own”'
    key: von-feldt-instructional-wisdom
    url: 'https://interpreterfoundation.org/journal/his-secret-is-with-the-righteous-instructional-wisdom-in-the-book-of-mormon'
    quote: 'Instruction VIII 5:1–23 Another man’s wife and one’s own'
  - where: 'setting'
    claim: 'The two paths of 1–9: Wisdom on the path of the righteous, the strange woman leading on the dark path of the wicked (4:14, 19)'
    key: von-feldt-instructional-wisdom
    url: 'https://interpreterfoundation.org/journal/his-secret-is-with-the-righteous-instructional-wisdom-in-the-book-of-mormon'
    quote: 'Wisdom calls men to follow her on the shining path of the righteous (Proverbs 2:20; 4:18), while the strange woman leads on the dark path of the wicked (e.g., Proverbs 4:14, 19).'
  - where: 'setting'
    claim: 'Chapter 5 makes the two ways concrete: the young man’s wife and another’s wife'
    key: ot-minute-proverbs-1-9
    url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
    quote: 'The ways of wisdom/folly and life/death are now more concrete for the young man: his wife and another’s wife.'
  - where: 'thread'
    claim: 'Because the strange woman leads to death, the son is told to be faithful to the wife of his youth; the water images of 15–18'
    key: ot-minute-proverbs-1-9
    url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
    quote: 'Because the strange woman leads to the path of death, the young man is told to remain faithful to “the wife of thy youth” (verse 19).'
  # ---- sections ----
  - where: 'section 1 plain'
    claim: 'Verse 6 read with the woman as subject: she does not ponder the path of life, her ways wander'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+5&version=ESV'
    quote: 'she (L)does not ponder the path of life; her ways wander, and she does not know it.'
  - where: 'section 1 plain'
    claim: 'Her steps follow the path to Sheol'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+5&version=NRSVUE'
    quote: 'Her feet go down to death; her steps follow the path to Sheol.'
  - where: 'section 2 plain'
    claim: 'A new discourse begins at 5:7, continuing from the end of the one before'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/5.htm'
    quote: 'The eighth discourse springs out of the conclusion of the seventh, and connects itself by its reflective מעליה so closely with it that it appears as its continuation'
  - where: 'section 2 plain'
    claim: 'Verse 14 rendered: almost completely ruined in the assembly'
    key: ot-minute-proverbs-1-9
    url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
    quote: 'The final lament in Proverbs 5:14 is better translated as, “I was almost completely ruined in the midst of the congregation and assembly.”'
  - where: 'section 2 plain'
    claim: 'Verse 10: strangers take their fill of your strength'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+5&version=ESV'
    quote: 'lest strangers take their fill of your strength'
  - where: 'section 3 plain'
    claim: 'Verse 16 read as a question'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+5&version=ESV'
    quote: 'Should your (T)springs be scattered abroad, streams of water (U)in the streets?'
  - where: 'section 3 plain'
    claim: 'Verses 19–20: be intoxicated with her love; why be intoxicated with another woman'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+5&version=ESV'
    quote: 'be intoxicated always in her love.'
  - where: 'section 3 plain'
    claim: 'Verse 15 begins a new part (the analogy of water), after the lament of 5:14'
    key: ot-minute-proverbs-1-9
    url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
    quote: 'The young man is told to drink water from his own cisterns (verse 15).'
  # ---- notes ----
  - where: 'note 5:3 “Another man’s wife”'
    claim: 'Chapter 5 makes the two ways concrete: his wife and another’s wife'
    key: ot-minute-proverbs-1-9
    url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
    quote: 'The ways of wisdom/folly and life/death are now more concrete for the young man: his wife and another’s wife.'
  - where: 'note 5:3 “Another man’s wife”'
    claim: 'The strange woman is marked by her smooth, flattering speech and her disloyalty to her husband'
    key: von-feldt-instructional-wisdom
    url: 'https://interpreterfoundation.org/journal/his-secret-is-with-the-righteous-instructional-wisdom-in-the-book-of-mormon'
    quote: 'The strange woman is characterized primarily by her smooth, flattering tongue and her disloyalty to her husband.'
  - where: 'note 5:3 “Another man’s wife”'
    claim: 'Caution: the image should not feed an assumption that women are dangerous'
    key: ot-minute-proverbs-1-9
    url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
    quote: 'However, we do have to be cautious that the images of the strange woman as a seducing temptress do not add to a general assumption that women should be treated as dangerous and that any interaction with them is hazardous.'
  - where: 'note 5:4 “Sweet at first, bitter at the end”'
    claim: 'Wormwood is the herb Artemisia, used of bitter calamity or sorrow'
    key: bd-wormwood
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/wormwood?lang=eng'
    quote: 'The herb Artemisia. Used metaphorically of bitter calamity or sorrow'
  - where: 'note 5:5 “Down to Sheol”'
    claim: 'Sheol is the abode of departed spirits, rendered grave, pit or hell in the KJV'
    key: bd-sheol
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sheol?lang=eng'
    quote: 'The Hebrew name for the abode of departed spirits (corresponding to the Greek Hades), translated in the KJV “grave,” “pit,” and “hell,” depending on the context'
  - where: 'note 5:5 “Down to Sheol”'
    claim: 'A modern translation reads “her steps follow the path to Sheol”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+5&version=NRSVUE'
    quote: 'Her feet go down to death; her steps follow the path to Sheol.'
  - where: 'note 5:5 “Down to Sheol”'
    claim: 'Death and hell here read as metaphors for a blighted life'
    key: allis-pike-words-wise
    url: 'https://rsc.byu.edu/give-ear-my-words/words-wise'
    quote: 'The son who follows her arrives at death and hell, metaphors for a blighted life where positive growth ceases and moral decay prevails.'
  - where: 'note 5:6 “She does not weigh the path of life”'
    claim: 'Modern translation makes the woman the subject of 5:6'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+5&version=ESV'
    quote: 'she (L)does not ponder the path of life; her ways wander, and she does not know it.'
  - where: 'note 5:6 “She does not weigh the path of life”'
    claim: 'Another modern translation: she does not keep straight to the path of life'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+5&version=NRSVUE'
    quote: 'She does not keep straight to the path of life; her ways wander, and she does not know it.'
  - where: 'note 5:6 “She does not weigh the path of life”'
    claim: 'Jewish expositors after the Talmud took the line as an address to the son; the subject is the adulteress, as the LXX, Jerome, Syriac and Targum read'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/5.htm'
    quote: 'No, the subject to תפלם is the adulteress, and פּן is an intensified לא. Thus the lxx, Jerome, Syr., Targ., Luther'
  - where: 'note 5:6 “She does not weigh the path of life”'
    claim: 'The verb means to make level or smooth a path; it is used at 5:6 and 5:21'
    key: bdb
    url: 'https://biblehub.com/hebrew/6424.htm'
    quote: '2 make level, smooth (compare Gerber32), with accusative of path (figurative), מַעְגָּל Proverbs 4:26; Proverbs 5:21; Isaiah 26:7, נָתִּיב Psalm 78:50, אֹרַח Proverbs 5:6.'
  - where: 'note 5:6 “She does not weigh the path of life”'
    claim: 'At 5:21: man can take no step without God, which quickens rather than removes responsibility'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/5.htm'
    quote: 'man can take no step in any direction without God; and that not only does not exempt him from moral responsibility, but the consciousness of this is rather for the first time rightly quickened'
  - where: 'note 5:6 “She does not weigh the path of life”'
    claim: 'Jewish expositors after the Talmud and Midrash took the line as an address to the son'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/5.htm'
    quote: 'But with Jewish expositors (Rashi, Aben-Ezra, Ralbag, Malbim, etc.) to interpret תּפּלּס, after the Talmud (b. Mod katan 9a) and Midrash, as an address is impracticable'
  - where: 'note 5:14 “Ruined before the assembly”'
    claim: 'A modern translation: at the point of utter ruin in the public assembly'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+5&version=NRSVUE'
    quote: 'Now I am at the point of utter ruin in the public assembly.”'
  - where: 'note 5:14 “Ruined before the assembly”'
    claim: 'Actions take place within a community; what seemed private affects the community'
    key: ot-minute-proverbs-1-9
    url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
    quote: 'The book of Proverbs is emphatic that our actions always take place within a community and, because of this, ultimately affect others, including God. Thus, what may have seemed secret and private will always affect a community.'
  - where: 'note 5:14 “Ruined before the assembly”'
    claim: 'The strange woman’s path puts the household in danger'
    key: ot-minute-proverbs-1-9
    url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
    quote: 'To follow the path of the strange woman causes one to leave “the path of life” (verse 6) and puts one’s household in danger.'
  - where: 'note 5:16 “Water from your own well”'
    claim: 'Water as an analogy, life-giving and vital to the household'
    key: ot-minute-proverbs-1-9
    url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
    quote: 'The father uses the analogy of water, something that is life-giving and vitally important for the well-being of a household.'
  - where: 'note 5:16 “Water from your own well”'
    claim: 'Verse 16 is better read as a question'
    key: ot-minute-proverbs-1-9
    url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
    quote: 'Verse 16 is better read as a question: “Should thy fountains be dispersed abroad, and rivers of waters in the streets?”'
  - where: 'note 5:16 “Water from your own well”'
    claim: 'A modern translation prints verse 16 as a question'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+5&version=NRSVUE'
    quote: 'Should your springs be scattered abroad, streams of water in the streets?'
  - where: 'note 5:16 “Water from your own well”'
    claim: 'The passage as a plea for faithfulness to family'
    key: ot-minute-proverbs-1-9
    url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
    quote: 'We can read this passage as a general plea for faithfulness to family in building and providing for one’s household.'
  - where: 'note 5:19 “Ravished, and led astray”'
    claim: 'shagah: to stray, and by extension to reel, be enraptured; KJV renders “be ravished”'
    key: bdb
    url: 'https://biblehub.com/hebrew/7686.htm'
    quote: '2 swerve, meander, reel or roll, in drunkenness, ב of drink Isaiah 28:7 (twice in verse); = be intoxicated, Proverbs 20:1; so with (בּ) love Proverbs 5:19,20'
  - where: 'note 5:19 “Ravished, and led astray”'
    claim: 'Modern translation: be intoxicated always in her love'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+5&version=ESV'
    quote: 'Why should you be intoxicated, my son, with (AB)a forbidden woman'
  - where: 'note 5:19 “Ravished, and led astray”'
    claim: 'Modern translation of 5:19: be intoxicated always in her love'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+5&version=ESV'
    quote: 'be intoxicated always in her love.'
  - where: 'note 5:19 “Ravished, and led astray”'
    claim: 'The verb of 5:23 is repeated on purpose from 5:20'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/5.htm'
    quote: 'With the ישׁגּה (Proverbs 5:23), repeated purposely from Proverbs 5:20, there is connected the idea of the overthrow which is certain to overtake the infatuated man.'
  - where: 'note 5:19 “Ravished, and led astray”'
    claim: 'The love of 5:19 is a morally permissible love-ecstasy'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/5.htm'
    quote: 'He speaks here of a morally permissible love-ecstasy, or rather, since תמיד excludes that which is extraordinary, of an intensity of love connected with the feeling of superabundant happiness.'
  - where: 'note 5:22 “The cords of his sins”'
    claim: 'Nephi’s flaxen cord: a single strand of flax is weak'
    key: sc-knowhy-551
    url: 'https://scripturecentral.org/knowhy/why-did-nephi-say-the-devil-leads-sinners-by-a-flaxen-cord'
    quote: 'A single strand or thread of tow (flax) is “a very weak cord.”'
  - where: 'note 5:22 “The cords of his sins”'
    claim: 'Satan twists the cords of sin (Prov. 5:22) into strong cords; the knots become hard to untie'
    key: sc-knowhy-551
    url: 'https://scripturecentral.org/knowhy/why-did-nephi-say-the-devil-leads-sinners-by-a-flaxen-cord'
    quote: 'if an individual does not repent and turn away from their sins, then Satan can twist or braid the individual “cords of sin” (Proverbs 5:22) into “strong cords” which bind down his victims “forever.” Like a flax rope soaked in water, the knots become difficult—perhaps even impossible—to untie'
  # ---- christ / explore ----
  - where: 'christ'
    claim: 'Through His Atonement the Lord cuts the cords of the wicked; never too late to repent'
    key: sc-knowhy-551
    url: 'https://scripturecentral.org/knowhy/why-did-nephi-say-the-devil-leads-sinners-by-a-flaxen-cord'
    quote: 'Fortunately, in the words of the Psalmist, “The Lord is righteous,” and through the power of his Atonement, he can “cut asunder the cords of the wicked” (Psalm 129:4). In this life, it is never too late to repent'
  - where: 'christ'
    claim: 'Alma, encircled by the chains of death, cried to Jesus'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/36?lang=eng'
    quote: 'O Jesus, thou Son of God, have mercy on me, who am in the gall of bitterness, and am encircled about by the everlasting chains of death.'
  - where: 'christ'
    claim: 'The Lord’s command to love one’s wife and cleave to her'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/42?lang=eng'
    quote: 'Thou shalt love thy wife with all thy heart, and shalt cleave unto her and none else.'
  - where: 'explore'
    claim: 'Allis-Pike pairs 5:12–13 with Alma 39:1 and 5:1 with Alma 39:2'
    key: allis-pike-words-wise
    url: 'https://rsc.byu.edu/give-ear-my-words/words-wise'
    quote: '“My son, attend unto my wisdom, and bow thine ear to my understanding” (5:1).'
  - where: 'explore'
    claim: 'Allis-Pike pairs 5:12–13 with Alma 39:1'
    key: allis-pike-words-wise
    url: 'https://rsc.byu.edu/give-ear-my-words/words-wise'
    quote: '“How have I hated instruction, and my heart despised reproof: And have not obeyed the voice of my teachers, nor inclined mine ear to them that instructed me” (5:12–13).'
