chapter: 17
claims:
  - where: setting
    claim: 'The proverbs of Solomon proper are 10:1–22:16, under the heading at 10:1'
    key: ot-minute-proverbs
    url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-overview'
    quote: 'The actual proverbs of Solomon are found in Proverbs 10:1–22:16. This section is 375 lines in the Hebrew text and corresponds to its heading found in Proverbs 10:1.'
  - where: setting
    claim: 'Verse 5a repeats 14:31a with a change; verse 3a returns at 27:21a; verse 18 takes up the surety of 6:1; verses 21 and 25 take up the foolish son of 10:1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/17?lang=eng'
    quote: '“mocketh”: Prov. 14:31; Mosiah 4:17 (16–18).'
  - where: setting
    claim: 'One older reading: the first line of 17:3 recurs at 27:21'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/17.htm'
    quote: 'In Proverbs 27:21 there follow the two figures, with which there is formed a priamel'

  - where: section 2 plain
    claim: 'The “gift” of verse 8 is a bribe'
    key: bdb
    url: 'https://biblehub.com/hebrew/7810.htm'
    quote: 'שֹׁ֫חַד noun masculine present, specifically bribe'
  - where: section 2 plain
    claim: '“Covereth a transgression” means forgives it; “seeketh love” means promotes a loving relationship'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/17?lang=eng'
    quote: '“covereth a transgression”: IE forgives a transgression.'
  - where: section 2 plain
    claim: 'A modern translation: a hundred blows into a fool'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+17&version=NRSVUE'
    quote: 'A rebuke strikes deeper into a discerning person than a hundred blows into a fool.'
  - where: section 4 plain
    claim: 'Verse 26: to flog the noble for their integrity'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+17&version=NRSVUE'
    quote: 'To impose a fine on the innocent is not right or to flog the noble for their integrity.'
  - where: section 4 plain
    claim: 'Verse 24: the fool''s eyes wander without a fixed object'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/17.htm'
    quote: 'the eyes of the fool, without keeping that one necessary thing in view, wander in alia omnia, and roam about what is far off, without having any fixed object.'

  - where: 'note 17:1 “A house full of feasts”'
    claim: 'One older reading: the dry morsel is bread with nothing to drink or moisten it'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/17.htm'
    quote: 'is a piece of bread (פת, fem., as Proverbs 23:8) without savoury drink (Theodotion, καθ ̓ ἑαυτόν, i.e., nothing with it)'
  - where: 'note 17:1 “A house full of feasts”'
    claim: 'The “sacrifices” are slain animals, offerings or banquets; the old name of the peace offerings, partly burned and partly eaten'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/17.htm'
    quote: 'but, as always, slain animals, i.e., either offerings or banquets of slain beasts; it is the old name of the שׁלמים (cf. Exodus 18:12; Exodus 24:5; Proverbs 7:14), part of which only were offered on the altar, and part presented as a banquet'
  - where: 'note 17:1 “A house full of feasts”'
    claim: 'One older reading: the feasts brought quarrels, so the poor man with his dry bread could look on without envy'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/17.htm'
    quote: 'brought quarrels and strife, so that the poor who ate his dry bread in quiet peace could look on all this noise and tumult without envy.'
  - where: 'note 17:1 “A house full of feasts”'
    claim: 'A modern translation: a house full of feasting'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+17&version=NRSVUE'
    quote: 'Better is a dry morsel with quiet than a house full of feasting with strife.'

  - where: 'note 17:2 “A share, or the dividing”'
    claim: 'A modern translation: the slave shares the inheritance as one of the family'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+17&version=NRSVUE'
    quote: 'A slave who deals wisely will rule over a child who acts shamefully and will share the inheritance as one of the family.'
  - where: 'note 17:2 “A share, or the dividing”'
    claim: 'The Septuagint: he shall divide portions among brethren'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/proverbs/17.htm'
    quote: '2A wise servant shall have rule over foolish masters, and shall divide portions among brethren.'
  - where: 'note 17:2 “A share, or the dividing”'
    claim: 'One older reading: the verb with an object means to distribute; the servant is the distributor of the inheritance, not an heir; all translators from the LXX to Luther read “divide”'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/17.htm'
    quote: 'he it is who divides the inheritance among the brethren, i.e., occupies the place amongst them of distributor of the inheritance, not: takes a portion of the inheritance'
  - where: 'note 17:2 “A share, or the dividing”'
    claim: 'One older reading: with the accusative the verb means only to distribute; so all translators'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/17.htm'
    quote: 'but, with the accus., nothing else than to distribute, e.g., Joshua 18:2 … Jerome, haereditatem dividet; and thus all translators, from the lxx to Luther.'
  - where: 'note 17:2 “A share, or the dividing”'
    claim: 'One older reading: the degenerate son loses his inheritance and the servant steps into his place'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/17.htm'
    quote: 'the supplanting of the degenerate is brought about by this, that he loses his inheritance, and the intelligent servant steps into his place.'

  - where: 'note 17:3 “The fining pot”'
    claim: 'The fining pot is a crucible, the vessel of refining'
    key: bdb
    url: 'https://biblehub.com/hebrew/4715.htm'
    quote: 'מַצְרֵף noun [masculine] crucible (properly place or instrument of refining); לַכֶּסֶף וְכוּר לַזָּהָב ׳מ Proverbs 17:3; Proverbs 27:21.'
  - where: 'note 17:8 “A bribe that works”'
    claim: 'The word is a present, specifically a bribe, usually to pervert justice; it is the word of 17:23, 21:14 and Deut. 16:19'
    key: bdb
    url: 'https://biblehub.com/hebrew/7810.htm'
    quote: 'bribe, usually to pervert justice, object of לָקַח Exodus 23:8 a (E), = Deuteronomy 16:19a, Deuteronomy 10:17; 1 Samuel 8:3; 2Chronicles 19:7; Psalm 15:5; Proverbs 17:23 … Psalm 26:10; Proverbs 17:8; Proverbs 21:14'
  - where: 'note 17:8 “A bribe that works”'
    claim: 'One older reading: here, as always, the word is the gift of bribery, not generosity; the proverb states a fact of experience'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/17.htm'
    quote: 'But שׂחד means here not the gift of seasonable liberality (Zckler), but, as always, the gift of bribery … The proverb expresses a fact of experience.'
  - where: 'note 17:8 “A bribe that works”'
    claim: 'One older reading: the bribe appears a jewel to the one who receives it'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/17.htm'
    quote: 'The gift of bribery appears a jewel to its receiver;'
  - where: 'note 17:8 “A bribe that works”'
    claim: 'A modern translation: a magic stone in the eyes of those who give it'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+17&version=NRSVUE'
    quote: 'A bribe is like a magic stone in the eyes of those who give it; wherever they turn they prosper.'
  - where: 'note 17:8 “A bribe that works”'
    claim: 'One older reading: the bribe of 17:23 is brought out of the bosom of the clothing in secret; the giver has not right on his side'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/17.htm'
    quote: 'From the bosom, מחק, where it was kept concealed, the gift is brought forth … Since this is done to give to the course of justice a direction contrary to rectitude, the giver of the bribe has not right on his side'

  - where: 'note 17:8 “A bribe that works”'
    claim: 'One older reading: the bosom of 17:23 is that of the clothing'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/17.htm'
    quote: 'The bosom, חק (חיק), is, as Proverbs 16:23, that of the clothing.'

  - where: 'note 17:11 “A cruel messenger”'
    claim: 'The word is used here of a human messenger, one sent with a message'
    key: bdb
    url: 'https://biblehub.com/hebrew/4397.htm'
    quote: 'a. one sent with a message Genesis 32:4 8t. J E; … Job 1:14; Proverbs 13:17; Proverbs 17:11'
  - where: 'note 17:11 “A cruel messenger”'
    claim: 'The Septuagint: the Lord will send an unmerciful messenger'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/proverbs/17.htm'
    quote: '11Every bad man stirs up strifes: but the Lord will send out against him an unmerciful messenger.'
  - where: 'note 17:11 “A cruel messenger”'
    claim: 'One older reading: not only an angel of punishment; true also of a king''s officer sent against a rebel'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/17.htm'
    quote: 'one may not understand מלאך אכזרי, with the lxx, Jerome, and Luther, directly and exclusively of an angel of punishment.'
  - where: 'note 17:11 “A cruel messenger”'
    claim: 'One older reading: the proverb is true whether God sends a heavenly messenger or an earthly king an officer'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/17.htm'
    quote: 'but the proverb is so meant, that it is not the less true if an earthly king sends out against a rebellious multitude a messenger with an unlimited commission, or an officer against a single man dangerous to the state'

  - where: 'note 17:14 “Letting out water”'
    claim: 'The verb means to separate, set free'
    key: bdb
    url: 'https://biblehub.com/hebrew/6362.htm'
    quote: 'מָּטַר verb separate, remove, set free'
  - where: 'note 17:14 “Letting out water”'
    claim: 'One older reading: the one who lets out water breaks through a dam or opens a sluice'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/17.htm'
    quote: 'it represents one who breaks through a water-dam, withdraws the restraint of the water, opens a sluice, and then emblematically the proverb says: thus conditioned is the beginning of a strife.'
  - where: 'note 17:14 “Letting out water”'
    claim: 'A modern translation: stop before the quarrel breaks out'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+17&version=NRSVUE'
    quote: 'The beginning of strife is like letting out water, so stop before the quarrel breaks out.'

  - where: 'note 17:17 “A friend and a brother”'
    claim: 'One older reading: a brother is more than a friend; the two lines are climactic; the friend is the true friend'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/17.htm'
    quote: 'Brother is more than friend, he stands to one nearer than a friend does … 17a and 17b are, according to this, related to each other climactically. The friend meant in 17a is a true friend.'
  - where: 'note 17:17 “A friend and a brother”'
    claim: 'One older reading: the friend shows himself loving “as a brother”; born for adversity means for the purpose of the need, to help bear it'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/17.htm'
    quote: 'Thus ל will be that of the purpose: for the purpose of the need, - not indeed to suffer (Job 5:7) on account of it, but to bear it in sympathy, and to help to bear it.'
  - where: 'note 17:17 “A friend and a brother”'
    claim: 'One older reading renders the second line “And as a brother is he born for adversity”'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/17.htm'
    quote: 'And as a brother is he born for adversity.'
  - where: 'note 17:17 “A friend and a brother”'
    claim: 'The Septuagint: brethren are born to be useful in distress'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/proverbs/17.htm'
    quote: '17Have thou a friend for every time, and let brethren be useful in distress; for on this account are they born.'
  - where: 'note 17:17 “A friend and a brother”'
    claim: 'A modern translation: kinsfolk are born to share adversity'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+17&version=NRSVUE'
    quote: 'A friend loves at all times, and kinsfolk are born to share adversity.'

  - where: 'note 17:19 “A high gate”'
    claim: 'The Hebrew word is an opening, doorway, entrance'
    key: bdb
    url: 'https://biblehub.com/hebrew/6607.htm'
    quote: 'opening, doorway, entrance; — absolute ׳פ Genesis 4:7 +, … suffix מִּתְחוֺ Proverbs 17:19'
  - where: 'note 17:19 “A high gate”'
    claim: 'A modern translation: builds a high threshold, invites broken bones'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+17&version=NRSVUE'
    quote: 'One who loves transgression loves strife; one who builds a high threshold invites broken bones.'
  - where: 'note 17:19 “A high gate”'
    claim: 'One older reading: the man who wants the door of his house high and splendid prepares the destruction of his house; quarrelsomeness and ostentation are both symptoms of selfishness'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/17.htm'
    quote: 'Zanksucht [quarrelsomeness] and Prunksucht [ostentation] are related as the symptoms of selfishness. … he who cannot have the door of his house high enough and splendid enough, prepares thereby for himself, against his will, the destruction of his house.'
  - where: 'note 17:19 “A high gate”'
    claim: 'The Septuagint: he that exalts his own house seeks ruin'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/proverbs/17.htm'
    quote: '(17:16A) He that exalts his own house seeks ruin; and he that turns aside from instruction shall fall into mischief.'

  - where: christ
    claim: 'The Church''s footnote at 17:3 points to Mal. 3:3 and D&C 128:24'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/17?lang=eng'
    quote: '“fining pot”: Mal. 3:3 (2–3); D&C 128:24.'
  - where: christ
    claim: 'The Church''s footnote at 17:9 points to D&C 64:9–10'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/17?lang=eng'
    quote: '“love”: D&C 64:9 (9–10).'
  - where: christ
    claim: 'Jesus applied the messenger of Mal. 3:1 to John the Baptist'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/11?lang=eng'
    quote: 'For this is he, of whom it is written, Behold, I send my messenger before thy face, which shall prepare thy way before thee.'
