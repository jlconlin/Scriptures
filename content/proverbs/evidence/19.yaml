chapter: 19
claims:
  - where: setting
    claim: 'Within the first collection, 19:4 is a slightly changed form of 14:20, 19:9 of 19:5; 19:12 shares a line with 20:2'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/1.htm'
    quote: 'proverbs slightly changed in their form of expression: Proverbs 10:1 equals Proverbs 15:20; Proverbs 14:20 equals Proverbs 19:4; Proverbs 16:2 equals Proverbs 21:2; Proverbs 19:5 equals Proverbs 19:9'
  - where: setting
    claim: '19:12 and 20:2 have one line almost the same'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/1.htm'
    quote: 'proverbs with one line almost the same: … Proverbs 19:12 equals Proverbs 20:2'
  - where: setting
    claim: '26:15 repeats 19:24 and 28:6 repeats 19:1, identical in meaning with changed expression; 27:15 is to be compared with 19:13'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/1.htm'
    quote: 'proverbs identical in meaning with somewhat changed expression: Proverbs 26:13 equals Proverbs 22:13; Proverbs 26:15 equals Proverbs 19:24; Proverbs 28:6 equals Proverbs 19:1'
  - where: setting
    claim: '27:15 set beside 19:13'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/1.htm'
    quote: 'cf. also Proverbs 27:15 with Proverbs 19:13.'
  - where: 'section 1 plain'
    claim: 'The one hastening with his feet misses the way or the goal (“sinneth”)'
    key: bdb
    url: 'https://biblehub.com/hebrew/2398.htm'
    quote: 'אָץ בְּרַגְּלַיִם חוֺטֵא Proverbs 19:2 one hastening with his feet misseth (the way or the goal)'
  - where: 'section 3 plain'
    claim: 'Verse 10: a fool cannot bear luxury'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/19.htm'
    quote: '"A fool cannot bear luxury: he becomes by it yet more foolish;'
  - where: 'section 3 plain'
    claim: 'Verse 11: discretion makes a man slow to anger, lengthening it before it breaks out'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/19.htm'
    quote: 'the discretion (intellectus or intelligentia; vid., regarding שׂכל, Proverbs 3:4) of a man extends his anger, i.e., brings it about that it continues long before it breaks out'
  - where: 'section 3 plain'
    claim: 'Verse 16: “despiseth his ways” means takes no heed to them'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/19.htm'
    quote: 'He that taketh no heed to his ways dies.'
  - where: 'section 5 plain'
    claim: 'Verse 22: what is desired in a man is kindness'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+19&version=ESV'
    quote: 'What is desired in a man is steadfast love, and a poor man is better than a liar.'
  - where: 'section 5 plain'
    claim: '19:25 is to be compared with 21:11'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/1.htm'
    quote: 'Proverbs 19:25 with Proverbs 21:11'
  - where: 'section 1 plain'
    claim: 'Verse 3: “fretteth” as rages; folly brings his way to ruin'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+19&version=ESV'
    quote: 'When a man''s folly brings his way to ruin, his heart rages against the Lord.'
  - where: 'note 19:7 “The saying with a third line”'
    claim: 'The text of 19:7 is mutilated; the Greek confirms 7c is what remains of a distich half lost'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/19.htm'
    quote: 'On the contrary, there certainly lies before us in Proverbs 19:7 a mutilated text.'
  - where: 'note 19:7 “The saying with a third line”'
    claim: 'The written text reads “not” and the margin “to him”'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/19.htm'
    quote: 'לא־המּה, or לו־המּה (vid., regarding the 15 Kers, לּו for לא, at Psalm 100:3)'
  - where: 'note 19:7 “The saying with a third line”'
    claim: 'Read with the margin: the poor man chases words that are all he gets'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/19.htm'
    quote: 'The meaning of the Kerı̂ would be: he (the poor man) hunts after mere words, which - but no actions corresponding to them - are for a portion to him.'
  - where: 'note 19:7 “The saying with a third line”'
    claim: 'Read as written: words that are nothing, the empty promises of brothers and friends'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/19.htm'
    quote: 'words which are not, i.e., which have nothing in reality corresponding to them, verba nihili, i.e., the empty assurances and promises of his brethren and friends (Fl.).'
  - where: 'note 19:7 “The saying with a third line”'
    claim: 'The Greek translation has four lines after 7ab, two more sayings'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/proverbs/19.htm'
    quote: '7Every one who hates his poor brother shall also be far from friendship. Good understanding will draw near to them that know it, and a sensible man will find it. He that does much harm perfects mischief; and he that used provoking words shall not escape.'
  - where: 'note 19:7 “The saying with a third line”'
    claim: 'One older reading finds the lost Hebrew line in the Greek, but hard to restore'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/19.htm'
    quote: 'Thus we have before us in that ὁ πολλὰ κακοποιῶν, κ.τ.λ., the line lost from the Heb. text; but it is difficult to restore it to the Heb.'
  - where: 'note 19:7 “The saying with a third line”'
    claim: 'A modern translation marks the Hebrew of 19:7 as uncertain'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+19:7,27&version=ESV;NRSVUE'
    quote: 'Proverbs 19:7 The meaning of the Hebrew sentence is uncertain'
  - where: 'note 19:7 “The saying with a third line”'
    claim: 'Another modern translation marks it uncertain and renders “When they call after them, they are not there”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+19:7,27&version=ESV;NRSVUE'
    quote: '19.7 Meaning of Heb uncertain'
  - where: 'note 19:7 “The saying with a third line”'
    claim: 'The same translation renders the last line “When they call after them, they are not there”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+19:7,27&version=ESV;NRSVUE'
    quote: 'When they call after them, they are not there.'
  - where: 'note 19:11 “Passing over a transgression”'
    claim: 'To pass over a transgression is to let it go by, forbearing revenge or punishment, especially of an offense against oneself'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/19.htm'
    quote: 'it is an honour to him to pass by a transgression (particularly that which affects himself), to let it go aside, i.e., to forbear revenge or punishment'
  - where: 'note 19:11 “Passing over a transgression”'
    claim: 'One older reading: Micah 7:18 uses the phrase of God''s own passing over of sin'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/19.htm'
    quote: 'thus also the divine πάρεσις (Romans 3:25) is designated by Micah 7:18'
  - where: 'note 19:11 “Passing over a transgression”'
    claim: 'Proverbs 19:11 has the verb ‘avar with ‘al pesha‘'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Prov.xml'
    quote: 'עֲבֹ֣ר'
  - where: 'note 19:11 “Passing over a transgression”'
    claim: 'Micah 7:18 has the same verb with ‘al pesha‘'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mic.xml'
    quote: 'וְ/עֹבֵ֣ר'
  - where: 'note 19:11 “Passing over a transgression”'
    claim: 'Brigham Young quoted 19:11 in counsel on an even temper (Student Manual 2-26)'
    key: ot-manual-proverbs
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-2?lang=eng'
    quote: 'but ‘the discretion of a man deferreth his anger; and it is his glory to pass over a transgression.’” (In Journal of Discourses, 11:136; see also Proverbs 19:11; 27:4.)'
  - where: 'note 19:13 “Rain that keeps dripping”'
    claim: '“Dropping” is a dropping of rain, used figuratively of a wife''s quarrels'
    key: bdb
    url: 'https://biblehub.com/hebrew/1812.htm'
    quote: 'דֶּ֫לֶף noun masculine a dropping (of rain, compare WetzstZPV xiv. 1891, 5), figurative דֶּלֶף טֹרֵד מִדְיְנֵי אִשָּׁה Proverbs 19:13'
  - where: 'note 19:13 “Rain that keeps dripping”'
    claim: 'A modern translation: a continual dripping of rain'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+19&version=NRSVUE'
    quote: 'and a wife’s quarreling is a continual dripping of rain.'
  - where: 'note 19:17 “A loan to the LORD”'
    claim: 'The verb is the one for lending; the lender to the LORD is one showing favor to the poor'
    key: bdb
    url: 'https://biblehub.com/hebrew/3867.htm'
    quote: 'cause to borrow, i.e. lend to'
  - where: 'note 19:17 “A loan to the LORD”'
    claim: 'BDB on 19:17'
    key: bdb
    url: 'https://biblehub.com/hebrew/3867.htm'
    quote: 'Proverbs 19:17 a lender to ׳י is one shewing favour to the poor.'
  - where: 'note 19:17 “A loan to the LORD”'
    claim: 'A modern translation: will be repaid in full'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+19&version=NRSVUE'
    quote: 'Whoever is kind to the poor lends to the Lord and will be repaid in full.'
  - where: 'note 19:17 “A loan to the LORD”'
    claim: 'The Church''s footnote sets the verse beside Mosiah 4:16–18'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/19?lang=eng'
    quote: '17b “poor”: Mosiah 4:16 (16–18).'
  - where: 'note 19:18 “Not to the point of death”'
    claim: 'The verb of the second line means to bring to a premature death'
    key: bdb
    url: 'https://biblehub.com/hebrew/4191.htm'
    quote: '4 bring to a premature death Proverbs 19:18; Proverbs 21:25.'
  - where: 'note 19:18 “Not to the point of death”'
    claim: 'A modern translation: do not set your heart on putting him to death'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+19&version=ESV'
    quote: 'Discipline your son, for there is hope; do not set your heart on putting him to death.'
  - where: 'note 19:18 “Not to the point of death”'
    claim: 'Another modern translation: do not set your heart on their destruction'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+19&version=NRSVUE'
    quote: 'Discipline your children while there is hope; do not set your heart on their destruction.'
  - where: 'note 19:24 “A hand in the dish”'
    claim: '“Bosom” renders a word for a dish, used also in 2 Kings 21:13 and Prov 26:15'
    key: bdb
    url: 'https://biblehub.com/hebrew/6747.htm'
    quote: 'צַלַּ֫חַת noun feminine dish; — 2 Kings 21:13 (simile), צַלָּ֑חַת Proverbs 19:24; Proverbs 26:15'
  - where: 'note 19:24 “A hand in the dish”'
    claim: 'The Greek translation read “bosom”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/proverbs/19.htm'
    quote: '24He that unjustly hides his hands in his bosom, will not even bring them up to his mouth.'
  - where: 'note 19:27 “Stop listening to instruction”'
    claim: 'The Hebrew reads: Cease, my son, to hear instruction, to depart from words of knowledge'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/19.htm'
    quote: '27 Cease, my son, to hear instruction, To depart from the words of knowledge.'
  - where: 'note 19:27 “Stop listening to instruction”'
    claim: 'One older reading: stop hearing instruction if you will only stray from it; a warning against hypocrisy, as in James 1:22–24'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/19.htm'
    quote: 'cease from hearing instruction if thou wilt make no other use of it than to depart, etc., i.e., cease to learn wisdom and afterwards to misuse it. The proverb is, as Ewald says, as "bloody irony;" but it is a dissuasive from hypocrisy'
  - where: 'note 19:27 “Stop listening to instruction”'
    claim: 'The warning is against the self-deception of James 1:22–24'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/19.htm'
    quote: 'a warning against the self-deception of which James 1:22-24 speaks'
  - where: 'note 19:27 “Stop listening to instruction”'
    claim: 'The word “instruction” (musar) always means discipline toward good, not teaching that misleads'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/19.htm'
    quote: 'but musar always means either discipline weaning from evil, or education leading to good.'
  - where: 'note 19:27 “Stop listening to instruction”'
    claim: 'A modern translation: Cease to hear instruction, and you will stray'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+19:7,27&version=ESV;NRSVUE'
    quote: 'and you will stray from the words of knowledge.'
  - where: 'note 19:27 “Stop listening to instruction”'
    claim: 'Another modern translation corrects the text, marking its meaning uncertain'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+19:7,27&version=ESV;NRSVUE'
    quote: '19.27 Cn: Meaning of Heb uncertain'
  - where: 'note 19:27 “Stop listening to instruction”'
    claim: 'One older reading takes 19:27 as the germ of the addresses to the son in chapters 1–9'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/1.htm'
    quote: 'One may regard Proverbs 19:27, cf. Proverbs 27:11, as the germ of the admonitory addresses to the son'
  - where: christ
    claim: 'One older reading: Micah 7:18, whose words 19:11 shares, designates the divine forbearance of Romans 3:25'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/19.htm'
    quote: 'thus also the divine πάρεσις (Romans 3:25) is designated by Micah 7:18'
  - where: christ
    claim: 'The Church''s footnote sets 19:17 beside King Benjamin''s sermon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/19?lang=eng'
    quote: '17b “poor”: Mosiah 4:16 (16–18).'
