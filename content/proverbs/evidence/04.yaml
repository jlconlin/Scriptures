chapter: 4
claims:
- where: 'setting'
  claim: 'Proverbs 1–9 is a father dispensing wisdom to his son or children; no son or child is named, and the proverbs are not generally thought personal to Solomon'
  key: allis-pike-words-wise
  url: 'https://rsc.byu.edu/give-ear-my-words/words-wise'
  quote: 'The first nine chapters employ the trope of a father dispensing wisdom to his son, or occasionally to his children, to form a discourse on wisdom. Though attributed to the famously wise King Solomon (Proverbs 1:1), these proverbs are not generally thought to be personal to him or his children. No son or child is named.'
- where: 'setting'
  claim: 'A new address begins at verse 20'
  key: delitzsch-proverbs
  url: 'https://biblehub.com/commentaries/kad/proverbs/4.htm'
  quote: 'The paternal admonition now takes a new departure:'
- where: 'thread'
  claim: 'The father urges the son to see his relationship with Wisdom as the most important thing in his life'
  key: ot-minute-proverbs-1-9
  url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
  quote: 'The father encourages his son to see his relationship with Wisdom as the most important aspect of his life.'
- where: 'section 3 plain'
  claim: 'Verse 23 can be rendered “from it flow the springs of life”; verse 26 “Keep straight the path of your feet”'
  key: nrsvue
  url: 'https://www.biblegateway.com/passage/?search=Proverbs+4&version=NRSVUE'
  quote: 'Keep your heart with all vigilance, for from it flow the springs of life. … Keep straight the path of your feet, and all your ways will be sure.'
- where: 'note 4:3 “Three generations of teaching”'
  claim: 'The father recites his own childhood and teaches his own father’s teachings to his son, drawing on the wisdom of generations'
  key: allis-pike-words-wise
  url: 'https://rsc.byu.edu/give-ear-my-words/words-wise'
  quote: 'The father teaches his own father’s teachings to his son. … The proverbial father taps into the wisdom of generations and asks his son, as his father had asked him, to “retain” in his “heart” the words they are teaching'
- where: 'note 4:3 “Three generations of teaching”'
  claim: 'Alma the Younger was steered aright only when he remembered his father’s teaching of Christ, and like the proverbial father uses the weight of generations'
  key: allis-pike-words-wise
  url: 'https://rsc.byu.edu/give-ear-my-words/words-wise'
  quote: 'It was only when Alma the Younger remembered the teachings of his father, Alma the Elder, that he was steered aright, that he called upon Christ.'
- where: 'note 4:3 “Three generations of teaching”'
  claim: 'Proverbs 4:3–4 is very similar to Alma’s instruction to Helaman in Alma 36:1; both are concerned with generational wisdom'
  key: sc-knowhy-744
  url: 'https://scripturecentral.org/knowhy/why-are-alma-s-instructions-to-his-sons-filled-with-proverbial-wisdom'
  quote: 'One further connection between Alma’s teachings and Proverbs is that both are concerned with generational wisdom. In Proverbs 4:3–4, the father relates, “I was my father’s son, tender and only beloved in the sight of my mother.'
- where: 'note 4:3 “Three generations of teaching”'
  claim: 'Proverbs 4:3–4 is very similar to Alma 36:1'
  key: sc-knowhy-744
  url: 'https://scripturecentral.org/knowhy/why-are-alma-s-instructions-to-his-sons-filled-with-proverbial-wisdom'
  quote: 'very similar to Alma’s instructions to his son Helaman to “give ear to my words; for I swear unto you, that inasmuch as ye shall keep the commandments of God ye shall prosper in the land” (Alma 36:1).'
- where: 'note 4:7 “The principal thing, or the beginning of wisdom”'
  claim: 'reshit means beginning or chief; at Prov. 4:7 BDB gives “chief thing”; the same noun is the “beginning” of knowledge in Prov. 1:7'
  key: bdb
  url: 'https://biblehub.com/hebrew/7225.htm'
  quote: 'noun feminine beginning, chief … wisdom Psalm 111:10, knowledge Proverbs 1:7 … absolute chief thing Proverbs 4:7 (of wisdom).'
- where: 'note 4:7 “The principal thing, or the beginning of wisdom”'
  claim: 'A modern translation reads “The beginning of wisdom is this: get wisdom”'
  key: nrsvue
  url: 'https://www.biblegateway.com/passage/?search=Proverbs+4&version=NRSVUE'
  quote: 'The beginning of wisdom is this: get wisdom, and whatever else you get, get insight.'
- where: 'note 4:7 “The principal thing, or the beginning of wisdom”'
  claim: 'Delitzsch reads the verse as saying the beginning of wisdom consists in getting it; the striving is itself the beginning'
  key: delitzsch-proverbs
  url: 'https://biblehub.com/commentaries/kad/proverbs/4.htm'
  quote: 'the father further explains that wisdom begins with the striving after it, and that this striving is itself its fundamental beginning'
- where: 'note 4:7 “The principal thing, or the beginning of wisdom”'
  claim: 'The preposition in 7b denotes price: give all for wisdom, as in Matt. 13:44, 46'
  key: delitzsch-proverbs
  url: 'https://biblehub.com/commentaries/kad/proverbs/4.htm'
  quote: 'The בּ denotes price: give all for wisdom (Matthew 13:46, Matthew 13:44); no price is too high, no sacrifice too great for it.'
- where: 'note 4:7 “The principal thing, or the beginning of wisdom”'
  claim: 'qanah means get, acquire; of wisdom only in Proverbs, including 4:5 and 4:7; elsewhere it means buy'
  key: bdb
  url: 'https://biblehub.com/hebrew/7069.htm'
  quote: 'd. of acquiring wisdom, knowledge (only Proverbs): Proverbs 1:5; Proverbs 4:5 (twice in verse); Proverbs 4:7 (twice in verse) … 2 elsewhere buy'
- where: 'note 4:7 “Understanding of what?”'
  claim: 'President Hinckley, First Counselor in the First Presidency, wrote on Prov. 4:7 in a First Presidency Message, Ensign, Aug. 1988'
  key: hinckley-getting-understanding
  url: 'https://www.churchofjesuschrist.org/study/ensign/1988/08/with-all-thy-getting-get-understanding?lang=eng'
  quote: 'First Presidency Message … By President Gordon B. Hinckley … First Counselor in the First Presidency'
- where: 'note 4:7 “Understanding of what?”'
  claim: 'As a missionary in England he saw the words at the London Central YMCA'
  key: hinckley-getting-understanding
  url: 'https://www.churchofjesuschrist.org/study/ensign/1988/08/with-all-thy-getting-get-understanding?lang=eng'
  quote: 'Over fifty years ago while serving in England as a missionary, I went to the London Central YMCA. … They were the words of Solomon: “With all thy getting get understanding.” (Prov. 4:7.)'
- where: 'note 4:7 “Understanding of what?”'
  claim: 'Hinckley asked “Understanding of what?” and answered'
  key: hinckley-getting-understanding
  url: 'https://www.churchofjesuschrist.org/study/ensign/1988/08/with-all-thy-getting-get-understanding?lang=eng'
  quote: 'Understanding of what? Understanding of ourselves, of the purposes of life, of our relationship to God who is our Father, of the great divinely given principles that for centuries have provided the sinew of man’s real progress!'
- where: 'note 4:7 “Understanding of what?”'
  claim: 'He called for an education of the heart beside secular learning, and named gratitude, virtue and faith'
  key: hinckley-getting-understanding
  url: 'https://www.churchofjesuschrist.org/study/ensign/1988/08/with-all-thy-getting-get-understanding?lang=eng'
  quote: 'There is need for another education, without which the substance of secular learning may lead only to destruction. I refer to the education of the heart, of the conscience, of the character, of the spirit'
- where: 'note 4:7 “Understanding of what?”'
  claim: 'The three principles are gratitude, virtue and faith'
  key: hinckley-getting-understanding
  url: 'https://www.churchofjesuschrist.org/study/ensign/1988/08/with-all-thy-getting-get-understanding?lang=eng'
  quote: 'The first principle is gratitude, the second is virtue, the third is faith.'
- where: 'note 4:8 “Loving Wisdom”'
  claim: 'Because wisdom is personified as a woman, the son is to love, exalt and embrace her, and she reciprocates'
  key: ot-minute-proverbs-1-9
  url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
  quote: 'Because wisdom is personified as a woman, the son is encouraged to maintain a loving relationship with her. … The more he invests in his relationship with Wisdom, the more she will reciprocate'
- where: 'note 4:8 “Loving Wisdom”'
  claim: 'The relationship is with God and one’s family, not a disembodied ideal'
  key: ot-minute-proverbs-1-9
  url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
  quote: 'This relationship, however, is not a relationship to a disembodied ideal but rather a relationship with God and one’s family.'
- where: 'note 4:18 “Light that grows to full day”'
  claim: 'nogah is the brightness of a clear, sunshiny day; at 4:18 “a light of brightness”'
  key: bdb
  url: 'https://biblehub.com/hebrew/5051.htm'
  quote: 'brightness of a (clear, sunshiny) day Amos 5:10 … so ׳וְאֹרַח צַדִּיקִים כְּאוֺר נ Proverbs 4:18 the path of righteous men is like a light of brightness.'
- where: 'note 4:18 “Light that grows to full day”'
  claim: 'In the Bible the word means the early dawn, the light that keeps growing brighter'
  key: delitzsch-proverbs
  url: 'https://biblehub.com/commentaries/kad/proverbs/4.htm'
  quote: 'when used in the Bible it means the early dawn, the light of the rising sun, the morning light … The light of this morning sunshine is הולך ואור, going and shining, i.e., becoming ever brighter.'
- where: 'note 4:18 “Light that grows to full day”'
  claim: 'The “perfect day” is midday, when the day’s clearness is at its height; the verse is a figure of gradual development'
  key: delitzsch-proverbs
  url: 'https://biblehub.com/commentaries/kad/proverbs/4.htm'
  quote: 'It is the midday time that is meant, when the clearness of the day has reached its fullest intensity … there is no biblical passage which presents like these two a figure of gradual development.'
- where: 'note 4:18 “Light that grows to full day”'
  claim: 'A modern translation reads “like the light of dawn … until full day”'
  key: nrsvue
  url: 'https://www.biblegateway.com/passage/?search=Proverbs+4&version=NRSVUE'
  quote: 'But the path of the righteous is like the light of dawn, which shines brighter and brighter until full day. The way of the wicked is like deep darkness; they do not know what they stumble over.'
- where: 'note 4:18 “Light that grows to full day”'
  claim: 'Those on the path of the just can see things as they are'
  key: ot-minute-proverbs-1-9
  url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
  quote: 'On the other hand, “the path of the just,” or the path of the righteous, is one that is bright, and those who walk it can see things as they are.'
- where: 'note 4:18 “Light that grows to full day”'
  claim: 'Brigham Young said the belief that the Christian life is full of torment is a mistake, citing Prov. 4:18'
  key: ot-manual-proverbs
  url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-2?lang=eng'
  quote: 'His path is supposed to be spread with gins [snares], pitfalls, and uncertainties, but this is a mistake, for ‘the path of the just is as the shining light, that shineth more and more unto the perfect day,’'
- where: 'note 4:18 “Light that grows to full day”'
  claim: 'Brigham Young: his faith gave him light for darkness'
  key: ot-manual-proverbs
  url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-2?lang=eng'
  quote: '“The faith I have embraced has given me light for darkness, ease for pain, joy and gladness for sorrow and mourning, certainty for uncertainty, hope for despair.” (In Journal of Discourses, 9:318; see also Proverbs 4:18; 12:13.)'
- where: 'note 4:20 “Ear, eyes, heart, mouth, feet”'
  claim: 'Commentators note the many parts of the body named in verses 20–27; the father cautions the son to be diligent and deliberate'
  key: ot-minute-proverbs-1-9
  url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
  quote: 'In the last verses of the chapter (verses 20–27), commentators have noted the many parts of the body that are singled out … The father cautions the son to be diligent and deliberate in walking the path of life.'
- where: 'note 4:20 “Ear, eyes, heart, mouth, feet”'
  claim: 'One reading: the many ways to go wrong, with an echo of King Benjamin, Mosiah 4:29–30'
  key: ot-minute-proverbs-1-9
  url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
  quote: 'On the one hand, we can see this as pointing out the many ways we can go wrong. We hear an echo of King Benjamin’s caution'
- where: 'note 4:20 “Ear, eyes, heart, mouth, feet”'
  claim: 'The other reading: the power of the body and of agency to do good, with D&C 58:27–28'
  key: ot-minute-proverbs-1-9
  url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
  quote: 'On the other hand, we can read this as a reminder of the power of our bodies and the God-given power of agency to do good. We can think of Doctrine and Covenants 58:27–28'
- where: 'section 3 plain'
  claim: 'Verse 23: above all other things that are to be guarded, keep thy heart'
  key: delitzsch-proverbs
  url: 'https://biblehub.com/commentaries/kad/proverbs/4.htm'
  quote: '23 Above all other things that are to be guarded, keep thy heart,'
- where: 'note 4:23 “The heart as a spring”'
  claim: 'In the Old Testament the heart is often what we call the mind'
  key: ot-minute-proverbs-1-9
  url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
  quote: 'In the Old Testament, the heart is often equivalent to what we consider today to be the mind.'
- where: 'note 4:23 “The heart as a spring”'
  claim: 'In older English, “issue” is the act of flowing out, as water from a spring'
  key: webster-1828
  url: 'https://webstersdictionary1828.com/Dictionary/issue'
  quote: 'The act of passing or flowing out; a moving out of any inclosed place; egress; applied to water or other fluid … We say, an issue of water from a pipe, from a spring, or from a river'
- where: 'note 4:23 “The heart as a spring”'
  claim: 'totsa’ot means outgoings, extremity (as of a border); at 4:23 “sources of life”'
  key: bdb
  url: 'https://biblehub.com/hebrew/8444.htm'
  quote: 'noun feminine outgoing, extremity, source (?),escape … 1 outgoing, extremity of border of territory … 2 חַיִּים ׳ת Proverbs 4:23 (? read מוֺצְאוֺת) sources of life.'
- where: 'note 4:23 “The heart as a spring”'
  claim: 'A modern translation reads “from it flow the springs of life”'
  key: nrsvue
  url: 'https://www.biblegateway.com/passage/?search=Proverbs+4&version=NRSVUE'
  quote: 'Keep your heart with all vigilance, for from it flow the springs of life.'
- where: 'note 4:26 “Ponder: weigh, or make level”'
  claim: 'In older English, ponder means to weigh in the mind'
  key: webster-1828
  url: 'https://webstersdictionary1828.com/Dictionary/ponder'
  quote: '1. To weigh in the mind; to consider and compare the circumstances or consequences of an event'
- where: 'note 4:26 “Ponder: weigh, or make level”'
  claim: 'palas means weigh or make level; with a path as object, make level, smooth, at Prov. 4:26'
  key: bdb
  url: 'https://biblehub.com/hebrew/6424.htm'
  quote: 'verb Pi`el denominative weigh, make level … 2 make level, smooth (compare Gerber32), with accusative of path (figurative), מַעְגָּל Proverbs 4:26'
- where: 'note 4:26 “Ponder: weigh, or make level”'
  claim: 'Delitzsch: the word here means to level, to prepare the way by removing obstacles, and Heb. 12:13 follows the Septuagint’s rendering'
  key: delitzsch-proverbs
  url: 'https://biblehub.com/commentaries/kad/proverbs/4.htm'
  quote: 'The admonition thus refers not to the careful consideration which measures the way leading to the goal which one wishes to reach, but to the preparation of the way by the removal of that which prevents unhindered progress'
- where: 'note 4:26 “Ponder: weigh, or make level”'
  claim: 'Remove moral hindrances to make right steps, as the Septuagint, quoted in Heb. 12:13, translates'
  key: delitzsch-proverbs
  url: 'https://biblehub.com/commentaries/kad/proverbs/4.htm'
  quote: 'We must remove all that can become a moral hindrance or a dangerous obstacle, in our life-course, in order that we may make right steps with our feet, as the lxx (Hebrews 12:13) translate.'
- where: 'note 4:26 “Ponder: weigh, or make level”'
  claim: 'A modern translation reads “Keep straight the path of your feet”'
  key: nrsvue
  url: 'https://www.biblegateway.com/passage/?search=Proverbs+4&version=NRSVUE'
  quote: 'Keep straight the path of your feet, and all your ways will be sure.'
- where: 'christ'
  claim: 'The Church’s footnotes set 4:22 beside Matt. 19:17 and 4:18 beside 2 Ne. 31:18'
  key: lds-scriptures
  url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/4?lang=eng'
  quote: '“path”: 2 Ne. 31:18 (17–21).'
- where: 'christ'
  claim: 'The Church’s footnote sets 4:22 beside Matt. 19:17'
  key: lds-scriptures
  url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/4?lang=eng'
  quote: '“life”: Matt. 19:17.'
- where: 'christ'
  claim: 'Alma the Younger called on Christ when he remembered his father’s teaching'
  key: allis-pike-words-wise
  url: 'https://rsc.byu.edu/give-ear-my-words/words-wise'
  quote: 'It was only when Alma the Younger remembered the teachings of his father, Alma the Elder, that he was steered aright, that he called upon Christ.'
- where: 'explore'
  claim: 'Allis-Pike reads Alma 36–39 through the lens of Proverbs 1–9, including generational wisdom'
  key: allis-pike-words-wise
  url: 'https://rsc.byu.edu/give-ear-my-words/words-wise'
  quote: 'When seen through the lens of Proverbs 1–9, Alma’s teachings to his sons in Alma 36–39 become deeper and more meaningful.'
- where: 'explore'
  claim: 'The Church’s footnote to “hold” in verse 13 points to 1 Ne. 15:24'
  key: lds-scriptures
  url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/4?lang=eng'
  quote: '“hold”: 1 Ne. 15:24 (23–24).'
- where: 'note 4:18 “Light that grows to full day”'
  claim: 'Proverbs speaks of two paths: wisdom and righteousness to life and light, folly and wickedness to death and darkness, citing 4:14–19'
  key: ot-minute-proverbs
  url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-overview'
  quote: 'the book of Proverbs talks about two paths: wisdom and righteousness lead to the path of life and light, while folly and wickedness lead to the path of death and darkness.[fn]See, for example, Proverbs 1:15; 4:14–19; 5:3–6.'
- where: 'section 1 plain'
  claim: 'The grandfather’s quoted words run through verse 9 in a modern translation'
  key: nrsvue
  url: 'https://www.biblegateway.com/passage/?search=Proverbs+4&version=NRSVUE'
  quote: 'he taught me and said to me, “Let your heart hold fast my words; keep my commandments and live.'
- where: 'note 4:26 “Ponder: weigh, or make level”'
  claim: 'The Septuagint (Brenton) reads “Make straight paths for thy feet” at 4:26'
  key: lxx-rahlfs
  url: 'https://biblehub.com/sep/proverbs/4.htm'
  quote: 'Make straight paths for thy feet, and order thy ways aright.'
