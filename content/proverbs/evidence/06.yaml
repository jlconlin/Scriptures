chapter: 6
claims:
  - where: setting
    claim: 'One Latter-day Saint reading divides Proverbs 1–9 into ten instructions and five interludes; all the interludes but C praise wisdom'
    key: von-feldt-instructional-wisdom
    url: 'https://interpreterfoundation.org/journal/his-secret-is-with-the-righteous-instructional-wisdom-in-the-book-of-mormon'
    quote: 'Proverbs 1–9 is composed of ten instructions, also known as lectures, discourses, or admonitions, which are interspersed with five interludes or hymns (table 1). The interludes, with the exception of C, elaborate a similar theme: the persistence and excellence of wisdom.'
  - where: setting
    claim: 'Interlude C is 6:1–19, four epigrams on folly and evil'
    key: von-feldt-instructional-wisdom
    url: 'https://interpreterfoundation.org/journal/his-secret-is-with-the-righteous-instructional-wisdom-in-the-book-of-mormon'
    quote: 'Interlude C 6:1–19 Four epigrams on folly and evil'
  - where: setting
    claim: '6:20–35 is an instruction titled “Adultery kills”'
    key: von-feldt-instructional-wisdom
    url: 'https://interpreterfoundation.org/journal/his-secret-is-with-the-righteous-instructional-wisdom-in-the-book-of-mormon'
    quote: 'Instruction IX 6:20–35 Adultery kills'
  - where: setting
    claim: '6:20–35 is one of the lectures on the strange woman, with 2:16–22, 5:1–13 and 7:1–27'
    key: von-feldt-instructional-wisdom
    url: 'https://interpreterfoundation.org/journal/his-secret-is-with-the-righteous-instructional-wisdom-in-the-book-of-mormon'
    quote: 'Lectures on the strange woman include Proverbs 2:16–22, 5:1–13, 6:20–35, and 7:1–27.'
  - where: setting
    claim: '6:10–11 return word for word at 24:33–34'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/24?lang=eng'
    quote: 'Yet a little sleep, a little slumber, a little folding of the hands to sleep: So shall thy poverty come as one that travelleth; and thy want as an armed man.'

  - where: 'note 6:1 “Surety: a pledge for another’s debt”'
    claim: 'Striking hands is the gesture that ratified a pledge to become surety'
    key: bdb
    url: 'https://biblehub.com/hebrew/8628.htm'
    quote: 'also (late) of gesture ratifying a bargain, specifically pledging oneself to become surety, only Proverbs (all "" עַרַב)'
  - where: 'note 6:1 “Surety: a pledge for another’s debt”'
    claim: '“Humble thyself” renders a verb meaning to stamp oneself down, become a suppliant'
    key: bdb
    url: 'https://biblehub.com/hebrew/7511.htm'
    quote: 'Hithpa`el (stamp oneself down, then figurative), Imperative masculine singular הִתְרַמֵּס Proverbs 6:3 humble thyself, become a suppliant'
  - where: 'note 6:1 “Surety: a pledge for another’s debt”'
    claim: '“Make sure thy friend” renders a verb meaning to beset, importune'
    key: bdb
    url: 'https://biblehub.com/hebrew/7292.htm'
    quote: 'Imperative רְהַב רֵעֶ(י)ךָ Proverbs 6:3 beset, importune, thy friend'
  - where: 'note 6:1 “Surety: a pledge for another’s debt”'
    claim: 'Surety makes one liable for a friend’s financial choices; cosigning as a modern analogy; the NET rendering of 6:3'
    key: ot-minute-proverbs-1-9
    url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
    quote: 'Doing so makes one liable and responsible for a friend’s financial choices. Perhaps a modern analogy would be cosigning on a credit card or line of credit … “Go, humble yourself, and appeal firmly to your neighbor.”'

  - where: 'note 6:6 “The sluggard sent to the ant”'
    claim: 'The ant knows to work in summer and harvest; lack attacks the sleeper like an armed man; the broader principle'
    key: ot-minute-proverbs-1-9
    url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
    quote: 'Even the ant knows that one must work hard in summer and in harvest to survive. … will find that their lack will attack them like “an armed man” (verse 11). Certainly, this is a lesson against laziness, but the broader principle is that doing hard things provides benefits in the long term.'
  - where: 'note 6:6 “The sluggard sent to the ant”'
    claim: 'The wake-up call of 6:9 is set beside King Benjamin’s “awakened” (Mosiah 4:5) as a shared wisdom motif'
    key: von-feldt-instructional-wisdom
    url: 'https://interpreterfoundation.org/journal/his-secret-is-with-the-righteous-instructional-wisdom-in-the-book-of-mormon'
    quote: 'Awake “If the knowledge of the goodness of God at this time has awakened you” (Mosiah 4:5) “How long wilt thou sleep, O sluggard? When wilt thou arise out of thy sleep?” (Proverbs 6:4, 9–11; compare Proverbs 20:12–13)'
  - where: 'note 6:6 “The sluggard sent to the ant”'
    claim: '6:10–11 return word for word at 24:33–34'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/24?lang=eng'
    quote: 'Yet a little sleep, a little slumber, a little folding of the hands to sleep: So shall thy poverty come as one that travelleth; and thy want as an armed man.'

  - where: 'note 6:12 ““Naughty”: a man of Belial”'
    claim: 'Beliyya‘al is a compound of “not” and “worth”: worthlessness, good for nothing'
    key: bdb
    url: 'https://biblehub.com/hebrew/1100.htm'
    quote: 'worthlessness (compound בְּלִי not, without and יַעַל worth, use, profit) — ׳בּ Deuteronomy 13:14 20t.; בְּלִיָּ֑עַל Psalm 101:3 5t.; — the quality of being useless, good for nothing.'
  - where: 'note 6:12 ““Naughty”: a man of Belial”'
    claim: 'The same word names base fellows elsewhere, including the sons of 1 Samuel 2:12; the lexicon lists Proverbs 6:12'
    key: bdb
    url: 'https://biblehub.com/hebrew/1100.htm'
    quote: 'worthless, good-for-nothing, base fellows 1 Samuel 25:25 … ׳בְּנֵי ב Deuteronomy 13:14; Judges 19:22; Judges 20:13; 1 Samuel 2:12 … אָדָם בְּלִיַּעַל Proverbs 6:12.'

  - where: 'note 6:13 “Signals behind the words”'
    claim: 'Winking is the deceiver’s sign to accomplices against a third person'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/6.htm'
    quote: 'the action of the deceiver, who thereby gives the sign to others that they help or at least do not hinder him from bantering and mocking, belying and deceiving a third person'
  - where: 'note 6:13 “Signals behind the words”'
    claim: '“Speaketh with his feet” read as scraping the feet to give a sign'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/6.htm'
    quote: 'it means one who scrapes with his feet, draws them backwards and forwards on the ground in order thereby to give a sign to others'

  - where: 'note 6:16 “Six, yea, seven”'
    claim: 'The six-then-seven form adds power and conveys completeness; Agur uses it again'
    key: ot-manual-proverbs
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-2?lang=eng'
    quote: 'This “Recalling of what has been said, in order to correct it as by an Afterthought” is a literary device often used by Hebrew writers to add beauty and power to expressions and to convey the idea of completeness'
  - where: 'note 6:16 “Six, yea, seven”'
    claim: 'President J. Reuben Clark Jr. on 6:16–19: “We add these to the Ten Commandments.”'
    key: ot-manual-proverbs
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-2?lang=eng'
    quote: 'President J. Reuben Clark, Jr., quoted these verses and commented: “I read these to show you that the Lord has not left us in doubt nor in darkness as to the things, some of them, that we should not do. We add these to the Ten Commandments.”'
  - where: 'note 6:16 “Six, yea, seven”'
    claim: 'The form is called number parallelism; examples in Proverbs 30 and Amos 1'
    key: parry-number-parallelism
    url: 'https://rsc.byu.edu/preserved-translation/number-parallelism'
    quote: 'Examples in biblical poetry and prophecy are Proverbs 30:18–19, 20–23, 29–31 and Amos 1:3, 6, 9, 11, 13.'
  - where: 'note 6:16 “Six, yea, seven”'
    claim: 'Each abomination concerns relationships with others; false witness is graver than lying'
    key: ot-minute-proverbs-1-9
    url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
    quote: 'Each of the abominations are about one’s relationship with others. … Bearing false witness (a graver crime than lying) and sowing discord tear at the fabric of communities.'

  - where: 'note 6:26 “A loaf of bread, and a precious life”'
    claim: 'The Hebrew reads “because of a harlot to a piece of bread”; the NRSVUE, comparing Greek, Syriac, Latin and Targum, reads the harlot’s fee; the second line is the wife of another'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%206%3A26&version=NRSVUE'
    quote: 'for a prostitute’s fee is only a loaf of bread, but the wife of another stalks a man’s precious life. … 6.26 Cn Compare Gk Syr Vg Tg: Heb for because of a harlot to a piece of bread'
  - where: 'note 6:26 “A loaf of bread, and a precious life”'
    claim: 'The ESV reads a price, with an alternative rendering in its footnote comparing the versions; the second line is a married woman'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%206%3A26&version=ESV'
    quote: 'for the price of a prostitute is only a loaf of bread, but a married woman hunts down a precious life. … Or (compare Septuagint, Syriac, Vulgate) for a prostitute leaves a man with nothing but a loaf of bread'
  - where: 'note 6:26 “A loaf of bread, and a precious life”'
    claim: 'The Septuagint reads the harlot’s value as one loaf'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/proverbs/6.htm'
    quote: 'For the value of a harlot is as much as of one loaf; and a woman hunts for the precious souls of men.'

  - where: 'note 6:31 “The thief can pay; the adulterer cannot”'
    claim: 'Sevenfold restitution is unknown in the law, which asks two-, four- and fivefold; read as paying superabundantly, even the whole house'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/6.htm'
    quote: 'a sevenfold compensation of the thing stolen is unheard of in the Israelitish law; it knows only of a twofold, fourfold, fivefold restoration … may make compensation sevenfold, i.e., superabundantly; he may give up the whole possessions'
  - where: 'note 6:31 “The thief can pay; the adulterer cannot”'
    claim: 'Theft can be made good; adultery cannot'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/6.htm'
    quote: 'theft may be made good, and that abundantly; but adultery and its consequences are irreparable.'
  - where: 'note 6:31 “The thief can pay; the adulterer cannot”'
    claim: 'The “ransom” (kofer) is the means by which non-punishment would be obtained'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/6.htm'
    quote: 'here it is used of the כּפר, i.e., the means by which covering, i.e., non-punishment, pardon of the crime, impunity of the guilty, is obtained.'

  - where: christ
    claim: 'A few Old Testament passages join light and life, 6:23 among them, given as examples for “the light and the life of the world” (3 Ne. 11:11)'
    key: sc-knowhy-341
    url: 'https://scripturecentral.org/knowhy/what-can-we-learn-from-the-saviors-first-words-at-bountiful'
    quote: 'A few passages in the Old Testament combine “light” and “life.” For example, “For with thee is the foundation of life: in thy light shall we see light” (Psalms 36:9); “the law is light; and reproofs of instruction are the way of life” (Proverbs 6:23)'
  - where: christ
    claim: 'One older reading: 6:25 is in the spirit of Matthew 5:28'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/6.htm'
    quote: 'The warning 25a is in the spirit of the "thou shalt not covet," Exodus 20:17, and the ἐν τῇ καρδίᾳ αὑτοῦ, Matthew 5:28, of the Preacher on the Mount.'
  - where: christ
    claim: 'The commandments of 6:22 read as scripture that talks back to those who study it with questions'
    key: ot-minute-proverbs-1-9
    url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
    quote: 'Spending time reading and rereading the scriptures diligently and prayerfully allows God to speak to us through the words of the scriptures. Those who have taken time to ask questions as they study the scriptures have found that they truly do talk back.'
