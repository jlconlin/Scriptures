chapter: 3
claims:
- where: "setting"
  claim: "Proverbs 3:1–12 is the third instruction of Proverbs 1–9"
  key: "von-feldt-instructional-wisdom"
  url: 'https://interpreterfoundation.org/journal/his-secret-is-with-the-righteous-instructional-wisdom-in-the-book-of-mormon'
  quote: 'Instruction III 3:1–12 The wisdom of piety'

- where: "setting"
  claim: "Verses 13–20 are an interlude in praise of Wisdom"
  key: "von-feldt-instructional-wisdom"
  url: 'https://interpreterfoundation.org/journal/his-secret-is-with-the-righteous-instructional-wisdom-in-the-book-of-mormon'
  quote: 'Interlude B 3:13–20 In praise of Wisdom'

- where: "setting"
  claim: "Verses 21–35 return to the father's admonition"
  key: "ot-minute-proverbs-1-9"
  url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
  quote: 'This section refers to the father’s admonition to his son to remember his commandments (Proverbs 3:1–3).'

- where: "setting"
  claim: "The father's “my law” joins heeding an earthly father with heeding the Heavenly Father"
  key: "ot-minute-proverbs-1-9"
  url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
  quote: 'The father calls this advice “my law” (Proverbs 3:1), which makes a connection between heeding one’s earthly father and heeding one’s Heavenly Father.'

- where: "setting"
  claim: "Hebrews quotes verses 11–12"
  key: "lds-scriptures"
  url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/12?lang=eng'
  quote: 'My son, despise not thou the chastening of the Lord, nor faint when thou art rebuked of him:'

- where: "setting"
  claim: "Come, Follow Me titles the week on Proverbs with verse 6"
  key: "cfm-ot-2026-37"
  url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/37?lang=eng'
  quote: 'September 7–13. “He Shall Direct Thy Paths”: Proverbs 1–4; 15–16; 22; 31; Ecclesiastes 1–3; 11–12'

- where: "thread"
  claim: "Life is always better, if not always perfect, when one trusts and follows the Lord"
  key: "cfm-ot-2026-37"
  url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/37?lang=eng'
  quote: 'Life is always better—if not always perfect—when we trust and follow the Lord Jesus Christ.'

- where: "thread"
  claim: "Each admonition in the opening verses comes with its result"
  key: "delitzsch-proverbs"
  url: 'https://biblehub.com/commentaries/kad/proverbs/3.htm'
  quote: 'the counsellor wishes, with the good to which he advises, at the same time to present its good results.'

- where: "thread"
  claim: "Verses 11–12 turn from prosperity to adversity"
  key: "delitzsch-proverbs"
  url: 'https://biblehub.com/commentaries/kad/proverbs/3.htm'
  quote: 'The contrast here follows. As God should not be forgotten in days of prosperity, so one should not suffer himself to be estranged from Him by days of adversity.'

- where: "thread"
  claim: "Verses 19–20 give the Lord's creation as the model of wisdom"
  key: "ot-minute-proverbs-1-9"
  url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
  quote: 'In this section, the quest to find wisdom in order to build and provide for a household finds its model in the Lord’s creative efforts.'

- where: "thread"
  claim: "Verses 23–24 safety on the road and in sleep; 27–32 care for the community"
  key: "ot-minute-proverbs-1-9"
  url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
  quote: 'He will not stumble on the path of life (verse 23), and when he lies down to sleep at home he will not fear (verse 24). The father then offers advice to his son, encouraging him to care for those in his community (verses 27–32).'

- where: "thread"
  claim: "The chapter closes with the contrast of the wise and fools"
  key: "delitzsch-proverbs"
  url: 'https://biblehub.com/commentaries/kad/proverbs/3.htm'
  quote: 'This group of the proverbs of wisdom now suitably closes with the fundamental contrast between the wise and fools:'

- where: "section 1 plain"
  claim: "“Mercy and truth” rendered as loyalty and faithfulness"
  key: "ot-minute-proverbs-1-9"
  url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
  quote: 'we might translate this as, “Let not loyalty and faithfulness forsake thee.”'

- where: "section 1 plain"
  claim: "“Direct” means make straight"
  key: "bdb"
  url: 'https://biblehub.com/hebrew/3474.htm'
  quote: 'figurative, with דֶּרֶךְ make smooth or straight, i.e. free from obstacles, successful'

- where: "section 1 plain"
  claim: "“Navel” taken as the body"
  key: "bdb"
  url: 'https://biblehub.com/hebrew/8270.htm'
  quote: 'שָׁרֶּ֑ךָ Proverbs 3:8 (De and others navel, synechd. for body'

- where: "section 5 plain"
  claim: "“Them to whom it is due” is the one who has a right to the good"
  key: "delitzsch-proverbs"
  url: 'https://biblehub.com/commentaries/kad/proverbs/3.htm'
  quote: 'We must refuse nothing good (nothing either legally or morally good) to him who has a right to it'

- where: "section 5 plain"
  claim: "“His secret” as the Lord's confidence"
  key: "bdb"
  url: 'https://biblehub.com/hebrew/5475.htm'
  quote: 'counsel itself, מחשׁבות באין סוד Proverbs 15:22 thoughts without counsel; of intimate friendship'

- where: 'note 3:3 “Worn at the neck, written on the heart”'
  claim: "Ḥesed is a loving disposition toward God or people"
  key: "delitzsch-proverbs"
  url: 'https://biblehub.com/commentaries/kad/proverbs/3.htm'
  quote: 'well-affectedness, it may be of God toward men, or of men toward God, or of men toward one another - a loving disposition'

- where: 'note 3:3 “Worn at the neck, written on the heart”'
  claim: "ʾĕmet is standing to one's promises"
  key: "delitzsch-proverbs"
  url: 'https://biblehub.com/commentaries/kad/proverbs/3.htm'
  quote: 'continuance, a standing to one''s promises, and not falsifying just expectations; thus fidelity'

- where: 'note 3:3 “Worn at the neck, written on the heart”'
  claim: "“Them” refers to the two virtues, not the precepts"
  key: "delitzsch-proverbs"
  url: 'https://biblehub.com/commentaries/kad/proverbs/3.htm'
  quote: 'The suffix ם does not refer to the doctrine and the precepts, but to these two cardinal virtues.'

- where: 'note 3:3 “Worn at the neck, written on the heart”'
  claim: "Binding about the neck recalls the signet worn on a string at the neck"
  key: "delitzsch-proverbs"
  url: 'https://biblehub.com/commentaries/kad/proverbs/3.htm'
  quote: 'but to the signet which was wont to be constantly carried (Genesis 38:18, cf. Sol 8:6) on a string around the neck.'

- where: 'note 3:3 “Worn at the neck, written on the heart”'
  claim: "The lines recall the phylacteries of Deut. 6:8, the outward form of what is required within; the tablet; Jer. 31:33"
  key: "delitzsch-proverbs"
  url: 'https://biblehub.com/commentaries/kad/proverbs/3.htm'
  quote: 'put us in mind of the Tephillim (phylacteries), Exodus 13:16; Deuteronomy 6:8; Deuteronomy 11:18, in which what is here a figure is presented in external form, but as the real figure of that which is required in the inward parts.'

- where: 'note 3:3 “Worn at the neck, written on the heart”'
  claim: "To write on the tablet of the heart is to impress the virtues so that one is moved from within"
  key: "delitzsch-proverbs"
  url: 'https://biblehub.com/commentaries/kad/proverbs/3.htm'
  quote: 'to write love and fidelity on the tablet of the heart, is to impress deeply on the heart the duty of both virtues, so that one will be impelled to them from within outward (Jeremiah 31:33).'

- where: 'note 3:3 “Worn at the neck, written on the heart”'
  claim: "A Latter-day Saint rendering: loyalty and faithfulness"
  key: "ot-minute-proverbs-1-9"
  url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
  quote: 'we might translate this as, “Let not loyalty and faithfulness forsake thee.”'

- where: 'note 3:5 “Leaning on the Lord”'
  claim: "šāʿan means lean, support oneself; figuratively trust"
  key: "bdb"
  url: 'https://biblehub.com/hebrew/8172.htm'
  quote: '[שָׁעַן] verb Niph`al lean, support oneself'

- where: 'note 3:5 “Leaning on the Lord”'
  claim: "Figurative leaning is trust"
  key: "bdb"
  url: 'https://biblehub.com/hebrew/8172.htm'
  quote: 'lean (figurative = trust) upon, עַל person king Isaiah 10:20'

- where: 'note 3:5 “Leaning on the Lord”'
  claim: "Allis-Pike sets 3:5 and 3:7 beside Alma's warning to Shiblon"
  key: "allis-pike-words-wise"
  url: 'https://rsc.byu.edu/give-ear-my-words/words-wise'
  quote: 'Like the proverbial father who says, “Trust in the Lord with all thine heart; and lean not unto thine own understanding” (Proverbs 3:5), and further, “Be not wise in thine own eyes; fear the Lord, and depart from evil” (3:7), Alma understands Shiblon is susceptible to the pull of pride.'

- where: 'note 3:5 “Leaning on the Lord”'
  claim: "Shiblon must not think his wisdom self-generated"
  key: "allis-pike-words-wise"
  url: 'https://rsc.byu.edu/give-ear-my-words/words-wise'
  quote: 'he must guard against the tendency to believe his wisdom or his strength are self-generated rather than gifts from an all-wise God.'

- where: 'note 3:5 “Leaning on the Lord”'
  claim: "Von Feldt sets 3:5 beside Corianton's boasting of his own wisdom"
  key: "von-feldt-instructional-wisdom"
  url: 'https://interpreterfoundation.org/journal/his-secret-is-with-the-righteous-instructional-wisdom-in-the-book-of-mormon'
  quote: 'Last comes Corianton in Alma 39–42, who has boasted of his own wisdom (39:2; compare Proverbs 3:5: “Lean not unto thine own understanding”).'

- where: 'note 3:5 “Leaning on the Lord”'
  claim: "President Tanner often quoted 3:5–7"
  key: "ot-manual-proverbs"
  url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-2?lang=eng'
  quote: 'President N. Eldon Tanner often quoted Proverbs 3:5–7.'

- where: 'note 3:5 “Leaning on the Lord”'
  claim: "Tanner: be prepared to acknowledge many things one cannot understand"
  key: "ot-manual-proverbs"
  url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-2?lang=eng'
  quote: 'He must be prepared to acknowledge that there are certain things—many, many things—that he cannot understand.'

- where: 'note 3:6 “Know Him, and the straight path”'
  claim: "The verb behind “acknowledge” is yada, to know"
  key: "strongs-concordance"
  url: 'https://biblehub.com/hebrew/3045.htm'
  quote: 'yada: To know, to perceive, to understand, to acknowledge'

- where: 'note 3:6 “Know Him, and the straight path”'
  claim: "The verb behind “direct” means make smooth or straight; free from obstacles; used of the highway in Isa. 40:3"
  key: "bdb"
  url: 'https://biblehub.com/hebrew/3474.htm'
  quote: 'make smooth, straight, accusative מְסִלָּה Isaiah 40:3; הֲדוּרִים Isaiah 45:2; figurative, with דֶּרֶךְ make smooth or straight, i.e. free from obstacles, successful'

- where: 'note 3:6 “Know Him, and the straight path”'
  claim: "The form in Prov. 3:6 is the Piel imperfect yĕyaššēr"
  key: "bdb"
  url: 'https://biblehub.com/hebrew/3474.htm'
  quote: 'Imperfect יְיַשֵּׁר Proverbs 3:6'

- where: 'note 3:8 “Health to the navel”'
  claim: "šōr is the navel-string; used of the newborn in Ezek. 16:4; the Greek reads “body”; others read “flesh”"
  key: "bdb"
  url: 'https://biblehub.com/hebrew/8270.htm'
  quote: 'noun [masculine] navel-string (compare Aramaic שׁוּרָא Ezekiel 16:4'

- where: 'note 3:8 “Health to the navel”'
  claim: "BDB lists Prov. 3:8 as questioned, with the Greek “body” and the reading “thy flesh”"
  key: "bdb"
  url: 'https://biblehub.com/hebrew/8270.htm'
  quote: 'questioned are: שָׁרֶּ֑ךָ Proverbs 3:8 (De and others navel, synechd. for body, "" עַצְמוֺתֶתךָ; ᵐ5 τῷ σώματι; σου, compare ᵑ6, Clericus Bi Frankenb בְּשָֽׂרְךָ'

- where: 'note 3:8 “Health to the navel”'
  claim: "Brenton's Septuagint: health to thy body"
  key: "lxx-rahlfs"
  url: 'https://biblehub.com/sep/proverbs/3.htm'
  quote: '8Then shall there be health to thy body, and good keeping to thy bones.'

- where: 'note 3:8 “Health to the navel”'
  claim: "Davis: the fear of the Lord gives health to the navel and marrow to the bones"
  key: "ot-minute-proverbs-1-9"
  url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
  quote: 'so shall the “fear of the Lord” provide “health to the navel and marrow to thy bones” (verse 8).'

- where: 'note 3:9 “Firstfruits and full barns”'
  claim: "Firstfruits regarded as belonging to God, offered at the feasts"
  key: "bd-firstfruits"
  url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/firstfruits?lang=eng'
  quote: 'Regarded as belonging to God, and offered by the nation as a whole at the great feasts, and by private individuals at other times (Ex. 22:29; 23:19; 34:26).'

- where: 'note 3:9 “Firstfruits and full barns”'
  claim: "Delitzsch: surprising that wisdom commends tithes; the duty is older than the Mosaic law"
  key: "delitzsch-proverbs"
  url: 'https://biblehub.com/commentaries/kad/proverbs/3.htm'
  quote: 'It may surprise us that the Chokma, being separated from the ceremonial law, here commends the giving of tithes. But in the first place, the consciousness of the duty of giving tithes is older than the Mosaic law, Genesis 28:22'

- where: 'note 3:9 “Firstfruits and full barns”'
  claim: "Delitzsch compares the promise of verse 10 with Malachi 3:10–12"
  key: "delitzsch-proverbs"
  url: 'https://biblehub.com/commentaries/kad/proverbs/3.htm'
  quote: 'Cf. the same admonition and promise in the prophetic statement of Malachi 3:10-12.'

- where: 'note 3:9 “Firstfruits and full barns”'
  claim: "Davis: honoring the Lord with substance includes caring for the poor"
  key: "ot-minute-proverbs-1-9"
  url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
  quote: 'Because our relationship with the Lord is bound up in our relationships with others, honoring the Lord with our substance is not just offering sacrifice but also taking care of the poor.'

- where: 'note 3:9 “Firstfruits and full barns”'
  claim: "Davis: the promise of full barns for giving seems paradoxical"
  key: "ot-minute-proverbs-1-9"
  url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
  quote: 'Such a lifestyle seems paradoxical—how could we have our barns filled if we offer our substance to God and to others?'
- where: 'note 3:9 “Firstfruits and full barns”'
  claim: "Davis: life is full by using substance to care for others"
  key: "ot-minute-proverbs-1-9"
  url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
  quote: 'The only way that our lives can be full is by using our substance to care for others.'

- where: 'note 3:11 “The Lord’s correction”'
  claim: "The Greek of 3:11: nor faint when thou art rebuked of him"
  key: "lxx-rahlfs"
  url: 'https://biblehub.com/sep/proverbs/3.htm'
  quote: '11My son, despise not the chastening of the Lord; nor faint when thou art rebuked of him:'

- where: 'note 3:11 “The Lord’s correction”'
  claim: "The Greek of 3:12: scourges every son whom he receives"
  key: "lxx-rahlfs"
  url: 'https://biblehub.com/sep/proverbs/3.htm'
  quote: '12for whom the Lord loves, he rebukes, and scourges every son whom he receives.'

- where: 'note 3:11 “The Lord’s correction”'
  claim: "Hebrews quotes the Septuagint's wording"
  key: "lds-scriptures"
  url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/12?lang=eng'
  quote: 'For whom the Lord loveth he chasteneth, and scourgeth every son whom he receiveth.'

- where: 'note 3:11 “The Lord’s correction”'
  claim: "Christofferson on Hebrews 12:6: rejoice that God corrects us"
  key: "christofferson-chasten"
  url: 'https://www.churchofjesuschrist.org/study/general-conference/2011/04/as-many-as-i-love-i-rebuke-and-chasten?lang=eng'
  quote: 'Paul said of divine correction or chastening, “For whom the Lord loveth he chasteneth” (Hebrews 12:6). Though it is often difficult to endure, truly we ought to rejoice that God considers us worth the time and trouble to correct.'

- where: 'note 3:11 “The Lord’s correction”'
  claim: "Davis: not every adversity comes from wrongdoing"
  key: "ot-minute-proverbs-1-9"
  url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
  quote: 'Not every adversity comes because we have done something wrong, and God is not the author of every difficulty in our lives.'

- where: 'note 3:18 “A tree of life”'
  claim: "Davis: wisdom leads forward to the tree of life; not back to the garden"
  key: "ot-minute-proverbs-1-9"
  url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
  quote: 'Proverbs 3:18 implies that true knowledge, or wisdom, will lead to life. We cannot find the tree of life by going backwards to the garden; we will only find it by moving forward'

- where: 'note 3:18 “A tree of life”'
  claim: "Davis: Adam and Eve denied the tree; Alma 12, 32–34, the tree growing within"
  key: "ot-minute-proverbs-1-9"
  url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
  quote: 'teaches that inviting Jesus Christ into our lives will allow the tree of life to grow within us (see Alma 12; 32–34).'

- where: 'note 3:18 “A tree of life”'
  claim: "KnoWhy 325: Proverbs 3 joins wisdom and the tree of life; Lehi's fruit brought happiness"
  key: "sc-knowhy-325"
  url: 'https://scripturecentral.org/knowhy/why-did-lehi-quote-from-a-psalm-of-repentance-in-his-dream'
  quote: 'Taking into consideration Proverbs 3, we see that the ancient Israelites saw a relationship between wisdom and the tree of life.'

- where: 'note 3:18 “A tree of life”'
  claim: "Von Feldt sets 3:15 and 3:18 beside Lehi's tree, desirable above all other fruit"
  key: "von-feldt-instructional-wisdom"
  url: 'https://interpreterfoundation.org/journal/his-secret-is-with-the-righteous-instructional-wisdom-in-the-book-of-mormon'
  quote: 'This calls to mind the visions of Lehi and Nephi in the Book of Mormon. When Lehi sees the tree of life, he knows that the “fruit [is] desirable to make one happy.”'

- where: 'note 3:18 “A tree of life”'
  claim: "Nephi never personifies wisdom; his interpretation is the love of God"
  key: "von-feldt-instructional-wisdom"
  url: 'https://interpreterfoundation.org/journal/his-secret-is-with-the-righteous-instructional-wisdom-in-the-book-of-mormon'
  quote: 'For his part, Nephi in interpreting his and his father’s visions never overtly describes the tree of life as a woman or a goddess. He never personifies wisdom at all.'

- where: 'note 3:18 “A tree of life”'
  claim: "Nephi's language of holding fast and of paths shared with Proverbs 1–9"
  key: "von-feldt-instructional-wisdom"
  url: 'https://interpreterfoundation.org/journal/his-secret-is-with-the-righteous-instructional-wisdom-in-the-book-of-mormon'
  quote: 'He also interprets for his brothers the other symbols related to the tree, introducing terminology and concepts that are shared with Proverbs 1–9. He explains, for example, that those who hold fast to the word of God (the iron rod) that leads to the tree will “never perish'

- where: 'note 3:19 “Built by wisdom”'
  claim: "God as divine architect; wisdom is skill, used of artisanship; Bezaleel"
  key: "ot-minute-proverbs-1-9"
  url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
  quote: 'God is described as a divine architect that uses wisdom in building both heaven and earth. Because wisdom is not just knowledge but also the ability to apply it, it is often used to describe creative endeavors such as artisanship and design.'

- where: 'note 3:19 “Built by wisdom”'
  claim: "The cosmos as God's house, provided with water"
  key: "ot-minute-proverbs-1-9"
  url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
  quote: 'Because architectural terms are used to describe the construction of heaven and earth, the cosmos is implied to be God’s divine house. God not only built His home with wisdom but also provided it with water so life can thrive'

- where: 'note 3:19 “Built by wisdom”'
  claim: "Davis links 3:19–20 with 24:3–4; households built with wisdom follow God's pattern"
  key: "ot-minute-proverbs-1-9"
  url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
  quote: 'This image of God as a divine architect who builds a house and then provides for it is connected to Proverbs 24:3–4'

- where: 'note 3:19 “Built by wisdom”'
  claim: "Davis: God modeled our household-building through wisdom"
  key: "ot-minute-proverbs-1-9"
  url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
  quote: 'God modeled our efforts to build a household and provide for it through wisdom.'

- where: 'note 3:19 “Built by wisdom”'
  claim: "Bezaleel filled with the spirit of God in wisdom for the tabernacle"
  key: "ot-minute-proverbs-1-9"
  url: 'https://scripturecentral.org/archive/books/book-chapter/proverbs-1-9'
  quote: 'Bezaleel was chosen to do this because God “filled him with the spirit of God, in wisdom, in understanding, and in knowledge, and in all manner of workmanship” (Exodus 31:3).'

- where: 'note 3:27 “Good owed to a neighbor”'
  claim: "ba'al: lord, master, owner; KJV renders it “those to whom it is due”"
  key: "strongs-concordance"
  url: 'https://biblehub.com/hebrew/1167.htm'
  quote: 'baal: Lord, master, owner, husband, Baal'

- where: 'note 3:27 “Good owed to a neighbor”'
  claim: "Delitzsch: the one to whom the good is done, who is worthy of it, who has a right to it"
  key: "delitzsch-proverbs"
  url: 'https://biblehub.com/commentaries/kad/proverbs/3.htm'
  quote: 'but him to whom the good deed is done (cf. Proverbs 17:8), i.e., as here, him who is worthy of it'

- where: 'note 3:27 “Good owed to a neighbor”'
  claim: "Delitzsch: refuse nothing good to him who has a right to it"
  key: "delitzsch-proverbs"
  url: 'https://biblehub.com/commentaries/kad/proverbs/3.htm'
  quote: 'We must refuse nothing good (nothing either legally or morally good) to him who has a right to it'

- where: 'note 3:27 “Good owed to a neighbor”'
  claim: "“Go, and come again” does not mean go home but come back"
  key: "delitzsch-proverbs"
  url: 'https://biblehub.com/commentaries/kad/proverbs/3.htm'
  quote: 'לך ושׁוּב does not mean: forth! go home again! but: go, and come again.'

- where: 'note 3:27 “Good owed to a neighbor”'
  claim: "Von Feldt pairs Mosiah 4:21 with Proverbs 3:27"
  key: "von-feldt-instructional-wisdom"
  url: 'https://interpreterfoundation.org/journal/his-secret-is-with-the-righteous-instructional-wisdom-in-the-book-of-mormon'
  quote: 'Impart substance to your neighbor “Ye ought to impart of the substance that ye have one to another” (Mosiah 4:21) “Withhold not good from them to whom it is due” (Proverbs 3:27)'

- where: 'note 3:27 “Good owed to a neighbor”'
