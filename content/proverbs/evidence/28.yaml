chapter: 28
claims:
  - where: setting
    claim: 'One older reading: a series of sayings beginning with a participle starts at 28:7'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/28.htm'
    quote: 'This verse continues a series of proverbs (commencing in Proverbs 28:7) beginning with a participle'
  - where: setting
    claim: 'The group 28:12–20 closes with a saying about riches, as the group before it does'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/28.htm'
    quote: 'We take Proverbs 28:12-20 together. A proverb regarding riches closes this group, as also the foregoing is closed'
  - where: setting
    claim: 'A new group begins at 28:21, whose first line repeats 24:23'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/28.htm'
    quote: 'With a proverb, in the first half of which is repeated the beginning of the second appendix, Proverbs 24:23, a new group commences'
  - where: setting
    claim: 'In the Hezekiah collection the kingdom is seen almost only on its dark side: tyranny (28:15–16) and multiplied authorities (28:2)'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/1.htm'
    quote: 'the kingdom is seen almost only (with exception of Proverbs 29:14) on its dark side, and is represented under the destructive dominion of tyranny (Proverbs 28:15-16; Proverbs 29:2)'

  - where: thread
    claim: 'The first line of 28:28 is a variation of the second line of 28:12'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/28.htm'
    quote: 'Line first is a variation of 12b.'
  - where: thread
    claim: 'The two ways of 28:6 and 28:18 are the evil way truly walked and the good way pretended'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/28.htm'
    quote: 'The two ways דּדכים (cf. Sir. 2:12 ...) are, as Proverbs 28:18, not ways going aside to the right or to the left of the right way, but the evil way which the deceiver truly walks in, and the good way which he pretends to walk in'

  - where: 'section 1 plain'
    claim: 'In 28:2 a single man of understanding and knowledge holds the state together for a long time'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/28.htm'
    quote: 'a single man who unites in himself sound understanding and higher knowledge, for a long time holds it together.'
  - where: 'section 1 plain'
    claim: '28:6 is a variation of 19:1'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/28.htm'
    quote: 'A variation of Proverbs 19:1.'

  - where: 'section 2 plain'
    claim: 'In 28:11 the poor man of understanding sees through the rich man'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/28.htm'
    quote: 'if he has anything to do with a poor man who has intelligence, then he is seen through by him.'

  - where: 'section 3 plain'
    claim: 'One older reading: in 28:14 the object of the fear is sin'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/28.htm'
    quote: 'Aben Ezra makes God the object; but rather we are to regard sin as the object, for while the truly pious is one that "fears God," he is at the same time one that "feareth evil."'
  - where: 'section 3 plain'
    claim: 'The “pit” of 28:17 is the grave'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/28.htm'
    quote: 'till at last the grave (בור according to the Eastern, i.e., the Babylonian, mode of writing בּר) receives him'
  - where: 'section 3 plain'
    claim: '28:19 says the same as 12:11 in other words'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/1.htm'
    quote: 'proverbs identical in meaning with somewhat changed expression: ... Proverbs 28:6 equals Proverbs 19:1; Proverbs 28:19 equals Proverbs 12:11'

  - where: 'section 4 plain'
    claim: 'The first line of 28:21 repeats 24:23'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/28.htm'
    quote: 'With a proverb, in the first half of which is repeated the beginning of the second appendix, Proverbs 24:23'
  - where: 'section 4 plain'
    claim: 'The “morsel of bread” of 28:21 is a trifle that draws a man aside from what is right'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/28.htm'
    quote: '"even a trifle, a morsel of bread (1 Samuel 2:36), may, as it awakens favour and dislike within us, thus in general call forth in the will an inclination tending to draw one aside from the line of strict rectitude."'
  - where: 'section 4 plain'
    claim: 'The man with an evil eye (28:22) is envious, grudging and covetous'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/28.htm'
    quote: 'רע עין (Proverbs 23:6) is the jealous, envious, grudging, and at the same time covetous man.'

  - where: 'section 5 plain'
    claim: 'The one who hides his eyes (28:27) veils them so as not to see the misery of the poor'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/28.htm'
    quote: 'He, on the other hand, who veils ... his eyes so as not to see the misery which calls forth compassion'
  - where: 'section 5 plain'
    claim: 'The first line of 28:28 is a variation of the second line of 28:12'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/28.htm'
    quote: 'Line first is a variation of 12b.'

  - where: 'note 28:1 “Fleeing when no one pursues”'
    claim: 'The Church’s footnote at 28:1 points to Lev. 26:17'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/28?lang=eng'
    quote: '1a “flee”: Lev. 26:17; Amos 9:1.'

  - where: 'note 28:3 “A poor man, or a ruler?”'
    claim: 'The Hebrew word is the participle of rush, to be poor'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Prov.xml'
    quote: 'רָ֭שׁ'
  - where: 'note 28:3 “A poor man, or a ruler?”'
    claim: 'A modern translation keeps “a poor person”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+28&version=NRSVUE'
    quote: 'A poor person who oppresses the poor is a beating rain that leaves no food.'
  - where: 'note 28:3 “A poor man, or a ruler?”'
    claim: 'Another modern translation reads “a ruler”'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Proverbs+28&version=NIV'
    quote: 'A ruler who oppresses the poor is like a driving rain that leaves no crops.'
  - where: 'note 28:3 “A poor man, or a ruler?”'
    claim: 'One older reading: “a poor man” (gever rash) has no parallel; the book says simply rash; the man is the head'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/28.htm'
    quote: 'explain: a man (or master equals גּביר) is the head (cf. e.g., Judges 11:8), and oppresses the helpless. This rendering is probable, because גּבר רשׁ, a poor man, is a combination of words without a parallel'
  - where: 'note 28:3 “A poor man, or a ruler?”'
    claim: 'Phoenician spells the word for head with the same letters'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/28.htm'
    quote: 'The Phoen. writes רש (i.e., רשׁ, rus); vid., Schrder''s Phnizische Gram. p. 133; cf. Gesen. Thes. under ראשׁ.'
  - where: 'note 28:3 “A poor man, or a ruler?”'
    claim: 'A sweeping rain only destroys; those under a master expect good from him'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/28.htm'
    quote: 'A "sweeping rain" is one which has only that which is bad, and not that which is good in rain, for it only destroys instead of promoting the growth of the corn'
  - where: 'note 28:3 “A poor man, or a ruler?”'
    claim: 'One under a master expects good from him'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/28.htm'
    quote: 'one who belongs to a master, or who is in any way subordinated to him, has before all to expect from him that which is good'

  - where: 'note 28:4 “Whose law?”'
    claim: 'Torah means direction, instruction, law'
    key: bdb
    url: 'https://biblehub.com/hebrew/8451.htm'
    quote: 'direction, instruction, law'
  - where: 'note 28:4 “Whose law?”'
    claim: 'BDB lists 28:4, 7, 9 under human instruction of sages, beside that of a mother and a father'
    key: bdb
    url: 'https://biblehub.com/hebrew/8451.htm'
    quote: 'a. human: of a mother Proverbs 1:8; Proverbs 6:20,23; of a father Proverbs 3:1; Proverbs 4:2; Proverbs 7:2; of sages Proverbs 13:14; Proverbs 28:4 (twice in verse); Proverbs 28:7,9'
  - where: 'note 28:4 “Whose law?”'
    claim: 'One older reading: in 28:4 those who praise the wicked turn from the revealed word of God'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/28.htm'
    quote: 'They who praise the godless turn away from the revealed word of God (Psalm 73:11-15)'
  - where: 'note 28:4 “Whose law?”'
    claim: 'At 28:7 torah includes the father’s instruction'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/28.htm'
    quote: 'We have translated תורה at Proverbs 28:4 by "law;" here it includes the father''s instruction regarding the right way of life.'
  - where: 'note 28:4 “Whose law?”'
    claim: 'At 28:9 the reading compares 15:8 and 1 Sam. 15:22; the prayer is hollow because the whole soul is not present'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/28.htm'
    quote: 'Cf. Proverbs 15:8 and the argument 1 Samuel 15:22. ... for the whole soul, the whole will of the suppliant, is not present'

  - where: 'note 28:5 “Understanding all things”'
    claim: 'One older reading: those who seek God gain knowledge of what is morally right in every situation'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/28.htm'
    quote: 'he whose end is the one living God, gains from that, in every situation of life, even amid the greatest difficulties, the knowledge of that which is morally right.'
  - where: 'note 28:5 “Understanding all things”'
    claim: 'The same reading sets 1 John 2:20 beside the verse, and calls the knowledge human and relative'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/28.htm'
    quote: 'Similarly the Apostle John (1 John 2:20): "ye have an unction from the Holy One, and ye know all things" ... and obviously a human relative knowledge, that is here meant.'

  - where: 'note 28:8 “Usury”'
    claim: 'In 1828 usury had formerly meant any legal interest'
    key: webster-1828
    url: 'https://webstersdictionary1828.com/Dictionary/usury'
    quote: 'Usury formerly denoted any legal interest, but in this sense, the word is no longer in use.'
  - where: 'note 28:8 “Usury”'
    claim: 'Lev. 25:35–37 forbids usury and interest from a brother; neshek is interest in money, tarbit interest in kind'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/28.htm'
    quote: 'Leviticus 25:35-37, where an Israelite is forbidden to take usury and interest from his brother, the two are distinguished; and Fleischer rightly remarks that there נשׁך means usury or interest taken in money, and תרבית usury or interest taken in kind'
  - where: 'note 28:8 “Usury”'
    claim: 'Interest in kind: one gives back more grain or oil than received'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/28.htm'
    quote: 'of that which one has received in loan, such as grain, or oil, etc., he gives back more than he has received.'
  - where: 'note 28:8 “Usury”'
    claim: 'Such wealth does not stay with its gatherer but passes to one merciful to the poor (cf. 13:22)'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/28.htm'
    quote: 'Wealth increased by covetous plundering of a neighbour does not remain with him who has scraped it together in so relentless a manner ... but it goes finally into the possession of one who is merciful towards the poor ... (cf. Proverbs 13:22'

  - where: 'note 28:13 “Confess and forsake”'
    claim: 'Confession is a key element of repentance (D&C 58:43); not a mechanical requirement or an ordinance'
    key: kimball-confession
    url: 'https://byustudies.byu.edu/article/confession-in-lds-doctrine-and-practice'
    quote: 'A key element of repentance is confession: “By this ye may know if a man repenteth of his sins—behold, he will confess them and forsake them” (D&C 58:43). ... Confession is not a mechanical requirement, nor is it an ordinance, like baptism.'
  - where: 'note 28:13 “Confess and forsake”'
    claim: 'Confession is made to a bishop, to God or to those offended; pride and fear prevent it'
    key: kimball-confession
    url: 'https://byustudies.byu.edu/article/confession-in-lds-doctrine-and-practice'
    quote: 'confession either to a bishop, to God, or to offended parties is a concomitant of the change of heart that constitutes true repentance and results in reconciliation with God. Pride and fear prevent confession'
  - where: 'note 28:13 “Confess and forsake”'
    claim: 'D&C 58:60 makes a similar statement to 58:43'
    key: kimball-confession
    url: 'https://byustudies.byu.edu/article/confession-in-lds-doctrine-and-practice'
    quote: '58:43 (a sign of repentance is confession and forsaking sins). Similar statements are found in 58:60 and 61:2.'
  - where: 'note 28:13 “Confess and forsake”'
    claim: 'The article sets Prov. 28:13 among the Bible’s teaching on confession'
    key: kimball-confession
    url: 'https://byustudies.byu.edu/article/confession-in-lds-doctrine-and-practice'
    quote: 'In whatever manner, sins must be brought to light and purged. The wisdom of Proverbs admonishes: “He that covereth his sins shall not prosper: but whoso confesseth and forsaketh them shall have mercy” (Prov. 28:13).'
  - where: 'note 28:13 “Confess and forsake”'
    claim: 'Text of D&C 58:43 and 58:60'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/58?lang=eng'
    quote: 'for he confesseth them not, and he thinketh to hide them.'

  - where: 'note 28:17 “The murderer’s flight”'
    claim: 'One older reading: the murderer flees the avenger of blood, his punishment and his own torment until the grave receives him'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/28.htm'
    quote: 'Whoever is inwardly bowed down by the blood of a man whom he has murdered, betakes himself to a ceaseless flight to escape the avenger of blood, the punishment of his guilt, and his own inward torment'
  - where: 'note 28:17 “The murderer’s flight”'
    claim: '“Let no man stay him” forbids giving him support or refuge, not laying hold of him'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/28.htm'
    quote: 'that one should not afford him any support, any refuge, any covering or security against the vengeance which pursues him; that one should not rescue him from the arm of justice'
  - where: 'note 28:17 “The murderer’s flight”'
    claim: 'The book elsewhere urges saving a life where possible (24:11)'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/28.htm'
    quote: 'on the other side, the Book of Prov; Proverbs 24:11., has uttered its exhortation to save a human life whenever it is possible to do so.'
  - where: 'note 28:17 “The murderer’s flight”'
    claim: 'Grace cannot take the place of justice until justice is recognised'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/28.htm'
    quote: 'Grace cannot come into the place of justice till justice has been fully recognised.'
  - where: 'note 28:17 “The murderer’s flight”'
    claim: 'The footnote gives “flee to the sepulchre (grave)”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/28?lang=eng'
    quote: '17b “flee to the pit”: OR flee to the sepulchre (grave); i.e., flee to death.'

  - where: 'note 28:17 “The murderer’s flight”'
    claim: 'The same reading allows that the line may state what cannot be done rather than give a command'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/28.htm'
    quote: 'it may also be a declaration of that which is impossible: only let no one support him, let no one seek to deliver him from the unrest which drives him from place to place.'

  - where: christ
    claim: 'The Church’s footnote at 28:13 points to 1 John 1:10 and D&C 1:3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/28?lang=eng'
    quote: '13a “covereth”: Job 31:33; Luke 12:2 (1–3); 1 Jn. 1:10; D&C 1:3; 121:37 (36–38).'
  - where: christ
    claim: 'D&C 58:42: the Lord forgives and remembers the sins no more'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/58?lang=eng'
    quote: 'Behold, he who has repented of his sins, the same is forgiven, and I, the Lord, remember them no more.'

  - where: explore
    claim: 'Hosea 8:4 shows a land with many rulers set up apart from God'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/28.htm'
    quote: 'and Hosea 8:4 : "They set up kings, but not by me; they have made princes, and I knew it not."'
  - where: explore
    claim: 'Jer. 22:13–19 confirms the proverb about princes (28:16)'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/28.htm'
    quote: 'A confirmation of this proverb directing itself to princes if found in Jeremiah 22:13-19, the woe pronounced upon Jehoiakim.'
