chapter: 25
claims:
  - where: setting
    claim: 'The second collection of Solomon’s proverbs begins at 25:1 and runs through chapter 29'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/1.htm'
    quote: 'The Proverbs of Solomon begin again at Proverbs 25:1; and this second large section (corresponding to the first, 10:1-22:16) extends to chap. 29.'
  - where: setting
    claim: 'Chapters 25–29 are the proverbs of Solomon recorded by the men of Hezekiah'
    key: gs-proverb
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/proverb?lang=eng'
    quote: 'Chapters 25–29 contain the proverbs of Solomon that the men of Hezekiah, king of Judah, recorded.'
  - where: setting
    claim: 'One older reading: figurative proverbs are nearly absent from the first collection and prevail in the second'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/1.htm'
    quote: 'in the first collection the figurative proverbs are almost entirely wanting, while in the second collection, chap. 25-29, on the contrary, they prevail.'
  - where: setting
    claim: 'One older reading: the Hezekiah collection is a people’s book that starts from the duties of the king'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/1.htm'
    quote: 'the second is a people''s book suited to the time of Hezekiah ("Solomon''s Wisdom in Hezekiah''s days," as Stier has named it), and therefore it takes its start not, like the first, from the duties of the child, but from those of the king.'
  - where: setting
    claim: 'The second collection begins with a series of sayings about the king'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/1.htm'
    quote: 'in the second collection, which immediately begins with a series of the king''s sayings, the kingdom is seen almost only (with exception of Proverbs 29:14) on its dark side'
  - where: setting
    claim: 'The reason in 25:7 agrees with the Savior’s counsel in Luke 14:10'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/25.htm'
    quote: 'The reason given in Proverbs 25:7 harmonizes with the rule of wisdom, Luke 14:10.'
  - where: setting
    claim: 'Paul quotes 25:21–22 in Romans 12:20'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/25.htm'
    quote: 'Paul cites therefrom Romans 12:20.'
  - where: setting
    claim: 'The Church’s footnote at 25:7 points to Luke 14'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/25?lang=eng'
    quote: '“Come”: Luke 14:10 (7–14).'

  - where: thread
    claim: 'Paul quotes the saying about feeding an enemy'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/25.htm'
    quote: 'Paul cites therefrom Romans 12:20.'

  - where: 'section 2 plain'
    claim: 'With the dross removed, the smith has material for a vessel'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/25.htm'
    quote: 'So there is ready a vessel for the goldsmith;'
  - where: 'section 3 plain'
    claim: '“Discover not” means do not reveal'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/25?lang=eng'
    quote: 'OR do not reveal.'
  - where: 'section 3 plain'
    claim: 'The “false gift” of 25:14 is a gift boasted of and never given'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2025&version=NRSVUE'
    quote: 'is one who boasts of a gift never given.'
  - where: 'section 3 plain'
    claim: 'The false gift is a deceitful pretence, a promise not kept'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/25.htm'
    quote: 'so מתת שׁקר is a gift which amounts to a lie, i.e., a deceitful pretence. Rightly Jerome: vir gloriosus et promissa non complens.'
  - where: 'section 3 plain'
    claim: '“Long forbearing” is patience; the “prince” is a ruler'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2025&version=NRSVUE'
    quote: 'With patience a ruler may be persuaded, and a soft tongue can break bones.'
  - where: 'section 4 plain'
    claim: 'The “maul” is a war club'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2025&version=NRSVUE'
    quote: 'Like a war club, a sword, or a sharp arrow'
  - where: 'section 6 plain'
    claim: '25:24 repeats 21:9'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/25?lang=eng'
    quote: '“dwell”: Prov. 21:9, 19.'

  - where: 'note 25:1 “Copied out by Hezekiah’s men”'
    claim: 'Hezekiah was king of Judah and a reformer who suppressed idolatry and restored the temple services'
    key: bd-hezekiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hezekiah?lang=eng'
    quote: 'King of Judah, and a great religious and political reformer (2 Kgs. 18:1–21:3; 2 Chr. 29:1–33:3; Isa. 36–39). He suppressed idolatry and reconstituted the temple services.'
  - where: 'note 25:1 “Copied out by Hezekiah’s men”'
    claim: 'Isaiah assisted Hezekiah in his reforms'
    key: bd-hezekiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hezekiah?lang=eng'
    quote: 'In his reforms both in church and state he had the assistance of the great prophet Isaiah.'
  - where: 'note 25:1 “Copied out by Hezekiah’s men”'
    claim: 'Hezekiah reigned in the late eighth century BC'
    key: allis-pike-words-wise
    url: 'https://rsc.byu.edu/give-ear-my-words/words-wise-alma-36-39-through-lens-proverbs-1-9'
    quote: 'Proverbs reports that Hezekiah and his men “copied out” some of the proverbs of Solomon during Hezekiah’s reign as king of Judah in the late eighth century BC (Proverbs 25:1).'
  - where: 'note 25:1 “Copied out by Hezekiah’s men”'
    claim: 'Allis-Pike: some proverbs may have been on the brass plates'
    key: allis-pike-words-wise
    url: 'https://rsc.byu.edu/give-ear-my-words/words-wise-alma-36-39-through-lens-proverbs-1-9'
    quote: 'Since Lehi did not leave Jerusalem until around 600 BC, it is plausible that some proverbs were recorded on the brass plates.'
  - where: 'note 25:1 “Copied out by Hezekiah’s men”'
    claim: 'The Hebrew verb in 25:1 is he‘tiqu'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Prov.xml'
    quote: 'הֶ֝עְתִּ֗יקוּ'
  - where: 'note 25:1 “Copied out by Hezekiah’s men”'
    claim: 'The verb means move, proceed, advance'
    key: bdb
    url: 'https://biblehub.com/hebrew/6275.htm'
    quote: '[עָתֵק] verb move, proceed, advance'
  - where: 'note 25:1 “Copied out by Hezekiah’s men”'
    claim: 'In 25:1, a very late use, it means to transcribe from one roll to another'
    key: bdb
    url: 'https://biblehub.com/hebrew/6275.htm'
    quote: '3 very late Proverbs 25:1 transcribe (remove from one book or roll to another; ᵐ5 ἐξεγράψαντο, ᵑ9 transtulerunt'
  - where: 'note 25:1 “Copied out by Hezekiah’s men”'
    claim: 'The Greek reads “the friends of Ezekias … copied out”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/proverbs/25.htm'
    quote: 'These are the miscellaneous instructions of Solomon, which the friends of Ezekias king of Judea copied out.'

  - where: 'note 25:2 “What God conceals and the king searches out”'
    claim: 'One older reading: God’s glory is to set mystery before men so they know the limits of their knowledge; it cites Deut. 29:29'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/25.htm'
    quote: 'to place before men mystery upon mystery, in which they become conscious of the limitation and insufficiency of their knowledge, so that they are constrained to acknowledge, Deuteronomy 29:28, that "secret things belong unto the Lord our God."'
  - where: 'note 25:2 “What God conceals and the king searches out”'
    claim: 'The king’s honor is research that brings out the true state of a matter'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/25.htm'
    quote: 'and the king, by research, which brings out the true state of the matter, and thereby guards the political and social condition against threatening danger'
  - where: 'note 25:2 “What God conceals and the king searches out”'
    claim: 'The proverb does not say God conceals in order to stir up human research'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/25.htm'
    quote: 'Also that God, by the concealment of certain things, seeks to excite to activity human research, is not said in this proverb; for 2b does not speak of the honour of wise men, but of kings'
  - where: 'note 25:2 “What God conceals and the king searches out”'
    claim: '25:3 warns against trusting the king’s favor'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/25.htm'
    quote: 'The proverb is a warning against the delusion of being flattered by the favour of the king, which may, before one thinks of it, be withdrawn or changed even into the contrary'

  - where: 'note 25:7 “The lower seat”'
    claim: 'The Church’s footnote at 25:7 points to the parable in Luke 14'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/25?lang=eng'
    quote: '“Come”: Luke 14:10 (7–14).'
  - where: 'note 25:7 “The lower seat”'
    claim: 'Jesus spoke a parable at a meal on seeing the guests choose the chief places'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/14?lang=eng'
    quote: 'And he put forth a parable to those which were bidden, when he marked how they chose out the chief rooms; saying unto them,'
  - where: 'note 25:7 “The lower seat”'
    claim: 'Luke 14:11 states the principle'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/14?lang=eng'
    quote: 'For whosoever exalteth himself shall be abased; and he that humbleth himself shall be exalted.'

  - where: 'note 25:11 “Golden fruit in silver”'
    claim: 'A modern translation: apples of gold in a setting of silver'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2025&version=NRSVUE'
    quote: 'is like apples of gold in a setting of silver.'
  - where: section 3 plain
    claim: 'One older reading: the cold of snow is snow-cooled drink, not a snowfall, which at harvest would be a calamity'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/25.htm'
    quote: 'The coolness (צנּה from צנן, צנן, to be cool) of snow is not that of a fall of snow, which in the time of harvest would be a calamity, but of drink cooled with snow, which was brought from Lebanon or elsewhere'
  - where: 'note 25:20 “Vinegar on soda”'
    claim: 'The Hebrew word for “nitre” is neter'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Prov.xml'
    quote: 'נָ֑תֶר'
  - where: 'note 25:20 “Vinegar on soda”'
    claim: 'Neter is natron, carbonate of soda; vinegar on it is a figure of the incompatible'
    key: bdb
    url: 'https://biblehub.com/hebrew/5427.htm'
    quote: 'natron, or carbonate of soda, a mineral alkali'
  - where: 'note 25:20 “Vinegar on soda”'
    claim: 'Vinegar on natron in 25:20 is figurative of the incompatible'
    key: bdb
    url: 'https://biblehub.com/hebrew/5427.htm'
    quote: 'Proverbs 25:20 (figurative of the incompatible).'
  - where: 'note 25:20 “Vinegar on soda”'
    claim: 'A modern translation follows the Greek: vinegar on a wound, with a further couplet'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2025&version=NRSVUE'
    quote: 'Like vinegar on a wound is one who sings songs to a heavy heart. Like a moth in clothing or a worm in wood, sorrow gnaws at the human heart.'
  - where: 'note 25:21 “Bread for an enemy, coals on his head”'
    claim: 'Paul quotes the saying'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/25.htm'
    quote: 'The translation of this proverb by the lxx is without fault; Paul cites therefrom Romans 12:20.'
  - where: 'note 25:21 “Bread for an enemy, coals on his head”'
    claim: 'Romans 12:19: avenge not yourselves'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/12?lang=eng'
    quote: 'Dearly beloved, avenge not yourselves, but rather give place unto wrath: for it is written, Vengeance is mine; I will repay, saith the Lord.'
  - where: 'note 25:21 “Bread for an enemy, coals on his head”'
    claim: 'Romans 12:20 quotes the proverb'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/12?lang=eng'
    quote: 'Therefore if thine enemy hunger, feed him; if he thirst, give him drink: for in so doing thou shalt heap coals of fire on his head.'
  - where: 'note 25:21 “Bread for an enemy, coals on his head”'
    claim: 'The coals are a figure of self-accusing repentance; two reasons for the kindness'
    key: ot-manual-proverbs
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-2?lang=eng'
    quote: 'it is a figure of self-accusing repentance … , [which is produced through] the showing of good to an enemy.'
  - where: 'note 25:21 “Bread for an enemy, coals on his head”'
    claim: 'The two reasons: the enemy’s conscience, and God’s reward'
    key: ot-manual-proverbs
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-2?lang=eng'
    quote: 'first, that thereby his injustice is brought home to his conscience; and, secondly, that thus God is well-pleased in such practical love toward an enemy, and will reward it'
  - where: 'note 25:21 “Bread for an enemy, coals on his head”'
    claim: 'The same commentary: the coals are self-accusing repentance'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/25.htm'
    quote: 'The burning of coals laid on the head must be a painful but wholesome consequence; it is a figure of self-accusing repentance'
  - where: 'note 25:21 “Bread for an enemy, coals on his head”'
    claim: 'Good done from a revengeful aim loses its moral worth'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/25.htm'
    quote: 'but if this doing of good proceed from a revengeful aim, and is intended sensibly to humble an adversary, then it loses all its moral worth'

  - where: 'note 25:23 “The wind that brings rain”'
    claim: 'The Hebrew verb is techolel'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Prov.xml'
    quote: 'תְּח֣וֹלֵֽל'
  - where: 'note 25:23 “The wind that brings rain”'
    claim: 'The root means writhe in travail, bear, bring forth'
    key: bdb
    url: 'https://biblehub.com/hebrew/2342.htm'
    quote: '2 writhe in travail with, bear, bring forth (poetry)'
  - where: 'note 25:23 “The wind that brings rain”'
    claim: 'BDB lists 25:23 as the north wind bringing forth rain'
    key: bdb
    url: 'https://biblehub.com/hebrew/2342.htm'
    quote: 'of north wind bringing forth rain Proverbs 25:23'
  - where: 'note 25:23 “The wind that brings rain”'
    claim: 'A modern translation: the north wind produces rain'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2025&version=NRSVUE'
    quote: 'The north wind produces rain, and a backbiting tongue, angry looks.'
  - where: 'note 25:26 “A trampled spring”'
    claim: 'A modern translation: the righteous who give way before the wicked'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2025&version=NRSVUE'
    quote: 'Like a muddied spring or a polluted fountain are the righteous who give way before the wicked.'
  - where: 'note 25:26 “A trampled spring”'
    claim: 'Most take the yielding as forced: the righteous driven from his home, a misfortune to those around him'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/25.htm'
    quote: 'For the most part, in מט one thinks of a yielding in consequence of being forced. Thus e.g., Fleischer: as a troubled ruined spring is a misfortune for the people who drink out of it'
  - where: 'note 25:26 “A trampled spring”'
    claim: 'Driven from his dwelling or possession by the unrighteous'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/25.htm'
    quote: 'so is it a misfortune for the surrounding of the righteous, when he is driven from his dwelling or his possession by an unrighteous man.'
  - where: 'note 25:26 “A trampled spring”'
    claim: 'One older reading: the yielding from fear of man corrupts the righteous man’s character'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/25.htm'
    quote: 'If, however, he is wearied with resistance, and from the fear of man, or the desire to please man, or from a false love of peace he yields before it, and so gives way'
  - where: 'note 25:26 “A trampled spring”'
    claim: 'His character is corrupted, and his wavering grieves the righteous and offends the weak'
    key: delitzsch-proverbs
    url: 'https://biblehub.com/commentaries/kad/proverbs/25.htm'
    quote: 'his character, hitherto pure, is now corrupted by his own guilt, and now far from being a blessing to others, his wavering is a cause of sorrow to the righteous, and an offence to the weak'

  - where: 'note 25:27 “Too much honey, too much glory”'
    claim: 'A modern translation: to seek honor on top of honor'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2025&version=NRSVUE'
    quote: 'It is not good to eat much honey or to seek honor on top of honor.'

  - where: christ
    claim: 'Luke 14:11, the law under the parable of the seats'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/14?lang=eng'
    quote: 'For whosoever exalteth himself shall be abased; and he that humbleth himself shall be exalted.'
  - where: christ
    claim: 'The Church’s footnote at “enemy” in 25:21 points to 3 Ne. 12:44'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/25?lang=eng'
    quote: '“enemy”: 3 Ne. 12:44 (43–45). TG Enemies.'
  - where: christ
    claim: '3 Ne. 12:44–45: love your enemies, that ye may be children of your Father'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/12?lang=eng'
    quote: 'But behold I say unto you, love your enemies, bless them that curse you, do good to them that hate you, and pray for them who despitefully use you and persecute you;'
  - where: 'note 25:1 “Copied out by Hezekiah’s men”'
    claim: 'If the proverbs were not on the brass plates, the Lehites would likely have known the wider wisdom literature'
    key: allis-pike-words-wise
    url: 'https://rsc.byu.edu/give-ear-my-words/words-wise-alma-36-39-through-lens-proverbs-1-9'
    quote: 'If not, however, the Lehites would likely have been familiar with the broader range of wisdom literature of their day, including proverbs.'
  - where: 'note 25:11 “Golden fruit in silver”'
    claim: '“Fitly” is ʿal-ophnav, in (right) circumstances; the noun means circumstance, condition, perhaps turning'
    key: bdb
    url: 'https://biblehub.com/hebrew/655.htm'
    quote: 'noun [masculine] circumstance, condition (perhaps literally turning) only dual (or plural) suffix עַלאָֿפְנָיו = in (right) circumstances Proverbs 25:11'
  - where: 'note 25:11 “Golden fruit in silver”'
    claim: 'The word behind “pictures” is a show-piece, carved figure; in 25:11 silver carvings'
    key: bdb
    url: 'https://biblehub.com/hebrew/4906.htm'
    quote: '1 show-piece, specifically carved figure, of idolatrous symbols'
  - where: 'note 25:11 “Golden fruit in silver”'
    claim: 'In 25:11 the word means silver carvings'
    key: bdb
    url: 'https://biblehub.com/hebrew/4906.htm'
    quote: 'Proverbs 25:11 silver carvings.'
  - where: 'note 25:11 “Golden fruit in silver”'
    claim: 'The Church’s footnote at “word” points to Prov. 15:23'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/25?lang=eng'
    quote: 'Prov. 15:23'
  - where: 'note 25:20 “Vinegar on soda”'
    claim: 'The modern translation’s added couplet is from the Greek, Syriac and Targum; the Hebrew lacks it'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Proverbs%2025&version=NRSVUE'
    quote: 'Gk Syr Tg: Heb lacks Like a moth . . . human heart'
  - where: 'note 25:21 “Bread for an enemy, coals on his head”'
    claim: 'Read alone, the verses sound like doing right for the wrong reason, a worse torment for the enemy'
    key: ot-manual-proverbs
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-2?lang=eng'
    quote: 'Initially these verses sound as though a person is instructed to do the right thing for the wrong reason, that is, to forgive so that one’s enemy will receive a worse torment.'
  - where: 'note 25:21 “Bread for an enemy, coals on his head”'
    claim: 'Other scriptures, with Rom. 12:19–20, suggest bringing the enemy to repentance by sharpening conscience'
    key: ot-manual-proverbs
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-2?lang=eng'
    quote: 'Other scriptures, however, suggest a different interpretation: bringing someone to repentance and godly sorrow through sharpening conscience. (see Romans 12:19–20.)'
