summary: >-
  Jeremiah is called to warn Jerusalem, to speak of judgment and exile, and to
  promise that the Lord will rebuild and write a new covenant in the heart.
motifs:
  - An almond branch, the sign in Jeremiah's first vision.
  - A hand-formed clay vessel, recalling the potter who remakes marred clay.
  - Jerusalem in the distance.
composition: The branch and vessel occupy one side of an open dusk landscape, with Jerusalem distant and quiet.
