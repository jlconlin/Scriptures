summary: >-
  Jeremiah is called to warn Jerusalem, to speak of judgment and exile, and to
  promise that the Lord will rebuild and write a new covenant in the heart.
motifs:
  - An almond branch, the sign in Jeremiah's first vision.
  - A hand-formed clay vessel, recalling the potter who remakes marred clay.
  - Jerusalem in the distance.
composition: The branch and vessel occupy one side of an open dusk landscape, with Jerusalem distant and quiet.
# “What's in this picture” under the image on the book page: one line for each thing, with the verse it shows.
key:
  - '**The almond branch in blossom** is Jeremiah’s first vision. He saw “a rod of an almond tree,” and the Lord said, “I will hasten my word to perform it” ([[Jer. 1:11–12]]).'
  - '**The clay jar with its crack mended in gold** is the potter’s vessel: “the vessel that he made of clay was marred in the hand of the potter: so he made it again another vessel” ([[Jer. 18:4]]).'
  - '**The city in the distance** is Jerusalem, which Jeremiah was sent to warn and which the Lord promised would be built again ([[Jer. 31:38]]).'
