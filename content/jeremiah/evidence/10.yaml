chapter: 10
claims:
  - where: 'when'
    claim: 'Chapters 7–20 are the prophecies under Jehoiakim, 608–597'
    key: bd-jeremiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng
    quote: 'Prophecies under Jehoiakim (608–597), Jer. 7–20'
  - where: 'setting'
    claim: 'The Church chapter heading for Jeremiah 10'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/10?lang=eng
    quote: 'Learn not the way of other nations—Their gods are idols and molten images—The Lord is the true and living God.'
  - where: 'setting'
    claim: 'Chapter 9 ends with the nations and all the house of Israel uncircumcised'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/9?lang=eng
    quote: 'for all these nations are uncircumcised, and all the house of Israel are uncircumcised in the heart'
  - where: 'setting'
    claim: 'In Jeremiah’s day idolatry was rampant among his own people'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'Jeremiah therefore found idolatry, hill-worship, and heathen religious practices rampant among his people.'
  - where: 'setting'
    claim: 'Verse 11 is Aramaic (the only Jeremiah passage the Bible Dictionary lists)'
    key: bd-aramaic
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/aramaic?lang=eng
    quote: 'Certain portions of the Old Testament are written in Aramaic ( Ezra 4:8–6:18 ; 7:12–26 ; Jer. 10:11 ; Dan. 2:4–7:28 ).'
  - where: 'setting'
    claim: 'Jeremiah 10:12–16 recurs almost word for word in Jeremiah 51:15–19'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/51?lang=eng
    quote: 'When he uttereth his voice, there is a multitude of waters in the heavens; and he causeth the vapours to ascend from the ends of the earth: he maketh lightnings with rain, and bringeth forth the wind out of his treasures.'
  - where: 'thread'
    claim: 'Keil connects the shepherds of verse 21 back to the idol-makers of verse 14'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/10.htm
    quote: 'points manifestly back to the description in Jeremiah 10:14 of the folly of the idolaters, and exhibits the connection of Jeremiah 10:17-25 with the preceding warning against idolatry'
  - where: 'thread'
    claim: 'Psalm 115:8 says idol-makers become like their idols'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/ps/115?lang=eng
    quote: 'They that make them are like unto them; so is every one that trusteth in them.'
  - where: 'note 10:2 “Signs of heaven”'
    claim: 'Signs of heaven are unusual celestial phenomena; the nations were dismayed because they adored the stars'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/10.htm
    quote: 'The signs of heaven are unwonted phenomena in the heavens, eclipses of the sun and moon, comets, and unusual conjunctions of the stars, which were regarded as the precursors of extraordinary and disastrous events.'
  - where: 'note 10:2 “Signs of heaven”'
    claim: 'The nations were dismayed because in the stars they adored supernatural powers'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/10.htm
    quote: 'the heathen are dismayed before these, because in the stars they adored supernatural powers.'
  - where: 'note 10:2 “Signs of heaven”'
    claim: 'Manasseh introduced worship of the heavenly planets after the Assyro-Babylonian religion'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'the wicked Manasseh, the Baal cult was restored among the Jews, and there was introduced the worship of the heavenly planets in accordance with the dictates of the Assyro-Babylonian religion.'
  - where: 'note 10:2 “Signs of heaven”'
    claim: 'Moses warned Israel not to be driven to worship the sun, moon, and stars, which the Lord divided to all nations'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/deut/4?lang=eng
    quote: 'shouldest be driven to worship them, and serve them , which the Lord thy God hath divided unto all nations under the whole heaven'
  - where: 'note 10:3 “A god cut from a tree”'
    claim: 'The argument shows the illogic of worshiping an idol one has made'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'Then they take those same materials, make them into an idol by the work of their own hands, and suddenly expect the idol to be filled with supernatural power'
  - where: 'note 10:3 “A god cut from a tree”'
    claim: 'The argument shows the stupidity and illogic of worshiping an idol; materials worked at their own will'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'showed the stupidity and sheer illogic of worshiping an idol. People take such materials as wood and precious metals which they work and shape at their own will'
  - where: 'note 10:3 “A god cut from a tree”'
    claim: 'Isaiah 40:19 parallels the idol-making'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/isa/40?lang=eng
    quote: 'The workman melteth a graven image, and the goldsmith spreadeth it over with gold, and casteth silver chains.'
  - where: 'note 10:3 “A god cut from a tree”'
    claim: 'Isaiah 44:17 the man prays to the god he made'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/isa/44?lang=eng
    quote: 'he maketh a god, even his graven image: he falleth down unto it, and worshippeth it, and prayeth unto it, and saith, Deliver me; for thou art my god.'
  - where: 'note 10:3 “A god cut from a tree”'
    claim: 'Guide to the Scriptures defines idolatry'
    key: gs-idolatry
    url: https://www.churchofjesuschrist.org/study/scriptures/gs/idolatry?lang=eng
    quote: 'The worship of idols or an excessive attachment or devotion to anything.'
  - where: 'note 10:5 “Upright as the palm tree”'
    claim: 'Tomer means palm-tree, post; Jer 10:5 listed as a scarecrow in a cucumber field, simile of idol'
    key: bdb
    url: https://biblehub.com/hebrew/8560.htm
    quote: 'noun masculine palm-tree, post ; — construct דְּבוֺרָה ׳ ת Judges 4:5 palm-tree of Deborah; מִקְשָׁה ׳ כְּת Jeremiah 10:5 like a post (i.e. a scare-crow; compare Baruch 6:70) in a cucumber field (simile of idol).'
  - where: 'note 10:5 “Borne, because they cannot go”'
    claim: 'Isaiah 46:7 idols are carried and cannot answer; the Church edition footnote 5a gives Isa. 46:7'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/isa/46?lang=eng
    quote: 'They bear him upon the shoulder, they carry him, and set him in his place, and he standeth; from his place shall he not remove: yea, one shall cry unto him, yet can he not answer, nor save him out of his trouble.'
  - where: 'note 10:5 “Borne, because they cannot go”'
    claim: 'Footnote 5a on “borne” is Isa. 46:7'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/10?lang=eng
    quote: 'borne , because they cannot go. Be not afraid of them; for they cannot do evil'
  - where: 'note 10:5 “Borne, because they cannot go”'
    claim: 'Psalm 115 lists what idols cannot do'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/ps/115?lang=eng
    quote: 'They have mouths, but they speak not : eyes have they, but they see not'
  - where: 'note 10:9 “Silver from Tarshish”'
    claim: 'Tarshish is probably Tartessus in Spain; ships of Tarshish were large, for long voyages; Jer. 10:9 is listed'
    key: bd-tarshish
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/tarshish?lang=eng
    quote: 'Probably Tartessus in Spain; ships of Tarshish (the name came to be used to denote ships of the largest size, suitable for long voyages)'
  - where: 'note 10:9 “Silver from Tarshish”'
    claim: 'Footnote 9b on “cunning men” is D&C 124:84'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/10?lang=eng
    quote: 'D&amp;C 124:84'
  - where: 'note 10:9 “Silver from Tarshish”'
    claim: 'D&C 124:84 the Lord says a man sets up a golden calf for the worship of my people'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/124?lang=eng
    quote: 'he setteth up a golden calf for the worship of my people'
  - where: 'note 10:10 “The living God”'
    claim: 'Footnote 10a on “true God” is Josh. 22:34 and D&C 76:1; 10b on “living God” is JS—H 1:17'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/10?lang=eng
    quote: 'Josh. 22:34 ;  D&amp;C 76:1'
  - where: 'note 10:10 “The living God”'
    claim: 'D&C 76:1 text'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/76?lang=eng
    quote: 'for the Lord is God , and beside him there is no Savior'
  - where: 'note 10:10 “The living God”'
    claim: 'JS—H 1:17 text: two Personages, one presents the other as My Beloved Son'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/pgp/js-h/1?lang=eng
    quote: 'I saw two Personages , whose brightness and glory defy all description, standing above me in the air.'
  - where: 'note 10:10 “The living God”'
    claim: 'Verse 7: every one must fear the King of the nations'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/10.htm
    quote: 'Who would not fear Thee? a negative setting of the thought: every one must fear Thee.'
  - where: 'note 10:10 “The living God”'
    claim: 'Keil: “living God” is contrasted with the dead gods of verses 5 and 8'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/10.htm
    quote: '"living God" (cf. Deuteronomy 5:23) with the dead gods (Jeremiah 10:5, Jeremiah 10:8)'
  - where: 'note 10:11 “The one verse in Aramaic”'
    claim: 'Aramaic was an official language of the Persian Empire, widely spoken in the Near East'
    key: bd-aramaic
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/aramaic?lang=eng
    quote: 'An official language of the Persian Empire, spoken widely throughout the Near East.'
  - where: 'note 10:11 “The one verse in Aramaic”'
    claim: 'Keil: the verse is Chaldee, not a gloss, because no copyist would insert it and it fits verse 10'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/10.htm
    quote: 'Jeremiah 10:11 is Chaldee. But it must not be regarded as a gloss'
  - where: 'note 10:11 “The one verse in Aramaic”'
    claim: 'Keil: no copyist would interpolate a Chaldee verse; it connects suitably with verse 10'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/10.htm
    quote: 'no copyist would have interpolated a Chaldee verse into the Hebrew text'
  - where: 'note 10:11 “The one verse in Aramaic”'
    claim: 'Keil quotes Seb. Schmidt: Jews to answer the Chaldeans in Chaldee'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/10.htm
    quote: 'quomodo Chaldaeis (ad quos non nisi Chaldaice loqui poterant) paucis verbis respondendum sit'
  - where: 'note 10:12 “The Maker of the earth”'
    claim: 'Jer 51:15–19 repeats Jer 10:12–16 nearly word for word'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/51?lang=eng
    quote: 'He hath made the earth by his power , he hath established the world by his wisdom, and hath stretched out the heaven by his understanding'
  - where: 'note 10:12 “The Maker of the earth”'
    claim: 'D&C 76:24 the worlds are created by him'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/76?lang=eng
    quote: 'That by him , and through him, and of him, the worlds are and were created'
  - where: 'note 10:12 “The Maker of the earth”'
    claim: 'Moses 1:33 by the Son I created them'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/1?lang=eng
    quote: 'and by the Son I created them, which is mine Only Begotten'
  - where: 'note 10:12 “The Maker of the earth”'
    claim: 'John 1:3 all things were made by him'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/nt/john/1?lang=eng
    quote: 'All things were made by him; and without him was not any thing made that was made.'
  - where: 'note 10:16 “The portion of Jacob”'
    claim: 'Deut 4:19–20: heavenly bodies divided to all nations; Israel taken out of Egypt as a people of inheritance'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/deut/4?lang=eng
    quote: 'But the Lord hath taken you, and brought you forth out of the iron furnace, even out of Egypt, to be unto him a people of inheritance'
  - where: 'note 10:16 “The portion of Jacob”'
    claim: 'Deut 32:9 the Lord’s portion is his people'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/deut/32?lang=eng
    quote: 'For the Lord ’s portion is his people; Jacob is the lot of his inheritance'
  - where: 'note 10:17 “Pack up and leave”'
    claim: 'Gather up thy wares = bundle, popular phrase like pack up; the one that sits in the siege is the whole land'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/10.htm
    quote: 'there is about the expression something of the nature of a current popular phrase, like the German Schnr dein Bndel, pack up'
  - where: 'note 10:17 “Pack up and leave”'
    claim: 'Daughter of Zion meant, not Jerusalem only but the whole land'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/10.htm
    quote: 'The daughter of Zion is meant, but we must not limit the scope to the population of Jerusalem'
  - where: 'note 10:17 “Pack up and leave”'
    claim: 'This time: earlier invasions ended with plunder and tribute; none shall escape'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/10.htm
    quote: '"This time;" hitherto hostile invasions ended with plundering and the imposition of a tribute'
  - where: 'note 10:17 “Pack up and leave”'
    claim: 'The end of verse 18 is explained in several ways'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/10.htm
    quote: 'These words are variously explained, because there is no object expressed'
  - where: 'note 10:17 “Pack up and leave”'
    claim: 'The siege hems them in so none can escape'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/10.htm
    quote: 'for I will so hem them in that none shall be able to escape.'
  - where: 'note 10:19 “Who is speaking in verses 19–20”'
    claim: 'Jer 4:19–20 uses the same voice and tent image'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/4?lang=eng
    quote: 'My bowels , my bowels! I am pained at my very heart'
  - where: 'note 10:19 “Who is speaking in verses 19–20”'
    claim: 'Jer 4:20 tents spoiled, curtains'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/4?lang=eng
    quote: 'suddenly are my tents spoiled, and my curtains in a moment'
  - where: 'note 10:19 “Who is speaking in verses 19–20”'
    claim: 'Footnote 20a on “tabernacle” is Jer. 4:20'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/10?lang=eng
    quote: 'Jer. 4:20'
  - where: 'note 10:19 “Who is speaking in verses 19–20”'
    claim: 'Keil: the prophet speaks in the name of the congregation, as in Jer 4:19'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/10.htm
    quote: 'Such feelings the prophet utters at Jeremiah 10:19., in the name of the congregation, as he did in the like passage Jeremiah 4:19.'
  - where: 'note 10:21 “Brutish shepherds”'
    claim: 'Footnote 21a on pastors is TG Shepherd'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/10?lang=eng
    quote: 'TG  Shepherd'
  - where: 'note 10:21 “Brutish shepherds”'
    claim: 'Jer 23:1 woe to pastors who destroy and scatter the sheep; the Church heading for chapter 23 mentions the King (Messiah)'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/23?lang=eng
    quote: 'Woe be unto the pastors that destroy and scatter the sheep of my pasture!'
  - where: 'note 10:21 “Brutish shepherds”'
    claim: 'Church heading for Jer 23: the Branch, who is the King (the Messiah), will reign'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/23?lang=eng
    quote: 'The Branch, who is the King (the Messiah), will reign in righteousness'
  - where: 'note 10:22 “Out of the north, a den of jackals”'
    claim: 'Jer 1:14 evil out of the north; the footnote 22a gives Jer. 1:14'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/1?lang=eng
    quote: 'Out of the north an evil shall break forth upon all the inhabitants of the land.'
  - where: 'note 10:22 “Out of the north, a den of jackals”'
    claim: 'Footnote 22b: HEB jackals for dragons'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/10?lang=eng
    quote: 'HEB  jackals.'
  - where: 'note 10:23 “The way of man”'
    claim: 'Prov 20:24 man’s goings are of the Lord; footnote 23a'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/prov/20?lang=eng
    quote: 'Man’s goings are of the Lord ; how can a man then understand his own way?'
  - where: 'note 10:25 “Pour out thy fury”'
    claim: 'Psalm 79:6–7 repeats the verse'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/ps/79?lang=eng
    quote: 'Pour out thy wrath upon the heathen that have not known thee, and upon the kingdoms that have not called upon thy name. 7 For they have devoured Jacob, and laid waste his dwelling place.'
  - where: 'note 10:25 “Pour out thy fury”'
    claim: 'Jer 12:15–16 compassion on the nations; built among my people'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/12?lang=eng
    quote: 'after that I have plucked them out I will return, and have compassion on them'
  - where: 'note 10:25 “Pour out thy fury”'
    claim: 'Jer 12:16 if they learn the ways of my people they will be built among my people'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/12?lang=eng
    quote: 'if they will diligently learn the ways of my people, to swear by my name, The Lord liveth; as they taught my people to swear by Baal; then shall they be built in the midst of my people'
  - where: 'christ'
    claim: 'Creation by the Son; no Savior beside him; Church edition footnote to living God'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/1?lang=eng
    quote: 'and by the Son I created them, which is mine Only Begotten'
  - where: 'christ'
    claim: 'LORD in small capitals stands for Jehovah, who is the premortal Jesus Christ'
    key: bd-jehovah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng
    quote: 'the name is generally denoted by Lord or God, printed in small capitals. Jehovah is the premortal Jesus Christ'
  - where: 'explore'
    claim: 'Jer 12:14–17 is about the Lord’s promise to the nations that spoiled Judah'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'Jeremiah 12:14–17. Can the Spoilers of Judah Ever Be Blessed of the Lord?'
