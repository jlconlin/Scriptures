chapter: 22
claims:
  - where: 'setting'
    claim: 'The Church chapter heading says David’s throne stands or falls by the kings’ obedience'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/22?lang=eng
    quote: "David’s throne stands or falls according to the obedience of the kings—The judgments of the Lord rest upon the kings of Judah."
  - where: 'setting'
    claim: 'Chapter 21 is Zedekiah sending to ask Jeremiah about Jerusalem'
    key: ot-manual-24
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng
    quote: "King Zedekiah sent Pashur to inquire of the Lord through Jeremiah concerning Jerusalem."
  - where: 'setting'
    claim: 'The manual treats 22:1–9 as the third part of Jeremiah’s answer, a word to the house of David with an alternative'
    key: ot-manual-24
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng
    quote: "If the king and his people would turn back to righteousness, the throne of David would be preserved (see Jeremiah 22:4), but if not, it would “become a desolation” (v. 5)."
  - where: 'setting'
    claim: 'Bible Dictionary dates Jehoiakim 608–597 and Zedekiah 597–586 and groups chapters 21–23 as prophecies on rulers with a promise of the king Messiah'
    key: bd-jeremiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng
    quote: "Prophecies under Jehoiakim (608–597), Jer. 7–20."
  - where: 'setting'
    claim: 'Chapters 21–23 are on pastors or rulers, with promise of the king Messiah (23:1–6); Zedekiah 597–586'
    key: bd-jeremiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng
    quote: "Prophecies under Zedekiah (597–586), Jer. 21–38, divisible into several groups. (a) Jer. 21–23, on pastors or rulers of the people, with promise of the king Messiah (23:1–6)"
  - where: 'note 22:4 “A promise with a condition”'
    claim: 'Jer. 7:6 has the same list, spoken at the gate of the Lord’s house'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/7?lang=eng
    quote: "If ye oppress not the stranger, the fatherless, and the widow, and shed not innocent blood in this place, neither walk after other gods to your hurt:"
  - where: 'note 22:4 “A promise with a condition”'
    claim: 'Jer. 7:2 locates that sermon at the gate of the Lord’s house'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/7?lang=eng
    quote: "Stand in the gate of the Lord’s house, and proclaim there this word"
  - where: 'note 22:4 “A promise with a condition”'
    claim: 'Zion theology held that the Davidic covenant was unconditional'
    key: sc-knowhy-363
    url: https://scripturecentral.org/knowhy/how-can-the-old-testament-covenants-help-us-understand-the-book-of-mormon
    quote: "God covenanted with King David and his descendants that their royal line would last forever (see 2 Samuel 7:8–16).… This promise was seen as an unconditional covenant"
  - where: 'note 22:4 “A promise with a condition”'
    claim: 'Jeremiah said the Lord would protect the monarchy and Jerusalem only when righteous'
    key: sc-knowhy-363
    url: https://scripturecentral.org/knowhy/how-can-the-old-testament-covenants-help-us-understand-the-book-of-mormon
    quote: "Jeremiah prophesied that the Lord would only protect the Davidic monarchy and Jerusalem when they were righteous, and that Jerusalem would soon be destroyed by the Babylonians."
  - where: 'note 22:5 “An oath sworn by the Lord Himself”'
    claim: 'God swore by himself to Abraham because he could swear by no greater'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/nt/heb/6?lang=eng
    quote: "For when God made promise to Abraham, because he could swear by no greater, he sware by himself,"
  - where: 'note 22:5 “An oath sworn by the Lord Himself”'
    claim: 'Amos 6:8 has the same oath of judgment (a footnote at Jer. 22:5 in the Church edition)'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/amos/6?lang=eng
    quote: "The Lord God hath sworn by himself, saith the Lord the God of hosts, I abhor the excellency of Jacob, and hate his palaces"
  - where: 'note 22:5 “An oath sworn by the Lord Himself”'
    claim: 'The Church edition footnotes “house … desolation” to Ps. 69:25; Jer. 12:7; Matt. 23:38; Luke 13:35'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/22?lang=eng
    quote: "Ps. 69:25; Jer. 12:7; Matt. 23:38; Luke 13:35."
  - where: 'note 22:5 “An oath sworn by the Lord Himself”'
    claim: 'Matt. 23:38 text'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/nt/matt/23?lang=eng
    quote: "Behold, your house is left unto you desolate."
  - where: 'note 22:6 “Gilead and Lebanon”'
    claim: 'Gilead and Lebanon symbolize Israel’s richest soil, highest mountain, finest trees'
    key: ot-manual-24
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng
    quote: "Gilead symbolized the richest soil Israel knew, and Lebanon the highest mountain and the finest trees (see v. 6)."
  - where: 'note 22:6 “Gilead and Lebanon”'
    claim: 'In verse 23 the cedars are a symbol of pride and of Judah’s leaders'
    key: ot-manual-24
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng
    quote: "Because of their loftiness and beauty, the cedars of Lebanon often were used as a symbol of pride. Here they are symbols of Judah’s leaders"
  - where: 'note 22:9 “The question every passer-by asks”'
    claim: 'Deut. 29:24–25 asks and answers the same question'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/deut/29?lang=eng
    quote: "Because they have forsaken the covenant of the Lord God of their fathers, which he made with them when he brought them forth out of the land of Egypt:"
  - where: 'note 22:9 “The question every passer-by asks”'
    claim: '1 Kgs. 9:8–9 asks and answers the same question about the temple'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/9?lang=eng
    quote: "Why hath the Lord done thus unto this land, and to this house?"
  - where: 'note 22:10 “Weep not for the dead”'
    claim: 'The dead is Josiah, who died at Megiddo; the one who goes away is Shallum or Jehoahaz, carried to Egypt'
    key: ot-manual-24
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng
    quote: "“Weep sore for him that goeth away” (v. 10) refers to Shallum, or Jehoahaz, the son of Josiah and successor to the throne, who was carried away to Egypt."
  - where: 'note 22:10 “Weep not for the dead”'
    claim: 'Josiah died at Megiddo (Weep not for the dead refers to him)'
    key: ot-manual-24
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng
    quote: "“Weep not for the dead” (Jeremiah 22:10; see also vv. 11–12) refers to Josiah, king of Israel, who died of a wound received in the battle of Megiddo."
  - where: 'note 22:10 “Weep not for the dead”'
    claim: 'The point is that the people should mourn the coming tragedy, not their lost kings'
    key: ot-manual-24
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng
    quote: "The people were not to mourn for their lost kings. Rather, they should mourn the impending tragedy and turn aside from their evil ways."
  - where: 'note 22:10 “Weep not for the dead”'
    claim: 'The people of the land made Jehoahaz king; he reigned three months; Pharaoh put him in bands and he died in Egypt'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/23?lang=eng
    quote: "And Pharaoh-nechoh made Eliakim the son of Josiah king in the room of Josiah his father, and turned his name to Jehoiakim, and took Jehoahaz away: and he came to Egypt, and died there."
  - where: 'note 22:10 “Weep not for the dead”'
    claim: 'Jehoahaz reigned three months and was put in bands by Pharaoh-nechoh'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/23?lang=eng
    quote: "And Pharaoh-nechoh put him in bands at Riblah in the land of Hamath, that he might not reign in Jerusalem"
  - where: 'note 22:10 “Weep not for the dead”'
    claim: 'Shallum is listed as the fourth son of Josiah (1 Chr. 3:15)'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/3?lang=eng
    quote: "And the sons of Josiah were, the firstborn Johanan, the second Jehoiakim, the third Zedekiah, the fourth Shallum."
  - where: 'note 22:13 “A palace built on unpaid labor”'
    claim: 'Pharaoh made Eliakim king as Jehoiakim; he was an Egyptian vassal who exacted heavy taxes for Egypt'
    key: ot-manual-kings-g
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-g?lang=eng
    quote: "his half brother who was given the throne name of Jehoiakim ruled as an Egyptian vassal. He exacted heavy taxes from his people for Egypt."
  - where: 'note 22:13 “A palace built on unpaid labor”'
    claim: 'Jehoiakim taxed the land to pay Pharaoh'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/23?lang=eng
    quote: "he exacted the silver and the gold of the people of the land, of every one according to his taxation, to give it unto Pharaoh-nechoh."
  - where: 'note 22:13 “A palace built on unpaid labor”'
    claim: 'James 5:4 on wages kept back (a footnote at Jer. 22:13)'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/nt/james/5?lang=eng
    quote: "Behold, the hire of the labourers who have reaped down your fields, which is of you kept back by fraud, crieth"
  - where: 'note 22:13 “A palace built on unpaid labor”'
    claim: 'Jeremiah rebuked Jehoiakim’s self-centered life and injustices, evident beside Josiah’s righteous deeds'
    key: ot-manual-24
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng
    quote: "Jeremiah rebuked Jehoiakim for his self-centered life and his injustices to his people (see vv. 13–19), which were particularly evident when compared to the righteous deeds of his father, Josiah (see vv. 15–16)."
  - where: 'note 22:15 “Competing in cedar”'
    claim: 'The Hebrew verb behind “closest thyself” means to strive eagerly to excel; BDB lists Jer. 22:15 and Jer. 12:5 (hotly contend with the horses)'
    key: bdb
    url: https://biblehub.com/hebrew/2734.htm
    quote: "Jeremiah 22:15 because thou strivest eagerly (to excel) in cedar"
  - where: 'note 22:16 “To know the Lord”'
    claim: 'Young speaks of the general calling and responsibility every member takes on at baptism, before listing the obligations'
    key: young-love-serve
    url: https://www.churchofjesuschrist.org/study/general-conference/1971/10/by-love-serve-one-another?lang=eng
    quote: "Each of us has the same responsibility as a result of entering into the waters of baptism and making the covenant."
  - where: 'note 22:16 “To know the Lord”'
    claim: 'Young quotes Jer. 22:3 and 22:16'
    key: young-love-serve
    url: https://www.churchofjesuschrist.org/study/general-conference/1971/10/by-love-serve-one-another?lang=eng
    quote: "Of a king he said with approbation, “He judged the cause of the poor and needy; then it was well with him: was not this to know me? saith the Lord.” (Jer. 22:16.)"
  - where: 'note 22:16 “To know the Lord”'
    claim: 'Young says caring for the poor is one of the first and early obligations'
    key: young-love-serve
    url: https://www.churchofjesuschrist.org/study/general-conference/1971/10/by-love-serve-one-another?lang=eng
    quote: "To care for the poor is one of the first and early obligations."
  - where: 'note 22:16 “To know the Lord”'
    claim: 'Young’s byline and office'
    key: young-love-serve
    url: https://www.churchofjesuschrist.org/study/general-conference/1971/10/by-love-serve-one-another?lang=eng
    quote: "By President S. Dilworth Young Of the First Council of the Seventy"
  - where: 'note 22:16 “To know the Lord”'
    claim: 'Josiah turned to the Lord with all his heart according to the law of Moses; no king like him'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/23?lang=eng
    quote: "And like unto him was there no king before him, that turned to the Lord with all his heart, and with all his soul, and with all his might, according to all the law of Moses"
  - where: 'note 22:19 “The burial of an ass”'
    claim: 'An ass’s burial meant being left unburied in the open field; probably fulfilled when Jehoiakim was taken captive in Nebuchadnezzar’s siege'
    key: ot-manual-24
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng
    quote: "An ass’s burial (see v. 19) meant to be left unburied in the open field. This prophecy probably was fulfilled when Jehoiakim was taken captive during Nebuchadnezzar’s siege of Jerusalem."
  - where: 'note 22:19 “The burial of an ass”'
    claim: 'Jer. 36:30 repeats the prophecy about Jehoiakim’s body'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/36?lang=eng
    quote: "He shall have none to sit upon the throne of David: and his dead body shall be cast out in the day to the heat, and in the night to the frost."
  - where: 'note 22:19 “The burial of an ass”'
    claim: '2 Kgs. 24:6 says Jehoiakim slept with his fathers'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng
    quote: "So Jehoiakim slept with his fathers: and Jehoiachin his son reigned in his stead."
  - where: 'note 22:19 “The burial of an ass”'
    claim: '2 Chr. 36:6 says Nebuchadnezzar bound him in fetters to carry him to Babylon'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/36?lang=eng
    quote: "Against him came up Nebuchadnezzar king of Babylon, and bound him in fetters, to carry him to Babylon."
  - where: 'note 22:19 “The burial of an ass”'
    claim: '“Sleep with his fathers” denotes departure from life without saying how he died (one reading)'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/22.htm
    quote: "But the phrase “to sleep with his fathers” denotes merely departure from this life, without saying anything as to the manner of the death."
  - where: 'note 22:22 “The wind will shepherd the shepherds”'
    claim: 'The verb for the wind’s action is chosen for a word-play with the word for shepherds (to depasture)'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/22.htm
    quote: "In Jeremiah 22:22 תּרעה is chosen for the sake of the word-play with רעיך, and denotes to depasture … As the storm-wind, especially the parching east wind, depastures, so to speak, the grass of the field, so will the storm about to break on Judah sweep away the shepherds, carry them off"
  - where: 'note 22:22 “The wind will shepherd the shepherds”'
    claim: 'Shepherds are all the leaders; neither allies nor leaders can help'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/22.htm
    quote: "The shepherds of the people are not merely the kings, but all its leaders, the authorities generally"
  - where: 'note 22:22 “The wind will shepherd the shepherds”'
    claim: 'BDB: the verb means pasture, tend, graze'
    key: bdb
    url: https://biblehub.com/hebrew/7462.htm
    quote: "I. רָעָה167  verb pasture, tend, graze"
  - where: 'note 22:22 “The wind will shepherd the shepherds”'
    claim: 'BDB: with the wind as subject in Jer. 22:22 the verb means drive them away'
    key: bdb
    url: https://biblehub.com/hebrew/7462.htm
    quote: "d. subject wind, with accusative of person Jeremiah 22:22, i. e. drive them away"
  - where: 'note 22:22 “The wind will shepherd the shepherds”'
    claim: 'BDB: the participle shepherd is used figuratively of a ruler'
    key: bdb
    url: https://biblehub.com/hebrew/7462.htm
    quote: "(2) figurative of ruler (as often Assyrian"
  - where: 'note 22:22 “The wind will shepherd the shepherds”'
    claim: 'One reading: the lovers are the allied nations Judah courted'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/22.htm
    quote: "The lovers are not the kings (Ros., Ew., Neum. Ng.), nor the idols (Umbr.), but the allied nations (J. D. Mich., Maur., Hitz.), for whose favour Judah had intrigued"
  - where: 'note 22:24 “Coniah and his exile”'
    claim: 'Jehoiachin is called Coniah by Jeremiah; also Jeconiah, Joachin'
    key: bd-jehoiachin
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jehoiachin?lang=eng
    quote: "King of Judah (598 B.C.), also known as Jeconiah, Joachin, Coniah (2 Kgs. 24:6–15; 25:27; 2 Chr. 36:8–9; Jer. 52:31; Ezek. 1:2)."
  - where: 'note 22:24 “The signet”'
    claim: 'The signet is a seal or ring valued as a symbol of power'
    key: ot-manual-24
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng
    quote: "Coniah was likened to a signet, which is a seal or ring that is valued both as a symbol of power and as a jewel."
  - where: 'note 22:24 “The signet”'
    claim: 'A signet left the impression of its owner’s symbol and signified authority; Jeremiah’s imagery declared the Lord had rejected Jehoiachin’s authority'
    key: scripture-helps-hag-1-2
    url: https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/48-haggai-1-2-zechariah-1-4-7-14?lang=eng
    quote: "Signets were commonly used in the ancient world to signify authority. Several decades before Zerubbabel’s appointment as governor, the prophet Jeremiah used the imagery of a signet ring to declare that the Lord had rejected the authority of King Jehoiachin of Judah (also called Coniah)."
  - where: 'note 22:24 “Coniah and his exile”'
    claim: 'Nebuchadnezzar carried Jehoiachin and the king’s mother to Babylon'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng
    quote: "And he carried away Jehoiachin to Babylon, and the king’s mother, and the king’s wives, and his officers"
  - where: 'note 22:24 “Coniah and his exile”'
    claim: 'Jehoiachin was released in Babylon and ate at the king’s table all his days'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/52?lang=eng
    quote: "And changed his prison garments: and he did continually eat bread before him all the days of his life."
  - where: 'note 22:24 “Coniah and his exile”'
    claim: 'Jehoiachin’s uncle took the throne name Zedekiah'
    key: ot-manual-kings-g
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-g?lang=eng
    quote: "Jehoiachin was likewise exiled, and his uncle, who took the throne name Zedekiah, ruled in his stead."
  - where: 'note 22:30 “Childless, but not without sons”'
    claim: 'Jeconiah had sons (1 Chr. 3:17–19), including Salathiel and Pedaiah, whose son was Zerubbabel'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/3?lang=eng
    quote: "And the sons of Jeconiah; Assir, Salathiel his son,"
  - where: 'note 22:30 “Childless, but not without sons”'
    claim: 'The Hebrew phrase is explained by Keil: record him as childless in the family registers, which does not exclude sons; none would sit on the throne'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/22.htm
    quote: "This does not exclude the possibility of his having sons; it merely implies that none of them should obtain the throne."
  - where: 'note 22:30 “Childless, but not without sons”'
    claim: 'The triple “earth” marks the sentence as of high importance (Keil)'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/22.htm
    quote: "The triple repetition of the summons: Land, gives it a special emphasis, and marks the following sentence as of high importance"
  - where: 'note 22:30 “Childless, but not without sons”'
    claim: 'Jehoiachin’s uncle succeeded him (Mattaniah as Zedekiah)'
    key: ot-manual-kings-g
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-g?lang=eng
    quote: "his uncle, who took the throne name Zedekiah, ruled in his stead."
  - where: 'note 22:30 “From Jechonias to Jesus”'
    claim: 'Matthew lists Jechonias, Salathiel and Zorobabel in the line to Joseph and Jesus'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/nt/matt/1?lang=eng
    quote: "And after they were brought to Babylon, Jechonias begat Salathiel; and Salathiel begat Zorobabel;"
  - where: 'note 22:30 “From Jechonias to Jesus”'
    claim: 'Haggai 2:23: the Lord will make Zerubbabel as a signet'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/hag/2?lang=eng
    quote: "In that day, saith the Lord of hosts, will I take thee, O Zerubbabel, my servant, the son of Shealtiel, saith the Lord, and will make thee as a signet: for I have chosen thee, saith the Lord of hosts."
  - where: 'note 22:30 “From Jechonias to Jesus”'
    claim: 'The Haggai signet is likely a message that Zerubbabel regained the favor his grandfather lost, restoring his connection to David’s line; Matthew includes Zerubbabel in the Savior’s genealogy'
    key: scripture-helps-hag-1-2
    url: https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/48-haggai-1-2-zechariah-1-4-7-14?lang=eng
    quote: "was likely a message that Zerubbabel had regained the Lord’s favor that his grandfather lost. This restored Zerubbabel’s connection to David’s royal line."
  - where: 'note 22:30 “From Jechonias to Jesus”'
    claim: 'Jehoiachin was Zerubbabel’s grandfather and a descendant of David'
    key: scripture-helps-hag-1-2
    url: https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/48-haggai-1-2-zechariah-1-4-7-14?lang=eng
    quote: "Jehoiachin was Zerubbabel’s grandfather and a descendant of King David."
  - where: 'note 22:30 “From Jechonias to Jesus”'
    claim: 'Gabriel says the Lord God shall give Jesus the throne of his father David'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/nt/luke/1?lang=eng
    quote: "He shall be great, and shall be called the Son of the Highest: and the Lord God shall give unto him the throne of his father David:"
  - where: 'christ'
    claim: 'Jer. 23:5–6 promises a righteous Branch who executes judgment and justice, called The Lord Our Righteousness'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/23?lang=eng
    quote: "I will raise unto David a righteous Branch, and a King shall reign and prosper, and shall execute judgment and justice in the earth."
  - where: 'christ'
    claim: 'Bible Dictionary: chapters 21–23 on rulers with promise of the king Messiah (23:1–6)'
    key: bd-jeremiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng
    quote: "(a) Jer. 21–23, on pastors or rulers of the people, with promise of the king Messiah (23:1–6)"
  - where: 'explore'
    claim: 'Guide to the OT: chapter 22 is covered in the student manual chapter on the Babylonian Captivity'
    key: ot-manual-24
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng
    quote: "(24-5) Jeremiah 22:10–30. Specific Condemnations for Judah’s Rulers"
  - where: 'note 22:4 “A promise with a condition”'
