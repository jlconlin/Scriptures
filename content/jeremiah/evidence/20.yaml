chapter: 20
claims:
  - where: 'when'
    claim: 'Jeremiah 7–20 are grouped as prophecies under Jehoiakim (608–597)'
    key: bd-jeremiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng
    quote: 'Prophecies under Jehoiakim (608–597), Jer. 7–20.'
  - where: 'setting'
    claim: 'Jeremiah faced continuous opposition and insult from the priests (20:2)'
    key: bd-jeremiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng
    quote: 'continuous opposition and insult from the priests (20:2)'
  - where: 'setting'
    claim: 'Pashur acted after Jeremiah stood in the temple court (19:14-15) repeating the troubles to come'
    key: ot-manual-24
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng
    quote: 'Jeremiah 19:14–15 records Jeremiah’s standing in the court of the temple, again reminding the people of the troubles that lay ahead because of their wickedness.'
  - where: 'setting'
    claim: 'The Church''s scripture helps call the passages poetic laments and place this one after Jeremiah was beaten and confined'
    key: scripture-helps-jer-1-3
    url: https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/41-jeremiah-1-3-7-16-18-20?lang=eng
    quote: 'The book of Jeremiah includes a series of poetic laments or complaints, which scholars often refer to as Jeremiah’s “confessions.” These passages reveal the emotional and spiritual turmoil Jeremiah experienced during his difficult ministry.'
  - where: 'note 20:1 “Who Pashur was”'
    claim: 'Pashur son of Immer was a priest and chief governor in the house of the Lord; footnote: senior officer'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/20?lang=eng
    quote: '1 Now Pashur the son of Immer the priest, who was also chief governor in the house of the Lord, heard that Jeremiah prophesied these things.'
  - where: 'note 20:1 “Who Pashur was”'
    claim: 'Footnote on "chief governor": OR senior officer; footnote on Pashur points to Jer. 21:1; 38:1; on Immer to 1 Chr. 24:14'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/20?lang=eng
    quote: 'Jer. 21:1; 38:1.'
  - where: 'note 20:1 “Who Pashur was”'
    claim: 'Immer was the sixteenth of the priestly courses'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/24?lang=eng
    quote: 'The fifteenth to Bilgah, the sixteenth to Immer,'
  - where: 'note 20:1 “Who Pashur was”'
    claim: 'Another Pashur, son of Malchiah, is a different man (Jer. 21:1)'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/21?lang=eng
    quote: 'when king Zedekiah sent unto him Pashur the son of Melchiah, and Zephaniah the son of Maaseiah the priest'
  - where: 'note 20:1 “Who Pashur was”'
    claim: 'The temple overseer was a high post; Zephaniah held it (Jer. 29:26); the exact class of Immer cannot be determined'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/20.htm
    quote: 'The position of נגיד was a high one, as may be seen from the fact that the priest Zephaniah, who, according to Jeremiah 29:26, held this post'
  - where: 'note 20:1 “Who Pashur was”'
    claim: 'Jer. 29:26: priests made officers in the house of the Lord to put madmen-prophets in prison and in the stocks'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/29?lang=eng
    quote: 'that ye should be officers in the house of the Lord, for every man that is mad, and maketh himself a prophet, that thou shouldest put him in prison, and in the stocks.'
  - where: 'note 20:2 “The stocks at the high gate of Benjamin”'
    claim: 'Stocks were a wooden frame locking head, arms, legs and feet'
    key: seminary-jer-20
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-student-study-guide-obs/the-book-of-jeremiah/jeremiah-20-jeremiahs-troubles?lang=eng
    quote: 'put in stocks, a wooden frame with holes to lock in the head, arms, legs, and feet of someone accused or convicted of a crime.'
  - where: 'note 20:2 “The stocks at the high gate of Benjamin”'
    claim: 'Stocks forced the body into an unnatural position; Pashur had Jeremiah beaten'
    key: ot-manual-24
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng
    quote: 'he had Jeremiah beaten and placed in stocks. Stocks were an instrument of torture by which the body was forced into an unnatural position'
  - where: 'note 20:2 “The stocks at the high gate of Benjamin”'
    claim: 'The upper gate of Benjamin in the house of the Lord is the northern gate of the inner court, distinct from the city gate of the same name; Jeremiah held overnight'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/20.htm
    quote: 'The upper gate of Benjamin in the house of Jahveh is the northern gate at the upper, i.e., inner court of the temple'
  - where: 'note 20:2 “The stocks at the high gate of Benjamin”'
    claim: 'Later Jeremiah is again smitten and imprisoned (Jer. 37:15)'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/37?lang=eng
    quote: 'Wherefore the princes were wroth with Jeremiah, and smote him, and put him in prison in the house of Jonathan the scribe'
  - where: 'explore'
    claim: 'Heading of Hel. 13 names Samuel the Lamanite as the prophet'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/bofm/hel/13?lang=eng
    quote: 'Samuel the Lamanite prophesies the destruction of the Nephites unless they repent'
  - where: 'note 20:3 “Magor-missabib”'
    claim: 'Footnote: Magor-missabib means Terror all around'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/20?lang=eng
    quote: 'IE Terror all around.'
  - where: 'note 20:3 “Magor-missabib”'
    claim: 'Pashur in Hebrew means "free"; Magor-missabib means fear on every side'
    key: ot-manual-24
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng
    quote: 'Pashur, in Hebrew, means “free.” Jeremiah, upon being released, told Pashur that the Lord had a different name for him.'
  - where: 'note 20:3 “Magor-missabib”'
    claim: 'The phrase "fear round about" occurs in Jer. 6:25 and 46:5 and Ps. 31:13'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/6?lang=eng
    quote: 'for the sword of the enemy and fear is on every side.'
  - where: 'note 20:3 “Magor-missabib”'
    claim: 'Jer. 46:5 uses "fear was round about"'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/46?lang=eng
    quote: 'and look not back: for fear was round about, saith the Lord.'
  - where: 'note 20:4 “All Judah into the hand of the king of Babylon”'
    claim: 'The prophecy: Pashur, his house and friends to Babylon; all Judah and the treasures given to enemies'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/20?lang=eng
    quote: 'And thou, Pashur, and all that dwell in thine house shall go into captivity: and thou shalt come to Babylon, and there thou shalt die'
  - where: 'note 20:4 “All Judah into the hand of the king of Babylon”'
    claim: 'Fulfillment of treasures carried off to Babylon (footnote 2 Kgs 24:12–16; 25:13–17)'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng
    quote: 'And he carried out thence all the treasures of the house of the Lord, and the treasures of the king’s house'
  - where: 'note 20:4 “All Judah into the hand of the king of Babylon”'
    claim: 'Captives carried to Babylon in 2 Kgs 24:14'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng
    quote: 'And he carried away all Jerusalem, and all the princes, and all the mighty men of valour, even ten thousand captives'
  - where: 'note 20:4 “All Judah into the hand of the king of Babylon”'
    claim: 'Lehi read that the inhabitants of Jerusalem would be carried away captive into Babylon (footnote on v4 points to 1 Ne. 1:13)'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/1?lang=eng
    quote: 'many should perish by the sword, and many should be carried away captive into Babylon.'
  - where: 'note 20:7 “Deceived, or persuaded”'
    claim: 'The Hebrew word translated "deceived" means literally "enticed" or "persuaded"; Church edition footnote HEB persuaded'
    key: ot-manual-24
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng
    quote: 'The Hebrew word translated in verse 7 as “deceived” means literally “enticed” or “persuaded.”'
  - where: 'note 20:7 “Deceived, or persuaded”'
    claim: 'Jeremiah may be expressing frustration that the Lord drew him into duties that proved deeply challenging'
    key: scripture-helps-jer-1-3
    url: https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/41-jeremiah-1-3-7-16-18-20?lang=eng
    quote: 'Jeremiah may have been expressing frustration that the Lord had drawn him into prophetic duties that proved to be deeply challenging.'
  - where: 'note 20:7 “Deceived, or persuaded”'
    claim: 'At his call Jeremiah objected and the Lord promised he would not be overcome (1:6, 1:19)'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/1?lang=eng
    quote: 'And they shall fight against thee; but they shall not prevail against thee; for I am with thee, saith the Lord, to deliver thee.'
  - where: 'note 20:9 “A burning fire shut up in my bones”'
    claim: 'Seminary guide: he did not quit preaching because the word was a burning fire; he determined to trust and preach regardless'
    key: seminary-jer-20
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-student-study-guide-obs/the-book-of-jeremiah/jeremiah-20-jeremiahs-troubles?lang=eng
    quote: 'Jeremiah determined to continue to trust in the Lord and preach the word regardless of the consequences.'
  - where: 'note 20:9 “A burning fire shut up in my bones”'
    claim: 'Ether could not be restrained because of the Spirit (Ether 12:2, footnote cross-reference)'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/bofm/ether/12?lang=eng
    quote: 'for he could not be restrained because of the Spirit of the Lord which was in him.'
  - where: 'note 20:9 “A burning fire shut up in my bones”'
    claim: 'Peter and John: we cannot but speak (Acts 4:20, footnote cross-reference)'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/nt/acts/4?lang=eng
    quote: 'For we cannot but speak the things which we have seen and heard.'
  - where: 'note 20:10 “Fear on every side”'
    claim: 'Fear on every side is also in Ps. 31:13 (footnote); the report-him plot; Keil: first clause quotes Ps. 31, "Report" meaning report to the authorities as dangerous; friends lie in wait'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/20.htm
    quote: 'Report: here, report to the authorities as a dangerous man. Even those who are on friendly terms with him lie in wait for his fall.'
  - where: 'note 20:10 “Fear on every side”'
    claim: 'Ps. 31:13 reads: fear was on every side, devised to take away my life'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/ps/31?lang=eng
    quote: 'For I have heard the slander of many: fear was on every side: while they took counsel together against me, they devised to take away my life.'
  - where: 'note 20:10 “Fear on every side”'
    claim: 'Footnote on "familiars": OR familiar friends; Keil: the phrase fear round about as brief popular saying'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/20?lang=eng
    quote: 'OR familiar friends.'
  - where: 'note 20:11 “The Lord is with me”'
    claim: 'The promise of the call: they shall not prevail, I am with thee (1:19; 15:20)'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/15?lang=eng
    quote: 'And I will make thee unto this people a fenced brasen wall: and they shall fight against thee, but they shall not prevail against thee: for I am with thee to save thee and to deliver thee, saith the Lord.'
  - where: 'note 20:11 “The Lord is with me”'
    claim: 'Verse 11 recalls 1:19 and 15:20; in 11:20 the same words about reins and heart'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/20.htm
    quote: 'At Jeremiah 20:11 the lament rises into confidence in the Lord, springing from the promise given to him by God at his call.'
  - where: 'note 20:13 “From lament to praise and back”'
    claim: 'Tenor changes in vv. 11–13 where Jeremiah praises the Lord; some scholars think vv. 14–18 originally preceded 7–13'
    key: ot-manual-24
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng
    quote: 'Some scholars believe these verses originally were meant to precede verses 7–13 because the tenor of the lament changes in verses 11–13, in which Jeremiah began to praise the Lord.'
  - where: 'note 20:12 “Reins and heart”'
    claim: 'Footnote: reins is Hebrew for inward parts; Jer. 11:20 has nearly the same words'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/11?lang=eng
    quote: 'But, O Lord of hosts, that judgest righteously, that triest the reins and the heart, let me see thy vengeance on them: for unto thee have I revealed my cause.'
  - where: 'note 20:12 “Reins and heart”'
    claim: 'Footnote HEB inward parts'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/20?lang=eng
    quote: 'HEB inward parts.'
  - where: 'note 20:14 “Cursed be the day”'
    claim: 'Verses 14–18 reflect despair over the lonely ministry'
    key: ot-manual-24
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng
    quote: 'Verses 14–18 reflect Jeremiah’s despair over the lonely ministry he was given.'
  - where: 'note 20:14 “Cursed be the day”'
    claim: 'Job 3:3 is a parallel curse on the day of birth (footnote)'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/job/3?lang=eng
    quote: 'Let the day perish wherein I was born, and the night in which it was said, There is a man child conceived.'
  - where: 'note 20:14 “Cursed be the day”'
    claim: 'Isa. 13:19 (footnote on v16) names Sodom and Gomorrah as overthrown by God'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/isa/13?lang=eng
    quote: 'shall be as when God overthrew Sodom and Gomorrah.'
  - where: 'note 20:14 “Cursed be the day”'
    claim: 'The Lord called Jeremiah before birth: foreordination (Jer. 1:5)'
    key: scripture-helps-jer-1-3
    url: https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/41-jeremiah-1-3-7-16-18-20?lang=eng
    quote: 'The Lord revealed to Jeremiah that his calling as a prophet predated his birth. This principle is known as foreordination'
  - where: 'christ'
    claim: 'Jeremiah was allowed to see the coming of the Savior and the restoration'
    key: ot-manual-24
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng
    quote: 'Like Enoch (see Moses 7:41–69), Jeremiah was allowed to see the coming of the Savior and the restoration of God’s church and people in the latter days.'
  - where: 'christ'
    claim: 'Lehi mocked yet testified of the Messiah; Lord''s tender mercies bring deliverance'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/1?lang=eng
    quote: 'the Jews did mock him because of the things which he testified of them'
  - where: 'christ'
    claim: 'Lehi testified of the coming of a Messiah and the redemption of the world (1 Ne. 1:19)'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/1?lang=eng
    quote: 'manifested plainly of the coming of a Messiah, and also the redemption of the world.'
  - where: 'explore'
    claim: 'Scripture helps list the laments: 11:18–12:6; 15:10–21; 17:9–10, 14–18; 18:18–23; 20:7–12; 20:14–18'
    key: scripture-helps-jer-1-3
    url: https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/41-jeremiah-1-3-7-16-18-20?lang=eng
    quote: 'These confessions are recorded in (1) Jeremiah 11:18–12:6; (2) Jeremiah 15:10–21; (3) Jeremiah 17:9–10, 14–18; (4) Jeremiah 18:18–23; (5) Jeremiah 20:7–12; and (6) Jeremiah 20:14–18.'
  - where: 'note 20:10 “Fear on every side”'
    claim: 'The Hebrew behind "enticed" in verse 10 (Strong''s 6601, glossed "he can be persuaded") carries the same Strong''s number (6601) as "deceived" in verse 7'
    key: biblehub-interlinear
    url: https://biblehub.com/interlinear/jeremiah/20-10.htm
    quote: 'yə·p̄ut·teh'
  - where: 'note 20:10 “Fear on every side”'
    claim: 'The same Strong''s number 6601 appears for "deceived" in verse 7, glossed "You have persuaded me"'
    key: biblehub-interlinear
    url: https://biblehub.com/interlinear/jeremiah/20-7.htm
    quote: 'pit·tî·ṯa·nî'
  - where: 'setting'
    claim: 'Jeremiah was of the priests of Anathoth'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/1?lang=eng
    quote: 'The words of Jeremiah the son of Hilkiah, of the priests that were in Anathoth in the land of Benjamin'
  - where: 'setting'
    claim: 'Lehi began prophesying in the first year of Zedekiah'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/1?lang=eng
    quote: 'For it came to pass in the commencement of the first year of the reign of Zedekiah, king of Judah'
  - where: 'setting'
    claim: 'The Jews mocked Lehi and sought his life'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/1?lang=eng
    quote: 'they also sought his life, that they might take it away'
  - where: 'setting'
    claim: 'Nephi records that the Jews had cast Jeremiah into prison'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/7?lang=eng
    quote: 'they have rejected the prophets, and Jeremiah have they cast into prison'
  - where: 'note 20:1 “Who Pashur was”'
    claim: 'Pashur was the chief overseer of the temple'
    key: ot-manual-24
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng
    quote: 'When Pashur, the chief overseer of the temple, heard of the incident, he had Jeremiah beaten and placed in stocks.'
  - where: 'note 20:1 “Who Pashur was”'
    claim: 'Whether Immer is the sixteenth course or the priestly clan of Ezra 2:37 cannot be determined; Pashur son of Immer is distinguished from other priests of the name'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/20.htm
    quote: 'It cannot be determined whether Immer is here the name of the 16th class of priests ( 1 Chronicles 24:14 ) or of one of the greater priestly clans ( Ezra 2:37 ; Nehemiah 7:40 ).'
  - where: 'note 20:1 “Who Pashur was”'
    claim: 'Pashur acted against Jeremiah by the authority of his office (cf. Jer. 29:26)'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/20.htm
    quote: 'In virtue of the summary authority which belonged to him (cf. Jeremiah 29:26 ), Pashur smote the prophet'
  - where: 'note 20:3 “Magor-missabib”'
    claim: 'God had not called him Pashur, "free," but Magor-missabib, "fear on every side"'
    key: ot-manual-24
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng
    quote: 'Jeremiah said that God had not called him Pashur, or “free,” but Magor-missabib, which means “fear on every side.”'
  - where: 'note 20:9 “A burning fire shut up in my bones”'
    claim: 'The vow and the burning word were the turning point of Jeremiah''s life'
    key: holland-teacher
    url: https://www.churchofjesuschrist.org/study/general-conference/1998/04/a-teacher-come-from-god?lang=eng
    quote: 'But then came the turning point of Jeremiah’s life.'
  - where: 'note 20:10 “Fear on every side”'
    claim: 'The first clause of v. 10 is a verbal quotation from Ps. 31 (Heb. v. 14), a lament of David'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/20.htm
    quote: 'The first clause is a verbal quotation from Psalm 31:14 , a lament of David in the time of Saul''s persecutions.'
  - where: 'note 20:11 “The Lord is with me”'
    claim: 'The wording of v. 11 recalls Jer. 1:19 and 15:20'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/20.htm
    quote: 'recalls Jeremiah 1:19 ; Jeremiah 15:20 .'
