chapter: 7
claims:
  - where: 'when'
    claim: 'Jeremiah 7-20 are prophecies under Jehoiakim (608-597)'
    key: bd-jeremiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng
    quote: 'Prophecies under Jehoiakim (608–597), Jer. 7–20.'
  - where: 'setting'
    claim: 'The Church chapter heading summarizes the chapter'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/7?lang=eng
    quote: 'If the people of Judah repent, they will be preserved—The temple has become a den of robbers—The Lord rejects that generation of the people of Judah for their idolatries—They offer their children as sacrifices.'
  - where: 'setting'
    claim: 'Jeremiah 26:1 dates a temple address to the beginning of Jehoiakim, with the same Shiloh warning; the people seize him'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/26?lang=eng
    quote: 'In the beginning of the reign of Jehoiakim the son of Josiah king of Judah came this word from the Lord'
  - where: 'note 7:2 “The sermon at the gate”'
    claim: 'Jer 26:6, 8: house like Shiloh; priests, prophets, people take him: Thou shalt surely die'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/26?lang=eng
    quote: 'Then will I make this house like Shiloh, and will make this city a curse to all the nations of the earth.'
  - where: 'note 7:2 “The sermon at the gate”'
    claim: 'The people seized Jeremiah and said he must die'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/26?lang=eng
    quote: 'the priests and the prophets and all the people took him, saying, Thou shalt surely die.'
  - where: 'note 7:2 “The sermon at the gate”'
    claim: 'Josiah made the temple the sole place of sacrifice (621); Jeremiah struck at its existence; arrest (see ch 26); the false reverence'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'Josiah had made it the sole place of sacrificial worship of Jehovah for all Jews in an attempt to stamp out idol worship.'
  - where: 'note 7:2 “The sermon at the gate”'
    claim: 'The reverence was false, and Jeremiah was quickly arrested (see Jeremiah 26)'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'Because of the great reverence the people had for the temple, though it was a false reverence, it is not surprising that Jeremiah was quickly arrested and imprisoned (see Jeremiah 26).'
  - where: 'note 7:4 “Why the temple felt like a guarantee”'
    claim: 'Tradition held Jerusalem inviolable as God''s house; temple seen as symbol of the Lord''s presence'
    key: sc-knowhy-451
    url: https://scripturecentral.org/knowhy/why-did-some-in-lehis-time-believe-that-jerusalem-could-not-be-destroyed
    quote: 'He would naturally protect it from desecration and destruction.'
  - where: 'note 7:4 “Why the temple felt like a guarantee”'
    claim: 'Deliverance from Assyria under Hezekiah strengthened the belief'
    key: sc-knowhy-451
    url: https://scripturecentral.org/knowhy/why-did-some-in-lehis-time-believe-that-jerusalem-could-not-be-destroyed
    quote: 'strengthened the belief that the Lord would preserve Jerusalem and its temple from all enemies.'
  - where: 'note 7:4 “Why the temple felt like a guarantee”'
    claim: 'Josiah''s reform may have given some an exaggerated view of their own righteousness'
    key: sc-knowhy-451
    url: https://scripturecentral.org/knowhy/why-did-some-in-lehis-time-believe-that-jerusalem-could-not-be-destroyed
    quote: 'These reforms may have led some people to hold an exaggerated view of their own righteousness and favor in God'
  - where: 'note 7:4 “Why the temple felt like a guarantee”'
    claim: 'False prophets such as Hananiah gave the opposite message'
    key: sc-knowhy-451
    url: https://scripturecentral.org/knowhy/why-did-some-in-lehis-time-believe-that-jerusalem-could-not-be-destroyed
    quote: 'there were also false prophets, such as Hananiah (Jeremiah 28:15) who gave the opposite message'
  - where: 'note 7:10 ““Delivered” means “safe””'
    claim: 'NRSVUE renders verse 10 "We are safe!"—only to go on doing all these abominations'
    key: nrsvue
    url: https://www.biblegateway.com/passage/?search=Jeremiah+7%3A10&version=NRSVUE
    quote: 'and say, “We are safe!”—only to go on doing all these abominations?'
  - where: 'note 7:10 ““Delivered” means “safe””'
    claim: 'Hebrew lema''an with the infinitive means "in order to do"; the thought is that they go to the temple to get indulgence for continuing'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/7.htm
    quote: 'By frequenting the temple, they thought to procure an indulgence for their wicked ongoings, not merely for what they had already done, but for what they do from day to day.'
  - where: 'note 7:11 “A den of robbers, and the cleansing of the temple”'
    claim: 'A den is a hideout: those who came to the temple supposing they gained absolution were declaring it a robbers'' retreat'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/7.htm
    quote: "If thieves, murderers, adulterers, etc., gathered to the temple, and supposed that by appearing there they procured the absolution of their sins, they were in very act declaring the temple to be a robbers' retreat."
  - where: 'note 7:11 “A den of robbers, and the cleansing of the temple”'
    claim: 'Jesus used this verse with Isa 56:7 in cleansing the temple'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'The language of Jeremiah 7:11, combined with that of Isaiah 56:7, was used by Jesus when He cleansed the temple (see Matthew 21:13).'
  - where: 'note 7:11 “A den of robbers, and the cleansing of the temple”'
    claim: 'The Church edition footnote at verse 11 points to Matt 21:13 and Luke 19:46'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/7?lang=eng
    quote: 'Matt. 21:13; Luke 19:46 (46–48).'
  - where: 'note 7:12 “What happened at Shiloh”'
    claim: 'Shiloh was in Ephraim; the tabernacle was there much of the period of the Judges, religious center until the ark was lost'
    key: bd-shiloh
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/shiloh?lang=eng
    quote: 'The tabernacle was here during the greater part of the period of the Judges, and the place continued to be the religious center of the nation (1 Sam. 1:3) until after the loss of the Ark in the disastrous battle of Ebenezer.'
  - where: 'note 7:12 “What happened at Shiloh”'
    claim: 'The Philistines overran Shiloh and took the ark'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'They overran Shiloh and took the ark of the covenant in the battle (see 1 Samuel 4:10–12).'
  - where: 'note 7:12 “What happened at Shiloh”'
    claim: 'The elders brought the ark out of Shiloh to the battle hoping it would save them'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/4?lang=eng
    quote: 'Let us fetch the ark of the covenant of the Lord out of Shiloh unto us, that, when it cometh among us, it may save us out of the hand of our enemies.'
  - where: 'note 7:12 “What happened at Shiloh”'
    claim: 'The ark was taken and Israel was smitten'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/4?lang=eng
    quote: 'And the ark of God was taken; and the two sons of Eli, Hophni and Phinehas, were slain.'
  - where: 'note 7:12 “What happened at Shiloh”'
    claim: 'Psalm 78 says God forsook the tabernacle of Shiloh'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/ps/78?lang=eng
    quote: 'So that he forsook the tabernacle of Shiloh, the tent which he placed among men;'
  - where: 'note 7:12 “What happened at Shiloh”'
    claim: 'The parallel between Israel and Judah; temple no protection for the wicked'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'The parallel between Israel and Judah should have been evident. For the wicked to look to the temple as a source of protection was foolish.'
  - where: 'note 7:15 “The brethren already cast out”'
    claim: 'The whole seed of Ephraim is the ten tribes (one reading)'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/7.htm
    quote: 'The whole seed of Ephraim is the ten tribes.'
  - where: 'note 7:15 “The brethren already cast out”'
    claim: 'Assyria took Samaria and carried Israel away; the Lord removed them out of his sight, none left but Judah'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/17?lang=eng
    quote: 'Therefore the Lord was very angry with Israel, and removed them out of his sight: there was none left but the tribe of Judah only.'
  - where: 'note 7:16 “Pray not for this people”'
    claim: 'The same command in Jer 11:14 and 14:11'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/11?lang=eng
    quote: 'Therefore pray not thou for this people, neither lift up a cry or prayer for them: for I will not hear them in the time that they cry unto me for their trouble.'
  - where: 'note 7:16 “Pray not for this people”'
    claim: 'Jer 14:11 repeats the command'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/14?lang=eng
    quote: 'Then said the Lord unto me, Pray not for this people for their good.'
  - where: 'note 7:16 “Pray not for this people”'
    claim: 'In Jer 14-15 Jeremiah prays urgently and the Lord rejects all intercession'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'gives the prophet occasion for urgent prayer on behalf of his people [Jeremiah 14:7–9, 19–22]; but the Lord rejects all intercession'
  - where: 'note 7:18 “The queen of heaven”'
    claim: 'The Church edition footnote: the queen of heaven is the fertility goddess, such as the Babylonian Ishtar'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/7?lang=eng
    quote: 'IE the fertility goddess, such as the Babylonian Ishtar.'
  - where: 'note 7:18 “The queen of heaven”'
    claim: 'Worship of the queen of heaven mentioned at 7:18 and 44:19; Manasseh introduced worship of heavenly planets on Assyro-Babylonian pattern'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'The worship of the ‘queen of Heaven’ ought also to be mentioned. (7:18; 44:19)'
  - where: 'note 7:18 “The queen of heaven”'
    claim: 'In Jer 44 the Judahites in Egypt defend the worship: plenty of food when they burned incense, want after they stopped'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/44?lang=eng
    quote: 'for then had we plenty of victuals, and were well, and saw no evil.'
  - where: 'note 7:18 “The queen of heaven”'
    claim: 'In Jer 44 the people say they will not hearken'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/44?lang=eng
    quote: 'we will not hearken unto thee.'
  - where: 'note 7:21 “Burnt offerings and obedience”'
    claim: 'Obedience is more critical to God than outward rituals of sacrifice'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'Jeremiah 7:21–23 reminded the people that obedience is more critical to God than the outward rituals of sacrifice performed in the temple.'
  - where: 'note 7:21 “Burnt offerings and obedience”'
    claim: 'Exodus 19:5 "obey my voice indeed, and keep my covenant" precedes the sacrificial laws; Jeremiah draws on the covenant-making (one reading)'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/7.htm
    quote: 'The last word immediately suggests Exodus 19:5'
  - where: 'note 7:21 “Burnt offerings and obedience”'
    claim: 'Exodus 19:5 text'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/ex/19?lang=eng
    quote: 'Now therefore, if ye will obey my voice indeed, and keep my covenant, then ye shall be a peculiar treasure unto me above all people'
  - where: 'note 7:21 “Burnt offerings and obedience”'
    claim: 'Samuel: to obey is better than sacrifice'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/15?lang=eng
    quote: 'Behold, to obey is better than sacrifice, and to hearken than the fat of rams.'
  - where: 'note 7:21 “Burnt offerings and obedience”'
    claim: 'Hosea 6:6'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/6?lang=eng
    quote: 'For I desired mercy, and not sacrifice; and the knowledge of God more than burnt offerings.'
  - where: 'note 7:29 ““Cut off thine hair””'
    claim: 'Hair cutting a sign of grief; Hebrew nezer "crown"; Nazirite hair a sign of consecration; removal signified abandonment'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'The Hebrew text reads literally ‘Cut off your crown (nezer). ’ The hair was looked on as, in a sense, a diadem.'
  - where: 'note 7:29 ““Cut off thine hair””'
    claim: 'Israel had abandoned her consecration and was not worthy to wear the crown of her long hair'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'The removal of the hair signified an abandonment of his consecration (Judg. 16:15–22).'
  - where: 'note 7:31 “Tophet and the valley of Hinnom”'
    claim: 'Topheth: spot in the valley of Hinnom south of Jerusalem where human sacrifices were offered to Molech'
    key: bd-topheth
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/topheth?lang=eng
    quote: 'A spot in the valley of the son of Hinnom, south of Jerusalem, where human sacrifices were offered to Molech (2 Kgs. 23:10; Isa. 30:33; Jer. 7:31–32; 19:6, 13).'
  - where: 'note 7:31 “Tophet and the valley of Hinnom”'
    claim: 'Gehenna: valley of Hinnom, Moloch worship, polluted by Josiah, later refuse burned, symbol of place of torment after death'
    key: bd-gehenna
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/gehenna?lang=eng
    quote: 'afterwards a place in which the refuse of the city was burned, and for that reason it was symbolic of the place of torment after death'
  - where: 'note 7:31 “Tophet and the valley of Hinnom”'
    claim: 'Manasseh made his son pass through the fire'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/21?lang=eng
    quote: 'And he made his son pass through the fire'
  - where: 'note 7:31 “Tophet and the valley of Hinnom”'
    claim: 'Josiah defiled Topheth so no one could pass son or daughter through the fire'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/23?lang=eng
    quote: 'And he defiled Topheth, which is in the valley of the children of Hinnom, that no man might make his son or his daughter to pass through the fire to Molech.'
  - where: 'note 7:31 “Tophet and the valley of Hinnom”'
    claim: 'The law forbade it (Lev 18:21)'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/lev/18?lang=eng
    quote: 'And thou shalt not let any of thy seed pass through the fire to Molech'
  - where: 'note 7:31 “Tophet and the valley of Hinnom”'
    claim: 'Jer 19:5-6 repeats the charge and the renaming as valley of slaughter'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/19?lang=eng
    quote: 'this place shall no more be called Tophet, nor The valley of the son of Hinnom, but The valley of slaughter.'
  - where: 'note 7:31 “Tophet and the valley of Hinnom”'
    claim: 'Heathen idols in temple, children sacrificed (7:31; 19:5; 32:35)'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'children were sacrificed to Baal-Moloch (7:31; 19:5; 32:35)'
  - where: 'christ'
    claim: 'Jesus cleansed the temple quoting "den of thieves"'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/nt/matt/21?lang=eng
    quote: 'It is written, My house shall be called the house of prayer; but ye have made it a den of thieves.'
  - where: 'christ'
    claim: 'Isaiah 56:7 "house of prayer"'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/isa/56?lang=eng
    quote: 'mine house shall be called an house of prayer for all people.'
  - where: 'explore'
    claim: 'Jer 26 gives the aftermath and trial'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/26?lang=eng
    quote: 'Jeremiah prophesies the destruction of the people—For this he is arraigned, tried, and then acquitted.'
  - where: 'note 7:2 “The sermon at the gate”'
    claim: 'Jeremiah was born into a priestly family'
    key: bd-jeremiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng
    quote: 'Born of a priestly family in Anathoth'
  - where: 'note 7:2 “The sermon at the gate”'
    claim: 'The temple had acquired greater importance than ever'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'The temple and its priests thus had acquired by this time greater importance than ever before.'
  - where: 'note 7:4 “Why the temple felt like a guarantee”'
    claim: 'The Babylonian siege came about a hundred years after Hezekiah'
    key: sc-knowhy-451
    url: https://scripturecentral.org/knowhy/why-did-some-in-lehis-time-believe-that-jerusalem-could-not-be-destroyed
    quote: 'when the Babylonian armies laid siege to Jerusalem about a hundred years'
  - where: 'note 7:10 ““Delivered” means “safe””'
    claim: 'The Hebrew conjunction means with a view to doing'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/7.htm
    quote: 'but always means, with the view of doing something; English: to the end that.'
  - where: 'note 7:21 “Burnt offerings and obedience”'
    claim: 'Burnt offerings were burned entire on the altar'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/7.htm
    quote: 'burnt-offerings, which were wont to be burnt entire upon the altar'
  - where: 'note 7:18 “The queen of heaven”'
    claim: 'Manasseh era: worship of heavenly planets on Assyro-Babylonian pattern'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'there was introduced the worship of the heavenly planets in accordance with the dictates of the Assyro-Babylonian religion.'
  - where: 'note 7:18 “The queen of heaven”'
    claim: 'Footnote: Hebrew for confusion of their faces is to their shame, or disgrace'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/7?lang=eng
    quote: 'HEB to their shame, or disgrace.'
  - where: 'note 7:31 “Tophet and the valley of Hinnom”'
    claim: 'NT uses Gehenna as image of torment (BD cites Matt 5:29-30)'
    key: bd-gehenna
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/gehenna?lang=eng
    quote: '(see Matt. 5:29–30; 10:28; 23:15, 33; Mark 9:43, 45; Luke 12:5; James 3:6)'
  - where: 'setting'
    claim: 'Jeremiah 26 tells how Jeremiah was seized for the temple address; the manual links the arrest to this sermon'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'it is not surprising that Jeremiah was quickly arrested and imprisoned (see Jeremiah 26).'
  - where: 'note 7:4 “Why the temple felt like a guarantee”'
    claim: 'Laman and Lemuel shared the belief that Jerusalem could not be destroyed (1 Ne. 2:13)'
    key: sc-knowhy-451
    url: https://scripturecentral.org/knowhy/why-did-some-in-lehis-time-believe-that-jerusalem-could-not-be-destroyed
    quote: 'Laman and Lemuel, the sons of the prophet Lehi, had believed similarly when their own father was called to be a prophet of God.'
  - where: 'note 7:18 “The queen of heaven”'
    claim: 'Jeremiah found idolatry rampant; the queen of heaven worship part of it'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'Jeremiah therefore found idolatry, hill-worship, and heathen religious practices rampant among his people.'
  - where: 'note 7:21 “Burnt offerings and obedience”'
    claim: 'Most of the flesh of the slain offerings was eaten by the worshippers (one reading of v21)'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/7.htm
    quote: 'the greater part of the flesh was eaten at the sacrificial meals by those who brought them.'
  - where: 'note 7:21 “Burnt offerings and obedience”'
    claim: 'God takes so little pleasure in their sacrifices that they may eat the burnt offerings'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/7.htm
    quote: 'God had so little pleasure in their sacrifices, that they might eat of the very burnt-offerings.'
  - where: 'note 7:21 “Burnt offerings and obedience”'
    claim: 'Verses 22-23 are an antithesis; "obey my voice" points to Exodus 19:5 and the beginning of the law-giving at Sinai'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/7.htm
    quote: 'it points to the beginning of the law-giving, the decalogue, and the fundamental principles of the law of Israel, in Exodus 20-23'
  - where: 'christ'
    claim: 'Jer 31:33 repeats the covenant formula in the new covenant'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/31?lang=eng
    quote: 'I will put my law in their inward parts, and write it in their hearts; and will be their God, and they shall be my people.'
