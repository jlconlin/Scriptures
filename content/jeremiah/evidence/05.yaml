    claim: 'Nephi was a contemporary of Jeremiah'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'Nephi, a contemporary of Jeremiah, taught that the Canaanites in the time of Moses'
