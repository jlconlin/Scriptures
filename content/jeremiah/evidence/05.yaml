chapter: 5
claims:
  - where: 'when'
    claim: 'Jeremiah 1–6 belong to the reign of Josiah in the Bible Dictionary outline'
    key: bd-jeremiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng
    quote: 'Prophecies of reign of Josiah (626–608), Jer. 1–6.'
  - where: 'setting'
    claim: 'The Church chapter heading for Jeremiah 5'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/5?lang=eng
    quote: 'Judgments will be poured out upon the people of Judah because of their sins—Their iniquities cause blessings to be withheld from them.'
  - where: 'thread'
    claim: 'The chapter''s national corruption: the offer to spare Judah, and “my people love to have it so” as the real tragedy'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'the real national tragedy, described in Jeremiah’s summary comment, was: “my people love to have it so” (Jeremiah 5:31).'
  - where: 'note 5:1 “One righteous person”'
    claim: 'The Lord’s offer to spare Judah is like the one made to Abraham for Sodom and Gomorrah'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'In an offer similar to the one He made to Abraham for the deliverance of Sodom and Gomorrah (see Genesis 18:23–33), the Lord promised to spare Judah if anyone could be found who lived justly or sought the truth'
  - where: 'note 5:1 “One righteous person”'
    claim: 'Church edition footnote on “executeth judgment”: Hebrew “does justly”, with Gen. 18:26 and Ezek. 22:30'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/5?lang=eng
    quote: 'OR does justly. Gen. 18:26; Ezek. 22:30.'
  - where: 'note 5:1 “One righteous person”'
    claim: 'Abraham''s bargaining for Sodom, down to ten righteous'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/gen/18?lang=eng
    quote: 'Peradventure ten shall be found there. And he said, I will not destroy it for ten’s sake.'
  - where: 'note 5:1 “One righteous person”'
    claim: 'Ezekiel records the Lord seeking a man to stand in the gap and finding none'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/22?lang=eng
    quote: 'And I sought for a man among them, that should make up the hedge, and stand in the gap before me for the land, that I should not destroy it: but I found none.'
  - where: 'note 5:2 “Swearing by the Lord’s life, falsely”'
    claim: 'Jeremiah 4:2 gives the right form of the oath: swear “The Lord liveth” in truth, judgment and righteousness'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/4?lang=eng
    quote: 'And thou shalt swear, The Lord liveth, in truth, in judgment, and in righteousness'
  - where: 'note 5:2 “Swearing by the Lord’s life, falsely”'
    claim: 'Jeremiah 7:9 lists swearing falsely beside theft, murder, adultery and Baal worship, and 7:4 shows trust in the temple'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/7?lang=eng
    quote: 'Will ye steal, murder, and commit adultery, and swear falsely, and burn incense unto Baal, and walk after other gods whom ye know not;'
  - where: 'note 5:4 “The poor and the great”'
    claim: 'Church footnote on “yoke” (verse 5): the yoke is of the law and the covenants'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/5?lang=eng
    quote: 'IE of the law and the covenants.'
  - where: 'note 5:6 “Lion, wolf, and leopard”'
    claim: 'Church footnote on “wolf” points to Zeph. 3:3; on “evenings” gives “plains, wilderness”'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/5?lang=eng
    quote: 'Zeph. 3:3.'
  - where: 'note 5:6 “Lion, wolf, and leopard”'
    claim: 'The alternative rendering of “evenings” in the Church footnote'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/5?lang=eng
    quote: 'OR plains, wilderness.'
  - where: 'note 5:6 “Lion, wolf, and leopard”'
    claim: 'In Zephaniah 3:3 the city''s princes are lions and its judges evening wolves'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/zeph/3?lang=eng
    quote: 'Her princes within her are roaring lions; her judges are evening wolves; they gnaw not the bones till the morrow.'
  - where: 'note 5:6 “Lion, wolf, and leopard”'
    claim: 'One reading takes the beasts as literal chastisements (Lev. 26:22), and “wolf of the deserts/steppe” rather than of the evening'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/5.htm
    quote: 'The words are a case of the threatening of the law in Leviticus 26:22, that God will chasten the transgressors of His law by sending beasts of prey which shall rob them of their children.'
  - where: 'note 5:6 “Lion, wolf, and leopard”'
    claim: 'Same commentary on the Hebrew word for “evenings”'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/5.htm
    quote: 'is not wolf of the evening, as Chald. Syr., Hitz. explain it, following Habakkuk 1:8 and Zephaniah 3:3; for ערבות is not the plural of ערב, but of ערבה, steppe'
  - where: 'note 5:7 “Fed them to the full”'
    claim: 'Church footnote ties “fed them to the full” to Deut. 32:15'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/5?lang=eng
    quote: 'Deut. 32:15.'
  - where: 'note 5:7 “Fed them to the full”'
    claim: 'Church footnote on verse 8 “fed horses”: Hebrew “lusty stallions”'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/5?lang=eng
    quote: 'HEB lusty stallions.'
  - where: 'note 5:7 “Fed them to the full”'
    claim: 'Deuteronomy 32:15: Jeshurun grew fat and forsook God'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/deut/32?lang=eng
    quote: 'Jeshurun waxed fat'
  - where: 'note 5:9 “When the Lord’s patience ends”'
    claim: 'The manual''s comparison with Nephi: Canaanites and Israel “ripe in iniquity”'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'He used similar language to describe the children of Israel: “They have become wicked, yea, nearly unto ripeness'
  - where: 'note 5:9 “When the Lord’s patience ends”'
    claim: 'Nephi on the Canaanites: ripe in iniquity, the Lord cursed the land against them'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/17?lang=eng
    quote: 'this people had rejected every word of God, and they were ripe in iniquity; and the fulness of the wrath of God was upon them'
  - where: 'note 5:9 “When the Lord’s patience ends”'
    claim: 'Nephi on Jerusalem: nearly ripe, to be destroyed save a few led into captivity'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/17?lang=eng
    quote: 'the time has come that they have become wicked, yea, nearly unto ripeness; and I know not but they are at this day about to be destroyed'
  - where: 'note 5:9 “When the Lord’s patience ends”'
    claim: 'Church footnote on “visit”: Hebrew “punish”, also verse 29; Jer. 9:9 and 44:22'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/5?lang=eng
    quote: 'OR punish (also v. 29).'
  - where: 'note 5:9 “When the Lord’s patience ends”'
    claim: 'Jeremiah 44:22: the Lord could no longer bear the evil of their doings'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/44?lang=eng
    quote: 'So that the Lord could no longer bear, because of the evil of your doings'
  - where: 'note 5:10 “Judgment with a limit”'
    claim: 'Jer. 4:27: the whole land desolate yet not a full end (Church footnote on 5:10)'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/4?lang=eng
    quote: 'The whole land shall be desolate; yet will I not make a full end.'
  - where: 'note 5:10 “Judgment with a limit”'
    claim: 'Church footnote on 5:10 points to Jer. 39:8; the Chaldeans broke down the walls and burned the city'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/39?lang=eng
    quote: 'the Chaldeans burned the king’s house, and the houses of the people, with fire, and brake down the walls of Jerusalem.'
  - where: 'note 5:10 “Judgment with a limit”'
    claim: 'Jer. 39:9: the remnant carried captive to Babylon'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/39?lang=eng
    quote: 'carried away captive into Babylon the remnant of the people that remained in the city'
  - where: 'note 5:10 “Judgment with a limit”'
    claim: 'Nephi: destroyed save a few only led away into captivity'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/17?lang=eng
    quote: 'they must be destroyed, save a few only, who shall be led away into captivity.'
  - where: 'note 5:10 “Battlements or tendrils?”'
    claim: 'One reading: the tendrils are spurious members of the nation, removed while the vine is left'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/5.htm
    quote: 'The spoilers are not to root up the vine itself, but to remove the tendrils, which do not belong to Jahveh. Spurious members of the nation are meant, those who have degenerated out of their kind.'
  - where: 'note 5:12 “He will do nothing”'
    claim: 'False prophets such as Hananiah gave the opposite message; the root cause was unwillingness to listen to true prophets'
    key: sc-knowhy-451
    url: https://scripturecentral.org/knowhy/why-did-some-in-lehis-time-believe-that-jerusalem-could-not-be-destroyed
    quote: 'the most basic factor was that they were unwilling to listen to the true and living prophets of God.'
  - where: 'note 5:12 “He will do nothing”'
    claim: 'Jer. 14:13: prophets promise no sword or famine (Church footnote on 5:12)'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/14?lang=eng
    quote: 'the prophets say unto them, Ye shall not see the sword, neither shall ye have famine; but I will give you assured peace in this place.'
  - where: 'note 5:12 “He will do nothing”'
    claim: 'Nephi: the Jews mocked Lehi and sought his life'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/1?lang=eng
    quote: 'the Jews did mock him because of the things which he testified of them'
  - where: 'note 5:14 “Words as fire”'
    claim: 'Jer. 1:9: the Lord put His words in Jeremiah’s mouth'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/1?lang=eng
    quote: 'Then the Lord put forth his hand, and touched my mouth. And the Lord said unto me, Behold, I have put my words in thy mouth.'
  - where: 'note 5:14 “Words as fire”'
    claim: 'Jer. 23:29: the Lord''s word is like fire and a hammer'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/23?lang=eng
    quote: 'Is not my word like as a fire? saith the Lord; and like a hammer that breaketh the rock in pieces?'
  - where: 'note 5:15 “A nation from far”'
    claim: 'Deut. 28:49–51: a nation from far whose tongue Israel will not understand, eating cattle and land'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/deut/28?lang=eng
    quote: 'The Lord shall bring a nation against thee from far, from the end of the earth, as swift as the eagle flieth; a nation whose tongue thou shalt not understand;'
  - where: 'note 5:15 “A nation from far”'
    claim: 'Church footnote to Deut. 28:51 on verse 17 and Isa. 33:19 on verse 15'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/5?lang=eng
    quote: 'Isa. 33:19.'
  - where: 'note 5:15 “A nation from far”'
    claim: 'Isaiah 33:19: a people of a speech Israel cannot perceive'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/isa/33?lang=eng
    quote: 'a people of a deeper speech than thou canst perceive; of a stammering tongue, that thou canst not understand.'
  - where: 'note 5:15 “A nation from far”'
    claim: 'Jer. 25:9: the Lord names Nebuchadrezzar king of Babylon as His servant bringing the families of the north'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/25?lang=eng
    quote: 'I will send and take all the families of the north, saith the Lord, and Nebuchadrezzar the king of Babylon, my servant'
  - where: 'note 5:15 “A nation from far”'
    claim: 'Jer. 6:22: a people from the north country'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/6?lang=eng
    quote: 'Behold, a people cometh from the north country, and a great nation shall be raised from the sides of the earth.'
  - where: 'note 5:19 “The punishment fits the offense”'
    claim: 'Jer. 25:11: nations serve the king of Babylon seventy years'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/25?lang=eng
    quote: 'these nations shall serve the king of Babylon seventy years.'
  - where: 'note 5:21 “Eyes and ears”'
    claim: 'Church footnote on “hear” links to Matt. 13:14'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/5?lang=eng
    quote: 'Matt. 13:14.'
  - where: 'note 5:21 “Eyes and ears”'
    claim: 'Matthew 13:14–15 says Isaiah’s prophecy of seeing and not perceiving is fulfilled'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/nt/matt/13?lang=eng
    quote: 'And in them is fulfilled the prophecy of Esaias, which saith, By hearing ye shall hear, and shall not understand; and seeing ye shall see, and shall not perceive:'
  - where: 'note 5:21 “Eyes and ears”'
    claim: 'Isaiah 6:9 is the source of the wording'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/isa/6?lang=eng
    quote: 'Go, and tell this people, Hear ye indeed, but understand not; and see ye indeed, but perceive not.'
  - where: 'note 5:22 “The sand for the bound of the sea”'
    claim: 'Job 38:10–11: the Lord set bars and doors for the sea: hitherto but no further'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/job/38?lang=eng
    quote: 'And said, Hitherto shalt thou come, but no further: and here shall thy proud waves be stayed?'
  - where: 'note 5:24 “The former and the latter rain”'
    claim: 'Church footnote: former and latter rain = winter and spring'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/5?lang=eng
    quote: 'IE winter and spring.'
  - where: 'note 5:24 “The former and the latter rain”'
    claim: 'Deut. 11:13–14: rain in due season promised for obedience'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/deut/11?lang=eng
    quote: 'if ye shall hearken diligently unto my commandments which I command you this day, to love the Lord your God'
  - where: 'note 5:24 “The former and the latter rain”'
    claim: 'Deut. 11:14: the first rain and the latter rain'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/deut/11?lang=eng
    quote: 'That I will give you the rain of your land in his due season, the first rain and the latter rain'
  - where: 'note 5:26 “A cage full of birds”'
    claim: 'The people laid snares for other men and grew fat on illegal gains (verses 26–28)'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'like those who trap birds, the people laid snares for other men and grew fat with the illegal gains'
