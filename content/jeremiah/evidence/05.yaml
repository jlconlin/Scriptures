    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/5?lang=eng
    quote: 'Jer. 7:8; Lam. 4:13.'
  - where: 'note 5:31 “Love to have it so”'
    claim: 'Lamentations 4:13: the sins of her prophets and iniquities of her priests'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/lam/4?lang=eng
    quote: 'For the sins of her prophets, and the iniquities of her priests, that have shed the blood of the just in the midst of her,'
  - where: 'note 5:31 “Love to have it so”'
    claim: 'Jer. 7:8: trust in lying words'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/7?lang=eng
    quote: 'Behold, ye trust in lying words, that cannot profit.'
  - where: 'note 5:31 “Love to have it so”'
    claim: 'Nephi defines priestcraft'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/26?lang=eng
    quote: 'priestcrafts are that men preach and set themselves up for a light unto the world, that they may get gain and praise of the world; but they seek not the welfare of Zion.'
  - where: 'note 5:31 “Love to have it so”'
    claim: 'The national tragedy was that the people loved it'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'It was bad enough that the society of Judah was filled with corrupt prophets and priests, but the real national tragedy'
  - where: 'christ'
    claim: 'Isaiah 59:16: He saw there was no man, no intercessor, and His arm brought salvation'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/isa/59?lang=eng
    quote: 'And he saw that there was no man, and wondered that there was no intercessor: therefore his arm brought salvation unto him'
  - where: 'setting'
    claim: 'Laman and Lemuel did not believe Jerusalem could be destroyed'
    key: sc-knowhy-451
    url: https://scripturecentral.org/knowhy/why-did-some-in-lehis-time-believe-that-jerusalem-could-not-be-destroyed
    quote: 'Laman and Lemuel, the sons of the prophet Lehi, had believed similarly when their own father was called to be a prophet of God.'
