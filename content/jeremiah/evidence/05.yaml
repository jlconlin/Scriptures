    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/44?lang=eng
    quote: 'Then Jeremiah said unto all the people, to the men, and to the women, and to all the people which had given him that answer'
  - where: 'note 5:10 “Battlements or tendrils?”'
    claim: 'The Hebrew word rendered “battlements” means twig or tendril of a vine; it occurs in Isa. 18:5, Jer. 5:10 and 48:32; in Isaiah and Jer. 5 of destroying a city under the figure of a vineyard'
    key: bdb
    url: https://biblehub.com/hebrew/5189.htm
    quote: 'twig, tendril of vine (as spreading , compare √ Niph`al 3 ); — only plural'
  - where: 'note 5:10 “Battlements or tendrils?”'
    claim: 'In Isa. 18:5 and Jer. 5:10 the word is used of destroying a city under the figure of a vineyard'
    key: bdb
    url: https://biblehub.com/hebrew/5189.htm
    quote: 'in both of destroying city (under figure of vineyard)'
  - where: 'section 2 plain'
    claim: 'The plain renders “battlements” as “tendrils”'
    key: bdb
    url: https://biblehub.com/hebrew/5189.htm
    quote: 'twig, tendril of vine'
  - where: 'note 5:10 “Battlements or tendrils?”'
    claim: 'Hebrew of Jer. 5:10: netishoteha (Strong 5189) is the word rendered battlements'
    key: oshb-wlc
    url: https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml
    quote: '<w lemma="5189" n="0.1" morph="HNcfpc/Sp3fs" id="246P5">נְטִ֣ישׁוֹתֶ֔י/הָ</w>'
  - where: 'note 5:12 “He will do nothing”'
    claim: 'One reading: verse 13 is a threat against the false prophets, who become wind, the Spirit of God not being in them'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/5.htm
    quote: 'Such prophets are to become wind, sc. with their utterances.'
  - where: 'note 5:12 “He will do nothing”'
    claim: 'Same reading: the false prophets told the people evil would not come; the Spirit of God is not in them'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/5.htm
    quote: 'Doubtless the false prophets assured the people: evil shall not come upon you'
  - where: 'thread'
    claim: 'False prophets backed the belief that Jerusalem would be preserved'
    key: sc-knowhy-451
    url: https://scripturecentral.org/knowhy/why-did-some-in-lehis-time-believe-that-jerusalem-could-not-be-destroyed
    quote: 'there were also false prophets, such as Hananiah (Jeremiah 28:15) who gave the opposite message—that God would preserve them from their enemies.'
  - where: 'note 5:4 “The poor and the great”'
    claim: 'The poor are the common people'
