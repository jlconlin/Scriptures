chapter: 31
claims:
  - where: 'setting'
    claim: 'Chapters 30–33 are about the latter-day restoration of Israel and Judah and a new and everlasting covenant'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'Chapters 30–33 deal with the prophet’s predictions of the restoration of Israel and Judah in the last days and of the Lord’s making a new and everlasting covenant with them.'
  - where: 'setting'
    claim: 'The Bible Dictionary places chapters 30–33 under Zedekiah (597–586) as prophecies of the latter-day restoration and the gospel covenant'
    key: bd-jeremiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng'
    quote: 'Prophecies under Zedekiah (597–586), Jer. 21–38'
  - where: 'setting'
    claim: 'Bible Dictionary: (c) Jer. 30–33 are prophecies of the latter-day restoration of Israel and the gospel covenant'
    key: bd-jeremiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng'
    quote: '(c) Jer. 30–33, prophecies of the latter-day restoration of Israel and the gospel covenant'
  - where: 'setting'
    claim: 'Chapter 32 is dated to the tenth year of Zedekiah, the eighteenth of Nebuchadrezzar, during the siege'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/32?lang=eng'
    quote: 'The word that came to Jeremiah from the Lord in the tenth year of Zedekiah king of Judah, which was the eighteenth year of Nebuchadrezzar.'
  - where: 'setting'
    claim: 'Chapters 30–31 carry no date of their own; commentators differ on when they were composed; Jeremiah was told to write them in a book'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/30.htm'
    quote: 'the address contained in Jeremiah 30 and 31, on the other hand, belongs to a somewhat earlier period, and was not uttered publicly before the people, but simply composed in writing'
  - where: 'setting'
    claim: 'Church chapter heading for Jeremiah 31 (last-day gathering, Ephraim birthright, new covenant written in the heart)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/31?lang=eng'
    quote: 'In the last days, Israel will be gathered—The Lord declares that Ephraim has the birthright as the firstborn—The Lord will make a new covenant with Israel, to be inscribed in the heart'
  - where: 'setting'
    claim: 'Matthew 2:17–18 quotes verse 15 as spoken by Jeremy the prophet'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/2?lang=eng'
    quote: 'Then was fulfilled that which was spoken by Jeremy the prophet, saying, 18 In Rama was there a voice heard, lamentation, and weeping, and great mourning, Rachel weeping for her children'
  - where: 'note 31:6 “Watchmen on Ephraim’s mountain”'
    claim: 'The manual reads the watchmen as latter-day prophets and the north country as in D&C 110:11; 133:26'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'The watchmen mentioned in verse 6 are the righteous prophets of the latter days (see also Ezekiel 3:16–21).'
  - where: 'note 31:6 “Watchmen on Ephraim’s mountain”'
    claim: 'The manual connects the north country of verse 8 to D&C 110:11 and 133:26'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'Verse 8 speaks of gathered Israel coming from the north country (see D&C 110:11; 133:26) and from the coasts (ends) of the earth.'
  - where: 'note 31:6 “Watchmen on Ephraim’s mountain”'
    claim: 'D&C 133:26 says those in the north countries shall come in remembrance before the Lord'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/133?lang=eng'
    quote: 'And they who are in the north countries shall come in remembrance before the Lord; and their prophets shall hear his voice'
  - where: 'note 31:9 “Ephraim, my firstborn”'
    claim: 'Israel is called the Lord’s firstborn son at the exodus'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/4?lang=eng'
    quote: 'Thus saith the Lord, Israel is my son, even my firstborn'
  - where: 'note 31:9 “Ephraim, my firstborn”'
    claim: 'Reuben forfeited the birthright, which was given to the sons of Joseph'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/5?lang=eng'
    quote: 'his birthright was given unto the sons of Joseph the son of Israel'
  - where: 'note 31:9 “Ephraim, my firstborn”'
    claim: 'Jacob set Ephraim before Manasseh'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/48?lang=eng'
    quote: 'and he blessed them that day, saying, In thee shall Israel bless, saying, God make thee as Ephraim and as Manasseh: and he set Ephraim before Manasseh.'
  - where: 'note 31:9 “Ephraim, my firstborn”'
    claim: 'D&C 133:30–34 gives the children of Ephraim a role in the gathering from the north'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/133?lang=eng'
    quote: 'Behold, this is the blessing of the everlasting God upon the tribes of Israel, and the richer blessing upon the head of Ephraim and his fellows.'
  - where: 'note 31:15 “Rachel weeping at Ramah”'
    claim: 'Matthew’s “fulfilled” is read as a new fulfilment, not a direct prediction of Herod’s massacre; the exile is a type'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/31.htm'
    quote: 'The expression ἐπληρώθη, used by Matthew, only shows that the prophecy of Jeremiah received a new fulfilment through that act of Herod.'
  - where: 'note 31:15 “Rachel weeping at Ramah”'
    claim: 'The manual reads Rachel as weeping for children taken captive; the comfort follows in verses 16–17'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'She is here depicted as bitterly weeping for her children and refusing to be comforted because she had none, for they had been taken captive.'
  - where: 'note 31:22 “A woman shall compass a man”'
    claim: 'The manual reads “compass” as to encompass with love and care, and ties the new thing to the new covenant'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'signifies to encompass with love and care, to surround lovingly and carefully'
  - where: 'note 31:22 “A woman shall compass a man”'
    claim: 'The manual’s quotation sees a new relation of Israel to the Lord and a reference to the new covenant'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'Herein is expressed a new relation of Israel to the Lord, a reference to a new covenant which the Lord, ver. 31ff., will conclude with His people'
  - where: 'note 31:26 “Who is speaking in verse 26”'
    claim: 'Most take verse 26 as the prophet; Keil argues so; others refer it to God or the people'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/31.htm'
    quote: 'There is thus nothing left for us but to take this verse, as the Targum, Raschi, Kimchi, Venema, Dahler, Hitzig, Hengstenberg, and others have done, as a remark by the prophet regarding his feelings when he received this revelation'
  - where: 'note 31:26 “Who is speaking in verse 26”'
    claim: 'Some read the waking as God’s; Keil objects that Scripture nowhere attributes sleep to God'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/31.htm'
    quote: 'nowhere in Scripture is sleep attributed to God'
  - where: 'note 31:29 “The sour grape”'
    claim: 'Ezekiel 18 quotes the same proverb and denies it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/18?lang=eng'
    quote: 'The soul that sinneth, it shall die. The son shall not bear the iniquity of the father, neither shall the father bear the iniquity of the son'
  - where: 'note 31:29 “The sour grape”'
    claim: 'The manual says the proverb conveyed that children are affected by their parents, and that children may suffer consequences of parental sins'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'This proverb conveyed the idea that children are affected by what their parents are and do.'
  - where: 'note 31:29 “The sour grape”'
    claim: 'Children may suffer the consequences of parental sins, though not punished for them in a final sense'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'Nevertheless, as the following statement shows, children may suffer the consequences of parental sins'
  - where: 'note 31:31 “A new covenant”'
    claim: 'Joseph Smith: the covenant of Jer. 31 has never been established with Israel or Judah, and the requirements of the new covenant are repentance, baptism and the laying on of hands'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'This covenant has never been established with the house of Israel, nor with the house of Judah, for it requires two parties to make a covenant'
  - where: 'note 31:31 “A new covenant”'
    claim: 'The same passage lists the requirements as repentance, baptism, and receiving the Holy Spirit by laying on of hands'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'Repent of all your sins, and be baptized in water for the remission of them, in the name of the Father, and of the Son, and of the Holy Ghost, and receive the ordinance of the laying on of the hands of him who is ordained and sealed unto this power'
  - where: 'note 31:31 “A new covenant”'
    claim: 'Hebrews 8:8–12 quotes Jer. 31:31–34 and Hebrews 10:16–17 quotes part again; Christ is mediator of a better covenant'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/8?lang=eng'
    quote: 'he is the mediator of a better covenant, which was established upon better promises'
  - where: 'note 31:31 “A new covenant”'
    claim: 'Hebrews 10:16–17 quotes the new covenant again'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/10?lang=eng'
    quote: 'This is the covenant that I will make with them after those days, saith the Lord, I will put my laws into their hearts, and in their minds will I write them'
  - where: 'note 31:31 “A new covenant”'
    claim: 'D&C 22:1 calls baptism a new and an everlasting covenant that replaces old covenants'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/22?lang=eng'
    quote: 'all old covenants have I caused to be done away in this thing; and this is a new and an everlasting covenant, even that which was from the beginning'
  - where: 'note 31:31 “A new covenant”'
    claim: 'D&C 66:2 calls the everlasting covenant the fulness of the gospel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/66?lang=eng'
    quote: 'blessed are you for receiving mine everlasting covenant, even the fulness of my gospel'
  - where: 'note 31:32 “Husband, and what Hebrews does with it”'
    claim: 'Hebrews 8:9 reads “I regarded them not”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/8?lang=eng'
    quote: 'because they continued not in my covenant, and I regarded them not, saith the Lord.'
  - where: 'note 31:32 “Husband, and what Hebrews does with it”'
    claim: 'The Greek of the Septuagint (Brenton’s English) reads “I disregarded them”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/jeremiah/31.htm'
    quote: 'for they abode not in my covenant, and I disregarded them, saith the Lord.'
  - where: 'note 31:33 “Written in the heart”'
    claim: 'Paul: epistle written not with ink but with the Spirit, in fleshy tables of the heart'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/2-cor/3?lang=eng'
    quote: 'written not with ink, but with the Spirit of the living God; not in tables of stone, but in fleshy tables of the heart'
  - where: 'note 31:33 “Written in the heart”'
    claim: 'Ezekiel 36:26–27: a new heart, the Lord’s spirit within'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/36?lang=eng'
    quote: 'A new heart also will I give you, and a new spirit will I put within you'
  - where: 'note 31:34 “Every man his own teacher”'
    claim: 'Joseph Fielding Smith on the promise that all shall know the Lord'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'The Lord has promised that the time shall come when every man shall be his own teacher, that is, he will know because of righteous living what to do.'
  - where: 'note 31:36 “If the ordinances depart”'
    claim: 'The manual reads the verse as a warning that if saving priesthood ordinances ceased, Israel would too'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'if those saving and exalting priesthood ordinances cease to exist, then Israel also will cease to exist—forever'
  - where: 'note 31:38 “The rebuilt city”'
    claim: 'Tower of Hananeel at the northeast corner of the wall, corner gate at the northwest; the line describes the north side'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/31.htm'
    quote: 'The tower of Hananeel, according to Nehemiah 3:1 and Zechariah 4:10, was situated on the north-east corner of the city wall'
  - where: 'note 31:38 “The rebuilt city”'
    claim: 'Gareb and Goah are unknown places; the new city is to include districts that lay outside the old city as unclean places'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/31.htm'
    quote: 'These two places last named are unknown.'
  - where: 'note 31:38 “The rebuilt city”'
    claim: 'The valley of corpses and ashes is the valley of Ben-hinnom, defiled by Moloch worship, to be included in the holy city'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/31.htm'
    quote: 'By "the valley of the corpses and of the ashes" expositors generally and rightly understand the valley of Ben-hinnom'
  - where: 'note 31:38 “The rebuilt city”'
    claim: 'The new city is to include districts that lay outside the old city as unclean places'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/31.htm'
    quote: 'include within it districts or spots which lay outside old (i.e., pre-and post-exile) Jerusalem, and which had been divided off from the city, as unclean places'
  - where: 'christ'
    claim: 'Hebrews 8:6: Christ is the mediator of a better covenant'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/8?lang=eng'
    quote: 'he is the mediator of a better covenant, which was established upon better promises'
  - where: 'setting'
    claim: 'Commentators differ on when chapters 30–31 were composed'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/30.htm'
    quote: 'As regards the exact time of its composition, the views of modern expositors are very dissimilar.'
  - where: 'note 31:22 “A woman shall compass a man”'
    claim: 'The manual’s quoted reading: the woman, the weaker, surrounds the man, the stronger'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'the woman, the weaker nature that needs help, will lovingly and solicitously surround the man, the stronger'
  - where: 'note 31:26 “Who is speaking in verse 26”'
    claim: 'Keil admits the objection that Jeremiah nowhere says God revealed Himself in a dream'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/31.htm'
    quote: 'Jeremiah nowhere says God had revealed Himself to him in a dream'
  - where: 'note 31:29 “The sour grape”'
    claim: 'Those who used the proverb overlooked the qualifying statement in Exodus 20:5–6'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'overlooking the qualifying statement in Exodus 20:5–6'
  - where: 'note 31:31 “A new covenant”'
    claim: 'Hebrews 8:8 quotes “I will make a new covenant with the house of Israel and with the house of Judah”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/8?lang=eng'
    quote: 'Behold, the days come, saith the Lord, when I will make a new covenant with the house of Israel and with the house of Judah'
  - where: 'note 31:38 “The rebuilt city”'
    claim: 'The valley was defiled by Josiah’s pollution of the place of offerings to Moloch'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/31.htm'
    quote: 'in consequence of the pollution by Josiah of the place where the abominations had been offered to Moloch (2 Kings 23:10)'
  - where: 'christ'
    claim: 'Joseph Smith: Christ, in the days of His flesh, proposed the covenant'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'Christ, in the days of His flesh, proposed to make a covenant with them, but they rejected Him and His proposals'
  - where: 'setting'
    claim: 'Jeremiah is told to write the words in a book, for the days come when the Lord will bring His people back'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/30?lang=eng'
    quote: 'Write thee all the words that I have spoken unto thee in a book. 3 For, lo, the days come, saith the Lord, that I will bring again the captivity of my people'
  - where: 'note 31:3 “From afar, or of old”'
    claim: 'The first word of the clause, mērāḥôq, is glossed “From afar” in the interlinear'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/jeremiah/31-3.htm'
    quote: 'mê·rā·ḥō·wq … מֵרָח֕וֹק … From afar'
  - where: 'note 31:3 “From afar, or of old”'
    claim: 'With the preposition min, rāḥôq means “from a distance” of space, and “long ago” of time'
    key: bdb
    url: 'https://biblehub.com/hebrew/7350.htm'
    quote: '(1) ׳ מֵר from a distance , with verbs implying motion … b. of time , ׳ מֵר long ago Isaiah 22:11'
  - where: 'note 31:6 “Watchmen on Ephraim’s mountain”'
    claim: 'Ephraim’s jealousy of Judah did much to bring about the separation of the two kingdoms'
    key: bd-ephraim
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ephraim?lang=eng'
    quote: 'It was Ephraim’s jealousy of Judah that in great measure brought about the separation of the two kingdoms'
  - where: 'note 31:9 “Ephraim, my firstborn”'
    claim: 'The Church’s chapter heading: Ephraim has the birthright as the firstborn'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/31?lang=eng'
    quote: 'The Lord declares that Ephraim has the birthright as the firstborn'
  - where: 'note 31:15 “Rachel weeping at Ramah”'
    claim: 'Rachel is the mother of Joseph'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/30?lang=eng'
    quote: 'And she called his name Joseph'
  - where: 'note 31:15 “Rachel weeping at Ramah”'
    claim: 'Rachel was buried on the way to Ephrath, which is Bethlehem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/35?lang=eng'
    quote: 'And Rachel died, and was buried in the way to Ephrath, which is Beth-lehem.'
  - where: 'note 31:15 “Rachel weeping at Ramah”'
    claim: 'Ramah as the loftiest border town of the two kingdoms, whence the wailing sounded far and near'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'The lamentation of Rachel is heard at Ramah, as the most loftily situated border-town of the two kingdoms, whence the wailing that had arisen sounded far and near, and could be heard in Judah.'
  - where: 'note 31:15 “Rachel weeping at Ramah”'
    claim: 'The exile is read as a type of the Bethlehem massacre'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'The destruction of the people of Israel by the Assyrians and Chaldeans is a type of the massacre of the infants at Bethlehem'
  - where: 'note 31:15 “Rachel weeping at Ramah”'
    claim: 'The same reading of Ramah, in the underlying commentary the manual quotes'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/31.htm'
    quote: 'The lamentation of Rachel is heard at Ramah, as the most loftily situated border-town of the two kingdoms, whence the wailing that had arisen sounded far and near'
  - where: 'note 31:20 “Ephraim answered with pity”'
    claim: 'mēʿîm, inward parts, figuratively the seat of emotions; in Jer. 31:20 of God’s compassion'
    key: bdb
    url: 'https://biblehub.com/hebrew/4578.htm'
    quote: '5 figurative = seat of emotions: pity, Isaiah 16:11 ("" קֶרֶב ); of God''s compassion, Jeremiah 31:20'
  - where: 'note 31:22 “A woman shall compass a man”'
    claim: 'sābab: turn about, go around, surround'
    key: bdb
    url: 'https://biblehub.com/hebrew/5437.htm'
    quote: 'סָבַב verb turn about, go around, surround'
  - where: 'note 31:22 “A woman shall compass a man”'
    claim: 'In poetry, encompass with protection; Jer. 31:22 read either as “shall protect” (most) or as Israel pressing round her divine husband instead of holding aloof'
    key: bdb
    url: 'https://biblehub.com/hebrew/5437.htm'
    quote: 'i.e. either shall protect (so most) or (Che, compare Gf) the woman (figurative of Israel), instead of holding aloof ( הַבַּת הַשּׁוֺבֵבָה Jeremiah 31:22 ), will, in the new future which ׳ י creates, with affection press round her divine husband'
  - where: 'note 31:22 “A woman shall compass a man”'
    claim: 'The reading the manual quotes is Keil’s own'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/31.htm'
    quote: 'Herein is expressed a new relation of Israel to the Lord, a reference to a new covenant'
  - where: 'note 31:32 “Husband, and what Hebrews does with it”'
    claim: 'bāʿal followed by bĕ in Jer. 31:32 means be lord (husband) over'
    key: bdb
    url: 'https://biblehub.com/hebrew/1166.htm'
    quote: 'followed by בְּ Jeremiah 3:14 ; Jeremiah 31:32 be lord (husband) over'
  - where: 'note 31:32 “Husband, and what Hebrews does with it”'
    claim: 'Brenton marks the verse as 38:32 in the Greek numbering'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/jeremiah/31.htm'
    quote: '32 (38:32) not according to the covenant which I made with their fathers'
  - where: 'note 31:33 “Written in the heart”'
    claim: 'qereb: inward part of a man as seat of thought and emotion, parallel to the heart in Jer. 31:33'
    key: bdb
    url: 'https://biblehub.com/hebrew/7130.htm'
    quote: '2 of inward part of man ; a. as seat of thought and emotion'
  - where: 'note 31:33 “Written in the heart”'
    claim: 'qereb parallel to “upon the heart” in Jer. 31:33'
    key: bdb
    url: 'https://biblehub.com/hebrew/7130.htm'
    quote: 'עַללֵֿב Jeremiah 31:33'
  - where: 'note 31:38 “The rebuilt city”'
    claim: 'The gate of the corner was at the northwest; the line describes the whole north side'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/31.htm'
    quote: 'the gate of the corner was at the north-west corner of the city'
