chapter: 1
claims:
  - where: 'when'
    claim: 'Jeremiah prophesied from the 13th year of Josiah until after the fall of Jerusalem, 626–586 B.C.'
    key: bd-jeremiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng
    quote: 'prophesied from the 13th year of Josiah till after the downfall of Jerusalem, a period of over 40 years, 626–586 B.C.'
  - where: 'setting'
    claim: 'Jeremiah''s ministry ran 626–586 B.C., over 40 years'
    key: bd-jeremiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng
    quote: 'a period of over 40 years, 626–586 B.C.'
  - where: 'setting'
    claim: 'Jeremiah was born into a priestly family in Anathoth'
    key: bd-jeremiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng
    quote: 'Born of a priestly family in Anathoth'
  - where: 'setting'
    claim: 'Anathoth is a priestly town a few miles northeast of Jerusalem in Benjamin'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'Anathoth, a town of the priests that lay a few miles northeast of Jerusalem in the tribal territory of Benjamin'
  - where: 'setting'
    claim: 'The book is arranged by reign and Jeremiah 1–6 belong to Josiah''s reign'
    key: bd-jeremiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng
    quote: 'Prophecies of reign of Josiah (626–608), Jer. 1–6.'
  - where: 'setting'
    claim: 'The call narrative falls into the call (4–8), consecration (9–10), and two signs (11–19)'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/1.htm
    quote: 'the call on the part of the Lord, Jeremiah 1:4-8; Jeremiah''s consecration for his calling in Jeremiah 1:9-10; and in two signs'
  - where: 'setting'
    claim: 'The Church''s chapter heading says Jeremiah was foreordained and called as a mortal'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/1?lang=eng
    quote: 'Jeremiah was foreordained to be a prophet unto the nations—He is called as a mortal to declare the word of the Lord.'
  - where: 'setting'
    claim: 'Lehi prophesied in Jerusalem while Jeremiah served there'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'the leading prophet in Jerusalem, serving with Habakkuk, Zephaniah, Lehi, and others (see 1 Nephi 1:4)'
  - where: 'setting'
    claim: 'Jeremiah''s prophecies were on the brass plates'
    key: bd-jeremiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng
    quote: 'Some of Jeremiah’s prophecies were contained in the brass plates of Laban secured by Nephi (1 Ne. 5:10–13).'
  - where: 'thread'
    claim: 'The word of God is a power that carries out His will'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/1.htm
    quote: 'The word of God is a power that carries out His will'
  - where: 'thread'
    claim: 'Four words of destroying come first and two of building after, indicating his labours would be for the most part proclaiming judgment (one reading)'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/1.htm
    quote: 'the building is given only in two words, and these standing after the four; in order, doubtless, to indicate that the labours of Jeremiah should consist, in the first place and for the most part, in proclaiming judgment'
  - where: 'section 4 plain'
    claim: 'The end of v. 13 means the pot faces this way from the north'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/1.htm
    quote: 'I see a seething-pot; and it looketh hither from the north.'
  - where: 'note 1:1 “A priest from Anathoth”'
    claim: 'Jeremiah was born of a priestly family in Anathoth'
    key: bd-jeremiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng
    quote: 'Born of a priestly family in Anathoth'
  - where: 'note 1:1 “A priest from Anathoth”'
    claim: 'Anathoth was a town of the priests a few miles northeast of Jerusalem in Benjamin'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'a town of the priests that lay a few miles northeast of Jerusalem in the tribal territory of Benjamin'
  - where: 'note 1:1 “A priest from Anathoth”'
    claim: 'Identifying Jeremiah''s father with the high priest Hilkiah lacks sufficient grounds (one reading)'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/1.htm
    quote: 'for the high priest of that name who is mentioned in 2 Chronicles 22:4; but without sufficient grounds.'
  - where: 'note 1:1 “A priest from Anathoth”'
    claim: 'Hilkiah was a common name, and the high priest would have lived in Jerusalem, not Anathoth'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/1.htm
    quote: 'For Hilkiah, too, is a name that often occurs; and the high priest is sure to have had his home not in Anathoth, but in Jerusalem.'
  - where: 'note 1:3 “Three reigns, one prophet”'
    claim: 'Bible Dictionary dates the start of Jeremiah''s ministry (13th year of Josiah) to 626 B.C.'
    key: bd-jeremiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng
    quote: 'prophesied from the 13th year of Josiah till after the downfall of Jerusalem, a period of over 40 years, 626–586 B.C.'
  - where: 'note 1:3 “Three reigns, one prophet”'
    claim: 'The manual dates the start of his labors as a youth to approximately 627 B.C.'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'He began his labors as a youth in approximately 627 B.C.'
  - where: 'note 1:3 “Three reigns, one prophet”'
    claim: 'Jehoahaz reigned three months'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/23?lang=eng
    quote: 'and he reigned three months in Jerusalem.'
  - where: 'note 1:3 “Three reigns, one prophet”'
    claim: 'Jehoiachin reigned three months'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng
    quote: 'and he reigned in Jerusalem three months.'
  - where: 'note 1:3 “Three reigns, one prophet”'
    claim: 'After the fall, Jeremiah was taken to Egypt with the survivors'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/43?lang=eng
    quote: 'and Jeremiah the prophet, and Baruch the son of Neriah. 7 So they came into the land of Egypt'
  - where: 'note 1:4 “Lehi’s Jerusalem”'
    claim: 'Jeremiah was the leading prophet in Jerusalem, serving with Lehi and others'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'the leading prophet in Jerusalem, serving with Habakkuk, Zephaniah, Lehi, and others (see 1 Nephi 1:4)'
  - where: 'note 1:4 “Lehi’s Jerusalem”'
    claim: 'Jeremiah left the most extensive writings about Jerusalem at that time'
    key: sc-knowhy-650
    url: https://scripturecentral.org/knowhy/how-did-jeremiahs-and-lehis-ministries-reflect-one-another
    quote: 'Jeremiah left the most extensive and detailed writings about what Jerusalem was like at that time'
  - where: 'note 1:4 “Lehi’s Jerusalem”'
    claim: 'Both ministries began with a divine call and commission'
    key: sc-knowhy-650
    url: https://scripturecentral.org/knowhy/how-did-jeremiahs-and-lehis-ministries-reflect-one-another
    quote: 'The ministries (and accounts) of both Lehi and Jeremiah also began with a divine call and commission from the Lord.'
  - where: 'note 1:5 “Foreknown and foreordained”'
    claim: 'Bible Dictionary reads 1:4–5 as acknowledging premortal existence and Jeremiah''s foreordination'
    key: bd-jeremiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng
    quote: '1:4–5, an acknowledgment of man’s premortal existence, and Jeremiah’s foreordination'
  - where: 'note 1:5 “Foreknown and foreordained”'
    claim: 'The verse is a powerful proof of premortal existence'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'Jeremiah 1:4–5is a powerful proof of our premortal existence as individuals.'
  - where: 'note 1:5 “Foreknown and foreordained”'
    claim: 'Hebrew yada, "knew," connotes a personal, intimate relationship'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'The Hebrew word yada, which is translated knew, connotes a very personal, intimate relationship.'
  - where: 'note 1:5 “Foreknown and foreordained”'
    claim: 'Another reading takes the verse as a divine decree fixed before conception and birth'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/1.htm
    quote: 'Jeremiah''s appointment to be a prophet for the nations follows upon a decree of God''s, fixed before he was conceived or born.'
  - where: 'note 1:5 “Foreknown and foreordained”'
    claim: 'On that reading this is true of all people, but especially of those God chooses as instruments'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/1.htm
    quote: 'This is true of all men, but very especially of those who have been chosen by God to be the extraordinary instruments of His grace'
  - where: 'note 1:5 “Set apart and appointed”'
    claim: 'BDB: the verb behind "sanctified" means set apart, consecrate; lists Jer. 1:5 under God consecrating a prophet'
    key: bdb
    url: https://biblehub.com/hebrew/6942.htm
    quote: 'set apart, devote, consecrate… prophet Jeremiah 1:5'
  - where: 'note 1:5 “Set apart and appointed”'
    claim: 'Jeremiah''s premortal appointment was being foreordained, sanctified, and sent forth'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'Jeremiah’s premortal appointment consisted of being foreordained, sanctified, and sent forth (compare Abraham 3:23).'
  - where: 'note 1:5 “Set apart and appointed”'
    claim: 'Church edition cross-references "nations" to Jer. 25:15–29 and 46:1'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/1?lang=eng
    quote: 'Jer. 25:15 (15–29); 46:1.'
  - where: 'note 1:6 “Too young to speak”'
    claim: 'Hebrew for "child" is "youth," also in v. 7'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/1?lang=eng
    quote: 'HEB youth (also v. 7).'
  - where: 'note 1:6 “Too young to speak”'
    claim: 'He began his labors as a youth'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'He began his labors as a youth in approximately 627 B.C.'
  - where: 'note 1:6 “Too young to speak”'
    claim: 'Jeremiah''s feelings of inadequacy compare with Enoch, Moses, Gideon'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'Compare Jeremiah’s feelings with those of such others as Enoch (see Moses 6:31), Moses (see Exodus 4:10), and Gideon (see Judges 6:15).'
  - where: 'note 1:9 “My words in thy mouth”'
    claim: 'The prophet says what the Lord puts in his mouth; "it is the same" (D&C 1:38)'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'A prophet does not necessarily say what he wants to say, for the Lord puts His own words into the mouth of the prophet. That is why it does not matter whether the word comes direct from God or through His servant'
  - where: 'note 1:9 “My words in thy mouth”'
    claim: 'Church edition links "mouth" in v. 9 to Isa. 6:7'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/1?lang=eng
    quote: 'Isa. 6:7.'
  - where: 'note 1:10 “Four verbs of ruin, two of building”'
    claim: 'Church edition cross-references the verbs to Jer. 18:7 and 45:4'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/1?lang=eng
    quote: 'Jer. 18:7. Jer. 45:4.'
  - where: 'note 1:10 “Four verbs of ruin, two of building”'
    claim: 'Bible Dictionary places chapters 30–33 as prophecies of the latter-day restoration of Israel and the gospel covenant'
    key: bd-jeremiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng
    quote: 'Jer. 30–33, prophecies of the latter-day restoration of Israel and the gospel covenant'
  - where: 'note 1:10 “Four verbs of ruin, two of building”'
    claim: 'BDB: shaqad is the verb in Jer. 31:28 ("watched") and its participle in Jer. 1:12'
    key: bdb
    url: https://biblehub.com/hebrew/8245.htm
    quote: 'שָׁקַ֫דְתִּי Jeremiah 31:28'
  - where: 'note 1:11 “The almond and the watcher”'
    claim: 'BDB: shaqed, almond tree, so called from its early waking out of winter''s sleep'
    key: bdb
    url: https://biblehub.com/hebrew/8247.htm
    quote: 'almond (-tree) (Late Hebrew id.; so called from its early waking out of winter''s sleep'
  - where: 'note 1:11 “The almond and the watcher”'
    claim: 'BDB: shaqad is "watch, wake," participle shoqed in Jer. 1:12'
    key: bdb
    url: https://biblehub.com/hebrew/8245.htm
    quote: 'verb watch, wake'
  - where: 'note 1:11 “The almond and the watcher”'
    claim: 'The almond is the first tree to bud in spring, so the word hastens to fulfillment'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'An almond branch was evidently chosen because it is the first tree to bud in spring. As the almond tree hastens to come into blossom, so would the word of the Lord through Jeremiah hasten to fulfillment.'
  - where: 'note 1:13 “The pot and the north”'
    claim: 'The boiling-over pot symbolizes the disaster the northern kingdoms pour out on Judah'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/1.htm
    quote: 'The seething pot, whose contents boil over, symbolizes the disaster and ruin which the families of the kingdoms of the north will pour out on Judah.'
  - where: 'note 1:13 “The pot and the north”'
    claim: 'The pot is not the Chaldean kingdom itself (one reading)'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/1.htm
    quote: 'the seething pot symbolizes the Chaldeans themselves or the kingdom of Nebuchadnezzar; such a figure would be too unnatural.'
  - where: 'note 1:13 “The pot and the north”'
    claim: '"North" is the direction from which armies from the Euphrates entered the land'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/1.htm
    quote: 'since all armies marching from the Euphrates towards Palestine entered the land from the north.'
  - where: 'note 1:13 “The pot and the north”'
    claim: 'Church edition links "pot" to Ezek. 24:3 (3–5)'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/1?lang=eng
    quote: 'Ezek. 24:3 (3–5).'
  - where: 'note 1:15 “Thrones at the gates”'
    claim: 'Setting thrones is a figure for establishing sovereignty'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/1.htm
    quote: 'To set one''s throne (… cf. Jeremiah 43:10; Jeremiah 49:38) is a figure for the establishing of sovereignty.'
  - where: 'note 1:15 “Thrones at the gates”'
    claim: 'The throne is a sovereign''s, not a judgment seat; Jer. 43:10 shows dominion'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/1.htm
    quote: 'is not the seat of judgment, but the throne of the sovereign; cf. the expression: set the throne upon these stones, Jeremiah 43:10'
  - where: 'note 1:15 “Thrones at the gates”'
    claim: 'The throne-setters are the kings and generals of the northern kingdoms'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/1.htm
    quote: 'The representatives of the kingdoms are meant, the kings and generals.'
  - where: 'note 1:16 “Why the judgment comes”'
    claim: 'Burning incense is a symbol of prayer'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'is a symbol of prayer (see Revelation 5:8; 8:3).'
  - where: 'note 1:16 “Why the judgment comes”'
    claim: 'The people sought help from false gods rather than the Lord'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'The people were seeking help and guidance from the false gods rather than from the Lord.'
  - where: 'note 1:18 “A fortified city and an iron pillar”'
    claim: 'Jeremiah likened to an invincible city, prepared for the onslaught'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'The Lord likened him to an invincible city, preparing Jeremiah to stand firm against the onslaught that would pour out on him on every hand once he started his ministry and condemned the people’s sins.'
  - where: 'christ'
    claim: 'Both Jeremiah and Lehi foresaw the Messiah''s ministry; Hel. 8:20'
    key: sc-knowhy-650
    url: https://scripturecentral.org/knowhy/how-did-jeremiahs-and-lehis-ministries-reflect-one-another
    quote: 'Both prophets foresaw the Messiah’s ministry.'
  - where: 'christ'
    claim: 'Church edition links "command" in v. 7 to Matt. 28:20'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/1?lang=eng
    quote: 'Matt. 28:20; 1 Ne. 3:7.'
  - where: 'explore'
    claim: 'Church edition cross-references "north" in v. 14 to Jer. 4:6, 6:1'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/1?lang=eng
    quote: 'Jer. 4:6; 6:1; 10:22; Ezek. 26:7.'
