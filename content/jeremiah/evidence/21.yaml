chapter: 21
claims:
  - where: 'when'
    claim: 'Zedekiah reigned 597–586; Jeremiah 21–38 are prophecies under Zedekiah'
    key: bd-jeremiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng
    quote: 'Prophecies under Zedekiah (597–586), Jer. 21–38, divisible into several groups.'
  - where: 'setting'
    claim: 'Zedekiah was the last king of Judah'
    key: bd-zedekiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/zedekiah?lang=eng
    quote: 'The last king of Judah, his name changed from Mattaniah to Zedekiah'
  - where: 'setting'
    claim: 'The king of Babylon put Zedekiah on the throne'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng
    quote: 'And the king of Babylon made Mattaniah his father’s brother king in his stead, and changed his name to Zedekiah.'
  - where: 'thread'
    claim: 'The wondrous works the king hoped for recall the rescue under Hezekiah (one reading)'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/21.htm
    quote: 'in the miraculous manner in which He has so often saved us, e.g., under Hezekiah'
  - where: 'note 21:2 “The king hopes for another Hezekiah”'
    claim: '“Go up from” a city means to withdraw from it'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/21.htm
    quote: 'to march against a city in order to besiege it or take it, but with מעל, to withdraw from it, cf. Jeremiah 37:5'
  - where: 'note 21:2 “The king hopes for another Hezekiah”'
    claim: 'The Chaldeans withdrew from Jerusalem when Pharaoh''s army came out of Egypt'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/37?lang=eng
    quote: 'when the Chaldeans that besieged Jerusalem heard tidings of them, they departed from Jerusalem.'
  - where: 'note 21:2 “The king hopes for another Hezekiah”'
    claim: 'The Babylonian siege came about a hundred years after Hezekiah''s rescue'
    key: sc-knowhy-451
    url: https://admin.scripturecentral.org/api/knowhys?filters[slug][$eq]=why-did-some-in-lehis-time-believe-that-jerusalem-could-not-be-destroyed
    quote: 'when the Babylonian armies laid siege to Jerusalem about a hundred years later'
  - where: 'thread'
    claim: 'The defenders retreat into the city with their weapons (verse 4)'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/21.htm
    quote: 'In this they will not succeed, but their weapons will be thrust back into the city.'
  - where: 'setting'
    claim: 'Jeremiah 21–23 are grouped as prophecies on pastors or rulers of the people'
    key: bd-jeremiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng
    quote: '(a) Jer. 21–23, on pastors or rulers of the people, with promise of the king Messiah (23:1–6)'
  - where: 'setting'
    claim: 'Nebuchadrezzar came against Jerusalem in Zedekiah''s ninth year, tenth month, and the city was besieged until his eleventh year'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/25?lang=eng
    quote: 'in the ninth year of his reign, in the tenth month, in the tenth day of the month, that Nebuchadnezzar king of Babylon came, he, and all his host, against Jerusalem'
  - where: 'setting'
    claim: 'The siege lasted to the eleventh year of Zedekiah'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/25?lang=eng
    quote: 'And the city was besieged unto the eleventh year of king Zedekiah.'
  - where: 'setting'
    claim: 'The Church chapter heading'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/21?lang=eng
    quote: 'Jeremiah foretells the siege, captivity, and destruction of Jerusalem—Zedekiah is to be taken captive by Nebuchadrezzar.'
  - where: 'setting'
    claim: 'Response has three parts: no hope of rescue, counsel to surrender, prophecy concerning house of David'
    key: ot-manual-24
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng
    quote: 'Jeremiah’s response had three parts: (1) The answer to the king’s hope that the Lord would intervene to save Jerusalem from the Chaldeans (see Jeremiah 21:4–7) was clear: there was no hope.'
  - where: 'note 21:1 “Two envoys, and not the Pashur of chapter 20”'
    claim: 'Pashur son of Immer was the priest and chief governor who put Jeremiah in the stocks (20:1)'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/20?lang=eng
    quote: 'Now Pashur the son of Immer the priest, who was also chief governor in the house of the Lord, heard that Jeremiah prophesied these things.'
  - where: 'note 21:1 “Two envoys, and not the Pashur of chapter 20”'
    claim: 'Pashur son of Malchiah is among the four who heard Jeremiah and asked for his death (38:1, 4)'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/38?lang=eng
    quote: 'and Pashur the son of Malchiah, heard the words that Jeremiah had spoken unto all the people'
  - where: 'note 21:1 “Two envoys, and not the Pashur of chapter 20”'
    claim: 'The four in 38:1 asked that Jeremiah be put to death'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/38?lang=eng
    quote: 'Therefore the princes said unto the king, We beseech thee, let this man be put to death'
  - where: 'note 21:1 “Two envoys, and not the Pashur of chapter 20”'
    claim: 'Pashur son of Malchiah is not called a priest; he was a court official (one reading)'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/21.htm
    quote: 'he is not called a priest, as is the case with Zephaniah the son of Maaseiah, and with Pashur the son of Immer'
  - where: 'note 21:1 “Two envoys, and not the Pashur of chapter 20”'
    claim: 'Pashur son of Malchiah reappears in 38:1, where the four accusers are court officials (one reading)'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/21.htm
    quote: 'From this passage, where Pashur ben Malchiah appears again, it is clear that the four men there named, who accused Jeremiah for his speech, were government authorities or court officials'
  - where: 'note 21:1 “Two envoys, and not the Pashur of chapter 20”'
    claim: 'The Church edition footnote to Pashur in 21:1 points to both 20:1 and 38:1'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/21?lang=eng
    quote: 'Jer. 20:1; 38:1.'
  - where: 'note 21:1 “Two envoys, and not the Pashur of chapter 20”'
    claim: 'Zephaniah son of Maaseiah held a high position in the priesthood'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/21.htm
    quote: 'he, acc. to Jeremiah 29:25; Jeremiah 37:3; Jeremiah 52:24, held a high position in the priesthood.'
  - where: 'note 21:1 “Two envoys, and not the Pashur of chapter 20”'
    claim: 'Zephaniah is the second priest in 52:24'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/52?lang=eng
    quote: 'And the captain of the guard took Seraiah the chief priest, and Zephaniah the second priest'
  - where: 'note 21:1 “Two envoys, and not the Pashur of chapter 20”'
    claim: 'Zephaniah is sent again in 37:3 and was the priest to whom Shemaiah wrote and who read the letter to Jeremiah (29)'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/37?lang=eng
    quote: 'And Zedekiah the king sent Jehucal the son of Shelemiah and Zephaniah the son of Maaseiah the priest to the prophet Jeremiah, saying, Pray now unto the Lord our God for us.'
  - where: 'note 21:1 “Two envoys, and not the Pashur of chapter 20”'
    claim: 'Zephaniah read the letter in Jeremiah''s hearing'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/29?lang=eng
    quote: 'And Zephaniah the priest read this letter in the ears of Jeremiah the prophet.'
  - where: 'note 21:2 “The king hopes for another Hezekiah”'
    claim: 'Hezekiah sent to Isaiah when Assyria besieged Jerusalem'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/19?lang=eng
    quote: 'And he sent Eliakim, which was over the household, and Shebna the scribe, and the elders of the priests, covered with sackcloth, to Isaiah the prophet the son of Amoz.'
  - where: 'note 21:2 “The king hopes for another Hezekiah”'
    claim: 'The angel smote 185,000 in the Assyrian camp'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/19?lang=eng
    quote: 'the angel of the Lord went out, and smote in the camp of the Assyrians an hundred fourscore and five thousand'
  - where: 'note 21:2 “The king hopes for another Hezekiah”'
    claim: 'Hezekiah''s deliverance strengthened belief that the Lord would preserve Jerusalem'
    key: sc-knowhy-451
    url: https://admin.scripturecentral.org/api/knowhys?filters[slug][$eq]=why-did-some-in-lehis-time-believe-that-jerusalem-could-not-be-destroyed
    quote: 'strengthened the belief that the Lord would preserve Jerusalem and its temple from all enemies.'
  - where: 'note 21:2 “The king hopes for another Hezekiah”'
    claim: 'The king''s request echoes Hezekiah''s mission to Isaiah (one reading)'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/21.htm
    quote: 'in the miraculous manner in which He has so often saved us, e.g., under Hezekiah'
  - where: 'note 21:5 “The Exodus power turned against Israel”'
