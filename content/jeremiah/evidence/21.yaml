    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/deut/4?lang=eng
    quote: 'by a mighty hand, and by a stretched out arm, and by great terrors, according to all that the Lord your God did for you in Egypt before your eyes?'
  - where: 'note 21:5 “The Exodus power turned against Israel”'
    claim: 'The Church edition footnote for verse 5 points to Deut. 4:34'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/21?lang=eng
    quote: 'Deut. 4:34.'
