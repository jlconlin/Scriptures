    url: https://biblehub.com/commentaries/kad/jeremiah/21.htm
    quote: 'in respect that Jerusalem was encircled by mountains of greater height ( Psalm 125:2 ) … In the "rock" we think specially of Mount Zion … The two designations are chosen to indicate the strong situation of Jerusalem.'
  - where: 'note 21:13 “The city that thought it could not be reached”'
    claim: 'When Babylon besieged Jerusalem, many believed it could not be conquered'
