chapter: 38
claims:
  - where: 'setting'
    claim: 'Jeremiah 34-38 are narratives of the prophet''s treatment in the last times of the siege; Zedekiah reigned 597-586'
    key: bd-jeremiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng'
    quote: 'Prophecies under Zedekiah (597–586), Jer. 21–38'
  - where: 'setting'
    claim: 'Jeremiah 34-38 narrate the treatment of the prophet during the last times of the siege'
    key: bd-jeremiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng'
    quote: '(d) Jer. 34–38, narratives of the treatment of the prophet and other events during the last times of the siege.'
  - where: 'setting'
    claim: 'Zedekiah was placed on the throne when Jehoiachin was deposed, and rebelled; Babylon came again'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'When King Jehoiachin rebelled against Babylon, he was deposed and his uncle, Zedekiah, was placed on the throne.'
  - where: 'setting'
    claim: 'Jeremiah''s counsel to surrender was unwelcome; he was viewed as a traitor'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'Jerusalem was under siege, and Jeremiah’s counsel to surrender was not welcome. He was viewed as a traitor and a subversive.'
  - where: 'setting'
    claim: 'The siege was lifted when a pharaoh''s army came, and Jeremiah was arrested, beaten and imprisoned on a charge of fleeing to the Chaldeans'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'Accusing him of fleeing to join the Chaldeans, the Jewish leaders had Jeremiah arrested, beaten, and thrown into prison'
  - where: 'setting'
    claim: 'Jeremiah was put in the court of the prison after the first arrest'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/37?lang=eng'
    quote: 'Then Zedekiah the king commanded that they should commit Jeremiah into the court of the prison'
  - where: 'note 38:1 “The men who once asked for his prayers”'
    claim: 'Jehucal son of Shelemiah was sent by Zedekiah to ask Jeremiah to pray'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/37?lang=eng'
    quote: 'And Zedekiah the king sent Jehucal the son of Shelemiah and Zephaniah the son of Maaseiah the priest to the prophet Jeremiah, saying, Pray now unto the Lord our God for us.'
  - where: 'note 38:1 “The men who once asked for his prayers”'
    claim: 'Pashur son of Melchiah was sent by Zedekiah to Jeremiah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/21?lang=eng'
    quote: 'when king Zedekiah sent unto him Pashur the son of Melchiah, and Zephaniah the son of Maaseiah the priest'
  - where: 'note 38:1 “The men who once asked for his prayers”'
    claim: 'Pashur son of Immer, who put Jeremiah in the stocks, is a different Pashur'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/20?lang=eng'
    quote: 'Now Pashur the son of Immer the priest, who was also chief governor in the house of the Lord, heard that Jeremiah prophesied these things.'
  - where: 'note 38:1 “The men who once asked for his prayers”'
    claim: 'Shephatiah and Gedaliah are not mentioned elsewhere; Gedaliah probably a son of the Pashur of 20:1 (one reading)'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/38.htm'
    quote: 'the other two, Shephatiah the son of Mattan, and Gedaliah the son of Pashur, are not mentioned elsewhere. Gedaliah was probably a son of the Pashur who had once put Jeremiah in the stocks'
  - where: 'note 38:2 “The message from the siege''s first days”'
    claim: 'Jer. 21:9 text'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/21?lang=eng'
    quote: 'He that abideth in this city shall die by the sword, and by the famine, and by the pestilence: but he that goeth out, and falleth to the Chaldeans that besiege you, he shall live, and his life shall be unto him for a prey.'
  - where: 'note 38:2 “The message from the siege''s first days”'
    claim: 'Jer. 45:5 uses the same phrase for Baruch'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/45?lang=eng'
    quote: 'but thy life will I give unto thee for a prey in all places whither thou goest.'
  - where: 'note 38:2 “The message from the siege''s first days”'
    claim: 'Jer. 39:18 uses the same phrase for Ebed-melech'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/39?lang=eng'
    quote: 'but thy life shall be for a prey unto thee: because thou hast put thy trust in me, saith the Lord.'
  - where: 'note 38:2 “The message from the siege''s first days”'
    claim: 'Jeremiah spoke for the Lord, not from a political point of view'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'But of course Jeremiah was not speaking from a political point of view; he spoke for the Lord.'
  - where: 'note 38:2 “The message from the siege''s first days”'
    claim: 'Jeremiah''s counsel to Zedekiah in ch. 21 was how people and royal family could preserve their lives by surrendering'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'Counsel on how the people and the royal family could preserve their lives by surrendering to the Chaldeans'
  - where: 'note 38:4 “The worldly want the prophet silenced”'
    claim: 'The worldly either want to close the mouth of the prophet or act as if he did not exist'
    key: benson-fourteen
    url: 'https://speeches.byu.edu/talks/ezra-taft-benson/fourteen-fundamentals-following-prophet/'
    quote: 'When the prophet points out the sins of the world, the worldly either want to close the mouth of the prophet, or else act as if the prophet didn’t exist, rather than repent of their sins. Popularity is never a test of truth. Many a prophet has been killed or cast out.'
  - where: 'note 38:4 “The worldly want the prophet silenced”'
    claim: 'Earlier the priests and prophets said "This man is worthy to die" (26:11); Church footnote on v4'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/26?lang=eng'
    quote: 'This man is worthy to die; for he hath prophesied against this city, as ye have heard with your ears.'
  - where: 'note 38:4 “The worldly want the prophet silenced”'
    claim: 'Church edition footnote at v4 points to Jer. 26:11'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/38?lang=eng'
    quote: 'Jer. 26:11.'
  - where: 'note 38:5 “A king who cannot, or will not”'
    claim: 'Zedekiah ignored Jeremiah''s warnings and rebelled'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'Ignoring the repeated warnings of Jeremiah, he rebelled, and once again the Babylonians came against Jerusalem.'
  - where: 'note 38:6 “Nephi on Jeremiah in prison”'
    claim: '1 Nephi opens at Zedekiah''s beginning and Lehi leaves shortly afterwards'
    key: sc-knowhy-463
    url: 'https://scripturecentral.org/knowhy/how-could-nephi-have-known-about-jeremiahs-imprisonment'
    quote: 'while 1 Nephi opens at the beginning of Zedekiah’s reign and Lehi and his family leave shortly afterwards'
  - where: 'note 38:6 “Nephi on Jeremiah in prison”'
    claim: 'The imprisonment under Zedekiah appears late in his reign'
    key: sc-knowhy-463
    url: 'https://scripturecentral.org/knowhy/how-could-nephi-have-known-about-jeremiahs-imprisonment'
    quote: 'that biblical evidence appears to place Jeremiah’s imprisonment towards the end of Zedekiah’s reign'
  - where: 'note 38:2 “The message from the siege''s first days”'
    claim: 'From a political point of view one can understand why the leaders reacted'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'From a strictly political point of view, one can understand why the Jewish leaders reacted so strongly against Jeremiah.'
  - where: 'note 38:5 “A king who cannot, or will not”'
    claim: 'Zedekiah''s weak, vacillating character; responded weakly'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'The weak, vacillating character of King Zedekiah manifested itself.'
  - where: 'note 38:5 “A king who cannot, or will not”'
    claim: 'Zedekiah gave way, then relented when friends pleaded for Jeremiah'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'But when Jeremiah’s friends pleaded for his life, Zedekiah relented and had him secretly delivered out of the prison'
  - where: 'note 38:6 “A cistern in the prison yard”'
    claim: 'Hebrew behind dungeon is habbor, "the pit"'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/jeremiah/38-6.htm'
    quote: 'hab·bō·wr הַבּ֣וֹר׀ the pit'
  - where: 'note 38:6 “A cistern in the prison yard”'
    claim: 'A translation renders it cistern with no water but mud'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/jeremiah/38-6.htm'
    quote: 'So they took  Jeremiah and dropped him into the cistern of Malchiah, the king’s son, which was in the courtyard of the guard.'
  - where: 'note 38:6 “A cistern in the prison yard”'
    claim: 'Church edition footnote: Hammelech is Hebrew for "the king"'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/38?lang=eng'
    quote: 'HEB the king.'
  - where: 'note 38:6 “A cistern in the prison yard”'
    claim: 'Earlier Jeremiah was in the house of Jonathan the scribe, then committed to the court of the prison'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/37?lang=eng'
    quote: 'Wherefore the princes were wroth with Jeremiah, and smote him, and put him in prison in the house of Jonathan the scribe: for they had made that the prison.'
  - where: 'note 38:6 “Nephi on Jeremiah in prison”'
    claim: 'Nephi says Jeremiah was cast into prison'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/7?lang=eng'
    quote: 'they have rejected the prophets, and Jeremiah have they cast into prison.'
  - where: 'note 38:6 “Nephi on Jeremiah in prison”'
    claim: 'Jer. 37-38 imprisonment seems late in Zedekiah''s reign while 1 Nephi opens at its beginning; researchers argue for an earlier imprisonment'
    key: sc-knowhy-463
    url: 'https://scripturecentral.org/knowhy/how-could-nephi-have-known-about-jeremiahs-imprisonment'
    quote: 'several researchers, including S. Kent Brown and David R. Seely, have argued that Nephi was likely referring to an earlier incident of Jeremiah being imprisoned'
  - where: 'note 38:6 “Nephi on Jeremiah in prison”'
    claim: 'Brown and Seely: likely imprisoned in last year of Jehoiakim, continuing into early Zedekiah'
    key: brown-jeremiah-imprisonment
    url: 'https://rsc.byu.edu/vol-2-no-1-2001/jeremiahs-imprisonment-date-lehis-departure'
    quote: 'We think it likely that Jeremiah, who was accused of being pro-Babylonian, was imprisoned during the last year of the reign of Jehoiakim'
  - where: 'note 38:6 “Nephi on Jeremiah in prison”'
    claim: 'It is possible Nephi referred to an imprisonment beginning in Jehoiakim''s last year and continuing into Zedekiah''s early months'
    key: brown-jeremiah-imprisonment
    url: 'https://rsc.byu.edu/vol-2-no-1-2001/jeremiahs-imprisonment-date-lehis-departure'
    quote: 'Even so, elements are in place that would not contradict and, indeed, that would support the possibility that Jeremiah had been imprisoned late in Jehoiakim’s kingship or early in Zedekiah’s.'
  - where: 'note 38:6 “Nephi on Jeremiah in prison”'
    claim: 'Chadwick proposed the 605 BC arrest after the first composition of the prophecies (reported by the KnoWhy)'
    key: sc-knowhy-463
    url: 'https://scripturecentral.org/knowhy/how-could-nephi-have-known-about-jeremiahs-imprisonment'
    quote: 'Chadwick proposed that Nephi was referring to the 605 BC imprisonment as opposed to the later and more fully detailed imprisonment under Zedekiah'
  - where: 'note 38:6 “Nephi on Jeremiah in prison”'
    claim: 'Nephi may have heard of the Jer. 37-38 imprisonment on a return trip, or learned of it by revelation'
    key: sc-knowhy-463
    url: 'https://scripturecentral.org/knowhy/how-could-nephi-have-known-about-jeremiahs-imprisonment'
    quote: 'Because Nephi’s account gives no information about how much time elapsed between these two return trips and the family’s initial departure into the deserts of Arabia, it is conceivable that Nephi could have heard about Jeremiah’s imprisonment'
  - where: 'note 38:6 “Nephi on Jeremiah in prison”'
    claim: 'Or learned of it by revelation'
    key: sc-knowhy-463
    url: 'https://scripturecentral.org/knowhy/how-could-nephi-have-known-about-jeremiahs-imprisonment'
    quote: 'Finally, of course, it is also possible that Nephi learned of Jeremiah’s imprisonment by revelation.'
  - where: 'note 38:7 “A foreigner at court”'
