    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/37?lang=eng'
    quote: 'and the king asked him secretly in his house, and said, Is there any word from the Lord?'
  - where: 'note 38:14 “The king asks in secret”'
    claim: 'Nothing further is known about the third entry'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/38.htm'
