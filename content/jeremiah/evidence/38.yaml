    quote: 'Go and speak to Ebed-melech the Ethiopian'
  - where: 'note 38:7 “A foreigner at court”'
    claim: 'Lord''s promise: deliver thee because thou hast trusted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/39?lang=eng'
    quote: 'For I will surely deliver thee, and thou shalt not fall by the sword, but thy life shall be for a prey unto thee: because thou hast put thy trust in me, saith the Lord.'
  - where: 'note 38:7 “A foreigner at court”'
    claim: 'Daily bread ration until all the bread in the city was spent'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/37?lang=eng'
    quote: 'until all the bread in the city were spent.'
