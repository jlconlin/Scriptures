    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-jeremiah/lesson-136-jeremiah-34-41?lang=eng'
    quote: 'refers to Zedekiah and the Jews submitting to the Babylonians rather than fighting against them.'
  - where: 'note 38:17 “If thou wilt assuredly go forth”'
    claim: 'Two if-then statements in 38:17-20'
    key: ot-seminary-teacher-136
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-jeremiah/lesson-136-jeremiah-34-41?lang=eng'
    quote: 'look for two sets of “if–then” statements.'
  - where: 'note 38:17 “If thou wilt assuredly go forth”'
    claim: 'Ballard: response should be positive and prompt'
    key: ballard-his-word
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2001/04/his-word-ye-shall-receive?lang=eng'
    quote: 'When we hear the counsel of the Lord expressed through the words of the President of the Church, our response should be positive and prompt.'
  - where: 'note 38:17 “If thou wilt assuredly go forth”'
    claim: 'Benson: how we respond to the living prophet is a test of faithfulness'
    key: benson-fourteen
    url: 'https://speeches.byu.edu/talks/ezra-taft-benson/fourteen-fundamentals-following-prophet/'
    quote: 'How we respond to the words of a living prophet when he tells us what we need to know, but would rather not hear, is a test of our faithfulness.'
