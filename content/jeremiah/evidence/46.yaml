chapter: 46
claims:
  - where: 'setting'
    claim: 'Church chapter heading: conquest of Egypt by Babylon; Jacob saved'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/46?lang=eng
    quote: 'Jeremiah prophesies the conquest of Egypt by Babylon—Jacob will be saved and will return to his own land.'
  - where: 'setting'
    claim: 'Babylon defeated Egypt at Carchemish in 605 B.C.; Judah became vassal of Babylon'
    key: ot-manual-kings-g
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-g?lang=eng
    quote: 'Babylon defeated the Egyptians at Carchemish in 605 B.C. Judah became a vassal of the new conquerors.'
  - where: 'setting'
    claim: 'Judah''s rulers looked to Egypt for protection against Babylon despite Jeremiah''s warnings'
    key: ot-manual-kings-g
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-g?lang=eng
    quote: 'The political rulers looked to Egypt for protection and power against Babylon’s growing influence, even though Jeremiah had again and again warned Judah not to trust in Egypt for deliverance.'
  - where: 'setting'
    claim: 'Chapters 46–51 are prophecies against foreign nations'
    key: bd-jeremiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng
    quote: '46–51, prophecies against foreign nations.'
  - where: 'thread'
    claim: 'Judah''s rulers looked to Egypt for protection'
    key: ot-manual-kings-g
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-g?lang=eng
    quote: 'The political rulers looked to Egypt for protection and power against Babylon’s growing influence'
  - where: 'setting'
    claim: 'Jer. 46:27–28 also stand in Jer. 30:10–11'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/30?lang=eng
    quote: 'Therefore fear thou not, O my servant Jacob, saith the Lord; neither be dismayed, O Israel: for, lo, I will save thee from afar'
  - where: 'note 46:1 “The call to be a prophet to the nations”'
    claim: 'Church edition footnote on v. 1 points to Jer. 1:5 and 25:15–29'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/46?lang=eng
    quote: 'Jer. 1:5; 25:15 (15–29).'
  - where: 'note 46:1 “The call to be a prophet to the nations”'
    claim: 'Jer. 1:5 text'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/1?lang=eng
    quote: 'I ordained thee a prophet unto the nations.'
  - where: 'note 46:1 “The call to be a prophet to the nations”'
    claim: 'Jer. 25:15, 19 text: cup of fury for all nations, includes Pharaoh'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/25?lang=eng
    quote: 'Pharaoh king of Egypt, and his servants, and his princes, and all his people;'
  - where: 'note 46:1 “The call to be a prophet to the nations”'
    claim: 'Cup is drunk first by Jerusalem and Judah, then Egypt, west and east, Babylonia'
    key: ot-manual-24
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng
    quote: 'Beginning in Jerusalem and the cities of Judah, the bitter cup will be drunk by Egypt, the nations of the west and east, and Babylonia.'
  - where: 'note 46:2 “Who Necho was”'
    claim: 'Josiah was killed at Megiddo resisting Necho'
    key: bd-egypt
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/egypt?lang=eng
    quote: 'it was in resisting the advance of Necho, king of Egypt, that Josiah was killed at Megiddo'
  - where: 'note 46:2 “Who Necho was”'
    claim: '2 Kgs 23:29 account'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/23?lang=eng
    quote: 'In his days Pharaoh-nechoh king of Egypt went up against the king of Assyria to the river Euphrates: and king Josiah went against him; and he slew him at Megiddo'
  - where: 'note 46:2 “Who Necho was”'
    claim: 'Necho''s message to Josiah in Chronicles'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/35?lang=eng
    quote: 'I come not against thee this day, but against the house wherewith I have war: for God commanded me to make haste'
  - where: 'note 46:2 “Who Necho was”'
    claim: 'Jehoahaz taken to Egypt; Jehoiakim ruled as Egyptian vassal'
    key: ot-manual-kings-g
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-g?lang=eng
    quote: 'Then he was taken to Egypt, and his half brother who was given the throne name of Jehoiakim ruled as an Egyptian vassal.'
  - where: 'note 46:2 “Carchemish and the fourth year of Jehoiakim”'
    claim: 'Carchemish 605; Judah vassal; Jehoiakim paid tribute three years'
    key: ot-manual-kings-g
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-g?lang=eng
    quote: 'Jehoaikim paid tribute to Babylon for three years before unsuccessfully attempting to free his people.'
  - where: 'note 46:7 “The flood that is Egypt, and the flood that is Assyria”'
    claim: 'Church edition links v. 7 to Isa. 8:7 (7–8)'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/46?lang=eng
    quote: 'Isa. 8:7 (7–8); Jer. 47:2; Dan. 11:22.'
  - where: 'note 46:7 “The flood that is Egypt, and the flood that is Assyria”'
    claim: 'Isa. 8:7 text'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/isa/8?lang=eng
    quote: 'the Lord bringeth up upon them the waters of the river, strong and many, even the king of Assyria, and all his glory'
  - where: 'note 46:9 “Egypt''s allies from Africa”'
    claim: 'Cush/Ethiopia extended south from Syene including Nubia'
    key: bd-ethiopia
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/ethiopia?lang=eng
    quote: 'Extended from Syene on the frontier of Egypt southward to the neighborhood of Khartoum'
  - where: 'note 46:9 “Egypt''s allies from Africa”'
    claim: 'Cush, Phut, Ludim; Lydians are African'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/46.htm
    quote: 'i.e., Hamitic, African Lydians, as in Ezekiel 30:5'
  - where: 'note 46:9 “Egypt''s allies from Africa”'
    claim: 'Phut is Libya, west of Egypt'
    key: bd-libya
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/libya?lang=eng
    quote: 'The district west of Egypt and bordering on the Mediterranean; formerly called Put or Phut'
  - where: 'note 46:9 “Egypt''s allies from Africa”'
    claim: 'Ezek. 30:5 lists Ethiopia, Libya, Lydia falling with Egypt'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/30?lang=eng
    quote: 'Ethiopia, and Libya, and Lydia, and all the mingled people, and Chub, and the men of the land that is in league, shall fall with them by the sword.'
  - where: 'note 46:10 “A day of vengeance”'
    claim: 'Day of the Lord refers to the Second Coming'
    key: ot-manual-25
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng
    quote: 'The “day of the Lord” (v. 10) refers to the Second Coming (see Joel 1:15; Amos 5:18).'
  - where: 'note 46:10 “A day of vengeance”'
    claim: 'Church edition footnote links v. 10 to Joel 1:15 and Isa. 34:6'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/46?lang=eng
    quote: 'Joel 1:15. … Isa. 34:6.'
  - where: 'note 46:10 “A day of vengeance”'
    claim: 'Isa. 34:6 sacrifice in Bozrah'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/isa/34?lang=eng
    quote: 'The sword of the Lord is filled with blood'
  - where: 'note 46:11 “The balm that cannot help Egypt”'
    claim: 'Footnote links v. 11 to Jer. 8:22 and 51:8'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/46?lang=eng
    quote: 'Jer. 8:22; 51:8.'
  - where: 'note 46:11 “The balm that cannot help Egypt”'
    claim: 'Jer. 8:22 text'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/8?lang=eng
    quote: 'Is there no balm in Gilead; is there no physician there? why then is not the health of the daughter of my people recovered?'
  - where: 'note 46:11 “The balm that cannot help Egypt”'
    claim: 'Jer. 51:8 text'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/51?lang=eng
    quote: 'take balm for her pain, if so be she may be healed.'
  - where: 'note 46:14 “The cities where Judah''s refugees would settle”'
    claim: 'Noph is Memphis, ancient capital of Egypt'
    key: bd-noph
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/noph?lang=eng
    quote: 'Memphis; ancient capital of Egypt'
  - where: 'note 46:14 “The cities where Judah''s refugees would settle”'
    claim: 'One reading: Migdol and Tahpanhes frontier towns in the north; heralds announce there that the foe has reached the borders'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/46.htm
    quote: 'Regarding Migdol, i.e., Magdolos, and Tahpanhes, i.e., Daphne, the two frontier towns in the north, and Noph, i.e., Memphis, the northern capital of the kingdom'
  - where: 'note 46:14 “The cities where Judah''s refugees would settle”'
    claim: 'Jer. 44:1 names Migdol, Tahpanhes, Noph with Jews in Egypt'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/44?lang=eng
    quote: 'concerning all the Jews which dwell in the land of Egypt, which dwell at Migdol, and at Tahpanhes, and at Noph'
  - where: 'note 46:14 “The cities where Judah''s refugees would settle”'
    claim: 'Jer. 43:7–10 Tahpanhes, stones in brickkiln, Nebuchadnezzar''s throne'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/43?lang=eng
    quote: 'Take great stones in thine hand, and hide them in the clay in the brickkiln, which is at the entry of Pharaoh’s house in Tahpanhes'
  - where: 'note 46:14 “The cities where Judah''s refugees would settle”'
    claim: 'Remnant fled to Egypt taking Jeremiah and Baruch'
    key: ot-manual-24
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng
    quote: 'proceeded into Egypt, taking the hapless prophet and his scribe Baruch with them. (43:1–7)'
  - where: 'note 46:17 “But a noise”'
    claim: 'Hebrew shaon glossed a loud noise'
    key: biblehub-interlinear
    url: https://biblehub.com/interlinear/jeremiah/46-17.htm
    quote: 'a loud noise'
  - where: 'note 46:17 “But a noise”'
    claim: 'he has let the appointed time pass by'
    key: biblehub-interlinear
    url: https://biblehub.com/interlinear/jeremiah/46-17.htm
    quote: 'he has let pass by'
  - where: 'note 46:17 “But a noise”'
    claim: 'One reading: desolation, destruction, ruin, not noise'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/46.htm
    quote: 'desolation, destruction, ruin … the signification "noise, bustle," is unsuitable here.'
  - where: 'note 46:20 “The heifer and the gadfly”'
    claim: 'The word is a hapax legomenon, variously rendered; one reading is the gadfly'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/46.htm
    quote: 'is variously rendered.'
  - where: 'note 46:20 “The heifer and the gadfly”'
    claim: 'Hebrew qerets glossed a biting fly'
    key: biblehub-interlinear
    url: https://biblehub.com/interlinear/jeremiah/46-20.htm
    quote: 'qe·reṣ קֶ֥רֶץ a biting fly'
  - where: 'note 46:20 “The heifer and the gadfly”'
    claim: 'Gadfly figure matches bee of Isa. 7:18; old translators guessed'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/46.htm
    quote: 'The old translators have only made guesses from the context. The figure of the gadfly corresponds to the bee in the land of Assyria, Isaiah 7:18.'
  - where: 'note 46:20 “The heifer and the gadfly”'
    claim: 'Destruction comes from the north (Babylon)'
    key: ot-manual-25
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng
    quote: 'Egypt is described as a fair heifer, but destruction would come to her from the north (Babylon) (see v. 20).'
  - where: 'note 46:25 “No, the city of Amon”'
    claim: 'No is Thebes'
    key: ot-manual-25
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng
    quote: 'No is a name for Jupiter’s city, or Thebes.'
  - where: 'note 46:25 “No, the city of Amon”'
    claim: 'Ezek. 30:14–15 judgments on No'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/30?lang=eng
    quote: 'And I will pour my fury upon Sin, the strength of Egypt; and I will cut off the multitude of No.'
  - where: 'note 46:25 “No, the city of Amon”'
    claim: 'Hebrew reads Amon of No'
    key: biblehub-interlinear
    url: https://biblehub.com/interlinear/jeremiah/46-25.htm
    quote: 'Amon … of No'
  - where: 'note 46:25 “No, the city of Amon”'
    claim: 'Amon an Egyptian god, local deity of Thebes, compared by Greeks with Zeus'
    key: bdb
    url: https://biblehub.com/hebrew/528.htm
    quote: 'Amon , an Egyptian god Nahum 3:8 ; Jeremiah 46:25 , compare by Greeks with Zeus … He was originally the local deity of Thebes'
  - where: 'section 4 plain'
    claim: 'Amon of No, rather than KJV multitude of No'
    key: biblehub-interlinear
    url: https://biblehub.com/interlinear/jeremiah/46-25.htm
    quote: 'Amon … of No'
  - where: 'note 46:25 “Judah''s trust in Pharaoh”'
    claim: 'Egyptian army advanced; siege lifted; hopes soared then dashed; Egyptians would return'
    key: ot-manual-24
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng
    quote: 'The hopes of the Jews soared, but again Jeremiah dashed them to pieces. He prophesied that the Egyptian army would return to Egypt (see v. 7)'
  - where: 'note 46:25 “Judah''s trust in Pharaoh”'
    claim: 'Rulers looked to Egypt despite warnings'
    key: ot-manual-kings-g
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-g?lang=eng
    quote: 'The political rulers looked to Egypt for protection and power against Babylon’s growing influence'
  - where: 'note 46:26 “Egypt is not ended”'
    claim: 'Ezek. 29:13–14 restoration of Egypt'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/29?lang=eng
    quote: 'At the end of forty years will I gather the Egyptians from the people whither they were scattered'
  - where: 'note 46:26 “Egypt is not ended”'
    claim: 'Isa. 19:25 Blessed be Egypt my people'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/isa/19?lang=eng
    quote: 'Blessed be Egypt my people, and Assyria the work of my hands, and Israel mine inheritance.'
  - where: 'note 46:27 “Words repeated from chapter 30”'
    claim: 'Jer. 30:11 text'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/30?lang=eng
    quote: 'though I make a full end of all nations whither I have scattered thee, yet will I not make a full end of thee'
  - where: 'note 46:27 “Words repeated from chapter 30”'
    claim: 'Last two verses of ch. 46 not fulfilled in Jeremiah''s time; chapter titled latter-day gathering'
    key: ot-manual-25
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng
    quote: 'The last two verses are the only ones in chapter 46 that were not fulfilled in Jeremiah’s time or shortly thereafter.'
  - where: 'note 46:28 “I am with thee”'
    claim: 'Lord Jesus Christ saves; does not ignore sins'
    key: ot-manual-25
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng
    quote: 'It is the Lord Jesus Christ who saves. He is Israel’s Savior and Redeemer. He does not, however, ignore the sins of His people (see v. 11).'
  - where: 'note 46:28 “I am with thee”'
    claim: 'Promise fully understood only in the last days'
    key: ot-manual-25
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng
    quote: 'Only now, in the last days, as these promises are realized, can one fully understand what Jeremiah and the other prophets were saying.'
  - where: 'christ'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
