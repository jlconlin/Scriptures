chapter: 26
claims:
  - where: 'when'
    claim: 'The Bible Dictionary dates Jehoiakim''s reign 608–597 B.C. in its outline of Jeremiah'
    key: bd-jeremiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng'
    quote: 'under Jehoiakim (608–597), Jer. 7–20'
  - where: 'note 26:1 “Early in Jehoiakim’s reign”'
    claim: 'Jehoiakim reigned 608–597 B.C. (Bible Dictionary outline of Jeremiah)'
    key: bd-jeremiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng'
    quote: 'under Jehoiakim (608–597), Jer. 7–20'
  - where: 'setting'
    claim: 'The book is not in time order: chapter 25 is the fourth year of Jehoiakim, chapter 26:1–9 his first year'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'The book of Jeremiah is not arranged chronologically. For example, Jeremiah 25 discusses the fourth year of the reign of Jehoiakim. Then, Jeremiah 26:1–9 discusses the first year of his reign.'
  - where: 'setting'
    claim: 'Chapter 26 records events before chapter 25 and helps explain why the judgment there is so certain; Urijah killed for a similar prophecy'
    key: ot-seminary-guide-jer-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-student-study-guide-obs/the-book-of-jeremiah/jeremiah-25-26-rejecting-prophets-leads-to-captivity?lang=eng'
    quote: 'We also read of a prophet named Urijah who was killed for delivering a similar prophecy. This fact helps explain why the judgment was so certain in chapter 25.'
  - where: 'note 26:1 “Early in Jehoiakim’s reign”'
    claim: '“The beginning” means only the earlier part of the reign, with no exact year'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/26.htm'
    quote: '“The beginning” intimates simply that the discourse belongs to the earlier period of Jehoiakim''s reign, without minuter information as to year and day.'
  - where: 'note 26:1 “Early in Jehoiakim’s reign”'
    claim: 'Some commentators identify this speech with Jeremiah 7; Keil thinks he threatened Shiloh more than once'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/26.htm'
    quote: 'several comm. have held these discourses to be identical'
  - where: 'note 26:1 “Early in Jehoiakim’s reign”'
    claim: 'Keil: Jeremiah frequently spoke in the temple and might have threatened Shiloh''s fate on more than one occasion'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/26.htm'
    quote: 'Jeremiah frequently held discourses in the temple, and more than once foretold the destruction of Jerusalem'
  - where: 'note 26:2 “Diminish not a word”'
    claim: 'The command means proclaiming the word in full severity, to move the people to repentance (one reading)'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/26.htm'
    quote: 'he is to proclaim the word of the Lord in its full unconditional severity, to move the people, if possible, to repentance'
  - where: 'note 26:3 “The Lord relents when people repent”'
    claim: 'The Church edition footnote glosses “repent” (Hebrew) as relent: change the decreed punishment because of changed behavior'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/26?lang=eng'
    quote: 'HEB relent; i.e., change the decreed punishment because of their changed behavior.'
  - where: 'note 26:3 “The Lord relents when people repent”'
    claim: 'JST 26:13 reads “and repent, and the Lord will turn away the evil”'
    key: jst-jer-26
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-jer/26?lang=eng'
    quote: 'amend your ways and your doings, and obey the voice of the Lord your God, and repent, and the Lord will turn away the evil that he hath pronounced against you.'
  - where: 'note 26:3 “The Lord relents when people repent”'
    claim: 'JST 26:19 reads “beseech the Lord and repent? and the Lord turned away the evil”; JST 26:6 adds “for ye have not hearkened unto my servants the prophets”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/26?lang=eng'
    quote: 'JST Jer. 26:19 … and beseech the Lord and repent? and the Lord turned away the evil which he had pronounced against them.'
  - where: 'note 26:6 “Like Shiloh”'
    claim: 'Shiloh in Ephraim; tabernacle there through much of the Judges period; religious center until the loss of the Ark'
    key: bd-shiloh
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/shiloh?lang=eng'
    quote: 'The tabernacle was here during the greater part of the period of the Judges, and the place continued to be the religious center of the nation'
  - where: 'note 26:6 “Like Shiloh”'
    claim: 'Shiloh was the first permanent resting place of the tabernacle; Philistines desecrated it; Shiloh leveled for wickedness; Jerusalem to follow'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'just as He allowed the tabernacle to be desecrated by the Philistines, so would He allow the temple to be desecrated by the Babylonians. And just as Shiloh was leveled for its wickedness, so would Jerusalem be destroyed.'
  - where: 'note 26:6 “Like Shiloh”'
    claim: 'Jeremiah 7:12–14 has the same threat: go to Shiloh and see what I did to it; I will do to this house as I did to Shiloh'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/7?lang=eng'
    quote: 'Therefore will I do unto this house, which is called by my name, wherein ye trust, and unto the place which I gave to you and to your fathers, as I have done to Shiloh.'
  - where: 'note 26:10 “A trial at the new gate”'
    claim: 'The chapter heading: Jeremiah is arraigned, tried, and acquitted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/26?lang=eng'
    quote: 'For this he is arraigned, tried, and then acquitted.'
  - where: 'note 26:10 “A trial at the new gate”'
    claim: 'The new gate of the Lord’s house is also where Baruch later read Jeremiah’s scroll'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/36?lang=eng'
    quote: 'at the entry of the new gate of the Lord’s house, in the ears of all the people.'
  - where: 'note 26:10 “A trial at the new gate”'
    claim: 'The leaders wanted Jeremiah killed although his message left hope of deliverance through repentance'
    key: ot-seminary-guide-jer-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-student-study-guide-obs/the-book-of-jeremiah/jeremiah-25-26-rejecting-prophets-leads-to-captivity?lang=eng'
    quote: 'Because of his message, which still left some hope for deliverance through repentance, leaders in Judah wanted Jeremiah killed.'
  - where: 'note 26:15 “Innocent blood”'
    claim: 'Jeremiah''s words parallel Abinadi''s: do what you will, my word stands; killing me sheds innocent blood'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'Compare Jeremiah’s words in verses 14–15 with those of Abinadi in Mosiah 17:9–10. Like Abinadi’s, Jeremiah’s message to his enemies was: “Do what you will, my word stands.'
  - where: 'note 26:15 “Innocent blood”'
    claim: 'Abinadi: if ye slay me ye will shed innocent blood, and my words shall stand as a testimony'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/17?lang=eng'
    quote: 'I will not recall my words, and they shall stand as a testimony against you. And if ye slay me ye will shed innocent blood'
  - where: 'note 26:18 “Micah and Hezekiah”'
    claim: 'Micah was from Moresheth Gath and prophesied under Hezekiah; the Bible Dictionary cites Jer. 26:17–18'
    key: bd-micah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/micah?lang=eng'
    quote: 'A native of Moresheth Gath, in the plain country of Judah, who prophesied under Hezekiah'
  - where: 'note 26:18 “Micah and Hezekiah”'
    claim: 'Micah’s words in verse 18 are Micah 3:12'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/micah/3?lang=eng'
    quote: 'Therefore shall Zion for your sake be plowed as a field, and Jerusalem shall become heaps, and the mountain of the house as the high places of the forest.'
  - where: 'note 26:18 “Micah and Hezekiah”'
    claim: 'Micah, Kings and Chronicles do not say Hezekiah entreated the Lord because of that prophecy; the elders drew the conclusion (one reading)'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/26.htm'
    quote: 'The elders have combined this fact with Micah''s prophecy, and thence drawn the conclusion that the godly king succeeded by his prayer in averting the mischief.'
  - where: 'note 26:18 “Micah and Hezekiah”'
    claim: 'The JST footnote at 26:19 makes the elders'' conclusion explicit: putting Jeremiah to death would procure great evil'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/26?lang=eng'
    quote: 'Thus by putting Jeremiah to death we might procure great evil against our souls.'
  - where: 'note 26:20 “Urijah”'
    claim: 'Urijah is known only from this passage; many prophets of whom we know nothing; Egypt gave no asylum; slain by Jehoiakim himself'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'That this is the only account there is of Urijah and his ministry suggests that there were probably many prophets of whom we know nothing.'
  - where: 'note 26:20 “Urijah”'
    claim: 'Urijah was extradited from Egypt and slain by Jehoiakim; the case shows Jehoiakim’s wickedness'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'But, evidently, Egypt offered him no asylum, for he was extradited and slain by Jehoiakim himself.'
  - where: 'note 26:20 “Urijah”'
    claim: 'Urijah''s case shows the wickedness of King Jehoiakim'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'The case of Urijah, recounted here at Jeremiah’s trial, shows the wickedness of King Jehoiakim.'
  - where: 'note 26:20 “Urijah”'
    claim: 'Elnathan son of Achbor, who fetched Urijah, was among the princes; later he and others pleaded with the king not to burn Jeremiah’s scroll'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/36?lang=eng'
    quote: 'Nevertheless Elnathan and Delaiah and Gemariah had made intercession to the king that he would not burn the roll: but he would not hear them.'
  - where: 'note 26:21 “Lehi’s Jerusalem”'
    claim: 'Urijah was executed for the same teachings; Lehi was sought for his life but spared; Lehi and Jeremiah both rejected and persecuted'
    key: sc-knowhy-650
    url: 'https://scripturecentral.org/knowhy/how-did-jeremiahs-and-lehis-ministries-reflect-one-another'
    quote: 'Such a danger was real—the prophet Urijah had earlier been executed by King Jehoiakim for the same teachings (see Jeremiah 26:20–23). Lehi was spared, however'
  - where: 'note 26:21 “Lehi’s Jerusalem”'
    claim: 'Early in Jehoiakim’s reign Jeremiah was taken, tried, and narrowly escaped punishment at the temple; not imprisoned then'
    key: sc-knowhy-463
    url: 'https://scripturecentral.org/knowhy/how-could-nephi-have-known-about-jeremiahs-imprisonment'
    quote: 'Early in the reign of Jehoiakim, Jeremiah found himself in legal trouble at the temple in Jerusalem. Although he was not imprisoned on that occasion, he was taken, tried, and narrowly escaped punishment'
  - where: 'note 26:21 “Lehi’s Jerusalem”'
    claim: 'Nephi''s statement that Jeremiah was cast into prison (1 Ne. 7:14) raises a dating question with several proposed answers'
    key: sc-knowhy-463
    url: 'https://scripturecentral.org/knowhy/how-could-nephi-have-known-about-jeremiahs-imprisonment'
    quote: 'At first glance, this passage seems to refer to the imprisonment of Jeremiah by Zedekiah, the king of Judah, as recorded in Jeremiah 37–38. However, this raises some questions'
  - where: 'parallels'
    claim: 'Lehi was threatened for his preaching as Urijah had been executed for the same teachings'
    key: sc-knowhy-650
    url: 'https://scripturecentral.org/knowhy/how-did-jeremiahs-and-lehis-ministries-reflect-one-another'
    quote: 'Such a danger was real—the prophet Urijah had earlier been executed by King Jehoiakim for the same teachings (see Jeremiah 26:20–23).'
  - where: 'note 26:21 “Lehi’s Jerusalem”'
    claim: 'Urijah is listed among the prophets of Lehi''s generation; these prophets warned that Jerusalem would be destroyed if the people did not repent'
    key: sc-knowhy-441
    url: 'https://scripturecentral.org/knowhy/who-were-the-many-prophets-in-jerusalem-during-lehis-time'
    quote: 'Just as Nephi said, these prophets warned the people about the impending destruction of Jerusalem if they would not repent.'
  - where: 'note 26:21 “Lehi’s Jerusalem”'
    claim: 'Urijah appears in the table of biblical prophets active ca. 620–580 B.C., the prophets of Lehi''s time'
    key: sc-knowhy-441
    url: 'https://scripturecentral.org/knowhy/who-were-the-many-prophets-in-jerusalem-during-lehis-time'
    quote: 'Biblical Prophets Active ca. 620–580 bc … Urijah ca. 609 bc'
  - where: 'note 26:24 “Ahikam”'
    claim: 'Ahikam son of Shaphan was one of those Josiah sent to inquire about the book found in the temple'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/22?lang=eng'
    quote: 'And the king commanded Hilkiah the priest, and Ahikam the son of Shaphan, and Achbor the son of Michaiah, and Shaphan the scribe'
  - where: 'note 26:24 “Ahikam”'
    claim: 'Without Ahikam, Jeremiah would likely have suffered Urijah’s fate at the hands of the populace'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'Verse 24 implies that Jeremiah, although acquitted, would likely have suffered Urijah’s fate at the hands of the populace had it not been for Ahikam, who protected him.'
  - where: 'note 26:24 “Ahikam”'
    claim: 'After the fall Jeremiah was committed to Gedaliah son of Ahikam son of Shaphan'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/39?lang=eng'
    quote: 'committed him unto Gedaliah the son of Ahikam the son of Shaphan, that he should carry him home: so he dwelt among the people.'
  - where: 'christ'
    claim: 'Jesus: Jerusalem kills the prophets; your house is left desolate'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/23?lang=eng'
    quote: 'O Jerusalem, Jerusalem, thou that killest the prophets, and stonest them which are sent unto thee'
  - where: 'christ'
    claim: 'Nephi son of Helaman names Jeremiah as the prophet who testified of Jerusalem’s destruction and asks why the Son of God should not come according to his prophecy'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/hel/8?lang=eng'
    quote: 'Jeremiah being that same prophet who testified of the destruction of Jerusalem'
