chapter: 37
claims:
  - where: 'when'
    claim: 'Zedekiah reigned 597–586 B.C. (appointed by Nebuchadnezzar after the second invasion; Jerusalem fell 586)'
    key: scripture-helps-jer-31-33
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/42-jeremiah-31-33-36-38-lamentations-1-3?lang=eng'
    quote: 'Zedekiah had been appointed king of Judah in 597 BC by King Nebuchadnezzar after Babylon’s second invasion of Jerusalem.'
  - where: 'when'
    claim: 'Chapter 37 events fall in Zedekiah’s reign, before Jerusalem fell in 586'
    key: scripture-helps-jer-31-33
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/42-jeremiah-31-33-36-38-lamentations-1-3?lang=eng'
    quote: 'occurred during the reign of King Zedekiah, the final king of Judah before Jerusalem fell to Babylon in 586 BC.'
  - where: 'when'
    claim: 'Egyptian advance placed in spring or summer 588 (siege began January 588)'
    key: tolley-imprisonment
    url: 'https://rsc.byu.edu/vol-20-no-3-2019/imprisonment-jeremiah-its-historical-context'
    quote: 'In the spring or summer of 588 BC, Judah became hopeful when the Egyptians began to march toward Jerusalem (Jeremiah 37:5–7).'
  - where: 'setting'
    claim: 'Zedekiah rebelled against Babylon seeking Egypt’s support; Babylon returned and besieged Jerusalem'
    key: ot-manual-kings-g
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-g?lang=eng'
    quote: 'a growing patriotic feeling among the people brought Zedekiah to seek the support of Egypt in rebellion against the power of the north.'
  - where: 'setting'
    claim: 'Jeremiah was viewed as a traitor during the siege because he counseled surrender'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'Jerusalem was under siege, and Jeremiah’s counsel to surrender was not welcome. He was viewed as a traitor and a subversive.'
  - where: 'setting'
    claim: 'Church chapter heading for Jeremiah 37'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/37?lang=eng'
    quote: 'Jeremiah prophesies that Egypt will not save Judah from Babylon—He is cast into a dungeon—Zedekiah transfers him to the court of the prison.'
  - where: "note 37:1 “Zedekiah, Coniah's uncle”"
    claim: 'Zedekiah’s name was changed from Mattaniah by the king of Babylon; he was Jehoiachin’s uncle'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng'
    quote: 'Mattaniah his father’s brother king in his stead, and changed his name to Zedekiah'
  - where: "note 37:1 “Zedekiah, Coniah's uncle”"
    claim: 'Zedekiah was last king of Judah, name changed from Mattaniah'
    key: bd-zedekiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zedekiah?lang=eng'
    quote: 'The last king of Judah, his name changed from Mattaniah to Zedekiah'
  - where: "note 37:1 “Zedekiah, Coniah's uncle”"
    claim: 'Coniah is Jehoiachin'
    key: bd-jehoiachin
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehoiachin?lang=eng'
    quote: 'also known as Jeconiah, Joachin, Coniah'
  - where: "note 37:1 “Zedekiah, Coniah's uncle”"
    claim: 'Jehoiachin was exiled and his uncle Zedekiah ruled in his stead'
    key: ot-manual-kings-g
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-g?lang=eng'
    quote: 'Jehoiachin was likewise exiled, and his uncle, who took the throne name Zedekiah, ruled in his stead.'
  - where: "note 37:1 “Zedekiah, Coniah's uncle”"
    claim: 'Nebuchadrezzar is the same king as Nebuchadnezzar (Bible Dictionary entry covers both spellings)'
    key: bd-nebuchadnezzar
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/nebuchadnezzar?lang=eng'
    quote: 'Nebuchadnezzar, Nebuchadrezzar'
  - where: 'note 37:3 “Pray for us, but do not obey”'
    claim: 'Zedekiah made a similar request earlier, sending Pashur and Zephaniah to Jeremiah (Jer 21:1–2)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/21?lang=eng'
    quote: 'Inquire, I pray thee, of the Lord for us; for Nebuchadrezzar king of Babylon maketh war against us'
  - where: 'note 37:3 “Pray for us, but do not obey”'
    claim: 'The surviving remnant later asks for prayer and promises to obey, and Jeremiah says they have not obeyed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/42?lang=eng'
    quote: 'Pray for us unto the Lord our God; and according unto all that the Lord our God shall say, so declare unto us, and we will do it.'
  - where: 'note 37:3 “The two men the king sent”'
    claim: 'Jucal son of Shelemiah is among those who heard Jeremiah and asked that he be put to death (Jer 38:1, 4)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/38?lang=eng'
    quote: 'Then Shephatiah the son of Mattan, and Gedaliah the son of Pashur, and Jucal the son of Shelemiah, and Pashur the son of Malchiah, heard the words that Jeremiah had spoken'
  - where: 'note 37:3 “The two men the king sent”'
    claim: 'The princes asked that Jeremiah be put to death'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/38?lang=eng'
    quote: 'Therefore the princes said unto the king, We beseech thee, let this man be put to death'
  - where: 'note 37:3 “The two men the king sent”'
    claim: 'Jehucal of 37:3 is Jucal of 38:1; Zephaniah is the one of 21:1 and 29:25; this occurrence is later than 21:1–14'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/37.htm'
    quote: 'Jehucal the son of Shelemiah (see on Jeremiah 38:1), and Zephaniah the son of Maaseiah, the priest (see Jeremiah 21:1 and Jeremiah 29:25)'
  - where: 'note 37:3 “The two men the king sent”'
    claim: 'Zephaniah son of Maaseiah the priest was told to imprison and put in the stocks anyone who made himself a prophet (letter in Jer 29)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/29?lang=eng'
    quote: 'for every man that is mad, and maketh himself a prophet, that thou shouldest put him in prison, and in the stocks'
  - where: 'note 37:3 “The two men the king sent”'
    claim: 'Zephaniah the second priest was among those taken when the city fell'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/52?lang=eng'
    quote: 'Seraiah the chief priest, and Zephaniah the second priest, and the three keepers of the door'
  - where: "note 37:5 “Why Egypt's army mattered”"
    claim: 'Zedekiah sent ambassadors to Egypt for horses; Pharaoh would not help (Ezek 17:15, 17)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/17?lang=eng'
    quote: 'But he rebelled against him in sending his ambassadors into Egypt, that they might give him horses and much people.'
  - where: "note 37:5 “Why Egypt's army mattered”"
    claim: 'Pharaoh with his mighty army will not make war for him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/17?lang=eng'
    quote: 'Neither shall Pharaoh with his mighty army and great company make for him in the war'
  - where: "note 37:5 “Why Egypt's army mattered”"
    claim: 'Nebuchadnezzar briefly left the siege to meet the Egyptians, then returned'
    key: tolley-imprisonment
    url: 'https://rsc.byu.edu/vol-20-no-3-2019/imprisonment-jeremiah-its-historical-context'
    quote: 'Nebuchadnezzar briefly left the siege of Jerusalem to smash this Egyptian resistance, and then he quickly returned Jerusalem.'
  - where: "note 37:5 “Why Egypt's army mattered”"
    claim: 'Jeremiah had warned again and again not to trust Egypt'
    key: ot-manual-kings-g
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-g?lang=eng'
    quote: 'even though Jeremiah had again and again warned Judah not to trust in Egypt for deliverance.'
  - where: "note 37:5 “Why Egypt's army mattered”"
    claim: 'Pharaoh of verse 5 is Hophra (Jer 44:30)'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/37.htm'
    quote: 'the army of Pharaoh (Hophra, Jeremiah 44:30), too, had marched out of Egypt to oppose the Chaldeans'
  - where: "note 37:5 “Why Egypt's army mattered”"
    claim: 'Pharaoh-hophra is named king of Egypt in Jer 44:30'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/44?lang=eng'
    quote: 'Behold, I will give Pharaoh-hophra king of Egypt into the hand of his enemies'
  - where: "note 37:5 “Why Egypt's army mattered”"
    claim: 'Lamentations looks back on watching for a nation that could not save'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lam/4?lang=eng'
    quote: 'in our watching we have watched for a nation that could not save us'
  - where: 'note 37:9 “The relief is not rescue”'
    claim: 'Jeremiah dashed hopes: Egyptian army returns, siege reimposed; even a wounded Chaldean army would destroy the city'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'So helpless would Judah be, according to Jeremiah, that even if the entire Chaldean army were wounded in the battle with Egypt, they would still succeed in destroying Jerusalem'
  - where: 'note 37:9 “The relief is not rescue”'
    claim: 'The Lord says He will command the Chaldeans to return to the city (Jer 34:22)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/34?lang=eng'
    quote: 'Behold, I will command, saith the Lord, and cause them to return to this city; and they shall fight against it, and take it, and burn it with fire'
  - where: 'note 37:12 “Why Jeremiah left the city”'
    claim: 'Jeremiah went to Benjamin probably to visit his hometown; enemies seized the opportunity'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'Jeremiah decided to return to the land of Benjamin, probably to visit his hometown.'
  - where: 'note 37:12 “Why Jeremiah left the city”'
    claim: 'The Hebrew of the purpose clause is explained in various ways; likely “to receive a portion”; Septuagint reads “to buy”'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/37.htm'
    quote: 'לחלק  is explained in various ways. לחלק for להחליק can scarcely have any other meaning than to share, receive a share'
  - where: 'note 37:12 “Why Jeremiah left the city”'
    claim: 'Jeremiah’s family town of Anathoth lay in the land of Benjamin (Jer 1:1)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/1?lang=eng'
    quote: 'of the priests that were in Anathoth in the land of Benjamin'
  - where: 'note 37:13 “The charge of desertion”'
    claim: 'The Church edition footnote renders “fallest away” as “art deserting”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/37?lang=eng'
    quote: 'OR art deserting.'
  - where: 'note 37:13 “The charge of desertion”'
    claim: 'Jeremiah had taught that whoever goes out to the Chaldeans will live (Jer 21:9)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/21?lang=eng'
    quote: 'but he that goeth out, and falleth to the Chaldeans that besiege you, he shall live, and his life shall be unto him for a prey'
  - where: 'note 37:13 “The charge of desertion”'
    claim: 'Leaders falsely accused Jeremiah of defecting, had him beaten and imprisoned'
    key: scripture-helps-jer-31-33
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/42-jeremiah-31-33-36-38-lamentations-1-3?lang=eng'
    quote: 'The leaders in Jerusalem falsely accused Jeremiah of defecting to the Babylonians, had him beaten, and imprisoned him.'
  - where: 'note 37:13 “The charge of desertion”'
    claim: 'The Chaldeans had withdrawn when the accusation was made (Jeremiah 37:11)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/37?lang=eng'
    quote: 'when the army of the Chaldeans was broken up from Jerusalem for fear of Pharaoh’s army'
  - where: 'note 37:15 “Popularity is never a test of truth”'
    claim: 'Benson: a prophet’s truth divides; the unrighteous ignore or fight him; popularity is never a test of truth'
    key: benson-fourteen
    url: 'https://speeches.byu.edu/talks/ezra-taft-benson/fourteen-fundamentals-following-prophet/'
    quote: 'As a prophet reveals the truth it divides the people. The honest in heart heed his words, but the unrighteous either ignore the prophet or fight him.'
  - where: 'note 37:15 “Popularity is never a test of truth”'
    claim: 'Benson: Popularity is never a test of truth'
    key: benson-fourteen
    url: 'https://speeches.byu.edu/talks/ezra-taft-benson/fourteen-fundamentals-following-prophet/'
    quote: 'Popularity is never a test of truth'
  - where: 'note 37:15 “Popularity is never a test of truth”'
    claim: 'The manual applies Benson and Kimball to Jeremiah, who delivered the Lord’s message and ended up in prison; Kimball on garnishing sepulchres'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: '“Even in the Church,” said Elder Spencer W. Kimball, “many are prone to garnish the sepulchres of yesterday’s prophets and mentally stone the living ones”'
  - where: 'note 37:16 “Dungeon and cabins”'
    claim: 'The prison was subterranean; “house of a pit”; the word for cabins occurs only here'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/37.htm'
    quote: 'Jeremiah was in a בּית־בּור, "house of a pit," cf. Exodus 12:29, i.e., a subterranean prison, and in החניּות. This word only occurs here'
  - where: 'note 37:16 “Dungeon and cabins”'
    claim: 'Church edition footnote: cabins, or cells'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/37?lang=eng'
    quote: 'OR cells.'
  - where: 'note 37:16 “Dungeon and cabins”'
    claim: 'The princes made the house of Jonathan the scribe the prison; Keil: probably because of suitable apartments'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/37.htm'
    quote: 'for they had made it the prison," - probably because it contained apartments suitable for the purpose.'
  - where: 'note 37:17 “A secret interview”'
    claim: 'The king called Jeremiah secretly; weak, vacillating character; Jer 38:5 quote'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'The weak, vacillating character of King Zedekiah manifested itself. He called Jeremiah to him secretly, asking if there was any word from the Lord'
  - where: 'note 37:17 “A secret interview”'
    claim: 'Zedekiah told the princes “he is in your hand”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/38?lang=eng'
    quote: 'Behold, he is in your hand: for the king is not he that can do any thing against you.'
  - where: 'note 37:17 “A secret interview”'
    claim: 'Same message earlier: Zedekiah shall not escape the Chaldeans (Jer 32:2–4)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/32?lang=eng'
    quote: 'For then the king of Babylon’s army besieged Jerusalem: and Jeremiah the prophet was shut up in the court of the prison, which was in the king of Judah’s house.'
  - where: 'note 37:17 “A secret interview”'
    claim: 'In the later meeting the king again says “hide nothing from me” (Jer 38:14)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/38?lang=eng'
    quote: 'I will ask thee a thing; hide nothing from me.'
  - where: 'note 37:19 “The test of a prophet”'
    claim: 'The false prophets had promised no Babylonian attack; Jeremiah cited Moses’ test; his word proved true and theirs false'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'Jeremiah’s word had been proven true, and he was in prison. Their word had been proven false, and where were they?'
  - where: 'note 37:19 “The test of a prophet”'
    claim: 'Moses’ test: if the thing follow not, the prophet spoke presumptuously'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/18?lang=eng'
    quote: 'if the thing follow not, nor come to pass, that is the thing which the Lord hath not spoken, but the prophet hath spoken it presumptuously'
  - where: 'note 37:19 “The test of a prophet”'
    claim: 'Jeremiah’s own application of the test to Hananiah (Jer 28:9)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/28?lang=eng'
    quote: 'The prophet which prophesieth of peace, when the word of the prophet shall come to pass, then shall the prophet be known, that the Lord hath truly sent him.'
  - where: 'note 37:21 “Bread until it ran out”'
    claim: 'The cistern of Jer 38:6 was in the court of the prison'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/38?lang=eng'
    quote: 'Then took they Jeremiah, and cast him into the dungeon of Malchiah the son of Hammelech, that was in the court of the prison'
  - where: 'note 37:21 “Bread until it ran out”'
    claim: 'Ebed-melech: no more bread in the city (Jer 38:9)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/38?lang=eng'
    quote: 'and he is like to die for hunger in the place where he is: for there is no more bread in the city.'
  - where: 'note 37:21 “Bread until it ran out”'
    claim: 'Famine at the city’s fall: no bread for the people of the land (Jer 52:6)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/52?lang=eng'
    quote: 'famine was sore in the city, so that there was no bread for the people of the land'
  - where: 'note 37:21 “Which imprisonment did Nephi mean?”'
    claim: 'Nephi (1 Ne 7:14) says Jeremiah was cast into prison'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/7?lang=eng'
    quote: 'they have rejected the prophets, and Jeremiah have they cast into prison.'
  - where: 'note 37:21 “Which imprisonment did Nephi mean?”'
    claim: 'The question of which imprisonment Nephi meant; Brown and Seely suggest an earlier one under Jehoiakim; Chadwick 605; or Nephi heard later/by revelation'
    key: sc-knowhy-463
    url: 'https://scripturecentral.org/knowhy/how-could-nephi-have-known-about-jeremiahs-imprisonment'
    quote: 'it is possible that Nephi was referring to an imprisonment that began during the last year of the reign of Jehoiakim and continued into the early months of Zedekiah’s reign.'
  - where: 'note 37:21 “Which imprisonment did Nephi mean?”'
    claim: 'Nephi may have heard of the imprisonment of Jer 37–38 on return trips, or learned by revelation'
    key: sc-knowhy-463
    url: 'https://scripturecentral.org/knowhy/how-could-nephi-have-known-about-jeremiahs-imprisonment'
    quote: 'Finally, of course, it is also possible that Nephi learned of Jeremiah’s imprisonment by revelation.'
  - where: 'note 37:21 “Which imprisonment did Nephi mean?”'
    claim: 'The Hebrew verb “cast” (shalak) is used only of Jer 38:6, so Nephi probably had that in mind'
    key: tolley-imprisonment
    url: 'https://rsc.byu.edu/vol-20-no-3-2019/imprisonment-jeremiah-its-historical-context'
    quote: 'Of these instances in which Jeremiah was bound or incarcerated, only one describes Jeremiah as being “cast” (Heb: שָׁלַך šalak) into prison (compare Jeremiah 38:6; 1 Nephi 7:14).'
  - where: 'note 37:21 “Which imprisonment did Nephi mean?”'
    claim: 'The imprisonment of 38:6 was intended to kill Jeremiah, like the attempts on Lehi’s life'
    key: tolley-imprisonment
    url: 'https://rsc.byu.edu/vol-20-no-3-2019/imprisonment-jeremiah-its-historical-context'
    quote: 'The imprisonment described in Jeremiah 38:6 was explicitly designed to kill Jeremiah (Jeremiah 38:9, 16).'
  - where: 'christ'
    claim: 'Jesus laments Jerusalem killing the prophets'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/23?lang=eng'
    quote: 'killest the prophets, and stonest them which are sent unto thee, how often would I have gathered thy children together, even as a hen gathereth her chickens under her wings'
  - where: 'christ'
    claim: 'The Lord’s early promise to Jeremiah: they shall fight but not prevail, “I am with thee, to deliver thee”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/1?lang=eng'
    quote: 'And they shall fight against thee; but they shall not prevail against thee; for I am with thee, saith the Lord, to deliver thee.'
  - where: 'setting'
    claim: 'Chapters 37–39 are treated together as “A Prophet’s Reward”'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: '(24-22) Jeremiah 37–39. A Prophet’s “Reward”'
  - where: 'setting'
    claim: 'In these chapters Jeremiah’s word proved true'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'By this time it should have been obvious that Jeremiah’s prophecies were coming to pass.'
  - where: 'explore'
    claim: 'In chapter 39 Jeremiah is released by the Chaldeans'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'Because Jeremiah had foretold Babylon’s eventual success, he was released by the Chaldeans'
  - where: 'note 37:9 “The relief is not rescue”'
    claim: 'Hopes of the Jews soared; Jeremiah dashed them'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'The hopes of the Jews soared, but again Jeremiah dashed them to pieces.'
  - where: 'note 37:12 “Why Jeremiah left the city”'
    claim: 'Enemies seized the opportunity'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'His enemies seized this opportunity to make their move.'
  - where: 'note 37:17 “A secret interview”'
    claim: 'Zedekiah shut Jeremiah up for prophesying the city’s fall (Jer 32:3)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/32?lang=eng'
    quote: 'For Zedekiah king of Judah had shut him up, saying, Wherefore dost thou prophesy, and say, Thus saith the Lord, Behold, I will give this city into the hand of the king of Babylon'
  - where: 'setting'
    claim: 'Zedekiah pledged loyalty as a vassal; a spirit of nationalism rose'
    key: ot-manual-kings-g
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-g?lang=eng'
    quote: 'He pledged loyalty as a vassal king but in time found resistance among the people. A spirit of nationalism rose against the weight of foreign servitude.'
  - where: "note 37:1 “Zedekiah, Coniah's uncle”"
