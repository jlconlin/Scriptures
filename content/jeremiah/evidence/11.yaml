chapter: 11
claims:
  - where: "when"
    claim: "Chapters 7–20 are prophecies under Jehoiakim 608–597"
    key: "bd-jeremiah"
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng"
    quote: "Prophecies under Jehoiakim (608–597), Jer. 7–20."
  - where: "setting"
    claim: "Church chapter heading"
    key: "lds-scriptures"
    url: "https://www.churchofjesuschrist.org/study/scriptures/ot/jer/11?lang=eng"
    quote: "The people of Judah are cursed for breaking the covenant of obedience—The Lord will not hear their prayers."
  - where: "setting"
    claim: "Jeremiah from Anathoth, priests"
    key: "lds-scriptures"
    url: "https://www.churchofjesuschrist.org/study/scriptures/ot/jer/1?lang=eng"
    quote: "The words of Jeremiah the son of Hilkiah, of the priests that were in Anathoth in the land of Benjamin:"
  - where: "section 1 plain"
    claim: "Verse 8 'will bring' may be read 'brought' (footnote 8a)"
    key: "lds-scriptures"
    url: "https://www.churchofjesuschrist.org/study/scriptures/ot/jer/11?lang=eng"
    quote: "OR brought."
  - where: "section 3 plain"
    claim: "Noise of tumult is the tumult of war, not a storm"
    key: "keil-jeremiah"
    url: "https://biblehub.com/commentaries/kad/jeremiah/11.htm"
    quote: "Noise of tumult (המלּה, occurring besides here only in Ezekiel 1:24 as equivalent to המון), i.e., of the tumult of war"
  - where: "note 11:2 “Which covenant?”"
    claim: "The covenant is the one at the Exodus"
    key: "ot-manual-23"
    url: "https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng"
    quote: "refers to the covenant the Lord made with the house of Israel at the time of the Exodus."
  - where: "note 11:2 “Which covenant?”"
    claim: "Terms from Exodus"
    key: "lds-scriptures"
    url: "https://www.churchofjesuschrist.org/study/scriptures/ot/ex/6?lang=eng"
    quote: "And I will take you to me for a people, and I will be to you a God"
  - where: "note 11:2 “Which covenant?”"
    claim: "Book of the covenant read at Sinai"
    key: "lds-scriptures"
    url: "https://www.churchofjesuschrist.org/study/scriptures/ot/ex/24?lang=eng"
    quote: "And he took the book of the covenant, and read in the audience of the people: and they said, All that the Lord hath said will we do, and be obedient."
  - where: "note 11:2 “Which covenant?”"
    claim: "Josiah read the book of the covenant"
    key: "lds-scriptures"
    url: "https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/23?lang=eng"
    quote: "he read in their ears all the words of the book of the covenant which was found in the house of the Lord."
  - where: "note 11:3 “A curse the covenant itself named”"
    claim: "Deut 27:26 curse and Amen"
    key: "lds-scriptures"
    url: "https://www.churchofjesuschrist.org/study/scriptures/ot/deut/27?lang=eng"
    quote: "Cursed be he that confirmeth not all the words of this law to do them. And all the people shall say, Amen."
  - where: "note 11:5 “Jeremiah says Amen”"
    claim: "The Hebrew word in 11:5 is amen"
    key: "oshb-wlc"
    url: "https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml"
    quote: "אָמֵ֥ן"
  - where: "note 11:5 “Jeremiah says Amen”"
    claim: "People answer Amen in Deut 27:26"
    key: "lds-scriptures"
    url: "https://www.churchofjesuschrist.org/study/scriptures/ot/deut/27?lang=eng"
    quote: "And all the people shall say, Amen."
  - where: "note 11:9 “Apostasy as a conspiracy”"
    claim: "Defection universal, as if preconcerted"
    key: "keil-jeremiah"
    url: "https://biblehub.com/commentaries/kad/jeremiah/11.htm"
    quote: "The people's defection from Jahveh, their breach of faith towards the covenant God, is called conspiracy, because it had become as universal as if it had been initiated by a formal preconcertment."
  - where: "note 11:10 “Both houses have broken it”"
    claim: "Judah’s children broke the covenant as forefathers did"
    key: "ot-manual-23"
    url: "https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng"
    quote: "Even as the Jews’ forefathers broke the covenant, so had their children in Judah (see Jeremiah 11:10)."
  - where: "note 11:10 “Both houses have broken it”"
    claim: "Jer 31:32"
    key: "lds-scriptures"
    url: "https://www.churchofjesuschrist.org/study/scriptures/ot/jer/31?lang=eng"
    quote: "Not according to the covenant that I made with their fathers in the day that I took them by the hand to bring them out of the land of Egypt; which my covenant they brake, although I was an husband unto them, saith the Lord:"
  - where: "note 11:13 “Altars to Shame”"
    claim: "bosheth substituted for Baal; Jer 11:13"
    key: "bdb"
    url: "https://biblehub.com/hebrew/1322.htm"
    quote: "shameful thing, substituted for  בַּעַל (q. v.) by later editors, Hosea 9:10; Jeremiah 3:24; מִזְבְּחוֺת לַבּשֶׁת Jeremiah 11:13"
  - where: "note 11:13 “Altars to Shame”"
    claim: "Manasseh reared up altars for Baal"
    key: "lds-scriptures"
    url: "https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/21?lang=eng"
    quote: "and he reared up altars for Baal, and made a grove, as did Ahab king of Israel"
  - where: "note 11:14 “Why Jeremiah must not pray”"
    claim: "None would escape; prayers would not help"
    key: "ot-manual-23"
    url: "https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng"
    quote: "none would escape the punishment decreed, nor would the prayers of Jeremiah or those of the people help (see vv. 11–14)."
  - where: "note 11:14 “Why Jeremiah must not pray”"
    claim: "Jer 7:16"
    key: "lds-scriptures"
    url: "https://www.churchofjesuschrist.org/study/scriptures/ot/jer/7?lang=eng"
    quote: "Therefore pray not thou for this people, neither lift up cry nor prayer for them, neither make intercession to me: for I will not hear thee."
  - where: "note 11:14 “Why Jeremiah must not pray”"
    claim: "Jer 15:1"
    key: "lds-scriptures"
    url: "https://www.churchofjesuschrist.org/study/scriptures/ot/jer/15?lang=eng"
    quote: "Though Moses and Samuel stood before me, yet my mind could not be toward this people"
  - where: "note 11:14 “Why Jeremiah must not pray”"
    claim: "Mosiah 21:15"
    key: "lds-scriptures"
    url: "https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/21?lang=eng"
    quote: "And now the Lord was slow to hear their cry because of their iniquities; nevertheless the Lord did hear their cries"
  - where: "note 11:14 “Why Jeremiah must not pray”"
    claim: "D&C 101:7"
    key: "lds-scriptures"
    url: "https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/101?lang=eng"
    quote: "They were slow to hearken unto the voice of the Lord their God; therefore, the Lord their God is slow to hearken unto their prayers, to answer them in the day of their trouble."
  - where: "note 11:14 “Why Jeremiah must not pray”"
    claim: "Footnote 11b links Mosiah 21:15; D&C 101:7"
    key: "lds-scriptures"
    url: "https://www.churchofjesuschrist.org/study/scriptures/ot/jer/11?lang=eng"
    quote: "Ps. 18:41 (40–41); Mosiah 21:15; D&C 101:7."
  - where: "note 11:15 “A hard verse about sacrifice”"
    claim: "Footnote 15a"
    key: "lds-scriptures"
    url: "https://www.churchofjesuschrist.org/study/scriptures/ot/jer/11?lang=eng"
    quote: "IE acceptable sacrifice has ceased."
  - where: "note 11:15 “A hard verse about sacrifice”"
    claim: "Verse very obscure"
    key: "keil-jeremiah"
    url: "https://biblehub.com/commentaries/kad/jeremiah/11.htm"
    quote: "Jeremiah 11:15 is very obscure; and from the Masoretic text it is hardly possible to obtain a suitable sense."
  - where: "note 11:15 “A hard verse about sacrifice”"
    claim: "My house is the temple; the beloved is Judah"
    key: "keil-jeremiah"
    url: "https://biblehub.com/commentaries/kad/jeremiah/11.htm"
    quote: "\"My house\" is the temple of the Lord in Jerusalem, as appears from the mention of holy flesh in the second clause."
  - where: "note 11:15 “A hard verse about sacrifice”"
    claim: "The beloved is Judah"
    key: "keil-jeremiah"
    url: "https://biblehub.com/commentaries/kad/jeremiah/11.htm"
    quote: "\"The beloved\" of Jahveh is Judah, the covenant people"
  - where: "note 11:15 “A hard verse about sacrifice”"
    claim: "Hypocrisy of cloaking apostasy with offerings"
    key: "keil-jeremiah"
    url: "https://biblehub.com/commentaries/kad/jeremiah/11.htm"
    quote: "What is meant is the hypocrisy of cloaking their apostasy from God by offering sacrifices in the temple"
  - where: "note 11:16 “The olive tree and the fire”"
    claim: "Ps 52:8"
    key: "lds-scriptures"
    url: "https://www.churchofjesuschrist.org/study/scriptures/ot/ps/52?lang=eng"
    quote: "But I am like a green olive tree in the house of God"
  - where: "note 11:16 “The olive tree and the fire”"
    claim: "Jacob 5:3 Zenos"
    key: "lds-scriptures"
    url: "https://www.churchofjesuschrist.org/study/scriptures/bofm/jacob/5?lang=eng"
    quote: "I will liken thee, O house of Israel, like unto a tame olive tree, which a man took and nourished in his vineyard; and it grew, and waxed old, and began to decay."
  - where: "note 11:16 “The olive tree and the fire”"
    claim: "Jacob quotes Zenos"
    key: "lds-scriptures"
    url: "https://www.churchofjesuschrist.org/study/scriptures/bofm/jacob/5?lang=eng"
    quote: "do ye not remember to have read the words of the prophet Zenos"
  - where: "note 11:16 “The olive tree and the fire”"
    claim: "Fire by enemies"
    key: "keil-jeremiah"
    url: "https://biblehub.com/commentaries/kad/jeremiah/11.htm"
    quote: "The setting of fire to the olive tree Israel came about through its enemies, who broke up one part of the kingdom after the other"
  - where: "note 11:18 “Where the plot against Jeremiah comes from”"
    claim: "Townsmen at Anathoth; continuous opposition"
    key: "bd-jeremiah"
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng"
    quote: "He had to face continuous opposition and insult from the priests (20:2), the mob (26:8–9), his townsmen at Anathoth (11:19)"
  - where: "note 11:18 “Where the plot against Jeremiah comes from”"
    claim: "Jer 1:19"
    key: "lds-scriptures"
    url: "https://www.churchofjesuschrist.org/study/scriptures/ot/jer/1?lang=eng"
    quote: "And they shall fight against thee; but they shall not prevail against thee"
  - where: "note 11:19 “A gentle lamb led to slaughter”"
    claim: "alluph tame, docile; docile lamb Jer 11:19"
    key: "bdb"
    url: "https://biblehub.com/hebrew/441.htm"
    quote: "1 tame, docile, כֶּבֶשׂ אַלּוּף a docile (gentle) lamb Jeremiah 11:19. 2. noun masculine friend, intimate"
  - where: "note 11:19 “A gentle lamb led to slaughter”"
    claim: "alluph in another sense means cattle (Ps 144:14), as the KJV's ox"
    key: "bdb"
    url: "https://biblehub.com/hebrew/441.htm"
    quote: "3 i. q. I. אֶלֶף; אַלּוּפֵינוּ מְסֻבָּלִים Psalm 144:14 (i.e. cows)."
  - where: "note 11:19 “A gentle lamb led to slaughter”"
    claim: "Footnote 19a"
    key: "lds-scriptures"
    url: "https://www.churchofjesuschrist.org/study/scriptures/ot/jer/11?lang=eng"
    quote: "Isa. 53:7; Mosiah 14:7; D&C 135:4."
  - where: "note 11:19 “A gentle lamb led to slaughter”"
    claim: "Isa 53:7"
    key: "lds-scriptures"
    url: "https://www.churchofjesuschrist.org/study/scriptures/ot/isa/53?lang=eng"
    quote: "he is brought as a lamb to the slaughter, and as a sheep before her shearers is dumb, so he openeth not his mouth."
  - where: "note 11:19 “A gentle lamb led to slaughter”"
    claim: "Abinadi quotes it"
    key: "lds-scriptures"
    url: "https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/14?lang=eng"
    quote: "he is brought as a lamb to the slaughter, and as a sheep before her shearers is dumb so he opened not his mouth."
  - where: "note 11:19 “A gentle lamb led to slaughter”"
    claim: "Joseph Smith, D&C 135:4"
    key: "lds-scriptures"
    url: "https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/135?lang=eng"
    quote: "I am going like a lamb to the slaughter; but I am calm as a summer’s morning"
  - where: "note 11:19 “The plan to cut him off”"
    claim: "A proverb whose plain sense the next clause gives; him is the prophet"
    key: "keil-jeremiah"
    url: "https://biblehub.com/commentaries/kad/jeremiah/11.htm"
    quote: "The saying is a figurative or proverbial one … The proverbial saying is given in plain words in the next clause. We will cut him (i.e., the prophet) off, etc."
  - where: "note 11:19 “The plan to cut him off”"
    claim: "Footnote 19e on cut him off"
    key: "lds-scriptures"
    url: "https://www.churchofjesuschrist.org/study/scriptures/ot/jer/11?lang=eng"
    quote: "Ps. 83:4; 1 Ne. 1:20."
  - where: "note 11:19 “The plan to cut him off”"
    claim: "Word as food they abhorred"
    key: "keil-jeremiah"
    url: "https://biblehub.com/commentaries/kad/jeremiah/11.htm"
    quote: "The word of the prophet was a food which they abhorred"
  - where: "note 11:19 “The plan to cut him off”"
    claim: "1 Ne 1:20"
    key: "lds-scriptures"
    url: "https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/1?lang=eng"
    quote: "And when the Jews heard these things they were angry with him; yea, even as with the prophets of old, whom they had cast out, and stoned, and slain; and they also sought his life, that they might take it away."
  - where: "note 11:19 “The plan to cut him off”"
    claim: "Footnote 19e; Ps 83:4"
    key: "lds-scriptures"
    url: "https://www.churchofjesuschrist.org/study/scriptures/ot/ps/83?lang=eng"
    quote: "Come, and let us cut them off from being a nation; that the name of Israel may be no more in remembrance."
  - where: "note 11:20 “The Lord who tests the kidneys and the heart”"
    claim: "kidneys; figurative seat of emotion"
    key: "bdb"
    url: "https://biblehub.com/hebrew/3629.htm"
    quote: "2 figurative, as seat of emotion and affection"
  - where: "note 11:20 “The Lord who tests the kidneys and the heart”"
    claim: "Object of God’s examination, Jer 11:20"
    key: "bdb"
    url: "https://biblehub.com/hebrew/3629.htm"
    quote: "hence, as involving character, the object of God's examination"
  - where: "note 11:20 “The Lord who tests the kidneys and the heart”"
    claim: "D&C 64:34 via footnote 20b"
    key: "lds-scriptures"
    url: "https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/64?lang=eng"
    quote: "Behold, the Lord requireth the heart and a willing mind"
  - where: "note 11:20 “The Lord who tests the kidneys and the heart”"
    claim: "Jer 17:10"
    key: "lds-scriptures"
    url: "https://www.churchofjesuschrist.org/study/scriptures/ot/jer/17?lang=eng"
    quote: "I the Lord search the heart, I try the reins"
  - where: "note 11:20 “The Lord who tests the kidneys and the heart”"
    claim: "Jer 20:12"
    key: "lds-scriptures"
    url: "https://www.churchofjesuschrist.org/study/scriptures/ot/jer/20?lang=eng"
    quote: "But, O Lord of hosts, that triest the righteous, and seest the reins and the heart, let me see thy vengeance on them"
  - where: "note 11:20 “The Lord who tests the kidneys and the heart”"
    claim: "Verb future expressing certainty"
    key: "keil-jeremiah"
    url: "https://biblehub.com/commentaries/kad/jeremiah/11.htm"
    quote: "is future as expressing certainty that God will interfere to punish; for to Him he has wholly committed his cause."
  - where: "note 11:21 “His own town, and his own family”"
    claim: "Jer 12:6"
    key: "lds-scriptures"
    url: "https://www.churchofjesuschrist.org/study/scriptures/ot/jer/12?lang=eng"
    quote: "For even thy brethren, and the house of thy father, even they have dealt treacherously with thee"
  - where: "note 11:23 “No remnant at Anathoth”"
    claim: "Ezra 2:23"
    key: "lds-scriptures"
    url: "https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/2?lang=eng"
    quote: "The men of Anathoth, an hundred twenty and eight."
  - where: "christ"
    claim: "Promise and Isa 53:7 link"
    key: "lds-scriptures"
    url: "https://www.churchofjesuschrist.org/study/scriptures/ot/jer/11?lang=eng"
    quote: "so shall ye be my people, and I will be your God"
  - where: "christ"
    claim: "Jer 31 replaces covenant (31:32 breaks)"
    key: "lds-scriptures"
    url: "https://www.churchofjesuschrist.org/study/scriptures/ot/jer/31?lang=eng"
    quote: "which my covenant they brake"
