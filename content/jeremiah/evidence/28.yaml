chapter: 28
claims:
  - where: 'setting'
    claim: 'The Church chapter heading says Hananiah prophesies falsely that the Babylonian yoke will be broken'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/28?lang=eng
    quote: 'Hananiah prophesies falsely that the Babylonian yoke will be broken.'
  - where: 'setting'
    claim: 'Chapter 27 heading: the Lord sends word to nations to serve Babylon'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/27?lang=eng
    quote: 'The Lord sends word to many nations that they are to serve Babylon—The vessels of the Lord’s house will go into Babylon.'
  - where: 'setting'
    claim: 'Zedekiah reigned 597–586 and chapters 26–29 are on the false prophets, including the letter to exiles'
    key: bd-jeremiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng
    quote: 'Prophecies under Zedekiah (597–586), Jer. 21–38'
  - where: 'setting'
    claim: 'Chapters 26–29 are on the false prophets'
    key: bd-jeremiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng
    quote: '(b) Jer. 26–29, on the false prophets, containing the prophet’s letter to the exiles in Babylon, warning against the prophets there.'
  - where: 'note 28:1 “A prophet from Gibeon”'
    claim: 'Gibeon lay on a hill of Benjamin about five miles north of Jerusalem'
    key: bd-gibeon
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/gibeon?lang=eng
    quote: 'on one of the hills of Benjamin, about five miles north of Jerusalem'
  - where: 'note 28:1 “A prophet from Gibeon”'
    claim: 'Gibeon was a Levitical priests city in Benjamin (Josh. 21:17)'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/josh/21?lang=eng
    quote: 'And out of the tribe of Benjamin, Gibeon with her suburbs, Geba with her suburbs,'
  - where: 'note 28:1 “A prophet from Gibeon”'
    claim: 'Hananiah is otherwise unknown; from a city of priests, possibly himself a priest; he spoke in the temple before priests and people'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/28.htm
    quote: 'a prophet not otherwise known, belonging to Gibeon, a city of the priests (Joshua 21:17; now Jib, a large village two hours north-west of Jerusalem; see on Joshua 9:3), possibly therefore himself a priest'
  - where: 'note 28:1 “A prophet from Gibeon”'
    claim: 'He copies Jeremiah’s divine title “Lord of hosts, the God of Israel”'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/28.htm
    quote: "by copying the title of God, so often used by Jeremiah, \"Jahveh of hosts, the God of Israel,\" and by giving the utmost definiteness to his promise: \"within two years\""
  - where: 'note 28:2 “The yoke”'
    claim: 'Jeremiah was told to make bonds and yokes and put them on his neck, and send word to the kings of Edom, Moab, Ammon, Tyre, Zidon by messengers at Jerusalem'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/27?lang=eng
    quote: 'Make thee bonds and yokes, and put them upon thy neck,'
  - where: 'note 28:2 “The yoke”'
    claim: 'The Lord calls Nebuchadnezzar his servant, gives the lands to him, and says nations that refuse will be punished'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/27?lang=eng
    quote: 'now have I given all these lands into the hand of Nebuchadnezzar the king of Babylon, my servant'
  - where: 'note 28:2 “The yoke”'
    claim: 'Jeremiah told Zedekiah to bring necks under the yoke and live'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/27?lang=eng
    quote: 'Bring your necks under the yoke of the king of Babylon, and serve him and his people, and live.'
  - where: 'note 28:3 “Two years against seventy”'
    claim: 'Nebuchadnezzar carried off treasures and cut up the temple vessels, and carried Jehoiachin to Babylon, with the king’s mother, wives, officers and craftsmen'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng
    quote: 'And he carried away Jehoiachin to Babylon, and the king’s mother, and the king’s wives, and his officers, and the mighty of the land'
  - where: 'note 28:3 “Two years against seventy”'
    claim: 'Jer. 27:20 names Jeconiah son of Jehoiakim as the one carried away, so Jeconiah and Jehoiachin are one king'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/27?lang=eng
    quote: 'Which Nebuchadnezzar king of Babylon took not, when he carried away captive Jeconiah the son of Jehoiakim king of Judah from Jerusalem to Babylon'
  - where: 'note 28:3 “Two years against seventy”'
    claim: 'Jeremiah had said earlier that the nations would serve Babylon seventy years'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/25?lang=eng
    quote: 'these nations shall serve the king of Babylon seventy years.'
  - where: 'note 28:3 “Two years against seventy”'
    claim: 'Jeremiah’s letter promises a return after seventy years'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/29?lang=eng
    quote: 'after seventy years be accomplished at Babylon I will visit you, and perform my good word toward you, in causing you to return to this place.'
  - where: 'note 28:3 “Two years against seventy”'
    claim: 'Jer. 27 says remaining vessels would also go to Babylon until the Lord visits them, then be restored'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/27?lang=eng
    quote: 'They shall be carried to Babylon, and there shall they be until the day that I visit them, saith the Lord; then will I bring them up, and restore them to this place.'
  - where: 'note 28:3 “Two years against seventy”'
    claim: 'The Hebrew behind “two full years” is “two years in days,” which makes the date as definite as possible (one reading)'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/28.htm
    quote: "is made as definite as possible by the addition of ימים: two years in days, i.e., in two full years."
  - where: 'note 28:6 “What Jeremiah means by “Amen””'
    claim: 'Student manual: Jeremiah’s Amen is sarcastic, a challenge to see whose prophecies would be fulfilled'
    key: ot-manual-24
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng
    quote: 'In verse 6, Jeremiah’s “Amen, the Lord do so,” is sarcastic, a challenge to see whose prophecies would be fulfilled.'
  - where: 'note 28:6 “What Jeremiah means by “Amen””'
    claim: 'Seminary teacher manual: reply did not mean he approved; might be ironic or an expression of desire that the people would repent'
    key: ot-seminary-teacher-jer-20-29
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-resource-manual/the-book-of-jeremiah/jeremiah-20-29?lang=eng
    quote: 'Jeremiah’s reply in verse 6 did not mean he approved. “Amen: the Lord do so” might have been said ironically or as an expression of desire that the people would repent and make such blessings possible.'
  - where: 'note 28:9 “The test of a prophet”'
    claim: 'Deut. 18:20–22: test of a prophet who speaks in the Lord’s name is whether the thing comes to pass'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/deut/18?lang=eng
    quote: 'When a prophet speaketh in the name of the Lord, if the thing follow not, nor come to pass, that is the thing which the Lord hath not spoken, but the prophet hath spoken it presumptuously'
  - where: 'note 28:9 “The test of a prophet”'
    claim: 'Jeremiah appeals to earlier prophets who prophesied war; only fulfilment can vindicate a peace prophet against them (one reading)'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/28.htm
    quote: 'if a prophet, in opposition to these witnesses of God, predicts nothing but peace and safety, then nothing short of the fulfilment of his prediction can make good his claim to be a true prophet'
  - where: 'note 28:9 “The test of a prophet”'
    claim: 'Jeremiah said time would prove whether Hananiah was right or wrong'
    key: ot-seminary-jer-27-28
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-student-study-guide-obs/the-book-of-jeremiah/jeremiah-27-28-the-yoke-of-babylon?lang=eng
    quote: 'Jeremiah said that time would prove whether he was right or wrong.'
  - where: 'note 28:10 “A sign answered with a sign”'
    claim: 'Hananiah breaks the yoke to dramatize his prophecy, predicting God would do the same to Babylon’s yoke'
    key: ot-manual-24
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng
    quote: 'To dramatize his prophecy, Hananiah broke the yokes off Jeremiah’s shoulders, predicting that God would do the same to Judah’s Babylonian yoke.'
  - where: 'note 28:13 “Wood and iron”'
    claim: 'Student manual: the yokes of wood would become yokes of iron'
    key: ot-manual-24
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng
    quote: 'The Lord’s response was simple and powerful: the yokes of wood would become yokes of iron (see v. 13).'
  - where: 'note 28:13 “Wood and iron”'
    claim: 'The Lord earlier gave Nebuchadnezzar the beasts of the field (Jer. 27:6)'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/27?lang=eng
    quote: 'and the beasts of the field have I given him also to serve him.'
  - where: 'note 28:4 “The yoke the Lord will break”'
    claim: 'Jer. 30:8: the Lord will break the yoke from off the neck in that day'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/30?lang=eng
    quote: 'I will break his yoke from off thy neck, and will burst thy bonds'
  - where: 'note 28:4 “The yoke the Lord will break”'
    claim: 'Jer. 30–33 are prophecies of the latter-day restoration of Israel and the gospel covenant'
    key: bd-jeremiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng
    quote: '(c) Jer. 30–33, prophecies of the latter-day restoration of Israel and the gospel covenant'
  - where: 'note 28:4 “The yoke the Lord will break”'
    claim: 'D&C 113:10: bands on Israel’s neck are the curses of God upon her in her scattered condition'
    key: ot-manual-24
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng
    quote: 'the bands on Israel’s neck “are the curses of God upon her, or the remnants of Israel in their scattered condition among the Gentiles.”'
  - where: 'note 28:11 “Why the people believed Hananiah”'
    claim: 'Prophets in Jeremiah’s day said “Ye shall not see the sword… assured peace” and the Lord says he did not send them'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/14?lang=eng
    quote: 'the prophets say unto them, Ye shall not see the sword, neither shall ye have famine; but I will give you assured peace in this place.'
  - where: 'note 28:11 “Why the people believed Hananiah”'
    claim: 'Jer. 23:17 prophets say peace to those who despise the Lord and walk after their own heart'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/23?lang=eng
    quote: 'They say still unto them that despise me, The Lord hath said, Ye shall have peace; and they say unto every one that walketh after the imagination of his own heart, No evil shall come upon you.'
  - where: 'note 28:11 “Why the people believed Hananiah”'
    claim: 'Samuel the Lamanite: people receive the man who says do whatsoever your heart desireth and say he is a prophet'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/bofm/hel/13?lang=eng
    quote: 'because he speaketh flattering words unto you, and he saith that all is well, then ye will not find fault with him.'
  - where: 'note 28:15 “A prophet has to be sent”'
    claim: 'A man must be called of God, by prophecy (A of F 1:5)'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/pgp/a-of-f/1?lang=eng
    quote: 'We believe that a man must be called of God, by prophecy, and by the laying on of hands by those who are in authority'
  - where: 'note 28:15 “A prophet has to be sent”'
    claim: 'Joseph Smith: false prophets always arise to oppose the true and prophesy so near the truth they deceive almost the very chosen'
    key: ot-seminary-teacher-jer-20-29
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-resource-manual/the-book-of-jeremiah/jeremiah-20-29?lang=eng
    quote: 'False prophets always arise to oppose the true prophets and they will prophesy so very near the truth that they will deceive almost the very chosen ones'
  - where: 'note 28:15 “A prophet has to be sent”'
    claim: 'Jer. 29:8–9: do not let your prophets deceive you; they prophesy falsely in my name; I have not sent them'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/29?lang=eng
    quote: 'For they prophesy falsely unto you in my name: I have not sent them, saith the Lord.'
  - where: 'note 28:16 “Sent away, and a charge from the law”'
    claim: 'Hebrew: Jer. 28:15 “lo shelachakha” (not sent thee) and 28:16 “meshallechakha” (I send thee away): same verb'
    key: oshb-wlc
    url: https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml
    quote: 'לֹֽא ־שְׁלָחֲךָ֣ יְהוָ֔ה … הִנְנִי֙ מְשַֽׁלֵּֽחֲךָ֔ מֵעַ֖ל פְּנֵ֣י הָאֲדָמָ֑ה'
  - where: 'note 28:16 “Sent away, and a charge from the law”'
    claim: 'Keil: the verb is chosen for the play on “not sent thee”; the words recall Deut. 13 and apply its penalty to Hananiah'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/28.htm
    quote: "The words \"for thou hast spoken,\" etc., recall Deuteronomy 13:6. They involve an application to Hananiah's case of the command there given to put such a prophet to death"
  - where: 'note 28:16 “Sent away, and a charge from the law”'
    claim: 'Hebrew “dibber sarah” in Jer. 28:16 is the same phrase as in Deut. 13 (Heb. 13:6; KJV 13:5)'
    key: oshb-wlc
    url: https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml
    quote: 'כִּ֣י דִבֶּר ־סָ֠רָה עַל ־יְהוָ֨ה אֱלֹהֵיכֶ֜ם'
  - where: 'note 28:16 “Sent away, and a charge from the law”'
    claim: 'Deut. 13:5: the prophet who has spoken to turn the people from the Lord shall be put to death'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/deut/13?lang=eng
    quote: 'And that prophet, or that dreamer of dreams, shall be put to death; because he hath spoken to turn you away from the Lord your God'
  - where: 'note 28:16 “Sent away, and a charge from the law”'
    claim: 'sarah means rebellion, defection, apostasy'
    key: bdb
    url: https://biblehub.com/hebrew/5627.htm
    quote: 'sarah: Rebellion, defection, apostasy'
  - where: 'note 28:17 “Died in the seventh month”'
    claim: 'The death should have convinced Zedekiah and the people, but they were too hardened'
    key: ot-manual-24
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng
    quote: 'should have convinced Zedekiah and the people which of these two men was the true prophet, but they were too hardened to respond.'
  - where: 'note 28:17 “Died in the seventh month”'
    claim: 'Zedekiah later rebelled against Babylon, ignoring Jeremiah’s warnings'
    key: ot-manual-24
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng
    quote: 'He too began to look for ways to break the Babylonian yoke. Ignoring the repeated warnings of Jeremiah, he rebelled'
  - where: 'christ'
    claim: 'Jesus: “Take my yoke upon you… my yoke is easy, and my burden is light.”'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/nt/matt/11?lang=eng
    quote: 'Take my yoke upon you, and learn of me; for I am meek and lowly in heart: and ye shall find rest unto your souls.'
  - where: 'christ'
    claim: 'Jer. 30:9 they shall serve the Lord their God and David their king'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/30?lang=eng
    quote: 'But they shall serve the Lord their God, and David their king, whom I will raise up unto them.'
  - where: 'explore'
    claim: 'Seminary guide pairs Jer. 27–28 with Deut. 18:20–22, D&C 42:11–12, 46:7 and A of F 1:5 on knowing who is truly sent'
    key: ot-seminary-jer-27-28
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-student-study-guide-obs/the-book-of-jeremiah/jeremiah-27-28-the-yoke-of-babylon?lang=eng
    quote: 'Read Deuteronomy 18:20–22; Doctrine and Covenants 42:11–12; 46:7; and Articles of Faith 1:5.'
  - where: 'explore'
    claim: 'D&C 42:11: no one may preach unless ordained by one with authority and known to the church'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/42?lang=eng
    quote: 'except he be ordained by some one who has authority, and it is known to the church that he has authority and has been regularly ordained by the heads of the church.'
  - where: 'setting'
    claim: 'Zedekiah began to look for ways to break the Babylonian yoke'
    key: ot-manual-24
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng
    quote: 'He too began to look for ways to break the Babylonian yoke.'
  - where: 'thread'
    claim: 'The people had been told (Jer. 27:16–17) not to listen to prophets promising the vessels’ return'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/27?lang=eng
    quote: 'Hearken not to the words of your prophets that prophesy unto you, saying, Behold, the vessels of the Lord’s house shall now shortly be brought again from Babylon'
  - where: 'setting'
    claim: 'Nebuchadnezzar carried Jehoiachin, his officers and the temple treasures to Babylon and made Zedekiah king'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng
    quote: 'And the king of Babylon made Mattaniah his father’s brother king in his stead, and changed his name to Zedekiah.'
  - where: 'setting'
    claim: 'Nebuchadnezzar carried out the treasures of the temple'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng
    quote: 'And he carried out thence all the treasures of the house of the Lord'
  - where: 'note 28:4 “The yoke the Lord will break”'
    claim: 'The image of the yoke or bands on the neck is also used in Isa. 52:2, which D&C 113:10 interprets'
    key: ot-manual-24
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng
    quote: 'The image of the yoke or bands around the neck is also used in Isaiah 52:2 . According to the interpretation given in Doctrine and Covenants 113:10'
  - where: 'christ'
    claim: 'The Church chapter heading to Jer. 30 identifies David their king as the Messiah'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/30?lang=eng
    quote: 'David, their king (the Messiah), will reign over them.'
