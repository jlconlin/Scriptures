chapter: 48
claims:
  - where: 'when'
    claim: 'Chapters 46–51 are prophecies against foreign nations'
    key: bd-jeremiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng'
    quote: 'Jer. 46–51, prophecies against foreign nations.'
  - where: 'when'
    claim: 'Jeremiah ministered 626–586 B.C.'
    key: bd-jeremiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng'
    quote: 'prophesied from the 13th year of Josiah till after the downfall of Jerusalem, a period of over 40 years, 626–586 B.C.'
  - where: 'setting'
    claim: 'Moab: land east of the Dead Sea; kin to Israel; language like Hebrew; constant warfare'
    key: bd-moab
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/moab?lang=eng'
    quote: 'The land of Moab lay east of the Dead Sea. The Moabites were akin to the Israelites and spoke a language that closely resembled Hebrew, but there was constant warfare between the two nations'
  - where: 'setting'
    claim: 'Church chapter heading: judgment for contempt of God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/48?lang=eng'
    quote: 'Judgment and destruction will come upon the Moabites for their contempt of God.'
  - where: 'setting'
    claim: 'The Bible Dictionary groups chapters 46–51 as prophecies against foreign nations'
    key: bd-jeremiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng'
    quote: 'Jer. 46–51, prophecies against foreign nations.'
  - where: 'note 48:1 “Moab, Israel''s kin and neighbor”'
    claim: 'Moab son of Lot''s eldest daughter; land east of Dead Sea; language; warfare'
    key: bd-moab
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/moab?lang=eng'
    quote: 'Son of Lot’s eldest daughter (Gen. 19:37).'
  - where: 'note 48:1 “Moab, Israel''s kin and neighbor”'
    claim: 'Israel told not to distress Moab; Ar given to Lot''s children'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/2?lang=eng'
    quote: 'Distress not the Moabites, neither contend with them in battle: for I will not give thee of their land for a possession; because I have given Ar unto the children of Lot for a possession.'
  - where: 'note 48:1 “Moab, Israel''s kin and neighbor”'
    claim: 'Moab named among nations who drink the cup (Jer. 25:15–17, 21); Jeremiah appointed prophet to the nations'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/25?lang=eng'
    quote: 'Take the wine cup of this fury at my hand, and cause all the nations, to whom I send thee, to drink it.'
  - where: 'note 48:1 “Moab, Israel''s kin and neighbor”'
    claim: 'Messengers to Zedekiah from the king of Moab (Jer. 27:3)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/27?lang=eng'
    quote: 'And send them to the king of Edom, and to the king of Moab, and to the king of the Ammonites, and to the king of Tyrus, and to the king of Zidon, by the hand of the messengers which come to Jerusalem unto Zedekiah king of Judah'
  - where: 'note 48:2 “Madmen is a town, and a pun”'
    claim: 'Madmen is a location in Moab'
    key: bdb
    url: 'https://biblehub.com/hebrew/4086.htm'
    quote: 'מַדְמֵן  proper name, of a location in Moab Jeremiah 48:2'
  - where: 'note 48:2 “Madmen is a town, and a pun”'
    claim: 'BDB lists tiddommi (Jer. 48:2) under the verb be or grow dumb, silent, still'
    key: bdb
    url: 'https://biblehub.com/hebrew/1826.htm'
    quote: 'verb be or grow dumb, silent, still'
  - where: 'note 48:2 “Madmen is a town, and a pun”'
    claim: 'BDB files Jer. 48:2 under the sense be still = perish'
    key: bdb
    url: 'https://biblehub.com/hebrew/1826.htm'
    quote: '2 be still (opposed to both speech and motion) Job 31:34; = perish Jeremiah 8:14; Jeremiah 48:2'
  - where: 'note 48:3 “The same lament as Isaiah''s burden of Moab”'
    claim: 'Isaiah 15:5 parallels Jer 48:5 (Luhith, Horonaim, cry of destruction); Isa 15:4 parallels 48:34; Isa 15:2 parallels 48:37; Isa 16:10 parallels 48:33; Isa 16:11 parallels 48:36; Isa 16:6 parallels 48:29–30'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/15?lang=eng'
    quote: 'for by the mounting up of Luhith with weeping shall they go it up; for in the way of Horonaim they shall raise up a cry of destruction.'
  - where: 'note 48:3 “The same lament as Isaiah''s burden of Moab”'
    claim: 'Isa 16:6 pride of Moab, his lies shall not be so; Isa 16:10 joy taken from plentiful field; Isa 16:11 inward parts sound like a harp'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/16?lang=eng'
    quote: 'We have heard of the pride of Moab; he is very proud: even of his haughtiness, and his pride, and his wrath: but his lies shall not be so.'
  - where: 'note 48:3 “The same lament as Isaiah''s burden of Moab”'
    claim: 'One reading: Jer 48:34 is based on Isa 15:4–6'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/48.htm'
    quote: 'Jeremiah 48:34 is based on Isaiah 15:4-6.'
  - where: 'note 48:7 “Trusting what you have made”'
    claim: 'Church edition footnotes v7 to Mosiah 12:29 and v36 to Hel. 13:31'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/48?lang=eng'
    quote: 'Mosiah 12:29.'
  - where: 'note 48:7 “Trusting what you have made”'
    claim: 'Church edition footnote at v36 to Hel. 13:31'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/48?lang=eng'
    quote: 'Hel. 13:31 (18, 31, 33).'
  - where: 'note 48:7 “Trusting what you have made”'
    claim: 'Abinadi to the priests: why do ye set your hearts upon riches'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/12?lang=eng'
    quote: 'If ye teach the law of Moses why do ye not keep it? Why do ye set your hearts upon riches?'
  - where: 'note 48:7 “Trusting what you have made”'
    claim: 'Samuel the Lamanite: the Lord curseth your riches; weep and howl'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/hel/13?lang=eng'
    quote: 'the time cometh that he curseth your riches, that they become slippery, that ye cannot hold them'
  - where: 'note 48:7 “Trusting what you have made”'
    claim: 'Samuel the Lamanite prophesies to the Nephites (chapter heading)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/hel/13?lang=eng'
    quote: 'The prophecy of Samuel, the Lamanite, to the Nephites.'
  - where: 'note 48:7 “Trusting what you have made”'
    claim: 'One reading: “works” means all that Moab undertakes'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/48.htm'
    quote: '“all that Moab undertakes.”'
  - where: 'note 48:7 “Chemosh, the god of Moab”'
    claim: 'Solomon built a high place for Chemosh; Chemosh the god of the Moabites'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/11?lang=eng'
    quote: 'Then did Solomon build an high place for Chemosh, the abomination of Moab'
  - where: 'note 48:7 “Chemosh, the god of Moab”'
    claim: 'Those who forsook the Lord worshipped Chemosh the god of the Moabites'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/11?lang=eng'
    quote: 'Chemosh the god of the Moabites'
  - where: 'note 48:7 “Chemosh, the god of Moab”'
    claim: 'Josiah defiled the high places for Chemosh'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/23?lang=eng'
    quote: 'and for Chemosh the abomination of the Moabites, and for Milcom the abomination of the children of Ammon, did the king defile.'
  - where: 'note 48:7 “Chemosh, the god of Moab”'
    claim: 'Jeremiah''s ministry began in Josiah''s reign'
    key: bd-jeremiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng'
    quote: 'prophesied from the 13th year of Josiah'
  - where: 'note 48:7 “Chemosh, the god of Moab”'
    claim: 'Moabites are the people of Chemosh in Num. 21:29'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/21?lang=eng'
    quote: 'Woe to thee, Moab! thou art undone, O people of Chemosh'
  - where: 'note 48:7 “Chemosh, the god of Moab”'
    claim: 'Moab forfeited its lives by idolatry and other crimes'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'These people had forfeited their lives by their idolatry and other crimes.'
  - where: 'note 48:10 “A curse on the careless executioner”'
    claim: 'Hebrew remiyyah has a second sense “laxness, slackness”, and Jer 48:10 is listed there as an adverb'
    key: bdb
    url: 'https://biblehub.com/hebrew/7423.htm'
    quote: 'II. רְמִיָּה  noun feminine laxness, slackness;'
  - where: 'note 48:10 “A curse on the careless executioner”'
    claim: 'BDB first sense is deceit, treachery'
    key: bdb
    url: 'https://biblehub.com/hebrew/7423.htm'
    quote: 'I. רְמִיָּה  noun feminine deceit, treachery;'
  - where: 'note 48:10 “A curse on the careless executioner”'
    claim: 'The Lord pronounced a curse upon her enemies if they did not destroy her; God is the author of life'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'Moab was doomed to destruction, and the Lord pronounced a curse upon her enemies if they did not proceed to destroy her. God is the author of life and has the right to give and take it.'
  - where: 'note 48:11 “Wine left on its lees”'
    claim: 'Moab compared to old wine long on its lees that kept flavour and smell; one reading: inferior wine becomes harsh and thick, after Zeph 1:12'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/48.htm'
    quote: 'Moab is compared to old wine that has lain long on its lees, and thereby preserved its flavour and smell unchanged.'
  - where: 'note 48:11 “Wine left on its lees”'
    claim: 'Keil: taste and odour signify Moab''s disposition toward Israel; inferior wine becomes harsh and thick'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/48.htm'
    quote: 'The taste and odour of Moab signify his disposition towards other nations, particularly towards Israel, the people of God.'
  - where: 'note 48:11 “Wine left on its lees”'
    claim: 'Church edition footnotes v11 to Zeph 1:12 and gives “HEB tilters (those who empty things out)” for v12 wanderers'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/48?lang=eng'
    quote: 'HEB tilters (those who empty things out).'
  - where: 'note 48:11 “Wine left on its lees”'
    claim: 'Zeph 1:12: men settled on their lees'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zeph/1?lang=eng'
    quote: 'I will search Jerusalem with candles, and punish the men that are settled on their lees'
  - where: 'note 48:13 “Israel''s Beth-el, Moab''s Chemosh”'
    claim: 'Jeroboam set golden calves in Beth-el and Dan'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/12?lang=eng'
    quote: 'It is too much for you to go up to Jerusalem: behold thy gods, O Israel'
  - where: 'note 48:13 “Israel''s Beth-el, Moab''s Chemosh”'
    claim: 'Hosea 10:6: Israel ashamed of his own counsel; footnote on v13'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/10?lang=eng'
    quote: 'Ephraim shall receive shame, and Israel shall be ashamed of his own counsel.'
  - where: 'note 48:13 “Israel''s Beth-el, Moab''s Chemosh”'
    claim: 'The Church edition footnotes the calves of Beth-aven (Hosea 10:5) to Jeroboam''s calves in 1 Kgs. 12:28'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/10?lang=eng'
    quote: '1 Kgs. 12:28.'
  - where: 'note 48:26 “The cup and the charge”'
    claim: 'Jer 25:27 the cup: drink, be drunken'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/25?lang=eng'
    quote: 'Drink ye, and be drunken, and spue, and fall, and rise no more, because of the sword which I will send among you.'
  - where: 'note 48:26 “The cup and the charge”'
    claim: 'Zeph 2:8–10: Moab reproached my people and magnified themselves; for their pride'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zeph/2?lang=eng'
    quote: 'I have heard the reproach of Moab, and the revilings of the children of Ammon, whereby they have reproached my people, and magnified themselves against their border.'
  - where: 'note 48:31 “Who weeps for Moab”'
    claim: 'Isa 15:5 My heart shall cry out for Moab'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/15?lang=eng'
    quote: 'My heart shall cry out for Moab'
  - where: 'note 48:31 “Who weeps for Moab”'
    claim: 'Another reading: the one who laments is the prophet, as in Isaiah 15:5 and 16:9'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/48.htm'
    quote: 'The I who makes lament is the prophet, as in Isaiah 16:9 and Isaiah 15:5.'
  - where: 'note 48:31 “Who weeps for Moab”'
    claim: 'Moses 7:28–29 God weeps; Enoch asks how'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/7?lang=eng'
    quote: 'the God of heaven looked upon the residue of the people, and he wept'
  - where: 'note 48:40 “The eagle that is not named”'
    claim: 'Church edition footnotes v40 to Ezek 17:3; Ezek 17:12 explains the king of Babylon is come to Jerusalem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/17?lang=eng'
    quote: 'Behold, the king of Babylon is come to Jerusalem, and hath taken the king thereof'
  - where: 'note 48:40 “The eagle that is not named”'
    claim: 'Ezek 17:3 great eagle with great wings'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/17?lang=eng'
    quote: 'A great eagle with great wings, longwinged, full of feathers'
  - where: 'note 48:40 “The eagle that is not named”'
    claim: 'Moab taken captive by Chaldeans, never again a nation'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'They were taken captive by the Chaldeans and never afterward resumed their status as a nation.'
  - where: 'note 48:45 “The old song of Heshbon turned around”'
    claim: 'Sihon of Heshbon took Moab''s land; the Num 21 saying: fire gone out of Heshbon; Woe to thee Moab'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/21?lang=eng'
    quote: 'there is a fire gone out of Heshbon, a flame from the city of Sihon: it hath consumed Ar of Moab'
  - where: 'note 48:45 “The old song of Heshbon turned around”'
    claim: 'Heshbon was Sihon''s city; he fought against the former king of Moab'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/21?lang=eng'
    quote: 'For Heshbon was the city of Sihon the king of the Amorites, who had fought against the former king of Moab, and taken all his land out of his hand'
  - where: 'note 48:45 “The old song of Heshbon turned around”'
    claim: 'Num 24:17 smite the corners of Moab; Church edition footnote cross-references Jer. 48:45'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/24?lang=eng'
    quote: 'Jer. 48:45.'
  - where: 'note 48:47 “Moab in the latter days”'
    claim: 'Verse 42 means identity as a people ceased; verse 47 could mean conversion of the remnants'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'This passage could mean the conversion of the remnants of these people to the gospel in the last days.'
  - where: 'note 48:47 “Moab in the latter days”'
    claim: 'Their identity as a people would cease; people continued to live in the land'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'their identity as a people would cease. This prophecy was fulfilled literally, even though people continued to live in the land of Moab.'
  - where: 'note 48:47 “Moab in the latter days”'
    claim: 'Same promise follows Ammon and Elam'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/49?lang=eng'
    quote: 'But it shall come to pass in the latter days, that I will bring again the captivity of Elam, saith the Lord.'
  - where: 'note 48:47 “Moab in the latter days”'
    claim: 'Isa 16:4–5: Let mine outcasts dwell with thee, Moab; in mercy shall the throne be established; footnote on v47 to Isa 16:5'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/16?lang=eng'
    quote: 'Let mine outcasts dwell with thee, Moab; be thou a covert to them from the face of the spoiler'
  - where: 'christ'
    claim: 'Church edition footnotes to Num 24:17: “His coming was to be in the future, long after Moses’ time”; TG Jesus Christ, Prophecies about; cross-reference to Jer. 48:45'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/24?lang=eng'
    quote: 'IE His coming was to be in the future, long after Moses’ time.'
  - where: 'christ'
    claim: 'Ruth the Moabitess; mother of Obed, father of Jesse, father of David; Matt 1:5–6'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ruth/4?lang=eng'
    quote: 'they called his name Obed: he is the father of Jesse, the father of David.'
  - where: 'christ'
    claim: 'Ruth was one of the women of Moab'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ruth/1?lang=eng'
    quote: 'And they took them wives of the women of Moab; the name of the one was Orpah, and the name of the other Ruth'
  - where: 'christ'
    claim: 'Matthew 1:5–6 Obed of Ruth ... Jesse begat David the king'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/1?lang=eng'
    quote: 'Booz begat Obed of Ruth; and Obed begat Jesse'
