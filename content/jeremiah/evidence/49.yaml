chapter: 49
claims:
  - where: 'setting'
    claim: 'The Church heading summarizes the chapter as judgment on Ammon, Edom, Kedar, Hazor, and Elam'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/49?lang=eng'
    quote: 'Judgment and destruction will come upon the people of Ammon, Edom, Kedar, Hazor, and Elam.'
  - where: 'setting'
    claim: 'Chapters 46–51 are the prophecies against foreign nations in the Bible Dictionary outline'
    key: bd-jeremiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng'
    quote: 'Jer. 46–51 , prophecies against foreign nations.'
  - where: 'setting'
    claim: 'Ammon, Edom, and Elam are among the nations who drink the wine cup of fury; Jerusalem drinks first'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/25?lang=eng'
    quote: 'Take the wine cup of this fury at my hand, and cause all the nations, to whom I send thee, to drink it.'
  - where: 'setting'
    claim: 'Elam is a mountainous country east of Babylonia'
    key: bd-elam
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/elam?lang=eng'
    quote: 'A mountainous country to the east of Babylonia, with the Persian Gulf on the south and southwest'
  - where: 'setting'
    claim: 'The manual believes the Ammon prophecy was given after Jerusalem was captured, when Ammon had invaded Israelite territory'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'It is believed that this prophecy was given after the capture of Jerusalem. The Ammonites had taken advantage of the depressed condition of Israel and invaded their territories'
  - where: 'when'
    claim: 'Zedekiah’s reign is dated 597–586 in the Bible Dictionary outline'
    key: bd-jeremiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng'
    quote: 'Prophecies under Zedekiah (597–586), Jer. 21–38'
  - where: 'when'
    claim: 'The Ammon prophecy is believed to have been given after Jerusalem was captured'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'It is believed that this prophecy was given after the capture of Jerusalem.'
  - where: 'note 49:1 “Ammon in Gad''s land”'
    claim: 'The Ammonites took advantage of Israel’s depressed condition and invaded its territories'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'The Ammonites had taken advantage of the depressed condition of Israel and invaded their territories'
  - where: 'note 49:1 “Ammon in Gad''s land”'
    claim: 'Assyria carried Gilead and the Reubenites and Gadites into captivity'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/5?lang=eng'
    quote: 'he carried them away, even the Reubenites, and the Gadites, and the half tribe of Manasseh'
  - where: 'note 49:1 “Ammon in Gad''s land”'
    claim: 'Tiglath-pileser took Gilead and carried people captive to Assyria'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/15?lang=eng'
    quote: 'and Hazor, and Gilead, and Galilee, all the land of Naphtali, and carried them captive to Assyria.'
  - where: 'note 49:1 “Ammon in Gad''s land”'
    claim: 'Verse 2 is a promise that God would preserve Israel and bring them home'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'Jeremiah intimated that God would preserve the descendants of Israel and bring them home again one day to their inheritances (see v. 2).'
  - where: 'note 49:1 “Ammon in Gad''s land”'
    claim: 'Ammon descended from Lot, settled east of the Jordan, bitter enemies of Israel'
    key: bd-ammon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ammon?lang=eng'
    quote: 'A tribe descended from Lot, the nephew of Abraham (Gen. 19:38; Deut. 2:19)'
  - where: 'note 49:1 “Ammon in Gad''s land”'
    claim: 'Ammon were bitter enemies of Israel'
    key: bd-ammon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ammon?lang=eng'
    quote: 'as allies of their Aramean neighbors and bitter enemies of Israel'
  - where: 'note 49:2 “Rabbah, Ammon''s capital”'
    claim: 'Rabbah was Ammon’s chief city in the upper Jabbok valley'
    key: bd-rabbah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/rabbah?lang=eng'
    quote: 'Chief city of the Ammonites, in the deep fertile valley of the Upper Jabbock'
  - where: 'note 49:2 “Rabbah, Ammon''s capital”'
    claim: 'There are extensive ruins at modern Amman'
    key: bd-rabbah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/rabbah?lang=eng'
    quote: 'There are still extensive ruins at the modern Amman.'
  - where: 'note 49:2 “Rabbah, Ammon''s capital”'
    claim: 'Amos says the Lord will kindle a fire in the wall of Rabbah and their king shall go into captivity'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/amos/1?lang=eng'
    quote: 'But I will kindle a fire in the wall of Rabbah, and it shall devour the palaces thereof'
  - where: 'note 49:3 “Which Ai?”'
    claim: 'The Hebrew is the place name Ai (ʿay)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/jeremiah/49-3.htm'
    quote: 'Ai    N‑proper‑fs'
  - where: 'note 49:3 “Which Ai?”'
    claim: 'No city of this name is known in Ammon; not the Ai of Joshua 7, which was west of the Jordan; the word is taken as an Ammonite city name'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/49.htm'
    quote: 'there is no city of this name known in the Ammonite country, or the land east of the Jordan; while we must not think of Ai'
  - where: 'note 49:3 “Which Ai?”'
    claim: 'One commentator concludes Ai is the name of an important Ammonite city'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/49.htm'
    quote: 'as the name of an important Ammonite city.'
  - where: 'note 49:3 “Which Ai?”'
    claim: 'Heshbon lay on the border of Gad and Reuben'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/49.htm'
    quote: 'they also seized Heshbon on the border of these two tribal territories'
  - where: 'note 49:3 “The king who is a god”'
    claim: 'Hebrew malkam in verse 3; translations print Milcom going into exile with priests and officials'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/jeremiah/49-3.htm'
    quote: 'for Milcom will go into exile together with his priests and officials.'
  - where: 'note 49:3 “The king who is a god”'
    claim: 'Some translations read verse 1 with Milcom'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/jeremiah/49-1.htm'
    quote: 'Why then has Milcom taken possession of Gad?'
  - where: 'note 49:3 “The king who is a god”'
    claim: 'Milcom is the abomination of the Ammonites, a fire god'
    key: bd-molech
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/molech?lang=eng'
    quote: 'The abomination of the children of Ammon, a fire god'
  - where: 'note 49:3 “The king who is a god”'
    claim: 'Solomon went after Milcom'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/11?lang=eng'
    quote: 'For Solomon went after Ashtoreth the goddess of the Zidonians, and after Milcom the abomination of the Ammonites.'
  - where: 'note 49:6 “Judgment, then return”'
    claim: 'Moab is promised return in the latter days'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/48?lang=eng'
    quote: 'Yet will I bring again the captivity of Moab in the latter days, saith the Lord.'
  - where: 'note 49:6 “Judgment, then return”'
    claim: 'The manual says the Ammon promise was fulfilled under Cyrus’s edict'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'The promise to the Ammonites (v. 6) was fulfilled when they returned with the Moabites and Israelites with permission given the edict of Cyrus.'
  - where: 'note 49:7 “Edom, Judah''s relative”'
    claim: 'Edom is the name of Esau and his country south of the Dead Sea; kinship and mutual hatred'
    key: bd-edom
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/edom?lang=eng'
    quote: 'mention is made of the blood relationship between the Israelites and the Edomites. In spite of the kinship there seems to have been great mutual hatred, and wars were of constant occurrence'
  - where: 'note 49:7 “Edom, Judah''s relative”'
    claim: 'Edom means Red, name of Esau, country in Mount Seir south of the Dead Sea'
    key: bd-edom
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/edom?lang=eng'
    quote: 'Red. Name of Esau (Gen. 25:30); of his descendants (Gen. 36; 1 Chr. 1:35–42); of their country in Mount Seir'
  - where: 'note 49:7 “Edom, Judah''s relative”'
    claim: 'Esau sold his birthright and settled in Mount Seir'
    key: bd-esau
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/esau?lang=eng'
    quote: 'Esau sold to Jacob his birthright (Gen. 25:33)'
  - where: 'note 49:7 “Edom, Judah''s relative”'
    claim: 'Esau settled in Mount Seir'
    key: bd-esau
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/esau?lang=eng'
    quote: 'and settled in Mount Seir'
  - where: 'note 49:7 “Edom, Judah''s relative”'
    claim: 'Obadiah charges Edom with violence against Jacob'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/obad/1?lang=eng'
    quote: 'For thy violence against thy brother Jacob shame shall cover thee'
  - where: 'note 49:7 “Edom, Judah''s relative”'
    claim: 'Obadiah charges Edom with rejoicing over Judah’s destruction'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/obad/1?lang=eng'
    quote: 'neither shouldest thou have rejoiced over the children of Judah in the day of their destruction'
  - where: 'note 49:7 “Edom, Judah''s relative”'
    claim: 'Lamentations tells Edom the cup shall pass to it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lam/4?lang=eng'
    quote: 'Rejoice and be glad, O daughter of Edom, that dwellest in the land of Uz; the cup also shall pass through unto thee'
  - where: 'note 49:7 “The wisdom of Teman”'
    claim: 'Eliphaz the Temanite was Job’s friend'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/2?lang=eng'
    quote: 'Eliphaz the Temanite, and Bildad the Shuhite, and Zophar the Naamathite'
  - where: 'note 49:7 “The wisdom of Teman”'
    claim: 'Obadiah pairs Teman with the wise men of Edom'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/obad/1?lang=eng'
    quote: 'even destroy the wise men out of Edom, and understanding out of the mount of Esau?'
  - where: 'note 49:9 “Jeremiah and Obadiah”'
    claim: 'Obadiah 1:5–6 parallels Jeremiah 49:9–10'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/obad/1?lang=eng'
    quote: 'if the grapegatherers came to thee, would they not leave some grapes?'
  - where: 'note 49:9 “Jeremiah and Obadiah”'
    claim: 'Obadiah 1:6 on Esau’s hidden things'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/obad/1?lang=eng'
    quote: 'How are the things of Esau searched out! how are his hidden things sought up!'
  - where: 'note 49:9 “Jeremiah and Obadiah”'
    claim: 'The Lord uncovered all Edom’s hiding places and made them known to her enemies'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'meaning He had uncovered all her hiding places and made them known to her enemies'
  - where: 'note 49:11 “The Lord and the orphans”'
    claim: 'The Lord cares for the widows and orphans of Esau'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'The widows and orphans of Esau would be cared for by the Lord, who is the best of husbands to the one and the most loving father to the other.'
  - where: 'note 49:11 “The Lord and the orphans”'
    claim: 'God is a father of the fatherless and judge of widows'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/68?lang=eng'
    quote: 'A father of the fatherless, and a judge of the widows, is God in his holy habitation.'
  - where: 'note 49:12 “The cup that goes to every nation”'
    claim: 'Jeremiah gives the cup to all nations; Jerusalem and Judah first'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/25?lang=eng'
    quote: 'To wit, Jerusalem, and the cities of Judah, and the kings thereof, and the princes thereof'
  - where: 'note 49:12 “The cup that goes to every nation”'
    claim: 'Edom, Moab, Ammon, Dedan, Tema, Elam named in the cup list'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/25?lang=eng'
    quote: 'Edom, and Moab, and the children of Ammon,'
  - where: 'note 49:12 “The cup that goes to every nation”'
    claim: 'One reading: those who should not have had to drink are the Israelites, the people of God'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/49.htm'
    quote: 'Those meant are the Israelites, who, as the people of God, ought to have been free from the penal judgment with which the Lord visits the nations.'
  - where: 'note 49:12 “The cup that goes to every nation”'
    claim: 'If Israel was not spared, still less can Edom claim exemption'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/49.htm'
    quote: 'still less can Edom, as a heathen nation, lay claim to exemption.'
  - where: 'note 49:13 “An oath by Himself”'
    claim: 'God swore by himself because he could swear by no greater; the oath shows the immutability of his counsel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/6?lang=eng'
    quote: 'because he could swear by no greater, he sware by himself'
  - where: 'note 49:13 “An oath by Himself”'
    claim: 'The oath confirmed the immutability of God’s counsel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/6?lang=eng'
    quote: 'the immutability of his counsel, confirmed it by an oath'
  - where: 'note 49:13 “Bozrah and the coming of the Lord”'
    claim: 'Isaiah 63:1 asks who comes from Edom and Bozrah, mighty to save'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/63?lang=eng'
    quote: 'Who is this that cometh from Edom, with dyed garments from Bozrah?'
  - where: 'note 49:13 “Bozrah and the coming of the Lord”'
    claim: 'D&C 133:46–48 asks the same question about the Lord’s coming without naming Edom'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/133?lang=eng'
    quote: 'Who is this that cometh down from God in heaven with dyed garments'
  - where: 'note 49:13 “Bozrah and the coming of the Lord”'
    claim: 'D&C 1:36 Lord shall come down in judgment upon Idumea, or the world'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/1?lang=eng'
    quote: 'shall come down in judgment upon Idumea, or the world.'
  - where: 'note 49:13 “Bozrah and the coming of the Lord”'
    claim: 'Idumea is used to represent the world in D&C 1:36'
    key: bd-idumea
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/idumea?lang=eng'
    quote: 'In D&C 1:36 Idumea is used to represent the world.'
  - where: 'note 49:13 “Bozrah and the coming of the Lord”'
    claim: 'Edom, like Babylon, became a symbol of the world'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'Edom, like Babylon, became a symbol of the world (see D&C 1:36).'
  - where: 'note 49:16 “A nest in the rock”'
    claim: 'Obadiah 1:3–4 uses nearly the same words about Edom dwelling in the clefts of the rock'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/obad/1?lang=eng'
    quote: 'thou that dwellest in the clefts of the rock, whose habitation is high'
  - where: 'note 49:16 “A nest in the rock”'
    claim: 'Petra was carved from rock cliffs, entered through a narrow gorge, possibly Edom’s capital; many ruins later'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'A whole city was carved out of rock cliffs. It could be entered only through a narrow gorge.'
  - where: 'note 49:16 “A nest in the rock”'
    claim: 'Many scholars think Petra was the capital of Idumea; many visible ruins date later; dramatic impact on Obadiah'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'many scholars think it was the capital of Idumea. Though many of the ruins now visible at Petra date from a later period, they still give dramatic impact to Obadiah’s words.'
  - where: 'note 49:19 “The lion and the shepherd”'
    claim: 'The executor is not named, only set forth as a lion and in v. 22 as an eagle'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/49.htm'
    quote: 'but he is merely set forth as a lion, and in Jeremiah 49:22 as an eagle that in its flight darts down on its prey.'
  - where: 'note 49:19 “The lion and the shepherd”'
    claim: 'Jeremiah 50:44–45 repeats the lion passage against Babylon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/50?lang=eng'
    quote: 'and who is that shepherd that will stand before me?'
  - where: 'note 49:25 “A hard line about Damascus”'
    claim: 'The line has been differently explained; one reading takes it as sorrow that the inhabitants have not fled'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/49.htm'
    quote: 'it is not the desolation of the city that is bewailed, but the fact that the inhabitants have not saved their lives by flight.'
  - where: 'note 49:25 “A hard line about Damascus”'
    claim: 'Interpreters differ on the question'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/49.htm'
    quote: 'The question, "How is not," etc., has been differently explained.'
  - where: 'note 49:25 “A hard line about Damascus”'
    claim: '“My delight” expresses the prophet’s sympathy for the fall of the glorious city'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/49.htm'
    quote: 'The suffix in "my delight" refers to the prophet, and expresses his sympathy for the fall of the glorious city'
  - where: 'note 49:27 “Damascus and Ben-hadad''s house”'
    claim: 'Damascus conquered by Tiglath-pileser and inhabitants carried captive about 733 B.C.; Jer. 49:23–27 cited'
    key: bd-damascus
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/damascus?lang=eng'
    quote: 'It was conquered by Tiglath-pileser and its inhabitants carried captive about 733 B.C. (2 Kgs. 16:9; Isa. 8:4; 17:1–3; Jer. 49:23–27; Amos 1:3–5).'
  - where: 'note 49:27 “Damascus and Ben-hadad''s house”'
    claim: 'Hamath is an important Syrian city in the valley of the Orontes, taken by the Assyrians'
    key: bd-hamath
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hamath?lang=eng'
    quote: 'An important city of Syria, in the valley of the Orontes'
  - where: 'note 49:27 “Damascus and Ben-hadad''s house”'
    claim: 'Hamath was taken afterwards by the Assyrians'
    key: bd-hamath
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hamath?lang=eng'
    quote: 'It was afterwards taken by the Assyrians (2 Kgs. 14:28).'
  - where: 'note 49:27 “Damascus and Ben-hadad''s house”'
    claim: 'One reading: Ben-hadad is a royal name, since three kings of Damascus bore it'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/49.htm'
    quote: 'because three kings of Damascus bore this name.'
  - where: 'note 49:27 “Damascus and Ben-hadad''s house”'
    claim: 'The prophecy is general; fulfilment cannot be proved historically'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/49.htm'
    quote: 'The fulfilment of this threat cannot be proved historically, from want of information.'
  - where: 'note 49:27 “Damascus and Ben-hadad''s house”'
    claim: 'The prophecy is so general its fulfilment need not be confined to Nebuchadnezzar'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/49.htm'
    quote: 'The prophecy is, however, so general in its statement, that we need not confine its fulfilment to the conquest by Nebuchadnezzar.'
  - where: 'note 49:28 “Kedar and Hazor”'
    claim: 'Kedar was a son of Ishmael'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/25?lang=eng'
    quote: 'the firstborn of Ishmael, Nebajoth; and Kedar, and Adbeel, and Mibsam'
  - where: 'note 49:28 “Kedar and Hazor”'
    claim: 'Isaiah says the glory of Kedar shall fail'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/21?lang=eng'
    quote: 'all the glory of Kedar shall fail'
  - where: 'note 49:28 “Kedar and Hazor”'
    claim: 'The Nebuchadrezzar of verse 30 is Nebuchadnezzar'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/49.htm'
    quote: 'the statement that Nebuchadnezzar, as the instrument of Jahveh, has formed a plan against them'
  - where: 'note 49:28 “Kedar and Hazor”'
    claim: 'Hazor in Galilee was taken by Tiglath-pileser'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/15?lang=eng'
    quote: 'and Kedesh, and Hazor, and Gilead, and Galilee'
  - where: 'note 49:28 “Kedar and Hazor”'
    claim: 'One reading: Hazor is not the Palestinian cities; it denotes settled Arabs; no Arabian place of that name is known'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/49.htm'
    quote: 'No locality or region of this name in Arabia is known.'
  - where: 'note 49:28 “Kedar and Hazor”'
    claim: 'Hazor denotes the Arabians who dwelt in villages as opposed to Bedouins'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/49.htm'
    quote: 'Jeremiah appears to have formed the name for the purpose of designating those Arabians who dwelt in'
  - where: 'note 49:28 “Kedar and Hazor”'
    claim: 'The nation without gates and bars does not live in walled cities'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/49.htm'
