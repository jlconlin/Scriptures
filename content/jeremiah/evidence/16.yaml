chapter: 16
claims:
  - where: 'when'
    claim: 'Chapters 7–20 are placed under Jehoiakim (608–597) in the Bible Dictionary outline; chapter 16 itself carries no date'
    key: bd-jeremiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng
    quote: 'Prophecies under Jehoiakim (608–597), Jer. 7–20.'
  - where: 'setting'
    claim: 'The Church chapter heading summarizes the chapter: ruin, scattering for false gods, fishers and hunters gather Israel, gospel restored'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/16?lang=eng
    quote: 'The utter ruin of Judah is foreseen—Israel is rejected and scattered for serving false gods—Fishers and hunters will gather Israel again, and the people will serve the Lord—The gospel is to be restored.'
  - where: 'setting'
    claim: 'Chapters 14–15 are about a drought and the Lord rejecting intercession, and the prophet complaining; chapter 16 follows'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'presents a discussion between Jeremiah and the Lord concerning a great drought and the effects attending it.'
  - where: 'setting'
    claim: 'The Lord told Jeremiah three things he was not to do (marry, lament, feast) to symbolize the sad day for Judah'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'Jeremiah’s day was a sad one for Judah. To symbolize that truth, the Lord told His prophet three things that he was not to do:'
  - where: 'setting'
    claim: 'In chapter 15 Judah has reached the point where the Lord would no longer forgive them'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'Plainly, Judah had reached the point at which the Lord would no longer forgive them.'
  - where: 'setting'
    claim: 'In 15:15–21 Jeremiah pleads for himself'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'Jeremiah then began to plead for himself.'
  - where: 'setting'
    claim: 'Verses 14–16 have been read in general conference as the latter-day gathering through missionaries'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'In a general conference address Elder LeGrand Richards commented on these verses'
  - where: 'note 16:7 “Bread and the cup of consolation”'
    claim: 'To break bread to someone means giving bread, not holding a meal; the verse does not refer to a funeral meal'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/16.htm
    quote: 'To break bread to any one does not mean to hold a feast with him, but to bestow a gift of bread upon him'
  - where: 'note 16:2 “A prophet without a family”'
    claim: 'The command not to marry reflects the universality of the calamity; it may not have been literal; possibly meaning no spiritual children/converts'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'So universal was the calamity bearing down upon the people that God did not want children to suffer its outrage. This commandment, like the one to Hosea to take a wife of whoredoms (see Hosea 10), may not have been a literal one.'
  - where: 'note 16:2 “A prophet without a family”'
    claim: 'Second reading in the manual: no spiritual children (converts)'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'Perhaps the meaning is that Jeremiah was not to expect that his people would marry themselves to the covenant again, nor was he to expect to get spiritual children (converts) from his ministry.'
  - where: 'note 16:2 “A prophet without a family”'
    claim: 'Ezekiel was likewise told not to mourn when his wife died, and did as commanded'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/24?lang=eng
    quote: 'So I spake unto the people in the morning: and at even my wife died; and I did in the morning as I was commanded.'
  - where: 'note 16:2 “A prophet without a family”'
    claim: 'The Church edition links verse 5 to Ezek. 24:17'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/16?lang=eng
    quote: 'Ezek. 24:17.'
  - where: 'note 16:4 “No burial, no mourning”'
    claim: 'Deuteronomy’s curses include the carcase being meat to fowls and beasts with no one to drive them away; Church edition links Jer 16:4 to Deut. 28:26 and Jer. 14:12'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/deut/28?lang=eng
    quote: 'And thy carcase shall be meat unto all fowls of the air, and unto the beasts of the earth, and no man shall fray them away.'
  - where: 'note 16:4 “No burial, no mourning”'
    claim: 'The Church edition footnotes verse 4 to Deut. 28:26 and Jer. 14:12'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/16?lang=eng
    quote: 'Deut. 28:26.'
  - where: 'note 16:5 “Why Jeremiah may not mourn”'
    claim: 'He was not to lament those who died, since they brought the judgments on themselves; not to feast, since feasting signals celebration and eating together fellowship; he was to explain the reasons to the people'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'He was not to lament those in Judah who died by the sword or famine (see Jeremiah 16:5), since they brought these judgments upon themselves.'
  - where: 'note 16:6 “Cutting and baldness”'
    claim: 'The law forbade cutting oneself and baldness for the dead; Church edition footnotes v6 to Deut. 14:1'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/deut/14?lang=eng
    quote: 'Ye are the children of the Lord your God: ye shall not cut yourselves, nor make any baldness between your eyes for the dead.'
  - where: 'note 16:6 “Cutting and baldness”'
    claim: 'These were modes of passionate mourning forbidden in the law yet still in use among the people'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/16.htm
    quote: 'These are two modes of expressing passionate mourning for the dead which were forbidden to the Israelites in the law, yet which remained in use among the people'
  - where: 'note 16:7 “Bread and the cup of consolation”'
    claim: 'The Church edition notes the Hebrew behind “tear themselves” is “break bread”'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/16?lang=eng
    quote: 'HEB break bread.'
  - where: 'note 16:7 “Bread and the cup of consolation”'
    claim: 'The customs refer to sending bread and wine to the bereaved relatives'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/16.htm
    quote: 'The words refer to the custom of sending bread and wine for refreshment into the house of the surviving relatives of one dead, to comfort them in their sorrow'
  - where: 'note 16:9 “The voice of the bridegroom”'
    claim: 'Feasting is a sign of celebration and eating together a symbol of fellowship'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'He was not to feast or eat with friends in Jerusalem (see v. 8), since feasting was a sign of celebration and eating together a symbol of fellowship.'
  - where: 'note 16:9 “The voice of the bridegroom”'
    claim: 'The same line stands in Jer. 7:34 where the cities and streets of Jerusalem are named and the land is desolate; Church edition links to Jer. 7:34; 25:10'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/7?lang=eng
    quote: 'Then will I cause to cease from the cities of Judah, and from the streets of Jerusalem, the voice of mirth, and the voice of gladness, the voice of the bridegroom, and the voice of the bride: for the land shall be desolate.'
  - where: 'note 16:9 “The voice of the bridegroom”'
    claim: 'Church edition footnotes verse 9 to Jer. 7:34; 25:10'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/16?lang=eng
    quote: 'Jer. 7:34; 25:10.'
  - where: 'note 16:10 “The question the people ask”'
    claim: 'Jeremiah is to explain; the reason is the fathers forsook the Lord, and the present generation did worse (verses 11–12); “imagination” can be rendered “stubbornness”'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/16?lang=eng
    quote: 'OR stubbornness.'
  - where: 'note 16:10 “The question the people ask”'
    claim: 'Church edition links verse 12 to Jer. 7:26 and verse 10 to Deut. 29:24'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/16?lang=eng
    quote: 'Jer. 7:26.'
  - where: 'note 16:10 “The question the people ask”'
    claim: 'Jeremiah was told to explain clearly the reasons for his actions and for the coming punishment'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'In addition, Jeremiah was commanded to explain clearly to the people the reasons for his actions as well as the reasons for their coming punishment.'
  - where: 'note 16:13 “Serve other gods day and night”'
    claim: 'The phrase is irony: “there ye may serve, as long as ye will,” the gods they longed after'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/16.htm
    quote: '"There ye may serve them," Ros. justly characterizes as concessio cum ironia: there ye may serve, as long as ye will, the gods whom ye have so longed after. The irony is especially marked in the "day and night."'
  - where: 'note 16:13 “Serve other gods day and night”'
    claim: 'The Hebrew behind “favour” is rendered by the Church edition as “grant you amnesty or clemency”; footnote links to Jer. 15:14 (a land which thou knowest not)'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/16?lang=eng
    quote: 'HEB grant you amnesty or clemency.'
  - where: 'note 16:15 “Greater than the Exodus”'
    claim: 'The gathering is as miraculous as the deliverance from Egypt; “from the north and from other lands” means the Lord will gather the descendants of Israel, bringing them to the gospel and to Church membership'
    key: ot-seminary-teacher-133
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-jeremiah/lesson-133-jeremiah-7-16?lang=eng
    quote: 'bringing up the children of Israel from the north and from other lands means that the Lord will gather the descendants of Israel, bringing them to the knowledge of the gospel of Jesus Christ and to membership in His Church.'
  - where: 'note 16:15 “Greater than the Exodus”'
    claim: 'LeGrand Richards: Jeremiah says that in the latter days they will no more remember the Exodus but how God has gathered scattered Israel'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'telling us that in the latter days they shall no more remember that, but how God has gathered scattered Israel from the lands whither he had driven them.'
  - where: 'note 16:15 “Greater than the Exodus”'
    claim: 'The same prophecy is in Jer. 23:7–8, which adds that they shall dwell in their own land'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/23?lang=eng
    quote: 'But, The Lord liveth, which brought up and which led the seed of the house of Israel out of the north country, and from all countries whither I had driven them; and they shall dwell in their own land.'
  - where: 'note 16:15 “Greater than the Exodus”'
    claim: 'Moses, at the Kirtland Temple, committed the keys of the gathering and the leading of the ten tribes from the land of the north'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/110?lang=eng
    quote: 'Moses appeared before us, and committed unto us the keys of the gathering of Israel from the four parts of the earth, and the leading of the ten tribes from the land of the north.'
  - where: 'note 16:15 “Greater than the Exodus”'
    claim: 'Church edition footnotes “land of the north” to Ten Lost Tribes and Jer. 3:18'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/16?lang=eng
    quote: 'TG Israel, Ten Lost Tribes of.'
  - where: 'note 16:16 “Fishers and hunters”'
    claim: 'Richards identifies the fishers and hunters as the Church’s missionaries'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'They are these 14,000 missionaries of this church, and those who have preceded them from the time that the Prophet Joseph Smith received the truth and sent the messengers out to share it with the world.'
  - where: 'note 16:16 “Fishers and hunters”'
    claim: 'Nelson: missionaries have hunted for scattered Israel out of the holes of the rocks and fished for them'
    key: nelson-gathering
    url: https://www.churchofjesuschrist.org/study/general-conference/2006/10/the-gathering-of-scattered-israel?lang=eng
    quote: 'In many nations our missionaries have searched for those of scattered Israel; they have hunted for them “out of the holes of the rocks”; and they have fished for them as in ancient days.'
  - where: 'note 16:16 “Fishers and hunters”'
    claim: 'Fishers and hunters refer to those who help gather Israel through missionary work; Church edition links v16 to Missionary Work'
    key: ot-seminary-teacher-133
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-jeremiah/lesson-133-jeremiah-7-16?lang=eng
    quote: 'They refer to those who help gather Israel through missionary work.'
  - where: 'note 16:16 “Fishers and hunters”'
    claim: 'One reading (Keil) takes the fishers and hunters as enemies who carry Judah captive, because verses 17–18 speak of punishment'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/16.htm
    quote: 'The figures of the fishers and hunters do not bespeak the gathering again and restoration of the scattered people, as Ven. would make out, but the carrying of Judah captive out of his land.'
  - where: 'note 16:18 “Double, and first”'
    claim: 'Isaiah 40:2 says Jerusalem received double for all her sins; Church edition links v18 to Isa. 40:2 and Jer. 17:18'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/isa/40?lang=eng
    quote: 'Speak ye comfortably to Jerusalem, and cry unto her, that her warfare is accomplished, that her iniquity is pardoned: for she hath received of the Lord’s hand double for all her sins.'
  - where: 'note 16:18 “Double, and first”'
    claim: '“Double” means ample measure for their sins; “first” refers to before the restoration of verse 15; the defiling is by dead idols'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/16.htm
    quote: '"The double of their iniquity," i.e., ample measure for their sins (cf. Isaiah 40:2; Job 11:6) by way of the horrors of war and the sufferings of the exile.'
  - where: 'note 16:18 “Double, and first”'
    claim: '“First” read as before the restoration promised in verse 15'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/16.htm
    quote: 'first, i.e., before the restoration of my favour spoken of in Jeremiah 16:15'
  - where: 'note 16:18 “Double, and first”'
    claim: 'Church edition footnote on “defiled my land” links Jer. 2:7'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/16?lang=eng
    quote: 'Jer. 2:7. TG Pollution.'
  - where: 'note 16:19 “Gentiles from the ends of the earth”'
    claim: 'Jeremiah prophesied that in the last days the Gentiles would seek to know the truth about God and be gathered along with Israel (16:19–21)'
    key: ot-seminary-teacher-133
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-jeremiah/lesson-133-jeremiah-7-16?lang=eng
    quote: 'Jeremiah also prophesied that in the last days the Gentiles would seek to know the truth about God and would be gathered along with the descendants of Israel [see Jeremiah 16:19–21].'
  - where: 'note 16:19 “Gentiles from the ends of the earth”'
    claim: 'Church edition: “Gentiles” may be rendered “nations”; footnote links to D&C 93:39'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/16?lang=eng
    quote: 'OR nations.'
  - where: 'note 16:19 “Gentiles from the ends of the earth”'
    claim: 'D&C 93:39: the wicked one takes away light and truth because of the tradition of their fathers'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/93?lang=eng
    quote: 'And that wicked one cometh and taketh away light and truth, through disobedience, from the children of men, and because of the tradition of their fathers.'
  - where: 'note 16:21 “My name is The LORD”'
    claim: 'The Church edition links v21 to Ex. 6:3; 15:3; Abr. 1:16; 2:8'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/16?lang=eng
    quote: 'Ex. 6:3; 15:3; Abr. 1:16; 2:8.'
  - where: 'note 16:21 “My name is The LORD”'
    claim: 'Exodus 6:3: the Lord says He was not known to the patriarchs by the name Jehovah; the heading says the Lord identifies Himself as Jehovah'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/ex/6?lang=eng
    quote: 'And I appeared unto Abraham, unto Isaac, and unto Jacob, by the name of God Almighty, but by my name Jehovah was I not known to them.'
  - where: 'note 16:21 “My name is The LORD”'
    claim: 'Abraham 1:16: “my name is Jehovah”, the Lord who delivers'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/1?lang=eng
    quote: 'Abraham, Abraham, behold, my name is Jehovah, and I have heard thee, and have come down to deliver thee'
  - where: 'christ'
    claim: 'Exodus 15:3 “The Lord is a man of war: the Lord is his name”; Abr. 1:16 Jehovah comes down to deliver'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/ex/15?lang=eng
    quote: 'The Lord is a man of war: the Lord is his name.'
  - where: 'explore'
    claim: 'Jer. 9:23–24 and 16:21 both concern knowing the Lord'
    key: ot-seminary-teacher-133
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-jeremiah/lesson-133-jeremiah-7-16?lang=eng
    quote: 'Jeremiah 9:23–24; 16:21. “Let him that glorieth glory in this, that he understandeth and knoweth me”'
  - where: 'note 16:21 “My name is The LORD”'
    claim: 'Jehovah is the premortal Jesus Christ; latter-day revelation (JST Ex. 6:3, Abr. 1:16; 2:8) shows the name was known before Moses'
    key: bd-jehovah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: 'note 16:21 “My name is The LORD”'
    claim: 'Latter-day revelation says otherwise than Ex. 6:3 on the name being unknown'
    key: bd-jehovah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng
    quote: 'Although Ex. 6:3 states that the God of Israel was not known by the name Jehovah before Moses’ time, latter-day revelation tells us otherwise'
