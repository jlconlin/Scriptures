chapter: 40
claims:
  - where: 'note 40:1 “Ramah, where the captives were gathered”'
    claim: 'At the captivity the exiles were collected at Ramah before removal to Babylon; the BD lists Jer. 31:15, 40:1, Matt. 2:18'
    key: bd-ramah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ramah?lang=eng'
    quote: 'At the time of the captivity the exiles were collected here before removal to Babylon (Jer. 31:15; 40:1; Matt. 2:18'
  - where: 'note 40:1 “Ramah, where the captives were gathered”'
    claim: 'Jeremiah was taken in chains to Ramah, about five miles north of Jerusalem, and released there'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'he was first taken in chains with all the other captured Jews as far as Ramah, a town about five miles north of Jerusalem.'
  - where: 'note 40:1 “Ramah, where the captives were gathered”'
    claim: 'Jer. 31:15 voice heard in Ramah; Matthew says it was fulfilled'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/31?lang=eng'
    quote: 'Thus saith the Lord; A voice was heard in Ramah, lamentation, and bitter weeping; Rahel weeping for her children'
  - where: 'note 40:1 “Ramah, where the captives were gathered”'
    claim: 'Matt. 2:17–18 cites Jeremiah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/2?lang=eng'
    quote: 'Then was fulfilled that which was spoken by Jeremy the prophet'
  - where: 'note 40:1 “Chains at Ramah, and the prison court”'
    claim: 'Jer. 39:11–14 has Nebuchadrezzar charge Nebuzar-adan, who takes Jeremiah out of the prison court and commits him to Gedaliah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/39?lang=eng'
    quote: 'took Jeremiah out of the court of the prison, and committed him unto Gedaliah the son of Ahikam the son of Shaphan'
  - where: 'note 40:1 “Chains at Ramah, and the prison court”'
    claim: 'Nebuchadrezzar ordered that Jeremiah be treated well'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/39?lang=eng'
    quote: 'Take him, and look well to him, and do him no harm; but do unto him even as he shall say unto thee.'
  - where: 'note 40:1 “A heading with no word in it”'
    claim: 'One reading: the superscription heads the prophecies after the fall, chs. 40–45, as 1:2–3 heads the whole book; no word is declared in the opening verses'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/40.htm'
    quote: 'does not seem to be appropriate; for in what follows there is no word of God declared by Jeremiah'
  - where: 'note 40:1 “A heading with no word in it”'
    claim: 'Same commentator: the heading covers the prophecies Jeremiah uttered after the destruction'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/40.htm'
    quote: 'form the superscription for the prophecies which Jeremiah uttered after the destruction of Jerusalem'
  - where: 'note 40:3 “A Babylonian says what Jeremiah said”'
    claim: 'Footnote 3a cross-references D&C 101:2'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/101?lang=eng'
    quote: 'I, the Lord, have suffered the affliction to come upon them, wherewith they have been afflicted, in consequence of their transgressions;'
  - where: 'note 40:3 “A Babylonian says what Jeremiah said”'
    claim: 'Footnote 3b cross-references Jer. 44:23, Jeremiah to the Jews in Egypt, in nearly the same words'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/44?lang=eng'
    quote: 'ye have sinned against the Lord, and have not obeyed the voice of the Lord, nor walked in his law'
  - where: 'note 40:3 “A Babylonian says what Jeremiah said”'
    claim: 'One reading: the expression is Jeremiah’s, while Nebuzar-adan may have said that the prophecy had now been fulfilled'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/40.htm'
    quote: 'The mode of expression is that of Jeremiah; but Nebuzaradan may have expressed the thought, that now there had been fulfilled what Jeremiah had predicted in the name of God'
  - where: 'note 40:4 “Babylon or the land”'
    claim: 'The Babylonians freed Jeremiah, suggested he live with Gedaliah, and he did'
    key: ot-seminary-guide-jer-37-44
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-student-study-guide-obs/the-book-of-jeremiah/jeremiah-37-44-babylon-conquers-judah?lang=eng'
    quote: 'Jeremiah 40 records that the Babylonians completely freed Jeremiah. They suggested that he go live with Gedaliah, whom they assigned to govern the land, and Jeremiah did.'
  - where: 'note 40:4 “Babylon or the land”'
    claim: 'Jeremiah had told the nations to serve Babylon and stay in their land'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/27?lang=eng'
    quote: 'But the nations that bring their neck under the yoke of the king of Babylon, and serve him, those will I let remain still in their own land, saith the Lord'
  - where: 'note 40:5 “Gedaliah, son of Ahikam, son of Shaphan”'
    claim: 'Shaphan the scribe and Ahikam were among Josiah’s delegation sent when the book of the law was found'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/34?lang=eng'
    quote: 'the king commanded Hilkiah, and Ahikam the son of Shaphan, and Abdon the son of Micah, and Shaphan the scribe'
  - where: 'note 40:5 “Gedaliah, son of Ahikam, son of Shaphan”'
    claim: 'Ahikam protected Jeremiah from being put to death'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/26?lang=eng'
    quote: 'the hand of Ahikam the son of Shaphan was with Jeremiah, that they should not give him into the hand of the people to put him to death.'
  - where: 'note 40:5 “Gedaliah, son of Ahikam, son of Shaphan”'
    claim: 'Gedaliah was made ruler over the people left in Judah (2 Kgs 25:22)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/25?lang=eng'
    quote: 'even over them he made Gedaliah the son of Ahikam, the son of Shaphan, ruler.'
  - where: 'note 40:7 “The poor who were left”'
    claim: 'Nebuzar-adan left the poor in Judah and gave them vineyards and fields'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/39?lang=eng'
    quote: 'Nebuzar-adan the captain of the guard left of the poor of the people, which had nothing, in the land of Judah, and gave them vineyards and fields at the same time.'
  - where: 'note 40:7 “The poor who were left”'
    claim: 'During the conquest many soldiers had dispersed through the land to places the Chaldeans could not reach'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/40.htm'
    quote: 'many of the men of war had dispersed here and there through the land, and fled for refuge to regions difficult of access'
  - where: 'note 40:8 “Ishmael of the seed royal”'
    claim: 'Ishmael was of the seed royal'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/41?lang=eng'
    quote: 'Ishmael the son of Nethaniah the son of Elishama, of the seed royal'
  - where: 'note 40:9 “Gedaliah repeats Jeremiah''s counsel”'
    claim: 'Jeremiah’s letter to the exiles: seek the peace of the city'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/29?lang=eng'
    quote: 'seek the peace of the city whither I have caused you to be carried away captives, and pray unto the Lord for it'
  - where: 'note 40:9 “Gedaliah repeats Jeremiah''s counsel”'
    claim: 'The Lord’s promise in Jer. 42:10 to those who stay: build and plant (the verbs of 1:10)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/42?lang=eng'
    quote: 'If ye will still abide in this land, then will I build you, and not pull you down, and I will plant you, and not pluck you up'
  - where: 'note 40:9 “Gedaliah repeats Jeremiah''s counsel”'
    claim: 'Gedaliah’s promise matches 2 Kgs 25:24'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/25?lang=eng'
    quote: 'Fear not to be the servants of the Chaldees: dwell in the land, and serve the king of Babylon; and it shall be well with you.'
  - where: 'note 40:14 “Gedaliah would not believe”'
    claim: 'Ishmael murdered Gedaliah, the Jews with him, and the Chaldeans there'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/41?lang=eng'
    quote: 'Ishmael also slew all the Jews that were with him, even with Gedaliah, at Mizpah, and the Chaldeans that were found there, and the men of war.'
  - where: 'note 40:12 “Why the refugees came back”'
    claim: 'After the murder the survivors went toward Egypt for fear of the Chaldeans'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/41?lang=eng'
    quote: 'to go to enter into Egypt, Because of the Chaldeans: for they were afraid of them, because Ishmael the son of Nethaniah had slain Gedaliah'
  - where: 'note 40:14 “Gedaliah would not believe”'
    claim: 'Why Baalis wanted Gedaliah dead (personal hostility, or removing the Jews’ last support) cannot be determined'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/40.htm'
    quote: 'What induced the king of Ammon to think of assassination - whether it was personal hostility towards Gedaliah, or the hope of destroying the only remaining support of the Jews'
  - where: 'note 40:14 “Gedaliah would not believe”'
    claim: 'The good governor was warned but would not believe (the manual quoting Sperry, Voice of Israel’s Prophets, 184–85)'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'The good governor was warned of this, but he would not believe those who had informed him of the plot.'
  - where: 'setting'
    claim: 'Jeremiah prophesied until after the downfall of Jerusalem, 626–586 B.C.'
    key: bd-jeremiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng'
    quote: 'prophesied from the 13th year of Josiah till after the downfall of Jerusalem, a period of over 40 years, 626–586 B.C.'
  - where: 'setting'
    claim: 'BD: chs. 39–44 are the prophet’s history after the fall'
    key: bd-jeremiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng'
    quote: 'Jer. 39–44, the prophet’s history and other events after the fall of the city.'
  - where: 'setting'
    claim: 'Those who escaped into Egypt took Jeremiah with them (43:6); the survivors’ flight (43:4–7)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/43?lang=eng'
    quote: 'So they came into the land of Egypt: for they obeyed not the voice of the Lord: thus came they even to Tahpanhes.'
  - where: 'christ'
    claim: 'Matthew says the weeping at Ramah was fulfilled; Jer. 31:16–17 promises return'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/31?lang=eng'
    quote: 'Refrain thy voice from weeping, and thine eyes from tears: for thy work shall be rewarded, saith the Lord; and they shall come again from the land of the enemy.'
  - where: 'note 40:1 “Chains at Ramah, and the prison court”'
    claim: 'Jeremiah was taken in chains as far as Ramah, where the captain of the guard loosed his bonds and sent him to Gedaliah (the manual quoting Sperry, Voice of Israel’s Prophets, 184–85)'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'Here the Babylonian ‘captain of the guard’ loosed his bonds, ‘gave him an allowance and a present,’ and sent him back to Gedaliah, the new governor of Judah'
  - where: 'note 40:1 “A heading with no word in it”'
    claim: 'One reading: the heading covers chs. 40–45, as the word in 1:2 heads the earlier prophecies; no word of God until 42:7'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/40.htm'
    quote: 'to the section formed by Jeremiah 40-45 , although Jeremiah 44 ; Jeremiah 45:1-5 have headings of their own'
  - where: 'note 40:3 “A Babylonian says what Jeremiah said”'
    claim: 'Jeremiah prophesied for over forty years before the fall'
    key: bd-jeremiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng'
    quote: 'till after the downfall of Jerusalem, a period of over 40 years'
  - where: 'note 40:3 “A Babylonian says what Jeremiah said”'
    claim: 'The Church’s footnote 3a on Jer. 40:3 points to D&C 101:2 and footnote 3b to Jer. 44:23'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/40?lang=eng'
    quote: 'D&C 101:2 (1–9). … Jer. 44:23.'
  - where: 'note 40:1 “Ramah, where the captives were gathered”'
    claim: 'Ramah: the exiles gathered there; read with Jer. 31:15'
    key: bd-ramah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ramah?lang=eng'
    quote: 'the exiles were collected here before removal to Babylon'
  - where: 'christ'
    claim: 'Ramah links Jer. 31:15, 40:1, and Matt. 2:18'
    key: bd-ramah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ramah?lang=eng'
    quote: 'At the time of the captivity the exiles were collected here before removal to Babylon (Jer. 31:15; 40:1; Matt. 2:18'
  - where: 'note 40:7 “The poor who were left”'
    claim: 'Others had escaped to Moab, Ammon, Edom and returned to Gedaliah'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/40.htm'
    quote: 'others had even escaped into the territory of the Moabites, Ammonites, and Edomites'
