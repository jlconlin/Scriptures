    claim: 'The Church edition links "end" to Amos 9:8 and D&C 101:9'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/30?lang=eng'
    quote: 'Amos 9:8; D&C 101:9 (1–9).'
  - where: 'note 30:11 “Corrected, not ended”'
    claim: 'Amos 9:8: not utterly destroy the house of Jacob'
