    claim: '"Measure" means justice; "chastisement" means correction'
    key: ot-seminary-guide-jer-30
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-student-study-guide-obs/the-book-of-jeremiah/jeremiah-30-the-lord-promises-help?lang=eng'
