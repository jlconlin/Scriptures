chapter: 30
claims:
  - where: 'when'
    claim: 'Chapters 30–33 are grouped with the prophecies under Zedekiah (597–586); the chapter itself gives no date'
    key: bd-jeremiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng'
    quote: '(c) Jer. 30–33, prophecies of the latter-day restoration of Israel and the gospel covenant'
  - where: 'when'
    claim: 'Prophecies under Zedekiah (597–586)'
    key: bd-jeremiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng'
    quote: 'Prophecies under Zedekiah (597–586), Jer. 21–38'
  - where: 'setting'
    claim: 'Chapters 30–33 give the scattered and captive Israelites the Lord''s assurance that He had not forsaken them or His covenants'
    key: ot-seminary-guide-jer-30
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-student-study-guide-obs/the-book-of-jeremiah/jeremiah-30-the-lord-promises-help?lang=eng'
    quote: 'Jeremiah 30–33 contains the Lord’s assurance to the children of Israel who were scattered and in captivity that He had not forsaken them or His covenants.'
  - where: 'setting'
    claim: 'Chapters 30–33 concern the latter-day restoration of Israel and Judah and a new and everlasting covenant'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'Chapters 30–33 deal with the prophet’s predictions of the restoration of Israel and Judah in the last days and of the Lord’s making a new and everlasting covenant with them.'
  - where: 'setting'
    claim: 'Church chapter heading'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/30?lang=eng'
    quote: 'In the last days, Judah and Israel will be gathered to their own lands—David, their king (the Messiah), will reign over them.'
  - where: 'setting'
    claim: 'Chapter 29 is the prophet''s letter to the exiles in Babylon'
    key: bd-jeremiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng'
    quote: '(b) Jer. 26–29, on the false prophets, containing the prophet’s letter to the exiles in Babylon, warning against the prophets there.'
  - where: 'setting'
    claim: 'Israel (the northern kingdom) had been taken by the Assyrians over 120 years earlier'
    key: ot-seminary-guide-jer-30
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-student-study-guide-obs/the-book-of-jeremiah/jeremiah-30-the-lord-promises-help?lang=eng'
    quote: 'Israel was taken by the Assyrians over 120 years before the time the Lord gave Jeremiah the message in this chapter.'
  - where: 'setting'
    claim: 'Jeremiah was in jail when chapters 30–33 came'
    key: ot-seminary-guide-jer-30
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-student-study-guide-obs/the-book-of-jeremiah/jeremiah-30-the-lord-promises-help?lang=eng'
    quote: 'Jeremiah was told to write rather than speak the prophecy in Jeremiah 30–33. Since Jeremiah was in jail at the time'
  - where: 'thread'
    claim: 'Verse 3 has several fulfillments: return from Babylon, latter-day gathering of the Jews, return of the lost tribes'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'Jeremiah 30:3has several meanings. It refers to the return of the Jews after seventy years of captivity in Babylon. It also refers to the restoration of the Jews to their homeland in the last days'
  - where: 'thread'
    claim: 'The JST of verses 12–13 says the bruise is not incurable'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/30?lang=eng'
    quote: 'JST Jer. 30:12–13 … thy bruise is not incurable, although thy wounds are grievous.'
  - where: 'note 30:2 “Written, not spoken”'
    claim: 'Jeremiah was told to write rather than speak; he was in jail; written word reaches the captives later'
    key: ot-seminary-guide-jer-30
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-student-study-guide-obs/the-book-of-jeremiah/jeremiah-30-the-lord-promises-help?lang=eng'
    quote: 'Jeremiah was told to write rather than speak the prophecy in Jeremiah 30–33. Since Jeremiah was in jail at the time, the written word would still allow the words of a prophet to reach the people.'
  - where: 'note 30:2 “Written, not spoken”'
    claim: 'The people in captivity might be more teachable and read it later'
    key: ot-seminary-guide-jer-30
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-student-study-guide-obs/the-book-of-jeremiah/jeremiah-30-the-lord-promises-help?lang=eng'
    quote: 'if it were written down the people who were in captivity might be more teachable and could read it at a later time.'
  - where: 'note 30:3 “One promise, three returns”'
    claim: 'The verse has several meanings: return from Babylon, latter-day return of the Jews, return of the lost tribes'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'Jeremiah 30:3has several meanings. It refers to the return of the Jews after seventy years of captivity in Babylon. It also refers to the restoration of the Jews to their homeland in the last days after they have been scattered for the second time. And it refers to the return of the lost tribes from the lands of the north.'
  - where: 'note 30:3 “One promise, three returns”'
    claim: 'Cyrus allowed the Jews to return (Ezra 1:1–2)'
    key: ot-seminary-manual-jer-30-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-resource-manual/the-book-of-jeremiah/jeremiah-30-33?lang=eng'
    quote: 'It refers to how the Lord inspired King Cyrus to allow the Jews to return to Jerusalem after seventy years of captivity in Babylon (see Ezra 1:1–2).'
  - where: 'note 30:3 “One promise, three returns”'
    claim: 'Benson: three phases of the gathering'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'three phases: the gathering of Israel to the land of Zion, the American hemisphere; the return of the Ten Tribes from the countries of the north; and the reestablishment of the Jews in Palestine as God’s chosen people.'
  - where: 'note 30:3 “One promise, three returns”'
    claim: 'McConkie: the gathering is believing the gospel and joining the Church, and may include assembling'
    key: ot-seminary-lesson-139
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-material-2018/jeremiah/lesson-139?lang=eng'
    quote: 'It consists of believing the gospel, joining the Church, and coming into the kingdom.'
  - where: 'note 30:3 “One promise, three returns”'
    claim: 'McConkie: gathering may also be assembling to a place'
    key: ot-seminary-lesson-139
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-material-2018/jeremiah/lesson-139?lang=eng'
    quote: 'And it may also consist of assembling to an appointed place or land of worship'
  - where: 'note 30:3 “One promise, three returns”'
    claim: 'McConkie: Israel was scattered for apostasy'
    key: ot-seminary-lesson-139
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-material-2018/jeremiah/lesson-139?lang=eng'
    quote: 'Israel was scattered for apostasy.'
  - where: 'note 30:3 “One promise, three returns”'
    claim: 'The prophecy is addressed to both Israel and Judah; Israel was taken 120 years earlier'
    key: ot-seminary-guide-jer-30
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-student-study-guide-obs/the-book-of-jeremiah/jeremiah-30-the-lord-promises-help?lang=eng'
    quote: 'Israel was taken by the Assyrians over 120 years before the time the Lord gave Jeremiah the message in this chapter.'
  - where: 'note 30:6 “A man in labor”'
    claim: '“doth travail” means be in labor'
    key: ot-seminary-guide-jer-30
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-student-study-guide-obs/the-book-of-jeremiah/jeremiah-30-the-lord-promises-help?lang=eng'
    quote: 'Doth travail (v. 6)Be in labor'
  - where: 'note 30:6 “A man in labor”'
    claim: 'The terror makes men hold their hands on their loins, and faces pale'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/30.htm'
    quote: 'What is the cause of this great horror, which makes all men, from convulsive pains, hold their hands on their loins, so as to support their bowels, in which they feel the pangs, and which makes every countenance pale?'
  - where: 'note 30:6 “A man in labor”'
    claim: 'The prophet speaks as one of the people (one reading)'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/30.htm'
    quote: 'A voice (sound) of trembling (or terror) we hear," viz., the people, of whom the prophet is one.'
  - where: 'note 30:6 “A man in labor”'
    claim: 'The prophet transports his hearers into the great day to come (one reading)'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/30.htm'
    quote: 'the prophet at once transports the hearers or readers of his prophecy, in thought, into the great day to come, which is to bring deliverance to all Israel.'
  - where: 'note 30:7 “The time of Jacob’s trouble”'
    claim: 'The Church edition links "that day" to Joel 2:11 and Mal. 4:5'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/30?lang=eng'
    quote: 'Joel 2:11; Mal. 4:5.'
  - where: 'note 30:7 “The time of Jacob’s trouble”'
    claim: '"That day" points to the future, excluding the destruction of Jerusalem (Keil)'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/30.htm'
    quote: '"That (not hits) day" points to the future, and thus, even apart from other reasons, excludes the supposition that it is the day of the destruction of Jerusalem that is meant.'
  - where: 'note 30:7 “The time of Jacob’s trouble”'
    claim: 'The judgment falls on the godless members of the covenant people too (Keil)'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/30.htm'
    quote: 'for the judgment falls not merely on the heathen nations, but also on the godless members of the covenant people, that they may be destroyed from among the congregation of the Lord.'
  - where: 'note 30:7 “The time of Jacob’s trouble”'
    claim: 'Seminary manual heads the passage 30:7–12 as the last-days gathering'
    key: ot-seminary-lesson-139
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-material-2018/jeremiah/lesson-139?lang=eng'
    quote: 'Jeremiah 30:7–12. The Lord will gather Judah and Israel in the last days'
  - where: 'note 30:8 “The yoke and the bonds”'
    claim: 'The yoke is Nebuchadnezzar''s; D&C 113:9–10 explains the bonds'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'The yoke spoken of in verse 8 is the yoke of oppression of Nebuchadnezzar. Doctrine and Covenants 113:9–10explains what the “bonds” are that are spoken of in Jeremiah 30:8.'
  - where: 'note 30:8 “The yoke and the bonds”'
    claim: 'D&C 113:10: the bands are the curses of God, the scattered condition'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/113?lang=eng'
    quote: 'The bands of her neck are the curses of God upon her, or the remnants of Israel in their scattered condition among the Gentiles.'
  - where: 'note 30:8 “The yoke and the bonds”'
    claim: 'D&C 113:10: the scattered are exhorted to return to the Lord and will receive revelation'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/113?lang=eng'
    quote: 'We are to understand that the scattered remnants are exhorted to return to the Lord from whence they have fallen; which if they do, the promise of the Lord is that he will speak to them, or give them revelation.'
  - where: 'note 30:8 “The yoke and the bonds”'
    claim: 'The deliverance reaches beyond Babylon''s yoke to every yoke (one reading)'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/30.htm'
    quote: 'not merely from the yoke of Babylon, but from every yoke which strangers have laid or will lay on them.'
  - where: 'note 30:9 “David their king”'
    claim: '"David" is the Messiah, descendant of David; fulfilled at Christ''s coming and again at the Second Coming'
    key: ot-seminary-guide-jer-30
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-student-study-guide-obs/the-book-of-jeremiah/jeremiah-30-the-lord-promises-help?lang=eng'
    quote: 'This “David” refers to the Messiah and King whom God promised would be David’s descendant. The promise was fulfilled at the coming of Jesus Christ and will be fulfilled again at the Second Coming.'
  - where: 'note 30:9 “David their king”'
    claim: 'McConkie: the Branch of David is Christ, also called David, a new, eternal David'
    key: ot-seminary-manual-jer-30-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-resource-manual/the-book-of-jeremiah/jeremiah-30-33?lang=eng'
    quote: 'That the Branch of David is Christ is perfectly clear. We shall now see that he is also called David, that he is a new David, an Eternal David'
  - where: 'note 30:9 “David their king”'
    claim: 'Jesus is the King David of the latter days, a branch of the ancient line'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'Jesus, who is the King David of the latter days, is a branch of the ancient line of King David.'
  - where: 'note 30:9 “David their king”'
    claim: 'The Church edition links "David" to Jer. 23:5, Ezek. 34:24, 37:24'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/30?lang=eng'
    quote: 'Jer. 23:5 (5–6); Ezek. 34:24 (23–24); 37:24 (24–25).'
  - where: 'note 30:11 “Corrected, not ended”'
    claim: 'The Lord does not ignore the sins of His people (v. 11)'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'He does not, however, ignore the sins of His people (see v. 11).'
