chapter: 32
claims:
  - where: 'when'
    claim: 'Zedekiah reigned 597–586 B.C.'
    key: bd-jeremiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng
    quote: "Prophecies under Zedekiah (597–586), Jer. 21–38"
  - where: 'setting'
    claim: 'Church chapter heading summarizes chapter 32'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/32?lang=eng
    quote: "Jeremiah is imprisoned by Zedekiah—The prophet purchases land to symbolize the return of Israel to their land—The Lord will gather Israel and make an everlasting covenant with them."
  - where: 'setting'
    claim: 'Chapters 30–33 are latter-day restoration prophecies including the field purchase'
    key: bd-jeremiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng
    quote: "(c) Jer. 30–33, prophecies of the latter-day restoration of Israel and the gospel covenant, containing the story of the prophet’s buying a field, showing the firmness of his faith in the people’s restitution."
  - where: 'setting'
    claim: 'Zedekiah’s eleventh year ended with the fall of Jerusalem in the fifth month, so the tenth year is the year before'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/1?lang=eng
    quote: "unto the end of the eleventh year of Zedekiah the son of Josiah king of Judah, unto the carrying away of Jerusalem captive in the fifth month."
  - where: 'setting'
    claim: 'Nebuchadnezzar and Nebuchadrezzar are the same king; he reigned 604–561'
    key: bd-nebuchadnezzar
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/nebuchadnezzar?lang=eng
    quote: "Nebuchadnezzar, Nebuchadrezzar Or Nabu-kudur-usur. … The great king of Babylon (604–561 B.C.)"
  - where: 'setting'
    claim: 'Chapter 33 opens while Jeremiah is still shut up in the court of the prison'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/33?lang=eng
    quote: "Moreover the word of the Lord came unto Jeremiah the second time, while he was yet shut up in the court of the prison, saying,"
  - where: 'note 32:2 “Shut up for prophesying a surrender”'
    claim: 'Zedekiah isolated Jeremiah for prophesying captivity during the siege; Jeremiah called for submission to Babylon'
    key: ot-manual-24
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng
    quote: "From a strictly political point of view, one can understand why the Jewish leaders reacted so strongly against Jeremiah. In a time of national crisis, he called for surrender and submission to Babylon. But of course Jeremiah was not speaking from a political point of view; he spoke for the Lord."
  - where: 'note 32:2 “Shut up for prophesying a surrender”'
    claim: 'Zedekiah put Jeremiah in the court of the prison; he stayed until Jerusalem fell'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/38?lang=eng
    quote: "So Jeremiah abode in the court of the prison until the day that Jerusalem was taken: and he was there when Jerusalem was taken."
  - where: 'note 32:4 “Eyes to eyes, and not seeing Babylon”'
    claim: 'The manual notes the seeming contradiction with Ezekiel 12:13'
    key: ot-manual-24
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng
    quote: "For commentary on the seeming contradiction of Jeremiah’s prophecy with that of Ezekiel see Ezekiel 12:13"
  - where: 'note 32:4 “Eyes to eyes, and not seeing Babylon”'
    claim: 'Ezekiel 12:13 says Zedekiah will be brought to Babylon yet not see it'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/12?lang=eng
    quote: "I will bring him to Babylon to the land of the Chaldeans; yet shall he not see it, though he shall die there."
  - where: 'note 32:4 “Eyes to eyes, and not seeing Babylon”'
    claim: 'Jer. 52:9–11: taken to Riblah, sons slain before his eyes, eyes put out, carried to Babylon'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/52?lang=eng
    quote: "Then he put out the eyes of Zedekiah; and the king of Babylon bound him in chains, and carried him to Babylon, and put him in prison till the day of his death."
  - where: 'note 32:7 “A cousin and a duty”'
    claim: 'Jeremiah bought because he had the right as next of kin (Lev. 25:25; Ruth 4)'
    key: ot-manual-24
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng
    quote: "Jeremiah purchased his cousin’s estate because he had the right as next of kin (see Leviticus 25:25; Ruth 4)."
  - where: 'note 32:7 “A cousin and a duty”'
    claim: 'Lev. 25:25 says a kinsman may redeem what a poor brother has sold'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/lev/25?lang=eng
    quote: "If thy brother be waxen poor, and hath sold away some of his possession, and if any of his kin come to redeem it, then shall he redeem that which his brother sold."
  - where: 'note 32:7 “A cousin and a duty”'
    claim: 'In Ruth 4 a nearer kinsman declines to redeem a field and Boaz does'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/ruth/4?lang=eng
    quote: "I cannot redeem it for myself, lest I mar mine own inheritance: redeem thou my right to thyself; for I cannot redeem it."
  - where: 'setting'
    claim: 'Jeremiah was born of a priestly family in Anathoth'
    key: bd-jeremiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng
    quote: "Born of a priestly family in Anathoth, and prophesied from the 13th year of Josiah till after the downfall of Jerusalem"
  - where: 'note 32:7 “A cousin and a duty”'
    claim: 'Keil: Jeremiah perceived from Hanamel’s coming that the sale was the word of the Lord'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/32.htm
    quote: "From this Jeremiah perceived that the proposed sale was the word of the Lord, i.e., that the matter was appointed by the Lord."
  - where: 'note 32:9 “Silver weighed out”'
    claim: 'Church footnote on v9 points to Gen. 23:16, where Abraham weighs silver'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/gen/23?lang=eng
    quote: "And Abraham hearkened unto Ephron; and Abraham weighed to Ephron the silver, which he had named in the audience of the sons of Heth, four hundred shekels of silver, current money with the merchant."
  - where: 'note 32:9 “Silver weighed out”'
    claim: 'The Hebrews had no coinage before the Persian period; payments were made by weight'
    key: bd-money
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/money?lang=eng
    quote: "The Hebrews appear to have been ignorant of coinage until the Persian period. Before that time gold and silver were used as a medium of exchange, but payments were made by weight."
  - where: 'note 32:11 “A sealed deed and an open one”'
    claim: 'Two copies of the deed were made, one sealed and one open, so a perfect original would survive'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/32.htm
    quote: "two copies of the bill of purchase were prepared, one sealed up, and the other open; so that, in case the open one were lost, or were accidentally or designedly injured or defaced, a perfect original might still exist in the sealed-up copy."
  - where: 'note 32:12 “Baruch”'
    claim: 'Baruch was Jeremiah’s scribe, taken to Egypt'
    key: bd-baruch
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/baruch?lang=eng
    quote: "Jeremiah’s scribe (Jer. 32:12–13; 36); taken to Egypt (43:2–6; 45)."
  - where: 'note 32:14 “The jar”'
    claim: 'Keil: the jar protected the deeds from damp and decay so they could be used later'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/32.htm
    quote: "in order to protect them from damp, decay, and destruction, namely, because one could make use of them afterwards, when sale of property would still be taking place."
  - where: 'note 32:14 “The jar”'
    claim: 'Sealing the deed in a jar was proof of faith in the promise that fields would be possessed again'
    key: ot-manual-24
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng
    quote: "He then sealed the evidence of the purchase in a jar (see Jeremiah 32:11–12) as proof of his faith in God’s promise that “houses and fields and vineyards shall be possessed again in this land” (v. 15)."
  - where: 'note 32:14 “The jar”'
    claim: 'After Jeremiah’s death ownership would pass to his closest kin'
    key: ot-manual-24
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng
    quote: "After Jeremiah’s death, the right of ownership would pass to Jeremiah’s closest kin."
  - where: 'note 32:15 “A purchase that is a promise”'
    claim: 'The purchase was a symbolic witness of return'
    key: ot-seminary-teacher-135
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-jeremiah/lesson-135-jeremiah-30-33?lang=eng
    quote: "The Lord revealed to Jeremiah that purchasing this land was a symbolic witness that the Jews would someday return from captivity and possess the promised land once again (see Jeremiah 32:15, 43–44)."
  - where: 'note 32:17 “Nothing too hard”'
    claim: 'BDB: pala (Niphal) means be surpassing, extraordinary; be beyond one’s power, difficult to do; with “for” a person, too difficult for; Gen. 18:14 is listed under this sense'
    key: bdb
    url: https://biblehub.com/hebrew/6381.htm
    quote: "Niph`al etc., be surpassing, extraordinary … 1 be beyond one's power, difficult to do … with מן person too difficult for Deuteronomy 30:11, for ׳ י Genesis 18:14"
  - where: 'note 32:17 “Nothing too hard”'
    claim: 'Jeremiah may not have known how, but knew from testimony that it could be done'
    key: ot-seminary-teacher-135
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-jeremiah/lesson-135-jeremiah-30-33?lang=eng
    quote: "Jeremiah may not have known how the Lord would restore the Jews to their homeland, but since he had a testimony that nothing is too difficult for the Lord, he knew it could be done."
  - where: 'note 32:17 “Nothing too hard”'
    claim: 'Hebrew in Gen. 18:14 is a Niphal of pala, “too difficult”'
    key: biblehub-interlinear
    url: https://biblehub.com/interlinear/genesis/18-14.htm
    quote: "Is too difficult"
  - where: 'note 32:17 “Nothing too hard”'
    claim: 'Hebrew in Jer. 32:17 is the same Niphal imperfect, “[too] difficult”'
    key: biblehub-interlinear
    url: https://biblehub.com/interlinear/jeremiah/32-17.htm
    quote: "[too] difficult"
  - where: 'note 32:17 “Nothing too hard”'
    claim: 'Hebrew in Jer. 32:27 is the same Niphal imperfect, “[too] difficult”'
    key: biblehub-interlinear
    url: https://biblehub.com/interlinear/jeremiah/32-27.htm
    quote: "[too] difficult"
  - where: 'note 32:18 “Mercy to thousands, and the fathers’ iniquity”'
    claim: 'Exodus 34:6–7 has mercy for thousands and visiting the fathers’ iniquity on the children'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/ex/34?lang=eng
    quote: "Keeping mercy for thousands, forgiving iniquity and transgression and sin, and that will by no means clear the guilty; visiting the iniquity of the fathers upon the children, and upon the children’s children"
  - where: 'note 32:18 “Mercy to thousands, and the fathers’ iniquity”'
    claim: 'Jer. 31:29–30 says each dies for his own iniquity'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/31?lang=eng
    quote: "But every one shall die for his own iniquity: every man that eateth the sour grape, his teeth shall be set on edge."
  - where: 'note 32:25 “Buy the field, and the city given away”'
    claim: 'Keil: the promise of future purchase seemed so improbable that Jeremiah turned to prayer'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/32.htm
    quote: "seemed so improbable, in view of the impending capture and destruction of Jerusalem by the Chaldeans, that he betakes himself to the Lord in prayer"
  - where: 'note 32:29 “Incense on the roofs”'
    claim: 'Church footnote on v29 points to 2 Kgs. 23:12, altars on the roof of Ahaz’s upper chamber torn down by Josiah'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/23?lang=eng
    quote: "And the altars that were on the top of the upper chamber of Ahaz, which the kings of Judah had made, and the altars which Manasseh had made in the two courts of the house of the Lord, did the king beat down"
  - where: 'note 32:35 “Molech in the valley of Hinnom”'
    claim: 'Molech was a fire god worshipped by passing children through fire'
    key: bd-molech
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/molech?lang=eng
    quote: "The abomination of the children of Ammon, a fire god, worshipped by passing children through or burning them in fire"
  - where: 'note 32:35 “Molech in the valley of Hinnom”'
    claim: 'Topheth was in the valley of Hinnom south of Jerusalem'
    key: bd-topheth
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/topheth?lang=eng
    quote: "A spot in the valley of the son of Hinnom, south of Jerusalem, where human sacrifices were offered to Molech"
  - where: 'note 32:35 “Molech in the valley of Hinnom”'
    claim: 'Lev. 18:21 forbids it'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/lev/18?lang=eng
    quote: "And thou shalt not let any of thy seed pass through the fire to Molech, neither shalt thou profane the name of thy God: I am the Lord."
  - where: 'note 32:35 “Molech in the valley of Hinnom”'
    claim: 'Jer. 19:5 has the same disclaimer “which I commanded not… neither came it into my mind”'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/19?lang=eng
    quote: "which I commanded not, nor spake it, neither came it into my mind"
  - where: 'note 32:37 “Gathered from all countries”'
    claim: 'Church footnote on v37 points to D&C 45:69 and Jer. 16:15, topic Gathering of Israel'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/32?lang=eng
    quote: "D&C 45:69. TG Israel, Gathering of."
  - where: 'note 32:37 “Gathered from all countries”'
    claim: 'D&C 45:69 says there shall be gathered out of every nation'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/45?lang=eng
    quote: "And there shall be gathered unto it out of every nation under heaven; and it shall be the only people that shall not be at war one with another."
  - where: 'note 32:37 “Gathered from all countries”'
    claim: 'The manual: fulfillment not yet fully realized in the fulness of times; see 3 Ne. 20:29–46; 21'
    key: ot-manual-24
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng
    quote: "The fulfillment of this promise is yet to be fully realized in the dispensation of the fulness of times. (see 3 Nephi 20:29–46; 21.)"
  - where: 'note 32:37 “Gathered from all countries”'
    claim: 'In 3 Ne. 20 the Lord promises to gather them and give Jerusalem as inheritance'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/20?lang=eng
    quote: "And I will remember the covenant which I have made with my people; and I have covenanted with them that I would gather them together in mine own due time"
  - where: 'note 32:37 “Gathered from all countries”'
    claim: 'Nelson: the Book of Mormon is a sign that the Lord has commenced to gather Israel'
    key: nelson-gathering
    url: https://www.churchofjesuschrist.org/study/general-conference/2006/10/the-gathering-of-scattered-israel?lang=eng
    quote: "The coming forth of the Book of Mormon is a sign to the entire world that the Lord has commenced to gather Israel and fulfill covenants He made to Abraham, Isaac, and Jacob."
  - where: 'note 32:37 “Gathered from all countries”'
    claim: 'In October 2006 Elder Nelson was of the Quorum of the Twelve'
    key: nelson-gathering
    url: https://www.churchofjesuschrist.org/study/general-conference/2006/10/the-gathering-of-scattered-israel?lang=eng
    quote: "The Gathering of Scattered Israel By Elder Russell M. Nelson Of the Quorum of the Twelve Apostles"
  - where: 'note 32:39 “One heart, and one way”'
    claim: 'Church footnote on v39 points to the topics Conversion and Man, New, Spiritually Reborn'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/32?lang=eng
    quote: "TG Conversion; Man, New, Spiritually Reborn."
  - where: 'note 32:39 “One heart, and one way”'
    claim: 'Jer. 31:33 puts the law in their inward parts and writes it in their hearts'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/31?lang=eng
    quote: "I will put my law in their inward parts, and write it in their hearts; and will be their God, and they shall be my people."
  - where: 'note 32:40 “An everlasting covenant”'
    claim: 'Church footnote on v40 points to the topic New and Everlasting Covenant'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/32?lang=eng
    quote: "TG New and Everlasting Covenant."
  - where: 'note 32:40 “An everlasting covenant”'
    claim: 'Nelson: the new and everlasting covenant is the fulness of the gospel; new when restored, everlasting because it does not change'
    key: nelson-everlasting-covenant
    url: https://www.churchofjesuschrist.org/study/liahona/2022/10/04-the-everlasting-covenant?lang=eng
    quote: "The new and everlasting covenant is the fulness of the gospel of Jesus Christ. It includes all ordinances and covenants necessary for our salvation (see Doctrine and Covenants 66:2). It is “new” whenever the Lord renews or restores it, and it is “everlasting” because it does not change."
  - where: 'note 32:40 “An everlasting covenant”'
    claim: 'Nelson: after a covenant God never tires of helping'
    key: nelson-everlasting-covenant
    url: https://www.churchofjesuschrist.org/study/liahona/2022/10/04-the-everlasting-covenant?lang=eng
    quote: "Because of our covenant with God, He will never tire in His efforts to help us, and we will never exhaust His merciful patience with us."
  - where: 'note 32:44 “The deed repeated as a promise”'
    claim: 'The Lord’s certification that people would truly return from Babylon'
    key: ot-manual-24
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng
    quote: "The rest of chapter 32 is the Lord’s certification to Jeremiah that people would truly return from Babylon to inhabit the land (see vv. 26–44)."
  - where: 'note 32:44 “The deed repeated as a promise”'
    claim: 'Church footnote on v44: “valley” is Hebrew coastal plain; Benjamin footnote'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/32?lang=eng
    quote: "HEB coastal plain."
  - where: 'christ'
    claim: 'The return and everlasting covenant of 32:36–41 are yet to be fully realized; see 3 Ne. 20:29–46; 21'
    key: ot-manual-24
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng
    quote: "(24-17) Jeremiah 32:36–41. Restoration and an Everlasting Covenant Jeremiah clearly signaled a full return of all of the Lord’s people and the establishment of an eternal covenant with them. The fulfillment of this promise is yet to be fully realized"
  - where: 'parallels'
    claim: 'The manual points from 32:36–41 to 3 Ne. 20:29–46'
    key: ot-manual-24
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng
    quote: "The fulfillment of this promise is yet to be fully realized in the dispensation of the fulness of times. (see 3 Nephi 20:29–46; 21.)"
  - where: 'christ'
    claim: 'In 3 Ne. 20 the risen Lord says the covenant to the house of Israel will be fulfilled and Jerusalem inhabited again'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/20?lang=eng
    quote: "then shall Jerusalem be inhabited again with my people, and it shall be the land of their inheritance."
