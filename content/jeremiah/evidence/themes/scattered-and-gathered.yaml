page: scattered-and-gathered
claims:
  - where: 'opening'
    claim: 'Come, Follow Me: the scattering is only half the story'
    key: cfm-2026-thoughts-28
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/28-thoughts?lang=eng'
    quote: 'The scattering of Israel, however, is only half the story.'
  - where: 'section “One of a city, and two of a family”'
    claim: 'Jer. 3 chapter heading places the gathering in the last days'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/3?lang=eng'
    quote: 'In the last days, the Lord will gather the people of Israel, one from a city and two from a family, and bring them to Zion.'
  - where: 'section “One of a city, and two of a family”'
    claim: 'Gathering one by one, with Jer. 3:14'
    key: cfm-2026-thoughts-28
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/28-thoughts?lang=eng'
    quote: 'This happens, as Isaiah said, “one by one” (Isaiah 27:12) or, as Jeremiah predicted, “one of a city, and two of a family” (Jeremiah 3:14).'
  - where: 'section “One of a city, and two of a family”'
    claim: 'Elder Rasband on members who came to the gospel as Jeremiah prophesied'
    key: rasband-fulfillment
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2020/04/41rasband?lang=eng'
    quote: 'I was with members who have come to the gospel as Jeremiah prophesied long ago—“one of a city, and two of a family.”'
  - where: 'section “Greater than the Exodus”'
    claim: 'Bible Dictionary: the latter-day event will supersede the Exodus'
    key: bd-jeremiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng'
    quote: 'This event of the latter days will supersede in proportion even the bringing of Israel out of Egypt by Moses.'
  - where: 'section “Greater than the Exodus”'
    claim: 'President Nelson on missionaries as fishers and hunters, footnoted to Jer. 16:16'
    key: nelson-gathering
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2006/10/the-gathering-of-scattered-israel?lang=eng'
    quote: 'In many nations our missionaries have searched for those of scattered Israel; they have hunted for them “out of the holes of the rocks”; and they have fished for them as in ancient days.'
  - where: 'section “Israel and Judah together”'
    claim: 'Jer. 30:3 has several meanings'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'has several meanings. It refers to the return of the Jews after seventy years of captivity in Babylon.'
  - where: 'section “Gathered to Christ”'
    claim: 'Footnote on D&C 133:26 “north” points to Jer. 16:15'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/133?lang=eng'
    quote: 'Jer. 16:15 (14–15); D&C 110:11'
  - where: 'section “Gathered to Christ”'
    claim: 'McConkie, as printed in the manual: gathering is receiving the truth and returning to the Good Shepherd'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'The gathering of Israel consists of receiving the truth, gaining again a true knowledge of the Redeemer, and coming back into the true fold of the Good Shepherd.'
  - where: 'section “Greater than the Exodus”'
    claim: 'Jer. 16:14 in Hebrew (passive verb: “it shall no more be said”)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'וְ/לֹֽא יֵאָמֵ֥ר עוֹד֙ חַי יְהוָ֔ה אֲשֶׁ֧ר הֶעֱלָ֛ה אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל מֵ/אֶ֥רֶץ מִצְרָֽיִם'
  - where: 'section “Greater than the Exodus”'
    claim: 'Jer. 23:7 in Hebrew: identical to 16:14 except the verb (plural active: “they shall no more say”); 16:15 and 23:8 differ in wording'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'וְ/לֹא יֹ֤אמְרוּ עוֹד֙ חַי יְהוָ֔ה אֲשֶׁ֧ר הֶעֱלָ֛ה אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל מֵ/אֶ֥רֶץ מִצְרָֽיִם'
  - where: 'section “From where He drove them”'
    claim: 'Jer. 23:2: the pastors “have driven them away” (verb nadach)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'אַתֶּ֞ם הֲפִצֹתֶ֤ם אֶת צֹאנִ/י֙ וַ/תַּדִּח֔וּ/ם'
  - where: 'section “From where He drove them”'
    claim: 'Jer. 23:3: the Lord “whither I have driven them” (same verb)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'מִ/כֹּל֙ הָ/אֲרָצ֔וֹת אֲשֶׁר הִדַּ֥חְתִּי אֹתָ֖/ם שָׁ֑ם'
  - where: 'section “From where He drove them”'
    claim: 'The clause in a promise, Jer. 23:8'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'וּ/מִ/כֹּל֙ הָֽ/אֲרָצ֔וֹת אֲשֶׁ֥ר הִדַּחְתִּ֖י/ם שָׁ֑ם וְ/יָשְׁב֖וּ'
  - where: 'section “From where He drove them”'
    claim: 'The clause in a promise, Jer. 29:14'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'וּ/מִ/כָּל הַ/מְּקוֹמ֗וֹת אֲשֶׁ֨ר הִדַּ֧חְתִּי אֶתְ/כֶ֛ם שָׁ֖ם'
  - where: 'section “From where He drove them”'
    claim: 'The clause in a promise, Jer. 32:37'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'מִ/כָּל הָ֣/אֲרָצ֔וֹת אֲשֶׁ֨ר הִדַּחְתִּ֥י/ם שָׁ֛ם בְּ/אַפִּ֥/י'
  - where: 'section “From where He drove them”'
    claim: 'The clause in a threat, Jer. 8:3'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'בְּ/כָל הַ/מְּקֹמ֤וֹת הַ/נִּשְׁאָרִים֙ אֲשֶׁ֣ר הִדַּחְתִּ֣י/ם שָׁ֔ם'
  - where: 'section “From where He drove them”'
    claim: 'The clause in a threat, Jer. 29:18 (also 24:9 and 46:28, not cited on the page)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'בְּ/כָל הַ/גּוֹיִ֖ם אֲשֶׁר הִדַּחְתִּ֥י/ם שָֽׁם'
  - where: 'section “Israel and Judah together”'
    claim: 'Manual on Jer. 3:18–19: the lost tribes return from the north and Judah is reunited'
    key: ot-manual-23
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng'
    quote: 'The gathering of Israel, including the return of the lost tribes from the north and the reuniting of the children of Judah in the lands of their inheritance'
  - where: 'section “Israel and Judah together”'
    claim: 'Manual on Jer. 50–51 (citing 50:4–5): Israel was not in the return from Babylon; Israel and Judah restored together in the last days'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'For example, Israel did not participate in the return from Babylon, but Israel and Judah will be restored together in the last days.'
  - where: 'section “Gathered to Christ”'
    claim: 'Manual on Jer. 30:11–24: the Lord Jesus Christ saves'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'It is the Lord Jesus Christ who saves. He is Israel’s Savior and Redeemer.'
  - where: 'section “Gathered to Christ”'
    claim: 'McConkie, as printed in the manual: then gathered and established in lands of promise'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'and then being ‘gathered’ and ‘established’ in various ‘lands of promise.'
