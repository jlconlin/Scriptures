page: root-and-plant
claims:
  - where: 'section “Six verbs”'
    claim: '1:10 has all six verbs of the commission (natash, nathats, abad, haras, banah, nata)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'רְאֵ֞ה הִפְקַדְתִּ֣י/ךָ הַ/יּ֣וֹם הַ/זֶּ֗ה עַל הַ/גּוֹיִם֙ וְ/עַל הַ/מַּמְלָכ֔וֹת לִ/נְת֥וֹשׁ וְ/לִ/נְת֖וֹץ וּ/לְ/הַאֲבִ֣יד וְ/לַ/הֲר֑וֹס לִ/בְנ֖וֹת וְ/לִ/נְטֽוֹעַ'
  - where: 'section “Six verbs”'
    claim: '31:28 has all six verbs together (with a seventh, "afflict")'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'וְ/הָיָ֞ה כַּ/אֲשֶׁ֧ר שָׁקַ֣דְתִּי עֲלֵי/הֶ֗ם לִ/נְת֧וֹשׁ וְ/לִ/נְת֛וֹץ וְ/לַ/הֲרֹ֖ס וּ/לְ/הַאֲבִ֣יד וּ/לְ/הָרֵ֑עַ כֵּ֣ן אֶשְׁקֹ֧ד עֲלֵי/הֶ֛ם לִ/בְנ֥וֹת וְ/לִ/נְט֖וֹעַ נְאֻם יְהוָֽה'
  - where: 'section “Six verbs”'
    claim: '12:14 has natash (plucked out) — one of the groups of the verbs'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'כֹּ֣ה אָמַ֣ר יְהוָ֗ה עַל כָּל שְׁכֵנַ/י֙ הָֽ/רָעִ֔ים הַ/נֹּֽגְעִים֙ בַּֽ/נַּחֲלָ֔ה אֲשֶׁר הִנְחַ֥לְתִּי אֶת עַמִּ֖/י אֶת יִשְׂרָאֵ֑ל הִנְ/נִ֤י נֹֽתְשָׁ/ם֙ מֵ/עַ֣ל אַדְמָתָ֔/ם וְ/אֶת בֵּ֥ית יְהוּדָ֖ה אֶתּ֥וֹשׁ מִ/תּוֹכָֽ/ם'
  - where: 'section “Six verbs”'
    claim: '12:17 has natash and abad — one of the groups of the verbs'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'וְ/אִ֖ם לֹ֣א יִשְׁמָ֑עוּ וְ/נָ֨תַשְׁתִּ֜י אֶת הַ/גּ֥וֹי הַ/ה֛וּא נָת֥וֹשׁ וְ/אַבֵּ֖ד נְאֻם יְהוָֽה'
  - where: 'section “Six verbs”'
    claim: '18:7 has natash, nathats and abad'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'רֶ֣גַע אֲדַבֵּ֔ר עַל גּ֖וֹי וְ/עַל מַמְלָכָ֑ה לִ/נְת֥וֹשׁ וְ/לִ/נְת֖וֹץ וּֽ/לְ/הַאֲבִֽיד'
  - where: 'section “Six verbs”'
    claim: '18:9 has banah and nata'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'וְ/רֶ֣גַע אֲדַבֵּ֔ר עַל גּ֖וֹי וְ/עַל מַמְלָכָ֑ה לִ/בְנֹ֖ת וְ/לִ/נְטֹֽעַ'
  - where: 'section “Six verbs”'
    claim: '24:6 has banah, haras (negated), nata and natash (negated)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'וְ/שַׂמְתִּ֨י עֵינִ֤/י עֲלֵי/הֶם֙ לְ/טוֹבָ֔ה וַ/הֲשִׁבֹתִ֖י/ם עַל הָ/אָ֣רֶץ הַ/זֹּ֑את וּ/בְנִיתִי/ם֙ וְ/לֹ֣א אֶהֱרֹ֔ס וּ/נְטַעְתִּ֖י/ם וְ/לֹ֥א אֶתּֽוֹשׁ'
  - where: 'section “Six verbs”'
    claim: '31:40 has natash and haras (negated)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'קֹ֖דֶשׁ לַֽ/יהוָ֑ה לֹֽא יִנָּתֵ֧שׁ וְֽ/לֹא יֵהָרֵ֛ס ע֖וֹד לְ/עוֹלָֽם'
  - where: 'section “Six verbs”'
    claim: '42:10 has banah, haras (negated), nata and natash (negated)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'אִם שׁ֤וֹב תֵּֽשְׁבוּ֙ בָּ/אָ֣רֶץ הַ/זֹּ֔את וּ/בָנִ֤יתִי אֶתְ/כֶם֙ וְ/לֹ֣א אֶהֱרֹ֔ס וְ/נָטַעְתִּ֥י אֶתְ/כֶ֖ם וְ/לֹ֣א אֶתּ֑וֹשׁ כִּ֤י נִחַ֨מְתִּי֙ אֶל הָ֣/רָעָ֔ה אֲשֶׁ֥ר עָשִׂ֖יתִי לָ/כֶֽם'
  - where: 'section “Six verbs”'
    claim: '45:4 has banah, haras, nata and natash'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'כֹּ֣ה תֹּאמַ֣ר אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנֵּ֤ה אֲשֶׁר בָּנִ֨יתִי֙ אֲנִ֣י הֹרֵ֔ס וְ/אֵ֥ת אֲשֶׁר נָטַ֖עְתִּי אֲנִ֣י נֹתֵ֑שׁ וְ/אֶת כָּל הָ/אָ֖רֶץ הִֽיא'
  - where: 'section “Six verbs”'
    claim: 'The verb of "throw down" in 1:10 (haras) is KJV "pull down" in 24:6: Hebrew form in 1:10'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'וְ/לַ/הֲר֑וֹס'
  - where: 'section “Six verbs”'
    claim: 'The verb of "throw down" in 1:10 (haras) is KJV "pull down" in 24:6: Hebrew form in 24:6'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'וְ/לֹ֣א אֶהֱרֹ֔ס'
  - where: 'section “Six verbs”'
    claim: 'The verb of "throw down" in 1:10 (haras) is KJV "break down" in 45:4: Hebrew form in 45:4'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'אֲנִ֣י הֹרֵ֔ס'
  - where: 'section “Six verbs”'
    claim: 'The verb in 1:12 (shaqad, KJV "hasten") means keep watch of, be wakeful over; the Lord is subject, "to perform it" in 1:12'
    key: bdb
    url: 'https://biblehub.com/hebrew/8245.htm'
    quote: 'keep watch of, be wakeful over, ׳ י subject'
  - where: 'section “Six verbs”'
    claim: 'The verb in 1:12 is shoqed (shaqad)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'וַ/יֹּ֧אמֶר יְהוָ֛ה אֵלַ֖/י הֵיטַ֣בְתָּ לִ/רְא֑וֹת כִּֽי שֹׁקֵ֥ד אֲנִ֛י עַל דְּבָרִ֖/י לַ/עֲשֹׂתֽ/וֹ'
  - where: 'section “Torn down”'
    claim: '45:4 uses four of the six verbs (build, throw down, plant, root out)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'כֹּ֣ה תֹּאמַ֣ר אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנֵּ֤ה אֲשֶׁר בָּנִ֨יתִי֙ אֲנִ֣י הֹרֵ֔ס וְ/אֵ֥ת אֲשֶׁר נָטַ֖עְתִּי אֲנִ֣י נֹתֵ֑שׁ וְ/אֶת כָּל הָ/אָ֖רֶץ הִֽיא'
  - where: 'section “Torn down”'
    claim: '39:8: the narrator''s verb for the Chaldeans breaking down the walls is nathats'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'וְ/אֶת בֵּ֤ית הַ/מֶּ֨לֶךְ֙ וְ/אֶת בֵּ֣ית הָ/עָ֔ם שָׂרְפ֥וּ הַ/כַּשְׂדִּ֖ים בָּ/אֵ֑שׁ וְ/אֶת חֹמ֥וֹת יְרוּשָׁלִַ֖ם נָתָֽצוּ'
  - where: 'section “Torn down”'
    claim: 'The verb nathats is the one rendered "pull down" in 1:10'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'וְ/לִ/נְת֖וֹץ'
  - where: 'section “Torn down”'
    claim: '44:27 "watch over them for evil" uses shoqed, the verb of 1:12 (cited in the section “Built and planted”)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'הִנְ/נִ֨י שֹׁקֵ֧ד עֲלֵי/הֶ֛ם לְ/רָעָ֖ה וְ/לֹ֣א לְ/טוֹבָ֑ה וְ/תַמּוּ֩ כָל אִ֨ישׁ יְהוּדָ֜ה אֲשֶׁ֧ר בְּ/אֶֽרֶץ מִצְרַ֛יִם בַּ/חֶ֥רֶב וּ/בָ/רָעָ֖ב עַד כְּלוֹתָֽ/ם'
  - where: 'section “Built and planted”'
    claim: '31:28 has the verb shaqad twice, of the Lord watching to pluck up and to build'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'כַּ/אֲשֶׁ֧ר שָׁקַ֣דְתִּי עֲלֵי/הֶ֗ם … כֵּ֣ן אֶשְׁקֹ֧ד עֲלֵי/הֶ֛ם'
  - where: 'section “Built and planted”'
    claim: 'One reading: 31:28 turns from the first part of the commission to the second'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/31.htm'
    quote: 'The prophet has hitherto been engaged in fulfilling, against the faithless people, the first part of the commission given him by the Lord when he was called to his office (Jeremiah 1:10); hereafter, he will be engaged in building up.'
  - where: 'section “What is planted”'
    claim: 'The Church''s Come, Follow Me asks what could be built or planted and answers: the Branch of righteousness, the promised Messiah'
    key: cfm-ot-2026-44
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/44?lang=eng'
    quote: 'What could be built or planted in the desolate ruins left by the rebellion of the covenant people?… The answer lies in “the Branch of righteousness” (Jeremiah 33:15), the promised Messiah.'
  - where: 'section “What is planted”'
    claim: 'The same answer: he brings a new covenant (Jer. 31:31)'
    key: cfm-ot-2026-44
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/44?lang=eng'
    quote: 'He brings “a new covenant” (Jeremiah 31:31)'
  - where: 'section “What is planted”'
    claim: 'Connection made by this page: set beside 1:10, the Branch of 33:15 is a sprout the Lord causes to grow'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/33?lang=eng'
    quote: 'will I cause the Branch of righteousness to grow up unto David'
  - where: 'section “What is planted”'
    claim: 'The Hebrew word for Branch (tsemach) at Jer. 33:15: a future ruler under the figure of a sprout from the Davidic tree'
    key: bdb
    url: 'https://biblehub.com/hebrew/6780.htm'
    quote: 'future ruler, under figure of sprout from Davidic tree'
  - where: 'section “The condition”'
    claim: 'Footnote on “repent” in Jer. 18:8: or relent regarding the punishment'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/18?lang=eng'
    quote: 'relent regarding the punishment'
  - where: 'section “What is planted”'
    claim: 'Connection made by this page: the promise to build and plant (31:27–28) and the new covenant (31:31) stand side by side and both open “Behold, the days come, saith the LORD”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/31?lang=eng'
    quote: 'Behold, the days come, saith the Lord, that I will make a new covenant'
  - where: 'section “What is planted”'
    claim: 'Connection made by this page: Matt. 15:13, “planted… rooted up,” set beside the plant and root out of Jer. 1:10'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/15?lang=eng'
    quote: 'Every plant, which my heavenly Father hath not planted, shall be rooted up.'
  - where: 'section “What is planted”'
    claim: 'Greek of Matt. 15:13: ephyteusen (planted), ekrizōthēsetai (shall be rooted up)'
    key: greek-nt
    url: 'https://biblehub.com/text/matthew/15-13.htm'
    quote: 'Πᾶσα φυτεία ἣν οὐκ ἐφύτευσεν ὁ Πατήρ μου ὁ οὐράνιος ἐκριζωθήσεται'
  - where: 'section “What is planted”'
    claim: 'Septuagint of Jer. 1:10: ekrizoun (root out) and kataphyteuein (plant), the same verb stems as Matt. 15:13'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sepd/jeremiah/1.htm'
    quote: 'ἐκριζοῦν καὶ κατασκάπτειν καὶ ἀπολλύειν καὶ ἀνοικοδομεῖν καὶ καταφυτεύειν'
  - where: 'section “What is planted”'
    claim: 'Septuagint of Jer. 2:21: “I planted thee a fruitful vine, wholly true (alēthinēn)”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sepd/jeremiah/2.htm'
    quote: 'ἐγὼ δὲ ἐφύτευσά σε ἄμπελον καρποφόρον πᾶσαν ἀληθινήν'
  - where: 'section “What is planted”'
    claim: 'Greek of John 15:1: hē ampelos hē alēthinē, “the true vine”'
    key: greek-nt
    url: 'https://biblehub.com/text/john/15-1.htm'
    quote: 'Ἐγώ εἰμι ἡ ἄμπελος ἡ ἀληθινή'
  - where: 'section “What is planted”'
    claim: 'Connection made by this page: John 15:1, “I am the true vine,” set beside the vine the Lord planted in Jer. 2:21 (a “true” vine in the Septuagint)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/15?lang=eng'
    quote: 'I am the true vine, and my Father is the husbandman.'
