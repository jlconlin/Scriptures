page: cup-of-fury
claims:
  - where: 'section “The cup handed round”'
    claim: 'The order of the cup: Judah and its cities, then Egypt, the nations of the west and east, and Babylonia'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'Beginning in Jerusalem and the cities of Judah, the bitter cup will be drunk by Egypt, the nations of the west and east, and Babylonia.'
  - where: 'section “Babylon, the cup and the drinker”'
    claim: 'The Church’s footnote on “Sheshach” in Jer. 25:26 points to Jer. 51:41'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/25?lang=eng'
    quote: 'Jer. 51:41.'
  - where: 'section “Babylon, the cup and the drinker”'
    claim: 'Lexicon: Babylon is a cup by bold metaphor (Jer. 51:7)'
    key: bdb
    url: 'https://biblehub.com/hebrew/3563.htm'
    quote: 'by bold metaphor Babylon is such a cup'
  - where: 'section “Babylon, the cup and the drinker”'
    claim: 'Jer. 25:16 has the Hebrew verb for “mad” (hithollel); the same Hithpoel is in 51:7 (and in 46:9 and 50:38, not cited on the page)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'וְ/שָׁת֕וּ וְ/הִֽתְגֹּֽעֲשׁ֖וּ וְ/הִתְהֹלָ֑לוּ מִ/פְּנֵ֣י הַ/חֶ֔רֶב אֲשֶׁ֛ר אָנֹכִ֥י שֹׁלֵ֖חַ בֵּינֹתָֽ/ם'
  - where: 'section “Babylon, the cup and the drinker”'
    claim: 'Jer. 51:7 has the same verb for “mad”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'כּוֹס זָהָ֤ב בָּבֶל֙ בְּ/יַד יְהוָ֔ה מְשַׁכֶּ֖רֶת כָּל הָ/אָ֑רֶץ מִ/יֵּינָ/הּ֙ שָׁת֣וּ גוֹיִ֔ם עַל כֵּ֖ן יִתְהֹלְל֥וּ גוֹיִֽם'
  - where: 'section “The cup of the wrath of God”'
    claim: 'Footnote on “cup” in Mosiah 3:26 includes Jer. 25:15'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/3?lang=eng'
    quote: 'Ps. 75:8; Jer. 25:15; Lam. 4:21'
  - where: 'section “The cup of the wrath of God”'
    claim: 'Footnote on “cup” in D&C 29:17 is Jer. 25:15'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/29?lang=eng'
    quote: 'Jer. 25:15'
  - where: 'section “The cup of the wrath of God”'
    claim: 'Footnote on “blood” in D&C 29:17 is D&C 19:17'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/29?lang=eng'
    quote: 'D&C 19:17 (16–18)'
  - where: 'section “The cup He drank”'
    claim: 'Footnote on “cup” in Matt. 26:39 points to Mark, Mosiah 3:7 and D&C 19:18, not to Jeremiah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/26?lang=eng'
    quote: 'Mark 14:36 (32–42); Mosiah 3:7; D&C 19:18 (16–19).'
  - where: 'section “The cup He drank”'
    claim: 'Footnote on John 18:11 points to 3 Ne. 11:11'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/18?lang=eng'
    quote: '3 Ne. 11:11.'
  - where: 'section “The cup He drank”'
    claim: 'Footnote on 3 Ne. 11:11 points to John 18:11'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/11?lang=eng'
    quote: 'John 18:11'
  - where: 'section “The cup He drank”'
    claim: 'Footnote on D&C 19:18 points to Luke 22:42'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/19?lang=eng'
    quote: 'Luke 22:42 (42–44)'
  - where: 'section “The cup He drank”'
    claim: 'A Latter-day Saint scholar hears in the Savior’s words in 3 Ne. 11:11 an old title used by Isaiah and Jeremiah'
    key: tolley-christ-cup
    url: 'https://rsc.byu.edu/book-mormon-insights/christ-cup'
    quote: 'One title that must have resonated with his Nephite audience was an old title used by ancient Israelite prophets like Isaiah and Jeremiah.'
  - where: 'section “Babylon, the cup and the drinker”'
    claim: 'Jer. 51:39: the Lord makes Babylon drunk (hishkartim), the verb of 51:7 “made all the earth drunken” (meshakkeret; row above) and of 25:27 “be drunken”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'וְ/הִשְׁכַּרְתִּי/ם֙ לְמַ֣עַן יַעֲלֹ֔זוּ'
  - where: 'section “Babylon, the cup and the drinker”'
    claim: 'Jer. 25:27: “Drink ye, and be drunken” (same verb)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'שְׁת֤וּ וְ/שִׁכְרוּ֙ וּ/קְי֔וּ'
  - where: 'section “Babylon, the cup and the drinker”'
    claim: 'Connection made by this page: Rev. 16:19, where great Babylon is given the cup of God’s wrath, set beside Jer. 51:39, 57, where Babylon is made drunk'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/16?lang=eng'
    quote: 'great Babylon came in remembrance before God, to give unto her the cup of the wine of the fierceness of his wrath'
  - where: 'section “The cup He drank”'
    claim: 'Footnote on “suffer” in D&C 19:17 includes D&C 29:17'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/19?lang=eng'
    quote: 'D&C 29:17'
  - where: 'section “The cup He drank”'
    claim: 'The same scholar: the speaker at Bountiful was the one who had taken their cup'
    key: tolley-christ-cup
    url: 'https://rsc.byu.edu/book-mormon-insights/christ-cup'
    quote: 'the man standing before them was the one who had taken their cup and removed the pain and sorrow'
  - where: 'section “The cup He drank”'
    claim: 'Connection made by this page: the nations told “Ye shall certainly drink” (Jer. 25:28) set beside the Savior, who asks that the cup pass and then drinks it (Matt. 26:39; John 18:11; 3 Ne. 11:11; D&C 19:16–18); a comparison of the words, not an identification of the two cups'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/25?lang=eng'
    quote: 'Ye shall certainly drink'
  - where: 'section “The cup He drank”'
    claim: 'Connection made by this page: John 18:11 beside Jer. 25:28'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/18?lang=eng'
    quote: 'the cup which my Father hath given me, shall I not drink it?'
