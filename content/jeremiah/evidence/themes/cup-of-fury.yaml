page: cup-of-fury
claims:
  # ---------- opening ----------
  - where: 'opening'
    claim: 'Jer. 25:9, 15, 18, 26, 28 as quoted; footnote 25:26b “Sheshach”: Jer. 51:41'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/25?lang=eng'
    quote: 'Take the wine cup of this fury at my hand, and cause all the nations, to whom I send thee, to drink it.'
  - where: 'opening'
    claim: 'Jer. 25:26 “the king of Sheshach shall drink after them”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/25?lang=eng'
    quote: 'and the king of Sheshach shall drink after them.'
  - where: 'opening'
    claim: 'Jer. 51:7, 39, 57 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/51?lang=eng'
    quote: 'Babylon hath been a golden cup in the Lord’s hand, that made all the earth drunken: the nations have drunken of her wine; therefore the nations are mad.'
  - where: 'opening'
    claim: 'Keil on 25:18–26: the enumeration begins with Judah, “last of all the king of Babylon”'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/25.htm'
    quote: 'last of all the king of Babylon'
  - where: 'opening'
    claim: 'Keil, note on 25:26: “By ‘shall drink after them’ Babylon is sufficiently distinguished from the other kings and countries mentioned”'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/25.htm'
    quote: 'Babylon is sufficiently distinguished from the other kings and countries mentioned'
  - where: 'opening'
    claim: 'Ellicott on 25:26: Sheshach “is, from its position, the culminating point of the whole prophecy”'
    key: ellicott-jeremiah
    url: 'https://biblehub.com/commentaries/ellicott/jeremiah/25.htm'
    quote: 'the culminating point of the whole prophecy'
  - where: 'opening'
    claim: 'Barnes on Hab. 2:16: the cup “had gone round the circuit of the nations whom God had employed him to chasten, and now, the circle completed, it should be brought round to himself”; cites Jer. 25:26'
    key: barnes-habakkuk
    url: 'https://biblehub.com/commentaries/barnes/habakkuk/2.htm'
    quote: 'It had gone round the circuit of the nations whom God had employed him to chasten, and now, the circle completed, it should be brought round to himself'
  - where: 'opening'
    claim: 'Connection made by this page: the golden cup of 51:7 and the drinking of 51:39, 57 are set on one line with the list of 25:18–26, so that Babylon is instrument, cup and drinker in turn, and the one hand never handed the cup is the Lord’s (25:15; 51:7); the Student Manual and Barnes give the Judah-to-Babylon movement, none joins 51:7 to 51:39 and 57 in this way'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/25?lang=eng'
    quote: 'Nebuchadrezzar the king of Babylon, my servant'
  - where: 'opening'
    claim: 'D&C 29:17 as quoted; footnote 17c “cup”: Jer. 25:15; footnote 17e “blood”: D&C 19:17 (16–18)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/29?lang=eng'
    quote: 'for the cup of mine indignation is full; for behold, my blood shall not cleanse them if they hear me not.'
  - where: 'opening'
    claim: 'D&C 19:16 “that they might not suffer if they would repent”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/19?lang=eng'
    quote: 'that they might not suffer if they would repent'
  # ---------- section “Take the wine cup of this fury at my hand” ----------
  - where: 'section “Take the wine cup of this fury at my hand”'
    claim: 'Keil on 25:17: “the cup is no material cup, and the drinking of it no act of the outer, physical reality”; performed “when he announces what he is commanded”'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/25.htm'
    quote: 'the cup is no material cup, and the drinking of it no act of the outer, physical reality'
  - where: 'section “Take the wine cup of this fury at my hand”'
    claim: 'Keil: “is performed by Jeremiah when he announces what he is commanded”'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/25.htm'
    quote: 'is performed by Jeremiah when he announces what he is commanded'
  - where: 'section “Take the wine cup of this fury at my hand”'
    claim: 'Barnes on 25:17: “Not actually offering the wine-cup … but publicly proclaiming this prophecy in Jerusalem”'
    key: barnes-jeremiah
    url: 'https://biblehub.com/commentaries/barnes/jeremiah/25.htm'
    quote: 'but publicly proclaiming this prophecy in Jerusalem'
  - where: 'section “Take the wine cup of this fury at my hand”'
    claim: 'Parry lists Jer. 25:15–29 among symbolic actions as prophecy: “Many nations will be destroyed by the sword”'
    key: parry-symbolic-action
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/symbolic-action-prophecy-old-testament'
    quote: 'Many nations will be destroyed by the sword'
  - where: 'section “Take the wine cup of this fury at my hand”'
    claim: 'Jer. 25:16, 27 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/25?lang=eng'
    quote: 'And they shall drink, and be moved, and be mad, because of the sword that I will send among them.'
  - where: 'section “Take the wine cup of this fury at my hand”'
    claim: 'Jer. 13:13 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/13?lang=eng'
    quote: 'and all the inhabitants of Jerusalem, with drunkenness.'
  - where: 'section “Take the wine cup of this fury at my hand”'
    claim: '13:13 šikkārôn (H7943), the only use of the noun in Jeremiah'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'שִׁכָּרֽוֹן'
  - where: 'section “Take the wine cup of this fury at my hand”'
    claim: 'ḥēmâ (H2534) 17 times in 16 verses of Jeremiah; joined to kôs only at 25:15'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'הַ/חֵמָ֛ה'
  - where: 'section “Take the wine cup of this fury at my hand”'
    claim: 'Cambridge on 25:15: “The likening of disaster to a bitter and intoxicating draught is frequent in the Bible.”'
    key: cambridge-jeremiah
    url: 'https://biblehub.com/commentaries/cambridge/jeremiah/25.htm'
    quote: 'The likening of disaster to a bitter and intoxicating draught is frequent in the Bible.'
  - where: 'section “Take the wine cup of this fury at my hand”'
    claim: 'Footnote Isa. 51:17a “cup”: Jer. 25:15; 51:23a “hand”: Jer. 25:17'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/51?lang=eng'
    quote: 'which hast drunk at the hand of the Lord the cup of his fury'
  - where: 'section “Take the wine cup of this fury at my hand”'
    claim: 'Footnote Lam. 4:21c “cup”: Jer. 25:15 (15–16)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lam/4?lang=eng'
    quote: 'the cup also shall pass through unto thee'
  - where: 'section “Take the wine cup of this fury at my hand”'
    claim: 'Footnote Ezek. 23:31 “cup”: Jer. 25:15'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/23?lang=eng'
    quote: 'therefore will I give her cup into thine hand.'
  - where: 'section “Take the wine cup of this fury at my hand”'
    claim: 'Footnote Obad. 1:16a “drunk”: Jer. 25:28 (15–33); 49:12 (7–12)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/obad/1?lang=eng'
    quote: 'so shall all the heathen drink continually'
  # ---------- section “To wit, Jerusalem” ----------
  - where: 'section “To wit, Jerusalem”'
    claim: 'Jer. 25:9, 12, 18, 29 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/25?lang=eng'
    quote: 'For, lo, I begin to bring evil on the city which is called by my name, and should ye be utterly unpunished?'
  - where: 'section “To wit, Jerusalem”'
    claim: 'Jer. 25:12 “I will punish the king of Babylon, and that nation”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/25?lang=eng'
    quote: 'that I will punish the king of Babylon, and that nation'
  - where: 'section “To wit, Jerusalem”'
    claim: 'Student Manual 24-8: “Beginning in Jerusalem and the cities of Judah, the bitter cup will be drunk by Egypt, the nations of the west and east, and Babylonia.”; sends the reader to its Isa. 51:17–23 commentary'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'Beginning in Jerusalem and the cities of Judah, the bitter cup will be drunk by Egypt, the nations of the west and east, and Babylonia.'
  - where: 'section “To wit, Jerusalem”'
    claim: 'Isa. 51:17, 22–23 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/51?lang=eng'
    quote: 'But I will put it into the hand of them that afflict thee'
  - where: 'section “To wit, Jerusalem”'
    claim: 'Student Manual 17-15 on Isa. 51:22–23: “the cup of fury shall be given to those who have trampled on and walked over the covenant people of the Lord. It will then be their turn to know suffering.”'
    key: ot-manual-17
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-17?lang=eng'
    quote: 'the cup of fury shall be given to those who have trampled on and walked over the covenant people of the Lord. It will then be their turn to know suffering.'
  # ---------- section “Ye shall certainly drink” ----------
  - where: 'section “Ye shall certainly drink”'
    claim: 'Jer. 25:28 as quoted; šātōh tištû, infinitive absolute with the imperfect'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'שָׁת֥וֹ'
  - where: 'section “Ye shall certainly drink”'
    claim: 'Jer. 25:28 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/25?lang=eng'
    quote: 'if they refuse to take the cup at thine hand to drink, then shalt thou say unto them, Thus saith the Lord of hosts; Ye shall certainly drink.'
  - where: 'section “Ye shall certainly drink”'
    claim: 'Barnes on 25:27: “The metaphors denote the helplessness to which the nations are reduced by drinking the wine-cup of fury”'
    key: barnes-jeremiah
    url: 'https://biblehub.com/commentaries/barnes/jeremiah/25.htm'
    quote: 'The metaphors denote the helplessness to which the nations are reduced by drinking the wine-cup of fury'
  - where: 'section “Ye shall certainly drink”'
    claim: 'Jer. 49:12 as quoted; footnote 49:12a “drink”: Obad. 1:16'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/49?lang=eng'
    quote: 'they whose judgment was not to drink of the cup have assuredly drunken; and art thou he that shall altogether go unpunished?'
  - where: 'section “Ye shall certainly drink”'
    claim: 'Footnote Jer. 25:28a “drink”: Obad. 1:16'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/25?lang=eng'
    quote: 'Ye shall certainly drink.'
  - where: 'section “Ye shall certainly drink”'
    claim: 'Jer. 48:26 as quoted; hašKîrûhû, Hiphil of šākar (H7937), the verb of 25:27 (Qal), 51:7 (Piel participle), 51:39 and 51:57 (Hiphil)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/48?lang=eng'
    quote: 'Make ye him drunken: for he magnified himself against the Lord'
  - where: 'section “Ye shall certainly drink”'
    claim: '48:26 hašKîrûhû (H7937)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'הַשְׁכִּירֻ֕/הוּ'
  # ---------- section “The king of Sheshach shall drink after them” ----------
  - where: 'section “The king of Sheshach shall drink after them”'
    claim: 'Keil on 25:26: Sheshach “is, according to Jeremiah 51:41, a name for Babylon”; formed by Atbash'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/25.htm'
    quote: 'a name for Babylon, as Jerome states'
  - where: 'section “The king of Sheshach shall drink after them”'
    claim: 'Cambridge on 25:26: “Sheshach=Babel (Babylon) in accordance with a system of cypher writing”; “This clause also is absent from LXX, and doubtless is a later insertion.”'
    key: cambridge-jeremiah
    url: 'https://biblehub.com/commentaries/cambridge/jeremiah/25.htm'
    quote: 'This clause also is absent from LXX, and doubtless is a later insertion.'
  - where: 'section “The king of Sheshach shall drink after them”'
    claim: 'Cambridge on 25:26: Atbash “consists in substituting the last letter of the Hebrew alphabet for the first, the last but one for the second and so on”'
    key: cambridge-jeremiah
    url: 'https://biblehub.com/commentaries/cambridge/jeremiah/25.htm'
    quote: 'consists in substituting the last letter of the Hebrew alphabet for the first, the last but one for the second and so on'
  - where: 'section “The king of Sheshach shall drink after them”'
    claim: 'Ellicott on 25:26: ATBASH “giving SHeSHaCH as an equivalent for BaBeL”'
    key: ellicott-jeremiah
    url: 'https://biblehub.com/commentaries/ellicott/jeremiah/25.htm'
    quote: 'thus giving SHeSHaCH as an equivalent for BaBeL'
  - where: 'section “The king of Sheshach shall drink after them”'
    claim: 'BDB on Sheshach (H8347): Babylon by Atbash; at 25:26 “perhaps gloss”'
    key: bdb
    url: 'https://biblehub.com/hebrew/8347.htm'
    quote: 'and hence (perhaps gloss) Jeremiah 25:26'
  - where: 'section “The king of Sheshach shall drink after them”'
    claim: 'Bowen: Jeremiah renames Babel “Sheshach” by Atbash; “These symbolic names constitute symbols of the Lord’s justice overtaking the Babylonians”'
    key: bowen-ominous-onomastics
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/ominous-onomastics'
    quote: 'These symbolic names constitute symbols of the Lord’s justice overtaking the Babylonians'
  - where: 'section “The king of Sheshach shall drink after them”'
    claim: 'Jer. 51:41 as quoted; footnote 51:41a “Sheshach”: Jer. 25:26'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/51?lang=eng'
    quote: 'How is Sheshach taken! and how is the praise of the whole earth surprised! how is Babylon become an astonishment among the nations!'
  - where: 'section “The king of Sheshach shall drink after them”'
    claim: 'Keil, note on 25:26: the critics’ reasons for calling the clause a gloss “are valueless”'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/25.htm'
    quote: 'Both reasons are valueless.'
  - where: 'section “The king of Sheshach shall drink after them”'
    claim: 'BDB on kôs: “by bold metaphor Babylon is such a cup” (Jer. 51:7)'
    key: bdb
    url: 'https://biblehub.com/hebrew/3563.htm'
    quote: 'by bold metaphor Babylon is such a cup'
  - where: 'section “The king of Sheshach shall drink after them”'
    claim: 'kôs (H3563) in Jeremiah: 16:7, 25:15, 25:17, 25:28, 35:5, 49:12, 51:7; 51:7 the only verse where a nation is the cup; Zech. 12:2 “cup of trembling” is sap (H5592), a basin'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'כּוֹס'
  - where: 'section “The king of Sheshach shall drink after them”'
    claim: 'Zech. 12:2 sap (H5592a) “cup of trembling,” not kôs'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Zech.xml'
    quote: 'סַף'
  - where: 'section “The king of Sheshach shall drink after them”'
    claim: '25:16 wĕhithōlālû and 51:7 yitholĕlû, the root hālal (H1984) “be mad”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'יִתְהֹלְל֥וּ'
  - where: 'section “The king of Sheshach shall drink after them”'
    claim: 'Keil on 51:7: “The figure of the cup refers us back to Jeremiah 25:15., where, however, it is applied in a different way”; gold = “the splendour and glory of Nebuchadnezzar’s dominion”; “used by Him as His instrument for pouring out His wrath to the nations”'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/51.htm'
    quote: 'used by Him as His instrument for pouring out His wrath to the nations'
  - where: 'section “The king of Sheshach shall drink after them”'
    claim: 'Keil on 51:7: “where, however, it is applied in a different way”; “the splendour and glory of Nebuchadnezzar’s dominion”'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/51.htm'
    quote: 'where, however, it is applied in a different way'
  - where: 'section “The king of Sheshach shall drink after them”'
    claim: 'Barnes on 51:7: “the wine whereof she makes the nations drink is the wrath of God”'
    key: barnes-jeremiah
    url: 'https://biblehub.com/commentaries/barnes/jeremiah/51.htm'
    quote: 'the wine whereof she makes the nations drink is the wrath of God'
  - where: 'section “The king of Sheshach shall drink after them”'
    claim: 'Cambridge on 51:7: the wine “denotes the influence for evil which her brilliance and luxury have upon the nations”'
    key: cambridge-jeremiah
    url: 'https://biblehub.com/commentaries/cambridge/jeremiah/51.htm'
    quote: 'denotes the influence for evil which her brilliance and luxury have upon the nations'
  - where: 'section “The king of Sheshach shall drink after them”'
    claim: 'Ellicott on 51:7: the wine “was poisoned, intoxicating men with wild ambitions and dark idolatries”'
    key: ellicott-jeremiah
    url: 'https://biblehub.com/commentaries/ellicott/jeremiah/51.htm'
    quote: 'was poisoned, intoxicating men with wild ambitions and dark idolatries'
  - where: 'section “The king of Sheshach shall drink after them”'
    claim: 'Jer. 51:39, 57 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/51?lang=eng'
    quote: 'In their heat I will make their feasts, and I will make them drunken, that they may rejoice, and sleep a perpetual sleep, and not wake, saith the Lord.'
  - where: 'section “The king of Sheshach shall drink after them”'
    claim: 'šākar (H7937) in Jeremiah: 25:27 (Qal), 48:26 (Hiphil), 51:7 (Piel participle mĕšakkeret), 51:39 and 51:57 (Hiphil, the LORD subject); no kôs in 51:39 or 51:57'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'וְ/הִשְׁכַּרְתִּי/ם֙'
  - where: 'section “The king of Sheshach shall drink after them”'
    claim: '51:7 mĕšakkeret, 51:57 wĕhišKartî'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'מְשַׁכֶּ֖רֶת'
  - where: 'section “The king of Sheshach shall drink after them”'
    claim: 'Ellicott on 51:39: “The wine cup which He would give them would be that of His wrath (Jeremiah 25:16-17)”'
    key: ellicott-jeremiah
    url: 'https://biblehub.com/commentaries/ellicott/jeremiah/51.htm'
    quote: 'The wine cup which He would give them would be that of His wrath (Jeremiah 25:16-17)'
  - where: 'section “The king of Sheshach shall drink after them”'
    claim: 'Keil on 51:39: “give them the cup of wrath to drink”'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/51.htm'
    quote: 'give them the cup of wrath to drink'
  - where: 'section “The king of Sheshach shall drink after them”'
    claim: 'Rev. 16:19 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/16?lang=eng'
    quote: 'great Babylon came in remembrance before God, to give unto her the cup of the wine of the fierceness of his wrath.'
  - where: 'section “The king of Sheshach shall drink after them”'
    claim: 'Rev. 18:6 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/18?lang=eng'
    quote: 'in the cup which she hath filled fill to her double.'
  - where: 'section “The king of Sheshach shall drink after them”'
    claim: 'New Testament Student Manual 56: “Israelite prophets in turn wrote about the eventual destruction of Babylon (see Isaiah 13:19–22; 21:9; Jeremiah 50:35–36, 40; 51:6–8), and John drew upon their language”'
    key: nt-student-manual-56
    url: 'https://www.churchofjesuschrist.org/study/manual/new-testament-student-manual/revelation/chapter-56-revelation-17-22?lang=eng'
    quote: 'and John drew upon their language as he described the ultimate destruction of the spiritual enemies of God’s people.'
  - where: 'section “The king of Sheshach shall drink after them”'
    claim: 'Rev. 17:4 the cup is the woman’s: “having a golden cup in her hand full of abominations”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/17?lang=eng'
    quote: 'having a golden cup in her hand full of abominations and filthiness of her fornication'
  - where: 'section “The king of Sheshach shall drink after them”'
    claim: 'Hab. 2:16 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hab/2?lang=eng'
    quote: 'the cup of the Lord’s right hand shall be turned unto thee'
  - where: 'section “The king of Sheshach shall drink after them”'
    claim: 'Barnes on Hab. 2:16 cites Jer. 25:26: “So Jeremiah says, Jeremiah 25:26, ‘And the king of Shesbach shall drink after them’”'
    key: barnes-habakkuk
    url: 'https://biblehub.com/commentaries/barnes/habakkuk/2.htm'
    quote: 'shall drink after them;" and of Edom, Lamentations 4:21'
  # ---------- section “Would that I might not drink the bitter cup” ----------
  - where: 'section “Would that I might not drink the bitter cup”'
    claim: 'D&C 29:17 as quoted; footnote 17c “cup”: Jer. 25:15; 17e “blood”: 1 Jn. 1:7; Alma 11:40; D&C 19:17 (16–18)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/29?lang=eng'
    quote: 'I will take vengeance upon the wicked, for they will not repent; for the cup of mine indignation is full'
  - where: 'section “Would that I might not drink the bitter cup”'
    claim: 'D&C 19:16–18 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/19?lang=eng'
    quote: 'and would that I might not drink the bitter cup, and shrink'
  - where: 'section “Would that I might not drink the bitter cup”'
    claim: 'D&C 19:17 “But if they would not repent they must suffer even as I”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/19?lang=eng'
    quote: 'But if they would not repent they must suffer even as I'
  - where: 'section “Would that I might not drink the bitter cup”'
