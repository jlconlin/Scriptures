page: new-covenant
claims:
  - where: 'section “The covenant broken”'
    claim: 'Jer. 11 chapter heading: breaking the covenant of obedience'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/11?lang=eng'
    quote: 'The people of Judah are cursed for breaking the covenant of obedience—The Lord will not hear their prayers.'
  - where: 'section “The covenant broken”'
    claim: 'Jer. 11:10 in Hebrew: verb hēperû (“broken”) and “which I made [cut] with their fathers”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'שָׁ֩בוּ֩ עַל עֲוֺנֹ֨ת אֲבוֹתָ֜/ם הָ/רִֽאשֹׁנִ֗ים אֲשֶׁ֤ר מֵֽאֲנוּ֙ לִ/שְׁמ֣וֹעַ אֶת דְּבָרַ֔/י וְ/הֵ֣מָּה הָלְכ֗וּ אַחֲרֵ֛י אֱלֹהִ֥ים אֲחֵרִ֖ים לְ/עָבְדָ֑/ם הֵפֵ֤רוּ בֵֽית יִשְׂרָאֵל֙ וּ/בֵ֣ית יְהוּדָ֔ה אֶת בְּרִיתִ֕/י אֲשֶׁ֥ר כָּרַ֖תִּי אֶת אֲבוֹתָֽ/ם'
  - where: 'section “The covenant broken”'
    claim: 'Jer. 31:32 in Hebrew: same verb form hēperû and same words “which I made [cut] with their fathers”; the words occur only in 11:10 and 31:32'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'לֹ֣א כַ/בְּרִ֗ית אֲשֶׁ֤ר כָּרַ֨תִּי֙ אֶת אֲבוֹתָ֔/ם בְּ/יוֹם֙ הֶחֱזִיקִ֣/י בְ/יָדָ֔/ם לְ/הוֹצִיאָ֖/ם מֵ/אֶ֖רֶץ מִצְרָ֑יִם אֲשֶׁר הֵ֜מָּה הֵפֵ֣רוּ אֶת בְּרִיתִ֗/י וְ/אָנֹכִ֛י בָּעַ֥לְתִּי בָ֖/ם נְאֻם יְהוָֽה'
  - where: 'section “What is written on the heart”'
    claim: 'Metaphors of Jer. 17:1 speak of how deeply sin was embedded in Judah'
    key: ot-manual-23
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng'
    quote: 'These metaphors speak of how deeply sin was imbedded in Judah’s consciousness.'
  - where: 'section “What is written on the heart”'
    claim: 'Jer. 17:1: “written” (kətûbâ) “upon the table of their heart”; one of only two verses where “write” governs “heart”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'חַטַּ֣את יְהוּדָ֗ה כְּתוּבָ֛ה בְּ/עֵ֥ט בַּרְזֶ֖ל בְּ/צִפֹּ֣רֶן שָׁמִ֑יר חֲרוּשָׁה֙ עַל ל֣וּחַ לִבָּ֔/ם וּ/לְ/קַרְנ֖וֹת מִזְבְּחוֹתֵי/כֶֽם'
  - where: 'section “What is written on the heart”'
    claim: 'Jer. 31:33: “write it” (ʾeḵtăbennâ) “upon their heart”; the only other verse where “write” governs “heart”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'כִּ֣י זֹ֣את הַ/בְּרִ֡ית אֲשֶׁ֣ר אֶכְרֹת֩ אֶת בֵּ֨ית יִשְׂרָאֵ֜ל אַחֲרֵ֨י הַ/יָּמִ֤ים הָ/הֵם֙ נְאֻם יְהוָ֔ה נָתַ֤תִּי אֶת תּֽוֹרָתִ/י֙ בְּ/קִרְבָּ֔/ם וְ/עַל לִבָּ֖/ם אֶכְתֲּבֶ֑/נָּה וְ/הָיִ֤יתִי לָ/הֶם֙ לֵֽ/אלֹהִ֔ים וְ/הֵ֖מָּה יִֽהְיוּ לִ֥/י לְ/עָֽם'
  - where: 'section “The new covenant”'
    claim: 'Jer. 31:33: the Lord “puts” (nātattî, the verb of “set before” in 9:13, 26:4, 44:10) the law “in their inward parts” (bəqirbām)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'כִּ֣י זֹ֣את הַ/בְּרִ֡ית אֲשֶׁ֣ר אֶכְרֹת֩ אֶת בֵּ֨ית יִשְׂרָאֵ֜ל אַחֲרֵ֨י הַ/יָּמִ֤ים הָ/הֵם֙ נְאֻם יְהוָ֔ה נָתַ֤תִּי אֶת תּֽוֹרָתִ/י֙ בְּ/קִרְבָּ֔/ם וְ/עַל לִבָּ֖/ם אֶכְתֲּבֶ֑/נָּה וְ/הָיִ֤יתִי לָ/הֶם֙ לֵֽ/אלֹהִ֔ים וְ/הֵ֖מָּה יִֽהְיוּ לִ֥/י לְ/עָֽם'
  - where: 'section “The new covenant”'
    claim: 'KJV Jer. 9:13 (WLC 9:12): the law “which I set before them” (nātattî lipnêhem)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'וַ/יֹּ֣אמֶר יְהוָ֔ה עַל עָזְבָ/ם֙ אֶת תּ֣וֹרָתִ֔/י אֲשֶׁ֥ר נָתַ֖תִּי לִ/פְנֵי/הֶ֑ם וְ/לֹא שָׁמְע֥וּ בְ/קוֹלִ֖/י וְ/לֹא הָ֥לְכוּ בָֽ/הּ'
  - where: 'section “The new covenant”'
    claim: 'Jer. 26:4: the law “which I have set before you”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֔ם כֹּ֖ה אָמַ֣ר יְהוָ֑ה אִם לֹ֤א תִשְׁמְעוּ֙ אֵלַ֔/י לָ/לֶ֨כֶת֙ בְּ/ת֣וֹרָתִ֔/י אֲשֶׁ֥ר נָתַ֖תִּי לִ/פְנֵי/כֶֽם'
  - where: 'section “The new covenant”'
    claim: 'Jer. 44:10: the law “that I set before you”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'לֹ֣א דֻכְּא֔וּ עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וְ/לֹ֣א יָרְא֗וּ וְ/לֹֽא הָלְכ֤וּ בְ/תֽוֹרָתִ/י֙ וּ/בְ/חֻקֹּתַ֔/י אֲשֶׁר נָתַ֥תִּי לִ/פְנֵי/כֶ֖ם וְ/לִ/פְנֵ֥י אֲבוֹתֵי/כֶֽם'
  - where: 'section “The new covenant”'
    claim: 'Covenant formula (people / God / be) in Jer. 7:23, as condition (inside a command); the full two-part formula stands in seven verses (7:23, 11:4, 24:7, 30:22, 31:1, 31:33, 32:38); 13:11 has the “my people” half alone'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'כִּ֣י אִֽם אֶת הַ/דָּבָ֣ר הַ֠/זֶּה צִוִּ֨יתִי אוֹתָ֤/ם לֵ/אמֹר֙ שִׁמְע֣וּ בְ/קוֹלִ֔/י וְ/הָיִ֤יתִי לָ/כֶם֙ לֵֽ/אלֹהִ֔ים וְ/אַתֶּ֖ם תִּֽהְיוּ לִ֣/י לְ/עָ֑ם וַ/הֲלַכְתֶּ֗ם בְּ/כָל הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר אֲצַוֶּ֣ה אֶתְ/כֶ֔ם לְמַ֖עַן יִיטַ֥ב לָ/כֶֽם'
  - where: 'section “The new covenant”'
    claim: 'Covenant formula (people / God / be) in Jer. 11:4, as condition (inside a command); the full two-part formula stands in seven verses (7:23, 11:4, 24:7, 30:22, 31:1, 31:33, 32:38); 13:11 has the “my people” half alone'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'אֲשֶׁ֣ר צִוִּ֣יתִי אֶת אֲבֽוֹתֵי/כֶ֡ם בְּ/י֣וֹם הוֹצִיאִֽ/י אוֹתָ֣/ם מֵ/אֶֽרֶץ מִצְרַיִם֩ מִ/כּ֨וּר הַ/בַּרְזֶ֜ל לֵ/אמֹ֗ר שִׁמְע֤וּ בְ/קוֹלִ/י֙ וַ/עֲשִׂיתֶ֣ם אוֹתָ֔/ם כְּ/כֹ֥ל אֲשֶׁר אֲצַוֶּ֖ה אֶתְ/כֶ֑ם וִ/הְיִ֤יתֶם לִ/י֙ לְ/עָ֔ם וְ/אָ֣נֹכִ֔י אֶהְיֶ֥ה לָ/כֶ֖ם לֵ/אלֹהִֽים'
  - where: 'section “The new covenant”'
    claim: 'Covenant formula (people / God / be) in Jer. 24:7, as promise; the full two-part formula stands in seven verses (7:23, 11:4, 24:7, 30:22, 31:1, 31:33, 32:38); 13:11 has the “my people” half alone'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'וְ/נָתַתִּי֩ לָ/הֶ֨ם לֵ֜ב לָ/דַ֣עַת אֹתִ֗/י כִּ֚י אֲנִ֣י יְהוָ֔ה וְ/הָיוּ לִ֣/י לְ/עָ֔ם וְ/אָ֣נֹכִ֔י אֶהְיֶ֥ה לָ/הֶ֖ם לֵ/אלֹהִ֑ים כִּֽי יָשֻׁ֥בוּ אֵלַ֖/י בְּ/כָל לִבָּֽ/ם'
  - where: 'section “The new covenant”'
    claim: 'Covenant formula (people / God / be) in Jer. 30:22, as promise; the full two-part formula stands in seven verses (7:23, 11:4, 24:7, 30:22, 31:1, 31:33, 32:38); 13:11 has the “my people” half alone'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'וִ/הְיִ֥יתֶם לִ֖/י לְ/עָ֑ם וְ/אָ֣נֹכִ֔י אֶהְיֶ֥ה לָ/כֶ֖ם לֵ/אלֹהִֽים'
  - where: 'section “The new covenant”'
    claim: 'Covenant formula (people / God / be) in Jer. 31:1, as promise; the full two-part formula stands in seven verses (7:23, 11:4, 24:7, 30:22, 31:1, 31:33, 32:38); 13:11 has the “my people” half alone'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'בָּ/עֵ֤ת הַ/הִיא֙ נְאֻם יְהוָ֔ה אֶֽהְיֶה֙ לֵֽ/אלֹהִ֔ים לְ/כֹ֖ל מִשְׁפְּח֣וֹת יִשְׂרָאֵ֑ל וְ/הֵ֖מָּה יִֽהְיוּ לִ֥/י לְ/עָֽם'
  - where: 'section “The new covenant”'
    claim: 'Covenant formula (people / God / be) in Jer. 32:38, as promise; the full two-part formula stands in seven verses (7:23, 11:4, 24:7, 30:22, 31:1, 31:33, 32:38); 13:11 has the “my people” half alone'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'וְ/הָ֥יוּ לִ֖/י לְ/עָ֑ם וַ/אֲנִ֕י אֶהְיֶ֥ה לָ/הֶ֖ם לֵ/אלֹהִֽים'
  - where: 'section “The new covenant”'
    claim: 'Jer. 31:33 is the formula as promise, inside the new covenant (the seventh verse)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'כִּ֣י זֹ֣את הַ/בְּרִ֡ית אֲשֶׁ֣ר אֶכְרֹת֩ אֶת בֵּ֨ית יִשְׂרָאֵ֜ל אַחֲרֵ֨י הַ/יָּמִ֤ים הָ/הֵם֙ נְאֻם יְהוָ֔ה נָתַ֤תִּי אֶת תּֽוֹרָתִ/י֙ בְּ/קִרְבָּ֔/ם וְ/עַל לִבָּ֖/ם אֶכְתֲּבֶ֑/נָּה וְ/הָיִ֤יתִי לָ/הֶם֙ לֵֽ/אלֹהִ֔ים וְ/הֵ֖מָּה יִֽהְיוּ לִ֥/י לְ/עָֽם'
  - where: 'section “The new covenant”'
    claim: 'Jer. 30–33 are prophecies of the latter-day restoration of Israel and the gospel covenant'
    key: bd-jeremiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng'
    quote: '(c) Jer. 30–33, prophecies of the latter-day restoration of Israel and the gospel covenant'
  - where: 'section “The mediator”'
    claim: 'Hebrews quotes Jer. 31:31–34 to show the Lord would make a new covenant'
    key: nt-student-manual-49
    url: 'https://www.churchofjesuschrist.org/study/manual/new-testament-student-manual/hebrews/chapter-49-hebrews-7-13?lang=eng'
    quote: 'quoting from Jeremiah 31:31–34 to show his Jewish-Christian readers that the Lord had revealed to Old Testament prophets that He would someday make a new covenant with Israel'
  - where: 'section “The mediator”'
    claim: 'The cup signals fulfillment of the old covenant and establishment of the new'
    key: nt-student-manual-9
    url: 'https://www.churchofjesuschrist.org/study/manual/new-testament-student-manual/introduction-to-matthew/chapter-9?lang=eng'
    quote: 'When Jesus presented the cup of wine to His Apostles, He was signaling the fulfillment of the old covenant and the establishment of the new covenant.'
  - where: 'section “The mediator”'
    claim: 'Paul’s 2 Cor. 3:3 points to fulfillment of a prophecy of Jeremiah'
    key: nt-student-manual-41
    url: 'https://www.churchofjesuschrist.org/study/manual/new-testament-student-manual/2-corinthians/chapter-41-2-corinthians-1-5?lang=eng'
    quote: 'When Paul taught that the new covenant would be written on people’s hearts (see 2 Corinthians 3:3), he was pointing to the fulfillment of a prophecy of Jeremiah'
  - where: 'section “The mediator”'
    claim: 'JST Gal. 3:20: one mediator of the new covenant, who is Christ'
    key: jst-gal-3
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-gal/3?lang=eng'
    quote: 'but there is one mediator of the new covenant, who is Christ'
  - where: 'section “Offered, rejected, and offered again”'
    claim: 'Jer. 31:31–34 deals with the Restoration through Joseph Smith and the day the covenant is truly established'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'Verses 31–34 deal with the restoration of the gospel through the Prophet Joseph Smith and the day when God’s covenant will truly be established with His people.'
  - where: 'section “Offered, rejected, and offered again”'
    claim: 'On that reading “new” means revealed anew'
    key: ot-seminary-teacher-135
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-jeremiah/lesson-135-jeremiah-30-33?lang=eng'
    quote: 'Explain that the word new in this context means that God’s covenant—the fulness of the gospel—would be revealed anew to the house of Israel.'
  - where: 'section “Offered, rejected, and offered again”'
    claim: 'D&C 84:57 is cross-referenced to Jer. 31:31'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'Jer. 31:31 (31–34).'
  - where: 'section “Offered, rejected, and offered again”'
    claim: 'D&C 45:9 is cross-referenced to Jer. 31:33'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/45?lang=eng'
    quote: 'Jer. 31:33 (31–34); Hosea 2:18 (14–23); Morm. 5:20. TG Covenants.'
  - where: 'section “Offered, rejected, and offered again”'
    claim: 'Joseph Smith, 1833: Christ proposed a covenant and it was rejected'
    key: smith-saxton-letter
    url: 'https://www.josephsmithpapers.org/paper-summary/letter-to-noah-c-saxton-4-january-1833/2'
    quote: 'Christ in the days of his flesh proposed to make a covenant with them but they rejected him and his proposals'
  - where: 'section “Offered, rejected, and offered again”'
    claim: 'The new covenant was generally rejected by Jews in New Testament times and would be offered again later (the manual summarizing Joseph Smith)'
    key: nt-student-manual-49
    url: 'https://www.churchofjesuschrist.org/study/manual/new-testament-student-manual/hebrews/chapter-49-hebrews-7-13?lang=eng'
    quote: 'although Jews in New Testament times generally rejected this new covenant, it would again be offered to them at a later time'
  - where: 'section “Offered, rejected, and offered again”'
    claim: 'Joseph Smith, 1833: no covenant was made with them at that time, but the promise stands'
    key: smith-saxton-letter
    url: 'https://www.josephsmithpapers.org/paper-summary/letter-to-noah-c-saxton-4-january-1833/2'
    quote: 'no covenant was made with them at that time but their unbelief has not rendered the promise of God of none effect'
  - where: 'section “The mediator”'
    claim: 'Footnote on Luke 22:20 “testament”: the Greek is “covenant”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/22?lang=eng'
    quote: 'GR covenant.'
