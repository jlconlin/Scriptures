page: shepherds-and-the-branch
claims:
  - where: 'opening'
    claim: 'Every KJV "pastor(s)" in Jeremiah (2:8; 3:15; 10:21; 12:10; 17:16; 22:22; 23:1–2) renders the Hebrew word for shepherd (roʿeh); 2:8 quoted'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'וְ/הָ/רֹעִ֖ים פָּ֣שְׁעוּ בִ֑/י'
  - where: 'opening'
    claim: 'Church edition footnote at 3:15 gives the Hebrew as "shepherds"'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/3?lang=eng'
    quote: 'HEB shepherds. TG Bishop.'
  - where: 'opening'
    claim: 'Bible Dictionary outline groups Jer. 21–23 on pastors or rulers with promise of the king Messiah'
    key: bd-jeremiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng'
    quote: '(a) Jer. 21–23, on pastors or rulers of the people, with promise of the king Messiah (23:1–6); Jer. 24, on exiles carried away with Jehoiachin.'
  - where: 'opening'
    claim: 'Jer. 23 heading names the Branch as the King (the Messiah); Jer. 30 heading names David as the Messiah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/23?lang=eng'
    quote: 'The Branch, who is the King (the Messiah), will reign in righteousness'
  - where: 'section “Shepherds who scatter”'
    claim: 'Who the shepherds are: Bible Dictionary says pastors or rulers'
    key: bd-jeremiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng'
    quote: '(a) Jer. 21–23, on pastors or rulers of the people, with promise of the king Messiah (23:1–6); Jer. 24, on exiles carried away with Jehoiachin.'
  - where: 'section “Shepherds who scatter”'
    claim: 'Student manual: pastors (religious leaders) of Judah'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'Jeremiah showed that the pastors (religious leaders) of Judah had not fed and protected the sheep (Israel), but had scattered them and driven them away (enticed them away from God).'
  - where: 'section “Shepherds who scatter”'
    claim: 'Student manual at 3:15: faithful pastors (church leaders)'
    key: ot-manual-23
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng'
    quote: 'Knowledge and understanding taught by faithful pastors (church leaders) (see v. 15).'
  - where: 'section “The house of David weighed”'
    claim: 'Jer. 22 heading'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/22?lang=eng'
    quote: 'David’s throne stands or falls according to the obedience of the kings—The judgments of the Lord rest upon the kings of Judah.'
  - where: 'section “The house of David weighed”'
    claim: 'Jehoiakim compared with Josiah (22:15–16)'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'Jeremiah rebuked Jehoiakim for his self-centered life and his injustices to his people (see vv. 13–19), which were particularly evident when compared to the righteous deeds of his father, Josiah (see vv. 15–16).'
  - where: 'section “The Lord gathers, and raises a Branch”'
    claim: 'Jer. 23 heading: the Branch, who is the King (the Messiah)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/23?lang=eng'
    quote: 'The Branch, who is the King (the Messiah), will reign in righteousness'
  - where: 'section “The Lord gathers, and raises a Branch”'
    claim: 'The Branch and the King are the Lord Jesus Christ'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'The Branch and the King are the Lord Jesus Christ when He returns to earth to reign as ‘King of kings and Lord of lords’ (Revelation 17:14…).'
  - where: 'section “The Lord gathers, and raises a Branch”'
    claim: '"do/execute judgment and justice (righteousness)" is the same Hebrew phrase in 22:3 (commanded of the king), 22:15 (Josiah), 23:5 and 33:15 (the Branch), and 9:24 (Hebrew 9:23; the LORD); 22:15 quoted'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'וְ/עָשָׂ֤ה מִשְׁפָּט֙ וּ/צְדָקָ֔ה'
  - where: 'section “The Lord gathers, and raises a Branch”'
    claim: 'The same phrase of the Branch (23:5 and 33:15, identical wording)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'וְ/עָשָׂ֛ה מִשְׁפָּ֥ט וּ/צְדָקָ֖ה בָּ/אָֽרֶץ'
  - where: 'section “The Lord gathers, and raises a Branch”'
    claim: 'The same phrase of the LORD (Hebrew 9:23 = KJV 9:24)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'עֹ֥שֶׂה חֶ֛סֶד מִשְׁפָּ֥ט וּ/צְדָקָ֖ה בָּ/אָ֑רֶץ'
  - where: 'section “The Lord gathers, and raises a Branch”'
    claim: 'Bible Dictionary glosses Zedekiah as "The Lord (is) righteousness" and cites Jer. 23:6; 33:16'
    key: bd-zedekiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zedekiah?lang=eng'
    quote: 'The Lord (is) righteousness. The last king of Judah, his name changed from Mattaniah to Zedekiah (Jer. 23:6; 33:16).'
  - where: 'section “The Lord gathers, and raises a Branch”'
    claim: 'On one level the name-title echoes Zedekiah, the last reigning king, but points to the future Davidic Messiah'
    key: bowen-ominous-onomastics
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/ominous-onomastics'
    quote: 'the last regnant king of Judah who was dethroned and exiled to Babylon, but pointing forward to the future Davidic Messiah'
  - where: 'section “The Lord gathers, and raises a Branch”'
    claim: 'The reading is given as one level ("On one level")'
    key: bowen-ominous-onomastics
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/ominous-onomastics'
    quote: 'On one level, the wordplay on forms of ṣdq and the name-title yhwh ṣidqēnû echo the name of Zedekiah'
  - where: 'section “The Lord gathers, and raises a Branch”'
    claim: 'No descendant of David reigned after the exile, so the prophecy awaited a future descendant'
    key: bowen-ominous-onomastics
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/ominous-onomastics'
    quote: 'Thus, this prophecy remained to be fulfilled by a future Davidic descendant.'
  - where: 'section “The promise repeated”'
    claim: 'Jer. 30 heading: David, their king (the Messiah)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/30?lang=eng'
    quote: 'David, their king (the Messiah), will reign over them.'
  - where: 'section “The promise repeated”'
    claim: 'Jesus is the King David of the latter days, a branch of David’s line'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'Sometimes He is called ‘the Branch’ (Jeremiah 23:5; 33:15) because Jesus, who is the King David of the latter days, is a branch of the ancient line of King David.'
  - where: 'section “The promise repeated”'
    claim: 'Hebrew ṣemaḥ ("Branch") occurs in Jeremiah only at 23:5 and 33:15'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'אַצְמִ֥יחַ לְ/דָוִ֖ד צֶ֣מַח צְדָקָ֑ה'
  - where: 'section “The promise repeated”'
    claim: 'The two readings of 33:16: the manual prints a reading where the one who calls to her is the Lord our Justification (Clarke)'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'According to Adam Clarke it should read: ‘And this one who shall call to her is the Lord our Justification,’ that is, Jesus Christ Himself, the Branch of David'
  - where: 'section “The promise repeated”'
    claim: 'The other reading: the city is called after the King who reigns in her midst'
    key: ot-manual-13
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-13?lang=eng'
    quote: 'which is to say that because the Great King himself reigns in her midst, even the city shall be called after him.'
  - where: 'section “The Good Shepherd”'
    claim: 'Ezek. 34:24 footnote points to Jer. 23:5 and 30:9; heading names the Messiah as Shepherd'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/34?lang=eng'
    quote: 'Jer. 23:5 (5–6); 30:9; Hosea 3:5.'
  - where: 'section “The Good Shepherd”'
    claim: 'Ezek. 34 heading: the Messiah will be their Shepherd'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/34?lang=eng'
    quote: 'The Messiah will be their Shepherd'
  - where: 'section “The promise repeated”'
    claim: 'Prophecies under the Branch and Davidic titles refer almost exclusively to the Second Coming (Elder McConkie, printed in the manual)'
    key: ot-manual-13
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-13?lang=eng'
    quote: 'Messianic prophecies under these headings deal with the power and dominion he shall wield as he sits on David’s throne, and have reference almost exclusively to his second sojourn on planet earth.'
