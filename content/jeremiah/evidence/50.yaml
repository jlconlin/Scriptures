chapter: 50
claims:
  - where: 'setting'
    claim: 'Chapters 50–51 in their present form are later than Jeremiah'
    key: bd-jeremiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng'
    quote: 'Chapters 50–51 in their present form are later than Jeremiah. Chapter 52 forms a historical conclusion.'
  - where: 'note 50:1 “Written for Babylon”'
    claim: 'Jeremiah wrote the words against Babylon in a book and sent it with Seraiah in Zedekiah''s fourth year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/51?lang=eng'
    quote: 'So Jeremiah wrote in a book all the evil that should come upon Babylon, even all these words that are written against Babylon.'
  - where: 'note 50:1 “Written for Babylon”'
    claim: 'Church edition footnote at 50:1 points to Jer. 51:60'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/50?lang=eng'
    quote: 'Jer. 51:60 .'
  - where: 'note 50:1 “Written for Babylon”'
    claim: 'Manual: chapters 50–51 written and sent to Babylon in Zedekiah''s days; hard to interpret without dual prophecy and archetypes'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'was written and sent to Babylon in the days of Zedekiah (see Jeremiah 51:59–64). They are difficult to interpret unless two principles of Hebrew prophecy are accepted: the dual nature of many prophecies, and the recurring use of archetypes and metaphors.'
  - where: 'setting'
    claim: 'Church chapter heading'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/50?lang=eng'
    quote: 'Babylon will be destroyed and never rise again—The scattered people of Israel will be brought again into the lands of their inheritance.'
  - where: 'note 50:2 “Bel and Merodach”'
    claim: 'Bel and Merodach are two names of the chief Babylonian deity (one reading)'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/50.htm'
    quote: 'Bel and Merodach are not different divinities, but merely different names for the chief deity of the Babylonians.'
  - where: 'note 50:2 “Bel and Merodach”'
    claim: 'Babylon''s chief building was the temple of Bel'
    key: bd-babylon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/babylon?lang=eng'
    quote: 'The chief building was the famous temple of Bel.'
  - where: 'note 50:2 “Bel and Merodach”'
    claim: 'Church footnote at 50:2 points to Isa. 46:1; Isaiah text'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/46?lang=eng'
    quote: 'Bel boweth down, Nebo stoopeth, their idols were upon the beasts, and upon the cattle'
  - where: 'note 50:9 “A coalition from the north”'
    claim: 'Cyrus''s army was a coalition arranged under the Medes'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'The army of Cyrus was composed of Medes, Persians, Armenians, Caducians, Sacae, &c. Though all these did not come from the north; yet they were arranged under the Medes, who did come from the north, in reference to Babylon.'
  - where: 'note 50:9 “A coalition from the north”'
    claim: 'Babylon itself was the power from the north that the Lord brought against Judah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/25?lang=eng'
    quote: 'Behold, I will send and take all the families of the north, saith the Lord, and Nebuchadrezzar the king of Babylon, my servant, and will bring them against this land'
  - where: 'note 50:9 “A coalition from the north”'
    claim: 'Church footnote at 50:3 points to Jer. 51:48; text'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/51?lang=eng'
    quote: 'for the spoilers shall come unto her from the north, saith the Lord.'
  - where: 'note 50:4 “Israel and Judah together”'
    claim: 'Israel did not take part in the return from Babylon; they will be restored together in the last days'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'Israel did not participate in the return from Babylon, but Israel and Judah will be restored together in the last days.'
  - where: 'note 50:4 “Israel and Judah together”'
    claim: 'They weep because they realize the sufferings came from rejecting the Lord (manual on Jer. 31:9, citing 50:4)'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'They will weep because they will realize that the sufferings they have endured throughout the centuries came about because they rejected the Lord Jesus Christ, who shall lead them in the last days (see Jeremiah 50:4; Zechariah 12:10).'
  - where: 'note 50:4 “Israel and Judah together”'
    claim: 'Ezekiel: one nation, no longer two (Church footnote at 50:4)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/37?lang=eng'
    quote: 'And I will make them one nation in the land upon the mountains of Israel; and one king shall be king to them all'
  - where: 'note 50:4 “Israel and Judah together”'
    claim: 'Zechariah 12:10 text'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/12?lang=eng'
    quote: 'and they shall look upon me whom they have pierced, and they shall mourn for him'
  - where: 'note 50:4 “Israel and Judah together”'
    claim: 'Jer. 31:9 text (footnote at 50:4)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/31?lang=eng'
    quote: 'They shall come with weeping, and with supplications will I lead them'
  - where: 'note 50:5 “A covenant not forgotten”'
    claim: 'The covenant is the new covenant of Jer. 31:31ff (one reading)'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/50.htm'
    quote: 'In fact, this is the new covenant which the Lord, according to Jeremiah 31:31., will make in time to come with His people.'
  - where: 'note 50:5 “A covenant not forgotten”'
    claim: 'Church footnote: perpetual = OR everlasting'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/50?lang=eng'
    quote: 'OR  everlasting.'
  - where: 'note 50:5 “A covenant not forgotten”'
    claim: 'The risen Lord says the Father will remember the covenant and gather them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/20?lang=eng'
    quote: 'And I will remember the covenant which I have made with my people; and I have covenanted with them that I would gather them together in mine own due time'
  - where: 'note 50:6 “Shepherds who led them astray”'
    claim: 'Church footnote at 50:6 points to 2 Ne. 28:12 (9–16)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/50?lang=eng'
    quote: '2 Ne. 28:12 (9–16) .'
  - where: 'note 50:6 “Shepherds who led them astray”'
    claim: 'Nephi on false teachers leading astray'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/28?lang=eng'
    quote: 'they have all gone astray save it be a few, who are the humble followers of Christ; nevertheless, they are led, that in many instances they do err because they are taught by the precepts of men.'
  - where: 'note 50:8 “Go out of Babylon”'
    claim: 'D&C 133 was received through Joseph Smith at Hiram, Ohio, 3 Nov 1831, on preaching and the gathering'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/133?lang=eng'
    quote: 'Revelation given through Joseph Smith the Prophet, at Hiram, Ohio, November 3, 1831.'
  - where: 'note 50:8 “Go out of Babylon”'
    claim: 'D&C 133:5, 7, 14 text'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/133?lang=eng'
    quote: 'Go ye out from among the nations, even from Babylon, from the midst of wickedness, which is spiritual Babylon.'
  - where: 'note 50:8 “Go out of Babylon”'
    claim: 'In D&C 1:16 Babylon means the world'
    key: bd-babylon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/babylon?lang=eng'
    quote: 'In D&C 1:16, Babylon means “the world.”'
  - where: 'note 50:8 “Go out of Babylon”'
    claim: 'Manual: Babylon a symbol of worldliness and spiritual wickedness; charge to flee (51:6)'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'Because Babylon is also a symbol of the world, a charge was given Israel to flee from her wickedness and to be responsible for saving their own souls (see v. 6).'
  - where: 'note 50:17 “Assyria, then Babylon”'
    claim: 'Israel carried off by Assyria 740/721; Judah deported under Nebuchadnezzar 597 and 586'
    key: bd-captivities
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/captivities-of-the-israelites?lang=eng'
    quote: 'in 721 B.C. Sargon Ⅱ carried into captivity the rest of Israel (2 Kgs. 17:3)'
  - where: 'note 50:17 “Assyria, then Babylon”'
    claim: 'Judah''s deportations under Nebuchadnezzar'
    key: bd-captivities
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/captivities-of-the-israelites?lang=eng'
    quote: 'in 597 B.C. and again in 586 B.C. there were large deportations under Nebuchadnezzar'
  - where: 'note 50:20 “Sought for, and none”'
    claim: 'Manual: Israel will be brought back and forgiven (v. 20) and led by Christ (v. 34)'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'Israel will be brought again to their lands of inheritance (see v. 19) and will be forgiven (see v. 20). They will be led by the Lord Jesus Christ (see v. 34).'
  - where: 'note 50:20 “Sought for, and none”'
    claim: 'Jer. 31:34 forgive and remember no more'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/31?lang=eng'
    quote: 'for I will forgive their iniquity, and I will remember their sin no more.'
  - where: 'note 50:21 “Merathaim and Pekod”'
    claim: 'Names formed for the occasion; Merathaim means “double rebellion”'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/50.htm'
    quote: 'in two names specially formed for the occasion.'
  - where: 'note 50:21 “Merathaim and Pekod”'
    claim: 'Merathaim = double rebellion/obstinacy; Pekod = visitation'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/50.htm'
    quote: 'means "double rebellion," or "double obstinacy."'
  - where: 'note 50:21 “Merathaim and Pekod”'
    claim: 'Keil renders the clause “against the inhabitants of visitation”'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/50.htm'
    quote: 'against the inhabitants of visitation'
  - where: 'note 50:21 “Merathaim and Pekod”'
    claim: 'Doubt remains about what Jeremiah had in mind'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/50.htm'
    quote: 'The only doubtful points are in what respect Babylon showed double obstinacy, and what Jeremiah had in his mind at the time.'
  - where: 'note 50:23 “The hammer is broken”'
    claim: 'Nebuchadrezzar is the Lord''s servant brought against Judah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/25?lang=eng'
    quote: 'Nebuchadrezzar the king of Babylon, my servant'
  - where: 'note 50:23 “The hammer is broken”'
    claim: 'The Lord will punish Babylon after seventy years for iniquity'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/25?lang=eng'
    quote: 'when seventy years are accomplished, that I will punish the king of Babylon, and that nation, saith the Lord, for their iniquity'
  - where: 'note 50:23 “The hammer is broken”'
    claim: 'Isaiah: Assyria the rod of anger, then punished'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/10?lang=eng'
    quote: 'I will punish the fruit of the stout heart of the king of Assyria, and the glory of his high looks.'
  - where: 'note 50:34 “Their Redeemer is strong”'
    claim: 'Church footnote at 50:34 points to Isa. 51:22; text'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/51?lang=eng'
    quote: 'thy God that pleadeth the cause of his people'
  - where: 'note 50:34 “Their Redeemer is strong”'
    claim: 'The Lord is advocate with the Father (D&C 29:5)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/29?lang=eng'
    quote: 'I am in your midst, and am your advocate with the Father'
  - where: 'note 50:34 “Their Redeemer is strong”'
    claim: 'Manual: He is the advocate and pleads our cause'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'He is the advocate with the Father (see D&C 29:5) and pleads our cause before Him.'
  - where: 'note 50:40 “As God overthrew Sodom”'
    claim: 'Isaiah uses the same words of Babylon; Church footnotes point to Gen. 19:24 and Isa. 13:19'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/13?lang=eng'
    quote: 'And Babylon, the glory of kingdoms, the beauty of the Chaldees’ excellency, shall be as when God overthrew Sodom and Gomorrah.'
  - where: 'note 50:40 “As God overthrew Sodom”'
    claim: 'Manual: Babylon of that day a prototype of future downfall of Babylon the Great (Rev. 18–19)'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'the downfall anciently of Nebuchadnezzar’s Babylon was a prototype of the future downfall of “Babylon the Great” (see Revelation 18–19).'
  - where: 'note 50:8 “Go out of Babylon”'
    claim: 'Manual on Jer. 50: Babylon as symbol of worldliness and spiritual wickedness, comparing D&C 133:14'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'Here Babylon is seen not only as a national power but as the symbol of worldliness and spiritual wickedness. (Compare D&C 133:14 .)'
  - where: 'setting'
    claim: 'Babylon both a national power and a symbol of worldliness'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'Here Babylon is seen not only as a national power but as the symbol of worldliness and spiritual wickedness.'
  - where: 'note 50:40 “As God overthrew Sodom”'
    claim: 'D&C 1:16 Babylon the great shall fall'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/1?lang=eng'
    quote: 'even Babylon the great, which shall fall.'
  - where: 'note 50:41 “Words once said of Zion”'
    claim: 'Jer. 6:22–24 says the same of Zion; Church footnote at 50:41 points to it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/6?lang=eng'
    quote: 'They shall lay hold on bow and spear; they are cruel, and have no mercy; their voice roareth like the sea'
  - where: 'note 50:41 “Words once said of Zion”'
    claim: 'Jer. 6:24 hands wax feeble'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/6?lang=eng'
    quote: 'We have heard the fame thereof: our hands wax feeble: anguish hath taken hold of us, and pain, as of a woman in travail.'
  - where: 'note 50:41 “Words once said of Zion”'
    claim: 'Jer. 49:19–21 says nearly the same of Edom as 50:44–46'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/49?lang=eng'
    quote: 'Therefore hear the counsel of the Lord, that he hath taken against Edom'
  - where: 'note 50:44 “That shepherd”'
    claim: 'Church footnote at 50:44 points to Isa. 44:28, naming Cyrus'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/44?lang=eng'
    quote: 'That saith of Cyrus, He is my shepherd, and shall perform all my pleasure: even saying to Jerusalem, Thou shalt be built'
  - where: 'note 50:44 “That shepherd”'
    claim: 'The same question stands in Jer. 49:19 about Edom'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/49?lang=eng'
    quote: 'and who is a chosen man, that I may appoint over her? for who is like me? and who will appoint me the time? and who is that shepherd that will stand before me?'
  - where: 'note 50:44 “That shepherd”'
    claim: 'Church footnote at 50:38 points to Isa. 44:27 and Jer. 51:36; Isa. 44:27 text'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/44?lang=eng'
    quote: 'That saith to the deep, Be dry, and I will dry up thy rivers'
  - where: 'note 50:34 “Their Redeemer is strong”'
    claim: 'The Lord says He will plead their cause and take vengeance (Jer. 51:36)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/51?lang=eng'
    quote: 'Behold, I will plead thy cause, and take vengeance for thee; and I will dry up her sea, and make her springs dry.'
  - where: 'setting'
    claim: 'Jer. 46–51 are prophecies against foreign nations'
    key: bd-jeremiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng'
    quote: 'Jer. 46–51, prophecies against foreign nations.'
  - where: 'setting'
    claim: 'Chapter 51 continues chapter 50'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'This chapter is a continuation of the prophecy in chapter 50.'
  - where: 'thread'
    claim: 'Some verses describe Babylon of that day; others join her fall to the last-day gathering (50:4–5, 19, 20, 33–34)'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'associated again and again (see Jeremiah 50:4–5, 19, 20, 33–34) with events that will not occur until the time of the gathering and restoration of Israel and Judah.'
  - where: 'note 50:17 “Assyria, then Babylon”'
    claim: 'Tiglath-pileser carried away northern tribes in 740 B.C.'
    key: bd-captivities
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/captivities-of-the-israelites?lang=eng'
    quote: 'In 740 B.C. Tiglath-pileser carried away the trans-Jordanic tribes and the inhabitants of Galilee'
  - where: 'note 50:23 “The hammer is broken”'
    claim: 'Isaiah: Assyria the rod of anger'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/10?lang=eng'
    quote: 'O Assyrian, the rod of mine anger'
  - where: 'note 50:6 “Shepherds who led them astray”'
    claim: 'Church footnote reads “We offend not” as “are not guilty”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/50?lang=eng'
    quote: 'HEB  are not guilty.'
  - where: 'when'
    claim: 'Zedekiah reigned 597–586 B.C.'
    key: bd-jeremiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng'
    quote: 'Prophecies under Zedekiah (597–586), Jer. 21–38'
  - where: 'setting'
    claim: 'Chapters 50–51 hard to interpret without dual prophecy and archetypes'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'They are difficult to interpret unless two principles of Hebrew prophecy are accepted: the dual nature of many prophecies, and the recurring use of archetypes and metaphors.'
  - where: 'note 50:2 “Bel and Merodach”'
    claim: 'Bel is a Babylonian god, the same as Baal'
    key: bd-bel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/bel?lang=eng'
    quote: 'A Babylonian god, same as Baal ( Isa. 46:1 ; Jer. 50:2 ; 51:44 ).'
  - where: 'note 50:2 “Bel and Merodach”'
    claim: 'Church footnote at 50:2 (on “Bel”) points to Isa. 46:1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/50?lang=eng'
    quote: 'Isa. 46:1 .'
  - where: 'note 50:8 “Go out of Babylon”'
    claim: 'D&C 133 answered the elders'' questions about preaching and the gathering'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/133?lang=eng'
    quote: 'many things which the Elders desired to know relative to preaching the Gospel to the inhabitants of the earth, and concerning the gathering'
  - where: 'note 50:9 “A coalition from the north”'
    claim: 'The Cyrus coalition explanation is Adam Clarke''s, quoted by the manual'
    key: clarke-commentary
    url: 'https://biblehub.com/commentaries/clarke/jeremiah/50.htm'
    quote: 'An assembly of great nations - The army of Cyrus was composed of Medes, Persians, Armenians, Caducians, Sacae, etc. Though all these did not come from the north'
  - where: 'note 50:9 “A coalition from the north”'
    claim: 'The manual attributes the quotation to Clarke on v. 9'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'The “assembly of great nations from the north country” ( v. 9 ) is discussed by Clarke'
  - where: 'note 50:28 “The vengeance of his temple”'
    claim: 'Temple vessels had already been taken to Babylon before the fall'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/27?lang=eng'
    quote: 'Behold, the vessels of the Lord’s house shall now shortly be brought again from Babylon: for they prophesy a lie unto you.'
  - where: 'note 50:28 “The vengeance of his temple”'
    claim: 'Nebuzar-adan burned the temple; the Chaldeans carried its brass to Babylon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/52?lang=eng'
    quote: 'And burned the house of the Lord, and the king’s house'
  - where: 'note 50:28 “The vengeance of his temple”'
    claim: 'The Chaldeans broke the bronze pillars, bases, and sea and carried the brass to Babylon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/52?lang=eng'
    quote: 'the Chaldeans brake, and carried all the brass of them to Babylon.'
  - where: 'note 50:28 “The vengeance of his temple”'
    claim: 'Jer. 51:11 uses the same phrase'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/51?lang=eng'
    quote: 'because it is the vengeance of the Lord, the vengeance of his temple.'
  - where: 'note 50:28 “The vengeance of his temple”'
    claim: 'Strangers in the sanctuaries (Jer. 51:51)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/51?lang=eng'
    quote: 'for strangers are come into the sanctuaries of the Lord’s house.'
  - where: 'note 50:28 “The vengeance of his temple”'
    claim: 'One reading: the Lord avenged the burning of His temple'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/50.htm'
