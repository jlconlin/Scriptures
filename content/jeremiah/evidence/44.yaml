chapter: 44
claims:
  - where: 'setting'
    claim: 'Church chapter heading: the Jews in Egypt, save a small remnant, will be destroyed for worshiping false gods'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/44?lang=eng'
    quote: 'Jeremiah prophesies that the Jews in Egypt, save a small remnant, will be destroyed because they worship false gods.'
  - where: 'setting'
    claim: 'The survivors took Jeremiah to Egypt with them; tradition says he was stoned'
    key: bd-jeremiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng'
    quote: 'After the fall of Jerusalem the Jews who escaped into Egypt took Jeremiah with them as a kind of fetish (43:6), and at last, according to tradition, stoned him to death.'
  - where: 'setting'
    claim: 'The group came to Egypt because they would not obey the Lord (Jer. 43:7); the word of Jer. 44 came to Jews settled in four places'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/43?lang=eng'
    quote: 'So they came into the land of Egypt: for they obeyed not the voice of the'
  - where: 'when'
    claim: 'The chapter gives no date; it is later than the Tahpanhes word, and Egypt is not yet conquered by Babylon'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/44.htm'
    quote: 'the following denunciations, which at the same time form his last prophecy, were uttered a long time after that which is given in Jeremiah 43:8-13 as having been delivered at Tahpanhes. The date of it cannot, indeed, be determined exactly.'
  - where: 'when'
    claim: 'On one reading, the chapter comes before Babylon occupied Egypt'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/44.htm'
    quote: 'only this much is clear, that Egypt was not yet occupied by the Chaldeans'
  - where: 'note 44:1 “Four places in Egypt”'
    claim: 'Tahpanhes = Daphne; Jews were settled in the north and in more inland places (one reading)'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/44.htm'
    quote: 'Tahpanhes (i.e., Daphne, see on Jeremiah 43:7 ), but also in more inland places, in Noph (i.e., Memphis, see on Jeremiah 2:16 ) and the land of Pathros'
  - where: 'note 44:1 “Four places in Egypt”'
    claim: 'Jews had settled in the two northern frontier towns and also inland'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/44.htm'
    quote: 'The Jews had settled down, not merely in the two northern frontier towns, Migdol'
  - where: 'note 44:1 “Four places in Egypt”'
    claim: 'Migdol was the most northerly place in Egypt (one reading)'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/44.htm'
    quote: 'twelve Roman miles from Pelusium, Copt. Meschtl, Egypt. Ma''ktr, the most northerly place in Egypt'
  - where: 'note 44:1 “Four places in Egypt”'
    claim: 'Noph is Memphis, the ancient capital of Egypt'
    key: bd-noph
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/noph?lang=eng'
    quote: 'Memphis; ancient capital of Egypt'
  - where: 'note 44:1 “Four places in Egypt”'
    claim: 'Pathros is Upper Egypt'
    key: bd-pathros
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/pathros?lang=eng'
    quote: 'Upper Egypt. ( Isa. 11:11 ; Jer. 44:1, 15 ; Ezek. 29:14 ; 30:14 .)'
  - where: 'note 44:2 “Lehi saw the same ruin”'
    claim: 'Lehi saw by vision that Jerusalem was destroyed and that those who stayed would have perished'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/1?lang=eng'
    quote: 'I have seen a vision, in which I know that Jerusalem is destroyed; and had we remained in Jerusalem we should also have perished.'
  - where: 'note 44:4 “Rising early and sending”'
    claim: 'The Lord sent messengers persistently out of compassion; they were mocked and despised'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/36?lang=eng'
    quote: 'sent to them by his messengers, rising up betimes, and sending; because he had compassion on his people, and on his dwelling place: But they mocked the messengers of God, and despised his words, and misused his prophets'
  - where: 'note 44:4 “Rising early and sending”'
    claim: 'D&C 133:71 says the same of those who refused the Lord’s servants'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/133?lang=eng'
    quote: 'ye believed not my servants, and when they were sent unto you ye received them not.'
  - where: 'note 44:12 “Asked, promised, refused”'
    claim: 'The remnant asked Jeremiah to seek the Lord and promised to obey whatever he said'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/42?lang=eng'
    quote: 'we will obey the voice of the Lord our God, to whom we send thee; that it may be well with us, when we obey the voice of the Lord our God.'
  - where: 'note 44:12 “Asked, promised, refused”'
    claim: 'The Lord’s answer in ch. 42: going to Egypt means the sword and famine they feared will overtake them there'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/42?lang=eng'
    quote: 'the sword, which ye feared, shall overtake you there in the land of Egypt, and the famine, whereof ye were afraid, shall follow close after you there in Egypt; and there ye shall die.'
  - where: 'note 44:12 “Asked, promised, refused”'
    claim: 'The leaders called Jeremiah a liar and went anyway, taking Jeremiah and Baruch'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/43?lang=eng'
    quote: 'Thou speakest falsely: the Lord our God hath not sent thee to say, Go not into Egypt to sojourn there'
  - where: 'note 44:12 “Asked, promised, refused”'
    claim: 'They trusted their own judgment instead of obeying the prophet'
    key: ot-seminary-guide-jer-37-44
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-student-study-guide-obs/the-book-of-jeremiah/jeremiah-37-44-babylon-conquers-judah?lang=eng'
    quote: 'This prophecy was fulfilled among yet another group of Jews who could have received blessings at the Lord’s hand if they would have obeyed His prophet. But instead, they trusted in their own judgment.'
  - where: 'note 44:16 “A prophet whom people would rather not hear”'
    claim: 'Benson: popularity is not a test of truth (quoted in the manual)'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'Popularity is never a test of truth. Many a prophet has been killed or cast out.'
  - where: 'note 44:16 “A prophet whom people would rather not hear”'
    claim: 'Benson: response to the living prophet is a test of faithfulness'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'How we respond to the words of a living prophet when he tells us what we need to know, but would rather not hear, is a test of our faithfulness'
  - where: 'note 44:16 “A prophet whom people would rather not hear”'
    claim: 'Kimball: many garnish the sepulchres of yesterday’s prophets and stone the living ones'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'many are prone to garnish the sepulchres of yesterday’s prophets and mentally stone the living ones'
  - where: 'note 44:17 “The queen of heaven”'
    claim: 'The Church edition identifies the queen of heaven as a fertility goddess such as Ishtar'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/44?lang=eng'
    quote: 'the fertility goddess, such as the Babylonian Ishtar.'
  - where: 'note 44:17 “The queen of heaven”'
    claim: 'Jer. 7:18 describes the cakes and the whole family taking part'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/7?lang=eng'
    quote: 'The children gather wood, and the fathers kindle the fire, and the women knead their dough, to make cakes to the queen of heaven'
  - where: 'note 44:17 “The queen of heaven”'
    claim: 'Worship of heavenly bodies after Assyro-Babylonian religion was introduced under Manasseh; the queen of heaven cult is named at 7:18 and 44:19'
    key: ot-manual-23
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng'
    quote: 'there was introduced the worship of the heavenly planets in accordance with the dictates of the Assyro-Babylonian religion.'
  - where: 'note 44:17 “Their own mouth”'
    claim: 'D&C 1:16: every man walks in his own way after the image of his own god'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/1?lang=eng'
    quote: 'They seek not the Lord to establish his righteousness, but every man walketh in his own way, and after the image of his own god'
  - where: 'note 44:17 “Their own mouth”'
    claim: 'Kimball: whatever a man sets his heart and trust in most is his god; carnal man transfers trust to material things'
    key: kimball-false-gods
    url: 'https://www.churchofjesuschrist.org/study/ensign/1976/06/the-false-gods-we-worship?lang=eng'
    quote: 'Whatever thing a man sets his heart and his trust in most is his god; and if his god doesn’t also happen to be the true and living God of Israel, that man is laboring in idolatry.'
  - where: 'note 44:17 “Their own mouth”'
    claim: 'Kimball quotes D&C 1:16 on idolatry'
    key: kimball-false-gods
    url: 'https://www.churchofjesuschrist.org/study/ensign/1976/06/the-false-gods-we-worship?lang=eng'
    quote: 'As the Lord himself said in our day, “They seek not the Lord to establish his righteousness, but every man walketh in his own way, and after the image of his own God'
  - where: 'note 44:17 “Why it seemed to work”'
    claim: 'The people reasoned post hoc from Josiah’s reform to later misfortune'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/44.htm'
    quote: 'No doubt they inferred this, by the argument post hoc, ergo propter hoc, from the fact that, after idolatry had been rooted out by Josiah, adversity had befallen the land of Judah'
  - where: 'note 44:17 “Why it seemed to work”'
    claim: 'Jeremiah’s answer: their idolatry is the cause of the misfortune'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/44.htm'
    quote: 'Jeremiah answers them that their idol-worship, by which they have provoked the Lord their God, is the very cause of the misfortune that has befallen them'
  - where: 'note 44:17 “Why it seemed to work”'
    claim: 'The chapter is an example of rationalizing disobedience'
    key: ot-seminary-teacher-resource-jer-34-52
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-resource-manual/the-book-of-jeremiah/jeremiah-34-52?lang=eng'
    quote: 'This chapter is a good example of how people rationalize their disobedience.'
  - where: 'note 44:17 “Why it seemed to work”'
    claim: 'Seminary lesson: Jer. 44:22–23 refers to the destruction of Jerusalem'
    key: ot-seminary-teacher-137
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-jeremiah/lesson-137-jeremiah-42-52?lang=eng'
    quote: 'It refers to the destruction of Jerusalem described in verse 22.'
  - where: 'note 44:19 “Without our men”'
    claim: 'The women appeal to their husbands’ knowledge and approval; under Num. 30 a husband could annul a wife’s vow (one reading)'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/44.htm'
    quote: 'the husband could annul, i.e., declare not binding, any vow which had been made by his wife without his knowledge.'
  - where: 'note 44:19 “Without our men”'
    claim: 'The assembly was probably a festival for the queen of heaven (one reading)'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/44.htm'
    quote: 'we may conclude that the assembly was a festival in honour of the queen of heaven.'
  - where: 'note 44:26 “The oath by His great name”'
    claim: 'God swears by himself (Abraham) because He can swear by no greater'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/6?lang=eng'
    quote: 'For when God made promise to Abraham, because he could swear by no greater, he sware by himself'
  - where: 'note 44:26 “The oath by His great name”'
    claim: 'The Lord will not suffer His name to be polluted (Isa. 48:11 = 1 Ne. 20:11)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/20?lang=eng'
    quote: 'for I will not suffer my name to be polluted, and I will not give my glory unto another.'
  - where: 'note 44:27 “The same watching as in chapter 31”'
    claim: 'Jer. 31:28 uses the same verb: watched to pluck up and to break down, so will watch to build and plant'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/31?lang=eng'
    quote: 'like as I have watched over them, to pluck up, and to break down, and to throw down, and to destroy, and to afflict; so will I watch over them, to build, and to plant, saith the Lord.'
  - where: 'note 44:27 “The same watching as in chapter 31”'
    claim: 'The verb in 44:27 is Strong’s 8245 (shaqad)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/jeremiah/44-27.htm'
    quote: 'Berean Study Bible        I am watching   over them   for harm   and not   for good'
  - where: 'note 44:27 “The same watching as in chapter 31”'
    claim: 'The same Hebrew verb (8245) is in 31:28 both times'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/jeremiah/31-28.htm'
    quote: 'so   I will watch   over them   to build   and to plant'
  - where: 'note 44:27 “The same watching as in chapter 31”'
    claim: 'shaqad: keep watch of, be wakeful over, the Lord watching over people to benefit or injure (Jer. 31:28; 44:27); over a thing to perform it (Jer. 1:12)'
    key: bdb
    url: 'https://biblehub.com/hebrew/8245.htm'
    quote: 'keep watch of, be wakeful over, ׳ י subject, עַל person, to benefit or injure Jeremiah 31:28 (twice in verse); Jeremiah 44:27 ; עַל thing, to perform it Jeremiah 1:12'
  - where: 'note 44:28 “Whose word stands”'
    claim: 'Only a few would survive and return as a witness that the Lord’s word was fulfilled'
    key: ot-seminary-guide-jer-37-44
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-student-study-guide-obs/the-book-of-jeremiah/jeremiah-37-44-babylon-conquers-judah?lang=eng'
    quote: 'only a few would survive and return to Judah as a witness that the Lord’s word was fulfilled.'
  - where: 'note 44:30 “The sign of Pharaoh Hophra”'
    claim: 'Zedekiah was taken by the Chaldeans and brought to Nebuchadnezzar at Riblah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/39?lang=eng'
    quote: 'the Chaldeans’ army pursued after them, and overtook Zedekiah in the plains of Jericho: and when they had taken him, they brought him up to Nebuchadnezzar king of Babylon to Riblah'
  - where: 'note 44:30 “The sign of Pharaoh Hophra”'
    claim: 'Jer. 46:25–26 also names Pharaoh and Egypt as delivered to Nebuchadnezzar and those who seek their lives'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/46?lang=eng'
    quote: 'I will punish the multitude of No, and Pharaoh, and Egypt, with their gods, and their kings; even Pharaoh, and all them that trust in him: And I will deliver them into the hand of those that seek their lives'
  - where: 'note 44:30 “The sign of Pharaoh Hophra”'
    claim: 'The sign is Hophra’s being given up to his enemies; Hophra is Apries, who was killed after Amasis took him (Herodotus as reported); Keil says the verse does not require that Nebuchadnezzar killed him'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/44.htm'
    quote: 'Amasis - who took Apris prisoner, and gave him up to the common people, who killed him (Herod. ii.-161-163, 169)'
  - where: 'note 44:30 “The sign of Pharaoh Hophra”'
    claim: 'Keil: the words do not require that Nebuchadnezzar himself killed Hophra'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/44.htm'
    quote: 'do not require us to assume that Hophra was killed by Nebuchadnezzar, and can very well be harmonized with the notice of Herodotus regarding the death of this king.'
  - where: 'christ'
    claim: 'God spoke in time past by the prophets and in these last days by His Son'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/1?lang=eng'
    quote: 'God, who at sundry times and in divers manners spake in time past unto the fathers by the prophets, Hath in these last days spoken unto us by his Son'
  - where: 'christ'
    claim: 'Nephi son of Helaman: Jerusalem was destroyed according to Jeremiah’s words; why not the Son of God come according to his prophecy'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/hel/8?lang=eng'
    quote: 'now we know that Jerusalem was destroyed according to the words of Jeremiah. O then why not the Son of God come, according to his prophecy?'
  - where: 'explore'
    claim: 'Jeremiah’s stones at Tahpanhes and the throne of Nebuchadnezzar'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/43?lang=eng'
    quote: 'will set his throne upon these stones that I have hid'
  - where: 'setting'
    claim: 'Jeremiah took the Lord’s answer; the survivors were told to stay (Jer. 42:15–16 is the warning)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/43?lang=eng'
    quote: 'took all the remnant of Judah, that were returned from all nations, whither they had been driven, to dwell in the land of Judah; Even men, and women, and children, and the king’s daughters'
  - where: 'note 44:19 “Without our men”'
    claim: 'The women’s statement is put forward as self-vindication'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/44.htm'
    quote: 'This is put forward by the women in the way of self-vindication'
  - where: 'note 44:16 “A prophet whom people would rather not hear”'
    claim: 'The manual presents Jeremiah as driven out and compelled to live in Egypt, rejected by Judah’s leaders'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'He delivered the message that the Lord gave him, but he ended up in prison. Eventually he was driven out of Israel and compelled to live in Egypt.'
  - where: 'note 44:16 “A prophet whom people would rather not hear”'
    claim: 'Benson, Fourteen Fundamentals: popularity is never a test of truth'
    key: benson-fourteen
    url: 'https://speeches.byu.edu/talks/ezra-taft-benson/fourteen-fundamentals-following-prophet/'
    quote: 'Popularity is never a test of truth. Many a prophet has been killed or cast out.'
  - where: 'note 44:16 “A prophet whom people would rather not hear”'
    claim: 'Benson, Fourteen Fundamentals: response to a living prophet is a test of faithfulness'
    key: benson-fourteen
    url: 'https://speeches.byu.edu/talks/ezra-taft-benson/fourteen-fundamentals-following-prophet/'
    quote: 'How we respond to the words of a living prophet when he tells us what we need to know, but would rather not hear, is a test of our faithfulness.'
  - where: 'note 44:16 “A prophet whom people would rather not hear”'
    claim: 'Judah’s leaders cast aside Jeremiah’s words'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'The evil people, particularly the leaders of Judah, cast aside his words as naught.'
  - where: 'note 44:17 “The queen of heaven”'
    claim: 'The worship of the queen of heaven is listed among the idolatry Jeremiah found (7:18; 44:19)'
    key: ot-manual-23
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng'
    quote: 'Jeremiah therefore found idolatry, hill-worship, and heathen religious practices rampant among his people.'
  - where: 'note 44:17 “The queen of heaven”'
    claim: 'The queen of heaven worship named alongside it'
    key: ot-manual-23
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng'
    quote: 'The worship of the ‘queen of Heaven’ ought also to be mentioned. (7:18; 44:19)'
  - where: 'note 44:30 “The sign of Pharaoh Hophra”'
    claim: 'Pharaoh Hophra sent an army to help Zedekiah'
    key: bd-pharaoh
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/pharaoh?lang=eng'
    quote: 'Pharaoh Hophra, who sent an army to the assistance of Zedekiah ( Jer. 37:5–11'
  - where: 'note 44:26 “The oath by His great name”'
    claim: 'The Church edition footnotes Heb. 6:13 at Jer. 44:26 (followed by 1 Ne. 20:11)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/44?lang=eng'
    quote: 'Heb. 6:13 .'
