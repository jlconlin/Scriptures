chapter: 15
claims:
  - where: 'when'
    claim: 'The Bible Dictionary groups chapters 7–20 under Jehoiakim (608–597)'
    key: bd-jeremiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng
    quote: 'Prophecies under Jehoiakim (608–597), Jer. 7–20.'
  - where: 'setting'
    claim: 'The Church heading summarizes the chapter'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/15?lang=eng
    quote: 'The people of Judah will suffer death, the sword, famine, and captivity—They will be scattered into all the kingdoms of the earth—Jerusalem will be destroyed.'
  - where: 'setting'
    claim: 'The Church edition begins new paragraphs (¶) at verses 10, 15, and 19'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/15?lang=eng
    quote: '19 ¶ Therefore thus saith the Lord, If thou return, then will I bring thee again'
  - where: 'setting'
    claim: 'Chapters 14–15 are one discussion about a drought; the Lord refuses intercession and the prophet complains of persecution and is comforted'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'a discussion between Jeremiah and the Lord concerning a great drought and the effects attending it'
  - where: 'setting'
    claim: 'Jeremiah faced continuous opposition and insult'
    key: bd-jeremiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng
    quote: 'He had to face continuous opposition and insult from the priests (20:2), the mob (26:8–9), his townsmen at Anathoth (11:19)'
  - where: 'thread'
    claim: 'The Church edition footnote glosses “return” in verse 19 as “repent”'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/15?lang=eng
    quote: 'OR repent.'
  - where: 'note 15:1 “Why Moses and Samuel”'
    claim: 'Moses and Samuel are the intercessory prophets, praised in Psalm 99:6 and remembered in Jeremiah 15:1'
    key: richardson-prophet-leader
    url: https://rsc.byu.edu/vol-9-no-1-2008/prophet-leader
    quote: 'The intercessory prophets (especially Moses and Samuel) were praised in song (Psalm 99:6), nostalgically remembered by other prophets (Jeremiah 15:1)'
  - where: 'note 15:1 “Why Moses and Samuel”'
    claim: 'Moses interceded after the golden calf and the Lord relented'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/ex/32?lang=eng
    quote: 'And the Lord repented of the evil which he thought to do unto his people.'
  - where: 'note 15:1 “Why Moses and Samuel”'
    claim: 'Moses offered to be blotted out of the Lord''s book for the people'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/ex/32?lang=eng
    quote: 'if not, blot me, I pray thee, out of thy book which thou hast written.'
  - where: 'note 15:1 “Why Moses and Samuel”'
    claim: 'Samuel cried to the Lord for Israel and the Lord heard him'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/7?lang=eng
    quote: 'Samuel cried unto the Lord for Israel; and the Lord heard him.'
  - where: 'note 15:1 “Why Moses and Samuel”'
    claim: 'Psalm 99:6 names Moses and Samuel among those who called on the Lord and were answered'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/ps/99?lang=eng
    quote: 'Moses and Aaron among his priests, and Samuel among them that call upon his name; they called upon the Lord, and he answered them.'
  - where: 'note 15:1 “Why Moses and Samuel”'
    claim: 'Samuel said he would not cease praying for Israel'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/12?lang=eng
    quote: 'God forbid that I should sin against the Lord in ceasing to pray for you'
  - where: 'note 15:1 “Why Moses and Samuel”'
    claim: 'Samuel was the great prophet and judge of Israel'
    key: bd-samuel
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/samuel?lang=eng
    quote: 'he became the great prophet and judge of Israel'
  - where: 'note 15:1 “Why Moses and Samuel”'
    claim: 'The Lord had already told Jeremiah not to pray for this people (chapter 14)'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/14?lang=eng
    quote: 'Then said the Lord unto me, Pray not for this people for their good.'
  - where: 'note 15:1 “Why Moses and Samuel”'
    claim: 'Jeremiah interceded in chapter 14 and persisted, as Moses did'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'Compare Jeremiah’s enduring love for his rebellious people with that of Moses (see Exodus 32:31–32) and Mormon (see Mormon 2:10–14).'
  - where: 'note 15:2 “Four fates and four destroyers”'
    claim: 'The instruction of verse 2 is a sarcastic direction: each to his allotted destruction'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/15.htm
    quote: 'Jeremiah is to give them the sarcastic direction: Each to the destruction allotted to him.'
  - where: 'note 15:2 “Four fates and four destroyers”'
    claim: 'On one reading “death” beside the sword is death by disease (cf. Jer. 14:12)'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/15.htm
    quote: 'The "death" mentioned over and above the sword is death by disease, for which we have in Jeremiah 14:12'
  - where: 'note 15:2 “Four fates and four destroyers”'
    claim: 'Verse 3''s other three powers act on the dead'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/15.htm
    quote: 'the three others are to execute judgment on the dead: the dogs which shall tear, mutilate, and partly devour the dead bodies'
  - where: 'note 15:2 “Four fates and four destroyers”'
    claim: 'Jeremiah 14:12 names sword, famine, pestilence'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/14?lang=eng
    quote: 'but I will consume them by the sword, and by the famine, and by the pestilence.'
  - where: 'note 15:2 “Four fates and four destroyers”'
    claim: 'The Church edition links verse 3 to D&C 29:20'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/15?lang=eng
    quote: 'D&C 29:20.'
  - where: 'note 15:2 “Four fates and four destroyers”'
    claim: 'D&C 29:20: beasts and fowls devour them'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/29?lang=eng
    quote: 'the beasts of the forest and the fowls of the air shall devour them up.'
  - where: 'note 15:4 “Why a king long dead is blamed”'
    claim: 'Manasseh raised altars for Baal and worshipped the host of heaven'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/21?lang=eng
    quote: 'he reared up altars for Baal, and made a grove, as did Ahab king of Israel; and worshipped all the host of heaven, and served them.'
  - where: 'note 15:4 “Why a king long dead is blamed”'
    claim: 'Manasseh shed much innocent blood'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/21?lang=eng
    quote: 'Manasseh shed innocent blood very much, till he had filled Jerusalem from one end to another'
  - where: 'note 15:4 “Why a king long dead is blamed”'
    claim: 'Manasseh seduced Judah to do more evil than the nations'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/21?lang=eng
    quote: 'Manasseh seduced them to do more evil than did the nations whom the Lord destroyed'
  - where: 'note 15:4 “Why a king long dead is blamed”'
    claim: 'Kings says the removal of Judah came for the sins of Manasseh'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng
    quote: 'to remove them out of his sight, for the sins of Manasseh, according to all that he did'
  - where: 'note 15:4 “Why a king long dead is blamed”'
    claim: 'Josiah''s turning to the Lord did not turn the Lord from his wrath because of Manasseh'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/23?lang=eng
    quote: 'Notwithstanding the Lord turned not from the fierceness of his great wrath, wherewith his anger was kindled against Judah, because of all the provocations that Manasseh had provoked him withal.'
  - where: 'note 15:4 “Why a king long dead is blamed”'
    claim: 'Chronicles reports that Manasseh, taken to Babylon, humbled himself and was restored'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/33?lang=eng
    quote: 'he besought the Lord his God, and humbled himself greatly before the God of his fathers'
  - where: 'note 15:6 “The Lord is tired of relenting”'
    claim: '“Weary with repenting” means weary of repeatedly relenting and giving Israel another chance'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'that is, with repeatedly relenting and giving Israel another chance. Nothing God did had worked; further delay was useless.'
  - where: 'note 15:6 “The Lord is tired of relenting”'
    claim: 'The Hebrew verb nacham; BDB lists Jer. 15:6 under “be sorry, moved to pity, have compassion”'
    key: bdb
    url: https://biblehub.com/hebrew/5162.htm
    quote: 'be sorry, moved to pity, have compassion , for others, absolute Jeremiah 15:6'
  - where: 'note 15:6 “The Lord is tired of relenting”'
    claim: 'BDB lists Exodus 32:14 (the Lord repented of the evil) under the same verb'
    key: bdb
    url: https://biblehub.com/hebrew/5162.htm
    quote: 'for ill done to others Exodus 32:12 ,14 (J)'
  - where: 'note 15:6 “The Lord is tired of relenting”'
    claim: 'Church edition footnote on verse 7 explains “fan them” as scatter them'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/15?lang=eng
    quote: 'IE scatter them.'
  - where: 'note 15:8 “Widows, and a mother of seven”'
    claim: 'Two readings of “mother of the young men”: the mother city, or the mothers of the youth or young warriors'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'The phrase “mother of the young men” (v. 8) is either a reference to the mother city, Jerusalem (see Clarke, Commentary, 4:295), or to the mothers of the youth or young warriors (see Keil and Delitzsch, Commentary, 8:1:257).'
  - where: 'note 15:8 “Widows, and a mother of seven”'
    claim: 'The mother of seven in verse 9 favors reading “the mother of the youth”'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/15.htm
    quote: 'upon the mother of the youth or young warrior. This view is favoured by the correspondence of the woman'
  - where: 'note 15:8 “Widows, and a mother of seven”'
    claim: 'The mothers perish because their sons have fallen in war'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/15.htm
    quote: 'give up the ghost and perish without succour, because their sons have fallen in war.'
  - where: 'note 15:8 “Widows, and a mother of seven”'
    claim: '“Sand of the sea” is a figure for a countless number'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/15.htm
    quote: '"Sand of the sea" is the figure for a countless number.'
  - where: 'note 15:8 “Widows, and a mother of seven”'
    claim: 'Seven as the perfect number of children given in blessing'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/15.htm
    quote: 'Seven as the perfect number of children given in blessing by God'
  - where: 'note 15:8 “Widows, and a mother of seven”'
    claim: 'Noon is when an attack is least expected'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/15.htm
    quote: 'at clear noontide, when one least looks for an attack.'
  - where: 'note 15:8 “Widows, and a mother of seven”'
    claim: 'Her sun sets before the evening of her life'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/15.htm
    quote: 'while it is still day, before the evening of her life has been reached'
  - where: 'note 15:8 “Widows, and a mother of seven”'
    claim: 'The picture shows that no age or sex will escape'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/15.htm
    quote: 'to lend vividness to the thought that no age and no sex will escape destruction'
  - where: 'note 15:10 “A man of strife”'
    claim: 'The Church edition sets a paragraph break at verse 10, and the speaker changes to Jeremiah'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/15?lang=eng
    quote: '10 ¶ Woe is me, my mother, that thou hast borne me a man of strife and a man of contention to the whole earth!'
  - where: 'note 15:10 “A man of strife”'
    claim: 'Jeremiah faced continuous opposition from priests, the mob, and his townsmen'
    key: bd-jeremiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng
    quote: 'He had to face continuous opposition and insult from the priests (20:2), the mob (26:8–9), his townsmen at Anathoth (11:19)'
  - where: 'note 15:10 “A man of strife”'
    claim: 'The address to his mother is not a reproach'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/15.htm
    quote: 'The apostrophe to his mother is significant of the depth of his sorrow, and is not to be understood as if he were casting any reproach on his mother'
  - where: 'note 15:10 “A man of strife”'
    claim: 'It is an appeal to his mother to share his sorrow, unlike Job''s curse on his birthday'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/15.htm
    quote: 'it is an appeal to his mother to share with him his sorrow at his lot. This lament is consequently very different from Job''s cursing of the day of his birth'
  - where: 'note 15:10 “A man of strife”'
    claim: 'His sorrow at God''s refusal of his petition overcomes him'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/15.htm
    quote: 'His sorrow at the rejection by God of his petition so overcomes the prophet'
  - where: 'note 15:10 “A man of strife”'
    claim: 'The second clause says he has not provoked the strife'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/15.htm
    quote: 'The second clause intimates that he has not provoked the strife and contention.'
  - where: 'note 15:10 “A man of strife”'
    claim: 'Lending and borrowing is a frequent occasion of strife'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/15.htm
    quote: 'Borrowing and lending is rather the frequent occasion of strife and ill-will;'
  - where: 'note 15:12 “Northern iron”'
    claim: 'The exposition of verses 12–14 is difficult and much debated'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/15.htm
    quote: 'the exposition of which is, however, difficult and much debated.'
  - where: 'note 15:12 “Northern iron”'
    claim: 'One reading takes “iron from the north” as the Chaldean empire, which the people cannot break'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/15.htm
    quote: 'As little as a man can break iron, will the Jewish people be able to break the hostile power of the north'
  - where: 'note 15:12 “Northern iron”'
    claim: 'The Hebrew of verse 11 can be read “I strengthen thee,” preferred by the same reading'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/15.htm
    quote: 'We prefer the latter rendering, because the saying: I afflict thee, is not true of God'
  - where: 'note 15:12 “Northern iron”'
    claim: 'On that reading the adversaries will turn to the prophet in supplication'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/15.htm
    quote: 'the adversaries of the prophet will, by the crushing power of the Chaldeans, be reduced to the condition of turning themselves in supplication to the prophet.'
  - where: 'note 15:12 “Northern iron”'
    claim: 'Verses 13–14 are close to Jeremiah 17:3'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/17?lang=eng
    quote: 'I will give thy substance and all thy treasures to the spoil, and thy high places for sin, throughout all thy borders.'
  - where: 'note 15:12 “Northern iron”'
    claim: 'The Church edition links verse 14 to Jer. 16:13 and 17:4'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/15?lang=eng
    quote: 'Jer. 16:13; 17:4.'
  - where: 'note 15:12 “Northern iron”'
    claim: 'Verse 14 includes Jeremiah himself being carried into an unknown land'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'Even Jeremiah himself would be carried “into a land which [he] knowest not” (Jeremiah 15:14).'
  - where: 'note 15:12 “Northern iron”'
    claim: 'Chapter 1 names the north as the source of the disaster'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/1?lang=eng
    quote: 'I see a seething pot; and the face thereof is toward the north.'
  - where: 'note 15:15 “The prophet pleads his own case”'
    claim: 'Jeremiah pleads for himself; he had been faithful'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'Jeremiah then began to plead for himself. He, at least, had been faithful, even if Judah had not.'
  - where: 'note 15:15 “The prophet pleads his own case”'
    claim: 'Church edition footnote: Hebrew “taunts” for rebuke'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/15?lang=eng
    quote: 'HEB taunts.'
  - where: 'note 15:15 “The prophet pleads his own case”'
    claim: '“Because of thy hand” means because the Lord''s hand laid hold on him; he avoided cheerful company'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/15.htm
    quote: 'Because of Thy hand, i.e., because Thy hand had laid hold on me.'
  - where: 'note 15:15 “The prophet pleads his own case”'
    claim: 'The indignation is God''s wrath against Judah with which the Spirit filled Jeremiah so he could declare it'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/15.htm
    quote: 'is the wrath of God against the moral corruptness and infatuation of Judah, with which the Spirit of God has filled Jeremiah in order that he may publish it abroad'
  - where: 'note 15:15 “The prophet pleads his own case”'
    claim: 'The sadness of his message kept him from cheerful company'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/15.htm
    quote: 'constrained him to keep far from all cheery good fellowship.'
  - where: 'note 15:16 “Eating the word”'
    claim: 'Ezekiel is told to eat the roll and it is sweet as honey'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/3?lang=eng
    quote: 'Then did I eat it; and it was in my mouth as honey for sweetness.'
  - where: 'note 15:16 “Eating the word”'
    claim: 'John eats the little book; sweet in the mouth, bitter in the belly'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/nt/rev/10?lang=eng
    quote: 'it shall make thy belly bitter, but it shall be in thy mouth sweet as honey.'
  - where: 'note 15:16 “Eating the word”'
    claim: 'The Church edition footnotes link verse 16 to Ezek. 3:3, Rev. 10:10 and D&C 18:27'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/15?lang=eng
    quote: 'Ezek. 3:3 (1, 3); Rev. 10:10 (9–10). D&C 18:27.'
  - where: 'note 15:16 “Eating the word”'
    claim: 'D&C 18:27: the Twelve take upon them the Lord''s name'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/18?lang=eng
    quote: 'and they shall take upon them my name'
  - where: 'note 15:18 “A brook that fails”'
    claim: 'The Hebrew word (akzab) means deceptive, disappointing; used of a deceptive stream in Jer. 15:18'
    key: bdb
    url: https://biblehub.com/hebrew/391.htm
    quote: 'deceptive, disappointing stream (compare Isaiah 58:11 ) Jeremiah 15:18'
  - where: 'note 15:18 “A brook that fails”'
    claim: 'BDB compares Job 6:15 for the meaning'
    key: bdb
    url: https://biblehub.com/hebrew/391.htm
    quote: 'on meaning compare Job 6:15 ff.'
  - where: 'note 15:18 “A brook that fails”'
    claim: 'Job 6:15 compares brethren to a brook that passes away'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/job/6?lang=eng
    quote: 'My brethren have dealt deceitfully as a brook, and as the stream of brooks they pass away;'
  - where: 'note 15:19 “If thou return”'
    claim: 'Church edition footnote: “return” OR repent'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/15?lang=eng
    quote: 'OR repent.'
  - where: 'note 15:19 “If thou return”'
    claim: 'On one reading “if thou return” carries a reproach that Jeremiah had sinned in his complaint'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/15.htm
    quote: 'In the words: if thou return, lies the reproach that in his complaint, in which his indignation had hurried him on to doubt God''s faithfulness, Jeremiah had sinned and must repent.'
  - where: 'note 15:19 “If thou return”'
    claim: '“Stand before me” is the standing of a servant before his lord to receive his commands'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/15.htm
    quote: 'of the standing of the servant before his lord, to receive his commands, and so also of prophets'
  - where: 'note 15:19 “If thou return”'
    claim: '“As my mouth” means the instrument by which the Lord speaks'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/15.htm
    quote: 'as my mouth shalt thou be, i.e., as the instrument by which I speak, cf. Exodus 4:16.'
  - where: 'note 15:19 “If thou return”'
    claim: 'Separating the precious from the vile is a figure from metal-refining'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/15.htm
    quote: 'we have the figure of metal-refining, in course of which the pure metal is by fusion parted from the earthy and other ingredients mixed with it.'
  - where: 'note 15:19 “If thou return”'
    claim: 'The figure is variously understood'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/15.htm
    quote: 'The meaning of the figure is, however, variously understood.'
  - where: 'note 15:19 “If thou return”'
    claim: 'The same reading takes it as freeing his virtues from impatience and anger'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/15.htm
    quote: 'si virtutes quas habes maculis liberaveris impatientiae et iracundiae'
  - where: 'note 15:19 “If thou return”'
    claim: '“Return not thou unto them” means not yielding to their wishes'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/15.htm
    quote: 'but thou shalt not turn thyself to them, i.e., not yield to their wishes or permit thyself to be moved by them from the right way.'
  - where: 'note 15:19 “If thou return”'
    claim: '“Return” in verse 19 is the Hebrew verb shuv (Strong''s 7725)'
    key: biblehub-interlinear
    url: https://biblehub.com/interlinear/jeremiah/15-19.htm
