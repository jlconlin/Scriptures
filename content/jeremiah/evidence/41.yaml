chapter: 41
claims:
  - where: 'setting'
    claim: 'Church chapter heading: Ishmael kills Gedaliah, carries Mizpah captive, rescued by Johanan'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/41?lang=eng'
    quote: 'Ishmael kills Gedaliah and carries the people of Mizpah captive—They are rescued by Johanan.'
  - where: 'setting'
    claim: 'Jerusalem fell in 586 B.C.; Jeremiah prophesied until after the downfall'
    key: bd-jeremiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng'
    quote: 'prophesied from the 13th year of Josiah till after the downfall of Jerusalem, a period of over 40 years, 626–586 B.C.'
  - where: 'setting'
    claim: 'Nebuchadnezzar made Gedaliah ruler over those left in Judah; he governed from Mizpah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/25?lang=eng'
    quote: 'And as for the people that remained in the land of Judah, whom Nebuchadnezzar king of Babylon had left, even over them he made Gedaliah the son of Ahikam, the son of Shaphan, ruler.'
  - where: 'setting'
    claim: 'Jeremiah went to Gedaliah at Mizpah and lived among the people left in the land'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/40?lang=eng'
    quote: 'Then went Jeremiah unto Gedaliah the son of Ahikam to Mizpah; and dwelt with him among the people that were left in the land.'
  - where: 'setting'
    claim: 'Seventh month; 2 Kings 25 records the same murder'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/25?lang=eng'
    quote: 'But it came to pass in the seventh month, that Ishmael the son of Nethaniah, the son of Elishama, of the seed royal, came, and ten men with him, and smote Gedaliah, that he died'
  - where: 'thread'
    claim: 'Only verse 5 names the LORD (the house of the LORD); the chapter has no word of the Lord. Chapter 42 opens with the people asking Jeremiah to pray'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/42?lang=eng'
    quote: 'Let, we beseech thee, our supplication be accepted before thee, and pray for us unto the Lord thy God, even for all this remnant'
  - where: 'note 41:1 “A guest who came to kill”'
    claim: 'Baalis king of the Ammonites had sent Ishmael to kill Gedaliah (Johanan'' warning)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/40?lang=eng'
    quote: 'Dost thou certainly know that Baalis the king of the Ammonites hath sent Ishmael the son of Nethaniah to slay thee? But Gedaliah the son of Ahikam believed them not.'
  - where: 'note 41:1 “A guest who came to kill”'
    claim: 'Gedaliah refused Johanan''s offer to kill Ishmael secretly'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/40?lang=eng'
    quote: 'Thou shalt not do this thing: for thou speakest falsely of Ishmael.'
  - where: 'note 41:1 “A guest who came to kill”'
    claim: 'Elishama may be the son of David of that name, making Ishmael a lateral branch of the royal house (one reading)'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/41.htm'
    quote: 'perhaps the secretary of state mentioned Jeremiah 36:12, or more likely the son of David who bore this name, 2 Samuel 5:6; 1 Chronicles 3:8; 1 Chronicles 14:7; so that Ishmael would belong to a lateral branch of the house of David'
  - where: 'note 41:1 “A guest who came to kill”'
    claim: 'Keil: Ishmael was received hospitably and invited to Gedaliah''s table; the fuller description heightens the cruelty'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/41.htm'
    quote: 'was hospitably received by Gedaliah and invited to his table. Ishmael is here more exactly described as to his family descent, for the purpose of throwing a stronger light upon the exceeding cruelty'
  - where: 'note 41:2 “Gedaliah, son of Ahikam”'
    claim: 'Ahikam son of Shaphan sided with Jeremiah when the people wanted him put to death'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/26?lang=eng'
    quote: 'Nevertheless the hand of Ahikam the son of Shaphan was with Jeremiah, that they should not give him into the hand of the people to put him to death.'
  - where: 'note 41:2 “Gedaliah, son of Ahikam”'
    claim: 'Shaphan was a scribe; Ahikam and Shaphan were sent by Josiah with Hilkiah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/22?lang=eng'
    quote: 'And the king commanded Hilkiah the priest, and Ahikam the son of Shaphan, and Achbor the son of Michaiah, and Shaphan the scribe, and Asahiah a servant of the king’s, saying,'
  - where: 'note 41:2 “Gedaliah, son of Ahikam”'
    claim: 'The Babylonians committed Jeremiah to Gedaliah, taking him out of the court of the prison'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/39?lang=eng'
    quote: 'Even they sent, and took Jeremiah out of the court of the prison, and committed him unto Gedaliah the son of Ahikam the son of Shaphan, that he should carry him home: so he dwelt among the people.'
  - where: 'note 41:2 “Gedaliah, son of Ahikam”'
    claim: 'Gedaliah swore to the captains: serve the king of Babylon and it shall be well; he would dwell at Mizpah to serve the Chaldeans'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/40?lang=eng'
    quote: 'Fear not to serve the Chaldeans: dwell in the land, and serve the king of Babylon, and it shall be well with you.'
  - where: 'note 41:2 “Gedaliah, son of Ahikam”'
    claim: 'Jews from Moab, Ammon, Edom and elsewhere returned to Gedaliah at Mizpah and gathered wine and summer fruits'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/40?lang=eng'
    quote: 'Even all the Jews returned out of all places whither they were driven, and came to the land of Judah, to Gedaliah, unto Mizpah, and gathered wine and summer fruits very much.'
  - where: 'note 41:5 “Eighty men from Shechem, Shiloh, and Samaria”'
    claim: 'The men were pious descendants of Israelites of the northern kingdom who kept coming to the sanctuary site with grain offerings and incense, in mourning for its destruction; the order of towns is not geographical'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/41.htm'
    quote: 'These men were pious descendants of the Israelites who belonged to the kingdom of Israel; … but, from the days of Hezekiah or Josiah, had continued to serve Jahveh in Jerusalem, where they used to attend the feasts'
  - where: 'note 41:5 “Eighty men from Shechem, Shiloh, and Samaria”'
    claim: 'Still came with offerings after the destruction, appearing with signs of deep sorrow for the destruction of the holy place'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/41.htm'
    quote: 'even after the destruction of Jerusalem, at the seasons of the sacred feasts, they were still content to bring at least unbloody offerings - meat-offerings and incense'
  - where: 'note 41:5 “Beards shaven, cuts in the flesh”'
    claim: 'Jeremiah 16:6 mourners cut themselves and made themselves bald'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/16?lang=eng'
    quote: 'Both the great and the small shall die in this land: they shall not be buried, neither shall men lament for them, nor cut themselves, nor make themselves bald for them'
  - where: 'note 41:5 “Beards shaven, cuts in the flesh”'
    claim: 'Moab''s mourning: every head bald, every beard clipped, cuttings on the hands'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/48?lang=eng'
    quote: 'For every head shall be bald, and every beard clipped: upon all the hands shall be cuttings, and upon the loins sackcloth.'
  - where: 'note 41:5 “Beards shaven, cuts in the flesh”'
    claim: 'The law forbade cuttings in the flesh for the dead'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/19?lang=eng'
    quote: 'Ye shall not make any cuttings in your flesh for the dead, nor print any marks upon you: I am the Lord.'
  - where: 'note 41:5 “Beards shaven, cuts in the flesh”'
    claim: 'Deuteronomy: children of the Lord shall not cut themselves for the dead'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/14?lang=eng'
    quote: 'Ye are the children of the Lord your God: ye shall not cut yourselves, nor make any baldness between your eyes for the dead.'
  - where: 'note 41:5 “Beards shaven, cuts in the flesh”'
    claim: 'The priests'' law forbade shaving the corner of the beard and cuttings'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/21?lang=eng'
    quote: 'They shall not make baldness upon their head, neither shall they shave off the corner of their beard, nor make any cuttings in their flesh.'
  - where: 'note 41:9 “Asa''s pit”'
    claim: 'Asa used Baasha''s Ramah stones and timber to build Geba and Mizpah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/15?lang=eng'
    quote: 'and they took away the stones of Ramah, and the timber thereof, wherewith Baasha had builded; and king Asa built with them Geba of Benjamin, and Mizpah.'
  - where: 'note 41:10 “The king''s daughters and Mulek”'
    claim: 'The king''s daughters were among those who went into Egypt with Johanan'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/43?lang=eng'
    quote: 'Even men, and women, and children, and the king’s daughters, and every person that Nebuzar-adan the captain of the guard had left with Gedaliah the son of Ahikam the son of Shaphan, and Jeremiah the prophet, and Baruch the son of Neriah.'
  - where: 'note 41:10 “The king''s daughters and Mulek”'
    claim: 'Mulek, the one son of Zedekiah to escape, is named in the Book of Mormon (Nephi son of Helaman)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/hel/8?lang=eng'
    quote: 'Will ye say that the sons of Zedekiah were not slain, all except it were Mulek? Yea, and do ye not behold that the seed of Zedekiah are with us'
  - where: 'note 41:10 “The king''s daughters and Mulek”'
    claim: 'Mulek likely sought refuge in Egypt, as did some of Zedekiah''s daughters (hypothesis)'
    key: sc-knowhy-753
    url: 'https://scripturecentral.org/knowhy/how-did-mulek-get-to-the-new-world'
    quote: 'The most viable way to keep Mulek safe would have been to seek refuge in Egypt, just as other Israelites were doing at that time, including some of Zedekiah’s daughters (see Jeremiah 43:1–6).'
  - where: 'note 41:10 “The king''s daughters and Mulek”'
    claim: 'Mosiah found that the people of Zarahemla came out of Jerusalem when Zedekiah was carried away'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/omni/1?lang=eng'
    quote: 'Mosiah discovered that the people of Zarahemla came out from Jerusalem at the time that Zedekiah, king of Judah, was carried away captive into Babylon.'
  - where: 'note 41:11 “Johanan, rescuer and then rebel”'
    claim: 'Johanan organized an army, attacked Ishmael, freed prisoners; the Jews then moved near Bethlehem intending Egypt'
    key: ot-seminary-guide-jer-37-44
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-student-study-guide-obs/the-book-of-jeremiah/jeremiah-37-44-babylon-conquers-judah?lang=eng'
    quote: 'Johanan organized an army and attacked Ishmael’s men, killing many, taking others as prisoners, and freeing prisoners taken in the attack on Gedaliah.'
  - where: 'note 41:11 “Johanan, rescuer and then rebel”'
    claim: 'Johanan warned Gedaliah (40:13–16) and was refused'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/40?lang=eng'
    quote: 'Let me go, I pray thee, and I will slay Ishmael the son of Nethaniah, and no man shall know it'
  - where: 'note 41:11 “Johanan, rescuer and then rebel”'
    claim: 'Johanan and the proud men told Jeremiah he spoke falsely and obeyed not the voice of the Lord'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/43?lang=eng'
    quote: 'Then spake Azariah the son of Hoshaiah, and Johanan the son of Kareah, and all the proud men, saying unto Jeremiah, Thou speakest falsely'
  - where: 'note 41:12 “The great waters at Gibeon”'
    claim: 'Church edition footnote: great waters = or many pools'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/41?lang=eng'
    quote: 'OR many pools.'
  - where: 'note 41:16 “Eunuchs, or court officials”'
    claim: 'Church edition footnote: eunuchs = or courtiers or officials'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/41?lang=eng'
    quote: 'OR courtiers or officials.'
  - where: 'note 41:16 “Eunuchs, or court officials”'
    claim: 'Eunuchs were attached to eastern courts, often trusted officials'
    key: bd-eunuch
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/eunuch?lang=eng'
    quote: 'A class of emasculated men attached to the courts of eastern rulers. They were employed to watch over the harems and also were often given positions as trusted officials.'
  - where: 'note 41:17 “The habitation of Chimham”'
    claim: 'Chimham, son of Barzillai, went over the Jordan with David'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/19?lang=eng'
    quote: 'But behold thy servant Chimham; let him go over with my lord the king; and do to him what shall seem good unto thee.'
  - where: 'note 41:17 “The habitation of Chimham”'
    claim: 'Reading Chimham (Qere) as son of Barzillai; the place perhaps a caravanserai built for travellers; kethib differs'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/41.htm'
    quote: 'the name of a son of Barzillai the rich Gileadite, 2 Samuel 19:38, 2 Samuel 19:41, who is supposed to have built or founded this caravanserai for the convenience of travellers.'
  - where: 'note 41:17 “The habitation of Chimham”'
    claim: 'Bible Dictionary lists Jer. 41:17 under Bethlehem-Judah, five miles south of Jerusalem, and as Christ''s birthplace'
    key: bd-bethlehem
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/bethlehem?lang=eng'
    quote: '(1) Bethlehem-Judah, also called Ephrath (Gen. 35:19; 48:7), five miles south of Jerusalem'
  - where: 'note 41:18 “Why they ran for Egypt”'
    claim: 'Fear of Babylon after the murder; the Babylonian garrison had been killed; Gedaliah''s killing prompted flight to Egypt'
    key: ot-seminary-guide-jer-37-44
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-student-study-guide-obs/the-book-of-jeremiah/jeremiah-37-44-babylon-conquers-judah?lang=eng'
    quote: 'Worried about the Babylonians’ reaction to the Jews because of what happened, all the Jews moved from Mizpah to an area close to Bethlehem called Chimham. From there they intended to go to Egypt for safety.'
  - where: 'note 41:18 “Why they ran for Egypt”'
    claim: 'The people ask Jeremiah to pray; the Lord says stay and He will build and plant, not pull down and pluck up; they answer No, we will go into Egypt'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/42?lang=eng'
    quote: 'If ye will still abide in this land, then will I build you, and not pull you down, and I will plant you, and not pluck you up'
  - where: 'note 41:18 “Why they ran for Egypt”'
    claim: 'They answered No; we will go to Egypt where we shall see no war'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/42?lang=eng'
    quote: 'No; but we will go into the land of Egypt, where we shall see no war, nor hear the sound of the trumpet, nor have hunger of bread'
  - where: 'christ'
    claim: 'Bethlehem is Christ''s birthplace (Bible Dictionary) and Micah 5:2'
    key: bd-bethlehem
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/bethlehem?lang=eng'
    quote: 'Christ’s birthplace (Matt. 2:1–8; see also Micah 5:2; Luke 2:4, 15; John 7:42)'
  - where: 'christ'
    claim: 'Joseph took the child into Egypt; fulfilled Out of Egypt have I called my son'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/2?lang=eng'
    quote: 'When he arose, he took the young child and his mother by night, and departed into Egypt'
  - where: 'christ'
    claim: 'Micah 5:2: out of Bethlehem Ephratah shall come the ruler in Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/micah/5?lang=eng'
    quote: 'But thou, Beth-lehem Ephratah, though thou be little among the thousands of Judah, yet out of thee shall he come forth unto me that is to be ruler in Israel'
  - where: 'note 41:18 “Why they ran for Egypt”'
    claim: 'Ishmael also killed the Babylonians who were with Gedaliah'
    key: ot-seminary-guide-jer-37-44
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-student-study-guide-obs/the-book-of-jeremiah/jeremiah-37-44-babylon-conquers-judah?lang=eng'
    quote: 'Ishmael and his men also killed all who were living with Gedaliah, whether they were Jews or Babylonians.'
  - where: 'setting'
    claim: 'The murder came only about two months after the destruction of Jerusalem (one reading)'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/41.htm'
    quote: 'In the seventh month - only two months, therefore, after the destruction of Jerusalem and the appointment of Gedaliah as governor'
  - where: 'note 41:5 “Eighty men from Shechem, Shiloh, and Samaria”'
    claim: 'They appeared with all the signs of deep sorrow for the destruction of the holy place'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/41.htm'
    quote: 'they appeared there with all the signs of deep sorrow for the destruction of this holy place and the cessation of sacrificial worship'
  - where: 'note 41:8 “Ten men who bought their lives”'
    claim: 'The Hebrew matmonim (Jer. 41:8) means hidden treasure'
    key: bdb
    url: 'https://biblehub.com/hebrew/4301.htm'
    quote: 'מַטְמוֺן noun masculine hidden treasure, treasure ; — absolute מַטְמוֺן Genesis 43:23 ; plural מַטְמֹנִים Jeremiah 41:8'
  - where: 'section 2 plain'
    claim: 'The stores in the field were hidden (matmonim, hidden treasure)'
    key: bdb
    url: 'https://biblehub.com/hebrew/4301.htm'
    quote: 'מַטְמוֺן noun masculine hidden treasure, treasure'
  - where: 'note 41:9 “Asa''s pit”'
    claim: 'Baasha built Ramah to cut off traffic to Asa'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/15?lang=eng'
    quote: 'And Baasha king of Israel went up against Judah, and built Ramah, that he might not suffer any to go out or come in to Asa king of Judah.'
  - where: 'note 41:12 “The great waters at Gibeon”'
    claim: 'Gibeon was on a hill of Benjamin about five miles north of Jerusalem'
    key: bd-gibeon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/gibeon?lang=eng'
    quote: 'Formerly a city of the Hivites, on one of the hills of Benjamin, about five miles north of Jerusalem'
  - where: 'note 41:17 “The habitation of Chimham”'
    claim: 'In the next chapter the people ask Jeremiah to pray that the Lord show them the way'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/42?lang=eng'
    quote: 'That the Lord thy God may shew us the way wherein we may walk, and the thing that we may do.'
