chapter: 14
claims:
  - where: 'when'
    claim: 'The Bible Dictionary places Jeremiah 7–20 under Jehoiakim, 608–597'
    key: bd-jeremiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng
    quote: 'Prophecies under Jehoiakim (608–597), Jer. 7–20.'
  - where: 'setting'
    claim: 'The Church chapter heading: Jeremiah prays because of dearth and famine; the Lord will not hear'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/14?lang=eng
    quote: 'Jeremiah prays because of dearth and famine—The Lord will not hear because of the wickedness of His people.'
  - where: 'setting'
    claim: 'Chapters 14–15 are a discussion between Jeremiah and the Lord about a great drought'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'Jeremiah 14–15presents a discussion between Jeremiah and the Lord concerning a great drought and the effects attending it.'
  - where: 'setting'
    claim: 'Leading prophet in Jerusalem, serving with Lehi and others, surrounded by apostasy and popular professional prophets'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'was the leading prophet in Jerusalem, serving with Habakkuk, Zephaniah, Lehi, and others'
  - where: 'note 14:1 “A drought, and not the first”'
    claim: 'The Hebrew word is the plural of a noun for dearth'
    key: bdb
    url: https://biblehub.com/hebrew/1226.htm
    quote: 'plural בַּצָּרוֺת Jeremiah 14:1'
  - where: 'note 14:1 “A drought, and not the first”'
    claim: 'Drought is a calamity Judah often suffered; summers are normally dry'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'a calamity to which Judah was often subject. Ordinarily Judah’s summers are dry, for little rain falls from April to the middle of October.'
  - where: 'note 14:1 “A drought, and not the first”'
    claim: 'Moses warned that if the people served other gods the Lord would shut up the heaven so there would be no rain'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/deut/11?lang=eng
    quote: 'he shut up the heaven, that there be no rain, and that the land yield not her fruit'
  - where: 'note 14:1 “A drought, and not the first”'
    claim: 'Leviticus 26 lists the heaven as iron among the covenant penalties'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/lev/26?lang=eng
    quote: 'I will make your heaven as iron, and your earth as brass'
  - where: 'note 14:3 “Everyone, even the nobles”'
    claim: 'The wealthy were affected too'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'Everyone, even the wealthy, was affected by the drought'
  - where: 'note 14:3 “Everyone, even the nobles”'
    claim: 'Covering the head is a sign of grief, as with David fleeing Jerusalem'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/15?lang=eng
    quote: 'and wept as he went up, and had his head covered, and he went barefoot'
  - where: 'note 14:6 “Dragons or jackals”'
    claim: 'The Church edition footnote gives the Hebrew as jackals'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/14?lang=eng
    quote: 'HEB jackals.'
  - where: 'note 14:6 “Dragons or jackals”'
    claim: 'The Vulgate and Aramaic versions read dragons; the wild asses gasp for air like jackals'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/14.htm
    quote: 'Vulg. has dracones, with the Aram. versions'
  - where: 'note 14:6 “Dragons or jackals”'
    claim: 'Wild asses on the bare heights gasp for air'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/14.htm
    quote: 'The wild asses upon the bleak mountain-tops, where these animals choose to dwell, gasp for air'
  - where: 'note 14:7 “Who is praying”'
    claim: 'Jeremiah besought God to turn His wrath aside for His name’s sake; compared with Moses and Mormon'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'Jeremiah besought God to turn His wrath aside, if only “for thy name’s sake” (Jeremiah 14:7).'
  - where: 'note 14:7 “Who is praying”'
    claim: 'Jeremiah’s enduring love for his rebellious people compared to Moses and Mormon'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'Compare Jeremiah’s enduring love for his rebellious people with that of Moses (see Exodus 32:31–32) and Mormon (see Mormon 2:10–14).'
  - where: 'note 14:7 “Who is praying”'
    claim: 'Moses offered to be blotted out of the Lord’s book for Israel'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/ex/32?lang=eng
    quote: 'if thou wilt forgive their sin—; and if not, blot me, I pray thee, out of thy book which thou hast written.'
  - where: 'note 14:8 “The one the prayer is addressed to”'
    claim: 'Jehovah, the LORD of the Old Testament, is the premortal Jesus Christ'
    key: bd-jehovah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: 'note 14:8 “The one the prayer is addressed to”'
    claim: 'In the KJV the name Jehovah is generally printed LORD in small capitals'
    key: bd-jehovah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng
    quote: 'the name is generally denoted by Lord or God, printed in small capitals'
  - where: 'note 14:8 “The one the prayer is addressed to”'
    claim: 'Jeremiah 17:13 addresses the Lord as the hope of Israel and the fountain of living waters'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/17?lang=eng
    quote: 'O Lord, the hope of Israel, all that forsake thee shall be ashamed'
  - where: 'note 14:8 “A stranger in the land”'
    claim: 'The complaint is that God seems like a passing stranger rather than the owner and dweller among His people'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/14.htm
    quote: 'then He does not reveal Himself as the lord and owner of Judah, not as the God that dwells amidst His people'
  - where: 'note 14:8 “A stranger in the land”'
    claim: 'One reading: a traveler who pitches a tent for one night'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/14.htm
    quote: 'but He seems a stranger passing through the land, who sets up His tent there only to spend the night'
  - where: 'note 14:8 “A stranger in the land”'
    claim: '“We are called by thy name” means His name is named upon them'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/14.htm
    quote: 'Thy name is named upon us - O leave us not!'
  - where: 'note 14:11 “Pray not”'
    claim: 'The same command is given in Jer 7:16 and 11:14 (the Church edition’s footnote)'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/7?lang=eng
    quote: 'Therefore pray not thou for this people, neither lift up cry nor prayer for them, neither make intercession to me: for I will not hear thee.'
  - where: 'note 14:11 “Pray not”'
    claim: 'Jeremiah 11:14 repeats the command'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/11?lang=eng
    quote: 'Therefore pray not thou for this people, neither lift up a cry or prayer for them'
  - where: 'note 14:11 “Pray not”'
    claim: 'Not even Moses and Samuel would change the Lord’s mind (15:1)'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/15?lang=eng
    quote: 'Though Moses and Samuel stood before me, yet my mind could not be toward this people'
  - where: 'note 14:11 “Pray not”'
    claim: 'Jeremiah kept interceding after being told not to, because the false prophets had assured peace'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'But Jeremiah refused to desist because false prophets had lulled the people into sin by assuring them of peace (see v. 13).'
  - where: 'note 14:12 “When the Lord does not hear”'
    claim: 'Church edition footnote at verse 12 links to Mosiah 11:24 and D&C 101:7'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/14?lang=eng
    quote: 'Mosiah 11:24 (23–25); 21:15; D&amp;C 101:7 (6–8).'
  - where: 'note 14:12 “When the Lord does not hear”'
    claim: 'Abinadi: unless they repent in sackcloth and ashes the Lord will not hear their prayers'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/11?lang=eng
    quote: 'except they repent in sackcloth and ashes, and cry mightily to the Lord their God, I will not hear their prayers'
  - where: 'note 14:12 “When the Lord does not hear”'
    claim: 'Later the Lord was slow to hear, yet did hear and began to soften hearts'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/21?lang=eng
    quote: 'the Lord was slow to hear their cry because of their iniquities; nevertheless the Lord did hear their cries'
  - where: 'note 14:12 “When the Lord does not hear”'
    claim: 'D&C 101:7 explains slowness to hear: they were slow to hearken'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/101?lang=eng
    quote: 'They were slow to hearken unto the voice of the Lord their God; therefore, the Lord their God is slow to hearken unto their prayers'
  - where: 'note 14:7 “Who is praying”'
    claim: 'Mormon: their sorrowing was not unto repentance'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/bofm/morm/2?lang=eng
    quote: 'their sorrowing was not unto repentance, because of the goodness of God'
  - where: 'note 14:13 “Assured peace”'
    claim: 'The Hebrew of “assured peace” is “peace of truth”, peace resting on God’s faithfulness'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/14.htm
    quote: 'Peace of truth, i.e., peace that rests on God''s faithfulness, and so: assured peace will I give you.'
  - where: 'note 14:13 “Assured peace”'
    claim: 'The prophets promised peace in the Lord’s name'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/14.htm
    quote: 'Thus spoke these prophets in the name of Jahveh'
  - where: 'note 14:13 “Assured peace”'
    claim: 'The lies flattered the people (what they wanted to hear)'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/14.htm
    quote: 'lies that flattered their sinful passions'
  - where: 'note 14:13 “Assured peace”'
    claim: 'Jeremiah pleads that the people were deceived; the Lord rejects that excuse'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'The Lord rejected the excuse for the people’s sins.'
  - where: 'note 14:13 “Assured peace”'
    claim: 'The people themselves said sword and famine would not come (Jer 5:12)'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/5?lang=eng
    quote: 'neither shall evil come upon us; neither shall we see sword nor famine'
  - where: 'note 14:14 “I sent them not”'
    claim: 'Deuteronomy 18 test of a prophet'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/deut/18?lang=eng
    quote: 'if the thing follow not, nor come to pass, that is the thing which the Lord hath not spoken'
  - where: 'note 14:14 “I sent them not”'
    claim: 'Jeremiah 27:10 repeats the charge'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/27?lang=eng
    quote: 'For they prophesy a lie unto you, to remove you far from your land'
  - where: 'note 14:14 “I sent them not”'
    claim: 'Hananiah, a prophet, told Jeremiah in the temple that the yoke of Babylon was broken; Jeremiah told him the Lord had not sent him, and he died that year'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/28?lang=eng
    quote: 'Hear now, Hananiah; The Lord hath not sent thee; but thou makest this people to trust in a lie.'
  - where: 'note 14:16 “No excuse, and no burial”'
    claim: 'The people are not excused because false prophets lied; they believed the flattering lies'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/14.htm
    quote: 'They are not therefore held excused because false prophets told them lies, for they have given credit to these lies'
  - where: 'note 14:16 “No excuse, and no burial”'
    claim: 'Jeremiah 16:4 repeats the unburied dead'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/16?lang=eng
    quote: 'they shall not be lamented; neither shall they be buried'
  - where: 'note 14:17 “Tears night and day”'
    claim: 'Jeremiah 9:1 has the same weeping for the daughter of my people'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/9?lang=eng
    quote: 'Oh that my head were waters, and mine eyes a fountain of tears, that I might weep day and night for the slain of the daughter of my people!'
  - where: 'note 14:18 “A land they know not”'
    claim: 'Jeremiah 15:14 and 16:13 speak of being cast into a land they know not'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/16?lang=eng
    quote: 'Therefore will I cast you out of this land into a land that ye know not, neither ye nor your fathers'
  - where: 'note 14:18 “A land they know not”'
    claim: 'Jeremiah 15:14 repeats the phrase'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/15?lang=eng
    quote: 'And I will make thee to pass with thine enemies into a land which thou knowest not'
  - where: 'note 14:21 “The throne and the covenant”'
    claim: 'Jeremiah 3:17 says Jerusalem will be called the throne of the Lord'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/3?lang=eng
    quote: 'At that time they shall call Jerusalem the throne of the Lord'
  - where: 'note 14:21 “The throne and the covenant”'
    claim: 'Jeremiah 17:12 calls the sanctuary a glorious high throne'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/17?lang=eng
    quote: 'A glorious high throne from the beginning is the place of our sanctuary.'
  - where: 'note 14:21 “The throne and the covenant”'
    claim: 'Leviticus 26:44–45: even in the land of enemies the Lord will not break His covenant'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/lev/26?lang=eng
    quote: 'I will not cast them away, neither will I abhor them, to destroy them utterly, and to break my covenant with them: for I am the Lord their God.'
  - where: 'note 14:21 “The throne and the covenant”'
    claim: 'Psalm 106:44–45: he heard their cry and remembered His covenant'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/ps/106?lang=eng
    quote: 'And he remembered for them his covenant, and repented according to the multitude of his mercies.'
  - where: 'note 14:22 “The Lord who made the rain”'
    claim: 'The Church edition’s footnote glosses the vanities of the Gentiles as worthless idols of the nations; links to Jer 3:3'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/14?lang=eng
    quote: 'IE worthless idols of the nations.'
  - where: 'note 14:22 “The Lord who made the rain”'
    claim: 'Jeremiah 3:3: the showers have been withholden'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/3?lang=eng
    quote: 'Therefore the showers have been withholden, and there hath been no latter rain'
  - where: 'note 14:22 “The Lord who made the rain”'
    claim: 'Jesus Christ declares He created the heavens and the earth (3 Ne. 9:15)'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/9?lang=eng
    quote: 'Behold, I am Jesus Christ the Son of God. I created the heavens and the earth, and all things that in them are.'
  - where: 'note 14:22 “The Lord who made the rain”'
    claim: 'D&C 14:9 and Mosiah 4:2 say Christ created heaven and earth; the Church edition footnotes link them'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/14?lang=eng
    quote: 'Behold, I am Jesus Christ, the Son of the living God, who created the heavens and the earth'
  - where: 'note 14:22 “The Lord who made the rain”'
    claim: 'The footnote links at verse 22 include Mosiah 4:2; 3 Ne. 9:15; D&C 14:9; 45:1'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/14?lang=eng
    quote: 'Mosiah 4:2; 3 Ne. 9:15; D&amp;C 14:9; 45:1.'
  - where: 'christ'
    claim: 'The LORD of Jer 14 is Jehovah, the premortal Jesus Christ'
    key: bd-jehovah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: 'thread'
    claim: 'The Lord answers the prayer by pointing to the people’s wandering and refusing intercession; the false prophets lulled the people'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'The Lord rejected the excuse for the people’s sins. Nothing, it seemed, would turn His wrath aside (see vv. 14–18).'
  - where: 'explore'
    claim: 'Jer 26–29 are on the false prophets'
    key: bd-jeremiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng
    quote: '(b) Jer. 26–29, on the false prophets'
  - where: 'note 14:16 “No excuse, and no burial”'
    claim: 'The Lord rejected the excuse that the people were deceived'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'The Lord rejected the excuse for the people’s sins. Nothing, it seemed, would turn His wrath aside (see vv. 14–18).'
  - where: 'section 1 plain'
    claim: '“Black unto the ground” means they mourn, sitting on the ground'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/14.htm
    quote: 'are black, i.e., mourn, down to the earth; pregnant for: set themselves mourning on the ground.'
  - where: 'section 1 plain'
    claim: 'The nobles’ “little ones” are their servants'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/14.htm
    quote: 'send their mean ones, i.e., their retainers or servants and maids, for water to the wells'
  - where: 'section 6 plain'
    claim: '“Trouble” is terror; “wait upon thee” is hope in thee'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/14.htm
    quote: 'for the time of healing, and behold terror!'
  - where: 'section 6 plain'
    claim: 'We hope in Thee'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/14.htm
    quote: 'and we hope in Thee, for Thou hast made all these.'
