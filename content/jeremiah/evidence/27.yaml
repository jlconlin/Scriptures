chapter: 27
claims:
  - where: 'when'
    claim: 'Zedekiah reigned 597–586 B.C.'
    key: 'bd-jeremiah'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng'
    quote: 'Prophecies under Zedekiah (597–586)'
  - where: 'setting'
    claim: 'Jeremiah 26–29 are on the false prophets'
    key: 'bd-jeremiah'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng'
    quote: 'Jer. 26–29 , on the false prophets'
  - where: 'setting'
    claim: 'Church chapter heading'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/27?lang=eng'
    quote: 'The Lord sends word to many nations that they are to serve Babylon—The vessels of the Lord’s house will go into Babylon.'
  - where: 'setting'
    claim: 'Nebuchadnezzar took treasure and Jehoiachin; Zedekiah put on throne by Babylon'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng'
    quote: 'And he carried out thence all the treasures of the house of the Lord'
  - where: 'setting'
    claim: 'Mattaniah made king and renamed Zedekiah'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng'
    quote: 'And the king of Babylon made Mattaniah his father’s brother king in his stead, and changed his name to Zedekiah'
  - where: 'setting'
    claim: 'Zedekiah rebelled against Babylon'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng'
    quote: 'Zedekiah rebelled against the king of Babylon.'
  - where: 'setting'
    claim: 'Envoys proposed united defeat of Babylon'
    key: 'ot-manual-24'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'Ambassadors from several neighboring countries had come to Zedekiah with the proposal that unitedly they could defeat Babylon.'
  - where: 'thread'
    claim: 'Jer 27 verse 5 text; verses 6,9-10,14-15,18,22 are the chapter text'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/27?lang=eng'
    quote: 'Thus saith the Lord'
  - where: 'note 27:1 “Jehoiakim or Zedekiah?”'
    claim: 'Manual: verses 3 and 12 suggest Zedekiah'
    key: 'ot-manual-24'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'verses 3 and 12 suggest that it was given during Zedekiah’s reign, not Jehoiakim’s.'
  - where: 'note 27:1 “Jehoiakim or Zedekiah?”'
    claim: 'Jer 28:1 dates same event to Zedekiah fourth year'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/28?lang=eng'
    quote: 'And it came to pass the same year, in the beginning of the reign of Zedekiah king of Judah, in the fourth year, and in the fifth month'
  - where: 'note 27:1 “Jehoiakim or Zedekiah?”'
    claim: 'Zedekiah accession 597'
    key: 'bd-jeremiah'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng'
    quote: 'Prophecies under Zedekiah (597–586)'
  - where: 'note 27:1 “Jehoiakim or Zedekiah?”'
    claim: 'Copyist error reading; Syriac and a Kennicott codex read Zedekiah'
    key: 'keil-jeremiah'
    url: 'https://biblehub.com/commentaries/kad/jeremiah/27.htm'
    quote: 'It is without doubt the blunder of a copyist who had in his mind the heading of the 26th chapter, and should have been "Zedekiah;"'
  - where: 'note 27:1 “Jehoiakim or Zedekiah?”'
    claim: 'Syriac and a Kennicott MS'
    key: 'keil-jeremiah'
    url: 'https://biblehub.com/commentaries/kad/jeremiah/27.htm'
    quote: 'Hence the Syr. translation and one of Kennicott''s codd. have substituted the latter name.'
  - where: 'note 27:2 “The yoke on Jeremiah''s neck”'
    claim: 'Yoke defined; symbolized captivity'
    key: 'ot-seminary-jer-27-28'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-student-study-guide-obs/the-book-of-jeremiah/jeremiah-27-28-the-yoke-of-babylon?lang=eng'
    quote: 'A yoke is something put on the neck for the purpose of carrying burdens. The yoke symbolized captivity or slavery.'
  - where: 'note 27:2 “The yoke on Jeremiah''s neck”'
    claim: 'Yoke of crossbar and straps worn before Zedekiah and ambassadors'
    key: 'tefan-potters-clay'
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/10/jeremiah-as-potters-clay?lang=eng'
    quote: 'Jeremiah was instructed to make a yoke that animals wear out of a crossbar and straps, put it around his own neck, and wear it in the presence of King Zedekiah and Jerusalem’s ambassadorial corps.'
  - where: 'note 27:2 “The yoke on Jeremiah''s neck”'
    claim: 'Hananiah broke yoke (28:10)'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/28?lang=eng'
    quote: 'Then Hananiah the prophet took the yoke from off the prophet Jeremiah’s neck, and brake it.'
  - where: 'note 27:2 “The yoke on Jeremiah''s neck”'
    claim: 'One reading: yokes made for the kings too'
    key: 'keil-jeremiah'
    url: 'https://biblehub.com/commentaries/kad/jeremiah/27.htm'
    quote: 'there is no reason to doubt that he made yokes for the five kings named and gave them to their respective envoys.'
  - where: 'note 27:3 “Why five kings sent envoys”'
    claim: 'Envoys proposal to defeat Babylon; several neighboring countries'
    key: 'ot-manual-24'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'Ambassadors from several neighboring countries had come to Zedekiah with the proposal that unitedly they could defeat Babylon.'
  - where: 'note 27:3 “Why five kings sent envoys”'
    claim: 'Zedekiah rebelled'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng'
    quote: 'Zedekiah rebelled against the king of Babylon.'
  - where: 'note 27:3 “Why five kings sent envoys”'
    claim: 'Babylonians came again after rebellion'
    key: 'ot-manual-24'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'Ignoring the repeated warnings of Jeremiah, he rebelled, and once again the Babylonians came against Jerusalem.'
  - where: 'note 27:3 “Why five kings sent envoys”'
    claim: 'Jeremiah''s counsel to submit (said of the leaders'' reaction during the siege, Jer. 32) was not political'
    key: 'ot-manual-24'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'But of course Jeremiah was not speaking from a political point of view; he spoke for the Lord.'
  - where: 'note 27:3 “Why five kings sent envoys”'
    claim: 'Wore bonds to symbolize will of Lord to submit'
    key: 'ot-manual-24'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'to symbolize that it was the Lord’s will that they submit to their would-be conquerors.'
  - where: 'note 27:5 “The Lord who gives kingdoms”'
    claim: 'Nephi: Lord creates earth, raises righteous nation'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/17?lang=eng'
    quote: 'And he raiseth up a righteous nation, and destroyeth the nations of the wicked.'
  - where: 'note 27:5 “The Lord who gives kingdoms”'
    claim: 'Nephi: created earth to be inhabited'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/17?lang=eng'
    quote: 'Behold, the Lord hath created the earth that it should be inhabited; and he hath created his children that they should possess it.'
  - where: 'note 27:5 “The Lord who gives kingdoms”'
    claim: 'Daniel: removes and sets up kings'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/2?lang=eng'
    quote: 'he removeth kings, and setteth up kings'
  - where: 'note 27:5 “The Lord who gives kingdoms”'
    claim: 'Psalm 75:7'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/75?lang=eng'
    quote: 'But God is the judge: he putteth down one, and setteth up another.'
  - where: 'note 27:5 “The Lord who gives kingdoms”'
    claim: 'Footnotes to Jer. 27:5 list 1 Ne 17:36–37, Ps 75:6–7, Dan 2:21'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/27?lang=eng'
    quote: '1 Ne. 17:36 (36–37) . Ps. 75:6 (6–7) ; Dan. 2:21'
  - where: 'note 27:6 “Nebuchadnezzar, “my servant””'
    claim: 'Same title in 25:9'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/25?lang=eng'
    quote: 'Nebuchadrezzar the king of Babylon , my servant'
  - where: 'note 27:6 “Nebuchadnezzar, “my servant””'
    claim: 'Lands assigned until Babylon ripened in iniquity'
    key: 'ot-manual-24'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'Their lands were assigned to Babylon until that country ripened in iniquity and reaped its own reward.'
  - where: 'note 27:6 “Nebuchadnezzar, “my servant””'
    claim: 'Seventy years then punishment of Babylon'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/25?lang=eng'
    quote: 'And it shall come to pass, when seventy years are accomplished, that I will punish the king of Babylon, and that nation, saith the Lord , for their iniquity'
  - where: 'note 27:7 “His son, and his son''s son”'
    claim: 'One reading: long duration, not literal succession'
    key: 'keil-jeremiah'
    url: 'https://biblehub.com/commentaries/kad/jeremiah/27.htm'
    quote: 'These words simply express the long duration of the king of Babylon''s power over them, without warranting us in concluding that he was succeeded on the throne by his son and his grandson'
  - where: 'note 27:7 “His son, and his son''s son”'
    claim: 'Seventy years (25:11)'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/25?lang=eng'
    quote: 'and these nations shall serve the king of Babylon seventy years.'
  - where: 'note 27:7 “His son, and his son''s son”'
    claim: 'Seventy years (29:10)'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/29?lang=eng'
    quote: 'after seventy years be accomplished at Babylon I will visit you'
  - where: 'note 27:9 “Five kinds of false guidance”'
    claim: 'Not five separate trades'
    key: 'keil-jeremiah'
    url: 'https://biblehub.com/commentaries/kad/jeremiah/27.htm'
    quote: 'The enumeration of the multifarious means and methods for forecasting the future is designed to show the multitude of delusive schemes for supplying the lack of true and real divine inspiration.'
  - where: 'note 27:9 “Five kinds of false guidance”'
    claim: 'Jer 29:8 same categories'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/29?lang=eng'
    quote: 'Let not your prophets and your diviners , that be in the midst of you, deceive you, neither hearken to your dreams which ye cause to be dreamed.'
  - where: 'note 27:12 ““Serve him… and live”“'
    claim: 'Zedekiah rebelled'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng'
    quote: 'Zedekiah rebelled against the king of Babylon.'
  - where: 'note 27:12 ““Serve him… and live”“'
    claim: 'Twice Nebuchadnezzar came; should have been obvious'
    key: 'ot-manual-24'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'By this time it should have been obvious that Jeremiah’s prophecies were coming to pass. Twice Nebuchadnezzar had come, and twice he had humbled Judah.'
  - where: 'note 27:15 “Prophets the Lord did not send”'
    claim: 'Jer 14:14'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/14?lang=eng'
    quote: 'The prophets prophesy lies in my name: I sent them not, neither have I commanded them'
  - where: 'note 27:15 “Prophets the Lord did not send”'
    claim: 'Jer 29:9'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/29?lang=eng'
    quote: 'For they prophesy falsely unto you in my name: I have not sent them, saith the Lord .'
  - where: 'note 27:15 “Prophets the Lord did not send”'
    claim: 'Deut 18:22 test'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/18?lang=eng'
    quote: 'if the thing follow not, nor come to pass, that is the thing which the Lord hath not spoken, but the prophet hath spoken it presumptuously'
  - where: 'note 27:15 “Prophets the Lord did not send”'
    claim: 'Not every message from God'
    key: 'ot-manual-24'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'nor does every messenger bring His word.'
  - where: 'note 27:15 “Prophets who said Jerusalem would stand”'
    claim: 'Lehi called in first year of Zedekiah; many prophets'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/1?lang=eng'
    quote: 'in the commencement of the first year of the reign of Zedekiah'
  - where: 'note 27:15 “Prophets who said Jerusalem would stand”'
    claim: 'Laman and Lemuel disbelieved destruction'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/2?lang=eng'
    quote: 'Neither did they believe that Jerusalem, that great city, could be destroyed according to the words of the prophets.'
  - where: 'note 27:15 “Prophets who said Jerusalem would stand”'
    claim: 'False prophets like Hananiah; told people what they wanted to hear'
    key: 'sc-knowhy-451'
    url: 'https://scripturecentral.org/knowhy/why-did-some-in-lehis-time-believe-that-jerusalem-could-not-be-destroyed'
    quote: 'They were in the business of telling the people and their leaders what they wanted to hear and not what the Lord wanted them to know'
  - where: 'note 27:15 “Prophets who said Jerusalem would stand”'
    claim: 'Hananiah gave opposite message'
    key: 'sc-knowhy-451'
    url: 'https://scripturecentral.org/knowhy/why-did-some-in-lehis-time-believe-that-jerusalem-could-not-be-destroyed'
    quote: 'such as Hananiah (Jeremiah 28:15) who gave the opposite message—that God would preserve them from their enemies'
  - where: 'note 27:16 “The vessels already taken”'
    claim: '2 Kgs 24:13'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng'
    quote: 'and cut in pieces all the vessels of gold which Solomon king of Israel had made in the temple of the Lord'
  - where: 'note 27:16 “The vessels already taken”'
    claim: 'Hananiah promised vessels back in two years'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/28?lang=eng'
    quote: 'Within two full years will I bring again into this place all the vessels of the Lord ’s house'
  - where: 'note 27:16 “The vessels already taken”'
    claim: 'Promises of deliverance ignored reality'
    key: 'ot-manual-24'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'Jeremiah was pointing out that his promises of captivity were realistic, whereas the promises of delivery from Babylon made by the false prophets ignored reality, since the Babylonians had already proven they could conquer Judah with impunity.'
  - where: 'note 27:18 “A test of the prophets”'
    claim: 'Prophets should preserve remnant of treasures'
    key: 'ot-manual-24'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'Jeremiah warned Zedekiah that the prophets who were saying that Babylon would not capture Judah should try to preserve the remnant of temple treasures left from the first and second conquests of Nebuchadnezzar.'
  - where: 'note 27:19 “What was left, and what happened to it”'
    claim: '2 Kgs 25:13 pillars, bases, sea broken and carried to Babylon'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/25?lang=eng'
    quote: 'And the pillars of brass that were in the house of the Lord , and the bases , and the brasen sea that was in the house of the Lord , did the Chaldees break in pieces, and carried the brass of them to Babylon .'
  - where: 'note 27:19 “What was left, and what happened to it”'
    claim: 'Jer 52:17'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/52?lang=eng'
    quote: 'Also the pillars of brass that were in the house of the Lord , and the bases, and the brasen sea that was in the house of the Lord , the Chaldeans brake, and carried all the brass of them to Babylon.'
  - where: 'note 27:19 “What was left, and what happened to it”'
    claim: 'Pillars, sea, and bases were made by Solomon'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/52?lang=eng'
    quote: 'The two pillars, one sea, and twelve brasen bulls that were under the bases, which king Solomon had made in the house of the Lord'
  - where: 'note 27:22 “The vessels come back”'
    claim: 'Jer 29:10'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/29?lang=eng'
    quote: 'after seventy years be accomplished at Babylon I will visit you, and perform my good word toward you, in causing you to return to this place.'
  - where: 'note 27:22 “The vessels come back”'
    claim: 'Ezra 1:7–8 Cyrus returned vessels to Sheshbazzar'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/1?lang=eng'
    quote: 'Also Cyrus the king brought forth the vessels of the house of the Lord , which Nebuchadnezzar had brought forth out of Jerusalem'
  - where: 'note 27:22 “The vessels come back”'
    claim: 'Hananiah two full years'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/28?lang=eng'
    quote: 'Within two full years will I bring again into this place all the vessels of the Lord ’s house'
  - where: 'christ'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: 'bd-jehovah'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ'
  - where: 'explore'
    claim: 'Jer 38:17-18 submit and live'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/38?lang=eng'
    quote: 'then thy soul shall live, and this city shall not be burned with fire'
