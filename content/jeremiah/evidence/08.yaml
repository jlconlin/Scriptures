chapter: 8
claims:
  - where: 'when'
    claim: 'The Bible Dictionary groups Jeremiah 7–20 under Jehoiakim (608–597)'
    key: bd-jeremiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng'
    quote: 'Prophecies under Jehoiakim (608–597), Jer. 7–20'
  - where: 'setting'
    claim: 'The Church chapter heading summarizes the chapter'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/8?lang=eng'
    quote: 'Calamities will befall the inhabitants of Jerusalem—For them the harvest is past, the summer is ended, and they are not saved.'
  - where: 'setting'
    claim: 'Verse 1 continues the threat of chapter 7: no place left to bury, corpses for birds and beasts'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/7?lang=eng'
    quote: 'they shall bury in Tophet, till there be no place. And the carcases of this people shall be meat for the fowls of the heaven'
  - where: 'note 8:1 “Bones brought out of the graves”'
    claim: 'The enemies dragged the bones of kings, princes, priests, prophets out of graves and exposed them in the open air, the highest expression of hatred and contempt'
    key: ot-manual-23
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng'
    quote: 'the victorious enemies dragged out of their graves, caves, and sepulchers, the bones of kings, princes, prophets, priests, and the principal inhabitants, and exposed them in the open air'
  - where: 'note 8:1 “Bones brought out of the graves”'
    claim: 'It was the highest expression of hatred and contempt'
    key: ot-manual-23
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng'
    quote: 'It was the highest expression of hatred and contempt.'
  - where: 'note 8:1 “Bones brought out of the graves”'
    claim: 'Jeremiah 25:33 is the Church edition footnote on the unburied; the verse says not lamented, gathered, or buried, dung upon the ground'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/25?lang=eng'
    quote: 'they shall not be lamented, neither gathered, nor buried; they shall be dung upon the ground.'
  - where: 'note 8:2 “Loved, served, walked after, sought, worshipped”'
    claim: 'The bones are exposed before the sun, moon and stars whose worship they set up in opposition to Jehovah, a reproach to their vain confidence in them'
    key: ot-manual-23
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng'
    quote: 'a reproach to them in the vain confidence they had in the sun, moon, and the host of heaven —all the planets and stars, whose worship they had set up in opposition to that of Jehovah'
  - where: 'note 8:3 “Death chosen rather than life”'
    claim: 'The Church edition footnote on verse 3 links to Rev. 9:6'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/9?lang=eng'
    quote: 'And in those days shall men seek death , and shall not find it; and shall desire to die, and death shall flee from them.'
  - where: 'note 8:5 “Turn, turn back, turn away”'
    claim: 'Hebrew root shuv (7725) appears in yashuv twice (v4), shovevah, meshuvah, lashuv (v5), shav (v6)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'אִם־[7725]יָשׁ֖וּב ... [7725]שׁוֹבְבָ֜ה ... [4878]מְשֻׁבָ֣ה ... [l/7725]לָ/שֽׁוּב׃ ... [7725]שָׁ֚ב'
  - where: 'note 8:5 “Turn, turn back, turn away”'
    claim: 'BDB: shuv means turn back, return; used absolutely, repent'
    key: bdb
    url: 'https://biblehub.com/hebrew/7725.htm'
    quote: 'שׁוּב1056 verb turn back, return … d. absolute repent'
  - where: 'note 8:5 “Turn, turn back, turn away”'
    claim: 'Jer. 3:22 invites backsliding children to return and be healed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/3?lang=eng'
    quote: 'Return, ye backsliding children, and I will heal your backslidings.'
  - where: 'note 8:7 “The stork knows her seasons”'
    claim: 'Hebrew: chasidah (stork), tor, sus, agur; they keep the time of their coming; Church footnote reads turtle as turtle-dove'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: '[2624]חֲסִידָ֣ה [b/8064]בַ/שָּׁמַ֗יִם [3045]יָֽדְעָה֙ [4150]מֽוֹעֲדֶ֔י/הָ ... [8104]שָׁמְר֖וּ [853]אֶת־[6256]עֵ֣ת [935]בֹּאָ֑/נָה'
  - where: 'note 8:7 “The stork knows her seasons”'
    claim: 'The Church edition footnote glosses turtle as turtle-dove, citing Song 2:12'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/8?lang=eng'
    quote: 'HEB turtle-dove. Song 2:12 (10–12).'
  - where: 'note 8:8 “The pen of the scribes”'
    claim: 'The Hebrew says the lying pen of the scribes has made it a lie; refers to priests and false prophets who handled and taught the law'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/8.htm'
    quote: 'Assuredly the lying pen (style) of the scribes hath made it a lie.'
  - where: 'note 8:8 “The pen of the scribes”'
    claim: 'The pen reaches the priests, who taught the law falsely'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/8.htm'
    quote: 'they refer equally to the work of the priests, whose duty it was to train the people in the law, and who, by false teaching as to its demands, led the people astray'
  - where: 'note 8:8 “The pen of the scribes”'
    claim: 'Hebrew of v8: sheqer (falsehood) twice, et (pen), soferim (scribes)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: '[l/8267]לַ/שֶּׁ֣קֶר [6213 a]עָשָׂ֔ה [5842]עֵ֖ט [8267]שֶׁ֥קֶר [5608 b]סֹפְרִֽים׃'
  - where: 'note 8:8 “The pen of the scribes”'
    claim: 'Brenton''s Greek reads In vain have the scribes used a false pen'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/jeremiah/8.htm'
    quote: 'In vain have the scribes used a false pen.'
  - where: 'note 8:8 “We are wise”'
    claim: 'Church edition footnotes on verse 8 link 1 Cor. 1:20 and 2 Ne. 9:28; Jacob says the learned think they are wise'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/9?lang=eng'
    quote: 'When they are learned they think they are wise , and they hearken not unto the counsel of God, for they set it aside, supposing they know of themselves'
  - where: 'note 8:11 “Peace, peace”'
    claim: 'The Greek of Jeremiah 8 omits verses 11 and 12'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/jeremiah/8.htm'
    quote: '11 (OMITTED TEXT)'
  - where: 'note 8:11 “Peace, peace”'
    claim: 'Jeremiah 6:14–15 is the first appearance'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/6?lang=eng'
    quote: 'They have healed also the hurt of the daughter of my people slightly, saying, Peace , peace; when there is no peace.'
  - where: 'note 8:14 “Who is speaking”'
    claim: 'In verse 14 the citizens of Judah speak, calling to flee into fortified cities'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/8.htm'
    quote: 'In Jeremiah 8:14 the citizens of Judah are made to speak, calling on one another to flee and give up hope of being saved.'
  - where: 'note 8:14 “Who is speaking”'
    claim: 'In verse 19 the people cry from a far country, and God replies'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/8.htm'
    quote: 'To this the voice of God replies with the counter-question: Why have they provoked me with their idolatry'
  - where: 'note 8:14 “Who is speaking”'
    claim: 'The words of verse 20 are spoken by the people in exile'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/8.htm'
    quote: 'we see that the words are spoken by the people while it pines in exile'
  - where: 'note 8:14 “Who is speaking”'
    claim: 'Verse 18 is the prophet''s grief'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/8.htm'
    quote: 'The hopeless ruin of his people cuts the prophet to the very heart.'
  - where: 'note 8:16 “From Dan”'
    claim: 'Dan was the northern limit of the land, from Dan to Beer-sheba'
    key: bd-dan
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/dan?lang=eng'
    quote: 'This town is well known as the northern limit of Palestine, which extended “from Dan even to Beer-sheba.”'
  - where: 'note 8:16 “From Dan”'
    claim: 'Jer. 4:15 has a voice from Dan'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/4?lang=eng'
    quote: 'For a voice declareth from Dan, and publisheth affliction from mount Ephraim.'
  - where: 'note 8:19 “Is not the LORD in Zion?”'
    claim: 'The people cry from a far country, asking whether the Lord is no longer King in Zion to bring them back; the King is the Lord (one reading)'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/8.htm'
    quote: 'the King is Jahveh; cf. Isaiah 33:22. They ask whether Jahveh is no longer King in Zion, that He may release His people from captivity and bring them back to Zion.'
  - where: 'note 8:19 “Is not the LORD in Zion?”'
    claim: 'The Lord answers with a counter-question: their idolatry is why He gave them over to the heathen'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/8.htm'
    quote: 'the voice of God replies with the counter-question: Why have they provoked me with their idolatry, sc. so that I had to give them over into the power of the heathen for punishment?'
  - where: 'note 8:20 “The harvest is past”'
    claim: 'D&C 45:2 uses the saying in the Lord''s warning'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/45?lang=eng'
    quote: 'in an hour when ye think not the summer shall be past, and the harvest ended, and your souls not saved.'
  - where: 'note 8:20 “The harvest is past”'
    claim: 'D&C 56:16 uses the saying as the lamentation of rich men who did not give to the poor, on the day of visitation'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/56?lang=eng'
    quote: 'this shall be your lamentation in the day of visitation, and of judgment, and of indignation: The harvest is past, the summer is ended, and my soul is not saved!'
  - where: 'note 8:20 “The harvest is past”'
    claim: 'The Church edition footnotes on verse 20 link D&C 45:2, 56:16, 76:79'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/8?lang=eng'
    quote: 'OR foreign idols. D&C 45:2; 56:16; 76:79 (71–79).'
  - where: 'note 8:21 “Am I hurt”'
    claim: 'The Hebrew uses the root for break: shever, hashbarti; verse 21 reads qadarti, which the Church edition footnote calls a Hebrew idiom meaning gloomy'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: '[7667]שֶׁ֥בֶר [1323]בַּת־[5971 a]עַמִּ֖/י [7665]הָשְׁבָּ֑רְתִּי [6937]קָדַ֕רְתִּי'
  - where: 'note 8:21 “Am I hurt”'
    claim: 'Church edition footnote: black is a Hebrew idiom meaning gloomy'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/8?lang=eng'
    quote: 'Hebrew idiom meaning “gloomy.” Joel 2:6'
  - where: 'note 8:22 “Balm in Gilead”'
    claim: 'Gilead was famous for its healing ointment; no ointment was available for rebellious Israel; the balm of salvation comes only through Jehovah'
    key: ot-manual-23
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng'
    quote: 'no healing ointment, or medication, was available for rebellious Israel. The balm of salvation could be administered only through Israel'
  - where: 'note 8:22 “Balm in Gilead”'
    claim: 'Balm came from Gilead in a caravan to Egypt (Gen. 37:25)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/37?lang=eng'
    quote: 'a company of Ishmeelites came from Gilead with their camels bearing spicery and balm and myrrh, going to carry it down to Egypt.'
  - where: 'note 8:22 “Balm in Gilead”'
    claim: 'Jer. 46:11 (Church footnote) tells Egypt to take balm from Gilead in vain'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/46?lang=eng'
    quote: 'Go up into Gilead, and take balm , O virgin, the daughter of Egypt: in vain shalt thou use many medicines; for thou shalt not be cured.'
  - where: 'note 8:22 “Balm in Gilead”'
    claim: 'BDB: arukah means healing of a wound, restoration, properly new flesh at the wounded spot; used of Jer. 8:22'
    key: bdb
    url: 'https://biblehub.com/hebrew/724.htm'
    quote: 'אֲרוּכָה noun feminine healing of a wound, restoration (properly the new flesh that grows at the wounded spot'
  - where: 'christ'
    claim: 'The Lord in the Book of Mormon invites the spared to return that He may heal them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/9?lang=eng'
    quote: 'will ye not now return unto me, and repent of your sins, and be converted, that I may heal you?'
  - where: 'note 8:8 “We are wise”'
    claim: '2 Nephi 9 is Jacob speaking'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/9?lang=eng'
    quote: 'Jacob explains that the Jews will be gathered in all their lands of promise'
  - where: 'note 8:21 “Am I hurt”'
    claim: 'Jer. 9:1 opens with the wish for a fountain of tears'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/9?lang=eng'
    quote: 'Oh that my head were waters, and mine eyes a fountain of tears, that I might weep day and night for the slain of the daughter of my people!'
  - where: 'note 8:3 “Death chosen rather than life”'
    claim: 'The survivors remain in the places where the Lord has driven them (verse text)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/8?lang=eng'
    quote: 'which remain in all the places whither I have driven them, saith the Lord of hosts.'
  - where: 'note 8:1 “Bones brought out of the graves”'
    claim: 'Clarke (quoted by the manual): enemies dragged out the bones and exposed them'
    key: clarke-commentary
    url: 'https://biblehub.com/commentaries/clarke/jeremiah/8.htm'
    quote: 'the victorious enemies dragged out of their graves, caves, and sepulchers, the bones of kings, princes, prophets, priests, and the principal inhabitants, and exposed them in the open air'
  - where: 'note 8:1 “Bones brought out of the graves”'
    claim: 'The custom seems to have been general and was the highest expression of hatred and contempt'
    key: clarke-commentary
    url: 'https://biblehub.com/commentaries/clarke/jeremiah/8.htm'
    quote: 'This custom of raising the bodies of the dead, and scattering their bones about, seems to have been general. It was the highest expression of hatred and contempt.'
  - where: 'note 8:1 “Bones brought out of the graves”'
    claim: 'The custom seems to have been general (as quoted in the manual)'
    key: ot-manual-23
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng'
    quote: 'This custom of raising the bodies of the dead, and scattering their bones about, seems to have been general.'
  - where: 'note 8:1 “Bones brought out of the graves”'
    claim: 'The Church edition footnotes on verses 2–3 link Jer. 25:33 and Rev. 9:6'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/8?lang=eng'
    quote: 'TG Idolatry. Jer. 25:33. Rev. 9:6.'
  - where: 'note 8:2 “Loved, served, walked after, sought, worshipped”'
    claim: 'Clarke: the exposure was a reproach to their vain confidence in the host of heaven, worshipped in opposition to Jehovah'
    key: clarke-commentary
    url: 'https://biblehub.com/commentaries/clarke/jeremiah/8.htm'
    quote: 'a reproach to them in the vain confidence they had in the sun, moon, and the host of heaven'
  - where: 'note 8:5 “Turn, turn back, turn away”'
    claim: 'The noun meshuvah (backsliding) is from shuv: turning back, apostasy'
    key: bdb
    url: 'https://biblehub.com/hebrew/4878.htm'
    quote: 'מְשֻׁבָה noun feminine turning back, apostasy'
  - where: 'note 8:5 “Turn, turn back, turn away”'
    claim: 'In verse 6, repented is nicham (5162), not shuv'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: '[369]אֵ֣ין [376]אִ֗ישׁ [5162]נִחָם֙ [5921 a]עַל [7451 c]רָ֣עָת֔/וֹ'
  - where: 'note 8:5 “Turn, turn back, turn away”'
    claim: 'nicham means be sorry, repent of ones own doings; BDB lists Jer. 8:6'
    key: bdb
    url: 'https://biblehub.com/hebrew/5162.htm'
    quote: 'be sorry, rue, suffer grief, repent, of ones own doings'
  - where: 'christ'
    claim: 'The balm of salvation could be administered only through Jehovah'
    key: ot-manual-23
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng'
    quote: 'The balm of salvation could be administered only through Israel’s Savior, Jehovah, whom they had rejected.'
  - where: 'christ'
    claim: 'Return in Jer. 3:22 is shuv (shuvu)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: '[7725]שׁ֚וּבוּ [1121 a]בָּנִ֣ים [7726]שׁוֹבָבִ֔ים [7495]אֶרְפָּ֖ה'
  - where: 'setting'
    claim: 'D&C 45:2 takes up the words of verse 20 as a warning'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/45?lang=eng'
    quote: 'in an hour when ye think not the summer shall be past, and the harvest ended, and your souls not saved.'
