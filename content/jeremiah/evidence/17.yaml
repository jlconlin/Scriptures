chapter: 17
claims:
  - where: 'when'
    claim: 'The Bible Dictionary places Jeremiah 7–20 under Jehoiakim (608–597)'
    key: bd-jeremiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng'
    quote: 'Prophecies under Jehoiakim (608–597), Jer. 7–20.'
  - where: 'setting'
    claim: 'The Church chapter heading summarizes the chapter'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/17?lang=eng'
    quote: 'The captivity of Judah comes because of sin and forsaking the Lord—Hallow the Sabbath day; doing so will save the people; otherwise they will be destroyed.'
  - where: 'setting'
    claim: 'Jeremiah 15:13–14 has nearly the same words as 17:3–4 (the chapter is a repeat in part); the Church footnote on 17:4 sends to 15:14'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/15?lang=eng'
    quote: 'Thy substance and thy treasures will I give to the spoil without price, and that for all thy sins, even in all thy borders.'
  - where: 'note 17:1 “Engraved on the heart and on the altar”'
    claim: 'The pen of iron and diamond point show how deeply sin was fixed in Judah'
    key: ot-manual-23
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng'
    quote: 'These metaphors speak of how deeply sin was imbedded in Judah’s consciousness.'
  - where: 'note 17:1 “Engraved on the heart and on the altar”'
    claim: 'The sin is stamped on hearts and altars; the diamond is a graver; altars may be the Lord''s altars defiled by idolatry (one reading)'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/17.htm'
    quote: "Judah's sin is ineffaceably stamped upon the hearts of the people and on their altars."
  - where: 'note 17:1 “Engraved on the heart and on the altar”'
    claim: 'The altar of incense had blood of the sin offering put on its horns (and Keil takes the altars as the Lord''s altars defiled)'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/17.htm'
    quote: "there is no difficulty in taking it to be the altars of Jahveh as defiled by idolatry."
  - where: 'note 17:1 “Engraved on the heart and on the altar”'
    claim: 'Blood of the sin offering was put on the horns of the altar'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/4?lang=eng'
    quote: 'And the priest shall put some of the blood upon the horns of the altar of sweet incense before the Lord'
  - where: 'note 17:1 “Engraved on the heart and on the altar”'
    claim: 'Jeremiah 31:33 speaks of the Lord writing His law in hearts; 24:7 of a heart to know Him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/31?lang=eng'
    quote: 'I will put my law in their inward parts, and write it in their hearts; and will be their God, and they shall be my people.'
  - where: 'note 17:2 “Groves and green trees”'
    claim: 'The Church footnote glosses groves as asherim, fertility idols'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/17?lang=eng'
    quote: 'HEB asherim; i.e., fertility idols.'
  - where: 'note 17:2 “Groves and green trees”'
    claim: 'Asherah was a tree or pole worshipped; the practice was forbidden by prophets'
    key: bd-grove
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/grove?lang=eng'
    quote: 'either a living tree or a tree-like pole, set up as an object of worship, being symbolic of the female or productive principle in nature.'
  - where: 'note 17:2 “Groves and green trees”'
    claim: 'High-place altars began as legitimate and were later desecrated; reformers like Josiah tried to centralize worship'
    key: bd-high-places
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/high-places?lang=eng'
    quote: 'Altars to Jehovah were built at several high places'
  - where: 'note 17:2 “Groves and green trees”'
    claim: 'Heathen altars on hills were ordered destroyed'
    key: bd-high-places
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/high-places?lang=eng'
    quote: 'heathen altars were found set up on various hills and were ordered to be destroyed (Num. 33:52; Deut. 12:2–3).'
  - where: 'note 17:3 “Jerusalem addressed, and a threat repeated”'
    claim: 'The mountain in the field is likely Jerusalem'
    key: ot-manual-23
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng'
    quote: '“O my mountain in the field” (v. 3) is likely a reference to Jerusalem, which is nestled in the hill country of Judea.'
  - where: 'note 17:3 “Jerusalem addressed, and a threat repeated”'
    claim: 'Church footnote glosses mountain as Jerusalem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/17?lang=eng'
    quote: 'IE Jerusalem.'
  - where: 'note 17:3 “Jerusalem addressed, and a threat repeated”'
    claim: 'Jeremiah 15:14 repeats the land-you-know-not and kindled-fire language'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/15?lang=eng'
    quote: 'And I will make thee to pass with thine enemies into a land which thou knowest not: for a fire is kindled in mine anger, which shall burn upon you.'
  - where: 'note 17:5 “Arm of flesh”'
    claim: 'The focus of one''s trust determines cursed or blessed'
    key: ot-manual-23
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng'
    quote: 'The focus of one’s trust determines whether he is cursed or blessed (see vv. 5, 7).'
  - where: 'note 17:5 “Arm of flesh”'
    claim: 'Nephi says nearly the same words'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/4?lang=eng'
    quote: 'Yea, cursed is he that putteth his trust in man or maketh flesh his arm.'
  - where: 'note 17:5 “Arm of flesh”'
    claim: 'D&C 1:19 on the arm of flesh; Church footnote on 17:5 links to it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/1?lang=eng'
    quote: 'that man should not counsel his fellow man, neither trust in the arm of flesh—'
  - where: 'note 17:6 “The heath in the desert”'
    claim: 'The Church footnote gives juniper tree for heath, with Jer. 48:6'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/17?lang=eng'
    quote: 'HEB juniper tree. Jer. 48:6.'
  - where: 'note 17:6 “The heath in the desert”'
    claim: 'The heath represents Judah as a withered tree without moisture'
    key: ot-manual-23
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng'
    quote: '“The heath in the desert” (v. 6) represents Judah as a withered tree without moisture or sustenance.'
  - where: 'note 17:6 “The heath in the desert”'
    claim: 'The footnote on salt land sends to Deut. 29:23, the overthrow of Sodom and Gomorrah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/29?lang=eng'
    quote: 'the whole land thereof is brimstone, and salt, and burning, that it is not sown, nor beareth, nor any grass groweth therein, like the overthrow of Sodom and Gomorrah'
  - where: 'note 17:8 “A tree planted by the waters”'
    claim: 'Psalm 1:3 has a similar tree'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/1?lang=eng'
    quote: 'And he shall be like a tree planted by the rivers of water, that bringeth forth his fruit in his season; his leaf also shall not wither'
  - where: 'note 17:8 “A tree planted by the waters”'
    claim: 'D&C 97:9 promises a fruitful tree to those who keep covenants by sacrifice'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/97?lang=eng'
    quote: 'For I, the Lord, will cause them to bring forth as a very fruitful tree which is planted in a goodly land, by a pure stream, that yieldeth much precious fruit.'
  - where: 'note 17:8 “A tree planted by the waters”'
    claim: 'The Church footnote says the Hebrew behind “see” is “fear”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/17?lang=eng'
    quote: 'HEB fear.'
  - where: 'note 17:9 “Who can know it?”'
    claim: 'Verse 9 states the heart''s nature and verse 10 shows God as searcher; the heart is corrupt, and “who can know it” means who can fathom it'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/17.htm'
    quote: 'the prophet in Jeremiah 17:9 discloses the nature of the human heart, and then shows in Jeremiah 17:10 how God, as the Searcher of hearts, requites man according to his conduct.'
  - where: 'note 17:9 “Who can know it?”'
    claim: 'The Hebrew rendered “desperately wicked” means sore wounded by sin, corrupt; “who can know it” means fathom it'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/17.htm'
    quote: 'sore wounded by sin, corrupt or depraved. Who can know it? i.e., fathom its nature and corruptness.'
  - where: 'note 17:9 “Who can know it?”'
    claim: 'The reins are the seat of the most hidden emotions; the Lord requites by conduct'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/17.htm'
    quote: 'Only God searches the heart and tries the reins, the seat of the most hidden emotions and feelings'
  - where: 'note 17:9 “Who can know it?”'
    claim: 'The Lord elsewhere promises a heart to know Him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/24?lang=eng'
    quote: 'And I will give them an heart to know me, that I am the Lord: and they shall be my people, and I will be their God'
  - where: 'note 17:9 “Who can know it?”'
    claim: 'Manual: the Lord searches the heart and tries the reins to determine directions'
    key: ot-manual-23
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng'
    quote: 'The Lord searches the heart and tries the reins (the inner self) to determine directions (see v. 10).'
  - where: 'note 17:11 “The partridge and unjust riches”'
    claim: 'Those who get rich by dishonest means leave empty-handed'
    key: ot-manual-23
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng'
    quote: 'Like a bird (partridge) that sits on eggs that will not hatch, so those of Judah who get rich by dishonest means will leave empty-handed (see v. 11).'
  - where: 'note 17:11 “The partridge and unjust riches”'
    claim: 'Jacob: treasure perishes with the rich'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/9?lang=eng'
    quote: 'their treasure is their god. And behold, their treasure shall perish with them also.'
  - where: 'note 17:11 “The partridge and unjust riches”'
    claim: 'D&C 56:16 warns the rich who will not give to the poor'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/56?lang=eng'
    quote: 'Wo unto you rich men, that will not give your substance to the poor, for your riches will canker your souls'
  - where: 'note 17:13 “The fountain of living waters”'
    claim: 'Jesus Christ (Jehovah) is the hope of Israel and fountain of living waters; see John 4'
    key: ot-manual-23
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng'
    quote: 'Jesus Christ (Jehovah in the Old Testament) is the very “hope of Israel,” the “fountain of living waters” (v. 13; see also John 4:9–14).'
  - where: 'note 17:13 “The fountain of living waters”'
    claim: 'Jeremiah 2:13 has the same title with the cisterns'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/2?lang=eng'
    quote: 'they have forsaken me the fountain of living waters, and hewed them out cisterns, broken cisterns, that can hold no water.'
  - where: 'note 17:13 “The fountain of living waters”'
    claim: 'Jesus offers living water to the woman at the well'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/4?lang=eng'
    quote: 'thou wouldest have asked of him, and he would have given thee living water.'
  - where: 'note 17:13 “The fountain of living waters”'
    claim: 'Jesus at the feast invites the thirsty'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/7?lang=eng'
    quote: 'If any man thirst, let him come unto me, and drink.'
  - where: 'note 17:13 “Written in the earth”'
    claim: 'Written in the earth means loose earth where writing quickly disappears; contrasted with the book of life (one reading)'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/17.htm'
    quote: 'shall be written in the earth, in the loose earth, where writing speedily disappears.'
  - where: 'note 17:13 “Written in the earth”'
    claim: 'Keil sets it against being written in the book of life'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/17.htm'
    quote: 'The antithesis to this is not the graving in rock, Job 19:24, but being written in the book of life'
  - where: 'note 17:14 “Heal me”'
    claim: 'The Lord Jesus Christ speaks in 3 Nephi 9 and offers to heal those who return'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/9?lang=eng'
    quote: 'will ye not now return unto me, and repent of your sins, and be converted, that I may heal you?'
  - where: 'note 17:14 “Heal me”'
    claim: 'In 3 Nephi 9 the speaker identifies as Jesus Christ'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/9?lang=eng'
    quote: 'Behold, I am Jesus Christ the Son of God.'
  - where: 'note 17:15 “Where is the word of the LORD?”'
    claim: 'The Lord told Jeremiah in chapter 1 that He would hasten His word to perform it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/1?lang=eng'
    quote: 'Thou hast well seen: for I will hasten my word to perform it.'
  - where: 'note 17:15 “Where is the word of the LORD?”'
    claim: 'The taunt asks why predictions do not come to pass; so long as unfulfilled, he could be persecuted as a false prophet'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/17.htm'
    quote: 'So long as his announcements were not fulfilled, the unbelieving were free to persecute him as a false prophet (cf. Deuteronomy 18:22)'
  - where: 'note 17:15 “Where is the word of the LORD?”'
    claim: 'On one reading the taunt dates the discourse before the first Chaldean invasion'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/17.htm'
    quote: 'was delivered before the first invasion of Judah by the Chaldeans.'
  - where: 'note 17:16 “Not hastened from being a pastor”'
    claim: 'The manual links pastor to Christ the Good Shepherd'
    key: ot-manual-23
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng'
    quote: 'Jesus is the Good Shepherd, a Pastor to those who follow Him (see v. 16; see also John 10:14; Psalm 23:1).'
  - where: 'note 17:16 “Not hastened from being a pastor”'
    claim: 'One reading: Jeremiah declares he did not withdraw from following the Lord as a shepherd; prophets feed people by declaring God''s word'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/17.htm'
    quote: "In this sense prophets, too, feed the people, if they, following the Lord as chief shepherd, declare God's word to the people."
  - where: 'note 17:16 “Not hastened from being a pastor”'
    claim: 'Jeremiah defends himself against the charge that he wished the calamity'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/17.htm'
    quote: "Jeremiah is here defending himself against the charges of his enemies, who inferred from his prophecies of evil that he found a pleasure in his people's calamity"
  - where: 'note 17:18 “Double destruction”'
    claim: 'Reading: the prayer asks that the foretold calamity be fulfilled, putting persecutors to shame'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/17.htm'
    quote: 'May God rather put his persecutors to shame and confusion by the accomplishment of the calamity foretold'
  - where: 'note 17:18 “Double destruction”'
    claim: 'The Lord Himself says in 16:18 that He will recompense their iniquity double'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/16?lang=eng'
    quote: 'And first I will recompense their iniquity and their sin double'
  - where: 'note 17:19 “The gate”'
    claim: 'The city gate was a place for public business'
    key: bd-gate
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/gate?lang=eng'
    quote: 'The gate of a city was often a place for public business'
  - where: 'note 17:21 “What the burden was”'
    claim: 'Nehemiah describes burdens brought into Jerusalem on the sabbath and shut gates'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/13?lang=eng'
    quote: 'when the gates of Jerusalem began to be dark before the sabbath, I commanded that the gates should be shut, and charged that they should not be opened till after the sabbath'
  - where: 'note 17:21 “What the burden was”'
    claim: 'Nehemiah says Judah brought wine, grapes, figs and burdens into Jerusalem on the sabbath'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/13?lang=eng'
    quote: 'as also wine, grapes, and figs, and all manner of burdens, which they brought into Jerusalem on the sabbath day'
  - where: 'note 17:21 “What the burden was”'
    claim: 'After the exile Nehemiah made Sabbath observance a chief point of reform'
    key: bd-sabbath
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sabbath?lang=eng'
    quote: 'After the return from the exile Nehemiah made the observance of the Sabbath one of the chief points of his reformation (10:31; 13:15–22)'
  - where: 'note 17:22 “Hallow the sabbath”'
    claim: 'The Sabbath commemorates Creation and redemption from Egypt; it is an eternal principle'
    key: bd-sabbath
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sabbath?lang=eng'
    quote: 'Instituted to commemorate God’s seventh day of rest at the Creation (Ex. 20:10–11), and also the redemption from Egyptian bondage (Deut. 5:15).'
  - where: 'note 17:22 “Hallow the sabbath”'
    claim: 'The Sabbath is an eternal principle'
    key: bd-sabbath
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sabbath?lang=eng'
    quote: 'the Sabbath is an eternal principle and would have existed from the days of Adam'
  - where: 'note 17:22 “Hallow the sabbath”'
    claim: 'D&C 59 describes the day as rest and devotion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/59?lang=eng'
    quote: 'this is a day appointed unto you to rest from your labors, and to pay thy devotions unto the Most High;'
  - where: 'note 17:25 “A promise with a condition”'
    claim: 'Jeremiah 22:4 makes a parallel conditional promise of kings on David''s throne'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/22?lang=eng'
    quote: 'For if ye do this thing indeed, then shall there enter in by the gates of this house kings sitting upon the throne of David, riding in chariots and on horses'
  - where: 'note 17:25 “A promise with a condition”'
    claim: 'In the temple sermon the people trusted in the temple while doing wrong'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/7?lang=eng'
    quote: 'Trust ye not in lying words, saying, The temple of the Lord, The temple of the Lord, The temple of the Lord, are these.'
  - where: 'christ'
    claim: 'Jesus in 3 Nephi 9 and at Jacob''s well'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/9?lang=eng'
    quote: 'mine arm of mercy is extended towards you'
  - where: 'explore'
    claim: 'Jeremiah 15:10–21 is a prior exchange in which the prophet complains of persecution and is comforted'
    key: ot-manual-23
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng'
    quote: 'Next, the prophet complains of the persecution he has to endure, and is corrected by the Lord and comforted [Jeremiah 15:10–21].'
  - where: 'note 17:2 “Groves and green trees”'
    claim: 'The Bible Dictionary says the asherah worship became associated with gross immorality'
    key: bd-grove
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/grove?lang=eng'
    quote: 'This “nature worship” became associated with gross immorality'
  - where: 'note 17:2 “Groves and green trees”'
    claim: 'Altars were desecrated; Hezekiah and Josiah reformed'
    key: bd-high-places
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/high-places?lang=eng'
    quote: 'many of these altars were desecrated and used for heathen worship. Religious reformers like Hezekiah and Josiah'
  - where: 'note 17:5 “Arm of flesh”'
    claim: 'The Church footnote on 17:5 links to D&C 1:19'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/17?lang=eng'
    quote: 'D&C 1:19.'
  - where: 'note 17:9 “Who can know it?”'
    claim: 'A man must not trust the suggestions of his own heart'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/17.htm'
    quote: 'Therefore a man must not trust the suggestions and illusions of his own heart.'
  - where: 'note 17:11 “The partridge and unjust riches”'
    claim: 'The Church footnote on verse 11 gives 2 Ne. 9:30 and D&C 56:16'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/17?lang=eng'
    quote: '2 Ne. 9:30;'
  - where: 'note 17:18 “Double destruction”'
    claim: 'The Church footnote on “double destruction” gives Isa. 40:2 and Jer. 16:18'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/17?lang=eng'
    quote: 'Isa. 40:2;'
  - where: 'setting'
    claim: 'Chapter 15 holds an earlier exchange on persecution'
    key: ot-manual-23
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng'
    quote: 'Next, the prophet complains of the persecution he has to endure, and is corrected by the Lord and comforted [Jeremiah 15:10–21].'
  - where: 'note 17:1 “Engraved on the heart and on the altar”'
    claim: 'An iron stylus was used for carving letters into hard material'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/17.htm'
    quote: 'The iron style was used only for writing or carving letters in a hard material'
  - where: 'note 17:1 “Engraved on the heart and on the altar”'
    claim: 'The diamond is the point of an engraver''s tool'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/17.htm'
    quote: 'here of the point of the style or graving-iron, the diamond pencil which gravers use for carving in iron, steel, and stone.'
  - where: 'note 17:1 “Engraved on the heart and on the altar”'
    claim: 'The altars of the Lord''s house had horns on which sacrificial blood was put'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/17.htm'
    quote: 'the temple of the Lord itself contained two altars, on whose horns the blood of the sacrifice was sprinkled.'
  - where: 'section 3 plain'
    claim: 'The Hebrew behind “desperately wicked” means literally dangerously sick, incurable'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/17.htm'
    quote: 'lit., dangerously sick, incurable'
  - where: 'section 3 plain'
    claim: 'The partridge sits on eggs that will not hatch'
