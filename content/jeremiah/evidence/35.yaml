    claim: 'Lehi''s call came in the first year of Zedekiah'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/1?lang=eng
    quote: 'first year of the reign of Zedekiah'
  - where: 'note 35:1 “A flashback to Jehoiakim''s reign”'

    claim: 'Jehoiakim reigned 608–597 B.C.'
    key: bd-jeremiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng
    quote: 'Jehoiakim (608–597)'
  - where: 'setting'
