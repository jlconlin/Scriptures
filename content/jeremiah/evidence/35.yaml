    key: thompson-rechabites
    url: https://scripturecentral.org/archive/books/book-chapter/rechabites-model-group-lehis-world
    quote: 'The only glimpses we have of this obedient group in Lehi’s day come from Jeremiah 35.'
  - where: 'note 35:19 “A man to stand before me”'
