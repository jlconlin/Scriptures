chapter: 35
claims:
  - where: 'setting'

    claim: 'The Church heading summarizes the chapter: the Rechabites are commended and blessed for their obedience'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/35?lang=eng
    quote: 'The Rechabites are commended and blessed for their obedience.'
  - where: 'setting'

    claim: 'Jeremiah 35 is a flashback to events several years before the chapters about Zedekiah; such flashbacks occur several times in the book'
    key: ot-seminary-guide-jer-35
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-student-study-guide-obs/the-book-of-jeremiah/jeremiah-35-the-rechabites?lang=eng
    quote: 'Jeremiah 35 records events that actually occurred several years before those in previous chapters. … This kind of “flashback” occurs several times in the book of Jeremiah.'
  - where: 'setting'

    claim: 'The Rechabites had moved to Jerusalem to escape the invading Babylonians; the chapter goes back to the reign of Jehoiakim'
    key: ot-manual-24
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng
    quote: 'This chapter goes back in time to the reign of Jehoiakim, son of Josiah (see Jeremiah 25). … (These people had moved to Jerusalem to escape the invading Babylonians.)'
  - where: "note 35:1 “A flashback to Jehoiakim's reign”"
    claim: 'Jehoiakim served Nebuchadnezzar three years then rebelled; the Lord sent bands of Chaldees, Syrians, Moabites and Ammonites against Judah'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng
    quote: 'Nebuchadnezzar king of Babylon came up, and Jehoiakim became his servant three years: then he turned and rebelled against him.'
  - where: "note 35:1 “A flashback to Jehoiakim's reign”"
    claim: 'Jeremiah 36 is dated to the fourth year of Jehoiakim'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/36?lang=eng
    quote: 'it came to pass in the fourth year of Jehoiakim the son of Josiah king of Judah, that this word came unto Jeremiah from the Lord'
  - where: 'note 35:2 “Who the Rechabites were”'

    claim: 'Jehu met Jehonadab son of Rechab and took him into his chariot'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/10?lang=eng
    quote: 'he lighted on Jehonadab the son of Rechab coming to meet him'
  - where: 'note 35:2 “Who the Rechabites were”'

    claim: 'Rechab''s house is listed among the Kenites'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/2?lang=eng
    quote: 'These are the Kenites that came of Hemath, the father of the house of Rechab.'
  - where: 'note 35:2 “Who the Rechabites were”'

    claim: 'The Kenites were Moses'' father-in-law''s descendants who settled in Judah''s wilderness'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/judg/1?lang=eng
    quote: 'the children of the Kenite, Moses’ father in law, went up out of the city of palm trees with the children of Judah into the wilderness of Judah'
  - where: 'note 35:2 “Who the Rechabites were”'

    claim: 'How the Rechabite group originated is obscure; some have called it a mystery'
    key: thompson-rechabites
    url: https://scripturecentral.org/archive/books/book-chapter/rechabites-model-group-lehis-world
    quote: 'How the Rechabite group originated is obscure; some have called it “a mystery.”'
  - where: 'note 35:2 “Who the Rechabites were”'
    claim: 'The links in 2 Kings and 1 Chronicles assume the texts speak of the same group (held loosely); Jehu met Jonadab in the ninth century'
    key: thompson-rechabites
    url: https://scripturecentral.org/archive/books/book-chapter/rechabites-model-group-lehis-world
    quote: 'Hints of the origins of the Rechabites are given in 2 Kings and 1 Chronicles, assuming that these texts are speaking of the same group. Back in the ninth century, King Jehu encountered Jehonadab (Jonadab)'
  - where: 'note 35:2 “Who the Rechabites were”'

    claim: 'Malchiah son of Rechab repaired the dung gate in Nehemiah'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/neh/3?lang=eng
    quote: 'the dung gate repaired Malchiah the son of Rechab, the ruler of part of Beth-haccerem'
  - where: 'note 35:2 “An offer of wine”'

    claim: 'Abstinence from wine was not practiced by all Israelites; only priests on duty and Nazarites are identified as abstaining'
    key: thompson-rechabites
    url: https://scripturecentral.org/archive/books/book-chapter/rechabites-model-group-lehis-world
    quote: 'Abstinence was not practiced by all the Israelites and was viewed as somewhat peculiar.'
  - where: 'note 35:2 “An offer of wine”'

    claim: 'Priests were forbidden wine when entering the tabernacle'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/lev/10?lang=eng
    quote: 'Do not drink wine nor strong drink, thou, nor thy sons with thee, when ye go into the tabernacle of the congregation, lest ye die'
  - where: 'note 35:2 “An offer of wine”'

    claim: 'The Nazarite separated from wine and the vine'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/num/6?lang=eng
    quote: 'He shall separate himself from wine and strong drink'
  - where: 'note 35:2 “An offer of wine”'

    claim: 'The Rechabites'' rules were human traditions, not part of their religion; the Lord used them as an object lesson'
    key: ot-seminary-guide-jer-35
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-student-study-guide-obs/the-book-of-jeremiah/jeremiah-35-the-rechabites?lang=eng
    quote: 'These traditions were not part of their religion, but they followed the rules and traditions very faithfully. The Lord used these people as an object lesson.'
  - where: 'note 35:4 “The chamber in the temple”'

    claim: 'Chambers were additional buildings in the temple courts; nothing further is known of Hanan, called man of God; Jaazaniah probably chief of the Rechabites'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/35.htm
    quote: 'Jaazaniah was probably the then chief of the Rechabites. … Nothing further is known about Hanan the son of Jigdaliah; here he is called "the man of God," an honourable title of the prophets'
  - where: 'note 35:4 “The chamber in the temple”'
    claim: 'The temple chambers were additional buildings in the temple forecourts'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/35.htm
    quote: '"cells of the temple," were additional buildings in the temple fore-courts'
  - where: 'note 35:4 “The chamber in the temple”'

    claim: 'Shemaiah is called the man of God in 1 Kings 12:22'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/12?lang=eng
    quote: 'the word of God came unto Shemaiah the man of God, saying,'
  - where: 'note 35:7 “Tents, no vineyards, no fields”'

    claim: 'The reason the Rechabites lived away from towns is not stated; Lehi was told to take his family into the wilderness'
    key: thompson-rechabites
    url: https://scripturecentral.org/archive/books/book-chapter/rechabites-model-group-lehis-world
    quote: 'We do not know why the Rechabites chose to live away from major towns or cities, but Lehi was instructed by the Lord to take his family and dwell in the wilderness'
  - where: 'note 35:7 “Tents, no vineyards, no fields”'

    claim: 'One reading: Jonadab''s rule kept them in the simplicity of nomad life and from the corrupting influences of settled life'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/35.htm
    quote: 'in order to keep them in the simplicity of nomad life observed by their fathers, and to preserve them from the corrupting influences connected with a settled life.'
  - where: 'note 35:7 “Tents, no vineyards, no fields”'

    claim: 'Hebrew participle behind “strangers” is “sojourning”'
    key: biblehub-interlinear
    url: https://biblehub.com/interlinear/jeremiah/35-7.htm
    quote: 'sojourning V‑Qal‑Prtcpl‑mp'
  - where: "note 35:7 “Tents in Lehi's Jerusalem”"
    claim: 'Nephi repeatedly says Lehi dwelt in a tent; Lehites and Rechabites compared; Lehi family spent about eight years in the desert'
    key: thompson-rechabites
    url: https://scripturecentral.org/archive/books/book-chapter/rechabites-model-group-lehis-world
    quote: 'Nephi made repeated mention of the fact that Lehi dwelt in a tent during this time: “And my father dwelt in a tent” (1 Nephi 2:15; 9:1; 10:16; 16:6; see also 2:6; 3:1; 4:38; 5:7; 7:5, 21, 22; 16:10)'
  - where: "note 35:7 “Tents in Lehi's Jerusalem”"
    claim: 'Authors judge it reasonable to surmise Lehi and followers modeled behavior on the Rechabites; the Rechabites and Lehites could have known each other'
    key: thompson-rechabites
    url: https://scripturecentral.org/archive/books/book-chapter/rechabites-model-group-lehis-world
    quote: 'It is therefore reasonable to surmise that Lehi and his followers may have modeled their behavior in certain respects after this exemplary group of pious but eccentric Israelites.'
  - where: "note 35:7 “Tents in Lehi's Jerusalem”"
    claim: 'Because of the promise of v.19, many Jewish traditions presume the Rechabites fled Jerusalem before its destruction'
    key: sc-knowhy-710
    url: https://scripturecentral.org/knowhy/why-are-lehis-and-nephis-visions-and-histories-similar-to-the-history-of-the-rechabites
    quote: 'Because of this promise, many Jewish traditions presume that the Rechabites (like Lehi) fled Jerusalem before it was destroyed by Babylon'
  - where: "note 35:7 “Tents in Lehi's Jerusalem”"
    claim: 'Whether the later lore has a historical connection with Lehi remains uncertain'
    key: thompson-rechabites
    url: https://scripturecentral.org/archive/books/book-chapter/rechabites-model-group-lehis-world
    quote: 'Whether this religious lore has any historical connection with Lehi and his covenantal group similarly living in a state of messianic expectation and apocalyptic anticipation remains uncertain'
  - where: 'note 35:11 “Why they were in Jerusalem”'

    claim: 'The Hebrew behind “Syrians” in v.11 is Aram'
    key: biblehub-interlinear
    url: https://biblehub.com/interlinear/jeremiah/35-11.htm
    quote: '’ă·rām; אֲרָ֑ם of Aram N‑proper‑fs'
  - where: 'note 35:11 “Why they were in Jerusalem”'

    claim: 'Bands of Syrians were among those sent against Judah in Jehoiakim''s reign'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng
    quote: 'the Lord sent against him bands of the Chaldees, and bands of the Syrians, and bands of the Moabites, and bands of the children of Ammon'
  - where: 'note 35:13 “The argument from the lesser to the greater”'

    claim: 'The Rechabites kept their covenants though not the covenant people; the Jews broke their promises; the message was clear'
    key: ot-manual-24
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng
    quote: 'the Rechabites observed their covenants faithfully, even though they were not the covenant people of the Lord. The Jews were transgressors of the Lord’s commands and broke their promises to God at every turn.'
  - where: 'note 35:13 “The argument from the lesser to the greater”'

    claim: 'The lesson: Rechabites keep human traditions, Judah cannot keep commandments of a living God with real and eternal blessings; the Lord promised to bless the Rechabites'
    key: ot-seminary-guide-jer-35
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-student-study-guide-obs/the-book-of-jeremiah/jeremiah-35-the-rechabites?lang=eng
    quote: 'the Rechabites faithfully keep human traditions, but the people of Judah cannot keep the commandments of a living God—commandments that have real and eternal blessings attached to them.'
  - where: 'note 35:14 “The Lord rises early”'

    claim: 'The idiom (hashkem) “speaking early and often” is used especially of the Lord in Jeremiah, including 35:14; “sending early and often” likewise'
    key: bdb
    url: https://biblehub.com/hebrew/7925.htm
    quote: 'especially of ׳י, in Jeremiah: ׳הַשׁ וְדַבֵּר = speaking early and often Jeremiah 7:13; Jeremiah 35:14'
  - where: 'note 35:14 “The Lord rises early”'

    claim: 'BDB: the verb properly means to load backs of beasts for the day''s journey; rise early'
    key: bdb
    url: https://biblehub.com/hebrew/7925.htm
    quote: 'start, rise, early (properly load backs of beasts for day''s journey)'
  - where: 'note 35:14 “The Lord rises early”'

    claim: 'The same idiom appears with the Chronicler''s reason: the Lord sent messengers because He had compassion on His people'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/36?lang=eng
    quote: 'the Lord God of their fathers sent to them by his messengers, rising up betimes, and sending; because he had compassion on his people'
  - where: 'note 35:14 “The Lord rises early”'

    claim: 'Jeremiah says the same of his own ministry in Jer. 25:3–4'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/25?lang=eng
    quote: 'the Lord hath sent unto you all his servants the prophets, rising early and sending them; but ye have not hearkened'
  - where: 'note 35:19 “A man to stand before me”'

    claim: 'BDB lists the idiom “there shall not fail thee a man” in 1 Kgs 2:4, Jer 33:17–18 and Jer 35:19'
    key: bdb
    url: https://biblehub.com/hebrew/3772.htm
    quote: 'אִישׁ ׳לֹא יִכָּרֵת לְ there shall not fail thee a man 1 Kings 2:4; 1 Kings 8:25 2Chronicles 6:16; 1 Kings 9:5 2Chronicles 7:18; Jeremiah 33:17,18; Jeremiah 35:19'
  - where: 'note 35:19 “A man to stand before me”'

    claim: 'Jer 33:17–18 gives the same promise to David and to the Levitical priests'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/33?lang=eng
    quote: 'David shall never want a man to sit upon the throne of the house of Israel; Neither shall the priests the Levites want a man before me'
  - where: 'note 35:19 “A man to stand before me”'

    claim: '1 Kings 2:4 gives the Davidic promise conditioned on walking before the Lord'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/2?lang=eng
    quote: 'there shall not fail thee (said he) a man on the throne of Israel.'
  - where: 'note 35:19 “A man to stand before me”'

    claim: '“Stand before” expresses continuance in the Lord''s service, without sacerdotal service (one reading)'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/35.htm
    quote: 'עמד לפני seems here also to express not merely the permanence of the family, but in addition, their continuance in the service of the Lord, without, of course, involving sacerdotal service'
  - where: 'christ'

    claim: 'Jehovah is the premortal Jesus Christ; “the Lord” in the Old Testament usually means Jehovah'
    key: gs-jehovah
    url: https://www.churchofjesuschrist.org/study/scriptures/gs/jehovah?lang=eng
    quote: 'Jehovah is the premortal Jesus Christ and came to earth as a son of Mary (Mosiah 3:8; 15:1; 3 Ne. 15:1–5).'
  - where: 'christ'

    claim: 'Jesus laments over Jerusalem that He would have gathered her children and they would not'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/nt/matt/23?lang=eng
    quote: 'how often would I have gathered thy children together, even as a hen gathereth her chickens under her wings, and ye would not!'
  - where: 'note 35:4 “The chamber in the temple”'

    claim: 'The princes'' chamber is where the princes used to assemble in the temple'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/35.htm
    quote: '"The chamber of the princes" is the chamber where the princes, the chiefs of the people, used to assemble in the temple.'
  - where: 'note 35:4 “The chamber in the temple”'

    claim: 'Jeremiah the prophet is the son of Hilkiah'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/1?lang=eng
    quote: 'The words of Jeremiah the son of Hilkiah'
