    key: bdb
    url: https://biblehub.com/hebrew/5975.htm
    quote: 'with לִפְנֵי attend upon, be(come) servant of 1 Samuel 16:22 (see Dr), 1 Kings 1:2 +; servant of ׳ י 1 Kings 17:1'
