chapter: 24
claims:
  - where: 'when'
    claim: 'Prophecies under Zedekiah run 597–586 B.C.; Jeremiah 24 is on the exiles carried away with Jehoiachin'
    key: bd-jeremiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng
    quote: 'Prophecies under Zedekiah (597–586), Jer. 21–38'
  - where: 'setting'
    claim: 'Jeremiah 24 is grouped with the prophecies on the exiles carried away with Jehoiachin'
    key: bd-jeremiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng
    quote: 'Jer. 24, on exiles carried away with Jehoiachin.'
  - where: 'setting'
    claim: 'Church chapter heading for Jeremiah 24'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/24?lang=eng
    quote: 'Zedekiah and the people of Judah will be cursed and scattered—Some will be gathered back from Chaldea to serve the Lord.'
  - where: 'setting'
    claim: 'Lehi was at Jerusalem in the first year of Zedekiah, when many prophets were calling the people to repent'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/1?lang=eng
    quote: 'in the commencement of the first year of the reign of Zedekiah, king of Judah, (my father, Lehi, having dwelt at Jerusalem in all his days)'
  - where: 'setting'
    claim: 'Jeremiah later wrote a letter to the exiles in Babylon (chapter 29), sent after Jeconiah and the craftsmen had left'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/29?lang=eng
    quote: 'Now these are the words of the letter that Jeremiah the prophet sent from Jerusalem unto the residue of the elders which were carried away captives'
  - where: 'note 24:1 “Jeconiah’s exile: the first deportation”'
    claim: 'Jehoiachin was called Coniah by Jeremiah (Jeconiah is the same king under another spelling)'
    key: ot-manual-24
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng
    quote: 'Jehoiachin, the son of Jehoiakim, was called Coniah by Jeremiah.'
  - where: 'note 24:1 “Jeconiah’s exile: the first deportation”'
    claim: 'Jehoiachin was eighteen and reigned three months'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng
    quote: 'Jehoiachin was eighteen years old when he began to reign, and he reigned in Jerusalem three months.'
  - where: 'note 24:1 “Jeconiah’s exile: the first deportation”'
    claim: 'The deportation took the princes, mighty men, ten thousand captives, craftsmen and smiths; only the poorest were left'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng
    quote: 'he carried away all Jerusalem, and all the princes, and all the mighty men of valour, even ten thousand captives, and all the craftsmen and smiths: none remained, save the poorest sort of the people of the land.'
  - where: 'note 24:1 “Jeconiah’s exile: the first deportation”'
    claim: 'Nebuchadnezzar made Jehoiachin''s uncle king, with the throne name Zedekiah'
    key: ot-manual-kings-g
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-g?lang=eng
    quote: 'Jehoiachin was likewise exiled, and his uncle, who took the throne name Zedekiah, ruled in his stead.'
  - where: 'note 24:1 “Jeconiah’s exile: the first deportation”'
    claim: 'There were deportations in 597 and again in 586 B.C.'
    key: bd-captivities
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/captivities-of-the-israelites?lang=eng
    quote: 'in 597 B.C. and again in 586 B.C. there were large deportations under Nebuchadnezzar'
  - where: 'note 24:1 “Jeconiah’s exile: the first deportation”'
    claim: 'Ezekiel was one of the captives carried away with Jehoiachin'
    key: bd-ezekiel
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng
    quote: 'one of the captives carried away by Nebuchadnezzar along with Jehoiachin.'
  - where: 'note 24:2 “First-ripe figs”'
    claim: 'The early figs ripened at the end of June before the August season and were prized dainties'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/24.htm
    quote: 'for the first figs, those ripened at the end of June, before the fruit season in August, were highly prized dainties.'
  - where: 'note 24:2 “First-ripe figs”'
    claim: 'Hosea 9:10 uses the first-ripe fig for Israel when the Lord first found her'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/9?lang=eng
    quote: 'I saw your fathers as the firstripe in the fig tree at her first time'
  - where: 'note 24:2 “First-ripe figs”'
    claim: 'The Church edition glosses naughty as Hebrew bad or corrupted'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/24?lang=eng
    quote: 'HEB  bad or corrupted.'
  - where: 'note 24:3 “The question from the first visions”'
    claim: 'The same question opens both visions of chapter 1'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/1?lang=eng
    quote: 'Jeremiah, what seest thou? And I said, I see a rod of an almond tree.'
  - where: 'note 24:5 “Exile ‘for their good’”'
    claim: 'The Lord’s will was that Judah submit and repent; those who did were carried away for their good'
    key: ot-manual-24
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng
    quote: 'It was the Lord’s will that Judah submit to Babylonia, take their punishment, and repent. Those who did so were carried away “for their good”'
  - where: 'note 24:5 “Exile ‘for their good’”'
    claim: 'The Church edition links “for their good” to D&C 122:7'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/24?lang=eng
    quote: 'D&amp;C 122:7.'
  - where: 'note 24:5 “Exile ‘for their good’”'
    claim: 'D&C 122:7 says the Lord to Joseph that all these things shall be for his good'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/122?lang=eng
    quote: 'know thou, my son, that all these things shall give thee experience, and shall be for thy good.'
  - where: 'note 24:5 “Exile ‘for their good’”'
    claim: 'Inhabitants of Jerusalem told the exiles to get far from the Lord (Ezekiel 11:15)'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/11?lang=eng
    quote: 'the inhabitants of Jerusalem have said, Get you far from the Lord: unto us is this land given in possession.'
  - where: 'note 24:5 “Exile ‘for their good’”'
    claim: 'The Lord answers that He will be a little sanctuary where they have been scattered'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/11?lang=eng
    quote: 'yet will I be to them as a little sanctuary in the countries where they shall come.'
  - where: 'note 24:5 “Exile ‘for their good’”'
    claim: 'Jeremiah’s letter told the exiles to build houses, plant gardens, and seek the peace of the city'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/29?lang=eng
    quote: 'Build ye houses, and dwell in them; and plant gardens, and eat the fruit of them;'
  - where: 'note 24:6 “The return Nephi names”'
    claim: 'Nephi says Jerusalem was destroyed after Lehi left, except those carried captive to Babylon, who will return'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/25?lang=eng
    quote: 'they have been destroyed, save it be those which are carried away captive into Babylon.'
  - where: 'note 24:6 “The return Nephi names”'
    claim: 'Nephi: they shall return and be restored to the land of their inheritance'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/25?lang=eng
    quote: 'they shall return again, and possess the land of Jerusalem; wherefore, they shall be restored again to the land of their inheritance.'
  - where: 'note 24:6 “The return Nephi names”'
    claim: 'Nephi sees the Jews reject the Messiah and later be persuaded to believe in Christ, and the Lord set His hand a second time'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/25?lang=eng
    quote: 'until they shall be persuaded to believe in Christ, the Son of God, and the atonement, which is infinite for all mankind'
  - where: 'note 24:6 “The return Nephi names”'
    claim: 'The Church edition links “bring them again” to Jer. 16:15 and 2 Ne. 25:11–17'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/24?lang=eng
    quote: '2 Ne. 25:11 (11–17).'
  - where: 'note 24:7 “A heart to know the Lord”'
    claim: 'The Lord gives the heart; the turning is the working of the knowledge of the Lord put in their hearts'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/24.htm
    quote: 'it is the working of the knowledge of the Lord put in their hearts.'
  - where: 'note 24:7 “A heart to know the Lord”'
    claim: 'Ezekiel 11 promises the exiles one heart, a new spirit, a heart of flesh, and the same covenant words'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/11?lang=eng
    quote: 'And I will give them one heart, and I will put a new spirit within you; and I will take the stony heart out of their flesh, and will give them an heart of flesh'
  - where: 'note 24:7 “A heart to know the Lord”'
    claim: 'Jeremiah 31:33 uses the same covenant words of a law written in the heart'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/31?lang=eng
    quote: 'I will put my law in their inward parts, and write it in their hearts; and will be their God, and they shall be my people.'
  - where: 'note 24:7 “A heart to know the Lord”'
    claim: 'Chapters 30–33 are prophecies of the latter-day restoration of Israel and the gospel covenant'
    key: bd-jeremiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng
    quote: 'Jer. 30–33, prophecies of the latter-day restoration of Israel and the gospel covenant'
  - where: 'note 24:7 “A heart to know the Lord”'
    claim: 'The Church edition footnote on this phrase is Topical Guide “Man, New, Spiritually Reborn”'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/24?lang=eng
    quote: 'TG  Man, New, Spiritually Reborn.'
  - where: 'note 24:8 “Zedekiah, the king who would not submit”'
    claim: 'Zedekiah was the last king of Judah, his name changed from Mattaniah'
    key: bd-zedekiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/zedekiah?lang=eng
    quote: 'The last king of Judah, his name changed from Mattaniah to Zedekiah'
  - where: 'note 24:8 “Zedekiah, the king who would not submit”'
    claim: 'Zedekiah and others refused to submit'
    key: ot-manual-24
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng
    quote: 'Zedekiah and others, however, refused to submit.'
  - where: 'note 24:8 “Zedekiah, the king who would not submit”'
    claim: 'Jeremiah told Zedekiah to bring his neck under Babylon’s yoke and live'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/27?lang=eng
    quote: 'Bring your necks under the yoke of the king of Babylon, and serve him and his people, and live.'
  - where: 'note 24:8 “Zedekiah, the king who would not submit”'
    claim: 'Zedekiah fled, was captured, saw his sons slain, and was blinded and taken in chains'
    key: ot-manual-kings-g
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-g?lang=eng
    quote: 'his sons were slain in his presence, and then he was blinded and dragged off northward in chains.'
  - where: 'note 24:8 “Judah’s people in Egypt”'
    claim: 'One reading: those in Egypt had fled there during the war'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/24.htm
    quote: 'Those in Egypt are they who during the war had fled thither to hide themselves from judgment.'
  - where: 'note 24:8 “Judah’s people in Egypt”'
    claim: 'Jeremiah 44 is addressed to Jews living in Egypt, and says none of the remnant there shall return'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/44?lang=eng
    quote: 'none of the remnant of Judah, which are gone into the land of Egypt to sojourn there, shall escape or remain'
  - where: 'note 24:9 “Reproach, proverb, and curse”'
    claim: 'Deuteronomy 28:37 is the covenant curse that Israel will become an astonishment, a proverb, and a byword'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/deut/28?lang=eng
    quote: 'thou shalt become an astonishment, a proverb, and a byword, among all nations whither the Lord shall lead thee.'
  - where: 'note 24:9 “Reproach, proverb, and curse”'
    claim: 'The Church edition footnote lists Deut. 28:37 and 1 Ne. 19:14 for this phrase'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/24?lang=eng
    quote: 'Deut. 28:37; Ezek. 5:15 (14–15); Joel 2:17 (17–19); Micah 6:16; 1 Ne. 19:14 (13–16).'
  - where: 'note 24:9 “Reproach, proverb, and curse”'
    claim: 'Nephi, reporting the prophet’s words, says those who turn their hearts aside shall become a hiss and a byword'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/19?lang=eng
    quote: 'they shall wander in the flesh, and perish, and become a hiss and a byword, and be hated among all nations.'
  - where: 'note 24:9 “Reproach, proverb, and curse”'
    claim: 'Jeremiah 29:17 repeats the figs for those who remained'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/29?lang=eng
    quote: 'I will send upon them the sword, the famine, and the pestilence, and will make them like vile figs, that cannot be eaten, they are so evil.'
  - where: 'note 24:9 “Good and evil: one pair of words”'
    claim: 'In verse 2 the Hebrew for “good” (2896) and “bad” (7451, ra) pair up'
    key: oshb-wlc
    url: https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml
    quote: '<w lemma="2896 a" morph="HAafpa" id="24iSP">טֹב֣וֹת</w> … <w lemma="7451 a" morph="HAafpa" id="245AM">רָע֣וֹת</w>'
  - where: 'note 24:9 “Good and evil: one pair of words”'
    claim: 'Verse 5 and 6 “for good” is letovah (2896); verse 9 “for their hurt” is lera‘ah (7451)'
    key: oshb-wlc
    url: https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml
    quote: '<w lemma="l/2896 c" n="1.1" morph="HR/Aafsa" id="24bHQ">לְ/טוֹבָ֔ה</w> … <w lemma="l/7451 c" n="1.1" morph="HR/Ncfsa" id="24AeZ">לְ/רָעָ֔ה</w>'
  - where: 'note 24:9 “Good and evil: one pair of words”'
    claim: 'BDB gives the basic sense of ra‘ as bad, evil'
    key: bdb
    url: https://biblehub.com/hebrew/7451.htm
    quote: 'Brown-Driver-Briggs I. רַע 226 adjective bad, evil'
  - where: 'note 24:9 “Good and evil: one pair of words”'
    claim: 'ra‘ (7451) stands in verses 3 and 8 (KJV evil) as well as verse 2 (naughty) and verse 9 (hurt)'
    key: oshb-wlc
    url: https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml
    quote: '<w lemma="c/d/7451 a" n="0.1.0" morph="HC/Td/Aafpa" id="24cFV">וְ/הָֽ/רָעוֹת֙</w> … <w lemma="d/7451 a" n="1.1" morph="HTd/Aafpa" id="24H6s">הָֽ/רָע֔וֹת</w>'
  - where: 'thread'
    claim: 'Building and planting in verse 6 recall Jeremiah 1:10'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/24.htm
    quote: 'With "build them," etc., cf. Jeremiah 1:10.'
  - where: 'christ'
    claim: 'Nephi: the Lord will set His hand again the second time to restore His people'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/25?lang=eng
    quote: 'And the Lord will set his hand again the second time to restore his people from their lost and fallen state.'
  - where: 'explore'
    claim: 'Jeremiah 28:1–4 and 27:20–22 are related passages in the same period'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/27?lang=eng
    quote: 'Which Nebuchadnezzar king of Babylon took not, when he carried away captive Jeconiah the son of Jehoiakim king of Judah from Jerusalem to Babylon'
  - where: 'note 24:1 “Jeconiah’s exile: the first deportation”'
    claim: 'Babylon deported the educated, skilled, and religious to weaken Judah’s leadership'
    key: ot-manual-kings-g
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-g?lang=eng
    quote: 'The Babylonians deported many of the educated, skilled, and religious to weaken the leadership capability of Judah.'
  - where: 'note 24:2 “First-ripe figs”'
    claim: 'The comparison to early figs serves simply to heighten the idea of very good'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/24.htm
    quote: 'The comparison to early figs serves simply to heighten the idea of very good'
  - where: 'setting'
    claim: 'Jehoiachin was exiled and his uncle took the throne name Zedekiah'
    key: ot-manual-kings-g
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-g?lang=eng
    quote: 'Jehoiachin was likewise exiled, and his uncle, who took the throne name Zedekiah, ruled in his stead.'
  - where: 'setting'
    claim: 'Nebuchadnezzar carried away princes, craftsmen and smiths, ten thousand captives in 597'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng
    quote: 'he carried away all Jerusalem, and all the princes, and all the mighty men of valour, even ten thousand captives, and all the craftsmen and smiths'
  - where: 'setting'
    claim: 'The 597 deportation under Nebuchadnezzar'
    key: bd-captivities
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/captivities-of-the-israelites?lang=eng
    quote: 'in 597 B.C. and again in 586 B.C. there were large deportations under Nebuchadnezzar'
  - where: 'setting'
    claim: 'Ezekiel was among the exiles'
    key: bd-ezekiel
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/ezekiel?lang=eng
    quote: 'one of the captives carried away by Nebuchadnezzar along with Jehoiachin.'
  - where: 'thread'
    claim: 'Ezekiel 11:15 shows Jerusalem’s view of the exiles'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/11?lang=eng
    quote: 'the inhabitants of Jerusalem have said, Get you far from the Lord: unto us is this land given in possession.'
  - where: 'thread'
    claim: 'Those who submitted, took their punishment, and repented were carried away for their good; Zedekiah and others refused to submit'
    key: ot-manual-24
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng
