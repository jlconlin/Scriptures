chapter: 39
claims:
  - where: 'when'
    claim: 'The fall of Jerusalem is dated 586 B.C.'
    key: bd-jeremiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng'
    quote: 'till after the downfall of Jerusalem, a period of over 40 years, 626–586 B.C.'
  - where: 'setting'
    claim: 'Jer. 39–44 are the prophet’s history and other events after the fall of the city'
    key: bd-jeremiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng'
    quote: 'Jer. 39–44, the prophet’s history and other events after the fall of the city.'
  - where: 'setting'
    claim: 'Jeremiah prophesied until after the downfall of Jerusalem, 626–586 B.C.'
    key: bd-jeremiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng'
    quote: 'prophesied from the 13th year of Josiah till after the downfall of Jerusalem, a period of over 40 years, 626–586 B.C.'
  - where: 'setting'
    claim: 'Church chapter heading'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/39?lang=eng'
    quote: 'Jerusalem is taken, and the people are taken captive—Jeremiah and Ebed-melech, the Ethiopian, are preserved.'
  - where: 'setting'
    claim: 'Zedekiah was placed on the throne by Babylon, was no wiser than Jehoiakim and Jehoiachin, and rebelled; Babylon came again'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'Zedekiah was no wiser than his brother, Jehoiakim, and his nephew, Jehoiachin. He too began to look for ways to break the Babylonian yoke.'
  - where: 'setting'
    claim: 'Jeremiah had told the city to surrender and was seen as a traitor; chapter 39 details the fall and Zedekiah’s end'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'Chapter 39 of Jeremiah details the fall of Jerusalem and the tragic end of Zedekiah and his family.'
  - where: 'setting'
    claim: 'Zedekiah was placed on the throne when Jehoiachin was deposed'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'he was deposed and his uncle, Zedekiah, was placed on the throne.'
  - where: 'setting'
    claim: 'Jeremiah’s counsel to surrender was unwelcome and he was viewed as a traitor'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'Jeremiah’s counsel to surrender was not welcome. He was viewed as a traitor and a subversive.'
  - where: 'note 39:1 “A siege of eighteen months”'
    claim: 'The famine was severe in the city when the walls were breached, on the ninth day of the fourth month'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/25?lang=eng'
    quote: 'on the ninth day of the fourth month the famine prevailed in the city, and there was no bread for the people of the land.'
  - where: 'note 39:1 “A siege of eighteen months”'
    claim: 'Jer. 52 gives the same famine on the ninth day of the fourth month'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/52?lang=eng'
    quote: 'in the fourth month, in the ninth day of the month, the famine was sore in the city, so that there was no bread for the people of the land.'
  - where: 'note 39:3 “Why the generals sat in the gate”'
    claim: 'A city gate was the place for public business'
    key: bd-gate
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/gate?lang=eng'
    quote: 'The gate of a city was often a place for public business'
  - where: 'note 39:3 “Why the generals sat in the gate”'
    claim: 'The generals took their position at the middle gate after penetrating the city through the breaches'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/39.htm'
    quote: 'After the besiegers had penetrated into the city through the breaches made in the wall, the princes, i.e., the chief generals, took up their position at'
  - where: 'note 39:3 “Why the generals sat in the gate”'
    claim: 'The king himself sat in the gate of Benjamin to hear Ebed-melech (the king’s own custom of sitting in a gate)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/38?lang=eng'
    quote: 'the king then sitting in the gate of Benjamin;'
  - where: 'note 39:3 “Names and titles of the Babylonian officers”'
    claim: 'Nergal-sharezer held the office of Rab-mag (chief of the magi), accompanied Nebuchadnezzar, and is probably the later king Neriglissar'
    key: bd-nergal-sharezer
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/nergal-sharezer?lang=eng'
    quote: 'holding the office of Rab-mag (chief of the magi) (Jer. 39:3, 13). He is probably to be identified with the man of the same name who afterwards became king of Babylonia and is known in classical literature as Neriglissar.'
  - where: 'note 39:3 “Names and titles of the Babylonian officers”'
    claim: 'A chamberlain is a private and confidential servant of an eastern king; the name is also translated eunuch'
    key: bd-chamberlain
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/chamberlain?lang=eng'
    quote: 'A private and confidential servant of an eastern king (2 Kgs. 23:11; Acts 12:20). The name is also translated “eunuch.”'
  - where: 'note 39:3 “Names and titles of the Babylonian officers”'
    claim: 'One reading: four names, with Sarsechim as chief chamberlain and the second Nergal-sharezer as chief magician'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/39.htm'
    quote: 'Nergal-sharezer, Samgar-nebo, Sarsechim, chief chamberlain, Nergal-sharezer, chief magician, and all the rest of the princes of the king of Babylon.'
  - where: 'note 39:4 “He fled instead of going out”'
    claim: 'Jeremiah told Zedekiah that if he went out to the Babylonian princes his soul would live and the city would not be burned'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/38?lang=eng'
    quote: 'If thou wilt assuredly go forth unto the king of Babylon’s princes, then thy soul shall live, and this city shall not be burned with fire; and thou shalt live, and thine house:'
  - where: 'note 39:4 “He fled instead of going out”'
    claim: 'Zedekiah said he feared the Jews who had fallen to the Chaldeans'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/38?lang=eng'
    quote: 'I am afraid of the Jews that are fallen to the Chaldeans, lest they deliver me into their hand, and they mock me.'
  - where: 'note 39:4 “He fled instead of going out”'
    claim: 'Jeremiah answered that Zedekiah would not be delivered to them if he obeyed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/38?lang=eng'
    quote: 'They shall not deliver thee. Obey, I beseech thee, the voice of the Lord, which I speak unto thee: so it shall be well unto thee, and thy soul shall live.'
  - where: 'note 39:4 “He fled instead of going out”'
    claim: 'Zedekiah’s character was weak and vacillating'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'The weak, vacillating character of King Zedekiah manifested itself.'
  - where: 'note 39:4 “He fled instead of going out”'
    claim: '2 Kings reports the same flight by night by the gate between two walls by the king’s garden'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/25?lang=eng'
    quote: 'all the men of war fled by night by the way of the gate between two walls, which is by the king’s garden'
  - where: 'note 39:7 “Seeing the king of Babylon, never seeing Babylon”'
    claim: 'Jeremiah told Zedekiah (32:4) that his eyes would behold the eyes of the king of Babylon and speak with him mouth to mouth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/32?lang=eng'
    quote: 'and shall speak with him mouth to mouth, and his eyes shall behold his eyes;'
  - where: 'note 39:7 “Seeing the king of Babylon, never seeing Babylon”'
    claim: 'Ezekiel said the prince would be brought to Babylon yet not see it, though he would die there'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/12?lang=eng'
    quote: 'and I will bring him to Babylon to the land of the Chaldeans; yet shall he not see it, though he shall die there.'
  - where: 'note 39:7 “Seeing the king of Babylon, never seeing Babylon”'
    claim: 'Jeremiah 52 says Zedekiah was kept in prison till the day of his death'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/52?lang=eng'
    quote: 'Then he put out the eyes of Zedekiah; and the king of Babylon bound him in chains, and carried him to Babylon, and put him in prison till the day of his death.'
  - where: 'note 39:7 “Seeing the king of Babylon, never seeing Babylon”'
    claim: 'Jeremiah told Zedekiah in the earlier warning that he would be taken to Babylon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/34?lang=eng'
    quote: 'And thou shalt not escape out of his hand, but shalt surely be taken, and delivered into his hand; and thine eyes shall behold the eyes of the king of Babylon'
  - where: 'note 39:6 “Zedekiah’s sons, and Mulek”'
    claim: 'Helaman’s son Nephi says the sons of Zedekiah were slain except Mulek, whose seed is with the Nephites'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/hel/8?lang=eng'
    quote: 'Will ye say that the sons of Zedekiah were not slain, all except it were Mulek? Yea, and do ye not behold that the seed of Zedekiah are with us'
  - where: 'note 39:6 “Zedekiah’s sons, and Mulek”'
    claim: 'Mulek is the son of Zedekiah; the Bible says all were slain, the Book of Mormon clarifies Mulek survived'
    key: gs-mulek
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/mulek?lang=eng'
    quote: 'The Bible records that all the sons of Zedekiah were slain (2 Kgs. 25:7), but the Book of Mormon clarifies that Mulek survived (Hel. 8:21).'
  - where: 'note 39:6 “Zedekiah’s sons, and Mulek”'
    claim: 'The Book of Mormon adds that Mulek came to the Western Hemisphere'
    key: bd-zedekiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zedekiah?lang=eng'
    quote: 'a notable contribution being the information that not all of the sons of Zedekiah were slain (as implied in Jer. 52:10), for one son, Mulek, came to the Western Hemisphere (Hel. 8:21).'
  - where: 'note 39:6 “Zedekiah’s sons, and Mulek”'
    claim: 'Mosiah found that the people of Zarahemla came out from Jerusalem when Zedekiah was carried away captive and were brought across the waters by the Lord'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/omni/1?lang=eng'
    quote: 'Mosiah discovered that the people of Zarahemla came out from Jerusalem at the time that Zedekiah, king of Judah, was carried away captive into Babylon.'
  - where: 'note 39:6 “Zedekiah’s sons, and Mulek”'
    claim: 'The land north was called Mulek after the son of Zedekiah; the Lord brought Mulek there'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/hel/6?lang=eng'
    quote: 'the land north was called Mulek, which was after the son of Zedekiah; for the Lord did bring Mulek into the land north'
  - where: 'note 39:6 “Zedekiah’s sons, and Mulek”'
    claim: 'The Book of Mormon gives no account of the journey; Mulek did not travel alone; likely not in Jerusalem when it was destroyed (a KnoWhy’s own reading)'
    key: sc-knowhy-753
    url: 'https://scripturecentral.org/knowhy/how-did-mulek-get-to-the-new-world'
    quote: 'the Book of Mormon gives no direct account of how Mulek and those with him got to the New World'
  - where: 'note 39:6 “Zedekiah’s sons, and Mulek”'
    claim: 'It is likely Mulek was not in Jerusalem at its destruction'
    key: sc-knowhy-753
    url: 'https://scripturecentral.org/knowhy/how-did-mulek-get-to-the-new-world'
    quote: 'It is likely that Mulek was not in Jerusalem at the time it was destroyed, either acting as an envoy for his father or having previously been led out of the city in hopes of preserving an heir to the throne.'
  - where: 'note 39:8 “A month after the breach”'
    claim: 'Nebuzar-adan came in the fifth month, after the breach in the fourth month, and burned the temple, the king’s house, and the houses'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/25?lang=eng'
    quote: 'And he burnt the house of the Lord, and the king’s house, and all the houses of Jerusalem, and every great man’s house burnt he with fire.'
  - where: 'note 39:8 “A month after the breach”'
    claim: 'The destruction and deportation came one month after the fall; Jeremiah 39 omits the sending of Nebuzaradan from Riblah and the date'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/39.htm'
    quote: 'the destruction of the city and the carrying away of the people took place one month after their fall'
  - where: 'note 39:8 “A month after the breach”'
    claim: 'The temple is not mentioned in Jer. 39 (one reading: not needed for its immediate purpose)'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/39.htm'
    quote: 'the temple is not mentioned, as being of no consequence for the immediate purpose of this short notice.'
  - where: 'note 39:8 “A month after the breach”'
    claim: 'Jer. 52 names the house of the Lord among what was burned in the fifth month'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/52?lang=eng'
    quote: 'And burned the house of the Lord, and the king’s house; and all the houses of Jerusalem, and all the houses of the great men, burned he with fire:'
  - where: 'note 39:8 “What Lehi saw”'
    claim: 'Lehi read and saw that Jerusalem would be destroyed and many carried away captive into Babylon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/1?lang=eng'
    quote: 'many things did my father read concerning Jerusalem—that it should be destroyed, and the inhabitants thereof; many should perish by the sword, and many should be carried away captive into Babylon.'
  - where: 'note 39:8 “What Lehi saw”'
    claim: 'Lehi says he has seen a vision in which he knows Jerusalem is destroyed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/1?lang=eng'
    quote: 'I have seen a vision, in which I know that Jerusalem is destroyed; and had we remained in Jerusalem we should also have perished.'
  - where: 'note 39:8 “What Lehi saw”'
    claim: 'Nephi says Jeremiah was cast into prison and Lehi driven out'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/7?lang=eng'
    quote: 'they have rejected the prophets, and Jeremiah have they cast into prison. And they have sought to take away the life of my father, insomuch that they have driven him out of the land.'
  - where: 'note 39:8 “What Lehi saw”'
    claim: 'Nephi the son of Helaman: Jerusalem was destroyed according to the words of Jeremiah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/hel/8?lang=eng'
    quote: 'now we know that Jerusalem was destroyed according to the words of Jeremiah.'
  - where: 'note 39:10 “The poor who had nothing”'
    claim: 'The captain of the guard left the poor of the land as vinedressers and husbandmen'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/25?lang=eng'
    quote: 'But the captain of the guard left of the poor of the land to be vinedressers and husbandmen.'
  - where: 'note 39:10 “The poor who had nothing”'
    claim: 'Jer. 52 says the same'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/52?lang=eng'
    quote: 'But Nebuzar-adan the captain of the guard left certain of the poor of the land for vinedressers and for husbandmen.'
  - where: 'note 39:10 “The poor who had nothing”'
    claim: 'Gedaliah was set over the poor and the people not carried away (Jer. 40)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/40?lang=eng'
    quote: 'had committed unto him men, and women, and children, and of the poor of the land, of them that were not carried away captive to Babylon;'
  - where: 'note 39:12 “Why Babylon spared Jeremiah”'
    claim: 'Because Jeremiah had foretold Babylon’s success, he was released and allowed to remain as a free person'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'Because Jeremiah had foretold Babylon’s eventual success, he was released by the Chaldeans and allowed to remain in Jerusalem as a free person (see vv. 11–14).'
  - where: 'note 39:12 “Why Babylon spared Jeremiah”'
    claim: 'Jeremiah 40 tells that he was first bound in chains at Ramah among the captives, then loosed and given the choice to go to Babylon or stay'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/40?lang=eng'
    quote: 'when he had taken him being bound in chains among all that were carried away captive of Jerusalem and Judah'
  - where: 'note 39:12 “Why Babylon spared Jeremiah”'
    claim: 'Nebuzar-adan offers Jeremiah the choice to go to Babylon or stay'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/40?lang=eng'
    quote: 'I loose thee this day from the chains which were upon thine hand. If it seem good unto thee to come with me into Babylon, come; and I will look well unto thee'
  - where: 'note 39:12 “Why Babylon spared Jeremiah”'
    claim: 'Jeremiah was viewed as a traitor for urging surrender; the manual’s 40:1–6 summary of the Ramah release'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'he was first taken in chains with all the other captured Jews as far as Ramah, a town about five miles north of Jerusalem.'
  - where: 'note 39:14 “Gedaliah, from a family that had protected Jeremiah”'
    claim: 'Ahikam son of Shaphan protected Jeremiah from being given to the people to be put to death'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/26?lang=eng'
    quote: 'the hand of Ahikam the son of Shaphan was with Jeremiah, that they should not give him into the hand of the people to put him to death.'
  - where: 'note 39:14 “Gedaliah, from a family that had protected Jeremiah”'
    claim: 'Shaphan was Josiah’s scribe'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/22?lang=eng'
    quote: 'the king sent Shaphan the son of Azaliah, the son of Meshullam, the scribe, to the house of the Lord'
  - where: 'note 39:14 “Gedaliah, from a family that had protected Jeremiah”'
    claim: 'Babylon made Gedaliah ruler over the people left in Judah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/25?lang=eng'
    quote: 'even over them he made Gedaliah the son of Ahikam, the son of Shaphan, ruler.'
  - where: 'note 39:14 “Gedaliah, from a family that had protected Jeremiah”'
    claim: 'Ishmael son of Nethaniah killed Gedaliah at Mizpah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/41?lang=eng'
    quote: 'smote Gedaliah the son of Ahikam the son of Shaphan with the sword, and slew him, whom the king of Babylon had made governor over the land.'
  - where: 'note 39:16 “Ebed-melech the Ethiopian”'
    claim: 'Ebed-melech was an Ethiopian, one of the eunuchs in the king’s house, who told the king that Jeremiah would die of hunger in the dungeon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/38?lang=eng'
    quote: 'Now when Ebed-melech the Ethiopian, one of the eunuchs which was in the king’s house, heard that they had put Jeremiah in the dungeon'
  - where: 'note 39:16 “Ebed-melech the Ethiopian”'
    claim: 'The king ordered thirty men and Ebed-melech used old rags and cords to lift Jeremiah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/38?lang=eng'
    quote: 'Take from hence thirty men with thee, and take up Jeremiah the prophet out of the dungeon, before he die.'
  - where: 'note 39:16 “Ebed-melech the Ethiopian”'
    claim: 'Ethiopia (Cush) extended south of Egypt from Syene toward Khartoum'
    key: bd-ethiopia
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ethiopia?lang=eng'
    quote: 'Extended from Syene on the frontier of Egypt southward to the neighborhood of Khartoum, at the junction of the Blue and White Nile.'
  - where: 'note 39:16 “Ebed-melech the Ethiopian”'
    claim: 'Without Ebed-melech’s courage and Christlike service Jeremiah would have died in the cistern-dungeon'
    key: tefan-potters-clay
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/10/jeremiah-as-potters-clay?lang=eng'
    quote: 'If not for the courage and Christlike service of Ebed-melech, an Ethiopian servant to the king, Jeremiah would have surely died (see Jer. 38:7–13; see also 1 Ne. 7:14).'
  - where: 'note 39:15 “Why the word to Ebed-melech comes last”'
    claim: 'The word for Ebed-melech came soon after the rescue but is given here as a supplement so as not to break the chain of events; “was” in verse 15 is a pluperfect'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/39.htm'
    quote: 'This word of God for Ebedmelech came to the prophet, no doubt, very soon after his deliverance from the miry pit by this pious Ethiopian; but it is not given till now, and this by way of supplement'
  - where: 'note 39:15 “Why the word to Ebed-melech comes last”'
    claim: 'Jeremiah remained in the court of the prison after Ebed-melech drew him up'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/38?lang=eng'
    quote: 'So they drew up Jeremiah with cords, and took him up out of the dungeon: and Jeremiah remained in the court of the prison.'
  - where: 'note 39:18 “A life for a prey”'
    claim: 'The same promise is made to those who go out to the Chaldeans (21:9), in 38:2, and to Baruch (45:5)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/21?lang=eng'
    quote: 'but he that goeth out, and falleth to the Chaldeans that besiege you, he shall live, and his life shall be unto him for a prey.'
  - where: 'note 39:18 “A life for a prey”'
    claim: 'The same promise to those who go forth to the Chaldeans in 38:2'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/38?lang=eng'
    quote: 'he that goeth forth to the Chaldeans shall live; for he shall have his life for a prey, and shall live.'
  - where: 'note 39:18 “A life for a prey”'
    claim: 'The same promise to Baruch (45:5)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/45?lang=eng'
    quote: 'but thy life will I give unto thee for a prey in all places whither thou goest.'
  - where: 'note 39:18 “A life for a prey”'
    claim: 'Hebrew shalal means prey, spoil, plunder, booty; booty of war'
    key: bdb
    url: 'https://biblehub.com/hebrew/7998.htm'
    quote: 'prey, spoil, plunder, booty; — absolute ׳שׁ Genesis 49:27 +; construct שְׁלַל Judges 5:30 +'
  - where: 'note 39:18 “Because thou hast put thy trust in me”'
    claim: 'Hebrew batach, trust; Jer. 39:18 is listed under trust in God, alongside Jer. 17:7; trust in persons listed separately including Jer. 17:5'
