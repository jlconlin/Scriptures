chapter: 42
claims:
  - where: setting
    claim: 'Chapter heading summary: Jeremiah promises Johanan and the remnant peace if they stay, sword, famine, pestilence if they go to Egypt'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/42?lang=eng'
    quote: 'Jeremiah promises Johanan and the remnant of Judah peace and safety if they remain in Judah, but the sword, famine, and pestilence if they go to Egypt.'
  - where: setting
    claim: 'Gedaliah made governor over the remnant; Jeremiah freed and dwells among them (ch. 40 heading)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/40?lang=eng'
    quote: 'The king of Babylon makes Gedaliah governor over the remnant left in Judah—Jeremiah is freed and dwells among them.'
  - where: setting
    claim: 'Ishmael kills Gedaliah; Johanan rescues the captives (ch. 41 heading)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/41?lang=eng'
    quote: 'Ishmael kills Gedaliah and carries the people of Mizpah captive—They are rescued by Johanan.'
  - where: setting
    claim: 'Chapter 43 heading: Johanan carries Jeremiah and the remnant into Egypt'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/43?lang=eng'
    quote: 'Johanan carries Jeremiah and the remnant of Judah into Egypt—Jeremiah prophesies that Babylon will conquer Egypt.'
  - where: when
    claim: 'The Bible Dictionary dates the fall of Jerusalem to 586 B.C.'
    key: bd-jeremiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng'
    quote: 'Prophecies under Zedekiah (597–586), Jer. 21–38'
  - where: 'note 42:1 “Johanan and the captains”'
    claim: 'Johanan came to Gedaliah at Mizpah after the governor was appointed (2 Kgs 25:23)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/25?lang=eng'
    quote: 'there came to Gedaliah to Mizpah, even Ishmael the son of Nethaniah, and Johanan the son of Careah'
  - where: 'note 42:1 “Johanan and the captains”'
    claim: 'Johanan and the captains went to fight Ishmael and recovered the captives'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/41?lang=eng'
    quote: 'Then they took all the men, and went to fight with Ishmael the son of Nethaniah, and found him by the great waters that are in Gibeon.'
  - where: 'note 42:1 “Johanan and the captains”'
    claim: 'The company halted at the habitation of Chimham by Bethlehem intending Egypt, afraid of the Chaldeans'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/41?lang=eng'
    quote: 'And they departed, and dwelt in the habitation of Chimham, which is by Beth-lehem, to go to enter into Egypt, Because of the Chaldeans: for they were afraid of them'
  - where: 'note 42:2 “Asking a prophet to pray”'
    claim: 'Israel asks a prophet to pray for them: Numbers 21:7'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/21?lang=eng'
    quote: 'pray unto the Lord, that he take away the serpents from us. And Moses prayed for the people.'
  - where: 'note 42:2 “Asking a prophet to pray”'
    claim: 'Samuel: 1 Sam 7:5'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/7?lang=eng'
    quote: 'Gather all Israel to Mizpeh, and I will pray for you unto the Lord.'
  - where: 'note 42:4 “A prophet declares what he is given”'
    claim: 'Prophets have no choice but to proclaim what God has given them, knowing the price'
    key: hales-keep-commandments
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1996/04/if-thou-wilt-enter-into-life-keep-the-commandments?lang=eng'
    quote: 'Upon receiving revelation, prophets have no choice but to proclaim and reaffirm that which God has given them to tell the world. Prophets do this knowing full well the price they may have to pay.'
  - where: 'note 42:4 “A prophet declares what he is given”'
    claim: 'Hales applied the principle to unpopular commandments'
    key: hales-keep-commandments
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1996/04/if-thou-wilt-enter-into-life-keep-the-commandments?lang=eng'
    quote: 'Why do prophets proclaim unpopular commandments and call society to repentance for rejecting, modifying, and even ignoring the commandments?'
  - where: 'note 42:5 “The faithful witness”'
    claim: 'Church edition footnote on faithful witness points to Rev. 1:5; 3:14'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/42?lang=eng'
    quote: 'Rev. 1:5; 3:14.'
  - where: 'note 42:5 “The faithful witness”'
    claim: 'Rev. 1:5 calls Jesus Christ the faithful witness'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/1?lang=eng'
    quote: 'And from Jesus Christ, who is the faithful witness, and the first begotten of the dead'
  - where: 'note 42:5 “The faithful witness”'
    claim: 'The witness is called on to see that they fulfil their promise, not to confirm their statement'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/42.htm'
    quote: 'God is to be a faithful witness, not in regard to the truth of what they say, but as regards the fulfilment of their promise, so that, if they would not obey His word, He might come forward to punish them.'
  - where: 'note 42:6 “Whether we like it or not”'
    claim: '“Evil” in verse 6 means something the people did not want to do'
    key: ot-seminary-teacher-137
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-jeremiah/lesson-137-jeremiah-42-52?lang=eng'
    quote: 'Point out the phrase “whether it be evil” in verse 6, and explain that in this case, “evil” refers to something the people didn’t want to do, rather than something bad.'
  - where: 'note 42:6 “Whether we like it or not”'
    claim: 'How we respond to a living prophet when he says what we would rather not hear is a test of faithfulness'
    key: benson-fourteen
    url: 'https://speeches.byu.edu/talks/ezra-taft-benson/fourteen-fundamentals-following-prophet/'
    quote: 'How we respond to the words of a living prophet when he tells us what we need to know, but would rather not hear, is a test of our faithfulness'
  - where: 'note 42:7 “Ten days of waiting”'
    claim: 'The delay was disciplinary: time to consider so they could receive and obey the answer'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/42.htm'
    quote: 'The reason why the Lord did not make known His will to the prophet for ten days was a disciplinary one. By waiting, those who asked would get time for bethinking themselves, and for quietly considering the situation of affairs'
  - where: 'note 42:7 “Ten days of waiting”'
    claim: 'Jeremiah announced the answer to the captains and people (v. 8) and the people had to be gathered'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/42?lang=eng'
    quote: 'Then called he Johanan the son of Kareah, and all the captains of the forces which were with him, and all the people from the least even to the greatest'
  - where: 'note 42:10 “The Lord relents”'
    claim: 'Footnote: IE I feel compassion regarding the punishment I bring upon you; JST reading'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/42?lang=eng'
    quote: 'IE I feel compassion regarding the punishment I bring upon you. JST Jer. 42:10 … and I will turn away the evil that I have done unto you.'
  - where: 'note 42:10 “The Lord relents”'
    claim: 'Jer. 18:7–10 sets the principle that a nation that turns from evil: the Lord will repent'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/18?lang=eng'
    quote: 'If that nation, against whom I have pronounced, turn from their evil, I will repent of the evil that I thought to do unto them.'
  - where: 'note 42:11 “Why they feared Babylon, and the same counsel”'
    claim: 'Gedaliah told them the same: fear not to serve the Chaldeans, dwell in the land'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/40?lang=eng'
    quote: 'Fear not to serve the Chaldeans: dwell in the land, and serve the king of Babylon, and it shall be well with you.'
  - where: 'note 42:11 “Why they feared Babylon, and the same counsel”'
    claim: 'Gedaliah was killed at Mizpah, the king of Babylon''s governor'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/41?lang=eng'
    quote: 'smote Gedaliah the son of Ahikam the son of Shaphan with the sword, and slew him, whom the king of Babylon had made governor over the land.'
  - where: 'note 42:14 “Egypt as a refuge”'
    claim: 'Footnote on shofar'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/42?lang=eng'
    quote: 'HEB shofar or alarm.'
  - where: 'note 42:14 “Egypt as a refuge”'
    claim: 'Footnote 19a on Egypt cites Deut. 17:16'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/42?lang=eng'
    quote: 'Deut. 17:16.'
  - where: 'note 42:14 “Egypt as a refuge”'
    claim: 'Deut. 17:16 text: Ye shall henceforth return no more that way'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/17?lang=eng'
    quote: 'Ye shall henceforth return no more that way.'
  - where: 'note 42:14 “Egypt as a refuge”'
    claim: 'Isaiah 31:1 woe on those who go down to Egypt for help'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/31?lang=eng'
    quote: 'Woe to them that go down to Egypt for help; and stay on horses, and trust in chariots, because they are many'
  - where: 'note 42:14 “Egypt as a refuge”'
    claim: 'Isaiah 30:2: have not asked at my mouth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/30?lang=eng'
    quote: 'That walk to go down into Egypt, and have not asked at my mouth'
  - where: 'note 42:16 “What they fled finds them”'
    claim: 'Footnotes to vv. 15 and 18 cite Jer. 44:12'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/42?lang=eng'
    quote: 'Jer. 44:12.'
  - where: 'note 42:16 “What they fled finds them”'
    claim: 'Jer. 44:12 repeats the four words and the sword and famine in Egypt'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/44?lang=eng'
    quote: 'they shall be an execration, and an astonishment, and a curse, and a reproach.'
  - where: 'note 42:16 “What they fled finds them”'
    claim: 'Jer. 43:10–12: Nebuchadrezzar will set his throne in Egypt'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/43?lang=eng'
    quote: 'Behold, I will send and take Nebuchadrezzar the king of Babylon, my servant, and will set his throne upon these stones that I have hid'
  - where: 'note 42:20 “What “dissembled” means”'
    claim: 'Footnote: HEB have deceived your souls'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/42?lang=eng'
    quote: 'HEB have deceived your souls.'
  - where: 'note 42:20 “What “dissembled” means”'
    claim: 'Seminary manual: dissembled means they lied when they said they would obey'
    key: ot-seminary-teacher-137
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-jeremiah/lesson-137-jeremiah-42-52?lang=eng'
    quote: 'the phrase “ye dissembled in your hearts” in verse 20 means the people lied when they told Jeremiah they would obey the Lord’s words.'
  - where: 'note 42:21 “Pride and the answer you wanted”'
    claim: 'The same leaders in 43:2 are “proud men” who say Jeremiah speaks falsely'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/43?lang=eng'
    quote: 'Then spake Azariah the son of Hoshaiah, and Johanan the son of Kareah, and all the proud men, saying unto Jeremiah, Thou speakest falsely'
  - where: 'note 42:21 “Pride and the answer you wanted”'
    claim: 'The proud cannot accept God''s direction and wish God would agree with them'
    key: benson-pride
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1989/04/beware-of-pride?lang=eng'
    quote: 'The proud cannot accept the authority of God giving direction to their lives. … The proud wish God would agree with them. They aren’t interested in changing their opinions to agree with God’s.'
  - where: 'note 42:21 “Pride and the answer you wanted”'
    claim: 'Chapter 43:4 and 7: they obeyed not the voice of the Lord and came to Tahpanhes'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/43?lang=eng'
    quote: 'So they came into the land of Egypt: for they obeyed not the voice of the Lord: thus came they even to Tahpanhes.'
  - where: christ
    claim: 'The Lord’s offer: “I am with you to save you, and to deliver you”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/42?lang=eng'
    quote: 'for I am with you to save you, and to deliver you from his hand.'
  - where: setting
    claim: 'The leaders carry Jeremiah and Baruch to Egypt (Jer. 43:6)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/43?lang=eng'
    quote: 'Jeremiah the prophet, and Baruch the son of Neriah.'
