    url: https://www.churchofjesuschrist.org/study/scriptures/ot/lev/19?lang=eng
    quote: 'Ye shall not round the corners of your heads, neither shalt thou mar the corners of thy beard.'
  - where: 'note 9:26 “Not far-off corners but clipped temples”'
    claim: 'Footnote at Jer. 9:26 points to Jer. 25:23'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/9?lang=eng
    quote: 'Jer. 25:23'
  - where: 'note 9:26 “Not far-off corners but clipped temples”'
    claim: 'Hebrew text of the verse'
