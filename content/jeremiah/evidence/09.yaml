    claim: 'BDB: qetsutsey pe''ah, those clipped on the temples, Jer. 9:25; 25:23; 49:32, Arabian tribes'
    key: bdb
    url: https://biblehub.com/hebrew/6285.htm
    quote: 'פֵאָה קְצוּצֵי those clipped on the temples Jeremiah 9:25 ; Jeremiah 25:23 ; Jeremiah 49:32 (epithet of Arabian tribes'
  - where: 'note 9:26 “Not far-off corners but clipped temples”'
    claim: 'BDB: pe''ah glossed corner, side; Lev. 19:27 your temples'
    key: bdb
    url: https://biblehub.com/hebrew/6285.htm
    quote: 'ראֹשְׁכֶם ׳ פ Leviticus 19:27 (i.e. your temples )'
