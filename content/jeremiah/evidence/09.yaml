chapter: 9
claims:
  - where: 'when'
    claim: 'Chapters 7–20 are the prophecies under Jehoiakim, 608–597'
    key: bd-jeremiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng
    quote: 'Prophecies under Jehoiakim (608–597), Jer. 7–20'
  - where: 'setting'
    claim: 'Church chapter heading for Jeremiah 9'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/9?lang=eng
    quote: 'Jeremiah sorrows greatly because of the sins of the people—They will be scattered among the nations and punished.'
  - where: 'setting'
    claim: 'Few laments over sin as moving; beside David, Jesus and Mormon'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'few passages lamenting the results of sin in the scriptures are as moving as'
  - where: 'setting'
    claim: 'Footnotes at Jer. 9:24 lead to 1 Cor. 1:31, 2 Cor. 10:17 and Alma 26:36'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/9?lang=eng
    quote: '1 Cor. 1:31; 2 Cor. 10:17 (15–18); Alma 26:36 (36–37)'
  - where: 'note 9:1 “The weeping prophet”'
    claim: 'The chapter compares with David, Jesus, and Mormon laments'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'David’s cry over his son Absalom (see 2 Samuel 18:33), or Jesus’ prophetic lament over Jerusalem (see Matthew 23:37), or the lament of Mormon over the destroyed Nephite nation (see Mormon 6:16–22)'
  - where: 'note 9:1 “The weeping prophet”'
    claim: 'The chapter heading says Jeremiah sorrows'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/9?lang=eng
    quote: 'Jeremiah sorrows greatly because of the sins of the people'
  - where: 'note 9:1 “The weeping prophet”'
    claim: 'Matt. 23:37 text'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/nt/matt/23?lang=eng
    quote: 'O Jerusalem, Jerusalem, thou that killest the prophets, and stonest them which are sent unto thee'
  - where: 'note 9:2 “A caravan inn in the wilderness”'
    claim: 'The lodging place is a khan on caravan routes'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/9.htm
    quote: 'The "lodging-place" is not a resting-place under the open sky, but a harbour for travellers - a building (khan) erected on the route of the caravans, as a shelter for travellers.'
  - where: 'note 9:3 “The tongue as a bow and an arrow”'
    claim: 'Ps. 64:3 uses the bow-and-arrow picture of the tongue'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/ps/64?lang=eng
    quote: 'Who whet their tongue like a sword, and bend their bows to shoot their arrows, even bitter words:'
  - where: 'note 9:3 “The tongue as a bow and an arrow”'
    claim: 'Footnote list for Jer. 9 includes Ps. 64:3 after the Mourning/Despair/Suffering entries (verse 3)'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/9?lang=eng
    quote: 'Ps. 64:3'
  - where: 'note 9:4 “Every brother a Jacob”'
    claim: 'Hebrew has the doubled verb ʿaqov yaʿqov (Hebrew numbering 9:3)'
    key: oshb-wlc
    url: https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml
    quote: 'כִּ֤י כָל־אָח֙ עָק֣וֹב יַעְקֹ֔ב'
  - where: 'note 9:4 “Every brother a Jacob”'
    claim: 'BDB defines the verb and lists Gen. 27:36, Hos. 12:4 and this verse'
    key: bdb
    url: https://biblehub.com/hebrew/6117.htm
    quote: 'follow at the heel , figurative assail insidiously, circumvent, overreach'
  - where: 'note 9:4 “Every brother a Jacob”'
    claim: 'BDB lists Gen. 27:36 (renders it overreached me now twice) and Hos. 12:4'
    key: bdb
    url: https://biblehub.com/hebrew/6117.htm
    quote: 'and he hath overreached me now twice'
  - where: 'note 9:4 “Every brother a Jacob”'
    claim: 'BDB lists this verse (Hebrew 9:3) as infinitive absolute with the verb, surely overreacheth'
    key: bdb
    url: https://biblehub.com/hebrew/6117.htm
    quote: 'Infinitive abs Jeremiah 9:3 בָּלאָֿח עָקוֺב יַעֲקֹב surely overreacheth'
  - where: 'note 9:4 “Every brother a Jacob”'
    claim: 'BDB lists Hos. 12:4 (Hebrew numbering; KJV Hos. 12:3), Jacob taking his brother by the heel'
    key: bdb
    url: https://biblehub.com/hebrew/6117.htm
    quote: 'he attacked his brother at the heel'
  - where: 'note 9:4 “Every brother a Jacob”'
    claim: 'Gen. 27:36 text'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/gen/27?lang=eng
    quote: 'Is not he rightly named Jacob? for he hath supplanted me these two times'
  - where: 'note 9:4 “Every brother a Jacob”'
    claim: 'One reading sees an allusion to Jacob and Esau'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/9.htm
    quote: 'there seems to be an allusion to Jacob''s underhand dealing with his brother Esau'
  - where: 'note 9:7 “The Lord’s own grief”'
    claim: 'The verse text uses daughter of my people in verses 1 and 7 and the question in verse 9'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/9?lang=eng
    quote: 'shall not my soul be avenged on such a nation as this?'
  - where: 'note 9:11 “Dragons that are jackals”'
    claim: 'Church edition footnote gives Hebrew as jackals'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/9?lang=eng
    quote: 'jackals'
  - where: 'note 9:14 “What the fathers taught”'
    claim: 'Manasseh reared up altars for Baalim'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/33?lang=eng
    quote: 'he reared up altars for Baalim, and made groves, and worshipped all the host of heaven, and served them.'
  - where: 'note 9:14 “What the fathers taught”'
    claim: 'Footnote at Jer. 9:14 area lists 2 Chr. 33:3'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/9?lang=eng
    quote: '2 Chr. 33:3'
  - where: 'note 9:16 “Scattered but not extinct”'
    claim: 'To be consumed does not mean extinct; Deut. 4:26'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'To be consumed does not mean to become extinct.'
  - where: 'note 9:16 “Scattered but not extinct”'
    claim: 'Moses said Israel would be destroyed, yet the following verses show Israel existing as homeless individuals'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'told all Israel that they would “utterly be destroyed.” Yet the verses following show that Israel still existed as homeless individuals.'
  - where: 'note 9:16 “Scattered but not extinct”'
    claim: 'Meaning of consumed in scattering prophecies'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'meant to be utterly disorganized and disbanded so that Israel’s power, influence, and cohesiveness as a nation was gone.'
  - where: 'note 9:16 “Scattered but not extinct”'
    claim: 'Deut. 28:64 wording parallels Jer. 9:16'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/deut/28?lang=eng
    quote: 'And the Lord shall scatter thee among all people, from the one end of the earth even unto the other; and there thou shalt serve other gods, which neither thou nor thy fathers have known'
  - where: 'note 9:17 “Hired mourners”'
    claim: 'Professional mourners; Jeremiah told to hire them'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'the Lord referred to the custom in ancient Israel of hiring professional mourners, women who were paid to wail and lament for long periods of time at someone’s death. Jeremiah was told to hire professional mourners to lament over Judah.'
  - where: 'note 9:24 “The only thing worth boasting in”'
    claim: 'Paul quotes the line and names the wise and mighty'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/nt/1-cor/1?lang=eng
    quote: 'not many wise men after the flesh, not many mighty, not many noble, are called'
  - where: 'note 9:24 “The only thing worth boasting in”'
    claim: 'Ammon answers Aaron'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/26?lang=eng
    quote: 'I do not boast in my own strength, nor in my own wisdom'
  - where: 'note 9:24 “The only thing worth boasting in”'
    claim: 'Ammon concludes if this is boasting'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/26?lang=eng
    quote: 'Now if this is boasting, even so will I boast; for this is my life and my light, my joy and my salvation'
  - where: 'note 9:24 “The only thing worth boasting in”'
    claim: 'Kindness (chesed) is the foundation of right and justice'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/9.htm
    quote: 'חסד, grace, favour, is the foundation on which right and justice are based'
  - where: 'note 9:25 “Circumcised in body, uncircumcised in heart”'
    claim: 'Circumcision as a token; true circumcision of the heart; cross-references'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'Circumcision was a token given to Abraham as a sign that a child was born into the covenant'
  - where: 'note 9:25 “Circumcised in body, uncircumcised in heart”'
    claim: 'True circumcision is of the heart; passages listed'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'the true circumcision after a person is accountable is that of the heart (see Deuteronomy 10:16; 30:6; Jeremiah 9:25–26; Romans 2:25–29)'
  - where: 'note 9:25 “Circumcised in body, uncircumcised in heart”'
    claim: 'One reading: circumcised and yet possessed of the foreskin; Judah between Egypt and Edom'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/9.htm
    quote: 'circumcised with foreskin, i.e., not, circumcised in the foreskin (lxx, Vulg.), but circumcised and yet possessed of the foreskin.'
  - where: 'note 9:25 “Circumcised in body, uncircumcised in heart”'
    claim: 'Egypt has some of the best ancient evidence for circumcision; Jer. 4:4; heart circumcision removes barrier'
    key: sc-knowhy-872
    url: https://scripturecentral.org/knowhy/why-does-jeremiah-refer-to-circumcising-the-heart
    quote: 'Outside Israel, some of the best evidence for circumcision in ancient times comes from Egypt'
  - where: 'note 9:25 “Circumcised in body, uncircumcised in heart”'
    claim: 'Circumcising the heart removes barriers; Jer. 4:4 calls to take away foreskins of the heart'
    key: sc-knowhy-872
    url: https://scripturecentral.org/knowhy/why-does-jeremiah-refer-to-circumcising-the-heart
    quote: 'circumcising the heart suggests the general idea of removing any barrier between us and God, opening the heart to the influence of the divine.'
  - where: 'note 9:25 “Circumcised in body, uncircumcised in heart”'
    claim: 'Israel had the physical mark but lacked the spiritual receptivity to match it'
    key: sc-knowhy-872
    url: https://scripturecentral.org/knowhy/why-does-jeremiah-refer-to-circumcising-the-heart
    quote: 'the Israelites in his day may have had this physical mark of purity and of a priestly class, but they now lacked the spiritual receptivity to match it.'
  - where: 'section 5 plain'
    claim: 'Plain reads verse 25 as circumcised yet uncircumcised (one group)'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/9.htm
    quote: 'circumcised with foreskin, i.e., not, circumcised in the foreskin (lxx, Vulg.), but circumcised and yet possessed of the foreskin.'
  - where: 'section 5 plain'
    claim: 'Plain renders the utmost corners as those who clip the hair at their temples'
    key: bdb
    url: https://biblehub.com/hebrew/6285.htm
    quote: 'פֵאָה קְצוּצֵי those clipped on the temples Jeremiah 9:25 ; Jeremiah 25:23 ; Jeremiah 49:32 (epithet of Arabian tribes'
  - where: 'section 2 plain'
    claim: 'Dragons rendered jackals'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/9?lang=eng
    quote: 'HEB jackals.'
