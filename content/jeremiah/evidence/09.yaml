    quote: 'וְעַל֙ כָּל־קְצוּצֵ֣י'
  - where: 'christ'
    claim: 'Paul: Christ made unto us wisdom, righteousness; He that glorieth'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/nt/1-cor/1?lang=eng
    quote: 'But of him are ye in Christ Jesus, who of God is made unto us wisdom, and righteousness, and sanctification, and redemption'
  - where: 'christ'
    claim: 'Jeremiah 9 stands beside Jesus lament over Jerusalem'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
