chapter: 52
claims:
  - where: 'setting'
    claim: 'Chapter 52 is a historical conclusion to the book (Bible Dictionary outline)'
    key: bd-jeremiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng
    quote: 'Chapter 52 forms a historical conclusion.'
  - where: 'setting'
    claim: 'Zedekiah reigned 597–586 (Bible Dictionary outline of Jeremiah)'
    key: bd-jeremiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng
    quote: 'Prophecies under Zedekiah (597–586), Jer. 21–38'
  - where: 'setting'
    claim: 'Church heading for the chapter'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/52?lang=eng
    quote: 'Jerusalem is besieged and taken by the Chaldeans—Many people and the vessels of the house of the Lord are carried into Babylon.'
  - where: 'note 52:1 “An appendix, not a prophecy”'
    claim: 'Jeremiah was taken to Egypt, not Babylon, so it is doubtful he wrote the chapter; perhaps Baruch added it; it summarizes earlier material (Jer. 39) and adds Jehoiachin'
    key: ot-manual-24
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng
    quote: 'Since Jeremiah did not go to Babylon but was taken to Egypt, it is doubtful that this chapter was written by him. Perhaps it was added by his scribe, Baruch.'
  - where: 'setting'
    claim: 'Chapter 52 is a summary of historical material previously covered and a record of further events such as Jehoiachin'
    key: ot-manual-24
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng
    quote: 'The last chapter of Jeremiah is a summary of historical material previously covered (see Jeremiah 39) and a record of further events, such as the improved status of Jehoiachin in Babylon'
  - where: 'note 52:1 “An appendix, not a prophecy”'
    claim: 'The preceding chapter ends with a formula closing the prophet’s words'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/51?lang=eng
    quote: 'Thus far are the words of Jeremiah.'
  - where: 'note 52:1 “An appendix, not a prophecy”'
    claim: 'Chapter 52 runs closely parallel to 2 Kings 24:18–25:30 (the same opening words, the same closing episode)'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng
    quote: 'Zedekiah was twenty and one years old when he began to reign, and he reigned eleven years in Jerusalem. And his mother’s name was Hamutal, the daughter of Jeremiah of Libnah.'
  - where: 'note 52:1 “Zedekiah''s mother, and a different Jeremiah”'
    claim: 'Hamutal, daughter of Jeremiah of Libnah, was also mother of Jehoahaz'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/23?lang=eng
    quote: 'Jehoahaz was twenty and three years old when he began to reign; and he reigned three months in Jerusalem. And his mother’s name was Hamutal, the daughter of Jeremiah of Libnah.'
  - where: 'note 52:1 “Zedekiah''s mother, and a different Jeremiah”'
    claim: 'The prophet Jeremiah was son of Hilkiah, of the priests at Anathoth'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/1?lang=eng
    quote: 'The words of Jeremiah the son of Hilkiah, of the priests that were in Anathoth in the land of Benjamin:'
  - where: 'note 52:3 “Why Zedekiah''s rebellion is called the Lord''s anger”'
    claim: 'Zedekiah rebelled despite Jeremiah’s warnings; Babylon came again'
    key: ot-manual-24
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng
    quote: 'Ignoring the repeated warnings of Jeremiah, he rebelled, and once again the Babylonians came against Jerusalem.'
  - where: 'note 52:3 “Why Zedekiah''s rebellion is called the Lord''s anger”'
    claim: '2 Kings 24:20 has the same words about the anger of the Lord and casting out'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng
    quote: 'For through the anger of the Lord it came to pass in Jerusalem and Judah, until he had cast them out from his presence, that Zedekiah rebelled against the king of Babylon.'
  - where: 'note 52:3 “Why Zedekiah''s rebellion is called the Lord''s anger”'
    claim: 'The people were ripe for destruction when the Spirit ceased to strive; six features of those who lose the Light of Christ'
    key: sc-knowhy-637
    url: https://scripturecentral.org/knowhy/why-did-the-lord-allow-jerusalem-to-be-destroyed
    quote: 'people are ripe for destruction when “the Spirit ceaseth to strive with [them]”'
  - where: 'note 52:3 “Why Zedekiah''s rebellion is called the Lord''s anger”'
    claim: 'The six features: repetition, rationalization, rebellion, seared conscience, rejection of prophets, continual sin'
    key: sc-knowhy-637
    url: https://scripturecentral.org/knowhy/why-did-the-lord-allow-jerusalem-to-be-destroyed
    quote: 'found that the people of Jerusalem had all six features and thus were “ripe for destruction.”'
  - where: 'note 52:4 “The day the siege began”'
    claim: 'Ezekiel, in the same ninth year, tenth month, tenth day, was told to write the day because the king of Babylon set himself against Jerusalem that day'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/24?lang=eng
    quote: 'write thee the name of the day, even of this same day: the king of Babylon set himself against Jerusalem this same day.'
  - where: 'note 52:4 “The day the siege began”'
    claim: 'The siege lasted about a year and a half; the city was broken up in the eleventh year, fourth month, ninth day'
    key: ot-manual-kings-g
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-g?lang=eng
    quote: 'what remained after a year and a half of siege, and a month of occupation and terror brought by Nebuzaradan, was put to the torch.'
  - where: 'note 52:4 “The day the siege began”'
    claim: 'Conditions during the siege almost beyond imagination; eyewitness account in Lamentations 4'
    key: ot-manual-kings-g
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-g?lang=eng
    quote: 'The conditions during this time were almost beyond imagination. An eyewitness recorded the following description: “How is the gold become dim!'
  - where: 'note 52:11 “He saw Babylon''s king, and did not see Babylon”'
    claim: 'Jeremiah had told Zedekiah his eyes would behold the eyes of the king of Babylon'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/34?lang=eng
    quote: 'thine eyes shall behold the eyes of the king of Babylon, and he shall speak with thee mouth to mouth, and thou shalt go to Babylon.'
  - where: 'note 52:11 “He saw Babylon''s king, and did not see Babylon”'
    claim: 'Ezekiel 12:12–13 describes a prince leaving by night through the wall, hiding his eyes, brought to Babylon yet not seeing it'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/12?lang=eng
    quote: 'yet shall he not see it, though he shall die there.'
  - where: 'note 52:11 “He saw Babylon''s king, and did not see Babylon”'
    claim: 'Ezekiel 12:12 the prince goes forth by night through the wall, covering his face so he does not see the ground'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/12?lang=eng
    quote: 'they shall dig through the wall to carry out thereby: he shall cover his face, that he see not the ground with his eyes.'
  - where: 'note 52:11 “He saw Babylon''s king, and did not see Babylon”'
    claim: 'Jeremiah 34 heading: Jeremiah prophesies the captivity of Zedekiah'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/34?lang=eng
    quote: 'Jeremiah prophesies the captivity of Zedekiah'
  - where: 'note 52:10 “Not all of Zedekiah''s sons”'
    claim: 'Bible Dictionary: not all of Zedekiah’s sons were slain; Mulek came to the Western Hemisphere'
    key: bd-zedekiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/zedekiah?lang=eng
    quote: 'not all of the sons of Zedekiah were slain (as implied in Jer. 52:10), for one son, Mulek, came to the Western Hemisphere (Hel. 8:21).'
  - where: 'note 52:10 “Not all of Zedekiah''s sons”'
    claim: 'Nephi son of Helaman: the sons of Zedekiah were slain, all except Mulek, and the seed of Zedekiah are with them'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/bofm/hel/8?lang=eng
    quote: 'Will ye say that the sons of Zedekiah were not slain, all except it were Mulek? Yea, and do ye not behold that the seed of Zedekiah are with us'
  - where: 'note 52:10 “Not all of Zedekiah''s sons”'
    claim: 'Amaleki: the people of Zarahemla came out from Jerusalem when Zedekiah was carried captive'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/bofm/omni/1?lang=eng
    quote: 'the people of Zarahemla came out from Jerusalem at the time that Zedekiah, king of Judah, was carried away captive into Babylon.'
  - where: 'note 52:10 “Not all of Zedekiah''s sons”'
    claim: 'It is likely Mulek was not in Jerusalem when it was destroyed (a hypothesis)'
    key: sc-knowhy-753
    url: https://scripturecentral.org/knowhy/how-did-mulek-get-to-the-new-world
    quote: 'It is likely that Mulek was not in Jerusalem at the time it was destroyed, either acting as an envoy for his father or having previously been led out of the city in hopes of preserving an heir to the throne.'
  - where: 'note 52:12 “The seventh day or the tenth”'
    claim: '2 Kings 25:8 gives the seventh day for the same event in the nineteenth year'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/25?lang=eng
    quote: 'And in the fifth month, on the seventh day of the month, which is the nineteenth year of king Nebuchadnezzar king of Babylon, came Nebuzar-adan'
  - where: 'note 52:12 “The seventh day or the tenth”'
    claim: 'The difference arose from one number being mistaken for another in copying; cannot be decided which is correct'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/52.htm
    quote: 'has arisen through one number having been mistaken for another in copying; it cannot now be decided which is correct'
  - where: 'setting'
    claim: 'Jeremiah 52 uses the spelling Nebuchadrezzar where 2 Kings 25 has Nebuchadnezzar for the same king (same year, same captain)'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/25?lang=eng
    quote: 'the nineteenth year of king Nebuchadnezzar king of Babylon, came Nebuzar-adan, captain of the guard'
  - where: 'note 52:16 “Who was left in the land”'
    claim: 'Jeremiah 39:10: the poor who had nothing were left and given vineyards and fields'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/39?lang=eng
    quote: 'left of the poor of the people, which had nothing, in the land of Judah, and gave them vineyards and fields at the same time.'
  - where: 'note 52:16 “Who was left in the land”'
    claim: 'Nebuchadnezzar made Gedaliah ruler over those who remained (2 Kings 25:22)'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/25?lang=eng
    quote: 'And as for the people that remained in the land of Judah, whom Nebuchadnezzar king of Babylon had left, even over them he made Gedaliah the son of Ahikam, the son of Shaphan, ruler.'
  - where: 'note 52:16 “Who was left in the land”'
    claim: 'Jeremiah 52 omits the Gedaliah account because it is told at Jeremiah 40:7–43:7 and did not bear on this chapter’s aim'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/52.htm
    quote: 'is here omitted, because the matter has bee already more fully stated in the passage Jeremiah 40:7 on to Jeremiah 43:7'
  - where: 'note 52:17 “Solomon''s bronze, carried to Babylon and brought back”'
    claim: 'Solomon cast two pillars of eighteen cubits'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/7?lang=eng
    quote: 'For he cast two pillars of brass, of eighteen cubits high apiece: and a line of twelve cubits did compass either of them about.'
  - where: 'note 52:17 “Solomon''s bronze, carried to Babylon and brought back”'
    claim: 'Solomon left the vessels unweighed because exceeding many'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/7?lang=eng
    quote: 'And Solomon left all the vessels unweighed, because they were exceeding many: neither was the weight of the brass found out.'
  - where: 'note 52:17 “Solomon''s bronze, carried to Babylon and brought back”'
    claim: 'Jeremiah 27:19–22 foretold the remaining vessels would go to Babylon until the Lord restores them'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/27?lang=eng
    quote: 'They shall be carried to Babylon, and there shall they be until the day that I visit them, saith the Lord; then will I bring them up, and restore them to this place.'
  - where: 'note 52:17 “Solomon''s bronze, carried to Babylon and brought back”'
    claim: 'Cyrus brought out the vessels and numbered them to Sheshbazzar, five thousand four hundred in all'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/1?lang=eng
    quote: 'All the vessels of gold and of silver were five thousand and four hundred. All these did Sheshbazzar bring up with them of the captivity'
  - where: 'note 52:28 “Counting the exiles”'
    claim: '2 Kings 24:14 gives ten thousand captives for the earlier deportation'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng
    quote: 'even ten thousand captives, and all the craftsmen and smiths: none remained, save the poorest sort of the people of the land.'
  - where: 'note 52:28 “Counting the exiles”'
    claim: 'The 832 doubtless refers only to adult males and likely only to Jerusalem; the number of deportees was much larger'
    key: ot-manual-kings-g
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-g?lang=eng
    quote: 'Jeremiah 52:29mentions the number 832. But this doubtless refers only to adult males and likely only to inhabitants of Jerusalem. The number of deportees was much larger.'
  - where: 'note 52:28 “Counting the exiles”'
    claim: 'One reading: the list puts the second deportation in the eighteenth year against verse 12’s nineteenth because it came from another source that reckoned the king’s years differently'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/52.htm
    quote: 'This difference can be settled only by assuming that this list of deportations was derived from another source … in which the years of Nebuchadnezzar''s reign were reckoned in some other way'
  - where: 'note 52:28 “Counting the exiles”'
    claim: 'The list of deportations is a calculation, three deportations totalling 4600'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/52.htm
    quote: 'in the seventh year of Nebuchadnezzar, 3023 Jews; in the eighteenth year, 832 souls from Jerusalem; and in the twenty-third year, 745 souls, - in all, 4600 perso'
  - where: 'note 52:31 “The king let out of prison”'
    claim: 'Jehoiachin, also called Jeconiah and Coniah, king of Judah (598 B.C.); Jer. 52:31 is listed'
    key: bd-jehoiachin
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jehoiachin?lang=eng
    quote: 'King of Judah (598 B.C.), also known as Jeconiah, Joachin, Coniah (2 Kgs. 24:6–15; 25:27; 2 Chr. 36:8–9; Jer. 52:31; Ezek. 1:2).'
  - where: 'note 52:31 “The king let out of prison”'
    claim: 'Jehoiachin was taken to Babylon and Zedekiah placed on the throne; Jehoiachin likewise exiled'
    key: ot-manual-kings-g
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-g?lang=eng
    quote: 'Jehoiachin was likewise exiled, and his uncle, who took the throne name Zedekiah, ruled in his stead.'
  - where: 'note 52:31 “The king let out of prison”'
    claim: 'Zedekiah was exiled in prison till death (v. 11) while Jehoiachin eats at the king’s table all his days (2 Kings 25:29–30)'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/25?lang=eng
    quote: 'And he spake kindly to him, and set his throne above the throne of the kings that were with him in Babylon;'
  - where: 'note 52:31 “The king let out of prison”'
    claim: 'Jeremiah 22:24–30: Coniah plucked off, written childless, none of his seed to prosper sitting on the throne of David'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/22?lang=eng
    quote: 'Write ye this man childless, a man that shall not prosper in his days: for no man of his seed shall prosper, sitting upon the throne of David, and ruling any more in Judah.'
  - where: 'note 52:31 “The king let out of prison”'
    claim: 'Jeremiah 22:24–30: Coniah likened to a signet, delivered to Nebuchadnezzar, never to return'
    key: ot-manual-24
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng
    quote: 'Jehoiachin, was told that if he were all that God had of value, in Jehoiachin’s present state of unrighteousness, Jehoiachin still would have to be delivered into the hand of Nebuchadnezzar, never to return.'
  - where: 'note 52:34 “Jechonias in Matthew''s genealogy”'
    claim: 'Matthew’s genealogy names Jechonias and his son Salathiel, father of Zorobabel'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/nt/matt/1?lang=eng
    quote: 'And after they were brought to Babylon, Jechonias begat Salathiel; and Salathiel begat Zorobabel;'
  - where: 'christ'
    claim: 'Bible Dictionary ties Zedekiah’s name (“The Lord is righteousness”) to Jer. 23:6 and 33:16'
    key: bd-zedekiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/zedekiah?lang=eng
    quote: 'The Lord (is) righteousness. The last king of Judah, his name changed from Mattaniah to Zedekiah (Jer. 23:6; 33:16).'
  - where: 'christ'
    claim: 'Jer. 23:1–6 is the promise of the king Messiah'
    key: bd-jeremiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng
    quote: 'with promise of the king Messiah (23:1–6)'
  - where: 'note 52:1 “An appendix, not a prophecy”'
    claim: '2 Kings 25:17 describes the pillar’s pomegranates without the count of ninety-six; Kings 25 has no list of exile numbers'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/25?lang=eng
    quote: 'and the wreathen work, and pomegranates upon the chapiter round about, all of brass: and like unto these had the second pillar with wreathen work.'
  - where: 'note 52:31 “The king let out of prison”'
    claim: 'The 2 Kings date is the twenty-seventh day; Jeremiah 52 has the twenty-fifth'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/25?lang=eng
    quote: 'in the twelfth month, on the seven and twentieth day of the month, that Evil-merodach king of Babylon'
  - where: 'note 52:3 “Why Zedekiah''s rebellion is called the Lord''s anger”'
    claim: 'Nephi: when the Spirit ceaseth to strive, destruction follows (2 Ne. 26:11)'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/26?lang=eng
    quote: 'when the Spirit ceaseth to strive with man then cometh speedy destruction'
  - where: 'note 52:11 “He saw Babylon''s king, and did not see Babylon”'
    claim: 'The fall of the city vindicated both Jeremiah’s and Ezekiel’s prophecies of Zedekiah’s fate'
    key: ot-manual-19
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-19?lang=eng
    quote: 'As recorded in 2 Kings 25:7, both prophets were vindicated by subsequent events.'
  - where: 'note 52:34 “Jechonias in Matthew''s genealogy”'
    claim: 'Jehoiachin is also called Jeconiah'
    key: bd-jehoiachin
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jehoiachin?lang=eng
    quote: 'King of Judah (598 B.C.), also known as Jeconiah, Joachin, Coniah'
  - where: 'note 52:34 “Jechonias in Matthew''s genealogy”'
    claim: 'Salathiel is named among the sons of Jeconiah'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/3?lang=eng
    quote: 'And the sons of Jeconiah; Assir, Salathiel his son,'
