    claim: "Chapter 18 gives no date; Bible Dictionary groups chapters 7–20 under Jehoiakim (608–597)"
    key: bd-jeremiah
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng"
    quote: "Prophecies under Jehoiakim (608–597), Jer. 7–20"
  - where: "when"
    claim: "The discourse of chapter 19 belongs to the reign of Jehoiakim"
    key: ot-manual-23
    url: "https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng"
    quote: "Jeremiah’s discourse in 19:1–15 was delivered during the reign of Jehoiakim."
  - where: "setting"
    claim: "Jeremiah faced continuous opposition from priests, mob, townsmen, king, army"
    key: bd-jeremiah
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng"
    quote: "He had to face continuous opposition and insult from the priests ( 20:2 ), the mob ( 26:8–9 ), his townsmen at Anathoth ( 11:19 )"
  - where: "setting"
    claim: "Chapter 18 has the potter object lesson; chapter 19 a finished piece of pottery that is broken"
    key: ot-seminary-guide-jer-18
    url: "https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-student-study-guide-obs/the-book-of-jeremiah/jeremiah-18-19-pottery-and-judah?lang=eng"
    quote: "Jeremiah often used objects to teach his message. He used one in each chapter of Jeremiah 18–19"
  - where: "setting"
    claim: "Chapter 19 is the broken flask: Jeremiah breaks a bottle before elders"
    key: ot-manual-23
    url: "https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng"
    quote: "By the breaking of a potter’s bottle or jar, Jeremiah represented the sacking and captivity of Judah."
  - where: "note 18:2 “A visit to the potter's house”"
    claim: "Footnote on verse 2 sends to Jer. 19:1, where Jeremiah is sent to a potter again"
    key: lds-scriptures
    url: "https://www.churchofjesuschrist.org/study/scriptures/ot/jer/18?lang=eng"
    quote: "Jer. 19:1 (1–2)"
  - where: "note 18:2 “A visit to the potter's house”"
    claim: "Seminary guide: in chapter 18 the potter reworks the clay; chapter 19 is a finished piece"
    key: ot-seminary-guide-jer-18
    url: "https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-student-study-guide-obs/the-book-of-jeremiah/jeremiah-18-19-pottery-and-judah?lang=eng"
    quote: "When a potter makes an object that doesn’t look like he wants it to, he throws the clay back on the wheel in a lump and tries again."
  - where: "note 18:2 “A visit to the potter's house”"
    claim: "Jeremiah saw the potter at work, found a flaw, and began again"
    key: tefan-potters-clay
    url: "https://www.churchofjesuschrist.org/study/ensign/2002/10/jeremiah-as-potters-clay?lang=eng"
    quote: "Jeremiah watched as the potter discovered a flaw in the vessel he was making."
  - where: "note 18:2 “A visit to the potter's house”"
    claim: "The potter spun a lower wheel with his foot while working clay on an upper wheel"
    key: tefan-potters-clay
    url: "https://www.churchofjesuschrist.org/study/ensign/2002/10/jeremiah-as-potters-clay?lang=eng"
    quote: "spinning a lower wheel with his foot while working with his hands a pile of wet clay on an upper wheel"
