    quote: "when it marred in the hands of the potter it was cut off the wheel and then thrown back again into the mill, to go in to the next batch, and was a vessel of dishonor"
  - where: "note 18:4 “Vessels of honor and dishonor”"
    claim: "Kimball: pliable, obedient people are vessels of honor"
    key: ot-manual-23
    url: "https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng"
    quote: "all that are pliable in the hands of God and are obedient to His commands, are vessels of honor, and God will receive them."
  - where: "note 18:4 “Vessels of honor and dishonor”"
    claim: "Joseph Smith said Kimball had given a true explanation of the parable"
    key: ot-manual-23
    url: "https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng"
    quote: "Brother Kimball has given you a true explanation of the parable."
