chapter: 12
claims:
  - where: 'when'
    claim: 'Bible Dictionary outline places Jeremiah 7–20 under Jehoiakim (608–597)'
    key: bd-jeremiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng
    quote: 'Jehoiakim (608–597), Jer. 7–20.'
  - where: 'thread'
    claim: 'The Lord tells Jeremiah he must patiently endure still worse (Keil, quoted in the manual)'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'whereupon the Lord reproves him for this outburst of ill-nature and impatience by telling him that he must patiently endure still worse.'
  - where: 'thread'
    claim: 'Verses 14–17 are the reply to the prophet''s murmuring, showing the justice of God''s government'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'By this discovery of His world-plan the Lord makes so complete a reply to the prophet’s murmuring concerning the prosperity of the ungodly (vers. 1–6), that from it may clearly be seen the justice of God’s government on earth.'
  - where: 'thread'
    claim: 'Same passage in Keil'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/12.htm
    quote: 'that from it may clearly be seen the justice of God''s government on earth.'
  - where: 'section 2 plain'
    claim: '"Swelling of Jordan" rendered as the thickets along the Jordan'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/12.htm
    quote: 'It is the strip of land along the bank of the Jordan, thickly overgrown with shrubs, trees, and tall reeds'
  - where: 'setting'
    claim: 'Chapter 11 reports the Anathoth men seeking Jeremiah''s life'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/11?lang=eng
    quote: 'thus saith the Lord of the men of Anathoth, that seek thy life, saying, Prophesy not in the name of the Lord, that thou die not by our hand'
  - where: 'setting'
    claim: 'Church chapter heading for Jeremiah 12'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/12?lang=eng
    quote: 'Jeremiah complains of the prosperity of the wicked—If other nations learn the ways of Israel, they will be numbered with Israel.'
  - where: 'setting'
    claim: 'Footnote cross-references: verse 10 to Jacob 6:2, verse 15 to Deut. 30:3, verse 17 to Isa. 60:12'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/12?lang=eng
    quote: 'Jacob 6:2 . IE pays attention. OR taken pains. Deut. 30:3 . TG Israel, Gathering of . TG Disobedience . Isa. 60:12 .'
  - where: 'setting'
    claim: 'Psalm 73 asks the same question'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/ps/73?lang=eng
    quote: 'For I was envious at the foolish, when I saw the prosperity of the wicked.'
  - where: 'setting'
    claim: 'Malachi 3 reports the same complaint and the Lord''s answer'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/mal/3?lang=eng
    quote: 'And now we call the proud happy; yea, they that work wickedness are set up'
  - where: 'note 12:1 “An old question, asked respectfully”'
    claim: 'Jeremiah raises age-old questions: why the wicked prosper, how long until punished; cf. Malachi 3:13–18'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'Jeremiah raised age-old questions: Why do the wicked sometimes prosper while the righteous do not? (see Jeremiah 12:1). How much time will pass before their wickedness will be punished? (see v. 4; Malachi 3:13–18).'
  - where: 'note 12:1 “An old question, asked respectfully”'
    claim: 'Psalmist''s answer: understood their end in the sanctuary'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/ps/73?lang=eng
    quote: 'When I thought to know this, it was too painful for me; Until I went into the sanctuary of God; then understood I their end.'
  - where: 'note 12:1 “An old question, asked respectfully”'
    claim: 'Malachi: book of remembrance and discerning the righteous and the wicked'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/mal/3?lang=eng
    quote: 'a book of remembrance was written before him for them that feared the Lord… Then shall ye return, and discern between the righteous and the wicked'
  - where: 'note 12:2 “Near in the mouth, far from the kidneys”'
    claim: 'Hebrew kilyot = kidneys; figuratively affections; as involving character, object of God''s examination, paired with heart; Jer. 11:20'
    key: bdb
    url: https://biblehub.com/hebrew/3629.htm
    quote: 'Jeremiah 12:2 near art thou in their mouth, and far from their affections; hence, as involving character, the object of God''s examination, always "" וָלֵב ׃לֵב ׳כֹּחֵן כ Jeremiah 11:20'
  - where: 'note 12:2 “Near in the mouth, far from the kidneys”'
    claim: 'Jer. 11:20 calls God the one who tries the reins and the heart'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/11?lang=eng
    quote: 'O Lord of hosts, that judgest righteously, that triest the reins and the heart'
  - where: 'note 12:2 “Near in the mouth, far from the kidneys”'
    claim: 'Footnote to verse 2 is Matt. 15:8'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/nt/matt/15?lang=eng
    quote: 'This people draweth nigh unto me with their mouth, and honoureth me with their lips; but their heart is far from me.'
  - where: 'note 12:3 “What lies behind the prayer”'
    claim: 'Jeremiah was like a lamb brought to the slaughter; asks to see vengeance; Lord promises to punish the men of Anathoth'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/11?lang=eng
    quote: 'But I was like a lamb or an ox that is brought to the slaughter; and I knew not that they had devised devices against me'
  - where: 'note 12:3 “What lies behind the prayer”'
    claim: 'Bible Dictionary: continuous opposition and insult, including townsmen at Anathoth (11:19)'
    key: bd-jeremiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng
    quote: 'He had to face continuous opposition and insult from the priests (20:2), the mob (26:8–9), his townsmen at Anathoth (11:19)'
  - where: 'note 12:3 “What lies behind the prayer”'
    claim: 'The enmity at Anathoth excites his displeasure at the prosperity of the wicked'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'The enmity experienced by Jeremiah at the hands of his countrymen at Anathoth excites his displeasure at the prosperity of the wicked, who thrive and live with immunity.'
  - where: 'note 12:3 “What lies behind the prayer”'
    claim: 'Same reading in Keil: he demands that they be cut off'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/12.htm
    quote: 'demands from God''s righteousness that they be cut off out of the land (Jeremiah 12:1-4)'
  - where: 'note 12:4 “Whose end is meant, the prophet''s or God''s?”'
    claim: 'Septuagint: God shall not see our ways'
    key: lxx-rahlfs
    url: https://biblehub.com/sep/jeremiah/12.htm
    quote: 'because the people said, God shall not see our ways.'
  - where: 'note 12:4 “Whose end is meant, the prophet''s or God''s?”'
    claim: 'Many follow the LXX and refer seeing to God; objection that raah of God is only of what is present; better refer to the prophet, who they say will not see their end because his threats will not come true'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/12.htm
    quote: 'to this Graf has justly objected, that רָאָה, in all the passages that can be cited for this sense of the word, is used only of that which God sees, regards as already present, never of that which is future.'
  - where: 'note 12:4 “Whose end is meant, the prophet''s or God''s?”'
    claim: 'Keil: the drought falls on the innocent with the guilty'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/12.htm
    quote: 'But this falls not only on the unfaithful, but upon the godly too, and even the beasts, cattle, and birds suffer from it; and so the innocent along with the guilty.'
  - where: 'note 12:5 “Footmen, horses, and the Jordan”'
    claim: 'The Lord''s reply is a vivid answer that has helped many build courage; Clarke''s sense of footmen, horses, land of peace, deluge'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'the Lord gave a vivid answer that has helped many to build up their courage.'
  - where: 'note 12:5 “Footmen, horses, and the Jordan”'
    claim: 'Manual quotes flood reading: enemy shall deluge every part of the land'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'in the time when the enemy, like an overflowing torrent, shall deluge every part of the land?'
  - where: 'note 12:5 “Footmen, horses, and the Jordan”'
    claim: 'Flood reading: the overflowing Jordan drove lions from the bushes on its banks'
    key: clarke-commentary
    url: https://biblehub.com/commentaries/clarke/jeremiah/12.htm
    quote: 'The overflowing of Jordan, which generally happened in harvest, drove the lions and other beasts of prey from their coverts among the bushes that lined its banks'
  - where: 'note 12:5 “Footmen, horses, and the Jordan”'
    claim: 'Another reading: the thicket along the Jordan, haunt of lions; cf. Jer. 49:19'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/12.htm
    quote: 'It is the strip of land along the bank of the Jordan, thickly overgrown with shrubs, trees, and tall reeds, the lower valley, flooded when the river was swollen, where lions had their haunt'
  - where: 'note 12:5 “Footmen, horses, and the Jordan”'
    claim: 'Jer. 49:19 text'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/49?lang=eng
    quote: 'he shall come up like a lion from the swelling of Jordan against the habitation of the strong'
  - where: 'note 12:6 “Betrayed by his own family”'
    claim: 'Footnote 6a is Prophets, Rejection of'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/12?lang=eng
    quote: 'TG Prophets, Rejection of.'
  - where: 'note 12:6 “Betrayed by his own family”'
    claim: 'Call promised opposition from the people of the land'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/1?lang=eng
    quote: 'against the kings of Judah, against the princes thereof, against the priests thereof, and against the people of the land.'
  - where: 'note 12:7 “The Lord speaks of His own house”'
    claim: 'Footnote 7a cites Ps. 69:25; Jer. 22:5; Matt. 23:38; Luke 13:35'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/12?lang=eng
    quote: 'Ps. 69:25 ; Jer. 22:5 ; Matt. 23:38 ; Luke 13:35 .'
  - where: 'note 12:7 “The Lord speaks of His own house”'
    claim: 'Matt. 23:37–38'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/nt/matt/23?lang=eng
    quote: 'how often would I have gathered thy children together, even as a hen gathereth her chickens under her wings, and ye would not! 38 Behold, your house is left unto you desolate.'
  - where: 'note 12:7 “The Lord speaks of His own house”'
    claim: 'Jer. 22:5: if ye will not hear, this house shall become a desolation'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/22?lang=eng
    quote: 'But if ye will not hear these words, I swear by myself, saith the Lord, that this house shall become a desolation.'
  - where: 'note 12:9 “A speckled bird among birds of prey”'
    claim: 'Thompson: Israel with proud plumage attracts birds of prey; alternative hyena'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'Israel with her proud plumage has attracted the attention of birds of prey (enemies) who move in to attack her. An alternative translation arises from rendering sabua as a noun, ‘hyena,’ which is possible.'
  - where: 'note 12:9 “A speckled bird among birds of prey”'
    claim: 'Footnote 9a: beasts of the field = Babylon and others'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/12?lang=eng
    quote: 'IE  Babylon and others.'
  - where: 'note 12:9 “A speckled bird among birds of prey”'
    claim: 'Septuagint reads hyaena''s cave'
    key: lxx-rahlfs
    url: https://biblehub.com/sep/jeremiah/12.htm
    quote: 'Is not my inheritance to me a hyaena''s cave, or a cave round about her?'
  - where: 'note 12:10 “Shepherds and the Lord''s vineyard”'
    claim: 'Septuagint: shepherds'
    key: lxx-rahlfs
    url: https://biblehub.com/sep/jeremiah/12.htm
    quote: 'Many shepherds have destroyed my vineyard'
  - where: 'note 12:10 “Shepherds and the Lord''s vineyard”'
    claim: 'Bible Dictionary: chapters 21–23 on pastors or rulers of the people'
    key: bd-jeremiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng
    quote: '(a) Jer. 21–23, on pastors or rulers of the people, with promise of the king Messiah (23:1–6)'
  - where: 'note 12:10 “Shepherds and the Lord''s vineyard”'
    claim: 'Pastors of Judah = religious leaders who had not fed and protected the sheep'
    key: ot-manual-25
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng
    quote: 'Jeremiah showed that the pastors (religious leaders) of Judah had not fed and protected the sheep (Israel), but had scattered them and driven them away'
  - where: 'note 12:10 “Shepherds and the Lord''s vineyard”'
    claim: 'Vineyard of the Lord is the house of Israel'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/isa/5?lang=eng
    quote: 'For the vineyard of the Lord of hosts is the house of Israel, and the men of Judah his pleasant plant'
  - where: 'note 12:10 “Shepherds and the Lord''s vineyard”'
    claim: 'Jacob 6:1–2; footnotes 10a False Prophets, 10b Jacob 6:2, 11a pays attention'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/bofm/jacob/6?lang=eng
    quote: 'the things which this prophet Zenos spake, concerning the house of Israel, in the which he likened them unto a tame olive tree, must surely come to pass. 2 And the day that he shall set his hand again the second time to recover his people'
  - where: 'note 12:14 “Judah''s neighbors”'
    claim: 'Evil neighbours are the neighboring heathen nations'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/12.htm
    quote: 'The evil neighbours that lay hands on Jahve''s heritage are the neighbouring heathen nations, the Edomites, Moabites, Ammonites, Philistines, and Syrians.'
  - where: 'note 12:14 “Judah''s neighbors”'
    claim: 'The neighbours stand as representatives of the heathen nations generally'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/12.htm
    quote: 'The neighbours are brought up here simply as representatives of the heathen nations, and what is said of them is true for all the heathen.'
  - where: 'note 12:14 “Judah''s neighbors”'
    claim: 'Spoilers also carried off, then pity'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'The spoilers of the Lord’s heritage are also to be carried off out of their land; but after they, like Judah, have been punished, the Lord will have pity on them'
  - where: 'note 12:15 “After the plucking, compassion”'
    claim: 'Deut. 30:3; footnotes Deut. 30:3 and Israel, Gathering of'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/deut/30?lang=eng
    quote: 'That then the Lord thy God will turn thy captivity, and have compassion upon thee, and will return and gather thee from all the nations'
  - where: 'note 12:15 “After the plucking, compassion”'
    claim: 'Manual heading: Can the Spoilers of Judah Ever Be Blessed of the Lord?'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'Jeremiah 12:14–17. Can the Spoilers of Judah Ever Be Blessed of the Lord?'
  - where: 'note 12:16 “Joining Israel”'
    claim: 'Church heading: nations that learn Israel''s ways will be numbered with Israel'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/12?lang=eng
    quote: 'If other nations learn the ways of Israel, they will be numbered with Israel.'
  - where: 'note 12:16 “Joining Israel”'
    claim: 'Converted nations receive citizenship among God''s people and are built up among them'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'they shall receive citizenship amongst God’s people and be built up amongst them'
  - where: 'note 12:2 “Near in the mouth, far from the kidneys”'
    claim: 'BDB: kilyot, kidneys, literally the physical organ'
    key: bdb
    url: https://biblehub.com/hebrew/3629.htm
    quote: 'kidneys: 1 literally, as physical organ'
