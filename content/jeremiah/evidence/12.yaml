    url: https://www.churchofjesuschrist.org/study/scriptures/ot/isa/60?lang=eng
    quote: 'For the nation and kingdom that will not serve thee shall perish; yea, those nations shall be utterly wasted.'
  - where: 'christ'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: 'explore'
    claim: '3 Ne. 21:22–24 speaks of Gentiles who repent being numbered with the remnant of Jacob'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/21?lang=eng
    quote: 'they shall come in unto the covenant and be numbered among this the remnant of Jacob'
