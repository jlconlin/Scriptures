  - where: note 25:9 “Nebuchadrezzar, my servant”
    claim: "Keil: the Lord calls him His servant as the executor of His will on Judah; no valid reason to call the words an interpolation because absent in the LXX"
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/25.htm
    quote: God calls Nebuchadnezzar His servant, as the executor of His will on Judah, cf. Jeremiah 27:6 and Jeremiah 43:10.
  - where: note 25:9 “Nebuchadrezzar, my servant”
    claim: "Keil: the change of construction gives Nebuchadnezzar prominence"
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/25.htm
    quote: There is prominence given to Nebuchadnezzar by the very change of the construction, another "send" requiring to be repeated before "to Nebuchadrezzar."
  - where: note 25:9 “Nebuchadrezzar, my servant”
    claim: Keil on the LXX omission of the words
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/25.htm
    quote: "No valid reason appears for pronouncing the words: and to Nebuchadrezzar...my servant, to be a later interpolation (Hitz., Gr.) because they are not in the lxx."
