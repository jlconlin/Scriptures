chapter: 25
claims:
  - where: setting
    claim: Chapter heading of Jeremiah 25
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/25?lang=eng
    quote: Captive Judah will serve Babylon for seventy years—Various nations will be overthrown—In the last days, all the inhabitants of the earth will be at war.
  - where: setting
    claim: Chapter 25 discusses the fourth year of Jehoiakim; chapter 26 goes back in time (book not chronological)
    key: ot-manual-24
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng
    quote: The book of Jeremiah is not arranged chronologically. For example, Jeremiah 25discusses the fourth year of the reign of Jehoiakim. Then, Jeremiah 26:1–9discusses the first year of his reign.
  - where: when
    claim: Babylon defeated the Egyptians at Carchemish in 605 B.C.; Judah became a vassal
    key: ot-manual-kings-g
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-g?lang=eng
    quote: Babylon defeated the Egyptians at Carchemish in 605 B.C. Judah became a vassal of the new conquerors.
  - where: note 25:1 “The year Babylon rose”
    claim: Jeremiah dates the defeat of Pharaoh Necho at Carchemish to Jehoiakim’s fourth year
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/46?lang=eng
    quote: which Nebuchadrezzar king of Babylon smote in the fourth year of Jehoiakim the son of Josiah king of Judah.
  - where: note 25:1 “The year Babylon rose”
    claim: Nebuchadnezzar’s name has two spellings and his reign is dated 604–561 B.C.; he defeats Necho at Carchemish
    key: bd-nebuchadnezzar
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/nebuchadnezzar?lang=eng
    quote: The great king of Babylon (604–561 B.C.), son of Nabopolassar, the founder of the empire (see Assyria and Babylonia); defeats Necho, king of Egypt, at Carchemish
  - where: note 25:1 “The year Babylon rose”
    claim: Judah’s rulers looked to Egypt for protection against Babylon
    key: ot-manual-kings-g
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-g?lang=eng
    quote: The political rulers looked to Egypt for protection and power against Babylon’s growing influence, even though Jeremiah had again and again warned Judah not to trust in Egypt for deliverance.
  - where: note 25:3 “Rising early”
    claim: The Hebrew verb means to start early, properly to load beasts for a day’s journey
    key: bdb
    url: https://biblehub.com/hebrew/7925.htm
    quote: start, rise, early (properly load backs of beasts for day's journey)
  - where: note 25:3 “Rising early”
    claim: "Used especially of Yahweh in Jeremiah, and of Jeremiah in 25:3: speaking early and often"
    key: bdb
    url: https://biblehub.com/hebrew/7925.htm
    quote: = speaking early and often Jeremiah 7:13; Jeremiah 35:14 and (of Jeremiah) Jeremiah 25:3
  - where: note 25:3 “Rising early”
    claim: Sending early and often is used of the Lord’s sending of the prophets (Jer 7:25; 24:4; 26:5; 29:19; 35:14; 44:4)
    key: bdb
    url: https://biblehub.com/hebrew/7925.htm
    quote: = sending early and often Jeremiah 7:25; Jeremiah 24:4; Jeremiah 26:5; Jeremiah 29:19; Jeremiah 35:14; Jeremiah 44:4
  - where: note 25:3 “Rising early”
    claim: The Church edition’s footnote at verse 3 points to Jer. 1:2 and 36:2
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/25?lang=eng
    quote: Jer. 1:2; 36:2.
  - where: note 25:3 “Rising early”
    claim: "Jer 36:2: Lord tells Jeremiah to write all the words from the days of Josiah to this day"
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/36?lang=eng
    quote: Take thee a roll of a book, and write therein all the words that I have spoken unto thee against Israel, and against Judah, and against all the nations, from the day I spake unto thee, from the days of Josiah, even unto this day.
  - where: note 25:4 “Lehi among the prophets”
    claim: Jeremiah prophesied that Babylon would conquer Judah because they rejected Jeremiah and other prophets such as Lehi
    key: ot-seminary-guide-jer-25
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-student-study-guide-obs/the-book-of-jeremiah/jeremiah-25-26-rejecting-prophets-leads-to-captivity?lang=eng
    quote: Jeremiah prophesied with certainty that Babylon would conquer Judah because they rejected the words of Jeremiah and other prophets (such as Lehi).
  - where: note 25:4 “Lehi among the prophets”
    claim: Other unnamed prophets may have been active in Lehi's time, citing Jeremiah 25:4
    key: sc-knowhy-441
    url: https://scripturecentral.org/knowhy/who-were-the-many-prophets-in-jerusalem-during-lehis-time
    quote: In addition, other unnamed prophets may have been active during this time as well (see Jeremiah 25:4; 2 Chronicles 36:15–16).
  - where: note 25:4 “Lehi among the prophets”
    claim: "Nephi’s account: many prophets prophesying repentance or Jerusalem must be destroyed (1 Ne 1:4)"
    key: sc-knowhy-441
    url: https://scripturecentral.org/knowhy/who-were-the-many-prophets-in-jerusalem-during-lehis-time
    quote: there were “many prophets, prophesying unto the people that they must repent, or the great city Jerusalem must be destroyed” (1 Nephi 1:4).
  - where: note 25:4 “Lehi among the prophets”
    claim: The Jews mocked Lehi for what he testified of them (1 Ne 1:19); footnote at 25:4 links 1 Ne 1:19 and Jer 26:5
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/1?lang=eng
    quote: And it came to pass that the Jews did mock him because of the things which he testified of them
  - where: note 25:4 “Lehi among the prophets”
    claim: Church footnote at verse 4 points to Jer. 26:5 and 1 Ne. 1:19
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/25?lang=eng
    quote: Jer. 26:5; 1 Ne. 1:19 (13–19).
  - where: note 25:4 “Lehi among the prophets”
    claim: "Jer 26:5 repeats the charge: servants the prophets, rising up early and sending them"
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/26?lang=eng
    quote: To hearken to the words of my servants the prophets, whom I sent unto you, both rising up early, and sending them, but ye have not hearkened;
  - where: note 25:4 “Lehi among the prophets”
    claim: Urijah was killed for delivering a similar prophecy, which helps explain why the judgment was so certain
    key: ot-seminary-guide-jer-25
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-student-study-guide-obs/the-book-of-jeremiah/jeremiah-25-26-rejecting-prophets-leads-to-captivity?lang=eng
    quote: We also read of a prophet named Urijah who was killed for delivering a similar prophecy. This fact helps explain why the judgment was so certain in chapter 25.
