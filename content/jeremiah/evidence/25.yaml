    claim: Church footnote at “my servant” points to Jer. 43:10; and at “send” to 2 Kgs. 24:2
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/25?lang=eng
    quote: Jer. 43:10.
