chapter: 43
claims:
  - where: 'setting'
    claim: 'The Church heading summarizes the chapter: Johanan takes Jeremiah and the remnant to Egypt; Jeremiah prophesies Babylon will conquer Egypt'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/43?lang=eng'
    quote: 'Johanan carries Jeremiah and the remnant of Judah into Egypt—Jeremiah prophesies that Babylon will conquer Egypt.'
  - where: 'setting'
    claim: 'Ishmael killed Gedaliah, governor appointed by Babylon, and the remnant, fearing the Chaldeans, set out for Egypt'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/41?lang=eng'
    quote: 'And they departed, and dwelt in the habitation of Chimham, which is by Beth-lehem, to go to enter into Egypt, Because of the Chaldeans: for they were afraid of them'
  - where: 'setting'
    claim: 'The Lord told the remnant to stay in Judah and be built up (Jer. 42:10)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/42?lang=eng'
    quote: 'If ye will still abide in this land, then will I build you, and not pull you down'
  - where: 'setting'
    claim: 'Jeremiah ends in Egypt, compelled to live there'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'Eventually he was driven out of Israel and compelled to live in Egypt.'
  - where: 'when'
    claim: 'Jerusalem fell in 586 B.C.'
    key: bd-jeremiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng'
    quote: 'a period of over 40 years, 626–586 B.C.'
  - where: 'note 43:2 “They had promised to obey”'
    claim: 'In ch. 42 the captains and all the people swore to obey whatever the Lord said, good or evil'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/42?lang=eng'
    quote: 'Whether it be good, or whether it be evil, we will obey the voice of the Lord our God, to whom we send thee'
  - where: 'note 43:2 “They had promised to obey”'
    claim: 'Jeremiah told them in ch. 42 that they dissembled in their hearts and the Lord said Go ye not into Egypt'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/42?lang=eng'
    quote: 'The Lord hath said concerning you, O ye remnant of Judah; Go ye not into Egypt: know certainly that I have admonished you this day. For ye dissembled in your hearts'
  - where: 'note 43:2 “They had promised to obey”'
    claim: 'Chapter 42:1 names Jezaniah son of Hoshaiah with Johanan; Keil thinks Azariah here is probably an error for Jezaniah'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/43.htm'
    quote: 'Azariah (probably an error for Jezaniah, see on Jeremiah 42:1) the son of Hoshaiah'
  - where: 'note 43:2 “They had promised to obey”'
    claim: 'Chapter 42:1 text names Jezaniah the son of Hoshaiah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/42?lang=eng'
    quote: 'Then all the captains of the forces, and Johanan the son of Kareah, and Jezaniah the son of Hoshaiah'
  - where: 'note 43:2 “They had promised to obey”'
    claim: 'To avoid their promise to obey, they call Jeremiah''s word an untruth suggested by Baruch (one reading)'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/43.htm'
    quote: 'To avoid any reference to the promise they had made to obey the will of God, they declare that Jeremiah''s prophecy is an untruth'
  - where: 'note 43:3 “Baruch the scribe”'
    claim: 'Baruch was Jeremiah''s scribe, taken to Egypt'
    key: bd-baruch
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/baruch?lang=eng'
    quote: 'Jeremiah’s scribe (Jer. 32:12–13; 36); taken to Egypt (43:2–6; 45).'
  - where: 'note 43:3 “Baruch the scribe”'
    claim: 'The fear of the Chaldeans came from Ishmael''s murder of Gedaliah, whom Babylon made governor'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/41?lang=eng'
    quote: 'for they were afraid of them, because Ishmael the son of Nethaniah had slain Gedaliah the son of Ahikam, whom the king of Babylon made governor in the land.'
  - where: 'note 43:3 “Baruch the scribe”'
    claim: 'Jeremiah had been viewed as a traitor and a subversive for advising surrender'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'Jeremiah’s counsel to surrender was not welcome. He was viewed as a traitor and a subversive.'
  - where: 'note 43:4 “Popularity is never a test of truth”'
    claim: 'Benson: the prophet will not necessarily be popular; popularity is never a test of truth'
    key: ttp-benson-11
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-of-presidents-of-the-church-ezra-taft-benson/chapter-11-follow-the-living-prophet?lang=eng'
    quote: 'The honest in heart heed his words but the unrighteous either ignore the prophet or fight him. … Popularity is never a test of truth. Many a prophet has been killed or cast out.'
  - where: 'note 43:4 “Popularity is never a test of truth”'
    claim: 'Benson: how we respond to the living prophet when he tells us what we would rather not hear is a test of faithfulness'
    key: ttp-benson-11
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-of-presidents-of-the-church-ezra-taft-benson/chapter-11-follow-the-living-prophet?lang=eng'
    quote: 'How we respond to the words of a living prophet when he tells us what we need to know, but would rather not hear, is a test of our faithfulness'
  - where: 'note 43:4 “Popularity is never a test of truth”'
    claim: 'Kimball: many garnish the sepulchres of yesterday''s prophets and mentally stone the living ones'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: '“Even in the Church,” said Elder Spencer W. Kimball, “many are prone to garnish the sepulchres of yesterday’s prophets and mentally stone the living ones”'
  - where: 'note 43:4 “Popularity is never a test of truth”'
    claim: 'Jeremiah ended up in prison and was compelled to live in Egypt'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'Eventually he was driven out of Israel and compelled to live in Egypt.'
  - where: 'note 43:6 “The king''s daughters and Jeremiah himself”'
    claim: 'Ishmael had carried off the king''s daughters from Mizpah, whom Nebuzar-adan had committed to Gedaliah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/41?lang=eng'
    quote: 'Then Ishmael carried away captive all the residue of the people that were in Mizpah, even the king’s daughters'
  - where: 'note 43:6 “The king''s daughters and Jeremiah himself”'
    claim: 'Johanan and the captains took the remnant, and Jeremiah and Baruch with them (Jer. 43:5–6)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/43?lang=eng'
    quote: 'took all the remnant of Judah, that were returned from all nations, whither they had been driven, to dwell in the land of Judah'
  - where: 'note 43:6 “The king''s daughters and Jeremiah himself”'
    claim: 'Egypt was the most viable refuge for Mulek, as for other Israelites then (a proposal, not stated in Jeremiah)'
    key: sc-knowhy-753
    url: 'https://scripturecentral.org/knowhy/how-did-mulek-get-to-the-new-world'
    quote: 'The most viable way to keep Mulek safe would have been to seek refuge in Egypt, just as other Israelites were doing at that time, including some of Zedekiah’s daughters (see Jeremiah 43:1–6).'
  - where: 'note 43:6 “The king''s daughters and Jeremiah himself”'
    claim: 'Mulek may have been taken to Egypt by the king''s retainers along with the king''s daughters (the work behind the KnoWhy''s suggestion)'
    key: sorenson-mulekites
    url: 'https://byustudies.byu.edu/article/the-mulekites'
    quote: 'Whatever his age, he may have been secreted away to Egypt by family retainers and close associates of the king along with “the king’s daughters” (Jer. 43:6–7).'
  - where: 'note 43:7 “Egypt, the refuge that was not”'
    claim: 'Tahpanhes was a frontier town of Egypt on the Pelusian branch of the Nile'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/43.htm'
    quote: 'Tahpanhes was a frontier town of Egypt on the Pelusian branch of the Nile'
  - where: 'note 43:7 “Egypt, the refuge that was not”'
    claim: 'The remnant chose Egypt to see no war, trumpet, or hunger (Jer. 42:14)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/42?lang=eng'
    quote: 'No; but we will go into the land of Egypt, where we shall see no war, nor hear the sound of the trumpet, nor have hunger of bread'
  - where: 'note 43:7 “Egypt, the refuge that was not”'
    claim: 'Jer. 46:14 calls on Tahpanhes to stand fast because the sword shall devour; 46:13 introduces it as Nebuchadrezzar coming to smite Egypt'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/46?lang=eng'
    quote: 'how Nebuchadrezzar king of Babylon should come and smite the land of Egypt. Declare ye in Egypt, and publish in Migdol, and publish in Noph and in Tahpanhes'
  - where: 'note 43:7 “Egypt, the refuge that was not”'
    claim: 'Judah''s rulers looked to Egypt for protection though Jeremiah warned again and again not to trust in Egypt'
    key: ot-manual-kings-g
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-g?lang=eng'
    quote: 'The political rulers looked to Egypt for protection and power against Babylon’s growing influence, even though Jeremiah had again and again warned Judah not to trust in Egypt for deliverance.'
  - where: 'note 43:9 “Stones in the clay”'
    claim: 'The Hebrew malben is brick-mould or quadrangle; Jer. 43:9 is the quadrangle occurrence at Tahpanhes'
    key: bdb
    url: 'https://biblehub.com/hebrew/4404.htm'
    quote: 'מַלְבֵּן  noun [masculine] 1 brick-mould; 2 quadrangle … 2 quadrangle, Jeremiah 43:9 (at Tahpanhes).'
  - where: 'note 43:10 “Nebuchadnezzar, my servant”'
    claim: 'The Lord had called Nebuchadrezzar "my servant" before (25:9; 27:6)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/25?lang=eng'
    quote: 'and Nebuchadrezzar the king of Babylon, my servant, and will bring them against this land'
  - where: 'note 43:10 “Nebuchadnezzar, my servant”'
    claim: 'Jer. 27:6 the Lord gave the lands to Nebuchadnezzar, my servant'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/27?lang=eng'
    quote: 'And now have I given all these lands into the hand of Nebuchadnezzar the king of Babylon, my servant'
  - where: 'note 43:10 “Nebuchadnezzar, my servant”'
    claim: 'Ezekiel says Egypt is given to Nebuchadrezzar as wages for Tyre because they wrought for the Lord'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/29?lang=eng'
    quote: 'Behold, I will give the land of Egypt unto Nebuchadrezzar king of Babylon; and he shall take her multitude, and take her spoil, and take her prey; and it shall be the wages for his army.'
  - where: 'note 43:10 “Nebuchadnezzar, my servant”'
    claim: 'Ezekiel 29:20 gives the reason'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/29?lang=eng'
    quote: 'I have given him the land of Egypt for his labour wherewith he served against it, because they wrought for me, saith the Lord God.'
  - where: 'note 43:10 “His throne and his pavilion”'
    claim: 'The Hebrew for royal pavilion is a doubtful word for a brightly coloured pavilion, canopy, or carpet; Jer. 43:10 is its only occurrence'
    key: bdb
    url: 'https://biblehub.com/hebrew/8237.htm'
    quote: 'apparently of (brightly-coloured ?) royal pavilion, canopy, or possibly carpet, suffix נָטָה שׁפרורו Jeremiah 43:10'
  - where: 'note 43:11 “Death, captivity, the sword”'
    claim: 'Jer. 15:2 uses the same fourfold formula: death, sword, famine, captivity'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/15?lang=eng'
    quote: 'Such as are for death, to death; and such as are for the sword, to the sword; and such as are for the famine, to the famine; and such as are for the captivity, to the captivity.'
  - where: 'note 43:11 “Death, captivity, the sword”'
    claim: 'Jer. 42:17 had said the men who go to Egypt shall die by sword, famine, and pestilence'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/42?lang=eng'
    quote: 'they shall die by the sword, by the famine, and by the pestilence: and none of them shall remain or escape from the evil that I will bring upon them.'
  - where: 'note 43:11 “Death, captivity, the sword”'
    claim: 'Keil cites Jer. 15:2 as parallel mode of representation; each man receives appointed lot'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/43.htm'
    quote: 'so that every man will receive his appointed lot'
  - where: 'note 43:11 “Death, captivity, the sword”'
    claim: 'Jer. 44:30 names Pharaoh-hophra, to be given to his enemies as Zedekiah was'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/44?lang=eng'
    quote: 'Behold, I will give Pharaoh-hophra king of Egypt into the hand of his enemies'
  - where: 'note 43:11 “Death, captivity, the sword”'
    claim: 'Whether Nebuchadnezzar conquered Egypt is disputed; Keil argues for it from Berosus (as reported by Josephus) while noting the proof for a campaign is lacking'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/43.htm'
    quote: 'The difficulty in the way of proving that such a campaign actually took place'
  - where: 'note 43:11 “Death, captivity, the sword”'
    claim: 'Keil: Nebuchadnezzar''s conquest of Egypt is denied by some modern historians but vouched for by Berosus'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/43.htm'
    quote: 'the conquest of Egypt by Nebuchadnezzar, which is denied by Hitzig and Graf as well as Duncker'
  - where: 'note 43:12 “Judgment on the gods of Egypt”'
    claim: 'Ex. 12:12: the Lord executes judgment against all the gods of Egypt'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/12?lang=eng'
    quote: 'and against all the gods of Egypt I will execute judgment: I am the Lord.'
  - where: 'note 43:12 “Judgment on the gods of Egypt”'
    claim: 'Isa. 19:1: the Lord comes into Egypt and the idols of Egypt shall be moved'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/19?lang=eng'
    quote: 'the idols of Egypt shall be moved at his presence, and the heart of Egypt shall melt in the midst of it.'
  - where: 'note 43:12 “Judgment on the gods of Egypt”'
    claim: 'Jer. 46:25 the Lord punishes Egypt with their gods'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/46?lang=eng'
    quote: 'I will punish the multitude of No, and Pharaoh, and Egypt, with their gods, and their kings'
  - where: 'note 43:12 “Judgment on the gods of Egypt”'
    claim: 'The shepherd putting on his cloak: the ease with which he takes Egypt (Ewald via Keil)'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/43.htm'
    quote: 'As easily as any shepherd in the open field wraps himself in his cloak, so will he take the whole of Egypt in his hand'
  - where: 'note 43:13 “Beth-shemesh in Egypt”'
    claim: 'Beth-shemesh means house of the sun; in Jer. 43:13 it is On, or Heliopolis'
    key: bd-beth-shemesh
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/beth-shemesh?lang=eng'
    quote: 'For On, or Heliopolis, see Jer. 43:13'
  - where: 'note 43:13 “Beth-shemesh in Egypt”'
    claim: 'The name Beth-shemesh means house of the sun'
    key: bd-beth-shemesh
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/beth-shemesh?lang=eng'
    quote: 'House of the sun.'
  - where: 'note 43:13 “Beth-shemesh in Egypt”'
    claim: 'matstsebah means pillar; in Jer. 43:13 the obelisks of Heliopolis'
    key: bdb
    url: 'https://biblehub.com/hebrew/4676.htm'
    quote: 'of obelisks of Heliopolis in Egypt'
  - where: 'section 3 plain'
    claim: 'The images of Beth-shemesh are its pillars; Beth-shemesh is the house of the sun (On, Heliopolis)'
    key: bdb
    url: 'https://biblehub.com/hebrew/4676.htm'
    quote: 'noun feminine pillar'
  - where: 'section 3 plain'
    claim: 'malben at Tahpanhes is a quadrangle (rendered brickwork)'
    key: bdb
    url: 'https://biblehub.com/hebrew/4404.htm'
    quote: '2 quadrangle, Jeremiah 43:9 (at Tahpanhes).'
  - where: 'christ'
    claim: 'Jeremiah 42:11 "I am with you to save you, and to deliver you from his hand"'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/42?lang=eng'
    quote: 'Be not afraid of the king of Babylon, of whom ye are afraid; be not afraid of him, saith the Lord: for I am with you to save you, and to deliver you from his hand.'
