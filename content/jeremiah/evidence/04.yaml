chapter: 4
claims:
  - where: 'when'
    claim: 'Chapters 1–6 fall in the reign of Josiah (626–608 B.C.) in the Bible Dictionary outline'
    key: bd-jeremiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng'
    quote: 'Prophecies of reign of Josiah (626–608), Jer. 1–6.'
  - where: 'setting'
    claim: 'The Church chapter heading: Israel and Judah are called to repentance; Jeremiah laments for the miseries of Judah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/4?lang=eng'
    quote: 'Israel and Judah are called to repentance—Jeremiah laments for the miseries of Judah.'
  - where: 'setting'
    claim: 'Chapter 3 promises that Israel need only turn back to the Lord to be reclaimed'
    key: ot-manual-23
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng'
    quote: 'The Lord reminded Israel that He is merciful and that all they need do to be reclaimed is to turn back to Him.'
  - where: 'setting'
    claim: 'Chapters 2–3 picture the covenant as a marriage broken by idolatry'
    key: ot-manual-23
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng'
    quote: 'Jeremiah continued the marriage symbolism he began in Jeremiah 2:32'
  - where: 'setting'
    claim: 'The manual treats Jeremiah 4:5–31 as a series of figurative images foretelling the catastrophe about to befall Judah'
    key: ot-manual-23
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng'
    quote: 'The Lord used various figurative images in Jeremiah 4:5–31 to foretell the catastrophe that was about to befall Judah.'
  - where: 'note 4:2 “If Israel returns, the nations bless themselves”'
    claim: 'The Hebrew verb for “bless themselves” is the reflexive stem BDB lists for Gen. 22:18 and for Jer. 4:2'
    key: bdb
    url: 'https://biblehub.com/hebrew/1288.htm'
    quote: 'invoke for oneself the blessing of the see of Abraham) Genesis 22:18; Genesis 26:4 (J)'
  - where: 'note 4:2 “If Israel returns, the nations bless themselves”'
    claim: 'BDB lists Jer. 4:2 under the same sense: to bless oneself by the LORD'
    key: bdb
    url: 'https://biblehub.com/hebrew/1288.htm'
    quote: 'by ׳י Jeremiah 4:2'
  - where: 'note 4:2 “If Israel returns, the nations bless themselves”'
    claim: 'God''s promise to Abraham: in his seed all nations of the earth shall be blessed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/22?lang=eng'
    quote: 'And in thy seed shall all the nations of the earth be blessed; because thou hast obeyed my voice.'
  - where: 'note 4:2 “If Israel returns, the nations bless themselves”'
    claim: 'The Lord''s offer in chapter 3 is that Israel need only turn back to Him'
    key: ot-manual-23
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng'
    quote: 'all they need do to be reclaimed is to turn back to Him'
  - where: 'note 4:3 “Fallow ground and thorns”'
    claim: 'The Church edition cross-references Hosea 10:12 at verse 3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/4?lang=eng'
    quote: 'Hosea 10:12.'
  - where: 'note 4:3 “Fallow ground and thorns”'
    claim: 'Hosea 10:12 uses “break up your fallow ground” of seeking the Lord'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/10?lang=eng'
    quote: 'Sow to yourselves in righteousness, reap in mercy; break up your fallow ground: for it is time to seek the Lord'
  - where: 'note 4:3 “Fallow ground and thorns”'
    claim: 'The Church edition cross-references the parable of the sower (Matt. 13:7) at the thorns'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/4?lang=eng'
    quote: 'Matt. 13:7.'
  - where: 'note 4:3 “Fallow ground and thorns”'
    claim: 'The plowing of new ground is a figure for reforming one''s life; the thorns are the evil inclinations of the unrenewed heart (one reading)'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/4.htm'
    quote: 'plough up new land, to bring new untilled soil under cultivation - a figure for the reformation of life'
  - where: 'note 4:3 “Fallow ground and thorns”'
    claim: 'The thorns are the evil inclinations of the unrenewed heart (one reading)'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/4.htm'
    quote: 'but the evil inclinations of the unrenewed heart, which thrive luxuriantly like thorns'
  - where: 'note 4:4 “Circumcision of the heart”'
    claim: 'Circumcision was a token of the covenant given to Abraham; true circumcision after accountability is of the heart'
    key: ot-manual-23
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng'
    quote: 'the true circumcision after a person is accountable is that of the heart (see Deuteronomy 10:16; 30:6; Jeremiah 9:25–26; Romans 2:25–29)'
  - where: 'note 4:4 “Circumcision of the heart”'
    claim: 'One must accept the covenant in his heart and become sinless through faith, repentance, and baptism'
    key: ot-manual-23
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng'
    quote: 'One must accept the covenant in his heart and become sinless through faith, repentance, and baptism.'
  - where: 'note 4:4 “Circumcision of the heart”'
    claim: 'Circumcision of infants marked them as covenant heirs; JST Genesis 17 says they are pure until accountable at eight'
    key: sc-knowhy-872
    url: 'https://scripturecentral.org/knowhy/why-does-jeremiah-refer-to-circumcising-the-heart'
    quote: 'They would only need to become purified from sin through “the burial, or baptism” when they became accountable at eight years old and needed to repent (JST Genesis 17:4–6, 10–11).'
  - where: 'note 4:4 “Circumcision of the heart”'
    claim: 'The foreskin became a metaphor for being covered from or insensitive to spiritual things'
    key: sc-knowhy-872
    url: 'https://scripturecentral.org/knowhy/why-does-jeremiah-refer-to-circumcising-the-heart'
    quote: 'it became a metaphor for being covered from or insensitive to spiritual things generally (see, for example, Jeremiah 6:10, Exodus 6:12, 30).'
  - where: 'note 4:4 “Circumcision of the heart”'
    claim: 'Circumcising the heart means removing any barrier between us and God, internalizing the covenant, and humbling oneself like a child'
    key: sc-knowhy-872
    url: 'https://scripturecentral.org/knowhy/why-does-jeremiah-refer-to-circumcising-the-heart'
    quote: 'circumcising the heart suggests the general idea of removing any barrier between us and God, opening the heart to the influence of the divine.'
  - where: 'note 4:4 “Circumcision of the heart”'
    claim: 'Deut. 10:16 commands the circumcision of the heart'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/10?lang=eng'
    quote: 'Circumcise therefore the foreskin of your heart, and be no more stiffnecked.'
  - where: 'note 4:4 “Circumcision of the heart”'
    claim: 'Deut. 30:6 says the Lord Himself will circumcise the heart'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/30?lang=eng'
    quote: 'And the Lord thy God will circumcise thine heart, and the heart of thy seed, to love the Lord thy God with all thine heart'
  - where: 'note 4:6 “A standard toward Zion”'
    claim: 'An ensign is a flag or standard that served as a rallying point for soldiers in battle'
    key: gs-ensign
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/ensign?lang=eng'
    quote: 'In ancient times an ensign served as a rallying point for soldiers in battle.'
  - where: 'note 4:6 “A standard toward Zion”'
    claim: 'Zion is also a geographical place: Solomon built his temple on Mount Zion'
    key: bd-zion
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zion?lang=eng'
    quote: 'Solomon built his temple on Mount Zion (1 Kgs. 8:1; see also 2 Sam. 5:6–7)'
  - where: 'note 4:6 “A standard toward Zion”'
    claim: '1 Kgs. 8:1 equates the city of David with Zion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/8?lang=eng'
    quote: 'out of the city of David, which is Zion'
  - where: 'note 4:6 “A standard toward Zion”'
    claim: 'The Church edition links “evil from the north” to Jer. 1:14'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/4?lang=eng'
    quote: 'Jer. 1:14 (13–14); 6:1; 10:22.'
  - where: 'note 4:6 “A standard toward Zion”'
    claim: 'Jer. 1:14: out of the north an evil shall break forth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/1?lang=eng'
    quote: 'Out of the north an evil shall break forth upon all the inhabitants of the land.'
  - where: 'note 4:7 “The lion and the destroyer of nations”'
    claim: 'The lion is Babylon, coming out of its thicket to hunt'
    key: ot-manual-23
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng'
    quote: 'the lion, Babylon, was about to come out of the thicket where it stayed hidden until it sallied forth on the hunt.'
  - where: 'note 4:7 “The lion and the destroyer of nations”'
    claim: 'The Hebrew goy means nation, people (later Gentiles)'
    key: bdb
    url: 'https://biblehub.com/hebrew/1471.htm'
    quote: 'nation, people (Late Hebrew id. Gentiles'
  - where: 'note 4:10 “Jeremiah’s cry of dismay at the promised peace”'
    claim: 'After Josiah''s death Jeremiah tried, almost alone, to stem this self-deception'
    key: bd-jeremiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng'
    quote: 'After Josiah’s death he tried to stem, almost alone, the tide of idolatry and immorality, of self-deception founded on superficial reforms'
  - where: 'note 4:10 “Jeremiah’s cry of dismay at the promised peace”'
    claim: 'Jer. 14:13: the same exclamation, followed by the prophets promising assured peace'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/14?lang=eng'
    quote: 'Then said I, Ah, Lord God! behold, the prophets say unto them, Ye shall not see the sword, neither shall ye have famine; but I will give you assured peace in this place.'
  - where: 'note 4:10 “Jeremiah’s cry of dismay at the promised peace”'
    claim: 'Jer. 14:14: the Lord answers that He did not send those prophets'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/14?lang=eng'
    quote: 'The prophets prophesy lies in my name: I sent them not, neither have I commanded them, neither spake unto them'
  - where: 'note 4:10 “Jeremiah’s cry of dismay at the promised peace”'
    claim: 'Jer. 23:17: the prophets say “Ye shall have peace”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/23?lang=eng'
    quote: 'The Lord hath said, Ye shall have peace; and they say unto every one that walketh after the imagination of his own heart, No evil shall come upon you.'
  - where: 'note 4:10 “Jeremiah’s cry of dismay at the promised peace”'
    claim: 'Jeremiah faced a self-deception founded on superficial reforms and fanatical confidence in the Lord''s protection'
    key: bd-jeremiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng'
    quote: 'self-deception founded on superficial reforms (Jer. 3:4–5; 7:8–10), and of fanatical confidence in the Lord’s protection'
  - where: 'note 4:11 “The dry wind, the clouds, and the whirlwind”'
    claim: 'The dry wind is the scorching desert wind, not the gentle winnowing breeze'
    key: ot-manual-23
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng'
    quote: 'This wind was not the gentle breeze used to fan away the chaff while winnowing grain, but a full, hard wind (see v. 13).'
  - where: 'note 4:11 “The dry wind, the clouds, and the whirlwind”'
    claim: 'The scorching desert winds sucked moisture from plants, animals, and people'
    key: ot-manual-23
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng'
    quote: 'The scorching desert winds were devastating in the Holy Land if they blew very long or hard, for they sucked the moisture from plants, animals, and people with terrible effect.'
  - where: 'note 4:11 “The dry wind, the clouds, and the whirlwind”'
    claim: 'Babylon''s troops are the clouds and the whirlwind'
    key: ot-manual-23
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng'
    quote: 'Babylon’s troops would be like a huge thundercloud covering the sky, and its effect would be that of a tornado.'
  - where: 'note 4:15 “Dan and mount Ephraim”'
    claim: 'Dan marks the northern boundary of Palestine; Mount Ephraim the northern boundary of Judah, near Jerusalem; the alarm draws nearer'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/4.htm'
    quote: '"From Dan," i.e., the northern boundary of Palestine'
  - where: 'note 4:15 “Dan and mount Ephraim”'
    claim: 'Mount Ephraim is the northern boundary of Judah, not far from Jerusalem; the alarm and calamity draw ever nearer'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/4.htm'
    quote: '"From Mount Ephraim," i.e., the northern boundary of the kingdom of Judah, not far distant from Jerusalem. The alarm and the calamity draw ever nearer.'
  - where: 'note 4:19 “My bowels, my bowels”'
    claim: 'The Church edition links verse 19 to Lam. 1:20'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/4?lang=eng'
    quote: 'Lam. 1:20.'
  - where: 'note 4:19 “My bowels, my bowels”'
    claim: 'Lam. 1:20 has the same cry: bowels troubled, heart turned within'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lam/1?lang=eng'
    quote: 'Behold, O Lord; for I am in distress: my bowels are troubled; mine heart is turned within me'
  - where: 'note 4:19 “My bowels, my bowels”'
    claim: 'Lamentations is dirges over the fall of Jerusalem, written by Jeremiah'
    key: bd-lamentations
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/lamentations-book-of?lang=eng'
    quote: 'Or, Dirges over the fall of Jerusalem and the nation. Written by Jeremiah.'
  - where: 'note 4:22 “Not knowing the Lord”'
    claim: 'The Church edition links verse 22 to Mosiah 5:13 and Helaman 12:4'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/4?lang=eng'
    quote: 'Mosiah 5:13.'
  - where: 'note 4:22 “Not knowing the Lord”'
    claim: 'Helaman 12:4 is the other cross-reference at verse 22'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/4?lang=eng'
    quote: 'Hel. 12:4 (1–7).'
  - where: 'note 4:22 “Not knowing the Lord”'
    claim: 'Mosiah 5:13 (King Benjamin): a man cannot know a master he has not served'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/5?lang=eng'
    quote: 'For how knoweth a man the master whom he has not served, and who is a stranger unto him, and is far from the thoughts and intents of his heart?'
  - where: 'note 4:22 “Not knowing the Lord”'
    claim: 'Helaman 12:4: quick to do iniquity and slow to do good'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/hel/12?lang=eng'
    quote: 'how quick to do iniquity, and how slow to do good, are the children of men'
  - where: 'note 4:22 “Not knowing the Lord”'
    claim: 'Helaman 12 chapter heading: men are unstable and foolish and quick to do evil'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/hel/12?lang=eng'
    quote: 'Men are unstable and foolish and quick to do evil'
  - where: 'note 4:23 “Creation undone”'
    claim: 'Hebrew tohu: BDB lists Gen. 1:2 (primeval earth) and Jer. 4:23 (land reduced to primeval chaos)'
    key: bdb
    url: 'https://biblehub.com/hebrew/8414.htm'
    quote: 'of land reduced to primaeval chaos Jeremiah 4:23'
  - where: 'note 4:23 “Creation undone”'
    claim: 'The Church edition offers “empty and desolate” as the alternative rendering and cross-references Moses 2:2'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/4?lang=eng'
    quote: 'OR empty and desolate.'
  - where: 'note 4:23 “Creation undone”'
    claim: 'Moses 2:2 has the same words'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/2?lang=eng'
    quote: 'And the earth was without form, and void; and I caused darkness to come up upon the face of the deep'
  - where: 'note 4:23 “Creation undone”'
    claim: 'Abraham 4:2 renders the same state “empty and desolate”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/4?lang=eng'
    quote: 'And the earth, after it was formed, was empty and desolate'
  - where: 'note 4:23 “Creation undone”'
    claim: 'The destruction would be as if the Creation had been undone'
    key: ot-manual-23
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng'
    quote: 'So great would be the destruction that it would be as if the Creation had been undone.'
  - where: 'note 4:27 “Not a full end”'
    claim: 'The Lord promised in Leviticus 26 not to destroy Israel utterly or break the covenant'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/26?lang=eng'
    quote: 'I will not cast them away, neither will I abhor them, to destroy them utterly, and to break my covenant with them'
  - where: 'note 4:27 “Not a full end”'
    claim: 'Lehi foretold that after Jerusalem was destroyed and many carried captive to Babylon they would return'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/10?lang=eng'
    quote: 'they should return again, yea, even be brought back out of captivity; and after they should be brought back out of captivity they should possess again the land of their inheritance.'
  - where: 'note 4:27 “Not a full end”'
    claim: 'The Church edition notes the Hebrew behind “repent” in verse 28 is “relent”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/4?lang=eng'
    quote: 'HEB relent.'
  - where: 'note 4:30 “Crimson and gold”'
    claim: 'Judah is pictured as a rejected harlot seeking help from her false gods'
    key: ot-manual-23
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng'
    quote: 'In her extremity, like a harlot rejected by her former lovers, Judah would seek for help from her false gods in an ever more desperate search for relief, but she would find none.'
  - where: 'note 4:30 “Crimson and gold”'
    claim: 'The Church edition footnotes: Hebrew “sensuous lovers”; “enlargest thine eyes”; Hosea 2:13'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/4?lang=eng'
    quote: 'HEB sensuous lovers.'
  - where: 'note 4:30 “Crimson and gold”'
    claim: 'The Church edition''s alternative rendering of “rentest thy face with painting”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/4?lang=eng'
    quote: 'OR enlargest thine eyes.'
  - where: 'note 4:30 “Crimson and gold”'
    claim: 'The marriage image continues from chapter 3: Israel played the harlot with other gods'
    key: ot-manual-23
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng'
    quote: 'Jeremiah continued the marriage symbolism he began in Jeremiah 2:32'
  - where: 'note 4:31 “A woman in travail”'
    claim: 'The Church edition links verse 31 to Lam. 1:17'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/4?lang=eng'
    quote: 'Lam. 1:17.'
  - where: 'note 4:31 “A woman in travail”'
    claim: 'Lam. 1:17: Zion spreadeth forth her hands, and there is none to comfort her'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lam/1?lang=eng'
    quote: 'Zion spreadeth forth her hands, and there is none to comfort her'
  - where: 'christ'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: 'christ'
    claim: 'King Benjamin''s people: the Spirit wrought a mighty change in their hearts; no more disposition to do evil'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/5?lang=eng'
    quote: 'the Spirit of the Lord Omnipotent, which has wrought a mighty change in us, or in our hearts, that we have no more disposition to do evil, but to do good continually.'
  - where: 'christ'
    claim: 'Benjamin: through faith on his name, hearts are changed and the people become the children of Christ'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/5?lang=eng'
    quote: 'ye say that your hearts are changed through faith on his name; therefore, ye are born of him and have become his sons and his daughters.'
  - where: 'explore'
    claim: 'Lehi''s prophecy of Jerusalem''s destruction and return (1 Ne. 10:3)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/10?lang=eng'
    quote: 'after they should be destroyed, even that great city Jerusalem, and many be carried away captive into Babylon'
  - where: 'note 4:4 “Circumcision of the heart”'
    claim: 'Circumcision marked the infant as pure and an heir of the covenant lineage'
    key: sc-knowhy-872
    url: 'https://scripturecentral.org/knowhy/why-does-jeremiah-refer-to-circumcising-the-heart'
    quote: 'marking the infant as already pure and an heir of a covenant lineage that would bear a royal priesthood'
  - where: 'note 4:4 “Circumcision of the heart”'
    claim: 'The Israelites of Jeremiah''s day had the mark of purity but lacked the spiritual receptivity to match it'
    key: sc-knowhy-872
    url: 'https://scripturecentral.org/knowhy/why-does-jeremiah-refer-to-circumcising-the-heart'
    quote: 'the Israelites in his day may have had this physical mark of purity and of a priestly class, but they now lacked the spiritual receptivity to match it.'
  - where: 'note 4:4 “Circumcision of the heart”'
    claim: 'Circumcising the heart as taking the covenant inward and humbling oneself like a child'
    key: sc-knowhy-872
    url: 'https://scripturecentral.org/knowhy/why-does-jeremiah-refer-to-circumcising-the-heart'
    quote: 'a call for all people to open their hearts to God, embrace God’s covenant, and to humble and purify themselves like a little child.'
  - where: 'note 4:19 “My bowels, my bowels”'
    claim: 'For the Hebrews the bowels are the seat of the deepest feelings; the cry is of sore pain'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/4.htm'
    quote: '"My bowels, my bowels!" is the cry of sore pain, for with the Hebrews the bowels are the seat of the deepest feelings.'
  - where: 'note 4:31 “A woman in travail”'
    claim: 'The daughter of Zion is a poetic personification of Jerusalem'
    key: sc-knowhy-550
    url: 'https://scripturecentral.org/knowhy/why-does-isaiah-prophesy-of-the-daughter-of-zion'
