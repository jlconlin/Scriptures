chapter: 34
claims:
  - where: 'setting'
    claim: 'The Church chapter heading: Jeremiah prophesies the captivity of Zedekiah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/34?lang=eng'
    quote: 'Jeremiah prophesies the captivity of Zedekiah—The people of Judah will be removed into all the kingdoms of the earth.'
  - where: 'when'
    claim: 'Zedekiah reigned 597–586 B.C.; chapters 34–38 are narratives of the last times of the siege'
    key: bd-jeremiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng'
    quote: 'Prophecies under Zedekiah (597–586), Jer. 21–38'
  - where: 'setting'
    claim: 'Chapters 34–38 are narratives of the prophet and events in the last times of the siege'
    key: bd-jeremiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng'
    quote: '(d) Jer. 34–38, narratives of the treatment of the prophet and other events during the last times of the siege.'
  - where: 'note 34:1 “A siege with a pause in it”'
    claim: 'The siege began in Zedekiah’s ninth year, tenth month (the KJV spells the king Nebuchadrezzar here)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/39?lang=eng'
    quote: 'In the ninth year of Zedekiah king of Judah, in the tenth month, came Nebuchadrezzar king of Babylon and all his army against Jerusalem, and they besieged it.'
  - where: 'note 34:1 “A siege with a pause in it”'
    claim: 'Zedekiah sought Egypt’s support in rebellion against Babylon'
    key: ot-manual-kings-g
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-g?lang=eng'
    quote: 'a growing patriotic feeling among the people brought Zedekiah to seek the support of Egypt in rebellion against the power of the north.'
  - where: 'note 34:1 “A siege with a pause in it”'
    claim: 'Pharaoh’s army came out and the Chaldeans left Jerusalem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/37?lang=eng'
    quote: 'Then Pharaoh’s army was come forth out of Egypt: and when the Chaldeans that besieged Jerusalem heard tidings of them, they departed from Jerusalem.'
  - where: 'note 34:2 “A message Zedekiah heard more than once”'
    claim: 'Zedekiah had shut Jeremiah up for prophesying that Jerusalem would be given to Babylon and Zedekiah taken'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/32?lang=eng'
    quote: 'For Zedekiah king of Judah had shut him up, saying, Wherefore dost thou prophesy, and say, Thus saith the Lord, Behold, I will give this city into the hand of the king of Babylon, and he shall take it;'
  - where: 'note 34:2 “A message Zedekiah heard more than once”'
    claim: 'The Church edition footnote to verse 2 sends the reader to Jer. 21:10; 38:3; 52:13'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/34?lang=eng'
    quote: 'Jer. 21:10; 38:3; 52:13.'
  - where: 'note 34:2 “A message Zedekiah heard more than once”'
    claim: 'Zedekiah was weak and vacillating; he called Jeremiah secretly yet yielded to the leaders who wanted him dead'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'The weak, vacillating character of King Zedekiah manifested itself. He called Jeremiah to him secretly, asking if there was any word from the Lord concerning Jerusalem’s fate'
  - where: 'note 34:2 “A message Zedekiah heard more than once”'
    claim: 'Zedekiah was the last king of Judah; his name was changed from Mattaniah'
    key: bd-zedekiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zedekiah?lang=eng'
    quote: 'The last king of Judah, his name changed from Mattaniah to Zedekiah'
  - where: 'note 34:3 “Eyes to eyes”'
    claim: 'At Riblah Nebuchadnezzar gave judgment on Zedekiah, then killed his sons before his eyes and put out his eyes'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/39?lang=eng'
    quote: 'they brought him up to Nebuchadnezzar king of Babylon to Riblah in the land of Hamath, where he gave judgment upon him.'
  - where: 'note 34:3 “Eyes to eyes”'
    claim: 'The sons were slain before his eyes, then his eyes put out, and he was carried to Babylon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/25?lang=eng'
    quote: 'And they slew the sons of Zedekiah before his eyes, and put out the eyes of Zedekiah, and bound him with fetters of brass, and carried him to Babylon.'
  - where: 'note 34:3 “Eyes to eyes”'
    claim: 'Ezekiel says Zedekiah would be brought to Babylon yet not see it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/12?lang=eng'
    quote: 'I will bring him to Babylon to the land of the Chaldeans; yet shall he not see it, though he shall die there.'
  - where: 'note 34:5 “Die in peace”'
    claim: 'Jeremiah 52 says he was kept in prison until the day of his death'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/52?lang=eng'
    quote: 'put him in prison till the day of his death.'
  - where: 'note 34:5 “Die in peace”'
    claim: 'One reading: death by sickness not execution, and imprisonment need not rule out honorable burial'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/34.htm'
    quote: 'Although Zedekiah died a prisoner in Babylon (Jeremiah 52:11), yet his imprisonment would not necessarily be an obstacle in the way of an honourable burial after the fashion of his fathers.'
  - where: 'note 34:5 “Die in peace”'
    claim: 'Keil sets aside the reading that the verses state a condition (if Zedekiah surrendered)'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/34.htm'
    quote: 'This view rests on the hypothesis that the divine message has for its object to induce the king to submit and give up himself'
  - where: 'note 34:5 “Die in peace”'
    claim: 'In chapter 38 Jeremiah states an explicit condition: if Zedekiah goes out to Babylon’s princes he lives and the city is not burned'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/38?lang=eng'
    quote: 'If thou wilt assuredly go forth unto the king of Babylon’s princes, then thy soul shall live, and this city shall not be burned with fire'
  - where: 'note 34:5 “Die in peace”'
    claim: 'Zedekiah feared the Jews who had fallen to the Chaldeans'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/38?lang=eng'
    quote: 'And Zedekiah the king said unto Jeremiah, I am afraid of the Jews that are fallen to the Chaldeans'
  - where: 'note 34:5 “Burnings for a king”'
    claim: 'Asa was given a very great burning with spices'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/16?lang=eng'
    quote: 'laid him in the bed which was filled with sweet odours and divers kinds of spices prepared by the apothecaries’ art: and they made a very great burning for him.'
  - where: 'note 34:5 “Burnings for a king”'
    claim: 'Jehoiakim was denied lament and honorable burial'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/22?lang=eng'
    quote: 'they shall not lament for him, saying, Ah lord! or, Ah his glory! … He shall be buried with the burial of an ass'
  - where: 'note 34:5 “Burnings for a king”'
    claim: 'The burnings are of aromatic spices, not corpses'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/34.htm'
    quote: 'of the burning of aromatic spices in honour of the dead; for the burning of corpses was not customary among the Hebrews'
  - where: 'note 34:7 “Lachish and Azekah”'
    claim: 'Lachish: a city of Judah fortified by Rehoboam'
    key: bd-lachish
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/lachish?lang=eng'
    quote: 'afterwards included in Judah (15:39); fortified by Rehoboam (2 Chr. 11:9)'
  - where: 'note 34:7 “Lachish and Azekah”'
    claim: 'Azekah: city in the valley of Elah; Lachish letters mention it'
    key: bd-azekah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/azekah?lang=eng'
    quote: 'A city of Judah in the valley of Elah, near Lachish and Gath.'
  - where: 'note 34:7 “Lachish and Azekah”'
    claim: 'The Lachish letters, written in ink on pottery, mention Azekah and were written nearby'
    key: bd-azekah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/azekah?lang=eng'
    quote: 'The Lachish letters in ink on broken bits of pottery also mention Azekah and were written nearby.'
  - where: 'note 34:8 “Liberty”'
    claim: 'The Hebrew word for liberty is deror; Lev. 25:10 uses it of the Jubilee; BDB says Jer. 34:8, 15, 17 refer to the liberty of the Sabbatical year'
    key: bdb
    url: 'https://biblehub.com/hebrew/1865.htm'
    quote: 'with קרא proclaim liberty, וּקְרָאתֶם דְּרוֺר בָּאָרֶץ לְכָליֿשְׁבֶ֑יהָ Leviticus 25:10 (H) in Jubilee year, compare Isaiah 61:1'
  - where: 'note 34:8 “Liberty”'
    claim: 'BDB notes Jer. 34:8, 15, 17 refer to the Sabbatical year and 34:17 is ironic'
    key: bdb
    url: 'https://biblehub.com/hebrew/1865.htm'
    quote: 'Jeremiah 34:8,15,17 all reference to liberty of Sabbatical year; Jeremiah 34:17 (iron.) lo ! I proclaim to you liberty unto the sword'
  - where: 'note 34:8 “Liberty”'
    claim: 'Jubilee text: proclaim liberty throughout the land'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/25?lang=eng'
    quote: 'And ye shall hallow the fiftieth year, and proclaim liberty throughout all the land unto all the inhabitants thereof'
  - where: 'note 34:14 “The law of release”'
    claim: 'Exodus: Hebrew servant serves six years, free in the seventh'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/21?lang=eng'
    quote: 'If thou buy an Hebrew servant, six years he shall serve: and in the seventh he shall go out free for nothing.'
  - where: 'note 34:14 “The law of release”'
    claim: 'Deuteronomy: the release applies to a Hebrew man or woman'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/15?lang=eng'
    quote: 'And if thy brother, an Hebrew man, or an Hebrew woman, be sold unto thee, and serve thee six years; then in the seventh year thou shalt let him go free from thee.'
  - where: 'note 34:14 “The law of release”'
    claim: 'Deuteronomy grounds the release in Israel’s own redemption from Egypt'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/15?lang=eng'
    quote: 'And thou shalt remember that thou wast a bondman in the land of Egypt, and the Lord thy God redeemed thee: therefore I command thee this thing to day.'
  - where: 'note 34:14 “The law of release”'
    claim: 'The Church edition footnote on verse 14 points to Sabbatical Year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/34?lang=eng'
    quote: 'TG Sabbatical Year.'
  - where: 'note 34:11 “Why they took them back”'
    claim: 'The release may have been partly from the law and partly from need of manpower (the manual quotes Sidney B. Sperry, The Voice of Israel’s Prophets, 182–83, hence “one scholar’s reconstruction”)'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'This may have been done partly because the old law required the release of slaves as provided for in Exo. 21:1 and Deut. 15:2, and partly because of the need of manpower to defend the besieged city.'
  - where: 'note 34:11 “Why they took them back”'
    claim: 'Then the Egyptians’ advance lifted the siege and the people re-enslaved'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'Then the advance of the Egyptians seems to have caused the Babylonians to lift the siege. In spite of their solemn oath'
  - where: 'note 34:11 “Why they took them back”'
    claim: 'The Lord told Zedekiah that Pharaoh’s army would return to Egypt and the Chaldeans would come again'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/37?lang=eng'
    quote: 'And the Chaldeans shall come again, and fight against this city, and take it, and burn it with fire.'
  - where: 'note 34:11 “Why they took them back”'
    claim: 'Footnote glosses on verses 9 and 11'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/34?lang=eng'
    quote: 'OR enslave them.'
  - where: 'note 34:11 “Why they took them back”'
    claim: 'Footnote on verse 11 “turned”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/34?lang=eng'
    quote: 'IE turned back on their word.'
  - where: 'note 34:16 “Polluted my name”'
    claim: 'Footnote: the Hebrew behind polluted is profaned'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/34?lang=eng'
    quote: 'HEB profaned.'
  - where: 'note 34:16 “Polluted my name”'
    claim: 'Zedekiah rebelled against Nebuchadnezzar, who had made him swear by God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/36?lang=eng'
    quote: 'And he also rebelled against king Nebuchadnezzar, who had made him swear by God: but he stiffened his neck, and hardened his heart from turning unto the Lord God of Israel.'
  - where: 'note 34:17 “Liberty to the sword”'
    claim: 'The Lord uses the same word for liberty ironically'
    key: bdb
    url: 'https://biblehub.com/hebrew/1865.htm'
    quote: 'Jeremiah 34:17 (iron.) lo ! I proclaim to you liberty unto the sword'
  - where: 'note 34:18 “Between the pieces”'
    claim: 'Abram cut the animals in half and laid the pieces opposite each other; a smoking furnace and burning lamp passed between them; the Lord made a covenant that day'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/15?lang=eng'
    quote: 'And he took unto him all these, and divided them in the midst, and laid each piece one against another: but the birds divided he not.'
  - where: 'note 34:18 “Between the pieces”'
    claim: 'The Lord passed between the pieces in Gen. 15'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/15?lang=eng'
    quote: 'behold a smoking furnace, and a burning lamp that passed between those pieces.'
  - where: 'note 34:18 “Between the pieces”'
    claim: 'The Church edition footnotes verse 18 to Gen. 15:10 and verse 19 to Gen. 15:17'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/34?lang=eng'
    quote: 'Gen. 15:10.'
  - where: 'note 34:18 “Between the pieces”'
    claim: 'The calf rite is an ancient covenant custom and explains the phrase cut a covenant; its meaning may be deeper than a self-curse'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/34.htm'
    quote: 'We cannot with certainty infer, from the threatening pronounced in this passage, that this rite originally signified nothing more than that he who broke his promise would be treated like the animal that had been slaughtered.'
  - where: 'note 34:18 “Between the pieces”'
    claim: 'The calf rite is an ancient custom from which the phrase for making a covenant is explained'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/34.htm'
    quote: 'See on Genesis 15:10 for details regarding this most ancient custom and its meaning'
  - where: 'note 34:19 “The eunuchs”'
    claim: 'Eunuchs were court attendants often given positions as trusted officials'
    key: bd-eunuch
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/eunuch?lang=eng'
    quote: 'A class of emasculated men attached to the courts of eastern rulers. They were employed to watch over the harems and also were often given positions as trusted officials.'
  - where: 'note 34:21 “Zedekiah’s sons”'
    claim: 'Not all Zedekiah’s sons were slain; Mulek came to the Western Hemisphere'
    key: bd-zedekiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zedekiah?lang=eng'
    quote: 'not all of the sons of Zedekiah were slain (as implied in Jer. 52:10), for one son, Mulek, came to the Western Hemisphere (Hel. 8:21).'
  - where: 'note 34:22 “The word that is fulfilled”'
    claim: 'The Chaldeans burned the king’s house, the houses and the walls were broken down'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/39?lang=eng'
    quote: 'And the Chaldeans burned the king’s house, and the houses of the people, with fire, and brake down the walls of Jerusalem.'
  - where: 'note 34:22 “The word that is fulfilled”'
    claim: 'D&C 1:38: the Lord’s word will all be fulfilled, by His voice or His servants'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/1?lang=eng'
    quote: 'my word shall not pass away, but shall all be fulfilled, whether by mine own voice or by the voice of my servants, it is the same.'
  - where: 'christ'
    claim: 'Isaiah: the anointed one proclaims liberty to the captives'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/61?lang=eng'
    quote: 'to proclaim liberty to the captives, and the opening of the prison to them that are bound;'
  - where: 'christ'
    claim: 'Luke 4:18: Jesus’ words about deliverance to the captives'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/4?lang=eng'
    quote: 'he hath sent me to heal the brokenhearted, to preach deliverance to the captives'
  - where: 'christ'
    claim: 'Obedience to gospel principles frees a person from the spiritual bondage of sin'
    key: gs-liberty
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/liberty?lang=eng'
    quote: 'Obedience to gospel principles frees a person from the spiritual bondage of sin (John 8:31–36).'
  - where: 'setting'
    claim: 'Lehi’s call came in Zedekiah’s first year, with many prophets warning of Jerusalem’s destruction'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/1?lang=eng'
    quote: 'in the commencement of the first year of the reign of Zedekiah, king of Judah'
  - where: 'note 34:21 “Zedekiah’s sons”'
    claim: 'Nephi the son of Helaman: the sons of Zedekiah were slain except Mulek'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/hel/8?lang=eng'
    quote: 'Will ye say that the sons of Zedekiah were not slain, all except it were Mulek?'
  - where: 'note 34:21 “Zedekiah’s sons”'
    claim: 'The land north was called Mulek after the son of Zedekiah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/hel/6?lang=eng'
    quote: 'the land north was called Mulek, which was after the son of Zedekiah'
  - where: 'note 34:3 “Eyes to eyes”'
    claim: 'Zedekiah had rebelled against the king who made him swear by God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/36?lang=eng'
    quote: 'he also rebelled against king Nebuchadnezzar, who had made him swear by God'
  - where: 'note 34:8 “Liberty”'
    claim: 'Hebrew slave goes free in the seventh year (Sabbatical)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/21?lang=eng'
    quote: 'in the seventh he shall go out free for nothing.'
  - where: 'when'
    claim: 'The siege began in Zedekiah’s ninth year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/39?lang=eng'
    quote: 'In the ninth year of Zedekiah king of Judah, in the tenth month, came Nebuchadrezzar king of Babylon and all his army against Jerusalem, and they besieged it.'
  - where: 'note 34:3 “Eyes to eyes”'
    claim: 'Ezekiel 12:13 and Jeremiah 34:3 seemed to disagree; both were vindicated by 2 Kings 25:7'
    key: ot-manual-19
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-19?lang=eng'
    quote: 'As recorded in 2 Kings 25:7, both prophets were vindicated by subsequent events.'
  - where: 'note 34:5 “Die in peace”'
    claim: 'One reading: “die in peace” is a death by sickness rather than execution'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/34.htm'
    quote: 'marks a peaceful death on a bed of sickness in contrast with execution'
  - where: 'note 34:5 “Die in peace”'
    claim: 'Against the conditional reading: verse 4 says “hear,” not “obey,” and gives no directions, only how his life will end'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/34.htm'
    quote: 'the word of Jahveh which Zedekiah is to hear, gives no directions as to how he is to act, but is simply an intimation as to what the end of his life shall be'
  - where: 'note 34:5 “Burnings for a king”'
    claim: 'Zedekiah (Mattaniah) was a brother of Jehoiakim'
    key: ot-manual-19
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-19?lang=eng'
    quote: 'Mattaniah, better known as Zedekiah, was a brother of Jehoiakim'
  - where: 'note 34:18 “Between the pieces”'
    claim: 'The rite explains the Hebrew phrase “to cut a covenant” (karat berit)'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/34.htm'
    quote: 'Thus are explained the phrases used to signify the making of a covenant. כּרת בּרית, to cut a covenant'
  - where: 'setting'
    claim: 'Jeremiah gave Zedekiah the message of the city’s fall more than once (21:10)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/21?lang=eng'
    quote: 'it shall be given into the hand of the king of Babylon, and he shall burn it with fire.'
