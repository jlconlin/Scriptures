chapter: 47
claims:
  - where: 'setting'
    claim: 'The Church heading summarizes the chapter: desolation and destruction on the Philistines'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/47?lang=eng'
    quote: 'Jeremiah foretells desolation and destruction upon the Philistines.'
  - where: 'setting'
    claim: 'Chapter 46 dates the Egyptian defeat at Carchemish to the fourth year of Jehoiakim; it names Pharaoh-necho'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/46?lang=eng'
    quote: 'Against Egypt, against the army of Pharaoh-necho king of Egypt, which was by the river Euphrates in Carchemish, which Nebuchadrezzar king of Babylon smote in the fourth year of Jehoiakim'
  - where: 'setting'
    claim: 'Babylon defeated Egypt at Carchemish in 605 B.C.; Judah became a vassal'
    key: ot-manual-kings-g
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-g?lang=eng'
    quote: 'Babylon defeated the Egyptians at Carchemish in 605 B.C. Judah became a vassal of the new conquerors.'
  - where: 'setting'
    claim: 'The Philistines are among the nations in the cup of wrath, Jer. 25:20; chapters 46-49 (Egypt, Philistia, Moab, Ammon, Edom, Elam) are oracles on nations; chapter 47 is one of them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/25?lang=eng'
    quote: 'And all the kings of the land of the Philistines, and Ashkelon, and Azzah, and Ekron, and the remnant of Ashdod,'
  - where: 'setting'
    claim: 'The Philistines held the coastal lowland from Joppa to the Egyptian desert, in five cities'
    key: bd-philistines
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/philistines?lang=eng'
    quote: 'the rich lowland on the Mediterranean coast from Joppa to the Egyptian desert. They formed a confederation of five chief cities'
  - where: 'setting'
    claim: 'Chapters 50-51 are the oracle against Babylon, ending the series'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/50?lang=eng'
    quote: 'The word that the Lord spake against Babylon and against the land of the Chaldeans by Jeremiah the prophet.'
  - where: 'note 47:7 “No promised return”'
    claim: 'In chapter 49 only Ammon and Elam get a promised return; Edom, Damascus, Kedar and Hazor do not'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/49?lang=eng'
    quote: 'And afterward I will bring again the captivity of the children of Ammon, saith the Lord.'
  - where: 'setting'
    claim: 'Chapter 49 includes oracles on Ammon, Edom, Damascus, Kedar and Hazor, and Elam'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/49?lang=eng'
    quote: 'Concerning Kedar, and concerning the kingdoms of Hazor, which Nebuchadrezzar king of Babylon shall smite'
  - where: 'when'
    claim: 'The oracle in chapter 46 is dated to the fourth year of Jehoiakim, at Carchemish'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/46?lang=eng'
    quote: 'which Nebuchadrezzar king of Babylon smote in the fourth year of Jehoiakim'
  - where: 'when'
    claim: 'Carchemish, 605 B.C.'
    key: ot-manual-kings-g
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-g?lang=eng'
    quote: 'Babylon defeated the Egyptians at Carchemish in 605 B.C.'
  - where: 'note 47:1 “Before Pharaoh smote Gaza”'
    claim: 'Pharaoh-necho is the Pharaoh Jeremiah names elsewhere, defeated by Nebuchadnezzar'
    key: bd-necho
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/necho?lang=eng'
    quote: 'King of Egypt who conquered and slew Josiah at Megiddo (2 Kgs. 23:29) but was defeated by Nebuchadnezzar (2 Chr. 35:20, 22; 36:4; Jer. 46:2); called Pharaoh Necho (2 Kgs. 23:29–35; Jer. 46:2).'
  - where: 'note 47:1 “Before Pharaoh smote Gaza”'
    claim: 'The heading does not name the Pharaoh or the year; Keil reads it as marking only the time when conquest from the north was impending, not the fulfilment'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/47.htm'
    quote: 'was not intended to show the fulfilment of the prophecy in the conquest of Gaza by Necho soon afterwards, but merely states that Jeremiah predicts to the Philistines that they will be destroyed by a foe from the north'
  - where: 'note 47:1 “Before Pharaoh smote Gaza”'
    claim: 'Keil: the devastator comes from the north, so the heading cannot mean Pharaoh''s conquest of Gaza fulfilled the prophecy'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/47.htm'
    quote: 'then this portion of the title does not accord with the contents of the following prophecy; for, according to Jeremiah 47:2, the devastator of Philistia approaches from the north'
  - where: 'note 47:1 “Before Pharaoh smote Gaza”'
    claim: 'Keil concludes the Pharaoh of the heading is most probably Hophra, not Necho, citing Jer. 37:5'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/47.htm'
    quote: 'There is thus no course left open for us, but to understand, by the Pharaoh of the title here, not Necho, but his successor Hophra: this has been suggested by Rashi, who refers to Jeremiah 37:5'
  - where: 'note 47:1 “Before Pharaoh smote Gaza”'
    claim: 'Jer. 44:30 names Pharaoh-hophra and sets his fate beside Zedekiah''s'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/44?lang=eng'
    quote: 'Behold, I will give Pharaoh-hophra king of Egypt into the hand of his enemies'
  - where: 'note 47:1 “Before Pharaoh smote Gaza”'
    claim: 'Jer. 37:5: Pharaoh''s army came out of Egypt during the siege of Jerusalem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/37?lang=eng'
    quote: 'Then Pharaoh’s army was come forth out of Egypt: and when the Chaldeans that besieged Jerusalem heard tidings of them, they departed from Jerusalem.'
  - where: 'note 47:1 “Before Pharaoh smote Gaza”'
    claim: 'Keil takes 2 Kgs 24:7 to show Pharaoh cannot have taken Gaza while retreating before Nebuchadnezzar'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/47.htm'
    quote: 'it plainly follows from this, that Pharaoh cannot have taken the fortress of Gaza while retreating before Nebuchadnezzar.'
  - where: 'note 47:1 “Before Pharaoh smote Gaza”'
    claim: 'After Nebuchadnezzar made Egypt retreat, the king of Egypt came no more out of his land'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng'
    quote: 'And the king of Egypt came not again any more out of his land: for the king of Babylon had taken from the river of Egypt unto the river Euphrates all that pertained to the king of Egypt.'
  - where: 'note 47:1 “Who the Philistines were”'
    claim: 'Philistines: confederation of five cities (Ashdod, Gaza, Ashkelon, Gath, Ekron), coastal plain, from Caphtor (Crete or perhaps part of Egypt)'
    key: bd-philistines
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/philistines?lang=eng'
    quote: 'A tribe that originally came from Caphtor (Crete, or perhaps part of Egypt) (Amos 9:7)'
  - where: 'note 47:1 “Who the Philistines were”'
    claim: 'Five chief cities each governed by its lord'
    key: bd-philistines
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/philistines?lang=eng'
    quote: 'They formed a confederation of five chief cities, namely, Ashdod, Gaza, Ashkelon, Gath, and Ekron, each governed by its “lord.”'
  - where: 'note 47:1 “Who the Philistines were”'
    claim: 'Long struggle with Israel; Philistine power at its height at Saul''s death, declining under David'
    key: bd-philistines
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/philistines?lang=eng'
    quote: 'For many years there was a struggle for supremacy between them and the Israelites, Philistine power being at its height at the time of Saul’s death but rapidly declining during the reign of David.'
  - where: 'note 47:1 “Who the Philistines were”'
    claim: 'Gaza is one of the five Philistine cities and the subject of prophecies in Jer. 47, Amos, Zephaniah, Zechariah'
    key: bd-gaza
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/gaza?lang=eng'
    quote: 'Prophecies concerning Gaza are found in Jer. 47:1, 5; Amos 1:6; Zeph. 2:4; Zech. 9:5.'
  - where: 'note 47:4 “Caphtor”'
    claim: 'Amos 9:7 says the Lord brought the Philistines from Caphtor; Deut. 2:23 names Caphtorims who displaced the Avims as far as Azzah (Gaza)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/amos/9?lang=eng'
    quote: 'Have not I brought up Israel out of the land of Egypt? and the Philistines from Caphtor, and the Syrians from Kir?'
  - where: 'note 47:4 “Caphtor”'
    claim: 'Deut. 2:23: Caphtorims came out of Caphtor and settled as far as Azzah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/2?lang=eng'
    quote: 'the Caphtorims, which came forth out of Caphtor, destroyed them, and dwelt in their stead.'
  - where: 'note 47:4 “Caphtor”'
    claim: 'Caphtor is Crete, or perhaps part of Egypt'
    key: bd-philistines
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/philistines?lang=eng'
    quote: 'A tribe that originally came from Caphtor (Crete, or perhaps part of Egypt) (Amos 9:7)'
  - where: 'note 47:4 “Caphtor”'
    claim: 'Azzah is another spelling of Gaza'
    key: bd-gaza
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/gaza?lang=eng'
    quote: 'The name was also spelled Azzah.'
  - where: 'note 47:4 “Caphtor”'
    claim: 'Amos 1:8 speaks of the remnant of the Philistines'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/amos/1?lang=eng'
    quote: 'and the remnant of the Philistines shall perish, saith the Lord God.'
  - where: 'note 47:2 “A flood from the north”'
    claim: 'The waters are a multitude of people coming from Chaldea; the destruction is attributed to the Lord, who allows wicked nations to do such things'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'The “waters” that “rise up out of the north” (v. 2) refers to a multitude of people coming from Chaldea.'
  - where: 'note 47:2 “A flood from the north”'
    claim: 'Isaiah uses the same flood image for the king of Assyria'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/8?lang=eng'
    quote: 'the Lord bringeth up upon them the waters of the river, strong and many, even the king of Assyria, and all his glory'
  - where: 'note 47:2 “A flood from the north”'
    claim: 'Jeremiah 1: the boiling pot and the evil from the north; the Lord calls the families of the northern kingdoms'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/1?lang=eng'
    quote: 'Out of the north an evil shall break forth upon all the inhabitants of the land.'
  - where: 'note 47:2 “A flood from the north”'
    claim: 'Jer. 25:9: the Lord sends for the families of the north and Nebuchadrezzar, “my servant”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/25?lang=eng'
    quote: 'Behold, I will send and take all the families of the north, saith the Lord, and Nebuchadrezzar the king of Babylon, my servant'
  - where: 'note 47:2 “A flood from the north”'
    claim: 'Jer. 46:20: destruction on Egypt also comes out of the north'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/46?lang=eng'
    quote: 'Egypt is like a very fair heifer, but destruction cometh; it cometh out of the north.'
  - where: 'note 47:3 “Fathers who do not look back”'
    claim: 'Stamping hoofs, rushing chariots, rumbling wheels describe a war'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'The stamping of hoofs, the rushing of chariots, and the rumbling of wheels describe a war.'
  - where: 'note 47:3 “Fathers who do not look back”'
    claim: 'Feeble hands as a sign of terror in Jer. 6:24'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/6?lang=eng'
    quote: 'We have heard the fame thereof: our hands wax feeble: anguish hath taken hold of us, and pain, as of a woman in travail.'
  - where: 'note 47:4 “Why Tyre and Sidon appear”'
    claim: 'Zidon (Sidon) was the most important city of Phoenicia; Phoenicians are called Zidonians in the Old Testament'
    key: bd-zidon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zidon?lang=eng'
    quote: 'In ancient times it was the most important city of Phoenicia (hence Phoenicians are generally called Zidonians in the Old Testament).'
  - where: 'note 47:4 “Why Tyre and Sidon appear”'
    claim: 'Tyre and Zidon, with the Philistine cities, are named in the cup of wrath (Jer. 25:20, 22)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/25?lang=eng'
    quote: 'And all the kings of Tyrus, and all the kings of Zidon, and the kings of the isles which are beyond the sea,'
  - where: 'note 47:4 “Why Tyre and Sidon appear”'
    claim: 'Ezekiel says Nebuchadrezzar will come against Tyrus from the north'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/26?lang=eng'
    quote: 'I will bring upon Tyrus Nebuchadrezzar king of Babylon, a king of kings, from the north, with horses, and with chariots'
  - where: 'note 47:4 “Why Tyre and Sidon appear”'
    claim: 'Keil: the Philistines are the helpers who could aid the Phoenicians against Chaldea, so the Phoenicians perish too'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/47.htm'
    quote: 'are the Philistines, who could afford help to the Phoenicians in the struggle against the Chaldean power. This implies that the Phoenicians also shall perish without any one to help them.'
  - where: 'note 47:5 “Shaved heads and cut flesh”'
    claim: 'Israel was forbidden to cut itself or make baldness for the dead'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/14?lang=eng'
    quote: 'Ye are the children of the Lord your God: ye shall not cut yourselves, nor make any baldness between your eyes for the dead.'
  - where: 'note 47:5 “Shaved heads and cut flesh”'
    claim: 'Lev. 19:28 forbids cuttings in the flesh for the dead'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/19?lang=eng'
    quote: 'Ye shall not make any cuttings in your flesh for the dead, nor print any marks upon you: I am the Lord.'
  - where: 'note 47:5 “Shaved heads and cut flesh”'
    claim: 'Jer. 16:6: cutting and baldness as mourning custom in Judah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/16?lang=eng'
    quote: 'Both the great and the small shall die in this land: they shall not be buried, neither shall men lament for them, nor cut themselves, nor make themselves bald for them:'
  - where: 'note 47:5 “Shaved heads and cut flesh”'
    claim: 'Micah 1:16 uses baldness for grief over those carried into captivity'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/micah/1?lang=eng'
    quote: 'Make thee bald, and poll thee for thy delicate children; enlarge thy baldness as the eagle; for they are gone into captivity from thee.'
  - where: 'note 47:5 “Shaved heads and cut flesh”'
    claim: 'Men from Shechem, Shiloh and Samaria came with shaved beards and cut themselves, Jer. 41:5'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/41?lang=eng'
    quote: 'having their beards shaven, and their clothes rent, and having cut themselves, with offerings and incense in their hand, to bring them to the house of the Lord.'
  - where: 'note 47:6 “The sword of the Lord”'
    claim: 'The destruction is attributed to the Lord, who allows wicked nations to do such things against those ripe in iniquity'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'The destruction is attributed to the Lord, who allows wicked nations to do such things against those who have become ripe in iniquity.'
  - where: 'note 47:6 “The sword of the Lord”'
    claim: 'Jer. 25:15-16: the cup of fury and the sword the Lord sends among the nations'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/25?lang=eng'
    quote: 'And they shall drink, and be moved, and be mad, because of the sword that I will send among them.'
  - where: 'note 47:6 “The sword of the Lord”'
    claim: 'Keil: how the speakers divide in verses 5-7 (Philistia asked how long she cuts herself; plaintive request; the seer answers)'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/47.htm'
    quote: 'The question, "How long dost thou tear thyself?" forms a transition to the plaintive request, "Gather thyself," i.e., draw thyself back into thy scabbard. But the seer replies, "How can it rest?'
  - where: 'note 47:7 “Other prophets on the Philistine coast”'
    claim: 'Zeph. 2:4-7: Gaza forsaken, Ashkelon a desolation, sea coast to be for the remnant of Judah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zeph/2?lang=eng'
    quote: 'And the coast shall be for the remnant of the house of Judah; they shall feed thereupon: in the houses of Ashkelon shall they lie down in the evening'
  - where: 'note 47:7 “Other prophets on the Philistine coast”'
    claim: 'Amos 1:6-8: fire on the wall of Gaza; the remnant of the Philistines shall perish'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/amos/1?lang=eng'
    quote: 'and the remnant of the Philistines shall perish, saith the Lord God.'
  - where: 'note 47:7 “Other prophets on the Philistine coast”'
    claim: 'Ezek. 25:15-17: vengeance on the Philistines because they acted by revenge'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/25?lang=eng'
    quote: 'Because the Philistines have dealt by revenge, and have taken vengeance with a despiteful heart, to destroy it for the old hatred;'
  - where: 'note 47:7 “Other prophets on the Philistine coast”'
    claim: 'Zech. 9:5-7: the one who remains among the Philistines shall be for our God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/9?lang=eng'
    quote: 'but he that remaineth, even he, shall be for our God, and he shall be as a governor in Judah'
  - where: 'note 47:7 “No promised return”'
    claim: 'Jeremiah promises a return to Egypt (inhabited again), Moab, Ammon and Elam; no such line in chapter 47'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/49?lang=eng'
    quote: 'But it shall come to pass in the latter days, that I will bring again the captivity of Elam, saith the Lord.'
  - where: 'note 47:7 “No promised return”'
    claim: 'Moab: the Lord will bring again the captivity of Moab in the latter days'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/48?lang=eng'
    quote: 'Yet will I bring again the captivity of Moab in the latter days, saith the Lord.'
  - where: 'note 47:7 “No promised return”'
    claim: 'Egypt: afterward it shall be inhabited as in the days of old'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/46?lang=eng'
    quote: 'and afterward it shall be inhabited, as in the days of old, saith the Lord.'
  - where: 'note 47:7 “No promised return”'
    claim: 'Student manual reads the latter-day returns of Moab and Elam as probable conversion of remnants'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'This passage could mean the conversion of the remnants of these people to the gospel in the last days.'
  - where: 'note 47:7 “No promised return”'
    claim: 'The Elam promise is understood, like Moab''s, as conversion'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'captivity of Elam in the latter days. Again, it is supposed that this passage means their conversion, as with the Moabites.'
  - where: 'christ'
    claim: 'Jer. 25:9 calls Nebuchadrezzar “my servant”; Zech. 9:7 remnant shall be for our God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/9?lang=eng'
    quote: 'but he that remaineth, even he, shall be for our God'
