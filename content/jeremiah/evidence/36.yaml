  - where: 'setting'
    claim: 'Jehoiakim ruled as an Egyptian vassal; Babylon defeated Egypt at Carchemish in 605 B.C.'
    key: ot-manual-kings-g
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-g?lang=eng'
    quote: 'his half brother who was given the throne name of Jehoiakim ruled as an Egyptian vassal. He exacted heavy taxes from his people for Egypt. Babylon defeated the Egyptians at Carchemish in 605 B.C.'
  - where: 'when'
    claim: 'The fourth year of Jehoiakim, the year of Carchemish, was about 605 B.C.'
    key: ot-manual-kings-g
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-g?lang=eng'
    quote: 'Babylon defeated the Egyptians at Carchemish in 605 B.C.'
  - where: 'note 36:10 “The family of Shaphan”'
    claim: 'Gemariah son of Shaphan was probably a brother of Ahikam son of Shaphan, Jeremiah’s protector'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/36.htm'
    quote: 'was probably a brother of Ahikam the son of Shaphan, who had already shown himself, before this, a protector of the prophet'
  - where: 'note 36:30 “None to sit on David’s throne”'
    claim: 'The king of Babylon made Mattaniah, Jehoiachin’s father’s brother, king and renamed him Zedekiah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng'
    quote: 'And the king of Babylon made Mattaniah his father’s brother king in his stead, and changed his name to Zedekiah.'
  - where: 'note 36:23 “Column by column”'
    claim: 'It was the king who cut the roll as Jehudi read (also section 3 plain)'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/36.htm'
    quote: 'when Jehudi had read three or four columns, he the king cut it the book-roll with a pen-knife and threw the pieces into the fire'
