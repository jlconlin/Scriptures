chapter: 36
claims:
  - where: 'when'
    claim: 'The fourth year of Jehoiakim was the first year of Nebuchadrezzar'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/25?lang=eng'
    quote: 'in the fourth year of Jehoiakim the son of Josiah king of Judah, that was the first year of Nebuchadrezzar king of Babylon'
  - where: 'note 36:1 “Why 605 B.C. matters”'
    claim: 'Nebuchadrezzar defeated Pharaoh-necho at Carchemish in the fourth year of Jehoiakim'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/46?lang=eng'
    quote: 'which Nebuchadrezzar king of Babylon smote in the fourth year of Jehoiakim the son of Josiah king of Judah'
  - where: 'note 36:1 “Why 605 B.C. matters”'
    claim: 'Babylon defeated Egypt at Carchemish in 605 B.C. and Judah became a vassal of Babylon'
    key: ot-manual-kings-g
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-g?lang=eng'
    quote: 'Babylon defeated the Egyptians at Carchemish in 605 B.C. Judah became a vassal of the new conquerors.'
  - where: 'setting'
    claim: 'Jeremiah 35 and 36 go back to the reign of Jehoiakim, the king before Zedekiah'
    key: ot-study-guide-2015-unit-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-study-guide-for-home-study-seminary-students-2015/introduction-to-jeremiah/unit-28-day-1-jeremiah-34-41?lang=eng'
    quote: 'Jeremiah 35–36 refers back to experiences Jeremiah had during the reign of Jehoiakim, who was the king of Judah before Zedekiah.'
  - where: 'setting'
    claim: 'The Church heading summarizes the chapter: Baruch writes, reads, the king burns the book, Jeremiah dictates again and adds many more'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/36?lang=eng'
    quote: 'Jehoiakim, the king, burns the book, and judgment comes upon him—Jeremiah dictates the prophecies again and adds many more.'
  - where: 'note 36:2 “Twenty-three years on a scroll”'
    claim: 'Jeremiah dates his preaching from Josiah’s thirteenth year to the twenty-third year of the word coming'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/25?lang=eng'
    quote: 'From the thirteenth year of Josiah the son of Amon king of Judah, even unto this day, that is the three and twentieth year, the word of the Lord hath come unto me'
  - where: 'note 36:2 “Twenty-three years on a scroll”'
    claim: 'Ancient rolls were sewn sheets, long, wound around a stick; Jer. 36 is a scroll'
    key: bd-scroll
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/scroll?lang=eng'
    quote: 'Rolls were made by sewing sheets together to make a long strip. Some rolls became very long, exceeding 100 feet.'
  - where: 'note 36:3 “Written so that they might turn”'
    claim: 'The phrase “all the evil which I purpose to do unto them” refers to consequences of their choices'
    key: ot-study-guide-2015-unit-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-study-guide-for-home-study-seminary-students-2015/introduction-to-jeremiah/unit-28-day-1-jeremiah-34-41?lang=eng'
    quote: 'refers to the consequences that would come to the people because of their evil choices.'
  - where: 'note 36:3 “Written so that they might turn”'
    claim: 'The Lord’s stated principle: a nation that turns from evil, He will repent of the evil He thought to do'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/18?lang=eng'
    quote: 'If that nation, against whom I have pronounced, turn from their evil, I will repent of the evil that I thought to do unto them.'
  - where: 'note 36:4 “Baruch the scribe”'
    claim: 'Baruch means “Blessed”; he is Jeremiah’s scribe, taken to Egypt'
    key: bd-baruch
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/baruch?lang=eng'
    quote: 'Blessed. Jeremiah’s scribe (Jer. 32:12–13; 36); taken to Egypt (43:2–6; 45).'
  - where: 'note 36:4 “Baruch the scribe”'
    claim: 'Jeremiah gave Baruch the deed of purchase in the prison court'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/32?lang=eng'
    quote: 'And I gave the evidence of the purchase unto Baruch the son of Neriah'
  - where: 'note 36:4 “Baruch the scribe”'
    claim: 'Jeremiah 45 is addressed to Baruch when he had written the words, in the fourth year of Jehoiakim; he cried “Woe is me”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/45?lang=eng'
    quote: 'Thou didst say, Woe is me now! for the Lord hath added grief to my sorrow; I fainted in my sighing, and I find no rest.'
  - where: 'note 36:4 “Baruch the scribe”'
    claim: 'The Lord’s answer to Baruch: do not seek great things for yourself; your life will be given you'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/45?lang=eng'
    quote: 'And seekest thou great things for thyself? seek them not'
  - where: 'note 36:5 “Why Jeremiah cannot go to the temple”'
    claim: 'The Church edition footnote renders “shut up” as under arrest or in confinement'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/36?lang=eng'
    quote: 'HEB under arrest, or in confinement.'
  - where: 'note 36:5 “Why Jeremiah cannot go to the temple”'
    claim: 'The same Hebrew word (Strong’s 6113) is rendered “shut up” in Jer. 33:1, where Jeremiah is in the court of the prison'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/jeremiah/33-1.htm'
    quote: 'shut up in the court of the prison, saying,'
  - where: 'note 36:5 “Why Jeremiah cannot go to the temple”'
    claim: 'Jeremiah 36:5 uses the same word (Strong’s 6113) as 33:1'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/jeremiah/36-5.htm'
    quote: 'And Jeremiah commanded Baruch, saying, I am shut up; I cannot go into the house of the LORD:'
  - where: 'note 36:5 “Why Jeremiah cannot go to the temple”'
    claim: 'Jeremiah was confined and unable to speak the Lord’s words at the temple'
    key: ot-institute-manual-42
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-institute-teacher-manual-2026/42-jeremiah-31-33-36-38?lang=eng'
    quote: 'Explain that Jeremiah was confined and unable to speak the Lord’s words at the temple. So he dictated God’s words to his scribe, Baruch'
  - where: 'note 36:9 “A fast in the ninth month”'
    claim: 'The ninth month corresponds to December; the fast was a special one, for the law prescribed only the day of atonement'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/36.htm'
    quote: 'The ninth month corresponds to our December, and consequently came round with the cold season; cf. Jeremiah 36:22. The fast-day was a special one'
  - where: 'note 36:9 “A fast in the ninth month”'
    claim: 'It is doubtful who proclaimed the fast, king or priesthood'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/36.htm'
    quote: 'It remains doubtful with whom the appointment originated, - whether with the king, or with the high priest and the priesthood.'
  - where: 'note 36:9 “A fast in the ninth month”'
    claim: 'The Church footnote on verse 6 points to Neh. 9:1, a fast with sackcloth and earth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/9?lang=eng'
    quote: 'the children of Israel were assembled with fasting, and with sackclothes, and earth upon them.'
  - where: 'note 36:10 “The family of Shaphan”'
    claim: 'Shaphan the scribe read the book of the law to Josiah, who rent his clothes'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/22?lang=eng'
    quote: 'And Shaphan the scribe shewed the king, saying, Hilkiah the priest hath delivered me a book. And Shaphan read it before the king.'
  - where: 'note 36:10 “The family of Shaphan”'
    claim: 'Josiah sent Ahikam son of Shaphan and Achbor, with Shaphan, to Huldah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/22?lang=eng'
    quote: 'And the king commanded Hilkiah the priest, and Ahikam the son of Shaphan, and Achbor the son of Michaiah, and Shaphan the scribe'
  - where: 'note 36:10 “The family of Shaphan”'
    claim: 'Ahikam son of Shaphan protected Jeremiah from being given to the people'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/26?lang=eng'
    quote: 'Nevertheless the hand of Ahikam the son of Shaphan was with Jeremiah, that they should not give him into the hand of the people to put him to death.'
  - where: 'note 36:10 “The family of Shaphan”'
    claim: 'Elnathan son of Achbor was sent by Jehoiakim to fetch Urijah from Egypt'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/26?lang=eng'
    quote: 'And Jehoiakim the king sent men into Egypt, namely, Elnathan the son of Achbor, and certain men with him into Egypt.'
  - where: 'note 36:19 “Why the princes say hide”'
    claim: 'Jehoiakim killed the prophet Urijah, who had prophesied as Jeremiah did'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/26?lang=eng'
    quote: 'who slew him with the sword, and cast his dead body into the graves of the common people.'
  - where: 'note 36:19 “Why the princes say hide”'
    claim: 'The Church manual says the case of Urijah shows the wickedness of Jehoiakim'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'The case of Urijah, recounted here at Jeremiah’s trial, shows the wickedness of King Jehoiakim.'
  - where: 'note 36:23 “Column by column”'
    claim: 'The Hebrew word behind “leaves” (deleth, “door”) is used of a column of a manuscript in Jer. 36:23'
    key: bdb
    url: 'https://biblehub.com/hebrew/1817.htm'
    quote: 'of column of MS. (from shape) Jeremiah 36:23'
  - where: 'note 36:23 “Column by column”'
    claim: 'The Hebrew behind “penknife” is the scribe’s knife (BDB: penknife)'
    key: bdb
    url: 'https://biblehub.com/hebrew/8593.htm'
    quote: 'construct הַסֹּפֵר ׳ ת Jeremiah 36:23 = penknife'
  - where: 'note 36:23 “Column by column”'
    claim: 'Ancient books were written in parallel columns; the reader unrolled one end and rolled up the other'
    key: bd-roll
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/roll?lang=eng'
    quote: 'A book in ancient times was usually written on parchment or papyrus in a series of parallel columns, which answered to the pages of a modern book.'
  - where: 'note 36:23 “Column by column”'
    claim: 'Amos 3:15 speaks of a winter house (footnote on verse 22)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/amos/3?lang=eng'
    quote: 'And I will smite the winter house with the summer house'
  - where: 'note 36:23 “Column by column”'
    claim: 'The king sat in the winterhouse in December, in a portion of the palace built for winter'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/36.htm'
    quote: 'in the winter-house, i.e., in that portion of the palace which was erected for a winter residence'
  - where: 'note 36:24 “Josiah and Jehoiakim”'
    claim: 'Josiah rent his clothes when the book of the law was read'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/22?lang=eng'
    quote: 'when the king had heard the words of the book of the law, that he rent his clothes.'
  - where: 'note 36:24 “Josiah and Jehoiakim”'
    claim: 'The writer contrasts Jehoiakim’s hardness with Josiah’s sorrow in a similar case'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/36.htm'
    quote: 'So hardened was the king, that he and his servants neither were terrified by the threatenings of the prophet, nor felt deep sorrow, as Josiah did in a similar case (2 Kings 22:11'
  - where: 'note 36:29 “Why hast thou written”'
    claim: 'The king’s reaction is a response to the prophet’s message; Benson on how people respond to a living prophet'
    key: ttp-benson-11
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-of-presidents-of-the-church-ezra-taft-benson/chapter-11-follow-the-living-prophet?lang=eng'
    quote: 'How we respond to the words of a living prophet when he tells us what we need to know, but would rather not hear, is a test of our faithfulness.'
  - where: 'note 36:29 “Why hast thou written”'
    claim: 'Benson on how the unrighteous respond to a prophet and that popularity is not a test of truth'
    key: ttp-benson-11
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-of-presidents-of-the-church-ezra-taft-benson/chapter-11-follow-the-living-prophet?lang=eng'
    quote: 'The honest in heart heed his words but the unrighteous either ignore the prophet or fight him.'
  - where: 'note 36:29 “Why hast thou written”'
    claim: 'Benson: the worldly want to close the prophet’s mouth or act as if he did not exist; popularity is never a test of truth'
    key: ttp-benson-11
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-of-presidents-of-the-church-ezra-taft-benson/chapter-11-follow-the-living-prophet?lang=eng'
    quote: 'the worldly either want to close the mouth of the prophet, or else act as if the prophet didn’t exist, rather than repent of their sins. Popularity is never a test of truth.'
  - where: 'note 36:30 “None to sit on David’s throne”'
    claim: 'Jehoiakim’s dishonorable burial, an ass’s burial, is in Jer. 22:18–19'
    key: bd-jehoiakim
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehoiakim?lang=eng'
    quote: 'Jehoiakim was given a dishonorable burial of an ass (Jer. 22:18–19). He was succeeded by his son Jehoiachin'
  - where: 'note 36:30 “None to sit on David’s throne”'
    claim: 'An ass’s burial meant being left unburied; probably fulfilled when Jehoiakim was taken captive in the siege'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'An ass’s burial (see v. 19) meant to be left unburied in the open field. This prophecy probably was fulfilled when Jehoiakim was taken captive during Nebuchadnezzar’s siege of Jerusalem.'
  - where: 'note 36:30 “None to sit on David’s throne”'
    claim: 'Kings says only that Jehoiakim slept with his fathers; Jehoiachin reigned three months and went out to the king of Babylon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng'
    quote: 'So Jehoiakim slept with his fathers: and Jehoiachin his son reigned in his stead.'
  - where: 'note 36:30 “None to sit on David’s throne”'
    claim: 'Jehoiachin reigned three months'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng'
    quote: 'Jehoiachin was eighteen years old when he began to reign, and he reigned in Jerusalem three months.'
  - where: 'note 36:30 “None to sit on David’s throne”'
    claim: 'The king of Babylon took Jehoiachin'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng'
    quote: 'And Jehoiachin the king of Judah went out to the king of Babylon'
  - where: 'note 36:30 “None to sit on David’s throne”'
    claim: 'Church teaching materials say the prophecy that no descendant of Jehoiakim would be king came to pass'
    key: ot-seminary-guide-jer-36
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-student-study-guide-obs/the-book-of-jeremiah/jeremiah-36-baruch-the-scribe?lang=eng'
    quote: 'The prophecy was that no descendant of Jehoiakim would be king—a prophecy which came to pass.'
  - where: 'note 36:31 “The word that is not destroyed”'
    claim: 'All of Jeremiah’s prophecies about Jehoiakim and Jerusalem’s destruction were later fulfilled; the truth taught: the Lord’s words will be fulfilled whether or not we believe'
    key: ot-study-guide-2015-unit-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-study-guide-for-home-study-seminary-students-2015/introduction-to-jeremiah/unit-28-day-1-jeremiah-34-41?lang=eng'
    quote: 'All of Jeremiah’s prophecies regarding Jehoiakim and the destruction of Jerusalem were later fulfilled. One of the truths we can learn from these verses is that the Lord’s words will be fulfilled, regardless of whether we believe in them.'
  - where: 'note 36:31 “The word that is not destroyed”'
    claim: 'Students read D&C 1:37–38 alongside Jeremiah 36'
    key: ot-institute-manual-42
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-institute-teacher-manual-2026/42-jeremiah-31-33-36-38?lang=eng'
    quote: 'All the Lord’s words will be fulfilled. You could have students read Doctrine and Covenants 1:37–38 and discuss how these verses relate to the account in Jeremiah 36.'
  - where: 'note 36:31 “The word that is not destroyed”'
    claim: 'D&C 1:38: my word shall not pass away, whether by my own voice or by my servants'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/1?lang=eng'
    quote: 'my word shall not pass away, but shall all be fulfilled, whether by mine own voice or by the voice of my servants, it is the same.'
  - where: 'note 36:31 “The word that is not destroyed”'
    claim: 'Jehoiakim became Nebuchadnezzar’s servant for three years, then rebelled; the Lord sent bands against Judah according to the word spoken by the prophets'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng'
    quote: 'And the Lord sent against him bands of the Chaldees, and bands of the Syrians, and bands of the Moabites, and bands of the children of Ammon, and sent them against Judah to destroy it, according to the word of the Lord'
