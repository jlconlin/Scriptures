chapter: 45
claims:
  - where: 'note 45:1 “Baruch, Jeremiah’s scribe”'
    claim: 'Baruch was Jeremiah’s scribe; his name means Blessed; he is in Jer. 32, 36 and was taken to Egypt'
    key: bd-baruch
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/baruch?lang=eng'
    quote: 'Blessed. Jeremiah’s scribe (Jer. 32:12–13; 36); taken to Egypt (43:2–6; 45).'
  - where: 'note 45:1 “Baruch, Jeremiah’s scribe”'
    claim: 'Baruch wrote Jeremiah’s words from his mouth on a roll'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/36?lang=eng'
    quote: 'Then Jeremiah called Baruch the son of Neriah: and Baruch wrote from the mouth of Jeremiah all the words of the Lord, which he had spoken unto him, upon a roll of a book.'
  - where: 'note 45:1 “Baruch, Jeremiah’s scribe”'
    claim: 'Baruch witnessed the deed of the field purchase'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/32?lang=eng'
    quote: 'And I gave the evidence of the purchase unto Baruch the son of Neriah, the son of Maaseiah'
  - where: 'note 45:1 “Baruch, Jeremiah’s scribe”'
    claim: 'The people of Judah blamed Baruch for Jeremiah’s message and took him to Egypt with Jeremiah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/43?lang=eng'
    quote: 'But Baruch the son of Neriah setteth thee on against us, for to deliver us into the hand of the Chaldeans'
  - where: 'note 45:1 “Baruch, Jeremiah’s scribe”'
    claim: 'Baruch went with Jeremiah to Egypt'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/43?lang=eng'
    quote: 'and Jeremiah the prophet, and Baruch the son of Neriah.'
  - where: 'note 45:1 “Baruch, Jeremiah’s scribe”'
    claim: 'Baruch recorded the first and second scrolls (605/4 B.C.), shared Jeremiah’s dangers, and much of the book likely goes back to him'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'He wrote down his oracles for the first and second scrolls in 605/4 B.C.'
  - where: 'note 45:1 “Baruch, Jeremiah’s scribe”'
    claim: 'Much of the book probably goes back to Baruch'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'Much of the present book of Jeremiah must go back either directly or indirectly to him.'
  - where: 'note 45:1 “Why this word is at the end”'
    claim: 'In the fourth year of Jehoiakim the Lord told Jeremiah to write all his words in a roll; Baruch wrote them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/36?lang=eng'
    quote: 'And it came to pass in the fourth year of Jehoiakim the son of Josiah king of Judah, that this word came unto Jeremiah from the Lord'
  - where: 'note 45:1 “Why this word is at the end”'
    claim: 'The roll was read in the fifth year at a fast'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/36?lang=eng'
    quote: 'And it came to pass in the fifth year of Jehoiakim the son of Josiah king of Judah, in the ninth month, that they proclaimed a fast before the Lord'
  - where: 'note 45:1 “Why this word is at the end”'
    claim: 'The king commanded that Baruch and Jeremiah be taken, but the Lord hid them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/36?lang=eng'
    quote: 'to take Baruch the scribe and Jeremiah the prophet: but the Lord hid them.'
  - where: 'note 45:1 “Why this word is at the end”'
    claim: 'Chapter 45 is a kind of appendix belonging with chapter 36'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'The passage is a kind of appendix that belongs with ch. 36, and is valuable for insight it gives into Baruch’s own life.'
  - where: 'note 45:1 “Why this word is at the end”'
    claim: 'The chapters of Jeremiah are not in chronological order'
    key: ot-seminary-lesson-139
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-material-2018/jeremiah/lesson-139?lang=eng'
    quote: 'The chapters in Jeremiah are not in chronological order'
  - where: 'note 45:3 “What Baruch’s grief was about”'
    claim: 'Baruch’s despair may have come from dictating judgments he knew were true'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'It may be that as he dictated Jeremiah’s words of judgment, and knew in his heart that they were true and would certainly come to pass, he became depressed at it all'
  - where: 'note 45:3 “What Baruch’s grief was about”'
    claim: 'Lam. 1:3 describes Judah gone into captivity finding no rest'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lam/1?lang=eng'
    quote: 'she dwelleth among the heathen, she findeth no rest'
  - where: 'note 45:3 “What Baruch’s grief was about”'
    claim: 'Church edition footnote on “rest” in verse 3 points to Lam. 1:3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/45?lang=eng'
    quote: 'Lam. 1:3 .'
  - where: 'note 45:4 “The whole earth, not only the land”'
    claim: 'Church edition footnote on “this whole land”: the Hebrew adds “for it is mine” (footnotes on verse 4 also link Jer. 1:10 and 31:28)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/45?lang=eng'
    quote: 'Hebrew text adds: for it is mine.'
  - where: 'note 45:4 “Build and pluck up”'
    claim: 'The same verbs of ruin and building are in the commission to Jeremiah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/1?lang=eng'
    quote: 'to root out, and to pull down, and to destroy, and to throw down, to build, and to plant.'
  - where: 'note 45:4 “Build and pluck up”'
    claim: 'The Lord’s own work of plucking up and building in Jer. 31:28'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/31?lang=eng'
    quote: 'to build, and to plant'
  - where: 'note 45:4 “The whole earth, not only the land”'
    claim: 'The Hebrew means the whole earth, as the parallel “all flesh” shows'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/45.htm'
    quote: 'does not mean "the whole land," but "the whole earth:" this is indubitably evident from the parallel "upon all flesh," Jeremiah 45:5, i.e., the whole of humanity'
  - where: 'note 45:4 “The whole earth, not only the land”'
    claim: 'Jer. 25 extends judgment to all nations and all flesh'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/25?lang=eng'
    quote: 'for the Lord hath a controversy with the nations, he will plead with all flesh'
  - where: 'note 45:5 “Great things for thyself”'
    claim: 'Church edition footnote links “seekest” to Mark 8:36–37'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/8?lang=eng'
    quote: 'For what shall it profit a man, if he shall gain the whole world, and lose his own soul?'
  - where: 'note 45:5 “Great things for thyself”'
    claim: '“Great things” means worldly prosperity unattainable when judgment is general (cf. Ps. 131:1)'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/45.htm'
    quote: 'When the whole world is visited with judgment, an individual man must not make great demands, but be content with saving his life.'
  - where: 'note 45:5 “A life as spoil”'
    claim: 'Hebrew shalal means prey; booty, spoil of war; the phrase “his life as a prey” means life spared, in Jer. 21:9, 38:2, 39:18, and 45:5'
    key: bdb
    url: 'https://biblehub.com/hebrew/7998.htm'
    quote: 'i.e. life shall be spared, Jeremiah 21:9; Jeremiah 38:2; Jeremiah 39:18, compare Jeremiah 45:5.'
  - where: 'note 45:5 “A life as spoil”'
    claim: 'Same promise to those who leave the city to the Chaldeans'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/21?lang=eng'
    quote: 'but he that goeth out, and falleth to the Chaldeans that besiege you, he shall live, and his life shall be unto him for a prey.'
  - where: 'note 45:5 “A life as spoil”'
    claim: 'The same promise to Ebed-melech because he trusted the Lord'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/39?lang=eng'
    quote: 'but thy life shall be for a prey unto thee: because thou hast put thy trust in me, saith the Lord.'
  - where: 'setting'
    claim: 'Chapter heading: Jeremiah promises Baruch that his life will be preserved'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/45?lang=eng'
    quote: 'Jeremiah promises Baruch that his life will be preserved.'
  - where: 'christ'
    claim: 'Jesus’ question about gaining the whole world and losing one’s soul'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/8?lang=eng'
    quote: 'Or what shall a man give in exchange for his soul?'
  - where: 'setting'
    claim: 'Chapter 46 begins the prophecies against the Gentiles (nations)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/46?lang=eng'
    quote: 'The word of the Lord which came to Jeremiah the prophet against the Gentiles;'
  - where: 'when'
    claim: 'The fourth year of Jehoiakim, when Baruch wrote the scrolls, was about 605/4 B.C.'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'He wrote down his oracles for the first and second scrolls in 605/4 B.C.'
  - where: 'setting'
    claim: 'The book is not arranged in order of time'
    key: ot-seminary-lesson-139
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-material-2018/jeremiah/lesson-139?lang=eng'
    quote: 'The chapters in Jeremiah are not in chronological order'
  - where: 'note 45:1 “Why this word is at the end”'
    claim: 'The prophecies against the nations begin in chapter 46'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/46?lang=eng'
    quote: 'The word of the Lord which came to Jeremiah the prophet against the Gentiles;'
  - where: 'note 45:4 “The whole earth, not only the land”'
    claim: 'Hebrew erets means both earth and land'
    key: bdb
    url: 'https://biblehub.com/hebrew/776.htm'
    quote: 'earth, land'
  - where: 'note 45:4 “Build and pluck up”'
    claim: 'Church edition footnotes link “break” and “pluck” in verse 4 to Jer. 1:10 and Jer. 31:28'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/45?lang=eng'
    quote: 'Jer. 31:28'
  - where: 'note 45:5 “A life as spoil”'
    claim: 'shalal is often the booty or spoil of war'
    key: bdb
    url: 'https://biblehub.com/hebrew/7998.htm'
    quote: 'booty, spoil of war, of all kinds'
  - where: 'note 45:5 “A life as spoil”'
    claim: 'Church edition footnote on “life” in verse 5 links Jer. 21:9 and 39:18'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/45?lang=eng'
    quote: 'Jer. 21:9'
  - where: 'note 45:4 “Build and pluck up”'
    claim: 'Verse 4 uses the Hebrew verbs banah (build), haras (break down), nata (plant), natash (pluck up)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/jeremiah/45-4.htm'
    quote: 'bā·nî·ṯî בָּנִ֙יתִי֙ I have built … hō·rês, הֹרֵ֔ס am breaking down … nā·ṭa‘·tî נָטַ֖עְתִּי I have planted … nō·ṯêš; נֹתֵ֑שׁ am plucking up'
  - where: 'note 45:4 “Build and pluck up”'
    claim: 'Jer. 1:10 uses the same four verbs (natash rendered “root out” in the KJV)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/jeremiah/1-10.htm'
    quote: 'lin·ṯō·wōš לִנְת֥וֹשׁ to uproot'
  - where: 'thread'
    claim: 'The verbs of verse 4 are those of Jeremiah’s call in 1:10'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/jeremiah/1-10.htm'
    quote: 'wə·la·hă·rō·ws; וְלַהֲר֑וֹס and to throw down'
  - where: 'thread'
    claim: '“This whole land” may mean the whole earth'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/45.htm'
    quote: 'The destruction regards the whole earth'
  - where: 'setting'
    claim: 'The Lord’s answer is stern yet comforting'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/45.htm'
    quote: 'The answer of the Lord to this sighing is of a stern character, yet soothing for Baruch.'
  - where: 'note 45:5 “A life as spoil”'
    claim: 'shalal is glossed “prey”'
    key: bdb
    url: 'https://biblehub.com/hebrew/7998.htm'
    quote: '1 prey , of Benjamin as wolf Genesis 49:27'
  - where: 'note 45:5 “A life as spoil”'
    claim: 'The same promise in Jer. 38:2'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/38?lang=eng'
    quote: 'for he shall have his life for a prey, and shall live.'
