chapter: 45
claims:
  - where: 'when'
    claim: 'Baruch wrote the first and second scrolls in 605/4 B.C., the fourth year of Jehoiakim named in 45:1'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'He wrote down his oracles for the first and second scrolls in 605/4 B.C.'
  - where: 'setting'
    claim: 'The Church heading summarizes the chapter as a promise that Baruch’s life will be preserved'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/45?lang=eng'
    quote: 'Jeremiah promises Baruch that his life will be preserved.'
  - where: 'setting'
    claim: 'The chapter is a kind of appendix that belongs with chapter 36'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'The passage is a kind of appendix that belongs with ch. 36, and is valuable for insight it gives into Baruch’s own life.'
  - where: 'thread'
    claim: 'Church seminary materials read the chapter as the Lord’s encouragement to a discouraged Baruch'
    key: ot-seminary-teacher-137
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-jeremiah/lesson-137-jeremiah-42-52?lang=eng'
    quote: 'Jeremiah’s scribe, Baruch, felt discouraged, and the Lord sent him a message of encouragement through Jeremiah.'
  - where: 'note 45:1 “Baruch, Jeremiah’s scribe”'
    claim: 'Baruch means “Blessed”; he was Jeremiah’s scribe and was taken to Egypt'
    key: bd-baruch
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/baruch?lang=eng'
    quote: 'Baruch Blessed. Jeremiah’s scribe ( Jer. 32:12–13 ; 36 ); taken to Egypt ( 43:2–6 ; 45 ).'
  - where: 'note 45:1 “Baruch, Jeremiah’s scribe”'
    claim: 'Baruch was in danger with Jeremiah, went with him to Egypt, and much of the book goes back to him'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'At times he was associated with Jeremiah in dangerous situations (36:19, 26; 43:3). Much of the present book of Jeremiah must go back either directly or indirectly to him.'
  - where: 'note 45:1 “Baruch, Jeremiah’s scribe”'
    claim: 'Nothing is known of Baruch after Egypt'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'It is not impossible that Baruch eventually returned to Judah or even journeyed to Babylon to join the exiles there, and was able to relate what took place in Egypt, although there is no evidence one way or the other.'
  - where: 'note 45:1 “A chapter from 605 B.C. placed after the flight to Egypt”'
    claim: 'The Church edition’s footnote on “book” in 45:1 points to Jer. 36:4'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/45?lang=eng'
    quote: 'Jer. 36:4'
  - where: 'note 45:1 “A chapter from 605 B.C. placed after the flight to Egypt”'
    claim: '“These words” are the addresses Baruch wrote in Jehoiakim’s fourth year, related in Jeremiah 36'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/45.htm'
    quote: 'The writing down of the addresses of Jeremiah in the year mentioned is related in Jeremiah 36 ; thus the substance of this chapter and that of Jeremiah 36 agree.'
  - where: 'note 45:1 “A chapter from 605 B.C. placed after the flight to Egypt”'
    claim: 'The message may have been written down later, perhaps when the prophecies were collected in Egypt, and was placed as an appendix to the prophecies about Judah'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/45.htm'
    quote: 'It may have been written down much later, possibly not till the whole of Jeremiah''s prophecies were collected and arranged in Egypt. Moreover, the position occupied by this chapter in the collection shows that this message of comfort to Baruch was added as an appendix'
  - where: 'note 45:3 “Why Baruch grieves”'
    claim: 'Baruch, like Jeremiah, could despair; writing the words of judgment he knew were true may have depressed him and filled him with foreboding about his future'
    key: ot-manual-24
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-24?lang=eng'
    quote: 'It may be that as he dictated Jeremiah’s words of judgment, and knew in his heart that they were true and would certainly come to pass, he became depressed at it all and was filled with foreboding about his own future.'
  - where: 'note 45:3 “Why Baruch grieves”'
    claim: 'The Church edition’s footnote on “rest” in 45:3 points to Lam. 1:3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/45?lang=eng'
    quote: 'Lam. 1:3'
  - where: 'note 45:4 “The words of Jeremiah’s call”'
    claim: 'The Church edition’s footnotes on 45:4 point to Jer. 1:10 and Jer. 31:28'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/45?lang=eng'
    quote: 'Jer. 1:10 . Jer. 31:28'
  - where: 'note 45:4 “The words of Jeremiah’s call”'
    claim: 'Jer. 45:4 uses haras as a participle, “am breaking down”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/jeremiah/45-4.htm'
    quote: 'הֹרֵ֔ס am breaking down'
  - where: 'note 45:4 “The words of Jeremiah’s call”'
    claim: 'Jer. 45:4 uses natash as a participle, “am plucking up”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/jeremiah/45-4.htm'
    quote: 'נֹתֵ֑שׁ am plucking up'
  - where: 'note 45:4 “The words of Jeremiah’s call”'
    claim: 'Jer. 1:10 uses the same four verbs: natash (uproot), haras (throw down), banah (build), nata (plant)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/jeremiah/1-10.htm'
    quote: 'לִנְת֥וֹשׁ to uproot'
  - where: 'note 45:4 “The words of Jeremiah’s call”'
    claim: 'Jer. 1:10 uses haras (throw down)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/jeremiah/1-10.htm'
    quote: 'וְלַהֲר֑וֹס and to throw down'
  - where: 'note 45:5 “Great things in a falling world”'
    claim: '“Great things” is gedolot'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/jeremiah/45-5.htm'
    quote: 'גְדֹל֖וֹת great things'
  - where: 'note 45:5 “Great things in a falling world”'
    claim: '“Evil” in 45:5 is ra‘ah, rendered “disaster”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/jeremiah/45-5.htm'
    quote: 'rā·‘āh רָעָ֤ה disaster'
  - where: 'note 45:5 “Great things in a falling world”'
    claim: 'Seeking great things refers to worldly prosperity; when judgment falls on all, a person should be content with saving his life'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/45.htm'
    quote: 'is here used with reference to worldly prosperity. When the whole world is visited with judgment, an individual man must not make great demands, but be content with saving his life.'
  - where: 'note 45:5 “Great things in a falling world”'
    claim: 'The Church edition’s footnote on “seekest” in 45:5 points to Mark 8:36–37'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/45?lang=eng'
    quote: 'Mark 8:36 (36–37)'
  - where: 'note 45:5 “Your life as the spoil”'
    claim: 'Shalal means prey, spoil, booty; with nephesh it means the life will be spared, Jer. 21:9; 38:2; 39:18; compare 45:5'
    key: bdb
    url: 'https://biblehub.com/hebrew/7998.htm'
    quote: 'prey, spoil, plunder, booty'
  - where: 'note 45:5 “Your life as the spoil”'
    claim: 'BDB: the idiom means the life shall be spared, in Jer. 21:9; 38:2; 39:18, compare 45:5'
    key: bdb
    url: 'https://biblehub.com/hebrew/7998.htm'
    quote: 'i.e. life shall be spared, Jeremiah 21:9 ; Jeremiah 38:2 ; Jeremiah 39:18 , compare Jeremiah 45:5'
  - where: 'note 45:5 “Your life as the spoil”'
    claim: 'The Church edition’s footnote on “prey” points to Jer. 21:9 and 39:18'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/45?lang=eng'
    quote: 'Jer. 21:9 ; 39:18'
  - where: 'note 45:5 “Your life as the spoil”'
    claim: '“Thy life” in 45:5 is nephesh, rendered “your soul”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/jeremiah/45-5.htm'
    quote: 'נַפְשְׁךָ֙ your soul'
  - where: 'christ'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: 'christ'
    claim: 'The Church edition’s footnote on “seekest” in 45:5 points to Mark 8:36–37'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/45?lang=eng'
    quote: 'Mark 8:36 (36–37)'
  - where: 'note 45:5 “Great things in a falling world”'
    claim: 'Chapters 46–51 are prophecies against foreign nations'
    key: bd-jeremiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng'
    quote: 'Jer. 46–51 , prophecies against foreign nations.'
  - where: 'setting'
    claim: 'Chapters 39–44 tell the prophet’s history after the fall of the city; 46–51 are against foreign nations'
    key: bd-jeremiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng'
    quote: 'Jer. 39–44 , the prophet’s history and other events after the fall of the city. Jer. 46–51 , prophecies against foreign nations.'
  - where: 'note 45:4 “The words of Jeremiah’s call”'
    claim: 'Jer. 45:4 uses banah, “I have built” (Strong’s 1129)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/jeremiah/45-4.htm'
    quote: 'בָּנִ֙יתִי֙'
  - where: 'note 45:4 “The words of Jeremiah’s call”'
    claim: 'Jer. 45:4 uses nata‘, “I have planted” (Strong’s 5193)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/jeremiah/45-4.htm'
    quote: 'נָטַ֖עְתִּי'
  - where: 'note 45:4 “The words of Jeremiah’s call”'
    claim: 'Jer. 1:10 uses banah, “to build” (Strong’s 1129)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/jeremiah/1-10.htm'
    quote: 'לִבְנ֖וֹת'
  - where: 'note 45:4 “The words of Jeremiah’s call”'
    claim: 'Jer. 1:10 uses nata‘, “to plant” (Strong’s 5193)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/jeremiah/1-10.htm'
    quote: 'וְלִנְטֽוֹעַ'
  - where: 'setting'
    claim: 'The chapter stands as an appendix to the prophecies concerning Judah and Israel'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/45.htm'
    quote: 'the position occupied by this chapter in the collection shows that this message of comfort to Baruch was added as an appendix to those predictions of Jeremiah which concern Judah and Israel.'
  - where: 'note 45:5 “Great things in a falling world”'
    claim: '“All flesh” is the whole of humanity, as in Jer. 25:31; the sentence is the one announced in Jer. 25'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/45.htm'
    quote: '"upon all flesh," Jeremiah 45:5, i.e., the whole of humanity, as in Jeremiah 25:31. The sentence is passed on all the earth, in accordance with the announcement made in Jeremiah 25:15.'
