page: 01-how-to-read-jeremiah
claims:
  - where: 'section “Start with the six movements”'
    claim: 'The Bible Dictionary organizes Jeremiah by reign, including 1–6 under Josiah.'
    key: bd-jeremiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng
    quote: 'Prophecies of reign of Josiah (626–608), Jer. 1–6.'
  - where: 'section “Let the book move in time”'
    claim: 'Jeremiah prophesied over forty years from 626 to 586 B.C.'
    key: bd-jeremiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng
    quote: 'a period of over 40 years, 626–586 B.C.'
  - where: 'section “Let the book move in time”'
    claim: 'The Bible Dictionary dates Zedekiah’s reign 597–586 B.C.'
    key: bd-jeremiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng
    quote: 'Prophecies under Zedekiah (597–586), Jer. 21–38'
  - where: 'section “Let the book move in time”'
    claim: 'Jehoiachin is called Coniah by Jeremiah; also Jeconiah, Joachin'
    key: bd-jehoiachin
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jehoiachin?lang=eng
    quote: "King of Judah (598 B.C.), also known as Jeconiah, Joachin, Coniah (2 Kgs. 24:6–15; 25:27; 2 Chr. 36:8–9; Jer. 52:31; Ezek. 1:2)."
  - where: 'section “Let the book move in time”'
    claim: 'Jer. 25:9: the Lord names Nebuchadrezzar king of Babylon as His servant bringing the families of the north'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/25?lang=eng
    quote: 'I will send and take all the families of the north, saith the Lord, and Nebuchadrezzar the king of Babylon, my servant'
  - where: 'section “Let the book move in time”'
    claim: 'Jer. 27:6 spells the same king Nebuchadnezzar'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/27?lang=eng
    quote: 'And now have I given all these lands into the hand of Nebuchadnezzar the king of Babylon, my servant'
  - where: 'section “Let the book move in time”'
    claim: 'Chapter 52 is the historical conclusion.'
    key: bd-jeremiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng
    quote: 'Chapter 52 forms a historical conclusion.'
  - where: 'section “Listen for competing voices”'
    claim: 'The Church chapter heading says false prophets who teach lies will be cursed.'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/23?lang=eng
    quote: 'False prophets who teach lies will be cursed.'
