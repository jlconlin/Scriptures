page: 01-how-to-read-jeremiah
claims:
  - where: 'section “Start with the six movements”'
    claim: 'The Bible Dictionary organizes Jeremiah by reign, including 1–6 under Josiah.'
    key: bd-jeremiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng
    quote: 'Prophecies of reign of Josiah (626–608), Jer. 1–6.'
  - where: 'section “Let the book move in time”'
    claim: 'Jeremiah prophesied over forty years from 626 to 586 B.C.'
    key: bd-jeremiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng
    quote: 'a period of over 40 years, 626–586 B.C.'
  - where: 'section “Let the book move in time”'
    claim: 'Chapter 52 is the historical conclusion.'
    key: bd-jeremiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng
    quote: 'Chapter 52 forms a historical conclusion.'
  - where: 'section “Listen for competing voices”'
    claim: 'The Church chapter heading says false prophets who teach lies will be cursed.'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/23?lang=eng
    quote: 'False prophets who teach lies will be cursed.'
  - where: 'section “Read Jeremiah beside Lehi”'
    claim: 'Some of Jeremiah’s prophecies were on the brass plates.'
    key: bd-jeremiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng
    quote: 'Some of Jeremiah’s prophecies were contained in the brass plates of Laban secured by Nephi (1 Ne. 5:10–13).'
