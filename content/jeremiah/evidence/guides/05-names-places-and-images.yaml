page: 05-names-places-and-images
claims:
  - where: 'section “People”'
    claim: 'Jeremiah was a priestly man from Anathoth who served until after Jerusalem fell.'
    key: bd-jeremiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng
    quote: 'Born of a priestly family in Anathoth, and prophesied from the 13th year of Josiah till after the downfall of Jerusalem'
  - where: 'section “Places and peoples”'
    claim: 'Ramah was a place north of Jerusalem.'
    key: bd-ramah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/ramah?lang=eng
    quote: 'At the time of the captivity the exiles were collected here before removal to Babylon'
