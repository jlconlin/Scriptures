page: 02-jeremiahs-world
claims:
  - where: opening
    claim: 'Jeremiah’s ministry ran from 626 to 586 B.C.'
    key: bd-jeremiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng
    quote: 'a period of over 40 years, 626–586 B.C.'
  - where: 'section “The story in one paragraph”'
    claim: 'The captivities of the Israelites include Babylon’s exile of Judah.'
    key: bd-captivities
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/captivities-of-the-israelites?lang=eng
    quote: 'some returned to their homeland under the decree of Cyrus, and others remained in Babylon'
  - where: 'section “Timeline”'
    claim: 'The Bible Dictionary dates Zedekiah’s reign 597–586 B.C.'
    key: bd-jeremiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng
    quote: 'Prophecies under Zedekiah (597–586), Jer. 21–38'
  - where: 'section “The empires at the edges”'
    claim: 'Nebuchadnezzar was Babylon’s great king from 604 to 561 B.C.'
    key: bd-assyria
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/assyria-and-babylonia?lang=eng
    quote: 'Nebuchadnezzar’s chief concern in his reign of 44 years (604–561) was, however, to strengthen and beautify Babylon'
  - where: 'section “The empires at the edges”'
    claim: 'Assyria carried away the northern kingdom.'
    key: bd-assyria
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/assyria-and-babylonia?lang=eng
    quote: 'The siege of Samaria, begun by Shalmaneser (2 Kgs. 17:3–6), was concluded by Sargon'
  - where: 'section “Places to keep in mind”'
    claim: 'Jeremiah was born in a priestly family in Anathoth.'
    key: bd-jeremiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng
    quote: 'Born of a priestly family in Anathoth'
