page: 03-jeremiah-lehi-and-the-restoration
claims:
  - where: 'section “Two prophets in Jerusalem”'
    claim: 'Jeremiah left the fullest surviving account of Jerusalem’s conditions, and the two ministries began with divine calls.'
    key: sc-knowhy-650
    url: https://scripturecentral.org/knowhy/how-did-jeremiahs-and-lehis-ministries-reflect-one-another
    quote: 'Jeremiah left the most extensive and detailed writings about what Jerusalem was like at that time'
  - where: 'section “The brass plates”'
    claim: 'Some of Jeremiah’s prophecies were on the brass plates.'
    key: bd-jeremiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng
    quote: 'Some of Jeremiah’s prophecies were contained in the brass plates of Laban secured by Nephi (1 Ne. 5:10–13).'
  - where: 'section “Nephi knew Jeremiah had been imprisoned”'
    claim: 'A proposed chronology places Nephi’s reference in Jehoiakim’s final year, while another distinguishes a later detailed imprisonment under Zedekiah.'
    key: sc-knowhy-463
    url: https://scripturecentral.org/knowhy/how-could-nephi-have-known-about-jeremiahs-imprisonment
    quote: 'it is possible that Nephi was referring to an imprisonment that began during the last year of the reign of Jehoiakim and continued into the early months of Zedekiah’s reign.'
