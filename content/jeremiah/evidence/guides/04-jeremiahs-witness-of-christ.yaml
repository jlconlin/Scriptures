page: 04-jeremiahs-witness-of-christ
claims:
  - where: opening
    claim: 'Jehovah of the Old Testament is Jesus Christ in His premortal role.'
    key: bd-jehovah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng
    quote: 'Jehovah is the premortal Jesus Christ'
  - where: 'section “The fountain of living waters”'
    claim: 'The Old Testament manual identifies the fountain of living waters as Jesus Christ.'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'Jesus Christ (Jehovah in the Old Testament) is the very “hope of Israel,” the “fountain of living waters”'
  - where: 'section “The shepherd and the Branch”'
    claim: 'A shepherd symbolically cares for the Lord’s children.'
    key: gs-shepherd
    url: https://www.churchofjesuschrist.org/study/scriptures/gs/shepherd?lang=eng
    quote: 'Symbolically, a person who cares for the Lord’s children.'
  - where: 'section “The shepherd and the Branch”'
    claim: 'Messiah is the anointed King in David’s line.'
    key: bd-messiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/messiah?lang=eng
    quote: 'it denotes the King and Deliverer whose coming the Jews were eagerly expecting.'
  - where: 'section “The new covenant”'
    claim: 'The Old Testament manual identifies Jeremiah 30–33 with the latter-day restoration and the new covenant.'
    key: ot-manual-25
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng
    quote: 'Chapters 30–33 deal with the prophet’s predictions of the restoration of Israel and Judah in the last days and of the Lord’s making a new and everlasting covenant with them.'
