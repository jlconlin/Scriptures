  - where: 'note 13:18 “The king and the queen”'
    claim: 'The queen of verse 18 is the queen mother, who in Kings is mentioned alongside almost all the reigning kings'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/13.htm'
    quote: 'the prophet''s discourse is addressed to the king and the queen-mother. The latter as such exercised great influence on the government, and is in the Books of Kings mentioned alongside of almost all the reigning kings'
  - where: 'note 13:18 “The king and the queen”'
    claim: 'Keil says the text does not require Jehoiachin and his mother'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/13.htm'
    quote: 'not necessarily led to think of Jechoniah and his mother in especial'
  - where: 'note 13:18 “The king and the queen”'
    claim: 'Jehoiachin''s mother was Nehushta'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng'
    quote: 'Jehoiachin was eighteen years old when he began to reign, and he reigned in Jerusalem three months. And his mother’s name was Nehushta'
  - where: 'note 13:18 “The king and the queen”'
    claim: 'Jehoiachin went out to the king of Babylon with his mother'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng'
    quote: 'Jehoiachin the king of Judah went out to the king of Babylon, he, and his mother, and his servants, and his princes, and his officers'
  - where: 'note 13:18 “The king and the queen”'
    claim: 'Jeremiah 29:2 lists Jeconiah the king and the queen among those who left Jerusalem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/29?lang=eng'
    quote: 'After that Jeconiah the king, and the queen, and the eunuchs, the princes of Judah and Jerusalem, and the carpenters, and the smiths, were departed from Jerusalem'
  - where: 'note 13:18 “The king and the queen”'
    claim: 'Jeremiah 22 threatens Coniah and his mother with exile'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/22?lang=eng'
    quote: 'And I will cast thee out, and thy mother that bare thee, into another country, where ye were not born; and there shall ye die.'
  - where: 'note 13:19 “Judah carried away”'
    claim: 'The Church edition footnote on verse 19 points to 2 Kings 24:14, 25:11 and 2 Nephi 6:8'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/13?lang=eng'
    quote: '2 Kgs. 24:14 (10–16); 25:11 (1–12); 2 Ne. 6:8.'
  - where: 'note 13:19 “Judah carried away”'
    claim: 'Under Jehoiachin all Jerusalem was carried away save the poorest'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng'
    quote: 'And he carried away all Jerusalem, and all the princes, and all the mighty men of valour, even ten thousand captives, and all the craftsmen and smiths: none remained, save the poorest sort of the people of the land.'
  - where: 'note 13:19 “Judah carried away”'
    claim: 'Nebuzar-adan carried away the rest of the people'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/25?lang=eng'
    quote: 'Now the rest of the people that were left in the city, and the fugitives that fell away to the king of Babylon, with the remnant of the multitude, did Nebuzar-adan the captain of the guard carry away.'
  - where: 'note 13:19 “Judah carried away”'
    claim: 'Jacob says those at Jerusalem have been slain and carried away captive'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/6?lang=eng'
    quote: 'the Lord has shown me that those who were at Jerusalem, from whence we came, have been slain and carried away captive.'
  - where: 'note 13:21 “Friends who become rulers”'
    claim: 'BDB gives alluph as friend, intimate, citing Jeremiah 13:21, and a second alluph as chief'
    key: bdb
    url: 'https://biblehub.com/hebrew/441.htm'
    quote: '2. noun masculine friend, intimate Psalm 55:14 ("" מְיֻדָּע) Micah 7:5 ("" רֵעַ) Proverbs 16:28; Proverbs 17:9; Jeremiah 13:21'
  - where: 'note 13:21 “Friends who become rulers”'
    claim: 'BDB lists a second word alluph meaning chief (1 Chronicles 1:51)'
    key: bdb
    url: 'https://biblehub.com/hebrew/441.htm'
    quote: 'II. אַלּוּף  noun masculine1Chronicles 1:51 chief, chiliarch'
  - where: 'note 13:21 “Friends who become rulers”'
    claim: 'One reading takes the “friends” as the heathen kings Judah courted, Babylon and Egypt'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/13.htm'
    quote: 'the heathen kings, for whose favour Judah had hitherto been intriguing, the Babylonians and Egyptians'
  - where: 'section 5 plain'
    claim: 'The plain words render alluph in verse 21 as friends, following BDB'
    key: bdb
    url: 'https://biblehub.com/hebrew/441.htm'
    quote: '2. noun masculine friend, intimate Psalm 55:14 ("" מְיֻדָּע) Micah 7:5 ("" רֵעַ) Proverbs 16:28; Proverbs 17:9; Jeremiah 13:21'
  - where: 'note 13:22 “Skirts discovered”'
    claim: 'The Church edition footnotes on verse 22: Hosea 2:3 on “skirts” (22a) and the Hebrew “stripped off” for “discovered” (22b)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/13?lang=eng'
    quote: 'Hosea 2:3. HEB stripped off.'
  - where: 'note 13:22 “Skirts discovered”'
    claim: 'Hosea 2:3 threatens an unfaithful wife with being stripped'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/2?lang=eng'
    quote: 'Lest I strip her naked, and set her as in the day that she was born, and make her as a wilderness, and set her like a dry land, and slay her with thirst.'
  - where: 'note 13:23 “The Ethiopian and the leopard”'
    claim: 'Ethiopia or Cush lay south of Egypt, and Jeremiah 13:23 is listed'
    key: bd-ethiopia
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ethiopia?lang=eng'
    quote: 'Extended from Syene on the frontier of Egypt southward to the neighborhood of Khartoum, at the junction of the Blue and White Nile.'
  - where: 'note 13:23 “The Ethiopian and the leopard”'
    claim: 'The verse is not about natural evil but about a people so fixed in evil (the manual quoting The Interpreter''s Bible, 5:928, which was not read)'
    key: ot-manual-23
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng'
    quote: 'He is not saying that men are so necessarily sinners that they are like the Ethiopian or the leopard and can do nothing about it.'
  - where: 'note 13:23 “The Ethiopian and the leopard”'
    claim: 'The cause is that they forgot the Lord, and the disasters follow (the manual quoting The Interpreter''s Bible, 5:928)'
    key: ot-manual-23
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng'
    quote: 'The cause of it is the foundation cause: they have forgotten the Lord. Therefore the disasters come.'
  - where: 'note 13:23 “The Ethiopian and the leopard”'
    claim: 'The Church edition footnote on verse 23 points to Alma 5:40 and D&C 33:4'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/13?lang=eng'
    quote: 'Alma 5:40; D&amp;C 33:4.'
  - where: 'note 13:23 “The Ethiopian and the leopard”'
    claim: 'Alma 5:40 says what is good comes from God and what is evil from the devil'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/5?lang=eng'
    quote: 'whatsoever is good cometh from God, and whatsoever is evil cometh from the devil.'
  - where: 'note 13:23 “The Ethiopian and the leopard”'
    claim: 'D&C 33:4 says the vineyard is corrupted and none doeth good save a few'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/33?lang=eng'
    quote: 'my vineyard has become corrupted every whit; and there is none which doeth good save it be a few'
  - where: 'note 13:24 “Scattered like stubble”'
    claim: 'The Church edition footnote on verse 24 points to 1 Nephi 10:12 and 22:3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/13?lang=eng'
    quote: '1 Ne. 10:12 (12–14); 22:3 (3–4).'
  - where: 'note 13:24 “Scattered like stubble”'
