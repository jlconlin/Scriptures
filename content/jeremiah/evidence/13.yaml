chapter: 13
claims:
  - where: 'when'
    claim: 'The Bible Dictionary groups Jeremiah 7–20 under the reign of Jehoiakim (608–597); chapter 13 itself carries no date'
    key: bd-jeremiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng'
    quote: 'Prophecies under Jehoiakim (608–597), Jer. 7–20.'
  - where: 'setting'
    claim: 'The Church chapter heading summarizes the chapter'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/13?lang=eng'
    quote: 'Israel and Judah will be as a rotted and decayed belt—The people are commanded to repent—Judah will be taken captive and scattered as stubble.'
  - where: 'setting'
    claim: 'Symbolic actions were a common method of Hebrew prophets (read through the Scripture Central API, slug why-does-helaman-7-8-feel-like-a-funeral-speech)'
    key: sc-knowhy-575
    url: 'https://scripturecentral.org/knowhy/why-does-helaman-7-8-feel-like-a-funeral-speech'
    quote: 'such symbolic actions were a common method used by ancient Hebrew prophets to drive home a message.'
  - where: 'setting'
    claim: 'Hiding a linen girdle is one of Jeremiah''s symbolic acts'
    key: sc-knowhy-575
    url: 'https://scripturecentral.org/knowhy/why-does-helaman-7-8-feel-like-a-funeral-speech'
    quote: 'Jeremiah engaged in other symbolic acts as well, like hiding a linen girdle (Jeremiah 13:1–11) and smashing a bottle (Jeremiah 19:1–13).'
  - where: 'setting'
    claim: 'Jeremiah was the leading prophet in Jerusalem alongside Lehi'
    key: ot-manual-23
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng'
    quote: 'was the leading prophet in Jerusalem, serving with Habakkuk, Zephaniah, Lehi, and others (see 1 Nephi 1:4).'
  - where: 'setting'
    claim: 'Lehi''s account opens in the first year of Zedekiah, when many prophets warned the people to repent or Jerusalem would be destroyed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/1?lang=eng'
    quote: 'in that same year there came many prophets, prophesying unto the people that they must repent, or the great city Jerusalem must be destroyed.'
  - where: 'note 13:1 “A linen waistcloth”'
    claim: 'The Hebrew word ezor is a waistcloth, and Jeremiah 13:1 is listed as one of linen'
    key: bdb
    url: 'https://biblehub.com/hebrew/232.htm'
    quote: 'waistcloth (Late Hebrew id., Arabic , compare RSJQ Jan. 1892, 289 ff.) — ׳א absolute Job 12:18 8t; construct 2 Kings 1:8 4t.; — of skin 2 Kings 1:8 (prophet.); of linen Jeremiah 13:1'
  - where: 'note 13:1 “A linen waistcloth”'
    claim: 'Linen was a priestly material, and the girdle stands for the priestly nation'
    key: ot-manual-23
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng'
    quote: 'The linen girdle represents the priestly nation of Judea, since linen was used for priestly garments (see Leviticus 16:4).'
  - where: 'note 13:1 “A linen waistcloth”'
    claim: 'The officiating priest wore a linen girdle among the holy garments'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/16?lang=eng'
    quote: 'shall be girded with a linen girdle, and with the linen mitre shall he be attired: these are holy garments'
  - where: 'note 13:1 “A linen waistcloth”'
    claim: 'Jeremiah was born of a priestly family in Anathoth'
    key: bd-jeremiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng'
    quote: 'Born of a priestly family in Anathoth'
  - where: 'note 13:4 “To the Euphrates”'
    claim: 'The Euphrates was the river on whose banks Babylon stood'
    key: bd-euphrates
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/euphrates?lang=eng'
    quote: 'On the banks of the Euphrates stood the great city of Babylon.'
  - where: 'note 13:4 “To the Euphrates”'
    claim: 'The Hebrew in verses 4–7 reads Perath without nahar (river); a few scholars think another place of that name is meant, but most defend the Euphrates'
    key: bdb
    url: 'https://biblehub.com/hebrew/6578.htm'
    quote: 'נהר omitted Jeremiah 13:4,5,6,7 (where Ew Hi Marti, after SchickZPV iii. ll, think of some other מְּרָת, but Gf Gie and most defend Euphrates)'
  - where: 'note 13:4 “To the Euphrates”'
    claim: 'One reading takes the journey as literal and answers the objection of distance (about 250 miles)'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/13.htm'
    quote: 'the great distance of the Euphrates - about 250 miles - gives us no sufficient reason for departing from the narrative as we have it before us'
  - where: 'note 13:4 “To the Euphrates”'
    claim: 'The text tells of the journey made twice at a twice-repeated command'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/13.htm'
    quote: 'the twice repeated account of the prophet''s journey to the Phrat on the strength of a twice repeated divine command'
  - where: 'note 13:4 “To the Euphrates”'
    claim: 'The account is read as a parable whose details should not be pressed (the manual quoting Sidney B. Sperry, Voice of Israel''s Prophets, p. 167, which was not read)'
    key: ot-manual-23
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng'
    quote: 'The parable, so it seems to me, should not be pressed too far by logical Westerners.'
  - where: 'note 13:4 “To the Euphrates”'
    claim: 'The hiding near the Euphrates could well represent the Babylonian captivity (the manual quoting Sperry, p. 167)'
    key: ot-manual-23
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng'
    quote: 'The coming Captivity into Babylon could well be represented by the hiding of the girdle near the Euphrates.'
  - where: 'note 13:7 “A marred girdle”'
    claim: 'The marred girdle shows the close relationship between God and the people strained to the breaking point (the manual quoting Sperry, p. 167)'
    key: ot-manual-23
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng'
    quote: 'simply indicates that the close relationship between God and the Jews had been strained to the breaking point.'
  - where: 'note 13:7 “A marred girdle”'
    claim: 'The girdle represents the whole house of Israel including Judah (the manual quoting Sperry, p. 167)'
    key: ot-manual-23
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng'
    quote: 'The girdle represents the whole house of Israel, including Judah.'
  - where: 'note 13:7 “A marred girdle”'
    claim: 'By their iniquities the people would be separated from the Lord (the manual quoting Sperry, p. 167)'
    key: ot-manual-23
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng'
    quote: 'By reason of the iniquities of the Lord’s people (in this case the Jews), they will become separated from Him.'
  - where: 'note 13:10 “Stubbornness of heart”'
    claim: 'The Church edition footnote renders the Hebrew behind imagination as stubbornness'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/13?lang=eng'
    quote: 'HEB stubbornness.'
  - where: 'note 13:11 “A people, a name, a praise, a glory”'
    claim: 'Moses uses the same language of the covenant people in Deuteronomy'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/26?lang=eng'
    quote: 'And to make thee high above all nations which he hath made, in praise, and in name, and in honour; and that thou mayest be an holy people unto the Lord thy God, as he hath spoken.'
  - where: 'note 13:11 “A people, a name, a praise, a glory”'
    claim: 'The Church edition links “they would not hear” to 1 Nephi 1:20, where the Jews were angry at Lehi'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/13?lang=eng'
    quote: '1 Ne. 1:20.'
  - where: 'note 13:11 “A people, a name, a praise, a glory”'
    claim: 'Jeremiah 13:11 has the four nouns people, name, praise, glory (am, shem, tehillah, tif''eret)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'lemma="l/5971 a" n="1.1" morph="HR/Ncmsa" id="24Vqg">לְ/עָ֔ם … lemma="c/l/8416" n="1.0" morph="HC/R/Ncfsa" id="243Xt">וְ/לִ/תְהִלָּ֖ה … lemma="c/l/8597" n="1" morph="HC/R/Ncfsa" id="24dTm">וּ/לְ/תִפְאָ֑רֶת'
  - where: 'note 13:11 “A people, a name, a praise, a glory”'
    claim: 'Deuteronomy 26:19 has the same four nouns, praise, name, glory (KJV honour), people'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'lemma="l/8416" n="1.0" morph="HR/Ncfsa" id="0597o">לִ/תְהִלָּ֖ה … lemma="c/l/8034" morph="HC/R/Ncmsa" id="05wny">וּ/לְ/שֵׁ֣ם … lemma="c/l/8597" n="1" morph="HC/R/Ncfsa" id="05iRd">וּ/לְ/תִפְאָ֑רֶת … lemma="5971 a" morph="HNcmsa" id="054yB">עַם'
  - where: 'note 13:11 “A people, a name, a praise, a glory”'
    claim: 'In 1 Nephi 1:20 the Jews were angry with Lehi and sought his life'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/1?lang=eng'
    quote: 'when the Jews heard these things they were angry with him; yea, even as with the prophets of old, whom they had cast out, and stoned, and slain; and they also sought his life'
  - where: 'note 13:12 “Jars, and what fills them”'
    claim: 'BDB lists the Hebrew nebel as skin-bottle or jar, and puts Jeremiah 13:12 under the skin of wine'
    key: bdb
    url: 'https://biblehub.com/hebrew/5035.htm'
    quote: '1 skin-bottle, skin; 2 jar, pitcher; — נֵ֫בֶלabsolute 1 Samuel 10:5 +; construct 1 Samuel 10:3 + (on נֶכֶל see Baer1Samuel 1:24); — 1 skin of wine'
  - where: 'note 13:12 “Jars, and what fills them”'
    claim: 'One reading takes the nebel as an earthenware wine jar standing for man'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/13.htm'
    quote: 'the interpretation, in Jeremiah 13:12-14, of a proverbial saying and the application of it to them'
  - where: 'note 13:12 “Jars, and what fills them”'
    claim: 'The vessel is an earthenware wine jar standing for man'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/13.htm'
    quote: 'an earthenware vessel, especially the wine jar (cf. Isaiah 30:24; Lamentations 4:2), is here the emblem of man'
  - where: 'note 13:12 “Jars, and what fills them”'
    claim: 'Keil reads “dash them” as the figure of jars shivered when knocked together'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/13.htm'
    quote: 'I dash them one against the other, as jars are shivered when knocked together'
  - where: 'note 13:13 “The cup of drunkenness”'
    claim: 'Ezekiel uses the same drunkenness for the judgment on Jerusalem, as the Church edition footnote notes'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/23?lang=eng'
    quote: 'Thou shalt be filled with drunkenness and sorrow, with the cup of astonishment and desolation, with the cup of thy sister Samaria.'
  - where: 'note 13:13 “The cup of drunkenness”'
    claim: 'Jeremiah 25:15 gives the wine cup of the Lord''s fury to the nations'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/25?lang=eng'
    quote: 'Take the wine cup of this fury at my hand, and cause all the nations, to whom I send thee, to drink it.'
  - where: 'note 13:13 “The cup of drunkenness”'
    claim: 'Isaiah 51:17 says Jerusalem has drunk the cup of the Lord''s fury'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/51?lang=eng'
    quote: 'Awake, awake, stand up, O Jerusalem, which hast drunk at the hand of the Lord the cup of his fury'
  - where: 'note 13:15 “Two refrains: pride and hearing”'
    claim: 'The Hebrew in verse 9 for pride is ga''on'
    key: oshb-wlc
