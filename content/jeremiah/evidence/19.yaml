chapter: 19
claims:
  - where: when
    claim: 'The Bible Dictionary places chapters 7–20 under Jehoiakim, 608–597 B.C.'
    key: bd-jeremiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng'
    quote: 'Prophecies under Jehoiakim (608–597), Jer. 7–20 .'
  - where: when
    claim: 'The discourse of chapter 19 was delivered in the reign of Jehoiakim'
    key: ot-manual-23
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng'
    quote: 'Jeremiah’s discourse in 19:1–15 was delivered during the reign of Jehoiakim.'
  - where: setting
    claim: 'Church chapter heading for Jeremiah 19'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/19?lang=eng'
    quote: 'The Lord will bring evil upon Judah—They sacrifice their children to Baal—In the siege they will eat the flesh of their sons and daughters.'
  - where: setting
    claim: 'The breaking of the jar represented the sacking and captivity of Judah'
    key: ot-manual-23
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng'
    quote: 'By the breaking of a potter’s bottle or jar, Jeremiah represented the sacking and captivity of Judah.'
  - where: setting
    claim: 'Chapter 20 opens with Pashur striking Jeremiah and putting him in the stocks after he heard these prophecies'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/20?lang=eng'
    quote: 'Now Pashur the son of Immer the priest, who was also chief governor in the house of the Lord , heard that Jeremiah prophesied these things.'
  - where: thread
    claim: 'Kings says Judah was removed for the sins of Manasseh and the innocent blood he shed, which the Lord would not pardon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng'
    quote: 'to remove them out of his sight, for the sins of Manasseh , according to all that he did; 4 And also for the innocent blood that he shed : for he filled Jerusalem with innocent blood; which the Lord would not pardon.'
  - where: thread
    claim: 'Manasseh restored the Baal cult; Jeremiah found idolatry rampant'
    key: ot-manual-23
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng'
    quote: 'Jeremiah therefore found idolatry, hill-worship, and heathen religious practices rampant among his people.'
  - where: thread
    claim: 'Footnote on tingle (verse 3) points to 2 Kgs 21:12, the word spoken over Manasseh’s Jerusalem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/19?lang=eng'
    quote: '1 Sam. 3:11 ; 2 Kgs. 21:12 .'
  - where: thread
    claim: 'Verse 4’s innocent blood recalls the wording of 2 Kgs 21:16 on Manasseh'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/19.htm'
    quote: 'because our passage recalls the very wording of 2 Kings 21:16 , where, after mentioning his idolatry, it is said of Manasseh'
  - where: thread
    claim: 'The sins in verses 4–5 form a climax, with the child sacrifice worst of all'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/19.htm'
    quote: 'as worst of all abominations, the building of altars for burning their own children to Moloch.'
  - where: section 1 plain
    claim: 'Verse 2’s gate is the Potsherd Gate in a modern rendering'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/jeremiah/19-2.htm'
    quote: 'and go out to the Valley of Ben-hinnom near the entrance of the Potsherd Gate.'
  - where: 'note 19:1 “A finished jar”'
    claim: 'BDB: baqbuq is a flask, named from the gurgling sound of emptying; occurs in 1 Kings 14:3 and Jeremiah 19:1, 10'
    key: bdb
    url: 'https://biblehub.com/hebrew/1228.htm'
    quote: 'flask (from gurgling sound of emptyIng'
  - where: 'note 19:1 “A finished jar”'
    claim: 'Verse 1 calls it a clay jar from a potter'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/jeremiah/19-1.htm'
    quote: 'Go and buy a clay jar from a potter.'
  - where: 'note 19:1 “A finished jar”'
    claim: 'Chapter 18 shows clay reworked; chapter 19 a finished piece; broken pottery cannot be put back; that generation would not be restored'
    key: ot-seminary-guide-jer-18
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-student-study-guide-obs/the-book-of-jeremiah/jeremiah-18-19-pottery-and-judah?lang=eng'
    quote: 'Jeremiah 19 tells about a finished piece of pottery.'
  - where: 'note 19:1 “A finished jar”'
    claim: 'Footnotes on verse 1: potter’s refers to Jer. 18:2; ancients = elders'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/19?lang=eng'
    quote: 'Jer. 18:2 . OR elders.'
  - where: 'note 19:2 “The Potsherd Gate”'
    claim: 'The gate is “the Gate of the Potsherd” in the interlinear'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/jeremiah/19-2.htm'
    quote: 'of the Gate … of the Potsherd'
  - where: 'note 19:2 “The Potsherd Gate”'
    claim: 'Modern translations render it the Potsherd Gate'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/jeremiah/19-2.htm'
    quote: 'and go out to the Valley of Ben-hinnom near the entrance of the Potsherd Gate.'
  - where: 'note 19:2 “The Potsherd Gate”'
    claim: 'BDB: potsherd; gate of potsherds, where they were thrown; it led into the valley of Hinnom'
    key: bdb
    url: 'https://biblehub.com/hebrew/2777.htm'
    quote: 'opening of the gate of potsherds , i.e. where they were thrown (see Jeremiah 19:10 ; Jeremiah 19:11 and Gf); it led into the valley of Hinnom'
  - where: 'note 19:2 “The Potsherd Gate”'
    claim: 'Keil: the name points to the breaking of the jar; which of two city gates is meant cannot be decided'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/19.htm'
    quote: 'The name, gate of חרסוּת, which nowhere else occurs, points no doubt to the breaking to shivers of the jar.'
  - where: 'note 19:2 “The Potsherd Gate”'
    claim: 'Keil: one of two gates into the Hinnom valley, which cannot be decided'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/19.htm'
    quote: 'One of these two must be meant, but which of them it cannot be decided.'
  - where: 'note 19:2 “The Potsherd Gate”'
    claim: 'The valley of Hinnom lay south and west of Jerusalem and was the scene of fire-god worship'
    key: bd-hinnom-valley-of
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hinnom-valley-of?lang=eng'
    quote: 'South and west of Jerusalem, it was the scene of the idolatrous worship of the fire-god Moloch'
  - where: 'note 19:3 “Ears that tingle”'
    claim: 'Footnote on tingle sends the reader to 1 Sam. 3:11 and 2 Kgs. 21:12'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/19?lang=eng'
    quote: '1 Sam. 3:11 ; 2 Kgs. 21:12 .'
  - where: 'note 19:3 “Ears that tingle”'
    claim: '2 Kgs 21:12 is the Lord’s word about Manasseh’s sins, with the same phrase'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/21?lang=eng'
    quote: 'Behold, I am bringing such evil upon Jerusalem and Judah, that whosoever heareth of it, both his ears shall tingle .'
  - where: 'note 19:4 “Making the city a stranger”'
    claim: 'Footnote on estranged: OR alienated'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/19?lang=eng'
    quote: 'OR alienated. TG Idolatry .'
  - where: 'note 19:4 “The blood of innocents”'
    claim: '2 Kgs 21:16: Manasseh filled Jerusalem with innocent blood'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/21?lang=eng'
    quote: 'Moreover Manasseh shed innocent blood very much, till he had filled Jerusalem from one end to another'
  - where: 'note 19:4 “The blood of innocents”'
    claim: 'Footnote on innocents sends the reader to Jer. 2:34'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/19?lang=eng'
    quote: 'Jer. 2:34 (31–37) .'
  - where: 'note 19:4 “The blood of innocents”'
    claim: 'Keil: some take the innocent blood as the children slain for Moloch; Keil reads it as judicial murder or persecution of the godly, recalling 2 Kgs 21:16'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/19.htm'
    quote: 'We therefore understand the filling of Jerusalem with the blood of innocents, according to Jeremiah 7:6 , cf. Jeremiah 2:34 and Jeremiah 22:3 , Jeremiah 22:17 , of judicial murder or of bloody persecution of the godly'
  - where: 'note 19:4 “The blood of innocents”'
    claim: 'Keil: others understand the blood of children slain for Moloch'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/19.htm'
    quote: 'This Grot. and others understand by the blood of the children slain for Moloch'
  - where: 'note 19:5 “Baal and Molech”'
    claim: 'Molech: Ammonite fire god, worshipped by passing children through or burning them in fire; practiced by Ahaz and Manasseh'
    key: bd-molech
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/molech?lang=eng'
    quote: 'The abomination of the children of Ammon, a fire god, worshipped by passing children through or burning them in fire'
  - where: 'note 19:5 “Baal and Molech”'
    claim: 'Jer 32:35 joins the high places of Baal in the valley with passing children through the fire to Molech'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/32?lang=eng'
    quote: 'And they built the high places of Baal, which are in the valley of the son of Hinnom, to cause their sons and their daughters to pass through the fire unto Molech'
  - where: 'note 19:5 “Baal and Molech”'
    claim: 'Footnote on verse 5 sends the reader to Lev 18:21, Jer 32:35, Morm 4:14'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/19?lang=eng'
    quote: 'Lev. 18:21 ; Jer. 32:35 ; Morm. 4:14 .'
  - where: 'note 19:5 “Baal and Molech”'
    claim: 'Mormon 4:14 and 21: Lamanites sacrificed women and children to idols'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/morm/4?lang=eng'
    quote: 'did take many prisoners both women and children, and did offer them up as sacrifices unto their idol gods.'
  - where: 'note 19:6 “The valley of slaughter”'
    claim: 'Topheth: a spot in the valley of Hinnom, south of Jerusalem, where human sacrifices were offered to Molech'
    key: bd-topheth
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/topheth?lang=eng'
    quote: 'A spot in the valley of the son of Hinnom, south of Jerusalem, where human sacrifices were offered to Molech'
  - where: 'note 19:6 “The valley of slaughter”'
    claim: 'Gehenna: the valley of Hinnom, later a refuse burning place, symbolic of torment after death; cites Jer 19:2–6'
    key: bd-gehenna
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/gehenna?lang=eng'
    quote: 'afterwards a place in which the refuse of the city was burned, and for that reason it was symbolic of the place of torment after death'
  - where: 'note 19:7 “Emptying the plans”'
    claim: 'A modern rendering of the verb in verse 7: ruin the plans'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/jeremiah/19-7.htm'
    quote: 'And in this place I will ruin the plans of Judah and Jerusalem.'
  - where: 'note 19:7 “Emptying the plans”'
    claim: 'BDB: baqaq, to empty; figurative make void (object counsel) Jer 19:7; compare Arabic gurgling of a mug emptied'
    key: bdb
    url: 'https://biblehub.com/hebrew/1238.htm'
    quote: 'verb empty (compare probably Arabic make a gurgling noise , of a mug dipped in water, or emptied of water)'
  - where: 'note 19:7 “Emptying the plans”'
    claim: 'Keil: the verb plays on baqbuq; what is poured out comes to nothing'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/19.htm'
    quote: 'There God will make void (בּקּותי, playing on בּקבּק), i.e., bring to nothing; for what is poured out comes to nothing'
  - where: 'note 19:8 “A hissing”'
    claim: 'BDB: sheriqah, (object of derisive) hissing'
    key: bdb
    url: 'https://biblehub.com/hebrew/8322.htm'
    quote: 'noun feminine (object of derisive) hissing'
  - where: 'note 19:8 “A hissing”'
    claim: 'Lam 2:15: passersby hiss at the daughter of Jerusalem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lam/2?lang=eng'
    quote: 'All that pass by clap their hands at thee; they hiss and wag their head at the daughter of Jerusalem'
  - where: 'note 19:8 “A hissing”'
    claim: '1 Ne 19:14–15: those at Jerusalem become a hiss and a byword, then the Lord remembers the covenants'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/19?lang=eng'
    quote: 'and become a hiss and a byword , and be hated among all nations. 15 Nevertheless, when that day cometh, saith the prophet, that they no more turn aside their hearts against the Holy One of Israel'
  - where: 'note 19:9 “The curse of the siege”'
    claim: 'Footnotes on verse 9 send the reader to Lev 26:29, Deut 28:53, Lam 2:20, Ezek 5:10, Isa 9:20, Lam 4:10'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/19?lang=eng'
    quote: 'Lev. 26:29 ; Deut. 28:53 ; Lam. 2:20 ; Ezek. 5:10 . Isa. 9:20 ; Lam. 4:10 .'
  - where: 'note 19:9 “The curse of the siege”'
    claim: 'The prediction was fulfilled during the siege under Nebuchadnezzar (Lam 4:4–10)'
    key: ot-manual-23
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng'
    quote: 'The grim prediction of cannibalism (see v. 9 ) was fulfilled during the siege of Jerusalem under Nebuchadnezzar (see Lamentations 4:4–10 ).'
  - where: 'note 19:11 “Cannot be made whole again”'
    claim: 'Once broken the bottle cannot be made whole; Jews returned after 70 years, but scattered by the Romans; Israel only now being gathered into the covenant'
    key: ot-manual-23
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng'
    quote: 'Although the Jews did return from Babylonian captivity at the end of 70 years, nearly 1,900 years have elapsed since Jerusalem was destroyed and its inhabitants scattered by the Romans, and Israel is only now finally being gathered back into the covenant.'
  - where: 'note 19:11 “Cannot be made whole again”'
    claim: 'This generation of Judah would not be restored to their lands or relationship with the Lord'
    key: ot-seminary-guide-jer-18
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-student-study-guide-obs/the-book-of-jeremiah/jeremiah-18-19-pottery-and-judah?lang=eng'
    quote: 'this particular generation of the people of Judah would not be restored as a people to their lands or to their relationship with the Lord.'
  - where: 'note 19:11 “Cannot be made whole again”'
    claim: 'In chapter 18 the potter throws the clay back on the wheel in a lump and tries again'
    key: ot-seminary-guide-jer-18
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-student-study-guide-obs/the-book-of-jeremiah/jeremiah-18-19-pottery-and-judah?lang=eng'
    quote: 'he throws the clay back on the wheel in a lump and tries again.'
  - where: 'note 19:11 “Cannot be made whole again”'
    claim: 'BD: chapters 30–33 are prophecies of the latter-day restoration of Israel'
    key: bd-jeremiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng'
    quote: 'prophecies of the latter-day restoration of Israel and the gospel covenant'
  - where: 'note 19:13 “Altars on the roofs”'
    claim: 'Josiah defiled Topheth (2 Kgs 23:10) so no one could sacrifice children to Molech'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/23?lang=eng'
    quote: 'And he defiled Topheth , which is in the valley of the children of Hinnom, that no man might make his son or his daughter to pass through the fire to Molech .'
  - where: 'note 19:13 “Altars on the roofs”'
    claim: 'Josiah beat down the rooftop altars of the kings of Judah (2 Kgs 23:12)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/23?lang=eng'
    quote: 'And the altars that were on the top of the upper chamber of Ahaz, which the kings of Judah had made'
  - where: 'note 19:13 “Altars on the roofs”'
    claim: 'Footnote on roofs sends the reader to 2 Kgs 23:12 and Zeph 1:5'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/19?lang=eng'
    quote: '2 Kgs. 23:12 ; Zeph. 1:5 .'
  - where: 'note 19:13 “Altars on the roofs”'
    claim: 'Manasseh worshipped the host of heaven (2 Kgs 21:3)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/21?lang=eng'
    quote: 'and worshipped all the host of heaven, and served them.'
  - where: 'note 19:13 “Altars on the roofs”'
    claim: 'Josiah put down those who burned incense to the sun, moon, planets, and host of heaven (2 Kgs 23:5)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/23?lang=eng'
    quote: 'them also that burned incense unto Baal, to the sun, and to the moon, and to the planets, and to all the host of heaven.'
  - where: 'note 19:14 “From Tophet to the temple court”'
    claim: 'Pashur, chief governor in the temple, smote Jeremiah and put him in the stocks'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/20?lang=eng'
    quote: 'Then Pashur smote Jeremiah the prophet, and put him in the stocks that were in the high gate of Benjamin, which was by the house of the Lord .'
  - where: 'note 19:14 “From Tophet to the temple court”'
    claim: 'BD lists opposition from the priests at 20:2'
    key: bd-jeremiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng'
    quote: 'He had to face continuous opposition and insult from the priests ( 20:2 )'
  - where: christ
    claim: 'Matthew’s quotation may combine Zech 11:12–13 with Jeremiah (perhaps 18:2; 19:1–2), though Matthew cited Jeremiah'
    key: nt-student-manual-10
    url: 'https://www.churchofjesuschrist.org/study/manual/new-testament-student-manual/introduction-to-matthew/chapter-10?lang=eng'
    quote: 'The Old Testament quotation Matthew cited ( Matthew 27:9–10 ) may be a combination of words from Zechariah 11:12–13 and words from the prophet Jeremiah (perhaps Jeremiah 18:2 ; 19:1–2 ), even though Matthew cited Jeremiah as the writer.'
  - where: christ
    claim: 'Early Christian writers sometimes combined Old Testament sources'
    key: nt-student-manual-10
    url: 'https://www.churchofjesuschrist.org/study/manual/new-testament-student-manual/introduction-to-matthew/chapter-10?lang=eng'
    quote: 'Early Christian writers knew the Old Testament prophecies so well that sometimes they combined the information from various sources.'
  - where: christ
    claim: 'Matt 27:7: the potter’s field was bought to bury strangers in'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/27?lang=eng'
    quote: 'And they took counsel, and bought with them the potter’s field, to bury strangers in.'
