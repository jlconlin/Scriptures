chapter: 19
claims:
  - where: 'when'
    claim: 'Jeremiah 7–20 are prophecies under Jehoiakim, 608–597 B.C.'
    key: bd-jeremiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng
    quote: 'Prophecies under Jehoiakim (608–597), Jer. 7–20'
  - where: 'when'
    claim: 'The discourse of 19:1–15 was delivered in Jehoiakim''s reign; no year is given'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'Jeremiah’s discourse in 19:1–15 was delivered during the reign of Jehoiakim.'
  - where: 'setting'
    claim: 'Church chapter heading summarizes the chapter'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/19?lang=eng
    quote: 'The Lord will bring evil upon Judah—They sacrifice their children to Baal—In the siege they will eat the flesh of their sons and daughters.'
  - where: 'note 19:1 “A jar from the potter, and elders to see it”'
    claim: 'The Hebrew word for the bottle is baqbuq, a flask named from the gurgling sound of emptying; it occurs in Jer 19:1, 10'
    key: bdb
    url: https://biblehub.com/hebrew/1228.htm
    quote: 'flask (from gurgling sound of emptyIng, compare Arabic  gurgling sound; also Syriac , cantharus, etc.) — absolute בַּקְבֻּק Jeremiah 19:10'
  - where: 'note 19:1 “A jar from the potter, and elders to see it”'
    claim: 'The vessel in ch. 18 was marred in the potter''s hand and made again; the Lord says Israel is in His hand as clay'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/18?lang=eng
    quote: 'the vessel that he made of clay was marred in the hand of the potter: so he made it again another vessel'
  - where: 'note 19:1 “A jar from the potter, and elders to see it”'
    claim: 'Heber C. Kimball on the potter and clay of Jeremiah 18: pliable clay is a vessel of honor and God receives the obedient'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'all that are pliable in the hands of God and are obedient to His commands, are vessels of honor, and God will receive them.'
  - where: 'note 19:1 “A jar from the potter, and elders to see it”'
    claim: 'The Church edition footnote glosses “ancients” as “elders”'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/19?lang=eng
    quote: 'OR elders.'
  - where: 'note 19:2 “Hinnom, Tophet, and the valley of slaughter”'
    claim: 'Hinnom is south and west of Jerusalem; scene of Moloch worship; afterward a place of refuse; called Gehenna in NT times'
    key: bd-hinnom-valley-of
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/hinnom-valley-of?lang=eng
    quote: 'South and west of Jerusalem, it was the scene of the idolatrous worship of the fire-god Moloch'
  - where: 'note 19:2 “Hinnom, Tophet, and the valley of slaughter”'
    claim: 'Topheth is a spot in the valley of Hinnom where human sacrifices were offered to Molech'
    key: bd-topheth
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/topheth?lang=eng
    quote: 'A spot in the valley of the son of Hinnom, south of Jerusalem, where human sacrifices were offered to Molech'
  - where: 'note 19:2 “Hinnom, Tophet, and the valley of slaughter”'
    claim: 'Josiah defiled Topheth so that no man could make his son or daughter pass through the fire to Molech'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/23?lang=eng
    quote: 'And he defiled Topheth, which is in the valley of the children of Hinnom, that no man might make his son or his daughter to pass through the fire to Molech.'
  - where: 'note 19:2 “Hinnom, Tophet, and the valley of slaughter”'
    claim: 'Jer 7:31–32 has the same charge and the same renaming (valley of slaughter)'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/7?lang=eng
    quote: 'it shall no more be called Tophet, nor the valley of the son of Hinnom, but the valley of slaughter: for they shall bury in Tophet, till there be no place.'
  - where: 'note 19:2 “Hinnom, Tophet, and the valley of slaughter”'
    claim: 'The Church edition footnote to verse 2 links the valley to Josh 18:16'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/19?lang=eng
    quote: 'Josh. 18:16.'
  - where: 'note 19:2 “Hinnom, Tophet, and the valley of slaughter”'
    claim: 'The valley was afterwards a place of refuse and in NT times was called Gehenna'
    key: bd-hinnom-valley-of
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/hinnom-valley-of?lang=eng
    quote: 'and was afterwards used as a place of refuse ( 2 Kgs. 23:10–14 ). In New Testament times it was called Gehenna'
  - where: 'note 19:3 “Ears that tingle”'
    claim: 'The same phrase is used of Eli''s house (1 Sam 3:11) and of Jerusalem under Manasseh (2 Kgs 21:12)'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/21?lang=eng
    quote: 'Behold, I am bringing such evil upon Jerusalem and Judah, that whosoever heareth of it, both his ears shall tingle.'
  - where: 'note 19:3 “Ears that tingle”'
    claim: '1 Sam 3:11 uses the phrase of a thing the Lord will do in Israel'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/3?lang=eng
    quote: 'Behold, I will do a thing in Israel, at which both the ears of every one that heareth it shall tingle.'
  - where: 'note 19:3 “Ears that tingle”'
    claim: 'The Church edition footnote to verse 3 links 1 Sam 3:11 and 2 Kgs 21:12'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/19?lang=eng
    quote: '1 Sam. 3:11; 2 Kgs. 21:12.'
  - where: 'note 19:5 “Burning sons for Baal”'
    claim: 'Law of Moses forbids letting seed pass through the fire to Molech'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/lev/18?lang=eng
    quote: 'And thou shalt not let any of thy seed pass through the fire to Molech'
  - where: 'note 19:5 “Burning sons for Baal”'
    claim: 'Jer 32:35 describes the same practice at the high places of Baal in the valley of Hinnom, with Molech named'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/32?lang=eng
    quote: 'And they built the high places of Baal, which are in the valley of the son of Hinnom, to cause their sons and their daughters to pass through the fire unto Molech; which I commanded them not'
  - where: 'note 19:5 “Burning sons for Baal”'
    claim: 'Mormon records Lamanites offering women and children as sacrifices to idol gods'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/bofm/morm/4?lang=eng
    quote: 'did take many prisoners both women and children, and did offer them up as sacrifices unto their idol gods'
  - where: 'note 19:5 “Burning sons for Baal”'
    claim: 'The Church edition footnote to verse 5 links Lev 18:21, Jer 32:35 and Morm 4:14'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/19?lang=eng
    quote: 'Lev. 18:21; Jer. 32:35; Morm. 4:14.'
  - where: 'note 19:5 “Burning sons for Baal”'
    claim: 'The Church edition footnote to “blood of innocents” (verse 4) links Jer 2:34'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/19?lang=eng
    quote: 'Jer. 2:34 (31–37).'
  - where: 'note 19:5 “Burning sons for Baal”'
    claim: 'Jer 2:34 finds the blood of the poor innocents in Judah''s skirts'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/2?lang=eng
    quote: 'Also in thy skirts is found the blood of the souls of the poor innocents'
  - where: 'note 19:5 “Burning sons for Baal”'
    claim: 'One reading: “blood of innocents” in verse 4 is judicial murder or persecution of the godly, not the Molech offerings, which are first mentioned in verse 5'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/19.htm
    quote: 'We therefore understand the filling of Jerusalem with the blood of innocents, according to Jeremiah 7:6, cf. Jeremiah 2:34 and Jeremiah 22:3, Jeremiah 22:17, of judicial murder or of bloody persecution of the godly'
  - where: 'note 19:7 “Making the counsel void”'
    claim: 'baqaq means to empty; in Jer 19:7 figurative “make void” the counsel; used of emptying the earth in Isa 24:1'
    key: bdb
    url: https://biblehub.com/hebrew/1238.htm
    quote: 'empty, lay waste land, accusative, Isaiah 24:1; Nahum 2:3, also absolute Nahum 2:3; figurative make void (object עֵצָה) Jeremiah 19:7.'
  - where: 'note 19:7 “Making the counsel void”'
    claim: 'baqbuq is a flask named from the gurgling sound of emptying'
    key: bdb
    url: https://biblehub.com/hebrew/1228.htm
    quote: 'flask (from gurgling sound of emptyIng'
  - where: 'note 19:7 “Making the counsel void”'
    claim: 'One reading: the verb in verse 7 plays on the word for the jar; what is poured out comes to nothing'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/19.htm
    quote: 'There God will make void (בּקּותי, playing on בּקבּק), i.e., bring to nothing; for what is poured out comes to nothing'
  - where: 'thread'
    claim: 'The jar''s Hebrew name comes from the gurgling sound of emptying'
    key: bdb
    url: https://biblehub.com/hebrew/1228.htm
    quote: 'flask (from gurgling sound of emptyIng'
  - where: 'thread'
    claim: 'The verb in verse 7 means empty; figuratively make void the counsel'
    key: bdb
    url: https://biblehub.com/hebrew/1238.htm
    quote: 'empty, lay waste land, accusative, Isaiah 24:1; Nahum 2:3, also absolute Nahum 2:3; figurative make void (object עֵצָה) Jeremiah 19:7.'
  - where: 'thread'
    claim: 'One reading: the verb plays on the jar''s name'
    key: keil-jeremiah
    url: https://biblehub.com/commentaries/kad/jeremiah/19.htm
    quote: 'There God will make void (בּקּותי, playing on בּקבּק)'
  - where: 'note 19:9 “A covenant curse, fulfilled in the siege”'
    claim: 'Footnote to verse 9 links to Lev 26:29, Deut 28:53, Lam 2:20, Ezek 5:10'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/19?lang=eng
    quote: 'Lev. 26:29; Deut. 28:53; Lam. 2:20; Ezek. 5:10.'
  - where: 'note 19:9 “A covenant curse, fulfilled in the siege”'
    claim: 'Second footnote to verse 9 links Isa 9:20 and Lam 4:10'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/19?lang=eng
    quote: 'Isa. 9:20; Lam. 4:10.'
  - where: 'note 19:9 “A covenant curse, fulfilled in the siege”'
    claim: 'Lam 4:10 records the siege fulfilling this'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/lam/4?lang=eng
    quote: 'The hands of the pitiful women have sodden their own children: they were their meat in the destruction of the daughter of my people.'
  - where: 'note 19:9 “A covenant curse, fulfilled in the siege”'
    claim: 'The prediction of cannibalism was fulfilled during Nebuchadnezzar''s siege (Lam 4:4–10)'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'The grim prediction of cannibalism (see v. 9) was fulfilled during the siege of Jerusalem under Nebuchadnezzar (see Lamentations 4:4–10).'
  - where: 'note 19:11 “Cannot be made whole again”'
    claim: 'Breaking the bottle represents the sacking and captivity of Judah; return after 70 years, yet Israel is only now being gathered into the covenant'
    key: ot-manual-23
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-23?lang=eng
    quote: 'Once broken, the bottle “cannot be made whole again.” Although the Jews did return from Babylonian captivity at the end of 70 years, nearly 1,900 years have elapsed since Jerusalem was destroyed'
  - where: 'note 19:11 “Cannot be made whole again”'
    claim: 'Jer 18:7–11 states the condition: a nation warned of destruction that turns from evil will be spared; Judah is invited to return'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/18?lang=eng
    quote: 'If that nation, against whom I have pronounced, turn from their evil, I will repent of the evil that I thought to do unto them.'
  - where: 'note 19:13 “Incense on the roofs”'
    claim: 'Josiah beat down the altars on top of the upper chamber of Ahaz'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/23?lang=eng
    quote: 'And the altars that were on the top of the upper chamber of Ahaz, which the kings of Judah had made'
  - where: 'note 19:13 “Incense on the roofs”'
    claim: 'Footnote to verse 13 links to 2 Kgs 23:12 and Zeph 1:5'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/19?lang=eng
    quote: '2 Kgs. 23:12; Zeph. 1:5.'
  - where: 'note 19:13 “Incense on the roofs”'
    claim: 'Josiah defiled Topheth so that no one could make a child pass through the fire'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/23?lang=eng
    quote: 'And he defiled Topheth, which is in the valley of the children of Hinnom, that no man might make his son or his daughter to pass through the fire to Molech.'
  - where: 'christ'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: 'christ'
    claim: 'The KJV renders the name Jehovah as LORD in small capitals'
    key: bd-jehovah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng
    quote: 'In the KJV, the Jewish custom has been followed, and the name is generally denoted by Lord or God , printed in small capitals.'
  - where: 'explore'
    claim: 'The valley of Hinnom was called Gehenna in NT times and was symbolic of the place of torment'
    key: bd-hinnom-valley-of
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/hinnom-valley-of?lang=eng
    quote: 'In New Testament times it was called Gehenna and was regarded by the Jews as symbolic of the place of torment.'
