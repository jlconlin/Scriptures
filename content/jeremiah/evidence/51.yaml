chapter: 51
claims:
  - where: 'setting'
    claim: 'Church chapter heading summarizes the chapter'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/51?lang=eng'
    quote: 'Judgment, destruction, and desolation will come upon Babylon for her sins—Israel is commanded, Flee from Babylon—Israel is the Lord’s rod to destroy all kingdoms.'
  - where: 'setting'
    claim: 'Chapter 51 continues the prophecy of chapter 50'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'This chapter is a continuation of the prophecy in chapter 50.'
  - where: 'setting'
    claim: 'Jeremiah 50–51 was written and sent to Babylon in Zedekiah’s days'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'Jeremiah 50–51was written and sent to Babylon in the days of Zedekiah (see Jeremiah 51:59–64).'
  - where: 'setting'
    claim: 'Chapters 50–51 in present form are later than Jeremiah; ch. 46–51 are prophecies against foreign nations'
    key: bd-jeremiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng'
    quote: 'Jer. 46–51 , prophecies against foreign nations. Chapters 50–51 in their present form are later than Jeremiah.'
  - where: 'setting'
    claim: 'Zedekiah reigned 597–586 B.C.'
    key: bd-jeremiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng'
    quote: 'Prophecies under Zedekiah (597–586), Jer. 21–38'
  - where: 'setting'
    claim: 'After Assyria’s fall Babylon became Nebuchadnezzar’s capital; the Euphrates ran through the middle'
    key: bd-babylon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/babylon?lang=eng'
    quote: 'After the downfall of Assyria, Babylon became Nebuchadnezzar’s capital. He built an enormous city of which the ruins still remain. The city was square, and the Euphrates ran through the middle of it.'
  - where: 'setting'
    claim: 'Chapter 50 opens with the word the Lord spake against Babylon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/50?lang=eng'
    quote: 'The word that the Lord spake against Babylon and against the land of the Chaldeans by Jeremiah the prophet.'
  - where: 'when'
    claim: 'Seraiah went with Zedekiah to Babylon in his fourth year, which falls about 594 B.C. on the Bible Dictionary’s dates (597–586)'
    key: bd-jeremiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeremiah?lang=eng'
    quote: 'Prophecies under Zedekiah (597–586), Jer. 21–38'
  - where: 'thread'
    claim: 'The prophecies have a dual nature, and Babylon is an archetype of the world'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'They are difficult to interpret unless two principles of Hebrew prophecy are accepted: the dual nature of many prophecies, and the recurring use of archetypes and metaphors.'
  - where: 'thread'
    claim: 'Babylon destroyed anciently is a prototype of Babylon the Great'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'the downfall anciently of Nebuchadnezzar’s Babylon was a prototype of the future downfall of “Babylon the Great” (see Revelation 18–19).'
  - where: 'note 51:1 “A destroying wind”'
    claim: 'The destroying wind is the hot dry east wind, a metaphor for the Lord’s power over Babylon'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'is the east wind because it is hot and dry from the desert and carries with it particles of sand that do much damage. The metaphor here is used to mean the power of the Lord in destroying Babylon.'
  - where: 'note 51:1 “A destroying wind”'
    claim: 'Jer. 4:11 describes a dry wind against Judah; the Church edition links verse 1 there'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/4?lang=eng'
    quote: 'A dry wind of the high places in the wilderness toward the daughter of my people, not to fan, nor to cleanse'
  - where: 'note 51:1 “A destroying wind”'
    claim: 'Church edition footnote on verse 1 points to Jer. 4:11'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/51?lang=eng'
    quote: 'Jer. 4:11 (11–13) .'
  - where: 'note 51:1 “A destroying wind”'
    claim: 'Church edition footnote on “fanners” gives alternate rendering “strangers who shall scatter her”, and links Isa. 41:16 and Matt. 3:12 (winnowing)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/51?lang=eng'
    quote: 'OR  strangers who shall scatter her.  Isa. 41:16 ;  Jer. 15:7 ;  Matt. 3:12 .'
  - where: 'note 51:1 “A cipher for Chaldea”'
    claim: 'Hebrew of 51:1 reads lev qamai (heart of my adversaries)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'לֵ֣ב קָמָ֑י'
  - where: 'note 51:1 “A cipher for Chaldea”'
    claim: 'Atbash: Chaldea is represented by lev qamai; the alphabet put in inverse order'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/25.htm'
    quote: 'the letters of the alphabet were put one for the other in the inverse order (ת for א, שׁ for ב, etc.)'
  - where: 'note 51:1 “A cipher for Chaldea”'
    claim: 'Sheshach is a name for Babylon, and Jer. 51:1 is a like example'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/25.htm'
    quote: 'שׁשׁך is, according to Jeremiah 51:41, a name for Babylon'
  - where: 'note 51:1 “A cipher for Chaldea”'
    claim: 'Keil: lev qamai means “the heart of mine adversaries”; Chaldea is the centre of God’s enemies, and Rev. 17:5 calls Babylon the mother of harlots'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/51.htm'
    quote: 'lit., "the heart of mine adversaries," is the word כּשׂדּים, changed, according to the canon Atbash (see on Jeremiah 25:26), for the purpose of obtaining the important meaning that Chaldea is the centre of God''s enemies.'
  - where: 'note 51:1 “A cipher for Chaldea”'
    claim: 'Jer. 51:41 sets Sheshach beside Babylon in parallel lines (Hebrew)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'אֵ֚יךְ נִלְכְּדָ֣ה שֵׁשַׁ֔ךְ'
  - where: 'note 51:1 “A cipher for Chaldea”'
    claim: 'Jer. 25:26 “the king of Sheshach shall drink after them”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/25?lang=eng'
    quote: 'and the king of Sheshach shall drink after them.'
  - where: 'note 51:1 “A cipher for Chaldea”'
    claim: 'Rev. 17:5 “Mother of Harlots”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/17?lang=eng'
    quote: 'Babylon the Great, the Mother of Harlots and Abominations of the Earth'
  - where: 'note 51:5 “Not forsaken”'
    claim: 'Isa. 54:7 “for a small moment have I forsaken thee; but with great mercies will I gather thee”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/54?lang=eng'
    quote: 'For a small moment have I forsaken thee; but with great mercies will I gather thee.'
  - where: 'note 51:5 “Not forsaken”'
    claim: 'Church edition footnote on “forsaken” (verse 5) is Isa. 54:5–8'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/51?lang=eng'
    quote: 'Isa. 54:5 (5–8) .'
  - where: 'note 51:6 “Go ye out of Babylon”'
    claim: 'D&C 133:5, 7, 14 command to go out of Babylon, which is spiritual Babylon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/133?lang=eng'
    quote: 'Go ye out of Babylon; gather ye out from among the nations, from the four winds, from one end of heaven to the other.'
  - where: 'note 51:6 “Go ye out of Babylon”'
    claim: 'D&C 133:14'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/133?lang=eng'
    quote: 'Go ye out from among the nations, even from Babylon , from the midst of wickedness , which is spiritual Babylon.'
  - where: 'note 51:6 “Go ye out of Babylon”'
    claim: 'Rev. 18:4 voice from heaven'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/18?lang=eng'
    quote: 'Come out of her, my people, that ye be not partakers of her sins'
  - where: 'note 51:6 “Go ye out of Babylon”'
    claim: 'The Saints are commanded to flee Babylon (D&C 133:5, 7, 14–15; Jer. 51:6; Rev. 18:2–4)'
    key: doctrines-gospel-35
    url: 'https://www.churchofjesuschrist.org/study/manual/doctrines-of-the-gospel-student-manual/35-fall-of-babylon-and-establishment-of-zion?lang=eng'
    quote: 'The Saints of God are commanded to flee out of the midst of Babylon (see D&amp;C 133:5, 7, 14–15; Jeremiah 51:6; Revelation 18:2–4).'
  - where: 'note 51:6 “Go ye out of Babylon”'
    claim: 'Babylon is a symbol of the world; Israel charged to flee wickedness and save own souls'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'Because Babylon is also a symbol of the world, a charge was given Israel to flee from her wickedness and to be responsible for saving their own souls (see v. 6).'
  - where: 'note 51:6 “Go ye out of Babylon”'
    claim: 'McConkie: Babylon is the world with all its carnality and wickedness; false religion in all its forms'
    key: doctrines-gospel-35
    url: 'https://www.churchofjesuschrist.org/study/manual/doctrines-of-the-gospel-student-manual/35-fall-of-babylon-and-establishment-of-zion?lang=eng'
    quote: '“In prophetic imagery, Babylon is the world with all its carnality and wickedness. Babylon is the degenerate social order created by lustful men who love darkness rather than light because their deeds are evil.'
  - where: 'note 51:6 “Go ye out of Babylon”'
    claim: 'McConkie: Babylon is false and degenerate religion'
    key: doctrines-gospel-35
    url: 'https://www.churchofjesuschrist.org/study/manual/doctrines-of-the-gospel-student-manual/35-fall-of-babylon-and-establishment-of-zion?lang=eng'
    quote: 'Babylon is false and degenerate religion in all its forms and branches.'
  - where: 'note 51:6 “Go ye out of Babylon”'
    claim: 'Stone: ancient Babylon sensual, decadent, corrupt; principal building a temple to a false god'
    key: stone-zion-babylon
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2006/04/zion-in-the-midst-of-babylon?lang=eng'
    quote: 'Babylon was, in the time of ancient Israel, a city which had become sensual, decadent, and corrupt. The principal building in the city was a temple to a false god, which we often refer to as Bel or Baal.'
  - where: 'note 51:7 “A golden cup in the Lord''s hand”'
    claim: 'Jer. 25:15 the wine cup of fury taken from the Lord’s hand for the nations to drink'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/25?lang=eng'
    quote: 'Take the wine cup of this fury at my hand, and cause all the nations , to whom I send thee, to drink it.'
  - where: 'note 51:7 “A golden cup in the Lord''s hand”'
    claim: 'Rev. 17:4 golden cup in the woman’s hand'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/17?lang=eng'
    quote: 'having a golden cup in her hand full of abominations and filthiness of her fornication'
  - where: 'note 51:7 “A golden cup in the Lord''s hand”'
    claim: 'Israelite prophets wrote of Babylon’s destruction (including Jer. 51:6–8) and John drew on their language'
    key: nt-student-manual-56
    url: 'https://www.churchofjesuschrist.org/study/manual/new-testament-student-manual/revelation/chapter-56-revelation-17-22?lang=eng'
    quote: 'Israelite prophets in turn wrote about the eventual destruction of Babylon (see Isaiah 13:19–22; 21:9; Jeremiah 50:35–36, 40; 51:6–8), and John drew upon their language'
  - where: 'note 51:7 “A golden cup in the Lord''s hand”'
    claim: 'Chapters 17–18 depict Babylon holding a cup; Babylon is the antithesis of Zion'
    key: nt-student-manual-56
    url: 'https://www.churchofjesuschrist.org/study/manual/new-testament-student-manual/revelation/chapter-56-revelation-17-22?lang=eng'
    quote: 'Chapters 17–18 depict Babylon as a “whore” holding a cup “full of abominations and filthiness”'
  - where: 'note 51:9 “Who is speaking in verse 9”'
    claim: 'God would have healed his children but they resist, like Babylon, and are not healed'
    key: ot-manual-25
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-25?lang=eng'
    quote: 'God would have healed them, as He would all His children, before their destruction, but sometimes, like Babylon, they resist turning to the Lord and therefore are not healed (see v. 9).'
  - where: 'note 51:9 “Who is speaking in verse 9”'
    claim: 'Those addressed in v. 9 are nations vanquished by Babylon and detained in the city, of which Israel was one; “every one to his own land” points to men out of different lands'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/51.htm'
    quote: 'The latter view is opposed by the words which follow, "Let every one go to his own country;" this points to men out of different lands.'
  - where: 'note 51:9 “Who is speaking in verse 9”'
    claim: 'Those addressed are the nations vanquished and detained in the city, of which Israel was one'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/51.htm'
    quote: 'Those addressed are rather the nations that had been vanquished by Babylon and detained in the city, of which Israel was one.'
  - where: 'note 51:9 “Who is speaking in verse 9”'
    claim: 'Jer. 46:11 balm and medicines in vain (Egypt); Church edition links verse 8 there'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/46?lang=eng'
    quote: 'Go up into Gilead, and take balm , O virgin, the daughter of Egypt: in vain shalt thou use many medicines; for thou shalt not be cured.'
  - where: 'note 51:9 “Who is speaking in verse 9”'
    claim: 'Church edition footnote on verse 8 balm is Jer. 46:11'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/51?lang=eng'
    quote: 'Jer. 46:11 .'
  - where: 'note 51:9 “Who is speaking in verse 9”'
    claim: 'Rev. 18:5 “sins have reached unto heaven”; Church edition links v. 9 “judgment” there'
    key: nt-student-manual-56
    url: 'https://www.churchofjesuschrist.org/study/manual/new-testament-student-manual/revelation/chapter-56-revelation-17-22?lang=eng'
    quote: '“sins have reached unto heaven, and God hath remembered her iniquities” (Revelation 18:5)'
  - where: 'note 51:9 “Who is speaking in verse 9”'
    claim: 'Church edition footnote on verse 9 “judgment” is Rev. 18:5'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/51?lang=eng'
    quote: 'Rev. 18:5 (4–5) .'
  - where: 'note 51:11 “Why the Medes”'
    claim: 'Media lay between the Caspian Sea and Elam; Cyaxares joined Nabopolassar against Nineveh; Cyrus defeated Astyages (550) and united Media with Persia'
    key: bd-media
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/media?lang=eng'
    quote: 'The country between the Caspian Sea and Elam, bounded by Mount Zagros on the west and Parthia on the east.'
  - where: 'note 51:11 “Why the Medes”'
    claim: 'Cyaxares and Nabopolassar overthrew Nineveh; Cyrus united Media with Persia'
    key: bd-media
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/media?lang=eng'
    quote: 'Cyrus, by his defeat of Astyages (550  B.C. ), gained possession of Media, which he united with the Persian kingdom.'
  - where: 'note 51:11 “Why the Medes”'
    claim: 'Median king Cyaxares joined Nabopolassar in overthrowing Nineveh'
    key: bd-media
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/media?lang=eng'
    quote: 'the Median king Cyaxares joined with the Babylonian king Nabopolassar in the overthrow of Nineveh.'
  - where: 'note 51:11 “Why the Medes”'
    claim: 'Cyrus first king of the Persians and Medes; captured Babylon and overthrew the Chaldean dynasty'
    key: bd-cyrus
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/cyrus?lang=eng'
    quote: 'The first king of the Persians and Medes. He captured Babylon and overthrew the Chaldean dynasty'
  - where: 'note 51:11 “Why the Medes”'
    claim: 'Isaiah 13:17 “I will stir up the Medes against them”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/13?lang=eng'
    quote: 'Behold, I will stir up the Medes against them, which shall not regard silver; and as for gold, they shall not delight in it.'
  - where: 'note 51:11 “Why the Medes”'
    claim: 'Dan. 5:31 Darius the Median took the kingdom'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/5?lang=eng'
    quote: 'And Darius the Median took the kingdom, being about threescore and two years old.'
  - where: 'note 51:11 “Why the Medes”'
    claim: 'Lam. 1:10 the heathen entered the sanctuary (the temple profaned)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lam/1?lang=eng'
    quote: 'she hath seen that the heathen entered into her sanctuary'
  - where: 'note 51:13 “Babylon on many waters”'
    claim: 'Euphrates ran through the middle of Babylon'
    key: bd-babylon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/babylon?lang=eng'
    quote: 'The city was square, and the Euphrates ran through the middle of it.'
  - where: 'note 51:13 “Babylon on many waters”'
    claim: 'Rev. 17:1 great whore that sitteth upon many waters'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/17?lang=eng'
    quote: 'the judgment of the great whore that sitteth upon many waters'
  - where: 'note 51:13 “Babylon on many waters”'
    claim: 'Rev. 17:15 the waters are peoples, multitudes, nations, tongues'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/17?lang=eng'
    quote: 'The waters which thou sawest, where the whore sitteth, are peoples, and multitudes, and nations, and tongues.'
  - where: 'note 51:13 “Babylon on many waters”'
    claim: 'Nephi’s vision: the whore of all the earth sat upon many waters and had dominion over all nations'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/14?lang=eng'
    quote: 'I looked and beheld the whore of all the earth, and she sat upon many waters ; and she had dominion over all the earth, among all nations, kindreds, tongues, and people.'
  - where: 'note 51:13 “Babylon on many waters”'
    claim: 'Church edition footnote on “waters” (v. 13) points to Rev. 17:1 and 1 Ne. 14:11'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/51?lang=eng'
    quote: 'Rev. 17:1 (1–5) ;  1 Ne. 14:11 .'
  - where: 'note 51:13 “Babylon on many waters”'
    claim: 'John’s vision parallels much of Nephi’s vision of the great and abominable church'
    key: nt-student-manual-56
    url: 'https://www.churchofjesuschrist.org/study/manual/new-testament-student-manual/revelation/chapter-56-revelation-17-22?lang=eng'
    quote: 'John’s vision of Babylon parallels much of Nephi’s vision of the great and abominable church'
  - where: 'note 51:15 “The Maker against the idols”'
    claim: 'Jer. 10:12–16 has the same lines (Church text)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/10?lang=eng'
    quote: 'He hath made the earth by his power, he hath established the world by his wisdom, and hath stretched out the heavens by his discretion.'
  - where: 'note 51:15 “The Maker against the idols”'
    claim: 'Jer. 10:14 molten image has no breath'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/10?lang=eng'
    quote: 'for his molten image is falsehood, and there is no breath in them.'
  - where: 'note 51:15 “The Maker against the idols”'
    claim: 'D&C 1:16 the image of his own god… shall perish in Babylon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/1?lang=eng'
    quote: 'every man walketh in his own way , and after the image of his own god, whose image is in the likeness of the world, and whose substance is that of an idol, which waxeth old and shall perish in Babylon'
  - where: 'note 51:15 “The Maker against the idols”'
    claim: 'Church edition footnote on “graven image” (v. 17) is D&C 1:16'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/51?lang=eng'
    quote: 'D&amp;C 1:16 .'
  - where: 'note 51:15 “The Maker against the idols”'
    claim: 'Church edition footnote offers “creator” for “former”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/51?lang=eng'
    quote: 'OR  creator.'
  - where: 'note 51:20 “Who is the battle axe?”'
    claim: 'Church chapter heading: Israel is the Lord’s rod to destroy all kingdoms'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/51?lang=eng'
    quote: 'Israel is the Lord’s rod to destroy all kingdoms.'
  - where: 'note 51:20 “Who is the battle axe?”'
    claim: 'Verse 19 ends “Israel is the rod of his inheritance”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/51?lang=eng'
    quote: 'Israel is the rod of his inheritance'
  - where: 'note 51:20 “Who is the battle axe?”'
    claim: 'Keil: Babylon is compared to a hammer used to break nations, and afterwards requited; other views (Israel, Cyrus)'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/51.htm'
    quote: 'In Jeremiah 51:20-24 Babylon is compared to a hammer, which God uses for the purpose of beating to pieces nations and kingdoms, with their forces and their inhabitants, but on which He will afterwards requite the evil done to Zion.'
  - where: 'note 51:25 “A mountain made a burnt mountain”'
    claim: 'Church edition footnote on “destroying mountain” says Babylon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/51?lang=eng'
    quote: 'IE  Babylon.'
  - where: 'note 51:25 “A mountain made a burnt mountain”'
    claim: 'Isa. 13:20 “It shall never be inhabited”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/13?lang=eng'
    quote: 'It shall never be inhabited , neither shall it be dwelt in from generation to generation'
  - where: 'note 51:25 “A mountain made a burnt mountain”'
    claim: 'Babylon is a mountain as being a powerful kingdom; destruction means the physical and moral ruin Babylon brought on nations'
    key: keil-jeremiah
    url: 'https://biblehub.com/commentaries/kad/jeremiah/51.htm'
    quote: 'Babylon is a "mountain," as being a powerful kingdom, supereminent above others'
  - where: 'note 51:25 “A mountain made a burnt mountain”'
