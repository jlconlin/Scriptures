chapter: 41
title: The Governor Murdered at Mizpah
tagline: A prince of David's line murders the governor Babylon appointed, and the frightened remnant turns toward Egypt, stopping near Bethlehem.
when: 'The seventh month, after the fall of Jerusalem (586 B.C. by the Bible Dictionary); the chapter does not name the year'

setting: |
  Jerusalem has fallen and most of its people are in exile. Nebuchadnezzar left “the poor of the land” behind and made Gedaliah, son of Ahikam, “ruler” over them ([[2 Kgs. 25:12]], [[2 Kgs. 25:22]]). Gedaliah governed from Mizpah, and Jeremiah, freed by the Babylonians, “dwelt with him among the people that were left in the land” ([[Jer. 40:6]]). Jews who had fled to Moab, Ammon, and Edom came back, and the harvest was large ([[Jer. 40:11–12]]).

  Chapter 41 ends that fragile peace. It belongs with the chapters on either side: chapter 40 sets the scene and warns of the plot; chapter 42 asks what the Lord says about the way out. The same murder is told briefly in [[2 Kgs. 25:25–26]].

  The events fall in “the seventh month.” The chapter gives no year; one reading reasons that it came only about two months after the destruction of Jerusalem.

thread: |
  Jeremiah 41 is a chapter in which the Lord never speaks. The word “LORD” appears once, in the phrase “the house of the LORD” (verse 5), and Jeremiah himself is never named. Everything is done by men: a royal prince who murders his host, a company of mourners cut down on the road to a ruined sanctuary, an army captain who rescues the captives, and a frightened remnant that decides, in the last two verses, to go to Egypt.

  The chapter's question is what the survivors do with their fear. They are afraid of Babylon, and the murder gives them reason. Gedaliah's advice had been to “serve the king of Babylon, and it shall be well with you” ([[Jer. 40:9]]). The next chapter shows what happens when they ask for the Lord's word about their plan and then refuse it ([[Jer. 42:2]], [[Jer. 42:14]]). Chapter 41 is the road that leads there, and it ends by Bethlehem, on the way to Egypt.

sections:
  - range: 1-3
    heading: The meal and the murders
    plain: |
      In the seventh month Ishmael son of Nethaniah, son of Elishama, of the royal family, came with ten men to Gedaliah at Mizpah, and they ate together. Then Ishmael and his ten men got up and killed Gedaliah, whom the king of Babylon had made governor, with the sword. He also killed all the Jews who were with Gedaliah at Mizpah, and the Babylonian soldiers who were there.
  - range: 4-9
    heading: The mourners and the pit
    plain: |
      The next day, before anyone knew, eighty men came from Shechem, Shiloh, and Samaria, with beards shaved, clothes torn, and cuts on their bodies, carrying offerings and incense to the house of the Lord. Ishmael went out to meet them, weeping as he walked, and said, “Come to Gedaliah.” When they were inside the town he killed them and threw the bodies into a pit. Ten of them said, “Don't kill us, we have hidden stores of wheat, barley, oil, and honey in the field,” and he spared them. The pit was the one King Asa had made long before, against Baasha king of Israel.
  - range: 10-15
    heading: Captives taken and rescued
    plain: |
      Ishmael took captive everyone left in Mizpah, the king's daughters among them, all of whom Nebuzaradan had put in Gedaliah's charge, and set out for Ammon. Johanan son of Kareah and the other army captains heard what Ishmael had done and went to fight him. They found him by the great waters, or pools, at Gibeon. When the captives saw Johanan they were glad, turned around, and went to him. Ishmael escaped with eight men and reached Ammon.
  - range: 16-18
    heading: To Chimham, near Bethlehem
    plain: |
      Johanan and the captains led the people they had recovered, soldiers, women, children, and eunuchs, away from Gibeon. They stopped at the habitation of Chimham near Bethlehem, on their way to Egypt, because they were afraid of the Babylonians: Ishmael had killed Gedaliah, whom the king of Babylon had made governor.

notes:
  - ref: 1
    phrase: Ishmael the son of Nethaniah the son of Elishama, of the seed royal
    kind: history
    title: A guest who came to kill
    body: |
      Ishmael, a man of royal blood, came to Gedaliah as a guest and was received as one. “Of the seed royal” means he came from the royal family of Judah, and 2 Kings records the same title ([[2 Kgs. 25:25]]). One reading identifies his grandfather Elishama with a son of David of that name, which would make Ishmael “a lateral branch of the house of David.” That is a suggestion, not something the text states.

      The motive is not given in this chapter. An earlier warning names it: “Baalis the king of the Ammonites hath sent Ishmael the son of Nethaniah to slay thee” ([[Jer. 40:14]]). Gedaliah had been told, and Johanan had even offered to kill Ishmael quietly, but Gedaliah answered, “Thou shalt not do this thing: for thou speakest falsely of Ishmael” ([[Jer. 40:15–16]]). So the guest who “did eat bread” at his table was a man the governor had been warned about and refused to suspect. Why Baalis wanted Gedaliah dead is not stated.
    sources: [lds-scriptures, keil-jeremiah]
  - ref: 2
    phrase: Gedaliah the son of Ahikam the son of Shaphan
    kind: history
    title: Gedaliah, son of Ahikam
    body: |
      Gedaliah came from a family that had served Josiah and had stood by Jeremiah; see the note on [[Jer. 40:5]]. When Jerusalem fell, the Babylonians took Jeremiah “out of the court of the prison, and committed him unto Gedaliah” ([[Jer. 39:14]]).

      Gedaliah's policy was what Jeremiah had urged: “Fear not to serve the Chaldeans: dwell in the land, and serve the king of Babylon, and it shall be well with you” ([[Jer. 40:9]]). The refugees who returned from Moab, Ammon, and Edom gathered “wine and summer fruits very much” ([[Jer. 40:12]]). The murder ended Gedaliah's government, and with it that settlement.
    sources: [lds-scriptures]
  - ref: 5
    phrase: from Shechem, from Shiloh, and from Samaria
    kind: history
    title: Eighty men from Shechem, Shiloh, and Samaria
    body: |
      Eighty men came from Shechem, Shiloh, and Samaria, bound for the house of the LORD, and the text does not say who they were. One reading takes them to be “pious descendants of the Israelites who belonged to the kingdom of Israel” who still worshipped in Jerusalem. On that reading they came “even after the destruction of Jerusalem” with grain offerings and incense on the site of the sanctuary, “with all the signs of deep sorrow” for its destruction. The text itself says only that they were going “to bring them to the house of the LORD.”
    sources: [keil-jeremiah]
  - ref: 5
    phrase: having their beards shaven, and their clothes rent, and having cut themselves
    kind: history
    title: Beards shaven, cuts in the flesh
    body: |
      Shaved beards, torn clothes, and cuts in the flesh were the marks of mourning. Jeremiah himself describes mourning in these terms: men would not “cut themselves, nor make themselves bald” for the dead of Jerusalem ([[Jer. 16:6]]), and Moab's grief is “every head shall be bald, and every beard clipped: upon all the hands shall be cuttings” ([[Jer. 48:37]]).

      The law of Moses forbade the cutting. “Ye shall not make any cuttings in your flesh for the dead” ([[Lev. 19:28]]; compare [[Deut. 14:1]]), and the priests were told not to shave off the corner of the beard or cut the flesh ([[Lev. 21:5]]). The text records the men's practice and passes no judgment on it.
    sources: [lds-scriptures]
  - ref: 8
    phrase: we have treasures in the field
    kind: history
    title: Ten men who bought their lives
    body: |
      Ten of the eighty were spared because they offered Ishmael food: “we have treasures in the field, of wheat, and of barley, and of oil, and of honey.” The Hebrew word, *matmonim*, means “hidden treasure,” so these are stores of grain, oil, and honey hidden in the field. Ishmael accepted the offer and “slew them not among their brethren.” The text does not say what he did with the stores.
    sources: [lds-scriptures, bdb]
  - ref: 9
    phrase: Asa the king had made for fear of Baasha king of Israel
    kind: history
    title: Asa's pit
    body: |
      The pit went back to King Asa's fortifying of Mizpah. Baasha king of Israel had built Ramah “that he might not suffer any to go out or come in to Asa king of Judah” ([[1 Kgs. 15:17]]), and when he withdrew, Asa carried off its stones and timber and “built with them Geba of Benjamin, and Mizpah” ([[1 Kgs. 15:22]]). Jeremiah says that the pit “wherein Ishmael had cast all the dead bodies” was one Asa “had made for fear of Baasha.” The 1 Kings verse speaks only of the stones and timber used to build Mizpah, so the pit is known from Jeremiah.
    sources: [lds-scriptures]
  - ref: 10
    phrase: the king’s daughters
    kind: scripture
    title: The king's daughters and Mulek
    body: |
      The king's daughters are mentioned here and again in [[Jer. 43:6]], where they are among those who “came into the land of Egypt,” with Jeremiah and Baruch. That is all Jeremiah says about them. A Book of Mormon reader will think of Mulek, the one son of Zedekiah who was not slain ([[Hel. 8:21]]). Neither Jeremiah nor the Book of Mormon says how Mulek left Judah or whether he was in Mizpah; see the note on [[Jer. 52:10]].
    sources: [lds-scriptures]
  - ref: 11
    phrase: Johanan the son of Kareah
    kind: history
    title: Johanan, rescuer and then rebel
    body: |
      Johanan was the army captain who had warned Gedaliah, and he is the one who saves the captives. Told of the plot, he had said, “Let me go, I pray thee, and I will slay Ishmael the son of Nethaniah, and no man shall know it,” and Gedaliah refused ([[Jer. 40:15–16]]). Now he “organized an army and attacked Ishmael’s men” and freed the prisoners.

      The same man turns against the prophet in the next chapters. When Jeremiah tells the remnant not to go to Egypt, “Johanan the son of Kareah, and all the proud men” answer, “Thou speakest falsely” ([[Jer. 43:2]]), and he “obeyed not the voice of the LORD” ([[Jer. 43:4]]). So the man who rescues the captives in chapter 41 leads the people against the Lord's word in chapter 43.
    sources: [ot-seminary-guide-jer-37-44, lds-scriptures]
  - ref: 12
    phrase: the great waters that are in Gibeon
    kind: words
    title: The great waters at Gibeon
    body: |
      “The great waters” can also be rendered “many pools.” Gibeon stood “on one of the hills of Benjamin, about five miles north of Jerusalem.” Johanan's men “found him” there, before he reached Ammon.
    sources: [lds-scriptures, bd-gibeon]
  - ref: 16
    phrase: the eunuchs
    kind: words
    title: Eunuchs, or court officials
    body: |
      The word translated “eunuchs” can also mean “courtiers or officials.” At eastern courts such men were “often given positions as trusted officials.” The verse lists them among the people Johanan brought back, with soldiers, women, and children; the text says nothing more about who they were.
    sources: [lds-scriptures, bd-eunuch]
  - ref: 17
    phrase: the habitation of Chimham, which is by Beth-lehem, to go to enter into Egypt
    kind: history
    title: The habitation of Chimham
    body: |
      The place is most likely named for the Chimham of David's day. When David returned from Absalom's revolt, the old man Barzillai asked the king to take his servant Chimham in his place: “let him go over with my lord the king; and do to him what shall seem good unto thee” ([[2 Sam. 19:37–38]]). On one reading, the “habitation” at Bethlehem was an inn, or caravanserai, that this Chimham “is supposed to have built or founded… for the convenience of travellers.” Who built the place is a supposition.

      The Bethlehem here is Bethlehem-Judah, “five miles south of Jerusalem.” The company stopped there on the way to Egypt, and in the next chapter they ask Jeremiah to pray “that the LORD thy God may shew us the way wherein we may walk” ([[Jer. 42:3]]).
    sources: [lds-scriptures, keil-jeremiah, bd-bethlehem]
  - ref: 18
    phrase: Because of the Chaldeans
    kind: scripture
    title: Why they ran for Egypt
    body: |
      The remnant fled for fear of reprisals. Ishmael had killed “the Chaldeans that were found there, and the men of war” (verse 3), so the Babylonians at Mizpah were dead along with the governor Babylon had made. Fearing how the Babylonians would react, the people moved to Chimham, meaning to go on to Egypt for safety.

      Jeremiah 42 shows what the Lord said about the plan. The people ask Jeremiah to pray for them, and the answer is that if they stay, “then will I build you, and not pull you down, and I will plant you, and not pluck you up” ([[Jer. 42:10]]), the verbs of [[Jer. 1:10]] (“pull down,” “build,” “plant”) again. They answer, “No; but we will go into the land of Egypt, where we shall see no war, nor hear the sound of the trumpet, nor have hunger of bread” ([[Jer. 42:14]]).
    sources: [ot-seminary-guide-jer-37-44, lds-scriptures]

christ: |
  The remnant halts by Bethlehem, “Christ’s birthplace,” the town of which Micah foretold that out of “Beth-lehem Ephratah” would come “he… that is to be ruler in Israel” ([[Micah 5:2]]). Matthew records that Joseph later took the young child into Egypt and that it fulfilled “Out of Egypt have I called my son” ([[Matt. 2:14–15]]). Jeremiah 41 itself makes no connection between its refugees and the Savior; the link is the place where they stopped.

explore: |
  - **The warning ignored.** Read [[Jer. 40:13–16]] beside this chapter.
  - **What the Lord said.** Read [[Jer. 42:1–22]] and [[Jer. 43:1–7]], and compare [[Jer. 1:10]].
  - **A parallel account.** Compare [[2 Kgs. 25:22–26]].
  - **The Book of Mormon side.** Read [[Hel. 8:21]] and [[Omni 1:15–16]] on Mulek and the people of Zarahemla.

sources: [lds-scriptures, bd-jeremiah, bdb, keil-jeremiah, bd-eunuch, bd-gibeon, bd-bethlehem, ot-seminary-guide-jer-37-44]
