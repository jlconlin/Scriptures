chapter: 23
title: The Lord Our Righteousness
tagline: The Lord condemns the shepherds who scattered His flock, promises a righteous Branch of David who will gather and rule it, and shows how to tell a prophet who has stood in His counsel from one who speaks his own dreams.
when: 'The chapter gives no date; the Bible Dictionary places chapters 21–23 among the prophecies under Zedekiah (597–586 B.C.)'

setting: |
  Jeremiah 23 closes a run of three chapters aimed at Judah's leaders. Chapters 21–22 speak to the kings; chapters 21–23 together are prophecies “on pastors or rulers of the people, with promise of the king Messiah (23:1–6),” given under Zedekiah (597–586 B.C.). The chapter itself carries no date.

  It falls in two halves. Verses 1–8 pronounce woe on the shepherds who scattered the flock, then promise a gathering and a righteous Branch of David; the same Branch appears again in [[Jer. 33:15–16]]. Verses 9–40 begin “Concerning the prophets” in the Hebrew, and turn from kings to the men who claimed to speak for the Lord and told the people they were safe.

  Latter-day prophets read the first half as a promise of the gathering of Israel, and the second half speaks directly to the question of how a true prophet is known.

thread: |
  The chapter asks who can be trusted to speak and lead for God, and answers by contrast. The shepherds of verses 1–2 “destroy and scatter”; the Lord, who will gather the remnant Himself, sets over them shepherds who feed them and raises up one righteous King whose name is “THE LORD OUR RIGHTEOUSNESS.” The prophets of verses 9–40 are the false shepherds' counterpart: they say “Peace” to people who despise the Lord, and they speak “a vision of their own heart.”

  The test the chapter gives is whether a man has “stood in the counsel of the LORD” (verses 18, 22): whether he has been in God's presence, heard His word, and so turns the people “from their evil way.” A dream may be told as a dream; what may not be done is to dress it as the Lord's word. The chapter ends with a play on one word, “burden,” which, on one reading, the people have turned into a joke against Jeremiah's warnings and which the Lord turns back on them.

sections:
  - range: 1-4
    heading: Shepherds who scatter, shepherds who feed
    plain: |
      “Woe to the shepherds who destroy and scatter the sheep of my pasture!” says the Lord. “You have scattered my flock and driven them away, and you have not attended to them, so I will attend to you for the evil of your doings. I myself will gather what is left of my flock from all the countries where I drove them, and bring them back to their folds, and they will be fruitful and multiply. I will set shepherds over them who will feed them, and they will no longer be afraid or dismayed, and none will be missing.”
  - range: 5-8
    heading: The Branch and a greater gathering
    plain: |
      “The days are coming when I will raise up for David a righteous Branch, a King who will reign and prosper and do justice and righteousness in the land. In his days Judah will be saved and Israel will live in safety, and this is the name he will be called: The Lord Our Righteousness. So the days are coming when people will no longer say, ‘As the Lord lives, who brought Israel out of Egypt,’ but, ‘As the Lord lives, who brought the seed of the house of Israel up from the north country and from all the lands where I had driven them,’ and they will live in their own land.”
  - range: 9-15
    heading: Concerning the prophets
    plain: |
      My heart is broken within me; all my bones shake. I am like a drunken man, because of the Lord and His holy words. The land is full of adulterers, the land mourns because of the curse, and the pastures of the wilderness have dried up. Prophet and priest alike are profane; I have found their wickedness even in my house. Their way will be slippery in the dark, and they will be driven and fall, in the year I visit them. In Samaria's prophets I saw folly: they prophesied by Baal. In Jerusalem's prophets I have seen something horrible: adultery, lies, and strengthening the hands of evildoers, so that no one turns from wickedness. They are like Sodom to me. I will feed them wormwood and give them poisoned water to drink, because from them ungodliness has spread over the whole land.
  - range: 16-22
    heading: Who has stood in the Lord's counsel
    plain: |
      “Do not listen to the prophets who prophesy to you. They fill you with false hopes; they speak visions from their own hearts, not from the mouth of the Lord. They keep telling those who despise me, ‘The Lord says you will have peace,’ and everyone who follows his own stubborn heart, ‘No harm will come to you.’ But which of them has stood in the Lord's council to see and hear His word? A whirlwind from the Lord has gone out in fury; it will burst on the heads of the wicked. The Lord's anger will not turn back until He has done what His heart intends; in the latter days you will understand it fully. I did not send these prophets, yet they ran; I did not speak to them, yet they prophesied. If they had stood in my council, they would have proclaimed my words to my people and turned them from their evil ways.”
  - range: 23-32
    heading: A God near and far, and the dreamers
    plain: |
      “Am I only a God nearby, and not a God far off? Can anyone hide in secret places where I cannot see him? Do I not fill heaven and earth? I have heard the prophets who prophesy lies in my name and say, ‘I had a dream! I had a dream!’ How long will this be in the hearts of the prophets who prophesy lies, who are prophets of the deceit of their own hearts? They think their dreams will make my people forget my name, as their fathers forgot it for Baal. Let the prophet who has a dream tell his dream, and let the one who has my word speak it faithfully. What is chaff beside wheat? Is not my word like fire, and like a hammer that breaks rock to pieces? So I am against the prophets who steal my words from one another, who use their tongues to declare ‘The Lord declares,’ and who prophesy false dreams and lead my people astray with reckless lies. I did not send or appoint them, and they do this people no good.”
  - range: 33-40
    heading: The burden of the Lord
    plain: |
      “When this people, or a prophet or priest, asks you, ‘What is the burden of the Lord?’ you will say, ‘What burden? I will cast you off.’ Whoever says ‘the burden of the Lord,’ I will punish him and his house. Say to one another instead, ‘What has the Lord answered?’ and ‘What has the Lord spoken?’ But do not mention ‘the burden of the Lord’ any more, because each man's own word becomes his burden, and you have twisted the words of the living God, the Lord of hosts. Because you keep saying it after I told you not to, I will utterly forget you and cast you and the city I gave you and your fathers out of my presence, and bring on you an everlasting reproach and perpetual shame that will not be forgotten.”

notes:
  - ref: 1
    phrase: pastors that destroy and scatter the sheep of my pasture
    kind: words
    title: Pastors are shepherds
    body: |
      “Pastors” are shepherds, here the people's leaders (see the note on [[Jer. 22:22]]). A shepherd, symbolically, is “a person who cares for the Lord's children,” so leaders who “destroy and scatter” have done the opposite of their work. The charge is the one in [[Ezek. 34:2]]: “Woe be to the shepherds of Israel that do feed themselves! should not the shepherds feed the flocks?” The Church edition's footnote also sends the reader to [[Zech. 11:17]], “Woe to the idol shepherd that leaveth the flock!”

      Which leaders are meant? The verse does not say. Chapters 21–23 are filed with the prophecies “on pastors or rulers of the people,” and the word is also read as Judah's “religious leaders,” whom the rest of the chapter describes. Chapters 21–22 had spoken to kings, and verse 11 names “prophet and priest,” so the word probably covers both; the text itself does not choose.
    sources: [ot-seminary-guide-jer-23, gs-shepherd, lds-scriptures, bd-jeremiah, ot-manual-25]
  - ref: 2
    phrase: have not visited them
    kind: words
    title: To visit is to look after, and to judge
    body: |
      One Hebrew verb, *paqad*, runs through the verse. The shepherds “have not visited” the flock, and the Lord says, “behold, I will visit upon you the evil of your doings.” With the sheep as its object the verb means “attend to, in act, see to” (the Church edition's footnote has “been mindful of”); to “visit upon” someone his sin is to “punish.”

      The same root returns in verse 4, where the restored sheep “shall not be lacking.” On one reading that verb was chosen to answer verse 2: because the shepherds did not take charge of the sheep, the sheep were lost, and under the new shepherds none will be missed.
    sources: [oshb-wlc, bdb, lds-scriptures, keil-jeremiah]
  - ref: 3
    phrase: I will gather the remnant of my flock out of all countries
    kind: prophets
    title: The gathering begins with conversion
    body: |
      Latter-day prophets read this promise as the gathering of Israel now under way, and teach that it is first of all a conversion. Elder McConkie taught that the gathering “consists of receiving the truth, gaining again a true knowledge of the Redeemer, and coming back into the true fold of the Good Shepherd.” President Spencer W. Kimball quoted this verse and said of the gathering, “It is to be done by missionary work,” as people gather in their own lands: “The English people will gather in England. The Japanese people will gather in the Orient. The Brazilian people will gather in Brazil.”

      Elder Russell M. Nelson put it the same way: “The choice to come unto Christ is not a matter of physical location; it is a matter of individual commitment.” The verse's “folds” are therefore not only places. In this reading the flock is brought back to the Shepherd, wherever it lives.
    sources: [ot-manual-25, nelson-gathering]
  - ref: 4
    phrase: I will set up shepherds over them
    kind: prophets
    title: The shepherds the Lord sets up
    body: |
      The shepherds of verse 4 are “the righteous prophets and priesthood leaders who, unlike the priests and prophets of Jeremiah's time, lead their people to do good and obey the Lord.” Righteous shepherds “would be called to teach and help Israel while they were gathered in from their long dispersion.” Earlier the Lord had promised the same thing in [[Jer. 3:15]]: “I will give you pastors according to mine heart, which shall feed you with knowledge and understanding.”

      Ezekiel sets the order in a parallel chapter. First the Lord Himself says, “I, even I, will both search my sheep, and seek them out” ([[Ezek. 34:11]]); then He sets up “one shepherd over them, and he shall feed them, even my servant David” ([[Ezek. 34:23]]). Jeremiah's next verse likewise passes from the shepherds to one King.
    sources: [ot-manual-25, ot-instructor-47, lds-scriptures]
  - ref: 5
    phrase: a righteous Branch
    kind: christ
    title: The Branch is Christ
    body: |
      The Branch is Jesus Christ, the promised King from David's line. The Hebrew *tsemach* means a “sprout, growth,” here a “future ruler, under figure of sprout from Davidic tree.” The Church edition links the Branch to Isaiah's “Stem of Jesse” and “Branch” ([[Isa. 11:1]]), and the Lord's own word answers who the Stem of Jesse is: “It is Christ” ([[D&C 113:1–2]]). Elder McConkie draws the conclusion: “That the Branch of David is Christ is perfectly clear,” and the King of this verse “shall be the Branch who grew out of the house of David… the Lord Jehovah, even him whom we call Christ.”

      He also places the reign this verse describes at the Second Coming: Davidic-Messianic prophecies of this kind “have reference almost exclusively to his second sojourn on planet earth.” The Church edition ties the word “King” to the wise men's question, “Where is he that is born King of the Jews?” ([[Matt. 2:2]]), and Christ's descent from David is the ground of the title: He is “the Son of David, the Seed of David, the inheritor, through Mary his mother, of the blood of the great king.” [The Shepherds and the Branch](/jeremiah/themes/shepherds-and-the-branch/#branch) follows the shepherds and the promised King through the book.
    sources: [bdb, ot-manual-13, lds-scriptures]
  - ref: 6
    phrase: THE LORD OUR RIGHTEOUSNESS
    kind: christ
    title: The name is Jehovah's
    body: |
      The Branch's name is the Lord's own name joined to “our righteousness”: in Hebrew, *YHWH tsidqenu*. Elder McConkie reads it as a name of the Savior: the King who reigns in the Millennium “shall execute judgment and justice in all the earth because he is the Lord Jehovah, even him whom we call Christ.”

      The same name appears for the city in [[Jer. 33:16]], “The Lord our righteousness,” which on the same reading “is to say that because the Great King himself reigns in her midst, even the city shall be called after him.” On one reading of the idiom, to be called by a name in the prophets' usage is to be set forth as what the name expresses; the Branch will show Himself to be the Lord who is our righteousness.
    sources: [oshb-wlc, ot-manual-13, keil-jeremiah, lds-scriptures]
  - ref: 7
    phrase: they shall no more say, The LORD liveth, which brought up the children of Israel out of the land of Egypt
    kind: prophets
    title: A gathering greater than the Exodus
    body: |
      Israel's confession was that the Lord “brought up the children of Israel out of the land of Egypt”; the gathering will be so great that the confession changes. The gathering “from the four corners of the earth and the bringing of the ten tribes from the north would be a greater miracle than ancient Israel's crossing the Red Sea on dry ground.” The promise is also made in [[Jer. 16:14–15]] (see the note on [[Jer. 16:15]]): the first verse is nearly the same, and the second is worded differently.

      The verse does not say the Exodus is forgotten, only that it is no longer what the people say first; the new deliverance, “from all countries whither I had driven them,” takes its place in verse 8. [Scattered and Gathered](/jeremiah/themes/scattered-and-gathered/#greater-than-the-exodus) follows the scattering and the gathering through the book.
    sources: [ot-instructor-47, lds-scriptures]
  - ref: 8
    phrase: out of the north country
    kind: scripture
    title: The north country and the ten tribes
    body: |
      The “north country” is tied to the ten lost tribes: the Church edition's footnote on the phrase points to them. The Hebrew is “from the land of the north,” the same phrase used when Moses committed the keys of “the leading of the ten tribes from the land of the north” ([[D&C 110:11]]; see the note on [[Jer. 16:15]]). Elder Nelson quotes that sentence and teaches that “there must come, as part of that restoration, the long-awaited gathering of scattered Israel.”
    sources: [oshb-wlc, lds-scriptures, nelson-gathering]
  - ref: 9
    phrase: Mine heart within me is broken because of the prophets
    kind: history
    title: Jeremiah speaks, and the chapter turns
    body: |
      Jeremiah is the speaker, and his grief opens the chapter's second half. The Hebrew begins with the words “Concerning the prophets,” a heading, on one reading, for verses 9–40, which sets them apart from the oracles about kings in chapters 21–22.

      His distress has two causes, named at the end of the verse: “because of the LORD, and because of the words of his holiness.” He shakes like a drunken man not only at what the prophets do but at what the Lord has said about them.
    sources: [oshb-wlc, keil-jeremiah]
  - ref: 10
    phrase: because of swearing the land mourneth
    kind: words
    title: Swearing here is a curse
    body: |
      “Swearing” in this verse means “a curse,” not profanity; the Church edition's footnote gives “cursing” as an alternative reading. The land “mourneth” under the curse, and “the pleasant places of the wilderness are dried up.”
    sources: [ot-seminary-guide-jer-23, lds-scriptures]
  - ref: 14
    phrase: an horrible thing
    kind: history
    title: Worse than Samaria, like Sodom
    body: |
      Jerusalem's prophets are worse than Samaria's. Of Samaria's the Lord says “folly”: they “prophesied in Baal.” Of Jerusalem's He says “an horrible thing”: they commit adultery, “walk in lies,” and “strengthen… the hands of evildoers, that none doth return from his wickedness.” On one reading their wrong is both false teaching and corrupt living, so that no one is turned from sin.

      The comparison “unto me as Sodom” is explained in the Church edition by Ezekiel: “this was the iniquity of thy sister Sodom, pride, fulness of bread, and abundance of idleness… neither did she strengthen the hand of the poor and needy” ([[Ezek. 16:49]]). The verse also says where the harm spread from: “from the prophets of Jerusalem is profaneness gone forth into all the land” (verse 15).
    sources: [keil-jeremiah, lds-scriptures]
  - ref: 15
    phrase: wormwood
    kind: words
    title: Wormwood and gall
    body: |
      Wormwood means “bitterness,” and gall is “a bitter liquid, poison.” The Lord says He will feed the prophets with the one and make them drink the other. The image is the taste of the punishment, set against the “peace” they promised in verse 17.
    sources: [ot-seminary-guide-jer-23]
  - ref: 16
    phrase: Hearken not unto the words of the prophets that prophesy unto you
    kind: prophets
    title: What we need, not what we want
    body: |
      The prophets Jeremiah condemns tell the people what pleases them. The next verse says what: they promise “peace” to those who despise the Lord and “No evil shall come upon you” to everyone who follows his own heart. President Ezra Taft Benson gave the contrast as a test for following a living prophet: “The prophet tells us what we need to know, not always what we want to know.” He added that how we respond “when he tells us what we need to know, but would rather not hear, is a test of our faithfulness.”

      The same standard separates Jeremiah from his opponents. Jeremiah “was doomed to preach an unwelcome message, while the false prophets persuaded the people that he was unpatriotic, uninspired, and pessimistic.” The Lord's law for a prophet who claims to speak for Him is in [[Deut. 18:20–22]]: the prophet who speaks a word “which I have not commanded him to speak” is false, and when his word does not “follow… nor come to pass,” it is “the thing which the Lord hath not spoken.”
    sources: [benson-fourteen, ot-manual-23, lds-scriptures]
  - ref: 18
    phrase: stood in the counsel of the LORD
    kind: words
    title: Standing in the Lord's council
    body: |
      “Counsel” here is “council.” The Hebrew word, *sod*, means a circle of close companions and the conversation within it, “a group gathered together to instruct or make decisions.” The phrase means “in the intimate circle of the LORD,” and the same word is the “secret” of [[Amos 3:7]]: “the Lord God will do nothing, but he revealeth his secret unto his servants the prophets.”

      The question, “who hath stood in the counsel of the LORD?”, is the test in a single sentence: a true prophet has been present when the Lord spoke, and has “perceived and heard his word.” Verse 22 gives its result. Prophets who had stood there “had caused my people to hear my words,” and “then they should have turned them from their evil way.”
    sources: [bdb, oshb-wlc, ot-seminary-guide-jer-23, lds-scriptures]
  - ref: 21
    phrase: I have not sent these prophets, yet they ran
    kind: prophets
    title: Sent, or self-sent
    body: |
      A prophet must be sent. The charge of verse 21 is that these prophets “called themselves to the ministry and prophesy without revelation.” The verse's footnote points to the topic of authority, and the Church's own standard is the fifth article of faith: “a man must be called of God, by prophecy, and by the laying on of hands by those who are in authority” ([[A of F 1:5]]).

      A revelation in this dispensation says the same: no one is to “go forth to preach my gospel” unless “ordained by some one who has authority, and it is known to the church that he has authority” ([[D&C 42:11]]). The Church edition's footnotes link this verse to the Savior's warning, “Beware of false prophets, who come to you in sheep's clothing” ([[3 Ne. 14:15]]), with the test that follows: “Ye shall know them by their fruits” ([[3 Ne. 14:16]]). Jeremiah gives the fruit as repentance: sent prophets turn people from evil (verse 22).
    sources: [ot-manual-25, lds-scriptures]
  - ref: 24
    phrase: Do not I fill heaven and earth?
    kind: scripture
    title: A God who is near and sees
    body: |
      The Lord answers the false prophets' boldness with His nearness: “Am I a God at hand… and not a God afar off? Can any hide himself in secret places that I shall not see him?” The prophets spoke lies “in my name,” and the Lord answers, “I have heard what the prophets said” (verse 25).

      The Church edition ties verse 24 to the psalmist's question: “Whither shall I go from thy spirit? or whither shall I flee from thy presence?” ([[Ps. 139:7]]), and to the revelation on light: “which light proceedeth forth from the presence of God to fill the immensity of space,” the light “which is in all things… even the power of God who sitteth upon his throne, who is in the bosom of eternity, who is in the midst of all things” ([[D&C 88:12–13]]).
    sources: [lds-scriptures]
  - ref: 28
    phrase: The prophet that hath a dream, let him tell a dream
    kind: words
    title: A dream is not the word
    body: |
      The Lord does not forbid dreams; He forbids calling one's own dream His word. Dreaming is one way He does speak: “If there be a prophet among you, I the Lord will make myself known unto him in a vision, and will speak unto him in a dream” ([[Num. 12:6]]). But “Not all dreams are revelations,” and “Inspired dreams are the fruit of faith.” So verse 28 allows a man to tell a dream, as a dream, and demands that the one who “hath my word” speak it “faithfully.”

      The charge in verses 25–27 is that the dreams were “the deceit of their own heart” and were told “in my name,” in order to make the people “forget my name,” as their fathers had “for Baal.” The Lord's comparison, “What is the chaff to the wheat?”, puts the dream beside the word and shows the difference in worth.
    sources: [gs-dream, lds-scriptures]
  - ref: 29
    phrase: Is not my word like as a fire
    kind: symbol
    title: Fire and a hammer
    body: |
      The Lord's word is fire and a hammer, set against the prophets' dreams. Jeremiah himself describes the word in him in the same terms: “his word was in mine heart as a burning fire shut up in my bones, and I was weary with forbearing, and I could not stay” ([[Jer. 20:9]]).
    sources: [lds-scriptures]
  - ref: 31
    phrase: use their tongues, and say, He saith
    kind: words
    title: Borrowing the formula “saith the LORD”
    body: |
      The charge in verse 31 is that the false prophets borrow the Lord's own formula. “He saith” translates the Hebrew verb *naʾam*, built on the noun *neʾum*, the “saith” of “saith the LORD” that recurs all through this chapter. The phrase means “they uttered (in the prophetic manner), it as an utterance (of the LORD); they used the prophetic formula.”

      Put plainly, “They say ‘Thus saith the Lord’ when the Lord has not spoken through them.” Verse 30 adds a related charge: they “steal my words every one from his neighbour.”
    sources: [oshb-wlc, bdb, ot-manual-25]
  - ref: 33
    phrase: What is the burden of the LORD?
    kind: words
    title: The word “burden”
    body: |
      “Burden” is the Hebrew *massa*, which means a load and, from the same root, a weighty utterance or oracle; the Church edition's footnote gives “prophecy.”

      The people had turned the word into a jibe. On one reading, the question “What is the burden of the LORD?” is mockery: they ridicule Jeremiah's sayings as burdensome. The Lord turns the joke back, and on the same reading the answer keeps the figure: “What burden? I will even forsake you,” as if to unload a burden. He tells them to ask instead, “What hath the LORD answered?” (verse 35), for “every man's word shall be his burden” (verse 36): a word used mockingly weighs on the one who uses it.

      Verse 39 sounds like the same word. “I will utterly forget you” is spelled in Hebrew almost like “I will utterly lift you up” (the root of *massa*), and some read it that way. One reading holds that the text as it stands, “forget,” “is much more in keeping.”
    sources: [bdb, lds-scriptures, keil-jeremiah]
  - ref: 40
    phrase: an everlasting reproach upon you
    kind: scripture
    title: A reproach that is not forgotten
    body: |
      The chapter ends in judgment: the people and the city are to be cast out and shamed, a shame “which shall not be forgotten.” The Church edition's footnote on this verse sends the reader to the risen Lord's words to the Nephites about the house of Israel: that they would be “cast out from among them” and “become a hiss and a byword” ([[3 Ne. 16:9]]). The close is dark, but verse 3 had already promised a gathering of those driven out.
    sources: [lds-scriptures]

christ: |
  Chapter 23 gives Christ two titles. He is the “righteous Branch” raised “unto David,” the King who will “execute judgment and justice in the earth” ([[Jer. 23:5]]), and His name is Jehovah's own: “THE LORD OUR RIGHTEOUSNESS” ([[Jer. 23:6]]). The Church's teachers read this Branch as the King who reigns in the Millennium. Over against the shepherds who scattered, He is the one who says, “I, even I, will both search my sheep, and seek them out” ([[Ezek. 34:11]]), and the Good Shepherd who “giveth his life for the sheep” ([[John 10:11]]).

explore: |
  - **The same promise again.** Read [[Jer. 33:14–16]], where the Branch and the name return, and [[Jer. 16:14–21]] for the greater gathering.
  - **The shepherds' chapter.** Read [[Ezek. 34]] beside verses 1–6, noticing who finally gathers the flock.
  - **The Stem of Jesse.** Read [[Isa. 11:1–5]] with [[D&C 113:1–2]].
  - **Judging a prophet.** Read [[Deut. 18:20–22]] and [[3 Ne. 14:15–20]].
  - **A talk on the living prophet.** President Ezra Taft Benson's “Fourteen Fundamentals in Following the Prophet” (BYU devotional, 1980), the seventh and twelfth fundamentals especially.

parallels:
  - ref: Jer. 33:15–16
    note: The Branch of righteousness and the name “The Lord our righteousness” return, with the name given to Jerusalem.
  - ref: Jer. 16:14–15
    note: The promise that Israel will no longer swear by the Exodus, but by the Lord who gathers them from the north, is made here in nearly the same words as verses 7–8.

sources: [bd-jeremiah, ot-seminary-guide-jer-23, gs-shepherd, gs-dream, lds-scriptures, ot-manual-23, ot-manual-25, ot-manual-13, ot-instructor-47, nelson-gathering, benson-fourteen, bdb, oshb-wlc, keil-jeremiah]
