chapter: 45
title: Seek Them Not
tagline: Baruch, worn out from writing Jeremiah’s words of judgment, cries “Woe is me now!” The Lord answers him by name, and promises him one thing only, his life, wherever he goes.
when: 'The fourth year of Jehoiakim (605/4 B.C.), when Baruch wrote Jeremiah’s words in the scroll of chapter 36'

setting: |
  Jeremiah 45 is five verses long: a word from the Lord to Baruch, Jeremiah’s scribe, given through Jeremiah. The Church’s heading sums it up in one line: “Jeremiah promises Baruch that his life will be preserved.”

  The chapter comes back in time. Its opening verse dates it to the fourth year of Jehoiakim, 605/4 B.C., the year Baruch wrote down Jeremiah’s prophecies on the scroll that the king later burned ([[Jer. 36:1–4]]). It is “a kind of appendix that belongs with ch. 36,” valued for what it shows of Baruch himself. Yet it stands here, after the fall of Jerusalem and the flight of the remnant to Egypt (chapters 39–44), and just before the prophecies against the nations (chapters 46–51). Read in place, it is “added as an appendix” to the prophecies concerning Judah and Israel: a closing word to the man who wrote many of them down.

  The chapter has two parts: Baruch’s complaint, which the Lord quotes back to him (verses 1–3), and the Lord’s answer (verses 4–5).

thread: |
  Jeremiah 45 is the Lord’s answer to a discouraged servant. Baruch has just written out more than twenty years of warnings against his own nation ([[Jer. 25:3]]; [[Jer. 36:2]]), and he says the Lord has added grief to his sorrow. The Lord does not deny the grief or cancel the judgment. He tells Baruch that what is being lost is the Lord’s own work: “that which I have built will I break down, and that which I have planted I will pluck up” (verse 4). In a world about to fall, Baruch should not seek great things for himself. What the Lord promises is smaller and surer: his life, wherever he goes.

  Baruch “felt discouraged, and the Lord sent him a message of encouragement through Jeremiah.” The encouragement is not comfort that things will be easier. It is the Lord’s personal attention, by name (“unto thee, O Baruch”), and a promise He keeps.

sections:
  - range: 1-3
    heading: Baruch’s complaint
    plain: |
      This is the word Jeremiah the prophet spoke to Baruch son of Neriah, when Baruch had written these words in a scroll as Jeremiah dictated them, in the fourth year of Jehoiakim son of Josiah, king of Judah: “This is what the Lord, the God of Israel, says to you, Baruch. You said, ‘Woe is me now! The Lord has added grief to my pain. I am worn out with my groaning, and I find no rest.’”
  - range: 4-5
    heading: The Lord’s answer
    plain: |
      “Say this to him: The Lord says, ‘What I have built I am tearing down, and what I have planted I am uprooting, this whole land. And are you looking for great things for yourself? Don’t look for them. For I am bringing disaster on all flesh, says the Lord. But I will give you your life as your spoil, everywhere you go.’”

notes:
  - ref: 1
    phrase: Baruch the son of Neriah
    kind: history
    title: Baruch, Jeremiah’s scribe
    body: |
      Baruch, whose name means “Blessed,” was Jeremiah’s scribe and his companion through the worst years of the prophet’s life. He received the deed for the field Jeremiah bought during the siege ([[Jer. 32:12–13]]), wrote down and read aloud the scroll of chapter 36, and was carried to Egypt with Jeremiah after the fall of Jerusalem ([[Jer. 43:6]]).

      He shared the prophet’s dangers. The princes told him to hide with Jeremiah when the king heard the scroll ([[Jer. 36:19]]), and the king ordered both of them seized ([[Jer. 36:26]]). Years later the men who fled to Egypt blamed him for Jeremiah’s message: “Baruch the son of Neriah setteth thee on against us” ([[Jer. 43:3]]). He “was deeply involved in Jeremiah’s affairs,” and “much of the present book of Jeremiah must go back either directly or indirectly to him,” though that last point is a scholar’s judgment, not something the text says. What became of him after Egypt is unknown; “there is no evidence one way or the other.”
    sources: [bd-baruch, ot-manual-24, lds-scriptures]
  - ref: 1
    phrase: in the fourth year of Jehoiakim the son of Josiah king of Judah
    kind: history
    title: A chapter from 605 B.C. placed after the flight to Egypt
    body: |
      The chapter is dated years before the events just told in chapters 39–44, and it belongs with chapter 36. The Church edition’s footnote on “a book” sends the reader to [[Jer. 36:4]], where Baruch writes the scroll “from the mouth of Jeremiah.” “These words,” then, are Jeremiah’s prophecies up to that year, and “the substance of this chapter and that of Jeremiah 36 agree.” The verse does not say whether Baruch was still writing or had just finished; either fits.

      Why the chapter stands here rather than after chapter 36 is not stated. One reading is that this word to Baruch may have been written down later, “possibly not till the whole of Jeremiah’s prophecies were collected and arranged in Egypt,” and was “added as an appendix” to the prophecies concerning Judah and Israel. Whatever its cause, the effect is that the account of Judah ends with the flight to Egypt ([[Jer. 43:7]]), and then, before the oracles against the nations begin, the book turns back to Baruch and the promise he was given.
    sources: [lds-scriptures, keil-jeremiah]
  - ref: 3
    phrase: the LORD hath added grief to my sorrow
    kind: history
    title: Why Baruch grieves
    body: |
      Baruch’s grief probably comes from the words he had just written down, the Lord’s judgment on his own people, though the verse does not say so. Like Jeremiah, he “could be beset by despair”; it may be that as he wrote the words of judgment, “and knew in his heart that they were true and would certainly come to pass, he became depressed at it all and was filled with foreboding about his own future.” What the verse does say is plain: sorrow he already had, and the Lord has added grief to it. “Woe is me” is Jeremiah’s cry too ([[Jer. 15:10]]).

      The Church edition’s footnote on “I find no rest” points to Lamentations, where Jerusalem in exile “dwelleth among the heathen, she findeth no rest” ([[Lam. 1:3]]). The footnote sets Baruch’s grief beside the grief of the city after its fall.
    sources: [ot-manual-24, lds-scriptures]
  - ref: 4
    phrase: that which I have built will I break down, and that which I have planted I will pluck up
    kind: scripture
    title: The words of Jeremiah’s call
    body: |
      The Lord answers Baruch in the words of Jeremiah’s own call. When Jeremiah was ordained, he was set over the nations “to root out, and to pull down, and to destroy, and to throw down, to build, and to plant” ([[Jer. 1:10]]). Verse 4 uses four of the same Hebrew verbs: *banah* “build,” *haras* “break down,” *nata‘* “plant,” and *natash* “pluck up.” The Church edition’s footnotes link the verse to that call and to the promise on the other side of the judgment: “so will I watch over them, to build, and to plant” ([[Jer. 31:28]]).

      Two things stand out in the answer. The verbs are in the first person: what is being broken down is what the Lord says He built, and what is being uprooted is what He planted. And the Hebrew puts the tearing down in the present, “I am breaking down… I am plucking up.” Baruch is not told that his grief is mistaken. He is told that the loss is the Lord’s own, and that it is already under way.
    sources: [lds-scriptures, biblehub-interlinear]
  - ref: 5
    phrase: seekest thou great things for thyself? seek them not
    kind: words
    title: Great things in a falling world
    body: |
      The Lord tells Baruch not to look for great things for himself, because disaster is coming on everyone. The Hebrew is simple and pointed: “And you, you seek for yourself *gedolot*, great things? Do not seek.” The verse gives the reason in the next breath: “I will bring evil upon all flesh.” The “evil” is *ra‘ah*, here “disaster” rather than wickedness; “all flesh” is the whole of humanity, and the disaster is the judgment Jeremiah had announced on every nation, when “the LORD hath a controversy with the nations, he will plead with all flesh” ([[Jer. 25:31]]). The prophecies against foreign nations follow in chapters 46–51.

      What “great things” Baruch wanted the text does not say. The Church edition’s footnote on “seekest” points to the Savior’s question: “For what shall it profit a man, if he shall gain the whole world, and lose his own soul?” ([[Mark 8:36]]). One reading takes the great things as worldly prosperity: “when the whole world is visited with judgment, an individual man must not make great demands, but be content with saving his life.”
    sources: [biblehub-interlinear, keil-jeremiah, lds-scriptures, bd-jeremiah]
  - ref: 5
    phrase: thy life will I give unto thee for a prey
    kind: words
    title: Your life as the spoil
    body: |
      “For a prey” means that Baruch will come out of the disaster with his life and nothing else. The Hebrew word is *shalal*, “prey, spoil, plunder, booty,” what a soldier carries away from a battle. To have one’s life “for a prey” is an idiom meaning the “life shall be spared.” The word for “life” is *nefesh*, which can also be translated “soul.”

      Jeremiah uses the same promise three other times, and the Church edition’s footnotes point to two of them. It was offered to anyone in besieged Jerusalem who would go out and surrender to the Chaldeans ([[Jer. 21:9]]; [[Jer. 38:2]]), and it was given to Ebed-melech, the Ethiopian who rescued Jeremiah from the dungeon ([[Jer. 38:7–13]]): “thy life shall be for a prey unto thee: because thou hast put thy trust in me” ([[Jer. 39:18]]). Each time, the city is lost and the person is saved.

      The promise goes with him “in all places whither thou goest,” and the book shows it kept as far as it follows him: he lived through the fall of the city and was taken to Egypt with Jeremiah ([[Jer. 43:6]]).
    sources: [bdb, biblehub-interlinear, lds-scriptures]

christ: |
  The Lord who speaks to Baruch by name is Jehovah, “the premortal Jesus Christ.” The Church edition’s footnote on “seekest” links His answer to Baruch with what He later taught His disciples: “For what shall it profit a man, if he shall gain the whole world, and lose his own soul? Or what shall a man give in exchange for his soul?” ([[Mark 8:36–37]]). Baruch is promised his life when everything else is lost; the Savior asks what a man would give in exchange for his soul.

explore: |
  - **Baruch’s story.** Read [[Jer. 32:9–16]], [[Jer. 36:1–32]], and [[Jer. 43:1–7]].
  - **Life for a prey.** Read [[Jer. 21:8–9]], [[Jer. 38:2]], and [[Jer. 39:15–18]], with verse 5.
  - **Build and plant.** Read [[Jer. 1:10]], [[Jer. 18:7–10]], [[Jer. 31:28]], and [[Jer. 42:10]].
  - **The Savior’s answer.** Read [[Mark 8:34–37]].

