chapter: 50
title: Babylon Is Taken
tagline: The empire that scattered Israel is told it will fall to a coalition from the north, and the Lord promises that Israel and Judah will come back together, weeping, to a covenant that will not be forgotten.
when: 'A written oracle sent to Babylon in Zedekiah’s fourth year ([[Jer. 51:59–64]]; Zedekiah reigned 597–586 B.C.). The chapter itself gives no date for the fall it describes.'

setting: |
  Chapters 46–51 are Jeremiah's prophecies against foreign nations, and these two, 50 and 51, are the last of them: a single oracle against Babylon, the power that took Judah captive. The Church's chapter heading sums up its two halves: “Babylon will be destroyed and never rise again—The scattered people of Israel will be brought again into the lands of their inheritance.”

  The oracle was meant to travel. Jeremiah “wrote in a book all the evil that should come upon Babylon” and sent it to Babylon with Seraiah, who was to read it there and then sink it in the Euphrates ([[Jer. 51:59–64]]). The Bible Dictionary adds that chapters 50–51 “in their present form are later than Jeremiah”; nothing in the notes below depends on that.

  The chapter is hard to read as one story, because it moves between Babylon's fall to an invader in the sixth century B.C. and an Israel gathered in the last days. The key is “the dual nature of many prophecies” and “the recurring use of archetypes and metaphors”: Babylon is “not only a national power but… the symbol of worldliness and spiritual wickedness.” Chapter 51 continues the same oracle. This chapter is the first half.

thread: |
  The chapter's argument is that **Babylon's fall and Israel's return are one event seen from two sides**. The Lord announces the fall twice over, first as a message to all nations (verses 1–3) and then again and again in commands to the attackers and in the sword and the desert that follow (verses 9–16, 21–32, 35–46). Between those blocks, and woven through them, are the people the fall is for: a flock that was lost, scattered by Assyria and then by Babylon (verses 6, 17), who will come back “going and weeping” (verse 4) and will be pardoned (verse 20).

  Why Babylon falls is stated in a few words that repeat. She “hath sinned against the LORD” (verse 14), “hath been proud against the LORD” (verse 29), is “most proud” (verses 31–32), and is “the land of graven images” (verse 38). The Lord who humbles her is the one named in verse 34: “Their Redeemer is strong.”

  The chapter has to be read on two levels: some verses describe the Babylon of that day taken by nations from the north, while others join her fall to “events that will not occur until the time of the gathering and restoration of Israel and Judah.” Where a verse points past the sixth century, the notes say so and say what the Church's sources base it on.

sections:
  - range: 1-3
    heading: The word against Babylon
    plain: |
      This is the word the Lord spoke through Jeremiah against Babylon and the land of the Chaldeans. Announce it among the nations and raise a signal; hold nothing back. Say that Babylon is taken and her gods, Bel and Merodach, are shamed and broken. A nation from the north is coming up against her, and the land will be left empty, of people and animals alike.
  - range: 4-7
    heading: Israel and Judah return
    plain: |
      In those days the people of Israel and Judah will come together, weeping, looking for the Lord their God. They will ask the way to Zion and say, “Come, let us join ourselves to the Lord in an everlasting covenant that will not be forgotten.” My people were lost sheep. Their shepherds led them astray and they wandered over the hills and forgot where to rest. Everyone who found them devoured them, and their enemies said, “We are not guilty, because they sinned against the Lord, the true home of justice and the hope of their fathers.”
  - range: 8-16
    heading: Leave Babylon, and the attack
    plain: |
      Get out of Babylon, and be like the lead goats before the flock. I am raising a gathering of great nations from the north against her; she will be taken there, and their arrows do not come back empty. Chaldea will be plundered. You who plundered my people and grew fat and loud are going to be ashamed; your mother is disgraced, and the last of the nations becomes a dry wilderness. Because of the Lord's anger no one will live there, and everyone passing by will be appalled. Surround her, archers, spare no arrows, for she has sinned against the Lord. Shout against her: she surrenders, her foundations fall, her walls come down. This is the Lord's vengeance; do to her what she did. Cut off the sower and the harvester; for fear of the sword everyone will flee home to his own people and land.
  - range: 17-20
    heading: A scattered flock gathered and pardoned
    plain: |
      Israel is a scattered sheep driven off by lions: first the king of Assyria devoured him, and last Nebuchadrezzar of Babylon broke his bones. So I will punish the king of Babylon as I punished the king of Assyria. I will bring Israel back to his own pasture, to Carmel and Bashan, Mount Ephraim and Gilead, and he will be satisfied. In those days people will look for Israel's guilt and Judah's sins and find none, because I will forgive those I leave as a remnant.
  - range: 21-32
    heading: Babylon's pride and fall
    plain: |
      Attack the land of Merathaim and the people of Pekod; destroy them utterly, as I commanded. The sound of battle and great ruin is in the land. How the hammer of the whole earth is broken and Babylon has become a horror among the nations! I set a trap and you were caught without knowing it, because you fought the Lord. He has opened his armory and brought out the weapons of his anger. Come against her from every side, break open her granaries, pile her up in heaps and leave nothing. Slaughter her young bulls; their day has come. Refugees will arrive in Zion telling of the Lord's vengeance for his temple. Call the archers; surround her; repay her for her pride against the Holy One of Israel. Her young men will fall in the streets and her soldiers will be silenced. “I am against you, you arrogant one; your day has come. The proud will stumble and fall, and no one will lift him up. I will light a fire in his cities that burns up everything around.”
  - range: 33-34
    heading: Their Redeemer
    plain: |
      The people of Israel and Judah have been oppressed together, and their captors held them and refused to let them go. But their Redeemer is strong; the Lord of hosts is his name. He will argue their case to the end, to give rest to the land and turmoil to the people of Babylon.
  - range: 35-40
    heading: A sword and a desert
    plain: |
      A sword is against the Chaldeans, her officials and wise men, her liars, her warriors, her horses and chariots, the mixed peoples in her midst, and her treasures. A drought is on her waters, because it is a land of idols, and they are mad over their images. So desert animals will live there and it will never again be inhabited, as when God overthrew Sodom and Gomorrah and the towns around them. No one will live there.
  - range: 41-46
    heading: The nation from the north
    plain: |
      A people is coming from the north, a great nation, with many kings stirred up from the ends of the earth. They carry bow and spear, they are cruel and show no mercy, their sound is like the sea, and they ride horses, arrayed for battle against you, Daughter of Babylon. The king of Babylon has heard the report; his hands go limp and anguish seizes him like a woman in labor. Like a lion coming up from the thickets of the Jordan against a strong dwelling, I will chase them from her in a moment. Who is the chosen one I may appoint over her? Who is like me, who can summon me, and what shepherd can stand before me? So hear what the Lord has planned against Babylon: even the youngest of the flock will drag them away. At the sound of Babylon's capture the earth shakes and the cry is heard among the nations.

notes:
  - ref: 1
    phrase: The word that the LORD spake against Babylon
    kind: history
    title: Written for Babylon
    body: |
      The words against Babylon were written down and sent to Babylon. Jeremiah “wrote in a book all the evil that should come upon Babylon,” and gave it to Seraiah, who went to Babylon with King Zedekiah in the fourth year of his reign, to read it there and then to bind a stone to the book and throw it into the Euphrates: “Thus shall Babylon sink, and shall not rise from the evil that I will bring upon her” ([[Jer. 51:59–64]]). The Church edition's footnote at verse 1 points to that account, and chapters 50–51 are taken to be the book Seraiah carried: they were “written and sent to Babylon in the days of Zedekiah.”
    sources: [lds-scriptures, ot-manual-25]
  - ref: 2
    phrase: Bel is confounded, Merodach is broken in pieces
    kind: words
    title: Bel and Merodach
    body: |
      Bel and Merodach stand for Babylon's chief god, so the fall of the city is announced as the fall of its god. Bel is “a Babylonian god, same as Baal,” and “the chief building was the famous temple of Bel.” Merodach is most likely not a second god but another name for the same one: Bel and Merodach “are not different divinities, but merely different names for the chief deity of the Babylonians.” That last point is one commentator's explanation of the double name.

      Verse 2 then repeats the point in plain words: “her idols are confounded, her images are broken in pieces.” The chapter comes back to it in verse 38, calling Babylon “the land of graven images.” The Church edition's footnote sends the reader to Isaiah's picture of the same moment, “Bel boweth down, Nebo stoopeth, their idols were upon the beasts” ([[Isa. 46:1]]), where Babylon's gods must be carried off by weary animals instead of carrying their worshippers.
    sources: [bd-bel, bd-babylon, keil-jeremiah, lds-scriptures]
  - ref: 4
    phrase: the children of Israel shall come, they and the children of Judah together, going and weeping
    kind: scripture
    title: Israel and Judah together
    body: |
      “In those days, and in that time” marks a day when Israel and Judah return together, and the Church reads it as the latter-day gathering: “Israel did not participate in the return from Babylon, but Israel and Judah will be restored together in the last days.” The Church edition's footnote at this verse points to the same promise of unity in [[Ezek. 37:22]]: “And I will make them one nation in the land upon the mountains of Israel… and they shall be no more two nations.”

      The weeping is the other half. In the Church's reading it comes from recognition: “They will weep because they will realize that the sufferings they have endured throughout the centuries came about because they rejected the Lord Jesus Christ, who shall lead them in the last days.” The footnote's other references point the same way: [[Jer. 31:9]], “They shall come with weeping, and with supplications will I lead them,” and [[Zech. 12:10]], “they shall look upon me whom they have pierced, and they shall mourn for him.” That explanation of the tears is an interpretation; the verse itself says only “going and weeping.”
    sources: [ot-manual-25, lds-scriptures]
  - ref: 5
    phrase: a perpetual covenant that shall not be forgotten
    kind: scripture
    title: A covenant not forgotten
    body: |
      The covenant is “perpetual,” the Church edition's footnote notes the word could also be rendered “everlasting,” and the verse says it “shall not be forgotten.” In the verse the returning people are the ones who say so: “let us join ourselves to the LORD.” One reading takes it as “the new covenant” that the Lord promises in [[Jer. 31:31–34]], where forgiveness is the heart of it: “I will forgive their iniquity, and I will remember their sin no more.” Verse 20 of this chapter has the same promise.

      God's side of the matter is stated by the risen Lord when He quotes the Father to the Nephites: “I will remember the covenant which I have made with my people; and I have covenanted with them that I would gather them together in mine own due time” ([[3 Ne. 20:29]]).
    sources: [lds-scriptures, keil-jeremiah]
  - ref: 6
    phrase: 'My people hath been lost sheep: their shepherds have caused them to go astray'
    kind: scripture
    title: Shepherds who led them astray
    body: |
      The people were lost sheep because their shepherds, their leaders, led them the wrong way, and the Church edition's footnote ties this to Nephi's description of the churches and teachers of the last days ([[2 Ne. 28:12]], with verses 9–16): “they have all gone astray save it be a few, who are the humble followers of Christ; nevertheless, they are led, that in many instances they do err because they are taught by the precepts of men” ([[2 Ne. 28:14]]).

      Verse 7 shows what such a flock suffers. Everyone who found them “devoured them,” and the attackers excused themselves, “We offend not, because they have sinned against the LORD.” The footnote reads “We offend not” as “are not guilty.” The enemies use Israel's real sin to justify what they did to her, and the oracle answers by charging Babylon with sin against the Lord in turn (verses 14 and 29).
    sources: [lds-scriptures]
  - ref: 8
    phrase: Remove out of the midst of Babylon
    kind: prophets
    title: Go out of Babylon
    body: |
      The command to leave Babylon becomes, in a revelation through the Prophet Joseph Smith, a command to the Saints. Received at Hiram, Ohio, on 3 November 1831, when the elders wanted to know about “preaching the Gospel to the inhabitants of the earth, and concerning the gathering,” it says: “Go ye out from Babylon. Be ye clean that bear the vessels of the Lord,” and, “Go ye out from among the nations, even from Babylon, from the midst of wickedness, which is spiritual Babylon” ([[D&C 133:5]]; [[D&C 133:14]]). In [[D&C 1:16]] Babylon means “the world.”

      The same connection is drawn for this chapter, with a pointer to [[D&C 133:14]]: “Here Babylon is seen not only as a national power but as the symbol of worldliness and spiritual wickedness.” On the parallel command in [[Jer. 51:6]] it adds that “because Babylon is also a symbol of the world, a charge was given Israel to flee from her wickedness and to be responsible for saving their own souls.” The revelation adds a caution that the verse does not: “let not your flight be in haste” ([[D&C 133:15]]).
    sources: [lds-scriptures, bd-babylon, ot-manual-25]
  - ref: 9
    phrase: an assembly of great nations from the north country
    kind: history
    title: A coalition from the north
    body: |
      The invader is not one nation but “an assembly of great nations,” and the coalition is identified as the army of Cyrus, which “was composed of Medes, Persians, Armenians, Caducians, Sacae, &c. Though all these did not come from the north; yet they were arranged under the Medes, who did come from the north, in reference to Babylon.” That explanation comes from an older Bible commentary, which the Church's manual quotes for this verse; it reconciles the word “north” with a coalition that did not all come from there.

      “North” has a history in this book. Babylon was itself “the families of the north” that the Lord sent against Judah: “I will send and take all the families of the north, saith the Lord, and Nebuchadrezzar the king of Babylon, my servant” ([[Jer. 25:9]]). The Church edition's footnote at verse 3 sends the reader to [[Jer. 51:48]], where the destroyers “shall come unto her from the north.” The direction that once brought ruin to Jerusalem now brings it to Babylon.
    sources: [ot-manual-25, clarke-commentary, lds-scriptures]
  - ref: 17
    phrase: first the king of Assyria hath devoured him; and last this Nebuchadrezzar king of Babylon hath broken his bones
    kind: history
    title: Assyria, then Babylon
    body: |
      The sheep was scattered in two stages, by two empires. Assyria carried off Israel, the northern kingdom, in 740 and 721 B.C., and Babylon took Judah: “in 597 B.C. and again in 586 B.C. there were large deportations under Nebuchadnezzar” (the same king the verse calls Nebuchadrezzar). In verse 18 the Lord says he will punish Babylon “as I have punished the king of Assyria,” and in verse 33 the people of both are said to have been “oppressed together,” though by two captors.
    sources: [bd-captivities]
  - ref: 20
    phrase: the iniquity of Israel shall be sought for, and there shall be none
    kind: christ
    title: Sought for, and none
    body: |
      The verse promises complete forgiveness: when the Lord looks for Israel's sin, none will be found, “for I will pardon them whom I reserve.” It is one of the verses that join Babylon's fall to “events that will not occur until the time of the gathering and restoration of Israel and Judah”: in that future Israel “will be brought again to their lands of inheritance (see v. 19) and will be forgiven (see v. 20).” Verse 4 and verse 20 open with the same words, “In those days, and in that time.”

      The wording is close to the promise of the new covenant: “I will forgive their iniquity, and I will remember their sin no more” ([[Jer. 31:34]]). The pardon does not come from Israel's record, which in verses 6–7 is of sheep gone astray, but from the Lord who says “I will pardon.”
    sources: [ot-manual-25, lds-scriptures]
  - ref: 21
    phrase: Go up against the land of Merathaim, even against it, and against the inhabitants of Pekod
    kind: words
    title: Merathaim and Pekod
    body: |
      Merathaim and Pekod are probably not place names but names coined for the occasion, meaning “double rebellion” and “visitation,” so the verse commands the attack on Babylon under symbolic names. On this reading they are “two names specially formed for the occasion”: Merathaim “means ‘double rebellion,’ or ‘double obstinacy,’” and the verse is rendered “against the inhabitants of visitation.” This is one commentator's reading of the Hebrew.

      What the “double” refers to is not settled: “The only doubtful points are in what respect Babylon showed double obstinacy, and what Jeremiah had in his mind at the time.” The sense of the command does not depend on it. Babylon is to be attacked as the land of rebellion against the Lord, which is how the chapter has described her.
    sources: [keil-jeremiah]
  - ref: 23
    phrase: How is the hammer of the whole earth cut asunder and broken!
    kind: scripture
    title: The hammer is broken
    body: |
      Babylon is punished even though the Lord used her, because scripture gives her role a limit and an end. Nebuchadrezzar was the Lord's instrument against Judah, “my servant” ([[Jer. 25:9]]); and the same prophecy says the instrument would be called to account: “when seventy years are accomplished, that I will punish the king of Babylon, and that nation, saith the Lord, for their iniquity” ([[Jer. 25:12]]).

      Isaiah says the same of Assyria, “the rod of mine anger” ([[Isa. 10:5]]), and then, “I will punish the fruit of the stout heart of the king of Assyria, and the glory of his high looks” ([[Isa. 10:12]]). The charge in this chapter is pride: “she hath been proud against the LORD” in verse 29 and “O thou most proud” in verse 31. A nation can be used and still be accountable for its own pride.
    sources: [lds-scriptures]
  - ref: 28
    phrase: the vengeance of his temple
    kind: history
    title: The vengeance of his temple
    body: |
      The vengeance “of his temple” is the Lord's repayment of Babylon for what she did to His house in Jerusalem. Babylon had carried off temple vessels years before the city fell, while prophets in Jerusalem were promising that “the vessels of the LORD's house shall now shortly be brought again from Babylon” ([[Jer. 27:16]]); at the fall, Nebuzar-adan “burned the house of the LORD” ([[Jer. 52:13]]), and the Chaldeans broke up its bronze pillars, stands, and sea and “carried all the brass of them to Babylon” ([[Jer. 52:17]]).

      The next chapter uses the same words for the Lord's purpose against Babylon, “it is the vengeance of the LORD, the vengeance of his temple” ([[Jer. 51:11]]), and has the exiles lament that “strangers are come into the sanctuaries of the LORD's house” ([[Jer. 51:51]]). Read this way, the refugees of verse 28 bring Zion word that the Lord has “avenged on Babylon the burning of His temple by the Chaldeans”; that last phrase is one commentator's.
    sources: [lds-scriptures, keil-jeremiah]
  - ref: 34
    phrase: Their Redeemer is strong
    kind: christ
    title: Their Redeemer is strong
    body: |
      The Redeemer who “shall throughly plead their cause” is the Lord Jesus Christ: Israel “will be led by the Lord Jesus Christ (see v. 34). He is the advocate with the Father (see D&C 29:5) and pleads our cause before Him.” In the revelation cited there, He says, “I am in your midst, and am your advocate with the Father” ([[D&C 29:5]]).

      The Church edition's footnote sends verse 34 to Isaiah's “thy God that pleadeth the cause of his people” ([[Isa. 51:22]]). In Jeremiah's own words the Redeemer who pleads for Israel against Babylon is the one who will also say “I will plead thy cause, and take vengeance for thee” ([[Jer. 51:36]]). The same Lord is advocate to His people and adversary to the power that held them.
    sources: [ot-manual-25, lds-scriptures]
  - ref: 40
    phrase: As God overthrew Sodom and Gomorrah
    kind: scripture
    title: As God overthrew Sodom
    body: |
      Isaiah makes the same comparison, so Babylon's end is told twice by two prophets: “Babylon, the glory of kingdoms, the beauty of the Chaldees’ excellency, shall be as when God overthrew Sodom and Gomorrah” ([[Isa. 13:19]]; the Church edition's footnote also points to [[Gen. 19:24]]). Verse 3 of this chapter, where “none shall dwell therein,” is footnoted to the next verse of Isaiah, “It shall never be inhabited” ([[Isa. 13:20]]).

      The ancient fall is read as a pattern: “the downfall anciently of Nebuchadnezzar's Babylon was a prototype of the future downfall of ‘Babylon the Great’ (see Revelation 18–19).” The Lord says the same in this dispensation: “even Babylon the great, which shall fall” ([[D&C 1:16]]).
    sources: [lds-scriptures, ot-manual-25]
  - ref: 41
    phrase: a people shall come from the north, and a great nation
    kind: scripture
    title: Words once said of Zion
    body: |
      Verses 41–43 repeat a passage Jeremiah spoke about Jerusalem, and the repetition reverses its target. In [[Jer. 6:22–24]] the Lord says of Zion, “a people cometh from the north country… They shall lay hold on bow and spear; they are cruel, and have no mercy; their voice roareth like the sea.” The Church edition's footnote at verse 41 points to it. Here the same words describe the army coming for Babylon, and the last line changes owner: “our hands wax feeble” (Jerusalem) becomes “his hands waxed feeble” (Babylon's king).

      Verses 44–46 likewise repeat, almost word for word, the Lord's words against Edom in [[Jer. 49:19–21]]. The oracle against Babylon is built in part from sentences the Lord had already spoken against Zion and against Edom; now Babylon hears them.
    sources: [lds-scriptures]
  - ref: 44
    phrase: who is a chosen man, that I may appoint over her
    kind: scripture
    title: That shepherd
    body: |
      The Lord asks who is the chosen man He will appoint over Babylon, and what shepherd can stand before Him. The Church edition's footnote on “shepherd” in this verse points to Isaiah's naming of Cyrus: “That saith of Cyrus, He is my shepherd, and shall perform all my pleasure: even saying to Jerusalem, Thou shalt be built” ([[Isa. 44:28]]). The footnotes for verse 38 point to the verse just before it, “That saith to the deep, Be dry, and I will dry up thy rivers” ([[Isa. 44:27]]), together with [[Jer. 51:36]].

      The footnote is a cross-reference, not an identification; no source read for this chapter says the chosen man is Cyrus. In the verse the questions read as a challenge: “who is like me? and who will appoint me the time? and who is that shepherd that will stand before me?” The same sentence stands in [[Jer. 49:19]] about Edom, so the question is not peculiar to Babylon.
    sources: [lds-scriptures]

christ: |
  The Redeemer is named in verse 34: “Their Redeemer is strong; the LORD of hosts is his name.” The Church reads Him as the Lord Jesus Christ, who leads Israel back and pleads their cause, “the advocate with the Father,” and the Lord says of Himself in this dispensation, “I am in your midst, and am your advocate with the Father” ([[D&C 29:5]]). In the same reading the chapter's promises belong together: Israel “will be forgiven (see v. 20). They will be led by the Lord Jesus Christ (see v. 34).” The promise to Israel after her return is stated by the risen Lord to the Nephites: “I will remember the covenant which I have made with my people” ([[3 Ne. 20:29]]).

explore: |
  - **The scroll sunk in the Euphrates.** Read [[Jer. 51:59–64]], then the rest of the oracle in [[Jer. 51]].
  - **Isaiah on Babylon.** Read [[Isa. 13]], [[Isa. 14]], [[Isa. 46]], and [[Isa. 47]] beside this chapter.
  - **Leave Babylon.** Read [[D&C 133:4–15]], and compare [[Jer. 51:6]].
  - **The new covenant.** Read [[Jer. 31:31–34]] and ask how verse 5 and verse 20 here depend on it.
  - **Babylon the Great.** Read [[Rev. 18]], the fall of “Babylon the Great,” of which Nebuchadnezzar's Babylon was a prototype.

sources: [bd-jeremiah, lds-scriptures, ot-manual-25, clarke-commentary, keil-jeremiah, bd-bel, bd-babylon, bd-captivities]
