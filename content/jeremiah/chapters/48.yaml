chapter: 48
title: Moab Hath Been at Ease
tagline: Jeremiah's longest oracle against a neighbor says that Moab's long comfort, pride, and trust in riches and in Chemosh will end in the exile Moab has never known, while the Lord mourns for the land and promises a return in the latter days.
when: 'No king or year is named in the chapter; it stands among the prophecies against foreign nations (chapters 46–51), in Jeremiah''s ministry of 626–586 B.C.'

setting: |
  Moab lay east of the Dead Sea. Its people descended from Lot and were kin to Israel, yet the two nations were constantly at war (see the note on verse 1).

  Why does a prophet of Judah speak to Moab at all? Because the Lord set Jeremiah “a prophet unto the nations” ([[Jer. 1:5]]), and because Moab was among the nations made to drink the cup of the Lord's wrath ([[Jer. 25:15–21]]). Moab's king also had messengers at Jerusalem with Zedekiah ([[Jer. 27:3]]). The chapter belongs to the book's “prophecies against foreign nations” (chapters 46–51), and its chapter heading gives the reason for this one: judgment comes on the Moabites “for their contempt of God.”

  The oracle moves in waves: towns fall and the land weeps (verses 1–10); Moab's long ease is the wine left on its lees (verses 11–17); a roll call of cities (verses 18–28); pride, and the Lord's own lament (verses 29–39); flight, snare, and fire, and then a promise (verses 40–47). Much of it overlaps Isaiah's “burden of Moab” ([[Isa. 15:1–9]]; [[Isa. 16:1–14]]).

thread: |
  Jeremiah 48 answers a question a reader may not expect from an oracle of doom: **what is wrong with being comfortable?**

  The chapter's diagnosis is in verse 11. Moab “hath been at ease from his youth” and has never been “emptied from vessel to vessel,” never carried into exile, so “his taste remained in him.” Alongside that ease the chapter names three things, one by one: trust in “works” and “treasures” (verse 7), a god, Chemosh, who cannot save his own people (verses 7, 13, 46), and pride that “magnified himself against the LORD” and laughed at Israel (verses 26–29, 42). The judgment is aimed at exactly what Moab never had: Moab is poured out, emptied, and taken captive (verses 12, 46).

  Yet the oracle is not cold. Among verses marked as the Lord's own speech (“saith the LORD,” verses 30, 35, 38) stand “I will howl for Moab” (verse 31) and “mine heart shall sound for Moab like pipes” (verse 36). And the chapter closes, against what the rest of the oracle seems to allow, with “Yet will I bring again the captivity of Moab in the latter days” (verse 47).

sections:
  - range: 1-10
    heading: The towns fall
    plain: |
      Against Moab, says the Lord of hosts, the God of Israel: Woe to Nebo, it is laid waste. Kiriathaim is shamed and taken; Misgab is shamed and dismayed. Moab will no longer be praised. In Heshbon they plot his end: “Come, let us cut him off from being a nation.” You too, Madmen, will be cut down; the sword will follow you. A cry rises from Horonaim, “Devastation and great destruction!” Moab is broken; her little ones cry out. Weeping goes up the slope of Luhith, and enemies hear the cry of ruin on the road down from Horonaim. Run for your lives, and be like the heath in the wilderness. Because you trusted in your works and your treasures, you too will be taken, and Chemosh will go into captivity with his priests and his princes. The spoiler will come against every town and none will escape; the valley will perish and the plain be destroyed, as the Lord has said. Give wings to Moab, for she will fly away, and her towns will be desolate with no one living in them. Cursed is the one who does the Lord's work deceitfully, and cursed the one who keeps back his sword from blood.
  - range: 11-17
    heading: Settled on his lees
    plain: |
      Moab has been at ease from his youth, settled on his lees like wine never emptied from one vessel to another. He has never gone into exile, so his taste and scent are unchanged. But the days are coming, says the Lord, when I will send wanderers to make him wander; they will empty his vessels and break his bottles. Then Moab will be ashamed of Chemosh as Israel was ashamed of Beth-el, in which it trusted. How can you say, “We are warriors, brave men in battle”? Moab is laid waste and has gone up out of his towns; his best young men go down to the slaughter, says the King, whose name is the Lord of hosts. Moab's disaster is near, his calamity comes fast. All his neighbors, all who know his name, mourn for him: “How the mighty scepter is broken, the glorious staff!”
  - range: 18-28
    heading: Come down from your glory
    plain: |
      Come down from your glory and sit in thirst, you who live in Dibon, for the destroyer of Moab will come against you and ruin your fortresses. You who live in Aroer, stand by the road and watch; ask the man running and the woman escaping, “What has happened?” Moab is shamed and broken: wail and cry out; tell it by the Arnon that Moab is laid waste. Judgment has come on the plain country, on Holon, Jahazah, and Mephaath, on Dibon, Nebo, and Beth-diblathaim, on Kiriathaim, Beth-gamul, and Beth-meon, on Kerioth and Bozrah, on all the towns of Moab, far and near. The horn of Moab is cut off and his arm is broken, says the Lord. Make him drunk, because he magnified himself against the Lord. Moab will wallow in his vomit and be laughed at. Was not Israel your laughingstock? Was he caught among thieves, that you leaped for joy whenever you spoke of him? Leave your towns and live among the rocks, you who live in Moab. Be like a dove that nests at the mouth of a cave.
  - range: 29-39
    heading: Pride, and the Lord's lament
    plain: |
      We have heard of Moab's pride, his great pride: his loftiness, his arrogancy, and the haughtiness of his heart. I know his wrath, says the Lord, but it shall not be so; his lies shall not accomplish it. So I wail over Moab; I cry out for all Moab; I mourn for the men of Kir-heres. I weep for you, vine of Sibmah, with the weeping of Jazer. Your branches spread over the sea, as far as the sea of Jazer, but the destroyer has fallen on your summer fruit and your grape harvest. Joy and gladness are gone from the plentiful field and the land of Moab. I have stopped the wine from the presses; no one treads it with shouting; their shouting is no shouting. From Heshbon to Elealeh and Jahaz their cry rises, from Zoar to Horonaim, for even the waters of Nimrim are dried up. I will put an end in Moab, says the Lord, to those who offer on the high places and burn incense to their gods. So my heart moans for Moab like a flute, and for the men of Kir-heres, because the wealth they gained is gone. Every head is shaved and every beard cut off; every hand is gashed and every waist covered with sackcloth. On all the roofs and in the streets of Moab there is nothing but mourning, for I have broken Moab like a vessel in which is no pleasure, says the Lord. How shattered he is! How they wail! How Moab turns his back in shame! Moab has become a laughingstock and a horror to all around him.
  - range: 40-47
    heading: Eagle, snare, fire, and promise
    plain: |
      This is what the Lord says: he shall fly as an eagle and spread his wings over Moab. Kerioth is captured and the strongholds seized; on that day the heart of Moab's warriors will be like the heart of a woman in labor. Moab will be destroyed as a people, because he magnified himself against the Lord. Terror, pit, and trap await you, people of Moab, says the Lord. Whoever flees the terror will fall into the pit; whoever climbs out of the pit will be caught in the trap, for I will bring on Moab the year of their visitation. The fugitives stood in the shadow of Heshbon because of the force against them, but a fire will go out from Heshbon, a flame from the midst of Sihon; it devours the corner of Moab and the crown of the head of the tumultuous ones. Woe to you, Moab! The people of Chemosh are destroyed; your sons are taken into captivity and your daughters too. Yet I will bring again the captivity of Moab in the latter days, says the Lord. Here ends the judgment on Moab.

notes:
  - ref: 1
    phrase: Against Moab
    kind: history
    title: Moab, Israel's kin and neighbor
    body: |
      Moab was a kindred nation next door. Moab was the son of Lot's eldest daughter ([[Gen. 19:37]]); his land “lay east of the Dead Sea,” and their speech “closely resembled Hebrew,” but “there was constant warfare between the two nations.” Yet Israel had been told not to “distress” Moab or contend with it in battle, “because I have given Ar unto the children of Lot for a possession” ([[Deut. 2:9]]).

      That is why a prophet of Judah speaks to Moab. His commission was to the nations ([[Jer. 1:5]]; [[Jer. 1:10]]), and Moab is named among the nations who must drink the cup of the Lord's fury ([[Jer. 25:15–17]]; [[Jer. 25:21]]). Moab also had dealings with Jerusalem in Jeremiah's own day: the king of Moab is among those whose messengers came to Zedekiah ([[Jer. 27:3]]). The oracle says nothing about when it was spoken, so it can't be tied to a single event.
    sources: [bd-moab, lds-scriptures]
  - ref: 2
    phrase: Also thou shalt be cut down, O Madmen
    kind: words
    title: Madmen is a town, and a pun
    body: |
      Madmen is a place, “a location in Moab,” not “mad men.” The line plays on the name. The verb behind “shalt be cut down,” *tiddommi*, sounds like *Madmen* and comes from a verb meaning “be or grow dumb, silent, still”; this verse is filed under the sense “be still,” that is, “perish.” The KJV's “cut down” gives that sense. In the Hebrew, Madmen will be made silent, and the sword follows.
    sources: [bdb, lds-scriptures]
  - ref: 3
    phrase: A voice of crying shall be from Horonaim
    kind: scripture
    title: The same lament as Isaiah's burden of Moab
    body: |
      Jeremiah's lament and Isaiah's “burden of Moab” share many lines. “Luhith” and “Horonaim” with “a cry of destruction” stand in [[Jer. 48:5]] and [[Isa. 15:5]]; “Heshbon… Elealeh… Jahaz” in [[Jer. 48:34]] and [[Isa. 15:4]]; the bald heads and cut beards in [[Jer. 48:37]] and [[Isa. 15:2]]; the pride of Moab, with “his lies shall not be so,” in [[Jer. 48:29–30]] and [[Isa. 16:6]]; the joy taken from the “plentiful field” in [[Jer. 48:33]] and [[Isa. 16:10]]; the heart that sounds for Moab in [[Jer. 48:36]] and [[Isa. 16:11]].

      The overlap raises the question of which prophet is using which. One reading is that Jeremiah's verses are “based on” Isaiah's. The text does not say, and nothing in the chapter depends on it. What the overlap does show is that the charge is not new with Jeremiah: Isaiah's oracle already charges Moab with pride and already has a heart crying out for Moab. Reading Isaiah 15–16 beside this chapter shows which lines are shared and which are Jeremiah's own.
    sources: [lds-scriptures, keil-jeremiah]
  - ref: 7
    phrase: thou hast trusted in thy works and in thy treasures
    kind: scripture
    title: Trusting what you have made
    body: |
      Moab's trust was in what it had made and gathered, and the Church edition's footnotes (at verses 7 and 36) link it to two Book of Mormon prophets who made the same charge. Abinadi asks the priests of Noah, “Why do ye set your hearts upon riches?” ([[Mosiah 12:29]]). Samuel the Lamanite, at the verse about Moab's lost riches (verse 36), warns the Nephites that the Lord “curseth your riches, that they become slippery,” and that “shall ye weep and howl in that day” ([[Hel. 13:31–32]]), words that echo Jeremiah's “howl” and “weeping” over Moab.

      The word translated “works” is a general one: on one reading it means “all that Moab undertakes,” its efforts to build up power and wealth. So read, the verse is not about idle wealth alone but about what a nation puts its confidence in. What Moab trusted could be carried off, and verse 36 says that is what happens: “the riches that he hath gotten are perished.”
    sources: [lds-scriptures, keil-jeremiah]
  - ref: 7
    phrase: Chemosh shall go forth into captivity with his priests and his princes together
    kind: history
    title: Chemosh, the god of Moab
    body: |
      Chemosh was Moab's god, and Israel's own history knows him by name: Solomon built a high place “for Chemosh, the abomination of Moab” ([[1 Kgs. 11:7]]), and the Lord says of those who forsook Him that they “worshipped… Chemosh the god of the Moabites” ([[1 Kgs. 11:33]]). King Josiah later defiled that site ([[2 Kgs. 23:13]]); Jeremiah's ministry began in his reign.

      The Moabites are “the people of Chemosh,” in the old song in [[Num. 21:29]] and again in [[Jer. 48:46]], much as Israel is the Lord's people. A god who “shall go forth into captivity” along with his priests and princes cannot deliver anyone, and the judgment falls because “these people had forfeited their lives by their idolatry and other crimes.”
    sources: [lds-scriptures, ot-manual-25, bd-jeremiah]
  - ref: 10
    phrase: Cursed be he that doeth the work of the LORD deceitfully
    kind: words
    title: A curse on the careless executioner
    body: |
      The curse falls on whoever carries out the Lord's judgment on Moab half-heartedly. “Deceitfully” is the KJV's rendering of a Hebrew word (*remiyyah*) that can mean “deceit” or, in a second sense listed in the lexicon, “laxness, slackness,” and this very verse is filed there, where it describes how the work is done. The Lord's work on Moab is not to be done carelessly.

      The second half, “cursed be he that keepeth back his sword from blood,” says the same thing to the enemy that will come: the curse falls on Moab's enemies “if they did not proceed to destroy her,” for “God is the author of life and has the right to give and take it.”
    sources: [bdb, ot-manual-25]
  - ref: 11
    phrase: he hath settled on his lees
    kind: symbol
    title: Wine left on its lees
    body: |
      The image is wine that has never been poured off its sediment. Moab is “old wine that has lain long on its lees” and so has kept “its flavour and smell unchanged”: at ease since youth, never “emptied from vessel to vessel,” never carried into exile, “therefore his taste remained in him, and his scent is not changed.” On one reading the picture is of an inferior wine that grows harsh and thick for lack of being poured out, and Moab's “taste” is its hostile spirit toward Israel.

      The same image is used for complacent people in Jerusalem: the Lord “will search Jerusalem with candles, and punish the men that are settled on their lees” ([[Zeph. 1:12]]). Verse 12 then reverses it. The Lord will send “wanderers,” literally those who tip and pour things out, who “shall empty his vessels, and break their bottles.” Moab's unchanged ease ends when it is poured out.
    sources: [keil-jeremiah, lds-scriptures]
  - ref: 13
    phrase: as the house of Israel was ashamed of Beth-el their confidence
    kind: history
    title: Israel's Beth-el, Moab's Chemosh
    body: |
      Moab will be shamed by Chemosh as Israel was shamed by Beth-el. Beth-el was where Jeroboam set one of the two golden calves, so that his people would not go up to Jerusalem ([[1 Kgs. 12:28–29]]). Hosea says of the calves of “Beth-aven,” which the Church edition's footnotes link to Jeroboam's calves and to this verse, that “Israel shall be ashamed of his own counsel” ([[Hosea 10:6]]). The comparison tells Moab that Israel has already learned what Moab is about to learn: a god of one's own making fails the people who trust it.
    sources: [lds-scriptures]
  - ref: 26
    phrase: he magnified himself against the LORD
    kind: scripture
    title: The cup and the charge
    body: |
      “Make ye him drunken” is the cup of the Lord's fury, which Moab was among the nations to drink ([[Jer. 25:15–17]]; [[Jer. 25:21]]): “Drink ye, and be drunken, and spue, and fall, and rise no more” ([[Jer. 25:27]]). The charge is that Moab “magnified himself against the LORD,” and verse 27 gives the particular offense: Israel was “a derision unto thee,” and every time Moab spoke of him, “thou skippedst for joy.”

      Zephaniah states the charge in the same terms: “I have heard the reproach of Moab… whereby they have reproached my people, and magnified themselves against their border” ([[Zeph. 2:8]]). “This shall they have for their pride” ([[Zeph. 2:10]]). So Moab is judged for mocking the people of the Lord, not only for being a foreign nation.
    sources: [lds-scriptures]
  - ref: 31
    phrase: Therefore will I howl for Moab
    kind: scripture
    title: Who weeps for Moab
    body: |
      The “I” who weeps in verses 31–36 reads most naturally as the Lord. The lament is framed by His speech: “I know his wrath, saith the LORD” (verse 30), “I have caused wine to fail” (verse 33), “I will cause to cease in Moab, saith the LORD” (verse 35), “I have broken Moab… saith the LORD” (verse 38), and nothing in the text marks a change of speaker. On that reading it is the judge Himself who says “I will howl for Moab,” “mine heart shall mourn,” and “mine heart shall sound for Moab like pipes.” Another reading takes the mourner to be the prophet, as in Isaiah's oracle, where the same words stand: “My heart shall cry out for Moab” ([[Isa. 15:5]]).

      If the Lord is the speaker, the passage agrees with what the Lord shows Enoch: “the God of heaven looked upon the residue of the people, and he wept,” and Enoch asks, “How is it that thou canst weep, seeing thou art holy?” ([[Moses 7:28–29]]). Either way, the grief is spoken over a judgment the chapter says Moab has earned.
    sources: [lds-scriptures, keil-jeremiah]
  - ref: 40
    phrase: he shall fly as an eagle
    kind: symbol
    title: The eagle that is not named
    body: |
      The verse does not say who the eagle is, but the Church edition ties the image to Ezekiel's “great eagle with great wings” ([[Ezek. 17:3]]), whose meaning Ezekiel is then given: “the king of Babylon is come to Jerusalem” ([[Ezek. 17:12]]). So one natural reading is that the eagle over Moab is the Babylonian power. It agrees with how the prophecy against Moab was fulfilled: its people “were taken captive by the Chaldeans and never afterward resumed their status as a nation.” Babylon is not named in Jeremiah 48, so the reading is an inference from the cross-reference.
    sources: [lds-scriptures, ot-manual-25]
  - ref: 45
    phrase: a fire shall come forth out of Heshbon
    kind: scripture
    title: The old song of Heshbon turned around
    body: |
      Verses 45–46 take a victory song over Moab and use it against Moab again. Sihon, whose city was Heshbon, had “fought against the former king of Moab, and taken all his land” ([[Num. 21:26]]), and a saying from that time in [[Num. 21:28–29]] celebrates it: “a fire gone out of Heshbon, a flame from the city of Sihon: it hath consumed Ar of Moab,” and “Woe to thee, Moab! thou art undone, O people of Chemosh: he hath given his sons… and his daughters, into captivity.” Jeremiah's lines are nearly the same: fire “out of Heshbon,” “woe be unto thee, O Moab,” “thy sons are taken captives, and thy daughters captives.” What Heshbon did to Moab long ago is what Moab will suffer now.

      “The corner of Moab” also echoes Balaam's oracle, “a Sceptre shall rise out of Israel, and shall smite the corners of Moab” ([[Num. 24:17]]), a link the Church edition's footnotes make.
    sources: [lds-scriptures]
  - ref: 47
    phrase: Yet will I bring again the captivity of Moab in the latter days
    kind: scripture
    title: Moab in the latter days
    body: |
      The chapter ends with a promise that Moab will return, in the “latter days.” The destruction in verse 42 is the end of Moab as a people, not of every Moabite: “their identity as a people would cease,” “even though people continued to live in the land of Moab.” Verse 47 “could mean the conversion of the remnants of these people to the gospel in the last days.” That is a cautious reading (“could”), and the verse itself does not say what the restoration is.

      The same promise follows Ammon ([[Jer. 49:6]]) and Elam, “in the latter days” ([[Jer. 49:39]]). The Church edition's footnote also points from this verse to [[Isa. 16:1–5]], where Moab is asked to shelter the Lord's outcasts (“Let mine outcasts dwell with thee, Moab”) and “in mercy shall the throne be established” ([[Isa. 16:4–5]]). The footnote makes that link; the verses do not say more.
    sources: [ot-manual-25, lds-scriptures]

christ: |
  The chapter points to Christ in two ways. The first is Balaam's oracle: “there shall come a Star out of Jacob, and a Sceptre shall rise out of Israel, and shall smite the corners of Moab” ([[Num. 24:17]]). The Church edition's footnotes tie it to the “corner of Moab” in verse 45 and gloss it as speaking of One whose “coming was to be in the future, long after Moses' time,” indexed under “Jesus Christ, Prophecies about.” The second is Ruth. Moab is not only an enemy of Israel's story: Ruth the Moabitess ([[Ruth 1:4]]) was the mother of Obed, “the father of Jesse, the father of David” ([[Ruth 4:13]]; [[Ruth 4:17]]), and so stands in the line that ends with Jesus ([[Matt. 1:5–6]]). The Lord who promises Moab's return in verse 47 is the God of Israel who opens the oracle (verse 1); if the voice that howls for Moab in verse 31 is His too (see the note there), He is the God who, in Enoch's vision, “wept” over the people He judged ([[Moses 7:28]]).

explore: |
  - **Isaiah's Moab.** Read [[Isa. 15:1–9]] and [[Isa. 16:1–14]] next to this chapter and mark the lines they share.
  - **The cup of wrath.** Read [[Jer. 25:15–29]], where Moab is one of the nations that drinks.
  - **Balaam and Moab.** Read [[Num. 22:1–6]] and [[Num. 24:15–19]].
  - **The next oracle.** Read [[Jer. 49:1–22]], on Ammon and Edom, which follows the same pattern.
  - **Ruth.** Read [[Ruth 1:1–5]] and [[Ruth 4:13–22]].

sources: [bd-moab, bd-jeremiah, lds-scriptures, ot-manual-25, bdb, keil-jeremiah]
