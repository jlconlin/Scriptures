chapter: 9
title: Oh That My Head Were Waters
tagline: The prophet wishes he could weep enough for his people, or else escape them; the Lord answers with judgment, calls for professional mourners, and says the only thing worth boasting in is knowing Him.
when: 'Under Jehoiakim (608–597 B.C. by the Bible Dictionary, which places chapters 7–20 in his reign); the chapter gives no date of its own'

setting: |
  This chapter belongs to the second division of the book, the prophecies “under Jehoiakim (608–597), Jer. 7–20.” It follows the temple sermon of chapter 7 and the long indictment of chapter 8, and it gives no date of its own. The Church's chapter heading says: “Jeremiah sorrows greatly because of the sins of the people—They will be scattered among the nations and punished.”

  The speaker shifts without announcement: the prophet grieves in verses 1–2, and the Lord says “saith the LORD” in verses 3, 6, 9 and 13–16. The movement is from grief to accusation, to sentence, to a call for mourners, and then to a single exception to the ruin: whoever wants to boast may boast in knowing the Lord. The chapter ends by listing Judah among the nations around it.

  Few passages in scripture lament the results of sin as movingly as this one; it stands with David's cry over Absalom, Jesus' lament over Jerusalem, and Mormon's lament over his people. The footnotes at verse 24 lead to Paul's use of the line in the New Testament and to Ammon's boast in the Book of Mormon.

thread: |
  Jeremiah 9 asks what a prophet does when the people he loves will not turn back. The first answer is that he grieves, and wishes he could stop (verses 1–2). The chapter then shows that the Lord is no colder than His prophet: He asks, “how shall I do for the daughter of my people?” (verse 7) even as He pronounces the sentence. That pairing of grief and judgment is the key to the chapter.

  The accusation is of a society in which words can no longer be trusted: bent tongues, slander, “peace” spoken to a neighbor while an ambush is planned (verses 3–8). From there the chapter moves through the sentence (verses 9–16) and the call for the mourning women (verses 17–22) to its center, the one thing that does not fail: “that he understandeth and knoweth me” (verse 24). The closing verses test everyone, Judah included, by that same standard: not the outward mark but the heart (verses 25–26). A people that does not know the Lord ends up with neither truth in its mouth nor a covenant in its heart.

sections:
  - range: 1-6
    heading: A prophet who would rather flee
    plain: |
      “If only my head were a spring of water and my eyes a fountain of tears, I would weep day and night for the slain of my people. If only I had a lodging place in the wilderness, I would leave my people and go away from them, for they are all adulterers, a crowd of traitors. They bend their tongues like a bow to shoot lies. They are not strong for truth in the land, they go from one evil to the next, and they do not know me, says the Lord. Be on guard against your neighbor and do not trust any brother, for every brother cheats and every neighbor goes about slandering. Each deceives the other and no one speaks the truth. They have taught their tongues to lie and they wear themselves out doing wrong. You live in the middle of deceit, and in their deceit they refuse to know me, says the Lord.”
  - range: 7-11
    heading: The Lord's verdict
    plain: |
      So the Lord of hosts says, “I will refine and test them, for what else can I do with my people? Their tongue is a deadly arrow that speaks deceit. One speaks peace to his neighbor but lays an ambush in his heart. Should I not punish them for this? Should I not take vengeance on a nation like this?” For the mountains and the wilderness pastures I will raise weeping and mourning, because they are burned up and no one passes through; no cattle are heard, and birds and animals have fled. “I will make Jerusalem a heap of ruins and a haunt of jackals, and the cities of Judah an empty waste.”
  - range: 12-16
    heading: Why the land is ruined
    plain: |
      Who is wise enough to understand this? Who has heard from the Lord and can explain why the land is ruined and burned like a wilderness no one crosses? The Lord answers: “Because they abandoned my law that I set before them, did not obey my voice or walk by it, but followed their own stubborn hearts and the Baals their fathers taught them. So I will feed this people wormwood and give them water of gall to drink. I will scatter them among nations neither they nor their fathers have known, and I will send the sword after them until it has finished them.”
  - range: 17-22
    heading: Call the mourning women
    plain: |
      “Think, and call for the women who mourn; send for the skilled women to come quickly and raise a lament for us, until our eyes run with tears.” A cry of wailing is heard from Zion: “We are ruined! We are deeply ashamed, because we have had to leave the land and our homes have been torn down.” Women, hear the word of the Lord: teach your daughters the lament, and each her neighbor a dirge. Death has climbed in through our windows and entered our palaces, to cut off children from the streets and young men from the squares. Say: “The bodies of men will fall like dung on the open field, like grain behind the reaper, and no one will gather them.”
  - range: 23-26
    heading: Boast in knowing the Lord
    plain: |
      The Lord says: “Let not the wise boast in wisdom, nor the strong in strength, nor the rich in riches. But let anyone who boasts boast in this, that he understands and knows me, that I am the Lord who acts with steadfast love, justice, and righteousness on the earth; in these I delight.” The days are coming when the Lord will punish all who are circumcised in the flesh but not in the heart: Egypt, Judah, Edom, Ammon, Moab, and all the desert peoples who clip the hair at their temples. All these nations are uncircumcised, and all the house of Israel is uncircumcised in heart.

notes:
  - ref: 1
    phrase: Oh that my head were waters, and mine eyes a fountain of tears
    kind: history
    title: The weeping prophet
    body: |
      The speaker in verse 1 is Jeremiah, wishing for more tears than a body can make: “Jeremiah sorrows greatly because of the sins of the people,” as the chapter heading puts it.

      Except perhaps for David's cry over Absalom ([[2 Sam. 18:33]]), Jesus' lament over Jerusalem ([[Matt. 23:37]]), and Mormon's lament over the destroyed Nephite nation ([[Morm. 6:16–22]]), “few passages lamenting the results of sin in the scriptures are as moving as” this one.
    sources: [lds-scriptures, ot-manual-23]
  - ref: 2
    phrase: a lodging place of wayfaring men
    kind: words
    title: A caravan inn in the wilderness
    body: |
      The “lodging place” is a building for travelers, not an open campsite. One reading is that it is “a building (khan) erected on the route of the caravans, as a shelter for travellers.” Jeremiah's wish is the opposite of his weeping in verse 1: there he longs to weep without limit for his people, and here he longs to be away from them, because they are “all adulterers, an assembly of treacherous men.”

      The two wishes sit side by side in the text, and it does not resolve them.
    sources: [keil-jeremiah, lds-scriptures]
  - ref: 3
    phrase: they bend their tongues like their bow for lies
    kind: symbol
    title: The tongue as a bow and an arrow
    body: |
      The charge is that speech has become a weapon. The tongue is a drawn bow here, and in verse 8 “Their tongue is as an arrow shot out; it speaketh deceit.” The Church edition's footnote sends the reader to [[Ps. 64:3]], which describes the wicked who “bend their bows to shoot their arrows, even bitter words”; the line also fits the hypocrisy of verse 8, where a man “speaketh peaceably to his neighbour with his mouth, but in heart he layeth his wait.”

      The verse ends with “they know not me,” and the chapter links the lying to that: “through deceit they refuse to know me” (verse 6). Knowing the Lord is also where the chapter ends up, as the one thing worth boasting in (verse 24).
    sources: [lds-scriptures]
  - ref: 4
    phrase: every brother will utterly supplant
    kind: words
    title: Every brother a Jacob
    body: |
      “Supplant” is the verb Esau puns on when he complains of his brother's name: “Is not he rightly named Jacob? for he hath supplanted me these two times” ([[Gen. 27:36]]). It means to “follow at the heel,” figuratively to “assail insidiously, circumvent, overreach,” and it is used of Jacob taking his brother by the heel in [[Hosea 12:3]]. Verse 4 doubles it for emphasis (*ʿaqov yaʿqov*, “surely overreacheth”), and the second word has the same consonants as the name Jacob.

      One reading is that “there seems to be an allusion to Jacob's underhand dealing with his brother Esau.” Either way, the verse is about the loss of trust inside families: no brother can be trusted not to overreach his brother.
    sources: [bdb, oshb-wlc, keil-jeremiah, lds-scriptures]
  - ref: 7
    phrase: how shall I do for the daughter of my people?
    kind: words
    title: The Lord's own grief
    body: |
      The Lord's question in verse 7, “how shall I do for the daughter of my people?” echoes the prophet's grief in verse 1. The same expression, “the daughter of my people,” was Jeremiah's in verse 1 and is the Lord's here. So the two speakers use the same words about the same people, and the sentence of verse 7 (“I will melt them, and try them”) is not spoken in coldness.

      Verse 9 follows with the question “shall not my soul be avenged on such a nation as this?” The two questions belong together: He asks what else He can do for His people, and He answers that He cannot let the deceit go unanswered.
    sources: [lds-scriptures]
  - ref: 11
    phrase: a den of dragons
    kind: words
    title: Dragons that are jackals
    body: |
      The “dragons” are jackals. The footnote in the Church's edition gives the Hebrew as “jackals.” Jerusalem, the city of the temple, will be a ruin where animals live and people do not, and the “cities of Judah” with it, “without an inhabitant.”
    sources: [lds-scriptures]
  - ref: 14
    phrase: after Baalim, which their fathers taught them
    kind: history
    title: What the fathers taught
    body: |
      The charge in verses 13–14 is that the people left the Lord's law and followed their own hearts and the Baals, “which their fathers taught them.” The footnote at this verse points to Manasseh, who “reared up altars for Baalim” and “worshipped all the host of heaven” ([[2 Chr. 33:3]]). That reign is the scriptural example of a father teaching Baal worship to those who came after.

      The verse also answers the question of verse 12: the wise man who can explain why the land is ruined has only to repeat what the Lord says in verse 13. The cause is not that the Lord was unable to protect the land. It is “because they have forsaken my law.”
    sources: [lds-scriptures]
  - ref: 16
    phrase: till I have consumed them
    kind: prophets
    title: Scattered but not extinct
    body: |
      “Consumed” does not mean that Israel ends: “to be consumed does not mean to become extinct.” In the prophecies of scattering, being consumed “meant to be utterly disorganized and disbanded so that Israel's power, influence, and cohesiveness as a nation was gone.” Moses told Israel they would “utterly be destroyed” ([[Deut. 4:26]]), yet the verses that follow show Israel still existing, as homeless individuals among the nations.

      Verse 16 also repeats the words of the covenant curses: the Lord will scatter them among nations “whom neither they nor their fathers have known,” which is how [[Deut. 28:64]] says it: “among all people… and there thou shalt serve other gods, which neither thou nor thy fathers have known.” The scattering Jeremiah announces is the one Moses said would follow disobedience.
    sources: [ot-manual-23, lds-scriptures]
  - ref: 17
    phrase: call for the mourning women
    kind: history
    title: Hired mourners
    body: |
      Jeremiah is told to hire professional mourners to lament over Judah. The Lord “referred to the custom in ancient Israel of hiring professional mourners, women who were paid to wail and lament for long periods of time at someone's death.”

      The lament they are to learn (“teach your daughters wailing,” verse 20) is for every house: “death is come up into our windows, and is entered into our palaces” (verse 21). The cry in verse 19 says “we”: the people themselves are given the words of their own lament.
    sources: [ot-manual-23, lds-scriptures]
  - ref: 24
    phrase: let him that glorieth glory in this, that he understandeth and knoweth me
    kind: scripture
    title: The only thing worth boasting in
    body: |
      The verse names what is worth boasting in, and the New Testament and the Book of Mormon both take it up. After setting aside wisdom, might, and riches (verse 23), the Lord says that the one thing worth glorying in is knowing Him, as “the LORD which exercise lovingkindness, judgment, and righteousness, in the earth.” Paul writes, “He that glorieth, let him glory in the Lord” ([[1 Cor. 1:31]]; [[2 Cor. 10:17]]), and he has just said that “not many wise men after the flesh, not many mighty, not many noble, are called” ([[1 Cor. 1:26]]): two of the three groups Jeremiah names, the wise and the mighty.

      Ammon, rebuked by his brother Aaron for boasting, answers, “I do not boast in my own strength, nor in my own wisdom,” and concludes, “if this is boasting, even so will I boast; for this is my life and my light, my joy and my salvation” ([[Alma 26:10–11, 36]]). The Church edition's footnotes at Jeremiah 9:24 lead to these passages.

      The verse also explains what “knowing” means: knowing Him *as* one who exercises kindness, justice, and righteousness. One reading is that the three are connected, so that kindness (*chesed*, “grace, favour”) is the foundation on which right and justice rest.
    sources: [lds-scriptures, keil-jeremiah]
  - ref: 25
    phrase: I will punish all them which are circumcised with the uncircumcised
    kind: words
    title: Circumcised in body, uncircumcised in heart
    body: |
      The point of verses 25–26 is that the outward mark is not enough: “all the house of Israel are uncircumcised in the heart.” Circumcision was “a token given to Abraham as a sign that a child was born into the covenant,” but “the true circumcision after a person is accountable is that of the heart,” as this passage teaches along with [[Deut. 10:16]], [[Deut. 30:6]], and [[Rom. 2:25–29]]. Judah had the physical mark but lacked the spiritual receptivity to match it.

      The KJV's “circumcised with the uncircumcised” sounds like two groups punished together. One reading takes the Hebrew as describing a single group, “circumcised and yet possessed of the foreskin,” which is the point of the list that follows: Judah stands between Egypt and Edom, in the same class as Egypt, where “some of the best evidence for circumcision in ancient times” is found. On this reading a physical mark did not make Judah different from its neighbors.

      The heart was the test, as in [[Jer. 4:4]], where Jeremiah calls on Judah to take away the foreskins of its heart. The idea is that a barrier between a person and God has to come off; circumcision of the heart suggests “removing any barrier between us and God, opening the heart to the influence of the divine.”
    sources: [ot-manual-23, sc-knowhy-872, keil-jeremiah, lds-scriptures]
  - ref: 26
    phrase: all that are in the utmost corners
    kind: words
    title: Not far-off corners but clipped temples
    body: |
      “In the utmost corners” is a misleading rendering. The Hebrew is a participle meaning “cut off,” followed by the word for “corner” or “side”; the lexicon takes it to mean “those clipped on the temples,” an epithet of Arabian tribes, and lists it here and in [[Jer. 25:23]] and [[Jer. 49:32]]. The same “corner” appears in the law's ban on rounding “the corners of your heads” ([[Lev. 19:27]]), which the lexicon glosses as “your temples.”

      So the verse is naming people who clip their hair at the temples, and the Church edition's footnote points to Jeremiah 25:23, where the phrase returns. The same cut was forbidden to Israel ([[Lev. 19:27]]), yet Judah is counted here with these peoples.
    sources: [bdb, lds-scriptures, oshb-wlc]

christ: |
  Paul sets the line from verse 24 directly after naming Christ. He writes that Christ Jesus “of God is made unto us wisdom, and righteousness, and sanctification, and redemption,” and then, “That, according as it is written, He that glorieth, let him glory in the Lord” ([[1 Cor. 1:30–31]]). For Paul, the Lord in whom one may boast is the Lord known in Christ.

  Jeremiah's lament also stands beside the Savior's own lament over the same city: “O Jerusalem, Jerusalem, thou that killest the prophets… how often would I have gathered thy children together… and ye would not!” ([[Matt. 23:37]]).

explore: |
  - **The same warning, earlier.** Compare verses 1–6 with the charges in [[Jer. 5:1–9]] and [[Jer. 7:1–11]].
  - **The refrain of mourning.** Read [[Jer. 8:18–22]], just before this chapter, then [[Lam. 1:1–2]].
  - **Boasting in the Lord.** Read [[1 Cor. 1:26–31]] and [[Alma 26:10–16]].
  - **Circumcision of the heart.** Read [[Jer. 4:4]], [[Deut. 10:16]], and [[Rom. 2:25–29]].
  - **The scattering foretold.** Read [[Deut. 28:36–37, 64]] with verses 15–16.

parallels:
  - ref: 1 Cor. 1:31
    note: Paul writes “He that glorieth, let him glory in the Lord,” the same charge as verse 24.
  - ref: Alma 26:36
    note: Ammon boasts, as he says, in his God, not in his own strength or wisdom.

sources: [lds-scriptures, ot-manual-23, keil-jeremiah, bdb, oshb-wlc, sc-knowhy-872]
