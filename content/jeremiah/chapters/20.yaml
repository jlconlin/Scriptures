chapter: 20
title: A Burning Fire Shut Up in My Bones
tagline: A temple officer beats Jeremiah and locks him in the stocks; the prophet answers with a new name for his tormentor, then pours out a prayer of complaint.
when: 'In the reign of Jehoiakim (608–597 B.C. by the Bible Dictionary), which it groups with chapters 7–20; the chapter gives no year of its own'

setting: |
  Chapter 19 ends with Jeremiah standing in the court of the temple and repeating that the troubles ahead were coming because of Judah's wickedness. Chapter 20 begins with the reply. Pashur, an officer of the temple, hears what Jeremiah is saying, has him beaten, and puts him in the stocks overnight. The Church's chapter heading sums up the first half: “Jeremiah is smitten and put in the stocks—He prophesies that all Judah will be taken captive by Babylon.”

  Jeremiah faced “continuous opposition and insult from the priests (20:2),” and he was himself of a priestly family, “of the priests that were in Anathoth” ([[Jer. 1:1]]), so the man who strikes him here is a fellow priest, not a foreigner or a king. The chapter then turns from public confrontation to private prayer. Verses 7–18 are among the poetic laments or complaints scattered through chapters 11–20, “passages [that] reveal the emotional and spiritual turmoil Jeremiah experienced during his difficult ministry.”

  Lehi, who began to prophesy in Jerusalem “in the commencement of the first year of the reign of Zedekiah” ([[1 Ne. 1:4]]), met the same reception: the Jews mocked him and “sought his life” ([[1 Ne. 1:19–20]]), and Nephi records that they had cast Jeremiah into prison ([[1 Ne. 7:14]]).

thread: |
  This chapter asks what a prophet does when the word of God costs him everything and the results look like defeat. Jeremiah's answer comes in three movements, and the third undoes the comfort of the second.

  In verses 1–6, he is struck, confined, and released, and he does not retreat: he gives his tormentor a new name and tells him what is coming. In verses 7–13, he turns that frustration toward God: he complains, resolves to be silent, finds that he cannot, and ends by praising the Lord who is with him. Then verses 14–18 plunge again, into a curse on the day of his birth. The chapter does not resolve the tension between verses 13 and 14, and that is its honesty. The same man who says “Sing unto the LORD” has, a line later, wished he had never been born. What holds the two together is verse 9: the word he tried to stop speaking will not stay in.

sections:
  - range: 1-6
    heading: Pashur and the stocks
    plain: |
      Pashur son of Immer, a priest and the chief officer in the Lord's house, heard Jeremiah prophesying these things. He had Jeremiah beaten and put in the stocks at the upper Benjamin Gate of the temple. The next day he let him out, and Jeremiah said, “The Lord has not named you Pashur, but Magor-missabib” (Terror on Every Side). “The Lord says: I will make you a terror to yourself and to all your friends; you will watch them fall by the sword. I will give all Judah to the king of Babylon, who will carry them off to Babylon and kill them with the sword. I will hand over all this city's wealth and everything the kings of Judah have stored up. And you, Pashur, and everyone in your house will go into captivity. You will go to Babylon and die there, and be buried there, you and all your friends to whom you prophesied lies.”
  - range: 7-13
    heading: Jeremiah's complaint, and his praise
    plain: |
      “Lord, you enticed me, and I let myself be enticed; you were stronger than I and you prevailed. I am a laughingstock all day, and everyone mocks me. Every time I speak I have to shout about violence and destruction, and the Lord's word has brought me only insult and scorn. So I said, ‘I will not mention him or speak in his name any more.’ But his word is in my heart like a fire burning in my bones. I am worn out trying to hold it in; I cannot. I hear many whispering, ‘Terror on every side! Report him! Let's report him!’ Even my close friends are waiting for me to slip: ‘Maybe he'll be tricked, and we can overcome him and take our revenge.’ But the Lord is with me like a dreaded warrior; my persecutors will stumble and not prevail. They will be deeply shamed, with a disgrace that will not be forgotten. Lord of hosts, you who test the righteous and see the heart and mind, let me see your vengeance on them, for to you I have committed my cause. Sing to the Lord! Praise the Lord! He has rescued the life of the poor from the hands of the wicked.”
  - range: 14-18
    heading: Cursed be the day
    plain: |
      “Cursed be the day I was born! May the day my mother bore me never be blessed. Cursed be the man who brought my father the news, ‘A son is born to you!’ and made him so glad. May that man be like the cities the Lord overthrew without pity; may he hear an outcry in the morning and a battle cry at noon, because he did not kill me in the womb, so that my mother would have been my grave and her womb forever swollen. Why did I come out of the womb to see trouble and sorrow, and to end my days in shame?”

notes:
  - ref: 1
    phrase: Pashur the son of Immer the priest, who was also chief governor in the house of the LORD
    kind: history
    title: Who Pashur was
    body: |
      Pashur was a priest and a high temple official, the “chief overseer” of the house of the Lord. “Chief governor” is a title of rank; the Church edition's footnote gives the alternative “senior officer.” The priest Zephaniah held the same post ([[Jer. 29:26]]), and the book describes what it involved: officers “in the house of the Lord” were charged to put anyone who “maketh himself a prophet” into “prison, and in the stocks.” So Pashur is acting within the duties of his post, which means the opposition to Jeremiah here is official, from the temple's own authorities.

      His father's name, Immer, is also the name of the sixteenth priestly course ([[1 Chr. 24:14]]), which the Church edition's footnote cites, and of a large priestly family ([[Ezra 2:37]]); which is meant here cannot be determined. He is not the Pashur son of Melchiah (Malchiah) whom Zedekiah later sends to Jeremiah ([[Jer. 21:1]]); that Pashur is a separate man, though the Church edition's footnote on this verse also cites that passage.
    sources: [lds-scriptures, keil-jeremiah, ot-manual-24]
  - ref: 2
    phrase: Then Pashur smote Jeremiah the prophet, and put him in the stocks
    kind: history
    title: The stocks at the high gate of Benjamin
    body: |
      Stocks were “a wooden frame with holes to lock in the head, arms, legs, and feet,” and they were “an instrument of torture by which the body was forced into an unnatural position.” Pashur had Jeremiah beaten first and then locked in them; he was released “on the morrow” (verse 3), so the stocks held him overnight.

      The “high gate of Benjamin” was by the temple, not the city gate of the same name that appears later in the book ([[Jer. 37:13]]; [[Jer. 38:7]]). On one reading it was the north gate of the temple's inner court, so the punishment happened in the temple precincts where Pashur had authority.

      This was not the last time. Years later the princes would again “smote him, and put him in prison” ([[Jer. 37:15]]). The pattern is the one Samuel the Lamanite names among the Nephites, who say they would never have slain the prophets of old: “ye are angry with him, and cast him out and seek all manner of ways to destroy him” when a prophet “testifieth of your sins” ([[Hel. 13:25–26]]).
    sources: [seminary-jer-20, ot-manual-24, keil-jeremiah, lds-scriptures]
  - ref: 3
    phrase: The LORD hath not called thy name Pashur, but Magor-missabib
    kind: words
    title: Magor-missabib
    body: |
      Magor-missabib means “fear on every side,” and Jeremiah gives it to Pashur as a verdict, not an insult. The Church edition's footnote renders it “Terror all around.” Pashur's own name is glossed “free,” so the Lord had not called him “free” but “fear on every side.”

      Verse 4 explains the name: Pashur will be “a terror to thyself, and to all thy friends,” because he will watch his friends die and himself be carried away.

      The phrase already belongs to Jeremiah's vocabulary: “fear is on every side” ([[Jer. 6:25]]) and “fear was round about” ([[Jer. 46:5]]) are in his own prophecies, and it stands in [[Ps. 31:13]] as well. In verse 10 his enemies will use it against him.
    sources: [lds-scriptures, ot-manual-24]
  - ref: 4
    phrase: I will give all Judah into the hand of the king of Babylon
    kind: scripture
    title: All Judah into the hand of the king of Babylon
    body: |
      The prophecy to Pashur names the exile in three layers: Pashur and his friends (verses 4 and 6), the whole land of Judah (verse 4), and the wealth of the city (verse 5). The Church edition's footnotes link the plundered treasures to [[2 Kgs. 24:12–16]] and [[2 Kgs. 25:13–17]], which tell of the temple's treasures and craftsmen carried off to Babylon: “he carried away all Jerusalem, and all the princes, and all the mighty men of valour, even ten thousand captives” ([[2 Kgs. 24:14]]).

      Lehi read the same warning in Jerusalem: “many should perish by the sword, and many should be carried away captive into Babylon” ([[1 Ne. 1:13]]), the verse the Church edition cites at this place.
    sources: [lds-scriptures]
  - ref: 7
    phrase: O LORD, thou hast deceived me, and I was deceived
    kind: words
    title: Deceived, or persuaded
    body: |
      “Deceived” translates a Hebrew word that “means literally ‘enticed’ or ‘persuaded,’” and the Church edition's footnote says the same. The sense is not that the Lord lied to Jeremiah but that He drew him in: “Jeremiah may have been expressing frustration that the Lord had drawn him into prophetic duties that proved to be deeply challenging.”

      At his call Jeremiah had objected that he was a child, and the Lord answered with a command and a promise of deliverance ([[Jer. 1:6–8]]; [[Jer. 1:19]]). Verse 7 is Jeremiah looking back at being drawn into that work.
    sources: [ot-manual-24, scripture-helps-jer-1-3, lds-scriptures]
  - ref: 9
    phrase: his word was in mine heart as a burning fire shut up in my bones
    kind: prophets
    title: A burning fire shut up in my bones
    body: |
      Jeremiah resolves to say no more in the Lord's name and finds that he cannot; this was “the turning point of Jeremiah's life.” “Even as he vowed to close his mouth and walk away from the Lord's work, he found that he could not.” He did not quit preaching; he “determined to continue to trust in the Lord and preach the word regardless of the consequences.”

      What burns is the word itself, held back. The Church edition's footnotes pair the verse with others who could not stay silent: Ether, who “could not be restrained because of the Spirit of the Lord which was in him” ([[Ether 12:2]]), and Peter and John, “we cannot but speak the things which we have seen and heard” ([[Acts 4:20]]).
    sources: [holland-teacher, seminary-jer-20, lds-scriptures]
  - ref: 10
    phrase: fear on every side
    kind: scripture
    title: Fear on every side
    body: |
      The phrase Jeremiah gave Pashur is now thrown back at him by his enemies. What Jeremiah “heard” is a slogan, “Fear on every side,” followed by a plan: “Report, say they, and we will report it.” “Report” here likely means to report him to the authorities as a dangerous man, and even his “familiars” (the Church edition's footnote: “familiar friends”) lie in wait for his fall: “Peradventure he will be enticed.” The Hebrew behind “enticed” here is the same verb as the “deceived” of verse 7.

      The first clause is quoted, nearly word for word, from a lament of David: “For I have heard the slander of many: fear was on every side: while they took counsel together against me, they devised to take away my life” ([[Ps. 31:13]]), the verse the Church edition cites here. Jeremiah's trouble is old trouble, and he prays in words that a persecuted servant of the Lord had prayed before him.
    sources: [lds-scriptures, keil-jeremiah, biblehub-interlinear]
  - ref: 11
    phrase: But the LORD is with me as a mighty terrible one
    kind: scripture
    title: The Lord is with me
    body: |
      Verse 11 returns to the promise of the call. At the beginning the Lord had said of Jeremiah's enemies, “they shall not prevail against thee; for I am with thee, saith the Lord, to deliver thee” ([[Jer. 1:19]]; also [[Jer. 15:20]]). Here Jeremiah turns it around: because the Lord is with him, “my persecutors shall stumble, and they shall not prevail.” On one reading, the lament rises into confidence here because it rests on the promise given at his call.
    sources: [lds-scriptures, keil-jeremiah]
  - ref: 12
    phrase: that triest the righteous, and seest the reins and the heart
    kind: words
    title: Reins and heart
    body: |
      “Reins” renders a Hebrew word the Church edition's footnote glosses as “inward parts,” so the Lord who tries “the reins and the heart” sees the person within. Jeremiah has prayed nearly these words before: “O Lord of hosts, that judgest righteously, that triest the reins and the heart, let me see thy vengeance on them: for unto thee have I revealed my cause” ([[Jer. 11:20]]). Here he says “opened,” not “revealed.” He asks to see the Lord's vengeance, and he brings his cause to the Lord who sees the heart.
    sources: [lds-scriptures]
  - ref: 13
    phrase: Sing unto the LORD, praise ye the LORD
    kind: structure
    title: From lament to praise and back
    body: |
      Verses 11–13 swing from complaint to assurance to a call to sing: “the tenor of the lament changes in verses 11–13, in which Jeremiah began to praise the Lord.” For that reason some scholars think verses 14–18 were once meant to stand before verses 7–13, so that the lament would end on the praise. That is a hypothesis about how the passage was arranged. The book as it stands puts the praise first and the curse after it.
    sources: [ot-manual-24]
  - ref: 14
    phrase: Cursed be the day wherein I was born
    kind: scripture
    title: Cursed be the day
    body: |
      The curse falls on a day, a messenger, and a birth, not on God or on the call. “Verses 14–18 reflect Jeremiah's despair over the lonely ministry he was given.” Job speaks nearly the same words about his own birth: “Let the day perish wherein I was born” ([[Job 3:3]]), the verse the Church edition's footnote cites here. The man who brought the news to Jeremiah's father is wished the fate of “the cities which the Lord overthrew,” which the footnote ties to [[Isa. 13:19]], where the cities are named: “Sodom and Gomorrah.”

      The curse cuts against chapter 1, in which the Lord says He knew Jeremiah “before I formed thee in the belly” ([[Jer. 1:5]]); his calling as a prophet “predated his birth,” and Jeremiah now wishes the birth had never happened. The two stand side by side in the book.
    sources: [ot-manual-24, lds-scriptures, scripture-helps-jer-1-3]

christ: |
  Jeremiah's suffering for the Lord's word places him among the prophets whom the Lord's people rejected, yet he was “allowed to see the coming of the Savior and the restoration of God's church and people in the latter days.” The opposition in this chapter is the opposition Lehi met in the same city: the Jews mocked him because his testimony “manifested plainly of the coming of a Messiah, and also the redemption of the world,” and Nephi adds that “the tender mercies of the Lord are over all those whom he hath chosen” to make them mighty “unto the power of deliverance” ([[1 Ne. 1:19–20]]). Jeremiah's own anchor is the same promise: “the Lord is with me” ([[Jer. 20:11]]), the words with which he was called ([[Jer. 1:19]]).

explore: |
  - The other laments in the book, listed in the Church's scripture helps as [[Jer. 11:18–12:6]]; [[Jer. 15:10–21]]; [[Jer. 17:9–10]], [[Jer. 17:14–18]]; [[Jer. 18:18–23]]; and [[Jer. 20:7–12]] with [[Jer. 20:14–18]].
  - Jeremiah's call and the promise that he would not be overcome, [[Jer. 1:4–19]].
  - Lehi's reception in the same city, [[1 Ne. 1:18–20]], and Samuel the Lamanite's words on how a people treats its prophets, [[Hel. 13:24–26]].

sources: [bd-jeremiah, ot-manual-24, lds-scriptures, keil-jeremiah, scripture-helps-jer-1-3, seminary-jer-20, holland-teacher, biblehub-interlinear]
