chapter: 38
title: Thy Life Shall Be for a Prey
tagline: Jerusalem's princes lower Jeremiah into a mud-bottomed cistern for telling the people to surrender; a foreign eunuch pulls him out, and the king asks in secret what the Lord says but will not act on it.
when: 'Zedekiah’s reign (597–586 B.C. by the Bible Dictionary), in the last months of the siege; the chapter names no year'

setting: |
  Jerusalem is under siege by Babylon. Zedekiah, Jehoiachin's uncle, had been put on the throne by Babylon and then rebelled. Chapters 34–38 are “narratives of the treatment of the prophet and other events during the last times of the siege.” Jeremiah's message throughout is that the city will fall and that surrender is the way to live. For that he was already arrested once, accused of “fleeing to join the Chaldeans,” beaten, and confined, and the king moved him to “the court of the prison” ([[Jer. 37:11–21]]).

  This chapter begins in that courtyard. Four princes who hear what he has been saying demand his death. The king hands him over, the princes lower him into a cistern, a court eunuch from Cush gets the king to reverse the order, and Zedekiah then calls Jeremiah for a private interview that ends in a promise of secrecy.

  The Book of Mormon touches this chapter: Nephi says that in Jerusalem “Jeremiah have they cast into prison” ([[1 Ne. 7:14]]). Chapter 39 tells how it all ended.

thread: |
  Everyone in this chapter hears the same word: stay and die, or go out and live. What differs is what each person does with it. The princes want the speaker silenced rather than the message weighed. The king asks for the message twice, in secret, and will not act on it; he tells his officials he can do nothing against them, and he tells Jeremiah he is afraid of his own people. A foreign court official sees a man dying in a pit and goes to the king.

  The chapter ties these three responses together with one promise. Jeremiah offers Zedekiah his life, and the Lord later offers it to Ebed-melech in nearly the same words, “thy life shall be for a prey unto thee: because thou hast put thy trust in me” ([[Jer. 39:18]]). The king who is offered rescue refuses it, and the man who is not even in the conversation receives it.

sections:
  - range: 1-6
    heading: The princes ask for his death
    plain: |
      Four officials heard Jeremiah telling the people, “The Lord says: whoever stays in this city will die by sword, famine, and plague, but whoever goes out to the Chaldeans will live; he will keep his life as his only spoil. This city will certainly be handed over to the Babylonian army.” They said to the king, “This man must die. He is discouraging the soldiers and everyone else with these words. He is not seeking the good of this people but their harm.” Zedekiah said, “He is in your hands; the king can do nothing against you.” So they took Jeremiah and let him down by ropes into the cistern of Malchiah the king's son, in the courtyard of the guard. It had no water, only mud, and Jeremiah sank in it.
  - range: 7-13
    heading: Ebed-melech draws him up
    plain: |
      Ebed-melech, a Cushite who was a court official, heard that Jeremiah was in the cistern. The king was sitting at the Benjamin Gate. Ebed-melech went out and said, “My lord the king, these men have done evil in all they have done to Jeremiah. He will die of hunger where he is, for there is no more bread in the city.” The king told him, “Take thirty men and lift Jeremiah out before he dies.” Ebed-melech took the men, went to a room under the treasury in the palace, took worn-out rags and clothes, and let them down by ropes to Jeremiah. He said, “Put these rags under your armpits, under the ropes.” Jeremiah did, and they pulled him up. He stayed in the courtyard of the guard.
  - range: 14-23
    heading: The king asks in secret
    plain: |
      King Zedekiah had Jeremiah brought to him at the third entrance of the Lord's house and said, “I will ask you something; hide nothing from me.” Jeremiah said, “If I tell you, will you not surely kill me? And if I advise you, you will not listen.” The king swore secretly, “As the Lord lives, who gave us life, I will not kill you or hand you over to these men.” Jeremiah said, “Thus says the Lord, the God of hosts: If you will go out to the Babylonian officers, you will live, and this city will not be burned, and your household will live. If you do not, the city will be given to the Chaldeans, who will burn it, and you will not escape.” Zedekiah said, “I am afraid of the Jews who have gone over to the Chaldeans, in case they hand me over to be abused.” Jeremiah said, “They will not. Obey the Lord, and it will go well with you. But if you refuse, this is what the Lord has shown me: all the women left in your palace will be led out to Babylon's officers, saying, ‘Your trusted friends misled you and overpowered you; now your feet are sunk in the mud, and they have turned back.’ All your wives and children will be brought out to the Chaldeans, you will not escape, and you will be seized by the king of Babylon and this city will be burned.”
  - range: 24-28
    heading: Keep it quiet
    plain: |
      Zedekiah said, “Let no one know about this conversation, or you will die. If the officials hear that I spoke with you and ask what you said, tell them, ‘I was pleading with the king not to send me back to Jonathan's house to die there.’” The officials did come and question him, and he told them just what the king had commanded. They stopped asking, because the conversation had not been overheard. Jeremiah stayed in the courtyard of the guard until the day Jerusalem was captured.

notes:
  - ref: 1
    phrase: Pashur the son of Malchiah
    kind: history
    title: The men who once asked for his prayers
    body: |
      Two of the four officials are men Zedekiah had earlier sent to Jeremiah for help. Pashur the son of Melchiah (“Malchiah” in this chapter) was sent with Zephaniah to inquire of the Lord through him ([[Jer. 21:1]]), and Jehucal the son of Shelemiah (“Jucal” here) was sent to say, “Pray now unto the Lord our God for us” ([[Jer. 37:3]]). The men asking for his death are the men who had asked for his prayers.

      This Pashur is not the Pashur the son of Immer, the priest and chief governor of the temple, who struck Jeremiah and put him in the stocks ([[Jer. 20:1–2]]). Shephatiah and Gedaliah are not named anywhere else. One reading takes Gedaliah to be a son of the Pashur of chapter 20, but the text does not say so, and nothing in the chapter depends on it.
    sources: [lds-scriptures, keil-jeremiah]
  - ref: 2
    phrase: he that goeth forth to the Chaldeans shall live
    kind: history
    title: The message from the siege's first days
    body: |
      Jeremiah is not saying anything new: this is what he said when the siege began. The same words are in [[Jer. 21:9]]: “he that goeth out, and falleth to the Chaldeans that besiege you, he shall live, and his life shall be unto him for a prey.”

      “For a prey” means as plunder: the one thing a survivor carries out of a lost city is his life. The Lord uses the phrase for Baruch, who is to seek no great things for himself, “but thy life will I give unto thee for a prey” ([[Jer. 45:5]]), and for Ebed-melech ([[Jer. 39:18]]). In each case the promise is life itself with everything else lost.

      The princes hear this as treason, and “from a strictly political point of view, one can understand why the Jewish leaders reacted so strongly.” But “Jeremiah was not speaking from a political point of view; he spoke for the Lord,” and that is the way his advice was meant: a way for the people and the royal family “to preserve their lives by surrendering to the Chaldeans.”
    sources: [lds-scriptures, ot-manual-24]
  - ref: 4
    phrase: let this man be put to death
    kind: prophets
    title: The worldly want the prophet silenced
    body: |
      The princes ask for Jeremiah's death because of what he says, not because he has been shown wrong. Their argument is that he “weakeneth the hands of the men of war.” The same demand had been made earlier: the priests and prophets said, “This man is worthy to die” ([[Jer. 26:11]]), the verse the Church edition's footnote gives here.

      President Ezra Taft Benson described the pattern in general terms: “When the prophet points out the sins of the world, the worldly either want to close the mouth of the prophet, or else act as if the prophet didn't exist, rather than repent of their sins. Popularity is never a test of truth. Many a prophet has been killed or cast out.”
    sources: [benson-fourteen, lds-scriptures]
  - ref: 5
    phrase: the king is not he that can do any thing against you
    kind: history
    title: A king who cannot, or will not
    body: |
      Zedekiah answers that he is powerless against his princes, and the rest of the chapter shows how far that is true. He had been set on the throne by Babylon, when “Jehoiachin rebelled against Babylon, he was deposed and his uncle, Zedekiah, was placed on the throne,” and then, “ignoring the repeated warnings of Jeremiah, he rebelled.”

      The scene shows “the weak, vacillating character of King Zedekiah”: he gives Jeremiah up here, yet “when Jeremiah's friends pleaded for his life, Zedekiah relented and had him secretly delivered out of the prison” (verses 7–13). The same man who says he cannot refuse the princes can overrule them in a few verses, once someone else brings him the argument. His problem in this chapter looks less like lack of authority than lack of resolve.
    sources: [ot-manual-24]
  - ref: 6
    phrase: the dungeon of Malchiah the son of Hammelech
    kind: words
    title: A cistern in the prison yard
    body: |
      The “dungeon” is a cistern, an empty water pit. The Hebrew is *bor*, “the pit,” and modern translations render the verse “cistern,” with no water “but only mud.” Its owner is “Malchiah the son of Hammelech,” and *hammelech* is Hebrew for “the king,” so this was the cistern of Malchiah the king's son, standing in the guard's courtyard, and the princes used it.

      This is a second place of confinement. Earlier Jeremiah had been put in the house of Jonathan the scribe, which the princes “had made … the prison” ([[Jer. 37:15]]), and then moved at the king's order to “the court of the prison” ([[Jer. 37:21]]). The cistern was in that courtyard, so he did not leave the place where he was already held.
    sources: [biblehub-interlinear, lds-scriptures]
  - ref: 6
    phrase: Then took they Jeremiah, and cast him
    kind: scripture
    title: Nephi on Jeremiah in prison
    body: |
      Nephi tells his brothers that “they have rejected the prophets, and Jeremiah have they cast into prison” ([[1 Ne. 7:14]]). At first glance he seems to mean the imprisonment of chapters 37–38, but the dates are a problem: those chapters place it toward the end of Zedekiah's reign, while Nephi's account opens at its beginning and Lehi's family left soon afterward. So several researchers have argued that Nephi had in mind an earlier imprisonment.

      One proposal is that Jeremiah, “accused of being pro-Babylonian, was imprisoned during the last year of the reign of Jehoiakim,” for the same reasons he was imprisoned later under Zedekiah, and that this imprisonment may have run “late in Jehoiakim's kingship or early in Zedekiah's.” Another proposal puts the arrest Nephi meant in 605 B.C., after the first scroll of his prophecies ([[Jer. 36:5]]). It is also possible that Nephi heard of the imprisonment in this chapter secondhand on one of the brothers' trips back to Jerusalem, since he does not say how much time passed before the family left for good, or that he learned of it by revelation. These are hypotheses about the timing, and the chapter's own events do not depend on the answer. What is plain is that Nephi, a contemporary, knew that Jerusalem imprisoned its prophet.
    sources: [lds-scriptures, sc-knowhy-463, brown-jeremiah-imprisonment]
  - ref: 7
    phrase: Ebed-melech the Ethiopian, one of the eunuchs
    kind: history
    title: A foreigner at court
    body: |
      Ebed-melech is a foreign court official, “the Ethiopian” of the KJV, in Hebrew a Cushite. The word “eunuch” describes a class of men “attached to the courts of eastern rulers,” who “watch over the harems and also were often given positions as trusted officials”; the Bible Dictionary lists this passage among its examples.

      The men of Jeremiah's own people shut him in a pit, and a man from outside Israel gets the king to open it. He finds the king sitting in the gate of Benjamin and points to the famine as a reason for hurry (“there is no more bread in the city,” verse 9); Jeremiah had been given a daily piece of bread “until all the bread in the city were spent” ([[Jer. 37:21]]).

      The Lord did not forget it. While Jeremiah was still shut up in the court of the prison, the word came to him: “Go and speak to Ebed-melech the Ethiopian,” and the promise follows: “I will surely deliver thee… because thou hast put thy trust in me” ([[Jer. 39:15–18]]).
    sources: [bd-eunuch, biblehub-interlinear, lds-scriptures]
  - ref: 14
    phrase: the third entry that is in the house of the LORD
    kind: history
    title: The king asks in secret
    body: |
      Zedekiah has Jeremiah brought to a private place in the temple precinct and asks for the word of the Lord, as he had once before, “secretly in his house” ([[Jer. 37:17]]). The location is not known. The text gives the entrance a name and nothing else, and one reading concludes, “Nothing further is known about the situation and the nature of this entrance.”

      Secrecy is the pattern of the whole chapter: he wants the Lord's word, but not where the princes can hear it. Jeremiah's answer in verse 15 shows he knows it. He asks whether the king will kill him for speaking and whether he will listen if advised, and the king's oath in verse 16 answers only the first.
    sources: [lds-scriptures, keil-jeremiah]
  - ref: 17
    phrase: If thou wilt assuredly go forth unto the king of Babylon’s princes
    kind: prophets
    title: If thou wilt assuredly go forth
    body: |
      The offer is conditional and complete: “If thou wilt assuredly go forth unto the king of Babylon's princes,” the king lives, his house lives, and the city is not burned; if not, the city is given to the Chaldeans, “and thou shalt not escape out of their hand.” “Go forth” means to surrender to the Babylonian officers, “submitting to the Babylonians rather than fighting against them.”

      Latter-day prophets have taught the principle behind such a choice: the Lord's counsel through His prophet is to be followed even when it is unwelcome. Elder M. Russell Ballard: “When we hear the counsel of the Lord expressed through the words of the President of the Church, our response should be positive and prompt. History has shown that there is safety, peace, prosperity, and happiness in responding to prophetic counsel.” President Benson added that “how we respond to the words of a living prophet when he tells us what we need to know, but would rather not hear, is a test of our faithfulness.” Zedekiah is the case where the test is plainly failed: the counsel was clear, he asked for it twice, and he would not go.
    sources: [ot-seminary-teacher-136, ballard-his-word, benson-fourteen]
  - ref: 19
    phrase: I am afraid of the Jews that are fallen to the Chaldeans
    kind: words
    title: Afraid of his own people
    body: |
      The king's reason for refusing is fear of being humiliated by his own subjects. The Church edition's footnote shows that “mock” translates a Hebrew verb meaning “maltreat,” so the fear is of rough treatment at the hands of Jews who had gone over to the Chaldeans (“fallen,” footnote: “have deserted to”), not only of being laughed at.

      Jeremiah answers with a flat promise, “They shall not deliver thee,” and a plea: “Obey, I beseech thee, the voice of the Lord.” The king weighs what Jeremiah says against what his people might do to him, and the people win: his fear is of “being mocked or hurt by Jews who had joined or been captured by the Babylonians.”
    sources: [lds-scriptures, ot-seminary-teacher-136]
  - ref: 22
    phrase: thy feet are sunk in the mire
    kind: structure
    title: The king in the mire
    body: |
      The women's taunt gives the king the pit he had put the prophet in. In verse 6 “Jeremiah sunk in the mire”; in verse 22 the women of the palace say to Zedekiah, “thy feet are sunk in the mire.” The Hebrew verb for “sink” is the same in both verses (*taba'*), though the words for the mud differ (*tit* in verse 6, *bots* in verse 22). The women add, “Thy friends have set thee on, and have prevailed against thee.”

      The echo sets the two men side by side: the prophet whom the princes lowered into the mud is raised out of it by a foreigner, and the king who gave him up to them is told that he will end in it.
    sources: [lds-scriptures, biblehub-interlinear]
  - ref: 23
    phrase: thou shalt cause this city to be burned with fire
    kind: scripture
    title: How it ended
    body: |
      Chapter 39 reports the outcome, and it is what verses 18–23 describe. Zedekiah fled by night; “the Chaldeans' army pursued after them, and overtook Zedekiah in the plains of Jericho”; at Riblah “the king of Babylon slew the sons of Zedekiah … before his eyes,” put out his eyes, and bound him to take him to Babylon ([[Jer. 39:4–7]]).

      “Thou shalt cause this city to be burned” is the consequence of refusing, not a charge that he lit the fire: the offer in verse 17 was that the city need not be burned if he went out. The Book of Mormon adds a detail the Bible does not give: Nephi son of Helaman says, “the sons of Zedekiah were not slain, all except it were Mulek” ([[Hel. 8:21]]), for “one son, Mulek, came to the Western Hemisphere.”
    sources: [lds-scriptures, bd-zedekiah]
  - ref: 26
    phrase: I presented my supplication before the king
    kind: history
    title: What Jeremiah told the princes
    body: |
      The answer the king gives Jeremiah to use is a true statement that leaves out the main subject. Jeremiah had in fact made this plea, asking the king “that thou cause me not to return to the house of Jonathan the scribe, lest I die there” ([[Jer. 37:20]]). So when the princes asked, he told them “according to all these words that the king had commanded,” and they “left off speaking with him; for the matter was not perceived.”

      The text reports this without comment. What it does show is that Zedekiah arranged the cover story, and that the plan was to protect both of them: one reading is that he wanted to spare himself the princes' reproaches and, “perhaps,” spare the prophet further persecution.
    sources: [lds-scriptures, keil-jeremiah]
  - ref: 28
    phrase: So Jeremiah abode in the court of the prison until the day that Jerusalem was taken
    kind: history
    title: Until the day Jerusalem was taken
    body: |
      Jeremiah stays in the courtyard until the city falls, and then the Babylonians free him. Nebuchadrezzar “gave charge concerning Jeremiah” to his captain: “Take him, and look well to him, and do him no harm” ([[Jer. 39:11–12]]); the men Nebuzar-adan sent “took Jeremiah out of the court of the prison, and committed him unto Gedaliah” ([[Jer. 39:14]]). “Because Jeremiah had foretold Babylon's eventual success, he was released by the Chaldeans and allowed to remain in Jerusalem as a free person.”

      The prophet who was called a traitor for saying the city would fall is released by the people whose victory he predicted.
    sources: [lds-scriptures, ot-manual-24]

christ: |
  This chapter does not name the Messiah. When Jesus asked His disciples who people said He was, they answered, “Some say that thou art John the Baptist: some, Elias; and others, Jeremias, or one of the prophets” ([[Matt. 16:14]]), so Jeremiah was a name people reached for in thinking about Jesus. Nephi son of Helaman names Jeremiah among the prophets whose words about Jerusalem were fulfilled and asks why the Son of God should not come “according to his prophecy” ([[Hel. 8:20]]).

explore: |
  - **The rest of the story.** Read [[Jer. 37]] for the first arrest and [[Jer. 39]] for the fall and Ebed-melech's reward.
  - **The same message at the start of the siege.** Compare [[Jer. 21:1–10]].
  - **The Book of Mormon's Jerusalem.** Read [[1 Ne. 7:13–15]] and [[Hel. 8:19–21]].
  - **An earlier demand for his death.** Read [[Jer. 26:7–16]].

parallels:
  - ref: 1 Ne. 7:14
    note: Nephi says Jerusalem had cast Jeremiah into prison; which imprisonment he means is discussed in the note on verse 6.
  - ref: Hel. 8:20–21
    note: Nephi son of Helaman names Jeremiah, the destruction of Jerusalem, and Mulek, the one son of Zedekiah who was not slain.

