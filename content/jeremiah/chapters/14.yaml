chapter: 14
title: The Prophet Told Not to Pray
tagline: A drought empties the cisterns of Judah, the people pray through Jeremiah, and the Lord answers that the real danger is a prophets' lie that no judgment is coming.
when: 'The chapter gives no date. The Bible Dictionary places chapters 7–20 under Jehoiakim (608–597 B.C.).'

setting: |
  The chapter opens with its own title: this is “the word of the LORD that came to Jeremiah concerning the dearth,” that is, a drought. No king or year is named, so the chapter can be placed only by its neighbors; the Bible Dictionary puts chapters 7–20 in the reign of Jehoiakim (608–597 B.C.).

  What follows is a conversation in four parts. A description of the drought (verses 2–6) is followed by a prayer in the people's voice (verses 7–9). The Lord answers it (verses 10–16), though the prophet pleads once more in verse 13; then come the prophet's tears (verses 17–18) and a second prayer (verses 19–22). The Church's chapter heading puts the point plainly: “Jeremiah prays because of dearth and famine—The Lord will not hear because of the wickedness of His people.”

  Chapters 14 and 15 belong together as “a discussion between Jeremiah and the Lord concerning a great drought,” and the Lord's refusal here carries into the next chapter. Jeremiah was “the leading prophet in Jerusalem,” serving in the same years as Lehi, and verses 13–15 show the kind of prophets he was contending with.

thread: |
  Jeremiah 14 asks **what a prophet can do when the people want rain but not repentance.** A drought is the occasion, but the chapter is not about weather. Judah prays, confesses, and fasts; the Lord says He will not hear. The reason is in verse 10: “Thus have they loved to wander.” The prayer is real, but the wandering has not stopped, and the false prophets are telling them that nothing needs to change (verse 13).

  The prophet stands between the two. He prays for the people he has been told not to pray for, argues their case, and when argument is refused he weeps (verse 17). The last words belong to the people's prayer, and they are the only grounds left: the Lord's name, His throne, His covenant, and the plain fact that no idol makes rain, and “thou hast made all these things” (verses 21–22). The chapter does not say whether that prayer is heard. It leaves the answer to chapter 15.

sections:
  - range: 1-6
    heading: The drought
    plain: |
      This is the word of the Lord that came to Jeremiah about the drought. Judah mourns and its city gates droop; the people sit in grief on the ground, and the cry of Jerusalem goes up. The nobles send their servants for water, but the cisterns are dry and they come back with empty jars, ashamed, with their heads covered. The ground is cracked, with no rain, and the farmers cover their heads. Even the doe leaves her newborn fawn in the field, because there is no grass. Wild donkeys stand on the bare hilltops and gasp for air like jackals, and their eyes fail for lack of green plants.
  - range: 7-9
    heading: The people's prayer
    plain: |
      “Lord, though our sins testify against us, act for the sake of your name. Our turnings away are many, and we have sinned against you. You are the hope of Israel and its savior in time of trouble. Why are you like a stranger in the land, like a traveler who stops only for the night? Why are you like a man stunned, like a warrior who cannot save? Yet you are among us, Lord, and we are called by your name. Do not leave us.”
  - range: 10-12
    heading: "The Lord refuses"
    plain: |
      The Lord says of this people: “They have loved to wander and have not held back their feet, so the Lord does not accept them. He will now remember their guilt and punish their sins.” He tells Jeremiah, “Do not pray for the good of this people. When they fast, I will not listen to their cry. When they offer burnt offerings and grain offerings, I will not accept them. I will finish them off with sword, famine, and plague.”
  - range: 13-16
    heading: The prophets who promise peace
    plain: |
      Jeremiah answers, “Look, the prophets are telling them, ‘You will not see sword or famine, but I will give you lasting peace in this place.’” The Lord says, “The prophets are prophesying lies in my name. I did not send them or command them or speak to them. They prophesy a false vision, empty divination, and the deceit of their own minds. So these prophets, who say there will be no sword or famine, will die by sword and famine. And the people they prophesy to will be thrown into the streets of Jerusalem, with no one to bury them or their wives, sons, or daughters. I will pour out their own wickedness on them.”
  - range: 17-18
    heading: The prophet's tears
    plain: |
      “Say this to them: Let my eyes overflow with tears day and night without stopping, for the virgin daughter of my people has been crushed with a great wound, a terrible blow. If I go out into the fields, I see those killed by the sword. If I go into the city, I see those sick from famine. Even prophet and priest go about in a land they do not know.”
  - range: 19-22
    heading: The prayer that ends the chapter
    plain: |
      “Have you completely rejected Judah? Do you despise Zion? Why have you struck us so that we cannot be healed? We hoped for peace and nothing good came; we hoped for a time of healing and there was terror. Lord, we acknowledge our wickedness and the guilt of our fathers; we have sinned against you. For the sake of your name do not despise us, do not disgrace your glorious throne. Remember your covenant with us and do not break it. Can any of the worthless gods of the nations bring rain? Can the skies send showers by themselves? Is it not you, Lord our God? We put our hope in you, for you made all these things.”

notes:
  - ref: 1
    phrase: concerning the dearth
    kind: words
    title: A drought, and not the first
    body: |
      “Dearth” here means drought, and the Hebrew is plural, “droughts.” It is the plural of a noun for “dearth, destitution”; a closely related word is the “drought” of [[Jer. 17:8]], where the righteous man “shall not be careful in the year of drought.”

      Drought was “a calamity to which Judah was often subject,” since little rain falls “from April to the middle of October.” But Israel was taught to read it as a message. Moses warned that if the people turned to other gods, the Lord would “shut up the heaven, that there be no rain” ([[Deut. 11:16–17]]), and among the covenant curses in [[Lev. 26:19]] the Lord makes the heaven “as iron.”
    sources: [bdb, ot-manual-23, lds-scriptures]
  - ref: 3
    phrase: they were ashamed and confounded, and covered their heads
    kind: history
    title: Everyone, even the nobles
    body: |
      Verses 2–6 move down the whole society and then to the animals, so that nobody is spared: “their nobles” send servants for water, and “the plowmen” have no crop. “Everyone, even the wealthy, was affected by the drought.” The covered head is a sign of grief and shame; David climbed the Mount of Olives weeping “and had his head covered” as he fled Jerusalem, and all his people did the same ([[2 Sam. 15:30]]). Here it is the nobles' servants, returning with empty jars, and the farmers, looking at cracked ground, who cover their heads.
    sources: [ot-manual-23, lds-scriptures]
  - ref: 6
    phrase: like dragons
    kind: words
    title: Dragons or jackals
    body: |
      The Hebrew behind “dragons” is the word for jackals, and the Church edition's footnote gives “jackals.” The Latin Vulgate and the Aramaic versions read “dragons,” which is the sense the KJV follows. The picture is of wild asses on bare hilltops, gasping for air like jackals; the KJV's “snuffed up the wind” is that gasping.
    sources: [lds-scriptures, keil-jeremiah]
  - ref: 7
    phrase: though our iniquities testify against us
    kind: history
    title: Who is praying
    body: |
      Verses 7–9 are a prayer in the first person plural: “our iniquities,” “our backslidings,” “we are called by thy name.” The prophet is praying for the people, as the Lord's reply in verse 11 shows. He begins by confessing, then asks the Lord to act “for thy name's sake.”

      Jeremiah's “enduring love for his rebellious people” sets him beside two other pleaders: Moses, who offered to be blotted out of the Lord's book if Israel were not forgiven ([[Ex. 32:31–32]]), and Mormon ([[Morm. 2:10–14]]). The comparison with Mormon has a sharp edge. Mormon rejoiced that his people began to mourn, then saw that “their sorrowing was not unto repentance” ([[Morm. 2:13]]).
    sources: [ot-manual-23, lds-scriptures]
  - ref: 8
    phrase: the hope of Israel, the saviour thereof in time of trouble
    kind: christ
    title: The one the prayer is addressed to
    body: |
      “The hope of Israel” and “the saviour thereof in time of trouble” are titles of the LORD, and the LORD of the Old Testament is Jehovah, “the premortal Jesus Christ.” The KJV prints the name in small capitals, “LORD,” so that is where it stands in this chapter. Jeremiah uses the same title again, “O LORD, the hope of Israel,” in [[Jer. 17:13]], where the Lord is also “the fountain of living waters.” A prayer for rain in a dry land is, then, addressed to the One who is called both hope and saviour.
    sources: [bd-jehovah, lds-scriptures]
  - ref: 8
    phrase: as a stranger in the land
    kind: symbol
    title: A stranger in the land
    body: |
      The complaint is that the Lord is acting like a visitor, not like the owner of the land who dwells among His people. One reading of “a wayfaring man that turneth aside to tarry for a night” is a traveler who pitches a tent for one night and goes on. The people's argument is that this does not fit who the Lord is: He is “in the midst of us,” and “we are called by thy name” (verse 9), that is, His name is named upon them.
    sources: [keil-jeremiah]
  - ref: 11
    phrase: Pray not for this people for their good
    kind: scripture
    title: Pray not
    body: |
      The Lord tells Jeremiah not to pray for the people's good, and He has said it before, in [[Jer. 7:16]] and [[Jer. 11:14]]. In chapter 7 the reason is given outright: “for I will not hear thee.” In chapter 15 He adds that “though Moses and Samuel stood before me, yet my mind could not be toward this people” ([[Jer. 15:1]]).

      The command did not stop Jeremiah from caring. He “refused to desist because false prophets had lulled the people into sin by assuring them of peace,” and in verses 13 and 19–22 he goes on pleading.
    sources: [lds-scriptures, ot-manual-23]
  - ref: 12
    phrase: When they fast, I will not hear their cry
    kind: scripture
    title: When the Lord does not hear
    body: |
      The Lord does not hear because the fasting and offering are not accompanied by turning, and the Book of Mormon states the principle outright. The Church edition links this verse to [[Mosiah 11:24–25]], where the Lord says through Abinadi that “except they repent in sackcloth and ashes, and cry mightily to the Lord their God, I will not hear their prayers,” and to [[D&C 101:7]]: “They were slow to hearken unto the voice of the Lord their God; therefore, the Lord their God is slow to hearken unto their prayers.”

      “Slow” is not “never.” Of Limhi's people, the Book of Mormon says the Lord “was slow to hear their cry because of their iniquities; nevertheless the Lord did hear their cries” ([[Mosiah 21:15]]). In verse 10, just before, the Lord says why: “they have not refrained their feet.” The sacrifices were to be offered while the wandering continued.
    sources: [lds-scriptures]
  - ref: 13
    phrase: I will give you assured peace in this place
    kind: history
    title: Assured peace
    body: |
      The prophets who promised “assured peace” offered the people what they wanted to hear, and they offered it in the Lord's name. The Hebrew for “assured peace” is literally “peace of truth,” which one reading takes as a peace “that rests on God's faithfulness”: a guarantee of safety from God Himself.

      The people had already learned the message. In [[Jer. 5:12]] they themselves say of the Lord, “neither shall evil come upon us; neither shall we see sword nor famine.” Jeremiah's own words in verse 13 are another attempt at pleading: the people were deceived. The Lord does not accept that as an excuse, as verses 14–16 show.
    sources: [keil-jeremiah, ot-manual-23, lds-scriptures]
  - ref: 14
    phrase: I sent them not
    kind: scripture
    title: How to tell a prophet the Lord has not sent
    body: |
      The Lord's complaint is not that the prophets spoke in the wrong name but that they spoke in His and He never sent them: “I sent them not, neither have I commanded them, neither spake unto them.” That is the standard the law set. A prophet who presumes to speak in the Lord's name “which I have not commanded him to speak” is a false one, and when what he says “follow not, nor come to pass,” the people were not to be afraid of him ([[Deut. 18:20–22]]). [[Jer. 27:10]] makes the same charge: “they prophesy a lie unto you.”

      Jeremiah's own life gives a case. In [[Jer. 28:15–17]], the prophet Hananiah, who had told the people in the temple that Babylon's yoke was broken, is told by Jeremiah that “The Lord hath not sent thee; but thou makest this people to trust in a lie,” and dies that year.
    sources: [lds-scriptures]
  - ref: 16
    phrase: none to bury them
    kind: history
    title: No excuse, and no burial
    body: |
      The people share the guilt of the prophets they chose to believe; the Lord “rejected the excuse for the people's sins.” They “are not… held excused because false prophets told them lies, for they have given credit to these lies” that flattered them, and “have not been willing to hear or take to heart” the prophets who preached repentance. Verses 15–16 are therefore a single judgment on both: the prophets who denied the sword die by it, and the people who believed them are left in the streets.

      Jeremiah returns to it in [[Jer. 16:4]], where those who die “shall not be lamented; neither shall they be buried.”
    sources: [ot-manual-23, keil-jeremiah, lds-scriptures]
  - ref: 17
    phrase: Let mine eyes run down with tears night and day
    kind: scripture
    title: Tears night and day
    body: |
      Jeremiah's answer to the Lord's refusal is to weep: “Let mine eyes run down with tears night and day, and let them not cease.” The Lord has told him to say this “word” to the people. They are the same tears he wishes for in [[Jer. 9:1]]: “Oh that my head were waters, and mine eyes a fountain of tears, that I might weep day and night for the slain of the daughter of my people!”
    sources: [lds-scriptures]
  - ref: 18
    phrase: into a land that they know not
    kind: history
    title: A land they know not
    body: |
      This is exile. The phrase returns in [[Jer. 15:14]], where Jeremiah himself is to pass “with thine enemies into a land which thou knowest not,” and in [[Jer. 16:13]], where the Lord says, “I cast you out of this land into a land that ye know not, neither ye nor your fathers.” Verse 18 names the prophet and the priest among those who “go about” in it.
    sources: [lds-scriptures]
  - ref: 21
    phrase: do not disgrace the throne of thy glory
    kind: scripture
    title: The throne and the covenant
    body: |
      The people ask the Lord to remember His covenant, and the throne they mention is the place where He dwells among them. [[Jer. 17:12]] calls it “A glorious high throne from the beginning… the place of our sanctuary,” and [[Jer. 3:17]] says that Jerusalem “shall be called the throne of the Lord.” So the request is most likely that the Lord not let His own city and temple be dishonored; that is an inference from those two verses.

      “Break not thy covenant” answers the covenant curses with the covenant promise. Moses had said that even “in the land of their enemies,” the Lord would “not cast them away… to destroy them utterly, and to break my covenant with them” ([[Lev. 26:44]]). The Church edition links verse 21 to [[Ps. 106:44–45]], where the Lord, hearing their cry, “remembered for them his covenant, and repented according to the multitude of his mercies.”
    sources: [lds-scriptures]
  - ref: 22
    phrase: art not thou he, O LORD our God
    kind: christ
    title: The Lord who made the rain
    body: |
      The chapter ends by calling on the One who makes the rain, and the Restoration scriptures say who that is. The “vanities of the Gentiles” are, as the Church edition glosses it, “worthless idols of the nations”; none of them can send showers, and [[Jer. 3:3]] says of the same rainless land, “the showers have been withholden.” The only one who can send rain is the one who “hast made all these things.”

      The Church edition's footnotes at this line lead to four passages that say who made the heavens and the earth. In [[3 Ne. 9:15]] the risen Lord says, “Behold, I am Jesus Christ the Son of God. I created the heavens and the earth, and all things that in them are.” [[D&C 14:9]] says it in nearly the same words, and [[Mosiah 4:2]] has King Benjamin's people pleading for “the atoning blood of Christ,” “the Son of God, who created heaven and earth.”
    sources: [lds-scriptures]

christ: |
  The prayer of this chapter is addressed to Jehovah, who is “the premortal Jesus Christ.” He is called “the hope of Israel” and the people's “saviour… in time of trouble” (verse 8), the one who “hast made all these things” (verse 22), and the Church edition links that last line to His own statements in [[3 Ne. 9:15]] and [[D&C 14:9]]. The chapter says only that the prayer is made; the Lord's answer comes in chapter 15.

explore:
  - "Chapter 15 continues the Lord's refusal: “Though Moses and Samuel stood before me” ([[Jer. 15:1]])."
  - "The same command not to pray: [[Jer. 7:16]] and [[Jer. 11:14]]."
  - "False prophets, the subject of chapters 26–29: [[Jer. 28]]. The test of a prophet is in [[Deut. 18:20–22]]."
  - "Pleading prophets, set beside Jeremiah: Moses ([[Ex. 32:31–32]]) and Mormon ([[Morm. 2:10–14]])."

parallels:
  - ref: Mosiah 11:24–25
    note: 'Abinadi, speaking the Lord’s words to King Noah’s people, says the Lord will not hear their prayers unless they repent; the Church edition links it to verse 12.'
  - ref: 3 Ne. 9:15
    note: 'The risen Lord says He created the heavens and the earth; the Church edition links it to verse 22.'

sources: [bd-jeremiah, bd-jehovah, bdb, keil-jeremiah, lds-scriptures, ot-manual-23]
