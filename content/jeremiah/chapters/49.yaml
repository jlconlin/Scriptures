chapter: 49
title: Thou Shalt Surely Drink of It
tagline: Five neighbors of Judah, Ammon, Edom, Damascus, the desert tribes, and Elam, are told that the cup of the Lord's wrath passes to them too, and that two of them will one day be brought back.
when: 'Only the last oracle is dated: Elam, “in the beginning of the reign of Zedekiah” (597 B.C.). The others carry no date, though the word to Ammon “is believed” to have come after Jerusalem fell.'

setting: |
  Chapter 49 belongs to the book's block of prophecies against foreign nations (chapters 46–51). The chapter heading sums it up: “Judgment and destruction will come upon the people of Ammon, Edom, Kedar, Hazor, and Elam.” Jeremiah was told at his call that he was appointed over “nations” ([[Jer. 1:10]]), and the nations here are the ones who share Judah's world: Ammon and Edom, its eastern and southern neighbors; Damascus to the north; the desert tribes of Kedar and Hazor; and Elam, a mountain country east of Babylonia.

  Ammon, Edom, and Elam also appear in the list of those who must drink “the wine cup of this fury” in [[Jer. 25:15–26]], and verse 12 takes up that cup. Only the last oracle, to Elam, carries a date. The word to Ammon “is believed” to have come after Jerusalem was captured, when Ammon had moved into Israelite land.

thread: |
  Most of the oracles in chapter 49 name what a nation trusted in, and then take it away. Ammon trusted in “her treasures” and asked, “Who shall come unto me?” (verse 4). Edom trusted in the rock and the height: “though thou shouldest make thy nest as high as the eagle, I will bring thee down” (verse 16). The nation in verse 31 is “the wealthy nation, that dwelleth without care.” Elam's strength was its bow (verse 35). The wisdom of Teman (verse 7) and the warriors of Damascus (verse 26) fare no better.

  Under that runs a second question: who is exempt? Verse 12 gives the answer in a line: the cup goes to those who did not expect to drink it, and “art thou he that shall altogether go unpunished? thou shalt not go unpunished.” Nobody is beneath the Lord's notice because they are not Israel, and Israel is not exempt because it is Israel ([[Jer. 25:18]]).

  The chapter ends on a note that is easy to miss. Of the five oracles, Ammon's and Elam's close with “I will bring again the captivity” (verses 6, 39). Edom's, Damascus's and Kedar's do not.

sections:
  - range: 1-6
    heading: Ammon
    plain: |
      About the Ammonites. “Has Israel no sons? Has he no heir? Why then has their king taken over Gad, and his people settled in its cities? So the days are coming when I will sound a battle cry against Rabbah of the Ammonites. It will be a ruined mound, its daughter towns burned, and Israel will take back the land of those who took his. Wail, Heshbon, for Ai is laid waste. Cry out, daughters of Rabbah, put on sackcloth, lament and rush about among the walls, for their king will go into exile with his priests and princes. Why do you boast of your valleys, your overflowing valley, faithless daughter, who trusted in her treasures and said, ‘Who will come against me?’ I will bring terror on you from all around, and you will be driven out, each straight ahead, with no one to gather the wanderers. But afterward I will bring back the captives of Ammon.”
  - range: 7-22
    heading: Edom
    plain: |
      About Edom. “Is there no more wisdom in Teman? Has counsel perished from those who understand? Flee, turn back, hide deep, you people of Dedan, for I will bring Esau's ruin on him at the time I punish him. Grape-gatherers would leave some gleanings; thieves in the night would destroy only until they had enough. But I have stripped Esau bare and uncovered his hiding places; he cannot hide, and his children, brothers and neighbors are destroyed, and he is no more. Leave your orphans; I will keep them alive. Let your widows trust in me. Those who did not deserve the cup have drunk it; will you go unpunished? You will drink it. I have sworn by myself that Bozrah will become a horror, a reproach, a ruin and a curse, and all its cities everlasting ruins.” A messenger is sent among the nations: gather against her. “I will make you small among the nations. Your terror and the pride of your heart have deceived you, you who live in the clefts of the rock; though you build your nest as high as the eagle's, I will bring you down.” Edom will be a horror, like Sodom and Gomorrah; no one will live there. Like a lion from the Jordan's thickets the enemy will come against a strong pasture, and the Lord will drive Edom out at once. Who is like Him? What shepherd can stand before Him? The least of the flock will drag them off. The earth shakes at the noise of their fall, and the cry is heard at the Red Sea. The enemy will fly like an eagle over Bozrah, and Edom's warriors will be like a woman in labor.
  - range: 23-27
    heading: Damascus
    plain: |
      About Damascus. Hamath and Arpad are shamed, for they have heard bad news; there is anxiety like a restless sea. Damascus is weak and turns to flee; panic has seized her, with anguish like a woman in labor. How is the city of praise not forsaken, the town of my joy? Her young men will fall in her streets, and all her warriors will die that day. “I will set fire to the wall of Damascus, and it will burn the palaces of Ben-hadad.”
  - range: 28-33
    heading: Kedar and Hazor
    plain: |
      About Kedar and the kingdoms of Hazor, which Nebuchadrezzar king of Babylon will strike. “Arise, go up against Kedar and plunder the people of the east. They will take their tents and flocks, their curtains and goods and camels, and men will shout, ‘Terror on every side!’ Flee, go far away, hide deep, people of Hazor, for Nebuchadrezzar has planned and plotted against you. Go up against a nation at ease, living without care, with no gates or bars, living alone. Their camels will be plunder and their herds spoil. I will scatter to every wind those at the farthest edges, and bring disaster on them from every side. Hazor will be a jackals' den, a desolation forever, and no one will live there.”
  - range: 34-39
    heading: Elam
    plain: |
      The word of the Lord that came to Jeremiah the prophet about Elam, at the beginning of the reign of Zedekiah king of Judah. “I will break the bow of Elam, the chief of their strength. I will bring the four winds on Elam from the four corners of heaven and scatter them to every wind, so that no nation will be without Elamite exiles. I will terrify Elam before their enemies, and send the sword after them till I have finished them. I will set my throne in Elam and destroy its king and officials from there. But in the latter days I will bring back the captives of Elam.”

notes:
  - ref: 1
    phrase: Hath Israel no sons? hath he no heir?
    kind: history
    title: Ammon in Gad's land
    body: |
      The charge against Ammon is that it moved into land that belonged to Israel's tribe of Gad. Tiglath-pileser of Assyria carried Gilead's people off ([[2 Kgs. 15:29]]), and the Reubenites and Gadites with them ([[1 Chr. 5:26]]), and the land was left open. The Ammonites “had taken advantage of the depressed condition of Israel and invaded their territories, hoping to make them their own.” The two questions in the verse are a rebuke: Israel still has sons and an heir, even if they are in exile, so the land is not Ammon's to take.

      Ammon was a people descended from Lot, settled east of the Jordan, and “bitter enemies of Israel” for much of its history. Verse 2 turns the claim around: “then shall Israel be heir unto them that were his heirs.” It is a promise that “God would preserve the descendants of Israel and bring them home again one day to their inheritances.”
    sources: [ot-manual-25, bd-ammon, lds-scriptures]
  - ref: 2
    phrase: Rabbah of the Ammonites
    kind: history
    title: Rabbah, Ammon's capital
    body: |
      Rabbah was Ammon's chief city, in the valley of the upper Jabbok, and “there are still extensive ruins at the modern Amman.” The Lord had said much the same through an earlier prophet: “I will kindle a fire in the wall of Rabbah, and it shall devour the palaces thereof… And their king shall go into captivity, he and his princes together” ([[Amos 1:14–15]]). The words about the king's captivity are close to Jeremiah's in verse 3.
    sources: [bd-rabbah, lds-scriptures]
  - ref: 3
    phrase: Ai is spoiled
    kind: words
    title: Which Ai?
    body: |
      This Ai is probably not the city Joshua took, and where it lay is unknown. The Hebrew is a place name, Ai (*ʿay*), but no city of that name is known in Ammon or east of the Jordan, and the Ai of Joshua 7 lay west of the river. Heshbon, named in the same line, lay on the border of Reuben and Gad. One reading takes the word as “the name of an important Ammonite city” otherwise unknown; the verse's sense does not depend on it, since the line only says that Ammon's cities are to mourn.
    sources: [keil-jeremiah, biblehub-interlinear]
  - ref: 3
    phrase: their king shall go into captivity
    kind: words
    title: The king who is a god
    body: |
      “Their king” is the Hebrew *malkam*, and in verse 3 it names Ammon's god Milcom, who goes into exile with his priests and princes. Translations that print it as a name read “Milcom will go into exile together with his priests and officials,” and some read verse 1 the same way: “Why then has Milcom taken possession of Gad?” Milcom was “the abomination of the children of Ammon, a fire god,” and Solomon himself “went after… Milcom the abomination of the Ammonites” ([[1 Kgs. 11:5]]).

      The judgment falls on the nation's god as well as its people: Milcom goes into captivity with the priests who served him.
    sources: [biblehub-interlinear, bd-molech, lds-scriptures]
  - ref: 6
    phrase: afterward I will bring again the captivity of the children of Ammon
    kind: scripture
    title: Judgment, then return
    body: |
      The Lord ends the judgment on Ammon with a promise to bring its people back. The same promise closes the word to Moab, “in the latter days” ([[Jer. 48:47]]), and the word to Elam (verse 39). The promise to Ammon “was fulfilled when they returned with the Moabites and Israelites with permission given the edict of Cyrus.” The verse itself says only “afterward,” and puts no date on it.
    sources: [ot-manual-25, lds-scriptures]
  - ref: 7
    phrase: Concerning Edom
    kind: history
    title: Edom, Judah's relative
    body: |
      Edom was the land of Esau's descendants, south of the Dead Sea, and the people were Judah's kin: “Edom” (“red”) was Esau's own name. “In spite of the kinship there seems to have been great mutual hatred” between Israel and Edom, “and wars were of constant occurrence.” Esau had sold his birthright to Jacob and settled in Mount Seir.

      Jeremiah's oracle names Edom's pride (verse 16). Obadiah, whose oracle against Edom runs closely parallel, adds “thy violence against thy brother Jacob” and gloating: “neither shouldest thou have rejoiced over the children of Judah in the day of their destruction” ([[Obad. 1:10, 12]]). And the book of Lamentations tells Edom, “Rejoice and be glad, O daughter of Edom… the cup also shall pass through unto thee” ([[Lam. 4:21]]), a line this chapter's verse 12 echoes.
    sources: [bd-edom, bd-esau, lds-scriptures]
  - ref: 7
    phrase: Is wisdom no more in Teman?
    kind: history
    title: The wisdom of Teman
    body: |
      Teman was an Edomite place tied to wisdom. Job's friend Eliphaz was a Temanite ([[Job 2:11]]), and Obadiah speaks in the same terms: “Shall I not in that day… even destroy the wise men out of Edom, and understanding out of the mount of Esau? And thy mighty men, O Teman, shall be dismayed” ([[Obad. 1:8–9]]). Jeremiah's question reads as a taunt: whatever Teman's wisdom was worth, it cannot stop this.
    sources: [lds-scriptures]
  - ref: 9
    phrase: If grapegatherers come to thee
    kind: scripture
    title: Jeremiah and Obadiah
    body: |
      Verses 9–10 closely parallel Obadiah's oracle against Edom. Obadiah has “If thieves came to thee, if robbers by night… would they not have stolen till they had enough? if the grapegatherers came to thee, would they not leave some grapes?” and then “How are the things of Esau searched out! how are his hidden things sought up!” ([[Obad. 1:5–6]]). Jeremiah has the thieves and grape gatherers too, and the same line about Esau's hidden places: “I have uncovered his secret places, and he shall not be able to hide himself” (verse 10).

      In verse 10 the Lord “had uncovered all her hiding places and made them known to her enemies.” In verse 9 even thieves and grape gatherers stop when they have enough; verse 10 says Edom's hidden places will be opened, which seems to mean that Edom's loss will be worse than theirs.
    sources: [lds-scriptures, ot-manual-25]
  - ref: 11
    phrase: Leave thy fatherless children, I will preserve them alive
    kind: scripture
    title: The Lord and the orphans
    body: |
      In the middle of the sentence on Edom, the Lord says He will look after the fatherless and widows left behind. “The widows and orphans of Esau would be cared for by the Lord, who is the best of husbands to the one and the most loving father to the other.” The Psalms say the same of Him: “A father of the fatherless, and a judge of the widows, is God in his holy habitation” ([[Ps. 68:5]]). The judgment falls on Edom's pride, and the people who suffer for it are not forgotten.
    sources: [ot-manual-25, lds-scriptures]
  - ref: 12
    phrase: they whose judgment was not to drink of the cup have assuredly drunken
    kind: scripture
    title: The cup that goes to every nation
    body: |
      The cup is the one the Lord handed Jeremiah to give to all nations. “Take the wine cup of this fury at my hand, and cause all the nations, to whom I send thee, to drink it,” he was told ([[Jer. 25:15]]), and the first to drink were “Jerusalem, and the cities of Judah” ([[Jer. 25:18]]). Edom, Moab, Ammon, Dedan, Tema, and Elam follow in the list ([[Jer. 25:21–25]]).

      The verse does not name “they whose judgment was not to drink.” One reading takes them as the Israelites, who “as the people of God, ought to have been free from the penal judgment with which the Lord visits the nations”: if they have drunk it, Edom has no reason to think it will pass. Lamentations says the same to Edom: “the cup also shall pass through unto thee: thou shalt be drunken” ([[Lam. 4:21]]). On that reading the argument has two steps: if the people of the covenant were not spared, “still less can Edom, as a heathen nation, lay claim to exemption.”
    sources: [lds-scriptures, keil-jeremiah]
  - ref: 13
    phrase: I have sworn by myself
    kind: words
    title: An oath by Himself
    body: |
      The Lord swears by His own name because there is nothing greater to swear by. The Epistle to the Hebrews says of God's oath to Abraham, “because he could swear by no greater, he sware by himself,” and that the oath was meant to show “the immutability of his counsel” ([[Heb. 6:13, 17]]). So here the oath marks the sentence on Bozrah as certain.
    sources: [lds-scriptures]
  - ref: 13
    phrase: Bozrah shall become a desolation
    kind: christ
    title: Bozrah and the coming of the Lord
    body: |
      Bozrah was a city of Edom, and Edom's name came to stand for the world. Isaiah asks, “Who is this that cometh from Edom, with dyed garments from Bozrah? this that is glorious in his apparel, travelling in the greatness of his strength?” and the answer is “I that speak in righteousness, mighty to save” ([[Isa. 63:1]]). The Lord's revelation in [[D&C 133:46–48]] asks the same question about His coming without naming Edom: “Who is this that cometh down from God in heaven with dyed garments?” He answers, “I am he who spake in righteousness, mighty to save,” and He will be “red in his apparel.” The Isaiah chapter on this site gives the fuller reading ([[Isa. 63:1–6]]).

      “In D&C 1:36 Idumea is used to represent the world”: the Lord “shall come down in judgment upon Idumea, or the world.” Edom, “like Babylon, became a symbol of the world.” Jeremiah does not make that move in this chapter; the connection to the Lord's coming is made by Isaiah 63 and the revelations that take up its question.
    sources: [lds-scriptures, bd-idumea, ot-manual-25]
  - ref: 16
    phrase: dwellest in the clefts of the rock
    kind: history
    title: A nest in the rock
    body: |
      Edom's confidence was its mountain stronghold. Obadiah has almost the same words: “thou that dwellest in the clefts of the rock, whose habitation is high… Though thou exalt thyself as the eagle, and though thou set thy nest among the stars, thence will I bring thee down” ([[Obad. 1:3–4]]). At Petra “a whole city was carved out of rock cliffs,” which “could be entered only through a narrow gorge,” and “many scholars think” it was the capital of Idumea, though “many of the ruins now visible at Petra date from a later period.”

      The verse after next compares the fall to Sodom and Gomorrah: “no man shall abide there” (verse 18). A place that felt unreachable becomes one where no one lives.
    sources: [ot-manual-25, lds-scriptures]
  - ref: 19
    phrase: who is that shepherd that will stand before me?
    kind: words
    title: The lion and the shepherd
    body: |
      The lion is the one sent to carry out the judgment, and the text does not say who he is. He is “merely set forth as a lion,” and in verse 22 as an eagle darting on its prey. Verses 19–21 are one of the book's repeated passages: the same lion, chosen man, shepherd and least of the flock appear almost word for word against Babylon ([[Jer. 50:44–45]]). In both places the closing questions, “who is like me? and who will appoint me the time? and who is that shepherd that will stand before me?”, say that no one can call the Lord to account or stand against Him.
    sources: [keil-jeremiah, lds-scriptures]
  - ref: 25
    phrase: How is the city of praise not left, the city of my joy!
    kind: words
    title: A hard line about Damascus
    body: |
      The sentence is obscure and has been explained in more than one way. In the KJV it asks “how is the city of praise not left,” as if wondering why Damascus has not been abandoned. One reading takes it as sorrow that its people did not flee and save their lives: verse 24 says they tried to flee and panic seized them, and verse 26 says her young men will fall in the streets. On that reading “my joy” expresses the prophet's own sympathy for the fall of a glorious city. However the line is read, the verses around it say the city is doomed.
    sources: [keil-jeremiah]
  - ref: 27
    phrase: palaces of Ben-hadad
    kind: history
    title: Damascus and Ben-hadad's house
    body: |
      Damascus was the capital of the Syrian kingdom, and it had already suffered a great blow: it was “conquered by Tiglath-pileser and its inhabitants carried captive about 733 B.C.” Hamath, named in verse 23, was “an important city of Syria, in the valley of the Orontes,” taken by the Assyrians.

      One reading takes Ben-hadad as a royal name rather than one king: “three kings of Damascus bore this name,” so “the palaces of Benhadad” are the Syrian kings' palaces in general. How and when this oracle was fulfilled is uncertain: on that reading the prophecy is “so general in its statement” that it need not be tied only to Nebuchadnezzar's conquest, and its fulfilment “cannot be proved historically, from want of information.”
    sources: [bd-damascus, bd-hamath, keil-jeremiah]
  - ref: 28
    phrase: Concerning Kedar, and concerning the kingdoms of Hazor
    kind: history
    title: Kedar and Hazor
    body: |
      Kedar was a desert people, descended from Ishmael's son of that name ([[Gen. 25:13]]), and Isaiah says of it that “all the glory of Kedar shall fail” ([[Isa. 21:16–17]]). The verse says Nebuchadrezzar (the same king as Nebuchadnezzar) is the one who will strike them.

      Hazor here is not the city in Galilee that the Assyrians took ([[2 Kgs. 15:29]]). One reading takes “the kingdoms of Hazor” as the Arabs who lived in settled villages as opposed to the tent-dwelling Bedouin, since no Arabian place of that name is known. That is why verse 31 speaks of a nation “that dwelleth without care… which have neither gates nor bars”: they had no walls to hold an attacker.
    sources: [lds-scriptures, keil-jeremiah]
  - ref: 34
    phrase: against Elam in the beginning of the reign of Zedekiah king of Judah
    kind: history
    title: Elam, far to the east
    body: |
      Elam is the only nation in this chapter whose oracle is dated: the beginning of Zedekiah's reign, which began in 597 B.C. It was “a mountainous country to the east of Babylonia,” with Shushan as its chief town. It also appears in the list of nations that drink the cup ([[Jer. 25:25]]).

      The oracle gives no reason for the judgment; it says only that the Lord will break “the bow of Elam, the chief of their might” (verse 35) and scatter them to “the four winds.”
    sources: [bd-elam, bd-jeremiah, lds-scriptures]
  - ref: 39
    phrase: in the latter days, that I will bring again the captivity of Elam
    kind: scripture
    title: Elam in the latter days
    body: |
      The chapter closes with a promise that Elam will be brought back “in the latter days.” The verse “speaks of the Lord's bringing again the captivity of Elam in the latter days,” and “it is supposed that this passage means their conversion, as with the Moabites.” The Moabite promise is [[Jer. 48:47]]. Isaiah also names Elam among the places from which the Lord will recover the remnant of His people a second time ([[Isa. 11:11]]).

      That reading is offered as a supposition, and the verse does not say how Elam is brought back. What it does say is that the end of the oracle is not destruction.
    sources: [ot-manual-25, lds-scriptures]

christ: |
  The chapter shows the Lord of all nations. The one who judges Edom is the one who preserves its orphans and invites its widows to trust in Him ([[Jer. 49:11]]), who promises return to Ammon and Elam as well as to Israel (verses 6, 39), and who says of Himself, “who is like me?” (verse 19). Isaiah's Bozrah is the place from which a figure in red says He is “mighty to save” ([[Isa. 63:1]]); the note on verse 13 follows that question into the revelations given through Joseph Smith ([[D&C 1:36]]; [[D&C 133:46–48]]).

explore: |
  The cup of the Lord's fury and the nations that drink it is in [[Jer. 25:15–29]], and the other oracles against the nations are [[Jer. 46]], [[Jer. 47]], [[Jer. 48]], [[Jer. 50]], and [[Jer. 51]]. Edom's fall is also told in Obadiah, which Jeremiah 49:9–10 closely parallels. For the Lord who comes from Bozrah and the world as Idumea, read [[Isa. 63:1–6]], [[D&C 1:36]], and [[D&C 133:46–51]].

sources: [ot-manual-25, bd-jeremiah, bd-ammon, bd-rabbah, bd-molech, bd-edom, bd-esau, bd-idumea, bd-damascus, bd-hamath, bd-elam, keil-jeremiah, biblehub-interlinear, lds-scriptures]
