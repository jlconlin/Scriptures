chapter: 37
title: Where Are Now Your Prophets?
tagline: While Egypt's army draws the Babylonians off Jerusalem, King Zedekiah asks Jeremiah to pray, is told the relief is a mirage, and then has the prophet arrested and secretly consulted in turn.
when: 'Zedekiah''s reign (597–586 B.C. by the Church''s reckoning), during the Babylonian siege of Jerusalem; the chapter gives no year of its own, and one source places the Egyptian advance in the spring or summer of 588'

setting: |
  This chapter opens the account of Jerusalem's last siege. Zedekiah was put on the throne by Babylon in 597 B.C., after the second invasion. He was pledged to Nebuchadnezzar as a vassal, but a spirit of nationalism grew at home, and “a growing patriotic feeling among the people brought Zedekiah to seek the support of Egypt in rebellion against the power of the north.” Babylon returned and besieged the city. Through it all Jeremiah's counsel was to submit, which meant that “he was viewed as a traitor and a subversive.”

  The chapter falls in three scenes. The king sends two officials to ask for Jeremiah's prayers, and an Egyptian army makes the Chaldeans lift the siege for a time (verses 1–10). Jeremiah starts for his home country of Benjamin and is arrested at the gate on a charge of desertion (verses 11–15). He is put in a cellar prison, then fetched out for a secret interview with the king (verses 16–21). The Church's heading puts it plainly: “Jeremiah prophesies that Egypt will not save Judah from Babylon—He is cast into a dungeon—Zedekiah transfers him to the court of the prison.”

  Chapters 37–39 belong together: they tell how the prophet was treated and how his word proved true. Nephi also says that Jeremiah was cast into prison ([[1 Ne. 7:14]]); the last note of the chapter asks which imprisonment he meant.

thread: |
  Jeremiah 37 is about a king who wants the Lord's help but not the Lord's word. Zedekiah reaches toward Jeremiah three times: he sends for his prayers (verse 3), has him brought out in secret (verse 17), and orders him fed (verse 21). Each time Jeremiah gives the same answer he has given all along, that Babylon will take the city. And the princes treat the man who gives it as a traitor (verses 13–15).

  The chapter's turn is the lifting of the siege. For a time, it looks as if the other side's prophets were right. Jeremiah tells the king the relief is temporary (verses 7–10), and then, from his prison, asks the question that settles who spoke for the Lord: “Where are now your prophets?” (verse 19). The verses open with the king and people who “did [not] hearken unto the words of the LORD” (verse 2) and end with the prophet shut up in the court of the prison, alive, and fed for as long as the city's bread lasts.

sections:
  - range: 1-2
    heading: A king who did not listen
    plain: |
      Zedekiah son of Josiah became king in place of Coniah son of Jehoiakim, whom Nebuchadnezzar of Babylon had made king in the land of Judah. But neither he, nor his servants, nor the people of the land listened to the words the Lord spoke by Jeremiah the prophet.
  - range: 3-10
    heading: Pray for us
    plain: |
      King Zedekiah sent Jehucal son of Shelemiah and the priest Zephaniah son of Maaseiah to Jeremiah, saying, “Please pray to the Lord our God for us.” (Jeremiah was still going in and out among the people, because they had not yet put him in prison. Pharaoh's army had come out of Egypt, and when the Chaldeans besieging Jerusalem heard the news, they withdrew.) Then the word of the Lord came to Jeremiah: “Tell the king of Judah who sent you to ask of me: Pharaoh's army, which came to help you, will go back to its own land of Egypt. The Chaldeans will come back and fight against this city. They will take it and burn it. Do not fool yourselves by saying, ‘The Chaldeans will surely leave us,’ for they will not. Even if you struck down the whole Chaldean army and only wounded men were left in their tents, they would get up and burn this city.”
  - range: 11-15
    heading: Arrested at the gate
    plain: |
      When the Chaldean army had withdrawn from Jerusalem for fear of Pharaoh's army, Jeremiah set out from the city to go to the land of Benjamin. At the Benjamin Gate the officer on duty, Irijah son of Shelemiah son of Hananiah, seized him: “You are deserting to the Chaldeans!” “That is a lie,” said Jeremiah. “I am not deserting to the Chaldeans.” Irijah would not listen, and took him to the princes. The princes were furious, beat him, and put him in prison in the house of Jonathan the scribe, which they had made into the prison.
  - range: 16-21
    heading: The king's secret question
    plain: |
      Jeremiah was put in the dungeon, in its cells, and stayed there many days. Then King Zedekiah had him brought out and asked him secretly in his house, “Is there any word from the Lord?” “There is,” said Jeremiah. “You will be handed over to the king of Babylon.” Jeremiah went on: “What wrong have I done to you, your officials, or this people, that you have put me in prison? Where now are your prophets who told you the king of Babylon would not attack you or this land? Please listen, my lord the king, and grant my plea: do not send me back to the house of Jonathan the scribe, or I will die there.” Zedekiah ordered Jeremiah kept in the court of the guard and given a loaf of bread daily from the bakers' street until all the bread in the city was gone. So Jeremiah stayed in the court of the guard.

notes:
  - ref: 1
    phrase: Zedekiah the son of Josiah reigned instead of Coniah
    kind: history
    title: Zedekiah, Coniah's uncle
    body: |
      Zedekiah was Coniah's uncle, set on the throne by Babylon after Coniah was exiled. Nebuchadnezzar “made Mattaniah his father's brother king in his stead, and changed his name to Zedekiah” ([[2 Kgs. 24:17]]); he was “the last king of Judah.” “Coniah” is Jehoiachin, “also known as Jeconiah, Joachin, Coniah.” The “Nebuchadrezzar” of this verse is the Nebuchadnezzar of other verses.

      So the king who asks Jeremiah for a word in this chapter holds his throne only because Babylon gave it to him. His rebellion against that king is the cause of the siege.
    sources: [bd-zedekiah, bd-jehoiachin, bd-nebuchadnezzar, ot-manual-kings-g, lds-scriptures]
  - ref: 3
    phrase: Pray now unto the LORD our God for us
    kind: history
    title: Pray for us, but do not obey
    body: |
      The king asks for prayer, but he has not listened. Verse 2 has just said that neither he, nor his servants, nor the people “did hearken unto the words of the LORD.” This is a pattern. Earlier in the siege Zedekiah sent a similar message: “Inquire, I pray thee, of the Lord for us; for Nebuchadrezzar king of Babylon maketh war against us” ([[Jer. 21:1–2]]). After Jerusalem's fall, the survivors will say, “Pray for us unto the Lord our God… we will do it,” and Jeremiah answers that they “have not obeyed the voice of the Lord” ([[Jer. 42:20–21]]).

      The Lord's reply (verses 7–10) is a word, and the word is the same one they had refused.
    sources: [lds-scriptures]
  - ref: 3
    phrase: Jehucal the son of Shelemiah and Zephaniah the son of Maaseiah the priest
    kind: history
    title: The two men the king sent
    body: |
      The messengers were two of the king's chief officers. Jehucal appears again as Jucal son of Shelemiah, one of the men who “heard the words that Jeremiah had spoken” and then joined the princes in asking the king, “let this man be put to death” ([[Jer. 38:1]], [[Jer. 38:4]]). That the two are the same man is one reading; the spelling differs, but the father's name is the same.

      Zephaniah the priest is also the one Zedekiah sent in [[Jer. 21:1]]. A letter from Shemaiah, a false prophet among the exiles, told him that his office was to put “every man that is mad, and maketh himself a prophet” in prison and in the stocks, and asked why he had not done so to Jeremiah; Zephaniah instead “read this letter in the ears of Jeremiah the prophet” ([[Jer. 29:24–29]]). When the city fell, the captain of the guard took him as “Zephaniah the second priest” ([[Jer. 52:24]]).
    sources: [lds-scriptures, keil-jeremiah]
  - ref: 5
    phrase: Pharaoh’s army was come forth out of Egypt
    kind: history
    title: Why Egypt's army mattered
    body: |
      Egypt's army was the help Zedekiah had been counting on when he rebelled. He “rebelled… in sending his ambassadors into Egypt, that they might give him horses and much people” ([[Ezek. 17:15]]), and Jeremiah “had again and again warned Judah not to trust in Egypt for deliverance.” When the army marched in the spring or summer of 588 B.C. (by one reckoning), Nebuchadnezzar briefly left the siege to meet it and then returned, which is what verses 5 and 11 describe.

      One reading names the Pharaoh as Hophra, whom Jeremiah later names in [[Jer. 44:30]]. The verse itself says only “Pharaoh”. Ezekiel had already said that “Pharaoh with his mighty army and great company” would not make war for the king ([[Ezek. 17:17]]), and Lamentations looks back on this hope with the words, “in our watching we have watched for a nation that could not save us” ([[Lam. 4:17]]).
    sources: [lds-scriptures, ot-manual-kings-g, tolley-imprisonment, keil-jeremiah]
  - ref: 9
    phrase: Deceive not yourselves
    kind: history
    title: The relief is not rescue
    body: |
      The withdrawal of the Chaldeans is real, and the Lord says it will not last. Jeremiah tells the king that Pharaoh's army will go home, that the Chaldeans will return, and that “even if the entire Chaldean army were wounded in the battle with Egypt, they would still succeed in destroying Jerusalem”: verse 10 says the same with the wounded men rising “every man in his tent.” The hope of the people “soared, but again Jeremiah dashed them to pieces.”

      The Chaldeans return because the Lord commands it. In [[Jer. 34:22]] He says, “I will command… and cause them to return to this city; and they shall fight against it, and take it, and burn it with fire.”
    sources: [ot-manual-24, lds-scriptures]
  - ref: 12
    phrase: to separate himself thence in the midst of the people
    kind: words
    title: Why Jeremiah left the city
    body: |
      Jeremiah left Jerusalem for Benjamin, “probably to visit his hometown,” while the siege was lifted. The Hebrew of the purpose clause is obscure, which is why the KJV's “to separate himself” reads oddly. It is “explained in various ways”; one reading takes it as “to receive a portion thence,” a share of something in Benjamin, where his family's town of Anathoth lay.

      The verse does not say what the portion was. What matters for the story is the timing: this was the one stretch when a man could leave the city, and Jeremiah's enemies “seized this opportunity to make their move.”
    sources: [ot-manual-24, keil-jeremiah, lds-scriptures]
  - ref: 13
    phrase: Thou fallest away to the Chaldeans
    kind: history
    title: The charge of desertion
    body: |
      The charge that Jeremiah is deserting to the enemy uses his own words against him. The Church edition's footnote renders “fallest away” as “art deserting.” During the siege he had told the people, “he that goeth out, and falleth to the Chaldeans that besiege you, he shall live” ([[Jer. 21:9]]), and the same counsel appears again in [[Jer. 38:2]]. What he said of others, the guard now says of him.

      Jeremiah answers, “It is false,” but Irijah “hearkened not to him.” The charge was false: “the leaders in Jerusalem falsely accused Jeremiah of defecting to the Babylonians, had him beaten, and imprisoned him.”
    sources: [lds-scriptures, scripture-helps-jer-31-33]
  - ref: 15
    phrase: smote him, and put him in prison
    kind: prophets
    title: Popularity is never a test of truth
    body: |
      Jeremiah's treatment is what prophets have taught to expect from those who reject a prophet's word. President Ezra Taft Benson put it as a principle: “As a prophet reveals the truth it divides the people. The honest in heart heed his words, but the unrighteous either ignore the prophet or fight him… Popularity is never a test of truth.” Jeremiah was beaten and jailed for saying what the Lord told him, and the ones who did it were the leaders of Judah.

      Elder Spencer W. Kimball warned that “many are prone to garnish the sepulchres of yesterday's prophets and mentally stone the living ones.” Jeremiah's words are honored now; in Jerusalem they were treated as a danger to the war effort.
    sources: [benson-fourteen, ot-manual-24]
  - ref: 16
    phrase: into the dungeon, and into the cabins
    kind: words
    title: Dungeon and cabins
    body: |
      Jeremiah's first prison was a cellar. “Dungeon” is Hebrew for a “house of a pit,” which points to an underground cell, and “cabins” is a word that occurs only here, which in related languages means “vaults” and here possibly means underground cells; the Church edition's footnote has “cells.” The vaults, one reading says, are why the princes turned the house of Jonathan the scribe into a prison: it “contained apartments suitable for the purpose.”

      This is the first prison of two. The second, the muddy cistern of [[Jer. 38:6]], is worse, and Jeremiah's plea in verse 20, “lest I die there,” shows that he already knows how dangerous the place is.
    sources: [keil-jeremiah, lds-scriptures]
  - ref: 17
    phrase: the king asked him secretly in his house
    kind: history
    title: A secret interview
    body: |
      The king asks in secret and gives way in public. Zedekiah's “weak, vacillating character” shows: he “called Jeremiah to him secretly, asking if there was any word from the Lord,” while publicly he gives in to the princes (“Behold, he is in your hand: for the king is not he that can do any thing against you,” [[Jer. 38:5]]). He wants to hear the word. He is afraid to act on it.

      Jeremiah gives him the one answer he has given all along: “thou shalt be delivered into the hand of the king of Babylon.” It is the message for which, in [[Jer. 32:2–4]], Zedekiah keeps him shut up in the court of the prison. When the king sends for him again in [[Jer. 38:14]], he says, “hide nothing from me.”
    sources: [ot-manual-24, lds-scriptures]
  - ref: 19
    phrase: Where are now your prophets
    kind: scripture
    title: The test of a prophet
    body: |
      Jeremiah's question applies the test Moses gave: “if the thing follow not, nor come to pass, that is the thing which the Lord hath not spoken, but the prophet hath spoken it presumptuously” ([[Deut. 18:22]]). He had cited the same standard against the prophet Hananiah: “when the word of the prophet shall come to pass, then shall the prophet be known, that the Lord hath truly sent him” ([[Jer. 28:9]]).

      “Jeremiah's word had been proven true, and he was in prison. Their word had been proven false, and where were they?” The prophets who promised that the king of Babylon would not come have no answer, because the king of Babylon has come.
    sources: [ot-manual-24, lds-scriptures]
  - ref: 21
    phrase: give him daily a piece of bread
    kind: history
    title: Bread until it ran out
    body: |
      The king gives Jeremiah bread only for as long as the city has bread. Jeremiah is moved from Jonathan's house to “the court of the prison” and given bread daily “until all the bread in the city were spent.” This is the same court that holds the cistern: the dungeon of Malchiah was “in the court of the prison” ([[Jer. 38:6]]). By then Ebed-melech tells the king Jeremiah is “like to die for hunger in the place where he is: for there is no more bread in the city” ([[Jer. 38:9]]).

      The city's bread does run out. At its fall “the famine was sore in the city, so that there was no bread for the people of the land” ([[Jer. 52:6]]).
    sources: [lds-scriptures]
  - ref: 21
    phrase: Jeremiah remained in the court of the prison
    kind: scripture
    title: Which imprisonment did Nephi mean?
    body: |
      Nephi says Jeremiah was cast into prison, and which imprisonment he means is not settled. Nephi tells his brothers that Jerusalem's people “have rejected the prophets, and Jeremiah have they cast into prison. And they have sought to take away the life of my father” ([[1 Ne. 7:14]]). Yet Jeremiah 37–38 comes late in Zedekiah's reign, while Lehi's family left near its start ([[1 Ne. 1:4]]).

      Three answers have been proposed. Jeremiah may have been imprisoned earlier, in Jehoiakim's last year, and held into Zedekiah's first months. Or Nephi may have heard of this one on one of his return trips to Jerusalem, or learned of it “by revelation.” A third reading looks at the verb: Nephi says “cast,” and the only imprisonment in which Jeremiah is “cast” (Hebrew *shalak*) is the cistern of [[Jer. 38:6]], one “explicitly designed to kill Jeremiah,” much like the attempts on Lehi's life. The question is open, and it is tied to the larger debate over when Lehi left Jerusalem.
    sources: [sc-knowhy-463, tolley-imprisonment, lds-scriptures]

christ: |
  Jeremiah's treatment is the pattern the Savior names over the same city: “Jerusalem, Jerusalem, thou that killest the prophets, and stonest them which are sent unto thee, how often would I have gathered thy children together, even as a hen gathereth her chickens under her wings” ([[Matt. 23:37]]). Jeremiah is beaten, jailed and left on the city's last bread for telling its king what the Lord had said. The promise made at Jeremiah's call still holds on the page: “they shall fight against thee; but they shall not prevail against thee; for I am with thee, saith the LORD, to deliver thee” ([[Jer. 1:19]]).

explore: |
  - Jeremiah's continued imprisonment in the court of the prison, and the king's second secret meeting with him: [[Jer. 38]]
  - The land purchased in the court of the prison, while the siege goes on: [[Jer. 32]]
  - Jeremiah's earlier arrests and trials: [[Jer. 20:1–6]], [[Jer. 26]]
  - What Nephi says of Jeremiah's imprisonment and what his brothers wanted: [[1 Ne. 7:14]]
  - Zedekiah's end, and Jeremiah's release by the Babylonians: [[Jer. 39]]

