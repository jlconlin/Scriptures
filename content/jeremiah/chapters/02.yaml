chapter: 2
title: Broken Cisterns
tagline: The Lord remembers Israel's youthful devotion in the wilderness, asks what fault her fathers found in Him, and charges His people with trading a fountain of living water for cisterns that leak.
when: 'No date is given in the chapter; the Bible Dictionary places Jeremiah 1–6 in the reign of Josiah (626–608 B.C.)'

setting: |
  This is the first sermon the book records after Jeremiah's call. The chapter gives no date. The Bible Dictionary groups chapters 1–6 as the “Prophecies of reign of Josiah (626–608).” Jeremiah is told to “cry in the ears of Jerusalem” ([[Jer. 2:2]]), and then the Lord addresses “house of Jacob, and all the families of the house of Israel” ([[Jer. 2:4]]): the whole covenant people, not only the city.

  The sermon is a complaint brought by the Lord against His people: He says He will “plead” with them ([[Jer. 2:9]]), and where the same Hebrew verb returns in verse 29, the Church edition's footnote gives its sense as “quarrel, contend.” The chapter heading sums it up: “The people of Judah forsook the Lord, the fountain of living waters—They worshipped idols and rejected the prophets.” The first nineteen verses move in three steps: Israel's “early devotion and righteousness” (verses 2–3), “Israel's apostasy” (verses 4–13), and the “tragic results of apostasy” (verses 14–19). Verses 20–37 then denounce Judah's idolatry, with images of a vine, a wild animal, and a bride. The marriage imagery of verse 2 returns in verse 32 and continues into chapter 3.

  The Church edition's cross-references tie verses 27 and 35 to the Book of Mormon: to Abinadi's warning to King Noah's people, and to the priests' claim that they were guiltless. The notes on verses 28 and 35 follow them.

thread: |
  Jeremiah 2 turns on one question the Lord puts to His people: “What iniquity have your fathers found in me?” ([[Jer. 2:5]]). Everything after it is the answer, and the answer is “none.” The Lord has led them through the wilderness and into a fruitful land, and they have left Him for what cannot help them.

  The text itself marks the pattern. Three times Israel is said to have “forsaken” the Lord, in the same Hebrew verb ([[Jer. 2:13]], [[Jer. 2:17]], [[Jer. 2:19]]). In verse 13 the two evils are forsaking the fountain and digging cisterns that leak. Verse 18 asks what Judah is doing drinking from the rivers of Egypt and Assyria, and verse 21 says the noble vine has turned into a wild one. Water and marriage carry the argument: the Lord recalls the bride of verse 2, and in verse 32 asks whether a bride can forget her attire.

  The chapter moves in three stages. The first charges the people with exchanging God for what cannot help them (verses 2–13). The second shows what that exchange has cost (verses 14–19). The last shows a people who will not admit it: “I am not polluted” (verse 23), “I am innocent” (verse 35).

sections:
  - range: 1-3
    heading: The love of the wilderness
    plain: |
      The Lord told Jeremiah to proclaim to Jerusalem: “I remember how devoted you were when you were young, how you loved me as a bride, and followed me through the wilderness, through a land where nothing was sown. Israel was holy to the Lord, the first share of His harvest. Anyone who ate of it was held guilty, and disaster came on them.”
  - range: 4-13
    heading: What did your fathers find wrong in me?
    plain: |
      “Hear the word of the Lord, all you of the house of Jacob. What fault did your fathers find in me, that they went far from me and followed what is empty, and so became empty themselves? They never asked, ‘Where is the Lord who brought us out of Egypt and led us through a dry and dangerous wilderness?’ I brought you into a fruitful land, and you made it unclean. The priests did not ask, ‘Where is the Lord?’ Those who handled the law did not know me. The rulers rebelled against me, and the prophets spoke in Baal's name and followed what cannot help. So I will bring my case against you, and against your children's children. Look west to Cyprus and east to Kedar and see whether anything like this has ever happened: has a nation traded its gods, though they are not gods? My people have traded their glory for what cannot help them. Be appalled, heavens! My people have done two evils: they have left me, the fountain of living water, and dug themselves cisterns, cracked cisterns that hold no water.”
  - range: 14-19
    heading: What it cost
    plain: |
      “Is Israel a slave, born into the household? Then why has he become plunder? Young lions have roared at him, and his land is ruined, and his cities are burned and empty. The people of Memphis and Tahpanhes have shamed you. Did you not bring this on yourself by leaving the Lord your God while He led you on the way? So what have you to do with the road to Egypt, to drink the Nile's water? Or with the road to Assyria, to drink the river's? Your own wickedness will correct you, and your turning away will rebuke you. Know that leaving the Lord your God, and having no fear of me, is evil and bitter.”
  - range: 20-28
    heading: A vine gone wild
    plain: |
      “Long ago you broke the yoke and tore off the bonds and said, ‘I will not serve.’ On every high hill and under every green tree you lay down as a prostitute. I planted you a choice vine, all good seed; how did you turn into a wild, foreign vine? Though you wash with lye and use plenty of soap, your guilt is a stain in front of me. How can you say, ‘I am not unclean; I have not gone after the Baals’? Look at what you did in the valley. You are a restless young camel, a wild donkey sniffing the wind in her season, and no one can turn her back. You tell me, ‘It is hopeless; I love foreigners and will go after them.’ As a thief is shamed when he is caught, so Israel is shamed: the people, kings, officials, priests, and prophets, who say to a piece of wood, ‘You are my father,’ and to a stone, ‘You gave me birth.’ They turn their backs to me, yet in trouble they say, ‘Rise up and save us!’ Where are the gods you made for yourselves? Let them rise up if they can save you; for you have as many gods as you have cities, Judah.”
  - range: 29-37
    heading: “I have not sinned”
    plain: |
      “Why do you argue with me? You have all rebelled against me. I struck your children in vain; they would not be corrected. Your own sword has eaten up your prophets like a lion. Look at the word of the Lord, you generation: have I been a wilderness to Israel, or a land of darkness? Why do my people say, ‘We are free to roam; we will not come to you again’? Does a girl forget her jewelry, or a bride her sash? Yet my people have forgotten me for days without number. How well you plan your road to find love! You have taught even the wicked your ways. On your clothes is the blood of innocent poor, not found by breaking in, but plain on all of you. And still you say, ‘I am innocent; surely His anger has turned from me.’ So I will bring my case against you, because you say, ‘I have not sinned.’ Why do you run about so much to change your road? You will be shamed by Egypt as you were shamed by Assyria. You will leave there too with your hands on your head, for the Lord has rejected those you trusted, and you will not prosper by them.”

notes:
  - ref: 2
    phrase: the love of thine espousals
    kind: words
    title: Whose love the Lord remembers
    body: |
      The love remembered in verse 2 is Israel's love for the Lord, not His love for Israel. The clause that follows decides it: the Lord remembers “when thou wentest after me in the wilderness.” It was Israel who followed. Verses 2–3 describe “Israel's early devotion and righteousness,” before the “apostasy” that begins in verse 4. The KJV's “kindness” renders the Hebrew *chesed*, which usually means a gracious, condescending love; here, on one reading, it is the devotion of a bride, and the “espousals” are the courtship that ended in the covenant at Sinai, when the Lord “chose it to be His spouse.”

      On that reading, “remember” does not mean the Lord has merely not forgotten: it means “to remember to one's account,” as something kept on record in the people's favor, which makes the charge that follows sharper. The wilderness is “a land that was not sown”: Israel followed the Lord into country that could not feed it. Nephi retells that journey to his brothers: the Red Sea parted, manna fell, and water came from the rock ([[1 Ne. 17:26–29]]), the cross-reference the Church edition gives for this verse.
    sources: [keil-jeremiah, ot-manual-23, lds-scriptures]
  - ref: 3
    phrase: Israel was holiness unto the LORD, and the firstfruits of his increase
    kind: symbol
    title: Israel as the Lord's firstfruits
    body: |
      Israel is pictured as the first share of a harvest, set apart as the Lord's. A firstfruit belonged to God, and on one reading the picture rests on the law of firstfruits: a layperson who ate of one consecrated to Him “incurred guilt.” “Holiness to the Lord” is also what was to be engraved on a plate of pure gold ([[Ex. 28:36]]), the Church edition's cross-reference. So Israel's holiness was like that of consecrated produce: it was not for others to take.

      That explains the second half of the verse. “All that devour him shall offend” means, on the same reading, that anyone who laid “violent hands” on Israel “to make it a prey” was held guilty, as Amalek was when he fought Israel at Rephidim ([[Ex. 17:8]]; [[Ex. 17:14]]). That reading also takes the Hebrew verbs not as futures, as the KJV has them, but as a record of what happened “so long as Israel showed the love of the espousal time.” Either way, Israel was protected while she belonged to the Lord.
    sources: [keil-jeremiah, lds-scriptures]
  - ref: 5
    phrase: have walked after vanity, and are become vain
    kind: words
    title: They became what they followed
    body: |
      Two words in this phrase come from one root: “vanity” and “become vain” are the Hebrew noun *hebel* and the verb built on it. *Hebel* is literally “breath,” and so “emptiness, vanity,” a word applied to false gods. The phrase says that Israel followed emptiness and became empty.

      The question before it, “What iniquity have your fathers found in me?”, is answered in the negative by the next verse: the fathers never even asked where the Lord was. The “fathers” are, on one reading, the generations back to the one after Joshua's day, which “forsook the Lord and served the Baals.” They are not blamed alone: verse 9 turns to “your children's children.”
    sources: [oshb-wlc, keil-jeremiah]
  - ref: 8
    phrase: the pastors also transgressed against me
    kind: history
    title: Priests, rulers, and prophets
    body: |
      Verse 8 names four groups, and the “pastors” are rulers: the Bible Dictionary describes Jeremiah 21–23 as “on pastors or rulers of the people,” and the Church edition's footnote here sends the reader to “Shepherd.” So the four are priests, those who “handle the law,” rulers, and prophets. All the leaders of the covenant people have failed.

      The charge against the priests is the same question the people failed to ask in verse 6: “Where is the LORD?” The priests, who should have taught it, did not ask it either. The prophets “prophesied by Baal,” the god whose name means “Possessor, lord,” worshipped as “the Sun-god and the male or generative principle in nature.”
    sources: [bd-jeremiah, bd-baal, lds-scriptures]
  - ref: 10
    phrase: pass over the isles of Chittim, and see; and send unto Kedar
    kind: history
    title: From the far west to the far east
    body: |
      The Lord points to the edges of the known world. Chittim is Cyprus, named for a son of Javan ([[Gen. 10:4]]), the “large island of the eastern Mediterranean.” Kedar was a pastoral people in the eastern part of the desert “between Arabia Petraea and Babylonia.” On one reading the two stand for all peoples, west and east, so that the Lord is saying: ask anyone, anywhere.

      What they are to look for is in verse 11: “Hath a nation changed their gods, which are yet no gods?” The expected answer is no, “no heathen nation has done this.” Yet “my people have changed their glory,” which the same reading takes to mean “the God who made Himself known to it in His glory.” The strangeness lies in the exchange: other nations keep gods that are not gods, and Israel gave up the true God for them.
    sources: [bd-chittim, bd-cyprus, keil-jeremiah, lds-scriptures]
  - ref: 13
    phrase: hewed them out cisterns, broken cisterns, that can hold no water
    kind: symbol
    title: The two evils
    body: |
      The two evils are leaving the Lord and then digging substitutes. “In verse 13 the two evils committed by Judah are told in figurative terms: They have forsaken the fountain (Jehovah) of living water (life), and they have hewn out broken cisterns (gods) which can hold no water (life).” The substitutes are hewed out by the people themselves, and they “can hold no water.”

      The Hebrew for “forsaken” here is the verb used again in verses 17 and 19: the charge is made at the fountain (13), when He “led thee by the way” (17), and in the reproof of verse 19. It is a charge made three times, not once.
    sources: [ot-manual-23, oshb-wlc]
  - ref: 13
    phrase: the fountain of living waters
    kind: christ
    title: The fountain of living waters
    body: |
      “Living water” is “a symbol of the Lord Jesus Christ and His teachings.” The fountain in this verse is “Jehovah,” and when the phrase returns in [[Jer. 17:13]], “Jesus Christ (Jehovah in the Old Testament) is the very ‘hope of Israel,’ the ‘fountain of living waters.’” At Jacob's well Jesus tells a Samaritan woman: “If thou knewest the gift of God, and who it is that saith to thee, Give me to drink; thou wouldest have asked of him, and he would have given thee living water” ([[John 4:10]]), and adds that whoever drinks the water He gives “shall never thirst” ([[John 4:14]]).

      In the Book of Mormon, Nephi sees in vision that the rod of iron “led to the fountain of living waters, or to the tree of life; which waters are a representation of the love of God” ([[1 Ne. 11:25]]).
    sources: [gs-living-water, ot-manual-23, lds-scriptures]
  - ref: 14
    phrase: Is Israel a servant? is he a homeborn slave?
    kind: scripture
    title: Not a slave, a son
    body: |
      The question expects the answer no. A slave can be plundered, but Israel is not a slave to be treated so. The Church edition's cross-reference gives the Lord's own word on what Israel is: “Israel is my son, even my firstborn” ([[Ex. 4:22]]). The question then asks why Israel is “spoiled,” and verse 17 answers: “Hast thou not procured this unto thyself?”
    sources: [lds-scriptures]
  - ref: 16
    phrase: the children of Noph and Tahapanes
    kind: history
    title: Memphis and Tahpanhes
    body: |
      Noph is Memphis, “ancient capital of Egypt,” and Tahapanes is Tahpanhes, “in Egypt, in the land of Goshen” (the Church edition's footnote). On one reading the two cities stand for “the kingdom of the Pharaohs,” which had also plundered Israel. The Church edition links Tahpanhes to [[Jer. 43:7]] and [[Jer. 44:1]], and the link is a pointed one: after Jerusalem fell, the survivors who “obeyed not the voice of the LORD” went down into Egypt “even to Tahpanhes,” with “Jeremiah the prophet” among them ([[Jer. 43:6–7]]). The place that is named here as a source of harm becomes the place Judah runs to for safety.
    sources: [bd-noph, keil-jeremiah, lds-scriptures]
  - ref: 18
    phrase: what hast thou to do in the way of Egypt, to drink the waters of Sihor
    kind: symbol
    title: The waters of Egypt and Assyria
    body: |
      The image of water turns: Judah has left the fountain of verse 13 and is drinking from foreign rivers. Sihor is the Nile, and “the river” is the Euphrates, which the verse pairs with Assyria. In other words, “they drank the spiritual waters of Egypt and Babylon and were filled with the lifeless water of idolatry.”

      The rivers were also politics: the Church edition's cross-reference is Isaiah's earlier warning against seeking help from Egypt: “Woe to the rebellious children… that walk to go down into Egypt, and have not asked at my mouth” ([[Isa. 30:1–2]]).
    sources: [ot-manual-23, lds-scriptures]
  - ref: 19
    phrase: my fear is not in thee
    kind: words
    title: Punished by sin, not only for it
    body: |
      The verse teaches “that one is punished by as well as for one's transgressions.” “My fear is not in thee” means the fear of God, which in Hebrew “denotes a sense of reverent awe and profound respect.” A people who had that awe would not need to learn what sin costs by paying it.
    sources: [ot-manual-23]
  - ref: 20
    phrase: I have broken thy yoke, and burst thy bands; and thou saidst, I will not transgress
    kind: words
    title: Who broke the yoke?
    body: |
      This verse is read two ways because the Hebrew text itself is marked. The KJV has the Lord say “I have broken thy yoke” and has Israel answer “I will not transgress.” The Hebrew text carries vowel marks and marginal notes from the Masoretes, the scribes who handed it down, and they have the first two verbs as “I” (*shavarti*, *nittaqti*). The last verb is written *ʾeʿevod*, “I will serve,” but the margin says to read *ʾeʿevor*, “I will transgress.” The KJV follows the margin.

      The Septuagint takes the verbs as “thou”: “thou hast broken thy yoke, and plucked asunder thy bands; and thou has said, I will not serve thee.” The NRSVUE reads the same way: “you broke your yoke and burst your bonds, and you said, ‘I will not serve!’” The Church's manual follows the KJV: “The Lord had delivered them from the bondage of Egypt.” On both readings the verse ends at the same place, with Israel's own idolatry, “playing the harlot,” which the manual describes as “spiritual adultery.”
    sources: [oshb-wlc, lxx-rahlfs, nrsvue, ot-manual-23]
  - ref: 21
    phrase: a noble vine, wholly a right seed
    kind: symbol
    title: The noble vine turned wild
    body: |
      The Lord says He planted the best vine, of wholly good seed, and it turned into a wild one. Nothing was wrong with what He planted, and the fault lies in what the plant became. “This wild vine brought forth poisonous berries, or evil works.” The Church edition links the verse to the topic “Vineyard of the Lord.”
    sources: [ot-manual-23, lds-scriptures]
  - ref: 22
    phrase: wash thee with nitre, and take thee much soap
    kind: words
    title: Nitre and soap
    body: |
      “Nitre” is a cleansing alkali, lye: the Church edition's footnote reads “alkali; carbonate of soda.” The point is that washing does not remove the stain: “Thine iniquity is marked before me.” Even “the most powerful means of purification could not cleanse Judah's sins.”
    sources: [lds-scriptures, ot-manual-23]
  - ref: 23
    phrase: thou art a swift dromedary traversing her ways
    kind: symbol
    title: A restless camel and a wild ass
    body: |
      Judah says “I am not polluted,” and the Lord answers with two animals. A young camel dashing back and forth here, and in verse 24 a wild ass in the wilderness sniffing the wind, picture an animal in heat: “as a camel or a wild ass in heat runs back and forth during the mating season, so did Israel run after false gods.” No one can turn her back. “See thy way in the valley” probably points to the Valley of Hinnom, where children were sacrificed to Molech ([[Jer. 7:31]]); the Lord speaks there of the “valley of the son of Hinnom” and of “the blood of innocents” ([[Jer. 19:2]]; [[Jer. 19:4]]).
    sources: [ot-manual-23, lds-scriptures]
  - ref: 24
    phrase: in her month they shall find her
    kind: scripture
    title: A change in the Joseph Smith Translation
    body: |
      The Church edition's footnote gives a Joseph Smith Translation reading for this verse: the last clause reads “shall not find her.” In the KJV, those who seek the wild ass “shall find her” in her season. The JST reverses it: they will not find her. The footnote offers no explanation, so what the change means is uncertain.
    sources: [lds-scriptures]
  - ref: 25
    phrase: Withhold thy foot from being unshod
    kind: words
    title: Barefoot and thirsty
    body: |
      The Lord asks Judah to stop running barefoot after other gods: “in their anxiety to follow after the peoples of the world and worship false gods, they ran out of the house barefoot and would not even stop to slake their thirst.” The people's answer, “There is no hope,” is the reply the Church edition connects to [[Jer. 18:12]]: “There is no hope: but we will walk after our own devices.” In both places the answer is that nothing can be done, so they will go on.
    sources: [ot-manual-23, lds-scriptures]
  - ref: 27
    phrase: Saying to a stock, Thou art my father; and to a stone, Thou hast brought me forth
    kind: symbol
    title: A tree trunk as father
    body: |
      Israel calls a piece of wood her father and says to a stone that it gave her birth. The footnote gives “wood” for “stock,” i.e. an idol (compare [[Jer. 3:9]]): “Israel worshiped images of wood and stone as the gods to whom they owed life and being.” The Lord had already named Israel His own son, His “firstborn” ([[Ex. 4:22]]); here His people give that title to a block of wood.
    sources: [ot-manual-23, lds-scriptures]
  - ref: 28
    phrase: But where are thy gods that thou hast made thee? let them arise
    kind: scripture
    title: Let them save you
    body: |
      The Lord answers the cry of verse 27, “Arise, and save us,” with a challenge. The same turn recurs in scripture. In the time of the judges He tells a people that had served other gods, “Go and cry unto the gods which ye have chosen; let them deliver you in the time of your tribulation” ([[Judg. 10:14]]). In the Book of Mormon, Abinadi speaks the Lord's word to King Noah's people: “when they shall cry unto me I will be slow to hear their cries” ([[Mosiah 11:24]]). In a modern revelation the Lord says of His people that “in the day of their trouble, of necessity they feel after me” ([[D&C 101:8]]). In each, the people turn to God only when trouble comes. The Church edition gives all three as cross-references for this verse and the one before it.

      “According to the number of thy cities are thy gods” means a god for every city.
    sources: [lds-scriptures, ot-manual-23]
  - ref: 30
    phrase: your own sword hath devoured your prophets
    kind: history
    title: The prophets who were killed
    body: |
      “In vain have I smitten your children” refers to earlier judgments, “such as the fall of the Northern Kingdom and the siege of Judah by Assyria,” that “were not enough to bring the people to repentance.” And the people turned on the messengers: “The people killed the prophets sent by God to warn them.” The two clauses go together. God corrected them, and they refused correction and killed those who explained it.
    sources: [ot-manual-23]
  - ref: 32
    phrase: Can a maid forget her ornaments, or a bride her attire?
    kind: symbol
    title: The bride who forgot
    body: |
      The question brings back the marriage imagery of verse 2. A bride does not forget her ornaments, yet “my people have forgotten me days without number.” Instead of being adorned “with chastity and faithfulness to her husband,” this bride “was found with soiled skirts.” In verse 33 she has become so skilled at it that she teaches “even the experienced harlots of idolatry”; the Church edition's footnote gives “women” for “wicked ones.” Jeremiah continues “the marriage symbolism he began in Jeremiah 2:32” in [[Jer. 3:1–11]].
    sources: [ot-manual-23, lds-scriptures]
  - ref: 34
    phrase: in thy skirts is found the blood of the souls of the poor innocents
    kind: history
    title: Blood on the clothing
    body: |
      The blood is on Judah's clothing, in plain sight. The Lord says He did not find it “by secret search” but “upon all these,” which the Church edition's footnote explains as “their clothing.” The stains “were so obvious that a search was not required.” The Church edition's cross-references point to the shedding of innocent blood in child sacrifice: the people “shed innocent blood, even the blood of their sons and of their daughters, whom they sacrificed unto the idols of Canaan” ([[Ps. 106:38]]), and they “filled this place with the blood of innocents” ([[Jer. 19:4]]).
    sources: [lds-scriptures, ot-manual-23]
  - ref: 35
    phrase: Because I am innocent
    kind: scripture
    title: “We are guiltless”
    body: |
      The claim of innocence in this verse has Book of Mormon counterparts. The priests of King Noah say of themselves, “we are guiltless, and thou, O king, hast not sinned,” and that Abinadi “has prophesied in vain” ([[Mosiah 12:14]]). An Amalekite tells Aaron, the son of Mosiah, “we have built sanctuaries, and we do assemble ourselves together to worship God” ([[Alma 21:6]]). Both are the Church edition's cross-references for this verse.
    sources: [lds-scriptures]
  - ref: 36
    phrase: thou also shalt be ashamed of Egypt, as thou wast ashamed of Assyria
    kind: history
    title: The alliance ends in shame
    body: |
      Judah is running to change her road, and the road leads to the same shame. On one reading, to “change thy way” is to stop seeking help from Assyria and to form “close relations with Egypt,” and the prophet is saying that Egypt will fail her as Assyria did. Verse 37, “thou shalt go forth from him, and thine hands upon thine head,” has her coming away from Egypt in grief; that reading takes “him” as Egypt. Hands laid on the head are a gesture of mourning, as when Tamar “put ashes on her head… and laid her hand on her head, and went on crying” ([[2 Sam. 13:19]]). The reason is given in the verse itself: “the LORD hath rejected thy confidences, and thou shalt not prosper in them.” Isaiah had said the same of Egypt: “the strength of Pharaoh be your shame” ([[Isa. 30:3]]).
    sources: [keil-jeremiah, lds-scriptures]

christ: |
  The fountain Israel forsook is the Lord Himself. “Living water” is “a symbol of the Lord Jesus Christ and His teachings,” and the fountain is “Jesus Christ (Jehovah in the Old Testament).” At Jacob's well He is the one who gives it: “whosoever drinketh of the water that I shall give him shall never thirst” ([[John 4:14]]). Nephi calls the fountain of living waters “a representation of the love of God” ([[1 Ne. 11:25]]). The Lord who asks “What iniquity have your fathers found in me?” is the same who claims Israel as His firstborn ([[Ex. 4:22]]) and remembers her love when she was a bride.

explore: |
  - The marriage imagery continues in [[Jer. 3:1–11]], which the manual connects to Hosea.
  - The fountain returns in [[Jer. 17:13]].
  - Compare Nephi's vision of the fountain of living waters ([[1 Ne. 11:25]]) with Jesus at Jacob's well ([[John 4:10–14]]).
  - Compare the Book of Mormon's priests of Noah ([[Mosiah 12:9–15]]) and the Lord's words in [[D&C 101:7–9]] with verses 27–35.

sources: [bd-jeremiah, ot-manual-23, keil-jeremiah, lds-scriptures, oshb-wlc, lxx-rahlfs, nrsvue, bd-baal, bd-chittim, bd-cyprus, bd-noph, gs-living-water]
