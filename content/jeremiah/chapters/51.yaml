chapter: 51
title: Thus Shall Babylon Sink
tagline: The empire that devoured Judah is told it will fall, the exiles are told to flee before it does, and a scroll of the whole prophecy is sunk in the Euphrates as a sign.
when: 'The scroll went to Babylon in the fourth year of Zedekiah (verse 59), about 594 B.C. on the Bible Dictionary’s dates for his reign (597–586)'

setting: |
  Chapter 51 is the second half of one long oracle. Chapter 50 begins “The word that the LORD spake against Babylon and against the land of the Chaldeans by Jeremiah the prophet” ([[Jer. 50:1]]), and this chapter continues it. Babylon is the empire that, in the chapter's own words, “hath devoured me” (verse 34). After Assyria fell it had become Nebuchadnezzar's capital, a city with the Euphrates running through the middle of it.

  The Church's chapter heading sums up what follows: “Judgment, destruction, and desolation will come upon Babylon for her sins—Israel is commanded, Flee from Babylon—Israel is the Lord's rod to destroy all kingdoms.” The chapter ends by saying how it reached Babylon: Jeremiah wrote it in a book, and Seraiah carried it there to read aloud and then sink in the river (verses 59–64). How that scroll relates to the chapters as they now stand is taken up in the note on verse 64.

  Latter-day Saints read these chapters on two levels. The fall of Nebuchadnezzar's Babylon is real history, and it is also a pattern for the fall of “Babylon the Great.” Nephi reaches the same figure in his vision, and the commandment to flee Babylon is repeated in the Doctrine and Covenants.

thread: |
  Jeremiah 51 answers a question an exile might well ask: **if Babylon is the Lord's golden cup, does that mean the Lord is on Babylon's side?** The chapter says no, in three steps. Babylon was only ever an instrument in the Lord's hand (verse 7), and what it did to Zion, it will be repaid for (verses 24, 35–36, 49). The God who made the earth is not one of the idols the city trusts (verses 15–19, 44, 47). And so His people are not to wait inside her walls: “Flee out of the midst of Babylon” (verses 6, 45), and “let Jerusalem come into your mind” (verse 50).

  These verses can seem larger than ancient Babylon because such prophecies often have a “dual nature”: “the downfall anciently of Nebuchadnezzar's Babylon was a prototype of the future downfall of ‘Babylon the Great.’” That is why the Doctrine and Covenants can take up the chapter's own command: “Go ye out of Babylon.” The scroll sunk in the Euphrates ends the chapter on the same point: the word is spoken, and it will be carried out.

sections:
  - range: 1-4
    heading: A destroyer is sent
    plain: |
      The Lord says: “I will raise up a destroying wind against Babylon and against Chaldea. I will send foreigners to winnow her and empty her land. Let the archer bend his bow against her warriors; spare none of her young men, and destroy her whole army. The slain will fall in Chaldea and be run through in her streets.”
  - range: 5-10
    heading: Israel is not forsaken; leave Babylon
    plain: |
      Israel and Judah have not been abandoned by their God, though their land was full of sin against the Holy One of Israel. “Flee out of Babylon and save your lives; do not be cut off for her guilt. This is the Lord's time of vengeance, and He will pay her back.” Babylon was a golden cup in the Lord's hand that made the whole earth drunk, and the nations went mad. Now she has suddenly fallen. “Wail for her; bring balm for her wound; perhaps she will be healed.” The answer: “We tried to heal Babylon, but she cannot be healed. Leave her; let each of us go to his own land, for her judgment reaches the sky.” “The Lord has brought forth our righteousness; come, let us declare in Zion the work of the Lord our God.”
  - range: 11-14
    heading: The Medes are roused
    plain: |
      “Sharpen the arrows, take up the shields! The Lord has stirred up the spirit of the kings of the Medes, because His purpose against Babylon is to destroy her; it is the Lord's vengeance, vengeance for His temple. Raise the banner against Babylon's walls, strengthen the watch, post the watchmen, set the ambushes, for the Lord has planned and done what He said.” To the city on many waters, rich in treasure: “Your end has come, and the measure of your greed.” The Lord of hosts has sworn by Himself to fill her with men like a swarm of locusts, who will raise a shout over her.
  - range: 15-19
    heading: The Maker and the idols
    plain: |
      God made the earth by His power and set up the world by His wisdom. When He speaks there is a roar of waters in the heavens; He brings clouds from the ends of the earth, makes lightning for the rain, and brings out the wind from His storehouses. Everyone who trusts an idol is senseless, and every metalworker is shamed by his image, for the cast figure is a lie with no breath in it. Idols are worthless, a work of mockery; they perish when judgment comes. Jacob's portion is not like them, for He formed all things, and Israel is the tribe He claims as His own. The Lord of hosts is His name.
  - range: 20-26
    heading: The battle axe and the mountain
    plain: |
      “You are my battle axe and weapons of war: with you I break nations and destroy kingdoms, horse and rider, chariot and driver, man and woman, old and young, shepherd and flock, farmer and oxen, governors and officials.” Yet the Lord will repay Babylon and the Chaldeans for all the evil they did in Zion before Israel's eyes. “I am against you, destroying mountain, you who destroy the whole earth. I will stretch out my hand, roll you off the cliffs, and make you a burned-out mountain. No one will take from you a cornerstone or a foundation stone; you will be desolate forever.”
  - range: 27-33
    heading: The nations are called against her
    plain: |
      Raise a banner in the land, blow the trumpet among the nations, and summon Ararat, Minni, and Ashkenaz against Babylon, with a commander and horses like swarms of locusts. Prepare the nations, with the kings of the Medes, their governors and officials, and every land they rule. The land shakes in pain, because every purpose of the Lord against Babylon stands, to make her land a desolation with no one living in it. Babylon's warriors have stopped fighting and stay in their strongholds; their strength is gone; they have become like women. Her dwellings are burned and her gate bars broken. Runner meets runner and messenger meets messenger to tell the king of Babylon that his city has been taken at every end, the river crossings seized, the reed marshes burned, the soldiers terrified. Babylon is like a threshing floor at the time it is trampled; a little longer and the harvest comes.
  - range: 34-44
    heading: Zion's cry and the Lord's answer
    plain: |
      Zion speaks: “Nebuchadnezzar king of Babylon has devoured me and crushed me; he has left me an empty jar, swallowed me like a monster, filled his belly with my delicacies, and thrown me out. Let the violence done to me and my body come on Babylon, says the daughter of Zion; let my blood be on the people of Chaldea, says Jerusalem.” The Lord answers: “I will plead your cause and take vengeance for you; I will dry up her sea and make her springs dry. Babylon will be a heap of ruins, a lair for jackals, an object of horror and hissing, with no one living there.” Her people roar like lions, but at their feast the Lord will make them drunk, to sleep forever and not wake. He will bring them down like lambs to the slaughter. Sheshach is taken, the praise of the whole earth seized; the sea has risen over Babylon and covered her with its waves. Her cities are a dry wasteland where no one lives or passes. The Lord will punish Bel in Babylon and make him give up what he swallowed; the nations will no longer stream to him, and the wall of Babylon will fall.
  - range: 45-58
    heading: Go out, remember Jerusalem, and be judged
    plain: |
      “My people, come out of her and save yourselves from the Lord's fierce anger. Do not lose heart or be afraid at the rumors in the land: one rumor comes this year, another next year, with violence and ruler against ruler. The days are coming when I will judge Babylon's idols; her whole land will be shamed and her slain will fall in her midst. Heaven and earth will sing for joy over Babylon, when the destroyers come from the north. As Babylon made Israel's slain fall, so Babylon's slain will fall, and the slain of all the earth with them.” To the survivors: “Go; don't stand still. Remember the Lord from far away, and think of Jerusalem.” They answer: “We are ashamed, for we have heard insults; disgrace covers our faces, because foreigners have entered the holy places of the Lord's house.” The Lord: “The days are coming when I will judge her idols, and the wounded will groan through all her land. Even if Babylon climbed to heaven and fortified her heights, destroyers would come from Me.” A cry rises from Babylon, and great destruction from Chaldea, because the Lord is destroying her and silencing her loud voice. Her warriors are captured and their bows broken. The Lord will make her officials and wise men, governors and warriors drunk, and they will sleep forever and not wake, says the King, whose name is the Lord of hosts. Babylon's thick walls will be torn down and her high gates burned; the peoples labor for nothing, and the nations wear themselves out for fire.
  - range: 59-64
    heading: The scroll sunk in the Euphrates
    plain: |
      This is the word Jeremiah gave to Seraiah son of Neriah, son of Maaseiah, when he went with King Zedekiah of Judah to Babylon in the king's fourth year. Seraiah was a quiet prince (the Church edition's alternate rendering: a quartermaster). Jeremiah wrote in one scroll all the disaster that would come on Babylon, all these words about Babylon, and told Seraiah: “When you get to Babylon, make sure you read all these words aloud. Then say, ‘Lord, You have said You will destroy this place so that nothing lives in it, neither person nor animal, and it will be desolate forever.’ When you finish reading the scroll, tie a stone to it and throw it into the middle of the Euphrates, and say, ‘So will Babylon sink, never to rise again, because of the disaster I am bringing on her.’” The words of Jeremiah end here.

notes:
  - ref: 1
    phrase: a destroying wind
    kind: words
    title: A destroying wind
    body: |
      The “destroying wind” is the hot, dry east wind of the desert, a picture of the Lord's power turned on Babylon. It “is hot and dry from the desert and carries with it particles of sand that do much damage.” Judah had been threatened with the same weather: “A dry wind of the high places in the wilderness toward the daughter of my people, not to fan, nor to cleanse” ([[Jer. 4:11]]), the verse the Church edition links here. The wind that threatened Jerusalem is now promised against Babylon.

      The “fanners” of verse 2 carry the picture on: winnowers who toss grain into the wind so the chaff blows away. The Church edition's note gives another sense of the word, “strangers who shall scatter her,” so the wind is also an army, foreigners who scatter Babylon's people like chaff.
    sources: [ot-manual-25, lds-scriptures]
  - ref: 1
    phrase: them that dwell in the midst of them that rise up against me
    kind: words
    title: A cipher for Chaldea
    body: |
      The odd phrase “them that dwell in the midst of them that rise up against me” is a coded name for Chaldea. The Hebrew is *lev qamai*, “the heart of mine adversaries.” In the cipher called *atbash*, where each letter of the alphabet is put for its mirror (the last for the first, the next-to-last for the second), those letters stand for *Kasdim*, “Chaldeans.” The same device is behind “Sheshach” in [[Jer. 25:26]], “the king of Sheshach shall drink after them”: [[Jer. 51:41]] settles who is meant by putting Sheshach and Babylon in parallel lines.

      Jeremiah names Babylon in plain words all through the chapter, so the cipher is not a disguise. One reading is that the code carries a meaning of its own, Chaldea as “the centre of God's enemies,” which fits Babylon's later title, “the Mother of Harlots and Abominations of the Earth” ([[Rev. 17:5]]).
    sources: [oshb-wlc, keil-jeremiah, lds-scriptures]
  - ref: 5
    phrase: Israel hath not been forsaken
    kind: scripture
    title: Not forsaken
    body: |
      Exile did not mean that God had given up on His people, and verse 5 says so in the middle of a prophecy about their captor. The Lord says elsewhere, “For a small moment have I forsaken thee; but with great mercies will I gather thee” ([[Isa. 54:7]]); the Church edition links the verse to that passage ([[Isa. 54:5–8]]). The verse does not hide Judah's guilt: it admits “their land was filled with sin against the Holy One of Israel.” The promise rests on the Lord's faithfulness, not on Israel's record.

      In the middle of Babylon's doom, “Israel was promised that she had not been forgotten (see v. 5) and that she would be redeemed.”
    sources: [lds-scriptures, ot-manual-25]
  - ref: 6
    phrase: Flee out of the midst of Babylon
    kind: prophets
    title: Go ye out of Babylon
    body: |
      In the Restoration the call to flee Babylon is a standing command, and “Babylon” stands for the world. Jeremiah's word to the exiles is repeated in verse 45, and it comes back in latter-day revelation: “Go ye out of Babylon; gather ye out from among the nations” and “Go ye out from among the nations, even from Babylon, from the midst of wickedness, which is spiritual Babylon” ([[D&C 133:7]]; [[D&C 133:14]]). John hears the same voice from heaven: “Come out of her, my people, that ye be not partakers of her sins” ([[Rev. 18:4]]). Jeremiah 51:6 is listed among the places where “the Saints of God are commanded to flee out of the midst of Babylon.”

      What “Babylon” means has been spelled out by latter-day leaders. Elder Bruce R. McConkie: “Babylon is the world with all its carnality and wickedness. Babylon is the degenerate social order created by lustful men who love darkness rather than light,” and also “false and degenerate religion in all its forms and branches.” Elder David R. Stone of the Seventy, speaking from the history: ancient Babylon “was, in the time of ancient Israel, a city which had become sensual, decadent, and corrupt,” and its principal building was a temple to a false god. The first hearers and the latter-day ones stand under the same command: because Babylon is also a symbol of the world, the charge to Israel was “to flee from her wickedness and to be responsible for saving their own souls.”
    sources: [lds-scriptures, doctrines-gospel-35, stone-zion-babylon, ot-manual-25]
  - ref: 7
    phrase: Babylon hath been a golden cup in the LORD’s hand
    kind: symbol
    title: A golden cup in the Lord's hand
    body: |
      Babylon is a cup the Lord held and poured, so its power was lent, not its own. Earlier Jeremiah is told to take “the wine cup of this fury at my hand” and make “all the nations” drink it ([[Jer. 25:15]]); here the cup is Babylon itself, and the nations drank from it and “are mad.” The same image turns around in John's vision, where a woman holds “a golden cup in her hand full of abominations and filthiness of her fornication” ([[Rev. 17:4]]), a cup that is hers, not the Lord's.

      John is working from the earlier prophets: “Israelite prophets in turn wrote about the eventual destruction of Babylon (see… Jeremiah 50:35–36, 40; 51:6–8), and John drew upon their language.” [The Cup of the Lord’s Fury](/jeremiah/themes/cup-of-fury/#babylon) follows the cup through the book.
    sources: [lds-scriptures, nt-student-manual-56]
  - ref: 9
    phrase: We would have healed Babylon
    kind: history
    title: Who is speaking in verse 9
    body: |
      The verse does not name its speakers; one reading takes them to be the peoples Babylon held, who now give her up. Verse 8 tells the nations to bring balm for Babylon's wound, and the answer is “We would have healed Babylon, but she is not healed: forsake her, and let us go every one into his own country.” “Every one into his own country” points to people from different lands, “the nations that had been vanquished by Babylon and detained in the city, of which Israel was one.” The balm that cannot heal is an image Jeremiah used of Egypt ([[Jer. 46:11]]), the passage the Church edition links to verse 8. And “her judgment reacheth unto heaven” is echoed in John's “her sins have reached unto heaven, and God hath remembered her iniquities” ([[Rev. 18:5]]).

      Whoever speaks, the verse carries a lesson about the Lord's patience: “God would have healed them, as He would all His children, before their destruction, but sometimes, like Babylon, they resist turning to the Lord and therefore are not healed.”
    sources: [keil-jeremiah, lds-scriptures, nt-student-manual-56, ot-manual-25]
  - ref: 11
    phrase: the kings of the Medes
    kind: history
    title: Why the Medes
    body: |
      The Medes were the people whom the Lord would rouse against Babylon, and they became part of Cyrus's empire. Media lay between the Caspian Sea and Elam; its king Cyaxares “joined with the Babylonian king Nabopolassar in the overthrow of Nineveh,” and later Cyrus, “by his defeat of Astyages (550 B.C.), gained possession of Media, which he united with the Persian kingdom.” Cyrus, “the first king of the Persians and Medes,” then “captured Babylon and overthrew the Chaldean dynasty.” Daniel names the man who took the kingdom: “Darius the Median” ([[Dan. 5:31]]). Isaiah had already said the same: “I will stir up the Medes against them” ([[Isa. 13:17]]).

      The verse says the Lord “hath raised up the spirit of the kings of the Medes,” so the conquest is the Lord's act, and it is “the vengeance of his temple.” The temple had been entered by foreigners ([[Lam. 1:10]]; see verse 51 below).
    sources: [bd-media, bd-cyrus, lds-scriptures]
  - ref: 13
    phrase: O thou that dwellest upon many waters
    kind: scripture
    title: Babylon on many waters
    body: |
      “Many waters” fits Babylon the city, and Revelation and the Book of Mormon make it a picture of Babylon's reach. The Euphrates “ran through the middle” of the city. John sees “the great whore that sitteth upon many waters” ([[Rev. 17:1]]) and is told what the waters are: “peoples, and multitudes, and nations, and tongues” ([[Rev. 17:15]]). Nephi sees the same figure: “I looked and beheld the whore of all the earth, and she sat upon many waters; and she had dominion over all the earth, among all nations, kindreds, tongues, and people” ([[1 Ne. 14:11]]). The Church edition links verse 13 to both.

      The two later visions belong together: “John's vision of Babylon parallels much of Nephi's vision of the great and abominable church.”
    sources: [bd-babylon, lds-scriptures, nt-student-manual-56]
  - ref: 15
    phrase: He hath made the earth by his power
    kind: scripture
    title: The Maker against the idols
    body: |
      Verses 15–19 repeat, almost word for word, lines that stand earlier in the book, now turned on Babylon's gods. They are [[Jer. 10:12–16]], where they close a warning to Israel against the idols of the nations: “Learn not the way of the heathen” ([[Jer. 10:2]]). The argument is the same in both: the God who “hath made the earth by his power” and “maketh lightnings with rain” is not like the “molten image,” which has “no breath in them.” The Church edition's note on “former” (verse 19) gives “creator”: the God of Jacob made all things.

      The Church edition's note on “graven image” goes to the Lord's description of the latter days: people walk “after the image of his own god, whose image is in the likeness of the world, and whose substance is that of an idol, which waxeth old and shall perish in Babylon, even Babylon the great, which shall fall” ([[D&C 1:16]]).
    sources: [lds-scriptures]
  - ref: 20
    phrase: Thou art my battle axe and weapons of war
    kind: scripture
    title: Who is the battle axe?
    body: |
      The verse does not say who is addressed, and the Church edition reads it as Israel. The chapter heading says “Israel is the Lord's rod to destroy all kingdoms,” and verse 19 has just ended, “Israel is the rod of his inheritance.” On that reading Israel is the Lord's weapon against the nations.

      Another reading takes the “battle axe” to be Babylon herself: the Lord used Babylon to break nations in pieces, and then, as verse 24 says, “I will render unto Babylon… all their evil that they have done in Zion.” The text allows the question; the Church's heading gives its answer.
    sources: [lds-scriptures, keil-jeremiah]
  - ref: 25
    phrase: O destroying mountain
    kind: symbol
    title: A mountain made a burnt mountain
    body: |
      The “destroying mountain” is Babylon, as the Church edition's note says. One reading takes “mountain” to mean “a powerful kingdom, supereminent above others,” and “destroying” to cover all the ruin Babylon brought. The sentence turns a mountain's strength upside down: it is rolled from the rocks, made a burnt mountain, and no one will take from it “a stone for a corner, nor a stone for foundations.” The ruins are good for nothing, a city never rebuilt. Isaiah says it in plain words: “It shall never be inhabited, neither shall it be dwelt in from generation to generation” ([[Isa. 13:20]]).

      Elder McConkie, looking at the history: “Today the greatest world city of antiquity is a mound of desert earth that will not rise again. Babylon the great has fallen forever.”
    sources: [lds-scriptures, keil-jeremiah, doctrines-gospel-35]
  - ref: 31
    phrase: that his city is taken at one end
    kind: history
    title: The city taken at one end
    body: |
      The city is taken completely, and the king is the last to know. The Church edition gives another rendering of “taken at one end”: “captured completely.” Runner after runner comes to tell the king (verses 31–32). The Church edition's note on “the king of Babylon” in this verse goes to the night Babylon fell in Daniel: “In that night was Belshazzar the king of the Chaldeans slain” ([[Dan. 5:30]]). Jeremiah does not name the king or the night.

      Who did it is named elsewhere. “Dry up her sea” (verse 36) is linked to [[Isa. 44:27]], “That saith to the deep, Be dry,” and the next verse names the one who is to perform it: “Cyrus, He is my shepherd” ([[Isa. 44:28]]). The Bible Dictionary says Cyrus “captured Babylon and overthrew the Chaldean dynasty.”
    sources: [lds-scriptures, bd-cyrus]
  - ref: 36
    phrase: I will plead thy cause, and take vengeance for thee
    kind: christ
    title: I will plead thy cause
    body: |
      Zion's complaint (verses 34–35) is answered by the Lord Himself, who takes her case. The nearest parallel is [[Jer. 50:34]]: “Their Redeemer is strong; the Lord of hosts is his name: he shall throughly plead their cause.” That Redeemer is Christ: Israel “will be led by the Lord Jesus Christ (see v. 34). He is the advocate with the Father (see D&C 29:5) and pleads our cause before Him.” In the Doctrine and Covenants the Lord says, “I am in your midst, and am your advocate with the Father” ([[D&C 29:5]]).
    sources: [lds-scriptures, ot-manual-25]
  - ref: 44
    phrase: I will punish Bel in Babylon
    kind: history
    title: Bel, the city's god
    body: |
      Bel was Babylon's god, and judgment on the city is judgment on its god: “The chief building was the famous temple of Bel.” Here the god is pictured as having swallowed what Babylon seized: the Lord will bring it “out of his mouth,” and “the nations shall not flow together any more unto him.” The same chapter says the Lord will judge her “graven images” (verses 47, 52).
    sources: [bd-babylon]
  - ref: 49
    phrase: As Babylon hath caused the slain of Israel to fall
    kind: scripture
    title: Measure for measure, and beyond Babylon
    body: |
      Babylon is repaid in kind, and the repayment reaches “the slain of all the earth.” Verse 24 says the same: “I will render unto Babylon… all their evil that they have done in Zion.” The Church edition's note on verse 24 goes to Nephi's vision of the great and abominable church: “that great pit which hath been digged for the destruction of men shall be filled by those who digged it” ([[1 Ne. 14:3]]).

      The wider reach fits a chapter that speaks on two levels. Chapters 50–51 are difficult to interpret “unless two principles of Hebrew prophecy are accepted: the dual nature of many prophecies, and the recurring use of archetypes and metaphors.” “The downfall anciently of Nebuchadnezzar's Babylon was a prototype of the future downfall of ‘Babylon the Great’ (see Revelation 18–19).”
    sources: [lds-scriptures, ot-manual-25]
  - ref: 50
    phrase: let Jerusalem come into your mind
    kind: history
    title: Remember Jerusalem from afar
    body: |
      Verse 50 speaks to Judah's survivors in exile, and verse 51 gives their answer. The word to them is “Remember the LORD afar off, and let Jerusalem come into your mind.” They reply, “We are confounded, because we have heard reproach… for strangers are come into the sanctuaries of the LORD’s house.” The sanctuary profaned is the temple. Lamentations says the same: “the heathen entered into her sanctuary, whom thou didst command that they should not enter into thy congregation” ([[Lam. 1:10]]), the verse the Church edition links here.
    sources: [lds-scriptures]
  - ref: 59
    phrase: a quiet prince
    kind: words
    title: A quiet prince
    body: |
      The Church edition's note gives another rendering of “a quiet prince”: “quartermaster.” He went “with Zedekiah the king of Judah into Babylon in the fourth year of his reign,” about 594 B.C. if Zedekiah's reign began in 597, as the Bible Dictionary dates it. He is “the son of Neriah, the son of Maaseiah,” the same father and grandfather as Baruch, Jeremiah's scribe ([[Jer. 32:12]]). The text does not say whether the two were brothers.
    sources: [lds-scriptures, bd-jeremiah]
  - ref: 63
    phrase: bind a stone to it, and cast it into the midst of Euphrates
    kind: symbol
    title: The scroll sunk in the Euphrates
    body: |
      The scroll goes under the river as Babylon will. Jeremiah writes “in a book all the evil that should come upon Babylon” (verse 60); Seraiah reads it and prays that the Lord's word stand: “thou hast spoken against this place, to cut it off, that none shall remain in it” (verse 62); then he sinks it, saying “Thus shall Babylon sink, and shall not rise from the evil that I will bring upon her.” John's angel does the same in his vision: “a mighty angel took up a stone like a great millstone, and cast it into the sea, saying, Thus with violence shall that great city Babylon be thrown down, and shall be found no more at all” ([[Rev. 18:21]]).
    sources: [lds-scriptures]
  - ref: 64
    phrase: Thus far are the words of Jeremiah
    kind: history
    title: Thus far are the words of Jeremiah
    body: |
      The sentence closes the prophet's words; chapter 52, which follows, “forms a historical conclusion.” Chapters 50–51 themselves, “in their present form,” are “later than Jeremiah.” Yet the chapter itself says Jeremiah wrote the words against Babylon in a book and sent it with Seraiah (verses 59–60), and the prophecy was “written and sent to Babylon in the days of Zedekiah.” Neither source says what was changed in “their present form.”
    sources: [bd-jeremiah, ot-manual-25]

christ: |
  The chapter shows the Lord as the one who takes His people's side. When Zion cries out that Babylon has devoured her, the answer is the Lord's own: “I will plead thy cause, and take vengeance for thee” (verse 36). That promise points to Christ, “the advocate with the Father” who “pleads our cause before Him,” and the Lord says in the Doctrine and Covenants, “I am in your midst, and am your advocate with the Father” ([[D&C 29:5]]). Verse 5 says Israel “hath not been forsaken,” and the passage of Isaiah the Church edition links to it describes a Redeemer who gathers “with great mercies” ([[Isa. 54:7]]).

explore: |
  - **The first half.** Read [[Jer. 50]], and compare verses 15–19 with [[Jer. 10:12–16]].
  - **The command to leave.** Read [[D&C 133:5–14]] and [[Rev. 18:1–24]].
  - **Isaiah on Babylon.** Read [[Isa. 13]] and [[Isa. 47]].
  - **Nephi's vision.** Read [[1 Ne. 14:1–17]] beside Revelation 17.
  - **The doctrine of Babylon.** The Doctrines of the Gospel Student Manual chapter “The Fall of Babylon and the Establishment of Zion” gathers the passages.

sources: [lds-scriptures, ot-manual-25, doctrines-gospel-35, stone-zion-babylon, nt-student-manual-56, bd-jeremiah, bd-babylon, bd-media, bd-cyrus, keil-jeremiah, oshb-wlc]
