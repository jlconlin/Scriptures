chapter: 44
title: Whose Words Shall Stand
tagline: In Egypt, Jews who disobeyed the Lord to get there say they prospered while worshiping the queen of heaven. Jeremiah's last recorded prophecy tells them whose word will stand.
when: 'Undated. It follows the flight to Egypt after the fall of Jerusalem (586 B.C., Bible Dictionary) and the word at Tahpanhes in [[Jer. 43:8–13]], and, on one reading, comes before Babylon occupied Egypt'

setting: |
  The people addressed in this chapter are the survivors who should not have been in Egypt. After Jerusalem fell, those left in the land asked Jeremiah to seek the Lord's will, promised to obey it, and were told to stay ([[Jer. 42:5–6]]; [[Jer. 42:15–16]]). They went to Egypt anyway, and took Jeremiah and Baruch with them ([[Jer. 43:5–7]]), Jeremiah “as a kind of fetish”; “according to tradition” they at last stoned him to death.

  The chapter is addressed to Jews now scattered across four places in Egypt, and it reads as a last confrontation: “the Jews in Egypt, save a small remnant, will be destroyed because they worship false gods.” It falls in four movements: the Lord points to Jerusalem's ruin and asks why they repeat the sin that caused it (verses 1–14); the people answer that they will keep worshiping the queen of heaven, and that they did well when they did (verses 15–19); Jeremiah answers that the ruin is the proof (verses 20–23); and the Lord swears judgment and gives a sign (verses 24–30).

  The chapter has no date. On one reading it is Jeremiah's last prophecy, spoken long after the word at Tahpanhes and before Babylon had taken Egypt.

thread: |
  Jeremiah 44 is a dispute about how to read history. Both sides look at the same ruined cities. The Lord says the ruin is what idolatry costs; verses 2–6 say so, and verses 21–23 repeat it. The people say the ruin began when they stopped worshiping the queen of heaven (verses 17–18). Each side claims experience as its evidence, and the chapter's question is who gets to interpret it.

  The answer is in who speaks. The people will do “whatsoever thing goeth forth out of our own mouth” (verse 17); the Lord replies with an oath “by my great name” (verse 26). Judah's own word is a vow to another god, and the Lord's word has been sent “rising early” through prophets (verse 4) and now stands in the sentence “ye shall know whose words shall stand, mine, or theirs” (verse 28). The sign he gives, the fall of Pharaoh-hophra, is the same kind of event that has already happened to Zedekiah (verse 30): the proof the people need is the history they will live through.

sections:
  - range: 1-14
    heading: The Lord points to Jerusalem's ruin
    plain: |
      This is the word to all the Jews living in Egypt, at Migdol, Tahpanhes, Noph, and Pathros. “You have seen the evil I brought on Jerusalem and the cities of Judah. They lie empty today, because of the evil they did, burning incense and serving gods that neither they nor you nor your fathers knew. I sent all my servants the prophets again and again, saying, ‘Do not do this detestable thing that I hate.’ They would not listen, so my anger was poured out on Jerusalem. Why are you doing this great harm to yourselves, cutting off man and woman, child and infant from Judah, provoking me by burning incense to other gods in Egypt, where you have come to live? Have you forgotten the wickedness of your fathers, of the kings of Judah and their wives, of you and your wives? They have not humbled themselves to this day. So I will set my face against you and cut off all Judah. The remnant that set their faces to go to Egypt will be consumed there, from the least to the greatest, by sword and famine, and become a curse and a reproach. None of them will escape and return to Judah, though they long to; none will return except a few fugitives.”
  - range: 15-19
    heading: The people's answer
    plain: |
      All the men who knew their wives burned incense to other gods, and all the women standing by, a great crowd, answered: “We will not listen to the word you have spoken to us in the Lord's name. We will certainly do everything we have said we would do: burn incense to the queen of heaven and pour out drink offerings to her, as we and our fathers, our kings and our officials did in Judah. Then we had plenty of food and no harm. But since we stopped, we have lacked everything and have been destroyed by sword and famine. And when we burned incense and poured out drink offerings to her, did we make cakes for her and pour out offerings without our husbands?”
  - range: 20-23
    heading: Jeremiah's reply
    plain: |
      Jeremiah answered all the people, men and women: “The incense you burned in the cities of Judah and the streets of Jerusalem, you, your fathers, your kings, your officials, and the people of the land: the Lord remembered it. He could no longer bear your evil and your abominations, and so your land became a ruin and a curse, without inhabitants, as it is today. It is because you burned incense and sinned against the Lord and did not obey him that this disaster has come on you.”
  - range: 24-30
    heading: The oath and the sign
    plain: |
      Jeremiah said to all the people, and to all the women: “Hear the word of the Lord, all Judah in Egypt. You and your wives have said it with your mouths and done it with your hands: ‘We will keep our vows to the queen of heaven.’ You will surely keep them! But hear this: I swear by my great name that no man of Judah in Egypt will ever again say, ‘As the Lord God lives.’ I am watching over them for harm and not for good. All the men of Judah in Egypt will die by sword and famine until they are finished. A few who escape the sword will return to Judah, and the whole remnant will know whose word stands, mine or theirs. This will be the sign that I will punish you here: I will give Pharaoh Hophra, king of Egypt, into the hands of his enemies who seek his life, as I gave Zedekiah king of Judah into the hand of Nebuchadnezzar, his enemy.”

notes:
  - ref: 1
    phrase: Migdol, and at Tahpanhes, and at Noph, and in the country of Pathros
    kind: history
    title: Four places in Egypt
    body: |
      The four names stretch from Egypt's northern frontier to its far south. Noph is Memphis, the “ancient capital of Egypt,” and Pathros is Upper Egypt, the south of the country. Migdol and Tahpanhes were frontier towns in the north: on one reading Migdol was “the most northerly place in Egypt,” and Tahpanhes, where Jeremiah hid the stones ([[Jer. 43:9]]), is Daphne. The Jews had settled “not merely in the two northern frontier towns” but well inland, so the word is addressed to a scattered and settled community.
    sources: [bd-noph, bd-pathros, keil-jeremiah, lds-scriptures]
  - ref: 2
    phrase: Ye have seen all the evil that I have brought upon Jerusalem
    kind: scripture
    title: Lehi saw the same ruin
    body: |
      The Lord begins with what these Jews have seen, and the Church edition links the verse to Lehi's words in the Book of Mormon. Lehi saw the same ruin ahead of time: “I have seen a vision, in which I know that Jerusalem is destroyed; and had we remained in Jerusalem we should also have perished” ([[2 Ne. 1:4]]). The Jews in Egypt had seen the ruin with their own eyes, and in this chapter the Lord asks what they have learned from it.
    sources: [lds-scriptures]
  - ref: 4
    phrase: rising early and sending them
    kind: scripture
    title: Rising early and sending
    body: |
      The Lord says He sent His prophets again and again. Chronicles tells the same story as compassion that was refused: the Lord “sent to them by his messengers, rising up betimes, and sending; because he had compassion on his people,” but “they mocked the messengers of God, and despised his words, and misused his prophets” ([[2 Chr. 36:15–16]]). The Church edition adds the Lord's words in our day to those who refused: “ye believed not my servants, and when they were sent unto you ye received them not” ([[D&C 133:71]]).
    sources: [lds-scriptures]
  - ref: 12
    phrase: that have set their faces to go into the land of Egypt
    kind: history
    title: Asked, promised, refused
    body: |
      These Jews had been given the right answer and had promised to follow it. They asked Jeremiah to seek the Lord and swore, “we will obey the voice of the Lord our God, to whom we send thee” ([[Jer. 42:6]]). The Lord's answer was that the sword and the famine they feared would find them in Egypt ([[Jer. 42:16]]). Their leaders replied, “Thou speakest falsely,” and went ([[Jer. 43:2]]).

      The prophecy of this chapter “was fulfilled among yet another group of Jews who could have received blessings at the Lord's hand if they would have obeyed His prophet. But instead, they trusted in their own judgment.”
    sources: [lds-scriptures, ot-seminary-guide-jer-37-44]
  - ref: 16
    phrase: we will not hearken unto thee
    kind: prophets
    title: A prophet that people would rather not hear
    body: |
      The refusal in verse 16 is the refusal of a living prophet, and prophets in our day have said why it happens. Ezra Taft Benson taught that “Popularity is never a test of truth. Many a prophet has been killed or cast out,” and that “How we respond to the words of a living prophet when he tells us what we need to know, but would rather not hear, is a test of our faithfulness.”

      Spencer W. Kimball said of the Church that “many are prone to garnish the sepulchres of yesterday's prophets and mentally stone the living ones.” Jeremiah is the example: the leaders of Judah “cast aside his words as naught,” and “eventually he was driven out of Israel and compelled to live in Egypt.”
    sources: [benson-fourteen, ot-manual-24]
  - ref: 17
    phrase: unto the queen of heaven
    kind: history
    title: The queen of heaven
    body: |
      The queen of heaven is a goddess of fertility, and the Church edition names Ishtar as an example. She was worshiped in Judah before the exile: the same cakes appear in Jeremiah's temple sermon, where “the children gather wood, and the fathers kindle the fire, and the women knead their dough, to make cakes to the queen of heaven” ([[Jer. 7:18]]). Under Manasseh “there was introduced the worship of the heavenly planets in accordance with the dictates of the Assyro-Babylonian religion,” and the worship of the queen of heaven was part of the idolatry Jeremiah found in Judah.

      So when the people say “as we have done, we, and our fathers, our kings, and our princes,” they are telling the truth about a practice that had royal sponsors, and Jeremiah does not deny it.
    sources: [lds-scriptures, ot-manual-23]
  - ref: 17
    phrase: whatsoever thing goeth forth out of our own mouth
    kind: scripture
    title: Their own mouth
    body: |
      The people choose their own word over the Lord's, and the Church edition links the verse to the Lord's description of idolatry in our day: “every man walketh in his own way, and after the image of his own god” ([[D&C 1:16]]). Spencer W. Kimball quoted that verse in teaching that “Whatever thing a man sets his heart and his trust in most is his god; and if his god doesn't also happen to be the true and living God of Israel, that man is laboring in idolatry.” In his words, carnal man “has tended to transfer his trust in God to material things,” and these Jews do so by their own account (“we had plenty of victuals”).
    sources: [lds-scriptures, kimball-false-gods]
  - ref: 17
    phrase: for then had we plenty of victuals, and were well, and saw no evil
    kind: history
    title: Why it seemed to work
    body: |
      Their argument is from experience, and Jeremiah answers it with the same experience read differently. One reading is that they reasoned “post hoc, ergo propter hoc” (after this, therefore because of this) from the fact that “after idolatry had been rooted out by Josiah, adversity had befallen the land of Judah.” The text itself gives only their claim.

      Jeremiah's reply in verses 21–23 does not argue about the goddess. He says the Lord remembered the incense, “could no longer bear” it, and that the ruin is “as at this day,” visible to them now. The chapter is “a good example of how people rationalize their disobedience.”
    sources: [keil-jeremiah, ot-seminary-teacher-resource-jer-34-52, ot-seminary-teacher-137]
  - ref: 19
    phrase: without our men
    kind: words
    title: Without our men
    body: |
      On one reading the women are insisting that their husbands knew and approved, as a self-vindication: “without our men” means “without their knowledge and approval,” since under the law a husband could “declare not binding” a vow his wife made without his knowledge. Verse 15 fits it: the men “knew that their wives had burned incense,” and the large gathering may have been “a festival in honour of the queen of heaven.” The verse itself shows only that husbands and wives answered together.
    sources: [keil-jeremiah]
  - ref: 26
    phrase: my name shall no more be named in the mouth of any man of Judah in all the land of Egypt
    kind: scripture
    title: The oath by His great name
    body: |
      The Lord answers their vows with His own oath. Their vows are made to the queen of heaven; His is made by His own name, as when He promised Abraham and “sware by himself” because “he could swear by no greater” ([[Heb. 6:13]]). The verse says that “The Lord GOD liveth” will no more be said by any man of Judah in Egypt, and verse 27 gives the reason: they will be consumed “until there be an end of them,” so no one will be left to say it. The Church edition links it to the Lord's statement, which Nephi reads from Isaiah, that “I will not suffer my name to be polluted” ([[1 Ne. 20:11]]).
    sources: [lds-scriptures]
  - ref: 27
    phrase: I will watch over them for evil, and not for good
    kind: words
    title: The same watching as in chapter 31
    body: |
      The verb “watch” in verse 27 is the one used for restoration in chapter 31. The Hebrew in verse 27 and in [[Jer. 31:28]] is the same verb, *shaqad*, “keep watch of, be wakeful over,” with the Lord watching over people “to benefit or injure”; it is also the verb of the Lord watching over His word in [[Jer. 1:12]]. In chapter 31 the Lord says, “like as I have watched over them, to pluck up, and to break down, and to throw down, and to destroy, and to afflict; so will I watch over them, to build, and to plant.” The Church edition links the two verses. The Lord's watching works in both directions: in chapter 31 it ends in building and planting, and here, “for evil, and not for good.”
    sources: [lds-scriptures, biblehub-interlinear, bdb]
  - ref: 28
    phrase: shall know whose words shall stand, mine, or theirs
    kind: scripture
    title: Whose word stands
    body: |
      The test is whose word comes true, not who argues better. The few who survive and “return to Judah” serve “as a witness that the Lord's word was fulfilled.” Verse 14 had said the same: “none shall return but such as shall escape.” Here the prophet whom Judah refused is the one the outcome supports.
    sources: [ot-seminary-guide-jer-37-44]
  - ref: 30
    phrase: I will give Pharaoh-hophra king of Egypt into the hand of his enemies
    kind: history
    title: The sign of Pharaoh Hophra
    body: |
      The sign is the fall of the king of the land where they sought refuge. Pharaoh Hophra is the king who sent an army to help Zedekiah during the siege ([[Jer. 37:5–11]]). The Lord compares it to Zedekiah, whom the Chaldeans overtook and brought to Nebuchadnezzar at Riblah ([[Jer. 39:5]]). Jeremiah's oracle against Egypt also names Pharaoh among those to be delivered “into the hand of those that seek their lives” ([[Jer. 46:25–26]]).

      How the sign was met is less certain. One reading identifies Hophra with the king classical writers call Apris, whom his successor Amasis “took … prisoner, and gave him up to the common people, who killed him”; on that reading the verse's words “do not require us to assume that Hophra was killed by Nebuchadnezzar.” The verse itself promises only that Hophra will be given to those who seek his life.
    sources: [bd-pharaoh, lds-scriptures, keil-jeremiah]

christ: |
  The chapter shows what it costs to turn away from the God who sends. He sent His servants early and often out of compassion, and Hebrews says that after the prophets He has spoken by His Son: “God, who at sundry times and in divers manners spake in time past unto the fathers by the prophets, hath in these last days spoken unto us by his Son” ([[Heb. 1:1–2]]). Nephi the son of Helaman uses Jeremiah in the same way. Jerusalem was destroyed “according to the words of Jeremiah,” and so he asks, “why not the Son of God come, according to his prophecy?” ([[Hel. 8:20]]). The Lord who says “my words shall surely stand” in verse 29 is the one whose words about His own coming have also stood.

explore: |
  - **The stones at Tahpanhes.** Read [[Jer. 43:8–13]] to see the earlier word spoken in the same city.
  - **The refugees' request.** Read [[Jer. 42]] and set the people's promise beside their answer here.
  - **Egypt's turn.** Read [[Jer. 46]], Jeremiah's longer oracle against Egypt.
  - **Idolatry named in our day.** Read Spencer W. Kimball, “The False Gods We Worship” (*Ensign*, June 1976), for how a prophet applies the same charge.

