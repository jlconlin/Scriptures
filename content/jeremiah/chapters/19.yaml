chapter: 19
title: The Broken Jar
tagline: Jeremiah takes a clay jar and the city's elders out to the valley where children were burned, smashes the jar before them, and says the Lord will break Jerusalem the same way.
when: 'No date is given. The Bible Dictionary places chapters 7–20 under Jehoiakim (608–597 B.C.), and this discourse was delivered in his reign'

setting: |
  Chapter 19 gives no date of its own. It stands among chapters 7–20, the prophecies under Jehoiakim (608–597 B.C.), and the discourse “was delivered during the reign of Jehoiakim.”

  It is the second of two scenes with a potter. In chapter 18 Jeremiah watched clay being reworked on the wheel. Here he buys a finished jar, takes some of the leading elders and priests out of the city to the valley of the son of Hinnom, gives them the Lord's word, and breaks the jar in front of them. The act stood for “the sacking and captivity of Judah.” The charge and the sentence, in brief: “The Lord will bring evil upon Judah—They sacrifice their children to Baal—In the siege they will eat the flesh of their sons and daughters.”

  Much of the language repeats the end of the temple sermon ([[Jer. 7:30–34]]), which already explains Tophet and the valley; this chapter adds the jar. When Jeremiah came back and repeated the warning in the temple court, the priest Pashur punished him for it ([[Jer. 20:1–2]]).

thread: |
  The chapter turns on **a thing that cannot be mended.** In chapter 18 the spoiled clay was still soft, and the Lord's word was conditional: turn, and the evil will not come. The sign in chapter 19 has no “if.” The jar is finished, and when it breaks it “cannot be made whole again” (verse 11).

  The charges are the reason, and they build to a climax (verses 4–5): the people have forsaken the Lord, made His city a stranger to Him, burned incense to other gods, filled Jerusalem with innocent blood, and, worst of all, burned their own children in the fire. Two of its phrases are the ones the book of Kings uses for the reign of King Manasseh: ears that “tingle” at the news ([[2 Kgs. 21:12]]), a city filled with innocent blood ([[2 Kgs. 21:16]]). Kings gives that as the reason Judah fell: “for the sins of Manasseh… and also for the innocent blood that he shed… which the Lord would not pardon” ([[2 Kgs. 24:3–4]]). Manasseh's sins were alive again in Jeremiah's day.

  The punishment then fits the place. The valley where the children died will be renamed for the slaughter of the city's people; the whole city, rooftop altars and all, will become as unclean as Tophet.

sections:
  - range: 1-9
    heading: The word in the valley
    plain: |
      The Lord said: “Go and buy a clay jar from a potter. Take some of the elders of the people and of the senior priests, and go out to the valley of the son of Hinnom, by the entrance of the east gate (the Potsherd Gate), and proclaim there what I tell you. Say: Hear the word of the Lord, kings of Judah and people of Jerusalem. The Lord of hosts, the God of Israel, says: I am bringing such a disaster on this place that the ears of everyone who hears of it will ring. For they have forsaken me and treated this place as foreign; they have burned incense here to other gods that neither they nor their fathers nor the kings of Judah knew, and they have filled this place with the blood of the innocent. They have built the high places of Baal to burn their sons in the fire as burnt offerings to Baal, something I never commanded or spoke of, and that never entered my mind. So the days are coming when this place will no longer be called Tophet or the valley of the son of Hinnom, but the Valley of Slaughter. Here I will empty out the plans of Judah and Jerusalem. I will make them fall by the sword before their enemies, at the hands of those who want them dead, and I will give their bodies as food to the birds and the wild animals. I will make this city a desolation and a thing to hiss at; everyone who passes will be appalled and hiss at all its afflictions. And in the siege, when their enemies close in on them, I will make them eat the flesh of their own sons and daughters, and they will eat one another.”
  - range: 10-13
    heading: The jar is broken
    plain: |
      “Then break the jar in front of the men who went with you, and tell them: The Lord of hosts says, This is how I will break this people and this city, as one breaks a potter's jar, so that it can never be mended. They will bury in Tophet until there is no room left to bury. That is what I will do to this place and its people: I will make this city like Tophet. The houses of Jerusalem and the houses of the kings of Judah will be unclean like the place of Tophet, all the houses on whose roofs they burned incense to all the host of heaven and poured out drink offerings to other gods.”
  - range: 14-15
    heading: The same word in the temple court
    plain: |
      Then Jeremiah came back from Tophet, where the Lord had sent him to prophesy, stood in the court of the Lord's house, and said to all the people: “The Lord of hosts, the God of Israel, says: I am about to bring on this city and on all its towns every disaster I have pronounced against it, because they have stiffened their necks and refused to listen to my words.”

notes:
  - ref: 1
    phrase: a potter’s earthen bottle
    kind: symbol
    title: A finished jar
    body: |
      The “bottle” is a clay jar, and the point is that it is finished. The Hebrew word, *baqbuq*, is a “flask,” its name taken from the “gurgling sound” it makes as it empties, and the verse calls it a potter's jar of earthenware. The potter has appeared already, in the visit to the potter's house ([[Jer. 18:2]]). There the clay was soft and could be reworked; “Jeremiah 19 tells about a finished piece of pottery.”

      The “ancients” (the footnote gives “elders”) of the people and of the priests go along as witnesses: the jar is to be broken “in the sight of the men that go with thee” (verse 10). The city's leaders see the sign with their own eyes.
    sources: [bdb, biblehub-interlinear, lds-scriptures, ot-seminary-guide-jer-18]
  - ref: 2
    phrase: the east gate
    kind: words
    title: The Potsherd Gate
    body: |
      The KJV's “east gate” is in Hebrew the gate of *ha-charsit*, “the Potsherd,” and modern translations call it “the Potsherd Gate.” It was the gate of potsherds, “where they were thrown,” and it “led into the valley of Hinnom,” which lay south and west of Jerusalem. The name, then, fits the sign: Jeremiah breaks a jar by the gate named for broken pottery. On one reading the name “points no doubt to the breaking to shivers of the jar,” though which of the city's known gates it was “cannot be decided.”
    sources: [biblehub-interlinear, bdb, bd-hinnom-valley-of, keil-jeremiah]
  - ref: 3
    phrase: his ears shall tingle
    kind: scripture
    title: Ears that tingle
    body: |
      “His ears shall tingle” describes news so terrible that hearing it stings, and the phrase had been used twice before. The Lord told the boy Samuel that He would do a thing in Israel “at which both the ears of every one that heareth it shall tingle” ([[1 Sam. 3:11]]), the judgment on Eli's house. Later, in Manasseh's reign, “the Lord spake by his servants the prophets”: “I am bringing such evil upon Jerusalem and Judah, that whosoever heareth of it, both his ears shall tingle” ([[2 Kgs. 21:12]]).

      Jeremiah takes up the words spoken over Manasseh's Jerusalem, and the next verses bring up Manasseh's sins (see the thread above).
    sources: [lds-scriptures]
  - ref: 4
    phrase: have estranged this place
    kind: words
    title: Making the city a stranger
    body: |
      To have “estranged this place” is to have made Jerusalem a stranger to its God; the Church edition's footnote gives “alienated.” The city was the place of His house, and they filled it with the worship of gods that were themselves strangers, “whom neither they nor their fathers have known, nor the kings of Judah.”
    sources: [lds-scriptures]
  - ref: 4
    phrase: have filled this place with the blood of innocents
    kind: history
    title: The blood of innocents
    body: |
      “The blood of innocents” may be the children of verse 5, or it may be wider: innocent people put to death in the city. The words are those used of Manasseh, who “shed innocent blood very much, till he had filled Jerusalem from one end to another” ([[2 Kgs. 21:16]]), and Kings names that blood as a reason the Lord “would not pardon” Judah ([[2 Kgs. 24:4]]). The Church edition's footnote points to [[Jer. 2:34]], where “the blood of the souls of the poor innocents” is found on Judah's skirts.

      It has been read both ways: as “the blood of the children slain for Moloch,” or as “judicial murder or of bloody persecution of the godly,” a separate charge before the worst one in verse 5. The text does not settle it; either way the city is guilty of killing the innocent.
    sources: [lds-scriptures, keil-jeremiah]
  - ref: 5
    phrase: to burn their sons with fire for burnt offerings unto Baal
    kind: history
    title: Baal and Molech
    body: |
      The children were burned as offerings, and the book names the god both as Baal and as Molech. Molech was “a fire god, worshipped by passing children through or burning them in fire,” and his worship had been practiced by kings of Judah, Ahaz and Manasseh among them. In [[Jer. 32:35]] the two names stand in one sentence: “they built the high places of Baal, which are in the valley of the son of Hinnom, to cause their sons and their daughters to pass through the fire unto Molech.” The law had forbidden it outright ([[Lev. 18:21]]).

      The Lord's threefold denial, “which I commanded not, nor spake it, neither came it into my mind,” takes the two denials of [[Jer. 7:31]] and adds a third. He had never asked for it.

      The Book of Mormon records the same horror at the end of Nephite history ([[Morm. 4:14]]): the Lamanites took “women and children” prisoner and offered them “as sacrifices unto their idol gods,” and did it again ([[Morm. 4:21]]).
    sources: [bd-molech, lds-scriptures]
  - ref: 6
    phrase: The valley of slaughter
    kind: history
    title: The valley of slaughter
    body: |
      Verse 6 repeats almost word for word the renaming already given in [[Jer. 7:32]]: Tophet, “a spot in the valley of the son of Hinnom, south of Jerusalem, where human sacrifices were offered to Molech,” will be known instead for the people killed there. The note on [[Jer. 7:31]] tells Tophet's history. The valley's name lasted: as Gehenna it became “symbolic of the place of torment after death” (see [[Matt. 10:28]]).
    sources: [bd-topheth, bd-gehenna]
  - ref: 7
    phrase: I will make void the counsel of Judah and Jerusalem
    kind: words
    title: Emptying the plans
    body: |
      “Make void” sounds like the jar Jeremiah is holding. The verb is *baqaq*, “empty,” and it echoes *baqbuq*, the jar. It is probably related to “a gurgling noise… of a mug dipped in water, or emptied of water”; this verse is its figurative use, “make void” the counsel. On one reading the word is deliberately “playing on” the jar's name, “for what is poured out comes to nothing.” The counsel of Judah's leaders will be emptied out like a jar.
    sources: [bdb, biblehub-interlinear, keil-jeremiah]
  - ref: 8
    phrase: an hissing
    kind: words
    title: A hissing
    body: |
      A “hissing” is something people whistle or hiss at in scorn: the Hebrew noun is “(object of derisive) hissing,” and the sound is the onlooker's reaction to a ruin. Lamentations shows the fulfillment: “All that pass by clap their hands at thee; they hiss and wag their head at the daughter of Jerusalem” ([[Lam. 2:15]]).

      Nephi, quoting an earlier prophet, uses the same image of those at Jerusalem: they would “become a hiss and a byword, and be hated among all nations.” He goes straight on to the promise that when they “no more turn aside their hearts against the Holy One of Israel,” “then will he remember the covenants which he made to their fathers” ([[1 Ne. 19:14–15]]).
    sources: [bdb, lds-scriptures]
  - ref: 9
    phrase: I will cause them to eat the flesh of their sons and the flesh of their daughters
    kind: scripture
    title: The curse of the siege
    body: |
      The threat of verse 9 is one of the curses of the covenant, and it came true. In the law the Lord warns what will happen in a siege if Israel breaks the covenant ([[Lev. 26:29]]; [[Deut. 28:53]]), and Jeremiah's words echo them. The Church edition's footnotes join those verses to this one and send the reader forward to [[Lam. 2:20]] and [[Lam. 4:10]], and “the grim prediction… was fulfilled during the siege of Jerusalem under Nebuchadnezzar.”
    sources: [lds-scriptures, ot-manual-23]
  - ref: 11
    phrase: that cannot be made whole again
    kind: symbol
    title: Cannot be made whole again
    body: |
      A broken jar cannot be mended, and the Lord says Jerusalem will be broken the same way. In chapter 18 a spoiled pot could be thrown “back on the wheel in a lump” and tried again; now the meaning is that “this particular generation of the people of Judah would not be restored as a people to their lands or to their relationship with the Lord.”

      The sentence falls on that generation, not on Israel forever. “Although the Jews did return from Babylonian captivity at the end of 70 years, nearly 1,900 years have elapsed since Jerusalem was destroyed and its inhabitants scattered by the Romans, and Israel is only now finally being gathered back into the covenant.” The same book that breaks the jar also holds the “prophecies of the latter-day restoration of Israel and the gospel covenant” (chapters 30–33).
    sources: [ot-seminary-guide-jer-18, ot-manual-23, bd-jeremiah]
  - ref: 13
    phrase: upon whose roofs they have burned incense unto all the host of heaven
    kind: history
    title: Altars on the roofs
    body: |
      The “host of heaven” are the heavenly bodies, worshipped on the roofs of houses. Manasseh “worshipped all the host of heaven, and served them” ([[2 Kgs. 21:3]]), and Josiah later put down the priests who burned incense “to the sun, and to the moon, and to the planets, and to all the host of heaven” ([[2 Kgs. 23:5]]). Josiah had torn down “the altars that were on the top of the upper chamber of Ahaz, which the kings of Judah had made” ([[2 Kgs. 23:12]]; see also [[Zeph. 1:5]]), but verse 13 shows it in the houses again.

      “Defiled as the place of Tophet” also looks back to Josiah, who “defiled Topheth… that no man might make his son or his daughter to pass through the fire to Molech” ([[2 Kgs. 23:10]]). Josiah had made the valley unclean to stop the sacrifices; now the Lord will make the city's houses unclean in the same way.
    sources: [lds-scriptures]
  - ref: 14
    phrase: he stood in the court of the LORD’s house
    kind: history
    title: From Tophet to the temple court
    body: |
      Jeremiah carries the word from the valley to the temple court, so that “all the people” hear what the elders saw. It cost him: the priest Pashur struck him and put him in the stocks (see the notes on [[Jer. 20:1]] and [[Jer. 20:2]]). It was one instance of the “continuous opposition and insult from the priests” that Jeremiah had to face.
    sources: [lds-scriptures, bd-jeremiah]

christ: |
  Matthew names Jeremiah when he tells what became of the price paid to betray Jesus. When Judas threw down the thirty pieces of silver, the chief priests “bought with them the potter's field, to bury strangers in,” and Matthew says this fulfilled “that which was spoken by Jeremy the prophet” ([[Matt. 27:7–10]]). The words also echo [[Zech. 11:12–13]]; the quotation “may be a combination of words from Zechariah 11:12–13 and words from the prophet Jeremiah (perhaps Jeremiah 18:2; 19:1–2),” since early Christian writers “sometimes… combined the information from various sources.” In Jeremiah a potter's jar was broken in the valley that would be filled with graves; in Matthew the price set on Jesus bought a potter's field for graves.

explore: |
  Read this chapter beside [[Jer. 18]], the soft clay on the wheel, and [[Jer. 7:30–34]], which this chapter repeats and expands. [[Jer. 20:1–6]] tells what happened to Jeremiah after verse 14. For the reign this chapter echoes, read [[2 Kgs. 21:1–16]], Manasseh's sins, and [[2 Kgs. 23:4–14]], Josiah's attempt to undo them. [[Jer. 32:35]] and [[Lam. 4]] show the charge of verse 5 and the siege of verse 9 again.

parallels:
  - ref: Morm. 4:14, 21
    note: The Church edition's footnote on verse 5 sends the reader to the Lamanites' sacrifice of women and children to idols near the end of Nephite history.

