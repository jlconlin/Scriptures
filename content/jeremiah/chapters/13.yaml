chapter: 13
title: The Linen Girdle
tagline: A priest's son wears a linen belt, buries it by the Euphrates, and digs up a ruin. The Lord says that is what Judah's pride will make of a people He meant to wear as an ornament.
when: 'Undated. The Bible Dictionary groups chapters 7–20 under Jehoiakim (608–597 B.C.); nothing in the chapter names a year or a king'

setting: |
  Jeremiah 13 is a sign-act followed by two sayings. The Church's chapter heading sums it up: “Israel and Judah will be as a rotted and decayed belt—The people are commanded to repent—Judah will be taken captive and scattered as stubble.” Acting out a message was “a common method used by ancient Hebrew prophets to drive home a message,” and the hidden linen girdle is one of Jeremiah's.

  The chapter gives no date. The Bible Dictionary puts chapters 7–20 in the reign of Jehoiakim (608–597 B.C.), the years when Jeremiah was “the leading prophet in Jerusalem, serving with Habakkuk, Zephaniah, Lehi, and others.” Lehi's account opens “in the commencement of the first year of the reign of Zedekiah,” when “many prophets” were warning the people “that they must repent, or the great city Jerusalem must be destroyed” ([[1 Ne. 1:4]]). The chapter's last line, “Woe unto thee, O Jerusalem,” is close to what Lehi reads in his vision ([[1 Ne. 1:13]]).

  The chapter has five parts: the girdle and its meaning (verses 1–11), a proverb about wine jars (12–14), a plea to hear and give glory (15–17), a word to the king and queen (18–19), and an indictment of Jerusalem (20–27). Graphic language in the last part is described here, not quoted.

thread: |
  The chapter is about **what pride does to a people made to cling to God**. The girdle is the picture. It is worn against the body, as close as clothing can be; the Lord says He made Israel and Judah cling to Him in the same way, so that they would be “for a people, and for a name, and for a praise, and for a glory” (verse 11). But a girdle buried by the Euphrates rots. Verse 9 says what is being ruined: “the pride of Judah, and the great pride of Jerusalem.”

  The rest of the chapter follows that word. The wine jars of verses 12–14 are filled and broken. Verse 15 gives the one remedy, “be not proud,” and verse 17 gives Jeremiah's sorrow “for your pride.” Alongside pride runs a second thread, hearing: the people “refuse to hear” (verse 10), “would not hear” (verse 11), and are told “Hear ye” (verse 15) and warned about those who “will not hear” (verse 17). The chapter's last question, “wilt thou not be made clean?” (verse 27), is left open.

sections:
  - range: 1-11
    heading: The linen girdle
    plain: |
      The Lord told Jeremiah to get a linen belt and wear it, without putting it in water. Then He told him to take it to the Euphrates and hide it in a crack in the rock. Jeremiah did. After many days he was told to go and dig it up, and it was ruined, good for nothing. Then the Lord explained: this is how He will ruin the pride of Judah and Jerusalem, this evil people who refuse to hear and follow other gods. As a belt clings to a man's waist, He made all Israel and Judah cling to Him, to be His people, His name, His praise, and His glory. But they would not listen.
  - range: 12-14
    heading: The wine jars
    plain: |
      “Every jar will be filled with wine.” When the people answer that of course they know that, Jeremiah is to say that the Lord will fill every inhabitant of the land, kings, priests, prophets, and all Jerusalem, with drunkenness, and will smash them against one another, fathers and sons together, without pity.
  - range: 15-17
    heading: Hear, and give glory
    plain: |
      “Listen, and do not be proud, for the Lord has spoken. Give glory to the Lord your God before He brings darkness, before your feet stumble on the dark mountains, and the light you hope for turns to deep gloom. But if you will not listen, I will weep in secret over your pride, and my eyes will run with tears, because the Lord's flock is taken captive.”
  - range: 18-19
    heading: To the king and the queen
    plain: |
      “Tell the king and the queen: humble yourselves and sit low, for your splendid crown is coming down. The cities of the south are shut up, and no one can open them. All Judah is carried into captivity.”
  - range: 20-27
    heading: Jerusalem's shame
    plain: |
      “Look up and see the enemy coming from the north. Where is the beautiful flock that was given to you? What will you say when those you cultivated as friends are set over you as head? Pain will take you like a woman in labor. If you ask why this is happening, it is for the greatness of your guilt that your skirts are lifted and you are exposed. Can an Ethiopian change his skin, or a leopard its spots? Then you, who are used to doing evil, could do good. I will scatter you like stubble before the desert wind. This is your lot from me, because you forgot me and trusted in lies. I have seen your unfaithfulness and your lewdness on the hills in the fields. Woe to you, Jerusalem! How long will you stay unclean?”

notes:
  - ref: 1
    phrase: linen girdle
    kind: words
    title: A linen waistcloth
    body: |
      The “girdle” is a waistcloth, a piece of cloth worn around the loins next to the body, and the lexicon lists this verse as one “of linen.” Linen matters: “The linen girdle represents the priestly nation of Judea, since linen was used for priestly garments (see Leviticus 16:4).” There the officiating priest is “girded with a linen girdle” as part of the “holy garments.”

      Jeremiah was “born of a priestly family in Anathoth,” and the Lord tells him to put the girdle on himself first (verse 2). So the picture begins with priestly material worn against a priest's body, not an old rag, and that is what makes its ruin in verse 7 mean something.
    sources: [bd-jeremiah, bdb, ot-manual-23, lds-scriptures]
  - ref: 4
    phrase: go to Euphrates
    kind: history
    title: To the Euphrates
    body: |
      The Euphrates is where Babylon stood: “On the banks of the Euphrates stood the great city of Babylon.” The Lord has Jeremiah carry the girdle there and bury it, and “the coming Captivity into Babylon could well be represented by the hiding of the girdle near the Euphrates.”

      The Hebrew name in verses 4–7 is simply *Perath*, without the usual “river” in front of it. A few scholars have thought some other place of that name is meant, “but… most defend Euphrates.” The distance has made readers ask whether Jeremiah really made the journey, twice. The account is read as a parable whose details “should not be pressed too far”; whether or not he walked it, the hiding by the Euphrates points to the captivity in Babylon.
    sources: [bd-euphrates, bdb, ot-manual-23]
  - ref: 7
    phrase: the girdle was marred
    kind: symbol
    title: A marred girdle
    body: |
      The ruined girdle shows that “the close relationship between God and the Jews had been strained to the breaking point.” The girdle “represents the whole house of Israel, including Judah,” and “by reason of the iniquities of the Lord's people” they would be separated from Him.

      One detail of the text deserves attention. What the Lord says He will “mar” is not the people but their pride: “After this manner will I mar the pride of Judah, and the great pride of Jerusalem” (verse 9). The ruined belt shows what that pride makes of a people the Lord had bound to Himself: it is “profitable for nothing.”
    sources: [ot-manual-23]
  - ref: 10
    phrase: imagination of their heart
    kind: words
    title: Stubbornness of heart
    body: |
      “Imagination” here means something harder than daydreaming: the Church edition's footnote gives the Hebrew as “stubbornness.” Verse 10 is then a three-part charge: they refuse to hear the Lord's words, they follow the stubbornness of their own hearts, and they go after other gods. The verse lists the three together, as one condition.
    sources: [lds-scriptures]
  - ref: 11
    phrase: for a people, and for a name, and for a praise, and for a glory
    kind: scripture
    title: A people, a name, a praise, a glory
    body: |
      The same four Hebrew words stand together in Deuteronomy, where the Lord promises “to make thee high above all nations which he hath made, in praise, and in name, and in honour; and that thou mayest be an holy people unto the Lord thy God” ([[Deut. 26:19]]). *People* (*ʿam*), *name* (*shem*), *praise* (*tehillah*), and the word the KJV renders “honour” there and “glory” here (*tifʾeret*) appear in both verses. In Jeremiah they are set beside the girdle: the people were to be the Lord's glory, as near to Him as the girdle is to the man who wears it.

      The verse ends with the sentence that explains the rot: “but they would not hear.” The Church edition links this to [[1 Ne. 1:20]], where, when Lehi's message about Jerusalem was heard, “the Jews… were angry with him; yea, even as with the prophets of old, whom they had cast out, and stoned, and slain.”
    sources: [lds-scriptures, oshb-wlc]
  - ref: 12
    phrase: Every bottle shall be filled with wine
    kind: words
    title: Jars, and what fills them
    body: |
      This is a saying that sounds too plain to need an answer, which is why the people's reply is “Do we not certainly know…?” The Hebrew word (*nebel*) can be a wineskin or a jar; the lexicon lists “skin-bottle, skin” and “jar, pitcher,” and puts this verse with the skin of wine.

      One reading takes the vessel as “an earthenware… wine jar,” standing for man: the vessels are people, and what fills them is the Lord's judgment (verse 13). This reading explains verse 14, where the Lord says He will “dash them one against another,” “as jars are shivered when knocked together.” The saying is a proverb, and the Lord gives it a meaning the hearers did not expect.
    sources: [bdb, keil-jeremiah]
  - ref: 13
    phrase: with drunkenness
    kind: scripture
    title: The cup of drunkenness
    body: |
      The drunkenness is not wine but judgment: a staggering that comes from the Lord's hand. Scripture speaks of it as a cup. Ezekiel tells Jerusalem, “Thou shalt be filled with drunkenness and sorrow, with the cup of astonishment and desolation” ([[Ezek. 23:33]], the verse the Church edition links here). In this book the Lord says, “Take the wine cup of this fury at my hand, and cause all the nations… to drink it” ([[Jer. 25:15]]), and Isaiah calls Jerusalem the city “which hast drunk at the hand of the Lord the cup of his fury” ([[Isa. 51:17]]).

      The list in verse 13 leaves no one out: the kings “that sit upon David's throne,” the priests, the prophets, and “all the inhabitants of Jerusalem.” Priests and prophets, the leaders who should have heard, are filled with the same cup as the kings.
    sources: [lds-scriptures]
  - ref: 15
    phrase: be not proud
    kind: structure
    title: 'Two refrains: pride and hearing'
    body: |
      Two words run through the chapter: pride and hearing. They explain each other. “Pride” appears in verse 9 (twice), verse 15 (“be not proud”), and verse 17 (“for your pride”). Hebrew uses three different words (*gaʾon* in verse 9, a form of *gabah* in verse 15, *gewah* in verse 17), so the repetition is the KJV's, but the sense is steady. “Hear” is one Hebrew verb, *shamaʿ*, in each place: the people “refuse to hear” (verse 10), “would not hear” (verse 11); then the Lord says “Hear ye, and give ear” (verse 15) and “if ye will not hear it” (verse 17).

      Verses 15–16 are the chapter's only offer. “Give glory to the LORD your God, before he cause darkness”: the remedy for pride is to give glory to someone else, and it has a deadline, “before.” If they refuse, the light they look for turns “into the shadow of death.”
    sources: [oshb-wlc]
  - ref: 18
    phrase: the king and to the queen
    kind: history
    title: The king and the queen
    body: |
      The “queen” is probably the queen mother, the king's mother, rather than his wife. In Kings the queen mother is “mentioned alongside of almost all the reigning kings,” so in one reading “we are not necessarily led to think of Jechoniah and his mother in especial” (Jechoniah is Jehoiachin, also called Jeconiah and Coniah).

      Still, a king and his mother did go into exile together. Jehoiachin's mother was Nehushta ([[2 Kgs. 24:8]]), and when he surrendered he “went out to the king of Babylon, he, and his mother” ([[2 Kgs. 24:12]]). Jeremiah later names “Jeconiah the king, and the queen” among those who “were departed from Jerusalem” ([[Jer. 29:2]]), and warns “Coniah” that he and “thy mother that bare thee” would be cast “into another country” ([[Jer. 22:26]]). That fits verse 18's “crown of your glory” coming down, but the chapter gives no date, so it remains a possibility, not a settled fact.
    sources: [keil-jeremiah, lds-scriptures]
  - ref: 19
    phrase: Judah shall be carried away captive all of it
    kind: scripture
    title: Judah carried away
    body: |
      The warning was carried out in stages. The Church edition links the verse to [[2 Kgs. 24:14]], where Nebuchadnezzar “carried away all Jerusalem, and all the princes, and all the mighty men of valour, even ten thousand captives… none remained, save the poorest sort of the people of the land,” and to [[2 Kgs. 25:11]], where the rest of the people were carried away.

      Jacob, whose family had come from Jerusalem, says the same of the city: “those who were at Jerusalem, from whence we came, have been slain and carried away captive” ([[2 Ne. 6:8]]). The captivity that Jeremiah says in verse 19 will come is already history to Jacob.
    sources: [lds-scriptures]
  - ref: 21
    phrase: thou hast taught them to be captains
    kind: words
    title: Friends who become rulers
    body: |
      “Captains” is a difficult word. The Hebrew (*alluph*) has two entries in the lexicon: one is “friend, intimate,” and Jeremiah 13:21 is listed there; the other is “chief” ([[1 Chr. 1:51]]). The KJV's “captains” follows the second.

      On the first sense the verse reads: you made them your close friends, and the Lord will set them over you as head. One reading takes these “friends” to be “the heathen kings, for whose favour Judah had hitherto been intriguing, the Babylonians and Egyptians.” On that reading the point is the reversal: the nations Judah courted instead of the Lord become its rulers.
    sources: [bdb, keil-jeremiah]
  - ref: 22
    phrase: thy skirts discovered
    kind: symbol
    title: Skirts discovered
    body: |
      Jerusalem is pictured as a woman publicly shamed. Verse 22 speaks of her skirts uncovered and her heels bared (the Church edition's footnote gives the Hebrew for “discovered” as “stripped off”); verse 26 repeats it. The footnote on “skirts” points to [[Hosea 2:3]], where the Lord threatens an unfaithful wife with being stripped and left like a wilderness. The imagery is the same, and verse 27 names the charge it stands for: “adulteries” and “abominations on the hills in the fields.”
    sources: [lds-scriptures]
  - ref: 23
    phrase: Can the Ethiopian change his skin, or the leopard his spots?
    kind: symbol
    title: The Ethiopian and the leopard
    body: |
      The question is about habit, not about skin or fur. The Ethiopian is a Cushite, from the land “southward” of Egypt (the Bible Dictionary lists this verse under “Ethiopia or Cush”). The proverb takes two things no one can change and says that Judah's evil has become as fixed: “then may ye also do good, that are accustomed to do evil.”

      Does the verse say people cannot change? No: Jeremiah “is not saying that men are so necessarily sinners that they are like the Ethiopian or the leopard and can do nothing about it,” but that this people's evil is so fixed that “they will do nothing about it. The cause of it is the foundation cause: they have forgotten the Lord.” The Church edition's footnote sends the reader to [[Alma 5:40]] (“whatsoever is good cometh from God, and whatsoever is evil cometh from the devil”) and [[D&C 33:4]] (the vineyard “corrupted every whit… none which doeth good save it be a few”).
    sources: [bd-ethiopia, ot-manual-23, lds-scriptures]
  - ref: 24
    phrase: scatter them as the stubble
    kind: scripture
    title: Scattered like stubble
    body: |
      The verse's image is stubble that “passeth away by the wind of the wilderness”: light, and carried wherever the wind goes. The Church edition links the verse to two Book of Mormon passages on the scattering of Israel. Nephi reports that his father Lehi taught that Israel “should be compared like unto an olive tree, whose branches should be broken off and should be scattered upon all the face of the earth” ([[1 Ne. 10:12]]), and Nephi himself writes that “the house of Israel, sooner or later, will be scattered upon all the face of the earth, and also among all nations” ([[1 Ne. 22:3]]).

      Jeremiah's verse is about the scattering of his own day. The Book of Mormon prophets speak of one that reaches “all the face of the earth.”
    sources: [lds-scriptures]
  - ref: 27
    phrase: Woe unto thee, O Jerusalem!
    kind: scripture
    title: Woe unto thee, O Jerusalem
    body: |
      The chapter's last cry meets Lehi's vision. The Church edition links verse 27 to [[1 Ne. 1:13]], where Lehi, in his vision, reads: “Wo, wo, unto Jerusalem, for I have seen thine abominations!” In Jeremiah the Lord says, “I have seen thine adulteries… and thine abominations.” Whether Lehi read Jeremiah's words is not stated; the cry is the same and the city is the same.

      The Book of Mormon also shows how such warnings were received. Laman and Lemuel did not believe “that Jerusalem, that great city, could be destroyed according to the words of the prophets” ([[1 Ne. 2:13]]). The other footnote reference is to [[2 Kgs. 24:19]], where Zedekiah, the king of Lehi's day, “did that which was evil in the sight of the Lord, according to all that Jehoiakim had done.” The verse ends with a question, not a verdict: “wilt thou not be made clean? when shall it once be?”
    sources: [lds-scriptures]

christ: |
  The Lord who speaks here is Jehovah, “the premortal Jesus Christ,” the One who says, “I have caused to cleave unto me the whole house of Israel.” The picture of clinging is also an invitation. Jacob, speaking to his people, asks them to “repent, and come with full purpose of heart, and cleave unto God as he cleaveth unto you. And while his arm of mercy is extended towards you in the light of the day, harden not your hearts” ([[Jacob 6:5]]). The same hope is in Jeremiah 13: the Lord's “before he cause darkness” (verse 16) gives a time in which glory can still be given, and the chapter ends with the question, “wilt thou not be made clean?”

explore: |
  - [[Jer. 19:1–13]], another sign-act with a “bottle,” this time broken before the elders.
  - [[Jer. 25:15–29]], where the cup of the Lord’s fury goes round the nations.
  - [[1 Ne. 1]], Lehi’s vision of Jerusalem and its abominations, in the same years.
  - [[Jer. 29:2]] and [[Jer. 22:24–30]], on the king and queen mother who went into exile.

parallels:
  - ref: 1 Ne. 1:13
    note: Lehi reads “Wo, wo, unto Jerusalem, for I have seen thine abominations!” The Church edition links Jeremiah 13:27 to this verse.
  - ref: 1 Ne. 10:12
    note: Lehi on Israel scattered “upon all the face of the earth,” linked from Jeremiah 13:24.

sources: [bd-jeremiah, ot-manual-23, bd-euphrates, bd-ethiopia, bd-jehovah, bdb, keil-jeremiah, lds-scriptures, oshb-wlc, sc-knowhy-575]
