chapter: 28
title: The Yokes of Wood and of Iron
tagline: A prophet from Gibeon promises in the temple that Babylon's yoke will be broken within two years, breaks Jeremiah's wooden yoke to prove it, and learns that the Lord has made it iron.
when: 'The fourth year of Zedekiah, in the fifth month (verse 1); Zedekiah reigned 597–586 B.C. by the Bible Dictionary. Hananiah dies in the seventh month of the same year.'

setting: |
  Chapter 28 is the second half of one story. In chapter 27 the Lord told Jeremiah to make bonds and yokes, put them on his own neck, and send word to the kings of the neighboring countries that they must serve Nebuchadnezzar. Chapter 28 opens “the same year,” in the temple, before the priests and the people, with another man who says he is a prophet and who says the opposite.

  The setting is Zedekiah's reign. Nebuchadnezzar had already taken Jehoiachin, the king's officers, and the temple treasures to Babylon, and Zedekiah, the king he left on the throne, “began to look for ways to break the Babylonian yoke.” The Bible Dictionary groups chapters 26–29 together as the chapters “on the false prophets,” and the chapter heading in the Church's edition gives this one in a sentence: “Hananiah prophesies falsely that the Babylonian yoke will be broken.”

  The story is told in a single scene with three beats: Hananiah's promise (verses 1–4), the exchange of replies that sets the test (verses 5–9), and the breaking of the yoke, with the Lord's answer through Jeremiah (verses 10–17). Verses 5–9 are the hinge. Jeremiah neither confirms nor denies Hananiah's message on the spot; he says what will settle it.

thread: |
  Jeremiah 28 is about **how a people could tell which of two prophets was sent, when both spoke in the Lord's name and one said what they wanted to hear.**

  The two men use the same title for God, stand in the same temple, and make claims about the same event. They differ in what they promise: Hananiah, a quick return and peace; Jeremiah, a long captivity and, afterward, a return. The people had already been told Jeremiah's side ([[Jer. 27:16–17]]), and the other was the welcome one.

  The chapter gives two answers to how one could tell. One is the test of fulfilment, which Jeremiah states in verse 9 and which was written into the law ([[Deut. 18:20–22]]). The other is that a prophet must be sent: “The LORD hath not sent thee” (verse 15). The two men also act differently when the sign is staged: Hananiah breaks the yoke, and Jeremiah walks away until the Lord speaks. The chapter ends with the test applied: within the year Hananiah is dead, and the yoke he said was broken is made of iron.

sections:
  - range: 1-4
    heading: Hananiah's promise
    plain: |
      In the same year, the fourth of Zedekiah's reign, in the fifth month, Hananiah son of Azur, a prophet from Gibeon, spoke to Jeremiah in the Lord's house before the priests and all the people. He said: “The Lord of hosts, the God of Israel, says, ‘I have broken the yoke of the king of Babylon. Within two years I will bring back to this place all the vessels of the Lord's house that Nebuchadnezzar took to Babylon. I will also bring back Jeconiah son of Jehoiakim, king of Judah, and all the captives of Judah who went to Babylon, for I will break the yoke of the king of Babylon.’”
  - range: 5-9
    heading: Jeremiah's answer
    plain: |
      Jeremiah answered Hananiah before the priests and all the people: “Amen. May the Lord do so, and bring back the vessels and all the captives from Babylon. But hear this word. The prophets before you and me, from long ago, prophesied war, disaster, and plague against many countries and great kingdoms. The prophet who prophesies peace will be known as truly sent by the Lord when his word comes true.”
  - range: 10-11
    heading: The yoke is broken
    plain: |
      Hananiah took the yoke from Jeremiah's neck and broke it. He said before all the people, “The Lord says, ‘In the same way I will break the yoke of Nebuchadnezzar king of Babylon from the neck of all nations within two years.’” And Jeremiah went on his way.
  - range: 12-17
    heading: Wood, iron, and death
    plain: |
      After Hananiah had broken the yoke, the word of the Lord came to Jeremiah: “Go and tell Hananiah that the Lord says, ‘You have broken wooden yokes, but in their place you will make yokes of iron. I have put an iron yoke on the neck of all these nations to serve Nebuchadnezzar, and they will serve him. I have given him even the wild animals.’” Then Jeremiah said, “Listen, Hananiah. The Lord has not sent you, and you have made this people trust a lie. So the Lord says, ‘I will send you off the face of the earth. This year you will die, because you have preached rebellion against the Lord.’” Hananiah died that year, in the seventh month.

notes:
  - ref: 1
    phrase: Hananiah the son of Azur the prophet, which was of Gibeon
    kind: history
    title: A prophet from Gibeon
    body: |
      Hananiah is a prophet not otherwise known, from a town in Benjamin a few miles north of Jerusalem. Gibeon sat “on one of the hills of Benjamin, about five miles north of Jerusalem,” and it is listed among the cities of Benjamin given to the Levites ([[Josh. 21:17]]). One reading draws the conclusion that Hananiah was therefore “possibly… himself a priest,” which would explain why he could speak in the temple before the priests and all the people; the verse itself does not say so.

      What the text does say is how carefully he borrows Jeremiah's voice. His opening, “Thus speaketh the LORD of hosts, the God of Israel,” is the divine title “so often used by Jeremiah.” To hear him was not to hear an outsider. Nothing in the first four verses would tell a listener that the man was not sent.
    sources: [bd-gibeon, lds-scriptures, keil-jeremiah]
  - ref: 2
    phrase: I have broken the yoke of the king of Babylon
    kind: symbol
    title: The yoke
    body: |
      In Jeremiah the yoke stands for submission to Babylon: “A yoke is something put on the neck for the purpose of carrying burdens. The yoke symbolized captivity or slavery.” In the previous chapter the Lord told Jeremiah to “make thee bonds and yokes, and put them upon thy neck,” and to send word to the kings of Edom, Moab, Ammon, Tyre, and Zidon ([[Jer. 27:2–3]]). Ambassadors from several of these countries “had come to Zedekiah with the proposal that unitedly they could defeat Babylon,” and Jeremiah wore the yoke to show that submission was the Lord's will.

      The message of the yoke is that Nebuchadnezzar rules by the Lord's gift: “now have I given all these lands into the hand of Nebuchadnezzar the king of Babylon, my servant” ([[Jer. 27:6]]). To Zedekiah himself Jeremiah said, “Bring your necks under the yoke of the king of Babylon, and serve him and his people, and live” ([[Jer. 27:12]]). So when Hananiah says that the Lord “has broken” the yoke, he is not offering a pleasant detail. He is reversing what the Lord had just said.
    sources: [ot-seminary-jer-27-28, lds-scriptures, ot-manual-24]
  - ref: 3
    phrase: Within two full years
    kind: history
    title: Two years against seventy
    body: |
      Hananiah promises a return of the temple vessels and the exiles within two years, a short and checkable date, where Jeremiah had spoken of seventy. On one reading, the Hebrew behind “two full years” (literally “two years in days”) makes the date “as definite as possible.”

      What he promises is what the people had lost. Nebuchadnezzar had earlier “cut in pieces all the vessels of gold which Solomon king of Israel had made in the temple,” and carried Jehoiachin to Babylon with the king's mother, wives, and officers ([[2 Kgs. 24:13–15]]). Jeremiah calls the same king Jeconiah: “Jeconiah the son of Jehoiakim king of Judah” ([[Jer. 27:20]]), and Hananiah uses that name in verse 4.

      Jeremiah had said that “these nations shall serve the king of Babylon seventy years” ([[Jer. 25:11]]), and his letter to the exiles repeats it: “after seventy years be accomplished at Babylon I will visit you… in causing you to return to this place” ([[Jer. 29:10]]). He had also said that the vessels still in Jerusalem would go to Babylon “until the day that I visit them… then will I bring them up, and restore them to this place” ([[Jer. 27:22]]). So the dispute is not about whether the exiles come home. It is about when, and whether anything must happen first.
    sources: [keil-jeremiah, lds-scriptures]
  - ref: 4
    phrase: for I will break the yoke of the king of Babylon
    kind: scripture
    title: The yoke the Lord will break
    body: |
      The Lord does promise to break a yoke, but in a later day and with a stated purpose. In the chapters on “the latter-day restoration of Israel and the gospel covenant,” He says: “I will break his yoke from off thy neck, and will burst thy bonds… But they shall serve the LORD their God, and David their king, whom I will raise up unto them” ([[Jer. 30:8–9]]). Hananiah's promise has the first half of that sentence and not the second.

      The same image of bands on the neck appears in [[Isa. 52:2]], and Latter-day Saint scripture explains those bands in [[D&C 113:10]]: they “are the curses of God upon her, or the remnants of Israel in their scattered condition among the Gentiles.”
    sources: [lds-scriptures, bd-jeremiah, ot-manual-24]
  - ref: 6
    phrase: 'Amen: the LORD do so'
    kind: words
    title: What Jeremiah means by “Amen”
    body: |
      Jeremiah's “Amen” is not agreement with Hananiah, and verse 7 qualifies it at once with “Nevertheless.” His reply “did not mean he approved,” and its tone can be read two ways: as “sarcastic, a challenge to see whose prophecies would be fulfilled,” or as words that “might have been said ironically or as an expression of desire that the people would repent and make such blessings possible.”

      The text allows either: Jeremiah says he would like Hananiah to be right (“the LORD perform thy words”) and then, in verses 8–9, tells him what would show whether he is.
    sources: [ot-manual-24, ot-seminary-teacher-jer-20-29]
  - ref: 9
    phrase: The prophet which prophesieth of peace, when the word of the prophet shall come to pass
    kind: scripture
    title: The test of a prophet
    body: |
      Jeremiah's test is the one the law gave: a prophet's word must come to pass. “When a prophet speaketh in the name of the LORD, if the thing follow not, nor come to pass, that is the thing which the LORD hath not spoken” ([[Deut. 18:22]]). Jeremiah's reply comes to this: “the prophet whose words come to pass is the one chosen by the Lord.” Time will show who is right.

      Verse 8 gives his reason for putting the burden on the prophet of peace. The prophets “before me and before thee of old prophesied both against many countries, and against great kingdoms, of war, and of evil, and of pestilence.” On one reading, a prophet who “predicts nothing but peace and safety” against all those earlier witnesses can make good his claim only by seeing his prediction fulfilled.
    sources: [lds-scriptures, ot-manual-24, ot-seminary-jer-27-28, keil-jeremiah]
  - ref: 10
    phrase: took the yoke from off the prophet Jeremiah’s neck, and brake it
    kind: symbol
    title: A sign answered with a sign
    body: |
      Hananiah answers Jeremiah's acted prophecy with one of his own. “To dramatize his prophecy, Hananiah broke the yokes off Jeremiah's shoulders, predicting that God would do the same to Judah's Babylonian yoke.” He is repeating Jeremiah's own method: Jeremiah had worn the yoke as a sign, and Hananiah breaks it as a counter-sign.

      The two men then act differently. Hananiah does not wait for the outcome Jeremiah had named; he breaks the yoke and announces the Lord's word himself (verse 11). The text says only that Jeremiah “went his way,” and the word of the Lord came to him afterward (verse 12).
    sources: [ot-manual-24]
  - ref: 11
    phrase: in the presence of all the people
    kind: scripture
    title: Why the people believed Hananiah
    body: |
      The people had reasons to prefer Hananiah, and scripture says what they were. In Jeremiah's day the prophets told them “Ye shall not see the sword, neither shall ye have famine; but I will give you assured peace in this place,” and the Lord answers that He “sent them not” ([[Jer. 14:13–15]]). They say “Ye shall have peace” to people who walk “after the imagination of his own heart” ([[Jer. 23:17]]). The Lord says of them, “I have not sent these prophets, yet they ran” ([[Jer. 23:21]]).

      Samuel the Lamanite names the pattern in Book of Mormon times. People who claim they would have honored the prophets of old are angry at one who “testifieth of your sins and iniquities,” while to a man who says “Do this, and there is no iniquity… ye will receive him, and say that he is a prophet… because he speaketh flattering words unto you, and he saith that all is well” ([[Hel. 13:26–28]]). Hananiah's message was welcome news about Babylon; Jeremiah's was not.
    sources: [lds-scriptures]
  - ref: 13
    phrase: Thou hast broken the yokes of wood; but thou shalt make for them yokes of iron
    kind: symbol
    title: Wood and iron
    body: |
      The yoke Hananiah broke was only the sign, and the thing it stood for was not broken. The Lord's answer was “simple and powerful: the yokes of wood would become yokes of iron,” and He has laid the iron yoke on “all these nations.”

      Verse 14 ends “and I have given him the beasts of the field also,” which is the language of the Lord's earlier word about Nebuchadnezzar: “the beasts of the field have I given him also to serve him” ([[Jer. 27:6]]). The Lord does not change the message in chapter 28; He repeats it, in a harder metal.
    sources: [ot-manual-24, lds-scriptures]
  - ref: 15
    phrase: The LORD hath not sent thee
    kind: prophets
    title: A prophet has to be sent
    body: |
      The charge against Hananiah is not that he was a poor speaker or a bad guesser. It is that he was not sent. The Lord says the same of the prophets among the exiles, in Jeremiah's letter to them: “they prophesy falsely unto you in my name: I have not sent them” ([[Jer. 29:9]]). The same principle stands in the fifth Article of Faith: “We believe that a man must be called of God, by prophecy, and by the laying on of hands by those who are in authority” ([[A of F 1:5]]); and the Lord said that no one is to preach “except he be ordained by some one who has authority, and it is known to the church that he has authority” ([[D&C 42:11]]).

      Joseph Smith also taught that a false prophet does not look false: “False prophets always arise to oppose the true prophets and they will prophesy so very near the truth that they will deceive almost the very chosen ones.” Hananiah fits that description. His title for God and his place in the temple were Jeremiah's, and the future he described, the exiles home, was one Jeremiah himself said he wished for. What he lacked was the Lord's commission, and what he said instead led the people to trust “a lie.”
    sources: [ot-seminary-teacher-jer-20-29, lds-scriptures]
  - ref: 16
    phrase: I will cast thee from off the face of the earth
    kind: words
    title: Sent away, and a charge from the law
    body: |
      The verse is built on a play on the word “sent.” In Hebrew, “The LORD hath not sent thee” (verse 15) and “I will cast thee from off the face of the earth” use the same verb (*shalach*, to send): the Lord says that He did not send Hananiah, and that He will send him away. The verb is, on one reading, “chosen for the sake of the play,” and the Hebrew text shows the repetition.

      “Taught rebellion against the LORD” (Hebrew *sarah dibbarta*, “thou hast spoken rebellion”) uses the same two words (*dibber sarah*) that the law used against a prophet who tries to turn Israel away from God: “that prophet… shall be put to death; because he hath spoken to turn you away from the LORD your God” ([[Deut. 13:5]]). Jeremiah's words “recall” that law and apply its penalty. The lexicon defines *sarah* as “rebellion, defection, apostasy.”
    sources: [oshb-wlc, keil-jeremiah, lds-scriptures, bdb]
  - ref: 17
    phrase: So Hananiah the prophet died the same year in the seventh month
    kind: history
    title: Died in the seventh month
    body: |
      Hananiah died within two months of the confrontation, in the seventh month of the year in which he had spoken in the fifth ([[Jer. 28:1]]), long before his “two full years” could expire. His death “should have convinced Zedekiah and the people which of these two men was the true prophet, but they were too hardened to respond.”

      The verse records only the death, with no comment. The people who had heard both men saw the prophecy fulfilled within the year, and Zedekiah went on to look “for ways to break the Babylonian yoke” and, “ignoring the repeated warnings of Jeremiah, he rebelled.”
    sources: [ot-manual-24]

christ: |
  The chapter sets two yokes against each other, and Jesus names a third. Hananiah says the yoke of Babylon is broken, and the Lord answers with iron. In the later prophecies of Jeremiah the Lord promises Himself to break the yoke, when His people will “serve the LORD their God, and David their king” ([[Jer. 30:8–9]]), a king the chapter heading in the Church's edition identifies as “the Messiah.” Jesus invites: “Take my yoke upon you, and learn of me; for I am meek and lowly in heart: and ye shall find rest unto your souls. For my yoke is easy, and my burden is light” ([[Matt. 11:29–30]]). Hananiah's message was welcome and false; Jesus' invitation is to a different yoke, which He calls easy.

explore: |
  - **How to know who is sent.** Read [[Deut. 18:20–22]], [[D&C 42:11–12]], [[D&C 46:7]], and [[A of F 1:5]], the passages the seminary study guide pairs with Jeremiah 27–28.
  - **Prophets of peace.** Read [[Jer. 14:13–15]], [[Jer. 23:16–22]], and [[Hel. 13:25–28]].
  - **The yoke of Babylon.** Read [[Jer. 27]], [[Jer. 29:1–10]], and [[Jer. 30:8–9]].

