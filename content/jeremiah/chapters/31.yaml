chapter: 31
title: A New Covenant
tagline: Judgment is not the last word. The Lord who scattered Israel loves her, will gather her, and will write His law on her heart.
when: 'Under Zedekiah (597–586 B.C.), according to the Bible Dictionary; the chapter gives no date of its own'

setting: |
  Jeremiah 31 sits in the middle of chapters 30–33, “prophecies of the latter-day restoration of Israel and the gospel covenant” that belong among the prophecies under Zedekiah (597–586 B.C.). They foretell “the restoration of Israel and Judah in the last days and … the Lord’s making a new and everlasting covenant with them.”

  The chapter itself carries no date. Chapter 32, which follows, is dated to “the tenth year of Zedekiah king of Judah, which was the eighteenth year of Nebuchadrezzar,” while Babylon besieged Jerusalem ([[Jer. 32:1–2]]). Chapters 30–31 may come from the same period or somewhat earlier; there is no agreement on when they were composed. Jeremiah is told to write these words “in a book,” for “the days come” when the Lord will bring His people back ([[Jer. 30:2–3]]).

  The prophet whose book is mostly warning is told to write down a book of hope. Two New Testament writers rely on this chapter: Matthew quotes verse 15 ([[Matt. 2:17–18]]), and the letter to the Hebrews quotes verses 31–34 at length ([[Heb. 8:8–12]]; [[Heb. 10:16–17]]).

thread: |
  Jeremiah 31 answers one question: **after the covenant has been broken and the people scattered, what is left to build on?** The chapter’s answer is God Himself, and it moves in four steps.

  First, His love comes before their repentance: “I have loved thee with an everlasting love” (verse 3). On that ground He promises to rebuild and gather, and the gathering is the Lord’s own work, leading a weeping people by waters, with a straight path (verses 4–14). Second, the grief is real, and the chapter does not rush past it. Rachel weeps and will not be comforted, yet the Lord tells her to stop weeping, for her children will return (verses 15–17). Ephraim confesses and is answered with a parent’s pity (verses 18–20).

  Third, the chapter turns from the people as a whole to each person. The old proverb that children bear their fathers’ sins gives way to “every one shall die for his own iniquity” (verses 29–30), and then comes the center of the chapter and its best-known promise: a new covenant, not like Sinai, with the law written “in their inward parts” (verses 31–34). Fourth, that covenant is anchored in something fixed: sun, moon, stars, and a city to be rebuilt and holy “for ever” (verses 35–40).

sections:
  - range: 1-6
    heading: An everlasting love and a rebuilt Israel
    plain: |
      At that time, says the Lord, I will be the God of all the families of Israel, and they will be my people. Those who survived the sword found favor in the wilderness when I came to give Israel rest. The Lord appeared to me and said, “I have loved you with an everlasting love, and so I have drawn you with kindness. I will build you again, virgin Israel. You will take up your tambourines and join the dances. You will plant vineyards on the hills of Samaria and enjoy their fruit. A day is coming when watchmen on Ephraim’s hills will call, ‘Come, let us go up to Zion, to the Lord our God.’”
  - range: 7-14
    heading: Gathered from the north
    plain: |
      Sing for joy for Jacob. Shout over the foremost of the nations. Praise and say, “Lord, save your people, the remnant of Israel.” I will bring them from the north and gather them from the ends of the earth, among them the blind and the lame, mothers expecting and in labor. A great company will return. They will come weeping, and I will lead them with prayers beside streams of water on a level path where they will not stumble, for I am a father to Israel and Ephraim is my firstborn. Nations, hear and tell the far coasts: the One who scattered Israel will gather and watch over him as a shepherd does his flock. He has redeemed Jacob from one stronger than he. They will come and sing on the heights of Zion, glad over the grain, wine, oil, and flocks. Their life will be like a watered garden, and they will sorrow no more. Young women will dance, young and old together. I will turn their mourning to gladness and satisfy the priests and my people with good things.
  - range: 15-22
    heading: Rachel’s tears and Ephraim’s return
    plain: |
      A voice is heard in Ramah, bitter weeping: Rachel is weeping for her children and refuses to be comforted, because they are gone. But the Lord says, “Hold back your tears. Your work will be rewarded, and your children will return from the enemy’s land. There is hope for your future.” I have heard Ephraim say, “You disciplined me, and I was disciplined like an untrained calf. Bring me back, and I will return, for you are the Lord my God. After I was turned, I repented. After I was taught, I struck my thigh. I was ashamed, for I carried the disgrace of my youth.” Is Ephraim my dear son, my delightful child? Though I often speak against him, I still remember him. My heart aches for him, and I will surely have mercy on him. Set up road markers. Fix your mind on the road by which you left, and come back, virgin Israel, to your cities. How long will you wander, faithless daughter? The Lord has created something new in the land: a woman will surround a man.
  - range: 23-26
    heading: Judah restored, and a sweet sleep
    plain: |
      When I restore their fortunes, they will again say in Judah and its towns, “The Lord bless you, home of righteousness, holy mountain.” Farmers and shepherds will live there together. I have refreshed the weary and satisfied everyone who languished. At this I woke and looked around, and my sleep had been sweet.
  - range: 27-30
    heading: Every one for his own sin
    plain: |
      The days are coming, says the Lord, when I will sow the house of Israel and the house of Judah with people and with animals. As I watched over them to uproot and tear down, to destroy and bring harm, so I will watch over them to build and plant. In those days they will no longer say, “The fathers ate sour grapes, and the children’s teeth are set on edge.” Each will die for his own sin; whoever eats sour grapes will have his own teeth set on edge.
  - range: 31-34
    heading: The new covenant
    plain: |
      The days are coming, says the Lord, when I will make a new covenant with the house of Israel and the house of Judah. It will not be like the covenant I made with their ancestors when I took them by the hand to bring them out of Egypt, a covenant they broke, though I was a husband to them. This is the covenant I will make with Israel after those days: I will put my law within them and write it on their hearts. I will be their God, and they will be my people. No one will teach neighbor or brother, saying, “Know the Lord,” for all of them, from least to greatest, will know me. I will forgive their wrongdoing and remember their sin no more.
  - range: 35-40
    heading: As sure as sun and stars
    plain: |
      The Lord, who gives the sun by day and sets the moon and stars in order by night, who stirs the sea so its waves roar (the Lord of hosts is His name), says: If those fixed orders ever disappear from before me, then the offspring of Israel will cease to be a nation before me. If the heavens above can be measured and the foundations of the earth below explored, then I will reject all Israel for all they have done. The days are coming when the city will be rebuilt for the Lord, from the Tower of Hananeel to the Corner Gate. The measuring line will go on to Gareb hill and turn to Goath. The whole valley of corpses and ashes, and all the fields to the Kidron Valley, as far as the corner of the Horse Gate on the east, will be holy to the Lord. It will never again be uprooted or torn down.

notes:
  - ref: 3
    phrase: The LORD hath appeared of old unto me
    kind: words
    title: From afar, or of old
    body: |
      The Hebrew word the KJV renders “of old,” *mērāḥôq*, can be taken of space, “from a distance,” or of time, “long ago.” The KJV translators took it in time; the interlinear glosses it “From afar.” The verse does not say who the “me” is. Taken either way, the verse puts the love first: the drawing (“with lovingkindness have I drawn thee”) follows from a love that is “everlasting.”
    sources: [biblehub-interlinear, bdb]
  - ref: 6
    phrase: the watchmen upon the mount Ephraim
    kind: prophets
    title: Watchmen on Ephraim’s mountain
    body: |
      The tribe that led the break with Judah now calls its people to go up to Zion. Ephraim’s “jealousy of Judah” did much to bring about “the separation of the two kingdoms,” so watchmen on Ephraim’s hills crying “let us go up to Zion unto the LORD our God” mark the end of that division.

      In a latter-day reading, “the watchmen mentioned in verse 6 are the righteous prophets of the latter days,” who will call all people to worship the Lord. The same reading joins “the north country” of verse 8 to [[D&C 110:11]] and [[D&C 133:26]]: “they who are in the north countries shall come in remembrance before the Lord; and their prophets shall hear his voice.”
    sources: [bd-ephraim, ot-manual-25, lds-scriptures]
  - ref: 9
    phrase: Ephraim is my firstborn
    kind: scripture
    title: Ephraim, my firstborn
    body: |
      Ephraim is called the firstborn because the birthright passed to him: “The Lord declares that Ephraim has the birthright as the firstborn.” Israel as a whole was already the Lord’s firstborn at the exodus: “Israel is my son, even my firstborn” ([[Ex. 4:22]]). Within the family, Reuben “was the firstborn,” but his birthright “was given unto the sons of Joseph” ([[1 Chr. 5:1]]). And Jacob, blessing Joseph’s sons, “set Ephraim before Manasseh” ([[Gen. 48:20]]). Verse 9 says this at the point where the northern tribes are being brought home. In the Doctrine and Covenants, the gathering from the north brings “rich treasures unto the children of Ephraim,” and “the richer blessing upon the head of Ephraim and his fellows” ([[D&C 133:30–34]]).
    sources: [lds-scriptures]
  - ref: 15
    phrase: Rahel weeping for her children refused to be comforted for her children, because they were not
    kind: history
    title: Rachel weeping at Ramah
    body: |
      Rachel (“Rahel” in this edition), the mother of Joseph ([[Gen. 30:22–24]]) and so the ancestress of Ephraim, weeps for her children, who “had been taken captive.” She was buried “in the way to Ephrath, which is Beth-lehem” ([[Gen. 35:19]]), not at Ramah, so the verse is not about her tomb. Her voice is heard at Ramah, “the most loftily situated border-town of the two kingdoms, whence the wailing that had arisen sounded far and near, and could be heard in Judah.” She weeps as the mother of the people.

      The Lord’s answer comes at once: stop weeping, “for thy work shall be rewarded… and they shall come again from the land of the enemy” (verse 16), and “there is hope in thine end” (verse 17). Matthew sets the verse beside Herod’s killing of the Bethlehem children and says it “was fulfilled” ([[Matt. 2:17–18]]). One reading takes the exile as “a type of the massacre of the infants at Bethlehem,” so that Jeremiah’s words “received a new fulfilment through that act of Herod” rather than predicting it directly.
    sources: [lds-scriptures, ot-manual-25, keil-jeremiah]
  - ref: 20
    phrase: my bowels are troubled for him
    kind: words
    title: Ephraim answered with pity
    body: |
      The Lord answers Ephraim’s confession with compassion, not reproach. Ephraim says he was chastised “as a bullock unaccustomed to the yoke,” and asks to be turned (verses 18–19). The Lord’s reply asks, “Is Ephraim my dear son?” and answers: though He has spoken against him, “I do earnestly remember him still.” “Bowels” translates *mēʿay*, “my inward parts,” used figuratively as the seat of the emotions; here it expresses God’s compassion, set beside “I will surely have mercy upon him.” We would say, “my heart aches for him.” The pattern recalls verse 3: love first, then turning.
    sources: [bdb]
  - ref: 22
    phrase: A woman shall compass a man
    kind: symbol
    title: A woman shall compass a man
    body: |
      The meaning of this line is not settled. The Lord calls it “a new thing” He has created, and the verb, *sābab*, means to turn about, go around, or surround; in poetry, to encompass, often with protection. Two readings are offered for this verse. Most have taken it to mean that the woman “shall protect” the man. The other plays on the “backsliding daughter” of the same verse: Israel, “instead of holding aloof,” will “in the new future” the Lord creates “with affection press round her divine husband.”

      A version of the second reading takes the verb “to encompass with love and care,” so that “the woman, the weaker nature that needs help, will lovingly and solicitously surround the man, the stronger,” and sees in the new thing “a new relation of Israel to the Lord, a reference to a new covenant which the Lord, ver. 31ff., will conclude with His people.” The verse itself does not mention the covenant, so this is one reading, not a settled one.
    sources: [bdb, ot-manual-25, keil-jeremiah]
  - ref: 26
    phrase: Upon this I awaked, and beheld; and my sleep was sweet unto me
    kind: history
    title: Who is speaking in verse 26
    body: |
      The “I” who wakes in verse 26 is probably the prophet, though the text does not say. After the Lord’s words in verses 23–25, someone says, “I awaked… and my sleep was sweet unto me.” It is unlikely to be God, since “nowhere in Scripture is sleep attributed to God.” One reading therefore takes the verse “as a remark by the prophet regarding his feelings when he received this revelation”: Jeremiah received these promises in something like a dream and woke glad. But “Jeremiah nowhere says God had revealed Himself to him in a dream,” so this is a reading, not something the text states.
    sources: [keil-jeremiah]
  - ref: 29
    phrase: The fathers have eaten a sour grape, and the children’s teeth are set on edge
    kind: scripture
    title: The sour grape
    body: |
      Verse 29 retires a proverb about children suffering for their fathers’ sins, and verse 30 puts each person’s own sin in its place. The proverb “conveyed the idea that children are affected by what their parents are and do”; those who used it overlooked “the qualifying statement” in [[Ex. 20:5–6]]. Ezekiel quotes it and denies it in nearly the same terms: “The soul that sinneth, it shall die. The son shall not bear the iniquity of the father” ([[Ezek. 18:2–4]]; [[Ezek. 18:20]]). Children are not punished for their parents’ sins in a final sense, yet “children may suffer the consequences of parental sins.” So the verse does not deny that families affect each other; it says that each person answers for his own sin. The covenant that follows likewise reaches each person: “they shall all know me, from the least of them unto the greatest of them” (verse 34).
    sources: [lds-scriptures, ot-manual-25]
  - ref: 31
    phrase: I will make a new covenant
    kind: prophets
    title: A new covenant
    body: |
      The new covenant is written within the people, where the old one, made at the exodus, was broken by them (verses 32–33). Hebrews quotes the passage and calls Christ “the mediator of a better covenant, which was established upon better promises” ([[Heb. 8:6–12]]), and quotes verses 33–34 again ([[Heb. 10:16–17]]).

      Joseph Smith taught that “this covenant has never been established with the house of Israel, nor with the house of Judah, for it requires two parties to make a covenant,” and that its requirements are repentance, baptism for the remission of sins, and the laying on of hands for the Holy Spirit. The Doctrine and Covenants calls baptism “a new and an everlasting covenant, even that which was from the beginning” ([[D&C 22:1]]) and speaks of “mine everlasting covenant, even the fulness of my gospel” ([[D&C 66:2]]). [The Covenant Written in the Heart](/jeremiah/themes/new-covenant/#new-covenant) follows the covenant through the book.
    sources: [lds-scriptures, ot-manual-25]
  - ref: 32
    phrase: although I was an husband unto them
    kind: words
    title: Husband, and what Hebrews does with it
    body: |
      Hebrews ends this verse differently from Jeremiah, and its wording matches the Septuagint, the ancient Greek translation. In the Hebrew the Lord says He “was an husband” to them: the verb *bāʿal*, with the preposition it takes here, means “be lord (husband) over.” Israel broke the covenant even though the Lord had bound Himself to them as a husband. Hebrews has “because they continued not in my covenant, and I regarded them not” ([[Heb. 8:9]]). The Septuagint (38:32 in its numbering), in Brenton’s English, reads: “for they abode not in my covenant, and I disregarded them.” The difference is in the wording of one clause, not in the promise of the new covenant.
    sources: [bdb, lds-scriptures, lxx-rahlfs]
  - ref: 33
    phrase: I will put my law in their inward parts, and write it in their hearts
    kind: words
    title: Written in the heart
    body: |
      The new covenant moves the law from outside the people to inside them. “Inward parts” is *qereb*, the inward part of a person as the seat of thought and emotion, and here it stands parallel to “in their hearts.” Paul uses the same contrast between stone and heart: an epistle “written not with ink, but with the Spirit of the living God; not in tables of stone, but in fleshy tables of the heart” ([[2 Cor. 3:3]]). Ezekiel promises the same gift in other words: “A new heart also will I give you, and a new spirit will I put within you” ([[Ezek. 36:26]]). It is still “my law.” What changes is where it is written.
    sources: [bdb, lds-scriptures]
  - ref: 34
    phrase: they shall teach no more every man his neighbour
    kind: prophets
    title: Every man his own teacher
    body: |
      Verse 34 does not say that teaching will end. It says that no one will need to teach his neighbor “Know the LORD,” because “they shall all know me, from the least of them unto the greatest of them.” President Joseph Fielding Smith read it as a day when “every man shall be his own teacher, that is, he will know because of righteous living what to do.” The ground of that knowledge is the last line of the verse: “I will forgive their iniquity, and I will remember their sin no more.”
    sources: [ot-manual-25]
  - ref: 36
    phrase: If those ordinances depart from before me
    kind: words
    title: If the ordinances depart
    body: |
      Israel will last as long as the sun, moon, and stars. In the text, the “ordinances” are the fixed orders named in verse 35, “the ordinances of the moon and of the stars,” and verses 36–37 say that Israel will no more cease to be a nation than they will. A latter-day reading takes the word in its gospel sense: “if those saving and exalting priesthood ordinances cease to exist, then Israel also will cease to exist—forever.” That applies “ordinances” in a different sense from the verse’s own.
    sources: [ot-manual-25]
  - ref: 38
    phrase: from the tower of Hananeel unto the gate of the corner
    kind: history
    title: The rebuilt city
    body: |
      The places in verses 38–40 trace the walls of the rebuilt city, and they take in ground that was once unclean. The tower of Hananeel stood at the northeast corner of the wall (as in [[Neh. 3:1]]) and the Corner Gate at the northwest, so the first line marks out the whole north side of the city. Gareb and Goath are unknown places. The “valley of the dead bodies, and of the ashes” is generally taken to be the valley of Ben-hinnom, defiled when Josiah polluted the place where children were offered to Molech ([[2 Kgs. 23:10]]). Places once kept outside the city as unclean are to be inside the new one and “holy unto the LORD.” The chapter ends with a promise about the city itself: “it shall not be plucked up, nor thrown down any more for ever.”
    sources: [keil-jeremiah]

christ: |
  The chapter’s center is a covenant that Hebrews says Christ mediates: He “is the mediator of a better covenant, which was established upon better promises” ([[Heb. 8:6]]). Joseph Smith says that Christ “in the days of His flesh, proposed to make a covenant with them”; what the covenant requires is in the note on verse 31. The chapter’s other great scene is Rachel at Ramah, which Matthew takes up at Christ’s birth ([[Matt. 2:17–18]]). Verse 3 stands before all these promises: “with lovingkindness have I drawn thee.”

explore: |
  - **The new covenant in the New Testament.** Read [[Heb. 8]] and [[Heb. 10:16–22]] beside verses 31–34.
  - **The neighboring chapters.** Read [[Jer. 30]], [[Jer. 32]], and [[Jer. 33]] with this chapter.
  - **Law written within.** Compare [[Ezek. 36:24–28]] and [[2 Cor. 3:1–6]].
  - **The gathering of Ephraim.** Read [[D&C 133:26–34]] and [[Gen. 48:8–20]].
  - **Ezekiel’s answer to the proverb.** Read [[Ezek. 18]] as a companion to verses 29–30.

parallels:
  - ref: Matt. 2:17–18
    note: Matthew quotes verse 15 at the killing of the Bethlehem children.
  - ref: Heb. 8:8–12
    note: Quotes verses 31–34 at length.
  - ref: Heb. 10:16–17
    note: Quotes verses 33–34 again.
  - ref: Ezek. 18:2–4
    note: The proverb of verse 29 quoted and denied.

sources: [bd-jeremiah, bd-ephraim, ot-manual-25, keil-jeremiah, lds-scriptures, biblehub-interlinear, bdb, lxx-rahlfs]
