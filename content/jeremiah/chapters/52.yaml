chapter: 52
title: Thus Judah Was Carried Away
tagline: The book ends not with a prophecy but with a report. Jerusalem is besieged, the king blinded, the temple stripped, and an exiled king let out of prison.
when: 'Zedekiah’s reign (597–586 B.C. by the Bible Dictionary): the siege begins in his ninth year and the city falls in his eleventh, 586. The last verses jump ahead to the thirty-seventh year of Jehoiachin’s captivity.'

setting: |
  Jeremiah 52 is not a prophecy. It “forms a historical conclusion” to the book, and it is probably not Jeremiah's own writing (see the note on verse 1). It runs close to [[2 Kgs. 24:18–25:30]], and it summarizes what [[Jer. 39]] already told.

  The chapter covers the reign of Judah's last king, Zedekiah, whom Babylon had set on the throne after taking Jehoiachin into exile. It gives the dates of the siege (verses 4–6), the flight and capture of the king (verses 7–11), the burning of the city and temple (verses 12–23), the execution of its leaders (verses 24–27), a count of the exiles (verses 28–30), and then a last scene in Babylon (verses 31–34). Its Nebuchadrezzar is the king the Kings account spells Nebuchadnezzar.

  This is also the chapter that meets the Book of Mormon. Verse 10 reports that Zedekiah's sons were killed, and the note there takes up Mulek, whose people were later found by Mosiah ([[Omni 1:15]]).

thread: |
  The chapter has one pulse: **what Jeremiah said would happen, happened.** The king was to see the king of Babylon, go to Babylon, and not see it ([[Jer. 34:3]]; [[Ezek. 12:13]]); the temple's remaining vessels were to go to Babylon ([[Jer. 27:19–22]]); and verse 3 traces Zedekiah's rebellion itself to the Lord's anger. The chapter gives dates, measurements, and numbers instead of speeches, and in that way it shows the earlier warnings coming due.

  It then ends somewhere unexpected. The last scene is not the burning city but a descendant of David, long in prison, eating at a Babylonian king's table. Zedekiah's last act in the chapter is that he is put “in prison till the day of his death” (verse 11); Jehoiachin is brought out of prison and eats bread “continually” “all the days of his life” (verses 31–34). The chapter does not explain that ending. It leaves it as the last thing the book says.

sections:
  - range: 1-3
    heading: Zedekiah and why he fell
    plain: |
      Zedekiah was twenty-one when he began to reign, and he reigned eleven years in Jerusalem. His mother was Hamutal, daughter of Jeremiah of Libnah. He did what was evil in the Lord's sight, as Jehoiakim had. The Lord's anger was against Jerusalem and Judah until He had cast them out from His presence, and Zedekiah rebelled against the king of Babylon.
  - range: 4-11
    heading: The siege and the king's flight
    plain: |
      In Zedekiah's ninth year, on the tenth day of the tenth month, Nebuchadrezzar and his whole army camped against Jerusalem and built siege works all around it. The city was besieged until Zedekiah's eleventh year. On the ninth day of the fourth month the famine was so severe that the people had no bread. Then the wall was breached, and all the soldiers fled by night through the gate between the two walls, by the king's garden, while the Chaldeans surrounded the city, and they went toward the plain. The Chaldean army chased the king and caught him in the plains of Jericho, and his army scattered. They brought him to the king of Babylon at Riblah in Hamath, who passed sentence on him. The king of Babylon killed Zedekiah's sons before his eyes and killed all the princes of Judah at Riblah. Then he put out Zedekiah's eyes, bound him in chains, took him to Babylon, and kept him in prison until he died.
  - range: 12-23
    heading: The city and the temple burned
    plain: |
      On the tenth day of the fifth month, in Nebuchadrezzar's nineteenth year, Nebuzar-adan, captain of the guard, came into Jerusalem. He burned the temple, the king's palace, and all the houses of Jerusalem, the great houses among them, and the Chaldean army tore down the walls all around. He took captive some of the poor, the rest of the people left in the city, those who had gone over to Babylon, and the rest of the crowd, but left some of the poorest to be vinedressers and farmers. The Chaldeans broke up the bronze pillars, the stands, and the great bronze sea, and carried the bronze to Babylon, along with all the smaller bronze vessels, and the gold and silver ones. Solomon's bronze was beyond weighing. Each pillar stood eighteen cubits high, hollow, topped with a bronze capital decorated with network and pomegranates, ninety-six on the sides and a hundred in all.
  - range: 24-27
    heading: The leaders put to death
    plain: |
      The captain took the chief priest Seraiah, the second priest Zephaniah, and the three doorkeepers. From the city he also took an officer in charge of the soldiers, seven of the king's close attendants, the chief scribe of the army, who enrolled the people, and sixty of the people. He brought them to the king of Babylon at Riblah, who had them put to death. So Judah was carried away captive out of its land.
  - range: 28-30
    heading: The count of the exiles
    plain: |
      This is the number of those Nebuchadrezzar carried away: in his seventh year 3,023 Jews; in his eighteenth year 832 people from Jerusalem; in his twenty-third year 745 Jews, taken by Nebuzar-adan. In all 4,600.
  - range: 31-34
    heading: Jehoiachin freed
    plain: |
      In the thirty-seventh year of the exile of Jehoiachin king of Judah, on the twenty-fifth day of the twelfth month, Evil-merodach, in the first year of his reign as king of Babylon, brought Jehoiachin out of prison. He spoke kindly to him and set his seat above those of the other kings with him in Babylon. Jehoiachin changed out of his prison clothes and ate at the king's table for the rest of his life, and the king gave him a daily allowance until he died.

notes:
  - ref: 1
    phrase: Zedekiah was one and twenty years old when he began to reign
    kind: history
    title: An appendix, not a prophecy
    body: |
      The chapter is a historical appendix, and probably not Jeremiah's own writing. The previous chapter closes with “Thus far are the words of Jeremiah” ([[Jer. 51:64]]), which marks the end of his words. Chapter 52 is “a historical conclusion” to the book, and since Jeremiah was taken to Egypt, not Babylon ([[Jer. 43:6–7]]), it is “doubtful that this chapter was written by him,” and it may have been “added by his scribe, Baruch.”

      Verses 1–3 repeat almost word for word [[2 Kgs. 24:18–20]], and the chapter follows the Kings account, with additions: the count of the pomegranates on the pillars (verse 23) and the list of exiles (verses 28–30) have no counterpart in [[2 Kgs. 25]]. It is “a summary of historical material previously covered (see Jeremiah 39) and a record of further events,” chiefly the treatment of Jehoiachin at the end.
    sources: [bd-jeremiah, ot-manual-24, lds-scriptures]
  - ref: 1
    phrase: Hamutal the daughter of Jeremiah of Libnah
    kind: history
    title: Zedekiah's mother, and a different Jeremiah
    body: |
      Zedekiah's mother Hamutal also bore Jehoahaz, who reigned three months: [[2 Kgs. 23:31]] gives the same name and the same father for his mother, so the two kings had the same mother. Her father, Jeremiah of Libnah, is not the prophet, who is “the son of Hilkiah, of the priests that were in Anathoth in the land of Benjamin” ([[Jer. 1:1]]). Nothing in the text links the two men.
    sources: [lds-scriptures]
  - ref: 3
    phrase: through the anger of the LORD it came to pass in Jerusalem and Judah
    kind: history
    title: Why Zedekiah's rebellion is called the Lord's anger
    body: |
      Verse 3 sees Zedekiah's revolt from two sides at once: politically he “rebelled against the king of Babylon,” but beneath that, “through the anger of the LORD” Judah was being “cast out from his presence.” The same sentence stands in [[2 Kgs. 24:20]]. Nothing in it excuses Zedekiah, who, “ignoring the repeated warnings of Jeremiah… rebelled, and once again the Babylonians came against Jerusalem.”

      Why the Lord allowed the city to fall can be answered from the prophets who lived through it. Nephi says that “when the Spirit ceaseth to strive with man then cometh speedy destruction” ([[2 Ne. 26:11]]). Read through the words of Jeremiah, Lehi, and Ezekiel, the people of Jerusalem showed six features of those who are losing the Light of Christ, among them the repetition and rationalization of sin, a seared conscience, and the rejection of the prophets, and so were “ripe for destruction.” That list is a synthesis of what these prophets say, not a statement of doctrine.
    sources: [ot-manual-24, lds-scriptures, sc-knowhy-637]
  - ref: 4
    phrase: in the ninth year of his reign, in the tenth month, in the tenth day of the month
    kind: history
    title: The day the siege began
    body: |
      The siege's first day is dated twice, once here and once by another prophet. On the same day, “in the ninth year, in the tenth month, in the tenth day of the month,” the Lord told Ezekiel to “write thee the name of the day, even of this same day: the king of Babylon set himself against Jerusalem this same day” ([[Ezek. 24:1–2]]).

      The siege ran from this day until Zedekiah's eleventh year (verse 5), the ninth day of the fourth month (verse 6): about a year and a half, with conditions “almost beyond imagination.” An eyewitness description of the famine is in [[Lam. 4:1–10]].
    sources: [lds-scriptures, ot-manual-kings-g]
  - ref: 11
    phrase: put out the eyes of Zedekiah
    kind: scripture
    title: He saw Babylon's king, and did not see Babylon
    body: |
      Two earlier prophecies fit what happened to Zedekiah. Jeremiah told him “thine eyes shall behold the eyes of the king of Babylon, and he shall speak with thee mouth to mouth, and thou shalt go to Babylon” ([[Jer. 34:3]]). Ezekiel was told of a prince who would be “taken in my snare” and brought “to Babylon to the land of the Chaldeans; yet shall he not see it, though he shall die there” ([[Ezek. 12:13]]).

      The two statements look as if they conflict until verses 9–11 are read together: Zedekiah stands before Nebuchadrezzar at Riblah, watches his sons killed, and is then blinded before being carried to Babylon. Ezekiel's earlier verse also has the prince leave “through the wall” and “cover his face, that he see not the ground” ([[Ezek. 12:12]]), which matches the flight “by night” “between the two walls” in verse 7. So “both prophets were vindicated by subsequent events.”
    sources: [lds-scriptures, ot-manual-19]
  - ref: 10
    phrase: slew the sons of Zedekiah before his eyes
    kind: scripture
    title: Not all of Zedekiah's sons
    body: |
      The Book of Mormon adds to verse 10: not all of Zedekiah's sons were killed. “Book of Mormon references to Zedekiah are many, a notable contribution being the information that not all of the sons of Zedekiah were slain (as implied in Jer. 52:10), for one son, Mulek, came to the Western Hemisphere.” Nephi the son of Helaman asks his hearers, “Will ye say that the sons of Zedekiah were not slain, all except it were Mulek?” ([[Hel. 8:21]]). Amaleki records that the people of Zarahemla “came out from Jerusalem at the time that Zedekiah, king of Judah, was carried away captive into Babylon” ([[Omni 1:15]]).

      How Mulek escaped is not told. One scholarly suggestion is that he “was not in Jerusalem at the time it was destroyed,” either sent out as an envoy or led away earlier “in hopes of preserving an heir to the throne”; it is “likely,” not certain.
    sources: [bd-zedekiah, sc-knowhy-753, lds-scriptures]
  - ref: 12
    phrase: in the tenth day of the month
    kind: words
    title: The seventh day or the tenth
    body: |
      This verse gives the tenth day of the fifth month for the day Nebuzar-adan came to burn the city, while [[2 Kgs. 25:8]] gives the seventh day of the same month, in the same nineteenth year of the same king. One reading is that the difference “has arisen through one number having been mistaken for another in copying” and that “it cannot now be decided which is correct.” The same account is told twice with one number different, and nothing else in the chapter depends on the day.
    sources: [lds-scriptures, keil-jeremiah]
  - ref: 16
    phrase: certain of the poor of the land for vinedressers and for husbandmen
    kind: history
    title: Who was left in the land
    body: |
      The Babylonians took the leaders, craftsmen, and the rest of the city, and left behind the poorest to work the land. [[Jer. 39:10]] says Nebuzar-adan “left of the poor of the people, which had nothing, in the land of Judah, and gave them vineyards and fields at the same time.” Those who stayed had a governor: Nebuchadnezzar “made Gedaliah the son of Ahikam, the son of Shaphan, ruler” over them ([[2 Kgs. 25:22]]).

      Jeremiah 52 does not mention Gedaliah, though Kings does. One reading is that the story was omitted here because it has already been told in Jeremiah 40:7–43:7 at greater length and did not bear on this chapter's purpose.
    sources: [lds-scriptures, keil-jeremiah]
  - ref: 17
    phrase: the pillars of brass that were in the house of the LORD
    kind: scripture
    title: Solomon's bronze, carried to Babylon and brought back
    body: |
      The long list of broken pillars and carried vessels shows Solomon's temple being taken apart, and it fulfills a warning Jeremiah had given. The two pillars Solomon cast were “eighteen cubits high apiece” ([[1 Kgs. 7:15]]); verse 20 says the brass of the vessels “was without weight,” echoing the statement that Solomon “left all the vessels unweighed, because they were exceeding many” ([[1 Kgs. 7:47]]).

      Years earlier Jeremiah had said that the “pillars,” the “sea,” and the other vessels still in the city “shall be carried to Babylon, and there shall they be until the day that I visit them, saith the Lord; then will I bring them up, and restore them to this place” ([[Jer. 27:19–22]]). The chapter reports the first half. The second half is told in [[Ezra 1:7–11]]: Cyrus “brought forth the vessels of the house of the Lord,” numbered to Sheshbazzar, “five thousand and four hundred” in all.
    sources: [lds-scriptures]
  - ref: 28
    phrase: in the seventh year three thousand Jews and three and twenty
    kind: history
    title: Counting the exiles
    body: |
      The three counts, 3,023 in Nebuchadrezzar's seventh year, 832 in his eighteenth, and 745 in his twenty-third, total the 4,600 of verse 30, but they are not the whole exile. Kings gives “ten thousand captives” for the first deportation ([[2 Kgs. 24:14]]), and the 832 “doubtless refers only to adult males and likely only to inhabitants of Jerusalem. The number of deportees was much larger.” So these figures are counts of particular groups, not of the whole exile.

      There is a second puzzle: the list puts the second deportation in Nebuchadrezzar's eighteenth year, while verse 12 puts the burning of the city in his nineteenth. One reading is that the list came from another source that counted the king's years from a different starting point. The chapter does not settle it.
    sources: [lds-scriptures, ot-manual-kings-g, keil-jeremiah]
  - ref: 31
    phrase: lifted up the head of Jehoiachin king of Judah
    kind: history
    title: The king let out of prison
    body: |
      Jehoiachin is the Judean king taken into exile before Zedekiah's reign, also called Jeconiah and Coniah; he is dated to 598 B.C. Jeremiah had spoken harshly of him: he was a signet the Lord would pluck off and give into Nebuchadnezzar's hand, never to return ([[Jer. 22:24–30]]), and “no man of his seed shall prosper, sitting upon the throne of David.”

      The chapter ends with a kindness: after thirty-seven years in exile Evil-merodach “spake kindly unto him, and set his throne above the throne of the kings that were with him in Babylon.” The same account closes [[2 Kgs. 25:27–30]]. The two accounts differ on the day: the twenty-fifth here, the twenty-seventh in Kings. The contrast with Zedekiah is stark: the king who rebelled was blinded and held in prison “till the day of his death” (verse 11); the king who had gone into exile earlier is fed and housed for life. The chapter says no more about why.
    sources: [bd-jehoiachin, ot-manual-24, ot-manual-kings-g, lds-scriptures]
  - ref: 34
    phrase: all the days of his life
    kind: christ
    title: Jechonias in Matthew's genealogy
    body: |
      Jehoiachin, the king who survives at the end of Jeremiah, appears in the genealogy of Jesus. He is also called Jeconiah, and Salathiel is among “the sons of Jeconiah” ([[1 Chr. 3:17]]); Matthew records that “after they were brought to Babylon, Jechonias begat Salathiel; and Salathiel begat Zorobabel” ([[Matt. 1:12]]). Jeremiah's own word was that none of Jehoiachin's seed would prosper “sitting upon the throne of David” ([[Jer. 22:30]]). The book ends with that king alive and honored in exile, and Matthew traces David's line through him to Jesus.
    sources: [lds-scriptures, bd-jehoiachin]

christ: |
  The chapter shows what a kingdom looks like when its kings fail: Zedekiah, whose name means “The Lord (is) righteousness” (compare [[Jer. 23:6]] and [[Jer. 33:16]]), does evil, and his city, temple, and sons are lost. Jeremiah had earlier spoken of a coming king, and 23:1–6 is the “promise of the king Messiah.” In the last verses a king of David's line is alive in Babylon, and Matthew's genealogy of Jesus names him ([[Matt. 1:12]]). The temple's vessels, carried off here, are promised back ([[Jer. 27:22]]).

explore: |
  - **The fall in detail.** Compare [[Jer. 39]] and [[2 Kgs. 25:1–30]], and read the eyewitness grief of [[Lam. 4]].
  - **The prophets who foresaw it.** [[Jer. 34:1–5]], [[Jer. 27:19–22]], and [[Ezek. 12:1–16]].
  - **Mulek's people.** Read [[Omni 1:12–19]], [[Hel. 6:10]], and [[Hel. 8:20–21]].
  - **The return of the vessels.** [[Ezra 1:7–11]].
  - **The exiles with Jehoiachin.** [[Jer. 24]] and [[Jer. 29]].

parallels:
  - ref: Hel. 8:21
    note: Nephi the son of Helaman says that all of Zedekiah's sons were slain "except it were Mulek."
  - ref: Omni 1:15
    note: Amaleki says the people of Zarahemla came out from Jerusalem when Zedekiah was carried away captive, the time of verses 9–11.
  - ref: Hel. 6:10
    note: Mulek is brought "into the land north," the Lord's work after the events of this chapter.

sources: [bd-jeremiah, bd-zedekiah, bd-jehoiachin, ot-manual-19, ot-manual-24, ot-manual-kings-g, keil-jeremiah, lds-scriptures, sc-knowhy-637, sc-knowhy-753]
