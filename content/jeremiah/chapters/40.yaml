chapter: 40
title: The Remnant at Mizpah
tagline: Jerusalem is gone, Jeremiah is freed by the Babylonian who destroyed it, and a small band of survivors gathers around a governor who will not believe he is in danger.
when: 'After the fall of Jerusalem in 586 B.C. (Bible Dictionary); the chapter gives no date of its own, though the events of chapter 41 fall in “the seventh month”'

setting: |
  The book now turns from warning to aftermath. Jeremiah prophesied “till after the downfall of Jerusalem, a period of over 40 years, 626–586 B.C.,” and chapters 39–44 give “the prophet's history and other events after the fall of the city.” Chapter 39 told the fall itself. Chapter 40 begins the story of what was left.

  The Babylonians carried off most of the people but left “the poor of the land” ([[Jer. 39:10]]) under a governor of their choosing, Gedaliah, whose seat was at Mizpah. Jeremiah, who had been in chains among the captives, is released and joins him. Officers who had scattered during the siege, and Jews who had fled to Moab, Ammon, and Edom, come back to the land. For a moment the remnant looks as if it might live.

  The hope does not last. Chapter 41 tells of Gedaliah's murder, and by chapter 43 the survivors have fled to Egypt and taken Jeremiah with them ([[Jer. 43:6–7]]).

thread: |
  Chapter 40 is about a second chance and how it was lost. The Babylonian officer who frees Jeremiah says aloud what Jeremiah has preached for decades: the Lord brought this because the people would not obey (verses 2–3). Gedaliah's counsel to those who remain is the counsel Jeremiah gave before the fall: serve Babylon, stay in the land, and it will be well (verse 9; compare [[Jer. 27:11]]). Verses 7–12 show that counsel working, as scattered Jews come home and gather “wine and summer fruits very much.”

  Then comes the warning that Gedaliah will not hear (verses 13–16). The chapter ends with a good man calling a true report a lie, and the reader, who knows from chapter 41 what follows, can see the whole remnant's future turning on that sentence.

sections:
  - range: 1-6
    heading: Jeremiah set free
    plain: |
      The word came to Jeremiah after Nebuzar-adan, the captain of the guard, released him at Ramah, where he had been taken in chains with the other captives of Jerusalem and Judah. The captain said to him, “The Lord your God threatened this disaster against this place, and now He has brought it, as He said, because you sinned against the Lord and did not obey Him.” He freed Jeremiah from his chains and offered him a choice: come to Babylon and be looked after, or stay, with the whole land open to him. Before Jeremiah left, he added, “Go back to Gedaliah, whom the king of Babylon has made governor over the towns of Judah, and live with him among the people, or go wherever you like.” He gave Jeremiah food and a gift and let him go. Jeremiah went to Gedaliah at Mizpah and lived with him among the people left in the land.
  - range: 7-12
    heading: The remnant gathers
    plain: |
      The army officers still out in the countryside heard that the king of Babylon had put Gedaliah over the poor who were left, including men, women, and children, and they came to him at Mizpah: Ishmael son of Nethaniah, Johanan and Jonathan sons of Kareah, Seraiah son of Tanhumeth, the sons of Ephai the Netophathite, and Jezaniah son of the Maacathite, with their men. Gedaliah swore to them: “Do not be afraid to serve the Babylonians. Settle in the land, serve the king of Babylon, and it will go well with you. I will stay at Mizpah to serve the Babylonians who come to us. You gather wine, summer fruit, and oil, store them in jars, and live in the towns you have taken over.” The Jews who had fled to Moab, Ammon, Edom, and other lands heard that the king of Babylon had left a remnant in Judah under Gedaliah. They all came back and gathered a very large harvest of wine and summer fruit.
  - range: 13-16
    heading: A warning Gedaliah will not hear
    plain: |
      Johanan and the other officers came to Gedaliah at Mizpah and asked, “Don't you know that Baalis king of the Ammonites has sent Ishmael son of Nethaniah to take your life?” Gedaliah did not believe them. Johanan then spoke privately: “Let me kill Ishmael. No one will know. Why should he kill you, scatter all the Jews who have gathered to you, and let the remnant of Judah perish?” Gedaliah answered, “Do not do this. What you say about Ishmael is false.”

notes:
  - ref: 1
    phrase: let him go from Ramah
    kind: history
    title: Ramah, where the captives were gathered
    body: |
      Ramah was the assembly point for the exiles, a town “about five miles north of Jerusalem” where Jeremiah, “taken in chains with all the other captured Jews,” was released: “at the time of the captivity the exiles were collected here before removal to Babylon.”

      The same town stands behind a line Jeremiah wrote earlier: “A voice was heard in Ramah, lamentation, and bitter weeping; Rahel weeping for her children” ([[Jer. 31:15]]). Matthew quotes it when Herod kills the children of Bethlehem: “Then was fulfilled that which was spoken by Jeremy the prophet” ([[Matt. 2:17–18]]). Read beside this verse, that line belongs to the same scene, the exiles gathered at Ramah before removal to Babylon: the weeping there was the weeping of captives, and here Jeremiah stood among them.
    sources: [bd-ramah, ot-manual-24, lds-scriptures]
  - ref: 1
    phrase: bound in chains
    kind: history
    title: Chains at Ramah, and the prison court
    body: |
      Jeremiah was in chains again after the fall of the city, though the Babylonians had meant to spare him. Chapter 39 reports that Nebuchadrezzar ordered, “Take him, and look well to him, and do him no harm,” and that Nebuzar-adan's men “took Jeremiah out of the court of the prison, and committed him unto Gedaliah” ([[Jer. 39:11–14]]). Chapter 40 has him in fetters among the captives at Ramah.

      The text does not say how the second account follows the first. At Ramah the captain of the guard “loosed his bonds” and sent him back to Gedaliah; how he came to be among the captives after the king's order, neither chapter explains.
    sources: [ot-manual-24, lds-scriptures]
  - ref: 1
    phrase: The word that came to Jeremiah from the LORD
    kind: words
    title: A heading with no word in it
    body: |
      The opening formula promises a prophecy, but none follows in verses 1–6; the first word from the Lord in this part of the book comes only when He answers the survivors in [[Jer. 42:7]]. One reading is that the formula is a heading for the whole section that follows (chapters 40–45), “the prophecies which Jeremiah uttered after the destruction of Jerusalem,” just as the word of the Lord in [[Jer. 1:2]] heads the prophecies before it. That is an explanation of the book's layout, not something the text states.
    sources: [keil-jeremiah, lds-scriptures]
  - ref: 3
    phrase: because ye have sinned against the LORD
    kind: scripture
    title: A Babylonian says what Jeremiah said
    body: |
      Nebuzar-adan gives the explanation of the fall that Jeremiah had given for forty years: the Lord pronounced it, the Lord brought it, because the people “have not obeyed his voice.” The speaker is a Babylonian officer, and he sounds like a prophet. One reading is that “the mode of expression is that of Jeremiah,” while Nebuzar-adan may have been saying only that what Jeremiah predicted “in the name of God” had now been fulfilled. Either way the text has a foreign soldier confirming the prophet whom his own king had ordered treated well ([[Jer. 39:11–12]]).

      The same cause is named in two other places. Jeremiah himself says it to the survivors who went to Egypt: “Because ye have burned incense, and because ye have sinned against the Lord, and have not obeyed the voice of the Lord… therefore this evil is happened unto you” ([[Jer. 44:23]]). The Lord says it to the Saints driven from Missouri: “I, the Lord, have suffered the affliction to come upon them, wherewith they have been afflicted, in consequence of their transgressions” ([[D&C 101:2]]).
    sources: [keil-jeremiah, lds-scriptures, bd-jeremiah]
  - ref: 4
    phrase: If it seem good unto thee to come with me into Babylon
    kind: history
    title: Babylon or the land
    body: |
      Jeremiah is given a free choice between exile in Babylon under the captain's care and a ruined homeland, and he stays. “The Babylonians completely freed Jeremiah. They suggested that he go live with Gedaliah,” and he did. The text records no deliberation and no word from the Lord on the matter.

      His staying fits what he had preached. He told the nations that those who “bring their neck under the yoke of the king of Babylon, and serve him,” would “remain still in their own land” ([[Jer. 27:11]]). The remnant at Mizpah is where that counsel is now put to the test (verse 9).
    sources: [ot-seminary-guide-jer-37-44, lds-scriptures]
  - ref: 5
    phrase: Gedaliah the son of Ahikam the son of Shaphan
    kind: history
    title: Gedaliah, son of Ahikam, son of Shaphan
    body: |
      Gedaliah came from a family that had served King Josiah and stood by Jeremiah. His father, “Ahikam the son of Shaphan,” was among those Josiah sent to inquire of the Lord when the book of the law was found, together with “Shaphan the scribe” ([[2 Chr. 34:20–21]]). When the people wanted Jeremiah put to death after his temple sermon, “the hand of Ahikam the son of Shaphan was with Jeremiah” and protected him ([[Jer. 26:24]]).

      Babylon put over the remnant a man from that family. He was made “ruler” over “the people that remained in the land of Judah” ([[2 Kgs. 25:22]]), “governor” in the KJV of this chapter (verses 5 and 7), but not king. He is not described as a descendant of David; the man who will kill him is, “of the seed royal” ([[Jer. 41:1]]).
    sources: [lds-scriptures]
  - ref: 7
    phrase: of the poor of the land
    kind: history
    title: The poor who were left
    body: |
      The remnant is mostly the poor, the people the Babylonians did not carry off. Earlier the captain of the guard “left of the poor of the people, which had nothing, in the land of Judah, and gave them vineyards and fields at the same time” ([[Jer. 39:10]]). Gedaliah is put over these, “men, and women, and children.”

      The officers in the field are different. During the conquest many soldiers “had dispersed here and there through the land, and fled for refuge to regions difficult of access,” and these now come in. So Mizpah holds three groups: the poor, the officers and their men, and the returning refugees of verses 11–12. They share only the fact that they were not taken.
    sources: [lds-scriptures, keil-jeremiah]
  - ref: 8
    phrase: Ishmael the son of Nethaniah
    kind: history
    title: Ishmael of the seed royal
    body: |
      The first officer named is the one who will destroy the remnant. This Ishmael is a member of the royal family: “Ishmael the son of Nethaniah the son of Elishama, of the seed royal” ([[Jer. 41:1]]).

      Johanan son of Kareah, listed beside him, is the one who will warn Gedaliah and later lead the survivors to Egypt ([[Jer. 40:13–16]]; [[Jer. 43:4–7]]).
    sources: [lds-scriptures]
  - ref: 9
    phrase: Fear not to serve the Chaldeans
    kind: scripture
    title: Gedaliah repeats Jeremiah's counsel
    body: |
      Gedaliah's oath echoes what Jeremiah wrote to the exiles in Babylon: “seek the peace of the city whither I have caused you to be carried away captives, and pray unto the Lord for it” ([[Jer. 29:7]]). Second Kings gives nearly the same oath: “Fear not to be the servants of the Chaldees: dwell in the land, and serve the king of Babylon; and it shall be well with you” ([[2 Kgs. 25:24]]).

      The Lord later puts the same promise in His own words to the survivors, using the verbs of Jeremiah's call: “If ye will still abide in this land, then will I build you, and not pull you down, and I will plant you, and not pluck you up” ([[Jer. 42:10]]; compare [[Jer. 1:10]]). The chapter gives a few harvest months in which that promise could be seen working.
    sources: [lds-scriptures]
  - ref: 12
    phrase: gathered wine and summer fruits very much
    kind: history
    title: Why the refugees came back
    body: |
      Jews who had fled to Moab, Ammon, Edom, and “all the countries” return because they hear that Babylon “had left a remnant of Judah” under Gedaliah. They come on the strength of a report, to a place where they were promised safety on one condition: submission to the king of Babylon. The harvest of “wine and summer fruits very much” suggests that, for a time, the plan was working.

      The refugees' return also shows what the murder will cost. When Gedaliah dies, those who gathered to him are scattered again, and the survivors leave for Egypt “because of the Chaldeans: for they were afraid of them” ([[Jer. 41:17–18]]).
    sources: [lds-scriptures]
  - ref: 14
    phrase: But Gedaliah the son of Ahikam believed them not.
    kind: history
    title: Gedaliah would not believe
    body: |
      Gedaliah's refusal to believe the plot against him ends the remnant's brief peace. Ishmael came to Mizpah with ten men, ate with Gedaliah, and killed him, and with him “all the Jews that were with him… and the Chaldeans that were found there, and the men of war” ([[Jer. 41:1–3]]). “The good governor was warned of this, but he would not believe those who had informed him of the plot.”

      Why Baalis the king of Ammon wanted Gedaliah dead the text does not say. Personal hostility is possible, or the hope of removing “the only remaining support of the Jews” and taking the country, but which it was “cannot be determined.” Johanan offers in secret to kill Ishmael first, and Gedaliah answers that Johanan “speakest falsely.” Gedaliah's answer is the last word of the chapter, and chapter 41 shows what it cost.
    sources: [lds-scriptures, ot-manual-24, keil-jeremiah]

christ: |
  Ramah links this chapter to the birth of Christ. Jeremiah wrote of weeping there ([[Jer. 31:15]]), the chapter shows the captives gathered there, and Matthew says the weeping was fulfilled when Herod killed the children of Bethlehem ([[Matt. 2:17–18]]). In Jeremiah 31 the Lord answers the weeping at once: “Refrain thy voice from weeping… for thy work shall be rewarded, saith the Lord; and they shall come again from the land of the enemy” ([[Jer. 31:16]]). The Lord's word about Jerusalem proved true in judgment, as Nebuzar-adan's words in verses 2–3 admit, and the same chapter of Jeremiah that names Ramah promises return from the land of the enemy.

explore: |
  - **The next chapter.** Read [[Jer. 41]] for the murder of Gedaliah and what follows.
  - **The survivors' request.** Read [[Jer. 42]]–[[Jer. 43]], where the remnant asks Jeremiah for the Lord's word and then refuses it.
  - **Rachel at Ramah.** Compare [[Jer. 31:15–17]] and [[Matt. 2:16–18]].
  - **The family of Shaphan.** Read [[2 Chr. 34:14–21]] and [[Jer. 26:16–24]].

sources: [bd-jeremiah, bd-ramah, ot-manual-24, ot-seminary-guide-jer-37-44, keil-jeremiah, lds-scriptures]
