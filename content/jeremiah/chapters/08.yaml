chapter: 8
title: The Harvest Is Past
tagline: The threat of chapter 7 reaches the graves, then the prophet asks why a people who could once turn back will not, and weeps that no balm has been laid on the wound.
when: 'No date is given in the chapter. The Bible Dictionary places chapters 7–20 under Jehoiakim (608–597 B.C.), and verse 1 (“At that time”) continues the sermon of chapter 7'

setting: |
  Jeremiah 8 has no heading verse of its own. It carries on from the temple sermon of chapter 7, which ends with the threat that the dead of Jerusalem will be buried in Topheth “till there be no place,” and that their bodies will be food for birds and beasts ([[Jer. 7:32–33]]). The Bible Dictionary groups chapters 7–20 under Jehoiakim's reign (608–597 B.C.).

  In four movements the chapter moves from the unburied dead (verses 1–3), to the question of why the living will not turn back (verses 4–7), to the false wisdom and false comfort of the scribes, priests, and prophets (verses 8–13), to a closing lament in which the enemy, the people, the prophet, and the Lord seem to speak in turn (verses 14–22). Verses 10–12 are nearly word for word [[Jer. 6:13–15]]; the note at verse 11 points back to them.

  The Doctrine and Covenants takes up verse 20 in two places ([[D&C 45:2]]; [[D&C 56:16]]).

thread: |
  The chapter keeps asking why. Why will a people that falls not rise, and turns away not return (verses 4–5)? Why do the wise, who have the law, know less than a stork (verses 7–9)? Why is a wound dressed over, when there is “no peace” (verse 11)? And at the end, why is there no cure when there is balm and a physician (verse 22)? The Hebrew verb *shuv*, “turn, return,” sits in the middle of all of it. Judah turns away and will not turn back; the one thing the chapter never says is that return is impossible. It says only that the people “refuse to return” ([[Jer. 8:5]]).

  The people's complaint in verse 20 (“we are not saved”) and the prophet's in verse 22 point to the same remedy. Salvation does not come by the wise, the scribes, or the fortified cities; it comes from the Lord whom Judah turned from.

sections:
  - range: 1-3
    heading: The graves opened
    plain: |
      At that time, says the Lord, the bones of the kings, princes, priests, prophets, and people of Jerusalem will be brought out of their graves and spread out before the sun, moon, and stars that they loved, served, followed, sought, and worshipped. They will not be gathered or buried but lie like dung on the ground. All who remain of this evil family, wherever I have driven them, will choose death over life.
  - range: 4-7
    heading: Why will they not return?
    plain: |
      Tell them: Does someone fall and not get up? Does someone turn away and not turn back? Why then has Jerusalem turned away and kept turning away? They cling to deceit and refuse to return. I listened, and no one repented or said, “What have I done?” Each goes his own way like a horse charging into battle. The stork knows her season, and so do the turtledove, swallow, and crane. My people do not know the Lord's judgment.
  - range: 8-12
    heading: The wise who are not wise
    plain: |
      How can you say, “We are wise; we have the law of the Lord”? The scribes' pen is a lying pen. The wise will be put to shame, having rejected the Lord's word. So I will give their wives and fields to others, for everyone, from prophet to priest, is greedy and false. They dress the wound of my people lightly, saying “Peace, peace” when there is no peace. They were not ashamed of their abominations, and could not even blush, so they will fall with the fallen.
  - range: 13-17
    heading: No grapes, no figs, and an enemy from Dan
    plain: |
      I will surely consume them, says the Lord: no grapes on the vine, no figs on the tree, the leaf withered. The people say: Why sit here? Let us run to the fortified cities and be silent there, for the Lord has given us water of gall to drink because we sinned. We hoped for peace and healing, and terror came. From Dan the snorting of the enemy's horses is heard; the land shakes. The Lord says: I will send snakes that cannot be charmed, and they will bite you.
  - range: 18-22
    heading: The prophet's lament
    plain: |
      My heart is sick within me. I hear the cry of my people because of those in a far country: “Is the Lord not in Zion? Is her King not there?” Then comes the question: Why did they provoke me with their idols? The people cry: “The harvest is past, the summer is ended, and we are not saved.” For the wound of my people I am wounded; I mourn, and horror has seized me. Is there no balm in Gilead, no physician there? Why then has my people not been healed?

notes:
  - ref: 1
    phrase: they shall bring out the bones of the kings of Judah
    kind: history
    title: Bones brought out of the graves
    body: |
      Verse 1 describes an enemy's contempt for the dead, and it carries on the threat of chapter 7, where there will be “no place” left to bury and corpses will lie unburied ([[Jer. 7:32–33]]). Victorious enemies “dragged out of their graves, caves, and sepulchers, the bones of kings, princes, prophets, priests, and the principal inhabitants, and exposed them in the open air.” The custom “seems to have been general,” and it was “the highest expression of hatred and contempt.”

      The Lord says what will happen, and the actors are not named. The Church edition's footnote sends the reader to [[Jer. 25:33]], where the slain “shall not be lamented, neither gathered, nor buried; they shall be dung upon the ground.”
    sources: [ot-manual-23, clarke-commentary, lds-scriptures]
  - ref: 2
    phrase: whom they have loved, and whom they have served
    kind: symbol
    title: Loved, served, walked after, sought, worshipped
    body: |
      The verse lists five verbs of devotion, “loved,” “served,” “walked,” “sought,” “worshipped,” and the bones are laid out before the very sun, moon, and stars they had worshipped. The enemies expose them “in the vain confidence they had in the sun, moon, and the host of heaven—all the planets and stars, whose worship they had set up in opposition to that of Jehovah.” The reproach is exact: what the dead trusted in is made to look on.
    sources: [ot-manual-23, clarke-commentary]
  - ref: 3
    phrase: death shall be chosen rather than life
    kind: scripture
    title: Death chosen rather than life
    body: |
      Even those who live will not find life worth choosing. The survivors “remain in all the places whither I have driven them,” and they will prefer death. In [[Rev. 9:6]] men likewise “seek death, and shall not find it; and shall desire to die, and death shall flee from them.” The two passages share the same bleak picture of a people wanting to die more than they want to live. The point for Jeremiah is that the Lord Himself has driven them out; their scattering is the judgment, not an accident of war.
    sources: [lds-scriptures]
  - ref: 5
    phrase: slidden back by a perpetual backsliding
    kind: words
    title: Turn, turn back, turn away
    body: |
      “Turn away,” “return,” and “backsliding” in verses 4–6 all come from one Hebrew root, *shuv*, “turn back, return,” which, used on its own, can also mean “repent.” In these three verses it appears six times: “shall he turn away, and not return?” (verse 4, twice); “slidden back” and “backsliding” (verse 5); “refuse to return” (verse 5); and “every one turned to his course” (verse 6). The English hides it. The Hebrew repeats one root, and the argument rests on it: if falling means getting up again and turning away means turning back, why does Jerusalem turn away “by a perpetual” turning and never back?

      Verse 6 gives the answer, and it is the missing step: “no man repented him of his wickedness, saying, What have I done?” (Here “repented” is a different verb, *nicham*, “be sorry.”) The Lord has listened for the one sentence that would begin return. Compare His open invitation in [[Jer. 3:22]]: “Return, ye backsliding children, and I will heal your backslidings.”
    sources: [oshb-wlc, bdb, lds-scriptures]
  - ref: 7
    phrase: the stork in the heaven knoweth her appointed times
    kind: symbol
    title: The stork knows her seasons
    body: |
      The birds keep their appointed times, and Judah does not know what the Lord has appointed. The verse names four birds. The “turtle” is the turtle-dove (the bird heard in the spring in [[Song 2:12]]). Each bird “knoweth her appointed times” and “observe[s] the time of their coming”; “my people know not the judgment of the LORD.”

      The comparison is a reproach, not a nature note: creatures with no law keep what they were given, and the people who have the law do not. The next verse turns that charge on those who claim to know it.
    sources: [oshb-wlc, lds-scriptures]
  - ref: 8
    phrase: We are wise, and the law of the LORD is with us
    kind: scripture
    title: “We are wise”
    body: |
      The people's claim to wisdom is the claim that they have the law, and Jeremiah says that it has not made them wise. Jacob describes the same failure ([[2 Ne. 9:28]]; compare [[1 Cor. 1:20]]): “When they are learned they think they are wise, and they hearken not unto the counsel of God, for they set it aside, supposing they know of themselves.” Having the word and obeying the word are different things, and verse 9 draws the conclusion: those who “have rejected the word of the LORD” have no wisdom left, whatever they hold.
    sources: [lds-scriptures]
  - ref: 8
    phrase: the pen of the scribes is in vain
    kind: words
    title: The pen of the scribes
    body: |
      The KJV's “in vain” hides a sharper Hebrew charge: the scribes' pen is a lying pen. The Hebrew uses *sheqer* (“falsehood”) twice. Word for word it reads “certainly for falsehood has [the] lying pen of the scribes made it,” and “it” is the law. A Greek translation of the same verse renders it “In vain have the scribes used a false pen.” On one reading the target is not only people who copied or wrote: it takes in the priests, “whose duty it was to train the people in the law,” and who, by false teaching, “led the people astray.”
    sources: [oshb-wlc, lxx-rahlfs, keil-jeremiah]
  - ref: 11
    phrase: Peace, peace; when there is no peace
    kind: scripture
    title: “Peace, peace”
    body: |
      Verses 10–12 are the same words as [[Jer. 6:13–15]], with small changes; the false comfort of the prophets and priests is explained there. The Greek translation does not repeat them in full: Brenton's English of it leaves out verses 11–12, marking them “omitted text.”

      Calling for peace was easy, and the danger was exactly that nobody was disturbed enough to turn back, which is the problem of verses 4–6.
    sources: [lds-scriptures, lxx-rahlfs]
  - ref: 14
    phrase: Why do we sit still?
    kind: structure
    title: Who is speaking
    body: |
      The voices in verses 14–22 change without being marked, and the chapter reads more clearly once they are separated. On one reading they run as follows. In verse 14 the citizens of Judah call on one another to flee into fortified cities, and verse 15 is their disappointment. Verse 16 is the sound of the invader, and verse 17 the Lord's warning of serpents. In verse 18 the prophet speaks, whose “heart is faint in me,” and who is cut “to the very heart” by the ruin of his people. In verse 19 the people cry from the far country, and the Lord answers with the question “Why have they provoked me to anger with their graven images?” Verse 20 is the exiles again (“we are not saved”), and verses 21–22 are the prophet.
    sources: [keil-jeremiah]
  - ref: 16
    phrase: The snorting of his horses was heard from Dan
    kind: history
    title: From Dan
    body: |
      Dan lay at the northern edge of the land, and the enemy is heard first there. The town was “well known as the northern limit of Palestine, which extended ‘from Dan even to Beer-sheba.’” The alarm came from Dan before ([[Jer. 4:15]]: “a voice declareth from Dan”), and it fits the direction the Lord gave Jeremiah in his first vision, when He showed a boiling pot facing from the north ([[Jer. 1:13–14]]). Verse 17 adds a second image of the same enemy: not horses but snakes that “will not be charmed.”
    sources: [bd-dan, lds-scriptures]
  - ref: 19
    phrase: Is not the LORD in Zion? is not her king in her?
    kind: history
    title: “Is not the LORD in Zion?”
    body: |
      The cry comes from “a far country”: the people, already in exile on one reading, ask whether the Lord is no longer King in Zion, “that He may release His people from captivity and bring them back to Zion.” “Her king” is the Lord Himself, not a king of Judah.

      The Lord's answer in the verse is another question: “Why have they provoked me to anger with their graven images, and with strange vanities?” The people ask where the Lord is; He asks what they have done. On this reading, their idols, not His absence, put them in the far country.
    sources: [keil-jeremiah]
  - ref: 20
    phrase: The harvest is past, the summer is ended, and we are not saved
    kind: scripture
    title: “The harvest is past”
    body: |
      The saying is the people's despair, and in the Doctrine and Covenants the Lord uses it as a warning to be heeded in time. In [[D&C 45:2]] the Lord says, “hearken unto my voice, lest death shall overtake you; in an hour when ye think not the summer shall be past, and the harvest ended, and your souls not saved.” In [[D&C 56:16]] it is the lamentation of rich men who “will not give your substance to the poor,” in “the day of visitation”: “The harvest is past, the summer is ended, and my soul is not saved!”

      In Jeremiah the people say it of themselves, after the season has gone. D&C 45:2 turns it into a warning given before the season ends, and D&C 56:16 gives it back to those who refused the warning, as their cry on the day of visitation.
    sources: [lds-scriptures]
  - ref: 21
    phrase: For the hurt of the daughter of my people am I hurt
    kind: words
    title: “Am I hurt”
    body: |
      The prophet does not stand apart from the wound: the Hebrew is a pun, “for the *shever* (breaking) of the daughter of my people I am broken (*hashbarti*).” He describes his people's injury as his own. “I am black” is a “Hebrew idiom meaning ‘gloomy,’” and “astonishment hath taken hold on me.” The next chapter opens with the same grief: “Oh that my head were waters, and mine eyes a fountain of tears” ([[Jer. 9:1]]).
    sources: [oshb-wlc, lds-scriptures]
  - ref: 22
    phrase: Is there no balm in Gilead; is there no physician there?
    kind: christ
    title: Balm in Gilead
    body: |
      The balm of Gilead was a real remedy that could not heal this wound, and the one who can is Jehovah. Gilead was “famous for its healing ointment”; Ishmaelites carried “balm” from there down to Egypt ([[Gen. 37:25]]), and in [[Jer. 46:11]] Egypt is told to go up to Gilead for balm and use “many medicines” in vain. “No healing ointment, or medication, was available for rebellious Israel. The balm of salvation could be administered only through Israel's Savior, Jehovah, whom they had rejected.”

      The question is half rhetorical: there is a physician. The Hebrew behind “health” (*arukah*) means “healing of a wound, restoration.”
    sources: [ot-manual-23, lds-scriptures, bdb]

christ: |
  The chapter's two cries, “we are not saved” (verse 20) and “is there no physician there?” (verse 22), have one answer: Israel's Savior, Jehovah, whom the people had rejected (the note on verse 22). His invitation is already in the book: “Return, ye backsliding children, and I will heal your backslidings.” See the note on [[Jer. 3:22]], which sets beside it what the Lord's voice asks of those who were spared in the Book of Mormon ([[3 Ne. 9:13]]). The word the Lord waits for in Jeremiah 8 is the one the people will not say, “What have I done?” (verse 6), and the Hebrew behind “Return” in [[Jer. 3:22]] is the *shuv* the chapter repeats.

explore: |
  - [[Jer. 6:13–15]] and [[Jer. 7:1–34]]: the first appearance of verses 10–12, and the temple sermon this chapter continues.
  - [[Jer. 9:1–26]]: the prophet's lament, which follows without a break from verses 18–22.
  - [[D&C 45:2]] and [[D&C 56:16]]: verse 20 as a warning given beforehand, and as the cry of those who refused it.
  - [[3 Ne. 9:13]] and [[Jer. 3:22]]: the invitation to return and be healed.

sources: [bd-jeremiah, lds-scriptures, ot-manual-23, clarke-commentary, keil-jeremiah, oshb-wlc, bdb, lxx-rahlfs, bd-dan]
