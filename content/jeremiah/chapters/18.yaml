chapter: 18
title: The Potter and the Clay
tagline: The Lord sends Jeremiah to watch a potter rework spoiled clay, and says that any nation, warned or promised, can change what happens to it by what it does; Judah answers by plotting against the prophet.
when: 'No date is given. The Bible Dictionary places chapters 7–20 under Jehoiakim (608–597 B.C.), and the next chapter, 19, belongs to his reign'

setting: |
  Chapter 18 gives no date. Chapters 7–20 are arranged under the reign of Jehoiakim (608–597 B.C.), and the discourse of chapter 19, which follows directly, was delivered in his reign. The Bible Dictionary lists the opposition Jeremiah met: “the priests…, the mob…, his townsmen at Anathoth,” and later the king and the army.

  The chapter is built like a short play. The Lord sends Jeremiah to a potter's workshop (verses 1–6); the potter's work becomes a statement about how the Lord deals with any nation (verses 7–10); Jeremiah delivers the message to Judah, which refuses it, and is told what refusal will cost (verses 11–17); and the people respond by plotting against him, to which he answers in a prayer (verses 18–23).

  Jeremiah teaches with an object in each of chapters 18 and 19: here the potter reworks clay on the wheel; in chapter 19 a finished jar is broken.

thread: |
  Jeremiah 18 asks **whether the Lord's word about a nation is fixed or can change, and answers that it depends on what the nation does.** The potter is free: the clay in his hand becomes whatever “seemed good to the potter” (verse 4). When a vessel is spoiled the potter does not throw the clay away; he works it again. Verses 7–10 say what that means for nations: a warning of destruction is withdrawn if the nation turns from its evil, and a promise of blessing is withdrawn if the nation does evil. The message is conditional on both sides.

  That is why the Lord says in verse 11 that He is “framing” evil against Judah and then at once says “return.” The Lord is shaping judgment as the potter shapes clay (see the note on verse 11), and it can be reshaped if Judah turns. Judah's answer, “There is no hope,” refuses the potter's work (verse 12), and the chapter ends with the people shaping something of their own: a plot against the prophet who brought the message.

sections:
  - range: 1-6
    heading: At the potter's house
    plain: |
      The word of the Lord came to Jeremiah: “Get up and go down to the potter's house, and there I will let you hear my words.” Jeremiah went down, and the potter was working at the wheels. The vessel he was making from clay was spoiled in his hand, so he made it again into another vessel, as seemed right to him. Then the Lord said, “O house of Israel, can I not do with you as this potter does? Like clay in the potter's hand, so are you in my hand, house of Israel.”
  - range: 7-10
    heading: A word about any nation
    plain: |
      “At any moment I may speak about a nation or kingdom, that I will pull it up and tear it down and destroy it. If that nation turns from the evil I spoke against, I will relent from the harm I planned to do it. And at any moment I may speak about a nation or kingdom, that I will build it and plant it. If it does evil in my sight and does not obey my voice, I will relent from the good I said I would do for it.”
  - range: 11-17
    heading: Judah's refusal
    plain: |
      “Now tell the men of Judah and the people of Jerusalem: Thus says the Lord, I am shaping disaster against you and making a plan against you. Turn back, each of you, from your evil way, and make your ways and your deeds good.” But they say, “It is hopeless. We will follow our own plans, and each of us will do what his stubborn, evil heart wants.” So the Lord says, “Ask among the nations who has heard anything like this. The virgin Israel has done a very horrible thing. Does the snow of Lebanon leave the rock of the field? Are the cold flowing waters that come from elsewhere ever forsaken? But my people have forgotten me. They burn incense to what is worthless, and it has made them stumble in their ways, off the ancient paths, onto side paths and a road not built up. So their land will be left desolate, an object of lasting scorn; everyone who passes will be appalled and shake his head. Like an east wind I will scatter them before the enemy. I will show them my back, not my face, in the day of their disaster.”
  - range: 18-23
    heading: The plot and the prayer
    plain: |
      Then they said, “Come, let us make plans against Jeremiah. The law will not perish from the priest, nor counsel from the wise, nor the word from the prophet. Come, let us strike him with the tongue and pay no attention to anything he says.” Jeremiah prays: “Listen to me, Lord, and hear what my opponents are saying. Is good to be repaid with evil? They have dug a pit for my life. Remember that I stood before you to speak good for them, to turn your anger away from them. So give their children to famine and hand them over to the sword; let their wives be childless and widowed, their men struck down by death, their young men killed in battle. Let a cry be heard from their houses when you suddenly bring raiders on them, for they have dug a pit to catch me and hidden snares for my feet. But you, Lord, know all their plans to kill me. Do not forgive their guilt or wipe out their sin from your sight. Let them be overthrown before you; deal with them in the time of your anger.”

notes:
  - ref: 2
    phrase: the potter’s house
    kind: history
    title: A visit to the potter's house
    body: |
      The Lord sends Jeremiah to watch a craftsman work, and the lesson comes as a spoken word during the visit: “there I will cause thee to hear my words.” A potter “wrought a work on the wheels,” and a vessel spoiled in his hands. The scene is easy to picture: the potter spun a lower wheel with his foot while shaping wet clay on an upper wheel, found a flaw, collapsed the clay, and “began again to shape a whole new pot.”

      The scene is the first of two. The Church edition's footnote sends the reader on to [[Jer. 19:1]], where the Lord sends Jeremiah to a potter again, this time to buy a finished jar. In chapter 18 the clay is still on the wheel and can be thrown back “in a lump” and tried again; what the finished jar means is in the note on [[Jer. 19:11]].
    sources: [lds-scriptures, tefan-potters-clay, ot-seminary-guide-jer-18]
  - ref: 4
    phrase: marred in the hand of the potter
    kind: prophets
    title: Vessels of honor and dishonor
    body: |
      The Prophet Joseph Smith confirmed a particular reading of the spoiled vessel. In December 1841 Heber C. Kimball taught the Twelve “on the parable in the 18th chapter of Jeremiah.” As he described it, clay that was marred “was cut off the wheel and then thrown back again into the mill, to go in to the next batch, and was a vessel of dishonor; but all clay that formed well in the hands of the potter, and was pliable, was a vessel of honor.” His application: “all that are pliable in the hands of God and are obedient to His commands, are vessels of honor, and God will receive them.” Joseph Smith said, “Brother Kimball has given you a true explanation of the parable.”

      “Honor” and “dishonor” are not words in Jeremiah 18; they are Paul's, from his own use of the potter: “one vessel unto honour, and another unto dishonour” ([[Rom. 9:21]]). The verse itself says only that the potter “made it again another vessel.” Kimball's explanation turns on the clay's pliability, and verses 7–10 apply the same idea to nations: what the Lord does with a nation depends on how it responds.
    sources: [ot-manual-23, tefan-potters-clay, lds-scriptures]
  - ref: 6
    phrase: as the clay is in the potter’s hand, so are ye in mine hand
    kind: scripture
    title: The potter in Isaiah, Paul, and Nephi
    body: |
      Isaiah, Paul, and Nephi use the potter image too; the Church edition's footnote gathers three of its uses: [[Isa. 45:9]], [[Rom. 9:21]], and [[2 Ne. 27:27]]. In Isaiah the clay is warned not to ask its maker, “What makest thou?” In the Book of Mormon the Lord asks of the same relation, “shall the thing framed say of him that framed it, he had no understanding?” Isaiah elsewhere turns it into a prayer: “thou art our father; we are the clay, and thou our potter” ([[Isa. 64:8]]).

      In Isaiah 45 and Romans 9 the point is the potter's right over the clay. Jeremiah 18 adds something: immediately after the image the Lord says what He will do depending on how the nation responds (verses 7–10), so the clay is not passive in the way the image alone suggests. In Hebrew, Isaiah's and Jeremiah's potter passages share one verb, *yatsar*, “to form”: the potter is the one “who forms out of clay a vessel.”
    sources: [lds-scriptures, bdb]
  - ref: 8
    phrase: I will repent of the evil that I thought to do unto them
    kind: words
    title: The Lord does not repent; men repent
    body: |
      In verse 8 “repent” means that the Lord will withdraw the punishment He announced if the nation repents. The Church edition's footnote gives the sense as “relent regarding the punishment.” The King James text uses the same English word elsewhere in the book, after Hezekiah and Judah “feared the Lord” and “the Lord repented him of the evil which he had pronounced against them” ([[Jer. 26:19]]).

      The footnote points to the Joseph Smith Translation of [[Jer. 26:13]], which restates the idea so that the change is on the human side: where the King James text has “the Lord will repent him of the evil,” the JST reads, “The Lord does not repent; men repent.” The verse then says “repent, and the Lord will turn away the evil that he hath pronounced against you.” So the Lord's word, announced beforehand, is addressed to a people who can change; and when they change, the announced evil does not come.

      This is the same mission given at the call, “to root out, and to pull down, and to destroy” and also “to build, and to plant” ([[Jer. 1:10]], the footnote on verse 7). Chapter 18 shows that those verbs are conditional on how the hearers respond.
    sources: [lds-scriptures, jst-jer-26]
  - ref: 10
    phrase: then I will repent of the good, wherewith I said I would benefit them
    kind: scripture
    title: Promises that depend on obedience
    body: |
      Verse 10 is the mirror of verse 8: a promise of blessing can also be withdrawn if the people do evil. The chapter heading states the first half (“If nations repent, the Lord withholds the evil decreed against them”), and the Church edition's footnotes on verse 10 send the reader to Restoration scripture that says the same.

      In June 1831 the Lord told the Saints, “I, the Lord, command and revoke, as it seemeth me good; and all this to be answered upon the heads of the rebellious” ([[D&C 56:4]]). Another revelation says, “I command and men obey not; I revoke and they receive not the blessing” ([[D&C 58:32]]), and the people then say “his promises are not fulfilled” ([[D&C 58:33]]). Alma tells the people of Ammonihah the either-or of verse 7 directly: He “has commanded you to repent, or he will utterly destroy you from off the face of the earth” ([[Alma 9:12]]).
    sources: [lds-scriptures]
  - ref: 11
    phrase: I frame evil against you, and devise a device against you
    kind: words
    title: The potter frames; the people devise
    body: |
      The word the KJV renders “frame” in verse 11 is the same Hebrew word as “potter” in verses 4 and 6. It is the participle *yotser* of the verb *yatsar*: the Lord is “fashioning” disaster against Judah as the potter fashions clay. The lexicon lists this verse among those where the verb is used “figurative for frame, pre-ordain, plan (in divine purpose),” and it is also the verb used for the prophet's own formation: “Jeremiah in the womb” ([[Jer. 1:5]], “Before I formed thee”).

      “Devise a device” is a participle and a noun from one root (*chashav*, “to think, devise”). The same root appears in verse 8, where the Lord “thought” to bring evil, and then twice more: Judah says, “we will walk after our own devices” (verse 12), and the plotters say, “let us devise devices against Jeremiah” (verse 18). So the chapter sets two sets of plans against each other, the Lord's and the people's. The Lord's plan comes with an exit: the next word is “return” (*shuv*), the same verb as “turn” in verse 8.
    sources: [biblehub-interlinear, bdb]
  - ref: 12
    phrase: There is no hope
    kind: words
    title: Hopeless, again
    body: |
      The Hebrew behind “There is no hope” is a single word (*no'ash*) meaning “desperate, despairing,” and the lexicon lists it with “there is no hope!” in three places: here, [[Jer. 2:25]], and [[Isa. 57:10]]. The Church edition's footnote on the verse points to the other two. In Jeremiah 2:25 the cry comes with its reason: “There is no hope: no; for I have loved strangers, and after them will I go.”

      Here the words answer the call of verse 11 to “return”: the people call it hopeless and say they will follow “our own devices.” The same book names the one they forsake: “O Lord, the hope of Israel” ([[Jer. 17:13]]), and “Jesus Christ (Jehovah in the Old Testament) is the very ‘hope of Israel.’”
    sources: [bdb, lds-scriptures, ot-manual-23, biblehub-interlinear]
  - ref: 14
    phrase: the snow of Lebanon
    kind: symbol
    title: Snow, cold water, and the rock
    body: |
      On one reading the snow and the cold streams are things in nature that do not fail, set against a people who have “forgotten” the Lord (verse 15). The verse is hard to translate and its readings differ; this one takes it as a pair of questions expecting the answer no: does the snow leave the rock of Lebanon, and do the cold streams that come down from it ever run dry?

      The same reading also hears a symbol: “the rock in the field points to the Rock of Israel,” and the cold water to Jehovah as “the fountain of living water.” The book itself uses that phrase of the Lord in [[Jer. 2:13]]: “they have forsaken me the fountain of living waters, and hewed them out cisterns, broken cisterns, that can hold no water.” There the fountain is Jehovah and the broken cisterns are false gods.
    sources: [keil-jeremiah, lds-scriptures, ot-manual-23]
  - ref: 15
    phrase: the ancient paths
    kind: scripture
    title: Old paths and a road not built
    body: |
      The “ancient paths” are the ones the Lord had pointed Judah to before: “ask for the old paths, where is the good way, and walk therein, and ye shall find rest for your souls. But they said, We will not walk therein” ([[Jer. 6:16]], the Church edition's footnote). Verse 15 says what they chose instead. They “burned incense to vanity,” which the Church edition's footnote glosses as “idols,” and so they walk “in a way not cast up.”

      A way “not cast up” is, on one reading, “one on which one cannot advance, reach the goal, or on which one suffers hurt and perishes.” The old path, in Jeremiah 6:16, leads to rest.
    sources: [lds-scriptures, keil-jeremiah]
  - ref: 17
    phrase: as with an east wind
    kind: scripture
    title: East wind and the turned back
    body: |
      The east wind is an image of sudden destruction, and the Book of Mormon uses it twice; the Church edition's footnote sends the reader to both places in Mosiah. Abinadi warns king Noah's people that they will “be smitten with the east wind” ([[Mosiah 12:6]]). Later Limhi, speaking to his own people, cites the Lord's word: “If my people shall sow filthiness they shall reap the east wind, which bringeth immediate destruction” ([[Mosiah 7:31]]).

      The second image, “I will shew them the back, and not the face,” is a reply to the people's own conduct. The Lord said earlier that “they have turned their back unto me, and not their face” ([[Jer. 2:27]], the verse in the footnote). The Lord answers them in kind.
    sources: [lds-scriptures]
  - ref: 18
    phrase: let us devise devices against Jeremiah
    kind: history
    title: The plot against Jeremiah
    body: |
      On one reading the plotters are people who feel safe: “the law shall not perish from the priest, nor counsel from the wise, nor the word from the prophet.” The claim is that Israel will always have teachers of each kind: the speakers already have priests, wise men, and prophets who say something other than Jeremiah, who speaks only of repentance and judgment, so they can afford to ignore him.

      This was not the first attempt. “They had devised devices against me,” Jeremiah says in [[Jer. 11:19]], of the plot by “the men of Anathoth” ([[Jer. 11:21]]).
    sources: [keil-jeremiah, lds-scriptures]
  - ref: 18
    phrase: let us smite him with the tongue
    kind: words
    title: Smiting with, or on, the tongue
    body: |
      “Smite him with the tongue” is “better translated ‘smite him *on* the tongue’”: lying and false testimony were punished in eastern countries “by smiting the person on the mouth with a strong piece of leather like the sole of a shoe.” Because of Jeremiah's boldness, “the people entered into a league to punish the prophet,” and on this reading they mean to punish him as a liar. The verse closes with the same aim put plainly: “let us not give heed to any of his words.”
    sources: [ot-manual-23, clarke-commentary]
  - ref: 20
    phrase: I stood before thee to speak good for them
    kind: history
    title: Jeremiah's intercession
    body: |
      Jeremiah reminds the Lord that he had been the people's advocate: he “stood before” the Lord in prayer “to speak good for them, and to turn away thy wrath from them.” In chapters 14 and 15 the Lord told him to stop: “Pray not for this people for their good” ([[Jer. 14:11]]); and, “Though Moses and Samuel stood before me, yet my mind could not be toward this people” ([[Jer. 15:1]]). So verse 20 recalls intercession for people who then “digged a pit for my soul.”

      Verse 23 shows the plot's aim: they wanted him dead.
    sources: [lds-scriptures]
  - ref: 21
    phrase: deliver up their children to the famine
    kind: history
    title: A hard prayer
    body: |
      Verses 21–23 ask the Lord to bring on the people the very judgments Jeremiah had tried to turn away. One reading takes the prayer as a request that the Lord requite them by bringing “that which Jeremiah had sought to avert,” with the kinds of death “distributed rhetorically amongst the different classes of the people”: famine for the children, the sword for the men and young men.

      The prayer asks for what the Lord had already announced: “I will consume them by the sword, and by the famine, and by the pestilence” ([[Jer. 14:12]]), and in verse 17, “I will scatter them as with an east wind before the enemy.” The request in verse 23, “forgive not their iniquity,” comes after the open offer of verses 8 and 11, which the people refused.
    sources: [keil-jeremiah, lds-scriptures]

christ: |
  The potter who speaks in verses 6 and 11 is the Lord, “Jehovah in the Old Testament,” whom the Church identifies as Jesus Christ. Isaiah gives the people's side of the image: “thou art our father; we are the clay, and thou our potter” ([[Isa. 64:8]]). Chapter 18's addition is that the Lord who shapes can also reshape: clay that spoils is not discarded but formed again, and a nation under warning is offered a way out as soon as it turns. Jeremiah himself is part of that offer: he had pleaded for the people who now plot against him (verse 20).

explore: |
  - **The next scene.** [[Jer. 19]] gives the finished jar that is broken and the valley of Hinnom; read it beside verses 1–6.
  - **Conditional prophecy.** [[Jer. 26:13–19]] shows the principle at work in Hezekiah's day; [[D&C 56:3–4]] and [[D&C 58:30–33]] state it for the latter days.
  - **The potter in the New Testament.** [[Rom. 9:20–23]] reuses the image.
  - **The earlier plot at Anathoth.** [[Jer. 11:18–23]].
  - **Further reading.** Elder Jean A. Tefan's article “Jeremiah: As Potter's Clay” (*Ensign*, October 2002) follows Jeremiah's own life through the image.

parallels:
  - ref: Mosiah 7:31; 12:6
    note: The Church edition's footnotes on Jeremiah 18:17 send the reader to the east wind in Limhi's and Abinadi's words.

sources: [lds-scriptures, jst-jer-26, bd-jeremiah, ot-manual-23, ot-seminary-guide-jer-18, tefan-potters-clay, clarke-commentary, keil-jeremiah, bdb, biblehub-interlinear]
