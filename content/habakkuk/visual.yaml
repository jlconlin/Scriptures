alt: A square stone watchtower with a stair up its side and an open, roofed lookout stands on a rocky crest against a deep blue sky. A blank stone slab leans against its base. To the right a leafless tree stands on a terraced slope of dry-stone walls, and beyond it hills and a winding river run out to the far horizon, where the sun sits low in a band of gold light.
