summary: >-
  Habakkuk begins by crying to the Lord, "how long?", over violence he cannot stop, and
  then does not leave: he takes his stand on a watchtower to see what the Lord will say.
  The answer is a vision that will surely come at its appointed time, and "the just shall
  live by his faith." The book ends in joy in the Lord when the fig tree does not
  blossom. The image holds the waiting: an empty lookout under a darkening blue sky, with
  the sun low on the horizon, and a bare tree below it.
motifs:
  - "A watchtower on the crest (Habakkuk 2:1): the largest form in the picture, a square tower of pale stone left of center, with a stone stair climbing its left side to an open lookout at the top under a flat roof on four posts, empty."
  - "A blank stone tablet (Habakkuk 2:2): a flat slab of pale stone leaning against the base of the tower, its face bare, with nothing written on it."
  - "A bare tree (Habakkuk 3:17): on the stone-walled terrace to the right of the tower, one tree with a twisted trunk and open branches, without a leaf, fruit or flower."
  - "The sun on the horizon (Habakkuk 2:3): a small sun sitting on the far horizon at the right, under a band of gold light, with a river winding through the valley below."
composition: >-
  A wide landscape with the sun on the horizon, seen from a little below the tower so
  the lookout stands against the sky. The tower stands left of center on a rocky crest,
  the tablet leaning at its foot. Low dry-stone terrace walls step down across the
  foreground, and the bare tree stands on the highest terrace to the right. Beyond, the
  land runs out across hills, cypresses and a winding river to a long low horizon, where
  the sun sits in a band of gold; the sky above the tower is deep indigo. The light comes
  low from the right, catching the tower, tablet and tree in thin gold. No storm, no
  ruined city, no figures, no animals, and no writing anywhere.
# “What's in this picture” under the image on the book page: one line for each thing, with the verse it shows.
key:
  - '**The empty lookout on the tower** is where Habakkuk takes his post to wait for the Lord’s answer: “I will stand upon my watch, and set me upon the tower, and will watch to see what he will say unto me” ([[Hab. 2:1]]).'
  - '**The blank tablet leaning at the foot of the tower** is the answer still to be written: “Write the vision, and make it plain upon tables, that he may run that readeth it” ([[Hab. 2:2]]).'
  - '**The sun low on the far horizon** stands for the long wait for the vision to come: “the vision is yet for an appointed time … though it tarry, wait for it; because it will surely come, it will not tarry” ([[Hab. 2:3]]).'
  - '**The bare tree on the terrace** stands for the harvest that fails in Habakkuk’s last prayer, when he rejoices in the Lord all the same: “Although the fig tree shall not blossom … Yet I will rejoice in the LORD” ([[Hab. 3:17–18]]).'
