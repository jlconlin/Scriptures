chapter: 3
title: Yet I Will Rejoice in the LORD
tagline: Habakkuk answers the Lord with a psalm. He sees God come from the south as He came at Sinai, in light, storm and battle; he trembles at the day that is coming; and he ends in joy though the harvest should fail.
when: 'Habakkuk prophesied in Judah about 600 B.C., probably under Josiah or Jehoiakim, as Babylon rose; the book names no king.'

setting: |
  The book ends here. In chapters 1 and 2 the prophet has complained twice and the Lord has answered twice: the Lord's word that the Chaldeans are coming, and His promise that they too will be judged. In that exchange the Lord “counseled Habakkuk to live by faith and reassured him that justice would eventually come upon the wicked,” and the book “closes with Habakkuk’s prayer and psalm of praise to God.” The chapter has its own heading to mark the change (verse 1).

  The prayer is built like a psalm and “is composed throughout after the poetry of the Psalms.” Its title names its kind of song, “upon Shigionoth,” which the Church's footnote glosses “A type of poetry”; the note on the title of [[Ps. 7]] explains the word, which stands over that psalm too. *Selah*, a musical term found “71 times in the Psalms and three times in Habakkuk” whose meaning is uncertain, comes at verses 3, 9 and 13 (see the note on [[Ps. 3:2]]). The last words of verse 19 are a direction for its use in worship; the note on verse 19 takes them up.

  Psalm 77 tells the same storm at the sea, and Habakkuk seems to have had that psalm in mind; the note on [[Ps. 77:16]] sets the two side by side.

thread: |
  The prayer is Habakkuk's reply to what he has been told. It opens “I have heard thy speech, and was afraid”: what he heard is the Lord's word in chapters 1 and 2 (see the note on verse 2). He asks the Lord to bring that work to life in his own time, and in wrath to remember mercy (verse 2).

  Then he sees God come (verses 3–15). The pictures are old ones, “references to events of Moses and Joshua’s time”: God comes from the south as He came to Sinai, the mountains shake, the sea and the rivers give way, the sun and moon stand still, and from verse 12 God marches through the land to save His people. The prayer is “for Jehovah to return and sustain Israel as in days of old.” The verbs look back, but the coming is still ahead: the prophets were “accustomed to describe the divine revelations of the future under the form of imagery drawn from the acts of God in the past,” and the psalm recalls those acts “with the intent to strengthen faith in God’s ability to act in the affairs of mankind.”

  At verse 16 he comes back to himself. He trembles, and he will wait quietly for the day of trouble. The book that opened with “O LORD, how long shall I cry” ([[Hab. 1:2]]) closes in joy: the harvest may fail and the folds may stand empty, “Yet I will rejoice in the LORD.”

sections:
  - range: 1-2
    heading: The prophet's prayer
    plain: |
      A prayer of Habakkuk the prophet, set to Shigionoth, a kind of song. O LORD, I have heard what You have said, and I am afraid. O LORD, bring Your work to life in our own time; in our own time make it known. In wrath, remember mercy.
  - range: 3-11
    heading: God comes from the south
    plain: |
      God came from Teman, the Holy One from Mount Paran. (Selah.) His glory covered the heavens, and the earth was full of His praise. His brightness was like the light; rays of light shone from His hand, and there His power was hidden. Plague went before Him, and fire went out at His feet. He stood and measured the earth; He looked, and drove the nations apart. The everlasting mountains were scattered and the ancient hills bowed down; His ways are everlasting. I saw the tents of Cushan in distress, and the tent curtains of the land of Midian trembled. Were You angry with the rivers, LORD? Was Your anger against the rivers, Your wrath against the sea, when You rode on Your horses, Your chariots of salvation? Your bow was drawn out bare; the next words, “the oaths of the tribes, even thy word,” are obscure in the Hebrew. (Selah.) You split the earth with rivers. The mountains saw You and trembled; the flood of waters swept by; the deep cried out and lifted its hands on high. The sun and moon stood still in their place at the light of Your flying arrows, at the flash of Your gleaming spear.
  - range: 12-15
    heading: God goes out to save
    plain: |
      In anger You marched through the land; in fury You trampled the nations. You went out to save Your people, to save Your anointed. You struck the head of the house of the wicked and laid it bare from the foundation to the neck. (Selah.) With his own spears You pierced the heads of his warriors, who stormed out like a whirlwind to scatter me, gloating as if to devour the poor in secret. You walked through the sea with Your horses, through the heaped-up great waters.
  - range: 16-19
    heading: Trembling, waiting, rejoicing
    plain: |
      When I heard, my insides trembled; my lips quivered at the sound. Rottenness entered my bones, and I trembled where I stood, because I must wait quietly for the day of trouble, when the invader comes up against our people. Though the fig tree does not blossom and there is no fruit on the vines, though the olive crop fails and the fields yield no food, though the flock is cut off from the fold and there is no herd in the stalls, yet I will rejoice in the LORD; I will be glad in the God of my salvation. The LORD God is my strength. He makes my feet like the feet of a deer, and He makes me walk on my high places. To the leader of the music, with my stringed instruments.

notes:
  - ref: 2
    phrase: I have heard thy speech, and was afraid
    kind: history
    title: What Habakkuk heard
    body: |
      What frightened Habakkuk is the Lord's answer in chapters 1 and 2. The prayer follows directly on those answers: “After this experience, Habakkuk felt inspired to utter a psalm of praise to God and trust in Him.” The Hebrew word behind “speech” (*šēmaʿ*) means a report or tidings, and a modern translation has “I have heard of your renown.”

      The fear returns at verse 16, which opens with the same Hebrew verb: “When I heard, my belly trembled” ([[Hab. 3:16]]). The two lines frame the vision between them. On one reading, Habakkuk “confesses that he had been afraid,” and the fear then gives way “in understanding as he bears testimony of God’s wonderful power and works.”
    sources: [rasmussen-habakkuk-1962, bdb, nrsvue, oshb-wlc, ball-prophets-names]

  - ref: 2
    phrase: revive thy work in the midst of the years
    kind: words
    title: In the midst of the years
    body: |
      Habakkuk asks the Lord to carry out His work in his own day. “Thy work” is the same Hebrew word (*pōʿal*) as in the Lord's announcement in chapter 1, “I will work a work in your days” ([[Hab. 1:5]]), where it is God's work in judgment. “Revive” translates the ordinary verb for life (*ḥāyâ*); in this form it means to “preserve alive, let live,” and this verse is listed under that sense, so the prayer is that the Lord keep His work alive.

      For “in the midst of the years” a modern translation has “in our own time”: “In our own time revive it; in our own time make it known.”

      The last line, “in wrath remember mercy,” uses the verb *raḥam*, “have compassion.” Even in the judgment he has been shown, he asks the Lord for compassion. The Lord's compassions are the subject of the note on [[Lam. 3:22]].
    sources: [oshb-wlc, nrsvue, bdb]

  - ref: 3
    phrase: God came from Teman, and the Holy One from mount Paran
    kind: history
    title: From Teman and Paran
    body: |
      Both names point south, toward Sinai, and they set God's coming in the colors of the Exodus. Teman was a district of Edom, and in poetry the name often stands for Edom as a whole (see the note on [[Jer. 49:7]]). Paran is “the desert between Judea and Sinai.” The Church's footnote says the line “alludes to historic occasions when the Lord miraculously delivered the people,” and points to Moses' blessing: “The LORD came from Sinai, and rose up from Seir unto them; he shined forth from mount Paran” ([[Deut. 33:2]]).

      Habakkuk changes one thing. Moses' verb is past, “came”; the Hebrew verb here is in the imperfect, “He will come, or comes.” Habakkuk uses it “to indicate at the very outset that he is about to describe not a past, but a future revelation of the glory of the Lord.” “As the Lord God once came down to His people at Sinai,” the same reading goes on, “so will He appear in the time to come.”

      “The Holy One” is the name Habakkuk used in his complaint, “O LORD my God, mine Holy One” ([[Hab. 1:12]]). He comes as the One “who cannot tolerate sin.”
    sources: [bdb, bd-paran, oshb-wlc, lds-scriptures, keil-habakkuk]

  - ref: 4
    phrase: he had horns coming out of his hand
    kind: words
    title: Horns, or rays of light
    body: |
      The “horns” are rays of light. The Church's footnote gives the other rendering, “rays of light are at His side,” and a modern translation reads “rays came forth from his hand.” The Hebrew *qarnayim* is the ordinary word for horns, but in this verse it means rays, of the flashes of lightning when God appears, and the verb from the same word, “send out rays,” is the one used of Moses when he came down from the mount and “the skin of his face shone” ([[Ex. 34:29]]).

      “There was the hiding of his power” follows from that picture. One older reading takes it that the light that shows Him also covers Him: “the splendour forms the covering of the Almighty God at His coming, the manifestation of the essentially invisible God.”
    sources: [lds-scriptures, nrsvue, oshb-wlc, bdb, keil-habakkuk]

  - ref: 7
    phrase: I saw the tents of Cushan in affliction
    kind: history
    title: Cushan and Midian
    body: |
      Cushan and Midian are peoples who tremble as God passes, and the Church's footnotes tie them to Israel's past. The footnotes call them “Historic allusions as in v. 3” and point to two of the Lord's deliverances: Othniel's victory over “Chushan-rishathaim king of Mesopotamia” ([[Judg. 3:10]]), and Moses' war on Midian, “Avenge the children of Israel of the Midianites” ([[Num. 31:2]]).
    sources: [lds-scriptures]

  - ref: 10
    phrase: lifted up his hands on high
    kind: symbol
    title: The deep lifts its hands
    body: |
      The deep is pictured as a person raising both hands. The words are the Hebrew idiom for lifting the hands in prayer, the one in “Lift up your hands in the sanctuary, and bless the LORD” ([[Ps. 134:2]]). Read that way, the line “seems to describe the personified deep raising its ‘hands’ (perhaps referring to waves) in praising God.”

      The Hebrew of the passage is difficult, and scholars differ “as to whether it was the deep or the sun (mentioned in the following verse)” that lifted its hands; a modern translation reads “The sun raised high its hands.”

      The scene, told in [[Ex. 14]], “likely refers to the parting of the Red Sea.” The trembling mountains of the first line take the Church's footnote back to Sinai, where “the whole mount quaked greatly” ([[Ex. 19:18]]).
    sources: [calabro-gestures, nrsvue, huntington-gathering, lds-scriptures]

  - ref: 11
    phrase: The sun and moon stood still in their habitation
    kind: scripture
    title: The sun and moon stood still
    body: |
      The line recalls the day at Gibeon. Habakkuk's words “certainly” refer “to the miracle during Joshua’s battle against the five Canaanite kings,” when Joshua said, “Sun, stand thou still upon Gibeon; and thou, Moon, in the valley of Ajalon” ([[Josh. 10:12]]). The Church's footnote also points to a Book of Mormon comment on such a miracle: “it appeareth unto man that the sun standeth still; yea, and behold, this is so; for surely it is the earth that moveth and not the sun” ([[Hel. 12:15]]).

      The words “in their habitation” use a Hebrew word for a height or “lofty abode”; here it is “the lofty abode of sun and moon,” the place in the heavens where they stand still.
    sources: [huntington-gathering, lds-scriptures, bdb]

  - ref: 13
    phrase: even for salvation with thine anointed
    kind: christ
    title: Thine anointed
    body: |
      In the psalm the anointed is the king God chose, and the Church's footnote on the line ties its “salvation” to Christ. The Hebrew word is *māšîaḥ*, “anointed,” the word behind “Messiah.” In this verse it means the “king of Israel anointed by divine command,” beside others where it is the “Davidic dynasty with Messianic ideals attached.” One older reading takes it as “the Davidic king absolutely, including the Messiah,” rather than any one king of Habakkuk's day. In that reading the anointed is the one God rescues: the Messiah “is distinguished from Jehovah, and as such is the object of divine help.”

      The footnote on “salvation” sends the reader to the Topical Guide, first to “Jesus Christ, Prophecies about,” then to “Jesus Christ, Redeemer” and “Jesus Christ, Savior,” so the Church's study helps read the salvation of this line as Christ's work. The rest of the line is the other half of the rescue: God strikes the head of “the house of the wicked,” which the older reading takes as the Chaldean royal house.
    sources: [oshb-wlc, bdb, keil-habakkuk, lds-scriptures]

  - ref: 15
    phrase: Thou didst walk through the sea with thine horses
    kind: christ
    title: Walking through the sea
    body: |
      The verse recalls the Lord bringing Israel through the sea, and in the Gospels it is Jesus who walks on the sea. The Church's footnote on “heap” adds the Jordan, where the waters “stood and rose up upon an heap” so that Israel could cross ([[Josh. 3:16]]).

      When the disciples saw Jesus “walking on the sea” ([[John 6:19]]), He was “manifested as the one exercising the power that the Hebrew Bible attributes to Jehovah alone,” and this verse is one of the passages cited for that power. The miracle reveals Him “as both the one who created the deep and brought the Israelites through it.” To the frightened disciples He said, “It is I; be not afraid” ([[John 6:20]]).
    sources: [lds-scriptures, huntsman-bread-of-life]

  - ref: 16
    phrase: that I might rest in the day of trouble
    kind: words
    title: Waiting quietly for the day of trouble
    body: |
      “Rest” here is usually taken as waiting in silence, and the line says why Habakkuk trembles. The verb (*nûaḥ*) is the ordinary one for resting and being quiet; in this verse the Hebrew is uncertain, and the usual rendering is “I wait quietly for the day of distress.” A modern translation reads “I wait quietly for the day of calamity to come upon the people who attack us.” The “day of trouble” is the day of the invader in the verse's last line. What shakes him is not a disaster already come but the waiting for it.

      The trembling is a prophet's response to what God has shown him, and Lehi's in the same Jerusalem has been set beside it. Lehi “did quake and tremble exceedingly” at what he saw and heard ([[1 Ne. 1:6]]), and his soul afterward “did rejoice” ([[1 Ne. 1:15]]); Habakkuk, “who had been greatly afraid of the vision he was shown, ended his account by praising God” (verse 18).
    sources: [oshb-wlc, bdb, nrsvue, sc-knowhy-469, lds-scriptures]

  - ref: 18
    phrase: Yet I will rejoice in the LORD
    kind: scripture
    title: Rejoicing when the harvest fails
    body: |
      Habakkuk's joy does not depend on the harvest. Verse 17 lists what could be lost: the fig and the vine, the olive, the grain of the fields, the flocks and the herds.

      Then comes “Yet.” The joy is “in the LORD” and “in the God of my salvation,” not in anything the land yields. It is the spirit of Job's “Though he slay me, yet will I trust in him” ([[Job 13:15]]): Habakkuk lists six lines of “the disasters that could come to him,” and five lines of rejoicing answer them. One reading puts the point plainly: “Everything in the telestial world is prone to collapse except the Lord.” Another sees in the declaration the prophet's “change of heart”: “even if terrible things happen to the people,” he would still “rejoice in the Lord.”
    sources: [rasmussen-habakkuk-1962, vandyke-ogden-twelve, ball-prophets-names, lds-scriptures]

  - ref: 19
    phrase: he will make my feet like hinds’ feet
    kind: symbol
    title: Hinds’ feet and high places
    body: |
      A hind is a female deer, and the picture is of swift strength that comes from God. The words echo David's song, “He maketh my feet like hinds’ feet, and setteth me upon my high places” ([[Ps. 18:33]]), and the Church's footnote takes “high places” back to Moses: “He made him ride on the high places of the earth” ([[Deut. 32:13]]) and “thou shalt tread upon their high places” ([[Deut. 33:29]]).

      Swiftness of foot was the mark of a good warrior, and here it is “a figurative expression for the fresh and joyous strength acquired in God.” To walk on the high places was “a figure denoting the victorious possession and government of a land.” Here it means “the ultimate triumph of the people of God over all oppression on the part of the power of the world,” and the prophet speaks “in the name of the believing congregation.” That is the strength he names in the first line: “The LORD God is my strength.”
    sources: [bdb, lds-scriptures, keil-habakkuk]

  - ref: 19
    phrase: To the chief singer on my stringed instruments
    kind: history
    title: For the temple music
    body: |
      The last line is a direction for performance, and it suggests the psalm was meant to be sung in the temple. It answers the heading of verse 1 and matches the headings of Psalms 4 and 6 (see the note on the title of [[Ps. 4]]). The Hebrew behind “chief singer” is a word for an overseer or director; in the psalm titles it probably means the “musical director or choirmaster.” “Possibly this prayer of Habakkuk was set to music and intended for use in the temple.”

      The line tells no more about the prophet himself. Of Habakkuk, “Nothing beyond this is known about him” than his name and title.
    sources: [bdb, ot-manual-22, bd-habakkuk]

christ: |
  The God Habakkuk prays to is the LORD (verses 2, 8, 18, 19), and “Jehovah is the premortal Jesus Christ.” The power over the sea that the psalm gives Him is the power Jesus showed when He walked on the sea (see the note on verse 15). Habakkuk's last name for Him is “the God of my salvation.”

  The joy of verses 17–19 rests on Him, not on the harvest. When everything else fails, the Lord does not, and a disciple whose fig tree does not blossom still has the Lord as his strength. That trust in God is why Habakkuk's message is “for us also today a wholesome stimulant.”

explore: |
  - **The same storm at the sea.** [[Ps. 77:16–20]] and Moses' song, [[Ex. 15:1–18]].
  - **The Lord coming from the south.** [[Deut. 33:2]]; [[Judg. 5:4–5]].
  - **The everlasting hills.** The footnote on “the perpetual hills did bow” (verse 6) points to [[D&C 133:31]].

