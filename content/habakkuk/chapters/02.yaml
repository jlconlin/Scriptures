chapter: 2
title: Write the Vision
tagline: Habakkuk climbs to his watch and waits, and the Lord answers. The vision will come at its time; the proud will not last, but the just shall live by his faith. Then the nations Babylon swallowed sing five woes over it, and the chapter ends in the silence of the Lord's temple.
when: 'Habakkuk prophesied in Judah about 600 B.C., probably under Josiah or Jehoiakim, as Babylon rose; the book names no king.'

setting: |
  Chapter 2 is the Lord’s second answer. In chapter 1 the prophet asked how long violence would go unpunished in Judah, heard that the Lord was raising up the Chaldeans, and then asked a harder question: how a God “of purer eyes than to behold evil” could let the wicked devour the man more righteous than he ([[Hab. 1:13]]). The Babylonian conquest behind that question is told in the notes on [[Jer. 25:1]] and in [Babylon and the Exile](/old-testament/guides/babylon-and-the-exile/#rulers).

  Here the answer comes, and it is that “the Chaldeans themselves will come under judgment.” Babylon’s dominance would be temporary, and the proud and violent would face judgment in the end. Until then the Lord asks something of the righteous, and verse 4 says what.

  That verse has had a long life. Paul quotes it in [[Rom. 1:17]] and [[Gal. 3:11]], and Hebrews quotes it with verse 3 ([[Heb. 10:37–38]]). Verse 14 repeats a promise of Isaiah’s ([[Isa. 11:9]]), and verse 20 opens with the same words as a psalm ([[Ps. 11:4]]).

thread: |
  Habakkuk’s own words open the chapter. Verse 1 is “the prophet’s conversation with himself”: having poured out his lament (1:12–17), he resolves to take his post and wait. From verse 2 to the end the Lord speaks.

  The answer has two parts. First comes the core of it: write the vision, wait for it, and know this much now. The proud man “will not continue,” and “the just will live through his faith” (verses 4–5). Then comes a song of five woes, each three verses long, against the Chaldean, who is addressed throughout as one man, Babylon’s king standing for his nation. “All these” who sing it (verse 6) are the nations he swallowed in verse 5. The woes name his plunder, his house built on evil gain, his cities built with blood, his shaming of the conquered, and his idols.

  Two of the woes end in a promise instead of a threat. The third ends with the earth full of the knowledge of the Lord’s glory (verse 14). The fifth ends with the Lord in His holy temple and the whole earth silent before Him (verse 20).

sections:
  - range: 1-1
    heading: On the watchtower
    plain: |
      I will stand at my post and take my place on the tower. I will watch to see what the Lord will say to me, and what I will answer when I am corrected.
  - range: 2-5
    heading: Write the vision
    plain: |
      Then the LORD answered me: “Write down the vision. Make it plain on tablets, so that the one who reads it may run. The vision is for a time God has set. It speaks of the end, and it will not lie. If it seems slow, wait for it; it will surely come and will not be late. Look at the proud man: his soul is swollen and not upright. But the righteous will live by his faithfulness. Wine betrays him too. The arrogant man does not last. His appetite is as wide as the grave; like death, he is never satisfied. He gathers every nation to himself and collects all peoples as his own.
  - range: 6-8
    heading: 'The first woe: the plunderer'
    plain: |
      “Won’t all these nations take up a saying against him, a riddle at his expense? They will say: ‘Woe to the one who piles up what isn’t his! How long can he go on? Woe to the one who loads himself with pledges taken from others!’ Won’t your creditors rise up suddenly, and those who shake you wake up? Then you will be their plunder. Because you plundered many nations, all the peoples who are left will plunder you, for the blood you shed and the violence you did to the land, to cities and to everyone who lives in them.
  - range: 9-11
    heading: 'The second woe: a nest on high'
    plain: |
      “Woe to the one who gets evil gain for his house, to set his nest up high, safe from the reach of harm! You have planned shame for your house by cutting off many peoples, and you have sinned against your own life. The very stones will cry out from the wall, and a rafter from the woodwork will answer.
  - range: 12-14
    heading: 'The third woe: a city built with blood'
    plain: |
      “Woe to the one who builds a town with bloodshed and founds a city on wrong! Isn’t it from the LORD of hosts that peoples work only to feed the fire, and wear themselves out for nothing? For the earth will be filled with the knowledge of the glory of the LORD, as the waters cover the sea.
  - range: 15-17
    heading: 'The fourth woe: the cup'
    plain: |
      “Woe to the one who makes his neighbors drink, putting his wineskin to their lips until they are drunk, so he can look on their shame! You are filled with disgrace instead of glory. Now drink yourself, and stagger. The cup in the LORD’s right hand is coming around to you, and shame will cover your glory. The violence you did to Lebanon will overwhelm you, and the slaughter of its animals will terrify you, for the blood you shed and the violence you did to the land, to cities and to everyone who lives in them.
  - range: 18-20
    heading: 'The fifth woe: the idols, and the LORD in His temple'
    plain: |
      “What good is a carved image once its maker has carved it, or a metal image, a teacher of lies? Its maker trusts in what he made, though it is only a dumb idol. Woe to the one who says to wood, ‘Wake up!’ and to silent stone, ‘Get up!’ Can it teach? It is plated with gold and silver, and there is no breath in it at all. But the LORD is in His holy temple. Let all the earth be silent before Him.”

notes:
  - ref: 1
    phrase: what I shall answer when I am reproved
    kind: history
    title: A watchman waiting for the answer
    body: |
      Habakkuk takes his post like a sentry and waits for the Lord to answer his complaint. The “watch” and the “tower” are a sentry’s places; a modern translation has “I will stand at my watchpost and station myself on the rampart.”

      “When I am reproved” translates a noun that can mean “argument” or “reproof,” and here it can point either way. Read as the King James has it, Habakkuk expects to be corrected for questioning God; he “anticipates rebuke.” Read as his own “argument,” the word’s sense when Job would “fill my mouth with arguments” before God ([[Job 23:4]]), he waits to see what the Lord will answer “concerning my complaint,” as the modern translation has it: the charge he laid before God in [[Hab. 1:13–17]]. Either way, the answer that follows “is not really reproof!” The Lord does not scold him for asking. He tells him what to write and how to wait.
    sources: [nrsvue, bdb, rasmussen-habakkuk-1962]

  - ref: 2
    phrase: that he may run that readeth it
    kind: words
    title: Plain enough to run with
    body: |
      The Lord’s first command is to write the vision down and “make it plain,” and the line about running is read two ways. On one reading the writing is to be plain enough for anyone to read; a modern translation has “so that a runner may read it.”

      On the other reading, the one who reads it is a herald who runs with it; another modern translation has “so that a herald may run with it.” A Latter-day Saint reading takes it so: the Lord commissions “a book that a herald from the Lord’s council was to carry forth with speed.” The same reading sets beside it the book Lehi was given to read in his first vision ([[1 Ne. 1:11]]), a contemporary of Habakkuk’s in Jerusalem, and proposes that Lehi too was meant to “deliver his message post haste.”
    sources: [nrsvue, niv, welch-calling-prophet]

  - ref: 3
    phrase: though it tarry, wait for it
    kind: scripture
    title: Though it tarry
    body: |
      The verse seems to contradict itself: “though it tarry,” and then “it will not tarry.” The Hebrew uses two different verbs: the first means to linger, the second to delay. A modern translation brings out the difference: “If it seems to tarry, wait for it; it will surely come; it will not delay.” The vision may seem slow to the man on the tower, but it will not miss the time God has appointed for it.

      In context the vision belongs to the answer that follows: Babylon’s dominance would be temporary, and the woes of verses 6–20 say how it would end. The answer has been compared to the one given to others who asked the same question: “the judgments are not all in as yet. You do not know the ends to which the ways of God shall lead.” Among those others is Joseph Smith in Liberty Jail, who was told that his afflictions “shall be but a small moment” and that “if thou endure it well, God shall exalt thee on high” ([[D&C 121:7–8]]). His cry from the jail is set beside Habakkuk’s in the note on [[Hab. 1:2]].
    sources: [oshb-wlc, bdb, nrsvue, rasmussen-habakkuk-1962, scripture-helps-micah]

  - ref: 4
    phrase: by his faith
    kind: words
    title: Faith that holds steady
    body: |
      The faith of this verse is faithfulness, trust that holds steady over time. The Hebrew is *beʾĕmûnātô*, by his *ʾĕmûnâ*, and the noun “denoted not just ‘faith’ but durative and perdurative ‘faithfulness’ or ‘steadfastness’” (*durative* meaning lasting through time). It comes from a root meaning “to be firm,” “to endure.” The Church’s footnote gives the same two words, and a modern translation reads “the righteous live by their faithfulness.”

      The same word describes Moses’ hands at Rephidim, held up by Aaron and Hur so that “his hands were steady until the going down of the sun” ([[Ex. 17:12]]). Lasting steadiness is what the word carries: hands that hold firm until the day is done.

      The other half of the verse is its opposite. The proud Babylonian’s soul is “lifted up.” The Hebrew verb may mean “swell,” though the lexicon marks the meaning as uncertain; a modern translation has “Look at the proud!” One soul is swollen with itself and “not upright”; the other lives by faithfulness. To Judah, facing Babylon, the line was a call to trust the Lord and remain faithful while His promises were still unfulfilled.
    sources: [oshb-wlc, reynolds-faith-faithfulness, lds-scriptures, bowen-ammon-amn, scripture-helps-micah, bdb, nrsvue]

  - ref: 4
    phrase: the just shall live
    kind: scripture
    title: The verse Paul built on
    body: |
      Paul quoted this line more than once to show “the eternal importance of faith.” In Romans it is his scriptural proof for the statement that opens the letter’s argument: the gospel reveals “the righteousness of God ... from faith to faith: as it is written, The just shall live by faith” ([[Rom. 1:17]]). In Galatians it is his evidence that the law could not make anyone righteous: “no man is justified by the law in the sight of God, it is evident: for, The just shall live by faith” ([[Gal. 3:11]]).

      Paul’s form drops the pronoun, and the Greek translation of Habakkuk had already changed it: “the just shall live by my faith,” the Lord’s own.

      One Latter-day Saint reading takes Paul further. Since “the righteous” was “a common messianic title,” Paul in Galatians “interprets Habakkuk’s statement to be that Christ is the just person,” who “lives by overcoming death and is able to do so because of His faith.” It is a reading of Paul, not a claim about what Habakkuk meant. In Habakkuk the just man is any faithful Judahite waiting out Babylon.
    sources: [scripture-helps-micah, strathearn-faith-christ, lxx-rahlfs]

  - ref: 5
    phrase: he transgresseth by wine
    kind: history
    title: Wine, and a hunger like the grave
    body: |
      Verse 5 goes on with the proud man of verse 4, the Babylonian, and its first image is wine. Where the King James has “he transgresseth by wine,” the Hebrew calls the wine treacherous: it betrays the one who drinks it. Some ancient Hebrew manuscripts read a different word here, and a modern translation follows them: “wealth is treacherous.” Its footnote marks the standard (Masoretic) text’s “wine.” Either way, what the Chaldean trusts in betrays him.

      The rest of the verse is his appetite. He enlarges his desire “as hell,” and “is as death, and cannot be satisfied.” “Hell” is Sheol (explained in the note on [[Jonah 2:2]]); the modern translation has “They open their throats wide as Sheol; like Death they never have enough.” An empire that gathers “all nations” and “all people” into itself is a grave that is never full.
    sources: [scripture-helps-micah, bdb, nrsvue]

  - ref: 6
    phrase: take up a parable against him, and a taunting proverb against him
    kind: history
    title: Sayings with riddles, in the mouths of the nations
    body: |
      The five woes are put into the mouths of “all these,” the “nations” and “people” the Chaldean gathers to himself in verse 5. To “take up a parable” is the Hebrew idiom for uttering a *māšāl*, a “prophetic figurative discourse.” The same idiom is used for Balaam’s oracles ([[Num. 23:7]]) and for Isaiah’s song over the king of Babylon ([[Isa. 14:4]]). The phrase the King James renders “a taunting proverb” adds a word for “riddles”: “enigmatic sentences and comparisons, declaring fate of Chaldeans.” Some of their words play on two meanings, as the next note shows. A modern translation catches the tone: the nations “taunt such people and, with mocking riddles,” speak against them.
    sources: [bdb, nrsvue]

  - ref: 6
    phrase: ladeth himself with thick clay
    kind: words
    title: Loaded with pledges
    body: |
      “Thick clay” is the first of the riddles, and it means a load of pledges, things taken as security for debts. The Hebrew word, found only here, means “weight of pledges, heavy debts.” A modern translation reads “How long will you load yourselves with goods taken in pledge?” The conqueror has taken the nations’ goods as security and piled them on himself.

      Verse 7 carries the picture forward with a play on words. “They ... that shall bite thee” uses a verb for the bite of a serpent, here a figure of oppression “with play on sense thy debtors, those that give thee interest,” since the same verb is used of lending at interest. The modern translation renders it “your own creditors.” The one who seized the pledges will find his own creditors at the door, and “then you will be plunder for them.”
    sources: [bdb, nrsvue, lds-scriptures]

  - ref: 8
    phrase: all the remnant of the people shall spoil thee
    kind: scripture
    title: The wicked punished by the wicked
    body: |
      The first woe ends with the Lord’s answer to Habakkuk’s hardest question: the plunderer will be plundered. “All who survive of the peoples shall plunder you,” and Isaiah and Jeremiah name the Medes among those who would one day conquer Babylon: “I will stir up the Medes against them” ([[Isa. 13:17]]); “Prepare against her the nations with the kings of the Medes” ([[Jer. 51:28]]). Isaiah had called Assyria the rod of the Lord’s anger and then pronounced its doom ([[Isa. 10:5–15]]). Habakkuk “prophesied against Babylon in the same way that Isaiah prophesied against Assyria”: Babylon was the Lord’s arm against Judah, and “like Assyria, Babylon would be destroyed.”

      Chapter 2’s answer has been set beside Mormon’s: “it is by the wicked that the wicked are punished; for it is the wicked that stir up the hearts of the children of men unto bloodshed” ([[Morm. 4:5]]). Mormon explains how a wicked nation can be the instrument of judgment; Habakkuk 2 adds that the Chaldeans who carry it out will themselves be judged.
    sources: [nrsvue, lds-scriptures, vandyke-ogden-twelve, bd-habakkuk]

  - ref: 9
    phrase: that he may set his nest on high
    kind: symbol
    title: A nest set on high
    body: |
      On one reading the nest is the Chaldean’s dynasty, built high so no one can reach it. His “house” here is then not a palace but “the royal house of the Chaldaean, his dynasty,” and “as the eagle builds its nest on high, to protect it from harm ... so does the Chaldaean seek to elevate and strengthen his rule by robbery and plunder.” The great buildings Nebuchadnezzar raised to fortify Babylon may be in view, but the figure covers everything he did to make his rule permanent. Edom’s pride is pictured the same way ([[Obad. 1:4]]).

      The plan defeats itself: it brings to his house “instead of honour and lasting glory, only shame and ruin.” Verse 11 gives the house a voice. The stones in its walls and the beams in its roof, paid for with evil gain, cry out against the man who built with them; the Church’s footnote reads the second line “a rafter out of the woodwork will witness it,” so the house itself testifies against its builder.
    sources: [keil-habakkuk, lds-scriptures]

  - ref: 14
    phrase: the knowledge of the glory of the LORD
    kind: scripture
    title: Filled with His glory, not Babylon's
    body: |
      The promise of verse 14 is Isaiah’s ([[Isa. 11:9]]), and here it stands in the middle of the woes, right after the verse that says Babylon’s building will come to nothing. Verse 13 says the peoples “labour in the very fire”; a modern translation has “labor only to feed the flames, and nations weary themselves for nothing.” The Church’s footnote points to Jeremiah, who uses the same words of the fall of Babylon ([[Jer. 51:58]]).

      Habakkuk’s line differs from Isaiah’s. Isaiah has “the knowledge of the LORD”; Habakkuk has “the knowledge of the glory of the LORD.” In Isaiah the line describes the peace of the kingdom once it has come, which the site’s note on [[Isa. 11:9]] reads of the Millennium. In Habakkuk it follows the fall of the city built with blood. It is “the millennial promise” all the same, “made to Habakkuk as to Isaiah.”
    sources: [lds-scriptures, nrsvue, rasmussen-habakkuk-1962]

  - ref: 16
    phrase: the cup of the LORD’s right hand shall be turned unto thee
    kind: symbol
    title: The cup comes round
    body: |
      The fourth woe describes the conquest of nations as getting a neighbor drunk in order to shame him, and then turns the cup back on the one who poured it. The image is figurative: “the prostrate condition of the drunken man is a figurative representation of the overthrow of a conquered nation,” on one reading, and the exposure is the disgrace that falls on it. By shaming others the Chaldean “has thereby simply prepared shame for himself.”

      Now the Lord’s cup comes round to him. “Let thy foreskin be uncovered” is the Hebrew’s crude image of the same exposure. An ancient Hebrew manuscript and the Greek translation read differently, and the Greek has “shake, O heart, and quake.” A modern translation follows them: “Drink, you yourself, and stagger!” The cup of the Lord’s fury is traced through Jeremiah in [The Cup of the Lord’s Fury](/jeremiah/themes/cup-of-fury/).
    sources: [keil-habakkuk, nrsvue, lxx-rahlfs]

  - ref: 18
    phrase: a teacher of lies
    kind: history
    title: A teacher of lies
    body: |
      The “teacher of lies” is the idol itself, set beside the “molten image,” and one reading takes it as “so designated in contrast with the true God, the teacher in the highest sense.” It teaches a lie by being there: it “sustains the delusion ... that it is God.” The Chaldean, like his neighbors, “trusted in the power of his gods,” and this last woe cuts off his last hope of help.

      Verse 19 makes the point with a joke. The worshipper tells a block of wood to wake up and a stone to rise, and the King James has him add “it shall teach!” The Hebrew can be read as a question, “Should it teach?”, and a modern translation reads it so: “Can it teach? See, it is gold and silver plated, and there is no breath in it at all.” Isaiah mocks the idol-maker at greater length in [[Isa. 44:9–20]].
    sources: [keil-habakkuk, nrsvue]

  - ref: 20
    phrase: let all the earth keep silence before him
    kind: scripture
    title: Silence before the Lord
    body: |
      The chapter ends by setting the living God against the dumb idols: they have “no breath at all,” but “the LORD is in his holy temple.” “Keep silence” is a single Hebrew word, an interjection, “hush! keep silence.” The same call to be silent before the Lord stands in Zephaniah, for the day of the Lord ([[Zeph. 1:7]]), and in Zechariah ([[Zech. 2:13]]).

      The sentence has been read devotionally as “another way of saying, ‘Be still; I’m aware of your concerns; know that I am God,’” and the whole book as saying “that God is in charge.” The first clause stands also in [[Ps. 11:4]], where the site’s note explains the temple as the Lord’s palace and throne.
    sources: [bdb, vandyke-ogden-twelve]

christ: |
  Hebrews reads verses 3 and 4 of Christ’s coming. The Greek translation made the vision a person (“wait for him; for he will surely come”), and the writer of Hebrews takes it “as Messianic, and applied to the speedy coming of the Messiah to judgment”: “For yet a little while, and he that shall come will come, and will not tarry. Now the just shall live by faith” ([[Heb. 10:37–38]]). The Church’s footnote on “come” points to the Lord’s word about His Second Coming: “the day or the hour no man knoweth; but it surely shall come” ([[D&C 39:21]]).

  The promise to the just is life through faithfulness, not escape from every trial. Joseph Smith taught in 1839 that “it is a false idea that the saints will escape all the judgements whilst the wicked suffer,” that many will escape, “for the just shall live by faith,” and that many of the righteous will fall to disease “and yet be saved in the Kingdom of God.” A disciple who waits for the Lord’s promises lives by the same steadfast trust, sure that He will come at His appointed time.

explore: |
  - **Another song over Babylon.** Isaiah is told to “take up this proverb against the king of Babylon” ([[Isa. 14:4–23]]), with the same Hebrew idiom as verse 6.
  - **Babylon’s labor for the fire.** [[Jer. 51:58]], and the whole of Jeremiah 50–51.
  - **Living by faith while waiting.** [[Heb. 10:32–39]], where the writer quotes verses 3–4 to Christians enduring persecution.
  - **The cup.** [The Cup of the Lord’s Fury](/jeremiah/themes/cup-of-fury/).

