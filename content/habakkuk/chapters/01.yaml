chapter: 1
title: O LORD, How Long Shall I Cry?
tagline: The prophet complains that the Lord does nothing about the violence in Judah. The Lord answers that He is raising up the Chaldeans, and the prophet asks again how a holy God can let the wicked swallow up those more righteous than they.
when: 'Habakkuk prophesied in Judah about 600 B.C., probably under Josiah or Jehoiakim, as Babylon rose; the book names no king'

setting: |
  The book calls him “Habakkuk the prophet” and nothing more: no father, no town, no king. He was a prophet of Judah. The date is uncertain, possibly under Josiah or Jehoiakim, about 600 B.C. In verse 5 the Lord's work is to come “in your days,” within the lifetime of those who hear it, though that does not fix a year. Many scholars place the book between Babylon's victory at Carchemish in 605 B.C. and the first deportation of Jews in 597; if so, Habakkuk prophesied to the same people as Jeremiah and Lehi (see [[Jer. 1:4]]). After Josiah fell at Megiddo in 609, every king after him did evil and his reforms were overturned. In 605 Babylon took the land from Egypt ([[Jer. 25:1]]; [Babylon and the Exile](/old-testament/guides/babylon-and-the-exile/)).

  His name probably comes from a Hebrew root meaning to clasp or embrace: “one who embraces or one who is embraced.” What he received is a “burden” (verse 1), the word that heads a prophet's oracle: an utterance or oracle, a revelation he “did see.”

  The book is unlike most of the other prophets. Instead of the Lord's words to the people, it gives the prophet speaking for the people, who “addresses and challenges the Lord.” It records an exchange between Habakkuk and the Lord (chapters 1–2) and closes with his prayer and psalm (chapter 3).

thread: |
  The chapter is the first half of a conversation, and the King James text does not mark where the speaker changes. Habakkuk speaks first (verses 2–4): he cries out, and the Lord seems to do nothing about the iniquity among His own covenant people. From verse 5 the Lord answers, speaking to the prophet and to Judah together: He is doing something, and they will not believe it. He is raising up the Chaldeans (verses 5–11). Then Habakkuk speaks again (verses 12–17), and the answer has only added to his confusion: how can a holy God use a nation more wicked than Judah to punish it?

  So the chapter turns twice. “Thou wilt not save” (verse 2) is answered by “I will work a work” (verse 5), and the work is a nation more wicked than the people it punishes. The prophet ends as he began, with a question, now about the Chaldean: will he “not spare continually to slay the nations?” (verse 17). The answer waits for chapter 2. The whole book moves from “how long shall I cry” to “Yet I will rejoice in the LORD” ([[Hab. 3:18]]), a movement that can be read in his name: the prophet comes to “embrace” the will of God.

sections:
  - range: 1-4
    heading: The prophet's complaint
    plain: |
      The oracle that Habakkuk the prophet saw. LORD, how long must I cry for help, and You do not listen? I cry out to You, “Violence!” and You do not save. Why do You make me look at wrongdoing and see such trouble? Destruction and violence are in front of me; quarrels and strife break out. So the law has gone numb, and justice never comes out right. The wicked hem in the righteous, and so justice comes out twisted.
  - range: 5-11
    heading: The Lord's answer
    plain: |
      Look among the nations and watch, and be utterly amazed: I am doing a work in your own days that you would not believe if you were told. I am raising up the Chaldeans, that bitter and impetuous nation, who march across the breadth of the earth to seize homes that are not theirs. They are terrible and dreadful; their law and their dignity come from themselves. Their horses are swifter than leopards and fiercer than wolves at dusk. Their horsemen spread out; they come from far away, swooping like an eagle that hurries to eat. They all come for violence; their faces swallow up like the east wind, and they gather captives like sand. They mock kings and make sport of rulers; they laugh at every fortress, for they pile up earth against it and take it. Then they sweep on like the wind and pass over, and become guilty: their own strength is their god.
  - range: 12-17
    heading: The prophet's second question
    plain: |
      Are You not from everlasting, LORD, my God, my Holy One? We will not die. LORD, You have appointed them to bring judgment; mighty God, You have set them up to correct. Your eyes are too pure to look on evil, and You cannot look on wrong. Why then do You look on at the treacherous, and keep silent while the wicked swallows up someone more righteous than he? You make people like the fish of the sea, like small creatures with no ruler over them. He hauls them all up with a hook, drags them out in his net, gathers them in his fishing net, and so he rejoices and is glad. So he sacrifices to his net and burns incense to his fishing net, because by them he lives richly and eats well. Will he keep on emptying his net, and go on slaying nations without pity?

notes:
  - ref: 2
    phrase: how long shall I cry, and thou wilt not hear
    kind: scripture
    title: How long, O LORD?
    body: |
      Habakkuk's first words are a complaint to God. Job, Jeremiah and Joseph Smith felt in their trials much as he did, and the Psalms are full of pleas for God to hear in bitter trouble. Joseph Smith's prayer from the jail at Liberty, Missouri, is like Habakkuk's: “How long shall thy hand be stayed” ([[D&C 121:2]]). The site's notes on [[Isa. 6:11]] and [[Isa. 42:14]] follow that prayer further.

      What he complains of is the “violence” and iniquity he sees and cannot stop, and a God who seems not to hear. His questions are “bold and heartfelt,” asked out of concern for his people. When he later waits on his watchtower to see what the Lord will say to him, and what he will answer when he is “reproved” ([[Hab. 2:1]]), the answer that comes is not reproof.
    sources: [rasmussen-habakkuk-1962, vandyke-ogden-twelve, scripture-helps-micah, lds-scriptures]

  - ref: 4
    phrase: the law is slacked
    kind: words
    title: The law gone numb
    body: |
      “Slacked” translates the Hebrew *pûg*, “grow numb”; the footnote gives “grows cold.” Used of the law here, the verb means it has become ineffective. The law is still there; it no longer does anything, because “the wicked doth compass about the righteous” and justice either never comes out or comes out twisted. The prophet's outcries are “against wrongdoing in Judah.”
    sources: [bdb, lds-scriptures, bd-habakkuk]

  - ref: 5
    phrase: I will work a work in your days
    kind: scripture
    title: Paul’s warning at Antioch
    body: |
      The Lord's answer begins by telling Judah to look among the nations and be astonished: He is about to do, within their own lifetime, a thing they would not believe if they were told. Paul closed his sermon in the synagogue at Antioch in Pisidia with these words ([[Acts 13:40–41]]), as a warning to those who would not believe the gospel he preached.

      Paul's form of it, “Behold, ye despisers, and wonder, and perish,” is close to the Greek Septuagint, which reads “Behold, ye despisers, and look, and wonder marvelously, and vanish.” Where the Septuagint has “ye despisers,” the King James has “among the heathen” and the NRSVue “Look at the nations.” In Habakkuk the work no one would believe is the Lord's use of the Chaldeans against His own people.
    sources: [lds-scriptures, lxx-rahlfs, nrsvue]

  - ref: 6
    phrase: I raise up the Chaldeans
    kind: history
    title: The Chaldeans
    body: |
      Chaldea was strictly the part of Babylonia that lay south and east of Babylon, but after Jeremiah's day the name could stand for the whole land between the Tigris and the Euphrates. In Habakkuk the Chaldeans are the Neo-Babylonians, the dynasty of Nabopolassar that rose after 625 B.C. and became the great power of the Near East as Assyria fell (614, 612 and 605 B.C.). The site's note on [[Jer. 25:1]] tells of the year Babylon rose.

      The answer to the prophet's complaint is that Judah will fall to “a bitter, hasty, terrible, and dreadful nation.”
    sources: [bd-chaldea, rasmussen-habakkuk-1962, vandyke-ogden-twelve]

  - ref: 10
    phrase: they shall heap dust, and take it
    kind: symbol
    title: Heaping dust
    body: |
      To “heap dust” is to pile up an earthen ramp against a city wall; the NIV has “by building earthen ramps they capture them.” Ezekiel was told to act out the coming siege of Jerusalem in the same way, to “cast a mount against it” ([[Ezek. 4:2]]), a cross-reference the ESV gives. The line pictures how easily the Chaldeans take every fortress: they scoff at kings, laugh at every stronghold, pile up earth, and the city is theirs.
    sources: [niv, esv, lds-scriptures]

  - ref: 11
    phrase: imputing this his power unto his god
    kind: words
    title: Strength as a god
    body: |
      The line on the Chaldean's power can be read two ways. The King James has the Chaldean crediting his power to his god, a charge of “imputing power to their idolatrous gods.” The Hebrew can also be read “this its strength is its god”: the Chaldean makes his own power into his god, and the NRSVue has “their own might is their god!” Read that way, the line is close to the Assyrian's boast in Isaiah, “By the strength of my hand I have done it” ([[Isa. 10:13]]).

      Either way, the line names the Chaldean's guilt: he “shall pass over, and offend.”
    sources: [vandyke-ogden-twelve, keil-habakkuk, nrsvue]

  - ref: 12
    phrase: thou hast ordained them for judgment
    kind: scripture
    title: Ordained for judgment
    body: |
      The prophet's second speech opens in confidence. The LORD is “from everlasting,” his God and his Holy One, and so “we shall not die.” Troubled as he is, he recognizes that God is still “at the helm”: He has “ordained” the Chaldeans “for judgment” and “established them for correction,” a chastening, not the end of the people. Where the King James has “O mighty God,” the NRSVue has “O Rock.”

      Habakkuk prophesied against Babylon as Isaiah prophesied against Assyria in [[Isa. 10]]: the empire would be used as God's arm against Judah, and then, like Assyria, destroyed (see the note on [[Isa. 10:5]]). Mormon, writing of the wars between the Nephites and the Lamanites, stated the principle plainly: “the judgments of God will overtake the wicked; and it is by the wicked that the wicked are punished” ([[Morm. 4:5]]). It speaks to this book's question, whose answer comes in chapter 2: the Chaldeans themselves will come under judgment.
    sources: [rasmussen-habakkuk-1962, nrsvue, vandyke-ogden-twelve, lds-scriptures, bd-habakkuk]

  - ref: 13
    phrase: the man that is more righteous than he
    kind: history
    title: More righteous than he?
    body: |
      The prophet's question is the book's hard one. The Lord is “of purer eyes than to behold evil,” so why does He watch in silence while the wicked swallows up a man more righteous than he? The problem is why a pure and holy God should use “such a sinful nation” to work out His purposes. Jeremiah's “Wherefore doth the way of the wicked prosper?” ([[Jer. 12:1]]) and Joseph Smith's prayer in [[D&C 121]] are like it.

      “More righteous” is the prophet's comparison of his people with a nation more wicked than Judah, not a verdict that Judah is righteous: his first complaint was of violence and iniquity in Judah (verses 2–4), and the Chaldeans come to punish the wicked among his own people. Many in Judah thought their lot unfair, and Habakkuk's willingness to question God's justice shows how widespread the feeling was. Laman and Lemuel said the same of Jerusalem, that its people “were a righteous people” ([[1 Ne. 17:22]]), and they were far from right.
    sources: [bd-habakkuk, gs-habakkuk, ot-manual-22, ball-prophets-names, draper-exile]

  - ref: 16
    phrase: they sacrifice unto their net
    kind: symbol
    title: Sacrifice to a net
    body: |
      Verses 14–17 picture conquest as fishing. The nations, Judah among them, become fish of the sea and small creatures “that have no ruler over them,” and one reading takes this to mean that God has, as it were, ceased to be their king and given them up helpless to their enemy. The Chaldean hauls them up with hook, net and dragnet, and rejoices.

      Then he worships the net. To sacrifice and burn incense to it is to give the means of his success the honour due to God. The chapter stops on the question the image leaves: will he go on emptying his net and slaying nations forever (verse 17)? The prophet takes that question to his watchtower ([[Hab. 2:1]]).
    sources: [keil-habakkuk]

christ: |
  Habakkuk's cry, “how long … and thou wilt not hear,” belongs with the Psalms' pleas for God to hear in bitter trouble, and the Saviour quoted one of them on the cross: “My God, my God, why hast thou forsaken me?” ([[Matt. 27:46]]; [[Ps. 22:1]]). The Lord who seems silent in verse 2 is already at work in verse 5, and He answers His prophet not with reproof but with a promise, as He answered Joseph Smith ([[D&C 121:7–8]]).

  A disciple who watches wrong go unchecked, in the world or among the Lord's own people, can say so to Him in plain words, as Habakkuk and Joseph Smith did ([[D&C 121:1–3]]). The answer to Joseph began “My son, peace be unto thy soul” ([[D&C 121:7]]).

