chapter: 3
claims:
  - where: 'when'
    claim: 'Habakkuk lived in Judah, likely under Josiah or Jehoiakim, in the late 600s and early 500s BC'
    key: scripture-helps-micah
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/47-micah-nahum-habakkuk-zephaniah?lang=eng'
    quote: 'he was a prophet who lived in the Kingdom of Judah, likely during the reigns of Josiah or Jehoiakim in the late 600s and early 500s BC'
  - where: 'when'
    claim: 'Habakkuk prophesied about 600 B.C., possibly under Josiah or Jehoiakim'
    key: bd-habakkuk
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/habakkuk?lang=eng'
    quote: 'The date at which he prophesied is uncertain—possibly in the reign of Josiah or of Jehoiakim (about 600 B.C.).'
  - where: 'setting'
    claim: 'Chapters 1 and 2 hold two complaints of the prophet and two answers of the Lord'
    key: keil-habakkuk
    url: 'https://biblehub.com/commentaries/kad/habakkuk/3.htm'
    quote: 'an echo of the two answers which the prophet had received from the Lord to his complaints in Habakkuk 1:2-4 and Habakkuk 1:12-17'
  - where: 'setting'
    claim: 'Habakkuk 3:10–15 shares the scene of Psalm 77, which Habakkuk evidently had in mind'
    key: keil-habakkuk
    url: 'https://biblehub.com/commentaries/kad/habakkuk/3.htm'
    quote: 'The points of contact in Habakkuk 3:10-15 with Psalm 77:17-21, are still more marked, and are of such a kind that Habakkuk evidently had the psalm in his mind'
  - where: 'setting'
    claim: 'The book is an exchange with the Lord and closes with Habakkuk’s prayer and psalm of praise'
    key: scripture-helps-micah
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/47-micah-nahum-habakkuk-zephaniah?lang=eng'
    quote: 'In response, the Lord counseled Habakkuk to live by faith and reassured him that justice would eventually come upon the wicked. The book closes with Habakkuk’s prayer and psalm of praise to God.'
  - where: 'setting'
    claim: 'The footnote glosses Shigionoth as a type of poetry'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hab/3?lang=eng'
    quote: '1a “Shigionoth”: A type of poetry.'
  - where: 'setting'
    claim: 'Selah occurs 71 times in the Psalms and three times in Habakkuk; its meaning is uncertain'
    key: bd-selah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/selah?lang=eng'
    quote: 'A musical term that occurs 71 times in the Psalms and three times in Habakkuk. Its meaning is uncertain.'
  - where: 'setting'
    claim: 'The prayer is composed after the poetry of the Psalms'
    key: keil-habakkuk
    url: 'https://biblehub.com/commentaries/kad/habakkuk/3.htm'
    quote: 'Habakkuk''s prayer is composed throughout after the poetry of the Psalms'
  - where: 'setting'
    claim: 'The last words of 3:19 are a subscription for use in worship, like the headings of Psalms 4 and 6'
    key: keil-habakkuk
    url: 'https://biblehub.com/commentaries/kad/habakkuk/3.htm'
    quote: 'do not form part of the contents of the supplicatory ode, but are a subscription answering to the heading in Habakkuk 3:1, and refer to the use of the ode in the worship of God, and simply differ from the headings למנצּח בּנגינות in Psalm 4:1-8; Psalm 6:1-10'
  - where: 'thread'
    claim: 'The chapter falls into the prayer (3:2), the theophany (3:3–15) and the prophet’s response, fear then joy (3:16–19)'
    key: keil-habakkuk
    url: 'https://biblehub.com/commentaries/kad/habakkuk/3.htm'
    quote: 'He then proceeds in Habakkuk 3:3-15 to depict in a majestic theophany the coming of the Lord to judge the world, and bring salvation to His people and His anointed; and secondly, in Habakkuk 3:16-19, to describe the fruit of faith'
  - where: 'thread'
    claim: 'At 3:12 the description turns to the judgment on the nations for the rescue of God’s people'
    key: keil-habakkuk
    url: 'https://biblehub.com/commentaries/kad/habakkuk/3.htm'
    quote: 'In Habakkuk 3:12 there follows a description of the judgment upon the nations for the rescue of the people of God.'
  - where: 'thread'
    claim: 'The prophets describe the future under imagery drawn from God’s past acts'
    key: keil-habakkuk
    url: 'https://biblehub.com/commentaries/kad/habakkuk/3.htm'
    quote: 'the saving acts of God on behalf of His people are essentially the same in all ages, and that the prophets generally were accustomed to describe the divine revelations of the future under the form of imagery drawn from the acts of God in the past'
  - where: 'thread'
    claim: 'The prayer is for Jehovah to return and sustain Israel as in days of old, with references to Moses’ and Joshua’s time'
    key: ot-manual-22
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-22?lang=eng'
    quote: 'Habakkuk makes a number of references to events of Moses and Joshua’s time. Anyone familiar with those biblical events will recognize the ones alluded to. The burden of Habakkuk’s prayer is for Jehovah to return and sustain Israel as in days of old.'
  - where: 'thread'
    claim: 'The allusions to the Exodus are meant to strengthen faith in God’s power in their own affairs'
    key: huntington-gathering
    url: 'https://rsc.byu.edu/vol-9-no-1-2008/jeremiah-new-paradigm-gathering'
    quote: 'They emphasized God’s central role in these monumental events with the intent to strengthen faith in God’s ability to act in the affairs of mankind and, more important, God’s power in their own affairs.'
  - where: 'section 1 plain'
    claim: '“In the midst of the years” rendered “in our own time”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Habakkuk+3&version=NRSVUE'
    quote: 'In our own time revive it; in our own time make it known; in wrath may you remember mercy.'
  - where: 'section 1 plain'
    claim: 'The verb means to call to life'
    key: keil-habakkuk
    url: 'https://biblehub.com/commentaries/kad/habakkuk/3.htm'
    quote: 'חיּה does not merely mean to restore to life and keep alive, but also to give life and call to life.'
  - where: 'section 2 plain'
    claim: '“Horns” rendered as rays of light'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hab/3?lang=eng'
    quote: '4a “he”: OR rays of light are at His side.'
  - where: 'section 2 plain'
    claim: 'The clause about the oaths of the tribes is very obscure'
    key: keil-habakkuk
    url: 'https://biblehub.com/commentaries/kad/habakkuk/3.htm'
    quote: 'The next clause, שׁבעות מטּות אמר, is very obscure, and has not yet been satisfactorily explained.'
  - where: 'section 3 plain'
    claim: '“Thresh” rendered “trampled”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Habakkuk+3&version=NRSVUE'
    quote: 'In fury you marched on the earth; in anger you trampled nations.'
  - where: 'section 3 plain'
    claim: 'God pierces the heads of the enemy’s troops with the enemy king’s own spears'
    key: keil-habakkuk
    url: 'https://biblehub.com/commentaries/kad/habakkuk/3.htm'
    quote: 'The meaning of the words is this: with the spear of the king God pierces the heads of his warlike troops'
  - where: 'section 4 plain'
    claim: '“Rest” rendered “wait quietly”; the last line rendered “To the leader: with stringed instruments”; hinds rendered deer'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Habakkuk+3&version=NRSVUE'
    quote: 'I wait quietly for the day of calamity to come upon the people who attack us. … he makes my feet like the feet of a deer and makes me tread upon the heights. To the leader: with stringed instruments.'

  - where: 'note 3:2 “What Habakkuk heard”'
    claim: 'A modern translation reads “I have heard of your renown”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Habakkuk+3&version=NRSVUE'
    quote: 'O Lord, I have heard of your renown, and I stand in awe, O Lord, of your work.'
  - where: 'note 3:2 “What Habakkuk heard”'
    claim: 'The word behind “speech” (šēmaʿ) means report or tidings; Hab. 3:2 is listed'
    key: bdb
    url: 'https://biblehub.com/hebrew/8088.htm'
    quote: 'report, usually with Genitive object: accusative with שְׁמַע Genesis 29:13 (J) the tidings about Jacob'
  - where: 'note 3:2 “What Habakkuk heard”'
    claim: 'Hab. 3:2 is among the verses listed for this sense'
    key: bdb
    url: 'https://biblehub.com/hebrew/8088.htm'
    quote: 'Nahum 3:19; Habakkuk 3:2; Jeremiah 37:5'
  - where: 'note 3:2 “What Habakkuk heard”'
    claim: 'After the Lord’s answers in chapters 1–2, Habakkuk uttered the psalm'
    key: rasmussen-habakkuk-1962
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/rasmussen/2022-11-14/i_97.09_ellis_t._rasmussen_habakkuk_a_prophet_with_a_problem_sept_1962_center_insert.pdf'
    quote: 'After this experience, Habakkuk felt inspired to utter a psalm of praise to God and trust in Him.'
  - where: 'note 3:2 “What Habakkuk heard”'
    claim: 'The same verb opens 3:2 and 3:16'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hab.xml'
    quote: 'שָׁמַ֣עְתִּי'
  - where: 'note 3:2 “What Habakkuk heard”'
    claim: 'Habakkuk confesses his fear, which gives way to understanding as he testifies of God’s power'
    key: ball-prophets-names
    url: 'https://rsc.byu.edu/vol-15-no-2-2014/what-name-lessons-names-old-testament-prophets'
    quote: 'In the closing chapter, Habbakuk confesses that he had been afraid (3:2), but that fear and distrust of God appear to dissipate in understanding as he bears testimony of God’s wonderful power and works (3:3–16).'

  - where: 'note 3:2 “In the midst of the years”'
    claim: 'The Hebrew verb behind “revive” is ḥāyâ'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hab.xml'
    quote: 'חַיֵּ֔י/הוּ'
  - where: 'note 3:2 “In the midst of the years”'
    claim: '“Thy work” in 3:2 is the noun pōʿal (H6467)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hab.xml'
    quote: 'פָּֽעָלְ/ךָ֙'
  - where: 'note 3:2 “In the midst of the years”'
    claim: 'The same noun pōʿal stands in 1:5, “work a work”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hab.xml'
    quote: 'פֹ֨עַל֙'
  - where: 'note 3:2 “In the midst of the years”'
    claim: 'Pōʿal of God is His work, in judgment in Hab. 1:5'
    key: bdb
    url: 'https://biblehub.com/hebrew/6467.htm'
    quote: 'in judgment Psalm 64:10; Psalm 95:9, as accusative of congnate meaning with verb Habakkuk 1:5'
  - where: 'note 3:2 “In the midst of the years”'
    claim: 'The Piel of ḥāyâ means preserve alive, let live; Hab. 3:2 is listed under that sense'
    key: bdb
    url: 'https://biblehub.com/hebrew/2421.htm'
    quote: '1 preserve alive, let live Exodus 1:17,18,22'
  - where: 'note 3:2 “In the midst of the years”'
    claim: 'Hab. 3:2 is listed under “preserve alive, let live”'
    key: bdb
    url: 'https://biblehub.com/hebrew/2421.htm'
    quote: 'Ezekiel 3:18; Habakkuk 3:2; Job 36:6'
  - where: 'note 3:2 “In the midst of the years”'
    claim: 'A modern translation reads “In our own time revive it”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Habakkuk+3&version=NRSVUE'
    quote: 'In our own time revive it; in our own time make it known; in wrath may you remember mercy.'
  - where: 'note 3:2 “In the midst of the years”'
    claim: 'The verb in “remember mercy” is raḥam, have compassion'
    key: bdb
    url: 'https://biblehub.com/hebrew/7355.htm'
    quote: 'Pi`el have compassion; —'
  - where: 'note 3:2 “In the midst of the years”'
    claim: 'The verb in 3:2 is H7355'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hab.xml'
    quote: 'רַחֵ֥ם'

  - where: 'note 3:3 “From Teman and Paran”'
    claim: 'Paran is the desert between Judea and Sinai'
    key: bd-paran
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/paran?lang=eng'
    quote: 'The desert between Judea and Sinai, forming the central part of the Sinaitic peninsula'
  - where: 'note 3:3 “From Teman and Paran”'
    claim: 'Teman is a district of Edom, in poetry often standing for Edom; Hab. 3:3 is listed'
    key: bdb
    url: 'https://biblehub.com/hebrew/8487.htm'
    quote: 'of a location a northern district of Edom, poetic often = Edom'
  - where: 'note 3:3 “From Teman and Paran”'
    claim: 'The footnote reads the line as an allusion to historic deliverances, with Deut. 33:2'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hab/3?lang=eng'
    quote: '3a “Paran”: This alludes to historic occasions when the Lord miraculously delivered the people. Deut. 33:2 (2–3).'
  - where: 'note 3:3 “From Teman and Paran”'
    claim: 'Habakkuk changes Deuteronomy’s preterite “came” into the future “comes” to describe a future revelation'
    key: keil-habakkuk
    url: 'https://biblehub.com/commentaries/kad/habakkuk/3.htm'
    quote: 'he changes the preterite בּא (Jehovah came from Sinai) into the future יבוא, He will come, or comes, to indicate at the very outset that he is about to describe not a past, but a future revelation of the glory of the Lord'
  - where: 'note 3:3 “From Teman and Paran”'
    claim: 'The verb in 3:3 is an imperfect'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hab.xml'
    quote: 'יָב֔וֹא'
  - where: 'note 3:3 “From Teman and Paran”'
    claim: 'As the Lord came at Sinai, so He will appear in the time to come; the Holy One cannot tolerate sin'
    key: keil-habakkuk
    url: 'https://biblehub.com/commentaries/kad/habakkuk/3.htm'
    quote: 'As the Lord God once came down to His people at Sinai, when they had been redeemed out of Egypt, to establish the covenant of His grace with them, and make them into a kingdom of God, so will He appear in the time to come'
  - where: 'note 3:3 “From Teman and Paran”'
    claim: 'The Holy One cannot tolerate sin'
    key: keil-habakkuk
    url: 'https://biblehub.com/commentaries/kad/habakkuk/3.htm'
    quote: 'Eloah, however, comes as the Holy One (qâdōsh), who cannot tolerate sin (Habakkuk 1:13)'

  - where: 'note 3:4 “Horns, or rays of light”'
    claim: 'The footnote gives “rays of light are at His side”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hab/3?lang=eng'
    quote: '4a “he”: OR rays of light are at His side.'
  - where: 'note 3:4 “Horns, or rays of light”'
    claim: 'In Hab. 3:4 the dual of qeren means rays, of lightning-flashes when God appears'
    key: bdb
    url: 'https://biblehub.com/hebrew/7161.htm'
    quote: 'rays at his side(s) had he (of lightning-flashes in theoph.'
  - where: 'note 3:4 “Horns, or rays of light”'
    claim: 'The verb from the same word, “send out rays,” is used of Moses’ face in Ex. 34:29'
    key: bdb
    url: 'https://biblehub.com/hebrew/7160.htm'
    quote: 'send out rays; — Perfect3masculine singular קָרַן עוֺר מָּנָיו Exodus 34:29,30,35 (P).'
  - where: 'note 3:4 “Horns, or rays of light”'
    claim: 'A modern translation reads “rays came forth from his hand”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Habakkuk+3&version=NRSVUE'
    quote: 'The brightness was like the sun; rays came forth from his hand, where his power lay hidden.'
  - where: 'note 3:4 “Horns, or rays of light”'
    claim: 'The Hebrew word is qarnayim, horns'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hab.xml'
    quote: 'קַרְנַ֥יִם'
  - where: 'note 3:4 “Horns, or rays of light”'
    claim: 'The splendour is the covering of God, the manifestation of the invisible God'
    key: keil-habakkuk
    url: 'https://biblehub.com/commentaries/kad/habakkuk/3.htm'
    quote: 'in actual fact, the splendour forms the covering of the Almighty God at His coming, the manifestation of the essentially invisible God'

  - where: 'note 3:7 “Cushan and Midian”'
    claim: 'The footnotes call these historic allusions and point to Judg. 3:10 and Num. 31:2'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hab/3?lang=eng'
    quote: '7a “Cushan”: Historic allusions as in v. 3. Judg. 3:10 (8–10).'
  - where: 'note 3:7 “Cushan and Midian”'
    claim: 'The footnote on Midian points to Num. 31:2'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hab/3?lang=eng'
    quote: '7b “Midian”: Num. 31:2 (1–12).'

  - where: 'note 3:10 “The deep lifts its hands”'
    claim: 'The phrase is the idiom for lifting the hands in prayer, as in Ps. 134:2'
    key: calabro-gestures
    url: 'https://rsc.byu.edu/ascending-mountain-lord/gestures-praise-lifting-spreading-hands-biblical-prayer'
    quote: 'One of these is nāśāʾ yādayim, “lift up the hands,” which is used twice in the Psalms: … Lift up your hands in the sanctuary, and bless the Lord. (Psalm 134:2) … An additional example of this idiom is found in the book of Habakkuk'
  - where: 'note 3:10 “The deep lifts its hands”'
    claim: 'The text is difficult; scholars differ whether the deep or the sun lifts its hands; as it stands the deep praises God'
    key: calabro-gestures
    url: 'https://rsc.byu.edu/ascending-mountain-lord/gestures-praise-lifting-spreading-hands-biblical-prayer'
    quote: 'scholars differ as to whether it was the deep or the sun (mentioned in the following verse) that was originally described as lifting up its hands … the text as it now stands seems to describe the personified deep raising its “hands” (perhaps referring to waves) in praising God.'
  - where: 'note 3:10 “The deep lifts its hands”'
    claim: 'A modern translation reads “The sun raised high its hands”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Habakkuk+3&version=NRSVUE'
    quote: 'the deep gave forth its voice. The sun raised high its hands;'
  - where: 'note 3:10 “The deep lifts its hands”'
    claim: 'The verse likely refers to the parting of the Red Sea'
    key: huntington-gathering
    url: 'https://rsc.byu.edu/vol-9-no-1-2008/jeremiah-new-paradigm-gathering'
    quote: 'This poetic imagery likely refers to the parting of the Red Sea (see Exodus 14).'
  - where: 'note 3:10 “The deep lifts its hands”'
    claim: 'The footnote on “mountains” points to Ex. 19:18'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hab/3?lang=eng'
    quote: '10a “mountains”: Ex. 19:18 (16–18).'

  - where: 'note 3:11 “The sun and moon stood still”'
    claim: 'The line certainly refers to Joshua’s battle against the five kings'
    key: huntington-gathering
    url: 'https://rsc.byu.edu/vol-9-no-1-2008/jeremiah-new-paradigm-gathering'
    quote: 'Habakkuk’s statement “the sun and moon stood still in their habitation” (Habakkuk 3:11) certainly refers to the miracle during Joshua’s battle against the five Canaanite kings (see Joshua 10:8–14).'
  - where: 'note 3:11 “The sun and moon stood still”'
    claim: 'Zebul is a height or lofty abode; in Hab. 3:11 the lofty abode of sun and moon'
    key: bdb
    url: 'https://biblehub.com/hebrew/2073.htm'
    quote: 'elevation, height, lofty abode'
  - where: 'note 3:11 “The sun and moon stood still”'
    claim: 'In Hab. 3:11 it is the lofty abode of sun and moon'
    key: bdb
    url: 'https://biblehub.com/hebrew/2073.htm'
    quote: 'of the lofty abode of sun and moon'
  - where: 'note 3:11 “The sun and moon stood still”'
    claim: 'The footnote points to Josh. 10:12 and Hel. 12:15'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hab/3?lang=eng'
    quote: '11a “sun”: Josh. 10:12 (12–13); Hel. 12:15.'

  - where: 'note 3:13 “Thine anointed”'
    claim: 'Mashiach means anointed; usually a consecrated person; specifically the Messiah'
    key: bdb
    url: 'https://biblehub.com/hebrew/4899.htm'
    quote: 'מָשִׁיחַ noun masculine anointed'
  - where: 'note 3:13 “Thine anointed”'
    claim: 'In Hab. 3:13 the anointed is the king of Israel anointed by divine command'
    key: bdb
    url: 'https://biblehub.com/hebrew/4899.htm'
    quote: '1 king of Israel anointed by divine command … Psalm 28:8; Habakkuk 3:13; Davidic dynasty with Messianic ideals attached Psalm 2:2'
  - where: 'note 3:13 “Thine anointed”'
    claim: 'The Hebrew word in 3:13 is māšîaḥ'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hab.xml'
    quote: 'מְשִׁיחֶ֑/ךָ'
  - where: 'note 3:13 “Thine anointed”'
    claim: 'The anointed is the divinely appointed Davidic king absolutely, including the Messiah'
    key: keil-habakkuk
    url: 'https://biblehub.com/commentaries/kad/habakkuk/3.htm'
    quote: 'משׁיחך is the divinely-appointed king of Israel; not, however, this or that historical king - say Josiah, Jehoiakim, or even Jehoiachin - but the Davidic king absolutely, including the Messiah'
  - where: 'note 3:13 “Thine anointed”'
    claim: 'The Messiah is here distinguished from Jehovah as the object of divine help'
    key: keil-habakkuk
    url: 'https://biblehub.com/commentaries/kad/habakkuk/3.htm'
    quote: 'The Messiah as the Son of David is distinguished from Jehovah, and as such is the object of divine help'
  - where: 'note 3:13 “Thine anointed”'
    claim: 'The house of the wicked is the Chaldean dynasty'
    key: keil-habakkuk
    url: 'https://biblehub.com/commentaries/kad/habakkuk/3.htm'
    quote: 'The description is allegorical, the house representing the Chaldaean dynasty, the royal family including the king'
  - where: 'note 3:13 “Thine anointed”'
    claim: 'The footnote on “salvation” points to the Topical Guide’s entries on Jesus Christ'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hab/3?lang=eng'
    quote: '13a “salvation”: TG Jesus Christ, Prophecies about; Jesus Christ, Redeemer; Jesus Christ, Savior; Remission of Sins; Salvation.'

  - where: 'note 3:15 “Walking through the sea”'
    claim: 'The footnote on “heap” points to Josh. 3:16'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hab/3?lang=eng'
    quote: '15a “heap”: Josh. 3:16 (14–17).'
  - where: 'note 3:15 “Walking through the sea”'
    claim: 'In John’s account Jesus’s control of the sea and walking on the water manifest the power the Hebrew Bible attributes to Jehovah alone (Hab. 3:15); He created the deep and brought Israel through it'
    key: huntsman-bread-of-life
    url: 'https://rsc.byu.edu/celebrating-easter/bread-life-sermon'
    quote: 'He is manifested as the one exercising the power that the Hebrew Bible attributes to Jehovah alone (see Job 9:8, 38:16; Habakkuk 3:15). … Jesus’s walking on the water reveals Him as both the one who created the deep and brought the Israelites through it.'
  - where: 'note 3:16 “Waiting quietly for the day of trouble”'
    claim: 'The verb is nûaḥ'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hab.xml'
    quote: 'אָנ֨וּחַ֙'
  - where: 'note 3:16 “Waiting quietly for the day of trouble”'
    claim: 'The verb nûaḥ means repose, be quiet; in Hab. 3:16 the Hebrew is dubious, usually rendered “I wait quietly for the day of distress”'
    key: bdb
    url: 'https://biblehub.com/hebrew/5117.htm'
    quote: 'Habakkuk 3:16 is dubious: I wait quietly for the day of distress'
  - where: 'note 3:16 “Waiting quietly for the day of trouble”'
    claim: 'A modern translation reads “I wait quietly for the day of calamity”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Habakkuk+3&version=NRSVUE'
    quote: 'I wait quietly for the day of calamity to come upon the people who attack us.'
  - where: 'note 3:16 “Waiting quietly for the day of trouble”'
    claim: 'Habakkuk’s trembling is set beside Lehi’s reaction to his vision'
    key: sc-knowhy-469
    url: 'https://scripturecentral.org/knowhy/why-are-lehis-visions-like-those-of-other-prophets-in-his-day'
    quote: 'Some elements in Lehi’s reaction are unique to Lehi, but several are also similar to reactions of other prophets in his day. For example, when Habakkuk saw the destruction that would accompany the Lord’s coming, he exclaimed: “When I heard, my belly trembled'
  - where: 'note 3:16 “Waiting quietly for the day of trouble”'
    claim: 'Both Lehi and Habakkuk end in rejoicing'
    key: sc-knowhy-469
    url: 'https://scripturecentral.org/knowhy/why-are-lehis-visions-like-those-of-other-prophets-in-his-day'
    quote: 'Lehi’s “soul did rejoice, and his whole heart was filled because of the things which he had seen” in his vision (1 Nephi 1:15). … And Habakkuk, who had been greatly afraid of the vision he was shown, ended his account by praising God'

  - where: 'note 3:18 “Rejoicing when the harvest fails”'
    claim: 'Habakkuk’s spirit is that of Job 13:15; he lists six lines of disasters and avers his last five lines'
    key: rasmussen-habakkuk-1962
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/rasmussen/2022-11-14/i_97.09_ellis_t._rasmussen_habakkuk_a_prophet_with_a_problem_sept_1962_center_insert.pdf'
    quote: 'Then in the spirit expressed also by Job who said, "Though He slay me, yet will I trust Him: . . . "^^ Habakkuk lists in six poetic lines^^ the disasters that could come to him, but strongly he avers in his last five lines'
  - where: 'note 3:18 “Rejoicing when the harvest fails”'
    claim: 'Everything in the telestial world is prone to collapse except the Lord'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'Everything in the telestial world is prone to collapse except the Lord (see Habakkuk 3:17).'
  - where: 'note 3:18 “Rejoicing when the harvest fails”'
    claim: 'The prophet’s change of heart: he would rejoice even if terrible things happen'
    key: ball-prophets-names
    url: 'https://rsc.byu.edu/vol-15-no-2-2014/what-name-lessons-names-old-testament-prophets'
    quote: 'The prophet’s change of heart is finally manifest in his declaration that even if terrible things happen to the people, he would still “rejoice in the Lord,” his “strength,” and his “salvation” (3:17–19).'

  - where: 'note 3:19 “Hinds’ feet and high places”'
    claim: 'A hind is a doe or female deer'
    key: bdb
    url: 'https://biblehub.com/hebrew/355.htm'
    quote: 'a hind, doe'
  - where: 'note 3:19 “Hinds’ feet and high places”'
    claim: 'The footnote on “high places” points to Deut. 32:13 and 33:29'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hab/3?lang=eng'
    quote: '19b “high places”: Deut. 32:13; 33:29.'
  - where: 'note 3:19 “Hinds’ feet and high places”'
    claim: 'Verse 19 is formed from Ps. 18:33–34; swiftness of foot marks a warrior; here it is strength acquired in God'
    key: keil-habakkuk
    url: 'https://biblehub.com/commentaries/kad/habakkuk/3.htm'
    quote: 'the reference is to the swiftness of foot, which was one of the qualifications of a thorough man of war … Here it is a figurative expression for the fresh and joyous strength acquired in God'
  - where: 'note 3:19 “Hinds’ feet and high places”'
    claim: 'Walking on the high places denotes possession of a land; here the ultimate triumph of God’s people'
    key: keil-habakkuk
    url: 'https://biblehub.com/commentaries/kad/habakkuk/3.htm'
    quote: 'Causing to walk upon the high places of the land, was originally a figure denoting the victorious possession and government of a land. It is so in Deuteronomy 32:13 and Deuteronomy 33:29'
  - where: 'note 3:19 “Hinds’ feet and high places”'
    claim: 'The figure denotes the ultimate triumph of God’s people; the prophet speaks for the believing congregation'
    key: keil-habakkuk
    url: 'https://biblehub.com/commentaries/kad/habakkuk/3.htm'
    quote: 'it simply denotes the ultimate triumph of the people of God over all oppression on the part of the power of the world … The prophet prays and speaks throughout the entire ode in the name of the believing congregation.'

