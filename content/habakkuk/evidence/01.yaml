chapter: 1
claims:
  # ---- when / setting ----
  - where: 'when'
    claim: 'Habakkuk prophesied in Judah about 600 B.C., possibly under Josiah or Jehoiakim'
    key: bd-habakkuk
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/habakkuk?lang=eng'
    quote: 'The date at which he prophesied is uncertain—possibly in the reign of Josiah or of Jehoiakim (about 600 B.C.).'
  - where: 'when'
    claim: 'Likely under Josiah or Jehoiakim, late 600s and early 500s BC'
    key: scripture-helps-micah
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/47-micah-nahum-habakkuk-zephaniah?lang=eng'
    quote: 'Little is known about Habakkuk other than that he was a prophet who lived in the Kingdom of Judah, likely during the reigns of Josiah or Jehoiakim in the late 600s and early 500s BC.'
  - where: 'setting'
    claim: 'Nothing is known of Habakkuk beyond his being a prophet of Judah'
    key: bd-habakkuk
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/habakkuk?lang=eng'
    quote: 'A prophet of Judah. … Nothing beyond this is known about him.'
  - where: 'setting'
    claim: 'The date is uncertain, possibly Josiah or Jehoiakim, about 600 B.C.'
    key: bd-habakkuk
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/habakkuk?lang=eng'
    quote: 'The date at which he prophesied is uncertain—possibly in the reign of Josiah or of Jehoiakim (about 600 B.C.).'
  - where: 'setting'
    claim: '“In your days” (1:5) places the judgment within the lifetime of those addressed'
    key: keil-habakkuk
    url: 'https://biblehub.com/commentaries/kad/habakkuk/1.htm'
    quote: 'the prophet there foretells the Chaldaean judgment as a work which God will perform during the lifetime of the persons to whom his words are addressed ("in your days")'
  - where: 'setting'
    claim: 'Many scholars date the book between Carchemish (605) and the first deportation (597)'
    key: ot-manual-22
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-22?lang=eng'
    quote: 'Many scholars believe that he wrote after the battle of Carchemish in which Nebuchadnezzar defeated the Egyptians in 605 B.C. and before the first deportation of the Jews in 597 B.C.'
  - where: 'setting'
    claim: 'If so, he was a contemporary of Lehi and Jeremiah'
    key: ot-manual-22
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-22?lang=eng'
    quote: 'If this is the case, then he was a contemporary of Lehi and Jeremiah, prophesying to the same people.'
  - where: 'setting'
    claim: 'Josiah died at Megiddo in 609 B.C.; every king after him did evil, and his reforms were overturned'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'Josiah was killed in battle by Egyptian forces led by Pharaoh Nechoh at Megiddo in 609 BC … Without exception, each of these kings did evil in the sight of the Lord. Josiah’s reforms, the most sweeping in Judah’s history, were thoroughly overturned'
  - where: 'setting'
    claim: 'Babylon took the land from Egypt in 605 B.C.'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'Egypt annexed Israel into their domain in the wake of Assyria’s collapse, and four years later (605 BC), Babylon took Israel from Egypt.'
  - where: 'setting'
    claim: 'The name, from a root meaning to clasp or embrace: one who embraces or is embraced'
    key: ball-prophets-names
    url: 'https://rsc.byu.edu/vol-15-no-2-2014/what-name-lessons-names-old-testament-prophets'
    quote: 'Many understand the name Habakkuk to be derived from the Hebrew root châbaq, meaning to clasp or embrace. The name can be translated to mean one who embraces or one who is embraced.'
  - where: 'setting'
    claim: '“Burden” (massa) in a prophet’s heading means an utterance or oracle'
    key: bdb
    url: 'https://biblehub.com/hebrew/4853.htm'
    quote: 'utterance, oracle'
  - where: 'setting'
    claim: 'BDB lists Habakkuk 1:1 under massa as revelation'
    key: bdb
    url: 'https://biblehub.com/hebrew/4853.htm'
    quote: '= revelation'
  - where: 'setting'
    claim: 'Unlike other prophetic books, the prophet addresses and challenges the Lord (Sperry, as the manual prints him)'
    key: ot-manual-22
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-22?lang=eng'
    quote: 'Whereas most of the others contain the words of the Lord addressed to the people, in the Book of Habakkuk the prophet, as the representative of the people, addresses and challenges the Lord.'
  - where: 'setting'
    claim: 'The book records an exchange between Habakkuk and the Lord and closes with a prayer and psalm'
    key: scripture-helps-micah
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/47-micah-nahum-habakkuk-zephaniah?lang=eng'
    quote: 'The book of Habakkuk records an exchange between Habakkuk and the Lord. … The book closes with Habakkuk’s prayer and psalm of praise to God.'

  # ---- thread ----
  - where: 'thread'
    claim: 'First complaint (1:2–4): the Lord seems to do nothing about iniquity among the covenant people'
    key: ball-prophets-names
    url: 'https://rsc.byu.edu/vol-15-no-2-2014/what-name-lessons-names-old-testament-prophets'
    quote: 'for it seems to him that the Lord is not doing anything to stop the rampant iniquity among the covenant people (see Habakkuk 1:2–4)'
  - where: 'thread'
    claim: 'The Lord’s answer (1:5–11): He will raise up the Chaldeans'
    key: ball-prophets-names
    url: 'https://rsc.byu.edu/vol-15-no-2-2014/what-name-lessons-names-old-testament-prophets'
    quote: 'In response the Lord explains that he indeed has a plan to chastise the wicked, for he will “raise up the Chaldeans” to invade the land and take captives (1:5–11).'
  - where: 'thread'
    claim: 'Second complaint (1:12–17): it seems unjust to use a more wicked nation'
    key: ball-prophets-names
    url: 'https://rsc.byu.edu/vol-15-no-2-2014/what-name-lessons-names-old-testament-prophets'
    quote: 'it seems unjust for God to use a more wicked nation to punish the wicked of his own people (1:12–17)'
  - where: 'thread'
    claim: 'From verse 5 the Lord is the speaker, addressing the prophet and Judah together'
    key: keil-habakkuk
    url: 'https://biblehub.com/commentaries/kad/habakkuk/1.htm'
    quote: 'The appeal to see and be amazed is addressed to the prophet and the people of Judah together. It is very evident from Habakkuk 1:6 that Jehovah Himself is speaking here'
  - where: 'thread'
    claim: 'By the end of the book the prophet comes to embrace the will of God (Ball’s reading of the name)'
    key: ball-prophets-names
    url: 'https://rsc.byu.edu/vol-15-no-2-2014/what-name-lessons-names-old-testament-prophets'
    quote: 'the prophet came to truly “embrace” the will of God'

  # ---- notes ----
  - where: 'note 1:2 “How long, O LORD?”'
    claim: 'Job, Jeremiah and Joseph Smith felt as Habakkuk did; the Psalms plead with God to hear'
    key: rasmussen-habakkuk-1962
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/rasmussen/2022-11-14/i_97.09_ellis_t._rasmussen_habakkuk_a_prophet_with_a_problem_sept_1962_center_insert.pdf'
    quote: 'In the scriptures, Job,^ Jeremiah,^ and Joseph Smith^ are among those that have felt in times of persecution and trial much as Habakkuk felt. In the Psalms are many supplications, pleading with God to hear in times of bitter tribulation. Even Jesus quoted one of those'
  - where: 'note 1:2 “How long, O LORD?”'
    claim: 'Habakkuk’s prayer is like Joseph Smith’s later plea (D&C 121:2)'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'In a prayer similar to Joseph Smith’s later plea, Habakkuk asks:'
  - where: 'note 1:2 “How long, O LORD?”'
    claim: 'His questions were bold and heartfelt, out of concern for his people'
    key: scripture-helps-micah
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/47-micah-nahum-habakkuk-zephaniah?lang=eng'
    quote: 'Distressed, Habakkuk asked the Lord bold and heartfelt questions that reflected his concern for his people and for the Lord’s plans for them.'
  - where: 'note 1:2 “How long, O LORD?”'
    claim: 'The Lord’s answer is not reproof'
    key: rasmussen-habakkuk-1962
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/rasmussen/2022-11-14/i_97.09_ellis_t._rasmussen_habakkuk_a_prophet_with_a_problem_sept_1962_center_insert.pdf'
    quote: 'He receives his answer; and lo, it is not really reproof! The answer is like that which came to the others who asked'

  - where: 'note 1:4 “The law gone numb”'
    claim: 'The verb means to grow numb; cognates mean grow cool or cold, fail'
    key: bdb
    url: 'https://biblehub.com/hebrew/6313.htm'
    quote: 'verb grow numb (Arabic grow cool; **Syriac become cold (Mt 24:12), fail, become weak, inefficient'
  - where: 'note 1:4 “The law gone numb”'
    claim: 'In Habakkuk 1:4, of the law: be ineffective'
    key: bdb
    url: 'https://biblehub.com/hebrew/6313.htm'
    quote: 'i.e. be ineffective.'
  - where: 'note 1:4 “The law gone numb”'
    claim: 'The footnote gives the Hebrew as “grows cold”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hab/1?lang=eng'
    quote: 'HEB grows cold.'
  - where: 'note 1:4 “The law gone numb”'
    claim: 'The Bible Dictionary: his outcries are against wrongdoing in Judah'
    key: bd-habakkuk
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/habakkuk?lang=eng'
    quote: 'In Hab. 1 the prophet complains that his outcries against wrongdoing in Judah remain unheard by God'

  - where: 'note 1:5 “Paul’s warning at Antioch”'
    claim: 'The Septuagint reads “ye despisers … and vanish”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/habakkuk/1.htm'
    quote: 'Behold, ye despisers, and look, and wonder marvelously, and vanish: for I work a work in your days, which ye will in no wise believe, though a man declare it to you.'
  - where: 'note 1:5 “Paul’s warning at Antioch”'
    claim: 'Paul’s form of the verse in Acts 13:41'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/13?lang=eng'
    quote: 'Behold, ye despisers, and wonder, and perish: for I work a work in your days, a work which ye shall in no wise believe, though a man declare it unto you.'
  - where: 'note 1:6 “The Chaldeans”'
    claim: 'Chaldea: the part of Babylonia south and east of Babylon; later the whole land between the rivers'
    key: bd-chaldea
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/chaldea?lang=eng'
    quote: 'The portion of Babylonia that lay south and east of Babylon, though the name was sometimes used after the days of Jeremiah to denote the whole district lying between and adjoining the rivers Tigris and Euphrates.'
  - where: 'note 1:6 “The Chaldeans”'
    claim: 'The Chaldeans are the Neo-Babylonians of Nabopolassar’s dynasty, after 625 B.C.; the world power after Assyria’s fall'
    key: rasmussen-habakkuk-1962
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/rasmussen/2022-11-14/i_97.09_ellis_t._rasmussen_habakkuk_a_prophet_with_a_problem_sept_1962_center_insert.pdf'
    quote: 'The "Chaldeans" are the same as the "Neo-Babylonians" who arose with Nabopolassar''s dynasty after 625 B.C. and became the "world-power" of the Middle East after the crucial overthrow of As- syria in 614, 612, and 605 B. C,'
  - where: 'note 1:6 “The Chaldeans”'
    claim: 'The Lord will use a bitter, hasty, terrible nation, and Babylon will also fall'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'In response, the Lord explained to the prophet that while Judah will suffer destruction at the hands of a bitter, hasty, terrible, and dreadful nation (see Habakkuk 1:6–7), Babylon will also fall.'

  - where: 'note 1:10 “Heaping dust”'
    claim: 'To heap dust is to build an earthen ramp to take a city'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Habakkuk+1&version=NIV'
    quote: 'by building earthen ramps'
  - where: 'note 1:10 “Heaping dust”'
    claim: 'The ESV cross-references Habakkuk 1:10 to Ezekiel 4:2'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Habakkuk+1&version=ESV'
    quote: 'Habakkuk 1:10 : [Ezek. 4:2]'
  - where: 'note 1:10 “Heaping dust”'
    claim: 'Ezekiel 4:2: cast a mount against the besieged city'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/4?lang=eng'
    quote: 'And lay siege against it, and build a fort against it, and cast a mount against it'

  - where: 'note 1:11 “Strength as a god”'
    claim: 'The line can be read “this its strength is its god”; compare Isaiah 10:13'
    key: keil-habakkuk
    url: 'https://biblehub.com/commentaries/kad/habakkuk/1.htm'
    quote: 'This its power is god to it, i.e., it makes it into its god (for the thought, compare Job 12:6, and the words of the Assyrian in Isaiah 10:13).'
  - where: 'note 1:11 “Strength as a god”'
    claim: 'Keil translates the whole verse'
    key: keil-habakkuk
    url: 'https://biblehub.com/commentaries/kad/habakkuk/1.htm'
    quote: 'Then it passes along, a wind, and comes hither and offends: this its strength is its god.'
  - where: 'note 1:11 “Strength as a god”'
    claim: 'The NRSVue renders “their own might is their god!”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Habakkuk+1&version=NRSVUE'
    quote: 'Then they sweep by like the wind; they transgress and become guilty; their own might is their god!'
  - where: 'note 1:11 “Strength as a god”'
    claim: 'Read as the King James has it: imputing power to idolatrous gods'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'second, imputing power to their idolatrous gods (see Habakkuk 1:1–17)'

  - where: 'note 1:12 “Ordained for judgment”'
    claim: 'The prophet recognizes that God is at the helm and ordains correction'
    key: rasmussen-habakkuk-1962
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/rasmussen/2022-11-14/i_97.09_ellis_t._rasmussen_habakkuk_a_prophet_with_a_problem_sept_1962_center_insert.pdf'
    quote: 'he recognizes that God is ever at the helm and that He establishes justice and ordains correction'
  - where: 'note 1:12 “Ordained for judgment”'
    claim: 'The NRSVue has “O Rock” for the King James “O mighty God”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Habakkuk+1&version=NRSVUE'
    quote: 'and you, O Rock, have established them for punishment.'
  - where: 'note 1:12 “Ordained for judgment”'
    claim: 'The Bible Dictionary points to Mormon 4:5 for the book’s solution: the Chaldeans will be judged'
    key: bd-habakkuk
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/habakkuk?lang=eng'
    quote: 'Hab. 2 supplies a solution to the problem: the Chaldeans themselves will come under judgment (see also Morm. 4:5).'
  - where: 'note 1:12 “Ordained for judgment”'
    claim: 'Habakkuk prophesied against Babylon as Isaiah against Assyria; used as God’s arm, then destroyed'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'Habakkuk prophesied against Babylon in the same way that Isaiah prophesied against Assyria (see Isaiah 10).[22] Babylon would be used as God’s arm to crush Judah. Then, like Assyria, Babylon would be destroyed'
  - where: 'note 1:12 “Ordained for judgment”'
    claim: 'Mormon 4:5 text'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/morm/4?lang=eng'
    quote: 'But, behold, the judgments of God will overtake the wicked; and it is by the wicked that the wicked are punished'

  - where: 'note 1:13 “More righteous than he?”'
    claim: 'The problem: why the pure and holy God uses such a sinful nation'
    key: bd-habakkuk
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/habakkuk?lang=eng'
    quote: 'This raises the problem as to why the pure and holy God should use for the working out of His purposes such a sinful nation.'
  - where: 'note 1:13 “More righteous than he?”'
    claim: 'Many in Judah thought their lot unfair; Habakkuk’s question shows how pervasive the feeling was; compare Laman and Lemuel'
    key: draper-exile
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/prophets-exile'
    quote: 'Many whined that their lot was unfounded and unfair. … The prophet Habakkuk’s willingness to question God’s justness in using Babylon as His tool to chastise Judah underscores how pervasive the feeling was'
  - where: 'note 1:13 “More righteous than he?”'
    claim: 'Laman and Lemuel’s claim that Jerusalem was righteous was far from the truth'
    key: draper-exile
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/prophets-exile'
    quote: 'Nothing could have been further from the truth, but the attitude displayed by these two ruthless brothers was popular in Judah as well.'
  - where: 'note 1:13 “More righteous than he?”'
    claim: 'Chapter 1 is a discussion like Jeremiah 12 and D&C 121'
    key: gs-habakkuk
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/habakkuk?lang=eng'
    quote: 'Chapter 1 is a discussion between the Lord and His prophet, similar to those in Jeremiah 12 and Doctrine and Covenants 121.'

  - where: 'note 1:16 “Sacrifice to a net”'
    claim: 'Sacrificing to his net is giving to his means of success the honour due to God'
    key: keil-habakkuk
    url: 'https://biblehub.com/commentaries/kad/habakkuk/1.htm'
    quote: 'He rejoices over the success of his enterprises, over this capture of men, and sacrifices and burns incense to his net, i.e., he attributes to the means which he has employed the honour due to God.'
  - where: 'note 1:16 “Sacrifice to a net”'
    claim: 'One reading of verse 14: Judah given up helplessly, as though God had ceased to be its king'
    key: keil-habakkuk
    url: 'https://biblehub.com/commentaries/kad/habakkuk/1.htm'
    quote: 'God has given it helplessly up to the power of its foes, and has obviously ceased to be its king.'

  # ---- christ ----
  - where: 'christ'
    claim: 'Jesus quoted a psalm of the same cry from the cross'
    key: rasmussen-habakkuk-1962
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/rasmussen/2022-11-14/i_97.09_ellis_t._rasmussen_habakkuk_a_prophet_with_a_problem_sept_1962_center_insert.pdf'
    quote: 'Even Jesus quoted one of those, crying out in anguish from the cross, "My God, My God, why hast thou forsaken me?"'
  - where: 'christ'
    claim: 'The answer to Habakkuk is like the answer to Joseph Smith in D&C 121:7–8'
    key: rasmussen-habakkuk-1962
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/rasmussen/2022-11-14/i_97.09_ellis_t._rasmussen_habakkuk_a_prophet_with_a_problem_sept_1962_center_insert.pdf'
    quote: 'The answer is like that which came to the others who asked'
  - where: 'christ'
    claim: 'The Lord answers the prophet’s “how long” with a promise'
    key: rasmussen-habakkuk-1962
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/rasmussen/2022-11-14/i_97.09_ellis_t._rasmussen_habakkuk_a_prophet_with_a_problem_sept_1962_center_insert.pdf'
    quote: 'When he asks, "How long shall I cry and thou wilt not hear?" the Lord answers with a promise.'
  - where: 'note 1:4 “The law gone numb”'
    claim: 'The iniquity is among the covenant people themselves'
    key: ball-prophets-names
    url: 'https://rsc.byu.edu/vol-15-no-2-2014/what-name-lessons-names-old-testament-prophets'
    quote: 'for it seems to him that the Lord is not doing anything to stop the rampant iniquity among the covenant people (see Habakkuk 1:2–4)'
  - where: 'note 1:5 “Paul’s warning at Antioch”'
    claim: 'The NRSVue renders the line “Look at the nations”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Habakkuk+1&version=NRSVUE'
    quote: 'Look at the nations and see!'
  - where: 'note 1:13 “More righteous than he?”'
    claim: 'The Chaldeans are used to punish the wicked of Judah'
    key: ball-prophets-names
    url: 'https://rsc.byu.edu/vol-15-no-2-2014/what-name-lessons-names-old-testament-prophets'
    quote: 'it seems unjust for God to use a more wicked nation to punish the wicked of his own people (1:12–17)'
  - where: 'thread'
    claim: 'The Lord’s answer increased the prophet’s confusion: a nation more wicked than Judah'
    key: ot-manual-22
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-22?lang=eng'
    quote: 'The Lord’s response merely increased Habakkuk’s confusion: how could God condone the cruelties of a nation more wicked than Judah?'
  - where: 'note 1:13 “More righteous than he?”'
    claim: 'The Chaldeans are a nation more wicked than Judah'
    key: ot-manual-22
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-22?lang=eng'
    quote: 'how could God condone the cruelties of a nation more wicked than Judah?'
  - where: 'note 1:2 “How long, O LORD?”'
    claim: 'D&C 121 is a prayer Joseph Smith dictated as a prisoner in the jail at Liberty, Missouri'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/121?lang=eng'
    quote: 'Prayer and prophecies excerpted from two epistles to the Church dictated by Joseph Smith the Prophet while he was a prisoner in the jail at Liberty, Missouri'
