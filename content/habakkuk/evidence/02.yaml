  - where: 'thread'
    claim: 'The five woes: rapacity, his dynasty by force, building, treatment of the conquered, idolatry'
    key: keil-habakkuk
    url: 'https://biblehub.com/commentaries/kad/habakkuk/2.htm'
    quote: '(1) upon the rapacity and plundering of the Chaldaean (Habakkuk 2:6-8); (2) upon his attempt to establish his dynasty firmly by means of force and cunning (Habakkuk 2:9-11); (3) upon his wicked ways of building (Habakkuk 2:12-14); (4) upon his base treatment of the subjugated nations (Habakkuk 2:15-17); and (5) upon his idolatry (Habakkuk 2:18-20)'
  - where: 'note 2:3 “Though it tarry”'
    claim: 'The first verb (H4102) means linger, tarry'
    key: bdb
    url: 'https://biblehub.com/hebrew/4102.htm'
    quote: 'Imperfect יִתְמַהְמַהּ Habakkuk 2:3 … — linger, tarry, wait, of person'
  - where: 'note 2:3 “Though it tarry”'
    claim: 'The second verb (H309) means delay'
    key: bdb
    url: 'https://biblehub.com/hebrew/309.htm'
    quote: '1 intensive, delay, tarry, absolute Judges 5:28 ("" בּשֵׁשׁ לָבוֺא) Isaiah 46:13 and my salvation לֹא תְאַחֵר Habakkuk 2:3'
  - where: 'note 2:5 “Wine, and a hunger like the grave”'
