    quote: 'נָשָׂא מָשָׁל lift up, utter a ׳מ Numbers 23:7,18; Numbers 24:3,15,20,21,23 (all of Balaam); Isaiah 14:4'

  # added rows
  - where: 'setting'
    claim: 'In chapter 1 the prophet complains and is told the Chaldeans are coming'
    key: bd-habakkuk
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/habakkuk?lang=eng'
    quote: 'In Hab. 1 the prophet complains that his outcries against wrongdoing in Judah remain unheard by God, but he is assured that punishment by the Chaldeans is close at hand.'
  - where: 'setting'
    claim: 'Hebrews 10:37 uses verse 3'
    key: keil-habakkuk
    url: 'https://biblehub.com/commentaries/kad/habakkuk/2.htm'
    quote: 'which the author of the Epistle to the Hebrews (Hebrews 10:37) has still further defined by adding the article'
  - where: 'setting'
    claim: 'Verse 14 is formed after Isaiah 11:9'
    key: keil-habakkuk
    url: 'https://biblehub.com/commentaries/kad/habakkuk/2.htm'
    quote: 'The thought in Habakkuk 2:14 is formed after Isaiah 11:9'
  - where: 'thread'
    claim: 'The five woes: rapacity, his dynasty by force, building, treatment of the conquered, idolatry'
    key: keil-habakkuk
    url: 'https://biblehub.com/commentaries/kad/habakkuk/2.htm'
    quote: '(1) upon the rapacity and plundering of the Chaldaean (Habakkuk 2:6-8); (2) upon his attempt to establish his dynasty firmly by means of force and cunning (Habakkuk 2:9-11); (3) upon his wicked ways of building (Habakkuk 2:12-14); (4) upon his base treatment of the subjugated nations (Habakkuk 2:15-17); and (5) upon his idolatry (Habakkuk 2:18-20)'
  - where: 'note 2:3 “Though it tarry”'
    claim: 'The first verb (H4102) means linger, tarry'
    key: bdb
    url: 'https://biblehub.com/hebrew/4102.htm'
    quote: 'Imperfect יִתְמַהְמַהּ Habakkuk 2:3 … — linger, tarry, wait, of person'
  - where: 'note 2:3 “Though it tarry”'
    claim: 'The second verb (H309) means delay'
    key: bdb
    url: 'https://biblehub.com/hebrew/309.htm'
    quote: '1 intensive, delay, tarry, absolute Judges 5:28 ("" בּשֵׁשׁ לָבוֺא) Isaiah 46:13 and my salvation לֹא תְאַחֵר Habakkuk 2:3'
  - where: 'note 2:18 “A teacher of lies”'
    claim: 'The idol sustains the delusion that it is God; Keil renders “Should it teach?”'
    key: keil-habakkuk
    url: 'https://biblehub.com/commentaries/kad/habakkuk/2.htm'
    quote: 'The idol is a teacher of lying, inasmuch as it sustains the delusion, partly by itself and partly through its priests, that it is God … Woe to him that saith to the wood, Wake up; Awake, to the hard stone. Should it teach?'
  - where: 'note 2:4 “The verse Paul built on”'
    claim: 'In Habakkuk the line was a call to Judah to remain faithful'
    key: scripture-helps-micah
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/47-micah-nahum-habakkuk-zephaniah?lang=eng'
    quote: 'The Lord’s words were a call for the people of Judah to trust Him and remain faithful while waiting for His promises to be fulfilled.'
  - where: 'note 2:8 “The wicked punished by the wicked”'
    claim: 'Isaiah names the Medes against Babylon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/13?lang=eng'
    quote: 'Behold, I will stir up the Medes against them, which shall not regard silver'
  - where: 'note 2:8 “The wicked punished by the wicked”'
    claim: 'Jeremiah names the kings of the Medes against Babylon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/51?lang=eng'
    quote: 'Prepare against her the nations with the kings of the Medes'
  - where: 'note 2:4 “Faith that holds steady”'
    claim: 'A modern translation: Look at the proud!'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Habakkuk+2&version=NRSVUE'
    quote: 'Look at the proud! Their spirit is not right in them'
  - where: 'note 2:6 “Loaded with pledges”'
    claim: 'The King James wording of verse 7'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hab/2?lang=eng'
    quote: 'Shall they not rise up suddenly that shall bite thee'
  - where: 'note 2:16 “The cup comes round”'
    claim: 'A modern translation: Drink, you yourself, and stagger!'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Habakkuk+2&version=NRSVUE'
    quote: 'Drink, you yourself, and stagger! The cup in the Lord’s right hand will come around to you'

  # rows added in the Keil repair
  - where: 'note 2:1 “A watchman waiting for the answer”'
    claim: 'A modern translation: watchpost, rampart, and “concerning my complaint”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Habakkuk+2&version=NRSVUE'
    quote: 'I will stand at my watchpost and station myself on the rampart; I will keep watch to see what he will say to me and what he will answer concerning my complaint.'
  - where: 'note 2:1 “A watchman waiting for the answer”'
    claim: 'The noun rendered “reproved” means argument or reproof; the lexicon places Hab. 2:1 under “argument”'
    key: bdb
    url: 'https://biblehub.com/hebrew/8433.htm'
    quote: 'תּוֺכַ֫חַת noun feminine argument, reproof;'
  - where: 'note 2:1 “A watchman waiting for the answer”'
    claim: 'The lexicon’s first sense, argument, includes Hab. 2:1'
    key: bdb
    url: 'https://biblehub.com/hebrew/8433.htm'
    quote: '1 argument, impeachment, spoken by lips and mouth Psalm 38:15; Job 13:6; Job 23:4; Habakkuk 2:1.'
  - where: 'note 2:2 “Plain enough to run with”'
    claim: 'Another modern translation: “so that a herald may run with it”'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Habakkuk+2&version=NIV'
    quote: 'make it plain on tablets so that a herald may run with it.'
  - where: 'note 2:5 “Wine, and a hunger like the grave”'
    claim: 'The proud of verse 4 are the Babylonians'
    key: scripture-helps-micah
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/47-micah-nahum-habakkuk-zephaniah?lang=eng'
    quote: 'the Lord contrasted the proud Babylonians, whose souls were “lifted up” and “not upright,” with the righteous'
  - where: 'note 2:5 “Wine, and a hunger like the grave”'
    claim: 'The lexicon lists the participle in Hab. 2:5 under acting treacherously'
    key: bdb
    url: 'https://biblehub.com/hebrew/898.htm'
    quote: 'The participle is used Proverbs 2:22 8t., Psalm 25:3; Psalm 59:6; Psalm 119:158; Isaiah 21:2; Isaiah 24:16 (twice in verse); Isaiah 33:1; Jeremiah 3:8,11; Jeremiah 9:1; Habakkuk 1:13; Habakkuk 2:5'
  - where: 'note 2:6 “Sayings with riddles, in the mouths of the nations”'
    claim: 'The word for riddles: enigmatic sentences declaring the fate of the Chaldeans'
    key: bdb
    url: 'https://biblehub.com/hebrew/2420.htm'
    quote: 'enigmatic sentences and comparisons, declaring fate of Chaldeans Habakkuk 2:6'
  - where: 'note 2:6 “Sayings with riddles, in the mouths of the nations”'
    claim: 'Some words play on two meanings (the biters/debtors of verse 7)'
    key: bdb
    url: 'https://biblehub.com/hebrew/5391.htm'
    quote: 'figurative of oppression, etc., נשְׁכֶיךָ Habakkuk 2:7 (with play on sense thy debtors, those that give thee interest).'
  - where: 'note 2:6 “Loaded with pledges”'
    claim: 'The verb is used of a serpent’s bite; in Hab. 2:7 a figure of oppression with a play on debtors who give interest'
    key: bdb
    url: 'https://biblehub.com/hebrew/5391.htm'
    quote: 'bite, chiefly of serpent, with accusative'
  - where: 'note 2:6 “Loaded with pledges”'
    claim: 'The lexicon’s reading of Hab. 2:7 as a play on debtors, those who give interest'
    key: bdb
    url: 'https://biblehub.com/hebrew/5391.htm'
    quote: 'figurative of oppression, etc., נשְׁכֶיךָ Habakkuk 2:7 (with play on sense thy debtors, those that give thee interest).'
  - where: 'note 2:6 “Loaded with pledges”'
    claim: 'The same verb is used of lending on interest'
    key: bdb
    url: 'https://biblehub.com/hebrew/5391.htm'
    quote: 'To bite, to lend on interest, to oppress with interest'
  - where: 'note 2:14 “Filled with His glory, not Babylon’s”'
    claim: 'A modern translation of verse 13: labor only to feed the flames'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Habakkuk+2&version=NRSVUE'
    quote: 'that peoples labor only to feed the flames and nations weary themselves for nothing?'
  - where: 'note 2:20 “Silence before the Lord”'
    claim: '“Keep silence” is an interjection, hush; used also in Zeph. 1:7 and Zech. 2:13 (Hebrew 2:17)'
    key: bdb
    url: 'https://biblehub.com/hebrew/2013.htm'
    quote: 'הַס, הָ֑ס interjection hush! keep silence (probably onomatopoetic)'
  - where: 'note 2:20 “Silence before the Lord”'
    claim: 'The same interjection, before the Lord, in Hab. 2:20, Zeph. 1:7 and Zech. 2:17 (English 2:13)'
    key: bdb
    url: 'https://biblehub.com/hebrew/2013.htm'
    quote: 'Habakkuk 2:20; Zephaniah 1:7; Zechariah 2:17'
