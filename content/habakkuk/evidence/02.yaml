chapter: 2
claims:
  - where: 'when'
    claim: 'Habakkuk prophesied about 600 B.C., possibly under Josiah or Jehoiakim; nothing more is known'
    key: bd-habakkuk
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/habakkuk?lang=eng'
    quote: 'The date at which he prophesied is uncertain—possibly in the reign of Josiah or of Jehoiakim (about 600 B.C.). Nothing beyond this is known about him.'
  - where: 'setting'
    claim: 'Chapter 2 answers the problem of chapter 1: the Chaldeans themselves will be judged'
    key: bd-habakkuk
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/habakkuk?lang=eng'
    quote: 'This raises the problem as to why the pure and holy God should use for the working out of His purposes such a sinful nation. Hab. 2 supplies a solution to the problem: the Chaldeans themselves will come under judgment'
  - where: 'setting'
    claim: 'The Lord assures Habakkuk that Babylon’s dominance is temporary and the proud will be judged'
    key: scripture-helps-micah
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/47-micah-nahum-habakkuk-zephaniah?lang=eng'
    quote: 'The Lord responded by assuring Habakkuk that Babylon’s dominance would be temporary and that the proud and violent would ultimately face judgment.'
  - where: 'setting'
    claim: 'Paul quoted 2:4 several times'
    key: scripture-helps-micah
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/47-micah-nahum-habakkuk-zephaniah?lang=eng'
    quote: 'The Apostle Paul quoted these words of the Lord multiple times in the New Testament to emphasize the eternal importance of faith.'
  - where: 'thread'
    claim: 'Verse 1 is the prophet speaking; verses 2–3 the Lord’s answer to his lament of 1:12–17'
    key: keil-habakkuk
    url: 'https://biblehub.com/commentaries/kad/habakkuk/2.htm'
    quote: 'Habakkuk 2:1-3 form the introduction to the word of God, which the prophet receives in reply to his cry of lamentation addressed to the Lord in Habakkuk 1:12-17. … Habakkuk 2:1 contains the prophet''s conversation with himself.'
  - where: 'thread'
    claim: 'The outline: write the oracle, the just will live by faith and the proud will not continue, then a fivefold woe'
    key: keil-habakkuk
    url: 'https://biblehub.com/commentaries/kad/habakkuk/2.htm'
    quote: 'Then follows the word of God, that the just will live through his faith, but he that is proud and not upright will not continue (Habakkuk 2:4, Habakkuk 2:5); accompanied by a fivefold woe upon the Chaldaean'
  - where: 'thread'
    claim: 'Five woes of three verses each; the third and fifth end in a promise; the Chaldean nation is addressed as one person, its ruler'
    key: keil-habakkuk
    url: 'https://biblehub.com/commentaries/kad/habakkuk/2.htm'
    quote: 'utters woes in five strophes consisting of three verses each … by the promise explanatory of the threat in which the third and fifth strophes terminate … the Chaldaean nation is embraced, as in Habakkuk 2:4, Habakkuk 2:5, in the ideal person of its ruler.'
  - where: 'thread'
    claim: '“All these” who take up the saying are the nations of verse 5'
    key: keil-habakkuk
    url: 'https://biblehub.com/commentaries/kad/habakkuk/2.htm'
    quote: '"All these:" this evidently points back to "all nations" and "all people."'
  - where: 'section 2 plain'
    claim: 'Verse 4 rendered “the proud … the righteous live by their faithfulness”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Habakkuk+2&version=NRSVUE'
    quote: 'Look at the proud! Their spirit is not right in them, but the righteous live by their faithfulness.'
  - where: 'section 3 plain'
    claim: 'Verses 6–7 rendered with pledges and creditors'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Habakkuk+2&version=NRSVUE'
    quote: 'How long will you load yourselves with goods taken in pledge? 7 Will not your own creditors suddenly rise'
  - where: 'section 6 plain'
    claim: 'Verse 16 rendered “Drink, you yourself, and stagger!”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Habakkuk+2&version=NRSVUE'
    quote: 'Drink, you yourself, and stagger! The cup in the Lord’s right hand will come around to you'
  - where: 'section 7 plain'
    claim: '“It shall teach!” rendered as a question'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Habakkuk+2&version=NRSVUE'
    quote: 'to silent stone, “Rouse yourself!” Can it teach?'

  # note 2:1
  - where: 'note 2:1 “A watchman waiting for the answer”'
    claim: 'Habakkuk anticipates rebuke, and the answer is not really reproof'
    key: rasmussen-habakkuk-1962
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/rasmussen/2022-11-14/i_97.09_ellis_t._rasmussen_habakkuk_a_prophet_with_a_problem_sept_1962_center_insert.pdf'
    quote: 'Habakkuk feels that surely he has over- stepped his privilege as a prophet, and anticipates rebuke; … He receives his answer; and lo, it is not really reproof!'

  # note 2:2
  - where: 'note 2:2 “Plain enough to run with”'
    claim: 'A modern translation: “so that a runner may read it”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Habakkuk+2&version=NRSVUE'
    quote: 'Write the vision; make it plain on tablets, so that a runner may read it.'
  - where: 'note 2:2 “Plain enough to run with”'
    claim: 'Welch: a herald carries the book with speed; Lehi’s book in 1 Nephi 1:11 is a close analogue, and Lehi too was to deliver it quickly'
    key: welch-calling-prophet
    url: 'https://rsc.byu.edu/book-mormon-first-nephi-doctrinal-foundation/calling-prophet'
    quote: 'A close analogue to 1 Nephi 1:11 is found in the contemporary writings of Habakkuk, where the Lord spoke to Habakkuk about the preparation of a book that a herald from the Lord’s council was to carry forth with speed … it appears that the unstated instruction to Lehi was that he should deliver his message post haste.'

  # note 2:3
  - where: 'note 2:3 “Though it tarry”'
    claim: 'The two verbs differ: tarry (linger) and delay'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hab.xml'
    quote: '<w lemma="4102" n="0.1.0" morph="HVfi3ms" id="35dSp">יִתְמַהְמָהּ֙</w>'
  - where: 'note 2:3 “Though it tarry”'
    claim: 'A modern translation: “If it seems to tarry … it will not delay”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Habakkuk+2&version=NRSVUE'
    quote: 'If it seems to tarry, wait for it; it will surely come; it will not delay.'
  - where: 'note 2:3 “Though it tarry”'
    claim: 'The answer is the one given to others who asked: wait, the judgments are not all in'
    key: rasmussen-habakkuk-1962
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/rasmussen/2022-11-14/i_97.09_ellis_t._rasmussen_habakkuk_a_prophet_with_a_problem_sept_1962_center_insert.pdf'
    quote: 'The answer is like that which came to the others who asked r^ Wait; he patient and humble; the judgments are not all in as yet. You do not know the ends to which the ways of God shall lead.'
  - where: 'note 2:3 “Though it tarry”'
    claim: 'Rasmussen’s note for “the others who asked” cites D&C 121:7–8'
    key: rasmussen-habakkuk-1962
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/rasmussen/2022-11-14/i_97.09_ellis_t._rasmussen_habakkuk_a_prophet_with_a_problem_sept_1962_center_insert.pdf'
    quote: '8 Jot" 36; Jeremiah 15:19-21; Doctrine and Covenants 121:7, 8.'
  - where: 'note 2:3 “Though it tarry”'
    claim: 'What the vision announced in context: Babylon’s dominance would be temporary'
    key: scripture-helps-micah
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/47-micah-nahum-habakkuk-zephaniah?lang=eng'
    quote: 'The Lord responded by assuring Habakkuk that Babylon’s dominance would be temporary'

  # note 2:4 language
  - where: 'note 2:4 “Faith that holds steady”'
    claim: 'The Hebrew is beʾĕmûnātô, from ʾĕmûnâ (H530)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hab.xml'
    quote: 'בֶּ/אֱמוּנָת֥/וֹ'
  - where: 'note 2:4 “Faith that holds steady”'
    claim: 'ʾĕmûnâ means durative faithfulness or steadfastness, from a root meaning to be firm, to endure'
    key: reynolds-faith-faithfulness
    url: 'https://rsc.byu.edu/vol-21-no-2-2020/nephite-prophets-understanding-faith-faithfulness'
    quote: 'The Hebrew noun ʾĕmûnâ—found in theologically significant passages like Habakkuk 2:4—denoted not just “faith” but durative and perdurative “faithfulness” or “steadfastness” (in belief/trust) and personal “reliability.” … “to be firm, trust worthy, safe” “to be sure” “to endure,”'
  - where: 'note 2:4 “Faith that holds steady”'
    claim: 'The Church’s footnote: HEB faithfulness, steadfastness'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hab/2?lang=eng'
    quote: '4a “faith”: HEB faithfulness, steadfastness. TG Faith; Perseverance.'
  - where: 'note 2:4 “Faith that holds steady”'
    claim: 'The same word in Exodus 17:12, Moses’ hands made steady'
    key: scripture-helps-micah
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/47-micah-nahum-habakkuk-zephaniah?lang=eng'
    quote: 'The same word is used in Exodus 17:12, when Moses’s hands are supported and made “steady” by Aaron and Hur in prayer.'
  - where: 'note 2:4 “Faith that holds steady”'
    claim: 'The verse contrasts the proud Babylonians with the righteous; a call to trust and remain faithful while waiting'
    key: scripture-helps-micah
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/47-micah-nahum-habakkuk-zephaniah?lang=eng'
    quote: 'the Lord contrasted the proud Babylonians, whose souls were “lifted up” and “not upright,” with the righteous … The Lord’s words were a call for the people of Judah to trust Him and remain faithful while waiting for His promises to be fulfilled.'
  - where: 'note 2:4 “Faith that holds steady”'
    claim: 'The lexicon marks the meaning “swell” as uncertain'
    key: bdb
    url: 'https://biblehub.com/hebrew/6075.htm'
    quote: 'I. עָפַל verb swell (?; so Thes; inferred from derivatives'
  - where: 'note 2:4 “Faith that holds steady”'
    claim: 'A modern translation: “the righteous live by their faithfulness”'
    key: bowen-ammon-amn
    url: 'https://journal.interpreterfoundation.org/behold-he-was-a-man-like-unto-ammon-mormons-use-of-%CA%BEmn-related-terminology-in-praise-of-moroni-in-alma-48'
    quote: 'the prophet Habakkuk testified that “the just shall live by his faith [beʾĕmûnātô]” (Habakkuk 2:4, KJV) or “the righteous live by their faithfulness” (Habakkuk 2:4, NRSV Updated Edition).'

  # note 2:4 Paul
  - where: 'note 2:4 “The verse Paul built on”'
    claim: 'Paul quoted the verse to emphasize the eternal importance of faith'
    key: scripture-helps-micah
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/47-micah-nahum-habakkuk-zephaniah?lang=eng'
    quote: 'The Apostle Paul quoted these words of the Lord multiple times in the New Testament to emphasize the eternal importance of faith.'
  - where: 'note 2:4 “The verse Paul built on”'
    claim: 'In Romans 1:17 the quotation is Paul’s scriptural proof that the righteousness of God is revealed from faith to faith'
    key: strathearn-faith-christ
    url: 'https://rsc.byu.edu/witness-restoration/faith-christ'
    quote: 'The Habakkuk passage at the end of verse 17 is Paul’s scriptural proof text that the righteousness of God is revealed from faith to faith.'
  - where: 'note 2:4 “The verse Paul built on”'
    claim: 'Strathearn: in Galatians 3:11 Paul reads Christ as the just one, who lives by overcoming death because of His faith; “the righteous” was a messianic title'
    key: strathearn-faith-christ
    url: 'https://rsc.byu.edu/witness-restoration/faith-christ'
    quote: 'In addition, we know that the righteous (ho dikaios) was a common messianic title. Paul, therefore, interprets Habakkuk’s statement to be that Christ is the just person. He lives by overcoming death and is able to do so because of His faith.'
  - where: 'note 2:4 “The verse Paul built on”'
    claim: 'The Greek version reads “by my faith”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/habakkuk/2.htm'
    quote: '4If he should draw back, my soul has no pleasure in him: but the just shall live by my faith.'
  # note 2:5
  - where: 'note 2:5 “Wine, and a hunger like the grave”'
    claim: 'A modern translation reads “wealth is treacherous” and “wide as Sheol”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Habakkuk+2&version=NRSVUE'
    quote: 'Moreover, wealth is treacherous; the arrogant do not endure. They open their throats wide as Sheol; like Death they never have enough.'
  - where: 'note 2:5 “Wine, and a hunger like the grave”'
    claim: 'Its footnote: the Masoretic Text has “wine”, other (Qumran) manuscripts “wealth”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Habakkuk+2&version=NRSVUE'
    quote: '2.5 Q mss: MT wine'

  # note 2:6 parable
  - where: 'note 2:6 “Sayings with riddles, in the mouths of the nations”'
    claim: 'To lift up a mashal is the phrase for a prophetic figurative discourse, used of Balaam, Isaiah 14:4 and Hab. 2:6'
    key: bdb
    url: 'https://biblehub.com/hebrew/4912.htm'
    quote: '3 prophetic figurative discourse: נָשָׂא מָשָׁל lift up, utter a ׳מ Numbers 23:7,18; Numbers 24:3,15,20,21,23 (all of Balaam); Isaiah 14:4; Micah 2:4 ("" נהי) Habakkuk 2:6 ("" חידה)'
  - where: 'note 2:6 “Sayings with riddles, in the mouths of the nations”'
    claim: 'A modern translation: taunt with mocking riddles'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Habakkuk+2&version=NRSVUE'
    quote: '6 Shall not everyone taunt such people and, with mocking riddles, say about them,'
  # note 2:6 thick clay
  - where: 'note 2:6 “Loaded with pledges”'
    claim: 'The Hebrew word (H5671) means weight of pledges, heavy debts; it occurs only here'
    key: bdb
    url: 'https://biblehub.com/hebrew/5671.htm'
    quote: 'עַבְטִיט noun [masculine] intensive weight of pledges, heavy debts; — absolute ׳מַכְבִּיד עָלָיו ע Habakkuk 2:6.'
  - where: 'note 2:6 “Loaded with pledges”'
    claim: 'A modern translation: goods taken in pledge; creditors'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Habakkuk+2&version=NRSVUE'
    quote: 'How long will you load yourselves with goods taken in pledge? 7 Will not your own creditors suddenly rise and those who make you tremble wake up? Then you will be plunder for them.'
  # note 2:8
  - where: 'note 2:8 “The wicked punished by the wicked”'
    claim: 'The Bible Dictionary sets chapter 2’s answer beside Mormon 4:5'
    key: bd-habakkuk
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/habakkuk?lang=eng'
    quote: 'Hab. 2 supplies a solution to the problem: the Chaldeans themselves will come under judgment (see also Morm. 4:5).'
  - where: 'note 2:8 “The wicked punished by the wicked”'
    claim: 'Babylon, God’s arm against Judah, would be destroyed like Assyria; Habakkuk prophesied against Babylon as Isaiah against Assyria'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'Habakkuk prophesied against Babylon in the same way that Isaiah prophesied against Assyria (see Isaiah 10). Babylon would be used as God’s arm to crush Judah. Then, like Assyria, Babylon would be destroyed for their idolatry, their trust in munitions, and their total disregard for social justice and human life.'
  - where: 'note 2:8 “The wicked punished by the wicked”'
    claim: 'A modern translation: all who survive of the peoples shall plunder you'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Habakkuk+2&version=NRSVUE'
    quote: 'Because you have plundered many nations, all who survive of the peoples shall plunder you—'

  # note 2:9
  - where: 'note 2:9 “A nest set on high”'
    claim: 'The house is the Chaldean’s dynasty; the nest on high is a figure for securing his rule, as the eagle builds high; Nebuchadnezzar’s buildings; Obadiah 1:4'
    key: keil-habakkuk
    url: 'https://biblehub.com/commentaries/kad/habakkuk/2.htm'
    quote: 'בּיתו (his house) is not the palace, but the royal house of the Chaldaean, his dynasty … As the eagle builds its nest on high, to protect it from harm (cf. Job 39:27), so does the Chaldaean seek to elevate and strengthen his rule by robbery and plunder'
  - where: 'note 2:9 “A nest set on high”'
    claim: 'One may think of Nebuchadnezzar’s fortifications, but the figure covers all he did to establish his rule; compare Obadiah 1:4'
    key: keil-habakkuk
    url: 'https://biblehub.com/commentaries/kad/habakkuk/2.htm'
    quote: 'We might here think of the buildings erected by Nebuchadnezzar for the fortification of Babylon … but must rather refer it to all that the Chaldaean did to establish his rule. … For the figure of the nest, see Numbers 24:21; Obadiah 1:4; Jeremiah 49:16.'
  - where: 'note 2:9 “A nest set on high”'
    claim: 'The plan brings shame instead of lasting glory'
    key: keil-habakkuk
    url: 'https://biblehub.com/commentaries/kad/habakkuk/2.htm'
    quote: 'His determination to establish his house, and make it firm and lofty by evil gain, will bring shame to his house, and instead of honour and lasting glory, only shame and ruin.'
  - where: 'note 2:9 “A nest set on high”'
    claim: 'The footnote at verse 11: a rafter out of the woodwork will witness it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hab/2?lang=eng'
    quote: '11a “the”: OR a rafter out of the woodwork will witness it.'

  # note 2:14
  - where: 'note 2:14 “Filled with His glory, not Babylon’s”'
    claim: 'The footnote at verse 13 points to Jeremiah 51:58'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hab/2?lang=eng'
    quote: '13a “vanity”: Jer. 51:58. TG Vanity.'
  - where: 'note 2:14 “Filled with His glory, not Babylon’s”'
    claim: 'Rasmussen calls it the millennial promise, made to Habakkuk as to Isaiah'
    key: rasmussen-habakkuk-1962
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/rasmussen/2022-11-14/i_97.09_ellis_t._rasmussen_habakkuk_a_prophet_with_a_problem_sept_1962_center_insert.pdf'
    quote: 'the millennial promise is made to Habakkuk as to Isaiah, that at last ". . . the earth shall be filled with the knowledge of the glory of the Lord, as the waters cover the sea."'

  # note 2:16
  - where: 'note 2:16 “The cup comes round”'
    claim: 'The drinking is figurative: the drunken man is a conquered nation, the uncovering its ignominy; the shame falls back on the Chaldean'
    key: keil-habakkuk
    url: 'https://biblehub.com/commentaries/kad/habakkuk/2.htm'
    quote: 'The prostrate condition of the drunken man is a figurative representation of the overthrow of a conquered nation (Nahum 3:11), and the uncovering of the shame a figure denoting the ignominy that has fallen upon it … But he has thereby simply prepared shame for himself, which will fall back upon him'
  - where: 'note 2:16 “The cup comes round”'
    claim: 'A modern translation: “stagger”, with the footnote that the Qumran and Greek read so against the Hebrew “be uncircumcised”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Habakkuk+2&version=NRSVUE'
    quote: '2.16 Q ms Gk: MT be uncircumcised'
  - where: 'note 2:16 “The cup comes round”'
    claim: 'The Greek: shake and quake; the cup of the right hand of the Lord has come round upon thee'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/habakkuk/2.htm'
    quote: '16Drink thou also thy fill of disgrace instead of glory: shake, O heart, and quake, the cup of the right hand of the Lord has come round upon thee'

  # note 2:18
  - where: 'note 2:18 “A teacher of lies”'
    claim: 'The teacher of lies is the idol itself, in contrast with the true God, the teacher in the highest sense; the idol is a dumb nonentity'
    key: keil-habakkuk
    url: 'https://biblehub.com/commentaries/kad/habakkuk/2.htm'
    quote: 'Consequently the mōreh sheqer must be the idol itself; and it is so designated in contrast with the true God, the teacher in the highest sense (cf. Job 36:22). The idol is a teacher of lying, inasmuch as it sustains the delusion'
  - where: 'note 2:18 “A teacher of lies”'
    claim: 'The Chaldean trusted in the power of his gods; verse 18 removes all hope of help'
    key: keil-habakkuk
    url: 'https://biblehub.com/commentaries/kad/habakkuk/2.htm'
    quote: 'all hope of help being cut off from the Chaldaean. Like all the rest of the heathen, the Chaldaean also trusted in the power of his gods.'
  - where: 'note 2:18 “A teacher of lies”'
    claim: '“It shall teach!” read as a question'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Habakkuk+2&version=NRSVUE'
    quote: 'Alas for you who say to the wood, “Wake up!” to silent stone, “Rouse yourself!” Can it teach? See, it is gold and silver plated, and there is no breath in it at all.'

  # note 2:20
  - where: 'note 2:20 “Silence before the Lord”'
    claim: 'Van Dyke and Ogden: another way of saying “Be still; I’m aware of your concerns; know that I am God”; the central message is that God is in charge'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'Taken together, the central message of Habakkuk is that God is in charge. … The phrase “the Lord is in his holy temple: let all the earth keep silence before him” is another way of saying, “Be still; I’m aware of your concerns; know that I am God.”'

  # christ
  - where: 'christ'
    claim: 'The Septuagint renders “it will surely come” so that Hebrews, adding the article, takes it of the Messiah’s coming to judgment'
    key: keil-habakkuk
    url: 'https://biblehub.com/commentaries/kad/habakkuk/2.htm'
    quote: 'The lxx have rendered כּי בא יבא, ὅτι ἐρχόμενος ἥξει, which the author of the Epistle to the Hebrews (Hebrews 10:37) has still further defined by adding the article … has taken it as Messianic, and applied to the speedy coming of the Messiah to judgment'
  - where: 'christ'
    claim: 'The Greek of verse 3: “wait for him; for he will surely come”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/habakkuk/2.htm'
    quote: '3For the vision is yet for a time, and it shall shoot forth at the end, and not in vain: though he should tarry, wait for him; for he will surely come, and will not tarry.'
  - where: 'christ'
    claim: 'The footnote on “come” in verse 3 points to D&C 39:21'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hab/2?lang=eng'
    quote: '3a “come”: D&C 39:21.'
  - where: 'christ'
    claim: 'Joseph Smith, 1839: the saints will not escape all judgments; many will, for the just shall live by faith; many righteous will fall to disease and yet be saved'
    key: wjs-1839-09-29
    url: 'https://rsc.byu.edu/words-joseph-smith/29-september-1839-sunday-old-homestead'
    quote: 'Also it is a false idea that the saints will escape all the judgements whilst the wicked suffer—for all flesh is subject to suffer—and "the righteous shall hardly escape" [3] still many of the Saints will escape—for the just shall live by faith [4]—Yet many of the righteous shall fall a prey to disease to pestilence &c by reason of the weakness of the flesh and yet be saved in the Kingdom of God'

  # explore
  - where: 'explore'
