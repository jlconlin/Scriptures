    key: keil-habakkuk
    url: 'https://biblehub.com/commentaries/kad/habakkuk/2.htm'
    quote: 'i.e., to those who are addicted to it, it does not bring strength and life, but leads to the way to ruin … The fact that the Babylonians were very much addicted to wine is attested by ancient writers.'
  - where: 'note 2:18 “A teacher of lies”'
