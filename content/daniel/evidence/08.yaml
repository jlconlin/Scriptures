chapter: 8
claims:
  # ---------- when ----------
  - where: 'when'
    claim: 'Cyrus conquered Babylon in 539 BC'
    key: scripture-helps-dan
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/44-daniel-1-7?lang=eng'
    quote: 'lasting into the reign of King Cyrus of Persia, who conquered Babylon in 539 BC.'

  # ---------- setting ----------
  - where: 'setting'
    claim: 'Cyrus conquered Babylon in 539 BC'
    key: scripture-helps-dan
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/44-daniel-1-7?lang=eng'
    quote: 'lasting into the reign of King Cyrus of Persia, who conquered Babylon in 539 BC.'
  - where: 'setting'
    claim: 'Daniel 2:4–7:28 is in Aramaic and the rest of the book, so chapter 8 onward, in Hebrew'
    key: bd-daniel-book
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/daniel-book-of?lang=eng'
    quote: 'Dan. 2:4–7:28 is written in Aramaic and the rest in Hebrew.'
  - where: 'setting'
    claim: 'The vision of chapter 8 treats the second and third empires of chapter 7'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'focuses on the second and third empires spoken of in Daniel 7.'
  - where: 'setting'
    claim: 'Most of the chapter was fulfilled between 500 B.C. and the time of Christ, a period the Old Testament hardly records'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'Most of what he recorded in this chapter was fulfilled between 500 B.C. and the time of Christ, a period with few Old Testament writings describing it.'
  - where: 'setting'
    claim: 'Gabriel is the angel sent to Daniel, to Zacharias, and to Mary'
    key: bd-gabriel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/gabriel?lang=eng'
    quote: 'The name of an angel sent to Daniel (Dan. 8:16; 9:21); to Zacharias (Luke 1:11–19); and to Mary (Luke 1:26–38).'

  # ---------- thread ----------
  - where: 'thread'
    claim: 'The verb of 8:4 (“became great”) is gadal, lemma 1431'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'וְ/הִגְדִּֽיל'
  - where: 'thread'
    claim: 'The same verb, lemma 1431, is in 8:8 and 8:11 (“waxed very great,” “magnified himself”)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'הִגְדִּ֣יל'
  - where: 'thread'
    claim: 'The same verb, lemma 1431, is in 8:9 and 8:10 (“waxed exceeding great,” “waxed great”)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'וַ/תִּגְדַּל'
  - where: 'thread'
    claim: 'The same verb, lemma 1431, is in 8:25 (“magnify himself in his heart”)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'יַגְדִּ֔יל'
  - where: 'thread'
    claim: 'Gadal is used in 8:9–10 of a king growing in importance, under the figure of a horn'
    key: bdb
    url: 'https://biblehub.com/hebrew/1431.htm'
    quote: 'in importance, of a king Ecclesiastes 2:9; 1 Kings 10:23 ( = 2 Chronicles 9:22) Daniel 8:9,10 (under figure of horn)'
  - where: 'thread'
    claim: 'The sanctuary “cleansed” (8:14) is the holy place put right'
    key: bdb
    url: 'https://biblehub.com/hebrew/6663.htm'
    quote: 'Daniel 8:14 the holy place shall be put right, in a right condition'

  # ---------- sections ----------
  - where: 'section 1 plain'
    claim: '“River” in 8:2 is a watercourse'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/8?lang=eng'
    quote: 'HEB water-course.'
  - where: 'section 1 plain'
    claim: '“I saw myself” in Shushan in the vision'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Daniel%208&version=NRSVUE'
    quote: 'In the vision I saw myself in Susa the capital, in the province of Elam'
  - where: 'section 3 plain'
    claim: '“Moved with choler” is enraged'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/8?lang=eng'
    quote: 'HEB enraged.'
  - where: 'section 3 plain'
    claim: '“For it” in 8:8 is “instead of it”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/8?lang=eng'
    quote: 'HEB instead of it.'
  - where: 'section 4 plain'
    claim: '“The pleasant land” is “the beautiful land”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Daniel%208&version=NRSVUE'
    quote: 'toward the south, toward the east, and toward the beautiful land'
  - where: 'section 4 plain'
    claim: '“To the prince of the host” may be “against”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/8?lang=eng'
    quote: 'OR against.'
  - where: 'section 4 plain'
    claim: 'The daily offering is taken away from the prince of the host'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Daniel%208&version=NRSVUE'
    quote: 'it took the regular burnt offering away from him and overthrew the place of his sanctuary'
  - where: 'section 5 plain'
    claim: 'The “saints” of 8:13 are holy ones'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Daniel%208&version=NRSVUE'
    quote: 'Then I heard a holy one speaking, and another holy one said to the one who spoke'
  - where: 'section 5 plain'
    claim: 'The Hebrew of 8:14 has “evening” and “morning” where the KJV has “days” (lemma 6153)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'עֶ֣רֶב'
  - where: 'section 5 plain'
    claim: '“Cleansed” is put right'
    key: bdb
    url: 'https://biblehub.com/hebrew/6663.htm'
    quote: 'Daniel 8:14 the holy place shall be put right, in a right condition'
  - where: 'section 6 plain'
    claim: '“In the last end of the indignation” is the latter part of the period of indignation'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/8?lang=eng'
    quote: 'IE in the latter part of the period of indignation, or in the last days.'
  - where: 'section 8 plain'
    claim: '“Dark sentences” is riddles'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/8?lang=eng'
    quote: 'HEB riddles.'
  - where: 'section 8 plain'
    claim: '“By peace” is “in a time of peace”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/8?lang=eng'
    quote: 'OR in a time of peace.'
  - where: 'section 8 plain'
    claim: '“It shall be for many days” is “pertains to many days hereafter”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/8?lang=eng'
    quote: 'IE pertains to many days hereafter.'

  # ---------- note 8:2 ----------
  - where: 'note 8:2 “Daniel is set down in Shushan in vision”'
    claim: 'A modern translation has Daniel see himself in Susa in the vision'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Daniel%208&version=NRSVUE'
    quote: 'In the vision I saw myself in Susa the capital'
  - where: 'note 8:2 “Daniel is set down in Shushan in vision”'
    claim: 'The Church’s footnote at “river” (8:2) gives 1 Nephi 11:1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/8?lang=eng'
    quote: 'HEB water-course. Dan. 8:16; 1 Ne. 11:1 (1–5).'
  - where: 'note 8:2 “Daniel is set down in Shushan in vision”'
    claim: 'Josephus retells the chapter with Daniel in Susa in person, with companions'
    key: josephus-antiquities
    url: 'https://penelope.uchicago.edu/josephus/ant-10.html'
    quote: 'When he was in Susa, the metropolis of Persia, and went out into the field with his companions'
  - where: 'note 8:2 “Daniel is set down in Shushan in vision”'
    claim: 'Shushan is Susa, once capital of Elam and under Cyrus capital of the Persian Empire; the Shushan of Nehemiah and Esther'
    key: bd-shushan
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/shushan?lang=eng'
    quote: 'Also known as Susa; formerly the capital of Elam; under Cyrus the capital of the Persian Empire (Neh. 1:1; Esth. 1:2, 5'
  - where: 'note 8:2 “Daniel is set down in Shushan in vision”'
    claim: 'Daniel was conveyed to Susa in spirit, to see in the future Persian citadel the fall of that power, as Ezekiel was taken to Jerusalem'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/8.htm'
    quote: 'Daniel was in spirit conveyed to Susa, that here in the future royal citadel of the Persian kingdom he might witness the destruction of this world-power, as Ezekiel was removed to Jerusalem'

  # ---------- note 8:3 ----------
  - where: 'note 8:3 “The ram and the goat are named in the chapter itself”'
    claim: 'The Persians were at first a tribe east of Elam; Cyrus united Medes and Persians and conquered Babylon'
    key: bd-persia
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/persia?lang=eng'
    quote: 'The Persians were a tribe who in the 8th century B.C. inhabited a district east of Elam. Cyrus united the Medes and Persians, conquered Babylon'
  - where: 'note 8:3 “The ram and the goat are named in the chapter itself”'
    claim: 'The Persian Empire extended from Afghanistan to the Mediterranean'
    key: bd-persia
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/persia?lang=eng'
    quote: 'founded the Persian Empire, which extended from Afghanistan to the Mediterranean, including Asia Minor.'
  - where: 'note 8:3 “The ram and the goat are named in the chapter itself”'
    claim: 'Judea and the other Persian provinces passed to Alexander in 334 B.C.'
    key: bd-persia
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/persia?lang=eng'
    quote: 'until 334 B.C., when it passed, along with the other provinces of that empire, into the hands of Alexander the Great.'
  - where: 'note 8:3 “The ram and the goat are named in the chapter itself”'
    claim: 'Cyrus gained Media and united it with the Persian kingdom'
    key: bd-media
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/media?lang=eng'
    quote: 'Cyrus, by his defeat of Astyages (550 B.C.), gained possession of Media, which he united with the Persian kingdom.'
  - where: 'note 8:3 “The ram and the goat are named in the chapter itself”'
    claim: 'Alexander of Macedon, 356–323 B.C., ruled from Greece to the Indus'
    key: bd-alexander
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/alexander?lang=eng'
    quote: 'King of Macedon, surnamed the Great; born 356 B.C., died 323 B.C. He made himself ruler over a wide empire stretching from Greece to the Indus'
  - where: 'note 8:3 “The ram and the goat are named in the chapter itself”'
    claim: 'Josephus understood the four horns as the successors of the first king and the partition of his kingdom'
    key: josephus-antiquities
    url: 'https://penelope.uchicago.edu/josephus/ant-10.html'
    quote: 'signified the successors that should arise after the death of the first King; and the partition of the Kingdom among them'
  - where: 'note 8:3 “The ram and the goat are named in the chapter itself”'
    claim: 'The Church’s footnote at “four” (8:8) gives Daniel 11:4'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/8?lang=eng'
    quote: '“four”: Dan. 7:6; 11:4 (3–4).'
  - where: 'note 8:3 “The ram and the goat are named in the chapter itself”'
    claim: 'The higher horn that came up last is read as the Persians, who came to dominate the Medes'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'The one horn which came up last and was higher than the other represented the Persians, who finally dominated the alliance'
  - where: 'note 8:3 “The ram and the goat are named in the chapter itself”'
    claim: 'The great horn, the first king, is Alexander, who died at thirty-two at the height of his power'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'Alexander himself fit the description of the “great horn” (verse 21). At age thirty-two, Alexander died in the height of his power.'
  - where: 'note 8:3 “The ram and the goat are named in the chapter itself”'
    claim: 'Alexander’s four chief generals divided the empire and seem to be the four horns'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'his four chief generals carved up the empire, and they seem to be the four notable horns'

  # ---------- note 8:9 little horn ----------
  - where: 'note 8:9 “The little horn and Antiochus Epiphanes”'
    claim: 'The little horn has generally been read as Antiochus IV, who ruled Syria 175–164 B.C.'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'has generally been interpreted to represent Antiochus IV (Epiphanes), who ruled Syria 175–164 B.C.'
  - where: 'note 8:9 “The little horn and Antiochus Epiphanes”'
    claim: 'Chapter 8 treats the second and third empires of chapter 7'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'focuses on the second and third empires spoken of in Daniel 7.'
  - where: 'note 8:9 “The little horn and Antiochus Epiphanes”'
    claim: 'The reading that names Antiochus holds that he was a type'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'Though Antiochus IV may fit the conditions described in the prophecy, he seems to have been a type of those who function through the power of Satan'
  - where: 'note 8:9 “The little horn and Antiochus Epiphanes”'
    claim: 'Antiochus IV was a Seleucid king who came to power in 175 B.C.'
    key: ot-manual-kings-k
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-k?lang=eng'
    quote: 'When Antiochus IV, a Seleucid king, came to power in 175 B.C.'
  - where: 'note 8:9 “The little horn and Antiochus Epiphanes”'
    claim: 'Seleucus, one of Alexander’s generals, conquered Syria'
    key: ot-manual-kings-k
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-k?lang=eng'
    quote: 'conquered Syria and the northern part of the Middle East.'
  - where: 'note 8:9 “The little horn and Antiochus Epiphanes”'
    claim: 'The temple was plundered on Antiochus’s orders'
    key: ot-manual-kings-k
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-k?lang=eng'
    quote: 'In 169 B.C. the temple was plundered under orders of Antiochus.'
  - where: 'note 8:9 “The little horn and Antiochus Epiphanes”'
    claim: 'Sabbath observance and circumcision were forbidden on pain of death'
    key: ot-manual-kings-k
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-k?lang=eng'
    quote: 'Sabbath observance, celebrations, and circumcision were forbidden on penalty of death.'
  - where: 'note 8:9 “The little horn and Antiochus Epiphanes”'
    claim: 'Antiochus resolved to crush Jewish nationality and worship'
    key: bd-antiochus-epiphanes
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/antiochus-epiphanes?lang=eng'
    quote: 'He resolved to try to crush all that was distinctive of Jewish nationality and worship.'
  - where: 'note 8:9 “The little horn and Antiochus Epiphanes”'
    claim: 'Antiochus sacrificed swine on an idol altar built on the altar of God'
    key: josephus-antiquities
    url: 'https://penelope.uchicago.edu/josephus/ant-12.html'
    quote: 'he slew swine upon it, and so offered a sacrifice neither according to the law'
  - where: 'note 8:9 “The little horn and Antiochus Epiphanes”'
    claim: 'Josephus read the vision as fulfilled under Antiochus Epiphanes'
    key: josephus-antiquities
    url: 'https://penelope.uchicago.edu/josephus/ant-10.html'
    quote: 'our nation suffered these things under Antiochus Epiphanes, according to Daniel’s vision'
  - where: 'note 8:9 “The little horn and Antiochus Epiphanes”'
    claim: 'The revolt was led by Mattathias and then his son Judas Maccabaeus'
    key: bd-maccabees
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/maccabees?lang=eng'
    quote: 'an aged priest named Mattathias'
  - where: 'note 8:9 “The little horn and Antiochus Epiphanes”'
    claim: 'Judas Maccabaeus became leader after Mattathias'
    key: bd-maccabees
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/maccabees?lang=eng'
    quote: 'his son Judas, surnamed Maccabaeus'
  - where: 'note 8:9 “The little horn and Antiochus Epiphanes”'
    claim: 'The temple was restored and a new altar dedicated'
    key: bd-maccabees
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/maccabees?lang=eng'
    quote: 'The ruined temple was restored, the desecrated altar was pulled down and reconstructed, and the new altar was dedicated amid great rejoicing.'
  - where: 'note 8:9 “The little horn and Antiochus Epiphanes”'
    claim: 'The Church’s footnote at “horn” (8:9) gives Daniel 7:8'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/8?lang=eng'
    quote: '“horn”: Dan. 7:8.'
  - where: 'note 8:9 “The little horn and Antiochus Epiphanes”'
    claim: 'Critics reported by Keil dated the chapter to about the re-consecration of the temple'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/8.htm'
    quote: 'this chapter must have been written shortly before the re-consecration of the temple, or immediately thereafter'
  - where: 'note 8:9 “The little horn and Antiochus Epiphanes”'
    claim: 'Keil answers that the chapter has no hint of the Maccabean victories'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/8.htm'
    quote: 'It contains no hint whatever of the great victories of the Maccabees which preceded the consecration of the temple'
  - where: 'note 8:9 “The little horn and Antiochus Epiphanes”'
    claim: 'The Bible Dictionary treats the visions as Daniel’s own'
    key: bd-daniel-book
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/daniel-book-of?lang=eng'
    quote: 'Dan. 7–12 contains prophetic visions seen by Daniel and reported in his own name.'

  # ---------- note 8:9 pleasant land ----------
  - where: 'note 8:9 “The pleasant land is the land of Israel”'
    claim: 'The word is tsevi, beauty, honour'
    key: bdb
    url: 'https://biblehub.com/hebrew/6643.htm'
    quote: 'beauty, honour'
  - where: 'note 8:9 “The pleasant land is the land of Israel”'
    claim: 'It is used of the land of Israel, in Ezekiel 20:6, and in Daniel 8:9 especially of Jerusalem and the temple; compare Daniel 11:16, 41, 45'
    key: bdb
    url: 'https://biblehub.com/hebrew/6643.htm'
    quote: 'of land of Israel (Judah)'
  - where: 'note 8:9 “The pleasant land is the land of Israel”'
    claim: 'In Daniel 8:9 it is used especially of Jerusalem and the temple'
    key: bdb
    url: 'https://biblehub.com/hebrew/6643.htm'
    quote: 'especially of Jerusalem and temple Daniel 8:9'
  - where: 'note 8:9 “The pleasant land is the land of Israel”'
    claim: 'The word in 8:9 is lemma 6643, which recurs in Daniel 11:16, 11:41 and 11:45'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'הַ/צֶּֽבִי'
  - where: 'note 8:9 “The pleasant land is the land of Israel”'
    claim: 'Ezekiel 20:6, “the glory of all lands,” has the same word (lemma 6643)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'צְבִ֥י'
  - where: 'note 8:9 “The pleasant land is the land of Israel”'
    claim: 'A modern translation has “the beautiful land”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Daniel%208&version=NRSVUE'
    quote: 'toward the beautiful land'

  # ---------- note 8:10 ----------
  - where: 'note 8:10 “The host, the stars, and the prince of the host”'
    claim: '“Host of heaven” can mean the host of angels; in 8:10 some take it as a figure of Israel'
    key: bdb
    url: 'https://biblehub.com/hebrew/6635.htm'
    quote: 'host (organized body) of angels'
  - where: 'note 8:10 “The host, the stars, and the prince of the host”'
    claim: 'Some take the host of 8:10 as figurative of Israel'
    key: bdb
    url: 'https://biblehub.com/hebrew/6635.htm'
    quote: 'figurative of Israel'
  - where: 'note 8:10 “The host, the stars, and the prince of the host”'
    claim: 'The prince of the host in 8:11 is read as the angel-prince of Israel or as God; Joshua 5:14 has the same title'
    key: bdb
    url: 'https://biblehub.com/hebrew/6635.htm'
    quote: 'Daniel 8:11 (angel-prince of Israel, others, God)'
  - where: 'note 8:19 “How far the vision reaches”'
    claim: 'The stars of heaven are read as the children of God, with Job 38:7 and Revelation 12:4'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'the “stars of heaven” (the children of God—see Job 38:7; Isaiah 14:13; Revelation 12:4)'
  - where: 'note 8:19 “How far the vision reaches”'
    claim: 'Antiochus is read as a type of those who work by Satan’s power'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'he seems to have been a type of those who function through the power of Satan'
  - where: 'note 8:10 “The host, the stars, and the prince of the host”'
    claim: '“Prince of the host” in 8:11 is sar (lemma 8269) with tsaba (lemma 6635)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'שַֽׂר'
  - where: 'note 8:10 “The host, the stars, and the prince of the host”'
    claim: '“Captain of the host” in Joshua 5:14 is the same two words (lemmas 8269 and 6635)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Josh.xml'
    quote: 'צְבָֽא'
  - where: 'note 8:10 “The host, the stars, and the prince of the host”'
    claim: 'Joshua 5:14 reads “captain of the host of the Lord”'
    key: lds-scriptures
