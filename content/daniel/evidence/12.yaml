  - where: 'note 12:2 “The dead awake, to two ends”'
    claim: 'BDB lists deraon (“contempt”) only at Isaiah 66:24 and Daniel 12:2'
    key: bdb
    url: 'https://biblehub.com/hebrew/1860.htm'
    quote: 'Isaiah 66:24 object of abhorrence'
  - where: 'note 12:2 “The dead awake, to two ends”'
    claim: 'BDB on the word in Daniel 12:2 (scripts/hebrew.mjs --word 1860 finds it once in Daniel, at 12:2, and once in Isaiah, at 66:24)'
    key: bdb
    url: 'https://biblehub.com/hebrew/1860.htm'
    quote: 'everlasting abhorrence Daniel 12:2'
  - where: 'note 12:2 “The dead awake, to two ends”'
    claim: 'Isaiah 66:24 is spoken of those who transgressed against the Lord'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/66?lang=eng'
