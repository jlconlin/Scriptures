    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'יָקִ֑יצוּ'
  - where: 'note 12:2 “The dead awake, to two ends”'
    claim: 'Isaiah 26:19 has the same verb qits (H6974) and the same noun aphar (H6083) (scripts/hebrew.mjs isaiah 26:19)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Isa.xml'
    quote: 'הָקִ֨יצוּ'
  - where: 'note 12:2 “The dead awake, to two ends”'
    claim: 'Isaiah 26:19 speaks of the dead who live, arise and sing'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/26?lang=eng'
