chapter: 12
claims:
  # when, setting, thread
  - where: 'when'
    claim: 'The vision of chapters 10–12 is dated to the third year of Cyrus king of Persia'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/10?lang=eng'
    quote: 'In the third year of Cyrus king of Persia a thing was revealed unto Daniel'
  - where: 'setting'
    claim: 'The vision is dated to the third year of Cyrus and is received by the river Hiddekel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/10?lang=eng'
    quote: 'as I was by the side of the great river, which is Hiddekel'
  - where: 'setting'
    claim: 'The messenger of chapter 10 says he has come to make Daniel understand what will befall his people in the latter days'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/10?lang=eng'
    quote: 'Now I am come to make thee understand what shall befall thy people in the latter days: for yet the vision is for many days.'
  - where: 'setting'
    claim: 'The messenger’s account runs from chapter 11 into 12:1–3 without a break (Keil: the angel’s announcements are 11:2–12:3, with the appearance of 10:2–11:1 before them)'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/12.htm'
    quote: 'can only be the announcements of the angel, Daniel 11:2-12:3, along with the preceding appearance, Daniel 10:2-11:1'
  - where: 'setting'
    claim: 'The Savior applied 12:1 to the destruction of Jerusalem'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'The Savior, however, specifically applied Daniel 12:1 to the fall of Judah in A.D. 70 (see JS—M 1:18).'
  - where: 'setting'
    claim: 'Joseph Smith—Matthew is the Savior’s discourse on the destruction of Jerusalem and on His Second Coming; in it He names Daniel again for the last days'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/js-m/1?lang=eng'
    quote: 'And again shall the abomination of desolation, spoken of by Daniel the prophet, be fulfilled.'
  - where: 'setting'
    claim: 'The Revelation of John has an oath like that of 12:7 (the Church’s footnote 7a joins them)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/10?lang=eng'
    quote: 'And sware by him that liveth for ever and ever'
  - where: 'setting'
    claim: 'The Revelation of John has the measure of time of 12:7 (the Church’s footnote 7b cites Rev. 12:13–17)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/12?lang=eng'
    quote: 'where she is nourished for a time, and times, and half a time, from the face of the serpent'
  - where: 'setting'
    claim: 'The Bible Dictionary names Daniel 12 as a testimony of the resurrection'
    key: bd-daniel-book
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/daniel-book-of?lang=eng'
    quote: 'A testimony of mankind’s resurrection is given in Dan. 12.'
  - where: 'thread'
    claim: 'In 11:33 the wise instruct many and fall by sword, flame, captivity and spoil'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/11?lang=eng'
    quote: 'And they that understand among the people shall instruct many: yet they shall fall by the sword, and by flame, by captivity, and by spoil, many days.'
  - where: 'thread'
    claim: 'Keil: 12:2–3 continue the promise of deliverance in 12:1 and say what awaits those of the wise (11:33) who die in the persecution'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/12.htm'
    quote: 'that a part of the people shall outlive the tribulation, but those who lose their lives in the persecution shall rise again from the dead'

  # sections
  - where: 'section 1 plain'
    claim: '“Standeth for” may be rendered “who has charge over” (the Church’s footnote 1b)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/12?lang=eng'
    quote: 'who has charge over'
  - where: 'section 2 plain'
    claim: 'The Hebrew of “scatter the power” is to shatter the hand, a figure for power'
    key: bdb
    url: 'https://biblehub.com/hebrew/5310.htm'
    quote: 'Daniel 12:7 when (they) finish shattering the hand (figurative for power) of the holy people'
  - where: 'section 3 plain'
    claim: '“Stand in thy lot” may be rendered “rise unto your destiny” (the Church’s footnote 13b); the lot is a thing allotted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/12?lang=eng'
    quote: 'rise unto your destiny'
  - where: 'section 3 plain'
    claim: 'The Hebrew goral, “lot,” is a thing assigned or allotted'
    key: bdb
    url: 'https://biblehub.com/hebrew/1486.htm'
    quote: 'thing assigned, apportioned, allotted especially of land assigned by lot, allotment'

  # notes
  - where: 'note 12:1 “Michael, the great prince”'
    claim: 'Latter-day revelation identifies Michael as Adam, the Ancient of Days'
    key: bd-michael
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/michael?lang=eng'
    quote: 'Latter-day revelation informs us that Michael is Adam, the Ancient of Days (Dan. 7), a prince, and the patriarch of the human family'
  - where: 'note 12:1 “Michael, the great prince”'
    claim: 'In Daniel 7 the Son of Man stands before the Ancient of Days, who is Adam, also known as Michael'
    key: bd-daniel-book
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/daniel-book-of?lang=eng'
    quote: 'standing before the Ancient of Days to receive power and glory'
  - where: 'note 12:1 “Michael, the great prince”'
    claim: 'The Church’s footnote 1b on “which standeth for” gives “who has charge over”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/12?lang=eng'
    quote: 'who has charge over'
  - where: 'note 12:1 “Michael, the great prince”'
    claim: 'D&C 88:110 has Satan bound for a thousand years before the battle of verses 112–115'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/88?lang=eng'
    quote: 'and Satan shall be bound, that old serpent, who is called the devil, and shall not be loosed for the space of a thousand years'
  - where: 'note 12:1 “Michael, the great prince”'
    claim: 'D&C 88:115: Michael fights the battle and overcomes him who seeks the throne of the Lamb'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/88?lang=eng'
    quote: 'For Michael shall fight their battles, and shall overcome him who seeketh the throne of him who sitteth upon the throne, even the Lamb.'
  - where: 'note 12:1 “Michael, the great prince”'
    claim: 'D&C 29:26: Michael sounds his trump and then all the dead awake'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/29?lang=eng'
    quote: 'Michael, mine archangel, shall sound his trump, and then shall all the dead awake, for their graves shall be opened, and they shall come forth—yea, even all.'

  - where: 'note 12:1 “A time of trouble such as never was”'
    claim: 'The Savior’s words on the tribulation of Jerusalem (JS—M 1:18)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/js-m/1?lang=eng'
    quote: 'For then, in those days, shall be great tribulation on the Jews, and upon the inhabitants of Jerusalem, such as was not before sent upon Israel, of God, since the beginning of their kingdom until this time'
  - where: 'note 12:1 “A time of trouble such as never was”'
    claim: 'The Savior applied the verse to A.D. 70'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'The Savior, however, specifically applied Daniel 12:1 to the fall of Judah in A.D. 70 (see JS—M 1:18).'
  - where: 'note 12:1 “A time of trouble such as never was”'
    claim: 'The persecution under Antiochus has also been proposed'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'Others have noted that the persecution of the Jews under Antiochus was the most deliberate and savage of their history to that point.'
  - where: 'note 12:1 “A time of trouble such as never was”'
    claim: 'Michael leads the armies of God after the Millennium'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'Further, the Doctrine and Covenants describes Michael as leading the armies of God after the Millennium (see D&C 88:110–16).'
  - where: 'note 12:1 “A time of trouble such as never was”'
    claim: 'Four fulfilments are named (167 B.C., A.D. 70, Armageddon before the Millennium, after the Millennium), and all four may be correct'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'Were these terrible times fulfilled in 167 B.C. or A.D. 70, or are they yet future, either before the Millennium in Armageddon or afterwards? Given the dualistic nature of prophecy in the Old Testament, it is very possible that all four answers are correct.'
  - where: 'note 12:1 “A time of trouble such as never was”'
    claim: 'Keil: the description rests on Jeremiah 30:7'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/12.htm'
    quote: 'The description of this oppression seems to be based on Jeremiah 30:7'
  - where: 'note 12:1 “A time of trouble such as never was”'
    claim: 'The Hebrew of 12:1 is et tsarah, “time of trouble” (H6256, H6869; scripts/hebrew.mjs daniel 12:1)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'צָרָ֔ה'
  - where: 'note 12:1 “A time of trouble such as never was”'
    claim: 'Jeremiah 30:7 has the same two words, et tsarah (H6256, H6869; scripts/hebrew.mjs jeremiah 30:7)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'צָרָ֥ה'

  - where: 'note 12:1 “The book of the delivered”'
    claim: 'The Bible Dictionary lists Dan. 12:1–4 under “Book of life” and describes a heavenly record of the faithful'
    key: bd-book-of-life
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/book-of-life?lang=eng'
    quote: 'However, the scriptures indicate that a heavenly record is kept of the faithful, whose names are recorded, as well as an account of their righteous deeds (D&C 88:2; 128:7).'
  - where: 'note 12:1 “The book of the delivered”'
    claim: 'The entry lists the New Testament verses that name the book of life and adds Dan. 12:1–4'
    key: bd-book-of-life
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/book-of-life?lang=eng'
    quote: 'see also Dan. 12:1–4; Luke 10:20'
  - where: 'note 12:1 “The book of the delivered”'
    claim: 'In D&C 128:6–7 Joseph Smith explains John’s vision of the judgment (Revelation 20:12): the book of life is the record kept in heaven'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/128?lang=eng'
    quote: 'And the book which was the book of life is the record which is kept in heaven'

  - where: 'note 12:2 “The dead awake, to two ends”'
    claim: 'The Church’s chapter heading speaks of the two resurrections'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/12?lang=eng'
    quote: 'Daniel tells of the two resurrections'
  - where: 'note 12:2 “The dead awake, to two ends”'
