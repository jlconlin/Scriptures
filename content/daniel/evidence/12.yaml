  - where: 'note 12:3 “The wise, who make many righteous”'
    claim: 'Daniel 12:10 has the same three verbs, barar (H1305), laban (H3835) and tsaraph (H6884), and the same participle (scripts/hebrew.mjs daniel 12:10)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'וְ/הַ/מַּשְׂכִּלִ֖ים'
  - where: 'note 12:3 “The wise, who make many righteous”'
    claim: '“They that turn many to righteousness” is the causative participle of tsadaq (H6663) with “the many” (H7227) as object (scripts/hebrew.mjs daniel 12:3)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'וּ/מַצְדִּיקֵי֙'
  - where: 'note 12:3 “The wise, who make many righteous”'
    claim: 'Isaiah 53:11 has the same verb in the same causative stem (H6663) with “the many” (H7227) (scripts/hebrew.mjs isaiah 53:11)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Isa.xml'
    quote: 'יַצְדִּ֥יק'
  - where: 'note 12:3 “The wise, who make many righteous”'
    claim: 'Keil reports the view (Kranichfeld’s) that the expression is borrowed from Isaiah 53:11'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/12.htm'
    quote: 'because the expression is borrowed from Isaiah 53:11'
  - where: 'note 12:3 “The wise, who make many righteous”'
    claim: 'Keil: the Servant justifies many by His righteousness, as the sinless one who takes the people’s sins on Himself'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/12.htm'
    quote: 'In Isaiah 53:11 the Servant of Jehovah justifies many, not by the sacrifice, but by His righteousness'
  - where: 'note 12:3 “The wise, who make many righteous”'
    claim: 'Keil: the wise are those who have led many to the knowledge of salvation'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/12.htm'
    quote: 'Then shall they who in the times of tribulation have led many to the knowledge of salvation receive the glorious reward of their faithfulness.'

  - where: 'note 12:3 “Shining like the sky and the stars”'
    claim: 'Daniel was shown that the wise shine when they are resurrected'
    key: sc-knowhy-469
    url: 'https://scripturecentral.org/knowhy/why-are-lehis-visions-like-those-of-other-prophets-in-his-day'
    quote: 'Similarly, Daniel was later shown that when the “wise” (those destined for “everlasting life”) and “they that turn many to righteousness” are resurrected'
  - where: 'note 12:3 “Shining like the sky and the stars”'
    claim: 'Lehi was likely shown the Lamb and the Twelve Apostles in their future resurrected state'
    key: sc-knowhy-469
    url: 'https://scripturecentral.org/knowhy/why-are-lehis-visions-like-those-of-other-prophets-in-his-day'
    quote: 'He was likely being shown the “Lamb of God,” as well as the “twelve apostles of the Lamb,” as they would appear in their future, glorified, resurrected state'

