    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'וְ/הַ֨/מַּשְׂכִּלִ֔ים'
  - where: 'note 12:3 “The wise, who make many righteous”'
    claim: 'BDB gives “the teachers” or “the wise” for the word at Daniel 11:33, 35; 12:3, 10'
    key: bdb
    url: 'https://biblehub.com/hebrew/7919.htm'
    quote: 'Daniel 11:33,35; Daniel 12:3,10 the teachers (so Ew Hi Bev; Thes Ke Behrm and others the wise)'
  - where: 'note 12:3 “The wise, who make many righteous”'
    claim: 'Keil: the word refers back to 11:33–35'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/12.htm'
    quote: 'refers back to Daniel 11:33-35'
  - where: 'note 12:3 “The wise, who make many righteous”'
    claim: 'Daniel 11:33 in the King James Version: “they that understand … shall instruct many … shall fall by the sword”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/11?lang=eng'
    quote: 'And they that understand among the people shall instruct many: yet they shall fall by the sword'
  - where: 'note 12:3 “The wise, who make many righteous”'
    claim: 'Daniel 11:35 in the King James Version: “them of understanding”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/11?lang=eng'
    quote: 'And some of them of understanding shall fall, to try them, and to purge, and to make them white, even to the time of the end'
  - where: 'note 12:3 “The wise, who make many righteous”'
    claim: 'The word in 11:35 is the same participle (H7919; scripts/hebrew.mjs daniel 11:35), and the three verbs there are tsaraph (H6884), barar (H1305) and laban (H3835)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
