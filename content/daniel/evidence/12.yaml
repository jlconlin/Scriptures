  - where: 'note 12:2 “The dead awake, to two ends”'
    claim: 'The Church’s footnote 2a on “sleep” cites John 5:28–29'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/12?lang=eng'
    quote: 'John 5:28 (28–29)'
  - where: 'note 12:2 “The dead awake, to two ends”'
    claim: 'D&C 76:15–17: the vision came when the translation reached John 5:29, given as the resurrection of the just and of the unjust'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/76?lang=eng'
    quote: 'And shall come forth; they who have done good, in the resurrection of the just; and they who have done evil, in the resurrection of the unjust.'
  - where: 'note 12:2 “The dead awake, to two ends”'
    claim: 'The Savior says all that are in the graves shall hear His voice'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/5?lang=eng'
    quote: 'Marvel not at this: for the hour is coming, in the which all that are in the graves shall hear his voice,'

  - where: 'note 12:3 “The wise, who make many righteous”'
