    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/2?lang=eng'
    quote: 'the mountain of the Lord’s house shall be established in the top of the mountains'

  - where: 'note 2:38 “Which kingdoms the metals are”'
    claim: 'Scripture Helps names Babylon and leaves the others as kingdoms after Babylon’s fall'
    key: scripture-helps-dan
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/44-daniel-1-7?lang=eng'
    quote: 'The other sections of the statue represented kingdoms that would rise after Babylon’s fall.'
  - where: 'note 2:38 “Which kingdoms the metals are”'
    claim: 'President Kimball’s list: Medes and Persians, Greece or Macedonia, Rome, and the nations of Europe'
