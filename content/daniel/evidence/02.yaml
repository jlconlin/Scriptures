chapter: 2
claims:
  - where: 'when'
    claim: 'The Church’s helps place the events of Daniel 1:1 around 606 B.C.'
    key: scripture-helps-dan
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/44-daniel-1-7?lang=eng'
    quote: 'While the Bible indicates that these events took place around 606 BC, during the third year of King Jehoiakim’s reign'

  - where: 'setting'
    claim: 'The four were schooled by the king’s order and found ten times better; Daniel had understanding in visions and dreams'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/1?lang=eng'
    quote: 'As for these four children, God gave them knowledge and skill in all learning and wisdom: and Daniel had understanding in all visions and dreams.'
  - where: 'setting'
    claim: 'A task of the prophets of the exile was to assure Judah that Jehovah was with her in Babylon and governed all nations; Daniel has two stories on the point, this the first'
    key: draper-exile
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/prophets-exile'
    quote: 'An important task of the prophets was to assure Judah that, even in Babylon, Jehovah was with her. They did that by reinforcing the idea that Jehovah governed and controlled the destiny of all nations, including Babylon.'
  - where: 'setting'
    claim: 'The first of Daniel’s stories on the point is the dream of the great image'
    key: draper-exile
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/prophets-exile'
    quote: 'The first dealt with Nebuchadnezzar’s dream of the great image.'
  - where: 'setting'
    claim: 'Daniel 2:4–7:28 is in Aramaic'
    key: bd-daniel-book
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/daniel-book-of?lang=eng'
    quote: 'Dan. 2:4–7:28 is written in Aramaic and the rest in Hebrew.'
  - where: 'setting'
    claim: 'Chapter 7 tells of four beasts that are four kings, and the saints take the kingdom'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/7?lang=eng'
    quote: 'These great beasts, which are four, are four kings, which shall arise out of the earth.'

  - where: 'thread'
    claim: 'The story turns on Daniel’s ability to tell the dream, and the dream on God’s setting up kingdoms'
    key: draper-exile
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/prophets-exile'
    quote: 'So that his readers would not miss the point, Daniel further testified that Jehovah was also the one who “changeth the times and the seasons: he removeth kings, and setteth up kings”'

  - where: 'section 1 plain'
    claim: '“The thing is gone from me” is better “the word is assured on my part”'
    key: bdb
    url: 'https://biblehub.com/hebrew/230.htm'
    quote: 'the word is assured on my part'
  - where: 'section 1 plain'
    claim: '“Till the time be changed” means until circumstances change'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/2?lang=eng'
    quote: 'IE till with time circumstance will change.'
  - where: 'section 3 plain'
    claim: 'Verse 30: so that the interpretation would be made known to the king'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/2?lang=eng'
    quote: 'Aramaic: in order that the interpretation may be made known to the king.'
  - where: 'section 4 plain'
    claim: '“The form thereof was terrible”: its appearance was frightening'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/2?lang=eng'
    quote: 'Aramaic: its appearance was frightening.'
  - where: 'section 6 plain'
    claim: '“Sat in the gate of the king”: remained at the king’s court'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/2?lang=eng'
    quote: 'OR remained at the king’s court.'

  - where: 'note 2:1 “The second year and the three years of schooling”'
    claim: 'Chapter 1 has three years of training ordered and the youths brought in at the end of the days'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/1?lang=eng'
    quote: 'so nourishing them three years, that at the end thereof they might stand before the king'
  - where: 'note 2:1 “The second year and the three years of schooling”'
    claim: 'Keil: Nebuchadnezzar came to the throne a year or more after the first siege, so the three years ended about the end of his second year; he calls the difficulty an apparent contradiction'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/1.htm'
    quote: 'The time of Nebuchadnezzar''s ascending the throne and commencing his reign was a year or a year and a half after the first siege of Jerusalem; thus in the second year of his reign, that is about the end of it, the three years of the education of the Hebrew youths in the wisdom of the Chaldees would have come to an end. Thus the apparent contradiction between Daniel 2:1 and Daniel 1:1 is cleared up.'
  - where: 'note 2:1 “The second year and the three years of schooling”'
    claim: 'Keil: the carrying away of the youths followed the subjugation of Jehoiakim, so a year or more of schooling had passed before Nebuchadnezzar took the throne'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/1.htm'
    quote: 'so that a whole year or more of their period of education had passed before Nebuchadnezzar mounted the throne'

  - where: 'note 2:2 “Chaldeans: a country and a profession”'
    claim: 'In Dan. 2:2, 10 the name is applied to a learned class'
    key: bd-chaldea
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/chaldea?lang=eng'
    quote: 'In Dan. 2:2, 10 the name is applied to a learned class in Babylon who made a special study of astrology.'
  - where: 'note 2:2 “Chaldeans: a country and a profession”'
    claim: 'Verse 27 lists four kinds of experts with soothsayers as the fourth; verse 12 calls them the wise men of Babylon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/2?lang=eng'
    quote: 'cannot the wise men, the astrologers, the magicians, the soothsayers, shew unto the king'

  - where: 'note 2:4 “The book changes language here”'
    claim: 'The Church’s footnote: “Syriack” is Aramaic'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/2?lang=eng'
    quote: 'HEB Aramaic (a language related to Hebrew).'
  - where: 'note 2:4 “The book changes language here”'
    claim: 'The Hebrew word is aramit, and the words after it in the verse are Aramaic'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'אֲרָמִ֑ית'
  - where: 'note 2:4 “The book changes language here”'
    claim: 'Daniel 2:4–7:28 is in Aramaic, the rest in Hebrew'
    key: bd-daniel-book
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/daniel-book-of?lang=eng'
    quote: 'Dan. 2:4–7:28 is written in Aramaic and the rest in Hebrew.'
  - where: 'note 2:4 “The book changes language here”'
    claim: 'Aramaic was spoken widely throughout the Near East'
    key: bd-aramaic
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/aramaic?lang=eng'
    quote: 'An official language of the Persian Empire, spoken widely throughout the Near East.'
  - where: 'note 2:4 “The book changes language here”'
    claim: 'Chapter 7, the end of the Aramaic, has four beasts as four kings and the kingdom taken by the saints'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/7?lang=eng'
    quote: 'But the saints of the most High shall take the kingdom, and possess the kingdom for ever, even for ever and ever.'

  - where: 'note 2:5 “The king had probably not forgotten his dream”'
    claim: 'Azda is an adjective, sure or assured, from Persian; the clause is “the word is assured on my part”'
    key: bdb
    url: 'https://biblehub.com/hebrew/230.htm'
    quote: 'adjective sure, assured (Persian azda'
  - where: 'note 2:5 “The king had probably not forgotten his dream”'
    claim: 'BDB renders the clause “the word is assured on my part”'
    key: bdb
    url: 'https://biblehub.com/hebrew/230.htm'
    quote: 'the word is assured on my part'
  - where: 'note 2:5 “The king had probably not forgotten his dream”'
    claim: 'The King James and others took the word as a verb, “is gone”'
    key: bdb
    url: 'https://biblehub.com/hebrew/230.htm'
    quote: 'as verb is gone'
  - where: 'note 2:5 “The king had probably not forgotten his dream”'
    claim: 'The Aramaic word in 2:5 is azda'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'אַזְדָּ֑א'
  - where: 'note 2:5 “The king had probably not forgotten his dream”'
    claim: 'The Greek translation reads “has departed from me”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/daniel/2.htm'
    quote: 'The thing has departed from me'
  - where: 'note 2:5 “The king had probably not forgotten his dream”'
    claim: 'NRSVUE renders 2:5 “This is a public decree”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Daniel%202%3A5-9%2C43&version=NRSVUE'
    quote: 'This is a public decree'
  - where: 'note 2:5 “The king had probably not forgotten his dream”'
    claim: 'NRSVUE renders 2:8 “the decree from me is firm”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Daniel%202%3A5-9%2C43&version=NRSVUE'
    quote: 'the decree from me is firm'
  - where: 'note 2:5 “The king had probably not forgotten his dream”'
    claim: 'The Church’s footnote: he knew his dream and wished to test them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/2?lang=eng'
    quote: 'Persian: sure with me; i.e., he knew his dream and desired to test them.'
  - where: 'note 2:5 “The king had probably not forgotten his dream”'
    claim: 'The Student Manual prints Rasmussen: the phrase should probably read “is certain with me”'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'should probably read ‘is certain with me,’ as the Persian word azda (‘sure’) is used'
  - where: 'note 2:5 “The king had probably not forgotten his dream”'
    claim: 'The demand to be told the dream was insurance that the interpretation was true'
    key: draper-exile
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/prophets-exile'
    quote: 'tell him the dream before they interpreted it, as insurance that their interpretation was true'

  - where: 'note 2:11 “What the wise men admit, and what Daniel answers”'
    claim: 'The point of the story is Daniel’s ability to tell the dream'
    key: draper-exile
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/prophets-exile'
    quote: 'The important point of the story was not only that Daniel interpreted the king’s dream but also that he had the ability to do it.'
  - where: 'note 2:11 “What the wise men admit, and what Daniel answers”'
    claim: 'The wise men’s gods were distant; Daniel’s God immediate and personal'
    key: draper-exile
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/prophets-exile'
    quote: 'the response of the Babylonian wise men underscores their belief that their own gods were distant and impersonal, while Daniel’s shows that Jehovah, even in Babylon, was immediate and personal'
  - where: 'note 2:11 “What the wise men admit, and what Daniel answers”'
    claim: 'The vessels of the house of God were in the treasure house of Nebuchadnezzar’s god'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/1?lang=eng'
    quote: 'he brought the vessels into the treasure house of his god'

  - where: 'note 2:21 “The hymn says first what the dream will show”'
    claim: '“Setteth up” (2:21) and “set up” (2:44) are forms of the same Aramaic verb (Strong’s 6966)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'מְהָקֵ֣ים'
  - where: 'note 2:21 “The hymn says first what the dream will show”'
    claim: 'The verb of 2:44, “shall set up”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'יְקִים֩'
  - where: 'note 2:21 “The hymn says first what the dream will show”'
    claim: 'The dream shows Jehovah choosing Nebuchadnezzar and setting up the kingdoms that follow'
    key: draper-exile
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/prophets-exile'
    quote: 'It was Jehovah who chose Nebuchadnezzar to be king and who would set up all the kingdoms to follow until God’s own eternal kingdom overmastered and ruled the rest'
  - where: 'note 2:21 “The hymn says first what the dream will show”'
    claim: 'The Church’s footnote on “removeth” points to Jeremiah 27:5–6'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/2?lang=eng'
