  - where: 'note 2:34 “The stone no one cut”'
    claim: 'The stone cut without hands means the kingdom is established by God, not by humans'
    key: scripture-helps-dan
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/44-daniel-1-7?lang=eng'
    quote: 'The stone being cut out of the mountain without hands symbolizes that the kingdom would be established by God, not by humans.'
  - where: 'note 2:34 “The stone no one cut”'
    claim: '“Together” in 2:35 is “as one,” at once, with one stroke'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/2.htm'
    quote: 'as one equals at once, with one stroke'
  - where: 'note 2:34 “The stone no one cut”'
    claim: 'An explanation quoted by Keil (from Kliefoth): the earlier forms of the world-power pass into the later and are destroyed with the last'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/2.htm'
    quote: 'pass into the later forms of it, and thus are all destroyed when the stone destroys the last form of the world-power'
  - where: 'note 2:34 “The stone no one cut”'
