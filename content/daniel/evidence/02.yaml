    key: rasband-fulfillment
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2020/04/41rasband?lang=eng'
    quote: '“Without hands,” meaning by divine intervention, the Lord’s Church would increase in magnitude until it fills the whole earth'
