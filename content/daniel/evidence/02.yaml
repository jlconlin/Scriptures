  - where: 'note 2:38 “Which kingdoms the metals are”'
    claim: 'President Clawson (1930), as the Student Manual prints him: the same succession, with the legs as Rome and Constantinople'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'The head of the government in one division was at Rome and the head of the government in the other division was at Constantinople. So these two great divisions represented the legs of iron.'
  - where: 'note 2:38 “Which kingdoms the metals are”'
    claim: 'Chapter 8 names Media and Persia and Grecia'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/8?lang=eng'
    quote: 'The ram which thou sawest having two horns are the kings of Media and Persia.'
  - where: 'note 2:38 “Which kingdoms the metals are”'
    claim: 'Scholars debate the identity of the image'
    key: frederick-old-wine
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/old-wine-new-bottles'
    quote: 'There remains a great deal of scholarly debate as to the identity of this image.'
  - where: 'note 2:38 “Which kingdoms the metals are”'
    claim: 'The Church’s footnotes at 2:38–40 point to the beasts of Daniel 7:4, 5, 7'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/2?lang=eng'
    quote: 'Dan. 7:4'

