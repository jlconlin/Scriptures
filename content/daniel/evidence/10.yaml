chapter: 10
claims:
  # when, setting, thread
  - where: 'when'
    claim: 'Cyrus conquered Babylon in 539 B.C., so his third year is about 536 B.C. by counting'
    key: scripture-helps-dan
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/44-daniel-1-7?lang=eng'
    quote: 'lasting into the reign of King Cyrus of Persia, who conquered Babylon in 539 BC'
  - where: 'setting'
    claim: 'Cyrus conquered Babylon in 539 B.C.; Daniel was taken to Babylon as a young man around the beginning of the sixth century B.C., so he is old by about 536 B.C.'
    key: scripture-helps-dan
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/44-daniel-1-7?lang=eng'
    quote: 'As young men they were taken to Babylon around the beginning of the sixth century BC'
  - where: 'setting'
    claim: 'Hiddekel is the Tigris (the Church’s footnote 4a)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/10?lang=eng'
    quote: 'IE the Tigris.'
  - where: 'setting'
    claim: 'The speech begun in 10:20 runs on across the chapter break into 11:1–2'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/11?lang=eng'
    quote: 'Also I in the first year of Darius the Mede, even I, stood to confirm and to strengthen him.'
  - where: 'setting'
    claim: 'The man clothed in linen is still present at the end of the vision, in chapter 12'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/12?lang=eng'
    quote: 'And I heard the man clothed in linen, which was upon the waters of the river'
  - where: 'setting'
    claim: 'What follows runs from Daniel’s time far into the future, including the latter days'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'was not an account of the latter days only but was also an account of things from Daniel’s time extending far into the future, including the latter days'
  - where: 'thread'
    claim: 'The Hebrew of 10:1 speaks of a great conflict where the King James has “the time appointed was long”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Daniel%2010&version=NRSVUE'
    quote: 'The word was true, and it concerned a great conflict.'
  - where: 'thread'
    claim: 'The verb “strengthen” of 10:18–19 returns in 10:21, “holdeth with me”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'מִתְחַזֵּ֤ק'

  # sections
  - where: 'section 1 plain'
    claim: 'Verse 1: the word concerned a great conflict'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Daniel%2010&version=NRSVUE'
    quote: 'The word was true, and it concerned a great conflict.'
  - where: 'section 1 plain'
    claim: 'Verse 3: “pleasant bread” is desirable food (the Church’s footnote 3a)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/10?lang=eng'
    quote: 'HEB desirable foods.'
  - where: 'section 2 plain'
    claim: 'Verse 8: his appearance was disfigured; a modern translation has “deathly pale”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Daniel%2010&version=NRSVUE'
    quote: 'My strength left me, and my complexion grew deathly pale, and I retained no strength.'
  - where: 'section 3 plain'
    claim: 'Verse 12: “chasten thyself” is to humble thyself (the Church’s footnote 12c)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/10?lang=eng'
    quote: 'HEB humble thyself.'
  - where: 'section 3 plain'
    claim: 'Verse 12: “I am come for thy words” means because of them'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Daniel%2010&version=NRSVUE'
    quote: 'your words have been heard, and I have come because of your words'
  - where: 'section 4 plain'
    claim: 'Verse 16: “my sorrows are turned upon me” is pain or anguish coming over him'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Daniel%2010&version=NRSVUE'
    quote: 'because of the vision such pains have come upon me that I retain no strength'
  - where: 'section 5 plain'
    claim: 'Verse 21: what is inscribed in the writing of truth; no one supports the messenger against the princes of Persia and Grecia except Michael (the Church’s footnote 21a)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/10?lang=eng'
    quote: 'No one supports me against them'

  # note 10:1 Cyrus
  - where: 'note 10:1 “The third year of Cyrus, and Daniel still in the east”'
    claim: 'Cyrus conquered Babylon in 539 B.C.'
    key: scripture-helps-dan
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/44-daniel-1-7?lang=eng'
    quote: 'lasting into the reign of King Cyrus of Persia, who conquered Babylon in 539 BC'
  - where: 'note 10:1 “The third year of Cyrus, and Daniel still in the east”'
    claim: 'Cyrus decreed that the Jews might return and rebuild the temple'
    key: bd-cyrus
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/cyrus?lang=eng'
    quote: 'He issued a decree allowing the Jews to return to the land of Judah and rebuild the temple'
  - where: 'note 10:1 “The third year of Cyrus, and Daniel still in the east”'
    claim: 'Ezra dates the decree to the first year of Cyrus'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/1?lang=eng'
    quote: 'Now in the first year of Cyrus king of Persia, that the word of the Lord by the mouth of Jeremiah might be fulfilled'
  - where: 'note 10:1 “The third year of Cyrus, and Daniel still in the east”'
    claim: 'Daniel 1:21 says he continued to the first year of Cyrus'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/1?lang=eng'
    quote: 'And Daniel continued even unto the first year of king Cyrus.'
  - where: 'note 10:1 “The third year of Cyrus, and Daniel still in the east”'
    claim: 'The third year of Cyrus is the date of this chapter; the Tigris is where he is'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/10?lang=eng'
    quote: 'In the third year of Cyrus king of Persia a thing was revealed unto Daniel, whose name was called Belteshazzar'

  # note 10:1 the time appointed
  - where: 'note 10:1 “A great conflict”'
    claim: 'The Hebrew of “the time appointed” is tsaba, the word for an army or warfare'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'וְ/צָבָ֣א'
  - where: 'note 10:1 “A great conflict”'
    claim: 'BDB: tsaba is army, war, warfare'
    key: bdb
    url: 'https://biblehub.com/hebrew/6635.htm'
    quote: 'army, war, warfare'
  - where: 'note 10:1 “A great conflict”'
    claim: 'BDB lists Daniel 10:1 with Job 7:1 and Isaiah 40:2 under hard service of troubled life'
    key: bdb
    url: 'https://biblehub.com/hebrew/6635.htm'
    quote: 'b. of hard service of troubled life Job 7:1; Job 14:14; Isaiah 40:2; Daniel 10:1.'
  - where: 'note 10:1 “A great conflict”'
    claim: 'A modern translation: the word concerned a great conflict'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Daniel%2010&version=NRSVUE'
    quote: 'The word was true, and it concerned a great conflict.'
  - where: 'note 10:1 “A great conflict”'
    claim: 'The ancient Greek version took the words differently: great power was given to Daniel'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/daniel/10.htm'
    quote: 'and the thing was true, and great power and understanding in the vision was given to him'
  - where: 'note 10:1 “A great conflict”'
    claim: 'The King James gives the same word as “an appointed time” in Job 7:1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/7?lang=eng'
    quote: 'Is there not an appointed time to man upon earth?'
  - where: 'note 10:1 “A great conflict”'
    claim: 'The King James gives the same word as “warfare” in Isaiah 40:2'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/40?lang=eng'
    quote: 'that her warfare is accomplished'
  - where: 'note 10:3 “Three weeks of mourning, through Passover”'
    claim: '“Pleasant bread” is desirable food (the Church’s footnote 3a)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/10?lang=eng'
    quote: 'HEB desirable foods.'
  - where: 'note 10:3 “Three weeks of mourning, through Passover”'
    claim: 'In chapter 9 Daniel sought the Lord with fasting, sackcloth and ashes'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/9?lang=eng'
    quote: 'to seek by prayer and supplications, with fasting, and sackcloth, and ashes'
  - where: 'note 10:3 “Three weeks of mourning, through Passover”'
    claim: 'Anointing with oil was a sign of joy, left off in sorrow'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/10.htm'
    quote: 'The anointing with oil was the sign of joy and of a joyous frame of mind, as with guests at a banquet, Amos 6:6, and was intermitted in the time of sorrow'
  - where: 'note 10:3 “Three weeks of mourning, through Passover”'
    claim: 'Passover and unleavened bread ran from the fourteenth to the twenty-first day of the first month'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/12?lang=eng'
    quote: 'In the first month, on the fourteenth day of the month at even, ye shall eat unleavened bread, until the one and twentieth day of the month at even.'
  - where: 'note 10:3 “Three weeks of mourning, through Passover”'
    claim: 'Exactly when the fast began and ended cannot be settled from the text'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/10.htm'
    quote: 'so that the question as to the beginning and the end of the fast is not certainly answered from the text'
  - where: 'note 10:3 “Three weeks of mourning, through Passover”'
    claim: 'The temple’s foundation was begun in the second year of the return'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/3?lang=eng'
    quote: 'Now in the second year of their coming unto the house of God at Jerusalem, in the second month, began Zerubbabel'
  - where: 'note 10:3 “Three weeks of mourning, through Passover”'
    claim: 'The work was opposed at the Persian court all the days of Cyrus'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/4?lang=eng'
    quote: 'And hired counsellors against them, to frustrate their purpose, all the days of Cyrus king of Persia, even until the reign of Darius king of Persia.'
  - where: 'note 10:3 “Three weeks of mourning, through Passover”'
    claim: 'Keil’s inference: Daniel mourned at Passover over the delay of his people’s promised salvation, because of that opposition'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/10.htm'
    quote: 'to mourn in fasting and prayer over the delay of the salvation promised to his people'

  # note 10:5 linen
  - where: 'note 10:5 “The man clothed in linen”'
    claim: 'The chapter heading says Daniel sees the Lord and others'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/10?lang=eng'
    quote: 'Daniel sees the Lord and others in a glorious vision'
  - where: 'note 10:5 “The man clothed in linen”'
    claim: 'The Student Manual reads 10:5–8 as the Lord’s appearance and compares Ezekiel 1, Revelation 1 and D&C 110'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'Daniel tried to describe the glory and majesty of the Lord. His description is very much like that given by other prophets in similar circumstances. Compare this passage with Ezekiel 1:26–28; Revelation 1:13–15; D&C 110:2–3.'
  - where: 'note 10:5 “The man clothed in linen”'
    claim: 'John’s vision of the Son of man: the long garment and golden girdle'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/1?lang=eng'
    quote: 'one like unto the Son of man, clothed with a garment down to the foot, and girt about the paps with a golden girdle'
  - where: 'note 10:5 “The man clothed in linen”'
    claim: 'John’s vision: feet like fine brass and a voice like many waters'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/1?lang=eng'
    quote: 'And his feet like unto fine brass, as if they burned in a furnace; and his voice as the sound of many waters.'
  - where: 'note 10:5 “The man clothed in linen”'
    claim: 'The Lord in the Kirtland Temple: eyes as a flame of fire, the voice of Jehovah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/110?lang=eng'
    quote: 'His eyes were as a flame of fire; the hair of his head was white like the pure snow'
  - where: 'note 10:5 “The man clothed in linen”'
    claim: 'Ezekiel’s vision of the glory of the Lord in the likeness of a man'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/1?lang=eng'
    quote: 'upon the likeness of the throne was the likeness as the appearance of a man above upon it'
  - where: 'note 10:5 “The man clothed in linen”'
    claim: 'The Hebrew word for the linen is baddim'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'בַּדִּ֑ים'
  - where: 'note 10:5 “The man clothed in linen”'
    claim: 'BDB: bad is white linen, the material of priestly vestments'
    key: bdb
    url: 'https://biblehub.com/hebrew/906.htm'
    quote: 'in P as material of different priestly vestments'
  - where: 'note 10:5 “The man clothed in linen”'
    claim: 'BDB: white linen'
    key: bdb
    url: 'https://biblehub.com/hebrew/906.htm'
    quote: 'white linen (derivation unknown)'
  - where: 'note 10:5 “The man clothed in linen”'
    claim: 'The high priest wore linen on the Day of Atonement'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/16?lang=eng'
    quote: 'He shall put on the holy linen coat'
  - where: 'note 10:5 “The man clothed in linen”'
    claim: 'Ezekiel saw a man clothed with linen among the seven'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/9?lang=eng'
    quote: 'one man among them was clothed with linen, with a writer’s inkhorn by his side'
  - where: 'note 10:5 “The man clothed in linen”'
    claim: 'Draper: John’s words for the Lord’s robes are those of the Septuagint for the high priest’s vestments and for Daniel 10:5; the golden girdle marked royalty; the Lord appears as king and priest'
    key: draper-apocalyptic
    url: 'https://rsc.byu.edu/sperry-symposium-classics-new-testament/apocalyptic-witness-messiah'
    quote: 'The golden girdle, or clasp, worn at breast level, marked royalty. [14] Thus, the Lord presents Himself as both king and priest'
  - where: 'note 10:5 “The man clothed in linen”'
    claim: 'Draper: the same words as the Septuagint uses for the high priest’s vestments'
    key: draper-apocalyptic
    url: 'https://rsc.byu.edu/sperry-symposium-classics-new-testament/apocalyptic-witness-messiah'
    quote: 'are the same as those used in the Septuagint for the vestments of the high priest (see Exodus 28:4; 29:5; Daniel 10:5)'
  - where: 'note 10:5 “The man clothed in linen”'
    claim: 'At the end of the vision the man in linen is above the river and two others stand on the banks'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/12?lang=eng'
    quote: 'there stood other two, the one on this side of the bank of the river, and the other on that side of the bank of the river'
  - where: 'note 10:5 “The man clothed in linen”'
    claim: 'The man in linen is upon the waters of the river'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/12?lang=eng'
    quote: 'And one said to the man clothed in linen, which was upon the waters of the river'
  - where: 'note 10:5 “The man clothed in linen”'
    claim: 'Keil reports the view (Hengstenberg, C. B. Michaelis) that the glorious figure is silent and a messenger speaks for him'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/10.htm'
    quote: 'The Angel of the Lord is present in silent majesty, and only by a brief sentence confirms the words of his messenger'
  - where: 'note 10:5 “The man clothed in linen”'
    claim: 'Keil himself holds that the difference between the one who appears and the one who speaks is not made out'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/10.htm'
    quote: 'the assumed difference between him who speaks, Daniel 10:11, and him who appears, Daniel 10:5, Daniel 10:6, is not made out'
  - where: 'note 10:5 “The man clothed in linen”'
    claim: 'Keil: being helped by Michael does not make the speaker Michael’s inferior'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/10.htm'
    quote: 'does not denote that he who speaks was an angel subordinated to the archangel Michael'
  - where: 'note 10:5 “The man clothed in linen”'
    claim: 'Keil: the phrases of 10:16 and 10:18 leave the one who touched Daniel undefined'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/10.htm'
    quote: 'both forms of expression leave the person of him who touched him undefined'

  # note 10:8 strength
  - where: 'note 10:8 “Strength gone, and given back by three touches”'
    claim: 'In chapter 8 Daniel likewise fell into a deep sleep and was touched and set upright'
