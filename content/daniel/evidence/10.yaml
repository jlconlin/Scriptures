    url: 'https://biblehub.com/hebrew/2530.htm'
    quote: 'noun feminine desirableness, preciousness'
  - where: 'note 10:11 “A man greatly beloved”'
    claim: 'BDB: used of desirable, choice things such as garments and precious things such as gold'
