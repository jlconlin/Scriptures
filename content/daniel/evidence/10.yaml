    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/8?lang=eng'
    quote: 'I was in a deep sleep on my face toward the ground: but he touched me, and set me upright'
  - where: 'note 10:8 “Strength gone, and given back by three touches”'
    claim: 'BDB: hod is splendour, majesty, vigour'
    key: bdb
    url: 'https://biblehub.com/hebrew/1935.htm'
    quote: 'splendour, majesty, vigour (chiefly in poetry)'
  - where: 'note 10:8 “Strength gone, and given back by three touches”'
    claim: 'BDB places Daniel 10:8 under manly vigour as displayed in outward appearance'
    key: bdb
    url: 'https://biblehub.com/hebrew/1935.htm'
    quote: 'as displayed in outward appearance'
  - where: 'note 10:8 “Strength gone, and given back by three touches”'
    claim: 'BDB: mashchith is ruin, destruction; in Daniel 10:8, disfigurement'
    key: bdb
    url: 'https://biblehub.com/hebrew/4889.htm'
    quote: 'Daniel 10:8 (disfigurement)'
  - where: 'note 10:8 “Strength gone, and given back by three touches”'
    claim: 'A modern translation: his complexion grew deathly pale'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Daniel%2010&version=NRSVUE'
    quote: 'my complexion grew deathly pale'
  - where: 'note 10:8 “Strength gone, and given back by three touches”'
    claim: 'A seraph’s coal touched Isaiah’s lips'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/6?lang=eng'
    quote: 'And he laid it upon my mouth, and said, Lo, this hath touched thy lips'
  - where: 'note 10:8 “Strength gone, and given back by three touches”'
    claim: 'The Lord’s hand touched Jeremiah’s mouth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/1?lang=eng'
    quote: 'Then the Lord put forth his hand, and touched my mouth.'
  - where: 'note 10:8 “Strength gone, and given back by three touches”'
    claim: 'The verb “strengthen” (chazaq) comes once in 10:18 and four times in 10:19'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'הִתְחַזַּ֔קְתִּי'
  - where: 'note 10:8 “Strength gone, and given back by three touches”'
    claim: 'The same verb is “holdeth” in 10:21'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'מִתְחַזֵּ֤ק'
  - where: 'note 10:8 “Strength gone, and given back by three touches”'
    claim: 'Moses lost his natural strength for many hours after seeing God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/1?lang=eng'
    quote: 'it was for the space of many hours before Moses did again receive his natural strength like unto man'
  - where: 'note 10:8 “Strength gone, and given back by three touches”'
