    quote: 'When the light had departed, I had no strength; but soon recovering in some degree, I went home.'
  - where: 'note 10:8 “Strength gone, and given back by three touches”'
    claim: 'KnoWhy 460: spiritual experiences drain people’s strength in the Book of Mormon, and Moses and Daniel had the same experience'
    key: sc-knowhy-460
    url: 'https://scripturecentral.org/knowhy/why-are-people-exhausted-by-powerful-spiritual-experiences'
    quote: 'Other ancient prophets like Moses and Daniel did so as well.'
  - where: 'note 10:8 “Strength gone, and given back by three touches”'
    claim: 'KnoWhy 460: spiritual experiences drain their strength'
    key: sc-knowhy-460
    url: 'https://scripturecentral.org/knowhy/why-are-people-exhausted-by-powerful-spiritual-experiences'
    quote: 'spiritual experiences drain their strength, causing them to become completely exhausted'

  # note 10:11 greatly beloved
  - where: 'note 10:11 “A man greatly beloved”'
    claim: 'The Hebrew word in 10:11 is chamudot'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'חֲ֠מֻדוֹת'
  - where: 'note 10:11 “A man greatly beloved”'
    claim: 'The same word stands in 10:3, “pleasant bread”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'חֲמֻד֞וֹת'
  - where: 'note 10:11 “A man greatly beloved”'
    claim: 'BDB: the noun is desirableness, preciousness'
