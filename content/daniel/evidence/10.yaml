  - where: 'note 10:11 “A man greatly beloved”'
    claim: 'BDB: of a man only in Daniel 10:11, 19 and 9:23, “thou art a precious treasure”'
    key: bdb
    url: 'https://biblehub.com/hebrew/2530.htm'
    quote: 'Daniel 9:23 thou art a precious treasure'
  - where: 'note 10:11 “A man greatly beloved”'
    claim: 'Gabriel said the same of Daniel in chapter 9'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/9?lang=eng'
    quote: 'for thou art greatly beloved: therefore understand the matter, and consider the vision'

  # note 10:12 first day
  - where: 'note 10:12 “Heard on the first day, answered on the twenty-first”'
    claim: 'In chapter 9 the answer went out at the beginning of Daniel’s prayer'
    key: lds-scriptures
