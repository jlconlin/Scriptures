chapter: 1
claims:
  # when, setting
  - where: 'when'
    claim: 'The Church’s newest help: the Bible places the events around 606 B.C., in Jehoiakim’s third year'
    key: scripture-helps-dan
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/44-daniel-1-7?lang=eng'
    quote: 'While the Bible indicates that these events took place around 606 BC, during the third year of King Jehoiakim’s reign'
  - where: 'when'
    claim: 'The Student Manual dates the first captivity about 605 B.C.'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'At the time that Nebuchadnezzar first carried the Jews captive into Babylon (about 605 B.C.), Daniel was chosen as one of the choicest Jewish youths'
  - where: 'when'
    claim: 'Cyrus took Babylon in 539 B.C.'
    key: scripture-helps-dan
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/44-daniel-1-7?lang=eng'
    quote: 'lasting into the reign of King Cyrus of Persia, who conquered Babylon in 539 BC'
  - where: 'setting'
    claim: 'Scholars generally date Nebuchadnezzar’s capture of Jerusalem to 597 B.C.'
    key: scripture-helps-dan
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/44-daniel-1-7?lang=eng'
    quote: 'scholars generally believe that Nebuchadnezzar captured Jerusalem in 597 BC'
  - where: 'setting'
    claim: 'The siege followed the victory over Egypt at Carchemish in 605 B.C.'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'was in command of his father’s troops in 605 B.C. when they soundly defeated the Egyptian forces at Carchemish (see Jeremiah 46:2)'
  - where: 'setting'
    claim: 'Judah became a vassal; temple vessels and members of the upper class, Daniel among them, were taken'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'Selected members of Judah’s upper class, which included Daniel (see 2 Kings 20:14–18; Daniel 6:13), were carried captive to Babylon.'
  - where: 'setting'
    claim: 'Nebuchadnezzar besieged Jerusalem twice more and finally destroyed it; this was the first exile'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'Later he besieged Jerusalem twice more, carrying off additional captives both times, and eventually destroying Jerusalem'
  - where: 'setting'
    claim: 'Daniel lived in Jerusalem when Lehi did'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'Daniel lived in Jerusalem at the same time Lehi did, though there is no evidence to suggest that they knew each other.'
  - where: 'setting'
    claim: 'Jeremiah was prophesying to Judah in Jehoiakim’s fourth year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/25?lang=eng'
    quote: 'The word that came to Jeremiah concerning all the people of Judah in the fourth year of Jehoiakim the son of Josiah king of Judah'
  - where: 'setting'
    claim: 'Ezekiel refers to Daniel (14:14, 20; 28:3)'
    key: bd-daniel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/daniel?lang=eng'
    quote: 'There are references to him in Ezek. 14:14, 20; 28:3; Heb. 11:33.'
  - where: 'setting'
    claim: 'Chapter 1 is the introduction to the book'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/1.htm'
    quote: 'is to be regarded as a historico-biographical introduction to the book'
  - where: 'setting'
    claim: 'Chapters 1–6 are narratives; 7–12 are visions'
    key: bd-daniel-book
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/daniel-book-of?lang=eng'
    quote: 'Dan. 1–6 contains narratives regarding Daniel and his three companions; Dan. 7–12 contains prophetic visions seen by Daniel and reported in his own name.'

  # thread
  - where: 'thread'
    claim: 'The same Hebrew verb, natan (H5414), “give,” has God as subject in verses 2, 9, and 17'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'נָתַ֨ן'

  # sections
