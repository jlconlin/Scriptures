    claim: '“The master of his eunuchs” may be rendered chief of his officers'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/1?lang=eng'
    quote: 'OR chief of his officers.'
  - where: 'section 2 plain'
    claim: '“Well favoured” is good in appearance'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/1?lang=eng'
    quote: 'HEB good in appearance.'
  - where: 'section 2 plain'
    claim: '“The king’s seed, and … the princes” are the royal family and the nobility; “children” are youths'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Daniel+1&version=ESV'
    quote: 'to bring some of the people of Israel, both of the royal family and of'
  - where: 'section 2 plain'
    claim: '“The learning and the tongue” is the literature and language'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Daniel+1&version=ESV'
    quote: 'teach them the literature and language of the'
  - where: 'section 3 plain'
    claim: '“Worse liking” is less healthy'
    key: lds-scriptures
