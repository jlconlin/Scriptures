    quote: 'IE less healthy.'
  - where: 'section 3 plain'
    claim: '“Of your sort” is of your age; ESV “of your own age”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Daniel+1&version=ESV'
    quote: 'in worse condition than the youths who are of your own age'
  - where: 'section 3 plain'
    claim: '“Melzar” is a title, the steward'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/1?lang=eng'
    quote: 'HEB the steward.'
  - where: 'section 3 plain'
    claim: '“Pulse” is rendered vegetables; “fairer and fatter in flesh” as better in appearance and fatter in flesh'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Daniel+1&version=ESV'
    quote: 'they were better in appearance and fatter in flesh than all the youths who ate'
  - where: 'section 4 plain'
    claim: '“Learning” is literature; “magicians and astrologers” is magicians and enchanters; “continued” is was there'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Daniel+1&version=ESV'
    quote: 'skill in all literature and wisdom, and Daniel had'

  # note 1:1
  - where: 'note 1:1 “The third year here, the fourth in Jeremiah”'
    claim: 'Jeremiah calls Jehoiakim’s fourth year Nebuchadnezzar’s first'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/25?lang=eng'
    quote: 'in the fourth year of Jehoiakim the son of Josiah king of Judah, that was the first year of Nebuchadrezzar king of Babylon'
  - where: 'note 1:1 “The third year here, the fourth in Jeremiah”'
    claim: 'Nebuchadnezzar was a prince commanding his father’s army at Carchemish in 605 B.C.'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'Most scholars agree that Nebuchadnezzar, as a Babylonian prince, was in command of his father’s troops in 605 B.C.'
  - where: 'note 1:1 “The third year here, the fourth in Jeremiah”'
    claim: 'He returned to Babylon within the year to be made king'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'Nebuchadnezzar learned of the death of his father, and within the year he returned to Babylon to be made king (see Jeremiah 25:1)'
  - where: 'note 1:1 “The third year here, the fourth in Jeremiah”'
    claim: 'Keil: he is called king by anticipation, being then only commander of the army'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/1.htm'
    quote: 'he who afterwards became king might be proleptically styled king, though he was at the time only the commander of the army'
  - where: 'note 1:1 “The third year here, the fourth in Jeremiah”'
    claim: 'Keil: the verb “came” also means to go, to march to a place, so the third year is the setting out'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/1.htm'
    quote: 'means not only to come, but also to go, to march to a place'
  - where: 'note 1:1 “The third year here, the fourth in Jeremiah”'
    claim: 'Keil: the capture fell in Jehoiakim’s fourth year'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/1.htm'
    quote: 'must have been in the fourth year of Jehoiakim, i.e., in the year 606 b.c.'
  - where: 'note 1:1 “The third year here, the fourth in Jeremiah”'
    claim: 'Jeremiah puts Carchemish in Jehoiakim’s fourth year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/46?lang=eng'
    quote: 'in the fourth year of Jehoiakim the son of Josiah king of Judah'
  - where: 'note 1:1 “The third year here, the fourth in Jeremiah”'
    claim: 'Jehoiakim reigned 609–598 B.C.'
    key: bd-jehoiakim
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehoiakim?lang=eng'
    quote: 'King of Judah (609–598 B.C.), originally called Eliakim'
  - where: 'note 1:1 “The third year here, the fourth in Jeremiah”'
    claim: 'Nebuchadnezzar reigned 604–561 B.C.'
    key: bd-nebuchadnezzar
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/nebuchadnezzar?lang=eng'
    quote: 'The great king of Babylon (604–561 B.C.), son of Nabopolassar'

  # note 1:2 gave
  - where: 'note 1:2 “God gave, three times”'
    claim: 'Verse 2 opens with natan (H5414), “and the Lord gave”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'וַ/יִּתֵּן֩'
  - where: 'note 1:2 “God gave, three times”'
    claim: 'Verse 17 uses the same verb, natan, with God as subject'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'נָתַ֨ן'
  - where: 'note 1:2 “God gave, three times”'
    claim: 'Verse 9 is rendered “God gave Daniel favor and compassion”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Daniel+1&version=ESV'
    quote: 'And God gave Daniel favor and compassion in the sight of the chief of the eunuchs'
  - where: 'note 1:2 “God gave, three times”'
    claim: 'Kings says Judah’s fall came at the Lord’s commandment'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng'
    quote: 'came this upon Judah, to remove them out of his sight'
  - where: 'note 1:2 “God gave, three times”'
    claim: 'The exile’s prophets assured Judah that Jehovah governed all nations, Babylon included'
    key: draper-exile
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/prophets-exile'
    quote: 'They did that by reinforcing the idea that Jehovah governed and controlled the destiny of all nations, including Babylon.'
  - where: 'note 1:2 “God gave, three times”'
    claim: 'If Daniel’s experiences were known to his fellow Jews, his testimony promised that Jehovah sustained the faithful in Babylon'
    key: draper-exile
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/prophets-exile'
    quote: 'it promised the Jews that even in Babylon, Jehovah could and did sustain and protect those who remained true to the faith'

  # note 1:2 Shinar
  - where: 'note 1:2 “Shinar, and where the vessels went”'
    claim: 'The tower of Babel was built on a plain in the land of Shinar'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/11?lang=eng'
    quote: 'they found a plain in the land of Shinar; and they dwelt there'
  - where: 'note 1:2 “Shinar, and where the vessels went”'
    claim: 'Shinar (H8152) occurs once in Daniel, at 1:2'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'שִׁנְעָ֖ר'
  - where: 'note 1:2 “Shinar, and where the vessels went”'
    claim: 'Cyrus returned the vessels Nebuchadnezzar had put in the house of his gods'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/1?lang=eng'
    quote: 'which Nebuchadnezzar had brought forth out of Jerusalem, and had put them in the house of his gods'
  - where: 'note 1:2 “Shinar, and where the vessels went”'
    claim: 'Belshazzar called for the vessels Nebuchadnezzar had taken'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/5?lang=eng'
    quote: 'commanded to bring the golden and silver vessels which his father Nebuchadnezzar had taken out of the temple which was in Jerusalem'
  - where: 'note 1:2 “Shinar, and where the vessels went”'
    claim: 'More of the temple’s treasure was taken in a later siege'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng'
    quote: 'cut in pieces all the vessels of gold which Solomon king of Israel had made'

  # note 1:3
  - where: 'note 1:3 “Whether Daniel was made a eunuch”'
    claim: 'Saris means eunuch; it is used of Potiphar, whom the lexicon marks as married'
    key: bdb
    url: 'https://biblehub.com/hebrew/5631.htm'
    quote: 'eunuch, of Pharaoh Genesis 37:36; Genesis 40:2,7 (all E), married Genesis 39:1'
  - where: 'note 1:3 “Whether Daniel was made a eunuch”'
    claim: 'Eunuchs were emasculated men at eastern courts, often trusted officials'
    key: bd-eunuch
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/eunuch?lang=eng'
    quote: 'A class of emasculated men attached to the courts of eastern rulers. They were employed to watch over the harems and also were often given positions as trusted officials.'
  - where: 'note 1:3 “Whether Daniel was made a eunuch”'
    claim: 'The Church edition’s footnote gives “chief of his officers” as an alternative'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/1?lang=eng'
    quote: 'OR chief of his officers.'
  - where: 'note 1:3 “Whether Daniel was made a eunuch”'
    claim: 'Isaiah told Hezekiah his sons would be eunuchs in Babylon’s palace; the Church footnote at “seed” (1:3) points there'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/39?lang=eng'
    quote: 'and they shall be eunuchs in the palace of the king of Babylon'
  - where: 'note 1:3 “Whether Daniel was made a eunuch”'
    claim: 'The Church edition’s footnote on “seed” at Daniel 1:3 cites Isaiah 39:7'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/1?lang=eng'
    quote: 'Isa. 39:7'
  - where: 'note 1:3 “Whether Daniel was made a eunuch”'
    claim: 'Josephus says Nebuchadnezzar made some of the noble youths eunuchs'
    key: josephus-antiquities
    url: 'https://penelope.uchicago.edu/josephus/ant-10.html'
    quote: 'He also made some of them to be eunuchs: which course he took also with those of other nations whom he had taken in the flower of their age'

