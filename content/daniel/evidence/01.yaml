  # note 1:8
  - where: 'note 1:8 “Why the king’s table would defile”'
    claim: '“Meat” in older English is food in general'
    key: webster-1828
    url: 'https://webstersdictionary1828.com/Dictionary/meat'
    quote: 'Food in general; any thing eaten for nourishment, either by man or beast.'
  - where: 'note 1:8 “Why the king’s table would defile”'
    claim: 'Pathbag is a Persian loanword: the king’s portion, delicacies'
    key: bdb
    url: 'https://biblehub.com/hebrew/6598.htm'
    quote: 'portion (of food) for king, delicacies (Persian loanword'
  - where: 'note 1:8 “Why the king’s table would defile”'
    claim: 'Ga’al, “defile,” is late; used of hands defiled with blood (Isa. 59:3)'
    key: bdb
    url: 'https://biblehub.com/hebrew/1351.htm'
    quote: 'be defiled, hands with blood'
  - where: 'note 1:8 “Why the king’s table would defile”'
    claim: 'The same verb is used of polluted bread on the altar (Mal. 1:7)'
    key: bdb
    url: 'https://biblehub.com/hebrew/1351.htm'
    quote: 'of bread laid on Yahweh''s altar Malachi 1:7'
  - where: 'note 1:8 “Why the king’s table would defile”'
    claim: 'The food may have been offered to Babylonian gods'
    key: scripture-helps-dan
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/44-daniel-1-7?lang=eng'
    quote: 'these items may have first been offered to Babylonian gods as part of pagan rituals. Consuming such offerings would have been seen as participating in idol worship.'
  - where: 'note 1:8 “Why the king’s table would defile”'
    claim: 'The food may have broken the Mosaic dietary laws'
    key: scripture-helps-dan
