    claim: 'In 5:28 the verb “is divided” (lemma 6537 a) follows peres, and the verse ends on paras, “Persians” (lemma 6540)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'וּ/פָרָֽס'
