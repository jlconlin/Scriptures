  # ---------- note 5:30 ----------
  - where: 'note 5:30 “How Babylon fell in a night”'
    claim: 'The chapter heading: that night Babylon is conquered'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/5?lang=eng'
    quote: 'That night Babylon is conquered.'
  - where: 'note 5:30 “How Babylon fell in a night”'
    claim: 'Cyrus captured Babylon; Nabonidus was the last king, with Belshazzar his son as commander-in-chief'
    key: bd-cyrus
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/cyrus?lang=eng'
    quote: 'He captured Babylon and overthrew the Chaldean dynasty (of which Nabonidus was the last king, with Belshazzar his son as commander-in-chief).'
  - where: 'note 5:30 “How Babylon fell in a night”'
    claim: 'Herodotus 1.190: the Babylonians had provisions for many years and made no account of the siege'
    key: herodotus-histories-1-191
    url: 'https://www.gutenberg.org/files/2707/2707-h/2707-h.htm'
    quote: 'for very many years. So while these made no account of the siege, Cyrus was in straits what to do'
  - where: 'note 5:30 “How Babylon fell in a night”'
    claim: 'Herodotus 1.191: Cyrus posted his army where the river enters and leaves the city'
    key: herodotus-histories-1-191
    url: 'https://www.gutenberg.org/files/2707/2707-h/2707-h.htm'
    quote: 'he posted at the place where the river runs into the city, and then again behind the city he set others, where the river issues forth from the city'
  - where: 'note 5:30 “How Babylon fell in a night”'
    claim: 'Herodotus 1.191: he drew the river off into a lake that was then a swamp'
    key: herodotus-histories-1-191
    url: 'https://www.gutenberg.org/files/2707/2707-h/2707-h.htm'
    quote: 'he conducted the river by a channel into the lake, which was at that time a swamp'
  - where: 'note 5:30 “How Babylon fell in a night”'
    claim: 'Herodotus 1.191: the Persians entered by the river bed'
    key: herodotus-histories-1-191
    url: 'https://www.gutenberg.org/files/2707/2707-h/2707-h.htm'
    quote: 'entered by the bed of the river Euphrates into Babylon, the stream having sunk so far that it reached about to the middle of a man''s thigh'
  - where: 'note 5:30 “How Babylon fell in a night”'
    claim: 'Herodotus 1.191: those in the middle of the city were holding a festival and did not know (the passage, chapters 189–191 as read, names no Babylonian king)'
    key: herodotus-histories-1-191
    url: 'https://www.gutenberg.org/files/2707/2707-h/2707-h.htm'
    quote: 'but as they chanced to be holding a festival, they went on dancing and rejoicing during this time until they learnt the truth only too well'
  - where: 'note 5:30 “How Babylon fell in a night”'
    claim: 'A different account: the priests of Marduk opened the gates by night while the crown prince and his friends were drunk, and the city fell without bloodshed'
    key: tvedtnes-nabonidus
    url: 'https://www.churchofjesuschrist.org/study/ensign/1986/09/nebuchadnezzar-or-nabonidus-mistaken-identities-in-the-book-of-daniel?lang=eng'
    quote: 'the priests of Marduk opened the gates of Babylon by night while the crown prince and his friends were drunk with wine. The city fell without bloodshed.'
  - where: 'note 5:30 “How Babylon fell in a night”'
    claim: 'The Church’s footnotes at 5:30 give Jeremiah 51:31, 39 and Isaiah 45:1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/5?lang=eng'
    quote: '“Chaldeans”: Jer. 51:31 (31, 39).'

  # ---------- note 5:31 ----------
  - where: 'note 5:31 “Darius the Median”'
    claim: 'Darius the Mede cannot be identified with any king known to secular history'
    key: bd-darius
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/darius?lang=eng'
    quote: 'It is impossible to identify him with any of the kings of Babylon known to secular history.'
  - where: 'note 5:31 “Darius the Median”'
    claim: 'The Darius of Ezra, Haggai and Zechariah is another man, the son of Hystaspes, a Persian king'
    key: bd-darius
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/darius?lang=eng'
    quote: '(2) The son of Hystaspes and founder of the Persian dynasty'
  - where: 'note 5:31 “Darius the Median”'
    claim: 'The wall said the kingdom would be given to the Medes and Persians; the Church’s footnote on “Darius” gives Daniel 11:1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/5?lang=eng'
    quote: 'Thy kingdom is divided, and given to the Medes and Persians.'

