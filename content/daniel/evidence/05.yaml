chapter: 5
claims:
  # ---------- when ----------
  - where: 'when'
    claim: 'Cyrus conquered Babylon in 539 BC'
    key: scripture-helps-dan
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/44-daniel-1-7?lang=eng'
    quote: 'lasting into the reign of King Cyrus of Persia, who conquered Babylon in 539 BC.'
  - where: 'when'
    claim: 'Belshazzar’s feast was about two decades after Nebuchadnezzar died'
    key: scripture-helps-dan
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/44-daniel-1-7?lang=eng'
    quote: 'Approximately two decades after Nebuchadnezzar died, King Belshazzar hosted a feast for leaders in the kingdom.'
  - where: 'when'
    claim: 'The night of the feast is the night Babylon was conquered (chapter heading)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/5?lang=eng'
    quote: 'That night Babylon is conquered.'

  # ---------- setting ----------
  - where: 'setting'
    claim: 'About two decades after Nebuchadnezzar’s death'
    key: scripture-helps-dan
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/44-daniel-1-7?lang=eng'
    quote: 'Approximately two decades after Nebuchadnezzar died, King Belshazzar hosted a feast for leaders in the kingdom.'
  - where: 'setting'
    claim: 'Records outside the Bible make Belshazzar the son of Nabonidus, the last king of Babylon, and his co-regent'
    key: scripture-helps-dan
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/44-daniel-1-7?lang=eng'
    quote: 'other ancient records indicate that he was the son of Nabonidus, the final king of Babylon, and that he was co-regent to his father.'
  - where: 'setting'
    claim: 'Cyrus of Persia conquered Babylon in 539 BC'
    key: scripture-helps-dan
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/44-daniel-1-7?lang=eng'
    quote: 'lasting into the reign of King Cyrus of Persia, who conquered Babylon in 539 BC.'
  - where: 'setting'
    claim: 'The Church’s footnote at 5:16 joins the writing to Alma 10:2'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/5?lang=eng'
    quote: '“writing”: Alma 10:2.'
  - where: 'setting'
    claim: 'The Church’s footnotes at 5:30 join the night to Jeremiah 51 and Isaiah 45:1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/5?lang=eng'
    quote: '“slain”: Isa. 41:2; 45:1.'

  # ---------- thread ----------
  # ---------- sections ----------
  - where: 'section 2 plain'
    claim: '“Over against the candlestick” is “opposite the lampstand”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/5?lang=eng'
    quote: 'OR opposite the lampstand.'
  - where: 'section 2 plain'
    claim: '“The joints of his loins” is “his hip joints”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/5?lang=eng'
    quote: 'OR his hip joints.'
  - where: 'section 3 plain'
    claim: '“Dissolving of doubts” is literally loosening knots (rendered “unties hard problems”)'
    key: bdb
    url: 'https://biblehub.com/hebrew/7001.htm'
    quote: 'usually knotty things, difficulties'

  # ---------- note 5:1 ----------
  - where: 'note 5:1 “Who Belshazzar was”'
    claim: 'Bible Dictionary: Nabonidus had a son Belshazzar who was never king but prince-regent; learned from recently discovered monuments'
    key: bd-belshazzar
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/belshazzar?lang=eng'
    quote: 'we learn from recently discovered monuments that Nabonidus had a son Belshazzar (Bel-sana-usur), who was never king, but was prince-regent during his father’s reign.'
  - where: 'note 5:1 “Who Belshazzar was”'
    claim: 'Scripture Helps: son of Nabonidus, the final king, and co-regent to his father'
    key: scripture-helps-dan
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/44-daniel-1-7?lang=eng'
    quote: 'other ancient records indicate that he was the son of Nabonidus, the final king of Babylon, and that he was co-regent to his father.'
  - where: 'note 5:1 “Who Belshazzar was”'
    claim: 'A Babylonian account (the Verse Account, as the article prints it): as the third year began Nabonidus put the army under his eldest son'
    key: tvedtnes-nabonidus
    url: 'https://www.churchofjesuschrist.org/study/ensign/1986/09/nebuchadnezzar-or-nabonidus-mistaken-identities-in-the-book-of-daniel?lang=eng'
    quote: 'when the third year was about to begin he entrusted the ‘Camp’ to his oldest/son/, the firstborn'
  - where: 'note 5:1 “Who Belshazzar was”'
    claim: 'The same account: Nabonidus entrusted the kingship to him and left on a long journey'
    key: tvedtnes-nabonidus
    url: 'https://www.churchofjesuschrist.org/study/ensign/1986/09/nebuchadnezzar-or-nabonidus-mistaken-identities-in-the-book-of-daniel?lang=eng'
    quote: 'entrusted the kingship to him and, himself, he started out for a long journey'
  - where: 'note 5:1 “Who Belshazzar was”'
    claim: 'Tema is a town in northern Arabia'
    key: tvedtnes-nabonidus
    url: 'https://www.churchofjesuschrist.org/study/ensign/1986/09/nebuchadnezzar-or-nabonidus-mistaken-identities-in-the-book-of-daniel?lang=eng'
    quote: 'the northern Arabian town of Tema'
  - where: 'note 5:1 “Who Belshazzar was”'
    claim: 'Nabonidus stayed in Tema for years, leaving the crown prince in Babylonia'
    key: tvedtnes-nabonidus
    url: 'https://www.churchofjesuschrist.org/study/ensign/1986/09/nebuchadnezzar-or-nabonidus-mistaken-identities-in-the-book-of-daniel?lang=eng'
    quote: 'at least from the seventh through eleventh years of his reign, leaving “the crown prince, the officials and the army” in Babylonia'
  - where: 'note 5:1 “Who Belshazzar was”'
    claim: 'By the Babylonian accounts the article prints, Belshazzar was his father’s viceroy and not king'
    key: tvedtnes-nabonidus
    url: 'https://www.churchofjesuschrist.org/study/ensign/1986/09/nebuchadnezzar-or-nabonidus-mistaken-identities-in-the-book-of-daniel?lang=eng'
    quote: 'These accounts also show that Belshazzar was his father’s viceroy, but not king'
  - where: 'note 5:1 “Who Belshazzar was”'
    claim: 'The Aramaic malka need not mean sole king (the manual prints Guthrie and Motyer, New Bible Commentary)'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'the Aramaic word malka (‘king’) need not have the connotation of monarch or sole king'
  - where: 'note 5:1 “Who Belshazzar was”'
    claim: 'Belteshazzar is the Babylonian name of Daniel, a different name from Belshazzar'
    key: bdb
    url: 'https://biblehub.com/hebrew/1096.htm'
    quote: 'proper name, masculine Babylonian name of Daniel'
  - where: 'note 5:1 “Who Belshazzar was”'
    claim: 'The Church’s footnote on “named” in 5:12 points to the naming in Daniel 1:7'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/5?lang=eng'
    quote: '“named”: Dan. 1:7.'

  # ---------- note 5:2 ----------
  - where: 'note 5:2 “Why Nebuchadnezzar is called his father”'
    claim: 'BDB lists the “father” of 5:2, 11, 13 and 18 under the literal sense'
    key: bdb
    url: 'https://biblehub.com/hebrew/2.htm'
    quote: '1 literally father suffix'
  - where: 'note 5:2 “Why Nebuchadnezzar is called his father”'
    claim: 'The Aramaic word in 5:2 is ab, “father,” with the suffix “his”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'אֲב֔/וּהִי'
  - where: 'note 5:2 “Why Nebuchadnezzar is called his father”'
    claim: 'A king list from Uruk gives the succession after Nebuchadnezzar'
    key: tvedtnes-nabonidus
    url: 'https://www.churchofjesuschrist.org/study/ensign/1986/09/nebuchadnezzar-or-nabonidus-mistaken-identities-in-the-book-of-daniel?lang=eng'
    quote: 'A contemporary king-list found at Uruk, south of Babylon, clearly states the succession of kings'
  - where: 'note 5:2 “Why Nebuchadnezzar is called his father”'
    claim: 'Nabonidus appears to have taken the throne from Labashi-Marduk, the last of the kings the list puts after Nebuchadnezzar'
    key: tvedtnes-nabonidus
    url: 'https://www.churchofjesuschrist.org/study/ensign/1986/09/nebuchadnezzar-or-nabonidus-mistaken-identities-in-the-book-of-daniel?lang=eng'
    quote: 'Apparently, Nabonidus contested the succession of Labashi-Marduk and wrested power from him.'
  - where: 'note 5:2 “Why Nebuchadnezzar is called his father”'
    claim: 'The list as the article prints it has three names after Nebuchadnezzar, each on its own line: Amel-Marduk, Neriglissar, Labashi-Marduk'
    key: tvedtnes-nabonidus
    url: 'https://www.churchofjesuschrist.org/study/ensign/1986/09/nebuchadnezzar-or-nabonidus-mistaken-identities-in-the-book-of-daniel?lang=eng'
    quote: 'Neriglissar'
  - where: 'note 5:2 “Why Nebuchadnezzar is called his father”'
    claim: 'Scripture Helps states the difference without explaining it'
    key: scripture-helps-dan
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/44-daniel-1-7?lang=eng'
    quote: 'Although Belshazzar is called the king and Nebuchadnezzar’s son in Daniel 5, other ancient records indicate that he was the son of Nabonidus'
  - where: 'note 5:2 “Why Nebuchadnezzar is called his father”'
    claim: 'The article’s proposal: the Aramaic chapters were translated from a lost Hebrew original'
    key: tvedtnes-nabonidus
    url: 'https://www.churchofjesuschrist.org/study/ensign/1986/09/nebuchadnezzar-or-nabonidus-mistaken-identities-in-the-book-of-daniel?lang=eng'
    quote: 'Obviously, the original Hebrew text was lost.'
  - where: 'note 5:2 “Why Nebuchadnezzar is called his father”'
    claim: 'The article’s proposal: a scribe or translator took NBND for an abbreviation of Nebuchadnezzar'
    key: tvedtnes-nabonidus
    url: 'https://www.churchofjesuschrist.org/study/ensign/1986/09/nebuchadnezzar-or-nabonidus-mistaken-identities-in-the-book-of-daniel?lang=eng'
    quote: 'A Scribe or Aramaic translator could have easily assumed that NBND in the original Hebrew was an abbreviation for the name of the better-known king Nebuchadnezzar.'
  - where: 'note 5:2 “Why Nebuchadnezzar is called his father”'
    claim: 'On that view the stories of chapters 3 and 4 and a reference in chapter 5 are about Nabonidus'
    key: tvedtnes-nabonidus
    url: 'https://www.churchofjesuschrist.org/study/ensign/1986/09/nebuchadnezzar-or-nabonidus-mistaken-identities-in-the-book-of-daniel?lang=eng'
    quote: 'The stories in chapters three and four, as well as a reference in chapter five, are actually about another king named Nabonidus, not Nebuchadnezzar.'
  - where: 'note 5:2 “Why Nebuchadnezzar is called his father”'
    claim: 'The chapter says “father” in the narrator’s voice (5:2) and “thou his son” in Daniel’s (5:22)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/5?lang=eng'
    quote: 'And thou his son, O Belshazzar, hast not humbled thine heart, though thou knewest all this;'

  # ---------- note 5:3 ----------
  - where: 'note 5:3 “Why the cups are the offense”'
    claim: 'Carrying off the vessels and placing them in the victor’s temple was a sign of the defeat of their God'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/5.htm'
    quote: 'was a sign of the defeat of the God to whom these vessels were consecrated'
  - where: 'note 5:3 “Why the cups are the offense”'
    claim: 'Drinking from them while praising the gods celebrated those gods as victorious over the God of Israel'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/5.htm'
    quote: 'was accordingly a celebrating of these gods as victorious over the God of Israel'
  - where: 'note 5:3 “Why the cups are the offense”'
    claim: 'The Church’s footnote on “vessels” at 5:2 gives Numbers 18:3 and Daniel 1:2'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/5?lang=eng'
    quote: '“vessels”: Num. 18:3; Dan. 1:2.'
  - where: 'note 5:3 “Why the cups are the offense”'
    claim: 'Cyrus returned the vessels, which went up with the exiles (Ezra 1:7, 11)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/1?lang=eng'
    quote: 'All these did Sheshbazzar bring up with them of the captivity that were brought up from Babylon unto Jerusalem.'

  # ---------- note 5:5 ----------
  - where: 'note 5:5 “A second writing on a wall, among the Nephites”'
    claim: 'The Church’s footnote at 5:16 points to Alma 10:2'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/5?lang=eng'
    quote: '“writing”: Alma 10:2.'
  - where: 'note 5:5 “A second writing on a wall, among the Nephites”'
    claim: 'Daniel 5 is the strongest parallel to the account of Aminadi'
    key: sc-knowhy-736
    url: 'https://scripturecentral.org/knowhy/who-was-aminadi'
    quote: 'The strongest parallel to the brief account involving Aminadi is the biblical story of Daniel interpreting the writing on the palace wall of the Babylonian king Belshazzar.'
  - where: 'note 5:5 “A second writing on a wall, among the Nephites”'
    claim: 'The pattern: a prophet interprets a divine manifestation others could not'
    key: sc-knowhy-736
    url: 'https://scripturecentral.org/knowhy/who-was-aminadi'
    quote: 'interpreting for others a divine manifestation they could not interpret for themselves'
  - where: 'note 5:5 “A second writing on a wall, among the Nephites”'
    claim: 'The writing Daniel read was prompted by the use of temple vessels in praise of foreign gods'
    key: sc-knowhy-736
    url: 'https://scripturecentral.org/knowhy/who-was-aminadi'
    quote: 'The writing Daniel interpreted was prompted by people using temple vessels in the praise of foreign gods.'
  - where: 'note 5:5 “A second writing on a wall, among the Nephites”'
    claim: 'A proposal (Don Bradley’s, as the KnoWhy reports it): the Nephite writing warned of the consequences of profaning the temple'
    key: sc-knowhy-736
    url: 'https://scripturecentral.org/knowhy/who-was-aminadi'
    quote: 'God’s writing would affirm the temple’s sacredness and might warn of the consequences that were to follow for profaning it'
  - where: 'note 5:5 “A second writing on a wall, among the Nephites”'
    claim: 'Amulek’s hearers knew of Aminadi (the KnoWhy’s reading)'
    key: sc-knowhy-736
    url: 'https://scripturecentral.org/knowhy/who-was-aminadi'
    quote: 'Amulek’s own unrepentant audience was aware of Aminadi’s warning and its fulfillment in the city of Nephi.'
  - where: 'note 5:5 “A second writing on a wall, among the Nephites”'
    claim: '“Over against the candlestick” means opposite the lampstand'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/5?lang=eng'
    quote: 'OR opposite the lampstand.'

  # ---------- note 5:6 ----------
  - where: 'note 5:6 “Knots that come loose, and a man who loosens knots”'
    claim: 'The noun of 5:6 means joint, knot; in 5:12 and 5:16 it is figurative, usually “knotty things, difficulties,” but probably magic spells'
    key: bdb
    url: 'https://biblehub.com/hebrew/7001.htm'
    quote: 'Daniel 5:6 joints of his loin; figurative absolute'
  - where: 'note 5:6 “Knots that come loose, and a man who loosens knots”'
    claim: 'BDB glosses the noun “joint, knot”'
    key: bdb
    url: 'https://biblehub.com/hebrew/7001.htm'
    quote: 'joint, knot'
  - where: 'note 5:6 “Knots that come loose, and a man who loosens knots”'
    claim: 'BDB: usually knotty things, difficulties, but probably of magic spells'
    key: bdb
    url: 'https://biblehub.com/hebrew/7001.htm'
    quote: 'usually knotty things, difficulties'
  - where: 'note 5:6 “Knots that come loose, and a man who loosens knots”'
    claim: 'BDB prefers magic spells'
    key: bdb
    url: 'https://biblehub.com/hebrew/7001.htm'
    quote: 'but probably of magic spells'
  - where: 'note 5:6 “Knots that come loose, and a man who loosens knots”'
    claim: 'The verb shera means loosen, and BDB lists it at 5:12 and 5:16'
    key: bdb
    url: 'https://biblehub.com/hebrew/8271.htm'
    quote: 'verb 1. loosen.'
  - where: 'note 5:6 “Knots that come loose, and a man who loosens knots”'
    claim: 'In 5:6 the noun is lemma 7001 (qitre) and the verb lemma 8271'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'מִשְׁתָּרַ֔יִן'
  - where: 'note 5:6 “Knots that come loose, and a man who loosens knots”'
    claim: 'In 5:12 the same noun (lemma 7001) and verb (lemma 8271) stand together'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'קִטְרִ֗ין'
  - where: 'note 5:6 “Knots that come loose, and a man who loosens knots”'
    claim: 'The Church’s footnote gives “his hip joints”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/5?lang=eng'
    quote: 'OR his hip joints.'
  # ---------- note 5:7 ----------
  - where: 'note 5:7 “Why the reward is third place”'
    claim: 'Belshazzar was second after Nabonidus, so third was the highest place he could offer'
    key: tvedtnes-nabonidus
    url: 'https://www.churchofjesuschrist.org/study/ensign/1986/09/nebuchadnezzar-or-nabonidus-mistaken-identities-in-the-book-of-daniel?lang=eng'
    quote: 'Being himself second in the kingdom, after his father Nabonidus, the highest place he could offer was third.'
  - where: 'note 5:7 “Why the reward is third place”'
    claim: 'The Aramaic word is a substantive, “third (ruler), i.e. triumvir,” distinct from the ordinal of 2:39'
    key: bdb
    url: 'https://biblehub.com/hebrew/8523.htm'
    quote: 'as substantive third (ruler), i.e. triumuir'
  - where: 'note 5:7 “Why the reward is third place”'
    claim: 'The word in 5:7 is lemma 8523a'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'וְ/תַלְתִּ֥י'
  # ---------- note 5:10 ----------
  - where: 'note 5:10 “The queen who remembers”'
    claim: 'The queen is understood as the mother of the reigning king, since his wives were present already'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/5.htm'
    quote: 'interpreters rightly understand the mother of the reigning king, the widow of his father Nebuchadnezzar'
  - where: 'note 5:10 “The queen who remembers”'
    claim: 'She came before the king as only a mother could'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/5.htm'
    quote: 'the queen came before the king as only a mother could do'
  - where: 'note 5:10 “The queen who remembers”'
    claim: 'Her use of Nebuchadnezzar’s words about Daniel leads Keil to conclude Nebuchadnezzar was her husband'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/5.htm'
    quote: 'that she states it in the same words leads to the conclusion that Nebuchadnezzar was her husband'
  - where: 'note 5:10 “The queen who remembers”'
    claim: 'Daniel 8:27 shows only that Daniel was in the king’s service under Belshazzar'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/5.htm'
    quote: 'it does not follow from Daniel 8:27 that under Belshazzar Daniel was president over all the wise men, but only that he was in the king''s service'
  - where: 'note 5:10 “The queen who remembers”'
    claim: 'The wives are at the feast in 5:2–3; the queen enters in 5:10'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/5?lang=eng'
    quote: 'Now the queen, by reason of the words of the king and his lords, came into the banquet house'

  # ---------- note 5:17 ----------
  - where: 'note 5:17 “Refused first, given anyway”'
    claim: 'The Church’s footnote on “gifts” gives 2 Kings 5:16'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/5?lang=eng'
    quote: '“gifts”: 2 Kgs. 5:16.'
  - where: 'note 5:17 “Refused first, given anyway”'
    claim: 'In 5:29 the verbs are the king’s and his servants’'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/5?lang=eng'
    quote: 'Then commanded Belshazzar, and they clothed Daniel with scarlet'
  - where: 'note 5:17 “Refused first, given anyway”'
    claim: 'In 5:29 the king keeps the promise he had made; the verb means “and they clothed him,” the command carried out'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/5.htm'
    quote: 'Belshazzar fulfilled the promise he had made to Daniel by rewarding him for reading and interpreting the writing.'

  # ---------- note 5:22 ----------
  - where: 'note 5:22 “The charge is that he knew”'
    claim: 'The Church’s footnote at 5:20 gives Jeremiah 27:5 and Daniel 4:31'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/5?lang=eng'
    quote: 'Jer. 27:5 (5–6); Dan. 2:21; 4:31 (30–31).'

  # ---------- note 5:25 ----------
  - where: 'note 5:25 “Three weights, and three verdicts”'
    claim: 'Mene as a noun is a maneh or mina, a weight; its link with the verb is word-play'
    key: bdb
    url: 'https://biblehub.com/hebrew/4484.htm'
    quote: 'noun [masculine] maneh, mina, a weight'
  - where: 'note 5:25 “Three weights, and three verdicts”'
    claim: 'BDB: the connection of mene with the verb “number” is due to word-play'
    key: bdb
    url: 'https://biblehub.com/hebrew/4484.htm'
    quote: 'is due to word-play'
  - where: 'note 5:25 “Three weights, and three verdicts”'
    claim: 'Tekel is Aramaic for shekel, or weight (the Church’s footnote)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/5?lang=eng'
    quote: 'Aramaic: shekel, or weight.'
  - where: 'note 5:25 “Three weights, and three verdicts”'
    claim: 'Peres is a half-mina; parsin is its plural'
    key: bdb
    url: 'https://biblehub.com/hebrew/6537.htm'
    quote: 'noun [masculine] half-mina'
  - where: 'note 5:25 “Three weights, and three verdicts”'
    claim: 'Upharsin is the conjunction u (“and”) with the plural noun'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'וּ/פַרְסִֽין'
  - where: 'note 5:25 “Three weights, and three verdicts”'
    claim: 'A mina is about 20 ounces, a shekel less than half an ounce, upharsin two half-minas'
    key: scripture-helps-dan
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/44-daniel-1-7?lang=eng'
    quote: 'Mene, or mina, is about 20 ounces. Tekel, or shekel, is less than half an ounce. Upharsin is two half-minas.'
  - where: 'note 5:25 “Three weights, and three verdicts”'
    claim: 'The weights are listed in descending order, which may symbolize Babylon’s diminishing power'
    key: scripture-helps-dan
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/44-daniel-1-7?lang=eng'
    quote: 'referred to ancient units of weight, listed in descending order. This may have symbolized the diminishing power of Babylon.'
  - where: 'note 5:25 “Three weights, and three verdicts”'
    claim: 'The words sounded like Aramaic verbs'
    key: scripture-helps-dan
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/44-daniel-1-7?lang=eng'
    quote: 'when these three words were spoken, they sounded like Aramaic verbs'
  - where: 'note 5:25 “Three weights, and three verdicts”'
    claim: 'Keil rejects the explanation that the writing was only an unfamiliar script'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/5.htm'
    quote: 'But this interpretation of the miracle on natural principles is quite erroneous.'
  - where: 'note 5:25 “Three weights, and three verdicts”'
