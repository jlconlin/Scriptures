    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/5.htm'
    quote: 'must have been altogether unusual so as not to be deciphered but by divine illumination'
  - where: 'note 5:25 “Three weights, and three verdicts”'
    claim: 'Each of the three words has a double sense'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/5.htm'
    quote: 'In all the three words there lies a double sense, which is brought out in the interpretation.'
  - where: 'note 5:25 “Three weights, and three verdicts”'
    claim: 'In 5:26 the verb is menah, “numbered”: God has numbered the days of the kingdom, that is, put an end to it'
