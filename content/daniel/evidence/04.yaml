chapter: 4
claims:
  - where: 'when'
    claim: 'Nebuchadnezzar was king of Babylon 604–561 B.C.'
    key: 'bd-nebuchadnezzar'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/nebuchadnezzar?lang=eng'
    quote: 'The great king of Babylon (604–561 B.C.), son of Nabopolassar, the founder of the empire'
  - where: 'setting'
    claim: 'Chapters 1–6 are narratives, and 2:4–7:28 is in Aramaic'
    key: 'bd-daniel-book'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/daniel-book-of?lang=eng'
    quote: 'Dan. 1–6 contains narratives regarding Daniel and his three companions; Dan. 7–12 contains prophetic visions seen by Daniel and reported in his own name. Dan. 2:4–7:28 is written in Aramaic and the rest in Hebrew.'
  - where: 'setting'
    claim: 'The Hebrew Bible attaches 4:1–3 to chapter 3, a division an older commentary rejects'
    key: 'keil-daniel'
    url: 'https://biblehub.com/commentaries/kad/daniel/4.htm'
    quote: 'The connection of these verses with the third chapter in the Hebrew, Greek, and Latin Bibles is altogether improper.'
  - where: 'setting'
    claim: 'Daniel retells the chapter to Belshazzar in chapter 5'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/5?lang=eng'
    quote: 'But when his heart was lifted up, and his mind hardened in pride, he was deposed from his kingly throne, and they took his glory from him'
  - where: 'setting'
    claim: 'The Church’s chapter heading names the king’s fall and madness'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/4?lang=eng'
    quote: 'Daniel interprets Nebuchadnezzar’s dream of the great tree, describing the king’s fall and madness'
  - where: 'note 4:1 “A chapter in the king’s own voice”'
    claim: 'The greeting has the form of a royal edict, like the Persian kings’ letters in Ezra'
    key: 'keil-daniel'
    url: 'https://biblehub.com/commentaries/kad/daniel/4.htm'
    quote: 'The mode of address here used, accompanied by an expression of a good wish, is the usual form also of the edicts promulgated by the Persian kings; cf. Ezra 4:17; Ezra 7:12.'
  - where: 'note 4:1 “A chapter in the king’s own voice”'
    claim: 'Some take the third person of verses 28–33 as a sign that another hand framed the edict'
    key: 'keil-daniel'
    url: 'https://biblehub.com/commentaries/kad/daniel/4.htm'
    quote: 'find here that the author falls out of the role of the king into the narrative tone, and thus betrays the fact that some other than the king framed the edict'
  - where: 'note 4:1 “A chapter in the king’s own voice”'
    claim: 'The other explanation: in his madness he was not himself, and the first person returns with his recovery'
    key: 'keil-daniel'
    url: 'https://biblehub.com/commentaries/kad/daniel/4.htm'
    quote: 'With the return of the Ich, I, on the recovery from his madness, Nebuchadnezzar begins again to narrate in the first person'

  - where: 'note 4:8 “What Nebuchadnezzar meant by “the spirit of the holy gods””'
    claim: 'The Aramaic has a plural noun and a plural adjective, “holy gods”'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'קַדִּישִׁ֖ין'
  - where: 'note 4:8 “What Nebuchadnezzar meant by “the spirit of the holy gods””'
    claim: 'The Greek version makes it the Holy Spirit of God'
    key: 'lxx-rahlfs'
    url: 'https://biblehub.com/sep/daniel/4.htm'
    quote: 'until Daniel came, whose name is Baltasar, according to the name of my God, who has within him the Holy Spirit of God'
  - where: 'note 4:8 “What Nebuchadnezzar meant by “the spirit of the holy gods””'
    claim: 'A modern translation gives “a holy, divine spirit” as an alternative'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Daniel+4%3A16-19%2C27&version=NRSVUE'
    quote: 'Or a holy, divine spirit'
  - where: 'note 4:8 “What Nebuchadnezzar meant by “the spirit of the holy gods””'
    claim: 'The king still believed in Bel and was not acknowledging Jehovah as the only god'
    key: 'ot-manual-28'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'or his belief in the supreme Babylonian god Bel. By acknowledging Daniel’s spiritual abilities, Nebuchadnezzar was not acknowledging Jehovah as the only or even the supreme god.'
  - where: 'note 4:8 “What Nebuchadnezzar meant by “the spirit of the holy gods””'
    claim: 'Daniel, like Joseph, was given power to interpret dreams'
    key: 'bd-daniel-book'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/daniel-book-of?lang=eng'
    quote: 'Daniel, like Joseph, is given ability to interpret dreams and to reveal the future.'

  - where: 'note 4:10 “Why the king is a tree”'
    claim: 'Ezekiel pictures Assyria as a cedar with birds in its boughs and nations in its shade'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/31?lang=eng'
    quote: 'All the fowls of heaven made their nests in his boughs, and under his branches did all the beasts of the field bring forth their young, and under his shadow dwelt all great nations.'
  - where: 'note 4:10 “Why the king is a tree”'
    claim: 'The Lord gave the lands and the beasts of the field to Nebuchadnezzar'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/27?lang=eng'
    quote: 'And now have I given all these lands into the hand of Nebuchadnezzar the king of Babylon, my servant; and the beasts of the field have I given him also to serve him.'
  - where: 'note 4:10 “Why the king is a tree”'
    claim: 'Daniel had told the king that the beasts and fowls were given into his hand'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/2?lang=eng'
    quote: 'the beasts of the field and the fowls of the heaven hath he given into thine hand, and hath made thee ruler over them all'

  - where: 'note 4:13 “Who the watcher is”'
    claim: 'The Aramaic word means a wakeful one, an angel, and the lexicon lists only the three places in this chapter'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/5894.htm'
    quote: 'noun masculine waking, or wakeful, one, i.e. angel'
  - where: 'note 4:13 “Who the watcher is”'
    claim: 'The word stands in verses 13, 17 (plural) and 23 (Hebrew 4:10, 14, 20)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'עִירִין֙'

  - where: 'note 4:15 “The stump and the band”'
    claim: 'One reading: the tree with its roots is the king, cut down as king and remaining as a man'
    key: 'keil-daniel'
    url: 'https://biblehub.com/commentaries/kad/daniel/4.htm'
    quote: 'the tree with its roots is Nebuchadnezzar, who shall as king be cut down, but shall as a man remain, and again shall grow into a king'
  - where: 'note 4:15 “The stump and the band”'
    claim: 'The language passes from the tree to the man within the verse'
    key: 'keil-daniel'
    url: 'https://biblehub.com/commentaries/kad/daniel/4.htm'
    quote: 'the language passes from the type to the person represented by it'
  - where: 'note 4:15 “The stump and the band”'
    claim: 'Jerome read the band as a madman’s chains; a later commentator as the fetter of madness'
    key: 'keil-daniel'
    url: 'https://biblehub.com/commentaries/kad/daniel/4.htm'
    quote: 'is not, with Jerome and others, to be understood of the binding of the madman with chains, but figuratively or spiritually of the withdrawal of free self-determination through the fetter of madness'

  - where: 'note 4:16 “How long “seven times” is”'
    claim: 'The word means a time, generally; here a definite time, a year'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/5732.htm'
    quote: '1 in General, time, as duration'
  - where: 'note 4:16 “How long “seven times” is”'
    claim: 'The lexicon gives the sense in this chapter as a year'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/5732.htm'
    quote: '2 definite time, = year'
  - where: 'note 4:16 “How long “seven times” is”'
    claim: 'Josephus says seven years'
    key: 'josephus-antiquities'
    url: 'https://penelope.uchicago.edu/josephus/ant-10.html'
    quote: 'when he had lived in this manner in the desert for seven years'
  - where: 'note 4:16 “How long “seven times” is”'
    claim: 'The Church’s footnote on “times” at 4:16 offers years or seasons'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/4?lang=eng'
    quote: 'OR years, or seasons.'
  - where: 'note 4:16 “How long “seven times” is”'
    claim: 'The Church’s footnote at 4:34 reads the days as the seven years'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/4?lang=eng'
    quote: 'IE the seven years.'

  - where: 'note 4:17 ““The basest of men” means the lowliest”'
    claim: 'The Aramaic adjective means low in station'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/8215.htm'
    quote: 'adjective low in station'
  - where: 'note 4:17 ““The basest of men” means the lowliest”'
    claim: 'A modern translation has “the lowliest of human beings”'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Daniel+4%3A16-19%2C27&version=NRSVUE'
    quote: 'and sets over it the lowliest of human beings'
  - where: 'note 4:17 ““The basest of men” means the lowliest”'
    claim: 'The verb “abase” in 4:37 is from the same root: to abase, humble'
    key: 'strongs-concordance'
    url: 'https://biblehub.com/hebrew/8214.htm'
    quote: '(Aramaic) corresponding to shaphel -- abase, humble, put down, subdue.'
  - where: 'note 4:17 ““The basest of men” means the lowliest”'
    claim: 'The adjective of 4:17 is derived from that verb'
    key: 'strongs-concordance'
    url: 'https://biblehub.com/hebrew/8215.htm'
    quote: '(Aramaic) from shphal; low -- basest.'
  - where: 'note 4:17 ““The basest of men” means the lowliest”'
    claim: 'The last word of 4:37 (Hebrew 4:34) is the verb, Strong’s 8214'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'lemma="l/8214"'

  - where: 'note 4:19 “Why Daniel was silent”'
    claim: '“Astonied” means bewildered or filled with dismay; Daniel knew the message was not good'
    key: 'ot-manual-28'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'The word astonied is an archaic word that means “bewildered” or “filled with consternation or dismay.” Daniel was troubled because he knew that the message of Nebuchadnezzar’s dream was not good.'
  - where: 'note 4:19 “Why Daniel was silent”'
    claim: 'Daniel speaks with affection for the king (Keil, as the manual prints him)'
    key: 'ot-manual-28'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'Daniel then communicates it in words of affectionate interest for the welfare of the king.'
  - where: 'note 4:19 “Why Daniel was silent”'
    claim: 'The Aramaic “one hour” means for a moment'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/8160.htm'
    quote: 'Daniel 4:16 for a moment'
  - where: 'note 4:19 “Why Daniel was silent”'
    claim: 'A modern translation: severely distressed for a while'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Daniel+4%3A16-19%2C27&version=NRSVUE'
    quote: 'Then Daniel, whose name was Belteshazzar, was severely distressed for a while.'

  - where: 'note 4:26 ““Heaven” as a name for God”'
    claim: '“Heaven” stands here for the Most High, and from this usage came “kingdom of heaven” for “kingdom of God”'
    key: 'keil-daniel'
    url: 'https://biblehub.com/commentaries/kad/daniel/4.htm'
    quote: 'From this passage we have an explanation of the use of שׁמיּא, heaven, for עלּיא, the Most High, God of heaven, whence afterwards arose the use of'

  - where: 'note 4:27 “Could the sentence have been turned aside?”'
    claim: 'The implication is that the king might avert the punishment'
    key: 'ot-manual-28'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'if Nebuchadnezzar would do as he was counseled, he might receive divine favor and avert the threatened punishment'
  - where: 'note 4:27 “Could the sentence have been turned aside?”'
    claim: 'Mercy to the poor as evidence of repentance'
    key: 'ot-manual-28'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'It is one of the most sincere evidences of repentance and submission to the Lord’s will.'
  - where: 'note 4:27 “Could the sentence have been turned aside?”'
    claim: 'The Aramaic verb means to tear away, break off'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/6562.htm'
    quote: 'verb tear away, break off'
  - where: 'note 4:27 “Could the sentence have been turned aside?”'
    claim: 'The Aramaic noun means right doing'
    key: 'bdb'
    url: 'https://biblehub.com/hebrew/6665.htm'
    quote: 'noun feminine right doing'
  - where: 'note 4:27 “Could the sentence have been turned aside?”'
    claim: 'The Greek version reads “atone for thy sins by alms”'
    key: 'lxx-rahlfs'
    url: 'https://biblehub.com/sep/daniel/4.htm'
    quote: 'atone for thy sins by alms, and thine iniquities by compassion on the poor'
  - where: 'note 4:27 “Could the sentence have been turned aside?”'
    claim: 'A modern translation prints “atone” with “break off” in the margin'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Daniel+4%3A16-19%2C27&version=NRSVUE'
    quote: 'atone for your sins with righteousness and your iniquities with mercy to the oppressed'
  - where: 'note 4:27 “Could the sentence have been turned aside?”'
    claim: 'The margin gives the Aramaic as “break off”'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Daniel+4%3A16-19%2C27&version=NRSVUE'
    quote: 'Aram break off'

  - where: 'note 4:30 “The boast was true, which is the point”'
    claim: 'Berosus, quoted by Josephus, says Nebuchadnezzar built the walls of Babylon'
    key: 'josephus-antiquities'
    url: 'https://penelope.uchicago.edu/josephus/ant-10.html'
    quote: 'He therefore built three walls round about the inner city; and three others about that which was the outer'
  - where: 'note 4:30 “The boast was true, which is the point”'
    claim: 'He built a new palace'
    key: 'josephus-antiquities'
    url: 'https://penelope.uchicago.edu/josephus/ant-10.html'
    quote: 'he built another palace before his father’s palace'
  - where: 'note 4:30 “The boast was true, which is the point”'
    claim: 'He raised a garden on heights for his wife'
    key: 'josephus-antiquities'
    url: 'https://penelope.uchicago.edu/josephus/ant-10.html'
    quote: 'He also erected what was called a pensile paradise; because his wife was desirous to have things like her own countrey'
  - where: 'note 4:30 “The boast was true, which is the point”'
    claim: 'He reigned forty-three years'
    key: 'josephus-antiquities'
    url: 'https://penelope.uchicago.edu/josephus/ant-10.html'
    quote: 'Now when King Nebuchadnezzar had reigned forty three years'
  - where: 'note 4:30 “The boast was true, which is the point”'
    claim: 'He was the great king of Babylon'
    key: 'bd-nebuchadnezzar'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/nebuchadnezzar?lang=eng'
    quote: 'The great king of Babylon (604–561 B.C.)'
  - where: 'note 4:30 “The boast was true, which is the point”'
    claim: 'Daniel names the fault as pride when he retells it'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/5?lang=eng'
    quote: 'But when his heart was lifted up, and his mind hardened in pride'

  - where: 'note 4:33 “What happened to the king, and what other records say”'
    claim: 'A modern translation of 4:16: the mind of an animal'
    key: 'nrsvue'
    url: 'https://www.biblegateway.com/passage/?search=Daniel+4%3A16-19%2C27&version=NRSVUE'
    quote: 'and let the mind of an animal be given to him'
  - where: 'note 4:33 “What happened to the king, and what other records say”'
    claim: 'Josephus retells the story from the Hebrew books and asks not to be blamed for it'
    key: 'josephus-antiquities'
    url: 'https://penelope.uchicago.edu/josephus/ant-10.html'
    quote: 'But let no one blame me for writing down every thing of this nature, as I find it in our ancient books.'
  - where: 'note 4:33 “What happened to the king, and what other records say”'
    claim: 'Josephus lists the outside histories he found on Nebuchadnezzar; what he quotes concerns wars and buildings'
    key: 'josephus-antiquities'
    url: 'https://penelope.uchicago.edu/josephus/ant-10.html'
    quote: 'These are all the histories that I have met with concerning this King.'
  - where: 'note 4:33 “What happened to the king, and what other records say”'
    claim: 'The Babylonian accounts do not mention Nebuchadnezzar’s madness; the article holds the story is about Nabonidus'
    key: 'tvedtnes-nabonidus'
    url: 'https://www.churchofjesuschrist.org/study/ensign/1986/09/nebuchadnezzar-or-nabonidus-mistaken-identities-in-the-book-of-daniel?lang=eng'
    quote: 'The Babylonian accounts do not mention that Nebuchadnezzar became mad. But it is well known that Nabonidus did.'
  - where: 'note 4:33 “What happened to the king, and what other records say”'
    claim: 'Babylonian records have Nabonidus at Tema for years, the crown prince left in Babylonia'
    key: 'tvedtnes-nabonidus'
    url: 'https://www.churchofjesuschrist.org/study/ensign/1986/09/nebuchadnezzar-or-nabonidus-mistaken-identities-in-the-book-of-daniel?lang=eng'
    quote: 'The records show that Nabonidus “stayed in Tema” at least from the seventh through eleventh years of his reign, leaving “the crown prince, the officials and the army” in Babylonia.'
  - where: 'note 4:33 “What happened to the king, and what other records say”'
    claim: 'Tema is a town of northern Arabia'
    key: 'tvedtnes-nabonidus'
    url: 'https://www.churchofjesuschrist.org/study/ensign/1986/09/nebuchadnezzar-or-nabonidus-mistaken-identities-in-the-book-of-daniel?lang=eng'
    quote: 'the northern Arabian town of Tema'
  - where: 'note 4:33 “What happened to the king, and what other records say”'
    claim: 'The Dead Sea Scrolls “Prayer of Nabonidus”: a king afflicted, a Jewish adviser, seven years'
    key: 'tvedtnes-nabonidus'
    url: 'https://www.churchofjesuschrist.org/study/ensign/1986/09/nebuchadnezzar-or-nabonidus-mistaken-identities-in-the-book-of-daniel?lang=eng'
    quote: 'A fragmentary document titled “The Prayer of Nabonidus” tells of a king NBNY (Hebrew uses no vowels) who, while at Tema, was diseased by the God of Israel. A Jewish adviser (no doubt Daniel) counsels him to honor God'
  - where: 'note 4:33 “What happened to the king, and what other records say”'
    claim: 'The proposal: a scribe took the shorter name for an abbreviation of the better-known one'
    key: 'tvedtnes-nabonidus'
    url: 'https://www.churchofjesuschrist.org/study/ensign/1986/09/nebuchadnezzar-or-nabonidus-mistaken-identities-in-the-book-of-daniel?lang=eng'
    quote: 'A Scribe or Aramaic translator could have easily assumed that NBND in the original Hebrew was an abbreviation for the name of the better-known king Nebuchadnezzar.'
  - where: 'note 4:33 “What happened to the king, and what other records say”'
    claim: 'Nabonidus is listed as the last Babylonian king'
    key: 'tvedtnes-nabonidus'
    url: 'https://www.churchofjesuschrist.org/study/ensign/1986/09/nebuchadnezzar-or-nabonidus-mistaken-identities-in-the-book-of-daniel?lang=eng'
    quote: 'lists “Nabonadius” as the last Babylonian king'
  - where: 'note 4:33 “What happened to the king, and what other records say”'
    claim: 'The article says such errors need not damage faith in the book'
    key: 'tvedtnes-nabonidus'
    url: 'https://www.churchofjesuschrist.org/study/ensign/1986/09/nebuchadnezzar-or-nabonidus-mistaken-identities-in-the-book-of-daniel?lang=eng'
    quote: 'Such errors need not damage our faith in the book of Daniel, or in the Old Testament as a whole.'
  - where: 'note 4:33 “What happened to the king, and what other records say”'
    claim: 'The Bible Dictionary keeps Nebuchadnezzar as the king smitten with madness'
    key: 'bd-nebuchadnezzar'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/nebuchadnezzar?lang=eng'
    quote: 'He was for a time smitten with madness and on his recovery acknowledged God’s power and goodness.'

  - where: 'note 4:34 “Why the recovery begins with a look upward”'
    claim: 'The look to heaven is the first sign of returning human consciousness'
    key: 'keil-daniel'
    url: 'https://biblehub.com/commentaries/kad/daniel/4.htm'
    quote: 'Nebuchadnezzar lifted up his eyes to heaven, - the first sign of the return of human consciousness'
  - where: 'note 4:34 “Why the recovery begins with a look upward”'
    claim: 'His first thought was a look to heaven for help, as in Psalm 123:1'
    key: 'keil-daniel'
    url: 'https://biblehub.com/commentaries/kad/daniel/4.htm'
    quote: 'his first thought was a look to heaven, whence help came to him; cf. Psalm 123:1'

  - where: 'note 4:37 “Was Nebuchadnezzar converted?”'
    claim: 'The king’s confessions progress; the first allowed Jehovah a place among the gods'
    key: 'draper-exile'
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/prophets-exile'
    quote: 'We see in this admission the king allowing Jehovah a place among the pantheon of Babylonian gods and even according Him the special place as revealer.'
  - where: 'note 4:37 “Was Nebuchadnezzar converted?”'
    claim: 'The lesson of chapter 4: Jehovah ruled over the king'
    key: 'draper-exile'
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/prophets-exile'
    quote: 'Nebuchadnezzar may rule over Babylon and its temples, but Jehovah ruled over him.'
  - where: 'note 4:37 “Was Nebuchadnezzar converted?”'
    claim: 'The text does not show whether he left polytheism'
    key: 'draper-exile'
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/prophets-exile'
    quote: 'It is hard to know from the text if Nebuchadnezzar moved from polytheism to henotheism or monotheism.'
  - where: 'note 4:37 “Was Nebuchadnezzar converted?”'
    claim: 'His praise does not necessarily mean repentance or conversion'
    key: 'ot-manual-28'
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'It does not necessarily follow, however, that this experience caused his sincere repentance or conversion to the God of Daniel.'

  - where: 'christ'
    claim: 'The one like the Son of man in Daniel 7 is Jesus Christ'
    key: 'bd-daniel-book'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/daniel-book-of?lang=eng'
    quote: 'The “Son of Man” is Jesus Christ.'
  - where: 'christ'
