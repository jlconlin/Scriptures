chapter: 7
claims:
  - where: 'setting'
    claim: 'Chapter 7 stands at the transition between the stories and the visions'
    key: ludlow-son-of-man
    url: 'https://rsc.byu.edu/vol-24-no-1-2023/one-like-son-man-came-clouds-heaven'
    quote: 'Daniel 7 falls at the transition point between these two parts'
  - where: 'setting'
    claim: 'The Aramaic part of the book runs to the end of chapter 7'
    key: ludlow-son-of-man
    url: 'https://rsc.byu.edu/vol-24-no-1-2023/one-like-son-man-came-clouds-heaven'
    quote: 'Much of the first part and into chapter 7 is written in Aramaic (2:4b—7:28)'
  - where: 'setting'
    claim: 'In earlier chapters kings dreamed and Daniel interpreted; this dream is Daniel’s own'
    key: ludlow-son-of-man
    url: 'https://rsc.byu.edu/vol-24-no-1-2023/one-like-son-man-came-clouds-heaven'
    quote: 'Unlike earlier chapters in Daniel where kings received the dreams and then Daniel interpreted them, Daniel 7 recounts the prophet’s own dream.'
  - where: 'setting'
    claim: 'Daniel 7 shows the world-kingdoms giving place to the kingdom of God under the symbolism of beasts'
    key: bd-daniel-book
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/daniel-book-of?lang=eng'
    quote: 'Dan. 7, under the symbolism of beasts, shows how, at the end, the world-kingdoms give place to the kingdom of God.'
  - where: 'setting'
    claim: 'Son of Man is the title Jesus used for Himself more than any other, and its roots are in Daniel 7'
    key: ludlow-son-of-man
    url: 'https://rsc.byu.edu/vol-24-no-1-2023/one-like-son-man-came-clouds-heaven'
    quote: 'The title Jesus preferred to use for himself more than any other in the New Testament Gospels was “Son of Man.”'
  - where: 'setting'
    claim: 'John saw a beast from the sea with features of a leopard, a bear and a lion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/13?lang=eng'
    quote: 'And the beast which I saw was like unto a leopard, and his feet were as the feet of a bear, and his mouth as the mouth of a lion'

  - where: 'thread'
    claim: 'Nebuchadnezzar saw the world-power in its glory, Daniel as beasts of prey'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/7.htm'
    quote: 'Nebuchadnezzar, the founder of the world-power, saw this power in its imposing greatness and glory; while Daniel, the prophet of God, saw it in its opposition to God in the form of ravenous beasts of prey.'
  - where: 'thread'
    claim: 'The chapter contrasts beastly kingdoms with the eternal kingdom'
    key: ludlow-son-of-man
    url: 'https://rsc.byu.edu/vol-24-no-1-2023/one-like-son-man-came-clouds-heaven'
    quote: 'Thus these verses set up the contrast between the beastly political kingdoms of the earth and the eternal kingdom that will be established among the saints.'

  - where: 'section 2 plain'
    claim: '“Cast down” in verse 9 is “set up” in the Aramaic'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/7?lang=eng'
    quote: 'Aramaic: set up.'
  - where: 'section 2 plain'
    claim: '“The judgment was set” is the court sitting'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Daniel%207&version=NRSVUE'
    quote: 'The court sat in judgment'

  - where: 'note 7:2 “The sea the beasts come from”'
    claim: 'The storm on the great sea stands for commotions among the nations'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/7.htm'
    quote: 'It is the ocean; and the storm on it represents the "tumults of the people," commotions among the nations of the world'
  - where: 'note 7:2 “The sea the beasts come from”'
    claim: 'The four winds answer to the four quarters of the heavens'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/7.htm'
    quote: 'The four winds stand in relation to the four quarters of the heavens'

  - where: 'note 7:3 “Why kingdoms are shown as beasts”'
    claim: 'Joseph Smith: God used the figure of a beast for degenerate kingdoms'
    key: jsp-history-d1-1522
    url: 'https://www.josephsmithpapers.org/paper-summary/history-1838-1856-volume-d-1-1-august-1842-1-july-1843/165'
    quote: 'When God made use of the figure of a beast in visions to the prophets, he did it to represent those kingdoms which had degenerated and become corrupt'
  - where: 'note 7:3 “Why kingdoms are shown as beasts”'
    claim: 'Joseph Smith: never a beast for God’s kingdom'
    key: jsp-history-d1-1522
    url: 'https://www.josephsmithpapers.org/paper-summary/history-1838-1856-volume-d-1-1-august-1842-1-july-1843/165'
    quote: 'he never made use of the figure of a beast nor any of the brute kind to represent His kingdom'
  - where: 'note 7:3 “Why kingdoms are shown as beasts”'
    claim: 'The sermon was preached on 8 April 1843'
    key: jsp-history-d1-1522
    url: 'https://www.josephsmithpapers.org/paper-summary/history-1838-1856-volume-d-1-1-august-1842-1-july-1843/165'
    quote: '8 April 1843'
  - where: 'note 7:3 “Why kingdoms are shown as beasts”'
    claim: 'Joseph Smith: the angel interpreted the vision, and the beasts are the kingdoms of the world'
    key: jsp-history-d1-1522
    url: 'https://www.josephsmithpapers.org/paper-summary/history-1838-1856-volume-d-1-1-august-1842-1-july-1843/165'
    quote: 'You there see that the beasts are spoken of to represent the kingdoms of the world, the inhabitants whereof were beastly and abominable characters'
  - where: 'note 7:3 “Why kingdoms are shown as beasts”'
    claim: 'Joseph Smith: Daniel saw images or figures of beasts (next page of the history)'
    key: jsp-history-d1-1522
    url: 'https://www.josephsmithpapers.org/paper-summary/history-1838-1856-volume-d-1-1-august-1842-1-july-1843/166'
    quote: 'Daniel did not see an actual bear or a lion, but the images or figures of those beasts.'
  - where: 'note 7:3 “Why kingdoms are shown as beasts”'
    claim: 'The heavenly kingdom is never portrayed as a beast'
    key: ludlow-son-of-man
    url: 'https://rsc.byu.edu/vol-24-no-1-2023/one-like-son-man-came-clouds-heaven'
    quote: 'The heavenly kingdom is never portrayed as a beast because it lacks the bloodthirstiness and fleeting nature of the earthly kingdoms.'

  - where: 'note 7:4 “The lion that is made to stand like a man”'
    claim: 'The Church’s footnote on “first” (7:4) points to Daniel 2:38, the head of gold'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/7?lang=eng'
    quote: 'Dan. 2:38'
  - where: 'note 7:4 “The lion that is made to stand like a man”'
    claim: 'Lion and eagle are each supreme of their class'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'The lion and eagle are both supreme among beasts of their class.'
  - where: 'note 7:4 “The lion that is made to stand like a man”'
    claim: 'The plucked wings are a loss of power'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'seems to have represented a deprivation of power to fly or the power to dominate and conquer'
  - where: 'note 7:4 “The lion that is made to stand like a man”'
    claim: 'The man’s heart refers to Nebuchadnezzar’s madness'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'The change that gave it a man’s heart is evidently a reference to the humanizing effect of Nebuchadnezzar’s madness'
  - where: 'note 7:4 “The lion that is made to stand like a man”'
    claim: 'Wings depict the ability to move and spread'
    key: ludlow-son-of-man
    url: 'https://rsc.byu.edu/vol-24-no-1-2023/one-like-son-man-came-clouds-heaven'
    quote: 'wings are common depictions for the ability to move and spread, while horns are symbols of power'
  - where: 'note 7:4 “The lion that is made to stand like a man”'
    claim: 'The ribs and the devouring signify ferocity'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'signify the ferocity with which its dominion would be exerted'
  - where: 'note 7:4 “The lion that is made to stand like a man”'
    claim: 'Heads signify governing power'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'Heads signify governing power or the seat of government.'
  - where: 'note 7:4 “The lion that is made to stand like a man”'
    claim: 'The Church’s footnote on “heads” (7:6) points to Daniel 8:8'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/7?lang=eng'
    quote: 'Dan. 8:8'

  - where: 'note 7:8 “The little horn is described, not named”'
    claim: 'The verb “wear out” means wear away and is figurative for harassing continually'
    key: bdb
    url: 'https://biblehub.com/hebrew/1080.htm'
    quote: 'verb Pa`el wear away, out'
  - where: 'note 7:8 “The little horn is described, not named”'
    claim: 'The verb is figurative for harassing continually'
    key: bdb
    url: 'https://biblehub.com/hebrew/1080.htm'
    quote: 'figurative for harass continually'
  - where: 'note 7:8 “The little horn is described, not named”'
    claim: 'The last world-monarchy persecutes the saints and is ended by God’s judgment'
    key: bd-daniel-book
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/daniel-book-of?lang=eng'
    quote: 'the last of which will severely persecute the saints but will be brought to an end by the judgment of God'
  - where: 'note 7:8 “The little horn is described, not named”'
    claim: 'The horn cannot be positively identified'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'This symbol cannot be positively identified with any specific individual or kingdom of the world'
  - where: 'note 7:8 “The little horn is described, not named”'
    claim: 'The horn is an anti-Christ power, like the beast John saw'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'The little horn represented a notable anti-Christ power'
  - where: 'note 7:8 “The little horn is described, not named”'
    claim: 'The manual places the horn after the Roman Empire'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'a notable anti-Christ power that was to be raised up after the time of the Roman Empire'
  - where: 'note 7:8 “The little horn is described, not named”'
    claim: 'The horn hinders the Saints until the Second Coming'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'this horn would have power to make war with and hinder the Saints until the time of Christ’s Second Coming'
  - where: 'note 7:8 “The little horn is described, not named”'
    claim: 'The manual reads the fourth beast as the Roman Empire and the evil manifest through it'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'It represented the Roman Empire and the forces of evil that were manifest through that empire.'
  - where: 'note 7:8 “The little horn is described, not named”'
    claim: 'John’s beast is given a mouth speaking great things and makes war with the saints'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/13?lang=eng'
    quote: 'And there was given unto him a mouth speaking great things and blasphemies'
  - where: 'note 7:8 “The little horn is described, not named”'
    claim: 'John’s beast makes war with the saints'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/13?lang=eng'
    quote: 'And it was given unto him to make war with the saints, and to overcome them'
  - where: 'note 7:8 “The little horn is described, not named”'
    claim: 'Sidney B. Sperry’s suggestion, as the manual prints it: the fourth beast is the great and abominable church'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'is none other than the ‘great and abominable church’ of our modern scriptures'
  - where: 'note 7:8 “The little horn is described, not named”'
    claim: 'Sperry’s qualification'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'we do not at present fully comprehend the ramifications of it'
  - where: 'note 7:8 “The little horn is described, not named”'
    claim: 'Offered with “perhaps”: the vision’s main point may be to warn that the kingdoms’ unrighteous ideals reign until Christ returns'
    key: ludlow-son-of-man
    url: 'https://rsc.byu.edu/vol-24-no-1-2023/one-like-son-man-came-clouds-heaven'
    quote: 'their unrighteous ideals and philosophies, similar to the concept of the great and abominable church found in other parts of scripture, will have their reign until the return of Christ'

