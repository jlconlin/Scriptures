    url: 'https://www.biblegateway.com/passage/?search=Daniel%207&version=NRSVUE'
    quote: 'The court sat in judgment'
  - where: 'note 7:9 “The thrones are set in place, not thrown down”'
    claim: 'The King James sounds as if thrones are toppled; the Aramaic means set up'
    key: ludlow-son-of-man
    url: 'https://rsc.byu.edu/vol-24-no-1-2023/one-like-son-man-came-clouds-heaven'
    quote: 'Although the King James Version makes it sound like the thrones are toppled, the Aramaic phrase means “set up” or “established.”'
  - where: 'note 7:9 “The thrones are set in place, not thrown down”'
    claim: 'The plural may foreshadow two thrones'
    key: ludlow-son-of-man
    url: 'https://rsc.byu.edu/vol-24-no-1-2023/one-like-son-man-came-clouds-heaven'
    quote: 'The plural thrones likely foreshadows one for the Ancient of Days and one for the Son of Man.'
  - where: 'note 7:9 “The thrones are set in place, not thrown down”'
    claim: 'Matthew 19:28 is set beside the scene as mortals given a share in judging'
    key: ludlow-son-of-man
    url: 'https://rsc.byu.edu/vol-24-no-1-2023/one-like-son-man-came-clouds-heaven'
    quote: 'The fact that a former mortal is given stewardship to judge is not surprising in Latter-day Saint theology.'
  - where: 'note 7:9 “The thrones are set in place, not thrown down”'
    claim: 'The Church’s footnote on “wheels” points to Ezekiel 1:15'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/7?lang=eng'
    quote: 'Ezek. 1:15'
  - where: 'note 7:9 “The thrones are set in place, not thrown down”'
    claim: 'The wheeled throne gives the sense of movement'
    key: ludlow-son-of-man
    url: 'https://rsc.byu.edu/vol-24-no-1-2023/one-like-son-man-came-clouds-heaven'
    quote: 'It gives the sense that the figure moves about, such as descending from heaven as in this setting'

