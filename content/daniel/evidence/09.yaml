chapter: 9
claims:
  # ---------- when ----------
  - where: 'when'
    claim: 'The first year of the new rule over Babylon is placed at 539 B.C. (Sperry, as the manual prints him)'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'Babylon, the power that had brought about the captivity is now fallen, and Persia is in the first year of its rule. (539 B.C.)'

  # ---------- setting ----------
  - where: 'setting'
    claim: 'Babylon has fallen; about 539 B.C.'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'Babylon, the power that had brought about the captivity is now fallen, and Persia is in the first year of its rule. (539 B.C.)'
  - where: 'setting'
    claim: 'Ahasuerus is the name of one Median and two Persian kings; here the Median, father of Darius the Mede'
    key: bd-ahasuerus
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ahasuerus?lang=eng'
    quote: 'Old Testament name of one Median and two Persian kings.'
  - where: 'setting'
    claim: 'The Ahasuerus of Esther is a different king (Xerxes)'
    key: bd-ahasuerus
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ahasuerus?lang=eng'
    quote: 'Esth. 1:1, where Ahasuerus is certainly to be identified with Xerxes.'
  - where: 'setting'
    claim: 'It is seventy years or nearly so since Daniel was taken'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'It is now seventy years or nearly so since I and my family, not to mention many other Jews, were taken into captivity.'
  - where: 'setting'
    claim: 'The chapter heading: Daniel fasts, confesses and prays; Gabriel reveals the coming of the Messiah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/9?lang=eng'
    quote: 'Daniel fasts, confesses, and prays for all Israel'

  # ---------- thread ----------
  - where: 'thread'
    claim: 'Jeremiah’s promise of return came with the condition of prayer and whole-hearted seeking'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/29?lang=eng'
    quote: 'And ye shall seek me, and find me, when ye shall search for me with all your heart.'
  - where: 'thread'
    claim: 'The law of Moses named confession as the turning point of exile'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/26?lang=eng'
    quote: 'If they shall confess their iniquity, and the iniquity of their fathers'
  - where: 'thread'
    claim: 'The seventy weeks are seventy sevens'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'The phrase “seventy weeks” thus refers to seventy periods of sevens.'
  - where: 'thread'
    claim: 'The reckoning of the weeks is not settled'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'many attempts have been made to do that, resulting in several differing interpretations of the passage'

  # ---------- sections ----------
  - where: 'section 2 plain'
    claim: '“Dreadful” rendered “awesome”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Daniel%209&version=NRSVUE'
    quote: 'Ah, Lord, great and awesome God, keeping covenant and steadfast love'
  - where: 'section 2 plain'
    claim: '“Confusion of faces” is shame'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/9?lang=eng'
    quote: 'OR shamefacedness.'
  - where: 'section 2 plain'
    claim: '“Confusion of faces” rendered “open shame”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Daniel%209&version=NRSVUE'
    quote: 'Righteousness is on your side, O Lord, but open shame, as at this day, falls on us'
  - where: 'section 2 plain'
    claim: '“Evil” in verse 12 is calamity'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/9?lang=eng'
    quote: 'OR calamity.'
  - where: 'section 2 plain'
    claim: '“Made we not our prayer” rendered as seeking the Lord’s favor; “watched upon the evil” as keeping watch over the calamity'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Daniel%209&version=NRSVUE'
    quote: 'We did not entreat the favor of the Lord our God, turning from our iniquities and reflecting on his fidelity.'
  - where: 'section 2 plain'
    claim: '“Watched upon the evil” rendered as keeping watch over the calamity'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Daniel%209&version=NRSVUE'
    quote: 'So the Lord kept watch over this calamity until he brought it upon us.'
  - where: 'section 3 plain'
    claim: '“Gotten thee renown” rendered as making a name'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Daniel%209&version=NRSVUE'
    quote: 'made your name renowned even to this day'
  - where: 'section 4 plain'
    claim: '“Being caused to fly swiftly” rendered “in swift flight”; the oblation as the evening offering'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Daniel%209&version=NRSVUE'
    quote: 'came to me in swift flight at the time of the evening sacrifice'
  - where: 'section 4 plain'
    claim: '“The commandment came forth” rendered “a word went out”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Daniel%209&version=NRSVUE'
    quote: 'At the beginning of your supplications a word went out, and I have come to declare it'
  - where: 'section 5 plain'
    claim: '“Determined” (9:24) is a verb meaning divide, determine: marked out'
    key: bdb
    url: 'https://biblehub.com/hebrew/2852.htm'
    quote: 'verb divide, determine'
  - where: 'section 5 plain'
    claim: '“The going forth of the commandment” rendered as a word going out; “determined” (9:26) as decreed'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Daniel%209&version=NRSVUE'
    quote: 'from the time that the word went out to restore and rebuild Jerusalem'

  # ---------- note 9:2 ----------
  - where: 'note 9:2 “Daniel reads Jeremiah”'
    claim: 'The Hebrew of 9:2 is plural with the article: the books, the writings'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'בַּ/סְּפָרִ֑ים'
  - where: 'note 9:2 “Daniel reads Jeremiah”'
    claim: 'Jeremiah 29:1 calls what Jeremiah sent to the exiles in Babylon a letter'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/29?lang=eng'
    quote: 'Now these are the words of the letter that Jeremiah the prophet sent from Jerusalem unto the residue of the elders which were carried away captives'
  - where: 'note 9:2 “Daniel reads Jeremiah”'
    claim: 'The word does not show that the writings were already a recognized collection'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/9.htm'
    quote: 'does not say that these writings formed already a recognised collection'
  - where: 'note 9:2 “Daniel reads Jeremiah”'
    claim: 'Jeremiah gives the seventy years in 25:11–12'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/25?lang=eng'
    quote: 'these nations shall serve the king of Babylon seventy years'
  - where: 'note 9:2 “Daniel reads Jeremiah”'
    claim: 'Jeremiah gives the seventy years again in the letter, 29:10'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/29?lang=eng'
    quote: 'That after seventy years be accomplished at Babylon I will visit you, and perform my good word toward you, in causing you to return to this place.'
  - where: 'note 9:2 “Daniel reads Jeremiah”'
    claim: 'The Church’s footnote at 9:2 joins the seventy years to Jeremiah 25:12 and 2 Chronicles 36:21'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/9?lang=eng'
    quote: '“seventy”: 2 Chr. 36:21; Jer. 25:12.'
  - where: 'note 9:2 “Daniel reads Jeremiah”'
    claim: 'Sperry’s reconstruction, as the manual prints it: Babylon is fallen'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'Babylon, the power that had brought about the captivity is now fallen, and Persia is in the first year of its rule.'
  - where: 'note 9:2 “Daniel reads Jeremiah”'
    claim: 'Sperry’s reconstruction: seventy years or nearly so since Daniel was taken'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'It is now seventy years or nearly so since I and my family, not to mention many other Jews, were taken into captivity.'
  - where: 'note 9:2 “Daniel reads Jeremiah”'
    claim: 'Sperry’s reconstruction: the people not yet restored, so Daniel inquires and confesses'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'In view of the fact that my people have not yet been restored, I shall inquire of the Lord and confess my people’s sins.'
  - where: 'note 9:2 “Daniel reads Jeremiah”'
    claim: 'Keil’s view: the people’s religious condition moved Daniel to pray'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/9.htm'
    quote: 'That which moved Daniel to prayer was rather the religious condition of his own people, among whom the chastisement of the Exile had not produced the expected fruits of repentance'
  - where: 'note 9:2 “Daniel reads Jeremiah”'
    claim: 'Jeremiah’s letter follows the seventy years with the instruction to pray and seek (29:12–13)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/29?lang=eng'
    quote: 'Then shall ye call upon me, and ye shall go and pray unto me, and I will hearken unto you.'
  - where: 'note 9:2 “Daniel reads Jeremiah”'
    claim: 'A modern translation’s cross-references join Daniel 9:3 to Jeremiah 29:12'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Daniel%209&version=NRSVUE'
    quote: 'Neh 1.4; Jer 29.12; Jas 4.8'

  # ---------- note 9:4 ----------
  - where: 'note 9:4 “The covenant name, only in this chapter”'
    claim: 'The divine name (H3068) occurs in Daniel 8 times, in 9:2, 4, 8, 10, 13, 14 (twice) and 20, and nowhere else in the book (hebrew.mjs daniel --word 3068)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'יְהוָה֙'
  - where: 'note 9:4 “The covenant name, only in this chapter”'
    claim: 'Adonai (H136) occurs ten times in chapter 9: verses 3, 4, 7, 9, 15, 16, 17 and three times in 19 (hebrew.mjs daniel --word 136)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'אֲדֹנָ/י֙'
  - where: 'note 9:4 “The covenant name, only in this chapter”'
    claim: 'The King James text prints the name in verse 4 and “Lord” (adonai) beside it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/9?lang=eng'
    quote: 'And I prayed unto the Lord my God, and made my confession, and said, O Lord, the great and dreadful God'
  - where: 'note 9:4 “The covenant name, only in this chapter”'
    claim: 'Jehovah is the covenant name of the God of Israel'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'The covenant or proper name of the God of Israel.'
  - where: 'note 9:4 “The covenant name, only in this chapter”'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'

  # ---------- note 9:5 ----------
  - where: 'note 9:5 “Why the confession is in the plural”'
    claim: 'The Church’s footnote at 9:13 sends the reader to Leviticus 26:14–46'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/9?lang=eng'
    quote: '“law”: Lev. 26:14 (14–46).'
  - where: 'note 9:5 “Why the confession is in the plural”'
    claim: 'Leviticus 26 makes confession of their iniquity and their fathers’ the condition'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/26?lang=eng'
    quote: 'If they shall confess their iniquity, and the iniquity of their fathers, with their trespass which they trespassed against me'
  - where: 'note 9:5 “Why the confession is in the plural”'
    claim: 'Leviticus 26 promises that the Lord will then remember the covenant and the land'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/26?lang=eng'
    quote: 'Then will I remember my covenant with Jacob, and also my covenant with Isaac, and also my covenant with Abraham will I remember; and I will remember the land.'
  - where: 'note 9:5 “Why the confession is in the plural”'
    claim: 'The Church’s footnote at 9:5 joins the confession to Solomon’s prayer'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/9?lang=eng'
    quote: '“sinned”: 1 Kgs. 8:47; Ps. 106:6.'
  - where: 'note 9:5 “Why the confession is in the plural”'
    claim: 'Solomon’s prayer gives captives the words “We have sinned”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/8?lang=eng'
    quote: 'saying, We have sinned, and have done perversely, we have committed wickedness'
  - where: 'note 9:5 “Why the confession is in the plural”'
    claim: 'The chapter heading: Daniel prays for all Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/9?lang=eng'
    quote: 'Daniel fasts, confesses, and prays for all Israel'

  # ---------- note 9:11 ----------
  - where: 'note 9:11 “The curse and the oath in the law of Moses”'
    claim: 'Deuteronomy 28 warns that the curses will overtake a disobedient Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/28?lang=eng'
    quote: 'that all these curses shall come upon thee, and overtake thee'
  - where: 'note 9:11 “The curse and the oath in the law of Moses”'
    claim: 'Deuteronomy 29 speaks of the Lord’s anger bringing on the land the curses written in the book'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/29?lang=eng'
    quote: 'And the anger of the Lord was kindled against this land, to bring upon it all the curses that are written in this book'
  - where: 'note 9:11 “The curse and the oath in the law of Moses”'
    claim: 'The penalties are also in Leviticus 26:14–46 (the Church’s footnote at 9:13)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/9?lang=eng'
    quote: '“law”: Lev. 26:14 (14–46).'

  # ---------- note 9:14 ----------
  - where: 'note 9:14 “The Lord who watched”'
    claim: 'Shaqad means watch, wake'
    key: bdb
    url: 'https://biblehub.com/hebrew/8245.htm'
    quote: 'verb watch, wake'
  - where: 'note 9:14 “The Lord who watched”'
    claim: 'With the Lord as subject: keep watch of, be wakeful over, to perform a thing (Jeremiah 1:12; Daniel 9:14; Jeremiah 31:28)'
    key: bdb
    url: 'https://biblehub.com/hebrew/8245.htm'
    quote: 'keep watch of, be wakeful over'
  - where: 'note 9:14 “The Lord who watched”'
    claim: 'BDB lists Jeremiah 1:12 and Daniel 9:14 together under watching over a thing to perform it'
    key: bdb
    url: 'https://biblehub.com/hebrew/8245.htm'
    quote: 'to perform it Jeremiah 1:12; Daniel 9:14'
  - where: 'note 9:14 “The Lord who watched”'
    claim: 'The King James renders the verb “hasten” in Jeremiah 1:12'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/1?lang=eng'
    quote: 'for I will hasten my word to perform it'
  - where: 'note 9:14 “The Lord who watched”'
    claim: 'The Church’s footnote at 9:14 joins the verse to Jeremiah 31:28'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/9?lang=eng'
    quote: '“evil”: Jer. 31:28.'
  - where: 'note 9:14 “The Lord who watched”'
    claim: 'The footnote at 9:12 gives “calamity” for “evil”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/9?lang=eng'
    quote: 'OR calamity.'

  # ---------- note 9:19 ----------
  - where: 'note 9:19 “What Daniel pleads”'
    claim: '“Righteousness” in 9:16 rendered “righteous acts”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Daniel%209&version=NRSVUE'
    quote: 'O Lord, in view of all your righteous acts, let your anger and wrath, we pray, turn away from your city Jerusalem'
  - where: 'note 9:19 “What Daniel pleads”'
    claim: 'Jeremiah 25, the chapter of the seventy years, speaks of the city called by the Lord’s name'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/25?lang=eng'
    quote: 'For, lo, I begin to bring evil on the city which is called by my name'

  # ---------- note 9:21 Gabriel ----------
  - where: 'note 9:21 “Gabriel, a second time”'
    claim: 'Gabriel explained the vision of chapter 8'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/8?lang=eng'
    quote: 'Gabriel, make this man to understand the vision.'
  - where: 'note 9:21 “Gabriel, a second time”'
    claim: 'Gabriel is named twice in the Old Testament, both times appearing to Daniel'
    key: mcconkie-special-witnesses
    url: 'https://rsc.byu.edu/sperry-symposium-classics-new-testament/special-witnesses-birth-christ'
    quote: 'Gabriel is mentioned twice in the Old Testament; both instances are appearances to Daniel.'
  - where: 'note 9:21 “Gabriel, a second time”'
    claim: 'The noun in “fly swiftly” means weariness; BDB reads the phrase as utterly weary, from winged flight'
    key: bdb
    url: 'https://biblehub.com/hebrew/3288.htm'
    quote: 'weary with weariness, utterly weary Daniel 9:21 (from winged flight, said of Gabriel).'
  - where: 'note 9:21 “Gabriel, a second time”'
    claim: 'The noun means weariness, faintness'
    key: bdb
    url: 'https://biblehub.com/hebrew/3288.htm'
    quote: 'weariness, faintness'
  - where: 'note 9:21 “Gabriel, a second time”'
    claim: 'A modern translation: “in swift flight”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Daniel%209&version=NRSVUE'
    quote: 'came to me in swift flight at the time of the evening sacrifice'
  - where: 'note 9:21 “Gabriel, a second time”'
    claim: 'The verb bin (H995) stands in 9:2 (“understood”), 9:22 (“informed”) and 9:23 (“understand”) (hebrew.mjs daniel 9:2, 9:22, 9:23)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'בִּינֹ֖תִי'
  - where: 'note 9:21 “Gabriel, a second time”'
    claim: 'The same verb in 9:22, “he informed me”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'וַ/יָּ֖בֶן'

  # ---------- note 9:21 hour ----------
  - where: 'note 9:21 “An hour kept without a temple”'
    claim: 'A modern translation renders the evening oblation “the evening sacrifice”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Daniel%209&version=NRSVUE'
    quote: 'came to me in swift flight at the time of the evening sacrifice'
  - where: 'note 9:21 “An hour kept without a temple”'
    claim: 'The time of the evening oblation was the time of evening prayer'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/9.htm'
    quote: 'The time of the evening oblation was the time of evening prayer for the congregation.'
  - where: 'note 9:21 “An hour kept without a temple”'
    claim: 'Ezra confesses at the evening sacrifice, over the transgression of the returned exiles'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/9?lang=eng'
    quote: 'because of the transgression of those that had been carried away; and I sat astonied until the evening sacrifice.'
  - where: 'note 9:21 “An hour kept without a temple”'
    claim: 'Ezra prays at the evening sacrifice'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/9?lang=eng'
    quote: 'And at the evening sacrifice I arose up from my heaviness'
  - where: 'note 9:21 “An hour kept without a temple”'
    claim: 'Psalm 141 sets prayer beside the evening sacrifice'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/141?lang=eng'
    quote: 'Let my prayer be set forth before thee as incense; and the lifting up of my hands as the evening sacrifice.'

  # ---------- note 9:23 ----------
  - where: 'note 9:23 “Answered at the first word”'
    claim: 'The noun in 9:23 and 9:25 is dabar, “word” (H1697) (hebrew.mjs daniel 9:23, 9:25)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'דָבָ֗ר'
  - where: 'note 9:23 “Answered at the first word”'
    claim: 'A modern translation: “a word went out”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Daniel%209&version=NRSVUE'
    quote: 'At the beginning of your supplications a word went out, and I have come to declare it'
  - where: 'note 9:23 “Answered at the first word”'
    claim: 'The same translation renders 9:25 alike'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Daniel%209&version=NRSVUE'
    quote: 'from the time that the word went out to restore and rebuild Jerusalem'
  - where: 'note 9:23 “Answered at the first word”'
    claim: 'The Church’s footnote at 9:3 joins the chapter to Daniel 10:12'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/9?lang=eng'
    quote: '“seek”: Dan. 10:12.'
  - where: 'note 9:23 “Answered at the first word”'
    claim: '“Greatly beloved” is said to Daniel again in 10:11 and 10:19'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/10?lang=eng'
    quote: 'O Daniel, a man greatly beloved, understand the words that I speak unto thee'

  # ---------- note 9:24 sevens ----------
  - where: 'note 9:24 “Seventy sevens”'
    claim: 'Shabua means a period of seven, heptad, week'
    key: bdb
    url: 'https://biblehub.com/hebrew/7620.htm'
    quote: 'period of seven (days, years), heptad, week'
  - where: 'note 9:24 “Seventy sevens”'
    claim: 'BDB takes the weeks of Daniel 9 as sevens of years'
    key: bdb
    url: 'https://biblehub.com/hebrew/7620.htm'
    quote: 'heptad or seven of years, late, Daniel 9:24,25,26,27'
  - where: 'note 9:24 “Seventy sevens”'
    claim: 'The word would more properly be translated sevens'
    key: ot-manual-28
