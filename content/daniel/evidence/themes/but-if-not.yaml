page: but-if-not
claims:
  - where: 'opening'
    claim: 'The book illustrates the blessings of the Lord upon the faithful'
    key: bd-daniel-book
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/daniel-book-of?lang=eng'
    quote: 'The book of Daniel teaches its readers the important duty of being true to the God of Israel at all cost and illustrates the blessings of the Lord upon the faithful.'
  - where: 'opening'
    claim: 'A testimony of mankind’s resurrection is given in Dan. 12'
    key: bd-daniel-book
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/daniel-book-of?lang=eng'
    quote: 'A testimony of mankind''s resurrection is given in Dan. 12.'
  - where: 'section ““He will deliver us… But if not””'
    claim: 'The three said God could save them but even if He chose not to they would not bow to the king’s gods'
    key: scripture-helps-dan
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/44-daniel-1-7?lang=eng'
    quote: 'Shadrach, Meshach, and Abed-nego boldly stated that they knew God could save them from the punishment of death, but even if He chose not to, they still would not bow down to the king''s gods.'
  - where: 'section ““He will deliver us… But if not””'
    claim: 'Elder Simmons calls the “But if not” sentence a statement of true faith'
    key: simmons-but-if-not
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2004/04/but-if-not?lang=eng'
    quote: 'That is a statement of true faith.'
  - where: 'section “The furnace and the den”'
    claim: 'The Aramaic verb shezib (H7804) occurs nine times in seven verses: 3:15, 17, 28; 6:14, 16, 20, 27 (hebrew.mjs daniel --word 7804)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'יְשֵֽׁיזְבִנְ/כ֖וֹן'
  - where: 'section “The furnace and the den”'
    claim: 'shezib also occurs in 6:27 (twice)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'מְשֵׁיזִ֣ב'
  - where: 'section “The furnace and the den”'
    claim: 'A second Aramaic verb (H5338) rendered “deliver” stands in 3:29'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'לְ/הַצָּלָ֖ה'
  - where: 'section “The furnace and the den”'
    claim: 'The second Aramaic verb (H5338) stands in 6:14'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'לְ/הַצָּלוּתֵֽ/הּ'
  - where: 'section “The furnace and the den”'
    claim: 'The second Aramaic verb (H5338) stands in 6:27'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'וּ/מַצִּ֗ל'
  - where: 'section “Those who fall”'
    claim: 'Connection made by this page: the “flame” by which the faithful fall (11:33) is set beside the furnace of chapter 3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/11?lang=eng'
    quote: 'yet they shall fall by the sword, and by flame, by captivity, and by spoil, many days.'
  - where: 'section “Those who fall”'
    claim: 'Connection made by this page: “the flame of the fire” of the furnace (3:22) is set beside the flame of 11:33'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/3?lang=eng'
    quote: 'the flame of the fire slew those men that took up Shadrach, Meshach, and Abed-nego.'
  - where: 'section “Those who fall”'
    claim: 'Some of the faithful fall but are “holpen with a little help” (11:34)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/11?lang=eng'
    quote: 'Now when they shall fall, they shall be holpen with a little help'
  - where: 'section “Those who fall”'
    claim: 'Chapter 3 is Aramaic (shevivah, “flame,” 3:22, H7631) and 11:33 Hebrew (lehavah, “flame,” H3852)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'וּ/בְ/לֶהָבָ֛ה'
  - where: 'section “Those who fall”'
    claim: 'The Aramaic “flame” of 3:22 is a different word (H7631)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'שְׁבִיבָ֖/א'
  - where: 'section “Delivered, and the dead awake”'
    claim: 'The Hebrew verb in 12:1 is malat (H4422), not the Aramaic shezib of chapters 3 and 6'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'יִמָּלֵ֣ט'
  - where: 'section “Delivered, and the dead awake”'
    claim: 'Daniel is told he will rest and stand in his lot (12:13)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/12?lang=eng'
    quote: 'thou shalt rest, and stand in thy lot at the end of the days.'
  - where: 'section “Delivered, and the dead awake”'
    claim: 'Connection made by this page: the deliverance of 12:1–2 is set beside the “but if not” of 3:18 and the fall of 11:33–35; the sequence begins with rescue and ends with a promise of deliverance and, in the next verse, of the dead awaking'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/12?lang=eng'
    quote: 'at that time thy people shall be delivered, every one that shall be found written in the book.'
  - where: 'section “Through Jesus Christ”'
    claim: 'Heb. 11:33–34 lists faith that stopped the mouths of lions and quenched fire'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/11?lang=eng'
    quote: 'Quenched the violence of fire, escaped the edge of the sword, out of weakness were made strong'
  - where: 'section “Through Jesus Christ”'
    claim: 'The Church footnote at Heb. 11:33 “lions” gives Dan. 6:22 and at 11:34 “fire” gives Dan. 3:27'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/11?lang=eng'
    quote: 'Dan. 6:22'
  - where: 'section “Through Jesus Christ”'
    claim: 'The Church footnote at Heb. 11:34 “fire” gives Dan. 3:27'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/11?lang=eng'
    quote: '“fire”: Dan. 3:27.'
  - where: 'section “Through Jesus Christ”'
    claim: 'The Church footnote at Heb. 11:35 gives the Joseph Smith Translation “the first resurrection”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/11?lang=eng'
    quote: 'JST Heb. 11:35 … the first resurrection;'
  - where: 'section “Through Jesus Christ”'
    claim: 'Heb. 11:35 reads “others were tortured, not accepting deliverance; that they might obtain a better resurrection”; the Church footnote gives the JST “the first resurrection”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/11?lang=eng'
    quote: 'Women received their dead raised to life again: and others were tortured, not accepting deliverance; that they might obtain a better resurrection:'
  - where: 'section “Through Jesus Christ”'
    claim: 'Elder Simmons: besides the glorious outcomes there were always the but if nots'
    key: simmons-but-if-not
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2004/04/but-if-not?lang=eng'
    quote: 'But in the midst of all those glorious outcomes hoped for and expected by the participants, there were always the but if nots:'
  - where: 'section “Through Jesus Christ”'
    claim: 'Elder Simmons closes that we will in His time and in His way be delivered'
    key: simmons-but-if-not
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2004/04/but-if-not?lang=eng'
    quote: 'we will have faith in the Lord Jesus Christ, knowing that if we do all we can do, we will, in His time and in His way, be delivered and receive all that He has.'
  - where: 'section “Through Jesus Christ”'
    claim: 'Elder Wickman speaks to bereaved parents'
    key: wickman-but-if-not
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2002/10/but-if-not?lang=eng'
    quote: 'in particular to those bereaved, burdened, and grieving parents who beseechingly ask, “Why?”'
  - where: 'section “Through Jesus Christ”'
    claim: 'Elder Wickman says faith is a confidence in the Lord'
    key: wickman-but-if-not
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2002/10/but-if-not?lang=eng'
    quote: 'Faith is, quite simply, a confidence in the Lord.'
  - where: 'section “Through Jesus Christ”'
    claim: 'The Church footnote at Dan. 12:2 gives John 5:28 (28–29) and Morm. 9:13; Morm. 9:13 says the death of Christ brings to pass the resurrection'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/morm/9?lang=eng'
    quote: 'the death of Christ bringeth to pass the resurrection, which bringeth to pass a redemption from an endless sleep'
  - where: 'section “Through Jesus Christ”'
    claim: 'The Church footnote 2a at Dan. 12:2 joins it to John 5:28 (28–29), Morm. 9:13 and D&C 43:18'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/12?lang=eng'
    quote: 'John 5:28 (28–29); Morm. 9:13 (13–14); D&C 43:18.'
