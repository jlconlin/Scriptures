page: secrets-revealed
claims:
  - where: opening
    claim: 'The Hebrew verb bin (H995) occurs 22 times in 19 verses, including 1:4, 1:17, 8:16, 8:27, 12:8, 12:10; 1:17 “understanding” and 12:8 “understood” are the same verb'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'הֵבִ֔ין'
  - where: opening
    claim: 'Same verb at 12:8'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'אָבִ֑ין'
  - where: opening
    claim: 'In Daniel 7 the dream is Daniel’s own; earlier kings dreamed and Daniel interpreted'
    key: ludlow-son-of-man
    url: 'https://rsc.byu.edu/vol-24-no-1-2023/one-like-son-man-came-clouds-heaven'
    quote: 'Unlike earlier chapters in Daniel where kings received the dreams and then Daniel interpreted them, Daniel 7 recounts the prophet’s own dream.'
  - where: opening
    claim: 'Connection made by this page: the book of Daniel’s own words set in order, “revealeth secrets” in the first half, “make this man to understand” in the middle, “I understood not” at the end'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/12?lang=eng'
    quote: 'I heard, but I understood not'
  - where: 'section “There is a God in heaven that revealeth secrets”'
    claim: 'The Church’s footnote at 1:17 “understanding”, and at 2:30 “wisdom”, point to Gen. 41:15 and Gen. 41:16'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/2?lang=eng'
    quote: 'Gen. 41:16'
  - where: 'section “There is a God in heaven that revealeth secrets”'
    claim: 'Joseph says to Pharaoh, “It is not in me”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/41?lang=eng'
    quote: 'It is not in me: God shall give Pharaoh an answer of peace.'
  - where: 'section “There is a God in heaven that revealeth secrets”'
    claim: 'Daniel, like Joseph, is careful to point out that the wisdom is God’s'
    key: bd-daniel-book
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/daniel-book-of?lang=eng'
    quote: 'Daniel, like Joseph, is given ability to interpret dreams and to reveal the future. Also, like Joseph, he is careful to point out that he is not able to do this by his own wisdom but because of the wisdom given him by the God of heaven'
  - where: 'section “The interpreter at court”'
    claim: 'Connection made by this page: the king and the queen name Daniel’s gift in the same terms (spirit of the gods, no secret troubleth, understanding)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/5?lang=eng'
    quote: 'an excellent spirit, and knowledge, and understanding, interpreting of dreams, and shewing of hard sentences, and dissolving of doubts, were found in the same Daniel'
  - where: 'section “Made to understand”'
    claim: 'In Daniel 7 the dream is Daniel’s own; earlier kings dreamed; one who stood by, presumably an angel, interprets'
    key: ludlow-son-of-man
    url: 'https://rsc.byu.edu/vol-24-no-1-2023/one-like-son-man-came-clouds-heaven'
    quote: 'Unlike earlier chapters in Daniel where kings received the dreams and then Daniel interpreted them, Daniel 7 recounts the prophet’s own dream.'
  - where: 'section “Made to understand”'
    claim: 'The one who “stood by” (7:16) is “presumably an angel”'
    key: ludlow-son-of-man
    url: 'https://rsc.byu.edu/vol-24-no-1-2023/one-like-son-man-came-clouds-heaven'
    quote: 'In Daniel 7 there is also one who “stood by” (v. 16), presumably an angel'
  - where: 'section “Made to understand”'
    claim: 'Daniel was guided by angelic messengers; John’s vision was sent and signified by God through his angel (Rev. 1:1)'
    key: sc-knowhy-492
    url: 'https://scripturecentral.org/knowhy/why-were-lehi-and-nephi-guided-by-angelic-escorts-in-their-visions'
    quote: 'Daniel, who was guided through his visions by angelic messengers (Daniel 8:15–16; 9:20–22; 10:10–14). In the book of Revelation, John the Revelator was shown a vision which was “sent and signified” by God through “his angel” (Revelation 1:1)'
  - where: 'section “Seal the book”'
    claim: 'The interpretation of the time periods in 12:7–13 has not been revealed'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'The interpretation of the time periods mentioned in these verses has not been revealed by the Lord as yet.'
  - where: 'section “Seal the book”'
    claim: 'Much of the visions’ meaning was not revealed even to Daniel'
    key: ot-seminary-daniel
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-resource-manual/the-book-of-daniel/daniel-1-12?lang=eng'
    quote: 'much of their meaning was not revealed even to Daniel (see Daniel 12:4, 8–9)'
  - where: 'section “Seal the book”'
    claim: 'The apocalyptic portion has been sealed and no prophet of the Restoration has opened it'
    key: draper-exile
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/prophets-exile'
    quote: 'Because the apocalyptic portion has been sealed (see Daniel 12:4, 9) and no prophet of the Restoration has opened it, much that is there remains a mystery.'
  - where: 'section “Seal the book”'
    claim: 'Joseph Smith joins Daniel’s vision of the Son of Man to “the wise shall understand”'
    key: tpjs-2007-ch-21
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-21?lang=eng'
    quote: 'It is for us to be righteous, that we may be wise and understand; for none of the wicked shall understand; but the wise shall understand'
  - where: 'section “Seal the book”'
    claim: 'Daniel 12:4, 9 listed among other sealed books to come forth in the last days'
    key: tvedtnes-sealed-books
    url: 'https://scripturecentral.org/archive/books/book-chapter/sealed-books'
    quote: 'The scriptures speak of other sealed books to come forth in the last days. One of these comes from Daniel.'
  - where: 'section “Seal the book”'
    claim: 'The sealed portion of John’s revelation was things he saw but did not write (Rev. 10:4; 1 Ne. 14:25–26)'
    key: tvedtnes-sealed-books
    url: 'https://scripturecentral.org/archive/books/book-chapter/sealed-books'
    quote: 'Apparently, the sealed portion of John’s revelation consisted of things he saw but did not write'
  - where: 'section “Seal the book”'
    claim: 'Church footnote at Dan. 12:9 “sealed” lists 1 Ne. 14:26, 2 Ne. 27:10, Ether 4:5, D&C 35:18, JS—H 1:65'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/12?lang=eng'
    quote: '1 Ne. 14:26'
  - where: 'section “A different sealed book, opened by the Lamb”'
    claim: 'Connection made by this page: Daniel is told to seal his words (Dan. 12:4); in John’s vision a different sealed book can be opened only by the Lamb (Rev. 5:1–5)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/12?lang=eng'
    quote: 'shut up the words, and seal the book, even to the time of the end'
  - where: 'section “A different sealed book, opened by the Lamb”'
    claim: 'Connection made by this page (Rev. 5 side): the sealed book can be opened only by the Lamb'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/5?lang=eng'
    quote: 'Who is worthy to open the book, and to loose the seals thereof?'
  - where: 'section “A different sealed book, opened by the Lamb”'
    claim: 'The book John saw contains the revealed will, mysteries and works of God concerning this earth during the seven thousand years'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/77?lang=eng'
    quote: 'it contains the revealed will, mysteries, and the works of God; the hidden things of his economy concerning this earth during the seven thousand years'
  - where: 'section “A different sealed book, opened by the Lamb”'
    claim: 'Christ is the only person worthy to open and read the sealed book'
    key: nt-manual-54
    url: 'https://www.churchofjesuschrist.org/study/manual/new-testament-student-manual/revelation/chapter-54-revelation-4-11?lang=eng'
    quote: 'Jesus Christ’s role as the only person worthy to open and read the sealed book highlights His authority as the executor of God’s plan of salvation.'
