page: secrets-revealed
claims:
  # ---------- opening ----------
  - where: 'opening'
    claim: 'The participle of the Aramaic verb “reveal” (gālēʾ, H1541), “he that revealeth / a revealer,” is God’s every time (2:22, 28, 29, 47a); the verb occurs seven times in six verses, all in chapter 2; Daniel is the one to whom the secret “was revealed” (2:19, 30) and the one of whom the king says “thou couldest reveal” (2:47b, infinitive); no verse calls Daniel a revealer of secrets'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'וְ/גָלֵ֣ה'
  - where: 'opening'
    claim: 'Dan. 2:28 “that revealeth secrets,” gālēʾ rāzîn'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'גָּלֵ֣א'
  - where: 'opening'
    claim: 'The Bible Dictionary: Daniel, like Joseph, is careful to point out that he is not able to do this by his own wisdom but because of the wisdom given him by the God of heaven'
    key: bd-daniel-book
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/daniel-book-of?lang=eng'
    quote: 'he is careful to point out that he is not able to do this by his own wisdom but because of the wisdom given him by the God of heaven'
  - where: 'opening'
    claim: '“The wise” in 12:10 (and 12:3) is hammaśkîlîm, the Hiphil participle of śākal (H7919), the word of 1:4 “skilful” (maśkîlîm) and 1:17 “skill” (haśkēl)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'וְ/הַ/מַּשְׂכִּלִ֖ים'
  - where: 'opening'
    claim: 'Dan. 1:4 “skilful,” maśkîlîm'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'וּ/מַשְׂכִּילִ֣ים'
  - where: 'opening'
    claim: 'The New Testament Student Manual: the Joseph Smith Translation of Rev. 1:1 clarifies that the book was a revelation given to John by the Savior'
    key: nt-manual-53
    url: 'https://www.churchofjesuschrist.org/study/manual/new-testament-student-manual/revelation/chapter-53-revelation-1-3?lang=eng'
    quote: 'The Joseph Smith Translation changes Revelation 1:1 to clarify that the book was indeed a revelation given to John by the Savior, Jesus Christ: “The Revelation of John, a servant of God, which was given unto him of Jesus Christ”'
  - where: 'opening'
    claim: 'Connection made by this page: the revealer of secrets in Daniel is always God, never Daniel; the book moves Daniel from the one who makes known to the one made to understand to the one who does not understand how long the end will be (12:6–8; Keil on 10:1) and seals; the understanding is promised till the time of the end to “the wise,” the word used of Daniel’s company in chapter 1; the pattern (secrets God’s to reveal, books God’s to open) is John’s too, in the Revelation of Jesus Christ and the Lamb who opens the sealed book; Daniel’s book is not that scroll (D&C 77:6), and the comparison across the two books is the page’s own'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/2?lang=eng'
    quote: 'But there is a God in heaven that revealeth secrets, and maketh known to the king Nebuchadnezzar what shall be in the latter days.'

  # ---------- He that revealeth secrets maketh known ----------
  - where: 'section “He that revealeth secrets maketh known”'
    claim: 'rāz (H7328) occurs nine times in Daniel (eight in chapter 2, once at 4:9); gālēʾ (H1541) six times, all in chapter 2'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'רָזִ֑ין'
  - where: 'section “He that revealeth secrets maketh known”'
    claim: 'Dan. 4:9 “secret,” rāz'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'רָ֖ז'
  - where: 'section “He that revealeth secrets maketh known”'
    claim: '“Make known” is the Aramaic Haphel of yĕdaʿ (H3046): demanded by the kings of the wise men who fail (2:5, 9; 4:6–7, 18; 5:8, 15–16), asked of Daniel (2:26) and performed by him (5:17), said of God (2:23, 28, 29, 45) and of the one who stood by in 7:16 (“made me know”); 2:30 yĕhôdĕʿûn is an impersonal plural'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'וְ/הוֹדַ֗ע'
  - where: 'section “He that revealeth secrets maketh known”'
    claim: 'Dan. 2:30 “that they might make known,” yĕhôdĕʿûn, an impersonal third-person plural'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'יְהוֹדְע֔וּן'
  - where: 'section “He that revealeth secrets maketh known”'
    claim: 'Connection made by this page: the text keeps two verbs apart, God reveals (gālēʾ) and Daniel makes known (hôdaʿ) what God revealed, the verb the kings demand of every wise man and only Daniel performs; Daniel disclaims his own wisdom before Nebuchadnezzar (2:27–30); no source read makes the observation'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/5?lang=eng'
    quote: 'yet I will read the writing unto the king, and make known to him the interpretation.'
  - where: 'section “He that revealeth secrets maketh known”'
    claim: 'The Student Manual on 2:26–30: Daniel made it clear that it was not he who determined the dream and its interpretation; he did not take credit for what the Lord had done'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'Daniel made it clear that it was not he, nor any of the wise men or soothsayers, who was able to determine the nature of the dream and its interpretation.'
  - where: 'section “He that revealeth secrets maketh known”'
    claim: 'The Student Manual: Daniel did not take credit to himself for what the Lord had done'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'Daniel did not take credit to himself for what the Lord had done for his benefit.'
  - where: 'section “He that revealeth secrets maketh known”'
    claim: 'Draper: the Babylonian wise men’s gods were distant and impersonal, while Daniel’s shows that Jehovah, even in Babylon, was immediate and personal'
    key: draper-exile
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/prophets-exile'
    quote: 'the response of the Babylonian wise men underscores their belief that their own gods were distant and impersonal, while Daniel’s shows that Jehovah, even in Babylon, was immediate and personal.'
  - where: 'section “He that revealeth secrets maketh known”'
    claim: 'Draper: the king’s confession allows Jehovah a place among the Babylonian gods and the special place as revealer'
    key: draper-exile
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/prophets-exile'
    quote: 'We see in this admission the king allowing Jehovah a place among the pantheon of Babylonian gods and even according Him the special place as revealer.'

  # ---------- Made to understand ----------
  - where: 'section “Made to understand”'
    claim: 'Ludlow: unlike earlier chapters where kings received the dreams and Daniel interpreted them, Daniel 7 is the prophet’s own dream, interpreted by one who stood by, presumably an angel'
    key: ludlow-son-of-man
    url: 'https://rsc.byu.edu/vol-24-no-1-2023/one-like-son-man-came-clouds-heaven'
    quote: 'Unlike earlier chapters in Daniel where kings received the dreams and then Daniel interpreted them, Daniel 7 recounts the prophet’s own dream.'
  - where: 'section “Made to understand”'
    claim: 'Ludlow: one who “stood by” (v. 16), presumably an angel, gave Daniel the interpretation'
    key: ludlow-son-of-man
    url: 'https://rsc.byu.edu/vol-24-no-1-2023/one-like-son-man-came-clouds-heaven'
    quote: 'there is also one who “stood by” (v. 16), presumably an angel (Gabriel is mentioned by name in 8:15–16), who gave Daniel the interpretation of all that he had seen'
  - where: 'section “Made to understand”'
    claim: 'bîn (H995) in chapters 8–12: commanded of Daniel or brought to him at 8:16, 8:17, 9:22 (“he informed me,” wayyāben), 9:23, 10:11, 10:14; Daniel’s own at 8:5, 9:2, 10:1, 10:12, 12:8; 1:17 “understanding” is the same root (Hiphil perfect); 12:8 “I understood not” is the Qal; 9:22’s “skill” is śākal (H7919) and “understanding” the noun bînâ (H998)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'לַ/הֲבִ֣ינְ/ךָ֔'
  - where: 'section “Made to understand”'
    claim: 'Dan. 8:16 “make this man to understand,” hāben'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'הָבֵ֥ן'
  - where: 'section “Made to understand”'
    claim: 'Dan. 10:1 “he understood the thing,” ûbîn, Qal, Daniel the subject'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'וּ/בִין֙'
  - where: 'section “Made to understand”'
    claim: 'The Bible Dictionary: Daniel is the earliest example of apocalyptic literature currently in the Bible'
    key: bd-daniel-book
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/daniel-book-of?lang=eng'
    quote: 'The book of Daniel, the earliest example of apocalyptic literature currently in the Bible'
  - where: 'section “Made to understand”'
    claim: 'Dan. 1:17 “had understanding,” hēbîn'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'הֵבִ֔ין'
  - where: 'section “Made to understand”'
    claim: 'Halverson, quoting the standard definition of apocalyptic: the constant element is an angel who interprets the vision; the revelation is not intelligible without supernatural aid'
    key: halverson-apocalyptic
    url: 'https://rsc.byu.edu/things-which-my-father-saw/lehis-dream-nephis-vision-apocalyptic-literature'
    quote: 'Scholars have further clarified that in apocalyptic literature these “transcendent realities” are revealed by means of “visions and otherworldly journeys, supplemented by discourse or dialogue and occasionally by a heavenly book. The constant element is the presence of an angel who interprets the vision or serves as guide on the otherworldly journey. This figure indicates that the revelation is not intelligible without supernatural aid.'
  - where: 'section “Made to understand”'
    claim: 'KnoWhy #492: Daniel was guided through his visions by angelic messengers; John’s vision was sent and signified by God through his angel'
    key: sc-knowhy-492
    url: 'https://scripturecentral.org/knowhy/why-were-lehi-and-nephi-guided-by-angelic-escorts-in-their-visions'
    quote: 'Daniel, who was guided through his visions by angelic messengers (Daniel 8:15–16; 9:20–22; 10:10–14). In the book of Revelation, John the Revelator was shown a vision which was “sent and signified” by God through “his angel” (Revelation 1:1)'

  # ---------- I heard, but I understood not ----------
  - where: 'section “I heard, but I understood not”'
    claim: 'Keil on 10:1: the non-understanding in 12:8 regards a single point, the duration of the affliction'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/10.htm'
    quote: 'the non-understanding in Daniel 12:8 regards a single point, namely, the duration of the affliction'
  - where: 'section “I heard, but I understood not”'
    claim: 'The Student Manual: what has not been revealed is the interpretation of the time periods'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'The interpretation of the time periods mentioned in these verses has not been revealed by the Lord as yet.'
  - where: 'section “I heard, but I understood not”'
    claim: 'Keil on 12:10: the angel calms Daniel: though he does not understand, the prophecy shall be preserved and shall be a blessing to the people of God'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/12.htm'
    quote: 'Calm thyself, Daniel, if thou dost not understand these words. The prophecy shall be preserved for all times to the end of the days.'
  - where: 'section “I heard, but I understood not”'
    claim: 'Keil: though thou thyself understandest it not, yet it shall be a source of great blessing to the people of God'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/12.htm'
    quote: 'though thou thyself understandest it not, yet it shall be a source of great blessing to the people of God'
  - where: 'section “I heard, but I understood not”'
    claim: 'Keil: the “understand” of 12:10 stands in such distinct relation to the “I understood not” of 12:8 that both must be taken in the same sense'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/12.htm'
    quote: 'stand in such distinct relation to the אבין לא (I understood not), Daniel 12:8, that they must be taken in the same sense in both places'
  - where: 'section “I heard, but I understood not”'
    claim: 'Keil on 12:9: the sealing means the book is preserved in security so that it might be read at all times down to the time of the end'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/12.htm'
    quote: 'the book should be preserved in security against any defacement of its contents, so that it might be capable of being read at all times down to the time of the end'
  - where: 'section “I heard, but I understood not”'
    claim: 'The Student Manual: the interpretation of the time periods has not been revealed by the Lord as yet'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'The interpretation of the time periods mentioned in these verses has not been revealed by the Lord as yet.'
  - where: 'section “I heard, but I understood not”'
    claim: 'The Student Manual: for reasons not at present known, the Lord has not revealed the key for interpreting this passage; speculation and calculation are pointless'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'For reasons not at present known, the Lord has not revealed the key for interpreting this passage, and, until He does so, speculation and calculation are pointless.'
  - where: 'section “I heard, but I understood not”'
    claim: 'The seminary manual: much of the visions’ meaning was not revealed even to Daniel'
    key: ot-seminary-daniel
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-resource-manual/the-book-of-daniel/daniel-1-12?lang=eng'
    quote: 'much of their meaning was not revealed even to Daniel (see Daniel 12:4, 8–9)'
  - where: 'section “I heard, but I understood not”'
    claim: '“The wise” in 12:3 and 12:10 and “they that understand” in 11:33 are maśkîlîm (H7919), the participle used of Daniel and his companions in 1:4 (“skilful”); the verb (infinitive) is what God gave in 1:17 (“skill”) and what Gabriel brings in 9:22 (“to give thee skill,” lĕhaśkîlĕkā)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'וְ/הַ֨/מַּשְׂכִּלִ֔ים'
  - where: 'section “I heard, but I understood not”'
    claim: 'Dan. 9:22 “to give thee skill,” lĕhaśkîlĕkā'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'לְ/הַשְׂכִּילְ/ךָ֥'
  - where: 'section “I heard, but I understood not”'
    claim: 'Dan. 1:17 “skill,” haśkēl'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'וְ/הַשְׂכֵּ֖ל'
  - where: 'section “I heard, but I understood not”'
    claim: 'Connection made by this page: the word that described Daniel’s company at the start (1:4) names those to whom understanding is promised at the end (12:10); what was closed to Daniel is closed “till the time of the end,” and 12:13 promises him his place in it; no source read draws the connection'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/1?lang=eng'
    quote: 'skilful in all wisdom, and cunning in knowledge, and understanding science'

  # ---------- The condition ----------
  - where: 'section “The condition”'
    claim: 'Joseph Smith (Times and Seasons, 15 July 1842, in Teachings ch. 21): it is for us to be righteous, that we may be wise and understand; for none of the wicked shall understand; but the wise shall understand'
    key: tpjs-2007-ch-21
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-21?lang=eng'
    quote: 'It is for us to be righteous, that we may be wise and understand; for none of the wicked shall understand; but the wise shall understand'
  - where: 'section “The condition”'
    claim: 'The Church’s footnote at Dan. 12:10 “understand” points to Matt. 13:10 (10–13) and John 8:47'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/12?lang=eng'
    quote: 'Matt. 13:10 (10–13); John 8:47.'
  - where: 'section “The condition”'
    claim: 'The Church’s footnote at Dan. 1:17 “knowledge” points to Dan. 2:20 (20–22); Jacob 4:8; Alma 12:9 (9–11); D&C 89:19'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/1?lang=eng'
    quote: 'Dan. 2:20 (20–22); Jacob 4:8; Alma 12:9 (9–11); D&C 89:19.'
  - where: 'section “The condition”'
    claim: 'The New Testament Student Manual on Matt. 13:12: even an all-powerful God cannot give to someone who will not receive'
    key: nt-student-manual-5
    url: 'https://www.churchofjesuschrist.org/study/manual/new-testament-student-manual/introduction-to-matthew/chapter-5?lang=eng'
    quote: 'Even an all-powerful God cannot give to someone who will not receive.'
  - where: 'section “The condition”'
    claim: 'The Bible Dictionary “Mystery”: in the New Testament, a spiritual truth that was once hidden but now is revealed'
    key: bd-mystery
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/mystery?lang=eng'
    quote: 'Denotes in the New Testament a spiritual truth that was once hidden but now is revealed and that without special revelation would have remained unknown.'
  - where: 'section “The condition”'
    claim: 'The Bible Dictionary: there is no spiritual gain in idle speculation about things the Lord has not revealed'
    key: bd-mystery
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/mystery?lang=eng'
    quote: 'there is no spiritual gain in idle speculation about things the Lord has not revealed.'
  - where: 'section “The condition”'
    claim: 'The Church’s footnote at Dan. 2:28 “secrets” points to Gen. 40:8 and D&C 76:10'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/2?lang=eng'
    quote: 'Gen. 40:8; D&C 76:10.'
  - where: 'section “The condition”'
    claim: 'Connection made by this page: D&C 76:7, 10 use Daniel’s verbs, reveal and make known, and the speaker is the same Lord'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/76?lang=eng'
    quote: 'For by my Spirit will I enlighten them, and by my power will I make known unto them the secrets of my will'

  # ---------- The Revelation of Jesus Christ ----------
  - where: 'section “The Revelation of Jesus Christ”'
    claim: 'Draper calls the God of Daniel 2:21–22 Jehovah; no Church source read glosses 2:28 itself as the premortal Christ'
    key: draper-exile
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/prophets-exile'
    quote: 'Daniel’s shows that Jehovah, even in Babylon, was immediate and personal.'
  - where: 'section “The Revelation of Jesus Christ”'
    claim: 'The Bible Dictionary: Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ'
  - where: 'section “The Revelation of Jesus Christ”'
    claim: 'The Bible Dictionary: the book of Daniel corresponds in the Old Testament to the Revelation of John in the New Testament'
    key: bd-daniel-book
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/daniel-book-of?lang=eng'
    quote: 'corresponds in the Old Testament to the Revelation of John in the New Testament'
  - where: 'section “The Revelation of Jesus Christ”'
    claim: 'The New Testament Student Manual: Revelation is both an unveiling of the Lord Jesus Christ and an uncovering of His authority and power'
    key: nt-manual-53
    url: 'https://www.churchofjesuschrist.org/study/manual/new-testament-student-manual/revelation/chapter-53-revelation-1-3?lang=eng'
    quote: 'this book is both an unveiling of the Lord Jesus Christ and an uncovering of Jesus Christ’s authority and power and His role in the Father’s plan of salvation.'
  - where: 'section “The Revelation of Jesus Christ”'
    claim: 'Ellicott on Rev. 1:1, quoting Grotius: John is the writer, but Jesus Christ is the author'
    key: ellicott-revelation
    url: 'https://biblehub.com/commentaries/ellicott/revelation/1.htm'
    quote: '“John is the writer, but Jesus Christ is the author,” says Grotius'
  - where: 'section “The Revelation of Jesus Christ”'
    claim: 'The Church’s footnote at Rev. 5:1 “sealed” points only to D&C 77:6, and D&C 77:6 only to Rev. 5:1; Dan. 12:9 “sealed” points to 1 Ne. 14:26; 2 Ne. 27:10; Ether 4:5; D&C 35:18; JS—H 1:65'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/12?lang=eng'
    quote: '1 Ne. 14:26; 2 Ne. 27:10; Ether 4:5 (4–7); D&C 35:18; JS—H 1:65.'
  - where: 'section “The Revelation of Jesus Christ”'
    claim: 'Tvedtnes lists Daniel among other sealed books to come forth in the last days, naming 12:4, 12:9 and 9:24, and gives John’s seven-sealed book a paragraph of its own without joining the two'
    key: tvedtnes-sealed-books
    url: 'https://scripturecentral.org/archive/books/book-chapter/sealed-books'
    quote: 'The scriptures speak of other sealed books to come forth in the last days. One of these comes from Daniel.'
  - where: 'section “The Revelation of Jesus Christ”'
    claim: 'Tvedtnes counts 9:24 “to seal up the vision and the prophecy” among Daniel’s sealed words'
    key: tvedtnes-sealed-books
    url: 'https://scripturecentral.org/archive/books/book-chapter/sealed-books'
    quote: 'The angel further spoke of the time “to seal up the vision and the prophecy” (Daniel 9:24).'
  - where: 'section “The Revelation of Jesus Christ”'
    claim: 'Tvedtnes on Rev. 5: a heavenly book that only Christ, the Lamb, was worthy to loose'
    key: tvedtnes-sealed-books
    url: 'https://scripturecentral.org/archive/books/book-chapter/sealed-books'
    quote: 'that only Christ, the Lamb, was worthy to loose'
  - where: 'section “The Revelation of Jesus Christ”'
    claim: 'The New Testament Student Manual: Jesus Christ’s role as the only person worthy to open and read the sealed book highlights His authority as the executor of God’s plan'
    key: nt-manual-54
    url: 'https://www.churchofjesuschrist.org/study/manual/new-testament-student-manual/revelation/chapter-54-revelation-4-11?lang=eng'
    quote: 'Jesus Christ’s role as the only person worthy to open and read the sealed book highlights His authority as the executor of God’s plan of salvation.'
  - where: 'section “The Revelation of Jesus Christ”'
    claim: 'Ellicott on Rev. 5:2: not lack of intellectual capacity but the taint of moral unworthiness hindered the reading; His worthiness has been established in conflict and temptation'
    key: ellicott-revelation
    url: 'https://biblehub.com/commentaries/ellicott/revelation/5.htm'
    quote: 'It was not lack of intellectual capacity so much as the taint of moral unworthiness which hindered the reading of the book.'
  - where: 'section “The Revelation of Jesus Christ”'
    claim: 'Ellicott: His worthiness has been established in conflict and temptation'
    key: ellicott-revelation
