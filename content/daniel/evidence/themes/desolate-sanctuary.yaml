page: desolate-sanctuary
claims:
  - where: 'section “The sanctuary cast down”'
    claim: 'The little horn has generally been interpreted to represent Antiochus IV'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'has generally been interpreted to represent Antiochus IV (Epiphanes)'
  - where: 'section “The sanctuary cast down”'
    claim: 'Antiochus Epiphanes polluted the temple; it was left desolate for three years; Judas Maccabaeus restored it to use'
    key: bd-temple-of-zerubbabel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/temple-of-zerubbabel?lang=eng'
    quote: 'It was left desolate for three years. Judas Maccabaeus (165 B.C.) cleansed it and restored it to use.'
  - where: 'section “The sanctuary cast down”'
    claim: 'Connection made by this page: the vessels of chapter 1 (and 5) set in one line with the sanctuary of chapter 8 as what befalls the house of God (chapter 1 side)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/1?lang=eng'
    quote: 'with part of the vessels of the house of God'
  - where: 'section “The sanctuary cast down”'
    claim: 'Connection made by this page: the vessels of chapters 1 and 5 set in one line with the sanctuary of chapter 8 (chapter 8 side; the sanctuary passages speak of the daily sacrifice and the sanctuary)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/8?lang=eng'
    quote: 'by him the daily sacrifice was taken away, and the place of his sanctuary was cast down'
  - where: 'section “The sanctuary cast down”'
    claim: '“Sanctuary” is miqdash at 8:11'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'מִקְדָּשֽׁ/וֹ'
  - where: 'section “The sanctuary cast down”'
    claim: '“Sanctuary” is qodesh at 8:14'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'קֹֽדֶשׁ'
  - where: 'section “The sanctuary cast down”'
    claim: '“Sanctuary” is qodesh at 8:13'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'וְ/קֹ֥דֶשׁ'
  - where: 'section “The sanctuary cast down”'
    claim: '“Sanctuary” is miqdash at 9:17'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'מִקְדָּשְׁ/ךָ'
  - where: 'section “The sanctuary cast down”'
    claim: '“Sanctuary” is qodesh at 9:26 (the city and the sanctuary)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'וְ/הַ/קֹּ֜דֶשׁ'
  - where: 'section “The sanctuary cast down”'
    claim: '“Sanctuary” is miqdash at 11:31'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'הַ/מִּקְדָּ֤שׁ'
  - where: "section “Daniel's prayer”"
    claim: 'The burning of the house of God, and the land lying desolate to fulfil seventy years'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/36?lang=eng'
    quote: 'And they burnt the house of God, and brake down the wall of Jerusalem'
  - where: "section “Daniel's prayer”"
    claim: 'Seventy years of the land lying desolate (2 Chr. 36:21)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/36?lang=eng'
    quote: 'for as long as she lay desolate she kept sabbath, to fulfil threescore and ten years'
  - where: "section “Daniel's prayer”"
    claim: 'The Church’s footnote at 9:2 joins Daniel’s seventy years to 2 Chronicles 36:21 and Jeremiah 25:12'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/9?lang=eng'
    quote: '“seventy”: 2 Chr. 36:21; Jer. 25:12.'
  - where: 'section “The answer”'
    claim: 'Connection made by this page: Daniel’s request (9:17) set beside Gabriel’s answer; the King James word “sanctuary” occurs once in the answer, at 9:26, where it is destroyed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/9?lang=eng'
    quote: 'the people of the prince that shall come shall destroy the city and the sanctuary'
  - where: 'section “The answer”'
    claim: 'The answer speaks of the street and wall built again (9:25)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/9?lang=eng'
    quote: 'the street shall be built again, and the wall, even in troublous times'
  - where: 'section “The answer”'
    claim: 'Connection made by this page: the request for the sanctuary (9:17) as the other side of the comparison'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/9?lang=eng'
    quote: 'cause thy face to shine upon thy sanctuary that is desolate'
  - where: 'section “The answer”'
    claim: 'Chapter heading: the Messiah will make reconciliation for iniquity'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/9?lang=eng'
    quote: 'Gabriel reveals the time of the coming of the Messiah, who will make reconciliation for iniquity'
  - where: 'section “The answer”'
    claim: 'Verse 24 is undoubtedly a reference to Christ and His Atonement; verse 26 only seems to be an allusion to the Crucifixion'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'Daniel 9:24 is undoubtedly a reference to the coming of Christ and His Atonement, by which forgiveness of sins and reconciliation to God through repentance would be made possible.'
  - where: 'section “The answer”'
    claim: 'Verse 26 “cut off” seems to be an allusion to the Crucifixion'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'Verse 26 makes reference to the Messiah being “cut off, but not for himself,” which seems to be an allusion to His Crucifixion.'
  - where: 'section ““Spoken of by Daniel the prophet””'
    claim: 'The Savior named the abomination of desolation as spoken of by Daniel the prophet'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/24?lang=eng'
    quote: 'the abomination of desolation, spoken of by Daniel the prophet, stand in the holy place'
  - where: 'section ““Spoken of by Daniel the prophet””'
    claim: 'JS—M 1:12 applies it to the destruction of Jerusalem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/js-m/1?lang=eng'
    quote: 'spoken of by Daniel the prophet, concerning the destruction of Jerusalem'
  - where: 'section ““Spoken of by Daniel the prophet””'
    claim: 'JS—M 1:32: the abomination of desolation shall be fulfilled again'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/js-m/1?lang=eng'
    quote: 'And again shall the abomination of desolation, spoken of by Daniel the prophet, be fulfilled.'
  - where: 'section ““Spoken of by Daniel the prophet””'
    claim: 'The Student Manual reads Daniel 8:11 as Antiochus IV taking away the daily sacrifice and casting down the sanctuary'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'Antiochus IV took away the daily sacrifice of the temple and cast down the place of the Lord’s sanctuary'
  - where: 'section ““Spoken of by Daniel the prophet””'
    claim: 'Daniel 11:31 is given as an example of things that seem to be dualistic (Antiochus; Rome A.D. 70)'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'Several things Daniel mentioned seem to be dualistic, having application to more than one period of time.'
  - where: 'section ““Spoken of by Daniel the prophet””'
    claim: 'The Roman siege of A.D. 70 as a fulfillment of Daniel’s words'
    key: bd-abomination-of-desolation
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/abomination-of-desolation?lang=eng'
    quote: 'The first was to be when the Roman legions under Titus, in A.D. 70, laid siege to Jerusalem'
  - where: 'section ““Spoken of by Daniel the prophet””'
    claim: 'The rest of Daniel 9 describes the destruction of Jerusalem and the temple and parallels Matt. 24:15 and JS—M 1:12'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'The rest of the chapter describes the destruction of Jerusalem and the temple and parallels very closely the message of Matthew 24:15'
