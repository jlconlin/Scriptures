page: kingdom-never-destroyed
claims:
  - where: 'section “What the kings say”'
    claim: 'The Church edition footnote on “destroyed” (6:26) points to Dan. 2:44'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/6?lang=eng'
    quote: 'Dan. 2:44.'
  - where: 'section “What the kings say”'
    claim: 'It is hard to know from the text whether Nebuchadnezzar moved from polytheism to monotheism'
    key: draper-exile
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/prophets-exile'
    quote: 'It is hard to know from the text if Nebuchadnezzar moved from polytheism to henotheism or monotheism.'
  - where: 'section “What the kings say”'
    claim: 'His praise does not necessarily mean repentance or conversion'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'It does not necessarily follow, however, that this experience caused his sincere repentance or conversion to the God of Daniel.'
  - where: 'section “Given to the Son of man”'
    claim: 'In the Aramaic, “dominion is an everlasting dominion” in 4:34 and 7:14 is the same two words (sholtan, alam)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'שָׁלְטָ֣ן'
  - where: 'section “Given to the Son of man”'
    claim: '“Shall not be destroyed” at 2:44, 6:26 and 7:14 is one verb, chabal (H2255)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'תִתְחַבַּ֔ל'
  - where: 'section “Given to the Son of man”'
    claim: 'Connection made by this page: the words the kings used of God’s kingdom (“dominion is an everlasting dominion,” 4:34; “shall not be destroyed,” 6:26) are the words used of what is given to the Son of man'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/7?lang=eng'
    quote: 'his dominion is an everlasting dominion, which shall not pass away, and his kingdom that which shall not be destroyed.'
  - where: 'section “Given to the Son of man”'
    claim: 'The Aramaic verb adah (H5709) is behind “removeth” (2:21), “departed” (4:31), “took” (5:20), “taken away” (7:12), “take away” (7:26) and “pass away” (7:14); its other three verses are 3:27 and 6:8, 12 (“altereth not”); count from occurrences.mjs daniel --hebrew 5709: nine verses'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'יֶעְדֵּ֔ה'
  - where: 'section “Given to the Son of man”'
    claim: 'Connection made by this page: the verb used when kings and beasts lose their rule (“removeth,” 2:21; “taken away,” 7:12) is the verb denied of the Son of man’s dominion (“shall not pass away,” 7:14)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/7?lang=eng'
    quote: 'they had their dominion taken away'
  - where: 'section “The Son of Man and the stone”'
    claim: 'The “Son of Man” is Jesus Christ'
    key: bd-daniel-book
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/daniel-book-of?lang=eng'
    quote: 'The “Son of Man” is Jesus Christ.'
  - where: 'section “The Son of Man and the stone”'
    claim: 'Latter-day revelation identifies the Ancient of Days as Adam'
    key: bd-daniel-book
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/daniel-book-of?lang=eng'
    quote: 'Latter-day revelation identifies the Ancient of Days as Adam (D&C 116)'
  - where: 'section “The Son of Man and the stone”'
    claim: 'Joseph Smith: Adam delivers up his stewardship to Christ'
    key: jsp-discourse-1839-a-richards
    url: 'https://www.josephsmithpapers.org/paper-summary/discourse-between-circa-26-june-and-circa-4-august-1839-a-as-reported-by-willard-richards/2'
    quote: 'Adam delivers up his stewardship to Christ'
  - where: 'section “The Son of Man and the stone”'
    claim: 'Jesus often signaled that He would fulfil Daniel’s prophecy by the title Son of Man'
    key: scripture-helps-dan
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/44-daniel-1-7?lang=eng'
    quote: 'Jesus referred to Himself as the Son of Man, often signaling to His listeners that He would be the fulfillment Daniel’s prophecy'
  - where: 'section “The Son of Man and the stone”'
    claim: 'D&C 65:2: the gospel rolls forth as the stone cut out of the mountain without hands'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/65?lang=eng'
    quote: 'The keys of the kingdom of God are committed unto man on the earth, and from thence shall the gospel roll forth unto the ends of the earth, as the stone which is cut out of the mountain without hands shall roll forth, until it has filled the whole earth.'
  - where: 'section “The Son of Man and the stone”'
    claim: 'D&C 138:44: Daniel foresaw the kingdom of God in the latter days'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/138?lang=eng'
    quote: 'Daniel, who foresaw and foretold the establishment of the kingdom of God in the latter days, never again to be destroyed nor given to other people;'
  - where: 'section “The Son of Man and the stone”'
    claim: 'President Kimball: the Church restored in 1830 is the kingdom set up by the God of heaven'
    key: kimball-stone
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1976/04/the-stone-cut-without-hands?lang=eng'
    quote: 'The Church of Jesus Christ of Latter-day Saints was restored in 1830 after numerous revelations from the divine source; and this is the kingdom, set up by the God of heaven, that would never be destroyed nor superseded'
  - where: 'section “The Son of Man and the stone”'
    claim: 'Elder Christofferson: the Church is the prophesied latter-day kingdom'
    key: christofferson-why-church
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2015/10/why-the-church?lang=eng'
    quote: 'The Church is that prophesied latter-day kingdom, not created by man but set up by the God of heaven'
  - where: 'section “The Son of Man and the stone”'
    claim: 'D&C 65:5–6: the kingdom go forth; the Son of Man comes to meet the kingdom set up on earth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/65?lang=eng'
    quote: 'Call upon the Lord, that his kingdom may go forth upon the earth, that the inhabitants thereof may receive it, and be prepared for the days to come, in the which the Son of Man shall come down in heaven, clothed in the brightness of his glory, to meet the kingdom of God which is set up on the earth.'
  - where: 'section “The Son of Man and the stone”'
    claim: 'D&C 65:6: may the kingdom of God go forth, that the kingdom of heaven may come'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/65?lang=eng'
    quote: 'Wherefore, may the kingdom of God go forth, that the kingdom of heaven may come'
