  # note 6:24
  - where: 'note 6:24 “The accusers’ families”'
    claim: 'Keil: condemning wives and children with the men was Persian custom, attested by Herodotus 3.119'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/6.htm'
    quote: 'The condemning to death of the wives and children along with the men was in accordance with Persian custom, as is testified by Herodotus, iii. 119'
  - where: 'note 6:24 “The accusers’ families”'
    claim: 'Keil: the accusers are not said to be all the satraps; the text states no number'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/6.htm'
    quote: 'for the text states no number'
  - where: 'note 6:24 “The accusers’ families”'
    claim: 'Herodotus: the Persian king Darius seized Intaphrenes with his sons and household on suspicion of rebellion'
    key: herodotus-histories-3-119
    url: 'https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0126%3Abook%3D3%3Achapter%3D119'
    quote: 'he seized Intaphrenes with his sons and all his household—for he strongly suspected that the man was plotting a rebellion with his kinsmen'
  - where: 'note 6:24 “The accusers’ families”'
    claim: 'Herodotus: he released two at the wife’s plea and put the rest to death'
    key: herodotus-histories-3-119
    url: 'https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0126%3Abook%3D3%3Achapter%3D119'
    quote: 'he released the one for whom she had asked, and the eldest of her sons as well; he put to death all the rest'
  - where: 'note 6:24 “The accusers’ families”'
    claim: 'The Student Manual suggests a probable motive: insurrection might come from such families'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'To an absolute monarch, however, it probably seemed the logical thing to do, for out of these families might come insurrection in the future.'
  - where: 'note 6:24 “The accusers’ families”'
    claim: 'The manual: “or ever” means before'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'The term or ever, as used in Daniel 6:24, means “before.”'
  - where: 'note 6:24 “The accusers’ families”'
    claim: 'The law of Moses forbade putting children to death for their fathers'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/24?lang=eng'
    quote: 'The fathers shall not be put to death for the children, neither shall the children be put to death for the fathers: every man shall be put to death for his own sin.'
  - where: 'note 6:24 “The accusers’ families”'
    claim: 'A modern translation: the lions overpowered them'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Daniel%206&version=NRSVUE'
    quote: 'the lions overpowered them and broke all their bones in pieces'

  # note 6:26
  - where: 'note 6:26 “The king’s second decree”'
    claim: 'Daniel 2:44: a kingdom which shall never be destroyed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/2?lang=eng'
    quote: 'And in the days of these kings shall the God of heaven set up a kingdom, which shall never be destroyed'
  - where: 'note 6:26 “The king’s second decree”'
    claim: 'The verb “destroyed” in 6:26 is chabal (H2255); scripts/hebrew.mjs lists the same form at 2:44 and 7:14, and the verb at 6:22 of the lions'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'תִתְחַבַּ֔ל'
  - where: 'note 6:26 “The king’s second decree”'
    claim: 'Chabal means destroy, hurt; BDB lists it of the lions at 6:22 (Hebrew 6:23)'
    key: bdb
    url: 'https://biblehub.com/hebrew/2255.htm'
    quote: 'Pa`el destroy, hurt (see Biblical Hebrew II. חבל); — Perfect3masculine plural suffix חַבְּלוּנִי Daniel 6:23 (of lions)'
  - where: 'note 6:26 “The king’s second decree”'
    claim: 'Draper reads the decree as confessing more than the earlier kings had'
    key: draper-exile
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/prophets-exile'
    quote: 'Jehovah no longer stood as one of the many gods nor as the head of the gods: He was the living God whose kingdom and dominion were everlasting.'
  - where: 'note 6:26 “The king’s second decree”'
    claim: 'Draper places Darius’s decree after the earlier kings’ confessions'
    key: draper-exile
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/prophets-exile'
    quote: 'Darius took the last step, which occurred when Daniel’s enemies tricked the king into throwing Daniel into the lions’ den.'
  - where: 'note 6:26 “The king’s second decree”'
    claim: 'Nebuchadnezzar’s decree forbade speaking against the God of the three'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/3?lang=eng'
    quote: 'because there is no other God that can deliver after this sort'

