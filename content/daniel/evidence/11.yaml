    claim: 'Chapter 8 uses the same phrase'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/8?lang=eng'
    quote: 'for at the time appointed the end shall be'

  # note 11:31
  - where: 'note 11:31 “The abomination that maketh desolate”'
    claim: 'Shiqquts is a detested thing'
    key: bdb
    url: 'https://biblehub.com/hebrew/8251.htm'
    quote: 'detested thing'
  - where: 'note 11:31 “The abomination that maketh desolate”'
    claim: 'The participle means appalling, causing horror'
    key: bdb
    url: 'https://biblehub.com/hebrew/8074.htm'
    quote: 'transitive appalling, causing horror'
  - where: 'note 11:31 “The abomination that maketh desolate”'
    claim: 'The Hebrew phrase is a noun and a participle (scripts/hebrew.mjs daniel 11:31)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'מְשׁוֹמֵֽם'
  - where: 'note 11:31 “The abomination that maketh desolate”'
    claim: '1 Maccabees 1:54 uses the phrase of what Antiochus’s men set on the altar'
    key: first-maccabees
    url: 'https://biblehub.com/apocrypha/1_maccabees/1.htm'
    quote: 'they set up the abomination of desolation upon the altar, and builded idol altars throughout the cities of Juda on every side'
  - where: 'note 11:31 “The abomination that maketh desolate”'
    claim: 'Josephus: an idol altar on God’s altar (Antiquities 12.5.4)'
    key: josephus-antiquities
    url: 'https://penelope.uchicago.edu/josephus/ant-12.html'
    quote: 'And when the King had built an idol altar'
  - where: 'note 11:31 “The abomination that maketh desolate”'
