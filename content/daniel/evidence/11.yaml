chapter: 11
claims:
  # when, setting, thread
  - where: 'when'
    claim: 'Cyrus conquered Babylon in 539 B.C.'
    key: scripture-helps-dan
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/44-daniel-1-7?lang=eng'
    quote: 'lasting into the reign of King Cyrus of Persia, who conquered Babylon in 539 BC'
  - where: 'when'
    claim: 'The vision of chapters 10–12 is dated to the third year of Cyrus'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/10?lang=eng'
    quote: 'In the third year of Cyrus king of Persia a thing was revealed unto Daniel'
  - where: 'setting'
    claim: 'The messenger of chapter 10 states his purpose and what he will tell (10:14, 21)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/10?lang=eng'
    quote: 'But I will shew thee that which is noted in the scripture of truth: and there is none that holdeth with me in these things, but Michael your prince.'
  - where: 'setting'
    claim: 'The speech runs on to 12:4, where Daniel is told to shut up the words'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/12?lang=eng'
    quote: 'But thou, O Daniel, shut up the words, and seal the book, even to the time of the end'
  - where: 'setting'
    claim: 'Verse 1 belongs with 10:21; Keil refers “him” to Michael'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/11.htm'
    quote: 'the connection of this verse with Daniel 10:21 is placed beyond a doubt'
  - where: 'setting'
    claim: 'Others (Hävernick, Hengstenberg) refer “him” to Darius'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/11.htm'
    quote: 'to Darius (Hv., Hengstb.) is excluded by this'
  - where: 'setting'
    claim: 'The history is a background, to show its effects on the Lord’s people'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'Daniel’s intention was not to emphasize the history but only to give it as a background in order to indicate its effects upon the Lord’s people'
  - where: 'setting'
    claim: 'An overview of main events, not a detailed chronology'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'Daniel did not intend to present a detailed chronology of future events but rather to give an overview of some of the main events that would influence the Lord’s people'
  - where: 'setting'
    claim: 'Several things in the chapter apply to more than one period'
    key: ot-manual-28
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-28?lang=eng'
    quote: 'Several things Daniel mentioned seem to be dualistic, having application to more than one period of time.'
  - where: 'setting'
    claim: 'The Church’s chapter heading'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/11?lang=eng'
    quote: 'Daniel sees the successive kings and their wars, leagues, and conflicts that lead up to the Second Coming of Christ.'
  - where: 'thread'
    claim: 'The speech ends with Michael, deliverance and the dead awaking (12:1–3)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/12?lang=eng'
    quote: 'And many of them that sleep in the dust of the earth shall awake, some to everlasting life, and some to shame and everlasting contempt.'

  # plain-words sections
  - where: 'section 2 plain'
    claim: 'Verse 8: “princes” is molten images'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/11?lang=eng'
    quote: 'HEB molten images.'
  - where: 'section 2 plain'
    claim: 'Verse 14: “robbers” is oppressors'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/11?lang=eng'
    quote: 'HEB oppressors.'
  - where: 'section 2 plain'
    claim: 'Verse 15: “mount” is siegework'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/11?lang=eng'
    quote: 'OR siegework.'
  - where: 'section 3 plain'
    claim: 'Verse 21: “vile” is contemptible'
    key: bdb
    url: 'https://biblehub.com/hebrew/959.htm'
    quote: '3 despicable, contemptible Malachi 1:7'
  - where: 'section 4 plain'
    claim: 'Verse 38: “forces” is fortresses (the word for a place of safety, used of fortresses in 11:7, 10, 19)'
    key: bdb
    url: 'https://biblehub.com/hebrew/4581.htm'
    quote: 'Ezekiel 24:25; Ezekiel 30:15; Daniel 11:7,10,19'
  - where: 'section 4 plain'
    claim: 'Verse 38 rendered “the god of fortresses”'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/11.htm'
    quote: 'On the other hand, he will honour the god of fortresses.'
  - where: 'section 4 plain'
    claim: 'Verse 43: “at his steps” is march with him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/11?lang=eng'
    quote: 'IE march with him.'

  # note 11:3
  - where: 'note 11:3 “Persia’s kings and the mighty king (verses 2–4)”'
    claim: 'Chapter 8 names Media and Persia, Grecia, its first king, and four kingdoms after him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/8?lang=eng'
    quote: 'Now that being broken, whereas four stood up for it, four kingdoms shall stand up out of the nation, but not in his power.'
  - where: 'note 11:3 “Persia’s kings and the mighty king (verses 2–4)”'
    claim: 'Alexander of Macedon: his dates and the reach of his empire'
    key: bd-alexander
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/alexander?lang=eng'
    quote: 'King of Macedon, surnamed the Great; born 356 B.C., died 323 B.C. He made himself ruler over a wide empire stretching from Greece to the Indus, including Syria and Egypt.'
  - where: 'note 11:3 “Persia’s kings and the mighty king (verses 2–4)”'
    claim: 'After Alexander his government fell among many; Seleucus had Babylon'
    key: josephus-antiquities
    url: 'https://penelope.uchicago.edu/josephus/ant-12.html'
    quote: 'And as his government fell among many, Antigonus obtained Asia: Seleucus, Babylon'
  - where: 'note 11:3 “Persia’s kings and the mighty king (verses 2–4)”'
    claim: 'Ptolemy the son of Lagus seized Egypt'
    key: josephus-antiquities
    url: 'https://penelope.uchicago.edu/josephus/ant-12.html'
    quote: 'As did Ptolemy the son of Lagus seize upon Egypt.'
  - where: 'note 11:3 “Persia’s kings and the mighty king (verses 2–4)”'
    claim: 'Alexander’s officers took crowns after his death (1 Maccabees 1:9)'
    key: first-maccabees
    url: 'https://biblehub.com/apocrypha/1_maccabees/1.htm'
    quote: 'And after his death they all put crowns upon themselves; so did their sons after them many years'
  - where: 'note 11:3 “Persia’s kings and the mighty king (verses 2–4)”'
    claim: 'Keil’s reading of the four Persian kings'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/11.htm'
    quote: 'the three successors of Cyrus, viz., Cambyses, the pseudo-Smerdis, and Darius Hystaspes; the fourth is then Xerxes'
  - where: 'note 11:3 “Persia’s kings and the mighty king (verses 2–4)”'
    claim: 'Xerxes spent his treasure on a host to conquer Greece (Hitzig, as Keil quotes him)'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/11.htm'
    quote: 'Xerxes expended his treasures for the raising and arming of an immense host'
  - where: 'note 11:3 “Persia’s kings and the mighty king (verses 2–4)”'
    claim: 'The list closes with Xerxes though Persia had later kings; his expedition began the conflict that ended with Alexander'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/11.htm'
    quote: 'which led to the destruction of the Persian kingdom by Alexander the Great. The reply of Alexander to Darius Codomannus'
  - where: 'note 11:3 “Persia’s kings and the mighty king (verses 2–4)”'
    claim: 'The prophecy gives only the elements of the development'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/11.htm'
    quote: 'mentions only the elements and factors which constitute the historical development'

  # note 11:5
  - where: 'note 11:5 “The kings of the south and of the north (verses 5–20)”'
    claim: 'The text names Egypt as the land of the king of the south (verse 8); Jerome is an early source of the identifications'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/11?lang=eng'
    quote: 'And shall also carry captives into Egypt their gods'
  - where: 'note 11:5 “The kings of the south and of the north (verses 5–20)”'
    claim: 'Egypt went to Ptolemy the son of Lagus'
    key: josephus-antiquities
    url: 'https://penelope.uchicago.edu/josephus/ant-12.html'
    quote: 'As did Ptolemy the son of Lagus seize upon Egypt.'
  - where: 'note 11:5 “The kings of the south and of the north (verses 5–20)”'
    claim: 'Seleucus obtained Syria'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/11.htm'
    quote: 'obtained, according to Appian, Syr. c. 55, Syria from the Euphrates to the Mediterranean Sea'
  - where: 'note 11:5 “The kings of the south and of the north (verses 5–20)”'
    claim: 'Verse 5: Ptolemy Lagus and Seleucus'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/11.htm'
    quote: 'Thus all interpreters regard the king of the south, Daniel 11:5, as Ptolemy Lagus'
  - where: 'note 11:5 “The kings of the south and of the north (verses 5–20)”'
    claim: 'Seleucus once fled to Ptolemy in Egypt'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/11.htm'
    quote: 'under the necessity of fleeing to Egypt to Ptolemy, by whom he was hospitably received'
  - where: 'note 11:5 “The kings of the south and of the north (verses 5–20)”'
    claim: 'Verse 6: the marriage of Berenice, as explained by Jerome and those who follow him'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/11.htm'
    quote: 'on the condition that Antiochus should put away his own wife Laodice, who was at the same time his half-sister, and disinherit her son, and should marry Berenice, the daughter of Ptolemy'
  - where: 'note 11:5 “The kings of the south and of the north (verses 5–20)”'
    claim: 'The explanation goes back to Jerome'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/11.htm'
    quote: 'is thus explained by Jerome, and all interpreters who follow him'
  - where: 'note 11:5 “The kings of the south and of the north (verses 5–20)”'
    claim: 'Verses 7–9: her brother Ptolemy Euergetes invaded Syria in revenge for her murder'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/11.htm'
    quote: 'her brother, Ptolemy Euergetes, invaded the Syrian kingdom'
  - where: 'note 11:5 “The kings of the south and of the north (verses 5–20)”'
    claim: 'She was murdered'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/11.htm'
    quote: 'since he had come too late to save his sister, in revenge for her murder'
  - where: 'note 11:5 “The kings of the south and of the north (verses 5–20)”'
    claim: 'Verses 10–12: Antiochus the Great and his defeat at Raphia'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/11.htm'
    quote: 'His brother Antiochus, surnamed the Great, succeeded him'
  - where: 'note 11:5 “The kings of the south and of the north (verses 5–20)”'
    claim: 'Raphia'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/11.htm'
    quote: 'he was defeated by the Egyptians at Raphia, not far from Gaza'
  - where: 'note 11:5 “The kings of the south and of the north (verses 5–20)”'
    claim: 'Antiochus later defeated Scopas and took Judea (Antiquities 12.3.3)'
    key: josephus-antiquities
    url: 'https://penelope.uchicago.edu/josephus/ant-12.html'
    quote: 'Yet was it not long afterward when Antiochus overcame Scopas; in a battel fought at the fountains of Jordan'
  - where: 'note 11:5 “The kings of the south and of the north (verses 5–20)”'
    claim: 'He gave his daughter Cleopatra to Ptolemy (Antiquities 12.4.1)'
    key: josephus-antiquities
    url: 'https://penelope.uchicago.edu/josephus/ant-12.html'
    quote: 'After this Antiochus made a friendship and league with Ptolemy; and gave him his daughter Cleopatra to wife'
  - where: 'note 11:5 “The kings of the south and of the north (verses 5–20)”'
    claim: 'Verse 20: Seleucus Philopator, if the verses before are of Antiochus the Great'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/11.htm'
    quote: 'Seleucus Philopator, to whom Daniel 11:20 must refer, if the foregoing verses treat of Antiochus the Great'
  - where: 'note 11:5 “The kings of the south and of the north (verses 5–20)”'
    claim: 'The prophecy has four kings of the north and three of the south'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/11.htm'
    quote: 'there is mention made of only four kings of the north'
  - where: 'note 11:5 “The kings of the south and of the north (verses 5–20)”'
    claim: 'Three kings of the south'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/11.htm'
    quote: 'and three kings of the south'
  - where: 'note 11:5 “The kings of the south and of the north (verses 5–20)”'
    claim: 'History does not match the prophecy exhaustively'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/11.htm'
    quote: 'the historical reality does not correspond with the contents of the prophecy in anything like an exhaustive manner'
  - where: 'note 11:5 “The kings of the south and of the north (verses 5–20)”'
    claim: 'The two kings stand for the two kingdoms'
    key: keil-daniel
    url: 'https://biblehub.com/commentaries/kad/daniel/11.htm'
    quote: 'as representatives of the power of these two kingdoms'

  # note 11:16
  - where: 'note 11:16 “The glorious land”'
    claim: 'The word is used of the land of Israel (Ezekiel 20:6, 15)'
    key: bdb
    url: 'https://biblehub.com/hebrew/6643.htm'
    quote: 'of land of Israel (Judah),'
  - where: 'note 11:16 “The glorious land”'
    claim: 'The word occurs four times in Daniel: 8:9; 11:16, 41, 45 (scripts/hebrew.mjs daniel --word 6643; the form quoted is that of 11:45)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
    quote: 'צְבִי'
  - where: 'note 11:16 “The glorious land”'
    claim: 'Judea lay between the Ptolemies and the Seleucids'
    key: ot-manual-kings-k
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-k?lang=eng'
    quote: 'Judea lay directly between the two rivals.'
  - where: 'note 11:16 “The glorious land”'
    claim: 'It fell to the Ptolemies in 301 B.C.'
    key: ot-manual-kings-k
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-k?lang=eng'
    quote: 'In 301 B.C. it finally fell to the Ptolemies of Egypt, to whom it belonged for one hundred years.'
  - where: 'note 11:16 “The glorious land”'
    claim: 'The Seleucids held it from 200 B.C.'
    key: ot-manual-kings-k
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-k?lang=eng'
    quote: 'It was not until 200 B.C. that the Seleucids were able to capture and hold Judea.'
  - where: 'note 11:16 “The glorious land”'
    claim: 'Josephus on the Jews in the wars of Antiochus the Great (Antiquities 12.3.3)'
    key: josephus-antiquities
    url: 'https://penelope.uchicago.edu/josephus/ant-12.html'
    quote: 'So that they were very like to a ship in a storm; which is tossed by the waves on both sides'
  - where: 'note 11:16 “The glorious land”'
    claim: 'The messenger came to show what would befall Daniel’s people'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/10?lang=eng'
    quote: 'Now I am come to make thee understand what shall befall thy people in the latter days'

  # note 11:21
  - where: 'note 11:21 “The vile person (verses 21–35)”'
    claim: 'The word means despicable, contemptible'
    key: bdb
    url: 'https://biblehub.com/hebrew/959.htm'
    quote: '3 despicable, contemptible Malachi 1:7'
  - where: 'note 11:21 “The vile person (verses 21–35)”'
    claim: 'The lexicon identifies the person as Antiochus Epiphanes'
    key: bdb
    url: 'https://biblehub.com/hebrew/959.htm'
    quote: 'Daniel 11:21 as substantive of Antiochus Epiph.'
  - where: 'note 11:21 “The vile person (verses 21–35)”'
    claim: 'Who Antiochus was'
    key: bd-antiochus-epiphanes
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/antiochus-epiphanes?lang=eng'
    quote: 'King of Syria (175–164 B.C.), at a time when Palestine was a Syrian province. He resolved to try to crush all that was distinctive of Jewish nationality and worship.'
  - where: 'note 11:21 “The vile person (verses 21–35)”'
    claim: 'Antiochus’s expedition against Egypt (Antiquities 12.5.2)'
    key: josephus-antiquities
    url: 'https://penelope.uchicago.edu/josephus/ant-12.html'
    quote: 'resolved to make an expedition against Egypt'
  - where: 'note 11:21 “The vile person (verses 21–35)”'
    claim: 'He took Egypt by treachery'
    key: josephus-antiquities
    url: 'https://penelope.uchicago.edu/josephus/ant-12.html'
    quote: 'circumvented Ptolemy Philometor by treachery; and seized upon Egypt'
  - where: 'note 11:21 “The vile person (verses 21–35)”'
    claim: 'The Romans drove him out'
    key: josephus-antiquities
    url: 'https://penelope.uchicago.edu/josephus/ant-12.html'
    quote: 'But he was driven not only from Alexandria, but out of all Egypt, by the declaration of the Romans'
  - where: 'note 11:21 “The vile person (verses 21–35)”'
    claim: 'He then subdued Judea and the temple'
    key: josephus-antiquities
    url: 'https://penelope.uchicago.edu/josephus/ant-12.html'
    quote: 'how he subdued Judea and the temple'
  - where: 'note 11:21 “The vile person (verses 21–35)”'
    claim: 'He emptied the temple of its treasures and forbade the daily sacrifices (Antiquities 12.5.4)'
    key: josephus-antiquities
    url: 'https://penelope.uchicago.edu/josephus/ant-12.html'
    quote: 'For he forbad them to offer those daily sacrifices which they used to offer to God, according to the law.'
  - where: 'note 11:21 “The vile person (verses 21–35)”'
    claim: 'He emptied the temple of its treasures'
    key: josephus-antiquities
    url: 'https://penelope.uchicago.edu/josephus/ant-12.html'
    quote: 'He also emptied it of its secret treasures'
  - where: 'note 11:21 “The vile person (verses 21–35)”'
    claim: 'Chittim: the people of Cyprus'
    key: bdb
    url: 'https://biblehub.com/hebrew/3794.htm'
    quote: 'name, of a people = Cypriotes'
  - where: 'note 11:21 “The vile person (verses 21–35)”'
    claim: 'Chittim more widely: the Mediterranean coastlands'
    key: bdb
    url: 'https://biblehub.com/hebrew/3794.htm'
    quote: 'more Generally, of coast-lands of Mediterranean'
  - where: 'note 11:21 “The vile person (verses 21–35)”'
    claim: 'A Hellenizing movement among the Jews helped him'
    key: bd-maccabees
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/maccabees?lang=eng'
    quote: 'At first he met with considerable success, owing partly to a Hellenizing movement among the Jews themselves'
  - where: 'note 11:21 “The vile person (verses 21–35)”'
    claim: 'Josephus read Daniel’s earlier vision (chapter 8) as fulfilled under Antiochus (Antiquities 10.11.7)'
    key: josephus-antiquities
    url: 'https://penelope.uchicago.edu/josephus/ant-10.html'
    quote: 'our nation suffered these things under Antiochus Epiphanes, according to Daniel’s vision; and what he wrote many years before they came to pass'
  - where: 'note 11:21 “The vile person (verses 21–35)”'
    claim: 'The little horn of chapter 8 grew toward the pleasant land'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/8?lang=eng'
    quote: 'toward the south, and toward the east, and toward the pleasant land'

  # note 11:27
  - where: 'note 11:27 “The time appointed”'
    claim: 'The word is moed; it occurs in Daniel at 8:19; 11:27, 29, 35; 12:7 (scripts/hebrew.mjs daniel --word 4150)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Dan.xml'
