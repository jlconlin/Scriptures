  - where: 'note 11:27 “The time appointed”'
    claim: 'The lexicon lists these verses under “at the appointed time”'
    key: bdb
    url: 'https://biblehub.com/hebrew/4150.htm'
    quote: 'Daniel 8:19; Daniel 11:27,29,35'
