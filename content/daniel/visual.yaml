summary: >-
  The book of Daniel: a faithful captive in the courts of Babylon, the den of
  lions, and the dream of a stone cut out of the mountain without hands that
  rolls forth and fills the whole earth, the kingdom of God that shall never be
  destroyed.
motifs:
  - "Most important: one great lion lying at rest on a rock ledge at the mouth of a rocky den, in the left foreground, calm, mouth closed, head lifted, looking out and away to the right over the land below."
  - "Most important: beyond and below the lion, the city of Babylon on its river in the middle distance: a stepped tower, high battlemented walls and gates, palms along the water, in cool shadow with a little gold on its tops."
  - "Most important: beyond the city, in place of any city in the sky, one great mountain rising into bright gold light that breaks through the clouds, and a single huge rough stone that has come away from it and is rolling down its lower slope toward the city, with a pale track behind it up to a notch on the ridge. The stone is unshaped, lumpy and uneven, not a ball, and clearly larger than the city's towers. There is no city, temple, or building in the clouds."
composition: >-
  The lion fills the left third of the frame on its ledge, framed by the dark
  rock of the den's mouth at the far left. Its gaze leads the eye across the
  river city in the middle distance to the lit mountain and the rolling stone at
  the upper right, which is where the light is brightest. A wide sky of parchment
  and pale gold clouds. Drawn, not painted or photographed: large flat and gently graded areas of
  color, simplified and gently faceted shapes, and clean silhouettes, like a
  printed poster illustration. The lion's mane and body are a few broad shapes of
  tawny and brown with no strands of fur; the rocks are plain faceted planes; the
  city is simple blocks with almost no windows or small detail; the palms are a
  few simple shapes, and there is no foliage in the foreground. Only a thin pale
  line marks the stone's track, with very little dust, so it cannot be mistaken
  for a waterfall. Fewer clouds, soft-edged and simple. Calm, with open space. No
  people, no statue or image, no fire or rubble.
