description: A phrase-by-phrase companion to the book of Daniel, grounded in the restored gospel of Jesus Christ.
divisionsBlurb: The stories come first and the visions after, but not in order of time. Daniel dates the visions of chapters 7 and 8 to the reign of Belshazzar, before the night of the writing on the wall in chapter 5.
home:
  blurb: A captive who served the kings of Babylon and kept faith with his God, and who was shown the kingdoms of the world giving way to the kingdom of God.

intro: |
  Daniel was taken from Jerusalem to Babylon as a young man, with Hananiah, Mishael, and Azariah, to be trained for the king’s court. He served there under Nebuchadnezzar and those who came after him, and “continued even unto the first year of king Cyrus” ([[Dan. 1:21]]), whose Persians conquered Babylon in 539 B.C. He was in Babylon while Ezekiel prophesied among the exiles by the river of Chebar and while Jeremiah was still in Jerusalem.

  The book has two halves. Chapters 1–6 are stories about Daniel and his three companions: the king’s food refused, a forgotten dream told and explained, a furnace, a king driven out to live with the beasts, a hand that wrote on a wall, a den of lions. Chapters 7–12 are visions that Daniel reports himself, of beasts and kingdoms, of the Ancient of days and one like the Son of man, and of the end. This companion goes through all twelve chapters and tries to anticipate the questions a careful reader asks: *When is this, and who is this king? What does that image stand for, and does the text say? What has been revealed about it since? Where is Christ in this?*

# The Bible Dictionary divides the book in two (1–6 narratives, 7–12 visions). The split of 7–12 at chapter 10 is the
# site’s own: chapters 10–12 are one vision (10:1 to 12:13).
# Keys must not repeat another book’s (the colors are global variables).
divisions:
  - key: captives
    range: [1, 6]
    name: Faithful in the Courts of Babylon
    blurb: Daniel and his three companions serve the kings of Babylon and of the Medes and Persians and will not give up their God. Daniel tells a king his dream and what it means, his companions walk out of the furnace and he out of the den of lions unhurt, and two kings learn that the most High rules.
    color: '#9c6a2f'
    darkColor: '#e3b77a'
  - key: beasts
    range: [7, 9]
    name: The Beasts, the Ancient of Days, and the Seventy Weeks
    blurb: Daniel sees four beasts come up from the sea and one like the Son of man brought before the Ancient of days. A second vision shows a ram and a goat, and while he is praying for Jerusalem Gabriel comes to him with the seventy weeks.
    color: '#7a3f55'
    darkColor: '#d79bb3'
  - key: sealed
    range: [10, 12]
    name: The Last Vision
    blurb: By the river Hiddekel a man clothed in linen strengthens Daniel and tells him what is to come upon his people, to a time of trouble and the awaking of those who sleep in the dust. The words are sealed till the time of the end.
    color: '#3d5f7d'
    darkColor: '#93b9db'

