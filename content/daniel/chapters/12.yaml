chapter: 12
title: 'The Dead Awake, and the Book Is Sealed'
tagline: 'The last vision ends with deliverance for everyone written in the book, the dead waking from the dust, and numbers Daniel does not understand. He is told to go his way: he will rest, and he will stand.'
when: 'The third year of Cyrus king of Persia ([[Dan. 10:1]]), the date of the vision that fills chapters 10–12. What these verses foretell reaches to “the time of the end.”'

setting: |
  This chapter finishes the vision that began in chapter 10, and it finishes the book. Daniel received the vision in “the third year of Cyrus king of Persia” ([[Dan. 10:1]]), “by the side of the great river, which is Hiddekel” ([[Dan. 10:4]]), and he is still on that riverbank in verse 5. The voice in verses 1–4 is the messenger who has been speaking since chapter 10 and who said he had come “to make thee understand what shall befall thy people in the latter days” ([[Dan. 10:14]]).

  The chapter break falls in the middle of his speech. “At that time” in verse 1 points back to the end of chapter 11, where the angel says of the last king in that long account, “he shall come to his end, and none shall help him” ([[Dan. 11:45]]). Verses 1–4 complete that account. Verses 5–13 are a short closing scene on the riverbank: two more figures appear, one of them asks how long, and Daniel, who does not understand the answer, is sent on his way with a promise.

  The Savior drew on this chapter when He foretold the destruction of Jerusalem and the events before His return, and the Revelation of John has an oath and a measure of time like the ones given here. The chapter holds the book’s testimony of the resurrection.

thread: |
  The chapter answers a question that chapter 11 left open. There the angel said that the wise among Daniel’s people would teach many and would “fall by the sword, and by flame, by captivity, and by spoil” ([[Dan. 11:33]]).

  Verses 1–3 give the rest of the answer. When the trouble is at its worst, Michael stands up and the people are delivered, “every one that shall be found written in the book.” The deliverance reaches past the survivors. Many who sleep in the dust awake, and the wise who fell are the ones who shine. Part of the people outlive the tribulation, and “those who lose their lives in the persecution shall rise again from the dead.”

  Then the book is closed. Daniel is told to shut up the words, and when a voice asks, “How long?” the answer comes as a sworn oath and a set of numbers. Daniel says, “I heard, but I understood not.” He is not given an explanation. He is told that the wise will understand when the time comes, and that the one who waits is blessed.

  The last verse turns from the people to the man. Daniel is told that he will rest, and that he will stand in his own lot at the end of the days.

sections:
  - range: 1-4
    heading: 'Deliverance, resurrection, and a sealed book'
    plain: |
      At that time Michael will stand up, the great prince who has charge over your people. There will be a time of trouble such as there has never been since there was a nation until that time. But at that time your people will be delivered, everyone who is found written in the book.

      Many of those who sleep in the dust of the earth will awake, some to everlasting life and some to shame and everlasting contempt. The wise will shine like the brightness of the firmament, and those who turn many to righteousness like the stars for ever and ever.

      But you, Daniel, shut up these words and seal the book until the time of the end. Many will go to and fro, and knowledge will increase.
  - range: 5-7
    heading: 'How long?'
    plain: |
      Then I, Daniel, looked, and two others were standing there, one on this bank of the river and one on the other. One of them said to the man clothed in linen, who was above the waters of the river, “How long will it be until the end of these wonders?”

      The man clothed in linen lifted his right hand and his left hand toward heaven, and I heard him swear by Him who lives for ever that it would be for a time, times, and a half, and that when the shattering of the power of the holy people is complete, all these things will be finished.
  - range: 8-13
    heading: 'Go thy way, Daniel'
    plain: |
      I heard, but I did not understand. So I said, “My lord, what will be the end of these things?” He said, “Go your way, Daniel. The words are closed up and sealed until the time of the end. Many will be purified, made white, and refined. The wicked will go on doing wickedly, and none of the wicked will understand, but the wise will understand.

      “From the time the daily sacrifice is taken away and the abomination that makes desolate is set up, there will be a thousand two hundred and ninety days. Blessed is the one who waits and reaches the thousand three hundred and thirty-five days.

      “But you, go your way until the end. You will rest, and you will rise to your allotted place at the end of the days.”

notes:
  - ref: 1
    phrase: 'Michael stand up'
    kind: scripture
    title: 'Michael, the great prince'
    body: |
      Michael is Adam, and Restoration scripture tells what he does at the end of the world: he leads the armies of heaven against Satan, and he sounds the trump at which the dead awake. The angel has already named him twice in this vision, as “Michael, one of the chief princes” ([[Dan. 10:13]]) and as “Michael your prince” ([[Dan. 10:21]]). Latter-day revelation “informs us that Michael is Adam, the Ancient of Days,” the figure of chapter 7 before whom the Son of Man is brought.

      “Standeth for” is the language of a guardian. The Church’s edition gives the alternative “who has charge over.” Daniel’s people are Michael’s charge, and in the hour of their worst trouble he rises to act.

      Two revelations to Joseph Smith tell what he does at the end. One tells of Satan bound “for the space of a thousand years” ([[D&C 88:110]]) and then of a last battle in which “Michael, the seventh angel, even the archangel, shall gather together his armies, even the hosts of heaven” ([[D&C 88:112]]) and “shall overcome him who seeketh the throne of him who sitteth upon the throne, even the Lamb” ([[D&C 88:115]]). The other tells of the resurrection: “Michael, mine archangel, shall sound his trump, and then shall all the dead awake, for their graves shall be opened, and they shall come forth—yea, even all” ([[D&C 29:26]]).
    sources: [bd-michael, bd-daniel-book, lds-scriptures]

  - ref: 1
    phrase: 'a time of trouble, such as never was'
    kind: scripture
    title: 'A time of trouble such as never was'
    body: |
      The Savior used these words for the Roman destruction of Jerusalem, and they have been read of more than one time since. He told His disciples, “then, in those days, shall be great tribulation on the Jews, and upon the inhabitants of Jerusalem, such as was not before sent upon Israel, of God, since the beginning of their kingdom until this time” ([[JS—M 1:18]]).

      So the verse has at least one fulfillment that the Lord Himself named, in A.D. 70. Others have been proposed: the persecution under Antiochus in the second century B.C., “the most deliberate and savage” the Jews had known to that point; the battle before the Millennium; and the battle after it, in which Michael leads the armies of heaven (see the note on Michael in this verse). Which is right? “It is very possible that all four answers are correct.” That is offered as possible, not as settled.

      The wording may come from Jeremiah. The Hebrew for “a time of trouble” is the phrase behind “the time of Jacob’s trouble,” and the description here “seems to be based on Jeremiah 30:7.” Jeremiah’s sentence reads, “none is like it: it is even the time of Jacob’s trouble; but he shall be saved out of it” ([[Jer. 30:7]]).
    sources: [lds-scriptures, ot-manual-28, keil-daniel, oshb-wlc]

  - ref: 1
    phrase: 'written in the book'
    kind: scripture
    title: 'The book of the delivered'
    body: |
      The book is the heavenly record of the faithful, which later scripture calls the book of life. This passage belongs with the New Testament verses that use that name: “the scriptures indicate that a heavenly record is kept of the faithful, whose names are recorded, as well as an account of their righteous deeds.” Joseph Smith described it so when he explained John’s vision of the judgment: “the book which was the book of life is the record which is kept in heaven” ([[D&C 128:7]]).

      This is not the book of verse 4. That one is Daniel’s own writing, which he is told to seal.
    sources: [bd-book-of-life, lds-scriptures]

  - ref: 2
    phrase: 'shall awake'
    kind: scripture
    title: 'The dead awake, to two ends'
    body: |
      Verse 2 foretells the resurrection of the dead to two different ends, and the Savior later taught the same division in nearly the same form. The Church’s chapter heading calls them “the two resurrections.”

      Isaiah had already used the picture. His words “Awake and sing, ye that dwell in dust” ([[Isa. 26:19]]) have the same Hebrew verb for waking and the same word for dust as this verse. Daniel is told of two ends: “some to everlasting life, and some to shame and everlasting contempt.” The word for “contempt” is rare. Daniel has it only here, and Isaiah only in his last verse, where those who rebelled against the Lord are “an abhorring unto all flesh” ([[Isa. 66:24]]).

      The Savior’s words are these: “all that are in the graves shall hear his voice, And shall come forth; they that have done good, unto the resurrection of life; and they that have done evil, unto the resurrection of damnation” ([[John 5:28–29]]). The Church’s footnote joins that passage to this verse. It was when the work of translation brought Joseph Smith to “the twenty-ninth verse of the fifth chapter of John” ([[D&C 76:15]]) that the vision recorded in that section was opened, and the verse was given there as “the resurrection of the just” and “the resurrection of the unjust” ([[D&C 76:17]]).

      Daniel is told that “many” will awake. The Savior says “all,” and so does the revelation quoted in the note on Michael above.
    sources: [lds-scriptures, oshb-wlc, bdb]

  - ref: 3
    phrase: 'they that be wise'
    kind: words
    title: 'The wise, who make many righteous'
    body: |
      “The wise” are a group this vision has already introduced, and this verse says what becomes of them. The Hebrew is *maskilim*, rendered “the teachers” by some scholars and “the wise” by others. The word “refers back to” chapter 11, where the King James translates it “they that understand” and “them of understanding”: they “shall instruct many,” and they “shall fall by the sword” ([[Dan. 11:33]]), “to try them, and to purge, and to make them white” ([[Dan. 11:35]]). Verse 3 is their reward, and verse 10 of this chapter brings back both the name and the three verbs of that sentence: “Many shall be purified, and made white, and tried … but the wise shall understand.”

      Their work is described with a verb that Isaiah used of the Lord’s Servant. In Hebrew, “they that turn many to righteousness” is a single word, “those who make righteous,” followed by “the many,” and the same verb in the same causative form stands beside “the many” in the prophecy of the suffering Servant: “by his knowledge shall my righteous servant justify many; for he shall bear their iniquities” ([[Isa. 53:11]]). One view is that Daniel’s expression “is borrowed from Isaiah 53:11.” That is a proposal, not an established point.

      The two are not doing the same thing. “The Servant of Jehovah justifies many, not by the sacrifice, but by His righteousness,” as the sinless one who takes the people’s sins on Himself. The wise are those who “have led many to the knowledge of salvation.”
    sources: [bdb, oshb-wlc, keil-daniel, lds-scriptures]

  - ref: 3
    phrase: 'shine as the brightness of the firmament'
    kind: symbol
    title: 'Shining like the sky and the stars'
    body: |
      The shining is the glory of resurrected bodies, and Lehi saw the same brightness in his first vision. Verse 3 follows directly on the waking of verse 2, so the brightness belongs to those who have risen. Daniel is shown that when the wise “are resurrected,” they shine like the firmament and the stars.

      Lehi saw something like it in his first vision. Twelve followed the One who descended from heaven, “and their brightness did exceed that of the stars in the firmament” ([[1 Ne. 1:10]]). They were probably the Twelve Apostles shown to him “as they would appear in their future, glorified, resurrected state.” That is a likely reading of Lehi’s vision and not a certain one.
    sources: [sc-knowhy-469, lds-scriptures]

  - ref: 4
    phrase: 'shut up the words, and seal the book'
    kind: words
    title: 'What it means to seal the book'
    body: |
      To seal the book is to close its words until an appointed time, and in this chapter what stays closed is their meaning. The verb for “shut up” is used in the sense “shut up, keep close,” of prophetic words, and Daniel received the same command at the end of an earlier vision: “shut thou up the vision; for it shall be for many days” ([[Dan. 8:26]]).

      The chapter itself shows what is withheld. Daniel hears the answer in verse 7 and says he does not understand it. When he asks again, he is told only that “the words are closed up and sealed till the time of the end” and that then “the wise shall understand” (verses 9–10). The Church’s chapter heading reads the promise the same way: the wise “will know the times and meanings of his visions.”

      Restoration scripture knows this kind of sealing well, and the Church’s footnote on verse 9 gathers the passages. Moroni wrote the words of the brother of Jared and was commanded to “seal them up” ([[Ether 4:5]]); they are not to be revealed until people have faith.
    sources: [bdb, oshb-wlc, lds-scriptures]

  - ref: 4
    phrase: 'many shall run to and fro'
    kind: words
    title: 'Running to and fro'
    body: |
      “Run to and fro” describes an eager search, and the nearest parallel is a search for the word of God. The Hebrew verb in this form means to “go eagerly, quickly, to and fro.” Amos uses the same form of the famine of hearing the Lord’s words: “they shall run to and fro to seek the word of the LORD, and shall not find it” ([[Amos 8:12]]).

      On one older reading the sentence is about what happens to Daniel’s book, and the verb here means “to search through, to examine, a book.” Many will go through these words looking for understanding, and “knowledge shall be increased.” On that reading the knowledge is first of all knowledge of what God has revealed.

      Latter-day prophets have read the increase more widely. President Spencer W. Kimball said that nineteenth-century readers saw the prophecy fulfilled in the steam engine and the motor car, and that these were “but the dim beginnings of the most spectacular increase of knowledge since men first dwelt upon the earth.” The Church’s footnote on “knowledge” points to the Lord’s word to Joseph Smith that nothing can “hinder the Almighty from pouring down knowledge from heaven upon the heads of the Latter-day Saints” ([[D&C 121:33]]).
    sources: [bdb, keil-daniel, ot-manual-28, lds-scriptures]

  - ref: 7
    phrase: 'held up his right hand and his left hand unto heaven'
    kind: scripture
    title: 'An oath sworn with both hands'
    body: |
      The answer to “How long?” is given under oath, and the two raised hands mark how solemn the oath is. The man clothed in linen is the figure whose appearance opened this vision ([[Dan. 10:5]]). “Commonly he who swears lifts up only one hand,” as the Lord does in the song of Moses: “For I lift up my hand to heaven, and say, I live for ever” ([[Deut. 32:40]]). Here, “with greater solemnity both hands are lifted up,” and the words “by him that liveth for ever” point back to that verse, where it is God who swears.

      In the Revelation of John an angel standing on sea and land “lifted up his hand to heaven” ([[Rev. 10:5]]) “and sware by him that liveth for ever and ever … that there should be time no longer” ([[Rev. 10:6]]). A revelation to Joseph Smith places that oath at the sounding of the seventh trump, when the angel shall “swear in the name of him who sitteth upon the throne, that there shall be time no longer” ([[D&C 88:110]]). The Church’s footnote on “sware” joins all three passages.
    sources: [keil-daniel, lds-scriptures]

  - ref: 7
    phrase: 'a time, times, and an half'
    kind: words
    title: 'A time, times, and a half, and the shattered power'
    body: |
      The answer has two parts: a period of three and a half “times,” and an event that marks its end. The first is the Hebrew for “a set time, times, and a half.” It repeats in Hebrew what chapter 7 said in Aramaic, where the saints are given into the hand of a persecutor “until a time and times and the dividing of time” ([[Dan. 7:25]]). John uses the measure again for the time the woman is kept in the wilderness, “a time, and times, and half a time” ([[Rev. 12:14]]).

      The second part is stronger in Hebrew than in the King James Version. Where the translation has “scatter the power of the holy people,” the Hebrew as it stands is read “shattering the hand (figurative for power) of the holy people.” The form is uncertain, and with a small change it would read “shatterer of the holy people.” The Church’s footnote on “scatter” reads this of the scattering of Israel. It points to the Savior’s prophecy that the people “shall be led away captive into all nations” ([[Luke 21:24]]) and to Nephi’s teaching that the house of Israel “will be scattered upon all the face of the earth” ([[1 Ne. 22:3]]).

      What length of time the phrase stands for has not been revealed (see the note on verse 11).
    sources: [bdb, oshb-wlc, lds-scriptures]

  - ref: 11
    phrase: 'the abomination that maketh desolate'
    kind: scripture
    title: 'The abomination that maketh desolate'
    body: |
      This phrase returns from the previous chapter, and the Savior named Daniel when He applied it twice: to the Roman siege of Jerusalem in A.D. 70 ([[JS—M 1:12]]) and again to the last days ([[JS—M 1:32]]). The note on [[Dan. 11:31]] gives the full account.

      In this verse the phrase is a starting point for counting days. The count is the subject of the next note.
    sources: [bd-abomination-of-desolation, lds-scriptures]

  - ref: 11
    phrase: 'a thousand two hundred and ninety days'
    kind: prophets
    title: 'The numbers have not been explained'
    body: |
      The chapter gives three measures of time, and the Lord has not revealed what any of them means. They are “a time, times, and an half” (verse 7), 1,290 days (verse 11), and 1,335 days (verse 12), the last being forty-five days longer than the one before it. Daniel himself heard the first and “understood not.” He asked, and was told to go his way.

      Readers since have been in the same position: “The interpretation of the time periods mentioned in these verses has not been revealed by the Lord as yet,” and the many calculations offered have “each in their turn” been proven wrong. One of them in Joseph Smith’s day was William Miller’s, whose prediction of the Savior’s return in 1844 “came from an interpretation of this passage in Daniel.”

      Joseph Smith answered it in a sermon of 10 March 1844. He prophesied “that Christ will not come this year as William Miller has prophecyed,” and gave the principle behind the prophecy: “Jesus Christ never did reveal to any man the precise time that he would come.” He had asked the question himself. “I was once praying very earnestly to know the time of the coming of the Son of Man” ([[D&C 130:14]]), another of his teachings records, and the answer he received told him to “let this suffice, and trouble me no more on this matter” ([[D&C 130:15]]).
    sources: [ot-manual-28, jsp-discourse-1844-03-10, lds-scriptures]

  - ref: 13
    phrase: 'stand in thy lot'
    kind: words
    title: 'Daniel’s own resurrection'
    body: |
      The book’s last sentence promises Daniel rest and then a share of his own at the end. The Church’s edition gives “rise unto your destiny” as another rendering of “stand in thy lot,” and its footnote on “rest” points to paradise.

      A “lot” is a share that has been assigned. The Hebrew word is used for a “thing assigned, apportioned, allotted,” and especially for land assigned by lot, as when the promised land was divided in the book of Joshua. In this verse it is an “allotted portion, share, in the Messianic consummation.”

      “Stand” is the verb the chapter began with. Michael is to “stand up” for the people in verse 1, and at the end Daniel is to “stand.”
    sources: [bdb, oshb-wlc, lds-scriptures]

christ: |
  The resurrection Daniel is shown comes through Jesus Christ. “The Resurrection shall come to all, because of Christ’s victory over death.” When the Savior taught the two resurrections of verse 2 in His own words, He said that those in the graves “shall hear his voice” ([[John 5:28]]).

  Michael, who stands up for the people here, is the one who at the end overcomes the enemy who seeks the throne of “the Lamb” ([[D&C 88:115]]).

explore: |
  - Isaiah’s earlier word on the dead who awake from the dust, with its notes on this site: [[Isa. 26:19]].
  - The Savior’s own use of Daniel, for the destruction of Jerusalem and for the last days: [[JS—M 1:12–18]] and [[JS—M 1:32–36]].
  - Michael at the end of the world: [[D&C 88:110–115]] and [[D&C 29:26]].
  - The vision that opened on the Savior’s words about the two resurrections: [[D&C 76:15–17]].
  - The same wise ones before their reward: [[Dan. 11:32–35]].
  - Where this vision began, with the man clothed in linen: [[Dan. 10:4–14]].

