chapter: 8
title: The Ram, the Goat, and the Little Horn
tagline: Daniel is shown two empires as a ram and a goat, and a king who will stop the temple’s daily offering. Gabriel explains the vision, and Daniel still cannot take it in.
when: 'The third year of Belshazzar (8:1), two years after the vision of chapter 7. Babylon still stood; Cyrus took it in 539 B.C.'

setting: |
  Daniel dates this vision to “the third year of the reign of king Belshazzar,” two years after the vision of the four beasts, which came in “the first year of Belshazzar king of Babylon” ([[Dan. 7:1]]). Both visions therefore come before the stories of chapters 5 and 6. The man who reads the writing on the wall has already been shown what follows Babylon. Who Belshazzar was is told at [[Dan. 5:1]]. Babylon was still standing; Cyrus did not take it until 539 B.C.

  With this chapter the book returns to Hebrew, after the Aramaic of 2:4–7:28 (see [[Dan. 2:4]]).

  The vision returns to kingdoms the earlier visions showed (on one reckoning, “the second and third empires spoken of in Daniel 7”), and it does what those visions did not: it names them, Media and Persia, and Grecia (verses 20–21). Most of what it describes “was fulfilled between 500 B.C. and the time of Christ,” centuries of which the Old Testament records very little.

  Here also an angel is named. Gabriel is sent to make Daniel understand, and he will come again in the next chapter ([[Dan. 9:21]]); who he is belongs to the note on verse 16.

thread: |
  The chapter has two halves that answer each other: what Daniel sees (verses 3–14) and what Gabriel says it means (verses 20–26). Read the second beside the first and most of the images have their key in the text itself.

  The vision moves on one verb. The ram “became great.” The goat “waxed very great.” The little horn “waxed exceeding great,” then “waxed great, even to the host of heaven,” and at last “magnified himself even to the prince of the host.” In Hebrew it is the same verb each time, *gadal*, and it comes once more in Gabriel’s explanation, where the king shall “magnify himself in his heart.” Each power is larger than the one before, and each is broken at its height. The ram is thrown down. The great horn snaps “when he was strong.” The last king, who climbs highest, “shall be broken without hand.”

  So the chapter’s question is the one a holy one asks in verse 13: “How long?” The answer is a number and a promise. The number has not been explained. The promise is plain: the sanctuary will be set right, and the king who stands up against the Prince of princes will fall with no hand laid on him.

sections:
  - range: 1-2
    heading: At Shushan, by the Ulai
    plain: |
      In the third year of king Belshazzar a vision came to me, Daniel, after the one I had seen before. In the vision I saw myself in the palace at Shushan, in the province of Elam, and I was beside the Ulai watercourse.
  - range: 3-4
    heading: The ram
    plain: |
      I looked up and saw a ram standing in front of the watercourse. It had two tall horns. One was taller than the other, and the taller one came up last. I watched the ram butt its way west, north, and south. No animal could stand against it and no one could rescue anything from its power. It did as it pleased and grew great.
  - range: 5-8
    heading: The goat from the west
    plain: |
      While I was thinking about this, a male goat came from the west across the whole earth without touching the ground. It had a conspicuous horn between its eyes. It came at the two-horned ram I had seen by the watercourse and ran at it in the fury of its strength. I saw it close with the ram, enraged, and strike it and break both its horns. The ram had no strength to stand. The goat threw it to the ground and trampled it, and no one could rescue the ram. Then the goat grew very great. But when it was strong the great horn was broken, and instead of it four conspicuous horns came up toward the four winds of heaven.
  - range: 9-12
    heading: The little horn
    plain: |
      Out of one of them came a little horn that grew very great toward the south, toward the east, and toward the beautiful land. It grew up to the host of heaven, threw some of the host and some of the stars to the ground, and trampled them. It made itself great even against the prince of the host. The daily offering was taken away from him, and the place of his sanctuary was thrown down. Because of transgression a host was given to it against the daily offering. It threw truth to the ground, and whatever it did succeeded.
  - range: 13-14
    heading: “How long?”
    plain: |
      Then I heard a holy one speaking, and another holy one asked the one who spoke, “How long does the vision last, with the daily offering, the transgression that lays waste, and the sanctuary and the host given over to be trampled?” He said to me, “For two thousand three hundred evenings and mornings. Then the sanctuary will be set right.”
  - range: 15-19
    heading: Gabriel is sent
    plain: |
      When I, Daniel, had seen the vision and was trying to understand it, someone who looked like a man stood in front of me. I heard a man’s voice from between the banks of the Ulai call out, “Gabriel, make this man understand the vision.” He came near where I stood, and I was terrified and fell on my face. He said, “Understand, son of man: the vision is for the time of the end.” While he spoke I lay in a deep sleep with my face to the ground, but he touched me and stood me on my feet. He said, “I will tell you what will happen in the latter part of the period of indignation, for the end will come at its appointed time.”
  - range: 20-22
    heading: The ram and the goat explained
    plain: |
      “The ram you saw with two horns is the kings of Media and Persia. The rough goat is the king of Grecia, and the great horn between its eyes is the first king. That horn was broken and four stood up in its place: four kingdoms will rise out of his nation, but without his power.”
  - range: 23-26
    heading: The king of fierce countenance
    plain: |
      “In the latter time of their rule, when the transgressors have filled their measure, a king will arise with a hard face, a man who understands riddles. His power will be great, but not by his own power. He will destroy astonishingly, succeed in what he does, and destroy the mighty and the holy people. By his cunning he will make deceit prosper in his hand. He will be great in his own heart, and in a time of peace he will destroy many. He will even stand up against the Prince of princes, and he will be broken without a hand. The vision of the evenings and the mornings that was told is true. Shut up the vision, for it is for days far off.”
  - range: 27
    heading: Daniel afterward
    plain: |
      I, Daniel, fainted and was sick for some days. Then I got up and went about the king’s business. I was astonished at the vision, and no one understood it.

notes:
  - ref: 2
    phrase: I was at Shushan in the palace
    kind: history
    title: Daniel is set down in Shushan in vision
    body: |
      Daniel is in Shushan in the vision, not on a journey: the verse says twice that he “saw in a vision,” and a modern translation renders it “In the vision I saw myself in Susa the capital.” Ezekiel was moved the same way, when the spirit “brought me in the visions of God to Jerusalem” ([[Ezek. 8:3]]). At the word “river” the Church’s footnote adds Nephi, “caught away in the Spirit of the Lord” ([[1 Ne. 11:1]]). The other reading is old: Josephus, retelling Daniel’s visions, has him “in Susa, the metropolis of Persia,” walking out into the field with companions.

      The place belongs to what he is about to see. Shushan, also called Susa, was “formerly the capital of Elam” and “under Cyrus the capital of the Persian Empire.” It is the Shushan of Nehemiah and Esther ([[Neh. 1:1]]; [[Esth. 1:2]]). Daniel is set in the capital of the kingdom the ram stands for, to watch that kingdom rise and fall: “in the future royal citadel of the Persian kingdom,” that there “he might witness the destruction of this world-power, as Ezekiel was removed to Jerusalem.”
    sources: [nrsvue, josephus-antiquities, bd-shushan, keil-daniel, lds-scriptures]
  - ref: 3
    phrase: a ram which had two horns
    kind: symbol
    title: The ram and the goat are named in the chapter itself
    body: |
      The ram is “the kings of Media and Persia” and the goat “the king of Grecia,” on Gabriel’s word in verses 20–21, and the details are read from the history that followed. Of the ram’s two horns the higher “came up last,” and it is taken for “the Persians, who finally dominated the alliance.” The Persians were at first “a tribe” living east of Elam, and it was Cyrus the Persian who “gained possession of Media, which he united with the Persian kingdom.” The empire he founded “extended from Afghanistan to the Mediterranean.”

      The goat comes “from the west.” The “first king” of verse 21 is taken to be Alexander of Macedon, “born 356 B.C., died 323 B.C.” Judea and the other Persian provinces passed into his hands in 334 B.C., and he ruled “from Greece to the Indus.” He died at thirty-two, at the height of his power, and verse 8 has it in a clause: “when he was strong, the great horn was broken.”

      Gabriel says that four kingdoms would stand up “out of the nation, but not in his power.” After Alexander’s death “his four chief generals carved up the empire,” and they “seem to be” the four horns. Daniel’s last vision has a mighty king whose realm is “divided toward the four winds of heaven; and not to his posterity” ([[Dan. 11:4]]), the verse the Church’s footnote sets beside this one. Josephus understood the four horns as “the successors that should arise after the death of the first King; and the partition of the Kingdom among them.”
    sources: [ot-manual-28, bd-media, bd-persia, bd-alexander, josephus-antiquities, lds-scriptures]
  - ref: 9
    phrase: a little horn
    kind: history
    title: The little horn and Antiochus Epiphanes
    body: |
      The little horn “has generally been interpreted to represent Antiochus IV (Epiphanes), who ruled Syria 175–164 B.C.” He was “a Seleucid king.” Seleucus, one of Alexander’s generals, had “conquered Syria and the northern part of the Middle East.” Gabriel’s own words set the frame: a king who rises “in the latter time” of the four kingdoms (verse 23), out of one of them, and who turns toward “the pleasant land.”

      What Antiochus did fits closely. He “resolved to try to crush all that was distinctive of Jewish nationality and worship.” The temple was plundered. Sabbath keeping and circumcision “were forbidden on penalty of death.” Josephus adds that he raised an idol altar on the altar of God and “slew swine upon it,” and Josephus read this chapter as fulfilled in him: “our nation suffered these things under Antiochus Epiphanes, according to Daniel’s vision.” The revolt that followed was led by “an aged priest named Mattathias” and then by “his son Judas, surnamed Maccabaeus,” under whom “the new altar was dedicated amid great rejoicing.”

      Two cautions belong here. First, this is not plainly the little horn of chapter 7, though the Church’s footnote sets the two verses side by side. That horn grows on the fourth beast, among ten horns ([[Dan. 7:7–8]]). This one grows on the goat, out of one of four. On the reckoning that takes this chapter to treat “the second and third empires spoken of in Daniel 7,” the two horns belong to different kingdoms. Second, Antiochus is an identification made by readers, ancient and modern. The text names no one, and the reading that names him goes on to say that he “seems to have been a type” of something larger (see the note on verse 19).

      Some critics have dated the chapter itself to Antiochus’s days, “shortly before the re-consecration of the temple, or immediately thereafter”; against that dating stands the observation that the chapter “contains no hint whatever of the great victories of the Maccabees.” The Church’s sources treat the visions as Daniel’s own, seen by him and reported in his name, and this chapter follows them.
    sources: [ot-manual-28, ot-manual-kings-k, bd-antiochus-epiphanes, bd-maccabees, josephus-antiquities, keil-daniel, bd-daniel-book, lds-scriptures]
  - ref: 9
    phrase: the pleasant land
    kind: words
    title: The pleasant land is the land of Israel
    body: |
      “The pleasant land” is a single Hebrew word, *ha-tsevi*, “the beauty,” a word used “of land of Israel” and in this verse “especially of Jerusalem and temple.” Ezekiel has the same word where the Lord calls the promised land “the glory of all lands” ([[Ezek. 20:6]]). Daniel’s last vision uses it three more times, for “the glorious land” ([[Dan. 11:16]]; [[Dan. 11:41]]) and “the glorious holy mountain” ([[Dan. 11:45]]). A modern translation has “the beautiful land” here.

      So the horn’s third direction is not a point of the compass like the first two. After the south and the east, the vision names a place: the land of Israel, and above all Jerusalem and its temple.
    sources: [bdb, oshb-wlc, nrsvue]
  - ref: 10
    phrase: the host of heaven
    kind: symbol
    title: The host, the stars, and the prince of the host
    body: |
      Where the vision has the horn throwing down the host and the stars, Gabriel’s explanation has the king destroying “the mighty and the holy people” (verse 24). The phrase “host of heaven” by itself can mean the “host (organized body) of angels,” though some take it in this verse as “figurative of Israel.” A Latter-day Saint reading of the stars is given in the note on verse 19.

      The assault does not stop at the people. The horn magnifies itself “even to the prince of the host,” and it is his daily offering and “his sanctuary” that are taken (verse 11). The title is close to that of the figure who met Joshua before Jericho, “captain of the host of the Lord” ([[Josh. 5:14]]); it is made of the same two Hebrew words. Who the prince is in this verse is read two ways, as the “angel-prince of Israel” or as God. Where Gabriel’s explanation reaches the same point, it calls the king’s last opponent “the Prince of princes” (verse 25).
    sources: [bdb, oshb-wlc, lds-scriptures]
  - ref: 11
    phrase: the daily sacrifice
    kind: words
    title: The daily sacrifice is the continual burnt offering
    body: |
      The Hebrew has no word for “sacrifice” here. It says only *ha-tamid*, “the continual,” which in late Hebrew stood alone for the “daily (morning and evening) burnt-offering.” That is the offering commanded at Sinai: two lambs “day by day continually” ([[Ex. 29:38]]), “a continual burnt offering throughout your generations at the door of the tabernacle of the congregation before the Lord: where I will meet you” ([[Ex. 29:42]]). “Continual” in that verse is the same word.

      The command ties the *tamid* to the place where the Lord said He would meet His people, and it is that daily offering which the horn removes. Josephus says of Antiochus that he “forbad them to offer those daily sacrifices which they used to offer to God, according to the law.”

      The word comes three times in this chapter (verses 11, 12, 13) and twice more in the book, both times beside “the abomination that maketh desolate” ([[Dan. 11:31]]; [[Dan. 12:11]]). The Church’s footnotes on this verse send the reader on to both.
    sources: [bdb, oshb-wlc, josephus-antiquities, lds-scriptures]
  - ref: 13
    phrase: one saint speaking
    kind: words
    title: The saints who speak are angels
    body: |
      The two “saints” are heavenly beings: the Hebrew is *qadosh*, “holy one,” a word used of angels, with this verse listed among the examples, and a modern translation has “Then I heard a holy one speaking.” Daniel is overhearing. The question is not his, though the answer is turned toward him: “he said unto me” (verse 14).

      In verse 24 the same word, in the plural, is “the holy people,” those whom the king destroys. The chapter uses one word for the holy ones who speak in heaven and the holy ones who suffer on earth.
    sources: [bdb, oshb-wlc, nrsvue]
  - ref: 14
    phrase: two thousand and three hundred days
    kind: words
    title: Two thousand three hundred evenings and mornings
    body: |
      Where the King James Version has “days,” the Hebrew has two words set side by side, *erev boqer*, “evening morning,” and Gabriel later calls the whole “the vision of the evening and the morning” (verse 26). So unusual a measure was probably chosen with an eye to the creation week, in which “the evening and the morning were the first day” ([[Gen. 1:5]]), and to the daily offering of the note on verse 11, made morning and evening.

      Interpreters have divided over what is being counted. Some understand “days consisting of morning and evening.” Others hold that the phrase is “reckoned with reference to the offering of a morning and an evening sacrifice each day,” which would halve the number of days. The figure itself was not handed down in one form: Brenton’s Septuagint reads “two thousand and four hundred days.” No reckoning has been confirmed by revelation. Of the related periods in chapter 12 it is said that their interpretation “has not been revealed by the Lord as yet,” and that the calculations offered have been proven wrong “each in their turn.” Nothing more is given for this number, and no calculation is made here.

      What the verse says plainly is its last clause. “Cleansed” translates a verb that “primarily means to be just”; here, “the holy place shall be put right, in a right condition.” The answer to “How long?” is a limit and a restoration: the end “is determined beforehand by God.”
    sources: [oshb-wlc, bdb, keil-daniel, lxx-rahlfs, ot-manual-28, lds-scriptures]
  - ref: 16
    phrase: Gabriel
    kind: prophets
    title: Gabriel is Noah
    body: |
      Gabriel is Noah. “Then to Noah who is Gabriel,” Joseph Smith taught in the summer of 1839, “he stands next in authority to Adam.” The same discourse says why such men return as messengers: “These men held keys first on earth & then in heaven.” The name is given as “Man of God,” and Noah “holds the keys of a dispensation.”

      So the one sent to Daniel is the patriarch who was “saved from the Flood,” and who, the Prophet said, “was the father of all living” in his day. He comes to Daniel again in the next chapter ([[Dan. 9:21]]). He is the angel who tells Zacharias, “I am Gabriel, that stand in the presence of God” ([[Luke 1:19]]), and who is sent to Mary ([[Luke 1:26]]). “The voice of Gabriel” is named among the voices heard in this dispensation ([[D&C 128:21]]).

      Notice also how the explanation comes. Daniel does not work the vision out. “A man’s voice between the banks of Ulai” orders Gabriel to make him understand. Daniel is “guided through his visions by angelic messengers” here and in the visions that follow, and the visions of Lehi and Nephi are of the same kind.
    sources: [jsp-discourse-1839-a, bd-gabriel, bd-noah, sc-knowhy-492, lds-scriptures]
  - ref: 17
    phrase: fell upon my face
    kind: scripture
    title: Why Daniel falls, and why he is stood on his feet
    body: |
      Daniel’s falling, his deep sleep, and his sickness afterward show what the vision cost him, and scripture shows other prophets overcome in the same way. He falls on his face when Gabriel comes near, lies “in a deep sleep” while Gabriel speaks, and afterward “fainted, and was sick certain days” (verse 27). “Falling in weakness after a vision of God is a common motif in scripture.” Lehi “cast himself upon his bed, being overcome with the Spirit” ([[1 Ne. 1:7]]). Joseph Smith, when the light had departed, “had no strength” ([[JS—H 1:20]]). Daniel says the same of his last vision ([[Dan. 10:8–9]]).

      The touch matters as much as the fall. Gabriel “touched me, and set me upright” before he explains anything. Prophets in scripture are often “grasped by the hand of an angel and raised to a standing position in key moments of their heavenly visions,” and one Latter-day Saint scholar reads the gesture this way: “It is by being raised by the hand to the upright position that we are made ready to hear the word of the Lord.” Ezekiel was told the same: “Son of man, stand upon thy feet, and I will speak unto thee” ([[Ezek. 2:1]]).

      “Son of man” in this verse is Daniel. As in Ezekiel, the Hebrew is *ben adam*, for which a modern translation has “O mortal”: Daniel is addressed as a man standing before a messenger from heaven. It is not the title of the “one like the Son of man” whom Daniel saw in the vision before this one ([[Dan. 7:13]]).
    sources: [bradshaw-holy-place, sc-knowhy-469, nrsvue, oshb-wlc, lds-scriptures]
  - ref: 19
    phrase: the last end of the indignation
    kind: scripture
    title: How far the vision reaches
    body: |
      Gabriel says that the vision is for “the time of the end” (verse 17) and that he will show “what shall be in the last end of the indignation” (verse 19), and the Church’s edition takes him at his word. Its footnote explains this phrase as “in the latter part of the period of indignation, or in the last days,” and its chapter heading places the fierce king “in the last days.” The chapter is therefore read on two levels, in this order. The first is the history Gabriel names: Persia, Greece, four kingdoms, and a king out of one of them, who “has generally been interpreted” as Antiochus (see the note on verse 9). The second reaches past him. That the prophecy “refers to more than just the time up through the Maccabean period” is drawn from this verse and from verse 26 (see the note there).

      The Hebrew leaves room for both. “Last end” here and “latter time” in verse 23 are the same word, *acharit*. In the prophets’ fuller phrase for the end of the days it denotes “the final period of the history so far as the speaker’s perspective reaches,” so that “the sense thus varies with the context.”

      How the second level is filled in is not settled. On one Latter-day Saint reading Antiochus “seems to have been a type of those who function through the power of Satan,” and the “stars of heaven” the horn casts down (verse 10) are “the children of God,” as in Job’s “the morning stars sang together, and all the sons of God shouted for joy” ([[Job 38:7]]) and John’s dragon, whose tail “drew the third part of the stars of heaven, and did cast them to the earth” ([[Rev. 12:4]]). Another took the horn to point also to the “church of the devil”: “What Antiochus was to the Jews during the time of the Maccabees, the ‘church of the devil’ has been to the ‘Church of Christ’ in all ages.” Elder Parley P. Pratt applied the passage to Rome, which “caused the daily sacrifice to cease” and afterward slew “the apostles and primitive Christians.” None of these readings names a ruler or a nation of the present day, and nothing here does either.
    sources: [lds-scriptures, ot-manual-28, bdb, oshb-wlc]
  - ref: 25
    phrase: he shall be broken without hand
    kind: scripture
    title: Broken without hand
    body: |
      The king’s end comes “without hand,” or, as a modern translation has it, “not by human hands.” The Church’s footnote on the word sends the reader to the stone “cut out without hands” that struck the image in Nebuchadnezzar’s dream ([[Dan. 2:34]]) and to its latter-day use, “the stone which is cut out of the mountain without hands shall roll forth” ([[D&C 65:2]]).

      A verse earlier the same is said of the king’s rise: his power is mighty, “but not by his own power” (verse 24). The text does not say whose power it is.

      For those who read the king as Antiochus, the detail fits. He did not fall in battle against the people he had persecuted. Josephus says he was driven off from a temple in Persia that he meant to plunder, heard that his commanders had been defeated in Judea, “fell into a distemper,” and before he died “confessed withal that this calamity was sent upon him for the miseries he had brought upon the Jewish nation.” Josephus knew that Polybius gave another cause and declined to “contend about this matter.”
    sources: [lds-scriptures, nrsvue, josephus-antiquities]
  - ref: 26
    phrase: shut thou up the vision
    kind: words
    title: Shutting up the vision
    body: |
      To “shut up” the vision is to keep it close: the verb, *satam*, is used of prophetic words in the sense “shut up, keep close.” The reason given is distance. “It shall be for many days,” which the Church’s footnote explains as “pertains to many days hereafter.” The command returns at the end of the book with the same verb and a second beside it: “shut up the words, and seal the book, even to the time of the end” ([[Dan. 12:4]]), for “the words are closed up and sealed till the time of the end” ([[Dan. 12:9]]).

      The next verse shows what that looks like. Daniel has had the vision explained by an angel and still writes that “none understood it.” By the end of the book Daniel’s record is spoken of as “a heavenly book about future events that he was instructed to seal up,” set beside the book that Lehi was given to read in his first vision ([[1 Ne. 1:11]]).
    sources: [bdb, oshb-wlc, lds-scriptures, sc-knowhy-469]

christ: |
  The king’s last act is to “stand up against the Prince of princes,” and that Prince “is Christ.” What Gabriel says of Him is brief. The king grows great in his own heart, destroys “the mighty and the holy people,” and at last stands up against Him; then the king is “broken without hand.”

  In the vision the same place is held by “the prince of the host” (verse 11), whose daily offering and sanctuary the horn takes. Who that prince is has been read in more than one way (see the note on verse 10).

explore: |
  - **The same history told again.** [[Dan. 11:2–4]] has the kings of Persia, the mighty king, and the kingdom divided to the four winds; [[Dan. 11:21–35]] has the persecuting king.
  - **The same kingdoms in the earlier visions.** [[Dan. 2:39]]; [[Dan. 7:5–6]], on the reckoning that counts them second and third.
  - **Gabriel’s later errands.** [[Dan. 9:20–27]]; [[Luke 1:11–20]]; [[Luke 1:26–38]].
  - **The continual burnt offering.** [[Ex. 29:38–46]].
  - **The centuries this chapter foresees.** “Between the Testaments,” Enrichment K of the Church’s *Old Testament Student Manual: 1 Kings–Malachi*, is a short history of Alexander, the Ptolemies and Seleucids, Antiochus, and the Maccabees.
  - **What comes next.** [[Dan. 9:1–3]]: Daniel reads Jeremiah and prays.

parallels:
  - ref: Dan. 11:3–4
    note: The mighty king whose kingdom is “divided toward the four winds of heaven,” the history of verses 8 and 22 told without the animals. The Church’s footnotes at 8:8 and 8:22 give these verses.
  - ref: Luke 1:19
    note: “I am Gabriel, that stand in the presence of God.” The Church’s footnote at 8:16 gives this verse.
  - ref: D&C 128:21
    note: “The voice of Gabriel” is among the voices heard in this dispensation.
  - ref: 1 Ne. 11:1
    note: Nephi is “caught away in the Spirit of the Lord” to a place he had never seen, as Daniel is set down in Shushan. The Church’s footnote at 8:2 gives this verse.
  - ref: D&C 65:2
    note: The stone “cut out of the mountain without hands,” which the Church’s footnote at 8:25 sets beside “broken without hand.”

