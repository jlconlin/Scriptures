chapter: 6
title: 'The Den of Lions'
tagline: 'A decree that cannot be changed sends Daniel to the lions, and the king who signed it cannot save him. In the morning Darius writes a second decree, about a God who “delivereth and rescueth.”'
when: 'Undated in the text. It follows the fall of Babylon in 539 B.C., when “Darius the Median took the kingdom” (5:31); chapter 9 is dated to the first year of the same Darius (9:1).'

setting: |
  Babylon has fallen. On the night Belshazzar was killed, “Darius the Median took the kingdom, being about threescore and two years old” ([[Dan. 5:31]]). The Hebrew Bible counts that verse as the first verse of this chapter, so the story opens with the change of rulers. Cyrus of Persia conquered Babylon in 539 B.C., and the chapter’s last verse places the reign of Darius before his.

  Daniel was carried to Babylon as a young man, and by the first year of Darius nearly seventy years had passed. He has outlasted the empire that took him captive, and the new government gives him high office.

  This is the last of the book’s stories; the visions begin in chapter 7. Like chapter 3, it tells of a rescue from a king’s sentence. There Daniel’s three friends refused an act of worship that a king commanded; here Daniel refuses to stop an act of worship that a king has forbidden. The book’s stories of deliverance each show the rescue “to be brought about by the blessing of God because of their faithfulness.”

thread: |
  The chapter is about who is able to deliver, and it answers by showing a king who is not.

  Darius wishes Daniel well and cannot help him. The officials come crowding in three times. Twice they press the king, and twice he gives way. Once he has signed, he is bound by “the law of the Medes and Persians, which altereth not,” and the law holds him as firmly as it holds Daniel. He spends the day trying to deliver Daniel and fails (verse 14). He then sends Daniel to the den with words about Daniel’s God (see the note on verse 16), seals the stone, and goes home to a night without food or sleep.

  In the morning the king’s own decree says of God, “He delivereth and rescueth.” What the king could not do in a day, God has done in a night.

  Daniel does very little in his own story. He goes home and prays “as he did aforetime,” and he speaks only once, from the den. The narrator gives the reason for the outcome in a single clause: “because he believed in his God.”

  The decree that could not be changed is answered at the end by another decree, about a God who is “steadfast for ever” and a kingdom “which shall not be destroyed.”

sections:
  - range: 1-3
    heading: 'Daniel set above the others'
    plain: |
      Darius decides to appoint a hundred and twenty satraps over the whole kingdom, and three chief officers over them, Daniel being one. The satraps are to report to these three, so that the king suffers no loss. Daniel soon stands out above the other chief officers and the satraps, because there is an extraordinary spirit in him, and the king plans to put him over the whole realm.
  - range: 4-9
    heading: 'The decree'
    plain: |
      The chief officers and satraps look for some ground of complaint against Daniel in his handling of the kingdom’s affairs. They find no ground for complaint and no fault, because he is faithful. They conclude that they will never find anything against him unless it has to do with the law of his God.

      So they come crowding in to the king. “King Darius, live for ever. All the chief officers, the governors, the satraps, the counsellors, and the captains have agreed that the king should issue a statute and enforce a ban: whoever makes a petition to any god or man for thirty days, except to you, O king, shall be thrown into the den of lions. Now, O king, establish the ban and sign the document, so that it cannot be changed, according to the law of the Medes and Persians, which cannot be revoked.” King Darius signs it.
  - range: 10-17
    heading: 'Daniel prays, and is thrown to the lions'
    plain: |
      Daniel learns that the document has been signed. He goes home, where the windows of his upper room open toward Jerusalem, and three times a day he kneels, prays, and gives thanks to his God, just as he had always done. The men come crowding in and find him praying and asking mercy of his God.

      They go to the king and ask about his ban: did he not sign it? He answers that the thing stands, by the law of the Medes and Persians, which cannot be revoked. Then they tell him that Daniel, one of the exiles from Judah, pays no attention to him or to his ban and makes his petition three times a day.

      The king is deeply displeased with himself. He sets his mind on saving Daniel and works at it until sunset. The men crowd in on him again and remind him that by the law of the Medes and Persians no ban or statute the king establishes may be changed. So the king gives the order, and Daniel is brought and thrown into the den of lions. The king speaks to him of his God, whom he serves continually, and of deliverance. A stone is laid over the mouth of the den, and the king seals it with his own signet and with the signets of his lords, so that nothing about Daniel may be changed.
  - range: 18-23
    heading: 'The night and the morning'
    plain: |
      The king goes to his palace and spends the night fasting. No entertainment is brought to him, and he cannot sleep. At first light he gets up and hurries to the den. As he comes near he calls out in an anguished voice: “Daniel, servant of the living God, has your God, whom you serve continually, been able to deliver you from the lions?”

      Daniel answers, “O king, live for ever. My God sent His angel and shut the lions’ mouths, and they have not hurt me, because I was found innocent before Him; and before you also, O king, I have done no wrong.” The king is overjoyed and orders Daniel lifted out of the den. He is lifted out, and no injury of any kind is found on him, because he trusted in his God.
  - range: 24-28
    heading: 'The accusers, and the king’s second decree'
    plain: |
      At the king’s command the men who accused Daniel are brought and thrown into the den of lions, with their children and their wives. Before they reach the bottom the lions overpower them and crush all their bones.

      Then King Darius writes to all peoples, nations, and languages in all the earth: “Peace be multiplied to you. I decree that in every dominion of my kingdom people are to tremble and fear before the God of Daniel. He is the living God and endures for ever; His kingdom will not be destroyed, and His dominion will last to the end. He delivers and rescues, and He works signs and wonders in heaven and on earth. He has delivered Daniel from the power of the lions.”

      So Daniel prospers in the reign of Darius and in the reign of Cyrus the Persian.

notes:
  - ref: 1
    phrase: 'Darius'
    kind: history
    title: 'Darius the Median'
    body: |
      This king has not been matched with a ruler in the records outside the Bible (see the note on [[Dan. 5:31]]).

      The book itself says little of him, and what it says is consistent. He is a Mede, “of the seed of the Medes,” and he “was made king over the realm of the Chaldeans” ([[Dan. 9:1]]). The verb in “Darius the Median took the kingdom” ([[Dan. 5:31]]) is the Aramaic *qabbel*, to “receive.” The text says he received a kingdom at about sixty-two, and it names “Cyrus the Persian” after him (verse 28).

      Josephus, retelling the chapter, tried to place him. He says Darius took Babylon “with his kinsman Cyrus,” that he “was the son of Astyages,” and that he “had another name among the Greeks,” which Josephus does not give. That is one ancient writer’s identification and nothing more. This chapter and the others that name him ([[Dan. 9:1]]; [[Dan. 11:1]]) treat him simply as the king.
    sources: [bd-darius, lds-scriptures, oshb-wlc, strongs-concordance, josephus-antiquities]

  - ref: 1
    phrase: 'an hundred and twenty princes'
    kind: words
    title: 'Satraps and presidents'
    body: |
      The “princes” are satraps, and the “presidents” are three chief officers set over them. The Aramaic word for the princes is the one modern translations give as “satraps.” The same Aramaic word headed the list of Nebuchadnezzar’s officials too ([[Dan. 3:2]]). The book of Esther later counts “an hundred and seven and twenty provinces” in the Persian empire ([[Esth. 1:1]]). “President” translates *sarak*, “chief, overseer,” probably a word borrowed from Persian, and the book uses it only in this chapter.

      The satraps “give accounts” to the three so that “the king should have no damage,” which a modern translation gives as “so that the king might suffer no loss.”

      Where the King James has “of whom Daniel was first,” the Aramaic word is the numeral “one,” and a modern translation gives “three administrators, one of whom was Daniel.” On Belshazzar’s last night he had been proclaimed “the third ruler in the kingdom” ([[Dan. 5:29]]). Verse 3 then gives the king’s plan to set him “over the whole realm,” above his two colleagues and all the satraps, and the plot begins from that.
    sources: [bdb, oshb-wlc, nrsvue, lds-scriptures]

  - ref: 3
    phrase: 'an excellent spirit was in him'
    kind: words
    title: 'An excellent spirit'
    body: |
      “Excellent” here means surpassing, beyond the ordinary, and the narrator is repeating what Babylon’s court had already said of Daniel. The Aramaic adjective is *yattir*, “pre-eminent, surpassing.” The queen used it on the night of the writing on the wall, when she spoke of “an excellent spirit” found in Daniel ([[Dan. 5:12]]), and Belshazzar repeated it, “excellent wisdom” ([[Dan. 5:14]]), alongside talk of the spirit of the gods. Here the narrator says it in his own voice and gives it as the reason for Daniel’s rise.

      Pharaoh said much the same of Joseph before setting him over all Egypt: “Can we find such a one as this is, a man in whom the Spirit of God is?” ([[Gen. 41:38]]). Both men are captives raised by foreign kings.
    sources: [bdb, oshb-wlc, lds-scriptures]

  - ref: 6
    phrase: 'assembled together'
    kind: words
    title: 'They came thronging'
    body: |
      The verb is stronger than “assembled”: the officials come in a noisy crowd, and they do it three times. The Aramaic *regash* means to “shew tumultuousness, come thronging.” The book uses it only in this chapter, at verses 6, 11, and 15: when the officials bring the decree to the king, when they burst in on Daniel at prayer, and when they return to the king at sunset to hold him to his signature.

      Translations render it in more than one way. One modern version gives “conspired and came” in verse 6 and “the conspirators came” in verse 15. At verse 11 it follows the ancient Greek, “these men watched,” and notes that the Aramaic says they “rushed in.”

      Daniel’s enemies have no case against him (verse 4); what they bring is numbers. Darius signs after the first crowding (verse 9) and gives the order after the third (verse 16).
    sources: [bdb, oshb-wlc, nrsvue, lxx-rahlfs]

  - ref: 7
    phrase: 'save of thee, O king'
    kind: history
    title: 'Why a king would sign such a decree'
    body: |
      The text does not give the king’s reason for signing, and the officials conceal theirs. What they tell him is flattering and false. They say that “all the presidents of the kingdom” have agreed, but there were three presidents and Daniel was one of them. He “certainly was not called to this consultation,” so their claim that all had consulted “was false.”

      One explanation of the decree is that it did not forbid every request one person might make of another. It “only referred to the religious sphere of prayer,” and it rested on the idea that the ruler stood for the gods of all the peoples he governed: “the king was the living manifestation of all the gods, not only of the Median and Persian, but also of the Babylonian and Lydian, and all the gods of the conquered nations.” For thirty days every subject was to approach his god through the king. On this explanation, most subjects could do so without any sense of betraying their gods; a worshipper of the God of Israel could not. That is a reconstruction, and the chapter neither confirms nor contradicts it.

      The chapter is clear about the aim. The officials had concluded that they could catch Daniel only “concerning the law of his God” (verse 5), and they built the decree around the one habit they knew he would not break.
    sources: [keil-daniel, lds-scriptures]

  - ref: 8
    phrase: 'the law of the Medes and Persians, which altereth not'
    kind: history
    title: 'A law the king himself cannot change'
    body: |
      A royal decree, once written and signed, bound the king who issued it. The chapter says so three times (verses 8, 12, and 15), and the story turns on it. The book of Esther knows the same rule at the Persian court. A decree is to be “written among the laws of the Persians and the Medes, that it be not altered” ([[Esth. 1:19]]), and what is written in the king’s name and sealed with his ring “may no man reverse” ([[Esth. 8:8]]).

      The officials ask for a signature and for the unalterable form of law (verse 8), and when Darius spends the day looking for a way out, they need only quote it to him (verse 15). He is “sore displeased with himself”: his own decree has bound him.
    sources: [lds-scriptures]

  - ref: 10
    phrase: 'his windows being open in his chamber toward Jerusalem'
    kind: scripture
    title: 'Praying toward Jerusalem, three times a day'
    body: |
      Daniel prays the way Solomon’s prayer at the dedication of the temple said exiles should. Solomon had asked the Lord to hear His people if, carried captive to an enemy’s land, they should “pray unto thee toward their land, which thou gavest unto their fathers, the city which thou hast chosen, and the house which I have built for thy name” ([[1 Kgs. 8:48]]). Daniel is exactly that case. By then the house was, in the words of his prayer from this same reign, “thy sanctuary that is desolate” ([[Dan. 9:17]]). He faces it anyway.

      A psalm speaks of the same three times of prayer: “Evening, and morning, and at noon, will I pray, and cry aloud: and he shall hear my voice” ([[Ps. 55:17]]).

      The verse insists that his practice did not change. The room is an upper room, with windows already “open toward Jerusalem,” and he prays “as he did aforetime,” or in a modern translation “just as he had done previously.” The verse also says what the prayer was. He “gave thanks,” on the day he learned that praying could cost him his life.

      Joseph Smith took Daniel’s practice as a mark of the kind of person the Twelve should seek out: “make yourselves acquainted with those men who like Daniel pray three times a day toward the House of the Lord.” The practice has been explained as a matter of where the heart is turned, with no special power in the direction itself.
    sources: [lds-scriptures, nrsvue, ot-manual-28]

  - ref: 16
    phrase: 'he will deliver thee'
    kind: words
    title: 'A promise or a wish'
    body: |
      The king’s words can be read as a statement of faith or as a wish, and translations divide. The King James makes it a statement, as the ancient Greek version does: “he will deliver thee.” A modern translation makes it a prayer: “May your God, whom you faithfully serve, deliver you!” It has also been read as a confession: here the king “confessed his belief that Daniel’s God could save him.”

      The scene that follows does not settle it. Darius fasts and cannot sleep, and at dawn his question is whether God has been “able to deliver.” The three in the furnace had said it without the question: “our God whom we serve is able to deliver us” ([[Dan. 3:17]]). The verb is the same Aramaic one in both chapters.

      That verb, *shezib*, “deliver,” carries the chapter. In verse 14 Darius sets his heart “to deliver” Daniel and labors until sunset “to deliver him.” The Aramaic there has two different verbs, *shezib* and *netsal*, “deliver, rescue,” and the king fails at both. In verse 27 he uses the same pair of God, in the same order: “He delivereth and rescueth.” He then adds *shezib* a last time, as a thing done: God “hath delivered Daniel from the power of the lions.”
    sources: [oshb-wlc, bdb, strongs-concordance, nrsvue, lxx-rahlfs, draper-exile, lds-scriptures]

  - ref: 17
    phrase: 'laid upon the mouth of the den'
    kind: history
    title: 'The den, the stone, and two seals'
    body: |
      The “den” is a pit, and the stone over its opening carries two seals. The Aramaic word, *gob*, means a “pit, den of lions.” The story’s own details fit a pit. Daniel is “cast” into it and “taken up out of” it, the accusers fall toward “the bottom,” and it has a “mouth” that one stone can close.

      Beyond that its shape is guesswork. “We have no account by the ancients of the construction of lions’ dens.” It has been pictured from a traveler’s report of lion pits in Morocco: an underground cavern open above, with a wall around the top “over which one can look down into the den,” and a door in the side for the keepers, which would be the “mouth” the stone covered. That would explain how Darius could call down to Daniel in the morning before the stone was removed. It is a suggestion, and the text does not describe the place.

      Two seals go on the stone, “his own signet” and “the signet of his lords,” and the verse says why: “that the purpose might not be changed concerning Daniel,” or “so that nothing might be changed concerning Daniel.” The Aramaic verb is the one used of the law in verses 8 and 15.
    sources: [bdb, keil-daniel, nrsvue, oshb-wlc]

  - ref: 22
    phrase: 'My God hath sent his angel'
    kind: scripture
    title: 'What Daniel says from the den'
    body: |
      This is Daniel’s only speech in the chapter, and it explains his survival the way Nebuchadnezzar explained the furnace. That king said that God “hath sent his angel, and delivered his servants that trusted in him” ([[Dan. 3:28]]). There a pagan onlooker drew the conclusion. Here the man who spent the night in the den says it. He does not say what he saw, and the text does not name the angel or describe him.

      Daniel then makes two claims of innocence and gives them as the reason he was spared (“forasmuch as”). Before God, “innocency was found in me.” The Aramaic *zaku* is “purity, innocence,” and here specifically “innocence in God’s sight.” Before the king he says something narrower: “have I done no hurt.” He does not say he kept the decree. The officials had told the king that Daniel “regardeth not thee, O king” (verse 13); Daniel answers that he has done the king no wrong.

      [“But If Not”](/daniel/themes/but-if-not/) sets this rescue beside the passages where no rescue is told.
    sources: [lds-scriptures, bdb]

  - ref: 23
    phrase: 'because he believed in his God'
    kind: words
    title: 'Faithful, and full of faith'
    body: |
      The narrator explains the rescue in one clause, and its verb is the verb that described Daniel at the start. “Believed” is a form of the Aramaic *aman*, “believe, faithful, sure,” and a modern translation renders the clause “because he had trusted in his God.” The same verb stands in verse 4, where the officials can find no fault in Daniel “forasmuch as he was faithful.” The chapter uses one word for his trustworthiness in the king’s service and for his trust in his God.

      Hebrews names no one, but among those who acted “through faith” it lists those who “stopped the mouths of lions” ([[Heb. 11:33]]).
    sources: [oshb-wlc, strongs-concordance, nrsvue, lds-scriptures]

  - ref: 24
    phrase: 'them, their children, and their wives'
    kind: history
    title: 'The accusers’ families'
    body: |
      The wives and children die with the accusers by the king’s command, and the chapter reports it without comment. Nothing in the text presents it as God’s judgment. The verse begins “the king commanded,” as verse 16 did, and Darius’s decree in verses 26–27 praises God for delivering Daniel and does not mention the accusers.

      Punishing a man’s household with him has been called “in accordance with Persian custom, as is testified by Herodotus.” Herodotus tells of a Persian king who suspected a noble of plotting rebellion, “seized Intaphrenes with his sons and all his household,” and, after sparing two at the wife’s plea, “put to death all the rest.” A probable motive has been suggested: to an absolute monarch it “probably seemed the logical thing to do,” since revolt might later come from such families.

      The law Daniel lived by forbade it: “The fathers shall not be put to death for the children, neither shall the children be put to death for the fathers: every man shall be put to death for his own sin” ([[Deut. 24:16]]). Darius acts here by the custom of his own court, not by that law.

      “Those men which had accused Daniel” need not be all hundred and twenty satraps: “the text states no number.” And “or ever” is old English for “before.” The lions “overpowered them” before they reached the floor of the pit.
    sources: [keil-daniel, herodotus-histories-3-119, ot-manual-28, nrsvue, lds-scriptures]

  - ref: 26
    phrase: 'his kingdom that which shall not be destroyed'
    kind: scripture
    title: 'The king’s second decree'
    body: |
      Darius’s second decree answers his first and repeats, in a foreign king’s voice, what Daniel told Nebuchadnezzar at the beginning of the book. The first decree stopped prayer to every god for thirty days. The second commands every dominion to “tremble and fear before the God of Daniel.”

      The words about the kingdom are the book’s own. Daniel had said that the God of heaven would set up “a kingdom, which shall never be destroyed” ([[Dan. 2:44]]), and the vision of the next chapter says of the one like the Son of man, “his kingdom that which shall not be destroyed” ([[Dan. 7:14]]). All three verses use one Aramaic verb, *chabal*, “destroy, hurt.”

      The decree has been read as a real advance on what the book’s earlier kings had confessed: “Jehovah no longer stood as one of the many gods nor as the head of the gods.” Nebuchadnezzar’s decree after the furnace had only forbidden speaking against this God, “because there is no other God that can deliver after this sort” ([[Dan. 3:29]]). Darius goes further and commands reverence. How much he himself came to believe is not said. He calls Him “the living God,” a title he first uses at the mouth of the den (verse 20), but He remains “the God of Daniel,” and the decree does not say that the king gave up his other gods (see the note on [[Dan. 2:47]]).

      [The Kingdom That Shall Never Be Destroyed](/daniel/themes/kingdom-never-destroyed/) follows these words through the book.
    sources: [oshb-wlc, bdb, draper-exile, lds-scriptures]

christ: |
  Daniel’s night in the den resembles the Savior’s trial, death, and Resurrection at several points. His enemies searched for a fault and found none, as the chief priests “sought for witness against Jesus to put him to death; and found none” ([[Mark 14:55]]). A ruler who wished to release him gave way to the men pressing him, as Pilate did. He was shut in a place closed with a stone and sealed, as the sepulchre was made sure, “sealing the stone, and setting a watch” ([[Matt. 27:66]]). Daniel came out alive in the morning; the Savior rose from the dead and came out of the tomb.

explore: |
  - The companion story, with a furnace in place of a den: [[Dan. 3]].
  - The prayer of Solomon that Daniel’s open windows answer: [[1 Kgs. 8:44–50]].
  - What Daniel prayed in the first year of this same Darius: [[Dan. 9:1–19]].
  - Another Persian decree that could not be reversed, and how it was met: [[Esth. 8:3–11]].
  - Joseph raised by Pharaoh because of the Spirit in him: [[Gen. 41:37–44]].
  - The kingdom that shall not be destroyed, before and after this chapter: [[Dan. 2:44]] and [[Dan. 7:13–14]].
  - The roll of those who acted “through faith”: [[Heb. 11:32–34]].

