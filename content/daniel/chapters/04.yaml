chapter: 4
title: 'The Tree Cut Down'
tagline: 'Nebuchadnezzar tells his own story: a dream of a tree that reached heaven, a year of warning, a boast in the palace, and a time among the beasts that ended when he looked up.'
when: 'Undated. Nebuchadnezzar was king of Babylon from 604 to 561 B.C.; the chapter finds him “at rest” in his palace, with the city he calls his own already built (verses 4 and 30).'

setting: |
  This is the last of three chapters about Nebuchadnezzar, and the only one he tells himself. In chapter 2 Daniel told him his dream of the image; in chapter 3 he threw three men into a furnace and saw them walk out. Here the king is the narrator, and the chapter has the form of a letter from him to “all people, nations, and languages.”

  It stands in the Aramaic part of the book (see [[Dan. 2:4]]), among the narratives of chapters 1–6. The Hebrew Bible counts the first three verses as the end of chapter 3, which cuts the letter’s greeting off from the story it introduces; the King James numbering, followed here, keeps the letter whole.

  The book returns to this story on the night Babylon falls, when Daniel retells it to Belshazzar as a thing he already knew and had not learned from ([[Dan. 5:18–22]]).

  The Church’s chapter heading calls what befalls the king his “fall and madness” (see the note on [[Dan. 4:33]]).

thread: |
  One sentence is said three times: “the most High ruleth in the kingdom of men, and giveth it to whomsoever he will.” A watcher from heaven says it in the dream (verse 17), Daniel says it in the interpretation (verse 25), and a voice from heaven says it over the palace (verse 32). Everything that happens to the king happens “till thou know” it. In verses 34–35 he says as much himself, “he doeth according to his will,” and the story is over.

  The chapter moves down and then up. The tree’s height “reached unto heaven” (verse 11); the king is brought down to the grass, “with the beasts of the field”; and he recovers at the moment he “lifted up mine eyes unto heaven” (verse 34). Heaven is where the tree aimed, where the sentence came from, and where the king finally looks.

  The letter is framed by praise. It opens, “his kingdom is an everlasting kingdom, and his dominion is from generation to generation” (verse 3), and it closes with nearly the same words (verse 34). Between the two stands the boast of verse 30, “by the might of my power, and for the honour of my majesty.” The king begins by praising the kingdom that lasts because he has learned that his own was given to him.

sections:
  - range: 1-3
    heading: 'A king’s letter to the world'
    plain: |
      Nebuchadnezzar the king writes to every people, nation, and language on earth and wishes them peace. He has decided to tell the signs and wonders the high God has done to him. They are great and mighty; God’s kingdom lasts forever, and His rule goes on from one generation to the next.
  - range: 4-9
    heading: 'The dream, and the wise men who could not read it'
    plain: |
      I was at ease at home and prospering in my palace when a dream frightened me. I ordered all the wise men of Babylon brought in to interpret it. The magicians, astrologers, Chaldeans, and soothsayers came, and I told them the dream, but they could not tell me what it meant. Last of all came Daniel, named Belteshazzar after my god, a man in whom is the spirit of the holy gods. I told him the dream and asked for its meaning, since no secret is too hard for him.
  - range: 10-18
    heading: 'The tree and the watcher'
    plain: |
      I saw a tree in the middle of the earth, very tall. It grew strong until its top reached heaven and it could be seen from the ends of the earth. Its leaves were beautiful and its fruit plentiful, enough to feed all; animals found shade under it, birds lived in its branches, and every creature ate from it. Then a watcher, a holy one, came down from heaven and cried aloud: Cut the tree down, lop its branches, strip its leaves, scatter its fruit, and let the animals and birds flee. But leave the stump and roots in the ground, bound with iron and brass, in the grass of the field. Let him be wet with dew and share the grass with the beasts. Let his heart be changed from a man’s to a beast’s, and let seven times pass over him. The watchers have decreed it, so that the living may know that the most High rules the kingdom of men, gives it to whom He will, and sets the lowliest of men over it. That was my dream. Now, Belteshazzar, tell me what it means, for no one else can.
  - range: 19-27
    heading: 'Daniel’s interpretation and counsel'
    plain: |
      Daniel was appalled for a time, and his thoughts troubled him. The king told him not to let the dream or its meaning trouble him. Daniel answered: My lord, I wish this dream were about your enemies. The tree you saw, tall, strong, and sheltering all, is you, O king. Your greatness reaches heaven and your rule the end of the earth. The decree of the most High is this: you will be driven from among men to live with the beasts and eat grass like an ox, wet with the dew, until seven times have passed and you know that the most High rules the kingdom of men and gives it to whom He will. The stump was left because your kingdom will be kept for you once you know that heaven rules. So take my advice: break off your sins by doing right, and your iniquities by showing mercy to the poor. It may be that your peace will last longer.
  - range: 28-33
    heading: 'The boast on the palace and the voice from heaven'
    plain: |
      It all happened. Twelve months later the king was walking in his palace in Babylon and said, Is this not great Babylon, which I have built as my royal seat by my own power and for the honour of my majesty? While he was still speaking a voice came from heaven: King Nebuchadnezzar, the kingdom is taken from you. The sentence of the dream was repeated, and within the hour it was carried out. He was driven from men and ate grass like an ox; his body was wet with dew, his hair grew like eagles’ feathers, and his nails like birds’ claws.
  - range: 34-37
    heading: 'The king looks up'
    plain: |
      When the time was over, I, Nebuchadnezzar, lifted my eyes to heaven, and my understanding came back. I blessed the most High and honoured Him who lives forever, whose rule is everlasting. All who live on earth count as nothing beside Him; He does as He wills in heaven and on earth, and no one can hold back His hand or ask Him what He is doing. My reason returned, and with it my honour and splendour; my counsellors sought me out, I was set on my throne again, and I was greater than before. Now I praise the King of heaven. All He does is true and just, and He is able to humble those who walk in pride.

notes:
  - ref: 1
    phrase: 'Nebuchadnezzar the king, unto all people, nations, and languages'
    kind: structure
    title: 'A chapter in the king’s own voice'
    body: |
      The chapter’s opening, a king’s name, the people addressed, and a wish for peace, “is the usual form also of the edicts promulgated by the Persian kings,” as the letters in [[Ezra 4:17]] and [[Ezra 7:12]] show. Daniel appears in the letter as the king saw him.

      The voice changes once. The king says “I” through verse 27 and again from verse 34. Verses 28–33, the boast and the time among the beasts, are told about him: “he walked,” “he was driven from men.” The change has been taken as a sign that another hand wrote the letter, since there the author “falls out of the role of the king into the narrative tone.” The reply is that the change belongs to the story: during those days he was not himself, and could not say “I” of what he did. On that reading, which fits the text as it stands, the first person comes back in the same verse as his understanding.

      The reader hears about the madness from outside and about the recovery from within.
    sources: [keil-daniel]

  - ref: 8
    phrase: 'in whom is the spirit of the holy gods'
    kind: words
    title: 'What Nebuchadnezzar meant by “the spirit of the holy gods”'
    body: |
      The king is describing Daniel in the terms of his own religion, and the plural is real. The Aramaic is *ʾelahin qaddishin*, “holy gods,” and in the same breath he speaks of “my god,” after whom Daniel had been renamed (see [[Dan. 1:7]]). He says the phrase three times (verses 8, 9, and 18).

      Other translations read it differently. The ancient Greek version makes the king say that Daniel “has within him the Holy Spirit of God,” and a modern translation offers “a holy, divine spirit” in its margin. The Aramaic adjective is plural, though, and the king who speaks it has just called in his magicians first. He still believed in Bel, the chief god of Babylon, and crediting Daniel’s gift was not a confession that Daniel’s God was the only one (see the note on [[Dan. 2:47]]).

      Pharaoh said much the same of Joseph: “Can we find such a one as this is, a man in whom the Spirit of God is?” ([[Gen. 41:38]]). Daniel, “like Joseph,” had been given power to interpret dreams.
    sources: [oshb-wlc, lxx-rahlfs, nrsvue, ot-manual-28, bd-daniel-book]

  - ref: 10
    phrase: 'a tree in the midst of the earth'
    kind: symbol
    title: 'Why the king is a tree'
    body: |
      The tree is the king and the reach of his rule, and Daniel needs only one sentence to say so: “It is thou, O king” (verse 22). Ezekiel drew the Assyrian the same way, as a cedar with birds nesting in its boughs and nations living in its shade (see the note on [[Ezek. 31:6]]), and that tree too was cut down because “his heart is lifted up in his height” ([[Ezek. 31:10]]).

      The details fit what the Lord had said of this king. Through Jeremiah He had announced, “have I given all these lands into the hand of Nebuchadnezzar the king of Babylon, my servant; and the beasts of the field have I given him also to serve him” ([[Jer. 27:6]]). Daniel had told him so to his face: “the God of heaven hath given thee a kingdom,” and with it “the beasts of the field and the fowls of the heaven” ([[Dan. 2:37–38]]). The dream puts the same creatures under the tree and in its branches.

      So the dream does not deny the king’s greatness. The tree really does feed “all flesh.”
    sources: [lds-scriptures]

  - ref: 13
    phrase: 'a watcher and an holy one'
    kind: words
    title: 'Who the watcher is'
    body: |
      The watcher is a heavenly messenger, and the word for him occurs nowhere in the Old Testament outside this chapter. The Aramaic *ʿir* means a “waking, or wakeful, one, i.e. angel”; it comes three times, in verses 13, 17, and 23. “An holy one” appears to describe the same figure a second way, since the next verse goes on with one speaker: “He cried aloud.”

      In the dream the sentence is the watchers’: “This matter is by the decree of the watchers” (verse 17). When Daniel interprets it, he says, “this is the decree of the most High” (verse 24).
    sources: [bdb, oshb-wlc]

  - ref: 15
    phrase: 'leave the stump of his roots in the earth, even with a band of iron and brass'
    kind: symbol
    title: 'The stump and the band'
    body: |
      The stump is the promise inside the sentence, and Daniel explains it himself: “thy kingdom shall be sure unto thee, after that thou shalt have known that the heavens do rule” (verse 26). The tree is cut down, not dug up. On one reading the tree with its roots is Nebuchadnezzar, “who shall as king be cut down, but shall as a man remain, and again shall grow into a king.”

      The band of iron and brass is the one detail Daniel leaves unexplained, so any reading of it is a guess. In the middle of the verse the language slides from the tree to the man (it is “his portion” that is with the beasts), and the band has been read both ways: literally, as the chains put on a madman, and “figuratively or spiritually of the withdrawal of free self-determination through the fetter of madness.” The text supports no more than that the stump is held where it is until the time is over.
    sources: [keil-daniel]

  - ref: 16
    phrase: 'let seven times pass over him'
    kind: words
    title: 'How long “seven times” is'
    body: |
      The Aramaic word is *ʿiddan*, a set period, and the seven are usually read as years. Its sense in this chapter is given as a “definite time, = year,” and Josephus, retelling the chapter, says the king lived “in the desert for seven years.” The Church’s footnote on this verse allows “years, or seasons,” and the one at verse 34 speaks of the seven years.

      The word’s general sense is simply “time, as duration,” however, and the chapter never converts it. The same word returns in the visions: “a time and times and the dividing of time” ([[Dan. 7:25]]). What the chapter is clear about is that the period was fixed beforehand, and that its end was tied to a condition: “till thou know.”
    sources: [bdb, josephus-antiquities, lds-scriptures]

  - ref: 17
    phrase: 'setteth up over it the basest of men'
    kind: words
    title: '“The basest of men” means the lowliest'
    body: |
      “Basest” here is about rank, not character. The Aramaic adjective *shephal* means “low in station,” and a modern translation has “the lowliest of human beings.” The watcher’s point is that God can take a kingdom from the highest man alive and hand it to the least regarded.

      The word comes back as the letter’s last. “Those that walk in pride he is able to abase” (verse 37) uses the verb from the same root, to make low. The sentence that began with God setting up the lowly ends with God bringing down the proud, and the king who heard the first half in a dream writes the second half from experience.
    sources: [bdb, nrsvue, strongs-concordance, oshb-wlc]

  - ref: 19
    phrase: 'was astonied for one hour'
    kind: words
    title: 'Why Daniel was silent'
    body: |
      The dream meant harm to the king, and Daniel had to be the one to say so. “Astonied” is an old word meaning “bewildered” or “filled with consternation or dismay.” “One hour” is not a measure by the clock: the Aramaic means “for a moment,” and a modern translation has him “severely distressed for a while.”

      The king has to coax him, and when Daniel speaks, his first words are a wish that the dream were about someone else. He “communicates it in words of affectionate interest for the welfare of the king,” and then he gives the whole of the bad news.
    sources: [ot-manual-28, bdb, nrsvue]

  - ref: 26
    phrase: 'the heavens do rule'
    kind: words
    title: '“Heaven” as a name for God'
    body: |
      “The heavens” here stands for God Himself. Daniel has just said that “the most High ruleth” (verse 25); now he says the same thing with the place for the person. One suggestion, and it is no more than that, is that the Greek phrase for the kingdom of heaven, another way to say the kingdom of God, “afterwards arose” from this way of speaking. It is the phrase Matthew’s Gospel uses: “Repent ye: for the kingdom of heaven is at hand” ([[Matt. 3:2]]).

      The king ends the same way, calling God “the King of heaven” (verse 37).
    sources: [keil-daniel]

  - ref: 27
    phrase: 'break off thy sins by righteousness'
    kind: words
    title: 'Could the sentence have been turned aside?'
    body: |
      Daniel’s counsel leaves open that the sentence might yet be turned aside. He closes with “if it may be,” and the implication is that if the king did as he was told, “he might receive divine favor and avert the threatened punishment.” The king was given twelve months (verse 29).

      The verb is the vivid part. Aramaic *peraq* means to “tear away, break off”: sins are something to be broken with. The ancient Greek version reads “atone for thy sins by alms,” and a modern translation still prints “atone” in its text and “break off” in its margin. The Aramaic noun is plain “right doing,” and what Daniel asks for is a changed life.

      He names one thing in particular, “mercy to the poor,” which is counted among “the most sincere evidences of repentance.”
    sources: [bdb, lxx-rahlfs, nrsvue, ot-manual-28]

  - ref: 30
    phrase: 'Is not this great Babylon, that I have built'
    kind: history
    title: 'The boast was true, which is the point'
    body: |
      Nebuchadnezzar really was the builder he says he was. The Babylonian historian Berosus, quoted by Josephus, says that he “built three walls round about the inner city,” that he “built another palace before his father’s palace,” and that he raised a garden on built-up heights, a “pensile paradise,” for his wife. He was “the great king of Babylon,” and he reigned more than forty years.

      What the king’s sentence leaves out is the giver: it is all “I have built,” “the might of my power,” “the honour of my majesty.” Daniel had already told him where it all came from: “the God of heaven hath given thee a kingdom, power, and strength, and glory” ([[Dan. 2:37]]). When Daniel later tells the story to Belshazzar, he puts the fault in a phrase: “his heart was lifted up, and his mind hardened in pride” ([[Dan. 5:20]]).
    sources: [josephus-antiquities, bd-nebuchadnezzar, lds-scriptures]

  - ref: 33
    phrase: 'he was driven from men, and did eat grass as oxen'
    kind: history
    title: 'What happened to the king, and what other records say'
    body: |
      The chapter describes the king’s condition without naming it, and the Babylonian accounts do not mention it. What it says is that his mind was changed: a modern translation of verse 16 has “let the mind of an animal be given to him,” and what comes back at the end is “mine understanding” and “my reason” (verses 34 and 36). Daniel’s retelling adds that “his dwelling was with the wild asses” ([[Dan. 5:21]]).

      Josephus repeats the story and asks that no one blame him “for writing down every thing of this nature, as I find it in our ancient books.” When he then lists the outside histories he had found that mention this king, none of what he quotes speaks of it.

      One proposal is that the story was first told of Nabonidus, Babylon’s last king, and that the better-known name came in when the text was translated. It rests on Babylonian records in which Nabonidus “stayed in Tema,” in Arabia, for years while the crown prince remained in Babylonia, and on a Dead Sea Scrolls fragment, “The Prayer of Nabonidus,” in which a king at Tema is afflicted and counselled by a Jewish adviser.

      It is a hypothesis, not a reading the Church’s reference works adopt. The text names Nebuchadnezzar throughout, Daniel names him again in chapter 5, and the Church’s own reference entry on Nebuchadnezzar keeps the story his: he “was for a time smitten with madness.” This commentary reads the chapter as it stands.
    sources: [nrsvue, josephus-antiquities, tvedtnes-nabonidus, bd-nebuchadnezzar]

  - ref: 34
    phrase: 'lifted up mine eyes unto heaven'
    kind: symbol
    title: 'Why the recovery begins with a look upward'
    body: |
      The king’s reason returns when he looks up. Lifting the eyes to heaven has been called “the first sign of the return of human consciousness,” and more than that, an appeal: “his first thought was a look to heaven, whence help came to him,” as in the psalm, “Unto thee lift I up mine eyes, O thou that dwellest in the heavens” ([[Ps. 123:1]]).

      This is what the sentence had required. He was to live among the beasts “till thou know that the most High ruleth” (verse 25), and the chapter has that knowledge and his understanding arrive together. The first thing he does with it is bless the most High.

      [The Kingdom That Shall Never Be Destroyed](/daniel/themes/kingdom-never-destroyed/) follows the king’s words about this dominion through the book.
    sources: [keil-daniel]

  - ref: 37
    phrase: 'the King of heaven'
    kind: history
    title: 'Was Nebuchadnezzar converted?'
    body: |
      The king praises the most High, and the text does not say how far his change went. This is his third confession in the book, and each goes further than the last. After the first dream Daniel’s God was “a God of gods” ([[Dan. 2:47]]), which allowed Him “a place among the pantheon of Babylonian gods.” After the furnace, “there is no other God that can deliver after this sort” ([[Dan. 3:29]]). Now He is “the most High” and “the King of heaven,” who does as He wills with every king on earth, and the lesson has been summed up in a line: “Nebuchadnezzar may rule over Babylon and its temples, but Jehovah ruled over him.”

      Whether that made him a worshipper of the Lord alone is another matter. “It is hard to know from the text” whether he left his many gods behind, and it “does not necessarily follow” that the experience brought “his sincere repentance or conversion to the God of Daniel.” In this very letter he speaks of “my god” (verse 8).

      What the letter itself claims is this much: a king whose dominion reached “to the end of the earth” (verse 22) learned who gave him his throne, and said so in public to every nation he ruled. When Daniel speaks of him again, it is as a warning to Belshazzar ([[Dan. 5:18–22]]).
    sources: [draper-exile, ot-manual-28]

christ: |
  The words Nebuchadnezzar uses to praise the most High are the words Daniel later hears used of Jesus Christ. The king says of the most High that “his dominion is an everlasting dominion” (verse 34). In Daniel’s vision of chapter 7 the same Aramaic words are spoken of “one like the Son of man”: “his dominion is an everlasting dominion, which shall not pass away” ([[Dan. 7:14]]). There, too, the ones who serve are “all people, nations, and languages,” the very audience this letter addresses in its first verse (see the note on [[Dan. 7:13]]).

  Nebuchadnezzar had already been told that such a kingdom was coming, one “which shall never be destroyed” ([[Dan. 2:44]]). In this chapter he learns that his own throne is the most High’s to give “to whomsoever he will.” The tree that fed all flesh was cut down in an hour. The kingdom that is “from generation to generation” belongs to the King of heaven, and in chapter 7 Daniel sees dominion given to the Son of man.

explore: |
  - **Daniel’s retelling.** Read [[Dan. 5:18–23]] beside this chapter and note what Daniel adds and what he holds Belshazzar responsible for.
  - **The other great tree.** Compare Ezekiel’s cedar, [[Ezek. 31:3–14]], and the tree the Lord plants Himself, [[Ezek. 17:22–24]].
  - **The Lord who gives kingdoms.** [[Jer. 27:5–7]] says the same of Nebuchadnezzar through Jeremiah; [[Dan. 2:20–21]] is Daniel’s own statement of it.
  - **The everlasting dominion.** Follow the phrase from verses 3 and 34 to [[Dan. 7:13–14]] and [[Dan. 7:27]].

parallels:
  - ref: Dan. 5:18–22
    note: Daniel retells Nebuchadnezzar’s pride and his time among the beasts to Belshazzar.
  - ref: Ezek. 31:3–14
    note: The Assyrian as a towering cedar, sheltering the nations and cut down for the pride of its height.
  - ref: Jer. 27:5–7
    note: The Lord gives the lands, and the beasts of the field, to Nebuchadnezzar “my servant,” for a set time.
  - ref: Dan. 7:13–14
    note: The everlasting dominion, and all people, nations, and languages, given to one like the Son of man.

sources: [keil-daniel, oshb-wlc, lxx-rahlfs, nrsvue, ot-manual-28, bd-daniel-book, lds-scriptures, bdb, josephus-antiquities, strongs-concordance, bd-nebuchadnezzar, tvedtnes-nabonidus, draper-exile]
