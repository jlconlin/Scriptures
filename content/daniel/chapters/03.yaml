chapter: 3
title: 'But If Not'
tagline: 'Nebuchadnezzar sets up an image of gold and a furnace for whoever will not bow to it. Three Jewish officials refuse without knowing whether God will save them, and the king who asked what god could deliver them ends by answering his own question.'
when: 'No date of its own. Nebuchadnezzar is king, and the chapter follows the dream of his second year ([[Dan. 2:1]]), since the accusers point back to an appointment made at the end of that chapter.'

setting: |
  The Aramaic text gives the chapter no date. The ancient Greek translation opens with “In his eighteenth year,” words the Aramaic text does not have. They have been explained as a date supplied by translators who “associated the erection of this statue with the taking of Jerusalem.”

  The Jews in Babylon “were not prisoners.” They could buy land, open shops, and “move into civil service,” and Shadrach, Meshach, and Abed-nego were among the Jewish administrators “moving up in the ranks of Babylonian government.” The three received those names at [[Dan. 1:7]] and were set “over the affairs of the province of Babylon” at Daniel’s request ([[Dan. 2:49]]). The king’s summons to the plain of Dura goes to “all the rulers of the provinces” (verse 2).

  Daniel is not named anywhere in the chapter, and the book does not mention his three companions again after it. The Epistle to the Hebrews lists among the works of faith that some “quenched the violence of fire” ([[Heb. 11:34]]).

thread: |
  The chapter is built on one question. “Who is that God that shall deliver you out of my hands?” the king asks in verse 15. In verse 29 he answers it himself, decreeing that “there is no other God that can deliver after this sort.”

  Everything before the question shows what stands behind it. The officials are listed in full, then listed again. The instruments are named four times. The image is always the one “that Nebuchadnezzar the king had set up.” Every people, nation, and language falls down at the same signal. Against all of that the story sets three names.

  What the three say comes between the question and its answer, and it takes the question out of the king’s hands. They look to God to deliver them. They also say what they will do if He does not, and it is the same thing. Their refusal does not wait on the outcome.

  Then the outcome comes, and it is told through the king’s eyes: four men where there were three, loose where they were bound, walking where they fell. The officials who were summoned to honor the image end by gathering around three men whose coats do not even smell of fire.

sections:
  - range: 1-7
    heading: 'The image on the plain of Dura'
    plain: |
      King Nebuchadnezzar makes an image of gold, sixty cubits high and six wide, and sets it up on the plain of Dura in the province of Babylon. He sends for every rank of official in the provinces to come to its dedication, and they come and stand in front of it. A herald calls out the order to all peoples, nations, and languages: when the music sounds, fall down and worship the golden image. Whoever does not will be thrown that same hour into a burning furnace. The music sounds, and everyone falls down and worships.
  - range: 8-12
    heading: 'The accusation'
    plain: |
      Some Chaldeans come to the king and accuse the Jews. After greeting the king and repeating his decree and its penalty back to him, they name certain Jews whom he put in charge of the affairs of the province of Babylon: Shadrach, Meshach, and Abed-nego. These men, they say, have paid no attention to the king. They do not serve his gods or worship the golden image he set up.
  - range: 13-18
    heading: 'The king’s question and the answer'
    plain: |
      Furious, Nebuchadnezzar has the three brought in. He asks whether it is true, and offers them another chance: if they are ready to fall down when the music plays, good. If not, they go into the furnace that same hour, and what god will deliver them out of his hands? They answer that they have no need to make a reply on the matter. Their God is able to deliver them from the furnace, and He will deliver them out of the king’s hand. But if He does not, the king should know that they will not serve his gods or worship his image.
  - range: 19-23
    heading: 'Into the furnace'
    plain: |
      The king’s face changes with rage. He orders the furnace heated seven times hotter than usual and has the strongest men in his army bind the three and throw them in. They are bound in the clothes they are wearing. Because the order is urgent and the furnace so hot, the flames kill the men who carry them up, and the three fall bound into the middle of the fire.
  - range: 24-27
    heading: 'Four men, loose'
    plain: |
      Nebuchadnezzar starts up in alarm and asks his counsellors whether they did not throw three bound men into the fire. They say they did. He says he sees four men, unbound, walking in the fire and unhurt, and the fourth is “like the Son of God” (see the note on verse 25). He goes to the mouth of the furnace and calls the three by name, as servants of the most high God, to come out. They come out. The officials gather and see that the fire has had no power over their bodies: their hair is not singed, their coats are not damaged, and there is no smell of fire on them.
  - range: 28-30
    heading: 'The king’s decree'
    plain: |
      Nebuchadnezzar blesses the God of Shadrach, Meshach, and Abed-nego, who sent His angel and delivered servants who trusted Him, who defied the king’s order and gave up their bodies sooner than worship any god but their own. He decrees that anyone of any people who speaks against their God will be cut in pieces and his house made a dunghill, because no other god can deliver like this. Then he promotes the three in the province of Babylon.

notes:
  - ref: 1
    phrase: 'an image of gold'
    kind: history
    title: 'What the image was'
    body: |
      The word for the image means a likeness, and the text never says of whom or of what. Aramaic *tselem* is the word used for the great image of the king’s dream ([[Dan. 2:31]]). It has been called “properly an image in human likeness,” a word that “excludes the idea of a mere pillar or an obelisk.” The measurements are strange for a human figure, ten times as high as wide where a body is about six to one, and one explanation is that “the pedestal of the image may be regarded as included.” It need not have been solid gold. Ancient accounts of Babylonian idols and Isaiah’s description of how idols were made “lead us to think of the image as merely overlaid with plates of gold.”

      A reader coming from chapter 2 will ask whether the statue has to do with the king’s dream, in which he was the head of gold ([[Dan. 2:38]]). The text does not say. It has been thought likely: the idea of such an image “was probably suggested to Nebuchadnezzar by” the image he saw in the dream, “whose head of gold his world-kingdom was described to him as being.”

      What the text does show is that everyone in the story keeps two things apart: “thy gods,” and “the golden image which thou hast set up” (verses 12, 14, 18). On one reading the ceremony “only demanded the recognition of the national god, to whom the king supposed he owed the greatness of his kingdom,” a thing his other subjects could do “without any violence to their consciences,” so that disobedience “appeared to him as culpable rebellion against his majesty.”
    sources: [keil-daniel, oshb-wlc, lds-scriptures]

  - ref: 2
    phrase: 'the princes, the governors, and the captains'
    kind: structure
    title: 'The roll of officials, called three times'
    body: |
      The list of officials is written out in full in verse 2 and again in verse 3, and the repetition lets a reader feel what the three men are up against. The first title is the Aramaic word for “satraps,” and a modern translation gives the roll as “the satraps, the prefects, and the governors, the counselors, the treasurers, the justices, the magistrates, and all the officials of the provinces.” That is seven ranks by name and a phrase to sweep in the rest.

      Verse 3 could have said “they came.” It calls the roll again. The instruments get the same treatment (verses 5, 7, 10, 15), and so does the phrase “the image that Nebuchadnezzar the king had set up.” The empire is shown acting as one body at one signal: “all the people, the nations, and the languages, fell down.” Verse 12 then names three men who did not.

      The roll is called a third time in verse 27, shortened. The same officers now gather around the three and see that “the fire had not had any power over the bodies of those men.”
    sources: [lds-scriptures, bdb, nrsvue, esv]

  - ref: 5
    phrase: 'the cornet, flute, harp, sackbut, psaltery, dulcimer'
    kind: words
    title: 'The six instruments'
    body: |
      Six instruments are named, and the King James gives them the names of instruments of its own day. A modern translation has “horn, pipe, lyre, trigon, harp, bagpipe, and every kind of music.” Three of the Aramaic names are borrowed from Greek: the lyre is a “loan-word from Greek” *kitharis*; the “psaltery” is the Greek *psalterion*, “a (triangular) stringed instrument”; and the last is Greek *symphonia*, for which “bag-pipe, or double pipe, or Pan’s pipe” are all offered.

      In the story the music is a signal. The decree names a moment, “at what time ye hear the sound,” and an act, and the penalty falls “the same hour.”
    sources: [esv, bdb, lds-scriptures]

  - ref: 6
    phrase: 'a burning fiery furnace'
    kind: history
    title: 'Death by fire under the king of Babylon'
    body: |
      Scripture records in one other place that the king of Babylon put men to death by fire. Jeremiah’s letter to the exiles foretells a curse that would pass into use among “all the captivity of Judah which are in Babylon”: “The LORD make thee like Zedekiah and like Ahab, whom the king of Babylon roasted in the fire” ([[Jer. 29:22]]).

      The furnace itself is described only in passing. The soldiers “took up” the three, who “fell down bound” into it (verses 22–23), and yet the king can see the men inside and walk up to its “mouth” to call them out (verse 26). The fire that kills the strongest men in the army outside the furnace does not hurt the bound men inside it.
    sources: [lds-scriptures]

  - ref: 8
    phrase: 'accused the Jews'
    kind: words
    title: 'Accused: the Aramaic idiom'
    body: |
      “Accused” translates an Aramaic idiom, to eat the pieces of someone, that means to “accuse maliciously.” The phrase was “probably borrowed from” an Assyrian expression for to “malign, slander,” and a modern translation brings the malice into the verse: “certain Chaldeans came forward and maliciously accused the Jews.” The idiom comes once more in the book, for the men “which had accused Daniel” to Darius ([[Dan. 6:24]]).

      The accusers’ speech begins with the three men’s rank and comes to the image last: “There are certain Jews whom thou hast set over the affairs of the province of Babylon.” That is the appointment of [[Dan. 2:49]]. The charge then climbs in three steps: “these men, O king, have not regarded thee: they serve not thy gods, nor worship the golden image.” The insult to the king comes first, his gods second, and the statue third.
    sources: [oshb-wlc, bdb, esv, lds-scriptures]

  - ref: 12
    phrase: 'Shadrach, Meshach, and Abed-nego'
    kind: history
    title: 'Where Daniel was'
    body: |
      Three men are accused and Daniel is not among them, and the text gives no reason. The last verse of chapter 2 had already put him in a different place from his friends: they were set over the province, “but Daniel sat in the gate of the king” ([[Dan. 2:49]]). Whether that kept him away from the plain of Dura is not said.

      His absence has been called a “remarkable circumstance,” and the explanations offered for it are admitted guesses: he may have been kept away for some reason, or he may have been there and refused to bow but not been informed against. On the second guess the accusers “had designed first only the overthrow of the three rulers of the province of Babylon.” The one possibility set aside is that he bowed: “he also would certainly not have done homage to the image.”
    sources: [keil-daniel, lds-scriptures]

  - ref: 15
    phrase: 'who is that God that shall deliver you out of my hands?'
    kind: scripture
    title: 'The king’s question, and who answers it'
    body: |
      The verb of the king’s taunt, Aramaic *shezib*, “deliver,” comes back in his own mouth as praise. The chapter uses it four times: here, twice in the three men’s reply (verse 17), and then from the king himself: “Blessed be the God of Shadrach, Meshach, and Abed-nego, who hath sent his angel, and delivered his servants” (verse 28). His decree closes by turning the challenge around, in a different Aramaic verb that the King James also translates “deliver”: “there is no other God that can deliver after this sort.”

      The Assyrians had put a question much like it to Jerusalem in Hezekiah’s day: “Who are they among all the gods of these lands, that have delivered their land out of my hand, that the LORD should deliver Jerusalem out of my hand?” ([[Isa. 36:20]]). The two boasts have been told apart. The Assyrian “raised his gods above Jehovah, the God of the Jews”; Nebuchadnezzar “only declares that deliverance out of the fiery furnace is a work which no god can accomplish.” On that reading he likens the God of the Jews to other gods only indirectly.
    sources: [oshb-wlc, keil-daniel, lds-scriptures]

  - ref: 18
    phrase: 'But if not'
    kind: words
    title: 'The two ifs of the answer'
    body: |
      The answer has two “ifs,” and the second allows that God might not deliver them. It opens with “we are not careful to answer thee.” *Careful* in older English was “full of care; anxious; solicitous,” and modern translations have “we have no need to answer you in this matter.” They are declining to argue the case.

      The first “if” can be taken two ways. The King James “If it be so” leaves “it” open, and it has been filled in from the king’s threat: “[if you cast us into the furnace].” Another translation attaches the “if” to God’s ability: “If our God whom we serve is able to deliver us from the furnace of blazing fire and out of your hand, O king, let him deliver us,” with the other construction given in its margin. On either construction the men look to God for deliverance in verse 17, and verse 18 states what they will do if it does not come. Nothing in their conduct depends on which happens. Elder Dennis E. Simmons called their second sentence “a statement of true faith.”

      Scripture has both outcomes. The Church’s footnote at verse 6 sends the reader to Abinadi, who was not delivered: he fell, “having suffered death by fire” ([[Mosiah 17:20]]). Hebrews sets the two side by side. Some “quenched the violence of fire” ([[Heb. 11:34]]), and in the next verse “others were tortured, not accepting deliverance; that they might obtain a better resurrection” ([[Heb. 11:35]]).
    sources: [webster-1828, esv, nrsvue, simmons-but-if-not, lds-scriptures]

  - ref: 21
    phrase: 'their coats, their hosen, and their hats'
    kind: words
    title: 'The clothes that went into the fire'
    body: |
      The clothing is listed on the way in because it will be inspected on the way out. What each garment was is not certain. The first word is “probably mantle,” though it has also been taken as trousers, and translations divide accordingly: “their cloaks, their tunics, their hats” in one, “their tunics, their trousers, their hats” in another.

      Whatever the pieces were, the men went in fully dressed, and verse 27 returns to it. The officials see bodies on which the fire had no power, “nor was an hair of their head singed, neither were their coats changed, nor the smell of fire had passed on them.” One thing did change. They “fell down bound” (verse 23), and the king sees them “loose, walking” (verse 25). The text does not say what became of the bonds.

      The Book of Mormon tells the same of three Nephite disciples. They “were cast into a furnace and received no harm” ([[3 Ne. 28:21]]), and Moroni says that “even the fiery furnace could not harm them” ([[Morm. 8:24]]). The two accounts have been set side by side, with the observation that Daniel’s friends went in “fully clothed” and that “their clothing sustained no fire or smoke damage.”
    sources: [esv, nrsvue, bdb, tvedtnes-garment, lds-scriptures]

  - ref: 23
    phrase: 'fell down bound into the midst of the burning fiery furnace'
    kind: history
    title: 'The song the Apocrypha adds'
    body: |
      The ancient Greek translation has the three men singing in the fire, and a song for them stands in the Apocrypha, outside the King James Old Testament. In the Greek, as its English translation gives it, verse 23 does not end with the fall: the three “walked in the midst of the flame, singing praise to God, and blessing the Lord,” and the king “heard them singing praises” before he rose in haste. Among the “additions to the book of Daniel not included in the present canon” is the Song of the Three Children, which “purports to be the song sung by Shadrach, Meshach, and Abed-nego” in the midst of the furnace. In the chapter as the Church’s edition has it, the three say nothing after verse 18. The story goes straight from their fall into the fire to the king rising in alarm.
    sources: [lxx-rahlfs, bd-daniel-book, bd-apocrypha]

  - ref: 25
    phrase: 'like the Son of God'
    kind: words
    title: 'The fourth man in the king’s own words'
    body: |
      What Nebuchadnezzar says in Aramaic is less definite than the King James wording, and the text does not say who the fourth figure was. The phrase is *bar elahin*: “son” with no “the,” and “gods” in the plural. It is glossed “a divine (or angelic) being,” and modern translations have “a son of the gods” and “the fourth has the appearance of a god.” The ancient Greek translation, in its English version, reads as the King James does: “like the Son of God.”

      The speaker is a king who has just demanded worship for a statue, and the phrase has been heard as his own religion talking. He speaks “in the spirit and meaning of the Babylonian doctrine of the gods,” of a figure who looked like “one of the race of the gods.”

      At the furnace door he calls the three “servants of the most high God,” where the Aramaic word for God is singular. In verse 28 he says that their God “hath sent his angel.” Daniel will say the same after the lions’ den: “My God hath sent his angel” ([[Dan. 6:22]]).

      So was it the Lord, or an angel He sent? “It is unclear from the text whether this was Jehovah or an angel.” What the chapter does record is that four were seen, three were called, and three came out.
    sources: [oshb-wlc, bdb, esv, nrsvue, lxx-rahlfs, keil-daniel, scripture-helps-dan, lds-scriptures]

  - ref: 29
    phrase: 'there is no other God that can deliver after this sort'
    kind: history
    title: 'What Nebuchadnezzar decreed, and what he did not'
    body: |
      The decree protects the God of the three men from insult and goes no further. It forbids anyone to “speak any thing amiss against” Him. It does not command anyone to worship Him, and it says nothing about the image, which for all the chapter tells is still standing on the plain.

      On one account the king’s confession here goes further than the one after the dream and stops short of the next. After the dream it was “your God is a God of gods, and a Lord of kings, and a revealer of secrets” (see the note on [[Dan. 2:47]]). After the furnace, “Jehovah had definitely climbed a few more rungs up the ladder of the pantheon. Still, that was not far enough.” The next step is told in chapter 4, where the king praises “the King of heaven” ([[Dan. 4:37]]).

      The king also praises what he had condemned. The three, he says, “have changed the king’s word, and yielded their bodies, that they might not serve nor worship any god, except their own God.” He is blessing them for disobeying him.
    sources: [draper-exile, lds-scriptures]

christ: |
  Through Isaiah the Lord had promised His people, “when thou walkest through the fire, thou shalt not be burned; neither shall the flame kindle upon thee” ([[Isa. 43:2]]). The Church’s edition joins that verse to the moment the three men come out of the furnace. The same verse begins with a promise of company, “I will be with thee,” and the next verse says who is speaking: “I am the LORD thy God, the Holy One of Israel, thy Saviour” ([[Isa. 43:3]]). Jehovah “is the premortal Jesus Christ.”

  Who the fourth figure in the fire was the text leaves open (see the note on verse 25). It leaves no doubt about who delivered the three. Nebuchadnezzar says it himself: “the God of Shadrach, Meshach, and Abed-nego,” by whatever messenger. The three had trusted Him without knowing the outcome, and Elder Dennis E. Simmons, teaching from their answer, described that kind of trust as “faith in the Lord Jesus Christ,” held in the knowledge that deliverance comes “in His time and in His way.”

explore: |
  - The dream this chapter follows, and the appointment the accusers resent: [[Dan. 2:31–49]].
  - The companion story, with the same idiom for the accusation and an angel sent: [[Dan. 6]].
  - The promise of the Lord’s company in the fire: [[Isa. 43:1–3]].
  - The Assyrian challenge at the wall of Jerusalem: [[Isa. 36:13–20]].
  - Those who were not delivered from the fire: [[Mosiah 17:13–20]] and [[Alma 14:10–11]].
  - The three Nephite disciples in the furnace: [[3 Ne. 28:19–22]] and [[4 Ne. 1:32]].
  - The roll of the faithful, delivered and not: [[Heb. 11:32–38]].
  - Elder Dennis E. Simmons, “But If Not …” (general conference, April 2004), follows the three words through scripture.

