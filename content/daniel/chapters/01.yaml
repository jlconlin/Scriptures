chapter: 1
title: 'Purposed in His Heart'
tagline: 'Four young men of Judah are taken to Babylon to be remade as servants of its king. They accept his school and his names, refuse his table, and come out ten times better than his wise men, because God gave.'
when: 'The third year of Jehoiakim king of Judah (1:1), about 605 or 606 B.C. as the Church’s helps reckon it. The last verse looks ahead to the first year of Cyrus, who took Babylon in 539 B.C.'

setting: |
  The book opens with its own date, “the third year of the reign of Jehoiakim king of Judah.” The Church’s helps place it about 605 or 606 B.C., after Nebuchadnezzar’s victory over Egypt at Carchemish ([[Jer. 46:2]]), though “scholars generally believe that Nebuchadnezzar captured Jerusalem in 597 BC.” This was the first of his campaigns against the city. Jehoiakim became his vassal ([[2 Kgs. 24:1]]), some of the temple vessels and “selected members of Judah’s upper class” went to Babylon, and Jerusalem was left standing. Nebuchadnezzar would besiege it “twice more” before destroying it.

  Daniel was taken, then, before Jerusalem was destroyed, and he was not the only prophet of those years. Jeremiah was preaching in Jerusalem (see the note on [[Jer. 25:1]]). Ezekiel names Daniel beside Noah and Job (see the note on [[Ezek. 14:14]]). And Daniel “lived in Jerusalem at the same time Lehi did, though there is no evidence to suggest that they knew each other.”

  The chapter is the introduction to the whole book. It tells how four young men of Judah came to serve in a foreign court. The first six chapters are “narratives regarding Daniel and his three companions”; the visions follow in chapters 7–12.

thread: |
  Three times the chapter says that God gave (verses 2, 9, and 17). Everything else in the chapter is what people do between those three sentences.

  Nebuchadnezzar’s plan is to remake the best of Judah’s young men: a new land, a new language and literature, food from his own table, new names. Daniel goes along with nearly all of it. He learns the literature, answers to the name, and serves the king. He draws one line, at the table, and he draws it courteously: first a request, then a proposed test.

  The chapter does not credit the outcome to Daniel’s talent. The youths look better after ten days, and then “God gave them knowledge and skill.” The king finds them ten times better than his experts. The reader was told in verse 2 who gave Jerusalem to this king, and so knows why. The last verse measures the result in years: Nebuchadnezzar opens the chapter, Cyrus closes it, and Daniel is still there.

sections:
  - range: 1-2
    heading: 'Jerusalem given into Nebuchadnezzar’s hand'
    plain: |
      In the third year of Jehoiakim’s reign over Judah, Nebuchadnezzar king of Babylon came to Jerusalem and besieged it. The Lord gave Jehoiakim into his hand, along with some of the vessels of the house of God. Nebuchadnezzar carried them to the land of Shinar, to the house of his god, and put the vessels in his god’s treasury.
  - range: 3-7
    heading: 'Chosen, schooled, and renamed'
    plain: |
      The king told Ashpenaz, the chief of his court officials, to bring some of the Israelites of the royal family and the nobility: youths without physical defect, good in appearance, quick in every kind of wisdom, well informed and understanding, and fit to serve in the palace. They were to be taught the literature and language of the Chaldeans. The king assigned them a daily share of his own food and of the wine he drank. They were to be trained for three years and then enter his service. Among them were four from Judah: Daniel, Hananiah, Mishael, and Azariah. The chief official gave them new names: Belteshazzar, Shadrach, Meshach, and Abed-nego.
  - range: 8-16
    heading: 'The king’s food refused'
    plain: |
      Daniel made up his mind not to defile himself with the king’s food or wine, and he asked the chief official to excuse him. God had given Daniel favour and compassion with this man, but the man was afraid. The king had set their food and drink, and if he saw them looking less healthy than the others of their age, the chief official’s head would be at risk. So Daniel went to the steward whom the chief official had put over the four and asked for a ten-day test: give us vegetables to eat and water to drink, then compare how we look with the youths who eat the king’s food, and do with us as you see fit. The steward agreed. After ten days they looked better and better fed than all who ate the king’s food, so he went on taking away their portion and their wine and giving them vegetables.
  - range: 17-21
    heading: 'Ten times better'
    plain: |
      God gave these four youths knowledge and skill in all literature and wisdom, and Daniel understood visions and dreams of every kind. When the time the king had set was up, the chief official presented them to Nebuchadnezzar. The king talked with them, and none of the others equalled Daniel, Hananiah, Mishael, and Azariah, so they entered the king’s service. In every question of wisdom and understanding he put to them, he found them ten times better than all the magicians and enchanters in his kingdom. Daniel remained there until the first year of King Cyrus.

notes:
  - ref: 1
    phrase: 'In the third year of the reign of Jehoiakim'
    kind: history
    title: 'The third year here, the fourth in Jeremiah'
    body: |
      Daniel dates the siege to Jehoiakim’s third year while Jeremiah calls the fourth year Nebuchadnezzar’s first; the explanation given, that Nebuchadnezzar was not yet king when he marched, accounts for his title but not fully for the year. Jeremiah says that Nebuchadnezzar beat Pharaoh-necho at Carchemish “in the fourth year of Jehoiakim” ([[Jer. 46:2]]), and he calls that fourth year “the first year of Nebuchadrezzar king of Babylon” ([[Jer. 25:1]]; both verses have notes). A reader then asks how Nebuchadnezzar could besiege Jerusalem as “king of Babylon” a year earlier.

      The answer rests on who Nebuchadnezzar was that year. He was still “a Babylonian prince,” “in command of his father’s troops,” when he won at Carchemish in 605 B.C. The drive that followed brought him to Jerusalem, and “within the year he returned to Babylon to be made king.” On this account the book calls him by the title he was about to hold: “he who afterwards became king might be proleptically styled king, though he was at the time only the commander of the army.” (A proleptic title names a person by what he will become.)

      The year remains a question, since Jeremiah puts Carchemish itself in the fourth year. One reading takes the Hebrew verb for “came” in its other sense, “to go, to march to a place”: the third year is then the year the army set out, and the city was taken in the fourth. That is a proposal, not a settled result.

      The Bible Dictionary’s dates for the two reigns are 609–598 B.C. for Jehoiakim and 604–561 B.C. for Nebuchadnezzar. Whatever the exact year, Kings records what followed: “Jehoiakim became his servant three years” ([[2 Kgs. 24:1]]).
    sources: [lds-scriptures, ot-manual-28, keil-daniel, bd-jehoiakim, bd-nebuchadnezzar]

  - ref: 2
    phrase: 'the Lord gave'
    kind: structure
    title: 'God gave, three times'
    body: |
      The chapter explains everything that happens in it with one verb, used three times with God as its subject. “The Lord gave Jehoiakim king of Judah into his hand” (verse 2). God “had brought Daniel into favour” (verse 9), where the Hebrew again says that God gave. And “God gave them knowledge and skill” (verse 17). The verb is *natan*, “give,” each time, and a modern translation keeps the second one in view: “God gave Daniel favor and compassion.”

      The first of the three is the hard one. The narrator says that Nebuchadnezzar besieged Jerusalem, and that it was the Lord who handed its king over. The history of the kings says the same of these years: “Surely at the commandment of the LORD came this upon Judah, to remove them out of his sight” ([[2 Kgs. 24:3]]).

      The book’s stories have been read as saying the same to the exiles. An important task of the prophets of those years was to assure Judah that “Jehovah governed and controlled the destiny of all nations, including Babylon,” and Daniel’s experiences, as far as his fellow Jews knew them, promised that “even in Babylon, Jehovah could and did sustain and protect those who remained true to the faith.”
    sources: [oshb-wlc, esv, lds-scriptures, draper-exile]

  - ref: 2
    phrase: 'into the land of Shinar to the house of his god'
    kind: history
    title: 'Shinar, and where the vessels went'
    body: |
      “Shinar” is the old name of the plain where the tower of Babel was built, and the vessels this verse mentions twice come back later in the book. Genesis puts the builders of the tower on “a plain in the land of Shinar” ([[Gen. 11:2]]). The book of Daniel uses that old name only here.

      Chronicles reports the act itself: Nebuchadnezzar “carried of the vessels of the house of the LORD to Babylon, and put them in his temple at Babylon” ([[2 Chr. 36:7]]). There they stay until the night Belshazzar calls for “the golden and silver vessels which his father Nebuchadnezzar had taken out of the temple which was in Jerusalem” ([[Dan. 5:2]]). And they go home when Cyrus “brought forth the vessels of the house of the LORD, which Nebuchadnezzar had brought forth out of Jerusalem, and had put them in the house of his gods” ([[Ezra 1:7]]), in the year this chapter’s last verse names.

      The verse says “part of the vessels.” The temple they came from was still standing, and more would be taken later ([[2 Kgs. 24:13]]).

      [The Desolate Sanctuary and the Messiah](/daniel/themes/desolate-sanctuary/) follows the house of God and its vessels through the book.
    sources: [lds-scriptures, oshb-wlc]

  - ref: 3
    phrase: 'the master of his eunuchs'
    kind: words
    title: 'Whether Daniel was made a eunuch'
    body: |
      The text does not say whether Daniel and his friends were made eunuchs, and the word it uses leaves the question open. The Hebrew *saris* means “eunuch,” and eunuchs were “a class of emasculated men attached to the courts of eastern rulers,” who “were often given positions as trusted officials.” But the same word is used of Potiphar, “an officer of Pharaoh” ([[Gen. 39:1]]), and the lexicon marks him as married. An alternative rendering of Ashpenaz’s title is “chief of his officers.”

      What raises the question is Isaiah’s word to Hezekiah about his descendants: “they shall be eunuchs in the palace of the king of Babylon” ([[Isa. 39:7]]; see the note there). Some of the young men of verse 3 are “of the king’s seed,” and the Church’s edition joins that phrase to Isaiah’s prophecy. Josephus, retelling the story, says that Nebuchadnezzar “made some of them to be eunuchs,” without saying which. Scripture goes no further than to put the four in the charge of the man who held that office.
    sources: [bdb, bd-eunuch, lds-scriptures, josephus-antiquities]

  - ref: 4
    phrase: 'the learning and the tongue of the Chaldeans'
    kind: history
    title: 'A Babylonian education'
    body: |
      The king wanted these captives turned into Babylonian scholars, and Daniel accepted that part of the plan. The “children” are “youths” in a modern translation; the text gives no ages. They are chosen for their looks and for minds already trained. Two of the King James words meant something else in older English. “Cunning” meant “skillful; experienced; well-instructed,” and “science” was “knowledge, or certain knowledge,” which is what the Hebrew *madda* means: “knowledge, thought.”

      What they are to learn is “the literature and language” of the Chaldeans. “Chaldea” was properly “the portion of Babylonia that lay south and east of Babylon,” but in this book the name is also “applied to a learned class in Babylon who made a special study of astrology” (as at [[Dan. 2:2]]). They are to study Babylon’s writings and Babylon’s speech for three years and eat from the king’s table.

      Nothing in the chapter suggests that Daniel objected to the schooling. Verse 17 uses the same Hebrew word for “learning” when it says that God gave the four “knowledge and skill in all learning and wisdom.” The education that was meant to make them Babylonian is counted there among God’s gifts.
    sources: [esv, webster-1828, bdb, bd-chaldea, oshb-wlc]

  - ref: 7
    phrase: 'gave names'
    kind: history
    title: 'Four names changed'
    body: |
      Each of the four Hebrew names speaks of Israel’s God, and some of the new names, where their meaning can be made out, name Babylon’s gods. Daniel is “A judge (is) God,” or “El is my judge.” Mishael asks, “Who is what God is?” Hananiah and Azariah say that the Lord “hath been gracious” and “hath helped.”

      The replacements are less certain. Nebuchadnezzar himself says Daniel was called Belteshazzar “according to the name of my god” ([[Dan. 4:8]]), and Bel was “a Babylonian god.” Yet the name is probably a Babylonian phrase meaning “protect his life!”, and if it is connected with Bel it is “then inexplicable.” Shadrach is of “form and meaning dubious.” Meshach has been explained as “who is what Aku (the moon-god) is?”, a name that has been compared with Mishael. Abed-nego is “servant of (God) Nebo,” with the god’s name altered. Nebo is the god in the king’s own name too, “Nebo, protect the crown!”

      Daniel takes the name. Joseph had been renamed in Egypt, where “Pharaoh called Joseph’s name Zaphnath-paaneah” ([[Gen. 41:45]]; see the note there). But the narrator goes on calling the four by their Hebrew names (verses 11 and 19; [[Dan. 2:17]]), and the book is known by the name Daniel was born with.
    sources: [bdb, bd-daniel, bd-bel, bd-nebuchadnezzar, lds-scriptures]

  - ref: 8
    phrase: 'he would not defile himself with the portion of the king’s meat'
    kind: history
    title: 'Why the king’s table would defile'
    body: |
      Daniel accepts a Babylonian name and a Babylonian education and refuses Babylonian food, and the text does not say why the food was different. “Meat” here is not flesh in particular; in older English the word meant “Food in general; any thing eaten for nourishment.” The Hebrew is a Persian loanword for a “portion (of food) for king, delicacies.” “Defile” is a late Hebrew verb used elsewhere of hands stained with blood and of polluted bread on the Lord’s altar ([[Isa. 59:3]]; [[Mal. 1:7]]).

      Two reasons are possible, and neither is certain. The food and wine may first have been offered to Babylon’s gods, so that eating them would have counted as a share in idol worship; and the food may have broken the dietary rules in the law of Moses. One reading makes the first the chief reason, because the law’s rules about clean and unclean animals would not explain refusing the wine as well: if those rules were all, “the youths were not under the necessity of refraining from the wine.” A table where part of the food and drink had been offered to a god made the whole meal “the meat and the wine of an idol sacrifice.”

      The dread of unclean food in a foreign land was older than the exile: Hosea had warned that Israel “shall eat unclean things in Assyria” ([[Hosea 9:3]]). Daniel “purposed in his heart” not to, and he does it by asking twice, first the chief and then the steward, and not by defiance.
    sources: [scripture-helps-dan, keil-daniel, bdb, webster-1828, lds-scriptures]

  - ref: 12
    phrase: 'pulse to eat, and water to drink'
    kind: scripture
    title: 'Pulse, a ten-day test, and the Word of Wisdom'
    body: |
      Daniel proposes a ten-day test on pulse, food grown from seed, and Latter-day Saints read its outcome beside the Word of Wisdom. The word “denotes seeds, and may include the grains of leguminous vegetables or any other edible seeds,” and the lexicon and a modern translation give “vegetable” and “vegetables.”

      The request is framed as an experiment. “Prove thy servants” is, in a modern translation, “Test your servants”: ten days, and then judge by what you see. Daniel does not ask the steward to share his convictions, only to look at the outcome (verses 13 and 15). Verse 17 then names the giver, and the gift named there has been described as “the spirit of wisdom that was given to Daniel and his companions in consequence of their abstinence from wine.”

      The Church’s edition joins these verses to the Word of Wisdom at verses 12, 13, and 17. The revelation was not Daniel’s law: it “did not exist in Daniel’s time,” and his people had the dietary laws of the law of Moses. But the cross-references pair the youths’ countenances with its promise of “health in their navel and marrow to their bones” ([[D&C 89:18]]), and their knowledge with the promise that the obedient “shall find wisdom and great treasures of knowledge, even hidden treasures” ([[D&C 89:19]]).
    sources: [bdb, bd-pulse, esv, bd-daniel-book, ot-institute-manual-44, lds-scriptures]

  - ref: 17
    phrase: 'Daniel had understanding in all visions and dreams'
    kind: scripture
    title: 'The gift only Daniel is given'
    body: |
      All four receive learning, but only Daniel is given understanding of visions and dreams, and the rest of the book shows that gift at work. The next chapter opens with a dream that the king’s wise men cannot tell ([[Dan. 2:1–11]]), and the book’s second half is “prophetic visions seen by Daniel and reported in his own name.”

      The clause says Daniel “had understanding,” but the sentence it stands in begins “God gave,” and Daniel keeps the two together. “Like Joseph, he is careful to point out that he is not able to do this by his own wisdom but because of the wisdom given him by the God of heaven” (compare [[Gen. 41:16]] with [[Dan. 2:27–30]]).

      Ezekiel is among those who refer to him, and uses him as a measure of wisdom when he taunts the prince of Tyre: “Behold, thou art wiser than Daniel; there is no secret that they can hide from thee” ([[Ezek. 28:3]]; see the note there).
    sources: [bd-daniel-book, bd-daniel, lds-scriptures]

  - ref: 20
    phrase: 'magicians and astrologers'
    kind: words
    title: 'Pharaoh’s magicians, and Babylon’s'
    body: |
      The first of these two words is the one Genesis and Exodus use for Pharaoh’s magicians. *Chartummim* is at root an “engraver, writer,” used “only in derived sense of one possessed of occult knowledge, diviner, astrologer, magician.” Outside Daniel it is applied only to the magicians of Egypt, the men who could not interpret Pharaoh’s dreams ([[Gen. 41:8]]; see the note there).

      The second word, *ashshaphim*, is a “conjurer, necromancer,” a “probably Babylonian loan-word” that occurs in the Hebrew of this book only here and at [[Dan. 2:2]]. Where the King James has “astrologers,” a modern translation has “enchanters.”

      The king finds these professionals of his own “ten times” behind the four. The next chapter puts that finding to the test.
    sources: [bdb, esv, lds-scriptures]

  - ref: 21
    phrase: 'continued even unto the first year of king Cyrus'
    kind: history
    title: 'From Nebuchadnezzar to Cyrus'
    body: |
      The last verse does not date Daniel’s death; it says that he outlasted the empire that captured him. He is still receiving revelation “in the third year of Cyrus king of Persia” ([[Dan. 10:1]]), so “unto” cannot mean that he was there no longer. The Hebrew preposition has been explained as marking “a termination without reference to that which came after it,” and a modern translation says that Daniel “was there until the first year of” King Cyrus.

      One reading of why that year is named is that it is the year the exile ended. “In the first year of Cyrus king of Persia, that the word of the LORD by the mouth of Jeremiah might be fulfilled,” the Jews were allowed to go home ([[Ezra 1:1]]), and the temple vessels went with them (see the note on [[Dan. 1:2]]). The chapter opened with Nebuchadnezzar’s first taking of Jerusalem, “the commencement of the exile,” and it closes on the exile’s last year. On this reading the sentence “means only that he lived and acted during the whole period of the exile in Babylon.”

      Cyrus “conquered Babylon in 539 BC.” Daniel had been there through the captivity that Jeremiah foretold as seventy years (see the note on [[Jer. 25:11]]). The text gives no “indication of his age at the time of his captivity,” but the span has been taken to show that “he lived to at least the age of eighty.”
    sources: [keil-daniel, lds-scriptures, esv, scripture-helps-dan, ot-manual-28]

christ: |
  The chapter begins with a king of Judah given into the hand of the king of Babylon. The chapters that follow tell of a kingdom “which shall never be destroyed” ([[Dan. 2:44]]) and of “one like the Son of man,” to whom is given a dominion “which shall not pass away” ([[Dan. 7:13–14]]). The Son of man is Jesus Christ (see the note on [[Dan. 7:13]]).

explore: |
  - The kings’ history of the same years, and the reason it gives: [[2 Kgs. 24:1–4]].
  - Jeremiah’s word in Jehoiakim’s fourth year, with the seventy years: [[Jer. 25:1–12]].
  - Isaiah’s prophecy to Hezekiah about his sons in Babylon: [[Isa. 39:5–7]].
  - Joseph in Pharaoh’s court, where the magicians fail and he is renamed: [[Gen. 41:8–45]].
  - The vessels of verse 2 brought out at Belshazzar’s feast: [[Dan. 5:1–4]].
  - The first year of Cyrus and the vessels’ return: [[Ezra 1:1–11]].
  - The promises joined to this chapter by the Church’s footnotes: [[D&C 89:18–21]].
  - Ezekiel on Daniel’s righteousness and wisdom: [[Ezek. 14:14]] and [[Ezek. 28:3]].

