chapter: 11
title: 'The Kings of the North and the South'
tagline: 'A messenger tells Daniel of kings who will each do “according to his will” and each be taken away, and of a people who will be tried between them until “the time appointed.”'
when: 'Part of the vision dated to the third year of Cyrus king of Persia (10:1), who conquered Babylon in 539 B.C. Verse 1 looks back to the first year of Darius the Mede.'

setting: |
  The chapter break falls in the middle of a speech. The messenger who came to Daniel in the third year of Cyrus ([[Dan. 10:1]]) is still talking, and he does not stop until [[Dan. 12:4]]. He has said why he came, “to make thee understand what shall befall thy people in the latter days” ([[Dan. 10:14]]), and what he will tell: “that which is noted in the scripture of truth” ([[Dan. 10:21]]). Verse 1 finishes his sentence about Michael, and its “him” has been read both of Michael and of Darius. Verse 2 begins the telling.

  What follows is unlike the rest of the book. There are no beasts and no horns, only kings, and none of them is named. Persia and Grecia are named at the start and Egypt in verse 8. Everyone else is “the king of the north” or “the king of the south.”

  The chapter is not a chronicle. Its history is sketched “only to give it as a background in order to indicate its effects upon the Lord’s people,” as an overview of main events and not “a detailed chronology,” and several things in it seem “dualistic, having application to more than one period of time.” It reaches to the end of the story: wars, leagues, and conflicts “that lead up to the Second Coming of Christ.”

thread: |
  The chapter sets the will of kings against the appointments of God.

  Between its kings lies a small land with its people. The wars pass back and forth across “the glorious land,” and the long account narrows as it goes: from empires, to two rival houses, to one “vile person” who turns against “the holy covenant.”

  There the messenger slows down, and he describes at length people who are not kings: those who “forsake the holy covenant,” and “the people that do know their God.” The faithful are not promised escape. Some of them fall. What they are promised is that their trial has a purpose and a limit, and that no king sets the limit (see the notes on verses 27 and 33).

  The speech ends in the next chapter, with Michael standing up, the people delivered, and the dead awaking ([[Dan. 12:1–3]]).

sections:
  - range: 1-4
    heading: 'Persia, and a mighty king'
    plain: |
      “In the first year of Darius the Mede I myself stood up to support and strengthen him. Now I will tell you the truth. Three more kings will arise in Persia, and a fourth will be far richer than all of them. When his riches have made him strong, he will stir up everyone against the kingdom of Grecia.

      “Then a mighty king will arise. He will rule a great dominion and do as he pleases. But once he has arisen, his kingdom will be broken and divided toward the four winds of heaven. It will not go to his descendants, and it will not be the dominion he ruled. It will be uprooted and given to others.”
  - range: 5-20
    heading: 'The kings of the south and the north'
    plain: |
      “The king of the south will be strong, but one of his princes will grow stronger than he and will rule a great dominion. After some years the two will join together. The daughter of the king of the south will come to the king of the north to make an agreement. But she will not keep her power, and he will not last. She will be given up, along with those who brought her, her father, and the one who supported her.

      “A branch from her roots will arise in his place. He will come with an army, enter the fortress of the king of the north, and prevail. He will carry off to Egypt their gods, their molten images, and their precious vessels of silver and gold, and he will last more years than the king of the north. The king of the south will come into his kingdom and return to his own land.

      “But the sons of the king of the north will be stirred up and will gather a multitude of great forces. One of them will come on like a flood and pass through, and then carry the war as far as the fortress. The king of the south will be enraged. He will come out and fight the king of the north, who will raise a great multitude, but the multitude will be given into his hand. When he has carried it off, his heart will be lifted up, and he will cast down tens of thousands. Yet it will not make him stronger. The king of the north will return with a multitude greater than the first, and after some years he will come with a great army and much riches.

      “In those times many will rise against the king of the south. Oppressors from among your own people will also rise up to fulfil the vision, but they will fall. The king of the north will come, throw up siegeworks, and take the fortified cities. The forces of the south will not stand, not even its chosen troops. The one who comes against him will do as he pleases, and no one will stand before him. He will stand in the glorious land, which will be consumed by his hand. He will set himself to come with the strength of his whole kingdom, and upright ones with him. He will give him the daughter of women, corrupting her, but she will not stand on his side or be for him.

      “After this he will turn toward the isles and take many. But a prince will put a stop to the reproach he offers and turn it back upon him. Then he will turn toward the fortress of his own land, but he will stumble and fall, and not be found. In his place will arise a raiser of taxes in the glory of the kingdom, but within a few days he will be destroyed, and not in anger or in battle.”
  - range: 21-35
    heading: 'The vile person and the holy covenant'
    plain: |
      “In his place will arise a contemptible man, to whom the honour of the kingdom has not been given. He will come in peaceably and take the kingdom by flatteries. Forces will be swept away before him like a flood and broken, and so will the prince of the covenant. After a league is made with him he will work deceitfully, and he will grow strong with a small people. He will enter the richest parts of the province peaceably and do what his fathers and their fathers never did, scattering plunder, spoil, and riches among them. He will plan against the strongholds, but only for a time.

      “He will stir up his power and his courage against the king of the south with a great army. The king of the south will fight with a very great and mighty army, but he will not stand, because plots will be laid against him. Those who eat his food will destroy him. His army will be swept away, and many will fall slain. The two kings will both be set on mischief and will speak lies at one table. But it will not succeed, for the end is still to come at the time appointed. He will return to his land with great riches, his heart set against the holy covenant. He will act, and return to his own land.

      “At the time appointed he will come south again, but it will not be as it was before. Ships of Chittim will come against him, and he will be grieved and turn back. He will rage against the holy covenant and act, and he will turn to those who forsake the holy covenant. Forces from him will stand. They will profane the sanctuary, the stronghold, take away the daily sacrifice, and set up the abomination that makes desolate. Those who act wickedly against the covenant he will corrupt with flatteries. But the people who know their God will be strong and will act.

      “Those among the people who understand will instruct many. Yet for many days they will fall by sword and flame, by captivity and plunder. When they fall they will be helped with a little help, and many will join them with flatteries. Some of those who understand will fall, so that they may be tried, purged, and made white, until the time of the end. For it is still for a time appointed.”
  - range: 36-45
    heading: 'The king who exalts himself, and his end'
    plain: |
      “The king will do as he pleases. He will exalt himself and magnify himself above every god, and he will speak astonishing things against the God of gods. He will prosper until the indignation is finished, for what is determined will be done. He will have no regard for the God of his fathers, or for the desire of women, or for any god, for he will magnify himself above all. In their place he will honour the god of fortresses. A god his fathers did not know he will honour with gold and silver, with precious stones and costly things. So he will do in the strongest fortresses with a strange god, whom he will acknowledge and heap with glory. He will make them rule over many and will divide the land for gain.

      “At the time of the end the king of the south will push at him. The king of the north will come against him like a whirlwind, with chariots, horsemen, and many ships. He will enter the countries, overflow, and pass through. He will enter the glorious land also, and many countries will be overthrown. But Edom, Moab, and the chief of the children of Ammon will escape his hand. He will stretch out his hand over the countries, and the land of Egypt will not escape. He will have power over the treasures of gold and silver and over all the precious things of Egypt, and the Libyans and the Ethiopians will march with him.

      “But tidings from the east and the north will trouble him, and he will go out in great fury to destroy many. He will plant the tents of his palace between the seas in the glorious holy mountain. Yet he will come to his end, and no one will help him.”

notes:
  - ref: 3
    phrase: 'a mighty king shall stand up'
    kind: history
    title: 'Persia’s kings and the mighty king (verses 2–4)'
    body: |
      The mighty king of verses 2–4 is Alexander of Macedon, and the book has already supplied most of the names. Daniel’s earlier vision of a ram and a goat was explained to him: “the kings of Media and Persia,” then “the king of Grecia,” whose great horn “is the first king,” and after him “four kingdoms shall stand up out of the nation, but not in his power” ([[Dan. 8:20–22]]). Verse 4 says the same thing again in plainer words.

      He is the founder of the Greek empire, “born 356 B.C., died 323 B.C.,” who “made himself ruler over a wide empire stretching from Greece to the Indus, including Syria and Egypt.” His kingdom did not go “to his posterity.” Josephus says that “his government fell among many,” and among them he names Seleucus, who took Babylon, and “Ptolemy the son of Lagus,” who seized Egypt. The first book of Maccabees says of Alexander’s officers that “after his death they all put crowns upon themselves.”

      The Persian kings are less certain. One older reading counts the three as Cyrus’s successors, “Cambyses, the pseudo-Smerdis, and Darius Hystaspes,” and takes the fourth to be Xerxes, who “expended his treasures for the raising and arming of an immense host” to conquer Greece. On this reading the prophecy “closes the list of Persian kings with Xerxes,” though the king Alexander fought was a later Darius, because the war of Xerxes on Greece began the conflict “which led to the destruction of the Persian kingdom by Alexander the Great.” The prophecy, on that view, “mentions only the elements and factors which constitute the historical development.”
    sources: [lds-scriptures, bd-alexander, josephus-antiquities, first-maccabees, keil-daniel]

  - ref: 5
    phrase: 'the king of the south'
    kind: history
    title: 'The kings of the south and of the north (verses 5–20)'
    body: |
      South and north are Egypt and Syria, the two kingdoms on either side of Daniel’s land. The text names the first of them itself, when the king of the south carries his plunder “into Egypt” (verse 8). Egypt was the share of “Ptolemy the son of Lagus,” and Syria was held by the house of Seleucus.

      Verses 5–20 follow the two houses through several generations. Older commentators, following Jerome, match the verses with events known from ancient historians:

      - **Verse 5.** Here “all interpreters regard the king of the south” as the first Ptolemy, and the prince who grew greater as Seleucus, who had once fled “to Egypt to Ptolemy, by whom he was hospitably received.”
      - **Verses 6–9.** A later Ptolemy made peace with a king of Syria “on the condition that Antiochus should put away his own wife Laodice” and “marry Berenice, the daughter of Ptolemy.” The marriage ended in her murder, and “her brother, Ptolemy Euergetes, invaded the Syrian kingdom.” He would be the “branch of her roots.”
      - **Verses 10–19.** Antiochus, “surnamed the Great,” was at first “defeated by the Egyptians at Raphia, not far from Gaza.” Years later, Josephus says, he “overcame Scopas; in a battel fought at the fountains of Jordan,” took Judea, and then “made a friendship and league with Ptolemy; and gave him his daughter Cleopatra to wife” (verse 17).
      - **Verse 20.** His successor, Seleucus Philopator, if the verses before are about Antiochus the Great.

      The fit is real in places and loose in others. The prophecy has “only four kings of the north” and “three kings of the south,” fewer than the histories do, and “the historical reality does not correspond with the contents of the prophecy in anything like an exhaustive manner.” It treats the two kings “as representatives of the power of these two kingdoms.” The outline of the history can be recognized in the chapter. A table matching every verse to a king goes beyond what the text gives.
    sources: [lds-scriptures, josephus-antiquities, keil-daniel]

  - ref: 16
    phrase: 'the glorious land'
    kind: words
    title: 'The glorious land'
    body: |
      “The glorious land” is the land of Israel, and it is the reason the messenger tells of these wars at all. The Hebrew word is the one behind “the pleasant land” of the earlier vision (see the note on [[Dan. 8:9]]), and it comes again in verse 41 and in “the glorious holy mountain” of verse 45.

      The land lay between the two kingdoms. After Alexander’s death, “Judea lay directly between the two rivals.” It fell to the Ptolemies of Egypt in 301 B.C., and it was “not until 200 B.C. that the Seleucids were able to capture and hold Judea.” Josephus says that in the wars of Antiochus the Great the Jews “were very like to a ship in a storm; which is tossed by the waves on both sides.”

      The messenger had said that he came to show “what shall befall thy people” ([[Dan. 10:14]]). The kings are in the chapter because of the people whose land they cross. From this verse on, the land, its sanctuary, and its covenant come steadily to the front.
    sources: [bdb, oshb-wlc, ot-manual-kings-k, josephus-antiquities, lds-scriptures]

  - ref: 21
    phrase: 'a vile person'
    kind: history
    title: 'The vile person (verses 21–35)'
    body: |
      The “vile person” is commonly identified as Antiochus IV Epiphanes. The Hebrew word means “despicable, contemptible,” and for this verse it is glossed “of Antiochus Epiph.” He was “King of Syria (175–164 B.C.), at a time when Palestine was a Syrian province.”

      Josephus says that Antiochus “resolved to make an expedition against Egypt,” seized it “by treachery,” and was then “driven not only from Alexandria, but out of all Egypt, by the declaration of the Romans.” Turned back from Egypt, he fell upon Jerusalem. He emptied the temple of its treasures and “forbad them to offer those daily sacrifices which they used to offer to God.”

      The “ships of Chittim” of verse 30 are ships of the Mediterranean. Chittim is the people of Cyprus and, more widely, the “coast-lands of Mediterranean,” as far as Greece.

      Verses 30 and 32 say that he had help from inside, from “them that forsake the holy covenant.” His first success was owing “partly to a Hellenizing movement among the Jews themselves,” that is, a turning to Greek ways.

      Josephus read the book’s earlier vision of this king as prophecy fulfilled: “our nation suffered these things under Antiochus Epiphanes, according to Daniel’s vision; and what he wrote many years before they came to pass.” That vision is the one of the little horn that grew “toward the pleasant land” (see the note on [[Dan. 8:9]]). What he did in the temple, and what became of those who refused him, are in the notes on verses 31, 32, and 33.
    sources: [bdb, bd-antiochus-epiphanes, bd-maccabees, josephus-antiquities, lds-scriptures]

  - ref: 27
    phrase: 'the end shall be at the time appointed'
    kind: structure
    title: 'The time appointed'
    body: |
      Three times in this chapter events wait for “the time appointed,” a time that none of its kings sets. The phrase comes here, where two kings plot at one table and “it shall not prosper.” It comes in verse 29, where even the invader’s return to the south is on a schedule. And it comes in verse 35, where the suffering of the faithful lasts only “to the time of the end: because it is yet for a time appointed.” The Hebrew word behind it occurs in only two other verses of Daniel ([[Dan. 8:19]] and [[Dan. 12:7]]).

      Beside it runs another phrase. Three kings “do according to” their own will (verses 3, 16, and 36), and of each the messenger tells the end. The first kingdom is “broken.” The king of verse 16 will “stumble and fall, and not be found” (verse 19). The last “shall come to his end, and none shall help him.” Verse 36 puts both phrases in one sentence: the king does according to his will, and he prospers only “till the indignation be accomplished: for that that is determined shall be done.”
    sources: [oshb-wlc, bdb, lds-scriptures]

  - ref: 31
    phrase: 'the abomination that maketh desolate'
    kind: scripture
    title: 'The abomination that maketh desolate'
    body: |
      The Savior took this phrase from Daniel and used it of events that were still to come in His own day. The Hebrew joins a noun for a “detested thing” to a participle that means “appalling, causing horror.” Something loathsome is set up, and it leaves the holy place desolate. The verse names two things that go with it: the sanctuary is polluted, and “the daily sacrifice” is taken away.

      The Jews who lived under Antiochus saw it happen. The first book of Maccabees says that his men “set up the abomination of desolation upon the altar.” Josephus says that the king “built an idol altar” upon God’s altar and “slew swine upon it,” and he adds, “this desolation came to pass according to the prophecy of Daniel.”

      Long afterward Jesus spoke of it as still ahead: “When ye therefore shall see the abomination of desolation, spoken of by Daniel the prophet, stand in the holy place, (whoso readeth, let him understand:)” ([[Matt. 24:15]]). In Joseph Smith’s inspired revision of that discourse He applies it twice. The first time is “concerning the destruction of Jerusalem” ([[JS—M 1:12]]), which came when “the Roman legions under Titus, in A.D. 70, laid siege to Jerusalem.” The second is in the last days: “And again shall the abomination of desolation, spoken of by Daniel the prophet, be fulfilled” ([[JS—M 1:32]]). That is, “Jerusalem again will be under siege.” In a general sense the phrase also describes the latter-day judgments on the wicked, “the desolation of abomination which awaits the wicked, both in this world and in the world to come” ([[D&C 88:85]]).

      The inspired revision also changes what the disciples are told to do. In Matthew it is the abomination that stands in the holy place. In Joseph Smith—Matthew it is the disciples: “then you shall stand in the holy place” ([[JS—M 1:12]]). One reading of the change is that the idea of standing in the holy place, with the Doctrine and Covenants’ promise of not being moved, “far from being a modern invention, reverberates throughout the religious thought of earlier times.” When the Lord spoke again of these prophecies in this dispensation He said, “my disciples shall stand in holy places, and shall not be moved” ([[D&C 45:32]]).

      Daniel’s other mentions of the abomination are at [[Dan. 8:13]], [[Dan. 9:27]], and [[Dan. 12:11]].

      [The Desolate Sanctuary and the Messiah](/daniel/themes/desolate-sanctuary/) sets this passage beside the book’s other desolations.
    sources: [bdb, oshb-wlc, first-maccabees, josephus-antiquities, bd-abomination-of-desolation, bradshaw-holy-place, sc-knowhy-790, lds-scriptures]

  - ref: 32
    phrase: 'the people that do know their God shall be strong, and do exploits'
    kind: history
    title: 'Those who knew their God'
    body: |
      Verses 32–35 turn from the king to the people who refused him. The first book of Maccabees tells of them: “Many in Israel were fully resolved and confirmed in themselves not to eat any unclean thing,” and chose to die “that they might not profane the holy covenant: so then they died.” Josephus says that “those of the noblest souls did not regard him,” and that they were whipped, torn, and crucified for it. This is the falling “by the sword, and by flame, by captivity, and by spoil” of verse 33.

      Armed resistance began with the priest Mattathias and went on under his son Judas (see the note on [[Dan. 8:9]]), under whom the “ruined temple was restored” and a new altar dedicated. The chapter has “details that seem related to the Maccabean revolt,” and if the “little help” of verse 34 is that revolt, the messenger speaks of it soberly. Some of the wise still fall, others join them only “with flatteries,” and the end is not yet.

      The first book of Maccabees is in the Apocrypha. It is “a historical document of the highest importance.”
    sources: [first-maccabees, josephus-antiquities, bd-maccabees, ot-manual-28, lds-scriptures]

  - ref: 33
    phrase: 'they that understand among the people'
    kind: words
    title: 'They that understand'
    body: |
      “They that understand” translates a single Hebrew word, *maskilim*, and it is this vision’s name for the faithful in a time of trial. It comes from a verb that means to “give insight, teach,” and in these verses it has been rendered “the teachers.” Both senses fit, since the verse goes on to say that they “shall instruct many.”

      The word names this group four times, all in this vision: here, in verse 35, and twice in the next chapter, where the King James has “they that be wise” ([[Dan. 12:3]]) and “the wise” ([[Dan. 12:10]]). The book began with the same word. Daniel and his friends were chosen as youths “skilful in all wisdom” ([[Dan. 1:4]]), and the Hebrew behind “skilful” is *maskilim*.

      What the vision says of them answers a question the chapter raises: why do the people who know their God fall? Verse 35 gives a purpose and a limit. They fall “to try them, and to purge, and to make them white,” and only “to the time of the end.” The next chapter repeats the three verbs, “purified, and made white, and tried” ([[Dan. 12:10]]), and says what becomes of them: “they that be wise shall shine as the brightness of the firmament” ([[Dan. 12:3]]).

      [“But If Not”](/daniel/themes/but-if-not/) sets those who fall here beside the rescues of chapters 3 and 6.
    sources: [bdb, oshb-wlc, lds-scriptures]

  - ref: 36
    phrase: 'the king shall do according to his will'
    kind: history
    title: 'The king who exalts himself (verses 36–45)'
    body: |
      Readers have long disagreed whether verses 36–45 still describe Antiochus, and the Church’s helps read the chapter as reaching to the last days. Jerome took verses 21–35 of Antiochus and verses 36–45 of “Antichrist,” a final enemy of God’s people, and those who read it so set beside this verse Paul’s words about one “who opposeth and exalteth himself above all that is called God” ([[2 Thes. 2:4]]). Many later interpreters find Antiochus all the way to verse 45.

      Three objections have been raised to that from the text: that Antiochus did not exalt himself “above every god,” since he “even wished to render the worship of Zeus universal”; that no last conquest of Egypt by him is known (“regarding this expedition not only are historians silent”); and that he did not die in the holy land. Josephus has him fall sick after a failed attack on “a very rich city in Persia, called Elymais.”

      The text itself marks a turn. Verse 40 opens “at the time of the end,” and the sentence that follows the king’s fall is “And at that time shall Michael stand up” ([[Dan. 12:1]]), with the resurrection after it. Elder Joseph Fielding Smith “specifically identified Daniel 11–12” as referring to the last days. It is possible that “in the prophetic dualism Daniel showed near-future and far-future events with the same image”: much in the chapter “suggests the future battle of Armageddon,” while other details fit Antiochus, and some “could also relate to the fall of Judah to Rome.”

      The passage gives no name, and several details are not explained. “The desire of women,” for one, has been taken of the love of women and of more than one goddess. The weight of the passage falls on its last clause: “he shall come to his end, and none shall help him.”
    sources: [keil-daniel, josephus-antiquities, ot-manual-28, ot-manual-kings-i, lds-scriptures]

  - ref: 38
    phrase: 'the God of forces'
    kind: words
    title: 'The god of fortresses'
    body: |
      “Forces” translates the Hebrew word for a fortress, so the phrase means a god of fortresses. For this verse the word is glossed only as the title “of a heathen god,” and no name is given. It is the word the King James gives as “fortress” in verses 7 and 10 of this chapter, and in verse 31 it describes the temple: “the sanctuary of strength” is the sanctuary that is a stronghold.
    sources: [bdb, oshb-wlc]

christ: |
  The Savior quoted this vision and told His disciples to understand it. On the Mount of Olives He named “Daniel the prophet” and added, “whoso readeth, let him understand” (see the note on verse 31). In Joseph Smith’s inspired revision He sets the last fulfilment of that phrase just before His own return. After it, “they shall see the Son of Man coming in the clouds of heaven, with power and great glory” ([[JS—M 1:36]]). That is the one Daniel had seen in an earlier vision, “one like the Son of man” who “came with the clouds of heaven” ([[Dan. 7:13]]).

  Elder Bruce R. McConkie wrote of the last siege of Jerusalem, “It will be during this siege that Christ will come, the wicked will be destroyed, and the millennial era commenced.”

  Each of the chapter’s kings does “according to his will,” and each comes to his end. The kingdom that outlasts them is the one Daniel was shown at the beginning of the book, which “shall never be destroyed” ([[Dan. 2:44]]).

explore: |
  - How the messenger’s speech ends, with Michael, deliverance, and the resurrection: [[Dan. 12:1–4]].
  - The earlier vision of the same persecutor, and its explanation: [[Dan. 8:9–14]] and [[Dan. 8:23–25]].
  - The Savior’s use of this chapter, in Joseph Smith’s inspired revision: [[JS—M 1:12–20]] and [[JS—M 1:31–37]].
  - The Lord’s words on these prophecies in this dispensation: [[D&C 45:26–33]].
  - Balaam’s oracle of ships from Chittim: [[Num. 24:24]].
  - The purpose of the trial in verse 35, in another prophet’s words: [[Zech. 13:9]].
  - Paul on the one who exalts himself above all that is called God: [[2 Thes. 2:3–4]].

