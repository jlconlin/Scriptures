chapter: 2
title: 'The Great Image and the Stone'
tagline: 'A king demands that his wise men tell him his own dream, and only a captive from Judah can. The dream is of an image of four metals and of a stone, cut out without hands, that outlasts them all.'
when: 'The second year of Nebuchadnezzar’s reign (2:1), the second date in the book. The first, the third year of Jehoiakim (1:1), is placed “around 606 BC” in the Church’s helps.'

setting: |
  The scene is the court of Babylon, early in Nebuchadnezzar’s reign. Daniel, Hananiah, Mishael, and Azariah are captives from Judah whom the king had ordered schooled for his service. At their examination he found them “ten times better than all the magicians and astrologers that were in all his realm” ([[Dan. 1:20]]), and of Daniel the book has said that he “had understanding in all visions and dreams” ([[Dan. 1:17]]). This chapter is the first trial of that gift, and it comes under a sentence of death.

  The story was written for a people in exile. An important task of their prophets was “to assure Judah that, even in Babylon, Jehovah was with her,” and they did it by teaching that He “governed and controlled the destiny of all nations, including Babylon.” Of the stories in Daniel that carry that point, this is the first.

  Partway through verse 4 the book changes from Hebrew to Aramaic (see the note on [[Dan. 2:4]]). The four kingdoms of the dream come back in chapter 7 as four beasts ([[Dan. 7:17–18]]). Latter-day revelation takes up the dream twice: the stone in [[D&C 65:2]], and the kingdom, with Daniel named, in [[D&C 138:44]]. The interpretation of this dream has been called “a major contribution of the book.”

thread: |
  The chapter asks one question twice: who can make known what is hidden? The first half asks it of the dream itself. The king will not tell what he saw, and his wise men answer that no one can meet such a demand “except the gods, whose dwelling is not with flesh.” Daniel asks for time, prays with his three companions, and is shown the dream at night. Standing before the king, he begins where the wise men left off: “there is a God in heaven that revealeth secrets.”

  The second half asks it of the future, and the answer is the same God. Before Daniel says a word to the king he blesses God in a short hymn, and one of its lines is the dream in a sentence: “he removeth kings, and setteth up kings.” The image is that line drawn out. A head of gold is followed by silver, brass, and iron, and then by iron mixed with clay. Each is a kingdom that God gives and that passes. Then a stone that no hand cut strikes the feet, the whole image goes to chaff, and the stone becomes a mountain that fills the earth.

  So the story and the dream make one argument. The God who can tell a king his own dream is the God who gives kings their kingdoms, and He will set up one that “shall not be left to other people.” The king who began by threatening to cut his wise men in pieces ends on his face before a captive.

sections:
  - range: 1-13
    heading: 'The king’s demand'
    plain: |
      In his second year Nebuchadnezzar has dreams that trouble him so much he cannot sleep. He summons the magicians, astrologers, sorcerers, and Chaldeans. They greet him and ask to hear the dream so that they can interpret it. He answers that his word is settled (the King James has “the thing is gone from me”; see the note on verse 5): if they do not tell him both the dream and its meaning, they will be cut in pieces and their houses made a dunghill, and if they do, they will have gifts and honour. They ask again to be told the dream. The king says they are playing for time, having agreed on lies to tell him until circumstances change; let them tell the dream, and he will know they can interpret it. They reply that no man on earth can do this and no king has ever asked it. Only the gods could, and the gods do not live among men. The king, furious, orders all the wise men of Babylon killed, and Daniel and his companions are sought with the rest.
  - range: 14-23
    heading: 'A night vision and a hymn'
    plain: |
      Daniel speaks carefully to Arioch, the captain of the king’s guard, and asks why the decree is so urgent. Arioch explains. Daniel goes in and asks the king for time, promising the interpretation. Then he goes home and tells Hananiah, Mishael, and Azariah, so that they will ask the God of heaven for mercy about this secret and not die with the other wise men. The secret is revealed to Daniel in a vision at night, and he blesses God: wisdom and might are His; He changes times and seasons, removes kings and sets them up, gives wisdom to the wise, and reveals deep and hidden things, for He knows what is in the dark and light dwells with Him. Daniel thanks the God of his fathers for giving him wisdom and might, and for making known what the four of them had asked.
  - range: 24-30
    heading: 'Daniel before the king'
    plain: |
      Daniel goes to Arioch and says: do not destroy the wise men; take me to the king and I will give the interpretation. Arioch hurries him in and announces that he has found a man among the captives of Judah who can do it. The king asks Daniel, called Belteshazzar, whether he is able to tell the dream and its meaning. Daniel answers that no wise man, astrologer, magician, or soothsayer can tell what the king has asked. But there is a God in heaven who reveals secrets, and He has shown the king what will be in the latter days. The king’s thoughts on his bed were of what would come afterward, and the revealer of secrets has told him. As for Daniel, the secret was not shown him because he is wiser than anyone living, but so that the interpretation would be made known to the king and the king would understand his own thoughts.
  - range: 31-35
    heading: 'The dream'
    plain: |
      The king saw a great image standing before him, very bright and frightening to look at. Its head was fine gold, its breast and arms silver, its belly and thighs brass, its legs iron, and its feet part iron and part clay. As he watched, a stone was cut out without hands. It struck the image on its feet of iron and clay and broke them. Then the iron, the clay, the brass, the silver, and the gold were all broken together and became like chaff on a summer threshing floor; the wind carried them off and no trace of them was left. The stone that struck the image became a great mountain and filled the whole earth.
  - range: 36-45
    heading: 'The interpretation'
    plain: |
      Daniel gives the meaning. The king is a king of kings, because the God of heaven has given him a kingdom, power, strength, and glory, and has put into his hand people, beasts, and birds wherever they live: he is the head of gold. After him will come another kingdom, inferior to his; then a third, of brass, that will rule all the earth; then a fourth, strong as iron, which breaks and crushes everything. The feet and toes of clay and iron mean that the kingdom will be divided, partly strong and partly brittle. They will mingle with the seed of men, but they will not hold together, as iron does not mix with clay. In the days of those kings the God of heaven will set up a kingdom that will never be destroyed or left to another people. It will break and end all those kingdoms, and it will stand for ever. This is what the stone cut from the mountain without hands means. The great God has shown the king what is to come; the dream is certain and the interpretation sure.
  - range: 46-49
    heading: 'The king on his face'
    plain: |
      Nebuchadnezzar falls on his face, worships Daniel, and orders an offering and incense presented to him. He says to Daniel that truly his God is a God of gods, a Lord of kings, and a revealer of secrets, since Daniel could reveal this one. He makes Daniel a great man, gives him many gifts, and makes him ruler over the whole province of Babylon and chief of the governors over all its wise men. At Daniel’s request he sets Shadrach, Meshach, and Abed-nego over the affairs of the province, while Daniel himself remains at the king’s court.

notes:
  - ref: 1
    phrase: 'in the second year of the reign of Nebuchadnezzar'
    kind: history
    title: 'The second year and the three years of schooling'
    body: |
      The date looks too early for what chapter 1 has just told, and the text does not explain it. There the king orders the young captives trained for three years, “so nourishing them three years” ([[Dan. 1:5]]), and they are brought before him “at the end of the days” ([[Dan. 1:18]]). Here, in his second year, Daniel and his companions are already counted among the wise men who are to be killed (verse 13).

      One reconciliation is by counting: Nebuchadnezzar came to the throne “a year or a year and a half after the first siege of Jerusalem,” while the schooling began with the siege, so that “in the second year of his reign, that is about the end of it, the three years of the education of the Hebrew youths in the wisdom of the Chaldees would have come to an end.” That is one commentator’s reckoning of what he calls an “apparent contradiction,” not a settled answer. No Church source read for this chapter takes up the question.
    sources: [keil-daniel, lds-scriptures]

  - ref: 2
    phrase: 'the Chaldeans'
    kind: history
    title: 'Chaldeans: a country and a profession'
    body: |
      “Chaldeans” in this chapter names a profession, not a nation. Chaldea was properly “the portion of Babylonia that lay south and east of Babylon,” but in this verse and in verse 10 “the name is applied to a learned class in Babylon who made a special study of astrology.”

      The verse lists four kinds of experts, and verse 27 lists four again with a different fourth, “the soothsayers.” The Chaldeans speak for all of them (verses 4 and 10), and the narrator gathers them under one name, “the wise men of Babylon” (verse 12). The effect of the lists is that the whole learned establishment of Babylon is asked and fails. Daniel and his friends belong to it too: the decree against the wise men reaches them (verse 13), and at the end Daniel is made chief over them (verse 48).
    sources: [bd-chaldea, lds-scriptures]

  - ref: 4
    phrase: 'in Syriack'
    kind: words
    title: 'The book changes language here'
    body: |
      “Syriack” is Aramaic, and from the next words of this verse the book itself is written in it. The Hebrew word is *aramit*, and the Church’s footnote gives “Aramaic (a language related to Hebrew).” The narrator says that the Chaldeans spoke in Aramaic, their speech begins, “O king, live for ever,” and the text does not go back to Hebrew when they finish: “Dan. 2:4–7:28 is written in Aramaic and the rest in Hebrew.” Aramaic was “spoken widely throughout the Near East.”

      The book does not say why. What a reader can see is where the Aramaic begins and ends. It opens with this dream of four kingdoms and a fifth that stands for ever, and it closes with chapter 7, where the same succession is seen as four beasts and the kingdom is given to the saints ([[Dan. 7:17–18]]). Words explained in the notes from here through chapter 7 are therefore Aramaic, not Hebrew.
    sources: [lds-scriptures, bd-daniel-book, bd-aramaic, oshb-wlc]

  - ref: 5
    phrase: 'The thing is gone from me'
    kind: words
    title: 'The king had not forgotten his dream'
    body: |
      Nebuchadnezzar very probably remembered his dream: the word translated “gone” means “sure.” The Aramaic is *azda*, a loan from Persian, an adjective meaning “sure, assured,” so that the clause says “the word is assured on my part.” The King James translators took it “as verb is gone,” and the ancient Greek translation reads the same way: “The thing has departed from me.” A modern translation has “This is a public decree” here and, in verse 8, “the decree from me is firm.” The Church’s footnote keeps the dream as the subject: “sure with me; i.e., he knew his dream and desired to test them.” On either rendering nothing has been forgotten, and the phrase “should probably read ‘is certain with me.’”

      Verse 9 gives the king’s reasoning in his own words: “tell me the dream, and I shall know that ye can shew me the interpretation thereof.” An interpreter who is told a dream can say what he likes about it. One who can tell the dream untold has shown where his knowledge comes from. The demand was “insurance that their interpretation was true.”

      This changes the scene. The king is not asking the impossible out of forgetfulness and temper. He suspects his experts of “lying and corrupt words,” and he has found a test they cannot talk their way through.
    sources: [bdb, oshb-wlc, lxx-rahlfs, nrsvue, lds-scriptures, ot-manual-28, draper-exile]

  - ref: 11
    phrase: 'except the gods, whose dwelling is not with flesh'
    kind: structure
    title: 'What the wise men admit, and what Daniel answers'
    body: |
      The wise men’s excuse is the sentence the rest of the chapter answers. They say two things: “There is not a man upon the earth that can shew the king’s matter” (verse 10), and only the gods could, who do not dwell with flesh. Arioch’s announcement answers the first: “I have found a man” (verse 25). Daniel answers the second. He begins by agreeing with them, since the wise men “cannot” show the secret (verse 27), and then turns on their own word: “But there is a God in heaven that revealeth secrets” (verse 28).

      The contrast is the story’s point. It has been observed that “the important point of the story was not only that Daniel interpreted the king’s dream but also that he had the ability to do it,” and that the wise men’s reply shows “their belief that their own gods were distant and impersonal, while Daniel’s shows that Jehovah, even in Babylon, was immediate and personal.” The God of a conquered people, whose temple vessels now lay in “the treasure house” of Nebuchadnezzar’s god ([[Dan. 1:2]]), answered a captive in Babylon in a night vision.
    sources: [draper-exile, lds-scriptures]

  - ref: 21
    phrase: 'he removeth kings, and setteth up kings'
    kind: scripture
    title: 'The hymn says first what the dream will show'
    body: |
      Daniel’s blessing gives the meaning of the dream before the dream is told. He has just been shown an image of four kingdoms and a fifth, and what he says of God is that “he removeth kings, and setteth up kings.” The interpretation then uses the hymn’s words. God “hath given” Nebuchadnezzar his kingdom (verse 37), and in the end “shall the God of heaven set up a kingdom” (verse 44), where “set up” is the same Aramaic verb as “setteth up” here. The hymn’s other pair, “wisdom and might” (verse 20), is what Daniel says God has given him (verse 23).

      The dream is read this way as well: “It was Jehovah who chose Nebuchadnezzar to be king and who would set up all the kingdoms to follow until God’s own eternal kingdom overmastered and ruled the rest.”

      The Church’s footnote on “removeth” points to Jeremiah, who says the same of the same king in the Lord’s voice: “And now have I given all these lands into the hand of Nebuchadnezzar the king of Babylon, my servant; and the beasts of the field have I given him also to serve him” ([[Jer. 27:6]]). Daniel tells the king as much to his face in verse 38, beasts of the field included. The theme does not end with this chapter. The king’s second dream is sent “to the intent that the living may know that the most High ruleth in the kingdom of men, and giveth it to whomsoever he will” ([[Dan. 4:17]]).
    sources: [lds-scriptures, draper-exile, oshb-wlc]

  - ref: 28
    phrase: 'there is a God in heaven that revealeth secrets'
    kind: scripture
    title: 'Daniel and Joseph before a king'
    body: |
      Daniel stands where Joseph stood, and says what Joseph said. The Church’s footnotes mark the likeness at three points. Pharaoh’s “spirit was troubled” by a dream and his magicians could not interpret it ([[Gen. 41:8]]), as here in verses 1–11. Joseph told Pharaoh, “It is not in me: God shall give Pharaoh an answer of peace” ([[Gen. 41:16]]), as Daniel says in verse 30 that the secret was not revealed “for any wisdom that I have more than any living.” And Pharaoh set Joseph over his house ([[Gen. 41:40]]), as Nebuchadnezzar makes Daniel ruler over the province (verse 48).

      Of these the second matters most. Daniel, “like Joseph, is given ability to interpret dreams and to reveal the future,” and, like Joseph, “he is careful to point out that he is not able to do this by his own wisdom.” Both are captives, and both begin by refusing the credit.

      Daniel’s task is the harder in one respect that the text itself shows: Pharaoh “told them his dream,” and Nebuchadnezzar would not.
    sources: [bd-daniel-book, lds-scriptures]

  - ref: 28
    phrase: 'what shall be in the latter days'
    kind: words
    title: 'The end of the days'
    body: |
      The Aramaic phrase is, word for word, in the end of the days, and it says where the dream’s weight falls. *Acharit* means “end”; the expression is borrowed from Hebrew, where the prophets use it. Daniel says twice more what the dream covers, and both times more broadly: “what should come to pass hereafter” (verse 29) and “what shall come to pass hereafter” (verse 45).

      The two fit together. The dream starts in the king’s own day, “Thou art this head of gold” (verse 38), and runs through everything that follows, but what it was sent to show is the end: the stone, and the kingdom that stands for ever. A latter-day revelation keeps the phrase for that part of it, naming Daniel as one “who foresaw and foretold the establishment of the kingdom of God in the latter days” ([[D&C 138:44]]).
    sources: [bdb, oshb-wlc, lds-scriptures]

  - ref: 34
    phrase: 'a stone was cut out without hands'
    kind: symbol
    title: 'The stone no one cut'
    body: |
      “Without hands” means without human agency: the stone is the one thing in the dream that nobody made. The image is a made thing, a statue of worked metal. The stone is not quarried or shaped or thrown. The phrase means “by divine intervention,” and the book uses the idiom again of a king who “shall be broken without hand” ([[Dan. 8:25]]), where the Church’s footnote on this verse points. In the interpretation the image stands for kingdoms and the stone for a kingdom that God, and not men, establishes.

      Three details of what the stone does are worth slowing down for.

      It strikes the feet. The blow lands on the last and weakest part of the image, the iron mixed with clay, and not on the golden head. Yet verse 35 says that iron, clay, brass, silver, and gold were “broken to pieces together.” The Aramaic is “as one,” that is, “at once, with one stroke.” By the time of the feet the kingdom of gold was long over, so why does the gold fall with the rest? One explanation is that the earlier forms of worldly power “pass into the later forms of it, and thus are all destroyed when the stone destroys the last form.” The image is a single figure. What ends is not one empire but the whole succession.

      It leaves nothing. The metals become chaff that the wind carries off, “that no place was found for them.” The kingdoms in the image replace one another. The stone’s kingdom replaces all of them, and it “shall not be left to other people” (verse 44).

      It grows. The image stands still, and the stone moves and then becomes “a great mountain” that fills the earth. Verse 45 adds a detail verse 34 did not give: the stone was cut “out of the mountain.” The text does not say which mountain. One reading is that “there can be only a reference to Mount Zion,” as in Isaiah’s “mountain of the Lord’s house” from which the law goes forth ([[Isa. 2:2–3]]). That is a commentator’s reading and not the text’s statement.

      What the kingdom is, and when it was set up, is the subject of the note on [[Dan. 2:44]].
    sources: [rasband-fulfillment, scripture-helps-dan, keil-daniel, lds-scriptures]

  - ref: 38
    phrase: 'Thou art this head of gold'
    kind: history
    title: 'Which kingdoms the metals are'
    body: |
      The text names one kingdom, Nebuchadnezzar’s, and leaves the other three unnamed. Daniel says only that a second will be “inferior,” that a third “shall bear rule over all the earth,” and that a fourth will be “strong as iron” and then “divided.” The Church’s newest help follows the text and stops there: the other parts of the statue are “kingdoms that would rise after Babylon’s fall.”

      Latter-day prophets have gone further and given a list. President Spencer W. Kimball taught that “Cyrus the great, with his Medes and Persians, would be replaced by the Greek or Macedonian kingdom under Philip and Alexander; and that world power would be replaced by the Roman Empire,” and Rome in turn by “a group of nations of Europe represented by the toes of the image.” President Rudger Clawson had given the same succession in 1930, reading the two legs of iron as the empire’s division between Rome and Constantinople. The book itself later names two of them in a vision of its own: “the kings of Media and Persia” and “the king of Grecia” ([[Dan. 8:20–21]]).

      This is the teaching of the Church’s leaders. The text itself names none of the three, and among scholars “there remains a great deal of scholarly debate as to the identity of this image.” The Church’s footnotes join the gold, the silver, and the iron to the first, second, and fourth beasts of chapter 7 ([[Dan. 7:4–7]]), where the succession is told again.
    sources: [lds-scriptures, scripture-helps-dan, kimball-stone, ot-manual-28, frederick-old-wine]

  - ref: 43
    phrase: 'they shall mingle themselves with the seed of men'
    kind: words
    title: 'Iron that will not hold to clay'
    body: |
      The obscure phrase describes an attempt to join by human means what will not stay joined. A modern translation renders it “so will they mix with one another in marriage, but they will not hold together,” with a note that the Aramaic is “by human seed.” That is the usual explanation: “most interpreters refer to the marriage politics of the princes,” alliances made by marrying one royal house into another.

      The phrase can also be taken more widely, as “all the means employed by the rulers to combine the different nationalities,” with marriage only the chief of them. Why “the seed of *men*”? One answer is that the words are chosen with an eye to the next verse, to set “the vain human endeavour of the heathen rulers in contrast with the doings of the God of heaven.” Another reading takes the mixture as the kingdoms that followed Rome, which “merged the culture of Rome with that of northern and eastern European tribes.”

      On any of these readings the image ends in something that men try to hold together and cannot. The next thing in the dream is a stone that no hand cut.
    sources: [nrsvue, keil-daniel, eom-daniel-prophecies, lds-scriptures]

  - ref: 44
    phrase: 'shall the God of heaven set up a kingdom'
    kind: prophets
    title: 'The kingdom the God of heaven sets up'
    body: |
      Latter-day revelation identifies the stone as the kingdom of God restored in the last days. The Lord said it on 30 October 1831, at Hiram, Ohio: “The keys of the kingdom of God are committed unto man on the earth, and from thence shall the gospel roll forth unto the ends of the earth, as the stone which is cut out of the mountain without hands shall roll forth, until it has filled the whole earth” ([[D&C 65:2]]). The Church’s heading to this chapter says it in a line: “The stone is the latter-day kingdom of God.”

      The connection was made early. Wilford Woodruff reported that Daniel 2 was among the scriptures Moroni cited to Joseph Smith in September 1823, and “as early as 1831” the image of the stone was tied to the kingdom the Saints were building. Near the end of his life Joseph Smith said, “I calculate to be one of the Instruments of setting up the Kingdom of Daniel,” and added how it would advance: “it will not be by Sword or Gun that this Kingdom will roll on.”

      “In the days of these kings” is the phrase that fixes the time. President Kimball took “these kings” to be the group of European nations that followed Rome, and said that the Church restored in 1830 is “the kingdom, set up by the God of heaven, that would never be destroyed nor superseded.” Elder D. Todd Christofferson has taught that the Church is that kingdom, “not created by man but set up by the God of heaven.” President Gordon B. Hinckley spoke of the promise as being fulfilled before the eyes of his hearers.

      The revelation is selective in what it takes from Daniel: “there is no mention in D&C 65:2 of the image of metal and clay.” The omission can be read as deliberate: “the Lord’s emphasis is on the present kingdom of God,” not on empires that have come and gone.
    sources: [lds-scriptures, whittaker-daniel, jsp-discourse-1844-05-12, kimball-stone, christofferson-why-church, hinckley-stone, frederick-old-wine]

  - ref: 47
    phrase: 'your God is a God of gods'
    kind: history
    title: 'What the king conceded'
    body: |
      Nebuchadnezzar’s confession ranks Daniel’s God above other gods; it does not renounce them. He says “your God,” not “my God,” and he praises Him for the thing just shown, as “a revealer of secrets.” The words show the king “allowing Jehovah a place among the pantheon of Babylonian gods and even according Him the special place as revealer”; in acknowledging Daniel’s gifts he “was not acknowledging Jehovah as the only or even the supreme god.” The book bears this out. In the next chapter he sets up “an image of gold” to be worshipped ([[Dan. 3:1]]), and when he tells his second dream he still speaks of “my god” and says that in Daniel “is the spirit of the holy gods” ([[Dan. 4:8]]).

      He also “worshipped Daniel” and ordered an offering made to him. The text records no reply. Daniel had already said that the secret was not his own (verse 30), and the Church’s footnote sets beside the scene Paul and Barnabas at Lystra, who stopped a sacrifice to themselves with the words, “We also are men of like passions with you” ([[Acts 14:15]]).

      Still, the king’s last title gives Daniel’s words back to him. Daniel had said, “there is a God in heaven that revealeth secrets” (verse 28), and the king now calls Him “a revealer of secrets.”
    sources: [draper-exile, ot-manual-28, lds-scriptures]

christ: |
  The kingdom that the stone stands for is the one the Son of Man comes to meet. The revelation that names the stone goes on to pray that God’s kingdom may go forth, so that the earth may be ready when “the Son of Man shall come down in heaven, clothed in the brightness of his glory, to meet the kingdom of God which is set up on the earth” ([[D&C 65:5]]). Daniel’s own later vision uses this chapter’s words of a kingdom given to “one like the Son of man”: “dominion, and glory, and a kingdom,” a kingdom “which shall not be destroyed” ([[Dan. 7:13–14]]).

  After quoting the psalm about the stone the builders rejected, the Savior said, “The kingdom of God shall be taken from you, and given to a nation bringing forth the fruits thereof” ([[Matt. 21:43]]), a verse the Church’s footnotes join to Daniel 2:44. Early Christians took Daniel’s stone to be either Jesus Christ Himself or the kingdom He will establish. Latter-day revelation takes it as the kingdom, and the footnotes on verse 44 point on to Paul for where that kingdom finally goes: “Then cometh the end, when he shall have delivered up the kingdom to God, even the Father” ([[1 Cor. 15:24]]).

explore: |
  - Joseph before Pharaoh, the scene this one is most like: [[Gen. 41:1–45]].
  - The same four kingdoms as four beasts, and the kingdom given to the Son of man and the saints: [[Dan. 7:1–28]].
  - Nebuchadnezzar’s second dream, where he learns in his own person that the Most High rules: [[Dan. 4:1–37]].
  - The Lord giving the nations to Nebuchadnezzar “until the very time of his land come”: [[Jer. 27:5–8]].
  - The revelation on the stone, a prayer for the kingdom: [[D&C 65:1–6]].
  - The mountain of the Lord’s house in the last days: [[Isa. 2:2–3]].
  - For how the first Latter-day Saints read this chapter, see David J. Whittaker’s study “The Book of Daniel in Early Mormon Thought.”

