chapter: 9
title: 'Seventy Years and Seventy Weeks'
tagline: 'Daniel reads in Jeremiah that the exile was to last seventy years, and he answers the number with a confession. Gabriel answers the confession with a larger number, and with the Messiah.'
when: 'The first year of Darius the Mede (9:1), about 539 B.C., soon after Babylon fell.'

setting: |
  The chapter is dated to “the first year of Darius the son of Ahasuerus, of the seed of the Medes,” the king of the lions’ den (see the note on [[Dan. 6:1]]). Babylon has just fallen, about 539 B.C. This Ahasuerus is not the king of the book of Esther. The name belongs to “one Median and two Persian kings,” and here it is the Median, the father of Darius.

  In the book’s order the chapter stands between the vision of the ram and the goat, seen in the third year of Belshazzar ([[Dan. 8:1]]), and the last vision, in the third year of Cyrus ([[Dan. 10:1]]). It is close to seventy years since Daniel was taken from Jerusalem (see the note on verse 2), the empire that took him is gone, and his people are still in exile.

  The chapter has no beasts and no images: Daniel reads, prays, and is answered by an angel who simply speaks. Most of it is prayer (verses 3–19); the prophecy of the seventy weeks is four verses at the end.

thread: |
  The chapter moves from one number to another, and what lies between them is a prayer that never mentions either.

  Daniel reads in Jeremiah that Jerusalem’s desolation was to last seventy years. The years seem to be nearly spent. He does not announce the end of the exile, and he does not ask when it will come. He puts on sackcloth and confesses, saying “we” for sins the book never lays to him. Jeremiah’s promise of return had been joined to praying and seeking the Lord with all the heart, and the law of Moses had joined the remembering of the covenant to confession. Daniel prays, seeks, and confesses.

  The prayer has one argument. God was right to punish, because He had said He would; Israel has no righteousness to offer; so the only ground left is God’s own mercy and God’s own name, which is on the ruined city. “Defer not, for thine own sake.”

  The answer is already on its way when the prayer begins. Gabriel does not speak of seventy years. He speaks of seventy “sevens,” and what they are for is the thing Daniel actually prayed about: an end of sins, reconciliation for iniquity, everlasting righteousness. Daniel asked for a sanctuary. He is told of an Anointed One who will come and be cut off, and of a city destroyed a second time. The arithmetic of the weeks has never been settled. Their purpose is stated in the first sentence.

sections:
  - range: 1-2
    heading: 'Daniel reads the number of the years'
    plain: |
      It was the first year of Darius son of Ahasuerus, a Mede by descent, who had been made king over the realm of the Chaldeans. In that year I, Daniel, came to understand from the books the number of years that, by the word of the LORD to Jeremiah the prophet, were to be completed for the desolations of Jerusalem: seventy.
  - range: 3-14
    heading: 'The confession'
    plain: |
      So I turned to the Lord God to seek Him with prayer and pleading, with fasting, sackcloth, and ashes. I prayed to the LORD my God and confessed:

      “O Lord, great and awesome God, who keeps covenant and mercy with those who love Him and keep His commandments: we have sinned and done wrong; we have acted wickedly and rebelled, turning away from Your commandments and judgments. We did not listen to Your servants the prophets, who spoke in Your name to our kings, our princes, our fathers, and all the people of the land.

      “Righteousness is Yours, Lord, and open shame is ours, as it is today: the men of Judah, the people of Jerusalem, and all Israel, near and far, in every country to which You have driven them for their unfaithfulness to You. Shame is ours, our kings’, our princes’, and our fathers’, because we have sinned against You. Mercy and forgiveness belong to the Lord our God, though we have rebelled against Him and have not obeyed His voice or walked in the laws He set before us by His servants the prophets.

      “All Israel has broken Your law and turned away, refusing to hear Your voice. So the curse and the oath written in the law of Moses, the servant of God, have been poured out on us, because we sinned against Him. He has made good the words He spoke against us and our rulers by bringing on us a great calamity; nothing under heaven has been done like what was done to Jerusalem. All of it came as it is written in the law of Moses, and still we did not seek the favor of the LORD our God by turning from our iniquities and understanding Your truth. So the LORD kept watch over the calamity and brought it on us. The LORD our God is righteous in everything He does, and we did not obey His voice.
  - range: 15-19
    heading: 'The plea'
    plain: |
      “And now, Lord our God, who brought Your people out of Egypt with a mighty hand and made a name for Yourself that stands to this day: we have sinned; we have done wickedly. Lord, in keeping with all Your righteousness, let Your anger and fury turn away from Your city Jerusalem, Your holy mountain. Because of our sins and our fathers’ iniquities, Jerusalem and Your people have become a reproach to everyone around us.

      “Hear the prayer and pleading of Your servant, our God, and for the Lord’s sake let Your face shine on Your desolate sanctuary. Bend Your ear, my God, and hear; open Your eyes and see our desolations and the city called by Your name. We do not lay our pleas before You because of any righteousness of ours, but because of Your great mercies. O Lord, hear. O Lord, forgive. O Lord, listen and act; do not delay, for Your own sake, my God, because Your city and Your people are called by Your name.”
  - range: 20-23
    heading: 'Gabriel comes while Daniel is still praying'
    plain: |
      While I was still speaking, praying and confessing my sin and the sin of my people Israel, and laying my plea before the LORD my God for His holy mountain, the man Gabriel, whom I had seen in the earlier vision, came to me in swift flight about the time of the evening offering. He gave me understanding and said, “Daniel, I have come out now to give you insight and understanding. When you began your pleading a word went out, and I have come to tell it to you, for you are greatly beloved. So consider the word and understand the vision.
  - range: 24-27
    heading: 'The seventy weeks'
    plain: |
      “Seventy weeks are marked out for your people and your holy city: to finish the transgression, to make an end of sins, to make reconciliation for iniquity, to bring in everlasting righteousness, to seal up vision and prophecy, and to anoint the most Holy.

      “Know and understand: from the going out of the word to restore and build Jerusalem until the Messiah the Prince there will be seven weeks and sixty-two weeks. The city will be built again, street and wall, but in troubled times. After the sixty-two weeks the Messiah will be cut off, but not for Himself. The people of a prince who is to come will destroy the city and the sanctuary; its end will come like a flood, and desolations are decreed until the end of the war. He will confirm a covenant with many for one week, and in the middle of the week he will make sacrifice and offering cease. Because abominations spread, he will make it desolate, until the end that has been decreed is poured out on the desolate.”

notes:
  - ref: 2
    phrase: 'understood by books'
    kind: scripture
    title: 'Daniel reads Jeremiah'
    body: |
      Daniel learns the length of the exile by reading: the “books” are writings that include the prophecies of Jeremiah, his older contemporary. The Hebrew is a plural with the article: the books, or the writings. Whether a fixed collection of sacred books is meant cannot be decided from the word: the verse “does not say that these writings formed already a recognised collection.”

      Jeremiah gave the number twice. The nations “shall serve the king of Babylon seventy years” ([[Jer. 25:11]]), and to the exiles he wrote, “after seventy years be accomplished at Babylon I will visit you, and perform my good word toward you, in causing you to return to this place” ([[Jer. 29:10]]). How the seventy are counted is taken up in the notes on [[Jer. 25:11]] and [[Jer. 29:10]].

      A reader may wonder why a promise nearly due sends Daniel to sackcloth. One reconstruction has him reasoning that Babylon “is now fallen,” that it is “seventy years or nearly so” since he was taken, and that “my people have not yet been restored,” so that he resolves to “inquire of the Lord and confess my people’s sins.” Another finds the cause less in the calendar than in the people. What moved him “was rather the religious condition of his own people, among whom the chastisement of the Exile had not produced the expected fruits of repentance.”

      Jeremiah’s letter to the exiles joins the two. Directly after the seventy years it says, “Then shall ye call upon me, and ye shall go and pray unto me, and I will hearken unto you. And ye shall seek me, and find me, when ye shall search for me with all your heart” ([[Jer. 29:12–13]]). Verse 3 has Daniel seeking in that way.
    sources: [lds-scriptures, oshb-wlc, keil-daniel, ot-manual-28, nrsvue]

  - ref: 4
    phrase: 'the LORD my God'
    kind: words
    title: 'The covenant name, only in this chapter'
    body: |
      The divine name, printed LORD in small capitals, appears in the book of Daniel only in this chapter. Elsewhere Daniel and the kings he serves speak of “the God of heaven” ([[Dan. 2:19]]) or “the most High” ([[Dan. 4:17]]). Here the name comes seven times in the King James text (the Hebrew has it once more, in verse 8), and beside it, ten times, stands “Lord” in ordinary type, the title *adonai*.

      The name is “the covenant or proper name of the God of Israel,” and the prayer is a covenant prayer. Daniel begins with God “keeping the covenant and mercy,” measures Israel by “the law of Moses,” and ends by appealing to the name itself, since city and people “are called by thy name.” In a foreign court he speaks of the God of heaven. In confession he calls on Him by name.

      Latter-day Saints understand whose name it is: “Jehovah is the premortal Jesus Christ.”
    sources: [oshb-wlc, bd-jehovah, lds-scriptures]

  - ref: 5
    phrase: 'We have sinned'
    kind: scripture
    title: 'Why the confession is in the plural'
    body: |
      Daniel’s “we” is the confession the law of Moses had asked of an exiled Israel: its own iniquity and its fathers’. Nothing in the book charges him with what he lists. His enemies could find “none occasion nor fault” in him ([[Dan. 6:4]]). Yet he says “we” throughout, and when he describes the prayer afterward he puts himself first: “my sin and the sin of my people Israel” (verse 20).

      He names “the law of Moses” in verses 11 and 13, and the Church’s footnote to verse 13 points to Leviticus 26. After its long list of penalties, ending in scattering among enemies, Leviticus gives the condition for a change: “If they shall confess their iniquity, and the iniquity of their fathers, with their trespass which they trespassed against me” ([[Lev. 26:40]]), “then will I remember my covenant with Jacob, and also my covenant with Isaac, and also my covenant with Abraham will I remember; and I will remember the land” ([[Lev. 26:42]]). Daniel’s prayer has the same words. He confesses “our sins” and “the iniquities of our fathers” (verse 16) and “their trespass that they have trespassed against thee” (verse 7).

      Solomon had foreseen the same moment at the dedication of the temple and had supplied the words. If Israel, carried captive, should “repent, and make supplication unto thee in the land of them that carried them captives, saying, We have sinned, and have done perversely, we have committed wickedness” ([[1 Kgs. 8:47]]), he asked the Lord to hear. Verse 5 is nearly that sentence, and Daniel says it for everyone: he “prays for all Israel.”
    sources: [lds-scriptures]

  - ref: 11
    phrase: 'the curse is poured upon us, and the oath that is written in the law of Moses'
    kind: scripture
    title: 'The curse and the oath in the law of Moses'
    body: |
      The “curse” and the “oath” are the penalties attached to the covenant, written out in Leviticus 26 and Deuteronomy 28–29. Moses had warned that if Israel would not hearken, “all these curses shall come upon thee, and overtake thee” ([[Deut. 28:15]]), and that the anger of the Lord would bring on the land “all the curses that are written in this book” ([[Deut. 29:27]]).

      Daniel names them to say that the catastrophe was God’s word kept: “he hath confirmed his words, which he spake against us” (verse 12). So he can say in the same breath that the Lord brought the evil and that “the LORD our God is righteous in all his works which he doeth” (verse 14). The same chapter of Leviticus that holds the penalties also holds the promise that follows confession (see the note on verse 5).
    sources: [lds-scriptures]

  - ref: 14
    phrase: 'hath the LORD watched upon the evil'
    kind: words
    title: 'The Lord who watched'
    body: |
      “Watched” translates the Hebrew *shaqad*, to “watch, wake,” and with the Lord as its subject to “keep watch of, be wakeful over” a thing until it is done. Jeremiah uses it this way. It is the word of his call, where the King James has “I will hasten my word to perform it” ([[Jer. 1:12]]), and of the promise that the Church’s footnote joins to this verse: “like as I have watched over them, to pluck up, and to break down, and to throw down, and to destroy, and to afflict; so will I watch over them, to build, and to plant, saith the Lord” ([[Jer. 31:28]]).

      Daniel’s verse speaks of the first kind of watching. The Lord stayed awake over the calamity (“evil” here is calamity, as the footnote to verse 12 says) until it came. Jeremiah’s sentence has a second half, a watching to build and to plant.
    sources: [bdb, lds-scriptures]

  - ref: 19
    phrase: 'for thine own sake'
    kind: scripture
    title: 'What Daniel pleads'
    body: |
      Daniel asks on the ground of God’s character and God’s name, and expressly not on the ground of anything Israel has done. Verse 18 states the rule: “we do not present our supplications before thee for our righteousnesses, but for thy great mercies.” He never says that the seventy years are up, that the punishment has been long enough, or that he himself has been faithful.

      What he offers instead are things true of God. He “brought thy people forth out of the land of Egypt” and so gained “renown” (verse 15). His “righteousness” in verse 16 is a record of things done, “all your righteous acts” in one modern translation. And His name is on the ruins: “thy city and thy people are called by thy name.” The same phrase stands in the chapter of Jeremiah that gave the seventy years, where the Lord says, “I begin to bring evil on the city which is called by my name” ([[Jer. 25:29]]).

      The possessives carry the plea. Through verse 19 it is “thy city,” “thy holy mountain,” “thy sanctuary,” “thy people.” When Gabriel answers, he hands two of them back: the seventy weeks are determined “upon thy people and upon thy holy city” (verse 24), and now “thy” is Daniel.

      The last verse breaks into short cries: “O Lord, hear; O Lord, forgive; O Lord, hearken and do; defer not.” The answer shows how little deferring there was (see the note on verse 23).
    sources: [lds-scriptures, nrsvue]

  - ref: 21
    phrase: 'the man Gabriel'
    kind: history
    title: 'Gabriel, a second time'
    body: |
      Gabriel is the messenger who explained the vision of the ram and the goat ([[Dan. 8:16]]), and Daniel knows him: “whom I had seen in the vision at the beginning.” He is named twice in the Old Testament, both times in visits to Daniel. Who he is, is told in the note on [[Dan. 8:16]].

      “Being caused to fly swiftly” is a hard phrase, and it does not settle what Daniel saw. The two Hebrew words come from a root for weariness, and they have been glossed “weary with weariness, utterly weary,” with the weariness explained as coming “from winged flight.” A modern translation has “in swift flight.” The verse itself calls him “the man” and describes nothing else about him.

      His errand is stated in a word that runs through the chapter. Daniel had “understood” by books (verse 2). Gabriel now “informed” him (verse 22) and tells him to “understand the matter” (verse 23), and the Hebrew verb is the same each time. Study gave Daniel the number; a messenger was sent to give him understanding.
    sources: [mcconkie-special-witnesses, bdb, nrsvue, oshb-wlc, lds-scriptures]

  - ref: 21
    phrase: 'about the time of the evening oblation'
    kind: history
    title: 'An hour kept without a temple'
    body: |
      Daniel tells the time by a sacrifice that was not being offered. The “evening oblation” is “the evening sacrifice” in a modern translation, and by his own words the sanctuary was “desolate” (verse 17). He still reckons his day by it.

      The hour mattered because it was an hour of prayer: the “time of the evening oblation was the time of evening prayer for the congregation.” Ezra, confessing the sins of the returned exiles, says that “at the evening sacrifice I arose up from my heaviness; and having rent my garment and my mantle, I fell upon my knees, and spread out my hands unto the Lord my God” ([[Ezra 9:5]]). A psalm puts the two side by side: “Let my prayer be set forth before thee as incense; and the lifting up of my hands as the evening sacrifice” ([[Ps. 141:2]]). Daniel, with no temple, is praying at its hour.
    sources: [lds-scriptures, nrsvue, keil-daniel]

  - ref: 23
    phrase: 'At the beginning of thy supplications the commandment came forth'
    kind: words
    title: 'Answered at the first word'
    body: |
      The answer was sent when Daniel began to pray, not when he finished. Gabriel arrives “whiles I was speaking” (verses 20–21) and says that the “commandment” went out “at the beginning of thy supplications.” The Hebrew noun is simply *dabar*, “word,” and a modern translation has “a word went out.” Daniel will be told the same in his last vision: “from the first day that thou didst set thine heart to understand, and to chasten thyself before thy God, thy words were heard, and I am come for thy words” ([[Dan. 10:12]]).

      The same noun returns two verses later, where the seventy weeks are counted “from the going forth of the commandment to restore and to build Jerusalem” (verse 25). That translation renders both alike, as a word that “went out.” The text does not say whose word is meant in verse 25.

      Gabriel gives a reason for his coming: “for thou art greatly beloved.” Daniel hears the phrase twice more ([[Dan. 10:11]]; [[Dan. 10:19]]).
    sources: [oshb-wlc, nrsvue, lds-scriptures]

  - ref: 24
    phrase: 'Seventy weeks are determined'
    kind: words
    title: 'Seventy sevens'
    body: |
      “Weeks” here are “sevens,” and the text does not say sevens of what. The Hebrew word means a “period of seven (days, years), heptad, week,” and “sevens” would be the closer translation. One gloss for this verse is a “heptad or seven of years.” One Latter-day Saint reading calls the seventy weeks “a symbol for an unknown period of time.”

      The number stands beside the one Daniel had been reading. He came with Jeremiah’s seventy years and is given seventy sevens. Israel’s law counted years in sevens: each seventh year was a sabbath year, and the jubilee came after “seven sabbaths of years unto thee, seven times seven years” ([[Lev. 25:8]]). The exile itself had been described in those terms, lasting “until the land had enjoyed her sabbaths: for as long as she lay desolate she kept sabbath, to fulfil threescore and ten years” ([[2 Chr. 36:21]]). On that ground it has been argued that sevens of years would be the natural sense for Daniel. The argument is disputed, since the law never calls its seven-year periods by the word used here, and Gabriel does not explain the number.

      “Determined” translates a verb cited from this verse alone. Its sense in later Hebrew is to “cut, cut off, decide”: the time is measured off.

      Gabriel divides the seventy into seven, sixty-two, and one (verses 25–27). Many schemes of years have been built on those figures, and they do not agree; the passage has been called “one of the most difficult passages in all of the Old Testament.” None is worked out here. What the weeks are for is plainer than how long they are, and Gabriel says that first.
    sources: [bdb, ot-manual-28, mcconkie-special-witnesses, keil-daniel, lds-scriptures]

  - ref: 24
    phrase: 'to make reconciliation for iniquity'
    kind: christ
    title: 'Six things the seventy weeks are for'
    body: |
      Gabriel states the purpose of the seventy weeks before any of their divisions, in six clauses, and the first three are about sin. The weeks are “to finish the transgression, and to make an end of sins, and to make reconciliation for iniquity,” and then “to bring in everlasting righteousness, and to seal up the vision and prophecy, and to anoint the most Holy.” Daniel had confessed “our sins” and “the iniquities of our fathers” (verse 16) and asked for forgiveness. The answer takes up his words and promises their end.

      “Make reconciliation” is the Hebrew *kipper*, the verb for making atonement: to “cover over,” “pacify, make propitiation.” A modern translation has “to atone for iniquity.” The Church’s heading for the chapter makes this clause its summary of the Messiah’s work: He “will make reconciliation for iniquity.” Daniel had asked that anger be turned away for the sake of “thy great mercies.” He is told that atonement will be made, and in the next verses by whom.

      Three points of wording are worth knowing. In “make an end of sins” the Hebrew text has two readings, one written, “to seal up,” and one read aloud in its place, “to make an end” (scribes call the written form the *ketiv* and the form read aloud the *qere*). The King James follows the second. “The vision and prophecy” is literally “vision and prophet,” and “seal up” is the verb to “seal, affix seal.” And “the most Holy” is the Hebrew for holy of holies, without the article, which can be a place, a thing, or a person; a modern translation that chooses “a most holy place” gives “thing or one” as alternatives. The verb “anoint” is the root of the word “Messiah,” which Gabriel uses in his next sentence.
    sources: [bdb, strongs-concordance, oshb-wlc, nrsvue, lds-scriptures]

  - ref: 25
    phrase: 'unto the Messiah the Prince'
    kind: words
    title: 'Messiah the Prince'
    body: |
      “Messiah” is the Hebrew *mashiach*, “anointed,” and these two verses are the only places in the Old Testament where the King James Version keeps the word as a title: it “occurs only in Dan. 9:25–26 and John 1:41; 4:25.” Everywhere else the translators wrote “anointed,” and the word is used of several kinds of people. Cyrus the Persian is the Lord’s “anointed” in [[Isa. 45:1]]. More often the word names the “king of Israel anointed by divine command” or the “high priest of Israel.” “Prince” is *nagid*, a “leader.” Neither word has the article in Hebrew, so the phrase is closer to “an anointed prince,” as one modern translation has it.

      That openness is why other figures have been proposed: some “refer Daniel 9:25 to Cyrus” or to a high priest. The Church reads the title of Jesus Christ. The heading to the chapter says that Gabriel “reveals the time of the coming of the Messiah,” and the title is the one the New Testament gives to Jesus: “the Christ, which is the Greek equivalent of Messiah.”

      The verse’s arithmetic depends on its punctuation. The King James joins “seven weeks, and threescore and two weeks” into one span that runs up to the Messiah. The traditional Hebrew punctuation puts the verse’s main pause after “seven weeks,” and one modern translation reads accordingly: “until the time of an anointed prince, there shall be seven weeks, and for sixty-two weeks it shall be built again.”
    sources: [bd-messiah, bdb, oshb-wlc, nrsvue, lds-scriptures]

  - ref: 26
    phrase: 'shall Messiah be cut off, but not for himself'
    kind: christ
    title: 'Cut off, but not for himself'
    body: |
      The Anointed One comes and is cut off, and the Church’s sources read this of the Savior’s death: the heading to the chapter says “The Messiah will be cut off,” and the phrase “seems to be an allusion to His Crucifixion.” The verb is the ordinary Hebrew for to “cut off, cut down.”

      “But not for himself” is the King James translators’ reading of two short Hebrew words that say, roughly, that there is nothing to him. A modern translation gives “and shall have nothing.” On the King James reading the clause says that His death is for others. On the other it says that He is left with nothing.

      A Messiah who dies is all but absent from Jewish writings before Christ: “in pre-Christian Jewish texts of the Second Temple period the notion that the messiah was to suffer and die was virtually nonexistent.” Read apart from the event, the verse is “ambiguous” as to whether the anointed one is killed. The Church’s sources, reading after the event, take it of His death.

      What follows the cutting off is a second destruction. “The people of the prince that shall come shall destroy the city and the sanctuary.” Daniel has just prayed for a ruined city and a desolate sanctuary. He is told that they will be rebuilt “in troublous times” (verse 25) and then destroyed again. The Church’s footnote joins the verse to the Savior’s lament over Jerusalem, whose enemies “shall not leave in thee one stone upon another; because thou knewest not the time of thy visitation” ([[Luke 19:44]]), and the rest of the chapter is read of “the destruction of Jerusalem and the temple.” The text does not name the prince.
    sources: [lds-scriptures, ot-manual-28, bdb, oshb-wlc, nrsvue, hatch-messianism]

  - ref: 27
    phrase: 'he shall confirm the covenant with many for one week'
    kind: scripture
    title: 'The last week, and what is not explained'
    body: |
      The confirming of the covenant for one week “has not been satisfactorily explained.”

      The first difficulty is who “he” is. The nearest noun is “the prince that shall come,” the destroyer of verse 26, and one modern translation reads the whole verse of him, ending with the decreed end “poured out upon the desolator.” It also marks part of the verse “Meaning of Heb uncertain.” One Latter-day Saint reading takes “he” to be the Lord instead. On that reading the prophecy “suggests that the New Testament church would fall into apostasy,” and the week “may typify the decades that Christ’s true church endured, led then by living apostles and prophets.” It is offered as a possibility.

      What can be said with confidence is narrower. The verse speaks of sacrifice and oblation ceasing and of “abominations” that make desolate, and the end of the chapter “parallels very closely” the Savior’s prophecy: “When ye therefore shall see the abomination of desolation, spoken of by Daniel the prophet, stand in the holy place” ([[Matt. 24:15]]). Joseph Smith’s inspired revision of that verse applies the phrase to “the destruction of Jerusalem” ([[JS—M 1:12]]) and again to the last days ([[JS—M 1:32]]). Daniel’s own wording for it, “the abomination that maketh desolate,” comes later, and the note on [[Dan. 11:31]] gives the full account.

      The chapter stops there, with desolation “determined” and no word of what Daniel thought.
    sources: [ot-manual-28, nrsvue, eom-daniel-prophecies, bd-abomination-of-desolation, lds-scriptures]

christ: |
  Daniel prays for a city and is answered with a person. He asks that the sanctuary be restored and the anger turned away. Gabriel tells him that iniquity itself will be atoned for, and that an Anointed One will come and be cut off. Latter-day Saint teaching reads the Savior here: verse 24 “is undoubtedly a reference to the coming of Christ and His Atonement, by which forgiveness of sins and reconciliation to God through repentance would be made possible.”

  The LORD to whom Daniel confesses is, in Latter-day Saint understanding, the premortal Christ (see the note on verse 4). And Gabriel, who tells Daniel in Babylon that the Messiah will come, is the angel later “sent from God unto a city of Galilee, named Nazareth” ([[Luke 1:26]]), to tell Mary that she was “to become the mother of God’s Son.”

  Daniel rested his plea on mercy and not on “our righteousnesses.” What Gabriel promised was “that an everlasting righteousness would be accomplished in their behalf.”

explore: |
  - Jeremiah’s two prophecies of the seventy years, with the condition attached to the second: [[Jer. 25:8–14]] and [[Jer. 29:10–14]].
  - The covenant terms Daniel prays from, penalties and promise together: [[Lev. 26:14–46]].
  - Solomon’s prayer for exiles who confess: [[1 Kgs. 8:46–53]].
  - Ezra’s confession at the evening sacrifice: [[Ezra 9:5–15]].
  - The word of Jeremiah fulfilled in the first year of Cyrus: [[Ezra 1:1–4]].
  - Gabriel’s other visits: [[Dan. 8:15–19]] and [[Luke 1:5–38]].
  - The Savior on what Daniel foretold, for Jerusalem and for the last days: [[JS—M 1:12–20]] and [[JS—M 1:31–32]].
  - Daniel at prayer in this same reign: [[Dan. 6:10]].

