chapter: 10
title: 'The Man Clothed in Linen'
tagline: 'After three weeks of mourning with no answer, Daniel sees the Lord in glory beside the Tigris and learns that his prayer was heard on the first day.'
when: 'The third year of Cyrus king of Persia (10:1), about 536 B.C., counting from his conquest of Babylon in 539 B.C. The vision comes on the twenty-fourth day of the first month (10:4). It is the latest date in the book.'

setting: |
  This is the last date the book gives. Babylon has been Persian for about three years, the Jews have been free to go home since the first year of Cyrus ([[Ezra 1:1]]), and Daniel, carried off as a young man around the beginning of the sixth century B.C., is now very old. He is not in Jerusalem. He is on the bank of “the great river, which is Hiddekel,” the Tigris, with companions the chapter does not name.

  Chapters 10 through 12 are a single vision, and this chapter is its introduction. Daniel mourns, sees a figure in glory, collapses, and is raised and strengthened so that he can hear what a messenger has come to tell him. The telling itself is chapter 11, and the vision closes in chapter 12 at the same river, with the man clothed in linen still present. The chapter division falls in the middle of a speech: the messenger who begins speaking in verse 20 is still speaking in [[Dan. 11:1]].

  The first verse introduces the vision in the third person and gives Daniel his Babylonian name. From verse 2 he tells it himself.

thread: |
  The chapter shows Daniel what was happening during three weeks in which, as far as he could tell, nothing happened.

  He fasts and mourns through the first month of the year and receives no answer. Then, in the space of a few verses, he is told that his words were heard “from the first day,” that the one sent to him was withstood for twenty-one days, the length of his fast, and that the opposition came from a “prince” no one on earth could see. The first verse had already named the subject. Where the King James reads “the time appointed was long,” the Hebrew can be read as “a great conflict,” and the chapter gives the first glimpse of one.

  Before any of that is explained, Daniel sees a figure in glory. Only afterward does he hear of the conflict and, in chapter 11, of kings making war over the land where his people live.

  The rest of the chapter makes Daniel able to listen. The vision leaves him on his face without strength or speech, and he is touched three times and told twice not to fear. The verb “strengthen” fills verses 18 and 19, and it returns in the last verse for the one ally the messenger names: only Michael “holdeth with me,” and the Hebrew verb is the same one.

sections:
  - range: 1-3
    heading: 'Three weeks of mourning'
    plain: |
      In the third year of Cyrus king of Persia a word was revealed to Daniel, who was called Belteshazzar. The word was true, and it concerned a great conflict. He understood it, and understanding came to him in the vision.

      In those days, Daniel says, I was mourning for three full weeks. I ate no choice food, no meat or wine entered my mouth, and I did not anoint myself at all until the three weeks were over.
  - range: 4-9
    heading: 'The vision by the Tigris'
    plain: |
      On the twenty-fourth day of the first month I was on the bank of the great river, the Tigris. I looked up and saw a man clothed in linen, with a belt of fine gold from Uphaz around his waist. His body was like beryl, his face like lightning, his eyes like burning lamps, his arms and feet like the gleam of polished brass, and the sound of his words like the sound of a multitude.

      I alone saw the vision. The men with me did not see it, but a great trembling fell on them and they ran to hide. So I was left alone with this great vision. No strength remained in me; my appearance was disfigured and I had no strength left. Yet I heard the sound of his words, and as I heard it I fell into a deep sleep with my face to the ground.
  - range: 10-14
    heading: 'The messenger explains the delay'
    plain: |
      Then a hand touched me and set me, shaking, on my hands and knees. He said to me, “Daniel, man greatly beloved, understand the words I am speaking to you, and stand upright, for I have now been sent to you.” When he said this I stood up trembling.

      He said, “Do not fear, Daniel. From the first day that you set your heart to understand and to humble yourself before your God, your words were heard, and I have come because of your words. But the prince of the kingdom of Persia withstood me twenty-one days. Then Michael, one of the chief princes, came to help me, and I remained there with the kings of Persia. Now I have come to make you understand what will happen to your people in the latter days, for the vision is for days yet to come.”
  - range: 15-19
    heading: 'Daniel is strengthened'
    plain: |
      While he was saying this to me I turned my face to the ground and could not speak. Then one who looked like a man touched my lips, and I opened my mouth and said to the one standing before me, “My lord, because of the vision anguish has come over me, and I have no strength left. How can my lord’s servant talk with my lord? No strength remains in me, and no breath is left in me.”

      Again one who looked like a man touched me and strengthened me. He said, “Man greatly beloved, do not fear. Peace be with you. Be strong; yes, be strong.” As he spoke to me I was strengthened and said, “Let my lord speak, for you have strengthened me.”
  - range: 20-21
    heading: 'What he must return to'
    plain: |
      He said, “Do you know why I have come to you? Now I must return to fight with the prince of Persia, and when I have gone out, the prince of Grecia will come. But I will tell you what is inscribed in the writing of truth. No one stands with me against these except Michael, your prince.”

notes:
  - ref: 1
    phrase: 'In the third year of Cyrus king of Persia'
    kind: history
    title: 'The third year of Cyrus, and Daniel still in the east'
    body: |
      The date places Daniel beside the Tigris about two years after his people were free to go home. Cyrus conquered Babylon in 539 B.C. and “issued a decree allowing the Jews to return to the land of Judah and rebuild the temple.” Ezra dates that decree to “the first year of Cyrus king of Persia” ([[Ezra 1:1]]). Counting from the conquest, the third year is about 536 B.C.

      The book’s first chapter had said that Daniel “continued even unto the first year of king Cyrus” ([[Dan. 1:21]]). That verse marked how far his service at court reached. This one shows him alive two years later, beside the Tigris, and still receiving revelation.

      Why he did not go up to Jerusalem with the first company the chapter does not say, and no reason is given anywhere in the book. What the chapter does show is where his mind was. He spends three weeks in mourning, and when the messenger arrives, the subject is “what shall befall thy people” (verse 14).
    sources: [lds-scriptures, bd-cyrus, scripture-helps-dan]

  - ref: 1
    phrase: 'the time appointed was long'
    kind: words
    title: 'A great conflict'
    body: |
      The Hebrew behind this clause is two words, *tsaba gadol*, a great warfare, and it can describe what the revelation is about rather than how long Daniel must wait. *Tsaba* is the ordinary word for an “army, war, warfare.” It is the word in the title “LORD of hosts.” This verse is grouped with a few others where the word means the “hard service of troubled life.” In one of them the King James again has an appointed time, “Is there not an appointed time to man upon earth?” ([[Job 7:1]]), and in another it keeps “warfare”: Jerusalem is to be told “that her warfare is accomplished” ([[Isa. 40:2]]).

      Translated in its military sense, the clause reads, “The word was true, and it concerned a great conflict.” The ancient Greek version went another way and made the words describe Daniel, to whom “great power and understanding in the vision was given.”

      The chapter itself has a conflict in view. The messenger says he was “withstood” for twenty-one days (verse 13) and must “return to fight” (verse 20).
    sources: [oshb-wlc, bdb, nrsvue, lxx-rahlfs, lds-scriptures]

  - ref: 3
    phrase: 'I ate no pleasant bread'
    kind: history
    title: 'Three weeks of mourning, through Passover'
    body: |
      Daniel’s fast was a long, partial one, and its dates put it across the Passover. The previous chapter says simply that he sought the Lord “with fasting, and sackcloth, and ashes” ([[Dan. 9:3]]). This one says what he went without. For three weeks he gave up what made a meal pleasant: “pleasant bread,” which is choice food in general, along with meat and wine. He also stopped anointing himself. Oil on the skin “was the sign of joy,” and people left it off in grief.

      The vision came on the twenty-fourth day of the first month, after the three weeks “were fulfilled.” The first month is the month of the Passover and of unleavened bread, kept from the fourteenth day “until the one and twentieth day of the month at even” ([[Ex. 12:18]]). Exactly which day the fast began “is not certainly answered from the text,” but any three weeks that end by the twenty-fourth contain the feast. In the season when Israel remembered being brought out of bondage, Daniel was in mourning.

      The chapter does not say what he mourned. Verse 12 says only that he had set his heart “to understand.” The book of Ezra supplies a likely cause. The returned exiles had begun the temple’s foundation in the second year of their return, and their neighbors then “hired counsellors against them, to frustrate their purpose, all the days of Cyrus king of Persia” ([[Ezra 4:5]]). One reading is that Daniel, hearing of it at the turn of the year, mourned “over the delay of the salvation promised to his people.” That is an inference from the dates, and a reasonable one.
    sources: [lds-scriptures, keil-daniel]

  - ref: 5
    phrase: 'a certain man clothed in linen'
    kind: christ
    title: 'The man clothed in linen'
    body: |
      The figure Daniel sees is the Lord, on the reading the Church’s edition gives in its chapter heading: Daniel “sees the Lord and others in a glorious vision.” The description is the kind prophets give of Him, and it has been set beside three others. Ezekiel saw “the likeness as the appearance of a man” on a throne, wrapped in fire and brightness ([[Ezek. 1:26–28]]). John saw “one like unto the Son of man, clothed with a garment down to the foot, and girt about the paps with a golden girdle,” with eyes “as a flame of fire,” feet “like unto fine brass,” and a voice “as the sound of many waters” ([[Rev. 1:13–15]]). In the Kirtland Temple Joseph Smith and Oliver Cowdery saw the Lord, and “His eyes were as a flame of fire” ([[D&C 110:3]]). Daniel’s description is very like these: the girded waist, the eyes like lamps of fire, the limbs like polished brass, the voice like the sound of many.

      The clothing says something as well. The linen is *baddim*, “white linen,” the “material of different priestly vestments,” and what Aaron was to put on when he entered the holy place, “the holy linen coat” ([[Lev. 16:4]]). Ezekiel saw a heavenly figure dressed the same way ([[Ezek. 9:2]]). John’s Greek words for the Lord’s robe are the words the Greek Old Testament uses for the high priest’s vestments and for this verse, and in his vision the golden girdle “marked royalty,” so that “the Lord presents Himself as both king and priest.” Daniel’s figure also wears linen and a girdle of gold.

      A careful reader will then ask whether this is the one who speaks from verse 10 on, because the speaker says he was “sent,” was held back for twenty-one days, and needed Michael’s help. The text does not mark a change of person. But it does not say that the glorious figure is the one who touches Daniel either. Verse 10 says only “an hand touched me,” and the phrases of verses 16 and 18, “one like the similitude of the sons of men” and “one like the appearance of a man,” “leave the person of him who touched him undefined.” More than one being is certainly present. When the vision ends, the man clothed in linen is “upon the waters of the river” while “other two” stand on its banks ([[Dan. 12:5–6]]).

      Readers have divided over it. One view is that the figure of verses 5 and 6 “is present in silent majesty” and that a messenger speaks for him. Against it, the difference between the one who appears and the one who speaks “is not made out” in the text, and receiving help from Michael need not make the speaker Michael’s inferior. This chapter follows the heading’s “the Lord and others.” Daniel sees the Lord in verses 5 through 9, and the one who was sent to him, and who explains and strengthens him from verse 10, is read as one of the others. That is a reading, and the text allows it without requiring it.
    sources: [lds-scriptures, ot-manual-28, bdb, oshb-wlc, draper-apocalyptic, keil-daniel]

  - ref: 8
    phrase: 'there remained no strength in me'
    kind: scripture
    title: 'Strength gone, and given back by three touches'
    body: |
      The vision takes Daniel’s strength entirely, and much of the chapter goes to restoring it. “My comeliness was turned in me into corruption” is physical. “Comeliness” is *hod*, “splendour, majesty, vigour,” used here of vigor “as displayed in outward appearance,” and “corruption” is a word for ruin, glossed in this verse as “disfigurement.” A modern translation has “my complexion grew deathly pale.” He then falls into “a deep sleep” on his face, as he had in an earlier vision ([[Dan. 8:18]]).

      He is brought back in three stages. A hand sets him on his hands and knees, and at a word he stands, trembling (verses 10–11). He loses his speech, and a touch on his lips restores it (verses 15–16), as a touch on the mouth prepared Isaiah and Jeremiah to speak ([[Isa. 6:7]]; [[Jer. 1:9]]). Even then he can only say that he has no breath left. A third touch strengthens him (verse 18). The Hebrew verb for “strengthen” then comes five times in two verses: “he strengthened me,” “be strong, yea, be strong,” “I was strengthened,” “thou hast strengthened me.”

      Other prophets describe the same cost. After Moses saw God, “it was for the space of many hours before Moses did again receive his natural strength like unto man” ([[Moses 1:10]]), and he drew a conclusion from it: “man is nothing.” Joseph Smith wrote of the morning in the grove, “When the light had departed, I had no strength” ([[JS—H 1:20]]). The Book of Mormon tells of people whose “spiritual experiences drain their strength” in the same way.
    sources: [lds-scriptures, bdb, nrsvue, oshb-wlc, sc-knowhy-460]

  - ref: 11
    phrase: 'a man greatly beloved'
    kind: words
    title: 'A man greatly beloved'
    body: |
      The Hebrew is *ish chamudot*, a man of preciousness, and the word is one Daniel has just used of the food he gave up. *Chamudot* is a plural noun meaning “desirableness, preciousness.” Elsewhere it describes “desirable, choice things” such as fine garments and gold. It is said of a person only of Daniel, here, in verse 19, and when Gabriel told him, “thou art greatly beloved” ([[Dan. 9:23]]), which has been rendered “thou art a precious treasure.”

      The “pleasant bread” of verse 3 is the same word, *lechem chamudot*, bread of preciousness. The chapter does not comment on the repetition.

      The phrase does not say who holds him dear. The messenger adds only, “unto thee am I now sent.” Each of the three times Daniel is called this, across two visions, he is being told to understand or strengthened to hear.
    sources: [oshb-wlc, bdb, lds-scriptures]

  - ref: 12
    phrase: 'from the first day'
    kind: scripture
    title: 'Heard on the first day, answered on the twenty-first'
    body: |
      Daniel’s prayer was heard the day he began it, and the three weeks he waited match the messenger’s delay. He mourned “three full weeks” (verse 2), and the messenger was withstood “one and twenty days” (verse 13).

      The same thing had been said to him once before. In the previous chapter Gabriel arrived while Daniel was still praying and told him, “At the beginning of thy supplications the commandment came forth” ([[Dan. 9:23]]). There the answer came while he was still praying. Here it comes three weeks later.

      What was heard is described in two phrases. He had set his heart “to understand,” and “to chasten thyself,” which in the Hebrew is to humble himself. The messenger then says, “I am come for thy words,” that is, “because of your words.” The chapter treats the fast and the prayer as the cause of the visit. The delay had a different cause, which the next verse gives.
    sources: [lds-scriptures, nrsvue]

  - ref: 13
    phrase: 'the prince of the kingdom of Persia withstood me one and twenty days'
    kind: history
    title: 'The prince of the kingdom of Persia'
    body: |
      The “prince” who holds back the messenger is best read as an unseen power behind the Persian empire and not as Cyrus or any of his officers. The word is *sar*, an everyday term for a “chief, ruler, official, captain,” and it is the title of the “prince of the eunuchs” who had charge of Daniel as a boy ([[Dan. 1:7]]). But in late Hebrew it is used “especially of angels,” and it has a sense found “only” in Daniel, “patron-angel,” for the princes of Persia and Grecia and for Michael.

      The verse itself points that way. The prince is distinguished from “the kings of Persia” named a few words later. He resists a heavenly messenger for three weeks. And the one who comes to break the deadlock is Michael, who bears the same title. From Michael’s part in it the reasoning has been drawn that this was “the leader of the evil forces that supported the unrighteous dominion of the kingdoms of the world,” and then, carefully: “If that reasoning is correct, then Satan or one of his host is the prince spoken of.” The conditional belongs to the statement. The chapter does not name the prince, and it does not say what the contest was over.

      The end of the verse is uncertain in a way that affects the picture. The Hebrew verb in “I remained there” means to “be left over, remain over.” A modern translation follows the ancient Greek instead: “I left him there with the prince of the kingdom of Persia,” which makes Michael stay to hold the ground while the messenger goes to Daniel. Its footnote gives the Hebrew as “I was left there with the kings of Persia.”

      Verse 20 adds that the conflict will outlast Persia: “when I am gone forth, lo, the prince of Grecia shall come.” The book has already said, in plain terms, that Persia would give way to Grecia ([[Dan. 8:20–21]]), and chapter 11 opens with the kings of Persia and “the realm of Grecia” ([[Dan. 11:2]]).
    sources: [bdb, oshb-wlc, ot-manual-28, nrsvue, lxx-rahlfs, lds-scriptures]

  - ref: 13
    phrase: 'Michael, one of the chief princes'
    kind: prophets
    title: 'Michael is Adam'
    body: |
      Latter-day revelation identifies Michael as Adam. Joseph Smith taught in 1839 that Adam “is Michael the Archangel spoken of in the scriptures,” and the Doctrine and Covenants speaks of “Michael, or Adam, the father of all, the prince of all, the ancient of days” ([[D&C 27:11]]). This book has shown him once already under that last title ([[Dan. 7:9]]). The name means “Who is like God,” and the archangel is mentioned in the Bible five times, three of them in this vision.

      Daniel’s title for him is “prince,” and the revelations keep it. At Adam-ondi-Ahman Adam’s posterity “called him Michael, the prince, the archangel” ([[D&C 107:54]]). Another revelation has the phrase that closes this chapter, saying that the Lord “hath appointed Michael your prince” ([[D&C 78:16]]).

      The “your” of verse 21 is plural in Hebrew. Michael is the prince of Daniel’s people, and the last chapter says so outright: he is “the great prince which standeth for the children of thy people” ([[Dan. 12:1]]).

      “One of the chief princes” is literally one of the *first* princes. The adjective is the one translated “first” in “the first month” (verse 4) and “the first day” (verse 12). The chapter does not say how many such princes there are or name another.

      Elsewhere in scripture Michael is shown in contests of this kind. Jude has him “contending with the devil” ([[Jude 1:9]]). John saw that “Michael and his angels fought against the dragon” ([[Rev. 12:7]]). At the very end “Michael shall fight their battles” ([[D&C 88:115]]).
    sources: [bd-michael, jsp-discourse-1839-a, lds-scriptures, oshb-wlc]

  - ref: 14
    phrase: 'in the latter days'
    kind: words
    title: 'How far “the latter days” reach'
    body: |
      “The latter days” here names where the vision ends, not the only time it covers. What the messenger goes on to tell begins with the next kings of Persia ([[Dan. 11:2]]) and runs to the time when Michael stands up and Daniel’s people are delivered ([[Dan. 12:1]]). It is an account “of things from Daniel’s time extending far into the future, including the latter days.”

      The phrase had been used this way before. It is the Hebrew form of the expression Daniel used in Aramaic before Nebuchadnezzar, when he said that God was making known “what shall be in the latter days” ([[Dan. 2:28]]). That dream also began with the king then reigning and ended with a kingdom set up by the God of heaven. In both places the phrase points to the far end of a long sequence that starts in the hearer’s present.

      Two other words in the verse set the scope. The vision is “for many days,” as Gabriel had said of an earlier one, “it shall be for many days” ([[Dan. 8:26]]). And it concerns “thy people.” Chapter 11 will be full of foreign kings, but they are there as background, for the effect of their wars on the Lord’s people. The messenger says as much before he begins.
    sources: [oshb-wlc, lds-scriptures, ot-manual-28]

  - ref: 21
    phrase: 'the scripture of truth'
    kind: words
    title: 'The writing of truth'
    body: |
      “Scripture” here means simply a writing. The Hebrew is rendered “that which is inscribed in the writing of truth,” and a modern translation has “what is inscribed in the book of truth.” The messenger is about to tell Daniel things that have not happened, and he speaks of them as already written down.

      The chapter does not say what book this is. One reading takes it to be “the book in which God has designated beforehand, according to truth, the history of the world as it shall certainly be unfolded,” like the book of remembrance of [[Mal. 3:16]] and the book John saw in [[Rev. 5:1]]. That is an interpretation. What the text gives is the messenger’s promise to show Daniel what is noted there, and then his next words: “And now will I shew thee the truth” ([[Dan. 11:2]]).

      The word “truth” closes the chapter as it opened it. Verse 1 said of the whole revelation that “the thing was true,” with the same Hebrew word, *emet*.
    sources: [bdb, oshb-wlc, nrsvue, keil-daniel, lds-scriptures]

christ: |
  The scriptures that describe the Lord in terms like Daniel’s say who He is. When John saw a figure so described, he “fell at his feet as dead,” and the One he saw laid a hand on him and said, “Fear not; I am the first and the last” ([[Rev. 1:17]]). In the Kirtland Temple the voice was “even the voice of Jehovah” ([[D&C 110:3]]), and it said, “I am he who liveth, I am he who was slain; I am your advocate with the Father” ([[D&C 110:4]]). If the figure beside the Tigris is the Lord, as the Church’s chapter heading has it, Daniel saw Jesus Christ, who would be slain and who lives.

  Ezekiel saw “the appearance of the likeness of the glory of the LORD” and fell on his face ([[Ezek. 1:28]]). Daniel and John fall too, and each is touched and told not to fear.

explore: |
  - A vision much like this one, with the Lord naming Himself: [[Rev. 1:10–18]].
  - The Lord seen in the Kirtland Temple: [[D&C 110:1–10]].
  - Ezekiel’s vision of the glory of the Lord by another river of the exile: [[Ezek. 1:26–28]].
  - The earlier answer that went out “at the beginning” of a prayer: [[Dan. 9:20–23]].
  - Where the vision ends, with Michael and the man clothed in linen: [[Dan. 12:1–7]].
  - The opposition to the returned exiles in the days of Cyrus: [[Ezra 4:1–5]].
  - The same Hebrew word for hard service, spoken to Jerusalem as comfort: [[Isa. 40:2]].
  - Moses without his strength after seeing God: [[Moses 1:9–11]].

