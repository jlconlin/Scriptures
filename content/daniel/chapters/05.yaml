chapter: 5
title: The Writing on the Wall
tagline: Belshazzar drinks from the vessels of the Lord’s temple and praises gods of gold and stone. A hand writes four words on the palace wall, Daniel reads them as a sentence already passed, and the king is dead before morning.
when: 'The chapter gives no year. It is the night Babylon fell to Cyrus, 539 B.C., about two decades after Nebuchadnezzar died.'

setting: |
  The whole chapter is one night. Nebuchadnezzar, the king of chapters 1–4, has been dead “approximately two decades,” and the man at the head of the table is Belshazzar. Records outside the Bible know him as the son of Nabonidus, the last king of Babylon, governing the city for his father (see the notes on verses 1 and 2). Before morning the kingdom belongs to Cyrus of Persia, who “conquered Babylon in 539 BC.”

  Daniel has been out of sight. The king has only heard of him (verse 14) and has to be told by the queen who he is. Yet Daniel has not been idle in this reign. Two of his visions carry its dates, “the first year of Belshazzar king of Babylon” ([[Dan. 7:1]]) and “the third year of the reign of king Belshazzar” ([[Dan. 8:1]]), so the Daniel who walks into the banquet hall has already seen what chapters 7 and 8 record.

  The night had been spoken of long before. Isaiah named the Medes and named Cyrus ([[Isa. 13:17]]; [[Isa. 45:1]]), and Jeremiah said that Babylon’s princes and wise men would be made drunk and not wake ([[Jer. 51:57]]). The Book of Mormon has a writing on a wall of its own (see the note on verse 5).

thread: |
  Chapter 4 ended with a proud king who learned something. Chapter 5 is about a king who already knew it. Daniel says so before he reads a word of the writing: he retells what happened to Nebuchadnezzar and then says, “thou his son, O Belshazzar, hast not humbled thine heart, though thou knewest all this.” The sentence on the wall is passed on a man who had been taught.

  The king lifts cups made for the house of God and praises gods “which see not, nor hear, nor know.” Then fingers of a hand write on his wall. Daniel joins the two: the God “in whose hand thy breath is… hast thou not glorified,” and so “was the part of the hand sent from him.” The idols cannot see or know. The God whom Belshazzar ignored numbers, weighs, and divides.

  Daniel asks nothing for it. He refuses the scarlet and the chain before he reads, and he receives them from a king who has hours to live.

sections:
  - range: 1-4
    heading: The feast and the vessels
    plain: |
      King Belshazzar gave a great feast for a thousand of his nobles and drank wine in front of them. With the wine in him, he ordered the gold and silver vessels that Nebuchadnezzar had taken from the temple in Jerusalem to be brought, so that he, his nobles, his wives, and his concubines could drink from them. They were brought, and they drank from them, praising the gods of gold, silver, brass, iron, wood, and stone.
  - range: 5-9
    heading: The hand
    plain: |
      In that same hour the fingers of a man’s hand appeared and wrote on the plaster of the palace wall, opposite the lampstand, and the king saw the part of the hand that wrote. His face changed, his thoughts frightened him, his hips gave way, and his knees knocked together. He shouted for the astrologers, the Chaldeans, and the soothsayers, and promised that whoever read the writing and explained it would be clothed in scarlet, wear a gold chain, and rule as third in the kingdom. All the king’s wise men came. None could read it or say what it meant. The king was more frightened still, and his nobles were bewildered.
  - range: 10-16
    heading: The queen remembers Daniel
    plain: |
      The queen heard the noise and came into the banquet hall. “O king, live for ever. Do not be afraid. There is a man in your kingdom who has the spirit of the holy gods. In your father’s days he was found to have light, understanding, and wisdom like the wisdom of the gods, and king Nebuchadnezzar your father made him chief of the wise men. He interprets dreams, explains riddles, and unties hard problems. His name is Daniel, whom the king called Belteshazzar. Send for him.” Daniel was brought in. The king said, “Are you Daniel, one of the captives my father brought from Judah? I have heard that the spirit of the gods is in you. My wise men could not explain this writing. If you can read it and tell me what it means, you will have the robe, the gold chain, and the third place in the kingdom.”
  - range: 17-24
    heading: “Though thou knewest all this”
    plain: |
      Daniel answered, “Keep your gifts, or give them to someone else. I will still read the writing and tell you what it means. O king, the most high God gave your father Nebuchadnezzar a kingdom and majesty. All peoples feared him; he killed or spared, raised or lowered, whom he pleased. But when his heart grew proud he was put off his throne. He was driven from among men and lived like a beast, until he knew that the most high God rules in the kingdom of men and sets over it whom He will. You, his son, knew all this and have not humbled your heart. You have lifted yourself against the Lord of heaven. You had the vessels of His house brought, and you and your court drank wine from them, and you praised gods that neither see nor hear nor know. The God who holds your breath in His hand, and all your ways, you have not honoured. That is why the hand was sent from Him and this writing was written.”
  - range: 25-28
    heading: Numbered, weighed, divided
    plain: |
      “This is what is written: MENE, MENE, TEKEL, UPHARSIN. This is what it means. MENE: God has numbered your kingdom and brought it to an end. TEKEL: you have been weighed in the balances and found wanting. PERES: your kingdom is divided and given to the Medes and Persians.”
  - range: 29-31
    heading: That night
    plain: |
      Belshazzar gave the order, and Daniel was dressed in the robe, the gold chain was put on his neck, and he was proclaimed third ruler in the kingdom. That night Belshazzar, king of the Chaldeans, was killed. Darius the Median took the kingdom, at about sixty-two years of age.

notes:
  - ref: 1
    phrase: Belshazzar the king
    kind: history
    title: Who Belshazzar was
    body: |
      Belshazzar was the son of Nabonidus, the last king of Babylon, and governed the city in his father’s place; that is what records outside the Bible say about the man this chapter calls king. The Church’s reference works put it two ways: he “was never king, but was prince-regent during his father’s reign,” and he was “co-regent to his father.”

      The two statements are closer than they sound. A Babylonian account of Nabonidus says that when the third year was about to begin he put the army under his eldest son, “entrusted the kingship to him,” and left on a long journey to Tema in northern Arabia. He stayed there for years, at least from the seventh through the eleventh of his reign, with the crown prince, the officials, and the army left in Babylonia. Daniel counts years by Belshazzar ([[Dan. 7:1]]; [[Dan. 8:1]]), and the Aramaic word for “king,” *malka*, “need not have the connotation of monarch or sole king.” So the chapter’s “king” is best taken as the title of the man who held the kingship in Babylon in his father’s absence. That is a judgment about how the word is used; by the Babylonian accounts he was “his father’s viceroy, but not king.”

      Belshazzar is not Belteshazzar. The second is the “Babylonian name of Daniel.” It was given him when he was brought to court ([[Dan. 1:7]]), and both names stand in this chapter: the queen speaks to Belshazzar about “Daniel, whom the king named Belteshazzar” (verse 12).
    sources: [bd-belshazzar, scripture-helps-dan, tvedtnes-nabonidus, ot-manual-28, bdb, lds-scriptures]
  - ref: 2
    phrase: his father Nebuchadnezzar
    kind: history
    title: Why Nebuchadnezzar is called his father
    body: |
      Why Nebuchadnezzar is called Belshazzar’s father is not settled, and the chapter says it in every voice it has: the narrator’s (verse 2), the queen’s (verse 11), the king’s own (verse 13), and Daniel’s (verse 18, with “thou his son” in verse 22). The Aramaic word is the ordinary one, and its use in these verses is classed as literal: “father.”

      The difficulty is the one the note on verse 1 raises. Belshazzar’s father was Nabonidus. A king list from Uruk puts three kings between Nebuchadnezzar and Nabonidus, and Nabonidus appears to have taken the throne from the last of them, Labashi-Marduk. The Church’s newest helps state the difference and leave it there.

      One Latter-day Saint proposal goes further, and it should be read as a proposal. It holds that the Aramaic chapters of Daniel were translated from a Hebrew original now lost, and that a scribe or translator “could have easily assumed that NBND in the original Hebrew was an abbreviation for the name of the better-known king Nebuchadnezzar.” On that view a reference in this chapter, and the stories of chapters 3 and 4, were first told of Nabonidus. No other Church source read for this chapter adopts it.

      Daniel’s rebuke in verses 18–22 does not depend on the genealogy. What it requires is that Belshazzar sat on Nebuchadnezzar’s throne and knew what had happened to him. For Jeremiah’s promise that nations would serve Nebuchadnezzar “and his son, and his son’s son,” see the note on [[Jer. 27:7]].
    sources: [bdb, oshb-wlc, tvedtnes-nabonidus, scripture-helps-dan, lds-scriptures]
  - ref: 3
    phrase: the golden vessels that were taken out of the temple of the house of God
    kind: history
    title: Why the cups are the offense
    body: |
      Drinking from the temple vessels was a claim that Babylon’s gods had beaten the God of Israel. The book began with these vessels: Nebuchadnezzar carried them off and “brought the vessels into the treasure house of his god” ([[Dan. 1:2]]). Putting a conquered people’s sacred things in the victor’s temple “was a sign of the defeat of the God to whom these vessels were consecrated.” Belshazzar goes a step past his predecessor. Nebuchadnezzar stored them; Belshazzar has them brought to a banquet, and to drink wine from them while praising the gods of gold and silver “was accordingly a celebrating of these gods as victorious over the God of Israel.”

      The law treated these objects as dangerous to the unauthorized. Even the Levites who served at the tabernacle were told, “they shall not come nigh the vessels of the sanctuary and the altar, that neither they, nor ye also, die” ([[Num. 18:3]]), the verse the Church’s footnote on “vessels” gives here. Daniel names the vessels in his charge (verse 23), between the king’s pride and his idols.

      Their story does not end at this table. Cyrus “brought forth the vessels of the house of the Lord, which Nebuchadnezzar had brought forth out of Jerusalem” ([[Ezra 1:7]]), and they went up “with them of the captivity that were brought up from Babylon unto Jerusalem” ([[Ezra 1:11]]). The note on [[Isa. 52:11]] follows them there.
    sources: [keil-daniel, lds-scriptures]
  - ref: 5
    phrase: wrote over against the candlestick upon the plaster of the wall
    kind: scripture
    title: A second writing on a wall, among the Nephites
    body: |
      The Book of Mormon records a writing on a wall as well, and the Church’s footnote at verse 16 points to it. Amulek introduces himself as a descendant of Aminadi, “that same Aminadi who interpreted the writing which was upon the wall of the temple, which was written by the finger of God” ([[Alma 10:2]]). The account is that brief.

      Daniel 5 has been called “the strongest parallel” to it, and the likeness is in the pattern: God writes, those present cannot read it, and a prophet interprets “a divine manifestation they could not interpret for themselves.” Because the writing in Babylon answered the profaning of temple vessels, it has been proposed that the Nephite writing also warned of what would follow for profaning the temple. That is a conjecture built on Daniel; the Book of Mormon does not say what Aminadi read.

      “Over against the candlestick” means opposite the lampstand.
    sources: [sc-knowhy-736, lds-scriptures]
  - ref: 6
    phrase: the joints of his loins were loosed
    kind: words
    title: Knots that come loose, and a man who loosens knots
    body: |
      The words for the king’s collapse are the same two Aramaic words later used for Daniel’s gift. “Joints” is *qitre*, “joint, knot,” and “were loosed” is a form of *shera*, “loosen”; the Church’s footnote gives “his hip joints.” The king’s body gives way where it is tied together.

      Six verses later the queen says that Daniel is known for “dissolving of doubts” (verse 12), and the king repeats it (verse 16). Those are the same noun and the same verb: loosening knots. The figure is usually taken as “knotty things, difficulties,” though magic spells may be what is meant. That the two words recur is in the text; whether the writer meant a play on them, no source consulted for this chapter says.
    sources: [bdb, oshb-wlc, lds-scriptures]
  - ref: 7
    phrase: the third ruler in the kingdom
    kind: history
    title: Why the reward is third place
    body: |
      Third was probably the highest place Belshazzar had to give. With Nabonidus first, and himself “second in the kingdom, after his father Nabonidus, the highest place he could offer was third.” The detail is unexplained inside the chapter, which names no king above Belshazzar, and it fits what the Babylonian records say of him (see the note on verse 1).

      The Aramaic word is not the ordinary “third.” It is a noun, “third (ruler),” that is, a triumvir, one of three who govern.
    sources: [tvedtnes-nabonidus, bdb, oshb-wlc]
  - ref: 10
    phrase: the queen
    kind: history
    title: The queen who remembers
    body: |
      The queen is most likely the queen mother, not Belshazzar’s wife; the text does not name her. The king’s wives are already at the table (verses 2–3), and she is not. She comes in on her own, and “the queen came before the king as only a mother could do.” She also remembers another reign. Her description of Daniel, a man “in whom is the spirit of the holy gods,” is Nebuchadnezzar’s own phrase for him ([[Dan. 4:8–9]]), which has led to the conclusion that she was Nebuchadnezzar’s widow. That last step is an inference from her words, and it takes the chapter’s “thy father” as it stands (see the note on verse 2).

      Belshazzar himself knows Daniel only by report: “I have even heard of thee” (verse 14). Daniel was still in royal service in this reign, since after the vision of Belshazzar’s third year he “rose up, and did the king’s business” ([[Dan. 8:27]]). But that verse shows “only that he was in the king’s service,” not that he still stood over the wise men as he had under Nebuchadnezzar. What place he held, and why the king did not know him, the book does not say.
    sources: [keil-daniel, lds-scriptures]
  - ref: 17
    phrase: Let thy gifts be to thyself
    kind: scripture
    title: Refused first, given anyway
    body: |
      Daniel turns down the reward before he reads, as Elisha had turned down Naaman’s; the Church’s footnote on “gifts” gives that precedent. When Naaman pressed a gift on Elisha after his healing, the prophet answered, “As the Lord liveth, before whom I stand, I will receive none” ([[2 Kgs. 5:16]]).

      Verse 29 has him wearing them anyway. Its verbs are all the king’s and his servants’: Belshazzar “commanded,” and “they clothed Daniel.” The king is keeping the promise he made in verse 16. Nothing is said of Daniel asking or agreeing, and the man who gave the order was dead that night (verse 30).
    sources: [lds-scriptures, keil-daniel]
  - ref: 22
    phrase: though thou knewest all this
    kind: scripture
    title: The charge is that he knew
    body: |
      Before Daniel reads the wall he preaches chapter 4, and the charge against Belshazzar is that he already knew it. Verses 18–21 retell Nebuchadnezzar’s pride, his years among the beasts, and the lesson he was sent there to learn, in nearly the words of that chapter: “till thou know that the most High ruleth in the kingdom of men, and giveth it to whomsoever he will” ([[Dan. 4:25]]). Jeremiah had heard the Lord say the same of the earth and its kingdoms: “I… have given it unto whom it seemed meet unto me” ([[Jer. 27:5]]), a verse the Church’s footnote at verse 20 gives.

      Verse 23 then lays out the indictment in three parts: “hast lifted up thyself against the Lord of heaven”; the vessels of His house; and the praise of gods “which see not, nor hear, nor know,” while “the God in whose hand thy breath is… hast thou not glorified.” Nebuchadnezzar was given “seven times” to learn ([[Dan. 4:32]]). Belshazzar is given a night.
    sources: [lds-scriptures]
  - ref: 25
    phrase: MENE, MENE, TEKEL, UPHARSIN
    kind: words
    title: Three weights, and three verdicts
    body: |
      The words on the wall are the names of weights, and Daniel reads each one as a verb. As written they are nouns. *Mene* is “maneh, mina, a weight”; *tekel* is the Aramaic for shekel; *peres* is a “half-mina,” and *upharsin* is that word in the plural with *u*, “and,” in front of it. A mina was about twenty ounces and a shekel less than half an ounce. So the inscription reads as a list of weights: a mina, a mina, a shekel, and half-minas. The series has been read as weights “listed in descending order,” which “may have symbolized the diminishing power of Babylon”; by the sizes just given, though, the shekel is the smallest and the half-minas come after it.

      Why the wise men could not even read it, the chapter does not say. It says only that they “could not read the writing.” One older reading rejects the explanation that the script was merely an unfamiliar alphabet and holds that the characters could be read only by divine help; the text gives no reason.

      Daniel’s interpretation takes the consonants of each noun and sounds them as a verb, so that “in all the three words there lies a double sense.” *Mene* becomes *menah*, “numbered”: God has counted out the days of the kingdom and they are complete. The link between the two words “is due to word-play.” *Tekel* becomes “thou art weighed.” Job once asked for what Belshazzar now receives: “Let me be weighed in an even balance” ([[Job 31:6]]). *Peres* becomes “is divided,” and it is heard a third way, because the verse ends on “Persians,” in Aramaic *paras*, the same consonants again. “Divided” does not mean shared out in two halves between Medes and Persians. The verb means “to divide into pieces, to destroy, to dissolve the kingdom.”

      Verse 25 has *upharsin* and verse 28 has *peres*: the plural with “and” when the writing is read out, the singular when it is explained. The Joseph Smith Translation reads “Upharsin” in verse 28 as well, the word as it was written. The Greek translation goes the other way and gives three single words in verse 25: “Mane, Thekel, Phares.”
    sources: [bdb, oshb-wlc, scripture-helps-dan, keil-daniel, lxx-rahlfs, lds-scriptures]
  - ref: 30
    phrase: In that night
    kind: history
    title: How Babylon fell in a night
    body: |
      Daniel reports only the king’s death; how the city fell that night is told outside the book, and not in one way. The conqueror was Cyrus, who “captured Babylon and overthrew the Chaldean dynasty.”

      Herodotus tells it this way. The Babylonians had stored food for years and “made no account of the siege.” Cyrus posted his army where the Euphrates enters and leaves the city and then drew the river off into a lake that was then a swamp, until the Persians “entered by the bed of the river Euphrates into Babylon, the stream having sunk so far that it reached about to the middle of a man’s thigh.” The city was so large, he says, that those in the middle did not know the edges were taken, “but as they chanced to be holding a festival, they went on dancing and rejoicing during this time until they learnt the truth only too well.” Herodotus does not name Belshazzar in that passage, and Daniel says nothing of the river. Both have the city feasting when it was taken. A different account has the priests of Marduk opening the gates by night while the crown prince and his friends were drunk, so that the city “fell without bloodshed.”

      The prophets had spoken of the feasting. The Church’s footnotes at this verse lead to Jeremiah, “In their heat I will make their feasts, and I will make them drunken, that they may rejoice, and sleep a perpetual sleep” ([[Jer. 51:39]]), and to Isaiah’s naming of Cyrus ([[Isa. 45:1]]). See the notes on [[Jer. 51:31]] and [[Isa. 21:5]].
    sources: [lds-scriptures, bd-cyrus, herodotus-histories-1-191, tvedtnes-nabonidus]
  - ref: 31
    phrase: Darius the Median
    kind: history
    title: Darius the Median
    body: |
      Darius the Median cannot be matched to a king known from outside the Bible: “It is impossible to identify him with any of the kings of Babylon known to secular history.” He is not the Darius of Ezra, Haggai, and Zechariah, who was a Persian king, the son of Hystaspes. The book gives his age here, his father and people elsewhere (“Darius the son of Ahasuerus, of the seed of the Medes, which was made king over the realm of the Chaldeans,” [[Dan. 9:1]]), and his dealings with Daniel in chapter 6.

      That a Mede receives Babylon is what Daniel has just read from the wall, “given to the Medes and Persians” (verse 28), and what the prophets had said: “the Lord hath raised up the spirit of the kings of the Medes” ([[Jer. 51:11]]). The notes on that verse and on [[Isa. 13:17]] say more about the Medes.
    sources: [bd-darius, lds-scriptures]

christ: |
  At the word “hand” in verse 5 the Church’s footnote gives two passages about the hand of the Lord. One is Abraham’s: “he put his hand upon mine eyes” ([[Abr. 3:12]]). The other is the brother of Jared’s, and its wording is close to Daniel’s “fingers of a man’s hand”: “he saw the finger of the Lord; and it was as the finger of a man, like unto flesh and blood” ([[Ether 3:6]]). There the one whose finger it is goes on to name Himself: “Behold, I am Jesus Christ” ([[Ether 3:14]]).

  The footnote sets the passages beside one another. It does not say whose hand Belshazzar saw, and Daniel says of it only that it “was… sent from him,” from the God “in whose hand thy breath is.”

explore: |
  - **The king who learned and the king who knew.** Read [[Dan. 4:28–37]] beside [[Dan. 5:18–23]].
  - **The vessels, from Jerusalem to Babylon and back.** [[Dan. 1:1–2]]; [[Ezra 1:7–11]]; [[Isa. 52:11]].
  - **The night foretold.** [[Isa. 21:1–10]]; [[Isa. 45:1–3]]; [[Jer. 51:11]]; [[Jer. 51:39]]; [[Jer. 51:57]].
  - **Aminadi and the writing on the temple wall.** [[Alma 10:2–3]]; Scripture Central’s KnoWhy “Who Was Aminadi?” gathers what can be said about him.
  - **What comes next.** [[Dan. 6:1–3]]: Daniel is one of three presidents under Darius.

parallels:
  - ref: Alma 10:2
    note: Aminadi “interpreted the writing which was upon the wall of the temple, which was written by the finger of God.”
  - ref: Ether 3:6
    note: The brother of Jared sees the finger of the Lord, “as the finger of a man.” The Church’s footnote at Daniel 5:5 gives this verse.
  - ref: Jer. 51:39
    note: Jeremiah foretells that Babylon will be made drunk at its feasts and not wake.

