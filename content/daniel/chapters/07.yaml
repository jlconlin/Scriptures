chapter: 7
title: 'Four Beasts, the Ancient of Days, and One like the Son of Man'
tagline: 'Daniel dreams of four beasts rising from a storm at sea, of a court that sits in judgment on them, and of a kingdom given to one like the Son of man and to the saints.'
when: 'The first year of Belshazzar (7:1). The book steps back in time here: Belshazzar’s death was told in chapter 5 and chapter 6 is set under Darius.'

setting: |
  Chapter 5 ended with Belshazzar slain ([[Dan. 5:30]]) and chapter 6 was a story under Darius, but this vision came to Daniel earlier, “in the first year of Belshazzar” (who he was is in the note on [[Dan. 5:1]]). The book has told its stories, and now it gathers Daniel’s visions and dates each one.

  Chapter 7 is the hinge between the two. It is the last chapter written in Aramaic, which ties it to chapters 2–6, and the first of the visions, which ties it to chapters 8–12; it “falls at the transition point between these two parts.” Something else changes as well. Until now kings dreamed and Daniel interpreted. Here the dream is Daniel’s own, and he has to ask someone standing in the vision what it means.

  What he sees is the succession of kingdoms from Nebuchadnezzar’s dream ([[Dan. 2:31–45]]) shown a second time, “under the symbolism of beasts.” Later scripture draws on this chapter heavily. The title the Savior used for Himself more than any other seems to have its roots here, John saw its beasts again ([[Rev. 13:1–7]]), and a revelation to Joseph Smith names the place where the Ancient of days will sit ([[D&C 116:1]]).

thread: |
  The chapter sets four beasts against a man. Nebuchadnezzar saw the kingdoms of the world as a statue of precious metals; Daniel sees the same succession as animals of prey coming up out of a storm. The difference can be put down to who was looking: the king “saw this power in its imposing greatness and glory,” while the prophet “saw it in its opposition to God in the form of ravenous beasts of prey.” Each of the first three is “like” an animal, a lion, a bear, a leopard, and the fourth is so violent that no animal is named for it. Then the scene becomes a court. Thrones are placed, an aged figure takes his seat, books are opened, and the fourth beast is destroyed. Only then does someone arrive who is “like the Son of man,” and the kingdom goes to him.

  One word carries the argument: dominion. It is “given” to the leopard (verse 6), “taken away” from the beasts (verse 12), “given” to the one like the Son of man (verse 14), taken from the horn (verse 26), and “given to the people of the saints of the most High” (verse 27). At the last it is handed to a man and to a people, and that kingdom “shall not be destroyed.”

  The second half of the chapter adds what the first half only hinted. Before the saints receive the kingdom the horn makes war on them and prevails, and they are “given into his hand” for a measured time. Daniel has just seen the kingdom given to the saints for ever, and he still ends the chapter troubled, his face changed.

sections:
  - range: 1-8
    heading: 'Four beasts from the sea'
    plain: |
      In Belshazzar’s first year Daniel has a dream in his bed, writes it down, and tells the main points. In the night he sees the four winds of heaven breaking on the great sea, and four great beasts come up out of it, each different. The first is like a lion with an eagle’s wings. As he watches, its wings are plucked off, it is lifted up and set on two feet like a man, and it is given a man’s heart. The second is like a bear, raised up on one side, with three ribs between its teeth, and it is told to get up and eat much flesh. The third is like a leopard with four bird’s wings on its back and four heads, and it is given dominion. The fourth is dreadful and very strong. It has great iron teeth; it devours and breaks in pieces and tramples what is left. It is unlike the others, and it has ten horns. While Daniel studies the horns another, a little one, comes up among them, and three of the first horns are pulled up by the roots before it. This horn has eyes like a man’s and a mouth that speaks great things.
  - range: 9-14
    heading: 'The court sits, and the kingdom is given'
    plain: |
      Daniel watches until thrones are set in place and the Ancient of days sits down. His clothing is white as snow and his hair like pure wool; his throne is flame and its wheels burning fire. A stream of fire flows out from before him. Thousands upon thousands serve him and ten thousand times ten thousand stand before him. The court sits and the books are opened. Daniel keeps watching because of the great words the horn is speaking, until the beast is killed and its body given to the fire. The other beasts lose their dominion, though their lives are prolonged for a season and a time. Then, in the night visions, one like the Son of man comes with the clouds of heaven. He comes to the Ancient of days and is brought near before him. He is given dominion, glory, and a kingdom, so that all peoples, nations, and languages should serve him. His dominion is everlasting and will not pass away, and his kingdom will not be destroyed.
  - range: 15-18
    heading: 'Daniel asks what it means'
    plain: |
      Daniel is grieved in spirit, and the visions trouble him. He goes up to one of those standing by and asks the truth of all this, and is given the interpretation. The four great beasts are four kings who will arise out of the earth. But the saints of the most High will take the kingdom and possess it for ever and ever.
  - range: 19-28
    heading: 'The fourth beast and the little horn'
    plain: |
      Daniel wants to know about the fourth beast, so different from the others and so dreadful, with iron teeth and brass claws. He asks also about the ten horns on its head and about the other horn, before which three fell. That horn had eyes and a mouth speaking very great things, and it looked stouter than the rest. As he watched, that horn made war with the saints and prevailed against them, until the Ancient of days came, judgment was given to the saints of the most High, and the time came for the saints to possess the kingdom. The answer: the fourth beast is a fourth kingdom on earth, unlike all kingdoms, which will devour the whole earth, tread it down, and break it in pieces. The ten horns are ten kings who will arise out of it. Another will arise after them, different from the first ones, and will subdue three kings. He will speak great words against the most High, wear out the saints, and think to change times and laws, and they will be given into his hand until a time and times and the dividing of time. But the court will sit, and his dominion will be taken away, consumed and destroyed to the end. The kingdom and dominion, and the greatness of the kingdom under the whole heaven, will be given to the people of the saints of the most High. His kingdom is everlasting, and all dominions will serve and obey him. There the account ends. Daniel’s thoughts trouble him greatly and his face changes, but he keeps the matter in his heart.

notes:
  - ref: 2
    phrase: 'the four winds of the heaven strove upon the great sea'
    kind: symbol
    title: 'The sea the beasts come from'
    body: |
      The sea is best read as the world of nations in turmoil. The angel does not explain it, but where the vision has the beasts come up “from the sea,” his interpretation has kings who “shall arise out of the earth” (verse 17).

      On this reading the great sea is the ocean and not a particular body of water, and the storm on it stands for “commotions among the nations of the world.” The four winds “stand in relation to the four quarters of the heavens,” so the upheaval is everywhere at once. The reading fits what follows, since each beast appears in turn out of the same churning water.
    sources: [keil-daniel]

  - ref: 3
    phrase: 'four great beasts'
    kind: prophets
    title: 'Why kingdoms are shown as beasts'
    body: |
      Joseph Smith taught that a beast in a prophet’s vision stands for a kingdom that has become corrupt, and never for the kingdom of God. Preaching on 8 April 1843, he said of God that “he never made use of the figure of a beast nor any of the brute kind to represent His kingdom.”

      He took his proof from this chapter. The angel interpreted the vision to Daniel, and in that interpretation the beasts stand for “the kingdoms of the world, the inhabitants whereof were beastly and abominable characters.” He added a caution about the word itself: “Daniel did not see an actual bear or a lion, but the images or figures of those beasts.” They are pictures, chosen for what they say about the thing pictured.

      The rule gives a reader a way through the chapter. Every kingdom of men here is an animal, and a predator. When the kingdom of God appears it is shown as a human figure and then as a people. The heavenly kingdom is never a beast “because it lacks the bloodthirstiness and fleeting nature of the earthly kingdoms.”
    sources: [jsp-history-d1-1522, ludlow-son-of-man]

  - ref: 4
    phrase: 'a man’s heart was given to it'
    kind: symbol
    title: 'The lion that is made to stand like a man'
    body: |
      The first beast is the only one that changes for the better, and the change recalls Nebuchadnezzar’s. The Church’s footnote joins this beast to the head of gold in the earlier dream, which Daniel told Nebuchadnezzar was the king himself ([[Dan. 2:38]]). The details can be read from there. The lion and the eagle “are both supreme among beasts of their class,” as gold is among metals. The plucked wings are the loss of the “power to fly or the power to dominate and conquer.” And the man’s heart is “evidently a reference to the humanizing effect of Nebuchadnezzar’s madness.”

      Chapter 4 supplies the words behind this reading. The sentence passed on the king was, “Let his heart be changed from man’s, and let a beast’s heart be given unto him” ([[Dan. 4:16]]), and he lived as an animal until “his hairs were grown like eagles’ feathers” ([[Dan. 4:33]]). Here the sentence runs the other way. A beast with eagle’s wings is stood on its feet and given the heart of a man.

      The details of the next two beasts are read in the same manner, and these too are readings, since the angel explains none of them. Wings in visions of this kind “are common depictions for the ability to move and spread.” The ribs in the bear’s mouth and the command to devour “signify the ferocity” of its rule. The leopard’s four heads “signify governing power,” and the Church’s footnote on them points ahead to the horn that breaks and is replaced by four ([[Dan. 8:8]]). Daniel himself asks about none of this. His question, when he gets to ask one, is about the fourth beast (verse 19).
    sources: [ot-manual-28, ludlow-son-of-man, lds-scriptures]

  - ref: 8
    phrase: 'another little horn'
    kind: symbol
    title: 'The little horn is described, not named'
    body: |
      The text says a good deal about what the little horn does and nothing about who it is. It rises among the ten horns of the fourth beast and after them (verse 24), and three fall before it. It has “eyes like the eyes of man” and a mouth “speaking great things,” and it looks “more stout than his fellows.” It speaks against the most High, makes war on the saints and prevails, and wears them out (verses 20–25). The Aramaic verb there means to wear away, as a garment wears, and is used as a figure for harassing continually. Its end is as definite as its career: “the judgment shall sit, and they shall take away his dominion.”

      The Church’s helps name no one. The last of the world-kingdoms “will severely persecute the saints but will be brought to an end by the judgment of God.” The horn “cannot be positively identified with any specific individual or kingdom of the world.” It is read as “a notable anti-Christ power,” one to arise after the time of the Roman Empire and to hinder the Saints until the Second Coming, and it is likened to the beast John saw, to which “there was given … a mouth speaking great things and blasphemies,” and of which he wrote, “it was given unto him to make war with the saints” ([[Rev. 13:5–7]]).

      The fourth beast itself is read there as the Roman Empire “and the forces of evil that were manifest through that empire” (the lists of kingdoms are at verse 17). Beside that reading stands a suggestion, offered expressly as one, that the fourth beast with its speaking mouth “is none other than the ‘great and abominable church’ of our modern scriptures,” with the caution that even if so, “we do not at present fully comprehend the ramifications of it.” A related thought takes in all four kingdoms: perhaps the vision’s main point is to warn that “their unrighteous ideals and philosophies, similar to the concept of the great and abominable church found in other parts of scripture, will have their reign until the return of Christ.” Both are offered as possibilities. What the chapter fixes is the order of events. The horn prevails “until the Ancient of days came” (verse 22), and no longer.
    sources: [lds-scriptures, bdb, bd-daniel-book, ot-manual-28, ludlow-son-of-man]

  - ref: 9
    phrase: 'the thrones were cast down'
    kind: words
    title: 'The thrones are set in place, not thrown down'
    body: |
      The thrones are being placed for a court; they are not being overthrown. The King James wording suggests that the beasts’ thrones are toppled, but the Church’s footnote gives “Aramaic: set up,” the ancient Greek translation has “the thrones were set,” and a modern one has “thrones were set in place.” The rest of the scene is a court’s as well: the one who presides sits down, “the judgment was set” (that is, “the court sat in judgment”), and the books are opened.

      “Thrones” is plural, and only one occupant is named. The plural “likely foreshadows one for the Ancient of Days and one for the Son of Man.” The interpretation adds that “judgment was given to the saints” (verse 22), and the Savior promised the Twelve that they would “sit upon twelve thrones, judging the twelve tribes of Israel” ([[Matt. 19:28]]). Daniel does not say who fills the rest.

      The throne of the Ancient of days has wheels of burning fire, like the wheeled throne Ezekiel saw ([[Ezek. 1:15–21]]), to which the Church’s footnote points. Wheels suggest a throne that travels: the image “gives the sense that the figure moves about,” and verse 22 says in so many words that the Ancient of days “came.”
    sources: [lds-scriptures, lxx-rahlfs, nrsvue, ludlow-son-of-man]

  - ref: 9
    phrase: 'the Ancient of days did sit'
    kind: prophets
    title: 'The Ancient of days is Adam'
    body: |
      Latter-day revelation identifies the Ancient of days as Adam, where nearly every other Christian reading takes him to be God. Commentators outside the Church “are almost in universal agreement that the Ancient of Days is God,” because he presides in judgment and is described in white and fire. In verse 9 the Aramaic has no article, “an Ancient of Days,” so the phrase begins as a description, one old in days, before it is used as a title. Nothing in the chapter itself “requires an identification of this figure with God.”

      The revelations name him. The Lord names “Michael, or Adam, the father of all, the prince of all, the ancient of days” ([[D&C 27:11]]); the name Adam-ondi-Ahman was given because there “the Ancient of Days shall sit, as spoken of by Daniel the prophet” ([[D&C 116:1]]); and President Joseph F. Smith saw among the righteous dead “Father Adam, the Ancient of Days and father of all” ([[D&C 138:38]]). Joseph Smith explained the title in 1839: “he means the oldest man, our Father Adam, Michael.” Orson Pratt, in a sermon reported in 1843, reasoned from the text toward the same answer. The figure cannot be the Son, “for he afterwards comes to the Ancient of Days,” so it must be “the most ancient personage that ever lived in days.”

      The identification changes how verses 13 and 14 read. The one like the Son of man is brought to this figure, and then dominion is “given him.” Joseph Smith read the two together: “The Son of Man Stands before him & there is given him glory & dominion.” Then, “Adam delivers up his stewardship to Christ,” yet “retains his standing as head of the human family.” On this reading the gift in verse 14 is a steward delivering up what he was given to hold. It does not set Adam over the Savior. Adam holds “the keys of salvation under the counsel and direction of the Holy One” ([[D&C 78:16]]).
    sources: [lds-scriptures, nrsvue, ludlow-son-of-man, jsp-discourse-1839-a-richards]

  - ref: 10
    phrase: 'the judgment was set, and the books were opened'
    kind: prophets
    title: 'A judgment that is not the final judgment'
    body: |
      Latter-day prophets place this court on earth, at Adam-ondi-Ahman, before the Savior comes in glory, and they distinguish it from the last judgment. The place is Spring Hill in Daviess County, Missouri. Joseph Smith went there in May 1838, and his clerk recorded in his journal the name the Lord gave it and the reason ([[D&C 116:1]]). It already had a history in the revelations: three years before his death Adam gathered his righteous posterity in that valley and blessed them ([[D&C 107:53–56]]). By 1835 a blessing on Joseph Smith’s father looked forward to a second gathering, promising that he would “sit in the general assembly of patriarchs, even in council with the Ancient of Days when he shall sit.”

      Joseph Smith described what the council is for. Adam will call his children together to prepare them for the coming of the Son of Man, and “all that have had the Keys must Stand before him in this grand Council.” President Joseph Fielding Smith distinguished it from the last judgment: “The judgment—not the final judgment—will be held, where the righteous who have held keys will make their reports and deliver up their keys and ministry,” after which Christ is acknowledged as the rightful ruler of the earth.

      Two details of the verse remain. The multitude who stand before the Ancient of days has been read as the heavenly host, but the interpretation, on one reading, identifies them “with the ‘saints of the most High’” who receive the kingdom. And the books are not explained; the Church’s footnote points to the “book of remembrance” written for those who feared the Lord ([[Mal. 3:16]]).

      The chapter’s own interpretation says less than this. It gives the court, the sentence on the beast, and the gift of the kingdom (verses 26–27). Where the court sits, who is called to it, and what is reported there come from the Restoration.
    sources: [lds-scriptures, baugh-adam-ondi-ahman, ludlow-son-of-man, jsp-discourse-1839-a-richards, ot-manual-28]

  - ref: 13
    phrase: 'one like the Son of man'
    kind: christ
    title: 'One like a son of man, after four like beasts'
    body: |
      The one who receives the kingdom is described as human, and Jesus took that description as His own name. The Aramaic is *bar enash*, “a son of man, human being.” This is the phrase’s only appearance in Aramaic in the Old Testament, and it has no article, so that a modern translation gives “one like a human being.” Its Hebrew equivalent is common and usually means simply a person. It is what Ezekiel is called (see the note on [[Ezek. 2:1]]) and what Daniel is called in the next chapter ([[Dan. 8:17]]).

      The scene is what turns a common phrase into a title, and the small word “like” does much of the work. Daniel has seen one beast “like a lion,” another “like to a bear,” another “like a leopard.” Now comes one like a man: “Rather than coming as another type of beast, he will come like or as a Son of man.” They rise from the sea and he comes with the clouds of heaven. They devour and trample, and he is brought forward and given.

      The Son of Man of this verse is Jesus Christ. In the Gospels He uses the title of Himself about eighty times, and no one else there uses it of Him. At His trial He joined it to Daniel’s words: “ye shall see the Son of man sitting on the right hand of power, and coming in the clouds of heaven” ([[Mark 14:62]]). The high priest called that blasphemy and the council condemned Him ([[Mark 14:63–64]]). By the title He often signalled to His hearers that He would fulfil Daniel’s prophecy.

      Restoration scripture gives the title a further sense. “Man of Holiness is his name, and the name of his Only Begotten is the Son of Man, even Jesus Christ, a righteous Judge” ([[Moses 6:57]]). The same words can therefore say that He is a man among men and that He is the Son of the Man of Holiness; the title “can highlight both Jesus’s immortal and mortal parentage and mission.”
    sources: [bdb, nrsvue, ludlow-son-of-man, bd-daniel-book, bd-son-of-man, scripture-helps-dan, lds-scriptures]

  - ref: 16
    phrase: 'one of them that stood by'
    kind: structure
    title: 'What the interpreter explains, and what he leaves'
    body: |
      The chapter interprets itself through a bystander, presumably an angel, and his interpretation covers only part of what Daniel saw. Half the chapter is vision (verses 2–14) and half is explanation (verses 15–27). The one who “stood by” is not named. Joseph Smith calls him simply “the angel,” and a guide of this kind is usual in such visions; in the next one he has a name, Gabriel ([[Dan. 8:16]]).

      His first answer is two sentences long (verses 17–18): the beasts are four kings, and the saints will take the kingdom. Everything after that comes because Daniel presses him about the fourth beast and its horn. So most of the explanation concerns the one beast he asked about.

      It is silent about the two figures at the center. The angel does not say who the Ancient of days is or who the one like the Son of man is. Where the vision had the kingdom given to the Son of man, the angel speaks of “the people of the saints of the most High.”

      Three things stay distinct in this chapter: what Daniel saw, what the angel said it meant, and what later revelation has added about the two figures the angel left unexplained. The last is considerable. “Were we to interpret Daniel 7 in isolation, it would be impossible to see all those details.”
    sources: [ludlow-son-of-man, jsp-history-d1-1522, lds-scriptures]

  - ref: 17
    phrase: 'are four kings'
    kind: history
    title: 'Which kingdoms the beasts are'
    body: |
      The angel says the beasts are four kings and names none of them. “Kings” means kingdoms, as the Church’s footnote says and as verse 23 shows: “The fourth beast shall be the fourth kingdom upon earth.” The footnotes also send the reader from the beasts back to the kingdoms of Nebuchadnezzar’s image (the fourth beast to the iron of [[Dan. 2:40]]), so the question is the one already asked there (see the note on [[Dan. 2:38]], which gives the list latter-day prophets have taught).

      Two lists are in use, and neither is preferred here. In one the beasts are Babylon, Medo-Persia, Greece under Alexander, and Rome. In the other they are Babylon, Media, Persia, and Greece. Read the first way, the beasts “seem to represent successive empires of Babylon, Persia, Macedonia, and Rome,” and the ten horns “appear to symbolize” the kingdoms that came after Rome; the verbs are careful ones.

      The second list stops with the Greeks. Many interpreters use it to trace “the historical periods up to the Maccabean period,” in the second century B.C., and “many biblical scholars” hold further that the book describes events not of the exile but of “a much later period around the time of the Maccabees.” The Church’s sources treat the visions as “seen by Daniel and reported in his own name.” And whichever list is right, “the Son of Man’s appearance in the clouds will not occur until the last days.” The vision does not end with any ancient empire.

      The book names two of the kingdoms itself in the next vision, “the kings of Media and Persia” and “the king of Grecia” ([[Dan. 8:20–21]]). For this chapter the one conclusion both lists allow is enough: “Regardless of the specific meaning of the beasts,” the kingdoms of the earth are temporary and God’s kingdom endures.
    sources: [lds-scriptures, scripture-helps-dan, bd-daniel-book, eom-daniel-prophecies, ludlow-son-of-man]

  - ref: 18
    phrase: 'the saints of the most High shall take the kingdom'
    kind: scripture
    title: 'Who the saints of the most High are'
    body: |
      The saints are “holy ones,” and in this chapter the word means a people on earth. Chapter 4 used the same Aramaic adjective, *qaddish*, of heavenly beings, “the holy ones” by whose word the king was sentenced ([[Dan. 4:17]]), but the lexicon takes it here of Israel “as holy ones, saints.” The chapter supports that. These holy ones can be made war on, beaten, and worn out, and verse 27 calls them “the people of the saints of the most High.”

      The kingdom is given twice, to the one like the Son of man (verse 14) and to the saints (verses 18, 22, 27). Verse 27 gives it to the people and ends in the singular: “all dominions shall serve and obey him.” The vision thus has three parties, “the Ancient of Days (Adam), the Son of Man (Jesus), and multitudes of righteous saints.” The Bible says that Jesus and the saints receive a kingdom; “modern revelation further explains from whom and how.”

      “Judgment was given to the saints” (verse 22) can be taken two ways. A modern translation has judgment given “for the holy ones,” a verdict in their favor. The Church’s footnote points to Paul, whose question gives the saints a share in the judging: “Do ye not know that the saints shall judge the world?” ([[1 Cor. 6:2]]).

      The promise echoes the one made of the stone’s kingdom, “which shall never be destroyed” ([[Dan. 2:44]]). A latter-day revelation, cited in the Church’s footnote at verse 27, repeats the promise in Daniel’s terms: the Saints are to prevail “until the kingdoms of the world are subdued under my feet, and the earth is given unto the saints, to possess it forever and ever” ([[D&C 103:7]]).
    sources: [bdb, nrsvue, ludlow-son-of-man, lds-scriptures]

  - ref: 25
    phrase: 'until a time and times and the dividing of time'
    kind: words
    title: 'A time, times, and half a time'
    body: |
      The phrase adds up to three and a half “times,” and how long that is has not been revealed. The Aramaic word is *iddan*, the same “times” that passed over Nebuchadnezzar (see the note on [[Dan. 4:16]]), where the lexicon takes it as a “definite time, = year.” “The dividing of time” is half a time. The book says it again in Hebrew as “a time, times, and an half” ([[Dan. 12:7]]), and John has “a time, and times, and half a time” ([[Rev. 12:14]]).

      Most interpreters, early and late, have taken the word “as representing the space of a year, thus three and a half times as three and a half years.” Another reading holds that a word this indefinite shows that “a chronological determination of the period is not in view,” and takes the figure as a symbol: “Three and a half times are the half of seven times,” a full measure cut short.

      Of the periods in chapter 12, which include this same phrase, the interpretation “has not been revealed by the Lord as yet,” and the calculations put forward have been “each in their turn” proven wrong.

      The verse says one thing that needs no arithmetic. The horn will “think to change times and laws.” Daniel’s hymn had said that it is God who “changeth the times and the seasons” ([[Dan. 2:21]]), and to change times “belongs to the all-perfect power of God.” So the horn reaches for what is God’s.
    sources: [bdb, keil-daniel, ot-manual-28, lds-scriptures]

christ: |
  Daniel sees the kingdoms of the world end in a person. When the beasts have had their time, “dominion, and glory, and a kingdom” are given to one in human form, and the Savior claimed that scene for Himself. Speaking of His return He said, “then shall they see the Son of man coming in a cloud with power and great glory” ([[Luke 21:27]]), and John heard the outcome announced in heaven: “The kingdoms of this world are become the kingdoms of our Lord, and of his Christ; and he shall reign for ever and ever” ([[Rev. 11:15]]). The Church’s footnotes at verse 13 point to both.

  The kingdom given to Him is given also “to the people of the saints of the most High” (verse 27), the same saints the horn had worn out.

explore: |
  - The same succession of kingdoms as an image of four metals, and the stone that replaces them: [[Dan. 2:31–45]].
  - The next vision, two years later, in which two of the kingdoms are named: [[Dan. 8:1–27]].
  - The wheeled throne of fire that Ezekiel saw by the river Chebar: [[Ezek. 1:4–28]].
  - Adam’s first council at Adam-ondi-Ahman, and the naming of the place: [[D&C 107:53–57]]; [[D&C 116:1]].
  - The Son of Man before the council in Jerusalem: [[Mark 14:61–64]].
  - John’s beast from the sea, and the thrones and books of his own judgment scene: [[Rev. 13:1–8]]; [[Rev. 20:4]], [[Rev. 20:11–12]].
  - The *Religious Educator* article “‘One Like the Son of Man Came with the Clouds of Heaven’” treats the Son of Man prophecy and what the Restoration adds to it.

parallels:
  - ref: Rev. 13:1–7
    note: 'John sees one beast rise from the sea with ten horns, “like unto a leopard,” with the feet of a bear and the mouth of a lion, speaking great things and making war with the saints: Daniel’s four beasts gathered into one.'
  - ref: Mark 14:62
    note: 'At His trial Jesus applies Daniel 7:13 to Himself: the Son of man “coming in the clouds of heaven.”'
  - ref: D&C 116:1
    note: 'The Lord names Adam-ondi-Ahman as the place where “the Ancient of Days shall sit, as spoken of by Daniel the prophet.”'

