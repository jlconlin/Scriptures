summary: >-
  Jonah runs from the Lord by sea and is swallowed by a great fish the Lord prepared;
  cast out upon the dry land, he goes at last to Nineveh, the city repents, and the Lord
  turns from the evil He had said He would do. The book ends with Jonah under a gourd on
  a hill east of the city, hearing the Lord ask, should He not spare it? The image shows
  the book's course: the sea, the road to Nineveh, and the city as the storm draws away.
motifs:
  - "The great city (Jonah 3:3, 4:11): the largest form in the picture, filling the right half of the middle ground: a broad, pale walled city of flat-roofed clay houses and square towers, with a gate facing the viewer, whole and unharmed, its walls lit gold."
  - "A storm drawing back from the city (Jonah 3:10): a heavy bank of dark cloud in the upper left, over the sea and the plain, with a little rain still falling far out at sea. The sky over the city is clear and gold."
  - "A gourd over a booth (Jonah 4:5–6): on the stony rise in the right foreground, looking down on the city, a small shelter of poles and woven branches under a broad castor-bean plant with large lobed leaves, empty."
  - "A single pale path (Jonah 3:3): one track running from the far shore across the plain to the city's gate, with no one on it."
  - "The great fish far out at sea (Jonah 1:17, 2:10): on the horizon at the left, small, the dark back and raised tail of a great fish, drawn as a whale, curving down into the water."
composition: >-
  A wide landscape at first light, seen from a raised, stony hill east of the city. The
  city stands large in the right half of the middle ground, the booth and gourd on the
  near rise at the right. To the left a long plain opens to a strip of sea on the
  horizon, where the fish is small and far off; the path runs from that shore to the
  city's gate. The dark storm cloud fills the upper left and is moving away; the sky
  over the city is clear. The sun rises on the far right, so the walls and the booth
  are lit from the right and shadows fall toward the left. No ship, no lightning, no
  figures, no animals but the fish.
# “What's in this picture” under the image on the book page: one line for each thing, with the verse it shows.
key:
  - '**The city in the light** is Nineveh, “that great city,” still standing. The Lord asks at the end of the book, “should not I spare Nineveh?” ([[Jonah 3:10]]; [[Jonah 4:11]]).'
  - '**The storm drawing away from the city** is the threat of destruction turned back. When God saw that the people “turned from their evil way,” He “repented of the evil, that he had said that he would do unto them; and he did it not” ([[Jonah 3:10]]).'
  - '**The booth under the gourd** is where Jonah sat on the east side of the city “till he might see what would become of the city,” and where “the LORD God prepared a gourd” to shade him ([[Jonah 4:5–6]]).'
  - '**The path to the city gate** is Jonah’s road when, sent “the second time,” he “arose, and went unto Nineveh, according to the word of the LORD” ([[Jonah 3:1–3]]).'
  - '**The great fish far out at sea** is the one “the LORD had prepared” to swallow Jonah, and which “vomited out Jonah upon the dry land” after three days and three nights ([[Jonah 1:17]]; [[Jonah 2:10]]).'
