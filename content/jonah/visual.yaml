alt: A pale walled city with square towers and a gate stands large in golden morning light as a dark storm cloud rolls away over the plain and the sea to the left. A path crosses the plain to the gate from the distant shore, where a whale's back and tail curve into the water on the horizon. In the foreground a small shelter of poles sits under a broad-leaved gourd on a stony hill.
