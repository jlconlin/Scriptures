chapter: 3
claims:
  # ---- when / setting / thread ----
  - where: 'when'
    claim: 'Jonah lived under Jeroboam II'
    key: bd-jonah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jonah?lang=eng'
    quote: 'Of Gath-hepher in Zebulun. He lived under Jeroboam Ⅱ, whose success in restoring the ancient boundaries of Israel he predicted (2 Kgs. 14:25).'
  - where: 'when'
    claim: 'Jonah ministered in the mid-eighth century BC'
    key: scripture-helps-amos
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/46-amos-obadiah-jonah?lang=eng'
    quote: 'Jonah was a prophet from the northern territory of Zebulun who ministered during the reign of Jeroboam II in the mid-eighth century BC.'
  - where: 'when'
    claim: 'The book does not claim to be by the prophet; it is by a later writer'
    key: bd-jonah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jonah?lang=eng'
    quote: 'The present book of Jonah does not claim to be from the hand of the prophet; it describes an episode in his life and is due to some later writer.'
  - where: 'setting'
    claim: 'The mariners cried and were saved; the Ninevites turned and were spared'
    key: correa-jonah
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/correa/2022-11-23/jonah_micah.pdf'
    quote: 'Another repeated motif is the Lord’s mercy on the people. On the ship, the mariners cried unto the Lord, and He saved them from death at sea. In Nineveh, the people turned from their evil ways, and the Lord spared them.'
  - where: 'setting'
    claim: 'The conversion of Nineveh is not verified in ancient historical records'
    key: scott-jonah
    url: 'https://byustudies.byu.edu/article/the-book-of-jonah-foreshadowings-of-jesus-as-the-christ'
    quote: 'This account of total conversion of Nineveh is not verified in ancient historical records'
  - where: 'setting'
    claim: 'The unnamed king and the uniqueness of the account of repentance are objections raised to the book’s historicity'
    key: tvedtnes-jonah
    url: 'https://www.churchofjesuschrist.org/study/ensign/1974/06/discovery/jonah?lang=eng'
    quote: 'the king of Nineveh, for example, is never mentioned. … Second, the Old Testament provides the only account of the dramatic repentance of the Ninevites.'
  - where: 'setting'
    claim: 'Nineveh fell with the Assyrian empire; Nahum prophesied concerning it'
    key: bd-nineveh
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/nineveh?lang=eng'
    quote: 'The city fell at the downfall of the Assyrian empire, 606 B.C. See Assyria and Babylonia. For prophecies concerning Nineveh, see Jonah 1:2; 3:2–7; 4:11; Nahum 1:1; 2:8; 3:7; Zeph. 2:13.'
  - where: 'setting'
    claim: 'The Joseph Smith Translation changes verses 9 and 10'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jonah/3?lang=eng'
    quote: 'JST Jonah 3:9 … we will repent, and turn unto God, but he will turn away from us his fierce anger …'
  - where: 'thread'
    claim: 'Jonah fled at the first word; the Ninevites repented at the first message'
    key: correa-jonah
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/correa/2022-11-23/jonah_micah.pdf'
    quote: 'Whereas Jonah fled after hearing the word of the Lord the first time, the wicked people of Nineveh repented upon receiving the'
  - where: 'thread'
    claim: 'Jonah’s sermon is five words in Hebrew'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jonah.xml'
    quote: 'נֶהְפָּֽכֶת'
  # ---- notes ----
  - where: 'note 3:1 “The second time”'
    claim: 'The Lord mercifully gave Jonah a second chance'
    key: correa-jonah
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/correa/2022-11-23/jonah_micah.pdf'
    quote: 'Being merciful to His servant, the Lord gave Jonah a second chance. This time, like Moses, Jonah was obedient “according to the word of the Lord”'
  - where: 'note 3:1 “The second time”'
    claim: 'The Lord brought Jonah to Nineveh in the fish and gave him a second chance; Jonah could not let go of his hatred of Assyrians'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'the Lord mercifully orchestrated his delivery to Nineveh in the belly of a great fish and gave him a second chance to fulfill his mission. Unfortunately, … Jonah could not let go of his hatred of Assyrians.'
  - where: 'note 3:1 “The second time”'
    claim: 'The Lord had not given up on Jonah, nor on Nineveh, Israel or us'
    key: cfm-ot-2026-48
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/48?lang=eng'
    quote: 'But the Lord hadn’t given up on Jonah—just as He hadn’t given up on the people of Nineveh, on the house of Israel, or on any of us.'
  - where: 'note 3:1 “The second time”'
    claim: 'The wording of the two calls (1:2 and 3:2)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jonah/1?lang=eng'
    quote: 'Arise, go to Nineveh, that great city, and cry against it; for their wickedness is come up before me.'
  - where: 'note 3:3 “A city great to God”'
    claim: 'The Hebrew reads “great city to God”; the three days’ journey is through greater Nineveh with its environs'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jonah/3?lang=eng'
    quote: 'HEB great city to God.'
  - where: 'note 3:3 “A city great to God”'
    claim: 'The three days’ journey is through greater Nineveh with its environs'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jonah/3?lang=eng'
    quote: 'IE through greater Nineveh with its environs.'
  - where: 'note 3:3 “A city great to God”'
    claim: 'The phrase can be read as God’s regard for the city, pointing to the motive for sparing it (4:11)'
    key: keil-jonah
    url: 'https://biblehub.com/commentaries/kad/jonah/3.htm'
    quote: 'But Nineveh was a great city to God (lē''lōhı̄m), i.e., it was regarded by God as a great city. This remark points to the motive for sparing it (cf. Jonah 4:11)'
  - where: 'note 3:3 “A city great to God”'
    claim: 'Archaeologists find Nineveh nowhere near three days’ journey in size'
    key: scott-jonah
    url: 'https://byustudies.byu.edu/article/the-book-of-jonah-foreshadowings-of-jesus-as-the-christ'
    quote: 'Archeologists have found that ancient Nineveh was nowhere near “three days’ journey” in size'
  - where: 'note 3:3 “A city great to God”'
    claim: 'At its height in the seventh century BC Nineveh covered at least 750 hectares'
    key: uriona-assyria
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/uriona/2023-02-24/i_55_todd_uriona_assyria_and_the_great_church_of_nephis_vision_2023_1-30.pdf'
    quote: 'for during the period of her greatest fame, in the 7th century bce , when most of Western Asia was subjected to the iron-fisted rule of Assyria’s Nineveh-based rulers, the city covered no less than 750 hectares.'
  - where: 'note 3:4 “Overthrown”'
    claim: 'The sermon is five Hebrew words, the last the verb “overthrown” (H2015)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jonah.xml'
    quote: 'נֶהְפָּֽכֶת'
  - where: 'note 3:4 “Overthrown”'
    claim: 'The verb of Genesis 19:25 (“overthrew those cities”) is the same verb, H2015'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'וַֽ/יַּהֲפֹךְ֙'
  - where: 'note 3:4 “Overthrown”'
    claim: 'The lexicon lists the overthrow of Sodom under this verb, and Jonah 3:4 as “be overturned, overthrown”'
    key: bdb
    url: 'https://biblehub.com/hebrew/2015.htm'
    quote: 'b. overturn, overthrow, followed by accusative Sodom, etc., Genesis 19:21,25,29 (J) … d. be overturned, overthrown, of city Nineveh Jonah 3:4.'
  - where: 'note 3:5 “The men of Nineveh in the Saviour’s words”'
    claim: 'Repentant Nineveh was a sign to the Jews'
    key: bd-nineveh
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/nineveh?lang=eng'
    quote: 'Repentant Nineveh, a sign to the Jews (Matt. 12:41; Luke 11:32).'
  - where: 'note 3:5 “The men of Nineveh in the Saviour’s words”'
    claim: 'Why a non-Hebrew people believed can only be conjectured; perhaps the foreign prophet’s boldness'
    key: ot-manual-9
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-9?lang=eng'
    quote: 'Why a non-Hebrew people would believe a Hebrew prophet one can only conjecture. Perhaps they were shocked into repentance by the appearance of a foreigner who, apparently without thought of personal safety, would come such a distance to unveil the sins of a people he did not know.'
  - where: 'note 3:5 “The men of Nineveh in the Saviour’s words”'
    claim: 'The total conversion of Nineveh prefigures the day when every knee shall bow (D&C 88:104)'
    key: scott-jonah
    url: 'https://byustudies.byu.edu/article/the-book-of-jonah-foreshadowings-of-jesus-as-the-christ'
    quote: 'This account of total conversion of Nineveh is not verified in ancient historical records, but it prefigures that millennial day when “every ear shall hear [the fifth angel’s trump], and every knee shall bow and every tongue shall confess'
  - where: 'note 3:5 “The men of Nineveh in the Saviour’s words”'
    claim: 'The Saviour’s words on the men of Nineveh'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/11?lang=eng'
    quote: 'For as Jonas was a sign unto the Ninevites, so shall also the Son of man be to this generation.'
  - where: 'note 3:6 “Sackcloth and ashes”'
    claim: 'Sackcloth described; mourners sprinkled or sat in ashes; with fasting and prayer a symbol of sincere repentance (McConkie, printed in the manual)'
    key: ot-manual-9
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-9?lang=eng'
    quote: 'A coarse, dark cloth made of hair of camels and goats … It was the custom for mourners, garbed in sackcloth, either to sprinkle ashes upon themselves or to sit in piles of ashes, thereby showing their joy had perished or been destroyed.'
  - where: 'note 3:6 “Sackcloth and ashes”'
    claim: 'Sackcloth and ashes with fasting and prayer became a symbol of sincere repentance'
    key: ot-manual-9
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-9?lang=eng'
    quote: 'Sackcloth and ashes (accompanied by the fasting, prayer, and turning to the Lord that attended their use) became a symbol of the most sincere and humble repentance.'
  - where: 'note 3:6 “Sackcloth and ashes”'
    claim: 'The king laid aside his royal robe and sat in ashes as a sign of deepest mourning; Ezekiel pictures the Tyrian princes the same way'
    key: keil-jonah
    url: 'https://biblehub.com/commentaries/kad/jonah/3.htm'
    quote: 'laid aside his royal robe (''addereth, see at Joshua 7:21), wrapt himself in a sackcloth, and sat down in ashes, as a sign of the deepest mourning (compare Job 2:8)'
  - where: 'note 3:6 “Sackcloth and ashes”'
    claim: 'Ezekiel 26:16 depicts the mourning of the Tyrian princes in the same manner'
    key: keil-jonah
    url: 'https://biblehub.com/commentaries/kad/jonah/3.htm'
    quote: 'Ezekiel (Ezekiel 26:16) depicts the mourning of the Tyrian princes over the ruin of their capital in just the same manner in which that of the king of Nineveh is described here'
  - where: 'note 3:7 “Even the cattle fast”'
    claim: 'Cattle taking part in mourning is attested by Herodotus as an Asiatic custom (Persians shaving their horses for Masistios)'
    key: keil-jonah
    url: 'https://biblehub.com/commentaries/kad/jonah/3.htm'
    quote: 'Even the one feature which is peculiar to the mourning of Nineveh - namely, that the cattle also have to take part in the mourning - is attested by Herodotus (9:24) as an Asiatic custom.'
  - where: 'note 3:7 “Even the cattle fast”'
    claim: 'Herodotus: the Persians shaved their horses in mourning for Masistios'
    key: keil-jonah
    url: 'https://biblehub.com/commentaries/kad/jonah/3.htm'
    quote: 'Herodotus relates that the Persians, when mourning for their general, Masistios, who had fallen in the battle at Platea, shaved off the hair from their horses'
  - where: 'note 3:7 “Even the cattle fast”'
    claim: 'The animals’ suffering was thought to help appease the wrath of God'
    key: keil-jonah
    url: 'https://biblehub.com/commentaries/kad/jonah/3.htm'
    quote: 'it was a manifestation of the thought, that just as the animals which live with man are drawn into fellowship with his sin, so their sufferings might also help to appease the wrath of God.'
  - where: 'note 3:8 “The violence that is in their hands”'
    claim: 'Nineveh was an enemy of Israel known for violence and cruelty'
    key: cfm-ot-2026-48
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/48?lang=eng'
    quote: 'Nineveh was an enemy of Israel known for its violence and cruelty.'
  - where: 'note 3:9 “Who can tell?”'
    claim: '“Who can tell” is literally “who knows” (participle of the verb “know”)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/jonah/3-9.htm'
    quote: 'יוֹדֵ֣עַ'
  - where: 'note 3:9 “Who can tell?”'
    claim: 'Joel 2:14 opens with the same Hebrew words, “who knows, he will turn and repent” (H4310, H3045, H7725, H5162)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Joel.xml'
    quote: 'וְ/נִחָ֑ם'
  - where: 'note 3:9 “Who can tell?”'
    claim: 'The Joseph Smith Translation of 3:9'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jonah/3?lang=eng'
    quote: 'JST Jonah 3:9 … we will repent, and turn unto God, but he will turn away from us his fierce anger …'
  - where: 'note 3:10 “God relented”'
    claim: 'The verb nacham at Jonah 3:10 is repenting for ill done to others'
    key: bdb
    url: 'https://biblehub.com/hebrew/5162.htm'
    quote: 'עלהֿרעה for ill done to others Exodus 32:12,14 (J), Jeremiah 18:8; Joel 2:13; Jonah 3:10; Jonah 4:2'
  - where: 'note 3:10 “God relented”'
    claim: 'The footnote at 4:2 renders the verb “relentest” and says Jonah knew God could revoke the calamity'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jonah/4?lang=eng'
    quote: 'HEB relentest; i.e., Jonah knew that God could revoke the calamity decreed, but expected He would do so even without the repentance of the people.'
  - where: 'note 3:10 “God relented”'
    claim: 'The Joseph Smith Translation of 3:10'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jonah/3?lang=eng'
    quote: 'JST Jonah 3:10 … evil way and repented; and God turned away the evil that he had said he would bring upon them.'
  # ---- sections, christ, explore ----
  - where: 'section 2 plain'
    claim: '“Who can tell” rendered “Who knows?” and “repent” rendered “relent”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/jonah/3-9.htm'
    quote: 'Who knows? God may turn and relent; He may turn from His fierce anger, so that we will not perish.'
  - where: 'section 3 plain'
    claim: '“Repented” rendered “relented”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jonah/4?lang=eng'
    quote: 'HEB relentest'
  - where: 'christ'
    claim: 'Jesus inaugurated the preaching of the gospel of peace to the whole world, of which Jonah’s preaching to Nineveh was a type'
    key: sc-knowhy-652
    url: 'https://scripturecentral.org/knowhy/what-is-the-sign-of-jonah'
    quote: 'soon Jesus inaugurated the preaching of the gospel of peace to the whole world, of which Jonah’s preaching to Nineveh was a type.'
  - where: 'christ'
    claim: 'Jonah became a type to Israel and the Ninevites of the need to take advantage of the Atonement through repentance'
    key: davies-jonah
    url: 'https://rsc.byu.edu/isaiah-prophets/jonah-testimony-resurrection'
    quote: 'Jonah became a type to Israel and the Ninevites of (1) the literalness of the power of resurrection and (2) the need to take advantage of the Atonement through repentance if one desired full association with God in his presence.'
  - where: 'christ'
    claim: 'The Joseph Smith Translation of 3:10: God turned away the evil'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jonah/3?lang=eng'
    quote: 'JST Jonah 3:10 … evil way and repented; and God turned away the evil that he had said he would bring upon them.'
