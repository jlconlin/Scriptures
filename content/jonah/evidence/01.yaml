chapter: 1
claims:
  # ---- when / setting ----
  - where: 'when'
    claim: 'Jonah ministered under Jeroboam II in the mid-eighth century B.C.'
    key: scripture-helps-amos
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/46-amos-obadiah-jonah?lang=eng'
    quote: 'Jonah was a prophet from the northern territory of Zebulun who ministered during the reign of Jeroboam II in the mid-eighth century BC.'
  - where: 'when'
    claim: 'The book does not claim to be by the prophet and describes an episode in his life'
    key: bd-jonah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jonah?lang=eng'
    quote: 'The present book of Jonah does not claim to be from the hand of the prophet; it describes an episode in his life and is due to some later writer.'
  - where: 'setting'
    claim: 'Jonah was of Gath-hepher in Zebulun and foretold Jeroboam II’s restoration of Israel’s borders'
    key: bd-jonah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jonah?lang=eng'
    quote: 'Of Gath-hepher in Zebulun. He lived under Jeroboam Ⅱ, whose success in restoring the ancient boundaries of Israel he predicted (2 Kgs. 14:25).'
  - where: 'setting'
    claim: 'Jonah’s prophecy of the restored border, in Kings'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/14?lang=eng'
    quote: 'He restored the coast of Israel from the entering of Hamath unto the sea of the plain, according to the word of the Lord God of Israel, which he spake by the hand of his servant Jonah, the son of Amittai'
  - where: 'setting'
    claim: 'Jeroboam II was the ablest and most successful in war of Israel’s kings'
    key: bd-jeroboam
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jeroboam?lang=eng'
    quote: 'Jeroboam Ⅱ, of the dynasty of Jehu, the ablest of the kings of Israel, and the most successful in war'
  - where: 'setting'
    claim: 'Assyria later besieged and took Samaria, ending the northern kingdom (722 B.C.)'
    key: bd-assyria
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/assyria-and-babylonia?lang=eng'
    quote: 'The siege of Samaria, begun by Shalmaneser (2 Kgs. 17:3–6), was concluded by Sargon (722–705)'
  - where: 'setting'
    claim: 'The book is a narrative of Jonah’s experiences, not a collection of prophecies'
    key: scripture-helps-amos
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/46-amos-obadiah-jonah?lang=eng'
    quote: 'the book of Jonah is not a collection of Jonah’s prophecies but a narrative account of his personal experiences.'
  - where: 'setting'
    claim: 'The book does not name its author; the Bible Dictionary takes it to be by a later writer'
    key: bd-jonah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jonah?lang=eng'
    quote: 'it describes an episode in his life and is due to some later writer.'
  - where: 'setting'
    claim: 'Language and style suggest the book was written 450–300 B.C.; its author is unknown'
    key: scott-jonah
    url: 'https://byustudies.byu.edu/article/the-book-of-jonah-foreshadowings-of-jesus-as-the-christ'
    quote: 'The language, style, and theology of the book of Jonah suggest that it was most likely written between 450 and 300 BC. … The author of the book is unknown.'
  - where: 'setting'
    claim: 'Whether the story is literal history has been debated'
    key: scott-jonah
    url: 'https://byustudies.byu.edu/article/the-book-of-jonah-foreshadowings-of-jesus-as-the-christ'
    quote: 'Much discussion about the book of Jonah has debated whether its story reflects literal history or not, what the book’s literary form is, and how its purpose should be understood.'
  - where: 'setting'
    claim: 'The Saviour made Jonah’s three days the sign of His own death and Resurrection'
    key: bd-jonah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jonah?lang=eng'
    quote: 'In each case He gave “the sign of the prophet Jonah,” the event in that prophet’s life being a foreshadowing of Jesus’ own death and resurrection'
  - where: 'setting'
    claim: 'The book’s key is the reason Jonah gives for his flight in 3:10–4:11'
    key: bd-jonah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jonah?lang=eng'
    quote: 'The key to the book is to be found in Jonah 3:10–4:11 in the reasons the prophet gives for his flight and unwillingness to preach at Nineveh.'

  # ---- thread ----
  - where: 'thread'
    claim: 'The same Hebrew verb “went down” in 1:3 (twice) and 1:5'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jonah.xml'
    quote: 'וַ/יֵּ֨רֶד'
  - where: 'thread'
    claim: 'One Hebrew verb, to hurl, for the Lord sending the wind (1:4), the cargo (1:5) and Jonah (1:12, 15)'
    key: bdb
    url: 'https://biblehub.com/hebrew/2904.htm'
    quote: 'Jonah אֶלהַֿיָּם Jonah 1:12,15; also the cargo כֵּלִים Jonah 1:5 … hurl (send violently), of ׳י sending furious wind Jonah 1:4'
  - where: 'thread'
    claim: 'The verb of the sailors’ fear in 1:5, 1:10, 1:16'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jonah.xml'
    quote: 'וַ/יִּֽירְא֤וּ'
  - where: 'thread'
    claim: 'The same root of fear in Jonah’s confession, 1:9'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jonah.xml'
    quote: 'יָרֵ֔א'

  # ---- note 1:2 ----
  - where: 'note 1:2 “Nineveh, that great city”'
    claim: 'Nineveh was on the Tigris; Calah outstripped it for centuries and it became the capital again under Sennacherib'
    key: bd-nineveh
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/nineveh?lang=eng'
    quote: 'Capital of Assyria on the eastern bank of the Tigris, its traditional founder being Nimrod, the great hunter (Gen. 10:11–12). For several centuries Calah outstripped it in importance, but under Sennacherib it again became the capital'
  - where: 'note 1:2 “Nineveh, that great city”'
    claim: 'Nineveh was a major Assyrian city, later its capital; more than 500 miles from Gath-hepher; its people were in great wickedness'
    key: scripture-helps-amos
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/46-amos-obadiah-jonah?lang=eng'
    quote: 'Nineveh was a major city in the Assyrian Empire that later became its capital under King Sennacherib. It was more than 500 miles (800 kilometers) from Jonah’s hometown of Gath-hepher.'
  - where: 'note 1:2 “Nineveh, that great city”'
    claim: 'The Assyrians were infamous for barbarous treatment of captives'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'Assyrians were infamous for their barbarous methods of conquest and their treatment of captured enemies.'
  - where: 'note 1:2 “Nineveh, that great city”'
    claim: 'The Assyrians tortured and mutilated captives and impaled them, as on the Lachish panels from Sennacherib’s palace'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'The Assyrians were masters of torture, cutting off noses and ears and yanking out tongues of live enemies. They flayed prisoners and skinned them alive or, as depicted on the Lachish siege panels from Sennacherib’s palace at Nineveh'

  # ---- note 1:3 Tarshish ----
  - where: 'note 1:3 “Running the other way”'
    claim: 'Tarshish is probably Tartessus in Spain'
    key: bd-tarshish
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tarshish?lang=eng'
    quote: '(1) Probably Tartessus in Spain; ships of Tarshish'
  - where: 'note 1:3 “Running the other way”'
    claim: 'Tarshish’s location is unknown, often identified with Tartessus; it lay the opposite way from Nineveh and stood for somewhere far away'
    key: scripture-helps-amos
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/46-amos-obadiah-jonah?lang=eng'
    quote: 'The exact location of Tarshish is unknown, but many scholars identify it with Tartessus, an ancient city in southern Spain. Tarshish was situated in the opposite direction of Nineveh and likely represented a faraway location.'
  - where: 'note 1:3 “Running the other way”'
    claim: 'The book gives Jonah’s reason for fleeing only at 3:10–4:11'
    key: bd-jonah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jonah?lang=eng'
    quote: 'The key to the book is to be found in Jonah 3:10–4:11 in the reasons the prophet gives for his flight and unwillingness to preach at Nineveh.'
  - where: 'note 1:3 “Running the other way”'
    claim: 'Jonah’s problem seems not cowardice but resentment that the enemy would be given a chance to repent'
    key: ot-manual-9
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-9?lang=eng'
    quote: 'But Jonah’s problem does not seem to be cowardice. Rather, it seems to have been resentment against the Lord for giving the hated enemy a chance to repent (see Jonah 4:1–2.)'
  - where: 'note 1:3 “Running the other way”'
    claim: 'Jonah, like most Israelites of his century, evidently held bitter feelings against Israel’s enemy'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'As with most Israelites in the eighth century BC, Jonah evidently held deep and bitter feelings against Israel’s enemy.'
  - where: 'note 1:3 “Running the other way”'
    claim: 'Jonah discovered the uselessness of trying to flee from Jehovah'
    key: scripture-helps-amos
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/46-amos-obadiah-jonah?lang=eng'
    quote: 'When Jonah attempted to avoid God’s call to preach repentance to the people of Nineveh, he discovered the uselessness of trying to flee from Jehovah.'

  - where: 'note 1:3 “Running the other way”'
    claim: 'Nineveh lay northeast; Jonah fled the opposite way to escape the hated Assyrians'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'Instead of traveling northeast toward the Assyrian capital, he fled in the opposite direction to escape contact with the hated Assyrians.'

  # ---- note 1:3 Joppa ----
  - where: 'note 1:3 “Joppa”'
    claim: 'Joppa (modern Jaffa) was the nearest port to Jerusalem'
    key: bd-joppa
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/joppa?lang=eng'
    quote: '(Modern Jaffa.) A town on the southwest coast of Palestine, the nearest port to Jerusalem'
  - where: 'note 1:3 “Joppa”'
    claim: 'Jonah fled from the call to the Gentiles from the same city where Peter accepted it'
    key: wayment-peter-cornelius
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/peter-cornelius-cultural-boundaries'
    quote: 'The symbolic significance is overt: Jonah fled the command to take the gospel to the Gentiles, while Peter in the same city accepted the call of the Lord to take the gospel to the Gentiles.'
  - where: 'note 1:3 “Joppa”'
    claim: 'The location is probably happenstance, though Luke may have meant the connection'
    key: wayment-peter-cornelius
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/peter-cornelius-cultural-boundaries'
    quote: 'Although the actual occurrence of the vision in Joppa is probably little more than happenstance, given Luke’s careful documentation of the Gentile mission, it is possible that he recorded the location with the intent that the reader would see the connection to the mission of Jonah'
  - where: 'note 1:3 “Joppa”'
    claim: 'Peter in Joppa faced the same issue as Jonah'
    key: scott-jonah
    url: 'https://byustudies.byu.edu/article/the-book-of-jonah-foreshadowings-of-jesus-as-the-christ'
    quote: 'Not coincidentally in the same port city of Joppa (Jonah 1:3; Acts 10:5), Peter faced the same issue as Jonah, being surprised that Gentiles would be welcome in God’s kingdom'

  # ---- note 1:5 ----
  - where: 'note 1:5 “Asleep in the storm”'
    claim: 'Jonah is told to arise three times, twice by the Lord and once by the shipmaster'
    key: scott-jonah
    url: 'https://byustudies.byu.edu/article/the-book-of-jonah-foreshadowings-of-jesus-as-the-christ'
    quote: 'Jonah is commanded to arise three times—twice by the Lord and once by the shipmaster (1:2, 6; 3:2).'
  - where: 'note 1:5 “Asleep in the storm”'
    claim: 'Jesus too slept in a storm-tossed ship, described in similar words'
    key: scott-jonah
    url: 'https://byustudies.byu.edu/article/the-book-of-jonah-foreshadowings-of-jesus-as-the-christ'
    quote: 'Jesus, like Jonah, slept on his disciples’ ship despite a violent storm on the Sea of Galilee that threatened to sink them, all of which is described with several similar words'
  - where: 'note 1:5 “Asleep in the storm”'
    claim: 'Jesus’s calming of the storm showed His power over the elements'
    key: scott-jonah
    url: 'https://byustudies.byu.edu/article/the-book-of-jonah-foreshadowings-of-jesus-as-the-christ'
    quote: 'Jesus’s calming the storm showed his power over the elements and his place as Lord of all the earth'
  - where: 'note 1:5 “Asleep in the storm”'
    claim: 'Matthew 8:24, Jesus asleep in the tempest'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/8?lang=eng'
    quote: 'And, behold, there arose a great tempest in the sea, insomuch that the ship was covered with the waves: but he was asleep.'

  - where: 'note 1:5 “Asleep in the storm”'
    claim: 'In both stories the crew wakes the sleeper, fearing they will perish'
    key: scott-jonah
    url: 'https://byustudies.byu.edu/article/the-book-of-jonah-foreshadowings-of-jesus-as-the-christ'
    quote: 'Likewise, Jesus’s panicked crew of disciples awakened him'

  # ---- note 1:9 ----
  - where: 'note 1:9 “The God of the sea and the dry land”'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: 'note 1:9 “The God of the sea and the dry land”'
    claim: 'The book shows that Jehovah reigns everywhere, over sea and land'
    key: bd-jonah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jonah?lang=eng'
    quote: 'He shows that Jehovah reigns everywhere, over sea and land; even in the gentile world the minds of men are conscious of sin and prepared to acknowledge that Jehovah is God.'
  - where: 'note 1:9 “The God of the sea and the dry land”'
    claim: '“Hebrew” was the name Israelites used of themselves before other nations; “fear” here means to revere, describing his relation to God'
    key: keil-jonah
    url: 'https://biblehub.com/commentaries/kad/jonah/1.htm'
    quote: 'the name by which the Israelites designated themselves in contradistinction to other nations, and by which other nations designated them … ירא has been rendered correctly by the lxx σέβομαι, colo, revereor'
  - where: 'note 1:9 “The God of the sea and the dry land”'
    claim: 'The confession is not a claim to innocence but states his relation to God'
    key: keil-jonah
    url: 'https://biblehub.com/commentaries/kad/jonah/1.htm'
    quote: 'By the statement, "I fear," etc., he had no intention of describing himself as a righteous or innocent man (Hitzig), but simply meant to indicate his relation to God'

  - where: 'note 1:9 “The God of the sea and the dry land”'
    claim: 'The Church’s footnote at 1:9 points to the Topical Guide entry Jesus Christ, Jehovah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jonah/1?lang=eng'
    quote: 'Jesus Christ, Jehovah'

  # ---- note 1:12 ----
  - where: 'note 1:12 “Take me up, and cast me forth”'
    claim: 'Jonah’s self-sacrifice to save his shipmates is Christlike; as a symbol he may be flawed'
    key: holland-forsake-mercy
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2025/10/53holland?lang=eng'
    quote: 'Jonah’s self-sacrifice to save his shipmates is Christlike indeed. … As a symbol of the Savior’s sacrificial death and glorious Resurrection, Jonah may be flawed.'
  - where: 'note 1:12 “Take me up, and cast me forth”'
    claim: 'Jonah volunteered his life to save the Gentile crew, as a type of Christ’s sacrifice'
    key: scott-jonah
    url: 'https://byustudies.byu.edu/article/the-book-of-jonah-foreshadowings-of-jesus-as-the-christ'
    quote: 'Jonah, knowing he was the cause of the life-threatening storm, volunteered to sacrifice his life (as a type of Christ’s sacrifice to save humankind) to save the Gentile crew and their ship.'
  - where: 'note 1:12 “Take me up, and cast me forth”'
    claim: 'Jonah realized his efforts to hide from the Lord were futile'
    key: uceda-second-chance
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/09/jonah-and-the-second-chance?lang=eng'
    quote: 'Jonah now realized that his efforts to hide from the Lord were futile and replied, “Take me up, and cast me forth into the sea'

  # ---- note 1:14 ----
  - where: 'note 1:14 “Lay not upon us innocent blood”'
    claim: 'The prayer, after Deuteronomy 21:8, asks God not to impute Jonah’s death to them; “as it pleased thee” means God has ordained it by the storm and the lot'
    key: keil-jonah
    url: 'https://biblehub.com/commentaries/kad/jonah/1.htm'
    quote: 'according to Deuteronomy 21:8, "do not impute his death to us, if we cast him into the sea, as bloodguiltiness deserving death;" "for Thou, O Jehovah, hast done as it pleased Thee," - namely, inasmuch as, by sending the storm and determining the lot, Thou hast so ordained'
  - where: 'note 1:14 “Lay not upon us innocent blood”'
    claim: 'Deuteronomy 21:8 has the same phrase'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/21?lang=eng'
    quote: 'lay not innocent blood unto thy people of Israel’s charge'

  # ---- note 1:16 ----
  - where: 'note 1:16 “Sailors who fear the LORD”'
    claim: 'The sailors sacrificed on board, at once, and vowed further sacrifices on arrival'
    key: keil-jonah
    url: 'https://biblehub.com/commentaries/kad/jonah/1.htm'
    quote: '"offered sacrifice to Jehovah" - not after they landed, but immediately, on board the ship - "and vowed vows," i.e., vowed that they would offer Him still further sacrifices on their safe arrival at their destination.'
  - where: 'note 1:16 “Sailors who fear the LORD”'
    claim: 'The sudden calm showed the storm had come on Jonah’s account'
    key: keil-jonah
    url: 'https://biblehub.com/commentaries/kad/jonah/1.htm'
    quote: 'The sudden cessation of the storm showed that the bad weather had come entirely on Jonah''s account, and that the sailors had not shed innocent blood by casting him into the sea.'
  - where: 'note 1:16 “Sailors who fear the LORD”'
    claim: 'The book shows even Gentiles conscious of sin and ready to acknowledge Jehovah; it paints the humanity of the gentile sailors'
    key: bd-jonah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jonah?lang=eng'
    quote: 'The book is a beautiful poem, whether it paints the humanity of the gentile sailors'
  - where: 'note 1:16 “Sailors who fear the LORD”'
    claim: 'The writer opposes narrowmindedness that would confine God’s love to one nation'
    key: bd-jonah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jonah?lang=eng'
    quote: 'The writer is opposing a narrowmindedness that would confine the love of God to a single nation.'

  # ---- note 1:17 prepared ----
  - where: 'note 1:17 “Prepared a great fish”'
    claim: '“Prepared” is the verb manah, to appoint or ordain; in Jonah of the fish, the plant, the worm and the wind, all with the Lord as subject'
    key: bdb
    url: 'https://biblehub.com/hebrew/4487.htm'
    quote: 'appoint, ordain … in story of Jonah, object. fish Jonah 2:1, ricinus Jonah 4:6; worm Jonah 4:7, wind Jonah 4:8 (all subject b>׳י)'
  - where: 'note 1:17 “Prepared a great fish”'
    claim: 'The Hebrew of 1:17 (Hebrew 2:1) has dag gadol and the verb manah'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jonah.xml'
    quote: 'דָּ֣ג'
  - where: 'note 1:17 “Prepared a great fish”'
    claim: 'The Hebrew is dag gadol, a large or great fish'
    key: davies-jonah
    url: 'https://rsc.byu.edu/isaiah-prophets/jonah-testimony-resurrection'
    quote: 'the word dag gadol is used here, meaning a large or great fish'
  - where: 'note 1:17 “Prepared a great fish”'
    claim: 'The Greek of Matthew 12:40 behind “whale” is ketos, huge fish'
    key: davies-jonah
    url: 'https://rsc.byu.edu/isaiah-prophets/jonah-testimony-resurrection'
    quote: 'The King James Version says “whale,” but the Greek word is ketos, which means “huge fish.”'
  - where: 'note 1:17 “Prepared a great fish”'
    claim: 'Accounts of sailors surviving in whales have been propounded to show the book’s historicity'
    key: davies-jonah
    url: 'https://rsc.byu.edu/isaiah-prophets/jonah-testimony-resurrection'
    quote: '“Fantastic stories” have been found, manipulated, and propounded to show the historicity of the book, and parallels of sailors surviving in whales’ bellies are run past in endless display.'

  - where: 'note 1:17 “Prepared a great fish”'
    claim: 'The fish sent by the Lord preserved Jonah’s life'
    key: uceda-second-chance
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/09/jonah-and-the-second-chance?lang=eng'
    quote: 'a “great fish” sent by the Lord suddenly appeared and swallowed Jonah, thus preserving his life'

  # ---- note 1:17 sign ----
  - where: 'note 1:17 “The sign of the prophet Jonas”'
    claim: 'Matthew 12:39–41, the Saviour’s words'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/12?lang=eng'
    quote: 'For as Jonas was three days and three nights in the whale’s belly; so shall the Son of man be three days and three nights in the heart of the earth.'
  - where: 'note 1:17 “The sign of the prophet Jonas”'
    claim: 'The Lord gave the sign of Jonah on two occasions when asked for a sign'
    key: bd-jonah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jonah?lang=eng'
    quote: 'The story of Jonah was referred to by our Lord on two occasions when He was asked for a sign from heaven.'
  - where: 'note 1:17 “The sign of the prophet Jonas”'
    claim: 'The method of reckoning the three days cannot be known for certain'
    key: scott-jonah
    url: 'https://byustudies.byu.edu/article/the-book-of-jonah-foreshadowings-of-jesus-as-the-christ'
    quote: 'Any of these days will suit the comparison to Jonah’s three days and three nights because we cannot know for certain the method of reckoning of Jonah’s time of suffering, let alone the exact amount of time Jesus was dead.'
  - where: 'note 1:17 “The sign of the prophet Jonas”'
    claim: 'Elder Joseph Fielding Smith believed the story chiefly because Jesus believed it'
    key: ot-manual-9
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-9?lang=eng'
    quote: 'My chief reason for so believing is not in the fact that it is recorded in the Bible, or that the incident has been duplicated in our day, but in the fact that Jesus Christ, our Lord, believed it.'
  - where: 'note 1:17 “The sign of the prophet Jonas”'
    claim: 'No physical evidence can either prove or disprove the book'
    key: davies-jonah
    url: 'https://rsc.byu.edu/isaiah-prophets/jonah-testimony-resurrection'
    quote: 'There is no definite physical evidence known at the present time that can either prove or disprove the book of Jonah.'

  # ---- christ ----
  - where: 'christ'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
