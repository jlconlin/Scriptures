chapter: 2
claims:
  - where: 'when'
    claim: 'Jonah lived under Jeroboam II'
    key: bd-jonah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jonah?lang=eng'
    quote: 'He lived under Jeroboam Ⅱ, whose success in restoring the ancient boundaries of Israel he predicted (2 Kgs. 14:25). The present book of Jonah does not claim to be from the hand of the prophet'
  - where: 'when'
    claim: 'Jonah ministered in the mid-eighth century BC'
    key: scripture-helps-amos
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/46-amos-obadiah-jonah?lang=eng'
    quote: 'ministered during the reign of Jeroboam II in the mid-eighth century BC'
  - where: 'setting'
    claim: 'The prayer is a psalm of thanksgiving echoing the Psalms, a symbolic descent into death, which Jesus made a sign'
    key: scripture-helps-amos
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/46-amos-obadiah-jonah?lang=eng'
    quote: 'His prayer is structured as a psalm of thanksgiving, and it echoes numerous themes from the book of Psalms. Jonah described his descent into the sea as a symbolic descent into death. In the New Testament, Jesus Christ pointed to Jonah’s experience as a sign of His own death, burial, and Resurrection.'
  - where: 'setting'
    claim: 'The prayer divides into a confession of being heard (v. 2), two strophes (3–4, 5–7) and a vow of thanksgiving (8–9)'
    key: keil-jonah
    url: 'https://biblehub.com/commentaries/kad/jonah/2.htm'
    quote: 'Commencing with the confession, that the Lord has heard his crying to Him in distress (Jonah 2:2), Jonah depicts in two strophes (Jonah 2:3 and Jonah 2:4, Jonah 2:5-7) the distress into which he had been brought'
  - where: 'thread'
    claim: 'The same Hebrew verb “went down” of 1:3 and 1:5 is used in 2:6'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jonah.xml'
    quote: 'יָרַ֔דְתִּי'
  - where: 'section 1 plain'
    claim: '“Hell” rendered as the world of the dead (Sheol)'
    key: bd-sheol
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sheol?lang=eng'
    quote: 'The Hebrew name for the abode of departed spirits (corresponding to the Greek Hades), translated in the KJV “grave,” “pit,” and “hell,” depending on the context'
  - where: 'section 2 plain'
    claim: 'A modern rendering of verses 3–4'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Jonah%202&version=NRSVUE'
    quote: 'You cast me into the deep, into the heart of the seas, and the flood surrounded me'
  - where: 'section 3 plain'
    claim: '“Corruption” rendered as the pit; “to the soul” as to the point of death'
    key: bdb
    url: 'https://biblehub.com/hebrew/7845.htm'
    quote: 'שַׁ֫חַת noun feminine pit'
  - where: 'section 3 plain'
    claim: 'Even to the soul means to the point of death'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jonah/2?lang=eng'
    quote: 'IE to the point of death.'
  - where: 'section 4 plain'
    claim: 'A modern rendering of verses 8–9'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Jonah%202&version=NRSVUE'
    quote: 'Those who worship vain idols forsake their true loyalty.'
  - where: 'note 2:1 “A thanksgiving prayed inside the fish”'
    claim: 'The prayer is thanksgiving for deliverance already received; Jonah, alive in the fish, took it as a pledge of deliverance'
    key: keil-jonah
    url: 'https://biblehub.com/commentaries/kad/jonah/2.htm'
    quote: 'is not a petition for deliverance, but thanksgiving and praise for deliverance already received'
  - where: 'note 2:1 “A thanksgiving prayed inside the fish”'
    claim: 'Alive in the fish, he regarded this as a pledge of deliverance'
    key: keil-jonah
    url: 'https://biblehub.com/commentaries/kad/jonah/2.htm'
    quote: 'found that he was preserved alive in the fish''s belly, he regarded this as a pledge of his deliverance, for which he praised the Lord'
  - where: 'note 2:1 “A thanksgiving prayed inside the fish”'
    claim: 'He prays to Jehovah as his own God, from whom he had tried to escape'
    key: keil-jonah
    url: 'https://biblehub.com/commentaries/kad/jonah/2.htm'
    quote: 'He prayed not only to Jehovah, as the heathen sailors also did (Jonah 1:14), but to Jehovah as his God, from whom he had tried to escape'
  - where: 'note 2:1 “A thanksgiving prayed inside the fish”'
    claim: 'One reading: the psalm shows he is already out of the fish'
    key: davies-jonah
    url: 'https://rsc.byu.edu/isaiah-prophets/jonah-testimony-resurrection'
    quote: 'his prayer or psalm is uttered in such a way as to show that by this time he is already out of the fish'
  - where: 'note 2:2 “The brother of Jared’s prayer”'
    claim: 'Ether 3:2 may have been modeled after the psalm of Jonah 2'
    key: sc-knowhy-526
    url: 'https://scripturecentral.org/knowhy/how-were-jonah-and-the-brother-of-jared-able-to-find-comfort'
    quote: 'The first verse of this prayer is remarkably similar to Jonah 2, and this verse may have been modeled after the Psalm contained in the chapter.'
  - where: 'note 2:2 “The brother of Jared’s prayer”'
    claim: 'The KnoWhy compares the anger / cast out of sight lines and the dwelling of God'
    key: sc-knowhy-526
    url: 'https://scripturecentral.org/knowhy/how-were-jonah-and-the-brother-of-jared-able-to-find-comfort'
    quote: 'The Brother of Jared asked that God, “not be angry with thy servant because of his weakness before thee” and Jonah expressed concern that he was “cast out of (God’s) sight,”'
  - where: 'note 2:2 “The brother of Jared’s prayer”'
    claim: '“Went down” is sometimes translated “fall”; Ether’s “fall” may interpret Jonah'
    key: sc-knowhy-526
    url: 'https://scripturecentral.org/knowhy/how-were-jonah-and-the-brother-of-jared-able-to-find-comfort'
    quote: 'the Hebrew word translated as “went down” in Jonah 2 is sometimes translated as “fall.” Ether 3’s reference to the “fall” and to our natures becoming evil may then be an interpretation of this passage in Jonah as a reference to the fall.'
  - where: 'note 2:2 “The brother of Jared’s prayer”'
    claim: 'Both prayers speak of the dwelling-place of God'
    key: sc-knowhy-526
    url: 'https://scripturecentral.org/knowhy/how-were-jonah-and-the-brother-of-jared-able-to-find-comfort'
    quote: 'Ether 3 states, “for we know that thou art holy and dwellest in the heavens,” while Jonah 2 states, “I will look again toward thy holy temple."'
  - where: 'note 2:2 “The brother of Jared’s prayer”'
    claim: 'Ether 3 speaks of the Fall'
    key: sc-knowhy-526
    url: 'https://scripturecentral.org/knowhy/how-were-jonah-and-the-brother-of-jared-able-to-find-comfort'
    quote: 'Ether 3 states, “we are unworthy before thee; because of the fall our natures have become evil continually.”'
  - where: 'note 2:2 “The brother of Jared’s prayer”'
    claim: 'The text of Ether 3:2'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/ether/3?lang=eng'
    quote: 'O Lord, thou hast said that we must be encompassed about by the floods. Now behold, O Lord, and do not be angry with thy servant because of his weakness before thee'
  - where: 'note 2:2 “The belly of Sheol”'
    claim: 'Sheol is the abode of departed spirits, rendered grave, pit, hell'
    key: bd-sheol
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sheol?lang=eng'
    quote: 'The Hebrew name for the abode of departed spirits (corresponding to the Greek Hades), translated in the KJV “grave,” “pit,” and “hell,” depending on the context'
  - where: 'note 2:2 “The belly of Sheol”'
    claim: 'A modern translation keeps “Sheol”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Jonah%202&version=NRSVUE'
    quote: 'out of the belly of Sheol I cried'
  - where: 'note 2:2 “The belly of Sheol”'
    claim: 'Sheol means the spirit world'
    key: ot-manual-9
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-9?lang=eng'
    quote: 'His use of hell (sheol in Hebrew, which means the spirit world and is sometimes translated as “grave”) adds to the parallels with Christ’s burial.'
  - where: 'note 2:2 “The belly of Sheol”'
    claim: 'One reading: Jonah was dead and his spirit prayed'
    key: davies-jonah
    url: 'https://rsc.byu.edu/isaiah-prophets/jonah-testimony-resurrection'
    quote: 'Thus, the conclusion elucidated by the Hebrew text, Jonah was dead! In that condition his spirit continued to pray'
  - where: 'note 2:2 “The belly of Sheol”'
    claim: 'KnoWhy: Jonah may be understood to have died and been brought back'
    key: sc-knowhy-652
    url: 'https://scripturecentral.org/knowhy/what-is-the-sign-of-jonah'
    quote: 'We may understand that Jonah, by being swallowed by a great fish, died and was then brought back to life.'
  - where: 'note 2:2 “The belly of Sheol”'
    claim: 'According to the text Jonah is still alive, describing a deathlike experience'
    key: scott-jonah
    url: 'https://byustudies.byu.edu/article/the-book-of-jonah-foreshadowings-of-jesus-as-the-christ'
    quote: 'Though according to the text Jonah is still alive during his three nights and three days in the great fish’s belly of hell, Jonah describes a deathlike experience'
  - where: 'note 2:2 “The belly of Sheol”'
    claim: 'The footnote on “even to the soul” and the cross-reference of “hell” to Alma 36:18'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jonah/2?lang=eng'
    quote: 'IE to the point of death.'
  - where: 'note 2:3 “A prayer in the words of the psalms”'
    claim: 'The prayer is mostly reminiscences of the Psalms, natural to one versed in scripture, not a later production'
    key: keil-jonah
    url: 'https://biblehub.com/commentaries/kad/jonah/2.htm'
    quote: 'The prayer consists for the most part of reminiscences of passages in the Psalms'
  - where: 'note 2:3 “A prayer in the words of the psalms”'
    claim: 'It is the natural utterance of a man versed in scripture'
    key: keil-jonah
    url: 'https://biblehub.com/commentaries/kad/jonah/2.htm'
    quote: 'it is the simple and natural utterance of a man versed in the Holy Scripture and living in the word of God'
  - where: 'note 2:3 “A prayer in the words of the psalms”'
    claim: 'When cast into the deep, he thought himself banished from the Lord’s care'
    key: keil-jonah
    url: 'https://biblehub.com/commentaries/kad/jonah/2.htm'
    quote: '"When Thou castedst me into the deep, then I said (sc., in my heart, i.e., then I thought) that I was banished from the sphere of Thine eyes, i.e., of Thy protection and care."'
  - where: 'note 2:3 “A prayer in the words of the psalms”'
    claim: 'The prayer echoes many psalms'
    key: scripture-helps-amos
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/46-amos-obadiah-jonah?lang=eng'
    quote: 'it echoes numerous themes from the book of Psalms'
  - where: 'note 2:3 “A prayer in the words of the psalms”'
    claim: 'The chapter read: the Lord is the one who cast him, though the sailors threw him (Jonah 1:15)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jonah/2?lang=eng'
    quote: 'Ps. 18:6'
  - where: 'note 2:4 “Looking toward the temple”'
    claim: 'The line expresses confidence he will again worship in the temple'
    key: keil-jonah
    url: 'https://biblehub.com/commentaries/kad/jonah/2.htm'
    quote: 'The thought that it is all over with him is met by the confidence of faith that he will still look to the holy temple of the Lord, that is to say, will once more approach the presence of the Lord, to worship before Him in His temple'
  - where: 'note 2:4 “Looking toward the temple”'
    claim: 'The particle means “nevertheless”; altering it to “how” is unnecessary'
    key: keil-jonah
    url: 'https://biblehub.com/commentaries/kad/jonah/2.htm'
    quote: 'introduces the antithesis in an energetic manner, like אכם elsewhere, in the sense of nevertheless'
  - where: 'note 2:4 “Looking toward the temple”'
    claim: 'The temple of verse 7 is where Jehovah is enthroned'
    key: keil-jonah
    url: 'https://biblehub.com/commentaries/kad/jonah/2.htm'
    quote: 'his prayer reached to God in His holy temple, where Jehovah is enthroned as God and King of His people'
  - where: 'note 2:4 “Looking toward the temple”'
    claim: 'A modern translation makes the line a question'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Jonah%202&version=NRSVUE'
    quote: 'how shall I look again upon your holy temple?'
  - where: 'note 2:4 “Looking toward the temple”'
    claim: 'Jonah, far from the land, prays toward the temple as Solomon asked'
    key: correa-jonah
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/correa/2022-11-23/jonah_micah.pdf'
    quote: 'When Solomon dedicated the temple, he pleaded with the Lord to hear the Israelites prayers if they found themselves far from the land and “if they pray toward this place, and confess thy name, and turn from their sin” (1 Kings 8:35–36). Jonah, at this moment, was far from the promised land.'
  - where: 'note 2:4 “Looking toward the temple”'
    claim: 'The text of 1 Kings 8:35'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/8?lang=eng'
    quote: 'if they pray toward this place, and confess thy name, and turn from their sin, when thou afflictest them'
  - where: 'note 2:6 “Up from the pit”'
    claim: 'The word means a pit; KJV renders it corruption, destruction, ditch, grave, pit'
    key: bdb
    url: 'https://biblehub.com/hebrew/7845.htm'
    quote: 'a pit (especially as a trap); figuratively, destruction -- corruption, destruction, ditch, grave, pit.'
  - where: 'note 2:6 “Up from the pit”'
    claim: 'BDB lists Jonah’s verse and Ps. 16:10 under “pit of Sheol”'
    key: bdb
    url: 'https://biblehub.com/hebrew/7845.htm'
    quote: '2 pit of Sh®°ôl'
  - where: 'note 2:6 “Up from the pit”'
    claim: 'A modern translation: the Pit; roots of the mountains'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Jonah%202&version=NRSVUE'
    quote: 'yet you brought up my life from the Pit'
  - where: 'note 2:6 “Up from the pit”'
    claim: 'Roots of the mountains'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Jonah%202&version=NRSVUE'
    quote: 'at the roots of the mountains'
  - where: 'note 2:6 “Up from the pit”'
    claim: 'The footnote on “brought up”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jonah/2?lang=eng'
    quote: 'TG Jesus Christ, Prophecies about.'
  - where: 'note 2:6 “Up from the pit”'
    claim: 'Peter reads Psalm 16:10 of the Resurrection'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/2?lang=eng'
    quote: 'He seeing this before spake of the resurrection of Christ, that his soul was not left in hell, neither his flesh did see corruption.'
  - where: 'note 2:7 “Alma remembered too”'
    claim: 'The manual compares Jonah 2:7 with Alma 36:18'
    key: ot-manual-9
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-9?lang=eng'
    quote: 'Also compare Jonah 2:7with the language in Alma 36:18.'
  - where: 'note 2:7 “Alma remembered too”'
    claim: 'The parallels between Jonah and Alma'
    key: davies-jonah
    url: 'https://rsc.byu.edu/isaiah-prophets/jonah-testimony-resurrection'
    quote: 'Both men disregarded God as an effective force in their lives (see Alma 36:6; Jonah 1:3, 6). Both refused to “save” the souls of those they were called to serve. Both “died” and were “racked with eternal torment” in “hell.”'
  - where: 'note 2:7 “Alma remembered too”'
    claim: 'Both turned to the Savior and became diligent servants'
    key: davies-jonah
    url: 'https://rsc.byu.edu/isaiah-prophets/jonah-testimony-resurrection'
    quote: 'Both finally turned to the Savior, remembering his power to atone for the sins of mankind. Both became diligent servants for their God'
  - where: 'note 2:7 “Alma remembered too”'
    claim: 'Alma’s three days and three nights; the footnote at 2:2 is Alma 36:18'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/36?lang=eng'
    quote: 'it was for the space of three days and three nights that I could not open my mouth, neither had I the use of my limbs'
  - where: 'note 2:8 “Forsaking their own mercy”'
    claim: 'Of God, ḥesed: He is “their goodness,” citing this verse'
    key: bdb
    url: 'https://biblehub.com/hebrew/2617.htm'
    quote: 'II. of God: kindness, lovingkindness in condescendig to the needs of his creatures. He is חַסְדָּם their goodness favour Jonah 2:9'
  - where: 'note 2:8 “Forsaking their own mercy”'
    claim: 'A modern translation of the line'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Jonah%202&version=NRSVUE'
    quote: 'Those who worship vain idols forsake their true loyalty.'
  - where: 'note 2:8 “Forsaking their own mercy”'
    claim: 'Elder Holland on ḥesed'
    key: holland-forsake-mercy
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2025/10/53holland?lang=eng'
    quote: 'Doing these things brings a vision of God’s special covenantal love for you—what the Hebrew Bible calls hesed.'
  - where: 'note 2:8 “Forsaking their own mercy”'
    claim: 'Elder Holland on “own” mercy and the lying vanities of the adversary'
    key: holland-forsake-mercy
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2025/10/53holland?lang=eng'
    quote: 'He offers it to you as your “own,” meaning it is perfectly suited to you, designed to relieve your individual agonies and heal your particular pains.'
  - where: 'note 2:8 “Forsaking their own mercy”'
    claim: 'The lying vanities of the adversary'
    key: holland-forsake-mercy
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2025/10/53holland?lang=eng'
    quote: 'Start by refusing to listen to the “lying vanities” of the adversary, who would tempt you into thinking that relief is found in sailing away from your spiritual responsibilities.'
  - where: 'note 2:9 “Salvation is of the LORD”'
    claim: 'The manual reads the vow as fulfilling his mission'
    key: ot-manual-9
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-9?lang=eng'
    quote: 'Jonah’s vow to “pay that that I have vowed” was his way of saying he would fulfill the mission given him'
  - where: 'note 2:9 “Salvation is of the LORD”'
    claim: 'A modern translation of the last line'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Jonah%202&version=NRSVUE'
    quote: 'Deliverance belongs to the Lord!'
  - where: 'note 2:9 “Salvation is of the LORD”'
    claim: 'Jonah declared Jehovah the Savior; the words look to His triumph'
    key: scott-jonah
    url: 'https://byustudies.byu.edu/article/the-book-of-jonah-foreshadowings-of-jesus-as-the-christ'
    quote: 'he powerfully declared that the Lord Jehovah is the ultimate Savior of humankind: “Salvation is of the Lord” (2:9). These words of Jonah look to Jehovah’s triumph over the grave and sin, bringing salvation to all people.'
  - where: 'note 2:9 “Salvation is of the LORD”'
    claim: 'The Old Testament Jehovah is the premortal Jesus'
    key: scott-jonah
    url: 'https://byustudies.byu.edu/article/the-book-of-jonah-foreshadowings-of-jesus-as-the-christ'
    quote: 'readers may find it enlightening to remember that the Old Testament Jehovah is the premortal Jesus.'
  - where: 'note 2:9 “Salvation is of the LORD”'
    claim: 'The footnote on Salvation; the text of the verse'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jonah/2?lang=eng'
    quote: 'TG Salvation.'
  - where: 'christ'
    claim: 'Coming forth on the third day is widely embraced as a type of Jesus'
    key: scott-jonah
    url: 'https://byustudies.byu.edu/article/the-book-of-jonah-foreshadowings-of-jesus-as-the-christ'
    quote: 'This coming forth alive on the third day is widely embraced as a type of Jesus, who came forth from the sepulcher reunited with his body'
  - where: 'christ'
    claim: 'Jonah may be a flawed symbol; his witness from the fish is poignant'
    key: holland-forsake-mercy
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2025/10/53holland?lang=eng'
    quote: 'As a symbol of the Savior’s sacrificial death and glorious Resurrection, Jonah may be flawed. But this is also what makes his personal witness of and commitment to Jesus Christ, offered in the belly of the whale, so poignant and inspiring.'
  - where: 'christ'
    claim: 'The sign of Jonah, the living Christ'
    key: holland-forsake-mercy
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2025/10/53holland?lang=eng'
    quote: 'Look to the sign of Jonah, the living Christ, He who rose from His three-day grave having conquered all—for you.'
  - where: 'christ'
    claim: 'Access to divine help despite human flaws, for one sinking in deep waters'
    key: holland-forsake-mercy
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2025/10/53holland?lang=eng'
    quote: 'that you are cast off, sinking in deepest waters, with seaweed wrapped about your head and oceanic mountains crashing all around you—my plea, inspired by Jonah, is forsake not your own mercy. You have immediate access to divine help and healing despite your human flaws.'
  - where: 'christ'
    claim: 'The Saviour’s words in Matthew 12:40'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/12?lang=eng'
    quote: 'For as Jonas was three days and three nights in the whale’s belly; so shall the Son of man be three days and three nights in the heart of the earth.'
  - where: 'explore'
    claim: 'D&C 122:7 compared with Jonah 2:3–5'
    key: ot-manual-9
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-9?lang=eng'
    quote: 'The language of Jonah’s prayer (see Jonah 2:3–5) and the language the Lord used with the Prophet Joseph Smith while he was imprisoned in Liberty Jail (see D&C 122:7) are similar'
  - where: 'explore'
    claim: 'The text of D&C 122:7'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/122?lang=eng'
    quote: 'if thou be cast into the deep; if the billowing surge conspire against thee'
