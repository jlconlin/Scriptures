chapter: 4
claims:
  # ---- when / setting / thread ----
  - where: 'when'
    claim: 'Jonah ministered under Jeroboam II in the mid-eighth century B.C.'
    key: scripture-helps-amos
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/46-amos-obadiah-jonah?lang=eng'
    quote: 'Jonah was a prophet from the northern territory of Zebulun who ministered during the reign of Jeroboam II in the mid-eighth century BC.'
  - where: 'when'
    claim: 'The book does not claim to be by the prophet'
    key: bd-jonah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jonah?lang=eng'
    quote: 'The present book of Jonah does not claim to be from the hand of the prophet; it describes an episode in his life and is due to some later writer.'
  - where: 'setting'
    claim: 'Nineveh was Israel’s enemy, known for violence and cruelty'
    key: cfm-ot-2026-48
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/48?lang=eng'
    quote: 'Nineveh was an enemy of Israel known for its violence and cruelty.'
  - where: 'setting'
    claim: 'The key to the book is in 3:10–4:11, in Jonah’s reasons for his flight; the writer opposes a narrowmindedness that confines God’s love to one nation'
    key: bd-jonah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jonah?lang=eng'
    quote: 'The key to the book is to be found in Jonah 3:10–4:11 in the reasons the prophet gives for his flight and unwillingness to preach at Nineveh. The writer is opposing a narrowmindedness that would confine the love of God to a single nation.'
  - where: 'setting'
    claim: 'Jonah has been read as standing for Israel fleeing its mission'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'Jonah represents, in a sense, the whole Israelite people, who were trying to flee from their appointed mission.'
  - where: 'thread'
    claim: 'The abrupt ending contrasts Jonah’s cares with the Lord’s and reveals the main message'
    key: scott-jonah
    url: 'https://byustudies.byu.edu/article/the-book-of-jonah-foreshadowings-of-jesus-as-the-christ'
    quote: 'This abrupt ending with a sharp contrasting image between Jonah’s cares and those of his Lord reveals the story’s main message.'
  - where: 'thread'
    claim: 'The history breaks off with God’s words, to which Jonah could make no reply; the object was to show the Lord’s compassion'
    key: keil-jonah
    url: 'https://biblehub.com/commentaries/kad/jonah/4.htm'
    quote: 'The history, therefore, breaks off with these words of God, to which Jonah could make no reply, because the object of the book was now attained, - namely, to give the Israelites an insight into the true nature of the compassion of the Lord'
  - where: 'thread'
    claim: 'The same Hebrew verb is used of Jonah (4:10) and of God (4:11)'
    key: bdb
    url: 'https://biblehub.com/hebrew/2347.htm'
    quote: 'b. of God חוסה על Nehemiah 13:22; Joel 2:17; לא אחוס על נינוה Jonah 4:11'

  # ---- note 4:1 ----
  - where: 'note 4:1 “Displeased: it was evil to Jonah”'
    claim: 'The Hebrew of 4:1 is a verb and a noun of the root for evil'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jonah.xml'
    quote: 'רָעָ֣ה גְדוֹלָ֑ה'
  - where: 'note 4:1 “Displeased: it was evil to Jonah”'
    claim: 'It was evil for Jonah; it vexed him, not merely displeased; “a great evil” strengthens it; the usual idiom adds “in his eyes”'
    key: keil-jonah
    url: 'https://biblehub.com/commentaries/kad/jonah/4.htm'
    quote: 'ויּרע אל י, it was evil for Jonah, i.e., it vexed, irritated him, not merely it displeased him, for which ירע בּעיניו is generally used. … רעה גדולה, "a great evil," serves simply to strengthen the idea of ירע.'
  - where: 'note 4:1 “Displeased: it was evil to Jonah”'
    claim: 'The lexicon lists the verb as “be displeasing,” Jonah 4:1 intensified by “great evil”'
    key: bdb
    url: 'https://biblehub.com/hebrew/7489.htm'
    quote: '1 be displeasing: רַע בְּעֵינֵי … later, וַיֵּרַעאֶל Jonah 4:1 or וירעלְ Nehemiah 2:10 (intensified by רָעָה גְרוֺלֶה)'
  - where: 'note 4:1 “Displeased: it was evil to Jonah”'
    claim: 'Jonah 3:10 has the same noun for Nineveh’s evil way and the evil God turned from'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jonah.xml'
    quote: 'הָ/רָעָ֛ה'

  # ---- note 4:2 ----
  - where: 'note 4:2 “The reason Jonah fled”'
    claim: 'Jonah is quoting Exodus 34:6'
    key: davies-jonah
    url: 'https://rsc.byu.edu/isaiah-prophets/jonah-testimony-resurrection'
    quote: 'I knew that thou art “a god gracious and compassionate, long-suffering and ever constant, and willing to turn away the disaster” [here he is quoting Exodus 34:6].'
  - where: 'note 4:2 “The reason Jonah fled”'
    claim: 'Jonah’s problem was not cowardice but resentment that the enemy was given a chance to repent'
    key: ot-manual-9
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-9?lang=eng'
    quote: 'But Jonah’s problem does not seem to be cowardice. Rather, it seems to have been resentment against the Lord for giving the hated enemy a chance to repent (see Jonah 4:1–2.)'
  - where: 'note 4:2 “The reason Jonah fled”'
    claim: 'The flight was motivated by angry refusal to accept that God would accept Gentiles; 4:1–2 gives the motive for the flight and the anger'
    key: scott-jonah
    url: 'https://byustudies.byu.edu/article/the-book-of-jonah-foreshadowings-of-jesus-as-the-christ'
    quote: 'The Israelite Jonah’s attempted flight from the Lord (Jonah 1:3) was motivated by his angry refusal to accept that God in his kindness and mercy would accept Gentiles into his kingdom (4:1, 4, 9).'
  - where: 'note 4:2 “The reason Jonah fled”'
    claim: 'Jonah fled to escape contact with the hated Assyrians; most Israelites held bitter feelings against them'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'he fled in the opposite direction to escape contact with the hated Assyrians. As with most Israelites in the eighth century BC, Jonah evidently held deep and bitter feelings against Israel’s enemy.'

  # ---- note 4:3 ----
  - where: 'note 4:3 “Jonah and Elijah ask to die”'
    claim: 'Jonah’s cry sounds like Elijah’s when he felt he had failed'
    key: davies-jonah
    url: 'https://rsc.byu.edu/isaiah-prophets/jonah-testimony-resurrection'
    quote: 'This last statement sounds almost like the cry of Elijah when he felt he had failed in his mission (see 1 Kings 19).'
  - where: 'note 4:3 “Jonah and Elijah ask to die”'
    claim: 'Elijah wished to die from despair at apparent failure; Jonah because God had not carried out His threat'
    key: keil-jonah
    url: 'https://biblehub.com/commentaries/kad/jonah/4.htm'
    quote: 'In the inward conflict that had come upon Elijah he wished for death, because he did not see the expected result of his zeal for the Lord of Sabaoth; in other words, it was from spiritual despair, caused by the apparent failure of his labours. Jonah, on the other hand, did not wish to live any longer, because God had not carried out His threat against Nineveh.'
  - where: 'note 4:3 “Jonah and Elijah ask to die”'
    claim: 'Elijah’s request to die (1 Kings 19:4)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/19?lang=eng'
    quote: 'and he requested for himself that he might die; and said, It is enough; now, O Lord, take away my life; for I am not better than my fathers.'

  # ---- note 4:4 ----
  - where: 'note 4:4 “Is it right to be angry?”'
    claim: 'A modern translation renders the question “Is it right for you to be angry?” and Jonah’s answer “angry enough to die”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Jonah%204&version=NRSVUE'
    quote: '4 And the Lord said, “Is it right for you to be angry?” … 9 But God said to Jonah, “Is it right for you to be angry about the bush?” And he said, “Yes, angry enough to die.”'
  - where: 'note 4:4 “Is it right to be angry?”'
    claim: 'The Lord’s question in 4:4 and 4:9 and Jonah’s answer in 4:9 use the same two Hebrew words'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jonah.xml'
    quote: 'הֵיטֵ֥ב חָֽרָה'

  - where: 'note 4:4 “Is it right to be angry?”'
    claim: 'The lexicon renders the question of 4:4, 9 “art thou rightly angry?”, the infinitive used as an adverb'
    key: bdb
    url: 'https://biblehub.com/hebrew/3190.htm'
    quote: 'so infinitive absolute as adverb הַהֵיטֵב חָרָה לך Jonah 4:4,9 art thou rightly angry ?'
  - where: 'note 4:4 “Is it right to be angry?”'
    claim: 'The question is the Lord’s rebuke (chapter heading)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jonah/4?lang=eng'
    quote: 'The Lord rebukes him'

  # ---- note 4:5 ----
  - where: 'note 4:5 “What Jonah waited for”'
    claim: 'Reading 4:5 as a pluperfect (before the forty days) is grammatically admissible but improbable'
    key: keil-jonah
    url: 'https://biblehub.com/commentaries/kad/jonah/4.htm'
    quote: 'We grant that this is grammatically admissible, but it cannot be shown to be necessary, and is indeed highly improbable. If, for instance, Jonah went out of Nineveh before the expiration of the forty days … he could not have been angry at its non-fulfilment before the time arrived'
  - where: 'note 4:5 “What Jonah waited for”'
    claim: 'Jonah took the judgment as postponed, not removed'
    key: keil-jonah
    url: 'https://biblehub.com/commentaries/kad/jonah/4.htm'
    quote: 'Jonah interpreted it in harmony with his own inclination, as signifying that the judgment was only postponed, not removed, and therefore resolved to wait in a hut outside the city'
  - where: 'note 4:5 “What Jonah waited for”'
    claim: 'Jonah waited hoping God would still destroy the repentant city'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'He went to the eastern edge of the city, built a booth, sat under it, and waited in hopes that God would still destroy the repentant inhabitants of Nineveh.'

  # ---- note 4:6 ----
  - where: 'note 4:6 “The gourd”'
    claim: 'The lexicon: usually ricinus (castor-oil tree), perhaps bottle-gourd as in the Greek, a vine growing and withering rapidly'
    key: bdb
    url: 'https://biblehub.com/hebrew/7021.htm'
    quote: 'usually ricinus (R. communis, Linn. = castor-oil tree … perhaps < bottle-gourd (ᵐ5 κολόκυνθα; i.e. cucurbita lagenaria, a vine growing and withering rapidly'
  - where: 'note 4:6 “The gourd”'
    claim: 'The word occurs only in Jonah 4'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jonah.xml'
    quote: 'קִיקָי֞וֹן'
  - where: 'note 4:6 “The gourd”'
    claim: 'The lexicon’s entry lists only Jonah 4'
    key: bdb
    url: 'https://biblehub.com/hebrew/7021.htm'
    quote: 'Jonah 4:6 (twice in verse); Jonah 4:7,9,10.'
  - where: 'note 4:6 “The gourd”'
    claim: 'A modern translation has “appointed a bush”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Jonah%204&version=NRSVUE'
    quote: '6 The Lord God appointed a bush and made it come up over Jonah, to give shade over his head, to save him from his discomfort'
  - where: 'note 4:6 “The gourd”'
    claim: '“Prepared” is the same Hebrew verb in 1:17 and 4:6–8'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jonah.xml'
    quote: 'וַ/יְמַ֣ן'
  - where: 'note 4:6 “The gourd”'
    claim: '“Grief” in 4:6 is the noun of 4:1 (H7451), “his evil”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jonah.xml'
    quote: 'מֵ/רָֽעָת֑/וֹ'

  # ---- note 4:8 ----
  - where: 'note 4:8 “The east wind”'
    claim: 'A modern translation has “sultry east wind”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Jonah%204&version=NRSVUE'
    quote: '8 When the sun rose, God prepared a sultry east wind, and the sun beat down on the head of Jonah so that he was faint'
  - where: 'note 4:8 “The east wind”'
    claim: 'In Israel the east wind came from the Arabian Desert, hot and dry, and was viewed as an instrument of God’s judgment'
    key: sc-knowhy-560
    url: 'https://scripturecentral.org/knowhy/why-did-abinadi-warn-the-people-of-an-east-wind'
    quote: 'the “east wind” was sometimes called “the wind of the Lord” (see Hosea 13:15) because it was “viewed as an instrument of God’s judgment.” In Israel, the wind from the east (or southeast) originates from the Arabian Desert and is insufferably hot and dry'
  - where: 'note 4:8 “The east wind”'
    claim: 'Biblical writers used the east wind as a sign of judgment for other regions; in Assyria it would bring rain'
    key: sc-knowhy-560
    url: 'https://scripturecentral.org/knowhy/why-did-abinadi-warn-the-people-of-an-east-wind'
    quote: 'biblical writers used the “east wind” as a sign of divine judgment when talking about other regions of the ancient Near East as well. Hence, God sends a “vehement east wind” … but in reality, an east wind would typically bring refreshing rains in Assyria.'
  - where: 'note 4:8 “The east wind”'
    claim: 'Abinadi warned of the east wind as the Lord’s judgment'
    key: sc-knowhy-560
    url: 'https://scripturecentral.org/knowhy/why-did-abinadi-warn-the-people-of-an-east-wind'
    quote: 'Abinadi stood firmly within Old Testament prophetic tradition, likely accessed by the Lehites through the Plates of Brass, when he warned that the Lord’s judgment was coming like the “east wind” (Mosiah 7:31; 12:6).'

  # ---- note 4:10 ----
  - where: 'note 4:10 “Pity and spare: one verb”'
    claim: 'The verb means to pity, have compassion, spare'
    key: bdb
    url: 'https://biblehub.com/hebrew/2347.htm'
    quote: 'chus: To pity, to have compassion, to spare'
  - where: 'note 4:10 “Pity and spare: one verb”'
    claim: 'The lexicon lists 4:11 under God’s pity and 4:10 under man’s (Jonah)'
    key: bdb
    url: 'https://biblehub.com/hebrew/2347.htm'
    quote: 'b. of God חוסה על Nehemiah 13:22; Joel 2:17; לא אחוס על נינוה Jonah 4:11 … c. of man: … Jonah, על הקיקיון Jonah 4:10.'
  - where: 'note 4:10 “Pity and spare: one verb”'
    claim: 'The Hebrew of 4:10 and 4:11 has the one verb'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jonah.xml'
    quote: 'חַ֨סְתָּ֙ … אָח֔וּס'
  - where: 'note 4:10 “Pity and spare: one verb”'
    claim: 'A modern translation keeps one word, “concerned,” in both verses'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Jonah%204&version=NRSVUE'
    quote: '10 Then the Lord said, “You are concerned about the bush, for which you did not labor and which you did not grow; it came into being in a night and perished in a night. 11 And should I not be concerned about Nineveh'
  - where: 'note 4:10 “Pity and spare: one verb”'
    claim: 'The gourd exposed Jonah’s misplaced priorities; the Lord cared for Nineveh even if Jonah did not'
    key: scripture-helps-amos
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/46-amos-obadiah-jonah?lang=eng'
    quote: 'Jonah’s reaction to the withered gourd exposed his misplaced priorities—he showed more concern for a plant that gave him temporary comfort than for an entire city of people. Through the plant, the Lord reminded Jonah that He cared for the people of Nineveh, even if Jonah did not.'

  # ---- note 4:11 right hand ----
  - where: 'note 4:11 “Those who cannot tell right from left”'
    claim: 'The Bible Dictionary speaks of God pitying the little children of Nineveh'
    key: bd-jonah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jonah?lang=eng'
    quote: 'the divine tenderness in ministering to the prophet with his imperfect conceptions or in pitying the little children of Nineveh.'
  - where: 'note 4:11 “Those who cannot tell right from left”'
    claim: 'The Student Manual reads it of the city’s people, ignorant of the saving gospel principles'
    key: ot-manual-9
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-9?lang=eng'
    quote: 'Because the thousands who lived in Nineveh were ignorant of the saving gospel principles, they could not fully “discern between their right hand and their left hand” (Jonah 4:11).'
  - where: 'note 4:11 “Those who cannot tell right from left”'
    claim: 'All will be judged, whether accountable or innocent'
    key: scott-jonah
    url: 'https://byustudies.byu.edu/article/the-book-of-jonah-foreshadowings-of-jesus-as-the-christ'
    quote: 'All will eventually be judged, whether accountable or considered innocent (that is, unable to “discern between their right hand and their left hand”).'
  - where: 'note 4:11 “Those who cannot tell right from left”'
    claim: 'Sixscore thousand is more than a hundred and twenty thousand'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Jonah%204&version=NRSVUE'
    quote: 'in which there are more than a hundred and twenty thousand persons who do not know their right hand from their left and also many animals?'

  # ---- note 4:11 cattle ----
  - where: 'note 4:11 “And also much cattle”'
    claim: 'The Lord wants to save the cattle too; the welfare of all God’s creations matters'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'This point is accentuated by the Lord’s proclaiming that He not only wants to save the people of Nineveh, He also wants to save their cattle! In other words, the spiritual and temporal welfare of all God’s creations matter.'
  - where: 'note 4:11 “And also much cattle”'
    claim: 'The question teaches the worth of souls (D&C 18:10)'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'By recording this question, Jonah teaches his contemporaries and latter-day readers that the worth of souls is great in the sight of God (see D&C 18:10, 15–16).'

  # ---- christ / explore ----
  - where: 'christ'
    claim: 'The Lord God of Jonah is Jehovah of both testaments, the Savior of all the world'
    key: scott-jonah
    url: 'https://byustudies.byu.edu/article/the-book-of-jonah-foreshadowings-of-jesus-as-the-christ'
    quote: 'He is the Lord God, the great Jehovah, of both the Old and New Testament, and as Jonah declared, the Savior of all the world.'
  - where: 'christ'
    claim: 'Jonah had benefited from the mercy he resented in Nineveh’s case'
    key: scripture-helps-amos
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/46-amos-obadiah-jonah?lang=eng'
    quote: 'Although Jonah had personally benefited from the Lord’s mercy and kindness, he resented these same qualities when the Lord spared the people of Nineveh.'
  - where: 'christ'
    claim: 'God teaches Jonah that He loves and seeks to rescue all His children'
    key: holland-forsake-mercy
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2025/10/53holland?lang=eng'
    quote: 'Yet, when the city repents and is spared destruction, Jonah resents the mercy shown his enemies. God patiently teaches Jonah that He loves and seeks to rescue all His children.'
  - where: 'christ'
    claim: 'The Church’s footnote to “spare” in 4:11 cross-references 2 Ne. 26:33'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jonah/4?lang=eng'
    quote: '2 Ne. 26:33'
  - where: 'explore'
    claim: 'The parable of the laborers set beside Jonah’s anger'
    key: scott-jonah
    url: 'https://byustudies.byu.edu/article/the-book-of-jonah-foreshadowings-of-jesus-as-the-christ'
    quote: 'Jonah’s view that Gentiles were unworthy of a chance for eternal reward is reflected in the anger of first-hour laborers Jesus taught about in his New Testament parable of the laborers.'
  - where: 'explore'
    claim: 'Jonah’s attitude compared with the sons of Mosiah'
    key: cfm-ot-2026-48
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/48?lang=eng'
    quote: 'It might be interesting to compare Jonah’s attitude (see Jonah 1; 3–4) to the feelings of Alma and the sons of Mosiah (see Mosiah 28:1–5; Alma 17:23–25).'
