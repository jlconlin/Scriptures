  - **Joel’s call and Nineveh’s answer.** [[Joel 2:12–14]], read beside verses 5–9.
  - **The Saviour’s use of the chapter.** [[Matt. 12:38–41]]; [[Luke 11:29–32]].
  - **Nineveh’s end.** [[Nahum 3:1–7]].

