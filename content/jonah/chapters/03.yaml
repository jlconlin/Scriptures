chapter: 3
title: The People of Nineveh Believed God
tagline: Called a second time, Jonah goes to Nineveh and announces its overthrow in forty days. The whole city fasts, from the king to the cattle, and turns from its violence, and God spares it.
when: 'The prophet lived under Jeroboam II of Israel, in the mid-eighth century B.C.; the book does not say when it was written'

setting: |
  Chapter 3 begins the second half of the book. “The word of the LORD came unto Jonah the second time” repeats the call of [[Jonah 1:1–2]], and the Lord’s mercy repeats with it: the mariners cried to the Lord and He saved them from death at sea, and the people of Nineveh turned from their evil ways and He spared them. The note on [[Jonah 1:2]] introduces Nineveh, and the guide [Two Kingdoms and Assyria](/old-testament/guides/two-kingdoms-and-assyria/#nations) gives the empire’s history.

  No record outside the Bible tells of the city’s repentance: “This account of total conversion of Nineveh is not verified in ancient historical records.” The king of Nineveh is never named. Both points have been raised against the story’s history; chapter 1’s setting says how the book is read ([[Jonah 1]]).

  Nineveh’s reprieve did not last. The prophet Nahum spoke against it ([[Nahum 1:1]]), and the city “fell at the downfall of the Assyrian empire.”

  The Joseph Smith Translation changes verses 9 and 10; the notes there give its readings.

thread: |
  The chapter turns on one word, and the English keeps it: “turn.” Jonah, called a second time, goes. His sermon is five words in Hebrew and offers no way out, yet the city answers it with a turning it never asked for. The people believe, fast and put on sackcloth “from the greatest of them even to the least of them,” and the king comes down from his throne to sit in ashes. His decree sets the turnings side by side: let them “turn every one from his evil way,” and perhaps God “will turn and repent, and turn away from his fierce anger.” In verse 10 both happen. “They turned from their evil way,” and God “did it not.”

  The Ninevites speak only of “God,” never of the LORD by name, and they have no promise to rely on; the king can say only “Who can tell.” They turn anyway. Jonah had fled at the Lord’s first word; the people of Nineveh repented the first time they heard His message. The chapter ends with the city spared and says nothing of how Jonah took it. That waits for chapter 4.

sections:
  - range: 1-4
    heading: The second call
    plain: |
      The word of the LORD came to Jonah a second time: “Get up, go to Nineveh, that great city, and proclaim to it the message I give you.” So Jonah got up and went to Nineveh, as the LORD had told him. Nineveh was an exceedingly great city, a journey of three days. Jonah went a day’s journey into the city and called out, “Forty days more, and Nineveh will be overthrown.”
  - range: 5-9
    heading: The city repents
    plain: |
      The people of Nineveh believed God. They proclaimed a fast and put on sackcloth, from the greatest of them to the least. When the news reached the king of Nineveh, he rose from his throne, took off his robe, covered himself with sackcloth and sat in ashes. He had it proclaimed through Nineveh, by decree of the king and his nobles: “No one, man or beast, herd or flock, is to taste anything. They are not to graze or drink water. Let man and beast be covered with sackcloth and cry to God with all their strength. Let every one turn from his evil way and from the violence in his hands. Who knows? God may turn and relent, and turn away from His fierce anger, so that we do not perish.”
  - range: 10-10
    heading: God spares the city
    plain: |
      God saw what they did, that they turned from their evil way. And God relented of the evil He had said He would bring on them, and He did not do it.

notes:
  - ref: 1
    phrase: came unto Jonah the second time
    kind: scripture
    title: The second time
    body: |
      The Lord calls Jonah again in nearly the words of the first call, but the charge is different. At [[Jonah 1:2]] the Lord said, “cry against it; for their wickedness is come up before me.” Now He says, “preach unto it the preaching that I bid thee” (verse 2). The reason is no longer given, the words of the message are left to the Lord, and this time Jonah goes “according to the word of the LORD” (verse 3).

      “Being merciful to His servant, the Lord gave Jonah a second chance.” He “mercifully orchestrated his delivery to Nineveh in the belly of a great fish and gave him a second chance to fulfill his mission.” The second call is mercy to the prophet as well as to the city: “the Lord hadn’t given up on Jonah—just as He hadn’t given up on the people of Nineveh.” The chapter does not say that Jonah’s feelings about Nineveh have changed, and chapter 4 shows that they have not ([[Jonah 4:1–3]]). He “could not let go of his hatred of Assyrians.”
    sources: [lds-scriptures, correa-jonah, vandyke-ogden-twelve, cfm-ot-2026-48]

  - ref: 3
    phrase: an exceeding great city of three days’ journey
    kind: history
    title: A city great to God
    body: |
      Where the King James has “an exceeding great city,” the Hebrew reads “great city to God,” and the phrase can be read two ways. It can be an idiom of size, a way of saying “exceeding great,” as the note on [[Gen. 10:9]] explains. It can also be read as God’s own estimate: “it was regarded by God as a great city,” a remark that “points to the motive for sparing it.” On that reading the phrase looks ahead to the Lord’s last words in the book: “should not I spare Nineveh, that great city” ([[Jonah 4:11]]).

      “Three days’ journey” means, by the footnote, a journey “through greater Nineveh with its environs,” the city with the country around it. Archaeologists find ancient Nineveh “nowhere near ‘three days’ journey’ in size.” At its height, “in the 7th century bce,” it “covered no less than 750 hectares,” nearly three square miles. The book does not ask for the arithmetic.
    sources: [lds-scriptures, keil-jonah, scott-jonah, uriona-assyria]

  - ref: 4
    phrase: Yet forty days, and Nineveh shall be overthrown
    kind: words
    title: Overthrown
    body: |
      Jonah’s whole recorded sermon is five words in Hebrew, and it offers no way out. It names no sin, makes no call to repent and sets no condition; it does not even name the Lord. The last word is the verb used of Sodom and Gomorrah, when the Lord “overthrew those cities, and all the plain” ([[Gen. 19:25]]).

      It was not carried out, and verse 10 says why. The note on [[Isa. 38:5]] gives another sentence the Lord revised.
    sources: [oshb-wlc, bdb]

  - ref: 5
    phrase: the people of Nineveh believed God
    kind: scripture
    title: The men of Nineveh in the Saviour’s words
    body: |
      The Saviour held up this verse as a judgment on His own hearers: “The men of Nineveh shall rise in judgment with this generation, and shall condemn it: because they repented at the preaching of Jonas; and, behold, a greater than Jonas is here” ([[Matt. 12:41]]): repentant Nineveh became “a sign to the Jews.” The sign of Jonah’s three days is explained at [[Jonah 1:17]].

      What moved the city the text does not say. “Why a non-Hebrew people would believe a Hebrew prophet one can only conjecture.” Perhaps they were struck by “a foreigner who, apparently without thought of personal safety, would come such a distance to unveil the sins of a people he did not know.” The turning runs “from the greatest of them even to the least of them.” A whole city turning to God has been read as a foreshadowing of the day when “every knee shall bow, and every tongue shall confess” ([[D&C 88:104]]).
    sources: [lds-scriptures, bd-nineveh, ot-manual-9, scott-jonah]

  - ref: 6
    phrase: covered him with sackcloth, and sat in ashes
    kind: symbol
    title: Sackcloth and ashes
    body: |
      The king takes on the signs of mourning, which here also show repentance. Sackcloth was “a coarse, dark cloth made of hair of camels and goats.” It was the custom for mourners “either to sprinkle ashes upon themselves or to sit in piles of ashes, thereby showing their joy had perished or been destroyed.” With fasting and prayer, “sackcloth and ashes … became a symbol of the most sincere and humble repentance.”

      Stepping down from the throne and laying aside the royal robe are signs of “the deepest mourning,” as Job “sat down among the ashes” ([[Job 2:8]]). Ezekiel pictures the princes of Tyre the same way when their city falls: they “come down from their thrones, and lay away their robes” ([[Ezek. 26:16]]). Nineveh’s king mourns a fall that has not yet come, in the hope that it will not.
    sources: [ot-manual-9, keil-jonah]

  - ref: 7
    phrase: Let neither man nor beast, herd nor flock, taste any thing
    kind: history
    title: Even the cattle fast
    body: |
      The king’s decree takes in the animals, and the book keeps them in view to its last verse. Herds and flocks are to go without food and water and to be “covered with sackcloth” with their owners (verse 8). One nineteenth-century commentary finds the custom of animals sharing in mourning in Herodotus: the Persians, “when mourning for their general, Masistios,” “shaved off the hair from their horses.” It has been explained by the thought “that just as the animals which live with man are drawn into fellowship with his sin, so their sufferings might also help to appease the wrath of God.”

      The book does not forget them. The Lord’s last words count them among those He would spare: “and also much cattle” ([[Jonah 4:11]]).
    sources: [keil-jonah]

  - ref: 8
    phrase: the violence that is in their hands
    kind: history
    title: The violence that is in their hands
    body: |
      The king himself names the city’s sin: Nineveh was “an enemy of Israel known for its violence and cruelty,” and the note on [[Jonah 1:2]] describes what the Assyrians did to captives.

      The decree asks for more than fasting. Sackcloth and crying out are to go with a change of conduct: “let them turn every one from his evil way.” Verse 10 says that this, the turning, is what God saw.
    sources: [cfm-ot-2026-48]

  - ref: 9
    phrase: Who can tell if God will turn and repent
    kind: scripture
    title: Who can tell?
    body: |
      The king does not know whether repentance will be enough, and he says so. “Who can tell” is in Hebrew “who knows,” and Joel uses the same Hebrew words for the same hope: “Who knoweth if he will return and repent, and leave a blessing behind him” ([[Joel 2:14]]). The note on [[Joel 2:13]] sets the two side by side. Jonah gave the city no promise, and it turns from its evil on the chance of mercy alone.

      The Joseph Smith Translation moves the repenting from God to the people: “we will repent, and turn unto God, but he will turn away from us his fierce anger.” In that reading the verse holds both halves of the next one. The people turn, and God turns from His anger.
    sources: [biblehub-interlinear, oshb-wlc, lds-scriptures]

  - ref: 10
    phrase: God repented of the evil, that he had said that he would do unto them
    kind: words
    title: God relented
    body: |
      “God repented” means that He held back the judgment He had announced, not that He had done wrong. The Hebrew verb is *nāḥam*, used here, as in Jeremiah and Joel, of repenting “for ill done to others,” and the Church’s footnote on the same verb at [[Jonah 4:2]] gives “HEB relentest.” “The evil” is the disaster threatened, not a sin (see the note on [[Isa. 45:7]]). The notes on [[Joel 2:13]], [[Amos 7:3]] and [[Jer. 18:8]] say more about the verb.

      The Joseph Smith Translation again gives the repenting to the people: “evil way and repented; and God turned away the evil that he had said he would bring upon them.” The Lord stated the principle through Jeremiah: “If that nation, against whom I have pronounced, turn from their evil, I will repent of the evil that I thought to do unto them” ([[Jer. 18:8]]). In this dispensation He says that He revokes as well as commands: “I, the Lord, command and revoke, as it seemeth me good” ([[D&C 56:4]]). Jonah’s sentence had no condition in it, and the condition held all the same.

      Jonah had known it could end this way. He “knew that God could revoke the calamity decreed, but expected He would do so even without the repentance of the people,” and chapter 4 opens with his complaint that the Lord is one who “repentest thee of the evil” ([[Jonah 4:2]]).
    sources: [bdb, lds-scriptures]

christ: |
  The Saviour made Nineveh part of His own sign: “as Jonas was a sign unto the Ninevites, so shall also the Son of man be to this generation” ([[Luke 11:30]]). Jonah’s preaching to a Gentile city has been read as a type of “the preaching of the gospel of peace to the whole world” that Jesus began, and Jonah himself as a type of “the need to take advantage of the Atonement through repentance.” Nineveh had only a warning and a hope, and when it turned, God “turned away the evil that he had said he would bring upon them” (JST, Jonah 3:10).

  The disciple who turns from an evil way is met as Nineveh was, by a Lord who says of the soul that repents, “how great is his joy” ([[D&C 18:13]]).

explore: |
