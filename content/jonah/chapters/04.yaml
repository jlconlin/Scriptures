chapter: 4
title: Should Not I Spare Nineveh?
tagline: Nineveh is spared, and Jonah is angry. He says at last why he ran, asks to die, and sits outside the city to watch it. The Lord grows a gourd over him, withers it, and asks why He should not spare a great city.
when: 'The prophet lived under Jeroboam II of Israel, in the mid-eighth century B.C.; the book does not say when it was written'

setting: |
  The chapter follows straight on from [[Jonah 3:10]]. Nineveh has turned from its evil way, and the Lord has not brought the destruction Jonah announced. For the city it is deliverance; for the prophet it is the outcome he feared, and the rest of the book is his argument with the Lord about it.

  Nineveh was “an enemy of Israel known for its violence and cruelty,” and the city and its empire are described at [[Jonah 1:2]].

  Here the book gives at last the reason for the flight of chapter 1, and the key to the whole book has been found in these verses, “in the reasons the prophet gives for his flight and unwillingness to preach at Nineveh.” Read that way, the book is “opposing a narrowmindedness that would confine the love of God to a single nation.” Jonah has also been read as a figure of his people: he “represents, in a sense, the whole Israelite people, who were trying to flee from their appointed mission.” That is a reading, and the chapter itself speaks only of one prophet, one city and one plant.

thread: |
  Jonah is angry because the Lord is merciful, and the Lord answers his anger with more mercy and with questions. He asks three times. The first question (verse 4) gets no answer; Jonah walks out of the city. The second (verse 9) gets a flat yes. The third (verses 10–11) gets none, and the book ends there.

  Between the questions the Lord teaches with things He prepares. He had prepared the fish of [[Jonah 1:17]]; now He prepares a gourd, a worm and an east wind (verses 6–8). Each is sent to Jonah, not to Nineveh. The city turned in chapter 3; the prophet has not.

  The lesson turns on one word. The Hebrew verb behind Jonah’s “pity” for the gourd in verse 10 is the verb behind the Lord’s “spare” in verse 11 (see the note on verse 10). The Lord takes the pity Jonah has shown for a plant and asks him to look at the city with it.

  The ending is abrupt on purpose: it sets side by side “Jonah’s cares and those of his Lord” and so “reveals the story’s main message.” The history “breaks off with these words of God, to which Jonah could make no reply,” because the book has done what it set out to do: “to give the Israelites an insight into the true nature of the compassion of the Lord.” Jonah’s answer is not recorded, and the question stands in the book unanswered.

sections:
  - range: 1-4
    heading: Jonah’s anger and his prayer
    plain: |
      But this seemed a great evil to Jonah, and he was angry. He prayed to the LORD and said, “O LORD, isn’t this what I said while I was still in my own country? That is why I hurried to flee to Tarshish. I knew that you are a gracious and merciful God, slow to anger and abounding in kindness, a God who relents from sending disaster. So now, LORD, please take my life from me. I would rather die than live.” The LORD said, “Is it right for you to be angry?”
  - range: 5-9
    heading: The gourd, the worm and the east wind
    plain: |
      Jonah went out of the city and sat down on its east side. He made himself a shelter there and sat in its shade, waiting to see what would happen to the city. The LORD God appointed a plant and made it grow up over Jonah, to shade his head and deliver him from his misery, and Jonah was very glad of the plant. But at dawn the next day God appointed a worm, and it attacked the plant so that it withered. When the sun came up, God appointed a sultry east wind, and the sun beat on Jonah’s head until he grew faint. He asked to die, and said, “I would rather die than live.” God said to Jonah, “Is it right for you to be angry about the plant?” He said, “It is right for me to be angry, angry enough to die.”
  - range: 10-11
    heading: The Lord’s question
    plain: |
      The LORD said, “You pitied the plant, though you did not work for it or make it grow. It came up in a night and died in a night. And should I not pity Nineveh, that great city, where there are more than a hundred and twenty thousand people who cannot tell their right hand from their left, and many animals besides?”

notes:
  - ref: 1
    phrase: it displeased Jonah exceedingly
    kind: words
    title: 'Displeased: it was evil to Jonah'
    body: |
      “Displeased” is too mild for the Hebrew, which uses the root of the word “evil” twice: “it was evil for Jonah,” and then “a great evil,” which serves “simply to strengthen the idea.” The usual Hebrew idiom for being displeased adds *in his eyes*; without it the sentence means that the sparing of Nineveh “vexed, irritated him, not merely it displeased him.”

      The word has just been used of Nineveh. The people “turned from their evil way; and God repented of the evil, that he had said that he would do unto them” ([[Jonah 3:10]]), and both are the same Hebrew word. There the evil the Lord turned from is the threatened disaster, as the note on [[Isa. 45:7]] explains. So the Lord turned from evil, and Jonah took His turning as evil.
    sources: [oshb-wlc, keil-jonah, bdb]

  - ref: 2
    phrase: for I knew that thou art a gracious God, and merciful
    kind: scripture
    title: The reason Jonah fled
    body: |
      Jonah gives at last the reason the book has withheld since [[Jonah 1:3]]: he fled because he knew the Lord would forgive Nineveh. What he means by his saying in his own country is not recorded, but the rest of the sentence makes it plain.

      The words he uses are the Lord’s own. Jonah is quoting [[Ex. 34:6]], the name the LORD proclaimed to Moses after the golden calf, and Joel uses the same list to call Judah back ([[Joel 2:13]]). The notes at both places set the wording side by side. In Jonah’s prayer the list is a grievance: the Lord’s character is the reason Jonah’s mission succeeded and the reason he is angry. Its last clause, repentest thee of the evil, has the verb explained in the note on [[Jonah 3:10]].

      Why that knowledge would make a prophet run is answered in more than one way. His problem “does not seem to be cowardice” but “resentment against the Lord for giving the hated enemy a chance to repent,” an “angry refusal to accept that God in his kindness and mercy would accept Gentiles into his kingdom.” Old enmity may have played a part: like his people he “evidently held deep and bitter feelings against Israel’s enemy,” and he may have fled “to escape contact with the hated Assyrians.” Those are explanations. The verse gives only the reason Jonah states.
    sources: [lds-scriptures, davies-jonah, ot-manual-9, scott-jonah, vandyke-ogden-twelve]

  - ref: 3
    phrase: take, I beseech thee, my life from me
    kind: scripture
    title: Jonah and Elijah ask to die
    body: |
      Jonah’s prayer for death echoes Elijah’s under the juniper tree: “take away my life; for I am not better than my fathers” ([[1 Kgs. 19:4]]). Jonah’s cry “sounds almost like the cry of Elijah when he felt he had failed in his mission.”

      The reasons the two prophets give are opposite. Elijah wished for death “from spiritual despair, caused by the apparent failure of his labours.” Jonah “did not wish to live any longer, because God had not carried out His threat against Nineveh.” Elijah’s preaching seemed to have failed; Jonah’s had succeeded, and that is what he cannot bear. He asks a second time in verse 8, in the same words: “It is better for me to die than to live” ([[Jonah 4:8]]).
    sources: [lds-scriptures, davies-jonah, keil-jonah]

  - ref: 4
    phrase: Doest thou well to be angry?
    kind: words
    title: Is it right to be angry?
    body: |
      “Doest thou well” asks whether Jonah’s anger is justified. The Hebrew word is used here as an adverb, “art thou rightly angry?”; a modern translation has “Is it right for you to be angry?” The question is the Lord’s reproof, but it is put as a question, and the request to die gets no answer.

      When the Lord asks again in verse 9, now about the gourd, Jonah answers with the Lord’s own two Hebrew words turned into a statement: “I do well to be angry, even unto death” ([[Jonah 4:9]]), in the modern rendering “Yes, angry enough to die.”
    sources: [bdb, nrsvue, oshb-wlc, lds-scriptures]

  - ref: 5
    phrase: till he might see what would become of the city
    kind: history
    title: What Jonah waited for
    body: |
      Jonah settles where he can watch Nineveh, waiting to see what would become of the city. The verse does not say what he expected; one Latter-day Saint reading is that he “waited in hopes that God would still destroy the repentant inhabitants of Nineveh.”

      Nor does it say when he went out. Reading the verse as a step back in time, to before the forty days of [[Jonah 3:4]] were over, is “grammatically admissible” but “highly improbable,” since Jonah “could not have been angry at its non-fulfilment before the time arrived.” On the plain order of the story, then, the forty days have passed and the city stands. One commentary supposes that Jonah read the Lord’s question as leaving the outcome open, “that the judgment was only postponed, not removed.” The shelter he builds is his own; the shade the Lord adds in the next verse is not.
    sources: [keil-jonah, vandyke-ogden-twelve]

  - ref: 6
    phrase: the LORD God prepared a gourd
    kind: words
    title: The gourd
    body: |
      The plant cannot be identified with certainty. Its Hebrew name, *qîqāyôn*, occurs nowhere but in this chapter. It is “usually ricinus,” the castor-oil plant, or “perhaps” a bottle-gourd, “a vine growing and withering rapidly,” which is what the ancient Greek translation has. A modern translation calls it simply “a bush.”

      What the verse dwells on is who sent it and why. Like the fish of [[Jonah 1:17]], the gourd is “prepared,” the same Hebrew verb, which a modern translation renders “appointed”: it is given a task. This one was “to deliver him from his grief” ([[Jonah 4:6]]), and *grief* is the noun of verse 1, Jonah’s *evil*. The Lord sends shade to the man who is angry at His mercy, and Jonah is glad of it, the only time in the chapter he is.
    sources: [bdb, oshb-wlc, nrsvue]

  - ref: 8
    phrase: a vehement east wind
    kind: symbol
    title: The east wind
    body: |
      The east wind is a wind of judgment in the Old Testament, and the Lord turns it on His own prophet. “Vehement” here is “sultry” in a modern translation. In the land of Israel the wind from the east comes off the Arabian Desert “insufferably hot and dry,” and it was “viewed as an instrument of God’s judgment.”

      Biblical writers used the east wind “as a sign of divine judgment” even when writing of other lands, and at Nineveh “an east wind would typically bring refreshing rains.” On that reading the wind of verse 8 is the prophets’ wind of judgment more than Assyria’s weather. Abinadi used the same figure when he warned that the Lord would smite His people with the east wind ([[Mosiah 12:6]]).
    sources: [nrsvue, sc-knowhy-560]

  - ref: 10
    phrase: Thou hast had pity on the gourd
    kind: words
    title: 'Pity and spare: one verb'
    body: |
      The Lord’s closing argument rests on one Hebrew verb, *ḥûs*, “to pity, to have compassion, to spare.” Jonah had *pity* on the gourd; the Lord asks whether He should not *spare* Nineveh. The first is the pity of a man and the second the pity “of God,” and a modern translation keeps a single word for both: “You are concerned about the bush … And should I not be concerned about Nineveh.” The King James’s two words hide the match.

      The argument takes Jonah’s own feeling and enlarges it. Jonah did not labour for the plant or make it grow, and it lasted a night; the Lord made the people of Nineveh. Jonah’s grief over the plant “exposed his misplaced priorities,” and through it “the Lord reminded Jonah that He cared for the people of Nineveh, even if Jonah did not.”
    sources: [bdb, oshb-wlc, nrsvue, scripture-helps-amos]

  - ref: 11
    phrase: cannot discern between their right hand and their left hand
    kind: history
    title: Those who cannot tell right from left
    body: |
      The phrase is read in two ways. One takes it of those not yet accountable, the people “considered innocent (that is, unable to ‘discern between their right hand and their left hand’).” Read that way, the verse fits the book’s tenderness in “pitying the little children of Nineveh.” The other takes it of the whole city: because its people “were ignorant of the saving gospel principles, they could not fully” tell their right hand from their left. The verse does not decide between them.

      Either way, the Lord counts these people as a reason to spare the city. Sixscore thousand is, in a modern translation, “more than a hundred and twenty thousand persons.”
    sources: [bd-jonah, ot-manual-9, scott-jonah, nrsvue]

  - ref: 11
    phrase: and also much cattle
    kind: scripture
    title: And also much cattle
    body: |
      The book’s last words are about animals, and they carry the Lord’s care past people. The Lord “not only wants to save the people of Nineveh, He also wants to save their cattle!” The point is that “the spiritual and temporal welfare of all God’s creations matter.” The animals had fasted and worn sackcloth with their owners ([[Jonah 3:7–8]]); now they are among the Lord’s reasons for sparing the city.

      The same reading sets the Lord’s question beside a latter-day revelation: “Remember the worth of souls is great in the sight of God” ([[D&C 18:10]]).
    sources: [vandyke-ogden-twelve, lds-scriptures]

christ: |
  The LORD who questions Jonah is “the great Jehovah, of both the Old and New Testament, and as Jonah declared, the Savior of all the world.” The mercy Jonah resents in verse 2 is the mercy he had himself received: he “had personally benefited from the Lord’s mercy and kindness” and resented “these same qualities when the Lord spared the people of Nineveh.” The Church’s footnote to verse 11 points to Nephi’s witness of the same Lord: He “denieth none that come unto him … and all are alike unto God, both Jew and Gentile” ([[2 Ne. 26:33]]).

  Jonah “resents the mercy shown his enemies,” and the Lord “patiently teaches Jonah that He loves and seeks to rescue all His children.” That mercy reaches a disciple now, and it reaches a disciple’s enemies as it reached Jonah's: the mercy a disciple has received from the Lord is the mercy He offers them.

explore: |
  - **Anger at the master’s generosity.** The parable of the labourers, [[Matt. 20:1–16]], has been set beside Jonah’s anger.
  - **Missionaries to their enemies.** The sons of Mosiah, who wanted to preach to the Lamanites ([[Mosiah 28:1–5]]; [[Alma 17:23–25]]), set against Jonah’s attitude.
  - **Every nation.** [[Alma 26:37]]: God “is mindful of every people, whatsoever land they may be in.”

