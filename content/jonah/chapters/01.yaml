chapter: 1
title: Jonah Rose Up to Flee unto Tarshish
tagline: The Lord sends Jonah to Nineveh, and he takes ship the other way. A storm, a sleeping prophet, the sailors’ lots and prayers, and a man thrown into the sea, where the Lord has a great fish waiting.
when: 'The prophet lived under Jeroboam II of Israel, in the mid-eighth century B.C.; the book does not say when it was written'

setting: |
  Jonah the son of Amittai was a prophet of the northern kingdom, from Gath-hepher in Zebulun. Kings remembers him for one prophecy: that Jeroboam II, the ablest of Israel’s kings and the most successful in war, would restore “the coast of Israel from the entering of Hamath unto the sea of the plain” ([[2 Kgs. 14:25]]). The prophet who foretold Israel’s widened border is now sent to a great city of Assyria, the empire whose armies would take Samaria in 722 B.C. and end his kingdom.

  Unlike the other prophetic books, it is not a collection of prophecies but a story about the prophet. It tells these events as having happened to the Jonah of Kings, and the Saviour made his three days in the fish a sign of His own death and Resurrection (see the note on verse 17). The book does not name its author; the Bible Dictionary takes it to be the work of a later writer, and some Latter-day Saint scholarship dates the writing, on its language and style, to between 450 and 300 B.C. Some scholars read it not as history but as “a short story with a moral,” and the question has been much debated. Nothing in these notes depends on settling the question.

thread: |
  The chapter is a story about going down. Jonah “went down to Joppa,” “went down into” the ship, and “was gone down into the sides of the ship,” and the English keeps the one Hebrew verb each time. The next step down is the sea, and the step after that is inside the fish; chapter 2 takes him to “the bottoms of the mountains” ([[Jonah 2:6]]).

  A second verb carries the action. The English varies, but in Hebrew one verb, to hurl, comes four times: the Lord “sent out” a great wind, the sailors “cast forth” the cargo, Jonah says “cast me forth,” and they “cast him forth.” The Lord hurls the storm, and the storm ends only when the sailors hurl the man it was sent for.

  A third word marks who is turning. The sailors are “afraid” in the storm (verse 5), then “exceedingly afraid” when they learn who Jonah is running from (verse 10), and at the end they “feared the LORD exceedingly” (verse 16). Jonah’s own “I fear the LORD” (verse 9), between those, uses the same Hebrew root. The prophet names the right God and runs from Him; the pagan sailors pray to their own gods, pray to the LORD, and end by sacrificing to Him. By the last verse the outsiders have done everything the prophet would not.

sections:
  - range: 1-3
    heading: The call and the flight
    plain: |
      The word of the LORD came to Jonah the son of Amittai: “Get up, go to Nineveh, that great city, and preach against it, for its wickedness has come up before me.” But Jonah got up to run away to Tarshish, away from the presence of the LORD. He went down to Joppa and found a ship bound for Tarshish. He paid the fare and went down into it, to sail with them to Tarshish, away from the presence of the LORD.
  - range: 4-10
    heading: The storm and the lot
    plain: |
      But the LORD hurled a great wind onto the sea, and the storm was so violent that the ship was about to break apart. The sailors were afraid. Each one cried out to his own god, and they threw the cargo overboard to lighten the ship. Jonah, though, had gone down into the hold, lain down, and fallen fast asleep. The captain came to him and said, “What do you mean by sleeping? Get up, call on your God. Perhaps God will take thought for us, and we will not die.” The sailors said to one another, “Come, let us cast lots, to find out who is to blame for this disaster.” They cast lots, and the lot fell on Jonah. They said to him, “Tell us, who is to blame for this disaster? What is your work? Where do you come from? What is your country? What people are you from?” He answered, “I am a Hebrew, and I fear the LORD, the God of heaven, who made the sea and the dry land.” Then the men were exceedingly afraid. “What have you done?” they said, for they knew he was running from the LORD; he had told them.
  - range: 11-16
    heading: Overboard
    plain: |
      They asked him, “What should we do to you so that the sea will calm down for us?” For the sea was growing more and more violent. He said, “Pick me up and throw me into the sea, and it will calm down for you. I know that this great storm has come on you because of me.” Even so, the men rowed hard to get back to land, but they could not, because the sea grew wilder against them. So they cried to the LORD: “Please, LORD, do not let us die for this man’s life, and do not hold us guilty of innocent blood, for you, LORD, have done as you pleased.” Then they picked Jonah up and threw him into the sea, and the sea stopped raging. The men feared the LORD exceedingly. They offered a sacrifice to the LORD and made vows.
  - range: 17-17
    heading: The fish
    plain: |
      The LORD had appointed a great fish to swallow Jonah, and Jonah was in the belly of the fish three days and three nights.

notes:
  - ref: 2
    phrase: Nineveh, that great city
    kind: history
    title: Nineveh, that great city
    body: |
      Nineveh was a great city of Assyria on the eastern bank of the Tigris, more than 500 miles from Jonah’s home. It was not yet the empire’s capital: for several centuries Calah outstripped it in importance, and it became the capital again only under Sennacherib, after Jonah’s time. The book never calls it the capital. Its phrase, three times, is “that great city” ([[Jonah 1:2]]; [[Jonah 3:2]]; [[Jonah 4:11]]).

      To an Israelite the name would call to mind Assyria and its cruelty. The Assyrians were “infamous for their barbarous methods of conquest and their treatment of captured enemies.” They tortured, mutilated and flayed prisoners. Reliefs of the siege of Lachish in Sennacherib’s palace at Nineveh, made after Jonah’s time, show captives impaled. That is the city whose “wickedness is come up before me.” The kings and the empire are set out in [Two Kingdoms and Assyria](/old-testament/guides/two-kingdoms-and-assyria/#nations).
    sources: [bd-nineveh, scripture-helps-amos, vandyke-ogden-twelve]

  - ref: 3
    phrase: Jonah rose up to flee unto Tarshish from the presence of the LORD
    kind: history
    title: Running the other way
    body: |
      Jonah obeys the first word of the call, “Arise,” and then goes the other way. Nineveh lay to the northeast, and he fled in the opposite direction. Tarshish, whose exact location is unknown, is often identified with Tartessus in southern Spain (the site’s note on [[Isa. 60:8]] explains the “ships of Tarshish”). It stood for somewhere far away. Jonah was trying to put as much distance as he could between himself and the place the Lord had sent him.

      The verse says twice that he was going “from the presence of the LORD”; Jonah would discover “the uselessness of trying to flee from Jehovah.”

      Why he ran, the chapter does not say. The book holds back his reason until [[Jonah 4:2]], where he says it himself; the note there takes up the question.
    sources: [bd-tarshish, scripture-helps-amos, bd-jonah, vandyke-ogden-twelve]

  - ref: 3
    phrase: went down to Joppa
    kind: history
    title: Joppa
    body: |
      Joppa, modern Jaffa, on the southwest coast of the land, was the nearest port to Jerusalem. It reappears in the New Testament. Peter was praying on a roof in Joppa when the Lord sent him to the Gentile Cornelius ([[Acts 10:5]]), and there he learned that “in every nation he that feareth him, and worketh righteousness, is accepted with him” ([[Acts 10:35]]).

      The two calls stand in contrast: “Jonah fled the command to take the gospel to the Gentiles, while Peter in the same city accepted the call of the Lord to take the gospel to the Gentiles.” Whether the echo was intended is uncertain. One reading holds that it is “not coincidentally” the same port. Another calls the place of Peter’s vision “probably little more than happenstance,” though Luke may have recorded it so that a reader would see the connection to Jonah.
    sources: [bd-joppa, wayment-peter-cornelius, scott-jonah]

  - ref: 5
    phrase: he lay, and was fast asleep
    kind: scripture
    title: Asleep in the storm
    body: |
      While the pagan sailors pray and throw the cargo overboard, the prophet of the LORD sleeps below deck. The shipmaster wakes him with the word the Lord had used: “arise, call upon thy God” (verse 6). It is the second of three times Jonah is told to arise, twice by the Lord and once by a pagan captain ([[Jonah 1:2]]; [[Jonah 3:2]]).

      The Gospels tell of another sleeper in a storm: “there arose a great tempest in the sea, insomuch that the ship was covered with the waves: but he was asleep” ([[Matt. 8:24]]). The two scenes are told “with several similar words,” and in both a frightened crew wakes the sleeper, pleading to be saved from perishing ([[Mark 4:38]]). The two storms end differently. Jonah’s storm ends only when he is thrown into the sea; Jesus rose and “rebuked the winds and the sea; and there was a great calm” ([[Matt. 8:26]]), showing “his power over the elements and his place as Lord of all the earth.”
    sources: [scott-jonah, lds-scriptures]

  - ref: 9
    phrase: I fear the LORD, the God of heaven, which hath made the sea and the dry land
    kind: christ
    title: The God of the sea and the dry land
    body: |
      Jonah’s confession is true, and it shows why his flight could not work. “Hebrew” was the name Israelites used of themselves before other peoples, and “I fear the LORD” means “I worship” or “I revere”: he is not claiming innocence but naming the God he belongs to. That God made the sea he is trying to cross: “Jehovah reigns everywhere, over sea and land.”

      “The LORD” in small capitals stands for the divine name, Jehovah, and “Jehovah is the premortal Jesus Christ” (the Church’s footnote at this verse points to the Topical Guide entry “Jesus Christ, Jehovah”). The God from whose presence Jonah runs, who sends the storm and appoints the fish, is Christ before His birth.
    sources: [keil-jonah, bd-jonah, bd-jehovah, lds-scriptures]

  - ref: 12
    phrase: Take me up, and cast me forth into the sea
    kind: prophets
    title: Take me up, and cast me forth
    body: |
      Jonah offers his life to save a crew of strangers. He admits that the storm is “for my sake,” and his hiding from the Lord has failed. Elder Matthew S. Holland called the offer what it is: “Jonah’s self-sacrifice to save his shipmates is Christlike indeed.” Of the whole story he added that “as a symbol of the Savior’s sacrificial death and glorious Resurrection, Jonah may be flawed.”

      Read as a type, Jonah “volunteered to sacrifice his life (as a type of Christ’s sacrifice to save humankind) to save the Gentile crew and their ship.” The type is imperfect, as Elder Holland says, and the book does not hide Jonah’s faults; the likeness is in the offer itself.
    sources: [holland-forsake-mercy, scott-jonah, uceda-second-chance]

  - ref: 14
    phrase: lay not upon us innocent blood
    kind: history
    title: Lay not upon us innocent blood
    body: |
      The sailors’ prayer asks the LORD not to count Jonah’s death against them. They had cast lots to learn “for whose cause this evil is upon us” (verse 7). The lot had fallen on Jonah, and he had told them to throw him in. Still they rowed for land, and only when they could not reach it did they pray.

      “Lay not upon us innocent blood” is the language of Israel’s law, which uses the same words of an unsolved killing: “lay not innocent blood unto thy people of Israel’s charge” ([[Deut. 21:8]]). Read beside that law, the prayer asks: do not hold his death against us as blood-guilt. “For thou, O LORD, hast done as it pleased thee” most likely gives their reason: by sending the storm and directing the lot, the Lord Himself has shown what must be done.
    sources: [keil-jonah, lds-scriptures]

  - ref: 16
    phrase: offered a sacrifice unto the LORD, and made vows
    kind: history
    title: Sailors who fear the LORD
    body: |
      The sacrifice and vows complete the sailors’ turn to the LORD. The sudden calm answered their prayer of verse 14: the storm had come on Jonah’s account, and the Lord had not held his death against them. The verse does not say where they sacrificed or what they vowed; the likeliest reading is that they sacrificed at once, on board, and vowed to offer more when they reached land safely.

      The book “paints the humanity of the gentile sailors,” and it stands against “a narrowmindedness that would confine the love of God to a single nation.” The men Jonah would have left to their gods end the chapter fearing the LORD, as Nineveh, in [[Jonah 3:5]], will believe God.
    sources: [keil-jonah, bd-jonah]

  - ref: 17
    phrase: the LORD had prepared a great fish
    kind: words
    title: Prepared a great fish
    body: |
      The Hebrew says “a great fish,” *dag gadol*, not a whale. The King James has “whale” only in the Saviour’s words in [[Matt. 12:40]], and there the Greek *kētos* means a “huge fish.” The book does not say what kind of creature it was. The accounts of modern sailors surviving inside whales, sometimes offered to prove the story, add nothing to it.

      What the book does say is who arranged it. “Prepared” is the Hebrew *mānāh*, to “appoint, ordain.” The same verb, with the Lord as its subject each time, returns at the end of the book: the Lord “prepared” a gourd, a worm and an east wind ([[Jonah 4:6–8]]). The Lord who hurled the storm also appointed the rescue. The fish swallows Jonah, and by it the Lord keeps him alive.
    sources: [davies-jonah, bdb, oshb-wlc, uceda-second-chance]

  - ref: 17
    phrase: three days and three nights
    kind: christ
    title: The sign of the prophet Jonas
    body: |
      The Saviour made these three days a sign of His own death and Resurrection. Asked for a sign, He answered: “An evil and adulterous generation seeketh after a sign; and there shall no sign be given to it, but the sign of the prophet Jonas: For as Jonas was three days and three nights in the whale’s belly; so shall the Son of man be three days and three nights in the heart of the earth. The men of Nineveh shall rise in judgment with this generation, and shall condemn it: because they repented at the preaching of Jonas; and, behold, a greater than Jonas is here” ([[Matt. 12:39–41]]; see also [[Matt. 16:4]] and [[Luke 11:29–30]]).

      The sign does not depend on whether Jesus lay in the tomb three full days and nights: “we cannot know for certain the method of reckoning of Jonah’s time of suffering, let alone the exact amount of time Jesus was dead.”

      No definite physical evidence known in 1984 could prove or disprove the story. Elder Joseph Fielding Smith said he believed the story of Jonah chiefly “in the fact that Jesus Christ, our Lord, believed it.” What Jonah prayed in the fish is chapter 2.
    sources: [lds-scriptures, bd-jonah, scott-jonah, ot-manual-9, davies-jonah]

christ: |
  The LORD of this chapter is Jehovah, the premortal Jesus Christ. He goes after His runaway prophet with a storm, and the same Lord has a great fish ready to keep him alive (see the notes on verses 9 and 17). Jonah’s offer of his own life for the sailors is an imperfect likeness of the Saviour’s (see the note on verse 12), and the Saviour Himself made Jonah’s three days in the fish the sign of His death and Resurrection. Jonah’s story “powerfully directs us to Him who can deliver us.”

  The psalmist’s confession holds for anyone who has run from what the Lord asked: there is no fleeing His presence, even to the far side of the sea, and His hand leads there too ([[Ps. 139:7–10]]). The Lord who will not let a disciple go is also the Lord who saves him: “we worship a God who is merciful and who allows His children many chances to learn His ways and be obedient to them.”

