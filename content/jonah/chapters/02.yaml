chapter: 2
title: Out of the Belly of Hell
tagline: From inside the great fish Jonah gives thanks in the words of the psalms. He tells how he sank to the roots of the mountains, looked toward the Lord’s temple and was brought up alive. Then the Lord speaks to the fish.
when: 'The prophet lived under Jeroboam II of Israel, in the mid-eighth century B.C.; the book does not say when it was written.'

setting: |
  The chapter closes the first half of the book. Jonah has fled the Lord’s call, the sailors have thrown him into the sea, and “the LORD had prepared a great fish to swallow up Jonah” ([[Jonah 1:17]]); the notes there take up the fish and the sign of the three days. The second call comes at [[Jonah 3:1]].

  Only the first and last verses are story. Between them is a poem shaped as a psalm of thanksgiving, which echoes many themes of the Psalms. In it Jonah describes his sinking into the sea as a descent into death. The prayer has been read as the confession that the Lord has heard him (verse 2), two stanzas on the distress and the rescue (verses 3–4 and 5–7), and a vow of thanksgiving (verses 8–9). The sections below follow that division.

  Many of its lines stand, in nearly the same words, in the Psalms, and the site’s notes on those psalms set them side by side; the note on verse 3 points to them.

thread: |
  Here Jonah reaches the bottom of his descent, and the Lord brings him up. In chapter 1 he went “down to Joppa” and “down into” the ship ([[Jonah 1:3]]), then “down into the sides of the ship” ([[Jonah 1:5]]). Here the same Hebrew verb takes him the rest of the way: “I went down to the bottoms of the mountains.” Then comes one word, “yet,” and the verb is the Lord’s: “yet hast thou brought up my life.”

  The prayer looks back on that rescue. It begins with an answer already given, “he heard me,” and its middle twice turns from the deep toward the Lord’s “holy temple.” The prayer ends on a vow and one short confession, “Salvation is of the LORD.”

  Then the narrator speaks again, briefly. The Lord speaks to the fish, and the fish does what it is told.

sections:
  - range: 1-2
    heading: A prayer from the fish
    plain: |
      Then Jonah prayed to the LORD his God from inside the fish. He said: “In my distress I called to the LORD, and He answered me. From the belly of the world of the dead I cried for help, and You heard my voice.
  - range: 3-4
    heading: Cast into the deep
    plain: |
      “You threw me into the deep, into the heart of the seas, and the current surrounded me. All Your breakers and Your waves passed over me. Then I said, ‘I have been driven out of Your sight.’ Yet I will look again toward Your holy temple.
  - range: 5-7
    heading: Brought up from the pit
    plain: |
      “The waters closed around me, to the point of death. The deep surrounded me, and seaweed was wrapped around my head. I went down to the roots of the mountains. The earth with its bars shut me in forever. Yet You brought my life up from the pit, O LORD my God. When my life was fading away, I remembered the LORD, and my prayer came to You, into Your holy temple.
  - range: 8-9
    heading: The vow
    plain: |
      “Those who hold to worthless idols abandon their own mercy. But I will offer sacrifice to You with a song of thanksgiving. What I have vowed, I will pay. Salvation comes from the LORD.”
  - range: 10-10
    heading: Dry land
    plain: |
      Then the LORD spoke to the fish, and it vomited Jonah out onto the dry land.

notes:
  - ref: 1
    phrase: out of the fish’s belly
    kind: history
    title: A thanksgiving prayed inside the fish
    body: |
      The prayer is a thanksgiving for rescue, and the narrator places it inside the fish. Its verbs look back: “he heard me,” “thou heardest my voice,” “yet hast thou brought up my life.” It is “not a petition for deliverance, but thanksgiving and praise for deliverance already received.”

      The past-tense verbs raise a question of timing, and readers answer it two ways. One reading holds that the psalm “is uttered in such a way as to show that by this time he is already out of the fish.” The other keeps the order the book gives: when Jonah “found that he was preserved alive in the fish’s belly, he regarded this as a pledge of his deliverance, for which he praised the Lord.” On that reading, finding himself alive inside the fish was already an answer.

      He prays to “the LORD his God.” The sailors had cried to the LORD too ([[Jonah 1:14]]); Jonah addresses Him as his own God, the God “from whom he had tried to escape.”
    sources: [keil-jonah, davies-jonah]

  - ref: 2
    phrase: I cried by reason of mine affliction unto the LORD, and he heard me
    kind: scripture
    title: The brother of Jared’s prayer
    body: |
      Jonah’s prayer has been compared, point by point, with the opening of the brother of Jared’s prayer in the Book of Mormon. He too “cried again unto the Lord” ([[Ether 3:1]]), and his first words name the sea: “O Lord, thou hast said that we must be encompassed about by the floods” ([[Ether 3:2]]); Jonah says “the floods compassed me about” (verse 3). He asks the Lord not to “be angry with thy servant,” where Jonah fears he is “cast out of thy sight” (verse 4). He says the Lord is “holy and dwellest in the heavens,” where Jonah looks to the Lord’s “holy temple.”

      It has been proposed that the verse “may have been modeled after the Psalm contained in the chapter.” It suggests more: because the Hebrew verb behind “went down” (verse 6) “is sometimes translated as ‘fall,’” the brother of Jared’s words “because of the fall our natures have become evil continually” may read Jonah’s descent as a picture of the Fall. That is a proposal, not something either text states. What the two prayers plainly share is the setting: each man faces the floods and cries to the Lord.
    sources: [sc-knowhy-526, lds-scriptures]

  - ref: 2
    phrase: out of the belly of hell cried I
    kind: words
    title: The belly of Sheol
    body: |
      “Hell” here is Sheol, the realm of the dead, not a place of punishment. Sheol is “the Hebrew name for the abode of departed spirits,” which the King James renders “grave,” “pit,” and “hell” as the context seems to need. A modern translation keeps the Hebrew name: “out of the belly of Sheol I cried.” Latter-day Saint readers have identified it with “the spirit world.”

      Whether Jonah actually died is read two ways. The narrative has him pray “out of the fish’s belly” (verse 1), so that “according to the text Jonah is still alive,” though he “describes a deathlike experience”; the Church’s footnote on “even to the soul” in verse 5 reads “to the point of death.” Another reading takes the Hebrew to mean that Jonah died: “Jonah was dead!” and his spirit prayed from the world of spirits. On that reading, “We may understand that Jonah, by being swallowed by a great fish, died and was then brought back to life.” Either way the line says that the Lord hears a prayer from the edge of death.
    sources: [bd-sheol, nrsvue, ot-manual-9, davies-jonah, sc-knowhy-652, scott-jonah, lds-scriptures]

  - ref: 3
    phrase: all thy billows and thy waves passed over me
    kind: scripture
    title: A prayer in the words of the psalms
    body: |
      The prayer “consists for the most part of reminiscences of passages in the Psalms”; some have taken that as a sign that it was added later, and one answer is that it is “the simple and natural utterance of a man versed in the Holy Scripture.” The site’s notes on the psalms set the lines side by side: verse 2 with [[Ps. 120:1]]; verse 3 with [[Ps. 42:7]] and [[Ps. 88:7]]; verse 4 with [[Ps. 31:22]]; verse 5 with [[Ps. 69:1]]; verse 8 with [[Ps. 31:6]]; verse 9 with [[Ps. 116:17–18]].

      In this verse the waves are “thy” waves, and the Lord is the one who threw him: “thou hadst cast me into the deep.” The sailors had done the throwing ([[Jonah 1:15]]), but Jonah names the Lord. “When Thou castedst me into the deep, then I said … that I was banished from the sphere of Thine eyes, i.e., of Thy protection and care.”
    sources: [keil-jonah, scripture-helps-amos, lds-scriptures]

  - ref: 4
    phrase: yet I will look again toward thy holy temple
    kind: history
    title: Looking toward the temple
    body: |
      The temple is where the Lord’s presence was to be sought, and Jonah turns toward it twice, here and in verse 7. In the King James the line is a statement of faith: although he thought it was all over with him, he will yet “once more approach the presence of the Lord, to worship before Him in His temple.” The small Hebrew word behind “yet” means “nevertheless”; it has been proposed to change it to the word for “how,” and a modern translation reads it that way and makes the line a question of despair: “how shall I look again upon your holy temple?” The King James keeps the word as written, “yet,” and verse 7 completes the thought: “my prayer came in unto thee, into thine holy temple,” the temple “where Jehovah is enthroned as God and King of His people.”

      Praying toward the temple from far away was what Solomon had asked the Lord to honor when he dedicated it. If Israel sinned and the people would “pray toward this place, and confess thy name, and turn from their sin” ([[1 Kgs. 8:35]]), the Lord would hear in heaven. Jonah, “far from the promised land,” has been read as doing just that.
    sources: [keil-jonah, nrsvue, correa-jonah, lds-scriptures]

  - ref: 6
    phrase: yet hast thou brought up my life from corruption
    kind: words
    title: Up from the pit
    body: |
      “Corruption” here means the pit, the grave, not moral corruption. The Hebrew word is “a pit (especially as a trap),” and here it is the pit of Sheol, as in [[Ps. 16:10]]. A modern translation has “you brought up my life from the Pit.”

      The rest of the verse pictures the place. He went down to “the roots of the mountains,” as the modern translation has it, where “the earth with her bars” shut him in “for ever.”

      The Church’s footnote on “brought up” points to the Topical Guide’s “Jesus Christ, Prophecies about.” [[Ps. 16:10]], with the same Hebrew word, reads “neither wilt thou suffer thine Holy One to see corruption,” and Peter says David “spake of the resurrection of Christ, that his soul was not left in hell, neither his flesh did see corruption” ([[Acts 2:31]]). The link from Jonah’s line to the Resurrection rests on that footnote and the shared word; neither Peter nor the psalm names Jonah.
    sources: [bdb, nrsvue, lds-scriptures]

  - ref: 7
    phrase: When my soul fainted within me I remembered the LORD
    kind: scripture
    title: Alma remembered too
    body: |
      Alma’s account of his conversion stands beside this verse in the Church’s helps. The footnote on “hell” in verse 2 points to [[Alma 36:18]], and the language of verse 7 has been compared with that same verse. Alma too lay “three days and three nights” unable to speak or move ([[Alma 36:10]]). At his lowest he “remembered also to have heard my father prophesy … concerning the coming of one Jesus Christ” ([[Alma 36:17]]), and cried, “O Jesus, thou Son of God, have mercy on me, who am in the gall of bitterness, and am encircled about by the everlasting chains of death” ([[Alma 36:18]]).

      The two stories have been read as close parallels: both men “disregarded God as an effective force in their lives,” both “‘died’ and were ‘racked with eternal torment’ in ‘hell,’” and both “finally turned to the Savior” and became “diligent servants for their God.” What the verse itself says is simpler. When Jonah’s life was ebbing, he remembered the Lord, and the prayer reached Him.
    sources: [ot-manual-9, davies-jonah, lds-scriptures]

  - ref: 8
    phrase: They that observe lying vanities forsake their own mercy
    kind: prophets
    title: Forsaking their own mercy
    body: |
      The line says that those who hold to idols walk away from the God who would be merciful to them. “Lying vanities” are false gods; the note on [[Ps. 31:6]], which has the same two Hebrew words, explains them. “Mercy” is *ḥesed*, the Lord’s kindness, and the lexicon reads “their mercy” here as God Himself: He is “their goodness.” A modern translation renders the line “Those who worship vain idols forsake their true loyalty.”

      The line is also the title of a general conference talk by Elder Matthew S. Holland. He calls *ḥesed* “God’s special covenantal love for you,” and reads “own” personally: the Saviour “offers it to you as your ‘own,’ meaning it is perfectly suited to you.” The lying vanities, on his reading, include those of the adversary, who would have a person think “that relief is found in sailing away from your spiritual responsibilities.”
    sources: [bdb, nrsvue, holland-forsake-mercy]

  - ref: 9
    phrase: Salvation is of the LORD
    kind: christ
    title: Salvation is of the LORD
    body: |
      The prayer ends with a promise and a confession. The promise is the offering of a man who has been rescued: a sacrifice “with the voice of thanksgiving” and a vow paid. The note on [[Ps. 116:17–18]] explains both offerings. When the word of the Lord comes a second time, Jonah goes ([[Jonah 3:3]]), and the vow has been read as his way of saying “he would fulfill the mission given him.”

      The confession is the prayer’s last line. A modern translation has “Deliverance belongs to the Lord!”, and a psalm says nearly the same: “Salvation belongeth unto the LORD” ([[Ps. 3:8]]). It has been read as a testimony in which Jonah “declared that the Lord Jehovah is the ultimate Savior of humankind,” words that “look to Jehovah’s triumph over the grave and sin, bringing salvation to all people.” The salvation Jonah confesses is Christ’s, since “the Old Testament Jehovah is the premortal Jesus”; the note on [[Jonah 1:9]] has the name.
    sources: [ot-manual-9, nrsvue, scott-jonah, lds-scriptures]

christ: |
  The Saviour made Jonah’s three days in the fish a sign of His own three days in the heart of the earth ([[Matt. 12:40]]); the note on [[Jonah 1:17]] gives His words. Jonah’s coming out alive onto dry land on the third day “is widely embraced as a type of Jesus, who came forth from the sepulcher.” The type is imperfect: “as a symbol of the Savior’s sacrificial death and glorious Resurrection, Jonah may be flawed,” and his witness of Christ from the belly of the fish is moving for that very reason.

  Jonah was brought up from the pit by the Lord he had fled. Elder Holland points to “the sign of Jonah, the living Christ, He who rose from His three-day grave having conquered all—for you,” and teaches that a disciple who feels “cast off, sinking in deepest waters” has “immediate access to divine help and healing despite your human flaws.”

explore: |
  - **Liberty Jail.** The Lord’s words to Joseph Smith in [[D&C 122:7]], “if thou be cast into the deep; if the billowing surge conspire against thee … if the very jaws of hell shall gape open the mouth wide after thee,” have been compared with the language of verses 3–5.
  - **The sign of Jonah.** [[Matt. 12:38–41]]; [[Matt. 16:4]]; [[Luke 11:29–32]].

