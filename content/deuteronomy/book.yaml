description: A phrase-by-phrase companion to the book of Deuteronomy, grounded in the restored gospel of Jesus Christ.
divisionsBlurb: Thirty-four chapters in five parts. Moses first retells the forty years, then repeats the Ten Commandments and the call to love the Lord. Next come the statutes for life in the land, and the covenant renewed with its blessings and cursings. The book closes with Moses' last days, his song, his blessing on the tribes, and his departure.
home:
  blurb: Moses' farewell to Israel on the plains of Moab. He retells the journey, repeats the law, and renews the covenant with a new generation. The book holds the commandment the Savior called the first and great one, and Moses' promise of a prophet like unto him.

intro: |
  Deuteronomy is Moses' farewell. Israel is camped “on this side Jordan” ([[Deut. 1:1]]) in the land of Moab, forty years after Sinai, and the generation that came out of Egypt has died in the wilderness. Before he leaves them, Moses speaks to their children. He retells the journey, repeats the Ten Commandments, and sets out again the statutes they are to keep in the land. The name means “repetition of the law.”

  Its center is a confession and a command: “Hear, O Israel: The LORD our God is one LORD: And thou shalt love the LORD thy God with all thine heart, and with all thy soul, and with all thy might” ([[Deut. 6:4–5]]). The Savior called this the first and great commandment. He answered each of the devil's temptations with a verse from this book. Moses promised that the Lord would raise up “a Prophet … like unto me” ([[Deut. 18:15]]), and the risen Lord told the Nephites, “I am he of whom Moses spake” ([[3 Ne. 20:23]]). The book ends with the covenant renewed and a choice set before the people, “therefore choose life” ([[Deut. 30:19]]); then a song, a blessing on each tribe, and Moses on the mountain looking at the land he would not enter. The Book of Mormon says that “the Lord took Moses unto himself” ([[Alma 45:19]]). This companion goes through all thirty-four chapters and tries to anticipate the questions a careful reader would ask, the hard ones included: why the Canaanites were to be destroyed, and why some of the laws seem so severe.

  For the covenant and its renewal, see [The Law and the Covenant](/old-testament/guides/law-and-covenant/#renewals); for the conquest that follows Moses' death, see [A Timeline of the Old Testament](/old-testament/guides/israels-story/#judges).

# The divisions follow Moses' discourses as the Bible Dictionary (“Deuteronomy”) and Scripture Helps divide them:
# 1–4 the first discourse; 5–26 the second (5–11 the commandments and their exposition, 12–26 the code of laws);
# 27–30 the covenant renewed; 31–34 Moses' last days.
# Keys must not repeat another book’s (the colors are global variables).
divisions:
  - key: deutjourney
    range: [1, 4]
    name: Remember the Way
    blurb: Moses retells the forty years, from Horeb to the plains of Moab. He recalls the spies and the people's refusal at Kadesh-barnea, the long wandering, the victories over Sihon and Og, and his own plea to cross the Jordan. He ends by urging Israel to keep the law and to worship no image.
    color: '#7d6b3c'
    darkColor: '#d9c58e'
  - key: deutlove
    range: [5, 11]
    name: Hear, O Israel
    blurb: The Ten Commandments repeated, and what they ask. Love the Lord with all thy heart, teach thy children, and do not forget Him when the land is full. Israel was chosen because the Lord loved it and kept His oath, not for its righteousness; the golden calf showed that.
    color: '#2f6d7a'
    darkColor: '#88cbd8'
  - key: deutstatutes
    range: [12, 26]
    name: The Statutes and Judgments
    blurb: The code of laws for life in the land. It covers one place of worship, false prophets, clean food and the tithe, and the year of release. Then come the feasts, Israel's leaders and the coming Prophet, war, family and neighbor, and last the basket of firstfruits.
    color: '#5e4a7c'
    darkColor: '#c2afe0'
  - key: deutcovenant
    range: [27, 30]
    name: Blessing and Cursing
    blurb: The covenant renewed on the plains of Moab. The law is to be written on stones at Mount Ebal, and Moses sets out the blessings of obedience and the cursings of disobedience. Moses promises a gathering after the scattering and sets before Israel life and death.
    color: '#8c3d4f'
    darkColor: '#e6a2b2'
  - key: deutfarewell
    range: [31, 34]
    name: The Last Days of Moses
    blurb: Moses charges Joshua and gives the law to the priests, to be read every seventh year. He teaches Israel a song as a witness against them, blesses each tribe, and climbs Mount Nebo to see the land. There his life on earth ends, and no man knows his sepulchre.
    color: '#456b3d'
    darkColor: '#a6d29a'

