chapter: 31
title: Be Strong and of a Good Courage
tagline: With his death near, Moses gives Israel what will outlast him, a new leader, a written law to be read every seventh year, and a song to stand as a witness, while the LORD tells him plainly that Israel will turn away.
when: 'In the plains of Moab, in the fortieth year after the Exodus'

setting: |
  Moses is still in Moab in the fortieth year after the Exodus ([[Deut. 1:3]]). His three discourses are finished; the third, the covenant renewed in chapters 27–30, ended with “choose life” ([[Deut. 30:19]]). Chapters 31–34 tell “the delivery of the law to the Levites, Moses' song and last blessing, and the departure of Moses.”

  The chapter turns from preaching to arrangements. Moses is a hundred and twenty and will not cross the Jordan, so he provides for the time after him. He charges Joshua, writes the law and hands it to the priests and elders, commands that it be read to all Israel every seventh year, and, at the LORD's command, writes the song that becomes chapter 32, all of it “at the end of the three sermons.”

  Later scripture returns to the chapter: the LORD repeats Joshua’s charge after Moses is gone ([[Josh. 1:5–9]]).

thread: |
  The chapter is Moses' provision for the time after his death. He leaves Israel a leader, Joshua (verses 1–8, 14–15, 23); a book, the law written, delivered to the priests and elders, read every seventh year and laid beside the ark (verses 9–13, 24–26); and a song, written and taught so that it stays in Israel's mouth (verses 19–22, 30).

  Running through all three is something darker. At the tabernacle the LORD tells Moses that the people will “go a whoring after the gods of the strangers of the land” once they are full and settled (verses 16–20), and Moses repeats it to the elders: “I know that after my death ye will utterly corrupt yourselves” (verse 29). The book and the song are both called a “witness” against Israel (verses 19, 21, 26). So the chapter's encouragement is not that Israel will be faithful. It is that the LORD goes before them anyway: “he will not fail thee, nor forsake thee” (verse 6). Joshua's presence at the tabernacle also reflects this: he heard that the LORD foreknew the apostasy “and yet nevertheless would bring them into the promised land.”

sections:
  - range: 1-8
    heading: Joshua shall go over before thee
    plain: |
      Moses went on speaking these words to all Israel. He said, “I am a hundred and twenty years old today. I can no longer lead you out and in (see the note on verse 2), and the LORD has told me, ‘You shall not cross this Jordan.’ The LORD your God Himself will cross ahead of you and destroy these nations before you, and you will take their land; and Joshua will cross ahead of you, as the LORD said. The LORD will do to them what He did to Sihon and Og, the kings of the Amorites, and to their land, when He destroyed them. The LORD will hand them over to you, and you are to deal with them by all the commandments I have given you. Be strong and courageous. Do not be afraid or terrified of them, for the LORD your God is the one who goes with you. He will not fail you or abandon you.”

      Then Moses called Joshua and said to him in front of all Israel, “Be strong and courageous, for you must go with this people into the land the LORD swore to their fathers to give them, and you will lead them to inherit it. The LORD Himself goes ahead of you. He will be with you; He will not fail you or abandon you. Do not be afraid or discouraged.”
  - range: 9-13
    heading: Read this law before all Israel
    plain: |
      Moses wrote down this law and gave it to the priests, the sons of Levi, who carried the ark of the LORD's covenant, and to all the elders of Israel. Moses commanded them: “At the end of every seven years, at the appointed time of the year of release, at the Feast of Tabernacles, when all Israel comes to appear before the LORD your God at the place He will choose, you shall read this law aloud to all Israel. Gather the people, men, women and children, and the foreigner living in your towns, so that they can listen and learn to fear the LORD your God and carefully keep every word of this law; and so that their children, who do not yet know it, can hear and learn to fear the LORD your God, as long as you live in the land you are crossing the Jordan to possess.”
  - range: 14-23
    heading: A song for a witness
    plain: |
      The LORD said to Moses, “The day of your death is near. Call Joshua, and come to the tent of meeting, so that I may commission him.” So Moses and Joshua went and presented themselves at the tent of meeting. The LORD appeared at the tent in a pillar of cloud, and the cloud stood over the tent's door.

      The LORD said to Moses, “You are about to rest with your fathers, and this people will rise up and prostitute themselves to the foreign gods of the land they are entering. They will abandon Me and break the covenant I made with them. Then My anger will burn against them; I will abandon them and hide My face from them, and they will be devoured. Many disasters and troubles will come on them, and they will say then, ‘Haven't these disasters come on us because our God is not with us?’ And I will certainly hide My face on that day, because of all the evil they have done in turning to other gods.

      “So write down this song for yourselves and teach it to the Israelites. Put it in their mouths, so that this song may be My witness against them. When I have brought them into the land I swore to their fathers, a land flowing with milk and honey, and they have eaten their fill and grown fat, they will turn to other gods and serve them, despise Me and break My covenant. And when many disasters and troubles have come on them, this song will testify against them as a witness, because their descendants will not forget it. I know what they are inclined to do even now, before I have brought them into the land I swore to give.”

      So Moses wrote this song that same day and taught it to the Israelites. And he gave Joshua son of Nun a charge: “Be strong and courageous, for you will bring the Israelites into the land I swore to them, and I will be with you.”
  - range: 24-30
    heading: A witness against thee
    plain: |
      When Moses had finished writing the words of this law in a book, to the very end, he commanded the Levites who carried the ark of the LORD's covenant: “Take this book of the law and put it beside the ark of the covenant of the LORD your God (see the note on verse 26), so that it stays there as a witness against you. For I know how rebellious and stubborn you are. Even now, while I am still alive among you, you have rebelled against the LORD; how much more after I die! Gather to me all the elders of your tribes and your officers, so that I can speak these words for them to hear, and call heaven and earth to witness against them. For I know that after my death you will become utterly corrupt and turn from the way I have commanded you, and disaster will come on you in the latter days, because you will do what is evil in the LORD's sight and provoke Him to anger by what your hands have made.”

      And Moses spoke the words of this song, from beginning to end, for the whole assembly of Israel to hear.

notes:
  - ref: 2
    phrase: I can no more go out and come in
    kind: words
    title: No more go out and come in
    body: |
      “Go out and come in” is the language of leading a people, so Moses' first reason can be read as saying that his leadership is over. When Moses asked the LORD for a successor, he asked for a man “which may go out before them, and which may go in before them, and which may lead them out, and which may bring them in; that the congregation of the LORD be not as sheep which have no shepherd” ([[Num. 27:17]]). The LORD named Joshua ([[Num. 27:18]]), and Joshua is the man this chapter installs.

      The phrase can mean that Moses can “no longer work in the nation and for it,” and so the verse is “not at variance” with the statement at his death that “his eye was not dim, nor his natural force abated” ([[Deut. 34:7]]). The second reason Moses gives, “Thou shalt not go over this Jordan,” is the LORD's sentence from Meribah, explained at [[Deut. 3:26]].
    sources: [keil-deuteronomy, lds-scriptures]

  - ref: 7
    phrase: Be strong and of a good courage
    kind: history
    title: Joshua’s charge
    body: |
      Joshua receives his charge twice in this chapter, first from Moses “in the sight of all Israel” ([[Deut. 31:7]]) and then from the LORD at the tabernacle ([[Deut. 31:14–15]], [[Deut. 31:23]]). He was no newcomer: he had been “Moses' minister,” one of the twelve spies, and the man appointed to succeed him. Numbers tells the appointment itself, with Moses laying his hands on Joshua before Eleazar the priest and the congregation ([[Num. 27:22–23]]).

      Verse 23 names its speaker only as “he,” but he speaks of “the land which I sware unto them,” as the LORD does in verses 20–21, and adds “I will be with thee.” One older reading takes verse 23 as the LORD's own charge, given as verse 14 promised, on the evidence of those last words. Either way, Joshua's charge includes the promise: “the LORD, he it is that doth go before thee; he will be with thee, he will not fail thee, neither forsake thee” ([[Deut. 31:8]]).

      After Moses is gone the LORD says it all again, in nearly the same words: “as I was with Moses, so I will be with thee: I will not fail thee, nor forsake thee” ([[Josh. 1:5]]), and three times, “Be strong and of a good courage” ([[Josh. 1:6]]; [[Josh. 1:7]]; [[Josh. 1:9]]).
    sources: [bd-joshua, keil-deuteronomy, lds-scriptures]

  - ref: 9
    phrase: And Moses wrote this law
    kind: history
    title: Moses wrote this law
    body: |
      Deuteronomy presents Moses as its author, and latter-day revelation agrees. Deuteronomy often points to itself as “this law” (verses 9, 11, 12 and 24 here, among others), and “latter-day revelation confirms that Moses was the author” of the five books, while “scribes and copyists have left their traces,” as in the account of his death in chapter 34 (chapter 1's setting says the same).

      A later king is central to one account of Deuteronomy's origins. In Josiah's day a “book of the law” was found in the temple ([[2 Kgs. 22:8]]), and “the broad consensus of scholars” holds that the scroll “comprised the book of Deuteronomy, at least in some form”; one proposed date places Deuteronomy itself in Josiah's reign, around 620–610 B.C. Latter-day Saint writers have discussed this dating because Lehi lived through those years: his family “almost certainly experienced firsthand Josiah's reforms.”

      They differ over what the reforms meant. Some read Deuteronomy's preface as showing what Josiah's reformers “set out to remove from the religion of Israel,” and find that Lehi's vision “contains most of the elements these Deuteronomy passages explicitly reject” (see [[1 Ne. 1:8–12]]). Others answer that “no biblical prophet ever opposed or criticized Josiah's reforms,” and warn that doing away with Deuteronomy means reading “a major portion of the Hebrew Bible as historically suspect or outright unreliable.” These are the authors' readings; Church sources name Moses as the author.
    sources: [bd-pentateuch, seely-self-reference, dundas-ancient-israel, christensen-prophets-kings, hamblin-josiah, eliason-josiah]

  - ref: 10
    phrase: At the end of every seven years
    kind: scripture
    title: The law read every seventh year
    body: |
      Moses commands a public reading of the whole law every seventh year, at the Feast of Tabernacles in the year of release, before everyone. The year of release is the seventh year of [[Deut. 15:1]], and the feast is the seven-day Feast of Tabernacles of [[Deut. 16:13]]. The command includes the whole community: “men, and women, and children, and thy stranger,” so that even “their children, which have not known any thing, may hear, and learn” ([[Deut. 31:12–13]]).

      Scripture shows such a reading after the exile. Ezra brought the law “before the congregation both of men and women, and all that could hear with understanding, upon the first day of the seventh month” ([[Neh. 8:2]]), and at the feast of booths that followed, “day by day, from the first day unto the last day, he read in the book of the law of God” ([[Neh. 8:18]]).

      The Book of Mormon may show one too. King Benjamin's people came to the temple and “pitched their tents round about, every man according to his family” ([[Mosiah 2:5]]), and because not all could hear, he “caused that the words which he spake should be written and sent forth” ([[Mosiah 2:8]]). The phrases of verses 10–13 have been set beside Benjamin's account, with the conclusion that “it was at just such a seventh-year Deuteronomic Feast of Tabernacles that Benjamin's speech was delivered.” That is the authors' reading, not something the Book of Mormon says.
    sources: [welch-szink-festivals, lds-scriptures]

  - ref: 17
    phrase: I will hide my face from them
    kind: symbol
    title: I will hide my face
    body: |
      Here the LORD's hiding of His face answers Israel's sin. Israel will forsake the LORD and break His covenant ([[Deut. 31:16]]); He will forsake them and hide His face ([[Deut. 31:17]]). The LORD's response matches Israel's actions: “for forsaking Him, He would forsake them; and for breaking His covenant, He would hide His face from them, i.e., withdraw His favour.”

      Verses 17–18 raise a harder question. The people will ask whether these evils have come because “our God is not among us” ([[Deut. 31:17]]), and still the LORD says, “I will surely hide my face in that day” ([[Deut. 31:18]]). That reading distinguishes missing God from repentance: “simply missing God is not true repentance.” Verse 18 gives the text's own reason: “in that they are turned unto other gods.”

      Ezekiel uses the words for the exile when it came and then reverses them: “Neither will I hide my face any more from them: for I have poured out my spirit upon the house of Israel” ([[Ezek. 39:29]]). The note at [[Ezek. 39:23]] discusses the phrase.
    sources: [keil-deuteronomy, lds-scriptures]

  - ref: 19
    phrase: write ye this song for you
    kind: history
    title: Why a song
    body: |
      The LORD tells Moses that Israel will turn to other gods, and then gives the song its job: “put it in their mouths, that this song may be a witness for me against the children of Israel” ([[Deut. 31:19]]). When the troubles come, “this song shall testify against them as a witness; for it shall not be forgotten out of the mouths of their seed” ([[Deut. 31:21]]). The LORD gives it before the fact: “I know their imagination which they go about, even now, before I have brought them into the land” ([[Deut. 31:21]]).

      The song is the Song of Moses, chapter 32, and its shape is explained there. This chapter is part of what makes Deuteronomy a text “consciously aware of their function with respect to their future readers” (said of Deuteronomy and the Book of Mormon together): Moses writes the law, provides for its reading, and writes the song, each for those who come after.
    sources: [seely-self-reference, lds-scriptures]

  - ref: 26
    phrase: put it in the side of the ark of the covenant
    kind: history
    title: Beside the ark, not in it
    body: |
      The book was laid beside the ark, not inside it. Here “in the side of” means “beside”: “put it beside the ark of the covenant of the Lord your God; let it remain there as a witness against you.” Inside the ark were the tables of the law, and according to [[1 Kgs. 8:9]] nothing else. The book Moses wrote was kept next to them as a witness against Israel ([[Deut. 31:26]]), the word the LORD also uses of the song ([[Deut. 31:19]], [[Deut. 31:21]]).
    sources: [seely-self-reference, bd-ark-of-the-covenant]

christ: |
  The LORD who goes before Israel and “will not fail thee, nor forsake thee” is Jehovah, the premortal Christ (see the note at [[Ex. 3:14]]). He speaks this chapter knowing Israel will turn away, yet sends them into the land, and the song He gives ends in mercy ([[Deut. 32:43]]).

  Moses cannot take Israel over the Jordan; Joshua does. His name occurs in several forms, among them “Jesus,” and chapter 3's witness of Christ follows the name and the rest Joshua gave into Hebrews ([[Deut. 3:28]]).

explore: |
  - [[Num. 27:15–23]]: Moses asks for a shepherd for Israel, and Joshua is appointed.
  - [[Neh. 8]]: Ezra reads the law at the feast of booths.
  - [[Mosiah 2:1–9]]: King Benjamin's assembly at the temple.
  - [[Deut. 32]]: the song Moses wrote that day.

