chapter: 28
title: Blessed in the City, Cursed in the City
tagline: Moses sets the blessings of obedience beside the curses of disobedience, which continue through drought, disease, invasion and siege until Israel is sent back to Egypt.
when: 'In the plains of Moab, in the fortieth year after the Exodus'

setting: |
  Moses is still speaking in the plains of Moab ([[Deut. 1:3–5]]). The code of laws (chapters 12–26) is finished, and chapter 27 has told Israel to pronounce blessing and cursing from Gerizim and Ebal once they cross the Jordan (see [[Deut. 11:29]]). This chapter sets out what the blessing and the cursing are.

  It covers the same ground as [[Lev. 26]], the close of the law given at Sinai: blessings for obedience (verses 1–14), then punishments for turning away (verses 15–68). The covenant at Sinai seems to follow an ancient Near Eastern treaty form, in which “a major feature … was the promise of blessings as well as the threat of curses” (see [[Deut. 1]]).

  Later prophets used this chapter's words. In Jeremiah “the Deuteronomic curses were used to explain Jerusalem's destruction”; see also the notes on [[Jer. 5:15]], [[Jer. 19:9]], [[Lam. 4:19]], [[Hos. 8:13]] and [[Amos 4:6]]. The Book of Mormon reads its own peoples' history by these curses (see the note on verse 45).

thread: |
  The chapter turns on two conditions: “if thou shalt hearken diligently unto the voice of the LORD thy God” (verse 1) and “if thou wilt not hearken unto the voice of the LORD thy God” (verse 15). Everything else follows from which one Israel chooses.

  The blessings come first and are brief: prosperity in the city and field, children, flocks and harvest, rain in its season, victory, and honor among the nations (verses 1–14). The curses begin by repeating the blessings of verses 3–6 almost word for word, changing “blessed” to “cursed”; the rest reverse of the blessings one by one (verses 15–46). Then they keep going, in two further sections that stand apart from what comes before: an invader from far away and the siege of Israel's cities (verses 47–57), and plagues, scattering among the nations, and at last a return to Egypt (verses 58–68).

  At verse 47 the tone shifts: one reading takes what follows as a prediction based on Israel's actual failure to serve God, rather than a conditional warning, and the reason given is that Israel did not serve the LORD “with joyfulness, and with gladness of heart, for the abundance of all things.” The chapter ends at its lowest point: Israel is brought into Egypt, offered as slaves to its enemies, and no one will buy. The promise of return waits for chapter 30.

sections:
  - range: 1-14
    heading: If you listen
    plain: |
      If you listen carefully to the voice of the LORD your God and keep all His commandments that I give you today, the LORD your God will set you high above all the nations of the earth. All these blessings will come on you and catch up with you, if you listen to the voice of the LORD your God.

      You will be blessed in the city and blessed in the field. Your children will be blessed, and the crops of your land, the young of your cattle and the lambs of your flocks. Your basket and your store will be blessed. You will be blessed when you come in and blessed when you go out.

      The LORD will make your enemies who rise against you fall before you; they will come at you by one road and flee from you by seven. The LORD will command blessing on your barns and on all you put your hand to, and He will bless you in the land He is giving you. If you keep His commandments and walk in His ways, the LORD will make you a holy people to Himself, as He swore to you. All the peoples of the earth will see that you are called by the name of the LORD, and they will be afraid of you. The LORD will give you abundance: children, cattle and crops, in the land He swore to your fathers to give you. He will open the heavens, His good storehouse, to send rain on your land in its season and to bless all your work. You will lend to many nations and borrow from none. The LORD will make you the head and not the tail, always on top and never underneath, if you listen to His commandments and do them, and do not turn aside from any of the words I command you today, to the right or to the left, to go after other gods and serve them.
  - range: 15-46
    heading: If you will not listen
    plain: |
      But if you will not listen to the voice of the LORD your God and keep all His commandments and statutes that I give you today, all these curses will come on you and catch up with you. You will be cursed in the city and cursed in the field. Your basket and your store will be cursed. Your children will be cursed, and the crops of your land, the young of your cattle and the lambs of your flocks. You will be cursed when you come in and cursed when you go out.

      Because of the evil you have done in forsaking me, the LORD will send curse, confusion and rebuke on everything you attempt, until you are destroyed, and quickly. He will make plague cling to you until it has wiped you off the land you are entering to possess. He will strike you with wasting disease, fever, inflammation and burning heat, with the sword, and with blight and mildew on your crops, and they will hunt you down until you perish. The sky above you will be bronze and the ground beneath you iron. In place of rain the LORD will send powder and dust from the sky until you are destroyed.

      The LORD will let your enemies defeat you: you will go out against them by one road and flee from them by seven, and you will be driven among all the kingdoms of the earth. Your corpses will be food for the birds and the wild animals, with no one to scare them off. The LORD will strike you with the boils of Egypt, with tumors, scabs and itch that cannot be healed, with madness, blindness and confusion of mind. You will grope at noon like a blind man in the dark. Nothing you do will succeed; you will be oppressed and robbed all your days, and no one will save you.

      You will be betrothed to a woman, and another man will lie with her. You will build a house and not live in it, plant a vineyard and not gather its grapes. Your ox will be slaughtered before your eyes and you will not eat any of it; your donkey will be taken from you by force and not returned; your sheep will be given to your enemies, and no one will help you. Your sons and daughters will be given to another people while you watch, your eyes worn out with longing for them all day, and you will be powerless to stop it. A nation you do not know will eat the crops and all the work of your hands, and you will be oppressed and crushed continually, until the sight of it drives you mad. The LORD will strike your knees and legs with painful boils that cannot be healed, from the soles of your feet to the top of your head.

      The LORD will take you, and the king you set over yourself, to a nation neither you nor your fathers have known, and there you will serve other gods of wood and stone. You will become a horror, a proverb and a byword among all the nations where the LORD drives you. You will sow much seed and gather little, because the locust will eat it. You will plant and tend vineyards but neither drink the wine nor gather the grapes, because the worms will eat them. You will have olive trees throughout your territory but no oil to anoint yourself, because the olives will drop. You will have sons and daughters but not keep them, because they will go into captivity. The locust will take all your trees and crops. The foreigner who lives among you will rise higher and higher above you, while you sink lower and lower. He will lend to you, and you will not lend to him; he will be the head and you the tail.

      All these curses will come on you, pursue you and catch up with you until you are destroyed, because you did not listen to the voice of the LORD your God and keep the commandments and statutes He gave you. These curses will be a sign and a wonder on you and on your descendants for ever.
  - range: 47-57
    heading: The nation from far away, and the siege
    plain: |
      Because you did not serve the LORD your God with joy and gladness of heart when you had plenty of everything, you will serve the enemies the LORD sends against you, in hunger and thirst, in nakedness and in want of everything. He will put an iron yoke on your neck until He has destroyed you.

      The LORD will bring a nation against you from far away, from the ends of the earth, swooping like an eagle, a nation whose language you will not understand, a fierce-looking nation that shows no respect for the old and no pity for the young. It will eat the young of your cattle and the crops of your land until you are destroyed, and leave you no grain, wine or oil, no calves or lambs, until it has ruined you. It will besiege you in all your towns throughout your land, until the high, fortified walls you trusted in come down.

      In the siege, in the distress your enemy brings on you, you will eat your own children, the flesh of the sons and daughters the LORD your God has given you. The most gentle and refined man among you will begrudge food to his brother, to the wife he loves, and to the children he has left, and will not share with any of them the flesh of the children he is eating, because the siege has left him nothing else. The most gentle and refined woman among you, so delicate she would not set the sole of her foot on the ground, will begrudge food to the husband she loves, to her son and her daughter, and toward her young one that comes out from between her feet and the children she will bear; for in her lack of everything she will eat them in secret, in the siege and distress your enemy brings on you in your towns.
  - range: 58-68
    heading: Back to Egypt
    plain: |
      If you will not carefully do all the words of this law that are written in this book, and fear this glorious and awesome name, THE LORD THY GOD, then the LORD will strike you and your descendants with extraordinary plagues, great and lasting, and with severe and lasting sicknesses. He will bring back on you all the diseases of Egypt that you dreaded, and they will cling to you. Every sickness and every plague not written in the book of this law the LORD will bring on you too, until you are destroyed. You who were as many as the stars of heaven will be left few, because you would not listen to the voice of the LORD your God.

      Just as the LORD delighted in doing you good and making you many, so the LORD will delight in ruining and destroying you, and you will be torn from the land you are entering to possess. The LORD will scatter you among all peoples, from one end of the earth to the other, and there you will serve other gods of wood and stone, which neither you nor your fathers have known. Among those nations you will find no peace, no resting place for the sole of your foot. There the LORD will give you a trembling heart, failing eyes and sorrow of mind. Your life will hang in doubt before you; you will be afraid night and day, never sure of staying alive. In the morning you will say, "If only it were evening!" and in the evening, "If only it were morning!", because of the dread in your heart and the sights before your eyes.

      And the LORD will bring you into Egypt again with ships, by the way of which I told you, “Thou shalt see it no more again.” There you will offer yourselves for sale to your enemies as slaves, men and women, and no one will buy you.

notes:
  - ref: 15
    phrase: all these curses shall come upon thee, and overtake thee
    kind: structure
    title: Why the curses run so long
    body: |
      The blessings take fourteen verses and the curses fifty-four, making the warning about disobedience much longer than the promise of blessing. Deuteronomy 28 “is one of the longest chapters in the Bible,” and “roughly four-fifths of the chapter lists prescribed curses for those who prove unfaithful,” which may reflect “the force that an impending curse had on the imagination” of its first hearers. In the treaties of the ancient world, blessings and curses together “ensured covenant fidelity.”

      The theme page [He Turned the Curse into a Blessing](/deuteronomy/themes/curse-into-blessing/) follows the curse from 11:26 to 30:7 and chapter 33.
    sources: [uriona-curses]

  - ref: 16
    phrase: Cursed shalt thou be in the city, and cursed shalt thou be in the field
    kind: structure
    title: The blessings turned inside out
    body: |
      Verses 16–19 repeat the six blessings of verses 3–6 almost word for word, with “cursed” in place of “blessed,” and the curses that follow go on reversing the blessings one by one. They are “the mirror image of the blessings, but in even more explicit detail.” The pairs cover the whole of life: town and country, children and herds, basket and store, coming in and going out.

      The reversals run through the chapter. The enemy who came out “one way” and fled “seven ways” (verse 7) becomes Israel fleeing seven ways (verse 25). The heaven that was the LORD's “good treasure,” opened to give rain (verse 12), becomes a sky of brass over ground of iron, dropping “powder and dust” in place of rain (verses 23–24). Leviticus has the same picture with the metals the other way round: “I will make your heaven as iron, and your earth as brass” ([[Lev. 26:19]]). Israel, which was to lend to many nations and be “the head, and not the tail” (verses 12–13), ends up borrowing from the foreigner in its own land: “he shall be the head, and thou shalt be the tail” (verse 44).
    sources: [dundas-ancient-israel, lds-scriptures]

  - ref: 45
    phrase: shall pursue thee, and overtake thee, till thou be destroyed
    kind: scripture
    title: The Book of Mormon reads its history by these curses
    body: |
      Several Latter-day Saint studies read Book of Mormon passages as examples of these curses falling on its peoples. Lehi's promise that those who keep the commandments will prosper in the land ([[2 Ne. 1:20]]) stands in one study's table beside verse 15. Jacob warns of “a sore curse, even unto destruction” ([[Jacob 2:33]]), which another study pairs with verse 45's curses that pursue Israel “till thou be destroyed.” The same study reads the dead of [[Alma 2:38]], devoured by beasts and vultures, as verse 26 fulfilled, and hears verses 25–26 in Abinadi's warning to King Noah's people ([[Mosiah 12:2]]).

      Lamanites driving off the flocks of Noah's people ([[Mosiah 11:16–17]]) is “similar to what the Lord said would happen” in verse 31, and the priests of Noah who carried off the people's grain by night ([[Mosiah 21:21]]) fulfilled verse 33, the harvest eaten by “a nation which thou knowest not.”

      One study's conclusion is that “the Book of Mormon authors reaffirm the idea that failing to hearken to the Lord would bring cursing and death.” The Book of Mormon “never directly quotes a passage from Deuteronomy.”
    sources: [sc-knowhy-268, uriona-curses, sc-knowhy-369, seely-self-reference, lds-scriptures]

  - ref: 47
    phrase: with joyfulness, and with gladness of heart
    kind: scripture
    title: Serving without joy
    body: |
      The reason verse 47 gives for the invasion and siege is not only disobedience but joyless service in a time of plenty. Deuteronomy commands Israel's worship to be glad: at the chosen place “ye shall rejoice in all that ye put your hand unto” ([[Deut. 12:7]]); at the feast of tabernacles “thou shalt rejoice in thy feast” ([[Deut. 16:14]]); with the firstfruits, “thou shalt rejoice in every good thing which the LORD thy God hath given unto thee” ([[Deut. 26:11]]). Here “served” can also mean “worshipped.” The same commentary sets “the abundance of all things” beside Moses' warnings that a full table can make Israel forget the LORD ([[Deut. 6:10–12]]; [[Deut. 8:11–18]]).

      Verses 47–48 turn on one verb: Israel “servedst not the LORD thy God” in abundance, and so “shalt thou serve thine enemies … in want of all things” (verse 48).
    sources: [cambridge-deuteronomy, lds-scriptures]

  - ref: 49
    phrase: The LORD shall bring a nation against thee from far
    kind: history
    title: The nation from far
    body: |
      Moses does not name the nation. Jeremiah used this chapter's curses “to explain Jerusalem's destruction”; the site's notes on [[Jer. 5:15]], [[Jer. 6:22]] and [[Lam. 4:19]] show how closely his words and the Lamentations poet's follow verses 49–50.

      Verses 49–57 were seemingly fulfilled “with particular preciseness” in the Roman siege of Jerusalem in A.D. 70. Rome “lies over a thousand miles from Israel”; the eagle “was carried on the standards of the legions of Rome”; and “while the Aramaic of Babylon was a sister tongue to Hebrew, Latin was completely different.”
    sources: [uriona-curses, ot-manual-deuteronomy-17-33, lds-scriptures]

  - ref: 53
    phrase: thou shalt eat the fruit of thine own body
    kind: scripture
    title: The siege foretold, and fulfilled
    body: |
      Verses 53–57 describe the last extreme of a siege's famine: parents eating their own children, the most refined man and woman in the city hiding food from their own families. Scripture records it more than once. The Church edition's footnotes link the verse to Samaria under siege in Elisha's day ([[2 Kgs. 6:28–29]]) and to Jeremiah's warning ([[Jer. 19:9]]; see the note there). When Jerusalem fell to Nebuchadnezzar, “the people did turn to cannibalism to survive” ([[Lam. 4:10]]; see also the note on [[Ezek. 5:10]]). The siege of Jerusalem by the Romans in A.D. 70 has been read the same way: “Josephus described a noblewoman from Perea who killed her son and used him for food,” the “tender and delicate woman” of verse 56.

      The Book of Mormon records a like horror at the Nephites' end, captives fed on the flesh of their slain husbands and fathers ([[Moro. 9:7–8]]), and in one Latter-day Saint reading “Mormon's description of the destruction that befell the Nephites echoes the curses found in Deuteronomy 28.”
    sources: [lds-scriptures, ot-manual-deuteronomy-17-33, uriona-curses]

  - ref: 58
    phrase: all the words of this law that are written in this book
    kind: history
    title: This book
    body: |
      Verse 58 calls the speech a written book; one study takes this phrase as the point where “the collection of the laws ends.” Deuteronomy opens with “These be the words which Moses spake” ([[Deut. 1:1]]) and is framed by such phrases. They mark “the words of Moses that were to be written down and transmitted to the future” (Moses writes them at [[Deut. 31:9]]). The curses of chapters 28 and 29 are full of them, “similar to the self-references in ancient treaties.” Verse 61 even threatens “every sickness, and every plague, which is not written in the book of this law.”
    sources: [seely-self-reference, lds-scriptures]

  - ref: 63
    phrase: so the LORD will rejoice over you to destroy you
    kind: scripture
    title: The LORD will rejoice to destroy
    body: |
      Verse 63 describes the LORD as rejoicing over Israel's destruction, using a figure of speech. One commentary calls it a “bold anthropomorphic expression” by which Moses “seeks to remove from the nation the last prop of false confidence in the mercy of God”: however little “the pleasure may be which He has in the death of the wicked,” “the holiness of His love demands the punishment and destruction of those who despise the riches of His goodness and long-suffering.” Another calls it a “rhetorical figure” typical of Deuteronomy, and contrasts it with the LORD's cry in Hosea: “How shall I give thee up, Ephraim? … mine heart is turned within me” ([[Hos. 11:8]]).

      Deuteronomy itself does not leave the verse as its last word. When the scattered people return, “the LORD will again rejoice over thee for good, as he rejoiced over thy fathers” ([[Deut. 30:9]]).
    sources: [keil-deuteronomy, cambridge-deuteronomy, lds-scriptures]

  - ref: 68
    phrase: the LORD shall bring thee into Egypt again with ships
    kind: history
    title: Back to Egypt
    body: |
      The chapter's last curse undoes the Exodus. The diseases of Egypt return (verse 60). At Marah the LORD had promised, “I will put none of these diseases upon thee, which I have brought upon the Egyptians” ([[Ex. 15:26]]); the two verses share their words. The people whom the LORD had made “as the stars of heaven for multitude” after they went down into Egypt few ([[Deut. 10:22]]) are “left few in number, whereas ye were as the stars of heaven for multitude” (verse 62).

      Moses keeps “the worst” for last: a return “into ignominious slavery.” “In ships” means “in a way which would cut off every possibility of escape,” and “no man shall buy you” shows “the utmost contempt”: Israel will not even be worth buying as slaves. The Church edition's footnote reads “Egypt” as captivity; the note on [[Hos. 8:13]] shows Hosea using the curse the same way.

      Unlike [[Lev. 26:40–45]], it ends without a promise that the LORD will remember His covenant; that promise comes two chapters later, at [[Deut. 30:1–10]].
    sources: [keil-deuteronomy, lds-scriptures]

christ: |
  The LORD who sets the blessing and the curse before Israel is Jehovah, and “Jehovah is the premortal Jesus Christ” (see the note at [[Ex. 3:14]]).

  As Jesus came down the Mount of Olives toward Jerusalem, “he beheld the city, and wept over it” ([[Luke 19:41]]), and foretold its siege: “thine enemies shall cast a trench about thee, and compass thee round, and keep thee in on every side … because thou knewest not the time of thy visitation” ([[Luke 19:43–44]]). The Church edition's footnote to verse 52, “he shall besiege thee in all thy gates,” links this prophecy to Deuteronomy 28:52.

explore: |
  - [[Lev. 26]]: the same blessings and curses at the close of the law given at Sinai, ending in the LORD's promise to remember His covenant.
  - [[Deut. 30:1–10]]: the return and gathering promised after the curses.
  - [[Lam. 4]]: the siege of Jerusalem mourned.
  - [[Mosiah 11–12]]: Abinadi's warnings to King Noah's people.
  - [“The Curse of the Covenant: The Deuteronomic Curses in the Book of Mormon”](https://byustudies.byu.edu/article/the-curse-of-the-covenant-the-deuteronomic-curses-in-the-book-of-mormon), a *BYU Studies* article on how Book of Mormon writers used this chapter.

