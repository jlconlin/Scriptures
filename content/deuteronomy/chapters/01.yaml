chapter: 1
title: Eleven Days, Forty Years
tagline: Moses begins his farewell on the plains of Moab by remembering Horeb, the judges he appointed, and the day at Kadesh-barnea when Israel saw the good land and would not go up. Those who refused were sentenced to die in the wilderness; their children, the people now listening, would go in.
when: 'In the land of Moab, east of the Jordan, “in the fortieth year, in the eleventh month, on the first day of the month” ([[Deut. 1:3]]) after Israel came out of Egypt.'

setting: |
  Deuteronomy is Moses' farewell. Israel is camped in the land of Moab at the end of the forty years. Where the King James reads “on this side Jordan,” the Hebrew places Moses' speech east of the river, in the Arabah, the floor of the Great Rift Valley. The generation that left Egypt has largely passed away.

  The book holds Moses' three last discourses, and this one, chapters 1–4, “is introductory.” Its English name comes from the Septuagint, the early Greek translation: *deutero*, “second,” and *nomos*, “law,” so “the second law,” or “the repetition of the law.” Its Hebrew name is simply its opening words, “these be the words.”

  The book presents itself as the words Moses spoke (verse 1), and latter-day revelation names Moses as the author of the five books ([[1 Ne. 5:11]]; [[Moses 1:40–41]]). Even so, scribes and copyists “have left their traces,” and the account of Moses' death in chapter 34 “was surely added by a later hand.”

  Scholars have long compared the book's shape to ancient treaties between a great king and his vassal, the “sovereign-vassal” treaties of the Hittites. In that pattern, verses 1–5 are the preamble, and this chapter opens the historical prologue, which runs to 4:44.

thread: |
  Moses opens his farewell with a failure, not with the law. Twice the Lord “set the land before” Israel and told them to go in and possess it ([[Deut. 1:8]], [[Deut. 1:21]]). The people sent spies, heard that the land was good, and would not go up. Then the Lord told them not to go, and they went and were beaten.

  The aside in verse 2 gives the measure of it. The road from Horeb to Kadesh-barnea was eleven days, yet the speech is dated in the fortieth year. If the older generation had trusted the Lord, “they would have already settled their families in Canaan four decades before.”

  Moses tells the story to the children of those who refused, who now stand at the edge of the land as their parents once did. Their parents had said the little ones would be “a prey.” The Lord answered, “they shall go in thither, and unto them will I give it” ([[Deut. 1:39]]). Chapters 2–3 carry the story from Kadesh to the edge of Moab.

sections:
  - range: 1-5
    heading: Where and when Moses spoke
    plain: |
      These are the words Moses spoke to all Israel east of the Jordan, in the wilderness, in the Arabah opposite the Red Sea, between Paran and Tophel, Laban, Hazeroth and Dizahab. (It is eleven days' journey from Horeb by way of Mount Seir to Kadesh-barnea.)

      In the fortieth year, on the first day of the eleventh month, Moses spoke to the children of Israel everything the LORD had commanded him to tell them. This was after he had defeated Sihon king of the Amorites, who lived in Heshbon, and Og king of Bashan, who lived at Ashtaroth in Edrei. There, east of the Jordan in the land of Moab, Moses began to explain this law. He said:
  - range: 6-8
    heading: “Ye have dwelt long enough in this mount”
    plain: |
      “The LORD our God spoke to us at Horeb and said, ‘You have stayed long enough at this mountain. Turn and set out. Go to the hill country of the Amorites and to all their neighbors: the plain, the hills, the lowlands, the south and the seacoast, the land of the Canaanites, and Lebanon, as far as the great river, the Euphrates. See, I have set the land before you. Go in and take possession of the land the LORD swore to give to your fathers, Abraham, Isaac and Jacob, and to their descendants after them.’
  - range: 9-18
    heading: Judges to share the burden
    plain: |
      “At that time I told you, ‘I cannot carry you by myself. The LORD your God has multiplied you, and today you are as many as the stars of heaven. May the LORD, the God of your fathers, make you a thousand times more than you are, and bless you as He promised! But how can I carry the weight of you by myself, your burdens and your quarrels? Choose wise, understanding and well-known men from each of your tribes, and I will make them your leaders.’ You answered, ‘What you have said is good.’

      “So I took the leading men of your tribes, wise and well-known men, and made them heads over you: commanders of thousands, of hundreds, of fifties and of tens, and officers for your tribes. I charged your judges then: ‘Hear the disputes among your people and judge fairly between a man and his brother, or the foreigner living with him. Show no partiality in judgment. Hear the small and the great alike. Do not be afraid of anyone, for the judgment belongs to God. Any case too hard for you, bring to me, and I will hear it.’ At that time I commanded you everything you were to do.
  - range: 19-25
    heading: From Horeb to Kadesh-barnea, and the spies
    plain: |
      “Then we set out from Horeb and went through all that great and terrible wilderness you saw, on the way to the hill country of the Amorites, as the LORD our God commanded us, and we came to Kadesh-barnea. I said to you, ‘You have come to the hill country of the Amorites, which the LORD our God is giving us. See, the LORD your God has set the land before you. Go up and take it, as the LORD, the God of your fathers, told you. Do not be afraid or discouraged.’

      “Then all of you came to me and said, ‘Let us send men ahead of us to explore the land for us and bring back word of the way we should go up and the cities we will come to.’ The idea seemed good to me, and I took twelve of your men, one from each tribe. They set out into the hill country, came to the valley of Eshcol and explored it. They took some of the fruit of the land in their hands, brought it down to us, and reported, ‘It is a good land that the LORD our God is giving us.’
  - range: 26-33
    heading: The refusal
    plain: |
      “But you would not go up. You rebelled against the command of the LORD your God. You grumbled in your tents and said, ‘The LORD hates us. That is why He brought us out of Egypt, to hand us over to the Amorites to destroy us. Where can we go? Our brothers have made our hearts melt. They say the people are bigger and taller than we are, the cities are large, with walls up to the sky, and they even saw the sons of the Anakim there.’

      “I said to you, ‘Do not be terrified or afraid of them. The LORD your God, who goes before you, will fight for you, just as He did for you in Egypt before your eyes, and in the wilderness. There you saw how the LORD your God carried you, as a man carries his son, all the way you went until you reached this place.’ Yet in spite of this you did not trust the LORD your God, who went ahead of you on the way to find you a place to camp, in fire by night and in a cloud by day, to show you the way to go.
  - range: 34-40
    heading: The oath at Kadesh
    plain: |
      “The LORD heard what you said and was angry, and He swore an oath: ‘Not one man of this evil generation shall see the good land I swore to give your fathers, except Caleb son of Jephunneh. He shall see it, and I will give him and his children the land he has walked on, because he followed the LORD completely.’

      “Because of you the LORD was angry with me too, and said, ‘You also shall not go in there. Joshua son of Nun, who serves you, shall go in. Encourage him, for he will lead Israel to inherit it. And your little ones, whom you said would be taken as plunder, your children who do not yet know good from evil, they shall go in. I will give it to them, and they shall possess it. But as for you, turn around and set out into the wilderness by the way of the Red Sea.’
  - range: 41-46
    heading: Too late, and the defeat at Hormah
    plain: |
      “Then you answered me, ‘We have sinned against the LORD. We will go up and fight, just as the LORD our God commanded us.’ Every one of you strapped on his weapons, thinking it easy to go up into the hill country. But the LORD told me, ‘Tell them: Do not go up and do not fight, for I am not with you, and you will be beaten by your enemies.’

      “I told you, but you would not listen. You rebelled against the LORD's command and arrogantly went up into the hill country. The Amorites who lived in those hills came out against you, chased you like a swarm of bees, and beat you down in Seir as far as Hormah. You came back and wept before the LORD, but the LORD would not listen to you or pay attention. So you stayed in Kadesh many days, as long as you stayed there.

notes:
  - ref: 2
    phrase: There are eleven days’ journey from Horeb
    kind: history
    title: Eleven days that became forty years
    body: |
      Moses' aside about the distance shows what unbelief cost. The road from Horeb (Sinai; see [[Ex. 3:1]]) to Kadesh-barnea, at the southern edge of Canaan, “is quite literally less than a two-week journey by ancient means of travel.” Yet the next verse dates the speech “in the fortieth year” ([[Deut. 1:3]]). Side by side, the two numbers “highlight God’s trustworthiness and the cost of Israel’s former disbelief and disobedience.”

      Kadesh was “a well-watered and fruitful spot in the wilderness of Zin.” Israel reached it about two years after leaving Egypt, and the spies were sent from there. Moses later counts the rest: from Kadesh-barnea to the brook Zered “was thirty and eight years” ([[Deut. 2:14]]). What happened at Kadesh begins at verse 19; the note on verse 22 tells it.
    sources: [ot-minute-deut-1, bd-kadesh, lds-scriptures]

  - ref: 5
    phrase: began Moses to declare this law
    kind: words
    title: Why the law is given again
    body: |
      Moses does not give a new law here; he explains the one already given. The verb rendered “declare” means here to “explain, expound.” So the book's Greek name, meaning second law, misleads if it is taken literally. It “does not imply that he gave them a new law in any sense of the word, nor that he merely repeated what had already been given.”

      The reason for explaining it again is the audience. The people who stood at Sinai are nearly all gone, and “in preparing this new generation to enter into the land of promise, Moses’s speeches are given as part of a covenant renewal ceremony.” The setting at the edge of the land marks “a new beginning of their covenant history.”
    sources: [bdb, ot-manual-dt-1-16, ot-minute-deut-rappleye, ot-minute-deut-1]

  - ref: 9
    phrase: I am not able to bear you myself alone
    kind: history
    title: The judges, retold without Jethro
    body: |
      Moses' account of the judges retells Exodus 18 from his side, and it differs from Exodus in two ways. In Exodus, Jethro watches Moses judge alone from morning to evening and proposes the remedy ([[Ex. 18:13–23]]). Here Jethro is not mentioned, and the proposal is Moses' own. In Exodus “Moses chose able men out of all Israel” ([[Ex. 18:25]]). Here Moses tells the people to choose: “Take you wise men, and understanding, and known among your tribes, and I will make them rulers over you” ([[Deut. 1:13]]).

      Deuteronomy gives no reason for either difference. One older reading suggests that leaving out Jethro “may be due to the summary nature of its review,” though an intentional omission “cannot be excluded” in a book whose interest stays with Israel. The same reading compares the later law of judges ([[Deut. 16:18]]) and notes that having the people choose fits Deuteronomy's emphasis on “the judicial responsibilities of the whole people.”

      Moses also places the appointing “at that time” ([[Deut. 1:9]]), within his memory of Horeb (verse 6). When Jethro came is discussed at [[Ex. 18:5]].
    sources: [lds-scriptures, cambridge-deuteronomy]

  - ref: 22
    phrase: We will send men before us
    kind: history
    title: 'The spies: whose idea, and what followed'
    body: |
      Moses' retelling of the spies (Numbers 13–14) begins with a detail Numbers does not have: the people proposed the mission. In Numbers the Lord tells Moses, “Send thou men, that they may search the land of Canaan” ([[Num. 13:2]]). Here “ye came near unto me every one of you” with the plan, and “the saying pleased me well” ([[Deut. 1:23]]). One older reading finds “no discrepancy of fact” but a “difference of standpoint,” one of several places where Deuteronomy gives the people the initiative. Moses may have welcomed the plan because “it sounded like the people were sincerely planning to trust the Lord in taking possession of their promised land.”

      Numbers tells the rest more fully. Twelve men, one from each tribe, searched the land for forty days and brought back its fruit ([[Num. 13:25–27]]). Ten said its people could not be overcome; only Caleb and Joshua trusted the Lord's promise ([[Num. 13:31–33]]; [[Num. 14:6–9]]). Some of the people wanted a new leader to take them back to Egypt, and when Joshua and Caleb spoke up, “the congregation tried to have them stoned.” Moses pleaded for the people, and the Lord did not destroy them. But no adult over twenty except Caleb and Joshua would enter the land: “each day for a year, shall ye bear your iniquities, even forty years” ([[Num. 14:34]]).

      By naming the forty years at the start (verse 3), Moses showed that “the Lord keeps His word.”
    sources: [lds-scriptures, cambridge-deuteronomy, ot-minute-deut-1, scripture-helps-num]

  - ref: 25
    phrase: It is a good land which the LORD our God doth give us
    kind: structure
    title: The good report at the center
    body: |
      Verses 20–31 can be laid out by who is speaking, and on one reading that arrangement puts the spies' good report in the middle. Moses speaks (verses 20–21), then the people (22), then Moses (23–24); the spies speak (25); then Moses, the people, and Moses again (26–31). In this “chiasmus of speaker,” the inversion “is not with the themes or the keywords of the passage, but rather with the speakers.” It is counted among “four specific usages of chiasmus that are relatively distinctive in Deuteronomy and Jeremiah,” and at its center stands “the all-important positive report of the spies.”
    sources: [sc-knowhy-635]

  - ref: 27
    phrase: ye murmured in your tents
    kind: history
    title: Why Moses says “ye” to the children
    body: |
      Moses tells the refusal at Kadesh to people who were children then, or not yet born, and yet he says “ye”: “ye would not go up,” “ye murmured in your tents” ([[Deut. 1:26–27]]). That his hearers were the next generation is not in doubt: “the original Exodus generation had largely passed away, and those about to enter the land had either been children or not yet born.”

      The text does not explain the “ye.” One older reading takes it as deliberate. By speaking to the living as if they had said it, Moses shows “that the sinful corruption which broke out at that time, and bore such bitter fruit, had not died out with the older generation, but was germinating still in the existing Israel.” The same reading points to what the complaint said. The people called their deliverance from Egypt an act of hatred, “Because the LORD hated us” ([[Deut. 1:27]]), and in that it “presents the appearance of the basest ingratitude.”

      The Lord's answer in Numbers turns the complaint around: “your little ones, which ye said should be a prey, them will I bring in” ([[Num. 14:31]]), and Moses repeats it at verse 39.
    sources: [ot-minute-deut-rappleye, keil-deuteronomy, lds-scriptures]

  - ref: 28
    phrase: the sons of the Anakims
    kind: history
    title: Who the Anakims were
    body: |
      The Anakims were a people who “had settled near Hebron” and were also met farther north. In Numbers the ten spies called them giants ([[Num. 13:33]]). They gave it as a reason Israel could not conquer the land, and the sons of Anak “may have been related to the people of Raphah, from whom Goliath descended.” Moses returns to them at [[Deut. 2:10–11]] and [[Deut. 9:1–2]].
    sources: [bd-anak, scripture-helps-num]

  - ref: 37
    phrase: the LORD was angry with me for your sakes
    kind: scripture
    title: Angry with me for your sakes
    body: |
      Moses links his own exclusion from the land to the people, where Numbers gives a reason of his own. At Meribah the Lord told Moses and Aaron, “Because ye believed me not, to sanctify me in the eyes of the children of Israel, therefore ye shall not bring this congregation into the land” ([[Num. 20:12]]). Numbers tells that episode later in its story, at Kadesh in the wilderness of Zin ([[Num. 20:1–13]]); Moses mentions his sentence here, beside the oath against the people. Deuteronomy, here and again at [[Deut. 3:26]], says “for your sakes.” The two accounts are set side by side, and the question is taken up in full at [[Deut. 3:26]].
    sources: [lds-scriptures]

  - ref: 42
    phrase: for I am not among you
    kind: history
    title: I am not among you
    body: |
      The Lord's warning explains the defeat that follows: Israel went to fight without Him. Numbers gives the visible sign. When the people “presumed to go up unto the hill top,” “the ark of the covenant of the Lord, and Moses, departed not out of the camp” ([[Num. 14:44]]).

      Their confession in verse 41 even repeats the command: “We have sinned against the LORD, we will go up and fight, according to all that the LORD our God commanded us” ([[Deut. 1:41]]). But the command to go up had been withdrawn, and the people who refused to go when told now went when forbidden. They acted “only on their own timetable,” and that “is not discipleship despite the gospel language that passes their lips.” The Amorites chased them “as bees do” and beat them as far as Hormah ([[Deut. 1:44]]).
    sources: [lds-scriptures, ot-minute-deut-1]

christ: |
  The LORD who speaks at Horeb and swears at Kadesh is Jehovah, “the premortal Jesus Christ” (see [[Ex. 3:14]]). In verses 30–33 Moses describes Him as the One who goes ahead. He “goeth before you,” fights for Israel, carries them “as a man doth bear his son,” and searches out a place for their tents “in fire by night … and in a cloud by day” ([[Deut. 1:30–33]]).

  Paul says of the fathers who were “under the cloud” in that wilderness that “they drank of that spiritual Rock that followed them: and that Rock was Christ” ([[1 Cor. 10:1–4]]). The risen Lord told the Nephites, “I am he that gave the law, and I am he who covenanted with my people Israel” ([[3 Ne. 15:5]]). As Moses tells it, the failure at Kadesh was this: “ye did not believe the LORD your God, Who went in the way before you” ([[Deut. 1:32–33]]).

explore: |
  - **The spies and Kadesh.** Read [[Num. 13:1–33]] and [[Num. 14:1–45]] beside verses 19–46, and [[Josh. 14:6–14]] for Caleb's inheritance.
  - **The provocation remembered.** [[Ps. 95:8–11]] and [[Heb. 3:7–19]].
  - **Carried by the Lord.** [[Deut. 1:31]], [[Deut. 32:10–12]], [[Isa. 46:3–4]] and [[Isa. 63:9]].
  - **Sharing the burden.** [[Ex. 18:13–26]] and [[Num. 11:14–17]].
  - **The regions of verse 7.** [The Land](/old-testament/guides/the-land/).

parallels:
  - ref: Num. 13:1–33
    note: The Lord commands the spies to be sent; their report.
  - ref: Num. 14:1–45
    note: The refusal, the sentence of forty years, and the defeat at Hormah.
  - ref: Ex. 18:13–26
    note: Jethro counsels Moses to appoint judges.

