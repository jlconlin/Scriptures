chapter: 14
title: An Holy People unto the LORD
tagline: Because the Israelites are the LORD's children and a holy people, they do not gash themselves for the dead or eat what is unclean, and they eat their tithe before Him, sharing it every third year with the Levite, the stranger, the fatherless and the widow.
when: 'In the plains of Moab, in the fortieth year after the Exodus'

setting: |
  Moses is still giving the code of laws that runs from chapter 12 to chapter 26, in Moab in the fortieth year ([[Deut. 1:3–5]]). Chapter 13 has just dealt with anyone who would lead Israel to other gods. Chapter 14 turns to how a holy people mourns, what it eats and what it does with its harvest.

  Most of it is familiar. The clean and unclean animals of verses 4–20 repeat Leviticus 11 “in all essential points”; the notes there give reasons for the list and the forbidden birds (see [[Lev. 11:7]] and [[Lev. 11:44]]). The ban on boiling a kid in its mother's milk comes for the third time (see the note at [[Ex. 23:19]]). What is Deuteronomy's own is the frame of verses 1–2 and 21 and the way the tithe of verses 22–29 is to be used.

thread: |
  The chapter hangs on one sentence said twice: **“thou art an holy people unto the LORD thy God”** (verses 2 and 21). It opens and closes the food laws, which follow from that declaration. The food code was not given “because the unclean animals were unhealthy but because the Lord wanted to set the Israelites apart from the world.” In one older reading, gashing the body for the dead and eating unclean food were forbidden together because “both of these were opposed to their calling.” Verse 2 calls them “a peculiar people,” the LORD's own (see the note at [[Ex. 19:5]]).

  The tithe of verses 22–29 belongs to the same thought. In the same older reading, as Israel sanctified its food by refusing what was unclean, it sanctified it also by bringing the tithes and firstlings to the place where the LORD would cause His name to dwell and eating them there with joy. So the chapter moves from the grave to the table: first what a holy people does not do with its body and its food (verses 1–21), then what it does with its harvest, eating it before the LORD (verses 22–27) and, every third year, feeding the landless and the poor with it (verses 28–29).

sections:
  - range: 1-2
    heading: Children of the LORD
    plain: |
      You are the children of the LORD your God. Do not cut your bodies or shave the front of your heads in mourning for the dead. For you are a people holy to the LORD your God, and the LORD has chosen you out of all the nations on the earth to be His own treasured people.
  - range: 3-21
    heading: What a holy people eats
    plain: |
      Do not eat anything detestable. These are the animals you may eat: the ox, the sheep and the goat; the deer, the gazelle, the roe deer, the wild goat, the antelope, the wild ox and the mountain sheep. You may eat any animal that has a split hoof divided in two and chews the cud. But of those that only chew the cud or only have a divided hoof, do not eat the camel, the hare or the rock badger: they chew the cud but do not have a divided hoof, so they are unclean for you. The pig has a divided hoof but does not chew the cud, so it is unclean for you; do not eat its meat or touch its carcass. Of everything that lives in the water you may eat whatever has fins and scales; whatever does not is unclean for you. You may eat any clean bird. But do not eat these: the eagle, the vulture, the osprey, the kite and the falcon of every kind, every kind of raven, the owl, the nighthawk, the gull, the hawk of every kind, the little owl, the great owl, the barn owl, the pelican, the carrion vulture, the cormorant, the stork, the heron of every kind, the hoopoe and the bat. Every creeping thing that flies is unclean for you; do not eat it. You may eat any clean flying thing. Do not eat anything that has died of itself. You may give it to the foreigner living in your towns to eat, or sell it to a foreigner passing through, for you are a people holy to the LORD your God. Do not boil a young goat in its mother's milk.
  - range: 22-27
    heading: The tithe eaten before the LORD
    plain: |
      Set apart a tenth of all that your crops produce each year. Eat the tithe of your grain, wine and oil, and the firstlings of your herds and flocks, before the LORD your God in the place He chooses to set His name, so that you may learn to revere the LORD your God always. If the way is too long and you cannot carry it, because the place the LORD your God chooses is too far from you, when He has blessed you, then turn it into money, tie up the money in your hand, and go to the place the LORD your God chooses. Spend the money on whatever you want, cattle, sheep, wine or other strong drink, whatever you desire, and eat there before the LORD your God and rejoice, you and your household. And do not forget the Levite in your towns, for he has no share or inheritance with you.
  - range: 28-29
    heading: The third year's tithe
    plain: |
      At the end of every three years bring out the whole tithe of that year's harvest and store it in your towns. Then the Levite, who has no share or inheritance with you, and the foreigner, the fatherless and the widow in your towns may come and eat their fill, so that the LORD your God may bless you in all the work you do.

notes:
  - ref: 1
    phrase: ye shall not cut yourselves, nor make any baldness between your eyes for the dead
    kind: history
    title: Children of the LORD do not mark themselves for the dead
    body: |
      Moses forbids two rites of mourning, gashing the body and shaving the front of the head, and he grounds the ban in who Israel is: “Ye are the children of the LORD your God.” The rites themselves are not new; the law “simply” repeats [[Lev. 19:28]] and [[Lev. 21:5]], and the note at Leviticus 19:28 says what the cuttings were (the prophets of Baal “cut themselves after their manner,” [[1 Kgs. 18:28]]).

      What kind of sonship is meant? Israel's neighbors could call themselves children of a god too: the Moabites were the sons and daughters of Chemosh ([[Num. 21:29]]), “but the relation was conceived physically.” In one older reading, Israel's sonship is “historical and ethical,” resting “on an act of love on God's part, on His choice or adoption … of the people, and on His deliverance of them from Egypt.” In another, it is “an adoption springing out of the free love of God,” which “binds the son to obedience, reverence, and childlike trust.” Verse 2 says the same in other words: the LORD chose them to be holy and His own.
    sources: [lds-scriptures, cambridge-deuteronomy, keil-deuteronomy]

  - ref: 21
    phrase: thou shalt give it unto the stranger that is in thy gates, that he may eat it; or thou mayest sell it unto an alien
    kind: history
    title: Carrion for the stranger, and the Joseph Smith Translation
    body: |
      As the King James reads, an Israelite may not eat an animal that died of itself, but he may give it to the stranger or sell it to the alien, and Joseph Smith's translation reverses that. The “stranger” is “a man of non-Israelite birth, resident in the promised land,” and the law elsewhere means to secure for him “justice and fair treatment.”

      The Joseph Smith Translation reads “thou shalt not give it unto the stranger … or thou mayest not sell it unto an alien.” The King James wording “gives the impression the Lord has a double standard,” one for Israel and another for strangers; the change corrects that impression.
    sources: [bd-stranger, horton-jst-pentateuch, lds-scriptures]

  - ref: 23
    phrase: thou shalt eat before the LORD thy God, in the place which he shall choose to place his name there, the tithe of thy corn
    kind: history
    title: A tithe the giver ate
    body: |
      In this law the household that pays the tithe eats it, at a feast before the LORD at the chosen place (see the note at [[Deut. 12:5]]), with the Levite at the table (verse 27; see the note at [[Deut. 12:12]]). That surprises a reader who knows the tithe from Numbers, where it is “paid to the Levites, who in their turn give one-tenth of what they receive to the priests” ([[Num. 18:21–28]]; on the tithe itself, see the note at [[Lev. 27:30]]).

      How the two laws fit is not settled. In one older reading, Moses here “recalls the earlier laws concerning the tithe … without repeating them one by one, for the purpose of linking on the injunction to celebrate sacrificial meals at the sanctuary from the tithes and firstlings.” Another older reading holds that the laws of Numbers and Leviticus “fundamentally differ” from Deuteronomy's.

      The meal has its own purpose: “that thou mayest learn to fear the LORD thy God always.” In the first older reading the fear meant is not dread: “Israel might rejoice with holy reverence in the fellowship of its God,” and verse 26 says “thou shalt rejoice.” For a family living far from the chosen place, verses 24–25 let the tithe be sold at home and the money spent there on the meal.
    sources: [bd-tithe, keil-deuteronomy, cambridge-deuteronomy, lds-scriptures]

  - ref: 26
    phrase: for wine, or for strong drink
    kind: words
    title: Wine and strong drink at the LORD's table
    body: |
      The tithe money could buy “whatsoever thy soul lusteth after,” strong drink included, and the words mean what they seem to. “Lusteth” is not a bad word here; it renders a Hebrew word that means “to long or yearn for.” Scripture “usually condemned” *shekar*, an intoxicating drink, and the law keeps it from priests on duty ([[Lev. 10:9]]) and from the Nazirite ([[Num. 6:3]]); here, however, it is “allowable in sacrificial meal Deuteronomy 14:26.” Wine and strong drink “were then commonly used in ceremonial meals.”
    sources: [ot-manual-dt-1-16, bdb]

  - ref: 28
    phrase: At the end of three years thou shalt bring forth all the tithe of thine increase the same year, and shalt lay it up within thy gates
    kind: history
    title: The third year's tithe for the poor
    body: |
      Every third year the tithe stayed in the towns and fed the Levite, the stranger, the fatherless and the widow. Tithing was known among Israel's neighbors, where it “was given as annual offerings to the king.” In Deuteronomy, “every two out of three years, the tithes were to be brought to the temple, given to the Lord, and celebrated with a feast. In the third year, the tithes were to be stored in the cities” for the poor.

      The law closes with its reason: “that the LORD thy God may bless thee in all the work of thine hand.” Chapter 26 gives the words the Israelite was to say before the LORD after giving this tithe: “I have brought away the hallowed things out of mine house, and also have given them unto the Levite, and unto the stranger, to the fatherless, and to the widow” ([[Deut. 26:13]]). The prayer shows “the thoughtful gratitude that should accompany obedience to the commandments and sharing with the poor.”
    sources: [seely-cry-widow, lds-scriptures]

christ: |
  The LORD whose children Israel are is Jehovah, the premortal Christ (see the note at [[Ex. 3:14]]). King Benjamin's people heard a fuller form of verse 1 after they made their covenant: “ye shall be called the children of Christ, his sons, and his daughters; for behold, this day he hath spiritually begotten you” ([[Mosiah 5:7]]), words one reading takes as an allusion to verses 1–2.

  The laws of clean and unclean food “are no longer required of the believers” because they are “fulfilled by the Atonement of Jesus Christ.” He who gave them said, “I am he that gave the law, and I am he who covenanted with my people Israel; therefore, the law in me is fulfilled” ([[3 Ne. 15:5]]).

  The food laws ended, but the calling of verse 2 did not (chapter 7's Witness of Christ gives Peter's “peculiar people” to the Saints). The third-year table of verse 29 has its latter-day form in the Lord's storehouse, where “widows and orphans shall be provided for, as also the poor” ([[D&C 83:6]], the Church's footnote at “widow”).

explore: |
  - [[Lev. 11]]: the full list of clean and unclean animals, and its reason, “ye shall be holy; for I am holy.”
  - [[Deut. 26:12–15]]: the confession made after the third year's tithe.
  - [[Acts 10:9–16]]: Peter's vision, where the line between clean and unclean is taken away.
  - [[Mosiah 5:7–8]]: Benjamin's covenant people become Christ's sons and daughters.

