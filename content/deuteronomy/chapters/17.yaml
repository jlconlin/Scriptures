chapter: 17
title: A King from Among Thy Brethren
tagline: The idolater is judged only on the testimony of two or three witnesses, hard cases go up to the priests and the judge at the chosen place, and a king, if Israel wants one, must be the LORD's choice, keep no great stables, harem or treasury, and read the law all his life.
when: 'In the plains of Moab, in the fortieth year after the Exodus'

setting: |
  Moses is still speaking in Moab, in the fortieth year after the Exodus ([[Deut. 1:3–5]]). After the laws of worship, food, tithe, debt, firstlings and the feasts, the next group of laws deals with the administration of justice. That group began with the local judges at [[Deut. 16:18]], and this chapter carries it on: how a case of idolatry is proved and punished, where a case too hard for the town's judges goes, and what a king must and must not be.

  The last of these, verses 14–20, is “the most succinct summation in the Bible of criteria for kingship.” When the elders asked Samuel for a king, they wanted one “like all the nations” ([[1 Sam. 8:5]]), the words of verse 14. The law also matters to readers of the Book of Mormon, where its rules for kings “are referenced throughout,” from Nephi to Benjamin, Noah and Mosiah (the note at verse 20).

thread: |
  The chapter is about **authority under the law.** Each office in it, the witness, the judge, the priest, the king, is given power and fenced in at once.

  Verse 1 forbids a blemished sacrifice (the blemishes are listed at [[Lev. 22:20–24]]). In one older reading it closes the list of offenses against the LORD's worship that began at [[Deut. 16:21]] with the sacred pole and the pillar. Verses 2–7 then take the gravest case, a man or woman in a town who serves other gods, “either the sun, or moon, or any of the host of heaven” (on that worship, see the note at [[Deut. 4:19]]). The penalty and the refrain “so thou shalt put the evil away” are explained at [[Deut. 13:5]]; what this chapter adds is the procedure. The report must be “inquired diligently” and found “certain” (verse 4), one witness is never enough (verse 6; the rule is set out at [[Deut. 19:15]]), and the witnesses must cast the first stones. One older reading takes the first stones as the witnesses' public proof that they stand behind what they said: they throw first “that they might thereby give a practical proof of the truth of their statement.” The execution took place outside the town, as it had outside the camp in the wilderness, “to indicate the exclusion of the criminal from the congregation.”

  Verses 8–13 send the hard case to the place the LORD will choose (see the note at [[Deut. 12:5]]), and verses 14–20 give the law of the king. The king's law begins with the wish to be “like as all the nations” (verse 14), and Deuteronomy “repeatedly warns the Israelites against becoming like the nations whose land they were dispossessing.”

sections:
  - range: 1-7
    heading: Proven by two or three witnesses
    plain: |
      Do not sacrifice to the LORD your God an ox or a sheep that has a blemish or any defect; that is detestable to the LORD your God. Suppose a man or woman in one of the towns the LORD your God is giving you is found doing evil in His sight, breaking His covenant, going off to serve other gods and bow down to them, or to the sun or moon or any of the stars, which I have forbidden. If you are told of it, look into it thoroughly. If it proves true and certain that this detestable thing has been done in Israel, bring that man or woman out to your town gate and stone them to death. A person is to be put to death only on the evidence of two or three witnesses, never on the evidence of one. The witnesses are to be the first to lay hands on him, and after them all the people. So you will remove the evil from among you.
  - range: 8-13
    heading: The hard case goes up to the chosen place
    plain: |
      If a case in your towns is too hard for you to decide, whether over bloodshed, a legal claim or an injury, go up to the place the LORD your God will choose. Go to the Levitical priests and to the judge who holds office in those days, and ask them; they will give you the verdict. Act on the verdict they give you from that place, and be careful to do all they instruct you. Follow the law they teach you and the ruling they give you, without turning aside from it to the right or to the left. Whoever acts presumptuously and will not listen to the priest who stands there to serve the LORD your God, or to the judge, is to die. So you will remove the evil from Israel, and all the people will hear and fear, and will not act presumptuously again.
  - range: 14-20
    heading: The king the LORD shall choose
    plain: |
      When you have come into the land the LORD your God is giving you, taken possession of it and settled there, and you say, “Let me set a king over me like all the nations around me,” you may indeed set a king over you, but he must be the one the LORD your God chooses. He must be one of your own people; you may not put a foreigner over you who is not your brother. He must not gather many horses for himself, or send the people back to Egypt to get more horses, for the LORD has told you, “You shall never go back that way again.” He must not take many wives, or his heart will turn away, and he must not pile up great amounts of silver and gold. When he takes the throne of his kingdom, he is to write for himself a copy of this law in a book, from the copy kept by the Levitical priests. It is to stay with him, and he is to read it all his life, so that he learns to fear the LORD his God and to keep all the words of this law and these statutes. Then he will not think himself above his brothers or turn from the commandment to the right or to the left, and he and his sons will reign long in Israel.

notes:
  - ref: 9
    phrase: unto the priests the Levites, and unto the judge that shall be in those days
    kind: history
    title: The court at the chosen place
    body: |
      Verses 8–13 set up a court at the sanctuary for the cases a town's judges could not settle, with the priests teaching the law and the judge giving the verdict. Moses had done the same work in the wilderness: the judges Jethro advised him to appoint judged small matters, and “the hard causes they brought unto Moses” ([[Ex. 18:26]]). In one older reading the court at the chosen place carries that pattern into the land. On that reading it was “not a court of appeal,” since “it did not adjudicate after the local court had already given a verdict, but in cases in which the latter would not trust itself to give a verdict at all.”

      The text names two authorities, “the priests the Levites” and “the judge,” and the same reading divides their work: the priests appear more as those who know and teach the law than as actual judges (“as knowing and teaching the law … than as actual judges”), and the judge was “to make the judicial inquiry and pronounce the sentence.” Verse 11 joins them, “the sentence of the law which they shall teach thee,” so that the verdict was to rest on the law the priests kept. That is why refusing it was so grave. The man who “will do presumptuously” and will not hear the priest or the judge (verse 12) was punished “as rebellion against God, in whose name the right had been spoken,” the principle Moses gave the first judges: “the judgment is God's” ([[Deut. 1:17]]).
    sources: [keil-deuteronomy, lds-scriptures]

  - ref: 14
    phrase: I will set a king over me, like as all the nations that are about me
    kind: history
    title: A king like all the nations
    body: |
      Moses allows Israel a king but does not command one, and the reason the people give for wanting him, to be like the nations, is the danger the law guards against. One Latter-day Saint reading puts it plainly: “Human kingship (in place of Yahweh’s kingship) presented yet another way in which the ancient Israelites risked becoming like their idolatrous neighbors,” and so the code “sought to drastically curb the power and prerogatives of the king.” Verse 15 keeps the choice with the LORD and forbids a foreign king.

      The request came, in the very words of this verse, when the elders said to Samuel, “make us a king to judge us like all the nations” ([[1 Sam. 8:5]]). The LORD told Samuel, “they have not rejected thee, but they have rejected me, that I should not reign over them” ([[1 Sam. 8:7]]), and still let them have their king.
    sources: [bowen-law-codes, lds-scriptures]

  - ref: 16
    phrase: he shall not multiply horses to himself, nor cause the people to return to Egypt
    kind: history
    title: Horses, wives, silver and gold
    body: |
      The law names three things the king must not pile up. Horses “were used primarily in warfare,” and the ban may have been meant to keep the people from depending on cavalry “and so cease from trusting in the strength and protection of God.” One Latter-day Saint reading takes the horses to stand for an army and the return to Egypt for leading the people back into bondage or apostasy. Wives were taken “for political as well as personal reasons,” and foreign wives drew a king toward their gods; the text's own reason is “that his heart turn not away” (verse 17). Wealth gathered by a king “often led to oppression and unjust taxation.”

      Solomon's reign shows each of the three. “They brought unto Solomon horses out of Egypt, and out of all lands” ([[2 Chr. 9:28]]); he had “seven hundred wives, princesses, and three hundred concubines: and his wives turned away his heart” ([[1 Kgs. 11:3]]); “when Solomon was old, … his wives turned away his heart after other gods” ([[1 Kgs. 11:4]]). The footnotes also point to Jacob, who condemned the Nephites' many wives by naming “David and Solomon” ([[Jacob 2:24]]).
    sources: [ot-manual-deuteronomy-17-33, halverson-kingship, lds-scriptures]

  - ref: 18
    phrase: he shall write him a copy of this law in a book
    kind: words
    title: A copy of this law
    body: |
      The law tells the king to keep his own copy and read it all his life. The Hebrew word *mishneh* means “double, copy, second,” and here “written copy of law.” The Septuagint, an early Greek translation, rendered the phrase “this repetition of the law,” the meaning of the book's English name (on the name, see the setting of [[Deut. 1:1]]). The Hebrew says only that the king is to have a copy; the law he copies is the one already “before the priests the Levites.”

      What the law wants of the king, then, is a reader. Verses 19–20 give the reason: “that he may learn to fear the LORD his God” and “that his heart be not lifted up above his brethren.” In one Latter-day Saint summary, “God is the king; any human king is to be the chief scriptorian, subject to God.”
    sources: [bdb, lxx-rahlfs, bd-deuteronomy, sc-knowhy-363]

  - ref: 20
    phrase: That his heart be not lifted up above his brethren
    kind: scripture
    title: Kings in the Book of Mormon
    body: |
      The Book of Mormon's kings can be read against this law: Nephi and Benjamin reflect much of it, and Noah inverts it. One Latter-day Saint study finds “close fidelity to the pattern set forth in Deuteronomy 17” in Nephi, Benjamin and Mosiah, and in Noah “the inversion of the expected pattern.”

      Nephi's people asked him to be their king, and he “was desirous that they should have no king” ([[2 Ne. 5:18]]); in one reading the people were “accepting the Lord’s chosen ruler,” since the Lord had made him their “ruler and … teacher” ([[2 Ne. 5:19]]). Benjamin, “chosen by this people, and consecrated by my father,” told his people that he was “like as yourselves” ([[Mosiah 2:11]]), that he had “not sought gold nor silver nor any manner of riches of you” ([[Mosiah 2:12]]), and that he had worked with his own hands so that they “should not be laden with taxes” ([[Mosiah 2:14]]), the footnote the Church sets beside verse 17. Noah was the opposite: “he had many wives and concubines” ([[Mosiah 11:2]]) and taxed a fifth of the people's gold and silver “to support himself, and his wives and his concubines” ([[Mosiah 11:3–4]]). In the same study, Noah's actions are “distinctly opposite” to the law.

      The same reader sees the book of Mosiah as set out in that order, a good king, a bad king, then a good king, so that Mosiah's decision to end the monarchy follows from what the people had seen. Mosiah gave his own reason: “because all men are not just it is not expedient that ye should have a king or kings to rule over you” ([[Mosiah 29:16]]).
    sources: [halverson-kingship, sc-knowhy-717, sc-knowhy-428, lds-scriptures]

christ: |
  The law of the king keeps the throne under another King. The LORD chooses Israel's king (verse 15), and when Israel did ask for a king, He said they had rejected Him, “that I should not reign over them” ([[1 Sam. 8:7]]). In the Book of Mormon, Jacob gives the Lord's own word on kings in the promised land: “I, the Lord, the king of heaven, will be their king, and I will be a light unto them forever, that hear my words” ([[2 Ne. 10:14]]). Read beside this chapter, this suggests that a human king was to be a reader and keeper of the Lord's word because “God himself is the king.”

explore: |
  - [[Ex. 18:13–26]]: the judges of the wilderness and the hard cases brought to Moses, the pattern of verses 8–13.
  - [[1 Sam. 8]]: the request for a king “like all the nations,” and Samuel's warning of what a king would take.
  - [[1 Kgs. 10:14–11:13]]: Solomon's gold, horses and wives, and how his heart was turned.
  - [[Mosiah 2:9–19]] and [[Mosiah 29:13–24]]: Benjamin's account of his reign and Mosiah's case against kings.
  - A short study in *Interpreter*, “Deuteronomy 17:14–20 as Criteria for Book of Mormon Kingship,” sets Nephi, Benjamin, Noah and Mosiah against the criteria of the law.

