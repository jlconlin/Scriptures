chapter: 8
title: Man Doth Not Live by Bread Only
tagline: Moses tells Israel that the forty years of hunger and manna were the LORD's schooling, and warns that the full table of Canaan will be the harder test, for a people who forget where their wealth came from will perish like the nations before them.
when: 'In the plains of Moab, in the fortieth year after the Exodus'

setting: |
  Chapter 8 belongs to the first part of Moses' second address, chapters 5–11, “the Ten Commandments and a practical exposition of them.” Chapter 7 has just warned Israel not to spare the Canaanites and their gods. Chapter 8 turns to a danger that would come after the land was won: that the people, settled and full, would let their hearts be lifted up and forget the LORD (verses 12–14). Against that danger Moses sets the memory of the wilderness, where the LORD had humbled and proved them (verses 2, 16).

  The chapter is best known for one line. When the devil tempted Jesus to turn stones into bread, He answered with verse 3: “It is written, Man shall not live by bread alone, but by every word that proceedeth out of the mouth of God” ([[Matt. 4:4]]). His other two answers came from chapter 6 (see the note at verse 3).

thread: |
  The chapter is about **remembering in plenty what was learned in want.** Its theme is obedience, “that ye may live, and multiply, and go in and possess the land” (verse 1). Obeying is cast as remembering and disobeying as forgetting, and whether in want or in plenty, the people “must remember that they are dependent upon the Lord for their blessings.”

  Verses 2–6 look back. The hunger, the manna, the clothes that did not wear out were a father's discipline, meant to show what was in Israel's heart and to teach it that life comes from the LORD. Verses 7–10 look ahead to a land of brooks, wheat, vines, olives, iron and copper, where Israel is to eat its fill and bless the LORD. Verses 11–18 warn that full tables, new houses and growing flocks lift the heart, until a man says, “My power and the might of mine hand hath gotten me this wealth.” Verses 19–20 say where that leads: a people who forget the LORD and serve other gods will “face the same fate as the Canaanite nations” they are about to replace.

sections:
  - range: 1-6
    heading: What the wilderness taught
    plain: |
      Be careful to keep every commandment I give you today, so that you may live, multiply, and go in and possess the land the LORD swore to give your fathers. Remember the whole journey on which the LORD your God has led you these forty years in the wilderness, to humble you and test you, to know what was in your heart, whether you would keep His commandments or not. He humbled you and let you go hungry, and then fed you with manna, a food neither you nor your fathers had known, to teach you that a person does not live by bread alone, but by everything that comes from the mouth of the LORD. Your clothes did not wear out on you, and your feet did not swell, these forty years. Understand, then, that the LORD your God disciplines you as a father disciplines his son. So keep the commandments of the LORD your God, walk in His ways, and fear Him.
  - range: 7-10
    heading: A good land
    plain: |
      For the LORD your God is bringing you into a good land, a land of streams, springs and deep waters that rise in the valleys and hills; a land of wheat and barley, vines, fig trees and pomegranates; a land of olive oil and honey; a land where you will eat bread without running short and lack nothing; a land whose stones are iron and from whose hills you can dig brass. When you have eaten and are full, bless the LORD your God for the good land He has given you.
  - range: 11-20
    heading: Lest thou forget
    plain: |
      Be careful not to forget the LORD your God by failing to keep His commandments, judgments and statutes that I give you today. When you have eaten your fill and built fine houses to live in, when your herds and flocks grow and your silver and gold increase and everything you have increases, do not let your heart grow proud and forget the LORD your God, who brought you out of Egypt, out of the house of slavery; who led you through that vast and terrible wilderness of fiery serpents and scorpions and thirsty ground with no water; who brought water out of the flint rock for you; who fed you in the wilderness with manna your fathers never knew, to humble you and test you, so that in the end He might do you good. Do not say to yourself, “My own power and the strength of my hand have won me this wealth.” Remember the LORD your God, for He is the one who gives you power to get wealth, so that He may confirm the covenant He swore to your fathers, as He is doing today. If you ever forget the LORD your God and follow other gods, serving and worshiping them, I warn you today that you will surely perish. Like the nations the LORD is destroying before you, so you will perish, because you would not obey the voice of the LORD your God.

notes:
  - ref: 2
    phrase: to humble thee, and to prove thee, to know what was in thine heart
    kind: history
    title: The forty years as a test
    body: |
      Moses calls the forty years a test as well as a punishment. Through most of the books of Moses the wandering “is presented as a punishment for disobedience,” but here it is framed as a test “to know what was in thine heart,” and “these two perspectives are not mutually exclusive.” One older reading explains how the two verbs worked: to humble was to bring the people “by means of distress and privations to feel their need of help and their dependence upon God”; to prove was to place them where they would “reveal what was in their heart.”

      Verse 16 returns to the same two verbs and adds the purpose: “to do thee good at thy latter end.” One older reading takes the “latter end” as Israel's life in Canaan, after the wilderness, and calls that good “the ultimate intention of all the humiliation and trial.”
    sources: [ot-minute-deut-rappleye, keil-deuteronomy]

  - ref: 3
    phrase: man doth not live by bread only
    kind: scripture
    title: The manna's lesson, and the Savior's first answer
    body: |
      The manna was meant to teach Israel that life comes from the LORD, not from food alone, and Jesus answered the devil with the same lesson. In Moses' speech the LORD first let Israel hunger, then fed them with a food “which thou knewest not, neither did thy fathers know,” “that he might make thee know” where life comes from. To thrive, people “need more than for their basic needs to be met”; they need to be “nourished by the good word of God” ([[Moro. 6:4]]).

      The King James prints *word* in italics because the Hebrew has no noun there. It says, literally, “by every produce of the mouth of Jehovah,” that is, “by everything that proceeds out of the mouth of the LORD.” The Greek translation reads “by every word that proceeds out of the mouth of God,” which is how the Savior's answer reads in Matthew: “Man shall not live by bread alone, but by every word that proceedeth out of the mouth of God” ([[Matt. 4:4]]). The Lord gives the line again in latter-day revelation: “For you shall live by every word that proceedeth forth from the mouth of God” ([[D&C 84:44]]).

      All three of His answers to the devil come from Deuteronomy: this verse, then [[Deut. 6:16]] (“Thou shalt not tempt the Lord thy God,” [[Matt. 4:7]]) and [[Deut. 6:13]] (“Thou shalt worship the Lord thy God, and him only shalt thou serve,” [[Matt. 4:10]]; the notes at 6:13 give the wording). Jesus was “led up of the Spirit into the wilderness to be tempted” and “fasted forty days and forty nights” ([[Matt. 4:1–2]]), and His testing in the wilderness, in one Latter-day Saint reading, “reminds readers of Israel's testing in the wilderness in Deuteronomy.” The manna itself, and the Savior's sermon on the bread of life, are in the note at [[Ex. 16:4]].
    sources: [ot-minute-deut-rappleye, biblehub-interlinear, lxx-rahlfs, strathearn-gospels, lds-scriptures]

  - ref: 5
    phrase: as a man chasteneth his son, so the LORD thy God chasteneth thee
    kind: words
    title: Chastening as a father's training
    body: |
      “Chasteneth” here means to discipline and train, not only to punish. The Hebrew verb, *yasar*, means to “discipline, chasten, admonish,” and from that, “to instruct”; a modern translation has “as a parent disciplines a child.” The chastening Moses means is the one he has just described, the hunger and the manna and the clothes that held out (verses 2–4). One older reading calls the verb “to admonish, chasten, educate,” a word that “includes everything belonging to a proper education,” and takes the verse to mean that Israel was to “convince themselves by experience, that their God was educating them as a father does his son.”
    sources: [bdb, nrsvue, keil-deuteronomy]

  - ref: 10
    phrase: When thou hast eaten and art full, then thou shalt bless the LORD thy God
    kind: history
    title: A blessing after the meal
    body: |
      This verse became the basis of the Jewish custom of blessing God after eating. In Judaism “a brief blessing is recited before eating,” but “a series of longer blessings … follows the meal,” a tradition “still maintained in Judaism today.” The practice is in the Mishnah, the written “Oral Torah” of about AD 200, and in the Dead Sea Scrolls. In Moses' speech the blessing is thanks “for the good land which he hath given thee”: the full stomach is to be the moment of remembering, not of forgetting (verses 11–12).

      The Book of Mormon has the same order. When Amulek fed the rejected Alma, “Alma ate bread and was filled; and he blessed Amulek and his house, and he gave thanks unto God” ([[Alma 8:22]]). One Latter-day Saint reading sees in this that Alma, as high priest, “showed here his ample awareness of the law in Deuteronomy”: in both settings “the blessing is an expression of gratitude and thanks for the Lord's blessings of safety and prosperity.”
    sources: [sc-knowhy-115, ot-minute-deut-rappleye]

  - ref: 11
    phrase: Beware that thou forget not the LORD thy God
    kind: structure
    title: Remembering, then unremembering
    body: |
      The warning of verses 11–17 takes the memories of verses 2–10 and runs them backward, so that forgetting undoes remembering. In the first half, remembering the wilderness (verses 2–5) leads to remembering the LORD in the land's plenty (verses 6–10). In the second, forgetting Him in the plenty (verses 11–14) leads to forgetting what He did in the wilderness (verses 14–17). The reversal “creates a kind of ‘unremembering’ effect”: forgetting the LORD's part in present prosperity “undoes their memory of the Lord's blessings in the wilderness,” until the people believe their own “power and might” (verse 17) made them.

      The whole chapter may also form one concentric pattern, opening with the command to obey and the promise of the land (verse 1) and closing with the warning of destruction (verse 20), with the land's blessings in verses 7–9 at its center. The chapter “may possibly have been a model for at least a portion of the wording, message, structure, and ideas” of Alma's account of his conversion to his son ([[Alma 36]]), which also opens and closes with keeping the commandments and prospering in the land, remembers “the captivity of our fathers,” and has the Lord's blessing at its center.
    sources: [ot-minute-deut-rappleye, ehat-asymmetry]

  - ref: 17
    phrase: My power and the might of mine hand hath gotten me this wealth
    kind: history
    title: Wealth and the other gods
    body: |
      To say “my power … hath gotten me this wealth” is the forgetting Moses fears, and the next verses set it beside the warning against other gods. Chapter 6 had warned about houses and vineyards Israel did not build or plant ([[Deut. 6:10–12]]); chapter 8 adds “a subtle nuance”: “even when their efforts are part of their success, they must not forget the One who provided all the conditions needed for that success.” Verse 18 says what wealth is for. The LORD gives “power to get wealth” in order to “establish his covenant which he sware unto thy fathers”.

      Verse 19 follows at once with the warning against walking “after other gods,” which one Latter-day Saint reading takes as the first commandment set directly beside the lesson about wealth. The warning “certainly became literal at times” but “can also be understood more metaphorically as putting their trust in their material resources and their own power.” In that reading, “forgetting God is a kind of idolatry that is seen in the false worship of their ‘own’ accomplishments.”

      The theme page [Speak Not Thou in Thine Heart](/deuteronomy/themes/speak-not-in-thine-heart/) follows the four sentences Israel might “say in thine heart” (7:17; 8:17; 9:4; 18:21) to Paul's righteousness of faith ([[Rom. 10:6]]).
    sources: [lane-redemption]

christ: |
  In the wilderness Jesus Christ lived the lesson Israel was taught there. Hungry after forty days, He would not make bread for Himself, and He answered with verse 3 ([[Matt. 4:4]]; see the note there). The God who fed Israel with manna is the same Lord: “Behold, I am he that gave the law, and I am he who covenanted with my people Israel” ([[3 Ne. 15:5]]). Later, when the people spoke of the manna their fathers ate, He called Himself the true bread from heaven: “I am the bread of life: he that cometh to me shall never hunger” ([[John 6:35]]; see the note at [[Ex. 16:4]]).

  The test of verses 12–14 is a disciple's in prosperity as it was Israel's: “at the very time when he doth prosper his people, yea, in the increase of their fields, their flocks and their herds, and in gold, and in silver … then is the time that they do harden their hearts, and do forget the Lord their God” ([[Hel. 12:2]]). And the life of verse 3 still comes by the word: “feast upon the words of Christ; for behold, the words of Christ will tell you all things what ye should do” ([[2 Ne. 32:3]]).

explore: |
  - [[Matt. 4:1–11]] and [[Luke 4:1–13]]: the Savior's three answers, with [[Deut. 6:13–16]].
  - [[Ex. 16]]: the manna, and [[John 6:31–58]], the bread of life.
  - [[Deut. 6:10–12]] and [[Hosea 13:5–6]]: warnings against forgetting the LORD in plenty.
  - [[Hel. 12:1–6]]: Mormon on a people who forget the Lord in their prosperity.

