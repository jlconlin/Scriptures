chapter: 10
title: What Doth the LORD Require
tagline: Moses finishes the story of the calf with what the LORD gave back, new tables, a continuing priesthood and a tribe to bless in His name, and then asks what the LORD requires in return.
when: 'In the plains of Moab, in the fortieth year after the Exodus'

setting: |
  Chapter 10 finishes a story Moses began in chapter 9: the golden calf at Horeb. Exodus tells the same events in chapters 32–34, with the second tables at [[Ex. 34:1–4, 27–28]]. Moses tells them under the words “not for thy righteousness” ([[Deut. 9:6]]): “Remember, and forget not, how thou provokedst the LORD thy God to wrath in the wilderness” ([[Deut. 9:7]]).

  In verses 1–5 Moses briefly tells how his intercession succeeded: the LORD wrote the law again on new tables, and Moses put them in the ark. Two verses of travel follow (verses 6–7), then the setting apart of Levi (verses 8–9) and the end of the forty days on the mount (verses 10–11). With “And now, Israel” (verse 12) the story turns into a plea.

  The chapter belongs to the first part of Moses' second address, chapters 5–11, “the Ten Commandments and a practical exposition of them.” The second part, the code of laws, begins with chapter 12.

thread: |
  The chapter is about **what the LORD gave back after the calf, and what He asks in return.** Verses 1–11 tell what followed the broken covenant: the tables written again, an ark to keep them in, Eleazar ministering after Aaron died, a tribe set apart “to bless in his name,” and the LORD who “hearkened unto” Moses “at that time also.”

  Then comes the question of verse 12, and its answer is short: fear Him, walk in His ways, love Him, serve Him, keep His commandments. Verses 14–22 give the reasons, and twice they set the LORD's greatness beside His care. He owns the heaven of heavens, yet He chose Israel's fathers (verses 14–15), so they are to circumcise their hearts (verse 16). He is God of gods and Lord of lords, yet He feeds and clothes the stranger (verses 17–18), so they are to love the stranger (verse 19). The chapter ends with the seventy who went down into Egypt now as many as the stars, the promise of [[Gen. 15:5]] kept.

sections:
  - range: 1-5
    heading: The tables written again
    plain: |
      At that time the LORD said to me, “Cut two tablets of stone like the first ones and come up to me on the mountain, and make an ark of wood. I will write on the tablets the words that were on the first tablets, which you broke, and you will put them in the ark.” So I made an ark of shittim wood, cut two tablets of stone like the first, and went up the mountain with the two tablets in my hand. He wrote on the tablets what had been written before, the ten commandments the LORD spoke to you on the mountain out of the fire on the day of the assembly, and the LORD gave them to me. Then I turned and came down from the mountain and put the tablets in the ark I had made, and they are there still, as the LORD commanded me.
  - range: 6-9
    heading: Aaron, Eleazar and the tribe of Levi
    plain: |
      The Israelites traveled from Beeroth of the Jaakanites to Mosera. There Aaron died and was buried, and his son Eleazar served as priest in his place. From there they went to Gudgodah, and from Gudgodah to Jotbath, a land of streams of water. At that time the LORD set apart the tribe of Levi to carry the ark of the LORD's covenant, to stand before the LORD to serve Him, and to bless in His name, as they do to this day. That is why Levi has no share or inheritance among his brothers: the LORD is his inheritance, as the LORD your God told him.
  - range: 10-11
    heading: The LORD would not destroy you
    plain: |
      I stayed on the mountain forty days and forty nights, as the first time, and the LORD listened to me this time too and would not destroy you. The LORD said to me, “Get up and lead the people on their way, so that they can go in and take the land I swore to their fathers to give them.”
  - range: 12-13
    heading: What the LORD requires
    plain: |
      And now, Israel, what does the LORD your God ask of you but to fear the LORD your God, to walk in all His ways, to love Him, to serve the LORD your God with all your heart and all your soul, and to keep the LORD's commandments and statutes that I give you today, for your own good?
  - range: 14-22
    heading: Why He asks it
    plain: |
      The heaven and the heaven of heavens belong to the LORD your God, and the earth and everything in it. Yet the LORD delighted in your fathers and loved them, and chose their descendants after them, you, out of all peoples, as you see today. So circumcise your hearts and stop being stubborn. For the LORD your God is God of gods and Lord of lords, the great, mighty and awesome God, who shows no partiality and takes no bribe (see the note on verse 18). He gives justice to the fatherless and the widow and loves the stranger, giving him food and clothing. So love the stranger, for you were strangers in Egypt. Fear the LORD your God, serve Him, hold fast to Him, and swear by His name. He is your praise and your God, who did for you the great and awesome things you saw with your own eyes. Your fathers went down into Egypt seventy people, and now the LORD your God has made you as many as the stars of the sky.

notes:
  - ref: 1
    phrase: make thee an ark of wood
    kind: history
    title: An ark in the retelling
    body: |
      In Moses' telling the ark is made with the new tables; in Exodus it comes later. In Exodus the LORD gave the directions for the ark before the calf ([[Ex. 25:10]], where the note describes it), Bezaleel built it, “And Bezaleel made the ark of shittim wood” ([[Ex. 37:1]]), and the tables were put in it when the tabernacle was set up ([[Ex. 40:20]]). Here Moses says “I made an ark” ([[Deut. 10:3]]) and puts the tables in it as he comes down the mountain.

      The difference may come from the kind of speech this is, in which Moses “links together such things as were substantially connected, without strictly confining himself to the chronological order, which was already well known from the historical account.” However the order is explained, verse 5 ends with the tables still in the ark as Moses speaks: “there they be” ([[Deut. 10:5]]).
    sources: [lds-scriptures, keil-deuteronomy]

  - ref: 2
    phrase: which thou brakest
    kind: scripture
    title: What the new tables left out
    body: |
      The Joseph Smith Translation sets a limit on the promise that the new tables would carry the old words: the LORD would write them “save the words of the everlasting covenant of the holy priesthood.” It is the change the Joseph Smith Translation makes in Exodus, here “about the same thing but in slightly different words.” What was withheld, and why, is explained at [[Ex. 34:1]], with [[D&C 84:19–27]].
    sources: [jst-deut-10, horton-jst-pentateuch]

  - ref: 6
    phrase: there Aaron died, and there he was buried
    kind: history
    title: Aaron’s death in the middle of the speech
    body: |
      Verses 6–7 break into Moses' speech with a few lines from Israel's travel record, perhaps as a reminder that the priesthood went on after the calf. Moses has just said that the LORD was angry enough to destroy Aaron, and that he prayed for him too ([[Deut. 9:20]]). On this reading Eleazar's succession answers that prayer: Moses “reminds the people of this gracious gift on the part of their God, by recalling to their memory the time when Aaron died and his son Eleazar was invested with the high-priesthood in his stead.”

      The two records of the journey differ. Numbers places Aaron's death on mount Hor, “in the fortieth year” ([[Num. 20:22–28]]; [[Num. 33:38]]), and its list of camps has Moseroth before Bene-jaakan, then Hor-hagidgad and Jotbathah ([[Num. 33:31–33]]). Deuteronomy goes from Beeroth of the children of Jaakan to Mosera and names Mosera as the place of Aaron's death. Of the places named here and in [[Deut. 9:22]], “Only Kadesh-Barnea may be located with any degree of certainty”; the others were “most likely in the wilderness of Shur and the wilderness of Paran to the south.”
    sources: [keil-deuteronomy, lds-scriptures, ot-manual-dt-1-16]

  - ref: 9
    phrase: the LORD is his inheritance
    kind: history
    title: The LORD as Levi’s inheritance
    body: |
      Levi received no share of the land because the LORD Himself was its share, and in practice the tribe lived on what Israel gave to the LORD. The LORD told Aaron, “I am thy part and thine inheritance among the children of Israel” ([[Num. 18:20]]), and the verses after it give the tithe to the Levites “to inherit” ([[Num. 18:24]]). The Levites had “no inheritance in Canaan,” but they had the tithe, 48 cities, and “a claim on the alms of the people at feast times,” a claim Deuteronomy itself makes for them ([[Deut. 12:18–19]]; [[Deut. 14:27–29]]).

      [[Ex. 32:26]] tells who the Levites were and how the tribe stood with Moses at the calf; the note there also takes up verse 8 of this chapter.
    sources: [lds-scriptures, bd-levites]

  - ref: 12
    phrase: what doth the LORD thy God require of thee
    kind: history
    title: What the LORD asks after the calf
    body: |
      After recounting Israel's stubbornness and the LORD's patience, Moses sums up the covenant in five verbs: fear, walk, love, serve, keep. “And now” turns from the story just told to what the LORD asks.

      Love and service stand side by side here as they do in a covenant between a great king and a lesser one: verse 12 is among the passages in Deuteronomy that “equate love with serving God, just as the vassal serves the suzerain.” Verse 20 joins the two again: “him shalt thou serve, and to him shalt thou cleave” ([[Deut. 10:20]]). The command to love Him with all the heart is explained at [[Deut. 6:5]].
    sources: [sc-knowhy-186]

  - ref: 16
    phrase: Circumcise therefore the foreskin of your heart
    kind: symbol
    title: A command to circumcise the heart
    body: |
      To circumcise the heart is to take inward the commitment that circumcision marked on the body, and here Moses commands it. The “therefore” follows from verse 15: the LORD chose the fathers and their seed, and Moses is speaking to that seed, now numerous. Deuteronomy and Jeremiah “seem to imply that the physical act of circumcision is wasted when unaccompanied by an internal commitment to God and his covenants.”

      The second half of the verse says the same thing plainly: be no more stiffnecked, the charge Moses has just made against Israel ([[Deut. 9:6, 13]]).

      Here the circumcised heart is a command; at [[Deut. 30:6]] it becomes a promise that the LORD Himself will circumcise Israel's heart, and the note there treats it in full. Jeremiah repeats the command to Judah ([[Jer. 4:4]]; see the note there).

      The theme page [For He Is Thy Life](/deuteronomy/themes/for-he-is-thy-life/) follows the heart from the wish of 5:29 through this command and 29:4 to the LORD's promise in 30:6.
    sources: [wessel-circumcision]

  - ref: 18
    phrase: loveth the stranger, in giving him food and raiment
    kind: history
    title: The great God and the stranger
    body: |
      The God of gods is the one who takes the side of those with no one to defend them, and Israel is to love as He does. Verse 17 heaps up His titles, then says He “regardeth not persons, nor taketh reward.” Israel's judges are forbidden the same two things in nearly the same words: “thou shalt not respect persons, neither take a gift: for a gift doth blind the eyes of the wise” ([[Deut. 16:19]]); the “reward” He refuses is a bribe. Verse 18 says what such a God does with His power: He sees that the fatherless and the widow get justice, and He feeds and clothes the stranger.

      The command follows from the description. The reason in verse 19 is Israel's own past: “ye were strangers in the land of Egypt.” The law of the stranger is set out at [[Lev. 19:33–34]].
    sources: [seely-cry-widow]

christ: |
  The LORD who wrote the tables again and listened to Moses is Jehovah, the premortal Christ (see the note at [[Ex. 3:14]]). Verse 17 calls Him “God of gods, and Lord of lords,” and John gives the second title to the Lamb, “he is Lord of lords, and King of kings” ([[Rev. 17:14]]), and to the rider called “The Word of God” ([[Rev. 19:13, 16]]). On one older reading these titles are there “transferred to the exalted Son of God.”

  The chapter's gifts come through a mediator: Moses stayed on the mount forty days, and the LORD “hearkened unto me at that time also” ([[Deut. 10:10]]). Exodus's theme [Moses the Mediator](/exodus/themes/moses-the-mediator/) follows that intercession to the Savior, who “ever liveth to make intercession” ([[Heb. 7:25]]).

explore: |
  - [[Ex. 34:1–10]]: the second tables and the LORD's name proclaimed, in Exodus's telling.
  - [[Num. 20:22–29]]: Aaron's death on mount Hor, told in full.
  - [[Micah 6:6–8]]: the question of verse 12 in Micah's words, with the offerings Micah sets aside.

sources: [lds-scriptures, bd-deuteronomy, keil-deuteronomy, jst-deut-10, horton-jst-pentateuch, ot-manual-dt-1-16, bd-levites, sc-knowhy-186, wessel-circumcision, seely-cry-widow]
