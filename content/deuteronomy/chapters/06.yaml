chapter: 6
title: Hear, O Israel
tagline: 'Moses gives Israel its confession, that the LORD alone is their God, and its first commandment: to love Him with everything. He warns that plenty will tempt them to forget, and tells fathers how to answer a son who asks what the law means.'
when: 'In the plains of Moab, in the fortieth year after the Exodus'

setting: |
  Moses is speaking to the children of the generation that came out of Egypt ([[Deut. 2:14–16]]). Chapter 6 belongs to his second address, whose first part (chapters 5–11) is “the Ten Commandments and a practical exposition of them.” Chapter 5 has just repeated the commandments and told how the people, afraid of the voice from the fire, asked Moses to hear for them. The LORD agreed and said to Moses, “I will speak unto thee all the commandments, and the statutes, and the judgments, which thou shalt teach them” ([[Deut. 5:31]]). Chapter 6 opens with the same three words, and with it Moses begins “elaborating on the first commandment.”

  The chapter contains two of the best-known passages of the Old Testament. Verses 4–9, called the Shema from their first Hebrew word, “hear,” became Israel’s daily confession. Jesus quoted them when He was asked which commandment is greatest, and called the command to love God “the first and great commandment” ([[Matt. 22:36–38]]; [[Mark 12:28–30]]). In the wilderness He answered the devil from this chapter twice ([[Matt. 4:7, 10]]).

thread: |
  The chapter is about **loving the LORD alone, and remembering why.** It starts with a pile of words for the law, “the commandments, the statutes, and the judgments” (verse 1), “a common stylistic feature in Deuteronomy” whose effect is cumulative: it “drives home the importance of total obedience to all that God commands” and leaves “no loopholes.” Then come the confession that the LORD is Israel’s God and is one, and the command to love Him with all its heart, soul and might (verses 4–5).

  It falls into four parts. Verses 1–3 say why the law is given: to be done in the land, so that it may go well with Israel. Verses 4–9 give the confession and the command, and fasten the words to the heart, the household, the body and the door. Verses 10–19 look ahead to the land itself, full of houses and wells and vineyards Israel did not make, and warn that a full stomach forgets; the remedy is to fear, serve and swear by the LORD only, not to go after other gods, and not to test Him as at Massah. Verses 20–25 imagine a son asking what all these laws mean, and give the father his answer.

  The answer is a story before it is a rule: “We were Pharaoh’s bondmen in Egypt; and the LORD brought us out” (verse 21), and only after the deliverance and the gift of the land does it reach the commandments, given “for our good always” (verse 24).

sections:
  - range: 1-3
    heading: Why the law is given
    plain: |
      These are the commandments, statutes and judgments that the LORD your God commanded me to teach you, so that you would keep them in the land you are going in to possess, so that you, your son and your grandson would fear the LORD your God and keep all His statutes and commandments that I give you, all your life, and live long. Listen, then, Israel, and be careful to keep them, so that it may go well with you and you may grow into a great people in a land flowing with milk and honey, as the LORD, the God of your fathers, promised you.
  - range: 4-9
    heading: The LORD is one; love Him with everything
    plain: |
      Hear, Israel: the LORD is our God, the LORD is one. You shall love the LORD your God with all your heart, with all your soul, and with all your strength. These words I am giving you today are to be in your heart. Impress them on your children, and talk about them when you sit at home and when you walk on the road, when you lie down and when you get up. Bind them as a sign on your hand, and let them be as bands between your eyes. Write them on the doorposts of your house and on your gates.
  - range: 10-19
    heading: When the land is full, do not forget
    plain: |
      When the LORD your God brings you into the land He swore to your fathers Abraham, Isaac and Jacob to give you, with great and fine cities you did not build, houses full of good things you did not fill, wells you did not dig, vineyards and olive trees you did not plant, and you have eaten and are full, then be careful not to forget the LORD, who brought you out of Egypt, out of the house of slavery. Fear the LORD your God, serve Him, and swear oaths by His name. Do not follow other gods, the gods of the peoples around you, for the LORD your God who is among you is a jealous God; His anger would burn against you and He would destroy you from the face of the earth. Do not put the LORD your God to the test, as you tested Him at Massah. Keep carefully the commandments, testimonies and statutes of the LORD your God that He has given you. Do what is right and good in the LORD’s sight, so that it may go well with you and you may go in and possess the good land the LORD swore to your fathers, driving out all your enemies before you, as the LORD has said.
  - range: 20-25
    heading: When your son asks
    plain: |
      In time to come, when your son asks you, “What do the testimonies, statutes and judgments that the LORD our God commanded you mean?” tell him: “We were Pharaoh’s slaves in Egypt, and the LORD brought us out of Egypt with a mighty hand. Before our eyes the LORD did great and terrible signs and wonders against Egypt, Pharaoh and all his household. He brought us out from there in order to bring us in and give us the land He swore to our fathers. The LORD commanded us to keep all these statutes and to fear the LORD our God, for our good always, so that He might keep us alive, as He has to this day. And it will be righteousness for us if we are careful to keep all this commandment before the LORD our God, as He has commanded us.”

notes:
  - ref: 4
    phrase: The LORD our God is one LORD
    kind: words
    title: What “one LORD” confesses
    body: |
      The confession says that the LORD, Jehovah, is Israel’s God and that Israel is to have Him alone. The Hebrew is six words with no verb, *hear, Israel, YHWH, our God, YHWH, one*, so every translation has to supply “is” somewhere. The King James puts it before “one LORD.” A modern translation reads “The Lord is our God, the Lord alone,” and lists in its margin “The Lord our God, the Lord is one” and “The Lord is our God, the Lord is one” among the other possibilities. The last word, *ʾeḥad*, is the ordinary number “one” but in a few places means “only,” so both renderings lie within the word.

      Every rendering keeps two things. The confession is relational (He is “our God”) and exclusive. Set beside the King James, this rendering brings out that the line acknowledges “the oneness and exclusiveness of Jehovah.” The chapter draws the consequence itself ten verses later: “Ye shall not go after other gods, of the gods of the people which are round about you” (verse 14). Jesus began His answer about the greatest commandment with these words, “Hear, O Israel; The Lord our God is one Lord” ([[Mark 12:29]]); the next note follows that answer.
    sources: [biblehub-interlinear, nrsvue, bdb, scripture-helps-deut, lds-scriptures]

  - ref: 5
    phrase: thou shalt love the LORD thy God
    kind: history
    title: Love as covenant loyalty
    body: |
      The love commanded here is loyalty shown in action, the kind a covenant asks for, and not only a feeling. In the Bible love “is not necessarily referring to an emotional response”; it often describes “a kind of devoted loyalty, a loyalty of action, a ‘covenantal devotion.’” The verses that follow ask for it in deeds: keeping the words, teaching them, and not following other gods. The Shema “demands complete, covenantal loyalty to the Lord.”

      It is “the central and greatest commandment within the covenantal laws,” and Moses returns to it repeatedly (verses 10–13; [[Deut. 10:12]]; [[Deut. 30:6, 16, 20]]). When a lawyer asked Jesus “which is the great commandment in the law?” ([[Matt. 22:36]]), he was “in effect” asking what Israel’s “greatest covenantal obligation” was. The answer was this verse, already “regarded in Judaism as the core of the Jews’ religious identity.” What was “somewhat surprising” was the second commandment Jesus set beside it, from laws about gleaning and justice ([[Lev. 19:18]]).
    sources: [sc-knowhy-517, ot-minute-deut-rappleye, muhlestein-love-neighbor, lds-scriptures]

  - ref: 5
    phrase: with all thine heart, and with all thy soul, and with all thy might
    kind: scripture
    title: Heart, soul, might, and the Savior’s “mind”
    body: |
      “Might” is an unexpected word here. The Hebrew *meʾod* is usually an adverb, “exceedingly” or “very”; here it is a noun, “muchness, force, abundance,” so the command is to love the LORD with all one’s force. The three words come together again when Josiah turns to the LORD “with all his heart, and with all his soul, and with all his might” ([[2 Kgs. 23:25]]).

      Jesus gives four words where Moses gives three. Mark keeps heart, soul and strength and adds “mind” ([[Mark 12:30]]); Matthew has heart, soul and mind ([[Matt. 22:37]]); Luke puts mind last ([[Luke 10:27]]). The Greek translation of Deuteronomy already read “with all thy mind” where the Hebrew has “heart.”

      The Book of Mormon adds “mind” too. Nephi says of Christ, “ye must bow down before him, and worship him with all your might, mind, and strength, and your whole soul” ([[2 Ne. 25:29]]); the words are “similar to Deuteronomy 6:5,” and the Hebrew “all thy soul” could be rendered “your whole soul,” as Nephi has it. Moroni closes the book with “love God with all your might, mind and strength” ([[Moro. 10:32]]).
    sources: [bdb, lxx-rahlfs, sc-knowhy-467, lds-scriptures]

  - ref: 6
    phrase: shall be in thine heart
    kind: symbol
    title: Heart first, then hand, eyes and door
    body: |
      The words go first into the heart and only then onto the hand, between the eyes and on the doorposts: verse 6 comes before the binding and the writing, and the Greek translation reads “in thy heart and in thy soul.” One older reading takes this as the key to the rest: the commandments were to be “an affair of the heart, and not merely of the memory,” and the binding and writing “are figurative, and denote an undeviating observance of the divine commands.”

      Jews came to keep verses 8–9 literally as well, with phylacteries on the arm and forehead and, on the doorframe of the home, a mezuzah holding passages from the Shema; when the customs began is not known, but they were kept in Jesus’ day. Exodus gives the sign on the hand and between the eyes before Deuteronomy does, and the note at [[Ex. 13:9]] explains the phylacteries and the Savior’s words about them. Deuteronomy adds the doorposts of the house and the gates, which [[Ex. 13:9, 16]] do not have.
    sources: [lxx-rahlfs, keil-deuteronomy, scripture-helps-deut]

  - ref: 7
    phrase: thou shalt teach them diligently unto thy children
    kind: words
    title: 'Teach them diligently: sharpen them'
    body: |
      *Teach diligently* translates a verb meaning “whet, sharpen”; in the form the verse uses, it means “teach the words incisively.” Elsewhere it describes the LORD whetting His “glittering sword” ([[Deut. 32:41]]) and arrows made “sharp” ([[Isa. 5:28]]). A modern translation, “Recite them to your children,” gives the repetition but not the sharpness.

      The rest of the verse says how often: sitting and walking, lying down and rising. Taking the verse’s “when thou liest down, and when thou risest up” as the rule, Jews recite the Shema “twice daily, once in the morning and once at night.” Teaching the children is a charge Deuteronomy repeats ([[Deut. 4:9]]; [[Deut. 11:19]]); the question a child will ask comes at verse 20.
    sources: [bdb, nrsvue, sc-knowhy-517, lds-scriptures]

  - ref: 12
    phrase: beware lest thou forget the LORD
    kind: history
    title: Why plenty is the danger
    body: |
      Moses warns that the land’s abundance, not its hardship, is what will make Israel forget the LORD. Verses 10–11 list what Israel will receive and did not make: cities “which thou buildedst not,” houses “which thou filledst not,” wells “which thou diggedst not,” vineyards and olive trees “which thou plantedst not.” A land full of good things they did not work for “may seduce [them] to forget that these blessings were the unmerited gift of God’s grace.”

      One reading sees idolatry in it: “Forgetting God is a kind of idolatry that is seen in the false worship of their ‘own’ accomplishments,” and the abundance of the land “carries with it a tremendous danger of pride and forgetfulness.” That is why, directly after the warning, “the first commandment in the Ten Commandments is essentially repeated” (verses 13–14). Chapter 8 returns to the theme with a nuance: even when Israel’s own work is part of its success, it must not say “My power and the might of mine hand hath gotten me this wealth” ([[Deut. 8:17]]).
    sources: [ot-minute-deut-rappleye, lane-redemption]

  - ref: 13
    phrase: Thou shalt fear the LORD thy God, and serve him
    kind: scripture
    title: Two of the Savior’s answers to the devil
    body: |
      When the devil tempted Jesus in the wilderness, two of His three answers came from this chapter, verses 13 and 16; the third came from [[Deut. 8:3]], where the note takes the three together. Offered the kingdoms of the world for an act of worship, He answered, “Thou shalt worship the Lord thy God, and him only shalt thou serve” ([[Matt. 4:10]]). The word “only” is not in the King James of verse 13, but it is in the Greek translation: “him only shalt thou serve.” A modern translation puts the word in the last clause instead: “by his name alone you shall swear.”

      Set on the pinnacle of the temple and invited to throw Himself down, He answered from verse 16: “Thou shalt not tempt the Lord thy God” ([[Matt. 4:7]]). Massah, where Israel tested the LORD, is explained at [[Ex. 17:7]].
    sources: [lxx-rahlfs, nrsvue, lds-scriptures]

  - ref: 20
    phrase: when thy son asketh thee in time to come
    kind: history
    title: A question about law answered with a story
    body: |
      The son asks what the laws mean, and the father answers not with a reason for each law but with what the LORD did: “We were Pharaoh’s bondmen in Egypt; and the LORD brought us out” (verse 21). Only after the deliverance and the gift of the land (verses 21–23) does the answer reach the commandments (verse 24). On one reading the order is the point: “the Lord first loved Israel by using His might to set them free and giving them a promised land; thus, Israel must show love in return.” Obedience, in this reading, “is rooted in our redemption.”

      Exodus has the son’s question twice, at the Passover and at the redeeming of the firstborn ([[Ex. 12:26]]; [[Ex. 13:14]]; see the note at [[Ex. 12:26]]). The exchange “became a ritual enshrined in Judaism as part of the Passover festivities,” with fathers “rehearsing Israel’s bondage and redemption,” though exactly when it began “is unknown.” The exchange may be reflected in Alma’s counsel to his sons ([[Alma 36–42]]). In the chapter addressed to Helaman, the Exodus comes near the start and the end ([[Alma 36:2–3, 27–29]]). His account of his own deliverance “resembles in a general sense the memorized recitations” of the Exodus, and he “seems to have fulfilled this commandment while also applying this story to his own life.” [When Your Children Ask](/exodus/themes/when-your-children-ask/) follows the question through Exodus.
    sources: [ot-minute-deut-rappleye, lane-redemption, sc-knowhy-419, lds-scriptures]

  - ref: 25
    phrase: it shall be our righteousness
    kind: words
    title: What “our righteousness” means here
    body: |
      “It shall be our righteousness” means that Israel will stand in the right before the LORD by keeping His commandment; it is the father’s last word to the son. A modern translation renders the line “we will be in the right.”
      One older reading takes it that Israel would be “regarded and treated by God as righteous, if we are diligent in the observance of the law,” and adds that this righteousness is “not founded upon the outward (pharisaic) righteousness of works, but upon an earnest striving after the fulfilment of the law, to love God with all the heart; and this love is altogether impossible without living faith.”
    sources: [nrsvue, keil-deuteronomy]

christ: |
  The LORD Israel is to love with all its heart is Jehovah, the premortal Christ (see the note at [[Ex. 3:14]]). In mortality He named love for God “the first and great commandment” ([[Matt. 22:38]]). Nephi teaches, in words similar to verse 5, that Christ is to be worshiped with the whole soul ([[2 Ne. 25:29]]; see the note at verse 5).

  The father’s answer in verses 21–23 is a story of redemption, and the Book of Mormon reads that story as a type. The deliverance from Egypt “foreshadows our own deliverance from sin and death through Christ’s Atonement,” and the obedience it asks for is to be understood “in terms of the gift of Christ’s spiritual redemption, of which the redemption of the Israelites from Egypt was a type.”

explore: |
  - [[Deut. 11:13–21]]: the second passage of the Shema, with the words on the heart, hand and door again.
  - [[Mark 12:28–34]] and [[Matt. 22:34–40]]: the Savior’s answer about the first and great commandment.
  - [[Matt. 4:1–11]] with [[Deut. 8:1–6]]: the three answers to the devil.
  - [[Deut. 8:7–20]]: the warning against forgetting, retold.
  - [[2 Ne. 25:23–30]] and [[Moro. 10:32]]: words like verse 5’s in the Book of Mormon.
  - [[Ex. 12:26–27]], [[Ex. 13:14]] and [[Alma 36]]: the son’s question, and a father’s answer.

