chapter: 12
title: The Place Which the Lord Your God Shall Choose
tagline: Moses opens the code of laws by commanding Israel to tear down the nations' shrines and to bring every offering to the one place the LORD will choose to set His name; meat may be eaten anywhere, but the blood never.
when: 'In the plains of Moab, in the fortieth year after the Exodus'

setting: |
  With this chapter Moses' second address turns from exhortation to statute. Chapters 12–26 are the code of laws at the heart of the book, and they open with worship: every idol and shrine in Canaan is to be destroyed, and the LORD is to be worshiped at one central place only. The code restates what the covenant asks of Israel “in the context of their exclusive relationship with him and their imminent inheritance of the land of promise.”

  The rule of one altar was “a revolutionary law” for Israel's worship, and its later history runs through the books of Kings. Under Josiah, “a contemporary of Lehi,” a book that many scholars take to be some form of Deuteronomy was found in the temple. His reform centralized worship, which in scripture only Deuteronomy 12 commands. Readers of the Book of Mormon meet the rule from the other side, since Lehi built an altar in the wilderness (the note at verse 13).

thread: |
  The chapter is built on one contrast: **their places and His place.** The nations worshiped wherever they pleased, on mountains and hills and under trees (verse 2); “Ye shall not do so unto the LORD your God” (verse 4). Israel is to bring its offerings only to the place He chooses (verses 5–14). The laws that follow are meant to keep Israel “a distinct people in the land from the rest of the nations”; clearing away Canaanite worship and keeping a single altar are both “given to that end.”

  The chapter moves in five steps. Verses 1–4 tear down the shrines. Verses 5–14 name the one place and all that is to be brought there, and they explain why the rule waits: Israel has not yet reached “the rest and … the inheritance” (verse 9), and in the meantime “every man whatsoever is right in his own eyes” (verse 8). One older reading takes that as probably less open idolatry (which did happen in the wilderness) than irregularities the wandering made hard to avoid, “such, for example, as the omission of the daily sacrifice when the tabernacle was not set up.” Verses 15–19 and 20–28 relax the rule for ordinary meat, which may be killed and eaten at home, and hold it firm for two things: the blood is never eaten (why, see [[Lev. 17:11]]), and the holy offerings are eaten only before the LORD. Verses 29–31 warn against asking how the nations served their gods. Verse 32 repeats the warning not to add to the commandment or take from it (see the note at [[Deut. 4:2]]).

sections:
  - range: 1-4
    heading: Tear down their places
    plain: |
      These are the statutes and judgments you are to keep in the land that the LORD, the God of your fathers, is giving you to possess, for as long as you live on the earth. Destroy every place where the nations you are driving out served their gods, on the high mountains, on the hills and under every green tree. Pull down their altars, smash their pillars, burn their sacred poles, cut down the carved images of their gods, and wipe out their names from that place. Do not treat the LORD your God that way.
  - range: 5-14
    heading: The place He will choose
    plain: |
      Instead, seek the place the LORD your God will choose out of all your tribes to put His name there, His dwelling, and go there. Bring there your burnt offerings and sacrifices, your tithes and the contributions of your hand, your vowed and freewill offerings, and the firstborn of your herds and flocks. Eat there before the LORD your God, you and your households, and rejoice in all you have put your hand to, in which the LORD your God has blessed you. You are not to do as we do here today, each man doing what seems right to him, because you have not yet come to the rest and the inheritance the LORD your God is giving you. But when you cross the Jordan and live in the land, and He gives you rest from all your enemies so that you live in safety, there will be a place the LORD your God chooses to make His name dwell. Bring there everything I command you, and rejoice before the LORD your God with your sons and daughters, your servants, and the Levite in your towns, since he has no share or inheritance among you. Be careful not to offer your burnt offerings in any place you happen to see, but only in the place the LORD chooses in one of your tribes; there do all that I command you.
  - range: 15-19
    heading: Meat at home, holy things before the LORD
    plain: |
      Even so, you may kill and eat meat in any of your towns, as much as you want, as the LORD your God blesses you. The ritually unclean and the clean alike may eat it, as they would gazelle or deer. Only do not eat the blood; pour it out on the ground like water. But you may not eat in your towns the tithe of your grain, wine or oil, the firstborn of your herds or flocks, or your vowed, freewill or contributed offerings. Eat them before the LORD your God in the place He chooses, you, your son and daughter, your servants, and the Levite in your towns, and rejoice before the LORD your God in all you have put your hand to. Be careful not to neglect the Levite as long as you live.
  - range: 20-28
    heading: When the border grows
    plain: |
      When the LORD your God enlarges your territory as He promised, and you long to eat meat, eat as much as you want. If the place the LORD your God chooses to put His name is too far from you, kill animals from the herds and flocks the LORD has given you, as I have commanded you, and eat them in your towns as you wish. Eat them as gazelle and deer are eaten; the unclean and the clean may eat alike. Only be firm about not eating the blood, for the blood is the life, and you must not eat the life with the meat. Do not eat it; pour it on the ground like water. Do not eat it, so that it may go well with you and your children after you, when you do what is right in the LORD's sight. But your holy things and your vows, take them to the place the LORD chooses. Offer your burnt offerings there, the meat and the blood, on the altar of the LORD your God; the blood of your sacrifices is to be poured out on His altar, and you may eat the meat. Keep and listen to all these words I command you, so that it may go well with you and your children after you forever, when you do what is good and right in the sight of the LORD your God.
  - range: 29-32
    heading: Do not ask how they served their gods
    plain: |
      When the LORD your God cuts off before you the nations you are going in to dispossess, and you take their place and live in their land, be careful not to be trapped into following them after they have been destroyed before you. Do not ask about their gods, “How did these nations serve their gods?” and say, “I will do the same.” Do not treat the LORD your God that way, for they have done for their gods every abomination the LORD hates; they even burn their sons and daughters in the fire to their gods. Be careful to do everything I command you; do not add to it or take away from it.

notes:
  - ref: 5
    phrase: the place which the LORD your God shall choose out of all your tribes to put his name there
    kind: history
    title: Which place, and why only one
    body: |
      Moses does not name the place: the LORD will choose it, and once Israel has rest in the land every offering is to go there. The text gives its reasons. The nations worshiped wherever they chose (verses 2–4); Israel is to worship where He chooses.

      Scripture names Shiloh first. There the people “set up the tabernacle of the congregation” ([[Josh. 18:1]]), and the LORD later called it “my place which was in Shiloh, where I set my name at the first” ([[Jer. 7:12]]; see the note there). Solomon built the temple at Jerusalem “in the place that David had prepared in the threshingfloor of Ornan the Jebusite” ([[2 Chr. 3:1]]). Jerusalem is never named in Deuteronomy, but “in biblical tradition that temple became the authorized place,” and at its dedication Solomon called it the place where the LORD had said, “My name shall be there” ([[1 Kgs. 8:29]]).

      Worship at one place came slowly. Altars to Jehovah stood on the high places and became local centers of His worship; when idolatry came in, many were turned to other gods, and the reforming kings Hezekiah and Josiah ([[2 Kgs. 18:4]]; [[2 Kgs. 23]]) worked to gather worship into Jerusalem. Sacrifice went on at the high places after the temple was built, and the prophets condemned the high places, until Josiah “finally centralized worship in Jerusalem according to the injunction in Deuteronomy 12.” Whether the law first meant to forbid every altar but one is not settled; the note at verse 13 takes it up.
    sources: [lds-scriptures, seely-lehi-altar, bd-high-places]

  - ref: 12
    phrase: the Levite that is within your gates; forasmuch as he hath no part nor inheritance with you
    kind: history
    title: The household's feast, and the Levite at the table
    body: |
      Many of the offerings brought to the chosen place were eaten there by the whole household, and the Levite was to be at the table because he had no land of his own. Sacrifice in Deuteronomy is a meal as well as an offering: “there ye shall eat before the LORD your God, and ye shall rejoice” (verse 7), and the sons, daughters and servants eat and rejoice too (verses 12, 18). The text gives its own reason for the Levite's place: “he hath no part nor inheritance with you.” Verse 19 adds the charge, “forsake not the Levite as long as thou livest upon the earth.”

      Gathering the offerings to one place touched every household. It changed how tithes and firstlings were eaten, how the holy days were kept and how the Levites were provided for ([[Deut. 18:6–8]]); the feasts, for one, would “no longer be celebrated in the various villages, but only at the central altar.” Chapter 16 sets the stranger, the fatherless and the widow at the same table ([[Deut. 16:11]]).
    sources: [seely-lehi-altar, lds-scriptures]

  - ref: 13
    phrase: offer not thy burnt offerings in every place that thou seest
    kind: scripture
    title: Lehi's altar and the Nephite temples
    body: |
      Lehi built an altar in the wilderness, and the Nephites later offered sacrifice at more than one temple, though this verse forbids burnt offerings “in every place that thou seest.” By Lehi's day, to judge from the charge against King Manasseh ([[2 Kgs. 21:4]]), “the Judahites seem to have understood Jerusalem as ‘the place’ that God chose.” Yet three days' journey from the city, Lehi “built an altar of stones, and made an offering unto the Lord” ([[1 Ne. 2:7]]). Any explanation “must deal with the biblical evidence that, during Lehi’s time, it was widely understood and enforced that Jerusalem was the only place where sacrifice could be offered.”

      Three explanations have been proposed, none of them settled. First, the law may not at first have meant to end all sacrifice away from the main sanctuary, since “altars and sacrifice and even other temples continued at various places” after Israel took the land. Second, Lehi was not a Levite and officiated by the Melchizedek Priesthood, so he and his descendants “may not have been constrained by all of the injunctions of the law of Moses.” Third, the law may have been read in ancient times as applying only in the land of Israel, as its first verse says (“in the land”); one recent study reads a passage of the Temple Scroll, from the Dead Sea Scrolls, that way, though the standard interpretation of that passage differs, and some ancient rabbis did not condemn the Jewish temple of Onias in Egypt. None can be proved, for “the Book of Mormon simply does not provide enough data.”

      The Nephite temples raise the question again. Nephi built one “after the manner of the temple of Solomon” ([[2 Ne. 5:16]]); Benjamin's people brought firstlings “that they might offer sacrifice and burnt offerings according to the law of Moses” at the temple in Zarahemla ([[Mosiah 2:3]]); and there was a temple in Bountiful. The Nephites “seem never to have construed their temples as a single place.” They may have taken Zarahemla as the place of verse 5, but the temple in Bountiful, where the risen Jesus appeared, makes that hard to hold; whatever the reason, the law of one altar “was not operative among them.”
    sources: [shannon-documentary, seely-lehi-altar, lds-scriptures]

  - ref: 15
    phrase: thou mayest kill and eat flesh in all thy gates
    kind: history
    title: Meat at home, blood on the ground
    body: |
      Deuteronomy allows an animal to be killed for food at home, which Leviticus had not allowed. Leviticus 17 required every ox, lamb or goat to be brought to the altar, even for an ordinary meal (see the note at [[Lev. 17:3]]); there “even the slaughter of clean animals was considered a type of sacrifice.” With the one altar far off, Deuteronomy “gave instructions for ‘secular slaughter,’ whereby an animal could be killed for human consumption even where no altar existed.” Verse 21 gives the reason: “If the place … be too far from thee.”

      Such meat was ordinary food, eaten “as of the roebuck, and as of the hart,” and a person who was ritually unclean could eat it. In one older reading, the gazelle and the deer were game animals that could not be offered in sacrifice, so that for them it did not matter whether the eater was clean or unclean. Two things stayed fixed. The blood was poured on the ground (verses 16, 23–24), “presumably as a symbol recognizing the sanctity of life”; why the blood belongs to God is the subject of [[Lev. 17:11]]. And the holy things, tithes, firstlings and vows, were still eaten only at the chosen place (verses 17–18, 26–27).
    sources: [seely-lehi-altar, keil-deuteronomy, lds-scriptures]

  - ref: 31
    phrase: even their sons and their daughters they have burnt in the fire to their gods
    kind: history
    title: Children burned to their gods
    body: |
      Verse 31 names one more practice Israel was not to copy, the burning of children as offerings. Child sacrifice “arguably constituted the worst of those nations’ abominations,” and it is the chapter's last reason not to ask how the nations served their gods. Israel did not keep clear of it: the worship of Molech, a fire god served by burning children, is laid to Solomon, to the Northern Kingdom, and to the kings Ahaz and Manasseh ([[2 Kgs. 16:3]]; [[2 Kgs. 21:6]]). Jeremiah condemns it at Tophet in the valley of Hinnom (see the note at [[Jer. 7:31]]).
    sources: [bowen-law-codes, bd-molech]

christ: |
  The LORD who chooses the place in this chapter is Jehovah, the premortal Christ (see the note at [[Ex. 3:14]]), and the place is where His name dwells. When the risen Lord came to the Nephites He said, “I am he that gave the law, and I am he who covenanted with my people Israel; therefore, the law in me is fulfilled” ([[3 Ne. 15:5]]).

  Jacob's sermon of 2 Nephi 6–10 was given at the temple, which can be read as a place where the Lord chose to put His name (verse 11), and there Jacob gave the people the name the angel had told him: “Christ—for in the last night the angel spake unto me that this should be his name” ([[2 Ne. 10:3]]).

explore: |
  - [[1 Kgs. 8:22–30]]: Solomon's prayer at the place where the LORD set His name.
  - [[Lev. 17:1–11]]: the camp's rule of slaughter that verse 15 relaxes, and why the blood is not eaten.
  - [[2 Kgs. 23:1–25]]: Josiah's reform.
  - [[1 Ne. 2:7]], [[2 Ne. 5:16]] and [[Mosiah 2:3]]: altars, temples and sacrifice among Lehi's people.
  - [[Deut. 4:2]]: the same warning as verse 32.

sources: [lds-scriptures, bd-deuteronomy, bowen-law-codes, seely-lehi-altar, keil-deuteronomy, bd-high-places, shannon-documentary, bd-molech, sc-knowhy-36]
