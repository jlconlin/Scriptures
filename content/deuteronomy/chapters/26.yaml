chapter: 26
title: A Syrian Ready to Perish Was My Father
tagline: At the close of the code of laws, Moses gives Israel two things to say at the sanctuary, over the basket of firstfruits and after the third year's tithe, and then the words of the covenant itself, in which Israel and the LORD each declare the other their own.
when: 'In the plains of Moab, in the fortieth year after the Exodus'

setting: |
  Moses is still speaking in the plains of Moab in the fortieth year after the Exodus ([[Deut. 1:3–5]]). This chapter closes the code of laws in chapters 12–26, the part of his second discourse that “forms the nucleus of the whole book.” It looks ahead to Israel's offerings at “the place which the LORD thy God shall choose” (verse 2; on the chosen place, see [[Deut. 12:5]]).

  Two of its laws pick up threads from earlier in the code. The tithe of the third year, set aside in the towns for the Levite, the stranger, the fatherless and the widow, was first given in [[Deut. 14:28–29]]; here Moses gives the words to be spoken once it has been given. Together, the two passages, with their care for the stranger, frame the core of Deuteronomy's laws. The last verses (16–19) close the discourse with a short statement of the covenant; the fuller renewal of the covenant in Moab comes in [[Deut. 29:1]].

  The words the worshipper says over his basket (verses 5–9) are one of several recitations of the Exodus in the Old Testament (see the note at verse 6). Another is the reply to a son's question in [[Deut. 6:20–24]]; Joshua gives another at Shechem ([[Josh. 24:2–13]]).

thread: |
  The chapter is about words said aloud before the LORD. A worshipper who brings the first of his harvest says, “I profess this day unto the LORD thy God, that I am come unto the country which the LORD sware unto our fathers” (verse 3), and then tells the story of his people from a wandering ancestor to the land “that floweth with milk and honey” (verses 5–10). A householder who has given the third year's tithe says that he has given it to those it was meant for and kept it from anything unclean, and asks the LORD to “look down … from heaven, and bless thy people Israel” (verses 13–15). Then Moses states the covenant as two declarations: Israel has “avouched the LORD this day to be thy God,” and the LORD has “avouched thee this day to be his peculiar people” (verses 17–18).

  The first two declarations are for one Israelite to say; Moses speaks the third to the whole nation. All three rest on the same ground. The land and its harvest are the LORD's gift, kept by the LORD's oath to the fathers; in one older reading, bringing the firstfruits was itself “the practical confession that they were indebted to the Lord for the land.” The gift is to be shared: the worshipper rejoices “thou, and the Levite, and the stranger that is among you” (verse 11), and the tithe goes to “the Levite, the stranger, the fatherless, and the widow” (verse 12). And the people who confess this become “an holy people unto the LORD thy God” (verse 19).

sections:
  - range: 1-11
    heading: The basket of firstfruits
    plain: |
      When you have entered the land the LORD your God is giving you as your inheritance, and you possess it and live in it, take some of the first of all the produce you harvest from the land the LORD your God gives you. Put it in a basket and go to the place the LORD your God will choose to place His name. Go to the priest who is serving at that time and say to him, “Today I declare to the LORD your God that I have come into the land the LORD swore to our fathers to give us.” The priest will take the basket from your hand and set it down before the altar of the LORD your God. Then you shall say before the LORD your God: “My father was an Aramean, close to perishing. He went down into Egypt with only a few people and lived there as a foreigner, and there he became a nation, great, mighty and many. The Egyptians treated us harshly, afflicted us and forced hard labor on us. We cried to the LORD, the God of our fathers, and the LORD heard our voice and saw our affliction, our toil and our oppression. The LORD brought us out of Egypt with a mighty hand and an outstretched arm, with great terror, with signs and wonders. He brought us to this place and gave us this land, a land flowing with milk and honey. And now I have brought the first of the produce of the land that You, O LORD, have given me.” Set it down before the LORD your God and bow down before Him. Then rejoice in all the good things the LORD your God has given you and your household, you, the Levite and the foreigner who lives among you.
  - range: 12-15
    heading: The declaration after the third year's tithe
    plain: |
      In the third year, the year of the tithe, when you have finished setting aside the whole tithe of your harvest and have given it to the Levite, the foreigner, the fatherless and the widow so that they can eat their fill in your towns, say before the LORD your God: “I have removed the holy portion from my house and given it to the Levite, the foreigner, the fatherless and the widow, just as You commanded me. I have not broken any of Your commandments or forgotten them. I have not eaten any of it while in mourning, I have not removed any of it while unclean, and I have not given any of it for the dead. I have obeyed the LORD my God and done everything You commanded me. Look down from Your holy dwelling in heaven and bless Your people Israel and the land You have given us, as You swore to our fathers, a land flowing with milk and honey.”
  - range: 16-19
    heading: Two declarations, one covenant
    plain: |
      Today the LORD your God commands you to keep these statutes and judgments, so keep them and do them with all your heart and all your soul. Today you have declared that the LORD is your God, and that you will walk in His ways, keep His statutes, commandments and judgments, and obey His voice. And today the LORD has declared that you are His own treasured people, as He promised you, and that you are to keep all His commandments; that He will set you high above all the nations He has made, for praise, for fame and for honor; and that you will be a people holy to the LORD your God, as He said.

notes:
  - ref: 2
    phrase: shalt put it in a basket
    kind: history
    title: What the basket of firstfruits confessed
    body: |
      The basket of firstfruits was carried to the sanctuary as a confession that the land was the LORD's gift. The law of firstfruits was already given ([[Ex. 23:19]]); what this chapter adds is the ceremony and the words. The priest sets the basket “before the altar” (verse 4), and the worshipper's first words, “I profess this day … that I am come unto the country which the LORD sware unto our fathers” (verse 3), say what the basket shows: he is in the land, and it came by the LORD's oath.

      The pilgrimage to the sanctuary also carried meaning. The worshipper “carried the basket of firstfruits on a pilgrimage journey from the farm to the sanctuary,” and the story he then recites, of wandering, sojourning, bondage, deliverance and arrival in the land, had “most of which … been symbolically reenacted through the pilgrimage.”
    sources: [pierce-ger, lds-scriptures]

  - ref: 5
    phrase: A Syrian ready to perish was my father
    kind: words
    title: The wandering Aramean
    body: |
      The worshipper's ancestor was an Aramean, described as close to perishing or as lost and straying; where the King James has “Syrian,” the Hebrew has “Aramean.” The word rendered “ready to perish” (*ʾobed*) can mean perishing or being lost and straying; the standard Hebrew lexicon lists this verse under both senses with a question mark and says “perhaps Deuteronomy 26:5” beside lost animals and sheep. A modern translation reads, “A wandering Aramean was my ancestor; he went down into Egypt and lived there as an alien, few in number.” In one older reading the word “signifies not only going astray, wandering, but perishing, in danger of perishing,” and both fit.

      The phrase “my father” may refer to Abraham or Jacob. Abraham “migrated to Aram and from there to the land of promise.” The same older reading takes the father to be Jacob, who took his household down to Egypt ([[Gen. 46:6]]): “it was he who went down to Egypt in few men.” He could be called an Aramean “not only because of his long sojourn in Aramaea,” where he went to Laban ([[Gen. 28:5]]; Gen. 29–31), “but also because he got his wives and children there.” Hosea says it in one line: “Jacob fled into the country of Syria, and Israel served for a wife” ([[Hosea 12:12]]).

      So the confession starts low. Before Israel was a nation, “great, mighty, and populous,” its father was a wanderer, near to perishing, who went down into Egypt with a few people.
    sources: [bdb, nrsvue, keil-deuteronomy, lds-scriptures]

  - ref: 6
    phrase: the Egyptians evil entreated us
    kind: history
    title: The worshipper tells the Exodus as his own
    body: |
      In the middle of verse 6 the recitation turns from “my father” to “us”: every Israelite who brought a basket said that the Egyptians afflicted *us*, that *we* cried, and that the LORD brought *us* out. The words are for “each Israelite … to utter at the altar when bringing the first fruits of the land.” Such recitations, among “some of the earliest Israelite devotional celebrations,” put “God's many acts in Egypt standing at the center of the expression of faith.” Remembering “past blessings from God, especially their deliverance from bondage in Egypt,” is one of the themes of the whole book.

      The recitation echoes Exodus: the affliction and hard bondage ([[Ex. 1:11–14]]), and the cry the LORD heard ([[Ex. 2:23–25]]). It ends where the worshipper stands: “he hath brought us into this place, and hath given us this land” (verse 9). The fathers' story becomes his own, and so, in the next verse, does the harvest: “I have brought the firstfruits of the land, which thou, O LORD, hast given me.”
    sources: [brown-trust-lord, dundas-ancient-israel, lds-scriptures]

  - ref: 11
    phrase: thou, and the Levite, and the stranger that is among you
    kind: history
    title: Bowing down, then rejoicing with the stranger
    body: |
      The ceremony ends with two acts: the worshipper bows before the LORD (verse 10) and then rejoices with his household, the Levite and the stranger (verse 11). The verb “worship” here is the verb of bowing down; “bringing the firstfruits was tied to prostration or bowing down.”

      The other guests had no land of their own to harvest: the Levite, who had “no part nor inheritance” among the tribes ([[Deut. 12:12]]), and the stranger, a foreigner living in Israel. “Unlike the harvest festivals, the list of participants only included the household and landless Levites and refugees, demonstrating that refugees played a special role in the celebration.” The stranger was in this way included “as coheirs of the divine blessings of the land and its produce.”
    sources: [lane-worship, pierce-ger, lds-scriptures]

  - ref: 14
    phrase: I have not eaten thereof in my mourning
    kind: history
    title: Kept from mourning and the dead
    body: |
      The householder declares that he kept the holy tithe from mourning, uncleanness, and anything given for the dead. The tithe of the third year was laid up in the towns for the poor (see the note at [[Deut. 14:28]]); he says he has “brought away the hallowed things out of mine house” (verse 13) and handled them as holy.

      In one older reading, “in my mourning” probably means “mourning for the dead, equivalent to ‘in a mourning condition,’ i.e., in a state of legal (Levitical) uncleanness,” since contact with a dead body made a person unclean ([[Num. 19:11]]). “Neither have I taken away ought thereof for any unclean use” would then mean he did not carry it out while unclean. “Nor given ought thereof for the dead” “most probably refers to the custom of sending provisions into a house of mourning, to prepare meals for the mourners”: such a house was unclean, “consequently nothing could be carried into it of that which was sanctified.” Hosea speaks of “the bread of mourners; all that eat thereof shall be polluted” ([[Hosea 9:4]]). The same reading finds “no good ground for thinking of idolatrous customs” here.

      With the tithe accounted for, he asks the LORD to “look down … from heaven, and bless thy people Israel, and the land which thou hast given us” (verse 15).
    sources: [keil-deuteronomy, lds-scriptures]

  - ref: 17
    phrase: Thou hast avouched the LORD this day to be thy God
    kind: words
    title: 'Avouched: two declarations of the covenant'
    body: |
      “Avouched” means declared or testified, and it makes the covenant a pair of declarations. The Hebrew is a causative form of the common verb “to say”; the standard Hebrew lexicon gives it, for verses 17 and 18, as “avow, avouch,” “literally cause to declare.” A modern translation takes it differently, as an agreement each side obtains from the other: “Today you have obtained the LORD's agreement: to be your God … Today the LORD has obtained your agreement: to be his treasured people.”

      Read either way, the covenant runs both directions in the same words: “Thou hast avouched the LORD … And the LORD hath avouched thee.” Israel promises to walk in His ways and hearken to His voice; the LORD declares Israel “his peculiar people” (His own treasured possession; see the note at [[Ex. 19:5]]) and promises to make it “high above all nations” and “an holy people.” These verses are “one of the finest statements of a covenant found anywhere in scripture,” in which “the Lord ‘avouched’ (promised) to honor Israel and make of her a holy nation.”
    sources: [bdb, nrsvue, ot-manual-deuteronomy-17-33]

christ: |
  The LORD to whom the firstfruits were brought gave the law and fulfilled it: “I am he that gave the law, and I am he who covenanted with my people Israel; therefore, the law in me is fulfilled” ([[3 Ne. 15:5]]; on Jehovah as the premortal Christ, see the note at [[Ex. 3:14]]).

  The New Testament also uses “firstfruits” in speaking of the Resurrection. Paul writes, “But now is Christ risen from the dead, and become the firstfruits of them that slept” ([[1 Cor. 15:20]]), and Jacob urged his brethren to be reconciled to God so that they might “be presented as the first-fruits of Christ unto God” ([[Jacob 4:11]]).

  The worshipper’s confession is still a disciple’s, made to the same Lord: in latter-day revelation His wrath is kindled against none “save those who confess not his hand in all things” ([[D&C 59:21]]). And what the third year’s tithe did for the Levite, the stranger, the fatherless and the widow rests on the same ground in the latter-day Church: the Lord made the abundance, “there is enough and to spare,” and each is to impart his portion “unto the poor and the needy” ([[D&C 104:17–18]]).

explore: |
  - [[Deut. 14:22–29]]: the tithe law that verses 12–15 complete.
  - [[Ex. 19:3–8]]: the covenant at Sinai, where Israel was first called the LORD's “peculiar treasure.”
  - [“The Gēr in the Pentateuch and the Book of Mormon”](https://rsc.byu.edu/covenant-compassion/ger-pentateuch-book-mormon), a Religious Studies Center study of the stranger in the law, including the firstfruits ceremony and the third-year tithe.

