chapter: 18
title: A Prophet from among Their Brethren, Like unto Thee
tagline: Moses provides for the priests and Levites, forbids every Canaanite way of reading the future, and promises instead a prophet like himself, whom scripture names as Christ, with a test for the prophet who speaks without being sent.
when: 'In the plains of Moab, in the fortieth year after the Exodus'

setting: |
  Moses is still speaking in Moab in the fortieth year after the Exodus ([[Deut. 1:3–5]]), inside his code of laws. Chapters 16–18 set out the offices that would lead Israel in the land: judges, the king, “Levitical priests (18:1–8), and the prophet.” Chapter 18 finishes the list with the priests and the prophet.

  The chapter's center, the promise of “a Prophet … like unto me” (verse 15), is “one of the most important texts” of the code. The New Testament made it foundational to the early understanding of Jesus' ministry: Peter preached it ([[Acts 3:22–23]]) and Stephen before the council ([[Acts 7:37]]). In the Book of Mormon, Nephi ([[1 Ne. 22:20–21]]) and the risen Lord Himself ([[3 Ne. 20:23]]) allude to it, “identifying the future prophet as Christ.” Moroni quoted Peter's version to Joseph Smith ([[JS—H 1:40]]). Exodus's theme [Moses the Mediator](/exodus/themes/moses-the-mediator/#prophet) follows the promise from Sinai; this chapter is where Moses makes it.

thread: |
  The chapter finishes Moses' list of Israel's offices with the priests and Levites, who live on what is offered to the LORD, since He is “their inheritance” (verses 1–8), and with the prophet. Between them stands a warning that explains why the prophet is promised: Israel was forbidden “the various spiritual mediums that the Canaanites used to determine God's will” (verses 9–14). “Instead, the Lord promised to raise up a prophet like Moses to communicate His will” (verses 15–19). **How will Israel hear from the LORD once Moses is gone?** Israel will hear from the LORD through a prophet He raises up and speaks through.

  The last verses (20–22) guard the gift. A prophet who speaks in the LORD's name without being sent, or in the name of other gods, is to die, and the test of a word from the LORD is whether it comes to pass. Chapter 13 has the other half of the test, the prophet whose sign comes true but who leads to other gods ([[Deut. 13:1–3]]).

sections:
  - range: 1-8
    heading: The priests' portion
    plain: |
      The Levitical priests, the whole tribe of Levi, are to have no share of land with the rest of Israel. They are to eat the LORD's offerings made by fire, which are His portion. They will have no inheritance among their brothers; the LORD Himself is their inheritance, as He promised them. This is what the priest is owed by the people who offer a sacrifice, whether ox or sheep: the shoulder, the two cheeks and the maw. Give him also the first of your grain, wine and oil, and the first of the fleece of your sheep. For the LORD your God chose him and his sons out of all your tribes to stand and serve in the LORD's name forever. If a Levite comes from any town in Israel where he has been living, and comes with all his heart to the place the LORD will choose, he may serve in the name of the LORD his God like all his fellow Levites who stand there before the LORD. He is to receive the same share of food as they do, besides whatever he gets from selling his family property.
  - range: 9-14
    heading: Not the ways of the nations
    plain: |
      When you come into the land the LORD your God is giving you, do not learn to copy the abominable practices of those nations. Let no one be found among you who makes his son or daughter pass through the fire, or who practices divination, reads omens, tells fortunes or uses sorcery, who casts spells, consults ghosts or spirits, or asks of the dead. Everyone who does these things is abominable to the LORD, and it is because of these abominations that the LORD your God is driving those nations out before you. Be wholehearted with the LORD your God. The nations you will dispossess listen to fortune-tellers and diviners, but the LORD your God has not allowed you to do that.
  - range: 15-19
    heading: A prophet like Moses
    plain: |
      The LORD your God will raise up for you a prophet like me from among your own people; listen to him. That is what you asked of the LORD your God at Horeb on the day of the assembly, when you said, “Let me not hear the voice of the LORD my God again or see this great fire any more, or I will die.” The LORD said to me, “What they have said is good. I will raise up for them a prophet like you from among their brothers. I will put My words in his mouth, and he will tell them everything I command him. Whoever will not listen to My words that he speaks in My name, I will hold him to account.”
  - range: 20-22
    heading: The prophet who presumes
    plain: |
      But a prophet who presumes to speak a word in My name that I have not commanded him to speak, or who speaks in the name of other gods, must die. The question is, “How can we tell a word the LORD has not spoken?” When a prophet speaks in the LORD's name and the thing does not happen or come true, that is a word the LORD has not spoken. The prophet has spoken it presumptuously; do not be afraid of him.

notes:
  - ref: 1
    phrase: The priests the Levites, and all the tribe of Levi
    kind: history
    title: The priests the Levites
    body: |
      Deuteronomy's phrase “the priests the Levites” speaks as though every Levite were a priest. Scripture speaks both ways: the Levites are “sometimes spoken of as distinct from the priests,” and sometimes “as though all Levites were also priests,” as here and at [[Josh. 3:3]]; elsewhere the Levites' work was “to assist the priests.”

      Why the tribe had no land, and lived on the LORD's offerings, is explained at [[Deut. 10:9]]: in place of land they had the tithe, cities to live in, “and a claim on the alms of the people at feast times.”
    sources: [bd-levites, lds-scriptures]

  - ref: 3
    phrase: the shoulder, and the two cheeks, and the maw
    kind: history
    title: Shoulder, cheeks and maw
    body: |
      Verse 3 names what a worshiper owed the priest when he sacrificed an ox or a sheep: the shoulder, which is the foreleg; the cheeks; and the maw, “the fourth stomach of ruminant animals.” Why these three is not said. One older reading treats them as choice pieces from the head, legs and body: “the shoulder at least, and the stomach, which was regarded as particularly fat, are seen at once to have been especially good.”

      Leviticus gave the priests a different share of the peace offering, the breast and the right thigh (see the note at [[Lev. 7:32]]). The same older reading takes verse 3 as no contradiction but “a further gift to the priests on the part of the people,” added “probably” to make up for what the priests lost when meat no longer had to be killed at the altar ([[Deut. 12:15]]). Which animals the gift came from was disputed in antiquity: Philo, Josephus and the Talmud applied it to every animal slaughtered at home, and that reading has its critics.
    sources: [keil-deuteronomy]

  - ref: 6
    phrase: if a Levite come from any of thy gates out of all Israel, where he sojourned
    kind: history
    title: A country Levite at the chosen place
    body: |
      Verses 6–8 protect a Levite living in one of Israel's towns who wants to serve at the sanctuary. The Levites had no tribal land; they were given cities among the other tribes and so “were dependent upon the people to provide for their needs.” Their neighbors were to provide for those who lived among them ([[Deut. 14:27]]), but “once the central sanctuary (the temple in Jerusalem) was built, any Levite in Israel could come to minister there and be provided for.” Verse 7 says the Levite who comes there may serve “as all his brethren the Levites do.”

      “Sojourned” here means he lived among the tribes without hereditary land, like a resident stranger. “Like portions” means the newcomer eats the same share as those already serving. Verse 8 adds that his share is “beside that which cometh of the sale of his patrimony”: in one older reading, apart from whatever he received from selling “the property which he possesses according to his family descent.” A Levite had no tribal land, but he might still own family property, and the share at the altar is not cut because of it.
    sources: [ot-minute-deut-rappleye, keil-deuteronomy]

  - ref: 10
    phrase: or that useth divination, or an observer of times, or an enchanter, or a witch
    kind: history
    title: Every way of reading the future
    body: |
      Verses 10–11 pile up terms for learning hidden things by magic, forbidding every kind. Divination is “any superstitious method of trying to discover the course of future events,” found “among all nations and in every age” and condemned throughout scripture. One older reading takes the list as deliberately complete: Moses “groups together all the words which the language contained for the different modes of exploring the future and discovering the will of God, for the purpose of forbidding every description of soothsaying.” Among them are one who binds by spells, perhaps “by magical knots,” and the necromancer, one who “sought oracles from the dead.” Two of the terms are explained where Leviticus first forbids them, the familiar spirit and the wizard (see the note at [[Lev. 19:31]]); Isaiah later mocks the same practitioners “that peep, and that mutter” ([[Isa. 8:19]]; see the note there).

      The list opens with the one who “maketh his son or his daughter to pass through the fire,” the rite Leviticus forbids as giving a child to Molech (see the note at [[Lev. 18:21]]). The same older reading suggests it heads the list “to show the inward connection between soothsaying and idolatry.”
    sources: [bd-divination, keil-deuteronomy]

  - ref: 13
    phrase: Thou shalt be perfect with the LORD thy God
    kind: words
    title: Perfect with the LORD
    body: |
      “Perfect” in verse 13 can mean whole, undivided in loyalty. The Hebrew *tamim* is “complete, whole,” “entire,” and as a noun “integrity.” In one Latter-day Saint reading, verse 12 shows that God wanted His people to reject their neighbors' sins and “be perfect” with Him, that is, to covenant to follow Him; “in the covenantal context ‘perfect’ is a synonym to faithfulness, loyalty, and trustworthiness.”

      The same study reads the Savior's “Be ye therefore perfect” ([[Matt. 5:48]]; [[3 Ne. 12:48]]) in that light: He “may have been commanding them to be made whole through making covenants with Him.”
    sources: [bdb, sc-knowhy-335]

  - ref: 14
    phrase: but as for thee, the LORD thy God hath not suffered thee so to do
    kind: history
    title: Instead of diviners, a prophet
    body: |
      Verse 14 is the turn from what Israel may not do to what the LORD will give in its place: Israel was forbidden the Canaanites' mediums for learning God's will, and “instead, the Lord promised to raise up a prophet like Moses to communicate His will.” The two halves answer each other in the words: the nations “hearkened unto” diviners (verse 14); “unto him ye shall hearken” (verse 15).

      Philo links the ban on diviners with the promise of a prophet. After describing people's urge to seek the future “through divination and omens, as condemned in Deuteronomy 18:14,” goes on, “A prophet possessed by God will suddenly appear and give prophetic oracles.”
    sources: [ot-minute-deut-rappleye, seely-prophet-like-moses]

  - ref: 15
    phrase: a Prophet from the midst of thee, of thy brethren, like unto me
    kind: christ
    title: Who the prophet is
    body: |
      Several passages of scripture name the prophet as Jesus Christ. Nephi declares “that this prophet of whom Moses spake was the Holy One of Israel” ([[1 Ne. 22:21]]); Peter applies the verses to Jesus ([[Acts 3:22–23]]); the risen Lord says, “I am he of whom Moses spake” ([[3 Ne. 20:23]]); and Moroni told Joseph Smith “that that prophet was Christ” ([[JS—H 1:40]]).

      The singular “Prophet” may also refer to a line of prophets. In context, “it seems more likely that ‘prophet’ is meant in a collective sense, referring to the future succession of prophets,” as the singular “king” of chapter 17 means a line of kings and “the Levite” of verse 6 every Levite. Later readers took it as one figure, and in the period between the Testaments some named the figure Elijah; naming him the Messiah is distinctive to the New Testament, and the Book of Mormon's naming him so in Nephi's day “may be best explained by prophetic foresight.”

      Latter-day Saint writers also read the prophecy as having further fulfillments. It is read as having “a dual fulfillment” that “embraces both Christ's first and second comings.” It is also held that “the Prophet Joseph Smith also represents a fulfillment of this prophecy, as do his successors,” and the Lord said Joseph received revelations “even as Moses” ([[D&C 28:2]]).
    sources: [lds-scriptures, seely-prophet-like-moses, benson-prophet-like, bowen-law-codes, scripture-helps-deut]

  - ref: 16
    phrase: Let me not hear again the voice of the LORD my God, neither let me see this great fire any more, that I die not
    kind: history
    title: Why the promise begins at Horeb
    body: |
      The promise of a prophet is the LORD's answer to Israel's own request at Sinai. When the LORD spoke the Ten Commandments from the fire, the people begged Moses to go near and hear for them ([[Deut. 5:23–27]]; [[Ex. 20:18–19]]), and the LORD said, “They have well spoken” (verse 17; compare [[Deut. 5:28]]). Their “rejection of the immediate presence of God and a request for human intermediaries served as the basis for the giving of this prophecy,” and many scholars read it as an explanation of why Israel had prophets at all.

      The request at Horeb makes Moses the pattern for later prophets. He is rarely called a prophet in so many words; apart from this chapter, which implies it, [[Deut. 34:10]] is “the only passage that explicitly refers to Moses as a prophet” in the five books.
    sources: [bowen-law-codes, seely-prophet-like-moses]

  - ref: 18
    phrase: will put my words in his mouth
    kind: scripture
    title: My words in his mouth
    body: |
      “Like unto thee” points to Moses' many roles: the allusion “evokes all of the characteristics known of Moses through the biblical text: leader, lawgiver, teacher, worker of miracles, and one who received revelation and spoke with the Lord ‘face to face.’” Verse 18 names the core of it, a man who speaks only what the LORD puts in his mouth.

      Later prophets were described in Moses' terms. “The figure of Samuel shows characteristics of a prophet like Moses,” and Elijah is compared with him. Jeremiah's call echoes verse 18 directly: “Behold, I have put my words in thy mouth” ([[Jer. 1:9]]), and Jeremiah “understood himself to be a prophet like Moses.” Yet the book closes by saying “there arose not a prophet since in Israel like unto Moses” ([[Deut. 34:10]]). On one reading the two fit, since later prophets resembled Moses in some ways without equaling him: later prophets were “presented as being like him in various ways,” and “eventually Jesus rose up as the prophet like Moses in the full and complete sense.”
    sources: [seely-prophet-like-moses, ot-minute-deut-rappleye]

  - ref: 19
    phrase: I will require it of him
    kind: scripture
    title: I will require it of him
    body: |
      Verse 19 makes refusing the prophet a matter between the hearer and God: the LORD Himself will call the one who will not listen to account. Peter gives the penalty as “every soul, which will not hear that prophet, shall be destroyed from among the people” ([[Acts 3:23]]); the risen Lord gives it as “cut off from among the people” ([[3 Ne. 20:23]]). The prophets raised up this way are, “in a legal sense, witnesses” against those who refuse them.

      Peter connected the prophecy with “the times of refreshing” and the “restitution of all things” ([[Acts 3:19–21]]), and one Latter-day Saint reading takes him to mean that those who will not hear Christ “will be destroyed at his Second Coming.” Moroni put the same penalty in the future in 1823: “the day had not yet come when ‘they who would not hear his voice should be cut off from among the people,’ but soon would come” ([[JS—H 1:40]]).
    sources: [lds-scriptures, bowen-law-codes, benson-prophet-like]

  - ref: 22
    phrase: if the thing follow not, nor come to pass
    kind: scripture
    title: The test of a prophet
    body: |
      Verses 20–22 give a test for the prophet who claims to speak for the LORD without being sent: if what he foretells does not happen, the LORD did not speak it. The test has a limit built in. Under it “true prophecy … will be known only by its fulfillment,” so that “no prophecy can have authority at the time of its proclamation.” The test “could work when a prophecy's fulfillment was expected to take place in a reasonably short timeframe,” as when Jeremiah set his word against Hananiah's and Hananiah died within the year (see the note at [[Jer. 28:9]]). It could not settle a prophecy of things far off. When Jacob prophesied of Christ, “many hundred years hence” ([[Jacob 7:7]]), one reading of Sherem's charge is that he argued such far-off prophecies should not easily be tolerated under the law.

      The reverse does not hold: a sign that comes true does not prove the prophet who leads Israel after other gods (see the note at [[Deut. 13:1]]). The penalty of verse 20 was death, and at Abinadi's trial King Noah's priests were looking for grounds to accuse him, since “false prophecy being a capital offense, those found guilty of it were worthy of death.” Verse 22 ends by telling the people not to fear the prophet: “thou shalt not be afraid of him.”
    sources: [sc-knowhy-554, sc-knowhy-89, lds-scriptures]

christ: |
  The Book of Mormon teaches that the LORD who promises the prophet (Jehovah; see the note at [[Ex. 3:14]]) is himself the prophet: the prophet of whom Moses spoke is “the Holy One of Israel” ([[1 Ne. 22:21]]), and Abinadi, before Noah's priests, taught that “God himself should come down among the children of men” ([[Mosiah 13:34]]). 

  Matthew's Gospel is read as setting out to show that Jesus was a prophet like Moses, and in the Sermon on the Mount He gives a new law, “a lawgiver like Moses.” The risen Lord said it of Himself: “I am he of whom Moses spake” ([[3 Ne. 20:23]]).

explore: |
  - [[Deut. 5:22–31]] and [[Ex. 20:18–21]]: the request at Horeb that verse 16 recalls.
  - [[Acts 3:19–26]] and [[Acts 7:37]]: Peter and Stephen preach the promise.
  - [[1 Ne. 22:20–21]] and [[3 Ne. 20:23]]: the Book of Mormon names the prophet.
  - [[Deut. 13:1–5]] and [[Jer. 28]]: the other test of a prophet, and the test in verse 22 applied.
  - [[Jacob 7]]: Sherem's challenge to a prophet of things far off.
  - [Moses the Mediator](/exodus/themes/moses-the-mediator/#prophet): the promise traced from Sinai to Christ.

