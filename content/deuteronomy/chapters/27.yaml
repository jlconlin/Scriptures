chapter: 27
title: All the People Shall Say, Amen
tagline: Moses commands Israel to write the law on plastered stones in the land, build an altar on mount Ebal, and answer twelve curses with “Amen.”
when: 'In the plains of Moab, in the fortieth year after the Exodus'

setting: |
  With chapter 27 the book turns from the code of laws (chapters 12–26) to its third discourse (chapters 27–30), which contains “a solemn renewal of the covenant and an announcement of the blessings of obedience and the curses upon disobedience.” Here a narrator speaks of Moses in the third person, standing “with the elders of Israel” (verse 1) and then “the priests the Levites” (verse 9).

  The chapter looks ahead to “the day when ye shall pass over Jordan.” It plans a covenant-renewal ceremony “at Shechem and on the mountains of Ebal and Gerizim that rise on either side of this town,” as [[Deut. 11:29]] had already announced. Ancient covenants set out their terms and then what would follow from keeping or breaking them, and “both blessings and cursings are also present in the covenant renewal at Mt. Ebal.”

  Joshua did it. After the fall of Ai he “carried out the instructions Moses had given,” building the altar on Ebal, offering sacrifices, writing the law on stones, and reading the blessings and cursings before the tribes ([[Josh. 8:30–35]]).

thread: |
  The chapter is about setting the law up in the land. It opens with large stones set up on mount Ebal and the law written on them “very plainly” (verses 2–8). Beside the stones stands an altar of whole stones for burnt offerings and peace offerings, with a meal and rejoicing before the LORD (verses 5–7). Then Moses and the priests declare that “this day thou art become the people of the LORD thy God” (verse 9).

  The second half is the ceremony itself: six tribes on Gerizim, six on Ebal, and the Levites calling out twelve curses, each answered by the whole people with “Amen” (verses 11–26). The sins named are idolatry, contempt for parents, moving a boundary stone, misleading the blind, denying justice to the weak, forbidden sexual relations, murder in secret and murder for a bribe. Two curses mention secrecy: “in a secret place” and “secretly” (verses 15, 24). One older reading takes the whole list as examples, most of them sins that “could easily be concealed from the judicial authorities.” The last curse gathers them all: whoever does not uphold “all the words of this law to do them” (see the note on verse 26).

sections:
  - range: 1-8
    heading: The law on stones, and an altar on Ebal
    plain: |
      Moses and the elders of Israel commanded the people: Keep every commandment I am giving you today. On the day you cross the Jordan into the land the LORD your God is giving you, set up large stones and coat them with plaster. Write on them all the words of this law when you have crossed, so that you may enter the land the LORD your God is giving you, a land flowing with milk and honey, as the LORD, the God of your fathers, promised you. When you have crossed the Jordan, set up these stones on mount Ebal, as I command you today, and coat them with plaster. Build an altar there to the LORD your God, an altar of stones; do not use any iron tool on them. Build the altar of the LORD your God of uncut stones, and offer burnt offerings on it to the LORD your God. Offer peace offerings, eat there, and rejoice before the LORD your God. And write on the stones all the words of this law, very clearly.
  - range: 9-10
    heading: Today you have become His people
    plain: |
      Then Moses and the Levitical priests said to all Israel: Pay attention and listen, Israel. Today you have become the people of the LORD your God. So obey the voice of the LORD your God, and keep His commandments and statutes, which I am giving you today.
  - range: 11-14
    heading: The tribes on the two mountains
    plain: |
      That same day Moses commanded the people: When you have crossed the Jordan, these tribes shall stand on mount Gerizim to bless the people: Simeon, Levi, Judah, Issachar, Joseph and Benjamin. And these shall stand on mount Ebal for the curse: Reuben, Gad, Asher, Zebulun, Dan and Naphtali. The Levites shall call out in a loud voice to all the men of Israel:
  - range: 15-26
    heading: Twelve curses, and the people's Amen
    plain: |
      Cursed is the man who makes a carved or cast idol, the work of a craftsman's hands, detestable to the LORD, and sets it up in secret. And all the people shall answer, Amen. Cursed is anyone who treats his father or mother with contempt. Cursed is anyone who moves his neighbor's boundary stone. Cursed is anyone who leads a blind man off the road. Cursed is anyone who denies justice to the stranger, the fatherless or the widow. Cursed is anyone who sleeps with his father's wife. Cursed is anyone who lies with an animal. Cursed is anyone who sleeps with his sister, his father's daughter or his mother's daughter. Cursed is anyone who sleeps with his mother-in-law. Cursed is anyone who strikes his neighbor secretly. Cursed is anyone who takes a bribe to kill an innocent person. Cursed is anyone who does not uphold all the words of this law by doing them. And all the people shall say, Amen.

notes:
  - ref: 2
    phrase: plaster them with plaster
    kind: history
    title: Law written on plastered stones
    body: |
      The stones were coated with plaster so that the law could be written on them. One older reading explains the practice from Egypt: the writing was “to be inscribed upon the plaistered stones, as was the custom in Egypt,” where walls and monuments were whitened first and then painted.

      What went on the stones is “all the words of this law” (verses 3, 8), which the same reading takes as the laws themselves, “not, indeed, the entire Pentateuch, with its historical narratives,” but “the commandments, statutes, and rights of the Thorah.” Joshua's record says only that “he wrote there upon the stones a copy of the law of Moses” ([[Josh. 8:32]]).

      The altar beside the stones is a different structure, of “whole stones” untouched by iron (verses 5–6), the rule given first at Sinai (see the note on [[Ex. 20:25]]).
    sources: [keil-deuteronomy, scripture-helps-josh]

  - ref: 4
    phrase: in mount Ebal
    kind: history
    title: Ebal, or Gerizim?
    body: |
      The Hebrew text puts the stones and the altar on Ebal, the mountain of the curse (verse 13); the Samaritans' Torah, at this verse, puts the place of worship on Gerizim, the mountain of blessing. The Samaritans “only adhered to their own version of the Torah,” and held that “the properly designated location for a central place of worship was Mount Gerizim, not Mount Ebal or, as later dictated, Jerusalem (see Samaritan Pentateuch, Deuteronomy 27:4),” a belief they carried as far as building a temple of their own.

      The Hebrew text gives no reason why the altar should stand on the mountain of the curse.
    sources: [oshb-wlc, matson-between-testaments]

  - ref: 9
    phrase: this day thou art become the people of the LORD thy God
    kind: history
    title: This day thou art become the people of the LORD
    body: |
      “This day” marks a renewal of the covenant, not its first making. This is “one of the first references to a covenant-renewal ceremony in the Bible,” when the people publicly recommitted themselves at a time of crisis or transition. Chapter 26 has just recorded both sides of the agreement ([[Deut. 26:17–18]]), and the covenant in Moab is taken up in full at [[Deut. 29:1]].

      Besides carrying out the ceremony after Ai (see the Background), Joshua, near his death, gathered the people (see [[Josh. 24:25]]) “at Shechem as prescribed by Moses, between the twin mountains of Ebal and Gerizim, in order to renew the covenant.”
    sources: [seely-covenant-renewal]

  - ref: 12
    phrase: These shall stand upon mount Gerizim to bless the people
    kind: history
    title: Who stood on which mountain
    body: |
      The six tribes on Gerizim all descend from Jacob's two wives, Leah and Rachel; on Ebal stand the four sons of the two handmaids, with Reuben and Zebulun. The text does not say why. One older reading supposes that the wives' sons were given the blessing as the more honored line. Reuben joined the other side “because he had forfeited his right of primogeniture by his incest” (see [[Gen. 49:4]]), and Zebulun “as the youngest son of Leah,” to make six and six.

      Joshua's ceremony after the fall of Ai shows where the Levites stood: half the tribes stood on each mountain, and the Levites, “bearing the ark of the covenant, stood in the valley between the two mountains.”
    sources: [keil-deuteronomy, scripture-helps-josh]

  - ref: 15
    phrase: And all the people shall answer and say, Amen
    kind: words
    title: The people’s Amen
    body: |
      By answering “Amen” to each curse, the people affirmed it. The word means “firm, true,” and here it is used “to denote acceptance”; it “was the proper response of a person to whom an oath was administered.”

      Jeremiah later answers a curse worded like the last one here with the same word (see the note on [[Jer. 11:5]]).
    sources: [bd-amen]

  - ref: 26
    phrase: confirmeth not all the words of this law to do them
    kind: scripture
    title: Confirmeth not all the words of this law
    body: |
      The last curse extends the warning: it falls on whoever does not uphold the whole law by living it. “Confirmeth” is the Hebrew *yaqim*, from a verb meaning “arise, stand, establish, confirm,” and it is the same verb used for setting up the stones in verse 4.

      Paul quotes this verse as “Cursed is every one that continueth not in all things which are written in the book of the law to do them” ([[Gal. 3:10]]). His “every one” and “all things” have counterparts in the Greek Septuagint, which reads “every man” and “all the words of this law,” where the Hebrew has simply “the words of this law.” Paul draws the conclusion in the next verse: “no man is justified by the law in the sight of God” ([[Gal. 3:11]]). Two verses later, Paul describes Christ's removal of the curse (see the Witness of Christ below).

      The theme page [He Turned the Curse into a Blessing](/deuteronomy/themes/curse-into-blessing/) follows the curse from the choice of 11:26 through these Amens to Moses' last word of blessing.
    sources: [oshb-wlc, biblehub-interlinear, lxx-rahlfs]

christ: |
  Paul takes the last curse of Ebal as the setting for the gospel. Having quoted verse 26, he writes: “Christ hath redeemed us from the curse of the law, being made a curse for us: for it is written, Cursed is every one that hangeth on a tree” ([[Gal. 3:13]]). The verse he quotes there is discussed in the note on [[Deut. 21:23]].

  The word the people spoke twelve times is also one of the Savior's titles: He is called “the Amen, the faithful and true witness” ([[Rev. 3:14]]).

explore: |
  - [[Josh. 8:30–35]] and [[Josh. 24]]: Joshua carries out the ceremony and renews the covenant at Shechem.
  - [[Deut. 28]]: the blessings and curses set out in full.
  - [[Jer. 11:1–8]]: a curse like that of verse 26 proclaimed to Judah.
  - [[Gal. 3:10–14]]: Paul on the curse of the law and its removal in Christ.
  - [“The Restoration as Covenant Renewal”](https://rsc.byu.edu/sperry-symposium-classics-old-testament/restoration-covenant-renewal), a Religious Studies Center study of covenant renewals from Moses to the latter days.

