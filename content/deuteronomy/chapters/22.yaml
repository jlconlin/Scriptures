chapter: 22
title: Thou Mayest Not Hide Thyself
tagline: A neighbor's lost ox, a bird's nest, a roof parapet, and cloak fringes; then laws about marriage, from a bride falsely accused to a betrothed woman seized in the field.
when: 'In the plains of Moab, in the fortieth year after the Exodus'

setting: |
  Moses is still speaking in Moab in the fortieth year after the Exodus ([[Deut. 1:3–5]]), and still in the code of laws that fills chapters 12–26. The Bible Dictionary's outline places this chapter in the code's last group, which “regulates private and social rights.”

  It is a list. Verses 1–12 are short rules for everyday life: a neighbor's lost animal, men's and women's clothing, a bird's nest, a parapet on a new roof, mixed seed and cloth, the fringes of a cloak. Verses 13–30 turn to marriage and sexual conduct. Several laws have earlier counterparts in the Pentateuch: the strayed animal in [[Ex. 23:4–5]], the mixtures in [[Lev. 19:19]], the fringes in [[Num. 15:37–41]], the seduced virgin in [[Ex. 22:16–17]]. One Latter-day Saint study applies the law of the betrothed woman (verses 23–24) to Mary's case in Matthew 1 (see the Witness of Christ below).

thread: |
  The chapter's title comes from verse 3, “thou mayest not hide thyself,” a command given also in verses 1 and 4. The first laws forbid looking away from what is in front of you, a neighbor's ox wandering off or fallen on the road (see the note at verse 1).

  The list has no obvious single plan, though one older reading finds a common concern in verses 1–12: each law protects something treated as sacred. As a neighbor's property was sacred, “so also the divine distinction of the sexes” (verse 5; see the note there); so also “the affectionate relation of parents to their young” in the animal world, which is why the mother bird goes free (verses 6–7). That law carries the promise of the fifth commandment, “that thou mayest prolong thy days” ([[Deut. 5:16]]). The parapet of verse 8 protects life: roofs were flat and people “often lived upon them,” so an unrailed roof could bring bloodguilt on the owner if someone fell from it. Verses 9–11 forbid mixing seeds, animals and fabrics; [[Lev. 19:19]] explains the related law, and a note here discusses verse 9. Verse 12 commands fringes without saying why; Numbers gives the reason: “that ye may look upon it, and remember all the commandments of the LORD, and do them” ([[Num. 15:39]]).

  Verses 13–30 are cases. The refrain that closes three of them, “so shalt thou put evil away” (verses 21, 22, 24), is explained at [[Deut. 13:5]]. The last verse forbids a man to marry his father's wife: to “discover his father's skirt” is a euphemism “similar to uncovering one’s nakedness” in the laws of Leviticus 18, and the law “probably referred to a stepmother.”

sections:
  - range: 1-4
    heading: Thou mayest not hide thyself
    plain: |
      If you see your fellow Israelite's ox or sheep straying, do not pretend you have not seen it; take it back to him. If he does not live near you, or you do not know whose it is, bring it home and keep it until he comes looking for it, and then give it back. Do the same with his donkey, his clothing, or anything he has lost that you find; you may not look the other way. If you see his donkey or ox fallen on the road, do not turn away; help him get it back on its feet.
  - range: 5-12
    heading: The nest, the roof and the fringes
    plain: |
      A woman is not to wear what belongs to a man, nor a man put on a woman's clothing; the LORD your God detests anyone who does this. If you come upon a bird's nest beside the road, in a tree or on the ground, with the mother sitting on the young or on the eggs, do not take the mother with the young. Let the mother go and take only the young, so that it may go well with you and you may live long. When you build a new house, put a parapet around the roof, so that you will not bring bloodguilt on your house if someone falls from it. Do not sow your vineyard with a second kind of seed, or the whole crop, both what you sowed and the fruit of the vineyard, will be forfeited. Do not plow with an ox and a donkey together. Do not wear cloth woven of wool and linen together. Make tassels on the four corners of the cloak you wrap yourself in.
  - range: 13-21
    heading: The bride accused
    plain: |
      Suppose a man marries a woman, sleeps with her, then turns against her, accuses her of shameful conduct and gives her a bad name, saying, “I married this woman, and when I came to her I did not find that she was a virgin.” Then her father and mother are to bring the proof of her virginity to the elders of the town at the gate. Her father is to say to the elders, “I gave my daughter to this man as his wife, and he has turned against her. He has accused her, saying, ‘I did not find your daughter a virgin.’ But here is the proof of my daughter's virginity.” And they are to spread the cloth before the elders. The elders are to take the man and punish him, and fine him a hundred shekels of silver to be given to her father, because he has given an Israelite virgin a bad name. She remains his wife, and he may never divorce her. But if the charge is true and no proof of her virginity is found, they are to bring her out to the door of her father's house, and the men of her town are to stone her to death, because she has done a disgraceful thing in Israel by playing the harlot while in her father's house. So you will remove the evil from among you.
  - range: 22-30
    heading: Betrothed, married, or neither
    plain: |
      If a man is found lying with another man's wife, both of them are to die, the man and the woman. So you will remove the evil from Israel. If a man meets a virgin betrothed to another man in a town and lies with her, take them both out to the town gate and stone them to death: the young woman because she did not cry for help though she was in a town, and the man because he violated another man's wife. So you will remove the evil from among you. But if the man meets a betrothed woman out in the country, seizes her and lies with her, only the man is to die. Do nothing to the young woman; she has committed no sin deserving death. This case is like that of a man who attacks and murders his neighbor: he came upon her in the country, and the betrothed woman screamed, but there was no one to rescue her. If a man meets a virgin who is not betrothed, seizes her and lies with her, and they are discovered, he must pay her father fifty shekels of silver, and she becomes his wife. Because he violated her, he may never divorce her. A man is not to marry his father's wife and so dishonor his father.

notes:
  - ref: 1
    phrase: and hide thyself from them
    kind: scripture
    title: A brother’s ox, an enemy’s ox
    body: |
      Deuteronomy's version of the rule about a neighbor's lost animal goes beyond Exodus's. The verb behind “hide thyself” (verses 1, 3 and 4) means here “hide thyself completely from them (utterly neglect to aid)”: to see the trouble and act as if one had not. Isaiah uses the same verb when he describes the fast the LORD has chosen: “that thou hide not thyself from thine own flesh” ([[Isa. 58:7]]).

      Exodus had given the rule for an animal belonging to an enemy: “If thou meet thine enemy's ox or his ass going astray, thou shalt surely bring it back to him again” ([[Ex. 23:4]]), and the one who “hateth thee” must be helped with his fallen donkey ([[Ex. 23:5]]; see the note there). Deuteronomy speaks of a “brother” and adds what Exodus leaves out: if the owner lives far off or is unknown, the finder keeps the animal at his own house until the owner comes looking for it (verse 2), and the same holds for a donkey, a garment, or “all lost thing of thy brother's” (verse 3).
    sources: [bdb, oshb-wlc, lds-scriptures]

  - ref: 5
    phrase: The woman shall not wear that which pertaineth unto a man
    kind: history
    title: Men’s and women’s clothing
    body: |
      The verse forbids men and women to dress as the other, and the only reason the text gives is that the LORD calls it an abomination. The law has been read as guarding the difference between the sexes: “any attempt to erase the obvious distinctions between men and women is unnatural and an abomination to the Lord.”

      The word in the first clause, “that which pertaineth unto a man,” is *keli*, the general word for an “article, utensil, vessel.” In this verse the lexicon takes it “of garments (one's ‘things’),” set beside “a woman's garment” in the second clause.
    sources: [ot-manual-deuteronomy-17-33, bdb]

  - ref: 9
    phrase: be defiled
    kind: words
    title: Defiled means forfeited as holy
    body: |
      “Defiled” here means set apart from ordinary use, not made dirty. The Hebrew verb is *qadash*, the ordinary word for “be holy,” and this verse is classed as “consecrated, tabooed.” The warning is that the whole yield, “the fruit of thy seed which thou hast sown, and the fruit of thy vineyard,” would become holy in that sense; the verse does not say who takes it. Why the law forbade the mixture is explained at [[Lev. 19:19]].
    sources: [oshb-wlc, bdb]

  - ref: 13
    phrase: If any man take a wife, and go in unto her, and hate her
    kind: history
    title: A bride falsely accused
    body: |
      The law brings a husband's charge that his bride was not a virgin before the elders at the town gate, where her father and mother defend her. The husband in view has turned against her (“hate her”; “he hateth her,” verse 16) and gives her “an evil name” (verse 14). Her parents bring the “tokens” of her virginity (verse 15), which are spread as a cloth before the elders (verse 17), and her father speaks for her.

      If the charge is false, the husband is punished three ways: the elders “chastise him” (verse 18), he pays a hundred shekels of silver to her father “because he hath brought up an evil name upon a virgin of Israel,” and he loses the right to divorce her: “he may not put her away all his days” (verse 19). The fine is twice the fifty shekels of verse 29.

      If the charge is true (verses 20–21), the penalty is death, at the door of her father's house. The text's reason is that she “hath wrought folly in Israel” by acting as a harlot in her father's house, and the refrain that follows is explained at [[Deut. 13:5]]. On the law's provisions for women, see [Women and marriage in the Old Testament](/old-testament/guides/women-and-marriage/#the-law).
    sources: [lds-scriptures]

  - ref: 25
    phrase: and the man force her
    kind: history
    title: Betrothed or not, in the city or in the field
    body: |
      Verses 23–29 set out three cases of a man lying with a virgin, and the penalty turns on whether she was betrothed and whether she could have been heard.

      A betrothed woman was treated as married. Verse 24 calls her “his neighbour's wife.” In one older reading, the bride-price had been paid at betrothal, so “the woman is as good as married”; in the New Testament world, too, a betrothed couple were married in law even before the wedding ceremony. If it happened in a town (verses 23–24), both died, she “because she cried not, being in the city”; the same older reading suggests that “in the city she would have been heard had she cried,” so the law treats her silence as evidence against her.

      In the open country (verses 25–27), the man alone died. Here “force” means seize “with violence.” The law likens the case to murder (verse 26) and notes that “the betrothed damsel cried, and there was none to save her.” In the older reading, “here at least the woman has the advantage of the doubt.”

      If she was not betrothed (verses 28–29), the man pays her father fifty shekels, must marry her and may never divorce her. The verb “lay hold on” in verse 28 is different from the verb in verse 25; in the same older reading it is “usually explained as rape, but this is not certain.” Exodus gives the parallel law for seduction and lets the father say no: “If her father utterly refuse to give her unto him, he shall pay money according to the dowry of virgins” ([[Ex. 22:17]]). The fifty shekels are a bride-price (see the note at [[Ex. 22:16]]). The guide [Women and marriage in the Old Testament](/old-testament/guides/women-and-marriage/#hard-passages) sets verse 29 among the hard passages.
    sources: [frederick-divorce, bdb, oshb-wlc, cambridge-deuteronomy, lds-scriptures]

christ: |
  The law of the betrothed woman stands behind the first chapter of the New Testament. Mary was betrothed to Joseph, and a betrothed couple were legally married, so her pregnancy “would have opened her up to charges of adultery and, in accordance with Deuteronomy 22:23–24, death by stoning,” though how strictly that penalty was imposed at the time is questioned. Joseph had the right to bring the matter before a court; instead, “being a just man, and not willing to make her a publick example, was minded to put her away privily” ([[Matt. 1:19]]), until the angel told him the child was “of the Holy Ghost” ([[Matt. 1:20]]).

  The law met Him again when a woman “taken in adultery” was brought to Him and the accusers said, “Moses in the law commanded us, that such should be stoned” ([[John 8:4–5]]). One Latter-day Saint reading calls it likely that His answer, “He that is without sin among you, let him first cast a stone at her” ([[John 8:7]]), invoked the law that witnesses throw first ([[Deut. 17:7]]). On this reading, He “is inviting the two witnesses to step forward.” He told her, “Neither do I condemn thee: go, and sin no more” ([[John 8:11]]).

  His word to her reaches every disciple who repents, the mercy and the command together: “he who has repented of his sins, the same is forgiven, and I, the Lord, remember them no more” ([[D&C 58:42]]). Those who know another's sin, as her accusers did, stand under His word to the Saints: “of you it is required to forgive all men” ([[D&C 64:10]]).

explore: |
  - [[Ex. 23:4–5]] and [[Isa. 58:6–7]]: the enemy's ox, and the fast that does not hide from one's own flesh.
  - [[Lev. 19:19]] and [[Num. 15:37–41]]: the mixtures and the fringes, with the reasons Deuteronomy leaves out.
  - [[Matt. 1:18–25]] and [[John 8:1–11]]: the law of the betrothed and the adulterous woman in the life of Jesus.
  - The guide [Women and marriage in the Old Testament](/old-testament/guides/women-and-marriage/), on betrothal, bride-price and the hard passages.

sources: [lds-scriptures, bd-deuteronomy, frederick-divorce, cambridge-deuteronomy, keil-deuteronomy, ot-manual-deuteronomy-17-33, oshb-wlc, bdb]
