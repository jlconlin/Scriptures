chapter: 9
title: Not for Thy Righteousness
tagline: Israel is about to cross the Jordan, and Moses forbids it to think the land is a reward. He proves it from Israel’s own past, the calf at Horeb above all, and tells how he lay forty days on his face before the LORD pleading for the people’s lives.
when: 'In the plains of Moab, in the fortieth year after the Exodus (1:3, 5).'

setting: |
  Chapter 9 belongs to the first part of Moses’ second address, chapters 5–11, “the Ten Commandments and a practical exposition of them.” Chapter 8 warned that plenty in the land could make Israel forget the LORD. Chapter 9 turns to a subtler danger, the people who remember that God gave them the land and conclude that He gave it because they deserved it.

  Moses answers in two moves. He first declares that the land is not given “because of their own righteousness” (verses 1–6), and then he proves it “by proofs drawn from the immediate past” (verses 7–24): the calf at Horeb, told at length, and a list of other rebellions on the way. The retelling of his intercession that begins at verse 25 runs on into [[Deut. 10:11]], with the second tables. Moses “rehearses the rebellions of Israel and tells how he mediated between the people and the Lord.”

  The story of the calf is told in [[Ex. 32]], and the site’s notes there already use this chapter’s verses 17, 20, 21 and 25. The notes below take up what the retelling adds.

thread: |
  The chapter argues one thing: **the land is the LORD’s gift, kept by His promise and won by His power, and Israel’s own record shows it could never have been earned.** The danger in view is a pride that “acknowledges the blessings of God” but sees in them “nothing but proofs of its own righteousness.”

  It opens, like [[Deut. 6:4]], with “Hear, O Israel.” The nations ahead are greater, and their cities are “fenced up to heaven.” The Anakims the spies had seen are among them (verses 1–2; see [[Deut. 1:28]]). The LORD will go over first as “a consuming fire” (verse 3; see [[Deut. 4:24]]). And when He has done it, Israel is not to say it was for its righteousness; Moses says so three times in three verses (verses 4–6; why the LORD chose Israel, for love and not for merit, is at [[Deut. 7:7]]). The land changes hands for two reasons: the wickedness of the nations (on their destruction see [[Deut. 7:2]]) and the oath to Abraham, Isaac and Jacob. Israel is “stiffnecked,” stubborn.

  Then the proof. “Remember, and forget not” (verse 7): from Egypt to this place Israel has been rebellious, and Horeb is the worst of it. While Moses was on the mountain forty days without food, receiving the tables, the people made a molten calf (verses 8–17). Moses broke the tables before their eyes (see [[Ex. 32:19]]) and fell down another forty days. He prayed for Aaron too, an intercession Exodus does not mention apart from its prayer for the whole people (see [[Ex. 32:24]]), and he burned the calf and ground it to dust, the calf he calls “your sin” (verse 21; see [[Ex. 32:20]]). The list goes on with Taberah, Massah, Kibroth-hattaavah and Kadesh-barnea (verses 22–23; for Kadesh see [[Deut. 1:22]]), and ends where it began: “Ye have been rebellious against the LORD from the day that I knew you” (verse 24).

  Last, Moses returns to his prayer at Horeb (verses 25–29) to show that Israel owed its life to God’s mercy, not its own merit. Moses appeals not to Israel’s goodness but to God’s own people, His oath to the fathers, and His name among the nations.

sections:
  - range: 1-6
    heading: Not for your righteousness
    plain: |
      Listen, Israel. Today you are about to cross the Jordan to take the land from nations greater and stronger than you, with great cities walled up to the sky, a people great and tall, the descendants of Anak. You know them, and you have heard it said, “Who can stand against the sons of Anak?” Understand then today that it is the Lord your God who goes across ahead of you as a consuming fire. He will destroy them and bring them down before you, and you will drive them out and destroy them quickly, as the Lord told you.

      After the Lord your God has thrust them out before you, do not say in your heart, “The Lord brought me in to take this land because of my righteousness.” It is because of the wickedness of these nations that the Lord is driving them out before you. You are not going in to take their land because you are righteous or your heart is upright. The Lord your God is driving them out because of their wickedness, and to keep the word He swore to your fathers, Abraham, Isaac and Jacob. So understand that the Lord your God is not giving you this good land because of your righteousness, for you are a stubborn people.
  - range: 7-21
    heading: What you did at Horeb
    plain: |
      Remember, and do not forget, how you provoked the Lord your God to anger in the wilderness. From the day you left Egypt until you came here, you have rebelled against the Lord. At Horeb too you provoked Him, and the Lord was angry enough to destroy you.

      When I went up the mountain to receive the stone tables, the tables of the covenant the Lord made with you, I stayed there forty days and forty nights, and ate no bread and drank no water. The Lord gave me two stone tables written by the finger of God, with all the words He had spoken to you on the mountain out of the fire on the day of the assembly. At the end of the forty days He gave me the tables, and He said, “Get up, go down quickly, for your people whom you brought out of Egypt have corrupted themselves. They have quickly turned from the way I commanded them and made themselves a molten image. I have seen this people; they are stubborn. Let Me alone, so that I may destroy them and wipe out their name from under heaven, and I will make of you a nation stronger and greater than they.”

      So I turned and came down from the burning mountain with the two tables in my hands, and I saw that you had sinned against the Lord your God and made yourselves a molten calf. You had turned quickly from the way He commanded. I took the two tables, threw them from my hands, and broke them before your eyes. And I lay prostrate before the Lord, as at the first, forty days and forty nights, eating no bread and drinking no water, because of all the sin you had done in His sight to provoke Him. I was afraid of the anger and fury with which the Lord was ready to destroy you; but the Lord listened to me that time too. The Lord was very angry with Aaron, ready to destroy him, and I prayed for Aaron as well at that time. I took your sin, the calf you had made, burned it, crushed it, ground it fine as dust, and threw the dust into the stream that came down from the mountain.
  - range: 22-24
    heading: From the day that I knew you
    plain: |
      At Taberah, at Massah, and at Kibroth-hattaavah you provoked the Lord to anger. And when the Lord sent you from Kadesh-barnea, saying, “Go up and take the land I have given you,” you rebelled against the command of the Lord your God; you did not believe Him or obey His voice. You have rebelled against the Lord from the day I knew you.
  - range: 25-29
    heading: Destroy not thy people
    plain: |
      So I lay prostrate before the Lord those forty days and forty nights, because the Lord had said He would destroy you. I prayed to the Lord and said, “O Lord God, do not destroy Your people, Your own inheritance, whom You redeemed by Your greatness and brought out of Egypt with a mighty hand. Remember Your servants Abraham, Isaac and Jacob; do not look at this people’s stubbornness, their wickedness, or their sin. Otherwise the land You brought us out of will say, ‘The Lord was not able to bring them into the land He promised them, and He hated them, so He brought them out to kill them in the wilderness.’ They are Your people and Your inheritance, whom You brought out by Your great power and Your outstretched arm.”

notes:
  - ref: 3
    phrase: destroy them quickly
    kind: words
    title: Quickly, and yet little by little
    body: |
      Verse 3 promises that Israel will destroy the nations “quickly,” while chapter 7 says, “the LORD thy God will put out those nations before thee by little and little: thou mayest not consume them at once” ([[Deut. 7:22]]). The English hides that the two verses use the same Hebrew word: “quickly” here and “at once” there are both *mahēr*. So the tension is in the text, not only in the translation.

      Chapter 7 gives its own reason for slowness: “lest the beasts of the field increase upon thee” ([[Deut. 7:22]]). One older reading holds the two together this way: “So far as the almighty assistance of God was concerned, the Israelites would quickly overthrow the Canaanites; but for the sake of the well-being of Israel, the destruction would only take place by degrees.” The same reading compares the “quickly” here with God’s not delaying to repay ([[Deut. 7:10]]), which is no more opposed to His long-suffering. On what “destroy” meant in the conquest, see [[Deut. 7:2]].
    sources: [oshb-wlc, keil-deuteronomy, lds-scriptures]

  - ref: 18
    phrase: 'And I fell down before the LORD, as at the first, forty days and forty nights'
    kind: history
    title: A second forty days
    body: |
      Moses here counts two fasts of forty days at Horeb, one to receive the tables (verse 9) and another after the calf, “as at the first.” Exodus tells the second differently. There Moses prays on the mountain before he comes down ([[Ex. 32:11–14]]), goes up again “on the morrow” to plead for the people ([[Ex. 32:30–31]]), and later spends forty days and nights with the LORD, eating no bread and drinking no water, when the tables are made again ([[Ex. 34:28]]). Moses’ own summary joins the two: “I stayed in the mount, according to the first time, forty days and forty nights; and the LORD hearkened unto me at that time also” ([[Deut. 10:10]]).

      Deuteronomy does not say how its second forty days line up with the days Exodus describes. It adds how they were spent: face down before the LORD, without bread or water, “because of all your sins which ye sinned” (verse 18). And it says the LORD “hearkened unto me at that time also” (verse 19).
    sources: [lds-scriptures]

  - ref: 19
    phrase: For I was afraid of the anger and hot displeasure
    kind: scripture
    title: Moses’ fear, in the Greek and in Hebrews
    body: |
      The words Hebrews gives Moses at Sinai draw on this verse in its Greek translation. Hebrews describes the mountain, the fire, the darkness and the voice ([[Heb. 12:18–19]]), and adds, “And so terrible was the sight, that Moses said, I exceedingly fear and quake” ([[Heb. 12:21]]). The Greek of Deuteronomy 9:19 reads, “I was greatly terrified because of the wrath and anger.”

      In Deuteronomy, Moses is afraid of the LORD’s anger at the calf. Hebrews sets the words in its picture of the mountain, before turning to “mount Sion” ([[Heb. 12:22]]).
    sources: [sc-knowhy-469, lxx-rahlfs]

  - ref: 22
    phrase: at Taberah, and at Massah, and at Kibroth-hattaavah
    kind: history
    title: Three places, three rebellions
    body: |
      The three places in this verse are not listed in the order of the journey, and each name records a rebellion. Massah, where the people tested the LORD for water, came before Sinai ([[Ex. 17:7]]). Taberah and Kibroth-hattaavah came after it, on the way from Sinai, and Numbers names them for what happened there: Taberah, “because the fire of the Lord burnt among them,” after the people complained; Kibroth-hattaavah, “because there they buried the people that lusted,” after they craved flesh and were sent quails ([[Num. 11:1–3]]; [[Num. 11:31–34]]). Kadesh-barnea, in verse 23, is the refusal to enter the land (see [[Deut. 1:22]]).
    sources: [lds-scriptures]

  - ref: 26
    phrase: destroy not thy people and thine inheritance
    kind: scripture
    title: Thy people, not mine
    body: |
      Moses calls Israel the LORD’s people, in the LORD’s own words at the calf. At the calf the LORD had said to Moses, “thy people which thou hast brought forth out of Egypt have corrupted themselves” (verse 12). Moses prays, “destroy not thy people and thine inheritance, which thou hast redeemed through thy greatness, which thou hast brought forth out of Egypt with a mighty hand.” Exodus has the same exchange ([[Ex. 32:7]]; [[Ex. 32:11]]), and its three reasons for sparing Israel are treated at [[Ex. 32:10]].

      The retelling adds two things. Moses asks the LORD not to look at “the stubbornness of this people” (verse 27), the fault the LORD named in verse 13; he does not deny it. And the reproach he fears from Egypt now includes “because he hated them” (verse 28). The prayer ends where it began, with “thy people and thine inheritance” (verse 29).
    sources: [lds-scriptures]

christ: |
  The LORD whose anger Moses feared and whose mercy he pleaded is Jehovah, the premortal Christ (see the note at [[Ex. 3:14]]). In this chapter Moses pleads between the people and the LORD. The site’s theme [Moses the Mediator](/exodus/themes/moses-the-mediator/) follows that office from Horeb to the One scripture names as its fulfillment, who “ever liveth to make intercession” for those who come to God by Him ([[Heb. 7:25]]), and who pleads before the Father, “behold the blood of thy Son which was shed” ([[D&C 45:4]]). Moses lay forty days on his face because the LORD had said He would destroy the people; the theme sets that pleading beside His.

  The same Advocate pleads now; in a latter-day revelation He asks the Father, “spare these my brethren that believe on my name, that they may come unto me and have everlasting life” ([[D&C 45:5]]). A disciple, like Israel at the Jordan, stands on that pleading and not on a record of righteousness, “relying wholly upon the merits of him who is mighty to save” ([[2 Ne. 31:19]]); the theme page [Speak Not Thou in Thine Heart](/deuteronomy/themes/speak-not-in-thine-heart/) follows the sentence verse 4 forbids to Paul's righteousness of faith.

explore: |
  - **The calf told twice.** Read [[Ex. 32:1–35]] beside verses 7–21, and [[Ex. 34:1–10]] beside [[Deut. 10:1–11]].
  - **Not for your sakes.** [[Deut. 7:6–8]], [[Ezek. 36:22–32]], and [[1 Ne. 17:32–40]].
  - **The rebellions on the way.** [[Ex. 17:1–7]], [[Num. 11:1–34]], and [[Num. 14:1–45]]; then [[Ps. 106:19–33]].

sources: [lds-scriptures, bd-deuteronomy, keil-deuteronomy, oshb-wlc, sc-knowhy-469, lxx-rahlfs]
