chapter: 32
title: He Is the Rock
tagline: Moses teaches Israel the LORD's song of the faithful Rock, a faithless people, and judgment ending in mercy. Then the LORD sends him up Nebo to see the land and die.
when: 'In the plains of Moab, in the fortieth year after the Exodus'

setting: |
  Moses taught this song in Moab in the fortieth year after the Exodus ([[Deut. 1:3]]), on the same day the LORD told him to climb Nebo and die (verse 48). The LORD had commanded it: “write ye this song for you, and teach it the children of Israel: put it in their mouths, that this song may be a witness for me against the children of Israel” ([[Deut. 31:19]], where the note says why it was written). Moses wrote it “the same day” ([[Deut. 31:22]]) and spoke it “in the ears of all the congregation of Israel” ([[Deut. 31:30]]), with Joshua beside him (verse 44).

  It is a poem, and its Hebrew is not the Hebrew of the speeches around it. Along with the Song of the Sea and Jacob's blessing, it is written in Archaic Biblical Hebrew, the language's earliest stage. One study judges that it is “likely dating from 1000 BC at the latest.” The song is described as one Israel “will sing,” and verse 8 is read as a statement about the premortal life (see the note there).

  The New Testament quotes it. Paul cites verse 21 by Moses' name ([[Rom. 10:19]]) and the first words of verse 35 as what “is written” ([[Rom. 12:19]]), and Hebrews joins verse 35 to verse 36 ([[Heb. 10:30]]).

thread: |
  The song sets the LORD's faithfulness against Israel's unfaithfulness. The song moves from a summons (verses 1–3) to its theme, that “the Lord is blameless and righteous in His doings, but Israel acts corruptly and perversely” (verses 4–5); then the folly of rebelling against so good a God (6–18), the LORD's purpose to reject and punish the rebels (19–23), and last the judgment “in which the Lord would have mercy upon His servants and annihilate His foes” (34–43). The whole song is “a prophetic anticipation of the future”: Israel's history told before it happens.

  The LORD had said that when Israel had eaten its fill in the land and turned to other gods, and “many evils and troubles” had come, “this song shall testify against them as a witness; for it shall not be forgotten out of the mouths of their seed” ([[Deut. 31:20–21]]). Yet the song does not end in wrath. The LORD will judge His people and “repent himself for his servants, when he seeth that their power is gone” (verse 36); He alone kills and makes alive (verse 39); and the last line promises that He “will be merciful unto his land, and to his people” (verse 43, where the note gives the Hebrew).

  After the song Moses tells Israel that these words are “your life” (verse 47), and the LORD sends him up Nebo to see the land he will not enter, because of Meribah (verses 48–52). The note at [[Deut. 3:26]] sets that reason beside Moses' own “for your sakes,” and his death is told at [[Deut. 34:5]].

sections:
  - range: 1-6
    heading: Give ear, O ye heavens
    plain: |
      Listen, you heavens, and I will speak; let the earth hear the words of my mouth. May my teaching fall like rain and my speech settle like dew, like light rain on young plants and showers on the grass. For I will proclaim the name of the LORD: give greatness to our God! He is the Rock; His work is perfect, for all His ways are just (see the note on verse 4). He is a God of truth, without wrong; righteous and upright is He. They have corrupted themselves; their blemish is not the mark of His children; they are a twisted and crooked generation. Is this how you repay the LORD, you foolish and unwise people? Is He not your Father, who bought you? Did He not make you and establish you?
  - range: 7-14
    heading: Remember the days of old
    plain: |
      Remember the days long ago; think about the years of many generations. Ask your father, and he will show you; ask your elders, and they will tell you. When the Most High gave the nations their inheritance, when He divided the descendants of Adam, He set the boundaries of the peoples according to the number of the children of Israel (see the note on verse 8). For the LORD's own share is His people; Jacob is the portion He inherits. He found him in a desert land, in an empty, howling wilderness; He led him about, taught him, and kept him as the apple of His eye. As an eagle stirs up its nest and hovers over its young, spreads its wings, takes them up and carries them on its wings, so the LORD alone led him, and no foreign god was with him (see the note at [[Ex. 19:4]]). He set him riding on the heights of the land to eat what the fields grew; He fed him honey from the rock and oil from the flinty rock, butter from the cattle and milk from the sheep, with the fat of lambs, rams of the breed of Bashan and goats, with the fat of the kidneys of wheat; and you drank wine, the pure blood of the grape.
  - range: 15-18
    heading: Jeshurun waxed fat, and kicked
    plain: |
      But Jeshurun, Israel, grew fat and kicked (on the name see the note at [[Isa. 44:2]]). Israel grew fat, thick and sleek; then he abandoned the God who made him and thought lightly of the Rock of his salvation. They made Him jealous with strange gods and angered Him with abominations. They sacrificed to devils, not to God, to gods they had never known, new gods lately come, whom your fathers had not feared. You forgot the Rock who fathered you, and the God who formed you.
  - range: 19-27
    heading: I will hide my face from them
    plain: |
      When the LORD saw it, He spurned them, because His sons and daughters provoked Him. He said, I will hide My face from them and see what their end will be, for they are a perverse generation, children in whom is no faith. They have made Me jealous with what is no god and angered Me with their empty idols; so I will make them jealous with those who are no people and anger them with a foolish nation (see the note on verse 21). For a fire is kindled in My anger; it will burn to the lowest hell, consume the earth and its harvest, and set the foundations of the mountains on fire. I will heap disasters on them and spend My arrows on them. They will be wasted with hunger and devoured by burning heat and bitter destruction; I will send the teeth of beasts against them, and the poison of snakes that crawl in the dust. The sword outside and terror inside will destroy young man and young woman, the nursing child and the gray-haired man. I would have said, I will scatter them into corners and make their memory cease among men, if I had not feared the enemy's provocation: that their adversaries would behave strangely and say, Our hand is high; the LORD has not done all this.
  - range: 28-35
    heading: Their rock is not as our Rock
    plain: |
      For they are a nation without counsel, and there is no understanding in them. If only they were wise, if only they understood this and would consider how they will end! How could one man chase a thousand, and two put ten thousand to flight, unless their Rock had sold them and the LORD had given them up? For their rock is not like our Rock; even our enemies can judge that. Their vine comes from the vine of Sodom and the fields of Gomorrah; their grapes are grapes of gall, their clusters are bitter; their wine is the poison of dragons and the cruel venom of asps. Is not this stored up with Me, sealed up among My treasures? Vengeance and repayment belong to Me; their foot will slip in due time, for the day of their disaster is near, and what is coming on them hurries on (see the note on verse 35).
  - range: 36-43
    heading: I, even I, am he
    plain: |
      For the LORD will judge His people and repent Himself for His servants (on the word, see the note at [[Ps. 135:14]]), when He sees that their strength is gone and no one is left. He will say, Where are their gods, the rock they trusted, who ate the fat of their sacrifices and drank the wine of their drink offerings? Let them get up and help you and be your protection. See now that I, I am He, and there is no god beside Me. I kill and I make alive; I wound and I heal; and no one can deliver out of My hand. For I lift My hand to heaven and say, I live for ever. If I sharpen My glittering sword and My hand takes hold on judgment, I will repay vengeance to My enemies and reward those who hate Me. I will make My arrows drunk with blood, and My sword will devour flesh, with the blood of the slain and of the captives, from the beginning of vengeance on the enemy. Rejoice, you nations, with His people, for He will avenge the blood of His servants, repay vengeance to His adversaries, and be merciful to His land and His people (see the notes on verse 43).
  - range: 44-47
    heading: It is your life
    plain: |
      Moses came and spoke all the words of this song in the hearing of the people, he and Hoshea, that is Joshua, the son of Nun. When Moses had finished speaking all these words to all Israel, he said to them, Set your hearts on all the words I testify among you today, which you are to command your children to be careful to do, all the words of this law. For it is no empty thing for you; it is your life, and through it you will live long in the land you are crossing the Jordan to possess.
  - range: 48-52
    heading: Get thee up into this mountain
    plain: |
      That same day the LORD said to Moses, Go up into this mountain Abarim, to Mount Nebo in the land of Moab, opposite Jericho, and look at the land of Canaan, which I am giving the children of Israel as their possession. Die on the mountain you are climbing and be gathered to your people, as Aaron your brother died on Mount Hor and was gathered to his people, because you trespassed against Me among the children of Israel at the waters of Meribah-Kadesh in the wilderness of Zin, because you did not show Me holy among the children of Israel (see the note at [[Deut. 3:26]]). You will see the land before you, but you will not go there, into the land I am giving the children of Israel.

notes:
  - ref: 4
    phrase: He is the Rock
    kind: symbol
    title: The Rock
    body: |
      “The Rock” is the song's name for the LORD, and later scripture gives the name to Christ. The song calls the LORD by it repeatedly: the Rock whose work is perfect (verse 4), “the Rock of his salvation,” whom Jeshurun scorned (verse 15), “the Rock that begat thee” (verse 18), the Rock who sold Israel to its enemies (verse 30), and “our Rock,” beside whom the gods of the nations fail: “their rock is not as our Rock” (verse 31). At the end the LORD mocks the false gods with the same word, “their rock in whom they trusted” (verse 37).

      In the imagery of the Hebrew Bible a rock is a place of refuge from storm and arrows, and “the Lord is ultimately the rock and refuge of Israel.” Paul says of the rock that gave water in the wilderness, “that Rock was Christ” ([[1 Cor. 10:4]]; see the note at [[Ex. 17:6]]). Helaman taught his sons that they must build on “the rock of our Redeemer, who is Christ, the Son of God” ([[Hel. 5:12]]). The image was in the scriptures the Lehites likely had on the plates of brass, where the Psalms, Isaiah and Deuteronomy “use similar language.”
    sources: [oshb-wlc, sc-knowhy-176, lds-scriptures]

  - ref: 8
    phrase: according to the number of the children of Israel
    kind: history
    title: The number of the children of Israel
    body: |
      The King James follows the traditional Hebrew text here, and the Church's heading reads the verse as a statement about the premortal life: “the children of Israel were known in the premortal life.” The Most High set the nations' boundaries by Israel's number, and kept Jacob as His own portion (verse 9). Elder James E. Talmage drew the conclusion that “the number was known prior to the existence of the Israelitish nation in the flesh”; this, he said, “is most easily explained on the basis of a previous existence in which the spirits of the future nation were known.”

      Other ancient witnesses read the line differently. The Septuagint, the Greek translation, has “according to the number of the angels of God,” and a fragment of Deuteronomy among the Dead Sea Scrolls reads “sons of God” (*bene elohim*). One modern translation follows these witnesses: “according to the number of the gods.” One Latter-day Saint scholar takes the verse as “an obvious reference to pre-earth assignments.” Another proposes that scribes changed the traditional Hebrew to remove God's heavenly council from the text; that is his judgment of how the readings came to differ, drawn from the scholars he cites.

      The note at [[Ps. 82:8]] sets the variant beside that psalm's council, and the note at [[Gen. 10:32]] gives the verb for dividing the nations.
    sources: [lds-scriptures, ot-manual-deuteronomy-17-33, lxx-rahlfs, mcconkie-premortal-councils, smoot-council-hebrew-bible, nrsvue]

  - ref: 21
    phrase: I will move them to jealousy with those which are not a people
    kind: scripture
    title: No god, no people
    body: |
      The two halves of the verse answer each other, and Paul reads the second half as referring to the Gentiles. Israel moved the LORD to jealousy “with that which is not God,” and He will move them to jealousy “with those which are not a people.”

      Paul quotes the line by Moses' name: “First Moses saith, I will provoke you to jealousy by them that are no people, and by a foolish nation I will anger you” ([[Rom. 10:19]]). In his argument the “no people” are the Gentiles. Through Israel's stumbling, he goes on, “salvation is come unto the Gentiles, for to provoke them to jealousy” ([[Rom. 11:11]]), and he hopes by his own ministry to “provoke to emulation them which are my flesh, and might save some of them” ([[Rom. 11:14]]). In Paul's reading the jealousy is meant to bring Israel back.
    sources: [lds-scriptures]

  - ref: 35
    phrase: To me belongeth vengeance, and recompence
    kind: scripture
    title: Vengeance belongs to the LORD
    body: |
      The LORD claims the right to repay as His own, and the New Testament quotes the claim twice. Paul uses it to forbid revenge: “Dearly beloved, avenge not yourselves, but rather give place unto wrath: for it is written, Vengeance is mine; I will repay, saith the Lord” ([[Rom. 12:19]]). Hebrews uses it as a warning to those who fall away, joined to the next verse: “Vengeance belongeth unto me, I will recompense, saith the Lord. And again, The Lord shall judge his people” ([[Heb. 10:30]]).

      In the song the next verse gives the reason for the claim: the LORD will “judge his people, and repent himself for his servants, when he seeth that their power is gone” (verse 36). What “judge” and “repent” mean there is explained at [[Ps. 135:14]], where a psalm quotes the line.
    sources: [keil-deuteronomy, lds-scriptures]

  - ref: 43
    phrase: Rejoice, O ye nations, with his people
    kind: words
    title: A longer verse in the scroll and the Greek
    body: |
      The song's last verse is longer in the Septuagint and in a Dead Sea Scroll than in the traditional Hebrew text that the King James follows. The Septuagint begins, “Rejoice, ye heavens, with him, and let all the angels of God worship him; rejoice ye Gentiles, with his people, and let all the sons of God strengthen themselves in him.” The Qumran fragment (4QDeutq) also includes a call for the gods to worship; modern translations follow that reading: “Praise, O heavens, his people; worship him, all you gods!”

      The shorter Hebrew may be a later reworking “which changed ‘heavens’ to ‘nations’ and omitted reference to the gods worshipping Yahweh altogether.” That is one reading of how the texts came apart; the King James line stands as the Hebrew has it.

      Two New Testament lines share this verse's wording, and they are set here side by side only for that: the Greek's “let all the angels of God worship him” is word for word the line of [[Heb. 1:6]], and the King James' first line is close to Paul's “Rejoice, ye Gentiles, with his people” ([[Rom. 15:10]]).
    sources: [lxx-rahlfs, smoot-council-hebrew-bible, nrsvue, lds-scriptures]

  - ref: 43
    phrase: will be merciful unto his land
    kind: christ
    title: He will make atonement for his land
    body: |
      The song's last promise, “will be merciful unto,” translates *kipper*, the verb used when the priest makes atonement on the Day of Atonement ([[Lev. 16:32–34]]). Here the LORD is its subject. With God as subject the verb means “cover, i.e. treat as covered, view propitiously,” the sense under which this verse is listed; a modern translation has “cleanse the land for his people,” and the Septuagint “the Lord shall purge the land of his people.” In the passages where God is the one who covers, the thought is that “God in his sovereignty may himself provide an atonement or covering for men and their sins which could not be provided by men.”

      After the fire, arrows and sword of the verses before, the song's last word is the LORD Himself covering His land and His people. The LORD who speaks in the song is Jehovah, the premortal Christ (see the note at [[Ex. 3:14]]).
    sources: [oshb-wlc, bdb, nrsvue, lxx-rahlfs]

christ: |
  The LORD who speaks in the song is Jehovah, the premortal Christ (see the note at [[Ex. 3:14]]). The song's name for Him is the Rock, a name Paul gives to Christ ([[1 Cor. 10:4]]; see the note on verse 4). The God who says, “I kill, and I make alive; I wound, and I heal” (verse 39), ends the song by covering His land and His people with the verb of atonement (see the note on verse 43).

  The Rock that Jeshurun “lightly esteemed” when it “waxed fat” (verses 15, 18) is the foundation Helaman gave his sons: “it is upon the rock of our Redeemer, who is Christ, the Son of God, that ye must build your foundation,” “a foundation whereon if men build they cannot fall” ([[Hel. 5:12]]).

explore: |
  - [[Deut. 31:16–30]]: why the song was written, and how it was taught.
  - [[Ex. 15:1–18]]: Moses' first song, at the sea.
  - [[Rom. 10:19–21]] and [[Rom. 11:11–15]]: Paul's reading of verse 21.
  - [[Ps. 18:2]], [[Ps. 18:31]] and [[2 Ne. 4:30–35]]: the Rock in David's song and in Nephi's psalm.
  - [[Deut. 33]]: the blessing Moses gives the tribes after the song.

