chapter: 3
title: Thou Shalt Not Go Over This Jordan
tagline: Og the giant king falls, the land east of the Jordan is shared out, and Moses, who has led Israel to the river, asks to cross it and is told no.
when: 'In the plains of Moab, in the fortieth year after the Exodus'

setting: |
  Chapter 3 finishes the story with which Moses opens his first discourse, chapters 1–4, which serve as an “introductory” discourse to the book. He is speaking in the plains of Moab in the fortieth year ([[Deut. 1:3–5]]), and he has already retold Horeb, the spies, the long way past Edom, Moab and Ammon, and the defeat of Sihon (chapters 1–2). Now he tells the second Amorite king, Og of Bashan, the country north of Gilead, “an area rich in grain production and known for its breed of cattle.”

  Numbers tells each of these events in its own place: the battle at Edrei in three verses, with the same words from the LORD, “Fear him not” ([[Num. 21:33–35]]); the request of Reuben and Gad, who “had a very great multitude of cattle,” for the land east of the river ([[Num. 32]]); and Moses being shown the land and told to appoint Joshua ([[Num. 27:12–23]]). The Psalms name Sihon and Og together among the LORD's mighty acts for Israel ([[Ps. 135:11]]; [[Ps. 136:19–20]]).

  What Deuteronomy adds is Moses' own prayer to cross the Jordan, which the account in Numbers does not record, and his second telling of why he could not (see also [[Deut. 1:37]]; [[Deut. 4:21]]).

thread: |
  The chapter turns on two crossings: one the LORD promises and one He refuses.

  The first half (verses 1–17) answers the fear that kept the fathers out of the land. Forty years earlier the spies had reported cities “walled up to heaven” and the sons of the giants ([[Deut. 1:28]]). Now Moses tells of “threescore cities” “fenced with high walls, gates, and bars,” all taken (verses 4–5), and of the last of the giants, whose bed could still be seen (verse 11). The LORD's word before the battle, “Fear him not” (verse 2), is the exhortation the fathers had heard nearly forty years before ([[Deut. 1:21]], 29). The conquered land is then shared out to Reuben, Gad and half of Manasseh (verses 8–17).

  The second half (verses 18–29) looks across the river. Moses charges the eastern tribes to cross armed with their brethren (verses 18–20), and he points Joshua to what his eyes have seen: the two kings fallen, a pledge that the LORD will do the same to every kingdom ahead (verses 21–22). Looking back on what God has done is the ground of facing what comes.

  Then Moses asks for himself. He has seen the work begun and wants to see it finished, to “go over” and see the good land (verses 23–25). The answer is no. He may see it from Pisgah, but Joshua will lead the people over (verses 26–28). The chapter that began with a giant falling ends with Israel camped “over against Beth-peor” (verse 29), the place named again at the end of Moses' life ([[Deut. 34:6]]).

sections:
  - range: 1-7
    heading: The fall of Og
    plain: |
      Then we turned and went up the road toward Bashan, and Og, king of Bashan, came out with his whole army to fight us at Edrei. The LORD said to me, “Don't be afraid of him. I am handing him, his army and his land over to you. Do to him what you did to Sihon, king of the Amorites, who lived in Heshbon.” So the LORD our God handed over Og and all his people too, and we struck them down until no one was left. We took all sixty of his cities at that time, the whole region of Argob, Og's kingdom in Bashan; there was not one we failed to take. All of them were fortified with high walls, gates and bars, and there were a great many unwalled villages besides. We destroyed them completely, as we had done to Sihon of Heshbon, destroying the men, women and children of every city. But we kept all the livestock and the plunder of the cities for ourselves.
  - range: 8-17
    heading: The land east of the Jordan
    plain: |
      So at that time we took from the two Amorite kings the land across the Jordan, from the Arnon River to Mount Hermon (the Sidonians call Hermon Sirion, and the Amorites call it Shenir): all the towns of the plain, all Gilead and all Bashan as far as Salchah and Edrei, towns of Og's kingdom in Bashan. Og was the only one left of the remaining giants. His bed was made of iron; isn't it still in Rabbah of the Ammonites? It was nine cubits long and four wide, measured by the ordinary cubit.

      I gave the land we took, from Aroer by the Arnon and half the hill country of Gilead with its towns, to the Reubenites and the Gadites. The rest of Gilead, and all Bashan, Og's kingdom, I gave to the half tribe of Manasseh: the whole region of Argob, with all Bashan, which was called the land of giants. Jair, a descendant of Manasseh, took all of Argob as far as the border of the Geshurites and the Maachathites, and named its villages after himself, Havoth-jair, as they are still called. I gave Gilead to Machir. To the Reubenites and the Gadites I gave the land from Gilead to the Arnon, with the middle of the valley as the boundary, and as far as the Jabbok River, the border of the Ammonites; and the Arabah too, with the Jordan as its border, from the Sea of Chinnereth to the Sea of the Arabah, the Salt Sea, below the slopes of Pisgah to the east.
  - range: 18-22
    heading: Charges to the eastern tribes and to Joshua
    plain: |
      At that time I commanded you: “The LORD your God has given you this land to possess. But all your fighting men must cross over armed ahead of your fellow Israelites. Your wives, your children and your livestock (I know you have a great deal of livestock) may stay in the towns I have given you, until the LORD gives your brothers rest as He has given you, and they too take possession of the land the LORD your God is giving them across the Jordan. Then each of you may come back to the land I have given you.”

      And at that time I commanded Joshua: “You have seen with your own eyes all that the LORD your God has done to these two kings. The LORD will do the same to every kingdom you cross into. Don't be afraid of them, for the LORD your God is the one who fights for you.”
  - range: 23-29
    heading: Moses' prayer refused
    plain: |
      At that time I pleaded with the LORD: “O Lord GOD, You have only begun to show Your servant Your greatness and Your mighty hand. What god is there in heaven or on earth who can do deeds like Yours, with power like Yours? Please let me cross over and see the good land beyond the Jordan, that fine hill country, and Lebanon.” But the LORD was furious with me because of you, and He would not listen to me. The LORD said to me, “Enough! Don't speak to Me about this again. Go up to the top of Pisgah and look west, north, south and east. Look at the land with your own eyes, because you will not cross this Jordan. But commission Joshua, and encourage and strengthen him, because he will lead this people across and give them the land you will see.” So we stayed in the valley opposite Beth-peor.

notes:
  - ref: 6
    phrase: utterly destroying the men, women, and children, of every city
    kind: history
    title: The same as at Heshbon
    body: |
      Verse 6 tells Og's cities the way Moses has just told Sihon's: every person destroyed, and the cattle and spoil kept ([[Deut. 2:34–35]]; compare verse 7). Moses gives no reason here. The point he draws is that each victory came as the LORD had promised it would (verse 2; [[Deut. 2:24]], 31).

      What the command to “utterly destroy” meant, why it was given, and how the Church reads it today is explained at [[Deut. 7:2]]; what was done at Heshbon is at [[Deut. 2:34]].
    sources: [lds-scriptures, ot-minute-deut-3]

  - ref: 11
    phrase: For only Og king of Bashan remained of the remnant of giants; behold, his bedstead was a bedstead of iron
    kind: history
    title: Og’s bed
    body: |
      Og's bed is Moses' reminder of how great a foe the LORD had overcome. Og was the last of the Rephaim, “a pre-Israelite people in Palestine, noted for their great stature,” and verse 13 calls his country “the land of giants.” Measured by “the cubit of a man,” the ordinary cubit of about eighteen inches, the bed was some thirteen and a half feet long and six wide.

      Read as a giant's bed, the detail answers the spies of forty years before, who called the people of the land “greater and taller than we” ([[Deut. 1:28]]) and said, “we were in our own sight as grasshoppers” ([[Num. 13:33]]). On that reading Moses' brief account makes the LORD's power the point: no obstacle was too large for Him.

      Two older readings are more cautious. One notes that a bed is always longer than the one who sleeps in it, so the size alone proves little. Another takes the Hebrew *ʿereś*, which elsewhere means a couch, here as a sarcophagus, and “iron” as the local name for basalt; sites east of the Jordan are strewn with stone coffins. Either way, Moses points to the object as something still to be seen “in Rabbath of the children of Ammon.” The text does not say how it came to be there.
    sources: [bd-rephaim, lds-scriptures, ot-minute-deut-3, keil-deuteronomy, cambridge-deuteronomy]

  - ref: 18
    phrase: ye shall pass over armed before your brethren the children of Israel
    kind: history
    title: Armed before their brethren
    body: |
      The charge in verses 18–20 is the bargain struck in Numbers 32, retold. Reuben and Gad had many cattle (hence the aside in verse 19, “for I know that ye have much cattle”), saw that Gilead was cattle country, and asked for it: “bring us not over Jordan” ([[Num. 32:5]]). Moses answered, “Shall your brethren go to war, and shall ye sit here?” ([[Num. 32:6]]). They offered to “go ready armed before the children of Israel, until we have brought them unto their place” ([[Num. 32:17]]), and Moses made the land theirs on that condition ([[Num. 32:29–30]]).

      Here Moses repeats the condition to the men who made it, on the eve of the crossing. The book of Joshua records that it was kept. When the land was won, Joshua sent the eastern tribes home saying they had “kept all that Moses the servant of the LORD commanded you,” and “now the LORD your God hath given rest unto your brethren, as he promised them” ([[Josh. 22:2–4]]), the very rest verse 20 names.
    sources: [lds-scriptures, ot-minute-deut-3]

  - ref: 24
    phrase: thou hast begun to shew thy servant thy greatness, and thy mighty hand
    kind: history
    title: What Moses had seen begun
    body: |
      Moses grounds his plea in what he has just witnessed. On one older reading, “begun to shew” points less to the plagues and the Red Sea than to the defeat of Sihon and Og: the LORD had begun His work east of the Jordan, and Moses asks to see it finished by crossing and viewing the whole land.

      His question, “what God is there in heaven or in earth, that can do according to thy works,” sets Israel's God against the many gods of the nations around them.
    sources: [keil-deuteronomy, cambridge-deuteronomy, ot-minute-deut-3]

  - ref: 26
    phrase: But the LORD was wroth with me for your sakes, and would not hear me
    kind: history
    title: Why Moses could not cross
    body: |
      Moses' speeches put the cause of his exclusion with the people; Numbers puts it with Moses himself, at Meribah.

      In Deuteronomy the LORD was angry with Moses “for your sakes” ([[Deut. 1:37]]; [[Deut. 4:21]]). Here the word is not “angry” but “wroth,” a verb meaning to “infuriate oneself.”

      Numbers places the sentence at Meribah in the wilderness of Zin. Told to speak to the rock before the people's eyes, Moses said, “Hear now, ye rebels; must we fetch you water out of this rock?” and struck it twice ([[Num. 20:8–11]]). Then the LORD said to Moses and Aaron, “Because ye believed me not, to sanctify me in the eyes of the children of Israel, therefore ye shall not bring this congregation into the land” ([[Num. 20:12]]), and repeated it when Moses was shown the land ([[Num. 27:14]]). Deuteronomy names Meribah too, at the end, in the LORD's words before Moses climbs Nebo: “because ye trespassed against me … at the waters of Meribah-Kadesh” ([[Deut. 32:51]]). Psalm 106 holds the two together: the people angered the LORD at the waters of strife, “so that it went ill with Moses for their sakes,” for “he spake unadvisedly with his lips” ([[Ps. 106:32–33]]; the note there asks whose spirit was provoked).

      Read from Numbers 20, Moses and Aaron were chastened for straying from the LORD's instructions and failing to sanctify Him before the people, though “the scriptures do not fully explain the reasons for this consequence.” One Latter-day Saint reading starts from Deuteronomy, where the only setting given for the LORD's anger is the spies, and proposes that the displeasure may go back to that episode: to Moses' agreeing to the people's request to send them ([[Deut. 1:22–23]]), or to his adding to the LORD's instruction to “search the land” ([[Num. 13:2]], 18–20).

      The refusal did not end Moses' work: in this dispensation he brought the keys of the gathering of Israel to Joseph Smith and Oliver Cowdery ([[D&C 110:11]]). How his life ended is told at [[Deut. 34:5]].
    sources: [lds-scriptures, bdb, scripture-helps-num, ot-minute-deut-3]

  - ref: 26
    phrase: Let it suffice thee; speak no more unto me of this matter
    kind: words
    title: Enough for you
    body: |
      “Let it suffice thee” is the Hebrew *rab lāk*, an exclamation, “Enough!”, with a sense of having gone far enough already. It is the idiom the LORD had used to start Israel moving, rendered “long enough” there: “Ye have dwelt long enough in this mount” ([[Deut. 1:6]]) and “Ye have compassed this mountain long enough” ([[Deut. 2:3]]). Here it ends Moses' plea, and in its place the LORD sends him up Pisgah to see the land in every direction (verse 27).
    sources: [bdb]

christ: |
  Moses cannot take Israel over the Jordan; the one who will is Joshua (verse 28), whose name means “Jehovah is salvation.” The name appears in the Old Testament in several forms, among them the one rendered “Jesus,” and the King James New Testament uses that form for Joshua himself (the footnote to [[Heb. 4:8]] points to him). Verse 20 waits for the LORD to give Israel “rest,” and Hebrews says that the rest Joshua gave was not the last: “For if Jesus had given them rest, then would he not afterward have spoken of another day. There remaineth therefore a rest to the people of God” ([[Heb. 4:8–9]]).

  The prophet who was refused the promised land was not refused the presence of the Lord. Moses, who saw Canaan only from Pisgah, stood on the mount with Jesus when He was transfigured ([[Matt. 17:3]]).

explore: |
  - **The events Moses retells.** Og's fall in [[Num. 21:33–35]]; the eastern tribes' bargain in [[Num. 32]]; the water of Meribah in [[Num. 20:1–13]]; Moses shown the land and Joshua appointed in [[Num. 27:12–23]].
  - **The bargain kept.** [[Josh. 22:1–6]], where the eastern tribes are sent home with a blessing.
  - **The view from Pisgah fulfilled.** [[Deut. 34:1–5]], where Moses climbs the mountain and is shown the land.

sources: [lds-scriptures, bd-deuteronomy, bd-bashan, bd-rephaim, bd-joshua, bdb, ot-minute-deut-3, keil-deuteronomy, cambridge-deuteronomy, scripture-helps-num]
