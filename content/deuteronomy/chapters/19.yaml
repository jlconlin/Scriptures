chapter: 19
title: Cities of Refuge and the Law of Witnesses
tagline: Three cities are set apart in the land so that a man who kills by accident can flee to refuge from the avenger of blood, the deliberate murderer is handed over, a neighbour's landmark stays where it is, and no one is condemned on one witness or on a lie.
when: 'In the plains of Moab, in the fortieth year after the Exodus'

setting: |
  Moses is still speaking in Moab in the fortieth year ([[Deut. 1:3–5]]), in the code of laws that runs from chapter 12 to chapter 26. Within that code “the next group of laws deals with the administration of justice,” and the laws move from the judges and the king of chapters 16–17 to the courts' hardest work: a death and disputed testimony.

  The cities of refuge were not new. The LORD had told Moses that Israel must have “six cities for refuge, which ye shall appoint for the manslayer” ([[Num. 35:6]]), and Moses had already set apart the three east of the Jordan ([[Deut. 4:41]]). This chapter turns to the three in the land not yet entered. In one older reading it is “not a mere repetition of the laws given in Numbers 35:9-34, but rather an admonition to carry out those laws,” looking ahead to a larger land.

  The second half of the chapter has had a longer reach. Its rule that a matter is settled only “at the mouth of two witnesses, or at the mouth of three witnesses” (verse 15) is quoted by Paul ([[2 Cor. 13:1]]) and by the Savior ([[Matt. 18:16]]; [[John 8:17]]), and the Lord repeats it in the Doctrine and Covenants (the note at verse 15).

thread: |
  The chapter is about **guarding life in the courts of Israel.** Moses “notices in this and the two following chapters the different ways in which the lives of individuals might be endangered, for the purpose of awakening in the minds of the people a holy reverence for human life” in this chapter and the two after it.

  Each law here guards against a different danger. The man who kills by accident is guarded against the dead man's kinsman, who will pursue him “while his heart is hot” (verse 6). The land is guarded against “innocent blood” (verse 10): if Israel failed to give the slayer a refuge, “it would bring blood-guiltiness upon itself … because it had not done what was requisite to prevent the shedding of innocent blood.” Justice is guarded against the refuge itself, for a man who killed out of hatred cannot hide in a city of refuge; his own elders fetch him out (verses 11–13). A family's living is guarded against a neighbour who moves the boundary stone (verse 14). And the accused is guarded against a single witness and against a lying one (verses 15–21).

  The chapter closes with “eye for eye, tooth for tooth” (verse 21), here applied to the false witness, who suffers what he meant to bring on another. The rule itself, and the Savior's words on it in the Sermon on the Mount, are explained at [[Ex. 21:24]]; the refrain “so shalt thou put the evil away from among you” (verse 19) at [[Deut. 13:5]].

sections:
  - range: 1-13
    heading: Three cities for the slayer
    plain: |
      When the LORD your God has cut off the nations whose land He is giving you, and you have driven them out and live in their towns and houses, set apart three cities in the middle of the land. Build roads to them, and divide your land into three regions, so that anyone who has killed someone can flee to one of them. This is the case of the killer who may flee there and live: someone who kills his neighbour without meaning to, with no hatred between them before. Say two men go into the forest to cut wood, and as one swings the axe at a tree the head flies off the handle and strikes the other, and he dies. The one who swung the axe may flee to one of these cities and live. Otherwise the avenger of blood, in the heat of his anger, might chase him down and kill him because the road was long, though he did not deserve to die, since he had not hated the man. That is why I command you to set apart three cities. If the LORD your God enlarges your borders, as He swore to your fathers, and gives you all the land He promised them, because you keep all these commandments, loving the LORD your God and always walking in His ways, then add three more cities to these three. So innocent blood will not be shed in the land the LORD your God is giving you, and the guilt of bloodshed will not fall on you. But if a man hates his neighbour, lies in wait for him, attacks him and kills him, and then flees to one of these cities, the elders of his own town are to send and bring him back and hand him over to the avenger of blood to die. Do not pity him. Purge the guilt of innocent blood from Israel, so that it may go well with you.
  - range: 14-14
    heading: The neighbour's boundary stone
    plain: |
      Do not move your neighbour's boundary stone, set up by those who came before, in the inheritance you will receive in the land the LORD your God is giving you to possess.
  - range: 15-21
    heading: Two or three witnesses
    plain: |
      One witness is not enough to establish a charge against a man, whatever the crime or wrong. A charge must be established by the testimony of two or three witnesses. If a malicious witness comes forward to accuse a man of wrongdoing, both parties to the dispute are to stand before the LORD, before the priests and the judges in office at the time. The judges must investigate thoroughly. If the witness proves to be a liar who has testified falsely against his brother, do to him what he intended to do to his brother. So you will purge the evil from among you. The rest of the people will hear of it and be afraid, and no one will do such an evil thing among you again. Show no pity: life for life, eye for eye, tooth for tooth, hand for hand, foot for foot.

notes:
  - ref: 2
    phrase: Thou shalt separate three cities for thee in the midst of thy land
    kind: history
    title: Cities of refuge
    body: |
      A city of refuge was a place where a person who had killed someone could flee, safe from the dead man's kinsman, while awaiting a hearing. Moses commands three in the land west of the Jordan, set where every part of the land could reach one (verse 3), because a long road could cost an innocent man his life (verse 6). Joshua later appointed them: “Kedesh in Galilee in mount Naphtali, and Shechem in mount Ephraim, and Kirjath-arba, which is Hebron, in the mountain of Judah” ([[Josh. 20:7]]). With Bezer, Ramoth and Golan east of the Jordan, they made the six cities “in which a man who had accidentally committed homicide could take refuge from the avenger of blood.” Numbers adds that they were open “for the stranger, and for the sojourner” as well as for Israel ([[Num. 35:15]]).

      The refuge was not a verdict. Reaching the city gave the slayer a hearing, before a body with no stake in the quarrel, and not a pardon. Numbers spells out what followed: the congregation was to “judge between the slayer and the revenger of blood” ([[Num. 35:24]]), and the one judged innocent stayed in the city “unto the death of the high priest” ([[Num. 35:25]]), after which he could go home ([[Num. 35:28]]). This chapter takes for granted the hearing that Numbers describes and adds two cases. The axe head that flies off the handle (verse 5) shows what “ignorantly” means: a death no one planned, between men who were not enemies. And verses 11–13 shut the gate against the murderer: if a man who lay in wait for his neighbour flees to the city, his own town's elders must fetch him out. The line between the two was already drawn at [[Ex. 21:13–14]] (see the note there).
    sources: [lds-scriptures, bd-cities-of-refuge, sc-knowhy-162]

  - ref: 6
    phrase: the avenger of the blood
    kind: words
    title: The avenger is the gōʾēl
    body: |
      The “avenger of the blood” is the dead man's next of kin, the *gōʾēl haddām*, and the law of refuge exists to hold him back. In a world with no police, “one of the most important clan duties” in many ancient cultures was “for the nearest of kin to hunt down and carry out the death-penalty on a person that had slain a member of the sept or family.” The word *gōʾēl* is “conventionally translated as ‘redeemer.’”

      That is why the word reaches far beyond this chapter. Isaiah gives the same title to the LORD: “thy redeemer, the Holy One of Israel” ([[Isa. 41:14]]), one of many places where the Lord is Israel's *gōʾēl*. Here, though, the kinsman's duty is a danger as well as a right. Moses expects him to act “while his heart is hot,” and the cities are there so that grief and anger do not kill a man who “was not worthy of death.”
    sources: [bdb, sc-knowhy-162, lds-scriptures]

  - ref: 9
    phrase: then shalt thou add three cities more for thee, beside these three
    kind: history
    title: Three cities more
    body: |
      The promised three additional cities depended on Israel keeping the commandments, and in one older reading the condition was never met. The extra cities were for a larger land, the whole land promised to Abraham “from the Nile to the Euphrates” (see [[Gen. 15:18]]). They were to be added “to these three,” so they are not the three east of the Jordan that Moses had already set apart. But the land would grow only “if thou shalt keep all these commandments … to love the LORD thy God, and to walk ever in his ways.” On that reading “the circumstances supposed by Moses never existed, since the Israelites did not fulfil the conditions laid down in Deuteronomy 19:9”; even under David and Solomon the lands as far as the Euphrates were made to pay tribute, not possessed.

      The cities the scriptures name are six, “three on each side of Jordan”: the three of [[Josh. 20:7]] in the land, and on the east, “Bezer in the wilderness upon the plain out of the tribe of Reuben, and Ramoth in Gilead out of the tribe of Gad, and Golan in Bashan out of the tribe of Manasseh” ([[Josh. 20:8]]).
    sources: [keil-deuteronomy, bd-cities-of-refuge, lds-scriptures]

  - ref: 14
    phrase: Thou shalt not remove thy neighbour’s landmark
    kind: history
    title: Why the landmark law stands here
    body: |
      The landmark law protects a family's means of support, and one older reading explains its place between laws about killing and laws about witnesses by the same concern for life. The landmark is set here not because of the cities of refuge but “on account of the close connection in which a man's possession as the means of his support stood to the life of the man himself.” A family's field was its living; to move its boundary stone was to take part of that living, and the land was an inheritance from the LORD (“in thine inheritance, which thou shalt inherit”).

      Other Old Testament passages repeat the landmark law. At Ebal the Levites would curse the man who did it, and the people answer: “Cursed be he that removeth his neighbour’s landmark. And all the people shall say, Amen” ([[Deut. 27:17]]). Proverbs repeats it as wisdom: “Remove not the ancient landmark, which thy fathers have set” ([[Prov. 22:28]]).
    sources: [keil-deuteronomy, lds-scriptures]

  - ref: 15
    phrase: at the mouth of two witnesses, or at the mouth of three witnesses, shall the matter be established
    kind: scripture
    title: Two or three witnesses
    body: |
      The rule of two or three witnesses appears to protect the accused, and later scripture applies it beyond the court. In its own setting, “amid a list of civil laws, the law of witnesses appears to be focused on protecting the accused from immediate consequences of violated civil laws.” Chapter 17 had applied it to a capital charge, “he that is worthy of death” ([[Deut. 17:6]]); here it covers “any iniquity, or … any sin,” and the verses that follow deal with the witness who lies (the note at verse 19).

      The New Testament keeps it as law and as practice. A disciple wronged by a brother is told to “take with thee one or two more, that in the mouth of two or three witnesses every word may be established” ([[Matt. 18:16]]). Before his third visit to Corinth, Paul writes, “In the mouth of two or three witnesses shall every word be established” ([[2 Cor. 13:1]]). Hebrews says, “he that despised Moses’ law died without mercy under two or three witnesses” ([[Heb. 10:28]]).

      Latter-day scripture uses it of revelation. The Lord tells Joseph Smith and Oliver Cowdery that “in the mouth of two or three witnesses shall every word be established” ([[D&C 6:28]]), and promises of the plates that “in the mouth of three witnesses shall these things be established” ([[Ether 5:4]]). The principle was “the basis of ancient Israelite law,” and the Book of Mormon's three witnesses have been read as given for the same reasons. Nephi uses it inside his own record, setting his testimony beside Isaiah's and Jacob's, “three separate yet unified voices … to satisfy God’s law of witnesses.” The two uses are not the same: a Latter-day Saint “may believe the law of witnesses refers to multiple sources establishing spiritual truth,” while in Moses' court it decided who would live or die.
    sources: [evans-second-nephi, bd-deuteronomy, lds-scriptures, sc-knowhy-267, sc-knowhy-37]

  - ref: 19
    phrase: as he had thought to have done unto his brother
    kind: scripture
    title: The false witness takes his own sentence
    body: |
      A witness who lied in court suffered the penalty he had meant to bring on the man he accused. The false witness is judged by what he plotted. Both men had to “stand before the LORD, before the priests and the judges,” who made “diligent inquisition” (verses 17–18). The matching penalty is the “eye for eye” of verse 21.

      Two Book of Mormon episodes have been connected with the law against false witnesses. Sherem accused Jacob of perverting the law of Moses, then confessed to lying before he died ([[Jacob 7:19–20]]); in one reading, as a false accuser he “became subject to the provisions of Deuteronomy 19:16–21.” One reason offered for Nephi's slaying of Laban is that, by calling Nephi's brothers robbers ([[1 Ne. 3:13]]), Laban “had falsely accused them of a capital crime.”
    sources: [lds-scriptures, sc-knowhy-73, sc-knowhy-256]

christ: |
  Challenged that He bore record of Himself, He answered from this chapter's rule: “It is also written in your law, that the testimony of two men is true. I am one that bear witness of myself, and the Father that sent me beareth witness of me” ([[John 8:17–18]]). Nephi applies the same rule to the witnesses of Christ in his record: “by the words of three, God hath said, I will establish my word” ([[2 Ne. 11:3]]). The word for the kinsman who must act for the dead, *gōʾēl*, is the word Isaiah uses when he calls the LORD Israel's Redeemer (the note at verse 6).

explore: |
  - [[Num. 35:9–34]] and [[Josh. 20]]: the cities of refuge commanded, with the hearing before the congregation, and then appointed by name.
  - [[Ex. 21:12–14]]: the first law on killing with and without intent.
  - [[Matt. 18:15–17]] and [[2 Cor. 13:1]]: the rule of witnesses in the New Testament.
  - [[2 Ne. 11:2–3]], [[2 Ne. 27:12–14]] and [[Ether 5:2–4]]: the law of witnesses applied to the testimony of Christ and of the Book of Mormon.
  - [[Jacob 7:1–20]]: Sherem, the false accuser.

