chapter: 30
title: Choose Life
tagline: Moses looks past the curses to a scattered Israel that remembers, returns and is gathered, with hearts the LORD Himself will circumcise; then he sets life and death before the people and pleads with them to choose life.
when: 'In the plains of Moab, in the fortieth year after the Exodus'

setting: |
  Moses is still speaking in Moab in the fortieth year after the Exodus ([[Deut. 1:3–5]]), at the covenant made there “beside the covenant which he made with them in Horeb” ([[Deut. 29:1]], where the note explains the renewal). Chapter 30 ends the third of his three addresses, which runs from 29:2 to the end of this chapter. The address moves through the covenant's past (29:2–8), present (29:9–15) and future (29:16–29; 30:1–10) before calling Israel to decide (30:11–20).

  Chapter 29 ended with a land laid waste and a people cast “into another land” ([[Deut. 29:28]]). Chapter 30 begins on the far side of that disaster: “the promise of the ability to return fills chapter 30.” Then Moses comes back to the day he is speaking in, sets life and death before Israel, and calls heaven and earth to witness.

  Later scripture comes back to the chapter twice. Paul quotes verses 12–14 and reads them of Christ ([[Rom. 10:6–8]]), and Lehi's teaching that men are “free to choose” ([[2 Ne. 2:27]]) strongly echoes verse 19.

thread: |
  The chapter turns on return: Israel returns to the LORD, and the LORD gathers and restores Israel. In verses 1–10 the Hebrew verb *shub*, “return, turn back, restore,” runs through it. In verses 1–10 it stands behind “call them to mind” (verse 1, literally bring them back to the heart), Israel's “return” (verses 2, 8, 10), and the LORD's “turn” and “return” (verse 3) and “again” (verse 9). One study finds deliberate wordplay here on the word that can mean “to repent,” “to return” or “to restore,” and sums it up: “When Israel repents, Israel can return because Yahweh will restore.”

  Verses 11–20 come back from the future to the present. What the LORD will one day do for a scattered people is no reason to wait: the commandment is not too hard and not far off but “in thy mouth, and in thy heart.” So Moses ends his address by setting two ways before Israel, life and good, death and evil, calls heaven and earth to witness, and tells them which to choose. The last verse gives the reason: the LORD “is thy life, and the length of thy days.”

sections:
  - range: 1-10
    heading: When thou shalt return
    plain: |
      When all these things have come on you, the blessing and the curse I have set before you, and you take them to heart among all the nations where the LORD your God has driven you, and you return to the LORD your God and obey His voice in everything I command you today, you and your descendants, with all your heart and all your soul, then the LORD your God will bring you back from your captivity and have compassion on you, and will gather you again from all the nations where He scattered you (see the note on verse 3). Even if some of you are driven out to the far edge of the sky, the LORD your God will gather you and bring you back from there. He will bring you into the land your fathers possessed, and you will possess it; He will do you good and multiply you above your fathers. The LORD your God will circumcise your heart and the heart of your children, so that you will love the LORD your God with all your heart and all your soul, and live. He will turn all these curses on your enemies, on those who hated and persecuted you. And you will again obey the voice of the LORD and keep all His commandments that I give you today. The LORD your God will make you prosper in all the work of your hands, in your children, your cattle and your land; for the LORD will again delight in doing you good, as He delighted in your fathers, when you listen to the voice of the LORD your God, keep His commandments and statutes written in this book of the law, and turn to Him with all your heart and all your soul.
  - range: 11-14
    heading: The word is very nigh
    plain: |
      This commandment that I give you today is not too hard for you, and it is not far away (see the note on verse 12). It is not up in heaven, so that you would have to say, “Who will go up to heaven for us and bring it down to us, so that we can hear it and do it?” It is not across the sea, so that you would have to say, “Who will cross the sea for us and bring it back to us, so that we can hear it and do it?” No, the word is very near you, in your mouth and in your heart, so that you can do it.
  - range: 15-20
    heading: Life and death set before thee
    plain: |
      See, today I have set before you life and good, and death and evil. I command you today to love the LORD your God, to walk in His ways, and to keep His commandments, statutes and judgments, so that you may live and multiply, and the LORD your God will bless you in the land you are going in to possess. But if your heart turns away and you will not listen, and you are drawn away to worship other gods and serve them, I declare to you today that you will surely perish; you will not live long in the land you are crossing the Jordan to possess. I call heaven and earth to witness against you today that I have set before you life and death, blessing and cursing. So choose life, that you and your descendants may live, loving the LORD your God, obeying His voice and holding fast to Him; for He is your life and the length of your days, so that you may live in the land the LORD swore to give to your fathers, to Abraham, to Isaac and to Jacob.

notes:
  - ref: 1
    phrase: when all these things are come upon thee
    kind: prophets
    title: Scattered with a promise
    body: |
      The LORD promises to gather Israel after its scattering. The verse says “when,” not “if”: the blessing and the curse he has set before them will both come, and Israel will find itself among the nations “whither the LORD thy God hath driven thee.” The pattern is older than Deuteronomy: the curses of Leviticus also end with the promise of return ([[Lev. 26:40–45]]), “beautiful assurances that Israel can return when they repent.”

      The order of verses 1–5 is the point. Israel first remembers (“call them to mind”), then returns to the LORD and obeys “with all thine heart, and with all thy soul”; then the LORD has compassion, gathers them from the nations and brings them into the land. President Russell M. Nelson asked why Israel was scattered and answered, “Because the people broke the commandments and stoned the prophets.” Yet the Father “scattered them with a promise that one day Israel would be gathered again into His fold.”

      Moses gave the same promise more briefly at the end of his first address; the note at [[Deut. 4:30]] says what the return includes.
    sources: [muhlestein-everlasting-covenant, nelson-teachings-gathering, lds-scriptures]

  - ref: 3
    phrase: turn thy captivity
    kind: words
    title: Turn thy captivity
    body: |
      “Turn thy captivity” means to restore Israel after disaster, not only to release the people from exile. The noun, *shebut*, means captivity or exile, but the phrase can also mean to restore someone's fortunes. The King James uses the same words for Job, who was never taken captive: “the LORD turned the captivity of Job” ([[Job 42:10]]), where the idiom means to “restore fortunes of individuals.” Modern translations of this verse go both ways: “return you from your captivity,” or “restore your fortunes.” Either way, the LORD will give back what the curses took. The verb in the idiom is *shub*.
    sources: [bdb, nrsvue, dundas-ancient-israel, oshb-wlc]

  - ref: 6
    phrase: the LORD thy God will circumcise thine heart
    kind: symbol
    title: The LORD will circumcise thine heart
    body: |
      Here Moses presents circumcision of the heart as the LORD's own work. In chapter 10 Israel was told, “Circumcise therefore the foreskin of your heart” ([[Deut. 10:16]]); here “the LORD thy God will circumcise thine heart.” Circumcision was the covenant's sign in Abraham's flesh ([[Gen. 17:10–14]]), and the heart's circumcision is that covenant taken inward, “a symbolic invitation to internalize the commitments associated with circumcision.” Of the two, one study concludes, “the covenant was everlasting, but the sign was not.”

      The verse also says what the changed heart is for: “to love the LORD thy God with all thine heart, and with all thy soul,” the great commandment of [[Deut. 6:5]] (explained there). And the promise reaches past the generation that returns, to “the heart of thy seed.”

      The theme page [For He Is Thy Life](/deuteronomy/themes/for-he-is-thy-life/) follows “for thy life” in this verse to “he is thy life” in 30:20.
    sources: [wessel-circumcision, lds-scriptures]

  - ref: 12
    phrase: It is not in heaven
    kind: scripture
    title: 'Not in heaven: Moses and Paul'
    body: |
      Moses says the commandment is within Israel's reach; Paul reads its nearness in relation to Christ. Verse 11 says the commandment is not too hard or too far away; a modern translation has “not too hard for you, nor is it too far away.” No one has to climb to heaven or cross the sea to fetch the commandment: Moses has spoken it to Israel “this day,” and it is “in thy mouth, and in thy heart, that thou mayest do it.”

      Paul quotes verses 12–14 and adds his own glosses in parentheses: “Who shall ascend into heaven? (that is, to bring Christ down from above:)” ([[Rom. 10:6]]). For the sea he writes the deep: “Who shall descend into the deep? (that is, to bring up Christ again from the dead.)” ([[Rom. 10:7]]). The near word is “the word of faith, which we preach” ([[Rom. 10:8]]), and the mouth and heart of verse 14 become confession and belief: “confess with thy mouth the Lord Jesus, and shalt believe in thine heart that God hath raised him from the dead” ([[Rom. 10:9]]). Paul reads the near word as the gospel of Christ.

      The theme page [Speak Not Thou in Thine Heart](/deuteronomy/themes/speak-not-in-thine-heart/) shows that Paul's “Say not in thine heart” takes its clause from 9:4.
    sources: [nrsvue, lds-scriptures]

  - ref: 19
    phrase: therefore choose life
    kind: scripture
    title: Choose life
    body: |
      Lehi's teaching on agency echoes Moses' choice between life and death. Setting obedience and disobedience before a people as the choice between “life and good” and “death and evil” (verse 15) is “a common framework from antiquity known as the ‘two ways,’” found in other parts of the Bible as well. The image of the way of life and the way of death “is distinctive to Deuteronomy in the scene where Moses presented it to Israel on the plains of Moab.”

      Lehi's statement “strongly echoes” this verse: men “are free to choose liberty and eternal life, through the great Mediator of all men, or to choose captivity and death” ([[2 Ne. 2:27]]). His son Jacob uses the same image: “ye are free to act for yourselves—to choose the way of everlasting death or the way of eternal life” ([[2 Ne. 10:23]]).

      This verse has been read as an example of a covenant form that joins blessings and curses; one outline of the form lists heaven and earth, called “to record” here and at [[Deut. 4:26]] and [[Deut. 31:28]], as the covenant's witnesses. The renewal itself is explained at [[Deut. 29:1]].
    sources: [ot-minute-deut-rappleye, seely-self-reference, sc-knowhy-287, uriona-curses]

christ: |
  The LORD who promises to gather Israel and to circumcise its heart, and who is “thy life, and the length of thy days,” is Jehovah, the premortal Christ (see the note at [[Ex. 3:14]]). Paul reads the near word of verses 12–14 as the word of faith in Him, the Lord who came down and rose from the dead (see the note on verse 12). Lehi sets Moses' choice of life inside His work: men are free to choose eternal life “through the great Mediator of all men” (see the note on verse 19).

  Moses' choice is the one the gathering still sets before a disciple. President Russell M. Nelson taught that “we can choose to let God prevail in our lives, or not,” and that “the Lord is gathering those who are willing to let God prevail in their lives.” The heart that chooses is one the LORD promises to change (verse 6), as the theme page [For He Is Thy Life](/deuteronomy/themes/for-he-is-thy-life/) follows.

explore: |
  - [[Jer. 31:31–34]] and [[Ezek. 36:24–28]]: the law written in the heart and the new heart; the theme [A New Heart and a New Spirit](/ezekiel/themes/new-heart-new-spirit/) follows the promise through Ezekiel.
  - [[D&C 110:11]]: Moses commits “the keys of the gathering of Israel from the four parts of the earth.”
  - [[Rom. 10:4–13]]: Paul's reading of verses 12–14 in full.
  - [[2 Ne. 2:25–30]]: Lehi on the choice of life.

