chapter: 11
title: A Land That Drinks the Rain of Heaven
tagline: Moses closes the first part of his second address by calling on the men who saw Egypt's plagues to remember them, describes a land watered by heaven rather than by hand, and sets before Israel a blessing and a curse to be spoken from two mountains.
when: 'In the plains of Moab, in the fortieth year after the Exodus'

setting: |
  Moses' second address runs from chapter 5 to chapter 26 in two parts: “5–11, the Ten Commandments and a practical exposition of them,” and “12–26, a code of laws.” Chapter 11 ends the first part. Read as an ancient covenant, the book puts 4:45–11:32 under the heading “General stipulations” and chapters 12–26 under “Specific stipulations.” Here the exhortation stops, and the detailed laws begin.

  Verses 13–21 are the second of the Shema's three passages; the Shema is explained at [[Deut. 6:4]]. Verses 18–21 repeat much of [[Deut. 6:6–9]]. The chapter ends with a command for later: once across the Jordan, Israel is to put the blessing on Mount Gerizim and the curse on Mount Ebal (see the note on [[Deut. 11:29]]).

thread: |
  The chapter argues that **Israel's life in the land will depend on its loyalty, because the land itself depends on heaven.** It opens as the exposition began, “Thou shalt love the LORD thy God” ([[Deut. 11:1]]; see [[Deut. 6:5]]), and then gives three reasons to keep the commandments.

  The first is memory. Moses turns to the men in front of him and insists that it was “your eyes” that saw the plagues, the sea and the earth swallowing Dathan and Abiram ([[Deut. 11:7]]). The second is the land. Moses sets Canaan against Egypt: Egypt was watered by human labor, while Canaan waits on the rain of heaven, which the LORD will give or hold back as Israel serves Him or turns to other gods (verses 8–17). The third is possession. If Israel keeps the words on its heart, at its door and before its children, the LORD will drive out nations stronger than Israel and give it every place its feet tread (verses 18–25).

  The last verses sum up the choice: “I set before you this day a blessing and a curse” ([[Deut. 11:26]]). The blessing and the curse are to be spoken from two mountains in the middle of the land, and so, in the same reading, “as it were” transferred “to the land” itself (verses 26–32). Blessings and curses are a part of the covenant pattern the whole book follows, and they return at length in chapter 28 (see also [[Deut. 30:19]]).

sections:
  - range: 1-7
    heading: You saw it with your own eyes
    plain: |
      So love the LORD your God, and always keep His charge: His statutes, His judgments and His commandments. Understand this today, for I am not talking to your children, who have not known or seen the LORD your God's discipline. They did not see His greatness, His mighty hand and outstretched arm, or the signs and deeds He did in Egypt to Pharaoh king of Egypt and to all his land. They did not see what He did to Egypt's army, its horses and chariots: how He made the water of the Red Sea flow over them as they chased you, and destroyed them to this day. They did not see what He did for you in the wilderness until you came to this place, or what He did to Dathan and Abiram, sons of Eliab the son of Reuben, when the earth opened its mouth in the middle of all Israel and swallowed them, their households, their tents and everything that went with them. But your own eyes saw all the great deeds the LORD did.
  - range: 8-17
    heading: A land the LORD watches over
    plain: |
      So keep every commandment I give you today, so that you may be strong and go in and take the land you are crossing over to possess, and so that you will live long in the land the LORD swore to give your fathers and their descendants, a land flowing with milk and honey. The land you are going into is not like Egypt, where you came from. There you sowed your seed and watered it with your foot, like a vegetable garden. The land you are going to possess is a land of hills and valleys that drinks the rain of heaven, a land the LORD your God cares for; His eyes are on it always, from the beginning of the year to its end. If you listen carefully to the commandments I give you today, to love the LORD your God and serve Him with all your heart and soul, I will give your land its rain at the right time, the early rain and the late rain, so that you can gather your grain, your wine and your oil. I will put grass in your fields for your cattle, and you will eat and be satisfied. Be careful that your heart is not deceived, so that you turn away and serve and worship other gods. Then the LORD's anger would burn against you; He would shut up the sky so that no rain falls and the ground yields no crop, and you would soon perish from the good land the LORD is giving you.
  - range: 18-25
    heading: Keep these words and possess the land
    plain: |
      So put these words of mine in your heart and soul. Tie them as a sign on your hand, and let them be as frontlets between your eyes. Teach them to your children, talking about them when you sit at home and when you walk on the road, when you lie down and when you get up. Write them on the doorposts of your house and on your gates, so that your days and your children's days may be many in the land the LORD swore to give your fathers, as long as the heavens are above the earth. If you carefully keep all these commandments I give you, loving the LORD your God, walking in all His ways and holding fast to Him, then the LORD will drive out all these nations ahead of you, and you will take the land of nations greater and stronger than you. Every place where the soles of your feet tread will be yours: your territory will run from the wilderness to Lebanon, and from the river, the Euphrates, to the uttermost sea. No one will be able to stand against you; the LORD your God will put the fear and dread of you on all the land you tread, as He promised you.
  - range: 26-32
    heading: A blessing and a curse
    plain: |
      Look: today I am setting before you a blessing and a curse. The blessing, if you obey the commandments of the LORD your God that I give you today; the curse, if you do not obey them but turn from the way I command you today and follow other gods you have not known. When the LORD your God has brought you into the land you are going to possess, you shall put the blessing on Mount Gerizim and the curse on Mount Ebal. Those mountains are on the other side of the Jordan, along the road toward the sunset, in the land of the Canaanites who live in the champaign, opposite Gilgal, beside the plains of Moreh. For you shall cross the Jordan to go in and possess the land the LORD your God is giving you; you will possess it and live in it. Be careful to do all the statutes and judgments I set before you today.

notes:
  - ref: 2
    phrase: I speak not with your children which have not known
    kind: history
    title: Who had seen the plagues
    body: |
      Moses sets his hearers apart from their children, who “were not aware of all that God had done for their fathers.” Forty years after Egypt, “the original Exodus generation had largely passed away, and those about to enter the land had either been children or not yet born” when the covenant was made at Sinai. The sentence of [[Num. 14:29–31]] fell on those “from twenty years old and upward,” and the LORD promised to bring “your little ones” into the land. Some of the men before Moses were those little ones, and he holds them to what they saw: “your eyes have seen all the great acts of the LORD” ([[Deut. 11:7]]).
    sources: [ot-manual-dt-1-16, ot-minute-deut-rappleye, lds-scriptures]

  - ref: 6
    phrase: what he did unto Dathan and Abiram
    kind: history
    title: Dathan and Abiram, without Korah
    body: |
      Dathan and Abiram were the Reubenites who joined Korah's rebellion against Moses and Aaron ([[Num. 16:1–3]]). When Moses summoned them they answered, “We will not come up,” and accused him of bringing them “out of a land that floweth with milk and honey, to kill us in the wilderness” ([[Num. 16:12–14]]). Moses made the outcome the test of his calling ([[Num. 16:28–30]]): “the earth opened her mouth, and swallowed them up,” and “all Israel that were round about them fled at the cry of them” ([[Num. 16:32–34]]).

      Deuteronomy names only Dathan and Abiram. Numbers says the two were swallowed “together with Korah,” and adds, “Notwithstanding the children of Korah died not” ([[Num. 26:9–11]]). One older reading takes that as the reason: Moses leaves Korah out “probably from regard to his sons, who were not swallowed up by the earth along with their father, but had lived to perpetuate the family of Korah.” Neither text says so.
    sources: [lds-scriptures, keil-deuteronomy]

  - ref: 10
    phrase: wateredst it with thy foot
    kind: history
    title: Watered by foot, or by heaven
    body: |
      Moses' point is that Egypt's crops depended on human labor and Canaan's would depend on God. Egypt has “hardly any rain at all.” Its fields drew on the yearly flood of the Nile, carried to them “by the construction of canals and ponds throughout the land,” by lifting machines, or in vessels. In one older reading, “with thy foot” refers to water wheels “worked by the feet”; the reading is offered as probable, not certain. Canaan, by contrast, “drinketh water of the rain of heaven” ([[Deut. 11:11]]), so that “it depended entirely upon the Lord how long its inhabitants should live therein.”

      Canaan's dependence on rain was real. The land lies at the southern edge of the storm systems that bring its rain, so that in some years parts of it get none, and through its climate and rainfall God would try His people. The next verses tie the rain to Israel's loyalty (verses 13–17), and Moses calls it a land the LORD “careth for” and watches “from the beginning of the year even unto the end of the year” ([[Deut. 11:12]]). The rains and regions of the land are in the guide [The Land](/old-testament/guides/the-land/#regions).
    sources: [keil-deuteronomy, ogden-1980-testing-ground, lds-scriptures]

  - ref: 14
    phrase: the first rain and the latter rain
    kind: history
    title: The early and the late rain
    body: |
      The two rains open and close the rainy season. In that land rain “begins to fall in October and continues in November and early December (the ‘early rain’),” the “vital ‘winter rain’” of January and February “soaks the soil and fills the cisterns,” and “the biblical ‘latter rain’ comes in March and April.” After May, “rain hardly ever falls until the end of September.”
    sources: [bd-rain]

  - ref: 17
    phrase: he shut up the heaven, that there be no rain
    kind: scripture
    title: When the heavens were shut
    body: |
      Verse 17 threatens drought, and in the Bible a famine in Canaan was, as a rule, a year without rain: “Famine generally meant no rain.” Among the famines of that kind is the one “that resulted from Elijah’s curse on Israel,” when Elijah told Ahab, “There shall not be dew nor rain these years, but according to my word” ([[1 Kgs. 17:1]]).

      The Book of Mormon has a parallel. Nephi, son of Helaman, asked the Lord to send famine instead of war, “to stir them up in remembrance of the Lord their God” ([[Hel. 11:4–5]]). Nephi's famine has been read within the covenant pattern this chapter sets out, by which “ancient Israelites were generally promised rainfall for righteousness and famine for wickedness.”
    sources: [ogden-1980-testing-ground, sc-knowhy-750, lds-scriptures]

  - ref: 24
    phrase: from the river, the river Euphrates
    kind: history
    title: How far the promised border reached
    body: |
      The Euphrates was the boundary of the land promised to Abraham's seed ([[Gen. 15:18]]), and “this boundary was reached in the time of David.” The promise is conditional here: the land would be Israel's “if ye shall diligently keep all these commandments” ([[Deut. 11:22]]).
    sources: [bd-euphrates, lds-scriptures]

  - ref: 29
    phrase: thou shalt put the blessing upon mount Gerizim, and the curse upon mount Ebal
    kind: history
    title: Gerizim and Ebal
    body: |
      Gerizim and Ebal are the two hills that face each other across the valley of Shechem, in the middle of the land. Shechem lay “in a beautiful plain among the mountains of Ephraim, close to the two hills Ebal and Gerizim,” and it was where Abram first stopped in the land, at “the plain of Moreh”; there the LORD promised him the land, and Abram built an altar ([[Gen. 12:6–7]]). Verse 30's “plains of Moreh” point to the same place. For the blessing and the curse, Moses chose “two of the most prominent hills in central Canaan to use as object lessons.”

      Moses gives the details in [[Deut. 27:12–13]], with six tribes on each mountain. Joshua carried it out after the fall of Ai: he built an altar on Ebal, and with the ark in the valley, half the people stood “over against mount Gerizim, and half of them over against mount Ebal,” while he read “the blessings and cursings” ([[Josh. 8:30–34]]). His altar, offerings and law written on stones recall “Moses’s actions at Sinai.”
    sources: [bd-shechem, ot-manual-dt-1-16, parker-cutting, lds-scriptures]

christ: |
  The LORD who sends or withholds the rain, and whose eyes are on the land all year, is Jehovah, and “Jehovah is the premortal Jesus Christ” (see the note at [[Ex. 3:14]]).

  The Church's footnote to verse 29 points from Gerizim to [[John 4:20]]. At Jacob's well near Sychar, a Samaritan woman told Jesus, “Our fathers worshipped in this mountain; and ye say, that in Jerusalem is the place where men ought to worship.” The mountain was Gerizim, where the Samaritans had built “a rival temple of their own.” Jesus answered that the hour was coming when men would worship the Father “neither in this mountain, nor yet at Jerusalem,” but “in spirit and in truth” ([[John 4:21–24]]). The link between the two passages is the footnote's; neither names the other.

explore: |
  - [[Deut. 6:4–9]] and [[Deut. 11:13–21]]: the first two passages of the Shema, side by side.
  - [[Deut. 27:1–26]] and [[Josh. 8:30–35]]: the ceremony on Gerizim and Ebal, commanded and carried out.
  - [[Num. 16]]: Korah, Dathan and Abiram.
  - [[1 Kgs. 17–18]] and [[Hel. 11]]: the heavens shut and opened by Elijah and by Nephi.
  - [[Deut. 30:15–20]]: the blessing and the curse set before Israel again, and the choice of life.

