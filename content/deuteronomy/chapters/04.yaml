chapter: 4
title: Keep Thy Soul Diligently
tagline: Moses turns from Israel’s journey to its meaning. They heard God’s voice at Horeb and saw no form, so they must make no image; if they forget, they will be scattered, and if they seek Him from there, they will find Him.
when: 'In the plains of Moab, in the fortieth year after the Exodus (1:3, 5), in the valley over against Beth-peor (3:29; 4:46).'

setting: |
  Chapter 4 closes Moses’ first address. Chapters 1–3 retold the road from Horeb to the plains of Moab; the address as a whole, from 1:6 to 4:40, recounts the most important events of the wilderness wanderings and reminds Israel not to forget the laws given at Sinai. The chapter opens “Now therefore,” and with those words the history becomes an appeal: Moses turns from what the Lord has done for Israel to an exhortation to keep His law.

  Israel is camped across the Jordan from the land, “in the valley over against Beth-peor” (verse 46). Moses has just been told he will not cross over ([[Deut. 3:26–27]]), and he speaks as a man who will not see what comes next.

  Verses 41–43 tell briefly how Moses set apart three cities of refuge, and verses 44–49 are the heading of the second address, which begins in chapter 5.

  The chapter’s language is heard again in the Book of Mormon. Lehi’s farewell to his sons ([[2 Ne. 1:16]]), like Moses’ farewell, includes calls “to remember the statutes and judgments of God.”

thread: |
  The chapter makes one argument: **Israel’s life depends on remembering what it saw and heard, and the heart of what it heard is that the LORD alone is God.**

  It moves in five steps. Moses calls Israel to hear and keep the law, adding nothing and taking nothing away, because Israel’s wisdom before the nations lies in it (verses 1–8). He warns them not to forget the day at Horeb and to teach it to their children (verses 9–14; teaching the children is explained at [[Deut. 6:7]]). From Horeb he draws the warning against images: they heard a voice and saw no form, so they must make no likeness of anything (verses 15–24). He foresees what will happen if they forget: they will be scattered and serve gods of wood and stone, and yet if they seek the LORD from there they will find Him (verses 25–31). And he gives the reason from history: no people ever heard God speak out of fire and lived, or was taken out of another nation as Israel was (verses 32–40).

  Twice the argument comes to the same confession: “the LORD he is God; there is none else beside him” (verse 35), “in heaven above, and upon the earth beneath: there is none else” (verse 39). Within this argument Moses mentions again that he himself may not cross the Jordan “for your sakes” (verse 21; see [[Deut. 3:26]]), and he calls God “a consuming fire, even a jealous God” (verse 24; on “jealous” see [[Ex. 20:5]]).

  The address ends at verse 40 with “that it may go well with thee.” Moses then sets apart three cities east of the Jordan (verses 41–43), and verse 44 is a heading for the law he is about to lay out: “And this is the law which Moses set before the children of Israel.”

sections:
  - range: 1-8
    heading: Your wisdom before the nations
    plain: |
      Now, Israel, listen to the statutes and judgments I am teaching you, and do them, so that you may live and go in and take the land the Lord God of your fathers is giving you. Don’t add to what I command you and don’t take anything away from it; keep the commandments of the Lord your God. You saw what the Lord did at Baal-peor: He destroyed from among you every man who followed Baal-peor. But you who held fast to the Lord your God are all alive today. I have taught you statutes and judgments as the Lord my God commanded me, so that you will live by them in the land you are entering. Keep them and do them. Keeping them will be your wisdom and understanding in the eyes of the nations; they will hear of these statutes and say, “This great nation is surely a wise and understanding people.” What nation is so great that it has a God as near to it as the Lord our God is whenever we call on Him? And what nation is so great that it has statutes and judgments as righteous as all this law I set before you today?
  - range: 9-14
    heading: The day at Horeb
    plain: |
      Only be careful, and guard your soul diligently, so that you don’t forget what your eyes have seen, or let it slip from your heart as long as you live. Teach it to your children and grandchildren. Above all remember the day you stood before the Lord your God at Horeb, when the Lord said to me, “Gather the people to Me, and I will let them hear My words, so that they learn to fear Me all their lives on the earth and teach their children.” You came near and stood at the foot of the mountain, and the mountain burned with fire up into the heart of heaven, with darkness, cloud, and thick darkness. The Lord spoke to you out of the fire. You heard the sound of words but saw no form; there was only a voice. He declared His covenant to you, the ten commandments, which He commanded you to keep, and He wrote them on two tablets of stone. And the Lord commanded me then to teach you statutes and judgments for you to do in the land you are crossing over to possess.
  - range: 15-24
    heading: No form, so no image
    plain: |
      So be very careful, since you saw no form of any kind on the day the Lord spoke to you at Horeb out of the fire. Do not corrupt yourselves by making a carved image in the shape of any figure: a man or a woman, any animal on the earth, any bird that flies in the air, anything that creeps on the ground, or any fish in the waters under the earth. And when you look up at the sky and see the sun, the moon, and the stars, all the host of heaven, don’t be drawn away to worship and serve them, which the Lord your God has allotted to all the nations under heaven. But the Lord took you and brought you out of the iron furnace, out of Egypt, to be His own people, His inheritance, as you are today. The Lord was angry with me because of you, and swore that I would not cross the Jordan or enter the good land the Lord your God is giving you as an inheritance. I must die in this land and not cross the Jordan, but you will cross over and take that good land. Be careful not to forget the covenant the Lord your God made with you, and not to make an image of anything, as the Lord your God has forbidden you. For the Lord your God is a consuming fire, a jealous God.
  - range: 25-31
    heading: Scattered, and found again
    plain: |
      When you have had children and grandchildren and have been long in the land, if you corrupt yourselves and make an image of anything, doing evil in the sight of the Lord your God and provoking Him to anger, I call heaven and earth to witness against you today that you will quickly perish from the land you are crossing the Jordan to possess. You will not live long in it, but will be utterly destroyed. The Lord will scatter you among the nations, and only a few of you will be left among the peoples where the Lord drives you. There you will serve gods made by human hands, wood and stone, which cannot see or hear or eat or smell. But if from there you seek the Lord your God, you will find Him, if you seek Him with all your heart and all your soul. When you are in distress and all these things have come upon you, in the latter days, if you turn back to the Lord your God and obey His voice (for the Lord your God is a merciful God), He will not abandon you or destroy you or forget the covenant He swore to your fathers.
  - range: 32-40
    heading: Has anything like this ever been heard?
    plain: |
      Ask about the days long past, before your time, from the day God created man on the earth, and from one end of heaven to the other: has anything as great as this ever happened, or has anything like it ever been heard of? Did any people ever hear the voice of God speaking out of fire, as you have, and live? Or has God ever tried to go and take a nation for Himself out of another nation, by trials, signs, and wonders, by war, by a mighty hand and an outstretched arm, and by great terrors, as the Lord your God did for you in Egypt before your eyes? You were shown these things so that you would know that the Lord is God; there is no other besides Him. From heaven He let you hear His voice to teach you, and on earth He showed you His great fire, and you heard His words out of the fire. Because He loved your fathers, He chose their descendants after them and brought you out of Egypt Himself, by His great power, to drive out before you nations greater and stronger than you, to bring you in and give you their land as an inheritance, as it is today. So know today, and take it to heart, that the Lord is God in heaven above and on the earth below; there is no other. Keep His statutes and commandments, which I command you today, so that it may go well with you and your children after you, and so that you may live long in the land the Lord your God is giving you for ever.
  - range: 41-43
    heading: Three cities of refuge
    plain: |
      Then Moses set apart three cities on the east side of the Jordan. Someone who had killed his neighbor unintentionally, without having hated him before, could flee to one of them and save his life: Bezer in the wilderness on the plateau, for the Reubenites; Ramoth in Gilead, for the Gadites; and Golan in Bashan, for the Manassites.
  - range: 44-49
    heading: The law Moses set before Israel
    plain: |
      This is the law Moses set before the children of Israel. These are the testimonies, statutes, and judgments Moses spoke to them after they came out of Egypt, on the east side of the Jordan, in the valley opposite Beth-peor, in the land of Sihon king of the Amorites, who lived at Heshbon, whom Moses and the children of Israel defeated after they came out of Egypt. They took his land and the land of Og king of Bashan, the two kings of the Amorites east of the Jordan: from Aroer on the bank of the Arnon River to Mount Sion, that is, Hermon, and all the Arabah east of the Jordan as far as the sea of the Arabah, below the slopes of Pisgah.

notes:
  - ref: 2
    phrase: Ye shall not add unto the word which I command you, neither shall ye diminish ought from it
    kind: prophets
    title: Not a closed canon
    body: |
      The command protects the words Moses delivered, so that Israel would keep them as given (“that ye may keep the commandments”). It does not forbid God to speak again. Moses repeats it at [[Deut. 12:32]], and such a warning “refers only to the writings of that particular prophet.” Revelation ends with a warning of the same kind ([[Rev. 22:18–19]]), and that verse has often been read as closing the canon. One reading sets both beside the curses found in covenantal and sacred texts against changing a text’s words.

      Brigham Young answered the argument from Moses’ own words: if they were meant to shut the heavens, “then the revelations given to Prophets who arose after Moses … all amount to nothing.” Elder Jeffrey R. Holland made the same point from the shape of the Bible itself: “virtually every prophet of the Old and New Testament has added scripture to that received by his predecessors.” Isaiah and Jeremiah came after Moses, and the Lord had told Moses, “My works are without end, and also my words, for they never cease” ([[Moses 1:4]]).
    sources: [ot-manual-dt-1-16, holland-words-never-cease, sc-knowhy-704]

  - ref: 3
    phrase: what the LORD did because of Baal-peor
    kind: history
    title: Baal-peor
    body: |
      Baal-peor had happened a short time before this speech, and Moses’ hearers had seen it. At Shittim the people were invited to the sacrifices of Moab’s gods: they ate, “bowed down to their gods,” and “Israel joined himself unto Baal-peor” ([[Num. 25:2–3]]). Baal-peor was the name under which the Moabites, among others, worshipped Baal. The plague that followed killed twenty-four thousand ([[Num. 25:9]]), and “the plague was stayed” when Phinehas acted ([[Num. 25:8]]; see the note on [[Ps. 106:30]]).

      Moses tells none of this story. He uses it as proof of his first sentence, “that ye may live” (verse 1): those who followed Baal-peor are gone, and “ye that did cleave unto the LORD your God are alive every one of you this day” (verse 4). One older reading notes that he chose this example “because the congregation had passed through all this only a very short time before.” The people listening were the survivors.

      Later scripture remembered the place too. In Hosea the Lord recalls that He found Israel “like grapes in the wilderness,” but “they went to Baal-peor, and separated themselves unto that shame” ([[Hos. 9:10]]); “the Shame” is a name the prophets give Baal. Psalm 106 counts it among Israel’s sins in the wilderness ([[Ps. 106:28]]).
    sources: [lds-scriptures, bd-baal, keil-deuteronomy]

  - ref: 7
    phrase: For what nation is there so great, who hath God so nigh unto them
    kind: structure
    title: Two questions at the center
    body: |
      Verses 7 and 8 are two questions with the same opening, “what nation is there so great,” and they say where Israel’s greatness lies: in a God who is near whenever His people call on Him, and in a law more righteous than any other. Read as a chiasm (a passage whose parts mirror each other around a center), verses 1–14 have these “two rhetorical questions regarding the greatness of Israel near the center.” Moses gives the outward side of it in verse 6: the nations will hear these statutes and call Israel “a wise and understanding people.”
    sources: [sc-knowhy-635]

  - ref: 12
    phrase: 'ye heard the voice of the words, but saw no similitude; only ye heard a voice'
    kind: history
    title: A voice, and no form
    body: |
      At Horeb the people heard God and did not see Him, and verses 15–16 make that the reason for the ban on images. “Similitude” is *tĕmûnâ*, “likeness, form,” the word the second commandment forbids Israel to make ([[Ex. 20:4]], “likeness”). The note on that verse reads these verses as Moses’ own explanation of the commandment.

      The same word names the “form, semblance” of the LORD in Numbers, where the Lord says that He speaks with Moses “mouth to mouth” and “the similitude of the LORD shall he behold” ([[Num. 12:8]]).

      The Church’s footnote to verse 14 points to latter-day revelation about the same time in the wilderness, [[D&C 84:19–23]], where Moses “sought diligently to sanctify his people that they might behold the face of God; But they hardened their hearts and could not endure his presence” ([[D&C 84:23–24]]). In the next chapter Moses tells the people’s side of it: after hearing the voice they were afraid and asked him to go near and listen for them ([[Deut. 5:24–27]]).

      The theme page [Hear Ye Him](/deuteronomy/themes/hear-ye-him/) begins with this voice.
    sources: [bdb, lds-scriptures]

  - ref: 16
    phrase: the likeness of male or female
    kind: symbol
    title: No likeness of male or female
    body: |
      The forbidden likenesses take in the whole visible world: man and woman, beasts, birds, creeping things, fish (verses 16–18), and then the sun, moon and stars (verse 19). Nothing in creation may be made to stand for the LORD. One reading finds a reason in Genesis, where man and woman are made in God’s image ([[Gen. 1:27]]): images were forbidden “at least partially because rather than ‘dumb idols’ … God’s true image is manifest in living, breathing persons.”
    sources: [sc-knowhy-627]

  - ref: 19
    phrase: which the LORD thy God hath divided unto all nations under the whole heaven
    kind: history
    title: Allotted to all nations
    body: |
      The clause seems to say that the LORD handed the sun, moon and stars to the nations, and readers ask whether that means He gave them to the nations to worship. Some ancient readers took it as a gift of light. One older reading rejects that and says the LORD allotted them to the nations for worship, that is, “permitted them to choose them as the objects of their worship.” It compares Paul, who says that God gave up those who knew Him and did not glorify Him ([[Rom. 1:21–26]]).

      On any reading the point of the verse is the contrast with the next one. The nations have the host of heaven; Israel the LORD “hath taken” for Himself (verse 20). The same older reading says Israel was not to imitate the nations for exactly that reason.
    sources: [keil-deuteronomy]

  - ref: 20
    phrase: brought you forth out of the iron furnace, even out of Egypt
    kind: symbol
    title: The iron furnace
    body: |
      The “furnace” (*kûr*) is a smelting furnace, a “pot or furnace for smelting metals,” and the word is used in scripture “always in metaphor or simile of human sufferings in punishment or discipline.” Here the “iron furnace” is Egypt as the “place of bondage,” and Israel’s suffering there is pictured as a smelting furnace from which the LORD took them.

      Solomon uses the image when he dedicates the temple ([[1 Kgs. 8:51]]), and Jeremiah uses it when he calls Judah back to the covenant ([[Jer. 11:4]]). Isaiah’s “furnace of affliction” ([[Isa. 48:10]]) uses the same word, and the note there reads it beside this verse.
    sources: [bdb]

  - ref: 30
    phrase: even in the latter days
    kind: prophets
    title: Even in the latter days
    body: |
      Moses “prophetically foresaw” both the scattering and the return, and he places the return “in the latter days.” The text gives two reasons Israel will be gathered: many will seek and turn to the Lord (verses 29–30), and the Lord will not “forget the covenant of thy fathers” (verse 31; compare verse 37). The gathering includes a return to the lands of Israel’s inheritance, but more important is “a return to the covenants and laws of God.” Elder Bruce R. McConkie defined it: “the gathering of Israel consists of receiving the truth, gaining again a true knowledge of the Redeemer, and coming back into the true fold of the Good Shepherd.”

      Moses gives the promise at greater length at the end of the book, and the note on [[Deut. 30:1]] treats it there.
    sources: [ot-manual-dt-1-16]

  - ref: 41
    phrase: Then Moses severed three cities on this side Jordan toward the sunrising
    kind: history
    title: Three cities set apart
    body: |
      Between the two addresses Moses sets apart three cities east of the Jordan, one for each tribe settled there, for a person who had killed someone without intent and without earlier hatred (verse 42). Such a person could flee to one of these cities, where “a disinterested body of elders and Levites would hear the case.” The law itself comes later, at [[Deut. 19:2]], which explains it in full.

      Why tell it here, between the end of one speech and the heading of the next? The Lord had commanded the cities ([[Num. 35:6]], [[Num. 35:14]]), and one older reading says the act is told here “in all probability for no other reason than because Moses set apart the cities at that time,” and that it gave the people an example of exact obedience just before he laid the law before them.
    sources: [sc-knowhy-162, keil-deuteronomy]

  - ref: 48
    phrase: even unto mount Sion, which is Hermon
    kind: words
    title: Sion is not Zion
    body: |
      This “Sion” is Mount Hermon, not Zion in Jerusalem. The Hebrew name here is *Śîʾōn*, a proper name “of a mountain, i.e. Hermon.” Zion is *Ṣiyyôn*, the name of the Jebusite stronghold in Jerusalem ([[2 Sam. 5:7]]) that was “captured by David.” The two names begin with different Hebrew letters (*śîn* and *ṣade*); only the English spelling makes them look alike.

      Hermon, “a mountain, 9400 feet high, in the extreme northeast of the Holy Land,” marks the far end of the land taken from Sihon and Og, which ran “from Aroer, which is by the bank of the river Arnon” to this mountain (verses 47–48). The mountain had several names: “Which Hermon the Sidonians call Sirion; and the Amorites call it Shenir” ([[Deut. 3:9]]).
    sources: [bdb, bd-hermon, lds-scriptures]

christ: |
  The LORD who spoke to Israel out of the fire at Horeb is Jehovah, and “Jehovah is the premortal Jesus Christ” (see the note on [[Ex. 3:14]]). Moses asks whether any people ever heard the voice of God out of fire and lived (verse 33). The Church’s footnote to that verse points to the people at Bountiful, who “heard a voice as if it came out of heaven” ([[3 Ne. 11:3]]). There the voice was the Father’s, introducing His Son ([[3 Ne. 11:7]]), and the One Israel had heard and not seen came down and let the multitude touch the prints of the nails ([[3 Ne. 11:14–15]]).

  The chapter’s promise of mercy is His as well. “The LORD thy God is a merciful God; he will not forsake thee” (verse 31), and the scattered who seek Him with all their heart will find Him (verse 29).

explore: |
  - **Horeb told twice.** Read [[Ex. 19:16–20:21]] beside verses 9–14 and [[Deut. 5:22–31]], then [[D&C 84:19–27]].
  - **No image of God.** [[Ex. 20:4–5]], [[Ex. 32:1–8]], and [[Isa. 40:18–26]].
  - **Scattering and gathering.** [[Lev. 26:33–45]], [[Deut. 28:64–68]], [[Deut. 30:1–10]], and [[1 Ne. 22:3–12]].

