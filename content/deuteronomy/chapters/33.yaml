chapter: 33
title: The Blessing of Moses
tagline: Before he dies, Moses blesses eleven of the tribes by name, setting each blessing inside a hymn to the LORD who came from Sinai, whose everlasting arms are underneath His people.
when: 'In the plains of Moab, in the fortieth year after the Exodus'

setting: |
  Moses has sung his song (chapter 32) and been told to go up Mount Nebo and die there ([[Deut. 32:48–50]]). Before he goes up ([[Deut. 34:1]]), he blesses the tribes. The narrator calls him “the man of God” and places the words “before his death” (verse 1), as Genesis places Jacob's blessing of his twelve sons at the end of his life ([[Gen. 49]], where the notes go verse by verse). Jacob blessed “twelve small families”; Moses blesses tribes “numbering thousands each.” Like Jacob's blessing, this one is a poem in an early form of Biblical Hebrew.

  Eleven tribes are named. Simeon is passed over, one older reading explains, because Jacob had said he would be scattered in Israel ([[Gen. 49:7]]), and the tribe “lost his individuality as a tribe,” receiving only towns within Judah's territory ([[Josh. 19:1–9]]). Levi, scattered with him, is blessed instead (see the note on verse 9). Joseph's blessing is the longest, and the Church's chapter heading reads in it the gathering of Israel in the latter days (see the notes on verses 13 and 17).

thread: |
  The blessings of the tribes are set inside a hymn to Israel's God. The opening (verses 2–5) pictures the LORD coming from Sinai with His holy ones, giving the law, and being king in Jeshurun; the closing (verses 26–29) comes back to the same God: “There is none like unto the God of Jeshurun.” One older reading takes the introduction and the conclusion to be Moses' own words, as much as the blessings between them.

  Between the two, the order follows neither the order of birth nor the camp nor the map. Reuben, the firstborn, comes first; then Judah and Levi; then Rachel's sons, Benjamin and Joseph; then Zebulun and Issachar, Leah's last sons, the younger before the elder; and last the sons of the handmaids. The last verse returns to the frame: Israel is happy as a “people saved by the LORD.”

sections:
  - range: 1-5
    heading: The LORD came from Sinai
    plain: |
      This is the blessing with which Moses, the man of God, blessed the children of Israel before his death. He said: The LORD came from Sinai and rose like the dawn on them from Seir; He shone out from Mount Paran, and came with ten thousands of holy ones; from His right hand went a fiery law for them (see the note on verse 2). Yes, He loved the people; all His holy ones are in Your hand; they sat at Your feet, and each receives Your words. Moses gave us a law, the inheritance of the congregation of Jacob. And He was king in Jeshurun when the heads of the people and the tribes of Israel were gathered together.
  - range: 6-11
    heading: Reuben, Judah and Levi
    plain: |
      Let Reuben live and not die, and let his men not be few. This is the blessing of Judah: Hear, LORD, the voice of Judah, and bring him to his people; let his hands be strong enough for him, and be his help against his enemies. Of Levi he said: Let Your Thummim and Your Urim be with Your holy one, whom You tested at Massah and with whom You strove at the waters of Meribah. This holy one said of his father and mother, “I have not seen him,” and did not acknowledge his brothers or know his own children; for they kept Your word and Your covenant (see the note on verse 9). They will teach Jacob Your judgments and Israel Your law; they will put incense before You and whole burnt offerings on Your altar. Bless his substance, LORD, and accept the work of his hands; strike through the loins of those who rise against him and hate him, so that they do not rise again.
  - range: 12-17
    heading: Benjamin and Joseph
    plain: |
      Of Benjamin he said: The beloved of the LORD will dwell in safety by Him; He shelters him all day long, and he dwells between His shoulders (see the note on verse 12). Of Joseph he said: May the LORD bless his land with the precious things of heaven, with the dew and the deep that lies below, with the best fruits the sun brings and the best the moon puts forth, with the finest things of the ancient mountains and the lasting hills, with the best of the earth and all that fills it, and with the good will of Him who dwelt in the bush. Let the blessing come on Joseph's head, on the crown of him who was set apart among his brothers (see the note on verse 13). His majesty is like a firstborn bull's, and his horns are the horns of the wild ox; with them he will push the peoples together to the ends of the earth. They are the ten thousands of Ephraim and the thousands of Manasseh (see the note on verse 17).
  - range: 18-25
    heading: Zebulun to Asher
    plain: |
      Of Zebulun he said: Rejoice, Zebulun, in your going out, and Issachar in your tents. They will call the peoples to the mountain and offer right sacrifices there, for they will draw on the abundance of the seas and treasures hidden in the sand. Of Gad he said: Blessed be He who enlarges Gad; he lives like a lion and tears the arm and the crown of the head. He chose the first portion for himself, for there, in the lawgiver's portion, he had his place; he came with the heads of the people and carried out the justice of the LORD and His judgments with Israel. Of Dan he said: Dan is a lion's cub; he will leap out from Bashan. Of Naphtali he said: Naphtali, satisfied with favor and full of the LORD's blessing, possess the west and the south. Of Asher he said: Let Asher be blessed with children; let him be welcome to his brothers, and let him dip his foot in oil. Your shoes will be iron and bronze, and as your days are, so will your strength be (see the note on verse 25).
  - range: 26-29
    heading: None like the God of Jeshurun
    plain: |
      There is none like the God of Jeshurun, who rides on the heavens to help you and in His majesty on the skies. The eternal God is your dwelling place, and underneath are the everlasting arms (see the note on verse 27). He will drive the enemy out before you and say, “Destroy them.” So Israel will dwell alone in safety; the spring of Jacob will be in a land of grain and wine, and his heavens will drop down dew. Happy are you, Israel! Who is like you, a people saved by the LORD, the shield of your help and the sword of your triumph? Your enemies will be found liars before you, and you will tread on their high places.

notes:
  - ref: 2
    phrase: from his right hand went a fiery law for them
    kind: words
    title: A fiery law
    body: |
      The best-known phrase of the opening is also its least certain. The Hebrew text writes one word, *eshdat*; the scribes’ reading notes divide it into two, *esh dat*, “fire” and “law”: the written form is called the *ketiv*, and the reading the *qere*. The trouble is the second word: *dat* is a loan from Persian, found otherwise “only in Persian period” books (Ezra and Esther), so that the standard lexicon calls the phrase as it stands “corrupt” and lists proposed corrections, among them “flaming fire.” A modern translation renders the line “at his right, a host of his own,” with the note “Meaning of Heb uncertain.”

      The surrounding verses give a steadier picture. The LORD comes from Sinai, dawns from Seir and shines from Mount Paran, with “ten thousands of saints,” which the same modern translation, correcting the Hebrew from the ancient versions, renders “myriads of holy ones.” Whether the phrase means a law or flames, the verse puts the LORD's appearing at Sinai at the head of the blessing, and verse 4 names what He gave there: “Moses commanded us a law, even the inheritance of the congregation of Jacob.”
    sources: [oshb-wlc, bdb, nrsvue, lds-scriptures]

  - ref: 9
    phrase: I have not seen him
    kind: history
    title: Levi, who did not know his brethren
    body: |
      Levi's blessing reverses Jacob's, and verse 9 gives the reason in strange words. Jacob had cursed Levi's anger and said the tribe would be scattered ([[Gen. 49:7]], where the note follows the curse into a calling). Moses asks instead that the Urim and Thummim, which the high priest wore on his breastplate ([[Ex. 28:30]], explained there), be with Levi, the LORD's “holy one,” proved “at Massah” and at “the waters of Meribah.” Yet at both places, at Rephidim ([[Ex. 17:1–7]]) and at Kadesh ([[Num. 20:1–13]]), one older reading observes, “it was primarily the people who strove,” and in those trials Levi proved itself “a holy one,” though at Meribah Moses and Aaron themselves stumbled ([[Num. 20:12]]).

      The one “who said unto his father and to his mother, I have not seen him” is, in the same reading, the tribe at the golden calf, when the sons of Levi answered Moses' call, “Who is on the LORD’s side?” and went through the camp against their own kin ([[Ex. 32:26–29]]; the note on [[Ex. 32:26]] sets that day beside this verse). Verse 9 remembers it: they did not know their kin, “for they have observed thy word, and kept thy covenant,” and so they will teach Israel the law and serve at the altar (verse 10). The same reading sets beside it the Savior's words, “He that loveth father or mother more than me is not worthy of me” ([[Matt. 10:37]]).
    sources: [keil-deuteronomy, lds-scriptures]

  - ref: 12
    phrase: he shall dwell between his shoulders
    kind: symbol
    title: Between his shoulders
    body: |
      Benjamin's blessing pictures, in one older reading, a son carried on his father's back. The Hebrew is hard: three short clauses whose subjects shift, and the second “the LORD” is the translators' (the Hebrew has only “covers him”). That reading makes Benjamin the subject of the last clause: the beloved of the LORD dwells between the LORD's shoulders, “equivalent to ‘upon the back,’” an expression “founded upon the figure of a father carrying his son.” It adds that what Moses wishes for Benjamin belongs to the whole nation, which, like Benjamin, “dwelt with Him in safety,” as verse 28 says of all Israel.

      Not every reader is so sure of the text. Another older commentary judges it “probably corrupt,” and a modern translation has “the Most High surrounds him all day long,” a correction of the Hebrew “above him.”
    sources: [keil-deuteronomy, oshb-wlc, cambridge-deuteronomy, nrsvue]

  - ref: 13
    phrase: Blessed of the LORD be his land
    kind: history
    title: Joseph's blessing
    body: |
      Joseph's blessing is the longest of Moses' blessings. It asks first for the best of the land: “the precious things of heaven,” the dew and “the deep that coucheth beneath,” the fruits of sun and moon, “the ancient mountains” and “the lasting hills.” Much of it repeats Jacob's blessing of Joseph ([[Gen. 49:25–26]]; the note on [[Gen. 49:26]] takes up the hills and their use in latter-day revelation). The two sons of Joseph received land in Canaan that “included some of the richest land in the country.”

      Two phrases go beyond Jacob's words. The blessing is “the good will of him that dwelt in the bush,” the God who called to Moses “out of the midst of the bush” ([[Ex. 3:4]]). And Joseph is “him that was separated from his brethren,” in Hebrew *nezir echav*. *Nazir* is the word for a Nazarite, one set apart by a vow; used of Joseph, here and in [[Gen. 49:26]], it means a prince, “one consecrated among his brethren.”
    sources: [lds-scriptures, bd-ephraim, bdb, oshb-wlc]

  - ref: 17
    phrase: push the people together to the ends of the earth
    kind: scripture
    title: Pushing the people together
    body: |
      Joseph's blessing ends with a bull's horns driving the nations; latter-day revelation applies its words to the gathering of Israel. Joseph's glory is like a firstborn bull's, and his horns are those of the *re'em* (King James “unicorns”), the wild ox, an animal “fierce and strong.” The verb behind “push” is the one for a horned animal's thrust, to “push or thrust at,” and a modern translation renders the line “with them he gores the peoples all together to the ends of the earth.” The horns are named: “the ten thousands of Ephraim” and “the thousands of Manasseh.”

      Of the elders of His Church the Lord used the same words in a revelation to Joseph Smith: “they shall push the people together from the ends of the earth” ([[D&C 58:45]]). Verses 13–17 stand behind the Church's teaching that in the last days it is the privilege of the tribe of Ephraim “first to bear the message of the Restoration of the gospel to the world and to gather scattered Israel.” The fuller promise, “the richer blessing upon the head of Ephraim and his fellows” ([[D&C 133:34]]), is quoted at the note on [[Gen. 49:26]].
    sources: [bdb, nrsvue, lds-scriptures, bd-ephraim]

  - ref: 25
    phrase: as thy days, so shall thy strength be
    kind: words
    title: As thy days, so shall thy strength be
    body: |
      The line is loved in its King James wording, but the word behind “strength” is uncertain. It is *dobe'*, found nowhere else in the Bible. The standard lexicon offers “perhaps rest, but sense very doubtful,” and notes that the ancient Greek, Syriac and Aramaic translations read “strength,” perhaps from a slightly different Hebrew word. The Greek has “as thy days, so shall be thy strength.” So the King James agrees with those ancient translations; whether the promise to Asher is of strength or of rest, it is measured by his days.
    sources: [oshb-wlc, bdb, lxx-rahlfs]

  - ref: 27
    phrase: underneath are the everlasting arms
    kind: symbol
    title: The eternal God is thy refuge
    body: |
      The closing hymn turns from the tribes to the God who holds them, above and beneath. “Refuge” renders *me'onah*, a dwelling, so that the line says “the ancient God is a dwelling-place (for his people),” and a modern translation notes the Hebrew as “The eternal God is a dwelling place.” The God who “rideth upon the heaven in thy help” (verse 26) is also beneath His people: “underneath are the everlasting arms.” With that strength He drives out the enemy, so that “Israel then shall dwell in safety alone” (verse 28).

      The poem ends on the same help: “O people saved by the LORD, the shield of thy help” (verse 29).
    sources: [oshb-wlc, bdb, nrsvue]

christ: |
  The LORD of the hymn that frames the blessings is Jehovah, and “Jehovah is the premortal Jesus Christ” (see the note at [[Ex. 3:14]]). He comes from Sinai to give the law (verse 2); the blessing of Joseph is the good will of Him “that dwelt in the bush” (verse 16), who called Moses; and the poem ends on a “people saved by the LORD” (verse 29). Abinadi testified that “God himself shall come down among the children of men, and shall redeem his people” ([[Mosiah 15:1]]).

  The everlasting arms of verse 27 are promised to disciples still. Lehi, blessing his sons before his death, testified, “I am encircled about eternally in the arms of his love” ([[2 Ne. 1:15]]), and the Lord told Oliver Cowdery, “Be faithful and diligent in keeping the commandments of God, and I will encircle thee in the arms of my love” ([[D&C 6:20]]).

explore: |
  - [[Gen. 49]]: Jacob's blessing of his sons, which Moses' blessing follows.
  - [[Hab. 3:3–6]]: the Holy One coming from Paran.

