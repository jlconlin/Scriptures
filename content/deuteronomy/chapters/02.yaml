chapter: 2
title: Ye Have Compassed This Mountain Long Enough
tagline: After thirty-eight years the march resumes; the LORD keeps Israel's hands off the lands He gave Esau and Lot, and gives them the kingdom of Sihon.
when: 'In the plains of Moab, in the fortieth year after the Exodus; Moses recalls the last stage of the journey'

setting: |
  Moses is still in his first address, spoken “in the fortieth year” and “in the land of Moab” ([[Deut. 1:3]]; [[Deut. 1:5]]). Chapter 1 ended at Kadesh-barnea, where the fathers refused to go up into the land (the spies are told at [[Deut. 1:22]]). Chapter 2 begins from the command that closed that story, “turn you, and take your journey into the wilderness by the way of the Red sea” ([[Deut. 1:40]]). It passes over thirty-eight years in fourteen verses, then slows down for the last stretch of the march: past Edom, Moab and Ammon, and into the kingdom of Sihon east of the Jordan.

  The same journey is told in Numbers ([[Num. 20:14–21]]; [[Num. 21:21–35]]), which is not yet on the site. Moses tells it again to the children of the generation that died, and on one Latter-day Saint reading he tells it with a purpose: the rest of this chapter and the next show the Lord able to keep His promise of the land to Abraham, Isaac and Jacob “despite all outwardly perceived evidence to the contrary.” The Church's heading sums it up: Israel passes “through the lands of Esau and of Ammon in peace but destroy[s] the Amorites.”

  Later scripture remembers Sihon's fall often: Rahab had heard of it in Jericho ([[Josh. 2:10]]), Jephthah argued from it ([[Judg. 11:19–22]]), and the psalms sing it ([[Ps. 135:11]]; [[Ps. 136:19]]).

thread: |
  Deuteronomy 2 is **a chapter of borders: lands the LORD will not give Israel, and a land He will.** Three times Moses hears the same command about Israel's kin, Edom, the children of Esau (verses 4–5), and Moab and Ammon, the children of Lot (verses 9, 19): do not meddle, do not contend, for “I will not give you of their land,” because “I have given” it to them. Parentheses explain how they came by their land. Those lands had been held by peoples “great, and many, and tall, as the Anakims,” and the Lord had removed them before Esau and Lot (verses 10–12, 20–23).

  Then the command turns around. “Rise ye up… behold, I have given into thine hand Sihon” (verse 24); “begin to possess” (verses 24, 31). The verb *give* that kept Israel off Seir and Ar now hands them Heshbon. Israel asks Sihon for what Edom and Moab had granted, a road and food and water for money (verses 27–29). He refuses and comes out to fight, and the whole country from the Arnon to Gilead falls (verses 32–36). Even then the chapter ends on a border kept: “only unto the land of the children of Ammon thou camest not” (verse 37).

  Between the two halves stands what made the march possible: thirty-eight years from Kadesh-barnea to the brook Zered, until the generation of fighting men was gone (verses 14–16). Their sons find no city “too strong for us” (verse 36), which one reading calls “an exact reversal of their fathers' powerlessness a generation earlier.” The same reading notes that the passage past Ammon (verses 17–23) comes before the war with Sihon, though Sihon's land lay south of Ammon's, and suggests the order keeps the peaceful passages past Israel's cousins together before the victories.

sections:
  - range: 1-7
    heading: Past the children of Esau
    plain: |
      Then we turned back into the wilderness by the way of the Red Sea, as the LORD had told me, and for many days we went around Mount Seir. Then the LORD said to me: You have gone around this mountain long enough; turn north. Tell the people: You are about to pass through the territory of your relatives, the descendants of Esau, who live in Seir. They will be afraid of you, so be very careful. Do not provoke them, for I will not give you any of their land, not even a foot's breadth; I have given Mount Seir to Esau as his possession. Buy your food from them with money, and buy your water from them with money too. The LORD your God has blessed all the work of your hands. He knows your journey through this great wilderness. These forty years the LORD your God has been with you, and you have lacked nothing.
  - range: 8-12
    heading: Past Moab
    plain: |
      So we went on past our relatives the descendants of Esau in Seir, along the road of the plain from Elath and Ezion-gaber, and turned to go by the road of the wilderness of Moab. The LORD said to me: Do not harass the Moabites or go to war with them, for I will not give you any of their land; I have given Ar to the descendants of Lot as their possession. (The Emims lived there in times past, a people great, numerous and tall like the Anakims. They too were counted giants, like the Anakims, but the Moabites call them Emims. The Horims also lived in Seir long ago, but the descendants of Esau destroyed them and lived in their place, as Israel did in the land of its possession that the LORD gave them.)
  - range: 13-16
    heading: The generation passes
    plain: |
      Now get up, I said, and cross the brook Zered. So we crossed the brook Zered. From the time we left Kadesh-barnea until we crossed the brook Zered was thirty-eight years, until the whole generation of fighting men had died out of the camp, as the LORD had sworn to them. The hand of the LORD was against them, to destroy them from the camp until they were gone. When all the fighting men had died from among the people,
  - range: 17-23
    heading: Past Ammon
    plain: |
      the LORD said to me: Today you are to pass through Ar, the border of Moab. When you come near the Ammonites, do not harass them or provoke them, for I will not give you any of the Ammonites' land as a possession; I have given it to the descendants of Lot. (That too was counted a land of giants. Giants lived there in the old days, and the Ammonites call them Zamzummims, a people great, numerous and tall like the Anakims. But the LORD destroyed them before the Ammonites, who took their place and lived there, as He had done for the descendants of Esau in Seir when He destroyed the Horims before them; they took their place and live there to this day. And the Avims, who lived in Hazerim as far as Azzah, were destroyed by the Caphtorims, who came out of Caphtor and lived in their place.)
  - range: 24-31
    heading: Sihon given into Israel's hand
    plain: |
      Get up, set out, and cross the river Arnon. See, I have given Sihon the Amorite, king of Heshbon, and his land into your hand. Begin to take possession, and go to war with him. Today I will begin to put the dread and fear of you on the nations under the whole heaven; when they hear the report of you they will tremble and be in anguish because of you. So I sent messengers from the wilderness of Kedemoth to Sihon king of Heshbon with words of peace: Let me pass through your land. I will keep to the highway and turn neither right nor left. Sell me food for money, that I may eat, and water for money, that I may drink; only let me pass through on foot, as the descendants of Esau in Seir and the Moabites in Ar did for me, until I cross the Jordan into the land the LORD our God is giving us. But Sihon king of Heshbon would not let us pass, for the LORD your God hardened his spirit and made his heart stubborn, to deliver him into your hand, as it is today. The LORD said to me: See, I have begun to give Sihon and his land over to you. Begin to take possession, so that you may inherit his land.
  - range: 32-37
    heading: The battle at Jahaz
    plain: |
      Then Sihon came out against us, he and all his people, to fight at Jahaz. The LORD our God delivered him to us, and we struck him down, with his sons and all his people. We took all his cities at that time and utterly destroyed the men, the women and the little ones of every city; we left none. Only the cattle we took as plunder for ourselves, with the spoil of the cities we took. From Aroer on the edge of the river Arnon, and the city by the river, as far as Gilead, not one city was too strong for us; the LORD our God gave us all of them. Only the land of the Ammonites you did not approach, nor any place along the river Jabbok, nor the cities in the hills, nor anywhere the LORD our God had forbidden us.

notes:
  - ref: 5
    phrase: because I have given mount Seir unto Esau for a possession
    kind: scripture
    title: Lands the LORD gave to Israel’s kin
    body: |
      The LORD keeps Israel off three lands in this chapter because He had already given them to others, and all three peoples were Israel's relatives. Esau, Jacob's brother, is Edom: “Thus dwelt Esau in mount Seir: Esau is Edom” ([[Gen. 36:8]]), a country that “lay south of the Dead Sea” and “was not included within the limits of the land of Israel.” Moab was the “son of Lot's eldest daughter,” and the Ammonites were “a tribe descended from Lot, the nephew of Abraham.” Moses calls the Edomites “your brethren” here (verse 4), and the law later gives the same kinship as the reason not to abhor an Edomite, “for he is thy brother” ([[Deut. 23:7]]). Joshua's farewell repeats the gift in the Lord's own voice: “I gave unto Esau mount Seir, to possess it” ([[Josh. 24:4]]).

      The point is more than kinship. On one Latter-day Saint reading, the conquest “was not indiscriminate”: the Lord protected these peoples “because these peoples also had received divine land grants,” and the chapter shows God “as the architect of every nation's history.” The same reading sets beside it Paul's words that God “hath determined the times before appointed, and the bounds of their habitation” ([[Acts 17:26]]).
    sources: [lds-scriptures, bd-edom, bd-moab, bd-ammon, ot-minute-deut-2]

  - ref: 10
    phrase: The Emims dwelt therein in times past, a people great, and many, and tall, as the Anakims
    kind: history
    title: Why Moses stops to talk about giants
    body: |
      The two parentheses about giants (verses 10–12 and 20–23) explain how Edom, Moab and Ammon came to hold their land: the Lord had cleared it for them. The text says so in so many words. Of the Ammonites' giants, “the LORD destroyed them before them; and they succeeded them, and dwelt in their stead” ([[Deut. 2:21]]), and He did the same “to the children of Esau” ([[Deut. 2:22]]). One older reading takes the notices as added “to confirm the fact that the Moabites and also the Edomites had received from God the land which they inhabited,” and had not destroyed its earlier people “by their own power.”

      The names are what the later owners called those peoples. The Emims, already named in Abraham’s day ([[Gen. 14:5]]), were “terrible men,” “a race of giants, living east of the Jordan in the time of Abraham,” afterward driven out by Moab; the Ammonites' name for theirs was Zamzummims; both were counted among the Rephaim, “a pre-Israelite people in Palestine, noted for their great stature.” The Horims, Seir's first inhabitants, “were probably dwellers in holes or caverns.” The comparison that recurs, “as the Anakims,” names the people the spies had reported at Kadesh: “we have seen the sons of the Anakims there” ([[Deut. 1:28]]).

      Verse 12 says the Horims were displaced “as Israel did unto the land of his possession,” which can sound as if it were written after the conquest of Canaan. The same older reading answers that “the land of his possession” here is the country east of the Jordan, taken under Moses and given to two and a half tribes, as at [[Deut. 3:20]].
    sources: [lds-scriptures, keil-deuteronomy, bd-emims, bd-rephaim, bd-edom]

  - ref: 14
    phrase: was thirty and eight years; until all the generation of the men of war were wasted out from among the host, as the LORD sware unto them
    kind: history
    title: Thirty-eight years for a generation
    body: |
      Verse 14 measures the wandering from Kadesh-barnea to the brook Zered: thirty-eight years, the time it took for the whole generation of fighting men to die, as the Lord had sworn. The oath is in Numbers. Those numbered “from twenty years old and upward” would fall in the wilderness, all but Caleb and Joshua, and their children would “wander in the wilderness forty years” ([[Num. 14:29–33]]). The refusal that brought it on is told at [[Deut. 1:22]].

      Moses insists that this was not simply time passing: “the hand of the LORD was against them, to destroy them from among the host, until they were consumed” (verse 15). On one Latter-day Saint reading the verse shows that the Lord's “commitment to justice is equally infinite and eternal” with His mercy, and that “those ‘men of this evil generation’ (Deuteronomy 1:35) would never enjoy the promised land.” Only when the last of them had died does the Lord speak to Moses with a new command (verses 16–17).
    sources: [lds-scriptures, ot-minute-deut-2]

  - ref: 24
    phrase: Sihon the Amorite, king of Heshbon
    kind: history
    title: Sihon, king of Heshbon
    body: |
      Sihon was an Amorite king who ruled from Heshbon, east of the Jordan, over country he had taken from Moab. He “had fought against the former king of Moab, and taken all his land out of his hand, even unto Arnon” ([[Num. 21:26]]). The Arnon, which Israel is now told to cross, “was the border of Moab” ([[Judg. 11:18]]), and Sihon's kingdom ran north from it to the Jabbok ([[Num. 21:24]]). The land Israel takes in this chapter had once been Moab's, but it was Sihon's when Israel came.

      Numbers tells the war in a few verses: Israel asked to pass, Sihon refused, fought at Jahaz, and lost ([[Num. 21:21–25]]). Moses' retelling “adds a number of details.” Numbers mentions a directive from God only before the battle with Og, while Deuteronomy “makes it clear that God directed Moses to take possession of the lands of both kings” (verses 24, 31). Deuteronomy also has Israel utterly destroy his cities (verse 34), a ḥērem that “the account in Numbers does not mention.” And it marks the battle as a beginning: “begin to possess it” (verse 24). The land taken went to Reuben and Gad ([[Deut. 3:12]]). On one reading, the God-led conquest of the land “began while the Israelites were still on the eastern side of the Jordan River, marked by this battle with Sihon.”

      How the psalms remember Sihon and Og is at [[Ps. 135:11]]. Og's war follows at [[Deut. 3:1]].
    sources: [lds-scriptures, bd-sihon, calabro-herem, ot-minute-deut-2]

  - ref: 25
    phrase: the dread of thee and the fear of thee upon the nations that are under the whole heaven
    kind: scripture
    title: The report that reached Jericho
    body: |
      The Lord promises that news of this victory would go ahead of Israel and unnerve the nations, and the book of Joshua shows that news in Jericho. Rahab tells the spies, “your terror is fallen upon us,” and names what her people had heard: the drying of the Red Sea, and “what ye did unto the two kings of the Amorites, that were on the other side Jordan, Sihon and Og, whom ye utterly destroyed” ([[Josh. 2:9–10]]). Her word for “utterly destroyed” is the same verb as in verse 34 of this chapter. “As soon as we had heard these things, our hearts did melt” ([[Josh. 2:11]]).

      What Rahab drew from the report went further than fear: “the LORD your God, he is God in heaven above, and in earth beneath” ([[Josh. 2:11]]), and she asked the spies to spare her father's house ([[Josh. 2:12]]).
    sources: [lds-scriptures, calabro-herem]

  - ref: 26
    phrase: with words of peace
    kind: history
    title: Peace offered to a king already given
    body: |
      Moses offers Sihon peaceful passage after the Lord has already said, “I have given into thine hand Sihon” (verse 24), and the chapter does not say why. In Numbers no word from God comes before the request ([[Num. 21:21–22]]); the first comes before the battle with Og ([[Num. 21:34]]). One older reading holds that the offer was meant in earnest (“the wish to pass through his land in a peaceable manner was quite seriously expressed”) and that it was made “to show the king of the Amorites, that it was through his own fault that his kingdom and lands and life were lost.” It adds that Sihon's kingdom “did not form part of the land of Canaan, which God had promised to the patriarchs.”

      The terms are the ones Moses says Edom and Moab had accepted: the highway, no turning aside, food and water paid for (verses 27–29).
    sources: [lds-scriptures, keil-deuteronomy, calabro-herem]

  - ref: 29
    phrase: As the children of Esau which dwell in Seir, and the Moabites which dwell in Ar, did unto me
    kind: history
    title: What Edom and Moab did
    body: |
      Moses tells Sihon that Edom and Moab had sold Israel food and water, while the other accounts of the journey say that both kings refused Israel passage. In Numbers, Edom answers, “Thou shalt not pass by me, lest I come out against thee with the sword,” comes out against Israel “with much people,” and Israel “turned away from him” ([[Num. 20:18–21]]). Jephthah, retelling the march, says that the king of Edom “would not hearken” and the king of Moab “would not consent,” so that Israel went around both lands ([[Judg. 11:17–18]]). Deuteronomy itself has the Lord tell Israel to buy food and water from the children of Esau (verse 6).

      The texts stand side by side without explaining each other. For Moab, one older reading observes that selling food for money is a different thing from the welcome Moab is later blamed for withholding, when “they met you not with bread and with water in the way” ([[Deut. 23:4]]): that verb “signifies a hospitable reception, and the offering of food and drink without reward, which is essentially different from selling for money.”
    sources: [lds-scriptures, keil-deuteronomy]

  - ref: 30
    phrase: for the LORD thy God hardened his spirit, and made his heart obstinate
    kind: scripture
    title: Who hardened Sihon
    body: |
      The Joseph Smith Translation makes Sihon the one who hardened his spirit. Its manuscript reads: “But sihon, King of heshbon, would not let us pass by him; for he heardened his spirit, & made his heart obstinate, that the Lord thy God might deliver him into thy hand, as he hath done this day.” The change is “reminiscent of several Exodus passages” (the note at [[Ex. 4:21]] takes up the hardening of Pharaoh). The revision keeps the Lord's purpose, to deliver Sihon into Israel's hand, and places the refusal with the king.
    sources: [jsp-ot2, horton-jst-pentateuch]

  - ref: 34
    phrase: utterly destroyed the men, and the women, and the little ones, of every city
    kind: history
    title: Sihon’s cities devoted to destruction
    body: |
      Verse 34 reports a ḥērem: “utterly destroyed” translates the Hebrew verb of that root, and the verse says what it covered. Israel struck Sihon and “all his people,” a phrase “probably meaning those he had brought with him to combat,” then took his cities and destroyed “the men, the women, and the children,” but kept the livestock and the spoil (verse 35). Numbers tells the same battle without the word; Deuteronomy's retelling adds it.

      What the ḥērem was, and how the Church reads the command to carry it out against the nations of Canaan, is explained at [[Deut. 7:2]]. The question it raises is sharpened by this very chapter: the same Lord has just protected the Edomites, Moabites and Ammonites, “as clearly demonstrated in this chapter,” and the Amorites are the people He condemns.
    sources: [calabro-herem, ot-minute-deut-2]

christ: |
  The LORD who speaks to Moses throughout this chapter is Jehovah, the premortal Christ (see [[Ex. 3:14]]). Here He is plainly the God of more than Israel. He gave Seir to Esau and Ar to the children of Lot, and cleared their lands before them as He would clear Israel's. Nephi, explaining the conquest to his brothers, says it of the same Lord: He “esteemeth all flesh in one; he that is righteous is favored of God,” and the peoples of the land were destroyed because they “had rejected every word of God, and they were ripe in iniquity” ([[1 Ne. 17:35]]).

  On one reading, verse 7 also foreshadows the Savior's own teaching. The Lord who “knoweth thy walking through this great wilderness,” so that for forty years Israel lacked nothing, later told His disciples in the Sermon on the Mount and the Nephites at Bountiful, “your heavenly Father knoweth that ye have need of all these things” ([[Matt. 6:32]]; [[3 Ne. 13:32]]).

explore: |
  - **The same march in Numbers.** [[Num. 20:14–21]] (Edom refuses) and [[Num. 21:10–35]] (the Arnon, Sihon and Og).
  - **Jephthah's history lesson.** [[Judg. 11:12–28]], where the war with Sihon becomes an argument with the Ammonites about the land.
  - **The news in Jericho.** [[Josh. 2:8–14]].
  - **The kin nations in the law.** [[Deut. 23:3–8]], where Ammon, Moab and Edom return in the law of the congregation.

parallels:
  - ref: Num. 21:21–25
    note: The war with Sihon told briefly, without the divine command or the utter destruction.
  - ref: Num. 20:14–21
    note: Edom refuses Israel passage; compare verses 4–8 and 29.
  - ref: Judg. 11:17–22
    note: Jephthah retells the march past Edom and Moab and the victory over Sihon.
  - ref: Josh. 2:9–11
    note: Rahab's report of the terror that Sihon's fall spread; compare verse 25.
  - ref: Ps. 135:11
    note: Sihon and Og sung among the kings the LORD smote before He gave Israel the land.

