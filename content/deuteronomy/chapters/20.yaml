chapter: 20
title: When Thou Goest Out to Battle
tagline: Moses gives Israel its law of war; the priest bids the army not to fear, the officers send home the man with a new house, a new vineyard or a bride, a far city is offered peace first, and the fruit trees around a besieged town are spared while nonfruit trees may be cut down.
when: 'In the plains of Moab, in the fortieth year after the Exodus'

setting: |
  Moses is still speaking in Moab ([[Deut. 1:3–5]]), in the code of laws of chapters 12–26, which sets out what the covenant asks of Israel as it is about to receive “the land of promise.” Chapter 19 dealt with killing within Israel; chapter 20 turns to war outside it, with laws for mustering an army, for besieging a city, and for what may be done to the land around it.

  Israel might meet an army larger than its own, with horses and chariots (verse 1). These were described as “the principal strength of the enemies round about Israel,” including the Egyptians, Canaanites, Philistines and Syrians. The chapter opens by facing that fear directly.

  Latter-day revelation takes up the same subject. The Lord told Joseph Smith in 1833, “this is the law that I gave unto mine ancients, that they should not go out unto battle against any nation, kindred, tongue, or people, save I, the Lord, commanded them” ([[D&C 98:33]]), and one study describes that revelation as a recapitulation of the law of warfare He had given to the ancient prophets (see the note at verse 10).

thread: |
  The promise that the LORD fights for Israel frames the limits that follow. The promise is the reason not to fear: “the LORD your God is he that goeth with you, to fight for you” (verse 4). The limits follow: men who may go home, peace offered before a siege, fruit trees spared. One older reading sums up the chapter as a duty “to spare as much as possible the lives of their own soldiers and also of their enemies.”

  It moves in five steps. Verses 1–4: before the battle the priest speaks to the troops, beginning “Hear, O Israel” (as at [[Deut. 6:4]]). Verses 5–9: the officers (on one older reading, men whose duties included raising and organizing the army) send four kinds of men home, and only then appoint captains. Verses 10–15: a city “very far off” is offered peace; if it refuses, its men are killed and the rest taken as spoil. Verses 16–18: the cities of the land itself are treated otherwise, and here the *ḥērem* is “described in the context of siege warfare” (the word is explained at [[Deut. 7:2]]). Verses 19–20: in a long siege, the fruit trees are not to be cut down.

sections:
  - range: 1-4
    heading: Do not be afraid
    plain: |
      When you go out to battle against your enemies and see horses and chariots and an army larger than yours, do not be afraid of them, for the LORD your God, who brought you up out of Egypt, is with you. When you come near the battle, the priest is to come forward and speak to the people. He is to say, “Hear, O Israel: today you are going into battle against your enemies. Do not lose heart, do not be afraid, do not panic or be terrified of them, for the LORD your God goes with you, to fight for you against your enemies and to save you.”
  - range: 5-9
    heading: Who goes home
    plain: |
      Then the officers are to say to the people: “Has anyone built a new house and not yet moved into it? Let him go home, so that he does not die in the battle and another man move in. Has anyone planted a vineyard and not yet eaten its fruit? Let him go home, so that he does not die in the battle and another man enjoy it. Has anyone betrothed a woman and not yet taken her as his wife? Let him go home, so that he does not die in the battle and another man marry her.” The officers are to add: “Is anyone afraid and fainthearted? Let him go home, so that his fellow soldiers do not lose heart as he has.” When the officers have finished speaking to the people, commanders are to be appointed to lead them.
  - range: 10-15
    heading: Peace offered to a far city
    plain: |
      When you march up to a city to attack it, first offer it terms of peace. If it accepts and opens its gates to you, all the people in it are to serve you. If it will not make peace but fights you, then besiege it. When the LORD your God gives it into your hand, kill all its men with the sword. You may take the women, the little children, the livestock and everything else in the city as spoil, for the LORD your God has given you your enemies' goods. Do this to all the cities that are far away from you, the cities that do not belong to the nations here.
  - range: 16-18
    heading: The cities of the land
    plain: |
      But in the cities of these peoples, which the LORD your God is giving you as an inheritance, do not leave alive anyone who breathes. Destroy the Hittites, Amorites, Canaanites, Perizzites, Hivites and Jebusites completely, as the LORD your God has commanded you, so that they do not teach you to do all the abominable things they do for their gods, and so lead you to sin against the LORD your God.
  - range: 19-20
    heading: Spare the fruit trees
    plain: |
      When you besiege a city for a long time, fighting to take it, do not destroy its trees by taking an axe to them. You may eat their fruit, so do not cut them down. Only the trees you know do not bear food may you cut down, to build siegeworks against the city that is fighting you, until it falls.

notes:
  - ref: 5
    phrase: hath built a new house, and hath not dedicated it
    kind: history
    title: Sent home before the battle
    body: |
      The first three men sent home have prepared for something they have not yet enjoyed: a house, a vineyard, or marriage. Each release gives the same reason, “lest he die in the battle, and another man” have what he had prepared. To “dedicate” a house here meant to move in, “by taking possession and dwelling in it,” perhaps with a meal for guests.

      The vineyard explains its own wording. The law of [[Lev. 19:23–25]] kept a new planting's fruit from use for three years and gave the fourth year's to the LORD, so that only “in the fifth year” could the owner use it for himself (see the note at [[Lev. 19:23]]); a man who “hath not yet eaten of it” might have waited years. The betrothed man's release is widened later in the code: a newly married man “shall not go out to war … but he shall be free at home one year” ([[Deut. 24:5]]).

      Why release these men in particular? The text gives only the loss to the man himself. One older reading says the purpose was not to remove unwilling soldiers or spare those most afraid of death, but “to avoid depriving any member of the covenant nation of his enjoyment of the good things of this life bestowed upon him by the Lord.”
    sources: [keil-deuteronomy, lds-scriptures]

  - ref: 8
    phrase: fearful and fainthearted
    kind: scripture
    title: The fainthearted, and the Ammonites’ exemption
    body: |
      The fourth release, for the man who is afraid, is the only one given for the army's sake: “lest his brethren's heart faint as well as his heart.” Scripture shows it applied when Gideon told the army, “Whosoever is fearful and afraid, let him return and depart early from mount Gilead” ([[Judg. 7:3]]), and twenty-two thousand went home.

      Read literally, the exemption could empty an army, and the Talmud read it narrowly: “since everyone going into battle was likely ‘fearful and fainthearted,’ the exemption undoubtedly had a narrower meaning in actual practice,” and the Talmud took the phrase to mean one “who is afraid because of the transgressions he had committed.” Later rabbis read the “enemies” of verse 1 as men of a different tribe or people.

      The Book of Mormon account of the people of Ammon has been compared with these exemptions. The converted Lamanites called the people of Ammon had buried their weapons and covenanted not to shed blood again ([[Alma 24:17–18]]), and the Nephites promised to “set our armies between the land Jershon and the land Nephi, that we may protect our brethren in the land Jershon; and this we do for our brethren, on account of their fear to take up arms against their brethren lest they should commit sin” ([[Alma 27:23]]). One proposal is that “in accordance with ancient interpretations of Deuteronomy 20,” the Nephites granted the people of Ammon a conditional exemption from military duty. This is a proposal, not something the Book of Mormon says.
    sources: [sc-knowhy-274, sc-knowhy-567, lds-scriptures]

  - ref: 10
    phrase: then proclaim peace unto it
    kind: scripture
    title: Peace offered first
    body: |
      Before a siege Israel had to offer the city terms. If it opened its gates, its people became forced laborers and served Israel (verse 11). The offer of peace did not mean compromise: “the enemy must yield to gain peace.”

      Latter-day revelation takes up the same subject. The Lord told Joseph Smith that if any people “should proclaim war against them, they should first lift a standard of peace unto that people” ([[D&C 98:34]]), and only after the offer had been refused “neither the second nor the third time” ([[D&C 98:35]]) and the matter brought to Him would He “justify them in going out to battle” ([[D&C 98:36]]). Latter-day scripture is also cited in support of the same position: [[Alma 43:46]]; [[Alma 48:14–16]]. The revelation calls this “the law that I gave unto mine ancients” ([[D&C 98:33]]), a recapitulation of the law of warfare given to the ancient prophets: He “justified His covenant people in going to battle only after they had brought the matter before Him.”
    sources: [ot-manual-deuteronomy-17-33, skinner-renounce-war, lds-scriptures]

  - ref: 16
    phrase: thou shalt save alive nothing that breatheth
    kind: history
    title: 'The cities of the land: a battle order'
    body: |
      Verses 16–18 set the cities of Canaan apart from the far cities of verses 10–15: there is no offer of peace and no taking of captives, and the text gives its reason, “that they teach you not to do after all their abominations” (verse 18). Why the command was given, and how the Church reads it today, is the subject of the notes at [[Deut. 7:2]]; this note adds only what chapter 20's setting shows.

      The law comes in the middle of laws about sieges (verses 12, 19), and one study reads the command within that frame. The phrase “nothing that breatheth” refers to people, not livestock; Joshua 11:14 names only the humans. On that reading the command is “a battle order, applicable only while the battle lasted.” Set against verse 14, where the women and children of far cities are taken alive, it is “perhaps equivalent to the modern English command ‘Take no prisoners.’” The same study cautions that the reasons scripture gives need not be “a complete picture of God's purposes.”
    sources: [calabro-herem, lds-scriptures]

  - ref: 19
    phrase: the tree of the field is man’s life
    kind: words
    title: Are the trees men?
    body: |
      The King James parenthesis, “for the tree of the field is man's life,” can be read as a question in Hebrew. The footnote's “HEB” reading and a modern translation take it so, and the verse asks, “Are trees in the field human beings that they should come under siege from you?” The King James instead takes the words as a statement that the tree is man's livelihood. Either way the point is the same: the trees meant are “the fruit-trees in the environs and gardens of the town,” as the reason in the verse itself shows, “thou mayest eat of them.”

      In one older reading its meaning is “thou mayest suppress and destroy the men, but not the trees.” The war is against the city that fights back (verse 20), not against its fruit trees; only trees that bear no food may be cut for siegeworks.
    sources: [nrsvue, keil-deuteronomy]

christ: |
  The center of the chapter is the priest's promise: “the LORD your God is he that goeth with you, to fight for you against your enemies, to save you” (verse 4). The LORD who fights for Israel is Jehovah, the premortal Christ (see the note at [[Ex. 3:14]]).

  The same Lord repeated the law of this chapter to His Saints in 1833, “this is the law that I gave unto mine ancients” ([[D&C 98:33]]), and the revelation's wording is close to verse 4's: once peace had been offered and refused, “I, the Lord, would fight their battles” ([[D&C 98:37]]). The two passages share the promise of the Lord fighting for His people; no source joins them further. Earlier in the same revelation He tells the Saints to “renounce war and proclaim peace” ([[D&C 98:16]]).

  In 1834 the Lord renewed the promise of verse 4 to Saints who had marched to Missouri to protect their brethren: “I do not require at their hands to fight the battles of Zion; for, as I said in a former commandment, even so will I fulfil—I will fight your battles” ([[D&C 105:14]]), the Church's footnote at verse 1. Paul names the battle every disciple is in, “not against flesh and blood, but … against spiritual wickedness in high places,” and arms the disciple for it with “the gospel of peace” and “the shield of faith” ([[Eph. 6:12–16]]).

explore: |
  - [[Judg. 7:1–8]]: Gideon sends home the fearful and keeps three hundred.
  - [[D&C 98:23–38]]: the Lord's law of war restated in 1833.
  - [[Alma 27:20–24]] and [[Alma 53:10–22]]: the people of Ammon's exemption, and their sons who fought in their place.
  - [[Deut. 7:1–6]]: the command on the nations of Canaan, with the notes at [[Deut. 7:2]].
  - [[Deut. 24:5]]: the newly married man free for a year.

