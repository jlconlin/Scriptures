chapter: 23
title: The Congregation of the LORD
tagline: Moses says who may enter the congregation of the LORD, keeps the war camp clean because the LORD walks in it, shelters the runaway slave, and sets rules for interest, vows and a hungry man in his neighbor's field.
when: 'In the plains of Moab, in the fortieth year after the Exodus'

setting: |
  Moses is still speaking in Moab, in the fortieth year after the Exodus ([[Deut. 1:3]]), in the code of laws that fills chapters 12–26 and “forms the nucleus of the whole book.” Chapter 22 closed with laws on marriage and chastity, and in one older reading Moses here moves from the holiness of the household to “the sanctification of their union as a congregation”: who may be received into it, how its camp is kept pure in war, whom it shelters and whom it will not tolerate, and some duties of its members to one another.

  Later scripture took up the chapter's first verses. After the exile, “they read in the book of Moses in the audience of the people; and therein was found written, that the Ammonite and the Moabite should not come into the congregation of God for ever” ([[Neh. 13:1]]). Isaiah promises the eunuch whom verse 1 shuts out “a place and a name better than of sons and of daughters” ([[Isa. 56:5]]). The book of Ruth tells of a Moabite woman who became David's great-grandmother ([[Ruth 4:17]]). And the last two verses are the law Jesus' disciples were using when they plucked grain on the Sabbath ([[Matt. 12:1]]).

thread: |
  The chapter is held together by the congregation and the LORD's presence in it. Verses 1–8 say who may “enter into the congregation of the LORD”: not the man mutilated in his sexual organs, not the *mamzer*, not the Ammonite or Moabite, but the Edomite and the Egyptian in the third generation. Verses 9–14 keep the war camp clean, and give the reason in so many words: “the LORD thy God walketh in the midst of thy camp … therefore shall thy camp be holy.” Verses 15–18 say whom Israel is to shelter (the slave who escapes to it) and what it is not to allow among its sons and daughters or bring into the LORD's house (the shrine prostitute and his wages).

  The last verses turn to duties between members of the covenant people. No interest is taken from a brother, though it may be from a foreigner; Exodus had already forbidden “usury” to the poor of God's people, and the note at [[Ex. 22:25]] explains the word and quotes verse 20. A vow is not required, “but if thou shalt forbear to vow, it shall be no sin in thee”; once made, it is to be paid without delay, and a vow could be either a dedication of something to the Lord or a promise to abstain. And a hungry man may eat from his neighbor's vineyard and grainfield, but not carry any away.

sections:
  - range: 1-8
    heading: Who may enter the congregation
    plain: |
      A man whose testicles are crushed or whose male organ is cut off may not enter the congregation of the LORD. A *mamzer* may not enter the congregation of the LORD; not even his descendants to the tenth generation may enter it. No Ammonite or Moabite may enter the congregation of the LORD; not even their descendants to the tenth generation may ever enter it. This is because they did not meet you with food and water on the way when you came out of Egypt, and because they hired Balaam the son of Beor, from Pethor in Mesopotamia, to curse you. But the LORD your God would not listen to Balaam; the LORD your God turned the curse into a blessing for you, because the LORD your God loved you. Never seek their peace or their prosperity, as long as you live. Do not abhor an Edomite, for he is your brother. Do not abhor an Egyptian, because you lived as a foreigner in his land. Their children in the third generation may enter the congregation of the LORD.
  - range: 9-14
    heading: A holy camp
    plain: |
      When your army goes out to camp against your enemies, keep yourself from every evil thing. If any man among you is unclean because of something that happened to him in the night, he must go outside the camp and not come back in. Toward evening he is to wash himself with water, and when the sun has set he may come back into the camp. You are to have a place outside the camp where you go to relieve yourself, and among your weapons a digging tool. When you relieve yourself outside, dig a hole with it and cover your excrement. For the LORD your God walks in the midst of your camp to deliver you and to give your enemies over to you. So your camp must be holy, so that He sees nothing indecent among you and turns away from you.
  - range: 15-18
    heading: Whom to shelter, and what not to allow
    plain: |
      Do not hand a slave who has escaped from his master to you back to his master. Let him live among you, in whichever of your towns he chooses, wherever he likes best. Do not oppress him. No daughter of Israel is to be a shrine prostitute, and no son of Israel a male shrine prostitute. Do not bring a prostitute's earnings, or the wages of a “dog,” into the house of the LORD your God to pay any vow, for both of these are an abomination to the LORD your God.
  - range: 19-25
    heading: Duties to a brother and a neighbor
    plain: |
      Do not charge your brother interest: interest on money, on food, or on anything that can be lent at interest. You may charge a foreigner interest, but not your brother, so that the LORD your God may bless you in everything you put your hand to in the land you are going in to possess. When you make a vow to the LORD your God, do not be slow to pay it, for the LORD your God will certainly require it of you, and it would be sin in you. But if you refrain from vowing, that is no sin. Keep and perform what has passed your lips, the freewill offering you vowed to the LORD your God, the promise you made with your own mouth. When you go into your neighbor's vineyard, you may eat all the grapes you want, but put none in a container. When you go into your neighbor's standing grain, you may pick the ears with your hand, but do not put a sickle to your neighbor's grain.

notes:
  - ref: 1
    phrase: shall not enter into the congregation of the LORD
    kind: history
    title: Kept out of the congregation
    body: |
      To “enter into the congregation of the LORD” was to be received as a member of Israel gathered as the LORD's people, and verse 1 bars a man who has been castrated or otherwise mutilated in his sexual organs. The Hebrew word, *qahal*, is the assembly of Israel, and “the congregation of the LORD” in these verses is the same body as Nehemiah's “congregation of God” ([[Neh. 13:1]]).

      One older reading takes the exclusion to be not merely from office or from marrying an Israelite woman, “but from admission into the covenant fellowship of Israel with the Lord,” because such mutilation marred “the nature of man as created by God.” Isaiah later speaks “unto the eunuchs that keep my sabbaths, and choose the things that please me, and take hold of my covenant,” and promises them “in mine house and within my walls a place and a name better than of sons and of daughters” ([[Isa. 56:4–5]]). Who Isaiah's eunuchs were, and how the returned exiles applied these verses, is at the note on [[Isa. 56:3]].
    sources: [bdb, keil-deuteronomy, lds-scriptures]

  - ref: 2
    phrase: A bastard
    kind: words
    title: Not simply a child born out of wedlock
    body: |
      The King James “bastard” translates *mamzer*, which names a child of incest, not every child born outside marriage (“bastard, specifically child of incest”). One older reading adds that it means not “illegitimate children generally” but, as the Talmud and the rabbis held, “those who were begotten in incest or adultery,” and that “the etymology of the word is obscure.”

      “Even to his tenth generation” means never. In that reading, “Ten is the number of complete exclusion,” which is why verse 3, using the same expression for the Ammonite and the Moabite, adds “for ever.”
    sources: [bdb, keil-deuteronomy]

  - ref: 3
    phrase: An Ammonite or Moabite
    kind: history
    title: Ammon, Moab, Balaam and Ruth
    body: |
      Moses gives his own reasons for barring the Ammonite and the Moabite: they did not meet Israel with bread and water, and they hired Balaam to curse it (verse 4). Numbers tells the second story. “Balak the son of Zippor was king of the Moabites at that time” ([[Num. 22:4]]), and he sent to Balaam, “Come now therefore, I pray thee, curse me this people” ([[Num. 22:6]]); in the end he complained, “thou hast altogether blessed them these three times” ([[Num. 24:10]]). Verse 5 gives the reason the curse failed: “because the LORD thy God loved thee.” How the first charge stands beside Moses' word that Moab sold Israel food is taken up at [[Deut. 2:29]].

      Scripture sets beside this law the story of Ruth, a Moabite woman. One Latter-day Saint study notes the “strained relationship between Israel and Moab” that the law highlights, and finds in Ruth “a social reality that is not envisioned in Deuteronomy”: her marriage to Boaz makes Israel and Moab joint ancestors of King David and of Jesus. The study also reports that later rabbis, aware of the tension, read the law's masculine language as applying only to Moabite men. Ruth's son Obed “is the father of Jesse, the father of David” ([[Ruth 4:17]]), and Matthew names “Obed of Ruth” in the line of Jesus ([[Matt. 1:5]]).
    sources: [lds-scriptures, strathearn-ruth]

  - ref: 7
    phrase: for he is thy brother
    kind: history
    title: Edom the brother, Egypt the host
    body: |
      Edom and Egypt are treated more gently than Ammon and Moab for the two reasons verse 7 gives: Edom is a brother, and Israel had lived in Egypt as a stranger. Edom is Esau, Jacob's brother, who asked for the red pottage: “therefore was his name called Edom” ([[Gen. 25:30]]). In Exodus the same reminder of Israel's time in Egypt ([[Ex. 23:9]]) was meant to teach Israel “their obligation to care for their society's weakest members and to do so with sympathy.”

      Both nations had been hostile: Edom threatened Israel with the sword when it asked to pass through ([[Num. 20:18]]), and the Pharaohs had enslaved it. In one older reading, Israel was nevertheless “to keep the bond of kindred sacred” with Edom, and not to forget in the case of the Egyptians “the benefits derived from their sojourn in their land.” The same reading takes “their third generation” (verse 8) to be the great-grandchildren of Edomites or Egyptians who had lived among Israel.
    sources: [lds-scriptures, bowen-law-codes, keil-deuteronomy]

  - ref: 14
    phrase: the LORD thy God walketh in the midst of thy camp
    kind: symbol
    title: Why a war camp must be clean
    body: |
      Verse 14 explains the rules for washing and for latrines in verses 10–13: the LORD walks in the camp, so the camp must be holy. The image is the covenant promise of Leviticus, “I will walk among you, and will be your God, and ye shall be my people” ([[Lev. 26:12]]), and here the LORD walks among the army “to deliver thee, and to give up thine enemies before thee.” If He sees something unclean, He may “turn away from thee.”

      In one older reading, the “wicked thing” of verse 9 is explained by the verses that follow: “uncleanness, and uncleanliness of the body.” That reading also says what the offense was: “There was nothing shameful in the excrement itself; but the want of reverence, which the people would display through not removing it, would offend the Lord and drive Him out of the camp of Israel.”
    sources: [lds-scriptures, keil-deuteronomy]

  - ref: 15
    phrase: Thou shalt not deliver unto his master the servant which is escaped from his master unto thee
    kind: history
    title: Refuge for a runaway slave
    body: |
      Verses 15–16 forbid Israel to return a slave who has fled to it, and give him the choice of where to live: “in that place which he shall choose in one of thy gates, where it liketh him best: thou shalt not oppress him.” The verses do not say where the slave has come from. One older reading takes them to mean a slave “who had fled to them from a foreign country, on account of the harsh treatment which he had received from his heathen master.”
    sources: [keil-deuteronomy]

  - ref: 18
    phrase: the price of a dog
    kind: words
    title: The hire of a whore and the price of a dog
    body: |
      “The price of a dog” is not money from selling an animal but the earnings of a male shrine prostitute, whom the Hebrew called a “dog.” The Hebrew *keleb*, “dog,” “was name given to male temple-prostitutes” in this verse. He is the “sodomite” of verse 17, Hebrew *qadesh*, defined there as a “temple-prostitute (man)”; the woman of the same verse, the *qedeshah*, is explained at [[Gen. 38:21]].

      The law is about what may pay a vow in the LORD's house. Nothing “intrinsically unholy” could be offered as a vow, and verse 18 is one of the passages behind that rule.
    sources: [bdb, bd-vows]

  - ref: 25
    phrase: thou mayest pluck the ears with thine hand
    kind: scripture
    title: The disciples in the grainfield
    body: |
      Verses 24–25 let a hungry man eat from his neighbor's vineyard or field, but not carry anything away. They were “safeguards against hunger and as a protection of the poor,” and the same law is what “Jesus's disciples made use of” when they ate grain in the fields.

      So when the disciples “began to pluck the ears of corn, and to eat” ([[Matt. 12:1]]), they were doing what this law allowed. The Pharisees' objection was the day, not the field: “thy disciples do that which is not lawful to do upon the sabbath day” ([[Matt. 12:2]]). Jesus answered by saying who He was: “the Son of man is Lord even of the sabbath day” ([[Matt. 12:8]]).
    sources: [bowen-law-codes, lds-scriptures]

christ: |
  The LORD who walks in the midst of Israel's camp “to deliver thee” (verse 14) is Jehovah, the premortal Christ (see the note at [[Ex. 3:14]]). The chapter's hardest lines are not His last word on the people it excludes. To the eunuch who keeps His covenant He promises “an everlasting name, that shall not be cut off” ([[Isa. 56:5]]), and Philip preached Jesus to “an eunuch of great authority” from Ethiopia and baptized him ([[Acts 8:27–38]]; see the note at [[Isa. 56:5]]). The Moabite Ruth became an ancestor of King David and of Jesus. And in the grainfield of verse 25 the Lord who gave the law named Himself “Lord even of the sabbath day” ([[Matt. 12:8]]).

explore: |
  - [[Isa. 56:1–8]]: the eunuch and the foreigner who take hold of the covenant.
  - [[Ruth 1–4]]: a Moabite woman in the house of Israel.
  - [[Neh. 13:1–3]]: verses 3–5 read aloud after the exile.
  - [[Num. 22–24]]: Balak, Balaam, and the curse turned to blessing.
  - [[Matt. 12:1–8]]: the disciples in the grainfield.

sources: [lds-scriptures, bd-deuteronomy, keil-deuteronomy, bdb, strathearn-ruth, bowen-law-codes, bd-vows]
