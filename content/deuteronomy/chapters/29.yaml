chapter: 29
title: Ye Stand This Day All of You before the LORD
tagline: Israel's children enter the covenant their parents made at Horeb, and Moses warns the one who thinks himself safe and the nation that might forsake it.
when: 'In the land of Moab, in the fortieth year after the Exodus'

setting: |
  Moses is still speaking in the land of Moab in the fortieth year after the Exodus ([[Deut. 1:3–5]]). Verse 1 closes his long second address; with verse 2 he calls all Israel together for a third, which runs to the end of chapter 30. The generation that stood at Sinai had largely passed away, and most of those about to cross the Jordan had been children, or not yet born, when the covenant was made there (see the setting of [[Deut. 1]]). Now Moses brings their children into it.

  The book can be read as following the pattern of an ancient covenant or treaty, and chapters 29–30 bring the people to the point of binding themselves. The two chapters repeat that pattern in small: a history of what the LORD has done (29:2–9), the covenant bond (29:10–15), the curses for breaking it (29:16–29), the blessings of return (30:1–10), and a last call to choose (30:11–20).


thread: |
  Moses recalls the covenant's past, describes its present renewal, and warns of its future before Israel is called to choose in chapter 30. The wonders in Egypt, the forty years, and the victories over Sihon and Og give Israel reason to trust the LORD's favor and keep the covenant (verse 9). Yet they have seen all this, Moses says, without being given “an heart to perceive” it (verse 4).

  The present is a ceremony from which no one is left out: leaders, men, wives, children, strangers, the hewer of wood and the drawer of water, and even those “not here with us this day” (verses 10–15). At its center is the promise sworn to Abraham, Isaac and Jacob, that the LORD will make Israel “a people unto himself” and be “unto thee a God” (verse 13).

  The future brings two warnings, one about an individual and one about the nation. One person who hears the covenant oath and tells himself he is safe is compared to a poisonous root (verses 18–21); a nation that forsakes the covenant will become a ruin that strangers ask about (verses 22–28). Moses does not leave Israel there: the cursings come “at the end of chapter 29, but the promise of the ability to return fills chapter 30.” Between the two stands verse 29: what is hidden belongs to the LORD, and what He has revealed belongs to Israel, to do.

sections:
  - range: 1-1
    heading: The words of the covenant
    plain: |
      These are the terms of the covenant the LORD commanded Moses to make with the Israelites in the land of Moab, in addition to the covenant He had made with them at Horeb.
  - range: 2-9
    heading: What your eyes have seen
    plain: |
      Moses called all Israel together and said: You have seen everything the LORD did before your eyes in Egypt to Pharaoh, to all his servants and to his whole land: the great temptations you saw with your own eyes, the signs and the great wonders. But to this day the LORD has not given you a heart to understand, eyes to see or ears to hear. I led you forty years in the wilderness; your clothes did not wear out on you, nor the sandals on your feet. You ate no bread and drank no wine or strong drink, so that you would know that I am the LORD your God. When you came to this place, Sihon king of Heshbon and Og king of Bashan came out to fight us, and we defeated them, took their land, and gave it as an inheritance to the Reubenites, the Gadites and the half tribe of Manasseh. So keep the terms of this covenant and do them, so that you may prosper in everything you do.
  - range: 10-15
    heading: All of you, this day
    plain: |
      All of you are standing today before the LORD your God: the captains of your tribes, your elders and your officers, all the men of Israel, your little children, your wives, and the foreigner living in your camp, from the one who cuts your wood to the one who draws your water. You stand here to enter into the covenant of the LORD your God and into the oath He is making with you today, so that He may establish you today as His own people and be your God, as He promised you and swore to your fathers Abraham, Isaac and Jacob. I am not making this covenant and oath with you alone, but with those standing here with us today before the LORD our God, and also with those who are not here with us today.
  - range: 16-21
    heading: A root of gall and wormwood
    plain: |
      You know how we lived in Egypt and how we passed through the nations on the way, and you saw their detestable things, their idols of wood and stone, silver and gold. So let there be no man or woman, family or tribe among you whose heart turns away today from the LORD our God to go and serve the gods of those nations, no root among you that bears poisonous and bitter fruit. When such a person hears the words of this sworn curse, he congratulates himself and thinks, “I will be safe, even though I go my own stubborn way.” The LORD will not forgive him. The LORD's anger and jealousy will smoke against that man, every curse written in this book will settle on him, and the LORD will blot out his name from under heaven. The LORD will single him out from all the tribes of Israel for disaster, according to all the curses of the covenant written in this book of the law.
  - range: 22-29
    heading: Why has the LORD done this?
    plain: |
      Then the next generation, your children who come after you, and the foreigner who comes from a distant land, will see the plagues of that land and the diseases the LORD would send on it: the whole land burned out with sulfur and salt, nothing sown, nothing growing, not even grass, like the overthrow of Sodom and Gomorrah, Admah and Zeboim, which the LORD overthrew in His anger and wrath. All the nations will ask, “Why has the LORD done this to this land? Why this great, burning anger?” And people will answer, “Because they abandoned the covenant of the LORD, the God of their fathers, which He made with them when He brought them out of Egypt. They went and served other gods and worshipped them, gods they had not known and that He had not given them. So the LORD's anger burned against this land, and He brought on it every curse written in this book. In anger, wrath and great indignation the LORD uprooted them from their land and threw them into another land.” The hidden things belong to the LORD our God, but those things that are revealed belong to us and to our children forever, so that we may do all the words of this law.

notes:
  - ref: 1
    phrase: beside the covenant which he made with them in Horeb
    kind: history
    title: The covenant of Moab and the covenant of Horeb
    body: |
      The covenant made in Moab, “beside” (in addition to) the one at Horeb, renews the Horeb or Sinai covenant for a new generation (on Horeb, see [[Ex. 3:1]]): before Israel entered the land, the children of those who stood at Sinai renewed what their parents had covenanted there, with the blessings and cursings set out in chapter 28.

      The verse can also be read as a close rather than an opening. The Hebrew Bible numbers it 28:69, the last verse of chapter 28, where “these are the words of the covenant” sums up the laws, blessings and curses just given.
    sources: [scripture-helps-deut, oshb-wlc, ot-minute-deut-rappleye, seely-self-reference]

  - ref: 4
    phrase: Yet the LORD hath not given you an heart to perceive
    kind: scripture
    title: Seeing without a heart to perceive
    body: |
      Moses tells a people who have seen every wonder that they have not yet understood what they saw, and he puts it as something the LORD has not given. “Heart” here is the understanding. One reading takes Moses' words as a rebuke that explains why he keeps recalling the LORD's deeds: Israel had not asked for understanding because it did not feel the need. Another sees the verse as holding together God's gift of understanding and human responsibility.

      Paul uses Moses' words about Israel's lack of understanding, joined to [[Isa. 29:10]], to describe the Israel of his own day: “God hath given them the spirit of slumber, eyes that they should not see, and ears that they should not hear … unto this day” ([[Rom. 11:8]]). He reads Moses' words, “unto this day” included, as a pattern repeated in Israel's unbelief in the days of the Messiah.
    sources: [keil-deuteronomy, cambridge-deuteronomy, cambridge-romans]

  - ref: 5
    phrase: And I have led you forty years in the wilderness
    kind: history
    title: Who is speaking?
    body: |
      Moses is speaking, but the “I” who led Israel forty years is the LORD: in the next breath the same voice says “that ye might know that I am the LORD your God” (verse 6), so that for two verses Moses speaks the LORD's words as his own. The Greek translation reads “And he led you forty years in the wilderness,” with Moses speaking of the LORD.

      The clothes that did not wear out are named also in [[Deut. 8:4]], beside the manna's lesson in [[Deut. 8:3]].
    sources: [lxx-rahlfs, lds-scriptures]

  - ref: 15
    phrase: also with him that is not here with us this day
    kind: history
    title: Everyone, and those not yet born
    body: |
      The covenant of Moab binds every member of Israel, those absent and those not yet born. The list in verses 10–11 runs from the heads of the tribes to the children, the wives and the stranger in the camp, “from the hewer of thy wood unto the drawer of thy water,” words later used of the Gibeonites' lot: “let them be hewers of wood and drawers of water unto all the congregation” ([[Josh. 9:21]]).

      Verses 14–15 then reach past the assembly. By including those “not here with us this day,” the covenant “goes beyond all those who were present at the covenant ceremony,” so that “future Israelites were also bonded to the Lord through this covenant.” The covenant reaches back as well, to the oath sworn to Abraham, Isaac and Jacob (verse 13).
    sources: [ot-minute-deut-rappleye, lds-scriptures]

  - ref: 18
    phrase: a root that beareth gall and wormwood
    kind: symbol
    title: A root of gall and wormwood
    body: |
      The bitter root is the man or woman, family or tribe, whose heart turns from the LORD to other gods. Moses sets this private apostasy beside the ruin of the whole nation (verses 22–28), and the implication is that “private apostasy cannot be hidden from Yahweh; it will eventually have public ramifications.”
    sources: [ot-minute-deut-rappleye, lds-scriptures]

  - ref: 19
    phrase: that he bless himself in his heart
    kind: words
    title: The man who blesses himself
    body: |
      The man of verse 19 hears the covenant's curse and tells himself it will not touch him.

      What he trusts is “the imagination of mine heart.” One proposed reading takes it as “a kind of idolatrous self-reliance rendered ‘imagination’ in our King James Bibles and in other translations as ‘stubbornness,’” and finds in passages like this one “the interesting intertwining of attraction to foreign idols and a false sense of security.”

      For “to add drunkenness to thirst,” a modern translation has “thus sweeping away the moist with the dry.” Verses 20–21 give the LORD's answer: the curses he thought would pass him by fall on him.
    sources: [sc-knowhy-546, nrsvue]

  - ref: 24
    phrase: Wherefore hath the LORD done thus unto this land?
    kind: history
    title: Why the land lies waste
    body: |
      Moses turns from the one man to the whole nation, and imagines strangers staring at a ruined land and asking why. The land would lie like the cities of the plain; on Admah and Zeboim, see the note at [[Hosea 11:8]], where the Lord asks how He can make Ephraim like them. The answer comes in verse 25: “Because they have forsaken the covenant.”

      The question “Why would the Lord destroy his own people?” sits beside Moses' earlier promise in [[Deut. 4:28–31]]: “Because the Lord is a merciful God, he will not utterly forget the covenant.” Deuteronomy itself does the same: the curses end chapter 29, but the promise of return fills [[Deut. 30:1–10]].
    sources: [ot-minute-deut-rappleye, dundas-ancient-israel, muhlestein-everlasting-covenant, lds-scriptures]

  - ref: 29
    phrase: The secret things belong unto the LORD our God
    kind: words
    title: The secret things and the revealed
    body: |
      Verse 29 ends the chapter's warnings by setting what belongs to the LORD beside what belongs to Israel to do. The “revealed” things are the law with its promises and warnings, given to Israel “and to our children for ever” to be done. What the “secret things” are is not stated. One reading takes the “secret things” to mean how God will carry out his purposes; another takes them to mean the future. On the second reading, the exile just foretold may be among the revealed things, and what remains hidden is how it will end, which [[Deut. 30:1–10]] answers with a conditional promise. Israel can only keep the law already revealed.
    sources: [keil-deuteronomy, cambridge-deuteronomy]

christ: |
  The LORD who makes this covenant is Jehovah, the premortal Christ (see the note at [[Ex. 3:14]]), and its center is His promise: “that he may establish thee to day for a people unto himself, and that he may be unto thee a God” (verse 13). These words recall the promises made to Abraham and his descendants. They return when the LORD promises a new covenant through Jeremiah: “I will put my law in their inward parts, and write it in their hearts; and will be their God, and they shall be my people” ([[Jer. 31:33]]). There what makes someone truly part of the covenant is “whether or not the commandments (our obligation under the covenant) were part of his or her heart.”

  In latter-day revelation the Lord speaks the same words to the Church, “that ye may be my people and I will be your God” ([[D&C 42:9]]): “what God was reestablishing was Israel, this time in the latter days.”

explore: |
  - [[Deut. 30:1–10]]: the return promised after the curses of this chapter.
  - [[Josh. 24:14–27]]: Joshua's covenant with the people at Shechem.
  - [[Neh. 10:28–29]]: the returned exiles enter “into a curse, and into an oath, to walk in God's law.”
  - [[Rom. 11:7–8]] and [[Heb. 12:14–17]]: verses 4 and 18 in the New Testament.
  - [“Recognizing the Everlasting Covenant in the Scriptures”](https://rsc.byu.edu/vol-21-no-2-2020/recognizing-everlasting-covenant-scriptures), a Religious Studies Center study of the covenant's language through the scriptures.

