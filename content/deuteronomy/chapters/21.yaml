chapter: 21
title: Blood in the Field, and a Body on the Tree
tagline: A town atones for a murder no one can solve, a captive wife may not be sold, the firstborn of a less-loved wife is given his double portion, a rebellious son goes before the elders, and the body of a man hanged on a tree must be buried before night.
when: 'In the plains of Moab, in the fortieth year after the Exodus'

setting: |
  Moses is still speaking in the plains of Moab, in the fortieth year after the Exodus ([[Deut. 1:3–5]]), in the code of laws that fills chapters 12–26 and “forms the nucleus of the whole book.” After the laws of worship and of justice, the last group “regulates private and social rights,” and this chapter belongs to it. It follows the laws of war in chapter 20.

  The chapter holds five laws: an unsolved murder, a captive woman, the inheritance of two wives' sons, a rebellious son, and the body of an executed man. In one older reading they stand together “to bring out distinctly the sacredness of life and of personal rights from every point of view.”

  The last law has the longest reach. Paul quotes it of the cross: “Cursed is every one that hangeth on a tree” ([[Gal. 3:13]]), and the note at verse 23 follows it there.

thread: |
  The chapter opens and closes with **the land the LORD gives** and what defiles it. It begins with a body lying “in the land which the LORD thy God giveth thee” (verse 1) and ends with a body on a tree, buried “that thy land be not defiled, which the LORD thy God giveth thee for an inheritance” (verse 23). Behind the first law stands the rule that “blood it defileth the land” ([[Num. 35:33]]); in one older reading Israel was by this rite “to wipe away the innocent blood … from its midst,” and the land could be defiled “not only by vices and crimes … but also by the exposure to view of criminals who had been punished with death.”

  Between them are three laws about a household. In the same older reading each guards someone against the power of the man of the house: the captive woman against “the caprice of her Israelitish master” (verses 10–14), the firstborn against “the abuse of paternal authority in favour of a favourite wife” (verses 15–17), and even the rebellious son, since that law aims at “the limitation, of parental authority” (verses 18–21). The captive may not be sold; the firstborn may not be passed over; the son's case goes before the elders. The refrain of the code returns at verse 9, “so shalt thou put away the guilt of innocent blood from among you,” and at verse 21, “so shalt thou put evil away from among you” (explained at [[Deut. 13:5]]).

sections:
  - range: 1-9
    heading: The murder no one can solve
    plain: |
      If someone is found murdered, lying in the open country in the land the LORD your God is giving you, and no one knows who killed him, your elders and judges are to go out and measure the distance to the towns around the body. The elders of the town nearest the body are to take a young cow that has never been worked or worn a yoke, lead her down to a rough valley that is never plowed or sown, and break her neck there in the valley. The priests, the sons of Levi, are to come forward, for the LORD your God has chosen them to serve Him and to bless in His name, and every dispute and every case of assault is to be settled by their word. Then all the elders of the town nearest the body are to wash their hands over the young cow whose neck was broken in the valley, and declare: “Our hands did not shed this blood, and our eyes did not see it done. Be merciful to Your people Israel, LORD, whom You redeemed, and do not hold the guilt of innocent blood against Your people Israel.” And the bloodshed will be forgiven them. So you will remove the guilt of innocent blood from among you, when you do what is right in the LORD's sight.
  - range: 10-14
    heading: The woman taken in war
    plain: |
      When you go to war against your enemies and the LORD your God gives them into your hands and you take captives, and you see among them a beautiful woman and want her for your wife, bring her into your house. She is to shave her head, trim her nails, and take off the clothes she was captured in, and live in your house and mourn her father and mother for a full month. After that you may go to her and be her husband, and she will be your wife. If you are not pleased with her, you must let her go wherever she wishes. You must not sell her for money or treat her as a slave, since you have humbled her.
  - range: 15-17
    heading: The firstborn of the wife he loves less
    plain: |
      If a man has two wives, one loved and the other loved less, and both have borne him sons, and the firstborn is the son of the one he loves less, then when he divides his property among his sons he may not give the firstborn's place to the son of the wife he loves instead of the true firstborn, the son of the other. He must acknowledge the son of the less-loved wife as firstborn by giving him a double share of all he has. That son is the beginning of his father's strength; the firstborn's right is his.
  - range: 18-21
    heading: The rebellious son
    plain: |
      If a man has a stubborn and rebellious son who will not obey his father or his mother, and will not listen to them when they discipline him, his father and mother are to take hold of him and bring him to the elders of his town at its gate. They are to say to the elders, “This son of ours is stubborn and rebellious. He will not obey us. He is a glutton and a drunkard.” Then all the men of his town are to stone him to death. So you will remove the evil from among you, and all Israel will hear and be afraid.
  - range: 22-23
    heading: The body on the tree
    plain: |
      If a man guilty of a capital crime is put to death and you hang his body on a tree, you must not leave the body on the tree overnight. Be sure to bury him that same day, for anyone who is hanged is accursed of God. You must not defile the land the LORD your God is giving you as an inheritance.

notes:
  - ref: 4
    phrase: unto a rough valley, which is neither eared nor sown
    kind: history
    title: A heifer, a running stream, and a broken neck
    body: |
      When the murderer cannot be found, the town nearest the body carries responsibility for the blood. In one older reading that town carried the guilt of the innocent blood “as a burden upon it before all others,” and the heifer died in the murderer's place: “an animal was to be put to death in his stead, and suffer the punishment of the murderer.” On that reading it was not a sacrifice. There is no altar and no blood is sprinkled; the neck is broken, as was done to a firstling ass that was not redeemed ([[Ex. 13:13]]). A heifer that had never worked or worn a yoke was “in the full and undiminished possession of its vital powers,” able “to take the guilt upon itself and bear it.”

      The King James reads “strike off the heifer's neck” (verse 4) and “the heifer that is beheaded” (verse 6); the paraphrase says the neck is broken, which is the alternative the Church's footnote gives for “strike” and the mode of death Exodus 13:13 names. The King James “rough valley” also hides a detail. The Hebrew *naḥal ʾeitan* is “an ever-flowing wady,” a valley whose stream does not run dry. The same older reading supposes that “the water of the brook-valley would suck in the blood and clean it away,” and that untilled ground would never turn it up again under the plow. That reading is the commentator's; the text itself gives only the reason in verse 9, to “put away the guilt of innocent blood.” Nor did the rite excuse the killer: if he was found later, the death the heifer had borne “would still fall upon him.”
    sources: [keil-deuteronomy, bdb, lds-scriptures]

  - ref: 8
    phrase: Be merciful, O LORD, unto thy people Israel
    kind: words
    title: 'Be merciful: a prayer that God cover the blood'
    body: |
      The elders' words end in a prayer, and its verb is the verb of atonement, *kipper*: the LORD is asked to “cover” His people, to “treat as covered, view propitiously.” The lexicon's image is of “bloodguiltiness” that “flows away in the stream,” and the Hebrew reads the last clause “and the blood shall be covered for them.” The elders wash their hands and declare that they neither shed the blood nor saw it shed (the gesture is explained at [[Ps. 26:6]]), and then they ask the LORD to be the one who covers it.
    sources: [bdb, lds-scriptures]

  - ref: 10
    phrase: and thou hast taken them captive
    kind: history
    title: The captive woman
    body: |
      The law assumes that an Israelite soldier may take a woman captured in war as his wife, and it sets limits on what he may do with her. The law begins from the soldier's desire (verse 11). What it gives her is a month in his house before the marriage, with her head shaved, her nails trimmed and her captive's clothing put off, to mourn her father and mother. If he later has “no delight in her,” he must let her go “whither she will.” He may not sell her or treat her as a slave, “because thou hast humbled her”: the verb, in the lexicon's gloss, is used of humbling a woman “by cohabitation.”

      Such a woman “could be married, but could not be treated as a slave or as a captive,” and the law is set among the dealings with “other foreign countries,” apart from the Canaanites. Nothing in the law required that she be the man's only wife; the marriage could be a plural one “if the man were already married.” For what the law provided for women more broadly, see [Women and marriage in the Old Testament](/old-testament/guides/women-and-marriage/#the-law).
    sources: [ot-manual-deuteronomy-17-33, bdb, sears-shannon-polygamy]

  - ref: 15
    phrase: one beloved, and another hated
    kind: history
    title: The firstborn of the less-loved wife
    body: |
      This law keeps a father from moving the firstborn's double share to the son of the wife he prefers. “Hated” means loved less, as Leah was beside Rachel ([[Gen. 29:30–31]]; the note at [[Gen. 29:31]] explains the word). The law “protects the inheritance of the children born to a plural wife in the circumstance that the husband does not like her as much as his other wife.” What the son is owed, “a double portion of all that he hath,” is explained in the note at [[Gen. 48:5]], and “the beginning of his strength” is the phrase Jacob uses of Reuben ([[Gen. 49:3]]).

      Scripture also records “many instances in which that blessing and inheritance were granted to a younger son,” beginning with Abel. In the Book of Mormon, Jacob's sermon against unauthorized plural marriage ([[Jacob 2:24–30]]) may “build upon or clarify” this provision. On plural marriage in the Old Testament, see [Women and marriage in the Old Testament](/old-testament/guides/women-and-marriage/#the-law).
    sources: [sears-shannon-polygamy, sc-knowhy-462, sc-knowhy-64, lds-scriptures]

  - ref: 18
    phrase: a stubborn and rebellious son
    kind: history
    title: Why the rebellious son was brought to the elders
    body: |
      The law takes a father's power over a son's life out of his hands and puts the case before the town's elders. According to one study, in many ancient societies a father's power was “virtually absolute,” and by Lehi's day the procedures Deuteronomy spells out “had come to restrict this paternal power somewhat”: the son must first be chastened, both father and mother must bring him, and the elders hear the charge at the gate. The penalty is still death, and the text gives its reason: “so shalt thou put evil away from among you; and all Israel shall hear, and fear” (verse 21).

      The Church's older manual reads the son as no child. The law speaks “not … of just disobedient children but of incorrigible children, those to whom no counsel or guidance was meaningful,” and these were almost certainly grown sons: “The charge of drunkard is evidence for this view.” The parents bring the charge but are “not required to execute him, as were the witnesses in other capital crimes.” The reason for so heavy a penalty is the family's place in Israel: as “the most important means of transmitting righteousness from generation to generation,” a son who “utterly rejected parental authority threatened the very order of society.”

      A Latter-day Saint study reads Laman and Lemuel as punishable under this law. Having once sought their father's life ([[1 Ne. 17:44]]), they “were legally punishable by death under the law of Moses as ‘rebellious sons’”; in that reading, “Lehi's love, patience and long-suffering toward his recalcitrant sons spared their lives.”
    sources: [welch-lehi-will, ot-manual-deuteronomy-17-33]

  - ref: 22
    phrase: and thou hang him on a tree
    kind: history
    title: Hanged after death, buried before night
    body: |
      The verse can be read as hanging a man after he has been put to death, and the paraphrase follows that sense. In one older reading it was the display of “those who had been executed with the sword,” and so “an intensification of the punishment of death.” The law limits the display to one day: the body is to be buried before night. The king of Ai was hanged “until eventide,” and “as soon as the sun was down” taken down ([[Josh. 8:29]]); the same older reading takes this as the law applied.

      The reason the text gives is the land. On one reading, “the Old Testament goes beyond seeing the public shame of a hanging: a ritual impurity accompanied it,” and a body left on the tree overnight “was said to ritually defile the land.” The older reading adds that the defilement was not one of decay (“we are not to think of any bodily defilement of the land through the decomposition consequent upon death”) but the exposure of a man “smitten by the curse of God,” his “shameful deeds” held up to view.
    sources: [keil-deuteronomy, sc-knowhy-752, lds-scriptures]

  - ref: 23
    phrase: for he that is hanged is accursed of God
    kind: christ
    title: Christ made a curse for us
    body: |
      Paul quotes this line to say that Christ took the law's curse on Himself: “Christ hath redeemed us from the curse of the law, being made a curse for us: for it is written, Cursed is every one that hangeth on a tree” ([[Gal. 3:13]]). The Christian message of a crucified Son of God “was troubling to both Jews and Gentiles,” and “In Jewish literature, crucifixion was seen as one type of Deuteronomy's ‘hanging on a tree.’” Like Paul, “a number of early Christian writers felt the need to reconcile Jesus's crucifixion with this passage in Deuteronomy.” Paul does not explain the curse away: he says Christ became it for us.

      The law's other demand touches the end of the Crucifixion. Rome usually left the crucified on the cross, but Deuteronomy and a Dead Sea Scroll, the Temple Scroll, both required that the hanged “should not be left there overnight.” John tells how the Jews asked “that the bodies should not remain upon the cross on the sabbath day” ([[John 19:31]]), and the legs of the two crucified with Jesus were broken; He was already dead ([[John 19:32–33]]). Where a person on the cross had not died by day's end, “in order to comply with the mandate of Deuteronomy 21, other strategies were needed”; John himself gives the sabbath as the reason.
    sources: [strathearn-crucifixion, lds-scriptures]

christ: |
  The LORD who gave these laws is Jehovah, the premortal Christ (see the note at [[Ex. 3:14]]): the law was “given by the Lord, who was the premortal Jesus.” Paul reads the chapter's last law in relation to the cross: Christ was “made a curse for us” and so redeemed us “from the curse of the law” ([[Gal. 3:13]]), and John records the concern that the bodies not remain on the cross over the sabbath ([[John 19:31]]; the note at verse 23).

explore: |
  - [[Num. 35:30–34]]: why shed blood defiles the land, the principle behind verses 1–9.
  - [[Gen. 29:30–35]] and [[Gen. 48:5–20]]: the loved and less-loved wives of Jacob, and how the firstborn's share came to Joseph.
  - [[1 Ne. 8:36–37]] and [[2 Ne. 1:13–23]]: Lehi pleading with his rebellious sons.
  - [[Gal. 3:10–14]] and [[John 19:31–42]]: Paul's reading of verse 23, and the burial before the Sabbath.

