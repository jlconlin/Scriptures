chapter: 24
title: For the Stranger, for the Fatherless, and for the Widow
tagline: Moses limits divorce, sends the new husband home for a year, and guards the debtor, the hired worker, the stranger, the fatherless and the widow, because Israel was once a bondman in Egypt.
when: 'In the plains of Moab, in the fortieth year after the Exodus'

setting: |
  Moses is still speaking in the plains of Moab in the fortieth year after the Exodus ([[Deut. 1:3–5]]), inside the code of laws (chapters 12–26) that “forms the nucleus of the whole book.” This chapter's laws deal with private and social matters: marriage, loans, wages, the harvest.

  Several of its laws restate the earlier code in Exodus. The law against stealing a man and selling him is [[Ex. 21:16]] again; the cloak taken in pledge and returned at sundown is [[Ex. 22:26–27]]; justice for the stranger, the fatherless and the widow is [[Ex. 22:21–22]] and [[Ex. 23:9]], with a new rule that a widow's garment may not be taken in pledge at all. Deuteronomy adds limits and, more often, reasons.

  Later scripture comes back to the chapter. Jeremiah opens a prophecy with the divorce law ([[Jer. 3:1]]). Amos charges those who lie down “upon clothes laid to pledge by every altar” ([[Amos 2:8]]). King Amaziah spares the children of his father's murderers “according unto that which is written in the book of the law of Moses” ([[2 Kgs. 14:6]]). Jesus answered a question about verse 1 ([[Matt. 19:3–9]]) and taught on divorce in the Sermon on the Mount ([[Matt. 5:31–32]]) and to the Nephites ([[3 Ne. 12:31–32]]).

thread: |
  The laws of this chapter share a concern: each protects someone who could easily be used. A divorced wife cannot be sent away and later reclaimed (verses 1–4). A new husband stays home a year with his bride instead of going to war (verse 5; compare [[Deut. 20:7]]). A debtor keeps the millstone needed to grind his family's bread, the privacy of his house, and his cloak at night (verses 6, 10–13). No Israelite may be kidnapped and sold (verse 7; on “put evil away,” see [[Deut. 13:5]]). The hired worker is paid the same day (verses 14–15). No one dies for a relative's crime (verse 16). The stranger, the fatherless and the widow get fair judgment and what the harvest leaves behind (verses 17–22). In the middle, Moses warns Israel to heed the priests in leprosy and to remember Miriam (verses 8–9). The code “forbade practices that could easily lead to the oppression and extortion of vulnerable persons.”

  Moses gives reasons as he goes, and they point to the LORD. The poor man whose cloak comes back will “bless thee,” and “it shall be righteousness unto thee before the LORD thy God” (verse 13). The unpaid worker will “cry against thee unto the LORD” (verse 15). The gleanings are left “that the LORD thy God may bless thee” (verse 19). Twice a law ends with Israel's own past: “thou shalt remember that thou wast a bondman in Egypt, and the LORD thy God redeemed thee thence” (verse 18; again in verse 22). Underlying such laws is “the idea that God comes to the aid of those who are unable to help themselves”; those who have known His redemption are asked to do the same.

sections:
  - range: 1-4
    heading: The bill of divorcement
    plain: |
      Suppose a man marries a woman, and she comes to displease him because he has found something indecent about her, and he writes her a certificate of divorce, puts it in her hand, and sends her out of his house. She leaves and becomes another man's wife. Then the second husband turns against her, writes her a certificate of divorce and sends her away, or the second husband dies. In that case her first husband, who sent her away, may not marry her again, now that she has been defiled. That would be detestable to the LORD, and you must not bring sin on the land the LORD your God is giving you as your inheritance.
  - range: 5-9
    heading: A new husband, a millstone, a stolen man
    plain: |
      When a man has just married, he is not to be sent out with the army or given any other duty. He is free to stay home for one year and make the wife he has married happy. No one may take a pair of millstones, or even the upper millstone, as security for a debt, because that is taking a man's livelihood as security. If a man is caught kidnapping a fellow Israelite and treating him as merchandise or selling him, the kidnapper must die. So you will remove the evil from among you. In a case of leprosy, carefully follow what the Levitical priests teach you, as I commanded them. Remember what the LORD your God did to Miriam on the way after you came out of Egypt.
  - range: 10-15
    heading: Pledges and wages
    plain: |
      When you lend your neighbor anything, do not go into his house to take his pledge. Stand outside, and let the man you are lending to bring the pledge out to you. If the man is poor, do not go to bed with his pledge in your keeping. Give it back to him at sunset so that he can sleep in his own cloak and bless you; it will be righteousness to you before the LORD your God. Do not take advantage of a hired worker who is poor and needy, whether he is a fellow Israelite or a foreigner living in one of your towns. Pay him his wages each day before the sun goes down, because he is poor and is counting on them. Otherwise he will cry out to the LORD against you, and you will be guilty of sin.
  - range: 16-18
    heading: Justice for each, and for the weak
    plain: |
      Parents are not to be put to death for their children, nor children for their parents; each one is to be put to death for his own sin. Do not deny justice to the foreigner or the fatherless, and do not take a widow's garment as a pledge. Remember that you were a slave in Egypt and the LORD your God redeemed you from there. That is why I command you to do this.
  - range: 19-22
    heading: What the harvest leaves behind
    plain: |
      When you reap the harvest in your field and forget a sheaf, do not go back for it. Leave it for the foreigner, the fatherless and the widow, so that the LORD your God may bless you in everything you do. When you beat your olive trees, do not go over the branches a second time; leave what remains for the foreigner, the fatherless and the widow. When you pick the grapes of your vineyard, do not go back over the vines; leave what remains for the foreigner, the fatherless and the widow. Remember that you were a slave in Egypt. That is why I command you to do this.

notes:
  - ref: 1
    phrase: because he hath found some uncleanness in her
    kind: words
    title: Some uncleanness, and the argument it started
    body: |
      The ground for divorce in verse 1 is a vague Hebrew phrase, and its vagueness later divided the teachers of the law. “Some uncleanness” is *ʿerwat dabar*, “nakedness of a thing,” meaning “probably indecency, improper behaviour.” The phrase “is notoriously difficult to fully comprehend.”

      The bill of divorcement meant “that a woman divorced by her husband could remarry if she desired”; “the restriction here is that one who has divorced his wife may not later change his mind and remarry her” (see the note on verse 4).

      By the first century, Shammai's school read the phrase as referring “almost exclusively” to adultery; Hillel's school read it broadly, “including occasions when she burned dinner.” When Pharisees asked Jesus, “Is it lawful for a man to put away his wife for every cause?” ([[Matt. 19:3]]), their question falls within that debate. He did not argue the phrase. “Rather than engage Deuteronomy 24:1 directly,” He answered from Genesis: “he which made them at the beginning made them male and female” ([[Matt. 19:4]]). Asked why Moses then commanded a bill of divorcement, He called it a concession: “Moses because of the hardness of your hearts suffered you to put away your wives: but from the beginning it was not so” ([[Matt. 19:8]]). To the Nephites He taught the same limit as in the Sermon on the Mount: whoever “shall put away his wife, saving for the cause of fornication, causeth her to commit adultery” ([[3 Ne. 12:32]]). On divorce in the Old Testament, see [Women and Marriage](/old-testament/guides/women-and-marriage/#divorce).
    sources: [bdb, frederick-divorce, ot-manual-deuteronomy-17-33, lds-scriptures]

  - ref: 4
    phrase: may not take her again to be his wife, after that she is defiled
    kind: history
    title: Why she could not go back to the first husband
    body: |
      Verse 4 forbids the first husband to remarry her: once a divorced woman has married again, her first husband may never remarry her, even if the second husband divorces her or dies. The purpose of the passage “seems to be to restrict what could have been perceived as a loophole in the law,” so that divorce would not become too easy. The rule “would necessarily put a check upon frivolous divorces”: a husband “would reflect when inducements to divorce his wife presented themselves,” knowing that once she had remarried he could never undo it.

      The text calls the woman “defiled” by the second marriage and a return to the first husband “abomination before the LORD” that would “cause the land to sin.” The defilement is taken as moral, which puts a divorced woman's second marriage on a par with adultery: “whosoever shall marry her that is divorced committeth adultery” ([[Matt. 5:32]]). It also gives a reason that looks to the woman: taking her back would make her “appear too much like property, which could be disposed of at one time and reclaimed at another.”

      Jeremiah opens a prophecy with this law and then turns it: “thou hast played the harlot with many lovers; yet return again to me, saith the LORD” ([[Jer. 3:1]]; see the note there).
    sources: [frederick-divorce, keil-deuteronomy, lds-scriptures]

  - ref: 6
    phrase: for he taketh a man’s life to pledge
    kind: history
    title: What a lender could not take
    body: |
      A millstone could not be taken as security for a loan because a family could not live without it. The household handmill had a lower stone and an upper one, “the runner,” and taking either made the mill useless, “since the handmill was indispensable for preparing the daily food for the house; so that whoever took them away injured life itself.”

      The chapter returns to lending in verses 10–13 and 17. The lender may not go into the borrower's house to take a pledge; he stands outside, and the borrower brings it out (verses 10–11). The same reading takes this to mean that the borrower chooses the pledge, so that he is not compelled “to give up something as a pledge that might be indispensable to him.” A poor man's pledge goes back to him at sundown (verses 12–13), since “the poor man had very often nothing but his upper garment, in which he slept, to give as a pledge” (see the note on [[Ex. 22:27]]). And a widow's garment may not be taken at all (verse 17). Clothing taken from the poor “had to be returned before sundown.”

      Amos's charge against Israel breaks this law exactly: “they lay themselves down upon clothes laid to pledge by every altar” ([[Amos 2:8]]).
    sources: [keil-deuteronomy, bowen-law-codes, lds-scriptures]

  - ref: 15
    phrase: neither shall the sun go down upon it
    kind: history
    title: Paid before sundown
    body: |
      A day laborer was to be paid by sundown because he was poor and depended on that day's wages. The earlier law had said, “the wages of him that is hired shall not abide with thee all night until the morning” ([[Lev. 19:13]]); here the rule covers the foreigner as well as the Israelite (verse 14), and the code “required employers to pay them for a day's labor by sundown.”

      The verse gives the reason: “he is poor, and setteth his heart upon it,” counting on that day's pay. If he is not paid, he has a higher court: he will “cry against thee unto the LORD, and it be sin unto thee,” the same words used of the poor man refused a loan in [[Deut. 15:9]].
    sources: [lds-scriptures, bowen-law-codes]

  - ref: 16
    phrase: every man shall be put to death for his own sin
    kind: scripture
    title: Each for his own sin
    body: |
      Verse 16 forbids putting a criminal's children or parents to death for his crime. Israelite law, unlike “some practices of their neighbors,” “did not allow for vicarious punishment.” How the verse stands beside the commandment in which the LORD visits “the iniquity of the fathers upon the children” ([[Ex. 20:5]]) is taken up in the note on [[Ezek. 18:20]], where Ezekiel makes the same rule the way God Himself judges.

      Scripture records the law kept. When Amaziah became king of Judah, “he slew his servants which had slain the king his father,” but “the children of the murderers he slew not,” quoting this verse ([[2 Kgs. 14:5–6]]).
    sources: [sc-knowhy-142, lds-scriptures]

  - ref: 19
    phrase: hast forgot a sheaf in the field
    kind: history
    title: The forgotten sheaf
    body: |
      What harvesters forgot or left on the trees and vines belonged to the poor. Leviticus had already kept the corners of the field and the fallen grain for them (see the note on [[Lev. 19:9]]). Deuteronomy adds the sheaf forgotten when the grain was gathered, the olives left after the first beating of the tree, and the grapes left when the vineyard is not gone over a second time, each “for the stranger, for the fatherless, and for the widow.”

      Moses gives two reasons. One looks ahead: “that the LORD thy God may bless thee in all the work of thine hands,” a promise that the prosperity given to those who kept the law “would more than make up for what they had lost.” The other looks back: “thou wast a bondman in the land of Egypt” (verse 22).
    sources: [muhlestein-love-neighbor]

christ: |
  In the Latter-day Saint reading, the LORD who “redeemed thee thence” (verse 18) is Jehovah, the premortal Christ (see the note at [[Ex. 3:14]]), and His redemption of Israel from Egypt is the reason Moses gives for justice to the stranger, the fatherless and the widow (verses 17–18, 22).

  A Book of Mormon passage on the Atonement makes a similar point to verse 16. Israelite law “did not allow for vicarious punishment,” and Amulek says: “there is not any man that can sacrifice his own blood which will atone for the sins of another” ([[Alma 34:11]]). That last sacrifice, Amulek goes on, will be “the Son of God, yea, infinite and eternal” ([[Alma 34:14]]). The fuller treatment is with [[Ezek. 18:20]].

explore: |
  - [[Matt. 19:3–9]] and [[3 Ne. 12:31–32]]: the Savior's answer to the question verse 1 raised.
  - [[Ex. 22:21–27]]: the earlier laws on the stranger, the widow and the pledge.
  - [[Ruth 2]]: Ruth the Moabitess gleaning in Boaz's field.
  - [[Jer. 3:1–14]]: the divorce law as the setting for the Lord's call to return.
  - [“Covenantal Command: Love Thy Neighbor”](https://rsc.byu.edu/covenant-compassion/covenantal-command), a Religious Studies Center study of how the covenant law cared for the stranger, the fatherless and the widow.

