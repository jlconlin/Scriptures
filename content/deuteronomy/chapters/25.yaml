chapter: 25
title: The House of Him That Hath His Shoe Loosed
tagline: Moses limits the beating a judge may order, frees the threshing ox to eat, gives the childless widow a claim on her husband's brother, forbids false weights, and tells Israel to remember Amalek.
when: 'In the plains of Moab, in the fortieth year after the Exodus'

setting: |
  Moses is still speaking in the plains of Moab in the fortieth year after the Exodus ([[Deut. 1:3–5]]), near the end of the code of laws (chapters 12–26) that “forms the nucleus of the whole book.” The last group of those laws “regulates private and social rights,” and this chapter's laws belong there: a beating ordered by a court, an ox at the threshing floor, a widow left without a son, a fight between two men, a merchant's weights. It closes with a command about a people, Amalek, and chapter 26 then turns to the offerings Israel will bring in the land.

  Later scripture comes back to the chapter more than once. Paul quotes the law of the ox ([[1 Cor. 9:9]]; [[1 Tim. 5:18]]), one of the New Testament's many references to Deuteronomy. The Sadducees bring the widow's law to Jesus ([[Matt. 22:23–33]]). A shoe is taken off at the gate in [[Ruth 4:7–8]], and Samuel sends Saul against Amalek ([[1 Sam. 15:2–3]]). The battle with Amalek itself is told at [[Ex. 17:8–16]].

thread: |
  The laws of this chapter look like a list, and to a degree they are: the code's last group of laws gathers private and social matters with no one subject. What can be seen in the English is a word and a habit of mind. The word is “brother.” The guilty man beaten by the court is still “thy brother,” and the limit of forty stripes is there so that he will not “seem vile unto thee” (verse 3). The widow's law turns on a husband's brother who will or will not “build up his brother's house” (verses 5–10). Even the fight of verse 11 is, in the Hebrew idiom behind “one with another,” between a man and his brother. The habit of mind is Moses' reasons. Honest weights are kept “that thy days may be lengthened in the land” (verse 15), and false dealing is “an abomination unto the LORD thy God” (verse 16).

  The chapter ends with “remember,” a word that introduces history again and again in Deuteronomy. Israel was told in the last chapter to remember Miriam “by the way, after that ye were come forth out of Egypt” ([[Deut. 24:9]]); now it is told, in nearly the same words, to remember what Amalek did “by the way, when ye were come forth out of Egypt” (verse 17), and “not forget it” (verse 19).

sections:
  - range: 1-4
    heading: Forty stripes, and the threshing ox
    plain: |
      When two men have a dispute and go to court, the judges are to decide the case, declaring the innocent one in the right and the guilty one in the wrong. If the guilty man deserves to be beaten, the judge is to have him lie down and be beaten in his presence, with the number of blows his offense deserves. He may be given forty blows, but no more. If he were beaten more than that, your brother would be degraded in your sight. Do not muzzle an ox while it is treading out the grain.
  - range: 5-10
    heading: The husband's brother
    plain: |
      When brothers live together and one of them dies without a son, his widow is not to marry outside the family to a stranger. Her husband's brother is to take her as his wife and do for her what a husband's brother should. The first son she bears is to carry on the name of the brother who died, so that his name is not wiped out of Israel. If the man does not want to marry his brother's widow, she is to go to the elders at the town gate and say, “My husband's brother refuses to keep his brother's name alive in Israel; he will not do his duty to me.” The elders of his town are to summon him and speak with him. If he persists and says, “I do not want to marry her,” his brother's widow is to come up to him in front of the elders, pull his sandal off his foot, spit in his face, and declare, “This is what is done to the man who will not build up his brother's family.” His family will be known in Israel as “the house of the man whose sandal was pulled off.”
  - range: 11-12
    heading: A wife in a fight
    plain: |
      If two men are fighting and the wife of one of them comes to rescue her husband from the man who is beating him, and she reaches out and seizes the other man by his genitals, you are to cut off her hand. Show her no pity.
  - range: 13-16
    heading: Honest weights
    plain: |
      Do not keep two different weights in your bag, a heavy one and a light one. Do not keep two different measures in your house, a large one and a small one. Keep a full and honest weight and a full and honest measure, so that you may live long in the land the LORD your God is giving you. Everyone who does such things, everyone who deals dishonestly, is detestable to the LORD your God.
  - range: 17-19
    heading: Remember Amalek
    plain: |
      Remember what Amalek did to you on the way when you came out of Egypt: how they met you on the road and attacked those at the back, all the stragglers behind you, when you were faint and exhausted; they had no fear of God. So when the LORD your God has given you rest from all the enemies around you in the land He is giving you to possess as an inheritance, you are to wipe out the memory of Amalek from under heaven. Do not forget.

notes:
  - ref: 3
    phrase: then thy brother should seem vile unto thee
    kind: history
    title: Forty stripes and no more
    body: |
      The limit of forty protects the standing of the man being punished: he is beaten for his crime, but he is still “thy brother.” The beating came only after a trial and a verdict (verses 1–2), was given in front of the judge, and was counted out “according to his fault.” Past forty, the verse says, the beating would make him “vile,” degraded in the eyes of the people who are still to call him brother.

      Later practice stopped one short of the limit. “In order to prevent a miscount and therefore break a commandment of the Lord, thirty-nine lashes were usually administered.” Paul counted his own: “Of the Jews five times received I forty stripes save one” ([[2 Cor. 11:24]]).
    sources: [ot-manual-deuteronomy-17-33]

  - ref: 4
    phrase: Thou shalt not muzzle the ox when he treadeth out the corn
    kind: scripture
    title: The ox that treads out the grain
    body: |
      The ox that does the threshing is to be left free to eat from the grain under its feet, and the New Testament reads the law as a rule about laborers. Threshing was done “with oxen yoked together, and driven to and fro over the corn that had been strewn upon the floor, that they might kick out the grains with their hoofs.” A muzzle would have kept the animal from eating while it worked.

      Paul quotes the verse twice, both times of those who labor in the gospel. To the Corinthians he asks, “Doth God take care for oxen? Or saith he it altogether for our sakes?” ([[1 Cor. 9:9–10]]), and concludes that “they which preach the gospel should live of the gospel” ([[1 Cor. 9:14]]). To Timothy, writing of elders who “labour in the word and doctrine” ([[1 Tim. 5:17]]), he sets it beside a second saying: “Thou shalt not muzzle the ox that treadeth out the corn. And, The labourer is worthy of his reward” ([[1 Tim. 5:18]]).

      Older readings differ on whether Moses himself meant more than oxen. One takes the command as “no doubt proverbial in its nature,” meant even here in Paul's sense, “that a labourer was not to be deprived of his wages.” Another answers Paul's question the other way: “Is it for oxen that God careth? According to D, undoubtedly He does.” In the Joseph Smith Translation the Savior Himself quotes the verse (see the Witness of Christ below).
    sources: [keil-deuteronomy, cambridge-deuteronomy, lds-scriptures]

  - ref: 5
    phrase: perform the duty of an husband’s brother unto her
    kind: history
    title: The husband's brother
    body: |
      Verses 5–10 give the law of levirate marriage, which kept a childless widow inside her husband's family and kept his name alive in Israel. The term comes from the Latin *levir*, “husband's brother,” and has nothing to do with Levi. Israel shared the custom with its Near Eastern neighbors: when a woman's husband died before she had children to care for her, his family took over her care. The brother-in-law was to become “a special kind of husband for the widow,” and the son born to her would inherit her first husband's land and look after her, so that the land stayed in the family line.

      The verse gives the law's own reason: the firstborn is to “succeed in the name of his brother which is dead, that his name be not put out of Israel” (verse 6). The child bore the dead man's name and was his heir, so the law both provided for the widow and kept a family line from dying out.

      The same duty appears in Genesis, in Judah's family: “Go in unto thy brother's wife, and marry her, and raise up seed to thy brother” ([[Gen. 38:8]]). Deuteronomy lets the brother refuse, at the price of a public shaming before the elders (verses 7–10). How the law stands beside the prohibition of a brother's wife in Leviticus is taken up at [[Lev. 18:16]]. On the custom in Israel more broadly, see [Women and marriage in the Old Testament](/old-testament/guides/women-and-marriage/#levirate-marriage).
    sources: [bd-levirate-marriage, muhlestein-love-neighbor, muhlestein-ruth, lds-scriptures]

  - ref: 9
    phrase: loose his shoe from off his foot, and spit in his face
    kind: symbol
    title: The loosed shoe
    body: |
      The widow's act at the gate shamed the brother who refused her, and the shame stayed on his house. It is “the only stipulated example of public humiliation” in the law of Moses. What the shoe meant is not certain.

      One reading starts from the way scripture uses shoes elsewhere: wearing them “denotes a readiness, a preparation to do what needs to be done” (as at the Passover, [[Ex. 12:11]]), so “having the sandal taken off signifies a refusal to perform that same duty.” Since a man likely refused in order to keep his own children's inheritance whole, “the entire family was to share in the stigma of shame.”

      A shoe also comes off at the gate in [[Ruth 4:7–8]]. The Bible Dictionary counts the story of Ruth as a major instance of the levirate custom, and most readers, Latter-day Saint and other, have taken that scene as this law at work. One Latter-day Saint study argues it is a different rite: Ruth does not spit in the face of the man who declines, he takes off his own shoe, he “is not Ruth's husband's brother,” and he “incurs no disgrace when he declines to play his part.” In that reading the shoe in Ruth stands for the right to land, “the perfect symbol of the right of possession,” which the kinsman gives up.
    sources: [muhlestein-ruth, bd-levirate-marriage, gaskill-shoe, lds-scriptures]

  - ref: 12
    phrase: Then thou shalt cut off her hand
    kind: history
    title: The penalty of a hand
    body: |
      Verses 11–12 prescribe a mutilation, which Deuteronomy's laws do nowhere else outside the law of retaliation. A wife who intervenes in a fight by seizing the other man's genitals is to lose her hand. In one older reading this “is the only mutilation prescribed by D apart from the jus talionis,” the law of “eye for eye, tooth for tooth, hand for hand” ([[Deut. 19:21]]). The text gives no reason beyond the case itself and the charge “thine eye shall not pity her,” the words used of the law of retaliation in the same verse.

      The same reading offers three observations, each tentative. The case is “probably meant to be typical of others”; its origin “is usually supposed” to lie at a time when such an act was “the violation of a very sacred taboo”; and its position here, after the widow's law, “may be due to the catchword his brother.” The laws of Hammurabi have what may be parallel crimes.
    sources: [cambridge-deuteronomy, lds-scriptures]

  - ref: 13
    phrase: divers weights, a great and a small
    kind: words
    title: Two sets of stones
    body: |
      “Divers weights” are two sets of weighing stones in the merchant's bag, a heavy set and a light one. The Hebrew says “stone and stone” (*ʾeben wāʾāben*), “a great and a small.” Verse 14 forbids the same with the measures kept in the house, and verse 16 widens the law to “all that do unrighteously.” Amos describes a market rigged in this way, “making the ephah small, and the shekel great” ([[Amos 8:5]]), and the note there explains how one sale was cheated at every point; the law's other statement is [[Lev. 19:35–36]].
    sources: [oshb-wlc]

  - ref: 18
    phrase: smote the hindmost of thee, even all that were feeble behind thee
    kind: history
    title: Why Amalek is remembered
    body: |
      Deuteronomy gives the reason that Exodus leaves unstated: Amalek fell on the stragglers. Exodus says only that “then came Amalek, and fought with Israel” ([[Ex. 17:8]]); the decree against Amalek and the later wars are set out in the note at [[Ex. 17:14]]. Here Moses tells how the attack came: Amalek struck the rear of a people on the march, “all that were feeble behind thee, when thou wast faint and weary; and he feared not God.”

      The two accounts also differ in who is to blot Amalek out. At Rephidim the LORD said, “I will utterly put out the remembrance of Amalek” ([[Ex. 17:14]]); here Israel is told, “thou shalt blot out the remembrance of Amalek,” once “the LORD thy God hath given thee rest.” When Samuel later sends Saul against Amalek, the reason he gives is the same attack: “I remember that which Amalek did to Israel, how he laid wait for him in the way, when he came up from Egypt” ([[1 Sam. 15:2]]). What “utterly destroy” meant, and how the Church reads such commands, is at [[Deut. 7:2]].
    sources: [lds-scriptures]

christ: |
  In the Joseph Smith Translation the Savior quotes verse 4 when He speaks of those He sends out to minister: “For the law saith that a man shall not muzzle the ox that treadeth out the corn” (JST Luke 12:30). The change means that “Paul's use of the verse is actually quoting a teaching of the Savior.”

  The widow's law also came before Jesus. The Sadducees, who denied the resurrection, used it in a story of one woman married to seven brothers ([[Matt. 22:23–28]]). It “was actually a question about the resurrection,” and Jesus answered that they erred, “not knowing the scriptures, nor the power of God” ([[Matt. 22:29]]), for God “is not the God of the dead, but of the living” ([[Matt. 22:32]]). Abraham, Isaac and Jacob lived on, and “through Jesus's own resurrection he would overcome physical death for them and for us.”

explore: |
  - [[Ruth 4:1–12]]: a shoe taken off at the gate, and a kinsman who redeems.
  - [[Ex. 17:8–16]] and [[1 Sam. 15]]: the battle with Amalek and Saul's war against it.
  - [“The ‘Ceremony of the Shoe’”](https://rsc.byu.edu/our-rites-worship/ceremony-shoe-ritual-gods-ancient-covenant-people), a Religious Studies Center study of the shoe ceremony in Ruth 4 and what it meant.

