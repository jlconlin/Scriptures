chapter: 15
title: The LORD's Release
tagline: Every seventh year debts between Israelites are released, the poor are to be lent to with an open hand, the Hebrew servant goes free with gifts, and the firstborn of the flocks and herds are the LORD's.
when: 'In the plains of Moab, in the fortieth year after the Exodus'

setting: |
  Chapter 14 ended with the third-year tithe laid up for the Levite, the stranger, the fatherless and the widow ([[Deut. 14:28–29]]), and on one older reading those instructions lead Moses on to “the laws respecting the poor and slaves.” Together these laws form a covenant approach to wealth that “differentiated them from their neighbors.”

  The chapter builds on a seventh year the law already had. Like every seventh day, every seventh year was consecrated to the Lord: the land rested ([[Lev. 25:2–7]]), and what grew of itself was left for the poor. Chapter 15 adds a release of debts in that year and returns to the Hebrew servant who goes free after six years of work ([[Ex. 21:2]]). The sabbatical year “was habitually broken” for a long time before the Babylonian exile, and the seventy years of the land's desolation were regarded as making up its lost sabbaths ([[2 Chr. 36:21]]). In Jeremiah's day a release of servants was proclaimed in Jerusalem and then taken back, and the prophet's rebuke states the law in words close to this chapter's ([[Jer. 34:8–17]]).

thread: |
  The chapter asks Israel, over and over, to let go: of debts in the seventh year (verses 1–6), of the fear of lending when that year is near (verses 7–11), of a servant whose six years are done (verses 12–18), and of the firstborn of the herd and flock (verses 19–23). Each time it gives a reason that points to God. The release is “the LORD's release” (verse 2); the LORD will bless the one who gives (verses 4, 6, 10, 14, 18); and Israel was itself a bondman whom “the LORD thy God redeemed” (verse 15).

  These laws were “a structural reminder that what the wealthy perceived as their resources was not actually theirs” and a way “to redistribute wealth and prevent a perpetually widening gap between the rich and the poor.” Under them “servitude and debt could never be crushing in the long term.”

  The last verses turn from the poor to the firstlings, which had been the LORD's since the Exodus ([[Ex. 13:2]]). Moses adds that a firstling is not to be worked or shorn, that the household eats it before the LORD each year at the chosen place, and that one with a blemish is not offered but eaten at home like game, with its blood poured out (as in [[Deut. 12:15–16]]).

sections:
  - range: 1-6
    heading: The LORD's release
    plain: |
      At the end of every seven years you are to make a release. This is how it works: every creditor is to release what he has lent to his neighbor. He is not to press his neighbor, his fellow Israelite, for payment, because it is called the LORD's release. You may press a foreigner for payment, but whatever your brother owes you, let it go. Yet there should be no poor among you, for the LORD will richly bless you in the land the LORD your God is giving you to possess as an inheritance, if only you listen carefully to the voice of the LORD your God and keep all these commandments I give you today. The LORD your God will bless you as He promised: you will lend to many nations and not borrow, and you will rule over many nations, and they will not rule over you.
  - range: 7-11
    heading: Open thine hand wide
    plain: |
      If one of your brothers is poor, in any of the towns of the land the LORD your God is giving you, do not harden your heart or close your hand against him. Open your hand wide, and lend him enough for whatever he needs. Be careful not to let a wicked thought into your heart: “The seventh year, the year of release, is near,” so that you look grudgingly on your poor brother and give him nothing. He will cry to the LORD against you, and it will be sin to you. Give to him freely, and do not give with a grudging heart, because for this the LORD your God will bless you in all your work and in everything you put your hand to. There will always be poor people in the land; that is why I command you to open your hand wide to your brother, to the poor and the needy in your land.
  - range: 12-18
    heading: The servant set free
    plain: |
      If a fellow Hebrew, man or woman, is sold to you and serves you six years, in the seventh year you are to set him free. And when you set him free, do not send him away empty-handed. Load him generously from your flock, your threshing floor and your winepress; give him from what the LORD your God has blessed you with. Remember that you were slaves in Egypt and the LORD your God redeemed you; that is why I give you this command today. But if he says to you, “I will not leave you,” because he loves you and your household and is well off with you, then take an awl and pierce his ear into the door, and he will be your servant for life. Do the same for your maidservant. Do not think it hard to set him free, for he has served you six years at half the cost of a hired worker. And the LORD your God will bless you in all that you do.
  - range: 19-23
    heading: The firstlings
    plain: |
      Consecrate to the LORD your God every firstborn male of your herd and flock. Do not put the firstborn of your cattle to work or shear the firstborn of your sheep. You and your household are to eat it before the LORD your God every year, in the place the LORD will choose. If it has a defect, if it is lame or blind or has any serious flaw, do not sacrifice it to the LORD your God. Eat it in your own towns; the unclean and the clean may eat it alike, as they would a gazelle or a deer. Only do not eat its blood; pour it out on the ground like water.

notes:
  - ref: 1
    phrase: thou shalt make a release
    kind: history
    title: The LORD’s release
    body: |
      Moses calls the seventh-year release of Israelite debts the LORD's. The earlier law says of the land, “the seventh year thou shalt let it rest and lie still” ([[Ex. 23:11]]). Where Exodus rests the land, Deuteronomy releases the debtor, and both years provided for the poor. “A release of debts owed by Israelite to Israelite was made,” and the year began with the seventh month, when the law was read at the Feast of Tabernacles (see [[Deut. 31:10]]).

      Calling it “the LORD's release” (verse 2) makes the cancelling of a debt something done toward God, not only toward a neighbor. How Moses ties the seventh year to the Sabbath and to Israel's bondage is at the note on [[Deut. 5:15]].

      Verse 3 lets a creditor still collect from a foreigner. One older reading takes the word (*nokri*) to mean a man of another nation, not the stranger who lived among the Israelites and “had a claim upon their protection and pity,” and finds in the rule “no hatred of foreigners,” since a foreigner's income did not stop in the seventh year.
    sources: [bowen-law-codes, bd-sabbatical-year, lane-redemption, keil-deuteronomy]

  - ref: 4
    phrase: Save when there shall be no poor among you
    kind: words
    title: No poor among you, and the poor that never cease
    body: |
      Verse 4 can be read as a command or as a promise, and the King James “Save when” makes having no poor “merely a theoretical possibility.” One modern translation takes the line as a command, “there should not be any poor among you,” and another as a covenant promise, “There shall be no needy among you … if only you heed the Lord your God.” Either way, verse 5 sets the condition: “Only if thou carefully hearken unto the voice of the LORD thy God.”

      Verse 11 then says what Israel would in fact face: “the poor shall never cease out of the land.” That line “does not amount to a commandment or a prophecy but rather a sad statement of fact,” and the command Moses draws from it is the opposite of resignation: “therefore I command thee, saying, Thou shalt open thine hand wide.”

      The Lord describes Enoch's city as a place where “there was no poor among them” ([[Moses 7:18]]); one reading connects that condition with verse 4 and contrasts it with verse 11.
    sources: [lane-redemption, bowen-law-codes, lds-scriptures]

  - ref: 9
    phrase: thine eye be evil against thy poor brother
    kind: words
    title: A grudging eye as the seventh year nears
    body: |
      Here “an evil eye” means a grudging look, and a modern translation has the lender “look grudgingly on your poor brother.”

      The temptation comes from the law itself. A loan made in the sixth year would soon be released, so a lender might refuse it; “the timing of the Sabbatical can potentially make it harder to offer a loan to those in need.” Moses reaches past the refusal to the thought behind it (“Beware that there be not a thought in thy wicked heart”) and gives the poor man a higher court: he will “cry unto the LORD against thee, and it be sin unto thee.” In one Latter-day Saint reading, lending in the sixth year was not a loss to avoid but “an extra opportunity to help the poor,” and verse 10 promises that what is lost “would be made up for in the blessings showered out upon them for keeping their covenant.”
    sources: [bdb, esv, lane-redemption, muhlestein-love-neighbor]

  - ref: 14
    phrase: Thou shalt furnish him liberally
    kind: history
    title: Not sent away empty
    body: |
      What Deuteronomy adds to the servant law of Exodus is the gift: the freed servant leaves with a share of the flock, the grain and the wine. The release after six years is already in [[Ex. 21:2]] (see the note there); that verse mentions no gift, and the command not to “let him go away empty” is this chapter's.

      Without such provision a freed servant faced “quickly falling back into a cycle of poverty and losing their freedom once again.” The measure of the gift is the master's own blessing, “of that wherewith the LORD thy God hath blessed thee”; “it is with the abundance with which they have been blessed by God that they, in turn, were to bless others.”

      The law is the same for a woman. “An Hebrew man, or an Hebrew woman” goes free (verse 12), and the rite for a servant who stays applies “unto thy maidservant” as well (verse 17), where Exodus had set a daughter sold as a maidservant under separate terms ([[Ex. 21:7]]; see the note there). The pierced ear itself is explained at [[Ex. 21:6]]. The reason for the release is that the servant has served six years “at half the cost of a hired worker” (verse 18).
    sources: [muhlestein-love-neighbor, lane-redemption, lds-scriptures]

christ: |
  The LORD who commands the release (see the note at [[Ex. 3:14]]) gives a reason that is His own act: “the LORD thy God redeemed thee” (verse 15). The psalmist praises Him, “Thou openest thine hand, and satisfiest the desire of every living thing” ([[Ps. 145:16]]), and “this is exactly how the covenant people are asked to give” (verses 8 and 11). When the risen Lord came to the Nephites He said, “I am he that gave the law” ([[3 Ne. 15:5]]).

explore: |
  - [[Lev. 25]]: the land's sabbath and the jubilee, the other half of the law of release.
  - [[Ex. 21:1–11]]: the servant law this chapter builds on.
  - [[Jer. 34:8–22]]: a release proclaimed in besieged Jerusalem and then revoked.
  - [[Moses 7:18]]: Zion, with “no poor among them.”
  - [“Remembering Redemption, Avoiding Idolatry”](https://rsc.byu.edu/covenant-compassion/remembering-redemption-avoiding-idolatry), a Religious Studies Center study, reads the whole chapter as a covenant lesson that Israel's wealth belonged to God.

sources: [lds-scriptures, keil-deuteronomy, bowen-law-codes, bd-sabbatical-year, lane-redemption, muhlestein-love-neighbor, bdb, esv]
