chapter: 7
title: An Holy People unto the LORD
tagline: Moses commands Israel to devote the nations of Canaan to destruction and to make no treaty or marriage with them, because Israel is holy, chosen not for its size but because the LORD loved it; he promises blessing for faithfulness and answers Israel's fear with the memory of Egypt.
when: 'In the plains of Moab, in the fortieth year after the Exodus'

setting: |
  Moses is still speaking in Moab in the fortieth year ([[Deut. 1:3]]), in the first part of his second address, chapters 5–11, “the Ten Commandments and a practical exposition of them.” Chapter 7 keeps “the emphasis on the first commandment,” total loyalty to the LORD and no other gods ([[Deut. 5:6–7]]; [[Deut. 6:4–5]]), and turns it toward the land Israel is about to enter: what loyalty to the LORD will require when Israel lives among peoples who worship other gods.

  The chapter holds the first command of the ḥērem, the “utter destruction” of the nations of Canaan, for the conquest. Its substance had been given at Sinai: no covenant with the peoples of the land, their altars broken, their groves cut down, no marriages with them ([[Ex. 23:32–33]]; [[Ex. 34:11–16]]). Here Moses gives the reasons at length. Why the command was given, and how the Church reads it today, is the subject of the notes on verse 2.

thread: |
  The chapter is about **why Israel must stay separate, and what makes it able to.** It moves in three steps. Verses 1–5 give the command: when the LORD casts out the nations, Israel is to destroy them, make no covenant and no marriage with them, and destroy the objects of their worship. Verses 6–11 give the reason: Israel is “an holy people,” chosen to be the LORD's own, and its identity is “linked to the exclusive worship of and loyalty to the Lord.” Verses 12–26 give the promises, the blessings of fruitfulness and health that will follow if Israel stays faithful, which “underscore the value” of that loyalty.

  The middle step carries the weight. Israel was not chosen because it was strong; it was “the fewest of all people” (verse 7), facing “seven nations greater and mightier” (verse 1). So the fear Moses expects, “These nations are more than I; how can I dispossess them?” (verse 17), is answered not with Israel's strength but with memory: “remember what the LORD thy God did unto Pharaoh” (verse 18). The promises of the hornet and of a conquest “by little and little” (verses 20, 22) repeat Exodus, where they are explained (see the note at [[Ex. 23:28]]); the promise that none of “the evil diseases of Egypt” will come on Israel (verse 15) echoes the LORD's word at the healed waters ([[Ex. 15:26]]).

  The chapter begins and ends with the same Hebrew root. The nations are to be “utterly destroyed” (verse 2), and the abomination Israel must not bring into its houses is “a cursed thing” (verse 26): the verb and its noun, *ḥērem*, what is devoted to the LORD and taken out of human use. Whoever takes such a thing home becomes like it.

sections:
  - range: 1-5
    heading: Make no covenant with the nations
    plain: |
      When the LORD your God brings you into the land you are going in to possess, and drives out many nations before you, the Hittites, Girgashites, Amorites, Canaanites, Perizzites, Hivites and Jebusites, seven nations larger and stronger than you, and when the LORD your God gives them over to you and you defeat them, you must devote them to destruction. Make no treaty with them and show them no mercy. Do not intermarry with them: do not give your daughters to their sons or take their daughters for your sons, for they would turn your sons away from following me to serve other gods, and then the LORD's anger would burn against you and He would quickly destroy you. Instead, this is what you are to do to them: tear down their altars, break down their images, cut down their groves, and burn their carved idols.
  - range: 6-11
    heading: Chosen because the LORD loved you
    plain: |
      For you are a people holy to the LORD your God. The LORD your God has chosen you out of all the peoples on the face of the earth to be His own special people. The LORD did not set His love on you and choose you because you were more numerous than other peoples, for you were the fewest of all. It was because the LORD loved you, and because He kept the oath He swore to your fathers, that the LORD brought you out with a mighty hand and redeemed you from the house of slavery, from the power of Pharaoh king of Egypt. Know, then, that the LORD your God is God, the faithful God, who keeps His covenant and His steadfast love for a thousand generations with those who love Him and keep His commandments, and who repays those who hate Him to their face, destroying them; He does not delay with anyone who hates Him, but repays him to his face. So keep the commandments, statutes and judgments that I give you today, and do them.
  - range: 12-26
    heading: The blessings of faithfulness, and the snare of the idols
    plain: |
      If you listen to these judgments and keep and do them, the LORD your God will keep with you the covenant and steadfast love He swore to your fathers. He will love you, bless you and multiply you. He will bless your children and the fruit of your land, your grain, wine and oil, the increase of your cattle and of your flocks of sheep, in the land He swore to your fathers to give you. You will be blessed above all peoples: no man or woman among you, and none of your livestock, will be barren. The LORD will keep all sickness from you; He will not put on you any of the terrible diseases of Egypt that you know, but will lay them on those who hate you. You shall destroy all the peoples the LORD your God gives over to you; do not look on them with pity, and do not serve their gods, for that would be a trap for you.

      If you say to yourself, “These nations are more than I am; how can I drive them out?” do not be afraid of them. Remember well what the LORD your God did to Pharaoh and all Egypt: the great temptations you saw with your own eyes, the signs and wonders, the mighty hand and outstretched arm by which the LORD your God brought you out. The LORD your God will do the same to all the peoples you fear. He will even send the hornet among them, until those who are left and hide from you are destroyed. Do not be terrified of them, for the LORD your God is among you, a great and awesome God. The LORD your God will drive those nations out before you little by little. You will not be able to make an end of them all at once, or the wild animals would multiply around you. But the LORD your God will give them over to you and destroy them with a great destruction until they are destroyed. He will give their kings into your hand, and you will wipe out their names from under heaven; no one will be able to stand against you until you have destroyed them. Burn the carved images of their gods. Do not covet the silver or gold on them or take it for yourself, or you will be trapped by it, for it is detestable to the LORD your God. Do not bring a detestable thing into your house, or you will be devoted to destruction like it. Utterly detest and abhor it, for it is devoted to destruction.

notes:
  - ref: 2
    phrase: utterly destroy them
    kind: words
    title: Devoted to the LORD for destruction
    body: |
      “Utterly destroy” translates a Hebrew verb, *heḥĕrîm*, that means to devote something to the LORD by destroying it; its noun is *ḥērem*, and the word belongs as much to holiness as to war. The King James usually renders the verb “utterly destroy,” and the noun “cursed thing” (verse 26), “accursed thing” (Josh. 6:17–18) or “devoted thing” (Lev. 27:21, 28). By its root the word has “more to do with holiness than violence.” It probably comes from “the idea of devoting or consecrating people and things to the Lord, transferring them to the divine sphere and thereby making them off-limits to mortals.” Applied to a people in war, that transfer “would be effected by killing,” so the verb means “to devote or consecrate to destruction.” Verse 2 states it twice over, *haḥărēm taḥărîm*, “you shall surely devote them to destruction.”

      The same word covers things given to the LORD in the ritual law, and Israelites guilty of idolatry, who could themselves become *ḥērem* ([[Deut. 13:15, 17]]). The chapter ends with a warning to Israel in the same root (see the note at verse 26).

      How the command was carried out at Heshbon is told at [[Deut. 2:34]]; the law of war that repeats it is [[Deut. 20:16–18]].
    sources: [calabro-herem, oshb-wlc]

  - ref: 2
    phrase: thou shalt smite them
    kind: history
    title: Why the nations of Canaan were to be destroyed
    body: |
      The Church teaches that the nations of Canaan were destroyed for their own long rebellion against God and to keep Israel from being drawn into it; how the command was meant and carried out is less certain. Moses himself gives the first reason: “they will turn away thy son from following me, that they may serve other gods” (verse 4), and the law of war repeats it, “that they teach you not to do after all their abominations, which they have done unto their gods” ([[Deut. 20:18]]). Israel is not told it is better than they: the land is given “for the wickedness of these nations” ([[Deut. 9:5]]).

      The Church's newest word adds the rest. The Canaanites were to be driven out for their wickedness, which included idol worship and the sacrifice of their children, and Nephi says they “had rejected every word of God, and they were ripe in iniquity” ([[1 Ne. 17:35]]). The destruction was not sudden: God gave them long opportunity to repent, as He had told Abraham that “the iniquity of the Amorites is not yet full” ([[Gen. 15:16]]). It answered generations of rebellion against Him, and it shows both His justice and His care to protect His covenant people. And “we should not think that examples of violence in the Old Testament would ever be justification for committing violence today.”

      Latter-day Saint scholars add two readings, each its author's. One study of the *ḥērem* holds that the goal of the conquest was to “drive out” the Canaanites, as the books of Moses and Joshua say again and again, and that the *ḥērem* was “a ritualized form of destruction employed in battle,” applied to cities that resisted. It reads the absolute language as “the exaggerated idiom of that time,” so that what happened “was likely not wholesale extermination,” though the same study grants that this does not remove the charge of genocide. Another reading takes the command as aimed at “the national identities” of the peoples of the land rather than at every individual: in the ancient world a nation's identity was bound to its gods, and with a foreign community nearby, Israelites might marry into it and vanish.

      What is not known is much. “We ultimately know very little” about the reasons behind the command, and “ancient Israelites themselves” likely “lacked a full understanding of the purposes behind God's commandment.” The same God had just forbidden Israel to touch Edom, Moab and Ammon ([[Deut. 2:5, 9, 19]]).
    sources: [lds-scriptures, scripture-helps-deut, scripture-helps-violence, calabro-herem, ot-minute-deut-rappleye]

  - ref: 7
    phrase: The LORD did not set his love upon you
    kind: scripture
    title: Chosen for love, not for numbers
    body: |
      Moses tells Israel it was chosen because the LORD loved it and kept His oath to its fathers, not because of anything Israel was: it was “the fewest of all people.” Being chosen as the LORD's “special people” (verse 6) is explained at [[Ex. 19:5]].

      The point of the reminder is that Israel has nothing to boast of. “Lest the people become boastful in their being redeemed, they are reminded of the covenant basis for redemption”: love, and an oath sworn to Abraham, Isaac and Jacob. Chapter 9 makes the same point about the conquest itself ([[Deut. 9:4–6]]).

      The choice carries duties as well as privileges. Election is “God's choice of the house of Israel to be the covenant people with privileges and responsibilities, that they might become a means of blessing to the whole world,” and it “is an opportunity for service.”
    sources: [lane-redemption, bd-election, lds-scriptures]

  - ref: 9
    phrase: keepeth covenant and mercy
    kind: words
    title: Mercy to a thousand generations, repayment to the face
    body: |
      “Mercy” here is *hesed*, the faithful love that belongs to a covenant, and verses 9–10 set it against God's repayment of those who hate Him. *Hesed* describes “a covenant relationship in which both parties are bound to be loyal and faithful to each other” (the word is explained at [[Ps. 51:1]]). President Russell M. Nelson linked this verse to Nephi's saying that God “loveth those who will have him to be their God” ([[1 Ne. 17:40]]): “a special mercy and love—or hesed—is available to all who enter this binding and intimate relationship with God, even ‘to a thousand generations.’”

      The words echo the commandment against images, where the LORD shows mercy “unto thousands of them that love me, and keep my commandments” and visits iniquity “unto the third and fourth generation of them that hate me” ([[Ex. 20:5–6]]; see the note at [[Ex. 20:5]]); here the second half reads that He “repayeth them that hate him to their face.” One older reading takes the verses as a warning drawn from Exodus 20:5–6 “not to forfeit the mercy of God … by falling into idolatry,” and “to his face” as “that they may see and feel that they are smitten by God.” Verse 9 begins the promise; verses 12–15 spell out what keeping covenant and mercy will mean in the land.
    sources: [oshb-wlc, nelson-everlasting-covenant, keil-deuteronomy, lds-scriptures]

  - ref: 26
    phrase: lest thou be a cursed thing like it
    kind: history
    title: Taking the devoted thing makes one devoted
    body: |
      Verse 26 warns that an Israelite who takes home what belongs to the LORD's *ḥērem* becomes *ḥērem* himself. “Cursed thing” is the noun of the verb rendered “utterly destroy” in verse 2, and it comes twice in the verse: Israel is not to bring an abomination into the house, “lest thou be a cursed thing like it,” “for it is a cursed thing.” The silver and gold on the idols (verse 25) are not plunder; they belong to what is devoted, and to covet them is to share its fate.

      Joshua tells how it happened ([[Josh. 7:1, 21–26]]). At Jericho, Achan, an Israelite of Judah, kept “a quantity of silver, and a bar of gold” and a fine mantle from what was under the *ḥērem*; Israel was routed at Ai, and “Achan and his family become objects of the ḥērem themselves.” The same story's other side is Rahab, “a Canaanite woman of Jericho who seeks for mercy and obtains it,” whose household was spared when the city fell. On one Latter-day Saint reading the two show that “an important lesson of the ḥērem concerns our attitude toward God”: an Israelite could fall under it and a Canaanite could escape it.
    sources: [oshb-wlc, calabro-herem, lds-scriptures]

christ: |
  The LORD who redeemed Israel “out of the house of bondmen” (verse 8) is Jehovah, the premortal Christ (see the note at [[Ex. 3:14]]). Moses grounds that redemption not in Israel's merit but in His love and His oath (see the note at verse 7), and the covenant love He keeps “to a thousand generations” (verse 9) is open to all who enter covenant with Him (see the note at verse 9). Speaking of these same nations, Nephi says that “the Lord esteemeth all flesh in one; he that is righteous is favored of God” ([[1 Ne. 17:35]]).

explore: |
  - [[Ex. 23:20–33]] and [[Ex. 34:10–16]]: the command first given at Sinai, with the hornet and the slow conquest.
  - [[Deut. 9:1–6]]: “not for thy righteousness,” the companion of verses 7–8.
  - [[Deut. 20:10–18]]: the law of war, and the difference between near and far cities.
  - [[1 Ne. 17:23–40]]: Nephi on the conquest and on whom the Lord loves.
  - [[Josh. 2]]; [[Josh. 6–7]]: Rahab and Achan.
  - “‘Thou Shalt Utterly Destroy’: Understanding the Biblical Ḥērem,” in *From Wilderness to Monarchy* (Religious Studies Center, 2025): the fullest Latter-day Saint study of the command.

