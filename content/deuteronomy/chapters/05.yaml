chapter: 5
title: The Lord Talked with You Face to Face
tagline: Moses tells the children of the wilderness that the covenant of Horeb is theirs, repeats the Ten Commandments, and recalls how their parents asked him to stand between them and God, and how the LORD agreed.
when: 'In the plains of Moab, in the fortieth year after the Exodus (1:3, 5).'

setting: |
  Chapter 5 opens Moses' second address, which runs to the end of chapter 26. It falls into two parts: “5–11, the Ten Commandments and a practical exposition of them,” and “12–26, a code of laws, which forms the nucleus of the whole book.” Moses is speaking in Moab to the generation that grew up in the wilderness ([[Deut. 2:14–16]]); his speeches come “after the less faithful generation had passed away.”

  He begins with the covenant made at Horeb (verse 2; see [[Ex. 3:1]]), and repeats the Ten Commandments of [[Ex. 20:1–17]]. What each commandment means is treated in the notes on Exodus 20, and this page doesn't repeat it. The differences between the two tellings are slight, and in one older reading they “do not materially affect the sense,” though the Sabbath has a different reason here (verse 15). Moses then tells more fully than Exodus does what happened after the voice fell silent ([[Ex. 20:18–21]]).

  As in Exodus, the commandments stand at the head of the laws that follow, and that placement shows “the social/relational nature” of all the law that comes after.

thread: |
  The chapter brings Horeb into the present. “Not with our fathers, but with us, even us, who are all of us here alive this day” (verse 3): the covenant made at Horeb belongs to the people listening now. Moses then speaks the ten words again. The small changes in his wording show, in one older reading, “the rhetorical and hortatory intention” of a sermon, and the largest is a new reason for the Sabbath: remember that you were a servant in Egypt (verse 15).

  The second half of the chapter explains why the laws that follow the ten come through Moses. The people heard God's voice and lived, and they were afraid that if they heard it again they would die. They asked Moses to go near in their place. The LORD agreed. He sent them back to their tents and kept Moses beside Him: “I will speak unto thee all the commandments, and the statutes, and the judgments, which thou shalt teach them” (verse 31). Chapter 6 opens by presenting what follows as that teaching ([[Deut. 6:1]]). The closing exhortation (verses 32–33), to turn neither to the right hand nor to the left, “paves the way for passing to the exposition of the law which follows.”

sections:
  - range: 1-5
    heading: The covenant at Horeb is yours
    plain: |
      Moses called all Israel together and said: “Listen, Israel, to the statutes and judgments I am speaking to you today. Learn them, keep them, and do them. The LORD our God made a covenant with us at Horeb. He did not make it with our fathers only; He made it with us, all of us who are here alive today. The LORD spoke with you face to face on the mountain, out of the fire. I stood between the LORD and you at that time to tell you His word, because you were afraid of the fire and did not go up the mountain. He said:
  - range: 6-21
    heading: The ten words again
    plain: |
      “I am the LORD your God, who brought you out of Egypt, out of the house of bondage. You shall have no other gods before me. You shall not make a carved image or any likeness of anything in heaven, on earth, or in the waters, or bow down to them or serve them, for I the LORD your God am a jealous God. I visit the iniquity of the fathers on the children to the third and fourth generation of those who hate me, and show mercy to thousands of those who love me and keep my commandments. You shall not take the name of the LORD your God in vain.

      “Keep the sabbath day holy, as the LORD your God commanded you. Six days you shall work, but the seventh day is the sabbath of the LORD your God. On it no one shall work: not you, your son or daughter, your servants, your ox, your ass, your cattle, or the stranger living among you, so that your servants may rest as you do. Remember that you were a servant in Egypt, and that the LORD your God brought you out with a mighty hand and an outstretched arm. That is why He commanded you to keep the sabbath day.

      “Honor your father and mother, as the LORD your God commanded you, so that you may live long and that it may go well with you in the land He is giving you. You shall not murder. You shall not commit adultery. You shall not steal. You shall not bear false witness against your neighbor. You shall not desire your neighbor's wife, and you shall not crave your neighbor's house, his field, his servants, his ox, his ass, or anything that is his.”
  - range: 22-33
    heading: Go thou near
    plain: |
      “The LORD spoke these words to your whole assembly on the mountain, out of the fire, the cloud and the thick darkness, with a great voice, and He added nothing more. He wrote them on two tablets of stone and gave them to me.

      “When you heard the voice out of the darkness while the mountain burned, your tribal leaders and elders came to me and said, ‘The LORD our God has shown us His glory and greatness. We have heard His voice out of the fire, and we have seen today that God can speak with a man and the man still lives. But why should we die? This great fire will consume us. If we hear the LORD's voice any more, we will die. Who of all flesh has heard the voice of the living God speaking out of fire, as we have, and lived? You go near and hear everything the LORD our God says, then tell us, and we will listen and do it.’

      “The LORD heard what you said, and He told me, ‘I have heard what this people said to you. Everything they have said is good. If only they had such a heart always, to fear me and keep all my commandments, so that it would go well with them and their children forever! Go tell them to return to their tents. But you stay here by me, and I will tell you all the commandments, statutes and judgments you are to teach them, so they can keep them in the land I am giving them.’

      “So be careful to do what the LORD your God has commanded you. Don't turn aside to the right or to the left. Walk in all the ways He has commanded, so that you may live, so that it may go well with you, and so that you may live long in the land you will possess.”

notes:
  - ref: 3
    phrase: The LORD made not this covenant with our fathers, but with us
    kind: history
    title: Not with our fathers, but with us
    body: |
      Moses tells the people of Moab that the covenant of Horeb was made with them, though the adults who stood at Horeb had died in the wilderness, “until all the generation of the men of war were wasted out from among the host” ([[Deut. 2:14]]). Only those under twenty then were spared, with Caleb and Joshua: the sentence fell on those “from twenty years old and upward,” “save Caleb the son of Jephunneh, and Joshua the son of Nun” ([[Num. 14:29–30]]).

      One older reading explains in two steps how the covenant can be theirs. The “fathers” here are the patriarchs, “neither those who died in the wilderness … nor the forefathers in Egypt.” And “the covenant was made not with the particular individuals who were then alive, but rather with the nation as an organic whole,” so Moses can speak of his hearers as the people who made it. The Hebrew piles up the pronoun (“with us, even us … all of us”) for emphasis.

      The covenant renewed in Moab, to which the Church's footnote on this verse points, reaches further still, to “him that is not here with us this day” ([[Deut. 29:15]]); it is treated at [[Deut. 29:1]].
    sources: [lds-scriptures, keil-deuteronomy]

  - ref: 4
    phrase: The LORD talked with you face to face
    kind: words
    title: Face to face, yet through Moses
    body: |
      “Face to face” says the LORD spoke to the people directly at Horeb, and the next verse says they drew back from it. Verse 4 says the LORD talked with them face to face; verse 5 says Moses stood between, “for ye were afraid by reason of the fire, and went not up into the mount.” Both verses together have been read to mean that the people “were to come before God ‘face to face,’ as the text states, but they did not, instead sending Moses in their stead.”

      Taken strictly, the words suggest seeing, but most readers take them as a figure of speech, “since the Israelites never did see God”; Moses has already said that they “heard the voice of the words, but saw no similitude” ([[Deut. 4:12]]). Even so, later tradition “understood that the Israelites were supposed to have had direct interactions with God in some manner.”

      What Israel was being prepared for at Sinai is told at [[Ex. 19:10]], and why it saw no form at [[Deut. 4:12]].
    sources: [belnap-skinner-sinai, lds-scriptures]

  - ref: 15
    phrase: remember that thou wast a servant in the land of Egypt
    kind: scripture
    title: Keep, remember, and the servant’s rest
    body: |
      Deuteronomy gives the Sabbath a different reason from Exodus, and the wording around it changes too. Exodus ties the day to the Creation; Moses here ties it to Israel's deliverance from Egypt “by the Lord’s ‘mighty hand’ and ‘stretched out arm.’” The two reasons are set side by side at [[Ex. 20:8]].

      Exodus begins “Remember the sabbath day” ([[Ex. 20:8]]); here it is “Keep the sabbath day”, and “remember” comes instead in verse 15, joined to Israel's own bondage. The list of those who rest also grows (“thine ox, nor thine ass, nor any of thy cattle”), and verse 14 gives a purpose Exodus does not: “that thy manservant and thy maidservant may rest as well as thou.” The next words remind Israel that it was once a servant itself.

      Moses uses the same reasoning later in the book. In chapter 15 he frames the year of release “as an extension of the commandment regarding the Sabbath day,” in “much of the same language,” and gives the same reason for freeing a servant: “thou wast a bondman in the land of Egypt, and the LORD thy God redeemed thee” ([[Deut. 15:15]]). Remembering “our captivity and our redemption,” in one reading of that law, moves the redeemed “to act with similar mercy to others.” The year of release is treated at [[Deut. 15:1]].
    sources: [ot-minute-deut-rappleye, lane-redemption, lds-scriptures]

  - ref: 21
    phrase: Neither shalt thou desire thy neighbour’s wife
    kind: words
    title: The wife first, and two verbs
    body: |
      Moses' version of the tenth commandment puts the neighbor's wife first, on her own, and forbids desiring her with a different verb from the one used for his property. In Exodus the house comes first and the wife is listed among what belongs to it ([[Ex. 20:17]]). Here “the ‘neighbour's wife’ is placed first, and then, after the ‘house,’ the field is added,” and instead of repeating the verb *tachmod* (“desire”), a synonym, *titʾavveh*, is used for the rest (the King James “covet”).

      Two older readings weigh the change differently. In one, the order is just the freedom of a speaker, “the freedom with which the decalogue was reproduced,” and the Exodus wording is the original. In the other, Deuteronomy “takes the wife first in a class by herself, then—under another verb, as if to emphasise the difference—gives the rest together.” The second verb is used elsewhere of longing for water or for dainties, “of stronger meaning but apparently intended as only ‘a rhetorical variation.’”

      In the second reading, the tenth commandment is the one that carries the law “from the sphere of action into that of thought and feeling.” How the Savior and Paul read it is at [[Ex. 20:17]].
    sources: [keil-exodus, cambridge-deuteronomy]

  - ref: 28
    phrase: they have well said all that they have spoken
    kind: history
    title: They have well said
    body: |
      The LORD approved the people's request that Moses go near in their place. Exodus tells the request and how “Moses drew near unto the thick darkness where God was,” but not this reply ([[Ex. 20:19–21]]).

      Having said the people spoke well, the LORD grieves over what they lack: “O that there were such an heart in them, that they would fear me, and keep all my commandments always” (verse 29).

      Latter-day revelation dwells on the other side of that day. The Church's footnote on the same request in Exodus points to Doctrine and Covenants 84 (21–26), which speaks of what Israel drew back from at Sinai; that revelation, and what Joseph Smith taught about the request, are treated at [[Ex. 20:19]], and what it says about seeing God and living at [[Ex. 33:20]]. Deuteronomy does not say how the LORD's approval and that drawing back fit together.

      The theme page [Hear Ye Him](/deuteronomy/themes/hear-ye-him/) follows the people's request to the promised prophet of 18:15–19 and to the voice on the mount, “hear ye him.”
    sources: [lds-scriptures]

  - ref: 31
    phrase: stand thou here by me
    kind: history
    title: Everything after the ten comes through Moses
    body: |
      The rest of the law came through Moses because the LORD spoke only the ten commandments to the whole people. After the ten, verse 22 says, “he added no more.” The LORD then sent the people to their tents and kept Moses beside Him to receive “all the commandments, and the statutes, and the judgments,” “which thou shalt teach them.”

      That is how the rest of the address presents itself. The next chapter opens with the same three words: “these are the commandments, the statutes, and the judgments, which the LORD your God commanded to teach you” ([[Deut. 6:1]]). Verse 31 says “that they may do them in the land,” and when the code proper begins ([[Deut. 12:1]]), it frames its laws the same way, as what the Lord requires Israel “to ‘do in the land’—that is, in the promised land.” How Exodus tells the same day is in the note on [[Ex. 20:1]].
    sources: [bowen-law-codes, lds-scriptures]

christ: |
  The LORD who speaks from the fire at Horeb is Jehovah, the premortal Christ (see [[Ex. 3:14]]). The risen Lord told the Nephites, “I am he that gave the law, and I am he who covenanted with my people Israel” ([[3 Ne. 15:5]]).

  The people's request in this chapter led to a promise, the prophecy of a prophet like Moses ([[Deut. 18:15–19]]). Their “rejection of the immediate presence of God and a request for human intermediaries served as the basis for the giving of this prophecy.” Moroni told Joseph Smith that “that prophet was Christ” ([[JS—H 1:40]]). The promise is treated at [[Deut. 18:15]].

explore: |
  - **The same day in Exodus.** [[Ex. 20:18–21]], beside verses 22–31 here.
  - **The prophet who grows out of this request.** [[Deut. 18:15–19]]; [[Acts 3:22–23]]; [[3 Ne. 20:23]].
  - **What Moses sought for Israel.** [[D&C 84:19–27]].
  - **The ten words in the Book of Mormon.** [[Mosiah 12:33–36]]; [[Mosiah 13:11–24]], where Abinadi recites them to the priests of Noah.
  - **The covenant in Moab.** [[Deut. 29:10–15]], made also with those not present that day.

