chapter: 16
title: Before the LORD in the Place He Shall Choose
tagline: Moses sets the three pilgrim feasts at the one place the LORD will choose, with the servant, the Levite, the stranger, the fatherless and the widow at the table, and then sets judges in every town to pursue justice.
when: 'In the plains of Moab, in the fortieth year after the Exodus'

setting: |
  Moses is still speaking in Moab in the fortieth year ([[Deut. 1:3–5]]), in the code of laws that runs from chapter 12 to chapter 26. Chapter 12 named the one place the LORD would choose to set His name (see the note at [[Deut. 12:5]]), and the chapters after it work that rule out: tithes and firstlings, then the holidays of 16:1–17, then the Levites and the cities of refuge. Because every feast had its sacrifices, the feasts “would no longer be celebrated in the various villages, but only at the central altar.”

  The feasts themselves are already known from Exodus and Leviticus: what each was and when it fell is at [[Ex. 23:14]], [[Ex. 12]] and [[Lev. 23]], and the volume guide sets them out in a table ([The Law and the Covenant](/old-testament/guides/law-and-covenant/#feasts)). Deuteronomy takes those laws as known and, in one older reading, repeats only “those points which related to the sacrificial meals held at these festivals”; the Day of Atonement and the feast of trumpets are left out because the people were not required to gather at the sanctuary from the whole land for them.

  Scripture records one Passover kept with special care at the chosen place; the Church's footnote on 16:2 points to it. Josiah commanded it “as it is written in the book of this covenant,” and “there was not holden such a passover from the days of the judges” ([[2 Kgs. 23:21–23]]).

thread: |
  Two phrases carry the feasts. “The place which the LORD shall choose” comes six times in seventeen verses (verses 2, 6, 7, 11, 15, 16), and “rejoice” comes three times (verses 11, 14, 15). Passover, Weeks and Tabernacles are the same journey made three times a year: up to the place where His name is, with an offering “as he is able” (verse 17), to eat and be glad before Him. The Passover remembers the night of the Exodus; Weeks and Tabernacles thank Him for the harvest; and at the two harvest feasts the household's table is set wide, for the servants, the Levite, the stranger, the fatherless and the widow, “and thou shalt remember that thou wast a bondman in Egypt” (verse 12).

  Verse 18 turns to judges, and the turn is less abrupt than it looks. In one older reading, as Israel was to be the LORD's holy nation in its worship, “so was it in its political relations also.” The command to pursue justice ends with the same promise as the feasts, “that thou mayest live, and inherit the land” (verse 20), and on one Latter-day Saint reading that ties the giving of food to the needy to the covenant itself. The last two verses forbid the sacred pole and the standing stone beside the LORD's altar.

sections:
  - range: 1-8
    heading: The Passover at the chosen place
    plain: |
      Keep the month of Abib by holding the Passover to the LORD your God, because in that month He brought you out of Egypt by night. Offer the Passover sacrifices to the LORD your God from your flocks and your herds at the place the LORD will choose to set His name. Eat nothing leavened with them; for seven days eat unleavened bread, the bread of affliction, because you left Egypt in haste. So you will remember the day you came out of Egypt as long as you live. No leaven is to be seen anywhere in your territory for seven days, and none of the meat you sacrifice on the evening of the first day may be left until morning.

      You may not offer the Passover in just any of the towns the LORD your God gives you. Offer it only at the place He chooses to set His name, in the evening as the sun goes down, at the hour you came out of Egypt. Cook it and eat it at the place the LORD your God chooses, and in the morning go back to your tents. For six more days eat unleavened bread, and the seventh day is a solemn assembly to the LORD your God; do no work on it.
  - range: 9-12
    heading: The feast of weeks
    plain: |
      Count seven weeks, starting from the day you first put the sickle to the standing grain. Then keep the feast of weeks to the LORD your God, bringing a freewill offering from your hand in proportion to how the LORD your God has blessed you. Rejoice before the LORD your God at the place He has chosen to set His name, you and your son and daughter, your manservant and maidservant, the Levite in your towns, and the stranger, the fatherless and the widow who live among you. Remember that you were a slave in Egypt, and be careful to keep these statutes.
  - range: 13-15
    heading: The feast of tabernacles
    plain: |
      Keep the feast of tabernacles for seven days once you have gathered in your grain and your wine. Rejoice at your feast, you and your son and daughter, your servants, and the Levite, the stranger, the fatherless and the widow in your towns. For seven days keep the feast to the LORD your God at the place He chooses, because the LORD your God will bless you in all your harvest and all your work; so be truly glad.
  - range: 16-17
    heading: Three times a year, not empty-handed
    plain: |
      Three times a year all your men are to appear before the LORD your God at the place He chooses: at the feast of unleavened bread, the feast of weeks and the feast of tabernacles. No one is to come before the LORD empty-handed. Each is to give what he can, in proportion to the blessing the LORD your God has given him.
  - range: 18-20
    heading: Judges in every town
    plain: |
      Appoint judges and officers in every town the LORD your God gives you, tribe by tribe, and they are to judge the people justly. Do not bend justice, do not favor anyone, and do not take a bribe, because a bribe blinds the eyes of the wise and twists the words of the righteous. Justice, and only justice, you shall pursue, so that you may live and possess the land the LORD your God is giving you.
  - range: 21-22
    heading: No pole or pillar by His altar
    plain: |
      Do not set up a sacred pole, an asherah of any kind of wood, beside the altar you make for the LORD your God. And do not set up a sacred pillar, which the LORD your God hates.

notes:
  - ref: 3
    phrase: even the bread of affliction
    kind: symbol
    title: The bread of affliction
    body: |
      The unleavened bread is called the bread of affliction because it was the bread of the flight from oppression. The Hebrew word (*ʿoni*) means “affliction, poverty,” and it is the word for the affliction the LORD saw in Egypt ([[Ex. 3:7]]; [[Deut. 26:7]]). The verse gives its own reason, “for thou camest forth out of the land of Egypt in haste”: there was no time to let the dough rise ([[Ex. 12:39]]). The verse ends on its purpose: “that thou mayest remember the day … all the days of thy life.”
    sources: [bdb, lds-scriptures]

  - ref: 5
    phrase: Thou mayest not sacrifice the passover within any of thy gates
    kind: history
    title: From the household to the chosen place
    body: |
      The Passover, first kept in each house in Egypt, is to be kept in the land only at the place the LORD chooses. In Egypt, as one older reading puts it, Israel “had as yet no sanctuary and no common altar,” so “the different houses necessarily served as altars.” Once there is an altar, the lamb is killed, cooked and eaten there (verses 6–7), and the same reading holds that the blood on the doorposts “was tacitly abolished, since the blood was to be sprinkled upon the altar.” Going “unto thy tents” in the morning (verse 7) would then mean the pilgrims' lodgings near the sanctuary, not home, since the feast goes on for six more days (verse 8).

      Every feast changed the same way. Because sacrifice was part of each of them, they “would no longer be celebrated in the various villages, but only at the central altar at the temple after it had been established.” The Passover Josiah commanded “was holden to the Lord in Jerusalem” ([[2 Kgs. 23:23]]). Which place the LORD chose, and why only one, is the subject of [[Deut. 12:5]].
    sources: [keil-deuteronomy, seely-lehi-altar, lds-scriptures]

  - ref: 7
    phrase: roast
    kind: words
    title: Roast, boil, or cook
    body: |
      The verb here is *bashal*, whose first sense is “boil,” though it can mean “cook” in general. Exodus forbids the Passover lamb to be eaten “sodden at all with water, but roast with fire” ([[Ex. 12:9]]), so a reader of the Hebrew can ask whether Deuteronomy now allows boiling. The lexicon puts this verse under the general sense, “cook,” and compares Exodus 12:8–9, which sets roasting with fire against boiling in water, and [[2 Chr. 35:13]], where the verb is used with “fire”: “they roasted the passover with fire according to the ordinance.” A modern translation has “You shall cook it and eat it.” Read that way, the verse says where the lamb is cooked and eaten, at the chosen place, and leaves Exodus to say how.
    sources: [oshb-wlc, bdb, nrsvue, lds-scriptures]

  - ref: 11
    phrase: the stranger, and the fatherless, and the widow, that are among you
    kind: history
    title: Who eats at the feast
    body: |
      At the two harvest feasts the household's table includes those who had no harvest of their own: the Levite, who had no land, and the stranger, the fatherless and the widow. The verse after gives the reason: “thou shalt remember that thou wast a bondman in Egypt” (verse 12). Those in need “were to come to the festivals and were to receive the gathered food as part of the festivities,” and rejoicing together “brought those groups into their households and families, providing a sense of unity and belonging that was likely just as important as the food was.” The empathy Israel had learned as strangers in Egypt ([[Ex. 23:9]]) “could be expressed” at the feasts.

      The list comes at Weeks and Tabernacles (verses 11, 14), and “the instruction says nothing about including the stranger” at the Passover; who might eat the Passover is set out at [[Ex. 12:43–48]]. Chapter 12 has already set the Levite at the table of the holy offerings ([[Deut. 12:12]]).
    sources: [muhlestein-love-neighbor, belnap-outcasts]

  - ref: 18
    phrase: Judges and officers shalt thou make thee in all thy gates
    kind: history
    title: Judges in every town
    body: |
      Moses provides for courts in every town of the land; the verse gives no reason, and the Sinai arrangement is the background. There Jethro's counsel had set judges over thousands, hundreds, fifties and tens, with Moses to take the hard cases to God ([[Ex. 18:21–26]]; retold at [[Deut. 1:9–18]]). In one older reading that arrangement worked while Israel was one camp, but not “when Israel would no longer possess a prophet and mediator like Moses,” scattered “in the towns and villages of the whole land.” The same reading takes the people to choose the judges “just as was done at Sinai” (compare [[Deut. 1:13]]) and finds the new thing here in one point: “every place was to have its own judges and officers.” The officers (*shoterim*, literally “writers”) were “secretaries and advisers of the judges,” not only court servants.

      “In all thy gates” means in every town, and the city gate was where such business was done: it was “often a place for public business,” and Amos found it corrupted (see the note at [[Amos 5:12]]). Verse 19 repeats the law of [[Ex. 23:6–8]]: a modern translation reads “you must not accept a bribe, for a bribe blinds the eyes of the wise.” The God who gives the law “regardeth not persons, nor taketh reward” ([[Deut. 10:17]]; see the note on the next verse there). The higher court at the sanctuary follows in [[Deut. 17:8–13]].
    sources: [keil-deuteronomy, bd-gate, nrsvue, lds-scriptures]

  - ref: 20
    phrase: That which is altogether just shalt thou follow
    kind: words
    title: Justice, justice
    body: |
      The Hebrew says the word twice, *tsedeq tsedeq*, justice, justice, and the King James renders the doubled word as “altogether just”; a modern translation has “Justice, and only justice, you shall pursue.” The word is the one used of judges in verse 18 (“just judgment”), and the verb behind “follow” is the verb for pursuing, used here in its figurative sense, to “follow after, aim to secure.”

      The verse closes with a promise, “that thou mayest live, and inherit the land,” and on one Latter-day Saint reading it ties the giving of food to those in need to the covenant: Israel, “and especially their leaders, should do all of this justly.”
    sources: [oshb-wlc, bdb, nrsvue, muhlestein-love-neighbor]

  - ref: 22
    phrase: Neither shalt thou set thee up any image
    kind: history
    title: A pillar, or a graven image
    body: |
      The “image” is a standing stone, and the Joseph Smith Translation narrows it to a “graven image.” The Hebrew *matstsevah* is a sacred stone or pillar set up beside an altar; Moses himself set up twelve beside the altar at Sinai ([[Ex. 24:4]]), and Jacob set one up at Bethel ([[Gen. 28:18]]), but Deuteronomy condemns them for Israel. The Joseph Smith Translation “qualifies the kind of image set up”: “Neither shalt thou set thee up any graven image; which the Lord thy God hateth.” Why a law would forbid what Jacob did at Bethel is taken up at [[Gen. 35:14]].
    sources: [bdb, horton-jst-pentateuch]

christ: |
  The Lord kept these feasts at the place this chapter names. “His parents went to Jerusalem every year at the feast of the passover” ([[Luke 2:41]]); He went up to the feast of tabernacles ([[John 7:2–10]]); and He kept His last Passover there, “when Jesus knew that his hour was come that he should depart out of this world unto the Father” ([[John 13:1]]). He was crucified on “the preparation of the passover” ([[John 19:14]]), and Paul names Him in its terms: “Christ our passover is sacrificed for us” ([[1 Cor. 5:7]]; the lamb is at [[Ex. 12:5]], and what the other feasts became in Him is with [[Lev. 23]]). The Holy Ghost was given at Jerusalem on the day of Pentecost ([[Acts 2:1–4]]), the feast that Deuteronomy calls “the feast of weeks.”

  The LORD who chooses the place is Jehovah, the premortal Christ (see the note at [[Ex. 3:14]]): He gave the law of the feasts, and He fulfilled it ([[3 Ne. 15:5]]).

explore: |
  - [[Ex. 12]] and [[Lev. 23]]: the first Passover and the whole calendar of holy days.
  - [[2 Chr. 35:1–19]]: Josiah's Passover kept at the chosen place.
  - [[Ex. 18:13–26]] and [[Deut. 1:9–18]]: the first judges, and the charge Moses gave them.
  - [[Deut. 17:8–13]]: the higher court at the place the LORD will choose.
  - [The Law and the Covenant](/old-testament/guides/law-and-covenant/#feasts): the feasts in a table.

