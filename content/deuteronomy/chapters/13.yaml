chapter: 13
title: The Lord Your God Proveth You
tagline: Three laws against enticement to other gods, from a prophet whose sign comes true, from the nearest of kin in secret, and from a whole city, each answered with death, because Israel's love for the LORD who redeemed it is being proved.
when: 'In the plains of Moab, in the fortieth year after the Exodus'

setting: |
  Moses is still speaking in Moab in the fortieth year ([[Deut. 1:3]]), early in the code of laws that runs from chapter 12 to chapter 26. The code's first group of laws concerns worship, and it begins by ordering every idolatrous object in Canaan destroyed. Chapter 13 deals with someone “among you” who urges, “Let us go after other gods.” Few things threatened the community more: “In addition to idolatry and foreign cults, perhaps nothing threatened communal integrity and survival as much as false prophets.”

  The Hebrew Bible numbers this chapter one verse ahead of the King James (verse 17 is Hebrew verse 18); references here are to the King James numbering.

  Later scripture reads these laws at two important points. One Latter-day Saint study reads Mormon's account of the fall of Ammonihah as following the law of the apostate city in verses 12–18 (the note at verse 16). And the leaders who thought Jesus a deceiver “used the law in Deuteronomy as their legal justification for killing Christ” (the Witness of Christ, below).

thread: |
  The chapter is three cases, each opening with “if” (verses 1, 6, 12). The first tempter is a prophet or dreamer whose sign comes true (verses 1–5). The second is the nearest of kin, a brother, son, daughter, wife, or a friend “which is as thine own soul,” whispering in secret (verses 6–11): in one older reading, “the power of love and relationship, which flesh and blood find it hard to resist,” is set here against the claimed divine authority of the first case. The third is a whole town drawn away by worthless men (verses 12–18).

  Every case carries the same invitation, “Let us go … and serve other gods, which thou hast not known” (verses 2, 6, 13), and the same answer, death. The chapter gives its reasons as it goes: the LORD is proving whether Israel loves Him “with all your heart and with all your soul” (verse 3, the words of [[Deut. 6:5]]); the tempter would turn Israel from the God who “brought you out of the land of Egypt” (verses 5, 10); “all Israel shall hear, and fear” (verse 11); and the LORD will turn from His anger and multiply Israel (verse 17). The law also sets limits. The town is judged only after Israel will “inquire, and make search, and ask diligently” (verse 14), and the tempted relative's hand is first on the condemned (verse 9).

sections:
  - range: 1-5
    heading: A prophet whose sign comes true
    plain: |
      Suppose a prophet or a dreamer of dreams arises among you and promises you a sign or a wonder, and the sign or wonder happens, and he says, “Let us follow other gods you have not known, and serve them.” Do not listen to that prophet or dreamer. The LORD your God is testing you, to know whether you love Him with all your heart and all your soul. Follow the LORD your God; fear Him, keep His commandments, obey His voice, serve Him and hold fast to Him. That prophet or dreamer is to be put to death, because he spoke to turn you away from the LORD your God, who brought you out of Egypt and redeemed you from slavery, and to push you off the path He commanded you to walk. So you will purge the evil from among you.
  - range: 6-11
    heading: The tempter in your own house
    plain: |
      Suppose your brother, your own mother's son, or your son or daughter, or the wife you embrace, or the friend who is as dear to you as your own life, entices you in secret: “Let us go and serve other gods,” gods neither you nor your fathers have known, gods of the peoples around you, near or far, from one end of the earth to the other. Do not give in or listen. Do not pity him, spare him, or hide what he has done. He must be put to death: your hand is to be the first against him, and then the hands of all the people. Stone him to death, because he tried to draw you away from the LORD your God, who brought you out of Egypt, out of slavery. Then all Israel will hear and be afraid, and no one among you will do such a wicked thing again.
  - range: 12-18
    heading: A city drawn after other gods
    plain: |
      If you hear it said of one of the cities the LORD your God gives you to live in that worthless men have gone out from among you and led its people astray, saying, “Let us go and serve other gods you have not known,” then inquire, search it out, and ask carefully. If it proves true and certain that this abomination has been done among you, strike the people of that city with the sword and devote it to destruction, everything in it and its cattle. Gather all its goods into the middle of its square and burn the city and everything taken from it, the whole of it, for the LORD your God. It is to be a ruin mound forever and never rebuilt. Keep none of the devoted things in your hand, so that the LORD may turn from His fierce anger, show you mercy, have compassion on you and multiply you, as He swore to your fathers, if you listen to the LORD your God, keep all His commandments that I give you today, and do what is right in His eyes.

notes:
  - ref: 1
    phrase: giveth thee a sign or a wonder
    kind: history
    title: A sign that comes true does not prove the prophet
    body: |
      The law grants that a false prophet's sign may really happen, and it still forbids Israel to follow him; what condemns him is his message, “Let us go after other gods” (verse 2). The passage “indicates that unauthorized mantic ‘prophet[s]’ or ‘dreamer[s] of dreams’ could, in fact, effect signs and wonders” to push Israel away from the LORD. The pairing of prophet and dreamer, in one older reading, matches the two ways the LORD said He would speak to a prophet, “in a vision” and “in a dream” ([[Num. 12:6]]); the pairing is of two recognized means of revelation.

      The same older reading draws the lesson that signs were never the final test: even true prophets' words “were to be judged according to the standard of the fixed word of God that had been already given.” Deuteronomy gives a second test later, for a prophet who speaks in the LORD's name: whether what he says comes to pass ([[Deut. 18:22]]). That test was put to Hananiah in Jerusalem near the time Lehi left (see [[Jer. 28:9]]).
    sources: [bowen-law-codes, keil-deuteronomy, sc-knowhy-554]

  - ref: 3
    phrase: the LORD your God proveth you
    kind: history
    title: Why the LORD lets a false sign succeed
    body: |
      Moses gives the reason himself: the successful sign is a test of whether Israel loves the LORD with the whole heart. Deuteronomy presents several experiences this way. In one Latter-day Saint study, the forty years in the wilderness and the manna ([[Deut. 8:2, 16]]) and “even the possibility of a prophet whose signs come to pass but who would lead the people to idolatry are all presented as tests” of Israel's heart, as God tested Abraham with Isaac ([[Gen. 22:1]]).

      Restoration scripture sets the same idea at the heart of mortal life. Of the spirits who would come to earth the Lord said, “we will prove them herewith, to see if they will do all things whatsoever the Lord their God shall command them” ([[Abr. 3:25]]), and one Latter-day Saint study reads verse 3 in that light: “Mortal existence, after all, constitutes a ‘probationary state.’” What is proved in verse 3 is love, and verse 4 lists what that love does: walk after Him, fear Him, keep His commandments, obey His voice, serve Him, “and cleave unto him.”
    sources: [calabro-herem, bowen-law-codes]

  - ref: 5
    phrase: So shalt thou put the evil away from the midst of thee
    kind: history
    title: Put the evil away
    body: |
      This line, which closes the law against the false prophet, is Deuteronomy's recurring reason for a death sentence: Israel must purge the evil from among itself. The verb is *biʿartā*, from a root meaning “to burn”; used figuratively it means to “consume, utterly remove,” said “particular of evil and guilt.” The same formula, or a close variant of it, ends laws in five later chapters ([[Deut. 17:7, 12]]; [[Deut. 19:13, 19]]; [[Deut. 21:21]]; [[Deut. 22:21–24]]; [[Deut. 24:7]]); those chapters point back here.

      Verse 5 names the offense: the prophet “hath spoken to turn you away from the LORD your God, which brought you out of the land of Egypt, and redeemed you out of the house of bondage.”
    sources: [bdb, oshb-wlc]

  - ref: 9
    phrase: thine hand shall be first upon him to put him to death
    kind: history
    title: Thine hand shall be first upon him
    body: |
      The relative who hears the secret invitation is to act first, and the law of witnesses later in the book shows what that means. There “the hands of the witnesses shall be first upon him to put him to death, and afterward the hands of all the people” ([[Deut. 17:7]]), and no one is to die “at the mouth of one witness” ([[Deut. 17:6]]). In one older reading, verse 9 presupposes that procedure, with the witnesses casting “the first stones at the person condemned.”

      The temptation comes “secretly” (verse 6), so “the fact might be hidden from others”; “neither shalt thou conceal him” (verse 8) closes that door. The law's own reason follows: “all Israel shall hear, and fear” (verse 11). The same older reading takes that fear as what the penalty produces, not the principle the law rests on.
    sources: [keil-deuteronomy]

  - ref: 13
    phrase: the children of Belial
    kind: words
    title: The children of Belial
    body: |
      “Children of Belial” means worthless or wicked men. The Hebrew *bene beliyyaʿal*, “sons of worthlessness,” uses a noun made of *beli*, “without,” and *yaʿal*, “worth, use, profit.” The phrase returns for the men of Gibeah, Eli's sons and Nabal ([[Judg. 19:22]]; [[1 Sam. 2:12]]; [[1 Sam. 25:17]]). Paul sets Belial against Christ: “what concord hath Christ with Belial?” ([[2 Cor. 6:15]]).
    sources: [bd-belial, bdb, oshb-wlc]

  - ref: 15
    phrase: destroying it utterly
    kind: history
    title: An Israelite city under the ban
    body: |
      An Israelite town that turned to other gods was to be devoted to the LORD by destruction, the *ḥērem* explained at [[Deut. 7:2]], the word used of the Canaanite cities. Israelites guilty of idolatry could themselves fall under the *ḥērem* ([[Ex. 22:20]]; [[Josh. 7:12]]), and this law applies it to a whole town, sparing nothing. In the conquest, “only Jericho seems to get the most extreme form of destruction,” with the people and livestock killed, the city burned and its rebuilding forbidden, “just like the treatment of an apostate Israelite city.”

      The “cursed thing” of verse 17 is the same word, *ḥērem*: things assigned to the LORD's ownership and so “off-limits to humans.” Keeping any of it would bring the LORD's anger, as Achan's keeping of devoted things did ([[Josh. 7:1]]). The law also sets a limit before any of this: the report must be searched out until it is “truth, and the thing certain” (verse 14), an inquiry “to determine if the city had truly gone apostate.”
    sources: [calabro-herem, ot-manual-dt-1-16, sc-knowhy-123]

  - ref: 16
    phrase: it shall be an heap for ever; it shall not be built again
    kind: scripture
    title: Ammonihah, a heap and a desolation
    body: |
      One Latter-day Saint study reads the fall of Ammonihah, the Nephite city destroyed by the Lamanites in a single day, as the Book of Mormon's case of the end verses 12–18 describe. The study notes that “the Bible does not report that any Israelite cities, or their people or cattle actually were destroyed pursuant to this law,” and argues that the Book of Mormon “likely does.”

      On that reading the points of the law can be traced in Alma's account. Men had gone out from Zarahemla, and the city had “withdrawn” from Nephite rule. Alma, as high priest, went in person to inquire (verse 14), with Amulek as the needed second witness ([[Deut. 17:6]]). Alma echoed verse 15 when he warned that the Lord “will utterly destroy you from off the face of the earth” ([[Alma 9:12]]). And when the city fell, “every living soul of the Ammonihahites was destroyed, and also their great city,” and no one went in to possess the land “for many years” ([[Alma 16:9–11]]). Alma had given up the judgment-seat and could not carry out the sentence; the Lamanites did. The same study also sees mercy in the story: the Lord had long spared the city for the prayers of its few righteous.
    sources: [sc-knowhy-123]

christ: |
  This chapter's law was turned against Jesus. Verses 1–5 required death for anyone who gave “signs” and used them to lead people into what some might consider apostasy, and those who thought Jesus “deceived the people” used that law to justify His death. John records the charge: “others said, Nay; but he deceiveth the people” ([[John 7:12]]); after the Crucifixion the chief priests still called Him “that deceiver” ([[Matt. 27:63]]). The One accused under this law was the LORD who gave it, Jehovah (see the note at [[Ex. 3:14]]), and the God who “redeemed you out of the house of bondage” (verse 5).

  Jesus also warned of the last days: “there shall arise false Christs, and false prophets, and shall shew great signs and wonders” ([[Matt. 24:24]]), so that if possible they would deceive “the very elect, who are the elect according to the covenant” ([[JS—M 1:22]]), words one study sets beside Deuteronomy 13:1–5.

explore: |
  - [[Deut. 18:15–22]]: the prophet like Moses, and the second test of a prophet.
  - [[Jer. 28:1–17]]: Hananiah, a prophet whose word did not come to pass.
  - [[Josh. 7:1–26]]: Achan and the devoted things.
  - [[Alma 8:6–16:11]]: Ammonihah, from Alma's first visit to the city's fall.
  - [[Matt. 24:23–26]]: false Christs and false prophets with signs.

