chapter: 34
title: There Arose Not a Prophet Since in Israel like unto Moses
tagline: Moses climbs Nebo and is shown the whole land he will not enter; the LORD takes him, Israel mourns thirty days, Joshua leads, and the book closes by measuring Moses against every prophet after him.
when: 'On Mount Nebo, above the plains of Moab, in the fortieth year after the Exodus'

setting: |
  Moses has finished speaking. The LORD had told him to climb “unto mount Nebo, which is in the land of Moab, that is over against Jericho” and look at Canaan before he died ([[Deut. 32:49–50]]), and he has given the tribes his last blessing (chapter 33). Chapter 34 tells what happened next, in the third person: “Deuteronomy concludes with a short note on Moses's death and the passing of authority to Joshua.”

  Moses is not the narrator here. Latter-day revelation names him as the author of the five books, and the account of his death in 34:5–12 is held to have been added by a later hand (see chapter 1's `setting`, [[Deut. 1:1]]). The chapter heading describes Moses as “taken by the Lord.”

  The chapter closes Deuteronomy and the five books of Moses, and its last verses look back over his whole ministry, from the signs in Egypt to the great deeds done “in the sight of all Israel.” Later scripture takes Moses' story further than this chapter does (see the note on verse 5).

thread: |
  The LORD shows Moses the land promised to Abraham, Isaac and Jacob, from Dan in the north to Zoar in the south, and repeats the refusal: “thou shalt not go over thither” (verse 4; why is told at [[Deut. 3:26]]). Moses dies “according to the word of the LORD,” and no one knows where he lies. Israel mourns thirty days, as it had mourned for Aaron ([[Num. 20:29]]), and then listens to Joshua, on whom Moses had laid his hands.

  The last three verses are an epitaph. Joshua has the spirit of wisdom and the people's obedience, but “there arose not a prophet since in Israel like unto Moses, whom the LORD knew face to face.” That line sits uneasily beside the promise of [[Deut. 18:15]], that the LORD would raise up a prophet like Moses, and the book ends with that prophet not yet come. The note on verse 10 gives one reading of how the two fit.

sections:
  - range: 1-6
    heading: Moses the servant of the LORD died there
    plain: |
      Moses went up from the plains of Moab to Mount Nebo, to the top of Pisgah, across from Jericho. The LORD showed him the whole land: Gilead as far as Dan; all of Naphtali, the land of Ephraim and Manasseh, and all of Judah as far as the western sea; the south; and the plain of the valley of Jericho, the city of palm trees, as far as Zoar. The LORD said to him, “This is the land I swore to Abraham, Isaac and Jacob that I would give to their descendants. I have let you see it with your own eyes, but you will not cross over into it.”

      So Moses, the servant of the LORD, died there in the land of Moab, as the LORD had said. He buried him in a valley in the land of Moab, across from Beth-peor, but no one knows where his grave is to this day (on what the Joseph Smith Translation and the Book of Mormon say, see the notes on verses 5 and 6).
  - range: 7-8
    heading: An hundred and twenty years old
    plain: |
      Moses was a hundred and twenty years old when he died; his eyes were not dim and his vigor had not left him. The children of Israel wept for Moses in the plains of Moab for thirty days, and then the days of weeping and mourning for him were over.
  - range: 9-12
    heading: Not a prophet since like unto Moses
    plain: |
      Joshua the son of Nun was full of the spirit of wisdom, because Moses had laid his hands on him, and the children of Israel listened to him and did what the LORD had commanded Moses. But no prophet has arisen in Israel since then like Moses, whom the LORD knew face to face: none like him in all the signs and wonders the LORD sent him to do in Egypt against Pharaoh, all his servants and all his land, and in all the mighty power and the awesome deeds Moses did before the eyes of all Israel.

notes:
  - ref: 1
    phrase: the LORD shewed him all the land
    kind: history
    title: The land from Nebo
    body: |
      From Nebo Moses was shown the whole promised land, named in a sweep from the far north to the far south. Nebo is “a group of hills west of Heshbon, in the land of Moab” that “overlook the Jordan, with mounts Gerizim, Tabor, and Hermon in the far distance.” The hills rise some 2,634 feet above sea level, and “Nebo and the top (or head) of Pisgah may be two names of the same peak.” The climb answers the LORD's command at [[Deut. 32:49]] and the promise of [[Deut. 3:27]] that Moses would see the land from Pisgah, from which Balaam also saw the land ([[Num. 23:14]]).

      The list runs from Gilead and Dan in the north, across the tribes west of the Jordan to the western sea, and down to the Negev, Jericho and Zoar “at the southern extremity of the Dead Sea.” Could anyone see all that from one hilltop? The text says only that “the LORD shewed him.” The view that Moses saw the land with his bodily eyes holds that it “was not an ecstatic vision, but a sight with the bodily eyes, whose natural power of vision was miraculously increased by God.”

      Verse 4 then gives the LORD's own words over the view, the oath to Abraham, Isaac and Jacob and the refusal: Moses may see the land “with thine eyes” but not enter it. Why he was kept out is explained at [[Deut. 3:26]].
    sources: [bd-nebo, bd-pisgah, keil-deuteronomy, lds-scriptures]

  - ref: 5
    phrase: So Moses the servant of the LORD died there
    kind: scripture
    title: Died, or translated?
    body: |
      The verse says Moses died; the Church teaches that he was translated, one of those “changed so that they do not experience pain or death until their resurrection to immortality,” and the evidence is what later scripture shows him doing. At the Transfiguration “there appeared unto them Moses and Elias talking with him” ([[Matt. 17:3]]), and Moses came “in company with Elijah” to bestow keys of the priesthood on Peter, James and John. “From this event, which occurred before the Resurrection of Jesus, we understand that Moses was a translated being and had not died as reported in Deut. 34.”

      The argument rests on Moses' need for a body. Since no one had yet been resurrected, Moses needed “a body of flesh and bones at the time of the Transfiguration”; “had he been a spirit only, he could not have performed the work on the mount of giving the keys to the mortal Peter, James, and John” (compare [[D&C 129]]). His ministry “extended beyond the limits of his own mortal lifetime,” and it reached this dispensation too: in the Kirtland Temple on April 3, 1836, Moses “committed unto us the keys of the gathering of Israel from the four parts of the earth” ([[D&C 110:11]]).

      “According to the word of the LORD” points back to the command on Nebo, “die in the mount whither thou goest up” ([[Deut. 32:50]]). The Joseph Smith Translation keeps the word “died”; its change comes in the words about the burial (see the note on verse 6).
    sources: [bd-moses, gs-translated-beings, jsp-ot2, lds-scriptures]

  - ref: 6
    phrase: And he buried him
    kind: history
    title: Who buried Moses
    body: |
      The Hebrew verb is singular, “he buried him,” and the text does not name who “he” is; the Joseph Smith Translation has the LORD take Moses rather than bury him. The verb can mean simply that Moses was buried, and the Greek translation reads “they buried him.” Another reading takes Jehovah as the subject, because of the words that follow: “such a rendering is precluded by the statement which follows, ‘no man knoweth of his sepulchre unto this day.’”

      In Joseph Smith's manuscript the passage reads: “for the Lord took him unto his Fathers, in a valley in the land of Moab, over against Bethpeor; therefore no man knoweth of his sepulchar unto this day.” The change may hint “more strongly” at translation, and the Book of Mormon also says that “the Lord took” Moses. When Alma disappeared, “the saying went abroad in the church that he was taken up by the Spirit, or buried by the hand of the Lord, even as Moses. But behold, the scriptures saith the Lord took Moses unto himself” ([[Alma 45:19]]). As with Moses, Alma's leaving “led to later speculation about what really happened.”

      Josephus's account implies that Moses was translated. He wrote that as Moses was still talking with Eleazar and Joshua “a cloud stood over him on the sudden, and he disappeared in a certain valley, although he wrote in the holy books that he died, which was done out of fear, lest they should venture to say that, because of his extraordinary virtue, he went to God.”
    sources: [oshb-wlc, lxx-rahlfs, keil-deuteronomy, jsp-ot2, horton-jst-pentateuch, ot-minute-deut-rappleye, lds-scriptures]

  - ref: 7
    phrase: Moses was an hundred and twenty years old
    kind: symbol
    title: Three forties
    body: |
      Moses' age at death is “a symbolic number that represented three times forty,” and his life divides into three periods. Stephen marks the first two: Moses was “full forty years old” when he went out to his brethren ([[Acts 7:23]]), and “when forty years were expired” the LORD appeared to him in the bush ([[Acts 7:30]]). He was “fourscore years old” when he spoke to Pharaoh ([[Ex. 7:7]]), and the last forty were the wilderness. The three periods are described as “forty years as prince,” “forty years as pastor or shepherd,” and “forty years as prophet.”

      The second half of the verse says the years had not worn him out. “Natural force” renders a Hebrew word meaning “moisture, freshness (i.e. force, vigour)”: “his freshness had not fled.”
    sources: [ot-minute-deut-rappleye, bdb, lds-scriptures]

  - ref: 9
    phrase: for Moses had laid his hands upon him
    kind: history
    title: Joshua ordained
    body: |
      Joshua led because Moses had laid his hands on him at the LORD's command. In Numbers the LORD told Moses, “Take thee Joshua the son of Nun, a man in whom is the spirit, and lay thine hand upon him” ([[Num. 27:18]]), and “thou shalt put some of thine honour upon him, that all the congregation of the children of Israel may be obedient” ([[Num. 27:20]]). Verse 9 uses its own words for the people's response: they “hearkened unto him.”

      Joshua had long stood beside Moses. When the LORD spoke to Moses “face to face” in the tabernacle, Joshua was the young man who “departed not out of the tabernacle” ([[Ex. 33:11]]).
    sources: [lds-scriptures]

  - ref: 10
    phrase: whom the LORD knew face to face
    kind: scripture
    title: Like unto Moses
    body: |
      The book's final description of Moses rests on two things: the LORD knew him face to face (verse 10), and He did the signs of the Exodus through him (verses 11–12). Scripture repeatedly describes Moses as known face to face. “The Lord spake unto Moses face to face, as a man speaketh unto his friend” ([[Ex. 33:11]]); other prophets receive visions and dreams, but “with him will I speak mouth to mouth, even apparently, and not in dark speeches; and the similitude of the Lord shall he behold” ([[Num. 12:8]]). The Book of Moses also describes Moses seeing God face to face: Moses “saw God face to face, and he talked with him, and the glory of God was upon Moses” ([[Moses 1:2]]).

      Set beside the promise of [[Deut. 18:15–18]], the verse “may seem like a contradiction, especially since earlier, Moses was promised that the Lord would raise up a prophet like him.” One reading is that “like” is used in more than one sense: “The passage at the end of the Torah visibly means that no other prophet was as great as Moses. It is simply a linguistic matter: the range of expression ‘to be like someone’ is wide enough to have two meanings (and several more).” How later prophets were drawn in Moses' likeness, and how Jesus fulfilled the promise “in the full and complete sense,” is explained at [[Deut. 18:18]].

      The theme page [Hear Ye Him](/deuteronomy/themes/hear-ye-him/) follows the promise left open here to the Son.
    sources: [lds-scriptures, ot-minute-deut-rappleye]

christ: |
  The promise this chapter leaves open, a prophet like Moses, scripture says was fulfilled in Jesus Christ: “I am he of whom Moses spake” ([[3 Ne. 20:23]]; see the note on [[Deut. 18:15]]). In the Book of Moses the LORD told Moses, “thou art in the similitude of mine Only Begotten” ([[Moses 1:6]]); Exodus's theme [Moses the Mediator](/exodus/themes/moses-the-mediator/#prophet) follows that likeness to the Savior.

  The man whose grave no one could find stood beside Jesus on the mount, “talking with him” ([[Matt. 17:3]]), and that meeting is the reason the Church gives for believing Moses was translated (see the note on verse 5). Moses' successor has a name the Savior also bears in one of its forms: “Jesus” is one of the forms of Joshua's name, and the King James New Testament calls Joshua “Jesus” at [[Heb. 4:8]].

explore: |
  - [[Deut. 32:48–52]]: the LORD's command to climb Nebo, and the reason given there.
  - [[Num. 27:12–23]]: Moses shown the land and asking for a shepherd for Israel; Joshua's ordination.
  - [[Matt. 17:1–9]] and [[D&C 110:11]]: Moses' ministry after Nebo.
  - [[Moses 1]]: what “face to face” meant for Moses, in Restoration scripture.
  - [[Josh. 1:1–9]]: the LORD's first words to Joshua after Moses.

