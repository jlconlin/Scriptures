summary: >-
  Deuteronomy is Moses' farewell on the plains of Moab, with the promised land in sight
  and the Jordan not yet crossed. Its quiet center is the land held out to a people who
  must choose to love the Lord and live, and the book ends on the mountain where Moses
  is shown all of it and goes no further. It points to Jehovah, the Savior, who is
  Israel's life and the prophet like unto Moses.
motifs:
  - "Primary: a bare, natural limestone outcrop on the summit of a mountain, empty and open to the west, looking out over the whole land spread below (Deut. 34:1–4)."
  - "Primary, with the outcrop: a small natural spring seeping out of a crack in that rock and running away as one brook, always on the right-hand side of the path, down into the green land (Deut. 8:15; 32:4; 1 Cor. 10:4)."
  - "Supporting: a footpath leading down from the summit that divides at a plain Y into two separate tracks, the right one going on beside the brook toward the green, the left one toward dry and barren ground (Deut. 30:19)."
  - "Supporting: a woven basket of grain and fruit set on a flat stone beside the right-hand track, where it reaches the green (Deut. 26:2)."
composition: >-
  A wide landscape at evening from a bare mountaintop. The lower right foreground is a
  rough, weathered limestone outcrop, as nature left it: a few large rounded, fissured
  boulders of bedrock, no straight edges, nothing cut or built, and no one on it. From a
  dark crack low in this rock, water seeps out as a quiet natural spring: it wells into one
  small irregular pool among the stones and spills over the pool's lip as a single narrow
  brook. There is no waterfall, spout or fountain. A dirt path starts at the bottom center
  of the picture, to the left of the pool, and runs away from the viewer down the slope.
  The brook runs beside the path on its right-hand side the whole way and never crosses it,
  never goes under it, and never disappears: one continuous thread of water from the pool
  to the green land, glinting gold in the sunset. In the middle ground the path divides at a
  plain Y into two clearly separate tracks. The right-hand track keeps the brook beside it
  and goes down into the green, where a woven basket of grain and fruit sits on a flat stone
  between the track and the brook. The left-hand track turns away across pale, dry, empty
  ground with no water and nothing growing. Keep the plants few and large, each one
  different: in the foreground only bare rock, bare earth and two or three clumps of dry
  grass; along the brook a few scattered tufts of green, not a hedge; in the land below,
  only a handful of big individual trees of different shapes, one loose cluster of four or
  five palms, and the fields as a few broad, soft patches of green and gold with no rows, no
  grid, no orchards and no repeated shapes. Beyond, the ground falls away to the Jordan, a
  narrow river, no wider than a country stream from this height, winding across a broad
  plain, and on the far side the land opens westward toward soft hills fading into warm
  haze. The sun is low in the west over the far hills, ahead of the viewer, so the near
  rock is in soft shadow with gold light only on its upper edges, the water catches the
  light, and shadows fall back toward the viewer. The setting sun is the brightest point in
  the picture, with the sky above it shading from gold to deep blue. The view is calm and
  spacious, with generous empty sky. No figures, buildings, animals, fire, or storms.
# “What's in this picture” under the image on the book page: one line for each thing, with the verse it shows.
key:
  - '**The empty ledge looking out over the land** is Mount Nebo, where “the LORD shewed him all the land” and said, “I have caused thee to see it with thine eyes, but thou shalt not go over thither” ([[Deut. 34:1–4]]).'
  - '**The water coming out of the rock** is the Rock of Israel, who “brought thee forth water out of the rock of flint” ([[Deut. 8:15]]). Moses sings, “He is the Rock, his work is perfect” ([[Deut. 32:4]]), and Paul says Israel “drank of that spiritual Rock that followed them: and that Rock was Christ” ([[1 Cor. 10:4]]). Moses stops at the rock; the water runs on into the land.'
  - '**The river, the green plain and the palms** are the Jordan and the land beyond it, including “Jericho, the city of palm trees” ([[Deut. 34:3]]).'
  - '**The path that divides** is the choice Moses sets before Israel: “I have set before you life and death, blessing and cursing: therefore choose life” ([[Deut. 30:19]]).'
  - '**The basket of grain and fruit** is the firstfruits, brought as thanks for the land the Lord gave: “thou shalt take of the first of all the fruit of the earth … and shalt put it in a basket” ([[Deut. 26:2]]).'
alt: A bare rock outcrop on a mountaintop looks out over a river winding across a wide plain toward green fields, palm trees and distant hills in evening light; a spring seeps from the rock and runs as a brook beside a path that leaves the summit and forks, one branch with the brook toward green fields where a woven basket of fruit rests on a flat stone, the other toward dry ground.
status: proposed
