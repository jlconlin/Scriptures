summary: >-
  Deuteronomy is Moses' farewell on the plains of Moab, with the promised land in sight
  and the Jordan not yet crossed. Its quiet center is the land held out to a people who
  must choose to love the Lord and live, and the book ends on the mountain where Moses
  is shown all of it and goes no further. It points to Jehovah, the Savior, who is
  Israel's life and the prophet like unto Moses.
motifs:
  - "Primary: a bare stone ledge on the summit of a mountain, empty and open to the west, looking out over the whole land spread below (Deut. 34:1–4)."
  - "Supporting: a footpath leading down from the ledge to one fork in the green land below, one branch running on toward fruitful, watered fields, the other toward dry and barren ground (Deut. 30:19)."
  - "Supporting: a woven basket of grain and fruit set on a flat stone beside the fruitful branch of the path (Deut. 26:2)."
composition: >-
  A wide landscape at early morning from the empty ledge, which fills the lower left
  foreground as a few broad planes of pale rock with nothing on it. Beyond it the ground
  falls away to the Jordan, a thin river winding across a broad plain, and on the far side
  the land opens westward in green fields, a grove of palms, and soft hills fading into
  warm haze. The path leaves the ledge and descends toward the middle ground, where it
  forks: the right branch runs into the green and ends beside the basket on its flat stone,
  the left branch into dry, pale ground. A quiet band of gold sunlight crosses the far
  hills, the brightest point in the picture, with the sky above it in clear deep blue. The
  view is calm and spacious, with generous empty sky. No figures, buildings, animals,
  fire, or storms.
# “What's in this picture” under the image on the book page: one line for each thing, with the verse it shows.
key:
  - '**The empty ledge looking out over the land** is Mount Nebo, where “the LORD shewed him all the land” and said, “I have caused thee to see it with thine eyes, but thou shalt not go over thither” ([[Deut. 34:1–4]]).'
  - '**The river, the green plain and the palms** are the Jordan and the land beyond it, including “Jericho, the city of palm trees” ([[Deut. 34:3]]).'
  - '**The path that divides** is the choice Moses sets before Israel: “I have set before you life and death, blessing and cursing: therefore choose life” ([[Deut. 30:19]]).'
  - '**The basket of grain and fruit** is the firstfruits, brought as thanks for the land the Lord gave: “thou shalt take of the first of all the fruit of the earth … and shalt put it in a basket” ([[Deut. 26:2]]).'
alt: A bare stone ledge on a mountaintop looks out over a river winding across a wide plain toward green fields, palm trees and distant hills in morning light; a path leaves the ledge and forks, one branch toward green fields where a woven basket of fruit rests on a flat stone, the other toward dry ground.
status: proposed
