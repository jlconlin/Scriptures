summary: >-
  Deuteronomy is Moses' farewell on the plains of Moab, with the promised land in sight
  and the Jordan not yet crossed. Its quiet center is the land held out to a people who
  must choose to love the Lord and live, and the book ends on the mountain where Moses
  is shown all of it and goes no further. It points to Jehovah, the Savior, who is
  Israel's life and the prophet like unto Moses.
motifs:
  - "Primary: a bare stone ledge on the summit of a mountain, empty and open to the west, looking out over the whole land spread below (Deut. 34:1–4)."
  - "Primary, with the ledge: one clear spring of water rising out of the stone ledge itself and running as a bright stream beside the path, down the branch toward the green land (Deut. 8:15; 32:4; 1 Cor. 10:4)."
  - "Supporting: a footpath leading down from the ledge to one fork in the green land below, one branch running on toward fruitful, watered fields, the other toward dry and barren ground (Deut. 30:19)."
  - "Supporting: a woven basket of grain and fruit set on a flat stone beside the fruitful branch of the path (Deut. 26:2)."
composition: >-
  A wide landscape at evening from the empty ledge, which fills the lower left
  foreground as a few broad planes of pale rock with no one on it. Out of a cleft in that
  rock rises one clear spring, plainly coming from the stone, and its water runs as a
  bright stream beside the path, catching the low sunlight. Beyond the ledge the ground
  falls away to the Jordan, a narrow river, no wider than a country stream from this
  height, winding through a thin line of trees across a broad plain, and on the far side
  the land opens westward in green fields, a grove of palms, and soft hills fading into
  warm haze. The path leaves the ledge and descends toward the middle ground, where it
  forks: the right branch, with the stream running beside it, goes down into the green and
  ends beside the basket on its flat stone; the left branch goes into dry, pale ground with
  no water. The sun is low in the west over the far hills, ahead of the viewer, so the
  rock and the stream are lit from the front and shadows fall back toward the viewer. The setting sun
  is the brightest point in the picture, with the sky above it shading from gold to deep blue. The
  view is calm and spacious, with generous empty sky. No figures, buildings, animals,
  fire, or storms.
# “What's in this picture” under the image on the book page: one line for each thing, with the verse it shows.
key:
  - '**The empty ledge looking out over the land** is Mount Nebo, where “the LORD shewed him all the land” and said, “I have caused thee to see it with thine eyes, but thou shalt not go over thither” ([[Deut. 34:1–4]]).'
  - '**The water coming out of the rock** is the Rock of Israel, who “brought thee forth water out of the rock of flint” ([[Deut. 8:15]]). Moses sings, “He is the Rock, his work is perfect” ([[Deut. 32:4]]), and Paul says Israel “drank of that spiritual Rock that followed them: and that Rock was Christ” ([[1 Cor. 10:4]]). Moses stops at the rock; the water runs on into the land.'
  - '**The river, the green plain and the palms** are the Jordan and the land beyond it, including “Jericho, the city of palm trees” ([[Deut. 34:3]]).'
  - '**The path that divides** is the choice Moses sets before Israel: “I have set before you life and death, blessing and cursing: therefore choose life” ([[Deut. 30:19]]).'
  - '**The basket of grain and fruit** is the firstfruits, brought as thanks for the land the Lord gave: “thou shalt take of the first of all the fruit of the earth … and shalt put it in a basket” ([[Deut. 26:2]]).'
alt: A bare stone ledge on a mountaintop looks out over a river winding across a wide plain toward green fields, palm trees and distant hills in evening light; a spring rises from the rock and runs beside a path that leaves the ledge and forks, one branch with the stream toward green fields where a woven basket of fruit rests on a flat stone, the other toward dry ground.
status: proposed
