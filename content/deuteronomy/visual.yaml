summary: >-
  Deuteronomy is Moses' farewell on the plains of Moab, with the promised land in sight
  and the Jordan not yet crossed. Its quiet center is the land held out to a people who
  must choose to love the Lord and live, and the book ends on the mountain where Moses
  is shown all of it and goes no further. It points to Jehovah, the Savior, who is
  Israel's life and the prophet like unto Moses.
motifs:
  - "Primary: a bare, natural limestone outcrop on the mountainside at the right edge of the picture, open to the west, above the whole land spread below (Deut. 34:1–4)."
  - "Primary, with the outcrop: water falling from a crack in that rock, plainly the beginning of one brook that runs sideways across the picture, from the rock on the right down to the green valley on the left (Deut. 8:15; 32:4; 1 Cor. 10:4)."
  - "Supporting: below, a good, green and well-watered land, “a land of brooks of water, of fountains and depths that spring out of valleys and hills” (Deut. 8:7)."
  - "Supporting: a footpath that comes down to the brook and divides at a plain Y, one track following the brook down into the green, the other turning onto a barren slope of bare stone and dust (Deut. 30:19)."
  - "Supporting: a woven basket of grain and fruit set on a flat stone where the path meets the brook (Deut. 26:2)."
composition: >-
  A wide landscape at evening from high on a mountainside. At the right edge of the picture,
  in the near middle ground, stands a rough, weathered limestone outcrop, as nature left
  it: a few large rounded, fissured boulders of bedrock, nothing cut or built, and no one on
  it. Water falls from a crack in the face of this rock and gathers at its foot: that water
  is the beginning of the brook. The brook runs
  sideways across the picture, from right to left, descending gently along the slope in one
  long, unbroken, curving line, never flowing toward the viewer and never running off into
  the distance, so the whole of it can be followed with the eye from the crack in the rock
  to where it reaches the green valley at the left and middle of the picture. It glints gold
  in the sunset, with green grass along both banks. A dirt path comes down from the bottom
  center of the picture to the brook. Just above the brook it divides at a plain Y: the
  left-hand track turns and follows the brook downhill into the green valley; the
  right-hand track turns uphill to the right, away from the water, onto a plainly barren
  slope that fills the lower right corner of the picture below the rock: bare cracked
  stone and pale dust, one dead, leafless shrub, and nothing green at all, so that the
  dead ground on the right and the green, watered ground on the left are seen side by
  side where the path divides. A woven basket of grain and fruit sits on a flat stone where the path
  meets the brook. Below and beyond, the land is lush, green and well watered: a broad
  valley of deep green meadows and grain, a few large individual trees of different
  shapes, one loose cluster of palms, and the Jordan, a narrow river winding through it
  among trees. Keep the plants few and large and each one different, and show the fields as
  a few broad soft areas of green and gold with no rows, no grid, no patchwork and no
  repeated shapes. The far hills are green and soft, fading into warm haze. The sun is low
  in the west over the far hills, so the rock is lit from that side and its shadows fall
  away from the sun; the water catches the light. The setting sun is the brightest point in
  the picture, with the sky above it shading from gold to deep blue. The view is calm and
  spacious, with generous empty sky. No figures, buildings, animals, fire, or storms.
# “What's in this picture” under the image on the book page: one line for each thing, with the verse it shows.
key:
  - '**The view from high on the mountain** is the land as Moses saw it from Nebo, where “the LORD shewed him all the land” and said, “I have caused thee to see it with thine eyes, but thou shalt not go over thither” ([[Deut. 34:1–4]]).'
  - '**The water coming out of the rock** points to the Lord, who “brought thee forth water out of the rock of flint” ([[Deut. 8:15]]). Moses sings, “He is the Rock, his work is perfect” ([[Deut. 32:4]]), and Paul says Israel “drank of that spiritual Rock that followed them: and that Rock was Christ” ([[1 Cor. 10:4]]).'
  - '**The green valley, the river and the palms** show the promised land across the Jordan, “a good land, a land of brooks of water, of fountains and depths that spring out of valleys and hills” ([[Deut. 8:7]]); the palms recall “Jericho, the city of palm trees” ([[Deut. 34:3]]).'
  - '**The path that divides**, one way beside the water into the green and the other onto bare stone and a dead shrub, stands for the choice Moses sets before Israel: “I have set before you life and death, blessing and cursing: therefore choose life” ([[Deut. 30:19]]).'
  - '**The basket of grain and fruit** is the firstfruits, brought as thanks for the land the Lord gave: “thou shalt take of the first of all the fruit of the earth … and shalt put it in a basket” ([[Deut. 26:2]]).'
