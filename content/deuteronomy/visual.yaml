alt: From high on a mountainside at sunset, water falls from a crack in a rock outcrop and runs as a brook down across the slope into a green valley with palms, trees and a winding river; a path divides beside it, one way past a basket of grain and fruit along the water into the green, the other onto bare, cracked stone with a dead shrub.
