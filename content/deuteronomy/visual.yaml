summary: >-
  Deuteronomy is Moses' farewell on the plains of Moab, with the promised land in sight
  and the Jordan not yet crossed. Its quiet center is the land held out to a people who
  must choose to love the Lord and live, and the book ends on the mountain where Moses
  is shown all of it and goes no further. It points to Jehovah, the Savior, who is
  Israel's life and the prophet like unto Moses.
motifs:
  - "Primary: a bare, natural limestone outcrop on the summit of a mountain, open to the west, looking out over the whole land spread below (Deut. 34:1–4)."
  - "Primary, with the outcrop: a natural spring coming out of a crack in that rock, which is plainly the source of one brook that runs beside the path down into the green land (Deut. 8:15; 32:4; 1 Cor. 10:4)."
  - "Supporting: below, a good, green and well-watered land, “a land of brooks of water, of fountains and depths that spring out of valleys and hills” (Deut. 8:7)."
  - "Supporting: a footpath that divides at a plain Y into two tracks, the right one going on beside the brook into the green, the left one onto a small stretch of stony, dry ground (Deut. 30:19)."
  - "Supporting: a woven basket of grain and fruit set on a flat stone beside the right-hand track (Deut. 26:2)."
composition: >-
  A wide landscape at evening from a mountaintop. The lower right foreground is a rough,
  weathered limestone outcrop, as nature left it: a few large rounded, fissured boulders of
  bedrock, nothing cut or built, and no one on it. Water comes straight out of a dark crack
  low in this rock and runs downhill at once: there is no pool, no basin and no fountain.
  The water leaving the crack is the beginning of the brook, so the eye can follow one
  unbroken thread of water from the rock all the way down into the land: it slips over the
  stones at the foot of the rock, runs left and away from the viewer to meet the path, and
  then flows downhill beside the path, on its right-hand side, never crossing it, always
  running away from the viewer toward the land below, glinting gold in the sunset, with
  green grass along both its banks. A dirt path starts at the bottom center and runs away
  from the viewer down the slope. In the middle ground the path divides at a plain Y. The
  right-hand track keeps the brook beside it and goes down into the green, past a woven
  basket of grain and fruit on a flat stone between the track and the brook. The left-hand
  track turns off onto one small stretch of pale, stony ground with no water, a little
  barren patch on the left edge of the picture; everything else is green. The land below is
  lush, green and well watered: a broad valley of deep green meadows and grain, a few large
  individual trees of different shapes, one loose cluster of palms, and small brooks
  catching the light, the Jordan a narrow river winding through it among trees. Keep the
  plants few and large and each one different, and show the fields as a few broad soft
  areas of green and gold with no rows, no grid, no patchwork and no repeated shapes. The
  far hills are green and soft, fading into warm haze. The sun is low in the west over the
  far hills, so the rock is lit from that side and its shadows fall away from the sun; the
  water catches the light. The setting sun is the brightest point in the picture, with the
  sky above it shading from gold to deep blue. The view is calm and spacious, with generous
  empty sky. No figures, buildings, animals, fire, or storms.
# “What's in this picture” under the image on the book page: one line for each thing, with the verse it shows.
key:
  - '**The empty ledge looking out over the land** is Mount Nebo, where “the LORD shewed him all the land” and said, “I have caused thee to see it with thine eyes, but thou shalt not go over thither” ([[Deut. 34:1–4]]).'
  - '**The water coming out of the rock** is the Rock of Israel, who “brought thee forth water out of the rock of flint” ([[Deut. 8:15]]). Moses sings, “He is the Rock, his work is perfect” ([[Deut. 32:4]]), and Paul says Israel “drank of that spiritual Rock that followed them: and that Rock was Christ” ([[1 Cor. 10:4]]). Moses stops at the rock; the water runs on into the land.'
  - '**The river, the green plain and the palms** are the Jordan and the land beyond it, including “Jericho, the city of palm trees” ([[Deut. 34:3]]).'
  - '**The path that divides** is the choice Moses sets before Israel: “I have set before you life and death, blessing and cursing: therefore choose life” ([[Deut. 30:19]]).'
  - '**The basket of grain and fruit** is the firstfruits, brought as thanks for the land the Lord gave: “thou shalt take of the first of all the fruit of the earth … and shalt put it in a basket” ([[Deut. 26:2]]).'
alt: A bare rock outcrop on a mountaintop looks out over a river winding across a wide plain toward green fields, palm trees and distant hills in evening light; a spring seeps from the rock and runs as a brook beside a path that leaves the summit and forks, one branch with the brook toward green fields where a woven basket of fruit rests on a flat stone, the other toward dry ground.
status: proposed
