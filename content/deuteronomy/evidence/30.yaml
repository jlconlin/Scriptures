chapter: 30
claims:
  - where: when
    claim: 'Moses speaks in the plains of Moab in the fortieth year after the Exodus'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/1?lang=eng'
    quote: 'And it came to pass in the fortieth year, in the eleventh month, on the first day of the month, that Moses spake unto the children of Israel'
  - where: setting
    claim: 'Deuteronomy holds three sermons; the third runs 29:2–30:20'
    key: seely-self-reference
    url: 'https://rsc.byu.edu/they-shall-grow-together/rhetoric-self-reference-deuteronomy-book-mormon'
    quote: 'The book of Deuteronomy contains three sermons delivered by Moses at the plains of Moab (1:1–4:43; 4:44–29:1; 29:2–30:20)'
  - where: setting
    claim: 'One reading: the address moves through the covenant past, present and future as motivations for a call to decision in 30:11–20'
    key: ot-minute-deut-rappleye
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1-6-8-15-18-29-30-34'
    quote: 'It discusses the covenant past (29:2–8), present (29:9–15), and future (29:16–29; 30:1–10) as the motivations for a call to decision (30:11–20).'
  - where: setting
    claim: 'After the cursings at the end of chapter 29, the promise of return fills chapter 30'
    key: muhlestein-everlasting-covenant
    url: 'https://rsc.byu.edu/vol-21-no-2-2020/recognizing-everlasting-covenant-scriptures'
    quote: 'In Deuteronomy, the cursings are repeated again at the end of chapter 29, but the promise of the ability to return fills chapter 30.'
  - where: setting
    claim: 'Lehi’s teaching on the two ways strongly echoes Deuteronomy 30:19'
    key: sc-knowhy-287
    url: 'https://scripturecentral.org/knowhy/why-did-lehi-teach-about-the-two-ways'
    quote: 'Lehi’s statement strongly echoes Deuteronomy, where Moses proclaimed, “I call heaven and earth to record this day against you'
  - where: setting
    claim: 'Paul quotes the passage and reads it of Christ'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/10?lang=eng'
    quote: 'But what saith it? The word is nigh thee, even in thy mouth, and in thy heart: that is, the word of faith, which we preach;'
  - where: thread
    claim: 'The verb shub (return, turn back, restore) is behind “call to mind,” “return,” “turn,” “again”'
    key: bdb
    url: 'https://biblehub.com/hebrew/7725.htm'
    quote: 'shub: Return, turn back, restore, repent … bring (again, back, home again), call (to mind)'
  - where: thread
    claim: 'The Hebrew of 30:8 and 30:9 has forms of shub (the verb occurs also in vv. 1, 2, 3 twice, 10: seven times in 1–10)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'תָשׁ֔וּב'
  - where: thread
    claim: 'The Hebrew of 30:9 has shub for “again”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'יָשׁ֣וּב'
  - where: thread
    claim: 'One study: wordplay in 30:1–10 on the word for repent, return, restore; “When Israel repents, Israel can return because Yahweh will restore”'
    key: ot-minute-deut-rappleye
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1-6-8-15-18-29-30-34'
    quote: 'wordplay “on the Hebrew word that can be translated ‘to repent,’ ‘to return’ or ‘to restore.’” This wordplay is theologically significant and reinforces the message of the covenant: “When Israel repents, Israel can return because Yahweh will restore.”'
  - where: section 1 plain
    claim: 'A modern translation renders 30:3 “return you from your captivity”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Deuteronomy%2030&version=NRSVUE'
    quote: 'then the Lord your God will return you from your captivity and have compassion on you, gathering you again from all the peoples'
  - where: section 2 plain
    claim: '“Hidden” in 30:11 means too hard'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Deuteronomy%2030&version=NRSVUE'
    quote: 'Surely, this commandment that I am commanding you today is not too hard for you, nor is it too far away.'
  - where: section 3 plain
    claim: '“Denounce” in 30:18 is “declare” in the Hebrew'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/30?lang=eng'
    quote: '“denounce”: HEB declare.'
  - where: section 3 plain
    claim: 'A modern translation renders 30:19 “call heaven and earth to witness”'
    key: dundas-ancient-israel
    url: 'https://rsc.byu.edu/mormons-record/ancient-israel'
    quote: 'I call heaven and earth to witness against you today that I have set before you life and death, blessings and curses. Choose life so that you and your descendants may live'
  - where: 'note 30:1 “Scattered with a promise”'
    claim: 'After the cursings, chapter 30 is filled with the promise of return, as Leviticus 26 ends with assurances of return'
    key: muhlestein-everlasting-covenant
    url: 'https://rsc.byu.edu/vol-21-no-2-2020/recognizing-everlasting-covenant-scriptures'
    quote: 'Leviticus 26 ends with beautiful assurances that Israel can return when they repent. In Deuteronomy, the cursings are repeated again at the end of chapter 29, but the promise of the ability to return fills chapter 30.'
  - where: 'note 30:1 “Scattered with a promise”'
    claim: 'President Nelson: Israel was scattered because the people broke the commandments and stoned the prophets'
    key: nelson-teachings-gathering
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-of-presidents-of-the-church-russell-m-nelson/09-the-gathering-of-israel?lang=eng'
    quote: 'Why was Israel scattered? Because the people broke the commandments and stoned the prophets.'
  - where: 'note 30:1 “Scattered with a promise”'
    claim: 'President Nelson: He scattered them with a promise of gathering'
    key: nelson-teachings-gathering
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-of-presidents-of-the-church-russell-m-nelson/09-the-gathering-of-israel?lang=eng'
    quote: 'However, He scattered them with a promise that one day Israel would be gathered again into His fold.'
  - where: 'note 30:1 “Scattered with a promise”'
    claim: 'Chapter 29 ends with Israel cast into another land'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/29?lang=eng'
    quote: 'And the Lord rooted them out of their land in anger, and in wrath, and in great indignation, and cast them into another land, as it is this day.'
  - where: 'note 30:3 “Turn thy captivity”'
    claim: 'Shebut means captivity, exile'
    key: bdb
    url: 'https://biblehub.com/hebrew/7622.htm'
    quote: 'שְׁבוּת (shebuth or shebith) -- Captivity, Exile, Captives'
  - where: 'note 30:3 “Turn thy captivity”'
    claim: 'BDB: the idiom means to restore the fortunes of individuals, Job 42:10'
    key: bdb
    url: 'https://biblehub.com/hebrew/7622.htm'
    quote: 'd. restore fortunes of individuals, Job 42:10.'
  - where: 'note 30:3 “Turn thy captivity”'
    claim: 'A modern translation: “return you from your captivity”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Deuteronomy%2030&version=NRSVUE'
    quote: 'then the Lord your God will return you from your captivity and have compassion on you'
  - where: 'note 30:3 “Turn thy captivity”'
    claim: 'A modern translation: “restore your fortunes”'
    key: dundas-ancient-israel
    url: 'https://rsc.byu.edu/mormons-record/ancient-israel'
    quote: 'The Lord your God will restore your fortunes and have compassion on you, gathering you again from all the peoples among whom the Lord your God has scattered you.'
  - where: 'note 30:3 “Turn thy captivity”'
    claim: 'The verb in “turn thy captivity” and “return” in 30:3 is shub, as in 30:2'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'תָשׁ֔וּב'
  - where: 'note 30:3 “Turn thy captivity”'
    claim: 'Shub means return, turn back, restore'
    key: bdb
    url: 'https://biblehub.com/hebrew/7725.htm'
    quote: 'shub: Return, turn back, restore, repent'
  - where: 'note 30:6 “The LORD will circumcise thine heart”'
    claim: 'The circumcised heart in 10:16 and 30:6 is symbolic, internalizing the commitments of circumcision'
    key: wessel-circumcision
    url: 'https://rsc.byu.edu/vol-20-no-3-2019/circumcision-old-testament'
    quote: 'This reference to circumcision of the heart is clearly not a physical act but a symbolic invitation to internalize the commitments associated with circumcision.'
  - where: 'note 30:6 “The LORD will circumcise thine heart”'
    claim: 'The covenant was everlasting, but the sign was not'
    key: wessel-circumcision
    url: 'https://rsc.byu.edu/vol-20-no-3-2019/circumcision-old-testament'
    quote: 'It seems, then, that when the Lord told Abraham, “my covenant shall be in your flesh for an everlasting covenant” (Genesis 17:13), the covenant was everlasting, but the sign was not.'
  - where: 'note 30:12 “Not in heaven: Moses and Paul”'
    claim: 'The verb behind “hidden” ranges from difficult to wonderful'
    key: bdb
    url: 'https://biblehub.com/hebrew/6381.htm'
    quote: 'pala: To be wonderful, to be extraordinary, to be difficult, to be marvelous'
  - where: 'note 30:12 “Not in heaven: Moses and Paul”'
    claim: 'A modern translation: “not too hard for you, nor is it too far away”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Deuteronomy%2030&version=NRSVUE'
    quote: 'Surely, this commandment that I am commanding you today is not too hard for you, nor is it too far away.'
  - where: 'note 30:12 “Not in heaven: Moses and Paul”'
    claim: 'Paul glosses “ascend into heaven” as bringing Christ down'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/10?lang=eng'
    quote: 'But the righteousness which is of faith speaketh on this wise, Say not in thine heart, Who shall ascend into heaven? (that is, to bring Christ down from above:)'
  - where: 'note 30:12 “Not in heaven: Moses and Paul”'
    claim: 'Paul replaces the sea with the deep and glosses it as raising Christ from the dead'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/10?lang=eng'
    quote: 'Or, Who shall descend into the deep? (that is, to bring up Christ again from the dead.)'
  - where: 'note 30:12 “Not in heaven: Moses and Paul”'
    claim: 'Paul: mouth and heart become confession and belief'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/10?lang=eng'
    quote: 'That if thou shalt confess with thy mouth the Lord Jesus, and shalt believe in thine heart that God hath raised him from the dead, thou shalt be saved.'
  - where: 'note 30:19 “Choose life”'
    claim: 'The choice between life and death, good and evil, is the ancient “two ways” framework, found elsewhere in the Bible and in Book of Mormon speeches'
    key: ot-minute-deut-rappleye
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1-6-8-15-18-29-30-34'
    quote: 'This framing of the two choices between obedience and disobedience as ultimately being the choice between good and evil and life and death is a common framework from antiquity known as the “two ways.” It is found throughout the ancient world and other parts of the Bible'
  - where: 'note 30:19 “Choose life”'
    claim: 'Lehi’s statement strongly echoes 30:19'
    key: sc-knowhy-287
    url: 'https://scripturecentral.org/knowhy/why-did-lehi-teach-about-the-two-ways'
    quote: 'This doctrine states that there are only two ways to live: the way of life, and the way of death. Lehi’s statement strongly echoes Deuteronomy'
  - where: 'note 30:19 “Choose life”'
    claim: 'The image of the way of life and death is distinctive to Deuteronomy, and Lehi and Jacob use the same image'
    key: seely-self-reference
    url: 'https://rsc.byu.edu/they-shall-grow-together/rhetoric-self-reference-deuteronomy-book-mormon'
    quote: 'the image of the way of life and the way of death is distinctive to Deuteronomy in the scene where Moses presented it to Israel on the plains of Moab'
  - where: 'note 30:19 “Choose life”'
    claim: 'Heaven and earth are covenant witnesses at 4:26, 30:15–20 and 31:28 in the covenant pattern of Deuteronomy'
    key: ot-minute-deut-rappleye
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1-6-8-15-18-29-30-34'
    quote: 'Covenant witnesses … 4:26; 30:15–20; 31:28'
  - where: 'note 30:19 “Choose life”'
    claim: 'The blessings and curses of a suzerain-vassal treaty seem to underlie the Mosaic covenant, exemplified by 30:19'
    key: uriona-curses
    url: 'https://byustudies.byu.edu/article/the-curse-of-the-covenant-the-deuteronomic-curses-in-the-book-of-mormon'
    quote: 'It is this covenant type that seems to underlie the covenant God made with Israel under Moses’s leadership (see Ex. 20–24). This is exemplified in the utterance, “I have set before you life and death, blessing and cursing: therefore choose life” (Deut. 30:19).'
  - where: 'note 30:19 “Choose life”'
    claim: 'Lehi: free to choose eternal life through the great Mediator'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/2?lang=eng'
    quote: 'And they are free to choose liberty and eternal life, through the great Mediator of all men, or to choose captivity and death'
  - where: explore
    claim: 'Moses committed the keys of the gathering of Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/110?lang=eng'
    quote: 'Moses appeared before us, and committed unto us the keys of the gathering of Israel from the four parts of the earth'
  - where: 'note 30:19 “Choose life”'
    claim: 'Jacob uses the same image of the two ways (2 Ne. 10:23)'
    key: seely-self-reference
    url: 'https://rsc.byu.edu/they-shall-grow-together/rhetoric-self-reference-deuteronomy-book-mormon'
    quote: 'and Jacob later adds, “Therefore, cheer up your hearts, and remember that ye are free to act for yourselves—to choose the way of everlasting death or the way of eternal life” (10:23).'
