chapter: 18
claims:
  - where: when
    claim: 'Moses speaks in the fortieth year, in the land of Moab'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/1?lang=eng'
    quote: 'And it came to pass in the fortieth year, in the eleventh month, on the first day of the month, that Moses spake unto the children of Israel'
  - where: setting
    claim: 'Chapters 16–18 describe four institutions: judges, king, Levitical priests, prophet'
    key: seely-prophet-like-moses
    url: 'https://journal.interpreterfoundation.org/a-prophet-like-moses-deuteronomy-1815-18-in-the-book-of-mormon-the-bible-and-the-dead-sea-scrolls/'
    quote: 'Chapters 16–18 in Deuteronomy describe four institutions in Israel: judges (16:18–17:13), the king (17:14–20), Levitical priests (18:1–8), and the prophet (18:18–22).'
  - where: setting
    claim: 'The prophecy is one of the most important texts of the Deuteronomic Code and became foundational to the early understanding of Jesus’ ministry'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'This text constitutes, far and away, one of the most important texts in the present form of the Deuteronomic Code'
  - where: setting
    claim: 'The text became foundational to the early understanding of Jesus’ ministry; Peter and Stephen cite it'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'This text became foundational to the early understanding of Jesus’s ministry. Peter declared this prophecy fulfilled in Jesus in Acts 2:22–23. Stephen cited this prophecy to the Sanhedrin in Acts 7:37.'
  - where: setting
    claim: 'The Book of Mormon alludes to the prophecy twice, identifying the prophet as Christ (Nephi; the risen Jesus)'
    key: seely-prophet-like-moses
    url: 'https://journal.interpreterfoundation.org/a-prophet-like-moses-deuteronomy-1815-18-in-the-book-of-mormon-the-bible-and-the-dead-sea-scrolls/'
    quote: 'Likewise, the Book of Mormon also alludes to the prophecy twice, identifying the future prophet as Christ.'
  - where: thread
    claim: 'Israel was forbidden the mediums the Canaanites used to learn God’s will; instead the Lord promised a prophet like Moses to communicate it'
    key: ot-minute-deut-rappleye
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1-6-8-15-18-29-30-34'
    quote: 'The Israelites were forbidden from turning to the various spiritual mediums that the Canaanites used to determine God’s will (Deuteronomy 18:9–14). Instead, the Lord promised to raise up a prophet like Moses to communicate His will (verses 15–19).'
  - where: thread
    claim: 'Chapters 16–18 set out four offices, the Levitical priests and the prophet among them'
    key: seely-prophet-like-moses
    url: 'https://journal.interpreterfoundation.org/a-prophet-like-moses-deuteronomy-1815-18-in-the-book-of-mormon-the-bible-and-the-dead-sea-scrolls/'
    quote: 'Chapters 16–18 in Deuteronomy describe four institutions in Israel: judges (16:18–17:13), the king (17:14–20), Levitical priests (18:1–8), and the prophet (18:18–22).'
  - where: 'note 18:1 “The priests the Levites”'
    claim: 'Levites are sometimes distinct from priests, sometimes spoken of as though all were priests, “the priests, the Levites” (Deut. 18:1); Levites assisted the priests'
    key: bd-levites
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/levites?lang=eng'
    quote: 'The Levites are sometimes spoken of as distinct from the priests (1 Kgs. 8:4; Ezra 2:70; John 1:19); sometimes as though all Levites were also priests, “the priests, the Levites” (Deut. 18:1; Josh. 3:3). The work of the Levites was to assist the priests (Num. 3:5–10; 18:1–7).'
  - where: 'note 18:1 “The priests the Levites”'
    claim: 'Levites had no inheritance in Canaan but had the tithe, 48 cities, and a claim at feast times'
    key: bd-levites
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/levites?lang=eng'
    quote: 'They had no inheritance in Canaan (18:23–24); but they had the tithe (18:21), 48 cities (35:6), and a claim on the alms of the people at feast times (Deut. 12:18–19; 14:27–29).'
  - where: 'note 18:1 “The priests the Levites”'
    claim: 'Within the chapter itself, verse 7 calls the Levites at the sanctuary “his brethren the Levites” who “stand there before the LORD” (the text); verse 5 says the LORD chose “him and his sons”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/18?lang=eng'
    quote: 'Then he shall minister in the name of the LORD his God, as all his brethren the Levites do, which stand there before the LORD.'
  - where: 'note 18:3 “Shoulder, cheeks and maw”'
    claim: 'The shoulder is the front leg; the maw is the fourth stomach of ruminants'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/18.htm'
    quote: 'הזּרע, the shoulder, i.e., the front leg; see Numbers 6:19. הקּבה, the rough stomach, τὸ ἤνιστρον (lxx), i.e., the fourth stomach of ruminant animals'
  - where: 'note 18:3 “Shoulder, cheeks and maw”'
    claim: 'One older reading: a piece from each of the three principal parts of the animal; the shoulder and stomach were especially good'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/18.htm'
    quote: '"Of each of these three principal parts of the animal," says Schultz, "some valuable piece was to be presented: the shoulder at least, and the stomach, which was regarded as particularly fat, are seen at once to have been especially good."'
  - where: 'note 18:3 “Shoulder, cheeks and maw”'
    claim: 'Not at variance with Lev. 7:32 (wave-breast and heave-leg); a further gift from the people'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/18.htm'
    quote: 'That this arrangement is not at variance with the command in Leviticus 7:32., to give the wave-breast and heave-leg of the peace-offerings to the Lord for the priests, but simply enjoins a further gift to the priests on the part of the people'
  - where: 'note 18:3 “Shoulder, cheeks and maw”'
    claim: 'Probably compensation for income lost when slaughter at the sanctuary was no longer required (Lev. 17; Deut. 12:15)'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/18.htm'
    quote: 'This right was probably accorded to the priests as a compensation for the falling off which would take place in their incomes in consequence of the repeal of the law that every animal was to be slaughtered at the sanctuary as a sacrifice (Leviticus 17; vid., Deuteronomy 12:15.).'
  - where: 'note 18:3 “Shoulder, cheeks and maw”'
    claim: 'Disputed whether the gift came from every animal slaughtered at home (Philo, Josephus, Talmud) or only from sacrificial meals'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/18.htm'
    quote: 'The only thing that admits of dispute is, whether this gift was to be presented from every animal that was slaughtered at home for private use, or only from those which were slaughtered for sacrificial meals, and therefore at the place of the sanctuary. Against the former view, for which appeal is made to Philo, Josephus (Ant. iv. 4, 4), and the Talmud'
  - where: 'note 18:6 “A country Levite at the chosen place”'
    claim: 'Levites received no land but cities among the tribes; dependent on the people; once the central sanctuary was built any Levite could come and minister there and be provided for'
    key: ot-minute-deut-rappleye
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1-6-8-15-18-29-30-34'
    quote: 'The surrounding community was supposed to provide for the Levites living in the area (see Deuteronomy 14:27), but once the central sanctuary (the temple in Jerusalem) was built, any Levite in Israel could come to minister there and be provided for (18:5–8).'
  - where: 'note 18:6 “A country Levite at the chosen place”'
    claim: 'Levites were allotted cities within tribal territories and were dependent on the people'
    key: ot-minute-deut-rappleye
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1-6-8-15-18-29-30-34'
    quote: 'The Levites were not to receive a land inheritance but instead would be allotted cities within the different tribal territories (see Numbers 35:1–8; Joshua 21:1–42). Thus, the Levites were dependent upon the people to provide for their needs'
  - where: 'note 18:6 “A country Levite at the chosen place”'
    claim: '“Sojourned” means only that Levites had no hereditary possession and lived like sojourners in the towns given them; only part of the Levites served at the sanctuary; the newcomer was to have the same share'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/18.htm'
    quote: 'The verb גּוּר (sojourned) does not presuppose that the Levites were houseless, but simply that they had no hereditary possession in the land as the other tribes had, and merely lived like sojourners among the Israelites in the towns'
  - where: 'note 18:6 “A country Levite at the chosen place”'
    claim: 'Only a part of the Levites served at the sanctuary; the newcomer shares equally'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/18.htm'
    quote: 'It is assumed, therefore, that only a part of the Levites were engaged at the sanctuary, and the others lived in their towns. The apodosis follows in Deuteronomy 18:8, "part like part shall they eat," sc., the new-comer and those already there.'
  - where: 'note 18:6 “A country Levite at the chosen place”'
    claim: 'The sale of his patrimony: what he receives from selling property he holds by family descent'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/18.htm'
    quote: 'independently of what he receives from the sale of his patrimony'
  - where: 'note 18:6 “A country Levite at the chosen place”'
    claim: 'The patrimony is the produce of property he possesses according to his family descent'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/18.htm'
    quote: 'the produce of the property which he possesses according to his family descent, or which is with his kindred'
  - where: 'note 18:10 “Every way of reading the future”'
    claim: 'Divination is any superstitious method of discovering future events; condemned often in scripture'
    key: bd-divination
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/divination?lang=eng'
    quote: 'Any superstitious method of trying to discover the course of future events. Such practices have been found among all nations and in every age; they are frequently condemned in scripture'
  - where: 'note 18:10 “Every way of reading the future”'
    claim: 'Moses groups together all the words for exploring the future to forbid every kind; Molech worship placed at the head to show the connection between soothsaying and idolatry'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/18.htm'
    quote: 'Moses groups together all the words which the language contained for the different modes of exploring the future and discovering the will of God, for the purpose of forbidding every description of soothsaying, and places the prohibition of Moloch-worship at the head, to show the inward connection between soothsaying and idolatry'
  - where: 'note 18:10 “Every way of reading the future”'
    claim: 'The terms: soothsaying, wizard, snake-charmer, conjurer, ban by magical knots, necromancer, one who asked the dead'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/18.htm'
    quote: 'or one who pronounced a ban (חבר חבר, probably referring to the custom of binding or banning by magical knots), a necromancer and wise man (see at Leviticus 19:31), or one who asked the dead, i.e., who sought oracles from the dead.'
  - where: 'note 18:13 “Perfect with the LORD”'
    claim: 'tamim: complete, whole, entire; integrity'
    key: bdb
    url: 'https://biblehub.com/hebrew/8549.htm'
    quote: 'tamim: Complete, whole, perfect, blameless, without blemish … 1. (literally, figuratively or morally) entire 2. (also, as noun) integrity, truth'
  - where: 'note 18:13 “Perfect with the LORD”'
    claim: 'In Deut. 18:13 “perfect” follows rejecting the neighbors’ sins: to be perfect with God, to covenant to follow Him; in covenant context perfect is faithfulness, loyalty'
    key: sc-knowhy-335
    url: 'https://scripturecentral.org/knowhy/what-does-it-mean-to-be-perfect'
    quote: 'The previous verse clarifies that God wanted his people to reject the sins of their neighbors and “be perfect” with Him, or covenant to follow him (Deuteronomy 18:12). Latter-day Saint scholar Taylor Halverson explains, “in the covenantal context ‘perfect’ is a synonym to faithfulness, loyalty, and trustworthiness.”'
  - where: 'note 18:13 “Perfect with the LORD”'
    claim: 'The KnoWhy reads Jesus’ command to be perfect (3 Ne. 12:48; Matt. 5:48) through this covenant sense'
    key: sc-knowhy-335
    url: 'https://scripturecentral.org/knowhy/what-does-it-mean-to-be-perfect'
    quote: 'Instead of expecting people to be “without mistake,” Jesus may have been commanding them to be made whole through making covenants with Him.'
  - where: 'note 18:14 “Instead of diviners, a prophet”'
    claim: 'Israel was forbidden the Canaanites’ mediums for learning God’s will; instead the Lord promised a prophet like Moses'
    key: ot-minute-deut-rappleye
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1-6-8-15-18-29-30-34'
    quote: 'The Israelites were forbidden from turning to the various spiritual mediums that the Canaanites used to determine God’s will (Deuteronomy 18:9–14). Instead, the Lord promised to raise up a prophet like Moses to communicate His will (verses 15–19).'
  - where: 'note 18:14 “Instead of diviners, a prophet”'
    claim: 'Philo, after describing divination condemned in 18:14, says a prophet possessed by God will appear'
    key: seely-prophet-like-moses
    url: 'https://journal.interpreterfoundation.org/a-prophet-like-moses-deuteronomy-1815-18-in-the-book-of-mormon-the-bible-and-the-dead-sea-scrolls/'
    quote: 'After describing the nature of humans to seek after the future through divination and omens, as condemned in Deuteronomy 18:14, Philo says: “A prophet possessed by God will suddenly appear and give prophetic oracles” (De specialibus legibus 1:64–65).'
  - where: 'note 18:15 “Who the prophet is”'
    claim: 'Jesus declared after his resurrection that he fulfilled Moses’ prophecy; many Jews in his time used “that prophet” for the Messiah'
    key: scripture-helps-deut
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/18-deuteronomy-6-8-15-18-29-30-34?lang=eng'
    quote: 'After His Resurrection, Jesus Christ declared that He was the fulfillment of Moses’s prophecy.'
  - where: 'note 18:15 “Who the prophet is”'
    claim: 'Read in context the singular “prophet” is probably collective, a succession of prophets, like “king” in 17:14–20 and “the Levite” in 18:6'
    key: seely-prophet-like-moses
    url: 'https://journal.interpreterfoundation.org/a-prophet-like-moses-deuteronomy-1815-18-in-the-book-of-mormon-the-bible-and-the-dead-sea-scrolls/'
    quote: 'However, read in context it seems more likely that “prophet” is meant in a collective sense, referring to the future succession of prophets, just as the singular “king” in 17:14–20 refers to the institution of kingship and a succession of kings, and “the Levite” in 18:6 refers to the institution and succession of Levites.'
  - where: 'note 18:15 “Who the prophet is”'
    claim: 'Later interpreters read a single future individual; intertestamental readers mostly identified him as Elijah'
    key: seely-prophet-like-moses
    url: 'https://journal.interpreterfoundation.org/a-prophet-like-moses-deuteronomy-1815-18-in-the-book-of-mormon-the-bible-and-the-dead-sea-scrolls/'
    quote: 'interpreters in the inter-testamental period began to read this passage as referring to a single future prophet, and identified the specific future prophet as Elijah'
  - where: 'note 18:15 “Who the prophet is”'
    claim: 'Identifying the prophet as the Messiah is distinctive to the New Testament; its presence in the Book of Mormon best explained by prophetic foresight'
    key: seely-prophet-like-moses
    url: 'https://journal.interpreterfoundation.org/a-prophet-like-moses-deuteronomy-1815-18-in-the-book-of-mormon-the-bible-and-the-dead-sea-scrolls/'
    quote: 'the identification of this prophet as the Messiah seems to be distinctive to Matthew and the New Testament. That this identification is also attested anciently in the Book of Mormon may be best explained by prophetic foresight.'
  - where: 'note 18:15 “Who the prophet is”'
    claim: 'The Book of Mormon both names Christ and develops other Moses-like prophets; for Latter-day Saints the prophecy fulfilled by Christ and others and continues through the Restoration'
    key: seely-prophet-like-moses
    url: 'https://journal.interpreterfoundation.org/a-prophet-like-moses-deuteronomy-1815-18-in-the-book-of-mormon-the-bible-and-the-dead-sea-scrolls/'
    quote: 'For Latter-day Saints the prophecy of Deuteronomy 18 that the Lord will raise up a prophet like Moses has been fulfilled in the past by Christ and others and continues to be fulfilled through the Restoration to the present day.'
  - where: 'note 18:15 “Who the prophet is”'
    claim: 'A dual fulfillment, embracing Christ’s first and second comings'
    key: benson-prophet-like
    url: 'https://rsc.byu.edu/vol-12-no-3-2011/prophet-like-unto-thee'
    quote: 'This is a prophecy that has a dual fulfillment; it embraces both Christ’s first and second comings.'
  - where: 'note 18:15 “Who the prophet is”'
    claim: 'Joseph Smith and his successors also represent a fulfillment'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'Like Jesus and the Israelite prophets who preceded him, the Prophet Joseph Smith also represents a fulfillment of this prophecy, as do his successors.'
  - where: 'note 18:15 “Who the prophet is”'
    claim: 'Scripture: Nephi, Peter, the risen Lord, Moroni identify the prophet as Christ; D&C 28:2'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/js-h/1?lang=eng'
    quote: 'He quoted also the third chapter of Acts, twenty-second and twenty-third verses, precisely as they stand in our New Testament. He said that that prophet was Christ'
  - where: 'note 18:16 “Why the promise begins at Horeb”'
    claim: 'Israel’s rejection of God’s immediate presence and request for human intermediaries was the basis of the prophecy (Ex. 20:18–19; Deut. 5:23–28); many scholars read it as an etiology of prophets'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'Because the Israelites’ rejection of the immediate presence of God and a request for human intermediaries served as the basis for the giving of this prophecy (compare Exodus 20:18–19 [MT 16–17]; Deuteronomy 5:23–28 [MT 19–24]), many biblical scholars have understood it as an etiology (or causal explanation) for the existence of prophets'
  - where: 'note 18:16 “Why the promise begins at Horeb”'
    claim: 'Moses functions as a prophet though rarely called one; 34:10 the only passage explicitly calling him prophet'
    key: seely-prophet-like-moses
    url: 'https://journal.interpreterfoundation.org/a-prophet-like-moses-deuteronomy-1815-18-in-the-book-of-mormon-the-bible-and-the-dead-sea-scrolls/'
    quote: 'and in chapter 34:10–12, the only passage that explicitly refers to Moses as a prophet (nabi’) in Deuteronomy or the Torah—besides the two passages in chapter 18 that imply Moses was a prophet.'
  - where: 'note 18:18 “My words in his mouth”'
    claim: '“Like Moses” evokes all Moses’ characteristics: leader, lawgiver, teacher, worker of miracles, one who spoke with the Lord face to face'
    key: seely-prophet-like-moses
    url: 'https://journal.interpreterfoundation.org/a-prophet-like-moses-deuteronomy-1815-18-in-the-book-of-mormon-the-bible-and-the-dead-sea-scrolls/'
    quote: 'The allusion to a prophet “like Moses” in verses 15–18 evokes all of the characteristics known of Moses through the biblical text: leader, lawgiver, teacher, worker of miracles, and one who received revelation and spoke with the Lord “face to face.”'
  - where: 'note 18:18 “My words in his mouth”'
    claim: 'Jeremiah’s call echoes Deut. 18:18 (“I put My words into your mouth”); he understood himself as a prophet like Moses; Samuel, Elijah portrayed as Moses-like'
    key: seely-prophet-like-moses
    url: 'https://journal.interpreterfoundation.org/a-prophet-like-moses-deuteronomy-1815-18-in-the-book-of-mormon-the-bible-and-the-dead-sea-scrolls/'
    quote: 'Jeremiah also understood himself to be a prophet like Moses. The account of his call in Jeremiah 1 shows parallels with the call of Moses in Exodus 3.'
  - where: 'note 18:18 “My words in his mouth”'
    claim: 'Samuel, Elijah shown as Moses-like prophets'
    key: seely-prophet-like-moses
    url: 'https://journal.interpreterfoundation.org/a-prophet-like-moses-deuteronomy-1815-18-in-the-book-of-mormon-the-bible-and-the-dead-sea-scrolls/'
    quote: 'The figure of Samuel shows characteristics of a prophet like Moses,4 and Römer notes, “Elijah is also constructed in comparison and contrast to Moses.”'
  - where: 'note 18:18 “My words in his mouth”'
    claim: '34:10 says none arose like Moses; Moses became the prophetic archetype; later prophets presented as like him; Jesus the prophet like Moses in the full sense'
    key: ot-minute-deut-rappleye
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1-6-8-15-18-29-30-34'
    quote: 'As the New Testament and Latter-day Saint scripture make clear, eventually Jesus rose up as the prophet like Moses in the full and complete sense.'
  - where: 'note 18:19 “I will require it of him”'
    claim: 'These raised-up prophets are legal witnesses; the penalty elsewhere expressed “cut off” or “destroyed from among the people”'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'These raised-up prophets constitute, in a legal sense, witnesses, as Deuteronomy 18:19 makes clear: “Whosoever will not hearken unto my words which he shall speak in my name, I will require it of him,” or, as the penalty is expressed elsewhere, “cut off from among the people”[57] or “destroyed from among the people.”'
  - where: 'note 18:19 “I will require it of him”'
    claim: 'Peter, adding “times of refreshing” and “restitution of all things,” referred to the Second Coming; those who will not hear will be destroyed at his Second Coming'
    key: benson-prophet-like
    url: 'https://rsc.byu.edu/vol-12-no-3-2011/prophet-like-unto-thee'
    quote: 'Instead of using Moses’ phrase regarding obedience (“God will require it of him”), Peter stated that those who will not hear the words of Jesus Christ will be destroyed at his Second Coming'
  - where: 'note 18:19 “I will require it of him”'
    claim: 'Acts 3:23 “destroyed from among the people”; JS–H 1:40 the day not yet come'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/3?lang=eng'
    quote: 'And it shall come to pass, that every soul, which will not hear that prophet, shall be destroyed from among the people.'
  - where: 'note 18:22 “The test of a prophet”'
    claim: 'Under this test true prophecy is known only by fulfillment; no prophecy has authority when proclaimed'
    key: sc-knowhy-554
    url: 'https://scripturecentral.org/knowhy/why-did-jacob-include-the-case-of-sherem'
    quote: 'True prophecy, in this case, will be known only by its fulfillment. Such a criterion means that no prophecy can have authority at the time of its proclamation.'
  - where: 'note 18:22 “The test of a prophet”'
    claim: 'The test works when fulfillment is expected in a short timeframe; Jeremiah and Hananiah'
    key: sc-knowhy-554
    url: 'https://scripturecentral.org/knowhy/why-did-jacob-include-the-case-of-sherem'
    quote: 'This approach could work when a prophecy’s fulfillment was expected to take place in a reasonably short timeframe.'
  - where: 'note 18:22 “The test of a prophet”'
    claim: 'For Jacob’s prophecies “many hundred years hence” the test would not work; Sherem perhaps argued that such prophecies should not be tolerated under the law'
    key: sc-knowhy-554
    url: 'https://scripturecentral.org/knowhy/why-did-jacob-include-the-case-of-sherem'
    quote: 'In the case of Sherem and Jacob, however, this practical prophetic test would not work because the prophecies were “many hundred years hence” (Jacob 7:7).'
  - where: 'note 18:22 “The test of a prophet”'
    claim: 'False prophecy a capital offense (Deut. 18:20); Noah’s priests sought it against Abinadi'
    key: sc-knowhy-89
    url: 'https://scripturecentral.org/knowhy/why-would-noahs-priests-quiz-abinadi-on-isaiah'
    quote: 'they were looking for a legal cause of action “wherewith to accuse” Abinadi. False prophecy being a capital offense, those found guilty of it were worthy of death (Deuteronomy 18:20).'
  - where: christ
    claim: 'Matthew presents Jesus as a prophet like Moses; Nephi and Abinadi expound that this prophet is the Holy One of Israel, God himself come down'
    key: benson-prophet-like
    url: 'https://rsc.byu.edu/vol-12-no-3-2011/prophet-like-unto-thee'
    quote: 'This points to Nephi’s and Abinadi’s fuller expositions of Moses’ prophecy that this prophet is the “Holy One of Israel” (1 Nephi 22:21), or “God himself [who] shall come down among the children of men” (Mosiah 13:34; 15:1).'
  - where: christ
    claim: 'Matthew 5: the Sermon on the Mount shows Jesus as a lawgiver like Moses'
    key: benson-prophet-like
    url: 'https://rsc.byu.edu/vol-12-no-3-2011/prophet-like-unto-thee'
    quote: 'Matthew 5 follows with the giving of the new law, the Sermon on the Mount, which shows that Jesus is a lawgiver like Moses.'
