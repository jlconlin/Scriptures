chapter: 11
claims:
  - where: when
    claim: 'Moses speaks in the fortieth year, in the land of Moab'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/1?lang=eng'
    quote: 'And it came to pass in the fortieth year, in the eleventh month, on the first day of the month, that Moses spake unto the children of Israel'

  # ---------- setting ----------
  - where: setting
    claim: 'The second discourse has two parts: 5–11 the exposition of the commandments, 12–26 a code of laws'
    key: bd-deuteronomy
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/deuteronomy?lang=eng'
    quote: 'The second discourse (Deut. 5–26) consists of two parts: (1) 5–11, the Ten Commandments and a practical exposition of them, (2) 12–26, a code of laws'
  - where: setting
    claim: 'In the covenant pattern, 4:45–11:32 are the general stipulations and 12–26 the specific'
    key: ot-minute-deut-rappleye
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1-6-8-15-18-29-30-34'
    quote: 'General stipulations … 4:45–11:32 … Specific stipulations … 12:1–26:19'
  - where: setting
    claim: 'The Shema is 6:4–9, 11:13–21 and Num. 15:37–41, recited twice daily'
    key: ot-manual-dt-1-16
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/deuteronomy-1-16-an-exhortation-to-obedience-part-1?lang=eng'
    quote: 'The entire Shema, which consists of Deuteronomy 6:4–9; Deuteronomy 11:13–21; and Numbers 15:37–41 (in that order), is recited twice daily by all devout Jews as an evening and a morning prayer.'
  - where: setting
    claim: 'Joshua carries out the ceremony on Gerizim and Ebal'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/8?lang=eng'
    quote: 'half of them over against mount Gerizim, and half of them over against mount Ebal; as Moses the servant of the Lord had commanded before, that they should bless the people of Israel.'

  # ---------- thread ----------
  - where: thread
    claim: 'Verses 10–12 give a fresh motive founded on the nature of the land'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/11.htm'
    quote: 'In Deuteronomy 11:10-12 Moses adduces a fresh motive for his admonition to keep the law with fidelity, founded upon the peculiar nature of the land.'
  - where: thread
    claim: 'Verses 26–32 are a concluding summary; the blessing and curse are transferred to the land'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/11.htm'
    quote: 'Concluding summary. "I set before you this day the blessing and the curse." … should give utterance to them there, and as it were transfer them to the land'
  - where: thread
    claim: 'The book follows a covenant pattern in which blessings and curses come at 28:1–29:1'
    key: ot-minute-deut-rappleye
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1-6-8-15-18-29-30-34'
    quote: 'the entire book of Deuteronomy is structured according to a covenant/treaty pattern commonly known and understood in the ancient Near East. … Blessings and curses … 28:1–29:1'

  # ---------- note 11:2 ----------
  - where: 'note 11:2 “Who had seen the plagues”'
    claim: 'The Exodus generation had largely died; those entering had been children or unborn'
    key: ot-minute-deut-rappleye
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1-6-8-15-18-29-30-34'
    quote: 'In that time, the original Exodus generation had largely passed away, and those about to enter the land had either been children or not yet born when God made His covenant with Israel at Mount Sinai.'
  - where: 'note 11:2 “Who had seen the plagues”'
    claim: 'The sentence fell on those twenty and older; the little ones would be brought in'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/14?lang=eng'
    quote: 'all that were numbered of you, according to your whole number, from twenty years old and upward … But your little ones, which ye said should be a prey, them will I bring in'
  - where: 'note 11:6 “Dathan and Abiram, without Korah”'
    claim: 'Dathan and Abiram, Reubenites, joined Korah; their refusal and the earth swallowing them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/16?lang=eng'
    quote: 'And Moses sent to call Dathan and Abiram, the sons of Eliab: which said, We will not come up: Is it a small thing that thou hast brought us up out of a land that floweth with milk and honey, to kill us in the wilderness'
  - where: 'note 11:6 “Dathan and Abiram, without Korah”'
    claim: 'They were swallowed together with Korah, but Korah''s children did not die'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/26?lang=eng'
    quote: 'And the earth opened her mouth, and swallowed them up together with Korah, when that company died … Notwithstanding the children of Korah died not.'
  - where: 'note 11:6 “Dathan and Abiram, without Korah”'
    claim: 'Moses omits Korah probably out of regard for his surviving sons'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/11.htm'
    quote: 'Here Moses only mentions Dathan and Abiram, the followers of Korah, and not Korah himself, probably from regard to his sons, who were not swallowed up by the earth along with their father, but had lived to perpetuate the family of Korah.'

  # ---------- note 11:10 ----------
  - where: 'note 11:10 “Watered by foot, or by heaven”'
    claim: 'Egypt has hardly any rain; its watering depended on the Nile, canals, machines and vessels; Canaan depended on the Lord'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/11.htm'
    quote: 'so that it depended entirely upon the Lord how long its inhabitants should live therein. … In Egypt there is hardly any rain at all … by the construction of canals and ponds throughout the land'
  - where: 'note 11:10 “Watered by foot, or by heaven”'
    claim: '“With thy foot” probably refers to water wheels worked by the feet'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/11.htm'
    quote: 'The expression, "with thy foot," probably refers to the large pumping wheels still in use there, which are worked by the feet'
  - where: 'note 11:10 “Watered by foot, or by heaven”'
    claim: 'Israel sits at the edge of the storm belt; some years parts of the land get no rain'
    key: ogden-1980-testing-ground
    url: 'https://www.churchofjesuschrist.org/study/ensign/1980/09/the-testing-ground-for-the-covenant-people?lang=eng'
    quote: 'Israel sits at the southern edge of the European storm belt systems, which means that in some years parts of the land may be untouched by rain.'
  - where: 'note 11:10 “Watered by foot, or by heaven”'
    claim: 'Through the land and its rainfall God would try his people'
    key: ogden-1980-testing-ground
    url: 'https://www.churchofjesuschrist.org/study/ensign/1980/09/the-testing-ground-for-the-covenant-people?lang=eng'
    quote: 'Through the land itself—its topography, its natural highways, its soils, its climate, its rainfall—God would try his people.'
  - where: 'note 11:14 “The early and the late rain”'
    claim: 'Early rain October–December; winter rain January–February; latter rain March–April; little rain May–September'
    key: bd-rain
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/rain?lang=eng'
    quote: 'In Palestine rain begins to fall in October and continues in November and early December (the “early rain”). During January and February the vital “winter rain” soaks the soil and fills the cisterns. The biblical “latter rain” comes in March and April.'
  - where: 'note 11:14 “The early and the late rain”'
    claim: 'After May rain hardly falls until late September'
    key: bd-rain
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/rain?lang=eng'
    quote: 'Showers may occur in May, but after this, rain hardly ever falls until the end of September'
  - where: 'note 11:17 “When the heavens were shut”'
    claim: 'A biblical famine in Canaan generally meant no rain; Elijah''s drought is among them'
    key: ogden-1980-testing-ground
    url: 'https://www.churchofjesuschrist.org/study/ensign/1980/09/the-testing-ground-for-the-covenant-people?lang=eng'
    quote: 'An account in the Bible of a famine in Canaan (such as … that resulted from Elijah’s curse on Israel), simply means it didn’t rain that year. Famine generally meant no rain.'
  - where: 'note 11:17 “When the heavens were shut”'
    claim: 'Elijah seals the heavens'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/17?lang=eng'
    quote: 'there shall not be dew nor rain these years, but according to my word.'
  - where: 'note 11:17 “When the heavens were shut”'
    claim: 'Nephi asks for famine instead of the sword'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/hel/11?lang=eng'
    quote: 'rather let there be a famine in the land, to stir them up in remembrance of the Lord their God, and perhaps they will repent and turn unto thee.'
  - where: 'note 11:17 “When the heavens were shut”'
    claim: 'The KnoWhy cites Deut. 11:10–17 for Israel''s promise of rain for righteousness and famine for wickedness, in its study of Nephi''s famine'
    key: sc-knowhy-750
    url: 'https://scripturecentral.org/knowhy/what-caused-the-famine-in-the-seventy-third-year-of-the-reign-of-the-judges'
    quote: 'See Deuteronomy 11:10–17; 28:1, 11–12, 15, 23–24.'
  - where: 'note 11:17 “When the heavens were shut”'
    claim: 'Israel was promised rain for righteousness and famine for wickedness'
    key: sc-knowhy-750
    url: 'https://scripturecentral.org/knowhy/what-caused-the-famine-in-the-seventy-third-year-of-the-reign-of-the-judges'
    quote: 'However, ancient Israelites were generally promised rainfall for righteousness and famine for wickedness, and they thus depended on rainfall from God for survival.'
  - where: 'note 11:24 “How far the promised border reached”'
    claim: 'The Euphrates boundary was promised to Abraham and reached in David''s time'
    key: bd-euphrates
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/euphrates?lang=eng'
    quote: 'It was the boundary of the land promised to the seed of Abraham (Gen. 15:18; Deut. 1:7; Josh. 1:4; 1 Chr. 5:9); this boundary was reached in the time of David (2 Sam. 8:3; 1 Chr. 18:3).'
  - where: 'note 11:24 “How far the promised border reached”'
    claim: 'The promise is conditional on keeping the commandments'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/11?lang=eng'
    quote: 'For if ye shall diligently keep all these commandments which I command you, to do them'

  # ---------- note 11:29 ----------
  - where: 'note 11:29 “Gerizim and Ebal”'
    claim: 'Shechem lies among the mountains of Ephraim by Ebal and Gerizim; Abram visited it first'
    key: bd-shechem
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/shechem?lang=eng'
    quote: 'situated in a beautiful plain among the mountains of Ephraim, close to the two hills Ebal and Gerizim. It was visited by Abram on his first arrival in the promised land (Gen. 12:6)'
  - where: 'note 11:29 “Gerizim and Ebal”'
    claim: 'Abram at Sichem, the plain of Moreh, received the promise and built an altar'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/12?lang=eng'
    quote: 'And Abram passed through the land unto the place of Sichem, unto the plain of Moreh.'
  - where: 'note 11:29 “Gerizim and Ebal”'
    claim: 'Moses chose two prominent hills as object lessons'
    key: ot-manual-dt-1-16
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/deuteronomy-1-16-an-exhortation-to-obedience-part-1?lang=eng'
    quote: 'To symbolize them, Moses selected two of the most prominent hills in central Canaan to use as object lessons.'
  - where: 'note 11:29 “Gerizim and Ebal”'
    claim: 'Six tribes on each mountain'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/27?lang=eng'
    quote: 'These shall stand upon mount Gerizim to bless the people … And these shall stand upon mount Ebal to curse'
  - where: 'note 11:29 “Gerizim and Ebal”'
    claim: 'Joshua built an altar on Ebal and read the blessings and cursings with half the people toward each mountain'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/8?lang=eng'
    quote: 'And afterward he read all the words of the law, the blessings and cursings, according to all that is written in the book of the law.'
  - where: 'note 11:29 “Gerizim and Ebal”'
    claim: 'Joshua''s altar, offerings and written law recall Moses at Sinai'
    key: parker-cutting
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/cutting-covenants'
    quote: 'Joshua built an altar, slaughtered animals for burnt and peace offerings, and wrote upon stones a copy of the law of Moses (see Joshua 8:30–32), reminding us of Moses’s actions at Sinai (see Exodus 24:4–8).'

  # ---------- christ ----------
  - where: christ
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary (see Mosiah 3:8; 15:1; 3 Ne. 15:1–5; D&C 110:1–10).'
  - where: christ
    claim: 'The footnote to verse 29 points to John 4:20'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/11?lang=eng'
    quote: '29b “Gerizim”: Judg. 9:7; John 4:20.'
  - where: christ
    claim: 'The Samaritan woman speaks of worship in this mountain'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/4?lang=eng'
    quote: 'Our fathers worshipped in this mountain; and ye say, that in Jerusalem is the place where men ought to worship.'
  - where: christ
    claim: 'The Samaritans built a rival temple on Mount Gerizim'
    key: bd-samaritans
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/samaritans?lang=eng'
    quote: 'they became, as the books of Ezra and Nehemiah show, bitter opponents of the Jews, and started a rival temple of their own on Mount Gerizim.'

  # ---------- added in review ----------
  - where: 'note 11:2 “Who had seen the plagues”'
    claim: 'The children of v. 2 had not known what God did for their fathers'
    key: ot-manual-dt-1-16
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/deuteronomy-1-16-an-exhortation-to-obedience-part-1?lang=eng'
    quote: 'Moses pointed out to Israel that the children were not aware of all that God had done for their fathers while they were wandering in the wilderness (see v. 2).'
  - where: 'note 11:29 “Gerizim and Ebal”'
    claim: 'Joshua placed the ark in the valley between Gerizim and Ebal'
    key: parker-cutting
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/cutting-covenants'
    quote: 'Then Joshua divided Israel in half and placed the ark of the covenant in the valley between Mount Gerizim and Mount Ebal.'
