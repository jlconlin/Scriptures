chapter: 27
claims:
  - where: setting
    claim: 'Chapters 27–30 are the third discourse, a solemn renewal of the covenant with blessings and curses'
    key: bd-deuteronomy
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/deuteronomy?lang=eng'
    quote: 'The third discourse (Deut. 27–30) contains a solemn renewal of the covenant and an announcement of the blessings of obedience and the curses upon disobedience.'
  - where: setting
    claim: 'The ceremony was to take place at Shechem, between Ebal and Gerizim, once Israel crossed the Jordan'
    key: seely-covenant-renewal
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/restoration-covenant-renewal'
    quote: 'a formal covenant-renewal ceremony that was to take place at Shechem and on the mountains of Ebal and Gerizim that rise on either side of this town.'
  - where: setting
    claim: 'Blessings and cursings for keeping or breaking the covenant belong to the ancient covenant pattern and are present at Ebal'
    key: sc-knowhy-35
    url: 'https://scripturecentral.org/knowhy/why-does-jacob-declare-so-many-woes'
    quote: 'Covenants in the ancient world followed a specific pattern in which the stipulations were laid out, and consequences of keeping or breaking the covenant were explained. … Both blessings and cursings are also present in the covenant renewal at Mt. Ebal (see Deuteronomy 27–28).'
  - where: setting
    claim: 'Joshua carried out the instructions after Ai: altar on Ebal, sacrifices, law on stones, tribes on the two mountains, Levites with the ark between, the people answering Amen'
    key: scripture-helps-josh
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/19-joshua-1-8-23-24?lang=eng'
    quote: 'Here Joshua carried out the instructions Moses had given at the end of his mortal life: Joshua built an altar on Mount Ebal, offered sacrifices, and wrote a copy of the law of Moses on stones.'
  - where: thread
    claim: 'The twelve curses are examples, mostly of sins easily hidden from the judges; the last covers every breach'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/27.htm'
    quote: 'From this last curse, which applied to every breach of the law, it evidently follows, that the different sins and transgressions already mentioned were only selected by way of example, and for the most part were such as could easily be concealed from the judicial authorities.'
  - where: 'note 27:2 “Law written on plastered stones”'
    claim: 'The stones were coated with lime or plaster and the law written on the coating, as in Egypt'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/27.htm'
    quote: 'The writing, therefore, was not to be cut into the stones and then covered with lime (as J. D. Mich., Ros.), but to be inscribed upon the plaistered stones, as was the custom in Egypt'
  - where: 'note 27:2 “Law written on plastered stones”'
    claim: '“All the words of this law” meant the legal part of the Mosaic law, not only the curses and not the whole Pentateuch with its narratives'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/27.htm'
    quote: 'not, indeed, the entire Pentateuch, with its historical narratives, its geographical, ethnographical, and other notices, but simply the legal part of it - the commandments, statutes, and rights of the Thorah.'
  - where: 'note 27:2 “Law written on plastered stones”'
    claim: 'Joshua wrote a copy of the law of Moses on stones'
    key: scripture-helps-josh
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/19-joshua-1-8-23-24?lang=eng'
    quote: 'Joshua built an altar on Mount Ebal, offered sacrifices, and wrote a copy of the law of Moses on stones.'
  - where: 'note 27:4 “Ebal, or Gerizim?”'
    claim: 'The Samaritan Pentateuch reads Gerizim at Deut. 27:4 and the Samaritans held Gerizim to be the place of worship'
    key: matson-between-testaments
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/between-testaments'
    quote: 'One such tradition is the belief that the properly designated location for a central place of worship was Mount Gerizim, not Mount Ebal or, as later dictated, Jerusalem (see Samaritan Pentateuch, Deuteronomy 27:4). This belief was further manifested at this time by the building of a temple.'
  - where: 'note 27:4 “Ebal, or Gerizim?”'
    claim: 'The Samaritans kept only their own version of the Torah'
    key: matson-between-testaments
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/between-testaments'
    quote: 'the Samaritans only adhered to their own version of the Torah (known as the Samaritan Pentateuch) with divergent traditions.'
  - where: 'note 27:4 “Ebal, or Gerizim?”'
    claim: 'The Hebrew (Masoretic) text reads Ebal in verse 4'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'עֵיבָ֑ל'
  - where: 'note 27:9 “This day thou art become the people of the LORD”'
    claim: 'This is one of the first covenant-renewal ceremonies in the Bible, at a time of transition, in which the people publicly recommitted themselves in a ceremony like the first'
    key: seely-covenant-renewal
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/restoration-covenant-renewal'
    quote: 'This is one of the first references to a covenant-renewal ceremony in the Bible, typically recorded at a time of crisis or transition, in which the people publicly recommitted themselves to the covenant in a ceremony similar to that of the initial establishment of the covenant.'
  - where: 'note 27:9 “This day thou art become the people of the LORD”'
    claim: 'Joshua later renewed the covenant at Shechem between Ebal and Gerizim, as Moses prescribed (Josh. 24)'
    key: seely-covenant-renewal
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/restoration-covenant-renewal'
    quote: 'Joshua, just before his death, called for an assembly of the people at Shechem as prescribed by Moses, between the twin mountains of Ebal and Gerizim, in order to renew the covenant.'
  - where: 'note 27:12 “Who stood on which mountain”'
    claim: 'The blessing tribes descend from Jacob''s two wives; the cursing tribes are Reuben, Zebulun and the four sons of the maids'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/27.htm'
    quote: 'The blessing was to be uttered by the tribes of Simeon, Levi, Judah, Issachar, Joseph, and Benjamin, who sprang from the two wives of Jacob; and the curse by Reuben, with the two sons of Leah''s maid Zilpah, and by Zebulun, with Dan and Naphtali, the sons of Rachel''s maid Bilhah.'
  - where: 'note 27:12 “Who stood on which mountain”'
    claim: 'One older reading: Reuben was moved for his forfeited birthright and Zebulun as Leah''s youngest, to make two sixes'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/27.htm'
    quote: 'But in order to secure the division into two sixes, it was necessary that two of the eight sons of the wives should be associated with those who pronounced the curses. The choice fell upon Reuben, because he had forfeited his right of primogeniture by his incest (Genesis 49:4), and upon Zebulun, as the youngest son of Leah.'
  - where: 'note 27:12 “Who stood on which mountain”'
    claim: 'In Joshua''s ceremony half the tribes stood on each mountain and the Levites with the ark between'
    key: scripture-helps-josh
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/19-joshua-1-8-23-24?lang=eng'
    quote: 'Then half the tribes of Israel stood on Mount Gerizim and the other half on Mount Ebal. The Levites, bearing the ark of the covenant, stood in the valley between the two mountains.'
  - where: 'note 27:15 “The people’s Amen”'
    claim: 'Amen means firm, true; in Deut. 27:15–26 it denotes acceptance; it was the proper response to an oath'
    key: bd-amen
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/amen?lang=eng'
    quote: 'Firm, true. The word is used to denote acceptance (Deut. 27:15–26) or truthfulness (1 Kgs. 1:36). Amen was the proper response of a person to whom an oath was administered'
  - where: 'note 27:26 “Confirmeth not all the words of this law”'
    claim: '“Confirmeth” is yaqim, the causative of qum, the same verb as “set up” the stones in verse 4'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'יָקִ֛ים'
  - where: 'note 27:26 “Confirmeth not all the words of this law”'
    claim: '“Set up” in verse 4 is the same verb'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'תָּקִ֜ימוּ'
  - where: 'note 27:26 “Confirmeth not all the words of this law”'
    claim: 'The verb qum means arise, stand, establish, confirm'
    key: biblehub-interlinear
    url: 'https://biblehub.com/hebrew/6965.htm'
    quote: 'qum: Arise, stand, establish, confirm, endure, fulfill'
  - where: 'note 27:26 “Confirmeth not all the words of this law”'
    claim: 'The Hebrew reads “the words of this law” with no word for “all” before them'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'דִּבְרֵ֥י'
  - where: 'note 27:26 “Confirmeth not all the words of this law”'
    claim: 'The Septuagint reads “every man” and “all the words”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/deuteronomy/27.htm'
    quote: '26Cursed is every man that continues not in all the words of this law to do them: and all the people shall say, So be it.'
  - where: christ
    claim: 'Christ is called the Amen, the faithful and true witness'
    key: bd-amen
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/amen?lang=eng'
    quote: 'Christ is called “the Amen, the faithful and true witness” (Rev. 3:14; see also John 14:6; 1 Cor. 14:16; 2 Cor. 1:20).'
