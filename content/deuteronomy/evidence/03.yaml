chapter: 3
claims:
  # ---------- when / setting / thread ----------
  - where: 'when'
    claim: 'Moses speaks in the plains of Moab in the fortieth year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/1?lang=eng'
    quote: 'And it came to pass in the fortieth year, in the eleventh month, on the first day of the month, that Moses spake unto the children of Israel'
  - where: 'setting'
    claim: 'The first discourse is chapters 1–4 and is introductory'
    key: bd-deuteronomy
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/deuteronomy?lang=eng'
    quote: 'The first discourse is found in Deut. 1–4 and is introductory.'
  - where: 'setting'
    claim: 'Numbers tells the battle with Og at Edrei in three verses, with the same words “Fear him not”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/21?lang=eng'
    quote: 'And the Lord said unto Moses, Fear him not: for I have delivered him into thy hand, and all his people, and his land'
  - where: 'setting'
    claim: 'Numbers 32 tells the grant of land east of the Jordan; Reuben and Gad had much cattle'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/32?lang=eng'
    quote: 'Now the children of Reuben and the children of Gad had a very great multitude of cattle: and when they saw the land of Jazer, and the land of Gilead, that, behold, the place was a place for cattle'
  - where: 'setting'
    claim: 'Numbers 27 tells Moses being shown the land and Joshua appointed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/27?lang=eng'
    quote: 'Get thee up into this mount Abarim, and see the land which I have given unto the children of Israel.'
  - where: 'setting'
    claim: 'Bashan: the district east of Jordan and north of Gilead, rich in grain and cattle'
    key: bd-bashan
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/bashan?lang=eng'
    quote: 'The district east of Jordan and north of Gilead, assigned to Manasseh … It was an area rich in grain production and known for its breed of cattle (Ps. 22:12)'
  - where: 'setting'
    claim: 'Moses prayer to cross is not recorded in the other accounts (Numbers)'
    key: cambridge-deuteronomy
    url: 'https://biblehub.com/commentaries/cambridge/deuteronomy/3.htm'
    quote: 'To this prayer there is no parallel in JE … Nor does P record the prayer; it ascribes the exclusion of Moses to his own sin at Ḳadesh'
  - where: 'thread'
    claim: 'The divisions 1–7 and 8–17, and 18–29 as the charges and the refusal'
    key: ot-minute-deut-3
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-3'
    quote: 'Deuteronomy 3:1–7 Victory over the second Amorite king.'
  - where: 'thread'
    claim: 'Division 8–17: the land east of Jordan given to Reuben, Gad and half of Manasseh'
    key: ot-minute-deut-3
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-3'
    quote: 'Deuteronomy 3:8–17 Reuben, Gad, and half of Manasseh received land inheritances on the east of Jordan.'
  - where: 'thread'
    claim: 'Division 23–29: Moses prayer and its rejection'
    key: cambridge-deuteronomy
    url: 'https://biblehub.com/commentaries/cambridge/deuteronomy/3.htm'
    quote: '23–29. Moses’ Prayer and its Rejection'
  - where: 'thread'
    claim: '“Fear him not” is the same exhortation the fathers heard nearly forty years before (1:21, 29)'
    key: ot-minute-deut-3
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-3'
    quote: 'This is the same exhortation the Lord had given the children of Israel nearly forty years earlier (Deuteronomy 1:21, 29) and again more immediately with their victory over the first Amorite king (2:24).'
  - where: 'thread'
    claim: 'The conquest of walled cities answers the forefathers fear of cities “walled up to heaven” (1:28)'
    key: ot-minute-deut-3
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-3'
    quote: 'Moses’s rather pithy account here in Deuteronomy of conquering all their armies and cities (which their faithless forefathers had originally described as “walled up to heaven” in Deuteronomy 1:28) emphasizes the miraculous power of God.'
  - where: 'thread'
    claim: 'Moses points Joshua to what he had seen as a pledge for what was to come'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/3.htm'
    quote: 'namely, to the defeat of the two kings of the Amorites, in which the pledge was contained, that the faithful covenant God would complete the work He had begun'
  - where: 'thread'
    claim: 'Looking back on God’s saving acts gives faith for future battles (3:21–22)'
    key: ot-minute-deut-3
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-3'
    quote: 'Looking back on God’s saving acts promotes faith for future battles, providing a template for overcoming the temptation to “fear them” (verse 22).'
  - where: 'section 3 plain'
    claim: '“All that are meet for the war” is the men of valor'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/3?lang=eng'
    quote: '18a “all”: HEB all the men of valor.'
  - where: 'section 2 plain'
    claim: '“On this side Jordan” is in Hebrew “beyond the Jordan”; the plain is the Arabah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/3?lang=eng'
    quote: '8a “on this side Jordan”: HEB beyond the Jordan.'

  # ---------- note 3:6 ----------
  - where: 'note 3:6 “The same as at Heshbon”'
    claim: 'In both cases Israel conquered just as God had promised'
    key: ot-minute-deut-3
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-3'
    quote: '3:6. “even as we did unto Sihon.” In both cases, the Israelites conquered just as God had promised they would (see 3:2; also 2:24, 31).'
  - where: 'note 3:6 “The same as at Heshbon”'
    claim: 'At Sihon’s cities the men, women and little ones were destroyed and the cattle and spoil kept'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/2?lang=eng'
    quote: 'Only the cattle we took for a prey unto ourselves, and the spoil of the cities which we took.'

  # ---------- note 3:11 ----------
  - where: 'note 3:11 “Og’s bed”'
    claim: 'The Rephaim were a pre-Israelite people noted for great stature'
    key: bd-rephaim
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/rephaim?lang=eng'
    quote: 'Giants. A pre-Israelite people in Palestine, noted for their great stature (Gen. 14:5; 15:20; Deut. 2:11, 20; 3:11, 13; Josh. 12:4; 13:12; 17:15).'
  - where: 'note 3:11 “Og’s bed”'
    claim: 'The cubit of a man is the common cubit, about eighteen inches'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/3?lang=eng'
    quote: '11d “cubit”: OR common cubit; about 18 inches or 45 centimeters.'
  - where: 'note 3:11 “Og’s bed”'
    claim: 'Og seems to have been a giant; the bed measures 13½ by 6 feet; the bed recalls God’s power over a great foe'
    key: ot-minute-deut-3
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-3'
    quote: 'Og seems to have been a physical giant. The cubit dimensions we have of his bed measure thirteen and a half feet long by six feet wide, making it big enough to fit a gigantic human being.'
  - where: 'note 3:11 “Og’s bed”'
    claim: 'The detail recalls the scouts report of people greater and taller (1:28; Num. 13:33)'
    key: ot-minute-deut-3
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-3'
    quote: 'We are reminded of this when the original Israelite scouts claimed that the inhabitants of the promised land were “greater and taller than we'
  - where: 'note 3:11 “Og’s bed”'
    claim: 'Moses emphasized that the Lord can overcome every obstacle'
    key: ot-minute-deut-3
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-3'
    quote: 'Here Moses emphasized that the Lord is powerful enough to overcome every obstacle, no matter how enormous or impossible it may appear.'
  - where: 'note 3:11 “Og’s bed”'
    claim: 'One older reading: nothing to amaze in the size; a bed is larger than its sleeper'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/3.htm'
    quote: 'There is nothing to amaze is in the size of the bed or bedstead given here. … Now a bed is always larger than the man who sleeps in it.'
  - where: 'note 3:11 “Og’s bed”'
    claim: 'Moses points to the bed as still in Rabbath-Ammon'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/3.htm'
    quote: 'Moses points to the iron bed of this king, which was still in Rabbath-Ammon, and was nine cubits long and four broad'
  - where: 'note 3:11 “Og’s bed”'
    claim: 'Another older reading: ʿereś, elsewhere couch, here a sarcophagus; “iron” basalt; stone coffins at sites east of the Jordan'
    key: cambridge-deuteronomy
    url: 'https://biblehub.com/commentaries/cambridge/deuteronomy/3.htm'
    quote: 'Bedstead, rather sarcophagus, for though the Heb. ‘eres elsewhere means couch … Iron, rather basalt; I have often heard basalt called iron in Ḥauran. … Some sites in E. Palestine are strewn with stone-coffins'

  # ---------- note 3:18 ----------
  - where: 'note 3:18 “Armed before their brethren”'
    claim: 'Reuben and Gad asked for the land because it suited their cattle, and not to be taken over Jordan'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/32?lang=eng'
    quote: 'Wherefore, said they, if we have found grace in thy sight, let this land be given unto thy servants for a possession, and bring us not over Jordan.'
  - where: 'note 3:18 “Armed before their brethren”'
    claim: 'Moses asked whether their brethren should go to war while they sat'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/32?lang=eng'
    quote: 'Shall your brethren go to war, and shall ye sit here?'
  - where: 'note 3:18 “Armed before their brethren”'
    claim: 'They offered to go armed before Israel; Moses made the land conditional on it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/32?lang=eng'
    quote: 'But we ourselves will go ready armed before the children of Israel, until we have brought them unto their place'
  - where: 'note 3:18 “Armed before their brethren”'
    claim: 'Numbers 32 gives the context of the requirement that they provide military support'
    key: ot-minute-deut-3
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-3'
    quote: 'We learn in Numbers 32 that these tribes who had many herds had requested to receive the livestock-friendly lands of Bashan and the northern parts of Transjordan.'
  - where: 'note 3:18 “Armed before their brethren”'
    claim: 'Joshua dismisses the tribes, saying they kept what Moses commanded and the LORD has given rest'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/22?lang=eng'
    quote: 'And now the Lord your God hath given rest unto your brethren, as he promised them: therefore now return ye, and get you unto your tents'

  # ---------- note 3:24 ----------
  - where: 'note 3:24 “What Moses had seen begun”'
    claim: 'One older reading: “begun to shew” refers less to Egypt than to the defeat of the kings east of Jordan; Moses asks to see the completion'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/3.htm'
    quote: 'As the Lord had already begun to show him His greatness and His mighty hand, so might He also show him the completion of His work. The expression, "begun to show Thy greatness," relates not so much to the mighty acts of the Lord in Egypt'
  - where: 'note 3:24 “What Moses had seen begun”'
    claim: 'Moses besought God to finish what He had begun'
    key: cambridge-deuteronomy
    url: 'https://biblehub.com/commentaries/cambridge/deuteronomy/3.htm'
    quote: 'At that time Moses besought God to finish what He had begun and show him all His greatness (Deuteronomy 3:23 f.), by letting him cross Jordan and view the whole land'
  - where: 'note 3:24 “What Moses had seen begun”'
    claim: 'The question “what God is there” sets Israel against its polytheistic neighbors'
    key: ot-minute-deut-3
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-3'
    quote: 'Moses’s exuberant (and for us modern readers, rhetorical) question highlights the difference between monotheistic Israel and their polytheistic neighbors.'

  # ---------- note 3:26 barred ----------
  - where: 'note 3:26 “Why Moses could not cross”'
    claim: 'Numbers: told to speak to the rock, Moses spoke to the rebels and smote it twice; the LORD’s sentence'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/20?lang=eng'
    quote: 'Because ye believed me not, to sanctify me in the eyes of the children of Israel, therefore ye shall not bring this congregation into the land which I have given them.'
  - where: 'note 3:26 “Why Moses could not cross”'
    claim: 'Numbers 27 repeats the reason when Moses is shown the land'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/27?lang=eng'
    quote: 'For ye rebelled against my commandment in the desert of Zin, in the strife of the congregation, to sanctify me at the water before their eyes'
  - where: 'note 3:26 “Why Moses could not cross”'
    claim: 'The verb at 3:26 means infuriate oneself'
    key: bdb
    url: 'https://biblehub.com/hebrew/5674.htm'
    quote: '[עָבַר] verb denominative Hithpa`el be arrogant, infuriate oneself; — … Imperfect3masculine singular וַיִּתְעַבֵּר Deuteronomy 3:26'
  - where: 'note 3:26 “Why Moses could not cross”'
    claim: 'Scripture Helps: Moses and Aaron chastened for straying from instructions and failing to sanctify the Lord'
    key: scripture-helps-num
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/17-numbers-11-14-20-24-27?lang=eng'
    quote: 'The Lord chastened Moses and Aaron for straying from his instructions and for failing to “sanctify [Him] in the eyes of the children of Israel.”'
  - where: 'note 3:26 “Why Moses could not cross”'
    claim: 'The scriptures do not fully explain the reasons; it did not disqualify him from later blessings'
    key: scripture-helps-num
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/17-numbers-11-14-20-24-27?lang=eng'
    quote: 'Although the scriptures do not fully explain the reasons for this consequence, Moses’s actions did not disqualify him from all future responsibilities and blessings.'
  - where: 'note 3:26 “Why Moses could not cross”'
    claim: 'Moses’ later work: the keys of gathering brought to Joseph Smith and Oliver Cowdery'
    key: scripture-helps-num
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/17-numbers-11-14-20-24-27?lang=eng'
    quote: 'As a translated being, Moses appeared at the Mount of Transfiguration and bestowed priesthood keys upon Peter, James, and John. Moses also appeared to Joseph Smith and Oliver Cowdery in our dispensation as a resurrected being, conferring upon them the keys of the gathering of Israel.'
  - where: 'note 3:26 “Why Moses could not cross”'
    claim: 'Allred: reading Deuteronomy’s context, Moses may have displeased the Lord in the matter of the spies'
    key: ot-minute-deut-3
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-3'
    quote: 'it suggests Moses may have displeased the Lord by capitulating to the people’s suggestion to send spies (Deuteronomy 1:22–23)'
  - where: 'note 3:26 “Why Moses could not cross”'
    claim: 'Allred: or by adding instructions to the spies beyond searching the land'
    key: ot-minute-deut-3
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-3'
    quote: 'perhaps the exclusion was because Moses added instructions for the spies to qualitatively judge the land and its people, including an assessment of their fortifications (Numbers 13:18–20)'

  # ---------- note 3:26 suffice ----------
  - where: 'note 3:26 “Enough for you”'
    claim: 'rab lāk is an exclamation “enough!” with implication of excess; the same idiom “it is enough for you” at 1:6 and 2:3'
    key: bdb
    url: 'https://biblehub.com/hebrew/7227.htm'
    quote: 'as exclamation enough! … רַבלָֿךְ (with implication of excess) Deuteronomy 3:26 (let it) suffice thee! … it is enough for you to Deuteronomy 1:6; Deuteronomy 2:3 (i.e. you have done it enough)'

  # ---------- christ / explore ----------
  - where: 'christ'
    claim: 'Joshua’s name occurs in the forms Hoshea, Jeshua and Jesus'
    key: bd-joshua
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/joshua?lang=eng'
    quote: 'The name also occurs in the Old Testament under the various forms Jehoshua, Hoshea, Jeshua, and Jesus; son of Nun, and successor of Moses'
  - where: 'christ'
    claim: 'Joshua means “Jehovah is salvation”'
    key: scripture-helps-num
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/17-numbers-11-14-20-24-27?lang=eng'
    quote: 'Moses changed the name of the leader of the tribe of Ephraim from Oshea (meaning “salvation”) to Joshua (meaning “Jehovah is salvation”).'
  - where: 'christ'
    claim: 'Moses appeared at the Transfiguration as a translated being'
    key: scripture-helps-num
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/17-numbers-11-14-20-24-27?lang=eng'
    quote: 'As a translated being, Moses appeared at the Mount of Transfiguration'
  - where: 'christ'
    claim: 'Hebrews 4:8–9: Joshua (“Jesus”) did not give the final rest'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/4?lang=eng'
    quote: 'For if Jesus had given them rest, then would he not afterward have spoken of another day.'
  - where: 'christ'
    claim: 'The “Jesus” of Hebrews 4:8 is Joshua (footnote to Ex. 17:9; Acts 7:45)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/4?lang=eng'
    quote: '“Jesus”: Ex. 17:9; Acts 7:45.'
  - where: 'christ'
    claim: 'Mormon: the peaceable followers of Christ can enter the rest of the Lord from this time henceforth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/moro/7?lang=eng'
    quote: 'that are the peaceable followers of Christ, and that have obtained a sufficient hope by which ye can enter into the rest of the Lord, from this time henceforth until ye shall rest with him in heaven.'
