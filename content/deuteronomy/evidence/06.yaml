chapter: 6
claims:
  - where: when
    claim: 'Moses speaks in the fortieth year, in the land of Moab'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/1?lang=eng'
    quote: 'And it came to pass in the fortieth year, in the eleventh month, on the first day of the month, that Moses spake unto the children of Israel'
  - where: setting
    claim: 'Chapters 5–11 are the first part of the second discourse: the Ten Commandments and a practical exposition of them'
    key: bd-deuteronomy
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/deuteronomy?lang=eng'
    quote: 'The second discourse (Deut. 5–26) consists of two parts: (1) 5–11, the Ten Commandments and a practical exposition of them, (2) 12–26, a code of laws'
  - where: setting
    claim: 'With the Shema Moses begins to elaborate on the first commandment'
    key: ot-minute-deut-rappleye
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1-6-8-15-18-29-30-34'
    quote: 'Moses began elaborating on the first commandment with what is often called the Shema, so named because that is the first Hebrew word in this passage.'
  - where: setting
    claim: 'Jesus quoted the Shema and called it the first and great commandment'
    key: ot-minute-deut-rappleye
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1-6-8-15-18-29-30-34'
    quote: 'Jesus quoted the Shema and said it was “the first and great commandment” (Matthew 22:36–38; Mark 12:28–30), thus establishing the importance of this passage within Christianity as well.'
  - where: thread
    claim: 'The near-synonyms of verse 1 together drive home total obedience, with no loopholes'
    key: ot-minute-deut-rappleye
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1-6-8-15-18-29-30-34'
    quote: 'Using several near synonyms together like this has a forceful, cumulative effect: it drives home the importance of total obedience to all that God commands and ensures that the covenant terms are comprehensive and complete, with no loopholes.'
  - where: thread
    claim: 'The chapter falls into four parts: 1–3, 4–9, 10–19, 20–25'
    key: ot-minute-deut-rappleye
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1-6-8-15-18-29-30-34'
    quote: 'Deuteronomy 6:1–3. Commandments, Statues, Judgments … Deuteronomy 6:4–9. The Shema … Deuteronomy 6:10–19. Remember the Lord … Deuteronomy 6:20–25. Why All the Testimonies, Statutes, and Judgments?'
  - where: 'note 6:4 “What “one LORD” confesses”'
    claim: 'The Hebrew of the confession is a few words with no verb: hear, Israel, YHWH, our God, YHWH, one'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/deuteronomy/6-4.htm'
    quote: 'šə·ma‘ שְׁמַ֖ע Hear … yiś·rā·’êl; יִשְׂרָאֵ֑ל O Israel … Yah·weh יְהוָ֥ה YHWH … ’ĕ·lō·hê·nū אֱלֹהֵ֖ינוּ our God'
  - where: 'note 6:4 “What “one LORD” confesses”'
    claim: 'A modern translation reads “the Lord alone” and gives three other possible renderings'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Deuteronomy+6&version=NRSVUE'
    quote: '6.4 Or The Lord our God is one Lord, or The Lord our God, the Lord is one, or The Lord is our God, the Lord is one'
  - where: 'note 6:4 “What “one LORD” confesses”'
    claim: 'The last word of the verse is ʾeḥad, rendered “One”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/deuteronomy/6-4.htm'
    quote: 'אֶחָֽד׃ [is] One'
  - where: 'note 6:4 “What “one LORD” confesses”'
    claim: 'ʾeḥad is the number one; the lexicon also lists the sense “only”'
    key: bdb
    url: 'https://biblehub.com/hebrew/259.htm'
    quote: 'adjective number one'
  - where: 'note 6:4 “What “one LORD” confesses”'
    claim: 'The lexicon lists “only” among the senses of ʾeḥad'
    key: bdb
    url: 'https://biblehub.com/hebrew/259.htm'
    quote: '5 only 1 Kings 4:19'
  - where: 'note 6:4 “What “one LORD” confesses”'
    claim: 'Scripture Helps gives the rendering “The Lord is our God, the Lord alone” and reads the confession as covenantal and as acknowledging Jehovah’s oneness and exclusiveness'
    key: scripture-helps-deut
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/18-deuteronomy-6-8-15-18-29-30-34?lang=eng'
    quote: 'comparing a different translation: ‘The Lord is our God, the Lord alone’ … defines the covenantal relationship between God and his people—he is ‘our God’—and it acknowledges the oneness and exclusiveness of Jehovah'
  - where: 'note 6:5 “Love as covenant loyalty”'
    claim: 'In the Bible love is not necessarily an emotion but devoted loyalty, “covenantal devotion,” shown in keeping His commandments'
    key: sc-knowhy-517
    url: 'https://scripturecentral.org/knowhy/what-does-it-mean-to-love-god-with-all-thy-mind'
    quote: 'In the Bible the word love is not necessarily referring to an emotional response. In biblical times, love was often used to describe a kind of devoted loyalty, a loyalty of action, a “covenantal devotion.”'
  - where: 'note 6:5 “Love as covenant loyalty”'
    claim: 'The Shema demands complete, covenantal loyalty to the Lord'
    key: ot-minute-deut-rappleye
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1-6-8-15-18-29-30-34'
    quote: '“The Shema calls for radical, total, whole-hearted, full-bodied devotion” and thus “paraphrases the first commandment and extends it to radical limits.”[5] It demands complete, covenantal loyalty to the Lord.'
  - where: 'note 6:5 “Love as covenant loyalty”'
    claim: 'The command to love God is the central commandment of the covenant laws, and Moses repeats it in 6:10–13; 10:12; 30:6, 10, 16, 20'
    key: muhlestein-love-neighbor
    url: 'https://rsc.byu.edu/covenant-compassion/covenantal-command'
    quote: 'This arrangement is most obvious through the central and greatest commandment within the covenantal laws … This obligation is so critical that Moses reiterates it numerous times within his discussion of the covenant (6:10–13; 10:12; 30:6, 10, 16, 20).'
  - where: 'note 6:5 “Love as covenant loyalty”'
    claim: 'The lawyer was in effect asking Christ what the greatest covenant obligation was; the command was regarded in Judaism as the core of religious identity'
    key: muhlestein-love-neighbor
    url: 'https://rsc.byu.edu/covenant-compassion/covenantal-command'
    quote: 'in effect the lawyer who posed the question was asking Christ what their greatest covenantal obligation was … This command was regarded in Judaism as the core of the Jews’ religious identity.'
  - where: 'note 6:5 “Heart, soul, might, and the Savior’s “mind””'
    claim: 'The Hebrew word behind “might” means muchness, force, abundance; in Deut. 6:5 force, might'
    key: bdb
    url: 'https://biblehub.com/hebrew/3966.htm'
    quote: 'מְאֹד noun masculine muchness, force, abundance, exceedingly … 1 force, might, Deuteronomy 6:5 וּבְכָלמְֿאֹדֶ֑ךָ and with all thy might'
  - where: 'note 6:5 “Heart, soul, might, and the Savior’s “mind””'
    claim: 'The Greek translation of 6:5 has “mind” where the Hebrew has “heart”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/deuteronomy/6.htm'
    quote: '5And thou shalt love the Lord thy God with all thy mind, and with all thy soul, and all thy strength.'
  - where: 'note 6:5 “Heart, soul, might, and the Savior’s “mind””'
    claim: 'Nephi’s “might, mind, and strength, and your whole soul” resembles 6:5; “all thy soul” could be translated “your whole soul”'
    key: sc-knowhy-467
    url: 'https://scripturecentral.org/knowhy/why-does-the-book-of-mormon-say-we-must-worship-god-with-our-whole-soul'
    quote: 'Nephi’s statement that you must worship Christ “with all your might, mind, and strength, and your whole soul” is similar to Deuteronomy 6:5 … The phrase “all thy soul” could also be translated as “your whole soul,” exactly the same phrase that appears in the Book of Mormon.'
  - where: 'note 6:6 “Heart first, then hand, eyes and door”'
    claim: 'One older reading: the commandments were to be an affair of the heart, not merely of memory; the binding and writing are figurative of undeviating observance'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/6.htm'
    quote: '"Upon thine heart:" i.e., the commandments of God were to be an affair of the heart, and not merely of the memory … As these words are figurative, and denote an undeviating observance of the divine commands'
  - where: 'note 6:6 “Heart first, then hand, eyes and door”'
    claim: 'Many Jews place passages from the Shema in a mezuzah on the right side of the doorframe'
    key: scripture-helps-deut
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/18-deuteronomy-6-8-15-18-29-30-34?lang=eng'
    quote: 'many Jews place a small piece of parchment inscribed with passages from the Shema in a mezuzah—a small container attached to the right side of the doorframe of their homes'
  - where: 'note 6:6 “Heart first, then hand, eyes and door”'
    claim: 'It is unclear when the Israelites first adopted these customs; they were observed in Jesus’ day'
    key: scripture-helps-deut
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/18-deuteronomy-6-8-15-18-29-30-34?lang=eng'
    quote: 'It is unclear when the Israelites first adopted these customs, but the Jews observed them during the ministry of Jesus Christ.'
  - where: 'note 6:6 “Heart first, then hand, eyes and door”'
    claim: 'The Greek translation adds “and in thy soul” to verse 6'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/deuteronomy/6.htm'
    quote: '6And these words, all that I command thee this day, shall be in thy heart and in thy soul.'
  - where: 'note 6:7 “Teach them diligently: sharpen them”'
    claim: 'The verb is whet, sharpen; in Deut. 6:7 “teach the words incisively”'
    key: bdb
    url: 'https://biblehub.com/hebrew/8150.htm'
    quote: '[שָׁנַן] verb whet, sharpen … Pi`el Perfect consecutive וְשִׁנַּנְתָּם לְבָנֶיךָ Deuteronomy 6:7 i.e. teach the words incisively'
  - where: 'note 6:7 “Teach them diligently: sharpen them”'
    claim: 'The same verb is used of the LORD whetting His sword (32:41) and of sharpened arrows'
    key: bdb
    url: 'https://biblehub.com/hebrew/8150.htm'
    quote: 'Qal whet, sharpen: Perfect1singular אִם שַׁנּוֺתִ֫י בְּרַק חַרְבִּי (Ges§ 67ee) Deuteronomy 32:41, of ׳יs preparation for judgment … Passive participle שְׁנוּנִים sharpened, of arrows, Isaiah 5:28'
  - where: 'note 6:7 “Teach them diligently: sharpen them”'
    claim: 'A modern translation reads “Recite them to your children”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Deuteronomy+6&version=NRSVUE'
    quote: '7 Recite them to your children and talk about them when you are at home and when you are away, when you lie down and when you rise.'
  - where: 'note 6:7 “Teach them diligently: sharpen them”'
    claim: 'Because of verse 7, the Shema is recited twice daily, morning and night'
    key: sc-knowhy-517
    url: 'https://scripturecentral.org/knowhy/what-does-it-mean-to-love-god-with-all-thy-mind'
    quote: '(Deuteronomy 6:7). Thus, the Shema is recited twice daily, once in the morning and once at night.'
  - where: 'note 6:12 “Why plenty is the danger”'
    claim: 'The abundance of the land carries a danger of pride and forgetfulness; forgetting God is a kind of idolatry, worship of one’s own accomplishments, forgetting an unearned gift'
    key: lane-redemption
    url: 'https://rsc.byu.edu/covenant-compassion/remembering-redemption-avoiding-idolatry'
    quote: 'The abundance that they will experience in the promised land carries with it a tremendous danger of pride and forgetfulness. Forgetting God is a kind of idolatry that is seen in the false worship of their “own” accomplishments.'
  - where: 'note 6:12 “Why plenty is the danger”'
    claim: 'Directly after the warning, the first commandment is essentially repeated (6:13–14)'
    key: lane-redemption
    url: 'https://rsc.byu.edu/covenant-compassion/remembering-redemption-avoiding-idolatry'
    quote: 'Directly after this warning, the first commandment in the Ten Commandments is essentially repeated again'
  - where: 'note 6:12 “Why plenty is the danger”'
    claim: 'Chapter 8 restates the warning, where Israel’s own effort is part of the success'
    key: lane-redemption
    url: 'https://rsc.byu.edu/covenant-compassion/remembering-redemption-avoiding-idolatry'
    quote: 'chapter 8 includes a warning that even when their efforts are part of their success, they must not forget the One who provided all the conditions needed for that success.'
  - where: 'note 6:12 “Why plenty is the danger”'
    claim: 'The land full of good things might seduce Israel to forget that the blessings were the unmerited gift of God’s grace'
    key: ot-minute-deut-rappleye
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1-6-8-15-18-29-30-34'
    quote: 'the people did not have to work for “may seduce [them] to forget that these blessings were the unmerited gift of God’s grace.”[7]'
  - where: 'note 6:13 “Two of the Savior’s answers to the devil”'
    claim: 'The Greek translation of 6:13 reads “him only shalt thou serve”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/deuteronomy/6.htm'
    quote: '13Thou shalt fear the Lord thy God, and him only shalt thou serve; and thou shalt cleave to him, and by his name thou shalt swear.'
  - where: 'note 6:13 “Two of the Savior’s answers to the devil”'
    claim: 'A modern translation renders verse 13 “by his name alone you shall swear”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Deuteronomy+6&version=NRSVUE'
    quote: '13 The Lord your God you shall fear, him you shall serve, and by his name alone you shall swear.'
  - where: 'note 6:20 “A question about law answered with a story”'
    claim: 'The son’s question became part of the Passover ritual; fathers responded by rehearsing bondage, redemption and covenant'
    key: ot-minute-deut-rappleye
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1-6-8-15-18-29-30-34'
    quote: 'eventually became a ritual enshrined in Judaism as part of the Passover festivities, going back to ancient times.[8] Fathers would then respond by rehearsing Israel’s bondage and redemption from Egypt by the hand of Lord and His binding them by covenant'
  - where: 'note 6:20 “A question about law answered with a story”'
    claim: 'The essence of the exchange: the Lord first loved Israel, so Israel shows love in return by keeping the commandments'
    key: ot-minute-deut-rappleye
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1-6-8-15-18-29-30-34'
    quote: 'The essence of the exchange recorded here and enshrined in ritual is that the Lord first loved Israel by using His might to set them free and giving them a promised land; thus, Israel must show love in return'
  - where: 'note 6:20 “A question about law answered with a story”'
    claim: 'Obedience to commands is rooted in redemption'
    key: lane-redemption
    url: 'https://rsc.byu.edu/covenant-compassion/remembering-redemption-avoiding-idolatry'
    quote: 'we must also remember and be able to explain that our obedience to commands, including the command to care for the poor, is rooted in our redemption'
  - where: 'note 6:20 “A question about law answered with a story”'
    claim: 'Alma 36 resembles the memorized recitations of the Exodus; Alma seems to have fulfilled the command of 6:20–25 and applied the story to his own life'
    key: sc-knowhy-419
    url: 'https://scripturecentral.org/knowhy/what-the-exodus-teaches-us-about-the-atonement'
    quote: '“the entire chapter consists of Alma’s recitation of his own story; it resembles in a general sense the memorized recitations learned by Israelites of God’s wondrous acts performed on their behalf during the Exodus.”[11] Deuteronomy 6:20–25 commands the ancient Israelites to tell their sons'
  - where: 'note 6:20 “A question about law answered with a story”'
    claim: 'Rappleye also suggests the practice may be reflected in Alma’s counsel to his sons'
    key: ot-minute-deut-rappleye
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1-6-8-15-18-29-30-34'
    quote: 'Exactly when this practice was first implemented is unknown, but it may be reflected in the counsel Alma gave his sons in the Book of Mormon (see Alma 36–42).'
  - where: 'note 6:25 “What “our righteousness” means here”'
    claim: 'A modern translation reads “we will be in the right”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Deuteronomy+6&version=NRSVUE'
    quote: '25 If we diligently observe this entire commandment before the Lord our God, as he has commanded us, we will be in the right.'
  - where: 'note 6:25 “What “our righteousness” means here”'
    claim: 'One older reading: Israel would be regarded as righteous if diligent in the law; this righteousness rests not on outward works but on striving to love God with all the heart, impossible without living faith'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/6.htm'
    quote: 'we shall be regarded and treated by God as righteous, if we are diligent in the observance of the law … not founded upon the outward (pharisaic) righteousness of works, but upon an earnest striving after the fulfilment of the law, to love God with all the heart; and this love is altogether impossible without living faith.'
  - where: christ
    claim: 'Nephi teaches that we must worship Christ with all our might, mind, strength and whole soul (2 Ne. 25:29)'
    key: sc-knowhy-467
    url: 'https://scripturecentral.org/knowhy/why-does-the-book-of-mormon-say-we-must-worship-god-with-our-whole-soul'
    quote: 'In 2 Nephi 25:29 we learn that we must worship Christ with all our “might, mind, and strength” and our “whole soul.”'
  - where: christ
    claim: 'The redemption of the Israelites from Egypt was a type of Christ’s spiritual redemption'
    key: lane-redemption
    url: 'https://rsc.byu.edu/covenant-compassion/remembering-redemption-avoiding-idolatry'
    quote: 'Everything that we are asked to do and everything that we are given must be understood in terms of the gift of Christ’s spiritual redemption, of which the redemption of the Israelites from Egypt was a type.'
  - where: christ
    claim: 'The Book of Mormon shows the deliverance from Egypt foreshadowing deliverance from sin and death through Christ'
    key: sc-knowhy-419
    url: 'https://scripturecentral.org/knowhy/what-the-exodus-teaches-us-about-the-atonement'
    quote: 'The Book of Mormon shows how the Israelites’ deliverance from Egypt foreshadows our own deliverance from sin and death through Christ’s Atonement.'
  - where: 'christ'
    claim: 'Nephi: we talk of Christ that our children may know where to look for a remission of their sins'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/25?lang=eng'
    quote: 'And we talk of Christ, we rejoice in Christ, we preach of Christ, we prophesy of Christ, and we write according to our prophecies, that our children may know to what source they may look for a remission of their sins.'
  - where: 'christ'
    claim: 'Deut. 6:20: the son asks what the testimonies, statutes and judgments mean'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/6?lang=eng'
    quote: 'And when thy son asketh thee in time to come, saying, What mean the testimonies, and the statutes, and the judgments, which the LORD our God hath commanded you?'
  - where: 'note 6:5 “Love as covenant loyalty”'
    claim: 'It was somewhat surprising that Christ added the second commandment, from laws about gleaning and justice'
    key: muhlestein-love-neighbor
    url: 'https://rsc.byu.edu/covenant-compassion/covenantal-command'
    quote: 'What is somewhat surprising is that Christ added the second great commandment from a passage found at the end of laws about gleaning and justice being done in Israel'
  - where: 'note 6:5 “Heart, soul, might, and the Savior’s “mind””'
    claim: 'Elsewhere, about 298 times, the word expresses exceedingly, greatly, very; the noun sense is 6:5 and 2 Kgs. 23:25'
    key: bdb
    url: 'https://biblehub.com/hebrew/3966.htm'
    quote: '2 in different idioms (298 t.) to express the idea of exceedingly, greatly, very (whether of magnitude or degree):'
  - where: thread
    claim: 'Piling up near-synonyms is a common stylistic feature of Deuteronomy'
    key: ot-minute-deut-rappleye
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1-6-8-15-18-29-30-34'
    quote: 'This repetitive language is a common stylistic feature in Deuteronomy and is also used elsewhere in the Old Testament'
  - where: setting
    claim: 'Jews recite the Shema each day, morning and evening'
    key: scripture-helps-deut
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/18-deuteronomy-6-8-15-18-29-30-34?lang=eng'
    quote: 'Jews recite the Shema each day as a morning and an evening prayer.'
  - where: 'note 6:20 “A question about law answered with a story”'
    claim: 'Alma 36:2–3 and 27–29 speak of the Exodus'
    key: sc-knowhy-419
    url: 'https://scripturecentral.org/knowhy/what-the-exodus-teaches-us-about-the-atonement'
    quote: '“the second and third verses, along with three verses at the chapter’s end (36:27–29), all speak of the Exodus as proof of God’s marvelous power to deliver and support those in bondage and afflictions.”'
  - where: 'note 6:20 “A question about law answered with a story”'
    claim: 'Alma seems to have fulfilled the command of 6:20–25 while applying the story to his own life'
    key: sc-knowhy-419
    url: 'https://scripturecentral.org/knowhy/what-the-exodus-teaches-us-about-the-atonement'
    quote: 'Alma seems to have fulfilled this commandment while also applying this story to his own life.'
