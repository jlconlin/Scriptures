chapter: 5
claims:
  # ---------- when / setting / thread ----------
  - where: 'when'
    claim: 'Moses speaks in the land of Moab in the fortieth year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/1?lang=eng'
    quote: 'in the fortieth year, in the eleventh month, on the first day of the month'
  - where: 'setting'
    claim: 'The second discourse (5–26) has two parts: 5–11 the Ten Commandments and their exposition, 12–26 a code of laws'
    key: bd-deuteronomy
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/deuteronomy?lang=eng'
    quote: 'The second discourse (Deut. 5–26) consists of two parts: (1) 5–11, the Ten Commandments and a practical exposition of them, (2) 12–26, a code of laws, which forms the nucleus of the whole book.'
  - where: 'setting'
    claim: 'The speeches were given after the less faithful generation had passed away'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'The content of Deuteronomy is a series of speeches given by Moses following the forty-year dwelling in the wilderness, after the less faithful generation had passed away and before he was taken to heaven.'
  - where: 'setting'
    claim: 'The two texts differ only slightly, without materially affecting the sense'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/20.htm'
    quote: 'which are repeated again in Deuteronomy 5:6-18, with slight variations that do not materially affect the sense'
  - where: 'setting'
    claim: 'The LORD''s reply to the people (5:28–31) is passed over in Exodus 20'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/5.htm'
    quote: 'Jehovah''s reply to the words of the people (Deuteronomy 5:28-31) is passed over in Exodus 20.'
  - where: 'setting'
    claim: 'Deuteronomy 5 recapitulates the Decalogue ahead of the Deuteronomic legislation, showing the relational nature of the law'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'Deuteronomy 5, in fact, recapitulates it ahead of the Deuteronomic legislation—helps us appreciate and understand the social/relational nature of all the legislation that follows.'
  - where: 'thread'
    claim: 'The variations of Deuteronomy''s text have a rhetorical and hortatory intention'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/20.htm'
    quote: 'if, after what has been said, the rhetorical and hortatory intention is patent in all the variations of the text of Deuteronomy, even down to the transposition of wife and house in the last commandment'
  - where: 'thread'
    claim: 'Deuteronomy gives the Sabbath a different justification from Exodus'
    key: ot-minute-deut-rappleye
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1-6-8-15-18-29-30-34'
    quote: 'When Moses reiterated the Ten Commandments in Deuteronomy 5, he worded the command to keep the Sabbath day differently and provided a different justification for the instruction.'
  - where: 'thread'
    claim: 'Chapter 6 opens by naming what follows as the commandments the LORD commanded to teach'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/6?lang=eng'
    quote: 'Now these are the commandments, the statutes, and the judgments, which the LORD your God commanded to teach you'
  - where: 'thread'
    claim: 'Moses expands the account of Exodus 20:18–21 to link on the exhortation of vv. 32–33, which leads into the exposition of the law'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/5.htm'
    quote: 'His purpose in doing so was to link on the exhortation in vv. 32, 33, to keep all the commandments of the Lord and do them, which paves the way for passing to the exposition of the law which follows.'

  # ---------- note 5:3 ----------
  - where: 'note 5:3 “Not with our fathers, but with us”'
    claim: 'The adults of Horeb had died in the wilderness before Moab'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/2?lang=eng'
    quote: 'until all the generation of the men of war were wasted out from among the host, as the Lord sware unto them.'
  - where: 'note 5:3 “Not with our fathers, but with us”'
    claim: 'The fathers are the patriarchs, not those who died in the wilderness'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/5.htm'
    quote: 'The "fathers" are neither those who died in the wilderness, as Augustine supposed, nor the forefathers in Egypt, as Calvin imagined; but the patriarchs, as in Deuteronomy 4:37.'
  - where: 'note 5:3 “Not with our fathers, but with us”'
    claim: 'The covenant was made with the nation as an organic whole; the pronoun "we" is added for emphasis'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/5.htm'
    quote: 'But the covenant was made not with the particular individuals who were then alive, but rather with the nation as an organic whole.'
  - where: 'note 5:3 “Not with our fathers, but with us”'
    claim: 'The Church footnote on "covenant" in 5:3 points to Deuteronomy 29:1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/5?lang=eng'
    quote: '“covenant”: Deut. 29:1.'
  - where: 'note 5:3 “Not with our fathers, but with us”'
    claim: 'The separate pronoun is added to the suffix for emphasis'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/5.htm'
    quote: 'The separate pronoun (we) is added to the pronominal suffix for the sake of emphasis'

  # ---------- note 5:4 ----------
  - where: 'note 5:4 “Face to face, yet through Moses”'
    claim: 'Verses 4 and 5 suggest Israel was to come before God face to face, but did not, sending Moses instead'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'Both verses suggest that the children of Israel were to come before God “face to face,” as the text states, but they did not, instead sending Moses in their stead, with the mention that they refused to go up'
  - where: 'note 5:4 “Face to face, yet through Moses”'
    claim: 'The Hebrew of v. 4 is pānīm bepānīm, literally face in face; usually taken as metaphorical since the Israelites never saw God'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'The actual terminology in verse 4 is “pānīm bepānīm” (literally “face in face”). … most assume that it should be understood as metaphorical, since the Israelites never did see God.'
  - where: 'note 5:4 “Face to face, yet through Moses”'
    claim: 'The later tradition understood that Israel was supposed to have direct interaction with God'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'In any case, it appears that the later tradition understood that the Israelites were supposed to have had direct interactions with God in some manner.'

  - where: 'note 5:4 “Face to face, yet through Moses”'
    claim: 'Strictly the terminology suggests seeing, but most take it as metaphorical'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'While most agree that technically the terminology suggests direct visual interaction, most assume that it should be understood as metaphorical'

  # ---------- note 5:15 ----------
  - where: 'note 5:15 “Keep, remember, and the servant’s rest”'
    claim: 'In Deuteronomy 5 the Sabbath is tied to liberation from Egypt by the mighty hand and stretched out arm'
    key: ot-minute-deut-rappleye
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1-6-8-15-18-29-30-34'
    quote: 'In Exodus 20, the commandment was tied to God’s resting on the seventh day after the Creation; in Deuteronomy 5 it is tied to the Israelites’ liberation from Egyptian bondage by the Lord’s “mighty hand” and “stretched out arm”'
  - where: 'note 5:15 “Keep, remember, and the servant’s rest”'
    claim: 'Deuteronomy 15 frames the Sabbath year as an extension of the Sabbath day, with the same reason (15:15)'
    key: ot-minute-deut-rappleye
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1-6-8-15-18-29-30-34'
    quote: 'Here in Deuteronomy 15, Moses gave instructions regarding the Sabbath year, and he framed them as an extension of the commandment regarding the Sabbath day. He used much of the same language to do so and tied it back to the Israelites’ time in Egyptian bondage.'
  - where: 'note 5:15 “Keep, remember, and the servant’s rest”'
    claim: 'Remembering captivity and redemption pushes Israel to act with similar mercy to others'
    key: lane-redemption
    url: 'https://rsc.byu.edu/covenant-compassion/remembering-redemption-avoiding-idolatry'
    quote: 'The covenant expectation that we remember our captivity and our redemption helps us transcend our selfishness by pushing us to always remember our dependence on God’s mercy and generosity. This expectation also helps us to act with similar mercy to others'

  - where: 'note 5:15 “Keep, remember, and the servant’s rest”'
    claim: 'Moses worded the Sabbath command differently in Deuteronomy 5 and gave a different justification'
    key: ot-minute-deut-rappleye
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1-6-8-15-18-29-30-34'
    quote: 'When Moses reiterated the Ten Commandments in Deuteronomy 5, he worded the command to keep the Sabbath day differently and provided a different justification for the instruction.'

  # ---------- note 5:21 ----------
  - where: 'note 5:21 “The wife first, and two verbs”'
    claim: 'Deuteronomy places the wife first, adds the field, and uses a synonym verb (titʾavveh) instead of repeating tachmod'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/20.htm'
    quote: 'the "neighbour''s wife" is placed first, and then, after the "house," the field is added before the "man-servant and maid-servant," … and instead of the repetition of תּחמד, the synonym תּתאוּה is employed.'
  - where: 'note 5:21 “The wife first, and two verbs”'
    claim: 'Keil treats the transposition as freedom of reproduction and Exodus as the original'
    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/20.htm'
    quote: 'this transposition must also be attributed to the freedom with which the decalogue was reproduced, and the text of Exodus be accepted as the original'
  - where: 'note 5:21 “The wife first, and two verbs”'
    claim: 'Deuteronomy takes the wife first, in a class by herself, then under another verb the rest'
    key: cambridge-deuteronomy
    url: 'https://biblehub.com/commentaries/cambridge/deuteronomy/5.htm'
    quote: 'But this later edition in Deut. makes among these a fundamental distinction of far-reaching moral consequence; takes the wife first in a class by herself, then—under another verb, as if to emphasise the difference—gives the rest together'
  - where: 'note 5:21 “The wife first, and two verbs”'
    claim: 'The second verb is of stronger meaning, used of longing for water or dainties, apparently a rhetorical variation'
    key: cambridge-deuteronomy
    url: 'https://biblehub.com/commentaries/cambridge/deuteronomy/5.htm'
    quote: 'another verb is employed here of stronger meaning but apparently intended as only ‘a rhetorical variation’ (Driver) rather than as a climax. Of longing for water, 2 Samuel 3:15; for dainties, Proverbs 23:3.'
  - where: 'note 5:21 “The wife first, and two verbs”'
    claim: 'The tenth commandment carries the law from action into thought and feeling'
    key: cambridge-deuteronomy
    url: 'https://biblehub.com/commentaries/cambridge/deuteronomy/5.htm'
    quote: 'The Tenth Commandment, carrying the Law from the sphere of action into that of thought and feeling'

  # ---------- note 5:28 ----------
  - where: 'note 5:28 “They have well said”'
    claim: 'The LORD''s reply (5:28–31) is not in Exodus 20'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/5.htm'
    quote: 'Jehovah''s reply to the words of the people (Deuteronomy 5:28-31) is passed over in Exodus 20.'
  - where: 'note 5:28 “They have well said”'
    claim: 'God approved because the request came from a sense of sinners'' unworthiness; v. 29 wishes they would always be of that mind'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/5.htm'
    quote: 'God approved of what the people said, because it sprang from a consciousness of the unworthiness of any sinner to come into the presence of the holy God; and He added, "Would that there were always this heart in them to fear Me,"'
  - where: 'note 5:28 “They have well said”'
    claim: 'The Church footnote on the same request in Exodus 20:19 points to D&C 84:22 (21–26)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/20?lang=eng'
    quote: 'Deut. 5:25; 18:16; Heb. 12:19; D&C 84:22 (21–26); Moses 1:11 (11, 14).'

  # ---------- note 5:31 ----------
  - where: 'note 5:31 “Everything after the ten comes through Moses”'
    claim: 'The code opens by framing its laws as what is to be done in the land'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'The opening frame of the Deuteronomic Code contextualizes the legislation as: what Yahweh requires the Israelites to “do in the land”—that is, in the promised land—once they had entered and inherited it'

  - where: 'note 5:31 “Everything after the ten comes through Moses”'
    claim: 'Deuteronomy 6:1 introduces what follows as the commandments, statutes and judgments the LORD commanded to teach'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/6?lang=eng'
    quote: 'Now these are the commandments, the statutes, and the judgments, which the LORD your God commanded to teach you'

  # ---------- christ ----------
  - where: 'christ'
    claim: 'The risen Lord told the Nephites He gave the law'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/15?lang=eng'
    quote: 'I am he that gave the law, and I am he who covenanted with my people Israel'
  - where: 'christ'
    claim: 'The people''s rejection of God''s immediate presence and request for intermediaries (Deut. 5:23–28) is the basis of the prophecy of a prophet like Moses'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'Because the Israelites’ rejection of the immediate presence of God and a request for human intermediaries served as the basis for the giving of this prophecy (compare Exodus 20:18–19 [MT 16–17]; Deuteronomy 5:23–28 [MT 19–24])'
  - where: 'christ'
    claim: 'Moroni identified the prophet of Acts 3:22–23 as Christ'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/js-h/1?lang=eng'
    quote: 'He said that that prophet was Christ'
