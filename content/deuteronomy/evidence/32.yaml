chapter: 32
claims:
  - where: when
    claim: 'Moses speaks in Moab in the fortieth year after the Exodus'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/1?lang=eng'
    quote: 'And it came to pass in the fortieth year, in the eleventh month, on the first day of the month, that Moses spake unto the children of Israel'
  - where: setting
    claim: 'The LORD spoke to Moses about Nebo on the same day the song was spoken'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/32?lang=eng'
    quote: 'And the LORD spake unto Moses that selfsame day, saying,'
  - where: setting
    claim: 'The Song of Moses is written in Archaic Biblical Hebrew, the earliest stage of the language, with Genesis 49 and Exodus 15'
    key: sc-knowhy-853
    url: 'https://scripturecentral.org/knowhy/why-does-the-old-testament-contain-poems-in-the-middle-of-stories'
    quote: 'The Song of the Sea (Exodus 15), the Song of Deborah (Judges 5), the Blessings of Jacob (Genesis 49) and of Moses (Deuteronomy 33), the Oracles of Balaam (Numbers 23–24), the Song of Moses (Deuteronomy 32), and some of the Psalms (such as Psalm 68) are all written in this earliest stage of the language.'
  - where: setting
    claim: 'The KnoWhy dates Archaic Biblical Hebrew to 1000 BC at the latest'
    key: sc-knowhy-853
    url: 'https://scripturecentral.org/knowhy/why-does-the-old-testament-contain-poems-in-the-middle-of-stories'
    quote: 'All this evidence suggests that Archaic Biblical Hebrew is much older than some might suppose, likely dating from 1000 BC at the latest.'
  - where: setting
    claim: 'The chapter heading: Israel will sing the song; the children of Israel were known in the premortal life'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/32?lang=eng'
    quote: 'Israel will sing the song of Moses and acclaim: God speaks to heaven and earth; the children of Israel were known in the premortal life'
  - where: setting
    claim: 'Romans 12:19 and Hebrews 10:30 quote verse 35, Hebrews with verse 36'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/32.htm'
    quote: 'The first clause is quoted in Romans 12:19 and Hebrews 10:30, in the former to warn against self-revenge, in the latter to show the energy with which God will punish those who fall away from the faith, in connection with Deuteronomy 32:36'
  - where: thread
    claim: 'One older reading: the song contrasts the LORD’s fidelity with Israel’s perversity, with an introduction (1–3), a theme, and parts at 6–18, 19–23 and 34–43'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/32.htm'
    quote: 'the Lord is blameless and righteous in His doings, but Israel acts corruptly and perversely; and this is carried out in the first place by showing the folly of the Israelites in rebelling against the Lord (Deuteronomy 32:6-18)'
  - where: thread
    claim: 'The same reading’s last two parts: rejection and punishment (19–23), judgment with mercy on His servants (34–43)'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/32.htm'
    quote: 'secondly, by unfolding the purpose of God to reject and punish the rebellious generation (Deuteronomy 32:19-23); and lastly, by announcing and depicting the fulfilment of this purpose, and the judgment in which the Lord would have mercy upon His servants and annihilate His foes (Deuteronomy 32:34-43).'
  - where: thread
    claim: 'The same reading calls the song a prophetic anticipation of the future'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/32.htm'
    quote: 'It is rather a prophetic anticipation of the future'
  - where: section 3 plain
    claim: 'Jeshurun refers to Israel'
    key: ot-manual-deuteronomy-17-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/deuteronomy-17-33-an-exhortation-to-obedience-part-2?lang=eng'
    quote: 'The word jeshurun is a Hebrew word meaning “upright,” or “right in the sight of God,” and refers to Israel itself.'
  - where: section 6 plain
    claim: '“Be merciful unto” in verse 43 is the Hebrew verb of atonement, with God as subject'
    key: bdb
    url: 'https://biblehub.com/hebrew/3722.htm'
    quote: 'with God as subject, with accusative of person, cover, i.e. treat as covered, view propitiously, Yahweh''s land Deuteronomy 32:43 (song)'
  - where: section 7 plain
    claim: 'Hoshea is Joshua, renamed by Moses'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/32.htm'
    quote: 'This explains the name Hoshea, instead of Jehoshuah (Joshua), which Moses had given to his servant (Numbers 13:8, Numbers 13:16)'

  # ---- note 32:4 ----
  - where: 'note 32:4 “The Rock”'
    claim: 'Tsur is a cliff, rock or boulder, and figuratively a refuge'
    key: bdb
    url: 'https://biblehub.com/hebrew/6697.htm'
    quote: '(figuratively) a refuge'
  - where: 'note 32:4 “The Rock”'
    claim: 'Tsur is the word in 32:4, 15, 18, 30, 31 (twice) and 37'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'הַ/צּוּר֙'
  - where: 'note 32:4 “The Rock”'
    claim: 'In the Hebrew Bible the Lord is the rock and refuge of Israel'
    key: sc-knowhy-176
    url: 'https://scripturecentral.org/knowhy/why-did-helaman-compare-christ-to-a-rock'
    quote: 'In the imagery of the Hebrew Bible, the rocks are a place of refuge and safety from storms, hail, and arrows in the whirlwind, and the Lord is ultimately the rock and refuge of Israel.'
  - where: 'note 32:4 “The Rock”'
    claim: 'Deuteronomy, likely on the plates of brass, uses the language of the rock that Helaman and Nephi use of Christ'
    key: sc-knowhy-176
    url: 'https://scripturecentral.org/knowhy/why-did-helaman-compare-christ-to-a-rock'
    quote: 'Books such as the Psalms, Isaiah, and Deuteronomy, that the Lehites would likely have had access to on the plates of brass, use similar language.'
  - where: 'note 32:4 “The Rock”'
    claim: 'Paul calls the wilderness Rock Christ'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-cor/10?lang=eng'
    quote: 'and that Rock was Christ'

  # ---- note 32:8 ----
  - where: 'note 32:8 “The number of the children of Israel”'
    claim: 'The chapter heading reads verse 8 of the premortal life'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/32?lang=eng'
    quote: 'the children of Israel were known in the premortal life'
  - where: 'note 32:8 “The number of the children of Israel”'
    claim: 'Elder Talmage: the number was known before the nation existed in the flesh, explained by a previous existence'
    key: ot-manual-deuteronomy-17-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/deuteronomy-17-33-an-exhortation-to-obedience-part-2?lang=eng'
    quote: 'it is evident therefore that the number was known prior to the existence of the Israelitish nation in the flesh; this is most easily explained on the basis of a previous existence in which the spirits of the future nation were known.'
  - where: 'note 32:8 “The number of the children of Israel”'
    claim: 'The Septuagint reads “according to the number of the angels of God”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/deuteronomy/32.htm'
    quote: 'he set the bounds of the nations according to the number of the angels of God.'
  - where: 'note 32:8 “The number of the children of Israel”'
    claim: 'A Qumran fragment reads “sons of God” (ben elohim); McConkie reads the verse as pre-earth assignments'
    key: mcconkie-premortal-councils
    url: 'https://rsc.byu.edu/apocryphal-writings-latter-day-saints/premortal-existence-foreordinations-heavenly-councils'
    quote: 'This is an obvious reference to pre-earth assignments, though, until recently, virtually no commentators would admit it to be such.'
  - where: 'note 32:8 “The number of the children of Israel”'
    claim: 'The cave 4 fragment reads ben elohim'
    key: mcconkie-premortal-councils
    url: 'https://rsc.byu.edu/apocryphal-writings-latter-day-saints/premortal-existence-foreordinations-heavenly-councils'
    quote: 'The best fragment from cave 4 clearly contains the reading “ben elohim.”'
  - where: 'note 32:8 “The number of the children of Israel”'
    claim: '4QDeutj reads “the sons of God”'
    key: smoot-council-hebrew-bible
    url: 'https://interpreterfoundation.org/journal/the-divine-council-in-the-hebrew-bible-and-the-book-of-mormon'
    quote: 'God, in this textual witness, is said to have divided the nations according to the number of “the sons of God” (בני אלוהים; bĕnê ’ēlōhîm).'
  - where: 'note 32:8 “The number of the children of Israel”'
    claim: 'Smoot holds that scribes altered the text to remove the divine council'
    key: smoot-council-hebrew-bible
    url: 'https://interpreterfoundation.org/journal/the-divine-council-in-the-hebrew-bible-and-the-book-of-mormon'
    quote: 'scribes wishing to downplay the apparent polytheism undertook alterations that would make it theologically suitable for emerging orthodox trends toward a “purer” monotheism.'
  - where: 'note 32:8 “The number of the children of Israel”'
    claim: 'A modern translation reads “according to the number of the gods” and keeps Jacob as the LORD’s portion'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Deuteronomy+32&version=NRSVUE'
    quote: 'according to the number of the gods;(H) 9 the Lord’s own portion was his people,'



  # ---- note 32:21 ----
  - where: 'note 32:21 “No god, no people”'
    claim: 'Paul quotes the verse by Moses’ name'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/10?lang=eng'
    quote: 'First Moses saith, I will provoke you to jealousy by them that are no people'

  # ---- note 32:35 ----
  - where: 'note 32:35 “Vengeance belongs to the LORD”'
    claim: 'Romans 12:19 and Hebrews 10:30 quote the first clause, Romans against self-revenge, Hebrews of God’s judgment on those who fall away'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/32.htm'
    quote: 'The first clause is quoted in Romans 12:19 and Hebrews 10:30, in the former to warn against self-revenge, in the latter to show the energy with which God will punish those who fall away from the faith'
  - where: 'note 32:35 “Vengeance belongs to the LORD”'
    claim: 'Verse 36 gives the reason for verse 35'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/32.htm'
    quote: 'In Deuteronomy 32:36 the reason is given for the thought in Deuteronomy 32:35.'
  - where: 'note 32:35 “Vengeance belongs to the LORD”'
    claim: 'Paul: avenge not yourselves, for it is written, Vengeance is mine'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/12?lang=eng'
    quote: 'for it is written, Vengeance is mine; I will repay, saith the Lord.'

  # ---- note 32:43 (text) ----
  - where: 'note 32:43 “A longer verse in the scroll and the Greek”'
    claim: 'The Septuagint’s longer verse 43'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/deuteronomy/32.htm'
    quote: 'Rejoice, ye heavens, with him, and let all the angels of God worship him; rejoice ye Gentiles, with his people, and let all the sons of God strengthen themselves in him'
  - where: 'note 32:43 “A longer verse in the scroll and the Greek”'
    claim: '4QDeutq calls the gods to worship, and modern translations follow it'
    key: smoot-council-hebrew-bible
    url: 'https://interpreterfoundation.org/journal/the-divine-council-in-the-hebrew-bible-and-the-book-of-mormon'
    quote: 'The reading provided by the NRSV (among other modern translations), draws from the textual witness of 4QDeutq. As preserved in this fragment, Moses adjures the members of the divine council, identified as “gods” (אלהים; ’ēlōhîm), to worship Yahweh.'
  - where: 'note 32:43 “A longer verse in the scroll and the Greek”'
    claim: 'Smoot reads the traditional Hebrew as a reworking that changed heavens to nations and dropped the gods'
    key: smoot-council-hebrew-bible
    url: 'https://interpreterfoundation.org/journal/the-divine-council-in-the-hebrew-bible-and-the-book-of-mormon'
    quote: 'but lost in the Masoretic reworking, which changed “heavens” to “nations” and omitted reference to the gods worshipping Yahweh altogether.'
  - where: 'note 32:43 “A longer verse in the scroll and the Greek”'
    claim: 'A modern translation of verse 43'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Deuteronomy+32&version=NRSVUE'
    quote: 'Praise, O heavens, his people; worship him, all you gods!'
  - where: 'note 32:43 “A longer verse in the scroll and the Greek”'
    claim: 'Hebrews has “let all the angels of God worship him”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/1?lang=eng'
    quote: 'And let all the angels of God worship him.'

  # ---- note 32:43 (atonement) ----
  - where: 'note 32:43 “He will make atonement for his land”'
    claim: 'The verb in “will be merciful unto his land” is kipper'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'וְ/כִפֶּ֥ר'
  - where: 'note 32:43 “He will make atonement for his land”'
    claim: 'BDB: the same verb is the priest’s making atonement in Leviticus 16'
    key: bdb
    url: 'https://biblehub.com/hebrew/3722.htm'
    quote: 'and the priest shall make atonement Leviticus 16:32'
  - where: 'note 32:43 “He will make atonement for his land”'
    claim: 'BDB: with God as subject in 32:43, cover, treat as covered, view propitiously'
    key: bdb
    url: 'https://biblehub.com/hebrew/3722.htm'
    quote: 'with God as subject, with accusative of person, cover, i.e. treat as covered, view propitiously, Yahweh''s land Deuteronomy 32:43 (song)'
  - where: 'note 32:43 “He will make atonement for his land”'
    claim: 'BDB: God may Himself provide an atonement men could not provide'
    key: bdb
    url: 'https://biblehub.com/hebrew/3722.htm'
    quote: 'It is conceived that God in his sovereignty may himself provide an atonement or covering for men and their sins which could not be provided by men.'
  - where: 'note 32:43 “He will make atonement for his land”'
    claim: 'A modern translation: cleanse the land for his people'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Deuteronomy+32&version=NRSVUE'
    quote: 'and cleanse the land for his people.'
  - where: 'note 32:43 “He will make atonement for his land”'
    claim: 'The Septuagint: the Lord shall purge the land of his people'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/deuteronomy/32.htm'
    quote: 'and the Lord shall purge the land of his people.'
  - where: christ
    claim: 'Paul calls the Rock Christ'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-cor/10?lang=eng'
    quote: 'and that Rock was Christ'
