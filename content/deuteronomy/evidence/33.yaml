chapter: 33
claims:
  - where: when
    claim: 'Moses speaks in the plains of Moab in the fortieth year after the Exodus'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/1?lang=eng'
    quote: 'And it came to pass in the fortieth year, in the eleventh month, on the first day of the month, that Moses spake unto the children of Israel'
  - where: setting
    claim: 'Moses is told to die in the mount he goes up; the blessing is given before his death'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/32?lang=eng'
    quote: 'And die in the mount whither thou goest up, and be gathered unto thy people'
  - where: setting
    claim: 'Jacob blessed twelve small families; at Moses’ time they were twelve tribes numbering thousands each'
    key: ot-manual-deuteronomy-17-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/deuteronomy-17-33-an-exhortation-to-obedience-part-2?lang=eng'
    quote: 'the sons of Jacob that were given when they were still only twelve small families. At the time Deuteronomy was written, they were twelve tribes numbering thousands each.'
  - where: setting
    claim: 'The Blessing of Moses, like Jacob’s blessing and the Song of Moses, is in Archaic Biblical Hebrew, the oldest stage'
    key: sc-knowhy-853
    url: 'https://scripturecentral.org/knowhy/why-does-the-old-testament-contain-poems-in-the-middle-of-stories'
    quote: 'segments written in the oldest stage of the three: Archaic Biblical Hebrew. The Song of the Sea (Exodus 15), the Song of Deborah (Judges 5), the Blessings of Jacob (Genesis 49) and of Moses (Deuteronomy 33)'
  - where: setting
    claim: 'One older reading: Simeon is passed over because of Jacob’s word of scattering; it lost its identity, receiving towns in Judah'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/33.htm'
    quote: 'Simeon was the next in age to Reuben; but he is passed over entirely, because according to Jacob''s blessing (Genesis 49:7) he was to be scattered abroad in Israel, and lost his individuality as a tribe … the Simeonites simply received a number of towns within the territory of Judah (Joshua 19:2-9)'
  - where: setting
    claim: 'The chapter heading reads Joseph’s blessing as the latter-day gathering'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/33?lang=eng'
    quote: 'Joseph is blessed above all; the Lord will gather Israel in the latter days'
  - where: thread
    claim: 'One older reading: the introduction (2–5) and conclusion (26–29) are Moses’ own words with the blessings'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/33.htm'
    quote: 'we have Moses'' own words, not only in the blessings upon the several tribes (vv. 6-25), but also in the introduction and conclusion of the blessing (Deuteronomy 33:2-5 and Deuteronomy 33:26-29)'
  - where: thread
    claim: 'The order follows neither birth, camp nor territory; Reuben, Judah, Levi, Rachel’s sons, Leah’s last sons (younger first), the handmaids’ sons'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/33.htm'
    quote: 'It neither accords with the respective order of the sons of Jacob, nor with the distribution of the tribes in the camp, nor with the situation of their possessions … Zebulun and Issachar, the last sons of Leah (in both cases the younger before the elder)'
  - where: section 1 plain
    claim: '“Rose up” is the dawning of light; “saints” are holy ones'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Deuteronomy%2033&version=NRSVUE'
    quote: 'The Lord came from Sinai and dawned from Seir upon us; he shone forth from Mount Paran. With him were myriads of holy ones'
  - where: section 3 plain
    claim: '“Unicorns” is the wild ox; “him that was separated” is one set apart'
    key: bdb
    url: 'https://biblehub.com/hebrew/7214.htm'
    quote: 'רְאֵם noun masculineJob 39:10 wild ox'
  - where: section 5 plain
    claim: '“Refuge” is a dwelling place; enemies “found liars” cringe'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Deuteronomy%2033&version=NRSVUE'
    quote: 'Heb The eternal God is a dwelling place'

  - where: 'note 33:2 “A fiery law”'
    claim: 'The written text has one word (ketiv), read as two words, fire and law (qere)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'אשדת'
  - where: 'note 33:2 “A fiery law”'
    claim: 'The qere reads esh dat, fire and law'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'דָּ֖ת'
  - where: 'note 33:2 “A fiery law”'
    claim: 'Dat is a Persian loanword found only in Persian-period books; in Deut. 33:2 the phrase is corrupt; emendations include flaming fire'
    key: bdb
    url: 'https://biblehub.com/hebrew/1881.htm'
    quote: 'decree, law, usage, only in Persian period … Persian loan-word … In Deuteronomy 33:2 ᵑ0 אֵשׁ דָּת לָמוֺ fire was a law for them is corrupt; many emendations proposed … fire of flames, flaming fire'
  - where: 'note 33:2 “A fiery law”'
    claim: 'A modern translation renders “at his right, a host of his own,” noting the Hebrew is uncertain; “myriads of holy ones”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Deuteronomy%2033&version=NRSVUE'
    quote: 'With him were myriads of holy ones, at his right, a host of his own. … 33.2 Cn Compare Gk: Meaning of Heb uncertain'
  - where: 'note 33:2 “A fiery law”'
    claim: 'The modern translation’s “myriads of holy ones” corrects the Hebrew from the ancient versions'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Deuteronomy%2033&version=NRSVUE'
    quote: '33.2 Cn Compare Gk Sam Syr Vg: MT He came from Ribeboth-kodesh'

  - where: 'note 33:9 “Levi, who did not know his brethren”'
    claim: 'The Urim and Thummim were worn by the high priest on the breastplate'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/33.htm'
    quote: 'The Urim and Thummim - that pledge, which the high priest wore upon his breast-plate'
  - where: 'note 33:9 “Levi, who did not know his brethren”'
    claim: 'At Massah and Meribah it was primarily the people who strove'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/33.htm'
    quote: 'At both places it was primarily the people who strove with Moses and Aaron, and thereby tempted God'
  - where: 'note 33:9 “Levi, who did not know his brethren”'
    claim: 'Verse 9 refers to Exodus 32:26–29; the reading cites Matthew 10:37'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/33.htm'
    quote: 'even with the denial of father, mother, brethren, and children (Matthew 10:37; Matthew 19:29). The words, "who says to his father," etc., relate to the event narrated in Exodus 32:26-29'
  - where: 'note 33:9 “Levi, who did not know his brethren”'
    claim: 'Verse 9’s words and reason, and verse 10’s calling'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/33?lang=eng'
    quote: 'neither did he acknowledge his brethren, nor knew his own children: for they have observed thy word, and kept thy covenant.'

  - where: 'note 33:9 “Levi, who did not know his brethren”'
    claim: 'One older reading: in these trials Levi proved itself a holy one, though at Meribah Moses and Aaron stumbled'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/33.htm'
    quote: 'In these temptations Levi had proved itself "a holy one," although in the latter Moses and Aaron stumbled'

  - where: 'note 33:12 “Between his shoulders”'
    claim: 'One older reading: Benjamin dwells between the LORD’s shoulders, on His back, the figure of a father carrying his son'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/33.htm'
    quote: '"Between the shoulders" is equivalent to "upon the back" (vid., 1 Samuel 17:6). The expression is founded upon the figure of a father carrying his son'
  - where: 'note 33:12 “Between his shoulders”'
    claim: 'The same reading: all Israel shares Benjamin’s blessing and dwelt with Him in safety'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/33.htm'
    quote: 'All Israel was, like Benjamin, the beloved of the Lord (vid., Jeremiah 11:15; Psalm 60:7), and dwelt with Him in safety (vid., Deuteronomy 33:28).'
  - where: 'note 33:12 “Between his shoulders”'
    claim: 'The Hebrew names the LORD once; the second clause has only a participle, covers him'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'חֹפֵ֤ף'
  - where: 'note 33:12 “Between his shoulders”'
    claim: 'Another older commentary judges the text probably corrupt'
    key: cambridge-deuteronomy
    url: 'https://biblehub.com/commentaries/cambridge/deuteronomy/33.htm'
    quote: 'As the overloaded first line of the Heb., the want of a fourth line and the variants of the versions indicate, the text is probably corrupt.'
  - where: 'note 33:12 “Between his shoulders”'
    claim: 'A modern translation: “the Most High surrounds him all day long,” a correction of the Hebrew “above him”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Deuteronomy%2033&version=NRSVUE'
    quote: 'the Most High surrounds him all day long … 33.12 Cn: Heb above him'

  - where: 'note 33:13 “Joseph''s blessing”'
    claim: 'The land of Ephraim and Manasseh included some of the richest land in the country'
    key: bd-ephraim
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ephraim?lang=eng'
    quote: 'the district assigned to the two sons of Joseph included some of the richest land in the country'
  - where: 'note 33:13 “Joseph''s blessing”'
    claim: '“Separated from his brethren” is nezir echav'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'נְזִ֥יר'
  - where: 'note 33:13 “Joseph''s blessing”'
    claim: 'Nazir: a Nazirite, one dedicated by vow; of Joseph (Gen. 49:26 = Deut. 33:16) a prince, one consecrated among his brethren'
    key: bdb
    url: 'https://biblehub.com/hebrew/5139.htm'
    quote: '1 of prince, ruler, as consecrated: נְזִיר אֶחָיו Lam 49:26 (poem in J), one consecrated among his brethren, = Deuteronomy 33:16 … 2 specifically of one dedicated to ׳י by vow'
  - where: 'note 33:17 “Pushing the people together”'
    claim: 'Re’em is the wild ox, fierce and strong'
    key: bdb
    url: 'https://biblehub.com/hebrew/7214.htm'
    quote: 'wild ox, as fierce and strong Job 39:9,10'
  - where: 'note 33:17 “Pushing the people together”'
    claim: 'D&C 58:45, of the elders of the Church: they shall push the people together from the ends of the earth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/58?lang=eng'
    quote: 'And now, verily, I say concerning the residue of the elders of my church … For, behold, they shall push the people together from the ends of the earth.'
  - where: 'note 33:17 “Pushing the people together”'
    claim: 'The chapter heading reads the chapter as the Lord gathering Israel in the latter days'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/33?lang=eng'
    quote: 'the Lord will gather Israel in the latter days'
  - where: 'note 33:17 “Pushing the people together”'
    claim: 'The Bible Dictionary cites Deut. 33:13–17 for Ephraim’s latter-day privilege to bear the Restoration and gather Israel'
    key: bd-ephraim
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ephraim?lang=eng'
    quote: 'in the last days it has been the tribe of Ephraim’s privilege first to bear the message of the Restoration of the gospel to the world and to gather scattered Israel (Deut. 33:13–17; D&C 64:36; 133:26–34)'

  - where: 'note 33:17 “Pushing the people together”'
    claim: 'The verb (nagach) means push or thrust at, of Joseph as a wild ox'
    key: bdb
    url: 'https://biblehub.com/hebrew/5055.htm'
    quote: 'push or thrust at, followed by accusative: of Joseph under figure of wild ox Deuteronomy 33:17'
  - where: 'note 33:17 “Pushing the people together”'
    claim: 'A modern translation: with them he gores the peoples all together'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Deuteronomy%2033&version=NRSVUE'
    quote: 'with them he gores the peoples all together to the ends of the earth'

  - where: 'note 33:25 “As thy days, so shall thy strength be”'
    claim: 'Dobe’ occurs only here'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'דָּבְאֶֽ/ךָ'
  - where: 'note 33:25 “As thy days, so shall thy strength be”'
    claim: 'Perhaps rest, sense very doubtful; Greek, Syriac and Targum read strength, perhaps from another word'
    key: bdb
    url: 'https://biblehub.com/hebrew/1679.htm'
    quote: 'perhaps rest, but sense very doubtful (? Arabic rest, †amus; ᵐ5 ᵑ6 ᵑ7Onk strength, reading perhaps רבאך compare Samaritan רביך, see Di)'
  - where: 'note 33:25 “As thy days, so shall thy strength be”'
    claim: 'The Greek reads “as thy days, so shall be thy strength”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/deuteronomy/33.htm'
    quote: '25His sandal shall be iron and brass; as thy days, so shall be thy strength.'

  - where: 'note 33:27 “The eternal God is thy refuge”'
    claim: '“Refuge” renders me’onah'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'מְעֹנָה֙'
  - where: 'note 33:27 “The eternal God is thy refuge”'
    claim: 'Me’onah here: the ancient God is a dwelling-place for his people'
    key: bdb
    url: 'https://biblehub.com/hebrew/4585.htm'
    quote: '2 figurative מְעֹנָה אֱלֹהֵי קֶדֶם Deuteronomy 33:27 the ancient God is a dwelling-place (for his people'
  - where: 'note 33:27 “The eternal God is thy refuge”'
    claim: 'A modern translation’s footnote gives the Hebrew as “The eternal God is a dwelling place”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Deuteronomy%2033&version=NRSVUE'
    quote: '33.27 Cn: Heb The eternal God is a dwelling place'
  - where: christ
    claim: 'Jehovah is the premortal Jesus Christ; the Bible Dictionary cites Mosiah 15:1'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary (see Mosiah 3:8; 15:1; 3 Ne. 15:1–5; D&C 110:1–10).'
