chapter: 28
claims:
  - where: when
    claim: 'Moses speaks in the plains of Moab in the fortieth year after the Exodus'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/1?lang=eng'
    quote: 'And it came to pass in the fortieth year, in the eleventh month, on the first day of the month, that Moses spake unto the children of Israel'

  - where: setting
    claim: 'Deuteronomy 28 is very similar to Leviticus 26, blessings in vv. 1–14 and punishments in vv. 15–68'
    key: ot-manual-deuteronomy-17-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/deuteronomy-17-33-an-exhortation-to-obedience-part-2?lang=eng'
    quote: 'This chapter of Deuteronomy is very similar to Leviticus 26, in which the Lord specifically outlined the blessings that would accrue to Israel if they were obedient (see vv. 1–14) and also the punishments they would suffer if they turned from the Lord (see vv. 15–68).'
  - where: setting
    claim: 'Blessings and curses were a major feature of the suzerain-vassal treaty that seems to underlie the covenant at Sinai'
    key: uriona-curses
    url: 'https://byustudies.byu.edu/article/the-curse-of-the-covenant-the-deuteronomic-curses-in-the-book-of-mormon'
    quote: 'A major feature of this type of treaty was the promise of blessings as well as the threat of curses. … It is this covenant type that seems to underlie the covenant God made with Israel under Moses’s leadership'
  - where: setting
    claim: 'Jeremiah used the Deuteronomic curses to explain the destruction of Jerusalem'
    key: uriona-curses
    url: 'https://byustudies.byu.edu/article/the-curse-of-the-covenant-the-deuteronomic-curses-in-the-book-of-mormon'
    quote: 'In the writings of Jeremiah, a contemporary to Lehi and Nephi, the Deuteronomic curses were used to explain Jerusalem’s destruction.'
  - where: thread
    claim: 'The chapter falls into the blessings (1–14), the curses (15–46), and two further sections, 47–57 and 58–68'
    key: cambridge-deuteronomy
    url: 'https://biblehub.com/commentaries/cambridge/deuteronomy/28.htm'
    quote: 'The Blessings in Deuteronomy 28:1-14 find their antitheses within the first section on the Curses … and are further developed in two additional sections, Deuteronomy 28:47-57 and Deuteronomy 28:58-68, cleanly separate in form from what precedes them and from each other.'
  - where: thread
    claim: 'From 28:47 the calamities are predicted because of an actual failure to serve God'
    key: cambridge-deuteronomy
    url: 'https://biblehub.com/commentaries/cambridge/deuteronomy/28.htm'
    quote: 'All this is not threatened conditionally on the possible disobedience of the people, but predicted absolutely because of their actual failure to serve God.'

  - where: section 1 plain
    claim: 'The Hebrew behind “store” is kneading trough'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/28?lang=eng'
    quote: '5a “store”: HEB kneading trough.'
  - where: section 2 plain
    claim: '“Botch” is boils; “emerods” are hemorrhoids or tumors'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/28?lang=eng'
    quote: '“the”: HEB hemorrhoids or tumors.'
  - where: section 2 plain
    claim: '“Botch” is boils'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/28?lang=eng'
    quote: '“botch”: OR boils. Ex. 9:9 (8–10).'
  - where: section 2 plain
    claim: '“No might in thine hand” means no power to prevent it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/28?lang=eng'
    quote: '32a “might in thine hand”: OR power to prevent it.'

  - where: 'note 28:15 “Why the curses run so long”'
    claim: 'Deuteronomy 28 is one of the longest chapters in the Bible; about four-fifths of it is curses'
    key: uriona-curses
    url: 'https://byustudies.byu.edu/article/the-curse-of-the-covenant-the-deuteronomic-curses-in-the-book-of-mormon'
    quote: 'Deuteronomy 28 is one of the longest chapters in the Bible. It is telling that roughly four-­fifths of the chapter lists prescribed curses for those who prove unfaithful, possibly underscoring the force that an impending curse had on the imagination of those in ancient Near East.'
  - where: 'note 28:15 “Why the curses run so long”'
    claim: 'Blessings and curses in treaties ensured fidelity'
    key: uriona-curses
    url: 'https://byustudies.byu.edu/article/the-curse-of-the-covenant-the-deuteronomic-curses-in-the-book-of-mormon'
    quote: 'The blessings and curses ensured covenant fidelity and maintained the social and political relationships between covenant parties.'
  - where: 'note 28:16 “The blessings turned inside out”'
    claim: 'The curses are the mirror image of the blessings, in more explicit detail'
    key: dundas-ancient-israel
    url: 'https://rsc.byu.edu/mormons-record/ancient-israel'
    quote: 'The curses for disobedience are the mirror image of the blessings, but in even more explicit detail:'
  - where: 'note 28:45 “The Book of Mormon reads its history by these curses”'
    claim: 'Lehi''s directive to keep the commandments and prosper in the land is set beside Deut. 28:15'
    key: sc-knowhy-268
    url: 'https://scripturecentral.org/knowhy/why-is-lehi-depicted-as-similar-to-moses'
    quote: 'Directive to keep the commandments so that the people would prosper in the land (2 Nephi 1:20; 4:4; Deuteronomy 28:15; 29:9)'
  - where: 'note 28:45 “The Book of Mormon reads its history by these curses”'
    claim: 'Jacob couples a sore curse with destruction, as 28:45 does'
    key: uriona-curses
    url: 'https://byustudies.byu.edu/article/the-curse-of-the-covenant-the-deuteronomic-curses-in-the-book-of-mormon'
    quote: 'the Lord will “visit them with a sore curse, even unto destruction” (Jacob 2:33). Remember that Deuteronomy 28 reads, “All these curses shall come upon thee, and shall pursue thee, and overtake thee, till thou be destroyed; because thou hearkenedst not” (Deut. 28:45).'
  - where: 'note 28:45 “The Book of Mormon reads its history by these curses”'
    claim: 'The Amlicite and Lamanite dead devoured by beasts and vultures (Alma 2:38) reflect 28:25–26'
    key: uriona-curses
    url: 'https://byustudies.byu.edu/article/the-curse-of-the-covenant-the-deuteronomic-curses-in-the-book-of-mormon'
    quote: 'This comment is reflective of a curse described in Deuteronomy 28 that reads, “The Lord shall cause thee to be smitten . . . and thy carcase shall be meat unto all fowls of the air, and unto the beast'
  - where: 'note 28:45 “The Book of Mormon reads its history by these curses”'
    claim: 'Abinadi alludes to the curses of 28:25–26'
    key: uriona-curses
    url: 'https://byustudies.byu.edu/article/the-curse-of-the-covenant-the-deuteronomic-curses-in-the-book-of-mormon'
    quote: 'Abinadi’s words echo what we find in Deuteronomy 28 (Deut. 28:25–26; see also Lev. 26:25).'
  - where: 'note 28:45 “The Book of Mormon reads its history by these curses”'
    claim: 'The Nephites provide the final example of the Deuteronomic curse; Mormon''s letter (Moro. 9:7–8)'
    key: uriona-curses
    url: 'https://byustudies.byu.edu/article/the-curse-of-the-covenant-the-deuteronomic-curses-in-the-book-of-mormon'
    quote: 'The Nephites may not have provided the first example of being cursed within the Book of Mormon, but they provide the final example of a curse found in the book of Deuteronomy for those unfaithful to God’s covenant'
  - where: 'note 28:45 “The Book of Mormon reads its history by these curses”'
    claim: 'Book of Mormon authors reaffirm that failing to hearken brings cursing and death'
    key: uriona-curses
    url: 'https://byustudies.byu.edu/article/the-curse-of-the-covenant-the-deuteronomic-curses-in-the-book-of-mormon'
    quote: 'In this way, the Book of Mormon authors reaffirm the idea that failing to hearken to the Lord would bring cursing and death. Just as the Israelites believed that they perished because they failed to hearken, so did the Nephites.'
  - where: 'note 28:45 “The Book of Mormon reads its history by these curses”'
    claim: 'The Lamanite raids on King Noah''s people resemble 28:31'
    key: sc-knowhy-369
    url: 'https://scripturecentral.org/knowhy/how-do-the-covenants-in-the-scriptures-apply-to-me-today'
    quote: 'This is similar to what the Lord said would happen to those who broke their covenants in these ways: “Thine ox shall be slain before thine eyes, and ... thine ass shall be violently taken away from before thy face'
  - where: 'note 28:45 “The Book of Mormon reads its history by these curses”'
    claim: 'Insects devouring the Zeniffites'' grain fulfill 28:38; the priests of Noah carrying off grain fulfill 28:33'
    key: sc-knowhy-369
    url: 'https://scripturecentral.org/knowhy/how-do-the-covenants-in-the-scriptures-apply-to-me-today'
    quote: 'And whatever food was left “shall a nation which thou knowest not eat up” (Deuteronomy 28:33; Leviticus 26:16). This was fulfilled when the priests of Noah came “into the land of Nephi by night and carried off their grain” (Mosiah 21:21).'

  - where: 'note 28:47 “Serving without joy”'
    claim: 'Older reading: joyful service is characteristic of Deuteronomy (12:7, 12, 18; 16:11, 14; 26:11); the abundance recalls 6:10–12 and 8:11–18'
    key: cambridge-deuteronomy
    url: 'https://biblehub.com/commentaries/cambridge/deuteronomy/28.htm'
    quote: 'with joyfulness, and with gladness of heart] Characteristic of the temper of D; 12. 7, 12, 18, Deuteronomy 16:11; Deuteronomy 16:14 f. (be altogether joyful), Deuteronomy 26:11; cp. Isaiah 65:13 f. by reason of the abundance, etc.] Cp. Deuteronomy 6:10-12, Deuteronomy 8:11-18.'
  - where: 'note 28:47 “Serving without joy”'
    claim: '“Served” may be rendered worshipped'
    key: cambridge-deuteronomy
    url: 'https://biblehub.com/commentaries/cambridge/deuteronomy/28.htm'
    quote: 'Because thou hast not served the Lord thy God] or worshipped.'
  - where: 'note 28:47 “Serving without joy”'
    claim: 'From v. 47 the calamities are predicted because of an actual failure'
    key: cambridge-deuteronomy
    url: 'https://biblehub.com/commentaries/cambridge/deuteronomy/28.htm'
    quote: 'All this is not threatened conditionally on the possible disobedience of the people, but predicted absolutely because of their actual failure to serve God.'

  - where: 'note 28:49 “The nation from far”'
    claim: 'Jeremiah portrays the fall of Jerusalem as the fulfillment of the covenant curse'
    key: uriona-curses
    url: 'https://byustudies.byu.edu/article/the-curse-of-the-covenant-the-deuteronomic-curses-in-the-book-of-mormon'
    quote: 'In the writings of Jeremiah, a contemporary to Lehi and Nephi, the Deuteronomic curses were used to explain Jerusalem’s destruction.'
  - where: 'note 28:49 “The nation from far”'
    claim: 'The Student Manual reads 49–57 as fulfilled with particular preciseness in the Roman siege of A.D. 70'
    key: ot-manual-deuteronomy-17-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/deuteronomy-17-33-an-exhortation-to-obedience-part-2?lang=eng'
    quote: 'But in the siege of Jerusalem by the Romans in A.D. 70, the prophecy seems to have been fulfilled with particular preciseness. Note the parallels.'
  - where: 'note 28:49 “The nation from far”'
    claim: 'Rome is over a thousand miles away; the eagle was on the legions'' standards'
    key: ot-manual-deuteronomy-17-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/deuteronomy-17-33-an-exhortation-to-obedience-part-2?lang=eng'
    quote: '“A nation … from far” (v. 49). Rome lies over a thousand miles from Israel. … The eagle was the symbol of Rome and was carried on the standards of the legions of Rome.'
  - where: 'note 28:49 “The nation from far”'
    claim: 'Babylon''s Aramaic was a sister tongue to Hebrew; Latin was completely different'
    key: ot-manual-deuteronomy-17-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/deuteronomy-17-33-an-exhortation-to-obedience-part-2?lang=eng'
    quote: 'While the Aramaic of Babylon was a sister tongue to Hebrew, Latin was completely different in alphabet, structure, and so on.'
  - where: 'note 28:53 “The siege foretold, and fulfilled”'
    claim: 'The Church footnote at 28:53 links 2 Kgs. 6:28–29, Lev. 26:29 and Jer. 19:9; at 57 Lam. 4:10'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/28?lang=eng'
    quote: '“eat”: Lev. 26:29; Jer. 19:9; 2 Ne. 19:20.'
  - where: 'note 28:53 “The siege foretold, and fulfilled”'
    claim: 'The Church footnote at 28:53 links 2 Kgs. 6:28–29'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/28?lang=eng'
    quote: '“flesh”: 2 Kgs. 6:29 (28–29).'
  - where: 'note 28:53 “The siege foretold, and fulfilled”'
    claim: 'At the Babylonian siege the people did turn to cannibalism'
    key: ot-manual-deuteronomy-17-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/deuteronomy-17-33-an-exhortation-to-obedience-part-2?lang=eng'
    quote: 'When Jerusalem fell to Babylonian forces under Nebuchadnezzar, conditions were so terrible that the people did turn to cannibalism to survive (see Lamentations 4:1–10).'
  - where: 'note 28:53 “The siege foretold, and fulfilled”'
    claim: 'In the Roman siege people turned to cannibalism; Josephus tells of a noblewoman of Perea'
    key: ot-manual-deuteronomy-17-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/deuteronomy-17-33-an-exhortation-to-obedience-part-2?lang=eng'
    quote: 'Josephus described a noblewoman from Perea who killed her son and used him for food during the siege (see Josephus, Wars, bk. 6, chap. 3, pars. 4–5).'
  - where: 'note 28:53 “The siege foretold, and fulfilled”'
    claim: 'Mormon''s letter (Moro. 9:7–8) echoes the curse of 28:53'
    key: uriona-curses
    url: 'https://byustudies.byu.edu/article/the-curse-of-the-covenant-the-deuteronomic-curses-in-the-book-of-mormon'
    quote: 'Mormon’s description of the destruction that befell the Nephites echoes the curses found in Deuteronomy 28 for those who did not hearken to God.'

  - where: 'note 28:58 “This book”'
    claim: 'The collection of the laws ends with “all the words of this law that are written in this book” (28:58), within a series of inclusios'
    key: seely-self-reference
    url: 'https://rsc.byu.edu/they-shall-grow-together/rhetoric-self-reference-deuteronomy-book-mormon'
    quote: 'The final form of Deuteronomy is structured with a series of inclusios, and the collection of the laws ends with “all the words of this law that are written in this book” (28:58).'
  - where: 'note 28:58 “This book”'
    claim: 'Like ancient treaties, the curses of 28–29 refer to the written text'
    key: seely-self-reference
    url: 'https://rsc.byu.edu/they-shall-grow-together/rhetoric-self-reference-deuteronomy-book-mormon'
    quote: 'Similar to the self-references in ancient treaties, the curses of the covenant in Deuteronomy 28 and 29 also reflect self-referential passages'
  - where: 'note 28:58 “This book”'
    claim: 'Four phrases of self-reference: these words, this law, this book, this book of the law; Moses'' words were to be written and transmitted'
    key: seely-self-reference
    url: 'https://rsc.byu.edu/they-shall-grow-together/rhetoric-self-reference-deuteronomy-book-mormon'
    quote: 'Several passages throughout the book contain self-referential passages referring to the words of Moses that were to be written down and transmitted to the future.'
  - where: 'note 28:63 “The LORD will rejoice to destroy”'
    claim: 'Older reading: a bold anthropomorphism meant to remove the last prop of false confidence; holiness of His love demands punishment'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/28.htm'
    quote: 'With this bold anthropomorphic expression Moses seeks to remove from the nation the last prop of false confidence in the mercy of God. Greatly as the sin of man troubles God, and little as the pleasure may be which He has in the death of the wicked'
  - where: 'note 28:63 “The LORD will rejoice to destroy”'
    claim: 'Older reading: the holiness of His love demands the destruction of those who despise His goodness'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/28.htm'
    quote: 'yet the holiness of His love demands the punishment and destruction of those who despise the riches of His goodness and long-suffering'
  - where: 'note 28:63 “The LORD will rejoice to destroy”'
    claim: 'Older reading: a rhetorical figure characteristic of Deuteronomy; contrast Hosea 11:8'
    key: cambridge-deuteronomy
    url: 'https://biblehub.com/commentaries/cambridge/deuteronomy/28.htm'
    quote: '63. rejoiced over you, etc.] Cp. Deuteronomy 8:16, Deuteronomy 30:9. … rejoice … to destroy you] This rhetorical figure is characteristic of the deuteronomic style. Contrast Hosea 11:8 f.'

  - where: 'note 28:68 “Back to Egypt”'
    claim: 'Older reading: the worst comes last, a return to slavery; ships cut off escape; no buyer shows utmost contempt'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/28.htm'
    quote: 'Last of all, Moses mentions the worst, namely, their being taken back to Egypt into ignominious slavery. … "In ships:" i.e., in a way which would cut off every possibility of escape. … This clause, which indicates the utmost contempt'
  - where: 'note 28:68 “Back to Egypt”'
    claim: 'The Church footnote at 68 explains Egypt as captivity and links Hosea 8:13'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/28?lang=eng'
    quote: '68a “into Egypt”: IE into captivity, symbolized by “Egypt.” Hosea 8:13.'

