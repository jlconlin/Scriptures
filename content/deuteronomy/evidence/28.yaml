  - where: explore
    claim: 'Uriona''s article treats the Deuteronomic curses in the Book of Mormon'
    key: uriona-curses
    url: 'https://byustudies.byu.edu/article/the-curse-of-the-covenant-the-deuteronomic-curses-in-the-book-of-mormon'
    quote: 'Not surprisingly then, the threat of cursing also appears as a prominent feature of the Book of Mormon and can be best understood in relation to the Deuteronomy covenant text.'
