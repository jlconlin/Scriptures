chapter: 20
claims:
  - where: setting
    claim: 'Chapter 20 is part of the code of laws (12–26), which looks to keeping the inheritance of the land'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'the largest law code, the Deuteronomic Code (Deuteronomy 12–26), reiterates the Lord’s covenant expectations for the Israelites in the context of their exclusive relationship with him and their imminent inheritance of the land of promise.'
  - where: setting
    claim: 'Horses and chariots were the main strength of Israel''s neighbors'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/20.htm'
    quote: 'Horses and chariots constituted the principal strength of the enemies round about Israel; not of the Egyptians only (Exodus 14:7), and of the Canaanites and Philistines (Joshua 17:16; Judges 4:3; 1 Samuel 13:5), but of the Syrians also'
  - where: setting
    claim: 'Doctrine and Covenants 98 restates the law of war given to the ancients'
    key: skinner-renounce-war
    url: 'https://rsc.byu.edu/nineteenth-century-saints-war/renounce-war-proclaim-peace'
    quote: 'Doctrine and Covenants 98 is actually a recapitulation of the law of warfare He gave to “all [his] ancient prophets and apostles” (D&C 98:32).'
  - where: thread
    claim: 'One older reading: the chapter spares as far as possible the lives of Israel''s soldiers and of the enemy'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/20.htm'
    quote: 'enjoin it as a duty upon the people of God to spare as much as possible the lives of their own soldiers and also of their enemies.'
  - where: thread
    claim: 'The officers (shoterim) raised and organized the army'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/20.htm'
    quote: 'If the shoterim had to raise men for the war and organize the army, the division of the men into hosts (Zebaoth) and the appointment of the leaders would also form part of the duties of their office.'
  - where: thread
    claim: 'The herem of 16–18 is set in the context of siege warfare'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'In Deuteronomy 20:16–18 and throughout the conquest narrative of Joshua, the ḥērem is described in the context of siege warfare.'

  - where: 'note 20:5 “Sent home before the battle”'
    claim: 'To dedicate a house was to take possession of it and live in it'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/20.htm'
    quote: '"Consecrated the house," viz., by taking possession and dwelling in it; entrance into the house was probably connected with a hospitable entertainment.'
  - where: 'note 20:5 “Sent home before the battle”'
    claim: 'A new planting''s fruit was first made common in the fifth year (Lev. 19:23–25)'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/20.htm'
    quote: 'the fruit was not to be eaten for the first three years, and that of the fourth year was to be consecrated to the Lord; and it was only the fruit that was gathered in the fifth year which could be applied by the owner to his own use'
  - where: 'note 20:5 “Sent home before the battle”'
    claim: 'The betrothed man''s release is extended in 24:5 to a year for the newly married'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/20.htm'
    quote: 'is extended still further in Deuteronomy 24:5, where it is stated that a newly married man was to be exempt for a whole year from military service and other public burdens.'
  - where: 'note 20:5 “Sent home before the battle”'
    claim: 'One older reading: the purpose was not to weed out the unwilling but not to deprive a covenant member of God''s good gifts'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/20.htm'
    quote: 'but rather to avoid depriving any member of the covenant nation of his enjoyment of the good things of this life bestowed upon him by the Lord.'
  - where: 'note 20:5 “Sent home before the battle”'
    claim: 'The wording of Lev. 19:23 and Deut. 24:5 (scripture read)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/20?lang=eng'
    quote: 'What man is there that hath built a new house, and hath not dedicated it? let him go and return to his house, lest he die in the battle, and another man dedicate it.'

  - where: 'note 20:8 “The fainthearted, and the Ammonites’ exemption”'
    claim: 'Welch (as the KnoWhy reports) reads the exemption narrowly; the Talmud: one afraid because of his transgressions'
    key: sc-knowhy-274
    url: 'https://scripturecentral.org/knowhy/why-were-the-people-of-ammon-exempted-from-military-duty'
    quote: '“Since everyone going into battle was likely ‘fearful and fainthearted,’ the exemption undoubtedly had a narrower meaning in actual practice; otherwise nearly everyone would have been exempt. Indeed, as the Talmud clarifies, this expression in Deuteronomy ‘alludes to one who is afraid because of the transgressions he had committed.’”'
  - where: 'note 20:8 “The fainthearted, and the Ammonites’ exemption”'
    claim: 'Later rabbis read "enemies" in 20:1 as not including fellow Israelites; Welch sees the same in the Ammonites'' refusal to fight their brethren'
    key: sc-knowhy-274
    url: 'https://scripturecentral.org/knowhy/why-were-the-people-of-ammon-exempted-from-military-duty'
    quote: 'The legal requirement in Deuteronomy 20:1–2 speaks only of going out to battle “against thine enemies.” Later Jewish Rabbis interpreted enemies to be of a completely different tribe or people'
  - where: 'note 20:8 “The fainthearted, and the Ammonites’ exemption”'
    claim: 'The Nephites granted a conditional exemption in accordance with ancient interpretations of Deut. 20'
    key: sc-knowhy-567
    url: 'https://scripturecentral.org/knowhy/why-did-the-ammonites-covenant-not-to-take-up-arms'
    quote: 'In accordance with ancient interpretations of Deuteronomy 20, the Nephites granted the Anti-Nephi-Lehies a conditional exemption from military duty.'
  - where: 'note 20:8 “The fainthearted, and the Ammonites’ exemption”'
    claim: 'Alma 27:23 gives the reason: their fear to take up arms lest they sin'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/27?lang=eng'
    quote: 'and this we do for our brethren, on account of their fear to take up arms against their brethren lest they should commit sin'

  - where: 'note 20:10 “Peace offered first”'
    claim: 'The manual: the offer is not a compromise; the enemy must yield; latter-day scripture supports it (D&C 98:33–36; Alma 43:46; 48:14–16)'
    key: ot-manual-deuteronomy-17-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/deuteronomy-17-33-an-exhortation-to-obedience-part-2?lang=eng'
    quote: 'The offer of peace cannot be an offer to compromise. The cause, if it be just, must be maintained; the enemy must yield to gain peace (Deut. 20:10–13). … [This position is supported also in latter-day scripture; see D&C 98:33–36; Alma 43:46; 48:14–16.]'
  - where: 'note 20:10 “Peace offered first”'
    claim: 'D&C 98 recapitulates the ancient law of war; the Lord justified going to battle only after the matter was brought to Him'
    key: skinner-renounce-war
    url: 'https://rsc.byu.edu/nineteenth-century-saints-war/renounce-war-proclaim-peace'
    quote: 'He justified His covenant people in going to battle only after they had brought the matter before Him.'
  - where: 'note 20:10 “Peace offered first”'
    claim: 'D&C 98:34 wording (scripture read)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/98?lang=eng'
    quote: 'And if any nation, tongue, or people should proclaim war against them, they should first lift a standard of peace unto that people, nation, or tongue;'

  - where: 'note 20:16 “The cities of the land: a battle order”'
    claim: '"All that breathe" refers to humans, not livestock'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'there is no indication in any of these passages that the phrase includes livestock as well as humans. In Joshua 11:14, it explicitly includes only the humans and not the livestock.'
  - where: 'note 20:16 “The cities of the land: a battle order”'
    claim: 'The injunction is a battle order in siege warfare, applicable while the battle lasted'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'The injunction to “leave alive none that breathe” (Deuteronomy 20:16) must be understood within this context as a battle order, applicable only while the battle lasted.'
  - where: 'note 20:16 “The cities of the land: a battle order”'
    claim: 'Perhaps equivalent to "Take no prisoners," in contrast with verse 14'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'Given that the injunction in Deuteronomy 20:16 contrasts with verse 14, in which the women and children of foreign cities are not only to be left alive but taken as spoils of war, the injunction is perhaps equivalent to the modern English command “Take no prisoners.”'
  - where: 'note 20:16 “The cities of the land: a battle order”'
    claim: 'Scripture''s reasons may not be the full picture of God''s purposes'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'Some reasons for the ḥērem are given in scripture, including the danger of the Israelites learning Canaanite practices (Deuteronomy 20:18), … but we need not assume that these reasons provide a complete picture of God’s purposes.'
  - where: 'note 20:16 “The cities of the land: a battle order”'
    claim: 'The verses themselves (scripture read)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/20?lang=eng'
    quote: 'That they teach you not to do after all their abominations, which they have done unto their gods; so should ye sin against the LORD your God.'

  - where: 'note 20:19 “Are the trees men?”'
    claim: 'A modern translation renders the clause as a question'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Deuteronomy+20%3A19-20&version=NRSVUE'
    quote: 'Are trees in the field human beings that they should come under siege from you?'
  - where: 'note 20:19 “Are the trees men?”'
    claim: 'One older reading: men may be overcome, but not the trees'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/20.htm'
    quote: 'The meaning is: thou mayest suppress and destroy the men, but not the trees which …'
  - where: 'note 20:19 “Are the trees men?”'
    claim: 'The trees are the fruit trees around the town, as the reason given shows'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/20.htm'
    quote: 'That we are to understand by עצהּ the fruit-trees in the environs and gardens of the town, is evident from the motive appended: "for of them (ממּנּוּ refers to עץ as a collective) thou eatest, and thou shalt not hew them down."'

  - where: christ
    claim: 'D&C 98 text (scripture read)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/98?lang=eng'
    quote: 'And if any nation, tongue, or people should proclaim war against them, they should first lift a standard of peace unto that people, nation, or tongue;'
