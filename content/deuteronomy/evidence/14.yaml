chapter: 14
claims:
  - where: setting
    claim: 'The food laws of verses 4–20 repeat Leviticus 11 in all essential points'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/14.htm'
    quote: 'the laws of Leviticus 11 relating to clean and unclean animals are repeated in all essential points in vv. 4-20 (for the exposition, see at Leviticus 11)'
  - where: thread
    claim: 'Both the mourning rites and unclean food were opposed to Israel''s calling as a holy nation'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/14.htm'
    quote: 'neither to disfigure their bodies by passionate expressions of sorrow for the dead (Deuteronomy 14:1 and Deuteronomy 14:2), nor to defile themselves by unclean food (vv. 3-21). Both of these were opposed to their calling.'
  - where: thread
    claim: 'The tithe meal is a second way of sanctifying food'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/14.htm'
    quote: 'As the Israelites were to sanctify their food, on the one hand, positively by abstinence from everything unclean, so were they, on the other hand, to do so negatively by delivering the tithes and firstlings at the place where the Lord would cause His name to dwell'
  - where: thread
    claim: 'The food code was given to set Israel apart, not because unclean animals were unhealthy'
    key: sc-knowhy-807
    url: 'https://scripturecentral.org/knowhy/why-do-latter-day-saints-obey-the-word-of-wisdom'
    quote: 'this health code was not given because the unclean animals were unhealthy but because the Lord wanted to set the Israelites apart from the world'
  - where: 'note 14:1 “Children of the LORD do not mark themselves for the dead”'
    claim: 'The laws of 14:1 repeat Lev. 19:28 and 21:5'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/14.htm'
    quote: 'The laws in Deuteronomy 14:1 are simply a repetition of Leviticus 19:28 and Leviticus 21:5.'
  - where: 'note 14:1 “Children of the LORD do not mark themselves for the dead”'
    claim: 'Israel''s sonship was an adoption from God''s free love that binds the son to obedience and trust'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/14.htm'
    quote: 'simply as an adoption springing out of the free love of God, as the manifestation of paternal love on the part of Jehovah to Israel, which binds the son to obedience, reverence, and childlike trust'
  - where: 'note 14:1 “Children of the LORD do not mark themselves for the dead”'
    claim: 'God''s fatherhood of Israel is historical and ethical, based on choice and the deliverance from Egypt'
    key: cambridge-deuteronomy
    url: 'https://biblehub.com/commentaries/cambridge/deuteronomy/14.htm'
    quote: 'In the O.T. God’s fatherhood and Israel’s sonship are historical and ethical, based not on physical generation, but on an act of love on God’s part, on His choice or adoption (cp. Romans 9:4) of the people, and on His deliverance of them from Egypt'
  - where: 'note 14:1 “Children of the LORD do not mark themselves for the dead”'
    claim: 'Neighboring peoples conceived their sonship to their gods physically; Moabites called sons and daughters of Chemosh'
    key: cambridge-deuteronomy
    url: 'https://biblehub.com/commentaries/cambridge/deuteronomy/14.htm'
    quote: 'the Moabites are called sons and daughters of Kemosh, Numbers 21:29. But the relation was conceived physically.'
  - where: 'note 14:1 “Children of the LORD do not mark themselves for the dead”'
    claim: 'Leviticus 19:28 forbids cuttings for the dead (scripture read)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/14?lang=eng'
    quote: '1c “cut”: 1 Kgs. 18:28. TG Body, Sanctity of.'
  - where: 'note 14:21 “Carrion for the stranger, and the Joseph Smith Translation”'
    claim: 'The stranger is a non-Israelite resident in the land; the law sought justice and fair treatment for him'
    key: bd-stranger
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/stranger?lang=eng'
    quote: 'The word is frequently used to denote a man of non-Israelite birth, resident in the promised land with the permission of the Israelite authorities. There were various provisions in the law with regard to the treatment of strangers, all of which were intended to secure for them justice and fair treatment'
  - where: 'note 14:21 “Carrion for the stranger, and the Joseph Smith Translation”'
    claim: 'The KJV reading gives the impression of a double standard; the JST corrects it to "not give … not sell"'
    key: horton-jst-pentateuch
    url: 'https://rsc.byu.edu/joseph-smith-translation/insights-exodus-leviticus-numbers-deuteronomy'
    quote: 'This passage gives the impression the Lord has a double standard-one for Israel and another for strangers.'
  - where: 'note 14:21 “Carrion for the stranger, and the Joseph Smith Translation”'
    claim: 'The JST reads "thou shalt not give it … thou mayest not sell it"'
    key: horton-jst-pentateuch
    url: 'https://rsc.byu.edu/joseph-smith-translation/insights-exodus-leviticus-numbers-deuteronomy'
    quote: 'is corrected to read, “Ye shall not eat of anything that dieth of itself; thou shalt not give it unto the stranger . . . or thou mayest not sell it unto an alien.”'
  - where: 'note 14:21 “Carrion for the stranger, and the Joseph Smith Translation”'
    claim: 'The Church''s footnotes give the JST readings at 14:21'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/14?lang=eng'
    quote: 'thou shalt give it unto the stranger that is in thy gates, that he may eat it'
  - where: 'note 14:23 “A tithe the giver ate”'
    claim: 'The verse recalls the earlier tithe laws without repeating them, to add the sacrificial meals'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/14.htm'
    quote: 'which recalls the earlier laws concerning the tithe (Leviticus 27:30, and Numbers 18:21, Numbers 18:26.), without repeating them one by one, for the purpose of linking on the injunction to celebrate sacrificial meals at the sanctuary from the tithes and firstlings'
  - where: 'note 14:23 “A tithe the giver ate”'
    claim: 'To fear the LORD here means to rejoice with reverence in fellowship with Him'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/14.htm'
    quote: 'The true meaning therefore is, that Israel might rejoice with holy reverence in the fellowship of its God.'
  - where: 'note 14:23 “A tithe the giver ate”'
    claim: 'Those far from the sanctuary could sell the tithe and buy the meal there'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/14.htm'
    quote: 'permission was given for those who lived at a great distance from the sanctuary to sell the tithes at home, provided they could not convey them in kind, and then to spend the money so obtained in the purchase of the things required for the sacrificial meals'
  - where: 'note 14:23 “A tithe the giver ate”'
    claim: 'Numbers 18 gives the tithe to the Levites, who tithe it to the priests'
    key: bd-tithe
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tithe?lang=eng'
    quote: 'In Num. 18:21–28 it is directed that tithe be paid to the Levites, who in their turn give one-tenth of what they receive to the priests.'
  - where: 'note 14:23 “A tithe the giver ate”'
    claim: 'Another older reading: the tithe law of Numbers and Leviticus differs fundamentally from Deuteronomy''s'
    key: cambridge-deuteronomy
    url: 'https://biblehub.com/commentaries/cambridge/deuteronomy/14.htm'
    quote: 'those in P, Numbers 18:21-32 (with the corresponding practice, Nehemiah 10:37 f.) and Leviticus 27:30 f., fundamentally differ from D’s law of tithes.'
  - where: 'note 14:23 “A tithe the giver ate”'
    claim: 'Scripture read: Num. 18:21 and verses 23–27 of the chapter'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/14?lang=eng'
    quote: '22a “tithe”: TG Tithing.'
  - where: 'note 14:26 “Wine and strong drink at the LORD''s table”'
    claim: '"Lusteth" means to long or yearn for; wine and strong drink were commonly used in ceremonial meals; forbidden to priests in service and Nazarites'
    key: ot-manual-dt-1-16
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/deuteronomy-1-16-an-exhortation-to-obedience-part-1?lang=eng'
    quote: 'it is merely a King James translation of a word that means ‘to long or yearn for.’ Also the use of wine and other fermented fluids (here called ‘strong drink’) may surprise us because we do not use them for any purpose; however, they were then commonly used in ceremonial meals.'
  - where: 'note 14:26 “Wine and strong drink at the LORD''s table”'
    claim: 'Shekar is intoxicating drink, usually condemned, forbidden to priests on duty and Nazirites, allowable in the sacrificial meal of 14:26'
    key: bdb
    url: 'https://biblehub.com/hebrew/7941.htm'
    quote: 'intoxioating drink, strong drink … usually condemned … forbidden to priests on duty Leviticus 10:9 (P); not for princes Proverbs 31:4; nor Nazirite Numbers 6:3 … allowable in sacrificial meal Deuteronomy 14:26'
  - where: 'note 14:28 “The third year''s tithe for the poor”'
    claim: 'Two years of three the tithe was brought to the temple and feasted; in the third it was stored in the towns for the poor'
    key: seely-cry-widow
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/cry-widow-fatherless-stranger'
    quote: 'In Deuteronomy, every two out of three years, the tithes were to be brought to the temple, given to the Lord, and celebrated with a feast. In the third year, the tithes were to be stored in the cities where they could be used to meet the needs of the poor and the Levites, the widows and the orphans.'
  - where: 'note 14:28 “The third year''s tithe for the poor”'
    claim: 'Tithing was common in the ancient Near East, given as offerings to the king'
    key: seely-cry-widow
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/cry-widow-fatherless-stranger'
    quote: 'Tithing was a common feature in other ancient Near Eastern cultures and was given as annual offerings to the king.'
  - where: 'note 14:28 “The third year''s tithe for the poor”'
    claim: 'The prayer of Deut. 26 shows the gratitude that should accompany sharing with the poor'
    key: seely-cry-widow
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/cry-widow-fatherless-stranger'
    quote: 'The prayer prescribed in Deuteronomy 26 that accompanies the tithe beautifully illustrates the thoughtful gratitude that should accompany obedience to the commandments and sharing with the poor.'
  - where: 'note 14:28 “The third year''s tithe for the poor”'
    claim: 'Scripture read: Deut. 26:12–15 and 14:29'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/14?lang=eng'
    quote: '29a “widow”: D&C 83:6 (5–6).'
  - where: christ
    claim: 'A KnoWhy reads Benjamin''s "sons and daughters" as an allusion to Deut. 14:1–2'
    key: sc-knowhy-307
    url: 'https://scripturecentral.org/knowhy/why-did-king-benjamin-say-that-his-people-would-be-sons-and-daughters-at-gods-right-hand'
    quote: 'Bowen observed that this is an allusion to the covenant language of Deuteronomy 14:1–2:'
  - where: christ
    claim: 'The clean and unclean regulations, fulfilled by the Atonement, are no longer required'
    key: bd-clean-unclean
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/clean-and-unclean?lang=eng'
    quote: 'being fulfilled by the Atonement of Jesus Christ, they are no longer required of the believers. See Mark 7:15–23; Acts 10:9–16, 28; 15:29'
  - where: christ
    claim: 'Scripture read: Mosiah 5:7; 3 Ne. 15:5'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/5?lang=eng'
    quote: 'ye shall be called the children of Christ, his sons, and his daughters'
  - where: christ
    claim: 'The Church’s footnote at “widow” (14:29) is D&C 83:6'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/14?lang=eng'
    quote: '29a “widow”: D&C 83:6 (5–6).'
  - where: christ
    claim: 'D&C 83:6: the storehouse provides for widows, orphans and the poor'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/83?lang=eng'
    quote: 'And the storehouse shall be kept by the consecrations of the church; and widows and orphans shall be provided for, as also the poor.'
