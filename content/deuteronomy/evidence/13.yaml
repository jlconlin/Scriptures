chapter: 13
claims:
  - where: when
    claim: 'Moses speaks in the fortieth year after the Exodus'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/1?lang=eng'
    quote: 'And it came to pass in the fortieth year, in the eleventh month, on the first day of the month, that Moses spake unto the children of Israel'
  - where: setting
    claim: 'Chapters 12–26 are the code of laws; its first group deals with the ritual of religion and begins with destroying idolatrous objects'
    key: bd-deuteronomy
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/deuteronomy?lang=eng'
    quote: '(2) 12–26, a code of laws, which forms the nucleus of the whole book. The first group of laws deals with the ritual of religion and begins with a command to destroy all idolatrous objects of worship in Canaan'
  - where: setting
    claim: 'False prophets threatened the community as much as idolatry and foreign cults'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'In addition to idolatry and foreign cults, perhaps nothing threatened communal integrity and survival as much as false prophets and illicit mantic activities.'
  - where: setting
    claim: 'The Hebrew numbers the chapter one verse ahead of the King James (13:17 is Hebrew 13:18)'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'in Deuteronomy 7:26; 13:17 (Hebrew Bible v. 18), the Hebrew word behind KJV “cursed thing” is ḥērem.'
  - where: setting
    claim: 'The leaders who thought Jesus a deceiver used the law of Deuteronomy 13:1–5 to justify killing Him'
    key: sc-knowhy-508
    url: 'https://scripturecentral.org/knowhy/why-did-christ-perform-miracles'
    quote: 'Caiaphas and others who thought that Jesus was a deceiver were misled, but they used the law in Deuteronomy as their legal justification for killing Christ.'
  - where: setting
    claim: 'Mormon tells the destruction of Ammonihah in a way that follows the law of apostate cities'
    key: sc-knowhy-123
    url: 'https://scripturecentral.org/knowhy/why-was-the-city-of-ammonihah-destroyed-and-left-desolate'
    quote: 'In this account, Mormon details the proper and complete adherence to the legal procedures outlined in Deuteronomy.'
  - where: thread
    claim: 'The chapter sets out three cases: a prophet or dreamer, the nearest relations and friends, and a town led into idolatry'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/13.htm'
    quote: 'The second case was when the temptation to idolatry proceeded from the nearest blood-relations and friends.'
  - where: thread
    claim: 'The third case is a town led away to idolatry'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/13.htm'
    quote: 'The third case is that of a town that had been led away to idolatry.'
  - where: thread
    claim: 'The power of love and kinship is set against the supposed divine authority of the seducers in the first case'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/13.htm'
    quote: 'The power of love and relationship, which flesh and blood find it hard to resist, is placed here in contrast with the supposed higher or divine authority of the seducers.'
  - where: 'note 13:1 “A sign that comes true does not prove the prophet”'
    claim: 'Deuteronomy 13:1–5 indicates that unauthorized prophets or dreamers could in fact work signs and wonders to push Israel away from the LORD, and to deceive the elect'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'Deuteronomy 13:1–5 indicates that unauthorized mantic “prophet[s]” or “dreamer[s] of dreams” could, in fact, effect signs and wonders, not only for the purpose of pushing the Israelites away from Yahweh'
  - where: 'note 13:1 “A sign that comes true does not prove the prophet”'
    claim: 'The prophet and the dreamer answer to the two means of revelation, vision and dream, of Numbers 12:6'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/13.htm'
    quote: 'The introduction of חלום חלם, "a dreamer of dreams," along with the prophet, answers the two media of divine revelation, the vision and the dream, by which, according to Numbers 12:6, God made known His will.'
  - where: 'note 13:1 “A sign that comes true does not prove the prophet”'
    claim: 'Signs and wonders were not the highest or decisive test in Israel; prophets were judged by the word of God already received'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/13.htm'
    quote: 'for even their announcements were to be judged according to the standard of the fixed word of God that had been already given'
  - where: 'note 13:1 “A sign that comes true does not prove the prophet”'
    claim: 'The test of Deuteronomy 18:22 was put to Hananiah in Jeremiah 28'
    key: sc-knowhy-554
    url: 'https://scripturecentral.org/knowhy/why-did-jacob-include-the-case-of-sherem'
    quote: 'Hananiah, a supposed prophet, had prophesied that the yoke of Babylonian bondage would be broken within two years (Jeremiah 28:1–4, 10–11), a prophecy which Jeremiah said would be put to the test outlined in Deuteronomy'
  - where: 'note 13:3 “Why the LORD lets a false sign succeed”'
    claim: 'When a false prophet’s sign succeeds, the law teaches Israel that the LORD is proving them; mortal life is a probationary state (Abraham 3:25)'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'Mortal existence, after all, constitutes a “probationary state” and the Lord intends to “prove [us all] herewith, to see if [we] will do all things whatsoever the Lord their God shall command [us]” (Abraham 3:25)'
  - where: 'note 13:3 “Why the LORD lets a false sign succeed”'
    claim: 'Deuteronomy presents the wilderness, the manna and the prophet whose signs come to pass as tests of Israel’s heart, as God tested Abraham'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'The forty years in the wilderness, the feeding of the children of Israel with manna, and even the possibility of a prophet whose signs come to pass but who would lead the people to idolatry are all presented as tests'
  - where: 'note 13:5 “Put the evil away”'
    claim: 'The verb behind “put away” is biʿer, to burn, consume, utterly remove'
    key: bdb
    url: 'https://biblehub.com/hebrew/1197.htm'
    quote: '3 figurative consume, utterly remove, particular of evil and guilt, with accusative, especially in Deuteronomic phrase ובערת הרע מקרבך'
  - where: 'note 13:5 “Put the evil away”'
    claim: 'The phrase recurs in Deuteronomy 17:7, 12; 19:13, 19; 21:21; 22:21, 22, 24; 24:7'
    key: bdb
    url: 'https://biblehub.com/hebrew/1197.htm'
    quote: 'Deuteronomy 13:6; Deuteronomy 17:7,12; Deuteronomy 19:13,19; Deuteronomy 21:21 compare Deuteronomy 21:9; Deuteronomy 22:21,22,24; Deuteronomy 24:7'
  - where: 'note 13:5 “Put the evil away”'
    claim: 'The word in verse 5 is the Piel of baʿar (Strong’s 1197)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'וּ/בִֽעַרְתָּ֥'
  - where: 'note 13:9 “Thine hand shall be first upon him”'
    claim: 'The words presuppose the judicial procedure of 17:7, in which the witnesses cast the first stones'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/13.htm'
    quote: 'presuppose the judicial procedure prescribed in Deuteronomy 17:7, that the witnesses were to cast the first stones at the person condemned.'
  - where: 'note 13:9 “Thine hand shall be first upon him”'
    claim: '“Son of thy mother” stresses closeness; the temptation in secret could be hidden'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/13.htm'
    quote: 'if the temptation occurred in secret, and therefore the fact might be hidden from others.'
  - where: 'note 13:9 “Thine hand shall be first upon him”'
    claim: 'The fear in verse 11 is the fruit of the punishment, not the principle of the law'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/13.htm'
    quote: 'The fear of punishment, which is given here as the ultimate end of the punishment itself, is not to be regarded as the principle lying at the foundation of the law'
  - where: 'note 13:13 “The children of Belial”'
    claim: 'Belial means worthless; sons of Belial are wicked men; the list includes 2 Corinthians 6:15'
    key: bd-belial
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/belial?lang=eng'
    quote: 'Worthless. Sometimes translated “wicked” (2 Sam. 23:6); sons of Belial, or wicked men (Deut. 13:13; Judg. 19:22; 20:13; 1 Sam. 1:16; 2:12; 10:27; 25:17, 25; 30:22; 2 Sam. 16:7; 20:1; 1 Kgs. 21:10, 13; 2 Chr. 13:7; 2 Cor. 6:15).'
  - where: 'note 13:13 “The children of Belial”'
    claim: 'Beliyyaʿal is a compound of “without” and “worth, use, profit”; Deuteronomy 13 is its first occurrence'
    key: bdb
    url: 'https://biblehub.com/hebrew/1100.htm'
    quote: 'בְּלִיַּ֫עַל27 noun [masculine] worthlessness (compound בְּלִי not, without and יַעַל worth, use, profit) — ׳בּ Deuteronomy 13:14 20t.'
  - where: 'note 13:13 “The children of Belial”'
    claim: 'The phrase in 13:13 is bene beliyyaʿal, “sons of Belial”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'בְלִיַּ֨עַל֙'
  - where: 'note 13:15 “An Israelite city under the ban”'
    claim: 'Calabro lists Israelites guilty of idolatry, including Deut. 13:15, 17, as a category of ḥērem'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: '(2) in reference to Israelites guilty of idolatry or other offences against God and subject to punishment by death (Exodus 22:20; Leviticus 27:29; Deuteronomy 13:15, 17; Joshua 7:12; Ezra 10:8)'
  - where: 'note 13:15 “An Israelite city under the ban”'
    claim: 'Only Jericho received treatment as extreme as the apostate Israelite city: people and cattle killed, city burned, never to be rebuilt'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'Only Jericho seems to get the most extreme form of destruction, including not only the killing of human inhabitants but also the burning of the city, the slaying of livestock, and the proclamation not to rebuild the city, just like the treatment of an apostate Israelite city (Deuteronomy 13:12–18).'
  - where: 'note 13:15 “An Israelite city under the ban”'
    claim: 'The Hebrew behind “cursed thing” in 13:17 is ḥērem; the things are assigned to the Lord, not cursed'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'the land and things that are destroyed are thereby assigned to the Lord’s ownership and thus off-limits to humans; they are not cursed.'
  - where: 'note 13:15 “An Israelite city under the ban”'
    claim: 'Joshua 7 records an incident in which the restriction on the cursed thing was not kept, and its results'
    key: ot-manual-dt-1-16
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/deuteronomy-1-16-an-exhortation-to-obedience-part-1?lang=eng'
    quote: 'Cursed things were to be avoided by the Israelites altogether (see Joshua 7, which records an incident in which this restriction was not followed, and lists the resulting problems).'
  - where: 'note 13:15 “An Israelite city under the ban”'
    claim: 'The law required inquiry to determine whether the city had truly gone apostate'
    key: sc-knowhy-123
    url: 'https://scripturecentral.org/knowhy/why-was-the-city-of-ammonihah-destroyed-and-left-desolate'
    quote: 'required that inquiry be made to determine if the city had truly gone apostate, and if so, required that it be utterly destroyed “with the edge of the sword” (v. 15)'
  - where: 'note 13:16 “Ammonihah, a heap and a desolation”'
    claim: 'The Bible does not report any Israelite city destroyed under this law; the Book of Mormon likely does'
    key: sc-knowhy-123
    url: 'https://scripturecentral.org/knowhy/why-was-the-city-of-ammonihah-destroyed-and-left-desolate'
    quote: '“The Bible does not report that any Israelite cities, or their people or cattle actually were destroyed pursuant to this law.” While the Bible may not, the Book of Mormon likely does.'
  - where: 'note 13:16 “Ammonihah, a heap and a desolation”'
    claim: 'Alma, as high priest, investigated in person, with Amulek as the second witness'
    key: sc-knowhy-123
    url: 'https://scripturecentral.org/knowhy/why-was-the-city-of-ammonihah-destroyed-and-left-desolate'
    quote: 'As high priest, the responsibility naturally fell upon Alma to investigate, and while there the Lord provided Amulek as the necessary second witness (Deuteronomy 17:6) to condemn the city.'
  - where: 'note 13:16 “Ammonihah, a heap and a desolation”'
    claim: 'Alma echoed 13:15 in Alma 9:12, “utterly destroy you”'
    key: sc-knowhy-123
    url: 'https://scripturecentral.org/knowhy/why-was-the-city-of-ammonihah-destroyed-and-left-desolate'
    quote: 'He specifically echoed Deuteronomy 13:15 when he prophesied that the Lord “will utterly destroy you from off the face of the earth” (Alma 9:12; cf. v. 24, emphasis added).'
  - where: 'note 13:16 “Ammonihah, a heap and a desolation”'
    claim: 'The Nehorites had gone out from Zarahemla and withdrawn their city from Nephite leadership'
    key: sc-knowhy-123
    url: 'https://scripturecentral.org/knowhy/why-was-the-city-of-ammonihah-destroyed-and-left-desolate'
    quote: 'Withdrawn the inhabitants of their city They had withdrawn their city from Nephite leadership (Alma 9:6, 14)'
  - where: 'note 13:16 “Ammonihah, a heap and a desolation”'
    claim: 'Alma had given up the judgment-seat; the Lamanites carried out the destruction'
    key: sc-knowhy-123
    url: 'https://scripturecentral.org/knowhy/why-was-the-city-of-ammonihah-destroyed-and-left-desolate'
    quote: 'Carrying out the annihilation required someone with the political authority to wield the military force, but as John W. Welch has pointed out, Alma had recently given up the judgment-seat.'
  - where: 'note 13:16 “Ammonihah, a heap and a desolation”'
    claim: 'The Lord had long spared the city for the prayers of the righteous few'
    key: sc-knowhy-123
    url: 'https://scripturecentral.org/knowhy/why-was-the-city-of-ammonihah-destroyed-and-left-desolate'
    quote: 'The Lord had long spared the people due to the prayers of the few righteous among them—an indication of the Lord’s mercy and patience with this wicked and apostate city.'
  - where: christ
    claim: 'Deuteronomy 13:1–5 required death for those who gave signs to lead people into apostasy; Jesus’ accusers used it against Him'
    key: sc-knowhy-508
    url: 'https://scripturecentral.org/knowhy/why-did-christ-perform-miracles'
    quote: 'This was because of the law in Deuteronomy 13:1–5, which required the death penalty for those who gave “signs” and used them to lead people into what some might consider apostasy, or worshipping in other ways.'
  - where: christ
    claim: 'Bowen joins the deceiving signs of 13:1–5 to the Savior’s warning in Joseph Smith—Matthew 1:22'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'but also, in the language of the Savior, to “deceive the very elect, who are the elect according to the covenant” (Joseph Smith—Matthew 1:22).'
  - where: 'note 13:16 “Ammonihah, a heap and a desolation”'
    claim: 'The city was destroyed and left desolate in a single day'
    key: sc-knowhy-123
    url: 'https://scripturecentral.org/knowhy/why-was-the-city-of-ammonihah-destroyed-and-left-desolate'
    quote: 'In a single day, the city “was left desolate; and the carcasses were mangled by dogs and wild beasts of the wilderness”'
  - where: 'note 13:16 “Ammonihah, a heap and a desolation”'
    claim: 'The Nehorites had gone out from Zarahemla'
    key: sc-knowhy-123
    url: 'https://scripturecentral.org/knowhy/why-was-the-city-of-ammonihah-destroyed-and-left-desolate'
    quote: 'Certain men gone out from among you Nehorites had gone out from Zarahemla (Alma 1:15; 15:15)'
  - where: christ
    claim: 'The leaders thought Jesus had a devil and deceived the people, and so should die'
    key: sc-knowhy-508
    url: 'https://scripturecentral.org/knowhy/why-did-christ-perform-miracles'
    quote: 'the leaders of the Jews in Jerusalem thought that Jesus “had a devil” that he “deceived the people,” and so should die.'
