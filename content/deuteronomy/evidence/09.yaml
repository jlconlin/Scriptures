chapter: 9
claims:
  # ---------- when / setting / thread ----------
  - where: 'when'
    claim: 'Moses spoke in the fortieth year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/1?lang=eng'
    quote: 'And it came to pass in the fortieth year, in the eleventh month, on the first day of the month, that Moses spake unto the children of Israel'
  - where: 'setting'
    claim: 'Chapters 5–11 are the first part of the second discourse: the Ten Commandments and a practical exposition of them'
    key: bd-deuteronomy
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/deuteronomy?lang=eng'
    quote: 'The second discourse (Deut. 5–26) consists of two parts: (1) 5–11, the Ten Commandments and a practical exposition of them, (2) 12–26, a code of laws'
  - where: 'setting'
    claim: '9:1–10:11 warns against self-righteousness: not for their righteousness (1–6), proofs from the past (7–24), the intercession and the renewal of the covenant (9:25–10:11)'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/9.htm'
    quote: 'by first of all declaring without reserve, that the Lord was not about to give them Canaan because of their own righteousness, but that He would exterminate the Canaanites for their own wickedness (Deuteronomy 9:1-6); and then showing them for their humiliation, by proofs drawn from the immediate past'
  - where: 'setting'
    claim: 'The Church’s chapter heading: Moses rehearses Israel’s rebellions and his mediation'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/9?lang=eng'
    quote: 'Moses rehearses the rebellions of Israel and tells how he mediated between the people and the Lord'
  - where: 'thread'
    claim: 'The pride that sees blessings as proof of its own righteousness is the danger Moses warns against'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/9.htm'
    quote: 'pride which acknowledges the blessings of God; but instead of receiving them gratefully, as unmerited gifts of the grace of the Lord, sees in them nothing but proofs of its own righteousness and virtue'
  - where: 'thread'
    claim: 'Moses returns at 9:25 to the apostasy at Sinai to show Israel owed its preservation to God’s mercy'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/9.htm'
    quote: 'Moses returns in Deuteronomy 9:25. to the apostasy at Sinai, for the purpose of showing still further how Israel had no righteousness or ground for boasting before God, and owed its preservation'
  - where: 'thread'
    claim: '“Stiffnecked” means stubborn, untractable'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/9.htm'
    quote: 'they were a people "of a hard neck," i.e., a stubborn, untractable generation'
  - where: 'thread'
    claim: 'Exodus does not record the LORD’s anger with Aaron; Moses adds it (9:20)'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/9.htm'
    quote: 'In the historical account in Exodus 32, there is no special reference to this intercession, as it is included in the intercession for the whole nation.'

  # ---------- note 9:3 ----------
  - where: 'note 9:3 “Quickly, and yet little by little”'
    claim: 'The Hebrew word rendered “quickly” in 9:3 is mahēr'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'מַהֵ֔ר'
  - where: 'note 9:3 “Quickly, and yet little by little”'
    claim: 'The same word stands in 7:22, “at once”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'כַּלֹּתָ֣/ם מַהֵ֔ר'
  - where: 'note 9:3 “Quickly, and yet little by little”'
    claim: 'One older reading: quickly so far as God’s help went, by degrees for Israel’s well-being'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/9.htm'
    quote: 'So far as the almighty assistance of God was concerned, the Israelites would quickly overthrow the Canaanites; but for the sake of the well-being of Israel, the destruction would only take place by degrees.'
  - where: 'note 9:3 “Quickly, and yet little by little”'
    claim: 'Quickly is no more opposed to 7:22 than God’s not delaying to requite is opposed to His long-suffering'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/9.htm'
    quote: 'quickly, is no more opposed to Deuteronomy 7:22, ''thou mayest not destroy them quickly,'' than God''s not delaying to requite (Deuteronomy 7:10) is opposed to His long-suffering'

  # ---------- note 9:18 ----------
  - where: 'note 9:18 “A second forty days”'
    claim: 'Exodus: on the morrow Moses went up again to the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/32?lang=eng'
    quote: 'And it came to pass on the morrow, that Moses said unto the people, Ye have sinned a great sin: and now I will go up unto the LORD'
  - where: 'note 9:19 “Moses’ fear, in the Greek and in Hebrews”'
    claim: 'Hebrews 12:21 draws on the Septuagint of Deut. 9:19'
    key: sc-knowhy-469
    url: 'https://scripturecentral.org/knowhy/why-are-lehis-visions-like-those-of-other-prophets-in-his-day'
    quote: 'Hebrews 12:21 (drawing on LXX Deuteronomy 9:19)'
  - where: 'note 9:19 “Moses’ fear, in the Greek and in Hebrews”'
    claim: 'The Septuagint of 9:19 reads “I was greatly terrified”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/deuteronomy/9.htm'
    quote: '19And I was greatly terrified because of the wrath and anger, because the Lord was provoked with you utterly to destroy you'

  # ---------- note 9:22 ----------
  - where: 'note 9:22 “Three places, three rebellions”'
    claim: 'Taberah: named because the fire of the Lord burnt among them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/11?lang=eng'
    quote: 'And he called the name of the place Taberah: because the fire of the Lord burnt among them.'
  - where: 'note 9:22 “Three places, three rebellions”'
    claim: 'Kibroth-hattaavah: there they buried the people that lusted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/11?lang=eng'
    quote: 'And he called the name of that place Kibroth-hattaavah: because there they buried the people that lusted.'
  # ---------- note 9:26 ----------
  - where: 'note 9:26 “Thy people, not mine”'
    claim: 'The LORD’s words at the calf: thy people which thou hast brought forth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/9?lang=eng'
    quote: 'for thy people which thou hast brought forth out of Egypt have corrupted themselves'

  # ---------- christ ----------
  - where: 'christ'
    claim: 'Moses mediated between the people and the Lord (chapter heading)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/9?lang=eng'
    quote: 'tells how he mediated between the people and the Lord'
