chapter: 4
claims:
  # ---------- when / setting / thread ----------
  - where: 'when'
    claim: 'Moses spoke in the fortieth year, in the eleventh month'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/1?lang=eng'
    quote: 'And it came to pass in the fortieth year, in the eleventh month, on the first day of the month, that Moses spake unto the children of Israel'
  - where: 'when'
    claim: 'The fortieth year is counted from the Exodus'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/33?lang=eng'
    quote: 'in the fortieth year after the children of Israel were come out of the land of Egypt'
  - where: 'setting'
    claim: 'The first address runs from 1:6 to 4:40 and recounts the wanderings and the laws of Sinai'
    key: ot-manual-dt-1-16
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/deuteronomy-1-16-an-exhortation-to-obedience-part-1?lang=eng'
    quote: 'In the first address (Deuteronomy 1:6–4:40), Moses recounted the most important events in the wanderings in the wilderness and reminded Israel that they must not forget the laws given them at Sinai.'
  - where: 'setting'
    claim: 'With “and now” Moses turns from what the Lord had done to an exhortation to keep the law'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/4.htm'
    quote: 'With the word ועתּה, "and now," Moses passes from a contemplation of what the Lord had done for Israel, to an exhortation to keep the law of the Lord.'
  - where: 'setting'
    claim: 'Lehi’s farewell shares with Deuteronomy the call to remember the statutes and judgments, citing Deut. 4:1'
    key: sc-knowhy-268
    url: 'https://scripturecentral.org/knowhy/why-is-lehi-depicted-as-similar-to-moses'
    quote: 'Calls to remember the statutes and judgments of God (2 Nephi 1:16; Deuteronomy 4:1; 5:1)'
  - where: 'setting'
    claim: 'Chapters 1–3 retell the journey from Horeb'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/1?lang=eng'
    quote: 'And when we departed from Horeb, we went through all that great and terrible wilderness'
  - where: 'setting'
    claim: 'The first discourse is chapters 1–4; the second begins in chapter 5'
    key: bd-deuteronomy
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/deuteronomy?lang=eng'
    quote: 'The first discourse is found in Deut. 1–4 and is introductory. The second discourse (Deut. 5–26) consists of two parts'
  - where: 'setting'
    claim: 'Verse 44 is the heading of the discourse on the law that follows'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/4.htm'
    quote: 'Announcement of the Discourse upon the Law. - First of all, in Deuteronomy 4:44, we have the general notice in the form of a heading'
  - where: 'thread'
    claim: 'The chapter moves from exhortation (1–8), to Horeb remembered (9–14), to images forbidden (15–24), to dispersion and restoration (25–31), to a reason from history (32–40)'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/4.htm'
    quote: 'It then proceeds to a warning, not to forget the events at Horeb (Deuteronomy 4:9-14) and so fall into idolatry, the worship of images or idol deities (Deuteronomy 4:15-24); and it closes with a threat of dispersion among the heathen as the punishment of apostasy, and with a promise of restoration'
  - where: 'thread'
    claim: 'Verse 44 is a heading announcing the discourse on the law'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/4.htm'
    quote: 'Announcement of the Discourse upon the Law. - First of all, in Deuteronomy 4:44, we have the general notice in the form of a heading'

  # ---------- notes ----------
  - where: 'note 4:2 “Not a closed canon”'
    claim: 'The manual reasons that a warning not to add refers only to that prophet’s writings; Moses repeats it at 12:32'
    key: ot-manual-dt-1-16
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/deuteronomy-1-16-an-exhortation-to-obedience-part-1?lang=eng'
    quote: 'Moses, however, uttered the same warning in Deuteronomy 12:32. This reference indicates that any warning not to add to the things written refers only to the writings of that particular prophet.'
  - where: 'note 4:2 “Not a closed canon”'
    claim: 'Brigham Young: if such words shut the heavens, the revelations to prophets after Moses would amount to nothing'
    key: ot-manual-dt-1-16
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/deuteronomy-1-16-an-exhortation-to-obedience-part-1?lang=eng'
    quote: 'So if such quotations are given with the intent to shut the heavens, and put an end to all new revelation, then the revelations given to Prophets who arose after Moses … all amount to nothing'
  - where: 'note 4:2 “Not a closed canon”'
    claim: 'Elder Holland: virtually every prophet added scripture to what his predecessors received'
    key: holland-words-never-cease
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2008/04/my-words-never-cease?lang=eng'
    quote: 'The fact of the matter is that virtually every prophet of the Old and New Testament has added scripture to that received by his predecessors. If the Old Testament words of Moses were sufficient, as some could have mistakenly thought them to be'
  - where: 'note 4:2 “Not a closed canon”'
    claim: 'KnoWhy #704 sets Deut. 4:2 beside Revelation 22:18–19 as a warning of the kind found in covenantal or sacred texts'
    key: sc-knowhy-704
    url: 'https://scripturecentral.org/knowhy/does-the-book-of-revelation-establish-a-closed-canon'
    quote: 'Another point of consideration offers a comparison between these verses and other similar curses found in covenantal or sacred texts, warning others not to alter the words of the text. In Deuteronomy 4:2, Moses warns the people'
  - where: 'note 4:3 “Baal-peor”'
    claim: 'At Shittim Israel ate the sacrifices of Moab’s gods and joined itself to Baal-peor'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/25?lang=eng'
    quote: 'And they called the people unto the sacrifices of their gods: and the people did eat, and bowed down to their gods. And Israel joined himself unto Baal-peor'
  - where: 'note 4:3 “Baal-peor”'
    claim: 'The plague was stayed when Phinehas acted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/25?lang=eng'
    quote: 'And he went after the man of Israel into the tent, and thrust both of them through … So the plague was stayed from the children of Israel.'
  - where: 'note 4:3 “Baal-peor”'
    claim: 'Twenty-four thousand died in the plague'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/25?lang=eng'
    quote: 'And those that died in the plague were twenty and four thousand.'
  - where: 'note 4:3 “Baal-peor”'
    claim: 'Baal was worshipped by the Moabites and others as Baal-peor; the prophets call Baal “the Shame”'
    key: bd-baal
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/baal?lang=eng'
    quote: 'by Moabites, etc., as Baal-peor (Num. 25:1–3, 17–18) … The prophets call Baal “the Shame” (Jer. 11:13; Hosea 9:10).'
  - where: 'note 4:3 “Baal-peor”'
    claim: 'Moses chose the example because the congregation had lived through it a short time before'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/4.htm'
    quote: 'This example was adduced by Moses, because the congregation had passed through all this only a very short time before'
  - where: 'note 4:7 “Two questions at the center”'
    claim: 'Deuteronomy 4:1–14 forms a chiasm with two rhetorical questions about Israel’s greatness near the center (vv. 7–8)'
    key: sc-knowhy-635
    url: 'https://scripturecentral.org/knowhy/how-does-the-book-of-mormon-text-reflect-a-seventh-century-bc-israelite-writing-style'
    quote: 'Deuteronomy 4:1–14 forms a chiasm that contains two rhetorical questions regarding the greatness of Israel near the center (vv. 7–8)'
  - where: 'note 4:7 “Two questions at the center”'
    claim: 'Such central questions invite the hearer to reflect'
    key: sc-knowhy-635
    url: 'https://scripturecentral.org/knowhy/how-does-the-book-of-mormon-text-reflect-a-seventh-century-bc-israelite-writing-style'
    quote: 'these questions are used to invite the reader to reflect on the messages presented'
  - where: 'note 4:12 “A voice, and no form”'
    claim: 'The Hebrew word is tĕmûnâ, “likeness, form,” used in the second commandment and of the form of the LORD in Num. 12:8, compare Deut. 4:12'
    key: bdb
    url: 'https://biblehub.com/hebrew/8544.htm'
    quote: 'likeness, representation ("" מֶּסֶל) Exodus 20:4 = Deuteronomy 5:8, compare Deuteronomy 4:16,23,25; form, semblance of ׳י Numbers 12:8; Psalm 17:15, compare Deuteronomy 4:12'
  - where: 'note 4:12 “A voice, and no form”'
    claim: 'Numbers 12:8: the similitude of the LORD shall Moses behold'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/12?lang=eng'
    quote: 'With him will I speak mouth to mouth, even apparently, and not in dark speeches; and the similitude of the Lord shall he behold'
  - where: 'note 4:12 “A voice, and no form”'
    claim: 'The Church’s footnote to Deut. 4:14 points to D&C 84:19–23'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/4?lang=eng'
    quote: 'D&C 84:23 (19–23)'
  - where: 'note 4:12 “A voice, and no form”'
    claim: 'Moses sought to sanctify Israel to behold the face of God; they could not endure his presence'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'Now this Moses plainly taught to the children of Israel in the wilderness, and sought diligently to sanctify his people that they might behold the face of God; But they hardened their hearts and could not endure his presence'
  - where: 'note 4:16 “No likeness of male or female”'
    claim: 'One reading: images were forbidden at least partly because God’s true image is shown in living persons'
    key: sc-knowhy-627
    url: 'https://scripturecentral.org/knowhy/why-were-man-and-woman-created-in-the-image-of-god'
    quote: 'God commanded the Israelites not to make any graven images of God to bow down and worship (see Exodus 20:3–4; Deuteronomy 4:15–19), at least partially because rather than “dumb idols” (Habakkuk 2:8), God’s true image is manifest in living, breathing persons.'
  - where: 'note 4:19 “Allotted to all nations”'
    claim: 'One older reading: God allotted the heavenly bodies to the nations for worship, i.e. permitted it; it rejects the reading that they were given for light'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/4.htm'
    quote: 'The thought is not, "God has given the heathen the sun, moon, and stars for service, i.e., to serve them with their light," … but He has allotted them to them for worship, i.e., permitted them to choose them as the objects of their worship'
  - where: 'note 4:19 “Allotted to all nations”'
    claim: 'It compares Romans 1, God giving the heathen up'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/4.htm'
    quote: 'God gave up the heathen to idolatry and shameful lusts, because, although they knew Him from His works, they did not praise Him as God (Romans 1:21, Romans 1:24, Romans 1:26).'
  - where: 'note 4:19 “Allotted to all nations”'
    claim: 'Israel was not to imitate the nations because the LORD had taken them to himself (v. 20)'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/4.htm'
    quote: 'The Israelites were not to imitate the heathen in this respect, because Jehovah, who brought them out of the iron furnace of Egypt, had taken them (לקח) to Himself'
  - where: 'note 4:20 “The iron furnace”'
    claim: 'kûr is a smelting furnace, always used figuratively of suffering in punishment or discipline; “iron furnace” figures Egypt as bondage; also 1 Kgs 8:51, Jer. 11:4, Isa. 48:10'
    key: bdb
    url: 'https://biblehub.com/hebrew/3564.htm'
    quote: 'pot or furnace for smelting metals, but always in metaphor or simile of human sufferings in punishment or discipline: iron (figurative of Egypt as place of bondage) הַבַּרְזֶל ׳מִכּ Deuteronomy 4:20; Jeremiah 11:4'
  - where: 'note 4:30 “Even in the latter days”'
    claim: 'Moses prophetically foresaw the scattering and the gathering in the latter days'
    key: ot-manual-dt-1-16
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/deuteronomy-1-16-an-exhortation-to-obedience-part-1?lang=eng'
    quote: 'Here he prophetically foresaw one of the most common themes in the Old Testament: the scattering of Israel because of their wickedness, but also the great gathering that is to take place “in the latter days” (v. 30).'
  - where: 'note 4:30 “Even in the latter days”'
    claim: 'Moses foresaw the scattering and the gathering in the latter days, with two reasons: Israel’s turning and the covenant with the fathers'
    key: ot-manual-dt-1-16
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/deuteronomy-1-16-an-exhortation-to-obedience-part-1?lang=eng'
    quote: 'The Lord pointed out two reasons why Israel shall be regathered. First, many of latter-day Israel will turn to the Lord (see v. 29); second, the covenants Jehovah made with Israel’s fathers (the patriarchs) will be kept (see v. 31, 37).'
  - where: 'note 4:30 “Even in the latter days”'
    claim: 'The gathering is above all spiritual, a return to the covenants'
    key: ot-manual-dt-1-16
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/deuteronomy-1-16-an-exhortation-to-obedience-part-1?lang=eng'
    quote: 'This gathering involves a return to the lands of Israel’s inheritance, but, more important, it involves a spiritual gathering, that is, a return to the covenants and laws of God.'
  - where: 'note 4:30 “Even in the latter days”'
    claim: 'Elder McConkie: the gathering is receiving the truth and a true knowledge of the Redeemer'
    key: ot-manual-dt-1-16
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/deuteronomy-1-16-an-exhortation-to-obedience-part-1?lang=eng'
    quote: 'the gathering of Israel consists of receiving the truth, gaining again a true knowledge of the Redeemer, and coming back into the true fold of the Good Shepherd.'
  - where: 'note 4:41 “Three cities set apart”'
    claim: 'A suspected slayer could flee to a city of refuge where elders and Levites would hear the case'
    key: sc-knowhy-162
    url: 'https://scripturecentral.org/knowhy/why-was-ammoron-determined-to-avenge-the-blood-of-his-brother'
    quote: 'one suspected of wrongful homicide had the right to flee to a city of refuge, where a disinterested body of elders and Levites would hear the case (Numbers 35:9–24; Deuteronomy 4:41–44).'
  - where: 'note 4:41 “Three cities set apart”'
    claim: 'One older reading: the section stands between the addresses because Moses set the cities apart then (Num. 35), and as an example of careful obedience'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/4.htm'
    quote: 'in all probability for no other reason than because Moses set apart the cities at that time according to the command of God in Numbers 35:6, Numbers 35:14 … but also to give the people in this punctual observance of the duty devolving upon it an example for their imitation'
  - where: 'note 4:48 “Sion is not Zion”'
    claim: 'Sion (Śîʾōn, beginning with śîn) is a proper name of a mountain, Hermon'
    key: bdb
    url: 'https://biblehub.com/hebrew/7865.htm'
    quote: 'שִׂיאֹן proper name, of a mountain, i.e. Hermon, ׳הַר שׂ הוּא חֶרְמוֺן Deuteronomy 4:48'
  - where: 'note 4:48 “Sion is not Zion”'
    claim: 'Zion (Ṣiyyôn, beginning with ṣade) is the Jebusite stronghold David captured in Jerusalem'
    key: bdb
    url: 'https://biblehub.com/hebrew/6726.htm'
    quote: 'צִיּוֺן154 proper name, of a location … Zion … stronghold (of Jebusiteas), ׳מְצֻדַת צ captured by David, and made his residence 2 Samuel 5:7'
  - where: 'note 4:48 “Sion is not Zion”'
    claim: 'Hermon is a 9400-foot mountain in the extreme northeast'
    key: bd-hermon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hermon?lang=eng'
    quote: 'A mountain, 9400 feet high, in the extreme northeast of the Holy Land'
  - where: 'note 4:48 “Sion is not Zion”'
    claim: 'Hermon was also called Sirion and Shenir'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/3?lang=eng'
    quote: '(Which Hermon the Sidonians call Sirion; and the Amorites call it Shenir;)'

  # ---------- christ ----------
  - where: 'christ'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: 'christ'
    claim: 'The Church’s footnote to 4:33 points to 3 Ne. 11:3–14'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/4?lang=eng'
    quote: '3 Ne. 11:3 (3–14)'
  - where: 'christ'
    claim: 'At Bountiful the people heard a voice out of heaven'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/11?lang=eng'
    quote: 'they heard a voice as if it came out of heaven'

  - where: 'christ'
    claim: 'In 3 Nephi 11 the Father testifies of His Son'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/11?lang=eng'
    quote: 'Behold my Beloved Son, in whom I am well pleased, in whom I have glorified my name—hear ye him.'
  - where: 'note 4:2 “Not a closed canon”'
    claim: 'Holland: the Lord told Moses His words never cease'
    key: holland-words-never-cease
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2008/04/my-words-never-cease?lang=eng'
    quote: 'What justifies them was made clear by Jehovah Himself when He said to Moses, “My works are without end, and … my words … never cease.”'

  # ---------- explore ----------
