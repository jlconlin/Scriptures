chapter: 17
claims:
  - where: when
    claim: 'Moses speaks in the fortieth year, in the land of Moab'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/1?lang=eng'
    quote: 'And it came to pass in the fortieth year, in the eleventh month, on the first day of the month, that Moses spake unto the children of Israel'
  - where: setting
    claim: 'Chapters 12–26 are a code of laws, the nucleus of the book; after the laws of worship, food, tithe, debt, firstlings and festivals comes a group on the administration of justice'
    key: bd-deuteronomy
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/deuteronomy?lang=eng'
    quote: 'Then we have the law of debt, directions about firstlings, and a calendar of festivals. The next group of laws deals with the administration of justice, while the last group regulates private and social rights.'
  - where: setting
    claim: 'The code provided rules for kingship'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'The Deuteronomic code instructs the ancient Israelites on how to discern between false and true prophets and emphasizes obedience to the latter. Moreover, it provided rules for kingship and mandated the observance of “covenant economics.”'
  - where: setting
    claim: 'When Israel asked Samuel for a king, it was to be like all the nations, with Deuteronomy 17:14 behind the request'
    key: sc-knowhy-717
    url: 'https://scripturecentral.org/knowhy/why-did-nephis-people-want-him-to-be-a-king'
    quote: 'In the Old Testament, when the Israelites requested that Samuel appoint “a king to judge us,” their motive was that they “may be like all the nations” around them (1 Samuel 8:5, 20; see Deuteronomy 17:14).'
  - where: setting
    claim: 'The laws for kings in 17:14–20 are referenced throughout the Book of Mormon'
    key: sc-knowhy-428
    url: 'https://scripturecentral.org/knowhy/how-is-the-use-of-deuteronomy-in-the-book-of-mormon-evidence-for-its-authenticity'
    quote: 'Deuteronomy 17:14–20, for example, gives laws about how kings should behave. These laws are referenced throughout the Book of Mormon.'
  - where: setting
    claim: 'Deuteronomy 17:14–20 is the most succinct summation in the Bible of criteria for kingship'
    key: halverson-kingship
    url: 'https://journal.interpreterfoundation.org/deuteronomy-1714-20-as-criteria-for-book-of-mormon-kingship/'
    quote: 'Deuteronomy 17:14–20 represents the most succinct summation in the Bible of criteria for kingship.'
  - where: thread
    claim: 'One older reading: verse 1 continues the offenses that merited punishment, a manifest transgression of the laws of Jehovah’s worship (the blemished offering of Lev. 22:20)'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/17.htm'
    quote: 'Not only did the inclination to nature-worship, such as the setting up of the idols of Ashera and Baal, belong to the crimes which merited punishment, but also a manifest transgression of the laws concerning the worship of Jehovah, such as the offering of an ox or sheep that had some fault'
  - where: thread
    claim: 'One older reading: the witnesses threw the first stones to give practical proof of the truth of their statement'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/17.htm'
    quote: 'the witnesses were to be the first to lift up their hands against the criminal to stone him, that they might thereby give a practical proof of the truth of their statement, and their own firm conviction that the condemned was deserving of death'
  - where: thread
    claim: 'The sentence was carried out outside the town, showing the exclusion of the offender from the congregation'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/17.htm'
    quote: 'the sentence itself being executed outside the town (cf. Deuteronomy 22:24; Acts 7:58; Hebrews 13:12), just as it had been outside the camp during the journey through the wilderness (Leviticus 24:14; Numbers 15:36), to indicate the exclusion of the criminal from the congregation'
  - where: thread
    claim: 'Deuteronomy repeatedly warns Israel against becoming like the nations it was dispossessing'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'Deuteronomy repeatedly warns the Israelites against becoming like the nations whose land they were dispossessing.'
  - where: 'note 17:9 “The court at the chosen place”'
    claim: 'The court at the sanctuary followed the pattern of the Sinai judges bringing hard cases to Moses'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/17.htm'
    quote: 'Just as the judges appointed at Sinai were to bring to Moses whatever cases were too difficult for them to decide, that he might judge them according to the decision of God (Exodus 18:26 and Exodus 18:19); so in the future the judges of the different towns were to bring all difficult cases'
  - where: 'note 17:9 “The court at the chosen place”'
    claim: 'It was not a court of appeal; it decided cases the local court would not decide at all'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/17.htm'
    quote: '“this superior court was not a court of appeal; for it did not adjudicate after the local court had already given a verdict, but in cases in which the latter would not trust itself to give a verdict at all.”'
  - where: 'note 17:9 “The court at the chosen place”'
    claim: 'The priests appear as knowing and teaching the law; the judge makes the inquiry and pronounces sentence'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/17.htm'
    quote: 'the priests are introduced rather as knowing and teaching the law (Leviticus 10:11), than as actual judges. For this reason appeal was to be made not only to them, but also to the judge, whose duty it was in any case to make the judicial inquiry and pronounce the sentence.'
  - where: 'note 17:9 “The court at the chosen place”'
    claim: 'The sentence was founded on the law the priests taught'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/17.htm'
    quote: 'The sentence was to be founded upon the Thorah, upon the law which the priests had to teach.'
  - where: 'note 17:9 “The court at the chosen place”'
    claim: 'Refusing the priest or judge was punished as rebellion against God, in whose name the right had been spoken'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/17.htm'
    quote: 'Such refractory conduct was to be punished with death, as rebellion against God, in whose name the right had been spoken (Deuteronomy 1:17).'
  - where: 'note 17:14 “A king like all the nations”'
    claim: 'Human kingship in place of the LORD’s was another way Israel risked becoming like its neighbors; the code sought to curb the king’s power'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'Human kingship (in place of Yahweh’s kingship) presented yet another way in which the ancient Israelites risked becoming like their idolatrous neighbors and put additional distance between themselves and the Lord. Recognizing monarchy’s innate dangers, the Deuteronomic Code sought to drastically curb the power and prerogatives of the king.'
  - where: 'note 17:14 “A king like all the nations”'
    claim: 'The request of 1 Samuel 8 is anticipated in this law'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'The Israelites’ request or demand for kings mentioned above (1 Samuel 8) is anticipated already in this legislation (“I will set a king over me, like as all the nations that are about me,” Deuteronomy 17:14).'
  - where: 'note 17:16 “Horses, wives, silver and gold”'
    claim: 'Horses were used mainly in war; an older commentator thought the ban kept Israel from trusting cavalry rather than God'
    key: ot-manual-deuteronomy-17-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/deuteronomy-17-33-an-exhortation-to-obedience-part-2?lang=eng'
    quote: 'In the ancient Middle East, horses were used primarily in warfare. One Bible scholar believed this use was forbidden “lest the people might depend on a well-appointed cavalry as a means of security, and so cease from trusting in the strength and protection of God.'
  - where: 'note 17:16 “Horses, wives, silver and gold”'
    claim: 'Many wives were taken for political reasons; foreign wives were an enticement to false gods, and this led to Solomon’s fall'
    key: ot-manual-deuteronomy-17-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/deuteronomy-17-33-an-exhortation-to-obedience-part-2?lang=eng'
    quote: 'for usually a king had multiple wives for political as well as personal reasons. Foreign wives would represent an enticement to false gods; thus, they were forbidden, “that his heart turn not away” (v. 17). This situation later led to Solomon’s fall from God’s favor (see 1 Kings 11:4).'
  - where: 'note 17:16 “Horses, wives, silver and gold”'
    claim: 'Seeking wealth often led to oppression and unjust taxation'
    key: ot-manual-deuteronomy-17-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/deuteronomy-17-33-an-exhortation-to-obedience-part-2?lang=eng'
    quote: 'He should not seek to expand his wealth (see v. 17), for this goal often led to oppression and unjust taxation of the people.'
  - where: 'note 17:16 “Horses, wives, silver and gold”'
    claim: 'One reading takes “horses” as raising a military, and “return to Egypt” as leading the people back to bondage or apostasy'
    key: halverson-kingship
    url: 'https://journal.interpreterfoundation.org/deuteronomy-1714-20-as-criteria-for-book-of-mormon-kingship/'
    quote: 'Don’t acquire many horses (don’t raise a military) (v. 16). … Don’t return the people to Egypt (don’t return people to the house of bondage/apostasy) (v. 16).'
  - where: 'note 17:16 “Horses, wives, silver and gold”'
    claim: 'The Church’s footnotes to verses 16–17 point to Solomon’s horses and wives'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/17?lang=eng'
    quote: '“horses”: 1 Kgs. 4:26; 2 Chr. 9:28. … “wives”: 2 Sam. 5:13; 1 Kgs. 11:1; Jacob 1:15; 2:24'
  - where: 'note 17:20 “Kings in the Book of Mormon”'
    claim: 'The Church’s footnote to verse 17 points to Mosiah 2:14'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/17?lang=eng'
    quote: '“multiply”: Mosiah 2:14.'
  - where: 'note 17:18 “A copy of this law”'
    claim: 'The Hebrew mishneh means double, copy, second; here a written copy of the law'
    key: bdb
    url: 'https://biblehub.com/hebrew/4932.htm'
    quote: 'מִשְׁנֶה noun [masculine] double, copy, second … 2 written copy of law Deuteronomy 17:18; Joshua 8:32 (D).'
  - where: 'note 17:18 “A copy of this law”'
    claim: 'The Septuagint renders the phrase “this repetition of the law”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/deuteronomy/17.htm'
    quote: '18And when he shall be established in his government, then shall he write for himself this repetition of the law into a book by the hands of the priests the Levites;'
  - where: 'note 17:18 “A copy of this law”'
    claim: 'The book’s name means “repetition of the law”'
    key: bd-deuteronomy
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/deuteronomy?lang=eng'
    quote: 'The word means “repetition of the law.”'
  - where: 'note 17:18 “A copy of this law”'
    claim: 'God is the king; the human king is to be chief scriptorian, subject to God'
    key: sc-knowhy-363
    url: 'https://scripturecentral.org/knowhy/how-can-the-old-testament-covenants-help-us-understand-the-book-of-mormon'
    quote: '4. God is the king; any human king is to be the chief scriptorian, subject to God (see Deuteronomy 17:14–20).'
  - where: 'note 17:20 “Kings in the Book of Mormon”'
    claim: 'Nephi, Benjamin and Mosiah II follow the pattern of Deuteronomy 17 closely; King Noah inverts it'
    key: halverson-kingship
    url: 'https://journal.interpreterfoundation.org/deuteronomy-1714-20-as-criteria-for-book-of-mormon-kingship/'
    quote: 'the Book of Mormon narrative depicts examples of kingship that demonstrate close fidelity to the pattern set forth in Deuteronomy 17 (e.g., Nephi, Benjamin, or Mosiah II) or the inversion of the expected pattern of kingship (e.g., king Noah).'
  - where: 'note 17:20 “Kings in the Book of Mormon”'
    claim: 'Noah’s actions were the opposite of the ideal of Deuteronomy 17:14–20'
    key: halverson-kingship
    url: 'https://journal.interpreterfoundation.org/deuteronomy-1714-20-as-criteria-for-book-of-mormon-kingship/'
    quote: 'Noah was a spectacular failure in living as God expected kings to live. In fact, it is striking how distinctly opposite all Noah’s actions were from God’s ideal for kingship as set forth in Deuteronomy 17:14–20.'
  - where: 'note 17:20 “Kings in the Book of Mormon”'
    claim: 'Mosiah’s book is a good king, bad king, good king sequence, showing why Mosiah II ended kingship'
    key: halverson-kingship
    url: 'https://journal.interpreterfoundation.org/deuteronomy-1714-20-as-criteria-for-book-of-mormon-kingship/'
    quote: 'I believe that the Book of Mosiah was constructed as a sandwich narrative: good king [Benjamin], then bad king [Noah], then good king [Mosiah II]. This narrative structure highlights why Mosiah II recognized the problem of kingship.'
  - where: 'note 17:20 “Kings in the Book of Mormon”'
    claim: 'Mosiah 2:9–11 shows a king chosen by God from among the brethren, as verse 15 requires'
    key: sc-knowhy-428
    url: 'https://scripturecentral.org/knowhy/how-is-the-use-of-deuteronomy-in-the-book-of-mormon-evidence-for-its-authenticity'
    quote: 'Mosiah 2:9–11 notes that the Nephites set a king over themselves that was chosen by God from among their brethren, just as it states in Deuteronomy.'
  - where: 'note 17:20 “Kings in the Book of Mormon”'
    claim: 'In crowning Nephi the people accepted the Lord’s chosen ruler; righteous Nephite kings beginning with Nephi kept the criteria of Deuteronomy 17:14–20'
    key: sc-knowhy-717
    url: 'https://scripturecentral.org/knowhy/why-did-nephis-people-want-him-to-be-a-king'
    quote: 'Thus, in seeking to crown Nephi as their king, the people were accepting the Lord’s chosen ruler and were thus embracing rather than rejecting the Lord’s right to reign over them. This is reinforced by the way righteous Nephite kings, beginning with Nephi himself, adhered to the criteria of kingship'
  - where: christ
    claim: 'God himself is the king, as Jacob records (2 Ne. 10:14)'
    key: halverson-kingship
    url: 'https://journal.interpreterfoundation.org/deuteronomy-1714-20-as-criteria-for-book-of-mormon-kingship/'
    quote: 'Why? Because God himself is the king. As Jacob so beautiful records, “For he that raiseth up a king against me shall perish, for I, the Lord, the king of heaven, will be their king'
  - where: explore
    claim: 'Halverson’s study sets Nephi, Benjamin, Mosiah II and Noah against the criteria of Deut. 17:14–20'
    key: halverson-kingship
    url: 'https://journal.interpreterfoundation.org/deuteronomy-1714-20-as-criteria-for-book-of-mormon-kingship/'
    quote: 'Remarkably, the Book of Mormon narrative depicts examples of kingship that demonstrate close fidelity to the pattern set forth in Deuteronomy 17 (e.g., Nephi, Benjamin, or Mosiah II) or the inversion of the expected pattern of kingship (e.g., king Noah).'
  - where: christ
    claim: 'Priesthood power is maintained only by persuasion, long-suffering, gentleness, meekness and love unfeigned'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/121?lang=eng'
    quote: 'No power or influence can or ought to be maintained by virtue of the priesthood, only by persuasion, by long-suffering, by gentleness and meekness, and by love unfeigned'
  - where: christ
    claim: 'The Church’s footnote at “brethren” (17:20) is D&C 38:24'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/17?lang=eng'
    quote: '20a “brethren”: D&C 38:24.'
  - where: christ
    claim: 'D&C 38:24: let every man esteem his brother as himself'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/38?lang=eng'
    quote: 'And let every man esteem his brother as himself'
