chapter: 7
claims:
  - where: when
    claim: 'Moses speaks in the fortieth year, in the land of Moab'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/1?lang=eng'
    quote: 'And it came to pass in the fortieth year, in the eleventh month, on the first day of the month, that Moses spake unto the children of Israel'
  - where: setting
    claim: 'Chapters 5–11 are the first part of the second discourse: the Ten Commandments and a practical exposition of them'
    key: bd-deuteronomy
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/deuteronomy?lang=eng'
    quote: 'The second discourse (Deut. 5–26) consists of two parts: (1) 5–11, the Ten Commandments and a practical exposition of them, (2) 12–26, a code of laws'
  - where: setting
    claim: 'Chapter 7 continues the emphasis on the first commandment, total loyalty to the Lord'
    key: ot-minute-deut-rappleye
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1-6-8-15-18-29-30-34'
    quote: 'Continuing with the emphasis on the first commandment—to be totally loyal to the Lord and not worship other gods (Deuteronomy 5:6–7; 6:4–5)—Moses instructs the people that when they enter the land promised to them, they must “cast out” and “utterly destroy” the nations'
  - where: setting
    claim: 'Deuteronomy 7:1–6 is the first command of the herem for the conquest'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'The initial commandment of the ḥērem for Israel’s conquest of the promised land is in Deuteronomy 7:1–6.'
  - where: thread
    claim: 'Verses 1–5: cast out and destroy the nations, no intermarriage, destroy the objects of their worship'
    key: ot-minute-deut-rappleye
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1-6-8-15-18-29-30-34'
    quote: 'they must “cast out” and “utterly destroy” the nations that were already occupying the land, refrain from intermarrying with them, and destroy items connected with their idolatrous worship practices (7:1–3, 5).'
  - where: thread
    claim: 'Verses 6–11: Israel chosen to be a special people, its identity linked to exclusive worship of the Lord'
    key: ot-minute-deut-rappleye
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1-6-8-15-18-29-30-34'
    quote: 'the Lord had chosen Israel “to be a special people” (verse 6), and thus their identity was linked to the exclusive worship of and loyalty to the Lord (verses 6–11).'
  - where: thread
    claim: 'Verses 12–26: the blessings promised for staying faithful underscore the value of loyalty'
    key: ot-minute-deut-rappleye
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1-6-8-15-18-29-30-34'
    quote: 'To underscore the value of preserving Israel’s national identity and loyalty to the Lord by not being assimilated into the nations that worship other gods, Moses also enumerated the blessings that are promised to Israel by the Lord if they stay faithful to Him and keep His commandments (verses 12–26).'
  - where: thread
    claim: 'The herem word stands at 7:2 (verb) and 7:26 (noun, “cursed thing”)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'חֵ֖רֶם'
  - where: 'note 7:2 “Devoted to the LORD for destruction”'
    claim: 'The KJV renders the noun ḥērem “cursed thing” (Deut. 7:26) and the verb “utterly destroy”'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'In the King James Version of the Old Testament, the Hebrew noun ḥērem is translated as “cursed thing” (Deuteronomy 7:26; 13:17), “accursed (thing)” (Joshua 6:17–18), or “devoted (thing)” (Leviticus 27:21, 28 … The related Hiphil (causative) verb heḥĕrīm is usually translated as “utterly destroy”'
  - where: 'note 7:2 “Devoted to the LORD for destruction”'
    claim: 'The root has more to do with holiness than violence; devoting things to the Lord, putting them off-limits; in war, devote to destruction'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'the Hebrew noun and its associated verb have more to do with holiness than violence from an etymological standpoint. … It is probable that the Hebrew words arise from the idea of devoting or consecrating people and things to the Lord, transferring them to the divine sphere and thereby making them off-limits to mortals'
  - where: 'note 7:2 “Devoted to the LORD for destruction”'
    claim: 'In military contexts the verb means “to devote or consecrate to destruction”; for people, the transfer is effected by killing'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'in the case of people, including those of enemy populations who would normally be taken as slaves in battle, the transfer would be effected by killing. Thus, the meaning of the verb in military contexts is essentially “to devote or consecrate to destruction.”'
  - where: 'note 7:2 “Devoted to the LORD for destruction”'
    claim: 'Verse 2 doubles the verb: haḥărēm taḥărīm, “you shall surely devote them to destruction”'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: '“Jehovah your God will deliver them up before you, and you shall smite them; you shall surely devote them to destruction (haḥărēm taḥărīm ˀōtām)” (v. 2).'
  - where: 'note 7:2 “Devoted to the LORD for destruction”'
    claim: 'The Hebrew of 7:2 has the verb twice, infinitive and finite'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'הַחֲרֵ֤ם'
  - where: 'note 7:2 “Devoted to the LORD for destruction”'
    claim: 'Things voluntarily dedicated, and Israelites guilty of idolatry, also fall under the word'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: '(1) in reference to things voluntarily dedicated to the Lord, primarily in the ritual laws of Leviticus and Numbers … (2) in reference to Israelites guilty of idolatry or other offences against God and subject to punishment by death'
  - where: 'note 7:2 “Why the nations of Canaan were to be destroyed”'
    claim: 'The Canaanites were to be driven out because of their wickedness, including idols and child sacrifice'
    key: scripture-helps-deut
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/18-deuteronomy-6-8-15-18-29-30-34?lang=eng'
    quote: 'Moses explained that the Canaanites were to be driven out of the land because of their wickedness. Such wickedness included worshipping idols and even sacrificing their children to them.'
  - where: 'note 7:2 “Why the nations of Canaan were to be destroyed”'
    claim: 'Nephi: they had rejected every word of God and were ripe in iniquity'
    key: scripture-helps-deut
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/18-deuteronomy-6-8-15-18-29-30-34?lang=eng'
    quote: 'In the Book of Mormon, Nephi explained that the Canaanites “had rejected every word of God, and they were ripe in iniquity; and the fulness of the wrath of God was upon them.”'
  - where: 'note 7:2 “Why the nations of Canaan were to be destroyed”'
    claim: 'God gave prolonged opportunities to repent; Abraham told the iniquity in Canaan was not yet full; a response to generations of rebellion reflecting justice and protection of His people'
    key: scripture-helps-violence
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/52-violence-and-destruction-in-the-old-testament?lang=eng'
    quote: 'he offered prolonged opportunities for them to repent. … It was a response to generations of rebellion against God and reflects both His justice and His desire to protect His covenant people from the corrupting influence of those who had completely rejected Him.'
  - where: 'note 7:2 “Why the nations of Canaan were to be destroyed”'
    claim: 'The Lord told Abraham his descendants would wait because the iniquity of Canaan was not yet full'
    key: scripture-helps-violence
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/52-violence-and-destruction-in-the-old-testament?lang=eng'
    quote: 'centuries earlier, the Lord told Abraham that his descendants would reside in Egypt for hundreds of years because the iniquity of those in Canaan was not yet full.'
  - where: 'note 7:2 “Why the nations of Canaan were to be destroyed”'
    claim: 'Old Testament violence is never a justification for violence today'
    key: scripture-helps-violence
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/52-violence-and-destruction-in-the-old-testament?lang=eng'
    quote: 'we should not think that examples of violence in the Old Testament would ever be justification for committing violence today.'
  - where: 'note 7:2 “Why the nations of Canaan were to be destroyed”'
    claim: 'The goal was to drive out the Canaanites; the herem was a ritualized form of destruction in battle, applied to fortified cities'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'The war ḥērem was a ritualized form of destruction employed in battle, not a goal of conquest. The goal, expressed repeatedly throughout the Pentateuch and Joshua, was to “drive out” the wicked Canaanites … The ḥērem seems to have applied to those who resisted within fortified cities.'
  - where: 'note 7:2 “Why the nations of Canaan were to be destroyed”'
    claim: 'God spoke in the exaggerated idiom of the time; what happened was likely not wholesale extermination; this does not remove the charge raised by critics'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'God speaks in these texts according to the exaggerated idiom of that time, and those hearing the commands would know not to apply them literally, at least with regard to the most severe cases. What actually played out was likely not wholesale extermination'
  - where: 'note 7:2 “Why the nations of Canaan were to be destroyed”'
    claim: 'The approach does not remove the charge of genocide'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'It is important to note that this approach does not remove the charge of genocide raised by modern critics.'
  - where: 'note 7:2 “Why the nations of Canaan were to be destroyed”'
    claim: 'We know little; Israel itself likely lacked a full understanding of the purposes'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'It is important to acknowledge that we ultimately know very little about the cultural and theological underpinnings of the ḥērem. … But it also seems likely that ancient Israelites themselves lacked a full understanding of the purposes behind God’s commandment.'
  - where: 'note 7:2 “Why the nations of Canaan were to be destroyed”'
    claim: '“Utterly destroy” means destroying national identities, not killing every individual'
    key: ot-minute-deut-rappleye
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1-6-8-15-18-29-30-34'
    quote: '“utterly destroy” (Hebrew ḥerem) does not mean that the Israelites were to kill every individual Canaanite but rather that they were to destroy the national identities of those non-Israelites living in the land.'
  - where: 'note 7:2 “Why the nations of Canaan were to be destroyed”'
    claim: 'National identity was linked to gods; a nearby non-Israelite community risked intermarriage and loss of Israel’s identity'
    key: ot-minute-deut-rappleye
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1-6-8-15-18-29-30-34'
    quote: 'In antiquity, national identity was intrinsically linked to the gods a nation worshipped. … “with a non-Israelite community nearby, it is possible that Israelites will marry outside their community and thus lose the Israelite identity marker and vanish'
  - where: 'note 7:2 “Why the nations of Canaan were to be destroyed”'
    claim: 'Text’s own reasons: they will turn away thy son (7:4); lest they teach you their abominations (20:18)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/20?lang=eng'
    quote: 'That they teach you not to do after all their abominations, which they have done unto their gods; so should ye sin against the LORD your God.'
  - where: 'note 7:7 “Chosen for love, not for numbers”'
    claim: 'Verses 7–8 remind the people, lest they boast of being redeemed, of the covenant basis of redemption'
    key: lane-redemption
    url: 'https://rsc.byu.edu/covenant-compassion/remembering-redemption-avoiding-idolatry'
    quote: 'In Deuteronomy 7:7–8, lest the people become boastful in their being redeemed, they are reminded of the covenant basis for redemption'
  - where: 'note 7:7 “Chosen for love, not for numbers”'
    claim: 'Election is God’s choice of Israel as covenant people with privileges and responsibilities, to bless the world; it is an opportunity for service'
    key: bd-election
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/election?lang=eng'
    quote: 'A theological term primarily denoting God’s choice of the house of Israel to be the covenant people with privileges and responsibilities, that they might become a means of blessing to the whole world (Rom. 9:11; 11:5, 7, 28). Election is an opportunity for service'
  - where: 'note 7:7 “Chosen for love, not for numbers”'
    claim: 'Not for righteousness but for the nations’ wickedness and the oath to the fathers (9:4–6)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/9?lang=eng'
    quote: 'Not for thy righteousness, or for the uprightness of thine heart, dost thou go to possess their land'
  - where: 'note 7:9 “Mercy to a thousand generations, repayment to the face”'
    claim: '“Mercy” in 7:9 is hesed'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'וְ/הַ/חֶ֗סֶד'
  - where: 'note 7:9 “Mercy to a thousand generations, repayment to the face”'
    claim: 'Nelson: hesed is available to all in the covenant, “to a thousand generations,” and set beside 1 Ne. 17:40'
    key: nelson-everlasting-covenant
    url: 'https://www.churchofjesuschrist.org/study/liahona/2022/10/04-the-everlasting-covenant?lang=eng'
    quote: 'This may be what Nephi meant when he said that God “loveth those who will have him to be their God” (1 Nephi 17:40). This is exactly why, as part of the covenant, a special mercy and love—or hesed—is available to all who enter this binding and intimate relationship with God, even “to a thousand generations” (Deuteronomy 7:9).'
  - where: 'note 7:9 “Mercy to a thousand generations, repayment to the face”'
    claim: 'Hesed describes a covenant relationship in which both are bound to be loyal'
    key: nelson-everlasting-covenant
    url: 'https://www.churchofjesuschrist.org/study/liahona/2022/10/04-the-everlasting-covenant?lang=eng'
    quote: 'Hesed is a unique term describing a covenant relationship in which both parties are bound to be loyal and faithful to each other.'
  - where: 'note 7:9 “Mercy to a thousand generations, repayment to the face”'
    claim: 'One older reading: Moses draws this from Exodus 20:5–6, as a warning against idolatry'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/7.htm'
    quote: 'This development of the nature of God Moses introduces from Exodus 20:5-6, as a light warning not to forfeit the mercy of God, or draw upon themselves His holy wrath by falling into idolatry.'
  - where: 'note 7:9 “Mercy to a thousand generations, repayment to the face”'
    claim: 'One older reading: “to his face” means so that they see and feel they are smitten by God'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/7.htm'
    quote: '"He delays not to His hater (sc., to repay him); He will repay him to his face." "To the face of every one of them," i.e., that they may see and feel that they are smitten by God'
  - where: 'note 7:26 “Taking the devoted thing makes one devoted”'
    claim: '“Cursed thing” in 7:26 is the noun ḥērem, twice'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'חֵ֥רֶם'
  - where: 'note 7:26 “Taking the devoted thing makes one devoted”'
    claim: 'KJV renders the noun ḥērem “cursed thing” at 7:26'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'the Hebrew noun ḥērem is translated as “cursed thing” (Deuteronomy 7:26; 13:17)'
  - where: 'note 7:26 “Taking the devoted thing makes one devoted”'
    claim: 'Achan kept silver and gold under the ḥērem; he and his family became objects of the ḥērem (compare 7:25–26)'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'he covets and retains some of the spoils that are under the ḥērem: a fine Mesopotamian mantle, a quantity of silver, and a bar of gold (Joshua 7:1, 21). His transgression leads to the failure of the first attack on Ai … As a result, Achan and his family become objects of the ḥērem themselves (Joshua 7:22–26; compare Deuteronomy 7:25–26).'
  - where: 'note 7:26 “Taking the devoted thing makes one devoted”'
    claim: 'Rahab the Canaanite sought mercy and obtained it; Achan the Israelite hid disobedience; the lesson concerns attitude toward God'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'an important lesson of the ḥērem concerns our attitude toward God. The conquest narrative of Joshua shows contrasting responses to the ḥērem that illustrate this lesson, including Rahab, a Canaanite woman of Jericho who seeks for mercy and obtains it; and Achan, an Israelite soldier who seeks to hide his disobedience'
  - where: explore
    claim: 'Calabro, “Thou Shalt Utterly Destroy,” in From Wilderness to Monarchy (RSC, 2025)'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'David Calabro, "''Thou Shalt Utterly Destroy'': Understanding the Biblical Hērem," in From Wilderness to Monarchy: The Old Testament Through the Lens of the Restoration'
