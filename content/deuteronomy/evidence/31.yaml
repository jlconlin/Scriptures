chapter: 31
claims:
  - where: when
    claim: 'Moses speaks in the plains of Moab in the fortieth year after the Exodus'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/1?lang=eng'
    quote: 'And it came to pass in the fortieth year, in the eleventh month, on the first day of the month, that Moses spake unto the children of Israel'
  - where: setting
    claim: 'Chapters 31–34 tell the delivery of the law to the Levites, Moses'' song and last blessing, and his departure; chapters 27–30 are the third discourse'
    key: bd-deuteronomy
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/deuteronomy?lang=eng'
    quote: 'The third discourse (Deut. 27–30) contains a solemn renewal of the covenant … In Deut. 31–34 we have an account of the delivery of the law to the Levites, Moses’ song and last blessing, and the departure of Moses.'
  - where: setting
    claim: 'At the end of the three sermons Moses writes the law, provides for its reading, and writes the song found in chapter 32'
    key: seely-self-reference
    url: 'https://rsc.byu.edu/they-shall-grow-together/rhetoric-self-reference-deuteronomy-book-mormon'
    quote: 'At the end of the three sermons, Deuteronomy records, “Moses wrote this law, and delivered it unto the priests,” … The words of the song are found in the Song of Moses in Deuteronomy 32.'
  - where: thread
    claim: 'Moses provides for the time after him: the law written, delivered and read, the song written, the book put beside the ark'
    key: seely-self-reference
    url: 'https://rsc.byu.edu/they-shall-grow-together/rhetoric-self-reference-deuteronomy-book-mormon'
    quote: 'And finally, Moses was commanded to write down the words he spoke into a book that was to be put beside the ark of the covenant'
  - where: thread
    claim: 'One older reading: Joshua heard at the tabernacle that the LORD foreknew the apostasy and would nevertheless bring the people into the land'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/31.htm'
    quote: 'The Lord communicated this commission to Moses in the presence of Joshua, that he also might hear from the mouth of God that the Lord foreknew the future apostasy of the people, and yet nevertheless would bring them into the promised land.'
  - where: 'note 31:2 “No more go out and come in”'
    claim: 'One older reading: “go out and in” means no longer to work in and for the nation, as at Numbers 27:17'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/31.htm'
    quote: 'can no more go out and in, i.e., no longer work in the nation and for it (see at Numbers 27:17)'
  - where: 'note 31:2 “No more go out and come in”'
    claim: 'The same reading holds that 31:2 does not conflict with 34:7'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/31.htm'
    quote: 'The first of these reasons is not at variance with the statement in Deuteronomy 34:7, that up to the time of his death his eyes were not dim, nor his strength abated.'
  - where: 'note 31:2 “No more go out and come in”'
    claim: 'Moses asked for a man to go out and come in before the congregation, and the LORD named Joshua'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/27?lang=eng'
    quote: 'Which may go out before them, and which may go in before them, and which may lead them out, and which may bring them in; that the congregation of the Lord be not as sheep which have no shepherd.'
  - where: 'note 31:7 “Joshua’s charge”'
    claim: 'Joshua was Moses'' minister, one of the twelve spies, and appointed his successor'
    key: bd-joshua
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/joshua?lang=eng'
    quote: 'was Moses’ minister (24:13; 32:17; 33:11); one of the 12 spies (Num. 13:8); appointed Moses’ successor (27:18–19; 34:17; see also Deut. 1:38; 3:28; 31:3, 23; 34:9).'
  - where: 'note 31:7 “Joshua’s charge”'
    claim: 'The Bible Dictionary calls Joshua the highest type of the devout warrior'
    key: bd-joshua
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/joshua?lang=eng'
    quote: 'He is the highest type of the devout warrior.'
  - where: 'note 31:7 “Joshua’s charge”'
    claim: 'Numbers tells Moses laying hands on Joshua before Eleazar and the congregation'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/27?lang=eng'
    quote: 'And he laid his hands upon him, and gave him a charge, as the Lord commanded by the hand of Moses.'
  - where: 'note 31:7 “Joshua’s charge”'
    claim: 'One older reading: the speaker who charges Joshua in verse 23 is the LORD, as “I will be with thee” shows'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/31.htm'
    quote: 'That the subject to ויצו is not Moses, but Jehovah, is evident partly from the words themselves, "I will be with thee'' (vid., Exodus 3:12).'
  - where: 'note 31:7 “Joshua’s charge”'
    claim: 'After Moses, the LORD repeats the charge and the promise to Joshua'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/1?lang=eng'
    quote: 'as I was with Moses, so I will be with thee: I will not fail thee, nor forsake thee.'
  - where: 'note 31:9 “Moses wrote this law”'
    claim: 'The Bible Dictionary: Moses wrote the Pentateuch, latter-day revelation confirms it, scribes left traces, and 34:5–12 was added later'
    key: bd-pentateuch
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/pentateuch?lang=eng'
    quote: 'It is also evident that scribes and copyists have left their traces upon the Pentateuch as we have it today; for example, the explanation of Moses’ supposed death (Deut. 34:5–12) was surely added by a later hand. But latter-day revelation confirms that Moses was the author'
  - where: 'note 31:9 “Moses wrote this law”'
    claim: 'Deuteronomy refers to itself as “this law” in 31:9, 11, 12, 24 and elsewhere'
    key: seely-self-reference
    url: 'https://rsc.byu.edu/they-shall-grow-together/rhetoric-self-reference-deuteronomy-book-mormon'
    quote: '(2) “this law” (1:5; 4:8; 4:44; 17:18, 19; 27:3, 8, 26; 28:58, 61; 29:29; 31:9, 11, 12, 24; 32:46)'
  - where: 'note 31:9 “Moses wrote this law”'
    claim: 'Scholars broadly hold that the scroll found under Josiah was Deuteronomy in some form'
    key: dundas-ancient-israel
    url: 'https://rsc.byu.edu/mormons-record/ancient-israel'
    quote: 'The broad consensus of scholars holds that the scroll discovered in the temple by the priests under the monarchy of Josiah (640–609 BC) comprised the book of Deuteronomy, at least in some form.'
  - where: 'note 31:9 “Moses wrote this law”'
    claim: 'One scholarly dating puts D in Josiah''s reign'
    key: dundas-ancient-israel
    url: 'https://rsc.byu.edu/mormons-record/ancient-israel'
    quote: 'He dates P to the time of the reforms by Hezekiah (around 700 BC), and D to the reign of Josiah (around 620–610 BC).'
  - where: 'note 31:9 “Moses wrote this law”'
    claim: 'Lehi''s family almost certainly saw Josiah''s reforms and the book''s coming forth'
    key: seely-self-reference
    url: 'https://rsc.byu.edu/they-shall-grow-together/rhetoric-self-reference-deuteronomy-book-mormon'
    quote: 'Lehi and his family almost certainly experienced firsthand Josiah’s reforms in Jerusalem, which began in 622 BC (see 2 Kings 22–23), and the coming forth of the book of the law,” which was very likely some form of the book of Deuteronomy.'
  - where: 'note 31:9 “Moses wrote this law”'
    claim: 'Christensen, following Barker, holds that Lehi''s vision contains what Deuteronomy''s preface rejects'
    key: christensen-prophets-kings
    url: 'https://journal.interpreterfoundation.org/prophets-and-kings-in-lehis-jerusalem-and-margaret-barkers-temple-theology/'
    quote: 'I observed in “Paradigms Regained” that “Lehi’s vision in the first chapter of the Book of Mormon contains most of the elements these Deuteronomy passages explicitly reject,”'
  - where: 'note 31:9 “Moses wrote this law”'
    claim: 'Barker reads Deuteronomy''s preface as showing what the reformers set out to remove'
    key: christensen-prophets-kings
    url: 'https://journal.interpreterfoundation.org/prophets-and-kings-in-lehis-jerusalem-and-margaret-barkers-temple-theology/'
    quote: 'Barker cites the “preface to Deuteronomy”—now chapter 4 of that book—as showing what this group set out to remove from the religion of Israel'
  - where: 'note 31:9 “Moses wrote this law”'
    claim: 'Hamblin: no biblical prophet opposed Josiah''s reforms'
    key: hamblin-josiah
    url: 'https://journal.interpreterfoundation.org/vindicating-josiah/'
    quote: 'Finally, I believe that Josiah’s reforms were necessary and inspired. The first thing to note is that no biblical prophet ever opposed or criticized Josiah’s reforms.'
  - where: 'note 31:9 “Moses wrote this law”'
    claim: 'Eliason: doing away with Deuteronomy leaves much of the Hebrew Bible suspect'
    key: eliason-josiah
    url: 'https://byustudies.byu.edu/article/is-the-bible-reliable-a-case-study'
    quote: 'For example, doing away with Deuteronomy and the Deuteronomistic history means understanding a major portion of the Hebrew Bible as historically suspect or outright unreliable.'
  - where: 'note 31:10 “The law read every seventh year”'
    claim: 'Ezra read the law to men and women in the seventh month and daily through the feast of booths'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/8?lang=eng'
    quote: 'Also day by day, from the first day unto the last day, he read in the book of the law of God. And they kept the feast seven days'
  - where: 'note 31:10 “The law read every seventh year”'
    claim: 'Welch and Szink set the phrases of Deuteronomy 31:10–13 beside Benjamin''s assembly (Mosiah 2:8, 2:5 and others)'
    key: welch-szink-festivals
    url: 'https://scripturecentral.org/archive/books/book-chapter/king-benjamins-speech-context-ancient-israelite-festivals'
    quote: 'thou shalt read this law before all Israel in their hearing [compare Mosiah 2:8]. Gather the people together, men, and women, and children [compare Mosiah 2:5]'
  - where: 'note 31:10 “The law read every seventh year”'
    claim: 'They conclude Benjamin spoke at such a seventh-year Feast of Tabernacles'
    key: welch-szink-festivals
    url: 'https://scripturecentral.org/archive/books/book-chapter/king-benjamins-speech-context-ancient-israelite-festivals'
    quote: 'The completeness and precision with which Benjamin appears to be fulfilling these technical Mosaic requirements lends weighty evidence to the conclusion that it was at just such a seventh-year Deuteronomic Feast of Tabernacles that Benjamin’s speech was delivered.'
  - where: 'note 31:10 “The law read every seventh year”'
    claim: 'Benjamin''s people pitched tents by families, and his words were written and sent out'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/2?lang=eng'
    quote: 'therefore he caused that the words which he spake should be written and sent forth among those that were not under the sound of his voice, that they might also receive his words.'
  - where: 'note 31:17 “I will hide my face”'
    claim: 'One older reading: to hide the face is to withdraw favour; each punishment answers the sin'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/31.htm'
    quote: 'for forsaking Him, He would forsake them; and for breaking His covenant, He would hide His face from them, i.e., withdraw His favour from them, so that they would be destroyed.'
  - where: 'note 31:17 “I will hide my face”'
    claim: 'The same reading: the LORD still hides His face because missing God is not repentance'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/31.htm'
    quote: 'but the Lord ("but I" in Deuteronomy 31:18 forms the antithesis to "they" in Deuteronomy 31:17) would still hide His face, namely, because simply missing God is not true repentance.'
  - where: 'note 31:17 “I will hide my face”'
    claim: 'Ezekiel uses the words for the exile and reverses them for the gathering'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/39?lang=eng'
    quote: 'Neither will I hide my face any more from them: for I have poured out my spirit upon the house of Israel, saith the Lord God.'
  - where: 'note 31:19 “Why a song”'
    claim: 'Moses was commanded to write the song; its words are the Song of Moses in chapter 32'
    key: seely-self-reference
    url: 'https://rsc.byu.edu/they-shall-grow-together/rhetoric-self-reference-deuteronomy-book-mormon'
    quote: 'In addition, Moses was to write down the words of a song: “Now therefore write ye this song for you, and teach it the children of Israel: put it in their mouths, that this song may be a witness for me against the children of Israel” (v. 19).'
  - where: 'note 31:19 “Why a song”'
    claim: 'Deuteronomy is a self-referential text aware of its function toward future readers'
    key: seely-self-reference
    url: 'https://rsc.byu.edu/they-shall-grow-together/rhetoric-self-reference-deuteronomy-book-mormon'
    quote: 'Both Deuteronomy and the Book of Mormon present themselves as self-referential texts—that is, both texts refer to themselves in their respective narratives and are consciously aware of their function with respect to their future readers.'
  - where: 'note 31:26 “Beside the ark, not in it”'
    claim: 'A modern translation renders 31:26 “put it beside the ark”'
    key: seely-self-reference
    url: 'https://rsc.byu.edu/they-shall-grow-together/rhetoric-self-reference-deuteronomy-book-mormon'
    quote: '“Take this book of the law and put it beside the ark of the covenant of the Lord your God; let it remain there as a witness against you’” (Deuteronomy 31:24–26 NRSV).'
  - where: 'note 31:26 “Beside the ark, not in it”'
    claim: 'The ark held the tables of the law; 1 Kings 8:9 says it held only them'
    key: bd-ark-of-the-covenant
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ark-of-the-covenant?lang=eng'
    quote: 'According to 1 Kgs. 8:9 it contained only the Tables of the Law, but in Heb. 9:4 it is said to have contained the “pot of manna” and “Aaron’s rod that budded,”'
  - where: christ
    claim: 'Joshua''s name occurs in the Old Testament in several forms, among them Jesus'
    key: bd-joshua
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/joshua?lang=eng'
    quote: 'The name also occurs in the Old Testament under the various forms Jehoshua, Hoshea, Jeshua, and Jesus'
  - where: christ
    claim: 'One older reading: the song witnesses also that the LORD would not reject His people but have compassion on them'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/31.htm'
    quote: 'that the Lord had not rejected His people in spite of the punishments inflicted upon them, but would once more have compassion upon them and requite their foes'
