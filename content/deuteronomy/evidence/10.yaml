chapter: 10
claims:
  - where: when
    claim: 'Moses speaks in the fortieth year after the Exodus'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/1?lang=eng'
    quote: 'And it came to pass in the fortieth year, in the eleventh month, on the first day of the month, that Moses spake unto the children of Israel'
  - where: setting
    claim: 'Chapters 5–11 are the first part of the second discourse: the Ten Commandments and a practical exposition of them'
    key: bd-deuteronomy
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/deuteronomy?lang=eng'
    quote: 'The second discourse (Deut. 5–26) consists of two parts: (1) 5–11, the Ten Commandments and a practical exposition of them, (2) 12–26, a code of laws'
  - where: setting
    claim: 'In 10:1–5 Moses briefly tells the success of his intercession'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/10.htm'
    quote: 'In Deuteronomy 10:1-5 Moses briefly relates the success of his earnest intercession.'
  - where: thread
    claim: 'The seventy who went down to Egypt and became a numberless nation fulfil the promise of Genesis 15:5'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/10.htm'
    quote: 'had gone down to Egypt in the persons of its fathers as a family consisting of seventy souls, and now, notwithstanding the oppression it suffered there, had grown into an innumerable nation. So marvellously had the Lord fulfilled His promise in Genesis 15:5.'
  - where: 'note 10:1 “An ark in the retelling”'
    claim: 'Exodus: Bezaleel made the ark'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/37?lang=eng'
    quote: 'And Bezaleel made the ark of shittim wood'
  - where: 'note 10:1 “An ark in the retelling”'
    claim: 'Exodus: the testimony was put into the ark when the tabernacle was reared'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/40?lang=eng'
    quote: 'And he took and put the testimony into the ark, and set the staves on the ark, and put the mercy seat above upon the ark'
  - where: 'note 10:1 “An ark in the retelling”'
    claim: 'One older reading: Moses links what belongs together without keeping to the chronological order; the ark was directed before the apostasy, made after the tabernacle, and the tables put in at its consecration'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/10.htm'
    quote: 'Here again Moses links together such things as were substantially connected, without strictly confining himself to the chronological order, which was already well known from the historical account'
  - where: 'note 10:2 “What the new tables left out”'
    claim: 'The JST of Deuteronomy 10:2 adds “save the words of the everlasting covenant of the holy priesthood”'
    key: jst-deut-10
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-deut/10?lang=eng'
    quote: 'And I will write on the tables the words that were on the first tables, which thou brakest, save the words of the everlasting covenant of the holy priesthood, and thou shalt put them in the ark.'
  - where: 'note 10:2 “What the new tables left out”'
    claim: 'The JST footnote at Deuteronomy 10 says about the same thing as JST Exodus 34, in slightly different words'
    key: horton-jst-pentateuch
    url: 'https://rsc.byu.edu/joseph-smith-translation/insights-exodus-leviticus-numbers-deuteronomy'
    quote: 'Let’s look at Deuteronomy 10:1 and its JST footnote. It says about the same thing but in slightly different words'
  - where: 'note 10:6 “Aaron’s death in the middle of the speech”'
    claim: 'One older reading: Moses recalls Aaron’s death and Eleazar’s investiture to remind Israel of God’s gracious gift of the priesthood'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/10.htm'
    quote: 'Moses reminds the people of this gracious gift on the part of their God, by recalling to their memory the time when Aaron died and his son Eleazar was invested with the high-priesthood in his stead.'
  - where: 'note 10:6 “Aaron’s death in the middle of the speech”'
    claim: 'The same reading ties these verses to Moses’ prayer for Aaron in 9:20'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/10.htm'
    quote: 'Moses referred to what he had stated in Deuteronomy 9:20 as to the wrath of God against Aaron and his intercession on his behalf'
  - where: 'note 10:6 “Aaron’s death in the middle of the speech”'
    claim: 'Numbers places Aaron’s death at mount Hor'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/33?lang=eng'
    quote: 'And Aaron the priest went up into mount Hor at the commandment of the Lord, and died there, in the fortieth year after the children of Israel were come out of the land of Egypt'
  - where: 'note 10:6 “Aaron’s death in the middle of the speech”'
    claim: 'Numbers 33 lists Moseroth before Bene-jaakan, then Hor-hagidgad and Jotbathah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/33?lang=eng'
    quote: 'And they departed from Moseroth, and pitched in Bene-jaakan. And they removed from Bene-jaakan, and encamped at Hor-hagidgad. And they went from Hor-hagidgad, and pitched in Jotbathah.'
  - where: 'note 10:6 “Aaron’s death in the middle of the speech”'
    claim: 'Numbers 20 tells Aaron’s death on mount Hor'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/20?lang=eng'
    quote: 'Take Aaron and Eleazar his son, and bring them up unto mount Hor'
  - where: 'note 10:6 “Aaron’s death in the middle of the speech”'
    claim: 'Only Kadesh-barnea can be located with certainty; the other places were most likely in the wildernesses of Shur and Paran'
    key: ot-manual-dt-1-16
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/deuteronomy-1-16-an-exhortation-to-obedience-part-1?lang=eng'
    quote: 'Only Kadesh-Barnea may be located with any degree of certainty (see map). The other places mentioned were most likely in the wilderness of Shur and the wilderness of Paran to the south.'
  - where: 'note 10:9 “The LORD as Levi’s inheritance”'
    claim: 'The Church’s footnote at 10:9 “inheritance” points to Numbers 18:20 (20–24)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/10?lang=eng'
    quote: '“inheritance”: Num. 18:20 (20–24).'
  - where: 'note 10:9 “The LORD as Levi’s inheritance”'
    claim: 'The Levites had no inheritance in Canaan but had the tithe, 48 cities and a claim on alms at the feasts'
    key: bd-levites
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/levites?lang=eng'
    quote: 'They had no inheritance in Canaan (18:23–24); but they had the tithe (18:21), 48 cities (35:6), and a claim on the alms of the people at feast times (Deut. 12:18–19; 14:27–29).'
  - where: 'note 10:9 “The LORD as Levi’s inheritance”'
    claim: 'The LORD tells Aaron he is his part and inheritance'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/18?lang=eng'
    quote: 'Thou shalt have no inheritance in their land, neither shalt thou have any part among them: I am thy part and thine inheritance among the children of Israel.'
  - where: 'note 10:12 “What the LORD asks after the calf”'
    claim: 'Deuteronomy 10:12 equates love with serving God, as a vassal serves the suzerain'
    key: sc-knowhy-186
    url: 'https://scripturecentral.org/knowhy/why-did-samuel-say-the-lord-hated-the-lamanites'
    quote: 'See also Deuteronomy 10:12; 11:1, 13, 22; 30:19–20, which all equate love with serving God, just as the vassal serves the suzerain.'
  - where: 'note 10:16 “A command to circumcise the heart”'
    claim: 'Deuteronomy uses circumcision to invite a people who fulfil Abraham’s promises to internalize their commitment; the “therefore” follows the choice of the fathers in verse 15'
    key: wessel-circumcision
    url: 'https://rsc.byu.edu/vol-20-no-3-2019/circumcision-old-testament'
    quote: 'Addressing a numerous people who were a living fulfillment of the promises made to Abraham, the writer of Deuteronomy uses the concept of circumcision to invite them to internalize their commitment to God.'
  - where: 'note 10:16 “A command to circumcise the heart”'
    claim: 'Circumcision of the heart is a symbolic invitation, not a physical act'
    key: wessel-circumcision
    url: 'https://rsc.byu.edu/vol-20-no-3-2019/circumcision-old-testament'
    quote: 'This reference to circumcision of the heart is clearly not a physical act but a symbolic invitation to internalize the commitments associated with circumcision.'
  - where: 'note 10:16 “A command to circumcise the heart”'
    claim: 'Deuteronomy and Jeremiah imply the physical act is wasted without inward commitment'
    key: wessel-circumcision
    url: 'https://rsc.byu.edu/vol-20-no-3-2019/circumcision-old-testament'
    quote: 'Deuteronomy and Jeremiah seem to imply that the physical act of circumcision is wasted when unaccompanied by an internal commitment to God and his covenants.'
  - where: 'note 10:18 “The great God and the stranger”'
    claim: 'Deuteronomy commands Israel to imitate God’s mercy to the poor, love the stranger and circumcise their hearts (10:16–19)'
    key: seely-cry-widow
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/cry-widow-fatherless-stranger'
    quote: 'Deuteronomy addresses the Israelites and commands them to imitate God’s mercy to the poor, love the stranger, and humble themselves by circumcising their hearts'
  - where: christ
    claim: 'One older reading: the titles of 10:17 are transferred in Revelation to the exalted Son of God'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/10.htm'
    quote: 'Compare Revelation 17:14 and Revelation 19:16, where these predicates are transferred to the exalted Son of God'
