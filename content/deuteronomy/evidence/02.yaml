chapter: 2
claims:
  - where: 'setting'
    claim: 'The Church''s chapter heading summarizes the chapter'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/2?lang=eng'
    quote: 'The children of Israel press forward to their promised land—They pass through the lands of Esau and of Ammon in peace but destroy the Amorites.'
  - where: 'setting'
    claim: 'Chapters 2–3 show God able to fulfill His promise of the land to the patriarchs'
    key: ot-minute-deut-2
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-2'
    quote: 'The rest of chapter 2 through 3:29 chronicles God’s ability to fulfill His promises to Abraham, Isaac, and Jacob that their descendants would ultimately inherit this land despite all outwardly perceived evidence to the contrary (see 1:8).'
  - where: 'setting'
    claim: 'Later scripture mentions Sihon in Joshua 2:10, Judges 11, and Psalms 135–136'
    key: bd-sihon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sihon?lang=eng'
    quote: 'Judg. 11:19–22; Neh. 9:22; Ps. 135:11; 136:19); mentioned in Num. 32:33; Josh. 2:10'
  - where: 'thread'
    claim: 'The new generation''s strength reverses their fathers'' powerlessness'
    key: ot-minute-deut-2
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-2'
    quote: '“not one city too strong for us.” Purged of their rebelliousness, this new generation of Israelites became powerful—an exact reversal of their fathers’ powerlessness a generation earlier.'
  - where: 'thread'
    claim: 'The Ammon passage is placed out of geographical order, likely to group the peaceful bypasses before the victories'
    key: ot-minute-deut-2
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-2'
    quote: 'Chronologically, this is out of order as Sihon and the Amorites’ territory is geographically south of the Ammonites’. The order of these verses is likely due to the author’s desire to bunch together the Lord’s instructions … regarding the peaceful bypass of their cousins'
  - where: 'note 2:5 “Lands the LORD gave to Israel’s kin”'
    claim: 'Edom lay south of the Dead Sea, outside Israel''s land; Deut. 2:4–5 and 23:7 mention the kinship'
    key: bd-edom
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/edom?lang=eng'
    quote: 'This country lay south of the Dead Sea, having Moab on the north and the Dead Sea on the northwest. It was not included within the limits of the land of Israel (Deut. 2:5; Josh. 24:4).'
  - where: 'note 2:5 “Lands the LORD gave to Israel’s kin”'
    claim: 'Moab was the son of Lot''s eldest daughter'
    key: bd-moab
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/moab?lang=eng'
    quote: 'Son of Lot’s eldest daughter (Gen. 19:37). The land of Moab lay east of the Dead Sea.'
  - where: 'note 2:5 “Lands the LORD gave to Israel’s kin”'
    claim: 'The Ammonites descended from Lot'
    key: bd-ammon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ammon?lang=eng'
    quote: 'A tribe descended from Lot, the nephew of Abraham (Gen. 19:38; Deut. 2:19)'
  - where: 'note 2:5 “Lands the LORD gave to Israel’s kin”'
    claim: 'Esau dwelt in Mount Seir; the Lord gave Esau Mount Seir'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/24?lang=eng'
    quote: 'and I gave unto Esau mount Seir, to possess it; but Jacob and his children went down into Egypt.'
  - where: 'note 2:5 “Lands the LORD gave to Israel’s kin”'
    claim: 'The conquest was not indiscriminate; the kin nations had divine land grants; God as architect of every nation''s history'
    key: ot-minute-deut-2
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-2'
    quote: 'The Israelite conquest was not indiscriminate. … the Lord adamantly protected the Edomites, Ammonites, and Moabites, because these peoples also had received divine land grants … It is theologically instructive to see God’s particular love for all His children as the architect of every nation’s history.'
  - where: 'note 2:5 “Lands the LORD gave to Israel’s kin”'
    claim: 'The same reading cites Acts 17:26'
    key: ot-minute-deut-2
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-2'
    quote: '[2] See Deuteronomy 32:8; Acts 17:26.'
  - where: 'note 2:10 “Why Moses stops to talk about giants”'
    claim: 'One older reading: the notices confirm that Edom and Moab received their land from God, not by their own power'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/2.htm'
    quote: 'To confirm the fact that the Moabites and also the Edomites had received from God the land which they inhabited as a possession, Moses interpolates into the words of Jehovah certain ethnographical notices … from which it is obvious that Edom and Moab had not destroyed them by their own power'
  - where: 'note 2:10 “Why Moses stops to talk about giants”'
    claim: 'The Emims: terrible men, giants east of the Jordan in Abraham''s time, driven out by Moab'
    key: bd-emims
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/emims?lang=eng'
    quote: 'Terrible men. A race of giants, living east of the Jordan in the time of Abraham; afterwards driven out by Moabites (Gen. 14:5; Deut. 2:10–11).'
  - where: 'note 2:10 “Why Moses stops to talk about giants”'
    claim: 'The Rephaim: a pre-Israelite people noted for great stature'
    key: bd-rephaim
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/rephaim?lang=eng'
    quote: 'Giants. A pre-Israelite people in Palestine, noted for their great stature (Gen. 14:5; 15:20; Deut. 2:11, 20; 3:11, 13'
  - where: 'note 2:10 “Why Moses stops to talk about giants”'
    claim: 'The Horites, Seir''s original inhabitants, were probably cave dwellers'
    key: bd-edom
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/edom?lang=eng'
    quote: 'The original inhabitants were “the children of Seir,” or Horites (Gen. 14:6; 36:20), and were probably dwellers in holes or caverns.'
  - where: 'note 2:10 “Why Moses stops to talk about giants”'
    claim: 'The origin of the Horites is obscure; little is known'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/2.htm'
    quote: 'The origin of the Horites (i.e., the dwellers in caves) of Mount Seir, who were driven out of their possessions by the descendants of Esau, and completely exterminated … is altogether involved in obscurity.'
  - where: 'note 2:10 “Why Moses stops to talk about giants”'
    claim: 'One older reading: "the land of his possession" in 2:12 is the land east of the Jordan, as in 3:20'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/2.htm'
    quote: 'do not presuppose the conquest of the land of Canaan or a post-Mosaic authorship; but "the land of his possession" is the land to the east of the Jordan (Gilead and Bashan), which was conquered by the Israelites under Moses, and divided among the two tribes and a half'
  - where: 'note 2:10 “Why Moses stops to talk about giants”'
    claim: 'The spies reported the Anakims at Kadesh'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/1?lang=eng'
    quote: 'the cities are great and walled up to heaven; and moreover we have seen the sons of the Anakims there.'
  - where: 'note 2:14 “Thirty-eight years for a generation”'
    claim: 'The oath of Numbers 14: those numbered from twenty years would fall in the wilderness; the children would wander forty years'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/14?lang=eng'
    quote: 'And your children shall wander in the wilderness forty years, and bear your whoredoms, until your carcases be wasted in the wilderness.'
  - where: 'note 2:14 “Thirty-eight years for a generation”'
    claim: 'One Latter-day Saint reading: the Lord''s justice is as infinite as His mercy; the evil generation would not enjoy the land'
    key: ot-minute-deut-2
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-2'
    quote: 'While the Lord is merciful beyond our ability to imagine (see 1 Corinthians 2:9), His commitment to justice is equally infinite and eternal. … Sadly those “men of this evil generation” (Deuteronomy 1:35) would never enjoy the promised land'
  - where: 'note 2:24 “Sihon, king of Heshbon”'
    claim: 'Sihon, king of the Amorites, had dispossessed the Moabites; conquered by Moses'
    key: bd-sihon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sihon?lang=eng'
    quote: 'King of the Amorites, dispossessed the Moabites (Num. 21:26–30); conquered by Moses (21:21–35; Deut. 1:4; 2:26–37; 3:2'
  - where: 'note 2:24 “Sihon, king of Heshbon”'
    claim: 'Sihon took Moab''s land as far as the Arnon; his land ran from Arnon to Jabbok'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/21?lang=eng'
    quote: 'For Heshbon was the city of Sihon the king of the Amorites, who had fought against the former king of Moab, and taken all his land out of his hand, even unto Arnon.'
  - where: 'note 2:24 “Sihon, king of Heshbon”'
    claim: 'The Arnon was the border of Moab'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/11?lang=eng'
    quote: 'and pitched on the other side of Arnon, but came not within the border of Moab: for Arnon was the border of Moab.'
  - where: 'note 2:24 “Sihon, king of Heshbon”'
    claim: 'Deuteronomy''s account adds details to Numbers 21: a divine directive for both kings, and the ḥērem Numbers does not mention'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'The account in Numbers does not mention the ḥērem. … This account adds a number of details to the account in Numbers 21. For instance, while Numbers 21 mentions a directive from God only in the case of the battle with Og (Numbers 21:34), the account in Deuteronomy makes it clear that God directed Moses to take possession of the lands of both kings'
  - where: 'note 2:24 “Sihon, king of Heshbon”'
    claim: 'On one reading, the God-led conquest began east of the Jordan with the battle with Sihon'
    key: ot-minute-deut-2
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-2'
    quote: 'In contrast to the account in Numbers, Deuteronomy claims that the God-led conquest of the promised land began while the Israelites were still on the eastern side of the Jordan River, marked by this battle with Sihon, the king of the Amorites.'
  - where: 'note 2:25 “The report that reached Jericho”'
    claim: 'Rahab says Israel''s terror fell on Jericho because of the Red Sea and Sihon and Og'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/2?lang=eng'
    quote: 'and what ye did unto the two kings of the Amorites, that were on the other side Jordan, Sihon and Og, whom ye utterly destroyed.'
  - where: 'note 2:25 “The report that reached Jericho”'
    claim: 'Rahab uses the same term heḥĕrīm for these events'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'These same events are later mentioned by Rahab to the Israelite spies in Jericho, again using the term heḥĕrīm (Joshua 2:10).'
  - where: 'note 2:26 “Peace offered to a king already given”'
    claim: 'Numbers mentions a directive from God only for the battle with Og'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'while Numbers 21 mentions a directive from God only in the case of the battle with Og (Numbers 21:34)'
  - where: 'note 2:26 “Peace offered to a king already given”'
    claim: 'One older reading: the offer was earnest, made to show Sihon''s loss was his own fault; Sihon''s kingdom was not part of Canaan'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/2.htm'
    quote: 'this was done to show the king of the Amorites, that it was through his own fault that his kingdom and lands and life were lost. The wish to pass through his land in a peaceable manner was quite seriously expressed'
  - where: 'note 2:26 “Peace offered to a king already given”'
    claim: 'Sihon''s kingdom was not part of the land promised to the patriarchs'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/2.htm'
    quote: 'For Sihon''s kingdom did not form part of the land of Canaan, which God had promised to the patriarchs for their descendants'
  - where: 'note 2:29 “What Edom and Moab did”'
    claim: 'In Numbers, Edom refused passage and came out with much people; Israel turned away'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/20?lang=eng'
    quote: 'Thus Edom refused to give Israel passage through his border: wherefore Israel turned away from him.'
  - where: 'note 2:29 “What Edom and Moab did”'
    claim: 'Jephthah says Edom and Moab both refused, and Israel went around their lands'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/11?lang=eng'
    quote: 'but the king of Edom would not hearken thereto. And in like manner they sent unto the king of Moab: but he would not consent: and Israel abode in Kadesh.'
  - where: 'note 2:29 “What Edom and Moab did”'
    claim: 'One older reading: selling for money differs from the hospitality whose absence Moab is blamed for in 23:4'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/2.htm'
    quote: 'signifies a hospitable reception, and the offering of food and drink without reward, which is essentially different from selling for money.'
  - where: 'note 2:30 “Who hardened Sihon”'
    claim: 'The JST manuscript reads "for he heardened his spirit"'
    key: jsp-ot2
    url: 'https://www.josephsmithpapers.org/paper-summary/old-testament-revision-2/79'
    quote: 'Verse 30th But sihon, King of heshbon, would not let us pass by him; for he heardened his spirit, & made his heart obstinate, that the Lord thy God might deliver him into thy hand, as he hath done this day'
  - where: 'note 2:30 “Who hardened Sihon”'
    claim: 'The correction is reminiscent of several Exodus passages'
    key: horton-jst-pentateuch
    url: 'https://rsc.byu.edu/joseph-smith-translation/insights-exodus-leviticus-numbers-deuteronomy'
    quote: 'The correction here is reminiscent of several Exodus passages. As corrected it reads, “But Sihon king of Heshbon would not let us pass by him: for he hardened his spirit.”'
  - where: 'note 2:34 “Sihon’s cities devoted to destruction”'
    claim: 'Deut. 2:34 uses heḥĕrīm; "people" probably means those brought to combat; livestock and spoil kept; Numbers lacks the ḥērem'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'After slaying each king and his “people” (probably meaning those he had brought with him to combat—see Deuteronomy 2:32–33), Israel captures the enemy cities and utterly destroys (heḥĕrīm) “the men, the women, and the children” (Deuteronomy 2:34; 3:6). However, Israel keeps the livestock and the spoils'
  - where: 'note 2:34 “Sihon’s cities devoted to destruction”'
    claim: 'The same chapter shows the Lord protecting Edomites, Moabites and Ammonites while condemning the Amorites'
    key: ot-minute-deut-2
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-2'
    quote: 'Why did the Lord so utterly condemn the Amorites? How is that possible when the Lord … has so carefully kept all His promises and covenants to so many different nations, as clearly demonstrated in this chapter by His protection of the Edomites, Moabites, and Ammonites?'
  - where: 'christ'
    claim: 'Nephi''s explanation (1 Ne. 17:35) is applied to the Amorites'' destruction'
    key: ot-minute-deut-2
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-2'
    quote: 'Nephi was clear: “the Lord esteemeth all flesh in one; he that is righteous is favored of God”'
  - where: 'christ'
    claim: 'Verse 7 foreshadows Jesus''s instructions in Matthew 6 and 3 Nephi 13'
    key: ot-minute-deut-2
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-2'
    quote: 'This foreshadows Jesus’s later instructions to both His Jerusalem and Bountiful leadership'
