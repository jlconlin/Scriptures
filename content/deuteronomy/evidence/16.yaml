chapter: 16
claims:
  - where: when
    claim: 'Moses speaks in the fortieth year, in the land of Moab'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/1?lang=eng'
    quote: 'And it came to pass in the fortieth year, in the eleventh month, on the first day of the month, that Moses spake unto the children of Israel'
  - where: setting
    claim: 'Centralization affected the holidays of 16:1–17; the festivals would no longer be kept in the villages but only at the central altar'
    key: seely-lehi-altar
    url: 'https://archive.bookofmormoncentral.org/content/lehi%E2%80%99s-altar-and-sacrifice-wilderness'
    quote: 'the offering of tithes and firstlings (Deuteronomy 14:22–26), the celebration of the holidays (Deuteronomy 16:1–17), the cities of refuge (Deuteronomy 19:1–9), and the enfranchisement of the Levites (Deuteronomy 18:6–8)'
  - where: setting
    claim: 'The festivals would no longer be kept in the villages but only at the central altar'
    key: seely-lehi-altar
    url: 'https://archive.bookofmormoncentral.org/content/lehi%E2%80%99s-altar-and-sacrifice-wilderness'
    quote: 'these festivals would no longer be celebrated in the various villages, but only at the central altar at the temple after it had been established.'
  - where: setting
    claim: 'Moses assumes the earlier feast laws and repeats only what concerns the meals at the sanctuary; only the three feasts are named because only they required assembling at the sanctuary'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/16.htm'
    quote: 'assuming the laws previously given concerning these festivals (Exodus 12; Leviticus 23:1, and Numbers 28 and 29) as already known, and simply repeating those points which related to the sacrificial meals held at these festivals.'
  - where: setting
    claim: 'The day of atonement and feast of trumpets are left out because the people did not assemble from the whole land for them'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/16.htm'
    quote: 'because the people were not required to assemble at the sanctuary out of the whole land on the occasion of these two festivals.'
  - where: setting
    claim: 'Josiah kept the Passover as written in the book of the covenant, in Jerusalem, as none had been kept since the judges'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/23?lang=eng'
    quote: 'Keep the passover unto the Lord your God, as it is written in the book of this covenant. Surely there was not holden such a passover from the days of the judges that judged Israel'
  - where: thread
    claim: 'The laws on judges carry the holiness of Israel’s worship over into its civil life'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/16.htm'
    quote: 'Just as in its religious worship the Israelitish nation was to show itself to be the holy nation of Jehovah, so was it in its political relations also. This thought forms the link between the laws already given and those which follow.'
  - where: thread
    claim: 'The command to do all this justly, that thou mayest live and inherit, links the giving at the feasts to the covenant'
    key: muhlestein-love-neighbor
    url: 'https://rsc.byu.edu/covenant-compassion/covenantal-command'
    quote: 'By linking the giving of food to those in need with inheriting the land, the Lord was making it clear that this generosity was part of the covenant'
  - where: section 6 plain
    claim: 'The “grove” is an asherah, a sacred pole or tree-trunk idol; the “image” is a pillar'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/16?lang=eng'
    quote: 'HEB Thou shalt not plant thee an asherah of any kind of tree beside the altar (an asherah was a fertility idol made of a tree trunk).'
  - where: section 1 plain
    claim: 'The Passover of verse 2 includes the sacrifices of the whole week, from flock and herd'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/16.htm'
    quote: 'the word "Passover" is employed in a broader sense, and includes not only the paschal lamb, but the paschal sacrifices generally'
  - where: section 5 plain
    claim: 'Verse 20 rendered “Justice, and only justice, you shall pursue”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Deuteronomy+16&version=NRSVUE'
    quote: 'Justice, and only justice, you shall pursue, so that you may live and occupy the land that the Lord your God is giving you.'

  - where: 'note 16:3 “The bread of affliction”'
    claim: 'No time to leaven the dough: they were thrust out of Egypt'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/16?lang=eng'
    quote: 'for thou camest forth out of the land of Egypt in haste: that thou mayest remember the day when thou camest forth out of the land of Egypt all the days of thy life.'
  - where: 'note 16:3 “The bread of affliction”'
    claim: 'The Hebrew word means affliction, poverty; BDB lists “bread of affliction” at Deut. 16:3'
    key: bdb
    url: 'https://biblehub.com/hebrew/6040.htm'
    quote: 'עֳנִי noun masculine affliction, poverty'
  - where: 'note 16:3 “The bread of affliction”'
    claim: 'The same word is used of the affliction God saw in Egypt (Ex. 3:7; Deut. 26:7)'
    key: bdb
    url: 'https://biblehub.com/hebrew/6040.htm'
    quote: '׳ראה ע Genesis 31:42 (E), Exodus 3:7; Exodus 4:31 (J), Deuteronomy 26:7'
  - where: 'note 16:5 “From the household to the chosen place”'
    claim: 'In Egypt the houses served as altars; in the land the slaying and eating move to the sanctuary, as at Sinai'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/16.htm'
    quote: 'In Egypt, when Israel was not yet raised into the nation of Jehovah, and had as yet no sanctuary and no common altar, the different houses necessarily served as altars.'
  - where: 'note 16:5 “From the household to the chosen place”'
    claim: 'The blood on the doorposts was tacitly given up, the blood now going on the altar'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/16.htm'
    quote: 'Thus the smearing of the door-posts with the blood was tacitly abolished, since the blood was to be sprinkled upon the altar as sacrificial blood, as it had already been at Sinai.'
  - where: 'note 16:5 “From the household to the chosen place”'
    claim: '“Go unto thy tents” means their lodgings at the sanctuary, not home; the seven-day feast continues'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/16.htm'
    quote: 'is not to be understood as signifying a return to their homes in the different towns of the land, but simply, as even Riehm admits, to their homes or lodgings at the place of the sanctuary.'
  - where: 'note 16:5 “From the household to the chosen place”'
    claim: 'Because sacrifice was part of every festival, they would be kept only at the central altar'
    key: seely-lehi-altar
    url: 'https://archive.bookofmormoncentral.org/content/lehi%E2%80%99s-altar-and-sacrifice-wilderness'
    quote: 'because sacrifice was an integral part of all of the festivals, these festivals would no longer be celebrated in the various villages, but only at the central altar at the temple after it had been established.'
  - where: 'note 16:5 “From the household to the chosen place”'
    claim: 'Josiah’s Passover kept in Jerusalem as written in the book of the covenant'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/23?lang=eng'
    quote: 'But in the eighteenth year of king Josiah, wherein this passover was holden to the Lord in Jerusalem.'

  - where: 'note 16:7 “Roast, boil, or cook”'
    claim: 'The verb is bashal; BDB gives “boil” and “cook (general)”, and places Deut. 16:7 under cook, comparing Ex. 12:8–9 and 2 Chr. 35:13 (“with fire”)'
    key: bdb
    url: 'https://biblehub.com/hebrew/1310.htm'
    quote: '2 cook (general), object בשׂר 1 Kings 19:21; Exodus 29:31; Leviticus 8:31 (both P); object בֵּן 2 Kings 6:29 compare יֶלֶד Lamentations 4:10; hence also of הפסח Deuteronomy 16:7'
  - where: 'note 16:7 “Roast, boil, or cook”'
    claim: 'BDB’s first sense is boil'
    key: bdb
    url: 'https://biblehub.com/hebrew/1310.htm'
    quote: '1 boil (transitive) object omitted Numbers 11:8, בָּשָׂר 1 Samuel 2:13'
  - where: 'note 16:7 “Roast, boil, or cook”'
    claim: 'The Westminster Leningrad Codex has bashal (H1310) at 16:7'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'וּ/בִשַּׁלְתָּ֙'
  - where: 'note 16:7 “Roast, boil, or cook”'
    claim: 'A modern translation renders “cook”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Deuteronomy+16&version=NRSVUE'
    quote: 'You shall cook it and eat it at the place that the Lord your God will choose; the next morning you may go back to your tents.'
  - where: 'note 16:7 “Roast, boil, or cook”'
    claim: 'The Chronicler: roasted the passover with fire according to the ordinance'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/35?lang=eng'
    quote: 'And they roasted the passover with fire according to the ordinance'

  - where: 'note 16:11 “Who eats at the feast”'
    claim: 'Israel was to remember its bondage and so remember the Levite, stranger, fatherless and widow at the feasts; those in need received the food'
    key: muhlestein-love-neighbor
    url: 'https://rsc.byu.edu/covenant-compassion/covenantal-command'
    quote: 'Those in need were to come to the festivals and were to receive the gathered food as part of the festivities.'
  - where: 'note 16:11 “Who eats at the feast”'
    claim: 'Rejoicing together brought the disadvantaged into the households, a belonging as important as the food'
    key: muhlestein-love-neighbor
    url: 'https://rsc.byu.edu/covenant-compassion/covenantal-command'
    quote: 'This rejoicing together as the Israelites jointly held festivals and gave to the disadvantaged brought those groups into their households and families, providing a sense of unity and belonging that was likely just as important as the food was.'
  - where: 'note 16:11 “Who eats at the feast”'
    claim: 'The empathy Israel learned as strangers could be expressed at the feasts'
    key: belnap-outcasts
    url: 'https://rsc.byu.edu/vol-19-no-3-2018/lord-god-which-gathereth-outcasts'
    quote: 'Such empathy could be expressed during those times of the year that coincided with the feasts and festivals ancient Israel kept.'
  - where: 'note 16:11 “Who eats at the feast”'
    claim: 'The stranger is invited to Weeks and Tabernacles; nothing is said of him at Passover'
    key: belnap-outcasts
    url: 'https://rsc.byu.edu/vol-19-no-3-2018/lord-god-which-gathereth-outcasts'
    quote: 'There, while the stranger is explicitly invited to participate in the celebrations of the Feast of the Weeks and the Feast of the Tabernacles, the instruction says nothing about including the stranger in the third primary festival, the Passover.'

  - where: 'note 16:18 “Judges in every town”'
    claim: 'At Sinai the people chose judges and Moses installed them; the same was to continue (Deut. 1:12–18)'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/16.htm'
    quote: 'to choose them, and have them appointed by its rulers, just as was done at Sinai, where the people chose the judges, and Moses inducted into office the persons so chosen (cf. Deuteronomy 1:12-18).'
  - where: 'note 16:18 “Judges in every town”'
    claim: 'The officers (shoterim, literally writers) were secretaries and advisers of the judges'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/16.htm'
    quote: 'The shoterim, officers (lit., writers, see at Exodus 5:6), who were associated with the judges, according to Deuteronomy 1:15, even under the previous arrangement, were not merely messengers and servants of the courts, but secretaries and advisers of the judges'
  - where: 'note 16:18 “Judges in every town”'
    claim: 'What is new is a court in every town; before, judges were set over divisions of the people'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/16.htm'
    quote: 'The new features, which Moses introduces here, consist simply in the fact that every place was to have its own judges and officers, whereas hitherto they had only been appointed for the larger and smaller divisions of the nation'
  - where: 'note 16:18 “Judges in every town”'
    claim: 'The Sinai arrangement sufficed while Israel was one camp with Moses to bring hard cases to God; scattered in the land and without such a mediator, it needed adapting'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/16.htm'
    quote: 'But for future times, when Israel would no longer possess a prophet and mediator like Moses, and after the conquest of Canaan would live scattered about in the towns and villages of the whole land, certain modifications and supplementary additions were necessary'
  - where: 'note 16:18 “Judges in every town”'
    claim: 'The gate of a city was a place for public business'
    key: bd-gate
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/gate?lang=eng'
    quote: 'The gate of a city was often a place for public business (Deut. 21:19; Ruth 4:1–11; 2 Sam. 3:27; 15:2; Job 31:21; Ps. 69:12; 127:5; Isa. 29:21; Jer. 38:7; Lam. 5:14; Amos 5:10–15).'
  - where: 'note 16:18 “Judges in every town”'
    claim: 'Verse 19 corresponds to Exodus 23:6, 8'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/16.htm'
    quote: 'The admonition in Deuteronomy 16:19 corresponds to the instructions in Exodus 23:6 and Exodus 23:8.'
  - where: 'note 16:18 “Judges in every town”'
    claim: 'A modern translation renders verse 19 with “bribe”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Deuteronomy+16&version=NRSVUE'
    quote: 'you must not accept a bribe, for a bribe blinds the eyes of the wise and subverts the cause of those who are in the right.'

  - where: 'note 16:20 “Justice, justice”'
    claim: 'The Hebrew repeats tsedeq (H6664) twice at 16:20'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'צֶ֥דֶק'
  - where: 'note 16:20 “Justice, justice”'
    claim: 'BDB lists “pursue righteousness/justice” (רדף צ) at Deut. 16:20, among uses of judges and rulers'
    key: bdb
    url: 'https://biblehub.com/hebrew/6664.htm'
    quote: 'a. of judges, rulers, kings, ׳שׁפט בצ Leviticus 19:15(H); ׳שׁפט צ Deuteronomy 1:16; Proverbs 31:9; ׳משׁפט צ Deuteronomy 16:18; ׳רדף צ Deuteronomy 16:20'
  - where: 'note 16:20 “Justice, justice”'
    claim: 'The verb (radaph) is used figuratively, follow after, aim to secure, with justice at 16:20'
    key: bdb
    url: 'https://biblehub.com/hebrew/7291.htm'
    quote: '2 figurative follow after, aim to secure: in bad sense'
  - where: 'note 16:20 “Justice, justice”'
    claim: 'with accusative צֶדֶק Deuteronomy 16:20'
    key: bdb
    url: 'https://biblehub.com/hebrew/7291.htm'
    quote: 'good sense, with infinitive ׳לְדַעַת אֶתיֿ Hosea 6:3, with accusative צֶדֶק Deuteronomy 16:20'
  - where: 'note 16:20 “Justice, justice”'
    claim: 'A modern translation: “Justice, and only justice, you shall pursue”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Deuteronomy+16&version=NRSVUE'
    quote: 'Justice, and only justice, you shall pursue'
  - where: 'note 16:20 “Justice, justice”'
    claim: 'Israel, and especially its leaders, were to do all of this justly, that they might live and inherit'
    key: muhlestein-love-neighbor
    url: 'https://rsc.byu.edu/covenant-compassion/covenantal-command'
    quote: 'The Israelites were then told that they, and especially their leaders, should do all of this justly, “that thou mayest live, and inherit the land which the Lord thy God giveth thee” (16:20).'

  - where: 'note 16:22 “A pillar, or a graven image”'
    claim: 'The Hebrew word is a sacred stone or pillar set by an altar; Moses set up twelve at Sinai (Ex. 24:4); Deuteronomy condemns it for Israel'
    key: bdb
    url: 'https://biblehub.com/hebrew/4676.htm'
    quote: 'especially of sacred stones or pillars in connection with altar, erected (בנה) by Moses Exodus 24:4 (E; 12 pillars)'
  - where: 'note 16:22 “A pillar, or a graven image”'
    claim: 'Condemned for Israel in Deuteronomy 16:22'
    key: bdb
    url: 'https://biblehub.com/hebrew/4676.htm'
    quote: 'condemned for Israel by Deuteronomic code'
  - where: 'note 16:22 “A pillar, or a graven image”'
    claim: 'The JST reads “graven image,” qualifying the kind of image'
    key: horton-jst-pentateuch
    url: 'https://rsc.byu.edu/joseph-smith-translation/insights-exodus-leviticus-numbers-deuteronomy'
    quote: 'Deuteronomy 16:22. The JST qualifies the kind of image set up. “Neither shalt thou set thee up any graven image; which the Lord thy God hateth.”'
  - where: christ
    claim: 'Pentecost is the feast Deuteronomy calls the feast of weeks'
    key: bd-feasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/feasts?lang=eng'
    quote: 'It is called (Ex. 23:16) “the feast of harvest, the firstfruits of thy labours” and (Deut. 16:10) “the feast of weeks.”'
  - where: christ
    claim: 'At the Passover meal Jesus gave the bread to be eaten in remembrance of Him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/22?lang=eng'
    quote: 'With desire I have desired to eat this passover with you before I suffer'
  - where: christ
    claim: 'Luke 22:19: this do in remembrance of me'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/22?lang=eng'
    quote: 'This is my body which is given for you: this do in remembrance of me.'
  - where: christ
    claim: 'The Saints are commanded to offer up their sacraments on the Lord’s holy day, with thanksgiving and cheerful hearts'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/59?lang=eng'
    quote: 'thou shalt go to the house of prayer and offer up thy sacraments upon my holy day'
  - where: christ
    claim: 'D&C 59:15: with thanksgiving, with cheerful hearts and countenances'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/59?lang=eng'
    quote: 'And inasmuch as ye do these things with thanksgiving, with cheerful hearts and countenances'
