chapter: 29
claims:
  - where: when
    claim: 'Moses speaks in the land of Moab in the fortieth year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/1?lang=eng'
    quote: 'And it came to pass in the fortieth year, in the eleventh month, on the first day of the month, that Moses spake unto the children of Israel'

  - where: setting
    claim: 'Moses speaks in the plains of Moab in the fortieth year after the Exodus'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/1?lang=eng'
    quote: 'On this side Jordan, in the land of Moab, began Moses to declare this law'
  - where: setting
    claim: 'The third sermon runs from 29:2 to 30:20'
    key: seely-self-reference
    url: 'https://rsc.byu.edu/they-shall-grow-together/rhetoric-self-reference-deuteronomy-book-mormon'
    quote: 'The book of Deuteronomy contains three sermons delivered by Moses at the plains of Moab (1:1–4:43; 4:44–29:1; 29:2–30:20)'
  - where: setting
    claim: 'The Exodus generation had largely passed away; those entering the land were children or unborn at Sinai'
    key: ot-minute-deut-rappleye
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1-6-8-15-18-29-30-34'
    quote: 'the original Exodus generation had largely passed away, and those about to enter the land had either been children or not yet born when God made His covenant with Israel at Mount Sinai'
  - where: setting
    claim: 'Chapters 29–30 are the covenant ratification, and repeat the covenant pattern on a small scale'
    key: ot-minute-deut-rappleye
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1-6-8-15-18-29-30-34'
    quote: 'Deuteronomy chapters 29–30 represent the covenant ratification portion of Deuteronomy. It is here, after Moses laid out all the details of the covenant obligations, that “the present generation of Israelites bound themselves to the covenant'
  - where: setting
    claim: 'The small-scale pattern: historical introduction, covenant bond, curses, blessings, final call'
    key: ot-minute-deut-rappleye
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1-6-8-15-18-29-30-34'
    quote: 'A covenant pattern similar to that of the entire book is manifest on a smaller scale in these two chapters'
  - where: 'note 29:24 “Why the land lies waste”'
    claim: 'The question of 29:24 is asked again over Jerusalem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/22?lang=eng'
    quote: 'Wherefore hath the Lord done thus unto this great city?'

  - where: thread
    claim: 'The chapter argues from the covenant past, present and future toward a call to decision'
    key: ot-minute-deut-rappleye
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1-6-8-15-18-29-30-34'
    quote: 'It discusses the covenant past (29:2–8), present (29:9–15), and future (29:16–29; 30:1–10) as the motivations for a call to decision (30:11–20).'
  - where: thread
    claim: 'The past events are the basis of confidence and the reason to keep the covenant and prosper'
    key: ot-minute-deut-rappleye
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1-6-8-15-18-29-30-34'
    quote: 'These events provide the historical “basis for Israel’s confidence in Yahweh’s gracious favor”[29] and thus the reason for trusting that if they keep their covenant with Him, they will prosper (see verse 9).'
  - where: thread
    claim: 'The cursings end chapter 29; the promise of return fills chapter 30'
    key: muhlestein-everlasting-covenant
    url: 'https://rsc.byu.edu/vol-21-no-2-2020/recognizing-everlasting-covenant-scriptures'
    quote: 'In Deuteronomy, the cursings are repeated again at the end of chapter 29, but the promise of the ability to return fills chapter 30.'

  - where: section 4 plain
    claim: 'A modern translation renders the end of 29:19 “sweeping away the moist with the dry”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Deuteronomy+29&version=NRSVUE'
    quote: '‘We are safe even though we go our own stubborn ways’ (thus sweeping away the moist with the dry)'

  - where: 'note 29:1 “The covenant of Moab and the covenant of Horeb”'
    claim: 'The next generation renewed the Sinai covenant before entering the land'
    key: scripture-helps-deut
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/18-deuteronomy-6-8-15-18-29-30-34?lang=eng'
    quote: 'Before Israel entered the promised land, the next generation renewed the covenant the children of Israel had originally made with the Lord at Sinai.'
  - where: 'note 29:1 “The covenant of Moab and the covenant of Horeb”'
    claim: 'The covenant with its blessings and cursings is described in chapter 28'
    key: scripture-helps-deut
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/18-deuteronomy-6-8-15-18-29-30-34?lang=eng'
    quote: 'That covenant, along with its blessings and cursings, is described in Deuteronomy 28. Through the renewal of this covenant, the Lord emphasized that Israel would be His people and that He would be their God.'
  - where: 'note 29:1 “The covenant of Moab and the covenant of Horeb”'
    claim: 'The Hebrew Bible numbers this verse 28:69'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'Deut.28.69'
  - where: 'note 29:1 “The covenant of Moab and the covenant of Horeb”'
    claim: 'A Latter-day Saint outline places 29:1 with the blessings and curses'
    key: ot-minute-deut-rappleye
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1-6-8-15-18-29-30-34'
    quote: 'Blessings and curses 28:1–29:1'
  - where: 'note 29:1 “The covenant of Moab and the covenant of Horeb”'
    claim: 'Another ends the second sermon at 29:1'
    key: seely-self-reference
    url: 'https://rsc.byu.edu/they-shall-grow-together/rhetoric-self-reference-deuteronomy-book-mormon'
    quote: 'three sermons delivered by Moses at the plains of Moab (1:1–4:43; 4:44–29:1; 29:2–30:20)'

  - where: 'note 29:4 “Seeing without a heart to perceive”'
    claim: 'Heart means understanding; Moses reproves past dullness to stir them, not to excuse it'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/29.htm'
    quote: 'With this complaint, Moses does not intend to excuse the previous want of susceptibility on the part of the nation to the manifestations of grace on the part of the Lord, but simply to explain the necessity for the repeated allusion to the gracious acts of God'
  - where: 'note 29:4 “Seeing without a heart to perceive”'
    claim: 'One older reading: the Lord had not given it because the people had not asked'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/29.htm'
    quote: 'The Lord had not yet given the people an understanding heart, because the people had not yet asked for it, simply because the need of it was not felt'
  - where: 'note 29:4 “Seeing without a heart to perceive”'
    claim: 'Another older reading: the inward power to recognise God’s deeds is itself His gift; the wording holds grace and responsibility together'
    key: cambridge-deuteronomy
    url: 'https://biblehub.com/commentaries/cambridge/deuteronomy/29.htm'
    quote: 'The deeds in which the Divine revelation consists are of no avail without the inward power to recognise and appreciate them, which is also, equally with them, of the gift of God'
  - where: 'note 29:4 “Seeing without a heart to perceive”'
    claim: 'The construction expresses both grace and human responsibility'
    key: cambridge-deuteronomy
    url: 'https://biblehub.com/commentaries/cambridge/deuteronomy/29.htm'
    quote: 'The awkwardness of the construction is due to the effort to express both the grace of God and the responsibility of man.'
  - where: 'note 29:4 “Seeing without a heart to perceive”'
    claim: 'Paul combines Isaiah 29:10 and Deuteronomy 29:4 and reads them of Israel’s unbelief in the gospel age; “unto this day” is part of the quotation'
    key: cambridge-romans
    url: 'https://biblehub.com/commentaries/cambridge/romans/11.htm'
    quote: 'is here interpreted by St Paul to be a “prophecy in act” of the unbelief of Israel, and of its cause, in the days of Messiah.—It will be seen that the words “unto this day” are part of the quotation'

  - where: 'note 29:5 “Who is speaking?”'
    claim: 'The Greek translation reads “he led you”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/deuteronomy/29.htm'
    quote: 'And he led you forty years in the wilderness; your garments did not grow old'

  - where: 'note 29:15 “Everyone, and those not yet born”'
    claim: 'The covenant bond includes men, women, children, ancestors, and future Israelites'
    key: ot-minute-deut-rappleye
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1-6-8-15-18-29-30-34'
    quote: 'it goes beyond all those who were present at the covenant ceremony to include those that were “not here with us this day” (verses 14–15), which implies that future Israelites were also bonded to the Lord through this covenant'
  - where: 'note 29:15 “Everyone, and those not yet born”'
    claim: 'The same words name the Gibeonites’ lot in Joshua 9:21'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/9?lang=eng'
    quote: 'let them be hewers of wood and drawers of water unto all the congregation'

  - where: 'note 29:18 “A root of gall and wormwood”'
    claim: 'Gall is the juice of a bitter plant'
    key: bd-gall
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/gall?lang=eng'
    quote: 'More often it denotes the juice of some bitter plant (Deut. 29:18; 32:32; Matt. 27:34).'
  - where: 'note 29:18 “A root of gall and wormwood”'
    claim: 'Private apostasy will eventually have public ramifications'
    key: ot-minute-deut-rappleye
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1-6-8-15-18-29-30-34'
    quote: 'The implication of mentioning both private and national apostasy together is that “private apostasy cannot be hidden from Yahweh; it will eventually have public ramifications.”'
  - where: 'note 29:18 “A root of gall and wormwood”'
    claim: 'Hebrews 12:15 uses the same image of a bitter root'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/12?lang=eng'
    quote: 'lest any root of bitterness springing up trouble you, and thereby many be defiled'

  - where: 'note 29:19 “The man who blesses himself”'
    claim: 'The Hebrew word (alah) means oath, usually in a bad sense curse; used of the covenant oath in this chapter'
    key: bdb
    url: 'https://biblehub.com/hebrew/423.htm'
    quote: '2 oath of convenant Genesis 24:41 (twice in verse); Genesis 26:28 (J) Deuteronomy 29:11; Deuteronomy 29:13'
  - where: 'note 29:19 “The man who blesses himself”'
    claim: 'The same Hebrew word is “oath” in vv. 12, 14 and “curse(s)” in vv. 19–21'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'Deut.29.18'
  - where: 'note 29:19 “The man who blesses himself”'
    claim: 'The word rendered “imagination” is rendered “stubbornness” elsewhere; tied to idolatry and false security'
    key: sc-knowhy-546
    url: 'https://scripturecentral.org/knowhy/what-is-the-significance-of-the-great-and-spacious-building'
    quote: 'shereeroth is a kind of idolatrous self-reliance rendered “imagination” in our King James Bibles and in other translations as “stubbornness.”'
  - where: 'note 29:19 “The man who blesses himself”'
    claim: 'Attraction to idols intertwined with false security'
    key: sc-knowhy-546
    url: 'https://scripturecentral.org/knowhy/what-is-the-significance-of-the-great-and-spacious-building'
    quote: 'the interesting intertwining of attraction to foreign idols and a false sense of security, since the person who acts in this manner will not be pardoned but will be singled out for calamity'
  - where: 'note 29:19 “The man who blesses himself”'
    claim: 'A modern translation: “thus sweeping away the moist with the dry”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Deuteronomy+29&version=NRSVUE'
    quote: '(thus sweeping away the moist with the dry)'
  - where: 'note 29:24 “Why the land lies waste”'
    claim: 'Moses moves from private apostasy to the whole nation, with destruction like Sodom and Gomorrah'
    key: ot-minute-deut-rappleye
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1-6-8-15-18-29-30-34'
    quote: 'The Lord further warned of utter destruction akin to that of Sodom and Gomorrah should the entire nation forsake the covenant (verses 22–29).'
  - where: 'note 29:24 “Why the land lies waste”'
    claim: 'A Latter-day Saint study sets 29:22–28 under the question why the Lord would destroy His own people'
    key: dundas-ancient-israel
    url: 'https://rsc.byu.edu/mormons-record/ancient-israel'
    quote: 'Why would the Lord destroy his own people?'
  - where: 'note 29:24 “Why the land lies waste”'
    claim: 'The same study answers that the merciful Lord will not utterly forget the covenant (4:31)'
    key: dundas-ancient-israel
    url: 'https://rsc.byu.edu/mormons-record/ancient-israel'
    quote: 'Because the Lord is a merciful God, he will not utterly forget the covenant'
  - where: 'note 29:24 “Why the land lies waste”'
    claim: 'The curses end chapter 29; the promise of return fills chapter 30'
    key: muhlestein-everlasting-covenant
    url: 'https://rsc.byu.edu/vol-21-no-2-2020/recognizing-everlasting-covenant-scriptures'
    quote: 'the cursings are repeated again at the end of chapter 29, but the promise of the ability to return fills chapter 30'
  - where: 'note 29:24 “Why the land lies waste”'
    claim: 'The question is asked again in 1 Kings 9:8–9'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/9?lang=eng'
    quote: 'Why hath the Lord done thus unto this land, and to this house?'

  - where: 'note 29:29 “The secret things and the revealed”'
    claim: 'One older reading: the revealed is the law; the hidden is how God will carry out His counsel in the future despite apostasy'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/29.htm'
    quote: 'That which is revealed includes the law with its promises and threats; consequently that which is hidden can only refer to the mode in which God will carry out in the future His counsel and will, which He has revealed in the law, and complete His work of salvation notwithstanding the apostasy of the people.'
  - where: 'note 29:29 “The secret things and the revealed”'
    claim: 'Another older reading: hidden things are the future; revealed are God’s past deeds and words; all Israel can do is keep the law; contrast 30:1–10'
    key: cambridge-deuteronomy
    url: 'https://biblehub.com/commentaries/cambridge/deuteronomy/29.htm'
    quote: 'The still hidden things are the future (cp. Isaiah 48:6), the things that are revealed are those just reviewed, God’s deeds and words in the past and present.'
  - where: 'note 29:29 “The secret things and the revealed”'
    claim: 'That the exile is among the revealed things is not certain but seems implied'
    key: cambridge-deuteronomy
    url: 'https://biblehub.com/commentaries/cambridge/deuteronomy/29.htm'
    quote: 'is not certain, but it seems implied'
  - where: 'note 29:29 “The secret things and the revealed”'
    claim: 'The issue of the exile is still hidden, in contrast to the conditional promise of 30:1–10; Israel can keep the law'
    key: cambridge-deuteronomy
    url: 'https://biblehub.com/commentaries/cambridge/deuteronomy/29.htm'
    quote: 'Only its issue is still hidden, in contrast to the conditional prediction of a happy issue from it delivered in the following vv. Deuteronomy 30:1-10. All that Israel can do is to keep the law already revealed.'

  - where: 'note 29:18 “A root of gall and wormwood”'
    claim: 'Wormwood is used metaphorically of bitter calamity or sorrow'
    key: bd-wormwood
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/wormwood?lang=eng'
    quote: 'The herb Artemisia. Used metaphorically of bitter calamity or sorrow (Deut. 29:18; Jer. 9:15; 23:15; Lam. 3:15, 19; Amos 5:7).'
  - where: 'note 29:5 “Who is speaking?”'
    claim: 'The LORD speaks in the first person in 29:6'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/29?lang=eng'
    quote: 'that ye might know that I am the Lord your God'

  - where: christ
    claim: 'The covenant phrases evoke the whole of the promises to Abraham'
    key: muhlestein-everlasting-covenant
    url: 'https://rsc.byu.edu/vol-21-no-2-2020/recognizing-everlasting-covenant-scriptures'
    quote: 'such language evokes the entirety of the promises made to Abraham and his posterity and highlights the special love and relationship inherent to the Abrahamic covenant'
  - where: christ
    claim: 'In Jeremiah 31:33 the new covenant ties the law in the heart to God being their God'
    key: muhlestein-everlasting-covenant
    url: 'https://rsc.byu.edu/vol-21-no-2-2020/recognizing-everlasting-covenant-scriptures'
    quote: 'what made someone truly part of the covenant was whether or not the commandments (our obligation under the covenant) were part of his or her heart'
  - where: christ
    claim: 'D&C 42:9 uses the covenant phrase: God was reestablishing Israel in the latter days'
    key: muhlestein-everlasting-covenant
    url: 'https://rsc.byu.edu/vol-21-no-2-2020/recognizing-everlasting-covenant-scriptures'
    quote: 'Recognizing this as a covenant phrase allows us to see that what God was reestablishing was Israel, this time in the latter days.'

  - where: explore
    claim: 'Joshua renews the covenant at Shechem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/24?lang=eng'
    quote: 'So Joshua made a covenant with the people that day'
