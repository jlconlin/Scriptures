chapter: 25
claims:
  - where: setting
    claim: 'Moses speaks in the plains of Moab in the fortieth year after the Exodus'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/1?lang=eng'
    quote: 'And it came to pass in the fortieth year, in the eleventh month, on the first day of the month, that Moses spake unto the children of Israel'
  - where: setting
    claim: 'Chapters 12–26 are a code of laws, the nucleus of the book; the last group regulates private and social rights'
    key: bd-deuteronomy
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/deuteronomy?lang=eng'
    quote: '(2) 12–26, a code of laws, which forms the nucleus of the whole book. … The next group of laws deals with the administration of justice, while the last group regulates private and social rights.'
  - where: setting
    claim: 'Deuteronomy is referenced frequently in the New Testament, 1 Cor. 9:9 among them'
    key: bd-deuteronomy
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/deuteronomy?lang=eng'
    quote: 'Deuteronomy is referenced frequently in the New Testament: … 1 Cor. 9:9, Deut. 25:4'
  - where: setting
    claim: 'Chapter 26 turns to the offerings brought in the land; Ruth 4:7–8 has a shoe taken off; Saul is sent against Amalek'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/26?lang=eng'
    quote: 'That thou shalt take of the first of all the fruit of the earth, which thou shalt bring of thy land that the LORD thy God giveth thee'
  - where: thread
    claim: 'The code''s last group of laws regulates private and social rights'
    key: bd-deuteronomy
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/deuteronomy?lang=eng'
    quote: 'the last group regulates private and social rights.'
  - where: thread
    claim: 'Behind “one with another” in verse 11 is the idiom “a man and his brother”'
    key: cambridge-deuteronomy
    url: 'https://biblehub.com/commentaries/cambridge/deuteronomy/25.htm'
    quote: 'The additions may be the superfluous a man and his brother (Deuteronomy 25:11, R.V. one with another)'
  - where: thread
    claim: '“Remember” introduces historical statements often in Deuteronomy; 25:17 is the same as 24:9'
    key: cambridge-deuteronomy
    url: 'https://biblehub.com/commentaries/cambridge/deuteronomy/25.htm'
    quote: 'same as in Deuteronomy 24:9, q.v. For other historical statements introd. by remember, see Deuteronomy 5:15, Deuteronomy 7:18, Deuteronomy 9:7, Deuteronomy 15:15, Deuteronomy 16:12.'
  - where: 'note 25:3 “Forty stripes and no more”'
    claim: 'Thirty-nine lashes were usually given to prevent a miscount; Paul''s forty stripes save one'
    key: ot-manual-deuteronomy-17-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/deuteronomy-17-33-an-exhortation-to-obedience-part-2?lang=eng'
    quote: 'In order to prevent a miscount and therefore break a commandment of the Lord, thirty-nine lashes were usually administered.'
  - where: 'note 25:4 “The ox that treads out the grain”'
    claim: 'How threshing with oxen was done'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/25.htm'
    quote: 'with oxen yoked together, and driven to and fro over the corn that had been strewn upon the floor, that they might kick out the grains with their hoofs'
  - where: 'note 25:4 “The ox that treads out the grain”'
    claim: 'One older reading: the command is proverbial, in Paul''s sense that a labourer is not to be deprived of wages'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/25.htm'
    quote: 'The command not to put a muzzle upon the ox when threshing, is no doubt proverbial in its nature … viz., that a labourer was not to be deprived of his wages.'
  - where: 'note 25:4 “The ox that treads out the grain”'
    claim: 'Another older reading: God does care for oxen in Deuteronomy'
    key: cambridge-deuteronomy
    url: 'https://biblehub.com/commentaries/cambridge/deuteronomy/25.htm'
    quote: 'In 1 Corinthians 9:9 f. Paul in illustrating from this law the principle that the labourer is worthy of his hire asks, Is it for oxen that God careth? According to D, undoubtedly He does.'
  - where: 'note 25:4 “The ox that treads out the grain”'
    claim: 'Paul quotes the verse in 1 Corinthians and 1 Timothy'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-tim/5?lang=eng'
    quote: 'For the scripture saith, Thou shalt not muzzle the ox that treadeth out the corn. And, The labourer is worthy of his reward.'
  - where: 'note 25:5 “The husband''s brother”'
    claim: 'A Near Eastern custom; the family cared for the childless widow; the brother-in-law a special kind of husband; land kept in the family'
    key: muhlestein-love-neighbor
    url: 'https://rsc.byu.edu/covenant-compassion/covenantal-command'
    quote: 'Israelites practiced a custom that was common throughout the Near East at the time.[31] When a woman’s husband died and she did not have children to care for her, the dead husband’s family took over her care'
  - where: 'note 25:5 “The husband''s brother”'
    claim: 'The brother-in-law became a special kind of husband; the child would inherit the land and care for her; lands stayed in family lines'
    key: muhlestein-love-neighbor
    url: 'https://rsc.byu.edu/covenant-compassion/covenantal-command'
    quote: 'to become a special kind of husband for the widow. … a child who could both eventually inherit her previous husband’s land and take care of her. … in this way lands did not pass out of family lines'
  - where: 'note 25:5 “The husband''s brother”'
    claim: 'The firstborn bore the dead brother''s name and was his heir'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'therewith the firstborn child bore the dead brother’s name and served as his heir.'
  - where: 'note 25:5 “The husband''s brother”'
    claim: 'The law provided for the widow and kept family lines from dying out'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'Thus the levirate law both provided for the widow, partially by keeping family land within the family, and prevented family lines from dying out.'
  - where: 'note 25:5 “The husband''s brother”'
    claim: 'Judah tells Onan to go in to his brother''s wife'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/38?lang=eng'
    quote: 'And Judah said unto Onan, Go in unto thy brother’s wife, and marry her, and raise up seed to thy brother.'
  - where: 'note 25:9 “The loosed shoe”'
    claim: 'The only stipulated public humiliation in the law of Moses'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'This duty was so important that it includes the only stipulated example of public humiliation[5] in the law of Moses for those who were unwilling to take upon themselves the levirate duty'
  - where: 'note 25:9 “The loosed shoe”'
    claim: 'Shoes denote readiness; the sandal taken off signifies refusal; the family shares the shame'
    key: muhlestein-ruth
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/ruth-redemption-covenant-christ'
    quote: 'wearing them denotes a readiness, a preparation to do what needs to be done (see Exodus 12:11 … having the sandal taken off signifies a refusal to perform that same duty. … the entire family was to share in the stigma of shame'
  - where: 'note 25:9 “The loosed shoe”'
    claim: 'Most scholars see Ruth 4 as levirate marriage'
    key: gaskill-shoe
    url: 'https://rsc.byu.edu/our-rites-worship/ceremony-shoe-ritual-gods-ancient-covenant-people'
    quote: 'most scholars, whether LDS [4] or non-LDS, [5] tend to see the rite described in Ruth 4 as a biblical example of levirate marriage.'
  - where: 'note 25:9 “The loosed shoe”'
    claim: 'In Ruth there is no spitting, the kinsman removes his own shoe, he is not the husband''s brother, and incurs no disgrace'
    key: gaskill-shoe
    url: 'https://rsc.byu.edu/our-rites-worship/ceremony-shoe-ritual-gods-ancient-covenant-people'
    quote: 'Ruth does not spit in the face of the man who refuses to marry her … the unnamed male kinsman-redeemer (gō’ēl) in the story of Ruth incurs no disgrace when he declines to play his part.'
  - where: 'note 25:9 “The loosed shoe”'
    claim: 'The kinsman in Ruth is not her husband''s brother and removes his own shoe'
    key: gaskill-shoe
    url: 'https://rsc.byu.edu/our-rites-worship/ceremony-shoe-ritual-gods-ancient-covenant-people'
    quote: 'the unnamed male kinsman-redeemer (gō’ēl) is depicted as removing his own shoe. … the unnamed kinsman-redeemer (gō’ēl) is not Ruth’s husband’s brother'
  - where: 'note 25:9 “The loosed shoe”'
    claim: 'Ex. 12:11: shoes on the feet at the Passover'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/12?lang=eng'
    quote: 'your loins girded, your shoes on your feet, and your staff in your hand'
  - where: 'note 25:9 “The loosed shoe”'
    claim: 'The Bible Dictionary counts the story of Ruth as a major aspect of levirate marriage'
    key: bd-levirate-marriage
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/levirate-marriage?lang=eng'
    quote: 'it also forms a major aspect of the story of Ruth (Ruth 4:1–12).'
  - where: 'note 25:9 “The loosed shoe”'
    claim: 'In Gaskill''s reading the shoe in Ruth symbolizes the right of possession of land, which the kinsman gives up'
    key: gaskill-shoe
    url: 'https://rsc.byu.edu/our-rites-worship/ceremony-shoe-ritual-gods-ancient-covenant-people'
    quote: 'the shoe served as the perfect symbol of the right of possession. … Here the kinsman-redeemer (gō’ēl) was acknowledging that he had willingly divested himself of his natural right to Elimelech’s former property.'
  - where: 'note 25:12 “The penalty of a hand”'
    claim: 'The only mutilation in Deuteronomy apart from the law of retaliation; typical case; taboo; catchword; Hammurabi'
    key: cambridge-deuteronomy
    url: 'https://biblehub.com/commentaries/cambridge/deuteronomy/25.htm'
    quote: 'This very special case is probably meant to be typical of others (cp. Deuteronomy 19:5). The punishment is the only mutilation prescribed by D apart from the jus talionis (Deuteronomy 19:21). It is usually supposed to have had its origin at a time when such an act was the violation of a very sacred taboo.'
  - where: 'note 25:12 “The penalty of a hand”'
    claim: 'The position of the law may be due to the catchword “his brother”; Hammurabi has parallel crimes'
    key: cambridge-deuteronomy
    url: 'https://biblehub.com/commentaries/cambridge/deuteronomy/25.htm'
    quote: 'The position of the law just here may be due to the catchword his brother, cp. Deuteronomy 25:9. … In Ḫammurabi, §§ 202–205, there are (if the translation can be relied on) parallel crimes.'
  - where: 'note 25:12 “The penalty of a hand”'
    claim: 'Deut. 19:21 uses “thine eye shall not pity” with eye for eye'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/19?lang=eng'
    quote: 'And thine eye shall not pity; but life shall go for life, eye for eye, tooth for tooth'
  - where: 'note 25:13 “Two sets of stones”'
    claim: 'The Hebrew of “divers weights” is “a stone and a stone”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'וָ/אָ֑בֶן'
  - where: 'note 25:18 “Why Amalek is remembered”'
    claim: 'Samuel sends Saul against Amalek remembering the attack on the way from Egypt'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/15?lang=eng'
    quote: 'I remember that which Amalek did to Israel, how he laid wait for him in the way, when he came up from Egypt.'
  - where: christ
    claim: 'JST Luke 12:30 has the Savior quote Deut. 25:4; Paul''s use thus quotes a teaching of the Savior'
    key: lefevre-jst-sermon
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/sermon-mount-joseph-smith-translation'
    quote: 'For the law saith that a man shall not muzzle the ox that treadeth out the corn” (Luke 12:30). … Thus through a JST change of ancient scripture, Paul’s use of the verse is actually quoting a teaching of the Savior.'
  - where: christ
    claim: 'The Sadducees'' question was about the resurrection, which they denied'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'it was actually a question about the resurrection, which makes it particularly disingenuous since the Sadducees did not believe in a literal resurrection.'
  - where: christ
    claim: 'Abraham, Isaac and Jacob lived on; through His resurrection Jesus would overcome death for them and us'
    key: huntsman-tuesday
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/tuesday'
    quote: 'Not only did Abraham, Isaac, and Jacob continue to live in the spirit world … but through Jesus’s own resurrection he would overcome physical death for them and for us.'
  - where: christ
    claim: 'Luke’s account of the answer ends “for all live unto him”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/20?lang=eng'
    quote: 'For he is not a God of the dead, but of the living: for all live unto him.'
  - where: christ
    claim: 'Amulek: in the resurrection the spirit and body are reunited in perfect form'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/11?lang=eng'
    quote: 'The spirit and the body shall be reunited again in its perfect form; both limb and joint shall be restored to its proper frame'
  - where: christ
    claim: 'Amulek is speaking of the resurrection'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/11?lang=eng'
    quote: 'I have spoken unto you concerning the death of the mortal body, and also concerning the resurrection of the mortal body.'
  - where: explore
    claim: 'Gaskill''s study treats the shoe ceremony in Ruth 4 and its meaning'
    key: gaskill-shoe
    url: 'https://rsc.byu.edu/our-rites-worship/ceremony-shoe-ritual-gods-ancient-covenant-people'
    quote: 'In this paper we will examine the “ceremony of the shoe” as it appears in Ruth 4, with its common interpretations, likely implications, and significant relations to Latter-day Saint temple practices.'
