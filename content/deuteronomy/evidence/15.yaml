chapter: 15
claims:
  - where: when
    claim: 'Moses speaks in the fortieth year after the Exodus'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/1?lang=eng'
    quote: 'And it came to pass in the fortieth year, in the eleventh month, on the first day of the month, that Moses spake unto the children of Israel'
  - where: setting
    claim: 'One older reading: the tithe instructions of 14:22–29 lead Moses into the laws on the poor and slaves'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/15.htm'
    quote: 'From the laws respecting the poor and slaves, to which the instructions concerning the tithes (Deuteronomy 14:22-29) had given occasion, Moses returns to appropriation of the first-born'
  - where: setting
    claim: 'The code’s covenant economics (14:22–29; 15:1–11) set Israel apart from its neighbors'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'The Israelites’ covenant with Yahweh meant a form of economics that differentiated them from their neighbors.'
  - where: setting
    claim: 'Every seventh year was consecrated to the Lord; the land kept a Sabbath and its produce was left for the poor'
    key: bd-sabbatical-year
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sabbatical-year?lang=eng'
    quote: 'As was the seventh day in every week and the seventh month in every year, so also was every seventh year consecrated to the Lord. … In this year the self-sown produce of the arable lands was to be left for the poor'
  - where: setting
    claim: 'The law was habitually broken before the exile; the seventy years were regarded as making up the unobserved Sabbaths (2 Chr. 36:21)'
    key: bd-sabbatical-year
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sabbatical-year?lang=eng'
    quote: 'The law of the sabbatical year was habitually broken by the Jews for a long period before the Babylonian exile. The 70 years of exile and the land’s desolation were regarded as making up for the unobserved Sabbaths of the land (2 Chr. 36:21).'
  - where: setting
    claim: 'Jeremiah 34 tells of a release of Hebrew servants in Jerusalem, in words close to this chapter'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/34?lang=eng'
    quote: 'At the end of seven years let ye go every man his brother an Hebrew, which hath been sold unto thee; and when he hath served thee six years, thou shalt let him go free from thee'
  - where: thread
    claim: 'One reading: the release laws were a structural reminder that the wealth was not the owners’ own'
    key: lane-redemption
    url: 'https://rsc.byu.edu/covenant-compassion/remembering-redemption-avoiding-idolatry'
    quote: 'The regulations for the seventh-year remission of debts and the release of Israelites serving in temporary enslavement in Deuteronomy 15 had the potential to function as a structural reminder that what the wealthy perceived as their resources was not actually theirs.'
  - where: thread
    claim: 'The release laws redistributed wealth and prevented a widening gap between rich and poor'
    key: lane-redemption
    url: 'https://rsc.byu.edu/covenant-compassion/remembering-redemption-avoiding-idolatry'
    quote: 'each of the commands in Deuteronomy 15 that are associated with the Sabbatical year were ways to redistribute wealth and prevent a perpetually widening gap between the rich and the poor.'
  - where: thread
    claim: 'Under the covenant, servitude and debt could never be crushing in the long term'
    key: muhlestein-love-neighbor
    url: 'https://rsc.byu.edu/covenant-compassion/covenantal-command'
    quote: 'servitude and debt could never be crushing in the long term, for the covenant provided relief from it.'
  - where: section 1 plain
    claim: 'Verse 4 can be read as a command that there should be no poor'
    key: lane-redemption
    url: 'https://rsc.byu.edu/covenant-compassion/remembering-redemption-avoiding-idolatry'
    quote: 'The phrase could be seen as a moral imperative: “However, there should not be any poor among you, for the LORD will surely bless you in the land that he is giving you as an inheritance'
  - where: section 2 plain
    claim: 'An “evil eye” toward someone means being grudging'
    key: bdb
    url: 'https://biblehub.com/hebrew/7489.htm'
    quote: 'רָעָה עַיִן be grudging, with ב person, Deuteronomy 15:9'
  - where: section 3 plain
    claim: 'Verse 18: the servant served at half the cost of a hired worker'
    key: lane-redemption
    url: 'https://rsc.byu.edu/covenant-compassion/remembering-redemption-avoiding-idolatry'
    quote: 'for at half the cost of a hired worker he has served you six years.'
  - where: 'note 15:1 “The LORD’s release”'
    claim: 'The release (shemittah) shares the root of the land’s rest in Ex. 23:11; both provided for the poor'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'Where the Sabbatical year in the Covenant Code emphasizes the land being given “rest” (“thou shalt let it rest [tišmĕṭennâ],” Exodus 23:11), the Deuteronomic Code, using the very same root, emphasizes that this sabbatical year was also a time for the remission or “release” (šĕmiṭṭâ) of debts'
  - where: 'note 15:1 “The LORD’s release”'
    claim: 'Both the land Sabbath and the Lord’s release provided for the poor'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'Both the year of the land Sabbath and the year of the Lord’s release provided for the poor (compare Exodus 23:11 with Deuteronomy 15:4).'
  - where: 'note 15:1 “The LORD’s release”'
    claim: 'Debts between Israelites were released; the sabbatical year began with the seventh month, when the law was read at Tabernacles'
    key: bd-sabbatical-year
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sabbatical-year?lang=eng'
    quote: 'A release of debts owed by Israelite to Israelite was made. … at the Feast of Tabernacles (at the commencement of the sabbatical year, which began with the seventh month) the whole law was read in the hearing of the people.'
  - where: 'note 15:1 “The LORD’s release”'
    claim: 'Literally “a remission to the Lord,” corresponding to “sabbath to the Lord”; not only a matter between people'
    key: lane-redemption
    url: 'https://rsc.byu.edu/covenant-compassion/remembering-redemption-avoiding-idolatry'
    quote: 'We might think that debt release is a lateral rather than a vertical action—meaning that it is about the relationship between people and not between people and God. But there is an important clue in the phrase “a remission to the Lord.”'
  - where: 'note 15:1 “The LORD’s release”'
    claim: 'The literal sense corresponds with “sabbath to the Lord”'
    key: lane-redemption
    url: 'https://rsc.byu.edu/covenant-compassion/remembering-redemption-avoiding-idolatry'
    quote: 'This translation by Baker brings out the literal sense of “a remission to the Lord” and shows “its correspondence with ‘sabbath to the Lord’” (Exodus 20:10 Baker translation).'
  - where: 'note 15:1 “The LORD’s release”'
    claim: 'One older reading: the foreigner (nokri) is of another nation, unlike the resident stranger; the rule shows no hatred and foreigners had income in the seventh year'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/15.htm'
    quote: 'נכרי is a stranger of another nation, standing in no inward relation to Israel at all, and is to be distinguished from גּר, the foreigner who lived among the Israelites, who had a claim upon their protection and pity. This rule breathes no hatred of foreigners'
  - where: 'note 15:1 “The LORD’s release”'
    claim: 'One older reading: foreigners could earn their income in the seventh year'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/15.htm'
    quote: 'There was no severity in this, because foreigners could get their ordinary income in the seventh year as well as in any other.'
  - where: 'note 15:4 “No poor among you, and the poor that never cease”'
    claim: 'The KJV makes “no poor” a theoretical possibility; other translations read it as an imperative or a covenant promise'
    key: lane-redemption
    url: 'https://rsc.byu.edu/covenant-compassion/remembering-redemption-avoiding-idolatry'
    quote: 'In the King James translation, however, having “no poor among them” is merely a theoretical possibility: “Save when there shall be no poor among you” (15:4).'
  - where: 'note 15:4 “No poor among you, and the poor that never cease”'
    claim: 'NET renders it as a command'
    key: lane-redemption
    url: 'https://rsc.byu.edu/covenant-compassion/remembering-redemption-avoiding-idolatry'
    quote: 'The phrase could be seen as a moral imperative: “However, there should not be any poor among you'
  - where: 'note 15:4 “No poor among you, and the poor that never cease”'
    claim: 'JSB renders it as a covenant promise'
    key: lane-redemption
    url: 'https://rsc.byu.edu/covenant-compassion/remembering-redemption-avoiding-idolatry'
    quote: 'The phrase can also be seen as a covenant promise: “There shall be no needy among you—since the Lord your God will bless you in the land that the Lord your God is giving you as a hereditary portion—if only you heed the Lord your God'
  - where: 'note 15:4 “No poor among you, and the poor that never cease”'
    claim: '“No poor among them” evokes Moses 7:18, a condition of Zion'
    key: lane-redemption
    url: 'https://rsc.byu.edu/covenant-compassion/remembering-redemption-avoiding-idolatry'
    quote: 'This phrase should be particularly evocative for Latter-day Saints because this condition of having “no poor among them” is specified as a condition for establishing Zion'
  - where: 'note 15:4 “No poor among you, and the poor that never cease”'
    claim: 'Verse 11 is not a commandment or prophecy but a sad statement of fact; Moses 7:18 implies Zion cannot exist under it'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'the statement “for the poor shall never cease out of the land” (15:11) does not amount to a commandment or a prophecy but rather a sad statement of fact. Moses 7:18 implies that Zion cannot exist under this condition.'
  - where: 'note 15:4 “No poor among you, and the poor that never cease”'
    claim: 'Moses 7:18 wording'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/7?lang=eng'
    quote: 'And the Lord called his people Zion, because they were of one heart and one mind, and dwelt in righteousness; and there was no poor among them.'
  - where: 'note 15:9 “A grudging eye as the seventh year nears”'
    claim: 'The idiom “eye be evil” with a person means to be grudging'
    key: bdb
    url: 'https://biblehub.com/hebrew/7489.htm'
    quote: 'רָעָה עַיִן be grudging, with ב person, Deuteronomy 15:9'
  - where: 'note 15:9 “A grudging eye as the seventh year nears”'
    claim: 'A modern translation: “your eye look grudgingly on your poor brother”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Deuteronomy%2015%3A9&version=ESV'
    quote: 'look grudgingly on your poor brother, and you give him nothing'
  - where: 'note 15:9 “A grudging eye as the seventh year nears”'
    claim: 'The timing of the Sabbatical can make it harder to lend'
    key: lane-redemption
    url: 'https://rsc.byu.edu/covenant-compassion/remembering-redemption-avoiding-idolatry'
    quote: 'the text helps us understand that the timing of the Sabbatical can potentially make it harder to offer a loan to those in need.'
  - where: 'note 15:9 “A grudging eye as the seventh year nears”'
    claim: 'Lending in the sixth year was an extra opportunity to help the poor'
    key: muhlestein-love-neighbor
    url: 'https://rsc.byu.edu/covenant-compassion/covenantal-command'
    quote: 'Lenders were specifically warned not to refrain from lending in the sixth year (Deuteronomy 15:9). The purpose of lending was not to make a profit but rather to help the poor. Thus lending at all times, but especially in the sixth year, was supposed to be done and was deemed an extra opportunity to help the poor.'
  - where: 'note 15:9 “A grudging eye as the seventh year nears”'
    claim: 'Losses would be made up in covenant blessings (15:10)'
    key: muhlestein-love-neighbor
    url: 'https://rsc.byu.edu/covenant-compassion/covenantal-command'
    quote: 'The promise was that such losses would be made up for in the blessings showered out upon them for keeping their covenant (Deuteronomy 15:10).'
  - where: 'note 15:14 “Not sent away empty”'
    claim: 'The verb pictures making a rich necklace, figurative for loading richly'
    key: bdb
    url: 'https://biblehub.com/hebrew/6059.htm'
    quote: 'Deuteronomy 15:14 thou shalt make a rich necklace for him from thy flock, etc., figurative for richly load him.'
  - where: 'note 15:14 “Not sent away empty”'
    claim: 'Without provisions the freed servant might fall back into poverty and lose freedom'
    key: muhlestein-love-neighbor
    url: 'https://rsc.byu.edu/covenant-compassion/covenantal-command'
    quote: 'they would still have been in a difficult economic position that may well have led to their quickly falling back into a cycle of poverty and losing their freedom once again.'
  - where: 'note 15:14 “Not sent away empty”'
    claim: 'The gift comes from the abundance God gave the master'
    key: lane-redemption
    url: 'https://rsc.byu.edu/covenant-compassion/remembering-redemption-avoiding-idolatry'
    quote: 'Note the reminder here that it is with the abundance with which they have been blessed by God that they, in turn, were to bless others.'
  - where: 'note 15:14 “Not sent away empty”'
    claim: 'Exodus 21:2 has no gift at release; Deuteronomy adds it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/21?lang=eng'
    quote: 'If thou buy an Hebrew servant, six years he shall serve: and in the seventh he shall go out free for nothing.'
  - where: 'note 15:14 “Not sent away empty”'
    claim: 'Exodus sets a daughter sold as a maidservant under separate terms'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/21?lang=eng'
    quote: 'And if a man sell his daughter to be a maidservant, she shall not go out as the menservants do.'
  - where: 'note 15:14 “Not sent away empty”'
    claim: 'Jeremiah 34 cites the law of release in words close to this chapter'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/34?lang=eng'
    quote: 'At the end of seven years let ye go every man his brother an Hebrew, which hath been sold unto thee; and when he hath served thee six years, thou shalt let him go free from thee'
  - where: christ
    claim: 'The open hand commanded in Deut. 15:7–8 is how God gives (Ps. 145:16)'
    key: lane-redemption
    url: 'https://rsc.byu.edu/covenant-compassion/remembering-redemption-avoiding-idolatry'
    quote: 'Note the language with which the psalmist praises God’s generosity: “Thou openest thine hand, and satisfiest the desire of every living thing” (145:16). This is exactly how the covenant people are asked to give'
  - where: christ
    claim: 'Psalm 145:16 wording'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/145?lang=eng'
    quote: 'Thou openest thine hand, and satisfiest the desire of every living thing.'
  - where: explore
    claim: 'Lane’s study reads Deuteronomy 15 as a whole'
    key: lane-redemption
    url: 'https://rsc.byu.edu/covenant-compassion/remembering-redemption-avoiding-idolatry'
    quote: 'I then show how covenant requirements, especially those described in Deuteronomy 15 regarding the Sabbatical year, were set to remind the Israelites that the land they owned and the wealth they had built ultimately belonged to God'
  - where: 'note 15:14 “Not sent away empty”'
    claim: 'Verse 18: a modern translation (ESV) reads “at half the cost of a hired worker”'
    key: lane-redemption
    url: 'https://rsc.byu.edu/covenant-compassion/remembering-redemption-avoiding-idolatry'
    quote: 'for at half the cost of a hired worker he has served you six years.'
