chapter: 26
claims:
  - where: when
    claim: 'Moses speaks in the plains of Moab in the fortieth year after the Exodus'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/1?lang=eng'
    quote: 'And it came to pass in the fortieth year, in the eleventh month, on the first day of the month, that Moses spake unto the children of Israel'
  - where: setting
    claim: 'Chapters 12–26 are a code of laws, the nucleus of the book, within the second discourse'
    key: bd-deuteronomy
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/deuteronomy?lang=eng'
    quote: 'The second discourse (Deut. 5–26) consists of two parts: (1) 5–11, the Ten Commandments and a practical exposition of them, (2) 12–26, a code of laws, which forms the nucleus of the whole book.'
  - where: setting
    claim: 'The third-year tithe passages (14:28–29; 26:12–15) frame the code'
    key: pierce-ger
    url: 'https://rsc.byu.edu/covenant-compassion/ger-pentateuch-book-mormon'
    quote: 'Instructions regarding the gēr and the third-year tithe notably frame the Deuteronomic Core (Deuteronomy 14:28–29; 26:12–15).'
  - where: setting
    claim: 'Verses 16–19 close the discourse, summing it up'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/26.htm'
    quote: 'At the close of his discourse, Moses sums up the whole in the earnest admonition that Israel would give the Lord its God occasion to fulfil the promised glorification of His people'
  - where: setting
    claim: 'Recitations of the Exodus put God’s acts in Egypt at the center of faith; Deut. 6, Deut. 26 and Joshua at Shechem are examples'
    key: brown-trust-lord
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/trust-lord'
    quote: 'among the recitative formulae which constitute some of the earliest Israelite devotional celebrations, we find a clear, ringing reference to God’s many acts in Egypt standing at the center of the expression of faith.'
  - where: setting
    claim: 'Joshua’s covenant ceremony at Shechem is another such recitation'
    key: brown-trust-lord
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/trust-lord'
    quote: 'The last example that I shall cite from a biblical celebration occurred at the important covenant ceremony conducted by Joshua at Shechem shortly before his death.'
  - where: thread
    claim: 'Bringing the firstfruits was a practical confession that the land was owed to the Lord'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/26.htm'
    quote: 'The fruit was the tangible proof that they were in possession of the land, and the presentation of the first of this fruit the practical confession that they were indebted to the Lord for the land.'
  - where: 'note 26:2 “What the basket of firstfruits confessed”'
    claim: 'The basket was carried on pilgrimage; the recitation retold what the pilgrimage reenacted'
    key: pierce-ger
    url: 'https://rsc.byu.edu/covenant-compassion/ger-pentateuch-book-mormon'
    quote: 'participants carried the basket of firstfruits on a pilgrimage journey from the farm to the sanctuary … including the Israelites’ wandering, sojourning, enslavement, deliverance, preservation, and finding of the promised land, most of which had been symbolically reenacted through the pilgrimage'
  - where: 'note 26:2 “What the basket of firstfruits confessed”'
    claim: 'The law of firstfruits was already given in Exodus 23:19'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/23?lang=eng'
    quote: 'The first of the firstfruits of thy land thou shalt bring into the house of the Lord thy God.'
  - where: 'note 26:5 “The wandering Aramean”'
    claim: 'The lexicon lists 26:5 under “perish” with a question mark and as perhaps “be lost, strayed”'
    key: bdb
    url: 'https://biblehub.com/hebrew/6.htm'
    quote: '1 perish, die, of individuals … (also Deuteronomy 26:5 ? compare below) … 3 be lost, strayed, asses 1 Samuel 9:3,20; sheep Jeremiah 50:6; … perhaps Deuteronomy 26:5.'
  - where: 'note 26:5 “The wandering Aramean”'
    claim: 'A modern translation reads “A wandering Aramean was my ancestor”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Deuteronomy+26&version=NRSVUE'
    quote: 'A wandering Aramean was my ancestor; he went down into Egypt and lived there as an alien, few in number'
  - where: 'note 26:5 “The wandering Aramean”'
    claim: 'The word means both wandering and perishing; the father is Jacob, called Aramean for his sojourn and his family there'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/26.htm'
    quote: 'אבד signifies not only going astray, wandering, but perishing, in danger of perishing … Jacob is referred to, for it was he who went down to Egypt in few men. … not only because of his long sojourn in Aramaea (Genesis 29-31), but also because he got his wives and children there'
  - where: 'note 26:5 “The wandering Aramean”'
    claim: 'Hosea says Jacob fled into Syria and served for a wife'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/12?lang=eng'
    quote: 'And Jacob fled into the country of Syria, and Israel served for a wife, and for a wife he kept sheep.'
  - where: 'note 26:6 “The worshipper tells the Exodus as his own”'
    claim: 'Each Israelite uttered this recitation at the altar with the firstfruits'
    key: brown-trust-lord
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/trust-lord'
    quote: 'One next recalls a second recitation, found in Deuteronomy chapter 26, which each Israelite was to utter at the altar when bringing the first fruits of the land as an offering to the Lord.'
  - where: 'note 26:6 “The worshipper tells the Exodus as his own”'
    claim: 'Such recitations are among the earliest devotional celebrations, with God’s acts in Egypt at their center'
    key: brown-trust-lord
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/trust-lord'
    quote: 'among the recitative formulae which constitute some of the earliest Israelite devotional celebrations, we find a clear, ringing reference to God’s many acts in Egypt standing at the center of the expression of faith.'
  - where: 'note 26:6 “The worshipper tells the Exodus as his own”'
    claim: 'Remembering past blessings, above all deliverance from Egypt, is a theme of Deuteronomy, illustrated by 26:5–9'
    key: dundas-ancient-israel
    url: 'https://rsc.byu.edu/mormons-record/ancient-israel'
    quote: 'The people should remember past blessings from God, especially their deliverance from bondage in Egypt'
  - where: 'note 26:6 “The worshipper tells the Exodus as his own”'
    claim: 'Exodus tells the affliction, the cry and the LORD who heard'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/2?lang=eng'
    quote: 'And God heard their groaning, and God remembered his covenant with Abraham, with Isaac, and with Jacob.'
  - where: 'note 26:11 “Bowing down, then rejoicing with the stranger”'
    claim: 'Bringing the firstfruits was tied to bowing down'
    key: lane-worship
    url: 'https://rsc.byu.edu/ascending-mountain-lord/worship-bowing-down-serving-lord'
    quote: 'In Deuteronomy we learn that bringing the firstfruits was tied to prostration or bowing down: “And now, behold, I have brought the firstfruits of the land'
  - where: 'note 26:11 “Bowing down, then rejoicing with the stranger”'
    claim: 'Only the household, Levites and refugees are listed; the stranger is made coheir of the land’s blessing'
    key: pierce-ger
    url: 'https://rsc.byu.edu/covenant-compassion/ger-pentateuch-book-mormon'
    quote: 'Unlike the harvest festivals, the list of participants only included the household and landless Levites and refugees, demonstrating that refugees played a special role in the celebration (26:11). The gēr were incorporated as coheirs of the divine blessings of the land and its produce'
  - where: 'note 26:11 “Bowing down, then rejoicing with the stranger”'
    claim: 'The Levite has no part nor inheritance'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/12?lang=eng'
    quote: 'the Levite that is within your gates; forasmuch as he hath no part nor inheritance with you'
  - where: 'note 26:14 “Kept from mourning and the dead”'
    claim: '“In my mourning” means in the uncleanness of mourning; giving for the dead means provisions for a house of mourning, which was unclean; not idolatry or grave offerings'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/26.htm'
    quote: 'mourning for the dead, equivalent to "in a mourning condition," i.e., in a state of legal (Levitical) uncleanness … most probably refers to the custom of sending provisions into a house of mourning, to prepare meals for the mourners'
  - where: 'note 26:14 “Kept from mourning and the dead”'
    claim: 'A house of mourning was unclean; no ground for idolatrous customs'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/26.htm'
    quote: 'consequently nothing could be carried into it of that which was sanctified. There is no good ground for thinking of idolatrous customs … nor is there any ground for understanding the words as referring to the later Jewish custom of putting provisions into the grave'
  - where: 'note 26:14 “Kept from mourning and the dead”'
    claim: 'Touching a dead body made a person unclean'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/19?lang=eng'
    quote: 'He that toucheth the dead body of any man shall be unclean seven days.'
  - where: 'note 26:17 “Avouched: two declarations of the covenant”'
    claim: 'The Hiphil of “say” in 26:17–18 means avow, avouch, literally cause to declare'
    key: bdb
    url: 'https://biblehub.com/hebrew/559.htm'
    quote: 'Hiph`il Perfect avow, avouch Deuteronomy 26:17 … Deuteronomy 26:18 … (literally cause to declare, i.e. through agency of Moses'
  - where: 'note 26:17 “Avouched: two declarations of the covenant”'
    claim: 'A modern translation renders it as agreements each side obtains'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Deuteronomy+26&version=NRSVUE'
    quote: 'Today you have obtained the Lord’s agreement: to be your God; … Today the Lord has obtained your agreement: to be his treasured people'
  - where: 'note 26:17 “Avouched: two declarations of the covenant”'
    claim: 'The verses are one of the finest statements of a covenant; the Lord avouched (promised) to make Israel holy'
    key: ot-manual-deuteronomy-17-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/deuteronomy-17-33-an-exhortation-to-obedience-part-2?lang=eng'
    quote: 'Moses gave one of the finest statements of a covenant found anywhere in scripture. Israel promised to keep the Lord’s commandments, and the Lord “avouched” (promised) to honor Israel and make of her a holy nation (v. 17).'
  - where: christ
    claim: 'Firstfruits in the law were the first of the harvest offered to God; in the New Testament the term describes resurrection'
    key: belnap-plainness
    url: 'https://rsc.byu.edu/jacob/words-plainness'
    quote: 'The term itself is biblical, found first in the legal codes of the Old Testament concerning the first items of a given harvest which were to be offered up to God … In the New Testament, the term is used to describe resurrection.'
  - where: christ
    claim: 'The Lord’s wrath is kindled against none save those who confess not His hand in all things'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/59?lang=eng'
    quote: 'And in nothing doth man offend God, or against none is his wrath kindled, save those who confess not his hand in all things, and obey not his commandments.'
  - where: christ
    claim: 'The earth is full, there is enough and to spare; the Lord prepared all things'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/104?lang=eng'
    quote: 'For the earth is full, and there is enough and to spare; yea, I prepared all things'
  - where: christ
    claim: 'Whoever takes of the abundance the Lord made is to impart his portion to the poor and the needy'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/104?lang=eng'
    quote: 'if any man shall take of the abundance which I have made, and impart not his portion, according to the law of my gospel, unto the poor and the needy'
  - where: 'note 26:5 “The wandering Aramean”'
    claim: 'The Church’s footnote to 26:5 ties “Aramean” to Abraham, who came from Aram to the land of promise'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/26?lang=eng'
    quote: 'Abraham migrated to Aram and from there to the land of promise.'
  - where: 'note 26:6 “The worshipper tells the Exodus as his own”'
    claim: 'The Church’s footnotes to 26:6–7 point to Exodus 1:11 and 2:23–25'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/26?lang=eng'
    quote: 'Ex. 2:23 (23–25)'
  - where: 'note 26:6 “The worshipper tells the Exodus as his own”'
    claim: 'Exodus tells of hard bondage'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/1?lang=eng'
    quote: 'And they made their lives bitter with hard bondage'
  - where: 'note 26:17 “Avouched: two declarations of the covenant”'
    claim: 'The Church’s footnote glosses “avouched” as declared, testified'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/26?lang=eng'
    quote: 'OR declared, testified.'
