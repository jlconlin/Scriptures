page: curse-into-blessing
claims:
  - where: 'opening'
    claim: 'The noun qelalah (curse) occurs in eleven verses of the book, including 21:23 (construct qilelat) and 23:5 (haqqelalah)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'כִּֽי־קִלְלַ֥ת'
  - where: 'opening'
    claim: 'Connection made by this page: 11:26–29, 27:15–26, 28:15–45, 30:1–7 and 33 set beside one another as one movement of the curse; no source treats them as a sequence'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/30?lang=eng'
    quote: 'when all these things are come upon thee, the blessing and the curse, which I have set before thee'
  - where: 'opening'
    claim: 'Moses sets “a blessing and a curse” before Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/11?lang=eng'
    quote: 'Behold, I set before you this day a blessing and a curse'
  - where: 'opening'
    claim: 'Moses’ last word is “the blessing” (33:1); after 30:19 none of the book’s curse words occurs (chapter 33 has no word for curse)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'וְ/זֹ֣את הַ/בְּרָכָ֗ה'
  - where: 'opening'
    claim: 'Paul quotes the hanged man as a curse (Gal. 3:13)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/gal/3?lang=eng'
    quote: 'Christ hath redeemed us from the curse of the law, being made a curse for us'
  - where: 'section “In the laws: the curse of God, and the curse turned”'
    claim: '21:23 reads in Hebrew “the curse of God” (qilelat ʾelohim), the book’s noun'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'כִּֽי־קִלְלַ֥ת'
  - where: 'section “In the laws: the curse of God, and the curse turned”'
    claim: '23:5 uses the same noun (haqqelalah); “turned” is hapak'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'הַ/קְּלָלָ֖ה לִ/בְרָכָ֑ה'
  - where: 'section “In the laws: the curse of God, and the curse turned”'
    claim: 'Balaam was bribed to curse Israel and the curse turned to blessing'
    key: bd-balaam
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/balaam?lang=eng'
    quote: 'bribed by Balak, king of Moab, to curse the Israelites'
  - where: 'section “In the laws: the curse of God, and the curse turned”'
    claim: 'Balaam: “the curse turned to blessing”'
    key: bd-balaam
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/balaam?lang=eng'
    quote: 'the curse turned to blessing'
  - where: 'section “In the laws: the curse of God, and the curse turned”'
    claim: 'Connection made by this page: 21:23 and 23:5 set beside each other by the shared noun qelalah, both name God (21:23 “of God”; 23:5 the LORD turns it)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'הַ/קְּלָלָ֖ה לִ/בְרָכָ֑ה'
  - where: 'section “In the laws: the curse of God, and the curse turned”'
    claim: 'Connection made by this page (21:23 half): “the curse of God”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/21?lang=eng'
    quote: 'for he that is hanged is accursed of God'
  - where: 'section “Spoken twelve times”'
    claim: '“Amen” (ʾamen) occurs twelve times in the book, once in each of 27:15–26'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'וְ/אָמַ֥ר כָּל־הָ/עָ֖ם אָמֵֽן'
  - where: 'section “Spoken twelve times”'
    claim: 'Chapter 27 records no sentence of blessing (27:12 names the tribes on Gerizim “to bless the people”)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/27?lang=eng'
    quote: 'These shall stand upon mount Gerizim to bless the people'
  - where: 'section “Spoken twelve times”'
    claim: 'The blessing’s words are in 28:3–6'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/28?lang=eng'
    quote: 'Blessed shalt thou be in the city, and blessed shalt thou be in the field.'
  - where: 'section “Come upon thee, and overtake thee”'
    claim: 'A curse is the application of divine law … a manifestation of God’s love and justice'
    key: gs-curse
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/curse-curses?lang=eng'
    quote: 'Curses are a manifestation of God''s divine love and justice.'
  - where: 'section “Come upon thee, and overtake thee”'
    claim: 'Definition of a curse in the Guide to the Scriptures'
    key: gs-curse
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/curse-curses?lang=eng'
    quote: 'a curse is the application of divine law that allows or brings judgments and their consequences upon a thing, person, or people primarily because of unrighteousness'
  - where: 'section “Come upon thee, and overtake thee”'
    claim: 'The “curses” of 30:7 is ʾalah (H423), not qelalah; the oath-curse of chapter 29'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'כָּל־הָ/אָל֖וֹת'
  - where: 'section “Come upon thee, and overtake thee”'
    claim: 'Connection made by this page (30:1 half): 30:1 repeats 11:26’s pair in the same words, come'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/11?lang=eng'
    quote: 'a blessing and a curse'
  - where: 'section “The last word”'
    claim: 'Chapter 33 has no word for curse (33:1 “the blessing”)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'אֲשֶׁ֨ר בֵּרַ֥ךְ מֹשֶׁ֛ה'
  - where: 'section “The last word”'
    claim: 'Connection made by this page: chapter 27’s curse, given words with no recorded blessing, set beside chapter 33’s blessing, given words with no word for curse'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/33?lang=eng'
    quote: 'Happy art thou, O Israel: who is like unto thee, O people saved by the LORD'
  - where: 'section “Made a curse for us”'
    claim: 'The Church’s footnotes at Deut. 21:23 “tree” and “accursed” point to Gal. 3:13'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/21?lang=eng'
    quote: 'Gal. 3:13'
  - where: 'section “Made a curse for us”'
    claim: 'Gal. 3:13–14 text'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/gal/3?lang=eng'
    quote: 'That the blessing of Abraham might come on the Gentiles through Jesus Christ'
  - where: 'section “Made a curse for us”'
    claim: 'The Lord may remove curses by faith in Christ'
    key: gs-curse
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/curse-curses?lang=eng'
    quote: 'The Lord may remove curses because of the individual''s or people''s faith in Jesus Christ and obedience to the laws and ordinances of the gospel'
  - where: 'section “Made a curse for us”'
    claim: 'Connection made by this page: Deut. 23:5 set beside Gal. 3:13–14 and John 3:16 as the same act, a curse turned to blessing because He loved'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/3?lang=eng'
    quote: 'For God so loved the world, that he gave his only begotten Son'
  - where: 'section “Made a curse for us”'
    claim: 'Footnote at “loved” in Deut. 23:5 is headed Topical Guide “God, Love of”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/23?lang=eng'
    quote: 'God, Love of'
  - where: 'section “All things for your good”'
    claim: 'Gal. 3:10: those of the works of the law are under the curse'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/gal/3?lang=eng'
    quote: 'For as many as are of the works of the law are under the curse'
  - where: 'section “All things for your good”'
    claim: 'Footnote at Deut. 23:5 “blessing” is D&C 90:24'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/23?lang=eng'
    quote: 'D&C 90:24'
  - where: 'section “All things for your good”'
    claim: 'D&C 90:24 text'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/90?lang=eng'
    quote: 'all things shall work together for your good, if ye walk uprightly and remember the covenant'
  - where: 'section “All things for your good”'
    claim: 'Footnote on “all” in D&C 90:24 returns to Deut. 23:5 and adds Rom. 8:28'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/90?lang=eng'
    quote: 'Deut. 23:5'
  - where: 'section “All things for your good”'
    claim: 'Rom. 8:28 text'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/8?lang=eng'
    quote: 'all things work together for good to them that love God'
  - where: 'section “Made a curse for us”'
    claim: 'Footnote at “loved” in John 3:16 includes Topical Guide “God, Love of”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/3?lang=eng'
    quote: 'God, Love of'
  - where: 'section “The last word”'
    claim: 'Deut. 31:17 still foretells many evils and troubles befalling Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/31?lang=eng'
    quote: 'many evils and troubles shall befall them'
  - where: 'section “All things for your good”'
    claim: 'Gal. 3:11: no man is justified by the law in the sight of God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/gal/3?lang=eng'
    quote: 'no man is justified by the law in the sight of God'
