page: let-it-suffice-thee
claims:
  - where: 'opening'
    claim: '“Hearkened” (9:19; 10:10) and “hear” (3:26) are one Hebrew verb, H8085, negated in 3:26'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'שָׁמַ֖ע'
  - where: 'opening'
    claim: 'The same verb H8085 in 9:19 (“hearkened”)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'וַ/יִּשְׁמַ֤ע'
  - where: 'opening'
    claim: 'The same verb H8085 in 10:10 (“hearkened”)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'וַ/יִּשְׁמַ֨ע'
  - where: 'opening'
    claim: 'Connection made by this page: Deut. 9:19; 10:10; 3:23–27; 34:1–5 and Matt. 17:3 read as one sequence ending with Moses on the mount with Jesus, and set beside Gethsemane (Matt. 26:39)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/17?lang=eng'
    quote: 'And, behold, there appeared unto them Moses and Elias talking with him.'
  - where: 'section “Refused, with a reason”'
    claim: '“Let it suffice thee” (3:26) is H7227a rav + lakh (singular), the same rav as “long enough” at 1:6 and 2:3, where it is plural lakhem'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'לָ/כֶ֥ם'
  - where: 'section “Refused, with a reason”'
    claim: 'Connection made by this page: rav lakh at 3:26 set beside rav lakhem at 1:6 and 2:3, the word that sent Israel on now stops Moses'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'לָ֔/ךְ'
  - where: 'section “Given to see, and on the mount”'
    claim: 'Scripture Helps: Moses’s actions did not disqualify him from all future responsibilities and blessings'
    key: scripture-helps-num
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/17-numbers-11-14-20-24-27?lang=eng'
    quote: 'Moses’s actions did not disqualify him from all future responsibilities and blessings.'
  - where: 'section “Given to see, and on the mount”'
    claim: 'Come, Follow Me: Moses entered the promised land God has prepared for all who follow Him'
    key: cfm-ot-2026-20
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/20?lang=eng'
    quote: 'So although Moses never set foot in the “land flowing with milk and honey” (Exodus 3:8), because of his faith and faithfulness, he did enter the promised land that God has prepared for all those who follow Him.'
  - where: 'section “Given to see, and on the mount”'
    claim: 'Connection made by this page: Num. 20:12 “ye shall not bring this congregation into the land” set beside D&C 110:11 “the keys of the gathering of Israel”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/110?lang=eng'
    quote: 'Moses appeared before us, and committed unto us the keys of the gathering of Israel from the four parts of the earth'
  - where: 'section “Given to see, and on the mount”'
    claim: 'Num. 20:12 words set beside D&C 110:11'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/20?lang=eng'
    quote: 'therefore ye shall not bring this congregation into the land which I have given them'
  - where: 'section “The cup not removed”'
    claim: 'Oaks: the Father denied the Son’s plea, yet his prayer was answered'
    key: oaks-1994-faith
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1994/04/faith-in-the-lord-jesus-christ?lang=eng'
    quote: 'The Father’s answer was to deny the plea of his Only Begotten Son. The Atonement had to be worked out by that lamb without blemish. But though the Son’s request was denied, his prayer was answered.'
  - where: 'section “The cup not removed”'
    claim: 'Connection made by this page: Deut. 3:26 “would not hear me” set beside Heb. 5:7 “was heard” and Luke 22:43, the King James word only; refused, and something given in its place'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/5?lang=eng'
    quote: 'and was heard in that he feared'
  - where: 'section “The cup not removed”'
    claim: 'Connection made by this page: the LORD of Deut. 3:26 and the Son of Matt. 26:39–44 set beside each other as the same person in two prayers (3 Ne. 15:5 “I am he that gave the law”)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/15?lang=eng'
    quote: 'Behold, I am he that gave the law, and I am he who covenanted with my people Israel'
  - where: 'section “Sufficient for thee”'
    claim: 'Oaks: the Lord declined to heal Paul'
    key: oaks-2006-heals
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2006/10/he-heals-the-heavy-laden?lang=eng'
    quote: 'the Lord declined to heal him'
  - where: 'section “Sufficient for thee”'
    claim: 'Oaks: sometimes we are healed by being given strength, understanding or patience to bear burdens'
    key: oaks-2006-heals
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2006/10/he-heals-the-heavy-laden?lang=eng'
    quote: 'But sometimes we are “healed” by being given strength or understanding or patience to bear the burdens placed upon us.'
  - where: 'section “Sufficient for thee”'
    claim: 'Hales: righteous desires are sometimes not granted in this life'
    key: hales-2019-answers
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2019/04/13hales?lang=eng'
    quote: 'And sometimes our righteous desires are not granted in this life.'
  - where: 'section “Sufficient for thee”'
    claim: 'Hales: God answers prayers perfectly, according to His infinite wisdom'
    key: hales-2019-answers
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2019/04/13hales?lang=eng'
    quote: 'He answers our prayers perfectly, according to His infinite wisdom'
  - where: 'section “Sufficient for thee”'
    claim: 'Faust: follow the pattern of the Gethsemane prayer'
    key: faust-2002-lifeline
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2002/04/the-lifeline-of-prayer?lang=eng'
    quote: 'An important element of all of our prayers might well be to follow the pattern of that prayer in Gethsemane'
  - where: 'section “Sufficient for thee”'
    claim: 'Connection made by this page: “besought” at Deut. 3:23 and 2 Cor. 12:8, the King James word'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/2-cor/12?lang=eng'
    quote: 'For this thing I besought the Lord thrice, that it might depart from me.'
  - where: 'section “Sufficient for thee”'
    claim: 'D&C 122 was the word of the Lord to Joseph Smith while a prisoner in the jail at Liberty'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/122?lang=eng'
    quote: 'The word of the Lord to Joseph Smith the Prophet, while a prisoner in the jail at Liberty, Missouri.'
