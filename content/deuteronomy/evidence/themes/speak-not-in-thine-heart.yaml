page: speak-not-in-thine-heart
claims:
  - where: 'opening'
    claim: 'The clause “say in thine heart” (ʾamar + bilĕbāb-ekā) stands at 7:17'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'תֹאמַר֙'
  - where: 'opening'
    claim: 'Same clause at 8:17 (perfect with waw)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'וְ/אָמַרְתָּ֖'
  - where: 'opening'
    claim: 'Same clause at 9:4, as the negative command “speak not” (ʾal + jussive)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'אַל'
  - where: 'opening'
    claim: 'Same clause at 18:21'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'תֹאמַ֖ר'
  - where: 'opening'
    claim: 'Connection made by this page: 7:17, 8:17, 9:4 and 18:21 read as one sequence, each with an answer from outside the heart, only 9:4 forbidden outright in the Hebrew, closing at 30:12–14'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/9?lang=eng'
    quote: 'Speak not thou in thine heart, after that the LORD thy God hath cast them out from before thee'
  - where: 'section “If thou shalt say in thine heart”'
    claim: '7:18 and 8:18 answer with the same verb, zakar (“remember”)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'זָכֹ֣ר'
  - where: 'section “If thou shalt say in thine heart”'
    claim: 'The verb zakar at 8:18'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'וְ/זָֽכַרְתָּ֙'
  - where: 'section “If thou shalt say in thine heart”'
    claim: 'Connection made by this page: 7:17 and 8:17 set beside each other by the shared clause and the shared answer “remember”; what the heart speaks of moves from the enemy to itself'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/8?lang=eng'
    quote: 'And thou say in thine heart, My power and the might of mine hand hath gotten me this wealth.'
  - where: 'section “If thou shalt say in thine heart”'
    claim: '18:21 is a question spoken as “we”, answered in 18:22 by a test (plain words of the verses)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/18?lang=eng'
    quote: 'And if thou say in thine heart, How shall we know the word which the LORD hath not spoken?'
  - where: 'section “Speak not thou in thine heart”'
    claim: '9:4 is the negative command ʾal tōʾmar; 7:17 and 18:21 are “if thou say”, 8:17 “and thou say”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'אַל'
  - where: 'section “Speak not thou in thine heart”'
    claim: 'The noun ṣedaqah (H6666) at 9:4, “my” (bĕṣidqātî); six occurrences in the book, three at 9:4–6'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'בְּ/צִדְקָתִ/י֙'
  - where: 'section “Speak not thou in thine heart”'
    claim: 'ṣedaqah at 9:5, “thy”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'בְ/צִדְקָתְ/ךָ֗'
  - where: 'section “Speak not thou in thine heart”'
    claim: 'ṣedaqah at 9:6, “thy”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'בְ/צִדְקָֽתְ/ךָ֙'
  - where: 'section “Speak not thou in thine heart”'
    claim: 'ṣedaqah at 6:25, “our righteousness”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'וּ/צְדָקָ֖ה'
  - where: 'section “Speak not thou in thine heart”'
    claim: 'Connection made by this page: across 7:17, 8:17, 9:4 the heart''s sentence moves from the enemy to Israel''s hand to Israel''s righteousness, the last the only prohibition in the Hebrew'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/9?lang=eng'
    quote: 'Not for thy righteousness, or for the uprightness of thine heart, dost thou go to possess their land'
  - where: 'section “In thy mouth, and in thy heart”'
    claim: 'Deut. 29:19 has “bless himself” (hitbarek) with “in his heart”, third person, not the clause “say in thine heart”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'וְ/הִתְבָּרֵ֨ךְ'
  - where: 'section “In thy mouth, and in thy heart”'
    claim: 'Connection made by this page: 30:12–14 set beside the four sayings by their shape, something Israel might “say” and an answer'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/30?lang=eng'
    quote: 'But the word is very nigh unto thee, in thy mouth, and in thy heart, that thou mayest do it.'
  - where: 'section “The righteousness of faith speaks”'
    claim: 'Rom. 10:6 in the interlinear: “Say not in thine heart”'
    key: greek-nt
    url: 'https://biblehub.com/interlinear/romans/10-6.htm'
    quote: 'Romans 10:6 Interlinear: But the righteousness which is of faith speaketh on this wise, Say not in thine heart'
  - where: 'section “The righteousness of faith speaks”'
    claim: 'Rom. 10:6 Greek: εἴπῃς (“You should say”)'
    key: greek-nt
    url: 'https://biblehub.com/interlinear/romans/10-6.htm'
    quote: 'εἴπῃς'
  - where: 'section “The righteousness of faith speaks”'
    claim: 'Septuagint Deut. 9:4 has the same clause'
    key: swete-lxx-deut
    url: 'https://biblehub.com/sepd/deuteronomy/9.htm'
    quote: 'μὴ εἴπῃς ἐν τῇ καρδίᾳ σου'
  - where: 'section “The righteousness of faith speaks”'
    claim: 'Septuagint Deut. 8:17 has the same clause'
    key: swete-lxx-deut
    url: 'https://biblehub.com/sepd/deuteronomy/8.htm'
    quote: 'μὴ εἴπῃς ἐν τῇ καρδίᾳ σου'
  - where: 'section “The righteousness of faith speaks”'
    claim: 'Septuagint Deut. 30:12 has “λέγων Τίς ἀναβήσεται”, not the clause'
    key: swete-lxx-deut
    url: 'https://biblehub.com/sepd/deuteronomy/30.htm'
    quote: 'οὐκ ἐν τῷ οὐρανῷ ἄνω ἐστὶν λέγων Τίς ἀναβήσεται ἡμῖν εἰς τὸν οὐρανὸν'
  - where: 'section “The righteousness of faith speaks”'
    claim: 'Connection made by this page: Rom. 10:6''s opening clause is letter for letter the Septuagint''s clause at Deut. 9:4 and 8:17, not its wording at 30:12; Moses forbade the heart''s claim of righteousness, the righteousness of faith forbids the thought that Christ must be brought down or up'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/10?lang=eng'
    quote: 'Say not in thine heart, Who shall ascend into heaven?'
  - where: 'section “The righteousness of faith speaks”'
    claim: 'Rom. 10:6–8 is listed with Deuteronomy 9:4; 30:12–14'
    key: ludlow-paul-ot
    url: 'https://rsc.byu.edu/how-new-testament-came-be/pauls-use-old-testament-scripture'
    quote: '(see Romans 10:6–8; Deuteronomy 9:4; 30:12–14)'
  - where: 'section “The righteousness of faith speaks”'
    claim: 'The Church''s footnote at Rom. 10:4 “end” is 2 Ne. 2:7'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/10?lang=eng'
    quote: '“end”: 2 Ne. 2:7 (7–10)'
  - where: 'section “The righteousness of faith speaks”'
    claim: 'The Church''s footnote at 2 Ne. 2:7 “ends” is Rom. 10:4'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/2?lang=eng'
    quote: '“ends”: Rom. 10:4'
  - where: 'section “The same sentence now”'
    claim: 'Alma 38:9, no other way or means than in and through Christ'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/38?lang=eng'
    quote: 'there is no other way or means whereby man can be saved, only in and through Christ'
  - where: 'section “The same sentence now”'
    claim: 'Alma 38:11, two verses later'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/38?lang=eng'
    quote: 'See that ye are not lifted up unto pride; yea, see that ye do not boast in your own wisdom, nor of your much strength.'
  - where: 'section “The same sentence now”'
    claim: 'Elder Renlund on what remembering God''s goodness does'
    key: renlund-goodness-greatness
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2020/04/26renlund?lang=eng'
    quote: 'By reflecting on Their compassion, we become more humble, prayerful, and steadfast.'
  - where: 'section “The same sentence now”'
    claim: 'Bible Dictionary: through faith in the Atonement people receive strength to do good works'
    key: bd-grace
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/grace?lang=eng'
    quote: 'receive strength and assistance to do good works that they otherwise would not be able to maintain if left to their own means'
  - where: 'section “The same sentence now”'
    claim: 'Bible Dictionary: grace and total effort'
    key: bd-grace
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/grace?lang=eng'
    quote: 'grace cannot suffice without total effort on the part of the recipient'
