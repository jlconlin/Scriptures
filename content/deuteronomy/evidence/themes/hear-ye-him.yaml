page: hear-ye-him
claims:
  - where: opening
    claim: 'The Church''s footnote at Matt. 17:6 “afraid” reads Ex. 3:6; Deut. 5:5'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/17?lang=eng'
    quote: 'Deut. 5:5'
  - where: opening
    claim: 'The Church''s footnote at John 12:50 “speak” reads Deut. 18:18'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/12?lang=eng'
    quote: 'Deut. 18:18'
  - where: opening
    claim: 'Connection made by this page: Deut. 4:12–36, 5:22–29, 18:15–19 and 34:10 read as one sequence'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/5?lang=eng'
    quote: 'they have well said all that they have spoken'
  - where: 'section “A voice, and no form”'
    claim: 'The Church''s footnote at Deut. 4:33 “voice” points to 3 Ne. 11:3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/4?lang=eng'
    quote: '3 Ne. 11:3'
  - where: 'section “Speak thou unto us”'
    claim: 'The Church''s footnote at Deut. 5:27 “speak” is D&C 1:38'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/5?lang=eng'
    quote: 'D&C 1:38'
  - where: 'section “My words in his mouth”'
    claim: 'Connection made by this page: Deut. 18:18–19 set beside Deut. 5:24–27, the two voices one again for the hearer'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/18?lang=eng'
    quote: 'whosoever will not hearken unto my words which he shall speak in my name, I will require it of him'
  - where: 'section “My words in his mouth”'
    claim: 'Deut. 5:27 “we will hear it” is a form of Hebrew shamaʿ (lemma 8085)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'וְ/שָׁמַ֥עְנוּ'
  - where: 'section “My words in his mouth”'
    claim: 'Deut. 18:15 “ye shall hearken” is a form of Hebrew shamaʿ (lemma 8085)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'תִּשְׁמָעֽוּ/ן'
  - where: 'section “My words in his mouth”'
    claim: 'Deut. 18:19 “will not hearken” is a form of Hebrew shamaʿ (lemma 8085)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'יִשְׁמַע֙'
  - where: 'section “My words in his mouth”'
    claim: 'Jesus Christ declared Himself the fulfillment of Moses''s prophecy'
    key: scripture-helps-deut
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/18-deuteronomy-6-8-15-18-29-30-34?lang=eng'
    quote: 'After His Resurrection, Jesus Christ declared that He was the fulfillment of Moses’s prophecy.'
  - where: 'section “None like Moses”'
    claim: 'The Church''s footnote at Deut. 34:10 “prophet” is Deut. 18:15'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/34?lang=eng'
    quote: 'Deut. 18:15'
  - where: 'section “Hear ye him”'
    claim: 'Footnote at Matt. 17:6 “afraid” is Deut. 5:5'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/17?lang=eng'
    quote: 'Deut. 5:5'
  - where: 'section “Hear ye him”'
    claim: 'Connection made by this page: Matt. 17:5–6 set beside Deut. 5:22 the two scenes matching (voice from a cloud on a mountain, hearers afraid, Moses present); the footnote supplies the fear, the rest is the page''s'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/5?lang=eng'
    quote: 'out of the midst of the fire, of the cloud, and of the thick darkness'
  - where: 'section “Hear ye him”'
    claim: 'Footnote at John 12:50 “speak” is Deut. 18:18'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/12?lang=eng'
    quote: 'Deut. 18:18'
  - where: 'section “Hear ye him”'
    claim: 'Connection made by this page: John 12:49–50, footnoted to Deut. 18:18, set beside the request of Deut. 5:27: God''s words in the mouth of one of their brethren, how the Son describes His own speaking'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/12?lang=eng'
    quote: 'whatsoever I speak therefore, even as the Father said unto me, so I speak'
  - where: 'section “Hear ye him”'
    claim: 'Footnote at 3 Ne. 11:3 “voice” is Deut. 4:33'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/11?lang=eng'
    quote: 'Deut. 4:33'
  - where: 'section “Hearing Him now”'
    claim: 'D&C 1:14 and 1:38 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/1?lang=eng'
    quote: 'they who will not hear the voice of the Lord, neither the voice of his servants'
  - where: 'section “Hearing Him now”'
    claim: 'Definition of hearken'
    key: gs-hearken
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/hearken?lang=eng'
    quote: 'To hear and obey the voice or teachings of the Lord.'
  - where: 'section “Hearing Him now”'
    claim: 'President Nelson on hearken'
    key: nelson-hear-him
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2020/04/45nelson?lang=eng'
    quote: 'To hearken means to “hear Him”—to hear what the Savior says and then to heed His counsel.'
  - where: 'section “Hearing Him now”'
    claim: 'President Nelson on fear and on where He is heard'
    key: nelson-hear-him
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2020/04/45nelson?lang=eng'
    quote: 'when we are surrounded by uncertainty and fear, what will help us the very most is to hear His Son.'
  - where: 'section “Hearing Him now”'
    claim: 'President Nelson: we hear Him through prophets'
    key: nelson-hear-him
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2020/04/45nelson?lang=eng'
    quote: 'we hear Him as we heed the words of prophets, seers, and revelators.'
  - where: 'section “Hearing Him now”'
    claim: 'Connection made by this page: Deut. 5:27 “hear it, and do it” set beside President Nelson''s definition of hearken; the talk does not cite Deuteronomy'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/5?lang=eng'
    quote: 'and we will hear it, and do it'
  - where: 'section “My words in his mouth”'
    claim: 'Connection made by this page: 5:27 “we will hear” set beside 18:15, 19 “hearken”, one verb'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/18?lang=eng'
    quote: 'unto him ye shall hearken'
  - where: 'section “My words in his mouth”'
    claim: 'šamaʿ (H8085) is the book''s everyday word for hearing: 90 times in 81 verses of Deuteronomy'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'יִשְׁמַע֙'
  - where: 'section “Hear ye him”'
    claim: 'Matt. 17:1 names the mountain; Matt. 17:3 has Moses present'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/17?lang=eng'
    quote: 'bringeth them up into an high mountain apart'
  - where: 'section “Hear ye him”'
    claim: 'The LORD who spoke at Horeb is Jehovah, the premortal Christ'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/4?lang=eng'
    quote: 'The LORD spake unto you out of the midst of the fire'
