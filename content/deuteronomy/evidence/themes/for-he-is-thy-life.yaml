page: for-he-is-thy-life
claims:
  - where: 'opening'
    claim: 'The verb “circumcise” (mul) stands in the book at Deut. 10:16 (imperative) ...'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'וּ/מַלְתֶּ֕ם'
  - where: 'opening'
    claim: '... and at Deut. 30:6, with the LORD as subject; only these two places'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'וּ/מָ֨ל'
  - where: 'opening'
    claim: 'Deut. 30:6 ends with the noun “thy life” (ḥayyekha), rendered in the KJV “that thou mayest live”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'חַיֶּֽי/ךָ'
  - where: 'opening'
    claim: 'Deut. 30:20 has the same noun, with “he” as subject'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'חַיֶּ֨י/ךָ֙'
  - where: 'opening'
    claim: 'Connection made by this page: Deut. 5:29, 10:16, 29:4 and 30:6 read as one sequence (wished for, commanded, not given, given)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/5?lang=eng'
    quote: 'O that there were such an heart in them'
  - where: 'section “Wished for”'
    claim: '“O that” in Deut. 5:29 is mi yitten, literally “who will give” (mi, “who”)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'מִֽי'
  - where: 'section “Wished for”'
    claim: '“O that” in Deut. 5:29 is mi yitten; yitten is a form of the verb natan, “give”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'יִתֵּ֡ן'
  - where: 'section “Commanded”'
    claim: 'Deut. 6:5 is the central and greatest commandment, and Moses reiterates it at 30:6, 10, 16 and 20'
    key: muhlestein-love-neighbor
    url: 'https://rsc.byu.edu/covenant-compassion/covenantal-command'
    quote: 'the central and greatest commandment within the covenantal laws'
  - where: 'section “Commanded”'
    claim: 'Deut. 10:16 is an imperative (“and you shall circumcise”), Israel the subject'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'וּ/מַלְתֶּ֕ם'
  - where: 'section “Not given”'
    claim: 'The noun in Deut. 29:4 is lev (H3820), not levav'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'לֵב֙'
  - where: 'section “Not given”'
    claim: 'Deut. 5:29 and 30:6 use levav (H3824)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'לְבָבְ/ךָ֖'
  - where: 'section “Not given”'
    claim: 'Connection made by this page: Deut. 5:29 (the heart wished for at Horeb) set beside Deut. 29:4 (the LORD has not given an heart, unto this day), by the two verses plain words'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/29?lang=eng'
    quote: 'Yet the LORD hath not given you an heart to perceive'
  - where: 'section “Given”'
    claim: 'A circumcised heart conveys a change in their nature'
    key: scripture-helps-deut
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/18-deuteronomy-6-8-15-18-29-30-34?lang=eng'
    quote: 'The imagery of a circumcised heart conveys the idea that one’s covenant with the Lord has become a fundamental part of them and that they have experienced a change in their nature.'
  - where: 'section “Given”'
    claim: 'The manual’s endnote joins Deut. 30:6 to 10:16, Jer. 4:4 and 31:33'
    key: scripture-helps-deut
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/18-deuteronomy-6-8-15-18-29-30-34?lang=eng'
    quote: 'See Deuteronomy 10:16; Jeremiah 4:4; 31:33.'
  - where: 'section “Given”'
    claim: '“That ye may live” in 4:1 is the verb (ḥayah)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'תִּֽחְי֗וּ'
  - where: 'section “Given”'
    claim: 'The same verb at 8:1'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'תִּֽחְי֜וּ/ן'
  - where: 'section “Given”'
    claim: 'The same verb at 30:16'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'וְ/חָיִ֣יתָ'
  - where: 'section “Given”'
    claim: 'The same verb at 30:19'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'תִּחְיֶ֖ה'
  - where: 'section “Given”'
    claim: 'The same verb clause at 5:33'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'תִּֽחְיוּ/ן'
  - where: 'section “Given”'
    claim: 'The same verb clause at 16:20'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'תִּֽחְיֶה'
  - where: 'section “Given”'
    claim: 'Deut. 30:6 ends with the noun “thy life” (lemaʿan ḥayyekha), not the verb'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'חַיֶּֽי/ךָ'
  - where: 'section “He is thy life”'
    claim: 'Deut. 30:20 “he is thy life”: ki hu ḥayyekha, the noun of 30:6 with “he” as subject'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'כִּ֣י'
  - where: 'section “He is thy life”'
    claim: '... with the pronoun hu (“he”)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'ה֤וּא'
  - where: 'section “He is thy life”'
    claim: '... and the noun ḥayyekha'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'חַיֶּ֨י/ךָ֙'
  - where: 'section “He is thy life”'
    claim: 'Connection made by this page: Deut. 30:6 “for thy life” (lemaʿan ḥayyekha) beside 30:20 “he is thy life” (ki hu ḥayyekha), the same noun'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/30?lang=eng'
    quote: 'for he is thy life, and the length of thy days'
  - where: 'section “He is thy life”'
    claim: 'The noun also stands at 4:9 (“all the days of thy life”)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'חַיֶּ֑י/ךָ'
  - where: 'section “He is thy life”'
    claim: '... and at 6:2'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'חַיֶּ֑י/ךָ'
  - where: 'section “He is thy life”'
    claim: '... and at 16:3'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'חַיֶּֽי/ךָ'
  - where: 'section “He is thy life”'
    claim: 'The noun also stands at 28:66 (twice)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'בְּ/חַיֶּֽי/ךָ'
  - where: 'section “He is thy life”'
    claim: 'The noun stands in the plural at 32:47 (ḥayyekhem), “it is your life”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'חַיֵּי/כֶ֑ם'
  - where: 'section “He is thy life”'
    claim: 'Deut. 28:66 and 32:47 in the KJV'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/32?lang=eng'
    quote: 'because it is your life'
  - where: 'section “He is thy life”'
    claim: 'The Church’s footnote at Deut. 30:20 “life” reads Acts 17:28 and D&C 88:13'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/30?lang=eng'
    quote: 'Acts 17:28; D&C 88:13'
  - where: 'section “He is thy life”'
    claim: 'Deut. 4:4 has the adjective “cleaving” (davek), same root as the verb “cleave” (davaq) at 30:20'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'הַ/דְּבֵקִ֔ים'
  - where: 'section “He is thy life”'
    claim: '... the verb davaq at 30:20'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'וּ/לְ/דָבְקָה'
  - where: 'section “He is thy life”'
    claim: '“Alive” at 4:4 (ḥayyim) is the lexeme (H2416) of “thy life”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'חַיִּ֥ים'
  - where: 'section “He is thy life”'
    claim: 'Connection made by this page: Deut. 4:4 and 30:20 set beside each other by the root dvq (cleave) and ḥay (alive, life); cleaving and being alive as act and outcome in 4:4, cleaving and “he is thy life” in 30:20'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/4?lang=eng'
    quote: 'ye that did cleave unto the LORD your God are alive every one of you this day'
  - where: 'section “The heart He changes, the life He is”'
    claim: 'Being born again is to have the Spirit of the Lord cause a mighty change in a person’s heart'
    key: gs-born-again
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/born-again-born-of-god?lang=eng'
    quote: 'To have the Spirit of the Lord cause a mighty change in a person’s heart'
  - where: 'section “The heart He changes, the life He is”'
    claim: 'Benjamin’s people: the Spirit has wrought a mighty change in their hearts'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/5?lang=eng'
    quote: 'which has wrought a mighty change in us, or in our hearts'
  - where: 'section “The heart He changes, the life He is”'
    claim: 'Mosiah 5:7: hearts changed through faith on his name'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/5?lang=eng'
    quote: 'your hearts are changed through faith on his name'
  - where: 'section “The heart He changes, the life He is”'
    claim: 'Connection made by this page: Deut. 30:6 “the LORD thy God will circumcise” beside Col. 2:11 “circumcision made without hands… the circumcision of Christ”, each naming an agent other than the one circumcised'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/col/2?lang=eng'
    quote: 'the circumcision made without hands'
  - where: 'section “The heart a disciple is given”'
    claim: 'Mormon: pray with all the energy of heart to be filled with this love, which he hath bestowed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/moro/7?lang=eng'
    quote: 'pray unto the Father with all the energy of heart, that ye may be filled with this love, which he hath bestowed upon all who are true followers of his Son'
  - where: 'section “The heart a disciple is given”'
    claim: 'Connection made by this page: Deut. 30:6 “to love… with all thine heart” (love commanded, the LORD circumcising) beside Moro. 7:48 “this love, which he hath bestowed” (love bestowed)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/moro/7?lang=eng'
    quote: 'filled with this love, which he hath bestowed'
  - where: 'section “The heart a disciple is given”'
    claim: 'God commands us to love Him because of what He knows it will do for us'
    key: christofferson-first-commandment
    url: 'https://www.churchofjesuschrist.org/study/liahona/2023/02/digital-only/the-first-commandment-first?lang=eng'
    quote: 'God commands us to love Him because of what He knows it will do for us.'
  - where: 'section “The heart a disciple is given”'
    claim: 'The Church’s footnote at Deut. 30:15 “life” cites 2 Ne. 2:27 (free to choose liberty and eternal life through the great Mediator)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/30?lang=eng'
    quote: '2 Ne. 2:27'
