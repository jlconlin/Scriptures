chapter: 1
claims:
  # ---------- when / setting / thread ----------
  - where: 'when'
    claim: 'Moses spoke in the fortieth year, eleventh month, first day, in the land of Moab'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/1?lang=eng'
    quote: 'And it came to pass in the fortieth year, in the eleventh month, on the first day of the month, that Moses spake unto the children of Israel'
  - where: 'setting'
    claim: 'The Hebrew places the speech east of the Jordan, in the Arabah, the floor of the rift valley'
    key: ot-minute-deut-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1'
    quote: 'the Hebrew indicates the location of Moses’s speech to be east of the Jordan in what is known as the Arabah, or the floor of the Great Rift Valley.'
  - where: 'setting'
    claim: 'The Exodus generation had largely died; the hearers were children or unborn at Sinai'
    key: ot-minute-deut-rappleye
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1-6-8-15-18-29-30-34'
    quote: 'In that time, the original Exodus generation had largely passed away, and those about to enter the land had either been children or not yet born when God made His covenant with Israel at Mount Sinai.'
  - where: 'setting'
    claim: 'The book holds three discourses of Moses in the plains of Moab; the first, 1–4, is introductory; the name means repetition of the law'
    key: bd-deuteronomy
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/deuteronomy?lang=eng'
    quote: 'The word means “repetition of the law.” The book contains the three last discourses of Moses delivered in the plains of Moab just before his death (translation). The first discourse is found in Deut. 1–4 and is introductory.'
  - where: 'setting'
    claim: 'The name is Greek, deutero “second” and nomos “law,” taken from the Septuagint'
    key: ot-manual-dt-1-16
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/deuteronomy-1-16-an-exhortation-to-obedience-part-1?lang=eng'
    quote: 'Deuteronomy is a title formed from the two Greek words deutero, “second,” and nomos, “law.” Thus, the title means “the second law,” or “the repetition of the law”'
  - where: 'setting'
    claim: 'The title came from the Septuagint; the Hebrew name is the first words, “these be the words”'
    key: ot-manual-dt-1-16
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/deuteronomy-1-16-an-exhortation-to-obedience-part-1?lang=eng'
    quote: 'The Christian world adopted this descriptive title from the Septuagint … rather than the Jewish name for the book, Eileh Hadvareem, which is the first two words of the book in Hebrew (translated as “these be the words”).'
  - where: 'setting'
    claim: 'Latter-day revelation confirms Moses as author of the five books; scribes left traces, the account of his death added later'
    key: bd-pentateuch
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/pentateuch?lang=eng'
    quote: 'It is also evident that scribes and copyists have left their traces upon the Pentateuch as we have it today; for example, the explanation of Moses’ supposed death (Deut. 34:5–12) was surely added by a later hand.'
  - where: 'setting'
    claim: 'Latter-day revelation confirms Moses as author (1 Ne. 5:10–11; Moses 1:40–41)'
    key: bd-pentateuch
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/pentateuch?lang=eng'
    quote: 'But latter-day revelation confirms that Moses was the author of the first five books of the Bible: Genesis, Exodus, Leviticus, Numbers, Deuteronomy (1 Ne. 5:10–11; Moses 1:40–41).'
  - where: 'setting'
    claim: 'Scholars compare the book to Hittite sovereign-vassal treaties'
    key: ot-minute-deut-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1'
    quote: 'Impressive parallels to ancient Hittite secular “sovereign-vassal” treaty texts like those found at Hattusas (modern Boghazkeui, Turkey) have been common among scholarly analyses.'
  - where: 'setting'
    claim: 'The book follows an ancient Near Eastern covenant/treaty pattern'
    key: ot-minute-deut-rappleye
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1-6-8-15-18-29-30-34'
    quote: 'the entire book of Deuteronomy is structured according to a covenant/treaty pattern commonly known and understood in the ancient Near East.'
  - where: 'setting'
    claim: 'In that pattern 1:6–4:44 is the historical prologue'
    key: ot-minute-deut-rappleye
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1-6-8-15-18-29-30-34'
    quote: 'Historical prologue'
  - where: 'thread'
    claim: 'Had the older generation trusted the Lord they would have been in Canaan four decades before'
    key: ot-minute-deut-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1'
    quote: 'if the older generation had been faithful and trusted the Lord at very beginning of the Exodus, they would have already settled their families in Canaan four decades before.'
  - where: 'thread'
    claim: 'The audience were the children of the generation that refused'
    key: ot-minute-deut-rappleye
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1-6-8-15-18-29-30-34'
    quote: 'those about to enter the land had either been children or not yet born when God made His covenant with Israel at Mount Sinai.'

  # ---------- notes ----------
  - where: 'note 1:2 “Eleven days that became forty years”'
    claim: 'Horeb to Kadesh-barnea was less than two weeks by ancient travel'
    key: ot-minute-deut-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1'
    quote: 'is quite literally less than a two-week journey by ancient means of travel.'
  - where: 'note 1:2 “Eleven days that became forty years”'
    claim: 'The two numbers set side by side show God’s trustworthiness and the cost of disbelief'
    key: ot-minute-deut-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1'
    quote: 'These phrases highlight God’s trustworthiness and the cost of Israel’s former disbelief and disobedience.'
  - where: 'note 1:2 “Eleven days that became forty years”'
    claim: 'Kadesh was a well-watered spot in the wilderness of Zin, in the southwest'
    key: bd-kadesh
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/kadesh?lang=eng'
    quote: 'a city in the southwest corner of Palestine, a well-watered and fruitful spot in the wilderness of Zin.'
  - where: 'note 1:2 “Eleven days that became forty years”'
    claim: 'The spies were sent from Kadesh two years after leaving Egypt'
    key: bd-kadesh
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/kadesh?lang=eng'
    quote: 'from here, two years after leaving Egypt, the 12 spies were sent to report upon the land of Canaan (Num. 13:26).'
  - where: 'note 1:2 “Eleven days that became forty years”'
    claim: 'Thirty-eight years from Kadesh-barnea to the brook Zered'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/2?lang=eng'
    quote: 'And the space in which we came from Kadesh-barnea, until we were come over the brook Zered, was thirty and eight years'

  - where: 'note 1:5 “Why the law is given again”'
    claim: 'The verb in 1:5 means explain, expound'
    key: bdb
    url: 'https://biblehub.com/hebrew/874.htm'
    quote: 'figurative explain, expound Deuteronomy 1:5'
  - where: 'note 1:5 “Why the law is given again”'
    claim: 'The name does not mean a new law nor a mere repetition'
    key: ot-manual-dt-1-16
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/deuteronomy-1-16-an-exhortation-to-obedience-part-1?lang=eng'
    quote: 'This name, however, does not imply that he gave them a new law in any sense of the word, nor that he merely repeated what had already been given.'
  - where: 'note 1:5 “Why the law is given again”'
    claim: 'The Exodus generation had largely died; Moses’ speeches are part of a covenant renewal ceremony'
    key: ot-minute-deut-rappleye
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1-6-8-15-18-29-30-34'
    quote: 'Thus, in preparing this new generation to enter into the land of promise, Moses’s speeches are given as part of a covenant renewal ceremony'
  - where: 'note 1:5 “Why the law is given again”'
    claim: 'What follows represents a new beginning of the covenant history'
    key: ot-minute-deut-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1'
    quote: 'what followed represented a new beginning of their covenant history'

  - where: 'note 1:9 “The judges, retold without Jethro”'
    claim: 'In Exodus 18 Moses chose the men'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/18?lang=eng'
    quote: 'And Moses chose able men out of all Israel, and made them heads over the people'
  - where: 'note 1:9 “The judges, retold without Jethro”'
    claim: 'One older reading: omission of Jethro may be due to summary nature, or intentional given D’s interest in Israel alone'
    key: cambridge-deuteronomy
    url: 'https://biblehub.com/commentaries/cambridge/deuteronomy/1.htm'
    quote: 'the absence from D of Jethro’s initiative as related in JE, may be due to the summary nature of its review (Dillm.); yet the possibility of intentional omission cannot be excluded in view of the prevalent confinement of the interest in D to Israel alone.'
  - where: 'note 1:9 “The judges, retold without Jethro”'
    claim: 'Here the people elect, as in 16:18, fitting D’s emphasis on the people’s judicial responsibility; in Exodus Moses chooses'
    key: cambridge-deuteronomy
    url: 'https://biblehub.com/commentaries/cambridge/deuteronomy/1.htm'
    quote: 'The people themselves are to elect as in Deuteronomy 16:18, consistently with the emphasis, so frequent in D, on the judicial responsibilities of the whole people. In E, Exodus 18:25 (cp. Numbers 11:16), Moses chooses.'

  - where: 'note 1:22 “The spies: whose idea, and what followed”'
    claim: 'In Numbers the Lord commands Moses to send the spies'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/13?lang=eng'
    quote: 'Send thou men, that they may search the land of Canaan, which I give unto the children of Israel'
  - where: 'note 1:22 “The spies: whose idea, and what followed”'
    claim: 'One older reading: no discrepancy of fact but a difference of standpoint; here the people propose, in Numbers it is a divine command'
    key: cambridge-deuteronomy
    url: 'https://biblehub.com/commentaries/cambridge/deuteronomy/1.htm'
    quote: 'The proposal to send spies is here attributed to the people, Moses consenting (see next verse). In P, Numbers 13:1 f., it is a divine command. There is no discrepancy of fact; but the difference of standpoint in describing the fact is instructive, and ought to be noticed along with other instances in D of the people’s initiative.'
  - where: 'note 1:22 “The spies: whose idea, and what followed”'
    claim: 'The plan pleased Moses because it sounded like trust'
    key: ot-minute-deut-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1'
    quote: 'Their plan to scout out the area for routes and cities pleased Moses because it sounded like the people were sincerely planning to trust the Lord in taking possession of their promised land.'
  - where: 'note 1:22 “The spies: whose idea, and what followed”'
    claim: 'Most accepted the ten spies’ report; some sought a leader to return to Egypt; they tried to stone Joshua and Caleb'
    key: scripture-helps-num
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/17-numbers-11-14-20-24-27?lang=eng'
    quote: 'Some Israelites started an effort to reject Moses and choose a leader that would take them back to Egypt. When Joshua and Caleb intervened, the congregation tried to have them stoned.'
  - where: 'note 1:22 “The spies: whose idea, and what followed”'
    claim: 'Moses pleaded; the Lord did not destroy them but all adults over twenty except Caleb and Joshua would die in the wilderness'
    key: scripture-helps-num
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/17-numbers-11-14-20-24-27?lang=eng'
    quote: 'Despite the people’s actions against him, Moses pleaded with the Lord to have mercy on them. The Lord said that He would not destroy the people, but they would wander in the desert for 40 years.'
  - where: 'note 1:22 “The spies: whose idea, and what followed”'
    claim: 'The sentence included all adults over twenty except Caleb and Joshua'
    key: scripture-helps-num
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/17-numbers-11-14-20-24-27?lang=eng'
    quote: 'This included all adults over 20 years old except Caleb and Joshua.'
  - where: 'note 1:22 “The spies: whose idea, and what followed”'
    claim: 'Only Caleb and Joshua had faith that the Lord would help them conquer Canaan'
    key: scripture-helps-num
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/17-numbers-11-14-20-24-27?lang=eng'
    quote: 'Only two of them, Caleb and Joshua, had faith that the Lord would help the Israelites conquer Canaan as He had promised.'
  - where: 'note 1:22 “The spies: whose idea, and what followed”'
    claim: 'A year for each day of the forty days'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/14?lang=eng'
    quote: 'After the number of the days in which ye searched the land, even forty days, each day for a year, shall ye bear your iniquities, even forty years'
  - where: 'note 1:22 “The spies: whose idea, and what followed”'
    claim: 'By naming the forty years Moses confirmed that the Lord keeps His word'
    key: ot-minute-deut-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1'
    quote: 'by referencing the forty-year probation, Moses also confirmed that the Lord keeps His word.'

  - where: 'note 1:25 “The good report at the center”'
    claim: 'Deut. 1:20–31 is a chiasmus of speaker with the spies’ positive report at the center'
    key: sc-knowhy-635
    url: 'https://scripturecentral.org/knowhy/how-does-the-book-of-mormon-text-reflect-a-seventh-century-bc-israelite-writing-style'
    quote: 'Moses speaks first (vv. 20–21), then the Israelites (v. 22), then Moses (vv. 23–24), with the spies in the middle (v. 25), and then Moses, the Israelites, and finally Moses again to conclude (vv. 26–31).'
  - where: 'note 1:25 “The good report at the center”'
    claim: 'The inversion is with the speakers, not keywords; the positive report is central'
    key: sc-knowhy-635
    url: 'https://scripturecentral.org/knowhy/how-does-the-book-of-mormon-text-reflect-a-seventh-century-bc-israelite-writing-style'
    quote: '“The inversion in the chiasmus is not with the themes or the keywords of the passage, but rather with the speakers.”'
  - where: 'note 1:25 “The good report at the center”'
    claim: 'The positive report is central to the chiasm'
    key: sc-knowhy-635
    url: 'https://scripturecentral.org/knowhy/how-does-the-book-of-mormon-text-reflect-a-seventh-century-bc-israelite-writing-style'
    quote: 'Central to this chiasm is the all-important positive report of the spies sent into Canaan (v. 25).'
  - where: 'note 1:25 “The good report at the center”'
    claim: 'The form is one of four usages relatively distinctive in Deuteronomy and Jeremiah'
    key: sc-knowhy-635
    url: 'https://scripturecentral.org/knowhy/how-does-the-book-of-mormon-text-reflect-a-seventh-century-bc-israelite-writing-style'
    quote: '“four specific usages of chiasmus that are relatively distinctive in Deuteronomy and Jeremiah as possible indicators of the seventh-century [BC] Judahite rhetorical tradition.”'
  - where: 'note 1:25 “The good report at the center”'
    claim: 'Seely calls it chiasmus of speaker'
    key: sc-knowhy-635
    url: 'https://scripturecentral.org/knowhy/how-does-the-book-of-mormon-text-reflect-a-seventh-century-bc-israelite-writing-style'
    quote: 'First, Seely identified what he called “chiasmus of speaker” rather than of topic'
  - where: 'note 1:27 “Why Moses says “ye” to the children”'
    claim: 'The audience were children or unborn when the covenant was made'
    key: ot-minute-deut-rappleye
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1-6-8-15-18-29-30-34'
    quote: 'the original Exodus generation had largely passed away, and those about to enter the land had either been children or not yet born'
  - where: 'note 1:27 “Why Moses says “ye” to the children”'
    claim: 'One older reading: by addressing the living as if they had spoken, Moses shows the corruption had not died out'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/1.htm'
    quote: 'Moses points to the fact, that the sinful corruption which broke out at that time, and bore such bitter fruit, had not died out with the older generation, but was germinating still in the existing Israel'
  - where: 'note 1:27 “Why Moses says “ye” to the children”'
    claim: 'One older reading: calling the deliverance an act of hatred was the basest ingratitude'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/1.htm'
    quote: 'presents the appearance of the basest ingratitude, inasmuch as the people declared the greatest blessing conferred upon them by God, viz., their deliverance from Egypt, to have been an act of hatred on His part.'
  - where: 'note 1:27 “Why Moses says “ye” to the children”'
    claim: 'The little ones said to be a prey would be brought in'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/14?lang=eng'
    quote: 'But your little ones, which ye said should be a prey, them will I bring in, and they shall know the land which ye have despised.'

  - where: 'note 1:28 “Who the Anakims were”'
    claim: 'The Anakim settled near Hebron and were met further north'
    key: bd-anak
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/anak?lang=eng'
    quote: 'A people who had settled near Hebron and who were also encountered further north (Num. 13:32–33; Deut. 1:28; 2:10–11, 21; 9:1–2; Josh. 14:12–15; 11:21–22).'
  - where: 'note 1:28 “Who the Anakims were”'
    claim: 'The ten spies called them giants; they may have been related to the people of Raphah, from whom Goliath descended'
    key: scripture-helps-num
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/17-numbers-11-14-20-24-27?lang=eng'
    quote: 'The 10 unbelieving spies referred to the sons of Anak as “giants” when they gave reasons why they felt Israel could not conquer the promised land. The sons of Anak may have been related to the people of Raphah, from whom Goliath descended.'

  - where: 'note 1:37 “Angry with me for your sakes”'
    claim: 'Numbers gives the reason at Meribah: ye believed me not'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/20?lang=eng'
    quote: 'Because ye believed me not, to sanctify me in the eyes of the children of Israel, therefore ye shall not bring this congregation into the land which I have given them.'
  - where: 'note 1:42 “I am not among you”'
    claim: 'When they presumed to go up, the ark and Moses did not leave the camp'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/14?lang=eng'
    quote: 'But they presumed to go up unto the hill top: nevertheless the ark of the covenant of the Lord, and Moses, departed not out of the camp.'
  - where: 'note 1:42 “I am not among you”'
    claim: 'The reversal shows people acting only on their own timetable'
    key: ot-minute-deut-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1'
    quote: 'They did whatever they wanted to do (or didn’t do whatever they didn’t want to do), and only on their own timetable. This is not discipleship despite the gospel language that passes their lips.'

  # ---------- christ ----------
  - where: 'christ'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary (see Mosiah 3:8; 15:1; 3 Ne. 15:1–5; D&C 110:1–10).'
