chapter: 34
claims:
  - where: when
    claim: 'Moses climbs Nebo from the plains of Moab'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/32?lang=eng'
    quote: 'Get thee up into this mountain Abarim, unto mount Nebo, which is in the land of Moab, that is over against Jericho; and behold the land of Canaan'
  - where: setting
    claim: 'Deuteronomy concludes with a short note on Moses’ death and the passing of authority to Joshua'
    key: ot-minute-deut-rappleye
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1-6-8-15-18-29-30-34'
    quote: 'Deuteronomy concludes with a short note on Moses’s death and the passing of authority to Joshua.'
  - where: setting
    claim: 'Latter-day revelation names Moses as author of the five books; the account of his death in 34:5–12 was added by a later hand'
    key: bd-pentateuch
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/pentateuch?lang=eng'
    quote: 'the explanation of Moses’ supposed death (Deut. 34:5–12) was surely added by a later hand. But latter-day revelation confirms that Moses was the author of the first five books of the Bible'
  - where: setting
    claim: 'The chapter heading: Moses is taken by the Lord'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/34?lang=eng'
    quote: 'Moses sees the promised land and is taken by the Lord—Joshua leads Israel—Moses was Israel’s greatest prophet.'
  - where: thread
    claim: 'Israel mourned Aaron thirty days'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/20?lang=eng'
    quote: 'they mourned for Aaron thirty days, even all the house of Israel.'
  - where: thread
    claim: 'Verse 10 may seem to contradict the promise of a prophet like Moses'
    key: ot-minute-deut-rappleye
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1-6-8-15-18-29-30-34'
    quote: 'This may seem like a contradiction, especially since earlier, Moses was promised that the Lord would raise up a prophet like him (Deuteronomy 18:15–18).'
  - where: section 1 plain
    claim: 'The south is the Negev'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/34?lang=eng'
    quote: '3a “south”: HEB Negev.'
  - where: section 2 plain
    claim: '“Natural force” is vigor'
    key: bdb
    url: 'https://biblehub.com/hebrew/3893.htm'
    quote: 'moisture, freshness (i.e. force, vigour)'
  - where: note 34:1 “The land from Nebo”
    claim: 'Nebo: hills west of Heshbon in Moab overlooking the Jordan, with Gerizim, Tabor and Hermon in the distance; 2634 feet'
    key: bd-nebo
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/nebo?lang=eng'
    quote: 'A group of hills west of Heshbon, in the land of Moab, afterwards the country of Reuben; they overlook the Jordan, with mounts Gerizim, Tabor, and Hermon in the far distance. … Elevation: 2634 feet above sea level.'
  - where: note 34:1 “The land from Nebo”
    claim: 'Nebo and the top of Pisgah may be one peak; Balaam saw the land from Pisgah'
    key: bd-pisgah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/pisgah?lang=eng'
    quote: 'whence Balaam (Num. 23:14) and Moses saw the land of Israel (Deut. 3:27; 34:1). Nebo and the top (or head) of Pisgah may be two names of the same peak.'
  - where: note 34:1 “The land from Nebo”
    claim: 'Balaam was brought to the top of Pisgah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/23?lang=eng'
    quote: 'And he brought him into the field of Zophim, to the top of Pisgah, and built seven altars'
  - where: note 34:1 “The land from Nebo”
    claim: 'Zoar is at the southern end of the Dead Sea'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/34.htm'
    quote: '"to Zoar" at the southern extremity of the Dead Sea (see at Genesis 19:22).'
  - where: note 34:1 “The land from Nebo”
    claim: 'One older reading: a sight with bodily eyes whose power was miraculously increased'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/34.htm'
    quote: 'This sight of every part of the land on the east and west was not an ecstatic vision, but a sight with the bodily eyes, whose natural power of vision was miraculously increased by God'
  - where: note 34:1 “The land from Nebo”
    claim: 'The LORD commanded Moses to climb Nebo and see Canaan'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/32?lang=eng'
    quote: 'unto mount Nebo, which is in the land of Moab, that is over against Jericho; and behold the land of Canaan'
  - where: note 34:5 “Died, or translated?”
    claim: 'Moses came with Elijah to the Transfiguration and gave keys; so he was translated and had not died as reported'
    key: bd-moses
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/moses?lang=eng'
    quote: 'From this event, which occurred before the Resurrection of Jesus, we understand that Moses was a translated being and had not died as reported in Deut. 34 (Alma 45:19).'
  - where: note 34:5 “Died, or translated?”
    claim: 'He needed a body of flesh and bones to give keys to mortals before the Resurrection; his ministry extended beyond his mortal life'
    key: bd-moses
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/moses?lang=eng'
    quote: 'It was necessary that he be translated, in order to have a body of flesh and bones at the time of the Transfiguration, since the Resurrection had not yet taken place. Had he been a spirit only, he could not have performed the work on the mount'
  - where: note 34:5 “Died, or translated?”
    claim: 'Moses’ ministry extended beyond his mortal lifetime; he came in company with Elijah'
    key: bd-moses
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/moses?lang=eng'
    quote: 'Moses’ ministry extended beyond the limits of his own mortal lifetime. In company with Elijah, he came to the Mount of Transfiguration and bestowed keys of the priesthood upon Peter, James, and John'
  - where: note 34:5 “Died, or translated?”
    claim: 'Translated beings do not experience pain or death until their resurrection'
    key: gs-translated-beings
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/translated-beings?lang=eng'
    quote: 'Persons who are changed so that they do not experience pain or death until their resurrection to immortality.'
  - where: note 34:5 “Died, or translated?”
    claim: 'Moses and Elias appeared talking with Jesus'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/17?lang=eng'
    quote: 'And, behold, there appeared unto them Moses and Elias talking with him.'
  - where: note 34:5 “Died, or translated?”
    claim: 'Moses gave the keys of gathering in the Kirtland Temple, April 3, 1836'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/110?lang=eng'
    quote: 'Visions manifested to Joseph Smith the Prophet and Oliver Cowdery in the temple at Kirtland, Ohio, April 3, 1836.'
  - where: note 34:5 “Died, or translated?”
    claim: 'The JST keeps “died” in verse 5'
    key: jsp-ot2
    url: 'https://www.josephsmithpapers.org/paper-summary/old-testament-revision-2/80'
    quote: 'So Mosses, the Servant of the Lord died thare in the land of Moab, according to the word of the Lord.'
  - where: note 34:6 “Who buried Moses”
    claim: 'The Hebrew verb “buried” is third masculine singular'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'וַ/יִּקְבֹּ֨ר'
  - where: note 34:6 “Who buried Moses”
    claim: 'The Greek reads “they buried him”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/deuteronomy/34.htm'
    quote: 'And they buried him in Gai near the house of Phogor; and no one has seen his sepulchre to this day.'
  - where: note 34:6 “Who buried Moses”
    claim: 'One older reading: the subject is Jehovah; the LXX’s “they buried” is precluded by “no man knoweth”'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/34.htm'
    quote: 'The subject in this sentence is Jehovah. Though the third person singular would allow of the verb being taken as impersonal (ἔθαψαν αὐτόν, lxx: they buried him), such a rendering is precluded by the statement which follows, "no man knoweth of his sepulchre unto this day."'
  - where: note 34:6 “Who buried Moses”
    claim: 'The JST manuscript reading of 34:6'
    key: jsp-ot2
    url: 'https://www.josephsmithpapers.org/paper-summary/old-testament-revision-2/80'
    quote: 'for the Lord took him unto his Fathers, in a valley in the land of Moab, over against Bethpeor; therefore no man knoweth of his sepulchar unto this day.'
  - where: note 34:6 “Who buried Moses”
    claim: 'The JST hints more strongly at translation; Josephus on the cloud and the disappearance'
    key: horton-jst-pentateuch
    url: 'https://rsc.byu.edu/joseph-smith-translation/insights-exodus-leviticus-numbers-deuteronomy'
    quote: 'Maybe the following from the JST hints more strongly in that direction. “For the Lord took him unto his fathers” (JST, Deuteronomy 34:6).'
  - where: note 34:6 “Who buried Moses”
    claim: 'Josephus as Horton prints him'
    key: horton-jst-pentateuch
    url: 'https://rsc.byu.edu/joseph-smith-translation/insights-exodus-leviticus-numbers-deuteronomy'
    quote: 'a cloud stood over him on the sudden, and he disappeared in a certain valley, although he wrote in the holy books that he died, which was done out of fear, lest they should venture to say that, because of his extraordinary virtue, he went to God.'
  - where: note 34:6 “Who buried Moses”
    claim: 'Some ancient writers implied Moses was translated'
    key: ot-minute-deut-rappleye
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1-6-8-15-18-29-30-34'
    quote: 'Some ancient writers implied that Moses was actually translated.'
  - where: note 34:6 “Who buried Moses”
    claim: 'As with Moses, Alma’s disappearance led to speculation'
    key: ot-minute-deut-rappleye
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1-6-8-15-18-29-30-34'
    quote: 'As with Moses, this led to later speculation about what really happened to Alma'
  - where: note 34:6 “Who buried Moses”
    claim: 'Alma 45:19 on Moses'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/45?lang=eng'
    quote: 'But behold, the scriptures saith the Lord took Moses unto himself'
  - where: note 34:7 “Three forties”
    claim: '120 is a symbolic three times forty; one Latter-day Saint reading names three periods'
    key: ot-minute-deut-rappleye
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1-6-8-15-18-29-30-34'
    quote: 'Moses was 120 years old when he died, which was a symbolic number that represented three times forty. Moses’s life can be divided neatly into three forty-year periods'
  - where: note 34:7 “Three forties”
    claim: 'The three periods: prince, pastor or shepherd, prophet'
    key: ot-minute-deut-rappleye
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1-6-8-15-18-29-30-34'
    quote: 'Forty years as prince … Forty years as pastor or shepherd … Forty years as prophet'
  - where: note 34:7 “Three forties”
    claim: 'Stephen marks forty years and forty more'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/7?lang=eng'
    quote: 'And when forty years were expired, there appeared to him in the wilderness of mount Sina an angel of the Lord in a flame of fire in a bush.'
  - where: note 34:7 “Three forties”
    claim: 'BDB on leach: moisture, freshness; his freshness had not fled'
    key: bdb
    url: 'https://biblehub.com/hebrew/3893.htm'
    quote: '[לֵחַ] noun masculine moisture, freshness (i.e. force, vigour); — suffix וְלֹא נָס לֵחהֹ Deuteronomy 34:7 and his freshness had not fled'
  - where: note 34:9 “Joshua ordained”
    claim: 'The LORD commanded Moses to lay hands on Joshua and put honour on him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/27?lang=eng'
    quote: 'And thou shalt put some of thine honour upon him, that all the congregation of the children of Israel may be obedient.'
  - where: note 34:9 “Joshua ordained”
    claim: 'Moses renamed Oshea Jehoshua; Joshua stayed in the tabernacle'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/33?lang=eng'
    quote: 'but his servant Joshua, the son of Nun, a young man, departed not out of the tabernacle.'
  - where: note 34:10 “Like unto Moses”
    claim: 'The LORD spoke with Moses mouth to mouth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/12?lang=eng'
    quote: 'With him will I speak mouth to mouth, even apparently, and not in dark speeches; and the similitude of the Lord shall he behold'
  - where: note 34:10 “Like unto Moses”
    claim: 'Moses saw God face to face (Moses 1:2)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/1?lang=eng'
    quote: 'And he saw God face to face, and he talked with him, and the glory of God was upon Moses'
  - where: note 34:10 “Like unto Moses”
    claim: 'Verse 10 may seem to contradict 18:15–18'
    key: ot-minute-deut-rappleye
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1-6-8-15-18-29-30-34'
    quote: 'This may seem like a contradiction, especially since earlier, Moses was promised that the Lord would raise up a prophet like him (Deuteronomy 18:15–18).'
  - where: note 34:10 “Like unto Moses”
    claim: 'A scholar quoted in the commentary: “like” has two meanings; no prophet as great as Moses'
    key: ot-minute-deut-rappleye
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1-6-8-15-18-29-30-34'
    quote: 'The passage at the end of the Torah visibly means that no other prophet was as great as Moses. It is simply a linguistic matter: the range of expression ‘to be like someone’ is wide enough to have two meanings (and several more).'
  - where: note 34:10 “Like unto Moses”
    claim: 'Jesus rose up as the prophet like Moses in the full sense'
    key: ot-minute-deut-rappleye
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1-6-8-15-18-29-30-34'
    quote: 'eventually Jesus rose up as the prophet like Moses in the full and complete sense.'
  - where: christ
    claim: 'Moses in the similitude of the Only Begotten'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/1?lang=eng'
    quote: 'thou art in the similitude of mine Only Begotten; and mine Only Begotten is and shall be the Savior'
  - where: christ
    claim: 'Joshua’s name occurs in the form Jesus'
    key: bd-joshua
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/joshua?lang=eng'
    quote: 'The name also occurs in the Old Testament under the various forms Jehoshua, Hoshea, Jeshua, and Jesus; son of Nun, and successor of Moses'
  - where: christ
    claim: '“Jesus” in Heb. 4:8 is Joshua (the footnote points to Ex. 17:9 and Acts 7:45)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/4?lang=eng'
    quote: '8a “Jesus”: Ex. 17:9; Acts 7:45.'
  - where: christ
    claim: 'The Transfiguration is the reason given for believing Moses was translated'
    key: bd-moses
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/moses?lang=eng'
    quote: 'From this event, which occurred before the Resurrection of Jesus, we understand that Moses was a translated being'
  - where: christ
    claim: 'The Savior: him shall ye hear in all things'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/20?lang=eng'
    quote: 'him shall ye hear in all things whatsoever he shall say unto you'
  - where: christ
    claim: 'The Church''s footnote at “hearkened” (34:9) is TG Sustaining Church Leaders'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/34?lang=eng'
    quote: '9c “hearkened”: TG Sustaining Church Leaders.'
  - where: christ
    claim: 'D&C 1:38: by mine own voice or by the voice of my servants, it is the same'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/1?lang=eng'
    quote: 'whether by mine own voice or by the voice of my servants, it is the same'
