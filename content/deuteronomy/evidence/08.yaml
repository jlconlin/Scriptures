chapter: 8
claims:
  - where: when
    claim: 'Moses speaks in the fortieth year after the Exodus'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/1?lang=eng'
    quote: 'And it came to pass in the fortieth year, in the eleventh month, on the first day of the month, that Moses spake unto the children of Israel'
  - where: when
    claim: 'The discourses were delivered in the plains of Moab'
    key: bd-deuteronomy
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/deuteronomy?lang=eng'
    quote: 'The book contains the three last discourses of Moses delivered in the plains of Moab just before his death (translation).'
  - where: setting
    claim: 'Chapters 5–11 are the first part of the second discourse: the Ten Commandments and a practical exposition of them'
    key: bd-deuteronomy
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/deuteronomy?lang=eng'
    quote: 'The second discourse (Deut. 5–26) consists of two parts: (1) 5–11, the Ten Commandments and a practical exposition of them, (2) 12–26, a code of laws'
  - where: setting
    claim: 'Jesus answered the devil with verse 3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/4?lang=eng'
    quote: 'But he answered and said, It is written, Man shall not live by bread alone, but by every word that proceedeth out of the mouth of God.'
  - where: thread
    claim: 'The chapter’s theme is obedience; verses 1–10 promise blessing, verses 11–20 warn against forgetting'
    key: ot-minute-deut-rappleye
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1-6-8-15-18-29-30-34'
    quote: 'This entire chapter focuses on the central theme of obedience to the commandments … The first part of the chapter focuses on the blessings and prosperity that will come if the people obey (verses 1–10), and the second part issues a warning should they forget the Lord (verses 11–20).'
  - where: thread
    claim: 'Obedience and disobedience are framed as remembering and forgetting, under conditions of lack and abundance, with the fate of the Canaanites as the warning'
    key: ot-minute-deut-rappleye
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1-6-8-15-18-29-30-34'
    quote: 'framing obedience and disobedience as remembering and forgetting the Lord, respectively. … Under both conditions, the people must remember that they are dependent upon the Lord for their blessings and prosperity or else will face the same fate as the Canaanite nations'
  - where: 'section 1 plain'
    claim: 'Verse 3: the Hebrew has no noun “word”: by everything that proceeds out of the mouth of the LORD'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/deuteronomy/8-3.htm'
    quote: 'man lives by everything that proceeds out of the mouth of the LORD.'
  - where: 'section 1 plain'
    claim: 'Verse 5: “disciplines” as a rendering of the verb'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Deuteronomy%208&version=NRSVUE'
    quote: 'Know, then, in your heart that, as a parent disciplines a child, so the Lord your God disciplines you.'
  - where: 'section 3 plain'
    claim: 'Verse 16: “latter end” means the time after the wilderness'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/8.htm'
    quote: 'In this instance Moses refers to the period of their life in Canaan'
  - where: 'note 8:2 “The forty years as a test”'
    claim: 'Elsewhere the wandering is a punishment; here Moses frames it as a test; the two are not mutually exclusive'
    key: ot-minute-deut-rappleye
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1-6-8-15-18-29-30-34'
    quote: 'Throughout most of the first five books of the Old Testament, wandering in the wilderness is presented as a punishment for disobedience. Here, Moses frames it as a test “to know what was in thine heart” … these two perspectives are not mutually exclusive.'
  - where: 'note 8:2 “The forty years as a test”'
    claim: 'To humble is to bring them to feel their need and dependence; to prove is to make them reveal what was in their heart'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/8.htm'
    quote: 'to humble, i.e., to bring them by means of distress and privations to feel their need of help and their dependence upon God. נסּה, to prove, by placing them in such positions in life as would drive them to reveal what was in their heart'
  - where: 'note 8:2 “The forty years as a test”'
    claim: 'The latter end is the life in Canaan, the ultimate intention of the trial'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/8.htm'
    quote: 'in order (this was the ultimate intention of all the humiliation and trial) "to do thee good at thy latter end." … In this instance Moses refers to the period of their life in Canaan'
  - where: 'note 8:3 “The manna’s lesson, and the Savior’s first answer”'
    claim: 'Jesus quoted verse 3 when tempted to turn stones to bread; people need more than basic needs, to be nourished by the good word of God'
    key: ot-minute-deut-rappleye
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1-6-8-15-18-29-30-34'
    quote: 'Jesus quoted these words when Satan tempted Him to turn stones into bread (see Matthew 4:4; Luke 4:4). To truly thrive, people need more than for their basic needs to be met; they need to be “nourished by the good word of God” (Moroni 6:4).'
  - where: 'note 8:3 “The manna’s lesson, and the Savior’s first answer”'
    claim: 'The King James supplies “word”; literally “every produce of the mouth of Jehovah,” “everything that proceeds out of the mouth of the LORD”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/deuteronomy/8-3.htm'
    quote: 'but by every produce of the mouth of Jehovah man doth live. … man lives by everything that proceeds out of the mouth of the LORD. … but by every [word] that proceedeth out of the mouth of the LORD doth man live.'
  - where: 'note 8:3 “The manna’s lesson, and the Savior’s first answer”'
    claim: 'The Greek translation reads “every word … of God”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/deuteronomy/8.htm'
    quote: 'that he might teach thee that man shall not live by bread alone, but by every word that proceeds out of the mouth of God shall man live.'
  - where: 'note 8:3 “The manna’s lesson, and the Savior’s first answer”'
    claim: 'Jesus’ three answers in Matthew 4'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/4?lang=eng'
    quote: 'Jesus said unto him, It is written again, Thou shalt not tempt the Lord thy God. … Then saith Jesus unto him, Get thee hence, Satan: for it is written, Thou shalt worship the Lord thy God, and him only shalt thou serve.'
  - where: 'note 8:3 “The manna’s lesson, and the Savior’s first answer”'
    claim: 'The line is repeated in latter-day revelation'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'For you shall live by every word that proceedeth forth from the mouth of God.'
  - where: 'note 8:3 “The manna’s lesson, and the Savior’s first answer”'
    claim: 'Jesus’ testing in the wilderness reminds readers of Israel’s testing in Deuteronomy'
    key: strathearn-gospels
    url: 'https://rsc.byu.edu/vol-8-no-2-2007/distinctive-testimonies-four-gospels'
    quote: 'The testing of Jesus in the wilderness after His baptism reminds readers of Israel’s testing in the wilderness in Deuteronomy'
  - where: 'note 8:5 “Chastening as a father’s training”'
    claim: 'yasar means discipline, chasten, admonish; hence to instruct'
    key: bdb
    url: 'https://biblehub.com/hebrew/3256.htm'
    quote: '[יָסַר] verb discipline, chasten, admonish'
  - where: 'note 8:5 “Chastening as a father’s training”'
    claim: 'Strong’s gloss: to chastise, hence to instruct'
    key: bdb
    url: 'https://biblehub.com/hebrew/3256.htm'
    quote: '1. to chastise, literally (with blows) or figuratively (with words) 2. (hence) to instruct'
  - where: 'note 8:5 “Chastening as a father’s training”'
    claim: 'A modern translation: as a parent disciplines a child'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Deuteronomy%208&version=NRSVUE'
    quote: 'as a parent disciplines a child, so the Lord your God disciplines you.'
  - where: 'note 8:5 “Chastening as a father’s training”'
    claim: 'The verb means to admonish, chasten, educate; Israel was to learn by experience that God was educating them as a father his son'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/8.htm'
    quote: 'that they might learn in their heart, i.e., convince themselves by experience, that their God was educating them as a father does his son. יסּר, to admonish, chasten, educate; like παιδεύειν. "It includes everything belonging to a proper education" (Calvin).'
  - where: 'note 8:10 “A blessing after the meal”'
    claim: 'In Judaism a brief blessing before eating, longer blessings after; Deuteronomy 8:10 is the basis'
    key: sc-knowhy-115
    url: 'https://scripturecentral.org/knowhy/why-did-alma-bless-and-thank-god-after-eating'
    quote: '“In Judaism, while a brief blessing is recited before eating, a series of longer blessings . . . follows the meal.” The basis for the practice is found in Deuteronomy 8:10.'
  - where: 'note 8:10 “A blessing after the meal”'
    claim: 'The practice is in the Mishnah (about AD 200) and the Dead Sea Scrolls'
    key: sc-knowhy-115
    url: 'https://scripturecentral.org/knowhy/why-did-alma-bless-and-thank-god-after-eating'
    quote: 'The practice is found in the Mishnah, which is the “Oral Torah,” first written around AD 200, and believed to contain much older oral traditions. It is also found among the Dead Sea Scrolls.'
  - where: 'note 8:10 “A blessing after the meal”'
    claim: 'Alma, as high priest, showed awareness of Deuteronomy; in both the blessing is gratitude for safety and prosperity; Alma had been rejected'
    key: sc-knowhy-115
    url: 'https://scripturecentral.org/knowhy/why-did-alma-bless-and-thank-god-after-eating'
    quote: 'As the High Priest, Alma showed here his ample awareness of the law in Deuteronomy. … a land which had previously rejected him (Alma 8:14–22). In both settings, the blessing is an expression of gratitude and thanks for the Lord’s blessings of safety and prosperity.'
  - where: 'note 8:10 “A blessing after the meal”'
    claim: 'The blessing after the meal is a tradition still kept in Judaism, as an act of remembering the Lord; it appears in Alma 8:22'
    key: ot-minute-deut-rappleye
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1-6-8-15-18-29-30-34'
    quote: 'To remember the Lord and show gratitude for the abundance He will provide in the land … This instruction eventually led to a tradition, still maintained in Judaism today, of saying a blessing after a meal rather than before it'
  - where: 'note 8:11 “Remembering, then unremembering”'
    claim: 'The sequence of remembering in verses 2–10 is reversed in 11–17'
    key: ot-minute-deut-rappleye
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1-6-8-15-18-29-30-34'
    quote: 'remembering how the Lord blessed them during the wilderness experience (verses 2–5) … remembering the Lord when surrounded by the abundance of the promised land; eating their fill and blessing the Lord (verses 6–10)'
  - where: 'note 8:11 “Remembering, then unremembering”'
    claim: 'The reversal creates an unremembering effect; forgetting undoes memory of the wilderness, until they credit their own power and might'
    key: ot-minute-deut-rappleye
    url: 'https://scripturecentral.org/archive/books/book-chapter/deuteronomy-1-6-8-15-18-29-30-34'
    quote: 'This sequence reversal creates a kind of “unremembering” effect. … Israel’s forgetting the Lord’s role in their prosperity in the promised land undoes their memory of the Lord’s blessings in the wilderness. The end result is their believing that they created their own “power and might” (verse 17).'
  - where: 'note 8:11 “Remembering, then unremembering”'
    claim: 'The whole chapter has been analyzed as concentric, with an inclusio at verses 1 and 20 and the blessings of verses 7–9 at the center'
    key: ehat-asymmetry
    url: 'https://journal.interpreterfoundation.org/asymmetry-in-chiasms-with-a-note-about-deuteronomy-8-and-alma-36/'
    quote: 'An inclusio opens and closes Deuteronomy 8, with element A (vs. 1) and element A'' (vs. 20) … The centerpiece of Deuteronomy 8 speaks of the blessings of the Lord God to Israel (vv. 7–9)'
  - where: 'note 8:11 “Remembering, then unremembering”'
    claim: 'Deuteronomy 8 may have been a model for Alma 36'
    key: ehat-asymmetry
    url: 'https://journal.interpreterfoundation.org/asymmetry-in-chiasms-with-a-note-about-deuteronomy-8-and-alma-36/'
    quote: 'The earlier text may possibly have been a model for at least a portion of the wording, message, structure, and ideas of Alma 36'
  - where: 'note 8:11 “Remembering, then unremembering”'
    claim: 'Both texts open and close with keeping the commandments, remember the captivity of the fathers, and center on a blessing'
    key: ehat-asymmetry
    url: 'https://journal.interpreterfoundation.org/asymmetry-in-chiasms-with-a-note-about-deuteronomy-8-and-alma-36/'
    quote: 'Both texts focus in the beginning on keeping the commandments and warn at the end of the consequences of not keeping the commandments and both offer a focus at the middle of their text on a blessing from the Lord.'
  - where: 'note 8:11 “Remembering, then unremembering”'
    claim: 'Alma 36 remembers the captivity of the fathers'
    key: ehat-asymmetry
    url: 'https://journal.interpreterfoundation.org/asymmetry-in-chiasms-with-a-note-about-deuteronomy-8-and-alma-36/'
    quote: 'both require remembrance of the wilderness period of the fathers … “remembering the captivity of our fathers” (Alma 36:2);'
  - where: 'note 8:17 “Wealth and the other gods”'
    claim: 'Chapter 8 restates chapter 6 with a nuance: even when their efforts are part of success, they must not forget the One who provided the conditions'
    key: lane-redemption
    url: 'https://rsc.byu.edu/covenant-compassion/remembering-redemption-avoiding-idolatry'
    quote: 'In Deuteronomy 8 this reminder to remember redemption as a way to have a right relationship with wealth is restated but with a subtle nuance. … even when their efforts are part of their success, they must not forget the One who provided all the conditions needed for that success.'
  - where: 'note 8:17 “Wealth and the other gods”'
    claim: 'Walking after other gods was at times literal and can be read as trust in material resources and one’s own power'
    key: lane-redemption
    url: 'https://rsc.byu.edu/covenant-compassion/remembering-redemption-avoiding-idolatry'
    quote: 'a warning that certainly became literal at times but one that can also be understood more metaphorically as putting their trust in their material resources and their own power (8:19).'
  - where: 'note 8:17 “Wealth and the other gods”'
    claim: 'Forgetting God is a kind of idolatry, the worship of one’s own accomplishments'
    key: lane-redemption
    url: 'https://rsc.byu.edu/covenant-compassion/remembering-redemption-avoiding-idolatry'
    quote: 'Forgetting God is a kind of idolatry that is seen in the false worship of their “own” accomplishments.'
  - where: 'note 8:17 “Wealth and the other gods”'
    claim: 'Verse 19 follows directly with the first commandment'
    key: lane-redemption
    url: 'https://rsc.byu.edu/covenant-compassion/remembering-redemption-avoiding-idolatry'
    quote: 'Directly after this reminder that the power to get wealth comes from God, we find a reminder of the first commandment'
  - where: christ
    claim: 'Jesus answered from verse 3 after forty days'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/4?lang=eng'
    quote: 'But he answered and said, It is written, Man shall not live by bread alone, but by every word that proceedeth out of the mouth of God.'
