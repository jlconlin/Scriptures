chapter: 21
claims:
  - where: when
    claim: 'Moses speaks in the fortieth year, in the plains of Moab'
    key: bd-deuteronomy
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/deuteronomy?lang=eng'
    quote: 'The book contains the three last discourses of Moses delivered in the plains of Moab just before his death (translation).'
  - where: setting
    claim: 'Chapters 12–26 are a code of laws; after the laws of worship and justice, the last group regulates private and social rights'
    key: bd-deuteronomy
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/deuteronomy?lang=eng'
    quote: '12–26, a code of laws, which forms the nucleus of the whole book. … The next group of laws deals with the administration of justice, while the last group regulates private and social rights.'
  - where: setting
    claim: 'The five laws are grouped to bring out the sacredness of life and of personal rights'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/21.htm'
    quote: 'The reason for grouping together these five laws, which are apparently so different from one another, … is to be found in the desire to bring out distinctly the sacredness of life and of personal rights from every point of view'
  - where: setting
    claim: 'Paul cites the law of the hanged man for Christ'
    key: strathearn-crucifixion
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/crucifixion'
    quote: 'In his letter to the Galatians, Paul acknowledged that under the law of Moses, “cursed is every one that hangeth on a tree” (Galatians 3:13; see also Deuteronomy 21:22–23).'
  - where: thread
    claim: 'The first law wipes away innocent blood from the land, as Numbers 35:33 requires'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/21.htm'
    quote: 'In this way Israel was to wipe away the innocent blood (the bloodshed) from its midst (cf. Numbers 35:33).'
  - where: thread
    claim: 'The land was defiled by crimes and by the exposed body of the executed'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/21.htm'
    quote: 'The land was defiled not only by vices and crimes (cf. Leviticus 18:24, Leviticus 18:28; Numbers 35:34), but also by the exposure to view of criminals who had been punished with death'
  - where: thread
    claim: 'The captive law protects the slave against her master''s caprice; the firstborn law is against abuse of paternal authority for a favourite wife'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/21.htm'
    quote: 'Whilst the previous law was intended to protect the slave taken in war against the caprice of her Israelitish master, the law which follows is directed against the abuse of paternal authority in favour of a favourite wife.'
  - where: thread
    claim: 'The rebellious-son law aims at the defence and the limitation of parental authority'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/21.htm'
    quote: 'The laws upon this point aim not only at the defence, but also at the limitation, of parental authority.'
  - where: thread
    claim: 'Numbers 35:33: blood defiles the land'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/35?lang=eng'
    quote: 'So ye shall not pollute the land wherein ye are: for blood it defileth the land'
  - where: 'section 1 plain'
    claim: 'The valley of v. 4 is a wadi with an ever-flowing stream'
    key: bdb
    url: 'https://biblehub.com/hebrew/386.htm'
    quote: 'ever-flowing (opposed to אַכְזָב), נַחַל אֵיתָן Amos 5:24 an ever-flowing wady, Deuteronomy 21:4'
  - where: 'section 1 plain'
    claim: '“Be merciful” is kipper, cover or forgive, with God as subject'
    key: bdb
    url: 'https://biblehub.com/hebrew/3722.htm'
    quote: 'with God as subject, with accusative of person, cover, i.e. treat as covered, view propitiously'
  - where: 'section 2 plain'
    claim: '“Humbled” in v. 14 means taken as a wife by cohabitation'
    key: bdb
    url: 'https://biblehub.com/hebrew/6031.htm'
    quote: 'humble, a woman by cohabitation, Genesis 34:2 (J) Deuteronomy 21:14'
  - where: 'section 2 plain'
    claim: 'The captive wife could not be treated as a slave'
    key: ot-manual-deuteronomy-17-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/deuteronomy-17-33-an-exhortation-to-obedience-part-2?lang=eng'
    quote: 'any woman taken prisoner could be married, but could not be treated as a slave or as a captive (Deut. 21:10–14)'
  - where: 'note 21:4 “A heifer, a running stream, and a broken neck”'
    claim: 'The nearest town bore the burden of the innocent blood before all others'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/21.htm'
    quote: 'because the guilt connected with the shedding of innocent blood rested as a burden upon it before all others'
  - where: 'note 21:4 “A heifer, a running stream, and a broken neck”'
    claim: 'The heifer dies in the murderer''s stead; not an expiatory sacrifice, no blood sprinkled; breaking the neck as at Ex. 13:13'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/21.htm'
    quote: 'As the murderer was not to be found, an animal was to be put to death in his stead, and suffer the punishment of the murderer. The slaying of the animal was not an expiatory sacrifice, and consequently there was no slaughtering and sprinkling of the blood'
  - where: 'note 21:4 “A heifer, a running stream, and a broken neck”'
    claim: 'The unworked heifer had undiminished vital force to bear the guilt'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/21.htm'
    quote: 'To be able to take the guilt upon itself and bear it, the animal was to be in the full and undiminished possession of its vital powers.'
  - where: 'note 21:4 “A heifer, a running stream, and a broken neck”'
    claim: 'The stream and untilled ground carry the blood away'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/21.htm'
    quote: 'the water of the brook-valley would suck in the blood and clean it away, and that the blood sucked in by the earth would not be brought to light again by the ploughing and working of the soil'
  - where: 'note 21:4 “A heifer, a running stream, and a broken neck”'
    claim: 'If the murderer were found later, he still bore the death penalty'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/21.htm'
    quote: 'If the murderer were discovered afterwards, of course the punishment of death which had been inflicted vicariously upon the animal, simply because the criminal himself could not be found, would still fall upon him.'
  - where: 'note 21:4 “A heifer, a running stream, and a broken neck”'
    claim: 'The King James reads “rough valley”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/21?lang=eng'
    quote: 'And the elders of that city shall bring down the heifer unto a rough valley, which is neither eared nor sown'
  - where: 'note 21:4 “A heifer, a running stream, and a broken neck”'
    claim: '“Rough valley” is in Hebrew an ever-flowing wadi'
    key: bdb
    url: 'https://biblehub.com/hebrew/386.htm'
    quote: 'ever-flowing (opposed to אַכְזָב), נַחַל אֵיתָן Amos 5:24 an ever-flowing wady, Deuteronomy 21:4'
  - where: 'note 21:4 “A heifer, a running stream, and a broken neck”'
    claim: 'Ex. 13:13: the unredeemed firstling ass has its neck broken; Num. 35:33 blood defiles the land'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/13?lang=eng'
    quote: 'And every firstling of an ass thou shalt redeem with a lamb; and if thou wilt not redeem it, then thou shalt break his neck'
  - where: 'note 21:8 “Be merciful: a prayer that God cover the blood”'
    claim: 'In 21:8 God is the subject of kipper: treat as covered; bloodguiltiness flows away in the stream'
    key: bdb
    url: 'https://biblehub.com/hebrew/3722.htm'
    quote: 'with God as subject, with accusative of person, cover, i.e. treat as covered, view propitiously, … לְ person Deuteronomy 21:8 (bloodguiltiness flows away in the stream)'
  - where: 'note 21:8 “Be merciful: a prayer that God cover the blood”'
    claim: 'The last clause reads “the blood shall be covered for them”'
    key: bdb
    url: 'https://biblehub.com/hebrew/3722.htm'
    quote: 'Niph`al Perfect וְנִכַּמֵּר לָהֶם הַדָּם Deuteronomy 21:8 and the blood shall be covered for them.'
  - where: 'note 21:8 “Be merciful: a prayer that God cover the blood”'
    claim: 'The heading summarizes 1–9 as amends for murders by unknown persons'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/21?lang=eng'
    quote: 'How amends are made for murders by unknown persons'
  - where: 'note 21:10 “The captive woman”'
    claim: 'A captive could be married but not treated as a slave or a captive'
    key: ot-manual-deuteronomy-17-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/deuteronomy-17-33-an-exhortation-to-obedience-part-2?lang=eng'
    quote: 'any woman taken prisoner could be married, but could not be treated as a slave or as a captive (Deut. 21:10–14)'
  - where: 'note 21:10 “The captive woman”'
    claim: '“Humbled” is the verb the lexicon glosses, of a woman, as by cohabitation'
    key: bdb
    url: 'https://biblehub.com/hebrew/6031.htm'
    quote: 'humble, a woman by cohabitation, Genesis 34:2 (J) Deuteronomy 21:14; Deuteronomy 22:24,29; Judges 19:24; Judges 20:5; 2 Samuel 13:12,14,22,32'
  - where: 'note 21:10 “The captive woman”'
    claim: 'The law tells how to marry a captive; it could involve polygamy if the man was already married'
    key: sears-shannon-polygamy
    url: 'https://rsc.byu.edu/household-god/let-me-take-another-wife'
    quote: 'In addition, Deuteronomy 21:10–14 describes how to go about marrying a woman captured in war and Deuteronomy 25:5–6 provides for levirate marriage, and while neither situation had to involve polygamy, each of them could if the man were already married.'
  - where: 'note 21:15 “The firstborn of the less-loved wife”'
    claim: 'The law protects the inheritance of the children of a plural wife the husband likes less'
    key: sears-shannon-polygamy
    url: 'https://rsc.byu.edu/household-god/let-me-take-another-wife'
    quote: 'Deuteronomy 21:15–17 protects the inheritance of the children born to a plural wife in the circumstance that the husband does not like her as much as his other wife.'
  - where: 'note 21:15 “The firstborn of the less-loved wife”'
    claim: 'Birthright passed to the firstborn even against the father''s preference; yet scripture records it given to a younger, more righteous son'
    key: sc-knowhy-462
    url: 'https://scripturecentral.org/knowhy/why-was-it-significant-that-nephi-was-made-a-ruler-and-a-teacher-over-his-brethren'
    quote: 'Although the birthright was typically passed on to the firstborn son even if the father’s preferences were otherwise (Deuteronomy 21:15–17), the scriptures record many instances in which that blessing and inheritance were granted to a younger son. In general, the reason for this seems to have been that the younger son was simply more righteous. For example, in the case of the first sibling rivalry recorded in the Bible, between Cain and Abel, the Lord favored Abel'
  - where: 'note 21:15 “The firstborn of the less-loved wife”'
    claim: 'Jacob (Book of Mormon) may have built on or clarified this provision, which allowed for and regulated polygamy'
    key: sc-knowhy-64
    url: 'https://scripturecentral.org/knowhy/what-does-the-book-of-mormon-say-about-polygamy'
    quote: 'Jacob may have intended to build upon or clarify one provision in biblical law, which allowed for and regulated polygamy (Deuteronomy 21:15–17).'
  - where: 'note 21:15 “The firstborn of the less-loved wife”'
    claim: 'Gen. 29:30–31: Jacob loved Rachel more than Leah, and Leah was hated'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/29?lang=eng'
    quote: 'he loved also Rachel more than Leah, and served with him yet seven other years. And when the LORD saw that Leah was hated, he opened her womb'
  - where: 'note 21:18 “Why the rebellious son was brought to the elders”'
    claim: 'Not merely disobedient but incorrigible children'
    key: ot-manual-deuteronomy-17-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/deuteronomy-17-33-an-exhortation-to-obedience-part-2?lang=eng'
    quote: 'The law was not speaking of just disobedient children but of incorrigible children, those to whom no counsel or guidance was meaningful.'
  - where: 'note 21:18 “Why the rebellious son was brought to the elders”'
    claim: 'Almost certainly grown sons; the charge of drunkard is evidence'
    key: ot-manual-deuteronomy-17-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/deuteronomy-17-33-an-exhortation-to-obedience-part-2?lang=eng'
    quote: 'Almost certainly, these were children who had reached maturity. (The charge of drunkard is evidence for this view.) Small children would not qualify as incorrigible.'
  - where: 'note 21:18 “Why the rebellious son was brought to the elders”'
    claim: 'Parents brought the charge but did not execute him, unlike witnesses in other capital cases'
    key: ot-manual-deuteronomy-17-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/deuteronomy-17-33-an-exhortation-to-obedience-part-2?lang=eng'
    quote: 'Although the parents had to bring charges against their own child, they were not required to execute him, as were the witnesses in other capital crimes.'
  - where: 'note 21:18 “Why the rebellious son was brought to the elders”'
    claim: 'The family transmits righteousness; a son who utterly rejected parental authority threatened the order of society'
    key: ot-manual-deuteronomy-17-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/deuteronomy-17-33-an-exhortation-to-obedience-part-2?lang=eng'
    quote: 'Since the family is the basic unit of society and the most important means of transmitting righteousness from generation to generation, the child who utterly rejected parental authority threatened the very order of society.'
  - where: 'note 21:18 “Why the rebellious son was brought to the elders”'
    claim: 'Deuteronomy restricted a father''s power; even so the son was chastened, seized, taken to the elders, accused by both parents, stoned by the men of the city'
    key: welch-lehi-will
    url: 'https://rsc.byu.edu/book-mormon-second-nephi-doctrinal-structure/lehis-last-will-testament-legal-approach'
    quote: 'Specific procedures spelled out in Deuteronomy and applicable in Israel during Lehi’s day had come to restrict this paternal power somewhat, but even under this law the “stubborn and rebellious son” was to be chastened, seized, taken to the elders at the city gate, accused by the father and the mother'
  - where: 'note 21:18 “Why the rebellious son was brought to the elders”'
    claim: 'In many ancient societies a father''s power was virtually absolute'
    key: welch-lehi-will
    url: 'https://rsc.byu.edu/book-mormon-second-nephi-doctrinal-structure/lehis-last-will-testament-legal-approach'
    quote: 'Indeed, in many ancient societies, fathers needed little excuse to kill their children, for their patria potestas was virtually absolute.'
  - where: 'note 21:18 “Why the rebellious son was brought to the elders”'
    claim: 'Laman and Lemuel were punishable as rebellious sons; Lehi''s love and patience spared them'
    key: welch-lehi-will
    url: 'https://rsc.byu.edu/book-mormon-second-nephi-doctrinal-structure/lehis-last-will-testament-legal-approach'
    quote: 'There can be little doubt about the fact that Laman and Lemuel were legally punishable by death under the law of Moses as “rebellious sons,” for at one point they even “sought” to kill their father Lehi (1 Nephi 17:44).'
  - where: 'note 21:18 “Why the rebellious son was brought to the elders”'
    claim: 'Lehi''s love and long-suffering spared their lives'
    key: welch-lehi-will
    url: 'https://rsc.byu.edu/book-mormon-second-nephi-doctrinal-structure/lehis-last-will-testament-legal-approach'
    quote: 'It is far more likely that Lehi’s love, patience and long-suffering toward his recalcitrant sons spared their lives.'
  - where: 'note 21:22 “Hanged after death, buried before night”'
    claim: 'Hanging was not the execution but the display of one already executed, an intensification of the penalty'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/21.htm'
    quote: 'The hanging, not of criminals who were to be put to death, but of those who had been executed with the sword, was an intensification of the punishment of death (see at Numbers 25:4)'
  - where: 'note 21:22 “Hanged after death, buried before night”'
    claim: 'Burial on the day of execution, before sunset, as Joshua applied the law'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/21.htm'
    quote: 'Moses commanded the burial of those who had been hanged upon the day of their execution, - that is to say, as we may see from the application of this law in Joshua 8:29; Joshua 10:26-27, before sunset'
  - where: 'note 21:22 “Hanged after death, buried before night”'
    claim: 'Josh. 8:29: the king of Ai taken down at sundown'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/8?lang=eng'
    quote: 'And the king of Ai he hanged on a tree until eventide: and as soon as the sun was down, Joshua commanded that they should take his carcase down from the tree'
  - where: 'note 21:22 “Hanged after death, buried before night”'
    claim: 'Beyond public shame, a ritual impurity accompanied hanging; the body left overnight defiled the land'
    key: sc-knowhy-752
    url: 'https://scripturecentral.org/knowhy/why-was-zemnarihah-executed-by-hanging'
    quote: 'Moreover, the Old Testament goes beyond seeing the public shame of a hanging: a ritual impurity accompanied it. Deuteronomy prohibits a body to be hung overnight because it was said to ritually defile the land'
  - where: 'note 21:22 “Hanged after death, buried before night”'
    claim: 'The exposed criminal was smitten by the curse of God, his shameful deeds exposed'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/21.htm'
    quote: 'thus had been smitten by the curse of God, inasmuch as their shameful deeds were thereby publicly exposed to view'
  - where: 'note 21:22 “Hanged after death, buried before night”'
    claim: 'Not bodily defilement through decay'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/21.htm'
    quote: 'We are not to think of any bodily defilement of the land through the decomposition consequent upon death'
  - where: 'note 21:23 “Christ made a curse for us”'
    claim: 'Paul acknowledged that under the law the hanged were cursed'
    key: strathearn-crucifixion
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/crucifixion'
    quote: 'It is clear that the Christian message that Jesus, as Son of God, was crucified, was troubling to both Jews and Gentiles. In his letter to the Galatians, Paul acknowledged that under the law of Moses, “cursed is every one that hangeth on a tree”'
  - where: 'note 21:23 “Christ made a curse for us”'
    claim: 'In Jewish literature crucifixion was one type of hanging on a tree; early Christian writers felt the need to reconcile the cross with the passage'
    key: strathearn-crucifixion
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/crucifixion'
    quote: 'In Jewish literature, crucifixion was seen as one type of Deuteronomy’s “hanging on a tree.” … Like Paul, a number of early Christian writers felt the need to reconcile Jesus’s crucifixion with this passage in Deuteronomy'
  - where: 'note 21:23 “Christ made a curse for us”'
    claim: 'The Temple Scroll also demands that the hanged not remain overnight; Roman practice left bodies on the cross'
    key: strathearn-crucifixion
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/crucifixion'
    quote: 'Both Deuteronomy 21:22–23 and the Temple Scroll from the Dead Sea Scrolls (11Q19 64.11–13) demand that those who “hang on a tree” should not be left there overnight. The body must be buried that day. Of course, this was not the normal practice with crucifixion.'
  - where: 'note 21:23 “Christ made a curse for us”'
    claim: 'John 19:31–33: other strategies were needed to comply with Deuteronomy 21'
    key: strathearn-crucifixion
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/crucifixion'
    quote: 'If, however, the person on the cross had not died before the end of the day, in order to comply with the mandate of Deuteronomy 21, other strategies were needed. John says that the soldier broke the legs of the other victims'
  - where: 'note 21:23 “Christ made a curse for us”'
    claim: 'Gal. 3:13 and John 19:31 texts'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/gal/3?lang=eng'
    quote: 'Christ hath redeemed us from the curse of the law, being made a curse for us: for it is written, Cursed is every one that hangeth on a tree'
  - where: christ
    claim: 'The Mosaic law was given by the Lord, the premortal Jesus'
    key: ot-manual-deuteronomy-17-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/deuteronomy-17-33-an-exhortation-to-obedience-part-2?lang=eng'
    quote: 'This requirement, like all else in the Mosaic law, was given by the Lord, who was the premortal Jesus.'
  - where: 'note 21:4 “A heifer, a running stream, and a broken neck”'
    claim: 'The King James reads “strike off the heifer’s neck” and “beheaded”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/21?lang=eng'
    quote: 'and shall strike off the heifer’s neck there in the valley'
  - where: 'note 21:4 “A heifer, a running stream, and a broken neck”'
    claim: 'The mode of death is breaking the neck, as at Ex. 13:13'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/21.htm'
    quote: 'the mode of death, viz., breaking the neck (vid., Exodus 13:13)'
  - where: 'note 21:10 “The captive woman”'
    claim: 'The manual sets the law among dealings with other foreign countries, apart from the Canaanites'
    key: ot-manual-deuteronomy-17-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/deuteronomy-17-33-an-exhortation-to-obedience-part-2?lang=eng'
    quote: 'With other foreign countries, of better calibre, any woman taken prisoner could be married'
  - where: christ
    claim: 'Without Christ all stand under the curse of the law'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/gal/3?lang=eng'
    quote: 'For as many as are of the works of the law are under the curse'
  - where: christ
    claim: 'By the law men are cut off'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/2?lang=eng'
    quote: 'And by the law no flesh is justified; or, by the law men are cut off.'
  - where: christ
    claim: 'Redemption comes through the Holy Messiah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/2?lang=eng'
    quote: 'Wherefore, redemption cometh in and through the Holy Messiah; for he is full of grace and truth.'
