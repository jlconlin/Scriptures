chapter: 22
claims:
  - where: when
    claim: 'Moses speaks in the fortieth year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/1?lang=eng'
    quote: 'And it came to pass in the fortieth year, in the eleventh month, on the first day of the month, that Moses spake unto the children of Israel'
  - where: setting
    claim: 'Chapters 12–26 are a code of laws; its last group regulates private and social rights'
    key: bd-deuteronomy
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/deuteronomy?lang=eng'
    quote: '(2) 12–26, a code of laws, which forms the nucleus of the whole book. … The next group of laws deals with the administration of justice, while the last group regulates private and social rights.'
  - where: setting
    claim: 'Frederick applies the betrothal law of 22:23–24 to Mary’s case in Matthew'
    key: frederick-divorce
    url: 'https://rsc.byu.edu/household-god/marriage-divorce-remarriage-new-testament-world'
    quote: 'We have already looked at the story of Joseph and Mary, where her pregnancy while betrothed would have opened her up to charges of adultery and, in accordance with Deuteronomy 22:23–24, death by stoning.'
  - where: thread
    claim: 'One older reading: it is difficult to explain why these laws stand here or in this order; they modify, transform or forbid earlier laws and customs'
    key: cambridge-deuteronomy
    url: 'https://biblehub.com/commentaries/cambridge/deuteronomy/22.htm'
    quote: 'It is difficult if not impossible to explain their appearance just here in the Code, or the order in which they are arranged. They have, however this in common that they modify some earlier laws or customs, and transform others or forbid others.'
  - where: thread
    claim: 'One older reading: as a neighbor’s property was sacred, so the distinction of the sexes was to be kept sacred'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/22.htm'
    quote: 'As the property of a neighbour was to be sacred in the estimation of an Israelite, so also the divine distinction of the sexes, which was kept sacred in civil life by the clothing peculiar to each sex, was to be not less but even more sacredly observed.'
  - where: thread
    claim: 'One older reading: the bond of parent and young in the animal world was to be kept sacred; the bird law carries the same promise as the commandment to honor parents'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/22.htm'
    quote: 'The affectionate relation of parents to their young, which God had established even in the animal world, was also to be kept just as sacred. … placed upon a par with the commandment relating to parents, by the fact that obedience is urged upon the people by the same promise in both instances'
  - where: thread
    claim: 'One older reading: roofs were flat and lived on, so a parapet kept human life from danger; verses 9–11 forbid mixing what creation separates, repeating Lev. 19:19'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/22.htm'
    quote: 'Still less were they to expose human life to danger through carelessness. … The roofs of the Israelitish houses were flat, as they mostly are in the East, so that the inhabitants often lived upon them (Joshua 2:6; 2 Samuel 11:2; Matthew 10:27). - In Deuteronomy 22:9-11, there follow several prohibitions against mixing together the things which are separated in God''s creation'
  - where: thread
    claim: 'Discovering the father’s skirt is a euphemism; the law probably forbids marrying a stepmother'
    key: ot-manual-deuteronomy-17-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/deuteronomy-17-33-an-exhortation-to-obedience-part-2?lang=eng'
    quote: 'Discovering one’s skirt is a Hebrew euphemism similar to uncovering one’s nakedness (see Leviticus 18:6–19) and means to have sexual relations. Thus, this prohibition probably referred to a stepmother.'
  - where: thread
    claim: 'Numbers explains the fringes as a reminder of all the commandments'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/15?lang=eng'
    quote: 'And it shall be unto you for a fringe, that ye may look upon it, and remember all the commandments of the Lord, and do them'
  - where: 'note 22:1 “A brother’s ox, an enemy’s ox”'
    claim: 'The verb behind “hide thyself” in 22:1, 3, 4 means to hide oneself completely, utterly neglect to aid; the same form is in Isa. 58:7'
    key: bdb
    url: 'https://biblehub.com/hebrew/5956.htm'
    quote: 'Hithpa`el Perfect2masculine singular consecutive וְהִתְעַלַּמְתָּ מֵהֶם Deuteronomy 22:1,4 and thou hide thyself completely from them (utterly neglect to aid), so Infinitive construct (מֵהֶם omitted) לְהִתְעַלֵּם Deuteronomy 22:3; so also Imperfect with מִן, תִּתְעַלַּם Psalm 55:2, תִּתְעַלָּ֑ם Isaiah 58:7'
  - where: 'note 22:1 “A brother’s ox, an enemy’s ox”'
    claim: 'The verb behind “hide thyself” in Deut. 22:1 (lemma 5956)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'וְ/הִתְעַלַּמְתָּ֖'
  - where: 'note 22:1 “A brother’s ox, an enemy’s ox”'
    claim: 'The same verb (lemma 5956) in Isa. 58:7'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Isa.xml'
    quote: 'תִתְעַלָּֽם'
  - where: 'note 22:1 “A brother’s ox, an enemy’s ox”'
    claim: 'Exodus gives the law for the animal of one who hates you'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/23?lang=eng'
    quote: 'If thou see the ass of him that hateth thee lying under his burden, and wouldest forbear to help him, thou shalt surely help with him.'
  - where: 'note 22:5 “Men’s and women’s clothing”'
    claim: 'The Student Manual reads the law as forbidding the erasing of distinctions between men and women'
    key: ot-manual-deuteronomy-17-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/deuteronomy-17-33-an-exhortation-to-obedience-part-2?lang=eng'
    quote: 'A special prohibition in the law of Moses forbade men and women to wear each other’s clothing. … Any attempt to erase the obvious distinctions between men and women is unnatural and an abomination to the Lord.'
  - where: 'note 22:5 “Men’s and women’s clothing”'
    claim: 'BDB: keli is article, utensil, vessel; at Deut. 22:5 it is used of garments, parallel to a woman''s garment'
    key: bdb
    url: 'https://biblehub.com/hebrew/3627.htm'
    quote: 'article, utensil, vessel … specifically of garments (one''s ''things''):'
  - where: 'note 22:9 “Defiled means forfeited as holy”'
    claim: 'The verb in 22:9 is qadash (H6942)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'תִּקְדַּ֗שׁ'
  - where: 'note 22:9 “Defiled means forfeited as holy”'
    claim: 'BDB: at Deut. 22:9 the verb means consecrated, tabooed; in the Qal sense 2 the verb is hallowed by contact with sacred things (the lexicon lists 22:9 under sense 3, consecrated, tabooed)'
    key: bdb
    url: 'https://biblehub.com/hebrew/6942.htm'
    quote: '2 be hallowed, by contact with sacred things, and so tabooed from profane use, of forfeited to sanctuary … 3 consecrated, tabooed (above) Deuteronomy 22:9 (law against mixtures).'
  - where: 'note 22:13 “A bride falsely accused”'
    claim: 'The text of the law: the hundred shekels and no divorce; fifty shekels in verse 29'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/22?lang=eng'
    quote: 'Then the man that lay with her shall give unto the damsel’s father fifty shekels of silver, and she shall be his wife; because he hath humbled her, he may not put her away all his days.'
  - where: 'note 22:25 “Betrothed or not, in the city or in the field”'
    claim: 'One older reading: verses 23–29 are three separate laws (betrothed with consent, betrothed without, unbetrothed)'
    key: cambridge-deuteronomy
    url: 'https://biblehub.com/commentaries/cambridge/deuteronomy/22.htm'
    quote: '3rd. Of Dishonouring a Betrothed Virgin with her consent (Deuteronomy 22:23 f.); 4th. Of the Same without her consent (Deuteronomy 22:25-27); 5th. Of Dishonouring an Unbetrothed Virgin (Deuteronomy 22:28 f.)'
  - where: 'note 22:25 “Betrothed or not, in the city or in the field”'
    claim: 'One older reading: in the city she would have been heard, so she consented; the bride-price paid at betrothal makes her as good as married'
    key: cambridge-deuteronomy
    url: 'https://biblehub.com/commentaries/cambridge/deuteronomy/22.htm'
    quote: 'In the city she would have been heard had she cried, but as she did not she must have been a consenting party. … for the bride-price having been paid at betrothal the woman is as good as married'
  - where: 'note 22:25 “Betrothed or not, in the city or in the field”'
    claim: 'A betrothed couple were legally married though the marriage was not yet finalized'
    key: frederick-divorce
    url: 'https://rsc.byu.edu/household-god/marriage-divorce-remarriage-new-testament-world'
    quote: 'Legally, they are married, even though the marriage hasn’t been formally finalized through a wedding ceremony.'
  - where: 'note 22:25 “Betrothed or not, in the city or in the field”'
    claim: 'BDB: the verb of 22:25 is take hold of, seize, with violence'
    key: bdb
    url: 'https://biblehub.com/hebrew/2388.htm'
    quote: 'a. take hold of, seize, catch … with violence Deuteronomy 22:25; Deuteronomy 25:11'
  - where: 'note 22:25 “Betrothed or not, in the city or in the field”'
    claim: 'The verb of 22:25 (lemma 2388)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'וְ/הֶחֱזִֽיק'
  - where: 'note 22:25 “Betrothed or not, in the city or in the field”'
    claim: 'The verb of 22:28 is a different one (lemma 8610)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'וּ/תְפָשָׂ֖/הּ'
  - where: 'note 22:25 “Betrothed or not, in the city or in the field”'
    claim: 'One older reading: in the field the woman has the benefit of the doubt; the verb of verse 28 is not that of verse 25 and is not certainly rape'
    key: cambridge-deuteronomy
    url: 'https://biblehub.com/commentaries/cambridge/deuteronomy/22.htm'
    quote: '27. cried] Here at least the woman has the advantage of the doubt. … lay hold on her] Not the same vb as in Deuteronomy 22:25, usually explained as rape, but this is not certain.'
  - where: 'note 22:25 “Betrothed or not, in the city or in the field”'
    claim: 'Exodus lets the father refuse'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/22?lang=eng'
    quote: 'If her father utterly refuse to give her unto him, he shall pay money according to the dowry of virgins.'
  - where: christ
    claim: 'Mary, betrothed, was legally married to Joseph; under the law she and a consenting partner could be put to death; Joseph chose to put her away privily'
    key: frederick-divorce
    url: 'https://rsc.byu.edu/household-god/marriage-divorce-remarriage-new-testament-world'
    quote: 'Under the law of Moses, if the sexual relationship was consensual, both Mary and her partner could be put to death (although there is a question of how strict the death penalty was imposed at this time). Joseph was well within his right to make a “public example” of Mary’s situation'
  - where: christ
    claim: 'In John 8 Jesus invites the witnesses required by the law to step forward'
    key: frederick-divorce
    url: 'https://rsc.byu.edu/household-god/marriage-divorce-remarriage-new-testament-world'
    quote: 'Jesus is likely not stating, as is sometimes assumed, that only those who haven’t sinned should carry out punishment; rather, he is inviting the two witnesses to step forward and commence the execution.'
  - where: christ
    claim: 'Matthew calls Joseph a just man who would put Mary away privily'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/1?lang=eng'
    quote: 'Then Joseph her husband, being a just man, and not willing to make her a publick example, was minded to put her away privily.'
  - where: christ
    claim: 'The repentant are forgiven and their sins remembered no more'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/58?lang=eng'
    quote: 'Behold, he who has repented of his sins, the same is forgiven, and I, the Lord, remember them no more.'
  - where: christ
    claim: 'The Saints are required to forgive all men'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/64?lang=eng'
    quote: 'I, the Lord, will forgive whom I will forgive, but of you it is required to forgive all men.'
  - where: christ
    claim: 'D&C 64 is addressed to the Saints, commanded to forgive one another'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/64?lang=eng'
    quote: 'The Saints are commanded to forgive one another'
