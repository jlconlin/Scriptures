chapter: 23
claims:
  - where: when
    claim: 'Moses speaks in the fortieth year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/1?lang=eng'
    quote: 'And it came to pass in the fortieth year, in the eleventh month, on the first day of the month, that Moses spake unto the children of Israel'
  - where: setting
    claim: 'Chapters 12–26 are a code of laws, the nucleus of the book'
    key: bd-deuteronomy
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/deuteronomy?lang=eng'
    quote: '(2) 12–26, a code of laws, which forms the nucleus of the whole book.'
  - where: setting
    claim: 'One older reading: from the sanctification of the house Moses moves to the sanctification of the congregation: exclusion and reception, the camp, slaves and licentious persons, duties of citizenship'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/23.htm'
    quote: 'Moses proceeds to instructions concerning the sanctification of their union as a congregation: he gives directions as to the exclusion of certain persons from the congregation of the Lord, and the reception of others into it'
  - where: setting
    claim: 'After the exile the law excluding Ammonite and Moabite was read'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/13?lang=eng'
    quote: 'On that day they read in the book of Moses in the audience of the people; and therein was found written, that the Ammonite and the Moabite should not come into the congregation of God for ever;'
  - where: setting
    claim: 'Isaiah promises eunuchs a place and a name'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/56?lang=eng'
    quote: 'Even unto them will I give in mine house and within my walls a place and a name better than of sons and of daughters'
  - where: setting
    claim: 'Ruth''s son Obed was the grandfather of David'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ruth/4?lang=eng'
    quote: 'they called his name Obed: he is the father of Jesse, the father of David.'
  - where: setting
    claim: 'Jesus'' disciples used the allowance of 23:24–25 when they ate grain'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'Jesus’s disciples made use of this allowance when they ate the grain in the fields through which they passed (Matthew 12:1; Mark 2:23; Luke 6:1).'
  - where: thread
    claim: 'Vows were of two kinds: dedication and abstinence'
    key: bd-vows
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/vows?lang=eng'
    quote: 'These were of two kinds: (a) dedication—some person or thing was given to the Lord (Lev. 27:1–24); (b) abstinence—a promise made to abstain from some lawful act or enjoyment (Num. 6:3).'
  - where: thread
    claim: 'Vows were to be fulfilled without delay; not vowing was no sin'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/23.htm'
    quote: 'Vows vowed to the Lord were to be fulfilled without delay; but omitting to vow was not a sin.'
  - where: 'note 23:1 “Kept out of the congregation”'
    claim: 'The qahal of the LORD is the assembly of Israel; BDB lists Deut. 23 with Neh. 13:1'
    key: bdb
    url: 'https://biblehub.com/hebrew/6951.htm'
    quote: 'a. of Israel: יהוה ׳ק Micah 2:5; Numbers 16:3; Numbers 20:4 (P), 1 Chronicles 28:8; (׳י) ׳באבק Deuteronomy 23:2; Deuteronomy 23:3 (twice in verse); Deuteronomy 23:4 (twice in verse); Deuteronomy 23:9; Nehemiah 13:1'
  - where: 'note 23:1 “Kept out of the congregation”'
    claim: 'Isaiah 56:4 addresses eunuchs who keep the covenant'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/56?lang=eng'
    quote: 'For thus saith the Lord unto the eunuchs that keep my sabbaths, and choose the things that please me, and take hold of my covenant;'
  - where: 'note 23:2 “Not simply a child born out of wedlock”'
    claim: 'BDB: mamzer, bastard, specifically child of incest'
    key: bdb
    url: 'https://biblehub.com/hebrew/4464.htm'
    quote: 'מַמְזֵר noun masculine bastard, specifically child of incest'
  - where: 'note 23:2 “Not simply a child born out of wedlock”'
    claim: 'One older reading: not illegitimate children generally but children of incest or adultery; etymology obscure'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/23.htm'
    quote: 'not persons begotten out of wedlock, illegitimate children generally (lxx, Vulg.), but, according to the Talmud and the Rabbins, those who were begotten in incest or adultery (cf. Ges. thes. p. 781). The etymology of the word is obscure.'
  - where: 'note 23:2 “Not simply a child born out of wedlock”'
    claim: 'Ten is the number of complete exclusion; so verse 3 adds for ever'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/23.htm'
    quote: 'Ten is the number of complete exclusion. In Deuteronomy 23:3, therefore, "for ever" is added.'
  - where: 'note 23:3 “Ammon, Moab, Balaam and Ruth”'
    claim: 'Balak was king of Moab'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/22?lang=eng'
    quote: 'And Balak the son of Zippor was king of the Moabites at that time.'
  - where: 'note 23:3 “Ammon, Moab, Balaam and Ruth”'
    claim: 'Balak asked Balaam to curse Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/22?lang=eng'
    quote: 'Come now therefore, I pray thee, curse me this people; for they are too mighty for me'
  - where: 'note 23:3 “Ammon, Moab, Balaam and Ruth”'
    claim: 'Balaam blessed Israel three times'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/24?lang=eng'
    quote: 'I called thee to curse mine enemies, and, behold, thou hast altogether blessed them these three times.'
  - where: 'note 23:3 “Ammon, Moab, Balaam and Ruth”'
    claim: 'The strained relationship between Israel and Moab is highlighted by Deut. 23:3–6'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'This strained relationship between Israel and Moab is highlighted by Deuteronomy’s prohibition on Moabites participating in the Israelite community for up to ten generations (Deuteronomy 23:3–6).'
  - where: 'note 23:3 “Ammon, Moab, Balaam and Ruth”'
    claim: 'Ruth''s marriage makes Israel and Moab ancestors of David and Jesus; a social reality not envisioned in Deuteronomy'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'it connects the Israelites and Moabites as the ancestors for both King David (Ruth 4:18–22) and the messianic Jesus (Matthew 1:1–17; Luke 3:32).[16] Thus the book of Ruth portrays “a social reality that is not envisioned in Deuteronomy.”'
  - where: 'note 23:3 “Ammon, Moab, Balaam and Ruth”'
    claim: 'Later rabbis read the masculine language as applying only to Moabite men'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'The later rabbis were aware of the tension between the Deuteronomic prohibition and the story of Ruth. They focus on the fact that the language of the commandment is masculine and so applies only to Moabite men and not women such as Ruth'
  - where: 'note 23:3 “Ammon, Moab, Balaam and Ruth”'
    claim: 'Obed, son of Ruth, father of Jesse'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ruth/4?lang=eng'
    quote: 'they called his name Obed: he is the father of Jesse, the father of David.'
  - where: 'note 23:3 “Ammon, Moab, Balaam and Ruth”'
    claim: 'Matthew names Obed of Ruth in Jesus'' genealogy'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/1?lang=eng'
    quote: 'And Salmon begat Booz of Rachab; and Booz begat Obed of Ruth; and Obed begat Jesse;'
  - where: 'note 23:7 “Edom the brother, Egypt the host”'
    claim: 'Esau was called Edom'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/25?lang=eng'
    quote: 'And Esau said to Jacob, Feed me, I pray thee, with that same red pottage; for I am faint: therefore was his name called Edom.'
  - where: 'note 23:7 “Edom the brother, Egypt the host”'
    claim: 'Edom threatened Israel with the sword'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/20?lang=eng'
    quote: 'And Edom said unto him, Thou shalt not pass by me, lest I come out against thee with the sword.'
  - where: 'note 23:7 “Edom the brother, Egypt the host”'
    claim: 'In Exodus the reminder that Israel were strangers in Egypt taught care for the weakest with sympathy'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'The reminder that the Israelites had themselves lived as marginalized, enslaved, and displaced “strangers” in Egypt helped them to recognize their obligation to care for their society’s weakest members and to do so with sympathy'
  - where: 'note 23:7 “Edom the brother, Egypt the host”'
    claim: 'The Egyptians enslaved Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/1?lang=eng'
    quote: 'And the Egyptians made the children of Israel to serve with rigour'
  - where: 'note 23:14 “Why a war camp must be clean”'
    claim: 'The covenant promise that the LORD will walk among Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/26?lang=eng'
    quote: 'And I will walk among you, and will be your God, and ye shall be my people.'
  - where: 'note 23:15 “Refuge for a runaway slave”'
    claim: 'One older reading: a slave fled from a foreign country and a harsh heathen master'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/23.htm'
    quote: 'The reference is to a slave who had fled to them from a foreign country, on account of the harsh treatment which he had received from his heathen master.'
  - where: 'note 23:18 “The hire of a whore and the price of a dog”'
    claim: 'BDB: qadesh, temple-prostitute (man), in Deut. 23:18 (Hebrew numbering)'
    key: bdb
    url: 'https://biblehub.com/hebrew/6945.htm'
    quote: 'I. קָדֵּשׁ noun masculine temple-prostitute (man) (compare RSProph. ii. N. 19, and see Assyrian Sub √); — ׳ק Deuteronomy 23:18'
  - where: 'note 23:18 “The hire of a whore and the price of a dog”'
    claim: 'Nothing intrinsically unholy could be offered as a vow, citing Deut. 23:18'
    key: bd-vows
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/vows?lang=eng'
    quote: 'Nothing already holy to the Lord, or intrinsically unholy, or blemished in the slightest degree, could be offered as a vow (Lev. 22:23; 27:26; Deut. 23:18).'
  - where: 'note 23:25 “The disciples in the grainfield”'
    claim: 'Verses 24–25 were safeguards against hunger and protection of the poor; the disciples used the allowance'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'Deuteronomy 23:24–25 allowed the Israelites to eat from, but not gather up, the grapes in their neighbors’ vineyards and the grain in their neighbors vineyards as safeguards against hunger and as a protection of the poor. Jesus’s disciples made use of this allowance'
  - where: 'note 23:25 “The disciples in the grainfield”'
    claim: 'The disciples plucked ears on the Sabbath'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/12?lang=eng'
    quote: 'At that time Jesus went on the sabbath day through the corn; and his disciples were an hungred, and began to pluck the ears of corn, and to eat.'
  - where: 'note 23:25 “The disciples in the grainfield”'
    claim: 'The Pharisees objected to the Sabbath'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/12?lang=eng'
    quote: 'But when the Pharisees saw it, they said unto him, Behold, thy disciples do that which is not lawful to do upon the sabbath day.'
  - where: christ
    claim: 'Philip preached Jesus to the Ethiopian eunuch and baptized him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/8?lang=eng'
    quote: 'Then Philip opened his mouth, and began at the same scripture, and preached unto him Jesus.'
  - where: christ
    claim: 'Ruth an ancestor of David and Jesus'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'it connects the Israelites and Moabites as the ancestors for both King David (Ruth 4:18–22) and the messianic Jesus (Matthew 1:1–17; Luke 3:32).'
  - where: christ
    claim: 'The Son of man is Lord of the Sabbath'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/12?lang=eng'
    quote: 'For the Son of man is Lord even of the sabbath day.'
  - where: christ
    claim: 'Christ denies none who come to Him; all are alike to God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/26?lang=eng'
    quote: 'and he denieth none that come unto him, black and white, bond and free, male and female; and he remembereth the heathen; and all are alike unto God, both Jew and Gentile.'
  - where: christ
    claim: 'The stranger who takes hold of the covenant'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/56?lang=eng'
    quote: 'Also the sons of the stranger, that join themselves to the Lord, to serve him, and to love the name of the Lord, to be his servants, every one that keepeth the sabbath from polluting it, and taketh hold of my covenant;'
  - where: christ
    claim: 'The strangers are brought to His holy mountain'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/56?lang=eng'
    quote: 'Even them will I bring to my holy mountain, and make them joyful in my house of prayer'
