chapter: 12
claims:
  - where: when
    claim: 'Moses speaks in the fortieth year, in the land of Moab'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/1?lang=eng'
    quote: 'And it came to pass in the fortieth year, in the eleventh month, on the first day of the month, that Moses spake unto the children of Israel'
  - where: setting
    claim: 'Chapters 12–26 are a code of laws, the nucleus of the book; the first group begins with destroying idolatrous objects and allows one central place of worship'
    key: bd-deuteronomy
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/deuteronomy?lang=eng'
    quote: '(2) 12–26, a code of laws, which forms the nucleus of the whole book. The first group of laws deals with the ritual of religion and begins with a command to destroy all idolatrous objects of worship in Canaan; only one central place for worship of Jehovah is to be allowed.'
  - where: setting
    claim: 'The code restates the covenant expectations in the context of Israel’s exclusive relationship with the LORD and its coming inheritance of the land'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'the Deuteronomic Code (Deuteronomy 12–26), reiterates the Lord’s covenant expectations for the Israelites in the context of their exclusive relationship with him and their imminent inheritance of the land of promise.'
  - where: setting
    claim: 'Josiah, a contemporary of Lehi, reformed worship by a book many scholars take to be a form of Deuteronomy, following its centralization of worship'
    key: seely-lehi-altar
    url: 'https://archive.bookofmormoncentral.org/content/lehi%E2%80%99s-altar-and-sacrifice-wilderness'
    quote: 'In the course of Josiah’s reforms (King Josiah was a contemporary of Lehi), a book was discovered in the temple that many scholars believe was some form of the book of Deuteronomy.'
  - where: setting
    claim: 'Centralization was a revolutionary law that would change the worship of every person in Israel'
    key: seely-lehi-altar
    url: 'https://archive.bookofmormoncentral.org/content/lehi%E2%80%99s-altar-and-sacrifice-wilderness'
    quote: 'In its own way the centralization of worship was a revolutionary law that, when implemented, would change the practice of Israelite religion in a very dramatic way.'
  - where: setting
    claim: 'Josiah’s reform dictated the centralization of worship, an injunction found only in Deuteronomy 12'
    key: seely-lehi-altar
    url: 'https://archive.bookofmormoncentral.org/content/lehi%E2%80%99s-altar-and-sacrifice-wilderness'
    quote: 'The reforms of Josiah dictated the centralization of worship, which included the commandment that altars and sacrifices should be limited to one place. The only place in scripture that this injunction is found is in Deuteronomy 12.'
  - where: 'note 12:13 “Lehi’s altar and the Nephite temples”'
    claim: 'Lehi’s altar was three days’ journey outside Jerusalem'
    key: shannon-documentary
    url: 'https://rsc.byu.edu/they-shall-grow-together/documentary-hypothesis-book-mormon'
    quote: 'Lehi’s building of an altar at a location that was three days’ journey outside Jerusalem'
  - where: thread
    claim: 'The code opens with what Israel must do in the land to remain distinct from the nations'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'what Yahweh requires the Israelites to “do in the land”—that is, in the promised land—once they had entered and inherited it, and what Yahweh requires them to do to remain a distinct people in the land from the rest of the nations.'
  - where: thread
    claim: 'The “de-Canaanization” and centralization laws of chapter 12 serve to keep Israel from becoming like the nations'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'All of the “de-Canaanization” and cult centralization legislation of Deuteronomy 12 is given to that end. This legislation obligated the Israelites to not seek after those nations’ gods or cults.'
  - where: thread
    claim: 'The chapter falls into 2–4, 5–14, 15–19, 20–28, 29–31'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/12.htm'
    quote: 'commence with a command to destroy and annihilate all places and memorials of the Canaanitish worship (Deuteronomy 12:2-4), and then lay it down as an established rule, that the Israelites were to worship the Lord their God with sacrifices and gifts, only in the place which He Himself should choose (Deuteronomy 12:5-14).'
  - where: thread
    claim: 'Verse 8: “right in his own eyes” means by one’s own judgment; one older reading takes it as probably less open idolatry (which was practised) than irregularities excused by the wandering, such as sacrifices omitted when the tabernacle was not set up'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/12.htm'
    quote: 'applied to actions performed according to a man''s own judgment, rather than according to the standard of objective right and the law of God (cf. Judges 17:6; Judges 21:25). The reference is probably not so much to open idolatry, which was actually practised, according to Leviticus 17:7; Numbers 25:1; Ezekiel 20:16-17; Amos 5:25-26, as to acts of illegality'
  - where: thread
    claim: 'One older reading: such as the omission of the daily sacrifice when the tabernacle was not set up'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/12.htm'
    quote: 'for which some excuse might be found in the circumstances in which they were placed when wandering through the desert, - such, for example, as the omission of the daily sacrifice when the tabernacle was not set up'
  - where: 'note 12:5 “Which place, and why only one”'
    claim: 'Deuteronomy does not name Jerusalem; in biblical tradition its temple became the place; Solomon called it the place where the Lord would put His name'
    key: seely-lehi-altar
    url: 'https://archive.bookofmormoncentral.org/content/lehi%E2%80%99s-altar-and-sacrifice-wilderness'
    quote: 'While the temple in Jerusalem is not specified at the time of Deuteronomy 12, in biblical tradition that temple became the authorized place. When King Solomon dedicated the temple, he declared it to be the place where the Lord would put his name (1 Kings 8:29).'
  - where: 'note 12:5 “Which place, and why only one”'
    claim: 'The tabernacle was set up at Shiloh; the LORD set His name there first; Solomon built the temple on the threshing floor David had prepared'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/18?lang=eng'
    quote: 'And the whole congregation of the children of Israel assembled together at Shiloh, and set up the tabernacle of the congregation there.'
  - where: 'note 12:5 “Which place, and why only one”'
    claim: 'Solomon built the temple in the place David had prepared on the threshing floor'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/3?lang=eng'
    quote: 'Then Solomon began to build the house of the Lord at Jerusalem in mount Moriah, where the Lord appeared unto David his father, in the place that David had prepared in the threshingfloor of Ornan the Jebusite.'
  - where: 'note 12:5 “Which place, and why only one”'
    claim: 'Altars to Jehovah stood at high places and became local centers; idolatry corrupted many; Hezekiah and Josiah centralized worship in Jerusalem'
    key: bd-high-places
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/high-places?lang=eng'
    quote: 'Such altars became local centers of the worship of Jehovah. When idolatry came in, many of these altars were desecrated and used for heathen worship. Religious reformers like Hezekiah and Josiah tried therefore to centralize the worship more and more in Jerusalem'
  - where: 'note 12:5 “Which place, and why only one”'
    claim: 'Sacrifice continued at the high places after the temple was built; the prophets condemned them; Josiah finally centralized worship according to Deuteronomy 12'
    key: seely-lehi-altar
    url: 'https://archive.bookofmormoncentral.org/content/lehi%E2%80%99s-altar-and-sacrifice-wilderness'
    quote: 'Yet even after the temple was built, sacrifices and offerings continued throughout Israel, most notably at the high places (1 Kings 12:26–33; 2 Kings 16:4), which were uniformly condemned by the prophets … Later, Josiah (640–609 BC) finally centralized worship in Jerusalem according to the injunction in Deuteronomy 12'
  - where: 'note 12:12 “The household’s feast, and the Levite at the table”'
    claim: 'Centralization affected tithes and firstlings, the festivals and the Levites, and so the worship of every person; festivals moved from villages to the central altar'
    key: seely-lehi-altar
    url: 'https://archive.bookofmormoncentral.org/content/lehi%E2%80%99s-altar-and-sacrifice-wilderness'
    quote: 'the offering of tithes and firstlings (Deuteronomy 14:22–26), the celebration of the holidays (Deuteronomy 16:1–17), the cities of refuge (Deuteronomy 19:1–9), and the enfranchisement of the Levites (Deuteronomy 18:6–8)—centralization would also affect the worship of every person in Israel. For example, because sacrifice was an integral part of all of the festivals, these festivals would no longer be celebrated in the various villages, but only at the central altar'
  - where: 'note 12:13 “Lehi’s altar and the Nephite temples”'
    claim: 'In Lehi’s time it was widely understood and enforced that Jerusalem was the only place of sacrifice'
    key: seely-lehi-altar
    url: 'https://archive.bookofmormoncentral.org/content/lehi%E2%80%99s-altar-and-sacrifice-wilderness'
    quote: 'any explanation of Lehi’s altar and sacrifices must deal with the biblical evidence that, during Lehi’s time, it was widely understood and enforced that Jerusalem was the only place where sacrifice could be offered.'
  - where: 'note 12:13 “Lehi’s altar and the Nephite temples”'
    claim: 'First possibility: Deuteronomy 12 did not at first intend to end all sacrifice away from the main sanctuary; altars and other temples continued'
    key: seely-lehi-altar
    url: 'https://archive.bookofmormoncentral.org/content/lehi%E2%80%99s-altar-and-sacrifice-wilderness'
    quote: 'The first possibility is that the injunction in Deuteronomy did not originally intend to eliminate all sacrifice outside of the Jerusalem temple. The fact that, after the Israelite possession of the land, altars and sacrifice and even other temples continued at various places'
  - where: 'note 12:13 “Lehi’s altar and the Nephite temples”'
    claim: 'Second: Lehi, not a Levite, officiated by the Melchizedek Priesthood and may not have been bound; the Book of Mormon does not give enough data'
    key: seely-lehi-altar
    url: 'https://archive.bookofmormoncentral.org/content/lehi%E2%80%99s-altar-and-sacrifice-wilderness'
    quote: 'Because Lehi and his descendants held this priesthood, they may not have been constrained by all of the injunctions of the law of Moses. … The Book of Mormon simply does not provide enough data.'
  - where: 'note 12:13 “Lehi’s altar and the Nephite temples”'
    claim: 'Third: the law may have been read as applying only to the land of Israel, per 12:1; the Temple Scroll read it so; some rabbis did not condemn the temple of Onias in Egypt'
    key: seely-lehi-altar
    url: 'https://archive.bookofmormoncentral.org/content/lehi%E2%80%99s-altar-and-sacrifice-wilderness'
    quote: 'the author of the Temple Scroll embraced the opinion that the law of centralization of worship applied only in the land of Israel in line with Deuteronomy 12:1’s opening declaration … some of the ancient rabbis did not condemn the temples, altars, or sacrifices in the Jewish temple of Onias in Egypt'
  - where: 'note 12:13 “Lehi’s altar and the Nephite temples”'
    claim: 'By Lehi’s time Jerusalem was understood as “the place”; his altar was three days outside Jerusalem'
    key: shannon-documentary
    url: 'https://rsc.byu.edu/they-shall-grow-together/documentary-hypothesis-book-mormon'
    quote: 'By Lehi’s time, the Judahites seem to have understood Jerusalem as “the place” that God chose out of the tribes, as signified by the temple in Jerusalem (see the condemnation of the Judahite king Manasseh in 2 Kings 21:4).'
  - where: 'note 12:13 “Lehi’s altar and the Nephite temples”'
    claim: 'The Nephites had more than one temple with sacrifice (Nephi’s, Zarahemla, Bountiful) and did not centralize; the law was not operative among them'
    key: shannon-documentary
    url: 'https://rsc.byu.edu/they-shall-grow-together/documentary-hypothesis-book-mormon'
    quote: 'The Nephites seem never to have construed their temples as a single place for the Lord to be and for them to offer sacrifice. … Thus it is clear that the Nephites did not centralize the location of their cult and sacrifices in the way that Deuteronomy commands … In any case, it was not operative among them.'
  - where: 'note 12:13 “Lehi’s altar and the Nephite temples”'
    claim: 'Lehi built an altar in the wilderness and made an offering'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/2?lang=eng'
    quote: 'And it came to pass that he built an altar of stones, and made an offering unto the Lord, and gave thanks unto the Lord our God.'
  - where: 'note 12:15 “Meat at home, blood on the ground”'
    claim: 'Under Leviticus 17 even slaughter for food was a kind of sacrifice; Deuteronomy 12 allowed secular slaughter where no altar was; the blood poured out, presumably for the sanctity of life'
    key: seely-lehi-altar
    url: 'https://archive.bookofmormoncentral.org/content/lehi%E2%80%99s-altar-and-sacrifice-wilderness'
    quote: 'according to Leviticus 17, even the slaughter of clean animals was considered a type of sacrifice that had to be performed at an altar … it also gave instructions for “secular slaughter,” whereby an animal could be killed for human consumption even where no altar existed'
  - where: 'note 12:15 “Meat at home, blood on the ground”'
    claim: 'The blood was poured to the earth, presumably as a symbol of the sanctity of life'
    key: seely-lehi-altar
    url: 'https://archive.bookofmormoncentral.org/content/lehi%E2%80%99s-altar-and-sacrifice-wilderness'
    quote: 'the blood was to be “poured to the earth,” presumably as a symbol recognizing the sanctity of life as first described in Genesis 9:4'
  - where: 'note 12:15 “Meat at home, blood on the ground”'
    claim: 'One older reading: the roebuck and hart were never sacrificed, so the eater’s cleanness did not matter'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/12.htm'
    quote: 'Flesh that was slaughtered for food could be eaten by both clean and unclean, such for example as the roebuck and the hart, animals which could not be offered in sacrifice, and in which, therefore, the distinction between clean and unclean on the part of the eaters did not come into consideration at all.'
  - where: 'note 12:31 “Children burned to their gods”'
    claim: 'Child sacrifice was arguably the worst of the nations’ abominations'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'Child sacrifice arguably constituted the worst of those nations’ abominations (Deuteronomy 12:30–31).'
  - where: 'note 12:31 “Children burned to their gods”'
    claim: 'Molech, a fire god, was worshipped by burning children; Solomon, the Northern Kingdom, Ahaz and Manasseh practiced it'
    key: bd-molech
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/molech?lang=eng'
    quote: 'The abomination of the children of Ammon, a fire god, worshipped by passing children through or burning them in fire (Deut. 18:10; 2 Chr. 28:3). Molech worship was practiced by Solomon (1 Kgs. 11:5, 7); by the people of the Northern Kingdom (2 Kgs. 17:17); and by Ahaz and Manasseh'
  - where: christ
    claim: 'The Nephite temple where Jacob spoke was the place where the Lord chose to put His name'
    key: sc-knowhy-36
    url: 'https://scripturecentral.org/knowhy/why-does-an-angel-reveal-the-name-of-christ-to-jacob'
    quote: 'The temple, where Jacob’s address was delivered, was the place where the Lord chose to put his name (see Deuteronomy 12:11; 16:6).'
  - where: 'note 12:13 “Lehi’s altar and the Nephite temples”'
    claim: 'The Nephites may have applied 12:5 to Zarahemla, but the temple in Bountiful, where the risen Jesus appeared, makes that problematic'
    key: shannon-documentary
    url: 'https://rsc.byu.edu/they-shall-grow-together/documentary-hypothesis-book-mormon'
    quote: 'It is possible that the Nephites applied Deuteronomy 12:5—“the place which the Lord your God shall . . . put his name”—to Zarahemla, but that identification would make the temple in Bountiful, where the risen Jesus appeared to the people, problematic.'
  - where: christ
    claim: 'In D&C 110 Jehovah appears and accepts the Kirtland Temple'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/110?lang=eng'
    quote: '1–10, The Lord Jehovah appears in glory and accepts the Kirtland Temple as His house'
