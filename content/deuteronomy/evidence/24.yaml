chapter: 24
claims:
  - where: when
    claim: 'Moses speaks in the plains of Moab in the fortieth year after the Exodus'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/1?lang=eng'
    quote: 'And it came to pass in the fortieth year, in the eleventh month, on the first day of the month, that Moses spake unto the children of Israel'
  - where: setting
    claim: 'Chapters 12–26 are a code of laws, the nucleus of the book; its groups include one that regulates private and social rights'
    key: bd-deuteronomy
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/deuteronomy?lang=eng'
    quote: '(2) 12–26, a code of laws, which forms the nucleus of the whole book. … The next group of laws deals with the administration of justice, while the last group regulates private and social rights.'
  - where: setting
    claim: 'Verse 7 repeats the law against man-stealing in Exodus 21:16'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/24.htm'
    quote: 'Repetition of the law against man-stealing (Exodus 21:16).'
  - where: setting
    claim: 'Verses 12–13 repeat the Exodus law of the pledged garment'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/24.htm'
    quote: 'This was to be returned to him in the evening. (A repetition of Exodus 22:25-26.)'
  - where: setting
    claim: 'Verses 17–18 repeat the Exodus law on the stranger, orphan and widow and add the widow’s raiment'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/24.htm'
    quote: 'the law against perverting the right of strangers, orphans, and widows, is repeated from Exodus 22:20-21, and Exodus 23:9; and an addition is made, namely, that they were not to take a widow''s raiment in pledge'
  - where: setting
    claim: 'Jeremiah 3:1 restates the divorce law'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/3?lang=eng'
    quote: 'If a man put away his wife, and she go from him, and become another man’s, shall he return unto her again?'
  - where: setting
    claim: 'Amos 2:8 reproves breaches of the pledge laws'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/24.htm'
    quote: 'Breaches of this commandment are reproved in Amos 2:8; Job 22:6; Proverbs 20:16; Proverbs 22:27; Proverbs 27:13.'
  - where: setting
    claim: 'Amaziah spared the murderers’ children according to the law of Moses (2 Kgs. 14:6)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/14?lang=eng'
    quote: 'But the children of the murderers he slew not: according unto that which is written in the book of the law of Moses'
  - where: setting
    claim: 'Jesus taught on divorce in the Sermon on the Mount and to the Nephites'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/12?lang=eng'
    quote: 'It hath been written, that whosoever shall put away his wife, let him give her a writing of divorcement.'
  - where: thread
    claim: 'The code forbade practices that led to the oppression and extortion of vulnerable persons (pledges, wages)'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'Using a mix of casuistic and apodictic statutes, the Deuteronomic Code forbade practices that could easily lead to the oppression and extortion of vulnerable persons.'
  - where: thread
    claim: 'Behind the covenant laws is the idea that God aids those unable to help themselves, and those who know his redemption are to do likewise (24:17)'
    key: muhlestein-love-neighbor
    url: 'https://rsc.byu.edu/covenant-compassion/covenantal-command'
    quote: 'Underlying the laws and descriptions of the covenant is the idea that God comes to the aid of those who are unable to help themselves; similar conduct is expected of those who are in a covenant relationship with him'
  - where: 'note 24:1 “Some uncleanness, and the argument it started”'
    claim: 'ʿerwat dabar means nakedness of a thing, probably indecency, improper behaviour'
    key: bdb
    url: 'https://biblehub.com/hebrew/6172.htm'
    quote: 'עֶרְוַת דָּבָר nakedness of a thing, i.e. probably indecency, improper behaviour Deuteronomy 23:15; Deuteronomy 24:1'
  - where: 'note 24:1 “Some uncleanness, and the argument it started”'
    claim: 'The phrase is notoriously difficult to comprehend'
    key: frederick-divorce
    url: 'https://rsc.byu.edu/household-god/marriage-divorce-remarriage-new-testament-world'
    quote: 'This phrase is notoriously difficult to fully comprehend, hence the high level of attention it received in the first century.'
  - where: 'note 24:1 “Some uncleanness, and the argument it started”'
    claim: 'Shammai read the phrase almost exclusively as adultery; Hillel as anything indecent, even a burned dinner'
    key: frederick-divorce
    url: 'https://rsc.byu.edu/household-god/marriage-divorce-remarriage-new-testament-world'
    quote: 'The more conservative school of Shammai interpreted ʿerwaṯ dāḇār to refer almost exclusively to adultery … The more liberal school of Hillel interpreted ʿerwaṯ dāḇār to include anything that the husband might find indecent about the wife, including occasions when she burned dinner.'
  - where: 'note 24:1 “Some uncleanness, and the argument it started”'
    claim: 'The Pharisees’ question in Matthew 19 falls within the Shammai/Hillel debate; Jesus answers from Genesis rather than Deut. 24:1'
    key: frederick-divorce
    url: 'https://rsc.byu.edu/household-god/marriage-divorce-remarriage-new-testament-world'
    quote: 'Their question, “Is it lawful for a man to put away his wife for every cause?” falls clearly within the school of Shammai/school of Hillel debate. … Rather than engage Deuteronomy 24:1 directly, Jesus makes an argument based on Genesis 1–2'
  - where: 'note 24:1 “Some uncleanness, and the argument it started”'
    claim: 'Jesus calls divorce a concession because of hardness of heart'
    key: frederick-divorce
    url: 'https://rsc.byu.edu/household-god/marriage-divorce-remarriage-new-testament-world'
    quote: 'Jesus further contends that the option for divorce was a concession given to the people “because of the hardness of your hearts” (Matthew 19:8).'
  - where: 'note 24:1 “Some uncleanness, and the argument it started”'
    claim: 'Divorce was permitted because of hardness of heart; from the beginning it was not so'
    key: bd-divorce
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/divorce?lang=eng'
    quote: 'Permitted under some circumstances because of the hardness of the people’s hearts, but as explained by Jesus, “from the beginning it was not so” (Matt. 19:3–12).'
  - where: 'note 24:1 “Some uncleanness, and the argument it started”'
    claim: 'Jesus allowed divorce for fornication, in the Sermon on the Mount and to the Nephites'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/12?lang=eng'
    quote: 'Verily, verily, I say unto you, that whosoever shall put away his wife, saving for the cause of fornication, causeth her to commit adultery'
  - where: 'note 24:1 “Some uncleanness, and the argument it started”'
    claim: 'The bill let a divorced woman remarry; the restriction is that the first husband may not remarry her'
    key: ot-manual-deuteronomy-17-33
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/deuteronomy-17-33-an-exhortation-to-obedience-part-2?lang=eng'
    quote: 'The purpose of a “bill of divorcement” (v. 3) was that a woman divorced by her husband could remarry if she desired. The restriction here is that one who has divorced his wife may not later change his mind and remarry her.'
  - where: 'note 24:4 “Why she could not go back to the first husband”'
    claim: 'The purpose of 24:1–4 seems to be to restrict a loophole so that divorce would not be too easy'
    key: frederick-divorce
    url: 'https://rsc.byu.edu/household-god/marriage-divorce-remarriage-new-testament-world'
    quote: 'The overall purpose of Deuteronomy 24:1–4 seems to be to restrict what could have been perceived as a loophole in the law, because “If divorce became too easy, then it could be abused'
  - where: 'note 24:4 “Why she could not go back to the first husband”'
    claim: 'One older reading: the rule put a check on frivolous divorce; a husband would reflect before divorcing'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/24.htm'
    quote: 'would necessarily put a check upon frivolous divorces. … whilst, on the one hand, the man would reflect when inducements to divorce his wife presented themselves, and would recall a rash act if it had been performed'
  - where: 'note 24:4 “Why she could not go back to the first husband”'
    claim: 'One older reading: the defilement is moral; the second marriage was placed on a par with adultery, an approach to Christ’s teaching'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/24.htm'
    quote: 'Thus the second marriage of a divorced woman was placed implicite upon a par with adultery, and some approach made towards the teaching of Christ concerning marriage'
  - where: 'note 24:4 “Why she could not go back to the first husband”'
    claim: 'One older reading: a reunion would make the woman appear like property disposed of and reclaimed'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/24.htm'
    quote: 'such a reunion would lower the dignity of the woman, and the woman would appear too much like property, which could be disposed of at one time and reclaimed at another'
  - where: 'note 24:4 “Why she could not go back to the first husband”'
    claim: 'Jeremiah 3:1 sets Israel in the divorced wife’s place and yet calls her back'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/3?lang=eng'
    quote: 'but thou hast played the harlot with many lovers; yet return again to me, saith the LORD.'
  - where: 'note 24:6 “What a lender could not take”'
    claim: 'One older reading: the handmill was indispensable for daily food; taking either stone injured life itself'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/24.htm'
    quote: 'Neither the whole mill nor the upper millstone was to be asked for as a pledge, by which the mill would be rendered useless, since the handmill was indispensable for preparing the daily food for the house; so that whoever took them away injured life itself'
  - where: 'note 24:6 “What a lender could not take”'
    claim: 'The upper millstone is the runner'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/24.htm'
    quote: 'רחים, the handmill; רכב, lit., the runner, i.e., the upper millstone.'
  - where: 'note 24:6 “What a lender could not take”'
    claim: 'The borrower chooses the pledge, so as not to be forced to give up something indispensable'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/24.htm'
    quote: 'The meaning is, that they were to leave it to the borrower to give a pledge, and not compel him to give up something as a pledge that might be indispensable to him.'
  - where: 'note 24:6 “What a lender could not take”'
    claim: 'The poor man often had only the upper garment he slept in to pledge'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/24.htm'
    quote: 'the poor man had very often nothing but his upper garment, in which he slept, to give as a pledge.'
  - where: 'note 24:6 “What a lender could not take”'
    claim: 'The code forbade taking a pledge inside the borrower’s house and required clothing returned by sundown'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'The one making a loan could not take a pledge inside the house of the borrower (Deuteronomy 24:11). Clothing taken from poor people as pledges had to be returned before sundown (24:12–13).'
  - where: 'note 24:6 “What a lender could not take”'
    claim: 'Amos 2:8 reproves breaches of the law'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/24.htm'
    quote: 'Breaches of this commandment are reproved in Amos 2:8'
  - where: 'note 24:15 “Paid before sundown”'
    claim: 'The code protected hired servants, Israelite or foreign, and required pay by sundown'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'The code forbade Israelites from oppressing hired servants, whether native Israelite or migrant foreigners (24:14), and required employers to pay them for a day’s labor by sundown (24:15).'
  - where: 'note 24:16 “Each for his own sin”'
    claim: 'Amaziah slew his father’s murderers but not their children'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/14?lang=eng'
    quote: 'he slew his servants which had slain the king his father.'
  - where: 'note 24:16 “Each for his own sin”'
    claim: 'Israelite law did not allow vicarious punishment, unlike some neighbors (24:16; Ezek. 18:20)'
    key: sc-knowhy-142
    url: 'https://scripturecentral.org/knowhy/why-must-there-be-an-infinite-and-eternal-sacrifice'
    quote: 'In contrast to some practices of their neighbors, Israelite law did not allow for vicarious punishment, but insisted “every man shall be put to death for his own sin” (Deuteronomy 24:16; cf. Ezekiel 18:20).'
  - where: 'note 24:19 “The forgotten sheaf”'
    claim: 'Elsewhere the owner gleaned his own field; in Israel gleanings were left for those in need'
    key: muhlestein-love-neighbor
    url: 'https://rsc.byu.edu/covenant-compassion/covenantal-command'
    quote: 'In most societies the owner of the field could either glean it himself or hire others to do it for him. This was not the case in Israel, for the gleanings were meant to be left for those in need'
  - where: 'note 24:19 “The forgotten sheaf”'
    claim: 'Forgotten sheaves and olives not beaten a second time were left; the promised prosperity would more than make up the loss'
    key: muhlestein-love-neighbor
    url: 'https://rsc.byu.edu/covenant-compassion/covenantal-command'
    quote: 'Any sheaves that were forgotten as they were initially gathered to threshing floors were to be left for the poor (Deuteronomy 24:19). Olive trees were not to be beaten a second time … would more than make up for what they had lost in leaving these things for those in need'
  - where: 'note 24:19 “The forgotten sheaf”'
    claim: 'The poor have little or no land; the law lets them glean (Lev. 19:10; Deut. 24:19–21)'
    key: seely-cry-widow
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/cry-widow-fatherless-stranger'
    quote: 'identify people who have little or no money, land, or possessions and thus have little power, influence, or social standing. The law of Moses defines the rights of the poor and legislates programs to help them'
  - where: christ
    claim: 'Israelite law did not allow vicarious punishment; Amulek makes the same point (Alma 34:11)'
    key: sc-knowhy-142
    url: 'https://scripturecentral.org/knowhy/why-must-there-be-an-infinite-and-eternal-sacrifice'
    quote: 'Israelite law did not allow for vicarious punishment … Similarly, Amulek asked the Zoramites, “Now, if a man murdereth, behold will our law, which is just, take the life of his brother?”'
  - where: christ
    claim: 'Amulek: the great and last sacrifice is the Son of God, infinite and eternal'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/34?lang=eng'
    quote: 'and that great and last sacrifice will be the Son of God, yea, infinite and eternal.'
  - where: explore
    claim: 'Ruth gleans after the reapers'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ruth/2?lang=eng'
    quote: 'Let me now go to the field, and glean ears of corn after him in whose sight I shall find grace.'
