chapter: 19
claims:
  - where: when
    claim: 'Moses speaks in the fortieth year, in the land of Moab'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/1?lang=eng'
    quote: 'And it came to pass in the fortieth year, in the eleventh month, on the first day of the month, that Moses spake unto the children of Israel'
  - where: setting
    claim: 'In the code of laws, a group of laws deals with the administration of justice'
    key: bd-deuteronomy
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/deuteronomy?lang=eng'
    quote: 'The next group of laws deals with the administration of justice, while the last group regulates private and social rights.'
  - where: setting
    claim: 'Numbers commands six cities of refuge for the manslayer'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/35?lang=eng'
    quote: 'there shall be six cities for refuge, which ye shall appoint for the manslayer, that he may flee thither'
  - where: setting
    claim: 'Moses had already set apart three cities east of the Jordan'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/4?lang=eng'
    quote: 'Then Moses severed three cities on this side Jordan toward the sunrising;'
  - where: setting
    claim: 'Deuteronomy 19 is not a mere repetition of Numbers 35 but an admonition to carry it out'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/19.htm'
    quote: 'The laws concerning the Cities of Refuge for Unintentional Manslayers are not a mere repetition of the laws given in Numbers 35:9-34, but rather an admonition to carry out those laws, with special reference to the future extension of the boundaries of the land.'
  - where: setting
    claim: 'The New Testament quotes Deuteronomy 19:15 at 2 Corinthians 13:1'
    key: bd-deuteronomy
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/deuteronomy?lang=eng'
    quote: 'Deuteronomy is referenced frequently in the New Testament: … 2 Cor. 13:1, Deut. 19:15'
  - where: thread
    claim: 'One older reading: chapters 19–21 notice the ways a life might be endangered, to awaken reverence for human life'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/19.htm'
    quote: 'notices in this and the two following chapters the different ways in which the lives of individuals might be endangered, for the purpose of awakening in the minds of the people a holy reverence for human life.'
  - where: thread
    claim: 'Failing to protect the unintentional slayer would bring blood-guilt on Israel'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/19.htm'
    quote: 'If Israel neglected this duty, it would bring blood-guiltiness upon itself ("and so blood be upon thee"), because it had not done what was requisite to prevent the shedding of innocent blood.'
  - where: 'note 19:2 “Cities of refuge”'
    claim: 'The six cities were Kedesh, Shechem and Hebron west of Jordan, Bezer, Ramoth and Golan east; refuge for accidental homicide from the avenger of blood'
    key: bd-cities-of-refuge
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/cities-of-refuge?lang=eng'
    quote: 'Six cities, three on each side of Jordan (that is, Kedesh, Shechem, and Hebron, on the western side, and Bezer, Ramoth, and Golan on the eastern side), in which a man who had accidentally committed homicide could take refuge from the avenger of blood.'
  - where: 'note 19:2 “Cities of refuge”'
    claim: 'Joshua appointed the western three'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/20?lang=eng'
    quote: 'And they appointed Kedesh in Galilee in mount Naphtali, and Shechem in mount Ephraim, and Kirjath-arba, which is Hebron, in the mountain of Judah.'
  - where: 'note 19:2 “Cities of refuge”'
    claim: 'The congregation judges between slayer and avenger; the slayer stays in the city until the death of the high priest'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/35?lang=eng'
    quote: 'he shall abide in it unto the death of the high priest, which was anointed with the holy oil.'
  - where: 'note 19:2 “Cities of refuge”'
    claim: 'The cities were open to the stranger and sojourner too'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/35?lang=eng'
    quote: 'These six cities shall be a refuge, both for the children of Israel, and for the stranger, and for the sojourner among them'
  - where: 'note 19:2 “Cities of refuge”'
    claim: 'One suspected of homicide could flee to a city of refuge where elders and Levites would hear the case'
    key: sc-knowhy-162
    url: 'https://scripturecentral.org/knowhy/why-was-ammoron-determined-to-avenge-the-blood-of-his-brother'
    quote: 'At the same time, one suspected of wrongful homicide had the right to flee to a city of refuge, where a disinterested body of elders and Levites would hear the case (Numbers 35:9–24; Deuteronomy 4:41–44).'
  - where: 'note 19:6 “The avenger is the gōʾēl”'
    claim: 'The Hebrew is gōʾēl haddām, from gāʾal, to redeem, act as kinsman, avenge'
    key: bdb
    url: 'https://biblehub.com/hebrew/1350.htm'
    quote: 'e. גֹּאֵל הַדָּם the avenger of blood Numbers 35:19,21,24,25,27 (twice in verse); Joshua 20:3,5 (?; not in ᵐ5) Joshua 20:9 (P). Deuteronomy 19:6,12 (D) 2 Samuel 14:11.'
  - where: 'note 19:6 “The avenger is the gōʾēl”'
    claim: 'The root means to redeem, be next of kin, buy back a relative’s property, marry his widow, avenge'
    key: bdb
    url: 'https://biblehub.com/hebrew/1350.htm'
    quote: 'to be the next of kin (and as such to buy back a relative''s property, marry his widow, etc.)'
  - where: 'note 19:6 “The avenger is the gōʾēl”'
    claim: 'The LORD is called gōʾēl in Isaiah'
    key: bdb
    url: 'https://biblehub.com/hebrew/1350.htm'
    quote: 'Yahweh is גֹּאֵל Isaiah 41:14; Isaiah 43:14; Isaiah 44:6,24; Isaiah 47:4; Isaiah 48:17'
  - where: 'note 19:6 “The avenger is the gōʾēl”'
    claim: 'The nearest of kin had the duty to carry out the death penalty on a slayer; goel conventionally translated redeemer'
    key: sc-knowhy-162
    url: 'https://scripturecentral.org/knowhy/why-was-ammoron-determined-to-avenge-the-blood-of-his-brother'
    quote: 'This avenger of blood is called a goel in biblical Hebrew. Conventionally translated as “redeemer,” one of the responsibilities of being an avenging kinsman (a goel) was to bring about justice'
  - where: 'note 19:6 “The avenger is the gōʾēl”'
    claim: 'In a world without law enforcement, avenging a slain kinsman was a clan duty'
    key: sc-knowhy-162
    url: 'https://scripturecentral.org/knowhy/why-was-ammoron-determined-to-avenge-the-blood-of-his-brother'
    quote: 'In a world with no real equivalent to modern law enforcement, “one of the most important clan duties” in many ancient cultures was “for the nearest of kin to hunt down and carry out the death-penalty on a person that had slain a member of the sept or family.”'
  - where: 'note 19:6 “The avenger is the gōʾēl”'
    claim: 'Isaiah 41:14 calls the LORD Israel’s redeemer'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/41?lang=eng'
    quote: 'I will help thee, saith the Lord, and thy redeemer, the Holy One of Israel.'
  - where: 'note 19:9 “Three cities more”'
    claim: 'The cities appointed were six, three on each side of Jordan'
    key: bd-cities-of-refuge
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/cities-of-refuge?lang=eng'
    quote: 'Six cities, three on each side of Jordan'
  - where: 'note 19:9 “Three cities more”'
    claim: 'Joshua assigned the eastern three'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/20?lang=eng'
    quote: 'they assigned Bezer in the wilderness upon the plain out of the tribe of Reuben, and Ramoth in Gilead out of the tribe of Gad, and Golan in Bashan out of the tribe of Manasseh.'
  - where: 'note 19:9 “Three cities more”'
    claim: 'One older reading: the extra three were for the whole promised land, Nile to Euphrates (Gen. 15:18), and are distinct from the first three'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/19.htm'
    quote: 'should give them the whole land from the Nile to the Euphrates, according to Genesis 15:18, they were to add three other cities of refuge to these three'
  - where: 'note 19:9 “Three cities more”'
    claim: 'One older reading: the circumstances never existed because Israel did not meet the condition of 19:9'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/19.htm'
    quote: 'The circumstances supposed by Moses never existed, since the Israelites did not fulfil the conditions laid down in Deuteronomy 19:9, viz., that they should keep the law faithfully, and love the Lord their God'
  - where: 'note 19:9 “Three cities more”'
    claim: 'Under David and Solomon the land to the Euphrates was tributary, not possessed'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/19.htm'
    quote: 'The extension of the power of Israel to the Euphrates under David and Solomon, did not bring the land as far as this river into their actual possession'
  - where: 'note 19:14 “Why the landmark law stands here”'
    claim: 'One older reading: the landmark law is here because a man’s property supports his life'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/19.htm'
    quote: 'on account of the close connection in which a man''s possession as the means of his support stood to the life of the man himself'
  - where: 'note 19:14 “Why the landmark law stands here”'
    claim: 'Keil rejects the idea that the law is here because of the cities of refuge'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/19.htm'
    quote: 'is inserted here, not because landmarks were of special importance in relation to the free cities'
  - where: 'note 19:14 “Why the landmark law stands here”'
    claim: 'Deuteronomy 27:17 curses the one who moves a landmark'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/27?lang=eng'
    quote: 'Cursed be he that removeth his neighbour’s landmark. And all the people shall say, Amen.'
  - where: 'note 19:15 “Two or three witnesses”'
    claim: 'In its setting the law of witnesses protected the accused in judicial settings; Latter-day Saints may read it of spiritual truth'
    key: evans-second-nephi
    url: 'https://interpreterfoundation.org/journal/second-nephi-as-a-legal-document'
    quote: 'amid a list of civil laws, the law of witnesses appears to be focused on protecting the accused from immediate consequences of violated civil laws.'
  - where: 'note 19:15 “Two or three witnesses”'
    claim: 'A Latter-day Saint may read the law as multiple sources establishing spiritual truth'
    key: evans-second-nephi
    url: 'https://interpreterfoundation.org/journal/second-nephi-as-a-legal-document'
    quote: 'A Latter-day Saint may believe the law of witnesses refers to multiple sources establishing spiritual truth.'
  - where: 'note 19:15 “Two or three witnesses”'
    claim: 'Paul quotes Deuteronomy 19:15 in 2 Corinthians 13:1'
    key: bd-deuteronomy
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/deuteronomy?lang=eng'
    quote: '2 Cor. 13:1, Deut. 19:15'
  - where: 'note 19:15 “Two or three witnesses”'
    claim: 'Hebrews speaks of death under two or three witnesses'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/10?lang=eng'
    quote: 'He that despised Moses’ law died without mercy under two or three witnesses:'
  - where: 'note 19:15 “Two or three witnesses”'
    claim: 'The principle was the basis of Israelite law, and God provided three witnesses of the Book of Mormon'
    key: sc-knowhy-267
    url: 'https://scripturecentral.org/knowhy/why-were-three-key-witnesses-chosen-to-testify-of-the-book-of-mormon'
    quote: 'This principle was the basis of ancient Israelite law (see Deuteronomy 19:15; 2 Corinthians 13:1)'
  - where: 'note 19:15 “Two or three witnesses”'
    claim: 'Nephi, Jacob and Isaiah are three voices satisfying the law of witnesses'
    key: sc-knowhy-37
    url: 'https://scripturecentral.org/knowhy/who-testified-of-christ-in-2-nephi'
    quote: 'Together these prophets constitute three separate yet unified voices in the Book of Mormon to satisfy God’s law of witnesses (cf. Deuteronomy 19:15).'
  - where: 'note 19:19 “The false witness takes his own sentence”'
    claim: 'The verb zāmam here is of the evil purpose of wicked men'
    key: bdb
    url: 'https://biblehub.com/hebrew/2161.htm'
    quote: 'b. of evil purpose of wicked men לעשׂות ׳אשׁר יז Genesis 11:6; Deuteronomy 19:19'
  - where: 'note 19:19 “The false witness takes his own sentence”'
    claim: 'Sherem, as a false accuser, became subject to Deuteronomy 19:16–21'
    key: sc-knowhy-73
    url: 'https://scripturecentral.org/knowhy/why-did-sherem-die'
    quote: 'Sherem became subject to the provisions of Deuteronomy 19:16–21, which require the unflinching punishment of all who “rise up against any man to testify against him that which is wrong” (v. 16).'
  - where: 'note 19:19 “The false witness takes his own sentence”'
    claim: 'Laban falsely accused Nephi’s brothers of a capital crime, robbery'
    key: sc-knowhy-256
    url: 'https://scripturecentral.org/knowhy/was-nephis-slaying-of-laban-legal'
    quote: '(1) He had falsely accused them of a capital crime (being “robbers,” 1 Nephi 3:13; Deuteronomy 19:16–19).'
  - where: 'note 19:19 “The false witness takes his own sentence”'
    claim: 'The text of the chapter: the case goes before the priests and judges'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/19?lang=eng'
    quote: 'Then both the men, between whom the controversy is, shall stand before the LORD, before the priests and the judges, which shall be in those days;'
  - where: christ
    claim: 'Jesus cites the law of two witnesses for His own testimony and the Father’s'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/8?lang=eng'
    quote: 'It is also written in your law, that the testimony of two men is true.'
  - where: christ
    claim: 'Nephi applies the rule of three to witnesses who saw the Redeemer'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/11?lang=eng'
    quote: 'Wherefore, by the words of three, God hath said, I will establish my word.'
