summary: >-
  Isaiah testifies of the Messiah, the gathering of Israel, and a holy way home.
motifs:
  - A living branch growing from a weathered stump.
  - Living water moving toward light.
composition: The branch and stream sit in the foreground; the landscape opens toward a quiet horizon.
# “What's in this picture” under the image on the book page: one line for each thing, with the verse it shows.
key:
  - '**The branch growing from the old stump** is the promised Messiah: “there shall come forth a rod out of the stem of Jesse, and a Branch shall grow out of his roots” ([[Isa. 11:1]]).'
  - '**The stream running through dry country toward the light** is the water Isaiah promises in the desert: “in the wilderness shall waters break out, and streams in the desert” ([[Isa. 35:6]]).'
