chapter: 65
claims:
  - where: when
    claim: Delitzsch reads the chapter as addressed to the exiles
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/65.htm
    quote: The heathenish practices of the exiles are here depicted
  - where: setting
    claim: Chapter 65 answers the people's prayer (the lament of 63:7–64:12), but begins with reproach and threat
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/65.htm
    quote: After the people have poured out their heart before Jehovah, He announces what they may expect from Him.
  - where: setting
    claim: The Lord's servants are those preserved by sifting out of Jacob and Judah, not the whole people (the line is drawn by faithfulness)
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/65.htm
    quote: so will Jehovah for His servants' sake not utterly destroy Israel, but preserve those who are the clusters in the vineyard
  - where: setting
    claim: The Hebrew word for "servants" (ʿăbāday, "my servants") occurs three times in verse 13 (and in verses 8, 9, 14, 15, per the Hebrew word search)
    key: biblehub-interlinear
    url: https://biblehub.com/interlinear/isaiah/65-13.htm
    quote: "Therefore thus saith the Lord GOD, Behold, my servants shall eat, but ye shall be hungry: behold, my servants shall drink, but ye shall be thirsty: behold, my servants shall rejoice"
  - where: setting
    claim: The Church edition links D&C 101:30 (infant not dying until old, life as the age of a tree) to Isa. 65:20–22
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/101?lang=eng
    quote: "“infant”: Isa. 65:20 (20–22); D&C 45:58; 63:50 (49–50)."
  - where: setting
    claim: The Church edition's chapter heading places the chapter's rejoicing in the Millennium
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/isa/65?lang=eng
    quote: The Lord’s people will rejoice and triumph during the Millennium.
  - where: thread
    claim: The people's practices (gardens, graves, forbidden food, "holy to thee" claim) are rites the commentary describes as heathenish
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/65.htm
    quote: There is only one point of resemblance, viz., the allusion to gardens as places of worship
  - where: thread
    claim: God's open arms of love toward Israel, who turned away; the cluster still holds good juice
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/65.htm
    quote: As men to not destroy a juicy cluster of grapes, because they would thereby destroy the blessing of God which it contains
  - where: thread
    claim: Verse 24, all prayer will be heard; the circle of calling and answering
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/65.htm
    quote: All prayer will be heard then.
  - where: section 1 plain
    claim: Verse 4 Hebrew "who sit" (not "remain") among the graves
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/isa/65?lang=eng
    quote: "“Which remain”: HEB Who sit."
  - where: section 1 plain
    claim: Verse 5 "Stand by thyself, come not near" (plain-words "Keep your distance! Don't come near me") and "holy to thee"
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/65.htm
    quote: do not push against me (equivalent to גּשׁ־הלאה or גּשׁה־לך, get away, make room; Genesis 19:9; Isaiah 49:20), for qedashtikhâ, I am holy to thee, i.e., unapproachable.
  - where: section 1 plain
    claim: Verse 3 "burning incense on bricks" (brick altars) and broth of forbidden meat in verse 4
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/65.htm
    quote: it means a decoction, or broth made either of such kinds of flesh or such parts of the body as were forbidden by the law.
  - where: section 2 plain
    claim: Verse 8 "new wine" is grape juice in the cluster
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/isa/65?lang=eng
    quote: "“new wine”: OR grape juice."
  - where: section 2 plain
    claim: Verse 11 "Fortune" and "Destiny" are Gad and Meni
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/isa/65?lang=eng
    quote: "“troop”: HEB Gad (an idol of fortune)."
  - where: section 2 plain
    claim: Verse 11 "Destiny" (Meni, an idol of fate)
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/isa/65?lang=eng
    quote: "“number”: HEB Meni (an idol of fate)."
  - where: section 2 plain
    claim: Verse 12, "I will destine you to the sword" renders a play on Meni
    key: bdb
    url: https://biblehub.com/hebrew/4487.htm
    quote: 2 reckon, assign, appoint לַחֶרֶב Isaiah 65:12 (with play on מְנִי Isaiah 65:11).
  - where: section 3 plain
    claim: Verse 20 "infant who lives only a few days" and "old man who does not live out his years"
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/65.htm
    quote: a suckling of a few days, and an old man who has not lived out all his days
  - where: section 3 plain
    claim: Verse 23 "children doomed to disaster" (labbehâlâh, for calamity)
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/65.htm
    quote: not get children labbehâlâh, i.e., for some calamity to fall suddenly upon them and carry them away
  - where: note 65:1 “Found by those who did not look”
    claim: The verbs are a niphal that can mean "I let myself be sought… I let myself be found"
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/65.htm
    quote: regarded as the so-called niphal tolerativum (according to Ezekiel 14:3; Ezekiel 20:3, Ezekiel 20:31; Ezekiel 36:37), "I permitted myself to be explored or found out;"
  - where: note 65:1 “Found by those who did not look”
    claim: The verse can be rendered "I permitted Myself to be sought… a nation which did not call on My name"
    key: biblehub-interlinear
    url: https://biblehub.com/interlinear/isaiah/65-1.htm
    quote: I permitted Myself to be sought by those who did not ask [for Me]; I permitted Myself to be found by those who did not seek Me.
  - where: note 65:1 “Found by those who did not look”
    claim: Israel is called a nation where the Lord's name was not invoked, not one "not called by" His name; the phrase refers to Israel
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/65.htm
    quote: but as a nation where (supply 'ăsher) Jehovah's name was not invoked (lxx "who called not upon my name"), and therefore as a thoroughly heathenish nation
  - where: note 65:1 “Found by those who did not look”
    claim: The Church edition footnotes "name" in verse 1 to Isa. 63:19 and "sought" to Rom. 10:20
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/isa/65?lang=eng
    quote: "“name”: Isa. 63:19."
  - where: note 65:1 “Found by those who did not look”
    claim: Hinnēnî ("Here I am") is the word of Isa. 58:9
    key: biblehub-interlinear
    url: https://biblehub.com/interlinear/isaiah/58-9.htm
    quote: hin·nê·nî; הִנֵּ֑נִי Here I [am]
  - where: note 65:1 “Found by those who did not look”
    claim: Paul relied on the Septuagint, in which the Gentile reading is natural; the Hebrew alone does not require it
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/65.htm
    quote: Nevertheless they are not decisive, if we look at the Hebrew alone, apart altogether from the lxx.
  - where: note 65:2 “Hands spread out all day”
    claim: God spreads out His hands as a man does to draw another into an embrace, all the day
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/65.htm
    quote: He spread out His hands (as a man does to draw another towards him to embrace him) all the day (i.e., continually
  - where: note 65:2 “Hands spread out all day”
    claim: Jacob 6:4 closely matches verse 2
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/bofm/jacob/6?lang=eng
    quote: he stretches forth his hands unto them all the day long; and they are a stiffnecked and a gainsaying people
  - where: note 65:5 “Holier than thou”
    claim: Gardens as places of worship coincide with Isa. 1:29; incense on bricks points to Babylon; the law allowed altars of unhewn stones
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/65.htm
    quote: The only altars that it allows are altars of earth thrown up, or of unhewn stones and wooden beams with a brazen covering.
  - where: note 65:5 “Holier than thou”
    claim: Sitting among the graves is perhaps to hold intercourse with the dead
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/65.htm
    quote: and supposing the object to be to hold intercourse there with the dead and with demons
  - where: note 65:5 “Holier than thou”
    claim: The verb qədaštîkā is read by Delitzsch as "I am holy to thee," i.e., unapproachable
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/65.htm
    quote: for qedashtikhâ, I am holy to thee, i.e., unapproachable.
  - where: note 65:5 “Holier than thou”
    claim: BDB cites a different reading of the form in Isa. 65:5 as Piel (Qal reading attributed to Dillmann)
    key: bdb
    url: https://biblehub.com/hebrew/6942.htm
    quote: other persons Isaiah 65:5 (Di; but … Pi`el Gei RSSemitic i. 431; 2nd ed. 451 Che Du Buhl).
  - where: note 65:5 “Holier than thou”
    claim: The Church edition footnotes "holier" to Luke 18:11 and Alma 31
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/isa/65?lang=eng
    quote: “holier”:Matt. 9:11 (10–12); Luke 18:11; Alma 31:16 (13–19).
  - where: note 65:8 “A blessing in the cluster”
    claim: The cluster saying; the servants are the clusters with juice; the vineyard is not wholly destroyed
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/65.htm
    quote: so will Jehovah for His servants' sake not utterly destroy Israel, but preserve those who are the clusters in the vineyard
  - where: note 65:8 “A blessing in the cluster”
    claim: The valley of Achor became renowned through the stoning of Achan
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/65.htm
    quote: valley which became renowned through the stoning of Achan
  - where: note 65:8 “A blessing in the cluster”
    claim: The Church edition renders "new wine" as grape juice
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/isa/65?lang=eng
    quote: "“new wine”: OR grape juice."
  - where: note 65:11 “Fortune and Destiny”
    claim: Gad is the god of good fortune; Meni means fate or allotment
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/65.htm
    quote: There can be no doubt, therefore, that Gad, the god of good fortune
  - where: note 65:11 “Fortune and Destiny”
    claim: Tables and mixed drink were set out for them
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/65.htm
    quote: who prepare a table for Gad, and fill up mixed drink for the goddess of destiny
  - where: note 65:11 “Fortune and Destiny”
    claim: Meni is the name of a god of fate
    key: bdb
    url: https://biblehub.com/hebrew/4507.htm
    quote: מְנִי proper name, of a divinity Menî, god of fate (award, apportionment
  - where: note 65:11 “Fortune and Destiny”
    claim: Verse 12 plays on Meni with "number" (mānîtî)
    key: bdb
    url: https://biblehub.com/hebrew/4487.htm
    quote: 2 reckon, assign, appoint לַחֶרֶב Isaiah 65:12 (with play on מְנִי Isaiah 65:11).
  - where: note 65:11 “Fortune and Destiny”
    claim: The Church edition footnotes identify Gad and Meni as idols of fortune and fate
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/isa/65?lang=eng
    quote: "“number”: HEB Meni (an idol of fate)."
  - where: note 65:16 “The God of Amen”
    claim: ʾĕlōhê ʾāmēn is "God of Amen"; Isa. 65:16 is the entry's only instance; some read "God of faithfulness, God of truth"
    key: bdb
    url: https://biblehub.com/hebrew/543.htm
    quote: אֱלֹהֵי אָמֵן Isaiah 65:16 (twice in verse) God of Amen De Che RVm; compare Revelation 3:14, or God of faithfulness, God of truth (RV) (perhaps read אֹמֶן Che Di).
  - where: note 65:16 “The God of Amen”
    claim: The root ʾāman means to be firm, faithful, and gives "believe" and "faithful"
    key: bdb
    url: https://biblehub.com/hebrew/539.htm
    quote: The root אָמַן revolves around firmness, reliability, and support.
  - where: note 65:16 “The God of Amen”
    claim: The title is similar to Rev. 3:14 and 2 Cor. 1:20 (God who turns promises into Yea and Amen)
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/65.htm
    quote: the God of Amen," i.e., the God who turns what He promises into Yea and Amen (2 Corinthians 1:20).
  - where: note 65:16 “The God of Amen”
    claim: The Church edition footnotes verse 16 (blessing and swearing by the God of truth)
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/isa/65?lang=eng
    quote: “swear”:IE make covenants through the power of God.
  - where: note 65:17 “A new creation”
    claim: bārāʾ is used in the Bible always of divine activity
    key: bdb
    url: https://biblehub.com/hebrew/1254.htm
    quote: shape, fashion, create, always of divine activity, with accusative of thing, seldom except in P and Isa2.
  - where: note 65:17 “A new creation”
    claim: bārāʾ (bōrēʾ) appears in verse 17 and twice in verse 18
    key: biblehub-interlinear
    url: https://biblehub.com/interlinear/isaiah/65-17.htm
    quote: 1254 [e] ḇō·w·rê בוֹרֵ֛א will create V‑Qal‑Prtcpl‑ms
  - where: note 65:17 “A new creation”
    claim: The former troubles are forgotten so that they no longer disturb the present enjoyment
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/65.htm
    quote: now forgotten, so that they no longer disturb the enjoyment of the present
  - where: note 65:17 “A new creation”
    claim: The Church edition footnotes "new" in verse 17 to the renewal of the earth and the Millennium
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/isa/65?lang=eng
    quote: “new”:TG Earth, Renewal of; Millennium.
  - where: note 65:20 “The age of a tree”
    claim: Death still exists in the vision; its power is limited rather than ended
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/65.htm
    quote: here it is merely to the limitation of its power.
  - where: note 65:20 “The age of a tree”
    claim: Verses 21–23 reverse the curses of the law (Lev. 26:16; Deut. 28:30)
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/65.htm
    quote: In the place of the threatened curses of the law in Leviticus 26:16 (cf., Deuteronomy 28:30), the very opposite will now receive their fullest realization.
  - where: note 65:20 “The age of a tree”
    claim: The Church edition links D&C 101:30 to Isa. 65:20–22
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/101?lang=eng
    quote: "“infant”: Isa. 65:20 (20–22); D&C 45:58; 63:50 (49–50)."
  - where: note 65:20 “The age of a tree”
    claim: The Millennium is the thousand-year period of peace when Christ reigns on the earth
    key: gs-millennium
    url: https://www.churchofjesuschrist.org/study/scriptures/gs/millennium?lang=eng
    quote: The thousand-year period of peace that will begin when Christ returns to reign personally on the earth (A of F 1:10).
  - where: note 65:24 “Before they call”
    claim: All prayer will be heard in the new Jerusalem; God hears even the half-uttered prayer
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/65.htm
    quote: He will hear the slightest emotion of prayer in the heart, the half-uttered prayer, and will at once fulfill it
  - where: note 65:24 “Before they call”
    claim: In 3 Ne. 19:24 the disciples pray, filled with desire, as it was given them what to pray
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/19?lang=eng
    quote: for it was given unto them what they should pray, and they were filled with desire.
  - where: note 65:25 “The wolf and the lamb”
    claim: Verse 25 repeats Isa. 11:6–9 in abridgment; the new thing is the serpent, which still has the dust of Gen. 3:14 but does no injury
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/65.htm
    quote: It still continues to wriggle in the dust, but without doing injury to man.
  - where: note 65:25 “The wolf and the lamb”
    claim: D&C 101:26 describes the cessation of enmity in that day
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/101?lang=eng
    quote: And in that day the enmity of man, and the enmity of beasts, yea, the enmity of all flesh, shall cease from before my face.
  - where: christ
    claim: The Millennium is Christ's reign on the earth
    key: gs-millennium
    url: https://www.churchofjesuschrist.org/study/scriptures/gs/millennium?lang=eng
    quote: The thousand-year period of peace that will begin when Christ returns to reign personally on the earth (A of F 1:10).
  - where: christ
    claim: The Church edition footnotes verse 17 "create" to Jesus Christ, Creator
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/isa/65?lang=eng
    quote: “create”:TG Jesus Christ, Creator.
  - where: parallels
    claim: D&C 101:30 is linked to Isa. 65:20–22 in the Church edition
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/101?lang=eng
    quote: "“infant”: Isa. 65:20 (20–22); D&C 45:58; 63:50 (49–50)."
  - where: setting
    claim: WLC lemma 5650 occurs seven times in Isaiah 65 (8, 9, 13 three times, 14, 15), all plural; the 20 occurrences in Isaiah 41–53 are singular and the 11 from 54:17 onward are plural
    key: oshb-wlc
    url: https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Isa.xml
    quote: עֲבָדַ֤/י
