chapter: 56
claims:
  - where: setting
    claim: Duhm named chapters 56-66 "Tritojesaia", a separate writer in Jerusalem (critical scholarship's "Third Isaiah")
    key: duhm-1902
    url: https://archive.org/stream/dasbuchjesaia00duhmgoog/dasbuchjesaia00duhmgoog_djvu.txt
    quote: die dritte Schrift c. 56—66, die sich nach Form und Inhalt als Erzeugnis eines einzigen Schriftstellers ausweist, den wir der Kürze halber Tritojesaia nennen
  - where: setting
    claim: Duhm places the writing in Jerusalem (shortly before Nehemiah)
    key: duhm-1902
    url: https://archive.org/stream/dasbuchjesaia00duhmgoog/dasbuchjesaia00duhmgoog_djvu.txt
    quote: Geschrieben ist sie kurz vor der Wirksamkeit des Xehomia und zwar iu Jerusalem
  - where: note 56:1 “Two kinds of righteousness”
    claim: In Isa. 45-51 God's ṣədāqâ is his saving act, parallel to salvation (Isa. 46:13; 51)
    key: bdb
    url: https://biblehub.com/hebrew/6666.htm
    quote: of God "" יָשַׁע, תְּשׁוּעָה, יְשׁוּעָה Isaiah 45:8; Isaiah 46:13; Isaiah 51:6 7t. Isa2
  - where: note 56:1 “Two kinds of righteousness”
    claim: ṣədāqâ ("righteousness") is used of both the ruler's/people's righteous conduct and God's saving righteousness
    key: bdb
    url: https://biblehub.com/hebrew/6666.htm
    quote: 'righteousness, in government: a. of judge, ruler, king: "" משׁפט Isaiah 5:7; Isaiah 9:6; Amos 5:7'
  - where: note 56:1 “Two kinds of righteousness”
    claim: In 56:1 righteousness (ṣədāqâ) is on both sides, Israel's conduct and God's action, per the covenant
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/56.htm
    quote: צדקה (righteousness) on both sides such personal activity as is in accordance with the covenant relation, or what is the same thing, with the purpose and plan of salvation
  - where: note 56:3 “Shut out by the law”
    claim: Deut. 23:2 bars emasculated men and Deut. 23:4-7 Ammonites and Moabites from the congregation; Isaiah's prophecy breaks through these limits
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/56.htm
    quote: the law in Deuteronomy 23:2 expressly declares ... that no kind of emasculated person is to enter the congregation of Jehovah. But prophecy breaks through these limits of the law.
  - where: note 56:3 “Shut out by the law”
    claim: Hebrew yabdilanî ("separate") in Isa. 56:3 means excluding a person from the people; compare Neh. 13:3 (same verb bādal)
    key: bdb
    url: https://biblehub.com/hebrew/914.htm
    quote: followed by מֵעַל Isaiah 56:3 (twice in verse), i.e. excluding him; compare also Nehemiah 13:3 followed by מִן
  - where: note 56:3 “Shut out by the law”
    claim: sārîs means eunuch; also rendered officer/chamberlain in the KJV
    key: bdb
    url: https://biblehub.com/hebrew/5631.htm
    quote: "KJV: chamberlain, eunuch, officer"
  - where: note 56:3 “Shut out by the law”
    claim: sārîs appears in the courts of Israel, Judah, Babylon and Persia; Potiphar (Gen. 39:1); Ebed-melech (Jer. 38:7); Isa. 56:3-4 gives promises to eunuchs
    key: bdb
    url: https://biblehub.com/hebrew/5631.htm
    quote: eunuch, of Pharaoh Genesis 37:36; Genesis 40:2,7 (all E), married Genesis 39:1 (RJE); of Israel kings 1 Samuel 8:15 (predict.)
  - where: note 56:3 “Shut out by the law”
    claim: Isa. 56:3-4 is the place where promises are made to eunuchs; the term is not used in law codes
    key: bdb
    url: https://biblehub.com/hebrew/5631.htm
    quote: promises made to eunuchs Isaiah 56:3,4. (Term never used in law codes
  - where: note 56:3 “Shut out by the law”
    claim: Eunuchs were emasculated men at eastern courts, often trusted officials
    key: bd-eunuch
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/eunuch?lang=eng
    quote: A class of emasculated men attached to the courts of eastern rulers. They were employed to watch over the harems and also were often given positions as trusted officials.
  - where: note 56:3 “Shut out by the law”
    claim: The eunuchs of 56:3 are probably Israelites by birth, mutilated against their will to serve in foreign courts (the foreigner is described as having "joined himself", the eunuch is not)
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/56.htm
    quote: By the eunuchs we are to understand those of Israelitish descent, as the attributive clause is not repeated in their case.
  - where: note 56:3 “Shut out by the law”
    claim: Israelite eunuchs mutilated against their will to serve at heathen courts, and not unfaithful to Jehovah
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/56.htm
    quote: the Israelitish eunuchs, who had been mutilated against their will, that they might serve at heathen courts or in the houses of foreign lords, and therefore had not been unfaithful to Jehovah
  - where: note 56:3 “Shut out by the law”
    claim: nilwâ ("joined") is the verb of Leah's naming of Levi (Gen. 29:34), and word-play on Levi in Num. 18:2
    key: bdb
    url: https://biblehub.com/hebrew/3867.htm
    quote: Imperfect יִלָּוֶה Genesis 29:34 ... Participle נִלְוָה Isaiah 56:3 (pointed as Perfect, read probably נִלְוֶה) ... Numbers 18:2,4 (מַטֵּה לֵנִי to Aaron, by word-play)
  - where: note 56:3 “Shut out by the law”
    claim: Delitzsch links Isa. 66:21 (priests and Levites from among the heathen) to the breaking down of the party wall in ch. 56
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/56.htm
    quote: Jehovah will even take priests and Levites out of the midst of the heathen whom Israel will bring back with it into its own land
  - where: note 56:3 “Shut out by the law”
    claim: Abraham read as a stranger/foreigner in Canaan and like a eunuch (childless), yet covenant heir; the Isa. 56 promise applies to such people (Latter-day Saint reading; Abraham not named in Isaiah)
    key: halverson-isaiah-56
    url: https://interpreterfoundation.org/journal/isaiah-56-abraham-and-the-temple
    quote: He was like a stranger or a foreigner in the land of Canaan (Abraham 1–2; Genesis 12). And he was like a eunuch, incapable of having posterity with his wife Sarah until there was miraculous intervention
  - where: note 56:5 “Yad vashem”
    claim: Hebrew yād ("hand") denotes a monument/memorial (1 Sam. 15:12; 2 Sam. 18:18)
    key: bdb
    url: https://biblehub.com/hebrew/3027.htm
    quote: a. sign, monument 1 Samuel 15:12; 2 Samuel 18:18.
  - where: note 56:5 “Yad vashem”
    claim: In Isa. 56:5 yād and šēm form a pair meaning "memorial and name", set up like Absalom's pillar
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/56.htm
    quote: where ושׁם יד form a closely connected pair of words ... it signifies the memorial, equivalent to מצּבת (2 Samuel 18
  - where: note 56:5 “Yad vashem”
    claim: The eunuch's compensation for lacking posterity is a lasting memory
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/56.htm
    quote: promised, as a superabundant compensation for the want of posterity, long life in the memory of future ages
  - where: note 56:5 “A name that is not cut off”
    claim: kārat in the Niphal is used of being cut off from the people (Gen. 17:14) and, in the general sense, of a name failing (Isa. 56:5)
    key: bdb
    url: https://biblehub.com/hebrew/3772.htm
    quote: ונִכְרְתָה הַנֶּפֶשׁ ההיא that person shall be cut off (by death penalty) מֵעַמֶּיהָ Genesis 17:14
  - where: note 56:5 “A name that is not cut off”
    claim: 'kārat Niphal "be cut off, in a more general sense, fail": a name, Isa. 48:19; 56:5'
    key: bdb
    url: https://biblehub.com/hebrew/3772.htm
    quote: "be cut off, in a more general sense, fail: of waters Joshua 3:13,16 ... a name Isaiah 48:19; Isaiah 56:5"
  - where: note 56:8 “Other sheep”
    claim: Delitzsch reads 56:8 as what Jesus says in John 10:16 (other sheep)
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/56.htm
    quote: Jehovah here declares what Jesus says in John 10:16
  - where: note 56:10 “Dogs that cannot bark”
    claim: The watchmen are the prophets (also Isa. 52:8), whose duty is to blow the trumpet and warn (Ezek. 33:1-9); the dogs are blind, mute, sleeping, greedy; shepherds turn to their own gain
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/56.htm
    quote: The "watchmen" are the prophets here, as everywhere else (Isaiah 52:8, cf., Isaiah 21:6, Habakkuk 2:1; Jeremiah 6:17; Ezekiel 3:17).
  - where: note 56:10 “Dogs that cannot bark”
    claim: "Delitzsch: the shepherds' speech in v. 12 is a revel promising tomorrow like today, \"much more abundant\""
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/56.htm
    quote: Come here, I will fetch wine, and let us drink meth; and tomorrow shall be like today, great, excessively abundant.
  - where: note 56:10 “Dogs that cannot bark”
    claim: The beasts are summoned to devour because the flock has no guard (Delitzsch; compare Ezek. 34:5)
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/56.htm
    quote: It resembles a flock with a keeper, and therefore an easy prey (Ezekiel 34:5)
  - where: note 56:5 “A name that is not cut off”
    claim: D&C 130:10-11 speaks of a white stone with a new name given to each who enters the celestial kingdom (Rev. 2:17)
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/130?lang=eng
    quote: a white stone is given to each of those who come into the celestial kingdom, whereon is a new name written
  - where: note 56:3 “Shut out by the law”
    claim: (Southwood abstract only) the article treats "the foreigner" and "the eunuch" as identity labels and stresses elective attachment in Isa. 56:1-8
    key: southwood-foreigner
    url: https://ora.ox.ac.uk/objects/uuid:bd7e9685-ea22-4d33-b1ad-afaeb4cd3c5a
    quote: We will emphasise the importance of elective attachment in Isaiah 56:1–8
  - where: when
    claim: The passage is read against a community in Judah after the exile, without a precise composition date
    key: southwood-foreigner
    url: https://ora.ox.ac.uk/objects/uuid:bd7e9685-ea22-4d33-b1ad-afaeb4cd3c5a/files/rhq37vp29x
    quote: We can be slightly more confident about a setting in post-exilic Yehud.
  - where: setting
    claim: Exile and return form the background of the community addressed in the last division
    key: southwood-foreigner
    url: https://ora.ox.ac.uk/objects/uuid:bd7e9685-ea22-4d33-b1ad-afaeb4cd3c5a/files/rhq37vp29x
    quote: Although the exile is clearly over by the time Trito-Isaiah emerges, its reverberations in the form of changing group allegiances and identities can clearly be seen.
  - where: note 56:3 “Shut out by the law”
    claim: Connections to Ezra-Nehemiah have been proposed, but Southwood warns against equating the situations
    key: southwood-foreigner
    url: https://ora.ox.ac.uk/objects/uuid:bd7e9685-ea22-4d33-b1ad-afaeb4cd3c5a/files/rhq37vp29x
    quote: unlike Isaiah 56, Ezra-Nehemiah makes no reference to “foreigners” serving in the temple or to eunuchs
  - where: note 56:5 “Yad vashem”
    claim: The eunuch is promised a monument and a name in the temple
    key: southwood-foreigner
    url: https://ora.ox.ac.uk/objects/uuid:bd7e9685-ea22-4d33-b1ad-afaeb4cd3c5a/files/rhq37vp29x
    quote: eunuchs will be given a ‘monument’ ( יד ) and a ‘name’ ( שם )
  - where: note 56:3 “Shut out by the law”
    claim: A scan of WLC lemma 5650 in Isaiah 41–66 finds 20 singular forms in chapters 41–53, followed by 11 plural forms from 54:17 onward, including 56:6
    key: oshb-wlc
    url: https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Isa.xml
    quote: לַ/עֲבָדִ֑ים
  - where: note 56:5 “Yad vashem”
    claim: Acts describes an Ethiopian eunuch who worshipped in Jerusalem and read Isaiah
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/nt/acts/8?lang=eng
    quote: a man of Ethiopia, an eunuch of great authority under Candace queen of the Ethiopians
  - where: christ
    claim: Acts describes the Ethiopian eunuch reading Isaiah
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/nt/acts/8?lang=eng
    quote: Was returning, and sitting in his chariot read Esaias the prophet.
