  url: https://biblehub.com/commentaries/kad/isaiah/39.htm
  quote: the twelve years of Mardokempados (a contraction, as Ewald supposes, of Mardokempalados) commence with the year 721
- where: setting
  claim: Sargon ousted him (709)
  key: luckenbill-annals
  url: https://archive.org/download/annalsofsennache00senn_0/annalsofsennache00senn_0_djvu.txt
