# Evidence ledger for Isaiah 25 (audit, 2026-10-01)
chapter: 25
claims:
  - where: when
    claim: The chapter is read as a vision of the Second Coming and a millennial condition
    key: ot-manual-15
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-15?lang=eng'
    quote: 'This figure is used twice in the book of Revelation (Revelation 7:17; 21:4) and obviously represents a millennial condition'
  - where: setting
    claim: D&C 58, which quotes verse 6, was given in Jackson County, Missouri, in August 1831
    key: dc-58-heading
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/58?lang=eng'
    quote: 'Revelation given through Joseph Smith the Prophet, in Zion, Jackson County, Missouri, August 1, 1831.'
