  claim: "The NRSVUE follows \"I said\", and its footnote credits a Qumran manuscript, the Greek and the Vulgate against the Masoretic Text"
  key: "nrsvue"
  url: 'https://www.biblegateway.com/passage/?search=Isaiah+40%3A6&version=NRSVUE'
  quote: '40.6 Q ms Gk Vg: MT and he said'
- where: "note 40:6 ““And I said”: a textual variant”"
  claim: "The NIV reads \"And I said\""
  key: "niv"
  url: 'https://www.biblegateway.com/passage/?search=Isaiah+40%3A6&version=NIV'
  quote: 'And I said, “What shall I cry?”'
- where: "note 40:6 ““And I said”: a textual variant”"
  claim: "Delitzsch (the Masoretic reading) says the verb is not \"et dixi\" and the questioner is an ideal person, not the prophet; he calls verses 1–11 a divine inauguration of the prophet"
  key: "delitzsch"
  url: 'https://biblehub.com/commentaries/kad/isaiah/40.htm'
  quote: 'It stands at the head of the whole, like a divine inauguration of the prophet, and like the quintessence of what he is commanded to proclaim.'
- where: "note 40:8 “Grass and the word”"
  claim: "rûaḥ in 40:7 is the \"wind of heaven\""
  key: "bdb"
  url: 'https://biblehub.com/hebrew/7307.htm'
  quote: 'a. wind of heaven: Genesis 8:1 (P) Exodus 15:10 (E) Numbers 11:31 (J) 1 Kings 18:45 +, Jeremiah 10:13, thence Jeremiah 51:16; Psalm 135:7; ׳רוּחַ י Hosea 13:15; Isaiah 40:7'
- where: "note 40:8 “Grass and the word”"
  claim: "The breath of God the Creator, whose characteristic elementary manifestation is the wind"
  key: "delitzsch"
  url: 'https://biblehub.com/commentaries/kad/isaiah/40.htm'
  quote: 'the "breath" of God the Creator, which pervades the creation, generating life, sustaining life, and destroying life, and whose most characteristic elementary manifestation is the wind.'
