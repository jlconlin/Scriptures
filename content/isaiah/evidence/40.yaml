chapter: 40
claims:
- where: "setting"
  claim: "Many text-critical scholars hold that Isaiah 40–66 was written or edited after the Babylonian deportation"
  key: "isaiah-in-bom"
  url: 'https://storage.googleapis.com/scripturecentral-prod-strapi-uploads/ry_and_welch_isaiah_in_the_book_of_mormon_1998_184195e137/ry_and_welch_isaiah_in_the_book_of_mormon_1998_184195e137.pdf'
  quote: 'In the opinion of many text-critical scholars, the disputed chapters (mainly chapters 40-66) were written or edited after the time Lehi and Nephi left Jerusalem'
  # Welch, "Authorship of the Book of Isaiah in Light of the Book of Mormon," p. 423 (read in the Scripture Central copy, PDF p. 436)
- where: "setting"
  claim: "Most biblical scholars divide Isaiah into three sections, 1–39, 40–55, 56–66"
  key: "isaiah-in-bom"
  url: 'https://storage.googleapis.com/scripturecentral-prod-strapi-uploads/ry_and_welch_isaiah_in_the_book_of_mormon_1998_184195e137/ry_and_welch_isaiah_in_the_book_of_mormon_1998_184195e137.pdf'
  quote: 'Most biblical scholars divide Isaiah into three literary sections, composed of chapters 1-39, 40-55, and 56-66.'
  # Thompson, p. 137 (PDF p. 150)
- where: "setting"
  claim: "In chapters 40–55 Babylon is the enemy, Cyrus is the Gentile king, and the people are in Babylonian exile; 56–66 portray a restored community"
  key: "isaiah-in-bom"
  url: 'https://storage.googleapis.com/scripturecentral-prod-strapi-uploads/ry_and_welch_isaiah_in_the_book_of_mormon_1998_184195e137/ry_and_welch_isaiah_in_the_book_of_mormon_1998_184195e137.pdf'
  quote: 'Cyrus of Persia is the gentile king in chapters 40-55. In chapters 1-39 the people in Jerusalem are threatened by an Assyrian invasion, while chapters 40-55 are directed at Israel in Babylonian exile.'
  # Thompson, n. 32, p. 149 (PDF p. 162); the next sentences describe 56–66 as "the Jewish community founded once again, Jerusalem inhabited, and the temple rebuilt"
- where: "setting"
  claim: "Modern scholarship treats chapters 40–66 as the words of an anonymous prophet around the time of the exile"
  key: "great-isaiah-scroll"
  url: 'http://dss.collections.imj.org.il/isaiah'
  quote: 'Second Isaiah (Deutero-Isaiah, chapters 40-66), comprising the words of an anonymous prophet, who lived some one hundred and fifty years later, around the time of the Babylonian exile'
- where: "setting"
  claim: "Chapters 56–66 are the part critical scholars argue most strongly to be post-exilic"
  key: "isaiah-in-bom"
  url: 'https://storage.googleapis.com/scripturecentral-prod-strapi-uploads/ry_and_welch_isaiah_in_the_book_of_mormon_1998_184195e137/ry_and_welch_isaiah_in_the_book_of_mormon_1998_184195e137.pdf'
  quote: 'have argued most strongly to be post-exilic, do not appear in the Book of Mormon.'
  # Welch, p. 433 (PDF p. 446); the preceding words, cut by the page break, are about chapters 56-66
- where: "setting"
  claim: "Isaiah's authorship defended by what the halves share, \"the Holy One of Israel\" and the interchange of Jacob and Israel"
  key: "delitzsch"
  url: 'https://biblehub.com/commentaries/kad/isaiah/40.htm'
  quote: 'viz., "the Holy One of Israel," runs also through chapters 40-66. And so again do the confirmatory words, "Thus saith Jehovah," and the interchange of the national names Jacob and Israel'
- where: "setting"
  claim: "Delitzsch finds the second half shares theme, standpoint, style and ideas with the first"
  key: "delitzsch"
  url: 'https://biblehub.com/commentaries/kad/isaiah/40.htm'
  quote: 'so far as its theme, its standpoint, its style, and its ideas are concerned, is in a state of continuous formation throughout the whole of the first (chapters 1-39)'
- where: "setting"
  claim: "The author of 40–66 has the captivity as his standpoint (addressed to exiles)"
  key: "delitzsch"
  url: 'https://biblehub.com/commentaries/kad/isaiah/40.htm'
  quote: 'the author of chapters 40-66 has the captivity as his fixed standpoint'
- where: "setting"
  claim: "Isaiah 40:1–11 is the prologue / opening of the new section (Delitzsch)"
  key: "delitzsch"
  url: 'https://biblehub.com/commentaries/kad/isaiah/40.htm'
  quote: 'The first part of this address (Isaiah 40:1-11) may be regarded as the prologue to the whole twenty-seven.'
- where: "setting"
  claim: "The exiles felt Jehovah had turned away from them (verse 27)"
  key: "delitzsch"
  url: 'https://biblehub.com/commentaries/kad/isaiah/40.htm'
  quote: 'They fancied that Jehovah had completely turned away from them in wrath and weariness.'
- where: "section 1 plain"
  claim: '"Hard service" for "warfare" (ṣābāʾ)'
  key: "bdb"
  url: 'https://biblehub.com/hebrew/6635.htm'
  quote: 'b. of hard service of troubled life Job 7:1; Job 14:14; Isaiah 40:2; Daniel 10:1.'
- where: "section 1 plain"
  claim: '"Guilt has been paid for" (nirṣâ: satisfied by payment)'
  key: "delitzsch"
  url: 'https://biblehub.com/commentaries/kad/isaiah/40.htm'
  quote: 'is used here in the sense of meeting with a satisfactory payment'
- where: "section 1 plain"
  claim: '"Speak tenderly" renders "speak to the heart"'
  key: "biblehub-interlinear"
  url: 'https://biblehub.com/interlinear/isaiah/40-2.htm'
  quote: 'Speak to the heart of Jerusalem, and call to her'
- where: "section 3 plain"
  claim: 'The Septuagint and modern versions read "And I asked" in verse 6'
  key: "nrsvue"
  url: 'https://www.biblegateway.com/passage/?search=Isaiah+40%3A6&version=NRSVUE'
  quote: 'And I said, “What shall I cry?”'
- where: "section 3 plain"
  claim: '"The breath of the Lord" for the Hebrew rûaḥ, which is the wind of heaven'
  key: "bdb"
  url: 'https://biblehub.com/hebrew/7307.htm'
  quote: 'a. wind of heaven: Genesis 8:1 (P) Exodus 15:10 (E) Numbers 11:31 (J) 1 Kings 18:45 +, Jeremiah 10:13'
- where: "section 4 plain"
  claim: '"Herald of good news" (feminine participle of bāśar)'
  key: "biblehub-interlinear"
  url: 'https://biblehub.com/interlinear/isaiah/40-9.htm'
  quote: 'mə·ḇaś·śe·reṯ מְבַשֶּׂ֣רֶת bringing news V‑Piel‑Prtcpl‑fsc'
- where: "section 7 plain"
  claim: '"My situation" / "my case" for "my way" / "my judgment": their thorny way of life and their right'
  key: "delitzsch"
  url: 'https://biblehub.com/commentaries/kad/isaiah/40.htm'
  quote: '"My way" refers to their thorny way of life; "my right" (mishpâtı̄) to their good right, in opposition to their oppressors.'
- where: "section 7 plain"
  claim: '"Those who hope in the Lord" for "wait upon" (qāwâ: wait for, hope)'
  key: "bdb"
  url: 'https://biblehub.com/hebrew/6960.htm'
  quote: 'verb wait for (probably originally twist, stretch, then of tension of enduring, waiting'
- where: "note 40:1 “Who is being told to comfort?”"
  claim: "The imperatives naḥămû (\"comfort\") and dabbĕrû (\"speak\") are masculine plural"
  key: "biblehub-interlinear"
  url: 'https://biblehub.com/interlinear/isaiah/40-1.htm'
  quote: 'na·ḥă·mū נַחֲמ֥וּ Comfort V‑Piel‑Imp‑mp'
- where: "note 40:1 “Who is being told to comfort?”"
  claim: "dabbĕrû (\"speak\") and qirʾû (\"call out/cry\") are plural imperatives in verse 2"
  key: "biblehub-interlinear"
  url: 'https://biblehub.com/interlinear/isaiah/40-2.htm'
  quote: 'wə·qir·’ū וְקִרְא֣וּ and call out Conj‑w ¦ V‑Qal‑Imp‑mp'
- where: "note 40:1 “Who is being told to comfort?”"
  claim: "The verse is read as a continual divine command to the prophets, His messengers"
  key: "delitzsch"
  url: 'https://biblehub.com/commentaries/kad/isaiah/40.htm'
  quote: 'This is the divine command to the prophets.'
- where: "note 40:1 “Who is being told to comfort?”"
  claim: "The doubled word is repeated \"because of its urgency,\" as elsewhere in these chapters"
  key: "delitzsch"
  url: 'https://biblehub.com/commentaries/kad/isaiah/40.htm'
  quote: 'is repeated, because of its urgency (anadiplosis, as in Isaiah 41:27; Isaiah 43:11, Isaiah 43:25, etc.)'
- where: "note 40:2 “Speak to her heart”"
  claim: '"Speak comfortably" is literally "speak to the heart" (dabbĕrû ʿal-lēb)'
  key: "biblehub-interlinear"
  url: 'https://biblehub.com/interlinear/isaiah/40-2.htm'
  quote: 'lêḇ לֵ֤ב the heart N‑msc'
- where: "note 40:2 “Speak to her heart”"
  claim: 'Shechem "spake kindly" to Dinah, literally to her heart (Gen. 34:3)'
  key: "biblehub-interlinear"
  url: 'https://biblehub.com/interlinear/genesis/34-3.htm'
  quote: 'and speaketh unto the heart of the young person.'
- where: "note 40:2 “Speak to her heart”"
  claim: 'Boaz spoke "friendly" to Ruth, literally to her heart (Ruth 2:13)'
  key: "biblehub-interlinear"
  url: 'https://biblehub.com/interlinear/ruth/2-13.htm'
  quote: 'because thou hast spoken unto the heart of thy maid-servant'
- where: "note 40:2 “Speak to her heart”"
  claim: "In Hosea 2:14 the Lord says He will speak to Israel's heart"
  key: "biblehub-interlinear"
  url: 'https://biblehub.com/interlinear/hosea/2-14.htm'
  quote: 'And have caused her to go to the wilderness, And I have spoken unto her heart,'
- where: "note 40:2 “Speak to her heart”"
  claim: "The phrase is language of winning the heart, and Isaiah's use is possibly a reminiscence of Hosea"
  key: "delitzsch"
  url: 'https://biblehub.com/commentaries/kad/isaiah/40.htm'
  quote: 'is an expression applied in Genesis 34:3 and Judges 19:3 to words adapted to win the heart'
- where: "note 40:2 “Speak to her heart”"
  claim: "Delitzsch: used here as in Hosea 2:16, possibly with a reminiscence of that prophecy"
  key: "delitzsch"
  url: 'https://biblehub.com/commentaries/kad/isaiah/40.htm'
  quote: 'whilst here it is used in precisely the same sense as in Hosea 2:16, and possibly not without a reminiscence of this earlier prophecy'
- where: "note 40:2 “Hard service and “double””"
  claim: "ṣābāʾ means army, war, service; the sense here is hard service of troubled life (Job 7:1)"
  key: "bdb"
  url: 'https://biblehub.com/hebrew/6635.htm'
  quote: 'b. of hard service of troubled life Job 7:1; Job 14:14; Isaiah 40:2; Daniel 10:1.'
- where: "note 40:2 “Hard service and “double””"
  claim: "ṣābāʾ is the word in \"Lord of hosts\" (army)"
  key: "bdb"
  url: 'https://biblehub.com/hebrew/6635.htm'
  quote: 'צְבָאוֺת, in name of ׳י as God of war, probably first in time of warlike David'
- where: "note 40:2 “Hard service and “double””"
  claim: "nirṣâ (Niphal of rāṣâ) here means \"her punishment is accepted (as satisfactory)\"; used of accepted sacrifices (Lev. 1:4)"
  key: "bdb"
  url: 'https://biblehub.com/hebrew/7521.htm'
  quote: 'passive of Qal 2, be accepted, of sacrifices, with ל person, Leviticus 1:4;'
- where: "note 40:2 “Hard service and “double””"
  claim: "nirṣâ (Niphal) in Isaiah 40:2 means \"her punishment is accepted (as satisfactory)\""
  key: "bdb"
  url: 'https://biblehub.com/hebrew/7521.htm'
  quote: 'נִרְצָח עֲוֺנָהּ Isaiah 40:2 her punishment is accepted (as satisfactory).'
- where: "note 40:2 “Hard service and “double””"
  claim: "The root is used of the land paying off its sabbaths (Lev. 26:34)"
  key: "bdb"
  url: 'https://biblehub.com/hebrew/7521.htm'
  quote: 'the land shall pay off her sabbaths (accusative)'
- where: "note 40:2 “Hard service and “double””"
  claim: "Delitzsch rejects the reading that Jerusalem suffered more than she deserved; God's compassion regarded what justice required as superabundant; nothing is left for further punishment"
  key: "delitzsch"
  url: 'https://biblehub.com/commentaries/kad/isaiah/40.htm'
  quote: 'Jerusalem had not suffered more than its sins had deserved; but the compassion of God regarded what His justice had been obliged to inflict upon Jerusalem as superabundant.'
- where: "note 40:2 “Hard service and “double””"
  claim: "Others (Gesenius, Hitzig, Ewald and more) take \"double\" as the double favour that follows"
  key: "delitzsch"
  url: 'https://biblehub.com/commentaries/kad/isaiah/40.htm'
  quote: 'suppose kiphlayim to refer to the double favour that Jerusalem was about to receive'
- where: "note 40:2 “Hard service and “double””"
  claim: "The noun is \"the double,\" here \"of retribution\""
  key: "bdb"
  url: 'https://biblehub.com/hebrew/3718.htm'
  quote: 'double in sound wisdom (beyond what Job imagines), of retribution Isaiah 40:2.'
- where: "note 40:3 “A voice in the wilderness”"
  claim: "The Hebrew accents join \"in the wilderness\" to the command (Delitzsch on bammidbâr and pannū)"
  key: "delitzsch"
  url: 'https://biblehub.com/commentaries/kad/isaiah/40.htm'
  quote: 'Bammidbâr is to be connected with pannū, according to the accents on account of the parallel'
- where: "note 40:3 “A voice in the wilderness”"
  claim: "The Targum, the Jewish expositors and the Septuagint take \"in the wilderness\" with the crier, and the Gospels follow"
  key: "delitzsch"
  url: 'https://biblehub.com/commentaries/kad/isaiah/40.htm'
  quote: 'And so also the Targum and Jewish expositors take במדבר קור קול together, like the lxx, and after this the Gospels.'
- where: "note 40:3 “A voice in the wilderness”"
  claim: "The Septuagint reads \"the voice of one crying in the wilderness: Prepare the way of the Lord\""
  key: "lxx-rahlfs"
  url: 'https://www.ellopos.net/elpenor/greek-texts/septuagint/chapter.asp?book=43&page=40'
  quote: 'φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· ἑτοιμάσατε τὴν ὁδὸν Κυρίου.'
- where: "note 40:3 “A voice in the wilderness”"
  claim: "The Hebrew has \"a voice of one calling\" (qōwl qōwrēʾ), with an accent after qōwrēʾ"
  key: "biblehub-interlinear"
  url: 'https://biblehub.com/interlinear/isaiah/40-3.htm'
  quote: 'qō·w·rê, קוֹרֵ֔א of one calling V‑Qal‑Prtcpl‑ms'
- where: "note 40:3 “A voice in the wilderness”"
  claim: "In its first setting the highway is for the Lord Himself through the desert, like a new Exodus"
  key: "delitzsch"
  url: 'https://biblehub.com/commentaries/kad/isaiah/40.htm'
  quote: 'It was through the desert that He went to redeem Israel out of Egyptian bondage, and to reveal Himself to Israel from Sinai'
- where: "note 40:3 “A voice in the wilderness”"
  claim: "As Israel looked for Him then, so He was to be looked for by His people again"
  key: "delitzsch"
  url: 'https://biblehub.com/commentaries/kad/isaiah/40.htm'
  quote: 'Just as His people looked for Him then, when they were between Egypt and Canaan; so was He to be looked for by His people again'
- where: "note 40:4 “Mountains made low”"
  claim: "The crier is like a king's outrider, preparing the road through a pathless desert"
  key: "delitzsch"
  url: 'https://biblehub.com/commentaries/kad/isaiah/40.htm'
  quote: 'The crier is like the outrider of a king, who takes care that the way by which the king is to go shall be put into good condition.'
- where: "note 40:4 “Mountains made low”"
  claim: "The way leads through the pathless desert"
  key: "delitzsch"
  url: 'https://biblehub.com/commentaries/kad/isaiah/40.htm'
  quote: 'this way leads through the pathless desert'
- where: "note 40:4 “Mountains made low”"
  claim: "The JST appendix summarizes Luke 3:4–11 as Christ coming to bring salvation and coming again in the fulness of times to judge"
  key: "jst-lk-3"
  url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-luke/3?lang=eng'
  quote: 'Christ will come as prophesied to bring salvation to Israel and to the Gentiles. In the fulness of times, He will come again to judge the world.'
- where: "note 40:4 “Mountains made low”"
  claim: "The extreme terraforming of 3 Nephi could correlate with Isaiah's prophecy that every valley be exalted"
  key: "sc-knowhy-754"
  url: 'https://scripturecentral.org/knowhy/why-did-mormon-say-that-many-prophets-prophesied-of-the-destructions-in-3-nephi'
  quote: 'This could correlate with Isaiah’s prophecy that “every valley shall be exalted, and every mountain and hill shall be made low: and the crooked shall be made straight, and the rough places plain.”'
