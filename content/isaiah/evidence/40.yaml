  key: "bdb"
  url: 'https://biblehub.com/hebrew/2617.htm'
  quote: 'lovely appearance: כָּלחַֿסְדּוֺ כְּצִיץ הַשָֹּׁדֶה Isaiah 40:6 all its loveliness as the flower of the field (so Thes Hi De Che Di and others; but δόξα ᵐ51Peter 1:24 & gloria ᵑ9 favour an original reading'
- where: "note 40:8 “Grass and the word”"
  claim: "Chasdō is the charm of outward appearance; the Septuagint has δόξα (glory) as Peter quotes it"
  key: "delitzsch"
  url: 'https://biblehub.com/commentaries/kad/isaiah/40.htm'
  quote: 'Chasdō is the charm or gracefulness of the outward appearance'
