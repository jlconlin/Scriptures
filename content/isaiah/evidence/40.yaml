  claim: "The Septuagint renders it with euangelizomai"
  key: "lxx-rahlfs"
  url: 'https://www.ellopos.net/elpenor/greek-texts/septuagint/chapter.asp?book=43&page=40'
  quote: 'ἀνάβηθι, ὁ εὐαγγελιζόμενος Σιών'
- where: "note 40:9 “The herald of good tidings”"
  claim: "The verb lies at the root of the New Testament euangelizein; Zion-Jerusalem herself is called the herald (apposition), against Knobel's reading following the LXX and Targum"
  key: "delitzsch"
  url: 'https://biblehub.com/commentaries/kad/isaiah/40.htm'
  quote: 'It lies at the root of the New Testament εὐαγγελίζειν (evangelize)'
- where: "note 40:9 “The herald of good tidings”"
  claim: "Zion herself announces it to the cities of Judah (apposition); the alternative follows the LXX and Targum"
  key: "delitzsch"
  url: 'https://biblehub.com/commentaries/kad/isaiah/40.htm'
  quote: 'Knobel and others follow the lxx and Targum, and regard Zion and Jerusalem as accusatives of the object'
- where: "note 40:11 “The mighty arm that carries lambs”"
  claim: "In verse 10 the arm rules for Him (a conqueror's arm)"
  key: "delitzsch"
  url: 'https://biblehub.com/commentaries/kad/isaiah/40.htm'
  quote: 'His arm ruling for Him'
- where: "note 40:11 “The mighty arm that carries lambs”"
  claim: "The shepherd takes in his arm the lambs that cannot keep pace, carries them in the bosom of his dress, and does not overdrive the mothers (Gen. 33:13)"
  key: "delitzsch"
