  claim: "The Septuagint reads \"and I said\" (kai eipa)"
  key: "lxx-rahlfs"
  url: 'https://www.ellopos.net/elpenor/greek-texts/septuagint/chapter.asp?book=43&page=40'
  quote: 'φωνὴ λέγοντος· βόησον· καὶ εἶπα· τί βοήσω;'
