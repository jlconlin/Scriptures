  claim: "Oppressors of Israel are mortal and their chesed is perishable"
  key: "delitzsch"
  url: 'https://biblehub.com/commentaries/kad/isaiah/40.htm'
  quote: 'The oppressors of Israel are mortal, and their chesed with which they impose and bribe is perishable'
