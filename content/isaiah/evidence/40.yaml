  claim: "The Septuagint of verse 6 reads \"all the glory of man as the flower of grass\""
  key: "lxx-rahlfs"
  url: 'https://www.ellopos.net/elpenor/greek-texts/septuagint/chapter.asp?book=43&page=40'
  quote: 'πᾶσα σάρξ χόρτος, καὶ πᾶσα δόξα ἀνθρώπου ὡς ἄνθος χόρτου'
- where: "note 40:9 “The herald of good tidings”"
  claim: "mĕbaśśeret is a feminine participle of bāśar, \"to bear tidings\""
  key: "bdb"
  url: 'https://biblehub.com/hebrew/1319.htm'
  quote: 'feminine מְבַשֶּׂרֶת Isaiah 40:9 (twice in verse)'
- where: "note 40:9 “The herald of good tidings”"
  claim: "bāśar means \"bear tidings\""
  key: "bdb"
  url: 'https://biblehub.com/hebrew/1319.htm'
  quote: 'verb bear tidings'
