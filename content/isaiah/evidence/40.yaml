  claim: "The Masoretic Text reads \"and he said\" (wĕʾāmar)"
  key: "biblehub-interlinear"
  url: 'https://biblehub.com/interlinear/isaiah/40-6.htm'
  quote: 'wə·’ā·mar וְאָמַ֖ר And he said Conj‑w ¦ V‑Qal‑ConjPerf‑3ms'
