  claim: "The participle is feminine singular (Piel) in the Hebrew text of 40:9"
  key: "biblehub-interlinear"
  url: 'https://biblehub.com/interlinear/isaiah/40-9.htm'
  quote: 'mə·ḇaś·śe·reṯ מְבַשֶּׂ֣רֶת bringing news V‑Piel‑Prtcpl‑fsc'
