chapter: 66
claims:
  - where: when
    claim: 'The prophecy looks to a community about to return from exile and rebuild the temple (Delitzsch’s reading)'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/66.htm'
    quote: 'The condemnation on the part of Jehovah has reference to the temple, which the returning exiles intend to build in Jerusalem.'
  - where: setting
    claim: 'Chapter 66 continues the sharp line drawn in chapter 65 between the Lord’s servants and the worldly majority'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/66.htm'
    quote: 'the sharp line of demarcation drawn in chapter 65, between the servants of Jehovah and the worldly majority of the nation with reference to the approaching return to the Holy Land, is continued here'
  - where: setting
    claim: 'Isaiah 66 coincides with the first chapter in condemning ritual worship (Isa. 1:11–15)'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/66.htm'
    quote: 'In this condemnation of the ritual acts of worship, the closing prophecy of the book of Isaiah coincides with the first (Isaiah 1:11-15).'
  - where: setting
    claim: 'Isa. 1:2 “they have rebelled against me” uses the verb pāšaʿ with the preposition bî'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/isaiah/1-2.htm'
    quote: 'pā·šə·‘ū פָּ֥שְׁעוּ have rebelled V‑Qal‑Perf‑3cp'
  - where: setting
    claim: 'Isa. 66:24 “the men that have transgressed against me” uses the same verb (pāšaʿ, participle) and bî'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/isaiah/66-24.htm'
    quote: 'hap·pō·šə·‘îm הַפֹּשְׁעִ֖ים having rebelled Art ¦ V‑Qal‑Prtcpl‑mp'
  - where: setting
    claim: 'Isa. 1:31 “none shall quench” and Isa. 66:24 “shall not be quenched” use the same Hebrew verb (kābâ)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/isaiah/1-31.htm'
    quote: 'mə·ḵab·beh. מְכַבֶּֽה׃ס will quench [them] V‑Piel‑Prtcpl‑ms'
  - where: setting
    claim: 'Isa. 66:24 “neither shall their fire be quenched” uses the verb kābâ (tiḵbeh)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/isaiah/66-24.htm'
    quote: 'ṯiḵ·beh, תִכְבֶּ֔ה is quenched V‑Qal‑Imperf‑3fs'
  - where: 'note 66:1 “A house for the Lord?”'
    claim: 'The prophecy is addressed to the exiles who meant to build the temple in Jerusalem; the Lord needs no house made by hands, but this is not a rejection of temple worship, which the chapter presupposes (v. 20; cf. v. 6)'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/66.htm'
    quote: 'The prophecy is addressed to the entire body now ready to return, and says to the whole without exception, that Jehovah, the Creator of heaven and earth, does not stand in need of any house erected by human hands'
  - where: 'note 66:1 “A house for the Lord?”'
    claim: 'The prophecy presupposes a temple with sacrifice in the new Jerusalem (v. 20, cf. v. 6), so it is not a rejection of the temple'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/66.htm'
    quote: 'there will be a temple in the new Jerusalem with perpetual sacrifice, which this prophecy also presupposes in Isaiah 66:20. (cf., Isaiah 66:6)'
  - where: 'note 66:1 “A house for the Lord?”'
    claim: 'The Hebrew of v. 3 sets participial pairs side by side with no “as if”; the KJV supplies it (“slaughterer of an ox, killer of a man; sacrificer of a lamb, breaker of a dog’s neck” renders the participles: the one slaughtering an ox, strikes down a man)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/isaiah/66-3.htm'
    quote: 'šō·w·ḥêṭ שׁוֹחֵ֨ט The one slaughtering … haš·šō·wr הַשּׁ֜וֹר an ox … mak·kêh- מַכֵּה־ strikes down … ’îš, אִ֗ישׁ a man'
  - where: 'note 66:1 “A house for the Lord?”'
    claim: 'The slaughterer/killer pairs are the Hebrew participles, rendered by Delitzsch “the slaughter of an ox was like the slaying of a man … the sacrifice of a sheep like the strangling of a dog”'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/66.htm'
    quote: 'The slaughter of an ox was like the slaying (makkēh construct with tzere) of a man'
  - where: 'note 66:1 “A house for the Lord?”'
    claim: 'Sacrifice offered without the right heart is as bad as the acts named (the point of Isa. 1:11)'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/66.htm'
    quote: 'The sacrificial acts, to which such detestable predicates are here applied, are such as end with the merely external act, whilst the inward feelings of the person presenting the sacrifice are altogether opposed to the idea of both the animal sacrifice and the meat-offering'
  - where: 'note 66:2 “Those who tremble at His word”'
    claim: 'ʿānî, nəkēh-rûaḥ (“poor … of a contrite spirit”) and ḥārēd (“trembleth”) in v. 2'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/isaiah/66-2.htm'
    quote: 'ʿā·nî עָנִי֙ the poor … ū·nə·ḵêh- וּנְכֵה־ and stricken one … rū·aḥ, ר֔וּחַ in spirit … wə·ḥā·rêḏ וְחָרֵ֖ד and [who] trembles'
  - where: 'note 66:2 “Those who tremble at His word”'
    claim: 'The word “trembleth” (ḥārēd) appears again in v. 5 as the participle “ye that tremble”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/isaiah/66-5.htm'
    quote: 'ha·ḥă·rê·ḏîm הַחֲרֵדִ֖ים [you who] tremble Art ¦ Adj‑mp'
  - where: 'note 66:5 “Cast out by their brethren”'
    claim: 'mənaddêkem (nādâ, Piel participle) means “thrust away, exclude from association in worship”'
    key: bdb
    url: 'https://biblehub.com/hebrew/5077.htm'
    quote: 'מְנַדֵּיכֶם Isaiah 66:5 thrust away, exclude from association in worship'
  - where: 'note 66:5 “Cast out by their brethren”'
    claim: 'The persecutors speak in unbelieving scorn: “Let the LORD be glorified, that we may see your joy”'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/66.htm'
    quote: 'With unbelieving scorn they say to those who confess Jehovah, and believe in the word of the true redemption: Let Jehovah glorify Himself'
  - where: 'note 66:5 “Cast out by their brethren”'
    claim: 'The Hebrew of v. 5 has “your brothers who hate you” and “casting you out” (the verse’s own wording confirmed in Hebrew)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/isaiah/66-5.htm'
    quote: 'śō·nə·’ê·ḵem שֹׂנְאֵיכֶ֜ם who hate you⁺ … mə·nad·dê·ḵem, מְנַדֵּיכֶם֙ [and] casting you⁺ out'
  - where: 'note 66:5 “Cast out by their brethren”'
    claim: 'The verse reflects the same exclusion described in Luke 6:22 (cf. John 16:2)'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/66.htm'
    quote: 'נדּה from נר, to scare away or thrust away (Amos 6:3, with the object in the dative), corresponds to ἀφορίζειν in Luke 6:22'
  - where: 'note 66:8 “A nation born in a day”'
    claim: 'JST Rev. 12:7 identifies the woman as the church of God, who brought forth the kingdom of God and his Christ'
    key: jst-rev-12
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-rev/12?lang=eng'
    quote: 'the woman which was the church of God, who had been delivered of her pains, and brought forth the kingdom of our God and his Christ'
  - where: 'note 66:13 “Comfort, at the end”'
    claim: 'The verb niḥam (comfort) runs through Isa. 40:1, 51:3, 51:12, 61:2 and appears in 66:13 (three Hebrew forms in one verse: tənaḥămennû, ʾănaḥemkem, tənuḥāmû), its last use in the book'
    key: bdb
    url: 'https://biblehub.com/hebrew/5162.htm'
    quote: 'Isaiah 40:1 (twice in verse); Isaiah 51:3 (twice in verse); Isaiah 51:12,19; Isaiah 61:2; Isaiah 66:13 (twice in verse)'
  - where: 'note 66:13 “Comfort, at the end”'
    claim: 'Isa. 66:13 has three comfort verbs: “comforts” (Piel, third person), “will comfort you” (Piel, 1cs) and “you will find comfort” (Pual)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/isaiah/66-13.htm'
    quote: 'tə·na·ḥă·men·nū; תְּנַחֲמֶ֑נּוּ comforts … ’ă·na·ḥem·ḵem, אֲנַ֣חֶמְכֶ֔ם will comfort you⁺ … tə·nu·ḥā·mū. תְּנֻחָֽמוּ׃ you⁺ will find comfort'
  - where: 'note 66:19 “Sent to the nations”'
    claim: 'Tarshish is in the extreme west (the Spanish Tartessus); the escaped remnant is sent to distant peoples who have not heard of the Lord'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/66.htm'
    quote: "there is far greater propriety in looking for Tarshish, as the opposite point to 'Ophir, in the extreme west, where the name of the Spanish colony Tartessus resembles it in sound"
  - where: 'note 66:19 “Sent to the nations”'
    claim: 'The survivors are the Lord’s messengers to the nations; the nations bring Israel home as an offering in a clean vessel'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/66.htm'
    quote: 'those who have escaped are to bring to the far distant heathen world the tidings of Jehovah, the God who has been manifested in judgment and grace'
  - where: 'note 66:19 “Sent to the nations”'
    claim: 'Javan is Greece (Isa. 66:19 listed as a distant people)'
    key: bdb
    url: 'https://biblehub.com/hebrew/3120.htm'
    quote: 'as distant, Isaiah 66:19, ᵐ5 Ἑλλάς (with תַּרְשִׁישׁ, מּוּל, לוּד, תּוּבַל and הָאִיִּים הָֽרְחֹקִים'
  - where: 'section 4 plain'
    claim: '“Pul and Lud (famous archers)”: the epithet “drawers of the bow” fits the people of Pūt/Lud'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/66.htm'
    quote: 'The epithet קשׁת משׁכי (drawers of the bow) is admirably adapted to the inhabitants of Pūt'
  - where: 'section 1 plain'
    claim: '“Harsh treatment” for the Hebrew taʿălûlêhem, “ill-treatments”; “pig’s blood”; “praises an idol” (blesses ʾāwen, an idol)'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/66.htm'
    quote: 'He chooses tha‛ălūlēhem, vexationes eorum (lxx τὰ ἐμπαίγματα αὐτῶν: see at Isaiah 3:4), with the suffix of the object: fates that will use them ill'
  - where: 'section 1 plain'
    claim: '“Your own people who hate you” — the persecutors are their own brethren'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/66.htm'
    quote: 'They that hate them are their own brethren, and (what makes the sin still greater) the name of Jehovah is the reason why they are hated by them.'
  - where: 'note 66:21 “Foreigners as priests”'
    claim: 'Aaronic/Levitical descent was required; “of them” (mēhem) most naturally means the converted nations who bring Israel home, since promising priesthood to returning Israelites would promise nothing new'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/66.htm'
    quote: 'something would be promised, which needed no promise at all, since the right of the native cohen and Levites to take part in the priesthood and temple service was by no means neutralized by their sojourn in a foreign land'
  - where: 'note 66:21 “Foreigners as priests”'
    claim: 'meehem refers to the converted heathen who brought the Israelites home'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/66.htm'
    quote: 'meehem must refer to the converted heathen, by whom the Israelites had been brought home'
  - where: 'note 66:21 “Foreigners as priests”'
    claim: 'nilwâ (Isa. 56:6, “join themselves”) is from the verb lāwâ, “join”, the verb of Levi’s name play (Gen. 29:34)'
    key: bdb
    url: 'https://biblehub.com/hebrew/3867.htm'
    quote: 'Niph`al נִלְוָה Psalm 83:9; Isaiah 14:1; … Imperfect יִלָּוֶה Genesis 29:34; … Isaiah 56:6'
  - where: 'note 66:21 “Foreigners as priests”'
    claim: 'Isa. 56:6 has the participle “those who join themselves” (han·nil·wîm)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/isaiah/56-6.htm'
    quote: 'han·nil·wîm הַנִּלְוִ֤ים who join themselves'
  - where: 'note 66:21 “Foreigners as priests”'
    claim: 'Isa. 66:21 shows the same spirit that broke through the restraints of the law in Isa. 56 (the frame of Isa. 56–66)'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/66.htm'
    quote: 'The very same spirit, which broke through all the restraints of the law in Isaiah 56:1-12, is to be seen at work here as well.'
  - where: 'note 66:24 “The last verse”'
    claim: 'The scene is outside Jerusalem; the Hinnom valley outside Jerusalem became Gehenna'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/66.htm'
    quote: 'The Hinnom-valley outside Jerusalem has become Gehenna'
  - where: 'note 66:24 “The last verse”'
    claim: 'Hinnom is a valley south of Jerusalem'
    key: bdb
    url: 'https://biblehub.com/hebrew/2011.htm'
    quote: 'proper name, of a location of valley south of Jerusalem'
  - where: 'note 66:24 “The last verse”'
    claim: 'The Hinnom valley (Gehenna) was associated with burning and the Lord’s wrath by Lehi’s time and in the New Testament'
    key: sc-knowhy-81
    url: 'https://scripturecentral.org/knowhy/why-do-the-scriptures-compare-hell-to-an-unquenchable-fire'
    quote: 'around the time that Lehi left Jerusalem, and well before, the valley of Hinnom (Gehenna) was associated with burning, destruction and the fiery wrath of God in the minds of the inhabitants of Jerusalem.'
  - where: 'note 66:24 “The last verse”'
    claim: 'Benjamin treats the fire as the sinner’s own awareness of guilt, not an actual pit of fire'
    key: sc-knowhy-81
    url: 'https://scripturecentral.org/knowhy/why-do-the-scriptures-compare-hell-to-an-unquenchable-fire'
    quote: 'these feelings of fiery wrath do not come from an actual pit of fire, or the like, but from the sinner’s awakening “to an awful view of their own guilt and abominations,”'
  - where: 'note 66:24 “The last verse”'
    claim: 'dērāʾôn (“abhorring”) occurs in only one other place, Dan. 12:2, and is the strongest word for abomination; it is the last word of the Hebrew verse'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/66.htm'
    quote: 'דראון, which only occurs again in Daniel 12:2, is the strongest word for "abomination."'
  - where: 'note 66:24 “The last verse”'
    claim: 'The Hebrew of v. 24 ends with dērāʾôn, “an abhorrence to all flesh”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/isaiah/66-24.htm'
    quote: 'ḏê·rā·’ō·wn דֵרָא֖וֹן an abhorrence N‑ms 1860 [e] lə·ḵāl לְכָל־ to all'
  - where: 'note 66:24 “The last verse”'
    claim: 'The New Testament (Mark 9:43ff.) takes up this verse, translating its figures into the life to come'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/66.htm'
    quote: 'as has already been done in the apocryphal books of Judith (16:17) and Wisdom (7:17), as well as in the New Testament, e.g., Mark 9:43., with evident reference to this passage'
