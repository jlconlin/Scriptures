# Evidence ledger for Isaiah 5 (audit, 2026-10-01)
chapter: 5
claims:
  - where: 'when'
    claim: 'Chapter belongs to the time of Uzziah and Jotham, a time of peace and wealth'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/5.htm'
    quote: 'it relates to the time of Uzziah and Jotham - a time of peace, of strength, and wealth, but also of pride and luxury'
  - where: 'when'
    claim: 'Isaiah prophesied in Jerusalem 740–701 BC'
    key: bd-isaiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/isaiah?lang=eng'
    quote: 'a prophet in Jerusalem during 40 years, 740–701 B.C.'
  - where: 'setting'
    claim: 'Isaiah begins like a musician addressing his hearers'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/5.htm'
    quote: 'he commences the third like a musician, addressing both himself and his hearers with enticing words'
  - where: 'setting'
    claim: 'Nathan’s parable led David to condemn himself, as the hearers of the song do'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/5.htm'
    quote: 'as David condemned himself in connection with Nathan''s parable, 2 Samuel 12:5'
  - where: 'setting'
    claim: 'Nephi included Isaiah 5 as 2 Nephi 15'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/15?lang=eng'
    quote: 'The Lord will lift an ensign and gather Israel—Compare Isaiah 5'
  - where: 'thread'
    claim: 'Assyria is the army of the ensign'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/5.htm'
    quote: 'The nations through whom this was primarily fulfilled were the nations of the Assyrian empire.'
  - where: 'thread'
    claim: 'Only the Lord commands the clouds; the vineyard owner is the Lord'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/5.htm'
    quote: 'There can be no longer any doubt who the Lord of the vineyard is. He is Lord of the clouds'
  - where: 'thread'
    claim: 'The winepress was cut in the rock in confident expectation of a harvest'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/5.htm'
    quote: 'it was an evidence of the most confident expectation'
  - where: 'thread'
    claim: 'Pun mishpat / mispach (probably bloodshed; violence)'
    key: bdb
    url: 'https://biblehub.com/hebrew/4939.htm'
    quote: 'probably outpouring (of blood), bloodshed (שׂ substantive for ס; word chosen for assonance with מִשְׁמָּט)'
  - where: 'thread'
    claim: 'Pun tsedaqah / tseʿaqah, a cry of distress'
    key: bdb
    url: 'https://biblehub.com/hebrew/6818.htm'
    quote: 'cry of distress especially as heard by ׳י Exodus 3:7 (J), Exodus 22:22 (E), compare Isaiah 5:7'
  - where: 'thread'
    claim: 'The woes are six, as numbered by Delitzsch (the sixth is the heroes at drinking and the corrupt courts)'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/5.htm'
    quote: 'The sixth woe: "Woe to those who are heroes to drink wine, and brave men to mix strong drink; who acquit criminals for a bribe'
  - where: 'thread'
    claim: 'Latter-day Saints read the ensign as a gathering symbol'
    key: gs-ensign
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/ensign?lang=eng'
    quote: 'The Book of Mormon and the Church of Jesus Christ are symbolic ensigns to all nations of the earth.'
  - where: 'section 1 plain'
    claim: 'mispach rendered “violence” (forcible appropriation / bloodshed)'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/5.htm'
    quote: 'Hence we regard mispach as denoting the forcible appropriation of another man''s property'
  - where: 'section 2 plain'
    claim: 'The exile comes “without knowing”'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/5.htm'
    quote: 'mibb''li, as a preposition, always signifies "without" (absque)'
