    claim: 'Bible Dictionary on grace enabling good works'
    key: bd-grace
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/grace?lang=eng'
    quote: 'receive strength and assistance to do good works that they otherwise would not be able to maintain if left to their own means'
