# Evidence ledger for Isaiah 26 (audit, 2026-10-01)
chapter: 26
claims:
  - where: 'setting'
    claim: 'Chapter 26 follows a hymn in chapter 25 (a third hymnic echo)'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/26.htm'
    quote: 'a third hymnic echo now arises'
  - where: 'setting'
    claim: 'The Old Testament Student Manual calls verse 19 a clear statement of resurrection'
    key: ot-manual-15
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-15?lang=eng'
    quote: 'Verse 19 is a clear statement of the fact of resurrection, the Lord’s and our own.'
  - where: 'section 1 plain'
    claim: 'Plain rendering of 26:1–6 follows the NIV'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Isaiah+26&version=NIV'
    quote: 'We have a strong city'
  - where: 'section 2 plain'
    claim: 'Plain rendering of 26:7–11 follows the NIV'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Isaiah+26&version=NIV'
    quote: 'Yes, Lord, walking in the way of your laws'
  - where: 'section 3 plain'
    claim: 'Plain rendering of 26:12–18 follows the NIV'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Isaiah+26&version=NIV'
    quote: 'Lord, you establish peace'
  - where: 'section 4 plain'
    claim: 'Plain rendering of 26:19–21 follows the NIV'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Isaiah+26&version=NIV'
    quote: 'Go, my people, enter your rooms'
  - where: 'section 4 plain'
    claim: '“my dead body” rendered as in the KJV; Hebrew “my corpses”'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/26.htm'
    quote: '"Thy dead will live, my corpses rise again.'
  - where: 'note 26:1 “Walls made of salvation”'
    claim: 'The walls are not dead stone but salvation (yeshuah)'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/26.htm'
    quote: 'the small outside wall which encloses all the fortifications) are not dead stone'
  - where: 'note 26:2 “Open the gates”'
    claim: 'Righteous nation established in covenant truth; Psalm 24 and 118 recalled'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/26.htm'
    quote: 'We recall to mind Psalm 24:1-10'
  - where: 'note 26:2 “Open the gates”'
    claim: 'The righteous nation is established in covenant truth towards God'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/26.htm'
    quote: 'has been established in covenant truth towards God'
  - where: 'note 26:3 “Perfect peace”'
    claim: 'Shalom shalom, deep and constant peace'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/26.htm'
    quote: 'peace, peace; accusative predicates, used in the place of a consequential clause), i.e., so that deep and constant peace abides therein'
  - where: 'note 26:3 “Perfect peace”'
    claim: 'The stayed (samuk) mind has a firm hold on God'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/26.htm'
    quote: 'סמוּך is the same, regarded as having a firm hold in itself, and this it has whenever it has a firm hold on God'
  - where: 'note 26:4 “The Rock of Ages”'
    claim: 'Hebrew reads “a rock of ages”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/isaiah/26-4.htm'
    quote: 'For in Jah Jehovah [is] a rock of ages'
  - where: 'note 26:4 “The Rock of Ages”'
    claim: 'Bible Dictionary cites Isa. 26:4 for the name Jehovah'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'the eternal I Am” (Ex. 6:3; Ps. 83:18; Isa. 12:2; 26:4)'
  - where: 'note 26:4 “The Rock of Ages”'
    claim: 'Jah Jehovah occurs only here and in Isa. 12:2'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/26.htm'
    quote: 'The combination Jah Jehovah is only met with here and in Isaiah 12:2.'
  - where: 'note 26:9 “Why judgments come”'
    claim: 'Verse 10: favor to the wicked does not teach righteousness'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/26.htm'
    quote: '"If favour is shown to the wicked man, he does not learn righteousness; in the most upright land he acts wickedly'
  - where: 'note 26:12 “Everything we have done, You did”'
    claim: 'Bible Dictionary on grace as enabling power'
    key: bd-grace
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/grace?lang=eng'
    quote: 'This grace is an enabling power that allows men and women to lay hold on eternal life and exaltation after they have expended their own best efforts.'
  - where: 'note 26:12 “Everything we have done, You did”'
    claim: 'Bible Dictionary: strength and assistance to do good works'
    key: bd-grace
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/grace?lang=eng'
    quote: 'receive strength and assistance to do good works that they otherwise would not be able to maintain if left to their own means'
  - where: 'note 26:14 “The dead tyrants won’t rise”'
    claim: 'Rephaim are shades; refers to oppressors thrust to Sheol; prophet knew a resurrection'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/26.htm'
    quote: 'he had directly in mind the oppressors of Israel, who had been thrust down into the region of the shades'
  - where: 'note 26:14 “The dead tyrants won’t rise”'
    claim: 'The line does not deny a resurrection'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/26.htm'
    quote: 'for, as we shall see further on, the prophet was acquainted with such a resurrection'
  - where: 'note 26:18 “Laboring and bringing forth wind”'
    claim: '“Pang” (BDB entry II, Isa. 26:17) is a separate entry from “cord” (entry I)'
    key: bdb
    url: 'https://biblehub.com/hebrew/2256.htm'
    quote: 'suffix חֲבָלֶיהָ Isaiah 26:17'
  - where: 'note 26:18 “Laboring and bringing forth wind”'
    claim: 'BDB entry I covers cord, band'
    key: bdb
    url: 'https://biblehub.com/hebrew/2256.htm'
    quote: 'cord, territory, band'
  - where: 'note 26:18 “Laboring and bringing forth wind”'
    claim: 'hevel covers both cord/band and pain/pang; Isa. 26:16–18 and Abinadi’s “bands of death”'
    key: sc-knowhy-93
    url: 'https://scripturecentral.org/knowhy/why-does-abinadi-use-the-phrase-the-bands-of-death'
    quote: 'The Hebrew word hevel expresses an impressive array of meanings, including “cord, rope, band, snare” or “pain, pang, travail”'
  - where: 'note 26:18 “Laboring and bringing forth wind”'
    claim: 'Psalm 18:4 “cords of death”, KJV “sorrows of death”'
    key: sc-knowhy-93
    url: 'https://scripturecentral.org/knowhy/why-does-abinadi-use-the-phrase-the-bands-of-death'
    quote: 'although the KJV renders it as “sorrows of death.”'
  - where: 'note 26:19 “The resurrection”'
    claim: 'OT manual: verse 19 a clear statement of resurrection, “the Lord’s and our own”'
    key: ot-manual-15
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-15?lang=eng'
    quote: 'Verse 19 is a clear statement of the fact of resurrection, the Lord’s and our own.'
  - where: 'note 26:19 “The resurrection”'
    claim: 'Hebrew “my corpses” spoken by the community of the faithful'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/26.htm'
    quote: 'The church, filled with hope which will not be put to shame, now calls to itself, "Thy dead will live"'
  - where: 'note 26:19 “Awake from the dust”'
    claim: '“dew of the lights” reading; “herbs” as another rendering'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/26.htm'
    quote: 'Others render it "dew upon herbs," taking אורות as equivalent to ירקות'
  - where: 'note 26:19 “Awake from the dust”'
    claim: 'Lights of life reading'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/26.htm'
    quote: 'in the sense of החיּים אור'
  - where: 'note 26:19 “Awake from the dust”'
    claim: 'hippil is a causative of naphal (verse 18)'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/26.htm'
    quote: 'will bring shades to the day" (hippil, as a causative of'
  - where: 'note 26:19 “Awake from the dust”'
    claim: 'naphal in v. 18 read as falling of the fruit of the womb'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/26.htm'
    quote: 'is here used for the falling of the fruit of the womb'
  - where: 'note 26:19 “Awake from the dust”'
    claim: 'NIV renders “the earth will give birth to her dead”'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Isaiah+26&version=NIV'
    quote: 'the earth will give birth to her dead'
  - where: 'note 26:20 “Hide until the wrath passes”'
    claim: 'People of God stay in solitude of prayer; hidden as Noah in the ark'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/26.htm'
