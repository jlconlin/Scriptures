# Evidence ledger for Isaiah 14 (audit, 2026-10-01)
chapter: 14
claims:
  - where: 'setting'
    claim: 'Latter-day revelation equates Lucifer with Satan'
    key: bd-lucifer
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/lucifer?lang=eng'
    quote: 'Latter-day revelation clarifies the fall of Lucifer and equates him with Satan'
  - where: 'thread'
    claim: 'Helel ben Shachar means “shining one, son of dawn”; Lucifer is Latin for “light-bearer”'
    key: sc-knowhy-43
    url: 'https://scripturecentral.org/knowhy/why-did-lehi-suppose-the-existence-of-satan'
    quote: 'The name rendered as “Lucifer” (Latin for “light-bearer”) in the Hebrew text is Helel ben Shachar (hēylēl ben šāḥar) and literally means “shining one, son of dawn.”'
  - where: 'thread'
    claim: 'Sheol is the abode of departed spirits (the world of the dead)'
