# Evidence ledger for Isaiah 7 (audit, 2026-10-01)
chapter: 7
claims:
  - where: 'when'
    claim: 'Assyria destroyed the Syro-Ephraimite alliance in 732 BC; Isaiah warned Ahaz not to join it (Isaiah in the Book of Mormon, printed p. 155; PDF p. 168)'
