  - where: 'setting'
    claim: 'The coalition attempted to subjugate Judah'
    key: ot-manual-f
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/enrichment-f?lang=eng'
    quote: 'The coalition of Pekah, king of Israel, and Rezin, king of Syria, began an attempt to subjugate Judah during this era.'
  - where: 'setting'
    claim: 'Tiglath-pileser III of Assyria exacted tribute from Israel (Assyria advancing westward)'
