    url: 'https://storage.googleapis.com/scripturecentral-prod-strapi-uploads/ry_and_welch_isaiah_in_the_book_of_mormon_1998_184195e137/ry_and_welch_isaiah_in_the_book_of_mormon_1998_184195e137.pdf'
    quote: 'In chapter 17, Isaiah warns Ahaz, king of Judah, not to join the Syro-Ephraimite alliance against Assyria, because the alliance would soon be destroyed. In fulfillment of this prophecy, Assyria destroyed the Syro-Ephraimite alliance in 732 b . c .'
