chapter: 42
claims:
  - where: 'when'
    claim: 'The chapter is addressed to Israel in exile (the prophecy stands late in the captivity, which had already lasted decades).'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/42.htm'
    quote: 'The standpoint of these prophecies has the larger half of the captivity behind it. It has already lasted a long time, though only for several decades'
  - where: 'setting'
    claim: 'Some readers take the servant as Israel (national or ideal), others as the Messiah; the Targum already took Isa. 42:1 messianically.'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/42.htm'
    quote: 'It must therefore be the future Christ; and this is the view taken in the Targum, where the translation of our prophecy commences thus: "Hâ'' ‛abhdı̄ Meshı̄châ."'
  - where: 'setting'
    claim: 'Some readers take the servant to be Israel (or the prophets as a body, regarded as one ideal person).'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/42.htm'
    quote: 'Amongst those who suppose that the "servant of Jehovah" is either Israel, regarded in the light of its prophetic calling, or the prophets as a body'
  - where: 'thread'
    claim: 'The servant of verses 18–25 (Israel) is blamed for the contrast between its conduct and its calling, and its mission is nevertheless fulfilled in the Servant who proceeds from Israel (the Christian reading Delitzsch gives).'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/42.htm'
    quote: 'the expression "whom I send" nevertheless affirms that it will fulfil it - namely, in the person of the servant of Jehovah'
  - where: 'section 1 plain'
    claim: '“Whom I support” renders Hebrew tāmakh, to lay firm hold of and keep upright.'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/42.htm'
    quote: 'Tâmakh b'' means to lay firm hold of and keep upright (sustinere).'
  - where: 'section 1 plain'
    claim: 'The Church edition’s footnotes: “lift up” means the voice (2a); “A bruised reed…” means he will not harm nor hurt the weakest (3a).'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/42?lang=eng'
    quote: 'IE He will not harm nor hurt the weakest.'
  - where: 'section 1 plain'
    claim: '“Coastlands” renders Hebrew ʾiyyîm (KJV “isles”): coast, region.'
    key: bdb
    url: 'https://biblehub.com/hebrew/339.htm'
    quote: 'coast, border, region (mostly late), of Philistia & Phenicia with adjacent country'
  - where: 'section 4 plain'
    claim: 'The Church edition’s footnote on “jealousy” (v. 13) gives “zeal, ardor,” the sense used in the plain words.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/42?lang=eng'
    quote: 'OR zeal, ardor.'
  - where: 'section 5 plain'
    claim: 'The Church edition’s footnote says the “people” of vv. 22–25 are Israel of Isaiah’s time.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/42?lang=eng'
    quote: 'IE Israel of Isaiah’s time (vv. 22–25).'
  - where: 'note 42:1 ““In whom my soul delighteth””'
    claim: 'At Jesus’s baptism the voice said “in whom I am well pleased”; Matthew’s quotation of Isa. 42:1 reads “my beloved, in whom my soul is well pleased.”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/12?lang=eng'
    quote: 'Behold my servant, whom I have chosen; my beloved, in whom my soul is well pleased: I will put my spirit upon him, and he shall shew judgment to the Gentiles.'
  - where: 'note 42:1 ““In whom my soul delighteth””'
    claim: 'The voice at the baptism: “This is my beloved Son, in whom I am well pleased.”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/3?lang=eng'
    quote: 'And lo a voice from heaven, saying, This is my beloved Son, in whom I am well pleased.'
  - where: 'note 42:3 “The bruised reed and the smoking wick”'
    claim: '“Bruised” (rāṣûṣ) reed is the passive participle of rāṣaṣ, “crush,” used in 2 Kgs 18:21 (= Isa. 36:6) as a metaphor of a weak person.'
    key: bdb
    url: 'https://biblehub.com/hebrew/7533.htm'
    quote: 'a. passive participle in (הַ)קָּנֶה (הָ)רָצוּץ 2 Kings 18:21 = Isaiah 36:6; Isaiah 42:3 (all metaphor of weak person).'
  - where: 'note 42:3 “The bruised reed and the smoking wick”'
    claim: 'A bruised reed is cracked and half-broken already; the wick is one burning feebly and nearly out; the passage implies more than it says (he will save what is dying out).'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/42.htm'
    quote: '"Bruised:" râtsūts signifies here, as in Isaiah 36:6, what is cracked, and therefore half-broken already. Glimmering: kēheh … that which is burning feebly, and very nearly extinguished.'
  - where: 'note 42:3 “The bruised reed and the smoking wick”'
    claim: 'The statement that He will not break or quench implies more than is expressed: He will not destroy the life that is dying out but save it.'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/42.htm'
    quote: 'there is more implied than is really expressed. Not only will He not destroy the life that is dying out, but He will actually save it'
  - where: 'note 42:3 “The bruised reed and the smoking wick”'
    claim: 'Verse 4’s “shall not fail” (yikheh) points back to the wick and “be discouraged” (yārûṣ) to the bruised reed; the verbs mean grow dim and be crushed.'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/42.htm'
    quote: 'As יכהה (become faint) points back to כהה פשׁתה (the finat or glimmering wick), so ירּוץ must point back to רצוּץ קנה (the bruised or broken reed)'
  - where: 'note 42:3 “The bruised reed and the smoking wick”'
    claim: 'BDB: rāṣaṣ in Isa. 42:4 is “he shall not grow dim or be crushed out,” of the servant under the figure of a wick.'
    key: bdb
    url: 'https://biblehub.com/hebrew/7533.htm'
    quote: 'of servant of ׳י, under figure of wick, Isaiah 42:4 (+ יִכְהֶה) he shall not grow dim or be crushed out.'
  - where: 'note 42:3 “The bruised reed and the smoking wick”'
    claim: 'kēhâ means dim, faint, and is used of a burning wick in Isa. 42:3.'
    key: bdb
    url: 'https://biblehub.com/hebrew/3544.htm'
    quote: 'dim, of eyes 1 Samuel 3:2; of burning wick (׳כִּשְׁתָּה כ) Isaiah 42:3'
  - where: 'note 42:3 “The bruised reed and the smoking wick”'
    claim: 'pištâ (“flax”) means wick in Isa. 42:3.'
    key: bdb
    url: 'https://biblehub.com/hebrew/6594.htm'
    quote: '2 = wick Isaiah 42:3; Isaiah 43:17 (in simile).'
  - where: 'note 42:3 “The bruised reed and the smoking wick”'
    claim: 'The Hebrew words of verse 3: qāneh (reed), rāṣûṣ (bruised), not break.'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/isaiah/42-3.htm'
    quote: 'qā·neh קָנֶה A reed … rā·ṣūṣ רָצוּץ bruised'
  - where: 'note 42:4 “Justice and teaching for the nations”'
    claim: 'mišpāṭ occurs in verse 1 (“and justice”), verse 3, and verse 4 (three times in vv. 1–4).'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/isaiah/42-4.htm'
    quote: 'miš·pāṭ; מִשְׁפָּ֑ט justice'
  - where: 'note 42:4 “Justice and teaching for the nations”'
    claim: 'mišpāṭ means justice, right, rectitude, as an attribute of God and as something God requires of man.'
    key: bdb
    url: 'https://biblehub.com/hebrew/4941.htm'
    quote: '2 attribute of the שֹׁפֵט, justice, right, rectitude: a. of God … ׳עשׂה מ: God requires that man should do it Micah 6:8; Isaiah 1:17'
  - where: 'note 42:4 “Justice and teaching for the nations”'
    claim: 'In Isa. 42:4 mišpāṭ is parallel to tôrâ in the sense of divine law.'
    key: bdb
    url: 'https://biblehub.com/hebrew/4941.htm'
    quote: 'divine law in General … "" תורה Isaiah 42:4; Isaiah 51:4'
  - where: 'note 42:4 “Justice and teaching for the nations”'
    claim: 'Delitzsch reads mišpāṭ as true religion on its practical side, “religion as the law of life.”'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/42.htm'
    quote: 'Mishpât is the term employed here to denote true religion regarded on its practical side, as the rule and authority for life in all its relations, i.e., religion as the law of life'
  - where: 'note 42:4 “Justice and teaching for the nations”'
    claim: 'tôrâ means “direction, instruction, law”; instruction is its first sense, and Isa. 42:4 is listed under instruction in the Messianic age (with Isa. 2:3).'
    key: bdb
    url: 'https://biblehub.com/hebrew/8451.htm'
    quote: 'direction, instruction, law … 1 instruction: … d. instruction in Messianic age Isaiah 2:3 = Micah 4:4; Isaiah 42:4'
  - where: 'note 42:4 “Justice and teaching for the nations”'
    claim: 'Delitzsch: the coastlands “wait with longing” for the servant’s instruction, a need already present in the Gentile world.'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/42.htm'
    quote: 'לתורתו יחל can only mean "to wait with longing for a person''s instruction" (Job 29:23), and especially in this case, where no thought is more naturally suggested, than that the messenger to the Gentile world will be welcomed by a consciousness of need already existing in the heathen world itself.'
  - where: 'note 42:4 “Justice and teaching for the nations”'
    claim: 'The Hebrew word for “judgment” in verse 1 is mišpāṭ (first of three occurrences in vv. 1–4).'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/isaiah/42-1.htm'
    quote: 'miš·pāṭ מִשְׁפָּ֖ט and justice'
  - where: 'note 42:6 “A covenant and a light”'
    claim: 'The servant is himself the people’s covenant and the Gentiles’ light, the one in whom a new fellowship between Israel and the Lord is made.'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/42.htm'
    quote: 'the servant of Jehovah appears here not only as one who is the medium of a covenant to the nation, and of light to the Gentiles, but as being himself the people''s covenant and heathen''s light, inasmuch as in his own person he is the band of a new fellowship between Israel and Jehovah'
  - where: 'note 42:7 “Freeing the prisoners”'
    claim: 'The deliverance of verse 7 is read as redemption not only from bodily captivity but from spiritual bondage.'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/42.htm'
    quote: 'the deliverance which He brings is not only redemption from bodily captivity, but from spiritual bondage also.'
  - where: 'note 42:8 “That is my name”'
    claim: 'The name stresses how truly the Lord stands alone; He cannot permit the honour due Him to be transferred to sham gods.'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/42.htm'
    quote: 'That is His name, which affirms how truly He stands alone in His nature … He to whom this name belongs cannot permit the honour due to Him to be permanently transferred to sham gods.'
  - where: 'note 42:8 “That is my name”'
    claim: 'The Hebrew of the divine name in verse 8 is YHWH (“I am YHWH”).'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/isaiah/42-8.htm'
    quote: 'Yah·weh יְהוָה YHWH'
  - where: 'note 42:8 “That is my name”'
    claim: 'Latter-day Saints understand Jehovah as the premortal Jesus Christ.'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: 'note 42:14 “The silence of God, and a cry of labor”'
    claim: 'Some great thing the Lord has long been pregnant with is about to be born (the labor image conveys intensity).'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/42.htm'
    quote: 'Some great thing, with which Jehovah has, as it were, long been pregnant, is now about to be born.'
  - where: 'note 42:14 “The silence of God, and a cry of labor”'
    claim: 'The captivity had lasted several decades, which in the Lord’s love is already an “eternity.”'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/42.htm'
    quote: 'It has already lasted a long time, though only for several decades; but in the estimation of Jehovah, with His love to His people, this time of long-suffering towards their oppressors is already an "eternity"'
  - where: 'note 42:16 “Paths they have not known”'
    claim: 'The unknown ways are the ways of deliverance, known to Him alone.'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/42.htm'
    quote: 'The unknown ways in which Jehovah leads them, are the ways of deliverance, which are known to Him alone'
  - where: 'note 42:19 “The blind servant and the Joseph Smith Translation”'
    claim: 'The servant of verses 18–25 is Israel, and the “messenger whom I send” recalls the servant of verses 1–7.'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/42.htm'
    quote: 'It is impossible to read the expression, "My messenger whom I send," without thinking of Isaiah 42:1., where the "servant of Jehovah" is represented as a messenger to the heathen.'
  - where: 'note 42:19 “The blind servant and the Joseph Smith Translation”'
    claim: 'The Hebrew can be read coherently: Israel is blamed for the contrast between its conduct and its calling.'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/42.htm'
    quote: 'the servant of Jehovah is blamed and reproved for the harsh contrast between its actual conduct and its divine calling, between the reality and the idea.'
  - where: 'note 42:19 “The blind servant and the Joseph Smith Translation”'
    claim: 'JST Isa. 42:19–20 text, and the JST for KJV 21 (JST v. 22).'
    key: jst-isa-42
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-isa/42?lang=eng'
    quote: 'For I will send my servant unto you who are blind; yea, a messenger to open the eyes of the blind, and unstop the ears of the deaf; … The Lord is not well pleased with such a people, but for his righteousness’ sake he will magnify the law and make it honorable.'
  - where: 'note 42:19 “The blind servant and the Joseph Smith Translation”'
    claim: 'The JST to some extent assists in restoring plain and precious things lost from the Bible.'
    key: bd-jst
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/joseph-smith-translation?lang=eng'
    quote: 'The JST to some extent assists in restoring the plain and precious things that have been lost from the Bible (see 1 Ne. 13–14).'
  - where: 'note 42:19 “The blind servant and the Joseph Smith Translation”'
    claim: 'The Hebrew of verse 19 opens “Who is blind” (mî ʿiwwēr), the question the JST reworks.'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/isaiah/42-19.htm'
    quote: 'mî מִ֤י Who [is] … ‘iw·wêr עִוֵּר blind'
  - where: 'note 42:25 “Burned, and still not learning”'
    claim: 'In “we have sinned” the prophet identifies himself with the exiles (compare Isa. 6:5).'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/42.htm'
    quote: 'In the words "we have sinned" the prophet identifies himself with the exiles, in whose sin he knew and felt that he was really involved (cf., Isaiah 6:5).'
  - where: 'note 42:25 “Burned, and still not learning”'
    claim: 'The war-fury raged without result; Israel was not brought to reflection.'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/42.htm'
    quote: 'The war-fury raged without result. Israel was not brought to reflection.'
  - where: 'christ'
    claim: 'The Servant has been called the “embodied idea of Israel,” Israel’s truth and reality embodied in one person.'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/42.htm'
    quote: 'appears as the embodied idea of Israel, i.e., as its truth and reality embodied in one person.'
