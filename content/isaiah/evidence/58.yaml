chapter: 58
claims:
  - where: when
    claim: Chapters 56–66 portray a restored Jewish community with Jerusalem inhabited and the temple rebuilt (dating debated)
    key: isaiah-in-bom
    url: https://storage.googleapis.com/scripturecentral-prod-strapi-uploads/ry_and_welch_isaiah_in_the_book_of_mormon_1998_184195e137/ry_and_welch_isaiah_in_the_book_of_mormon_1998_184195e137.pdf
    quote: Chapters 56-66 are typically offset from the rest since they portray the Jewish community founded once again, Jerusalem in - habited, and the temple rebuilt.
  - where: when
    claim: The decree of Cyrus for the return of the Jews is dated 537 BC, so a restored community is after that date
    key: bible-chron-ot
    url: https://www.churchofjesuschrist.org/study/scriptures/bible-chron/old-testament?lang=eng
    quote: 537 | Decree of Cyrus for the return of the Jews.
  - where: setting
    claim: Isaiah 58 is the first prophecy of the third part (book) of chapters 40–66, and opens with reproach
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/58.htm
    quote: As the last prophecy of the second book contained all the three elements of prophetic addresses - reproach, threat, and promise - so this, the first prophecy of the third book, cannot open in any other way than with a rehearsal of one of these.
  - where: setting
    claim: Fasts to mourn Jerusalem were instituted during the exile (Zech. 7:3–5; 8:19)
    key: bd-fasts
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/fasts?lang=eng
    quote: Other fasts were instituted during the exile (Zech. 7:3–5; 8:19)
  - where: setting
    claim: The exilic fasts commemorated the siege, capture and destruction of Jerusalem
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/58.htm
    quote: viz., fasts to commemorate the commencement of the siege of Jerusalem (10th Tebeth), its capture (17th Tammuz), its destruction (9th Aibb), and the murder of Gedaliah (3rd Tizri).
  - where: setting
    claim: Work on the temple resumed in 520 BC, with Haggai and Zechariah prophesying
    key: bible-chron-ot
    url: https://www.churchofjesuschrist.org/study/scriptures/bible-chron/old-testament?lang=eng
    quote: 520 | The hindered temple building resumed. Haggai and Zechariah prophesy.
  - where: setting
    claim: Isaiah 58:6–11 is the Lord’s description of the law of the fast; the Church fasts once a month and gives a fast offering
    key: eyring-fast
    url: https://www.churchofjesuschrist.org/study/general-conference/2015/04/is-not-this-the-fast-that-i-have-chosen?lang=eng
    quote: "It is the law of the fast. The words in the book of Isaiah are the Lord’s description of the commandment and the blessing available to those of us in His Church:"
  - where: setting
    claim: Church members are offered the opportunity to fast once a month and give a fast offering for the poor
    key: eyring-fast
    url: https://www.churchofjesuschrist.org/study/general-conference/2015/04/is-not-this-the-fast-that-i-have-chosen?lang=eng
    quote: In the Church today we are offered the opportunity to fast once a month and give a generous fast offering through our bishop or branch president for the benefit of the poor and the needy.
  - where: note 58:1 “A trumpet and a fast”
    claim: The trumpet is the shofar, a curved horn blown on religious occasions including Joel 2:15
    key: bdb
    url: https://biblehub.com/hebrew/7782.htm
    quote: "horn, mostly as used in war, rarely, and chiefly late, as sacred instrument: Hosea 8:1; Judges 7:8,16; Isaiah 58:1 (simile)"
  - where: note 58:1 “A trumpet and a fast”
    claim: The shofar is used on religious occasions, including Lev. 25:9 and Joel 2:15
    key: bdb
    url: https://biblehub.com/hebrew/7782.htm
    quote: used on religious occasions, Joshua 6:4ff.; Leviticus 25:9; Joel 2:1; Joel 2:15;
  - where: note 58:1 “A trumpet and a fast”
    claim: The Hebrew phrase “afflict the soul” is used for fasting on the Day of Atonement and in Isaiah 58:3, 5
    key: bdb
    url: https://biblehub.com/hebrew/6031.htm
    quote: נֶפֶשׁ oneself, by fasting Leviticus 16:29,31; Leviticus 23:27,32; Numbers 29:7 (P) Psalm 35:13; Isaiah 58:3,5;
  - where: note 58:1 “A trumpet and a fast”
    claim: The Day of Atonement is the only fast ordered by the law
    key: bd-fasts
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/fasts?lang=eng
    quote: The Day of Atonement appears to be the only fast ordered by the law.
  - where: note 58:1 “A trumpet and a fast”
    claim: The Septuagint of Lev. 25:9–10 places the trumpet blast for the jubilee release on the day of atonement
    key: lxx-rahlfs
    url: https://www.ellopos.net/elpenor/greek-texts/septuagint/chapter.asp?book=3&page=25
    quote: on the day of atonement ye shall make a proclamation with a trumpet in all your land. 10 And ye shall sanctify the year, the fiftieth year, and ye shall proclaim a release upon the land
  - where: note 58:3 “Why doesn’t God notice?”
    claim: Hebrew ḥēpeṣ means pleasure, delight, and in the sense “business” (Isa. 58:3, 13)
    key: bdb
    url: https://biblehub.com/hebrew/2656.htm
    quote: that in which one takes delight, his business (late), or matter (very late, compare in Mishna = thing) ... ׳מצא ח Isaiah 58:3,13; עֲשׂוֺת חֲפָצֶךָ doing thy affairs Isaiah 58:13
  - where: note 58:3 “Why doesn’t God notice?”
    claim: Verse 3 means they carry on their business on the fast day and oppress their workers
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/58.htm
    quote: Behold, on the day of your fasting ye carry on your business, and ye oppress all your labourers.
  - where: note 58:3 “Why doesn’t God notice?”
    claim: The verb in verse 2 (yeḥpāṣûn, “delight”) is from the same root, ḥāpēṣ, “take pleasure in”
    key: bdb
    url: https://biblehub.com/hebrew/2654.htm
    quote: delight, desire, be pleased to do a thing, would do it Deuteronomy 25:7,8; 1 Kings 9:1; Esther 6:6; Ruth 3:13; Psalm 40:9; Job 9:3; Job 13:3; Job 21:14; Job 33:32; Isaiah 58:2;
  - where: note 58:3 “Why doesn’t God notice?”
    claim: The Hebrew of verse 3 uses ʿinnînû napšēnû, “we afflicted our soul”
    key: biblehub-interlinear
    url: https://biblehub.com/interlinear/isaiah/58-3.htm
    quote: עִנִּ֥ינוּ we have afflicted ... נַפְשֵׁ֖נוּ our soul
  - where: note 58:3 “Why doesn’t God notice?”
    claim: Sackcloth and ashes and the danger of fasting becoming mere formality are noted in Isa. 58:3–7
    key: bd-fasts
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/fasts?lang=eng
    quote: All such observances were, of course, liable to become mere formalities, and the danger of this was recognized by the prophets (Isa. 58:3–7; Joel 2:12–13; Zech. 7:5–6; see also Matt. 6:16–18).
  - where: note 58:6 “A line in the sermon at Nazareth”
    claim: Septuagint Isa. 58:6 reads ἀπόστελλε τεθραυσμένους ἐν ἀφέσει (“send away the crushed in release”)
    key: lxx-rahlfs
    url: https://www.ellopos.net/elpenor/greek-texts/septuagint/chapter.asp?book=43&page=58
    quote: ἀπόστελλε τεθραυσμένους ἐν ἀφέσει
  - where: note 58:6 “A line in the sermon at Nazareth”
    claim: Luke 4:18 has ἀποστεῖλαι τεθραυσμένους ἐν ἀφέσει, the same words with the verb in the infinitive
    key: greek-nt
    url: https://biblehub.com/interlinear/luke/4-18.htm
    quote: ἀποστεῖλαι to send forth ... τεθραυσμένους [the] oppressed ... ἐν in ... ἀφέσει deliverance
  - where: note 58:6 “A line in the sermon at Nazareth”
    claim: The Septuagint uses ἄφεσις for the Jubilee release in Lev. 25:10
    key: lxx-rahlfs
    url: https://www.ellopos.net/elpenor/greek-texts/septuagint/chapter.asp?book=3&page=25
    quote: καὶ διαβοήσετε ἄφεσιν ἐπὶ τῆς γῆς πᾶσι τοῖς κατοικοῦσιν αὐτήν
  - where: note 58:6 “A line in the sermon at Nazareth”
    claim: ἄφεσις is also the New Testament word for forgiveness (Matt. 26:28)
    key: greek-nt
    url: https://biblehub.com/interlinear/matthew/26-28.htm
    quote: ἄφεσιν forgiveness ... ἁμαρτιῶν of sins
  - where: note 58:7 “The law of the fast”
    claim: President Eyring called Isaiah’s words the law of the fast and said the offering will heal and change hearts
    key: eyring-fast
    url: https://www.churchofjesuschrist.org/study/general-conference/2015/04/is-not-this-the-fast-that-i-have-chosen?lang=eng
    quote: Your fast offering will do more than help feed and clothe bodies. It will heal and change hearts.
  - where: note 58:7 “The law of the fast”
    claim: Both receiving the offering and fasting for another can change hearts (the receiver and the giver)
    key: eyring-fast
    url: https://www.churchofjesuschrist.org/study/general-conference/2015/04/is-not-this-the-fast-that-i-have-chosen?lang=eng
    quote: Just as the receipt of the blessing of your fast offering and mine can change hearts, so does fasting for the good of another.
  - where: note 58:7 “The law of the fast”
    claim: “Thine own flesh” means one’s own family, as all men being one family of the same flesh and blood
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/58.htm
    quote: it is presupposed that all men form one united whole as being of the same flesh and blood, and that they form one family, owing to one another mutual love.
  - where: note 58:8 “Glory behind and before”
    claim: At the Exodus the pillar of cloud moved from before the camp to stand behind it
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/ex/14?lang=eng
    quote: the pillar of the cloud went from before their face, and stood behind them
  - where: note 58:8 “Glory behind and before”
    claim: Isaiah 58:8 reads “the glory of the Lord shall be thy rearward”
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/isa/58?lang=eng
    quote: the glory of the Lord shall be thy rearward.
  - where: note 58:10 “Two ways to afflict a soul”
    claim: nepeš means soul, living being, life, self, desire, appetite
    key: bdb
    url: https://biblehub.com/hebrew/5315.htm
    quote: soul, living being, life, self, person, desire, appetite, emotion, and passion
  - where: note 58:10 “Two ways to afflict a soul”
    claim: nepeš is the seat of the appetites, including hunger, satisfied in Isa. 58:10
    key: bdb
    url: https://biblehub.com/hebrew/5315.htm
    quote: "a. hunger: רְעֵבָה ׳נ hungry soul Psalm 107:9; Proverbs 27:7; with noun or verb of שׂבע satisfy Isaiah 56:11; Isaiah 58:10;"
  - where: note 58:10 “Two ways to afflict a soul”
    claim: nepeš is the “seat of the appetites”
    key: bdb
    url: https://biblehub.com/hebrew/5315.htm
    quote: 5 נפשׁ = seat of the appetites, in all periods (46 t.)
  - where: note 58:10 “Two ways to afflict a soul”
    claim: Verse 10 has wəṯāp̄êq … nap̄šeḵā (“draw out your soul”) and wənep̄eš naʿănāh (“afflicted soul”)
    key: biblehub-interlinear
    url: https://biblehub.com/interlinear/isaiah/58-10.htm
    quote: וְתָפֵ֤ק and [if] you extend ... נַפְשֶׁ֔ךָ your soul ... וְנֶ֥פֶשׁ soul ... נַעֲנָ֖ה of afflicted
  - where: note 58:10 “Two ways to afflict a soul”
    claim: The verb tāpēq is Hiphil of pûq, “produce, furnish”; BDB suggests reading “your bread” instead of “your soul”
    key: bdb
    url: https://biblehub.com/hebrew/6329.htm
    quote: "produce, furnish: Imperfect (jussive) וְתָפֵק לָרָעֵב Isaiah 58:10 with נַפְשְׁךָ (read perhaps לַחְמְךָ see CheHpt)"
  - where: note 58:10 “Two ways to afflict a soul”
    claim: The Septuagint of verse 10 reads “give bread to the hungry from your soul”
    key: lxx-rahlfs
    url: https://www.ellopos.net/elpenor/greek-texts/septuagint/chapter.asp?book=43&page=58
    quote: καὶ δῷς πεινῶντι τὸν ἄρτον ἐκ ψυχῆς σου καὶ ψυχὴν τεταπεινωμένην ἐμπλήσῃς
  - where: note 58:11 “A spring that does not lie”
    claim: Hebrew kāzab is “lie”; BDB glosses it for the spring in Isa. 58:11 as “disappoint, fail”
    key: bdb
    url: https://biblehub.com/hebrew/3576.htm
    quote: 2 disappoint, fail, of a divine revelation Habakkuk 2:3; waters of a spring Isaiah 58:11.
  - where: note 58:11 “A spring that does not lie”
    claim: The root kāzab means to lie, deceive
    key: bdb
    url: https://biblehub.com/hebrew/3576.htm
    quote: to lie (i.e. deceive), literally or figuratively
  - where: note 58:11 “A spring that does not lie”
    claim: Delitzsch renders the spring as one “whose waters never deceive”
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/58.htm
    quote: like a fountain, whose waters never deceive.
  - where: note 58:13 “A sign and a delight”
    claim: ḥēpeṣ appears in verse 13 (“thy pleasure,” “thine own pleasure”) as in verse 3
    key: bdb
    url: https://biblehub.com/hebrew/2656.htm
    quote: suffix חֶפְצְךָ Isaiah 58:13 etc. + 13 t. suffixes; plural חֲפָצִים Proverbs 8:11; suffix חֲפָצֶיךָ Proverbs 3:15; חֲפָצֶ֖ךָ Isaiah 58:13
  - where: note 58:13 “A sign and a delight”
    claim: ʿōneg means daintiness, exquisite delight, and is used of the Sabbath in Isa. 58:13
    key: bdb
    url: https://biblehub.com/hebrew/6027.htm
    quote: daintiness, exquisite delight; — ׳הֵיכְלֵי ע Isaiah 13:22; ׳וְקָרָאתָ לַשַּׁבָּת ע Isaiah 58:13.
  - where: note 58:13 “A sign and a delight”
    claim: titʿannag in verse 14 is from the same root (ʿānag), “take exquisite delight”
    key: bdb
    url: https://biblehub.com/hebrew/6026.htm
    quote: 2 take exquisite delight ... 2 masculine singular תִּתְעַנַּג Isaiah 58:14
  - where: note 58:13 “A sign and a delight”
    claim: Delitzsch reads the Sabbath as a delight and cites Amos 8:5
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/58.htm
    quote: if thou call (i.e., from inward contemplation and esteem) the Sabbath a pleasure (‛ōneg, because it leads thee to God, and not a burden because it leads thee away from thine everyday life; cf., Amos 8:5)
  - where: note 58:13 “A sign and a delight”
    claim: Ezekiel also enforced the Sabbath (Ezek. 20:12; 22:8, 26)
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/58.htm
    quote: The duty of keeping the Sabbath is also enforced by Jeremiah (Jeremiah 17:19.) and Ezekiel (Ezekiel 20:12., Ezekiel 22:8, Ezekiel 22:26)
  - where: note 58:13 “A sign and a delight”
    claim: The promise of riding on the high places echoes Deut. 32:13 and the inheritance of Jacob
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/58.htm
    quote: the inheritance promised to thy forefather Jacob (Psalm 105:10-11; Deuteronomy 32:13 and Deuteronomy 33:29)
  - where: note 58:13 “A sign and a delight”
    claim: President Nelson learned the Sabbath is a sign and asks “What sign do I want to give to God?”
    key: nelson-sabbath
    url: https://www.churchofjesuschrist.org/study/general-conference/2015/04/the-sabbath-is-a-delight?lang=eng
    quote: I simply asked myself, “What sign do I want to give to God?”
  - where: note 58:13 “A sign and a delight”
    claim: Nelson taught from Isaiah’s description of the Sabbath as “a delight”
    key: nelson-sabbath
    url: https://www.churchofjesuschrist.org/study/general-conference/2015/04/the-sabbath-is-a-delight?lang=eng
    quote: When Isaiah described the Sabbath as “a delight,” he also taught us how to make it delightful.
  - where: note 58:13 “A sign and a delight”
    claim: D&C 59 was addressed to Saints recently moved to Independence, Missouri, whose neighbors kept the Sabbath differently; a traveler in 1833 noted gambling and noise
    key: sc-knowhy-303
    url: https://scripturecentral.org/knowhy/why-is-the-sabbath-day-needed
    quote: the only indications of its being Sunday” in the area was “the unusual Gambling & noise, & assemblies around taverns.” It was in this context that the Lord revealed that observing the Sabbath would help keep the saints “unspotted from the world”
  - where: note 58:13 “A sign and a delight”
    claim: Alma’s people left their temple behind and could take sacred time with them; this seems an ancient Israelite idea
    key: sc-knowhy-303
    url: https://scripturecentral.org/knowhy/why-is-the-sabbath-day-needed
    quote: even though they left their sacred space (the temple) behind, they could still take sacred time (the Sabbath) with them wherever they went. This seems to have been an ancient Israelite idea as well.
  - where: note 58:13 “A sign and a delight”
    claim: D&C 59 was given 7 August 1831 and the Sabbath helped the Saints stay distinct
    key: sc-knowhy-303
    url: https://scripturecentral.org/knowhy/why-is-the-sabbath-day-needed
    quote: On 7 August 1831, Joseph Smith dictated a revelation now known as Doctrine and Covenants 59, describing how the Church was to observe the Sabbath, or the “Lord’s day.”
  - where: explore
    claim: President Eyring’s talk “Is Not This the Fast That I Have Chosen?” (April 2015) applies the chapter to the fast offering
    key: eyring-fast
    url: https://www.churchofjesuschrist.org/study/general-conference/2015/04/is-not-this-the-fast-that-i-have-chosen?lang=eng
    quote: In the Church today we are offered the opportunity to fast once a month and give a generous fast offering through our bishop or branch president for the benefit of the poor and the needy.
  - where: note 58:7 “The law of the fast”
    claim: Members fast monthly and give the money that would have been spent for food to people in need
    key: gospel-topics-fasting
    url: https://www.churchofjesuschrist.org/study/manual/gospel-topics/fasting-and-fast-offerings?lang=eng
    quote: then contribute the money that would have been spent for that food to those in need
