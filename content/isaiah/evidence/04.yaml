# Evidence ledger for Isaiah 4 (audit, 2026-10-01)
chapter: 4
claims:
- where: when
  claim: Isaiah prophesied in the days of Uzziah, Jotham, Ahaz and Hezekiah
  key: lds-scriptures
  url: https://www.churchofjesuschrist.org/study/scriptures/ot/isa/1?lang=eng
  quote: 'The vision of Isaiah the son of Amoz, which he saw concerning Judah and Jerusalem in the days of Uzziah, Jotham, Ahaz, and Hezekiah, kings of Judah.'
- where: setting
  claim: The chapter division is wrong; 4:1 closes the address against the women
  key: delitzsch
  url: https://biblehub.com/commentaries/kad/isaiah/4.htm
  quote: The division of the chapters is a wrong one here, as this v. is the closing v. of the prophecy against the women
- where: setting
  claim: Nephi quoted Isaiah 4 as 2 Nephi 14
  key: lds-scriptures
  url: https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/14?lang=eng
  quote: Zion and her daughters will be redeemed and cleansed in the millennial day—Compare Isaiah 4. About 559–545 B.C.
- where: note 4:1 “Why seven women want one husband”
  claim: Women renounce the legal claim to food and clothing (Ex. 21:10); the reproach is being unmarried and childless
  key: delitzsch
  url: https://biblehub.com/commentaries/kad/isaiah/4.htm
  quote: even renounce the ordinary legal claim upon their husband for clothing and food (Exodus 21:10)
- where: note 4:1 “Why seven women want one husband”
  claim: Seven as a "bad seven" as well as a holy one
  key: delitzsch
  url: https://biblehub.com/commentaries/kad/isaiah/4.htm
  quote: there is a bad seven as well as a holy one
- where: note 4:2 “The Branch”
  claim: tsemach means sprout, growth; used of the Lord's branch in Isa. 4:2
  key: bdb
  url: https://biblehub.com/hebrew/6780.htm
  quote: 'צֶ֫מַח noun masculine Jeremiah 23:5 sprout, growth'
- where: note 4:2 “The Branch”
  claim: Delitzsch reads the branch and fruit of the earth as the Messiah, and this verse as the source of the title in Jeremiah and Zechariah; he rejects the harvest reading
  key: delitzsch
  url: https://biblehub.com/commentaries/kad/isaiah/4.htm
  quote: if the "sprout of Jehovah" is neither the redeemed remnant itself, nor the fruit of the field, it must be the name of the Messiah.
- where: note 4:2 “The Branch”
  claim: Branch is a title of Christ in Jer. 23:5
  key: bd-christ-names
  url: https://www.churchofjesuschrist.org/study/scriptures/bd/christ-names-of?lang=eng
  quote: 'Branch, Jer. 23:5'
- where: note 4:3 “Written among the living”
  claim: Joseph Smith on records on earth recorded in heaven (D&C 128)
  key: lds-scriptures
  url: https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/128?lang=eng
  quote: whatsoever you record on earth shall be recorded in heaven
- where: note 4:5 “The Exodus cloud over every home”
  claim: D&C 84:5 and 109:12, 37 on the cloud and glory resting on the house
  key: lds-scriptures
  url: https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng
  quote: a cloud shall rest upon it, which cloud shall be even the glory of the Lord, which shall fill the house.
- where: note 4:5 “The Exodus cloud over every home”
  claim: Dedicatory prayer asks that glory rest on the house
  key: lds-scriptures
  url: https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/109?lang=eng
  quote: That thy glory may rest down upon thy people, and upon this thy house, which we now dedicate to thee
- where: note 4:5 “A wedding canopy”
  claim: Lexicon takes chuppah in Isa. 4:5 as a canopy for protection; elsewhere a bridal chamber (Ps. 19:6, Joel 2:16)
  key: bdb
  url: https://biblehub.com/hebrew/2646.htm
  quote: canopy, chamber (as covering, enclosing) … Isaiah 4:5 over all glory a canopy (for protection). 2 chamber, of bridegroom Psalm 19:6 … of bride Joel 2:16
- where: note 4:5 “A wedding canopy”
  claim: Chuppah is still the Jewish wedding canopy; Delitzsch says it means covering that honors
  key: delitzsch
  url: https://biblehub.com/commentaries/kad/isaiah/4.htm
  quote: Chuppâh is the name still given by the Jews to the wedding canopy, i.e., a canopy supported on four poles
- where: note 4:6 “A refuge from the storm”
  claim: sukkah means thicket, booth
  key: bdb
  url: https://biblehub.com/hebrew/5521.htm
  quote: סֻכָּה noun feminine thicket, booth (properly of inter-woven boughs compare Nehemiah 8:15)
- where: note 4:6 “A refuge from the storm”
  claim: Israel told to dwell in booths to remember the exodus
  key: lds-scriptures
  url: https://www.churchofjesuschrist.org/study/scriptures/ot/lev/23?lang=eng
  quote: That your generations may know that I made the children of Israel to dwell in booths, when I brought them out of the land of Egypt
- where: note 4:6 “A refuge from the storm”
  claim: D&C 115:6 on Zion and her stakes as defense and refuge
  key: lds-scriptures
  url: https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/115?lang=eng
  quote: the gathering together upon the land of Zion, and upon her stakes, may be for a defense, and for a refuge from the storm
- where: note 4:6 “A refuge from the storm”
  claim: Guide to the Scriptures lists D&C 115:6 under Stake
  key: gs-stake
  url: https://www.churchofjesuschrist.org/study/scriptures/gs/stake?lang=eng
  quote: The gathering together upon Zion, and upon her stakes, may be for a defense, D&C 115:6 (D&C 101:21).
- where: note 4:1 “Taking a name upon us”
  claim: Covenant to take the name of Christ (Mosiah 5)
  key: lds-scriptures
  url: https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/5?lang=eng
  quote: There is no other name given whereby salvation cometh; therefore, I would that ye should take upon you the name of Christ
