    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/3?lang=eng'
    quote: 'And Mesha king of Moab was a sheepmaster, and rendered unto the king of Israel an hundred thousand lambs'
  - where: 'setting'
    claim: 'The place names mark where wailing is heard, from Heshbon in the north to Zoar in the south (Heshbon, Elealeh, Jahaz, Zoar, Horonaim in the oracle)'
