    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/1?lang=eng'
    quote: 'Uzziah, Jotham, Ahaz, and Hezekiah, kings of Judah'
  - where: 'setting'
    claim: 'Isaiah 15–16 form a single oracle concerning Moab'
