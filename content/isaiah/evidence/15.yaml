    url: 'https://biblehub.com/commentaries/kad/isaiah/15.htm'
    quote: 'The Oracle Concerning Moab - Isaiah 15-16'
  - where: 'setting'
    claim: 'Moab lay east of the Dead Sea, was akin to Israel, and was in constant warfare with it; Moab was Lot’s son'
