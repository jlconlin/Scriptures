chapter: 30
claims:
  - where: "setting"
    claim: "Judah sought an alliance with Egypt against Assyria, and Isaiah opposed it (Isa. 30:1–5)"
    key: bd-egypt
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/egypt?lang=eng"
    quote: "Later on, Assyria and Egypt became great rival powers, and an alliance with Egypt against Assyria was for some time the policy of the kings of Judah. Isaiah opposed this alliance (Isa. 30:1–5)"
  - where: "setting"
    claim: "Judah turned to Egypt for protection from the Assyrians; the Lord rebuked them"
    key: ot-manual-15
    url: "https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-15?lang=eng"
    quote: "Israel and Judah had been cautioned by the Lord not to put their trust in other nations. But this people refused to hearken, and they turned to Egypt for protection from the Assyrians"
  - where: "setting"
    claim: "Judah’s envoys had begun negotiating with Egypt; Isaiah condemned the plan"
    key: delitzsch
    url: "https://biblehub.com/commentaries/kad/isaiah/30.htm"
    quote: "The negotiations by means of ambassadors have already been commenced; but the prophet condemns what he can no longer prevent."
  - where: "setting"
    claim: "Isa. 30:2: Judah went to Egypt without asking the Lord, trusting Pharaoh"
    key: lds-scriptures
    url: "https://www.churchofjesuschrist.org/study/scriptures/ot/isa/30?lang=eng"
    quote: "That walk to go down into Egypt, and have not asked at my mouth; to strengthen themselves in the strength of Pharaoh, and to trust in the shadow of Egypt!"
  - where: "note 30:1 “Counsel, but not of Me”"
    claim: "“Cover with a covering” is better read as plaiting (forming) an alliance; some take it as a libation"
    key: delitzsch
    url: "https://biblehub.com/commentaries/kad/isaiah/30.htm"
    quote: "According to Cappellus and others, it designates it as formed with a libation (σπονδη, from σπένδεσθαι); but the former is certainly the more correct view"
  - where: "note 30:6 “A dangerous caravan through the Negev”"
    claim: "“South” in the heading is the Hebrew Negev"
    key: biblehub-interlinear
    url: "https://biblehub.com/interlinear/isaiah/30-6.htm"
    quote: "ne·ḡeḇ; נֶ֑גֶב of the Negev"
  - where: "note 30:6 “A dangerous caravan through the Negev”"
    claim: "The flying serpent is the Hebrew śārāp̄"
    key: biblehub-interlinear
    url: "https://biblehub.com/interlinear/isaiah/30-6.htm"
    quote: "wə·śā·rāp̄ וְשָׂרָ֣ף and serpent Conj‑w ¦ N‑ms 5774 [e] mə·‘ō·w·p̄êp̄, מְעוֹפֵ֔ף the flying"
  - where: "note 30:6 “A dangerous caravan through the Negev”"
    claim: "The Negev is the dry district south of the hills of Judah"
    key: bd-negev
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/negev?lang=eng"
    quote: "Dry or parched land, also called “south country”; the district stretching southward from the hills of Judah toward the desert."
  - where: "note 30:6 “A dangerous caravan through the Negev”"
    claim: "The envoys crossed the desert through which God had led their fathers (Num. 21:6)"
    key: delitzsch
    url: "https://biblehub.com/commentaries/kad/isaiah/30.htm"
    quote: "Through this very desert, through which God had led their fathers when He redeemed them out of the bondage of Egypt"
  - where: "note 30:7 “Rahab the Do-Nothing”"
    claim: "Rahab is a name for Egypt (Isa. 51:9; Ps. 87:4), here meaning boasting and domineering pride; the phrase reads “bragging people, they are sit-still”"
    key: delitzsch
    url: "https://biblehub.com/commentaries/kad/isaiah/30.htm"
    quote: "Rahab is a name applied to Egypt in other passages also (Isaiah 51:9; Psalm 87:4; Psalm 89:11)"
  - where: "note 30:7 “Rahab the Do-Nothing”"
    claim: "Here the name means boasting and domineering pride"
    key: delitzsch
    url: "https://biblehub.com/commentaries/kad/isaiah/30.htm"
    quote: "Here the name has the meaning common in other passages, viz., violence, domineering pride, boasting"
  - where: "note 30:7 “Rahab the Do-Nothing”"
    claim: "The Hebrew reads ra·haḇ hêm šā·ḇeṯ (Rahab… sit still)"
    key: biblehub-interlinear
    url: "https://biblehub.com/interlinear/isaiah/30-7.htm"
    quote: "ra·haḇ רַ֥הַב Rahab- N‑proper‑ms 1992 [e] hêm הֵ֖ם hem- N‑proper‑ms 7674 [e] šā·ḇeṯ."
  - where: "note 30:7 “Rahab the Do-Nothing”"
    claim: "The Assyrian field commander called Egypt a broken reed that pierces the hand"
    key: lds-scriptures
    url: "https://www.churchofjesuschrist.org/study/scriptures/ot/isa/36?lang=eng"
    quote: "Lo, thou trustest in the staff of this broken reed, on Egypt; whereon if a man lean, it will go into his hand, and pierce it:"
  - where: "note 30:8 “Written for the time to come”"
    claim: "Moroni writes to later readers “as if ye were present”"
    key: lds-scriptures
    url: "https://www.churchofjesuschrist.org/study/scriptures/bofm/morm/8?lang=eng"
    quote: "Behold, I speak unto you as if ye were present, and yet ye are not."
  - where: "note 30:10 “Speak unto us smooth things”"
    claim: "The people ask the prophets for smooth things (Isa. 30:10)"
    key: lds-scriptures
    url: "https://www.churchofjesuschrist.org/study/scriptures/ot/isa/30?lang=eng"
    quote: "Prophesy not unto us right things, speak unto us smooth things, prophesy deceits:"
  - where: "note 30:11 “Tired of the Holy One of Israel”"
    claim: "Isa. 30:12 answers with “the Holy One of Israel”"
    key: lds-scriptures
    url: "https://www.churchofjesuschrist.org/study/scriptures/ot/isa/30?lang=eng"
    quote: "Wherefore thus saith the Holy One of Israel, Because ye despise this word, and trust in oppression and perverseness, and stay thereon:"
  - where: "note 30:15 “Returning, rest, quietness, confidence”"
    claim: "Hebrew words behind “returning,” “rest,” “quietness,” “confidence”"
    key: biblehub-interlinear
    url: "https://biblehub.com/interlinear/isaiah/30-15.htm"
    quote: "bə·šū·ḇāh בְּשׁוּבָ֤ה In returning Prep‑b ¦ N‑fs 5183 [e] wā·na·ḥaṯ וָנַ֙חַת֙ and rest Conj‑w ¦ N‑fs 3467 [e] tiw·wā·šê·‘ūn, תִּוָּ֣שֵׁע֔וּן you⁺ will be saved V‑Nifal‑Imperf‑2mp ¦ Pn 8252 [e] bə·haš·qêṭ בְּהַשְׁקֵט֙ in quietness Prep‑b ¦ V‑Hifil‑Inf 985 [e] ū·ḇə·ḇiṭ·ḥāh, וּבְבִטְחָ֔ה and in confidence"
  - where: "note 30:16 “Wordplay on flight”"
    claim: "nā·nūs (“we will flee”) and tə·nū·sūn (“you will flee”) share one verb"
    key: biblehub-interlinear
    url: "https://biblehub.com/interlinear/isaiah/30-16.htm"
    quote: "nā·nūs נָנ֖וּס we will flee V‑Qal‑Imperf‑1cp 5921 [e] ‘al- עַל־ for Prep 3651 [e] kên כֵּ֣ן therefore Adv 5127 [e] tə·nū·sūn;"
  - where: "note 30:16 “Wordplay on flight”"
    claim: "Josh. 23:10: one man of you shall chase a thousand"
    key: lds-scriptures
    url: "https://www.churchofjesuschrist.org/study/scriptures/ot/josh/23?lang=eng"
    quote: "One man of you shall chase a thousand: for the Lord your God, he it is that fighteth for you"
  - where: "note 30:18 “The Lord waits to be gracious”"
    claim: "The same verb (ḥākāh) is used for the Lord waiting and for those waiting for Him"
    key: biblehub-interlinear
    url: "https://biblehub.com/interlinear/isaiah/30-18.htm"
    quote: "yə·ḥak·keh יְחַכֶּ֤ה waits"
  - where: "note 30:18 “The Lord waits to be gracious”"
    claim: "…and for those waiting for Him"
    key: biblehub-interlinear
    url: "https://biblehub.com/interlinear/isaiah/30-18.htm"
    quote: "ḥō·w·ḵê ח֥וֹכֵי those waiting"
  - where: "note 30:18 “The Lord waits to be gracious”"
    claim: "2 Ne. 28:32: “mine arm is lengthened out all the day long”"
    key: lds-scriptures
    url: "https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/28?lang=eng"
    quote: "mine arm is lengthened out all the day long"
  - where: "note 30:19 “He answers when He hears”"
    claim: "Answering and hearing coincide in 30:19"
    key: delitzsch
    url: "https://biblehub.com/commentaries/kad/isaiah/30.htm"
    quote: "answering and hearing would coincide"
  - where: "note 30:19 “He answers when He hears”"
    claim: "Isa. 65:24"
    key: lds-scriptures
    url: "https://www.churchofjesuschrist.org/study/scriptures/ot/isa/65?lang=eng"
    quote: "before they call, I will answer; and while they are yet speaking, I will hear."
  - where: "note 30:20 “Teachers you can see”"
    claim: "Delitzsch reads “thy teachers” as plural, faithful teachers no longer hiding"
    key: delitzsch
    url: "https://biblehub.com/commentaries/kad/isaiah/30.htm"
    quote: "faithful and well-meaning teachers (mōrı̄m) no longer keep themselves hidden because of the hard-heartedness and hatred of the people"
  - where: "note 30:20 “Teachers you can see”"
    claim: "Some modern translations render the word singular, “your Teacher”"
    key: biblehub-interlinear
    url: "https://biblehub.com/interlinear/isaiah/30-20.htm"
    quote: "but your Teacher will no longer hide Himself— with your own eyes you will see Him."
  - where: "note 30:21 “A voice behind you”"
    claim: "One reading takes the voice behind as the teachers, following like shepherds with words of admonition"
    key: delitzsch
    url: "https://biblehub.com/commentaries/kad/isaiah/30.htm"
    quote: "As the shepherds of the flock, they would follow the people with friendly words of admonition, whilst the people would have their ears open to receive their instruction."
  - where: "note 30:21 “A voice behind you”"
    claim: "Nelson on the Holy Ghost"
    key: nelson-revelation
    url: "https://www.churchofjesuschrist.org/study/general-conference/2018/04/revelation-for-the-church-revelation-for-our-lives?lang=eng"
    quote: "In coming days, it will not be possible to survive spiritually without the guiding, directing, comforting, and constant influence of the Holy Ghost."
  - where: "note 30:26 “The Lord binds up and heals”"
    claim: "Isa. 1:6: the nation’s wounds were not bound up"
    key: lds-scriptures
    url: "https://www.churchofjesuschrist.org/study/scriptures/ot/isa/1?lang=eng"
    quote: "they have not been closed, neither bound up, neither mollified with ointment."
  - where: "note 30:29 “A song in the night”"
    claim: "The night song alludes to Passover night (Ex. 12:42)"
    key: delitzsch
    url: "https://biblehub.com/commentaries/kad/isaiah/30.htm"
    quote: "there is here an unmistakeable allusion to the passover, as we may see from the introduction of \"the night,\" which evidently means the night before the passover (lēl shimmurı̄m, Exodus 12:42"
  - where: "note 30:29 “A song in the night”"
    claim: "Isa. 37:36: the angel smote the Assyrian camp and they were dead by morning"
    key: lds-scriptures
    url: "https://www.churchofjesuschrist.org/study/scriptures/ot/isa/37?lang=eng"
    quote: "Then the angel of the Lord went forth, and smote in the camp of the Assyrians a hundred and fourscore and five thousand: and when they arose early in the morning, behold, they were all dead corpses."
  - where: "note 30:33 “Tophet”"
    claim: "Tophet: valley of Hinnom south of Jerusalem, human sacrifices to Molech"
    key: bd-topheth
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/topheth?lang=eng"
    quote: "A spot in the valley of the son of Hinnom, south of Jerusalem, where human sacrifices were offered to Molech (2 Kgs. 23:10; Isa. 30:33; Jer. 7:31–32"
  - where: "note 30:33 “Tophet”"
    claim: "Hinnom later symbolic of the place of torment (Gehenna)"
    key: bd-gehenna
    url: "https://www.churchofjesuschrist.org/study/scriptures/bd/gehenna?lang=eng"
    quote: "afterwards a place in which the refuse of the city was burned, and for that reason it was symbolic of the place of torment after death"
  - where: "note 30:33 “Tophet”"
    claim: "The pyre is prepared for the king of Assyria"
    key: delitzsch
    url: "https://biblehub.com/commentaries/kad/isaiah/30.htm"
    quote: "lammelekh is a play upon lammolekh (e.g., Leviticus 18:2), \"even this has been prepared for the Melekh,\" viz., the king of Asshur."
