# Evidence ledger for Isaiah 43 (reconstructed 2026-10-15; every row's page was opened in this session via scripts/source.mjs, live)
chapter: 43
claims:
- where: when
  claim: The chapter looks ahead to deliverance from Babylon, the redemption from Egypt serving as its type
  key: delitzsch
  url: https://biblehub.com/commentaries/kad/isaiah/43.htm
  quote: the redemption out of Egypt was a type and pledge of the deliverance to be looked for out of Babylon.
- where: setting
  claim: The chapter alternates promise and trial scenes; Israel is called as witness in the first trial
  key: delitzsch
  url: https://biblehub.com/commentaries/kad/isaiah/43.htm
  quote: Jehovah can call His people as witnesses, since they have had proofs in abundance that He possesses infallible knowledge of the future.
- where: setting
  claim: In the second trial Jehovah calls on Israel to plead and show any merit
  key: delitzsch
  url: https://biblehub.com/commentaries/kad/isaiah/43.htm
  quote: Jehovah now calls upon Israel, if this be not the case, to remind Him of any merit upon which it can rely.
- where: setting
  claim: The Exodus stands behind the chapter; the deliverance from Babylon is a greater new thing
  key: delitzsch
  url: https://biblehub.com/commentaries/kad/isaiah/43.htm
  quote: the redemption out of Egypt was a type and pledge of the deliverance to be looked for out of Babylon.
- where: thread
  claim: The blind and deaf of verse 8 are Israel, summoned as witnesses; this picks up the opening of the earlier "deaf and blind" appeal
  key: delitzsch
  url: https://biblehub.com/commentaries/kad/isaiah/43.htm
  quote: the summons being now addressed to some one to bring forth the Israel, which has eyes and ears without seeing or hearing
- where: thread
  claim: The nations cannot produce witnesses, so Jehovah calls His people
  key: delitzsch
  url: https://biblehub.com/commentaries/kad/isaiah/43.htm
  quote: not one of all the assembled multitude can come forward as their legitimate witness, or as one able to vindicate them, Jehovah can call His people as witnesses
- where: thread
  claim: Verse 24 turns on God being burdened by Israel's sins
  key: delitzsch
  url: https://biblehub.com/commentaries/kad/isaiah/43.htm
  quote: The sins of Israel pressed upon Him, as a burden does upon a servant.
- where: thread
  claim: Blotting out of sin has no basis in Israel's merit
  key: delitzsch
  url: https://biblehub.com/commentaries/kad/isaiah/43.htm
  quote: this blotting out of sin is so far from being in any way merited by Israel, that it is a sovereign act of His absolute freedom
