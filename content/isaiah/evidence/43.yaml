  url: https://biblehub.com/interlinear/isaiah/43-1.htm
  quote: bō·ra·’ă·ḵā בֹּרַאֲךָ֣ the One creating you … wə·yō·ṣer·ḵā וְיֹצֶרְךָ֖ and the One forming you
