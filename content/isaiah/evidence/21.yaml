    claim: Jesus’s words about giving drink to the thirsty
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/25?lang=eng'
    quote: 'I was thirsty, and ye gave me drink'
  - where: christ
    claim: 'The Lord calls the prophet a watchman unto the house of Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/33?lang=eng'
