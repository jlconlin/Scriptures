# Evidence ledger for Isaiah 21 (audit, 2026-10-01)
chapter: 21
claims:
  - where: when
    claim: Isaiah prophesied in Jerusalem 740–701 BC
    key: bd-isaiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/isaiah?lang=eng'
    quote: 'a prophet in Jerusalem during 40 years, 740–701'
  - where: when
    claim: Cyrus united the Medes and Persians and conquered Babylon
    key: bd-persia
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/persia?lang=eng'
    quote: 'Cyrus united the Medes and Persians, conquered Babylon'
  - where: setting
    claim: Seir is the mountainous country Edom took possession of
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/21.htm'
    quote: 'Seir is the mountainous country to the south of Palestine, of which Edom took possession after the expulsion of the Horites.'
  - where: setting
    claim: 'Dumah is a symbolic name, silence, an emblem of Edom’s fate (removal of the a sound)'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/21.htm'
    quote: 'The name as it stands here is symbolical, and without any demonstrable topographical application.'
  - where: setting
    claim: 'Dumah means deep silence'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/21.htm'
    quote: 'deep, utter silence, and therefore the land of the dead'
  - where: setting
    claim: 'The oracle on Arabia concerns Dedan, Tema, Kedar; the Dumah oracle uses the Edom wordplay'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/21.htm'
    quote: 'The name אדום is turned into an emblem of the future fate of Edom, by the removal of the a sound from the beginning of the word to the end.'
  - where: 'note 21:1 “The desert by the sea”'
    claim: Before the dams were built the Euphrates used to overflow the whole plain like a sea
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/21.htm'
    quote: 'before Semiramis constructed the dams, the Euphrates used to overflow the whole just like a sea'
  - where: 'note 21:1 “The desert by the sea”'
    claim: The title is a symbolic name for Babylon and its neighbourhood, a plain intersected by the Euphrates
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/21.htm'
    quote: 'midbar-yâm (desert of the sea) is a name of this kind applied to Babylon and the neighbourhood.'
  - where: 'note 21:1 “The desert by the sea”'
    claim: Jeremiah calls Babylon one who dwells upon many waters
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/51?lang=eng'
    quote: 'O thou that dwellest upon many waters'
  - where: 'note 21:1 “The desert by the sea”'
    claim: Merodach-baladan, king of Babylon, sent letters and a present to Hezekiah
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/39?lang=eng'
    quote: 'Merodach-baladan, the son of Baladan, king of Babylon, sent letters and a present to Hezekiah'
  - where: 'note 21:2 “Elam and Media”'
    claim: Elam was a mountainous country east of Babylonia
    key: bd-elam
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/elam?lang=eng'
    quote: 'A mountainous country to the east of Babylonia'
  - where: 'note 21:2 “Elam and Media”'
    claim: Media lay between the Caspian Sea and Elam
    key: bd-media
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/media?lang=eng'
    quote: 'The country between the Caspian Sea and Elam'
  - where: 'note 21:2 “Elam and Media”'
    claim: Cyrus united the Medes and Persians and conquered Babylon
    key: bd-persia
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/persia?lang=eng'
    quote: 'Cyrus united the Medes and Persians, conquered Babylon'
  - where: 'note 21:2 “Elam and Media”'
    claim: The Lord names the Medes against Babylon in Isaiah 13
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/13?lang=eng'
    quote: 'I will stir up the Medes against them'
  - where: 'note 21:2 “Elam and Media”'
    claim: '“All the sighing” means the lamentations forced out of people by the oppressor'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/21.htm'
    quote: 'to all the lamentations forced out of them far and wide by the oppressor.'
  - where: 'note 21:3 “A prophet shaken by his own vision”'
    claim: The evening darkness the prophet loved and longed for had been changed into quaking by the vision
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/21.htm'
    quote: 'The darkness of evening and night, which the prophet loved so much'
  - where: 'note 21:3 “A prophet shaken by his own vision”'
    claim: The Hebrew terms describe cramp, childbirth pains, and a feverish and irregular pulse
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/21.htm'
    quote: 'denotes a feverish and irregular beating of the pulse'
  - where: 'note 21:3 “A prophet shaken by his own vision”'
    claim: Daniel was sick certain days after a vision
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/8?lang=eng'
    quote: 'I Daniel fainted, and was sick certain days'
  - where: 'note 21:3 “A prophet shaken by his own vision”'
    claim: Nephi said his afflictions were great above all because of the destruction of his people
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/15?lang=eng'
    quote: 'mine afflictions were great above all, because of the destruction of my people'
  - where: 'note 21:5 “Feasting as the enemy arrives”'
    claim: Shield leather was oiled to make blows glide off; the cry shows the princes were taken by surprise
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/21.htm'
    quote: 'The shield-leather was generally oiled, to make it shine and protect it from wet, and, more than all, to cause the strokes it might receive to glide off'
  - where: 'note 21:5 “Feasting as the enemy arrives”'
    claim: The scene is probably the one Daniel 5 describes
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/21.htm'
    quote: 'what Xenophon so elaborately relates, and what is also in all probability described in Daniel 5:30'
  - where: 'note 21:5 “Feasting as the enemy arrives”'
    claim: Belshazzar’s feast and death in Daniel 5
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/5?lang=eng'
    quote: 'In that night was Belshazzar the king of the Chaldeans slain'
  - where: 'note 21:6 “The watchman”'
    claim: The Lord made Ezekiel a watchman, and requires the blood of the unwarned at the negligent watchman’s hand
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/33?lang=eng'
    quote: 'his blood will I require at the watchman’s hand'
  - where: 'note 21:6 “The watchman”'
    claim: The Lord made Ezekiel a watchman unto the house of Israel
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/3?lang=eng'
    quote: 'Son of man, I have made thee a watchman unto the house of Israel'
  - where: 'note 21:6 “The watchman”'
    claim: In the D&C parable the servants began a tower but questioned its need, and the enemy broke down the hedge
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/101?lang=eng'
    quote: 'they began to say among themselves: And what need hath my lord of this tower?'
  - where: 'note 21:6 “The watchman”'
    claim: The enemy came by night and broke down the hedge
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/101?lang=eng'
    quote: 'enemy came by night, and broke down the hedge'
  - where: 'note 21:9 “Babylon is fallen, is fallen”'
    claim: Isaiah 46 shows Babylon’s idols Bel and Nebo borne by beasts
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/46?lang=eng'
    quote: 'Bel boweth down, Nebo stoopeth, their idols were upon the beasts, and upon the cattle'
  - where: 'note 21:9 “Babylon is fallen, is fallen”'
    claim: The fall of Babylon and its gods is the work of the Lord himself; Rev. 18 uses the same words
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/21.htm'
    quote: 'In Revelation 18:1-2, the same words form the shout of triumph raised by the angel'
  - where: 'note 21:10 “Israel on the threshing floor”'
    claim: 'Israel was threshed, beaten and carried captive into Babylon'
    key: ot-manual-14
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-14?lang=eng'
    quote: 'Israel was threshed: mowed off its own field, beaten, and carried captive into Babylon.'
  - where: 'note 21:10 “Israel on the threshing floor”'
    claim: Israel becomes a threshing instrument that makes hills as chaff
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/41?lang=eng'
    quote: 'thresh the mountains, and beat them small, and shalt make the hills as chaff'
  - where: 'note 21:11 “Watchman, what of the night?”'
    claim: The cry from Seir; the second question is more urgent; the wish is for the night to pass
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/21.htm'
    quote: 'The more winged form of the second question is expressive of heightened, anxious urgency and haste.'
  - where: 'note 21:11 “Watchman, what of the night?”'
    claim: The reply means morning will dawn but be swallowed up again by night
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/21.htm'
    quote: 'a morning is coming, and at the same time a night, i.e., that even if the morning dawns, it will be swallowed up again directly by night.'
  - where: 'note 21:11 “Watchman, what of the night?”'
    claim: '“Return” (shub) is the call to turn back, the way of repentance'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/21.htm'
    quote: 'In shūbū (turn back) there lies a significant though ambiguous hint.'
  - where: 'note 21:11 “Watchman, what of the night?”'
    claim: The way to salvation is repentance
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/21.htm'
    quote: 'the way of repentance'
  - where: 'note 21:14 “Kindness in the desert”'
    claim: Dedan’s caravans were driven off the caravan road by war and had to camp in the wilderness
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/21.htm'
    quote: 'would be obliged to encamp in the wilderness, being driven out of the caravan road in consequence of the war that was spreading from north to south.'
  - where: 'note 21:14 “Kindness in the desert”'
    claim: Tema’s inhabitants bring bread coming before the fugitive (“prevented” = came to meet)
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/21.htm'
    quote: 'The inhabitants of the land of Tema are coming with its bread before the fugitive.'
