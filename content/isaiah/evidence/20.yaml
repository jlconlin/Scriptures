# Evidence ledger for Isaiah 20 (audit, 2026-10-01)
chapter: 20
claims:
  - where: when
    claim: The Philistine rising and Ashdod episode of Isaiah 20 falls in 711 BC
    key: bd-assyria
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/assyria-and-babylonia?lang=eng'
    quote: There was again a rising of the Philistines in 711 (Isa. 20), but once more the Egyptians failed their friends in the time of need.
  - where: setting
    claim: Ashdod was one of the five chief Philistine cities
    key: bd-philistines
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/philistines?lang=eng'
    quote: They formed a confederation of five chief cities, namely, Ashdod, Gaza, Ashkelon, Gath, and Ekron
  - where: setting
    claim: The Egyptians failed their friends in 711 (the Philistine rising)
    key: bd-assyria
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/assyria-and-babylonia?lang=eng'
    quote: There was again a rising of the Philistines in 711 (Isa. 20), but once more the Egyptians failed their friends in the time of need.
  - where: setting
    claim: The Philistines were drawn to join Egypt; Judah also placed confidence in Egypt
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/20.htm'
    quote: As the Philistines were led to join Egypt, not only by their situation, but probably by kinship of tribe as well
  - where: setting
    claim: Judah placed confidence in Egypt
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/20.htm'
    quote: The confidence which Judah placed in Egypt turned out most disastrously for Judah itself, just as Isaiah predicted here.
  - where: setting
    claim: Isaiah opposed an alliance with Egypt against Assyria (Isa. 30:1–5)
    key: bd-egypt
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/egypt?lang=eng'
    quote: an alliance with Egypt against Assyria was for some time the policy of the kings of Judah. Isaiah opposed this alliance (Isa. 30:1–5)
  - where: setting
    claim: Ethiopia is Cush
    key: bd-ethiopia
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ethiopia?lang=eng'
    quote: Ethiopia or Cush
  - where: setting
    claim: Tartan is the chief captain
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/20.htm'
    quote: Tartan (probably the same man) is met with in 2 Kings 18:17 as the chief captain of Sennacherib.
  - where: setting
    claim: Sargon's annals describe dethroning the rebel king of Ashdod, his flight into Egypt, and the capture of Ashdod
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/20.htm'
    quote: he had dethroned the rebellious king of Ashdod, and appointed another in his place, but that the people removed him, and chose another king; after which he marched with his army against Ashdod, and when the king fled from him into Egypt, he besieged Ashdod, and took it.
  - where: setting
    claim: Isaiah wore only a tunic (stripped of the outer garment) and went barefoot in public, the costume of a prisoner of war
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/20.htm'
    quote: He was to lay aside the dress of a mourner and preacher of repentance, and to have nothing on but his tunic (cetoneth); and in this, as well as barefooted, he was to show himself in public.
  - where: setting
    claim: The costume was that of a robbed, disgraced man, a beggar, or a prisoner of war
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/20.htm'
    quote: This was the costume of a man who had been robbed and disgraced, or else of a beggar or prisoner of war.
  - where: thread
    claim: Isaiah's rough prophet's garment, like Elijah's and John the Baptist's
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/20.htm'
    quote: We see from this that Isaiah was clothed in the same manner as Elijah, who wore a fur coat (2 Kings 1:8, cf., Zechariah 13:4; Hebrews 11:37)
  - where: thread
    claim: Judah's Egyptian policy is what the sign addresses (the coast-land saying in v. 6 chiefly means Judah)
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/20.htm'
    quote: there can be no doubt that Isaiah had chiefly the Judaeans in his mind.
  - where: note 20:1 “The king archaeologists found”
    claim: Sargon reigned 722–705 and concluded the siege of Samaria
    key: bd-assyria
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/assyria-and-babylonia?lang=eng'
    quote: was concluded by Sargon (722–705), a valiant prince, who smote the Egyptians at Raphia (720)
  - where: note 20:1 “The king archaeologists found”
    claim: Sargon is named nowhere else in the Old Testament; his Khorsabad palace inscriptions are known
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/20.htm'
    quote: No Assyrian king of the name of Sargon is mentioned anywhere else in the Old Testament
  - where: note 20:1 “The king archaeologists found”
    claim: Khorsabad inscriptions of Sargon include the Ashdod campaign
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/20.htm'
    quote: In the grand inscription found in the halls of the palace at Khorsabad, Sargon boasts of a successful battle which he had fought with Pharaoh Sebech at Raphia
  - where: note 20:1 “The king archaeologists found”
    claim: The Tartan is probably the same man as the chief captain of Sennacherib at Jerusalem
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/20.htm'
    quote: Tartan (probably the same man) is met with in 2 Kings 18:17 as the chief captain of Sennacherib.
  - where: note 20:1 “The king archaeologists found”
    claim: Tartan was Sargon's most trusted servant (cupbearer)
    key: ot-manual-14
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-14?lang=eng'
    quote: Tartan was the cupbearer, the most trusted servant of Sargon (see the Jerusalem Bible).
  - where: note 20:2 “What Isaiah took off”
    claim: Sackcloth was a coarse hairy overcoat worn by mourners; Isaiah dressed like Elijah
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/20.htm'
    quote: sak is a coarse linen or hairy overcoat of a dark colour (Revelation 6:12, cf., Isaiah 50:3), such as was worn by mourners
  - where: note 20:2 “What Isaiah took off”
    claim: 'Naked in Eastern usage meant stripped of the outer garment, left in the tunic'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/20.htm'
    quote: a person was looked upon as stripped and naked if he had only taken off his upper garment.
  - where: note 20:2 “What Isaiah took off”
    claim: Stripped, barefoot dress was that of a robbed, disgraced man, beggar, or prisoner of war
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/20.htm'
    quote: This was the costume of a man who had been robbed and disgraced, or else of a beggar or prisoner of war.
  - where: note 20:4 “How captives were led away”
    claim: Esarhaddon (681–668) invaded and conquered Egypt
    key: bd-assyria
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/assyria-and-babylonia?lang=eng'
    quote: Esarhaddon (681–668), who invaded and conquered Egypt, and his son Assurbanipal.
  - where: note 20:6 “How shall we escape?”
    claim: The Hebrew word means island or coastland; names Philistia and Phoenicia elsewhere; here chiefly Judah though not exclusively
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/20.htm'
    quote: 'At the same time, by "the inhabitant of this coast-land" we are not to understand Judah exclusively, but the inhabitants of Palestine generally' 
  - where: note 20:6 “How shall we escape?”
    claim: The word is used of Philistia (Zeph. 2:5) and Phoenicia (Isa. 23:2, 6)
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/20.htm'
    quote: which signifies both an island and a coast-land, is used as the name of Philistia and Zephaniah 2:5, and as the name of Phoenicia in Isaiah 23:2, Isaiah 23:6
  - where: note 20:4 “How captives were led away”
    claim: Nahum says Thebes was carried away and went into captivity
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/nahum/3?lang=eng'
    quote: she carried away, she went into captivity
