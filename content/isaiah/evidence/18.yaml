# Evidence ledger for Isaiah 18 (audit, 2026-10-01)
chapter: 18
claims:
  - where: 'when'
    claim: 'The prophecy belongs to the Assyrian crisis; the Ethiopian kingdom faced the approaching Assyrian invasion'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/18.htm'
    quote: 'The Ethiopian kingdom is thrown into the greatest excitement in the face of the approaching Assyrian invasion'
  - where: 'setting'
    claim: 'Cush is the land south of Egypt, extending to the Blue and White Nile'
    key: bd-ethiopia
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ethiopia?lang=eng'
    quote: 'Extended from Syene on the frontier of Egypt southward to the neighborhood of Khartoum, at the junction of the Blue and White Nile.'
  - where: 'setting'
    claim: 'The Ethiopian kingdom was summoning its means of self-defence against Assyria'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/18.htm'
    quote: 'Ethiopian kingdom was now summoning all the means of self-defence'
  - where: 'setting'
    claim: 'Messengers pass in boats of papyrus within the kingdom'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/18.htm'
    quote: 'messengers were now passing to and fro upon its great waters in boats of papyrus'
  - where: 'setting'
    claim: 'Tirhakah, king of Ethiopia, came out to make war'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/37?lang=eng'
    quote: 'he heard say concerning Tirhakah king of Ethiopia, He is come forth to make war with thee.'
  - where: 'setting'
    claim: 'Scholars differ whether the envoys go to Judah or to provinces of the Ethiopian realm'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/18.htm'
    quote: 'The ambassadors are not sent to Judah, but carry commands with the most stirring despatch to every province under Ethiopian rule.'
  - where: 'setting'
    claim: 'Others hold the ambassadors are sent to Judah for friendship and aid'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/18.htm'
    quote: 'the Ethiopian ambassadors mentioned here are despatched to Judah to seek for friendship and aid (as Ewald, Knobel, Meier, and Thenius maintain)'
  - where: 'setting'
    claim: 'The oracle foretells the destruction of Sennacherib’s army, so the Lord, not a coalition, deals with Assyria'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/18.htm'
    quote: 'The prophet is here predicting the destruction of the army of Sennacherib in his usual way, and in accordance with the actual fulfilment (Isaiah 37:36).'
  - where: 'note 18:1 “The land beyond the rivers of Cush”'
    claim: 'Cush extended from Syene to the neighborhood of Khartoum'
    key: bd-ethiopia
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ethiopia?lang=eng'
    quote: 'Extended from Syene on the frontier of Egypt southward to the neighborhood of Khartoum, at the junction of the Blue and White Nile.'
  - where: 'note 18:1 “The land beyond the rivers of Cush”'
    claim: 'The Hebrew phrase means the buzzing of wings, of insects of Egypt and Ethiopia'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/18.htm'
    quote: 'Tziltzal cenâphaim is the buzzing of the wings of insects, with which Egypt and Ethiopia swarmed on account of the climate and the abundance of water'
  - where: 'note 18:1 “The land beyond the rivers of Cush”'
    claim: '“Double shadow” has been proposed'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/18.htm'
    quote: 'Others, again, render it "the land of the double shadow" (Grotius, Vitringa, Knobel, and others)'
  - where: 'note 18:1 “The land beyond the rivers of Cush”'
    claim: 'The opening hoy here expresses compassion rather than anger'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/18.htm'
    quote: 'is an expression of compassion (cf., Isaiah 55:1; Zechariah 2:10) rather than of anger'
  - where: 'note 18:1 “A land shaped like wings?”'
    claim: 'Orson Pratt: the land shadowing with wings is North and South America, which look like the two wings of a bird'
    key: pratt-jod-16-rise-of-zion
    url: 'https://scriptures.byu.edu/jod/pdf/JoD16/JoD16_0085.pdf'
    quote: 'You would see a land that looked like the two wings of a bird.'
  - where: 'note 18:1 “A land shaped like wings?”'
    claim: 'Pratt: the ensign is the standard of the Almighty, raised for all nations'
    key: pratt-jod-16-rise-of-zion
    url: 'https://scriptures.byu.edu/jod/pdf/JoD16/JoD16_0085.pdf'
    quote: 'What is a standard? The same as an ensign—an ensign that is to be lifted up upon the mountains, upon a land afar off. It is the standard of the Almighty'
  - where: 'note 18:1 “A land shaped like wings?”'
    claim: 'Pratt: a great latter-day work for the gathering of the house of Israel'
    key: pratt-jod-16-rise-of-zion
    url: 'https://scriptures.byu.edu/jod/pdf/JoD16/JoD16_0085.pdf'
    quote: 'This is a great latter-day work also for the gathering of the house of Israel'
  - where: 'note 18:1 “A land shaped like wings?”'
    claim: 'McConkie’s chart summarizes Isa. 18'
    key: mcconkie-keys
    url: 'https://www.churchofjesuschrist.org/study/ensign/1973/10/ten-keys-to-understanding-isaiah?lang=eng'
    quote: 'Restoration; gathering of Israel; sending of missionaries from America.'
  - where: 'note 18:1 “A land shaped like wings?”'
    claim: 'The chapter’s details (Ethiopia, Nile, papyrus boats) point to Cush, addressed in the Assyrian crisis'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/18.htm'
    quote: 'The prophet is here predicting the destruction of the army of Sennacherib in his usual way'
