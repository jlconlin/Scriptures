chapter: 36
claims:
  - where: 'when'
    claim: 'The siege of Jerusalem by Sennacherib took place in 701 BC'
    key: luckenbill-annals
    url: 'https://archive.org/download/annalsofsennache00senn_0/annalsofsennache00senn_0_djvu.txt'
    quote: 'According to the Assyrian account this siege, conducted in 701, led to the submission of Hezekiah'
  - where: 'setting'
    claim: 'Isaiah 36–39 parallels the account in 2 Kings 18:13–20:19 (opening verses run parallel)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/18?lang=eng'
    quote: 'Now in the fourteenth year of king Hezekiah did Sennacherib king of Assyria come up against all the fenced cities of Judah, and took them.'
  - where: 'setting'
    claim: 'Chapters 38–39 point ahead to Babylon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/39?lang=eng'
    quote: 'shall be carried to Babylon: nothing shall be left, saith the Lord.'
  - where: 'setting'
    claim: 'Sennacherib invaded Judah, took fortified cities, and sent messengers from Lachish demanding Hezekiah’s subjection'
    key: bd-sennacherib
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sennacherib?lang=eng'
    quote: 'Sennacherib accordingly invaded Judah and took some of the fenced cities (2 Kgs. 18:13; 2 Chr. 32:1; Isa. 36:1); sent messengers from Lachish, demanding Hezekiah’s subjection'
  - where: 'setting'
    claim: 'The Rabshakeh stood at the spot where Isaiah met Ahaz (Isa. 7:3)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/7?lang=eng'
    quote: 'Go forth now to meet Ahaz, thou, and Shear-jashub thy son, at the end of the conduit of the upper pool in the highway of the fuller’s field;'
  - where: 'thread'
    claim: 'The root batach (“trust”) recurs in the Rabshakeh’s speech (36:4, 5, 6, 7, 9, 15; 37:10)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Isa.xml'
    quote: '<w lemma="982" morph="HVqv2mp" id="23d1y">בִּטְח֥וּ</w>'
  - where: 'note 36:1 “Sennacherib’s invasion”'
    claim: 'Hezekiah refused the usual tribute to Assyria'
    key: bd-hezekiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hezekiah?lang=eng'
    quote: 'refused to pay the usual tribute to Assyria (2 Kgs. 18:7)'
  - where: 'note 36:1 “Sennacherib’s invasion”'
    claim: 'On Sennacherib’s accession Hezekiah tried to throw off the Assyrian yoke'
    key: bd-sennacherib
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sennacherib?lang=eng'
    quote: 'Upon his accession, Hezekiah, king of Judah, tried to throw off the Assyrian yoke.'
  - where: 'note 36:1 “Sennacherib’s invasion”'
    claim: 'Hezekiah was the center of the western anti-Assyrian rebellion of 701; Sennacherib marched west'
    key: luckenbill-annals
    url: 'https://archive.org/download/annalsofsennache00senn_0/annalsofsennache00senn_0_djvu.txt'
    quote: 'it is no wonder that the year 701 saw respect for Assyrian authority rapidly disappearing.'
  - where: 'note 36:1 “Sennacherib’s invasion”'
    claim: 'Sennacherib’s annals claim victory over the Egyptian and Ethiopian army at Eltekeh'
    key: luckenbill-annals
    url: 'https://archive.org/download/annalsofsennache00senn_0/annalsofsennache00senn_0_djvu.txt'
    quote: 'Egyptian and Ethiopian armies made their appearance, and at Eltekeh the battle was joined. The Assyrians won.'
  - where: 'note 36:1 “Sennacherib’s invasion”'
    claim: 'The annals claim forty-six of Hezekiah’s strong cities and shut Hezekiah up in Jerusalem like a caged bird'
    key: luckenbill-annals
    url: 'https://archive.org/download/annalsofsennache00senn_0/annalsofsennache00senn_0_djvu.txt'
    quote: 'As for Hezekiah, the Jew, who did not submit to my yoke, 46 of his strong cities, as well as the small cities in their neighborhood'
  - where: 'note 36:1 “Sennacherib’s invasion”'
    claim: 'The Assyrian account does not mention the capture of Jerusalem'
    key: luckenbill-annals
    url: 'https://archive.org/download/annalsofsennache00senn_0/annalsofsennache00senn_0_djvu.txt'
    quote: '(it does not mention the capture of the city)'
  - where: 'note 36:1 “Sennacherib’s invasion”'
    claim: 'Hezekiah sent tribute to Sennacherib at Lachish earlier in the campaign'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/18?lang=eng'
    quote: 'And Hezekiah king of Judah sent to the king of Assyria to Lachish, saying, I have offended; return from me'
  - where: 'note 36:2 “Lachish and the Rabshakeh”'
    claim: 'The annals do not mention Sennacherib at Lachish, but an inscribed relief shows him there'
    key: luckenbill-annals
    url: 'https://archive.org/download/annalsofsennache00senn_0/annalsofsennache00senn_0_djvu.txt'
    quote: 'Sennacherib’s annals make no mention of his presence before Lachish, but as already indicated, an inscribed relief shows him there.'
  - where: 'note 36:2 “Lachish and the Rabshakeh”'
    claim: 'The Bible has Sennacherib send messengers from Lachish'
    key: bd-sennacherib
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sennacherib?lang=eng'
    quote: 'sent messengers from Lachish, demanding Hezekiah’s subjection (2 Kgs. 18:17; 2 Chr. 32:9; Isa. 36:2)'
  - where: 'note 36:2 “Lachish and the Rabshakeh”'
    claim: 'Rabshakeh came with two other officials, the Tartan and the Rabsaris'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/18?lang=eng'
    quote: 'And the king of Assyria sent Tartan and Rabsaris and Rab-shakeh from Lachish to king Hezekiah with a great host against Jerusalem.'
  - where: 'note 36:2 “The same spot where Ahaz stood”'
    claim: 'Ahaz appealed to Assyria for help'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/16?lang=eng'
    quote: 'So Ahaz sent messengers to Tiglath-pileser king of Assyria, saying, I am thy servant and thy son: come up, and save me'
  - where: 'note 36:4 “The question of the chapter”'
    claim: 'The root batach appears in 36:15 (and 36:4–7, 9, and 37:10)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Isa.xml'
    quote: '<w lemma="982" n="1.0" morph="HVqi1cs" id="23xyw">אֶבְטַ֖ח</w>'
  - where: 'note 36:6 “A broken reed”'
    claim: 'Isaiah elsewhere says Egypt’s help is in vain'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/30?lang=eng'
    quote: 'For the Egyptians shall help in vain, and to no purpose'
  - where: 'note 36:7 “Twisting a righteous reform”'
    claim: 'Hezekiah and Josiah centralized worship in Jerusalem and removed the high places'
    key: bd-high-places
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/high-places?lang=eng'
    quote: 'Religious reformers like Hezekiah and Josiah tried therefore to centralize the worship more and more in Jerusalem'
  - where: 'note 36:7 “Twisting a righteous reform”'
    claim: 'Hezekiah removed the high places across Judah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/31?lang=eng'
    quote: 'threw down the high places and the altars out of all Judah and Benjamin'
  - where: 'note 36:10 “A half-truth”'
    claim: 'Isaiah called Assyria the rod of the Lord’s anger and said the Lord would punish Assyria’s pride'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/10?lang=eng'
    quote: 'I will punish the fruit of the stout heart of the king of Assyria, and the glory of his high looks.'
  - where: 'note 36:10 “A half-truth”'
    claim: 'Nephi on the adversary’s deceptions'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/28?lang=eng'
    quote: 'And others will he pacify, and lull them away into carnal security, that they will say: All is well in Zion'
  - where: 'note 36:11 “Aramaic and the language of Judah”'
    claim: '“The Syrian language” is Aramaic; “the Jews’ language” is the language of Judah'
    key: nrsv
    url: 'https://www.biblegateway.com/passage/?search=Isaiah+36%3A11&version=NRSVA'
    quote: 'Please speak to your servants in Aramaic, for we understand it; do not speak to us in the language of Judah within the hearing of the people who are on the wall'
  - where: 'note 36:16 “A counterfeit promise”'
    claim: 'Vine and fig tree as the prophets’ picture of peace; Satan seeks all men to be miserable'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/micah/4?lang=eng'
    quote: 'they shall sit every man under his vine and under his fig tree; and none shall make them afraid'
  - where: 'note 36:18 “Putting the Lord among the idols”'
    claim: 'Hezekiah’s prayer calls the gods the work of men’s hands'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/37?lang=eng'
    quote: 'were no gods, but the work of men’s hands, wood and stone'
  - where: 'note 36:21 “Answer him not”'
    claim: 'The people were silent at the king’s command; Jesus was silent before accusers'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/36?lang=eng'
    quote: 'But they held their peace, and answered him not a word: for the king’s commandment was, saying, Answer him not.'
