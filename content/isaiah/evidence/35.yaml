# Evidence ledger for Isaiah 35 (audit, 2026-10-01)
chapter: 35
claims:
  - where: 'setting'
    claim: 'Chapters 36–39 tell of Hezekiah and Sennacherib; chapter 40 opens “Comfort ye”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/36?lang=eng'
    quote: 'Now it came to pass in the fourteenth year of king Hezekiah, that Sennacherib king of Assyria came up against all the defenced cities of Judah, and took them.'
  - where: 'setting'
    claim: 'Latter-day Saints read the chapter as fulfilled in the settlement of the Rocky Mountain valleys'
    key: ot-manual-15
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-15?lang=eng'
    quote: 'Several General Authorities have seen the settlement of the mountain valleys of the Rockies by the Latter-day Saints as a fulfillment of these verses in Isaiah'
  - where: 'setting'
    claim: 'Verses 8–10 are read as the return of the ten tribes and the gathering, closely related to D&C 133'
    key: ot-manual-15
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-15?lang=eng'
    quote: 'Isaiah 35:8–10 is closely related to Doctrine and Covenants 133:26–34 and is generally acknowledged to refer to the return of the ten tribes.'
  - where: 'section 1 plain; note 35:1 “The desert blossoms”'
    claim: 'The flower (chavatstselet) is the meadow saffron or crocus'
    key: bdb
    url: 'https://biblehub.com/hebrew/2261.htm'
    quote: 'חֲבַצֶּלֶת  noun feminine meadow-saffron or crocus'
  - where: 'note 35:1 “The desert blossoms”'
    claim: 'Pioneers arrived July 1847; the valleys soon began to blossom as the rose'
    key: ot-manual-15
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-15?lang=eng'
    quote: 'When the Saints arrived in the Salt Lake Valley in July 1847, it could be described as a “wilderness” and a “solitary place” (Isaiah 35:1).'
  - where: 'note 35:1 “The desert blossoms”'
    claim: 'The verse may also be fulfilled by the settlement of modern Jews in the Holy Land'
    key: ot-manual-15
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-15?lang=eng'
    quote: 'But this prophecy may also be fulfilled by the settlement of modern Jews in the Holy Land, where similar things are taking place.'
  - where: 'note 35:1 “The desert blossoms”'
    claim: 'Benjamin Brown (1853) tied Isa. 33:16 and 35:1 to a people gathered in the mountains'
    key: sc-knowhy-802
    url: 'https://scripturecentral.org/knowhy/why-did-the-saints-move-to-the-rocky-mountains'
    quote: 'Writing in 1853, Benjamin Brown explained that “the Bible distinctly depicted a great portion of the work of the last days as being on the mountains,”'
  - where: 'note 35:2 “The best of the land, given to the desert”'
    claim: 'Lebanon is a land of forests and cedars'
    key: bd-lebanon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/lebanon?lang=eng'
    quote: 'It is still a land of forests, though the groves of cedar trees have almost disappeared.'
  - where: 'note 35:2 “The best of the land, given to the desert”'
    claim: 'Sharon is the coastal plain from Carmel to Joppa, celebrated for beauty and flowers'
    key: bd-sharon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sharon?lang=eng'
    quote: 'extending from Carmel to Joppa, celebrated for its beauty and its flowers'
  - where: 'note 35:4 “He will come and save you”'
    claim: 'Fearful heart (nimhare lev) means hurried, anxious, disturbed of heart'
    key: bdb
    url: 'https://biblehub.com/hebrew/4116.htm'
    quote: 'be hurried = anxious, disturbed נְמְהֲרֵילֵֿב Isaiah 35:4'
  - where: 'note 35:7 “Pools of living water”'
    claim: 'Sharav (parched ground) means burning heat or parched ground; Isa. 35:7 is the parched-ground use'
    key: bdb
    url: 'https://biblehub.com/hebrew/8273.htm'
    quote: 'שָׁרָב  noun masculine 1 burning heat; 2 parched ground;'
  - where: 'note 35:10 “The ransomed return with songs”'
    claim: 'Peduyei is from padah, to ransom'
    key: bdb
    url: 'https://biblehub.com/hebrew/6299.htm'
    quote: 'מָּדָה  verb ransom'
