  - where: 'note 9:6 “What a throne name is”'
    claim: 'Holland: Isaiah 9 can be used as the coronation of a King/Messiah (Holland, p. 6)'
    key: 'isaiah-in-bom'
    url: 'https://storage.googleapis.com/scripturecentral-prod-strapi-uploads/ry_and_welch_isaiah_in_the_book_of_mormon_1998_184195e137/ry_and_welch_isaiah_in_the_book_of_mormon_1998_184195e137.pdf'
    quote: 'there are many ways to use this famous passage, including as the coronation of a King/Messiah, but let me refer to it here for its references to Christ''s birth.'
  - where: 'note 9:6 “What a throne name is”'
    claim: 'A king ascending the throne commonly took a throne name or titles in the ancient world'
    key: 'sc-knowhy-536'
    url: 'https://scripturecentral.org/knowhy/why-did-benjamin-give-multiple-names-for-jesus-at-the-coronation-of-his-son-mosiah'
    quote: 'It was common in the ancient world for the king ascending to the throne to take a throne name for himself'
  - where: 'note 9:6 “What a throne name is”'
    claim: 'Pharaohs received a titulary of five names at accession, expressing belief in the pharaoh’s deity'
    key: 'sc-knowhy-536'
    url: 'https://scripturecentral.org/knowhy/why-did-benjamin-give-multiple-names-for-jesus-at-the-coronation-of-his-son-mosiah'
    quote: 'a formal, time-honored practice [was] to bestow a titulary of five names on a pharaoh ascending to the throne as part of the accession ceremony. These were an expression of the Egyptian beliefs in the deity of the pharaoh.'
  - where: 'note 9:6 “What a throne name is”'
    claim: 'Isaiah 9:6 seen as a possible echo of the Egyptian practice; probable though not certain that Judah’s kings took a new name at accession'
    key: 'sc-knowhy-536'
    url: 'https://scripturecentral.org/knowhy/why-did-benjamin-give-multiple-names-for-jesus-at-the-coronation-of-his-son-mosiah'
    quote: 'Some scholars have seen this theophoric prophecy as a possible echo or imitation specifically of the Egyptian practice of assigning important names or titles to a new king, and it is “probable, though not certain, that the kings of Judah took a new name when they succeeded to the throne.”'
