  - where: 'note 9:12 “The refrain tolls again”'
    claim: 'The idiom yadô neṭûyâ is a threatening gesture; the refrain follows accounts of punishment (5:25; 9:12, 17, 21; 10:4)'
    key: 'gee-hand-lord'
    url: 'https://rsc.byu.edu/vol-16-no-2-2015/different-way-seeing-hand-lord'
    quote: 'The idiom is yadô neṭūyâ, which means that the hand is hanging over, threatening, or bent.[1] It is thus a threatening gesture.'
  - where: 'note 9:12 “The refrain tolls again”'
    claim: 'A god depicted with raised arm, weapon ready to strike (warrior pose)'
    key: 'gee-hand-lord'
    url: 'https://rsc.byu.edu/vol-16-no-2-2015/different-way-seeing-hand-lord'
    quote: 'This stele shows the god holding a weapon over his head, ready to strike.'
  - where: 'note 9:12 “The refrain tolls again”'
    claim: 'Latter-day Saints typically read the outstretched hand as mercy, but the ancient meaning was the opposite; merciful imagery uses extended arms of love'
    key: 'sc-knowhy-49'
    url: 'https://scripturecentral.org/knowhy/why-is-the-lords-hand-stretched-out-still'
    quote: 'Other prophets use similar imagery to depict the merciful embrace of the Lord, but in those cases a different idiom is used, namely that of extending the arms of his love'
