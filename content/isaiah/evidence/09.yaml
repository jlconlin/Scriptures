# Evidence ledger for Isaiah 9 (audit, 2026-10-01)
chapter: 9
claims:
  - where: 'when'
    claim: 'Bible Dictionary dates Tiglath-pileser’s carrying away of Galilee (740 BC) and Sargon’s of the rest of Israel (721 BC): the late 700s'
    key: 'bd-captivities'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/captivities-of-the-israelites?lang=eng'
    quote: 'In 740 B.C. Tiglath-pileser carried away the trans-Jordanic tribes and the inhabitants of Galilee (2 Kgs. 15:29; 1 Chr. 5:26) to Assyria; in 721 B.C. Sargon Ⅱ carried into captivity the rest of Israel'
  - where: 'setting'
    claim: 'Tiglath-pileser took Galilee and Naphtali and carried them captive'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/15?lang=eng'
    quote: 'Tiglath-pileser king of Assyria, and took Ijon, and Abel-beth-maachah, and Janoah, and Kedesh, and Hazor, and Gilead, and Galilee, all the land of Naphtali, and carried them captive to Assyria.'
  - where: 'setting'
    claim: 'Zebulun and Naphtali afflicted “at the first”, and Galilee more grievously afterward (verse 1)'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/9?lang=eng'
    quote: 'when at the first he lightly afflicted the land of Zebulun and the land of Naphtali, and afterward did more grievously afflict her by the way of the sea, beyond Jordan, in Galilee of the nations.'
  - where: 'section 1 plain'
    claim: 'The plain-words rendering “in the future he will honor Galilee” follows the NIV rather than the KJV’s “more grievously afflict”'
    key: 'sc-knowhy-869'
    url: 'https://scripturecentral.org/knowhy/why-was-isaiah-9-important-for-defending-jesus-s-galilean-origin'
    quote: 'In the past he [God through the Assyrians] humbled the land of Zebulun and the land of Naphtali, but in the future he will honor Galilee of the nations, by the Way of the Sea, beyond the Jordan” (Isaiah 9:1, NIV)'
  - where: 'note 9:1 “First into darkness, first to see the light”'
    claim: 'Galilee was the northern district, with Naphtali and Zebulun, crossed by highways to Damascus, Egypt and eastern Palestine'
    key: 'bd-galilee'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/galilee?lang=eng'
    quote: 'included the territories of Issachar, Naphtali, Zebulun, and Asher.'
  - where: 'note 9:1 “First into darkness, first to see the light”'
    claim: 'Galilee was crossed by important highways'
    key: 'bd-galilee'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/galilee?lang=eng'
    quote: 'It was crossed by important highways leading to Damascus, Egypt, and eastern Palestine.'
  - where: 'note 9:1 “First into darkness, first to see the light”'
    claim: 'Tiglath-pileser carried off the inhabitants of Galilee'
    key: 'bd-captivities'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/captivities-of-the-israelites?lang=eng'
