  key: bdb
  url: https://biblehub.com/hebrew/1945.htm
  quote: NASB TranslationAh (2), alas (11), ho (2), ho there (1), woe (34).
- where: note 55:2 “What Jacob and Nephi did with this invitation”
  claim: Jacob quotes verses 1–2 and adapts verse 2 (2 Ne. 9:50–51)
  key: lds-scriptures
  url: https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/9?lang=eng
  quote: Come, my brethren, every one that thirsteth, come ye to the waters; and he that hath no money, come buy and eat; yea, come buy wine and milk without money and without price.
- where: note 55:2 “What Jacob and Nephi did with this invitation”
  claim: Jacob’s adaptation names the Holy One of Israel and the food that perisheth not
  key: lds-scriptures
  url: https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/9?lang=eng
