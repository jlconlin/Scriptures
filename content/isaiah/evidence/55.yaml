  claim: BDB lists Isa. 5:8 and Isa. 55:1 under the same word, the latter as an exclamation arousing attention
  key: bdb
  url: https://biblehub.com/hebrew/1945.htm
  quote: Sts. hardly more than an exclamation arousing attention Ha! (though perhaps with a touch of sympathy or pity) Isaiah 18:1; Isaiah 55:1
