  quote: scholars argue that Isaiah 40–55 were actually written by a later prophet, ca. 540 BC during the Babylonian exile
- where: when
  claim: Jacob’s sermon (2 Ne. 6–10) is dated about 559–545 BC
  key: lds-scriptures
  url: https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/9?lang=eng
  quote: The righteous are to be saved in the kingdom of God—Penalties for sins are set forth—The Holy One of Israel is the keeper of the gate. About 559–545
- where: when
  claim: Nephi’s 2 Ne. 26 is dated about 559–545 BC
  key: lds-scriptures
  url: https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/26?lang=eng
  quote: The Lord forbids men to practice priestcrafts. About 559–545
- where: setting
  claim: Many scholars read Isaiah 40–55 as one unit from the exile
  key: sc-knowhy-91
  url: https://scripturecentral.org/knowhy/why-did-abinadi-talk-about-the-suffering-messiah
  quote: scholars argue that Isaiah 40–55 were actually written by a later prophet, ca. 540 BC during the Babylonian exile
- where: setting
  claim: Church heading for Isaiah 53 describes the Messiah’s sufferings
  key: lds-scriptures
  url: https://www.churchofjesuschrist.org/study/scriptures/ot/isa/53?lang=eng
