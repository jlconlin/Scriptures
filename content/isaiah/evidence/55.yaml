- where: setting
  claim: Church heading for Isaiah 54 describes Zion established in the last days
  key: lds-scriptures
  url: https://www.churchofjesuschrist.org/study/scriptures/ot/isa/54?lang=eng
  quote: In the last days, Zion and her stakes will be established, and Israel will be gathered in mercy and tenderness
- where: setting
  claim: Church heading for Isaiah 55 (an invitation to the meal and covenant)
  key: lds-scriptures
  url: https://www.churchofjesuschrist.org/study/scriptures/ot/isa/55?lang=eng
  quote: Come and drink; salvation is free—The Lord will make an everlasting covenant with Israel—Seek the Lord while He is near.
