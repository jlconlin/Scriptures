page: zion-and-her-husband
claims:
  - where: 'opening'
    claim: 'Jesus Christ is the Redeemer (Guide to the Scriptures); Isa. 54:5 is among the Redeemer references'
    key: gs-redeemer
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/redeemer?lang=eng'
    quote: 'I will help thee, saith thy redeemer, the Holy One of Israel, Isa. 41:14 (Isa. 43:14; 48:17; 54:5; 59:20).'
  - where: 'opening'
    claim: 'Christ is the Bridegroom, the Church His symbolic bride'
    key: gs-bridegroom
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/bridegroom?lang=eng'
    quote: 'Jesus Christ is symbolized in the scriptures as the Bridegroom. The Church is His symbolic bride.'
  - where: 'section “Forsaken, not forgotten”'
    claim: 'The Savior will not forget because He has graven us on His palms'
    key: ot-seminary-lesson-129
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-material-2018/isaiah/lesson-129?lang=eng'
    quote: 'According to verse 16, why will the Savior not forget any of Heavenly Father’s children? (Because the Savior has “graven [us] upon the palms of [His] hands.”)'
  - where: 'section “Forsaken, not forgotten”'
    claim: 'Bridegroom imagery on Isa. 49:18–21, with later references'
    key: ot-manual-17
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-17?lang=eng'
    quote: 'This imagery of Christ as the Bridegroom and His covenant people as His bride is seen elsewhere in the scriptures (see Isaiah 54:5; Jeremiah 3:14; Matthew 25:1–13; Revelation 19:7; D&C 33:17; 133:10, 19).'
  - where: 'section “Put away, and told to rise”'
    claim: 'The Lord had not divorced Israel; Israel separated herself by her sins'
    key: ot-manual-17
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-17?lang=eng'
    quote: 'But the Lord had no creditors; neither had He divorced His “wife,” Israel. Instead, Israel had separated herself from the Lord by her sins and was in debt to her evil creditors.'
  - where: 'section “Thy Maker is thine husband”'
    claim: 'Christ is the great Redeemer because He paid the price'
    key: gs-redeemer
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/redeemer?lang=eng'
    quote: 'Jesus Christ is the great Redeemer of mankind because He, through His Atonement, paid the price for the sins of mankind and made possible the resurrection of all people.'
  - where: 'section “Thy Maker is thine husband”'
    claim: '3 Ne. 22 is Isaiah 54 quoted; verse 5 reads “thy maker, thy husband…”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/22?lang=eng'
    quote: 'For thy maker, thy husband, the Lord of Hosts is his name; and thy Redeemer, the Holy One of Israel—the God of the whole earth shall he be called.'
  - where: 'section “Thy Maker is thine husband”'
    claim: 'Chapter heading of 3 Ne. 22 compares it to Isaiah 54'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/22?lang=eng'
    quote: 'In the last days, Zion and her stakes will be established, and Israel will be gathered in mercy and tenderness—They will triumph—Compare Isaiah 54.'
  - where: 'section “No more Forsaken”'
    claim: 'Beulah means Married, applied to the land (Isa. 62:4–5)'
    key: bd-beulah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/beulah?lang=eng'
    quote: 'Married. Name applied to the land of Israel as the spouse of God and of her own sons (Isa. 62:4–5).'
  - where: 'section “No more Forsaken”'
    claim: 'Once again Zion shall be married to the Lord'
    key: ot-manual-18
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-18?lang=eng'
    quote: 'Once again Zion shall be married to the Lord. This symbol represents her return to spiritual righteousness'
  - where: 'section “No more Forsaken”'
    claim: 'Sources name the woman: Jerusalem and by extension the house of Israel'
    key: sc-knowhy-550
    url: 'https://scripturecentral.org/knowhy/why-does-isaiah-prophesy-of-the-daughter-of-zion'
    quote: 'The daughter of Zion is a poetic personification of the city Jerusalem, and by extension is a metaphor for the House of Israel.'
  - where: 'section “No more Forsaken”'
    claim: 'Sources name the woman: Israel as a barren wife'
    key: ot-manual-17
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-17?lang=eng'
    quote: 'Israel is called a barren wife because of her inability or unwillingness to produce spiritual offspring for the Lord.'
  - where: 'section “No more Forsaken”'
    claim: 'Sources name the woman: the Church as Christ’s symbolic bride'
    key: gs-bridegroom
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/bridegroom?lang=eng'
    quote: 'Jesus Christ is symbolized in the scriptures as the Bridegroom. The Church is His symbolic bride.'
  - where: 'section “No more Forsaken”'
    claim: 'Sources name the woman: the pure in heart'
    key: gs-zion
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/zion?lang=eng'
    quote: 'The pure in heart (D&C 97:21). Zion also means a place where the pure in heart live.'
  - where: 'section “No more Forsaken”'
    claim: 'Sources name the woman: the land (Beulah)'
    key: bd-beulah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/beulah?lang=eng'
    quote: 'Married. Name applied to the land of Israel as the spouse of God and of her own sons (Isa. 62:4–5).'
  - where: 'section “No more Forsaken”'
    claim: 'Rev. 19:7 and D&C 133:10 are listed among later uses of the Bridegroom imagery'
    key: ot-manual-17
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-17?lang=eng'
    quote: 'This imagery of Christ as the Bridegroom and His covenant people as His bride is seen elsewhere in the scriptures (see Isaiah 54:5; Jeremiah 3:14; Matthew 25:1–13; Revelation 19:7; D&C 33:17; 133:10, 19).'
