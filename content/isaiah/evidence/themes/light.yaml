page: light
claims:
  - where: 'section “A great light in the dark”'
    claim: 'Church footnote on Isa. 9:2: the darkness is apostasy and captivity; the great light is Christ'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/9?lang=eng'
    quote: 'The “dimness” and “darkness” were apostasy and captivity (Isa. 8:20–22); the “great light” is Christ (Isa. 9:6–7).'
  - where: 'section “A light to the Gentiles”'
    claim: 'Manual ties Acts 13:47 to Isa. 42:6'
    key: nt-student-manual-32
    url: 'https://www.churchofjesuschrist.org/study/manual/new-testament-student-manual/acts/chapter-32-acts-13-15?lang=eng'
    quote: 'Paul taught the Jews of his day that the Lord had called Israel to be “a light of the Gentiles” (Acts 13:47; Isaiah 42:6).'
  - where: 'section “Waiting for light”'
    claim: 'Manual on Isa. 59:9: failure to heed the Lord causes people to wait for light and none comes'
    key: ot-manual-18
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-18?lang=eng'
    quote: 'Failure to heed the word of the Lord causes people to “wait for light” but none comes (Isaiah 59:9), and thus they “walk in darkness” and “grope for the wall like the blind” (v. 10).'
  - where: 'section “Arise, shine”'
    claim: 'Church footnote on Isa. 60:1: Zion is to arise and be a light unto the nations'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/60?lang=eng'
    quote: 'Zion is to arise and be a light unto the nations'
  - where: 'section “Arise, shine”'
    claim: 'Manual: the Light of Zion is the Lord Himself'
    key: ot-manual-18
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-18?lang=eng'
    quote: 'The Light of Zion is the Lord Himself, and these verses refer to conditions of the latter days when Zion shines forth but darkness covers the earth.'
  - where: 'section “Arise, shine”'
    claim: 'Footnote on D&C 115:5 “Arise” points to Isa. 60:1 (1–3)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/115?lang=eng'
    quote: 'Isa. 60:1 (1–3). TG Mission of Latter-day Saints'
  - where: 'section “Arise, shine”'
    claim: 'Manual on Isa. 42:6: every covenant person holds up the light of the Savior, citing 3 Ne. 18:24'
    key: ot-manual-16
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-16?lang=eng'
    quote: 'Every covenant person becomes a light to the world by holding up the light of the Savior through faithfully living His commandments (see 3 Nephi 18:24; see also Acts 26:17–18).'
