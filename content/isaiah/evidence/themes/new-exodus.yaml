page: new-exodus
claims:
  - where: 'section “Like the day he came up out of Egypt”'
    claim: 'Church footnote on Isa. 11:15 “Egyptian”: the destruction of the Egyptian sea means to facilitate the return, as in the days of Moses'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/11?lang=eng'
    quote: 'IE facilitate the return, as in the days of Moses.'
  - where: 'section “Prepare ye the way of the LORD”'
    claim: 'All four Gospels apply Isa. 40:3 to John the Baptist (Matt. 3:3)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/3?lang=eng'
    quote: 'For this is he that was spoken of by the prophet Esaias, saying, The voice of one crying in the wilderness, Prepare ye the way of the Lord, make his paths straight.'
  - where: 'section “Prepare ye the way of the LORD”'
    claim: 'Mark 1:3 quotes the same words'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/1?lang=eng'
    quote: 'The voice of one crying in the wilderness, Prepare ye the way of the Lord, make his paths straight.'
  - where: 'section “Prepare ye the way of the LORD”'
    claim: 'Luke 3 quotes the same words; Luke 3:4 footnote on “voice” lists Matt. 3:3; Mark 1:3; John 1:23'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/3?lang=eng'
    quote: 'Matt. 3:3; Mark 1:3; John 1:23; D&C 84:28 (26–28); JS—H 1:72 (70–73)'
  - where: 'section “Prepare ye the way of the LORD”'
    claim: 'John the Baptist applies Isa. 40:3 to himself'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/1?lang=eng'
    quote: 'I am the voice of one crying in the wilderness, Make straight the way of the Lord, as said the prophet Esaias.'
  - where: 'section “Not with haste”'
    claim: 'The Savior quotes Isa. 52:11–12 in 3 Ne. 20:41–42 (footnote 41a “Depart” points to Isa. 52:11)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/20?lang=eng'
    quote: 'Isa. 52:11 (11–15)'
  - where: 'section “Not with haste”'
    claim: 'Footnote on D&C 49:27 “rearward” points to Isa. 52:12'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/49?lang=eng'
    quote: 'Isa. 52:12'
  - where: 'section “The way of the people”'
    claim: 'Footnote on D&C 133:27 “highway” points to Ex. 14:29, the crossing of the sea'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/133?lang=eng'
    quote: 'Ex. 14:29; Isa. 11:16 (15–16); 35:8 (8–10); 51:11 (9–11); 62:10 (10–12); 2 Ne. 21:16. TG Israel, Gathering of.'
  - where: 'section “Like the day he came up out of Egypt”'
    claim: 'Footnote on 2 Ne. 6:14 “second time” points to 2 Ne. 21:11 (Isa. 11:11)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/6?lang=eng'
    quote: '2 Ne. 21:11; 25:17; 29:1.'
  - where: 'section “A new thing”'
    claim: 'Footnote on Isa. 48:21 “rock” points to Ex. 17:6'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/48?lang=eng'
    quote: 'Ex. 17:6; Num. 20:11.'
  - where: 'section “Not with haste”'
    claim: '“Haste” in Isa. 52:12 is chippazon (lemma 2649), its only occurrence in Isaiah'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Isa.xml'
    quote: '<w lemma="b/2649" n="1.1.0" morph="HR/Ncmsa" id="23ynw">בְ/חִפָּזוֹן֙</w>'
  - where: 'section “Not with haste”'
    claim: '“Haste” in Ex. 12:11 is the same word, chippazon (lemma 2649)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: '<w lemma="b/2649" n="0.1" morph="HR/Ncmsa" id="02gUj">בְּ/חִפָּז֔וֹן</w>'
