    key: dc-student-manual-2017-133
    url: 'https://www.churchofjesuschrist.org/study/manual/doctrine-and-covenants-student-manual-2017/chapter-53-doctrine-and-covenants-133?lang=eng'
    quote: 'While this prophecy may refer to the power and glory that will be manifested at Jesus Christ’s Second Coming, it may also refer to the Lord’s great latter-day work of gathering Israel'
  - where: 'section “How the arc points to Christ”'
    claim: 'Old Testament Student Manual on Isa. 51:4–16 (“mine arm”): Jehovah is the same person as Jesus Christ'
    key: ot-manual-17
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-17?lang=eng'
    quote: 'As do many other passages in the Old Testament, these verses bear strong witness that Jehovah, the God of the Old Testament, is the same person as Jesus Christ of the New.'
