page: arm-of-the-lord
claims:
  - where: opening
    claim: 'An arm is a symbol of power; making the arm bare means showing power to the world'
    key: bom-student-manual-6
    url: 'https://www.churchofjesuschrist.org/study/manual/book-of-mormon-student-manual/chapter-6-1-nephi-19-22?lang=eng'
    quote: 'An arm is a symbol of power. The metaphor that God will make “bare his arm” means that God will show his power to the entire world.'
  - where: opening
    claim: 'Isaiah uses zeroa (arm) 17 times; 3 are a human arm (9:20, 17:5, 44:12)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Isa.xml'
    quote: '<w lemma="2220" morph="HNcbsc/Sp3ms" id="23VcL">זְרֹע֖/וֹ</w> (9:20); <w lemma="c/2220" morph="HC/Ncbsc/Sp3ms" id="23PcK">וּ/זְרֹע֖/וֹ</w> (17:5); <w lemma="b/2220" morph="HR/Ncbsc" id="231ZG">בִּ/זְר֣וֹעַ</w> (44:12)'
  - where: opening
    claim: 'Thirteen of the seventeen are the Lord’s arm (30:30, 33:2, 40:10, 40:11, 51:5 twice, 51:9, 52:10, 53:1, 59:16, 62:8, 63:5, 63:12)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Isa.xml'
    quote: '<w lemma="2220" morph="HNcbsc" id="233ey">זְר֣וֹעַ</w> (52:10, after חָשַׂף); <w lemma="c/2220" morph="HC/Ncbsc" id="23Mza">וּ/זְר֥וֹעַ</w> (53:1); <w lemma="2220" morph="HNcbsc/Sp1cs" id="23UBq">זְרֹעִ֔/י</w> (63:5)'
  - where: opening
    claim: 'In 48:14 the verse does not say whose arm it is'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Isa.xml'
    quote: '<w lemma="c/2220" morph="HC/Ncbsc/Sp3ms" id="23cXU">וּ/זְרֹע֖/וֹ</w>'
  - where: opening
    claim: 'BDB: the Lord’s arm is an instrument of deliverance and judgment'
    key: bdb
    url: 'https://biblehub.com/hebrew/2220.htm'
    quote: 'Especially c. Yahweh''s arm as instrument of deliverance and judgment (often Deuteronomy, Jeremiah, Isa 2 , Psalms)'
  - where: opening
    claim: 'The Topical Guide entry “Arm” sends the reader to Might, Power, Strength'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/tg/arm?lang=eng'
    quote: 'See also Might; Power; Strength; Trust Not in the Arm of Flesh'
  - where: opening
    claim: 'The Church manuals read the arm as a symbol of power (D&C Student Manual)'
    key: dc-student-manual-2017-133
    url: 'https://www.churchofjesuschrist.org/study/manual/doctrine-and-covenants-student-manual-2017/chapter-53-doctrine-and-covenants-133?lang=eng'
    quote: 'In scripture the arm can be a symbol of strength and power. To “make bare his holy arm” is to reveal His strength and power.'
  - where: opening
    claim: 'In 30:30 the arm comes down on Assyria in anger and fire'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/30.htm'
    quote: 'Jehovah fights against Asshur with battles of swinging'
  - where: 'section “The arm Israel remembered”'
    claim: 'Deuteronomy pairs the arm with “stretched out” (4:34; 5:15; 26:8)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/4?lang=eng'
    quote: 'by a mighty hand, and by a stretched out arm'
  - where: 'section “The arm Israel remembered”'
    claim: 'Church footnote on “dried” (Isa. 51:10) points to Ex. 14:21'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/51?lang=eng'
    quote: 'Ex. 14:21 .'
  - where: 'section “The arm Israel remembered”'
    claim: 'Church footnote on “dividing” (Isa. 63:12) points to Ex. 14:21'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/63?lang=eng'
    quote: 'Ex. 14:21 ; Ps. 78:13 .'
  - where: 'section “The arm Israel remembered”'
    claim: 'From the exodus on, the strong arm is a symbol of the Lord’s strength and salvation'
    key: schade-bowen-arm-2015
    url: 'https://rsc.byu.edu/vol-16-no-2-2015/whom-arm-lord-revealed-part-1'
    quote: 'From the period of Israel’s exodus from Egypt, the “strong arm” became a symbol of the Lord’s “strength” and “salvation” (Exodus 15; Isaiah 12).'
  - where: 'section “The arm called on to wake”'
    claim: 'The ancient days of 51:9–10 refer to the exodus; the arm has already redeemed Israel once'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/51.htm'
    quote: 'The arm of Jehovah is able to accomplish what the prophecy affirms and the church hopes for; since it has already miraculously redeemed Israel once.'
  - where: 'section “The arm called on to wake”'
    claim: 'The arm is in a sleeping state; the church calls to it three times'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/51.htm'
    quote: 'His arm is now in a sleeping state. It is not lifeless, indeed, but motionless.'
  - where: 'section “The arm called on to wake”'
    claim: 'Seminary lesson reads 51:9 as the people pleading with the Lord'
    key: ot-seminary-lesson-130
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-material-2018/isaiah/lesson-130?lang=eng'
    quote: 'Explain that as recorded in Isaiah 51:9–10, Isaiah wrote that the Lord’s people were pleading with the Lord to “awake” (verse 9), or to use His power to help them as He had done in the past and fulfill His promises.'
  - where: 'section “The arm called on to wake”'
    claim: 'Old Testament Student Manual reads the call as from God to His latter-day children'
    key: ot-manual-17
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-17?lang=eng'
    quote: 'This call is from God to His latter-day children to return to Him and “come with singing unto Zion”'
  - where: 'section “The arm called on to wake”'
    claim: 'The call of 51:9 is addressed to Jerusalem in 52:1'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/52.htm'
    quote: 'The same call, which was addressed in Isaiah 51:9 to the arm of Jehovah that was then represented as sleeping, is here addressed to Jerusalem, which is represented as a sleeping woman.'
  - where: 'section “The arm called on to wake”'
    claim: 'Delitzsch: “the church” calls to the arm in 51:9'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/51.htm'
    quote: 'Therefore the church calls out to it three times, "Awake"'
  - where: 'section “The arm made bare”'
    claim: 'The image of a warrior baring his arm to fight'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/52.htm'
    quote: 'As a warrior is accustomed to make bare his right arm up to the shoulder, that he may fight without encumbrance'
  - where: 'section “The arm made bare”'
    claim: 'Church manuals: making the arm bare means showing His power to the whole world'
    key: bom-student-manual-6
    url: 'https://www.churchofjesuschrist.org/study/manual/book-of-mormon-student-manual/chapter-6-1-nephi-19-22?lang=eng'
    quote: 'The metaphor that God will make “bare his arm” means that God will show his power to the entire world.'
  - where: 'section “The arm made bare”'
    claim: 'Church manuals: to make bare the arm is to reveal His strength and power'
    key: dc-student-manual-2017-133
    url: 'https://www.churchofjesuschrist.org/study/manual/doctrine-and-covenants-student-manual-2017/chapter-53-doctrine-and-covenants-133?lang=eng'
    quote: 'To “make bare his holy arm” is to reveal His strength and power.'
  - where: 'section “The arm made bare”'
    claim: 'Delitzsch on 52:10: the arm had been concealed and seemed powerless'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/52.htm'
    quote: 'that arm which has been hitherto concealed and therefore has appeared to be powerless, and that in the sight of the whole world of nations'
  - where: 'section “The arm revealed: who has believed?”'
    claim: 'Church chapter heading of Isaiah 53 describes the servant’s humiliation and sufferings'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/53?lang=eng'
    quote: 'Isaiah speaks about the Messiah—His humiliation and sufferings are described'
  - where: 'section “The arm revealed: who has believed?”'
    claim: 'John 12 quotes Isa. 53:1 as fulfilled in the unbelief toward Jesus and says Isaiah saw His glory'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/12?lang=eng'
    quote: 'That the saying of Esaias the prophet might be fulfilled, which he spake, Lord, who hath believed our report? and to whom hath the arm of the Lord been revealed?'
  - where: 'section “The arm revealed: who has believed?”'
    claim: 'The priests question Abinadi to find something to accuse him of, quoting Isa. 52:7–10'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/12?lang=eng'
    quote: 'And they began to question him, that they might cross him, that thereby they might have wherewith to accuse him'
  - where: 'section “The arm revealed: who has believed?”'
    claim: 'Abinadi says God himself would come down and be oppressed and afflicted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/13?lang=eng'
    quote: 'Have they not said that God himself should come down among the children of men, and take upon him the form of man… and that he, himself, should be oppressed and afflicted?'
  - where: 'section “The arm revealed: who has believed?”'
    claim: 'Abinadi then quotes Isa. 53 (Mosiah 14:1)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/14?lang=eng'
    quote: 'Yea, even doth not Isaiah say: Who hath believed our report, and to whom is the arm of the Lord revealed?'
  - where: 'section “The arm revealed: who has believed?”'
    claim: 'Only afterward does Abinadi quote Isa. 52:8–10 (Mosiah 15:28–31)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/15?lang=eng'
    quote: 'Yea, Lord, thy watchmen shall lift up their voice… The Lord hath made bare his holy arm in the eyes of all the nations'
  - where: 'section “The arm revealed: who has believed?”'
    claim: 'Abinadi began where the priests left off'
    key: isaiah-in-bom
    url: 'https://scholarsarchive.byu.edu/cgi/viewcontent.cgi?article=1042&context=mi'
    quote: 'Beginning where the priests had left off when they asked him the meaning of Isaiah 52:7-10 (see Mosiah 12:21-24), Abinadi first paraphrased and interpreted the remaining verses in Isaiah 52'
  - where: 'section “The arm revealed: who has believed?”'
    claim: 'Abinadi put the priests’ passage back into its context (pp. 295–99)'
    key: isaiah-in-bom
    url: 'https://scholarsarchive.byu.edu/cgi/viewcontent.cgi?article=1042&context=mi'
    quote: 'The priests had taken Isaiah 52:7-10 out of context in accusing Abinadi; he averted their attack by putting that passage of scripture back into its surrounding context.'
  - where: 'section “The arm revealed: who has believed?”'
    claim: 'The arm made bare is Abinadi’s proof that salvation is in a person, not just the law'
    key: schade-bowen-arm-2015
    url: 'https://rsc.byu.edu/vol-16-no-2-2015/whom-arm-lord-revealed-part-1'
    quote: 'is Abinadi’s scriptural proof that “salvation” did not come from the law, but that the “salvation of . . . God” or the “redemption of God” would be “seen” by all nations, and this in a person, not just the law.'
  - where: 'section “The arm revealed: who has believed?”'
    claim: 'How Latter-day Saint writers read “the arm” in 53:1'
    key: isaiah-in-bom
    url: 'https://scholarsarchive.byu.edu/cgi/viewcontent.cgi?article=1042&context=mi'
    quote: 'The second question is often interpreted to mean that the arm of the Lord is revealed in the being of the mortal Messiah… Other LDS scholars believe the second question asks, “To whom has God revealed his priesthood, his gospel?”'
  - where: 'section “The arm revealed: who has believed?”'
    claim: 'Others read it as “To whom is the power or might of the Lord revealed?” (p. 496)'
    key: isaiah-in-bom
    url: 'https://scholarsarchive.byu.edu/cgi/viewcontent.cgi?article=1042&context=mi'
    quote: 'Ridges and Sperry understand this question to read, “Who sees God’s hand in things?” or “To whom is the power or might of the Lord revealed?”'
  - where: 'section “The arm revealed: who has believed?”'
    claim: 'The arm in 53:1 is the Lord’s might that effects the servant’s exaltation'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/53.htm'
    quote: 'who has recognised the omnipotence of Jehovah, which has set itself to effect his exaltation?'
