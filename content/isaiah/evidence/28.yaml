chapter: 28
claims:
- where: when
  claim: Chapters 28–33 fall before Samaria’s fall (Hezekiah’s early years)
  key: delitzsch
  url: https://biblehub.com/commentaries/kad/isaiah/28.htm
  quote: as Samaria has not yet been destroyed
- where: when
  claim: Judah’s leaders relied on Egypt’s help against Assyria
  key: delitzsch
  url: https://biblehub.com/commentaries/kad/isaiah/28.htm
  quote: not with confidence in Jehovah, however, but in reliance upon the help of Egypt
- where: setting
  claim: Chapters 28–33 are a cycle of woes, each address opening with hoi
  key: delitzsch
  url: https://biblehub.com/commentaries/kad/isaiah/28.htm
  quote: All the independent and self-contained addresses in this cycle of prophecy commence with hoi
- where: setting
  claim: Isaiah regards the Egyptian alliance as a breach of faith
  key: delitzsch
  url: https://biblehub.com/commentaries/kad/isaiah/28.htm
  quote: the true prophets regarded self-willed rebellion even against heathen rule as a reprehensible breach of faith
- where: note 28:1 “Samaria, a wreath on a drunkard’s head”
  claim: Samaria built by Omri, on a strong hill; taken only after a three-year siege
  key: bd-samaria
  url: https://www.churchofjesuschrist.org/study/scriptures/bd/samaria?lang=eng
  quote: a city built by Omri and made the capital of the kingdom of Israel. It occupied a strong position on a hill, and the Assyrians could not capture it until after a siege of three years
- where: note 28:1 “Samaria, a wreath on a drunkard’s head”
  claim: Ephraim’s jealousy split the kingdoms (Ephraim as the northern kingdom)
  key: bd-ephraim
  url: https://www.churchofjesuschrist.org/study/scriptures/bd/ephraim?lang=eng
  quote: It was Ephraim’s jealousy of Judah that in great measure brought about the separation of the two kingdoms
- where: note 28:1 “Samaria, a wreath on a drunkard’s head”
  claim: Assyria besieged Samaria for three years
  key: ot-manual-15
  url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-15?lang=eng
  quote: In 724 B.C., Shalmaneser, king of Assyria, besieged Samaria. The siege ended after three years with Sargon II finally carrying the ten tribes away into captivity.
- where: note 28:1 “Samaria, a wreath on a drunkard’s head”
  claim: 'The early-fig image: seen, picked and swallowed at once'
  key: delitzsch
  url: https://biblehub.com/commentaries/kad/isaiah/28.htm
  quote: whoever sees it looks at, and it is no sooner in his hand than he swallows it
- where: note 28:1 “Samaria, a wreath on a drunkard’s head”
  claim: 'Verse 1: the city is on the head of the fat valleys'
  key: lds-scriptures
  url: https://www.churchofjesuschrist.org/study/scriptures/ot/isa/28?lang=eng
  quote: which are on the head of the fat valleys of them that are overcome with wine!
- where: note 28:5 “The Lord Himself as a crown”
  claim: Peter speaks of a crown of glory that fadeth not away
  key: lds-scriptures
  url: https://www.churchofjesuschrist.org/study/scriptures/nt/1-pet/5?lang=eng
  quote: crown of glory that fadeth not away
- where: note 28:5 “The Lord Himself as a crown”
  claim: Paul speaks of a crown of righteousness
  key: lds-scriptures
  url: https://www.churchofjesuschrist.org/study/scriptures/nt/2-tim/4?lang=eng
  quote: laid up for me a crown of righteousness
- where: note 28:7 “Leaders who can’t see straight”
  claim: The law forbade priests to drink in the tabernacle
  key: lds-scriptures
  url: https://www.churchofjesuschrist.org/study/scriptures/ot/lev/10?lang=eng
  quote: Do not drink wine nor strong drink, thou, nor thy sons with thee, when ye go into the tabernacle of the congregation, lest ye die
- where: note 28:7 “Leaders who can’t see straight”
  claim: D&C 89:19 promises hidden treasures of knowledge
  key: lds-scriptures
  url: https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/89?lang=eng
  quote: shall find wisdom and great treasures of knowledge, even hidden treasures
- where: note 28:10 “Line upon line, and the mockers who said it first”
  claim: The Hebrew of verse 10 is short repeated syllables (ṣaw lāṣāw, qaw lāqāw, zeʿēr šām)
  key: oshb-wlc
  url: https://biblehub.com/interlinear/isaiah/28-10.htm
  quote: qawקַ֥וline
- where: note 28:10 “Line upon line, and the mockers who said it first”
  claim: 'Verse 9–10: the repeated short words, with the diminutive zeʿer, ridicule the prophet’s teaching as petty and babbling'
  key: delitzsch
  url: https://biblehub.com/commentaries/kad/isaiah/28.htm
  quote: The short words (tsâv, as in Hosea 5:11), together with the diminutive זעיר
- where: note 28:10 “Line upon line, and the mockers who said it first”
  claim: The repetition imitates the drunken scoffers’ babbling
  key: delitzsch
  url: https://biblehub.com/commentaries/kad/isaiah/28.htm
  quote: And in the repetition of the short words we may hear the heavy babbling language of the drunken scoffers.
- where: note 28:10 “Line upon line, and the mockers who said it first”
  claim: The Lord uses the phrase in the Book of Mormon
  key: lds-scriptures
  url: https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/28?lang=eng
  quote: I will give unto the children of men line upon line, precept upon precept, here a little and there a little
- where: note 28:11 “Another tongue”
  claim: The Assyrians would speak as barbarians, stammering in Judean ears
  key: delitzsch
  url: https://biblehub.com/commentaries/kad/isaiah/28.htm
  quote: by a people that stammered in their estimation, i.e., who talked as barbarians
- where: note 28:11 “Another tongue”
  claim: Paul quotes the verse about tongues
  key: lds-scriptures
  url: https://www.churchofjesuschrist.org/study/scriptures/nt/1-cor/14?lang=eng
  quote: With men of other tongues and other lips will I speak unto this people; and yet for all that will they not hear me, saith the Lord.
- where: note 28:12 “Rest for the weary”
  claim: The Lord had pointed them to the true way of rest and refreshing
  key: delitzsch
  url: https://biblehub.com/commentaries/kad/isaiah/28.htm
  quote: into the true way to rest and refreshing
- where: note 28:13 “When simple truth becomes a stumbling block”
  claim: Nephi pairs line upon line with its opposite
  key: lds-scriptures
  url: https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/28?lang=eng
  quote: I will give unto the children of men line upon line, precept upon precept, here a little and there a little
- where: note 28:15 “A covenant with death”
  claim: The covenant with death is the alliance with Egypt
  key: delitzsch
  url: https://biblehub.com/commentaries/kad/isaiah/28.htm
  quote: this self-confidence has for its secret reserve the alliance to be secretly entered into with Egypt against Assyria
- where: note 28:15 “A covenant with death”
  claim: 'Another reading: a pact with the gods of the underworld'
  key: ot-manual-15
  url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-15?lang=eng
  quote: In contrast to this act of panic by the rulers, Isaiah declares that faith in God is the only secure foundation of Zion’s security
- where: note 28:16 “The tried and precious cornerstone”
  claim: “Tried” means a stone of proving
  key: delitzsch
  url: https://biblehub.com/commentaries/kad/isaiah/28.htm
  quote: This stone is called 'ebhen boochan, a stone of proving, i.e., a proved and self-proving stone.
- where: note 28:16 “The tried and precious cornerstone”
  claim: “Shall not make haste” means will not flee, will stand firm
  key: delitzsch
  url: https://biblehub.com/commentaries/kad/isaiah/28.htm
  quote: whoever believes will not have to move
- where: note 28:16 “The tried and precious cornerstone”
  claim: The cornerstone is Jesus Christ
  key: ot-manual-15
  url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-15?lang=eng
  quote: The tried and precious cornerstone is Jesus Christ Himself.
- where: note 28:16 “The tried and precious cornerstone”
  claim: The Septuagint renders it “shall by no means be ashamed”
  key: lxx-rahlfs
  url: https://biblehub.com/sep/isaiah/28.htm
  quote: and he that believes on him shall by no means be ashamed.
- where: note 28:16 “The tried and precious cornerstone”
  claim: 'Delitzsch: “he that believeth will not flee,” i.e. will stand firm'
  key: delitzsch
  url: https://biblehub.com/commentaries/kad/isaiah/28.htm
  quote: '"he that believeth will not flee," i.e., will stand firm'
- where: note 28:17 “The measuring line and the plumb line”
  claim: Verse 17 uses qaw (“line”) for the measuring line of justice
  key: oshb-wlc
  url: https://biblehub.com/interlinear/isaiah/28-17.htm
  quote: lə·qāw,לְקָ֔וthe
- where: note 28:17 “The measuring line and the plumb line”
  claim: The line in verse 17 plays on verse 10
  key: delitzsch
  url: https://biblehub.com/commentaries/kad/isaiah/28.htm
  quote: A different turn, however, is given to qâv, with a play upon Isaiah 28:10
- where: note 28:17 “The measuring line and the plumb line”
  claim: The verse alludes to the building trades; a plumb bob is a weight on a cord giving a true vertical
  key: ot-manual-15
  url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-15?lang=eng
  quote: A builder uses a plumb bob to find a straight vertical line. The plumb bob is a weight attached to a cord that, when extended, hangs perpendicular to its beginning point.
- where: note 28:20 “A bed too short, a blanket too narrow”
  claim: The figure was probably proverbial; applied to the Egyptian treaty
  key: delitzsch
  url: https://biblehub.com/commentaries/kad/isaiah/28.htm
  quote: in a figure which was probably proverbial
- where: note 28:21 “His strange act”
  claim: Perazim and Gibeon were David’s defeats of the Philistines
  key: delitzsch
  url: https://biblehub.com/commentaries/kad/isaiah/28.htm
  quote: The allusion really is to the two shameful defeats which David inflicted upon the Philistines.
- where: note 28:21 “His strange act”
  claim: The Lord acts against His own people as once against their foes
  key: delitzsch
  url: https://biblehub.com/commentaries/kad/isaiah/28.htm
  quote: He would have to act towards His own people as He once acted towards their foes.
- where: note 28:21 “His strange act”
  claim: 'Gibeon: the second victory over the Philistines'
  key: lds-scriptures
  url: https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/14?lang=eng
  quote: from Gibeon even to Gazer
- where: note 28:21 “His strange act”
  claim: D&C 101:95 quotes the phrase
  key: lds-scriptures
  url: https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/101?lang=eng
  quote: my act, my strange act, and perform my work, my strange work, that men may discern between the righteous and the wicked
- where: note 28:24 “The parable of the farmer”
  claim: 'The parable: the divine Teacher punishes in order to bless, and does not crush'
  key: delitzsch
  url: https://biblehub.com/commentaries/kad/isaiah/28.htm
  quote: Jehovah punishes, but it is in order that He may be able to bless. He sifts, but He does not destroy.
- where: note 28:24 “The parable of the farmer”
  claim: Isa. 27:8, discipline in measure
  key: lds-scriptures
  url: https://www.churchofjesuschrist.org/study/scriptures/ot/isa/27?lang=eng
  quote: In measure, when it shooteth forth, thou wilt debate with it
- where: note 28:28 “Threshing, but not forever”
  claim: He does not thresh forever; they are never crushed
  key: delitzsch
  url: https://biblehub.com/commentaries/kad/isaiah/28.htm
  quote: when He threshes, they may console themselves in the face of the approaching period of judgment, that they are never crushed or injured
- where: note 28:28 “Threshing, but not forever”
  claim: D&C 121:7
  key: lds-scriptures
  url: https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/121?lang=eng
  quote: thine adversity and thine afflictions shall be but a small moment
- where: note 28:29 “Wonderful in counsel”
  claim: Isa. 9:6 names the child Wonderful, Counsellor
  key: lds-scriptures
  url: https://www.churchofjesuschrist.org/study/scriptures/ot/isa/9?lang=eng
  quote: and his name shall be called Wonderful, Counsellor, The mighty God, The everlasting Father, The Prince of Peace
