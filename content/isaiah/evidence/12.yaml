# Evidence ledger for Isaiah 12 (audit, 2026-10-01)
chapter: 12
claims:
  - where: 'setting'
    claim: 'Isaiah 1 opens with the Lord charging a rebellious people'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/1?lang=eng'
    quote: 'I have nourished and brought up children, and they have rebelled against me.'
  - where: 'setting'
    claim: 'Moses and Israel sang a song after the Red Sea deliverance'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/15?lang=eng'
    quote: 'Then sang Moses and the children of Israel this song unto the Lord, and spake, saying, I will sing unto the Lord, for he hath triumphed gloriously'
  - where: 'setting'
    claim: 'Isaiah 12 as a song of the second redemption, echoing Israel at the Red Sea'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/12.htm'
    quote: 'As Israel, when redeemed from Egypt beyond the Red Sea, sang songs of praise, so also will the Israel of the second redemption'
  - where: 'setting'
    claim: 'Nephi quotes Isaiah 12 as 2 Nephi 22; the chapter heading reads it as a millennial day of praise'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/22?lang=eng'
    quote: 'In the millennial day all men will praise the Lord—He will dwell among them—Compare Isaiah 12.'
  - where: 'setting'
    claim: 'Nephi goes on to Isaiah 13–14 in 2 Nephi 23–24'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/23?lang=eng'
    quote: 'Babylon (the world) will fall forever—Compare Isaiah 13.'
  - where: 'thread'
    claim: 'Isaiah 12 has two stanzas, a first of six lines and a second of seven, each beginning “in that day … say”'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/12.htm'
    quote: 'The first song of six lines is here followed by a second of seven lines'
  - where: 'thread'
    claim: 'The Hebrew yeshuʿah (salvation) occurs in verse 2 (twice: yeshuʿati, and lishuʿah) and verse 3'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Isa.xml'
    quote: 'יְשׁוּעָתִ֛/י'
  - where: 'thread'
    claim: 'Isaiah’s name means “The Lord is salvation”'
    key: bd-isaiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/isaiah?lang=eng'
    quote: 'The Lord is salvation. Son of Amoz, a prophet in Jerusalem during 40 years'
  - where: 'thread'
    claim: 'Jesus is the Greek form of Joshua or Jeshua, “Savior”'
    key: bd-jesus
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jesus?lang=eng'
    quote: 'The Greek form of the name Joshua or Jeshua, “God is help” or “Savior.”'
  - where: 'note 12:1 “The refrain answered”'
    claim: 'The refrain “his anger is not turned away, but his hand is stretched out still” recurs in chapters 5–10'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/10?lang=eng'
    quote: 'For all this his anger is not turned away, but his hand is stretched out still.'
  - where: 'note 12:1 “The refrain answered”'
    claim: 'The verb in Isa 12:1 (“comfortedst me”) is from the same root nacham as Isa 40:1 “Comfort ye”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Isa.xml'
    quote: 'וּֽ/תְנַחֲמֵֽ/נִי׃'
  - where: 'note 12:1 “The refrain answered”'
    claim: 'Isa 40:1 opens with the same root (nachamu, “Comfort ye”)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Isa.xml'
    quote: 'נַחֲמ֥וּ'
  - where: 'note 12:1 “The refrain answered”'
    claim: 'Ps. 30:5 and Isa. 40:1 wording as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/30?lang=eng'
    quote: 'weeping may endure for a night, but joy cometh in the morning'
  - where: 'note 12:2 “Singing the Savior’s name”'
    claim: 'Hebrew yeshuʿah means salvation'
    key: bdb
    url: 'https://biblehub.com/hebrew/3444.htm'
    quote: 'noun feminine salvation'
  - where: 'note 12:2 “Singing the Savior’s name”'
    claim: 'Isaiah’s name means “The Lord is salvation”'
    key: bd-isaiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/isaiah?lang=eng'
    quote: 'The Lord is salvation. Son of Amoz, a prophet in Jerusalem during 40 years'
  - where: 'note 12:2 “Singing the Savior’s name”'
    claim: 'Jesus is the Greek form of Joshua or Jeshua, “Savior”'
    key: bd-jesus
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jesus?lang=eng'
    quote: 'The Greek form of the name Joshua or Jeshua, “God is help” or “Savior.”'
  - where: 'note 12:2 “Singing the Savior’s name”'
    claim: 'The word yeshuʿah appears in Isa 12:2 and again in 12:3'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Isa.xml'
    quote: 'מִ/מַּעַיְנֵ֖י'
  - where: 'note 12:2 “Singing the Savior’s name”'
    claim: 'Angel told Joseph to call his name JESUS'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/1?lang=eng'
    quote: 'thou shalt call his name JESUS: for he shall save his people from their sins'
  - where: 'note 12:2 “Ahaz’s lesson, finally learned”'
    claim: 'Ahaz sent to Tiglath-pileser of Assyria for help'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/16?lang=eng'
    quote: 'So Ahaz sent messengers to Tiglath-pileser king of Assyria, saying, I am thy servant and thy son: come up, and save me'
  - where: 'note 12:2 “Ahaz’s lesson, finally learned”'
    claim: 'Isaiah told Ahaz “let him be your fear”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/8?lang=eng'
    quote: 'let him be your fear, and let him be your dread'
  - where: 'note 12:2 “Quoting Moses at the Red Sea”'
    claim: 'Exodus 15:2 reads almost identically; Psalm 118:14 has the same words'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/15?lang=eng'
    quote: 'The Lord is my strength and song, and he is become my salvation'
  - where: 'note 12:2 “Quoting Moses at the Red Sea”'
    claim: 'Isaiah 12:2 is an echo of Exodus 15:2 (also behind Ps. 118:14)'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/12.htm'
    quote: 'Isaiah 12:2 is the echo of Exodus 15:2 (on which Psalm 118:14 is also founded)'
  - where: 'note 12:2 “Quoting Moses at the Red Sea”'
    claim: 'The doubling of the divine name is read as the antitype surpassing the type'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/12.htm'
    quote: 'One thing peculiar to this echo of Exodus 15:2 is the doubling of the Jah'
  - where: 'note 12:2 “Quoting Moses at the Red Sea”'
    claim: 'The Hebrew in Isa 12:2 reads Yah YHWH'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Isa.xml'
    quote: 'יָ֣הּ'
  - where: 'note 12:2 “Quoting Moses at the Red Sea”'
    claim: 'The KJV usually prints the divine name as Lord in small capitals; Isa. 12:2 is among the places listed under Jehovah'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'In the KJV, the Jewish custom has been followed, and the name is generally denoted by Lord or God, printed in small capitals.'
  - where: 'note 12:3 “Wells of salvation”'
    claim: 'As Israel was supplied with water in the desert, God will open many sources of salvation'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/12.htm'
    quote: 'Just as Israel was miraculously supplied with water in the desert, so will the God of salvation'
  - where: 'note 12:3 “Wells of salvation”'
    claim: 'John places Jesus’s invitation on the last day of the Feast of Tabernacles'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/7?lang=eng'
    quote: 'In the last day, that great day of the feast, Jesus stood and cried, saying, If any man thirst, let him come unto me, and drink.'
  - where: 'note 12:4 “A song for the whole world”'
    claim: 'Ammon’s words in Alma 26:16'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/26?lang=eng'
    quote: 'who can glory too much in the Lord? Yea, who can say too much of his great power, and of his mercy?'
  - where: 'note 12:6 “The Holy One in the midst”'
    claim: 'Isa 1:4 says Israel provoked the Holy One of Israel to anger'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/1?lang=eng'
    quote: 'they have provoked the Holy One of Israel unto anger'
  - where: 'note 12:6 “The Holy One in the midst”'
    claim: 'Ezekiel ends with the city named “The Lord is there”; D&C 45:59 promises the Lord in their midst'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/45?lang=eng'
    quote: 'For the Lord shall be in their midst, and his glory shall be upon them, and he will be their king and their lawgiver.'
  - where: 'christ'
    claim: 'The Feast of Tabernacles setting of John 7:37'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/7?lang=eng'
    quote: 'Now the Jews’ feast of tabernacles was at hand.'
