chapter: 34
claims:
  - where: when
    claim: 'The chapter describes the last days / Second Coming'
    key: ot-manual-15
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-15?lang=eng'
    quote: 'The Second Coming of Christ will be a day of vengeance and recompense.'
  - where: setting
    claim: 'Edom descended from Esau and lay south of the Dead Sea'
    key: bd-edom
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/edom?lang=eng'
    quote: 'This country lay south of the Dead Sea, having Moab on the north and the Dead Sea on the northwest.'
  - where: setting
    claim: 'Israel and Edom had a long history of hostility'
    key: bd-edom
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/edom?lang=eng'
    quote: 'In spite of the kinship there seems to have been great mutual hatred, and wars were of constant occurrence'
  - where: setting
    claim: 'Edom stood aside and joined in when Jerusalem was taken (condemned in Obadiah)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/obad/1?lang=eng'
    quote: 'In the day that thou stoodest on the other side, in the day that the strangers carried away captive his forces, and foreigners entered into his gates, and cast lots upon Jerusalem'
  - where: setting
    claim: 'Edom stands for the nations / the world (Idumea, D&C 1:36)'
    key: bd-idumea
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/idumea?lang=eng'
    quote: 'Edom. Isa. 34:5–6; Ezek. 35:15; 36:5; Mark 3:8. In D&C 1:36 Idumea is used to represent the world.'
  - where: note 34:1 “A summons to the whole world”
    claim: 'D&C 1:1 opens with the same kind of call to the whole world'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/1?lang=eng'
    quote: 'Hearken, O ye people of my church, saith the voice of him who dwells on high, and whose eyes are upon all men; yea, verily I say: Hearken ye people from afar'
  - where: note 34:4 “The heavens rolled up like a scroll”
    claim: 'Latter-day reading ties Isa. 34:4 to D&C 88:95 and the Second Coming'
    key: ot-manual-15
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-15?lang=eng'
    quote: 'the curtain of heaven shall be unfolded, as a scroll is unfolded after it is rolled up, and the face of the Lord shall be unveiled'
  - where: note 34:5 “Idumea, or the world”
    claim: 'Idumea is the later name of Edom (from the Maccabees)'
    key: bd-edom
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/edom?lang=eng'
    quote: 'From the time of the Maccabees it was known as Idumea.'
  - where: note 34:5 “Idumea, or the world”
    claim: 'Latter-day Saints read Idumea as the world, the judgment at the Second Coming'
    key: ot-manual-15
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-15?lang=eng'
    quote: 'the term Idumea is one that the Lord uses to mean the world.'
  - where: note 34:5 “Idumea, or the world”
    claim: 'Esau sold his birthright for one morsel of meat'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/12?lang=eng'
    quote: 'Lest there be any fornicator, or profane person, as Esau, who for one morsel of meat sold his birthright.'
  - where: note 34:6 “A sacrifice in Bozrah”
    claim: 'D&C 133 presents the one in red garments as the Lord at His coming and uses the day of vengeance'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/133?lang=eng'
    quote: 'for this was the day of vengeance which was in my heart.'
  - where: note 34:7 “What is a unicorn doing in Isaiah?”
    claim: 'reʾem means wild ox; the Latin has unicornis, the Greek monokerōs elsewhere but a different word in Isa. 34:7; the princes of Edom'
    key: bdb
    url: 'https://biblehub.com/hebrew/7214.htm'
    quote: 'wild ox (Assyrian rêmu'
  - where: note 34:7 “What is a unicorn doing in Isaiah?”
    claim: 'Greek monokerōs (elsewhere), Isa. 34:7 Greek ἅδροι, Latin unicornis; figurative of princes of Edom'
    key: bdb
    url: 'https://biblehub.com/hebrew/7214.htm'
    quote: 'ᵐ5 (erroneous) μονοκέρως (Isaiah 34:7 ἅδροι, ᵑ9 unicornis'
  - where: note 34:7 “What is a unicorn doing in Isaiah?”
    claim: 'The wild ox is figurative of the princes of Edom in Isa. 34:7'
    key: bdb
    url: 'https://biblehub.com/hebrew/7214.htm'
    quote: 'figurative of princes of Edom Isaiah 34:7'
  - where: note 34:8 “The day of vengeance”
    claim: 'Luke 4 stops Isa. 61:2 after the acceptable year and closes the book'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/4?lang=eng'
    quote: 'To preach the acceptable year of the Lord.'
  - where: note 34:8 “The day of vengeance”
    claim: 'Isa. 61:2 continues with the day of vengeance'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/61?lang=eng'
    quote: 'To proclaim the acceptable year of the Lord, and the day of vengeance of our God'
  - where: note 34:8 “The day of vengeance”
    claim: 'rîb can mean dispute, controversy, case at law'
    key: bdb
    url: 'https://biblehub.com/hebrew/7379.htm'
    quote: 'especially dispute, controversy, case at law'
  - where: note 34:11 “Creation in reverse”
    claim: 'tohu with bohu occurs in Gen. 1:2, Jer. 4:23 and Isa. 34:11'
    key: bdb
    url: 'https://biblehub.com/hebrew/8414.htm'
    quote: 'formlessness, of primaeval earth Genesis 1:2 (P), of land reduced to primaeval chaos Jeremiah 4:23 (both + וָבֹהוּ and voidness), Isaiah 34:11'
  - where: note 34:14 “The screech owl”
    claim: 'lilit occurs only in Isa. 34:14; BDB glosses it as a female night-demon; link to night perhaps only apparent'
    key: bdb
    url: 'https://biblehub.com/hebrew/3917.htm'
    quote: 'name of a female night-demon haunting desolate Edom; probably borrowed from Babylonian, Isaiah 34:14'
  - where: note 34:14 “The screech owl”
    claim: 'Connection of lilit with the word for night perhaps only apparent'
    key: bdb
    url: 'https://biblehub.com/hebrew/3917.htm'
    quote: 'Connexion with לילה perhaps only apparent, a popular etymology'
  - where: note 34:14 “The screech owl”
    claim: 'saʿir is ordinarily a he-goat; in Isa. 34:14 BDB gives satyr, demon'
    key: bdb
    url: 'https://biblehub.com/hebrew/8163.htm'
    quote: 'III. שָׂעִיר  noun masculine satyr, demon (with he-goat''s form, or feet; Late Hebrew id.'
  - where: note 34:14 “The screech owl”
    claim: 'saʿir ordinary sense he-goat'
    key: bdb
    url: 'https://biblehub.com/hebrew/8163.htm'
    quote: 'he-goat, buck (hairy one; Late Hebrew id.)'
  - where: note 34:14 “The screech owl”
    claim: 'NIV renders lilit "night creatures" and saʿir "wild goats"'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Isaiah+34&version=NIV'
    quote: 'and wild goats will bleat to each other'
  - where: note 34:14 “The screech owl”
    claim: 'NIV renders lilit "night creatures"'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Isaiah+34&version=NIV'
    quote: 'the night creatures(AU) will also lie down'
  - where: note 34:16 “Seek ye out of the book of the Lord”
    claim: 'The Lord commands searching the scriptures'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/5?lang=eng'
    quote: 'Search the scriptures; for in them ye think ye have eternal life'
  - where: note 34:17 “Dividing the land by lot”
    claim: 'Joshua divided the land by casting lots'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/18?lang=eng'
    quote: 'And Joshua cast lots for them in Shiloh before the Lord: and there Joshua divided the land unto the children of Israel according to their divisions.'
  - where: section 1 plain
    claim: 'Plain-words rendering follows the NIV'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Isaiah+34&version=NIV'
    quote: 'the heavens rolled up(M) like a scroll'
  - where: section 2 plain
    claim: 'Plain-words rendering follows the NIV'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Isaiah+34&version=NIV'
    quote: 'For the Lord has a sacrifice(T) in Bozrah(U)'
  - where: section 3 plain
    claim: 'Plain-words rendering follows the NIV'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Isaiah+34&version=NIV'
    quote: 'a haunt for jackals,(AQ)'
  - where: christ
    claim: 'Isa. 63:1 Edom/Bozrah; Isa. 61:2 and Luke 4 as above'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/4?lang=eng'
    quote: 'To preach the acceptable year of the Lord.'
