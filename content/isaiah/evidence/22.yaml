  - where: note 22:22 “The key of David”
    claim: The key of the house of David is a symbol of the right to rule, held through priesthood, centered in Christ
    key: ot-manual-14
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-14?lang=eng
    quote: The key of the house of David, the right to rule, was a symbol for the real right to rule, which is only enjoyed through the holy priesthood of God.
  - where: note 22:22 “The key of David”
    claim: Christ says he hath the key of David
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/nt/rev/3?lang=eng
    quote: he that hath the key of David, he that openeth, and no man shutteth; and shutteth, and no man openeth;
  - where: note 22:22 “The key of David”
    claim: Seal and loose given to Nephi
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/bofm/hel/10?lang=eng
    quote: that whatsoever ye shall seal on earth shall be sealed in heaven; and whatsoever ye shall loose on earth shall be loosed in heaven
  - where: note 22:22 “The key of David”
    claim: Nephi sealed the heavens as Elijah did; seal and loose can mean close and open
    key: sc-knowhy-182
    url: https://scripturecentral.org/knowhy/how-did-nephi-use-the-power-to-seal-on-earth-and-in-heaven
