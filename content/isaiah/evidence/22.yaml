# Evidence ledger for Isaiah 22 (audit, 2026-10-01)
chapter: 22
claims:
  - where: when
    claim: Isaiah 22 is set around Sennacherib’s invasion, c. 701 BC
    key: bd-hezekiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/hezekiah?lang=eng
    quote: The second, under Sennacherib, is more fully described in 2 Kgs. 18:13–19:7.
  - where: when
    claim: Hezekiah’s Tunnel was built about 701 BC against Sennacherib
    key: bd-hezekiahs-tunnel
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/hezekiahs-tunnel?lang=eng
    quote: The tunnel was built in the days of Hezekiah, about 701 B.C., as a defense against possible attack from the Assyrian army under Sennacherib
  - where: setting
    claim: Isaiah 22 follows the pronouncements on the nations (13–21) with one for Jerusalem; the valley of vision is Jerusalem
    key: ot-manual-14
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-14?lang=eng
    quote: following the pronouncements on the world, a pronouncement was added for Jerusalem, who had become part of the world.
  - where: setting
    claim: Measures in verses 8–11 are of the kind Hezekiah took (arsenal, wall, water)
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/32?lang=eng
    quote: Also he strengthened himself, and built up all the wall that was broken, and raised it up to the towers, and another wall without, and repaired Millo in the city of David
  - where: note 22:1 “The valley of vision”
    claim: The valley of vision is Jerusalem, Isaiah’s home and place of visions
    key: ot-manual-14
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-14?lang=eng
    quote: Because it was his home, and therefore the place where he received his visions and revelations, it is not surprising that he would call it the place of vision.
  - where: note 22:1 “Celebrating on the rooftops”
    claim: Roofs were flat and people could gather on them
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/judg/16?lang=eng
    quote: there were upon the roof about three thousand men and women, that beheld while Samson made sport.
  - where: note 22:1 “Celebrating on the rooftops”
    claim: 'One reading: from the flat housetops they look out at the approaching army, sure of victory'
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/22.htm
    quote: From the flat house-tops they all look out together at the approaching army of the foe, longing for battle, and sure of victory
  - where: note 22:4 “Weeping while others celebrate”
    claim: Isaiah’s words are the note of lament continued in Jeremiah
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/22.htm
    quote: The note struck by Isaiah here is the note of the kinah that is continued in the Lamentations of Jeremiah.
  - where: note 22:4 “Weeping while others celebrate”
    claim: Jeremiah weeps for the daughter of my people
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/jer/9?lang=eng
    quote: Oh that my head were waters, and mine eyes a fountain of tears, that I might weep day and night for the slain of the daughter of my people!
  - where: note 22:4 “Weeping while others celebrate”
    claim: Jesus wept over Jerusalem as the disciples rejoiced
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/nt/luke/19?lang=eng
    quote: whole multitude of the disciples began to rejoice and praise God with a loud voice for all the mighty works that they had seen;
  - where: note 22:8 “The House of the Forest”
    claim: Solomon’s house of the forest of Lebanon had cedar pillars
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/7?lang=eng
    quote: He built also the house of the forest of Lebanon; the length thereof was an hundred cubits, and the breadth thereof fifty cubits, and the height thereof thirty cubits, upon four rows of cedar pillars
  - where: note 22:8 “The House of the Forest”
    claim: Solomon’s gold vessels/shields kept in it
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/10?lang=eng
    quote: all the vessels of the house of the forest of Lebanon were of pure gold
  - where: note 22:8 “The House of the Forest”
    claim: It was built by Solomon for storing and displaying arms
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/22.htm
    quote: built by Solomon upon Zion for the storing and display of valuable arms and utensils
  - where: note 22:11 “Hezekiah’s water system”
    claim: Tunnel about 1770 feet through limestone bringing Gihon inside the walls to Siloam as defense
    key: bd-hezekiahs-tunnel
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/hezekiahs-tunnel?lang=eng
    quote: An elaborate engineering scheme extending about 1770 feet through limestone rock, bringing the waters of Gihon spring inside the walls of Jerusalem to the pool of Siloam.
  - where: note 22:11 “Hezekiah’s water system”
    claim: Workmen dug from both ends; inscription tells of their meeting; tunnel still in use
    key: bd-hezekiahs-tunnel
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/hezekiahs-tunnel?lang=eng
    quote: Workmen dug from both ends, in a zig-zag course, until they met. A dramatic account of the meeting of the workmen is told by an inscription carved in stone near the Siloam end of the tunnel.
  - where: note 22:11 “Hezekiah’s water system”
    claim: The tunnel is still in use
    key: bd-hezekiahs-tunnel
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/hezekiahs-tunnel?lang=eng
    quote: The tunnel is still in use today.
  - where: note 22:11 “Hezekiah’s water system”
    claim: Hezekiah stopped the upper watercourse of Gihon
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/32?lang=eng
    quote: brought it straight down to the west side of the city of David.
  - where: note 22:11 “The key verse”
    claim: The verb for “looked” in verse 8 is nabat (Strong’s 5027)
    key: biblehub-interlinear
    url: https://biblehub.com/interlinear/isaiah/22-8.htm
    quote: And You looked
  - where: note 22:11 “The key verse”
    claim: The same verb nabat (5027) in verse 11
    key: biblehub-interlinear
    url: https://biblehub.com/interlinear/isaiah/22-11.htm
    quote: did you⁺ look
  - where: section 2 plain
    claim: “Uncovered the covering of Judah” rendered as defenses stripped away
    key: biblehub-interlinear
    url: https://biblehub.com/interlinear/isaiah/22-8.htm
    quote: He has uncovered the defenses of Judah.
  - where: note 22:13 “Eat, drink, for tomorrow we die”
    claim: The people indulged their passions rather than repent
    key: ot-manual-14
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-14?lang=eng
    quote: As is typical of the wicked in a time of crisis, they would prefer to indulge their passions than to repent
  - where: note 22:13 “Eat, drink, for tomorrow we die”
    claim: Paul quotes the line
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/nt/1-cor/15?lang=eng
    quote: let us eat and drink; for to morrow we die.
  - where: note 22:13 “Eat, drink, for tomorrow we die”
    claim: Nephi foresees the same saying in the last days
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/28?lang=eng
    quote: Eat, drink, and be merry, for tomorrow we die; and it shall be well with us.
  - where: note 22:15 “A proud steward and his tomb”
    claim: Eliakim was master of Hezekiah’s household
    key: bd-eliakim
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/eliakim?lang=eng
    quote: Son of Hilkiah and master of Hezekiah’s household
  - where: note 22:15 “A proud steward and his tomb”
    claim: The steward’s office was closely connected with that of the king
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/22.htm
    quote: shows how very closely the office forfeited by Shebna was connected with that of the king.
  - where: note 22:15 “A proud steward and his tomb”
    claim: Shebna was proud and wicked
    key: ot-manual-14
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-14?lang=eng
    quote: Shebna, a leading official in the royal courts of Judah, had become proud and wicked
  - where: note 22:15 “A proud steward and his tomb”
    claim: Later Shebna is “scribe” with Eliakim over the household
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/isa/36?lang=eng
    quote: Then came Eliakim, the son of Hilkiah, that was over the household, and Shebna the scribe
  - where: note 22:18 “Tossed like a ball”
    claim: Shebna hurled into a land far and wide, to die there
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/22.htm
    quote: Coiling, He coileth thee a coil, a ball into a land far and wide; there shalt thou die
  - where: note 22:18 “Tossed like a ball”
    claim: Parable of the rich man
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/nt/luke/12?lang=eng
    quote: Thou fool, this night thy soul shall be required of thee
  - where: note 22:22 “The key of David”
    claim: The key is placed on the shoulder because it was properly the king’s
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/22.htm
    quote: This key was properly handled by the king (Revelation 3:7), and therefore by the "house-mayor" only in his stead.
  - where: note 22:22 “The key of David”
    claim: The key signifies the power of the keys, placed on the shoulder
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/22.htm
    quote: The "key" signifies the power of the keys; and for this reason it is not given into Eliakim's hand, but placed upon his shoulder
  - where: note 22:22 “The key of David”
    claim: Power of keys included deciding who was received into the king’s service
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/22.htm
    quote: the decision who was and who was not to be received into the king's service.
  - where: note 22:22 “The key of David”
    claim: Rev. 3:7 quotes Isa. 22:22; Eliakim a typological foreshadowing
    key: sc-knowhy-348
    url: https://scripturecentral.org/knowhy/how-do-the-bible-and-book-of-mormon-help-us-understand-the-sealing-power
