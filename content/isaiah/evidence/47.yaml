# Evidence ledger for Isaiah 47 (audit, 2026-09-30)
chapter: 47
claims:
  - where: when
    claim: Babylon fell to Cyrus in 539 BC
    key: livius-babylon
    url: https://www.livius.org/articles/place/babylon/
    quote: Even when the Babylonian Empire had been conquered by the Persian king Cyrus the Great (539), Babylon remained a splendid city.
  - where: setting
    claim: Isaiah was told to take up a proverb against the king of Babylon (Isa. 14)
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/isa/14?lang=eng
    quote: That thou shalt take up this proverb against the king of Babylon, and say, How hath the oppressor ceased!
  - where: setting
    claim: Nebuchadnezzar made Babylon his capital and built an enormous city
    key: bd-babylon
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/babylon?lang=eng
    quote: After the downfall of Assyria, Babylon became Nebuchadnezzar’s capital. He built an enormous city of which the ruins still remain.
  - where: setting
    claim: Babylon was the capital of the ancient Near East and Nebuchadnezzar is credited with rebuilding it, including the blue walls and Ishtar Gate
    key: livius-babylon
    url: https://www.livius.org/articles/place/babylon/
    quote: is credited with rebuilding his capital as the most splendid city in the Near East. The famous blue walls and Ištar Gate are an example.
  - where: setting
    claim: Esagila is the temple of Marduk
    key: livius-babylon
    url: https://www.livius.org/articles/place/babylon/
    quote: The famous temple of Marduk, Esagila, and its ziggurat, Etemenanki
  - where: setting
    claim: Etemenanki means "House of the foundation of heaven on earth" and is also known as the Tower of Babel
    key: livius-etemenanki
    url: https://www.livius.org/articles/place/babylon/etemenanki/
    quote: name of the large temple tower in Babylon, also known as the Tower of Babel. Its Sumerian name E-temen-an-ki means "House of the foundation of heaven on earth".
  - where: setting
    claim: Babylon was the birthplace of astrology and the home of magic
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/47.htm
    quote: Babylonia was the birth-place of astrology, from which sprang the twelve-fold division of the day, the horoscope and sun-dial (Herod. ii. 109); but it was also the home of magic
  - where: setting
    claim: Cyrus's army entered Babylon without battle in 539
    key: livius-abc7
    url: https://www.livius.org/sources/content/mesopotamian-chronicles-content/abc-7-nabonidus-chronicle/
    quote: On the sixteenth day, Ugbaru, governor of Gutium, and the army of Cyrus, without battle
  - where: setting
    claim: The fall came within days (Sippar taken on the 14th, Babylon entered on the 16th)
    key: livius-abc7
    url: https://www.livius.org/sources/content/mesopotamian-chronicles-content/abc-7-nabonidus-chronicle/
    quote: On the fourteenth day Sippar was captured without a battle.
  - where: setting
    claim: Babylon remained important under Persians, Alexander and the Seleucids, then declined
    key: livius-babylon
    url: https://www.livius.org/articles/place/babylon/
    quote: Alexander the Great and the Seleucid kings respected the city, but after the mid-second century, the city's decline started.
  - where: setting
    claim: Trajan was disappointed by the ruins in AD 116–117
    key: livius-babylon
    url: https://www.livius.org/articles/place/babylon/
    quote: When the Roman emperor Trajan invaded Babylonia in 116-117, he was disappointed by the ruins.
