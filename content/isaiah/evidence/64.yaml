chapter: 64
claims:
  - where: setting
    claim: The Babylonians captured Jerusalem in 587 BC
    key: bible-chron-ot
    url: https://www.churchofjesuschrist.org/study/scriptures/bible-chron/old-testament?lang=eng
    quote: 587 | Capture of Jerusalem | 587
  - where: setting
    claim: Isaiah's ministry began about 740 BC, so the capture came more than a century after he began to prophesy
    key: bible-chron-ot
    url: https://www.churchofjesuschrist.org/study/scriptures/bible-chron/old-testament?lang=eng
    quote: Isaiah begins to prophesy.
  - where: setting
    claim: The revelation quoting Isaiah 63–64 (D&C 133) was given in November 1831
    key: dc-133-heading
    url: https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/133?lang=eng
    quote: Revelation given through Joseph Smith the Prophet, at Hiram, Ohio, November 3, 1831.
  - where: when
    claim: The temple's destruction dated 587 BC
    key: bible-chron-ot
    url: https://www.churchofjesuschrist.org/study/scriptures/bible-chron/old-testament?lang=eng
    quote: 587 | Capture of Jerusalem | 587
  - where: when
    claim: D&C 133 dated 1831
    key: dc-133-heading
    url: https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/133?lang=eng
    quote: on the 3rd of November, 1831, I inquired of the Lord and received the following important revelation.
  - where: section 1 plain
    claim: Verse 2's Hebrew describes fire kindling brushwood (rendered "twigs") and water boiling
    key: biblehub-interlinear
    url: https://biblehub.com/interlinear/isaiah/64-2.htm
    quote: of brushwood
  - where: section 1 plain
    claim: "Verse 4 Hebrew reads: no eye has seen any God besides You, who acts for the one waiting for Him"
    key: biblehub-interlinear
    url: https://biblehub.com/interlinear/isaiah/64-4.htm
    quote: From ancient times no one has heard, no ear has perceived, no eye has seen any God besides You, who acts on behalf of those who wait for Him.
  - where: section 2 plain
    claim: Verse 5 is rendered in several ways; the closing line is uncertain (one reading is "in our sins a long time, and shall we be saved?")
    key: biblehub-interlinear
    url: https://biblehub.com/interlinear/isaiah/64-5.htm
    quote: Surely You were angry, for we sinned. How can we be saved if we remain in our sins?
  - where: section 2 plain
    claim: '"Gladly do right" and "polluted garment" are renderings of the Hebrew of verses 5–6'
    key: biblehub-interlinear
    url: https://biblehub.com/interlinear/isaiah/64-6.htm
    quote: All of us have become like something unclean, and all our righteous acts are like a polluted garment; all of us wither like a leaf, and our iniquities carry us away like the wind.
  - where: section 3 plain
    claim: 'Verse 12 Hebrew reads: "beyond measure"'
    key: biblehub-interlinear
    url: https://biblehub.com/interlinear/isaiah/64-12.htm
    quote: Will You keep silent and afflict us beyond measure?
  - where: note 64:1 “Tear open the heavens”
    claim: Hebrew verb in verse 1 is qāraʿ, "to tear" (Hebrew numbering 63:19)
    key: bdb
    url: https://biblehub.com/hebrew/7167.htm
    quote: קָרַע63 verb tear … c. rend open heavens, and descend of ׳י, Isaiah 63:19.
  - where: note 64:1 “Tear open the heavens”
    claim: qāraʿ is the verb for tearing garments in grief
    key: bdb
    url: https://biblehub.com/hebrew/7167.htm
    quote: 1. a. usually (39 t.) of rending garment in (I) sign of grief, distress
  - where: note 64:1 “Tear open the heavens”
    claim: The Hebrew of 64:1 is qāraʿtā šāmayim yārad(tā), "rend the heavens … come down"
    key: biblehub-interlinear
    url: https://biblehub.com/interlinear/isaiah/64-1.htm
    quote: If only You would tear the heavens open and come down
  - where: note 64:1 “Tear open the heavens”
    claim: Mark's word at Jesus' baptism is schizō, "tear open"
    key: greek-nt
    url: https://biblehub.com/interlinear/mark/1-10.htm
    quote: schizomenous σχιζομένους tearing open … ouranous οὐρανοὺς heavens
  - where: note 64:1 “Tear open the heavens”
    claim: Matthew uses an ordinary word for "opened" (anoigō)
    key: greek-nt
    url: https://biblehub.com/interlinear/matthew/3-16.htm
    quote: ēneōchthēsan ἠνεῴχθησαν were opened
  - where: note 64:1 “Tear open the heavens”
    claim: Luke uses the same ordinary word for "opened" (anoigō)
    key: greek-nt
    url: https://biblehub.com/interlinear/luke/3-21.htm
    quote: aneōchthēnai ἀνεῳχθῆναι was opened
  - where: note 64:1 “Tear open the heavens”
    claim: Mark uses schizō again for the temple veil at Jesus' death
    key: greek-nt
    url: https://biblehub.com/interlinear/mark/15-38.htm
    quote: eschisthē ἐσχίσθη was torn
  - where: note 64:3 “Mountains that flow”
    claim: nāzōllû can be read as "shake, quake" (from zālal) or as "flow down" (from nāzal); the ancient versions took it as flow
    key: bdb
    url: https://biblehub.com/hebrew/2151.htm
    quote: Niph`al Perfect נָזֹ֫לּוּ shake, quake Isaiah 63:19 of mountains at ׳יs presence (Ges De Che Di Du; ᵐ5 ᵑ9 as if from נזל flow down)
  - where: note 64:3 “Mountains that flow”
    claim: nāzal is the verb for flowing water
    key: bdb
    url: https://biblehub.com/hebrew/5140.htm
    quote: "[נָזַל] verb flow, trickle, drop, distil (poetry) … 1 flow subject water, Numbers 24:7 (JE); Psalm 147:18"
  - where: note 64:3 “Mountains that flow”
    claim: Form in 64:3 is nāzōllû; other translations render it "quaked/shake"
    key: biblehub-interlinear
    url: https://biblehub.com/interlinear/isaiah/64-3.htm
    quote: the mountains trembled at Your presence
  - where: note 64:3 “Mountains that flow”
    claim: In verse 2 the "melting fire" of the KJV is a fire kindling brushwood
    key: biblehub-interlinear
    url: https://biblehub.com/interlinear/isaiah/64-2.htm
    quote: of brushwood
  - where: note 64:4 “Eye hath not seen”
    claim: The verb for waiting in verse 4 is ḥākâ, "wait for, long for"
    key: bdb
    url: https://biblehub.com/hebrew/2442.htm
    quote: "[חָכָה] verb wait, await … 3 wait for, long for, with לְ for ׳י Isaiah 8:17; Isaiah 64:3"
  - where: note 64:4 “Eye hath not seen”
    claim: Verse 4's word is lim·ḥak·kêh, "for the one waiting for Him" (ḥākâ)
    key: biblehub-interlinear
    url: https://biblehub.com/interlinear/isaiah/64-4.htm
    quote: lim·ḥak·kêh- לִמְחַכֵּה־ for the one waiting
  - where: note 64:4 “Eye hath not seen”
    claim: Isaiah 40:31 uses a different Hebrew verb (qāwâ, Strong's 6960) for waiting
    key: biblehub-interlinear
    url: https://biblehub.com/interlinear/isaiah/40-31.htm
    quote: wə·qō·w·yê וְקוֹיֵ֤ and those waiting on
  - where: note 64:5 “A verse no one is sure of”
    claim: The Hebrew is bāhem ʿôlām wənîwwāšēaʿ, "in them, continuance, … be saved"
    key: biblehub-interlinear
    url: https://biblehub.com/interlinear/isaiah/64-5.htm
    quote: is continuance
  - where: note 64:5 “A verse no one is sure of”
    claim: NASB 1995 gives an interrogative rendering of the closing line
    key: nasb1995
    url: https://biblehub.com/nasb/isaiah/64.htm
    quote: We continued in them a long time; And shall we be saved?
  - where: note 64:6 “Filthy rags”
    claim: beged ʿiddîm is a stained garment, ʿiddâ meaning menstruation; a figure for the best deeds of a guilty people
    key: bdb
    url: https://biblehub.com/hebrew/5708.htm
    quote: '[עִדָּה] noun feminine menstruation, so Vrss (properly time, period); — plural absolute בֶּגֶד עִדִּים Isaiah 64:5 i.e. stained garment (figurative of best deeds of guilty people; "" טָמֵא).'
  - where: note 64:6 “Filthy rags”
    claim: 'Hebrew of verse 6: "unclean one … ṣidqōtênû (our righteous acts)"'
    key: biblehub-interlinear
    url: https://biblehub.com/interlinear/isaiah/64-6.htm
    quote: like an unclean one
  - where: note 64:8 “The clay and the potter”
    claim: The note's reading rests on the verse and the other scriptures it cites
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/isa/64?lang=eng
    quote: But now, O Lord, thou art our father; we are the clay, and thou our potter; and we all are the work of thy hand.
  - where: note 64:11 “The burned temple”
    claim: Jerusalem fell in 587 BC
    key: bible-chron-ot
    url: https://www.churchofjesuschrist.org/study/scriptures/bible-chron/old-testament?lang=eng
    quote: 587 | Capture of Jerusalem | 587
  - where: note 64:12 “Will You keep silent?”
    claim: Verse 12 "refrain thyself" is hitʾappaq, and "hold thy peace" is ḥāšâ
    key: biblehub-interlinear
    url: https://biblehub.com/interlinear/isaiah/64-12.htm
    quote: Will You keep silent
  - where: note 64:12 “Will You keep silent?”
    claim: Isaiah 42:14 uses the same verb (hitʾappaq) for the Lord's own restraint
    key: biblehub-interlinear
    url: https://biblehub.com/interlinear/isaiah/42-14.htm
    quote: he·ḥĕ·šê·ṯî הֶחֱשֵׁ֙יתִי֙ I have been silent … ’eṯ·’ap·pāq; אֶתְאַפָּ֑ק and restrained Myself
  - where: note 64:12 “Will You keep silent?”
    claim: ḥāšâ (Strong's 2814) is also the verb of Isaiah 57:11
    key: biblehub-interlinear
    url: https://biblehub.com/interlinear/isaiah/57-11.htm
    quote: maḥ·šeh מַחְשֶׁה֙ been silent V‑Hifil‑Prtcpl‑ms
  - where: note 64:12 “Will You keep silent?”
    claim: ḥāšâ is also the verb of Isaiah 62:1
    key: biblehub-interlinear
    url: https://biblehub.com/interlinear/isaiah/62-1.htm
    quote: will I be silent
