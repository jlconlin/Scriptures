# Evidence ledger for Isaiah 27 (audit, 2026-10-01)
chapter: 27
claims:
  - where: 'when'
    claim: 'The Church manual places Isaiah 24–35 under prophecies of the dispensation of the fulness of times'
    key: ot-manual-15
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-15?lang=eng'
    quote: 'Prophecies of the Dispensation of the fullness of Times'
  - where: 'section 1 plain'
    claim: 'Plain rendering of 27:1 follows the NIV'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Isaiah+27&version=NIV'
    quote: 'Leviathan the coiling serpent'
  - where: 'section 2 plain'
    claim: 'Plain rendering of 27:2–6 follows the NIV'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Isaiah+27&version=NIV'
    quote: 'I, the Lord, watch over it'
  - where: 'section 3 plain'
    claim: 'Plain rendering of 27:7–11 follows the NIV'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Isaiah+27&version=NIV'
    quote: 'Has the Lord struck her'
  - where: 'section 4 plain'
    claim: 'Plain rendering of 27:12–13 follows the NIV (Wadi of Egypt)'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Isaiah+27&version=NIV'
    quote: 'Wadi of Egypt'
  - where: 'thread'
    claim: 'Leviathan and similar sea monsters are symbols of the powers that endanger mortal life'
    key: sc-knowhy-34
    url: 'https://scripturecentral.org/knowhy/why-does-jacob-choose-a-monster-as-a-symbol-for-death-and-hell'
    quote: 'Together, they all symbolized the powers of chaos, or those forces that endanger the lives of mortal beings'
  - where: 'thread'
    claim: 'The verb for the Lord’s “beating off” is the one used for beating down olives, and the Euphrates and the brook of Egypt were the promised boundaries'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/27.htm'
    quote: 'applied to the beating down of olives in Deuteronomy 24:20'
  - where: 'note 27:1 “Leviathan”'
    claim: 'Leviathan is a great sea or land monster, real or symbolic of a nation, or a large serpent'
    key: bd-leviathan
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/leviathan?lang=eng'
    quote: 'Any great sea or land monster, such as the crocodile, either as an actual creature (Job 41:1) or as symbolic of a nation (Ps. 74:14); a large serpent (Isa. 27:1).'
  - where: 'note 27:1 “Leviathan”'
    claim: 'Such monster imagery appears in the Bible and wider ancient Near Eastern literature as symbols of chaos'
    key: sc-knowhy-34
    url: 'https://scripturecentral.org/knowhy/why-does-jacob-choose-a-monster-as-a-symbol-for-death-and-hell'
    quote: 'are found not only in the Old Testament but also in ancient Near Eastern literature generally'
  - where: 'note 27:1 “Leviathan”'
    claim: 'Dragon and serpent are scriptural terms for Satan; Leviathan probably includes Satan and his servants'
    key: ot-manual-15
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-15?lang=eng'
    quote: 'Both dragon and serpent are scriptural terms for Satan, the common enemy of God and all mankind'
  - where: 'note 27:1 “Leviathan”'
    claim: 'The dragon and serpent are names for Satan (Rev. 12:9)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/12?lang=eng'
    quote: 'the great dragon was cast out, that old serpent, called the Devil, and Satan, which deceiveth the whole world'
  - where: 'note 27:1 “Leviathan”'
    claim: 'The dragon is that old serpent, the Devil and Satan (Rev. 20:2)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/20?lang=eng'
    quote: 'the dragon, that old serpent, which is the Devil, and Satan, and bound him a thousand years'
  - where: 'note 27:2 “The second vineyard song”'
    claim: 'The Lord’s discipline did its work (punishment is a way to salvation)'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/27.htm'
    quote: 'God punished Israel "by measure;" His punishment is a way to salvation'
  - where: 'note 27:5 “Take hold of My strength”'
    claim: 'The phrase read as grasping His protection'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/27.htm'
    quote: 'Men would then have to grasp at my protection'
  - where: 'note 27:5 “Take hold of My strength”'
    claim: 'Adonijah caught hold of the horns of the altar for sanctuary'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/1?lang=eng'
    quote: 'Adonijah feared because of Solomon, and arose, and went, and caught hold on the horns of the altar'
  - where: 'note 27:6 “Filling the world with fruit”'
    claim: 'The fruit is the gospel of peace'
    key: ot-manual-15
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-15?lang=eng'
    quote: 'That fruit is the gospel of peace (see v. 5–6).'
  - where: 'note 27:8 “Discipline in measure”'
    claim: '“In measure” means the measure was fixed so as not to exceed Israel’s endurance or end its national existence'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/27.htm'
    quote: 'determining the measure very exactly, that it might not exceed the enduring power of Israel, not endanger the existence of Israel as a nation'
  - where: 'note 27:9 “The fruit of repentance”'
    claim: 'The verb “purged” is the atonement verb (cuppar), as in Isa. 22:14, meaning covered or made good'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/27.htm'
    quote: 'the guilt for which it had yet to make atonement would be covered, made good, or wiped away (on cuppar, see at Isaiah 22:14)'
  - where: 'note 27:9 “The fruit of repentance”'
    claim: 'The discipline’s purpose was to end idolatry'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/27.htm'
    quote: 'if Israel would thoroughly renounce its sin, and, above all, the sin of all sins, namely idolatry'
  - where: 'note 27:12 “Gathered one by one”'
    claim: 'The Euphrates and the brook of Egypt were the northeastern and southwestern boundaries of the originally promised land'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/27.htm'
    quote: 'were the north-eastern and south-western boundaries of the land of Israel, according to the original promise (Genesis 15:18; 1 Kings 8:65)'
  - where: 'note 27:12 “Gathered one by one”'
    claim: 'The verb “beat off” is used of beating down olives (Deut. 24:20)'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/27.htm'
    quote: 'applied to the beating down of olives in Deuteronomy 24:20'
  - where: 'note 27:13 “The great trumpet”'
    claim: 'A trumpet announced the Jubilee, the year of return'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/25?lang=eng'
    quote: 'cause the trumpet of the jubilee to sound on the tenth day of the seventh month'
