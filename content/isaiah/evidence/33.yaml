# Evidence ledger for Isaiah 33 (audit, 2026-10-01)
chapter: 33
claims:
  - where: 'when'
    claim: 'Sennacherib besieged Jerusalem in 701 BC (p. 198)'
    key: isaiah-in-bom
    url: 'https://storage.googleapis.com/scripturecentral-prod-strapi-uploads/ry_and_welch_isaiah_in_the_book_of_mormon_1998_184195e137/ry_and_welch_isaiah_in_the_book_of_mormon_1998_184195e137.pdf'
    quote: 'In 701 b . c ., late in Isaiah''s lifetime, Jerusalem was besieged by the Assyrian armies of Sennacherib'
  - where: 'setting'
    claim: 'Hezekiah paid 300 talents of silver and 30 of gold and stripped the temple doors'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/18?lang=eng'
    quote: 'three hundred talents of silver and thirty talents of gold.'
  - where: 'setting'
    claim: 'Hezekiah stripped the gold from the temple doors'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/18?lang=eng'
    quote: 'cut off the gold from the doors of the temple of the Lord, and from the pillars which Hezekiah king of Judah had overlaid, and gave it to the king of Assyria.'
  - where: 'setting'
    claim: 'Sennacherib then sent an army against Jerusalem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/18?lang=eng'
    quote: 'king of Assyria sent Tartan and Rabsaris and Rab-shakeh from Lachish to king Hezekiah with a great host against Jerusalem.'
  - where: 'setting'
    claim: 'The treacherous dealer of verse 1 is Assyria'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/33.htm'
    quote: 'Asshur is described as not devastated and not spoiled'
  - where: 'thread'
    claim: 'Sinners in Zion are the hypocrites who fear the fire'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/33.htm'
    quote: 'The sinners in Zion are afraid; trembling seizes the hypocrites'
  - where: 'note 33:1 “The treacherous destroyer”'
    claim: 'Assyria, with Hezekiah’s offer'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/18?lang=eng'
    quote: 'I have offended; return from me: that which thou puttest on me will I bear.'
  - where: 'note 33:1 “The treacherous destroyer”'
    claim: 'Sennacherib was slain by his sons'
    key: bd-sennacherib
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sennacherib?lang=eng'
    quote: 'he was slain by his sons (2 Kgs. 19:37; 2 Chr. 32:21; Isa. 37:38).'
  - where: 'note 33:1 “The treacherous destroyer”'
    claim: 'Sennacherib invaded Judah in 701 BC'
    key: isaiah-in-bom
    url: 'https://storage.googleapis.com/scripturecentral-prod-strapi-uploads/ry_and_welch_isaiah_in_the_book_of_mormon_1998_184195e137/ry_and_welch_isaiah_in_the_book_of_mormon_1998_184195e137.pdf'
    quote: 'In 701 b . c ., late in Isaiah''s lifetime, Jerusalem was besieged by the Assyrian armies of Sennacherib'
  - where: 'note 33:8 “A broken treaty”'
    claim: 'The envoys carried the tribute to Sennacherib'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/33.htm'
    quote: 'The heroes intended by the prophet were the messengers sent to Sennacherib to treat with him for peace.'
  - where: 'note 33:8 “A broken treaty”'
    claim: 'The covenant is the treaty Sennacherib broke'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/33.htm'
    quote: 'But Sennacherib broke the treaty, by demanding nothing less than the surrender of Jerusalem itself.'
  - where: 'note 33:14 “Dwelling with everlasting burnings”'
    claim: 'Joseph Smith taught that God dwells in everlasting burnings'
    key: ot-manual-15
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-15?lang=eng'
    quote: 'for God dwells in everlasting burnings, and some shall rise to the damnation of their own filthiness'
  - where: 'note 33:14 “Dwelling with everlasting burnings”'
    claim: 'The question comes from sinners in Zion who fear God’s fire'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/33.htm'
    quote: 'Even for the sinners in Jerusalem also there is no abiding in the presence of the Almighty and Just One'
  - where: 'note 33:15 “A portrait of the one who can dwell with God”'
    claim: 'Stopping the ear is against murderous counsel'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/33.htm'
    quote: 'whose hand keepeth from grasping bribes; he that stoppeth his ear from hearing murderous counsel'
  - where: 'note 33:20 “A tent whose stakes won’t be pulled up”'
    claim: 'Zion pictured as a tent whose stakes are never removed'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/33.htm'
    quote: 'a tent that does not wander about, whose pegs are never drawn, and none of whose cords are ever broken'
  - where: 'note 33:20 “A tent whose stakes won’t be pulled up”'
    claim: 'The Church’s stakes conform to the tent image'
    key: gs-stake
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/stake?lang=eng'
    quote: 'conforms to the tent image described in Isaiah 54:2: “Lengthen thy cords, and strengthen thy stakes.”'
  - where: 'note 33:20 “A tent whose stakes won’t be pulled up”'
    claim: 'Isa. 33:20 and the term stake'
    key: ot-manual-15
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-15?lang=eng'
    quote: 'In keeping with this symbolism, the great areas of church population and strength, which sustain and uphold the restored Zion, are called stakes.'
  - where: 'note 33:21 “Rivers without warships”'
    claim: 'The Lord’s presence makes Jerusalem like a place of broad streams'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/33.htm'
    quote: 'a place of streams, canals of wide extent, into which no fleet of rowing vessels ventures'
  - where: 'note 33:21 “Rivers without warships”'
    claim: 'Streams and canals defended cities'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/33.htm'
    quote: 'like those which in other instances defended the cities they surrounded'
  - where: 'note 33:21 “Rivers without warships”'
    claim: 'Verse 23 addressed to Jerusalem; many took it as Assyria'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/33.htm'
    quote: 'Nearly every commentator (even Luzzatto) has taken Isaiah 33:23 as addressed to Assyria'
  - where: 'note 33:21 “Rivers without warships”'
    claim: 'Delitzsch reads verse 23 as addressed to Jerusalem'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/33.htm'
    quote: 'The address itself, with the suffix ayikh (see at Isaiah 1:26), points to Jerusalem'
