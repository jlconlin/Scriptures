chapter: 63
claims:
- where: when
  claim: Chapters 56–66 portray a restored Jewish community, Jerusalem inhabited and the temple rebuilt (dating debated)
  key: isaiah-in-bom
  url: 'https://storage.googleapis.com/scripturecentral-prod-strapi-uploads/ry_and_welch_isaiah_in_the_book_of_mormon_1998_184195e137/ry_and_welch_isaiah_in_the_book_of_mormon_1998_184195e137.pdf'
  quote: 'Chapters 56-66 are typically offset from the rest since they portray the Jewish community founded once again, Jerusalem in - habited, and the temple rebuilt.'
- where: when
  claim: D&C 133 was given in November 1831
  key: dc-133-heading
  url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/133?lang=eng'
  quote: 'Revelation given through Joseph Smith the Prophet, at Hiram, Ohio, November 3, 1831.'
- where: setting
  claim: Edom lay south of the Dead Sea
  key: bd-edom
  url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/edom?lang=eng'
  quote: 'This country lay south of the Dead Sea, having Moab on the north and the Dead Sea on the northwest.'
- where: setting
  claim: The figure is the Lord, and Isa. 63:5 nearly repeats Isa. 59:16 (the Lord acting alone)
  key: delitzsch
  url: 'https://biblehub.com/commentaries/kad/isaiah/63.htm'
  quote: 'Isaiah 63:5 is the expansion of לבדּי, and almost a verbal repetition of Isaiah 59:16.'
- where: setting
  claim: Verses 7–64:11 form a prayer that begins with thanksgiving for the past and closes with a prayer for help
  key: delitzsch
  url: 'https://biblehub.com/commentaries/kad/isaiah/63.htm'
  quote: 'There follows now in Isaiah 63:7-64:11 a prayer commencing with the thanksgiving as it looks back to the past, and closing with a prayer for help as it turns to the present.'
- where: setting
  claim: The Lord quoted Isa. 63 of His Second Coming in D&C 133, with changes (here v. 46 and 47)
  key: lds-scriptures
  url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/133?lang=eng'
  quote: 'And it shall be said: Who is this that cometh down from God in heaven with dyed garments; yea, from the regions which are not known, clothed in his glorious apparel, traveling in the greatness of his strength?'
- where: setting
  claim: Isaiah 63's chapter heading applies the passage to the Second Coming
  key: lds-scriptures
  url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/63?lang=eng'
  quote: 'The Second Coming will be a day of vengeance and also the year of the…'
- where: note 63:1 “From Edom”
  claim: Edom means “red” and is the name of Esau and his descendants (Gen. 25:30)
  key: bd-edom
  url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/edom?lang=eng'
  quote: 'Red. Name of Esau (Gen. 25:30); of his descendants (Gen. 36; 1 Chr. 1:35–42)'
- where: note 63:1 “From Edom”
  claim: Edom was Judah’s neighbor and kin; Bozrah was in Edom; Edom sided with the Chaldeans against Israel; Edom stands for the world hostile to God’s people
  key: delitzsch
  url: 'https://biblehub.com/commentaries/kad/isaiah/63.htm'
  quote: 'at the destruction of Jerusalem by the Chaldeans, and the carrying away of the people, Edom took the side of the Chaldeans, rejoiced over Israel''s defeat'
- where: note 63:1 “From Edom”
  claim: Edom stands for the world as hostile to Israel as the people of God
  key: delitzsch
  url: 'https://biblehub.com/commentaries/kad/isaiah/63.htm'
  quote: 'Edom for the world as cherishing hostility and manifesting hostility to Israel as Israel, i.e., as the people of God.'
- where: note 63:1 “From Edom”
  claim: Bozrah is a place in Edom, between Petra and the Dead Sea
  key: delitzsch
  url: 'https://biblehub.com/commentaries/kad/isaiah/63.htm'
  quote: 'the place in Edomitis or Gebal, between Petra and the Dead Sea, which still exists as a village in ruins'
- where: note 63:1 “From Edom”
  claim: Idumea is Edom, and in D&C 1:36 it represents the world
  key: bd-idumea
  url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/idumea?lang=eng'
  quote: 'Edom. Isa. 34:5–6; Ezek. 35:15; 36:5; Mark 3:8. In D&C 1:36 Idumea is used to represent the world.'
- where: note 63:1 “From Edom”
  claim: D&C 133:46 changes “from Edom… from Bozrah” to “down from God in heaven… from the regions which are not known”; revelation given 1831
  key: dc-133-heading
  url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/133?lang=eng'
  quote: 'Revelation given through Joseph Smith the Prophet, at Hiram, Ohio, November 3, 1831.'
- where: note 63:1 “Mighty to save”
  claim: rab ləhôšîaʿ is “great (strong) to save”, from the root yšʿ
  key: bdb
  url: 'https://biblehub.com/hebrew/7227.htm'
  quote: 'b. specifically strong (opposed to אֵין כֹּחַ) 2 Chron 14:10; רַב לְהוֺשִׁיעַ Isaiah 63:1'
- where: note 63:1 “Mighty to save”
  claim: The root yšʿ means to deliver or save, and is used of God’s saving (Isa. 63:1)
  key: bdb
  url: 'https://biblehub.com/hebrew/3467.htm'
  quote: 'deliver, save (properly give width and breadth to, liberate)'
- where: note 63:1 “Mighty to save”
  claim: The speaker is great to help the oppressed; he speaks in righteousness and carries out what he promises
  key: delitzsch
  url: 'https://biblehub.com/commentaries/kad/isaiah/63.htm'
  quote: 'He is great (רב, not רב; S. ὑπερμαχῶν, Jer. propugnator) to aid the oppressed against their oppressors.'
- where: note 63:3 “The winepress alone”
  claim: Treading grapes in the winepress stains the treader’s clothes with the juice
  key: delitzsch
  url: 'https://biblehub.com/commentaries/kad/isaiah/63.htm'
  quote: '"and (why are) thy clothes like those of one who treads (wine) in the wine-press" ... i.e., saturated and stained as if with the juice of purple grapes?'
- where: note 63:3 “The winepress alone”
  claim: In Isaiah the blood on the garment is the enemies’ blood, not His own; John’s vision is based on Isaiah 63
  key: delitzsch
  url: 'https://biblehub.com/commentaries/kad/isaiah/63.htm'
  quote: 'The blood upon the garment of the divine Hero is not His own, but that of His enemies; and His treading of the wine-press is not the conquest of wrath, but the manifestation of wrath.'
- where: note 63:3 “The winepress alone”
  claim: Elder Holland quoted Isa. 63:3, 5 for the Savior’s solitary task, and said that because He walked alone we do not have to
  key: holland-none-with-him
  url: 'https://www.churchofjesuschrist.org/study/general-conference/2009/04/none-were-with-him?lang=eng'
  quote: 'I speak of the loneliest journey ever made and the unending blessings it brought to all in the human family. I speak of the Savior’s solitary task of shouldering alone the burden of our salvation.'
- where: note 63:3 “The winepress alone”
  claim: Holland says that because Jesus walked alone, we do not have to
  key: holland-none-with-him
  url: 'https://www.churchofjesuschrist.org/study/general-conference/2009/04/none-were-with-him?lang=eng'
  quote: 'because Jesus walked such a long, lonely path utterly alone, we do not have to do so.'
- where: note 63:9 “Afflicted with them, or not?”
  claim: The ketiv has lōʾ (“not”) and the qere lô (“to him”); this is one of fifteen passages where the qere has lô for lōʾ, and the qere is to be preferred
  key: delitzsch
  url: 'https://biblehub.com/commentaries/kad/isaiah/63.htm'
  quote: 'This is one of the fifteen passages in which the chethib has לא, the keri לו.'
- where: note 63:9 “Afflicted with them, or not?”
  claim: The qere (“he was afflicted”) is preferred
  key: delitzsch
  url: 'https://biblehub.com/commentaries/kad/isaiah/63.htm'
  quote: 'Everything forces to the conclusion that the keri לו is to be preferred.'
- where: note 63:9 “The angel of His presence”
  claim: The angel of His face; pānîm means face/presence (used of the Lord’s presence, Ex. 33:14, and Isa. 63:9)
  key: bdb
  url: 'https://biblehub.com/hebrew/6440.htm'
  quote: 'a. = presence, person, of ׳י Exodus 33:14,15, בְּפָנָיו Deuteronomy 4:37, מַלְאַךְ מָּנָיו Isaiah 63:9'
- where: note 63:9 “The angel of His presence”
  claim: The Hebrew reads “the Angel of His face”
  key: delitzsch
  url: 'https://biblehub.com/commentaries/kad/isaiah/63.htm'
  quote: 'and the Angel of His face brought them salvation.'
- where: note 63:9 “The angel of His presence”
  claim: Latter-day Saints understand Jehovah, the God of Israel, to be the premortal Jesus Christ
  key: bd-jehovah
  url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
  quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
- where: note 63:10 “Grieving the Holy Spirit”
  claim: ʿiṣṣəbû (ʿāṣab) means to hurt, pain, grieve; used at Isa. 63:10 and (the same root, Hithpael) at Gen. 34:7
  key: bdb
  url: 'https://biblehub.com/hebrew/6087.htm'
  quote: 'Pi`el Perfect3plural עִצְּבוּ with accusative Isaiah 63:10 they vexed his holy spirit'
- where: note 63:10 “Grieving the Holy Spirit”
  claim: Same root at Gen. 34:7
  key: bdb
  url: 'https://biblehub.com/hebrew/6087.htm'
  quote: 'Hithpa`el Imperfect3masculine singular וַיִּתְעַצֵּב אֶללִֿבּוֺ Genesis 6:6 and he was vexed to his heart (of ׳י; "" וַיִּנָּחֶם); 3 masculine plural וִיִּתְעַצְּבוּ Genesis 34:7'
- where: note 63:10 “Grieving the Holy Spirit”
  claim: “holy Spirit” appears in the Old Testament only at Isa. 63:10, 11 and Ps. 51:11 (checked in the KJV text)
  key: lds-scriptures
  url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/63?lang=eng'
  quote: 'Then he remembered the days of old, Moses, and his people, saying, Where is he that brought them up out of the sea with the shepherd of his flock? where is he that put his holy Spirit within him?'
- where: note 63:10 “Grieving the Holy Spirit”
  claim: Ps. 51:11 has “take not thy holy spirit from me”
  key: lds-scriptures
  url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/51?lang=eng'
  quote: 'Cast me not away from thy presence; and take not thy holy spirit from me.'
- where: note 63:14 “Brought to rest”
  claim: Verses 11–14 picture the Exodus, the people passing through the deep like a horse on the plain, and the Spirit brings them to rest
  key: delitzsch
  url: 'https://biblehub.com/commentaries/kad/isaiah/63.htm'
  quote: 'As the horse gallops over the plain," so did they pass through the depths of the sea'
- where: note 63:14 “Brought to rest”
  claim: D&C 84:23–24 defines the rest the wilderness generation forfeited as the fulness of His glory
  key: lds-scriptures
  url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
  quote: 'swore that they should not enter into his rest while in the wilderness, which rest is the fulness of his glory.'
- where: note 63:16 “You are our Father”
  claim: Jehovah is Israel’s Father (Deut. 32:6); Abraham and Israel cannot help; the prayer addresses Him as Father and Redeemer
  key: delitzsch
  url: 'https://biblehub.com/commentaries/kad/isaiah/63.htm'
  quote: 'Jehovah is Israel''s Father (Deuteronomy 32:6).'
- where: note 63:16 “You are our Father”
  claim: Abraham and Israel could not intervene for their descendants
  key: delitzsch
  url: 'https://biblehub.com/commentaries/kad/isaiah/63.htm'
  quote: 'Abraham and Jacob-Israel had been taken away from this world, and were unable to interfere on their own account in the history of their people.'
- where: note 63:16 “You are our Father”
  claim: Latter-day Saints identify the Redeemer/Jehovah as Jesus Christ
  key: bd-jehovah
  url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
  quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
- where: note 63:17 “Why hast thou hardened our heart?”
  claim: JST Ex. 4:21 reads “Pharaoh will harden his heart”
  key: jst-ex-4-footnote
  url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/4?lang=eng'
  quote: 'JST Ex. 4:21 … and I will prosper thee; but Pharaoh will harden his heart, and he will not let the people go.'
- where: note 63:17 “Why hast thou hardened our heart?”
  claim: In verse 19 the Hebrew reads as those whom He from everlasting has not ruled, over whom His name was not called
  key: delitzsch
  url: 'https://biblehub.com/commentaries/kad/isaiah/63.htm'
  quote: 'We have become such as He who is from everlasting has not ruled over, upon whom Thy name was not called.'
- where: parallels
  claim: D&C 133:46–53 quotes Isa. 63 with changes (v. 53 parallels v. 9)
  key: lds-scriptures
  url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/133?lang=eng'
  quote: 'In all their afflictions he was afflicted. And the angel of his presence saved them; and in his love, and in his pity, he redeemed them'
