chapter: 60
claims:
  - where: when
    claim: A restored community in Judah after the return from exile is dated from the decree of Cyrus, 537 BC
    key: bible-chron-ot
    url: https://www.churchofjesuschrist.org/study/scriptures/bible-chron/old-testament?lang=eng
    quote: 537 | Decree of Cyrus for the return of the Jews.
  - where: setting
    claim: Chapter 60 is the high point of the book's addresses to Zion
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/60.htm
    quote: we shall find that these addresses to Zion form an ascending series, chapter 60 being the summit to which they rise
  - where: setting
    claim: Zion is addressed as a woman, the mother of Israel, as in chapters 49, 50, 52, 54
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/60.htm
    quote: which is regarded (as in Isaiah 49:18; Isaiah 50:1; Isaiah 52:1-2; Isaiah 54:1) as a woman, and indeed as the mother of Israel
  - where: setting
    claim: The Hebrew of verse 1 addresses Zion in the feminine singular (imperatives qûmî, ʾôrî; suffix 2fs on "your light")
    key: oshb-wlc
    url: https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Isa.xml
    quote: <w lemma="6965 b" morph="HVqv2fs" id="231bW">ק֥וּמִי</w> <w lemma="215" n="1.0" morph="HVqv2fs" id="23VeB">א֖וֹרִי</w> <w lemma="3588 a" morph="HC" id="23vhu">כִּ֣י</w> <w lemma="935" morph="HVqp3ms" id="23x2w">בָ֣א</w> <w lemma="216" n="1" morph="HNcbsc/Sp2fs" id="23gUE">אוֹרֵ֑/ךְ</w>
  - where: setting
    claim: Isa. 60 picks up earlier promises (children carried home, kings serving Zion), cross-referenced in the Church edition's footnotes
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/isa/60?lang=eng
    quote: Isa. 49:22 (20–22); 1 Ne. 19:16 (16–17); A of F 1:10.
  - where: setting
    claim: Jerusalem had few people in Nehemiah's day
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/neh/7?lang=eng
    quote: "Now the city was large and great: but the people were few therein, and the houses were not builded."
  - where: setting
    claim: The wall of Jerusalem lay broken down
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/neh/1?lang=eng
    quote: the wall of Jerusalem also is broken down, and the gates thereof are burned with fire.
  - where: setting
    claim: Nehemiah was appointed governor of Judea in 444 BC
    key: bible-chron-ot
    url: https://www.churchofjesuschrist.org/study/scriptures/bible-chron/old-testament?lang=eng
    quote: 444 | Nehemiah appointed governor of Judea.
  - where: setting
    claim: Nehemiah's wall was finished
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/neh/6?lang=eng
    quote: So the wall was finished in the twenty and fifth day of the month Elul, in fifty and two days.
  - where: setting
    claim: The Wise Men brought gold, frankincense, and myrrh to Jesus
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/nt/matt/2?lang=eng
    quote: they presented unto him gifts; gold, and frankincense, and myrrh.
  - where: setting
    claim: John's New Jerusalem takes up verses 3, 11, and 19–20 (Church edition footnotes link Isa. 60:5, 11, 19 to Rev. 21)
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/isa/60?lang=eng
    quote: Rev. 21:25 (23–26).
  - where: setting
    claim: Isa. 60:19 is cross-referenced to Rev. 21:23
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/isa/60?lang=eng
    quote: Rev. 21:23; 22:5.
  - where: setting
    claim: Isa. 60:3 is read with Rev. 21:24 (nations and kings)
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/isa/60?lang=eng
    quote: Isa. 49:22; 55:5; Rev. 21:24.
  - where: setting
    claim: The Lord applies "Arise and shine forth" to latter-day Zion
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/115?lang=eng
    quote: Arise and shine forth, that thy light may be a standard for the nations;
  - where: thread
    claim: Zion's light is reflected, not her own; nations move toward it
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/60.htm
    quote: All earthly might and majesty station themselves in the light of the divine glory, which is reflected by the church.
  - where: thread
    claim: Tarshish ships come from the far west
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/60.htm
    quote: with the Tartessus ships, which come from the farthest extremity of the European insular quarter of the globe, at their head
  - where: section 1 plain
    claim: "Zion is told to arise and shine, the light has come (Church footnote: Zion is to arise and be a light to the nations)"
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/isa/60?lang=eng
    quote: IE Zion is to arise and be a light unto the nations.
  - where: section 2 plain
    claim: '"Be radiant" for "flow together" (verse 5); "multitude" for "abundance"'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/isa/60?lang=eng
    quote: OR be radiant.
  - where: section 2 plain
    claim: Verse 5, Hebrew "multitude" of the sea, rendered wealth of the sea (Church footnote 5b)
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/isa/60?lang=eng
    quote: HEB multitude.
  - where: section 2 plain
    claim: Verse 5, heart trembles and expands (plain "pound and swell")
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/60.htm
    quote: Zion's heart trembles; yet at the same time it is so elevating, that the straitened heart expands
  - where: section 2 plain
    claim: Verse 4, daughters are carried upon the arm or side (plain "carried on the hip")
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/60.htm
    quote: and thy daughters are carried hither upon arms.
  - where: section 2 plain
    claim: Verse 10, "sons of strangers" are foreigners who rebuild the walls
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/60.htm
    quote: '"And sons of strangers build thy walls, and their kings serve thee'
  - where: section 2 plain
    claim: Verse 11, "their kings brought" is rendered by Delitzsch as brought in triumphal procession (a disputed Hebrew phrase; Knobel proposed "leaders of the procession")
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/60.htm
    quote: and thus suffer themselves to be brought in a triumphal procession to the holy city as the captives of the church and her God.
  - where: section 3 plain
    claim: Verse 17, "copper/bronze for gold" and "peace as magistracy, righteousness as bailiffs"
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/60.htm
    quote: '"For copper I bring gold, and for iron I bring silver, and for wood copper, and for stones iron, and make peace thy magistracy, and righteousness thy bailiffs.'
  - where: section 3 plain
    claim: Verse 20, the moon is not withdrawn (will not wane)
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/60.htm
    quote: a moon יאסף לא which is not taken in towards morning, like a lamp that has been hung out at night
  - where: section 3 plain
    claim: Verse 21, Hebrew nēṣer is a sprout or shoot
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/60.htm
    quote: a "sprout" (nētser as in Isaiah 11:1; Isaiah 14:19; Arab. nadr, the green branch) "of my plantations"
  - where: section 3 plain
    claim: Verse 22, "I will hasten it" means the Lord fulfils it rapidly when His set time arrives
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/60.htm
    quote: Jehovah will fulfil it rapidly, when the point of time (καιρός) which He has fixed for it shall have arrived.
  - where: section 3 plain
    claim: Verse 22, the smallest becomes thousands, the meanest a powerful nation
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/60.htm
    quote: '"The smallest one will become thousands, and the meanest one a powerful nation."'
  - where: note 60:1 “Dawn over Zion”
    claim: The verbs are feminine singular (imperatives qûmî, ʾôrî; 2fs suffix); zāraḥ is a perfect (Qal perfect 3ms)
    key: oshb-wlc
    url: https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Isa.xml
    quote: <w lemma="2224" n="0" morph="HVqp3ms" id="23FKE">זָרָֽח</w>
  - where: note 60:1 “Dawn over Zion”
    claim: Zion is the woman who lay prostrate; the cry "Arise" (qūmī) puts new life into her
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/60.htm
    quote: She now hears the cry, "Arise" (qūmı̄). This is not a mere admonition, but a word of power which puts new life into her limbs
  - where: note 60:1 “Dawn over Zion”
    claim: Zârach is the verb for the rising of the sun
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/60.htm
    quote: Zârach is the word commonly applied to the rising of the sun (Malachi 4:2).
  - where: note 60:1 “Dawn over Zion”
    claim: 'BDB: zāraḥ, "rise" of the sun, used figuratively of the glory of the Lord, Isa. 60:1'
    key: bdb
    url: https://biblehub.com/hebrew/2224.htm
    quote: a. (of sun) Judges 9:33; Nahum 3:7; 2 Samuel 23:4; Jonah 4:8; Job 9:7; Psalm 104:22; Ecclesiastes 1:5 (twice in verse)
  - where: note 60:1 “Dawn over Zion”
    claim: BDB gives a figurative use of the verb, subject the glory of the Lord, Isa. 60:1
    key: bdb
    url: https://biblehub.com/hebrew/2224.htm
    quote: figurative, followed by לְ, שֶׁמֶשׁ צְדָקָה Malachi 3:20; of ׳י, וְזָרַח מִשֵּׂעִיר לָמוֺ Deuteronomy 33:2; followed by על, Isaiah 60:2 ("" כבודו יראה); ׳כבוד י Isaiah 60:1
  - where: note 60:1 “Dawn over Zion”
    claim: The perfect used of the future, as already accomplished, is called the perfectum propheticum; the prophet so transports himself into the future
    key: gesenius-grammar
    url: https://archive.org/stream/hebrewgrammar0000gese_d5z7/hebrewgrammar0000gese_d5z7_djvu.txt
    quote: This use of the perfect occurs most frequently in prophetic language (perfectum propheticum).- The prophet so trans-
  - where: note 60:2 “Gross darkness”
    claim: "BDB: ʿărāpel is a heavy cloud; God dwells in it (Ex. 20:21, 1 Kgs. 8:12); figurative of misery in Isa. 60:2"
    key: bdb
    url: https://biblehub.com/hebrew/6205.htm
    quote: עֲרָפֶל noun masculine cloud, heavy cloud
  - where: note 60:2 “Gross darkness”
    claim: BDB lists ʿărāpel as the cloud in which God dwells, Exodus 20:21 and 1 Kings 8:12, and as figurative of misery in Isaiah 60:2
    key: bdb
    url: https://biblehub.com/hebrew/6205.htm
    quote: ׳ע in which God dwells Exodus 20:18 (Gi; van d. H. Exodus 20:21), 1 Kings 8:12 2Chronicles 6:1
  - where: note 60:2 “Gross darkness”
    claim: The Church edition's footnote glosses the darkness of verse 2 as ignorance and wickedness and cross-references D&C 112:23
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/isa/60?lang=eng
    quote: IE ignorance and wickedness. D&C 112:23.
  - where: note 60:2 “Gross darkness”
    claim: D&C 112:23 words the darkness as covering the minds of the people
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/112?lang=eng
    quote: darkness covereth the earth, and gross darkness the minds of the people, and all flesh has become corrupt before my face.
  - where: note 60:6 “Camels, gold, and incense”
    claim: Midian came from Abraham and Keturah; Ephah was one of its branches
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/60.htm
    quote: The tribe of Midian, which sprang from Abraham and Keturah (Genesis 25:2), and of which Ephah (Targ. Hōlâd, the Hutheilites?) formed one of the several branches (Genesis 25:4)
  - where: note 60:6 “Camels, gold, and incense”
    claim: Sheba's descendants gave their name to a part of southern Arabia
    key: bd-sheba
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/sheba?lang=eng
    quote: Son of Joktan (Gen. 10:28; 1 Chr. 1:22); his descendants gave their name to a portion of southern Arabia (now called Arabia Felix).
  - where: note 60:6 “Camels, gold, and incense”
    claim: Sheba's land is described as one where myrrh, frankincense and cinnamon grow (Strabo, quoted by Delitzsch); the Bible Dictionary lists Isa. 60:6, Jer. 6:20 and Ps. 72:10 under Sheba
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/60.htm
    quote: the highly blessed land of the Sabaeans, in which myrrh, frankincense, and cinnamon grow.
  - where: note 60:6 “Camels, gold, and incense”
    claim: The Bible Dictionary lists Ps. 72:10, Isa. 60:6 and Jer. 6:20 under Sheba (the queen of Sheba entry)
    key: bd-sheba
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/sheba?lang=eng
    quote: Queen of Sheba (1 Kgs. 10:1, 4, 10, 13; 2 Chr. 9:1, 3, 9, 12; also Job 6:19; Ps. 72:10, 15; Isa. 60:6; Jer. 6:20).
  - where: note 60:6 “Camels, gold, and incense”
    claim: Nebaioth is an Ishmaelite tribe (Gen. 25:13), as is Kedar
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/60.htm
    quote: Nebaitoh, also in Ishmaelitish tribe (according to the incontrovertible account of Genesis 25:13)
  - where: note 60:8 “Flying like clouds”
    claim: The flying shapes are ships, like doves to their dovecotes; Tartessus ships lead
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/60.htm
    quote: The things thus flying along like clouds and doves are ships; with the Tartessus ships, which come from the farthest extremity of the European insular quarter of the globe, at their head
  - where: note 60:8 “Flying like clouds”
    claim: BDB says the Hebrew word translated "windows" in Isa. 60:8 means the openings of a dove-cote
    key: bdb
    url: https://biblehub.com/hebrew/699.htm
    quote: lattice, latticed opening, where smoke escaped Hosea 13:3; openings of dove-cote Isaiah 60:8
  - where: note 60:8 “Flying like clouds”
    claim: Tarshish is probably Tartessus in Spain; "ships of Tarshish" came to mean the largest ships, for long voyages; cited with Isa. 2:16, 23:1, Jonah 1:3
    key: bd-tarshish
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/tarshish?lang=eng
    quote: Probably Tartessus in Spain; ships of Tarshish (the name came to be used to denote ships of the largest size, suitable for long voyages) (1 Kgs. 10:22; Ps. 48:7; Isa. 2:16; 23:1; 60:9; Ezek. 27:25)
  - where: note 60:17 “Bronze for gold, and a reversal”
    claim: BDB gives nōgēś as a driver or task-master (Ex. 5:6, 10), also an arbitrary ruler (Isa. 3:12), foreign oppressor (Isa. 14:2), and in Isa. 60:17 a plural abstract, figurative of righteousness
    key: bdb
    url: https://biblehub.com/hebrew/5065.htm
    quote: Participle (= substantive) driver, task-master Exodus 3:7; Exodus 5:6,10,13,14; Job 3:18; (ass-) driver Job 39:7; of (arbitrary) ruler Isaiah 3:12
  - where: note 60:17 “Bronze for gold, and a reversal”
    claim: BDB gives foreign oppressor Isa. 14:2; the plural in Isa. 60:17 is personified righteousness
    key: bdb
    url: https://biblehub.com/hebrew/5065.htm
    quote: = foreign oppressor, tyrant Isaiah 9:3 (with בְּ) Isaiah 14:2,4; Zechariah 9:8; exactor of tribute, Daniel 11:20; plural abstract lordship = lord, ruler, figurative of צְדָקָה (personified) Isaiah 60:17
  - where: note 60:17 “Bronze for gold, and a reversal”
    claim: In the new city peace is its magistracy and righteousness its bailiffs (personifications)
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/60.htm
    quote: Jehovah makes peace its pequddâh, i.e., its "overseership"
  - where: note 60:17 “Bronze for gold, and a reversal”
    claim: The walls of verse 18 are given the names Salvation and Praise, and the walls rise through foreigners' help (compare Isa. 26:1)
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/60.htm
    quote: It has walls (Isaiah 60:10); but in truth "salvation," the salvation of its God, is regarded as its impregnable fortifications.
  - where: note 60:19 “A city without a sun”
    claim: Isaiah says the Lord is Zion's light; John adds the Lamb
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/60.htm
    quote: The seer of the Apocalypse also mentions the Lamb.
  - where: note 60:19 “A city without a sun”
    claim: John describes the New Jerusalem as having no need of the sun; the Church edition cross-references Isa. 60:19 to Rev. 21:23
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/nt/rev/21?lang=eng
    quote: "And the city had no need of the sun, neither of the moon, to shine in it: for the glory of God did lighten it, and the Lamb is the light thereof."
  - where: note 60:19 “A city without a sun”
    claim: Delitzsch ties Rev. 21:23 and 21:25 to Isa. 60:19 (no night)
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/60.htm
    quote: Even of the Jerusalem which is not to be built by Israel with the help of converted heathen, but which comes down from heaven to earth, the seer in Revelation 21:23 merely says
  - where: note 60:21 “The branch of my planting”
    claim: BDB says nēṣer is a sprout or shoot; Isa. 11:1; 14:19; 60:21
    key: bdb
    url: https://biblehub.com/hebrew/5342.htm
    quote: "נֵ֫צְר noun masculine sprout, shoot, in figurative uses: — absolute ׳נ Isaiah 11:1; Isaiah 14:19 (simile); construct Isaiah 60:21"
  - where: note 60:21 “The branch of my planting”
    claim: The Church edition's chapter heading for Isa. 11 identifies the stem of Jesse as Christ
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/isa/11?lang=eng
    quote: The stem of Jesse (Christ) will judge in righteousness
  - where: note 60:21 “The branch of my planting”
    claim: D&C 113:1–2 identifies the Stem of Jesse as Christ
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/113?lang=eng
    quote: "Verily thus saith the Lord: It is Christ."
  - where: note 60:22 “I will hasten it in its time”
    claim: The Lord promises the smallest will become a thousand; He will fulfil it rapidly when the fixed time arrives
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/60.htm
    quote: Jehovah will fulfil it rapidly, when the point of time (καιρός) which He has fixed for it shall have arrived.
  - where: note 60:22 “I will hasten it in its time”
    claim: The reason redemption is delayed, as chapter 59 explains, is the people's iniquities
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/59.htm
    quote: The reason why redemption is delayed, is not that the power of Jehovah has not been sufficient for it
  - where: note 60:22 “I will hasten it in its time”
    claim: D&C 88, given in 1832, says "I will hasten my work in its time"
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/88?lang=eng
    quote: Revelation given through Joseph Smith the Prophet at Kirtland, Ohio, December 27 and 28, 1832, and January 3, 1833.
  - where: note 60:22 “I will hasten it in its time”
    claim: D&C 65:2 pictures the gospel as the stone cut out of the mountain without hands that fills the whole earth
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/65?lang=eng
    quote: as the stone which is cut out of the mountain without hands shall roll forth, until it has filled the whole earth.
  - where: christ
    claim: The title "Saviour... Redeemer, the mighty One of Jacob" repeats Isa. 49:26 almost verbatim
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/60.htm
    quote: He the Mighty One of Jacob, who has conquered for her, and now causes her to triumph (אני כּי with munach yethib, as in Isaiah 49:26, which passage is repeated almost verbatim here
  - where: parallels
    claim: John's New Jerusalem is built from verses 3, 11, 19–20 (Church edition footnotes link Isa. 60 to Rev. 21:24, 25, 23)
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/isa/60?lang=eng
    quote: Rev. 21:23; 22:5.
  - where: parallels
    claim: D&C 112:23 and D&C 115:5 relate to Isa. 60:2 and 60:1 (Church footnotes)
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/isa/60?lang=eng
    quote: IE ignorance and wickedness. D&C 112:23.
  - where: note 60:6 “Camels, gold, and incense”
    claim: The kings of Tarshish and Sheba bring gifts in Psalm 72:10–11
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/ps/72?lang=eng
    quote: "The kings of Tarshish and of the isles shall bring presents: the kings of Sheba and Seba shall offer gifts."
  - where: explore
    claim: Ps. 72:10–11 is read with Matt. 2 and Isa. 60:1–6 (same set of kings and gifts)
    key: bd-tarshish
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/tarshish?lang=eng
    quote: kings of Tarshish (Ps. 72:10)
  - where: setting
    claim: Huntsman connects the Magi with Isaiah 60:3, 6, including their gifts of gold and incense
    key: huntsman-wise-men-kings
    url: https://www.byunewtestamentcommentary.com/?p=632
    quote: A few verses later some of their gifts, and even the camels that were later assumed to be their conveyance, are mentioned
  - where: note 60:6 “Camels, gold, and incense”
    claim: Huntsman connects the Magi with Isaiah 60:3, 6, including their gifts of gold and incense
    key: huntsman-wise-men-kings
    url: https://www.byunewtestamentcommentary.com/?p=632
    quote: A few verses later some of their gifts, and even the camels that were later assumed to be their conveyance, are mentioned
  - where: note 60:6 “Camels, gold, and incense”
    claim: Huntsman connects the Magi with Psalm 72:10 and Isaiah 60
    key: huntsman-wise-men-kings
    url: https://www.byunewtestamentcommentary.com/?p=632
    quote: certain Old Testament passages, such as Psalm 69:29 and 72:10, that suggested that kings from among the nations would come to Israel bearing gifts. Particularly significant, however, were passages from the prophet Isaiah.
