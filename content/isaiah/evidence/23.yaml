# Evidence ledger for Isaiah 23 (audit, 2026-10-01)
chapter: 23
claims:
  - where: when
    claim: Isaiah prophesied in Jerusalem 740–701 BC
    key: bd-isaiah
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/isaiah?lang=eng
    quote: a prophet in Jerusalem during 40 years, 740–701 B.C.
  - where: setting
    claim: Sidon older; Tyre gained supremacy in the Assyrian era
    key: ot-manual-14
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-14?lang=eng
    quote: Sidon (Zidon) was the older city of the Phoenicians, whereas Tyre was the newer site that had gained supremacy during the Assyrian era.
  - where: setting
    claim: Tyre moved its trade to a small offshore island
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/23.htm
    quote: it had transferred the true seat of its trade and wealth to a small island
  - where: setting
    claim: Phoenicia the center of world trade
    key: ot-manual-14
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-14?lang=eng
    quote: Phoenicia should properly be seen as the center of world trade during this period.
  - where: setting
    claim: Tyre secured its advantages by colonies
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/23.htm
    quote: secured its advantages by colonies and factories
  - where: setting
    claim: Tyre an important commercial seaport; allied with Solomon
    key: bd-tyre
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/tyre?lang=eng
    quote: an important commercial and seaport town of Syria, in alliance with David
  - where: setting
    claim: Tyre closes the oracles against the nations as Babylon opened them (empire and commerce)
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/23.htm
    quote: closes the series of prophecies against the nations, as Stier correctly observes, just as Babylon opened it.
  - where: thread
    claim: Tyre the commercial power, Babylon the imperial power
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/23.htm
    quote: Babylon was the city of the imperial power of the world; Tyre, the city of the commerce of the world.
  - where: thread
    claim: Ships of Tarshish return home and hear the news
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/23.htm
    quote: introducing the trading vessels of Phoenicia on their return home, as they hear with alarm the tidings of the fate that has befallen their home.
  - where: thread
    claim: Tyre a harlot joining the kingdoms of the world; her merchandise put to proper use for the kingdom
    key: ot-manual-14
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-14?lang=eng
    quote: Isaiah 23:18 shows that eventually the merchandise of Tyre (the world) will be put to proper use in building the kingdom of Jehovah.
  - where: note 23:1 “Ships coming home to nothing”
    claim: Tarshish probably Tartessus in Spain; ships of Tarshish the largest ships for long voyages
    key: bd-tarshish
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/tarshish?lang=eng
    quote: Probably Tartessus in Spain; ships of Tarshish (the name came to be used to denote ships of the largest size, suitable for long voyages)
  - where: note 23:1 “Ships coming home to nothing”
    claim: Chittim is Cyprus
    key: bd-chittim
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/chittim?lang=eng
    quote: He gave his name to the island of Chittim, now called Cyprus
  - where: note 23:1 “Ships coming home to nothing”
    claim: Phoenician trading vessels return home and hear the news
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/23.htm
    quote: introducing the trading vessels of Phoenicia on their return home, as they hear with alarm the tidings of the fate that has befallen their home.
  - where: note 23:4 “The sea as a childless mother”
    claim: The sea is the fortress of the sea, the rock-island of Tyre
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/23.htm
    quote: The sea, or more closely considered, the fortress of the sea, i.e., the rock-island on which Neo-tyrus stood with its strong and lofty houses, lifts up its voice in lamentation.
  - where: note 23:4 “The sea as a childless mother”
    claim: Robbed of her children, Tyre is like a barren woman
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/23.htm
    quote: complains that, robbed as she has been of her children, she is like a barren women.
  - where: note 23:8 “Merchants who are princes”
    claim: Merchants honored as great ones
    key: ot-manual-14
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-14?lang=eng
    quote: So renowned had the merchants become that they were honored by their national associates as great ones.
  - where: note 23:8 “Merchants who are princes”
    claim: 'Book of Mormon: riches turn to pride (Alma 4)'
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/4?lang=eng
    quote: lifted up in the pride of their eyes, and to set their hearts upon riches and upon the vain things of the world
  - where: note 23:13 “Assyria or Babylon?”
    claim: Whether the threatening power is Assyrian or Chaldean is an exegetical question
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/23.htm
    quote: is a purely exegetical question, not a critical one.
  - where: note 23:13 “Assyria or Babylon?”
    claim: 'One reading: the Chaldeans laid bare Tyre’s palaces'
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/23.htm
    quote: They (the Chaldeans) have laid bare the palaces
  - where: note 23:15 “Seventy years”
    claim: Seventy a fixed period, ten sevens
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/23.htm
    quote: Seventy is well fitted to be the number used to denote a uniform period of this kind, being equal to 10 x 7
  - where: note 23:15 “Seventy years”
    claim: Coincides with Jeremiah’s seventy years, the Chaldean rule
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/23.htm
    quote: They coincide with the seventy years of Jeremiah (compare 2 Chronicles 36:21), that is to say, with the duration of the Chaldean rule.
  - where: note 23:15 “Seventy years”
    claim: Seventy years may refer to her coming judgments
    key: ot-manual-14
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-14?lang=eng
    quote: The seventy years may refer to her coming judgments.
  - where: note 23:15 “Seventy years”
    claim: Harp passage takes the tone of a popular song
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/23.htm
    quote: The prophecy here falls into the tone of a popular song
  - where: note 23:17 “Commerce as harlotry”
    claim: Tyre, like Babylon, represents the world and joins in its wickedness
    key: ot-manual-14
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-14?lang=eng
    quote: Like Babylon, she was seen as a harlot committing fornication (joining in wickedness) with the kingdoms of the world (see Isaiah 23:15, 17–18; compare Revelation 17:1–2).
  - where: note 23:18 “Holiness to the LORD”
    claim: Not the conversion of Tyre, but something approaching it
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/23.htm
    quote: It is not the conversion of Tyre which is held up to view, but something approaching it.
  - where: note 23:18 “Holiness to the LORD”
    claim: Her gain would supply Israel rather than be capitalized
    key: delitzsch
    url: https://biblehub.com/commentaries/kad/isaiah/23.htm
    quote: but they would give tribute and presents from it to Israel
  - where: note 23:18 “Holiness to the LORD”
    claim: Merchandise put to proper use in building the kingdom
    key: ot-manual-14
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-14?lang=eng
    quote: Isaiah 23:18 shows that eventually the merchandise of Tyre (the world) will be put to proper use in building the kingdom of Jehovah.
