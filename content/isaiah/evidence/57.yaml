chapter: 57
claims:
  - where: when
    claim: 'Manasseh’s reign begins in 697 BC'
    key: bible-chron-ot
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bible-chron/old-testament?lang=eng'
    quote: '697 | Manasseh | 697'
  - where: when
    claim: 'Manasseh’s reign ends in 642 BC, when Amon’s begins'
    key: bible-chron-ot
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bible-chron/old-testament?lang=eng'
    quote: '642 … Amon'
  - where: when
    claim: 'The idolatry described may be coloured by the start of Manasseh’s reign'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/57.htm'
    quote: 'takes his colours from the time in which he himself lived, possibly from the commencement of Manasseh''s reign, when the heathenism that had for a long time been suppressed burst forth again in all its force'
  - where: setting
    claim: 'The idolatry (tree-worship, child sacrifice, stone-worship) recalls Judah’s religion, especially under Manasseh (Delitzsch’s reading, “possibly”)'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/57.htm'
    quote: 'takes his colours from the time in which he himself lived, possibly from the commencement of Manasseh''s reign, when the heathenism that had for a long time been suppressed burst forth again in all its force'
  - where: setting
    claim: 'The refrain closing 57:21 has a more pathetic sound than at 48:22 (the same refrain)'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/57.htm'
    quote: 'With these words, which have even a more pathetic sound here than in Isaiah 48:22, the prophet seals the second book of his prophecies.'
  - where: thread
    claim: 'The Hebrew for “contrite” (dakkaʾ) means crushed'
    key: bdb
    url: 'https://biblehub.com/hebrew/1793.htm'
    quote: 'דַּכָּא adjective contrite (crushed) — דַּכָּא Isaiah 57:15'
  - where: section 1 plain
    claim: 'The righteous are taken away to be saved from the coming punishment; the grave is peace'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/57.htm'
    quote: 'the righteous is swept away "from the evil," i.e., that he may be saved from the approaching punishment (compare 2 Kings 22:20)'
  - where: section 2 plain
    claim: '“Children of transgression” (yilde pesha) in 57:4'
    key: bdb
    url: 'https://biblehub.com/hebrew/6588.htm'
    quote: '׳יִלְדֵי פ Isaiah 57:4'
  - where: section 2 plain
    claim: 'Verse 4: they put the tongue out; verse 5: under the clefts of the rocks'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/57.htm'
    quote: 'Over whom do ye open the mouth wide, and put the tongue out long?'
  - where: section 2 plain
    claim: 'Verse 5 location: under the clefts of the rocks'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/57.htm'
    quote: 'ye slayers of children in the valleys under the clefts of the rocks'
  - where: section 2 plain
    claim: 'Verse 8 zikkaron: “reminder”'
    key: bdb
    url: 'https://biblehub.com/hebrew/2146.htm'
    quote: 'זִכָּרוֺן, זִכָּרֹן noun masculine Ecclesiastes 1:11 memorial, remembrance'
  - where: section 2 plain
    claim: 'Verse 9: Sheol, figurative of extreme degradation'
    key: bdb
    url: 'https://biblehub.com/hebrew/7585.htm'
    quote: '׳שׁ figurative of extreme degradation in sin Isaiah 57:9'
  - where: section 2 plain
    claim: 'Verse 10: “It is hopeless” (nôʾāš)'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/57.htm'
    quote: 'Although they were a great trouble to her, yet she did not say נואש, "it is hopeless;"'
  - where: section 2 plain
    claim: 'Verse 13: “takes refuge” (ḥôseh) in Me'
    key: bdb
    url: 'https://biblehub.com/hebrew/2620.htm'
    quote: 'participle חוֺסֶה Isaiah 57:13'
  - where: section 2 plain
    claim: 'Verse 13: the root ḥāsâ means seek refuge'
    key: bdb
    url: 'https://biblehub.com/hebrew/2620.htm'
    quote: 'seek refuge, with בְּצֵל'
  - where: section 3 plain
    claim: 'Verse 14: sôllû means cast up / build up a highway'
    key: bdb
    url: 'https://biblehub.com/hebrew/5549.htm'
    quote: 'Imperative masculine plural סֹ֫לּוּ Isaiah 57:14'
  - where: section 3 plain
    claim: 'Verse 14: mikšôl is an obstacle or hindrance to the people’s restoration'
    key: bdb
    url: 'https://biblehub.com/hebrew/4383.htm'
    quote: 'as a hindrance to restoration of people Isaiah 57:14.'
  - where: section 3 plain
    claim: 'Verse 15: crushed (dakkaʾ) and humble; “to revive” means to keep alive or restore to life'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/57.htm'
    quote: 'either to keep that which is living alive, or to restore to life that which is dead'
  - where: section 3 plain
    claim: 'Verse 17: “greed” (beṣaʿ) is greedy desire for worldly possession'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/57.htm'
    quote: 'greedy desire for worldly possession, self-seeking, or worldliness generally'
  - where: section 3 plain
    claim: 'Verse 17: šôbāb means backturning, turning away'
    key: bdb
    url: 'https://biblehub.com/hebrew/7726.htm'
    quote: 'שׁוֺבָב adjective backturning, recusant, apostate'
  - where: section 3 plain
    claim: 'Verse 19: “Peace, peace” to those scattered far and near; the wicked like the tossed sea'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/57.htm'
    quote: 'be the portion of those of my people who are scattered far and near'
  - where: note 57:1 “Taken away from the evil to come”
    claim: 'The verb for “taken away” is the Niphal of ʾāsap (be taken away; be gathered to one’s people, Gen. 25:8)'
    key: bdb
    url: 'https://biblehub.com/hebrew/622.htm'
    quote: 'be gathered to one''s fathers אֶלאֲֿבוֺתָיו׳נֶא Judges 2:10; elsewhere to one''s people אֶלעַֿמָּיו (all P) Genesis 25:8,17'
  - where: note 57:1 “Taken away from the evil to come”
    claim: 'Isa. 57:1 uses the same verb in the sense be taken away, removed'
    key: bdb
    url: 'https://biblehub.com/hebrew/622.htm'
    quote: 'be taken away, removed, perish, of men Isaiah 57:1 (twice in verse)'
  - where: note 57:1 “Taken away from the evil to come”
    claim: 'The same verb is used of Josiah in 2 Kings 22:20'
    key: bdb
    url: 'https://biblehub.com/hebrew/622.htm'
    quote: 'אֶלקִֿבְרֹתֶיךָ 2 Kings 22:20 2Chronicles 34:28'
  - where: note 57:1 “Taken away from the evil to come”
    claim: 'Josiah died at Megiddo before the destruction of Jerusalem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/23?lang=eng'
    quote: 'king Josiah went against him; and he slew him at Megiddo'
  - where: note 57:1 “Taken away from the evil to come”
    claim: 'Jerusalem was burned after Josiah’s death'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/25?lang=eng'
    quote: 'And he burnt the house of the Lord, and the king’s house, and all the houses of Jerusalem'
  - where: note 57:1 “Taken away from the evil to come”
    claim: 'The “beds” are the grave; the people do not lay to heart what the early death means'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/57.htm'
    quote: '"they rest upon their beds," viz., the bottom of the grave, which has become their mishkâb'
  - where: note 57:1 “Taken away from the evil to come”
    claim: 'No one lays to heart the divine accusation involved in the early death'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/57.htm'
    quote: 'no one lays it to heart, viz., the divine accusation and threat involved in this early death'
  - where: note 57:5 “The religion of the valleys”
    claim: '“Under every green tree” is the standing expression for tree-worship sites from Deut. 12:2'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/57.htm'
    quote: 'a standing expression from Deuteronomy 12:2 downwards'
  - where: note 57:5 “The religion of the valleys”
    claim: 'Heathen altars on hills were to be destroyed (Deut. 12:2–3)'
    key: bd-high-places
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/high-places?lang=eng'
    quote: 'heathen altars were found set up on various hills and were ordered to be destroyed (Num. 33:52; Deut. 12:2–3)'
  - where: note 57:5 “The religion of the valleys”
    claim: 'The slaying of children refers to abominable cult sacrifices (Jer. 7:31)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/57?lang=eng'
    quote: 'IE participating in abominable cult sacrifices. Jer. 7:31; 32:35.'
  - where: note 57:5 “The religion of the valleys”
    claim: 'Molech: god to whom Israel sacrificed children in the valley of Hinnom'
    key: bdb
    url: 'https://biblehub.com/hebrew/4432.htm'
    quote: 'the god to whom Israel sacrificed children with fire (in valley of Hinnom)'
  - where: note 57:5 “The religion of the valleys”
    claim: 'The place “under the clefts of the rocks” points rather to Baal’s high places (Jer. 19:5), not Hinnom (Delitzsch’s reading)'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/57.htm'
    quote: 'the reference is not to the slaying of children sacrificed to Moloch in the valley of Hinnom, but to those offered to Baal upon his bâmōth or high places (Jeremiah 19:5'
  - where: note 57:5 “The religion of the valleys”
    claim: 'The Church edition notes that “the king” in verse 9 may be read melech or molech'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/57?lang=eng'
    quote: 'HEB melech or molech (a horrible idol)'
  - where: note 57:5 “The religion of the valleys”
    claim: 'Molech is a deliberate form of melek, “king”'
    key: bdb
    url: 'https://biblehub.com/hebrew/4432.htm'
    quote: '(= מֶלֶךְ i.e. (divine) King, with vowels of בּשֶׁת to denote abhorrence'
  - where: note 57:5 “The religion of the valleys”
    claim: 'The older reading takes “the king” as the Asiatic ruler of the world (Delitzsch)'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/57.htm'
    quote: 'so that "the king," is not Baal, or any heathen god whatever (according to Isaiah 8:21 and Zephaniah 1:5), but the Asiatic ruler of the world.'
  - where: note 57:5 “The religion of the valleys”
    claim: 'Oil and spices are gifts taken to win favour; messengers sent far; abasement as low as Hades'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/57.htm'
    quote: 'the oil and spices are thought of here as presents'
  - where: note 57:5 “The religion of the valleys”
    claim: '“Even unto hell” is Sheol, figurative of extreme degradation'
    key: bdb
    url: 'https://biblehub.com/hebrew/7585.htm'
    quote: '׳שׁ figurative of extreme degradation in sin Isaiah 57:9'
  - where: note 57:5 “The religion of the valleys”
    claim: 'Verse 11 shows the words refer to fear of man'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/57.htm'
    quote: 'a single glance at Isaiah 57:11 is sufficient to show that the words refer to a servile coquetry from the fear of man'
  - where: note 57:6 “A portion among the stones”
    claim: 'ḥelqēk (“thy portion”): among the smooth stones of a brook-bed is thy chosen life'
    key: bdb
    url: 'https://biblehub.com/hebrew/2506.htm'
    quote: 'בְּחַלְּקֵינַֿחַל חֶלְקֵךְ Isaiah 57:6 among smooth (things i.e. stones) of a brook-bed is thy chosen life'
  - where: note 57:6 “A portion among the stones”
    claim: 'Heleq: portion, tract, territory (inheritance)'
    key: bdb
    url: 'https://biblehub.com/hebrew/2506.htm'
    quote: 'I. חֵ֫לֶק noun masculineJoshua 18:5 portion, tract, territory'
  - where: note 57:6 “A portion among the stones”
    claim: 'The smooth-word and portion-word form a play on words'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/57.htm'
    quote: 'which forms here a play upon the word with חלק'
  - where: note 57:6 “A portion among the stones”
    claim: 'The stones are those a stream has washed smooth (compare 1 Sam. 17:40)'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/57.htm'
    quote: 'according to 1 Samuel 17:40 (where the intensive form חלּוּק, like שׁכּוּל, is used), are stones which the stream in the valley has washed smooth with time'
  - where: note 57:6 “A portion among the stones”
    claim: 'The stones are objects of worship, with libations and meat-offerings'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/57.htm'
    quote: 'but to objects of worship for which they had exchanged Jehovah'
  - where: note 57:6 “A portion among the stones”
    claim: 'Portion and lot echo Ps. 16:5'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/57.htm'
    quote: 'of whom the true Israelite could say ה חלקי, Psalm 119:57, etc., or בה לי חלק, Joshua 22:25, and גּורלי תּומיך אתּה (Thou art He that maintaineth my lot), Psalm 16:5'
  - where: note 57:6 “A portion among the stones”
    claim: 'The verb of “Should I receive comfort” is nḥm (comfort oneself); the same root as nahamu in 40:1'
    key: bdb
    url: 'https://biblehub.com/hebrew/5162.htm'
    quote: 'comfort oneself, ease oneself, by taking vengeance with מן Isaiah 1:24; על Isaiah 57:6.'
  - where: note 57:6 “A portion among the stones”
    claim: 'The root nḥm appears in the imperative at 40:1'
    key: bdb
    url: 'https://biblehub.com/hebrew/5162.htm'
    quote: 'Imperative נַחֲמוּ Isaiah 40:1 (twice in verse)'
  - where: note 57:6 “A portion among the stones”
    claim: 'Isa. 40:1 opens with “Comfort ye, comfort ye my people”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/40?lang=eng'
    quote: 'Comfort ye, comfort ye my people, saith your God.'
  - where: note 57:6 “A portion among the stones”
    claim: 'The question means that descendants like their fathers could not go unpunished'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/57.htm'
    quote: 'The meaning of the question, Shall I comfort myself concerning such things? - i.e., Shall I be contented with them'
  - where: note 57:8 “A reminder behind the door”
    claim: 'Mezuzah is the Hebrew word for doorpost, used in Isa. 57:8'
    key: bdb
    url: 'https://biblehub.com/hebrew/4201.htm'
    quote: 'מְזוּזָה noun feminine door-post, gate-post, absolute ׳מ Exodus 21:6; Isaiah 57:8'
  - where: note 57:8 “A reminder behind the door”
    claim: 'The mezuzah of Deut. 6:9 is the one on the house doorpost; Isa. 57:8 compared'
    key: bdb
    url: 'https://biblehub.com/hebrew/4201.htm'
    quote: 'of dwelling-house Exodus 12:7 (P), Exodus 12:22; Exodus 12:23; Exodus 21:6 (all J E), Deuteronomy 6:9; Deuteronomy 11:20 compare Isaiah 57:8'
  - where: note 57:8 “A reminder behind the door”
    claim: 'Zikkaron (zikrônēk) in 57:8 is variously read: symbol of a strange god, or perhaps a phallus-image'
    key: bdb
    url: 'https://biblehub.com/hebrew/2146.htm'
    quote: '׳ז in Isaiah 57:8 is symbol of strange god (Di), or perhaps phallus-image, as sign of harlot (Che)'
  - where: note 57:8 “A reminder behind the door”
    claim: 'Delitzsch’s reading: the reminder is the declaration of Jehovah written on the doorposts (Deut. 6:9), hidden behind the door'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/57.htm'
    quote: 'she had put behind the door and post, that she might not be reminded, to her shame, of her unfaithfulness'
  - where: note 57:8 “A reminder behind the door”
    claim: 'The gods of the heathen are the lovers; Ezekiel 23 is a parallel picture'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/57.htm'
    quote: 'The lovers that she sought for herself are the gods of the heathen.'
  - where: note 57:8 “A reminder behind the door”
    claim: 'Ezekiel’s picture of Aholah and Aholibah is a commentary on Isa. 57:3–10'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/57.htm'
    quote: 'Ezekiel''s picture of Aholah and Aholibah is like a commentary on Isaiah 57:3-10 (see Ezekiel 23).'
  - where: note 57:11 “When God is silent”
    claim: 'The long-suffering of God had not led the people to repentance; silence of wrath toward the mass of the people'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/57.htm'
    quote: 'were as forgetful of God as ever, and would not be led to repentance by the long-suffering of God'
  - where: note 57:11 “When God is silent”
    claim: 'The silence is of help for the faithful and of wrath for the mass of the people (Isa. 42:14 compared)'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/57.htm'
    quote: 'a time of divine silence: the silence of His help so fas as the servants of Jehovah were concerned, but the silence of His wrath as to the great mass of the people'
  - where: note 57:11 “When God is silent”
    claim: 'The people feared men, not the Lord'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/57.htm'
    quote: 'From fear of man, Israel, and still more Judah, had given up the fear of Jehovah.'
  - where: note 57:14 “Prepare the way, again”
    claim: 'The same appeal occurs in Isa. 40:3–4, 57:14, and 62:10'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/57.htm'
    quote: 'This is the very same appeal which occurs once in all three books of these prophecies (Isaiah 40:3-4; Isaiah 57:14; Isaiah 62:10).'
  - where: note 57:14 “Prepare the way, again”
    claim: 'mikšôl, “stumblingblock”, is a hindrance to restoration of the people'
    key: bdb
    url: 'https://biblehub.com/hebrew/4383.htm'
    quote: 'as a hindrance to restoration of people Isaiah 57:14.'
  - where: note 57:15 “The high and lofty One”
    claim: 'rām wənissāʾ is used of God in Isa. 57:15; participle rām is used of the throne in 6:1'
    key: bdb
    url: 'https://biblehub.com/hebrew/7311.htm'
    quote: 'b. especially of ׳י, רָם וְנִשָׂא Isaiah 57:15'
  - where: note 57:15 “The high and lofty One”
    claim: 'rām is used of the throne in Isa. 6:1 and of mountains and trees in Isa. 2:13–14'
    key: bdb
    url: 'https://biblehub.com/hebrew/7311.htm'
    quote: 'of mountains Isaiah 2:14; Deuteronomy 12:2, hill Ezekiel 6:13; Ezekiel 20:28; Ezekiel 34:6, throne Isaiah 6:1, trees = tall Isaiah 2:13'
  - where: note 57:15 “The high and lofty One”
    claim: 'šōkēn ʿad: ʿad used of divine existence; “the eternally dwelling One” (Delitzsch)'
    key: bdb
    url: 'https://biblehub.com/hebrew/5703.htm'
    quote: 'd. of divine existence, שֹׁכֵן עַד Isaiah 57:15'
  - where: note 57:15 “The high and lofty One”
    claim: 'ʿad šōkēn can be read “the eternally dwelling One”'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/57.htm'
    quote: 'עד שׁכן must mean the eternally ( equals לעד) dwelling One, i.e., He whose life lasts for ever and is always the same.'
  - where: note 57:15 “The high and lofty One”
    claim: 'šākan is used of God dwelling, including Exod. 25:8 and Isa. 57:15'
    key: bdb
    url: 'https://biblehub.com/hebrew/7931.htm'
    quote: 'c. of God: בָּֽעֲרָפֶל ׳שׁ 1 Kings 8:12 2Chronicles 6:1 (poem); מָרוֺם Isaiah 33:5; עַד Isaiah 57:15; מָרוֺם וְקָדוֺשׁ Isaiah 57:15'
  - where: note 57:15 “The high and lofty One”
    claim: 'miškān (tabernacle, dwelling place) comes from šākan'
    key: bdb
    url: 'https://biblehub.com/hebrew/4908.htm'
    quote: 'from shakan'
  - where: note 57:15 “The high and lofty One”
    claim: 'God dwells both in the height and with the crushed and lowly of spirit'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/57.htm'
    quote: 'But He also dwells with (את as in Leviticus 16:16) the crushed and lowly of spirit.'
  - where: note 57:15 “The crushed and the humble”
    claim: '“Contrite” is dakkaʾ, crushed'
    key: bdb
    url: 'https://biblehub.com/hebrew/1793.htm'
    quote: 'דַּכָּא adjective contrite (crushed) — דַּכָּא Isaiah 57:15'
  - where: note 57:15 “The crushed and the humble”
    claim: 'Isa. 53:5 uses the Pual participle of the same root (dkʾ): crushed'
    key: bdb
    url: 'https://biblehub.com/hebrew/1792.htm'
    quote: 'Participle מְדֻכָּא Isaiah 53:5'
  - where: note 57:15 “The crushed and the humble”
    claim: 'The verb dkʾ in Isa. 53:10: the Servant crushed, Yahweh subject'
    key: bdb
    url: 'https://biblehub.com/hebrew/1792.htm'
    quote: 'servant of Yahweh Isaiah 53:10 (׳י subject)'
  - where: note 57:15 “The crushed and the humble”
    claim: '“To revive” means to restore to life'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/57.htm'
    quote: 'either to keep that which is living alive, or to restore to life that which is dead'
  - where: note 57:19 “Peace to the far and the near”
    claim: 'God will not contend forever, lest human life be destroyed (57:16)'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/57.htm'
    quote: 'if God should put no restraint upon His wrath, the consequence would be the entire destruction of human life'
  - where: note 57:19 “Peace to the far and the near”
    claim: '“Peace, peace” means lasting and perfect peace (as in Isa. 26:3)'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/57.htm'
    quote: 'i.e., lasting and perfect peace (as in Isaiah 26:3)'
  - where: note 57:19 “Peace to the far and the near”
    claim: 'The far and near are probably scattered Israel (Isa. 43:5–7; 49:12), compare Eph. 2:17'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/57.htm'
    quote: 'be the portion of those of my people who are scattered far and near" (Isaiah 43:5-7; Isaiah 49:12; compare the application to heathen and Jews in Ephesians 2:17)'
  - where: note 57:21 “The refrain returns”
    claim: 'The wicked are like the restless sea; their nature is perpetual disturbance'
