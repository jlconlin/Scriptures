chapter: 44
claims:
  - where: when
    claim: The chapter is addressed to exiles in Babylon in the sixth century BC (Persian empire under Cyrus begins 559; Cyrus's decree 537, per the Church's chronology)
    key: bible-chron-ot
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bible-chron/old-testament?lang=eng'
    quote: '537 | Decree of Cyrus for the return of the Jews.'
  - where: 'note 44:2 “Jeshurun, the upright one”'
    claim: Jeshurun is a rare poetic name for Israel, found in Deuteronomy 32:15; 33:5, 26 and Isaiah 44:2; it means "upright one" and designates Israel under its ideal character
    key: bdb
    url: 'https://biblehub.com/hebrew/3484.htm'
    quote: 'יְשֻׁרוּן proper name, masculine (upright one) Deuteronomy 32:15; Deuteronomy 33:5,26; Isaiah 44:2; poetic name of Israel, designating it under its ideal character'
  - where: 'note 44:2 “Jeshurun, the upright one”'
    claim: The name is related to yāšar, "straight, right, upright"
    key: bdb
    url: 'https://biblehub.com/hebrew/3477.htm'
    quote: 'יָשָׁר adjective straight, right;'
  - where: 'note 44:3 “Water and Spirit”'
    claim: In the verse the water image is explained as the Spirit poured out on the seed (Delitzsch reads the promise as the pouring out of the Spirit and of blessing)
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/44.htm'
    quote: 'there is here presented the promise of the pouring out of the Spirit and of blessing'
  - where: 'note 44:3 “Water and Spirit”'
    claim: At each day of the Feast of Tabernacles a water libation was poured out at the temple
    key: je-water-drawing
    url: 'https://www.jewishencyclopedia.com/articles/14794-water-drawing-feast-of'
    quote: 'At the morning service on each of the seven days of the Feast of Tabernacles (Sukkot) a libation of water was made together with the pouring out of wine'
  - where: 'note 44:5 “Writing “The LORD’s” on the hand”'
    claim: Hebrew yikhtōb is "will write" (Qal imperfect)
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/isaiah/44-5.htm'
    quote: 'yiḵ·tōḇ יִכְתֹּ֤ב will write V‑Qal‑Imperf‑3ms'
  - where: 'note 44:5 “Writing “The LORD’s” on the hand”'
    claim: The Septuagint has the person write with his hand "I am God's"
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/isaiah/44.htm'
    quote: 'another shall write with his hand, I am God''s, and shall call himself by the name of Israel.'
  - where: 'note 44:5 “Writing “The LORD’s” on the hand”'
    claim: One reading is "write on his hand" (following the LXX); the objection is that the Hebrew would need "on" and that tattooing was prohibited (Lev. 19:28); Delitzsch's own reading is a written declaration of belonging to Jehovah alone
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/44.htm'
    quote: 'kâthabh, with an accusative of the writing materials, would be unprecedented (the construction required would be על־ידו), this view is overthrown by the fact that tatooing was prohibited by the Israelitish law (Leviticus 19:28'
  - where: 'note 44:5 “Writing “The LORD’s” on the hand”'
    claim: The three who claim a name are read as the heathen (Gentiles), who will count it the greatest honour to belong to the Lord and His people, so that the name Israel becomes a name of honour
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/44.htm'
    quote: 'the heathen, to whose giddūphı̄m (blasphemies) Israel has hitherto been given up, will count it the greatest honour to belong to Jehovah and His people.'
  - where: 'note 44:5 “Writing “The LORD’s” on the hand”'
    claim: Latter-day Saint teaching that those of non-Israelite lineage are adopted into the house of Israel
    key: bd-abraham-covenant
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/abraham-covenant-of?lang=eng'
    quote: 'Those of non-Israelite lineage, commonly known as Gentiles, are adopted into the house of Israel and become heirs of the covenant and the seed of Abraham through the ordinances of the gospel (Gal. 3:26–29).'
  - where: 'note 44:5 “Writing “The LORD’s” on the hand”'
    claim: Patriarchal blessings declare a person's lineage in Israel
    key: gs-patriarchal-blessings
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/patriarchal-blessings?lang=eng'
    quote: 'declares that person’s lineage in the house of Israel.'
  - where: 'note 44:8 “No other Rock”'
    claim: The Hebrew word in the second half of the verse is ṣûr, "Rock"
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/isaiah/44-8.htm'
    quote: 'ṣūr צ֖וּר Rock N‑ms'
  - where: 'note 44:8 “No other Rock”'
    claim: '"No rock" means no ground of trust'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/44.htm'
    quote: 'There is no rock (i.e., no ground of trust, Isaiah 26:4; Isaiah 17:10), I know of none (beside me)'
  - where: 'note 44:12 “The god-maker gets tired”'
    claim: Kimball observed that many people spend most of their time working in the service of a self-image built on money, property and possessions to guarantee security
    key: kimball-false-gods
    url: 'https://www.churchofjesuschrist.org/study/ensign/1976/06/the-false-gods-we-worship?lang=eng'
    quote: 'Many people spend most of their time working in the service of a self-image that includes sufficient money, stocks, bonds, investment portfolios, property, credit cards, furnishings, automobiles, and the like to guarantee carnal security'
  - where: 'note 44:12 “The god-maker gets tired”'
    claim: Isaiah 40:28 says the true God "fainteth not, neither is weary"
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/40?lang=eng'
    quote: 'the Lord, the Creator of the ends of the earth, fainteth not, neither is weary?'
  - where: 'note 44:20 “Shepherding ashes, and a lie in the hand”'
    claim: '"He feedeth on ashes" is rōʿeh ʾēper (Hebrew: "He grazes on ashes")'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/isaiah/44-20.htm'
    quote: 'rō·‘eh רֹעֶ֣ה He grazes V‑Qal‑Prtcpl‑ms ... ’ê·p̄er, אֵ֔פֶר on ashes N‑ms'
  - where: 'note 44:20 “Shepherding ashes, and a lie in the hand”'
    claim: The verb rāʿâ means to pasture or tend, here figuratively of the idolater
    key: bdb
    url: 'https://biblehub.com/hebrew/7462.htm'
    quote: 'b. figurative of idolater, Isaiah 44:20 he feedeth on ashes (accusative)'
  - where: 'note 44:20 “Shepherding ashes, and a lie in the hand”'
    claim: One reading takes the sense as striving after ashes, things easily scattered, perishable and worthless; all that belongs to idolatry is sheqer, a fabrication and a lie; rāʿâ means primarily to pasture or tend
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/44.htm'
    quote: 'He who makes ashes, i.e., things easily scattered, perishable, and worthless, the object of his effort and striving'
  - where: 'note 44:20 “Shepherding ashes, and a lie in the hand”'
    claim: The Septuagint reads "their heart is ashes"
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/isaiah/44.htm'
    quote: 'Know thou that their heart is ashes, and they err'
  - where: 'note 44:20 “Shepherding ashes, and a lie in the hand”'
    claim: Cyrus's "my shepherd" (rōʿî, verse 28) is the same verb (Strong's 7462) as "feedeth" in verse 20
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/isaiah/44-28.htm'
    quote: '7462 [e] rō·‘î, רֹעִ֔י [He is] My shepherd V‑Qal‑Prtcpl‑msc'
  - where: 'note 44:20 “Shepherding ashes, and a lie in the hand”'
    claim: '"All that belongs to idolatry is sheqer, a fabrication and a lie"'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/44.htm'
    quote: 'All that belongs to idolatry is sheqer - a fabrication and a lie.'
  - where: 'note 44:22 “Like a cloud”'
    claim: The point of comparison is the facility and rapidity with which sins are expunged, as when the Lord's wind sweeps away the clouds and restores the blue sky
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/44.htm'
    quote: 'the point of comparison is not the dark, heavy multitude of sins, but the facility and rapidity with which they are expunged.'
  - where: 'note 44:22 “Like a cloud”'
    claim: Forgiveness and redemption are not offered on condition of conversion; Israel is called to respond
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/44.htm'
    quote: 'Forgiveness and redemption are not offered on condition of conversion, but the mercy of God comes to Israel in direct contrast to what its works deserve'
  - where: 'note 44:28 “Cyrus by name”'
    claim: Cyrus (Persian king) captured Babylon and issued a decree allowing the Jews to return and rebuild the temple
    key: bd-cyrus
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/cyrus?lang=eng'
    quote: 'He captured Babylon and overthrew the Chaldean dynasty ... He issued a decree allowing the Jews to return to the land of Judah and rebuild the temple'
  - where: 'note 44:28 “Cyrus by name”'
    claim: Kōresh is the name Kuru (Cyrus) Hebraized
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/44.htm'
    quote: 'Cyrus is called Kuru or Khuru upon the monuments ... and Kōresh is simply the name of Kuru (Κῦρ-ος) Hebraized after the manner of a segholate.'
  - where: 'note 44:28 “Cyrus by name”'
    claim: The Hebrew word is koresh, Persian king, conqueror of Babylon, restorer of Jews (Isa. 44:28)
    key: bdb
    url: 'https://biblehub.com/hebrew/3566.htm'
    quote: 'Cyrus (Persian K''ur''u(š) ... ) — king of (Anzan = Susiana ... and) Persia, conqueror of Babylon ... restorer of Jews to Palestine Isaiah 44:28'
  - where: 'note 44:28 “Cyrus by name”'
    claim: Hebrew rōʿî is "[He is] My shepherd"
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/isaiah/44-28.htm'
    quote: 'rō·‘î, רֹעִ֔י [He is] My shepherd'
  - where: 'note 44:28 “Cyrus by name”'
    claim: '"Shepherd" was a royal title in Mesopotamia; Hammurabi''s prologue has "Hammurapi, the shepherd, called of Ellil"'
    key: rogers-cuneiform
    url: 'https://archive.org/stream/cuneiformparalle00roge/cuneiformparalle00roge_djvu.txt'
    quote: 'Hammurapi, the shepherd, called of Ellil, am I, who heaps up (55) plenty and abundance'
  - where: 'note 44:28 “Cyrus by name”'
    claim: Delitzsch reads "my shepherd" as a shepherd of the people appointed by the Lord
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/44.htm'
    quote: 'That saith to Koresh, My shepherd (i.e., a ποιμὴν λαῶν appointed by me), and he who performs all my will'
  - where: 'note 44:28 “Cyrus by name”'
    claim: The Septuagint reads "Who bids Cyrus be wise"
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/isaiah/44.htm'
    quote: 'Who bids Cyrus be wise, and he shall perform all my will'
  - where: 'note 44:28 “Cyrus by name”'
    claim: Cyrus's rise falls in the period of the Persian empire and the return decree (period timeline)
    key: bible-chron-ot
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bible-chron/old-testament?lang=eng'
    quote: '559 | | Commencement of the Persian Empire under Cyrus.'
