# Evidence ledger for Isaiah 16 (audit, 2026-10-01)
chapter: 16
claims:
  - where: when
    claim: Isaiah 13–23 gives pronouncements on nations of Isaiah’s time, Moab among them
    key: ot-manual-14
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-14?lang=eng'
    quote: pronouncements upon nations of Isaiah’s time
  - where: setting
    claim: Verse 1 is a summons to send a ruler’s tribute of lambs to Zion for protection
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/16.htm'
    quote: Send a land-ruler's tribute of lambs from Sela desert-wards to the mountain of the daughter of Zion.
  - where: thread
    claim: Delitzsch reads vv. 3–4 as the Moabites’ own petition to Zion
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/16.htm'
    quote: stand before Zion praying most earnestly for shelter and protection
  - where: thread
    claim: Delitzsch reads v. 6 as a new stage beginning with Moab’s sin, contrasting earlier self-exaltation
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/16.htm'
    quote: the prophecy enters here upon a new stage, commencing with Moab's sin
  - where: thread
    claim: The Davidic King of v. 5 is linked to Isa 9:6
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/16.htm'
    quote: who can here fail to recall to mind the words of Isaiah 9:6
  - where: "note 16:1 \u201CMoab\u2019s lambs\u201D"
    claim: The lambs are a ruler’s tribute sent to turn to Zion for protection
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/16.htm'
    quote: the summons goes forth to the Moabites, who have fled to Edom, and even to Sela, i.e., Petra (Wady Musa), near Mount Hor in Arabia Petraea, to which it gave its name, to turn for protection to Jerusalem.
  - where: "note 16:2 \u201CBirds pushed from the nest\u201D"
    claim: The fords of the Arnon lay on Moab’s own soil
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/16.htm'
    quote: on the very soil of their old home
  - where: "note 16:3 \u201CSheltering refugees\u201D"
    claim: The petition asks for shade so dark they are not seen by the foe; “do not betray the wanderers”
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/16.htm'
    quote: in the light of the noon-day sun they desire to be covered with the protecting shade of Zion as with the blackness of night, that they may not be seen by the foe.
  - where: "note 16:5 \u201CA throne built on mercy\u201D"
    claim: chesed is used of keeping the covenants, including the Davidic covenant
    key: bdb
    url: 'https://biblehub.com/hebrew/2617.htm'
    quote: promised in the Davidic covenant
  - where: "note 16:5 \u201CA throne built on mercy\u201D"
    claim: The Targum takes the verse as messianic
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/16.htm'
    quote: The Messianic times must therefore have dawned (so the Targum understands it)
  - where: "note 16:5 \u201CA throne built on mercy\u201D"
    claim: Grace and truth, justice and righteousness are the signs of those times
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/16.htm'
    quote: since grace and truth (chesed ve'emeth) and "justice and righteousness" (mishpât ūtzedâkâh) are the divino-human signs of those times
  - where: "note 16:6 \u201CPride keeps the door closed\u201D"
    claim: The heaping up of words of one stem shows how thoroughly haughty Moab was
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/16.htm'
    quote: The heaping up of words of the same verbal stem (cf., Isaiah 3:1) is here intended to indicate how thoroughly haughty was their haughtiness
  - where: "note 16:6 \u201CPride keeps the door closed\u201D"
    claim: 'Benson: central feature of pride is enmity'
    key: benson-pride
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1989/04/beware-of-pride?lang=eng'
    quote: The central feature of pride is enmity—enmity toward God and enmity toward our fellowmen.
  - where: "note 16:6 \u201CPride keeps the door closed\u201D"
    claim: 'Benson: we pit our will against God’s'
    key: benson-pride
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1989/04/beware-of-pride?lang=eng'
    quote: We pit our will against God’s.
  - where: "note 16:8 \u201CMoab\u2019s vineyards\u201D"
    claim: The sea of Jazer is probably a large pool, not certain
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/16.htm'
    quote: But what sea can the sea of Jazer be? Probably some celebrated large pool
  - where: "note 16:11 \u201CA heart that moans like a harp\u201D"
    claim: meʿim figuratively = seat of emotions, pity (Isa 16:11) and God’s compassion (Jer 31:20)
    key: bdb
    url: 'https://biblehub.com/hebrew/4578.htm'
    quote: 'figurative = seat of emotions: pity, Isaiah 16:11'
  - where: "note 16:14 \u201CCounted exactly\u201D"
    claim: 'A hireling’s years are exact: three years, rather under than over'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/16.htm'
    quote: 'The statement as to the time, therefore, is intended to be taken exactly: three years, not more, rather under than over.'
  - where: parallels
    claim: Jeremiah 48 takes up the lament over Moab’s pride and vintage
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/16.htm'
    quote: as Jeremiah adds in Jeremiah 48:29-30
  - where: 'note 16:1 “Moab’s lambs”'
    claim: "Mesha of Moab rendered lambs and rams as tribute to Israel's king"
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/3?lang=eng'
    quote: 'Mesha king of Moab was a sheepmaster, and rendered unto the king of Israel an hundred thousand lambs'
  - where: 'note 16:14 “Counted exactly”'
    claim: 'Isa 21:16 uses the years-of-an-hireling expression'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/21?lang=eng'
    quote: 'Within a year, according to the years of an hireling'
