chapter: 38
claims:
- where: setting
  claim: Hezekiah reigned twenty-nine years
  key: lds-scriptures
  url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/18?lang=eng
  quote: and he reigned twenty and nine years in Jerusalem.
- where: setting
  claim: Hezekiah reigned twenty-nine years; fifteen added places the illness in the Assyrian invasion year
  key: delitzsch
  url: https://biblehub.com/commentaries/kad/isaiah/38.htm
  quote: in the year of the Assyrian invasion (Isaiah 36:1), since Hezekiah reigned twenty-nine years, and fifteen of these are promised here
- where: setting
  claim: Hezekiah reigned 29 years; Assyrian invasion under Sennacherib
  key: bd-hezekiah
  url: https://www.churchofjesuschrist.org/study/scriptures/bd/hezekiah?lang=eng
  quote: A year later Hezekiah died, after a reign of 29 years.
- where: setting
  claim: Verse 6 promises deliverance from Assyria still to come
  key: lds-scriptures
  url: https://www.churchofjesuschrist.org/study/scriptures/ot/isa/38?lang=eng
  quote: And I will deliver thee and this city out of the hand of the king of Assyria
- where: setting
  claim: Chapter 39 ends with a word about Babylon
  key: lds-scriptures
  url: https://www.churchofjesuschrist.org/study/scriptures/ot/isa/39?lang=eng
  quote: 'shall be carried to Babylon: nothing shall be left, saith the Lord.'
- where: setting
  claim: Chapters 36–37 close the Assyrian matter; 38 returns to the time Jerusalem was threatened
  key: delitzsch
  url: https://biblehub.com/commentaries/kad/isaiah/38.htm
  quote: we are carried back to the time when Jerusalem was still threatened by the Assyrian
- where: setting
  claim: Kings has the promise to go up to the temple on the third day
  key: lds-scriptures
  url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/20?lang=eng
  quote: on the third day thou shalt go up unto the house of the Lord.
- where: when
  claim: The illness fell in the Assyrian crisis
  key: delitzsch
  url: https://biblehub.com/commentaries/kad/isaiah/38.htm
  quote: It is within this period, and indeed in the year of the Assyrian invasion
- where: note 38:1 “Set thine house in order”
  claim: Hebrew ṣaw lĕbêtekā, “give command to your house”
  key: biblehub-interlinear
  url: https://biblehub.com/interlinear/isaiah/38-1.htm
  quote: ṣaw צַ֣ו Set in order V‑Piel‑Imp‑ms 1004 [e] lə·ḇê·ṯe·ḵā, לְבֵיתֶ֔ךָ your house
- where: note 38:1 “Set thine house in order”
  claim: It means to make known his last will to his family; construed like Ahithophel’s charge
  key: delitzsch
  url: https://biblehub.com/commentaries/kad/isaiah/38.htm
  quote: '"Give command to thy house" (ל, cf., אל, 2 Samuel 17:23) is equivalent to, "Make known thy last will to thy family"'
- where: note 38:1 “Set thine house in order”
  claim: Hezekiah had no heir; Manasseh not yet born
  key: delitzsch
  url: https://biblehub.com/commentaries/kad/isaiah/38.htm
  quote: Isaiah 38:19 reminds us that Manasseh, who was twelve years old when he succeeded his father, was not yet born
- where: note 38:1 “Set thine house in order”
  claim: Hezekiah wept because he would die without an heir to the throne
  key: delitzsch
  url: https://biblehub.com/commentaries/kad/isaiah/38.htm
  quote: it was a dreadful thing to him to have to die without an heir to the throne
- where: note 38:1 “Set thine house in order”
  claim: Manasseh was twelve when he began to reign
  key: lds-scriptures
  url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/21?lang=eng
  quote: Manasseh was twelve years old when he began to reign
- where: note 38:2 “Face to the wall”
  claim: He turned to the wall to retire into himself and God; “in truth” means without wavering
  key: delitzsch
  url: https://biblehub.com/commentaries/kad/isaiah/38.htm
  quote: The sick man turned his face towards the wall
- where: note 38:2 “Face to the wall”
  claim: “In truth” means without wavering or hypocrisy; whole heart as in 1 Kgs 8:61
  key: delitzsch
  url: https://biblehub.com/commentaries/kad/isaiah/38.htm
  quote: '"In truth," i.e., without wavering or hypocrisy. שׁלם בלב, with a complete or whole heart, as in 1 Kings 8:61'
- where: note 38:5 “A sentence revised”
  claim: Verse 1 announcement unconditional; condition unexpressed
  key: delitzsch
  url: https://biblehub.com/commentaries/kad/isaiah/38.htm
  quote: The announcement of his death is unconditional and absolute.
- where: note 38:8 “The shadow on the stairs of Ahaz”
  claim: maʿălôt may signify a flight of steps or a degree; an actual succession of steps
  key: delitzsch
  url: https://biblehub.com/commentaries/kad/isaiah/38.htm
  quote: may signify either one of a flight of steps or a degree
- where: note 38:8 “The shadow on the stairs of Ahaz”
  claim: Songs of Degrees titles
  key: lds-scriptures
  url: https://www.churchofjesuschrist.org/study/scriptures/ot/ps/120?lang=eng
  quote: A Song of degrees.
- where: note 38:8 “The shadow on the stairs of Ahaz”
  claim: The steps of Ahaz were a sun-dial erected by him; the event is presented as a miracle
  key: delitzsch
  url: https://biblehub.com/commentaries/kad/isaiah/38.htm
  quote: '"Steps of Ahaz" was the name given to a sun-dial erected by him.'
- where: note 38:9 “The writing, or a psalm?”
  claim: The song might be headed Mikhtam (as Ps 16); written after recovery as thanksgiving
  key: delitzsch
  url: https://biblehub.com/commentaries/kad/isaiah/38.htm
  quote: The song which follows might be headed Mikhtam, since it has the characteristics of this description of psalm (see at Psalm 16:1).
- where: note 38:9 “The writing, or a psalm?”
  claim: Composed after recovery, a song of thanksgiving
  key: delitzsch
  url: https://biblehub.com/commentaries/kad/isaiah/38.htm
  quote: vayyechi (and he recovered) stamps it as a song of thanksgiving, composed by him after his recovery.
- where: note 38:9 “The writing, or a psalm?”
  claim: 'Strophes: retrospective lament; promise and fulfilment; praise'
  key: delitzsch
  url: https://biblehub.com/commentaries/kad/isaiah/38.htm
  quote: In strophe 3 he now describes how Jehovah promised him help, how this promise put new life into him, and how it was fulfilled
- where: note 38:9 “The writing, or a psalm?”
  claim: Strophe 4 praise for life preserved
  key: delitzsch
  url: https://biblehub.com/commentaries/kad/isaiah/38.htm
  quote: In strophe 4 he rejoices in the preservation of his life as the highest good, and promises to praise God for it as long as he lives.
- where: note 38:9 “The writing, or a psalm?”
  claim: Michtam heading on Ps 16
  key: lds-scriptures
  url: https://www.churchofjesuschrist.org/study/scriptures/ot/ps/16?lang=eng
  quote: Michtam of David.
- where: note 38:9 “The writing, or a psalm?”
  claim: Michtam heading on Ps 56
  key: lds-scriptures
  url: https://www.churchofjesuschrist.org/study/scriptures/ot/ps/56?lang=eng
  quote: Michtam of David
- where: note 38:11 “The LORD, even the LORD”
  claim: Hebrew has yāh twice, not YHWH
  key: biblehub-interlinear
  url: https://biblehub.com/interlinear/isaiah/38-11.htm
  quote: ’er·’eh אֶרְאֶ֣ה I will see V‑Qal‑Imperf‑1cs 3050 [e] yāh, יָ֔הּ YAH N‑proper‑ms 3050 [e] yāh יָ֖הּ YAH
- where: note 38:11 “The LORD, even the LORD”
  claim: 'Jah in the land of the living: the God who reveals Himself among the living; Hades as region of the dead'
  key: delitzsch
  url: https://biblehub.com/commentaries/kad/isaiah/38.htm
  quote: The clause, "Jah in the land of the living," i.e., the God of salvation, who reveals Himself in the land of the living
- where: note 38:12 “A tent pulled down, cloth cut from the loom”
  claim: Tent as nomadic; weaver rolls up finished cloth and cuts the threads
  key: delitzsch
  url: https://biblehub.com/commentaries/kad/isaiah/38.htm
  quote: It is compared to a nomadic tent.
- where: note 38:12 “A tent pulled down, cloth cut from the loom”
  claim: Weaver cuts through the short threads and sets the cloth free
  key: delitzsch
  url: https://biblehub.com/commentaries/kad/isaiah/38.htm
  quote: the weaver cuts through the short threads, and so sets it free
- where: note 38:14 “Undertake for me”
  claim: 'ʿorbēnî: be bail for me; pressure like an unmerciful creditor'
  key: delitzsch
  url: https://biblehub.com/commentaries/kad/isaiah/38.htm
  quote: it presses me like an unmerciful creditor; and to this there is appended the petition, Guarantee me, i.e., be bail for me, answer for me (see at Job 17:3).
- where: note 38:14 “Undertake for me”
  claim: Verb in Isa 38:14 is ʿārab
  key: biblehub-interlinear
  url: https://biblehub.com/interlinear/isaiah/38-14.htm
  quote: ‘ā·rə·ḇê·nî. עָרְבֵֽנִי׃ be my security
- where: note 38:14 “Undertake for me”
  claim: Same verb in Judah’s pledge, Gen 43:9
  key: biblehub-interlinear
  url: https://biblehub.com/interlinear/genesis/43-9.htm
  quote: will guarantee him V‑Qal‑Imperf‑1cs
- where: note 38:14 “Undertake for me”
  claim: Same verb in Job 17:3
  key: biblehub-interlinear
  url: https://biblehub.com/interlinear/job/17-3.htm
  quote: ‘ā·rə·ḇê·nî עָרְבֵ֣נִי my pledge
- where: note 38:17 “Held back from the pit”
  claim: mar doubled for superlative force; “loved him out”
  key: delitzsch
  url: https://biblehub.com/commentaries/kad/isaiah/38.htm
  quote: on the radical signification of mar, which is here doubled, to give it a superlative force
- where: note 38:17 “Held back from the pit”
  claim: ḥāšaq is love as a firm inward bond; loved him out; chastisement of love
  key: delitzsch
  url: https://biblehub.com/commentaries/kad/isaiah/38.htm
  quote: The Lord meant it for good; the suffering was indeed a chastisement, but it was a chastisement of love.
- where: note 38:17 “Held back from the pit”
  claim: He loved him out of the pit
  key: delitzsch
  url: https://biblehub.com/commentaries/kad/isaiah/38.htm
  quote: He "loved him out," i.e., drew him lovingly out, of the pit of destruction (châshaq, love as a firm inward bond
- where: note 38:17 “Held back from the pit”
  claim: The verb in verse 17 is ḥāšaqtā
  key: biblehub-interlinear
  url: https://biblehub.com/interlinear/isaiah/38-17.htm
  quote: have held back V‑Qal‑Perf‑2ms
- where: note 38:17 “Sins behind His back”
  claim: Casting sins behind as things one does not wish to be reminded of; healing linked to forgiveness
  key: delitzsch
  url: https://biblehub.com/commentaries/kad/isaiah/38.htm
  quote: Casting all his sins behind Him, as men do with things which they do not wish to know, or have no desire to be reminded of
- where: note 38:18 “Can the dead praise God?”
  claim: Sheol is the Hebrew name for the abode of departed spirits
  key: bd-sheol
  url: https://www.churchofjesuschrist.org/study/scriptures/bd/sheol?lang=eng
  quote: The Hebrew name for the abode of departed spirits (corresponding to the Greek Hades)
- where: note 38:18 “Can the dead praise God?”
  claim: Comfortless idea of the future state common in the Psalms; removal only by progressive history of salvation
  key: delitzsch
  url: https://biblehub.com/commentaries/kad/isaiah/38.htm
  quote: We have here that comfortless idea of the future state, which is so common in the Psalms
- where: note 38:18 “Can the dead praise God?”
  claim: Its decisive removal came through the progressive history of salvation
  key: delitzsch
  url: https://biblehub.com/commentaries/kad/isaiah/38.htm
  quote: but the decisive removal of which was only to be effected by the progressive history of salvation.
- where: note 38:19 “Telling the children”
  claim: Manasseh not yet born at the psalm
  key: delitzsch
  url: https://biblehub.com/commentaries/kad/isaiah/38.htm
  quote: Isaiah 38:19 reminds us that Manasseh, who was twelve years old when he succeeded his father, was not yet born
- where: note 38:21 “A poultice of figs”
  claim: Boil = abscess (shechin), not plague-spot; Ex 9:9
  key: delitzsch
  url: https://biblehub.com/commentaries/kad/isaiah/38.htm
  quote: never signifies a plague-spot, but an abscess
- where: note 38:21 “A poultice of figs”
  claim: Figs a well-known emollient to accelerate the swelling; not expected as a specific cure
  key: delitzsch
  url: https://biblehub.com/commentaries/kad/isaiah/38.htm
  quote: 'nor did he expect it to act as a specific, and effect a cure: it was merely intended to promote what had already been declared to be the will of God.'
- where: note 38:21 “A poultice of figs”
  claim: Figs used to accelerate the rising of the swelling
  key: delitzsch
  url: https://biblehub.com/commentaries/kad/isaiah/38.htm
  quote: were used to accelerate the rising of the swelling and the subsequent discharge.
- where: note 38:21 “A poultice of figs”
  claim: Verses 21–22 omitted from their place at the close of verse 6 and added in the margin
  key: delitzsch
  url: https://biblehub.com/commentaries/kad/isaiah/38.htm
  quote: They have been omitted from their place at the close of Isaiah 38:6 through an oversight, and then added in the margin, where they now stand
- where: note 38:21 “A poultice of figs”
  claim: In Kings the material is in its natural place, before the sign
  key: lds-scriptures
  url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/20?lang=eng
  quote: 7 And Isaiah said, Take a lump of figs.
- where: note 38:22 “Up to the temple on the third day”
  claim: 'Kings: on the third day thou shalt go up'
  key: lds-scriptures
  url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/20?lang=eng
  quote: on the third day thou shalt go up unto the house of the Lord.
- where: explore
  claim: 2 Chr 32:24–26 parallel
  key: lds-scriptures
  url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/32?lang=eng
  quote: But Hezekiah rendered not again according to the benefit done unto him; for his heart was lifted up
