# Evidence ledger for Isaiah 3 (audit, 2026-10-01)
chapter: 3
claims:
  - where: 'when'
    claim: 'Isaiah begins to prophesy c. 740 BC; Jerusalem captured by Babylon more than a century later'
    key: bible-chron-ot
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bible-chron/old-testament?lang=eng'
    quote: 'Isaiah begins to prophesy.'
  - where: 'when'
    claim: 'Prophecy belongs to the time of Uzziah-Jotham, when trust in man was the crying sin; the outbreak of wrath began under Ahaz'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/3.htm'
    quote: 'Trusting in man was the crying sin, more especially of the times of Uzziah-Jotham.'
  - where: 'setting'
    claim: 'Time of prosperity and love of ornament in Uzziah-Jotham days'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/3.htm'
    quote: 'that boundless love of ornament which had become prevalent in the time of Uzziah-Jotham'
  - where: 'setting'
    claim: 'Nebuchadnezzar carried off princes, mighty men, craftsmen and smiths; only the poorest remained'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng'
    quote: 'none remained, save the poorest sort of the people of the land'
  - where: 'thread'
    claim: 'Stay and staff as props; leadership falls to capricious youths; no one will bind (chovesh) the ruined state, as in Isa. 1:6'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/3.htm'
    quote: 'He does not want to be a Chobēsh, i.e., a binder, namely of the broken arms, and bones, and ribs of the ruined state (Isaiah 30:26; Isaiah 1:6; Isaiah 61:1).'
  - where: 'thread'
    claim: 'The ornament list is tied to the same indictment: love of ornament and luxury, contrasted with true glory'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/3.htm'
    quote: 'the immeasurable luxury which really existed'
  - where: 'section 3 plain'
    claim: 'The items of finery (anklets, headbands, crescents, earrings, bracelets, veils, perfume bottles, charms, rings, nose rings, festive dresses, mirrors, turbans)'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/3.htm'
    quote: 'the ankle-clasps, and of the head-bands, and of the crescents; the ear-rings, and the arm-chains, and the light veils'
  - where: 'note 3:1 “What a “stay” is”'
    claim: 'mashen and mashenah are masculine and feminine forms of one word, meaning supports of every kind; bread and water are the lowest basis of life; siege famine'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/3.htm'
    quote: 'The two nouns, which are only the masculine and feminine forms of one and the same word'
  - where: 'note 3:1 “What a “stay” is”'
    claim: 'Life is supported by bread and water; Jerusalem perished amid famine in Chaldean times'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/3.htm'
    quote: 'Life is supported by bread and water: it walks, as it were, upon the crutch of bread'
  - where: 'note 3:2 “A list that came true”'
    claim: 'The list: soothsayer (kosem), skilled in muttering (lachash, whispering magical formulas), masters in art = mechanical arts, not magic; artisans carried away in Chaldean captivities; kosem distinguished from true prophet'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/3.htm'
    quote: 'In the Chaldean captivities skilled artisans are particularly mentioned as having been carried away'
  - where: 'note 3:2 “A list that came true”'
    claim: 'Lachash is the muttering of magical formulas; kosem is a soothsayer'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/3.htm'
    quote: 'Lachash is the whispering or muttering of magical formulas'
  - where: 'note 3:2 “A list that came true”'
    claim: 'Babylon took the leadership and craftsmen into exile, leaving the poorest'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng'
    quote: 'none remained, save the poorest sort of the people of the land'
  - where: 'note 3:4 “Capricious children”'
    claim: 'taalulim derives from a verb meaning to meddle, to indulge one’s caprice; the parallel word is neʿarim (young men)'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/3.htm'
    quote: 'The word tâlulim is formed from the reflective verb hithallel, which means to meddle, to gratify one''s self, to indulge one''s caprice.'
  - where: 'note 3:4 “Capricious children”'
    claim: 'Hebrew word in 3:4 is taʿalulim (wᵉtaʿălûlîm)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Isa.xml'
    quote: 'וְ/תַעֲלוּלִ֖ים'
  - where: 'note 3:4 “Capricious children”'
    claim: 'Jehoiachin was eighteen and reigned three months'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/24?lang=eng'
    quote: 'Jehoiachin was eighteen years old when he began to reign, and he reigned in Jerusalem three months'
  - where: 'note 3:7 “No one to bind the wounds”'
    claim: 'The man refuses to be a chobesh, a binder of the ruined state'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/3.htm'
    quote: 'He does not want to be a Chobēsh, i.e., a binder, namely of the broken arms, and bones, and ribs of the ruined state'
  - where: 'note 3:7 “No one to bind the wounds”'
    claim: 'Isa. 1:6 uses the same idea: wounds not closed or bound up'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/1?lang=eng'
    quote: 'wounds, and bruises, and putrifying sores: they have not been closed, neither bound up'
  - where: 'note 3:9 “Sin written on the face”'
    claim: '“Shew of their countenance” means the look of their faces; they display their sin shamelessly'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/3.htm'
    quote: 'The look of their faces testifies against them, and their sin they make known like Sodom, without concealing it'
  - where: 'note 3:9 “Sin written on the face”'
    claim: 'Alma 5:14 asks about the image of God in the countenance'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/5?lang=eng'
    quote: 'Have ye received his image in your countenances?'
  - where: 'note 3:10 “The law of the harvest”'
    claim: 'Alma 41 teaches restoration; Gal. 6:7 states sowing and reaping'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/41?lang=eng'
    quote: 'good for that which is good; righteous for that which is righteous'
  - where: 'note 3:10 “The law of the harvest”'
    claim: 'Paul on sowing and reaping'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/gal/6?lang=eng'
    quote: 'whatsoever a man soweth, that shall he also reap'
  - where: 'note 3:10 “The law of the harvest”'
    claim: 'Verses 10–11 say it goes well with the righteous and ill with the wicked: each enjoys or receives what his hands have done'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/3.htm'
    quote: 'Say of the righteous, that it is well with him; for they will enjoy the fruit of their doings.'
  - where: 'note 3:12 “Women, or extortioners?”'
    claim: 'The Septuagint reads “extortioners rule over you” where the Hebrew has “women”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/isaiah/3.htm'
    quote: 'your exactors strip you, and extortioners rule over you'
  - where: 'note 3:12 “Women, or extortioners?”'
    claim: 'The Hebrew (MT) reads nashim, “women”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Isa.xml'
    quote: 'וְ/נָשִׁ֖ים'
  - where: 'note 3:12 “Women, or extortioners?”'
    claim: 'The Old Testament honors women leaders such as Deborah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/4?lang=eng'
    quote: 'Deborah, a prophetess, judges Israel'
  - where: 'note 3:12 “Women, or extortioners?”'
    claim: 'Oppressors who are boys in their conduct; the female rule points to the court'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/3.htm'
    quote: 'the female rule, referred to afterwards, points us to the court'
  - where: 'note 3:13 “The Lord as advocate for the poor”'
    claim: 'Pleading is judicial; the Lord is accuser and judge against the leaders of the neglected people'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/3.htm'
    quote: 'Thus does he stand in the midst of the nations at once accuser, judge, and executioner'
  - where: 'note 3:14 “The vineyard, devoured”'
    claim: 'The vineyard is the people; leaders were appointed keepers; the Hebrew verb is used of beasts devouring a vineyard; stolen goods in their houses are the evidence'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/3.htm'
    quote: 'Jehovah had appointed them as gardeners and keepers of this vineyard, but they themselves have become the very beasts that they ought to have warded off.'
  - where: 'note 3:14 “The vineyard, devoured”'
    claim: 'Isa. 5 explains the vineyard as the house of Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/5?lang=eng'
    quote: 'the vineyard of the Lord of hosts is the house of Israel'
  - where: 'note 3:15 “Grinding faces”'
    claim: 'Mormon 8:37 on love of money and fine apparel above the poor'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/morm/8?lang=eng'
    quote: 'ye do love money, and your substance, and your fine apparel, and the adorning of your churches, more than ye love the poor and the needy, the sick and the afflicted'
  - where: 'note 3:16 “Who are the daughters of Zion?”'
    claim: 'Daughters of Zion are the women of Jerusalem, as influential as their husbands; their haughty walk (outstretched throat, amorous glances, tripping gait, ankle ornaments)'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/3.htm'
    quote: 'They walk with extended throat, i.e., bending the neck back, trying to make themselves taller than they are'
  - where: 'note 3:16 “Who are the daughters of Zion?”'
    claim: 'Nephite pride in costly apparel with oppression of the poor'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/4?lang=eng'
    quote: 'they began to wear very costly apparel'
  - where: 'note 3:18 “A 1611 fashion catalog”'
    claim: 'Twenty-one ornaments, three sevens; glosses for ankle-clasps, head-bands, crescents, veils, diadems, smelling-bottles, amulets, gala dresses, wrappers, pockets, mirrors, gauze mantles'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/3.htm'
    quote: 'The prophet enumerates twenty-one different ornaments: three sevens'
  - where: 'note 3:18 “A 1611 fashion catalog”'
    claim: 'Crescents are neck pendants; botte hannephesh smelling-bottles; lechashim amulets; pockets for money (2 Kgs 5:23); hand-mirrors polished metal'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/3.htm'
    quote: '"Smelling-bottles:" botte hannephesh, holders of scent (nephesh, the breath of an aroma).'
  - where: 'note 3:24 “The captive’s brand”'
    claim: 'Five exchanges; mustiness for balsam scent, rope for girdle, baldness for ringlets, sackcloth for dress-cloak, branding for beauty; branding is the mark burnt by conquerors; hair cut off in mourning'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/3.htm'
    quote: 'Branding (Ci  equals  Cevi, from Câvâh, καἰειν), the mark burnt upon the forehead by their conquerors'
  - where: 'note 3:24 “The captive’s brand”'
    claim: 'Isa. 61:3 gives beauty for ashes'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/61?lang=eng'
    quote: 'beauty for ashes'
  - where: 'note 3:26 “Jerusalem sitting in the dust”'
    claim: 'Verse 25 turns to address the city itself with a feminine singular “thy”; the plural daughters become the singular daughter of Zion'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Isa.xml'
    quote: 'מְתַ֖יִ/ךְ'
  - where: 'note 3:26 “Jerusalem sitting in the dust”'
    claim: 'Verse 25 is a direct address to Jerusalem itself; the gates where husbands gathered are desolate; she sits on the ground'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/3.htm'
    quote: 'The gates, where the husbands of the daughters of Zion, who have now fallen in war, sued at one time to gather together in such numbers, are turned into a state of desolation'
  - where: 'note 3:26 “Jerusalem sitting in the dust”'
    claim: 'Verse 26 blurs the plural “daughters” of Zion and the singular “daughter of Zion”'
    key: sc-knowhy-550
    url: 'https://scripturecentral.org/knowhy/why-does-isaiah-prophesy-of-the-daughter-of-zion'
    quote: 'verse 26 blurs the distinction between the plural “daughters” of Zion, and the singular, abstract “daughter of Zion”'
  - where: 'note 3:26 “Jerusalem sitting in the dust”'
    claim: 'Moroni 10:31 echoes the call to put on beautiful garments, daughter of Zion'
    key: sc-knowhy-550
    url: 'https://scripturecentral.org/knowhy/why-does-isaiah-prophesy-of-the-daughter-of-zion'
    quote: 'Moroni concludes the entire Book of Mormon record by echoing Nephi’s prophecies.'
  - where: 'note 3:26 “Jerusalem sitting in the dust”'
    claim: 'Sitting on the ground as a posture of grief (Lam. 2:10, Job 2:13); Isa. 52:2; Moro. 10:31'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lam/2?lang=eng'
    quote: 'sit upon the ground'
