chapter: 61
claims:
- where: when
  claim: The decree of Cyrus for the return of the Jews is dated 537 BC
  key: bible-chron-ot
  url: 'https://www.churchofjesuschrist.org/study/scriptures/bible-chron/old-testament?lang=eng'
  quote: '537 | Decree of Cyrus for the return of the Jews.'
- where: when
  claim: Temple building was resumed in 520 BC
  key: bible-chron-ot
  url: 'https://www.churchofjesuschrist.org/study/scriptures/bible-chron/old-testament?lang=eng'
  quote: '520 | The hindered temple building resumed. Haggai and Zechariah prophesy.'
- where: when
  claim: Jesus read Isaiah in the synagogue at Nazareth at the start of His ministry
  key: scripture-helps-nt-matt-4
  url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-new-testament/06-matthew-4-luke-4-5?lang=eng'
  quote: 'Jesus Christ began His ministry in Nazareth by going to the synagogue and reading passages from Isaiah about the mission of the Messiah.'
- where: setting
  claim: Delitzsch identifies the speaker of 61:1–3 with the Servant of the Lord
  key: delitzsch
  url: 'https://biblehub.com/commentaries/kad/isaiah/61.htm'
  quote: 'For these reasons we have no doubt that we have here the words of the Servant of Jehovah.'
- where: setting
  claim: The speaker has the Servant's gifts, the Spirit (42:1) and a tongue to help the exhausted (50:4)
  key: delitzsch
  url: 'https://biblehub.com/commentaries/kad/isaiah/61.htm'
  quote: 'He is endowed with the Spirit of Jehovah (Isaiah 42:1); Jehovah has sent Him, and with Him His Spirit (Isaiah 48:16); He has a tongue taught of God, to help the exhausted with words (Isaiah 50:4)'
- where: note 61:1 “This day is this scripture fulfilled”
  claim: The verb “anointed” is māšaḥ, used of setting apart to an office, including as a prophet in Isaiah 61:1
  key: bdb
  url: 'https://biblehub.com/hebrew/4886.htm'
  quote: 'anoint, as consecration, solemn setting apart to an office, always by the use of oil poured on the head: לנביא as a prophet 1 Kings 19:16 (Elisha by Elijah) Isaiah 61:1'
- where: note 61:1 “This day is this scripture fulfilled”
  claim: māšîaḥ (Messiah) is derived from māšaḥ and means “anointed”
  key: bdb
  url: 'https://biblehub.com/hebrew/4899.htm'
  quote: 'Word Origin: [from H4886 (מָשַׁח - anointed)]'
- where: note 61:1 “This day is this scripture fulfilled”
  claim: The Greek equivalent christos means “anointed” and renders māšîaḥ in the Septuagint
  key: thayer
  url: 'https://biblehub.com/greek/5547.htm'
  quote: 'χριστός, χριστη, χριστόν (χρίω), the Sept. for מָשִׁיחַ, anointed'
- where: note 61:1 “This day is this scripture fulfilled”
  claim: Luke 4:18 has the Greek verb “he has anointed me” (echrisen)
  key: greek-nt
  url: 'https://biblehub.com/interlinear/luke/4.htm'
  quote: 'echrisen ἔχρισέν he has anointed V-AIA-3S'
- where: note 61:1 “This day is this scripture fulfilled”
  claim: bāśar is the verb of the herald of glad tidings in Isaiah 40:9 and 52:7, and is used of the servant in 61:1
  key: bdb
  url: 'https://biblehub.com/hebrew/1319.htm'
  quote: 'herald as glad tidings: the salvation of God … Isaiah 40:9 (twice in verse); Isaiah 41:27; Isaiah 52:7 (twice in verse) … the Messianic servant preaches good tidings to the meek Isaiah 61:1.'
- where: note 61:1 “This day is this scripture fulfilled”
  claim: The anointing here is prophetic, not regal (the task is to announce rather than to rule)
  key: delitzsch
  url: 'https://biblehub.com/commentaries/kad/isaiah/61.htm'
  quote: 'notwithstanding the fact that mâshach is used here in the sense of prophetic and not regal anointing (1 Kings 19:16)'
- where: note 61:1 “This day is this scripture fulfilled”
  claim: Luke places Jesus’ reading at Nazareth at the start of His ministry
  key: scripture-helps-nt-matt-4
  url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-new-testament/06-matthew-4-luke-4-5?lang=eng'
  quote: 'Jesus Christ began His ministry in Nazareth by going to the synagogue and reading passages from Isaiah about the mission of the Messiah.'
- where: note 61:1 “This day is this scripture fulfilled”
  claim: Jesus’ answer to John the Baptist (Matt. 11:5) draws on Isaiah 61:1
  key: scripture-helps-isa-58-66
  url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/40-isaiah-58-66?lang=eng'
  quote: '26. See Matthew 7:19–22; 11:4–5; Acts 4:27; 10:38.'
  # endnote to the section “Isaiah 61:1–2: What is the acceptable year of the Lord?” (endnote list from node scripts/footnotes.mjs isaiah 61, which prints the Scripture Helps endnotes); the passage's own words are in Matt. 11:5
- where: note 61:1 “The year of release”
  claim: dərôr (“liberty”) is the word of the Jubilee proclamation in Lev. 25:10 and is paired with Isaiah 61:1; Jer. 34:8 uses it too
  key: bdb
  url: 'https://biblehub.com/hebrew/1865.htm'
  quote: 'proclaim liberty, וּקְרָאתֶם דְּרוֺר בָּאָרֶץ לְכָליֿשְׁבֶ֑יהָ Leviticus 25:10 (H) in Jubilee year, compare Isaiah 61:1 ("" מְּקַחקֿוֺחַ); Jeremiah 34:8,15,17'
- where: note 61:1 “The year of release”
  claim: deror is the phrase the law uses for the proclamation of the freedom of the Jubilee year
  key: delitzsch
  url: 'https://biblehub.com/commentaries/kad/isaiah/61.htm'
  quote: 'דרור קרא is the phrase used in the law for the proclamation of the freedom brought by the year of jubilee, which occurred every fiftieth year'
- where: note 61:1 “The year of release”
  claim: The “acceptable year of the Lord” is often connected with the Jubilee
  key: scripture-helps-isa-58-66
  url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/40-isaiah-58-66?lang=eng'
  quote: 'The “acceptable year of the Lord” is often connected with the year of Jubilee that was observed every 50 years as part of the law of Moses.'
- where: note 61:1 “Opening the prison”
  claim: pəqaḥ-qôaḥ is an “opening (of eyes)”, used figuratively of freeing from a dark prison, found only in Isaiah 61:1
  key: bdb
  url: 'https://biblehub.com/hebrew/6495.htm'
  quote: 'opening (of eyes; compare Comm., Ges§ 85n, proposes wide, or complete, opening); — לַאֲסוּרִים Isaiah 61:1, figurative of freeing from dark prison'
- where: note 61:1 “Opening the prison”
  claim: The expression is written like two words; the opening of the eyes is set against the darkness of the prison; the Septuagint took it the same way
  key: delitzsch
  url: 'https://biblehub.com/commentaries/kad/isaiah/61.htm'
  quote: 'Peqach-qōăch is written like two words'
- where: note 61:1 “Opening the prison”
  claim: Delitzsch understands it as the opening of the eyes, contrasted with the prison darkness, as the LXX rendered it
  key: delitzsch
  url: 'https://biblehub.com/commentaries/kad/isaiah/61.htm'
  quote: 'we understand by peqachqōăch the opening up of the eyes (as contrasted with the dense darkness of the prison); and this is how it has been taken even by the lxx'
- where: note 61:1 “Opening the prison”
  claim: The Septuagint of Isaiah 61:1 reads “recovery of sight to the blind”
  key: lxx-rahlfs
  url: 'https://www.ellopos.net/elpenor/greek-texts/septuagint/chapter.asp?book=43&page=61'
  quote: 'to proclaim liberty to the captives, and recovery of sight to the blind'
- where: note 61:1 “Opening the prison”
  claim: Luke 4:18 has the same wording (“recovery of sight” to the blind)
  key: greek-nt
  url: 'https://biblehub.com/interlinear/luke/4.htm'
  quote: 'typhlois τυφλοῖς to [the] blind … anablepsin ἀνάβλεψιν , recovery of sight'
- where: note 61:2 “Where Jesus stopped reading”
  claim: The promise assigns a year to the work of grace and only a day to the work of vengeance
  key: delitzsch
  url: 'https://biblehub.com/commentaries/kad/isaiah/61.htm'
  quote: 'a promise which assigns the length of a year for the thorough accomplishment of the work of grace, and only the length of a day for the work of vengeance.'
- where: note 61:3 “Beauty for ashes”
  claim: Ashes were put on the head as a sign of humiliation or mourning (2 Sam. 13:19); “ashes” is ʾēper
  key: bdb
  url: 'https://biblehub.com/hebrew/665.htm'
  quote: 'on head, as sign of humiliation 2 Samuel 13:19; contrition Daniel 9:3'
- where: note 61:3 “Beauty for ashes”
  claim: “Beauty” is pəʾēr, a head-dress or turban, worn by a bridegroom and by priests (Ex. 39:28), a sign of joy opposed to mourning
  key: bdb
  url: 'https://biblehub.com/hebrew/6287.htm'
  quote: 'head-dress, turban (? originally ornament); — absolute ׳פ of bridegroom Isaiah 61:10, sign of joy Isaiah 61:3 (opposed to mourning, and so)'
- where: note 61:3 “Beauty for ashes”
  claim: pəʾēr is used of priests (Ex. 39:28) and in the plural of the finery of luxurious women in Isaiah 3:20
  key: bdb
  url: 'https://biblehub.com/hebrew/6287.htm'
  quote: 'of priests מַּאֲרֵי פִשְׁתִּים Ezekiel 44:18, ׳הַמִּנְבָּעֹת שֵׁשׁמּ Exodus 39:28 (P); plural absolute מְּאֵרִים Isaiah 3:20 (of luxurious women).'
- where: note 61:3 “Beauty for ashes”
  claim: pəʾēr is a transposition of the letters of ʾēper (“ashes”), its counterpart
  key: delitzsch
  url: 'https://biblehub.com/commentaries/kad/isaiah/61.htm'
  quote: 'Instead of אפר, the ashes of mourning or repentance laid upon the head, he brings פּאר, a diadem to adorn the head (a transposition even so far as the letters are concerned, and therefore the counterpart of אפר'
- where: note 61:3 “Beauty for ashes”
  claim: The Hebrew phrase is pəʾēr taḥat ʾēper (“beauty instead of ashes”)
  key: bdb
  url: 'https://biblehub.com/hebrew/665.htm'
  quote: 'Isaiah 61:3 (מְּאֵר תַּחַת אֵפֶר)'
- where: note 61:3 “Beauty for ashes”
  claim: The Hebrew word translated “beauty” refers to a decorative head covering, and the verse promises a crown of beauty in place of ashes
  key: scripture-helps-isa-58-66
  url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/40-isaiah-58-66?lang=eng'
  quote: 'The Hebrew word translated as “beauty” refers to a decorative head covering.'
- where: note 61:3 “Beauty for ashes”
  claim: “Oil of joy” echoes Psalm 45 (“the oil of gladness”)
  key: delitzsch
  url: 'https://biblehub.com/commentaries/kad/isaiah/61.htm'
  quote: 'the"oil of joy" (from Psalm 45:8; compare also משׁחך there with אתי משׁח here) instead of mourning'
- where: note 61:3 “Beauty for ashes”
  claim: “Spirit of heaviness” is rûaḥ kēhâ, a faint spirit; kēhâ is used of the dimly burning wick in Isaiah 42:3
  key: bdb
  url: 'https://biblehub.com/hebrew/3544.htm'
  quote: 'dim, of eyes 1 Samuel 3:2; of burning wick (׳כִּשְׁתָּה כ) Isaiah 42:3; dull (in colour, of plague-spots) Leviticus 13:6,21,26,39,56; figurative = faint ׳רוּחַ כ Isaiah 61:3 (opposed to מַעֲטֵה תְהִלָּה).'
- where: note 61:3 “Beauty for ashes”
  claim: In Isaiah 3 the daughters of Zion were disrobed, leaving “burning instead of beauty” and sitting on the ground
  key: sc-knowhy-550
  url: 'https://scripturecentral.org/knowhy/why-does-isaiah-prophesy-of-the-daughter-of-zion'
  quote: 'The disrobing of the daughter of Zion left her “burning instead of beauty,” and “she being desolate shall sit upon the ground”'
- where: note 61:3 “Oaks of righteousness”
  claim: ʾêlê is the terebinth (a prominent, lofty tree), used in Isaiah 1:29 of idol shrines and in 61:3 figuratively of the ransomed of Zion
  key: bdb
  url: 'https://biblehub.com/hebrew/352.htm'
  quote: 'terebinth (probably as prominent, lofty tree …); as marking idol-shrines Isaiah 1:29; Isaiah 57:5 … figurative of ransomed ones of Zion אֵילֵי הַצֶּדֶק'
- where: note 61:3 “Oaks of righteousness”
  claim: The people are “terebinths of righteousness,” a planting of the Lord to His glory, repeating Isaiah 60:21
  key: delitzsch
  url: 'https://biblehub.com/commentaries/kad/isaiah/61.htm'
  quote: 'a planting of Jehovah, to the end that He may get glory out of it (a repetition of Isaiah 60:21).'
- where: note 61:6 “A people of priests”
  claim: In practice the Aaronites were priests in Israel; Israel in Isaiah 61 stands among the nations as they did
  key: delitzsch
  url: 'https://biblehub.com/commentaries/kad/isaiah/61.htm'
  quote: 'Israel is now, in the midst of the heathen who have entered into the congregation of Jehovah and become the people of God (ch Isaiah 19:25), what the Aaronites formerly were in the midst of Israel itself.'
- where: note 61:6 “A people of priests”
  claim: Delitzsch cautions against a clergy-and-laity reading, since Isaiah 66:21 shows no such separation
  key: delitzsch
  url: 'https://biblehub.com/commentaries/kad/isaiah/61.htm'
  quote: 'it is evident, from Isaiah 66:21, that the prophet has no such hierarchical separation as this in his mind.'
- where: note 61:6 “A people of priests”
  claim: The Hebrew for “double” in Isaiah 40:2 is the dual kiflayim
  key: bdb
  url: 'https://biblehub.com/hebrew/3718.htm'
  quote: 'elsewhere dual כִּפְלַיִם (compare Arabic ), לְתוּשִׁיָּה Job 11:6 double in sound wisdom (beyond what Job imagines), of retribution Isaiah 40:2.'
- where: note 61:6 “A people of priests”
  claim: The Hebrew for “double” in Isaiah 61:7 is mishneh (a double portion)
  key: bdb
  url: 'https://biblehub.com/hebrew/4932.htm'
  quote: 'a double portion Isaiah 61:7 (twice in verse); Zechariah 9:12; Job 42:10.'
- where: note 61:8 “Robbery for burnt offering”
  claim: The Hebrew text of Isaiah 61:8 is pointed bə‘ōwlāh (consonants bʿwlh)
  key: biblehub-interlinear
  url: 'https://biblehub.com/interlinear/isaiah/61.htm'
  quote: 'bə·‘ō·w·lāh; בְּעוֹלָ֑ה'
- where: note 61:8 “Robbery for burnt offering”
  claim: The lexicon says the word should probably be read ʿawlâ (injustice)
  key: bdb
  url: 'https://biblehub.com/hebrew/5766.htm'
  quote: 'עוֺלָה Isaiah 61:8 (read probably עַוְלָה)'
- where: note 61:8 “Robbery for burnt offering”
  claim: The Talmud, Jerome and Luther take it as robbery in a burnt offering; the punctuation may support “holocaustum”
  key: delitzsch
  url: 'https://biblehub.com/commentaries/kad/isaiah/61.htm'
  quote: 'it is doubtful whether the punctuation assumes the latter, as the Targum does, and not rather the meaning holocaustum supported by the Talmud.'
- where: note 61:8 “Robbery for burnt offering”
  claim: Delitzsch prefers “injustice”, asking what mentioning sacrifices would accomplish and seeing the Chaldean spoiling of Israel
  key: delitzsch
  url: 'https://biblehub.com/commentaries/kad/isaiah/61.htm'
  quote: 'for what object would there be in mentioning sacrifices here, seeing that only heathen sacrifices could be intended'
- where: note 61:8 “Robbery for burnt offering”
  claim: The “robbery” recalls what Israel suffered from the Chaldeans
  key: delitzsch
  url: 'https://biblehub.com/commentaries/kad/isaiah/61.htm'
  quote: 'which calls to mind at once the cruel robbery or spoiling that Israel had sustained from the Chaldeans'
- where: note 61:8 “Robbery for burnt offering”
  claim: The Septuagint reads “robberies of injustice”
  key: lxx-rahlfs
  url: 'https://www.ellopos.net/elpenor/greek-texts/septuagint/chapter.asp?book=43&page=61'
  quote: 'For I am the Lord who love righteousness, and hate robberies of injustice'
- where: note 61:8 “Robbery for burnt offering”
  claim: The NRSVUE reads “robbery and wrongdoing” and footnotes “robbery with a burnt offering”
  key: nrsvue
  url: 'https://www.biblegateway.com/passage/?search=Isaiah+61%3A8&version=NRSVUE'
  quote: 'I hate robbery and wrongdoing;'
- where: note 61:8 “Robbery for burnt offering”
  claim: The NRSVUE footnote gives the alternative “robbery with a burnt offering”
  key: nrsvue
  url: 'https://www.biblegateway.com/passage/?search=Isaiah+61%3A8&version=NRSVUE'
  quote: '61.8 Or robbery with a burnt offering'
- where: note 61:8 “Robbery for burnt offering”
  claim: The NIV reads “I hate robbery and wrongdoing”
  key: niv
  url: 'https://www.biblegateway.com/passage/?search=Isaiah+61%3A8&version=NIV'
  quote: 'I hate robbery and wrongdoing.'
- where: note 61:10 “Garments of salvation”
  claim: yəkahēn pəʾēr means “acts as a priest with a headdress”; the bridegroom wears the priestly turban
  key: bdb
  url: 'https://biblehub.com/hebrew/3547.htm'
  quote: 'play the priest: כֶּחָתָן יְכַהֵן מְּאֵר Isaiah 61:10 as a bridegroom (that) priests it with his turban, decks himself with a splendid turban such as the priests wore.'
- where: note 61:10 “Garments of salvation”
  claim: Delitzsch takes the speaker of verse 10 to be the same as the speaker of verses 1–3
  key: delitzsch
  url: 'https://biblehub.com/commentaries/kad/isaiah/61.htm'
  quote: 'the speaker here is certainly the same as there.'
- where: note 61:10 “Garments of salvation”
  claim: The Targum introduces verse 10 with “Thus saith Jerusalem”
  key: delitzsch
  url: 'https://biblehub.com/commentaries/kad/isaiah/61.htm'
  quote: 'The Targum precedes this last turn with "Thus saith Jerusalem."'
- where: note 61:10 “Garments of salvation”
  claim: The bridegroom’s turban is the same festive headdress (pəʾēr) as in verse 3
  key: bdb
  url: 'https://biblehub.com/hebrew/6287.htm'
  quote: 'absolute ׳פ of bridegroom Isaiah 61:10, sign of joy Isaiah 61:3'
- where: section 1 plain
  claim: 'The plain words say “good news to the poor” (KJV “meek”); the Septuagint renders “the poor”'
  key: lxx-rahlfs
  url: 'https://www.ellopos.net/elpenor/greek-texts/septuagint/chapter.asp?book=43&page=61'
  quote: 'he has sent me to preach glad tidings to the poor'
- where: section 1 plain
  claim: Luke 4:18 has “to the poor” (ptōchois)
  key: greek-nt
  url: 'https://biblehub.com/interlinear/luke/4.htm'
  quote: 'ptōchois πτωχοῖς . to [the] poor'
- where: section 1 plain
  claim: “A faint spirit” for the KJV “spirit of heaviness”
  key: bdb
  url: 'https://biblehub.com/hebrew/3544.htm'
  quote: 'figurative = faint ׳רוּחַ כ Isaiah 61:3 (opposed to מַעֲטֵה תְהִלָּה).'
- where: section 1 plain
  claim: “A crown” for “beauty” (a decorative head covering)
  key: scripture-helps-isa-58-66
  url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/40-isaiah-58-66?lang=eng'
  quote: 'In this verse, the Lord promised the faithful that He would replace their ashes of sorrow with a crown of beauty and turn their mourning into joy.'
- where: section 1 plain
  claim: 'The plain words say “oaks of righteousness”; ʾêlê are the lofty terebinths, rendered “oaks” elsewhere (Isa. 1:29)'
  key: bdb
  url: 'https://biblehub.com/hebrew/352.htm'
  quote: 'plural אֵילִים Isaiah 1:29; אֵלִים Isaiah 57:5 construct אֵילֵי Isaiah 61:3'
- where: section 1 plain
  claim: 'The plain words say “the year of the Lord’s favor”; the Hebrew is râtsōn, “good pleasure”'
  key: delitzsch
  url: 'https://biblehub.com/commentaries/kad/isaiah/61.htm'
  quote: 'a year of good pleasure (râtsōn: syn. yeshū‛âh)'
- where: section 2 plain
  claim: Foreigners will “stand” and tend the flocks and fields (stand at their posts ready for service)
  key: delitzsch
  url: 'https://biblehub.com/commentaries/kad/isaiah/61.htm'
  quote: 'They "stand there" (viz., at their posts ready for service, ‛al-mish-martâm, 2 Chronicles 7:6), "and feed your flocks"'
- where: section 2 plain
  claim: “Double portion” for “double” (mishneh)
  key: bdb
  url: 'https://biblehub.com/hebrew/4932.htm'
  quote: 'a double portion Isaiah 61:7 (twice in verse); Zechariah 9:12; Job 42:10.'
- where: section 2 plain
  claim: “Faithfully reward them” for the KJV “direct their work in truth”
  key: nrsvue
  url: 'https://www.biblegateway.com/passage/?search=Isaiah+61%3A8&version=NRSVUE'
  quote: 'I will faithfully give them their recompense,'
- where: section 3 plain
  claim: “Priestly headdress” for the KJV “decketh himself with ornaments”
  key: bdb
  url: 'https://biblehub.com/hebrew/3547.htm'
  quote: 'as a bridegroom (that) priests it with his turban, decks himself with a splendid turban such as the priests wore.'
- where: christ
  claim: Isaiah’s prophecy of the Anointed One points to Jesus Christ; at Nazareth Jesus declared the passage fulfilled
  key: scripture-helps-isa-58-66
  url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/40-isaiah-58-66?lang=eng'
  quote: 'ultimately points to Jesus Christ and His work of salvation. During His mortal ministry, the Savior read Isaiah 61:1–2 aloud in the synagogue in Nazareth'
- where: christ
  claim: 'Jesus fulfils the promise of sight to the blind, physical and spiritual'
  key: scripture-helps-nt-matt-4
  url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-new-testament/06-matthew-4-luke-4-5?lang=eng'
  quote: 'He was to provide “sight to the blind.” He would miraculously restore physical and spiritual sight.'
- where: christ
  claim: Jesus was anointed with the Spirit (Acts 10:38) and applied Isaiah 61 to His ministry
  key: scripture-helps-isa-58-66
  url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/40-isaiah-58-66?lang=eng'
  quote: '26. See Matthew 7:19–22; 11:4–5; Acts 4:27; 10:38.'
