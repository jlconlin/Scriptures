chapter: 62
claims:
- where: when
  claim: Chapters 56–66 portray a restored Jewish community with Jerusalem inhabited and the temple rebuilt (dating debated)
  key: isaiah-in-bom
  url: 'https://storage.googleapis.com/scripturecentral-prod-strapi-uploads/ry_and_welch_isaiah_in_the_book_of_mormon_1998_184195e137/ry_and_welch_isaiah_in_the_book_of_mormon_1998_184195e137.pdf'
  quote: 'Chapters 56-66 are typically offset from the rest since they portray the Jewish community founded once again, Jerusalem in - habited, and the temple rebuilt.'
- where: when
  claim: The return from exile began with the decree of Cyrus (537 BC)
  key: bible-chron-ot
  url: 'https://www.churchofjesuschrist.org/study/scriptures/bible-chron/old-testament?lang=eng'
  quote: '537 | Decree of Cyrus for the return of the Jews.'
- where: setting
  claim: The speaker at the start is unidentified; commentators take it to be the prophet or the Lord Himself
  key: delitzsch
  url: 'https://biblehub.com/commentaries/kad/isaiah/62.htm'
  quote: 'Nearly all the more recent commentators regard the prophet himself as speaking here. ... It is, however, really Jehovah who commences thus'
- where: setting
  claim: The Hebrew verb for “hold my peace” (ḥāšâ) is the one used of the Lord’s own silence (Isa. 57:11; 64:12; 65:6)
  key: delitzsch
  url: 'https://biblehub.com/commentaries/kad/isaiah/62.htm'
  quote: 'châshâh is the word commonly employed in such utterances of Jehovah concerning Himself, to denote His leaving things in their existing state without interposing (Isaiah 65:6; Isaiah 57:11; Isaiah 64:11).'
- where: setting
  claim: The same verb (ḥāšâ) is used in Isa. 62:1, 62:6, 64:11 and 65:6 (and, in the Hiphil, 57:11)
  key: bdb
  url: 'https://biblehub.com/hebrew/2814.htm'
  quote: 'Qal Imperfect2masculine singular תֶּחֱשֶׁה Psalm 28:1; Isaiah 64:11; אֶחֱשֶׁה Isaiah 62:1; Isaiah 65:6; יֶחֱשׁוּ Isaiah 62:6'
- where: setting
  claim: Matthew heard verse 11 in the Triumphal Entry (Matt. 21:5)
  key: delitzsch
  url: 'https://biblehub.com/commentaries/kad/isaiah/62.htm'
  quote: 'compare the meaning of this "Say ye to the daughter of Zion" with Zechariah 9:9 in Matthew 21:5'
- where: thread
  claim: “Forsaken” is ʿăzûbâ
  key: bdb
  url: 'https://biblehub.com/hebrew/5805.htm'
  quote: 'I. עֲזוּבָה noun feminine forsakenness, desolation'
- where: thread
  claim: “Desolate” is šəmāmâ
  key: bdb
  url: 'https://biblehub.com/hebrew/8077.htm'
  quote: 'שְׁמָמָה55 noun feminine a devastation, waste'
- where: thread
  claim: Hephzibah means “my delight is in her”
  key: bd-hephzibah
  url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hephzibah?lang=eng'
  quote: 'My delight is in her. Mother of King Manasseh (2 Kgs. 21:1). Isaiah (62:4) applies the name to Jerusalem.'
- where: thread
  claim: Beulah means “married”
  key: bd-beulah
  url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/beulah?lang=eng'
  quote: 'Married. Name applied to the land of Israel as the spouse of God and of her own sons (Isa. 62:4–5).'
- where: note 62:1 “I will not hold my peace”
  claim: The verb in Isa. 57:11, 62:1, and 64:12 (BDB 64:11) is ḥāšâ, to be silent or still
  key: bdb
  url: 'https://biblehub.com/hebrew/2814.htm'
  quote: 'be silent, inactive, still ... Isaiah 62:1,6 (= neglect to speak) ... Isaiah 64:11 ... but Isaiah 65:6 of ׳י''s keeping silence at iniquity ... (compare Isaiah 57:11 Hiph`il)'
- where: note 62:1 “I will not hold my peace”
  claim: Commentators read the speaker as the prophet or as the Lord (the verb is used of the Lord’s silence)
  key: delitzsch
  url: 'https://biblehub.com/commentaries/kad/isaiah/62.htm'
  quote: 'Nearly all the more recent commentators regard the prophet himself as speaking here. Having given himself up to praying to Jehovah and preaching to the people, he will not rest or hold his peace'
- where: note 62:2 “A new name from the Lord’s mouth”
  claim: Only the Lord can give Zion’s new name, as He changed Abram to Abraham and Jacob to Israel
  key: delitzsch
  url: 'https://biblehub.com/commentaries/kad/isaiah/62.htm'
  quote: 'He who makes the church righteous and glorious, He, and He alone, is able to utter a name answering to her new nature, just as it was He who called Abram Abraham, and Jacob Israel.'
- where: note 62:2 “A new name from the Lord’s mouth”
  claim: The crown is in the Lord’s hand, not on His head
  key: delitzsch
  url: 'https://biblehub.com/commentaries/kad/isaiah/62.htm'
  quote: 'Zion is not the ancient crown which the Eternal wears upon His head, but the crown wrought out in time, which He holds in His hand'
- where: note 62:4 “Hephzibah and Beulah”
  claim: “Forsaken” is ʿăzûbâ (forsakenness, desolation)
  key: bdb
  url: 'https://biblehub.com/hebrew/5805.htm'
  quote: 'I. עֲזוּבָה noun feminine forsakenness, desolation'
- where: note 62:4 “Hephzibah and Beulah”
  claim: Hephzibah means “my delight is in her” and was the name of Manasseh’s mother (2 Kgs 21:1)
  key: bd-hephzibah
  url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hephzibah?lang=eng'
  quote: 'My delight is in her. Mother of King Manasseh (2 Kgs. 21:1).'
- where: note 62:4 “Hephzibah and Beulah”
  claim: Hephzibah is a figurative name of Zion explained by “for Yahweh delighteth in thee” (same root)
  key: bdb
  url: 'https://biblehub.com/hebrew/2657.htm'
  quote: 'figurative name of Zion Isaiah 62:4, here explained by כִּי חפץ יהוה בָּךְ for Yahweh delighteth in thee.'
- where: note 62:4 “Hephzibah and Beulah”
  claim: Beulah means “married”
  key: bd-beulah
  url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/beulah?lang=eng'
  quote: 'Married. Name applied to the land of Israel as the spouse of God and of her own sons (Isa. 62:4–5).'
- where: note 62:4 “Hephzibah and Beulah”
  claim: The verb is “marry” / “be married” (Niphal) in Isa. 62:4–5
  key: bdb
  url: 'https://biblehub.com/hebrew/1166.htm'
  quote: 'Niph`al Imperfect תִּבָּעֵל Proverbs 30:23; Isaiah 62:4 be married.'
- where: note 62:4 “Hephzibah and Beulah”
  claim: The verb ḥāpēṣ, “delight in,” is used in Isa. 62:4
  key: bdb
  url: 'https://biblehub.com/hebrew/2654.htm'
  quote: 'a. delight in, have pleasure in, with בְּ, persons ... Psalm 41:12; Isaiah 62:4'
- where: note 62:4 “Hephzibah and Beulah”
  claim: The noun ḥēpeṣ means pleasure or business (Isa. 58:3, 13)
  key: bdb
  url: 'https://biblehub.com/hebrew/2656.htm'
  quote: 'that in which one takes delight, his business (late), or matter ... ׳מצא ח Isaiah 58:3,13; עֲשׂוֺת חֲפָצֶךָ doing thy affairs Isaiah 58:13'
- where: note 62:5 “Your sons, or your Builder?”
  claim: The traditional Hebrew text is vocalized bānāyiḵ, “your sons”
  key: biblehub-interlinear
  url: 'https://biblehub.com/interlinear/isaiah/62-5.htm'
  quote: 'bā·nā·yiḵ; בָּנָ֑יִךְ your sons'
- where: note 62:5 “Your sons, or your Builder?”
  claim: A commentator proposes reading the letters as “your builder” (bōnayik), God
  key: barnes-isaiah
  url: 'https://biblehub.com/commentaries/isaiah/62-5.htm'
  quote: 'it seems that there is much force in the conjecture of Lowth, and that the reference is to God as the ''builder,'' or the restorer of Jerusalem'
- where: note 62:5 “Your sons, or your Builder?”
  claim: Another commentator proposes changing the vowel points to “thy builder,” God
  key: jfb-isaiah
  url: 'https://biblehub.com/commentaries/isaiah/62-5.htm'
  quote: 'rather, changing the points, which are of no authority in Hebrew, "thy builder" or "restorer," that is, God; for in the parallel clause'
- where: note 62:5 “Your sons, or your Builder?”
  claim: The traditional reading “sons” is also taken as correct by other commentators
  key: delitzsch
  url: 'https://biblehub.com/commentaries/kad/isaiah/62.htm'
  quote: 'A young man marries a virgin, thy children will marry thee: the figure and the fact are placed side by side in the form of an emblematical proverb'
- where: note 62:5 “Your sons, or your Builder?”
  claim: The NRSVUE renders “your builder”
  key: nrsvue
  url: 'https://www.biblegateway.com/passage/?search=Isaiah+62%3A5&version=NRSVUE'
  quote: 'so shall your builder marry you,'
- where: note 62:5 “Your sons, or your Builder?”
  claim: The NIV renders “your Builder”
  key: niv
  url: 'https://www.biblegateway.com/passage/?search=Isaiah+62%3A5&version=NIV'
  quote: 'so will your Builder marry you;'
- where: note 62:6 “Give Him no rest”
  claim: The mazkîr was probably the king’s “reminder,” who brought important business to his notice (2 Sam. 8:16, “recorder”)
  key: bdb
  url: 'https://biblehub.com/hebrew/2142.htm'
  quote: 'record, only participle מַזְכִּיר as substantive (title of public officer) = recorder **Rather, probably, the (king''s reminder, who brought important business to his notice'
- where: note 62:6 “Give Him no rest”
  claim: The verb zākar in Isa. 62:6 means to call upon / make mention of the Lord
  key: bdb
  url: 'https://biblehub.com/hebrew/2142.htm'
  quote: '׳י, = call upon Isaiah 62:6'
- where: note 62:6 “Give Him no rest”
  claim: D&C 101 was given in 1833 after the Saints were driven from Jackson County, Missouri
  key: dc-101-heading
  url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/101?lang=eng'
  quote: 'Revelation given to Joseph Smith the Prophet, at Kirtland, Ohio, December 16 and 17, 1833. ... Mobs had driven them from their homes in Jackson County'
- where: note 62:8 “Eating what you planted”
  claim: The covenant curses of Deuteronomy 28 include planting a vineyard and not gathering its grapes
  key: lds-scriptures
  url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/28?lang=eng'
  quote: 'thou shalt plant a vineyard, and shalt not gather the grapes thereof.'
- where: note 62:10 “The last highway”
  claim: The Hebrew word mesillah, “highway,” appears last in Isaiah at 62:10 (sollu mesillah)
  key: bdb
  url: 'https://biblehub.com/hebrew/4546.htm'
  quote: 'Isaiah 49:11; Isaiah 59:7; Jeremiah 31:21; ׳ישּׁר מ Isaiah 40:3; ׳סלל מ Isaiah 62:10'
- where: note 62:10 “The last highway”
  claim: The Hebrew of 62:10 doubles the command (sōllû sōllû, “build up, build up”)
  key: biblehub-interlinear
  url: 'https://biblehub.com/interlinear/isaiah/62-10.htm'
  quote: 'sōl·lū סֹ֣לּוּ build up'
- where: note 62:10 “The last highway”
  claim: The Lord has sent the everlasting covenant into the world as a standard for His people (D&C 45:9)
  key: lds-scriptures
  url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/45?lang=eng'
  quote: 'I have sent mine everlasting covenant into the world, to be a light to the world, and to be a standard for my people, and for the Gentiles to seek to it'
- where: note 62:11 “Tell the daughter of Zion”
  claim: Matthew’s “Tell ye the daughter of Sion” is read with Zechariah 9:9 as an echo of this verse’s “Say ye to the daughter of Zion”
  key: delitzsch
  url: 'https://biblehub.com/commentaries/kad/isaiah/62.htm'
  quote: 'compare the meaning of this "Say ye to the daughter of Zion" with Zechariah 9:9 in Matthew 21:5'
- where: note 62:11 “Tell the daughter of Zion”
  claim: Yešaʿ means salvation; used in Isa. 62:11 of salvation by God
  key: bdb
  url: 'https://biblehub.com/hebrew/3468.htm'
  quote: 'salvation, i.e. primarily physical rescue, by God, often with added spiritual idea: Isaiah 62:11'
- where: note 62:11 “Tell the daughter of Zion”
  claim: The name Yehoshua, “Yahweh is salvation,” came to be associated with the root yšʿ (compare Matt. 1:21)
  key: bdb
  url: 'https://biblehub.com/hebrew/3091.htm'
  quote: 'in any case it came to be associated with ישׁע, compare Matthew 1:21'
- where: note 62:11 “Tell the daughter of Zion”
  claim: Jesus is the Greek form of the name Joshua or Jeshua
  key: bd-jesus
  url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jesus?lang=eng'
  quote: 'The Greek form of the name Joshua or Jeshua, “God is help” or “Savior.”'
- where: note 62:11 “Tell the daughter of Zion”
  claim: The Hebrew of “thy salvation” in 62:11 is yišʿēḵ (from yešaʿ)
  key: biblehub-interlinear
  url: 'https://biblehub.com/interlinear/isaiah/62-11.htm'
  quote: 'yiš·‘êḵ יִשְׁעֵ֖ךְ your salvation'
- where: note 62:11 “Tell the daughter of Zion”
  claim: The second half of 62:11 repeats Isa. 40:10 (same Hebrew words for “his reward is with him, and his work before him”)
  key: biblehub-interlinear
  url: 'https://biblehub.com/interlinear/isaiah/40-10.htm'
  quote: 'śə·ḵā·rōw שְׂכָרוֹ֙ His reward [is] ... lə·p̄ā·nāw. לְפָנָֽיו׃ before His face'
- where: note 62:12 “Sought out”
  claim: dərûšâ is the passive (Qal passive participle) of darash, “seek,” glossed in this verse as “cared for”
  key: bdb
  url: 'https://biblehub.com/hebrew/1875.htm'
  quote: 'דְרוּשָׁה cared for (of Jerusalem) Isaiah 62:12.'
- where: note 62:12 “Sought out”
  claim: “A city not forsaken” reverses the name “Forsaken” (ʿăzûbâ)
  key: bdb
  url: 'https://biblehub.com/hebrew/5805.htm'
  quote: 'I. עֲזוּבָה noun feminine forsakenness, desolation'
