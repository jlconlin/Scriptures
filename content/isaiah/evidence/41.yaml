chapter: 41
claims:
  - where: when
    claim: 'Cyrus took Ecbatana in 550 BC (the start of the period)'
    key: rogers-cuneiform
    url: 'https://archive.org/stream/cuneiformparalle00roge/cuneiformparalle00roge_djvu.txt'
    quote: 'In 550 Cyrus took Ecbatana and sacked it'
  - where: when
    claim: 'The year 539, when Nabonidus was removing gods to Babylon and Cyrus defeated Belshazzar (the Babylonian Chronicle’s year, Rogers’s summary); Babylon was entered soon after'
    key: rogers-cuneiform
    url: 'https://archive.org/stream/cuneiformparalle00roge/cuneiformparalle00roge_djvu.txt'
    quote: 'the year 539 has been reached and Nabonidus is busy removing gods from their shrines to Babylon. In that same year Cyrus met Belshazzar'
  - where: setting
    claim: 'Cyrus took Ecbatana in 550 BC'
    key: rogers-cuneiform
    url: 'https://archive.org/stream/cuneiformparalle00roge/cuneiformparalle00roge_djvu.txt'
    quote: 'In 550 Cyrus took Ecbatana and sacked it'
  - where: setting
    claim: 'Babylon fell to Cyrus in 539 (Rogers; the Church’s chronology table dates the fall to 538)'
    key: rogers-cuneiform
    url: 'https://archive.org/stream/cuneiformparalle00roge/cuneiformparalle00roge_djvu.txt'
    quote: 'the year 539 has been reached and Nabonidus is busy removing gods from their shrines to Babylon. In that same year Cyrus met Belshazzar'
  - where: setting
    claim: 'Cyrus subdued lands as far as the Aegean before conquering Babylon'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/41.htm'
    quote: 'in which, even before the conquest of Babylon, he subjugated all the lands from the heights of Hinduku to the shores of the Aegean Sea'
  - where: setting
    claim: 'The nations of the western coasts (the “isles”) were frightened by the course of Cyrus'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/41.htm'
    quote: 'We have here a description of the effects which the victorious course of Cyrus had begun to produce in the heathen world.'
  - where: setting
    claim: 'The chapter has two stages in the suit: first the Lord points to the conqueror He raised up, then to His foretelling'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/41.htm'
    quote: 'In the first stage Jehovah appealed, in support of His deity, to the fact that it was He who had called the oppressor of the nations upon the arena of history. In this second stage He appeals to the fact that He only knows or can predict the future.'
  - where: thread
    claim: 'The nations make idols in terror of Cyrus; the workmen encourage one another to fasten it with nails'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/41.htm'
    quote: 'To such foolish, fruitless proceedings have the nations resorted when threatened with subjugation by Cyrus.'
  - where: thread
    claim: 'The challenge falls on the idol-worshippers in the first scene and on the idols themselves in the second, with the Lord and His people on one side'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/41.htm'
    quote: 'There the challenge was addressed to the worshippers of idols, here to the idols themselves; but in both cases both of these are ranged on the one side, and Jehovah with His people upon the other.'
  - where: section 1 plain
    claim: 'The Hebrew of 41:1 has “Be silent before me, islands (coastlands)”; the “peoples” renew strength'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/isaiah/41-1.htm'
    quote: 'Be silent before Me, O islands, and let the peoples renew their strength.'
  - where: section 1 plain
    claim: 'The Hebrew ʾî means coast or region, including its inhabitants (so “coastlands”)'
    key: bdb
    url: 'https://biblehub.com/hebrew/339.htm'
    quote: 'coast, border, region (mostly late)'
  - where: section 1 plain
    claim: 'The Hebrew of verse 4: “I, the Lord, first, and with the last I am He”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/isaiah/41-4.htm'
    quote: 'I, Yahweh, am the first, and with the last — I am He.'
  - where: section 1 plain
    claim: 'The craftsman (the one who casts the image) encourages the goldsmith, and the hammer-smoother the anvil-striker; they find the soldering good and fasten the idol with nails'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/41.htm'
    quote: 'The chârâsh, who casts the image, encourages the tsōrēph, whose task it is to provide it with the plating of gold and silver chains'
  - where: section 1 plain
    claim: 'Verse 2 Hebrew: “Who has roused from the east one whom righteousness calls to his foot”; the sword and bow turn the foe to dust and stubble'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/isaiah/41-2.htm'
    quote: 'Who has aroused one from the east Whom He calls in righteousness to His feet?'
  - where: section 2 plain
    claim: 'Verse 8–9: Israel chosen and not cast off, “seed of Abraham my friend”, taken from the ends of the earth'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/41.htm'
    quote: 'thou whom I have laid hold of from the ends of the earth, and called from the corners thereof, and said to thee, Thou art my servant, I have chosen and not despised thee'
  - where: section 2 plain
    claim: 'The Hebrew in verse 8 for “friend” is a participle of the verb “to love”'
    key: bdb
    url: 'https://biblehub.com/hebrew/157.htm'
    quote: 'friend Hiram of David 1 Kings 5:15'
  - where: section 3 plain
    claim: 'Hebrew “worm” (tôlaʿat) and “men of Israel” in 41:14; “redeemer” and “Holy One of Israel”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/isaiah/41-14.htm'
    quote: 'Do not fear, you worm Jacob, you men of Israel: I will help you — this is the LORD’s declaration. Your Redeemer is the Holy One of Israel.'
  - where: section 3 plain
    claim: 'Verse 15: “a threshing sledge, new and sharp, with many teeth” (Hebrew: sharp, new, owner of teeth)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/isaiah/41-15.htm'
    quote: 'I have made you a new, sharp threshing sledge with double edges'
  - where: section 3 plain
    claim: 'The sledge image: the mountains and hills stand for proud and mighty foes; wind and storm carry them off'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/41.htm'
    quote: 'This is evidently a figurative expression for proud and mighty foes, just as wind and tempest denote the irresistible force of Jehovah’s aid.'
  - where: section 4 plain
    claim: 'The tree names include cedar, acacia, myrtle, and wild olive'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/41.htm'
    quote: 'Erez is the generic name for the cedar; shittâh, the acacia, the Egyptian spina (ἄκανθα), Copt. shont; hadas, the myrtle, ‛ēts shemen, the wild olive'
  - where: section 4 plain
    claim: 'The Church edition footnotes give “shittah” as acacia and “fir” as cypress'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/41?lang=eng'
    quote: '“shittah”: OR acacia.'
  - where: section 4 plain
    claim: 'teʾashshur (KJV “box”) is the box tree'
    key: bdb
    url: 'https://biblehub.com/hebrew/8391.htm'
    quote: 'boxtree'
  - where: section 4 plain
    claim: 'berosh is cypress or fir'
    key: bdb
    url: 'https://biblehub.com/hebrew/1265.htm'
    quote: 'cypress or fir (Assyrian burâšu'
  - where: section 5 plain
    claim: 'Verses 21–24: bring your cause; “former things” and “things to come”; do good or evil'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/41.htm'
    quote: 'Bring hither your cause, saith Jehovah; bring forward your proofs, saith the king of Jacob.'
  - where: section 5 plain
    claim: 'Verse 25: one from the north who calls on the Lord’s name, and treads on rulers like mortar'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/41.htm'
    quote: 'I have raised up from the north, and he came: from the rising of the sun one who invokes my name; and he treads upon satraps as mud, and like a potter kneadeth clay.'
  - where: 'note 41:1 “A courtroom scene”'
    claim: 'The Hebrew “judgment” is mišpāṭ, “act of deciding a case”, and Isa 41:1 is listed in that sense'
    key: bdb
    url: 'https://biblehub.com/hebrew/4941.htm'
    quote: 'a. act of deciding a case'
  - where: 'note 41:1 “A courtroom scene”'
    claim: 'The islands (ʾiyyîm) are addressed first as the inhabitants of the western islands and coasts, then the whole heathen world; and the Lord goes through all the forms of a legal process'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/41.htm'
    quote: 'The words are addressed to the whole of the heathen world, and first of all to the inhabitants of the western islands and coasts.'
  - where: 'note 41:1 “A courtroom scene”'
    claim: 'The nations renew strength so as to have no excuse if defeated; they speak after hearing the evidence'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/41.htm'
    quote: 'That they may have no excuse if they are defeated, they are to put on fresh strength'
  - where: 'note 41:1 “A courtroom scene”'
    claim: 'The Hebrew yaḥălîpû kōaḥ is the same phrase in 41:1 and 40:31'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/isaiah/41-1.htm'
    quote: 'ya·ḥă·lî·p̄ū יַחֲלִ֣יפוּ will renew'
  - where: 'note 41:1 “A courtroom scene”'
    claim: 'The same Hebrew phrase in 40:31, “those waiting on YHWH will renew strength”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/isaiah/40-31.htm'
    quote: 'ya·ḥă·lî·p̄ū יַחֲלִ֣יפוּ will renew'
  - where: 'note 41:1 “A courtroom scene”'
    claim: 'The question who is judge: the nations are called to the tribunal of reason (Rosenmüller, quoted by Delitzsch)'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/41.htm'
    quote: '"The nations," says Rosenmller, "are called to judgment, not to the tribunal of God, but to that of reason."'
  - where: 'note 41:2 “The conqueror from the east”'
    claim: 'Hebrew “Who has roused from the east one whom righteousness calls to his foot”; ṣedeq (righteousness) is the subject of the verb “calls”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/isaiah/41-2.htm'
    quote: 'Who has aroused one from the east Whom He calls in righteousness to His feet?'
  - where: 'note 41:2 “The conqueror from the east”'
    claim: 'Delitzsch renders the clause “whom justice meets at his foot”; the verb qārāʾ (“calls”) is taken as qārâ, “meets”'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/41.htm'
    quote: 'Who hath raised up the man from the rising of the sun, whom justice meets at his foot'
  - where: 'note 41:2 “The conqueror from the east”'
    claim: 'Ṣedeq is “righteousness”'
    key: bdb
    url: 'https://biblehub.com/hebrew/6664.htm'
    quote: 'rightness, righteousness'
  - where: 'note 41:2 “The conqueror from the east”'
    claim: 'The clause means “whom justice comes to meet”; ṣedeq is either the justice Cyrus executes as God’s instrument or the victory awarded to his cause'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/41.htm'
    quote: 'tsedeq is either to be understood here in an attributive sense, as denoting the justice exercised by a person (viz., the justice executed successfully by Cyrus, as the instrument of Jehovah, by the force of arms); or objectively'
  - where: 'note 41:2 “The conqueror from the east”'
    claim: 'The person raised up is Cyrus, who from the east and north (Persia and Media) subdued lands from the Hindu Kush to the Aegean and became head of the Medes after Astyages was dethroned'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/41.htm'
    quote: 'after Astyages was dethroned, he became head and chief of the Medes as well as of the Persians'
  - where: 'note 41:2 “The conqueror from the east”'
    claim: 'Media lay north of Babylonia and Persia to the east; his march began from both'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/41.htm'
    quote: 'Now Media was to the north of Babylonia, and Persia to the east'
  - where: 'note 41:2 “The conqueror from the east”'
    claim: 'Verse 3: “by a course which he never trod with his feet”'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/41.htm'
    quote: 'He pursueth them and marcheth in peace by a course which he never trod with his feet.'
  - where: 'note 41:2 “The conqueror from the east”'
    claim: 'Cyrus is named in the Bible Dictionary as king of the Persians and Medes who captured Babylon'
    key: bd-cyrus
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/cyrus?lang=eng'
    quote: 'The first king of the Persians and Medes. He captured Babylon'
  - where: 'note 41:4 “The first, and with the last; I am he”'
    claim: 'The Lord is the very first, whose being precedes all history, and with the latest generations “I am it”'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/41.htm'
    quote: 'I am Jehovah, the very first, whose being precedes all history; and with the men of the latest generations yet to come "I am it."'
  - where: 'note 41:4 “The first, and with the last; I am he”'
    claim: '“I am he” can be taken as “I am the same”, God throughout all ages (compare Heb. 13:8)'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/41.htm'
    quote: 'ego sum idem (Hitzig). They are both included, without any distinction in the assertion. He is this, viz., God throughout all ages'
  - where: 'note 41:4 “The first, and with the last; I am he”'
    claim: 'Hebrew “I am He” is ʾănî hûʾ'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/isaiah/41-4.htm'
    quote: 'I, the LORD— the first and the last— I am He.'
  - where: 'note 41:4 “The first, and with the last; I am he”'
    claim: 'Jehovah denotes “the eternal I Am”'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'It denotes the “Unchangeable One,” “the eternal I Am”'
  - where: 'note 41:4 “The first, and with the last; I am he”'
    claim: 'The Septuagint (Brenton) renders 41:4 “I God, the first and to all futurity, I AM”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/isaiah/41.htm'
    quote: 'I God, the first and to all futurity, I AM.'
  - where: 'note 41:4 “The first, and with the last; I am he”'
    claim: 'In the Greek text of John 8:24 Jesus says egō eimi (“I am he”)'
    key: greek-nt
    url: 'https://biblehub.com/interlinear/john/8-24.htm'
    quote: 'egō ἐγώ I'
  - where: 'note 41:4 “The first, and with the last; I am he”'
    claim: 'In the Greek text of John 8:58 Jesus says egō eimi (“I am”)'
    key: greek-nt
    url: 'https://biblehub.com/interlinear/john/8-58.htm'
    quote: 'egō ἐγὼ I'
  - where: 'note 41:4 “The first, and with the last; I am he”'
    claim: 'The Hebrew of 41:4: “and with the last, I am He”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/isaiah/41-4.htm'
    quote: 'I, Yahweh, am the first, and with the last — I am He.'
  - where: 'note 41:7 “Encouraging each other to build a god”'
    claim: 'Everything is in confusion from terror; the gods they expect deliverance from are not made till now; the workmen stimulate one another; the soldering finished; nails keep the idol from falling'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/41.htm'
    quote: 'Everything is in confusion, from the terror that prevails; and the gods from which they expect deliverance are not made till now, the workmen stimulating one another to work.'
  - where: 'note 41:7 “Encouraging each other to build a god”'
    claim: 'The hammer-smoother and the anvil-smiter; the soldering is all right and the nails prevent the idol from falling'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/41.htm'
    quote: 'nothing more is wanting, than that he should forge upon the anvil the nails with which it is fastened, to prevent it from falling.'
  - where: 'note 41:7 “Encouraging each other to build a god”'
    claim: 'The craftsman encourages the metalworker; the soldering is pronounced good; the idol is nailed down so it will not totter'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/isaiah/41-7.htm'
    quote: 'He nails it down so it will not be toppled.'
  - where: 'note 41:7 “Encouraging each other to build a god”'
    claim: 'Kimball: whatever a man sets his heart and trust in most is his god'
    key: kimball-false-gods
    url: 'https://www.churchofjesuschrist.org/study/ensign/1976/06/the-false-gods-we-worship?lang=eng'
    quote: 'Whatever thing a man sets his heart and his trust in most is his god; and if his god doesn’t also happen to be the true and living God of Israel, that man is laboring in idolatry.'
  - where: 'note 41:7 “Encouraging each other to build a god”'
    claim: 'Kimball named money, property and “carnal security” as modern false gods'
    key: kimball-false-gods
    url: 'https://www.churchofjesuschrist.org/study/ensign/1976/06/the-false-gods-we-worship?lang=eng'
    quote: 'sufficient money, stocks, bonds, investment portfolios, property, credit cards, furnishings, automobiles, and the like to guarantee carnal security'
  - where: 'note 41:8 “My servant, My friend”'
    claim: 'Israel is the servant by a divine act of pure grace, election and call, not any excellence of its own'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/41.htm'
    quote: 'Israel is the servant of Jehovah by virtue of a divine act; and this act, viz., its election and call, was an act of pure grace'
  - where: 'note 41:8 “My servant, My friend”'
    claim: 'The calling is dated from Abraham, whom the Lord also called “my servant” (Gen. 26:24)'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/41.htm'
    quote: 'The divine act of choosing and calling is dated from Abraham.'
  - where: 'note 41:8 “My servant, My friend”'
    claim: 'The servant in 42:1 is distinct from Israel and more individual than in 41:8'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/42.htm'
    quote: 'In Isaiah 41:8 this epithet was applied to the nation, which had been chosen as the servant and for the service of Jehovah. But the servant of Jehovah who is presented to us here is distinct from Israel'
  - where: 'note 41:8 “My servant, My friend”'
    claim: 'Here the servant is the whole covenant people (“servant of Jehovah… we first meet here, … in a popular sense”)'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/41.htm'
    quote: 'we first meet with here, and that in a popular sense.'
  - where: 'note 41:8 “My servant, My friend”'
    claim: 'Abraham is “friend” (ʾōhăbî), from the verb “to love”; the participle “friend … Abraham of God Isaiah 41:8; 2 Chron 20:7”'
    key: bdb
    url: 'https://biblehub.com/hebrew/157.htm'
    quote: 'Abraham of God Isaiah 41:8; 2Chronicles 20:7.'
  - where: 'note 41:8 “My servant, My friend”'
    claim: 'Hebrew ʾōhăbî is rendered “My friend” (verb: to love)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/isaiah/41-8.htm'
    quote: 'אֹהֲבִֽי׃ My friend'
  - where: 'note 41:8 “My servant, My friend”'
    claim: 'Abraham is called the friend of God; James echoes it (James 2:23)'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/41.htm'
    quote: '"the friend of God" (James 2:23)'
  - where: 'note 41:8 “My servant, My friend”'
    claim: 'Being an heir of the Abrahamic covenant does not make one a “chosen person” per se, but signifies a calling to carry the gospel; Gentiles are adopted into the house of Israel through gospel ordinances'
    key: bd-abraham-covenant
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/abraham-covenant-of?lang=eng'
    quote: 'Being an heir to the Abrahamic covenant does not make one a “chosen person” per se but does signify that such are chosen to responsibly carry the gospel to all the peoples of the earth.'
  - where: 'note 41:8 “My servant, My friend”'
    claim: 'Those of non-Israelite lineage are adopted into the house of Israel and become the seed of Abraham through the ordinances'
    key: bd-abraham-covenant
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/abraham-covenant-of?lang=eng'
    quote: 'Those of non-Israelite lineage, commonly known as Gentiles, are adopted into the house of Israel and become heirs of the covenant and the seed of Abraham through the ordinances of the gospel'
