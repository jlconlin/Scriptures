  - where: 'note 41:14 “The worm and the Redeemer”'
    claim: 'Hebrew tôlaʿat is “worm”; a “symbol of insignificance” (Isa. 41:14)'
    key: bdb
    url: 'https://biblehub.com/hebrew/8438.htm'
    quote: 'symbol of insignificance Isaiah 41:14; Job 25:6'
  - where: 'note 41:14 “The worm and the Redeemer”'
    claim: 'Hebrew tôlaʿat (“worm”) and mĕtê yiśrāʾēl (“men of Israel”) in 41:14'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/isaiah/41-14.htm'
    quote: 'tō·w·la·‘aṯ תּוֹלַ֣עַת O worm'
  - where: 'note 41:14 “The worm and the Redeemer”'
    claim: '“Men of Israel” alludes to the phrase for few men easily numbered (Gen. 34:30; Deut. 4:27); Septuagint “Israel few in number”; “worm” with allusion to Psalm 22'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/41.htm'
    quote: 'with some allusion to the phrase מספּר מתי (i.e., few men, easily numbered) in Genesis 34:30; Deuteronomy 4:27'
  - where: 'note 41:14 “The worm and the Redeemer”'
    claim: 'Israel is called “worm of Jacob” in compassion, probably with some allusion to Psalm 22'
    key: delitzsch
    url: 'https://biblehub.com/commentaries/kad/isaiah/41.htm'
    quote: 'is called "worm of Jacob" (gen. appos.) in compassion, i.e., Jacob that is like a worm, probably with some allusion to Psalm 22:7'
  - where: 'note 41:14 “The worm and the Redeemer”'
    claim: 'The Septuagint has “Israel few in number”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/isaiah/41.htm'
