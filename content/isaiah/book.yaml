name: Isaiah
slug: isaiah

intro: |
  Isaiah is the most quoted prophet in the Book of Mormon, the New Testament, and the Doctrine and Covenants. The Savior Himself told us to search his words diligently. Isaiah is also famously hard to read. His poetry is dense, his world is 2,700 years away, and he moves between his own day, the Savior’s mortal ministry, and the last days, sometimes within a single verse.

  This companion goes through all sixty-six chapters and tries to anticipate the questions a careful reader asks: *Who is he talking to? What does that image mean? Why does this matter to me? Where is Christ in this?*

# The large movements of the book. `key` sets the color used throughout the site.
divisions:
  - key: judah
    range: [1, 12]
    name: The Holy One and His Vineyard
    blurb: Judgment and hope for Judah and Jerusalem in Isaiah’s own day. The Lord confronts a rebellious people, calls His prophet in the temple, and promises Immanuel, a child-King, and a stem out of Jesse. Nephi copied most of this section into [[2 Ne. 12–24]].
  - key: nations
    range: [13, 23]
    name: Burdens upon the Nations
    blurb: Oracles against Babylon, Assyria, Philistia, Moab, Damascus, Egypt, Edom, Tyre, and even Jerusalem. The lesson is that every empire answers to Israel’s God. Babylon in particular becomes a type of the proud world in every age.
  - key: apocalypse
    range: [24, 27]
    name: The Earth Made New
    blurb: Isaiah’s “little apocalypse.” The earth is shaken for broken covenants, then comes a feast for all peoples on the Lord’s mountain, death is swallowed up, and the dead arise.
  - key: woes
    range: [28, 35]
    name: Woe and Wonder
    blurb: Woes against leaders who trust Egypt instead of God. Out of that darkness come a sealed book, a “marvellous work and a wonder,” a righteous King, and a desert that blossoms as the rose.
  - key: hezekiah
    range: [36, 39]
    name: Hezekiah’s Crisis
    blurb: A prose interlude. Assyria besieges Jerusalem, Hezekiah prays, the Lord delivers the city, and envoys from Babylon foreshadow the exile to come. These chapters are the hinge of the book.
  - key: comfort
    range: [40, 48]
    name: Comfort Ye My People
    blurb: The voice turns to exiles in Babylon. There is no God like Israel’s God. Idols are exposed as helpless, Cyrus is named as the Lord’s instrument, and Israel is called to be His witness. Isaiah 48 opens the Book of Mormon’s Isaiah quotations in [[1 Ne. 20]].
  - key: servant
    range: [49, 55]
    name: The Servant Who Redeems
    blurb: The Servant Songs reach their height in Isaiah 53, the clearest Old Testament prophecy of the Atonement. Zion awakes, puts on her beautiful garments, and enlarges her tent. Everyone who thirsts is invited to come.
  - key: zion
    range: [56, 66]
    name: Zion, Arise and Shine
    blurb: True worship, the true fast, and the Anointed One who binds up the brokenhearted. The Lord returns in red apparel, and in the end comes a new heaven and a new earth.

