chapter: 41
title: Fear Not, Thou Worm Jacob
tagline: The Lord summons the nations and their gods to court, raises up a conqueror from the east, and tells frightened Israel, “Fear thou not; for I am with thee.”
when: 'Addressed to the exiles, c. 550–539 BC, as Cyrus rises'

setting: |
  By about 550 BC a new power was on the move. The Nabonidus Chronicle, a Babylonian record, reports that in the sixth year of King Nabonidus (550/549 BC) the army of the Median king Astyages rebelled and handed him over to **Cyrus**, king of Anshan, who marched on the Median capital, Ecbatana. Delitzsch adds that before he reached Babylon, which fell to him in 539, Cyrus subdued lands all the way to the shores of the Aegean. For the nations along the western coasts, the “isles” of verse 1, it was a frightening time: Delitzsch notes that when the Cumaeans consulted an oracle, their inquiry began by saying that they were in dread of the Persian power.

  Chapter 41 is set in that moment, and it uses a legal setting to address it. The Lord summons the nations to “come near together to judgment” (verse 1), and in the second scene tells the idols, “Produce your cause” (verse 21). The same courtroom returns in [[Isa. 43:9]], [[Isa. 44:7]], and [[Isa. 45:20–21]], where the nations or their gods are called to assemble and prove their divinity. The test is always the same: *Who controls history, and who can say in advance what will happen?* In the first scene the Lord points to the conqueror He has raised up; in the second He points to His foretelling, as Delitzsch reads it.

  Between the two scenes is something very different: a tender promise spoken directly to Israel (verses 8–20), beginning with “Fear thou not.” The contrast is the point. The nations respond to the crisis by making new idols. Israel is told to trust the God who raised the crisis up.

thread: |
  Isaiah 41 sets two responses to fear side by side.

  The first is the nations’. When the conqueror from the east appears (verses 2–3), “the isles saw it, and feared” (verse 5). Their answer is to huddle together and encourage one another, “Be of good courage,” while the carpenter cheers on the goldsmith and they nail down a new god so it won’t fall over (verses 6–7). Fear drives them to make a god they can control.

  The second is Israel’s. “But thou, Israel, art my servant” (verse 8). The Lord reminds Israel who they are: descendants of Abraham, His friend, chosen and not cast away. Then comes a cascade of promises: “Fear thou not; for I am with thee… I will strengthen thee; yea, I will help thee; yea, I will uphold thee” (verse 10). The weak “worm Jacob” becomes a threshing sledge that grinds mountains to chaff (verses 14–16). The thirsty find rivers on bare hilltops, and the desert fills with trees (verses 17–20).

  Then the Lord returns to court and challenges the idols directly: *Tell us what’s going to happen. Tell us what happened before and what it meant. Do something, good or bad, so we can see you’re real* (verses 21–24). They can’t. The Lord can, because He raised up the conqueror Himself (verse 25), and He announced it first (verse 27).

  So the chapter’s answer to fear is not a better defense. It is a better God, one who is “the first, and with the last” (verse 4), who holds history and holds Israel’s right hand (verse 13).

sections:
  - range: 1-7
    heading: The nations called to court
    plain: |
      “Be silent before Me, you coastlands. Let the nations gather their strength. Let them come forward and speak. Let us meet together for judgment. Who has stirred up a conqueror from the east, whom victory meets at every step? Who hands nations over to him and makes him trample kings? His sword turns them to dust, his bow scatters them like straw. He pursues them and moves on unharmed, along a path his feet have never traveled. Who has done this and carried it out, calling the generations from the beginning? I, the Lord, am the first, and I will be with the last. I am He.” The coastlands saw and were afraid. The ends of the earth trembled. They drew near and came. Each one helps the other and says to his brother, “Be strong!” The craftsman encourages the goldsmith, and the one who smooths metal with a hammer encourages the one who strikes the anvil. He says of the soldering, “It’s good,” and he fastens the idol with nails so it won’t totter.
  - range: 8-13
    heading: '“Fear thou not; for I am with thee”'
    plain: |
      “But you, Israel, My servant, Jacob, whom I have chosen, descendants of Abraham My friend: I took you from the ends of the earth and called you from its farthest corners. I said to you, ‘You are My servant. I have chosen you and have not rejected you.’ Do not fear, for I am with you. Do not be anxious, for I am your God. I will strengthen you. I will help you. I will hold you up with My victorious right hand. Everyone who rages against you will be put to shame and disgraced. Those who oppose you will become nothing and perish. You will look for your enemies and not find them. Those who fight against you will become nothing at all. For I, the Lord your God, hold your right hand and say to you, ‘Do not fear. I will help you.’”
  - range: 14-16
    heading: The worm becomes a threshing sledge
    plain: |
      “Do not fear, you worm Jacob, you few people of Israel. I will help you, says the Lord. Your Redeemer is the Holy One of Israel. I will make you a threshing sledge, new and sharp, with many teeth. You will thresh the mountains and crush them, and make the hills like chaff. You will winnow them, and the wind will carry them off, and a storm will scatter them. But you will rejoice in the Lord and boast in the Holy One of Israel.”
  - range: 17-20
    heading: Rivers in the desert
    plain: |
      “The poor and needy look for water, and there is none. Their tongues are parched with thirst. I, the Lord, will answer them. I, the God of Israel, will not abandon them. I will open rivers on the barren heights and springs in the valleys. I will turn the desert into a pool and the dry land into springs of water. I will plant cedar, acacia, myrtle, and olive in the wilderness. I will set cypress, elm, and pine together in the desert, so that everyone may see and know, may consider and understand, that the hand of the Lord has done this, that the Holy One of Israel has created it.”
  - range: 21-29
    heading: The idols on trial
    plain: |
      “Present your case,” says the Lord. “Bring your best arguments,” says the King of Jacob. “Let them come and tell us what is going to happen. Tell us what the earlier events were, so we can think about them and know how they turned out. Or announce to us what is coming. Tell us what will happen in the future, and we will know you are gods. Do something, good or bad, so we will be alarmed and see it together. But look: you are less than nothing, and your work is worthless. Whoever chooses you is detestable. I stirred up one from the north, and he has come. From the east he calls on My name. He tramples rulers like mortar, like a potter treading clay. Who announced this from the beginning, so we could know it? Who told us beforehand, so we could say, ‘He was right’? No one announced it. No one foretold it. No one heard a word from you. I was the first to tell Zion, ‘Look, here they are!’ I gave Jerusalem a messenger of good news. When I look, there is no one; no counselor among them who can answer when I ask. Look, they are all a delusion. Their works are nothing. Their images are wind and emptiness.”

notes:
  - ref: 1
    phrase: let us come near together to judgment
    kind: words
    title: A courtroom scene
    body: |
      “Judgment” is *mišpāṭ*, which BDB lists here under the act of deciding a case. The Lord is convening a trial. Delitzsch reads the islands (*ʾiyyîm*) as the inhabitants of the western islands and coasts first of all, and through them the whole non-Israelite world. They are told to be silent, then to come near and speak after hearing the evidence, for the Lord means to go through all the forms of a legal process with them.

      The language of verse 1 echoes the end of chapter 40 on purpose. There, those who wait on the Lord “shall renew their strength” ([[Isa. 40:31]]). Here the nations are told, with some irony, to “renew their strength”; the Hebrew (*yaḥălîpû kōaḥ*) is the same phrase in both verses. Delitzsch’s reading is that they are to put on fresh strength so that they will have no excuse if they are defeated. The contrast is pointed: Israel renews its strength by waiting on God, the nations by gathering their own.

      But if the Lord is one of the parties, who is the judge? Delitzsch, quoting an older commentator, answers that the nations are called to the tribunal of reason, which cannot fail to recognize the facts. The question before the court is whether any other god is real.
    sources: [bdb, delitzsch, biblehub-interlinear]
  - ref: 2
    phrase: Who raised up the righteous man from the east
    kind: history
    title: The conqueror from the east
    body: |
      The Hebrew is more compressed than the KJV: “Who has roused from the east one whom *ṣedeq* calls to his foot?” *Ṣedeq* is “righteousness” (BDB), and the verb “calls” can also mean “meets.” Delitzsch reads it as “whom justice meets at his foot,” and takes the word either as the justice Cyrus carries out as God’s instrument or as the favorable result, the victory, that comes to his cause. Translations vary: the NRSVUE has “roused a victor from the east, summoned him to his service,” and the NIV “calling him in righteousness to his service.” The Septuagint treats the word differently: “Who raised up righteousness from the east, called it to his feet?”

      Delitzsch identifies the figure as **Cyrus**, who is named outright in [[Isa. 44:28]] and [[Isa. 45:1]]. He finds the description fitting: Cyrus subdued lands from the Hindu Kush to the Aegean, and in verse 3 “he pursueth them, and passed safely; even by the way that he had not gone with his feet.” Delitzsch takes this to mean a course he had never trodden before. Verse 25 adds that he comes “from the north” and “from the rising of the sun.” Delitzsch points out that Media lay north of Babylonia and Persia to the east, and that Cyrus, who was a Persian, became head of the Medes as well as the Persians after Astyages was dethroned.

      An ancient Aramaic paraphrase of Isaiah took a different line. Abraham came out of Ur of the Chaldees ([[Gen. 11:31]]), and the Targum renders the verse, “Who openly brought Abraham from the east? He brought the chosen of the righteous in truth to his place.” Verse 8 goes on to call Israel “the seed of Abraham my friend,” so the reading is a reminder of how naturally the patriarch comes to mind in this chapter.
    sources: [delitzsch, bdb, biblehub-interlinear, nrsvue, niv, lxx-rahlfs, targum-isaiah-pauli, bd-cyrus]
  - ref: 4
    phrase: I the LORD, the first, and with the last; I am he
    kind: christ
    title: '“The first, and with the last; I am he”'
    body: |
      This is the first of several statements in these chapters in which the Lord calls Himself the first and the last ([[Isa. 44:6]]; [[Isa. 48:12]]). Delitzsch reads it this way: He is the very first, whose being precedes all history, and He is with the latest generations still to come. So history is His to direct.

      “I am he” is *ʾănî hûʾ*. Delitzsch takes it as “I am the same,” God throughout all ages, and compares [[Heb. 13:8]]. The Bible Dictionary says the name Jehovah denotes “the eternal I Am.” The Greek Septuagint puts it in just those terms here: “I God, the first, and to [all] futurity, *egō eimi*,” “I am.” In the Greek text of John, Jesus uses the same two words: “if ye believe not that I am he, ye shall die in your sins” ([[John 8:24]]), and “Before Abraham was, I am” ([[John 8:58]]).

      Revelation completes the link. The risen Christ tells John, “I am the first and the last” ([[Rev. 1:17]]; compare [[Rev. 22:13]]), and He introduces Himself in our dispensation the same way: “I am Alpha and Omega, Christ the Lord; yea, even I am he, the beginning and the end, the Redeemer of the world” ([[D&C 19:1]]).
    sources: [delitzsch, bd-jehovah, lxx-rahlfs, greek-nt, biblehub-interlinear]
  - ref: 7
    phrase: he fastened it with nails, that it should not be moved
    kind: symbol
    title: Encouraging each other to build a god
    body: |
      The satire is sharp. The coastlands panic, and their response is a team-building exercise. Everyone says, “Be of good courage.” The carpenter encourages the goldsmith; the man with the hammer encourages the man at the anvil. They check the soldering, pronounce it “good,” and nail the god down so it won’t tip over (compare [[Isa. 40:20]]). Delitzsch points out that the gods these nations expect deliverance from are not even made until now, and that the workmen are spurring each other on in the confusion of terror.

      There is nothing wrong with mutual encouragement. But encouragement can’t substitute for truth. A group of people cheering one another on as they invest in something empty is still investing in something empty. President Spencer W. Kimball wrote, “Whatever thing a man sets his heart and his trust in most is his god,” and he pointed to money, property, and “carnal security” as the modern counterparts of ancient idols. The question for any of us is whether our “Be of good courage” rests on something that can actually hold us up.
    sources: [delitzsch, biblehub-interlinear, kimball-false-gods]
  - ref: 8
    phrase: But thou, Israel, art my servant, Jacob whom I have chosen, the seed of Abraham my friend
    kind: words
    title: My servant, My friend
    body: |
      This verse introduces one of the central terms of Isaiah 40–55: **the servant** (*ʿebed*). Delitzsch says we first meet the leading thought “servant of Jehovah” here, in a popular sense: Israel is the servant by an act of pure grace, the Lord’s choosing and calling, not by any excellence of its own. He dates that calling to Abraham, whom the Lord also called “my servant” ([[Gen. 26:24]]). Later, in passages that commentators group as the “Servant Songs” ([[Isa. 42:1–9]]; [[Isa. 49:1–13]]; [[Isa. 50:4–11]]; [[Isa. 52:13–53:12]]), the servant is more individual. Keep this verse in mind. Here the servant is the whole covenant people.

      Abraham is called God’s “friend,” in Hebrew *ʾōhăbî*, a participle of “to love”: “the one who loves me.” BDB glosses the participle as “friend” and cites this verse and Jehoshaphat’s prayer ([[2 Chr. 20:7]]); James echoes it ([[James 2:23]]). Delitzsch adds that in the East Abraham is called “the friend of God” to this day (he gives the Arabic as “chalil ollah”). The Septuagint has “whom I have loved.”

      Latter-day Saints hear the covenant with Abraham in this verse. The Lord promised Abraham that “as many as receive this Gospel shall be called after thy name, and shall be accounted thy seed” ([[Abr. 2:10]]). The Bible Dictionary says that being an heir of the Abrahamic covenant does not make one a “chosen person” in itself, but signals a calling to carry the gospel to all peoples, and that those of non-Israelite lineage are adopted into the house of Israel and become the seed of Abraham through the gospel’s ordinances. Being the servant isn’t an ethnic privilege. It’s a covenant calling. In a revelation given through Joseph Smith, those who receive the priesthood and are faithful become “the seed of Abraham” ([[D&C 84:34]]).
    sources: [delitzsch, bdb, biblehub-interlinear, lxx-rahlfs, bd-abraham-covenant]
  - ref: 10
    phrase: 'Fear thou not; for I am with thee: be not dismayed; for I am thy God'
    kind: structure
    title: A word of assurance
    body: |
      Verses 8–13 follow a pattern: an address to Israel, the words “Fear not,” a reason (“for I am with thee”), and a promise. The same pattern returns elsewhere in these chapters ([[Isa. 43:1–7]]; [[Isa. 44:1–5]]). Delitzsch hears in the address “a pressing, clinging, and, as it were, loving key-note.”

      Notice the verbs, which build like a stack of reassurances: I am with thee, I am thy God, I will strengthen, I will help, I will uphold. Latter-day Saints sing this verse almost word for word in “How Firm a Foundation”: “Fear not, I am with thee; oh, be not dismayed, for I am thy God and will still give thee aid.”

      The Lord spoke similar words to Joseph Smith and Oliver Cowdery in 1829: “Fear not, little flock; do good; let earth and hell combine against you, for if ye are built upon my rock, they cannot prevail” ([[D&C 6:34]]).
    sources: [delitzsch, hymn-how-firm]
  - ref: 14
    phrase: Fear not, thou worm Jacob, and ye men of Israel; I will help thee, saith the LORD, and thy redeemer, the Holy One of Israel
    kind: christ
    title: The worm and the Redeemer
    body: |
      “Worm” (*tôlaʿat*) is not an insult here. BDB lists it as a “symbol of insignificance,” and it is an honest description of how small and helpless the exiles felt. For “ye men of Israel” the Hebrew is *mĕtê yiśrāʾēl*; Delitzsch connects the phrase to an idiom for a few men who could be counted at a glance (see [[Gen. 34:30]] and [[Deut. 4:27]]), and the Septuagint has “Israel few in number.” Delitzsch hears in “worm” a compassionate allusion to Psalm 22, where the same word appears: “But I am a worm, and no man; a reproach of men, and despised of the people” ([[Ps. 22:6]]). Jesus quoted the first line of that psalm from the cross ([[Matt. 27:46]]). The Holy One of Israel knows what it is to be a worm.

      There is another layer. The same Hebrew word names the insect from which ancient dyers made scarlet (*tôlaʿat šānî*, BDB: the *coccus ilicis*; see [[Ex. 25:4]]). The word Isaiah uses in his first chapter, “though they be red like crimson, they shall be as wool” ([[Isa. 1:18]]), is *tôlāʿ*, which BDB glosses “scarlet stuff.”

      The word “redeemer” here is *gōʾēl*. BDB lists thirteen passages in which the Lord is *gōʾēl*, from this verse through [[Isa. 63:16]]; none comes earlier in the book, so this is its first appearance as a title of God in Isaiah. A *gōʾēl* was the next of kin who acted for the family: BDB lists redeeming a field ([[Lev. 25:25]]), redeeming a relative from bondage ([[Lev. 25:47–49]]), taking a kinsman’s widow ([[Ruth 4:1–10]]), and the avenger of blood ([[Num. 35:19]]). By choosing this word, the Lord makes Himself Israel’s kinsman. The Redeemer is family. Nephi, steeped in Isaiah, uses the same cluster of titles for Christ: the scattered will “know that the Lord is their Savior and their Redeemer, the Mighty One of Israel” ([[1 Ne. 22:12]]). The Bible Dictionary says “Holy One of Israel” is a name for the Savior, used most often by Isaiah.
    sources: [bdb, delitzsch, biblehub-interlinear, lxx-rahlfs, bd-holy-one]
  - ref: 15
    phrase: I will make thee a new sharp threshing instrument having teeth
    kind: symbol
    title: The weak things thresh the nations
    body: |
      A threshing sledge (*môrag*) was a tool for threshing grain. BDB describes the modern sledge as set with sharp stones or pieces of iron. Delitzsch reads the Hebrew here as a sledge with sharp, double-edged knives underneath, and takes the mountains and hills it grinds to powder as a figure for proud and mighty foes.

      The image is a deliberate reversal. A worm, the weakest thing imaginable, becomes a sharp new sledge that grinds *mountains* into chaff. Micah uses a similar picture of the daughter of Zion threshing the nations ([[Micah 4:13]]).

      The Lord used Isaiah’s image in a revelation given through Joseph Smith and Sidney Rigdon in December 1830: “I call upon the weak things of the world, those who are unlearned and despised, to thresh the nations by the power of my Spirit” ([[D&C 35:13]]). The power is not in the sledge. It is in the One who drives it.
    sources: [bdb, delitzsch, biblehub-interlinear]
  - ref: 19
    phrase: I will plant in the wilderness the cedar, the shittah tree, and the myrtle, and the oil tree
    kind: symbol
    title: Seven trees in the desert
    body: |
      The Lord names seven trees. The cedar is the great tree of Lebanon: “the cedars of Lebanon, which he hath planted” ([[Ps. 104:16]]). The “shittah” is the acacia, which BDB describes as growing in dry places; its wood (plural *shiṭṭîm*) was the material of the ark ([[Ex. 25:10]]). The myrtle and the “oil tree” (Delitzsch: the wild olive) follow. The last three are uncertain. The KJV has fir, pine, and box; the Bible Hub interlinear gives cypress, elm, and boxwood; Delitzsch reads cypress, plane, and “sherbin” (a kind of cedar). He counts seven (four and three), and takes seven as a sign of the divine character of this manifold development. The point is not a scanty vegetation but a large, dense, well-watered forest where neither foot nor eye could find a resting place before.

      This is the reversal of chapter 40’s withering grass. Isaiah returns again and again to water in the desert ([[Isa. 35:1–7]]; [[Isa. 43:19–20]]; [[Isa. 44:3–4]]); Delitzsch notes that these verses echo the promise of [[Isa. 35:6–7]]. The spiritual application is just as real: the Lord makes things grow where nothing should.
    sources: [delitzsch, bdb, biblehub-interlinear]
  - ref: 23
    phrase: Shew the things that are to come hereafter, that we may know that ye are gods
    kind: history
    title: The test of prophecy
    body: |
      The Lord’s challenge to the idols is precise. Tell us “the former things,” what they are, or tell us “things for to come” (verse 22). Or at least *do* something, good or evil (verse 23). Delitzsch reads the “former things” here as what will happen first and next, in the near future, and “things to come” as the remote future, which would be far harder to predict. “Do good, or do evil” he takes to mean that they should show some sign of life, no matter what. A god who can neither foretell nor act is no god at all.

      This argument from prophecy runs all through chapters 41–48 ([[Isa. 42:9]]; [[Isa. 44:7–8]]; [[Isa. 45:21]]; [[Isa. 46:9–10]]; [[Isa. 48:3–6]]). It is one reason the naming of Cyrus is so central to these chapters. Delitzsch discusses verses 26–27 on both assumptions about who wrote them, whether Isaiah looked ahead to Cyrus or a prophet of the exile looked back to earlier prophecies such as [[Isa. 13:1–14:23]], and finds that either way the Lord is claiming to have foretold the fall of Babylon and the redemption of Israel. For the text itself, the Lord’s claim to predict is the whole point.

      The same principle runs through the Restoration. The Lord told Joseph Smith that His word would “all be fulfilled” ([[D&C 1:37–38]]). Amos stated the principle simply: “Surely the Lord GOD will do nothing, but he revealeth his secret unto his servants the prophets” ([[Amos 3:7]]).
    sources: [delitzsch]
  - ref: 25
    phrase: from the rising of the sun shall he call upon my name
    kind: history
    title: Did Cyrus call on the Lord’s name?
    body: |
      This is surprising. The Persian king was not, so far as his own inscription shows, a worshipper of Israel’s God. In the **Cyrus Cylinder**, the clay proclamation issued after he entered Babylon, Cyrus says that Marduk, Babylon’s god, “searched” all lands for “a righteous prince, after his own heart,” called “Cyrus, king of Anshan” by name, and took him to Babylon “as a friend and companion at his side.” Cyrus also says Marduk “graciously blessed me, Cyrus, the king who worships him.” In Babylon he spoke the language of Babylon’s religion.

      Yet [[Ezra 1:2]] records a decree in which Cyrus says, “The LORD God of heaven hath given me all the kingdoms of the earth; and he hath charged me to build him an house at Jerusalem.” Delitzsch takes the Hebrew to mean either that Cyrus would call upon the Lord’s name or that he would call out the name, as he does in this edict setting the exiles free. Delitzsch also notes that the Persian religion, though nearest to the faith of Israel of all the systems of heathenism, was a heathen religion after all.

      The Septuagint reads a passive, “they shall be called by my name,” which removes the problem. But the main point doesn’t depend on the variant. Isaiah later says bluntly that Cyrus did *not* know the Lord: “I girded thee, though thou hast not known me” ([[Isa. 45:5]]). God can use people who don’t know Him to accomplish His purposes, and they may even use His name without understanding it.
    sources: [rogers-cuneiform, delitzsch, lxx-rahlfs, bd-cyrus]

christ: |
  The God who speaks in Isaiah 41 calls Himself “the first, and with the last,” and says “I am he” (verse 4), titles that Jesus applies to Himself in John and Revelation and in the Doctrine and Covenants. He is the *gōʾēl*, the kinsman-Redeemer of Israel (verse 14), who buys back His family from bondage.

  He also knows the weakness He addresses. Israel is called a worm, and Jesus, in the psalm He quoted from the cross, is the one who said, “I am a worm, and no man” ([[Ps. 22:6]]). The Lord who holds Israel’s right hand (verse 13) is the One who descended below all things ([[D&C 122:8]]), and so His “Fear not” is not spoken from a distance.

explore: |
  - **The trial speeches.** Read [[Isa. 41:1–7]], [[Isa. 41:21–29]], [[Isa. 43:8–13]], [[Isa. 44:6–8]], and [[Isa. 45:20–25]] in a row.
  - **“Fear not.”** Collect the “fear not” promises in [[Isa. 41:10–14]], [[Isa. 43:1–5]], [[Isa. 44:2–8]], and compare [[D&C 6:33–37]] and [[D&C 68:6]].
  - **Abraham, the friend of God.** Read [[2 Chr. 20:7]], [[James 2:21–23]], and [[Abr. 2:6–11]].
  - **The Redeemer.** Trace *gōʾēl* through [[Isa. 43:14]], [[Isa. 44:6]], [[Isa. 47:4]], [[Isa. 54:5]], and [[Isa. 59:20]], and compare the book of Ruth.
  - **Cyrus.** Read [[Ezra 1:1–4]] and a translation of the Cyrus Cylinder side by side.

parallels:
  - ref: Ps. 22:6
    note: “I am a worm, and no man,” in the psalm Jesus quoted from the cross.
  - ref: D&C 35:13
    note: The weak things of the world will thresh the nations by the Spirit.
  - ref: Rev. 1:17
    note: The risen Christ calls Himself the first and the last.

