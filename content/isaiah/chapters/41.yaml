chapter: 41
title: Fear Not, Thou Worm Jacob
tagline: The Lord summons the nations and their gods to court, raises up a conqueror from the east, and tells frightened Israel, “Fear thou not; for I am with thee.”
when: 'Addressed to the exiles, c. 550–540 BC, as Cyrus rises'

setting: |
  By about 550 BC a new power was on the move. **Cyrus II** of Persia overthrew his Median overlord Astyages (550), conquered Croesus of Lydia in western Asia Minor (around 547–546), and was plainly heading toward Babylon, which fell to him in 539. For the nations along the Mediterranean coast, the “isles” of verse 1, it was a terrifying time. Every city was asking its gods what would happen next.

  Chapter 41 is set in that moment, and it uses a legal setting to address it. Form critics, especially Claus Westermann, identified several **trial speeches** in Isaiah 40–48 (41:1–7, 41:21–29, 43:8–13, 44:6–8, 45:20–25). In each, the Lord summons the nations or their gods into court and challenges them to prove their divinity. The test is always the same: *Who controls history, and who can say in advance what will happen?*

  Between the two trial scenes is something very different: a **salvation oracle** (verses 8–20), a tender promise spoken directly to Israel, beginning with “Fear thou not.” The contrast is the point. The nations respond to the crisis by building better idols. Israel is told to trust the God who raised the crisis up.

thread: |
  Isaiah 41 sets two responses to fear side by side.

  The first is the nations’. When the conqueror from the east appears (verses 2–3), “the isles saw it, and feared” (verse 5). Their answer is to huddle together and encourage one another, “Be of good courage,” while the carpenter cheers on the goldsmith and they nail down a new god so it won’t fall over (verses 6–7). Fear drives them to make a god they can control.

  The second is Israel’s. “But thou, Israel, art my servant” (verse 8). The Lord reminds Israel who they are: descendants of Abraham, His friend, chosen and not cast away. Then comes a cascade of promises: “Fear thou not; for I am with thee… I will strengthen thee; yea, I will help thee; yea, I will uphold thee” (verse 10). The weak “worm Jacob” becomes a threshing sledge that grinds mountains to chaff (verses 14–16). The thirsty find rivers on bare hilltops, and the desert fills with trees (verses 17–20).

  Then the Lord returns to court and challenges the idols directly: *Tell us what’s going to happen. Tell us what happened before and what it meant. Do something, good or bad, so we can see you’re real* (verses 21–24). They can’t. The Lord can, because He raised up the conqueror Himself (verse 25), and He announced it first (verse 27).

  So the chapter’s answer to fear is not a better defense. It is a better God, one who is “the first, and with the last” (verse 4), who holds history and holds Israel’s right hand (verse 13).

sections:
  - range: 1-7
    heading: The nations called to court
    plain: |
      “Be silent before Me, you coastlands. Let the nations gather their strength. Let them come forward and speak. Let us meet together for judgment. Who has stirred up a conqueror from the east, whom victory meets at every step? Who hands nations over to him and makes him trample kings? His sword turns them to dust, his bow scatters them like straw. He pursues them and moves on unharmed, along a path his feet have never traveled. Who has done this and carried it out, calling the generations from the beginning? I, the Lord, am the first, and I will be with the last. I am He.” The coastlands saw and were afraid. The ends of the earth trembled. They drew near and came. Each one helps the other and says to his brother, “Be strong!” The craftsman encourages the goldsmith, and the one who smooths metal with a hammer encourages the one who strikes the anvil. He says of the soldering, “It’s good,” and he fastens the idol with nails so it won’t totter.
  - range: 8-13
    heading: '“Fear thou not; for I am with thee”'
    plain: |
      “But you, Israel, My servant, Jacob, whom I have chosen, descendants of Abraham My friend: I took you from the ends of the earth and called you from its farthest corners. I said to you, ‘You are My servant. I have chosen you and have not rejected you.’ Do not fear, for I am with you. Do not be anxious, for I am your God. I will strengthen you. I will help you. I will hold you up with My victorious right hand. Everyone who rages against you will be put to shame and disgraced. Those who oppose you will become nothing and perish. You will look for your enemies and not find them. Those who fight against you will become nothing at all. For I, the Lord your God, hold your right hand and say to you, ‘Do not fear. I will help you.’”
  - range: 14-16
    heading: The worm becomes a threshing sledge
    plain: |
      “Do not fear, you worm Jacob, you few people of Israel. I will help you, says the Lord. Your Redeemer is the Holy One of Israel. I will make you a threshing sledge, new and sharp, with many teeth. You will thresh the mountains and crush them, and make the hills like chaff. You will winnow them, and the wind will carry them off, and a storm will scatter them. But you will rejoice in the Lord and boast in the Holy One of Israel.”
  - range: 17-20
    heading: Rivers in the desert
    plain: |
      “The poor and needy look for water, and there is none. Their tongues are parched with thirst. I, the Lord, will answer them. I, the God of Israel, will not abandon them. I will open rivers on the barren heights and springs in the valleys. I will turn the desert into a pool and the dry land into springs of water. I will plant cedar, acacia, myrtle, and olive in the wilderness. I will set cypress, elm, and pine together in the desert, so that everyone may see and know, may consider and understand, that the hand of the Lord has done this, that the Holy One of Israel has created it.”
  - range: 21-29
    heading: The idols on trial
    plain: |
      “Present your case,” says the Lord. “Bring your best arguments,” says the King of Jacob. “Let them come and tell us what is going to happen. Tell us what the earlier events were, so we can think about them and know how they turned out. Or announce to us what is coming. Tell us what will happen in the future, and we will know you are gods. Do something, good or bad, so we will be alarmed and see it together. But look: you are less than nothing, and your work is worthless. Whoever chooses you is detestable. I stirred up one from the north, and he has come. From the east he calls on My name. He tramples rulers like mortar, like a potter treading clay. Who announced this from the beginning, so we could know it? Who told us beforehand, so we could say, ‘He was right’? No one announced it. No one foretold it. No one heard a word from you. I was the first to tell Zion, ‘Look, here they are!’ I gave Jerusalem a messenger of good news. When I look, there is no one; no counselor among them who can answer when I ask. Look, they are all a delusion. Their works are nothing. Their images are wind and emptiness.”

notes:
  - ref: 1
    phrase: let us come near together to judgment
    kind: words
    title: A courtroom scene
    body: |
      “Judgment” is *mišpāṭ*, a legal proceeding. The Lord is convening a trial. The islands (*ʾiyyîm*, the coastlands and islands of the Mediterranean, a way of saying “the far-flung nations”) are ordered to be silent while court is in session, then to come forward and argue their case.

      The language of verse 1 echoes the end of chapter 40 on purpose. There, those who wait on the Lord “shall renew their strength” ([[Isa. 40:31]]). Here the nations are told, with some irony, to “renew their strength” and try their best arguments. Some scholars think the phrase was copied by mistake from 40:31. Others, more persuasively, see a deliberate contrast: Israel renews its strength by waiting on God, the nations by gathering their own.

      This “trial speech” form reappears throughout chapters 41–48. The Lord is prosecutor, defendant, and judge at once, and the question before the court is whether any other god is real.
    sources: [westermann, paul-40-66]
  - ref: 2
    phrase: Who raised up the righteous man from the east
    kind: history
    title: The conqueror from the east
    body: |
      The Hebrew is more compressed than the KJV: “Who has roused from the east one whom *ṣedeq* calls to his foot?” The word *ṣedeq* usually means righteousness, but in these chapters it often means **vindication** or **victory**, the right outcome that God brings about. Modern translations render it “whom victory meets at every step” (NRSV) or “calling him in righteousness to his service” (NIV).

      Most readers, ancient and modern, identify this figure as **Cyrus**, who is named outright in [[Isa. 44:28]] and [[Isa. 45:1]]. The description fits his career: sweeping conquests from Media to Lydia, moving so fast that he traveled “by the way that he had not gone with his feet” (verse 3), that is, at a pace as if his feet hardly touched the road. Verse 25 adds that he comes “from the north” and “from the rising of the sun,” which fits a Persian king who had absorbed Media to the north of Babylon.

      Early Jewish interpretation took a different line. The Targum and rabbinic tradition read the verse as referring to **Abraham**, who came from the east (Ur) and defeated the kings in [[Gen. 14]]. That reading is mentioned in verse 8. It doesn’t fit the details of verses 2–3 and 25 as well, but it’s a reminder that for Jewish readers the phrase “the righteous man” sounded like the patriarch.
    sources: [bd-cyrus, paul-40-66, childs]
  - ref: 4
    phrase: I the LORD, the first, and with the last; I am he
    kind: christ
    title: '“The first, and with the last; I am he”'
    body: |
      This is the first of several statements in these chapters in which the Lord calls Himself the first and the last ([[Isa. 44:6]]; [[Isa. 48:12]]). He was there before history began and He will be there when it ends, so history is His to direct.

      “I am he” is *ʾănî hûʾ*. The Greek Septuagint often translated such phrases with *egō eimi*, “I am,” and that phrase carries enormous weight in the Gospel of John. Jesus says, “if ye believe not that I am he, ye shall die in your sins” ([[John 8:24]]), and “Before Abraham was, I am” ([[John 8:58]]). The words that Isaiah uses for Israel’s God are the words Jesus uses for Himself.

      Revelation completes the link. The risen Christ tells John, “I am the first and the last” ([[Rev. 1:17]]; compare [[Rev. 22:13]]), and He introduces Himself in our dispensation the same way: “I am Alpha and Omega, Christ the Lord; yea, even I am he, the beginning and the end, the Redeemer of the world” ([[D&C 19:1]]).
    sources: [bd-jehovah]
  - ref: 7
    phrase: he fastened it with nails, that it should not be moved
    kind: symbol
    title: Encouraging each other to build a god
    body: |
      The satire is sharp. The coastlands panic, and their response is a team-building exercise. Everyone says, “Be of good courage.” The carpenter encourages the goldsmith; the man with the hammer encourages the man at the anvil. They check the soldering, pronounce it “good,” and nail the god down so it won’t tip over (compare [[Isa. 40:20]]).

      There is nothing wrong with mutual encouragement. But encouragement can’t substitute for truth. A group of people cheering one another on as they invest in something empty is still investing in something empty. President Spencer W. Kimball warned that modern idols are the things we trust in place of God: possessions, status, security, our own ingenuity. The question for any of us is whether our “Be of good courage” rests on something that can actually hold us up.
    sources: [kimball-false-gods]
  - ref: 8
    phrase: But thou, Israel, art my servant, Jacob whom I have chosen, the seed of Abraham my friend
    kind: words
    title: My servant, My friend
    body: |
      This verse introduces one of the central terms of Isaiah 40–55: **the servant** (*ʿebed*). Here the servant is plainly Israel as a people. Later, in the passages scholars call the “Servant Songs” ([[Isa. 42:1–9]]; [[Isa. 49:1–13]]; [[Isa. 50:4–11]]; [[Isa. 52:13–53:12]]), the figure becomes more individual and more mysterious. Keep this verse in mind. The servant begins as the whole covenant people.

      Abraham is called God’s “friend,” literally *ʾōhăbî*, “the one who loved me.” The same title appears in Jehoshaphat’s prayer ([[2 Chr. 20:7]]) and in James ([[James 2:23]]). To this day Arabic-speaking Muslims call Abraham *al-Khalīl*, “the Friend,” and Hebron, the city of his tomb, is called al-Khalil.

      Latter-day Saints hear the covenant with Abraham in this verse. The Lord promised Abraham that “as many as receive this Gospel shall be called after thy name, and shall be accounted thy seed” ([[Abr. 2:10]]). Being the servant isn’t an ethnic privilege. It’s a covenant calling. The Lord told Joseph Smith that those who receive the priesthood and are faithful become “the seed of Abraham” ([[D&C 84:34]]).
    sources: [bd-abraham-covenant]
  - ref: 10
    phrase: 'Fear thou not; for I am with thee: be not dismayed; for I am thy God'
    kind: structure
    title: The salvation oracle
    body: |
      Verses 8–13 follow a pattern scholars call the **salvation oracle** (*Heilsorakel*), first described by Joachim Begrich in the 1930s. Its elements are an address, the words “Fear not,” a reason (“for I am with thee”), and a promise. Begrich suggested that priests spoke such oracles in the temple in response to individual laments, as an answer from God. Whether or not that setting is right, the form recurs throughout Isaiah 40–55 ([[Isa. 43:1–7]]; [[Isa. 44:1–5]]).

      Notice the verbs, which build like a stack of reassurances: I am with thee, I am thy God, I will strengthen, I will help, I will uphold. Latter-day Saints sing this verse almost word for word in “How Firm a Foundation”: “Fear not, I am with thee; oh, be not dismayed, for I am thy God and will still give thee aid.”

      The Lord spoke the same words to Joseph Smith and Oliver Cowdery: “Fear not, little flock; do good; let earth and hell combine against you, for if ye are built upon my rock, they cannot prevail” ([[D&C 6:34]]).
    sources: [westermann, hymn-how-firm]
  - ref: 14
    phrase: Fear not, thou worm Jacob, and ye men of Israel; I will help thee, saith the LORD, and thy redeemer, the Holy One of Israel
    kind: christ
    title: The worm and the Redeemer
    body: |
      “Worm” (*tôlaʿat*) is not an insult here. It’s an honest description of how small and helpless the exiles felt. It is also the word used in [[Ps. 22:6]]: “But I am a worm, and no man; a reproach of men, and despised of the people.” Jesus quoted the first line of that psalm from the cross ([[Matt. 27:46]]), and Christians have long read the whole psalm as His. The Holy One of Israel knows what it is to be a worm.

      There is another layer. The same Hebrew word names the scale insect from which ancient dyers made crimson (*tôlaʿat šānî*, “scarlet worm”; see [[Ex. 25:4]]). Isaiah used it in his first chapter: “though they be red like crimson, they shall be as wool” ([[Isa. 1:18]]), where “crimson” is *tôlāʿ*.

      The word “redeemer” here is *gōʾēl*, and this is its first appearance in Isaiah as a title of God. It will occur more than a dozen times in chapters 41–63. A *gōʾēl* was the next of kin who bought back family land, freed a relative from debt-slavery, or avenged a killing ([[Lev. 25:25]], [[Lev. 25:47–49]]; [[Ruth 4:1–10]]). By choosing this word, the Lord makes Himself Israel’s kinsman. The Redeemer is family. Nephi, steeped in Isaiah, uses the same cluster of titles for Christ: the scattered will “know that the Lord is their Savior and their Redeemer, the Mighty One of Israel” ([[1 Ne. 22:12]]).
    sources: [bd-holy-one, gs-holy-one]
  - ref: 15
    phrase: I will make thee a new sharp threshing instrument having teeth
    kind: symbol
    title: The weak things thresh the nations
    body: |
      A threshing sledge (*môrag*) was a heavy wooden board with sharp stones or iron teeth set into its underside. Oxen dragged it in circles over harvested grain to separate kernels from husks. Sledges like this were still used in rural parts of the Middle East and Turkey within living memory.

      The image is a deliberate reversal. A worm, the weakest thing imaginable, becomes a sharp new sledge that grinds *mountains* into chaff. Micah uses a similar picture of the daughter of Zion threshing the nations ([[Micah 4:13]]).

      The Lord used Isaiah’s image in a revelation given in December 1830: “I call upon the weak things of the world, those who are unlearned and despised, to thresh the nations by the power of my Spirit” ([[D&C 35:13]]). The power is not in the sledge. It is in the One who drives it.
  - ref: 19
    phrase: I will plant in the wilderness the cedar, the shittah tree, and the myrtle, and the oil tree
    kind: symbol
    title: Seven trees in the desert
    body: |
      The Lord names seven trees, and several of them could never grow together naturally. The cedar belongs to the mountains of Lebanon. The “shittah” is the acacia, a tough desert tree used for the ark of the covenant ([[Ex. 25:10]]). The myrtle and the “oil tree” (probably the olive, or possibly a resinous pine) belong to more fertile land. The last three are uncertain; modern translations offer cypress, plane, elm, pine, and box. Seven is a number of completeness, and the mixture is the point. The desert becomes a forest that only a Creator could plant.

      This is the reversal of chapter 40’s withering grass. Isaiah returns again and again to water in the desert as a sign of the new exodus ([[Isa. 35:1–7]]; [[Isa. 43:19–20]]; [[Isa. 44:3–4]]). Latter-day Saints who settled the arid Great Basin read these verses, and [[Isa. 35:1]], with special feeling. The spiritual application is just as real: the Lord makes things grow where nothing should.
  - ref: 23
    phrase: Shew the things that are to come hereafter, that we may know that ye are gods
    kind: history
    title: The test of prophecy
    body: |
      The Lord’s challenge to the idols is precise. Tell us “the former things,” what happened and what it meant; or tell us “things for to come” (verse 22). Or at least *do* something, good or evil (verse 23). A god who can neither explain history nor predict it nor act in it is no god at all.

      This argument from prophecy runs all through chapters 41–48 ([[Isa. 42:9]]; [[Isa. 44:7–8]]; [[Isa. 45:21]]; [[Isa. 46:9–10]]; [[Isa. 48:3–6]]). It is one reason the naming of Cyrus is so central to these chapters, and also why the question of whether Cyrus was named in advance matters to readers on every side of the authorship debate. For the text itself, the Lord’s claim to predict is the whole point.

      The same principle runs through the Restoration. The Book of Mormon was introduced to the world partly by fulfilled prophecy, and the Lord told Joseph Smith that His word would “all be fulfilled” ([[D&C 1:37–38]]). Amos stated the principle simply: “Surely the Lord GOD will do nothing, but he revealeth his secret unto his servants the prophets” ([[Amos 3:7]]).
  - ref: 25
    phrase: from the rising of the sun shall he call upon my name
    kind: history
    title: Did Cyrus call on the Lord’s name?
    body: |
      This is surprising. The Persian king was not a worshipper of Israel’s God. In the **Cyrus Cylinder**, the clay proclamation he issued after taking Babylon in 539, Cyrus says it was *Marduk*, Babylon’s god, who chose him and walked at his side. In Babylon he spoke the language of Babylon’s religion.

      Yet [[Ezra 1:2]] records a decree in which Cyrus says, “The LORD God of heaven hath given me all the kingdoms of the earth; and he hath charged me to build him an house at Jerusalem.” Cyrus seems to have told each subject people that their own god had sent him. That was shrewd policy, and it produced the return from exile.

      The Septuagint reads a passive, “they shall be called by my name,” which softens the problem. But the main point doesn’t depend on the variant. Isaiah later says bluntly that Cyrus did *not* know the Lord: “I girded thee, though thou hast not known me” ([[Isa. 45:5]]). God can use people who don’t know Him to accomplish His purposes, and they may even use His name without understanding it.
    sources: [cyrus-cylinder, bd-cyrus, paul-40-66]

christ: |
  The God who speaks in Isaiah 41 calls Himself “the first, and with the last,” and says “I am he” (verse 4), titles that Jesus applies to Himself in John and Revelation and in the Doctrine and Covenants. He is the *gōʾēl*, the kinsman-Redeemer of Israel (verse 14), who buys back His family from bondage.

  He also knows the weakness He addresses. Israel is called a worm, and Jesus, in the psalm He quoted from the cross, is the one who said, “I am a worm, and no man” ([[Ps. 22:6]]). The Lord who holds Israel’s right hand (verse 13) is the One who descended below all things ([[D&C 122:8]]), and so His “Fear not” is not spoken from a distance.

liken: |
  - When I’m afraid, do I tend to build something I can control, or turn to the God who controls history?
  - Who in my life is saying “Be of good courage” about something empty? Am I one of those voices for someone else?
  - Have I ever felt like a “worm”? What does it mean that the Lord calls me His servant and His friend’s descendant in the same breath?
  - The Lord says He will hold my right hand (verse 13). What would it look like this week to let Him?
  - Where in my life is “dry ground” that I need to ask the Lord to make grow?

explore: |
  - **The trial speeches.** Read [[Isa. 41:1–7]], [[Isa. 41:21–29]], [[Isa. 43:8–13]], [[Isa. 44:6–8]], and [[Isa. 45:20–25]] in a row.
  - **“Fear not.”** Collect the “fear not” promises in [[Isa. 41:10–14]], [[Isa. 43:1–5]], [[Isa. 44:2–8]], and compare [[D&C 6:33–37]] and [[D&C 68:6]].
  - **Abraham, the friend of God.** Read [[2 Chr. 20:7]], [[James 2:21–23]], and [[Abr. 2:6–11]].
  - **The Redeemer.** Trace *gōʾēl* through [[Isa. 43:14]], [[Isa. 44:6]], [[Isa. 47:4]], [[Isa. 54:5]], and [[Isa. 59:20]], and compare the book of Ruth.
  - **Cyrus.** Read [[Ezra 1:1–4]] and a translation of the Cyrus Cylinder side by side.

parallels:
  - ref: Ps. 22:6
    note: “I am a worm, and no man,” in the psalm Jesus quoted from the cross.
  - ref: D&C 35:13
    note: The weak things of the world will thresh the nations by the Spirit.
  - ref: Rev. 1:17
    note: The risen Christ calls Himself the first and the last.

