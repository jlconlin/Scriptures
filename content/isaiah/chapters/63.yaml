chapter: 63
title: Mighty to Save
tagline: A warrior in red garments strides in from Edom, having trodden the winepress alone; then the people remember how the Lord carried them in the days of Moses, and cry out to Him as their Father.
when: 'Setting: the community in Judah, late sixth century BC; applied to the Second Coming in latter-day revelation, 1831'

setting: |
  Chapter 63 has two parts that could hardly be more different. Verses 1–6 are a short, fierce vision in the form of a dialogue. A sentry sees a figure approaching from Edom, the country south of the Dead Sea, and asks who he is and why his clothes are red. The figure is the Lord, returning from battle alone. The scene completes the picture from [[Isa. 59:16–18]], where the Lord put on His armor because no one else would help, and it balances 61:2, which promised “the day of vengeance of our God.”

  Verse 7 begins something new: a long communal lament that runs to the end of chapter 64. The people recall the Lord’s kindness in the Exodus, confess that they rebelled, and plead with Him to look down from heaven. Like the book of Lamentations, it is a prayer from a time when the sanctuary has been “trodden down” (verse 18).

  Latter-day revelation quotes both parts. In a revelation given in November 1831, the Lord describes His Second Coming in the words of verses 1–9, with changes ([[D&C 133:46–53]]). Two other revelations say of the Savior that He has “trodden the wine-press alone” ([[D&C 76:107]]; [[D&C 88:106]]).

thread: |
  Isaiah 63 is about **the Lord doing alone what no one else could, and a people learning to call Him Father**.

  The warrior from Edom has trodden the winepress “alone; and of the people there was none with me” (verse 3). He looked for help and found none, so His own arm brought salvation (verse 5). The vision is terrible, but its purpose is redemption: “the year of my redeemed is come” (verse 4).

  The lament that follows asks what that salvation means for a people who have failed. They remember that the Lord once shared their suffering, “In all their affliction he was afflicted,” and carried them like children (verse 9). They admit that they rebelled and grieved His Holy Spirit (verse 10). They ask where He has gone (verses 11–15). And then they make the claim that the whole prayer rests on: “Doubtless thou art our father… our redeemer” (verse 16). Their ancestors might not recognize them, but He will. The warrior who fought alone is the Father who carried them. The same arm does both.

sections:
  - range: 1-6
    heading: The warrior from Edom
    plain: |
      “Who is this coming from Edom, from Bozrah, with garments stained crimson? Who is this, splendid in his clothing, striding forward in his great strength?” “It is I, who speak in righteousness, mighty to save.” “Why are your clothes red, like those of someone treading grapes in the winepress?” “I have trodden the winepress alone; no one from the peoples was with Me. I trampled them in My anger and trod them down in My wrath. Their blood spattered My garments, and I stained all My clothing. For the day of vengeance was in My heart, and the year of My redeemed had come. I looked, but there was no one to help; I was appalled that no one gave support. So My own arm brought Me victory, and My wrath sustained Me. I trampled the peoples in My anger, made them drunk with My wrath, and poured their lifeblood on the ground.”
  - range: 7-14
    heading: Remembering the days of old
    plain: |
      I will tell of the Lord’s faithful love and His praiseworthy deeds, because of all the Lord has done for us, the great goodness He has shown to the house of Israel, according to His compassion and His many acts of faithful love. He said, “Surely they are My people, children who will not be false.” And so He became their Savior. In all their distress He was distressed, and the angel of His presence saved them. In His love and mercy He redeemed them; He lifted them up and carried them all the days of old. But they rebelled and grieved His Holy Spirit, so He turned and became their enemy and fought against them. Then His people remembered the days of old, the days of Moses: Where is He who brought them up out of the sea, with the shepherd of His flock? Where is He who put His Holy Spirit among them, who sent His glorious arm to be at Moses’ right hand, who divided the waters before them to win Himself everlasting renown, who led them through the depths? Like a horse in open country, they did not stumble. Like cattle going down into the valley, they were given rest by the Spirit of the Lord. That is how You led Your people, to make Yourself a glorious name.
  - range: 15-19
    heading: You are our Father
    plain: |
      Look down from heaven and see, from Your holy and glorious dwelling. Where are Your zeal and Your power? Your deep tenderness and compassion are withheld from me. But You are our Father. Abraham does not know us and Israel does not recognize us, but You, Lord, are our Father; our Redeemer from of old is Your name. Why, Lord, do You let us stray from Your ways and harden our hearts so that we do not fear You? Return, for the sake of Your servants, the tribes that are Your inheritance. For a little while Your holy people possessed Your sanctuary, but now our enemies have trampled it down. We have become like those You never ruled, like those who were never called by Your name.

notes:
  - ref: 1
    phrase: Who is this that cometh from Edom, with dyed garments from Bozrah?
    kind: symbol
    title: From Edom
    body: |
      Edom was Judah’s neighbor and relative. Its people descended from Esau, Jacob’s twin, and its name means “red,” after the red stew for which Esau sold his birthright ([[Gen. 25:30]]). Bozrah was one of its cities ([[Amos 1:12]]). When Babylon destroyed Jerusalem, Edom sided with the Chaldeans and rejoiced at Judah’s fall, and its betrayal became proverbial ([[Obad. 1:10–14]]; [[Ps. 137:7]]). In the prophets, Edom came to stand for every enemy of God’s people. Isaiah had already described the Lord’s sword coming down “upon Idumea” with “a great slaughter in the land of Idumea” and “a sacrifice in Bozrah” ([[Isa. 34:5–6]]).

      The verse is full of wordplay. The warrior comes from *ʾĕdôm* (Edom) in garments that are *ʾādōm* (red, verse 2). He comes from *boṣrâ* (Bozrah), a name built on the same letters as *bāṣar*, “to gather grapes”; Bozrah becomes a vintage.

      Latter-day revelation widens the symbol. The Lord “shall come down in judgment upon Idumea, or the world” ([[D&C 1:36]]). And when the Lord quoted this verse in 1831, He changed the place: “Who is this that cometh down from God in heaven with dyed garments; yea, from the regions which are not known” ([[D&C 133:46]]). Edom is no longer a country on the map. The warrior comes from heaven, and His battle is with the whole world’s wickedness.
    sources: [mt-sefaria, delitzsch, bd-edom, bd-idumea, dc-133-heading]
  - ref: 1
    phrase: I that speak in righteousness, mighty to save
    kind: christ
    title: Mighty to save
    body: |
      The sentry asks who the figure is, and the answer is not a name but a description: “I that speak in righteousness, mighty to save.” The first part recalls the Lord’s claim to Cyrus’s generation: “I the LORD speak righteousness” ([[Isa. 45:19]]). The second, *rab ləhôšîaʿ*, “great to save,” uses the root of salvation (*yšʿ*) found in the name Jesus.

      The phrase entered the vocabulary of the Book of Mormon. Nephi urged his people to press forward “relying wholly upon the merits of him who is mighty to save” ([[2 Ne. 31:19]]). And the revelation that quotes this chapter keeps the answer exactly: “I am he who spake in righteousness, mighty to save” ([[D&C 133:47]]).

      The figure in red is terrifying to his enemies, but his self-description is about rescue. Even here, in the most violent passage of these chapters, the Lord defines Himself by His power to save.
    sources: [mt-sefaria]
  - ref: 3
    phrase: I have trodden the winepress alone; and of the people there was none with me
    kind: christ
    title: The winepress alone
    body: |
      Grapes were pressed by treading them with bare feet in a stone vat, and the juice splashed the treaders’ clothes red. Joel used the same picture of judgment: “the press is full, the fats overflow; for their wickedness is great” ([[Joel 3:13]]). In Isaiah the red on the warrior’s garments is the blood of his enemies. The judgment is the Lord’s alone, because no one else was willing or able to act: “I looked, and there was none to help” (verse 5; compare [[Isa. 59:16]]).

      The New Testament applies the scene to Christ at His Second Coming. John sees Him on a white horse, “clothed with a vesture dipped in blood,” and “he treadeth the winepress of the fierceness and wrath of Almighty God” ([[Rev. 19:13–15]]). Latter-day revelation uses the same words, and adds something. At the end, the Son will present the kingdom to the Father, “saying: I have overcome and have trodden the wine-press alone, even the wine-press of the fierceness of the wrath of Almighty God” ([[D&C 76:107]]; compare [[D&C 88:106]]). The treading is not only a battle at the end of time. It is how He “overcame.”

      Latter-day Saints have often heard in this verse the solitude of Gethsemane, where He bled “at every pore” ([[D&C 19:18]]) and His disciples slept, and of the cross. Elder Jeffrey R. Holland used verses 3 and 5 that way, describing “the loneliest journey ever made” and adding that because He walked it alone, we do not have to. That is a reading beyond Isaiah’s immediate meaning, where the blood is the enemies’, but it rests on a real connection: the wrath He trod out at the end is the wrath He first bore Himself.
    sources: [delitzsch, holland-none-with-him]
  - ref: 9
    phrase: In all their affliction he was afflicted
    kind: words
    title: Afflicted with them, or not?
    body: |
      This is one of the tenderest lines in the Old Testament, and it rests on a textual puzzle. The Hebrew scribes preserved two readings here. The written text, called the *ketiv*, has *lōʾ ṣār*, “he was *not* afflicted.” But a marginal note tells the reader to read aloud, as the *qere* (“what is read”), *lô ṣār*: “to him there was affliction,” that is, “he was afflicted.” The two words sound exactly alike in Hebrew and differ by one letter. The Masoretes recorded many such pairs where tradition read the text differently from the way it was spelled.

      The King James Version follows the *qere*, and so does the Lord’s own quotation of the verse in latter-day revelation: “In all their afflictions he was afflicted” ([[D&C 133:53]]). The Greek Septuagint read the consonants yet another way and divided the line differently, with the result “not an elder or a messenger, but he himself saved them.” That reading, too, insists on the Lord’s personal involvement.

      The idea of a God who suffers with His people is not unique to this verse. Alma taught that Christ would “take upon him their infirmities, that his bowels may be filled with mercy, according to the flesh” ([[Alma 7:12]]). Isaiah’s line looks back to the Exodus, when the Lord “heard their cry” and knew “their sorrows” ([[Ex. 3:7]]). It also looks forward to one who “hath borne our griefs, and carried our sorrows” ([[Isa. 53:4]]).
    sources: [mt-sefaria, lxx-rahlfs]
  - ref: 9
    phrase: the angel of his presence saved them
    kind: christ
    title: The angel of His presence
    body: |
      In the Exodus the Lord promised Moses, “Behold, I send an Angel before thee, to keep thee in the way” ([[Ex. 23:20]]). After Israel sinned with the golden calf, Moses pleaded for more than an angel, and the Lord answered, “My presence shall go with thee, and I will give thee rest” ([[Ex. 33:14]]). “Presence” is *pānîm*, literally “face.” The “angel of his presence” (*malʾak pānāyw*) is the messenger who carries God’s own face, not a lesser substitute.

      The next words describe how He saved them: “he bare them, and carried them all the days of old.” Isaiah used the same picture earlier to contrast the Lord with idols. The Babylonians had to carry their gods on animals; the Lord says to Israel, “ye… are carried from the womb… even to hoar hairs will I carry you” ([[Isa. 46:3–4]]). God is the one who carries, not the one who is carried.

      Latter-day Saints understand the God who led Israel out of Egypt to be Jehovah, the premortal Christ ([[1 Cor. 10:1–4]]; [[3 Ne. 15:5]]). Read that way, the one who carried Israel through the wilderness and the one who would carry their griefs in Gethsemane are the same.
    sources: [mt-sefaria, bd-jehovah]
  - ref: 10
    phrase: But they rebelled, and vexed his holy Spirit
    kind: words
    title: Grieving the Holy Spirit
    body: |
      The phrase “holy Spirit” is very rare in the Old Testament. It appears only here, in verse 11, and in David’s prayer, “take not thy holy spirit from me” ([[Ps. 51:11]]). Here the Spirit is not only a power but someone who can be hurt. “Vexed” is *ʿiṣṣəbû*, “grieved, pained,” the word used when Jacob’s sons heard what had been done to their sister Dinah and “were grieved” ([[Gen. 34:7]]).

      Paul’s wording echoes this verse, and it follows the Hebrew verb “grieved” rather than the Septuagint, which says the people “provoked” the Spirit: “grieve not the holy Spirit of God, whereby ye are sealed unto the day of redemption” ([[Eph. 4:30]]). The Book of Mormon uses similar language for the way sin drives the Spirit away: the Spirit “hath no place in you” ([[Alma 34:35]]), and in the Nephites’ last days it “hath ceased striving with them” ([[Moro. 9:4]]).

      The sequence of verses 9–10 is hard to read. The God who was afflicted in their affliction “was turned to be their enemy.” The same verb, “turned,” appears in the next verse when the people turn back to remember Him. Grief can move in both directions.
    sources: [mt-sefaria, bdb, lxx-rahlfs]
  - ref: 14
    phrase: the Spirit of the LORD caused him to rest
    kind: scripture
    title: Brought to rest
    body: |
      Verses 11–14 remember the Exodus as a gentle journey. The Lord led His people “through the deep, as an horse in the wilderness, that they should not stumble” (a horse on open ground, sure-footed) and “as a beast goeth down into the valley” (cattle led down to good pasture). At the end the Spirit gave them rest.

      “Rest” is the promise the Lord made to Moses ([[Ex. 33:14]]), and it became a large idea in scripture. The generation of the wilderness did not receive it: “Unto whom I sware in my wrath that they should not enter into my rest” ([[Ps. 95:11]]). The letter to the Hebrews argues that “there remaineth therefore a rest to the people of God” ([[Heb. 4:9]]).

      Latter-day revelation defines the rest. Moses “sought diligently to sanctify his people that they might behold the face of God,” but “they hardened their hearts and could not endure his presence,” and the Lord swore they would not enter His rest, “which rest is the fulness of his glory” ([[D&C 84:23–24]]). That explains verses 10–14 well: the rest the Spirit gave in the days of Moses was a foretaste, and the people’s rebellion kept them from the fullness of it. The lament that follows is a plea to be brought back.
  - ref: 16
    phrase: 'Doubtless thou art our father, though Abraham be ignorant of us'
    kind: scripture
    title: You are our Father
    body: |
      It is rare in the Old Testament for the people to address God as “Father.” Moses asked Israel, “is not he thy father that hath bought thee?” ([[Deut. 32:6]]), and Jeremiah and Malachi use the image ([[Jer. 3:19]]; [[Mal. 2:10]]). But a direct prayer, “thou art our father,” is rare; this lament says it twice here and again in [[Isa. 64:8]].

      The setting gives it force. The people feel so far from their heritage that Abraham and Israel would not recognize them as descendants. Their lineage is broken. So they appeal past their ancestors to God: “thou, O LORD, art our father, our redeemer.” A father does not disown his children because they have changed.

      The title is joined to “redeemer,” the one who buys back a family member. For Latter-day Saints the combination is significant. The Book of Mormon teaches that Christ is the Father of those who are born again through Him: “this day he hath spiritually begotten you… therefore, ye are born of him and have become his sons and his daughters” ([[Mosiah 5:7]]). The Lord told the brother of Jared, “I am Jesus Christ. I am the Father and the Son” ([[Ether 3:14]]; compare [[Mosiah 15:1–4]]). The Redeemer of Israel is also the Father of the redeemed.
    sources: [mt-sefaria, delitzsch, bd-jehovah]
  - ref: 17
    phrase: O LORD, why hast thou made us to err from thy ways, and hardened our heart from thy fear?
    kind: words
    title: Why hast thou hardened our heart?
    body: |
      This is a startling question: the people seem to blame God for their own sin. One older commentary reads it as the judgment that falls on people who have long scorned God’s grace: He lets them go the way they chose. The same tension runs through the Exodus story, which says both that the Lord hardened Pharaoh’s heart and that Pharaoh hardened his own ([[Ex. 4:21]]; [[Ex. 8:15]]). Joseph Smith’s inspired translation resolves it in Pharaoh’s case: at Exodus 4:21 it reads, “Pharaoh will harden his heart.” That fits the Restoration’s strong teaching on agency ([[2 Ne. 2:27]]).

      Whatever the grammar, the prayer is honest. It is what people say when they have gone so far wrong that they cannot see how it happened. The prayer does not stay there. It turns to a plea, “Return for thy servants’ sake,” and ends with a painful admission. In verse 19 the King James “thine” is in italics, supplied by the translators; the Hebrew says, “We have become like those whom you never ruled, who were never called by your name.” The people feel like strangers to the covenant. The lament continues into chapter 64 with a cry for God to tear open the heavens and come down.
    sources: [mt-sefaria, delitzsch, jst-ex-4-footnote, kjv-blb]

christ: |
  The warrior from Edom is the Lord who comes alone, “mighty to save,” and latter-day revelation identifies Him with Christ at His Second Coming ([[D&C 133:46–53]]). He trod the winepress “of the fierceness of the wrath of Almighty God” ([[D&C 76:107]]), a wrath He first bore Himself in Gethsemane. He is also the one who was “afflicted” in all His people’s afflictions, the angel of the Father’s presence who carried Israel through the wilderness, and the Redeemer whom the people call “our father” ([[Mosiah 5:7]]). No one else could do what He did, and He did it so that none of us would have to walk alone.

liken: |
  - Where in my life have I looked around and found no one to help? Do I believe the Lord has walked that path already?
  - Can I trust a God who is both the warrior from Edom and the one who carries me?
  - Have I grieved the Holy Spirit by what I have done or neglected? What would help me turn back?
  - When I pray, do I call on the Lord as a Father who still knows me, even when I feel far from my heritage?

explore: |
  - **The warrior in red.** Compare [[Isa. 63:1–6]], [[Rev. 19:11–16]], and [[D&C 133:46–53]].
  - **Alone.** Read [[Isa. 59:16]], [[Isa. 63:3–5]], [[Matt. 26:36–46]], and [[D&C 19:16–19]]. Elder Jeffrey R. Holland’s “None Were with Him” (April 2009) develops the theme.
  - **The Holy Spirit grieved.** Read [[Isa. 63:10]] with [[Eph. 4:30]] and [[Alma 34:35]].
  - **God as Father.** Read [[Deut. 32:6]], [[Isa. 63:16]], [[Isa. 64:8]], and [[Mosiah 5:7–8]].

