chapter: 6
title: '“Here Am I; Send Me”'
tagline: In the year an earthly king died, Isaiah saw the true King. He was undone, cleansed with a coal from the altar, and sent.
when: 'c. 740 BC, the year King Uzziah died (the date is approximate; the chronology of Uzziah’s reign is uncertain)'

setting: |
  This is Isaiah’s call, placed not at the beginning of the book but after five chapters of judgment. By the time we reach it, we know how unclean the people are. Now we learn that the prophet sent to them had to be made clean first.

  The date is significant: “the year that king Uzziah died,” about 740 BC. Uzziah had reigned for more than fifty years and brought Judah prosperity. But late in life he grew proud, entered the temple to burn incense (a privilege reserved for priests), and was struck with leprosy on the spot. He lived out his days in a separate house and died a leper ([[2 Chr. 26:16–21]]). So in the year a proud king who had intruded into the temple died, Isaiah is shown the **true King**, sitting on His throne in that same temple.

  Nephi quoted the chapter as [[2 Ne. 16]]. The Apostle John tells us whom Isaiah saw: “These things said Esaias, when he saw his glory, and spake of him” ([[John 12:41]]). In context, “him” is Jesus.

thread: |
  Isaiah 6 moves in four steps.

  **Vision (verses 1–4).** Isaiah sees the Lord enthroned, with blazing seraphim crying “Holy, holy, holy.” The temple shakes and fills with smoke. The first thing Isaiah learns is not a message but a Person: God’s holiness.

  **Confession (verse 5).** Seeing God’s holiness, Isaiah sees himself clearly: “Woe is me! for I am undone.” Remember that chapters 1–5 were full of “woes” against the people. Now the prophet pronounces a woe on himself. Before he can say *woe unto them*, he has to say *woe is me*.

  **Cleansing (verses 6–7).** A seraph takes a burning coal from the altar, the place of sacrifice, and touches Isaiah’s lips: “thine iniquity is taken away, and thy sin purged.” The Hebrew verb for “purged” is *kipper*, the word for **atonement**. Isaiah is cleansed by something that comes from the altar.

  **Commission (verses 8–13).** Only then does the Lord ask, “Whom shall I send?” and Isaiah, freshly forgiven, volunteers. The message he receives is sobering. His preaching will mostly harden people, until the land is ruined and only a stump remains. But even the stump holds a “holy seed.”

  The order matters: vision, confession, cleansing, commission. In this chapter Isaiah is sent only after he has been cleansed, and he is cleansed only after he sees his need, which happens when he sees Him.

sections:
  - range: 1-4
    heading: The King on His throne
    plain: |
      In the year King Uzziah died, I saw the Lord sitting on a high and exalted throne, and the hem of His robe filled the temple. Fiery seraphim stood above Him, each with six wings: two to cover the face, two to cover the feet, and two to fly. They called to one another: “Holy, holy, holy is the Lord of hosts; the whole earth is full of His glory!” Their voices shook the doorposts, and the temple filled with smoke.
  - range: 5-7
    heading: Undone and made clean
    plain: |
      I cried out, “I’m doomed! My lips are unclean, and I live among people with unclean lips, and I have seen the King, the Lord of hosts, with my own eyes!” Then one of the seraphim flew to me holding a burning coal that he had taken from the altar with tongs. He touched my mouth with it and said, “This has touched your lips. Your guilt is gone and your sin is atoned for.”
  - range: 8-13
    heading: The commission
    plain: |
      Then I heard the Lord ask, “Whom shall I send? Who will go for us?” I said, “Here I am. Send me!” He said, “Go and tell these people: ‘Keep listening, but you won’t understand; keep looking, but you won’t perceive.’ Your message will make their hearts dull, their ears deaf, and their eyes blind, so that they won’t turn and be healed.” I asked, “Lord, how long?” He answered, “Until the cities are ruined and empty, the land is desolate, and the people have been carried far away. Even if a tenth remain, it will be burned again. But like an oak or terebinth that leaves a stump when it is cut down, the holy seed will be the stump.”

notes:
  - ref: 1
    phrase: In the year that king Uzziah died
    kind: history
    title: The death of a proud king
    body: |
      Uzziah (also called Azariah) was one of Judah’s most successful kings. He reigned fifty-two years and built up the army and Jerusalem’s defenses ([[2 Chr. 26:1–15]]). “But when he was strong, his heart was lifted up to his destruction.” He entered the temple to burn incense, which only priests were allowed to do. When the priests confronted him, leprosy broke out on his forehead. He was “cut off from the house of the LORD” for the rest of his life ([[2 Chr. 26:16–21]]).

      Isaiah’s vision dates to the year of Uzziah’s death, about 740 BC by the Church’s chronology, though the dates of Uzziah’s reign are uncertain. The contrast is striking, and the text invites it. An earthly king, “lifted up” with pride, was banished from the temple. Now Isaiah sees the true King, “high and lifted up” in holiness, sitting enthroned in that same temple.
    sources: [bd-uzziah, bible-chron-ot, lds-scriptures]
  - ref: 1
    phrase: I saw also the Lord sitting upon a throne
    kind: christ
    title: Isaiah saw Jesus Christ
    body: |
      Who did Isaiah see? The Apostle John answers directly. After quoting verse 10 of this chapter, John writes: “These things said Esaias, when he saw **his** glory, and spake of **him**” ([[John 12:41]]). In context, John is speaking of Jesus.

      This fits the Restoration teaching that Jehovah, the God of the Old Testament, is the premortal Jesus Christ ([[3 Ne. 15:5]]; [[D&C 110:2–4]]). Nephi says Isaiah “verily saw my Redeemer, even as I have seen him” ([[2 Ne. 11:2]]); this chapter is the vision recorded in Isaiah’s book that fits that description. Isaiah, like Nephi and Jacob, was an eyewitness of the Lord.
    sources: [lds-scriptures, delitzsch]
  - ref: 1
    phrase: high and lifted up
    kind: words
    title: A phrase Isaiah saves for God and His Servant
    body: |
      “High and lifted up” (*ram venissaʾ*) is a pair of words Isaiah uses of both the proud and the Lord. In chapter 2 he condemned everything proud that was “high and lifted up” ([[Isa. 2:12–14]]). Here the same two roots belong to the Lord. They describe the Lord again ([[Isa. 57:15]]), and then the suffering Servant, who “shall be exalted and extolled, and be very high” ([[Isa. 52:13]]).

      Applied to the Servant, the phrase is fulfilled in a way no one expected. Jesus said, “I, if I be lifted up from the earth, will draw all men unto me” ([[John 12:32]]; see [[3 Ne. 27:14]]). He was lifted up on a cross.
    sources: [biblehub-interlinear, lds-scriptures]
  - ref: 2
    phrase: the seraphims
    kind: words
    title: The burning ones
    body: |
      *Seraphim* is already a Hebrew plural (the KJV adds an unnecessary English *-s*), and it probably means “burning ones,” from the verb *saraph*, “to burn.” They are “angelic beings… attendants in Jehovah’s court, the ministers of the heavenly sanctuary.” Isaiah’s vision is the only place in the Bible where heavenly beings are called seraphim. The singular *saraph* names the “fiery serpents” in the wilderness ([[Num. 21:6–8]]), and the Hebrew lexicon treats the two uses as probably related.

      Their six wings are eloquent. Two cover their faces, which is usually read as awe before the divine glory. Two cover their feet, which is usually read as the creature’s sense of how far it stands below the Holiest. Only two are used for flying. Most of their being is devoted to reverence.

      The link to the wilderness goes further than a shared root. The brass serpent Moses set on a pole is itself called a *saraph* (“Make thee a fiery serpent,” [[Num. 21:8]]), and Jesus made that serpent a type of Himself ([[John 3:14–15]]; compare [[Hel. 8:14–15]]). Here a seraph brings the cleansing coal (verses 6–7); there a serpent lifted up brought healing to all who looked. Joseph Smith, dedicating the Kirtland Temple, prayed that the Saints might “mingle our voices with those bright, shining seraphs around thy throne” ([[D&C 109:79]]).
    sources: [bd-seraphim, bdb, delitzsch, biblehub-interlinear, sc-knowhy-645, lds-scriptures]
  - ref: 3
    phrase: Holy, holy, holy, is the LORD of hosts
    kind: words
    title: Holy, holy, holy
    body: |
      Repetition is how Hebrew intensifies, and three times is the fullest emphasis. John heard the same cry in heaven ([[Rev. 4:8]]).

      “Holy” (*qadosh*) means the separate One, beyond the world, spotless and perfect. It lies behind Isaiah’s favorite title for God, “the Holy One of Israel,” which is probably an echo of this moment: the title is stamped on both halves of the book.

      Notice the second line: “the whole earth is full of his glory.” God’s holiness is not remote. It fills the world.
    sources: [delitzsch, lds-scriptures]
  - ref: 4
    phrase: the posts of the door moved at the voice of him that cried, and the house was filled with smoke
    kind: history
    title: 'Where Isaiah stood: the temple'
    body: |
      The vision is set inside a temple, and it may have taken place in the Holy of Holies itself; the verses imply a building but do not name the room. The doorposts and “the house” ([[Isa. 6:4]]) show that Isaiah was within a structure. The door whose posts shook “seems to refer specifically to the doorway of the Holy of Holies,” and the altar of verse 6 is “more likely” the incense altar than an altar of sacrifice. These are inferences from the words, offered as likely, not something the text states.

      Two other details have been read the same way, more tentatively. “It has been suggested that the train of the robe represents the veil of the temple,” and the smoke, which in such visions “surrounds the heavenly messenger (often the Lord himself),” is read as what makes it possible for a mortal eye to endure the glory. The verses do not say whether what Isaiah saw was the earthly temple or its heavenly counterpart.
    sources: [isaiah-in-bom]
  - ref: 5
    phrase: Woe is me! for I am undone
    kind: words
    title: '“I am undone”'
    body: |
      The Hebrew verb (*nidmeti*) means “I am cut off,” “I am destroyed,” “I am ruined.” The lexicon glosses this very verse as the prophet “ruined, undone” at the sight of Jehovah.

      Others who have seen the Lord respond in kind. Moses, after seeing God, said, “Now, for this cause I know that man is nothing” ([[Moses 1:10]]). Peter fell at Jesus’s knees: “Depart from me; for I am a sinful man, O Lord” ([[Luke 5:8]]). Nephi cried, “O wretched man that I am!” ([[2 Ne. 4:17]]). Seeing God clearly means seeing ourselves clearly.

      Notice, too, that after five chapters of pronouncing woes on others ([[Isa. 5:8–22]]), Isaiah now pronounces one on himself.
    sources: [bdb, lds-scriptures]
  - ref: 5
    phrase: I am a man of unclean lips
    kind: history
    title: Why lips?
    body: |
      Of all the sins Isaiah might have confessed, he names his *lips*. That fits a prophet, whose whole calling is to speak for God, but it also fits the moment. Isaiah has just heard the seraphim use their lips to praise God perfectly, and he knows his own mouth is not fit to join them.

      And he doesn’t separate himself from his people: “I dwell in the midst of a people of unclean lips.” He doesn’t say *they are unclean and I am not*. He says *we are*.
    sources: [delitzsch]
  - ref: 6
    phrase: a live coal in his hand, which he had taken with the tongs from off the altar
    kind: christ
    title: A coal from the altar
    body: |
      The coal comes from the **altar**, the place where sacrifices were offered and where the fire was never allowed to go out ([[Lev. 6:12–13]]). The altar may be the altar of incense, the heavenly counterpart of the one in the earthly temple; on the Day of Atonement the high priest took coals “from off the altar before the Lord” into the Most Holy Place ([[Lev. 16:12–13]]). Either way, Isaiah is cleansed by fire that comes from the place of sacrifice.

      Latter-day Saints can read in this an image of the Atonement of Jesus Christ. Our cleansing does not come from our own effort. It is brought to us, as the seraph brings the coal, from the place where the Lamb was sacrificed. The seraph uses tongs, because even a seraph’s hand cannot touch what belongs to God’s altar, yet the coal is laid directly on Isaiah’s lips. The fire burns away uncleanness without destroying the man.
    sources: [delitzsch, lds-scriptures]
  - ref: 7
    phrase: thine iniquity is taken away, and thy sin purged
    kind: words
    title: '“Purged” means atoned'
    body: |
      The Hebrew verb translated “purged” is *tekuppar*, from *kipper*, the word for making **atonement**; the same verb appears when the high priest “shall make an atonement” for the people ([[Lev. 16:30]]). So the seraph literally says: “your iniquity is taken away, and your sin is atoned for.”

      This may be the clearest picture in Isaiah of forgiveness: guilt removed in an instant by something applied from the altar. Isaiah did not earn it. He had confessed, and the coal was brought to him.
    sources: [bdb, biblehub-interlinear]
  - ref: 8
    phrase: Also I heard the voice of the Lord
    kind: structure
    title: Isaiah 6 as a prophetic call
    body: |
      Isaiah 6 is the book’s account of the prophet’s commissioning, and it follows a pattern shared with other prophetic calls, Lehi’s among them. Nine elements have been counted in such accounts:

      1. a historical introduction
      2. the divine confrontation
      3. the prophet’s reaction
      4. the throne vision
      5. a heavenly book
      6. a heavenly song of praise
      7. the commission
      8. an objection from the prophet
      9. a reassurance

      Isaiah’s chapter has seven of them:

      1. The historical introduction: the date, “the year that king Uzziah died.”
      2. The divine confrontation: the meeting with the Lord.
      3. The throne vision, in which that meeting takes place.
      4. The prophet’s reaction: “Woe is me.”
      5. The commission.
      6. The objection, here a question: “Lord, how long?”
      7. The reassurance: the hope held out in the holy seed of verse 13.

      Two are missing. The chapter mentions no heavenly book (Isaiah takes up writing later, in [[Isa. 8:1]] and [[Isa. 30:8]]), and although the seraphim praise the Lord, there is “no record of” the song of praise the pattern looks for. Lehi’s call has both ([[1 Ne. 1:11–14]]). The pattern comes from comparing call accounts; it is a scholar’s description, and the chapter does not name it.

      Why does the call come in chapter 6 and not at the start of the book? The text does not say. Chapter 1 is “a prologue or preface to the rest of the book,” “likely written later than many of Isaiah’s other revelations,” so the book does not simply run in the order in which the revelations came. One reading takes chapter 6 as Isaiah’s first call all the same: the title Holy One of Israel, an echo of the seraphim’s cry, is already frequent in the chapters before this one, which “supports the view that Isaiah is here describing his own first call.” That is a reading of how the book is arranged, not a statement the text makes.
    sources: [isaiah-in-bom, scripture-helps-isa-1-12, delitzsch, lds-scriptures]
  - ref: 8
    phrase: Whom shall I send, and who will go for us?
    kind: scripture
    title: The council in heaven
    body: |
      Notice the shift from “I” to “us.” The “us” is read as the Lord together with the seraphim forming a heavenly council, as in [[1 Kgs. 22:19–22]] (compare [[Gen. 1:26]], “let us make man”).

      Latter-day scripture opens this scene wider. In the premortal council, the Lord asked the same question, and the answer came from “one… like unto the Son of Man: Here am I, send me” ([[Abr. 3:27]]). Isaiah’s reply is word for word what the premortal Christ said when He volunteered to be our Redeemer.

      There’s a sobering detail, though. According to [[Abr. 3:27]] and [[Moses 4:1]], Lucifer used the very same words: “Behold, here am I, send me.” The difference was not the words but the motive. Lucifer added, “give me thine honor.” The Beloved Son said, “Father, thy will be done, and the glory be thine forever” ([[Moses 4:2]]). Isaiah, freshly cleansed and conscious of his unworthiness, answers in the spirit of the Son.
    sources: [delitzsch, lds-scriptures]
  - ref: 8
    phrase: Here am I; send me
    kind: words
    title: '“Here am I”'
    body: |
      “Here am I” (*hinneni*) is the answer of availability in the Old Testament. Abraham said it when God called him to sacrifice Isaac ([[Gen. 22:1]]); Moses at the burning bush ([[Ex. 3:4]]); young Samuel in the night ([[1 Sam. 3:4–10]]).

      Notice that Isaiah volunteers *before* he knows the assignment, and the assignment turns out to be discouraging (verses 9–13). The offer comes immediately after his cleansing, which suggests that his willingness grew from being freed of the sense of his own sinfulness, not from any enthusiasm about the job.
    sources: [oshb-wlc, biblehub-interlinear, delitzsch, lds-scriptures]
  - ref: 9
    phrase: Hear ye indeed, but understand not; and see ye indeed, but perceive not
    kind: bom
    title: A hard commission, clarified
    body: |
      This is one of the most puzzling commissions in scripture. Is God really sending a prophet to keep people from understanding? The Hebrew imperatives are not simply instructions to announce what God has decided; one reading takes them as the prophet’s word carrying out what it announces, and “understand not” and “perceive not” show the result his preaching will have. *The more you speak, the more they will harden.* God knows in advance how Judah will respond.

      Nephi’s version makes the point clearer: “Go and tell this people—Hear ye indeed, but **they understood not**; and see ye indeed, but **they perceived not**” ([[2 Ne. 16:9]]). The Book of Mormon text describes the people’s condition instead of commanding it.

      Jesus quoted these verses to explain why many did not grasp His parables ([[Matt. 13:13–15]]), and Paul quoted them at the end of Acts ([[Acts 28:25–28]]). Truth received with a hardened heart hardens it further. Truth received with a soft heart heals it.

      A further reading rests on grammar. The verbs of verse 10 are in the Hebrew *hiphil* stem, which is usually causative (“make fat”) but can be declarative (“declare the heart of this people to be fat”). Read that way, Isaiah is “God’s appointed accuser of the people”: he pronounces the people hardened, where the reading above has his preaching do the hardening. It has been called “the best solution” to the difficulty. It is a proposal, and it is not how the KJV translates the verse.

      The texts themselves add two things. Nephi’s change is limited to verse 9: [[2 Ne. 16:10]] still reads “Make the heart of this people fat, and make their ears heavy, and shut their eyes,” so the Book of Mormon’s change touches the first half of the commission and leaves the second as it stands. And in Matthew’s version the action passes to the people: “their eyes they have closed” ([[Matt. 13:15]]).
    sources: [delitzsch, lds-scriptures, hoskisson-isaiah-6]
  - ref: 10
    phrase: Make the heart of this people fat
    kind: words
    title: Heart, ears, eyes (and back again)
    body: |
      A “fat” heart in Hebrew is dull and unreceptive; the same verb describes prosperous, arrogant Israel in [[Deut. 32:15]] (compare [[Ps. 119:70]]). In the Hebrew, verse 10 is arranged as a **chiasmus**, a mirror-image structure:

      > heart — ears — eyes
      > eyes — ears — heart

      The structure acts out the message. The heart is sealed in on both ends, with no way in. The last words hold out what might have been: “and convert, and be healed.” Healing was possible all along. It required turning.
    sources: [bdb, oshb-wlc, lds-scriptures]
  - ref: 11
    phrase: Lord, how long?
    kind: scripture
    title: '“How long?”'
    body: |
      It is the question of every faithful person facing a long trial, and the Psalms ask it again and again ([[Ps. 13:1–2]]; [[Ps. 90:13]]). Joseph Smith asked it in Liberty Jail: “How long shall thy hand be stayed?” ([[D&C 121:2–3]]).

      The Lord’s answer to Isaiah was not comforting in the short term: until the land is desolate. He was being called to faithful testimony with few visible results. The question itself comes from his sympathy for the people he belongs to.
    sources: [delitzsch, lds-scriptures]
  - ref: 13
    phrase: so the holy seed shall be the substance thereof
    kind: symbol
    title: Life in the stump
    body: |
      The chapter ends with a sliver of hope. Israel will be cut down like a great terebinth (“teil tree”) or oak. But these trees can sprout again from the root after they are felled, and a **stump** remains. “Substance” here means *stump* (Hebrew *matstsebet*). That stump is “the holy seed,” the faithful remnant.

      Hold onto this image. In a few chapters Isaiah will announce that from “the stem” (the stock of a tree) of Jesse will come a rod and a Branch ([[Isa. 11:1]]). Read together, the stump of chapter 6 and the stem of chapter 11 are the same image. Job said it beautifully: “there is hope of a tree, if it be cut down, that it will sprout again” ([[Job 14:7]]).
    sources: [delitzsch, bdb, lds-scriptures]
  - ref: 13
    phrase: and it shall return
    kind: words
    title: A verse with a difficult text
    body: |
      Verse 13 is hard to translate, and the Book of Mormon preserves a different reading of one word.

      **“It shall return.”** The KJV’s “it” follows the Masoretic Hebrew text, the Septuagint and the Syriac; the Targum and [[2 Ne. 16:13]] read “they shall return.” The difference is one pronoun, and the Book of Mormon does not stand alone in it: an ancient version of Isaiah has the same reading.

      **“Eaten.”** The Hebrew is *lebaʿer*, from *baʿar*, and the Hebrew lexicon places this clause, with [[Isa. 5:5]], among the uses meaning “be for destruction, be destroyed.” So the tenth that returns “shall be eaten” in the sense that it too is given over to destruction.

      **“A tenth.”** The figure “need not be taken in a strictly literal sense”; it may stand for a small part of the people. That is a proposal, not something the verse says.
    sources: [bdb, hoskisson-isaiah-6, lds-scriptures]

christ: |
  Isaiah 6 is a vision of Jesus Christ in His premortal glory, as John testifies ([[John 12:41]]). The seraphim’s triple “holy” describes Him. The chapter also foreshadows His whole mission.

  The **coal from the altar** that atones for Isaiah’s sin points to the Lamb whose sacrifice cleanses every repentant sinner. Isaiah’s **“Here am I; send me”** echoes the premortal Son’s offer in the council in heaven ([[Abr. 3:27]]). The **people who hear but don’t understand** foreshadow the reception Jesus received ([[Matt. 13:13–15]]; [[John 12:37–41]]). And the **stump with a holy seed** anticipates the Branch from the stem of Jesse ([[Isa. 11:1]]).

  In this one chapter, Isaiah sees Christ enthroned, is cleansed by His atonement, and answers His call in His own words.

explore: |
  - **Call narratives.** Compare Isaiah’s call with Moses’s ([[Ex. 3–4]]), Jeremiah’s ([[Jer. 1:4–10]]), Ezekiel’s ([[Ezek. 1–3]]), Lehi’s ([[1 Ne. 1:6–15]]), and Joseph Smith’s ([[JS—H 1:14–20]]). What elements repeat?
  - **Throne visions.** Read [[1 Ne. 1:8]] and [[Alma 36:22]]. Lehi saw “God sitting upon his throne, surrounded with numberless concourses of angels.” Compare it with Isaiah’s.
  - **Isaiah 6 and the temple.** The vision takes place in the temple and moves from the throne, to the altar, to a commission.

