chapter: 6
title: '“Here Am I; Send Me”'
tagline: In the year an earthly king died, Isaiah saw the true King. He was undone, cleansed with a coal from the altar, and sent.
when: 'c. 740 BC, the year King Uzziah died'

setting: |
  This is Isaiah’s call, placed not at the beginning of the book but after five chapters of judgment. By the time we reach it, we know how unclean the people are. Now we learn that the prophet sent to them had to be made clean first.

  The date is significant: “the year that king Uzziah died,” about 740 BC. Uzziah had reigned for more than fifty years and brought Judah prosperity. But late in life he grew proud, entered the temple to burn incense (a privilege reserved for priests), and was struck with leprosy on the spot. He lived out his days quarantined and died a leper ([[2 Chr. 26:16–21]]). So in the year a proud king who had intruded into the temple died, Isaiah is shown the **true King**, sitting on His throne in that same temple.

  Nephi quoted the chapter as [[2 Ne. 16]]. The Apostle John tells us whom Isaiah saw: “These things said Esaias, when he saw his glory, and spake of him” ([[John 12:41]]). In context, “him” is Jesus.

thread: |
  Isaiah 6 follows a pattern that repeats in the calls of prophets throughout scripture, and in some form in every disciple’s life. It moves in four steps.

  **Vision (verses 1–4).** Isaiah sees the Lord enthroned, with blazing seraphim crying “Holy, holy, holy.” The temple shakes and fills with smoke. The first thing Isaiah learns is not a message but a Person: God’s holiness.

  **Confession (verse 5).** Seeing God’s holiness, Isaiah sees himself clearly: “Woe is me! for I am undone.” Remember that chapters 1–5 were full of “woes” against the people. Now the prophet pronounces a woe on himself. Before he can say *woe unto them*, he has to say *woe is me*.

  **Cleansing (verses 6–7).** A seraph takes a burning coal from the altar, the place of sacrifice, and touches Isaiah’s lips: “thine iniquity is taken away, and thy sin purged.” The Hebrew verb for “purged” is *kipper*, the word for **atonement**. Isaiah is cleansed by something that comes from the altar.

  **Commission (verses 8–13).** Only then does the Lord ask, “Whom shall I send?” and Isaiah, freshly forgiven, volunteers. The message he receives is sobering. His preaching will mostly harden people, until the land is ruined and only a stump remains. But even the stump holds a “holy seed.”

  The order matters: vision, confession, cleansing, commission. We can’t be sent until we’ve been cleansed, and we can’t be cleansed until we see our need, which happens when we see Him.

sections:
  - range: 1-4
    heading: The King on His throne
    plain: |
      In the year King Uzziah died, I saw the Lord sitting on a high and exalted throne, and the hem of His robe filled the temple. Fiery seraphim stood above Him, each with six wings: two to cover the face, two to cover the feet, and two to fly. They called to one another: “Holy, holy, holy is the Lord of hosts; the whole earth is full of His glory!” Their voices shook the doorposts, and the temple filled with smoke.
  - range: 5-7
    heading: Undone and made clean
    plain: |
      I cried out, “I’m doomed! My lips are unclean, and I live among people with unclean lips, and I have seen the King, the Lord of hosts, with my own eyes!” Then one of the seraphim flew to me holding a burning coal that he had taken from the altar with tongs. He touched my mouth with it and said, “This has touched your lips. Your guilt is gone and your sin is atoned for.”
  - range: 8-13
    heading: The commission
    plain: |
      Then I heard the Lord ask, “Whom shall I send? Who will go for us?” I said, “Here I am. Send me!” He said, “Go and tell these people: ‘Keep listening, but you won’t understand; keep looking, but you won’t perceive.’ Your message will make their hearts dull, their ears deaf, and their eyes blind, so that they won’t turn and be healed.” I asked, “Lord, how long?” He answered, “Until the cities are ruined and empty, the land is desolate, and the people have been carried far away. Even if a tenth remain, it will be burned again. But like an oak or terebinth that leaves a stump when it is cut down, the holy seed will be the stump.”

notes:
  - ref: 1
    phrase: In the year that king Uzziah died
    kind: history
    title: The death of a proud king
    body: |
      Uzziah (also called Azariah) was one of Judah’s most successful kings. He reigned about fifty-two years, built up the army, and expanded trade ([[2 Chr. 26:1–15]]). “But when he was strong, his heart was lifted up to his destruction.” He entered the temple to burn incense, which only priests were allowed to do. When the priests confronted him, leprosy broke out on his forehead. He was “cut off from the house of the LORD” for the rest of his life ([[2 Chr. 26:16–21]]).

      Isaiah’s vision dates to the year of Uzziah’s death, about 740 BC. The contrast is surely deliberate. An earthly king, “lifted up” with pride, was banished from the temple. Now Isaiah sees the true King, “high and lifted up” in holiness, sitting enthroned in that same temple.
    sources: [bd-uzziah]
  - ref: 1
    phrase: I saw also the LORD sitting upon a throne
    kind: christ
    title: Isaiah saw Jesus Christ
    body: |
      Who did Isaiah see? The Apostle John answers directly. After quoting verse 10 of this chapter, John writes: “These things said Esaias, when he saw **his** glory, and spake of **him**” ([[John 12:41]]). In context, John is speaking of Jesus.

      This fits the Restoration teaching that Jehovah, the God of the Old Testament, is the premortal Jesus Christ ([[3 Ne. 15:5]]; [[D&C 110:2–4]]). Nephi says Isaiah “verily saw my Redeemer, even as I have seen him” ([[2 Ne. 11:2]]), almost certainly referring to this vision. Isaiah, like Nephi and Jacob, was an eyewitness of the Lord.
  - ref: 1
    phrase: high and lifted up
    kind: words
    title: A phrase Isaiah saves for God and His Servant
    body: |
      “High and lifted up” (*ram venissaʾ*) is one of Isaiah’s signature phrases. In chapter 2 he condemned everything proud that was “high and lifted up” ([[Isa. 2:12–14]]). Here the phrase belongs to the Lord. Later it describes the Lord again ([[Isa. 57:15]]), and then the suffering Servant, who “shall be exalted and extolled, and be very high” ([[Isa. 52:13]]).

      The phrase, applied to the Servant, is fulfilled in a way no one expected. Jesus said, “I, if I be lifted up from the earth, will draw all men unto me” ([[John 12:32]]; see [[3 Ne. 27:14]]). He was lifted up on a cross.
  - ref: 1
    phrase: his train filled the temple
    kind: symbol
    title: The hem of His robe
    body: |
      A *train* is the long skirt or hem of a royal robe. In the ancient Near East, the length and fullness of a king’s robe displayed his majesty. Here the mere hem of the Lord’s robe fills the whole sanctuary. Isaiah doesn’t describe the Lord’s face at all. The edge of His clothing is overwhelming enough.

      There’s a tender contrast in the Gospels: a woman who had suffered for twelve years reached out to touch the hem of Jesus’s garment and was healed ([[Mark 5:25–34]]). The same Lord whose robe filled the temple let the sick reach for its fringe.
  - ref: 2
    phrase: the seraphims
    kind: words
    title: The burning ones
    body: |
      *Seraphim* (the KJV adds an unnecessary English plural *-s* to a word that is already plural in Hebrew) probably means “burning ones,” from the verb *saraph*, “to burn.” The Bible Dictionary describes them as “angelic beings… attendants in Jehovah’s court, the ministers of the heavenly sanctuary.” This is the only place in the Bible they are named. The same root is used for the “fiery serpents” in the wilderness ([[Num. 21:6–8]]).

      Their six wings are eloquent. Two cover their faces, because even these holy beings cannot gaze on God. Two cover their feet, a gesture of modesty and humility. Only two are used for flying. Most of their being is devoted to reverence.
    sources: [bd-seraphim]
  - ref: 3
    phrase: Holy, holy, holy, is the LORD of hosts
    kind: words
    title: Holy, holy, holy
    body: |
      Hebrew had no easy way to say “holiest,” so it expressed the superlative by repetition: “holy of holies” means the most holy place. Saying a word **three** times is the strongest emphasis possible. This is the only attribute of God repeated three times in the Bible. John heard the same cry in heaven ([[Rev. 4:8]]).

      “Holy” (*qadosh*) means set apart, utterly other, pure. It is the root of Isaiah’s favorite title for God, “the Holy One of Israel,” which may well have been born in this moment.

      Notice the second line: “the whole earth is full of his glory.” God’s holiness is not remote. It fills the world.
  - ref: 4
    phrase: the house was filled with smoke
    kind: symbol
    title: Smoke and shaking
    body: |
      Smoke and earthquake accompanied the Lord’s appearance at Sinai ([[Ex. 19:18]]). Cloud filled Solomon’s temple at its dedication so that the priests could not stand to minister ([[1 Kgs. 8:10–11]]). John saw the heavenly temple “filled with smoke from the glory of God” ([[Rev. 15:8]]).

      The smoke both reveals and conceals. It shows that God is present, and it veils His full glory, which no mortal could bear. Latter-day accounts of temple dedications, like Kirtland in 1836, also describe a sense of the house being filled with glory ([[D&C 109:37]]; [[D&C 110:1–10]]).
  - ref: 5
    phrase: Woe is me! for I am undone
    kind: words
    title: '“I am undone”'
    body: |
      The Hebrew verb (*nidmeti*) means “I am destroyed,” “I am cut off,” or even “I am silenced.” It is fitting language for a man whose calling is to speak and who now realizes his lips are unclean.

      This is the universal response of mortals in God’s presence. Moses, after seeing God, said, “Now, for this cause I know that man is nothing” ([[Moses 1:10]]). Peter fell at Jesus’s knees: “Depart from me; for I am a sinful man, O Lord” ([[Luke 5:8]]). Nephi cried, “O wretched man that I am!” ([[2 Ne. 4:17]]). Seeing God clearly means seeing ourselves clearly.

      Notice, too, that after five chapters of pronouncing woes on others ([[Isa. 5:8–22]]), Isaiah now pronounces one on himself.
  - ref: 5
    phrase: I am a man of unclean lips
    kind: liken
    title: Why lips?
    body: |
      Of all the sins Isaiah might have confessed, he names his *lips*. That fits a prophet, whose whole calling is to speak for God, but it also fits the moment. Isaiah has just heard the seraphim use their lips to praise God perfectly, and he knows his own mouth is not fit to join them.

      And he doesn’t separate himself from his people: “I dwell in the midst of a people of unclean lips.” He doesn’t say *they are unclean and I am not*. He says *we are*. Real repentance usually sounds like this: not comparing ourselves favorably to others, but recognizing that we share in the need.
  - ref: 6
    phrase: a live coal in his hand, which he had taken with the tongs from off the altar
    kind: christ
    title: A coal from the altar
    body: |
      The coal comes from the **altar**, the place where sacrifices were offered and where the fire was never allowed to go out ([[Lev. 6:12–13]]). It may have been the altar of incense, whose coals came from the altar of sacrifice ([[Lev. 16:12–13]]). Either way, Isaiah is cleansed by fire that comes from the place of sacrifice.

      Latter-day Saints can read in this an image of the Atonement of Jesus Christ. Our cleansing does not come from our own effort. It is brought to us, as the seraph brings the coal, from the place where the Lamb was sacrificed. It is also striking that the seraph uses tongs, because the coal was too holy and too hot even for him to touch, yet it is laid directly on Isaiah’s lips. The fire burns away uncleanness without destroying the man.
  - ref: 7
    phrase: thine iniquity is taken away, and thy sin purged
    kind: words
    title: '“Purged” means atoned'
    body: |
      The Hebrew verb translated “purged” is *tekuppar*, from *kipper*, the word for making **atonement** ([[Lev. 16:30]]). It is the root of *Yom Kippur*, the Day of Atonement. So the seraph literally says: “your iniquity is taken away, and your sin is atoned for.”

      This may be the clearest picture in Isaiah of what forgiveness feels like: guilt removed in an instant by something applied from the altar. Isaiah didn’t have to earn it or argue for it. He only had to confess it and receive the coal.
    sources: [bdb]
  - ref: 8
    phrase: Whom shall I send, and who will go for us?
    kind: restoration
    title: The council in heaven
    body: |
      Notice the shift from “I” to “us.” The Lord is consulting with a heavenly council, as in [[1 Kgs. 22:19–22]] and [[Gen. 1:26]] (“let us make man”).

      Latter-day scripture opens this scene wider. In the premortal council, the Lord asked the same question, and the answer came from “one… like unto the Son of Man: Here am I, send me” ([[Abr. 3:27]]). Isaiah’s reply is word for word what the premortal Christ said when He volunteered to be our Redeemer. When Isaiah says “Here am I; send me,” he is answering the way his Lord answered.
  - ref: 8
    phrase: Here am I; send me
    kind: liken
    title: '“Here am I”'
    body: |
      “Here am I” (*hinneni*) is the classic answer of availability in the Old Testament. Abraham said it when God called him to sacrifice Isaac ([[Gen. 22:1]]); Moses at the burning bush ([[Ex. 3:4]]); young Samuel in the night ([[1 Sam. 3:4–10]]).

      Notice that Isaiah volunteers *before* he knows the assignment, and the assignment turns out to be discouraging (verses 9–13). His willingness came from gratitude for being cleansed, not from enthusiasm about the job. The same pattern holds for missionaries, ministering brothers and sisters, and anyone who accepts a calling not knowing what it will require.
  - ref: 9
    phrase: Hear ye indeed, but understand not; and see ye indeed, but perceive not
    kind: restoration
    title: A hard commission, clarified
    body: |
      This is one of the most puzzling commissions in scripture. Is God really sending a prophet to keep people from understanding? The Hebrew imperatives are best read as bitter irony, or as a statement of result rather than purpose. *Your preaching will have this effect: the more you speak, the more they will harden.* God knows in advance how Judah will respond.

      Nephi’s version makes the point clearer: “Go and tell this people—Hear ye indeed, but **they understood not**; and see ye indeed, but **they perceived not**” ([[2 Ne. 16:9]]). The Book of Mormon text describes the people’s condition instead of commanding it.

      Jesus quoted these verses to explain why many did not grasp His parables ([[Matt. 13:13–15]]), and Paul quoted them at the end of Acts ([[Acts 28:25–28]]). Truth received with a hardened heart hardens it further. Truth received with a soft heart heals it.
  - ref: 10
    phrase: Make the heart of this people fat
    kind: words
    title: Heart, ears, eyes (and back again)
    body: |
      A “fat” heart in Hebrew idiom is dull and insensitive, insulated by complacency ([[Deut. 32:15]]; [[Ps. 119:70]]). Verse 10 is a beautiful example of **chiasmus**, a mirror-image structure:

      > heart — ears — eyes
      > eyes — ears — heart

      The structure acts out the message. The heart is sealed in on both ends, with no way in. The last words hold out what might have been: “and convert, and be healed.” Healing was possible all along. It required turning.
    sources: [alter-poetry]
  - ref: 11
    phrase: Lord, how long?
    kind: liken
    title: '“How long?”'
    body: |
      It is the question of every faithful person facing a long trial, and the Psalms ask it again and again ([[Ps. 13:1–2]]; [[Ps. 90:13]]). Joseph Smith asked it in Liberty Jail: “How long shall thy hand be stayed?” ([[D&C 121:2–3]]).

      The Lord’s answer to Isaiah was not comforting in the short term: until the land is desolate. He was being called to a lifetime of faithful testimony with few visible results. Some of our assignments are like that too. Isaiah did it anyway for forty years, and his words are still gathering Israel.
  - ref: 13
    phrase: so the holy seed shall be the substance thereof
    kind: symbol
    title: Life in the stump
    body: |
      The chapter ends with a sliver of hope. Israel will be cut down like a great terebinth (“teil tree”) or oak. But when those trees are felled, a living **stump** remains, and new shoots can sprout from it. “Substance” here means *stump*. That stump is “the holy seed,” the faithful remnant.

      Hold onto this image. In a few chapters Isaiah will announce that from “the stem” (stump) of Jesse will come a rod and a Branch ([[Isa. 11:1]]). The stump of chapter 6 is where the Messiah grows. Job said it beautifully: “there is hope of a tree, if it be cut down, that it will sprout again” ([[Job 14:7]]).

christ: |
  Isaiah 6 is a vision of Jesus Christ in His premortal glory, as John testifies ([[John 12:41]]). The seraphim’s triple “holy” describes Him. The chapter also foreshadows His whole mission.

  The **coal from the altar** that atones for Isaiah’s sin points to the Lamb whose sacrifice cleanses every repentant sinner. Isaiah’s **“Here am I; send me”** echoes the premortal Son’s offer in the council in heaven ([[Abr. 3:27]]). The **people who hear but don’t understand** foreshadow the reception Jesus received ([[Matt. 13:13–15]]; [[John 12:37–41]]). And the **stump with a holy seed** anticipates the Branch from the stem of Jesse ([[Isa. 11:1]]).

  In this one chapter, Isaiah sees Christ enthroned, is cleansed by His atonement, and answers His call in His own words.

liken: |
  - Isaiah saw God clearly and then saw himself clearly. When have I had a spiritual experience that made me more aware of my weaknesses? Did I receive it as a gift?
  - What are my “unclean lips”? What would it mean to ask the Lord to touch and cleanse *that* part of me before He sends me?
  - The sacrament is our weekly reminder that cleansing comes from the altar of Christ’s sacrifice. How could I approach it with Isaiah’s mix of honesty (“woe is me”) and hope (“thy sin purged”)?
  - Is there an assignment where I feel I’m preaching to people who “hear but understand not”? Can I keep going, trusting the holy seed in the stump?

explore: |
  - **Call narratives.** Compare Isaiah’s call with Moses’s ([[Ex. 3–4]]), Jeremiah’s ([[Jer. 1:4–10]]), Ezekiel’s ([[Ezek. 1–3]]), Lehi’s ([[1 Ne. 1:6–15]]), and Joseph Smith’s ([[JS—H 1:14–20]]). What elements repeat?
  - **Throne visions.** Read [[1 Ne. 1:8]] and [[Alma 36:22]]. Lehi saw “God sitting upon his throne, surrounded with numberless concourses of angels.” What does it mean that Book of Mormon prophets had similar visions?
  - **Isaiah 6 and the temple.** Consider how this vision in the temple moves from God’s presence, to cleansing, to covenant commitment. How does that parallel your own temple worship?

