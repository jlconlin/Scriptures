chapter: 58
title: The Fast That I Have Chosen
tagline: A devout people ask why God ignores their fasting, and He answers that a fast which leaves the hungry hungry is no fast at all; then He describes the fast He wants, and the Sabbath that becomes a delight.
when: 'Setting: the community in Judah, late sixth century BC; read in synagogues on the Day of Atonement'

setting: |
  Chapter 58 begins the third part of chapters 40–66 (the second “no peace” refrain closed 57:21). The problem is no longer idolatry. These people are religious. They seek God daily, they fast, they want to know His ways (verse 2). Their question is why He doesn’t seem to notice.

  During the exile the Jews began keeping fasts to mourn the destruction of Jerusalem and the temple. In the fourth year of King Darius ([[Zech. 7:1]]), soon after work on the temple resumed in 520 BC, the prophet Zechariah was asked whether those fasts should continue. His answer is very close to this chapter: “did ye at all fast unto me, even to me?… Execute true judgment, and shew mercy” ([[Zech. 7:5–9]]). Isaiah 58 may be addressing the same situation.

  The chapter has had a long life in worship. The Talmud names [[Isa. 57:14–58:14]] as the prophetic reading in the synagogue on Yom Kippur, the Day of Atonement, the one fast the law of Moses commands. Jesus drew a line from verse 6 into His sermon at Nazareth ([[Luke 4:18]]). And for Latter-day Saints, verses 6–11 are the scriptural charter of the monthly fast and the fast offering.

thread: |
  Isaiah 58 is about **the difference between afflicting your soul and giving it away**.

  The people fast and “afflict” their souls, and they complain that God takes no notice (verse 3). The Lord answers that on the same day they fast, they pursue their own interests, drive their workers, and quarrel (verses 3–4). A bowed head and sackcloth are not what He asked for (verse 5).

  The fast He has chosen points outward: loosen the bonds of injustice, break the yoke, share bread with the hungry, bring the homeless into your house, clothe the naked (verses 6–7). The key line is verse 10: “if thou draw out thy soul to the hungry, and satisfy the afflicted soul.” The same word, *nepeš*, “soul,” runs through the chapter. The people afflicted their own souls; the Lord asks them to pour out their souls for the afflicted. And every promise that follows answers their complaint: light, healing, guidance, and above all, “thou shalt call, and the LORD shall answer… Here I am” (verse 9).

  The Sabbath passage at the end (verses 13–14) makes the same point about a different holy day. It is holy when they stop “doing thy pleasure,” the same failing that spoiled their fast (verse 3). A day given to the Lord instead of to themselves becomes “a delight.”

sections:
  - range: 1-5
    heading: Why have we fasted?
    plain: |
      Shout it out, don’t hold back! Raise your voice like a trumpet. Tell My people their rebellion, and the house of Jacob their sins. Day after day they seek Me and seem eager to know My ways, as if they were a nation that did what is right and had not abandoned the commands of its God. They ask Me for just decisions and seem eager to come near to God. “Why have we fasted,” they say, “and You don’t see? Why have we humbled ourselves, and You don’t notice?” Look: on the day you fast, you do as you please and drive all your workers. Your fasting ends in quarreling and strife and in striking with a wicked fist. You cannot fast as you do today and expect your voice to be heard on high. Is this the kind of fast I have chosen, a day for people to humble themselves? Is it only bowing your head like a reed and lying on sackcloth and ashes? Is that what you call a fast, a day acceptable to the Lord?
  - range: 6-12
    heading: The fast I have chosen
    plain: |
      Isn’t this the fast I have chosen: to loosen the chains of injustice, untie the ropes of the yoke, set the oppressed free, and break every yoke? Isn’t it to share your bread with the hungry and bring the homeless poor into your house, to clothe the naked when you see them, and not to turn away from your own flesh and blood? Then your light will break out like the dawn, and your healing will come quickly. Your righteousness will go before you, and the glory of the Lord will guard you from behind. Then you will call, and the Lord will answer; you will cry for help, and He will say, “Here I am.” If you get rid of the yoke among you, the pointing finger and malicious talk, if you pour yourself out for the hungry and satisfy the needs of the afflicted, then your light will rise in the darkness, and your gloom will be like noon. The Lord will always guide you. He will satisfy you in parched places and strengthen your bones. You will be like a well-watered garden, like a spring whose waters never fail. Your people will rebuild the ancient ruins and raise up the foundations laid long ago. You will be called the Repairer of Broken Walls, the Restorer of Streets to Live In.
  - range: 13-14
    heading: Call the Sabbath a delight
    plain: |
      If you keep your feet from breaking the Sabbath and from doing as you please on My holy day, if you call the Sabbath a delight and the Lord’s holy day honorable, and if you honor it by not going your own way, not doing as you please, and not speaking idle words, then you will find your delight in the Lord. I will make you ride on the heights of the land and feed you with the inheritance of your father Jacob. The mouth of the Lord has spoken.

notes:
  - ref: 1
    phrase: lift up thy voice like a trumpet
    kind: history
    title: A trumpet and a fast
    body: |
      The trumpet here is the *šôpār*, the ram’s horn, and it was the signal for a fast: “Blow the trumpet in Zion, sanctify a fast, call a solemn assembly” ([[Joel 2:15]]). The prophet is told to use his voice as a shofar. But instead of calling the people to a fast, he is to announce their sins in the middle of one.

      The chapter’s language points especially to the Day of Atonement. “Afflict your soul” (verses 3 and 5) is the technical phrase for that day: “on the tenth day of the month, ye shall afflict your souls, and do no work at all” ([[Lev. 16:29]]). On that same day every fiftieth year, the shofar announced the Jubilee: “in the day of atonement shall ye make the trumpet sound throughout all your land… and proclaim liberty throughout all the land” ([[Lev. 25:9–10]]). In the Jubilee, debts were forgiven and those sold into servitude went home. The “fast that I have chosen” in verse 6, which sets the oppressed free and breaks every yoke, sounds a great deal like it.

      Whether Isaiah had the Day of Atonement specifically in mind is uncertain; the people’s complaint could apply to any fast. But the Talmud already assigns this chapter as the prophetic reading for Yom Kippur, describing it as a passage about fasting and repentance.
    sources: [mt-sefaria, talmud-megillah-31a, bd-fasts]
  - ref: 3
    phrase: Wherefore have we fasted, say they, and thou seest not?
    kind: liken
    title: Why doesn’t God notice?
    body: |
      The complaint is sincere. These people are not hypocrites in the simple sense; verse 2 says they seek God “daily” and “delight to know my ways.” They have done what religion asked, and God seems silent. That is a question many faithful people ask.

      The Lord’s answer is uncomfortable. “In the day of your fast ye find pleasure, and exact all your labours.” The Hebrew is sharper: “you pursue your own business (*ḥēpeṣ*) and you drive all your laborers.” While they went without food, their workers kept working. The fast was real for them and a burden for everyone else. And it made them irritable: “ye fast for strife and debate, and to smite with the fist of wickedness.”

      Verse 5 describes the outward form: the head bowed like a reed, sackcloth and ashes spread out. Jesus described the same show: “when ye fast, be not, as the hypocrites, of a sad countenance: for they disfigure their faces, that they may appear unto men to fast” ([[Matt. 6:16]]). Zechariah asked the question that sums it up: “did ye at all fast unto me, even to me?” ([[Zech. 7:5]]).

      The root of *ḥēpeṣ*, “pleasure” or “business,” is worth watching. It appears in verse 2, where they “delight” (*yeḥpāṣûn*) to know God’s ways, in verse 3, and twice in the Sabbath passage of verse 13. The chapter keeps asking whose pleasure a holy day serves.
    sources: [mt-sefaria, bdb, delitzsch]
  - ref: 6
    phrase: to let the oppressed go free
    kind: christ
    title: A line in the sermon at Nazareth
    body: |
      When Jesus stood up in the synagogue at Nazareth, He read from Isaiah 61, and Luke records the reading this way: “he hath sent me to heal the brokenhearted, to preach deliverance to the captives, and recovering of sight to the blind, to set at liberty them that are bruised” ([[Luke 4:18]]).

      The last phrase is not in Isaiah 61. It comes from this verse, in the wording of the Greek Septuagint: “send away the crushed in release.” Luke’s Greek has the same three words as the Septuagint of 58:6, *tethrausmenous en aphesei*, with the verb changed from a command to an infinitive to fit the sentence. Either Jesus joined the two passages as He read, or Luke combined them in summarizing the sermon. Either way, the fast that sets the oppressed free is placed in the mission statement of Jesus’ ministry. The common word is “release” (Greek *aphesis*), the Septuagint’s word for the Jubilee release in [[Lev. 25:10]] and also the New Testament’s word for forgiveness, as in “my blood… shed for many for the remission of sins” ([[Matt. 26:28]]).

      So the fast the Lord chose is also a description of what He came to do. When His disciples fast to lift burdens, they are joining His work.
    sources: [lxx-rahlfs, greek-nt]
  - ref: 7
    phrase: Is it not to deal thy bread to the hungry, and that thou bring the poor that are cast out to thy house?
    kind: restoration
    title: The law of the fast
    body: |
      Verse 7 is concrete. The bread you are not eating today should feed someone who is hungry. The homeless should come into “thy house,” not just receive a handout at the door. The naked should be clothed. And you should not “hide thyself from thine own flesh,” turn away from the needs of your own relatives.

      This is the scriptural basis of the Latter-day Saint practice of fasting once a month and giving the cost of the skipped meals, or more, as a fast offering to help the poor. President Henry B. Eyring called verses 6–11 the Lord’s description of the law of the fast, and he taught that the offering does more than feed and clothe; it can “heal and change hearts,” those of the giver and the receiver alike.

      The Book of Mormon puts the same principle as bluntly as Isaiah. Amulek, after urging the Zoramites to pray, warned that “if ye turn away the needy, and the naked, and visit not the sick and afflicted, and impart of your substance, if ye have, to those who stand in need… your prayer is vain, and availeth you nothing” ([[Alma 34:28]]). King Benjamin listed the same acts: “feeding the hungry, clothing the naked, visiting the sick” ([[Mosiah 4:26]]). And Jesus made them the standard of the final judgment ([[Matt. 25:35–40]]).
    sources: [eyring-fast]
  - ref: 8
    phrase: the glory of the LORD shall be thy rearward
    kind: symbol
    title: Glory behind and before
    body: |
      The promises of verses 8–12 are pictures from the Exodus. When Israel left Egypt, the pillar of cloud moved from in front of the camp to behind it, standing between Israel and Pharaoh’s army ([[Ex. 14:19]]). Isaiah used the same image for the return from Babylon: “the God of Israel will be your rearward” ([[Isa. 52:12]]). Here the promise is given to anyone who keeps the true fast. Their “righteousness shall go before thee,” and the Lord’s glory will guard the rear.

      The first promise is light: “thy light break forth as the morning.” Verse 10 repeats it: “thy light rise in obscurity, and thy darkness be as the noonday.” The people who complained that God did not see them are promised that they will be seen, because they will shine. Isaiah will develop the image fully two chapters later: “Arise, shine; for thy light is come” ([[Isa. 60:1]]). Jesus used it the same way: “Let your light so shine before men, that they may see your good works” ([[Matt. 5:16]]).
  - ref: 9
    phrase: thou shalt cry, and he shall say, Here I am
    kind: words
    title: Here I am
    body: |
      This is the direct answer to the complaint of verse 3. They asked why God did not see. He promises that when they call, He will answer, and His answer will be *hinnēnî*, “Here I am.”

      In the Old Testament, *hinnēnî* is what a servant says to a master, or a person says to God, when called. Abraham said it when God called him to Moriah ([[Gen. 22:1]]); Moses said it at the burning bush ([[Ex. 3:4]]); Samuel said it three times in the night ([[1 Sam. 3:4–8]]); Isaiah said it in the temple: “Here am I; send me” ([[Isa. 6:8]]). (The King James Version translates the same Hebrew both as “Here am I” and “Here I am.”) In verse 9 God says it to His people, as if He were the servant answering a summons.

      The condition comes right after: take away “the yoke, the putting forth of the finger, and speaking vanity.” The pointing finger is a scornful gesture (compare [[Prov. 6:13]]). God answers those who stop pointing at others.
    sources: [mt-sefaria, delitzsch]
  - ref: 10
    phrase: And if thou draw out thy soul to the hungry, and satisfy the afflicted soul
    kind: words
    title: Two ways to afflict a soul
    body: |
      This verse holds the chapter together, and it depends on one Hebrew word, *nepeš*, usually translated “soul.” *Nepeš* means the living self, but it also means appetite, throat, and hunger. It is the part of a person that wants to be filled.

      The people “afflicted our soul” (*ʿinnînû napšēnû*, verse 3): they made their own *nepeš* go hungry. The Lord asks them to “draw out thy soul to the hungry” (*tāpēq… napšekā*), to pour out their *nepeš*, their own appetite and self, for someone else, and to “satisfy the afflicted soul” (*nepeš naʿănâ*). The “afflicted soul” is now someone else’s. The fast has been turned inside out. The hunger they felt is meant to make them notice the hunger of others.

      The Doctrine and Covenants makes a similar move when it defines fasting on the Sabbath: “that thy fasting may be perfect, or, in other words, that thy joy may be full. Verily, this is fasting and prayer, or in other words, rejoicing and prayer” ([[D&C 59:13–14]]). A fast that turns outward becomes joy.
    sources: [mt-sefaria, bdb]
  - ref: 11
    phrase: like a spring of water, whose waters fail not
    kind: symbol
    title: A spring that does not lie
    body: |
      The Hebrew for “fail” here is *kāzab*, “to lie,” which the lexicon glosses for this verse as waters that “disappoint.” A spring “whose waters fail not” is literally one “whose waters do not lie.” Jeremiah used the same image in despair, asking whether God would be to him “as a liar, and as waters that fail” ([[Jer. 15:18]]); his word for “liar,” *ʾakzāb*, comes from the same verb.

      The promise is that those who pour out their souls will not run dry. They will be like “a watered garden” (compare [[Jer. 31:12]]) and like a spring that is still flowing in August. Jesus promised the same to the woman at the well: the water He gives “shall be in him a well of water springing up into everlasting life” ([[John 4:14]]).

      Verse 12 then gives the people new names: “The repairer of the breach, The restorer of paths to dwell in.” Those who fast in the Lord’s way become builders. The ruined city is rebuilt by people who have learned to care for one another.
    sources: [mt-sefaria, bdb, delitzsch]
  - ref: 13
    phrase: call the sabbath a delight, the holy of the LORD, honourable
    kind: restoration
    title: A sign and a delight
    body: |
      The Sabbath passage uses the same test as the fast. The failure in verse 3 was “ye find pleasure” (*ḥēpeṣ*); here the Sabbath is kept by “not doing thy pleasure” and “not finding thine own pleasure.” The Sabbath is not a day off for one’s own projects. It is the Lord’s day, “the holy of the LORD.” The prophet Amos had described merchants who could hardly wait for it to end: “When will the new moon be gone, that we may sell corn? and the sabbath, that we may set forth wheat?” ([[Amos 8:5]]).

      And yet the result is not grim. The Sabbath becomes “a delight” (*ʿōneg*), and those who keep it “delight” themselves in the Lord (*titʿannag*, the same root). Giving up one’s own pleasure leads to a deeper one.

      President Russell M. Nelson made this passage the text of a talk on the Sabbath. He said he had once relied on lists of what to do and not do, until he learned from the scriptures that the Sabbath is a sign between God and His people ([[Ex. 31:13]]). After that he asked himself one question: “What sign do I want to give to God?” Latter-day revelation connects the Sabbath with the same things as Isaiah: worship, rest from labor, and fasting with joy ([[D&C 59:9–14]]).

      Why does the Sabbath matter so much in these chapters (see also [[Isa. 56:2–6]])? One answer is the exile. In Babylon there was no temple, but there was still the seventh day. The Sabbath was holy time that could be kept anywhere, and it marked the exiles off from the people around them; Ezekiel, prophesying to the exiles, returns to the Sabbath again and again and calls it “a sign between me and them” ([[Ezek. 20:12]]). An older reference work puts it plainly: the exile “strengthened the awe in which the day was held,” and the prophets of the exile stressed that the Sabbath was a day of joy. Scripture shows the same pattern twice more. When Alma’s converts fled into the wilderness, leaving the temple of King Noah’s city behind, “he commanded them that they should observe the sabbath day, and keep it holy” and set apart “one day in every week” to gather and worship ([[Mosiah 18:23–25]]). And D&C 59 was given in August 1831 to Saints who had just arrived in Jackson County, Missouri, where many of their new neighbors were known for Sabbath-breaking, horse racing, and gambling, telling them that the Sabbath would keep them “unspotted from the world” ([[D&C 59:9]]). A people without a temple, or far from one, can still keep a sanctuary in time.

      Verse 14 closes with a quotation from the Song of Moses: “He made him ride on the high places of the earth” ([[Deut. 32:13]]). Keeping the Sabbath leads to Israel’s inheritance, “the heritage of Jacob thy father.”
    sources: [nelson-sabbath, mt-sefaria, bdb, je-sabbath, jsp-dc59, sc-knowhy-303]

christ: |
  The fast the Lord chose is a description of His own ministry. At Nazareth He read that He was sent “to set at liberty them that are bruised” ([[Luke 4:18]]), words drawn from verse 6. He fed the hungry, touched the outcast, and taught that what is done for “the least of these” is done for Him ([[Matt. 25:40]]). He is also the answer to verse 9: the God who says “Here I am.” And He is Lord of the Sabbath ([[Mark 2:27–28]]), who made it a day for healing and doing good.

liken: |
  - When I fast, where does my attention go: to my own hunger, or to someone else’s?
  - Do my fast offerings reflect what I actually saved, or what I could give?
  - Is there someone I “hide myself from,” in my own family or neighborhood?
  - Have I felt that God doesn’t notice my efforts? Does this chapter suggest anything about why?
  - What sign am I giving to God with the way I spend the Sabbath?

explore: |
  - **The true fast.** Read [[Isa. 58:1–12]] with [[Zech. 7:1–10]] and [[Matt. 6:16–18]].
  - **Fasting in the Book of Mormon.** Read [[Alma 17:3]], [[Alma 34:26–29]], and [[Hel. 3:35]].
  - **Luke 4.** Compare [[Luke 4:16–21]] with [[Isa. 58:6]] and [[Isa. 61:1–2]].
  - **The Sabbath.** Read [[Ex. 31:12–17]], [[Isa. 58:13–14]], [[Mark 2:23–3:5]], and [[D&C 59:9–19]].
  - President Henry B. Eyring’s talk “Is Not This the Fast That I Have Chosen?” (April 2015) applies the chapter to the fast offering.

parallels:
