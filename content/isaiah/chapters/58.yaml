    note: Jesus’ reading at Nazareth includes a phrase from verse 6 (Septuagint).
  - ref: Zech. 7:5–10
    note: Zechariah answers a question about fasting the same way.
  - ref: D&C 59:9–14
    note: The Sabbath, worship, and fasting as “rejoicing and prayer.”

