chapter: 50
title: The Tongue of the Learned
tagline: The Lord denies that He has divorced His people, and the servant, who learns by listening morning by morning, gives his back to the smiters and sets his face like a flint.
when: 'Addressed to the exiles, often dated c. 540 BC; read by Jacob to the Nephites, about 559–545 BC'

setting: |
  Chapter 50 follows chapter 49, where both Zion and the servant speak. It opens with the Lord answering Zion’s children (verses 1–3), then gives the servant’s voice again in the third of the four [Servant Songs](/isaiah/themes/servant-songs/#song-3) (verses 4–11), whose last two verses are an appeal to the audience to choose between the servant’s way and their own (verses 10–11).

  The third song is the first in which the servant describes physical abuse. The first song ([[Isa. 42:1–9]]) presented his gentleness. The second ([[Isa. 49:1–13]]) voiced his discouragement. This one describes beating, humiliation, and spitting, and his resolve to endure them. The fourth song ([[Isa. 52:13–53:12]]) will take the suffering all the way to death. The word “servant” doesn’t actually appear in verses 4–9, but verse 10 refers back to “the voice of his servant,” which ties the speaker of verses 4–9 to the servant.

  In the Book of Mormon, Jacob, Nephi’s brother, read this chapter and the next as part of a two-day sermon to the Nephites ([[2 Ne. 6–10]]). He explained why: “they may be likened unto you, for ye are of the house of Israel” ([[2 Ne. 6:5]]). He had also just foretold that the Messiah would “set himself again the second time to recover” Israel ([[2 Ne. 6:14]]), and he read chapters 50 and 51 to reinforce it. In chapter 50 God declares His “power to deliver” and to help those who obey “the voice of his servant,” while those who walk in the light of their own fire “lie down in sorrow.” His text appears as [[2 Ne. 7]].

thread: |
  Isaiah 50 is about **listening**. It sets two kinds of hearers side by side.

  The first are the Lord’s people in exile. They feel abandoned, as though God has divorced their mother or sold them to pay His debts. The Lord denies it: show Me the divorce papers. You sold yourselves (verse 1). The real problem is that “when I called, was there none to answer?” (verse 2). The Lord has power to redeem. What He hasn’t had is a people who respond.

  The second hearer is the servant. He has “the tongue of the learned,” literally the tongue of a disciple, and he has it because every morning the Lord wakes his ear “to hear as the learned” (verse 4). He listens first, then speaks, and what he speaks is “a word in season to him that is weary.” His listening leads straight into suffering: “I gave my back to the smiters” (verse 6). But the servant who was “not rebellious” doesn’t turn back. He sets his face like flint and trusts that God will vindicate him in court (verses 7–9).

  The chapter ends by asking the audience which kind of hearer they will be. Those who walk in darkness can trust in the Lord, as the servant did. Or they can light their own fires and walk by their own sparks, and “lie down in sorrow” (verses 10–11). The Lord called and no one answered. The servant answered, and it cost him everything. The reader is next.

sections:
  - range: 1-3
    heading: No divorce, no sale
    plain: |
      This is what the Lord says: Where is your mother’s certificate of divorce, showing that I sent her away? Or to which of My creditors did I sell you? No, you were sold because of your sins; your mother was sent away because of your rebellions. Why was no one there when I came? Why did no one answer when I called? Is My arm too short to rescue you? Do I lack the strength to save you? With a word I dry up the sea and turn rivers into desert; their fish rot for lack of water and die of thirst. I dress the sky in darkness and make sackcloth its covering.
  - range: 4-9
    heading: The servant who listens
    plain: |
      The Lord God has given me the tongue of one who is taught, so that I know how to sustain the weary with a word. Morning after morning He wakes me; He wakes my ear to listen like a student. The Lord God has opened my ears, and I have not rebelled or turned back. I offered my back to those who beat me and my cheeks to those who pulled out my beard. I did not hide my face from insults and spitting. Because the Lord God helps me, I will not be disgraced. That is why I have set my face like flint, and I know I will not be put to shame. The One who vindicates me is near. Who will bring charges against me? Let us face each other in court. Who is my accuser? Let him confront me. The Lord God helps me. Who will condemn me? All of them will wear out like a garment; the moth will eat them up.
  - range: 10-11
    heading: Two ways to walk in the dark
    plain: |
      Who among you fears the Lord and listens to the voice of His servant? Whoever walks in darkness and has no light, let him trust in the name of the Lord and rely on his God. But all of you who light your own fires and arm yourselves with burning torches, go ahead and walk in the light of your fire and the torches you have lit. This is what you will receive from My hand: you will lie down in torment.

notes:
  - ref: 1
    phrase: Where is the bill of your mother’s divorcement, whom I have put away?
    kind: history
    title: No divorce papers, no debt
    body: |
      The exiles were indeed sent away and sold, but the Lord denies that He ended the relationship, and answers with two legal images from Israelite family law.

      **Divorce.** Under [[Deut. 24:1–4]] a husband who divorced his wife had to give her a written “bill of divorcement” (*sēper kĕrîtût*, a “writing of divorcement”). The Lord asks, in effect, “Show Me the papers.” There aren’t any. The separation is real, but it isn’t final. This is a bold answer, because Jeremiah had used exactly this image in the opposite direction: “I had put her away, and given her a bill of divorce” ([[Jer. 3:8]]), speaking of the northern kingdom. Isaiah insists that for Zion, no such document exists.

      **Debt slavery.** A debtor who couldn’t pay might have to sell his children into servitude ([[2 Kgs. 4:1]]; [[Neh. 5:5]]). Did the Lord sell Israel to pay His creditors? The Lord is in debt to no one, and He alone can pay the price for Israel’s salvation. “For your iniquities have ye sold yourselves.”

      The Book of Mormon opens the chapter with a sharper question: “Have I put thee away, **or have I cast thee off forever?**” ([[2 Ne. 7:1]]). The added words name the real fear behind the legal language. Paul answered the same fear in almost the same terms: “Hath God cast away his people? God forbid” ([[Rom. 11:1]]).
    sources: [bdb, delitzsch, isaiah-in-bom, lds-scriptures]
  - ref: 2
    phrase: Is my hand shortened at all, that it cannot redeem? or have I no power to deliver?
    kind: words
    title: A short arm
    body: |
      A “short” hand is a Hebrew idiom for powerlessness: the verb *qāṣar*, “be short,” is used of the Lord’s hand to mean ineffective. When Moses doubted that the Lord could feed Israel meat in the wilderness, the Lord asked whether His hand had “waxed short” ([[Num. 11:23]]). Isaiah uses the idiom again in [[Isa. 59:1]]: “the LORD’s hand is not shortened, that it cannot save.”

      The proof offered is the Lord’s word of rebuke: “at my rebuke I dry up the sea… their fish stinketh.” The stinking fish recall the first plague in Egypt, when “the fish that was in the river died; and the river stank” ([[Ex. 7:21]]), and the rebuke that dries the sea recalls the Red Sea: “He rebuked the Red sea also, and it was dried up” ([[Ps. 106:9]]).

      The problem, then, is not the Lord’s power. It is the other half of verse 2: “when I called, was there none to answer?” The Book of Mormon turns the question into a flat statement: “when I came, there was no man; when I called, yea, there was none to answer” ([[2 Ne. 7:2]]). That sets up the contrast with the servant, who does answer.
    sources: [bdb, delitzsch, lds-scriptures]
  - ref: 4
    phrase: The Lord GOD hath given me the tongue of the learned, that I should know how to speak a word in season to him that is weary
    kind: words
    title: The tongue of a disciple
    body: |
      “The learned” in the King James is *limmûdîm*, from the verb *lāmad*, “to learn.” It doesn’t mean scholars. It means *those who are taught*, disciples. Isaiah uses the same word for his own disciples in [[Isa. 8:16]] (“seal the law among my disciples”) and for Zion’s children in [[Isa. 54:13]] (“all thy children shall be taught of the LORD”). The servant has the tongue of a disciple because he has the ear of a disciple: “he wakeneth mine ear to hear as the learned.” His speaking comes from his listening, and his listening is daily, “morning by morning.”

      The purpose of his teaching is pastoral. He knows how to “speak a word in season to him that is weary.” The verb translated “speak a word in season” (*lāʿût*) occurs only here and is uncertain. The KJV has “in season,” but modern translations have “sustain” (NRSVUE, ESV, NIV). Either way, the servant’s words are for the tired.

      When Jesus taught in the temple, people wondered, “How knoweth this man letters, having never learned?” He answered, “My doctrine is not mine, but his that sent me” ([[John 7:15–16]]). And His best-known invitation is addressed to exactly the audience of this verse: “Come unto me, all ye that labour and are heavy laden, and I will give you rest” ([[Matt. 11:28]]).

      The Book of Mormon directs the promise to the audience: “a word in season unto thee, O house of Israel. When ye are weary he waketh morning by morning” ([[2 Ne. 7:4]]).
    sources: [bdb, nrsvue, esv, niv, lds-scriptures]
  - ref: 5
    phrase: The Lord GOD hath opened mine ear, and I was not rebellious, neither turned away back
    kind: christ
    title: An opened ear
    body: |
      Two chapters earlier, the Lord said of Israel, “from that time that thine ear was not opened” ([[Isa. 48:8]]). The servant is what Israel was not: his ear has been opened, and he did not rebel. The contrast is deliberate. The servant succeeds exactly where the people failed.

      [[Ps. 40:6]] uses the same image: “mine ears hast thou opened.” The Epistle to the Hebrews takes that psalm (following the Septuagint) as the words of Christ when He came into the world: “Lo, I come… to do thy will, O God” ([[Heb. 10:5–7]]). The opened ear is the ear of obedience. In the Gospel of John, Jesus describes His whole ministry this way: “I can of mine own self do nothing: as I hear, I judge” ([[John 5:30]]).

      “Neither turned away back” is the verse’s hinge. The next verse shows what not turning back will cost.
    sources: [delitzsch, lds-scriptures]
  - ref: 6
    phrase: I gave my back to the smiters, and my cheeks to them that plucked off the hair
    kind: christ
    title: '“I gave my back to the smiters”'
    body: |
      Three humiliations: beating on the back, the rod’s place for “him that is void of understanding” ([[Prov. 10:13]]; [[Prov. 26:3]]); tearing out the beard, an insult (David’s envoys, their beards half shaved, “were greatly ashamed,” [[2 Sam. 10:4–5]]); and spitting in the face, a sign of disgrace ([[Num. 12:14]]; [[Deut. 25:9]]).

      The verb matters: “I *gave*.” The servant doesn’t merely suffer abuse. He offers himself to it. Jesus said the same of His life: “No man taketh it from me, but I lay it down of myself” ([[John 10:18]]).

      The Gospel accounts of the Passion correspond closely to this verse. After the trial before the council, “did they spit in his face, and buffeted him” ([[Matt. 26:67]]); Pilate had Him scourged ([[Matt. 27:26]]); the soldiers “spit upon him, and took the reed, and smote him on the head” ([[Matt. 27:30]]). Nephi, who had seen it in vision centuries before, describes it with the same patient refrain: “they smite him, and he suffereth it; yea, they spit upon him, and he suffereth it” ([[1 Ne. 19:9]]).

      Prophets were in fact beaten and imprisoned ([[Jer. 20:2]]; [[Jer. 37:15]]), so a reader who takes the servant to be the prophet or the nation has precedent. That is part of the pattern. Christians see the pattern’s fulfillment in the one who suffered it most completely.
    sources: [delitzsch, lds-scriptures]
  - ref: 7
    phrase: therefore have I set my face like a flint
    kind: symbol
    title: A face like flint
    body: |
      Flint (*ḥallāmîš*) is used here as a simile of firmness. To set one’s face like flint is to be unyielding to the attacks of one’s enemies. The Lord gave Ezekiel the same kind of face for his difficult mission: “As an adamant harder than flint have I made thy forehead: fear them not” ([[Ezek. 3:9]]).

      There is a striking contrast with chapter 48, where Israel’s stubbornness was a neck of iron and a “brow brass” ([[Isa. 48:4]]). Both are hard faces. But Israel’s was hardened *against* God; the servant’s is hardened *because of* Him: “For the Lord GOD will help me; therefore shall I not be confounded.” Firmness is not a virtue or a vice in itself. It depends on what one is firm about.

      Luke’s description of Jesus turning toward Jerusalem may echo this verse: “he steadfastly set his face to go to Jerusalem” ([[Luke 9:51]]).
    sources: [bdb, delitzsch, lds-scriptures]
  - ref: 8
    phrase: He is near that justifieth me; who will contend with me? let us stand together
    kind: words
    title: The servant in court
    body: |
      Verses 8–9 use the language of a lawsuit. “Justifieth” (*maṣdîq*) is a legal term: to set someone forth as righteous, to vindicate. “Contend” (*rîb*) means to strive or plead a case. “Let us stand together” means to take a stand against each other. “Adversary” is literally “master of my judgment” (*baʿal mišpāṭî*), the one who has a lawsuit against me. The servant has been beaten and spat upon, a verdict of contempt from human society. But he appeals to a higher court, where the one who vindicates him is near.

      Paul’s words on the security of those who are in Christ use the same language: “Who shall lay any thing to the charge of God’s elect? It is God that justifieth. Who is he that condemneth? It is Christ that died” ([[Rom. 8:33–34]]). The servant’s confidence in his vindication becomes the believer’s confidence through the servant.

      The Book of Mormon adds a line to the servant’s challenge: “Let him come near me, **and I will smite him with the strength of my mouth**” ([[2 Ne. 7:8]]). The servant’s only weapon is his word, which recalls “he hath made my mouth like a sharp sword” ([[Isa. 49:2]]).
    sources: [bdb, delitzsch, lds-scriptures]
  - ref: 10
    phrase: that walketh in darkness, and hath no light? let him trust in the name of the LORD, and stay upon his God
    kind: words
    title: Walking in the dark
    body: |
      This verse admits something religious writing doesn’t always admit: a person can fear the Lord, obey the voice of His servant, and still walk “in darkness” with “no light.” Faithfulness doesn’t guarantee clarity. The counsel for that condition is simple: “trust in the name of the LORD, and stay upon his God.”

      Chapter 48 spoke of people who “stay themselves upon the God of Israel” ([[Isa. 48:2]]) while their neck was “an iron sinew” ([[Isa. 48:4]]). Here is what reliance looks like in the servant’s audience: continuing to lean on God when you can’t see anything.

      Latter-day scripture has its own examples. Joseph Smith in Liberty Jail cried, “O God, where art thou?” ([[D&C 121:1]]) and received the answer that his adversity would be “but a small moment” ([[D&C 121:7]]). Alma taught that faith is precisely hope “for things which are not seen, which are true” ([[Alma 32:21]]).

      The Book of Mormon text of this verse ends with the question: “Who is among you that feareth the Lord, that obeyeth the voice of his servant, that walketh in darkness and hath no light?” ([[2 Ne. 7:10]]). The line of counsel does not appear. The effect is to leave the question hanging and let verse 11 supply the warning.
    sources: [delitzsch, lds-scriptures]
  - ref: 11
    phrase: walk in the light of your fire, and in the sparks that ye have kindled
    kind: symbol
    title: Walking by your own sparks
    body: |
      The alternative to trusting God in the dark is to make your own light. The people addressed here “kindle a fire” and surround themselves with “sparks” (*zîqôt*, “sparks, brands,” or perhaps fire-missiles). The Lord’s answer is ironic: go ahead, walk by your own light, and see where it takes you. “This shall ye have of mine hand; ye shall lie down in sorrow.”

      The image can be read in two ways:

      - **Self-made light.** The KJV’s “sparks” suggests people who refuse to walk in darkness with God manufacturing their own illumination. This is a devotional reading of the English rather than a point the Hebrew forces.
      - **Weapons against the servant.** *Zîqôt* can also mean missiles (the related plural in [[Prov. 26:18]] stands beside “arrows”). On this reading the people who arm themselves are the servant’s persecutors from verses 6–9, and their weapons turn back on them. This connects the verse to the lawsuit that precedes it.

      Either way, the verse sets two paths side by side: darkness with God, or light without Him. The first ends in vindication; the second in sorrow. Nephi used similar language about trusting human wisdom: “Cursed is he that putteth his trust in man, or maketh flesh his arm” ([[2 Ne. 28:31]]).
    sources: [bdb, delitzsch, lds-scriptures]

christ: |
  Verse 6 corresponds closely to the Gospel accounts of the Passion. The one who “gave my back to the smiters” and “hid not my face from shame and spitting” is, for Latter-day Saints, Jesus Christ, who was beaten, scourged, and spat upon, and who suffered it willingly ([[Matt. 26:67]]; [[1 Ne. 19:9]]).

  But the chapter shows more than His suffering. It shows the life that led there. He learned “morning by morning” with an opened ear. He spoke “a word in season to him that is weary.” He was “not rebellious, neither turned away back.” He set His face like a flint toward Jerusalem. And He trusted that the Father who justified Him was near. That is why Paul could turn the servant’s confident question into a promise to all believers: “It is God that justifieth. Who is he that condemneth?” ([[Rom. 8:33–34]]).

explore: |
  - **The four Servant Songs.** Read them side by side on [The Servant Songs](/isaiah/themes/servant-songs/) page and trace how the servant’s suffering grows.
  - **Jacob’s sermon.** Read [[2 Ne. 6–8]] and notice how Jacob introduces and frames Isaiah for the Nephites.
  - **The Passion.** Compare verse 6 with [[Matt. 26:59–68]], [[Matt. 27:26–31]], and [[1 Ne. 19:7–10]].
  - **Justification in court.** Read [[Isa. 50:7–9]] alongside [[Rom. 8:31–39]].
  - **Faith in darkness.** Read [[D&C 121:1–8]], [[D&C 122:5–9]], and [[Alma 32:21–43]].

