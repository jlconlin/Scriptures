chapter: 33
title: Who Shall Dwell with the Devouring Fire?
tagline: The treacherous destroyer is destroyed, sinners in Zion ask who can live with God’s holiness, and the answer is a portrait of the righteous.
when: 'c. 701 BC, as Sennacherib broke his agreement with Hezekiah'

setting: |
  Chapter 33 is the last of the woes that began in chapter 28. It moves from a woe against the destroyer to a prayer, a lament, a divine answer, a question about who may dwell with God, and a vision of Zion at peace.

  The historical background helps. When Sennacherib invaded Judah in 701 BC, Hezekiah tried to buy him off. He paid an enormous tribute, even stripping the gold from the temple doors ([[2 Kgs. 18:13–16]]). Sennacherib took the payment and attacked anyway. That is the “treacherous dealer” of verse 1, who “hath broken the covenant” (verse 8). The envoys of peace weep bitterly (verse 7).

  The chapter includes a question like those asked at the entrance to the Lord’s house in [[Ps. 15:1]] and [[Ps. 24:3]]: “Who among us shall dwell with the devouring fire?” (verse 14), answered with a portrait of a righteous person (verses 15–16), and a promise: “Thine eyes shall see the king in his beauty” (verse 17).

thread: |
  Isaiah 33 turns on a single question: **who can live in the presence of God?**

  It begins with a betrayed people. The Assyrian, the “spoiler” who has never been spoiled, has broken his word (verse 1). Roads are empty, envoys weep, and the land withers (verses 7–9). The people pray, “O LORD, be gracious unto us; we have waited for thee: be thou their arm every morning” (verse 2).

  The Lord answers: “Now will I rise… now will I be exalted” (verse 10). And when He rises, His presence is like fire. The oppressors burn like lime and thorns (verses 11–12).

  But the fire doesn’t only frighten the Assyrians. It frightens the sinners in Zion, too (verse 14). Suddenly the hypocrites realize that the holy God they claimed to worship is a “devouring fire,” “everlasting burnings.” Who can live with that?

  The answer (verses 15–16) is a portrait of the kind of person who can: someone who walks righteously, speaks honestly, refuses gain from oppression, won’t take bribes, stops their ears from hearing plans for bloodshed, and shuts their eyes from looking on evil. That person “shall dwell on high,” protected by a fortress of rock, with bread and water sure.

  And the reward is far more than safety: “**Thine eyes shall see the king in his beauty**” (verse 17). The chapter ends with Zion as a tent whose stakes will never be pulled up (verse 20), with the Lord as “our judge… our lawgiver… our king” (verse 22), and with a people who are healed and forgiven (verse 24).

  The same fire that consumes the treacherous is the glory in which the righteous dwell.

sections:
  - range: 1-6
    heading: The destroyer destroyed, and a prayer
    plain: |
      Woe to you, destroyer, who has never been destroyed! Woe to you, traitor, who has never been betrayed! When you finish destroying, you will be destroyed; when you stop betraying, you will be betrayed. Lord, be gracious to us; we wait for You. Be our strength every morning and our salvation in time of trouble. At the thunder of Your voice the peoples flee; when You rise up, the nations scatter. Your plunder will be stripped as if by young locusts; people will swarm over it like locusts. The Lord is exalted, for He dwells on high; He will fill Zion with justice and righteousness. He will be the sure foundation for your times, a rich store of salvation, wisdom, and knowledge. The fear of the Lord is Zion’s treasure.
  - range: 7-13
    heading: A broken covenant, and the Lord rises
    plain: |
      Look! Their brave men cry out in the streets; the envoys of peace weep bitterly. The highways are deserted; no travelers are on the roads. The treaty is broken, the cities are despised, no one is respected. The land mourns and wastes away. Lebanon is ashamed and withers; Sharon is like a desert, and Bashan and Carmel drop their leaves. “Now I will arise,” says the Lord. “Now I will be exalted; now I will be lifted up. You conceive chaff and give birth to straw; your own breath is a fire that consumes you. The peoples will be burned to lime, like cut thornbushes set ablaze. You who are far away, hear what I have done; you who are near, acknowledge My power!”
  - range: 14-16
    heading: Who can dwell with the fire?
    plain: |
      The sinners in Zion are terrified; trembling grips the godless: “Who of us can live with the consuming fire? Who of us can live with everlasting burning?” It is the one who walks righteously and speaks what is right, who rejects profit from extortion and keeps his hands from accepting bribes, who stops his ears against plots of murder and shuts his eyes against contemplating evil. He will dwell on the heights, and his refuge will be the mountain fortress. His bread will be supplied, and water will not fail him.
  - range: 17-24
    heading: The King in His beauty
    plain: |
      Your eyes will see the King in His beauty and view a land that stretches far away. You will think back on the terror: “Where is the scribe? Where is the receiver? Where is the one who counted the towers?” You will no longer see that arrogant people, with their obscure speech and strange, incomprehensible language. Look at Zion, the city of our festivals! Your eyes will see Jerusalem, a peaceful home, a tent that will not be moved. Its stakes will never be pulled up, and none of its ropes will be broken. There the Lord will be our Mighty One. It will be like a place of broad rivers and streams, where no enemy galley with oars will row and no mighty ship will sail. For the Lord is our judge, the Lord is our lawgiver, the Lord is our king; He will save us. Your ropes hang loose; the mast is not held firm; the sail is not spread. Then an abundance of spoils will be divided, and even the lame will carry off plunder. No one living in Zion will say, “I am ill,” and the sins of those who live there will be forgiven.

notes:
  - ref: 1
    phrase: Woe to thee that spoilest, and thou wast not spoiled; and dealest treacherously
    kind: history
    title: The treacherous destroyer
    body: |
      The spoiler is best read as Assyria, and specifically Sennacherib. When he invaded Judah in 701 BC, Hezekiah sent word: “I have offended; return from me: that which thou puttest on me will I bear.” Sennacherib demanded 300 talents of silver and 30 talents of gold, and Hezekiah stripped even the gold from the temple doors to pay it ([[2 Kgs. 18:13–16]]). Sennacherib took the tribute and then sent his army to besiege Jerusalem anyway ([[2 Kgs. 18:17]]).

      Isaiah announces the principle of justice: the destroyer will be destroyed and the traitor betrayed. It came true. Sennacherib was later assassinated by his own sons ([[Isa. 37:38]]).
    sources: [bd-sennacherib, isaiah-in-bom, lds-scriptures]
  - ref: 2
    phrase: be thou their arm every morning, our salvation also in the time of trouble
    kind: scripture
    title: Strength every morning
    body: |
      The people’s prayer asks for help “every morning,” not a one-time rescue but daily strength.

      Lamentations says the Lord’s mercies “are new every morning” ([[Lam. 3:22–23]]). Jesus taught us to pray for “our daily bread” ([[Matt. 6:11]]). Manna was given the same way: enough for today, and new again tomorrow ([[Ex. 16:4]]; see also [[Alma 37:37]]).
    sources: [lds-scriptures]
  - ref: 6
    phrase: the fear of the LORD is his treasure
    kind: history
    title: Zion’s treasure
    body: |
      Hezekiah had to give away the treasures of the palace and temple to Assyria ([[2 Kgs. 18:15–16]]). Isaiah says Zion has a treasure no conqueror can carry off: “the fear of the LORD is his treasure.” Wisdom, knowledge, and reverence for God are the true “stability of thy times.”

      Jesus taught the same: “Lay not up for yourselves treasures upon earth… But lay up for yourselves treasures in heaven… For where your treasure is, there will your heart be also” ([[Matt. 6:19–21]]; [[3 Ne. 13:19–21]]).
    sources: [lds-scriptures]
  - ref: 8
    phrase: he hath broken the covenant, he hath despised the cities, he regardeth no man
    kind: history
    title: A broken treaty
    body: |
      The “covenant” here is best understood as the treaty Sennacherib made with Hezekiah when he accepted the tribute (see [[2 Kgs. 18:14–17]]). By breaking it, he showed that he “regardeth no man.” The highways lie waste and the land mourns.

      It’s a sharp contrast with the Lord, who keeps covenants perfectly ([[Deut. 7:9]]; [[D&C 82:10]]).
    sources: [delitzsch, lds-scriptures]
  - ref: 10
    phrase: Now will I rise, saith the LORD; now will I be exalted; now will I lift up myself
    kind: christ
    title: '“Now will I rise”'
    body: |
      Three times the Lord says *now*: after long patience, the time has come to act. The words “rise,” “be exalted,” and “lift up myself” echo how Isaiah speaks of the Lord “high and lifted up” ([[Isa. 6:1]]) and of the Servant who “shall be exalted and extolled, and be very high” ([[Isa. 52:13]]).
    sources: [lds-scriptures]
  - ref: 14
    phrase: Who among us shall dwell with the devouring fire? who among us shall dwell with everlasting burnings?
    kind: scripture
    title: Dwelling with everlasting burnings
    body: |
      This question comes from the sinners in Zion, who realize that God’s holiness is like fire and that they could not live in it ([[Deut. 4:24]]; [[Heb. 12:29]]).

      Latter-day revelation deepens this picture. The celestial glory is described as fire: Joseph Smith saw “the transcendent beauty of the gate… which was like unto circling flames of fire” ([[D&C 137:2]]). The presence of God is described as “like a sea of glass and fire” ([[D&C 130:7]]). Joseph Smith taught that “God dwells in everlasting burnings.” The Lord has said that whoever can abide the law of a celestial kingdom can abide a celestial glory ([[D&C 88:22]]).

      The question can be read as asking what kind of person can dwell with God, and verses 15–16 answer it.
    sources: [delitzsch, ot-manual-15, lds-scriptures]
  - ref: 15
    phrase: He that walketh righteously, and speaketh uprightly
    kind: structure
    title: A portrait of the one who can dwell with God
    body: |
      Isaiah answers the question with six qualities, as [[Ps. 15]] and [[Ps. 24:3–4]] answer similar questions:

      1. **Walks righteously**: consistent conduct.
      2. **Speaks uprightly**: honest words.
      3. **Despises the gain of oppressions**: refuses profit that comes from exploiting others.
      4. **Shakes his hands from holding of bribes**: refuses to take them.
      5. **Stops his ears from hearing of blood**: refuses to listen to murderous counsel.
      6. **Shuts his eyes from seeing evil**: refuses to look on it.
    sources: [delitzsch, lds-scriptures]
  - ref: 16
    phrase: 'He shall dwell on high: his place of defence shall be the munitions of rocks'
    kind: symbol
    title: Bread and water sure
    body: |
      The righteous person is given a “place of defence” among “munitions of rocks,” a rock-bound stronghold, and “bread shall be given him; his waters shall be sure.”

      For a city threatened by an Assyrian army ([[2 Kgs. 18:17]]), a sure supply of bread and water would be precious.
    sources: [lds-scriptures]
  - ref: 17
    phrase: Thine eyes shall see the king in his beauty
    kind: christ
    title: The King in His beauty
    body: |
      After describing who can dwell with the fire, Isaiah gives the reward: “Thine eyes shall see the king in his beauty.” During the siege, Judah’s king Hezekiah was in sackcloth and mourning ([[Isa. 37:1]]). But the righteous will one day see *the* King, the Lord Himself, in all His beauty.

      This is the great promise of the gospel: to see God. “Blessed are the pure in heart: for they shall see God” ([[Matt. 5:8]]; [[3 Ne. 12:8]]). The Lord promised that every soul who forsakes sin, comes to Him, calls on His name, obeys His voice, and keeps His commandments “shall see my face and know that I am” ([[D&C 93:1]]). Verse 15 describes the path, and verse 17 describes where it leads.
    sources: [lds-scriptures]
  - ref: 20
    phrase: not one of the stakes thereof shall ever be removed, neither shall any of the cords thereof be broken
    kind: symbol
    title: A tent whose stakes won’t be pulled up
    body: |
      Isaiah pictures Zion as a great tent (the KJV’s “tabernacle”), but one that will never be struck and moved. Not one stake will be pulled up, and not one cord will snap. Zion is permanent.

      This is one of the scriptural sources of the Church’s term **stake**. The Lord later told Zion to “lengthen thy cords, and strengthen thy stakes” ([[Isa. 54:2]]), and in the Doctrine and Covenants He called the Church’s geographic units “stakes” ([[D&C 82:14]]; [[D&C 101:21]]; [[D&C 115:6]]). The name pictures a stake of Zion as one of the stakes of this great tent: fixed, strong, and holding up the whole.
    sources: [gs-stake, ot-manual-15, delitzsch]
  - ref: 21
    phrase: wherein shall go no galley with oars, neither shall gallant ship pass thereby
    kind: symbol
    title: Rivers without warships
    body: |
      Isaiah says the Lord Himself will be to Zion “a place of broad rivers and streams”: His presence does for Jerusalem what broad rivers and canals did for cities that they surrounded, keeping the enemy off. No enemy galley or warship can sail there.

      Verse 23 is read most naturally as addressed to Jerusalem, a ship now badly rigged, with loose ropes and an unsteady mast, but one whose people will then divide great spoil, “the lame take the prey.” It has also often been read as addressed to Assyria.
    sources: [delitzsch]
  - ref: 22
    phrase: For the LORD is our judge, the LORD is our lawgiver, the LORD is our king; he will save us
    kind: christ
    title: Judge, Lawgiver, King
    body: |
      Isaiah names three roles: **judge**, **lawgiver**, and **king**. For Israel, all three belonged ultimately to the Lord.

      The verse ends, “he will save us.” Jesus Christ is the Lawgiver who gave the law to Moses ([[3 Ne. 15:5]]), the Judge before whom all will stand ([[John 5:22]]; [[Morm. 3:20]]), and the King of kings ([[Rev. 19:16]]). He fills all three roles, and He is also our Savior.
    sources: [lds-scriptures]
  - ref: 24
    phrase: the people that dwell therein shall be forgiven their iniquity
    kind: christ
    title: Healed and forgiven
    body: |
      The final verse joins physical healing and forgiveness: no one in Zion will say, “I am sick,” and their iniquity will be forgiven. Scripture joins the two elsewhere.

      When Jesus healed the paralyzed man let down through the roof, He first said, “Son, thy sins be forgiven thee,” and then healed his body to show He had power to do both ([[Mark 2:1–12]]). The risen Christ healed the Nephites’ sick “every one” ([[3 Ne. 17:7–10]]). The Atonement heals both sin and sorrow ([[Alma 7:11–13]]).
    sources: [lds-scriptures]

christ: |
  Isaiah 33 shows Jesus Christ as the **King in his beauty** whom the righteous will see (verse 17; [[D&C 93:1]]), and as **Judge, Lawgiver, and King** in one Person (verse 22). The chapter asks who can dwell with the **devouring fire** and **everlasting burnings** of God’s holiness (verse 14), and answers with the person of verses 15–16.

  He is also the one who **heals and forgives** (verse 24).

explore: |
  - **Temple entrance questions.** Compare Isaiah 33:14–16 with [[Ps. 15]], [[Ps. 24:3–6]], and [[D&C 97:15–17]].
  - **Everlasting burnings.** Read [[D&C 130:6–9]], [[D&C 137:1–4]], and [[D&C 76:50–70]]. What do they teach about the glory of the celestial world?
  - **The broken treaty.** Read [[2 Kgs. 18:13–37]] to see the events behind this chapter.

sources: [bd-sennacherib, ot-manual-15, delitzsch, isaiah-in-bom, gs-stake, lds-scriptures]
