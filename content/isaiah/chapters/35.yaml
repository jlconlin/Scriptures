chapter: 35
title: The Desert Shall Blossom as the Rose
tagline: The wilderness bursts into bloom, the blind see and the lame leap, and the ransomed walk a highway of holiness home to Zion with songs.
when: 'A vision of the gathering and the Millennium'

setting: |
  Isaiah 35 is the bright twin of chapter 34. There, the proud world became a desolate wilderness. Here, the wilderness becomes a garden. It is one of the most joyful chapters in scripture.

  The chapter also serves as a bridge. It closes the first major part of the book (chapters 1–35) and anticipates the great themes of chapters 40–66: comfort, the return from exile, the highway through the desert, and the joy of the redeemed. After it, chapters 36–39 tell the historical story of Hezekiah, and then chapter 40 opens with “Comfort ye.”

  For Latter-day Saints, chapter 35 has long been beloved as a description of the gathering to Zion, the Saints’ settlement of the American West, and the restoration of Israel. The Lord quoted its imagery in modern revelation ([[D&C 133:26–33]]).

thread: |
  Isaiah 35 is about **transformation**, and everything in the chapter is changed into its opposite.

  The **land** is transformed (verses 1–2, 6–7). The wilderness is glad, the desert blossoms, and parched ground becomes pools of water. The dens where jackals lay become meadows of reeds. Even the glory of Lebanon, Carmel, and Sharon, the most beautiful places in the land, is given to the desert.

  **People** are transformed (verses 3–6). Weak hands are strengthened, feeble knees steadied, and fearful hearts told, “Be strong, fear not.” Then the blind see, the deaf hear, the lame leap like deer, and the mute sing.

  The **journey** is transformed (verses 8–10). There is a highway through the desert, “The way of holiness.” It is so clear that even a simple traveler can’t lose the way, so safe that no lion walks on it, and so joyful that the travelers arrive singing, with “everlasting joy upon their heads.”

  What causes all this? Verse 4: “**your God will come… he will come and save you.**” The transformation of land, bodies, and journey all flow from His coming. When the Lord arrives, nothing stays the way it was. The desert blossoms because He comes. The lame leap because He comes. The ransomed sing because He has come to bring them home.

sections:
  - range: 1-2
    heading: The desert in bloom
    plain: |
      The desert and the dry land will be glad; the wilderness will rejoice and blossom like the crocus. It will burst into bloom and shout for joy. The splendor of Lebanon will be given to it, and the beauty of Carmel and Sharon. They will see the glory of the Lord, the splendor of our God.
  - range: 3-6
    heading: Be strong, fear not
    plain: |
      Strengthen the weak hands and steady the knees that give way. Say to those with anxious hearts, “Be strong; don’t be afraid! Look, your God is coming with justice, with divine retribution. He is coming to save you.” Then the eyes of the blind will be opened and the ears of the deaf unstopped. Then the lame will leap like a deer, and the tongue of the mute will shout for joy. Water will gush out in the wilderness and streams in the desert.
  - range: 7-10
    heading: The highway of holiness
    plain: |
      The burning sand will become a pool, and the thirsty ground bubbling springs. In the haunts where jackals once lay, grass will grow with reeds and papyrus. A highway will be there, and it will be called the Way of Holiness. The unclean will not travel on it; it will be for those who walk that way. Even fools will not lose their way on it. No lion will be there, and no fierce beast will come up on it; they won’t be found there. Only the redeemed will walk on it. Those the Lord has ransomed will return. They will enter Zion singing, crowned with everlasting joy. Gladness and joy will overtake them, and sorrow and sighing will flee away.

notes:
  - ref: 1
    phrase: the desert shall rejoice, and blossom as the rose
    kind: history
    title: The desert blossoms
    body: |
      The flower here (*chavatstselet*) is probably not a rose but a desert bulb flower like the **crocus** or the asphodel, which bursts into bloom across dry land after the winter rains. The picture is of a whole wilderness suddenly carpeted with flowers.

      Latter-day Saints have long loved this verse. When the pioneers arrived in the Salt Lake Valley in 1847 and began irrigating the dry land, many saw in their work a fulfillment of Isaiah’s words. Writing in 1853, a Latter-day Saint named Benjamin Brown counted this verse, with the “munitions of rocks” of [[Isa. 33:16]], among the prophecies of a people gathered to the mountains. The hymn “O Ye Mountains High” celebrates Zion in the mountains. Others see the verse fulfilled in the reclaiming of desert lands in modern Israel. Ultimately, it describes the renewal of the whole earth in the Millennium ([[A of F 1:10]]; [[D&C 133:29]]).

      Whatever the setting, the principle is the same: where the Lord’s people dwell in righteousness, barren places become fruitful.
    sources: [hymn-o-ye-mountains, sc-knowhy-802]
  - ref: 2
    phrase: the glory of Lebanon shall be given unto it, the excellency of Carmel and Sharon
    kind: symbol
    title: The best of the land, given to the desert
    body: |
      **Lebanon** was famous for its majestic cedar forests, **Carmel** for its lush wooded ridge by the sea, and **Sharon** for its fertile coastal plain full of flowers. These were the showpieces of natural beauty in Israel. In the previous chapters, Lebanon was “ashamed and hewn down” and Sharon “like a wilderness” ([[Isa. 33:9]]). Now all their glory is transferred to the desert.

      The wilderness doesn’t just become adequate. It becomes glorious. And the result: “they shall see the glory of the LORD.” Renewed creation reveals the Creator.
    sources: [bd-lebanon, bd-carmel, bd-sharon]
  - ref: 3
    phrase: Strengthen ye the weak hands, and confirm the feeble knees
    kind: scripture
    title: Lift up the hands that hang down
    body: |
      This is a command to the community: help the weak. Weak hands and wobbly knees are pictures of discouragement and exhaustion, of people who have given up trying.

      The New Testament quotes it: “lift up the hands which hang down, and the feeble knees” ([[Heb. 12:12]]). And the Lord gave it to the Saints as the essence of ministering: “Wherefore, be faithful; stand in the office which I have appointed unto you; succor the weak, lift up the hands which hang down, and strengthen the feeble knees” ([[D&C 81:5]]). Isaiah’s vision of Zion begins with people strengthening each other.
  - ref: 4
    phrase: Say to them that are of a fearful heart, Be strong, fear not
    kind: christ
    title: '“He will come and save you”'
    body: |
      “Fearful heart” is literally *hasty heart*, a heart that races with anxiety. The message to such people is not “stop feeling afraid” but a reason not to fear: “behold, your God will come… he will come and save you.”

      The “vengeance” and “recompence” are aimed at the enemies of the fearful. For the fearful themselves, His coming means rescue. It is the same message the Savior repeated so often: “Be of good cheer; it is I; be not afraid” ([[Matt. 14:27]]). “Fear not, little flock” ([[D&C 6:34]]).
  - ref: 5
    phrase: Then the eyes of the blind shall be opened, and the ears of the deaf shall be unstopped
    kind: christ
    title: The blind see, the lame leap
    body: |
      When John the Baptist, in prison, sent disciples to ask Jesus whether He was the one who should come, Jesus answered by pointing to this chapter: “Go and shew John again those things which ye do hear and see: The blind receive their sight, and the lame walk… and the deaf hear” ([[Matt. 11:2–5]]; see [[Luke 7:20–22]]). Jesus was saying, in effect, *Read Isaiah 35. It’s happening.*

      Peter and John healed a man lame from birth at the temple gate, and he went “walking, and leaping, and praising God” ([[Acts 3:1–8]]), almost exactly Isaiah’s picture. The risen Lord healed every sick, lame, blind, and deaf person brought to Him at Bountiful ([[3 Ne. 17:7–10]]).

      These miracles are also signs of spiritual healing, as eyes blind to truth are opened and deaf ears hear ([[Isa. 29:18]]; [[Isa. 32:3]]).
  - ref: 6
    phrase: Then shall the lame man leap as an hart
    kind: symbol
    title: Leaping like a deer
    body: |
      A *hart* is a male deer. The image isn’t just of a lame man walking, but *leaping*: bounding with the grace and joy of a deer. The Lord doesn’t merely repair what is broken. He restores it to exuberance.

      Many people carry physical limitations in this life that won’t be healed until the resurrection. This verse is a promise for them. Alma taught that in the resurrection “every limb and joint shall be restored to its body; yea, even a hair of the head shall not be lost” ([[Alma 40:23]]; see [[Alma 11:43–44]]).
  - ref: 7
    phrase: the parched ground shall become a pool, and the thirsty land springs of water
    kind: scripture
    title: Pools of living water
    body: |
      “Parched ground” may refer to the **mirage** of the desert, the shimmering heat that looks like water but isn’t. Isaiah says the illusion will become real: the mirage will become an actual pool.

      The Lord repeated this imagery in a revelation about the return of the lost tribes: “in the barren deserts there shall come forth pools of living water; and the parched ground shall no longer be a thirsty land” ([[D&C 133:29]]). Jesus offered the woman at the well “living water” ([[John 4:10–14]]). Water in the desert is one of Isaiah’s favorite pictures of the Spirit and of salvation ([[Isa. 41:17–18]]; [[Isa. 44:3]]; [[Isa. 55:1]]).
  - ref: 8
    phrase: it shall be called The way of holiness
    kind: symbol
    title: The Way of Holiness
    body: |
      The highway is Isaiah’s great image of the journey home. It appears again and again: [[Isa. 11:16]]; [[Isa. 19:23]]; [[Isa. 40:3–4]]; [[Isa. 62:10]]. This one has a name: “**The way of holiness**.” Only the clean walk it.

      And “the wayfaring men, though fools, shall not err therein.” The way is so plain that even the simplest traveler can’t get lost. It is not a way for the brilliant, but for the humble and willing. Nephi called the path of discipleship “the strait and narrow path which leads to eternal life,” entered by baptism and followed by pressing forward with faith in Christ ([[2 Ne. 31:17–20]]). The Lord told the Saints that an “highway shall be cast up” for the return of the lost tribes ([[D&C 133:27]]).
  - ref: 9
    phrase: No lion shall be there, nor any ravenous beast
    kind: symbol
    title: A safe road
    body: |
      Ancient travelers faced real dangers in the wilderness: lions, wolves, and bandits. On the Lord’s highway, none of those dangers can reach the travelers.

      This doesn’t mean disciples never face danger. It means the way itself is secure. Nothing can separate the redeemed from their destination. Paul said, “neither death, nor life… nor any other creature, shall be able to separate us from the love of God, which is in Christ Jesus our Lord” ([[Rom. 8:38–39]]).
  - ref: 10
    phrase: And the ransomed of the LORD shall return, and come to Zion with songs and everlasting joy upon their heads
    kind: christ
    title: The ransomed return with songs
    body: |
      “Ransomed” (*peduyei*) means redeemed by payment, bought back from slavery or captivity. The same verse appears word for word in [[Isa. 51:11]], as if Isaiah considered it too good to say only once.

      “Everlasting joy upon their heads” may picture joy worn like a crown or garland. And “sorrow and sighing shall flee away”: sorrow doesn’t just fade. It runs away.

      The Lord used this language repeatedly in modern revelation for the gathering to Zion: the Saints will “come to Zion, singing with songs of everlasting joy” ([[D&C 45:71]]), and the scattered will “return and come to their inheritances… with songs of everlasting joy” ([[D&C 101:18]]; see [[D&C 66:11]]). Jesus Christ is the one who paid the ransom ([[Matt. 20:28]]; [[1 Tim. 2:6]]).

christ: |
  Isaiah 35 centers on verse 4: “your God will come… he will come and save you.” Jesus Christ is that coming God. When John the Baptist asked if He was the one, Jesus answered from this chapter: the blind see, the lame walk, the deaf hear ([[Matt. 11:2–5]]). He is the **living water** that makes the desert bloom ([[John 4:14]]), the **Way** of holiness ([[John 14:6]]), and the one who paid the **ransom** for the redeemed who come to Zion singing (verse 10; [[Matt. 20:28]]).

  Every transformation in this chapter, of land, body, and journey, is what He does wherever He comes.

explore: |
  - **Isaiah 35 and the Gospels.** Read [[Matt. 11:2–6]] and [[Luke 7:18–23]]. Why did Jesus answer John with this chapter?
  - **Isaiah 35 and D&C 133.** Compare this chapter with [[D&C 133:26–35]]. What does the Doctrine and Covenants add about the return of the lost tribes?
  - **The highway.** Trace the highway through [[Isa. 11:16]], [[Isa. 19:23]], [[Isa. 35:8]], [[Isa. 40:3–4]], [[Isa. 49:11]], [[Isa. 57:14]], and [[Isa. 62:10]].

parallels:
