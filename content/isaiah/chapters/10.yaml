chapter: 10
title: The Axe That Boasted
tagline: Assyria is only a tool in the Lord’s hand, a remnant will return, and the proud forest is felled.
when: 'c. 722–701 BC'

setting: |
  The first four verses finish the poem against Israel that began in [[Isa. 9:8]]. Then the focus shifts to **Assyria**, the superpower that had just destroyed Samaria (722 BC) and was eyeing Jerusalem next.

  This is one of the Bible’s most important passages on how God works in history. Assyria was brutal, and its kings recorded their conquests with pride. Their inscriptions boast of flaying rebels, deporting whole populations, and receiving tribute from terrified kings. Isaiah has a startling claim to make about this empire: *it is only a tool, and the Lord is holding it.*

  The chapter ends with a vivid sequence (verses 28–32) of an army marching town by town toward Jerusalem, and then a sudden felling of the forest. Nephi quoted the chapter as [[2 Ne. 20]].

thread: |
  Isaiah 10 answers a question that troubled Israel and still troubles believers: **How can God use wicked nations, and what happens to them afterward?**

  The answer comes in a single, unforgettable image: “Shall the axe boast itself against him that heweth therewith?” (verse 15).

  The Lord calls Assyria “the rod of mine anger” (verse 5). He is sending it to discipline a “hypocritical nation,” His own people. But Assyria doesn’t know it’s a rod. “He meaneth not so” (verse 7). In Assyria’s mind, its victories are its own: “By the strength of my hand I have done it, and by my wisdom” (verse 13). It lines up its conquests like trophies and assumes Jerusalem will be next (verses 8–11). It gathers nations the way a boy gathers eggs from an abandoned nest, and “none… peeped” (verse 14).

  So the tool will be broken once its work is done (verse 12). The axe that thought it was the woodsman will itself be cut down. The chapter ends with the Lord lopping the proud forest of Assyria “with terror,” so that Lebanon falls (verses 33–34).

  In between, Isaiah plants a seed of hope. A remnant of Israel will return, not to Assyria, the power that struck them, but “unto the mighty God” (verse 21). That is the same title given to the child in [[Isa. 9:6]].

  And the fallen forest sets up the next chapter perfectly. Assyria’s forest will never regrow. But from the cut-down stump of Jesse, a rod will sprout ([[Isa. 11:1]]).

sections:
  - range: 1-4
    heading: Woe to those who write unjust laws
    plain: |
      Woe to those who make unjust laws and write oppressive decrees to deprive the poor of justice, rob My people’s needy of their rights, prey on widows, and plunder orphans. What will you do on the day of reckoning, when disaster comes from far away? Who will you run to for help? Where will you leave your wealth? You will crouch among the prisoners or fall among the dead. Even so, His hand is still stretched out.
  - range: 5-19
    heading: The rod that thinks it is the hand
    plain: |
      Woe to Assyria, the rod of My anger and the club of My wrath! I send it against a godless nation to plunder it and trample it like mud in the streets. But that’s not what Assyria intends. It only wants to destroy nations. It boasts, “Aren’t my commanders all kings? Didn’t Calno, Hamath, and Samaria fall like Carchemish, Arpad, and Damascus? I conquered kingdoms whose idols were greater than Jerusalem’s. I’ll do to Jerusalem what I did to Samaria.” When the Lord has finished His work on Mount Zion, He will punish the arrogant king of Assyria, who says, “I did this by my own strength and wisdom. I erased borders and plundered treasures. I gathered the wealth of nations like eggs from a nest, and no one flapped a wing or chirped.” Does the axe boast over the one who swings it? Does the saw brag against the one who uses it? As if a stick could lift the person holding it! So the Lord will send a wasting disease on Assyria’s strong warriors. The Light of Israel will become a fire and His Holy One a flame, and in one day it will burn up Assyria’s thorns and briers and the glory of its forests and fields. So few trees will be left that a child could count them.
  - range: 20-27
    heading: A remnant shall return to the mighty God
    plain: |
      In that day the remnant of Israel will no longer lean on the power that struck them. They will truly lean on the Lord, the Holy One of Israel. A remnant will return, a remnant of Jacob, to the Mighty God. Though Israel is as numerous as the sand of the sea, only a remnant will return. The destruction has been decided, overflowing with justice. So the Lord says: My people in Zion, don’t be afraid of Assyria, though it beats you as Egypt did. In a very little while My anger will end and turn against Assyria. I will strike it as I struck Midian at the rock of Oreb and as I raised My staff over the sea against Egypt. In that day its burden will be lifted from your shoulder and its yoke from your neck; the yoke will be broken because of the anointing.
  - range: 28-34
    heading: The march on Jerusalem, and the felling of the forest
    plain: |
      The invader has reached Aiath, passed through Migron, and stored his supplies at Michmash. He crosses the pass and camps at Geba. Ramah trembles; Gibeah of Saul runs away. Cry out, Gallim! Listen, Laish! Poor Anathoth! Madmenah is fleeing; Gebim’s people are taking cover. Today he stops at Nob and shakes his fist at Mount Zion, at the hill of Jerusalem. But look! The Lord of hosts will lop off the branches with terrifying power. The tallest trees will be cut down, the lofty brought low. He will cut down the forest thickets with an axe, and Lebanon will fall before the Mighty One.

notes:
  - ref: 1
    phrase: Woe unto them that decree unrighteous decrees
    kind: liken
    title: Legalized injustice
    body: |
      This woe targets a particular kind of sin: injustice made **legal**. The leaders aren’t just breaking the law; they are writing laws and official decrees (“grievousness which they have prescribed”) that strip the poor, widows, and orphans of their rights.

      It’s a reminder that something can be legal and still be wicked in God’s eyes. The Book of Mormon describes the same danger when “the voice of the people” chooses iniquity ([[Mosiah 29:26–27]]; [[Hel. 5:2]]). The question in verse 3 is chilling: “where will ye leave your glory?” Wealth built by exploiting others has nowhere to hide on the day of reckoning.
  - ref: 5
    phrase: O Assyrian, the rod of mine anger
    kind: history
    title: The rod of God’s anger
    body: |
      “O” here is really “Woe!” (*hoy*), the same word that opens the woes of chapter 5. It is shocking to hear the Lord say “woe” to the very instrument He is using, but that is the heart of the chapter. Assyria is *His* rod, and Assyria is *still* accountable.

      Assyrian kings described their campaigns in ruthless detail, and their palace reliefs show deportations and the siege of Judean cities like Lachish. To Isaiah’s audience, Assyria looked like an unstoppable force. Isaiah insists it was a stick in the hand of the God of Israel, and that the stick had limits.
    sources: [bd-assyria]
  - ref: 7
    phrase: Howbeit he meaneth not so, neither doth his heart think so
    kind: liken
    title: Instruments who don’t know it
    body: |
      This is one of the most important theological lines in Isaiah. Assyria is doing God’s work of discipline, but it has no idea. Its motives are purely its own: conquest, plunder, glory. God can use people for His purposes without their knowledge or consent, and without approving of their motives.

      The same idea appears with Joseph’s brothers (“ye thought evil against me; but God meant it unto good,” [[Gen. 50:20]]) and with Cyrus, whom God calls “though thou hast not known me” ([[Isa. 45:4]]). It is a comfort when evil seems to be winning. Even when wicked people seem to control events, they do not control the outcome. It is also a warning. Being used by God is not the same as pleasing God.
  - ref: 9
    phrase: Is not Calno as Carchemish? is not Hamath as Arpad? is not Samaria as Damascus?
    kind: history
    title: Assyria’s trophy list
    body: |
      This is Assyria bragging, and every city named is real. They were a line of conquests stretching southwest from the Euphrates toward Israel. Assyria had taken **Arpad** (740 BC), **Calno** (738), **Damascus** (732), **Samaria** (722), **Hamath** (720), and **Carchemish** (717). The boast: *each city fell like the one before it. Jerusalem will be no different.*

      Verses 10–11 add a religious taunt. The gods of those cities couldn’t protect them, and some had more impressive idols than Jerusalem. The Assyrian field commander would later make the same argument outside Jerusalem’s walls: “Where are the gods of Hamath and Arphad?” ([[Isa. 36:18–20]]). He didn’t realize he was talking about the living God.
  - ref: 14
    phrase: as one gathereth eggs that are left
    kind: symbol
    title: Gathering eggs from a deserted nest
    body: |
      The Assyrian boast is vivid: conquering nations was as easy as collecting eggs from a nest after the mother bird has fled. No one flapped a wing, opened a beak, or chirped.

      There is a delicious irony here if you know the historical record. In his own inscription about the 701 BC campaign, Sennacherib boasted that he shut Hezekiah up in Jerusalem “like a bird in a cage.” But he never took the cage. The Lord defended Jerusalem ([[Isa. 37:33–37]]). One bird, at least, the Assyrian could not gather.
    sources: [taylor-prism, luckenbill-annals]
  - ref: 15
    phrase: Shall the axe boast itself against him that heweth therewith?
    kind: liken
    title: The axe that boasted
    body: |
      This is the chapter’s central image, and it is gently comic. Picture an axe bragging about all the trees *it* has cut down, or a saw showing off to the carpenter, or a walking stick trying to lift the person holding it. Assyria took credit for work that was God’s.

      The principle applies to every talent and success we have. The Lord told Joseph Smith that “it is not the work of God that is frustrated, but the work of men,” and that a man who “boasts in his own strength” will fall ([[D&C 3:4]]). Ammon rejoiced in his missionary success but was careful to say, “I do not boast in my own strength… but I will boast of my God” ([[Alma 26:11–12]]). Tools that remember they are tools can do great things.
  - ref: 17
    phrase: the light of Israel shall be for a fire, and his Holy One for a flame
    kind: christ
    title: The Light becomes a fire
    body: |
      The same Lord who is Israel’s **light** becomes a devouring **fire** to Assyria. It is a paradox Isaiah returns to often. God’s holiness is warmth and illumination to those who love Him and consuming fire to those who oppose Him ([[Isa. 33:14–15]]; [[Heb. 12:29]]). The difference is not in Him but in what He encounters.

      The fulfillment came in 701 BC, when “the angel of the LORD went forth, and smote in the camp of the Assyrians a hundred and fourscore and five thousand” in a single night ([[Isa. 37:36]]). “In one day,” as verse 17 says.
  - ref: 20
    phrase: shall no more again stay upon him that smote them
    kind: words
    title: Leaning on the wrong support
    body: |
      “Stay upon” means *lean on*, the same idea as the “stay and staff” of [[Isa. 3:1]]. Here is the irony of the whole Assyrian crisis. King Ahaz had leaned on Assyria for protection ([[2 Kgs. 16:7–9]]), and Assyria became the power that struck Judah.

      The remnant will have learned the lesson. They will lean on the Lord “in truth,” that is, faithfully and reliably. We often have to be struck by the thing we were leaning on before we learn to lean on the Lord.
  - ref: 21
    phrase: The remnant shall return, even the remnant of Jacob, unto the mighty God
    kind: christ
    title: Shear-jashub, fulfilled
    body: |
      “The remnant shall return” in Hebrew is *sheʾar yashuv*, exactly the name of Isaiah’s son **Shear-jashub** ([[Isa. 7:3]]). The boy’s name has now become a full prophecy, and the verse spells out both sides of it. Only a remnant will return, so judgment is real. And a remnant *will* return, so hope is real.

      Notice where they return: “unto **the mighty God**” (*ʾel gibbor*). That is exactly the title given to the child in [[Isa. 9:6]]. The remnant returns to the Child-King who is God. Paul quoted verses 22–23 to explain why only some of Israel accepted Christ ([[Rom. 9:27–28]]). In the last days the Book of Mormon promises that the remnant of Jacob will again come to know their Redeemer ([[3 Ne. 5:23–26]]; [[3 Ne. 20:13]]).
  - ref: 26
    phrase: according to the slaughter of Midian at the rock of Oreb
    kind: history
    title: Remembering past deliverances
    body: |
      Isaiah reaches back to two great moments of deliverance. At the **rock of Oreb**, Gideon’s men killed the Midianite prince Oreb after the Lord routed Midian’s army ([[Judg. 7:25]]; see [[Isa. 9:4]]). At the **Red Sea**, Moses lifted his rod over the waters and Egypt’s army drowned ([[Ex. 14:16–28]]).

      The pattern is deliberate. When facing a new enemy, remember what God has already done. Memory is one of faith’s greatest supports. That is why the Book of Mormon so often begins with *remember* ([[Mosiah 27:16]]; [[Alma 36:2]]; [[Hel. 5:6–12]]).
  - ref: 27
    phrase: the yoke shall be destroyed because of the anointing
    kind: words
    title: A difficult line
    body: |
      The Hebrew of this line is notoriously difficult. The word translated “anointing” (*shemen*) usually means **oil** or **fatness**. Some scholars understand it to mean the yoke will break because the ox has grown too fat and strong for it. Others amend the text slightly to refer to a place name.

      The King James translators chose “anointing,” and many readers have seen in it a reference to *the Anointed One*, the Messiah (*mashiach*), who breaks the yoke of oppression ([[Luke 4:18]]; see [[Isa. 9:4]]). That reading fits the flow of Isaiah 9–11 beautifully. It is a reasonable application, but we should hold it lightly since the Hebrew is uncertain.
    sources: [oswalt, blenkinsopp]
  - ref: 28
    phrase: He is come to Aiath, he is passed to Migron
    kind: history
    title: A march in slow motion
    body: |
      Verses 28–32 are like a film sequence: an invading army advances town by town from the north toward Jerusalem. Aiath (Ai), Migron, Michmash, Geba, Ramah, Gibeah, Gallim, Laish, Anathoth, Madmenah, Gebim, and finally **Nob**, a hill just north of Jerusalem with a view of the city. Each place name is closer than the last. The pace quickens and panic spreads.

      Then the army halts at Nob and shakes its fist at Mount Zion (verse 32). It’s the closest it will get. In the very next breath, the Lord steps in (verses 33–34). Some of the towns are real places near Jerusalem that you can locate on a map today.
  - ref: 33
    phrase: the high ones of stature shall be hewn down
    kind: symbol
    title: The forest is felled, and a stump is left
    body: |
      Assyria, which boasted of being the axe (verse 15), is now the forest, and the Lord is the woodsman. The tallest trees crash down, and “Lebanon” (the great cedar forest, a symbol of pride) falls.

      Read the next verse, [[Isa. 11:1]], without the chapter break: “And there shall come forth a rod out of the stem of Jesse.” Assyria’s forest is cut down forever. The royal house of David, reduced by Ahaz’s faithlessness to a mere stump, will sprout again. Isaiah sets two fallen trees side by side: one proud and finished, one humble and full of life.

christ: |
  Two titles in chapters 9–10 belong together. In [[Isa. 9:6]] the child is called “**The mighty God**.” In [[Isa. 10:21]] the remnant returns to “**the mighty God**.” For Latter-day Saints, both point to Jesus Christ, the Jehovah of the Old Testament, who would be born as the child of promise.

  The chapter also shows Christ as the **Light of Israel** (verse 17), warmth to His people and fire to their oppressors. And it sets up the image of the stump in [[Isa. 11:1]]. When every proud tree is cut down, the Lord’s Anointed grows from what looked dead. The one who breaks the yoke “because of the anointing” (verse 27) is the Anointed One Himself.

liken: |
  - In what areas of my life am I like the axe, tempted to take credit for what God has done through me? How can I “boast of my God” instead ([[Alma 26:12]])?
  - Is there someone or something I’ve been leaning on (verse 20) that has turned out to strike me? What would it mean to lean on the Lord “in truth”?
  - When an “army” seems to march closer and closer (verses 28–32), what past deliverances can I remember, my own “day of Midian” or “rock of Oreb”?
  - Can I trust that even people who hurt me, who “mean not so,” are not beyond the Lord’s ability to limit and redeem?

explore: |
  - **God and the nations.** Compare how God uses Assyria in Isaiah 10 with how He uses Cyrus in [[Isa. 44:28–45:7]]. What’s similar? What’s different about Cyrus?
  - **The remnant.** Trace the remnant through [[Isa. 1:9]], [[Isa. 4:2–3]], [[Isa. 6:13]], [[Isa. 7:3]], [[Isa. 10:20–22]], and [[Isa. 11:11–16]]. How does the promise grow?
  - **The deliverance.** Read the fulfillment in [[Isa. 36–37]] (or [[2 Kgs. 18–19]]). Which details of chapter 10 come true?

