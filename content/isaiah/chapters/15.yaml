chapter: 15
title: A Prophet Weeps for His Enemy
tagline: Moab’s cities fall in a single night, and Israel’s prophet cannot help crying for them.
when: 'During Isaiah’s ministry, in the reigns of Uzziah through Hezekiah'

setting: |
  Chapters 15 and 16 form a single oracle against **Moab**, the kingdom east of the Dead Sea. The Moabites were Israel’s relatives, descended from Abraham’s nephew Lot ([[Gen. 19:36–37]]), and they were often Israel’s rivals. In the days of the judges they oppressed Israel ([[Judg. 3:12–30]]). King David’s great-grandmother Ruth was a Moabite ([[Ruth 4:13–17]]).

  The oracle is full of place names, but the chapter does not need a map to be read. Most of them mark where the wailing is heard, from Heshbon in the north to Zoar in the south. Earlier, King Mesha of Moab had rebelled against Israel ([[2 Kgs. 3:4–5]]).

  The text does not name the invader, and the date within Isaiah’s ministry is uncertain. What is unmistakable is the tone.

thread: |
  What makes Isaiah 15 remarkable is not the destruction it describes, but **who is weeping over it**.

  The chapter is a lament. Moab’s cities fall “in the night” and are “brought to silence” (verse 1). People climb to their shrines to weep, shave their heads and beards in mourning, and put on sackcloth. Every rooftop and street is full of wailing (verses 2–4). Refugees flee south toward Zoar, carrying what little they can grab, and the waters run red (verses 5–9).

  And in the middle of it Isaiah says: “**My heart shall cry out for Moab**” (verse 5). In the next chapter he will say it again: “I will water thee with my tears” ([[Isa. 16:9]]), and “my bowels shall sound like an harp for Moab” ([[Isa. 16:11]]).

  This is a prophet grieving for a nation that was not his own and was often hostile to his own people. He pronounces judgment, but he does not gloat. Mormon, watching his own people destroyed, wrote in the same spirit: “my soul was rent with anguish” ([[Morm. 6:16–22]]).

sections:
  - range: 1-4
    heading: Moab silenced in a night
    plain: |
      This is the oracle about Moab. In one night the city of Ar is destroyed and silenced; in one night Kir is destroyed and silenced. The people go up to the temple and to Dibon, to the hilltop shrines, to weep. Moab wails over Nebo and Medeba. Every head is shaved and every beard cut off in mourning. People wear sackcloth in the streets and wail on the rooftops. Heshbon and Elealeh cry out, heard as far as Jahaz. Even Moab’s soldiers cry out in anguish.
  - range: 5-9
    heading: Refugees on the road
    plain: |
      My heart cries out for Moab! Its refugees flee as far as Zoar and Eglath-shelishiyah. They climb the road to Luhith weeping and raise a cry of destruction on the road to Horonaim. The waters of Nimrim have dried up, the grass is withered, and nothing green is left. So they carry their savings and possessions across the Brook of the Willows. The cry echoes across Moab’s borders to Eglaim and Beer-elim. The waters of Dimon are full of blood, and I will bring even more on Dimon: lions for the survivors of Moab and those left in the land.

notes:
  - ref: 1
    phrase: in the night Ar of Moab is laid waste, and brought to silence
    kind: history
    title: Silenced in a night
    body: |
      **Ar** and **Kir** are named as the two pillars of Moab’s strength: Ar was the capital, Kir its chief fortress. The repetition, “in the night… laid waste, and brought to silence,” twice over, gives the impression of a sudden, total collapse. The prophet seems unable to look away.

      Isaiah describes the same kind of suddenness for the enemy at Jerusalem: “at eveningtide trouble; and before the morning he is not” ([[Isa. 17:14]]; see [[Isa. 37:36]]).
    sources: [delitzsch, lds-scriptures]
  - ref: 2
    phrase: He is gone up to Bajith, and to Dibon, the high places, to weep
    kind: history
    title: Bajith, Dibon, and the high places
    body: |
      “Bajith” means *the house*, here the temple, and **Dibon** was a Moabite city with consecrated heights nearby (compare [[Josh. 13:17]]). The temple is the sanctuary of Moab’s god **Chemosh**, and the people climb to it and to the hilltops to weep. Moab had once rendered the king of Israel a hundred thousand lambs in tribute ([[2 Kgs. 3:4]]); now its own sanctuaries are where it goes to mourn.

      Isaiah expects no help from those high places: “when it is seen that Moab is weary on the high place… he shall not prevail” ([[Isa. 16:12]]).
    sources: [delitzsch, lds-scriptures]
  - ref: 2
    phrase: on all their heads shall be baldness, and every beard cut off
    kind: symbol
    title: Signs of mourning
    body: |
      Shaving the head, cutting off the beard, wearing sackcloth, and wailing on rooftops are the signs of mourning here; Jeremiah’s oracle against Moab lists the same signs ([[Jer. 48:37–38]]). Isaiah paints a whole nation in mourning.

      Jeremiah’s oracle shares much of its wording with this one: compare [[Isa. 15:5]] with [[Jer. 48:5]], and [[Isa. 15:4–6]] with [[Jer. 48:34]].
    sources: [delitzsch, lds-scriptures]
  - ref: 5
    phrase: My heart shall cry out for Moab
    kind: scripture
    title: A prophet who weeps for his enemies
    body: |
      Isaiah, a prophet of Judah, grieves here for Moab, which was often Judah’s rival. He will say it again even more strongly in the next chapter ([[Isa. 16:9–11]]).

      The Lord’s judgments are never cause for celebration. The Lord told Ezekiel, “I have no pleasure in the death of the wicked; but that the wicked turn from his way and live” ([[Ezek. 33:11]]). Jesus wept over Jerusalem as He foretold its destruction ([[Luke 19:41–44]]). The Book of Mormon records that when the Nephites killed many Lamanites, there was “a great mourning and lamentation” ([[Alma 28:4–6]]).
    sources: [delitzsch, bd-moab, lds-scriptures]
  - ref: 5
    phrase: his fugitives shall flee unto Zoar
    kind: history
    title: Fleeing to Zoar, again
    body: |
      **Zoar** lay at the south-western end of the Dead Sea and was Moab’s farthest fortress toward Judah. It is the very town Lot fled to when Sodom and Gomorrah were destroyed ([[Gen. 19:20–23]]), and Lot was Moab’s ancestor. So Moab’s refugees are retracing their forefather’s flight.

      The KJV’s “an heifer of three years old” translates the Hebrew words literally. Some modern translations read them as a place name, *Eglath-shelishiyah*, as the plain-words paraphrase above does; others take them as a description of Zoar (or of Moab) as young and strong. The Hebrew is hard, and the verse’s meaning does not hang on it.
    sources: [delitzsch, nrsv, lds-scriptures]
  - ref: 7
    phrase: that which they have laid up, shall they carry away to the brook of the willows
    kind: history
    title: What refugees carry
    body: |
      The “brook of the willows” was probably a stream flowing down to the Dead Sea from Moab’s southern highlands, and across it lay the road to Edom. The Moabites flee over it with their savings in their arms.

      Isaiah doesn’t mock them; he describes them with sympathy. In the next chapter the Lord asks Judah to shelter Moab’s refugees ([[Isa. 16:3–4]]).
    sources: [delitzsch, lds-scriptures]
  - ref: 9
    phrase: the waters of Dimon shall be full of blood
    kind: words
    title: A grim wordplay
    body: |
      *Dimon* is almost certainly Dibon (verse 2), spelled with an *m* to make a pun: *dam* is the Hebrew word for **blood**. “The waters of Dimon shall be full of *dam*.”

      “Lions upon him that escapeth” means that even those who survive the invasion will face further judgment. The grief of verse 5 does not cancel the judgment.
    sources: [delitzsch]

christ: |
  Isaiah’s weeping over a nation that was often hostile to his own can be read beside Christ’s weeping over Jerusalem before its people rejected and crucified Him ([[Luke 19:41–44]]; [[Matt. 23:37]]).

  Moab also has a place in the Savior’s own family. Ruth, a Moabite woman who chose Israel’s God, became the great-grandmother of David and an ancestor of Jesus ([[Ruth 4:13–17]]; [[Matt. 1:5]]). The nation Isaiah mourns over is part of the Savior’s lineage.

explore: |
  - **Isaiah and Jeremiah on Moab.** Compare Isaiah 15–16 with [[Jer. 48]]. How do the two oracles relate?
  - **Ruth the Moabitess.** Read the book of Ruth. How does her story complicate a simple view of Moab as “the enemy”?
  - **Prophets who weep.** Look at [[Jer. 9:1]], [[Luke 19:41–44]], [[Moses 7:28–41]], and [[Morm. 6:16–22]]. Why do prophets weep over the judgments they announce?

parallels:
  - ref: Jer. 48
    note: Jeremiah’s oracle against Moab shares much of its wording with Isaiah 15–16.

sources: [bd-moab, delitzsch, nrsv, lds-scriptures]
