chapter: 15
title: A Prophet Weeps for His Enemy
tagline: Moab’s cities fall in a single night, and Israel’s prophet cannot help crying for them.
when: 'Probably late 700s BC, during Assyria’s campaigns in the region'

setting: |
  Chapters 15 and 16 form a single oracle against **Moab**, the kingdom east of the Dead Sea. The Moabites were Israel’s relatives, descended from Abraham’s nephew Lot ([[Gen. 19:36–37]]), and they were often Israel’s rivals. In the days of the judges they oppressed Israel ([[Judg. 3:12–30]]). King David was part Moabite through his great-grandmother Ruth ([[Ruth 4:13–17]]), which means Jesus had a Moabite ancestor ([[Matt. 1:5]]).

  The oracle is full of place names, many of them known from archaeology. The most famous discovery is the **Mesha Stele** (the “Moabite Stone”), found at Dibon in 1868. On it King Mesha of Moab boasts of throwing off Israel’s rule in the 800s BC, the same events described from Israel’s side in [[2 Kgs. 3:4–27]]. It is one of the most important inscriptions ever found for Old Testament history.

  The exact date and invader behind Isaiah 15 are uncertain. Assyria, or desert raiders, swept through Moab more than once in Isaiah’s lifetime. What is unmistakable is the tone.

thread: |
  What makes Isaiah 15 remarkable is not the destruction it describes, but **who is weeping over it**.

  The chapter is a lament. Moab’s cities fall “in the night” and are “brought to silence” (verse 1). People climb to their shrines to weep, shave their heads and beards in mourning, and put on sackcloth. Every rooftop and street is full of wailing (verses 2–4). Refugees flee south toward Zoar, carrying what little they can grab, and the streams run red (verses 5–9).

  And in the middle of it Isaiah says: “**My heart shall cry out for Moab**” (verse 5). In the next chapter he will say it again: “I will water thee with my tears” ([[Isa. 16:9]]), and “my bowels shall sound like an harp for Moab” ([[Isa. 16:11]]).

  This is a prophet grieving for a nation that was not his own and was often hostile to his own people. He pronounces judgment, but he does not gloat. That tells us something essential about how God’s messengers are meant to speak of judgment, and about the God who sends them: “I have no pleasure in the death of the wicked,” He says ([[Ezek. 33:11]]). Mormon, watching his own people destroyed, wrote in the same spirit: “my soul was rent with anguish” ([[Morm. 6:16–22]]).

sections:
  - range: 1-4
    heading: Moab silenced in a night
    plain: |
      This is the oracle about Moab. In one night the city of Ar is destroyed and silenced; in one night Kir is destroyed and silenced. The people go up to their temple at Dibon and to their hilltop shrines to weep. Moab wails over Nebo and Medeba. Every head is shaved and every beard cut off in mourning. People wear sackcloth in the streets and wail on the rooftops. Heshbon and Elealeh cry out, heard as far as Jahaz. Even Moab’s soldiers cry out, trembling.
  - range: 5-9
    heading: Refugees on the road
    plain: |
      My heart cries out for Moab! Its refugees flee as far as Zoar and Eglath-shelishiyah. They climb the road to Luhith weeping and raise a cry of destruction on the road to Horonaim. The waters of Nimrim have dried up, the grass is withered, and nothing green is left. So they carry their savings and possessions across the Brook of the Willows. The cry echoes across Moab’s borders to Eglaim and Beer-elim. The waters of Dimon are full of blood, and I will bring even more on Dimon: a lion for the survivors of Moab and those left in the land.

notes:
  - ref: 1
    phrase: in the night Ar of Moab is laid waste, and brought to silence
    kind: history
    title: Silenced in a night
    body: |
      **Ar** and **Kir** (probably Kir-hareseth, the capital; see [[Isa. 16:7]]) were Moab’s chief cities. The repetition, “in the night… laid waste, and brought to silence,” twice over, gives the impression of a sudden, total collapse. A thriving city goes to bed and by morning is silent.

      Isaiah describes the same kind of suddenness for Assyria’s army at Jerusalem: “at eveningtide trouble; and before the morning he is not” ([[Isa. 17:14]]; see [[Isa. 37:36]]).
    sources: [bd-moab]
  - ref: 2
    phrase: He is gone up to Bajith, and to Dibon, the high places, to weep
    kind: history
    title: Dibon and the Moabite Stone
    body: |
      “Bajith” means *the house* (the temple), and **Dibon** was a major Moabite city. In 1868 a missionary found a black basalt stone at Dibon inscribed by **King Mesha** of Moab in the 800s BC. The inscription describes Mesha throwing off Israel’s control after the death of King Ahab, credits the victory to Moab’s god **Chemosh**, and mentions Israel’s God by name (*YHWH*). It corresponds closely to [[2 Kgs. 3:4–5]], which says Mesha had paid Israel a tribute of a hundred thousand lambs before rebelling.

      So when Isaiah describes Moabites climbing to their high places at Dibon to weep, he is describing the very shrines where Chemosh was honored for Moab’s past victories. Now Chemosh cannot help them (see [[Isa. 16:12]]).
  - ref: 2
    phrase: on all their heads shall be baldness, and every beard cut off
    kind: symbol
    title: Signs of mourning
    body: |
      Shaving the head, cutting off the beard, wearing sackcloth (coarse goat-hair cloth), and wailing on rooftops were standard ways of mourning in the ancient Near East ([[Jer. 48:37–38]]). Isaiah paints a whole nation in mourning, as though every family had lost someone.

      It is worth noting that Jeremiah later took up much of Isaiah’s oracle against Moab, sometimes word for word, and adapted it for his own day ([[Jer. 48]]).
  - ref: 5
    phrase: My heart shall cry out for Moab
    kind: scripture
    title: A prophet who weeps for his enemies
    body: |
      This is the most important line in the chapter. Isaiah was a prophet of Judah, and Moab was often Judah’s enemy. Yet his heart cries out for them. He will say it again even more strongly in the next chapter ([[Isa. 16:9–11]]).

      The Lord’s judgments are never cause for celebration among His people. The Lord told Ezekiel, “I have no pleasure in the death of the wicked; but that the wicked turn from his way and live” ([[Ezek. 33:11]]). Jesus wept over Jerusalem as He foretold its destruction ([[Luke 19:41–44]]). The Book of Mormon records that when the Nephites killed many Lamanites, there was “a great mourning and lamentation” ([[Alma 28:4–6]]).

      How we speak about the downfall of people we disagree with says a great deal about whether we have the Lord’s heart.
  - ref: 5
    phrase: his fugitives shall flee unto Zoar
    kind: history
    title: Fleeing to Zoar, again
    body: |
      **Zoar** was a small town at the southern end of the Dead Sea. It is the very place Lot fled to when Sodom and Gomorrah were destroyed ([[Gen. 19:20–23]]), and Lot was Moab’s ancestor. So Moab’s refugees are retracing their forefather’s flight, running from destruction to the same little town.

      The phrase “an heifer of three years old” is probably a place name, *Eglath-shelishiyah*, rather than a comparison. The KJV translators rendered the Hebrew words literally.
  - ref: 7
    phrase: that which they have laid up, shall they carry away to the brook of the willows
    kind: history
    title: What refugees carry
    body: |
      Refugees carry what they can. The “brook of the willows” was probably a stream on Moab’s southern border (perhaps the Zered). The Moabites flee across it with their savings in their arms.

      It is a timeless image of displacement. Even today, millions of people carry their lives across borders in bags. Isaiah doesn’t mock them; he describes them with sympathy. In the next chapter the Lord will ask Judah to shelter Moab’s refugees ([[Isa. 16:3–4]]). Latter-day Saints have been counseled to care for refugees too, remembering that the Church itself was once a people forced from their homes ([[D&C 101:1–3]]; [[D&C 136:1–11]]).
  - ref: 9
    phrase: the waters of Dimon shall be full of blood
    kind: words
    title: A grim wordplay
    body: |
      *Dimon* is almost certainly Dibon (verse 2), spelled with an *m* to make a pun: *dam* is the Hebrew word for **blood**. “The waters of Dimon shall be full of *dam*.” Isaiah frequently plays on the sounds of place names this way.

      “Lions upon him that escapeth” means that even those who survive the invasion will face further dangers. The grief of verse 5 is balanced by the reality that judgment is real.

christ: |
  In Isaiah 15 we see the heart of Christ in His prophet. Isaiah weeps over a nation that was often hostile to his own. Jesus wept over Jerusalem, which was about to reject and crucify Him ([[Luke 19:41–44]]; [[Matt. 23:37]]).

  Moab also has a place in the Savior’s own family. Ruth, a Moabite woman who chose Israel’s God, became the great-grandmother of David and an ancestor of Jesus ([[Ruth 4:13–17]]; [[Matt. 1:5]]). The nation Isaiah mourns over is part of the Savior’s lineage. No people is outside the reach of His redemption.

liken: |
  - How do I talk about people or groups whose wickedness brings consequences on them? Do I share any of Isaiah’s grief, or do I feel a quiet satisfaction?
  - Moab’s refugees carried their savings across the brook. What would I carry if I had to leave everything? What in my life can’t be carried away by any invader?
  - Is there someone I regard as an “enemy” for whom my heart could learn to cry out?

explore: |
  - **Isaiah and Jeremiah on Moab.** Compare Isaiah 15–16 with [[Jer. 48]]. How does Jeremiah reuse and extend Isaiah’s oracle?
  - **Ruth the Moabitess.** Read the book of Ruth. How does her story complicate a simple view of Moab as “the enemy”?
  - **Prophets who weep.** Look at [[Jer. 9:1]], [[Luke 19:41–44]], [[Moses 7:28–41]], and [[Morm. 6:16–22]]. Why do prophets weep over the judgments they announce?

parallels:
  - ref: Jer. 48
    note: Jeremiah’s oracle against Moab borrows heavily from Isaiah 15–16.

sources: [bd-moab, ot-manual-14, oswalt, parry-understanding]
