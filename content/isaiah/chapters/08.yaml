chapter: 8
title: Gentle Waters or a Flood
tagline: A child whose name is a countdown, a people who reject quiet waters, and a prophet who binds up his testimony and waits.
when: 'During the Syro-Ephraimite war, soon after Isaiah 7'

setting: |
  Chapter 8 continues the crisis of chapter 7. Syria and Israel still threaten Judah, and Ahaz has appealed to Assyria for help ([[2 Kgs. 16:7]]). Isaiah’s response is to become a living prophecy. He writes a strange name on a large tablet in front of witnesses, and then his wife, “the prophetess,” bears a son who receives that name: **Maher-shalal-hash-baz**. The name is a countdown clock: before the child can cry “My father” or “My mother,” Assyria will carry off the riches of Damascus and Samaria.

  The second half of the chapter turns inward. Isaiah speaks of binding up his testimony among his disciples and of waiting for the Lord.

  Nephi included the chapter as [[2 Ne. 18]].

thread: |
  Isaiah 8 is a chapter about **what we choose to fear and what we choose to trust**, told through two kinds of water.

  The people have rejected “the waters of Shiloah that go softly” (verse 6). That is a small stream at Jerusalem, an image of the Lord’s quiet help through the house of David. They wanted something more impressive. So the Lord will give them “the waters of the river, strong and many”: the Euphrates, meaning Assyria. It will flood Judah up to the neck (verses 7–8). If we refuse gentle waters, we may get a flood.

  Then the Lord gives Isaiah private instruction (verses 11–15). *Don’t be swept up in what everyone else fears. Don’t call everything a conspiracy. Fear the Lord instead, and He will be your sanctuary.* The same Lord who shelters those who trust Him becomes “a stone of stumbling” to those who don’t.

  Finally, Isaiah binds up his testimony among his disciples and waits (verses 16–18) for a God who, for now, “hideth his face.” He and his children are living signs of that hope. And when people advise consulting mediums and the dead instead, he points them back: “To the law and to the testimony” (verses 19–20).

  The chapter ends in deep darkness, but that is only because Isaiah is about to turn on the light. Chapter 9 begins: “The people that walked in darkness have seen a great light.”

sections:
  - range: 1-4
    heading: A name that is a countdown
    plain: |
      The Lord told me to take a large tablet and write on it in ordinary letters: “Maher-shalal-hash-baz” (“Quick to the plunder, swift to the spoil”). I had two reliable witnesses, Uriah the priest and Zechariah, certify it. Then my wife the prophetess conceived and had a son, and the Lord said, “Name him Maher-shalal-hash-baz. Before he can say ‘Daddy’ or ‘Mommy,’ the king of Assyria will carry off the wealth of Damascus and the plunder of Samaria.”
  - range: 5-10
    heading: Gentle waters or a flood
    plain: |
      The Lord said: “Because these people have rejected the gently flowing waters of Shiloah and rejoice over Rezin and Remaliah’s son, I will bring on them the mighty flood of the Euphrates, the king of Assyria with all his army. It will overflow its banks and sweep through Judah until it reaches the neck. Its outstretched wings will cover your whole land, O Immanuel.” Band together, you nations, and you will be shattered! Make your plans, and they will fail. Give your orders, and they will not stand, for God is with us.
  - range: 11-15
    heading: Fear the Lord, not what others fear
    plain: |
      The Lord took hold of me firmly and warned me not to follow these people: “Don’t call everything a conspiracy just because they do. Don’t fear what they fear or be terrified. The Lord of hosts is the one you must regard as holy. Let Him be the one you fear. He will be a sanctuary, but for both kingdoms of Israel He will be a stone that trips them and a rock that makes them fall, a trap and a snare for Jerusalem. Many will stumble over it, fall, be broken, snared, and captured.”
  - range: 16-22
    heading: Seal the testimony and wait
    plain: |
      Tie up this testimony and seal the teaching among my disciples. I will wait for the Lord, who is hiding His face from Jacob’s people, and I will put my hope in Him. Here I am, with the children the Lord has given me, as signs and warnings in Israel. When people tell you to consult mediums and spiritists who whisper and mutter, answer: Shouldn’t people consult their God? Why ask the dead on behalf of the living? Go to the law and the testimony! If they don’t speak according to this word, there is no dawn for them. They will wander, hungry and distressed, cursing their king and their God. Whether they look up or down, they will see only distress, darkness, and gloom.

notes:
  - ref: 1
    phrase: Maher-shalal-hash-baz
    kind: words
    title: A name that is a prophecy
    body: |
      *Maher-shalal-hash-baz* is a Hebrew phrase, roughly “the spoil is quick, the plunder hastens,” and it was designed to be a public prophecy.

      Isaiah was to write it on a large tablet “with a man’s pen,” which is best taken as plain, popular script that anyone could read. At first the words were an announcement of what was coming, not a name; they became a name when the child was born. The witnesses made the writing a public record that the Lord had foreseen the event beforehand, so that when it happened people would know it was fulfillment ([[Isa. 8:2]]). Before the boy could say “my father” or “my mother” (verse 4), Assyria had taken Damascus and carried off captives from northern Israel ([[2 Kgs. 15:29]]; [[2 Kgs. 16:9]]).
    sources: [delitzsch, biblehub-interlinear, lds-scriptures]
  - ref: 2
    phrase: Uriah the priest
    kind: history
    title: An ironic witness
    body: |
      Isaiah chose two witnesses of standing, so that the writing would later stand as a public record. The law required two or three witnesses to establish a matter ([[Deut. 19:15]]; [[2 Cor. 13:1]]; [[D&C 6:28]]).

      One of them, Uriah (or Urijah) the priest, is very probably the same priest who later obeyed Ahaz’s order to build a copy of a Damascus altar for the temple ([[2 Kgs. 16:10–16]]). A man who would cooperate with the king’s program was no partisan of Isaiah’s, which would make his testimony harder to dismiss. That last step is an inference from the two texts.
    sources: [delitzsch, lds-scriptures]
  - ref: 3
    phrase: I went unto the prophetess
    kind: history
    title: Isaiah’s family
    body: |
      “The prophetess” is Isaiah’s wife. She may have been called that simply as a prophet’s wife, or because she herself had the gift of prophecy, like Miriam, Deborah, and Huldah ([[Ex. 15:20]]; [[Judg. 4:4]]; [[2 Kgs. 22:14]]); one commentary takes the second view. Scripture doesn’t tell us more.

      Isaiah’s whole family took part in his ministry. Both sons had names that carried a message (Shear-jashub, whose name points to a remnant, and Maher-shalal-hash-baz), and Isaiah says his children were “for signs and for wonders in Israel” (verse 18).
    sources: [delitzsch, lds-scriptures]
  - ref: 6
    phrase: the waters of Shiloah that go softly
    kind: symbol
    title: The gentle waters of Shiloah
    body: |
      *Shiloah* (later *Siloam*) was a small, clear stream at the south-eastern side of Jerusalem’s hill, not a mighty river. Later, Hezekiah brought the water of the Gihon into the city ([[2 Kgs. 20:20]]; [[2 Chr. 32:30]]).

      Isaiah uses the stream as a symbol, and one reading takes it to stand for the Davidic monarchy, through which God’s help comes in quiet, unspectacular ways. Judah despised it because it seemed too small in the face of Syria and Israel, and trusted Assyria instead. John records that the pool of Siloam means “Sent” ([[John 9:7]]), where Jesus healed a man born blind. Hearing the Father’s sending of the Son in those waters is a devotional connection, not Isaiah’s own point.
    sources: [delitzsch, lds-scriptures]
  - ref: 7
    phrase: the waters of the river, strong and many, even the king of Assyria
    kind: symbol
    title: The flood they asked for
    body: |
      “The river” here is the Euphrates, and the verse itself says what it stands for: “even the king of Assyria.” Isaiah’s point is simple. If you despise the little stream God provides, He will let you have the river you wanted, and it will drown you.

      Assyria would sweep through Judah “even to the neck” (verse 8). In Hezekiah’s day Sennacherib took the fortified cities of Judah, but Jerusalem, the head, was spared ([[Isa. 36:1]]; [[Isa. 37:36]]). Reading the neck as Jerusalem is a natural reading rather than something the text says.
    sources: [delitzsch, lds-scriptures]
  - ref: 8
    phrase: the stretching out of his wings shall fill the breadth of thy land, O Immanuel
    kind: christ
    title: Immanuel’s land
    body: |
      The flood image continues: the “wings” are the arms of the stream spreading out to fill the land. But look at whose land it is: “thy land, **O Immanuel**.” Even as Assyria overwhelms Judah, the land belongs to the child of promise from [[Isa. 7:14]], and the prophet appeals to him.

      Then verse 10 turns Immanuel’s name into a battle cry: the nations may plot, “for **God is with us**” (*ʿimmanu ʾel*). The name that was a sign to Ahaz becomes a confession of faith for believers. One commentator hears this as pointing to the Savior in person.
    sources: [delitzsch, biblehub-interlinear, lds-scriptures]
  - ref: 12
    phrase: Say ye not, A confederacy
    kind: scripture
    title: Don’t fear what everyone fears
    body: |
      “Confederacy” here (*qesher*) means *conspiracy*. One commentator’s reading is that the people were calling Isaiah’s circle, with their opposition to the Assyrian alliance, a conspiracy; the Lord tells him not to join in that cry or “fear ye their fear.” The older view took it as a warning about the two kings’ plot.

      Instead: “Sanctify the LORD of hosts himself; and let him be your fear” (verse 13). The fear of the Lord displaces the people’s fears. Peter quoted these verses to Christians facing persecution: “be not afraid of their terror… but sanctify the Lord God in your hearts” ([[1 Pet. 3:14–15]]).
    sources: [delitzsch, lds-scriptures]
  - ref: 14
    phrase: he shall be for a sanctuary; but for a stone of stumbling and for a rock of offence
    kind: christ
    title: Sanctuary or stumbling stone
    body: |
      The same Lord is two things to two kinds of people. To those who fear and trust Him, He is a **sanctuary**, a holy refuge. To those who reject Him, He is a **stone** in the road that trips them.

      The New Testament applies this directly to Jesus Christ. Paul and Peter both combine this verse with [[Isa. 28:16]] to show that Christ is the precious cornerstone for believers and “a stone of stumbling, and a rock of offence” to those who disobey ([[Rom. 9:32–33]]; [[1 Pet. 2:6–8]]). Jacob in the Book of Mormon saw the same thing: the Jews would reject “the stone upon which they might build and have safe foundation” ([[Jacob 4:15–17]]).
    sources: [lds-scriptures]
  - ref: 16
    phrase: Bind up the testimony, seal the law among my disciples
    kind: scripture
    title: Binding up the testimony
    body: |
      Isaiah turns to a small circle of **disciples** (Hebrew *limmudim*, the same word as in [[Isa. 50:4]]). The verse can be read as a command to Isaiah or as his own prayer that the Lord would tie up and seal his testimony and teaching in the hearts of those who received it. Either way, the testimony is kept safe like a document tied and sealed, until it is opened by someone qualified.

      The Lord used Isaiah’s language in the last days. He commanded the elders to “bind up the law and seal up the testimony” ([[D&C 88:84]]; see [[D&C 109:38]]; [[D&C 109:46]]) as they went out to prepare the saints for the judgments to come.
    sources: [delitzsch, lds-scriptures]
  - ref: 17
    phrase: I will wait upon the LORD, that hideth his face from the house of Jacob
    kind: words
    title: Waiting on a God who hides His face
    body: |
      Isaiah admits that the Lord is, for now, hiding His face. A time of judgment has begun, but his response is not to give up. He uses two verbs: “wait” (*ḥikkiti*) and “look for” (*qiwwiti*, “I will hope in Him”).

      The second verb, *qavah*, is the one in Isaiah’s most famous promise: “they that **wait** upon the LORD shall renew their strength” ([[Isa. 40:31]]).
    sources: [delitzsch, biblehub-interlinear]
  - ref: 18
    phrase: I and the children whom the LORD hath given me are for signs and for wonders
    kind: christ
    title: Living signs
    body: |
      Isaiah’s own name means “the Lord is salvation.” His sons’ names point to “a remnant” and to “quick to the plunder.” The family itself is a walking sermon: judgment is coming quickly, a remnant will return, and the Lord saves.

      The Epistle to the Hebrews quotes this verse and puts it in the mouth of Jesus Christ, speaking of the disciples the Father has given Him ([[Heb. 2:13]]).
    sources: [bd-isaiah, delitzsch, lds-scriptures]
  - ref: 19
    phrase: Seek unto them that have familiar spirits, and unto wizards that peep, and that mutter
    kind: history
    title: Mediums who chirp and mutter
    body: |
      In times of crisis, people in Judah turned to necromancers, who claimed to consult the spirits of the dead. A “familiar spirit” (*ʾov*) was first the spirit of such a practice and then the medium who had it. The “peeping” and “muttering” describe the way these practitioners chirped and whispered, as though the voice came from the shades of the dead. The law of Moses forbade all of this ([[Lev. 19:31]]; [[Deut. 18:10–12]]). King Saul’s visit to the medium of Endor is the famous example ([[1 Sam. 28]]).

      Isaiah’s answer: “should not a people seek unto their God? for the living to the dead?” Isaiah will later describe a voice from the dust that is “as of one that hath a familiar spirit,” which the Book of Mormon applies to a record speaking “out of the ground” ([[Isa. 29:4]]; [[2 Ne. 26:16]]).
    sources: [delitzsch, lds-scriptures]
  - ref: 20
    phrase: To the law and to the testimony
    kind: words
    title: '“To the law and to the testimony”'
    body: |
      Here is Isaiah’s test for any spiritual claim: does it agree with the word God has already given? “If they speak not according to this word, it is because there is no light in them.” The Hebrew word is *shachar*, “dawn”: such people are those for whom no dawn rises. That sets up the darkness of verses 21–22 and the great light of chapter 9.

      The “law” (*torah*, teaching) and “testimony” are what the Lord gave through Isaiah, including the testimony sealed among his disciples (verse 16). In this dispensation the Lord says that what His servants speak when moved upon by the Holy Ghost is scripture ([[D&C 68:4]]).
    sources: [delitzsch, biblehub-interlinear, lds-scriptures]

christ: |
  Several threads in Isaiah 8 lead to Jesus Christ. The land belongs to **Immanuel** (verse 8), and the faithful take courage because “God is with us” (verse 10). The Lord is a **sanctuary** to those who trust Him and a **stumbling stone** to those who don’t (verse 14), and the New Testament identifies that stone as Christ ([[1 Pet. 2:6–8]]). Hebrews hears the Savior’s own voice in verse 18: “Behold I and the children which God hath given me” ([[Heb. 2:13]]).

  And the “waters of Shiloah that go softly” (verse 6) are connected by John’s Gospel to the pool of Siloam, “Sent,” where Jesus opened a blind man’s eyes ([[John 9:7]]).

explore: |
  - **The stumbling stone.** Trace the stone image through [[Isa. 8:14]], [[Isa. 28:16]], [[Ps. 118:22]], [[Dan. 2:34–45]], [[Matt. 21:42–44]], [[Hel. 5:12]], and [[D&C 50:44]].
  - **Sealed testimony.** Compare Isaiah’s “seal the law among my disciples” with the sealed portion of the plates ([[Ether 4:4–7]]) and with [[D&C 88:84]]. What does it mean for testimony to be sealed until its time?
  - **Darkness to light.** Read [[Isa. 8:21–9:2]] without the chapter break. How does the sudden turn from darkness to light work?

