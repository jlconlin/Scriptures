    note: Nephi quotes the chapter.
    primary: true
  - ref: 1 Pet. 2:6–8
    note: Peter identifies the stone of stumbling as Christ.
  - ref: Heb. 2:13
    note: Hebrews applies verse 18 to Christ and His children.
  - ref: D&C 88:84
