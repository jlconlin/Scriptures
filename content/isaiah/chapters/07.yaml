chapter: 7
title: 'A Sign for a Frightened King: Immanuel'
tagline: Two enemy kings, one terrified ruler, a prophet at the water supply, and a sign that pointed seven centuries ahead.
when: 'c. 735–734 BC, during the Syro-Ephraimite war'

setting: |
  Here Isaiah moves from poetry into narrative, and we get a specific historical crisis. It’s about 735 BC. The Assyrian empire under Tiglath-pileser III is expanding westward. Two small kingdoms, **Syria** (Aram, capital Damascus, King Rezin) and **Israel** (Ephraim, capital Samaria, King Pekah son of Remaliah), have formed an alliance to resist Assyria. They want Judah to join. When King **Ahaz** of Judah refuses, they march on Jerusalem, intending to depose him and install a puppet, “the son of Tabeal” ([[2 Kgs. 16:5]]; [[2 Chr. 28:5–8]]). Historians call it the **Syro-Ephraimite war**.

  Ahaz is terrified, and he has a plan: he will send silver and gold from the temple to Tiglath-pileser and ask Assyria to rescue him ([[2 Kgs. 16:7–9]]). Isaiah is sent to talk him out of it and to invite him to trust the Lord instead.

  This is the context of one of the most famous prophecies in the Bible: “Behold, a virgin shall conceive, and bear a son, and shall call his name Immanuel.” Nephi quoted the chapter as [[2 Ne. 17]].

thread: |
  Isaiah 7 is about **faith under pressure**, and the whole chapter hinges on one line: “If ye will not believe, surely ye shall not be established” (verse 9).

  The crisis is real. Two armies are coming, and Ahaz’s heart shakes “as the trees of the wood are moved with the wind” (verse 2). The Lord sends Isaiah to meet him at the city’s water supply, where Ahaz is presumably inspecting his defenses. Isaiah brings along his son, whose name is itself a sermon: *Shear-jashub*, “a remnant shall return.”

  Isaiah’s message is simple: *Calm down. Don’t be afraid of these two burnt-out stubs of firewood. Their plan will fail. Just believe.* Then, remarkably, the Lord offers Ahaz a sign, anything he likes, from the depths to the heights (verse 11).

  Ahaz refuses, with pious-sounding words: “I will not… tempt the LORD” (verse 12). But his real reason is that he has already decided to trust Assyria. He doesn’t want a sign that might obligate him to trust God.

  So the Lord gives a sign anyway, not just to Ahaz but to “the house of David” (verse 13): a young woman, a virgin, will conceive and bear a son named **Immanuel**, *God with us*. In the short term, before such a child is old enough to know right from wrong, both enemy kings will be gone (verse 16). In the long term, the sign points to the one true Immanuel, born of a virgin in Bethlehem ([[Matt. 1:22–23]]).

  The rest of the chapter describes the cost of Ahaz’s unbelief. The Assyrian “razor” he hired will shave Judah bare (verses 17–25).

  The irony is complete: the king who wouldn’t trust “God with us” ends up with Assyria with him. The chapter asks each of us the same question: *In my crisis, will I trust the Lord’s promise or hire my own razor?*

sections:
  - range: 1-9
    heading: Two smoking stubs
    plain: |
      During Ahaz’s reign, King Rezin of Syria and King Pekah of Israel attacked Jerusalem but could not take it. When word came that Syria and Ephraim had joined forces, Ahaz and his people shook like trees in the wind. The Lord told Isaiah: “Take your son Shear-jashub and go meet Ahaz at the end of the aqueduct of the upper pool, on the road to the laundry field. Tell him: Stay calm and don’t be afraid of these two smoldering stubs of firewood. They’ve plotted to invade Judah and put their own man on the throne, but it won’t happen. Syria is only as strong as Damascus, and Damascus only as strong as Rezin. Within sixty-five years Ephraim will be too shattered to be a people. If you don’t stand firm in faith, you won’t stand at all.”
  - range: 10-16
    heading: The sign of Immanuel
    plain: |
      The Lord spoke to Ahaz again: “Ask the Lord your God for a sign, as deep as the grave or as high as heaven.” Ahaz said, “I won’t ask. I won’t put the Lord to the test.” Isaiah said: “Listen, house of David! Isn’t it enough to wear out people’s patience? Must you wear out God’s too? The Lord Himself will give you a sign: a virgin will conceive and give birth to a son and name him Immanuel, ‘God with us.’ He will eat curds and honey by the time he knows to reject evil and choose good. Before that child knows right from wrong, the lands of the two kings you dread will be deserted.”
  - range: 17-25
    heading: The razor Ahaz hired
    plain: |
      The Lord will bring on you and your dynasty the worst days since Israel split from Judah: the king of Assyria. The Lord will whistle for Egypt like flies and for Assyria like bees, and they will settle everywhere. The Lord will use the razor you hired from beyond the Euphrates, the king of Assyria, to shave Judah’s head, body, and beard. In that day a man will keep only a young cow and two sheep, and the few people left will live on curds and honey. Prime vineyards worth a thousand silver pieces will turn into thorns and briers, fit only for hunting and grazing.

notes:
  - ref: 1
    phrase: Rezin the king of Syria, and Pekah the son of Remaliah, king of Israel
    kind: history
    title: The Syro-Ephraimite war
    body: |
      Around 735 BC, Rezin of Damascus and Pekah of Samaria tried to build a coalition against the Assyrian empire. Judah refused to join, so they invaded to force it. They killed many in Judah and carried off captives ([[2 Chr. 28:5–8]]), but they could not take Jerusalem itself ([[2 Kgs. 16:5]]).

      Isaiah’s contemptuous way of referring to Pekah, only as “the son of Remaliah” (verses 4, 5, 9), is deliberate. It is like calling someone “that So-and-so’s boy”: Pekah was a usurper who had seized the throne by assassination ([[2 Kgs. 15:25]]), not a legitimate son of a dynasty.
    sources: [bd-ahaz, bd-syria, ot-manual-f]
  - ref: 2
    phrase: as the trees of the wood are moved with the wind
    kind: symbol
    title: A king who shakes like a tree
    body: |
      It’s a vivid simile. Ahaz’s heart, and his people’s, trembles like a forest in a windstorm. Compare the “tree” image elsewhere in Isaiah: the righteous will become “trees of righteousness, the planting of the LORD” ([[Isa. 61:3]]), and the Psalms describe the one who trusts God as “a tree planted by the rivers of water” ([[Ps. 1:3]]).

      Faith doesn’t mean the wind stops blowing. It means our roots hold.
  - ref: 3
    phrase: Shear-jashub thy son
    kind: words
    title: A son whose name is a sermon
    body: |
      *Shear-jashub* means **“a remnant shall return.”** Isaiah gave his children prophetic names, and he later said, “I and the children whom the LORD hath given me are for signs and for wonders in Israel” ([[Isa. 8:18]]). Bringing the boy to meet Ahaz was a message in itself.

      The name cuts two ways. It is a warning: *only* a remnant will return, so disaster is coming. And it is a promise: a remnant *will* return, so God will not abandon His people. Isaiah develops both sides in [[Isa. 10:20–22]].
    sources: [bd-isaiah]
  - ref: 3
    phrase: at the end of the conduit of the upper pool in the highway of the fuller’s field
    kind: history
    title: Meeting the king at the water supply
    body: |
      Why meet Ahaz at an aqueduct? Most likely because the king was inspecting Jerusalem’s water supply to prepare for a siege. A city without water inside its walls could not hold out long. The “fuller’s field” was where cloth was washed and bleached, which required water.

      Here is a striking detail: this is the **exact spot** where, about thirty years later, the Assyrian field commander would stand to demand the surrender of Jerusalem from Ahaz’s son Hezekiah ([[Isa. 36:2]]). Isaiah sets the two scenes side by side. Ahaz, at this spot, chose Assyria over the Lord. Hezekiah, at this spot, faced Assyria and chose the Lord ([[Isa. 37:14–20]]).
  - ref: 4
    phrase: the two tails of these smoking firebrands
    kind: symbol
    title: Two smoking stubs
    body: |
      A “firebrand” is a stick pulled from a fire. The “tail” is the charred end. Isaiah is being deliberately dismissive: these two kings who terrify Ahaz are nothing but smoldering stubs, all smoke and no fire. They look threatening, but they are nearly burned out.

      He was right. Within three years Assyria had conquered Damascus and killed Rezin (732 BC), and Pekah was assassinated ([[2 Kgs. 15:29–30]]; [[2 Kgs. 16:9]]). What frightens us most is often already smoldering out.
  - ref: 8
    phrase: within threescore and five years shall Ephraim be broken, that it be not a people
    kind: history
    title: Sixty-five years
    body: |
      Israel (Ephraim) fell to Assyria in 722 BC, only about thirteen years after this prophecy. Why sixty-five years, then? About 65 years after 735 BC (around 670 BC), the Assyrian kings Esarhaddon and Ashurbanipal resettled foreign peoples in the region of Samaria ([[Ezra 4:2]]; [[Ezra 4:10]]; see [[2 Kgs. 17:24]]). After that, the northern kingdom ceased to exist as a distinct people. The ten tribes had been scattered and the land repopulated.

      Ephraim would be “broken, that it be not a people,” and yet, as the Restoration teaches, not forgotten. The Lord promised to gather Ephraim in the last days ([[Jer. 31:6–9]]; [[D&C 133:30–34]]).
    sources: [bd-ephraim, bd-samaria]
  - ref: 9
    phrase: If ye will not believe, surely ye shall not be established
    kind: words
    title: The key verse, and a wordplay
    body: |
      This is the hinge of the whole chapter, and it’s a pun in Hebrew. Both verbs come from the same root, *ʾaman*, which means to be firm, sure, or reliable. It is the root of our word **amen**. Literally: *Im loʾ taʾaminu, ki loʾ teʾamenu*: “If you will not stand firm (in faith), you will not stand firm (at all).”

      Faith, in Hebrew thought, is not merely believing information. It is **putting your weight on** something reliable. Ahaz had to choose what to lean on: the Lord’s word, or Assyria’s army. The same choice appears in Isaiah’s later promise: “he that believeth shall not make haste” ([[Isa. 28:16]]).
    sources: [bdb]
  - ref: 11
    phrase: ask it either in the depth, or in the height above
    kind: liken
    title: A blank check
    body: |
      This is an extraordinary offer. The Lord invites Ahaz to ask for any sign at all, from the depths of Sheol to the heights of heaven. Normally seeking signs is discouraged ([[Matt. 12:39]]; [[D&C 63:7–12]]). But here the Lord Himself offers one, graciously, to strengthen a wavering king’s faith. Gideon asked for signs and received them ([[Judg. 6:36–40]]).

      God sometimes offers us exactly the reassurance we need. The question is whether we want it.
  - ref: 12
    phrase: I will not ask, neither will I tempt the LORD
    kind: history
    title: Piety as an excuse
    body: |
      Ahaz’s answer *sounds* righteous. It even quotes Moses: “Ye shall not tempt the LORD your God” ([[Deut. 6:16]]). But it’s a dodge. Ahaz had already decided on his plan. He would strip the temple treasury and send it to Tiglath-pileser, pleading, “I am thy servant and thy son: come up, and save me” ([[2 Kgs. 16:7–8]]). A sign from God would only complicate things.

      Ahaz also later built a copy of an Assyrian altar in Damascus and installed it in the temple, and he sacrificed his own son in the fire ([[2 Kgs. 16:3]]; [[2 Kgs. 16:10–16]]). His refusal here is the refusal of a man who has already chosen another god.
    sources: [bd-ahaz]
  - ref: 13
    phrase: O house of David
    kind: words
    title: The sign is for the dynasty
    body: |
      Notice the audience shift. In verse 11 Isaiah speaks to Ahaz alone (“thee” is singular). In verse 13 he addresses “the house of David,” and the “you” in verses 13–14 is plural in Hebrew. The sign isn’t only for one faithless king. It’s for the whole royal line of David, to whom God had promised an eternal throne ([[2 Sam. 7:12–16]]).

      That is a clue that the sign reaches beyond Ahaz’s lifetime, toward the Son of David who would sit on that throne forever ([[Luke 1:31–33]]).
  - ref: 14
    phrase: Behold, a virgin shall conceive, and bear a son
    kind: christ
    title: A virgin shall conceive
    body: |
      This is one of the great messianic prophecies. Matthew quotes it and says plainly that Jesus’s birth to the virgin Mary fulfilled it ([[Matt. 1:18–23]]). The Bible Dictionary affirms that the prophecy “received its fulfillment in Christ”: “Christ as God will be born into mortality of a virgin and will be among the people to save and redeem them.” Nephi saw the same event in vision: “a virgin, most beautiful and fair,” the mother of the Son of God ([[1 Ne. 11:13–21]]; see [[Mosiah 3:8]]; [[Alma 7:10]]).

      Two details help readers understand discussions they may encounter:

      - The Hebrew word here, *ʿalmah*, means a young woman of marriageable age. By the conventions of that society such a woman was presumed to be a virgin, but the word does not specify it. The Greek translation made before Christ, which Matthew quotes, renders it *parthenos*, “virgin.” Matthew, the Book of Mormon ([[2 Ne. 17:14]]), and the angel’s words to Mary ([[Luke 1:27]]; [[Luke 1:34–35]]) leave no doubt about how the prophecy was ultimately fulfilled.
      - Many readers, including some Latter-day Saint scholars, also see a **near-term sign** for Ahaz, since verse 16 speaks of events in his day: the two kings would be gone before a child born soon could know right from wrong. Prophecies in Isaiah often have more than one fulfillment. A near sign in Ahaz’s day does not diminish the complete and miraculous fulfillment in Jesus Christ; it foreshadows it.
    sources: [bd-immanuel, holland-cnc, ball-winn]
  - ref: 14
    phrase: Immanuel
    kind: words
    title: God with us
    body: |
      *Immanuel* (also spelled *Emmanuel*) is two Hebrew words joined: *ʿimmanu*, “with us,” and *ʾEl*, “God.” It is both a promise and a title.

      To frightened Ahaz, it meant *God is with us, so you do not need Assyria*. To us, it means something even greater. In Jesus Christ, God literally came to be with us in mortal flesh ([[John 1:14]]). The name returns in [[Isa. 8:8]] and [[Isa. 8:10]] (“God is with us”). It also appears in one of the most joyful passages of latter-day scripture, where Joseph Smith calls on the dead to “speak forth anthems of eternal praise to the King Immanuel,” who made possible their redemption ([[D&C 128:22]]).
    sources: [bd-immanuel]
  - ref: 15
    phrase: Butter and honey shall he eat
    kind: history
    title: Curds and honey
    body: |
      “Butter” here is curdled milk, like yogurt or soft cheese. Curds and wild honey sound like luxury food (the land “flowing with milk and honey”). But verses 21–22 show their meaning here: when invading armies have destroyed the farms and vineyards, the few survivors will live on what grazing animals and wild bees produce. It is food of the wilderness, of a depopulated land.

      So the sign-child will grow up in hard times, eating simple food, and by the age he can tell right from wrong (only a few years), the threat from the two kings will be over.
  - ref: 20
    phrase: shall the Lord shave with a razor that is hired
    kind: symbol
    title: The razor Ahaz hired
    body: |
      This is Isaiah’s bitter irony. Ahaz **hired** Assyria with temple silver and gold ([[2 Kgs. 16:8]]). Now the Lord says He will use that very hired razor, “them beyond the river” (the Euphrates), to shave Judah.

      Shaving was humiliation. When the Ammonites shaved half the beards of David’s ambassadors, it was a deliberate insult ([[2 Sam. 10:4–5]]). Shaving “the head, and the hair of the feet” (a euphemism) and the beard means total humiliation, stripped from head to toe. The protection Ahaz bought turned into the instrument of Judah’s disgrace. In 701 BC, Assyria’s army ravaged Judah exactly as described.
  - ref: 23
    phrase: where there were a thousand vines at a thousand silverlings
    kind: history
    title: Prime vineyards gone wild
    body: |
      A vineyard of a thousand vines worth a thousand pieces of silver was prime agricultural land, a silver piece per vine. After the invasion, such vineyards will revert to thorns and briers, fit only for hunters with bows and for grazing cattle.

      It’s the Song of the Vineyard ([[Isa. 5:5–6]]) coming true in literal agricultural terms.

christ: |
  Isaiah 7 gives us the name **Immanuel**, and with it the heart of the gospel: *God with us*. Matthew and Nephi both testify that it was fulfilled when Jesus Christ was born of the virgin Mary ([[Matt. 1:22–23]]; [[1 Ne. 11:18–21]]).

  Notice the chapter’s contrast. Ahaz wanted a powerful ally *with* him, and he chose Assyria. God offered to be with him, and he refused. The sign God gave anyway was a vulnerable baby, not an army. The Savior’s power has always come in that unexpected form: God with us in weakness, in poverty (“butter and honey”), in a manger. Yet He is the only ally who cannot become our razor.

liken: |
  - When my “heart is moved as the trees of the wood,” what do I tend to hire for protection: money, connections, busyness, control? Are any of them razors in disguise?
  - Verse 9 in paraphrase: *If you don’t stand firm in faith, you won’t stand at all.* What does it look like, concretely, to put my weight on the Lord’s promises this week?
  - Ahaz covered his unbelief with pious words (verse 12). Do I ever use spiritual-sounding reasons to avoid doing what the Lord invites?
  - What “smoking firebrands” in my life seem terrifying now but may already be burning out?

explore: |
  - **Ahaz and Hezekiah at the same spot.** Read Isaiah 7:1–12 and [[Isa. 36:1–37:7]]. Father and son face invasion at the same conduit of the upper pool. What does each one do?
  - **The Immanuel sequence.** Isaiah 7–12 is sometimes called “the Book of Immanuel.” Follow the child through [[Isa. 8:8–10]], [[Isa. 9:6–7]], and [[Isa. 11:1–10]]. How does the picture grow?
  - **Nephi’s vision.** Read [[1 Ne. 11:13–33]]. How does Nephi’s vision of the virgin and her Son deepen Isaiah 7:14?

