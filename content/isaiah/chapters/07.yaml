chapter: 7
title: 'A Sign for a Frightened King: Immanuel'
tagline: Two enemy kings, one terrified ruler, a prophet at the water supply, and a sign that reached beyond the crisis.
when: 'Before 732 BC, during the Syro-Ephraimite war'

setting: |
  Here the book turns to a specific historical crisis. It is the years before 732 BC, and the Assyrian empire under Tiglath-pileser III is pressing westward. Two small kingdoms, **Syria** (Aram, capital Damascus, King Rezin) and **Israel** (Ephraim, capital Samaria, King Pekah son of Remaliah), have formed a coalition against Assyria, and the coalition has turned on Judah, trying to subjugate it. Their plan, as Isaiah reports it, is to set a king of their own choosing in Jerusalem, “the son of Tabeal” ([[Isa. 7:6]]; see [[2 Kgs. 16:5]]; [[2 Chr. 28:5–8]]). Historians call it the **Syro-Ephraimite war**.

  Ahaz is terrified, and he has a plan: he will send silver and gold from the temple to Tiglath-pileser and ask Assyria to rescue him ([[2 Kgs. 16:7–9]]). Isaiah is sent to warn him against that course and to call him to trust the Lord instead.

  This is the context of one of the most famous prophecies in the Bible: “Behold, a virgin shall conceive, and bear a son, and shall call his name Immanuel.” Nephi quoted the chapter as [[2 Ne. 17]].

thread: |
  Isaiah 7 is about **faith under pressure**, and the whole chapter hinges on one line: “If ye will not believe, surely ye shall not be established” (verse 9).

  The crisis is real. Two armies are coming, and Ahaz’s heart shakes “as the trees of the wood are moved with the wind” (verse 2). The Lord sends Isaiah to meet him at the city’s water supply, where Ahaz is probably preparing for a siege. Isaiah brings along his son, whose name is itself a sermon: *Shear-jashub*, “a remnant shall return.”

  Isaiah’s message is simple: *Calm down. Don’t be afraid of these two burnt-out stubs of firewood. Their plan will fail. Just believe.* Then, remarkably, the Lord offers Ahaz a sign, anything he likes, from the depths to the heights (verse 11).

  Ahaz refuses, with pious-sounding words: “I will not… tempt the LORD” (verse 12). The narrative shows his real reason: he has already turned to Assyria ([[2 Kgs. 16:7–8]]).

  So the Lord gives a sign anyway, not just to Ahaz but to “the house of David” (verse 13): a young woman, a virgin, will conceive and bear a son named **Immanuel**, *God with us*. In the short term, before such a child is old enough to know right from wrong, both enemy kings will be gone (verse 16). In the long term, as Matthew reads it, the sign points to the one true Immanuel, born of a virgin ([[Matt. 1:22–23]]).

  The rest of the chapter describes the cost of Ahaz’s unbelief. The Assyrian “razor” he hired will shave Judah bare (verses 17–25).

  The irony is complete: the king who wouldn’t trust “God with us” ends up with Assyria with him.

sections:
  - range: 1-9
    heading: Two smoking stubs
    plain: |
      During Ahaz’s reign, King Rezin of Syria and King Pekah of Israel attacked Jerusalem but could not take it. When word came that Syria and Ephraim had joined forces, Ahaz and his people shook like trees in the wind. The Lord told Isaiah: “Take your son Shear-jashub and go meet Ahaz at the end of the aqueduct of the upper pool, on the road to the laundry field. Tell him: Stay calm and don’t be afraid of these two smoldering stubs of firewood. They’ve plotted to invade Judah and put their own man on the throne, but it won’t happen. Syria is only as strong as Damascus, and Damascus only as strong as Rezin. Within sixty-five years Ephraim will be too shattered to be a people. If you don’t stand firm in faith, you won’t stand at all.”
  - range: 10-16
    heading: The sign of Immanuel
    plain: |
      The Lord spoke to Ahaz again: “Ask the Lord your God for a sign, as deep as the grave or as high as heaven.” Ahaz said, “I won’t ask. I won’t put the Lord to the test.” Isaiah said: “Listen, house of David! Isn’t it enough to wear out people’s patience? Must you wear out God’s too? The Lord Himself will give you a sign: a virgin will conceive and give birth to a son and name him Immanuel, ‘God with us.’ He will eat curds and honey by the time he knows to reject evil and choose good. Before that child knows right from wrong, the lands of the two kings you dread will be deserted.”
  - range: 17-25
    heading: The razor Ahaz hired
    plain: |
      The Lord will bring on you and your dynasty the worst days since Israel split from Judah: the king of Assyria. The Lord will whistle for Egypt like flies and for Assyria like bees, and they will settle everywhere. The Lord will use the razor you hired from beyond the Euphrates, the king of Assyria, to shave Judah’s head, body, and beard. In that day a man will keep only a young cow and two sheep, and the few people left will live on curds and honey. Prime vineyards worth a thousand silver pieces will turn into thorns and briers, fit only for hunting and grazing.

notes:
  - ref: 1
    phrase: Rezin the king of Syria, and Pekah the son of Remaliah, king of Israel
    kind: history
    title: The Syro-Ephraimite war
    body: |
      Rezin of Damascus and Pekah of Samaria formed a coalition against the Assyrian empire, and it turned on Judah in an attempt to subjugate it. They killed many in Judah and carried off captives ([[2 Chr. 28:5–8]]), but they could not take Jerusalem itself ([[2 Kgs. 16:5]]).

      Isaiah refers to Pekah only as “the son of Remaliah” (verses 4, 5, 9), which is a way of recalling his low birth: Pekah had seized the throne by assassination ([[2 Kgs. 15:25]]), and no promise had been made to his house.
    sources: [ot-manual-f, delitzsch, lds-scriptures]
  - ref: 3
    phrase: Shear-jashub thy son
    kind: words
    title: A son whose name is a sermon
    body: |
      *Shear-jashub* means **“a remnant shall return.”** Isaiah gave his children prophetic names, and he later said, “I and the children whom the LORD hath given me are for signs and for wonders in Israel” ([[Isa. 8:18]]). Bringing the boy to meet Ahaz was a message in itself.

      The name cuts two ways. It is a warning: *only* a remnant will return, so disaster is coming. And it is a promise: a remnant *will* return, so God will not abandon His people. Isaiah develops both sides in [[Isa. 10:20–22]].
    sources: [delitzsch, isaiah-in-bom, lds-scriptures]
  - ref: 3
    phrase: at the end of the conduit of the upper pool in the highway of the fuller’s field
    kind: history
    title: Meeting the king at the water supply
    body: |
      Why meet Ahaz at an aqueduct? One likely answer is that the king was making provision for a siege and Jerusalem’s water supply was the place to do it. The “fuller’s field” was where wool cloth was cleaned and thickened, and where washed cloth was spread out to dry.

      Here is a striking detail: this is the **same place** where, years later, the Assyrian field commander would stand to demand the surrender of Jerusalem from Ahaz’s son Hezekiah ([[Isa. 36:2]]). Isaiah sets the two scenes side by side. Ahaz, at this spot, chose Assyria over the Lord. Hezekiah, at this spot, faced Assyria and chose the Lord ([[Isa. 37:14–20]]).
    sources: [delitzsch, lds-scriptures]
  - ref: 4
    phrase: the two tails of these smoking firebrands
    kind: symbol
    title: Two smoking stubs
    body: |
      A “firebrand” is a stick pulled from a fire. The “tail” is the charred end. These two kings who terrify Ahaz are, in Isaiah’s image, nothing but smoldering stubs: they would not blaze again, though their smoke might still sting the eyes.

      He was right. Assyria soon conquered Damascus and killed Rezin (732 BC), and Pekah was assassinated ([[2 Kgs. 15:29–30]]; [[2 Kgs. 16:9]]).
    sources: [delitzsch, isaiah-in-bom, lds-scriptures]
  - ref: 8
    phrase: within threescore and five years shall Ephraim be broken, that it be not a people
    kind: history
    title: Sixty-five years
    body: |
      Israel (Ephraim) fell to Assyria in 722 BC, only about ten years after Assyria broke the coalition, so the sixty-five years need explaining. One careful reading counts them to a later event: the resettlement of the region of Samaria with colonists from the east under Esarhaddon ([[2 Kgs. 17:24]]; [[Ezra 4:2]]), when the last Ephraimite population was replaced or absorbed. On that count Ephraim ended as a *people* then, though it had ended as a kingdom in 722. This is a reconstruction of how the figure works, not something the text states.

      Ephraim would be “broken, that it be not a people,” and yet, as the Restoration teaches, not forgotten. The Lord promised to gather Ephraim in the last days ([[Jer. 31:6–9]]; [[D&C 133:30–34]]).
    sources: [delitzsch, isaiah-in-bom, lds-scriptures]
  - ref: 9
    phrase: If ye will not believe, surely ye shall not be established
    kind: words
    title: The key verse, and a wordplay
    body: |
      This is the hinge of the whole chapter, and it’s a pun in Hebrew. Both verbs come from the same root, *ʾaman*, which means to be firm, sure, or reliable. Literally: *Im loʾ taʾaminu, ki loʾ teʾamenu*: “If you will not stand firm (in faith), you will not stand firm (at all).” The causative form (*taʾaminu*) means to hold fast to, to trust; the passive (*teʾamenu*) means to be made firm, to last.

      Judah’s standing depended on where it put its trust. Ahaz had to choose what to lean on: the Lord’s word, or Assyria’s army. The same choice appears in Isaiah’s later promise: “he that believeth shall not make haste” ([[Isa. 28:16]]).
    sources: [bdb, delitzsch, biblehub-interlinear]
  - ref: 11
    phrase: ask it either in the depth, or in the height above
    kind: history
    title: A blank check
    body: |
      This is an extraordinary offer. The Lord invites Ahaz to ask for any sign at all, from the depths to the heights above. Normally seeking signs is discouraged ([[Matt. 12:39]]; [[D&C 63:7–12]]). But here the Lord Himself offers one, to confirm His word to a wavering king. Gideon asked for signs and received them ([[Judg. 6:36–40]]).
    sources: [lds-scriptures]
  - ref: 12
    phrase: I will not ask, neither will I tempt the LORD
    kind: history
    title: Piety as an excuse
    body: |
      Ahaz’s answer *sounds* righteous. It even quotes Moses: “Ye shall not tempt the LORD your God” ([[Deut. 6:16]]). But it’s a dodge. Ahaz’s trust was already in Assyria. He would strip the temple treasury and send it to Tiglath-pileser, pleading, “I am thy servant and thy son: come up, and save me” ([[2 Kgs. 16:7–8]]).

      Ahaz also later had an altar built after one he saw in Damascus and installed it in the temple, and he made his son pass through the fire ([[2 Kgs. 16:3]]; [[2 Kgs. 16:10–16]]). His refusal here comes from a man already turning to other gods.
    sources: [bd-ahaz, ot-manual-f, delitzsch, lds-scriptures]
  - ref: 13
    phrase: O house of David
    kind: words
    title: The sign is for the dynasty
    body: |
      Notice the audience shift. In verse 11 the Hebrew “thee” is singular, to Ahaz alone. In verse 13 Isaiah addresses “the house of David,” and the “you” in verses 13–14 is plural in Hebrew. The sign isn’t only for one faithless king. It’s for the royal line of David, to whom God had promised an eternal throne ([[2 Sam. 7:12–16]]).

      Latter-day Saint readers can take this as a hint that the sign reaches beyond Ahaz’s lifetime, toward the Son of David who would sit on that throne forever ([[Luke 1:31–33]]). That is a reading of the shift, not something the verse says outright.
    sources: [biblehub-interlinear, delitzsch, lds-scriptures]
  - ref: 14
    phrase: Behold, a virgin shall conceive, and bear a son
    kind: christ
    title: A virgin shall conceive
    body: |
      This is one of the great messianic prophecies. Matthew quotes it and says plainly that Jesus’s birth to the virgin Mary fulfilled it ([[Matt. 1:18–23]]). The Bible Dictionary affirms that the prophecy “received its fulfillment in Christ”: “Christ as God will be born into mortality of a virgin and will be among the people to save and redeem them.” Nephi saw the same event in vision: “a virgin, most beautiful and fair,” the mother of the Son of God ([[1 Ne. 11:13–21]]; see [[Mosiah 3:8]]; [[Alma 7:10]]).

      Two questions come up for readers:

      - **What does the Hebrew word mean?** *ʿalmah* means a young woman of marriageable age; it does not by itself specify virginity, and Hebrew has a different word (*betulah*) that stresses seclusion and distance from marriage. The ancient Greek translation (the Septuagint) reads “virgin” here, and Matthew’s Greek has *parthenos*. Matthew, the Book of Mormon ([[2 Ne. 17:14]]), and the angel’s words to Mary ([[Luke 1:27]]; [[Luke 1:34–35]]) leave no doubt about how the prophecy was ultimately fulfilled.
      - **Was there a sign for Ahaz too?** Verse 16 places the sign inside the crisis: before the child could tell right from wrong, the lands of the two kings would be deserted. Latter-day Saint commentators read this in more than one way. Some see the whole sign as pointing only to Christ, following Matthew. Others see a child born in Ahaz’s day, often Isaiah’s own son, as a type or foreshadowing, with the full and miraculous fulfillment in Jesus Christ; one reading divides the passage, taking verses 14–15 as Christ and the child of verse 16 as any child of the time. These are interpretations, and faithful readers have held each. The near sign does not diminish the virgin birth; on the dual reading it foreshadows it.
    sources: [bd-immanuel, isaiah-in-bom, delitzsch, bdb, biblehub-interlinear, lxx-rahlfs, greek-nt, lds-scriptures]
  - ref: 14
    phrase: Immanuel
    kind: words
    title: God with us
    body: |
      *Immanuel* (also spelled *Emmanuel*) is two Hebrew words joined: *ʿimmanu*, “with us,” and *ʾEl*, “God.” It is both a promise and a title.

      To frightened Ahaz, it would have meant *God is with us, so you do not need Assyria*. In Jesus Christ, God came to dwell among us in mortal flesh ([[John 1:14]]). The name returns in [[Isa. 8:8]] and [[Isa. 8:10]] (“God is with us”). It also appears in one of the most joyful passages of latter-day scripture, where Joseph Smith calls on the dead to “speak forth anthems of eternal praise to the King Immanuel,” who made possible their redemption ([[D&C 128:22]]).
    sources: [bd-immanuel, bdb, biblehub-interlinear, lds-scriptures]
  - ref: 14
    phrase: Therefore the Lord himself shall give you a sign
    kind: history
    title: Who was Immanuel in Ahaz’s day?
    body: |
      The Immanuel prophecy was fulfilled in Jesus Christ, as Matthew testifies and the Church teaches (see the first note on this verse); who the child of Ahaz’s own day was, neither scripture nor the Church says. “The identity of the young mother is unknown”: some think she was Isaiah’s wife, others the wife of Ahaz. Weighing the two is scholarly hypothesis, and it concerns only the child of Ahaz’s day.

      Three clues point to a son of Ahaz, the future king Hezekiah. The Hebrew has the definite article, *ha-ʿalmah*, *the* young woman (the King James Version has *a*), which suggests a woman known to Isaiah’s hearers. The sign is given to “the house of David” (verse 13), a house often described by its special relationship with God, so the name *God with us* suits one of its heirs. And the next chapter calls Judah “thy land, O Immanuel” ([[Isa. 8:8]]), in a warning of Assyrian invasion much like the one to Ahaz in verse 17.

      Each proposal has a difficulty. Ahaz reigned sixteen years ([[2 Kgs. 16:2]]) and Hezekiah came to the throne at twenty-five ([[2 Kgs. 18:2]]), which puts Hezekiah’s birth almost a decade before Ahaz was king and well before Isaiah spoke, though there is reason to think the regnal figures in Kings and Chronicles are not precise. The other proposal makes the child Isaiah’s son Maher-shalal-hash-baz ([[Isa. 8:3]]), so that all three sign-children of chapters 7–8 are Isaiah’s own ([[Isa. 8:18]]). But Isaiah’s wife had already borne Shear-jashub, old enough to walk with his father to meet the king (verse 3), and is hard to describe as a young woman of marriageable age. On this evidence “no definitive conclusion can be reached.”

      Whoever the child was, the sign was given to David’s house when its throne was under threat (verses 6, 13), which may be why Matthew sets the verse where he does. His Gospel begins with “the son of David” ([[Matt. 1:1]]), its genealogy runs through “Achaz” and “Ezekias,” Ahaz and Hezekiah ([[Matt. 1:9–10]]), and the angel calls Joseph “thou son of David” ([[Matt. 1:20]]) just before the quotation of Isaiah. On this argument Matthew knew the verse’s setting and its concern with David’s line: the sign that assured Ahaz that David’s rule would not end with him becomes the sign of the King in whom the promise to David is kept, “thy throne shall be established for ever” ([[2 Sam. 7:16]]). That is a reading of Matthew, not a point the Church’s sources make, and it leaves the virgin birth where Matthew put it: the proposal about Ahaz’s day “need not detract from Matthew’s testimony about the miraculous nature of Jesus’s birth.”
    sources: [scripture-helps-isa-1-12, rsc-combs-ahaz-sign, biblehub-interlinear, lds-scriptures]
  - ref: 15
    phrase: Butter and honey shall he eat
    kind: history
    title: Curds and honey
    body: |
      “Butter” here is thickened milk, curds. Curds and honey sound like luxury food (the land “flowing with milk and honey”). But verses 21–22 show their meaning here: when the land has been stripped, the few survivors will eat that and nothing else. It is food of a depopulated land.

      So the sign-child will grow up in hard times, eating simple food, and before he can tell right from wrong the threat from the two kings will be over (verse 16).
    sources: [delitzsch, lds-scriptures]
  - ref: 20
    phrase: shall the Lord shave with a razor that is hired
    kind: symbol
    title: The razor Ahaz hired
    body: |
      This is Isaiah’s bitter irony. Ahaz **hired** Assyria with temple and palace silver and gold ([[2 Kgs. 16:8]]). Now the Lord says He will use that very hired razor, “them beyond the river” (the Euphrates), to shave Judah.

      Shaving was humiliation. When the Ammonites shaved half the beards of David’s ambassadors, it was a deliberate insult ([[2 Sam. 10:4–5]]). Judah is pictured as a man shaved of the hair of his head, his “feet” (a euphemism), and his beard, the most shameful loss of all. The protection Ahaz bought turned into the instrument of Judah’s disgrace; the appeal to Assyria left Judah a tributary vassal.
    sources: [delitzsch, lds-scriptures]
  - ref: 23
    phrase: where there were a thousand vines at a thousand silverlings
    kind: history
    title: Prime vineyards gone wild
    body: |
      A vineyard of a thousand vines worth a thousand pieces of silver was a peculiarly valuable plot, a silver piece per vine. After the invasion, such vineyards will revert to thorns and briers, fit only for hunters with bows and for grazing cattle.

      It’s the Song of the Vineyard ([[Isa. 5:5–6]]) coming true in literal agricultural terms.
    sources: [delitzsch, lds-scriptures]

christ: |
  Isaiah 7 gives us the name **Immanuel**, and with it the heart of the gospel: *God with us*. Matthew and Nephi both testify that it was fulfilled when Jesus Christ was born of the virgin Mary ([[Matt. 1:22–23]]; [[1 Ne. 11:18–21]]).

  Notice the chapter’s contrast. Ahaz wanted a powerful ally *with* him, and he chose Assyria. God offered to be with him, and he refused. The sign God gave anyway was a child, not an army: God with us in mortal flesh ([[John 1:14]]).

explore: |
  - **Ahaz and Hezekiah at the same spot.** Read Isaiah 7:1–12 and [[Isa. 36:1–37:7]]. Father and son face invasion at the same conduit of the upper pool. What does each one do?
  - **The Immanuel sequence.** Follow the name and the child through [[Isa. 8:8–10]], [[Isa. 9:6–7]], and [[Isa. 11:1–10]]. How does the picture grow?
  - **Nephi’s vision.** Read [[1 Ne. 11:13–33]]. How does Nephi’s vision of the virgin and her Son deepen Isaiah 7:14?

