chapter: 39
title: Envoys from Babylon
tagline: Hezekiah shows ambassadors from Babylon everything in his treasury, and Isaiah foretells that all of it, and some of his own descendants, will be carried to Babylon.
when: 'Probably shortly before 701 BC'

setting: |
  The “king of Babylon” in verse 1 is **Merodach-baladan** (Akkadian *Marduk-apla-iddina*, “Merodach has given a son”), a Chaldean ruler who spent his career fighting Assyria. He reigned in Babylon for twelve years from 721 BC, until Sargon II ousted him. When Sargon’s reign ended in 705 he took the throne again, briefly, in 703, and Sennacherib’s annals describe how he fled before Sennacherib’s first campaign.

  So the “letters and a present” were more than a get-well card. Merodach-baladan made an alliance with Hezekiah against the Assyrian king, and the embassy has been read as having “the secret political object of making common cause with Hezekiah to throw off the Assyrian yoke.” Hezekiah had already refused to pay Assyria its usual tribute. The text says only “at that time,” and the exact date is debated, but the embassy most probably came shortly before Sennacherib’s invasion of Judah in 701.

  In Isaiah’s day Babylon was a rebel against Assyria. After Assyria’s fall it became Nebuchadnezzar’s capital, and the empire he ruled carried Jerusalem’s people away.

thread: |
  Isaiah 39 is a short chapter about **a good man’s small mistake with enormous consequences**, and it turns the whole book toward Babylon.

  Hezekiah has just been healed by a miracle. Now foreign dignitaries come to congratulate him, and he is pleased with them. He shows them everything: silver, gold, spices, oils, the armory, “there was nothing in his house… that Hezekiah shewed them not” (verse 2). The Chronicler supplies the diagnosis Isaiah leaves implicit: “Hezekiah rendered not again according to the benefit done unto him; for his heart was lifted up” ([[2 Chr. 32:25]]).

  Isaiah arrives and asks three questions, like a doctor taking a history: Who were they? Where did they come from? What did they see? (verses 3–4). Hezekiah answers honestly, and the verdict follows. Everything he showed off will be carried to Babylon, and some of his own descendants will serve in the Babylonian palace (verses 6–7).

  In chapter 37 Hezekiah spread a threatening letter before the Lord. In chapter 39 he spreads his treasures before men. The one who trusted God against Assyria now welcomes Babylon’s envoys and shows them everything.

  And then the book goes silent about Hezekiah. The next words are “Comfort ye, comfort ye my people” (40:1), the start of the prophecies that look to the Babylonian period.

sections:
  - range: 1-2
    heading: Hezekiah shows the envoys everything
    plain: |
      At that time Merodach-baladan son of Baladan, king of Babylon, sent letters and a gift to Hezekiah, because he had heard that Hezekiah had been ill and had recovered. Hezekiah was delighted with them and showed them his storehouse: the silver, the gold, the spices, the fine oil, his whole armory, and everything in his treasuries. There was nothing in his palace or in his whole kingdom that Hezekiah did not show them.
  - range: 3-4
    heading: Isaiah’s questions
    plain: |
      Then the prophet Isaiah came to King Hezekiah and asked him, “What did these men say? Where did they come from?” Hezekiah answered, “They came to me from a distant country, from Babylon.” Isaiah asked, “What did they see in your palace?” Hezekiah answered, “They saw everything in my palace. There is nothing in my treasuries that I didn’t show them.”
  - range: 5-7
    heading: Everything will go to Babylon
    plain: |
      Then Isaiah said to Hezekiah, “Hear the word of the Lord of hosts: The time is coming when everything in your palace, and everything your ancestors have stored up until now, will be carried off to Babylon. Nothing will be left, says the Lord. And some of your own descendants, who will come from you, will be taken away, and they will be eunuchs in the palace of the king of Babylon.”
  - range: 8
    heading: '“Good is the word of the LORD”'
    plain: |
      Hezekiah said to Isaiah, “The word of the Lord that you have spoken is good.” He added, “For there will be peace and truth in my days.”

notes:
  - ref: 2
    phrase: there was nothing in his house, nor in all his dominion, that Hezekiah shewed them not
    kind: history
    title: Showing everything
    body: |
      Hezekiah’s tour was wrong in two ways, which the text lets us see without spelling them out.

      **Politically**, it was a display of Judah’s wealth meant to win Babylon as an ally against Assyria. It has been called “obsequious suing for admiration and favour on the part of strangers,” and Isaiah had condemned foreign alliances before ([[Isa. 30:1–3]]; [[Isa. 31:1]]).

      **Spiritually**, it was a failure of gratitude. The Chronicler says that after his healing Hezekiah “rendered not again according to the benefit done unto him; for his heart was lifted up” ([[2 Chr. 32:25]]). The envoys came because of a miracle, and Hezekiah showed them the silver.

      The Chronicler adds that “God left him, to try him, that he might know all that was in his heart” ([[2 Chr. 32:31]]). The test came through a compliment, not a crisis. Mormon observed that the Nephites’ prosperity was the moment they were most likely to “forget the Lord their God” ([[Hel. 12:2]]).
    sources: [delitzsch, lds-scriptures]
  - ref: 6
    phrase: all that is in thine house, and that which thy fathers have laid up in store until this day, shall be carried to Babylon
    kind: history
    title: A prophecy about Babylon, a century early
    body: |
      This verse names Babylon as the future conqueror more than a century before it happened. Nebuchadnezzar carried off “all the treasures of the house of the LORD, and the treasures of the king’s house” in 597 BC ([[2 Kgs. 24:13]]), and there was a second deportation in 586 BC.

      Scholars read this in different ways. Many hold that Isaiah’s Babylonian-era chapters were written after the exile; to that view, raised for chapters 40–66, the answer is that “the calendar in no way affects a prophet’s vision.” Another reading grants that political insight might have foreseen some disaster from Hezekiah’s course, but holds that knowing Babylon, “then struggling hard for independence,” would inherit Assyria’s empire and be the one to destroy Judah “was impossible without the spirit of prophecy.”

      Latter-day Saints, who accept predictive prophecy as a real gift ([[Amos 3:7]]; [[2 Ne. 25:7]]), have no difficulty with Isaiah foreseeing Babylon’s rise. What matters for the reading of the book is that chapter 39 hands the reader over to Babylon. The prophet who warned of Assyria now points to the next empire, and chapter 40 begins the prophecies that relate to the Babylonian period.
    sources: [delitzsch, ot-manual-16, bd-captivities]
  - ref: 7
    phrase: they shall be eunuchs in the palace of the king of Babylon
    kind: history
    title: Eunuchs in Babylon
    body: |
      The Hebrew word *sārîs* can mean a castrated man, but it also serves as the title of a royal official. Potiphar, a married man, is called Pharaoh’s *sārîs* ([[Gen. 39:1]]), and such men were often trusted officials. So the prophecy may mean that Hezekiah’s descendants would be castrated, or it may mean that they would serve as courtiers in a foreign palace; one translation has “courtiers.”

      The fulfillment is familiar. Nebuchadnezzar told “the master of his eunuchs” to bring him young men “of the king’s seed, and of the princes,” among them Daniel and his three friends ([[Dan. 1:3–6]]).

      The book of Isaiah does not leave the eunuchs there. Later the Lord speaks directly to the eunuch who fears, “I am a dry tree,” and promises him “a place and a name better than of sons and of daughters… an everlasting name, that shall not be cut off” ([[Isa. 56:3–5]]). The judgment spoken in chapter 39 is answered by grace in chapter 56.
    sources: [bd-eunuch, bdb, delitzsch]
  - ref: 8
    phrase: Good is the word of the LORD which thou hast spoken
    kind: history
    title: Submission or relief?
    body: |
      Hezekiah’s response is debated. Read one way, it is humble submission, like Eli’s “It is the LORD: let him do what seemeth him good” ([[1 Sam. 3:18]]). One reading takes it so, as Hezekiah submitting “with humility” and not “common egotism,” and the Chronicler supports that reading: “Hezekiah humbled himself for the pride of his heart… so that the wrath of the LORD came not upon them in the days of Hezekiah” ([[2 Chr. 32:26]]).

      Read another way, the second half of the verse sounds like relief that the disaster won’t land on *him*: “there shall be peace and truth in my days.” In the parallel account it is even phrased as a question: “Is it not good, if peace and truth be in my days?” ([[2 Kgs. 20:19]])

      Both readings are defensible, and the text may intend the ambiguity. Hezekiah really was a righteous king ([[2 Kgs. 18:5]]), and the verse leaves unsaid how much he thought beyond his own lifetime.
    sources: [delitzsch, lds-scriptures]

christ: |
  Hezekiah shows all his treasures to the envoys of Babylon. When the devil showed Jesus “all the kingdoms of the world, and the glory of them,” the Savior refused them: “Thou shalt worship the Lord thy God, and him only shalt thou serve” ([[Matt. 4:8–10]]). Hezekiah’s treasures went to Babylon.

  The chapter ends with the house of David headed for exile and its sons taken into a foreign palace. The book of Isaiah answers with a Servant who is Himself “cut off out of the land of the living” and yet “shall see his seed” ([[Isa. 53:8–10]]), and who promises the eunuch a name better than sons and daughters ([[Isa. 56:4–5]]). The Davidic line that seemed to end in Babylon comes to its fulfillment in Jesus Christ, the Son of David.

explore: |
  - **The parallel accounts.** Compare Isaiah 39 with [[2 Kgs. 20:12–19]] and the Chronicler’s commentary in [[2 Chr. 32:25–31]].
  - **The fulfillment.** Read [[2 Kgs. 24:10–16]], [[2 Kgs. 25:8–17]], and [[Dan. 1:1–7]].
  - **The hinge.** Read Isaiah 39:5–8 and then 40:1–2 without stopping. What does the juxtaposition do?
  - **Pride after deliverance.** Compare Hezekiah with [[Deut. 8:11–18]] and with the Nephite “pride cycle” described in [[Hel. 12:1–6]].

parallels:
  - ref: 2 Kgs. 20:12–19
    note: The same account, nearly word for word.
  - ref: 2 Chr. 32:25–31
    note: The Chronicler explains that God left Hezekiah “to try him.”
  - ref: Dan. 1:1–7
    note: Young men of royal descent taken to serve in Nebuchadnezzar’s palace.

