chapter: 31
title: Flesh, and Not Spirit
tagline: Egypt’s horses are only flesh, but the Lord defends Jerusalem like a lion over its prey and like birds hovering over their nest.
when: 'c. 701 BC'

setting: |
  This short chapter continues the argument of chapter 30. Judah’s leaders are still looking to Egypt for chariots and cavalry to fight Assyria. Isaiah answers with two unforgettable images of how the Lord Himself will defend Jerusalem: a lion that won’t be scared off its prey, and a mother bird hovering over her nest.

  It ends with a prophecy that the Assyrians will fall “with the sword, not of a mighty man” (verse 8), fulfilled when the Lord struck the Assyrian camp in a single night ([[Isa. 37:36]]).

thread: |
  The key to Isaiah 31 is one sentence in verse 3: “**Now the Egyptians are men, and not God; and their horses flesh, and not spirit.**”

  Judah was impressed by numbers and strength: chariots “because they are many,” horsemen “because they are very strong” (verse 1). Isaiah doesn’t dispute that Egypt had a strong army. He simply points out what it is. Men are not God, and flesh is not spirit. When the Lord stretches out His hand, both the helper and the helped fall together.

  Then Isaiah shows what real protection looks like. The Lord is like a **lion** standing over its prey, unbothered by a crowd of shouting shepherds (verse 4). He will not be scared off Mount Zion. He is also like **birds hovering** over their nest, and “passing over he will preserve it” (verse 5). That word “passing over” is the same Hebrew verb as **Passover**. The God who passed over Israel’s houses in Egypt will pass over Jerusalem.

  So the invitation is simple: “Turn ye unto him” (verse 6). Throw away the idols your own hands made (verse 7). The Assyrian will fall by a sword that is not human (verse 8). Egypt can offer flesh; the Lord offers Himself.

sections:
  - range: 1-3
    heading: Horses of flesh
    plain: |
      Woe to those who go down to Egypt for help, who rely on horses, trust in their many chariots and in the great strength of their cavalry, but do not look to the Holy One of Israel or seek the Lord! Yet He too is wise and can bring disaster; He does not take back His words. He will rise up against the house of the wicked and against those who help evildoers. The Egyptians are human, not God; their horses are flesh, not spirit. When the Lord stretches out His hand, the helper will stumble, the one helped will fall, and both will perish together.
  - range: 4-5
    heading: The lion and the hovering birds
    plain: |
      This is what the Lord told me: “As a lion, a great lion, growls over its prey and is not frightened by the shouts or disturbed by the noise of a whole band of shepherds called together against it, so the Lord of hosts will come down to fight on Mount Zion and on its hill.” Like birds hovering overhead, the Lord of hosts will shield Jerusalem. He will shield it and deliver it; He will pass over it and rescue it.
  - range: 6-9
    heading: Turn to Him
    plain: |
      Return to the One you have so deeply rebelled against, people of Israel! For in that day every one of you will reject the idols of silver and gold your sinful hands have made. Assyria will fall by a sword that is not human; a sword not of mortals will devour them. They will flee before the sword, and their young men will be put to forced labor. Their stronghold will fall because of terror; at the sight of the battle standard their commanders will panic, says the Lord, whose fire is in Zion, whose furnace is in Jerusalem.

notes:
  - ref: 1
    phrase: because they are many; and in horsemen, because they are very strong
    kind: scripture
    title: Impressed by numbers
    body: |
      Notice the reasons Judah trusted Egypt: chariots “because they are many,” horsemen “because they are very strong.” It’s the logic of numbers and power. And the tragic contrast: “but they look not unto the Holy One of Israel, neither seek the LORD.”

      Scripture repeatedly teaches that numbers don’t determine the outcome when the Lord is involved. Gideon’s army was cut down to 300 ([[Judg. 7:2–7]]). Elisha told his frightened servant, “they that be with us are more than they that be with them” ([[2 Kgs. 6:16–17]]). Helaman’s 2,000 stripling warriors, few and young, were preserved by their faith: “We do not doubt our mothers knew it” ([[Alma 56:47–48]]).
    sources: [lds-scriptures]
  - ref: 3
    phrase: Now the Egyptians are men, and not God; and their horses flesh, and not spirit
    kind: scripture
    title: Men, not God; flesh, not spirit
    body: |
      This is the chapter’s central line. The contrast is not between weak and strong, but between **flesh** and **spirit**, between what is mortal and limited and what is divine. Any help that is merely human, however impressive, belongs to the first category.

      Nephi prayed, “I will not put my trust in the arm of flesh; for I know that cursed is he that putteth his trust in the arm of flesh” ([[2 Ne. 4:34]]). Jeremiah said the same: “Cursed be the man that trusteth in man, and maketh flesh his arm” ([[Jer. 17:5–8]]).
    sources: [lds-scriptures]
  - ref: 4
    phrase: Like as the lion and the young lion roaring on his prey
    kind: symbol
    title: A lion that won’t be scared away
    body: |
      Picture a lion standing over its kill while a crowd of shepherds is called out against it. The verse says the lion is not afraid of their voice and does not abase itself for their noise.

      Commentators divide on whom the lion is against. Some take it that the Lord holds Zion the way a lion holds its prey, and will not give it up. Delitzsch rejects that: for him the lion is the Lord advancing against Jerusalem as His prey, undeterred by Judah and Egypt, and the gentle image of verse 5 is a deliberate, sudden turn. The verse itself says the Lord will “come down to fight for mount Zion,” and the first reading fits Jesus’s words about His sheep, “neither shall any man pluck them out of my hand” ([[John 10:28]]).
    sources: [delitzsch, lds-scriptures]
  - ref: 5
    phrase: As birds flying, so will the LORD of hosts defend Jerusalem
    kind: christ
    title: Hovering like a mother bird
    body: |
      The second image is the opposite of the first, gentle where the lion was fierce. The Lord hovers over Jerusalem like birds flying above their nest to protect their young. The plural “birds” with a feminine form of the participle (“flying”) carries the sense of maternal care, as Delitzsch reads it. Moses used a similar picture: “As an eagle stirreth up her nest, fluttereth over her young, spreadeth abroad her wings” ([[Deut. 32:11]]).

      Jesus used it for Himself. Weeping over Jerusalem, He said, “how often would I have gathered thy children together, even as a hen gathereth her chickens under her wings, and ye would not!” ([[Matt. 23:37]]). The risen Lord said the same to the Nephites after the destruction ([[3 Ne. 10:4–6]]). The Lord is both the lion and the mother bird: fierce against enemies and tender toward His own.
    sources: [delitzsch, lds-scriptures]
  - ref: 5
    phrase: passing over he will preserve it
    kind: words
    title: Passover
    body: |
      The Hebrew verb here, *pasach*, is the verb of **Passover**. It’s the word used when the Lord “passed over” the houses of Israel marked with the lamb’s blood in Egypt ([[Ex. 12:13]]; [[Ex. 12:23]]; [[Ex. 12:27]]). Besides Exodus 12, this is the only place in the Bible the verb has this meaning.

      The irony is powerful. Judah was running *to* Egypt for protection, but the Lord promises to protect Jerusalem the way He protected Israel *from* Egypt, by passing over it. The Lamb whose blood makes the Passover work is Christ ([[1 Cor. 5:7]]).
    sources: [bdb, delitzsch, lds-scriptures]
  - ref: 6
    phrase: Turn ye unto him from whom the children of Israel have deeply revolted
    kind: words
    title: Turn to Him
    body: |
      In the middle of the promises comes the invitation: *turn* (*shuvu*), return. The Hebrew says of the rebellion that Israel has “deepened” it, a causative form of the verb. The rebellion has been deep, but the way back is open.

      The same invitation runs through the whole Book of Mormon: “will ye not now return unto me, and repent of your sins, and be converted, that I may heal you?” ([[3 Ne. 9:13]]). The Lord’s protection in verses 4–5 is available to those who turn.

      The condition mattered. The promise was kept in 701 BC, when the Assyrian army withdrew from Jerusalem ([[2 Kgs. 19:34–36]]). A century later, many in the city treated that deliverance as a guarantee. Jeremiah had to warn them, “Trust ye not in lying words, saying, The temple of the LORD, The temple of the LORD” ([[Jer. 7:4]]), and Laman and Lemuel did not “believe that Jerusalem, that great city, could be destroyed according to the words of the prophets” ([[1 Ne. 2:13]]). Isaiah’s promise of protection came with his call to turn; separated from it, it became a false security.
    sources: [sc-knowhy-451, biblehub-interlinear, lds-scriptures]
  - ref: 8
    phrase: Then shall the Assyrian fall with the sword, not of a mighty man
    kind: history
    title: A sword not of man
    body: |
      This prophecy was fulfilled in 701 BC, when “the angel of the LORD went forth, and smote in the camp of the Assyrians a hundred and fourscore and five thousand” ([[Isa. 37:36]]; [[2 Kgs. 19:35]]). No Egyptian army, no Judean soldiers: a “sword, not of a mighty man.” Sennacherib returned home to Nineveh ([[Isa. 37:37]]).
    sources: [sc-knowhy-451, lds-scriptures]
  - ref: 9
    phrase: whose fire is in Zion, and his furnace in Jerusalem
    kind: symbol
    title: The Lord’s fire in Zion
    body: |
      The chapter ends by describing the Lord as the one “whose fire is in Zion, and his furnace in Jerusalem.” Delitzsch rules out reading this as the fire of the sacrifices, since the second word means a furnace, not a hearth; he takes it as the light of the divine presence, a devouring fire to the enemies of Jerusalem. Isaiah elsewhere speaks of fire that refines Zion and of the devouring fire in her midst ([[Isa. 1:25]]; [[Isa. 4:4]]; [[Isa. 33:14]]).

      To Assyria, that fire is terror. To Zion, it’s the sign that the Lord dwells among them.
    sources: [delitzsch, lds-scriptures]

christ: |
  In Isaiah 31, Jesus Christ is both **lion** and **mother bird** (verses 4–5): unmovable against enemies, tender over His own. He used the image of the hen gathering her chicks for Himself ([[Matt. 23:37]]; [[3 Ne. 10:4–6]]). And the promise that the Lord will “pass over” and preserve Jerusalem (verse 5) points to Him as our Passover Lamb, whose blood turns away the destroyer ([[1 Cor. 5:7]]).

  The contrast of flesh and spirit (verse 3) also points to Him. He is the one help that is not merely flesh, the God who became flesh so that we could be born of the Spirit ([[John 1:14]]; [[John 3:6]]).

explore: |
  - **Passover.** Read [[Ex. 12:1–28]] with Isaiah 31:5. Then read [[1 Cor. 5:7]] and [[3 Ne. 9:19–20]]. How is Christ our Passover?
  - **Arm of flesh.** Compare Isaiah 31:1–3 with [[Jer. 17:5–8]], [[2 Ne. 4:34]], and [[D&C 1:19–20]].

sources: [ot-manual-15, delitzsch, bdb, biblehub-interlinear, niv, sc-knowhy-451, lds-scriptures]
