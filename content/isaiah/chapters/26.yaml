chapter: 26
title: '“Thy Dead Men Shall Live”'
tagline: A song of the strong city, perfect peace for those who trust, and one of the clearest promises of resurrection in the Old Testament.
when: '“In that day,” the day of redemption'

setting: |
  Isaiah 26 is another song, “in that day shall this song be sung in the land of Judah” (verse 1). It follows the hymn of chapter 25. Where chapter 24 described the fall of the proud “city of confusion,” this song celebrates a different city, “a strong city” whose walls are salvation.

  Two passages stand out. Verse 3 promises “perfect peace” to those whose minds are stayed on the Lord. And verse 19 declares: “Thy dead men shall live… Awake and sing, ye that dwell in dust.” The *Old Testament Student Manual* calls it a clear statement of **resurrection**.

thread: |
  Isaiah 26 is a song about **waiting on the Lord through the night**, and it moves from confidence, to longing, to hope beyond death.

  It opens with **confidence** (verses 1–6). There is a strong city whose walls are made of salvation, and its gates are open to the righteous. Those who trust the Lord have “perfect peace,” because He is the “everlasting strength,” literally a “rock of ages.”

  Then it turns to **longing** (verses 7–18). The singers admit they are still waiting: “in the way of thy judgments, O LORD, have we waited for thee” (verse 8). “With my soul have I desired thee in the night” (verse 9). They confess that “other lords” have ruled over them (verse 13). They have labored like a woman giving birth, and brought forth only wind (verse 18). Their own efforts have brought no deliverance.

  Then comes the **breakthrough** (verse 19): “Thy dead men shall live, together with my dead body shall they arise. Awake and sing, ye that dwell in dust.” What human labor could not bring forth, God does. The earth itself gives up its dead.

  The chapter closes with tender counsel (verses 20–21): go into your room, shut the door, and hide “for a little moment,” until the indignation passes.

sections:
  - range: 1-6
    heading: The strong city
    plain: |
      In that day this song will be sung in the land of Judah: “We have a strong city. God makes salvation its walls and ramparts. Open the gates so the righteous nation that stays faithful may enter. You keep in perfect peace the one whose mind is steadfast, because he trusts in You. Trust in the Lord forever, for the Lord, the Lord Himself, is the Rock eternal. He humbles those who live on the heights; He brings the proud city down, down to the ground, down to the dust. The feet of the oppressed and the steps of the poor trample it.”
  - range: 7-11
    heading: Longing in the night
    plain: |
      The path of the righteous is level; You, the Upright One, make it smooth. Yes, Lord, walking in the way of Your judgments, we wait for You. Your name and Your renown are the desire of our hearts. My soul longs for You in the night; in the morning my spirit seeks You. When Your judgments come upon the earth, the people of the world learn righteousness. But when grace is shown to the wicked, they do not learn righteousness. Even in a land of uprightness they go on doing evil and do not see the Lord’s majesty. Lord, Your hand is raised, but they don’t see it. Let them see Your zeal for Your people and be put to shame; let the fire reserved for Your enemies consume them.
  - range: 12-18
    heading: What we could not do
    plain: |
      Lord, You establish peace for us; everything we have accomplished, You have done for us. Lord our God, other lords besides You have ruled over us, but Your name alone do we honor. Those others are dead and will not live again; their spirits will not rise. You punished them, destroyed them, and wiped out all memory of them. You have enlarged the nation, Lord; You have enlarged it and gained glory for Yourself. You have extended the borders of the land. Lord, in distress they came to You; when You disciplined them, they could barely whisper a prayer. Like a woman about to give birth who writhes and cries out in pain, so were we in Your presence, Lord. We were pregnant, we writhed in labor, but we gave birth to wind. We have not brought salvation to the earth, and the people of the world have not been born.
  - range: 19-21
    heading: The dead shall rise
    plain: |
      But Your dead will live; together with my dead body they will rise. Wake up and shout for joy, you who live in the dust! Your dew is like the dew of the morning, and the earth will give birth to its dead. Go, my people, enter your rooms and shut the doors behind you. Hide yourselves for a little while until His anger has passed. For look, the Lord is coming out of His dwelling to punish the people of the earth for their sins. The earth will reveal the blood shed on it and will no longer hide its slain.

notes:
  - ref: 1
    phrase: salvation will God appoint for walls and bulwarks
    kind: symbol
    title: Walls made of salvation
    body: |
      Compare this city with the “city of confusion” in [[Isa. 24:10]] and the fortified cities that fall throughout Isaiah. Jerusalem in chapter 22 worked frantically on its walls and forgot the Lord ([[Isa. 22:8–11]]). This city’s walls *are* salvation. Its defense is God Himself.

      The image returns later: “thou shalt call thy walls Salvation, and thy gates Praise” ([[Isa. 60:18]]). The walls are not dead stone but salvation itself, which the Lord sets in place.
    sources: [delitzsch]
  - ref: 2
    phrase: Open ye the gates, that the righteous nation which keepeth the truth may enter in
    kind: scripture
    title: Open the gates
    body: |
      Compare the entrance psalms, which ask who may enter the Lord’s house: “Who shall ascend into the hill of the LORD?… He that hath clean hands, and a pure heart” ([[Ps. 24:3–4]]; see [[Ps. 118:19–20]]).

      The righteous nation is one that “keepeth the truth,” established in covenant faithfulness to God. Nephi taught that “the gate by which ye should enter is repentance and baptism by water,” and that the keeper of the gate is the Holy One of Israel, who “employeth no servant there” ([[2 Ne. 31:17]]; [[2 Ne. 9:41]]).
    sources: [delitzsch, lds-scriptures]
  - ref: 3
    phrase: Thou wilt keep him in perfect peace, whose mind is stayed on thee
    kind: words
    title: Perfect peace
    body: |
      This is one of the most beloved verses in Isaiah. “Perfect peace” in Hebrew is simply *shalom shalom*: peace, peace, which can be read as a deep and constant peace.

      “Stayed” renders *samuk*, a mind that is firmly established because it has a firm hold on God. Such a mind is kept in peace “because he trusteth in thee.”

      The Savior promised the same: “Peace I leave with you, my peace I give unto you: not as the world giveth” ([[John 14:27]]). The Lord told Joseph Smith, “Look unto me in every thought; doubt not, fear not” ([[D&C 6:36]]).
    sources: [delitzsch, lds-scriptures]
  - ref: 4
    phrase: in the LORD JEHOVAH is everlasting strength
    kind: christ
    title: The Rock of Ages
    body: |
      “Everlasting strength” translates the Hebrew *tsur ʿolamim*, literally **“Rock of ages”** or “eternal Rock.” The KJV prints the divine name as “JEHOVAH” here, and the Bible Dictionary cites this verse for the name, with [[Ex. 6:3]], [[Ps. 83:18]], and [[Isa. 12:2]]. The combination “Jah Jehovah” occurs only here and in Isaiah 12:2.

      The Book of Mormon identifies the Rock clearly: “remember that it is upon the rock of our Redeemer, who is Christ, the Son of God, that ye must build your foundation” ([[Hel. 5:12]]). The Savior said, “whoso buildeth upon this buildeth upon my rock” ([[3 Ne. 11:39]]).
    sources: [bd-jehovah, delitzsch, biblehub-interlinear, lds-scriptures]
  - ref: 9
    phrase: when thy judgments are in the earth, the inhabitants of the world will learn righteousness
    kind: scripture
    title: Why judgments come
    body: |
      This verse explains the purpose of the Lord’s judgments: to teach. Verse 10 adds the corollary: when favor is shown to the wicked, they do not learn righteousness, and even in a land of uprightness they go on doing wrong.

      The Book of Mormon illustrates this repeatedly. Mormon observed that “except the Lord doth chasten his people with many afflictions… they will not remember him” ([[Hel. 12:3]]).
    sources: [delitzsch, lds-scriptures]
  - ref: 12
    phrase: for thou also hast wrought all our works in us
    kind: christ
    title: Everything we have done, You did
    body: |
      This is a remarkable confession. Everything good that the people accomplished was really the Lord working in them. It’s the same insight Paul expressed: “it is God which worketh in you both to will and to do of his good pleasure” ([[Philip. 2:13]]).

      This doesn’t erase our agency or effort. It recognizes that even our righteous works are enabled by His grace. Nephi taught, “it is by grace that we are saved, after all we can do” ([[2 Ne. 25:23]]). Moroni taught that it is by His grace that we can become perfect in Christ ([[Moro. 10:32–33]]). The Bible Dictionary describes grace as an “enabling power” by which people “receive strength and assistance to do good works that they otherwise would not be able to maintain if left to their own means.”
    sources: [bd-grace, lds-scriptures]
  - ref: 14
    phrase: They are dead, they shall not live; they are deceased, they shall not rise
    kind: words
    title: The dead tyrants won’t rise
    body: |
      “Deceased” here is *rephaim*, “shades,” the dead in the region of Sheol. The “other lords” who once ruled over Israel (verse 13) are gone for good. Their power and their memory have perished.

      This line sets up verse 19. The oppressors “shall not live” or “rise.” But the Lord’s people will: “Thy dead men shall live.” The line doesn’t deny a resurrection; the prophet knew of one. It says the tyrants who were thrust down to the shades can never rise to rule again. The Restoration teaches that all will be resurrected ([[John 5:28–29]]; [[Alma 11:41–44]]), so the verse concerns the tyrants’ *reign*.
    sources: [delitzsch, lds-scriptures]
  - ref: 18
    phrase: we have as it were brought forth wind
    kind: symbol
    title: Laboring and bringing forth wind
    body: |
      This is a devastating image of futility. The people went through all the pain of labor, and nothing came of it. “We have not wrought any deliverance in the earth.” Their best efforts at self-salvation produced nothing but air.

      It’s the honest confession that sets up verse 19. Deliverance can’t be born from human effort alone. Only the Lord can bring life out of death. Compare the later picture of Zion giving birth easily, because the Lord brings it to pass ([[Isa. 66:7–9]]).

      The Hebrew may add an echo. The “pangs” of verse 17 (*ḥăbālîm*) sound like the word for “cords” or “bands,” as in the “cords of death” of Psalm 18:4 (KJV “sorrows of death”). The lexicon BDB lists “pang” and “cord” as two separate entries, but one Latter-day Saint reading treats *ḥebel* as a single word that covers both “cord, rope, band” and “pain, pang, travail,” and hears in it the phrase Abinadi used for what Christ would do: He “breaketh the bands of death” ([[Mosiah 15:8]]). Whether Isaiah meant a pun is uncertain. Israel in labor could not bring forth deliverance; the next verse says who can.
    sources: [bdb, sc-knowhy-93]
  - ref: 19
    phrase: Thy dead men shall live, together with my dead body shall they arise
    kind: christ
    title: The resurrection
    body: |
      This is a clear promise of **resurrection** in the Old Testament; compare [[Dan. 12:2]] and [[Job 19:25–27]]. The dead will *live* and *arise*.

      The phrase “together with my dead body shall they arise” is striking. The Hebrew reads “my corpse” (*nevelati*), the speaker claiming the dead as his own; one reading hears the community of the faithful speaking of its dead. The *Old Testament Student Manual* calls the verse a clear statement of the fact of resurrection, “the Lord’s and our own.” Matthew records a rising of the dead after Jesus rose: “the graves were opened; and many bodies of the saints which slept arose, and came out of the graves after his resurrection” ([[Matt. 27:52–53]]). The risen Lord made sure the Nephites recorded Samuel the Lamanite’s prophecy that the same would happen in the Americas ([[3 Ne. 23:9–13]]; [[Hel. 14:25]]).

      Beyond the community reading above, “my dead body” can be read as the Messiah’s own: “Thy dead men shall live, together with my [the Messiah’s] dead body shall they arise.” Read this way, the verse sets Jehovah’s promise against verse 14, whose dead “shall not rise” (this reading takes them to be the false gods many then worshipped, where the note on that verse takes them to be Israel’s former rulers), and ties the rising of all humankind to the resurrection of the Messiah.
    sources: [ot-manual-15, delitzsch, lds-scriptures, rsc-ball-isaiah-messiah]
  - ref: 19
    phrase: Awake and sing, ye that dwell in dust
    kind: scripture
    title: Awake from the dust
    body: |
      “Awake and sing” is a resurrection morning image: those sleeping in the dust wake up singing. “Thy dew is as the dew of herbs” compares the Lord’s life-giving power to dew. The Hebrew word behind “herbs” can also be read as “lights,” which one reading takes as the lights of life. “The earth shall cast out the dead” uses a form of the verb behind “fallen” in verse 18, which one reading takes as the falling of a child from the womb; the NIV renders “the earth will give birth to her dead,” completing the labor imagery of verses 17–18. What we couldn’t bring forth, the earth now delivers.

      Moroni echoed Isaiah’s call in his final words: “Awake, and arise from the dust, O Jerusalem” ([[Moro. 10:31]]; see [[Isa. 52:1–2]]). Latter-day revelation promises that at the Lord’s coming “they who have slept in their graves shall come forth, for their graves shall be opened” ([[D&C 88:97]]; see [[D&C 29:13]]).
    sources: [delitzsch, niv, lds-scriptures]
  - ref: 20
    phrase: Come, my people, enter thou into thy chambers, and shut thy doors about thee
    kind: history
    title: Hide until the wrath passes
    body: |
      The singing stops and the prophet speaks again: the Lord tells His people to go inside and hide “for a little moment, until the indignation be overpast.” One reading takes this as the people of God staying in the solitude of prayer while judgment goes out, hidden in God as Noah was shut in the ark. The judgment lasts only a little while, and it is the Lord’s act alone.
    sources: [delitzsch]
  - ref: 21
    phrase: the earth also shall disclose her blood, and shall no more cover her slain
    kind: history
    title: The earth will testify
    body: |
      When Cain killed Abel, the Lord said, “the voice of thy brother’s blood crieth unto me from the ground” ([[Gen. 4:10]]). Isaiah pictures the earth giving up the blood it has absorbed. One reading finds two witnesses here: the shed blood itself, and the slain who lie in the earth.

      Moroni foresaw a day when “the blood of saints shall cry unto the Lord” ([[Morm. 8:27]]; see [[Morm. 8:40]]; [[Ether 8:22]]).
    sources: [delitzsch, lds-scriptures]

christ: |
  Isaiah 26 is a song to Christ, the **Rock of ages** (verse 4), who keeps in “perfect peace” those whose minds lean on Him (verse 3). He is the one who has “wrought all our works in us” (verse 12), by the grace that, in the Bible Dictionary’s words, enables people to “do good works that they otherwise would not be able to maintain.”

  Above all, He is the resurrection (verse 19). The people’s own labor brought forth only wind (verse 18). But Christ broke the bands of death, and because of Him “thy dead men shall live.” When He rose, the graves of the Saints were opened ([[Matt. 27:52–53]]; [[3 Ne. 23:9–11]]). One day He will say to all who sleep in the dust, “Awake and sing.”

explore: |
  - **Resurrection in the Old Testament.** Read Isaiah 26:19, [[Job 19:25–27]], [[Ezek. 37:1–14]], and [[Dan. 12:2]]. Then read [[Alma 40:19–23]] and [[Alma 11:42–45]].
  - **Perfect peace.** Compare Isaiah 26:3 with [[Philip. 4:6–7]], [[John 14:27]], and [[D&C 19:23]].
  - **Protection through judgment.** Read Isaiah 26:20–21 with [[Ex. 12:21–27]] and [[D&C 89:21]].

parallels:
  - ref: Matt. 27:52–53
    note: The graves opened at Christ’s resurrection.
  - ref: 3 Ne. 23:9–13
    note: The Savior asks that the fulfillment of the resurrection prophecy be recorded.

