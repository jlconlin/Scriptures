chapter: 1
title: The Lord Takes His People to Court
tagline: A rebellious people, a devastated land, a religion full of ritual and empty of mercy, and a Judge who offers to wash them clean.
when: 'Isaiah’s ministry c. 740–700 BC; verses 7–9 likely reflect the Assyrian invasion of 701 BC'

setting: |
  Isaiah son of Amoz prophesied in Jerusalem for about forty years, under four kings of Judah ([[Isa. 1:1]]). Uzziah’s long, prosperous reign was ending. Ahaz panicked and bought protection from Assyria. Hezekiah tried to lead the nation back to the Lord. Hanging over all of it was **Assyria**, the superpower of the day, which swallowed the northern kingdom of Israel in 722 BC and then turned toward Judah.

  Chapter 1 probably isn’t the first sermon Isaiah preached. It is the **overture** to the whole book, placed first because it sounds nearly every theme that follows: rebellion, judgment, a surviving remnant, empty worship, social justice, cleansing, and the redemption of Zion. The Bible Dictionary calls it “a prologue to the rest of the book.” If you understand Isaiah 1, you have a map for the next sixty-five chapters.

thread: |
  The best way into Isaiah 1 is to notice that **it’s a courtroom scene**. Biblical scholars call this form a *covenant lawsuit*. The Lord summons witnesses, reads the charges, hears the defense, and pronounces a verdict. The witnesses are “heavens” and “earth” (verse 2), the same two Moses called to witness Israel’s covenant ([[Deut. 30:19]]; [[Deut. 32:1]]). So from the first line we know what this is about: Israel has broken a covenant, and the covenant’s own witnesses have been called to testify.

  The charges come in layers. First, Israel doesn’t *know* its Father; even livestock know who feeds them (verses 2–4). Second, the nation is a beaten body, bruised from head to foot, and still won’t stop rebelling (verses 5–6). Third, the land lies in ruins, with Jerusalem left standing alone like a flimsy hut in a stripped field (verses 7–9).

  Then comes the surprise. If you expect the defendants to be irreligious, you’d be wrong. Verses 10–15 describe a nation **full of worship**: sacrifices, incense, Sabbaths, holy days, crowded temple courts, many prayers. And the Lord says He is sick of all of it. The reason comes at the end of verse 15: “your hands are full of blood.” Their religion has become a performance that sits comfortably beside injustice. What He wants appears in verses 16–17, and it is almost startlingly concrete: stop doing evil, defend the fatherless, plead for the widow.

  At this point in a lawsuit we expect a sentence. Instead the Judge makes an offer: “Come now, and let us reason together” (verse 18). The phrase is legal language, something like *let’s settle this case*. His terms are astonishing: scarlet sins made white as snow. The chapter still ends with fire, but even that fire is a refiner’s fire (verse 25). He means to burn away the dross, not destroy the silver, until Jerusalem is once again “the city of righteousness, the faithful city” (verse 26).

  So Isaiah 1 moves from **courtroom** to **temple** to **city street** to **smelting furnace**, and the question underneath every stage is the same: *Will you let Me make you clean?* That question runs through the whole book of Isaiah, and through the gospel.

sections:
  - range: '1'
    heading: The vision of Isaiah
    plain: |
      This is what Isaiah saw about Judah and Jerusalem during the reigns of four kings.
  - range: 2-9
    heading: Children who don’t know their Father
    plain: |
      Heaven and earth, listen! The Lord raised children and they rebelled. Even an ox knows its owner, but My people don’t know Me. The nation is like a body beaten from head to foot, and still it keeps rebelling. The land is burned and occupied. Jerusalem is left standing alone like a shed in an abandoned field. If the Lord hadn’t spared a few survivors, we would have been wiped out like Sodom.
  - range: 10-17
    heading: Worship without righteousness
    plain: |
      Listen, you leaders who are no better than Sodom! What good are all your sacrifices? I’m sick of them. Your holy days and meetings mean nothing while you keep sinning. When you raise your hands to pray, I won’t look, because your hands are covered in blood. Wash yourselves. Stop doing evil. Learn to do good: seek justice, rescue the oppressed, defend orphans, and plead for widows.
  - range: 18-20
    heading: '“Let us reason together”'
    plain: |
      Come, let’s settle this. Though your sins are deep red, they can become white as snow. If you are willing and obey, you’ll eat the best of the land. If you refuse and rebel, the sword will eat you.
  - range: 21-31
    heading: The faithful city refined
    plain: |
      How the faithful city has become unfaithful! It was full of justice; now it’s full of murderers. Its silver has turned to slag and its wine is watered down. Its leaders take bribes and ignore orphans and widows. So the Lord will act. He will melt down the city and burn away its impurities. He will give it honest judges again, and it will be called the city of righteousness. Zion will be redeemed through justice. Those who cling to idols will be burned up like dry fiber touched by a spark.

notes:
  - ref: 1
    phrase: Isaiah the son of Amoz
    kind: words
    title: What’s in a name?
    body: |
      *Isaiah* (Hebrew *Yeshaʿyahu*) means **“the Lord is salvation”** or “Jehovah saves.” The name is essentially the same as *Joshua* and *Jesus* (*Yehoshua*, *Yeshua*): “Jehovah saves.” In a book whose great subject is salvation through the Holy One of Israel, the prophet’s own name is a one-word summary of his message.

      Amoz, his father, is not the prophet Amos. The names are spelled differently in Hebrew. Jewish tradition held that Isaiah came from a noble family in Jerusalem, which would explain his easy access to kings ([[Isa. 7:3]]; [[Isa. 37:2]]).
    sources: [bd-isaiah]
  - ref: 1
    phrase: Uzziah, Jotham, Ahaz, and Hezekiah
    kind: history
    title: Four kings, forty years
    body: |
      These four reigns span roughly 790–686 BC, and Isaiah’s ministry fits in the latter part (about 740–700 BC, according to the Bible Dictionary). Each king gives a different backdrop to his words:

      - **Uzziah** (also called Azariah) brought prosperity but grew proud and was struck with leprosy ([[2 Chr. 26:16–21]]). Isaiah’s temple vision came “in the year that king Uzziah died” ([[Isa. 6:1]]).
      - **Jotham** was a mostly good king who did not remove the high places ([[2 Kgs. 15:32–35]]).
      - **Ahaz** was faithless. He sacrificed his own son and bought Assyria’s help instead of trusting the Lord ([[2 Kgs. 16]]). Isaiah 7 is Isaiah’s confrontation with him.
      - **Hezekiah** was a reformer who trusted the Lord when Assyria surrounded Jerusalem ([[2 Kgs. 18–20]]; [[Isa. 36–39]]). Isaiah was his chief counselor.

      Knowing which king is on the throne often unlocks a chapter.
    sources: [bd-uzziah, bd-ahaz, bd-hezekiah, ot-manual-f]
  - ref: 2
    phrase: Hear, O heavens, and give ear, O earth
    kind: symbol
    title: Calling the witnesses
    body: |
      In the ancient Near East, treaties between a great king and a subject people were witnessed by the gods of heaven and earth. Israel’s covenant with Jehovah borrowed the form but not the theology: there were no other gods, so Moses called the **heavens and the earth themselves** as witnesses ([[Deut. 30:19]]; [[Deut. 32:1]]).

      When Isaiah opens with the same words, every Israelite who knew Deuteronomy would recognize what was happening: *the covenant witnesses are being summoned to court.* The Lord opens the Doctrine and Covenants the same way, summoning “ye people from afar; and ye that are upon the islands of the sea” to listen to His voice of warning ([[D&C 1:1–4]]).
    sources: [oswalt, parry-understanding]
  - ref: 2
    phrase: I have nourished and brought up children
    kind: christ
    title: A Father’s complaint
    body: |
      Notice the first charge. It isn’t “My subjects broke My laws” but “My **children** rebelled.” The Hebrew verbs mean to raise, rear, make great. This is a parent who has fed, clothed, and raised a child, only to have the child turn away.

      That sets the emotional key for the whole book. Isaiah’s God is holy and terrifying, but His anger is always the grief of a Father. Later He will say that a mother might forget her nursing child, “yet will I not forget thee” ([[Isa. 49:15]]).
  - ref: 3
    phrase: the ass his master’s crib
    kind: symbol
    title: Even the livestock know
    body: |
      A *crib* in 1611 English is a feeding trough, a **manger**. Isaiah’s point is almost comic: an ox knows who owns it, and a donkey knows where its dinner comes from. Israel, supposedly wiser than livestock, doesn’t recognize the One who feeds it.

      A delightful footnote from church history: the ox and donkey that appear in nearly every Christmas nativity scene aren’t mentioned in Luke’s account at all. Early Christians put them there because of this verse. They saw a fulfillment in the animals gathered around the manger where the Master of Israel lay, whom “his own received him not” ([[John 1:11]]).
  - ref: 3
    phrase: Israel doth not know
    kind: words
    title: '“Know” is covenant language'
    body: |
      In Hebrew, *to know* (*yadaʿ*) is more than having information. It means intimate, loyal, covenant relationship. The Lord “knew” Abraham in the sense of choosing him ([[Gen. 18:19]], where the KJV translates it “I know him”). Hosea says the Lord desired “the knowledge of God more than burnt offerings” ([[Hosea 6:6]]).

      So “Israel doth not know” doesn’t mean Israel lacks facts about God. It means Israel has stopped living in relationship with Him. The Savior used the same idea: “this is life eternal, that they might **know** thee” ([[John 17:3]]); and He warned of those He would dismiss with “I never knew you” ([[Matt. 7:23]]).
  - ref: 4
    phrase: the Holy One of Israel
    kind: christ
    title: Isaiah’s signature name for God
    body: |
      This title appears about twenty-five times in Isaiah and only a handful of times in the rest of the Old Testament. Isaiah seems to have taken it from his temple vision, where the seraphim cried “Holy, holy, holy” ([[Isa. 6:3]]). It holds two ideas together: God is utterly **holy**, set apart and unlike us, and yet He is **of Israel**, bound to a people by covenant.

      The Book of Mormon makes clear who the Holy One of Israel is. Nephi calls Him the one who would be crucified, and the Savior Himself says, “I am the God of Israel” ([[1 Ne. 19:13–14]]; [[2 Ne. 9:41]]; [[3 Ne. 11:14]]). When you read “Holy One of Israel” in Isaiah, you can read it as a name of Jesus Christ.
    sources: [bd-holy-one, gs-holy-one]
  - ref: 5
    phrase: the whole head is sick, and the whole heart faint
    kind: symbol
    title: A body beaten from head to foot
    body: |
      Isaiah switches metaphors. The nation is now a body that has been beaten so badly there’s no healthy spot left: open wounds, welts, and sores that no one has cleaned, bandaged, or soothed with oil (verse 6).

      The haunting question in verse 5 is “Why should ye be stricken any more?” In other words, *what more discipline could possibly help?* They have been hit again and again and have only rebelled more. The point is that punishment by itself doesn’t heal. The body needs a physician, and verse 18 will introduce one. Isaiah will later describe a Servant who takes the stripes on Himself so that “with his stripes we are healed” ([[Isa. 53:5]]).
  - ref: 7
    phrase: your cities are burned with fire
    kind: history
    title: Judah after the Assyrian invasion
    body: |
      This description fits Judah after **701 BC** almost exactly. In that year the Assyrian king Sennacherib swept through the countryside. His own royal inscription, preserved on a clay prism now in the British Museum, boasts that he captured forty-six of Hezekiah’s fortified cities and shut Hezekiah up in Jerusalem “like a bird in a cage.”

      That is the picture in verses 7–8: every town burned and occupied by foreigners, and Jerusalem, still standing, alone in a ravaged land. Isaiah tells the rest of the story, how the Lord delivered Jerusalem, in chapters 36–37.
    sources: [taylor-prism, bd-sennacherib]
  - ref: 8
    phrase: as a cottage in a vineyard, as a lodge in a garden of cucumbers
    kind: symbol
    title: A shed in an empty field
    body: |
      During harvest, Israelite farmers built temporary booths of branches in their vineyards and melon patches so a watchman could guard the crop day and night. After the harvest they were abandoned, and a flimsy shelter stood alone in a stripped field.

      That is Jerusalem, “the daughter of Zion”: still standing, but only just, fragile and isolated, with everything around it gone. It’s a humbling image for a proud capital. (A *cottage* in 1611 English was any small hut, and a *lodge* was a watchman’s shelter.)
    sources: [parry-visualizing]
  - ref: 9
    phrase: a very small remnant
    kind: restoration
    title: The remnant, one of Isaiah’s great themes
    body: |
      Here is the first appearance of one of Isaiah’s most important ideas: the **remnant**. Judgment falls, but the Lord always preserves a few, and from those few He rebuilds. Isaiah even named one of his sons *Shear-jashub*, meaning *a remnant shall return* ([[Isa. 7:3]]; [[Isa. 10:20–22]]).

      Paul quoted this verse to explain why only some of Israel accepted Christ ([[Rom. 9:27–29]]). The Book of Mormon applies the same idea to Lehi’s descendants, a “remnant of the house of Israel” whom the Lord would gather in the last days ([[1 Ne. 13:34]]; [[3 Ne. 20:16]]; [[3 Ne. 21:12]]). The gathering of Israel, which President Russell M. Nelson has called “the most important thing taking place on earth today,” is in Isaiah’s terms the return of the remnant.
    sources: [nelson-hope-israel, nelson-gathering]
  - ref: 10
    phrase: ye rulers of Sodom
    kind: history
    title: A deliberate insult
    body: |
      Verse 9 said, *we were almost destroyed like Sodom.* Verse 10 turns the word into an accusation: *you **are** Sodom.* Imagine the rulers of Jerusalem, proud of their temple and their lineage from Abraham, hearing themselves addressed as the leaders of the most notorious city in their history.

      Why Sodom? Ezekiel later explains that Sodom’s sins included pride, “fulness of bread,” and ignoring “the poor and needy” ([[Ezek. 16:49]]). That is exactly the charge Isaiah is about to level: comfortable religious people who do nothing for the fatherless and the widow (verses 17, 23).
    sources: [bd-sodom]
  - ref: 11
    phrase: To what purpose is the multitude of your sacrifices unto me?
    kind: symbol
    title: Did God reject sacrifice?
    body: |
      The Lord Himself commanded these sacrifices through Moses, so He isn’t rejecting the ordinances. He is rejecting **ordinances performed by people who aren’t trying to live what the ordinances mean**. Sacrifice pointed to the Lamb of God and required a “broken heart and a contrite spirit” ([[Ps. 51:16–17]]; [[3 Ne. 9:19–20]]). When the offering becomes a substitute for righteousness instead of an expression of it, God calls it “vain.”

      Samuel said something similar: “to obey is better than sacrifice” ([[1 Sam. 15:22]]). So did Hosea, Amos, Micah, and Jesus ([[Hosea 6:6]]; [[Amos 5:21–24]]; [[Micah 6:6–8]]; [[Matt. 9:13]]).
    sources: [bd-sacrifices]
  - ref: 13
    phrase: it is iniquity, even the solemn meeting
    kind: words
    title: Iniquity and the solemn meeting
    body: |
      The Hebrew here is compressed: literally, “I cannot bear **iniquity and solemn assembly**.” The Lord isn’t objecting to meetings. He is objecting to the combination, sin on Monday and a sacred assembly on the Sabbath, as though the one covered the other.

      *New moons* (monthly festivals), *sabbaths*, and *appointed feasts* were all commanded holy days ([[Num. 28–29]]). Latter-day Saints still hold “solemn assemblies” to sustain a new First Presidency. The warning applies to us: the Lord’s own appointed meetings can become “a trouble unto me” (verse 14) if we bring an unchanged heart to them.
    sources: [bd-new-moon, bd-sabbath]
  - ref: 15
    phrase: when ye spread forth your hands
    kind: symbol
    title: Hands raised in prayer, stained with blood
    body: |
      Israelites often prayed standing with their arms raised and palms open toward heaven ([[1 Kgs. 8:22]]). Picture that posture, and then the Lord’s response: *I’ll look away, because those open palms are covered in blood.*

      “Blood” here probably includes literal violence (see verse 21, “murderers”) but also the slower violence of exploiting the poor. It echoes the Psalm about who may ascend the Lord’s hill: “He that hath clean hands, and a pure heart” ([[Ps. 24:3–4]]). Clean hands are what we do; a pure heart is what we are. The Lord wants both.
  - ref: 17
    phrase: relieve the oppressed, judge the fatherless, plead for the widow
    kind: liken
    title: What God actually asks for
    body: |
      After all the talk of sacrifices and feasts, the cure is very ordinary: *learn to do good.* Seek justice. Set right the oppressed. Take up the orphan’s case. Argue on behalf of the widow. In Israel, orphans and widows had no male protector in a legal system run by men; they were the easiest people to ignore and to cheat.

      James called caring for “the fatherless and widows” a mark of “pure religion” ([[James 1:27]]). King Benjamin taught that we retain a remission of our sins by imparting to the poor ([[Mosiah 4:26]]). Isaiah is saying the same thing seven centuries earlier: worship that doesn’t make us kinder is not the worship God asked for.
  - ref: 18
    phrase: let us reason together
    kind: words
    title: '“Let’s settle this case”'
    body: |
      The Hebrew verb (*yakach*) is a courtroom word: to argue a case, reach a verdict, settle a dispute. We’re still in the lawsuit that began in verse 2. The Judge has laid out the evidence, and it is damning. Now, instead of sentencing, He invites the defendants to come and settle.

      That changes how we hear the verse. “Let us reason together” isn’t a polite invitation to discussion. It is a **plea bargain offered by the Judge Himself**, on terms entirely in the defendant’s favor. He supplies the cleansing, and the defendant supplies willingness (verse 19).
    sources: [bdb, oswalt]
  - ref: 18
    phrase: though your sins be as scarlet, they shall be as white as snow
    kind: christ
    title: Scarlet made white
    body: |
      Scarlet and crimson dyes in the ancient world came from the crushed bodies of a small insect. The color was prized because it was **colorfast**: it did not wash out. That is Isaiah’s point. These sins are not surface stains. They are dyed into the fabric, and no human scrubbing will get them out.

      Yet the Lord promises they can become white as snow, like undyed wool. Only one thing does that. John saw the redeemed who “washed their robes, and made them white in the blood of the Lamb” ([[Rev. 7:14]]; see [[Alma 5:21]]; [[1 Ne. 12:10–11]]). Notice the paradox: something red makes the scarlet white.

      President Boyd K. Packer quoted this verse to reassure those burdened by past sins that the Atonement can bring “the brilliant morning of forgiveness.”
    sources: [packer-forgiveness]
  - ref: 20
    phrase: ye shall be devoured with the sword
    kind: words
    title: Eat, or be eaten
    body: |
      English hides a sharp piece of Hebrew wordplay. Verse 19 promises “ye shall **eat** (*tokelu*) the good of the land.” Verse 20 warns “ye shall be **devoured** (*teʾukkelu*) with the sword,” which uses the same verb, *ʾakal*, in the passive. Literally: *if you are willing, you will eat; if you rebel, you will be eaten.*

      The Lord repeated the promise of verse 19 to the early Saints: “the willing and obedient shall eat the good of the land of Zion in these last days” ([[D&C 64:34]]). The next verse in that revelation also echoes Isaiah: “the rebellious shall be cut off” ([[D&C 64:35]]).
    sources: [bdb]
  - ref: 21
    phrase: How is the faithful city become an harlot!
    kind: symbol
    title: A marriage betrayed
    body: |
      The prophets often describe the covenant between the Lord and Israel as a **marriage**, with the Lord as the faithful husband ([[Hosea 2:19–20]]; [[Isa. 54:5]]; [[Jer. 3:14]]). So when Isaiah calls Jerusalem a harlot, he is not changing the subject to sexual sin. He is describing covenant unfaithfulness: going after other “lovers,” whether idols, foreign alliances, or money.

      The word “How” (*ʾekah*) is the opening cry of a funeral lament. It is the same word that opens the book of Lamentations. Isaiah is singing a dirge over a city that is still alive.
  - ref: 22
    phrase: Thy silver is become dross, thy wine mixed with water
    kind: symbol
    title: Watered-down wine and fake silver
    body: |
      Two pictures of adulteration. *Dross* is the scum that separates from molten silver during refining; silver that has “become dross” looks precious but is worthless. Wine cut with water still looks like wine but has lost its strength. Both were also common ways merchants cheated customers.

      So the images work on two levels: literal dishonesty in the marketplace, and a people whose righteousness has been quietly diluted until it only resembles the real thing. Verse 25 answers the first image directly: the Lord will refine the silver.
  - ref: 23
    phrase: every one loveth gifts, and followeth after rewards
    kind: history
    title: Bribery in the courts
    body: |
      “Gifts” and “rewards” here are **bribes**. Judges and officials sold verdicts, so the people with the weakest claims to justice, orphans and widows, never got a hearing: “neither doth the cause of the widow come unto them.” The law of Moses explicitly forbade it: “thou shalt not wrest judgment… neither take a gift” ([[Deut. 16:19]]). Isaiah returns to the theme often ([[Isa. 5:23]]; [[Isa. 10:1–2]]).
  - ref: 25
    phrase: purely purge away thy dross, and take away all thy tin
    kind: christ
    title: The Refiner’s fire
    body: |
      This is the language of a silversmith. Ore was melted in a furnace, often with lye (the Hebrew behind “purely” may mean “as with lye”), and the impurities, dross and base metal (the Hebrew *bedil*, translated “tin”), were skimmed away until pure silver remained.

      Notice that the fire is **for** the silver, not against it. The Lord’s judgment here is purification. Malachi uses the same image for the Savior: “he is like a refiner’s fire… and he shall sit as a refiner and purifier of silver” ([[Mal. 3:2–3]]; [[3 Ne. 24:2–3]]). Isaiah later hears the Lord say, “I have refined thee… in the furnace of affliction” ([[Isa. 48:10]]). The heat is real, but the goal is to recover something precious.
  - ref: 26
    phrase: I will restore thy judges as at the first
    kind: restoration
    title: A restoration promised
    body: |
      This is a *restoration* promise: not something new, but a return to what was at the beginning. After the refining, Jerusalem gets back honest judges and counselors and a new name, “The city of righteousness, the faithful city.” In Isaiah, a new name marks a new identity ([[Isa. 62:2–4]]).

      Latter-day Saints will hear an echo of the Restoration here: the Lord restoring what had been lost, including authorized servants to judge and counsel His people. Verse 27 states the principle behind it: “Zion shall be redeemed with judgment,” that is, with **justice**. The Lord told the early Saints the same thing: “Zion cannot be built up unless it is by the principles of the law of the celestial kingdom” ([[D&C 105:5]]).
  - ref: 29
    phrase: the oaks which ye have desired
    kind: history
    title: Sacred trees and garden shrines
    body: |
      The “oaks” (large sacred trees, perhaps terebinths) and “gardens” refer to outdoor shrines where Israelites worshipped fertility gods, often associated with the goddess Asherah. The Bible Dictionary’s entry for *Grove* explains that the “groves” of the KJV are mostly cult objects of this kind. People went there hoping for rain, crops, and children.

      Verse 30 then turns the idols into the punishment: *you will become like the tree you worshipped, a withered oak, a garden with no water.* The Psalms state the principle: those who make idols “are like unto them” ([[Ps. 115:4–8]]). We become like what we worship.
    sources: [bd-grove, bd-high-places]
  - ref: 31
    phrase: the strong shall be as tow, and the maker of it as a spark
    kind: symbol
    title: Tinder and spark
    body: |
      *Tow* is the short, fluffy fiber left over from processing flax, and it catches fire instantly. The “strong” man, the powerful person who trusted in idols, turns out to be tinder. And “the maker of it” (better, *his work*, meaning the idol he made) becomes the spark that ignites him.

      Sin carries its own destruction inside it. The fire that “none shall quench” reappears in the very last verse of Isaiah ([[Isa. 66:24]]), one of many ways chapter 1 and chapter 66 bracket the book.

christ: |
  Isaiah 1 introduces Jesus Christ under His Old Testament name and title, **Jehovah, the Holy One of Israel** (verse 4). Then it shows what kind of God He is. He is a **Father** grieving over children who don’t know Him (verse 2). He is a **Judge** who, with the evidence overwhelming, steps down from the bench to offer a settlement no defendant could deserve (verse 18). He is a **Refiner** whose fire is meant to recover silver, not destroy it (verse 25).

  Above all, He is the one who makes scarlet white. The Book of Mormon tells us how: “the blood of the Lamb” ([[1 Ne. 12:10–11]]; [[Alma 5:21]]). Isaiah will spend the rest of his book explaining how that cleansing is possible, most unforgettably in chapter 53. Chapter 1 gives the invitation: *Come now.*

liken: |
  Isaiah’s original audience was not openly irreligious. They were **busy** with worship. That makes the chapter uncomfortable for faithful Latter-day Saints in a helpful way. A few questions worth sitting with:

  - Where could my religious activity be substituting for righteousness instead of expressing it? Is there a “widow” or “fatherless” person in my ward, my family, or my neighborhood whose cause hasn’t “come unto” me (verse 23)?
  - Verse 3 asks whether I *know* my Master. Could the ox and the donkey teach me anything about recognizing who has been feeding me?
  - The Lord’s offer in verse 18 has one condition in verse 19: *willing and obedient*. Which do I find harder: the willingness or the obedience?
  - When my life feels like a refiner’s fire, can I trust that the heat is meant for the silver?

explore: |
  - **Bookends.** Read Isaiah 1 and Isaiah 66 side by side. Look for rebellion (1:2; 66:24), gardens (1:29; 66:17), empty sacrifices (1:11; 66:3), new moons and sabbaths (1:13; 66:23), and unquenchable fire (1:31; 66:24). The book opens and closes with the same themes, but chapter 66 ends with “all flesh” coming to worship.
  - **Malachi 3.** Malachi closes the Old Testament where Isaiah 1 opens it: a people doing religious things while God asks them to *return*, and a Refiner who comes to purify the sons of Levi ([[Mal. 3:1–7]]). Reading them together is illuminating.
  - **Alma 5.** Alma’s great sermon on whether we have received His image in our countenances is full of Isaiah 1’s language of cleansing, garments washed white, and the invitation to come ([[Alma 5:14–33]]; [[Alma 5:62]]).

parallels:
  - ref: Rom. 9:29
    note: Paul quotes verse 9 on the remnant.
  - ref: D&C 64:34–35
    note: The Lord repeats verses 19–20 to the Saints in Kirtland (1831).
  - ref: Alma 5:21–24
    note: Alma echoes the imagery of garments washed white.

sources: [bd-isaiah, mcconkie-keys, parry-understanding, ball-winn, oswalt]
