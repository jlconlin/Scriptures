chapter: 1
title: The Lord Takes His People to Court
tagline: A rebellious people, a devastated land, a religion full of ritual and empty of mercy, and a Judge who offers to wash them clean.
when: 'Isaiah’s ministry c. 740–701 BC; verses 7–9 fit either the Syro-Ephraimite war under Ahaz or Sennacherib’s invasion of 701 BC'

setting: |
  Isaiah son of Amoz prophesied in Jerusalem for about forty years, under four kings of Judah ([[Isa. 1:1]]). Uzziah’s 52-year reign had made Judah a strong military power with improved agriculture, and Isaiah’s ministry began toward its close. Ahaz rejected Isaiah’s counsel and sought an alliance with Assyria, paying tribute from the temple and throne treasuries. Hezekiah purged the land of the idolatry of his father and reopened the temple. Hanging over all of it was **Assyria**, the superpower of the day, which destroyed the northern kingdom of Israel in 722 BC and, under Sennacherib, swept into Judah in 701 BC.

  Chapter 1 works as the **overture** to the whole book, and it sounds nearly every theme that follows: rebellion, judgment, a surviving remnant, empty worship, social justice, cleansing, and the redemption of Zion. The Bible Dictionary calls it “a prologue to the rest of the book.” If you understand Isaiah 1, you have a map for the next sixty-five chapters.

thread: |
  The best way into Isaiah 1 is to notice that **it’s a courtroom scene**. Biblical scholars call this form a *prophetic lawsuit*. The Lord summons witnesses, lays out the charges, and challenges the defendants to a formal trial. The witnesses are “heavens” and “earth” (verse 2), the same two Moses called to witness Israel’s covenant ([[Deut. 30:19]]; [[Deut. 32:1]]). So from the first line we know what this is about: Israel has broken a covenant, and the covenant’s own witnesses have been called to testify.

  The charges come in layers. First, Israel doesn’t *know* its Father; even livestock know who feeds them (verses 2–4). Second, the nation is a beaten body, bruised from head to foot, and still won’t stop rebelling (verses 5–6). Third, the land lies in ruins, with Jerusalem left standing alone like a flimsy hut in a stripped field (verses 7–9).

  Then comes the surprise. If you expect the defendants to be irreligious, you’d be wrong. Verses 10–15 describe a nation **full of worship**: sacrifices, incense, Sabbaths, holy days, crowded temple courts, many prayers. And the Lord says He is sick of all of it. The reason comes at the end of verse 15: “your hands are full of blood.” Their religion has become a performance that sits comfortably beside injustice. What He wants appears in verses 16–17, and it is almost startlingly concrete: stop doing evil, defend the fatherless, plead for the widow.

  At this point in a lawsuit we expect a sentence. Instead the Judge makes an offer: “Come now, and let us reason together” (verse 18). The verb is legal language: the Lord challenges Israel to a formal trial and then, instead of pronouncing sentence, offers to remit the punishment. His terms are astonishing: scarlet sins made white as snow. The chapter still ends with fire, but even that fire is a refiner’s fire (verse 25). He means to burn away the dross, not destroy the silver, until Jerusalem is once again “the city of righteousness, the faithful city” (verse 26).

  So Isaiah 1 moves from **courtroom** to **temple** to **city street** to **smelting furnace**, and the question underneath every stage is the same: *Will you let Me make you clean?* That question runs through the whole book of Isaiah, and through the gospel.

sections:
  - range: '1'
    heading: The vision of Isaiah
    plain: |
      This is what Isaiah saw about Judah and Jerusalem during the reigns of four kings.
  - range: 2-9
    heading: Children who don’t know their Father
    plain: |
      Heaven and earth, listen! The Lord raised children and they rebelled. Even an ox knows its owner, but My people don’t know Me. The nation is like a body beaten from head to foot, and still it keeps rebelling. The land is burned and occupied. Jerusalem is left standing alone like a hut in a vineyard. If the Lord hadn’t spared a few survivors, we would have been wiped out like Sodom.
  - range: 10-17
    heading: Worship without righteousness
    plain: |
      Listen, you leaders who are no better than Sodom! What good are all your sacrifices? I’m sick of them. Your holy days and meetings mean nothing while you keep sinning. When you raise your hands to pray, I won’t look, because your hands are covered in blood. Wash yourselves. Stop doing evil. Learn to do good: seek justice, rescue the oppressed, defend orphans, and plead for widows.
  - range: 18-20
    heading: '“Let us reason together”'
    plain: |
      Come, let’s settle this. Though your sins are deep red, they can become white as snow. If you are willing and obey, you’ll eat the best of the land. If you refuse and rebel, the sword will eat you.
  - range: 21-31
    heading: The faithful city refined
    plain: |
      How the faithful city has become unfaithful! It was full of justice; now it’s full of murderers. Its silver has turned to slag and its wine is watered down. Its leaders take bribes and ignore orphans and widows. So the Lord will act. He will melt down the city and burn away its impurities. He will give it honest judges again, and it will be called the city of righteousness. Zion will be redeemed through justice. Those who cling to idols will be burned up like dry fiber touched by a spark.

notes:
  - ref: 1
    phrase: Isaiah the son of Amoz
    kind: words
    title: What’s in a name?
    body: |
      *Isaiah* (Hebrew *Yeshaʿyahu*) means **“the Lord is salvation”** or “Jehovah saves.” The name is built on the same root as *Joshua* and *Jesus* (*Yehoshua*, *Yeshua*), “Jehovah is salvation.” In a book whose great subject is salvation through the Holy One of Israel, the prophet’s own name is a one-word summary of his message.

      Amoz, his father, is not the prophet Amos. The names are spelled differently in Hebrew (Amoz begins with *aleph*, Amos with *ayin*). The book does show Isaiah speaking directly to kings and advising them ([[Isa. 7:3]]; [[Isa. 37:2]]).
    sources: [bd-isaiah, bdb]
  - ref: 2
    phrase: Hear, O heavens, and give ear, O earth
    kind: symbol
    title: Calling the witnesses
    body: |
      Moses called the **heavens and the earth themselves** as witnesses to Israel’s covenant with Jehovah ([[Deut. 30:19]]; [[Deut. 32:1]]).

      Isaiah opens in a distinctly Deuteronomic style, and a reader who knows Deuteronomy hears what is happening: *the covenant witnesses are being summoned to court.* The Lord opens the Doctrine and Covenants the same way, summoning “ye people from afar; and ye that are upon the islands of the sea” to listen to His voice of warning ([[D&C 1:1–4]]).

      A Nephite prophet made the same move. When the corrupt judges of Zarahemla tried to stir up the people to seize him ([[Hel. 8:1–4]]), Nephi the son of Helaman turned the tables and put the people on trial instead. He called Moses, Abraham, and the prophets as witnesses, and last of all heaven and earth: “ye have received all things, both things in heaven, and all things which are in the earth, as a witness that they are true” ([[Hel. 8:24]]).
    sources: [delitzsch, sc-knowhy-179]
  - ref: 2
    phrase: I have nourished and brought up children
    kind: christ
    title: A Father’s complaint
    body: |
      Notice the first charge. It isn’t “My subjects broke My laws” but “My **children** rebelled.” The two Hebrew verbs behind “nourished and brought up” both mean to bring up or rear children. This is a parent who has raised a child, only to have the child turn away.

      That sets the emotional key for the whole book. Isaiah’s God is holy and terrifying, but His anger is always the grief of a Father. Later He will say that a mother might forget her nursing child, “yet will I not forget thee” ([[Isa. 49:15]]).
    sources: [bdb]
  - ref: 3
    phrase: the ass his master’s crib
    kind: symbol
    title: Even the livestock know
    body: |
      The Hebrew behind *crib* (*ʾebus*) is a feeding trough, a **manger**. Isaiah’s point is almost comic: an ox knows who owns it, and a donkey knows where its dinner comes from. Israel, supposedly wiser than livestock, doesn’t recognize the One who feeds it.
    sources: [bdb, delitzsch]
  - ref: 3
    phrase: Israel doth not know
    kind: words
    title: '“Know” is covenant language'
    body: |
      In Hebrew, *to know* (*yadaʿ*) is more than having information. The lexicon lists, among its senses, knowing a person, knowing God as “involving intelligent worship, obedience,” and God’s knowing Israel as His chosen people ([[Amos 3:2]]). Hosea says the Lord desired “the knowledge of God more than burnt offerings” ([[Hosea 6:6]]).

      So “Israel doth not know” doesn’t mean Israel lacks facts about God. As one commentary reads it, Israel had not considered that they were the Lord’s children and possession, and that their existence and prosperity depended on His grace alone. The Savior used the same idea: “this is life eternal, that they might **know** thee” ([[John 17:3]]); and He warned of those He would dismiss with “I never knew you” ([[Matt. 7:23]]).
    sources: [bdb, delitzsch]
  - ref: 4
    phrase: the Holy One of Israel
    kind: christ
    title: Isaiah’s signature name for God
    body: |
      According to the Bible Dictionary, this title appears 27 times in Isaiah and only seven times elsewhere in the Old Testament. One classic commentary reads it as an echo of his temple vision, where the seraphim cried “Holy, holy, holy” ([[Isa. 6:3]]). It holds two ideas together: God is utterly **holy**, set apart and unlike us, and yet He is **of Israel**, bound to a people by covenant.

      The Book of Mormon makes clear who the Holy One of Israel is. The Bible Dictionary notes that 2 Nephi 25:29 identifies Him as Christ. Nephi calls Him the one who would be crucified, and the Savior Himself says, “I am the God of Israel” ([[1 Ne. 19:13–14]]; [[2 Ne. 9:41]]; [[3 Ne. 11:14]]). When you read “Holy One of Israel” in Isaiah, you can read it as a name of Jesus Christ.
    sources: [bd-holy-one, delitzsch]
  - ref: 5
    phrase: the whole head is sick, and the whole heart faint
    kind: symbol
    title: A body beaten from head to foot
    body: |
      Isaiah switches metaphors. The nation is now a body that has been beaten so badly there’s no healthy spot left: cuts, welts, and festering sores that have not been pressed out, bandaged, or softened with oil (verse 6).

      The haunting question in verse 5 is “Why should ye be stricken any more?” In other words, *what more discipline could possibly help?* They have been hit again and again and have only rebelled more. The point is that punishment by itself doesn’t heal. The body needs a physician, and verse 18 will introduce one. Isaiah will later describe a Servant who takes the stripes on Himself so that “with his stripes we are healed” ([[Isa. 53:5]]).
    sources: [delitzsch]
  - ref: 7
    phrase: your cities are burned with fire
    kind: history
    title: Judah after the Assyrian invasion
    body: |
      This description fits Judah after **701 BC** well, though commentators have also placed it in the Syro-Ephraimite war under Ahaz. In 701 the Assyrian king Sennacherib swept through Judah to enforce tribute. His own annals boast that he took forty-six of Hezekiah’s strong cities and shut Hezekiah up in Jerusalem “like a bird in a cage.”

      That is the picture in verses 7–8: every town burned and occupied by foreigners, and Jerusalem, still standing, alone in a ravaged land. Isaiah tells the rest of the story, how the Lord delivered Jerusalem, in chapters 36–37.
    sources: [luckenbill-annals, ot-manual-f, bd-sennacherib, delitzsch]
  - ref: 8
    phrase: as a cottage in a vineyard, as a lodge in a garden of cucumbers
    kind: symbol
    title: A shed in an empty field
    body: |
      A vineyard or cucumber field had to be watched before the harvest. Out in the field, nothing shows that anyone is there except a lone hut and a night shelter for the watchman (compare [[Job 27:18]]).

      That is Jerusalem, “the daughter of Zion”: still standing, but only just, fragile and isolated in the midst of desolation, though the hut at least shows the land is not entirely empty of people. It’s a humbling image for a proud capital.
    sources: [delitzsch]
  - ref: 9
    phrase: a very small remnant
    kind: scripture
    title: The remnant, one of Isaiah’s great themes
    body: |
      Here is the first appearance of one of Isaiah’s most important ideas: the **remnant**. Judgment falls, but the Lord always preserves a few, and from those few He rebuilds. The Hebrew word (*sarid*) refers to those who escaped the general destruction. Isaiah even named one of his sons *Shear-jashub*, meaning *a remnant shall return* ([[Isa. 7:3]]; [[Isa. 10:20–22]]).

      Paul quoted this verse to explain why only some of Israel accepted Christ ([[Rom. 9:27–29]]). The Book of Mormon applies the same idea to Lehi’s descendants, a “remnant of the house of Israel” whom the Lord would gather in the last days ([[1 Ne. 13:34]]; [[3 Ne. 20:16]]; [[3 Ne. 21:12]]). The gathering of Israel, which President Russell M. Nelson has called “the most important thing taking place on earth today,” is in Isaiah’s terms the return of the remnant.
    sources: [bdb, delitzsch, nelson-hope-israel]
  - ref: 11
    phrase: To what purpose is the multitude of your sacrifices unto me?
    kind: symbol
    title: Did God reject sacrifice?
    body: |
      The Lord Himself commanded these sacrifices through Moses, so He isn’t rejecting the ordinances. He is rejecting **ordinances performed by people who aren’t trying to live what the ordinances mean**. Sacrifice pointed to the Lamb of God and required a “broken heart and a contrite spirit” ([[Ps. 51:16–17]]; [[3 Ne. 9:19–20]]). When the offering becomes a substitute for righteousness instead of an expression of it (“nothing but the form, with which they thought they had satisfied God,” as one commentary puts it), God calls it “vain.”

      Samuel said something similar: “to obey is better than sacrifice” ([[1 Sam. 15:22]]). So did Hosea, Amos, Micah, and Jesus ([[Hosea 6:6]]; [[Amos 5:21–24]]; [[Micah 6:6–8]]; [[Matt. 9:13]]).
    sources: [bd-sacrifices, delitzsch]
  - ref: 17
    phrase: relieve the oppressed, judge the fatherless, plead for the widow
    kind: scripture
    title: What God actually asks for
    body: |
      After all the talk of sacrifices and feasts, the cure is very ordinary: *learn to do good.* Seek justice. Set right the oppressed. Take up the orphan’s case. Argue on behalf of the widow. The rulers failed exactly here: the orphan they did not right, and the cause of the widow never reached them (verse 23).

      James called caring for “the fatherless and widows” a mark of “pure religion” ([[James 1:27]]). King Benjamin taught that we retain a remission of our sins by imparting to the poor ([[Mosiah 4:26]]). Isaiah is saying the same thing centuries earlier: worship that doesn’t make us kinder is not the worship God asked for.
    sources: [delitzsch]
  - ref: 18
    phrase: let us reason together
    kind: words
    title: '“Let’s settle this case”'
    body: |
      The Hebrew verb (*yakach*, here in its reciprocal form) is a courtroom word: to decide, judge, prove, or argue. One commentary takes the verse as a challenge to a formal trial. We’re still in the lawsuit that began in verse 2. The Judge has laid out the evidence, and it is damning. Now, instead of sentencing, He invites the defendants to come and argue it out, and promises to remit the punishment.

      That changes how we hear the verse. “Let us reason together” isn’t a polite invitation to discussion. It is a **plea bargain offered by the Judge Himself**, on terms entirely in the defendant’s favor. He supplies the cleansing, and the defendant supplies willingness (verse 19).
    sources: [bdb, delitzsch]
  - ref: 18
    phrase: though your sins be as scarlet, they shall be as white as snow
    kind: christ
    title: Scarlet made white
    body: |
      The scarlet and crimson of this verse were dyes obtained from an insect (one commentary identifies it as the cochineal). The same commentary reads red as the color of a life that has turned selfish and destructive, and so of sin, and white as its opposite.

      Yet the Lord promises the sins can become white as snow, like wool. Only one thing does that. John saw the redeemed who “washed their robes, and made them white in the blood of the Lamb” ([[Rev. 7:14]]; see [[Alma 5:21]]; [[1 Ne. 12:10–11]]). Notice the paradox: something red makes the scarlet white.
    sources: [delitzsch]
  - ref: 20
    phrase: ye shall be devoured with the sword
    kind: words
    title: Eat, or be eaten
    body: |
      English hides a sharp piece of Hebrew wordplay. Verse 19 promises “ye shall **eat** (*tokelu*) the good of the land.” Verse 20 warns “ye shall be **devoured** (*teʾukkelu*) with the sword,” which uses the same verb, *ʾakal*, in a passive form. Literally: *if you are willing, you will eat; if you rebel, you will be eaten.*

      The Lord repeated the promise of verse 19 to the early Saints: “the willing and obedient shall eat the good of the land of Zion in these last days” ([[D&C 64:34]]). The next verse in that revelation also echoes Isaiah: “the rebellious shall be cut off” ([[D&C 64:35]]).
    sources: [bdb, biblehub-interlinear]
  - ref: 21
    phrase: How is the faithful city become an harlot!
    kind: symbol
    title: A marriage betrayed
    body: |
      The prophets often describe the covenant between the Lord and Israel as a **marriage**, with the Lord as the faithful husband ([[Hosea 2:19–20]]; [[Isa. 54:5]]; [[Jer. 3:14]]). So when Isaiah calls Jerusalem a harlot, he is not changing the subject to sexual sin. He is describing covenant unfaithfulness. The law already calls Israel’s idol worship “whoring after” other gods ([[Deut. 31:16]]), and one commentary sees here an infidelity of heart “in whatever form it might express itself.”
    sources: [bdb, delitzsch]
  - ref: 25
    phrase: purely purge away thy dross, and take away all thy tin
    kind: christ
    title: The Refiner’s fire
    body: |
      This is the language of a silversmith: the silver is melted and the impurities, dross and base metal (the Hebrew *bedil*, translated “tin” and glossed “alloy” in the lexicon), are separated from it.

      Notice that the fire is **for** the silver, not against it. The Lord’s judgment here is purification. Malachi uses the same image for the Savior: “he is like a refiner’s fire… and he shall sit as a refiner and purifier of silver” ([[Mal. 3:2–3]]; [[3 Ne. 24:2–3]]). Isaiah later hears the Lord say, “I have refined thee… in the furnace of affliction” ([[Isa. 48:10]]). The heat is real, but the goal is to recover something precious.
    sources: [bdb, delitzsch]
  - ref: 26
    phrase: I will restore thy judges as at the first
    kind: scripture
    title: A restoration promised
    body: |
      This is a *restoration* promise: not something new, but a return to what was at the beginning. After the refining, Jerusalem gets back honest judges and counselors and a new name, “The city of righteousness, the faithful city.” In Isaiah, a new name marks a new identity ([[Isa. 62:2–4]]). One commentary notes that the smelting aims to bring Jerusalem back to the purer metal of its own true nature.

      Latter-day Saints will hear an echo of the Restoration here: the Lord restoring what had been lost, including authorized servants to judge and counsel His people. Verse 27 states the principle behind it: “Zion shall be redeemed with judgment,” that is, with **justice**. The Lord told the early Saints the same thing: “Zion cannot be built up unless it is by the principles of the law of the celestial kingdom” ([[D&C 105:5]]).
    sources: [delitzsch]
christ: |
  Isaiah 1 introduces Jesus Christ under His Old Testament name and title, **Jehovah, the Holy One of Israel** (verse 4). Then it shows what kind of God He is. He is a **Father** grieving over children who don’t know Him (verse 2). He is a **Judge** who, with the evidence overwhelming, steps down from the bench to offer a settlement no defendant could deserve (verse 18). He is a **Refiner** whose fire is meant to recover silver, not destroy it (verse 25).

  Above all, He is the one who makes scarlet white. The Book of Mormon tells us how: “the blood of the Lamb” ([[1 Ne. 12:10–11]]; [[Alma 5:21]]). Isaiah will spend the rest of his book explaining how that cleansing is possible, most unforgettably in chapter 53. Chapter 1 gives the invitation: *Come now.*

explore: |
  - **Bookends.** Read Isaiah 1 and Isaiah 66 side by side. Look for rebellion (1:2; 66:24), gardens (1:29; 66:17), empty sacrifices (1:11; 66:3), new moons and sabbaths (1:13; 66:23), and unquenchable fire (1:31; 66:24). The book opens and closes with the same themes, but chapter 66 ends with “all flesh” coming to worship.
  - **Malachi 3.** Malachi closes the Old Testament where Isaiah 1 opens it: a people doing religious things while God asks them to *return*, and a Refiner who comes to purify the sons of Levi ([[Mal. 3:1–7]]). Reading them together is illuminating.
  - **Alma 5.** Alma’s great sermon on whether we have received His image in our countenances is full of Isaiah 1’s language of cleansing, garments washed white, and the invitation to come ([[Alma 5:14–33]]; [[Alma 5:62]]).

parallels:
  - ref: Rom. 9:29
    note: Paul quotes verse 9 on the remnant.
  - ref: D&C 64:34–35
    note: The Lord repeats verses 19–20 to the Saints in Kirtland (1831).
  - ref: Alma 5:21–24
    note: Alma echoes the imagery of garments washed white.

sources: [bd-isaiah, bd-uzziah, bd-ahaz, bd-hezekiah, ot-manual-f, delitzsch, bdb, biblehub-interlinear, luckenbill-annals, calabro-gestures, sc-knowhy-179, sc-knowhy-638]
