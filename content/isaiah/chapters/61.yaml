chapter: 61
title: The Spirit of the Lord Is upon Me
tagline: An anointed messenger announces good news to the poor, liberty to the captives, and a year of the Lord’s favor, trading ashes for a crown and mourning for oil of joy, and Zion answers in a wedding song.
when: 'Setting: the community in Judah, late sixth century BC; read by Jesus at Nazareth, c. AD 30'

setting: |
  Chapter 61 stands at the center of chapters 56–66, and verses 1–3 are its heart. For the first time since chapter 50, someone speaks in the first person about his own calling: “The Spirit of the Lord GOD is upon me.” He is not named. He does not call himself a servant, but he has the servant’s gifts: the Spirit ([[Isa. 42:1]]) and a tongue to comfort the weary ([[Isa. 50:4]]). For that reason some scholars count this passage as a fifth Servant Song; see [The Servant Songs](/isaiah/themes/servant-songs/#fifth-song). Others think the speaker is the prophet describing his own mission.

  Jesus settled the question for His followers. At the synagogue in Nazareth He read verses 1–2 and said, “This day is this scripture fulfilled in your ears” ([[Luke 4:21]]). Latter-day revelation adds a further fulfillment: in his vision of the spirit world, President Joseph F. Smith saw Isaiah among the spirits who greeted the Savior, the prophet who foretold that the Redeemer would open “the prison to them that were bound” ([[D&C 138:42]]).

  The rest of the chapter describes what the messenger’s work produces: ruined cities rebuilt, a people called priests, a double inheritance, an everlasting covenant (verses 4–9). It ends with a song of joy from someone clothed as a bride or bridegroom (verses 10–11).

thread: |
  Isaiah 61 is about **exchange**.

  The anointed one is sent to people who have lost something: the poor, the brokenhearted, the captives, the mourners. He does not only comfort them; he gives them something better in place of what they lost. Verse 3 is a list of trades: “beauty for ashes, the oil of joy for mourning, the garment of praise for the spirit of heaviness.” Verse 7 adds another: “for your shame ye shall have double.”

  The exchange works because someone else has taken the other side of it. Chapter 53 described the servant who “hath borne our griefs, and carried our sorrows” ([[Isa. 53:4]]). Here the griefs are gone, and the mourners wear a crown, oil, and a robe in their place. By the end, the people who once sat in ashes are called “trees of righteousness” and “the Priests of the LORD” (verses 3, 6), and one of them sings, “he hath clothed me with the garments of salvation” (verse 10). The chapter ends where the exchange leads: a wedding.

sections:
  - range: 1-3
    heading: Anointed to bring good news
    plain: |
      The Spirit of the Lord God is on me, because the Lord has anointed me to bring good news to the poor. He has sent me to bind up the brokenhearted, to proclaim freedom to the captives and release to the prisoners, to proclaim the year of the Lord’s favor and the day of our God’s vengeance, to comfort all who mourn, to provide for those who mourn in Zion: to give them a crown instead of ashes, the oil of joy instead of mourning, and a garment of praise instead of a faint spirit. They will be called oaks of righteousness, planted by the Lord to display His glory.
  - range: 4-9
    heading: Priests of the Lord
    plain: |
      They will rebuild the ancient ruins, restore the places long devastated, and renew the ruined cities that have lain desolate for generations. Strangers will stand and shepherd your flocks, and foreigners will work your fields and vineyards. But you will be called the Lord’s priests; people will speak of you as servants of our God. You will enjoy the wealth of nations and boast in their riches. Instead of your shame you will receive a double portion; instead of disgrace, they will rejoice in their inheritance. So they will inherit a double portion in their land, and everlasting joy will be theirs. For I, the Lord, love justice; I hate robbery and wrongdoing. I will faithfully reward them and make an everlasting covenant with them. Their descendants will be known among the nations and their offspring among the peoples. All who see them will recognize that they are a people the Lord has blessed.
  - range: 10-11
    heading: Clothed with salvation
    plain: |
      I rejoice greatly in the Lord; my whole being delights in my God. For He has clothed me with garments of salvation and wrapped me in a robe of righteousness, as a bridegroom puts on a priestly headdress, and as a bride adorns herself with her jewels. For as the earth makes its shoots come up and a garden makes its seeds sprout, so the Lord God will make righteousness and praise spring up before all the nations.

notes:
  - ref: 1
    phrase: The Spirit of the Lord GOD is upon me; because the LORD hath anointed me
    kind: christ
    title: This day is this scripture fulfilled
    body: |
      “Anointed” is *māšaḥ*, the verb from which *māšîaḥ*, “Messiah,” comes; the Greek equivalent is *christos*. Kings and priests were anointed with oil ([[1 Sam. 16:13]]; [[Ex. 29:7]]). Here the anointing is with the Spirit, and the task is not to rule but to announce: to “preach good tidings” (*bāśar*, the verb of the herald in [[Isa. 40:9]] and [[Isa. 52:7]]).

      Luke tells how Jesus, early in His ministry, returned to Nazareth, stood up in the synagogue, and was handed the scroll of Isaiah. He found this passage and read it. Then “he closed the book, and he gave it again to the minister, and sat down. And the eyes of all them that were in the synagogue were fastened on him.” His first words were, “This day is this scripture fulfilled in your ears” ([[Luke 4:20–21]]). Luke places the scene at the start of Jesus’ ministry as its program: everything that follows in the Gospel, the healings, the meals with outcasts, the forgiveness of sins, is this passage being fulfilled.

      Jesus used the passage again when John the Baptist sent from prison to ask if He was the one who should come. His answer ended with a phrase from verse 1: “the poor have the gospel preached to them” ([[Matt. 11:5]]). And the Beatitudes echo the passage: those who mourn are comforted, and the meek inherit the earth ([[Matt. 5:4–5]]; compare verses 2–3 and 7).
    sources: [oswalt, paul-40-66]
  - ref: 1
    phrase: to proclaim liberty to the captives
    kind: history
    title: The year of release
    body: |
      “Liberty” is *dərôr*, a technical word for the release of slaves and the cancellation of debts. The law of the Jubilee commanded Israel every fiftieth year to “proclaim liberty throughout all the land unto all the inhabitants thereof” ([[Lev. 25:10]]); Jeremiah used the same word when King Zedekiah made a covenant to free the Hebrew slaves ([[Jer. 34:8]]). Similar royal decrees of release are known from Mesopotamia, where a new king often proclaimed one at the start of his reign.

      So “the acceptable year of the LORD” in verse 2 sounds like a Jubilee: the year when debts are forgiven, families get back their land, and the enslaved go home. The anointed one proclaims a Jubilee on a grand scale.

      This reading was not invented by Christians. Among the Dead Sea Scrolls is a text known as 11QMelchizedek that weaves together the Jubilee law, [[Isa. 52:7]], and [[Isa. 61:1–2]], and it describes a heavenly deliverer who will proclaim liberty to the captives at the end of days. When Jesus read the passage at Nazareth, His hearers already had reason to expect that it described the coming age of redemption. The New Testament word for this release, *aphesis*, is also its word for the forgiveness of sins.
    sources: [paul-40-66, blenkinsopp]
  - ref: 1
    phrase: the opening of the prison to them that are bound
    kind: restoration
    title: Opening the prison
    body: |
      The Hebrew for “the opening of the prison” is a single unusual expression, *pəqaḥ-qôaḥ*. The verb *pāqaḥ* almost always means to open the eyes. Isaiah pairs it with prisoners elsewhere too: “To open the blind eyes, to bring out the prisoners from the prison” ([[Isa. 42:7]]). The Greek Septuagint translated it “recovering of sight to the blind,” and that is the wording Luke gives in Jesus’ reading ([[Luke 4:18]]). Prisoners in dark dungeons came out blinking into the light, so the two ideas were close: release was like the opening of eyes.

      Latter-day revelation applies the phrase to a prison no earthly key can open. In 1918, President Joseph F. Smith saw in vision the Savior’s visit to the spirit world between His death and resurrection. Among the prophets waiting there was “Isaiah, who declared by prophecy that the Redeemer was anointed to bind up the broken-hearted, to proclaim liberty to the captives, and the opening of the prison to them that were bound” ([[D&C 138:42]]). The Savior sent messengers to “proclaim liberty to the captives who were bound” ([[D&C 138:31]]), fulfilling Peter’s statement that He “preached unto the spirits in prison” ([[1 Pet. 3:19]]).

      Joseph Smith used the same image when he wrote about work for the dead: “Let your hearts rejoice, and be exceedingly glad… for the prisoners shall go free” ([[D&C 128:22]]). President Russell M. Nelson cited this verse alongside that revelation when he taught that family history work can make the Sabbath a delight.
    sources: [bdb, nelson-sabbath]
  - ref: 2
    phrase: To proclaim the acceptable year of the LORD, and the day of vengeance of our God
    kind: christ
    title: Where Jesus stopped reading
    body: |
      When Jesus read this passage at Nazareth, He stopped in the middle of verse 2. Luke’s quotation ends with “To preach the acceptable year of the Lord” ([[Luke 4:19]]), and then Jesus closed the scroll. He did not read “and the day of vengeance of our God.”

      Many readers have seen meaning in the pause. Jesus came first to proclaim the year of favor; the day of vengeance belongs to His Second Coming. Isaiah will describe that day in chapter 63, where the Lord comes from Edom with red garments: “the day of vengeance is in mine heart, and the year of my redeemed is come” ([[Isa. 63:4]]). Latter-day revelation applies that scene to the Second Coming ([[D&C 133:46–51]]).

      Notice also the proportion in Isaiah’s own words. Favor lasts a “year”; vengeance, a “day.” The Lord’s mercy is measured on a larger scale than His judgment. And the purpose of the whole list is the last line: “to comfort all that mourn.”
    sources: [oswalt]
  - ref: 3
    phrase: to give unto them beauty for ashes, the oil of joy for mourning, the garment of praise for the spirit of heaviness
    kind: words
    title: Beauty for ashes
    body: |
      Mourners in ancient Israel put ashes or dust on their heads; when Tamar was wronged, she “put ashes on her head” ([[2 Sam. 13:19]]). The anointed one takes the ashes off and puts on a headdress in their place. “Beauty” is *pəʾēr*, a festive turban or garland worn by a bridegroom (verse 10) or a priest ([[Ex. 39:28]], “goodly bonnets”). “Ashes” is *ʾēper*. The two words use the same three letters in a different order. The exchange is built into the sound: *pəʾēr taḥat ʾēper*.

      Two more exchanges follow. “The oil of joy for mourning”: mourners did not anoint themselves ([[2 Sam. 14:2]]), so oil on the head meant the time of grief was over. The Psalms call it “the oil of gladness” ([[Ps. 45:7]]), a verse Hebrews applies to Christ ([[Heb. 1:9]]). And “the garment of praise for the spirit of heaviness”: a festive cloak in place of a spirit that is faint or dim (*kēhâ*), the word Isaiah used for the dimly burning wick, the “smoking flax” of [[Isa. 42:3]].

      These are not only feelings replaced. They are signs of status. A person wearing a turban, anointed with oil, and dressed in a festive garment is not a mourner any more. The Lord changes what people are, not only how they feel.
    sources: [bdb, paul-40-66, oswalt]
  - ref: 3
    phrase: that they might be called trees of righteousness, the planting of the LORD
    kind: symbol
    title: Oaks of righteousness
    body: |
      “Trees” is *ʾêlê*, “great trees, oaks” (the word is related to *ʾēlâ*, the terebinth). The image closes a circle that opened in the book’s first chapter. There Isaiah condemned the sacred trees of idol worship: “they shall be ashamed of the oaks which ye have desired… For ye shall be as an oak whose leaf fadeth” ([[Isa. 1:29–30]]). The people had chosen trees to worship, and they would wither like them. Now the redeemed themselves become oaks, planted by the Lord, and they do not fade.

      The phrase repeats the end of the previous chapter, where the people are “the branch of my planting, the work of my hands, that I may be glorified” ([[Isa. 60:21]]). Both passages end with the same purpose: “that he might be glorified.” The psalmist used the same picture of the righteous: “like a tree planted by the rivers of water, that bringeth forth his fruit in his season; his leaf also shall not wither” ([[Ps. 1:3]]).
    sources: [bdb, oswalt]
  - ref: 6
    phrase: But ye shall be named the Priests of the LORD
    kind: restoration
    title: A people of priests
    body: |
      At Sinai the Lord told Israel, “ye shall be unto me a kingdom of priests, and an holy nation” ([[Ex. 19:6]]). In practice, only one family, Aaron’s, served as priests. Isaiah pictures the original intent fulfilled: the whole people named “the Priests of the LORD” and “the Ministers of our God,” serving the nations as priests serve a congregation. Foreigners tend the flocks and fields (verse 5), not as slaves but in the way the other tribes supported the Levites. And at the very end of the book the line moves again, when the Lord takes some of the foreigners themselves “for priests and for Levites” ([[Isa. 66:21]]).

      The New Testament applies the idea to all believers: “ye are a chosen generation, a royal priesthood, an holy nation” ([[1 Pet. 2:9]]); Christ “hath made us kings and priests unto God” ([[Rev. 1:6]]). The Restoration takes it further, with priesthood authority extended to all worthy men and the ordinances of the temple open to all worthy members. Those who inherit celestial glory are described as “priests and kings, who have received of his fulness, and of his glory” ([[D&C 76:56]]).

      Verse 7 adds the reward: “for your shame ye shall have double.” The double portion was the inheritance of the firstborn ([[Deut. 21:17]]). The book’s last division began with Jerusalem having “received of the LORD’s hand double for all her sins” ([[Isa. 40:2]]). The double punishment is replaced with a double inheritance.
    sources: [oswalt, paul-40-66]
  - ref: 8
    phrase: I hate robbery for burnt offering
    kind: words
    title: Robbery for burnt offering
    body: |
      This phrase is a small case study in how Hebrew was written. The earliest Hebrew texts had only consonants; the vowels were added by the scribes known as the Masoretes many centuries later. The consonants here are *bʿwlh*. The Masoretes vowelled them *bəʿôlâ*, “with a burnt offering,” and the King James Version follows them: “I hate robbery for burnt offering,” meaning a sacrifice paid for with stolen goods. With a different vowel the same letters read *bəʿawlâ*, “with injustice.” That is how the Greek Septuagint and most modern translations take it: “I hate robbery and wrongdoing.”

      Both readings make sense, and both have a biblical basis. God rejects worship funded by injustice ([[Isa. 1:11–17]]; [[Mal. 1:13]]), and He hates injustice in general. The modern reading fits the parallel better (“I the LORD love judgment”). What is not in doubt is the promise that follows: “I will make an everlasting covenant with them,” the covenant promised in [[Isa. 55:3]]. Latter-day revelation uses the same phrase for the restored gospel: “a new and an everlasting covenant” ([[D&C 22:1]]), “mine everlasting covenant, even the fulness of my gospel” ([[D&C 66:2]]).
    sources: [bdb, paul-40-66, tov-textual]
  - ref: 10
    phrase: he hath clothed me with the garments of salvation, he hath covered me with the robe of righteousness
    kind: restoration
    title: Garments of salvation
    body: |
      Someone sings, “I will greatly rejoice in the LORD.” The speaker may be the anointed one of verse 1, or Zion herself answering him. The image fits either: a bride and a bridegroom dressed for their wedding. “As a bridegroom decketh himself with ornaments” is literally “as a bridegroom *acts as a priest* with a headdress” (*yəkahēn pəʾēr*). The bridegroom wears the same festive turban given to the mourners in verse 3, and he wears it like a priest.

      Chapter 59 showed the people weaving webs that could not cover them ([[Isa. 59:6]]) and the Lord dressing Himself in righteousness and salvation ([[Isa. 59:17]]). Here He clothes His people in the same garments. What they could not make, He gives.

      The image recurs in Restoration scripture, often in a temple setting. Jacob taught that the righteous at the judgment will be “clothed with purity, yea, even with the robe of righteousness” ([[2 Ne. 9:14]]). At the dedication of the Kirtland Temple, Joseph Smith prayed “that our garments may be pure, that we may be clothed upon with robes of righteousness” ([[D&C 109:76]]). And in John’s vision of the marriage of the Lamb, the bride is dressed in fine linen, “for the fine linen is the righteousness of saints” ([[Rev. 19:8]]).
    sources: [bdb, oswalt]

christ: |
  Jesus claimed this chapter as His own: “This day is this scripture fulfilled in your ears” ([[Luke 4:21]]). He is the Anointed One, the Messiah, the Christ, anointed not with oil but with the Spirit ([[Acts 10:38]]). He preached good news to the poor, healed the brokenhearted, opened blind eyes, and, as latter-day revelation teaches, opened the prison of the spirit world ([[D&C 138:18–31]]). He is also the one who makes the exchange possible, taking on Himself the ashes and mourning so that He can give beauty and the oil of joy in their place. And He is the Bridegroom whose wedding the chapter anticipates ([[Matt. 25:1–13]]).

liken: |
  - What ashes am I holding onto that the Lord wants to trade for beauty?
  - Who in my life is brokenhearted, captive, or mourning? How could I join in the Savior’s mission to them?
  - Do I think of the temple and family history work as “opening the prison to them that are bound”?
  - Do I see myself as one of “the Priests of the LORD,” called to serve others, not only to be served?
  - Am I wearing the garments of salvation He has given me, or still trying to weave my own?

explore: |
  - **Nazareth.** Read [[Luke 4:14–30]] with [[Isa. 61:1–2]] and [[Isa. 58:6]]. Notice how the congregation’s mood changes.
  - **The prison opened.** Read [[1 Pet. 3:18–20]], [[1 Pet. 4:6]], and [[D&C 138:11–37]].
  - **The Jubilee.** Read [[Lev. 25:8–17]] and consider what it would mean for the “acceptable year of the LORD” to be a Jubilee.
  - **Robes of righteousness.** Compare [[Isa. 59:17]], [[Isa. 61:10]], [[2 Ne. 9:14]], and [[Rev. 19:7–8]].

parallels:
  - ref: Luke 4:16–21
    note: Jesus reads verses 1–2 in the synagogue at Nazareth and declares them fulfilled.
  - ref: Matt. 11:5
    note: “The poor have the gospel preached to them.”
  - ref: D&C 138:42
    note: Isaiah in the spirit world, as the prophet of the opened prison.
  - ref: D&C 128:22
    note: “The prisoners shall go free,” on work for the dead.

