chapter: 18
title: Envoys in Papyrus Boats
tagline: A distant nation sends messengers in papyrus boats, and the Lord answers by quietly watching, then promises that gifts will be brought to Zion.
when: 'In the Assyrian crisis of Isaiah’s day, as the Nile kingdoms faced invasion'

setting: |
  Isaiah 18 is short and full of puzzling images, but its historical setting is fairly clear. The kingdom of **Cush** (ancient Ethiopia, south of Egypt) was a great power. The chapter addresses it as the land “beyond the rivers of Ethiopia.” As Assyria advanced, Cush was summoning every resource to resist, and its messengers crossed the Nile in papyrus boats. Tirhakah, king of Ethiopia, would later come out to make war on Sennacherib ([[Isa. 37:9]]).

  Scholars differ on where the messengers are headed. Some think they travel to Judah to seek friendship and aid; others, that they carry orders to every province of the Ethiopian realm. Either way, Isaiah’s oracle is the Lord’s answer: He, not any coalition, will deal with Assyria.

  Latter-day Saints have also read the chapter as a prophecy of the gathering of Israel from a land in the Western Hemisphere.

thread: |
  Isaiah 18 contrasts **frantic human diplomacy** with **the Lord’s calm**.

  The first two verses are full of motion. Wings whir, boats skim the Nile, “swift messengers” hurry off to a tall and impressive nation. A kingdom is mobilizing in the face of Assyria.

  Then, in verse 4, everything slows down. The Lord says: “I will take my rest, and I will consider in my dwelling place.” He is not panicking. He is like the shimmering heat of midday or a cloud of dew in harvest season: quiet, steady, and present. He is watching, and He will act at exactly the right moment. Just before harvest, when the grapes are forming, He will prune away the enemy’s branches (verses 5–6). Read against the Assyrian crisis, the pruning means that Assyria will be cut off by the Lord’s timing, not by human effort.

  The chapter ends with a reversal (verse 7). The same impressive, distant people who sent envoys will one day send gifts “to the place of the name of the LORD of hosts, the mount Zion.”

  The lesson is one Isaiah repeats: “In returning and rest shall ye be saved; in quietness and in confidence shall be your strength” ([[Isa. 30:15]]).

sections:
  - range: 1-2
    heading: The envoys of Cush
    plain: |
      Woe to the land of whirring wings beyond the rivers of Cush, which sends ambassadors by sea in papyrus boats on the water! Go, swift messengers, to a nation tall and smooth-skinned, a people feared far and wide, a powerful nation that tramples others, whose land is divided by rivers.
  - range: 3-6
    heading: The Lord watches, then prunes
    plain: |
      Everyone in the world, all who live on earth, watch when a banner is raised on the mountains, and listen when the trumpet sounds! For the Lord told me: “I will stay quiet and watch from My dwelling, like clear heat on the plants, like a cloud of dew in the heat of harvest.” Before the harvest, when the blossom is over and the flower becomes a ripening grape, He will cut off the shoots with pruning knives and chop down the spreading branches. They will all be left for the birds of the mountains and the wild animals. The birds will spend the summer on them and the animals the winter.
  - range: '7'
    heading: Gifts brought to Zion
    plain: |
      At that time gifts will be brought to the Lord of hosts from this tall, smooth-skinned people, feared far and wide, a powerful nation that tramples others, whose land is divided by rivers. The gifts will come to Mount Zion, the place of the name of the Lord of hosts.

notes:
  - ref: 1
    phrase: which is beyond the rivers of Ethiopia
    kind: history
    title: The land beyond the rivers of Cush
    body: |
      “Beyond the rivers of Ethiopia” points to Cush, which stretched from the Egyptian frontier at Syene south to the neighborhood of Khartoum, where the Blue and White Nile meet.

      The Hebrew of “shadowing with wings” (*tsiltsal kenaphayim*) is obscure. The best-supported reading takes it as the “whirring” or buzzing of wings, perhaps the swarms of insects of the Nile lands; “double shadow” has also been proposed. “Woe” (*hoy*) here may express compassion rather than anger.
    sources: [bd-ethiopia, delitzsch]
  - ref: 1
    phrase: shadowing with wings
    kind: prophets
    title: A land shaped like wings?
    body: |
      Latter-day Saint leaders have read Isaiah 18 as a prophecy of the gospel going out to the nations from America. Orson Pratt taught that the land “shadowing with wings” is North and South America, which on a map look “like the two wings of a bird,” that the ensign raised there is “the standard of the Almighty” for all nations, and that this is “a great latter-day work also for the gathering of the house of Israel.” Elder McConkie’s chart of Isaiah’s chapters likewise summarizes chapter 18 as “Restoration; gathering of Israel; sending of missionaries from America.”

      Other readings stay with the chapter’s own details (Cush, the Nile, papyrus boats) and take the oracle as addressed to Ethiopia in the Assyrian crisis. On that reading, “shadowing with wings” describes Cush, not the Americas. These are two readings, not a single settled one; the Latter-day Saint reading is a prophetic application of the chapter that does not depend on the Hebrew of verse 1.
    sources: [pratt-jod-16-rise-of-zion, mcconkie-keys, delitzsch]
  - ref: 2
    phrase: to a nation scattered and peeled
    kind: words
    title: Tall and smooth
    body: |
      The KJV’s “scattered and peeled” sounds like a description of a suffering people, and Joseph Fielding Smith read it of scattered Israel. But the Hebrew words (*memushshak umorat*) are read in the commentary tradition as **“tall and smooth”**: stretched out, i.e., very tall, and smoothed, either clean-shaven or with glowing skin. The rest of the verse then describes a feared people of “command upon command and treading down,” a ruling and conquering nation.

      On that reading Isaiah describes an impressive, intimidating people. That makes verse 7 all the more striking: even this proud nation will bring gifts to Zion.
    sources: [delitzsch, ot-manual-14]
  - ref: 3
    phrase: when he lifteth up an ensign on the mountains; and when he bloweth a trumpet, hear ye
    kind: scripture
    title: The whole world is summoned
    body: |
      Suddenly the audience widens to “all ye inhabitants of the world.” When the Lord raises His banner and sounds His trumpet, everyone should look and listen. The ensign is the same image as in [[Isa. 5:26]] and [[Isa. 11:12]].

      Read in the Assyrian setting, the two signals mark the Lord’s own destruction of Assyria. The Latter-day Saint reading takes the ensign as the gospel standard raised in the last days, and the image also recalls the “trump of God” that will sound before the Second Coming ([[D&C 29:13]]; [[D&C 43:18]]; [[D&C 88:92–94]]).
    sources: [delitzsch, pratt-jod-16-rise-of-zion]
  - ref: 4
    phrase: I will take my rest, and I will consider in my dwelling place
    kind: symbol
    title: The stillness of God
    body: |
      After the frantic motion of verses 1–2, the Lord is utterly calm. His quiet is not negligence but a considered resolution: He watches in the sunshine and the dew-laden warmth that make the harvest ripen, until the moment to act.

      Quietness is one of Isaiah’s themes ([[Isa. 30:15]]). The Lord’s word to the Saints in Missouri was similar: “Be still and know that I am God” ([[D&C 101:16]]; [[Ps. 46:10]]).
    sources: [delitzsch, lds-scriptures]
  - ref: 5
    phrase: he shall both cut off the sprigs with pruning hooks
    kind: symbol
    title: Pruning before the harvest
    body: |
      The vine image is of a vinedresser cutting back the branches just when the grapes are nearly ripe. Read in the Assyrian setting, the vine is the might of Assyria: left to flourish, it is suddenly and violently cut off before it matures. The cut branches are left for the birds and beasts.

      The Book of Mormon’s allegory of the olive tree uses a related image of pruning: the Lord of the vineyard clears away the branches that bear bitter fruit “according to the strength of the good” ([[Jacob 5:65–66]]).
    sources: [delitzsch, lds-scriptures]
  - ref: 7
    phrase: the present be brought unto the LORD of hosts
    kind: scripture
    title: Ethiopia brings gifts to Zion
    body: |
      Verse 7 reverses the embassy of verse 2: the tall, powerful nation that sent envoys will one day send gifts to “the place of the name of the LORD of hosts, the mount Zion.” That echoes the promise of [[Isa. 2:2–3]], that all nations will flow to the Lord’s house, and the parallel in [[Ps. 68:31]]: “Ethiopia shall soon stretch out her hands unto God.”

      Latter-day Saint teaching reads the gift as gathered Israel: Joseph Smith pointed to this chapter for the gathering and the building of a holy city in western Missouri, and modern revelation identifies Mount Zion as the New Jerusalem ([[D&C 84:2]]).

      The New Testament tells of an Ethiopian official, treasurer to Candace, queen of the Ethiopians, who had gone to Jerusalem to worship and was reading Isaiah 53 in his chariot when Philip taught him of Jesus and baptized him ([[Acts 8:26–39]]). Readers may see a foretaste of verse 7 there; the text does not say so.
    sources: [delitzsch, ot-manual-14, lds-scriptures]

christ: |
  The Lord in Isaiah 18 is calm, watchful, and perfectly timed, a picture of the One who told His anxious disciples, “Peace I leave with you… Let not your heart be troubled, neither let it be afraid” ([[John 14:27]]).

  The Ethiopian official in [[Acts 8:32–35]] found Jesus through Isaiah’s own words about the Suffering Servant. Every nation that brings its gifts to Mount Zion is ultimately bringing them to Him.

explore: |
  - **Stillness.** Compare [[Isa. 18:4]], [[Isa. 30:15]], [[Ps. 46:10]], and [[D&C 101:16]].
  - **The Ethiopian treasurer.** Read [[Acts 8:26–40]] with Isaiah 18:7 and [[Isa. 56:3–5]] in mind. Why is it fitting that he was reading Isaiah?
  - **Cush in Isaiah.** Trace Cush/Ethiopia through [[Isa. 11:11]], [[Isa. 20:3–5]], [[Isa. 37:9]], [[Isa. 43:3]], and [[Isa. 45:14]].

sources: [bd-ethiopia, pratt-jod-16-rise-of-zion, ot-manual-14, mcconkie-keys, delitzsch, lds-scriptures]
