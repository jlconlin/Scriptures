chapter: 44
title: Half for the Fire, Half for a God
tagline: The Lord pours His Spirit on Israel’s children, mocks the man who cooks dinner and carves a god from the same log, blots out sins like a cloud, and names Cyrus as His shepherd.
when: 'Addressed to the exiles in Babylon (6th century BC)'

setting: |
  Chapter 44 sits at the center of Isaiah’s argument against idolatry and at the turning point toward Cyrus. It holds the longest and funniest idol satire in the Bible (verses 9–20), and it ends with the first mention of Cyrus by name (verse 28).

  For the exiles, idols were not an abstraction. Babylon’s cult statues were public figures: the *Nabonidus Chronicle* records the New Year (*akītu*) festival, when the god Bel “came out,” and in the last year of Babylon’s independence gods from other cities were brought into the capital. Those statues were believed to be more than symbols. In Mesopotamian religion a newly made cult image underwent a ritual called *mīs pî*, “washing of the mouth,” which transformed it into a god worthy of worship. In the course of the ritual, the craftsmen who had made the statue were made to say that they had not made it; the craftsman god had. Isaiah’s satire dwells on exactly what that ritual set aside.

  Several modern translations, the NRSVUE among them, print verses 9–20 as prose paragraphs rather than poetry. Whatever one makes of that, the passage fits its setting perfectly. It sits between declarations that the Lord “formed” Israel (verses 2, 21, 24), and it is about people who “form” gods (verses 9–10).

thread: |
  Isaiah 44 asks **who makes whom?**

  The chapter begins with the Lord who “made thee, and formed thee from the womb” (verse 2). He promises to pour His Spirit on Israel’s children, who will spring up like willows by streams, and people will proudly write on their hands, “The LORD’s” (verses 3–5). The Lord is the first and the last, the Rock besides whom there is no other (verses 6–8).

  Then comes the satire. A blacksmith sweats and grows faint making a god (verse 12). A carpenter measures and carves a human figure, “that it may remain in the house” (verse 13). And a man cuts down a tree, uses half of it to bake bread and roast meat, warms himself, says “Aha, I am warm,” and then carves the rest into a god and prays to it: “Deliver me; for thou art my god” (verses 15–17). He never stops to ask, “Is there not a lie in my right hand?” (verse 20).

  The idol-maker forms his god. Israel’s God forms His people. The difference is the whole difference between idolatry and faith. An idol is a god you make, and so it can do nothing for you that you couldn’t do yourself. The living God makes you, and He can save you.

  So the chapter ends with the Maker at work. He blots out sins like a cloud (verse 22), sets the heavens singing (verse 23), and announces a series of acts that climax in a name: Cyrus, “my shepherd,” who will say to Jerusalem, “Thou shalt be built” (verse 28).

sections:
  - range: 1-5
    heading: Water on the thirsty, Spirit on the children
    plain: |
      But now listen, Jacob My servant, Israel whom I have chosen. This is what the Lord says, who made you and formed you in the womb and will help you: “Don’t be afraid, Jacob My servant, Jeshurun whom I have chosen. For I will pour water on the thirsty land and streams on the dry ground. I will pour out My Spirit on your descendants and My blessing on your children. They will spring up like grass among the waters, like willows beside flowing streams. One will say, ‘I belong to the Lord.’ Another will call himself by the name of Jacob. Another will write on his hand, ‘The Lord’s,’ and take the name of Israel.”
  - range: 6-8
    heading: No other Rock
    plain: |
      This is what the Lord says, Israel’s King and Redeemer, the Lord of hosts: “I am the first and I am the last. There is no God but Me. Who is like Me? Let him say so and prove it to Me, since I established My ancient people. Let them announce what is coming and what will happen. Don’t be terrified or afraid. Didn’t I tell you long ago and announce it? You are My witnesses. Is there any God besides Me? There is no other Rock; I don’t know of any.”
  - range: 9-20
    heading: The idol-maker
    plain: |
      All who make idols are nothing, and the things they treasure are worthless. Their witnesses don’t see or know anything, so they will be put to shame. Who would shape a god or cast an idol that can’t do anything? All its devotees will be put to shame. The craftsmen are only human. Let them all gather and take their stand; they will be terrified and ashamed together.

      The blacksmith works it over the coals with his tools and shapes it with hammers, working with his strong arm. He gets hungry and loses his strength. He doesn’t drink water and grows faint. The woodworker stretches out a measuring line and marks the outline with a stylus. He shapes it with chisels and marks it with a compass. He makes it in the form of a man, with human beauty, to live in a shrine. He cuts down cedars, or takes a cypress or an oak and lets it grow strong among the trees of the forest. He plants a laurel, and the rain makes it grow. It becomes fuel for people. He takes some of it to warm himself; he builds a fire and bakes bread. Then he makes a god from it and worships it; he makes an idol and bows down to it. He burns half of it in the fire, and over that half he roasts meat and eats until he’s full. He warms himself and says, “Ah! I’m warm; I can see the fire.” From the rest he makes a god, his idol. He bows down to it and worships it. He prays to it and says, “Save me, for you are my god.”

      Such people don’t know or understand, for their eyes are smeared shut so they can’t see, and their minds so they can’t understand. No one stops to think. No one has the sense to say, “I burned half of it in the fire. I baked bread on its coals and roasted meat and ate it. Should I make something detestable with the rest of it? Should I bow down to a block of wood?” He feeds on ashes. His deceived heart has led him astray. He can’t save himself or say, “Isn’t this thing in my right hand a lie?”
  - range: 21-23
    heading: Blotted out like a cloud
    plain: |
      “Remember these things, Jacob, and you, Israel, for you are My servant. I formed you; you are My servant, Israel. I will not forget you. I have swept away your transgressions like a cloud and your sins like a mist. Come back to Me, for I have redeemed you.” Sing for joy, you heavens, for the Lord has done this. Shout, you depths of the earth. Break out into song, you mountains, you forests and every tree in them. For the Lord has redeemed Jacob, and He displays His glory in Israel.
  - range: 24-28
    heading: “He is my shepherd”
    plain: |
      This is what the Lord says, your Redeemer, who formed you in the womb: “I am the Lord, who made everything, who stretched out the heavens by Myself and spread out the earth alone. I make the omens of false prophets fail and make fools of fortune-tellers. I overturn the wisdom of the wise and turn their knowledge into nonsense. I confirm the word of My servant and fulfill the plan of My messengers. I say of Jerusalem, ‘She will be inhabited,’ and of the towns of Judah, ‘They will be rebuilt; I will restore their ruins.’ I say to the deep, ‘Dry up! I will dry up your rivers.’ I say of Cyrus, ‘He is My shepherd, and he will accomplish everything I want.’ He will say of Jerusalem, ‘She will be rebuilt,’ and of the temple, ‘Your foundation will be laid.’”

notes:
  - ref: 2
    phrase: thou, Jesurun, whom I have chosen
    kind: words
    title: Jeshurun, the upright one
    body: |
      “Jesurun” (usually spelled Jeshurun) is a rare poetic name for Israel. Outside this verse it appears only in Deuteronomy ([[Deut. 32:15]]; [[Deut. 33:5]], [[Deut. 33:26]]). BDB defines it as “upright one,” a poetic name for Israel “under its ideal character.” Delitzsch traces it to *yāšar*, “straight” or “even.”

      The name carries an irony. Its first use is in the Song of Moses: “But Jeshurun waxed fat, and kicked… then he forsook God which made him” ([[Deut. 32:15]]). The “upright one” was the one who wasn’t. By using the name here, the Lord calls Israel by what it was meant to be, not by what it had become. That is how He often speaks to His people.
    sources: [bdb, delitzsch]
  - ref: 3
    phrase: I will pour my spirit upon thy seed, and my blessing upon thine offspring
    kind: scripture
    title: Water and Spirit
    body: |
      Water poured on dry ground is one of Isaiah’s favorite images (compare [[Isa. 35:6–7]]; [[Isa. 41:17–18]]). Here the image is explained: the water is the Spirit. The prophet Joel makes the same promise: “I will pour out my spirit upon all flesh” ([[Joel 2:28]]), and Peter declared it fulfilled at Pentecost ([[Acts 2:16–18]]).

      Jesus used the same connection at the Feast of Tabernacles, at which a libation of water was poured out at the temple each day: “He that believeth on me, as the scripture hath said, out of his belly shall flow rivers of living water. (But this spake he of the Spirit…)” ([[John 7:38–39]]). Moroni, who quoted Joel’s promise to Joseph Smith as “not yet fulfilled, but was soon to be” ([[JS—H 1:41]]), saw it as a latter-day promise as well.

      Notice to whom the promise is made: “thy seed” and “thine offspring.” It is a promise to parents about their children, the generation that will rise up after the exile “as willows by the water courses.” Parents who worry about their children can hold on to it.
    sources: [delitzsch, je-water-drawing]
  - ref: 5
    phrase: another shall subscribe with his hand unto the LORD, and surname himself by the name of Israel
    kind: history
    title: Writing “The LORD’s” on the hand
    body: |
      “Subscribe with his hand unto the LORD” translates *yikhtōb yādô laYHWH*, “will write his hand, *To the LORD*.” Readers have taken it two ways. The Septuagint has the person write “with his hand, I am God’s,” and Delitzsch reads it so: a declaration, in writing, of belonging to the Lord alone. Others read “write *on* his hand,” as a mark; Delitzsch objects that the Hebrew would then need “on” and that the law forbade tattooing ([[Lev. 19:28]]). Either way the verse pictures people doing it voluntarily and proudly: *I belong to the Lord.* Compare the seal on the foreheads of the Lord’s servants in [[Rev. 7:3]] and [[Rev. 14:1]].

      Who are these people? The verse describes three people who each claim a name, and the last “surnames” himself with Israel’s. Delitzsch takes them to be **the heathen**, who will count it an honor to belong to the Lord and His people, so that the name Israel becomes a title of honor among them. Isaiah 56 will develop the idea ([[Isa. 56:3–8]]).

      That is how Latter-day Saints understand the covenant with Abraham. The Lord told Abraham that “as many as receive this Gospel shall be called after thy name, and shall be accounted thy seed” ([[Abr. 2:10]]), and the Bible Dictionary says that those of non-Israelite lineage “are adopted into the house of Israel.” Paul taught the same: “if ye be Christ’s, then are ye Abraham’s seed” ([[Gal. 3:29]]). Latter-day Saints receive a declaration of their lineage in Israel in patriarchal blessings.
    sources: [delitzsch, biblehub-interlinear, lxx-rahlfs, bd-abraham-covenant, gs-patriarchal-blessings]
  - ref: 8
    phrase: Is there a God beside me? yea, there is no God; I know not any
    kind: christ
    title: No other Rock
    body: |
      The KJV says “there is no God,” but the Hebrew word in the second half of the verse is *ṣûr*, **Rock**: “there is no Rock; I know not any.” The title is ancient. In the Song of Moses, the Lord is “the Rock, his work is perfect” ([[Deut. 32:4]]), and Israel’s tragedy is that it “lightly esteemed the Rock of his salvation” ([[Deut. 32:15]]). Hannah sang, “neither is there any rock like our God” ([[1 Sam. 2:2]]).

      The New Testament gives the title to Christ: “that Rock was Christ” ([[1 Cor. 10:4]]). And the Book of Mormon’s best-known use of the image comes from Helaman’s counsel to his sons: “remember that it is upon the rock of our Redeemer, who is Christ, the Son of God, that ye must build your foundation” ([[Hel. 5:12]]).

      Here the Rock is contrasted with idols made of wood and metal. An idol has to be nailed down to keep it from falling over ([[Isa. 41:7]]). The Rock doesn’t move. Delitzsch glosses the Hebrew “rock” here as “no ground of trust.”
    sources: [biblehub-interlinear, delitzsch]
  - ref: 12
    phrase: 'yea, he is hungry, and his strength faileth: he drinketh no water, and is faint'
    kind: symbol
    title: The god-maker gets tired
    body: |
      There is a small, pointed joke here. The blacksmith making a god works so hard that he gets hungry and faint. A few pages earlier Isaiah said that the true God “fainteth not, neither is weary” ([[Isa. 40:28]]) and gives power to the faint.

      The idol-maker’s god is only as strong as the man who made it, and the man is exhausted. That’s the trouble with any god we make ourselves, whether it’s a career, a reputation, a relationship, or a plan. It takes everything we have to keep it standing, and it gives nothing back. President Spencer W. Kimball observed that many people spend most of their time “working in the service of a self-image” built on money, property, and possessions, hoping it will guarantee their security. The test is simple: does it give strength, or does it consume it?
    sources: [kimball-false-gods]
  - ref: 17
    phrase: And the residue thereof he maketh a god, even his graven image
    kind: history
    title: Satire and the mouth-washing ritual
    body: |
      Verses 14–17 are the comic heart of the chapter. A man plants a tree and lets the rain water it. He cuts it down. Half goes into the stove: he bakes bread, roasts meat, eats his fill, warms himself, and says, “Aha, I am warm.” The other half he carves into a god, bows down, and prays, “Deliver me; for thou art my god.” The same log is firewood and deity.

      Is this fair to Babylonian religion? The Mesopotamian ritual texts suggest that worshippers didn’t think the wood itself was the god. In the *mīs pî* (“mouth-washing”) ritual the image was said to be “born in heaven,” and its mouth was washed seven times until it could eat, drink, and hear. During the ritual the craftsmen’s tools were symbolically returned to the craftsman god Ea, and the craftsmen had their hands ritually “cut off” and were made to say, “I did not create the statue! … [the craftsman god] created the statue!”

      The ritual insisted that human hands did not make the god. Isaiah insists, at comic length, that they did: the smith with his tools, the carpenter with his line, the man with his leftover firewood. He describes the workshop. That isn’t a misunderstanding of idolatry. It reads as a refusal to accept its central claim, though we cannot know how much of the ritual Isaiah’s audience knew in detail.
    sources: [gabbay-idolatry, delitzsch]
  - ref: 20
    phrase: 'He feedeth on ashes: a deceived heart hath turned him aside, that he cannot deliver his soul, nor say, Is there not a lie in my right hand?'
    kind: words
    title: Shepherding ashes, and a lie in the hand
    body: |
      “He feedeth on ashes” is *rōʿeh ʾēper*. The verb *rāʿâ* means “to pasture” or “to tend”; BDB lists this verse as a figurative use, “of idolater.” Delitzsch takes the sense as striving after ashes, “things easily scattered, perishable, and worthless.” The Septuagint reads differently: “their heart is ashes.” Eight verses later, the Lord says of Cyrus, “He is my shepherd” (*rōʿî*, verse 28), a form of the same verb. The idolater tends ashes; the Lord’s shepherd rebuilds Jerusalem. The echo may well be deliberate.

      The final question is the one the idol-maker can never ask: “Is there not a lie in my right hand?” The thing he is holding, the thing he made and trusts, is false, and he can’t see it because a “deceived heart hath turned him aside.” Delitzsch: “All that belongs to idolatry is *sheqer*, a fabrication and a lie.”

      The question is worth asking of anything we hold tightly. Nephi warned of those who are pacified and lulled “into carnal security” and led “carefully down to hell” ([[2 Ne. 28:21]]). Self-deception is the one deception we can’t detect by ourselves. That’s why we need revelation.
    sources: [bdb, delitzsch, biblehub-interlinear, lxx-rahlfs]
  - ref: 22
    phrase: I have blotted out, as a thick cloud, thy transgressions, and, as a cloud, thy sins
    kind: christ
    title: Like a cloud
    body: |
      Delitzsch notes that the point of the comparison is not the dark, heavy mass of sins but “the facility and rapidity with which they are expunged”: the Lord clears sin away as His wind sweeps away the clouds and restores the blue sky. Hosea used a cloud for something fleeting, Israel’s goodness: “your goodness is as a morning cloud, and as the early dew it goeth away” ([[Hosea 6:4]]). Isaiah turns the image into forgiveness.

      The order of the verse matters. First, “I have blotted out… thy sins.” Then, “return unto me.” Delitzsch observes that forgiveness and redemption here “are not offered on condition of conversion”; Israel is called to respond to mercy already given. This is grace. The father of the prodigal son ran to meet him “when he was yet a great way off” ([[Luke 15:20]]). Alma the Younger described what it felt like when the cloud lifted: “I could remember my pains no more… And oh, what joy, and what marvelous light I did behold” ([[Alma 36:19–20]]).
    sources: [delitzsch]
  - ref: 27
    phrase: That saith to the deep, Be dry, and I will dry up thy rivers
    kind: history
    title: The drying of the deep
    body: |
      “The deep” (*ṣûlâ*) is a word BDB lists only here, glossed “ocean-deep.” Delitzsch hears in the verse the drying up of the Red Sea ([[Ex. 14:21]]; [[Isa. 51:10]]; [[Isa. 43:16]]), and also a coming event, the drying up of the Euphrates.

      There may be a historical echo too. The Greek historian **Herodotus** (*Histories* 1.191) reports that Cyrus captured Babylon by leading the Euphrates off into a lake, so that the old course of the river became passable, and sending his troops in along the riverbed while those in the middle of the city, not knowing it had been taken, went on with a festival. The Cyrus Cylinder and the *Nabonidus Chronicle*, which are closer to the event, say instead that Cyrus’s army entered Babylon without a battle. So the accounts differ. But it is striking that Babylon’s fall became associated with dried-up rivers, and that Jeremiah prophesied, “I will dry up her sea, and make her springs dry” ([[Jer. 51:36]]).
    sources: [biblehub-interlinear, bdb, delitzsch, herodotus-macaulay, rogers-cuneiform, livius-abc7]

  - ref: 28
    phrase: That saith of Cyrus, He is my shepherd, and shall perform all my pleasure
    kind: history
    title: Cyrus by name
    body: |
      Here, for the first time in the book, Cyrus is named. The Persian king **Cyrus II** (*Kōreš* in Hebrew, a Hebraized form of the Persian *Kuru*) took Babylon in 539 BC. In the Cyrus Cylinder he says that Marduk “called by name” Cyrus, king of Anshan, and that his army entered Babylon “without battle and conflict.” The Bible Dictionary says he issued a decree allowing the Jews to return and rebuild the temple ([[Ezra 1:1–4]]; [[Ezra 6:3–5]]).

      “Shepherd” was a common royal title in Mesopotamia. The prologue to Hammurabi’s laws has “Hammurapi, the shepherd, called of Ellil,” and the inscriptions of Arad-Sin and Nebuchadrezzar use “faithful shepherd.” Calling a Persian king “my shepherd” is startling. It puts him in the role of Israel’s own kings. (The Septuagint reads differently: “Who bids Cyrus be wise.”)

      The naming of Cyrus sits at the center of the debate over who wrote these chapters. The *Jewish Encyclopedia* (1906) already called the “Prophecy of Restoration” a late exilic work; see the setting of Isaiah 40 for the positions. Believing readers point out that the Bible contains at least one other prophecy naming a future king: a man of God who came to Bethel named **Josiah** long before his birth ([[1 Kgs. 13:2]]; fulfilled in [[2 Kgs. 23:15–16]]). Latter-day Saints have a further example: Joseph of Egypt foresaw a latter-day seer whose name would be Joseph ([[2 Ne. 3:15]]). These chapters themselves make the argument that predicting the future is what distinguishes the true God from idols ([[Isa. 44:7]]; [[Isa. 45:21]]; [[Isa. 46:10]]).

      The Jewish historian Josephus (*Antiquities* 11.1.2) reports that Cyrus read what Isaiah had written about him and was moved to fulfill it. It shows at least one ancient Jewish reader’s understanding of the passage.
    sources: [delitzsch, biblehub-interlinear, bdb, lxx-rahlfs, bd-cyrus, rogers-cuneiform, je-isaiah, josephus-whiston]

christ: |
  The Lord who speaks in Isaiah 44 calls Himself the King of Israel, its Redeemer, the first and the last, and the Rock besides whom there is no other. The New Testament applies titles like these to Jesus: the King of Israel ([[John 1:49]]), the first and the last ([[Rev. 1:17–18]]), the Rock ([[1 Cor. 10:4]]). Helaman taught his sons to build on “the rock of our Redeemer, who is Christ” ([[Hel. 5:12]]).

  Cyrus, named as the Lord’s “shepherd” and, in the next chapter, His “anointed,” is a type of the greater Deliverer. Cyrus freed the captives and ordered the temple rebuilt. Jesus, the Good Shepherd and the true Anointed One (*Messiah*, *Christ*), frees captives from sin and death and makes His people a temple ([[1 Cor. 3:16]]). But Cyrus never knew the Lord ([[Isa. 45:4]]). Jesus is the Lord.

  Most of all, the chapter shows the difference between a god we make and the God who makes us. Jesus is not a god of our own design. He forms us, pours His Spirit on our children, and blots out our sins like a cloud.

explore: |
  - **The idol satires.** Read [[Isa. 40:18–20]], [[Isa. 41:6–7]], [[Isa. 44:9–20]], and [[Isa. 46:1–7]], then compare [[Ps. 115:4–8]] and [[Jer. 10:1–16]].
  - **Cyrus.** Read [[Isa. 44:24–45:13]], [[2 Chr. 36:22–23]], [[Ezra 1:1–4]], and a translation of the Cyrus Cylinder.
  - **The Rock.** Trace the title through [[Deut. 32]], [[Ps. 18:2]], [[1 Cor. 10:4]], [[Hel. 5:12]], and [[D&C 50:44]].
  - **Named in advance.** Compare [[1 Kgs. 13:2]] with [[2 Kgs. 23:15–16]], and [[2 Ne. 3:6–15]].
  - **Adoption into Israel.** Read [[Isa. 56:3–8]], [[Abr. 2:9–11]], [[Gal. 3:26–29]], and [[3 Ne. 30:2]].

parallels:
  - ref: Ezra 1:1–4
    note: Cyrus’s decree allowing the Jews to return and rebuild the temple.
  - ref: 2 Chr. 36:22–23
    note: The closing verses of Chronicles, announcing Cyrus’s decree.
  - ref: Ps. 115:4–8
    note: A psalm that mocks idols that cannot see, hear, or walk.
  - ref: Jer. 10:1–16
    note: Jeremiah’s parallel satire on idols made by craftsmen.

