chapter: 25
title: A Feast on the Mountain, and Death Swallowed Up
tagline: The Lord prepares a banquet for all peoples, removes the veil over the nations, swallows up death, and wipes away every tear.
when: 'A vision of the Millennium and the resurrection'

setting: |
  Chapter 24 ended with the Lord reigning gloriously on Mount Zion. Chapter 25 is the song of the redeemed who live under that reign. It begins as a personal hymn of thanksgiving (verses 1–5) and then opens into one of the most beautiful promises in scripture: a great feast on “this mountain” for **all people**, the removal of the veil over the nations, and the end of death itself (verses 6–9).

  This chapter echoes widely. Paul quotes verse 8 in his great chapter on the resurrection ([[1 Cor. 15:54]]). John borrows verse 8 twice in Revelation ([[Rev. 7:17]]; [[Rev. 21:4]]). And the Lord quoted verse 6 in a revelation to the Saints in Missouri in 1831 ([[D&C 58:8–11]]).

thread: |
  Isaiah 25 is built around **one mountain and three things that happen on it**.

  The key phrase is “in this mountain,” repeated three times (verses 6, 7, 10). The mountain is Zion, the mountain of the Lord’s house from [[Isa. 2:2–3]], where all nations flow.

  **First, a feast (verse 6).** The Lord Himself is the host, and the guest list is “all people.” The menu is rich food, “full of marrow,” and wine that has aged on its lees and been “well refined.” It is a banquet, and everyone is invited.

  **Second, the veil is removed (verse 7).** A “covering” and a “veil” are spread over all nations. The Lord will destroy it. What the veil is, readers differ (see the note on verse 7).

  **Third, death is swallowed (verse 8).** Isaiah had already pictured the grave as a mouth opened “without measure” ([[Isa. 5:14]]). Now the tables are turned: “He will swallow up death in victory.” The swallower is swallowed. And then, the tenderest line in the chapter: “the Lord GOD will wipe away tears from off all faces.”

  The people’s response is simple: “Lo, this is our God; we have waited for him, and he will save us” (verse 9).

  The chapter answers the chaos of chapter 24 with the ultimate reversal. Chapter 24 showed a city of chaos with its wine gone bitter ([[Isa. 24:7–11]]). Chapter 25 shows wine “well refined” at the Lord’s own table.

sections:
  - range: 1-5
    heading: A song of thanksgiving
    plain: |
      Lord, You are my God. I will exalt You and praise Your name, because You have done wonderful things; Your plans made long ago are faithful and sure. You have turned the city into a heap of rubble and the fortified town into a ruin. The foreigners’ palace is no longer a city and will never be rebuilt. So strong peoples will honor You, and the city of ruthless nations will revere You. You have been a refuge for the poor, a shelter for the needy in their distress, a shelter from the storm and shade from the heat. The blast of the ruthless is like a storm beating against a wall. You quiet the uproar of foreigners like heat in a dry land. As the shade of a cloud cools the heat, so the branch of the ruthless is brought low.
  - range: 6-9
    heading: The feast, the veil, and the end of death
    plain: |
      On this mountain the Lord of hosts will prepare a feast for all peoples: a banquet of rich food full of marrow and aged wine well refined. On this mountain He will destroy the covering that is cast over all peoples, the veil spread over all nations. He will swallow up death in victory. The Lord God will wipe away the tears from every face and take away the rebuke of His people from all the earth. The Lord has spoken. In that day they will say, “Look, this is our God! We waited for Him, and He saved us. This is the Lord; we waited for Him. Let us rejoice and be glad in His salvation.”
  - range: 10-12
    heading: Moab brought low
    plain: |
      The Lord’s hand will rest on this mountain. But Moab will be trampled down like straw trampled in a manure pit. Moab will spread out its hands in the middle of it, like a swimmer stretching out to swim, but the Lord will bring down its pride together with the spoils of its hands. He will bring down its high fortified walls and throw them to the ground, into the dust.

notes:
  - ref: 1
    phrase: thy counsels of old are faithfulness and truth
    kind: scripture
    title: Plans made long ago
    sources: [lds-scriptures]
    body: |
      The song begins by praising the Lord not only for what He has done, but for *when* He planned it: “thy counsels of old.” What looked like sudden deliverance was part of a plan laid down long before.

      Other scripture speaks the same way: the Lord showed Abraham a council held before the world was ([[Abr. 3:22–28]]), and Peter says Christ was “foreordained before the foundation of the world” ([[1 Pet. 1:19–20]]).
  - ref: 4
    phrase: a refuge from the storm, a shadow from the heat
    kind: scripture
    title: Refuge from the storm
    sources: [lds-scriptures]
    body: |
      Isaiah returns to the image from [[Isa. 4:6]]: the Lord as shelter from storm and shade from heat. The storm here is “the blast of the terrible ones,” the ruthless oppressors whose rage beats against the poor like a storm against a wall.

      The Lord applied this to the stakes of Zion in the latter days: “a defense, and… a refuge from the storm” ([[D&C 115:6]]). And Helaman promised that those built on the rock of Christ will stand when “the devil shall send forth his mighty winds… and his mighty storm” ([[Hel. 5:12]]).
  - ref: 6
    phrase: a feast of fat things, a feast of wines on the lees
    kind: scripture
    title: A feast of fat things
    sources: [lds-scriptures, bdb, ot-manual-15, dc-58-heading]
    body: |
      “Fat things” is the language of richness: the Hebrew word means fat or oil, and here it describes food. “Wines on the lees” were wines matured by resting undisturbed on their sediment, then “well refined.” The Lord is the host.

      The Lord quoted this verse in a revelation given in Missouri in August 1831. He said He had sent the Saints there so “that a feast of fat things might be prepared for the poor; yea, a feast of fat things, of wine on the lees well refined… Yea, a supper of the house of the Lord, well prepared, unto which all nations shall be invited” ([[D&C 58:8–9]]). He then gave the order of the invitation: first “the rich and the learned, the wise and the noble,” and after that “the poor, the lame, and the blind, and the deaf” ([[D&C 58:10–11]]).

      The feast is read as the fruits of the gospel enjoyed in full at the Lord’s return. Other scripture speaks of a “marriage supper of the Lamb” ([[Rev. 19:9]]; [[D&C 65:3]]) and a wedding feast in a parable ([[Matt. 22:1–10]]).
  - ref: 6
    phrase: unto all people
    kind: scripture
    title: Everyone is invited
    sources: [lds-scriptures]
    body: |
      Notice the guest list: “all people.” Not just Israel, not just the righteous remnant, but all peoples and nations. It matches Isaiah’s vision of every nation flowing to the Lord’s house ([[Isa. 2:2]]) and of Egypt and Assyria worshipping with Israel ([[Isa. 19:23–25]]).

      Nephi said the Lord “inviteth them all to come unto him and partake of his goodness; and he denieth none that come unto him” ([[2 Ne. 26:33]]).
  - ref: 7
    phrase: the veil that is spread over all nations
    kind: symbol
    title: The veil removed
    sources: [lds-scriptures, ot-manual-15]
    body: |
      What the “covering” and “veil” are is not stated, and faithful readers differ. One reading is mourning: mourners covered their heads and faces ([[2 Sam. 15:30]]; [[2 Sam. 19:4]]), and verse 8 goes on to speak of death and tears. Another reading takes it as the “dark veil of unbelief” ([[Alma 19:6]]; [[Ether 4:15]]) or as a literal “veil of darkness” at the Second Coming ([[Moses 7:61]]).

      Scripture uses the image of a veil in several related ways. Paul wrote that a veil lies over the heart when the old covenant is read, but “when it shall turn to the Lord, the veil shall be taken away” ([[2 Cor. 3:14–16]]). The Lord promised that “the veil of darkness shall soon be rent” ([[D&C 38:8]]), and that at His coming “the veil of the covering of my temple, in my tabernacle, which hideth the earth, shall be taken off, and all flesh shall see me together” ([[D&C 101:23]]).
  - ref: 8
    phrase: He will swallow up death in victory
    kind: christ
    title: The swallower swallowed
    sources: [lds-scriptures, bdb]
    body: |
      Isaiah pictured the grave opening its mouth “without measure” in [[Isa. 5:14]]. Now the Lord turns the image around: **He** swallows **death**. The Hebrew word (*lanetsach*) is the usual word for “for ever”; Paul’s quotation of the verse reads “in victory” ([[1 Cor. 15:54]]).

      Paul quoted this verse as the climax of his chapter on the resurrection: “then shall be brought to pass the saying that is written, Death is swallowed up in victory. O death, where is thy sting? O grave, where is thy victory?” ([[1 Cor. 15:54–55]]). Abinadi taught the same: “there is a resurrection, therefore the grave hath no victory, and the sting of death is swallowed up in Christ” ([[Mosiah 16:8]]; see [[Alma 22:14]]; [[Morm. 7:5]]).

      This is fulfilled through the resurrection of Jesus Christ. Because He rose, all will rise ([[1 Cor. 15:22]]; [[Alma 11:42–44]]).
  - ref: 8
    phrase: the Lord GOD will wipe away tears from off all faces
    kind: christ
    title: He will wipe away the tears
    sources: [lds-scriptures]
    body: |
      After the cosmic language of swallowing death comes a tender image: the Lord Himself wiping tears from faces.

      John quotes it twice: “God shall wipe away all tears from their eyes” ([[Rev. 7:17]]); “and God shall wipe away all tears from their eyes; and there shall be no more death, neither sorrow, nor crying” ([[Rev. 21:4]]). Alma taught that the Savior would take upon Him our pains and afflictions so that He would know “how to succor his people according to their infirmities” ([[Alma 7:11–12]]).
  - ref: 9
    phrase: Lo, this is our God; we have waited for him, and he will save us
    kind: scripture
    title: '“This is our God”'
    sources: [lds-scriptures]
    body: |
      The response of the redeemed is to point: *Lo*, look! *This* is our God. The long waiting is over, and He is recognized.

      Such a moment of recognition will come at the Second Coming. The Jews will look on the Lord and ask, “What are these wounds in thine hands and in thy feet?” He will answer: “These wounds are the wounds with which I was wounded in the house of my friends. I am he who was lifted up. I am Jesus that was crucified. I am the Son of God” ([[D&C 45:51–52]]). The Nephites had their own such moment when the risen Christ descended and said, “Behold, I am Jesus Christ” ([[3 Ne. 11:10]]).

christ: |
  Isaiah 25 is full of Jesus Christ. He is the **Host of the feast**, “a supper of the house of the Lord… unto which all nations shall be invited” ([[D&C 58:9]]). He is the one who **removes the veil** so all flesh can see Him ([[D&C 101:23]]). He **swallows up death** by His resurrection ([[1 Cor. 15:54]]; [[Mosiah 16:8]]). He **wipes away tears** from every face ([[Rev. 21:4]]). And He is the One the redeemed point to and say, “Lo, this is our God; we have waited for him, and he will save us.”

explore: |
  - **The feast.** Read Isaiah 25:6–9 with [[D&C 58:6–12]], [[Matt. 22:1–14]], [[Luke 14:15–24]], and [[Rev. 19:6–9]].
  - **Death swallowed.** Compare [[Isa. 5:14]], [[Isa. 25:8]], [[1 Cor. 15:51–57]], and [[Mosiah 16:6–11]].
  - **Recognition.** Read [[D&C 45:47–53]] and [[3 Ne. 11:8–17]]. How do they fulfill “Lo, this is our God”?

parallels:
