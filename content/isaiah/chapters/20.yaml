chapter: 20
title: The Prophet Who Walked Barefoot
tagline: For three years Isaiah walked stripped and barefoot as a living warning not to trust Egypt and Cush.
when: '711 BC, when the Assyrians captured Ashdod'

setting: |
  This short chapter is one of the few in Isaiah dated by a particular event. In **711 BC** the Philistines rose against Assyria, and the city at the center of the revolt was **Ashdod**, one of their five chief cities. They looked to Egypt and Cush (Ethiopia) for help, and Judah, too, was looking to Egypt. Sargon II of Assyria sent his *tartan* (chief captain), who took Ashdod. Once more the Egyptians failed their friends.

  Assyrian records bear on the episode. Sargon’s annals, as Delitzsch reports them, tell of dethroning the rebellious king of Ashdod, of that king’s flight into Egypt, and of Sargon’s capture of the city.

  During this crisis, the Lord told Isaiah to act out his message. For three years, Isaiah went about in public stripped to his tunic and barefoot, dressed like a prisoner of war.

thread: |
  Isaiah 20 teaches with a **picture instead of a poem**, and the picture is uncomfortable on purpose.

  The prophets sometimes acted out God’s messages. Jeremiah wore a yoke ([[Jer. 27:2]]); Ezekiel lay on his side for more than a year ([[Ezek. 4:4–6]]); Agabus bound himself with Paul’s belt ([[Acts 21:10–11]]). Isaiah’s sign is one of the most startling. He takes off his rough prophet’s garment and his sandals and goes about that way, day after day, for three years.

  Why? Because verse 4 says that is how the king of Assyria will lead away his captives: naked, barefoot, and shamed. Isaiah is showing Judah, in his own body, what will happen to Egypt and Cush, the very allies Judah was tempted to trust. If the “protectors” end up as barefoot captives, what hope is there in them?

  The chapter ends with the people of the coastland admitting it: “Behold, such is our expectation, whither we flee for help… and how shall we escape?” (verse 6). That is the question Isaiah wants Judah to ask *before* it is too late. The answer, repeated throughout the book, is not Egypt. It is the Lord.

sections:
  - range: 1-2
    heading: Stripped and barefoot
    plain: |
      In the year that the Assyrian commander came to Ashdod, sent by King Sargon of Assyria, and fought against it and captured it, the Lord spoke through Isaiah son of Amoz: “Take the sackcloth off your waist and the sandals off your feet.” He did, and walked around stripped and barefoot.
  - range: 3-6
    heading: A sign against trusting Egypt
    plain: |
      Then the Lord said: “Just as My servant Isaiah has walked stripped and barefoot for three years as a sign and a warning against Egypt and Cush, so the king of Assyria will lead away the captives of Egypt and the exiles of Cush, young and old, stripped and barefoot, with their buttocks exposed, to Egypt’s shame. Those who trusted in Cush and boasted in Egypt will be terrified and ashamed. On that day the people who live on this coast will say, ‘Look what happened to those we relied on, the ones we ran to for help to save us from the king of Assyria! How will we escape now?’”

notes:
  - ref: 1
    phrase: when Sargon the king of Assyria sent him
    kind: history
    title: The king archaeologists found
    body: |
      This is the only place in the Bible that names **Sargon II** (reigned 722–705 BC), the Assyrian king who concluded the siege of Samaria. His palace inscriptions from Khorsabad, which Delitzsch cites, describe his reign and include the campaign against **Ashdod**.

      The *tartan* is an Assyrian officer who appears again, with the Rabshakeh, at Jerusalem in [[2 Kgs. 18:17]]. Delitzsch takes him there as probably the same man, serving as chief captain under Sennacherib. He has also been described as Sargon’s most trusted servant.
    sources: [bd-assyria, delitzsch, ot-manual-14]
  - ref: 2
    phrase: loose the sackcloth from off thy loins, and put off thy shoe from thy foot
    kind: history
    title: What Isaiah took off
    body: |
      Isaiah was apparently wearing **sackcloth**, a coarse, hairy overcoat of the kind mourners wore, and it may have been a prophet’s customary clothing, like Elijah’s ([[2 Kgs. 1:8]]; [[Zech. 13:4]]). He removed it and his sandals and went about “naked,” which in Eastern usage meant stripped of the outer garment and left in the tunic, not completely unclothed.

      That was the dress of a man robbed and disgraced, a beggar, or a prisoner of war. Going barefoot also belonged to mourning ([[2 Sam. 15:30]]).
    sources: [delitzsch, lds-scriptures]
  - ref: 4
    phrase: So shall the king of Assyria lead away the Egyptians prisoners
    kind: history
    title: How captives were led away
    body: |
      Verse 4 spells out what Isaiah was acting out: captives, young and old, led away naked and barefoot, “to the shame of Egypt.”

      The fulfillment came within about forty years. Assyria’s king Esarhaddon (681–668 BC) invaded and conquered Egypt, and Nahum later holds up Egyptian Thebes, which “went into captivity,” as a warning to Nineveh ([[Nahum 3:8–10]]).
    sources: [bd-assyria, lds-scriptures]
  - ref: 6
    phrase: 'whither we flee for help to be delivered from the king of Assyria: and how shall we escape?'
    kind: christ
    title: '“How shall we escape?”'
    sources: [delitzsch, lds-scriptures]
    body: |
      “This isle” is a word that can mean an island or a coastland; it names Philistia and Phoenicia elsewhere, and here Delitzsch takes it chiefly of Judah, though not of Judah alone. Its people finally see the truth: their chosen protectors have been stripped and led away. So where can they flee?

      Isaiah has already given the answer: “The LORD hath founded Zion, and the poor of his people shall trust in it” ([[Isa. 14:32]]). The same question echoes in the New Testament: “How shall we escape, if we neglect so great salvation?” ([[Heb. 2:3]]). Only the Lord can deliver. Every other refuge eventually gets led away barefoot.

christ: |
  Isaiah’s humiliating obedience can be read as a faint pattern of the Savior’s. Isaiah was stripped as a sign so his people might avoid the shame of captivity. Jesus Christ was literally stripped of His garments ([[Matt. 27:28]]; [[John 19:23–24]]) and bore the ultimate shame so that we could be delivered from the captivity of sin. He “endured the cross, despising the shame” ([[Heb. 12:2]]).

  The chapter’s final question, “how shall we escape?”, finds its answer in Him. He is the one refuge that cannot be carried off.

explore: |
  - **Sign-acts.** Compare Isaiah 20 with [[Jer. 13:1–11]], [[Jer. 27:1–11]], [[Ezek. 4–5]], [[Hosea 1–3]], and [[Acts 21:10–11]]. Why might God choose actions instead of words?
  - **Trusting Egypt.** Read [[Isa. 30:1–7]] and [[Isa. 31:1–3]]. How does this chapter prepare for those later warnings?

sources: [bd-assyria, bd-philistines, bd-egypt, bd-ethiopia, ot-manual-14, delitzsch, lds-scriptures]
