chapter: 20
title: The Prophet Who Walked Barefoot
tagline: For three years Isaiah walked stripped and barefoot as a living warning not to trust Egypt and Cush.
when: '711 BC, when the Assyrians captured Ashdod'

setting: |
  This short chapter is one of the few in Isaiah with an exact historical date. In **711 BC**, the Philistine city of **Ashdod** rebelled against Assyria, counting on help from Egypt and Cush (Ethiopia). Judah was tempted to join. Sargon II of Assyria sent his *tartan* (commander in chief) and crushed the revolt. The promised Egyptian help never came.

  Assyrian records confirm the episode. Sargon’s annals describe the Ashdod rebellion, the rebel king’s flight toward Egypt, and his eventual handover to Assyria.

  During this crisis, the Lord told Isaiah to act out his message. For three years, Isaiah walked around Jerusalem stripped to a loincloth and barefoot, dressed like a prisoner of war.

thread: |
  Isaiah 20 teaches with a **picture instead of a poem**, and the picture is uncomfortable on purpose.

  The prophets sometimes acted out God’s messages. Jeremiah wore a yoke ([[Jer. 27:2]]); Ezekiel lay on his side for more than a year ([[Ezek. 4:4–6]]); Agabus bound himself with Paul’s belt ([[Acts 21:10–11]]). Isaiah’s sign is one of the most startling. He takes off his rough prophet’s garment and his sandals and walks around Jerusalem that way, day after day, for three years.

  Why? Because that is how Assyrian soldiers marched their captives into exile: stripped, barefoot, and humiliated. Isaiah is showing Judah, in his own body, what will happen to Egypt and Cush, the very allies Judah was tempted to trust. If the “protectors” end up as barefoot captives, what hope is there in them?

  The chapter ends with the people of the coastland admitting it: “Behold, such is our expectation, whither we flee for help… and how shall we escape?” (verse 6). That is the question Isaiah wants Judah to ask *before* it is too late. The answer, repeated throughout the book, is not Egypt. It is the Lord.

  There is also something moving about the obedience involved. Isaiah was a respected man, counselor to kings. For three years he accepted ridicule so that his people might be spared worse. Prophets sometimes pay a personal price to deliver an unwelcome message.

sections:
  - range: 1-2
    heading: Stripped and barefoot
    plain: |
      In the year that the Assyrian commander came to Ashdod, sent by King Sargon of Assyria, and fought against it and captured it, the Lord spoke through Isaiah son of Amoz: “Take the sackcloth off your waist and the sandals off your feet.” He did, and walked around stripped and barefoot.
  - range: 3-6
    heading: A sign against trusting Egypt
    plain: |
      Then the Lord said: “Just as My servant Isaiah has walked stripped and barefoot for three years as a sign and a warning against Egypt and Cush, so the king of Assyria will lead away the captives of Egypt and the exiles of Cush, young and old, stripped and barefoot, with their buttocks exposed, to Egypt’s shame. Those who trusted in Cush and boasted in Egypt will be terrified and ashamed. On that day the people who live on this coast will say, ‘Look what happened to those we relied on, the ones we ran to for help to save us from the king of Assyria! How will we escape now?’”

notes:
  - ref: 1
    phrase: when Sargon the king of Assyria sent him
    kind: history
    title: The king archaeologists found
    body: |
      This is the only place in the Bible that names **Sargon II** (reigned 722–705 BC), the Assyrian king who completed the conquest of Samaria. For a long time, some nineteenth-century scholars questioned whether he had existed, since classical historians hardly mentioned him. Then in the 1840s, excavators uncovered his enormous palace at Khorsabad in northern Iraq, with inscriptions describing his reign, including the campaign against **Ashdod** in 711 BC.

      “Tartan” is not a name but a title: the Assyrian *turtanu*, the army’s commander in chief. The same official appears with the Rabshakeh at Jerusalem in [[2 Kgs. 18:17]].
    sources: [bd-assyria, bd-philistines]
  - ref: 2
    phrase: loose the sackcloth from off thy loins, and put off thy shoe from thy foot
    kind: history
    title: What Isaiah took off
    body: |
      Isaiah was apparently wearing **sackcloth**, the rough goat-hair garment of mourning and repentance, which may have been a prophet’s customary clothing ([[2 Kgs. 1:8]]; [[Zech. 13:4]]). He removed it and his sandals and went about “naked,” which in Hebrew usage often means stripped to the undergarment or loincloth rather than completely unclothed.

      Even so, for a man of Isaiah’s standing it was a humiliating sight. Going barefoot was a sign of mourning, poverty, or captivity ([[2 Sam. 15:30]]; [[Micah 1:8]]).
  - ref: 3
    phrase: my servant Isaiah hath walked naked and barefoot three years for a sign and wonder
    kind: history
    title: Three years of an unpopular message
    body: |
      The Lord calls Isaiah “my servant,” a title of honor. And He asks him to be a living sign for three years. Imagine the stares, the jokes, and the whispers in the streets of Jerusalem. Isaiah accepted all of it because the message mattered more than his dignity.

      Prophets and faithful disciples have often been asked to do things that looked foolish to the world. Noah built an ark on dry ground. Nephi built a ship while his brothers mocked him ([[1 Ne. 17:17–19]]). Joseph Smith was ridiculed for a lifetime. The Lord told him that “fools shall have thee in derision” while “the pure in heart… shall seek counsel” from him ([[D&C 122:1–2]]).
  - ref: 4
    phrase: So shall the king of Assyria lead away the Egyptians prisoners
    kind: history
    title: How captives were led away
    body: |
      Assyrian palace reliefs show exactly what Isaiah was acting out: long lines of captives led away stripped, barefoot, sometimes bound, sometimes with hooks through their lips. It was a deliberate humiliation intended to break a conquered people’s spirit.

      The fulfillment came within a few decades. Assyria’s king Esarhaddon invaded Egypt and captured Memphis in 671 BC, and his successor Ashurbanipal sacked Thebes in 663 BC ([[Nahum 3:8–10]]). The mighty Egypt that Judah had leaned on was itself led away captive.
  - ref: 5
    phrase: they shall be afraid and ashamed of Ethiopia their expectation, and of Egypt their glory
    kind: words
    title: Ashamed of what we trusted
    body: |
      “Expectation” means *hope*, the thing one looks to for help. “Glory” means *boast*, the thing one brags about. Those who hoped in Cush and boasted in Egypt will be ashamed, not only because their allies failed, but because they chose them over the Lord.

      The Psalmist draws the contrast: “Some trust in chariots, and some in horses: but we will remember the name of the LORD our God. They are brought down and fallen: but we are risen, and stand upright” ([[Ps. 20:7–8]]). Nephi prayed, “I will not put my trust in the arm of flesh” ([[2 Ne. 4:34]]).
  - ref: 6
    phrase: 'whither we flee for help to be delivered from the king of Assyria: and how shall we escape?'
    kind: christ
    title: '“How shall we escape?”'
    body: |
      “This isle” means *this coastland*, the Philistine and Judean region along the Mediterranean. Its people finally see the truth: their chosen protectors have been stripped and led away. So where can they flee?

      Isaiah has already given the answer: “The LORD hath founded Zion, and the poor of his people shall trust in it” ([[Isa. 14:32]]). The same question echoes in the New Testament: “How shall we escape, if we neglect so great salvation?” ([[Heb. 2:3]]). Only the Lord can deliver. Every other refuge eventually gets led away barefoot.

christ: |
  Isaiah’s humiliating obedience foreshadows the Savior’s. Isaiah was stripped as a sign so his people might avoid the shame of captivity. Jesus Christ was literally stripped of His garments ([[Matt. 27:28]]; [[John 19:23–24]]) and bore the ultimate shame so that we could be delivered from the captivity of sin. He “endured the cross, despising the shame” ([[Heb. 12:2]]).

  The chapter’s final question, “how shall we escape?”, finds its answer in Him. He is the one refuge that cannot be carried off.

liken: |
  - What are my “Egypts and Cushes,” the resources I instinctively run to when I’m afraid? Have any of them ever been “led away barefoot”?
  - Would I be willing to look foolish for three years if the Lord asked me to, for the sake of a message others needed?
  - Verse 6 is a moment of honest realization. What would it look like to ask “how shall we escape?” *before* my props fail, rather than after?

explore: |
  - **Sign-acts.** Compare Isaiah 20 with [[Jer. 13:1–11]], [[Jer. 27:1–11]], [[Ezek. 4–5]], [[Hosea 1–3]], and [[Acts 21:10–11]]. Why might God choose actions instead of words?
  - **Trusting Egypt.** Read [[Isa. 30:1–7]] and [[Isa. 31:1–3]]. How does this chapter prepare for those later warnings?

sources: [bd-assyria, bd-egypt, bd-ethiopia, ot-manual-14, oswalt]
