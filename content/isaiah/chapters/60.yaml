chapter: 60
title: Arise, Shine
tagline: Dawn breaks over Zion while the rest of the earth lies in darkness, the nations stream toward her light bringing her children and their treasures, and in the end the city needs no sun, because the Lord is her light.
when: 'Setting: the community in Judah, late sixth century BC; taken up in Revelation, late first century AD'

setting: |
  Chapters 60–62 are the center of the book’s last division, and chapter 60 is their opening. After the darkness and groping of chapter 59, the Lord has come to Zion as Redeemer (59:20), and now the sun rises on the city. The whole chapter is addressed to Zion as a woman (“thee,” feminine singular in Hebrew), the same figure as the bereaved mother and forsaken wife of chapters 49–54. Many of its images pick up promises from earlier in the book: her children carried home (49:18–22), nations and kings serving her (49:23), the nations streaming to the mountain of the Lord (2:2–3).

  For the returned exiles, the contrast with reality was painful. Jerusalem was small and poor, and its walls lay in ruins until Nehemiah rebuilt them around 445 BC. The chapter describes what the city was meant to become, not what it was.

  The New Testament uses this chapter twice. The wise men bringing gold and incense recall verse 6 ([[Matt. 2:11]]), and John’s vision of the New Jerusalem is largely built from verses 1–3, 11, and 19–20 ([[Rev. 21:23–26]]). Latter-day revelation applies the chapter’s opening to the latter-day Zion ([[D&C 115:5]]).

thread: |
  Isaiah 60 is about **light**, and about a city that does not produce its own.

  The chapter is framed by light. It opens with dawn: “thy light is come, and the glory of the LORD is risen upon thee” (verse 1). It closes with a day that never ends: “the LORD shall be unto thee an everlasting light” (verses 19–20). In between, the light draws people. The nations come to it, carrying Zion’s own sons and daughters home, and bringing their wealth: camels from Arabia, ships from the far west, timber from Lebanon (verses 3–16). And the city changes: bronze becomes gold, violence ends, and the walls are named Salvation (verses 17–18).

  The key is in the first verse. Zion is told to shine, but the light is not hers. It is the glory of the Lord rising on her. She shines the way the moon does, by reflecting. Everything in the chapter follows from that. The nations do not come because Zion is impressive; they come because God is visible there.

sections:
  - range: 1-3
    heading: Your light has come
    plain: |
      Arise, shine, for your light has come, and the glory of the Lord has risen over you. Darkness covers the earth, and thick darkness the peoples, but the Lord rises over you, and His glory appears over you. Nations will come to your light, and kings to the brightness of your dawn.
  - range: 4-16
    heading: The nations come to you
    plain: |
      Look around you and see: they are all gathering and coming to you. Your sons come from far away, and your daughters are carried on the hip. Then you will look and be radiant; your heart will pound and swell with joy, because the wealth of the sea will be brought to you, and the riches of the nations will come to you. Caravans of camels will cover your land, young camels from Midian and Ephah. Everyone from Sheba will come, bringing gold and frankincense and proclaiming the praises of the Lord. All Kedar’s flocks will be gathered to you, Nebaioth’s rams will serve you; they will be accepted as offerings on My altar, and I will adorn My glorious house. Who are these that fly like clouds, like doves to their nests? Surely the islands look to Me, with the ships of Tarshish in the lead, bringing your children from far away, with their silver and gold, to honor the Lord your God, the Holy One of Israel, for He has made you glorious. Foreigners will rebuild your walls, and their kings will serve you. In My anger I struck you, but in My favor I will show you compassion. Your gates will always stand open; they will never be shut, day or night, so that people can bring you the wealth of the nations, with their kings led in procession. The nation or kingdom that will not serve you will perish; those nations will be utterly ruined. The glory of Lebanon will come to you, juniper, fir, and cypress together, to adorn My sanctuary, and I will glorify the place where My feet rest. The children of your oppressors will come bowing before you; all who despised you will bow at your feet and call you the City of the Lord, Zion of the Holy One of Israel. Although you were forsaken and hated, with no one passing through, I will make you majestic forever, a joy for all generations. You will drink the milk of nations and be nursed at royal breasts. Then you will know that I, the Lord, am your Savior, your Redeemer, the Mighty One of Jacob.
  - range: 17-22
    heading: The Lord your everlasting light
    plain: |
      Instead of bronze I will bring gold, and silver instead of iron; bronze instead of wood, and iron instead of stones. I will make peace your governor and righteousness your ruler. Violence will no longer be heard in your land, nor ruin or destruction within your borders. You will call your walls Salvation and your gates Praise. The sun will no longer be your light by day, nor will the brightness of the moon shine on you, for the Lord will be your everlasting light, and your God will be your glory. Your sun will never set again, and your moon will not wane; the Lord will be your everlasting light, and your days of mourning will end. All your people will be righteous; they will possess the land forever. They are the shoot I planted, the work of My hands, to display My glory. The least of you will become a thousand, the smallest a mighty nation. I am the Lord; when the time is right, I will do this swiftly.

notes:
  - ref: 1
    phrase: Arise, shine; for thy light is come, and the glory of the LORD is risen upon thee
    kind: words
    title: Dawn over Zion
    body: |
      The verbs are feminine singular: Zion, the woman who sat in the dust in chapters 51–52, is told to get up. “Arise” (*qûmî*) is what she heard before: “shake thyself from the dust; arise, and sit down, O Jerusalem” ([[Isa. 52:2]]). Now she is to rise and shine.

      “Is risen” is *zāraḥ*, the verb for the sunrise. The glory of the Lord dawns on her like the sun. And the tense is the perfect, as if it has already happened, a use scholars call the *prophetic perfect*: the prophet speaks of the future as done because God has decided it.

      The command and the gift arrive together. Zion must arise and shine, but she shines only because her light “is come.” She is not the source. The same balance appears in the Lord’s words to latter-day Zion: “Arise and shine forth, that thy light may be a standard for the nations” ([[D&C 115:5]]). Jesus told His disciples, “Ye are the light of the world” ([[Matt. 5:14]]) and also “I am the light of the world” ([[John 8:12]]). Both are true in the order Isaiah gives: His light first, then ours.
    sources: [bdb, oswalt]
  - ref: 2
    phrase: the darkness shall cover the earth, and gross darkness the people
    kind: restoration
    title: Gross darkness
    body: |
      “Gross darkness” is *ʿărāpel*, a heavy, cloudy darkness. It is an unusual word with a surprising history. At Sinai, “Moses drew near unto the thick darkness where God was” ([[Ex. 20:21]]), and the word there is *ʿărāpel*. At the dedication of Solomon’s temple, Solomon said the Lord had chosen to “dwell in the thick darkness” ([[1 Kgs. 8:12]]). In those passages the heavy cloud hid God’s presence. Here it covers the peoples who do not know Him, while the glory that once was hidden shines openly on Zion.

      Latter-day revelation quotes this verse to describe the world in the last days, and adds a telling phrase: “darkness covereth the earth, and gross darkness the minds of the people” ([[D&C 112:23]]). The darkness is spiritual confusion, not physical night. The same revelation says of the Lord’s judgment, “upon my house shall it begin” ([[D&C 112:25]]), a warning that Zion is not light by nature.

      The contrast between the dark earth and the lit city is not a picture of Zion’s superiority. Its purpose is the next verse: the Gentiles come to the light. Zion is lit so that others can find their way.
    sources: [bdb, oswalt]
  - ref: 5
    phrase: Then thou shalt see, and flow together, and thine heart shall fear, and be enlarged
    kind: words
    title: Radiant, with a pounding heart
    body: |
      Verse 4 repeats almost exactly a command from chapter 49: “Lift up thine eyes round about, and behold: all these gather themselves together, and come to thee” ([[Isa. 49:18]]). There the bereaved mother was shown children she thought she had lost. Here they arrive, “thy sons… from far, and thy daughters… nursed at thy side” (or “carried on the hip,” as small children were carried).

      Her reaction is in verse 5. “Flow together” translates *nāhart*, from a verb that can mean “to flow” (as in [[Isa. 2:2]], “all nations shall flow unto it”) or “to shine, be radiant.” Most modern translations prefer “you shall be radiant,” the look on a mother’s face when her children come home. The King James reading is not wrong; the word really does mean both. In chapter 2 the nations flowed to Zion; here Zion herself glows, or flows out to meet them.

      “Thine heart shall fear, and be enlarged” is literally “your heart will throb and grow wide.” It describes the physical feeling of overwhelming joy: a pounding heart that seems too big for the chest.
    sources: [bdb, halot, paul-40-66]
  - ref: 6
    phrase: they shall bring gold and incense; and they shall shew forth the praises of the LORD
    kind: christ
    title: Camels, gold, and incense
    body: |
      The caravans come from Arabia. Midian and Ephah were Abraham’s descendants through his wife Keturah ([[Gen. 25:1–4]]); Sheba, in the south of Arabia, controlled the incense trade, and its queen once brought Solomon gold, spices, and precious stones ([[1 Kgs. 10:1–10]]). In verse 7, Kedar and Nebaioth are the first two sons of Ishmael ([[Gen. 25:13]]). Their flocks “shall come up with acceptance on mine altar.” The estranged branches of Abraham’s family bring offerings to his God, and the offerings are accepted.

      Christian readers have long connected this verse with the wise men, who “presented unto him gifts; gold, and frankincense, and myrrh” ([[Matt. 2:11]]). Matthew does not quote Isaiah here, but the gold and incense are the same, and Christians connected them from early times. Together with [[Ps. 72:10–11]] (“the kings of Tarshish and of the isles shall bring presents”), and verse 3 of this chapter (“kings to the brightness of thy rising”), this passage is where the later tradition that the wise men were kings, riding camels, comes from. Many churches read Isaiah 60:1–6 on the Feast of the Epiphany, which celebrates their visit.

      The first Gentiles to come to the light, in Matthew’s account, came to a child in Bethlehem.
    sources: [oswalt, bd-sheba]
  - ref: 8
    phrase: Who are these that fly as a cloud, and as the doves to their windows?
    kind: symbol
    title: Flying like clouds
    body: |
      The prophet sees something on the horizon and asks what it is. Verse 9 answers: “the ships of Tarshish first, to bring thy sons from far.” White sails on the Mediterranean, seen from the shore, look like clouds or a flock of doves returning to their dovecotes. (The “windows” are the openings of a dovecote.) Tarshish was the farthest port of the western Mediterranean ([[Jonah 1:3]]), and earlier in Isaiah its great ships were symbols of human pride brought low ([[Isa. 2:16]]; [[Isa. 23:1]]). Here they are put to a better use: carrying Zion’s children home.

      Some Latter-day Saint readers have seen in “fly as a cloud” a prophecy of air travel bringing converts and gathered Israel to the gathering places of the latter days. That is a devotional application, not what the verse most likely meant to its first readers, and the verse itself points to ships. But the principle carries over. Whatever the means, the Lord uses the resources of the nations to gather His people.
    sources: [oswalt, bd-tarshish]
  - ref: 17
    phrase: 'For brass I will bring gold, and for iron I will bring silver'
    kind: history
    title: Bronze for gold, and a reversal
    body: |
      The list sounds like a general upgrade, but it recalls a specific humiliation. Solomon made shields of gold for his palace. After his death, Pharaoh Shishak invaded and carried them off, and King Rehoboam “made in their stead brasen shields” ([[1 Kgs. 14:26–27]]). The decline of Judah could be measured by its metals. Verse 17 runs the history backward: where there was bronze there will be gold again.

      The second half of the verse is more striking: “I will also make thy officers peace, and thine exactors righteousness.” “Exactors” is *nōgəśîm*, the word for the Egyptian taskmasters who drove the Israelite slaves ([[Ex. 5:6]]; [[Ex. 5:10]]). Isaiah used it for oppressive rulers earlier in the book ([[Isa. 3:12]]; [[Isa. 14:2]]). In the new Zion, the only “taskmaster” is righteousness and the only governor is peace. The city is governed by qualities, not by oppressors.

      Verse 18 continues: “thou shalt call thy walls Salvation, and thy gates Praise” (compare [[Isa. 26:1]]). The walls that Nehemiah would one day rebuild stone by stone are here given names that no army can breach.
    sources: [oswalt, bdb]
  - ref: 19
    phrase: the LORD shall be unto thee an everlasting light, and thy God thy glory
    kind: christ
    title: A city without a sun
    body: |
      At the end of the Bible, John sees the holy city, the New Jerusalem, and describes it with this chapter: “the city had no need of the sun, neither of the moon, to shine in it: for the glory of God did lighten it, and the Lamb is the light thereof” ([[Rev. 21:23]]). He continues with verses 3 and 11: “the nations of them which are saved shall walk in the light of it: and the kings of the earth do bring their glory and honour into it. And the gates of it shall not be shut at all by day: for there shall be no night there” ([[Rev. 21:24–25]]).

      John adds one thing to Isaiah: “the Lamb.” Isaiah said the Lord would be Zion’s light; John identifies that light with the Lamb who was slain. The two halves of Isaiah meet here, the glory of the Lord of chapter 60 and the lamb led to the slaughter of chapter 53 ([[Isa. 53:7]]).

      Latter-day revelation describes the destiny of the earth itself in similar terms. It will be sanctified and made celestial, “that bodies who are of the celestial kingdom may possess it” ([[D&C 88:20]]), and will be “like unto crystal,” a Urim and Thummim to those who live on it ([[D&C 130:9]]). “The days of thy mourning shall be ended” (verse 20) is the same promise John heard: “God shall wipe away all tears from their eyes” ([[Rev. 21:4]]).
    sources: [oswalt, gs-millennium]
  - ref: 21
    phrase: the branch of my planting, the work of my hands, that I may be glorified
    kind: symbol
    title: The branch of my planting
    body: |
      “Branch” is *nēṣer*, “shoot” or “sprout,” the word Isaiah used for the Messiah: “there shall come forth a rod out of the stem of Jesse, and a Branch shall grow out of his roots” ([[Isa. 11:1]]). Here the word describes the whole righteous people. The Messiah is the shoot from Jesse’s roots; His people are the shoot the Lord planted.

      Many interpreters think *nēṣer* lies behind Matthew’s puzzling statement that Jesus “shall be called a Nazarene” ([[Matt. 2:23]]), since no Old Testament verse says that in so many words. The connection is a plausible hypothesis, not a certainty.

      The image of the Lord as a gardener who plants His people runs through the scriptures, from the vineyard of [[Isa. 5:1–7]] to the olive tree of [[Jacob 5]], where the Lord of the vineyard labors to preserve His tree and bring forth good fruit. The next chapter picks up the image: the redeemed will be called “trees of righteousness, the planting of the LORD, that he might be glorified” ([[Isa. 61:3]]).
    sources: [bdb, oswalt]
  - ref: 22
    phrase: 'A little one shall become a thousand, and a small one a strong nation: I the LORD will hasten it in his time'
    kind: restoration
    title: I will hasten it in its time
    body: |
      The promise was spoken to a tiny community. The returned exiles were a few tens of thousands of people in a ruined province. The Lord promises that the smallest among them will become a thousand, and “a small one a strong nation.”

      The last line holds two ideas that seem to pull against each other: “I the LORD will hasten it in his time.” The Lord will act quickly, but only when the time is right. He sets the timetable; within it, He moves fast. The Lord used nearly the same words in 1832, when the Church was tiny: “Behold, I will hasten my work in its time” ([[D&C 88:73]]). Latter-day Saints have often cited that promise to describe the growth of the Church, which Daniel pictured as a stone cut out without hands that becomes a great mountain and fills the whole earth ([[Dan. 2:34–35]]; [[D&C 65:2]]).

      The phrase also answers the frustration behind chapters 58–59. The people asked why salvation was so slow. The answer is that it will come “in his time,” and when it does, it will not be slow.
    sources: [oswalt]

christ: |
  The light that rises on Zion is the glory of the Lord, and John saw that glory as the Lamb: “the Lamb is the light thereof” ([[Rev. 21:23]]). The first Gentiles in the Gospels who came to that light brought gold and frankincense to a child ([[Matt. 2:11]]). Jesus is the light of the world ([[John 8:12]]) and also the one who makes His followers shine ([[Matt. 5:14–16]]). And He is the “Saviour” and “Redeemer, the mighty One of Jacob” of verse 16, a title that echoes [[Isa. 49:26]]. Everything bright in Zion is reflected from Him.

liken: |
  - Where does my light come from? When I “shine,” whose glory is seen?
  - Are the gates of my home and my ward open, or do I shut them to people I don’t expect?
  - What in my life is bronze that the Lord could turn to gold? What “exactor” drives me that He could replace with peace?
  - Do I trust that the Lord will “hasten it in his time,” especially things I have waited for a long time?

explore: |
  - **Zion arise.** Read [[Isa. 52:1–2]], [[Isa. 60:1–3]], and [[D&C 115:4–6]]. The hymn “Arise, O Glorious Zion” (*Hymns*, no. 40) draws on the same images.
  - **The New Jerusalem.** Read [[Isa. 60:1–3]], [[Isa. 60:11]], [[Isa. 60:19–20]] alongside [[Rev. 21:22–22:5]].
  - **The wise men.** Read [[Matt. 2:1–12]] with [[Isa. 60:1–6]] and [[Ps. 72:10–11]].
  - **The Lord’s planting.** Read [[Isa. 60:21]], [[Isa. 61:3]], and [[Jacob 5:70–77]].

parallels:
  - ref: Rev. 21:23–26
    note: John’s New Jerusalem is built from verses 3, 11, and 19–20.
  - ref: Matt. 2:11
    note: Gold and frankincense brought to the child; compare verse 6.
  - ref: D&C 112:23
    note: “Gross darkness the minds of the people”; compare verse 2.
  - ref: D&C 115:5
    note: “Arise and shine forth,” applied to latter-day Zion.
  - ref: D&C 88:73
    note: “I will hasten my work in its time”; compare verse 22.

