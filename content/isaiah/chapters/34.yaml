chapter: 34
title: The Day of the Lord’s Vengeance on Idumea
tagline: The Lord summons the nations to judgment, the heavens roll up like a scroll, and Edom, the world, becomes a wilderness for owls.
when: 'A vision of the last days'

setting: |
  Chapters 34 and 35 are a matched pair, the dark and the bright sides of the same day. Chapter 34 describes the Lord’s judgment on the nations, represented by **Edom** (also called **Idumea**). Chapter 35 describes the redemption of Zion, with the desert blossoming and the ransomed returning home with songs.

  **Edom** was the nation descended from Esau, Jacob’s twin brother, living south of the Dead Sea. The two nations had a long history of hostility, and Edom’s conduct when Jerusalem was taken is condemned ([[Ps. 137:7]]; [[Obad. 1:10–14]]). In Isaiah 34 Edom stands for the nations as a whole.

  Modern revelation gives Edom this meaning directly. The Lord speaks of the day when He “shall come down in judgment upon Idumea, or the world” ([[D&C 1:36]]).

thread: |
  Isaiah 34 is about **the undoing of a world that set itself against God**, and it is written in the language of creation run in reverse.

  It begins with a summons to “all nations” (verse 1). The Lord’s anger is against all their armies (verse 2). Then the cosmos itself begins to dissolve: “the heavens shall be rolled together as a scroll,” and the stars fall like withered leaves or unripe figs (verse 4).

  Then the focus narrows to **Edom/Idumea** (verses 5–7). The Lord’s sword, “bathed in heaven,” comes down on the land, and Isaiah describes the judgment as a great **sacrifice** in Bozrah, a city of Edom. It is “the day of the LORD’s vengeance, and the year of recompences for the controversy of Zion” (verse 8).

  The rest of the chapter (verses 9–17) describes a land returned to chaos. Streams turn to pitch, smoke rises forever, and the Lord stretches over it “the line of confusion, and the stones of emptiness” (verse 11). Those are the same two Hebrew words, *tohu* and *bohu*, used for the earth “without form, and void” before creation ([[Gen. 1:2]]). The palaces become the haunt of owls and other creatures of the wild.

  And then, an unexpected line: “Seek ye out of the book of the LORD, and read” (verse 16). Every creature listed will be there, just as God said. His word is precise and certain.

  The world that fought against Zion is uncreated. But this is only half the story. The next chapter turns the wilderness into a garden.

sections:
  - range: 1-4
    heading: The nations summoned
    plain: |
      Come near, you nations, and listen! Pay attention, you peoples! Let the earth hear, and everything in it, the world and all that comes from it. The Lord is angry with all nations; His wrath is on all their armies. He will totally destroy them and give them over to slaughter. Their slain will be thrown out, their corpses will stink, and the mountains will be soaked with their blood. All the stars in the sky will dissolve, and the heavens will be rolled up like a scroll. All the stars will fall like withered leaves from a vine or shriveled figs from a fig tree.
  - range: 5-8
    heading: The sword comes down on Edom
    plain: |
      My sword has drunk its fill in the heavens. Look, it comes down in judgment on Edom, the people I have totally destroyed. The Lord’s sword is covered with blood and fat, the blood of lambs and goats, the fat of rams’ kidneys. For the Lord has a sacrifice in Bozrah and a great slaughter in Edom. Wild oxen will fall with them, bull calves and great bulls. Their land will be drenched with blood, and the dust soaked with fat. For the Lord has a day of vengeance, a year of retribution to uphold Zion’s cause.
  - range: 9-17
    heading: A land returned to chaos
    plain: |
      Edom’s streams will be turned into pitch and its dust into burning sulfur; its land will become blazing pitch. It will not be quenched night or day; its smoke will rise forever. From generation to generation it will lie desolate; no one will ever pass through it again. The desert owl and the screech owl will possess it; the great owl and the raven will nest there. God will stretch out over Edom the measuring line of chaos and the plumb line of desolation. Its nobles will have nothing there to call a kingdom, and all its princes will vanish. Thorns will overrun its citadels, nettles and brambles its strongholds. It will become a haunt for jackals and a home for owls. Desert creatures will meet with hyenas, and wild goats will bleat to each other. There the night creatures will lie down and find places of rest. The owl will nest there, lay eggs, hatch them, and care for her young under the shadow of her wings. There the falcons will gather, each with its mate. Look in the scroll of the Lord and read: none of these will be missing, not one will lack her mate. For it is His mouth that has given the order, and His Spirit will gather them together. He assigns them their portions; His hand distributes the land to them by measure. They will possess it forever and live there from generation to generation.

notes:
  - ref: 1
    phrase: Come near, ye nations, to hear; and hearken, ye people
    kind: scripture
    title: A summons to the whole world
    body: |
      Like the opening of the book ([[Isa. 1:2]]), this chapter begins by calling on those who hear, but now the call goes to “all nations.” The earth itself and “all things that come forth of it” are called to hear.

      The preface to the Doctrine and Covenants opens the same way: “Hearken, O ye people of my church… Hearken ye people from afar; and ye that are upon the islands of the sea, listen together” ([[D&C 1:1]]). The Lord’s latter-day revelation is addressed to the whole world, and it warns of the same day Isaiah describes ([[D&C 1:9–16]]; [[D&C 1:36]]).
    sources: [lds-scriptures]
  - ref: 4
    phrase: the heavens shall be rolled together as a scroll
    kind: symbol
    title: The heavens rolled up like a scroll
    body: |
      The image is of the whole visible sky rolled up like a scroll. The stars fall like withered leaves from a vine or shriveled figs from a fig tree.

      John saw the same thing: “the heaven departed as a scroll when it is rolled together” and the stars fell “as a fig tree casteth her untimely figs” ([[Rev. 6:13–14]]). Modern revelation uses the image in reverse for the Second Coming: “immediately after shall the curtain of heaven be unfolded, as a scroll is unfolded after it is rolled up, and the face of the Lord shall be unveiled” ([[D&C 88:95]]). What is rolled up in judgment is unrolled in revelation.
    sources: [lds-scriptures, ot-manual-15]
  - ref: 5
    phrase: it shall come down upon Idumea, and upon the people of my curse
    kind: symbol
    title: Idumea, or the world
    body: |
      **Idumea** is the name by which **Edom** was later known. Edom descended from Esau, who sold his birthright for one morsel of meat ([[Gen. 25:29–34]]; [[Heb. 12:16–17]]).

      The Lord gives the symbol a precise meaning in latter-day revelation: “the Lord shall have power over his saints, and shall reign in their midst, and shall come down in judgment upon Idumea, or the world” ([[D&C 1:36]]). So when Isaiah describes the Lord’s sword coming down on Idumea, Latter-day Saints read it as a description of the judgment on the wicked world at the Second Coming.
    sources: [bd-idumea, bd-edom, ot-manual-15, lds-scriptures]
  - ref: 6
    phrase: for the LORD hath a sacrifice in Bozrah
    kind: christ
    title: A sacrifice in Bozrah
    body: |
      Isaiah describes the judgment as a great **sacrifice**, using the language of sacrifice: the blood of lambs and goats, the fat of the kidneys of rams. **Bozrah** was a city of Edom.

      Bozrah appears again in one of Isaiah’s most striking visions: “Who is this that cometh from Edom, with dyed garments from Bozrah?… I have trodden the winepress alone” ([[Isa. 63:1–3]]). The Doctrine and Covenants identifies that figure as the Lord at His Second Coming, clothed in red ([[D&C 133:46–51]]). The one who comes from Bozrah with red garments is the one who was Himself the great sacrifice.
    sources: [lds-scriptures]
  - ref: 7
    phrase: the unicorns shall come down with them
    kind: words
    title: What is a unicorn doing in Isaiah?
    body: |
      The King James “unicorn” translates the Hebrew *reʾem*, which means a **wild ox**, a fierce and strong animal. The same word appears in [[Num. 23:22]], [[Deut. 33:17]], and [[Job 39:9–10]]. The “one-horned” idea comes from ancient translations: the Latin Vulgate has *unicornis* and the Greek translation has *monokerōs* in some places, though in this verse the Greek has a different word.

      In this verse, the wild oxen, bullocks, and bulls stand for the princes of Edom falling in the slaughter.
    sources: [bdb]
  - ref: 8
    phrase: For it is the day of the LORD’s vengeance, and the year of recompences for the controversy of Zion
    kind: christ
    title: The day of vengeance
    body: |
      This phrase is echoed in two later passages. The Anointed One’s mission in [[Isa. 61:2]] includes proclaiming “the acceptable year of the LORD, and the day of vengeance of our God.” And in [[Isa. 63:4]], the Lord in red garments says, “the day of vengeance is in mine heart, and the year of my redeemed is come.”

      Notice something important. When Jesus read Isaiah 61 in the synagogue at Nazareth, He stopped in the middle of the verse, after “the acceptable year of the Lord,” and closed the book ([[Luke 4:18–20]]). His first coming was the year of acceptance; the day of vengeance belongs to His second. The Doctrine and Covenants uses these words for the Second Coming ([[D&C 133:51]]).

      “The controversy of Zion” uses the Hebrew *rîb*, which can mean a dispute or a case at law. The Lord is taking up Zion’s case.
    sources: [lds-scriptures, bdb]
  - ref: 11
    phrase: he shall stretch out upon it the line of confusion, and the stones of emptiness
    kind: words
    title: Creation in reverse
    body: |
      “Confusion” here is *tohu* and “emptiness” is *bohu*. Together, these two words occur in [[Gen. 1:2]], where the earth before creation was “without form (*tohu*), and void (*bohu*),” and again in [[Jer. 4:23]], of a land reduced to chaos. Isaiah pictures the Lord taking out His builder’s measuring line and plumb line, but using them to *unbuild*, to return Edom to its pre-creation chaos.
    sources: [bdb]
  - ref: 14
    phrase: the screech owl also shall rest there
    kind: words
    title: The screech owl
    body: |
      The King James “screech owl” translates *lilit*, a word found only here in the Bible. The Hebrew words for several of the desert creatures in this passage are rare, which is why translations differ. BDB glosses *lilit* as a female night-demon and notes that its link to the Hebrew word for “night” may be only apparent; the NIV renders it “night creatures.” The King James “satyr” in the same verse translates *saʿir*, the ordinary word for a he-goat; BDB gives “satyr, demon” for this verse, and the NIV renders it “wild goats.”

      Either way, the list in verses 11–15 shows a land that no one lives in any longer, given over to what is wild.
    sources: [bdb, niv]
  - ref: 16
    phrase: Seek ye out of the book of the LORD, and read
    kind: scripture
    title: Seek ye out of the book of the Lord
    body: |
      This remarkable line invites readers to check the record: “Seek ye out of the book of the LORD, and read.” Every creature on the list will be there, and none will lack its mate, because “my mouth it hath commanded, and his spirit it hath gathered them.” God’s word is fulfilled down to the smallest detail.

      The Lord repeatedly commands His people to search the scriptures ([[John 5:39]]; [[3 Ne. 23:1]]; [[D&C 1:37]]).
    sources: [lds-scriptures]
  - ref: 17
    phrase: he hath cast the lot for them, and his hand hath divided it unto them by line
    kind: history
    title: Dividing the land by lot
    body: |
      This is the language of Joshua dividing the promised land among the tribes of Israel by casting lots ([[Josh. 18:10]]). But here the land given away by lot is Edom, and the new tenants are owls and the other creatures of the wild.

      It’s a sobering reversal. The Lord who gives inheritances to His covenant people also removes inheritances from those who reject Him.
    sources: [lds-scriptures]

christ: |
  The one who comes in judgment on Edom is Jesus Christ, whom Isaiah will later see coming “from Edom, with dyed garments from Bozrah” ([[Isa. 63:1]]; [[D&C 133:46–51]]). He is the Judge of all nations (verse 1; [[John 5:22]]). At Nazareth He stopped reading before “the day of vengeance” ([[Isa. 61:2]]; [[Luke 4:18–20]]), a phrase that echoes “the day of the LORD’s vengeance” (verse 8); His first coming was the year of acceptance.

  Isaiah 34 is dark, but it exists so that Isaiah 35 can follow. The same Lord who uncreates the world that opposes Him re-creates the desert into a garden for His redeemed.

explore: |
  - **Idumea.** Read [[D&C 1:35–36]], then Isaiah 34 and [[Isa. 63:1–6]]. How does the Doctrine and Covenants shape how we read these chapters?
  - **The day of vengeance.** Compare [[Isa. 34:8]], [[Isa. 61:1–2]], [[Isa. 63:4]], and [[Luke 4:16–21]]. Why might Jesus have stopped where He did?
  - **Chapters 34 and 35 together.** Read both chapters in one sitting. Notice how the wilderness of chapter 34 becomes the blossoming desert of chapter 35.

sources: [bd-edom, bd-idumea, ot-manual-15, bdb, niv, lds-scriptures]
