chapter: 55
title: Without Money and Without Price
tagline: The Lord calls out like a street vendor offering food for free, extends the covenant made with David to everyone who will listen, and promises that His word, like rain, will not come back without doing its work.
when: 'Often dated to the exile, c. 540 BC; echoed by Jacob and Nephi, c. 559–545 BC'

setting: |
  Chapter 55 ends the section of Isaiah that begins with “Comfort ye, comfort ye my people” ([[Isa. 40:1]]), which many scholars read as one unit, written during the Babylonian exile. The Latter-day Saint headings describe chapter 53 as the Messiah’s sufferings and chapter 54 as Zion’s establishment in the last days. This chapter turns all of that into an invitation. Almost every verb is an imperative: come, buy, eat, hearken, incline your ear, seek, call, return. What the servant suffered in chapter 53 is followed here by an offer to anyone, free.

  The Book of Mormon does not quote the chapter in full, but its opening became part of the Nephite prophets’ own preaching. Jacob brought his sermon on the Atonement toward its close with verses 1–2 ([[2 Ne. 9:50–51]]), and Nephi echoed verse 1 ([[2 Ne. 26:25]]). Both adapted the words as they used them, and the changes show how they read the passage.

thread: |
  Isaiah 55 is an **invitation to a meal**, and the chapter is about what makes the meal real.

  It opens in a marketplace. A voice calls out like a vendor: water, wine, milk, bread, all free to anyone who is hungry. The people have been spending their money and labor “for that which is not bread” (verse 2). What the Lord offers instead is a covenant, “the sure mercies of David,” and life for anyone who will listen (verse 3).

  The middle of the chapter tells how to come to the meal: seek the Lord, call on Him, forsake your own way and return, because He “will abundantly pardon” (verses 6–7). His thoughts are higher than ours, and the context shows what that means: He forgives more than we would (verses 8–9).

  The end of the chapter returns to bread. Rain and snow fall, water the earth, and produce “seed to the sower, and bread to the eater.” God’s word works the same way (verses 10–11). The meal is not just a metaphor. The word itself is the bread, as Moses said: “man doth not live by bread only, but by every word that proceedeth out of the mouth of the LORD” ([[Deut. 8:3]]). And those who eat it go out singing, through a land where the thorns have turned into trees (verses 12–13).

sections:
  - range: 1-5
    heading: Come, buy without money
    plain: |
      Listen, everyone who is thirsty: come to the water! You who have no money, come, buy and eat! Come, buy wine and milk without money and at no cost. Why spend money on what isn’t bread, and your wages on what doesn’t satisfy? Listen carefully to Me: eat what is good, and enjoy the richest food. Pay attention and come to Me; listen, so that you may live. I will make an everlasting covenant with you, the faithful love I promised David. I made him a witness to the peoples, a leader and commander of the peoples. So you will call nations you don’t know, and nations that don’t know you will run to you, because of the Lord your God, the Holy One of Israel, who has honored you.
  - range: 6-9
    heading: Seek the Lord while He may be found
    plain: |
      Seek the Lord while He can be found; call on Him while He is near. Let the wicked abandon their way and the sinful their thoughts. Let them return to the Lord, and He will have mercy on them; to our God, for He will freely forgive. “My thoughts are not your thoughts, and your ways are not My ways,” says the Lord. “As the heavens are higher than the earth, so My ways are higher than your ways and My thoughts than your thoughts.”
  - range: 10-13
    heading: The word that does not return empty
    plain: |
      The rain and snow come down from the sky and do not go back until they have watered the earth and made it sprout and grow, giving seed to the farmer and bread to the hungry. My word that goes out from My mouth is the same: it will not come back to Me empty. It will do what I want and succeed in what I sent it to do. You will go out with joy and be led home in peace. The mountains and hills will burst into song before you, and all the trees of the field will clap their hands. Cypresses will grow where thornbushes grew, and myrtles where briers grew. This will be a memorial to the Lord, a lasting sign that will never be destroyed.

notes:
  - ref: 1
    phrase: Ho, every one that thirsteth, come ye to the waters
    kind: symbol
    title: A vendor’s call
    body: |
      The scene is a marketplace, and the Lord speaks like a street vendor calling out his goods: water, wine, milk, bread. The first word, *hôy*, is the same word Isaiah uses for his warnings, where the King James Version translates it “woe”: “Woe unto them that join house to house” ([[Isa. 5:8]]). Here it is hardly more than a cry for attention. Earlier in the book it announced judgment; here it announces a free meal.

      The strangeness is the price. The buyers have no money, and they are told to buy anyway, “without money and without price.” The paradox makes the point: this is a real transaction, but someone else has paid. Three chapters earlier the Lord said Israel would “be redeemed without money” ([[Isa. 52:3]]), and chapter 53 showed the cost.

      Wisdom issues the same invitation in Proverbs: “Come, eat of my bread, and drink of the wine which I have mingled” ([[Prov. 9:5]]). Jesus used it at the Feast of Tabernacles: “If any man thirst, let him come unto me, and drink” ([[John 7:37]]). And the Bible ends with it: “let him that is athirst come. And whosoever will, let him take the water of life freely” ([[Rev. 22:17]]).
    sources: [bdb, oshb-wlc, lds-scriptures]
  - ref: 2
    phrase: Wherefore do ye spend money for that which is not bread? and your labour for that which satisfieth not?
    kind: scripture
    title: What Jacob and Nephi did with this invitation
    body: |
      Why do the Nephite prophets return to this passage? Because it names a problem they saw in their own people: spending life on things that do not satisfy.

      Jacob quoted verses 1–2 near the close of his sermon on the Atonement ([[2 Ne. 9:50–51]]), and he reshaped verse 2 as he went: “do not spend money for that which is of no worth, nor your labor for that which cannot satisfy. Hearken diligently unto me, and remember the words which I have spoken; and come unto the Holy One of Israel, and feast upon that which perisheth not, neither can be corrupted” ([[2 Ne. 9:51]]). Jacob names the host (“the Holy One of Israel”) and the food: something that “perisheth not.” Isaiah’s meal becomes an explicit invitation to Christ.

      Nephi used verse 1 to answer a question about God’s character: does He ever turn anyone away? “Behold, I say unto you, Nay; but he saith: Come unto me all ye ends of the earth, buy milk and honey, without money and without price” ([[2 Ne. 26:25]]). “Milk and honey” recalls the land the Lord promised Israel, “a land flowing with milk and honey” ([[Ex. 3:8]]). For Nephi, the invitation is to the covenant itself, open to “all ye ends of the earth.”

      Both prophets made Isaiah’s words their own, which is exactly what Nephi said he did: “I did liken all scriptures unto us” ([[1 Ne. 19:23]]).
    sources: [lds-scriptures]
  - ref: 3
    phrase: I will make an everlasting covenant with you, even the sure mercies of David
    kind: christ
    title: The sure mercies of David
    body: |
      The Lord once promised David a dynasty that would last forever: “thine house and thy kingdom shall be established for ever before thee” ([[2 Sam. 7:16]]). By the exile that promise looked broken: the last king, Zedekiah, had been blinded and carried to Babylon ([[2 Kgs. 25:7]]). Verses 3–4 answer that crisis.

      “The sure mercies of David” translates *ḥasdê dāwid hanneʾĕmānîm*. *Ḥesed* (covenant kindness) is the word in “everlasting kindness” in [[Isa. 54:8]], and the lexicon lists this phrase among the mercies “promised in the Davidic covenant.” The surprise is who receives it. The covenant is now made “with you,” plural, with everyone who comes to the meal. One commentator reads the verse as passing David’s mercies on to the whole people. Read that way, the Lord has not broken His word to David; He has widened it.

      Verse 4 can be read as looking back to David himself as “a witness to the people, a leader and commander,” with a later, greater David as the fulfillment of the pattern; other readers take “David” as a name for the coming Messiah. The New Testament applies verse 3 to Jesus. In the synagogue at Antioch, Paul quoted it as fulfilled in the Resurrection: God raised Him “from the dead, now no more to return to corruption,” and so “I will give you the sure mercies of David” ([[Acts 13:34]]). The promise was sure because David’s greatest son did not stay dead. Revelation calls Him by the title in verse 4: “Jesus Christ, who is the faithful witness” ([[Rev. 1:5]]).
    sources: [bdb, oshb-wlc, delitzsch, lds-scriptures]
  - ref: 6
    phrase: Seek ye the LORD while he may be found, call ye upon him while he is near
    kind: scripture
    title: While He may be found
    body: |
      Is there a deadline? The verse implies there is: seek Him “while he may be found… while he is near.” The “now” is the moment when He approaches Israel and makes the offer. The urgency lies in the offer itself, not in any hiding on His part.

      Amulek said the same thing to the Zoramites: “this life is the time for men to prepare to meet God… I beseech of you that ye do not procrastinate the day of your repentance until the end” ([[Alma 34:32–33]]). Amos warned of a worse famine than a famine of bread: “a famine… of hearing the words of the LORD” ([[Amos 8:11]]). The meal is free, but it is not on the table forever.

      Verse 7 shows what seeking means. It is not only looking for God but turning: the wicked forsakes “his way,” the unrighteous “his thoughts.” And the promise is generous: “he will abundantly pardon” renders a verb that BDB glosses “do much,” so the Hebrew says something like “he will do much pardoning.” In latter-day revelation the Lord makes the same offer from His side: “Draw near unto me and I will draw near unto you; seek me diligently and ye shall find me” ([[D&C 88:63]]).
    sources: [bdb, oshb-wlc, delitzsch, lds-scriptures]
  - ref: 8
    phrase: For my thoughts are not your thoughts, neither are your ways my ways, saith the LORD
    kind: words
    title: Higher thoughts, in context
    body: |
      These verses can be heard as saying only that God is beyond human understanding. In context they say something more specific.

      Read them with verse 7. The wicked are told to return, “for he will abundantly pardon. *For* my thoughts are not your thoughts.” The word “for” (*kî*) connects them. One natural reading is that God’s thoughts are higher than ours in this particular way: His pardon is more abundant than the wicked would expect. Delitzsch frames the contrast more broadly, against the “despairing thoughts” of people: God’s ways are not so fickle, unreliable, or powerless as theirs.

      The picture in verse 9 is distance: as high as the heavens are above the earth. The same picture measures His mercy in the Psalms: “For as the heaven is high above the earth, so great is his mercy toward them that fear him” ([[Ps. 103:11]]). The height of His thoughts is the height of His mercy.
    sources: [delitzsch, oshb-wlc, lds-scriptures]
  - ref: 11
    phrase: 'So shall my word be that goeth forth out of my mouth: it shall not return unto me void'
    kind: christ
    title: The word that does its work
    body: |
      Rain and snow don’t go back up until they have done their work. They water the ground, the crops grow, and the result is “seed to the sower, and bread to the eater.” The Lord’s word is the same. It “shall not return unto me void” (*rêqām*, “empty-handed,” a word BDB illustrates with messengers sent out and returning; Delitzsch notes that Isaiah elsewhere pictures the word as God’s messenger). It will accomplish what He sent it to do.

      This verse answers the opening of the section in chapter 40, which has the same theme: “The grass withereth, the flower fadeth: but the word of our God shall stand for ever” ([[Isa. 40:8]]). Chapters 40–55 begin and end with the reliability of God’s word, and everything promised in between rests on it. Latter-day revelation makes the same claim: “though the heavens and the earth pass away, my word shall not pass away, but shall all be fulfilled” ([[D&C 1:38]]).

      The image also connects back to the meal of verses 1–2. The rain gives “bread to the eater”; the word is bread. Jesus answered the tempter with that truth: “Man shall not live by bread alone, but by every word that proceedeth out of the mouth of God” ([[Matt. 4:4]]). And John calls Jesus Himself the Word ([[John 1:1–14]]), as does latter-day revelation: “he was the Word, even the messenger of salvation” ([[D&C 93:8]]). The Word sent from the Father did not return void.
    sources: [bdb, delitzsch, lds-scriptures, sc-knowhy-91]
  - ref: 12
    phrase: the mountains and the hills shall break forth before you into singing, and all the trees of the field shall clap their hands
    kind: symbol
    title: A creation that sings
    body: |
      “Ye shall go out with joy” is the last word on the new exodus. The first exodus was a hurried flight at night ([[Ex. 12:11]]). This one, Isaiah has said, will not be “with haste” ([[Isa. 52:12]]), and here it is a procession, with creation itself cheering from the roadside. The Psalms use the same picture when the Lord comes to judge the earth: “Let the floods clap their hands: let the hills be joyful together” ([[Ps. 98:8–9]]).

      The poetic picture has a serious point. In Isaiah, the land suffers when the people sin: “the earth mourneth and fadeth away” ([[Isa. 24:4]]). When the people are redeemed, the land rejoices with them. Redemption is not only personal; it reaches creation. Delitzsch connects such promises to the conviction, shared by prophets and apostles, that all creation will one day share in the freedom of God’s children (compare [[Rom. 8:21]]).

      Joseph Smith used similar language in his 1842 epistle on baptism for the dead, which speaks of “glad tidings of great joy” ([[D&C 128:19]]): “Let the mountains shout for joy… Let the woods and all the trees of the field praise the Lord; and ye solid rocks weep for joy!” ([[D&C 128:23]]).
    sources: [delitzsch, lds-scriptures]
  - ref: 13
    phrase: Instead of the thorn shall come up the fir tree, and instead of the brier shall come up the myrtle tree
    kind: symbol
    title: Thorns turned to trees
    body: |
      Thorns and briers are the plants of the curse. After the Fall, the ground would bring forth “thorns also and thistles” ([[Gen. 3:18]]). In Isaiah’s parable of the vineyard, the Lord’s judgment on His unfruitful people was that “there shall come up briers and thorns” ([[Isa. 5:6]]), and the pairing of briers and thorns returns in [[Isa. 7:23–25]] and [[Isa. 32:13]]. Here the curse is reversed. Where thorns grew, cypresses (the “fir”) will grow; where briers grew, myrtles.

      Myrtle branches were gathered for the booths of the Feast of Tabernacles ([[Neh. 8:15]]), a festival of rejoicing that recalled Israel’s coming out of Egypt ([[Lev. 23:40–43]]), and Queen Esther’s Hebrew name, Hadassah, is the feminine form of the word for “myrtle” ([[Esth. 2:7]]).

      The renewed land becomes “an everlasting sign” (*ʾôt ʿôlām*). An earlier lasting sign in scripture was the rainbow of Noah’s covenant, the “token” (*ʾôt*) set in the cloud ([[Gen. 9:12–13]]; compare [[Isa. 54:9]]). The flourishing land itself will be a memorial that God kept His word.
    sources: [bdb, oshb-wlc, delitzsch, lds-scriptures]

christ: |
  The chapter’s invitation is Christ’s own. He stood at the feast and cried, “If any man thirst, let him come unto me, and drink” ([[John 7:37]]). He is the bread that satisfies, the Son of David through whom “the sure mercies of David” became sure when He rose from the dead ([[Acts 13:34]]), and the Word that goes out from the Father and does not return void. The meal is free because He paid for it. Jacob drew exactly this conclusion when he quoted the chapter: “come unto the Holy One of Israel, and feast upon that which perisheth not” ([[2 Ne. 9:51]]).

explore: |
  - **The free meal.** Read [[Prov. 9:1–6]], [[John 6:26–35]], [[John 7:37–39]], and [[Rev. 22:17]].
  - **Jacob’s sermon.** Read [[2 Ne. 9:39–54]] and see how Isaiah 55 is used near its close.
  - **The covenant with David.** Read [[2 Sam. 7:8–16]], [[Ps. 89:28–37]], and [[Acts 13:32–37]].
  - **The word in Isaiah 40–55.** Compare [[Isa. 40:6–8]] with [[Isa. 55:10–11]].
  - **Mercy as high as heaven.** Read [[Isa. 55:6–9]] with [[Ps. 103:8–14]].

