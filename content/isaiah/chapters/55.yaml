    note: Jacob closes his sermon on the Atonement with verses 1–2, adapted.
  - ref: 2 Ne. 26:25
    note: Nephi echoes verse 1 to show that the Lord turns no one away.
  - ref: Acts 13:34
    note: Paul applies “the sure mercies of David” to the Resurrection.
  - ref: John 7:37
    note: Jesus issues the invitation of verse 1 at the Feast of Tabernacles.

