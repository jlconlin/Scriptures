chapter: 4
title: The Branch, the Cloud, and the Canopy
tagline: After the burning comes cleansing, and Zion becomes a sanctuary sheltered by the Lord’s own presence.
when: 'Isaiah’s ministry, in the days of the kings of Judah; looking to the last days'

setting: |
  Isaiah 4 is only six verses long, and it closes the unit that began in chapter 2. Its first verse actually belongs with chapter 3 (the chapter division falls one verse too early): it finishes the portrait of Jerusalem after the disaster, when so many men have died in war that women are desperate for husbands.

  Then everything turns. Verses 2–6 return to the glorious future of 2:2–4, but now we learn how the proud city of chapter 3 becomes the holy Zion of chapter 2: through a Branch, a washing, and a burning that purifies rather than destroys.

  Nephi quoted this chapter as [[2 Ne. 14]].

thread: |
  Chapters 2–4 have been a long journey downhill. The proud have been humbled, the supports removed, and the finery stripped away. Chapter 4 is the journey back up, and the logic of how Zion is made is compressed into five verses.

  First comes **a new source of glory**. In chapter 3 the glory of Jerusalem was jewelry and fine clothing. Now it is “the branch of the LORD,” which is “beautiful and glorious” (verse 2). The people’s beauty was taken away, and the Lord supplies a beauty of His own.

  Second comes **a remnant made holy**. Those who are left are “called holy,” and every one is “written among the living” (verse 3). The survivors aren’t just lucky. They are recorded and set apart.

  Third comes **a washing**. The Lord washes the filth of the daughters of Zion (the same daughters of Zion as in 3:16) “by the spirit of judgment, and by the spirit of burning” (verse 4). The fire that seemed only destructive in chapter 3 turns out to have been a refining fire.

  Fourth comes **His presence**. The cloud by day and fire by night, which once led Israel through the wilderness and rested on the tabernacle, now rests over *every dwelling place* in Zion (verse 5). The whole city has become a temple.

  The progression is the path of every disciple: humbled, given a new source of beauty in Christ, cleansed by the Spirit, and sheltered by the Lord’s presence. That’s what it means to become Zion.

sections:
  - range: '1'
    heading: Seven women and one man
    plain: |
      So many men will die in battle that seven women will cling to one surviving man and say, “We’ll provide our own food and clothes. Just marry us so we won’t be disgraced.”
  - range: 2-6
    heading: Zion cleansed and sheltered
    plain: |
      In that day the Branch of the Lord will be beautiful and glorious, and the land’s fruit will be the pride of those who survive in Israel. Everyone left in Zion will be called holy, everyone recorded among the living in Jerusalem, once the Lord has washed away the filth of Zion’s daughters and cleansed Jerusalem’s bloodguilt with a spirit of judgment and a spirit of fire. Then the Lord will create over all of Mount Zion and its gatherings a cloud by day and a blazing fire by night, a canopy over all its glory. It will be a shelter: shade from the heat, and a refuge and hiding place from storm and rain.

notes:
  - ref: 1
    phrase: seven women shall take hold of one man
    kind: history
    title: Why seven women want one husband
    body: |
      This verse concludes chapter 3. War has killed so many men ([[Isa. 3:25]]) that the survivors are vastly outnumbered. The number seven, usually the number of fullness, here marks a “bad seven”: a great many women for one man. A husband was obliged to provide food and clothing for his wife ([[Ex. 21:10]]), and these women offer to give up that claim. They will support themselves if only they can bear his name.

      Their “reproach” is the shame of being unmarried and childless ([[Gen. 30:23]]; [[Luke 1:25]]). The verse is a picture of devastation, not a model of marriage. The proud “daughters of Zion” who once paraded through the streets ([[Isa. 3:16]]) are now reduced to begging for a name.
    sources: [delitzsch]
  - ref: 1
    phrase: only let us be called by thy name
    kind: scripture
    title: Taking a name upon us
    sources: [lds-scriptures]
    body: |
      There’s an unexpected echo here for Latter-day Saints. These women want only to be “called by [his] name” so their reproach can be taken away. In a desperate situation, they ask for a name that brings belonging and removes shame.

      The gospel offers something far better than what these women sought: we covenant to take upon us the name of Jesus Christ ([[Mosiah 5:7–12]]; [[D&C 20:77]]), and in doing so our reproach is taken away. It’s worth noting that the next verse introduces “the branch of the LORD.”
  - ref: 2
    phrase: the branch of the LORD
    kind: christ
    title: The Branch
    body: |
      “Branch” (*tsemach*) means a sprout or growth, something new growing out of the ground. Later prophets make it a title of the Messiah: Jeremiah speaks of “a righteous Branch” raised up to David ([[Jer. 23:5]]), and Zechariah twice calls the coming one “the BRANCH” ([[Zech. 3:8]]; [[Zech. 6:12]]). Isaiah uses related imagery for the “rod out of the stem of Jesse” ([[Isa. 11:1]]).

      Readers differ on this verse. Delitzsch argues that “the branch of the LORD” and “the fruit of the earth” both name the Messiah, who comes from the Lord and yet springs from the earth, from Israel; he thinks this verse is where Jeremiah and Zechariah got the title. Others read the two phrases as the land’s renewed harvest. If the Messiah is meant, He is “beautiful and glorious,” the true glory of Zion after all its false glories have been stripped away.
    sources: [bdb, delitzsch, bd-christ-names]
  - ref: 2
    phrase: them that are escaped of Israel
    kind: scripture
    title: The escaped remnant
    sources: [lds-scriptures]
    body: |
      “Them that are escaped” are the survivors: the **remnant** introduced in [[Isa. 1:9]]. Isaiah returns to them repeatedly ([[Isa. 10:20]]; [[Isa. 37:31–32]]). Nephi, who read these words far from Jerusalem, understood his own family as part of such a remnant, a “branch” of Israel “broken off” and preserved by the Lord ([[1 Ne. 15:12]]; [[2 Ne. 3:5]]).
  - ref: 3
    phrase: every one that is written among the living in Jerusalem
    kind: scripture
    title: Written among the living
    sources: [lds-scriptures]
    body: |
      This is the idea of a **book of life**, a heavenly record of those who belong to God. Moses asked to be blotted out of God’s book if Israel could not be forgiven ([[Ex. 32:32–33]]). Daniel speaks of “every one that shall be found written in the book” ([[Dan. 12:1]]), and John saw the dead judged out of the books ([[Rev. 20:12]]).

      Latter-day revelation adds a striking point: records kept on earth by authority matter in heaven. Joseph Smith taught that what is recorded on earth by proper authority is recorded in heaven ([[D&C 128:6–9]]). The survivors of Zion are not anonymous. They are known by name.
  - ref: 4
    phrase: by the spirit of judgment, and by the spirit of burning
    kind: scripture
    title: The spirit of burning
    sources: [lds-scriptures]
    body: |
      Here is the chapter’s turning point. The “filth of the daughters of Zion” (the same proud women of [[Isa. 3:16–24]]) and the “blood of Jerusalem” (the guilt of [[Isa. 1:15]]) are washed and purged. The means is a *spirit*, of judgment and of burning.

      Fire as a purifier runs throughout scripture ([[Mal. 3:2–3]]; [[Isa. 1:25]]). John the Baptist promised that the Messiah would baptize “with the Holy Ghost, and with fire” ([[Matt. 3:11]]), and Nephi taught that after baptism by water “then cometh a remission of your sins by fire and by the Holy Ghost” ([[2 Ne. 31:17]]). The burning that cleanses Zion is the same fire that sanctifies every disciple.
  - ref: 5
    phrase: a cloud and smoke by day, and the shining of a flaming fire by night
    kind: symbol
    title: The Exodus cloud over every home
    sources: [lds-scriptures]
    body: |
      Every Israelite knew this image. The Lord led Israel out of Egypt in a pillar of cloud by day and a pillar of fire by night ([[Ex. 13:21–22]]), and the same cloud filled the tabernacle when it was dedicated ([[Ex. 40:34–38]]).

      But notice what Isaiah changes. The cloud rests not only on the temple but “upon **every dwelling place** of mount Zion, and upon her assemblies.” In the latter-day Zion, every home and every gathering becomes holy ground where the Lord’s presence dwells. The Lord told the early Saints that His glory would rest on His house like a cloud ([[D&C 84:5]]), and the Kirtland Temple’s dedicatory prayer asked that the house be filled with His glory ([[D&C 109:12]]; [[D&C 109:37]]). Isaiah’s vision goes a step further: the glory that fills the temple spreads to the homes of Zion.
  - ref: 5
    phrase: upon all the glory shall be a defence
    kind: words
    title: A wedding canopy
    sources: [bdb, delitzsch, lds-scriptures]
    body: |
      The Hebrew word translated “defence” is *chuppah*, which means a **canopy** or covering. The lexicon takes it here as a canopy for protection, but the same word is used for a bridal chamber in [[Joel 2:16]] and [[Ps. 19:5]], and the Jews still call a wedding canopy a *chuppah*. Delitzsch argues that the word means a covering that honors and beautifies what it covers, not merely one that defends.

      So verse 5 can be read as the Lord spreading a covering over His people like a bridal canopy (one reading, not the only one). Zion, once unfaithful ([[Isa. 1:21]]), is being taken back as His bride. Isaiah develops the marriage imagery fully later: “thy Maker is thine husband” ([[Isa. 54:5]]); “as the bridegroom rejoiceth over the bride, so shall thy God rejoice over thee” ([[Isa. 62:5]]).
  - ref: 6
    phrase: for a place of refuge, and for a covert from storm and from rain
    kind: scripture
    title: A refuge from the storm
    body: |
      “Tabernacle” here is *sukkah*, a booth or hut, like the booths Israel was told to live in to remember the exodus ([[Lev. 23:42–43]]). The Lord’s presence becomes shade in the heat and cover in the storm.

      The Lord used almost the same words for the stakes of Zion in the latter days: “that the gathering together upon the land of Zion, and upon her stakes, may be for a defense, and for a refuge from the storm, and from wrath when it shall be poured out without mixture upon the whole earth” ([[D&C 115:6]]). The Guide to the Scriptures lists this verse among its references on stakes of Zion as places of defense and refuge.
    sources: [gs-stake, lds-scriptures]

christ: |
  The Branch of the Lord in verse 2 is Jesus Christ. He grew “as a root out of a dry ground” ([[Isa. 53:2]]), and He becomes Zion’s true beauty and glory. The cleansing “spirit of burning” in verse 4 is His work: He baptizes with fire and the Holy Ghost. The shelter in verses 5–6 is His presence. Isaiah later calls Him “an hiding place from the wind, and a covert from the tempest” ([[Isa. 32:2]]).

  Notice the order. Christ doesn’t wait until Zion is clean to come to it. He is the one who makes it clean, and then He dwells over it like a cloud of glory.

explore: |
  - **The whole arc.** Read [[Isa. 2:1–4]] and [[Isa. 4:2–6]] one after the other, then read what lies between them. How does the cleansing in chapter 4 answer the pride of chapters 2–3?
  - **Fire that purifies.** Trace the image of refining fire through [[Isa. 1:25]], [[Isa. 4:4]], [[Isa. 6:6–7]], and [[Isa. 48:10]]. How does Isaiah’s own call in chapter 6 illustrate it?
  - **Cloud and fire.** Compare [[Ex. 40:34–38]], [[Isa. 4:5]], and [[D&C 84:5]]. What does it mean for the Lord’s glory to rest on a people and not just on a building?

