chapter: 53
title: A Man of Sorrows
tagline: A chorus of witnesses confesses that the despised servant they took to be punished by God was carrying their own sins, and the Lord declares that through his death he will see his seed and justify many.
when: 'Often dated to the exile, c. 540 BC; quoted in full by Abinadi, about 148 BC'

setting: |
  Chapter 53 is the heart of the fourth and last **Servant Song**, which began at [[Isa. 52:13]]. The song can be read as five stanzas of three verses each: 52:13–15, 53:1–3, 4–6, 7–9, and 10–12. It is framed by the Lord’s own voice. At the beginning He says, “Behold, my servant shall… be exalted” ([[Isa. 52:13]]), and at the end, “my righteous servant shall justify many” (53:11). Between those frames, a group speaking as “we” confesses that they misjudged the servant (verses 1–6), and a narrator describes his silent suffering, death, and burial (verses 7–9). The last stanza (verses 10–12) turns to what the suffering accomplished.

  This song has drawn questions since the first century. When the Ethiopian official in Acts read verse 7 in his chariot, he asked Philip the question that has occupied readers ever since: “of whom speaketh the prophet this? of himself, or of some other man?” Philip “began at the same scripture, and preached unto him Jesus” ([[Acts 8:34–35]]).

  [The Servant Songs](/isaiah/themes/servant-songs/#who-is-the-servant) page sets out the main answers: Israel as a people, an individual in Isaiah’s own world, or the Messiah. Some details of this song resist a purely collective reading. The servant is “stricken” for “the transgression of **my people**” (verse 8), which distinguishes him from the people; he is innocent, having “done no violence” (verse 9); and he dies and is buried, yet afterward “shall prolong his days” (verse 10). Latter-day Saints read the song, with the New Testament and the Book of Mormon, as a prophecy of Jesus Christ; the chapter heading in the Latter-day Saint edition of the Bible says that “Isaiah speaks about the Messiah.”

  The Book of Mormon quotes the chapter in full in the trial of Abinadi ([[Mosiah 14]]), with only small differences from the KJV. Abinadi had been bound, imprisoned, and put on trial by priests looking for grounds to accuse him ([[Mosiah 12:17–19]]). They asked him to explain [[Isa. 52:7–10]], apparently to catch him in false prophecy, a capital offense under the law of Moses: Isaiah speaks of a messenger who brings good tidings, and Abinadi had brought tidings of doom. He answered by reading them this song of a servant “taken from prison and from judgment” and killed by his own people, and then he was killed by his own people.

thread: |
  Isaiah 53 is about **a verdict that turns out to be wrong**.

  The people who speak in verses 1–6 had looked at the servant and drawn the obvious conclusion. He was unimpressive from the start, “a root out of a dry ground” with nothing about him to attract anyone (verse 2). Then he suffered, and they drew the obvious conclusion. “We esteemed him not” (verse 3); “we did esteem him stricken, smitten of God, and afflicted” (verse 4). He must have deserved it.

  Then the confession: they were wrong about whose sins were being punished. “He was wounded for *our* transgressions, he was bruised for *our* iniquities.” The verdict they passed on him was the verdict that should have fallen on them. “All we like sheep have gone astray… and the LORD hath laid on him the iniquity of us all” (verses 5–6).

  The narrator then describes a trial that was a travesty. The servant was “taken from prison and from judgment,” silent “as a lamb to the slaughter,” killed and buried with the wicked “because he had done no violence” (verses 7–9). The court of human opinion found him guilty.

  In the last stanza the Lord gives His verdict, and it reverses theirs. The servant is “my righteous servant.” His death was “an offering for sin.” He will “see his seed,” “prolong his days,” and “divide the spoil with the strong” (verses 10–12). The song ends not with the servant condemned among transgressors but with him interceding for them.

sections:
  - range: 1-3
    heading: No beauty that we should desire him
    plain: |
      Who would have believed what we have heard? To whom has the Lord’s power been revealed? He grew up before the Lord like a young shoot, like a root out of dry ground. He had no stately form or splendor that would make us look at him, nothing in his appearance to attract us. He was despised and rejected by people, a man who knew pain and was familiar with sickness. We hid our faces from him, as people do from someone they cannot bear to look at. He was despised, and we thought nothing of him.
  - range: 4-6
    heading: He carried ours
    plain: |
      Yet it was our sicknesses he carried and our pains he bore. We thought he was being punished, struck down by God and afflicted. But he was pierced because of our transgressions and crushed because of our iniquities. The punishment that brought us peace fell on him, and by his wounds we are healed. All of us have wandered off like sheep; each of us has gone his own way. And the Lord laid on him the iniquity of us all.
  - range: 7-9
    heading: The silent lamb
    plain: |
      He was oppressed and afflicted, but he did not open his mouth. Like a lamb led to the slaughter, like a sheep silent before its shearers, he did not open his mouth. By restraint and judgment he was taken away. Who from his generation gave it a thought? He was cut off from the land of the living, stricken for the transgression of my people. His grave was set with the wicked, and with the rich in his death, though he had done no violence and there was no deceit in his mouth.
  - range: 10-12
    heading: He shall see his seed
    plain: |
      Yet it was the Lord’s will to crush him and make him suffer. When he makes his life an offering for guilt, he will see his offspring and live a long life, and the Lord’s purpose will succeed through him. After the anguish of his soul, he will see and be satisfied. By his knowledge my righteous servant will make many righteous, because he will carry their iniquities. Therefore I will give him a share among the great, and he will divide the spoils with the strong, because he poured out his life to death and was counted among the transgressors. He carried the sin of many and interceded for the transgressors.

notes:
  - ref: 1
    phrase: Who hath believed our report? and to whom is the arm of the LORD revealed?
    kind: words
    title: Who would have believed it?
    body: |
      “Report” is *šĕmuʿātēnû*, “our report” or “what we have heard,” the news that has reached us. Who speaks? The “we” could be the kings of [[Isa. 52:15]], who have just seen “that which had not been told them,” or those who have come to believe, looking back with astonishment at how they once regarded the servant. Verse 1 doesn’t say, and the chapter’s verses give no more than this: the song never names the servant, and many of its pronouns have no stated antecedent. In either case, the speakers confess that the news was unbelievable.

      The same openness applies to time. The song describes the servant’s suffering as already past, which some readers take as an event in Isaiah’s own day and others as a **prophetic perfect**, a vision of the future told as though it had happened. Abinadi addresses exactly this when he says that Isaiah spoke “of things to come as though they had already come” ([[Mosiah 16:6]]). Before the priests of Noah, who did not share his reading, that openness left room to disagree about who the servant was.

      The second question completes a thread. The people asked the Lord’s arm to wake up ([[Isa. 51:9]]); the Lord bared His arm before the nations ([[Isa. 52:10]]). Now the arm is revealed, and it is the man described in the following verses. God’s power comes in a form no one expected.

      The New Testament uses the verse to explain unbelief. John quotes it when many who saw Jesus’s miracles still did not believe ([[John 12:37–38]]), and Paul quotes it of Israel’s response to the gospel: “Lord, who hath believed our report?” ([[Rom. 10:16]]).

      Abinadi introduces the chapter with a rhetorical question of his own: “Yea, even doth not Isaiah say” ([[Mosiah 14:1]]). He had just asked the priests whether all the prophets had not said “that God himself should come down among the children of men… and that he, himself, should be oppressed and afflicted” ([[Mosiah 13:34–35]]). Isaiah 53 is his evidence. He was answering priests who had quoted Isaiah 52 at him, so the opening questions land on them. And on one reading, the pairing of “the arm of the LORD” with a servant who grows up “before him” is the textual footing for his claim that “God himself shall come down among the children of men” ([[Mosiah 15:1]]).
    sources: [bdb, lds-scriptures, isaiah-in-bom]
  - ref: 2
    phrase: 'as a tender plant, and as a root out of a dry ground: he hath no form nor comeliness'
    kind: symbol
    title: A root out of dry ground
    body: |
      “Tender plant” is *yônēq*, a young plant or sapling (a “sucker”), from the verb for suckling at the breast. “Root” is *šōreš*. The words recall Isaiah’s earlier image of a shoot from Jesse’s line: “there shall come forth a rod out of the stem of Jesse, and a Branch shall grow out of his roots” ([[Isa. 11:1]]); “there shall be a root of Jesse” ([[Isa. 11:10]]). Here the shoot grows in soil that should not support it.

      The servant has no “form” (*tōʾar*, outline or form) or “comeliness” (*hādār*, ornament, splendor, honor). Israel’s first king was introduced by his looks: “a choice young man, and a goodly” ([[1 Sam. 9:2]]). When Samuel went to anoint Saul’s successor, the Lord warned him, “man looketh on the outward appearance, but the LORD looketh on the heart” ([[1 Sam. 16:7]]). The servant fails the test of appearance completely.
    sources: [bdb, lds-scriptures]
  - ref: 4
    phrase: Surely he hath borne our griefs, and carried our sorrows
    kind: words
    title: '“The pains and the sicknesses of his people”'
    body: |
      The KJV’s “griefs” and “sorrows” translate *ḥŏlāyênû* and *makʾōbênû*, from nouns meaning “sickness” and “pain.” The same two nouns described the servant in verse 3, “a man of sorrows [pains], and acquainted with grief [sickness].” Verse 3 says what he experienced; verse 4 reveals whose it was. Matthew understood the verse that way, applying it to Jesus’s healings: “Himself took our infirmities, and bare our sicknesses” ([[Matt. 8:17]]).

      The Book of Mormon has a striking echo. Alma, teaching the people of Gideon, said that the Son of God would suffer “that the word might be fulfilled which saith he will take upon him the pains and the sicknesses of his people” ([[Alma 7:11]]). Alma says he is fulfilling a prophecy, and the passage he seems to have in mind is this verse. One study argues that Alma’s wording, “pains and sicknesses,” is closer to the Hebrew than the KJV’s “griefs and sorrows,” even though Joseph Smith, translating, could have been expected to reach for the KJV’s wording.

      Alma then explains why the Savior took these things on Himself. It wasn’t only to pay for sin; it was “that he may know according to the flesh how to succor his people according to their infirmities” ([[Alma 7:12]]). Isaiah’s servant carries our sickness and pain as well as our guilt, and Alma draws out what that means: the Savior understands them from the inside.
    sources: [sc-knowhy-564, bdb, tahot, oshb-wlc]
  - ref: 5
    phrase: he was wounded for our transgressions, he was bruised for our iniquities
    kind: christ
    title: Pierced and crushed
    body: |
      The verbs are violent. “Wounded” is *mĕḥōlāl*, “pierced,” from *ḥālal*, to bore through. “Bruised” is *mĕdukkāʾ*, “crushed,” from *dākāʾ*, to crush to pieces; the same verb returns in verse 10: “it pleased the LORD to bruise him.” “For” is the Hebrew preposition *min*, which can mean “on account of.” Our transgressions caused his wounds.

      “The chastisement of our peace” means the punishment that brought us peace (*šālôm*: completeness, soundness, welfare). “Stripes” is *ḥabbûrâ*, a singular noun: a stripe, the mark of a blow. Peter quoted the line to servants who suffered wrongfully, telling them that Christ “his own self bare our sins in his own body on the tree… by whose stripes ye were healed” ([[1 Pet. 2:24]]).

      Abinadi’s commentary puts the same exchange in legal terms. The Son stands “betwixt them and justice; having broken the bands of death, taken upon himself their iniquity and their transgressions, having redeemed them, and satisfied the demands of justice” ([[Mosiah 15:9]]). In latter-day revelation the Savior describes the same exchange in the first person: “I, God, have suffered these things for all, that they might not suffer if they would repent” ([[D&C 19:16]]).
    sources: [bdb, oshb-wlc, lds-scriptures]
  - ref: 6
    phrase: the LORD hath laid on him the iniquity of us all
    kind: christ
    title: '“Laid on him”'
    body: |
      The verse begins with the confession that makes everyone equal: “All we like sheep have gone astray; we have turned every one to his own way.” Sin here is not a crowd going the wrong way together. It is every person heading off separately, each “to his own way.”

      “Laid on him” translates *hipgîaʿ bô*, from *pāgaʿ*, to meet, encounter, or strike; the causative form means to cause something to light upon someone. The Lord made our guilt fall on him. Compare the Day of Atonement, when Israel’s sins were confessed over the head of a goat, and “the goat shall bear upon him all their iniquities unto a land not inhabited” ([[Lev. 16:21–22]]).

      The same verb, *pāgaʿ*, appears in the last line of the chapter, where the servant “made intercession” (*yapgîaʿ*) for the transgressors (verse 12). Our iniquity was made to meet him; he in turn meets God on our behalf. The Book of Mormon reads the plural “the iniquities of us all” ([[Mosiah 14:6]]).
    sources: [bdb, oshb-wlc, tahot, lds-scriptures]
  - ref: 7
    phrase: he is brought as a lamb to the slaughter, and as a sheep before her shearers is dumb
    kind: christ
    title: The silent lamb
    body: |
      Verse 6 compared the people to sheep that wandered. Verse 7 compares the servant to a sheep that doesn’t: it goes quietly to the shearing and to the slaughter. The point of the image is silence. Twice the verse says “he opened not his mouth.” The servant doesn’t protest or defend himself.

      The Gospels record that silence. Before the high priest, “Jesus held his peace” ([[Matt. 26:63]]). Before Pilate, “when he was accused of the chief priests and elders, he answered nothing,” and “he answered him to never a word” ([[Matt. 27:12–14]]). John the Baptist’s title for Him draws on the image: “Behold the Lamb of God, which taketh away the sin of the world” ([[John 1:29]]). And this is the verse the Ethiopian official was reading when Philip met him ([[Acts 8:32]]).

      Abinadi paraphrased the verse in his explanation of how God would redeem His people: “he shall be led, yea, even as Isaiah said, as a sheep before the shearer is dumb, so he opened not his mouth. Yea, even so he shall be led, crucified, and slain, the flesh becoming subject even unto death, the will of the Son being swallowed up in the will of the Father” ([[Mosiah 15:6–7]]).

      Abinadi was probably not the first Nephite to read the song this way. Nephi, four centuries earlier, wrote that the Messiah’s people would “scourge him, and he suffereth it; and they smite him, and he suffereth it” ([[1 Ne. 19:9]]). Resemblances like this, on one argument, suggest that earlier Nephite prophets already knew Isaiah 53; it is an inference from wording, not something Nephi says.
    sources: [lds-scriptures, isaiah-in-bom]
  - ref: 9
    phrase: he made his grave with the wicked, and with the rich in his death
    kind: history
    title: With the wicked and with the rich
    body: |
      The Gospels record that Jesus was crucified between two criminals ([[Mark 15:27]]) and buried in the new tomb of “a rich man of Arimathæa, named Joseph” ([[Matt. 27:57–60]]). The correspondence with this verse is striking, and Christians have long noted it.

      The Hebrew poses two puzzles. First, the verse pairs “the wicked” with “the rich,” who are not obvious companions. One common explanation takes “the rich” as a synonym for “the wicked,” as in [[Micah 6:12]], where the rich are “full of violence”; on that reading the verse means only that the servant was buried in disgrace. An older commentator rejects this, since burial with the rich would have been an honorable burial, and he concludes that the line is hard to understand apart from its fulfillment. Second, the Masoretic Text (the standard medieval Hebrew text) reads *bĕmōtāyw*, literally “in his deaths,” a plural. The NRSV Updated Edition follows a Qumran manuscript (“his tomb with the rich,” with a footnote citing it), and one English translation of the Great Isaiah Scroll gives “with the rich his high place.” The exact sense of the line remains uncertain.

      The innocence is emphasized: “he had done no violence, neither was any deceit in his mouth.” Peter quotes the second half: Christ “did no sin, neither was guile found in his mouth” ([[1 Pet. 2:22]]). The Book of Mormon reads “he had done no **evil**” ([[Mosiah 14:9]]), a broader word than “violence” (Hebrew *ḥāmās*, violence or wrong).
    sources: [hopkin-abinadi-isaiah, nrsvue, delitzsch, oshb-wlc, tahot, bdb, lds-scriptures]
  - ref: 10
    phrase: Yet it pleased the LORD to bruise him
    kind: christ
    title: '“It pleased the LORD”'
    body: |
      This is the hardest line in the chapter. “Pleased” is *ḥāpēṣ*, to delight in. “Bruise” is the same verb as in verse 5, *dākāʾ*, to crush. “He hath put him to grief” (*heḥĕlî*) is from the root for sickness, the same word as “grief” in verses 3 and 4. What the people inflicted, the Lord willed.

      The line cannot mean that God enjoyed His servant’s pain. The rest of the verse gives the reason: it was the Lord’s purpose because of what the suffering would accomplish. “The pleasure of the LORD” (*ḥēpeṣ*, the same root) “shall prosper in his hand.” The will that required the suffering is the will that brings about salvation.

      It was also the Son’s will. In Gethsemane Jesus prayed, “nevertheless not my will, but thine, be done” ([[Luke 22:42]]), and Abinadi described “the will of the Son being swallowed up in the will of the Father” ([[Mosiah 15:7]]).

      Who is “the LORD” who was pleased? Latter-day Saint readers differ, and the Hebrew name doesn’t say. Some take it as the Father, who laid our iniquity on the Son (verse 6) and was pleased that the Son would volunteer; others take it as Jehovah, Christ Himself, who let Himself be persecuted; and some say either reading is valid. Abinadi pairs this verse with the Son’s will swallowed up in the Father’s, which sits comfortably with the first reading.

      “An offering for sin” is *ʾāšām*, which can mean guilt, compensation, or the **guilt offering** (the KJV’s “trespass offering”) of [[Lev. 5:14–6:7]]. There the offering was tied to restitution: the one who had trespassed was to “make amends” or “restore” what he took, and add a fifth part, and then bring a ram. The servant’s life is the payment of a debt.
    sources: [bdb, oshb-wlc, lds-scriptures, isaiah-in-bom]
  - ref: 10
    phrase: he shall see his seed, he shall prolong his days
    kind: scripture
    title: '“Who shall be his seed?”'
    body: |
      This line is the turning point of the song. The servant has been “cut off out of the land of the living” (verse 8) and buried (verse 9). Yet he “shall see his seed” and “prolong his days.” A dead man can do neither. Abinadi pairs “prolong his days” with the endless life that follows Christ’s victory over death: He is “a life which is endless, that there can be no more death” ([[Mosiah 16:9]]).

      Abinadi read this line together with verse 8’s “who shall declare his generation?” He asked the court, “who shall declare his generation? Behold, I say unto you, that when his soul has been made an offering for sin he shall see his seed. And now what say ye? And who shall be his seed?” ([[Mosiah 15:10]]). His answer: “all those who have hearkened unto their words, and believed that the Lord would redeem his people, and have looked forward to that day for a remission of their sins, I say unto you, that these are his seed” ([[Mosiah 15:11]]). And he gave the reason: “For these are they whose sins he has borne; these are they for whom he has died” ([[Mosiah 15:12]]).

      Abinadi’s reading makes the servant a father: those whose sins he carried become his offspring. His answer also settles the priests’ challenge about who may speak for God: the seed include the prophets, “these are they who have published peace” ([[Mosiah 15:13–14]]), the very “good tidings” of [[Isa. 52:7]] that the priests had quoted at him. King Benjamin taught the same thing a generation later: “because of the covenant which ye have made ye shall be called the children of Christ, his sons, and his daughters” ([[Mosiah 5:7]]). One of those who heard Abinadi, Alma, believed his words ([[Mosiah 17:2]]).
    sources: [lds-scriptures, isaiah-in-bom]
  - ref: 11
    phrase: He shall see of the travail of his soul, and shall be satisfied
    kind: words
    title: He shall see light
    body: |
      The Masoretic Text reads, literally, “From the trouble [or toil] of his soul he shall see; he shall be satisfied.” “See” has no object. The Great Isaiah Scroll (1QIsaᵃ) and the Septuagint both supply one: “he shall see **light**.” Some modern translations adopt it (the NRSV: “Out of his anguish he shall see light”); others keep the Masoretic reading and note the variant in a footnote (the ESV). The Book of Mormon reads “He shall see the travail of his soul” ([[Mosiah 14:11]]), following the KJV’s interpretation. Abinadi hears “shall be satisfied” as justice satisfied: the Son has “satisfied the demands of justice” ([[Mosiah 15:9]]).

      “Light” after “the anguish of his soul” strengthens the sense of the previous verse: after death, the servant sees light, a return to life. In the Old Testament, to see light is to be alive ([[Job 33:28]]; [[Ps. 49:19]]).

      “By his knowledge shall my righteous servant justify many” is also ambiguous. It can mean by the servant’s own knowledge, or by others’ knowledge *of him*; the older commentary prefers the second. “Justify” (*yaṣdîq*) means to declare righteous or vindicate, and it is the same verb the servant used for his own vindication in [[Isa. 50:8]] (“he is near that justifieth me”). The one who was vindicated now vindicates many.
    sources: [hopkin-abinadi-isaiah, nrsv, esv, lxx-rahlfs, delitzsch, oshb-wlc, tahot, bdb, lds-scriptures, isaiah-in-bom]
  - ref: 12
    phrase: he was numbered with the transgressors; and he bare the sin of many, and made intercession for the transgressors
    kind: christ
    title: Counted among the rebels, praying for them
    body: |
      The song ends with a victory image: the servant will “divide the spoil with the strong,” like a general sharing plunder after a battle. But the reason given is not a military triumph. It is that he “poured out his soul unto death” and let himself be counted with criminals.

      Jesus quoted this verse about Himself on the night of His arrest: “this that is written must yet be accomplished in me, And he was reckoned among the transgressors” ([[Luke 22:37]]). The author of Hebrews echoes “he bare the sin of many”: “So Christ was once offered to bear the sins of many” ([[Heb. 9:28]]).

      The last words are about intercession. The verb, *yapgîaʿ*, is the same one used in verse 6 for the iniquity the Lord “laid on” him (see that note). On the cross Jesus prayed for the people who put Him there: “Father, forgive them; for they know not what they do” ([[Luke 23:34]]). Abinadi, who reads the divided spoil as the victory over death, taught that this victory gave “the Son power to make intercession for the children of men” ([[Mosiah 15:8]]). Latter-day revelation lets us hear that intercession: “Listen to him who is the advocate with the Father, who is pleading your cause before him—Saying: Father, behold the sufferings and death of him who did no sin” ([[D&C 45:3–4]]).
    sources: [oshb-wlc, bdb, lds-scriptures, isaiah-in-bom]

christ: |
  Latter-day Saints read Isaiah 53 as a prophecy of the Atonement of Jesus Christ, and the Book of Mormon gives them strong grounds to. Abinadi quoted the whole song as proof that “God himself should come down among the children of men” and “be oppressed and afflicted” ([[Mosiah 13:34–35]]), and then explained it phrase by phrase. Alma echoed it to teach that the Savior would take on Himself not only our sins but our pains and sicknesses, so that He would know “how to succor his people” ([[Alma 7:11–12]]). The risen Lord, walking to Emmaus, began “at Moses and all the prophets” and expounded “the things concerning himself” ([[Luke 24:27]]); this chapter may have been among them.

  The song’s central claim is exchange. He carried our sickness; we are healed by his wounds. He was counted among the transgressors; he makes intercession for the transgressors. And the verdict that the onlookers passed on him, “smitten of God,” turned out to be true in a way they never imagined: he was smitten, but for them.

explore: |
  - **The whole song.** Read [[Isa. 52:13–53:12]] as one poem, noticing who speaks in each stanza.
  - **Philip and the Ethiopian.** Read [[Acts 8:26–40]].
  - **Abinadi’s sermon.** Read [[Mosiah 13:33–15:13]] and trace how he explains the song.
  - **Pains and sicknesses.** Compare verse 4 with [[Matt. 8:16–17]] and [[Alma 7:10–13]].
  - **The Savior’s own account.** Read [[D&C 19:15–20]] and [[D&C 45:3–5]].
  - **Peter’s use.** Read [[1 Pet. 2:21–25]], which weaves verses 5, 6, and 9 together.

parallels:
  - ref: Mosiah 14
    note: Abinadi quotes the whole chapter in his defense before King Noah’s court.
    primary: true
  - ref: Mosiah 15:5–13
    note: Abinadi explains the lamb, the intercession, and “who shall be his seed.”
  - ref: Alma 7:11–12
    note: Alma’s “the pains and the sicknesses of his people” echoes verse 4.
  - ref: Acts 8:32–35
    note: Philip preaches Jesus to the Ethiopian official from verses 7–8.
  - ref: Luke 22:37
    note: Jesus applies verse 12 to Himself.
  - ref: 1 Pet. 2:22–25
    note: Peter weaves verses 5, 6, and 9 into his teaching about Christ’s suffering.
  - ref: Matt. 8:17
    note: Matthew applies verse 4 to Jesus’s healings.

