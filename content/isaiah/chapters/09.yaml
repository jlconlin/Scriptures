chapter: 9
title: 'Unto Us a Child Is Born'
tagline: A great light breaks on Galilee, a child-King receives four throne names, and a proud kingdom refuses to turn.
when: 'The late 700s BC, as Assyria took the northern kingdom; the light prophesied for Galilee dawned with Jesus’s ministry'

setting: |
  Chapter 8 ended in total darkness: people wandering, hungry, cursing their king and their God, seeing only “dimness of anguish.” Chapter 9 begins by saying the darkness won’t last.

  The historical setting is the northern regions of Israel, **Zebulun and Naphtali**, in Galilee. Verse 1 says the Lord afflicted them lightly “at the first” and more grievously afterward. When Tiglath-pileser of Assyria “took… Galilee, all the land of Naphtali, and carried them captive” ([[2 Kgs. 15:29]]), they were among the first to go into darkness. Isaiah promises they will be the first to see the light.

  Then the chapter changes key. Verses 8–21 begin a long poem of judgment against the northern kingdom (Ephraim) that continues into chapter 10, with a haunting refrain. Nephi quoted the whole chapter in [[2 Ne. 19]].

thread: |
  Isaiah 9 is a story of **two responses to darkness**.

  The first response is God’s. Into the darkest, most devastated corner of the land, the very places Isaiah says were afflicted first, He sends a great light (verses 1–2). Joy breaks out like harvest time (verse 3). The oppressor’s yoke is shattered, as when Gideon routed Midian with a handful of men (verse 4). Even the soldiers’ blood-soaked boots and cloaks are thrown on the fire (verse 5). And the reason for all this joy is… a baby. “For unto us a child is born, unto us a son is given.” This child carries the government on His shoulder, bears four magnificent names, and rules on David’s throne forever (verses 6–7). God’s answer to the darkness is a Person.

  The second response is Israel’s. Verses 8–21 describe the northern kingdom under judgment. Do they repent? No. They say, in effect, *The bricks fell down? We’ll rebuild with cut stone! The sycamores were cut down? We’ll plant cedars!* (verse 10). So the blows keep coming, and the refrain tolls four times: “For all this his anger is not turned away, but his hand is stretched out still” (verses 12, 17, 21; [[Isa. 10:4]]).

  The chapter sets the two side by side. God answers darkness by giving His Son; Ephraim answers discipline by rebuilding with better stone.

sections:
  - range: 1-7
    heading: A great light and a royal child
    plain: |
      But the darkness will not last forever. It will not be as it was when the Lord first afflicted the lands of Zebulun and Naphtali lightly, and afterward more grievously, along the road by the sea, beyond the Jordan, in Galilee of the nations. The people who walked in darkness have seen a great light; light has dawned on those who lived in the shadow of death. You have enlarged the nation and filled it with joy, like the joy of harvest or of dividing plunder. You have broken the oppressor’s yoke as You did in Gideon’s day against Midian. Every soldier’s boot and blood-soaked cloak will be burned. For a child is born to us, a son is given to us, and the government will rest on His shoulders. He will be called Wonderful Counselor, Mighty God, Everlasting Father, Prince of Peace. His government and peace will grow without end. He will reign on David’s throne, establishing it with justice and righteousness forever. The Lord’s zeal will make it happen.
  - range: 8-12
    heading: '“We will build with hewn stones”'
    plain: |
      The Lord has sent a message against Israel, and all of Ephraim and Samaria will know it. They say proudly, “The brick walls have fallen, but we’ll rebuild with cut stone. The sycamores are cut down, but we’ll replace them with cedars.” So the Lord will raise up enemies against them: Arameans in front and Philistines behind, devouring Israel with open mouths. Even so, His anger is not turned away, and His hand is still stretched out.
  - range: 13-17
    heading: Leaders who mislead
    plain: |
      The people haven’t turned back to the One who struck them or sought the Lord. So in one day He will cut off both head and tail, palm branch and reed. The elders and dignitaries are the head; the prophets who teach lies are the tail. The leaders mislead the people, and those they lead are swallowed up. So the Lord takes no pleasure in their young men and has no pity on their orphans and widows, because everyone is a hypocrite and an evildoer, and every mouth speaks folly. Even so, His hand is still stretched out.
  - range: 18-21
    heading: Wickedness burns like fire
    plain: |
      Wickedness burns like a fire, consuming thorns and thickets until the whole forest goes up in smoke. The Lord’s wrath darkens the land, and the people become fuel for the fire. No one spares even his own brother. They grab food on the right and are still hungry; they eat on the left and are never full. They devour even their own flesh. Manasseh attacks Ephraim, Ephraim attacks Manasseh, and together they turn on Judah. Even so, His hand is still stretched out.

notes:
  - ref: 1
    phrase: the land of Zebulun and the land of Naphtali
    kind: history
    title: First into darkness, first to see the light
    body: |
      Zebulun and Naphtali were tribal territories in Galilee, the northern district of Palestine, and Tiglath-pileser of Assyria carried off the people of Galilee ([[2 Kgs. 15:29]]). The district lay along important highways leading to Damascus, Egypt and eastern Palestine. Verse 1 itself says the Lord afflicted these lands lightly “at the first” and “afterward” more grievously.

      Isaiah promises that this region, which went first into the darkness, would be honored with the light. Centuries later Jesus spent most of His early life in Nazareth and Galilee, and based His ministry at Capernaum “in the borders of Zabulon and Nephthalim.” Matthew quotes this passage as fulfilled ([[Matt. 4:12–16]]).
    sources: [bd-galilee, bd-captivities, sc-knowhy-869, lds-scriptures]
  - ref: 2
    phrase: The people that walked in darkness have seen a great light
    kind: christ
    title: The great light
    body: |
      Notice the prophetic past tense (“have seen,” “hath… shined”): Isaiah sees it as already done. The contrast with the end of chapter 8 is intentional: those who were “driven to darkness” ([[Isa. 8:22]]) now see a great light.

      Jesus later declared, “I am the light of the world: he that followeth me shall not walk in darkness” ([[John 8:12]]). In John’s Gospel that saying comes shortly after the Pharisees brushed Jesus aside with “Search, and look: for out of Galilee ariseth no prophet” ([[John 7:52]]). Read with Isaiah 9 in mind, His answer is pointed: Isaiah had promised that the great light would dawn on Galilee of all places. To the Nephites, the risen Lord said, “I am the light and the life of the world” ([[3 Ne. 11:11]]). Among the Nephites the sign of His birth was literally a night without darkness ([[3 Ne. 1:15–19]]). [Light Rising on Zion](/isaiah/themes/light/) follows the light through the book.
    sources: [sc-knowhy-869, lds-scriptures]
  - ref: 3
    phrase: Thou hast multiplied the nation, and not increased the joy
    kind: words
    title: '“Not” or “to it”? The Book of Mormon weighs in'
    body: |
      This line has puzzled readers, since the rest of the verse is all about joy. The explanation is a tiny textual detail. In the Hebrew manuscript tradition the consonants are *loʾ*, “not,” but the margin (the *qere*, the reading to be spoken aloud) says to read *lo*, “to it,” which sounds the same: “thou hast multiplied the nation, **and increased its joy**.” The *ketiv* is what is written; the *qere* is what is read. The NRSVUE and the ESV follow the *qere* (“you have increased its joy”).

      Here the Book of Mormon agrees with that reading. Nephi’s text says: “Thou hast multiplied the nation, **and increased the joy**” ([[2 Ne. 19:3]]). Without the troublesome “not,” the verse fits its context.
    sources: [oshb-wlc, nrsvue, esv, lds-scriptures]
  - ref: 4
    phrase: as in the day of Midian
    kind: history
    title: The day of Midian
    body: |
      This alludes to Gideon’s victory over the Midianites ([[Judg. 7]]). The Lord deliberately reduced Gideon’s army (22,000 went home, then 10,000 were cut to 300) so that Israel could not boast that its own hand had saved it ([[Judg. 7:2]]). Armed only with trumpets, jars, and torches, the 300 routed a vast army.

      The day of Midian is therefore shorthand for a deliverance that is God’s doing, not man’s. Isaiah uses it again in [[Isa. 10:26]]. The coming deliverance through the child of verse 6 will be like that: a victory won by God, with human weakness on full display.
    sources: [lds-scriptures]
  - ref: 6
    phrase: For unto us a child is born, unto us a son is given
    kind: christ
    title: A child born, a Son given
    body: |
      Notice the two parallel lines. A child is **born** (He enters mortality as a human baby), and a Son is **given** (He is the gift of the Father, who existed before His birth). Elder Jeffrey R. Holland observes that amid the royal titles, the child of heaven is still the Son ([[John 3:16]]; [[1 Ne. 11:18–21]]; [[Mosiah 3:8]]).

      The verse is one example of Isaiah’s prophecies of “the coming of the Redeemer, both in His first appearance… and as the Great King at the last day.”
    sources: [bd-isaiah, isaiah-in-bom, lds-scriptures]
  - ref: 6
    phrase: the government shall be upon his shoulder
    kind: symbol
    title: On His shoulder
    body: |
      Isaiah uses a closely related image when the “key of the house of David” is laid on Eliakim’s shoulder ([[Isa. 22:22]]). Here the entire government rests on the child’s shoulder: the full weight and authority of rule.
    sources: [lds-scriptures]
  - ref: 6
    phrase: his name shall be called
    kind: history
    title: What a throne name is
    body: |
      A throne name is a name a king took for himself when he came to the throne, a practice common in the ancient world. In Egypt it was a formal part of the accession ceremony, at which a new pharaoh was given five names. The titles Isaiah gives the child have been seen as a possible echo of that Egyptian practice, and it is “probable, though not certain, that the kings of Judah took a new name when they succeeded to the throne.” Elder Jeffrey R. Holland counted “the coronation of a King/Messiah” among the “many ways to use this famous passage.”
    sources: [sc-knowhy-536, isaiah-in-bom]
  - ref: 6
    phrase: Wonderful, Counsellor, The mighty God, The everlasting Father, The Prince of Peace
    kind: christ
    title: Four throne names
    body: |
      Isaiah gives this child four names, each a pair of words in Hebrew:

      - **Wonderful Counsellor** (*peleʾ yoʿets*). The two words read best as one title: a counselor who is himself a *wonder*. *Peleʾ* is used of God’s extraordinary acts of judgment and redemption ([[Ex. 15:11]]). Compare [[Isa. 11:2]]: “the spirit of counsel.”
      - **The mighty God** (*ʾel gibbor*). This is an unmistakably divine title. The exact phrase appears again in the next chapter for the God to whom the remnant returns ([[Isa. 10:21]]).
      - **The everlasting Father** (*ʾavi-ʿad*), literally “father of perpetuity.” Jesus Christ is called “the Father” because He is the Creator of heaven and earth ([[Mosiah 15:4]]; [[Ether 3:14]]), because He is the Father of all who are spiritually reborn through Him ([[Mosiah 5:7]]), and because He acts with the Father’s full authority ([[Mosiah 15:2–3]]). In 1916 the First Presidency and the Twelve, citing this verse, set out these three senses. He is the Son of God the Father, and He is also a “father” to us in these senses.
      - **The Prince of Peace** (*sar shalom*). *Shalom* is more than the absence of war; it means completeness, welfare and peace. He brings peace between nations (verse 5), and peace to the soul ([[John 14:27]]; [[D&C 19:23]]).
    sources: [bd-christ-names, bdb, father-and-son-1916, lds-scriptures]
  - ref: 7
    phrase: upon the throne of David
    kind: christ
    title: David’s throne forever
    body: |
      The Lord had covenanted with David that his throne would be established forever ([[2 Sam. 7:12–16]]). By Isaiah’s day, David’s descendants included faithless kings like Ahaz. Isaiah looks past them to a Son of David whose reign will never end.

      Gabriel used this language when he announced Jesus’s birth to Mary: “the Lord God shall give unto him the throne of his father David: and he shall reign over the house of Jacob for ever; and of his kingdom there shall be no end” ([[Luke 1:32–33]]). The final line of verse 7 is a guarantee: “The zeal of the LORD of hosts will perform this.” It depends on God’s passionate commitment, not on human faithfulness.
    sources: [lds-scriptures]
  - ref: 10
    phrase: The bricks are fallen down, but we will build with hewn stones
    kind: history
    title: Rebuilding instead of repenting
    body: |
      This is the proud boast of Ephraim and Samaria (verse 9). Brick walls fell? We’ll rebuild with hewn stone. Sycamores cut down? We’ll replace them with cedars. Every disaster becomes an opportunity to build something grander.

      It sounds like resilience, and in some contexts resilience is a virtue. But verse 13 shows what’s missing: “the people turneth not unto him that smiteth them.” They treated a call to repentance as a construction problem. Mormon described the Nephites the same way: after the Lord chastened them, they would forget Him again, until He had to “chasten his people with many afflictions” ([[Hel. 12:2–3]]).
    sources: [lds-scriptures]
  - ref: 12
    phrase: For all this his anger is not turned away, but his hand is stretched out still
    kind: words
    title: The refrain tolls again
    body: |
      This refrain first appeared in [[Isa. 5:25]]. It now marks the end of each stanza of the poem that runs from 9:8 to 10:4 (verses 12, 17, 21, and [[Isa. 10:4]]). Each stanza describes a judgment, and each time the refrain says: *it’s not over yet.*

      For the northern kingdom the hand stayed raised until Samaria fell ([[2 Kgs. 17:6]]). The raised hand is a threat, the pose of a warrior about to strike (see the note on [[Isa. 5:25]]). The Book of Mormon speaks of mercy with a different image: the Lord’s arm “lengthened out all the day long” and “extended” toward anyone who will turn ([[2 Ne. 28:32]]; [[Jacob 6:5]]).
    sources: [gee-hand-lord, sc-knowhy-49, lds-scriptures]
  - ref: 17
    phrase: neither shall have mercy on their fatherless and widows
    kind: history
    title: When even widows are not spared
    body: |
      This verse is shocking, because throughout scripture the Lord is the special protector of orphans and widows ([[Deut. 10:18]]; [[Ps. 68:5]]). For Him to withhold mercy even from them shows how complete the corruption has become: “every one is an hypocrite.” The rot has reached every level of society.

      It’s a measure of how serious the situation is, not a change in God’s character. Elsewhere Isaiah insists on care for the fatherless and the widow ([[Isa. 1:17]]; [[Isa. 10:2]]).
    sources: [lds-scriptures]
  - ref: 21
    phrase: Manasseh, Ephraim; and Ephraim, Manasseh
    kind: history
    title: Brothers at war
    body: |
      Manasseh and Ephraim were the two sons of Joseph ([[Gen. 41:50–52]]). In Isaiah’s day the north tore itself apart: [[2 Kgs. 15]] records Zechariah, Shallum, Pekahiah and Pekah each killed by a rival who took his throne. Verse 20’s grim image, eating “the flesh of his own arm,” likely means turning on one’s own kin, as verse 19 says no man spares his brother.

      In verse 21 the brothers unite only against Judah. Isaiah 11 adds a word of hope: Ephraim and Judah will be reconciled, and “Ephraim shall not envy Judah, and Judah shall not vex Ephraim” ([[Isa. 11:13]]; see [[Ezek. 37:15–22]]).
    sources: [lds-scriptures]

christ: |
  Isaiah 9:6–7 is one of the clearest and most beloved prophecies of Jesus Christ in all scripture. The child is **born** and the Son is **given**. The government is **on His shoulder**. He is the **Wonderful Counsellor**, the **Mighty God**, the **Everlasting Father**, and the **Prince of Peace**, and He sits on **David’s throne forever**. Matthew shows the light dawning in Galilee when Jesus began to preach ([[Matt. 4:12–17]]), and Gabriel echoes verse 7 to Mary ([[Luke 1:32–33]]).

  Set this against the rest of the chapter. Israel’s response to darkness was to rebuild its own walls. God’s response to Israel’s darkness was to send His Son into it, raised in the very region that was afflicted first.

explore: |
  - **The mighty God.** Compare [[Isa. 9:6]] and [[Isa. 10:21]]. What does it mean that the same divine title describes the child and the God to whom the remnant returns?
  - **Christ as Father.** Read [[Mosiah 15:1–7]] and [[Mosiah 5:7]]. How do Abinadi and King Benjamin help explain “The everlasting Father”?

parallels:
  - ref: 2 Ne. 19
    note: Nephi quotes the chapter.
    primary: true
  - ref: Matt. 4:12–16
    note: Jesus’s ministry in Galilee fulfills verses 1–2.
  - ref: Luke 1:32–33
    note: Gabriel echoes verse 7 to Mary.

