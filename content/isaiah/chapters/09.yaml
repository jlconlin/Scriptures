chapter: 9
title: 'Unto Us a Child Is Born'
tagline: A great light breaks on Galilee, a child-King receives four throne names, and a proud kingdom refuses to turn.
when: 'c. 734–722 BC; the light prophesied for Galilee dawned with Jesus’s ministry'

setting: |
  Chapter 8 ended in total darkness: people wandering, hungry, cursing their king and their God, seeing only “dimness of anguish.” Chapter 9 begins by saying the darkness won’t last.

  The historical setting is the northern regions of Israel, **Zebulun and Naphtali**, around the Sea of Galilee. These were the first Israelite lands conquered by Assyria, in 733–732 BC, when Tiglath-pileser III “took… Galilee, all the land of Naphtali, and carried them captive” ([[2 Kgs. 15:29]]). They were the first to go into darkness. Isaiah promises they will be the first to see the light.

  Then the chapter changes key. Verses 8–21 begin a long poem of judgment against the northern kingdom (Ephraim) that continues into chapter 10, with a haunting refrain. Nephi quoted the whole chapter in [[2 Ne. 19]].

thread: |
  Isaiah 9 is a story of **two responses to darkness**.

  The first response is God’s. Into the darkest, most devastated corner of the land, the very places Assyria conquered first, He sends a great light (verses 1–2). Joy breaks out like harvest time (verse 3). The oppressor’s yoke is shattered, as when Gideon routed Midian with a handful of men (verse 4). Even the soldiers’ blood-soaked boots and cloaks are thrown on the fire (verse 5). And the reason for all this joy is… a baby. “For unto us a child is born, unto us a son is given.” This child carries the government on His shoulder, bears four magnificent names, and rules on David’s throne forever (verses 6–7). God’s answer to the darkness is a Person.

  The second response is Israel’s. Verses 8–21 describe the northern kingdom after the first Assyrian blows. Do they repent? No. They say, in effect, *The bricks fell down? We’ll rebuild with cut stone! The sycamores were cut down? We’ll plant cedars!* (verse 10). They treat judgment as a construction setback, not a call to return. So the blows keep coming, and the refrain tolls four times: “For all this his anger is not turned away, but his hand is stretched out still” (verses 12, 17, 21; [[Isa. 10:4]]).

  The contrast is the point. God responds to our darkness by giving us His Son. The question is whether we respond to His discipline by turning to Him or by rebuilding our own walls with better stone.

sections:
  - range: 1-7
    heading: A great light and a royal child
    plain: |
      But the darkness will not last forever. The Lord first humbled the lands of Zebulun and Naphtali, but in the future He will bring honor to Galilee of the nations, along the road by the sea and beyond the Jordan. The people who walked in darkness have seen a great light; light has dawned on those who lived in the shadow of death. You have enlarged the nation and filled it with joy, like the joy of harvest or of dividing plunder. You have broken the oppressor’s yoke as You did in Gideon’s day against Midian. Every soldier’s boot and blood-soaked cloak will be burned. For a child is born to us, a son is given to us, and the government will rest on His shoulders. He will be called Wonderful Counselor, Mighty God, Everlasting Father, Prince of Peace. His government and peace will grow without end. He will reign on David’s throne, establishing it with justice and righteousness forever. The Lord’s zeal will make it happen.
  - range: 8-12
    heading: '“We will build with hewn stones”'
    plain: |
      The Lord has sent a message against Israel, and all of Ephraim and Samaria will know it. They say proudly, “The brick walls have fallen, but we’ll rebuild with cut stone. The sycamores are cut down, but we’ll replace them with cedars.” So the Lord will raise up enemies against them: Arameans from the east and Philistines from the west, devouring Israel with open mouths. Even so, His anger is not turned away, and His hand is still stretched out.
  - range: 13-17
    heading: Leaders who mislead
    plain: |
      The people haven’t turned back to the One who struck them or sought the Lord. So in one day He will cut off both head and tail, palm branch and reed. The elders and dignitaries are the head; the prophets who teach lies are the tail. The leaders mislead the people, and those they lead are swallowed up. So the Lord takes no pleasure in their young men and has no pity on their orphans and widows, because everyone is godless and wicked and speaks foolishness. Even so, His hand is still stretched out.
  - range: 18-21
    heading: Wickedness burns like fire
    plain: |
      Wickedness burns like a fire, consuming thorns and thickets until the whole forest goes up in smoke. The Lord’s wrath darkens the land, and the people become fuel for the fire. No one spares even his own brother. They grab food on the right and are still hungry; they eat on the left and are never full. They devour even their own flesh. Manasseh attacks Ephraim, Ephraim attacks Manasseh, and together they turn on Judah. Even so, His hand is still stretched out.

notes:
  - ref: 1
    phrase: the land of Zebulun and the land of Naphtali
    kind: history
    title: First into darkness, first to see the light
    body: |
      Zebulun and Naphtali were tribal territories in the far north of Israel, around the Sea of Galilee. They sat on the main invasion route from Mesopotamia, so they were always hit first. In 733–732 BC, Tiglath-pileser III annexed them, deported much of the population, and turned them into Assyrian provinces ([[2 Kgs. 15:29]]). The region became mixed with foreigners, hence “Galilee of the nations” (or “of the Gentiles”).

      Isaiah promises that this region, which went first into the darkness, would be honored first with the light. Seven centuries later, Jesus grew up in Nazareth of Zebulun and based His ministry at Capernaum “in the borders of Zabulon and Nephthalim.” Matthew quotes this passage as fulfilled ([[Matt. 4:12–16]]).
    sources: [bd-galilee, bd-zebulun]
  - ref: 2
    phrase: The people that walked in darkness have seen a great light
    kind: christ
    title: The great light
    body: |
      Notice the prophetic past tense (“have seen,” “hath… shined”): Isaiah sees it as already done. The contrast with the end of chapter 8 is intentional: those who were “driven to darkness” ([[Isa. 8:22]]) now see a great light.

      Jesus later declared, “I am the light of the world: he that followeth me shall not walk in darkness” ([[John 8:12]]). In John’s Gospel that saying comes shortly after the Pharisees brushed Jesus aside with “Search, and look: for out of Galilee ariseth no prophet” ([[John 7:52]]). Read with Isaiah 9 in mind, His answer is pointed: Isaiah had promised that the great light would dawn on Galilee of all places. To the Nephites, the risen Lord said, “I am the light and the life of the world” ([[3 Ne. 11:11]]). Among the Nephites the sign of His birth was literally a night without darkness ([[3 Ne. 1:15–19]]).
    sources: [sc-knowhy-869]
  - ref: 3
    phrase: Thou hast multiplied the nation, and not increased the joy
    kind: words
    title: '“Not” or “to it”? The Book of Mormon weighs in'
    body: |
      This line has puzzled readers, since the rest of the verse is all about joy. The explanation is a tiny textual detail. In Hebrew, *loʾ* (“not”) and *lo* (“to it”) sound identical. The written Hebrew text has “not,” but the traditional Jewish reading instruction (the *qere*) says to read it as “to it”: “thou hast multiplied the nation, **and increased its joy**.” Most modern translations follow that reading, which fits the context perfectly.

      Here the Book of Mormon agrees with that reading. Nephi’s text says: “Thou hast multiplied the nation, **and increased the joy**” ([[2 Ne. 19:3]]). Without the troublesome “not,” the verse fits its context. It is one of a number of places where the Book of Mormon’s Isaiah text departs from the King James Version in the direction of a reading preserved elsewhere in the ancient textual tradition.
    sources: [oswalt, isaiah-in-bom]
  - ref: 4
    phrase: as in the day of Midian
    kind: history
    title: The day of Midian
    body: |
      This alludes to Gideon’s victory over the Midianites ([[Judg. 7]]). The Lord deliberately reduced Gideon’s army from 32,000 to 300 so that Israel could not boast that its own hand had saved it ([[Judg. 7:2]]). Armed only with trumpets, jars, and torches, the 300 routed a vast army.

      The day of Midian is therefore shorthand for a deliverance that is obviously God’s doing, not man’s. Isaiah uses it again in [[Isa. 10:26]]. The coming deliverance through the child of verse 6 will be like that: a victory won by God, with human weakness on full display.
  - ref: 5
    phrase: garments rolled in blood
    kind: symbol
    title: Burning the uniforms
    body: |
      The first half of the verse refers to the soldier’s **boot** (the Hebrew word is the heavy tramping boot of an invading army) and the cloak soaked in blood. When peace finally comes, all of that battle gear will be gathered and burned as fuel. War equipment will be permanently obsolete.

      It is the same hope as swords beaten into plowshares ([[Isa. 2:4]]). And it prepares for the title of verse 6: “The Prince of Peace.”
  - ref: 6
    phrase: For unto us a child is born, unto us a son is given
    kind: christ
    title: A child born, a Son given
    body: |
      Notice the two parallel lines. A child is **born** (He enters mortality as a human baby), and a Son is **given** (He is the gift of the Father, who existed before His birth). Latter-day Saints may hear in this pairing both natures of Jesus Christ: born of Mary and given by God ([[John 3:16]]; [[1 Ne. 11:18–21]]; [[Mosiah 3:8]]).

      The Bible Dictionary cites this verse as an example of Isaiah’s prophecies of “the coming of the Redeemer, both in His first appearance… and as the Great King at the last day.” Handel set it to one of the most joyful choruses in *Messiah*, and generations of Christians have sung it at Christmas.
    sources: [bd-isaiah]
  - ref: 6
    phrase: the government shall be upon his shoulder
    kind: symbol
    title: On His shoulder
    body: |
      In the ancient Near East, a symbol of office, such as a key, a scepter, or a royal robe, was sometimes worn or carried on the shoulder. Isaiah uses exactly this image when the “key of the house of David” is laid on Eliakim’s shoulder ([[Isa. 22:22]]). Here the entire government rests on the child’s shoulder: the full weight and authority of rule.

      It’s moving to set beside this the Savior’s own images of shoulders. The Good Shepherd finds the lost sheep and “layeth it on his shoulders, rejoicing” ([[Luke 15:5]]). He bore His cross ([[John 19:17]]). The shoulder that carries the government of the universe also carries the lost and the burden of our sins.
  - ref: 6
    phrase: Wonderful, Counsellor, The mighty God, The everlasting Father, The Prince of Peace
    kind: christ
    title: Four throne names
    body: |
      Ancient kings received grand throne names at their coronation. Isaiah gives this child four, each a pair of words in Hebrew:

      - **Wonderful Counsellor** (*peleʾ yoʿets*). Many scholars read “Wonderful” and “Counsellor” as one title: a counselor who is a *wonder*. *Peleʾ* is a word used for God’s miracles, what only God can do ([[Ex. 15:11]]). His counsel is supernaturally wise. Compare [[Isa. 11:2]]: “the spirit of counsel.”
      - **The mighty God** (*ʾel gibbor*). This is an unmistakably divine title. The exact phrase appears again in the next chapter for the God of Israel to whom the remnant returns ([[Isa. 10:21]]). The child *is* God.
      - **The everlasting Father** (*ʾavi-ʿad*), literally “Father of eternity.” The Book of Mormon helps here. Jesus Christ is called “the Father” because He is the Creator of heaven and earth ([[Mosiah 15:4]]; [[Ether 3:14]]), because He is the Father of all who are spiritually reborn through Him ([[Mosiah 5:7]]), and because He acts with the Father’s full authority ([[Mosiah 15:2–3]]). He is the Son of God the Father, and He is also a “father” to us in these senses.
      - **The Prince of Peace** (*sar shalom*). *Shalom* is more than the absence of war; it is wholeness, well-being, everything as it should be. He brings peace between nations (verse 5), and peace to the soul ([[John 14:27]]; [[D&C 19:23]]).
    sources: [bd-christ-names]
  - ref: 7
    phrase: upon the throne of David
    kind: christ
    title: David’s throne forever
    body: |
      The Lord had covenanted with David that his throne would be established forever ([[2 Sam. 7:12–16]]). By Isaiah’s day, David’s descendants included faithless kings like Ahaz. Isaiah looks past them to a Son of David whose reign will never end.

      Gabriel used this language when he announced Jesus’s birth to Mary: “the Lord God shall give unto him the throne of his father David: and he shall reign over the house of Jacob for ever; and of his kingdom there shall be no end” ([[Luke 1:32–33]]). The final line of verse 7 is a guarantee: “The zeal of the LORD of hosts will perform this.” It depends on God’s passionate commitment, not on human faithfulness.
  - ref: 10
    phrase: The bricks are fallen down, but we will build with hewn stones
    kind: history
    title: Rebuilding instead of repenting
    body: |
      This is the proud boast of Samaria after the first Assyrian blows. Mud-brick walls collapsed? We’ll rebuild with expensive cut stone. Humble sycamore-fig beams destroyed? We’ll use imported cedar. Every disaster becomes an opportunity to build something even more impressive.

      It sounds like resilience, and in some contexts resilience is a virtue. But verse 13 shows what’s missing: “the people turneth not unto him that smiteth them.” They treated a call to repentance as a construction problem. Mormon described the Nephites the same way: after the Lord chastened them, they would forget Him again, until He had to “chasten his people with many afflictions” ([[Hel. 12:2–3]]).
  - ref: 12
    phrase: For all this his anger is not turned away, but his hand is stretched out still
    kind: words
    title: The refrain tolls again
    body: |
      This refrain first appeared in [[Isa. 5:25]]. It now marks the end of each stanza of the poem that runs from 9:8 to 10:4 (verses 12, 17, 21, and [[Isa. 10:4]]). Each stanza describes a judgment, and each time the refrain says: *it’s not over yet.*

      For the northern kingdom the hand stayed raised until Samaria fell in 722 BC. The raised hand is a threat, the pose of a warrior about to strike (see the note on [[Isa. 5:25]]). The Book of Mormon speaks of mercy with a different image: the Lord’s arm “lengthened out all the day long” and “extended” toward anyone who will turn ([[2 Ne. 28:32]]; [[Jacob 6:5]]).
    sources: [gee-hand-lord, sc-knowhy-49]
  - ref: 15
    phrase: the prophet that teacheth lies, he is the tail
    kind: history
    title: Head and tail
    body: |
      Verse 14 uses two pairs of opposites to mean “everyone”: head and tail (top and bottom of an animal), branch and rush (the lofty palm frond and the lowly marsh reed). Verse 15 adds an interpretation: the “head” is the elders and nobles, and the “tail” is the false prophets.

      It is a biting image. The false prophets wag along behind the leaders like a dog’s tail, telling them what they want to hear. Micah condemned the same kind of prophets, who “divine for money” and cry peace to whoever feeds them ([[Micah 3:5–11]]).
  - ref: 17
    phrase: neither shall have mercy on their fatherless and widows
    kind: history
    title: When even widows are not spared
    body: |
      This verse is shocking, because throughout scripture the Lord is the special protector of orphans and widows ([[Deut. 10:18]]; [[Ps. 68:5]]). For Him to withhold mercy even from them shows how complete the corruption has become: “every one is an hypocrite.” The rot has reached every level of society.

      It’s a measure of how serious the situation is, not a change in God’s character. Elsewhere Isaiah insists on care for the fatherless and the widow ([[Isa. 1:17]]; [[Isa. 10:2]]).
  - ref: 21
    phrase: Manasseh, Ephraim; and Ephraim, Manasseh
    kind: history
    title: Brothers at war
    body: |
      Manasseh and Ephraim were the two sons of Joseph, and their tribes were the heart of the northern kingdom. In Isaiah’s day the north tore itself apart. In the twenty years before Samaria fell, six kings reigned, and four were assassinated by rivals ([[2 Kgs. 15:8–31]]). Verse 20’s grim image, eating “the flesh of his own arm,” means turning on one’s own kin.

      The only thing that unites the brothers is their hostility to Judah. The Restoration adds a hopeful coda: in the last days, Ephraim and Judah will be reconciled, and “Ephraim shall not envy Judah, and Judah shall not vex Ephraim” ([[Isa. 11:13]]; see [[Ezek. 37:15–22]]).

christ: |
  Isaiah 9:6–7 is one of the clearest and most beloved prophecies of Jesus Christ in all scripture. The child is **born** and the Son is **given**. The government is **on His shoulder**. He is the **Wonderful Counsellor**, the **Mighty God**, the **Everlasting Father**, and the **Prince of Peace**, and He sits on **David’s throne forever**. Matthew shows the light dawning in Galilee when Jesus began to preach ([[Matt. 4:12–17]]), and Gabriel echoes verse 7 to Mary ([[Luke 1:32–33]]).

  Set this against the rest of the chapter. Israel’s response to darkness was to rebuild its own walls. God’s response to Israel’s darkness was to send His Son into it, born into the very region that had suffered most. Christ comes to the places that went first into the dark.

liken: |
  - Where is the “land of Zebulun and Naphtali” in my life, the place that was hit first and hardest? Can I believe that the light may come there first?
  - Of the four names in verse 6, which one do I most need Jesus Christ to be for me right now: Counselor, Mighty God, Father, or Prince of Peace? Why?
  - When disappointment or discipline comes, do I tend to repent, or do I just rebuild with “hewn stones”? What would turning to “him that smiteth” look like?
  - The government is upon His shoulder. What burden am I trying to carry on my own shoulders that belongs on His?

explore: |
  - **Handel’s Isaiah.** Listen to Handel’s *Messiah* with Isaiah open. Nearly the entire first part comes from Isaiah (40:1–5, 40:9, 7:14, 9:2, 9:6, 35:5–6, 40:11), and much of the second part from Isaiah 53. Which passages do you recognize?
  - **The mighty God.** Compare [[Isa. 9:6]] and [[Isa. 10:21]]. What does it mean that the same divine title describes the child and the God to whom the remnant returns?
  - **Christ as Father.** Read [[Mosiah 15:1–7]] and [[Mosiah 5:7]]. How do Abinadi and King Benjamin help explain “The everlasting Father”?

parallels:
