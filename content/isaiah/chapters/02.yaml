chapter: 2
title: The Mountain of the Lord’s House
tagline: All nations streaming uphill to the temple, and a proud people who must first be brought low.
when: 'Judah in a time of prosperity (the reigns of Uzziah and Jotham); the prophecy reaches to the last days'

setting: |
  Chapters 2–4 form a single unit with a fresh heading (2:1). Verses 6–8 describe a Judah wealthy, well-armed, and spiritually complacent, which fits the prosperity of the reigns of Uzziah and Jotham. That background matters: the pride Isaiah attacks is the pride of success.

  The unit has a clear shape: its close (4:2–6) circles back to its opening, a vision of Zion’s glory (2:2–4), and between the two sits a long indictment of pride (2:5–4:1). In other words, Isaiah frames judgment with hope. We’re shown where the story is going before we’re shown what must be burned away on the way there.

  Nephi copied this chapter into his record ([[2 Ne. 12]]), and his version differs from the King James text in several instructive places.

thread: |
  Isaiah 2 is built on a single contrast between **two directions: up and down**.

  The first four verses are all about ascent. The Lord’s house is lifted to the “top of the mountains,” “exalted above the hills,” and the nations “flow” to it. Picture a river running *uphill*. People say, “Come… let us go **up**.” It is a stunning picture of what the Lord intends: a world that has learned His ways, with its weapons turned into farm tools.

  Then verse 5 turns to Isaiah’s own people with an invitation: “O house of Jacob, come ye, and let us walk in the light of the LORD.” If the nations will one day come, surely Israel should come now. But verses 6–9 show why they can’t. They are *full*: full of foreign practices, full of silver and gold, full of horses and chariots, full of idols. A people that full has no room for the Lord.

  So the rest of the chapter is about **descent**. Everything “high and lifted up” is brought low: cedars, oaks, mountains, towers, walls, ships, and above all “the loftiness of man.” Twice Isaiah repeats the refrain, “the LORD alone shall be exalted in that day” (verses 11, 17). The chapter ends with idols tossed to the moles and bats and people hiding in caves.

  The logic is simple and piercing. **There is only room for one thing to be exalted.** Either we lift ourselves up, and the Lord brings us down, or we go up to His house to be taught, and He lifts us. The mountain of the Lord’s house is the only height that is safe to climb.

sections:
  - range: 1-5
    heading: All nations flow to the Lord’s house
    plain: |
      In the last days the Lord’s temple will be established as the highest of the mountains, and every nation will stream to it. People will say, “Let’s go up to the Lord’s house so He can teach us His ways.” His law will go out from Zion and His word from Jerusalem. He will settle disputes between nations, and they will turn their weapons into farm tools and never train for war again. So come, people of Jacob, let’s walk in the Lord’s light.
  - range: 6-9
    heading: A people too full for God
    plain: |
      But You have abandoned Your people, because they are filled with practices from the East and fortune-telling like the Philistines. They make deals with foreigners. Their land is full of silver, gold, horses, and chariots, and full of idols they made themselves. Everyone, high and low, bows to them.
  - range: 10-22
    heading: The day of the Lord against all that is proud
    plain: |
      Hide in the rocks from the Lord’s glory! Proud looks will be humbled, and the Lord alone will be exalted in that day. His day will come against everything proud and towering: the tallest trees, the highest mountains, every tower and wall, every great ship and luxury. People will throw their gold and silver idols to the moles and bats and run for the caves when He shakes the earth. So stop trusting in mere humans, whose life is only a breath. What are they worth?

notes:
  - ref: 2
    phrase: in the last days
    kind: words
    title: '“In the last days”'
    body: |
      The Hebrew phrase (*beʾacharit hayyamim*) literally means “in the end of the days.” The noun *acharit* means the latter part or actual close of a period, depending on context, and prophets use the phrase for the culminating era of God’s dealings with His people ([[Gen. 49:1]]; [[Micah 4:1]]). Delitzsch notes that in Isaiah it is always used in an eschatological sense, for the furthest horizon of the prophet’s view.

      Latter-day Saint teachers read the prophecy as beginning to be fulfilled in **our** dispensation. Nephi agreed. Right after quoting these chapters, he told his people that Isaiah’s words would “be of great worth unto them in the last days; for in that day shall they understand them” ([[2 Ne. 25:8]]).
    sources: [bdb, oshb-wlc, delitzsch, lee-strengthen-stakes-1973, lds-scriptures]
  - ref: 2
    phrase: the mountain of the LORD’s house shall be established in the top of the mountains
    kind: prophets
    title: A temple in the tops of the mountains
    body: |
      Mountains were sacred to ancient Israelites and were like natural temples, so “the mountain of the LORD’s house” points to the **temple**. The Hebrew says the mountain of the Lord’s house will be established “at the head” (*berosh*) of the mountains, the chief of them. Delitzsch takes this literally: the temple hill would one day tower in actual height, reversing the present contrast between the high peaks of Bashan and the small limestone hill the Lord chose.

      Isaiah was speaking of the temple in Jerusalem in the last days. But the prophecy has been likened to new settings from the start. Nephi copied it into his record soon after his people built a temple in the land of Nephi ([[2 Ne. 5:16]]), which stood at a higher elevation than its surroundings, so it would have been easy for him to liken it to his own people.

      Latter-day Saints have heard it the same way. The hymn “High on the Mountain Top” (Hymns, no. 5) sings of a banner raised on “Zion’s mount” where nations look up and say, “We’ll now go up and serve the Lord,” and in 1971 Elder LeGrand Richards said of the Salt Lake Temple, “How literally that has been fulfilled, in my way of thinking, in this very house of the God of Jacob right here on this block!” Other Latter-day Saint readers broaden the prophecy to every temple built throughout the world. One prophecy, three settings: Isaiah’s temple was in Jerusalem, Nephi’s was in the land of Nephi, and ours are in the tops of the mountains.
    sources: [chadwick-temple-prophecy, sc-knowhy-41, richards-mountain-1971, hymn-high-mountain, oshb-wlc, bdb, delitzsch, lds-scriptures]
  - ref: 2
    phrase: all nations shall flow unto it
    kind: symbol
    title: A river that runs uphill
    body: |
      The Hebrew verb *nahar* means to flow or stream, and in the Bible it is used only figuratively: of restored Israel streaming to the Lord’s goodness, of nations streaming to Babylon’s god Bel, and of the nations streaming to the temple hill here. It is probably built on the noun for “river.” Rivers flow downhill, but this one flows **up** the mountain, something only God could cause, with people drawn upward to the Lord in a steady stream. They come because they want to be taught (verse 3).
    sources: [bdb, oshb-wlc]
  - ref: 3
    phrase: he will teach us of his ways, and we will walk in his paths
    kind: scripture
    title: Why we go to the temple
    body: |
      Notice why the nations come: not for spectacle or safety, but to be **taught**, and then to **walk**. Delitzsch observes that they not only wish to learn but are resolved to act on what they learn. The Lord’s house is described as a “house of learning” ([[D&C 88:119]]; see also [[D&C 109:14]]).

      The same pairing shows up in verse 5: “let us walk in the light of the LORD.”
    sources: [delitzsch, lds-scriptures]
  - ref: 3
    phrase: for out of Zion shall go forth the law, and the word of the LORD from Jerusalem
    kind: scripture
    title: Two world capitals
    body: |
      In Hebrew poetry, “Zion” and “Jerusalem” here would normally be two names for one place, said twice for emphasis; Delitzsch reads “Zion-Jerusalem” as the single source of the Lord’s instruction. Latter-day revelation opens a second possibility. The Book of Mormon speaks of **two** holy cities in the last days: a New Jerusalem built in the Americas and the old Jerusalem rebuilt ([[Ether 13:2–11]]). The Doctrine and Covenants says the Lord will “utter his voice out of Zion, and he shall speak from Jerusalem” ([[D&C 133:21]]).

      President Joseph Fielding Smith read Isaiah 2:3 in that light: “These two cities, one in the land of Zion and one in Palestine, are to become capitals for the kingdom of God during the millennium.” Both readings honor the text. The core promise is that the Lord Himself will govern and teach.
    sources: [delitzsch, ot-manual-13, lds-scriptures]
  - ref: 4
    phrase: they shall beat their swords into plowshares, and their spears into pruninghooks
    kind: symbol
    title: Swords into plowshares
    body: |
      A plowshare is the iron blade of a plow; a pruning hook is a knife for trimming vines. Isaiah pictures blacksmiths hammering weapons into farm tools because no one needs weapons anymore.

      Joel has the same two images in the opposite order for a time of war: “Beat your plowshares into swords” ([[Joel 3:10]]). Isaiah’s version describes the Millennium, when the Prince of Peace rules ([[Isa. 9:6–7]]; [[D&C 101:26]]).

      Micah records nearly identical words ([[Micah 4:1–4]]). Micah was Isaiah’s contemporary, and it is not known whether Isaiah or Micah received the prophecy first, or whether both drew on an earlier source. Micah adds a line: “they shall sit every man under his vine and under his fig tree; and none shall make them afraid.”
    sources: [bdb, delitzsch, ot-manual-13, lds-scriptures]
  - ref: 5
    phrase: O house of Jacob, come ye, and let us walk in the light of the LORD
    kind: bom
    title: Nephi’s version adds a plea
    body: |
      Nephi’s text of this verse continues: “yea, come, for ye have all gone astray, every one to his wicked ways” ([[2 Ne. 12:5]]). The addition makes the turn in the chapter explicit. The vision of the nations coming (verses 2–4) becomes an appeal to Israel, which should have been leading the way and instead has wandered. The added phrase points to a widespread apostasy in Israel, and to Israel’s return to the Lord before the Second Coming.
    sources: [ot-manual-13, lds-scriptures]
  - ref: 6
    phrase: because they be replenished from the east
    kind: history
    title: Imported spirituality
    body: |
      “Replenished from the east” means *filled up* with things from the east: Delitzsch takes it as eastern manners and customs, especially idolatrous practices, from Arabia and the Aramaean lands of the Euphrates. The Philistines on the coast were known for their diviners ([[1 Sam. 6:2]]), and “soothsayers” renders a Hebrew word Delitzsch takes as conjurers. “Please themselves in the children of strangers” likely means they went hand in hand (made deals or alliances) with foreigners.

      The picture is of a people shopping for spiritual experiences and security everywhere except from their own God. The Lord had forbidden divination and its kin ([[Deut. 18:10–12]]).
    sources: [delitzsch, oshb-wlc, lds-scriptures]
  - ref: 7
    phrase: their land is also full of horses, neither is there any end of their chariots
    kind: history
    title: Everything a king was told not to multiply
    body: |
      Look at the list in verses 7–8: silver and gold, horses and chariots, idols. Now read [[Deut. 17:16–17]], the law for Israel’s kings: the king “shall not multiply horses to himself… neither shall he greatly multiply to himself silver and gold.” Isaiah is describing a nation that had become everything the law warned against.

      Horses and chariots were instruments of war, and a land “full of horses” trusted its arsenal. Isaiah later says bluntly: “Woe to them that… stay on horses, and trust in chariots… but they look not unto the Holy One of Israel” ([[Isa. 31:1]]).
    sources: [delitzsch, lds-scriptures]
  - ref: 8
    phrase: they worship the work of their own hands
    kind: prophets
    title: Worshipping what we make
    body: |
      The absurdity Isaiah mocks throughout the book is bowing down to something you made yourself (see [[Isa. 44:9–20]]). Delitzsch notes that the verse says “their own” hands and “their own” fingers: each person made his own.

      President Spencer W. Kimball took up the principle in a 1976 article. He taught that carnal man tends to transfer his trust in God to material things, and that when people lose faith they put their hope in the “arm of flesh” and in idols. He concluded that “we are, on the whole, an idolatrous people.”
    sources: [kimball-false-gods, delitzsch]
  - ref: 9
    phrase: And the mean man boweth down, and the great man humbleth himself
    kind: bom
    title: A verse the Book of Mormon clarifies
    body: |
      This verse is hard in the King James Version. Bowing and humbling oneself sound like good things, so why add “therefore forgive them not”? Delitzsch reads the verbs as judgment: both “men who were lost in the crowd, and men who rose above it” are brought down, without mercy.

      Nephi’s version reads differently: “the mean man boweth **not** down, and the great man humbleth himself **not**, therefore, forgive him not” ([[2 Ne. 12:9]]). Read this way, Isaiah is speaking of men who would not worship the true God, not of idolatry. Now the harsh ending makes sense.
    sources: [delitzsch, ot-manual-13, lds-scriptures]
  - ref: 12
    phrase: every one that is proud and lofty
    kind: words
    title: '“High and lifted up”: a phrase with a history'
    body: |
      Verses 12–16 hammer on one idea: everything *high*, *lofty*, and *lifted up* will be brought low. In chapter 6 he sees the Lord “**high and lifted up**” (Hebrew *ram venissaʾ*, [[Isa. 6:1]]). In chapter 57 the Lord is “the high and lofty One” ([[Isa. 57:15]]). And in chapter 52 the suffering Servant will be “exalted and extolled, and be very high” (*yarum venissaʾ*, [[Isa. 52:13]]).

      In Isaiah, “high and lifted up” belongs to God and to His humble Servant. When humans claim it for themselves, the day of the Lord brings it down. Nephi applies the refrain to the Gentiles of the last days: those “puffed up in the pride of their hearts” will be “thrust down to hell” ([[2 Ne. 28:15]]).
    sources: [oshb-wlc, isaiah-in-bom, lds-scriptures]
  - ref: 16
    phrase: And upon all the ships of Tarshish
    kind: bom
    title: The Book of Mormon’s extra ships
    body: |
      This verse is one of the best-known textual puzzles in the Book of Mormon’s Isaiah chapters. The Hebrew text reads “upon all the ships of Tarshish.” The Greek Septuagint reads instead “upon every ship of the sea, and upon every display of fine ships.” Nephi’s version has **both** ship lines: “upon all the ships of the sea, and upon all the ships of Tarshish, and upon all pleasant pictures” ([[2 Ne. 12:16]]).

      One Latter-day Saint suggestion is that the original verse had three phrases, each beginning “and upon all,” and that each later text lost a different one, while the Book of Mormon preserved all three. Joseph Smith did not know Greek, and there is no evidence he had a copy of the Septuagint in 1829–30.
    sources: [ot-manual-13, lxx-rahlfs, oshb-wlc, lds-scriptures]
  - ref: 19
    phrase: when he ariseth to shake terribly the earth
    kind: scripture
    title: The great shaking
    body: |
      This refrain (verses 19 and 21) describes the Lord “arising” like a warrior and shaking the earth. It anticipates the great earthquake associated with His Second Coming ([[Rev. 6:12–17]]; [[D&C 45:48]]; [[D&C 88:87–89]]). John’s vision echoes Isaiah’s picture: kings and great men hide “in the dens and in the rocks of the mountains” and ask the rocks to hide them from Him who sits on the throne ([[Rev. 6:15–16]]).

      Isaiah’s point is not just terror. When everything that can be shaken is shaken, only what is unshakable remains ([[Heb. 12:26–28]]).
    sources: [lds-scriptures]
  - ref: 22
    phrase: Cease ye from man, whose breath is in his nostrils
    kind: scripture
    title: Don’t trust the arm of flesh
    body: |
      The chapter ends with advice: stop relying on mere mortals. Their life is as fragile as a breath through the nose ([[Gen. 2:7]]). “For wherein is he to be accounted of?” means *what is he really worth?*

      Nephi, who copied this chapter, prayed in the same spirit: “I will not put my trust in the arm of flesh; for I know that cursed is he that putteth his trust in the arm of flesh” ([[2 Ne. 4:34]]). The Lord says the same in the preface to the Doctrine and Covenants: the gospel was restored so that man “should not counsel his fellow man, neither trust in the arm of flesh” ([[D&C 1:19]]).
    sources: [lds-scriptures]

christ: |
  The Lord in Isaiah 2 is the **Teacher** whom all nations come to hear (verse 3), the **Judge** who settles their disputes (verse 4), and the **Prince of Peace** under whom war ends. He is also the one who “alone shall be exalted” (verses 11, 17).

  That refrain reaches its fulfillment in Jesus Christ, who “humbled himself, and became obedient unto death… wherefore God also hath highly exalted him” ([[Philip. 2:8–9]]). The Savior is the model of the chapter’s whole logic. He descended below all things ([[D&C 122:8]]) and was lifted up. Pride tries to climb its own tower. Discipleship follows Him down in humility, and then up the mountain of the Lord’s house.

explore: |
  - **Isaiah 2 and Micah 4.** Compare [[Isa. 2:2–4]] and [[Micah 4:1–5]]. What does Micah add? Why might two prophets record the same prophecy?
  - **Nephi’s version.** Read [[2 Ne. 12]] side by side with this chapter, paying attention to verses 5, 9, 10–12, 16, and 21. Several of Nephi’s differences make the chapter clearer.
  - **The whole unit.** Read chapters 2–4 in one sitting. Notice how the glorious Zion of 2:2–4 reappears, transformed, in 4:2–6, and what has to happen in between.

parallels:
  - ref: 2 Ne. 12
    note: Nephi quotes the entire chapter, with several significant differences.
    primary: true
  - ref: Micah 4:1–3
    note: A nearly identical prophecy of the mountain of the Lord’s house.
  - ref: Rev. 6:15–16
    note: John echoes the proud hiding in the rocks.

