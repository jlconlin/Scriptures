chapter: 2
title: The Mountain of the Lord’s House
tagline: All nations streaming uphill to the temple, and a proud people who must first be brought low.
when: 'c. 740–730 BC, early in Isaiah’s ministry; the prophecy reaches to the last days'

setting: |
  Chapters 2–4 form a single unit with a fresh heading (2:1). They were probably delivered early in Isaiah’s ministry, during the prosperous reigns of Uzziah and Jotham, when Judah was wealthy, well-armed, and spiritually complacent. That background matters: the pride Isaiah attacks is the pride of success.

  The unit has a clear shape. It **opens** with a vision of Zion’s glory (2:2–4) and **closes** with another (4:2–6). Between those two visions sits a long indictment of pride (2:5–4:1). In other words, Isaiah frames judgment with hope. We’re shown where the story is going before we’re shown what must be burned away on the way there.

  Nephi copied this chapter into his record ([[2 Ne. 12]]), and his version differs from the King James text in several instructive places.

thread: |
  Isaiah 2 is built on a single contrast between **two directions: up and down**.

  The first four verses are all about ascent. The Lord’s house is lifted to the “top of the mountains,” “exalted above the hills,” and the nations “flow” to it. Picture a river running *uphill*. People say, “Come… let us go **up**.” It is a stunning picture of what the Lord intends: a world that has learned His ways, with its weapons turned into farm tools.

  Then verse 5 turns to Isaiah’s own people with an invitation: “O house of Jacob, come ye, and let us walk in the light of the LORD.” If the nations will one day come, surely Israel should come now. But verses 6–9 show why they can’t. They are *full*: full of foreign practices, full of silver and gold, full of horses and chariots, full of idols. A people that full has no room for the Lord.

  So the rest of the chapter is about **descent**. Everything “high and lifted up” is brought low: cedars, oaks, mountains, towers, walls, ships, and above all “the loftiness of man.” Twice Isaiah repeats the refrain, “the LORD alone shall be exalted in that day” (verses 11, 17). The chapter ends with idols tossed to the moles and bats and people hiding in caves.

  The logic is simple and piercing. **There is only room for one thing to be exalted.** Either we lift ourselves up, and the Lord brings us down, or we go up to His house to be taught, and He lifts us. The mountain of the Lord’s house is the only height that is safe to climb.

sections:
  - range: 1-5
    heading: All nations flow to the Lord’s house
    plain: |
      In the last days the Lord’s temple will be established as the highest of the mountains, and every nation will stream to it. People will say, “Let’s go up to the Lord’s house so He can teach us His ways.” His law will go out from Zion and His word from Jerusalem. He will settle disputes between nations, and they will turn their weapons into farm tools and never train for war again. So come, people of Jacob, let’s walk in the Lord’s light.
  - range: 6-9
    heading: A people too full for God
    plain: |
      But You have abandoned Your people, because they are filled with practices from the East and fortune-telling like the Philistines. They make deals with foreigners. Their land is full of silver, gold, horses, and chariots, and full of idols they made themselves. Everyone, high and low, bows to them.
  - range: 10-22
    heading: The day of the Lord against all that is proud
    plain: |
      Hide in the rocks from the Lord’s glory! Proud looks will be humbled, and the Lord alone will be exalted in that day. His day will come against everything proud and towering: the tallest trees, the highest mountains, every tower and wall, every great ship and luxury. People will throw their gold and silver idols to the moles and bats and run for the caves when He shakes the earth. So stop trusting in mere humans, whose life is only a breath. What are they worth?

notes:
  - ref: 2
    phrase: in the last days
    kind: words
    title: '“In the last days”'
    body: |
      The Hebrew phrase (*beʾacharit hayyamim*) literally means “in the end of the days” or “in the latter part of the days.” It can mean simply “in the future,” but prophets consistently use it for the culminating era of God’s dealings with His people ([[Gen. 49:1]]; [[Micah 4:1]]).

      Latter-day Saints read it the way it sounds: this prophecy belongs to **our** dispensation. Nephi agreed. Right after quoting these chapters, he told his people that Isaiah’s words would “be of great worth unto them in the last days; for in that day shall they understand them” ([[2 Ne. 25:8]]).
  - ref: 2
    phrase: the mountain of the LORD’s house shall be established in the top of the mountains
    kind: restoration
    title: A temple in the tops of the mountains
    body: |
      In ancient Israel, mountains were places where heaven touched earth: Sinai, Moriah, Zion. “The mountain of the LORD’s house” means the **temple**. The Hebrew says the temple mount will be established “as the head of the mountains,” the chief and highest of them. That is a spiritual claim more than a geological one. Physically, the temple mount in Jerusalem is lower than the hills around it.

      Latter-day Saints have long seen a literal fulfillment in the temples of the Restoration, and especially in the gathering of the Saints to the Rocky Mountains and the building of the Salt Lake Temple. The early hymn “High on the Mountain Top” (Hymns, no. 5) applies the verse this way. More broadly, every temple dedicated today is another place where “all nations” come to be taught of the Lord’s ways. There are now temples on every inhabited continent.
    sources: [hymn-high-mountain, bd-temple]
  - ref: 2
    phrase: all nations shall flow unto it
    kind: symbol
    title: A river that runs uphill
    body: |
      The Hebrew verb *nahar* means to flow like a river (the noun *nahar* is “river”). Rivers flow downhill, but this one flows **up** the mountain. Isaiah is describing something only God can cause: humanity’s natural tendency reversed, with people drawn upward to the Lord in a steady stream.

      It is a lovely picture of the gathering of Israel, which isn’t forced. People come because they want to be taught.
  - ref: 3
    phrase: he will teach us of his ways, and we will walk in his paths
    kind: liken
    title: Why we go to the temple
    body: |
      Notice why the nations come: not for spectacle or safety, but to be **taught**, and then to **walk**. Learning and doing are paired, as they always are in the scriptures. The temple is a house of learning ([[D&C 88:119]]; [[D&C 109:14]]), and the covenants made there are a path to walk.

      The same pairing shows up in verse 5: “let us walk in the light of the LORD.” If the temple is not changing how we walk the rest of the week, we have gone up the mountain and come back down unchanged.
  - ref: 3
    phrase: for out of Zion shall go forth the law, and the word of the LORD from Jerusalem
    kind: restoration
    title: Two world capitals
    body: |
      In Hebrew poetry, “Zion” and “Jerusalem” here would normally be two names for one place, said twice for emphasis. Latter-day revelation opens a second possibility. The Book of Mormon speaks of **two** holy cities in the last days: a New Jerusalem built in the Americas and the old Jerusalem rebuilt ([[Ether 13:2–11]]). The Doctrine and Covenants says the Lord will “utter his voice out of Zion, and he shall speak from Jerusalem” ([[D&C 133:21]]).

      Many Latter-day Saint teachers have read Isaiah 2:3 in that light: during the Millennium the Lord’s law will go forth from two centers, Zion in the Americas and Jerusalem in the Holy Land. Both readings honor the text. The core promise is that the Lord Himself will govern and teach.
  - ref: 4
    phrase: they shall beat their swords into plowshares, and their spears into pruninghooks
    kind: symbol
    title: Swords into plowshares
    body: |
      A plowshare is the metal blade of a plow; a pruning hook is a curved knife for trimming vines. Iron was precious, so it would be reforged, not thrown away. Isaiah pictures blacksmiths hammering weapons into farm tools because no one needs weapons anymore.

      The image is so powerful that the prophet Joel deliberately reversed it for a time of war: “Beat your plowshares into swords” ([[Joel 3:10]]). Isaiah’s version describes the Millennium, when the Prince of Peace rules ([[Isa. 9:6–7]]; [[D&C 101:26]]). Today a bronze statue of a man beating a sword into a plowshare stands at the United Nations headquarters in New York, a gift from the Soviet Union in 1959. It is a small sign that this verse speaks to deep human longing.

      Micah records nearly identical words ([[Micah 4:1–4]]). Micah was Isaiah’s contemporary, and whether one quoted the other or both drew on an earlier prophecy is unknown. Micah adds a line: “they shall sit every man under his vine and under his fig tree; and none shall make them afraid.”
  - ref: 5
    phrase: O house of Jacob, come ye, and let us walk in the light of the LORD
    kind: restoration
    title: Nephi’s version adds a plea
    body: |
      Nephi’s text of this verse continues: “yea, come, for ye have all gone astray, every one to his wicked ways” ([[2 Ne. 12:5]]). The addition makes the turn in the chapter explicit. The vision of the nations coming (verses 2–4) becomes an appeal to Israel, which should have been leading the way and instead has wandered.

      There is something poignant in the order. The Gentile nations will eventually come up the mountain, and the covenant people are the ones who need to be invited.
  - ref: 6
    phrase: because they be replenished from the east
    kind: history
    title: Imported spirituality
    body: |
      “Replenished from the east” means *filled up* with practices from the east, probably the divination and occult arts of Syria and Mesopotamia. The Philistines on the coast were known for their soothsayers ([[1 Sam. 6:2]]). “Please themselves in the children of strangers” likely means they struck hands (made deals, alliances, or business partnerships) with foreigners.

      The picture is of a people shopping for spiritual experiences and security everywhere except from their own God. The Lord had forbidden exactly these practices ([[Deut. 18:9–14]]).
  - ref: 7
    phrase: their land is also full of horses, neither is there any end of their chariots
    kind: history
    title: Everything a king was told not to multiply
    body: |
      Look at the list in verses 7–8: silver and gold, horses and chariots, idols. Now read [[Deut. 17:16–17]], the law for Israel’s kings: the king “shall not multiply horses to himself… neither shall he greatly multiply to himself silver and gold.” Isaiah is describing a nation that had become everything the law warned against.

      In the ancient world, horses and chariots were military technology, the tanks and fighter jets of their day. A land “full of horses” trusted its arsenal. Isaiah later says bluntly: “Woe to them that… stay on horses, and trust in chariots… but they look not unto the Holy One of Israel” ([[Isa. 31:1]]).
  - ref: 8
    phrase: they worship the work of their own hands
    kind: liken
    title: Worshipping what we make
    body: |
      The absurdity Isaiah mocks throughout the book is bowing down to something you made yourself (see [[Isa. 44:9–20]] for his most biting satire). Few of us carve idols. But the principle behind the verse is timeless: we are always tempted to trust and serve the work of our own hands, whether our careers, our savings, our reputations, or our cleverness.

      President Spencer W. Kimball made this point in a well-known 1976 article. Modern idols, he said, include possessions, careers, and the trust we place in our own strength, anything we put before the Lord. A useful test is to ask what we reach for first when we are afraid.
    sources: [kimball-false-gods]
  - ref: 9
    phrase: And the mean man boweth down, and the great man humbleth himself
    kind: restoration
    title: A verse the Book of Mormon clarifies
    body: |
      This verse is confusing in the King James Version. Bowing and humbling oneself sound like good things, so why add “therefore forgive them not”? The answer is that they are bowing **to idols** (verse 8). “Mean” here means common or low-ranking, not cruel: everyone, high and low, bows to what they made.

      Nephi’s version reads differently: “the mean man boweth **not** down, and the great man humbleth himself **not**, therefore, forgive him not” ([[2 Ne. 12:9]]). Now the verse describes people who refuse to humble themselves before God, and the harsh ending makes sense. Either way, the point is the same: their worship is pointed in the wrong direction.
    sources: [isaiah-in-bom]
  - ref: 12
    phrase: every one that is proud and lofty
    kind: words
    title: '“High and lifted up”: a phrase with a history'
    body: |
      Verses 12–16 hammer on one idea: everything *high*, *lofty*, and *lifted up* will be brought low. Watch that vocabulary, because Isaiah uses it with great care. In chapter 6 he sees the Lord “**high and lifted up**” (Hebrew *ram venissaʾ*, [[Isa. 6:1]]). In chapter 57 the Lord is “the high and lofty One” ([[Isa. 57:15]]). And in chapter 52 the suffering Servant will be “exalted and extolled, and be very high” (*yarum venissaʾ*, [[Isa. 52:13]]).

      In Isaiah, “high and lifted up” belongs to God and to His humble Servant. When humans claim it for themselves, it is a kind of blasphemy, and the day of the Lord brings it down. The one who descends below all things is the one who is exalted ([[D&C 88:6]]; [[Philip. 2:8–9]]).
  - ref: 13
    phrase: the cedars of Lebanon
    kind: symbol
    title: Trees, towers, and ships
    body: |
      Isaiah catalogs the most impressive things an Israelite could imagine. The **cedars of Lebanon** were the tallest trees in the region, used for Solomon’s temple. The **oaks of Bashan** grew in the fertile highlands east of Galilee. Then come **high mountains**, **towers**, and **fenced** (fortified) **walls**, and finally the **ships of Tarshish**, the great ocean-going merchant ships.

      Nature, military might, and commerce are all symbols of human pride and self-sufficiency, and all of them will be humbled. The same trees reappear when the Lord fells Assyria like a forest ([[Isa. 10:33–34]]).
    sources: [bd-lebanon, bd-bashan, bd-tarshish]
  - ref: 16
    phrase: And upon all the ships of Tarshish
    kind: restoration
    title: The Book of Mormon’s extra ships
    body: |
      This verse is one of the best-known textual puzzles in the Book of Mormon’s Isaiah chapters. The Hebrew text reads “upon all the ships of Tarshish.” The Greek Septuagint, translated in the last centuries before Christ, reads instead “upon every ship of the sea.” Nephi’s version has **both**: “upon all the ships of the sea, and upon all the ships of Tarshish, and upon all pleasant pictures” ([[2 Ne. 12:16]]).

      A plausible explanation is that the original verse had three lines, and each later textual tradition lost a different one. Joseph Smith, translating in 1829, had no access to the Septuagint and couldn’t read Greek. Latter-day Saint scholars have long pointed to the verse as a small evidence that the brass plates preserved an early form of Isaiah’s text.
    sources: [isaiah-in-bom, parry-harmonizing]
  - ref: 19
    phrase: when he ariseth to shake terribly the earth
    kind: restoration
    title: The great shaking
    body: |
      This refrain (verses 19 and 21) describes the Lord “arising” like a warrior and shaking the earth. It anticipates the great earthquake associated with His Second Coming ([[Rev. 6:12–17]]; [[D&C 45:48]]; [[D&C 88:87–89]]). John borrows Isaiah’s picture directly: kings and great men hide “in the dens and in the rocks of the mountains” and ask the rocks to hide them from Him who sits on the throne ([[Rev. 6:15–16]]).

      Isaiah’s point is not just terror. When everything that can be shaken is shaken, only what is unshakable remains ([[Heb. 12:26–28]]).
  - ref: 20
    phrase: to the moles and to the bats
    kind: symbol
    title: Idols for the moles and bats
    body: |
      Moles and bats were creatures of darkness and ruins, and they were ritually unclean ([[Lev. 11:19]]). When the day of the Lord comes, people will fling their precious silver and gold idols into the holes and caves where such animals live, dumping them as they flee.

      There is dark humor in it. The gods these people spent fortunes on end up as junk in a bat cave.
  - ref: 22
    phrase: Cease ye from man, whose breath is in his nostrils
    kind: liken
    title: Don’t trust the arm of flesh
    body: |
      The chapter ends with advice: stop relying on mere mortals. Their life is as fragile as a breath through the nose ([[Gen. 2:7]]). “For wherein is he to be accounted of?” means *what is he really worth?*

      Nephi, who copied this chapter, prayed in the same spirit: “I will not put my trust in the arm of flesh; for I know that cursed is he that putteth his trust in the arm of flesh” ([[2 Ne. 4:34]]). The Lord says the same in the preface to the Doctrine and Covenants: the gospel was restored so that man “should not counsel his fellow man, neither trust in the arm of flesh” ([[D&C 1:19]]).

christ: |
  The Lord in Isaiah 2 is the **Teacher** whom all nations come to hear (verse 3), the **Judge** who settles their disputes (verse 4), and the **Prince of Peace** under whom war ends. He is also the one who “alone shall be exalted” (verses 11, 17).

  That refrain reaches its fulfillment in Jesus Christ, who “humbled himself, and became obedient unto death… wherefore God also hath highly exalted him” ([[Philip. 2:8–9]]). The Savior is the model of the chapter’s whole logic. He descended below all things ([[D&C 122:8]]) and was lifted up. Pride tries to climb its own tower. Discipleship follows Him down in humility, and then up the mountain of the Lord’s house.

liken: |
  - Verse 6 describes a people “replenished” (full) of other things. What fills my life so completely that there’s little room left for the Lord?
  - The nations go up to the temple *to be taught*. Do I go to the temple expecting to learn something, or only to complete something?
  - Where am I tempted to trust “the work of [my] own hands” (verse 8)? What would it look like to “cease from man” (verse 22) in that area?
  - Isaiah’s picture of swords turned into plowshares begins in individual hearts. Is there a conflict in my life, in my family, ward, or workplace, where I could beat a sword into something useful?

explore: |
  - **Isaiah 2 and Micah 4.** Compare [[Isa. 2:2–4]] and [[Micah 4:1–5]]. What does Micah add? Why might two prophets record the same prophecy?
  - **Nephi’s version.** Read [[2 Ne. 12]] side by side with this chapter, paying attention to verses 5, 9, 10–12, 16, and 21. Several of Nephi’s differences make the chapter clearer.
  - **The whole unit.** Read chapters 2–4 in one sitting. Notice how the glorious Zion of 2:2–4 reappears, transformed, in 4:2–6, and what has to happen in between.

parallels:
  - ref: 2 Ne. 12
    note: Nephi quotes the entire chapter, with several significant differences.
    primary: true
  - ref: Micah 4:1–3
    note: A nearly identical prophecy of the mountain of the Lord’s house.
  - ref: Rev. 6:15–16
    note: John echoes the proud hiding in the rocks.

sources: [mcconkie-keys, isaiah-in-bom, parry-understanding, ball-winn, ludlow]
