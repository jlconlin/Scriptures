chapter: 56
title: A House of Prayer for All People
tagline: The foreigner and the eunuch, both shut out by the old rules, are promised a place in the Lord’s house and a name that will never be cut off, while Israel’s own watchmen sleep.
when: 'Setting: the community restored to Judah, late sixth century BC; quoted by Jesus in the temple, AD 30'

setting: |
  Chapter 56 opens the last division of Isaiah. Chapters 40–55 spoke to exiles in Babylon; chapters 56–66 seem to speak to people who are back in the land. There is a temple, or one is expected (verses 5–7), and the problems are no longer captivity and despair but who belongs to the community, how its leaders behave, and why the glorious promises of chapters 40–55 have been so slow to arrive. Critical scholarship has assigned these chapters to a later writer in Jerusalem, called “Third Isaiah” (*Tritojesaia*); Latter-day Saint readers, and others who read the book as a unity, see Isaiah’s view reaching past the return. See [How to Read Isaiah](/isaiah/guides/how-to-read-isaiah/). Either way, the setting is the restored community, and reading the chapters that way helps.

  The division is framed with care. It opens (56:1–8) and closes (66:18–24) with foreigners gathered to the Lord’s holy mountain. Laments and warnings stand inside that frame (chapters 57–59 and 63–66), and chapters 60–62, Zion’s glory and the anointed messenger of 61:1–3, stand at the center.

  The Book of Mormon does not quote chapters 56–66, but latter-day revelation draws on them heavily, and so did Jesus. He quoted verse 7 when He cleared the temple ([[Mark 11:17]]).

thread: |
  Isaiah 56 asks **who belongs to the Lord’s people**, and answers with a surprise.

  The chapter begins with an ordinary call to keep justice and the Sabbath (verses 1–2). Then it turns to two people who had every reason to think the call was not for them. The foreigner fears the Lord has “utterly separated” him from His people. The eunuch calls himself “a dry tree,” a man with no children and no future (verse 3). The law of Moses had excluded both from the assembly. The Lord now reverses that. The eunuch who keeps the covenant receives a monument in the temple and a name better than sons and daughters; the foreigner who keeps it brings offerings to the altar, because “mine house shall be called an house of prayer for all people” (verses 4–7). And the gathering is not finished: “Yet will I gather others” (verse 8).

  The second half shows the other side of the same truth. If outsiders can belong by keeping the covenant, insiders can lose their place by neglecting it. Israel’s watchmen are blind, its guard dogs cannot bark, and its shepherds are drinking (verses 9–12). The boundary of the Lord’s people is drawn by faithfulness, not by birth.

sections:
  - range: 1-2
    heading: Keep justice, for salvation is near
    plain: |
      This is what the Lord says: Do what is just and right, because My salvation is about to come and My righteousness is about to be revealed. Blessed is the person who does this and holds firmly to it, who keeps the Sabbath without profaning it and keeps his hand from doing evil.
  - range: 3-8
    heading: The foreigner and the eunuch
    plain: |
      The foreigner who has joined himself to the Lord should not say, “The Lord will surely separate me from His people.” And the eunuch should not say, “I am only a dried-up tree.” For this is what the Lord says: To the eunuchs who keep My Sabbaths, choose what pleases Me, and hold firmly to My covenant, I will give, in My house and within My walls, a monument and a name better than sons and daughters. I will give them an everlasting name that will never be cut off. And the foreigners who join themselves to the Lord to serve Him, to love His name, and to be His servants, all who keep the Sabbath without profaning it and hold firmly to My covenant, I will bring to My holy mountain and give them joy in My house of prayer. Their offerings and sacrifices will be accepted on My altar, for My house will be called a house of prayer for all peoples. The Lord God, who gathers the outcasts of Israel, says: I will gather still others to them, besides those already gathered.
  - range: 9-12
    heading: Blind watchmen
    plain: |
      Come, all you wild animals, come and devour, all you beasts of the forest! Israel’s watchmen are blind; none of them know anything. They are all mute dogs that cannot bark. They lie around dreaming and love to sleep. They are greedy dogs that never have enough. They are shepherds who understand nothing. Each goes his own way, each out for his own gain. “Come,” they say, “let me get the wine, and we’ll fill up on strong drink. Tomorrow will be like today, only better!”

notes:
  - ref: 1
    phrase: 'Keep ye judgment, and do justice: for my salvation is near to come, and my righteousness to be revealed'
    kind: words
    title: Two kinds of righteousness
    body: |
      The first verse of the new division uses one Hebrew word in two senses, and the difference sums up the move from chapters 40–55 to 56–66. “Do justice” is literally “do righteousness” (*ʿăśû ṣədāqâ*). “My righteousness” is the same word, *ṣidqātî*.

      In chapters 40–55, God’s *ṣədāqâ* nearly always meant His saving action: His faithfulness in keeping His promises by rescuing His people. “I bring near my righteousness… and my salvation shall not tarry” ([[Isa. 46:13]]; compare [[Isa. 51:5–8]]). There, righteousness was something God did, and the people received it.

      Here the people are asked to do righteousness too, and the reason given is that God’s is about to be revealed. Grace comes first, and the conduct follows from it. The rest of chapters 56–66 keeps both senses in view, and much of their tension comes from the gap between them. God’s salvation seems slow (see [[Isa. 59:9–11]]), and the prophet traces the delay to the people’s failure to “do righteousness” ([[Isa. 59:1–2]]).
    sources: [bdb, delitzsch]
  - ref: 3
    phrase: The LORD hath utterly separated me from his people
    kind: history
    title: Shut out by the law
    body: |
      The foreigner and the eunuch had specific reasons to fear. The law of Moses barred certain people from “the congregation of the LORD”: men who had been physically mutilated, which included eunuchs, and Ammonites and Moabites “even to their tenth generation” ([[Deut. 23:1–3]]). When the exiles returned, their leaders applied those laws strictly. Nehemiah read that “the Ammonite and the Moabite should not come into the congregation of God for ever,” and the people “separated from Israel all the mixed multitude” ([[Neh. 13:1–3]]; compare [[Ezra 9:1–2]]). The Hebrew verb for “separated” in Nehemiah (*bādal*) is the same one the foreigner uses here.

      Isaiah 56 does not say the law was wrong. It says what now counts: keeping the Sabbath (on why the Sabbath mattered so much to these people, see the note on [[Isa. 58:13]]), choosing what pleases the Lord, and taking hold of His covenant. The tension with Deuteronomy 23 is plain. Whether the chapter is also answering Ezra and Nehemiah is debated: some scholars see a direct argument with their policy, while others point out that Ezra and Nehemiah never mention eunuchs or foreigners serving in the temple, which are this chapter’s concerns. The chapter names no one. The Bible itself holds both voices. The book of Ruth, whose heroine was a Moabite who said “thy people shall be my people, and thy God my God” ([[Ruth 1:16]]), ends by making her the great-grandmother of David.

      There is a quiet wordplay in the foreigner’s description. He has “joined himself” (*nilwâ*) to the Lord, the verb from which Leah named her son Levi: “Now this time will my husband be joined unto me” ([[Gen. 29:34]]). Verse 6 also calls such people the Lord’s “servants,” plural. From [[Isa. 54:17]] on, Isaiah speaks of “servants” where chapters 41–53 spoke of a servant (see [From servant to servants](/isaiah/themes/servant-songs/#servants)), and here foreigners are counted among them. At the very end of the book, the Lord says of the gathered nations, “I will also take of them for priests and for Levites” ([[Isa. 66:21]]).
    sources: [southwood-foreigner, mt-sefaria, bdb, bd-eunuch]
  - ref: 5
    phrase: a place and a name better than of sons and of daughters
    kind: words
    title: Yad vashem
    body: |
      In ancient Israel, a man lived on through his children, who carried his name. The eunuch had no hope of that; he was, in his own words, “a dry tree.” Absalom felt the same fear: “I have no son to keep my name in remembrance,” he said, and set up a stone pillar that was still called “Absalom’s place” in the narrator’s day ([[2 Sam. 18:18]]).

      “Place” in both verses is the Hebrew *yād*, literally “hand,” used for a monument. The Lord promises the eunuch *yād wāšēm*, “a monument and a name,” not out by the roadside but “in mine house and within my walls,” in the temple itself.

      The promise had a sharp edge for Isaiah’s readers. Isaiah had told Hezekiah that some of his descendants would “be eunuchs in the palace of the king of Babylon” ([[Isa. 39:7]]). Some of the exiles who returned may have been exactly the men this verse addresses: loyal Israelites made eunuchs in a foreign court, now wondering whether they still belonged.

      The pattern continued. The first Gentile convert in the book of Acts was a eunuch, a court official of Ethiopia who had gone to Jerusalem to worship and was reading Isaiah in his chariot. Philip found him reading chapter 53, preached Jesus from it, and baptized him ([[Acts 8:27–38]]). Three chapters later, in the scroll he was holding, was this promise.
    sources: [bdb, mt-sefaria, southwood-foreigner]
  - ref: 5
    phrase: I will give them an everlasting name, that shall not be cut off
    kind: words
    title: A name that is not cut off
    body: |
      “Cut off” (*kārat*) is the language of the covenant curse, the fate of the person removed from the people ([[Gen. 17:14]]). The eunuch expected exactly that: his line would end and his name would vanish. The Lord promises the opposite, and promises something “better than of sons and of daughters.”

      Many Latter-day Saints feel the eunuch’s fear in a modern form: the unmarried, the childless, those whose family circumstances don’t match the ideal they were taught. This verse speaks to them directly. It does not deny the value of children; it promises that faithfulness to the covenant gives a place in the Lord’s house and a name He Himself guarantees. The Savior promises a “new name” to those who overcome ([[Rev. 2:17]]), and latter-day revelation speaks of a “white stone” given with a new name to each who enters the celestial kingdom ([[D&C 130:10–11]]).
    sources: [bdb, mt-sefaria]
  - ref: 7
    phrase: for mine house shall be called an house of prayer for all people
    kind: christ
    title: A den of thieves
    body: |
      Solomon had prayed at the dedication of the first temple for “a stranger, that is not of thy people Israel,” who would come from far away to pray there, “that all people of the earth may know thy name” ([[1 Kgs. 8:41–43]]). Isaiah 56 says that prayer will be answered.

      Jesus quoted this verse when He drove the traders out of the temple: “Is it not written, My house shall be called of all nations the house of prayer? but ye have made it a den of thieves” ([[Mark 11:17]]). The second half comes from Jeremiah’s temple sermon ([[Jer. 7:11]]). Only Mark keeps the words “of all nations” ([[Matt. 21:13]]; [[Luke 19:46]]). They were the point of Isaiah’s verse, and in Mark they are the point of Jesus’ act. Jesus was not only cleansing the temple of commerce; He was clearing space for the foreigner.

      When the Lord commanded the Saints to build a temple in Kirtland, He began its description with Isaiah’s phrase: “establish a house, even a house of prayer, a house of fasting, a house of faith” ([[D&C 88:119]]).
  - ref: 8
    phrase: Yet will I gather others to him, beside those that are gathered unto him
    kind: scripture
    title: Other sheep
    body: |
      The Lord is “the Lord GOD, which gathereth the outcasts of Israel,” a title that echoes [[Isa. 11:12]]: “he shall… assemble the outcasts of Israel, and gather together the dispersed of Judah.” But He is not finished when Israel’s outcasts come home. “Yet will I gather others.” The gathering has no fixed boundary.

      Jesus used the same idea when He described Himself as the good shepherd: “other sheep I have, which are not of this fold: them also I must bring, and they shall hear my voice; and there shall be one fold, and one shepherd” ([[John 10:16]]). The Book of Mormon adds that the Jews in Jerusalem took Him to mean the Gentiles, and that He meant, at least in part, the Nephites: “ye are they of whom I said: Other sheep I have which are not of this fold” ([[3 Ne. 15:21]]). He then told them He had still “other sheep, which are not of this land, neither of the land of Jerusalem” ([[3 Ne. 16:1]]).

      Verse 8 is the Old Testament form of that open-ended promise, and it describes the latter-day gathering as the Restoration understands it: the scattered remnants of Israel and those adopted into the covenant gathered by the same shepherd.
  - ref: 10
    phrase: 'His watchmen are blind: they are all ignorant, they are all dumb dogs, they cannot bark'
    kind: symbol
    title: Dogs that cannot bark
    body: |
      The chapter turns abruptly. The foreigner and the eunuch have been welcomed; now the wild animals are invited in to devour the flock, because nobody is guarding it.

      In chapter 52 Zion’s watchmen lifted up their voices and sang when they saw the Lord return ([[Isa. 52:8]]). These are their opposite. A watchman’s whole job was to see danger coming and give warning. Ezekiel was told that if the watchman “see the sword come, and blow not the trumpet,” the blood of the people would be on him ([[Ezek. 33:6]]). Isaiah’s watchmen are blind, and to make it worse he calls them guard dogs that cannot bark: they are asleep, dreaming, and greedy. Ezekiel used the same accusation against Israel’s shepherds: “Woe be to the shepherds of Israel that do feed themselves!” ([[Ezek. 34:2]]).

      Their slogan in verse 12 is the most dangerous line: “to morrow shall be as this day, and much more abundant.” It is complacency, the confidence that nothing will change and no reckoning is coming. Nephi saw the same attitude in the latter days, when people would be lulled “into carnal security, that they will say: All is well in Zion; yea, Zion prospereth, all is well” ([[2 Ne. 28:21]]). In the Lord’s parable of the redemption of Zion, the servants who failed to build a tower and set a watchman on it asked, “What need hath my lord of this tower, seeing this is a time of peace?” ([[D&C 101:48]]).

      Isaiah does not leave the watchmen asleep. In chapter 62 the Lord sets new watchmen on Jerusalem’s walls, “which shall never hold their peace day nor night” ([[Isa. 62:6]]).
    sources: [bdb, delitzsch]

christ: |
  Jesus made this chapter His own when He stood in the temple’s outer court and quoted verse 7. His ministry enacted the rest of it: He touched lepers, ate with outcasts, commended the faith of a Roman centurion and a Canaanite woman, and promised “other sheep” who would hear His voice ([[John 10:16]]). The first person baptized in Acts from outside Israel was a eunuch reading Isaiah ([[Acts 8:27–38]]). And He is the Good Shepherd whom the blind watchmen and greedy shepherds of verses 10–11 fail to be. What gives a person a place in His house is not birth or condition but taking hold of His covenant.

explore: |
  - **The excluded welcomed.** Read [[Deut. 23:1–8]] and [[Neh. 13:1–3]], then [[Isa. 56:3–8]], then [[Acts 8:26–39]].
  - **A house of prayer.** Compare [[1 Kgs. 8:41–43]], [[Isa. 56:7]], [[Mark 11:15–17]], and [[D&C 88:119]].
  - **Other sheep.** Read [[John 10:14–16]] with [[3 Ne. 15:11–16:5]].
  - **Watchmen.** Read [[Ezek. 33:1–9]], [[Isa. 62:6–7]], and the parable in [[D&C 101:43–62]].

parallels:
  - ref: Mark 11:17
    note: Jesus quotes verse 7, with “of all nations,” when He clears the temple (compare Matt. 21:13; Luke 19:46).
  - ref: John 10:16
    note: “Other sheep I have”; compare verse 8.
  - ref: 3 Ne. 15:21
    note: The risen Savior identifies the Nephites as the “other sheep.”
  - ref: Acts 8:27–38
    note: An Ethiopian eunuch reading Isaiah is baptized.

