chapter: 48
title: Refined in the Furnace of Affliction
tagline: The Lord confronts a stubborn Israel who wear His name without trusting Him, explains why He told them the future in advance, and sends them singing out of Babylon.
when: 'Addressed to the exiles on the eve of release from Babylon; read by Nephi to his family from the brass plates in the early sixth century BC'

setting: |
  Isaiah 48 closes the first great movement of chapters 40–66. Chapters 40–48 have been about the Lord’s power over history: He alone foretells the future, He has raised up Cyrus to conquer Babylon, and the idols can do nothing. After this chapter Cyrus and Babylon disappear from the book, and the focus shifts to the mysterious servant of the Lord and to the restoration of Zion (chapters 49–57). Chapter 48 is a summing-up, and its tone is surprising. The earlier chapters mostly comforted Israel. This one scolds them.

  For Latter-day Saints the chapter has a second setting. It is the first long passage of Isaiah in the Book of Mormon. Nephi read it, with chapter 49, to his brothers from the brass plates, “that I might more fully persuade them to believe in the Lord their Redeemer” ([[1 Ne. 19:23]]), and it appears as [[1 Ne. 20]]. The Book of Mormon text differs from the King James text in almost every verse. Some of the differences are small matters of wording. Others change the sense, and several are discussed in the notes below.

  That setting also sharpens the dating question discussed in the introduction to chapter 40. Most modern scholars date chapters 40–55 to the years just before Babylon fell in 539 BC. The Book of Mormon places this very chapter on the brass plates, taken from Jerusalem around 600 BC. Readers who accept the Book of Mormon as history have to hold these two claims together, and this chapter, with its insistence that God announced events “before it came to pass” (verse 5), is exactly where the question matters most.

thread: |
  Isaiah 48 asks **why God keeps faith with a people who don’t keep faith with Him**, and its answer is: for His own name’s sake.

  The chapter opens with an indictment. Israel swears by the Lord’s name and calls itself the people of the holy city, “but not in truth, nor in righteousness” (verses 1–2). They are obstinate, with a neck of iron and a forehead of brass (verse 4). The Lord knew this, and it shaped how He revealed Himself. He announced the “former things” long in advance so that Israel couldn’t credit an idol when they happened (verses 3–5). Now He announces “new things,” never heard before, so that Israel can’t shrug and say, “I knew them” (verses 6–8). Prophecy, in this chapter, is a strategy for reaching a hard-hearted people.

  Why not simply give up on them? “For my name’s sake will I defer mine anger” (verse 9). The Lord has tied His reputation to Israel. If He abandoned them, the nations would conclude that Babylon’s gods had won. So instead of cutting Israel off, He puts them in the furnace to refine them (verse 10).

  The second half turns from rebuke to appeal. The God who founded the earth and called Cyrus (verses 12–16) speaks as Israel’s teacher, and He grieves: “O that thou hadst hearkened to my commandments! then had thy peace been as a river” (verse 18). Then, despite everything, comes the command to leave Babylon, singing, in a new exodus with water from the rock (verses 20–21). The last line is a warning that marks the end of this part of the book: “There is no peace, saith the LORD, unto the wicked” (verse 22). The peace that could have flowed like a river is still on offer, but only to those who stop resisting it.

sections:
  - range: 1-2
    heading: A people who wear the name
    plain: |
      Listen to this, house of Jacob, you who are called by the name Israel and descended from Judah. You swear oaths by the name of the Lord and invoke the God of Israel, but not honestly or rightly. You call yourselves citizens of the holy city and claim to rely on the God of Israel, whose name is the Lord of hosts.
  - range: 3-8
    heading: Former things and new things
    plain: |
      Long ago I announced the former things. I spoke them and made them known, then suddenly I acted, and they happened. I did it this way because I knew how stubborn you are: your neck is an iron tendon and your forehead is bronze. So I told you ahead of time, before it happened, so that you couldn’t say, “My idol did this; my carved and cast images ordained it.” You have heard it all; now look at it. Won’t you admit it? From now on I am telling you new things, hidden things you haven’t known. They are being created now, not long ago. Before today you never heard of them, so you can’t say, “I already knew that.” You didn’t hear, you didn’t know, your ear was closed from the start. I knew you would be treacherous; you have been called a rebel since birth.
  - range: 9-11
    heading: For My name’s sake
    plain: |
      For the sake of My name I hold back My anger; for the sake of My praise I restrain it for you, so that I don’t cut you off. Look, I have refined you, though not as silver is refined. I have tested you in the furnace of affliction. For My own sake, My own sake, I act. How could I let My name be profaned? I will not give My glory to anyone else.
  - range: 12-16
    heading: The first and the last calls Cyrus
    plain: |
      Listen to Me, Jacob, Israel whom I called. I am He. I am the first, and I am the last. My hand laid the foundations of the earth, and My right hand spread out the heavens. When I summon them, they stand up together. Gather, all of you, and listen. Which of the idols foretold these things? The Lord loves the one He has chosen; he will carry out the Lord’s purpose against Babylon, and his arm will fall on the Chaldeans. I, I Myself, have spoken. I have called him; I have brought him, and he will succeed. Come close to Me and hear this. From the beginning I have not spoken in secret. From the time it began, I have been there. And now the Lord God has sent me, with His Spirit.
  - range: 17-19
    heading: If only you had listened
    plain: |
      This is what the Lord says, your Redeemer, the Holy One of Israel: I am the Lord your God, who teaches you what is good for you, who leads you in the way you should go. If only you had paid attention to My commandments! Your peace would have been like a river, and your righteousness like the waves of the sea. Your descendants would have been as many as the sand, your children as countless as its grains. Their name would never have been cut off or wiped out from before Me.
  - range: 20-22
    heading: Out of Babylon, singing
    plain: |
      Leave Babylon! Run from the Chaldeans! Announce it with shouts of joy, proclaim it, send it out to the ends of the earth. Say, “The Lord has redeemed His servant Jacob.” They were not thirsty when He led them through the deserts. He made water flow from the rock for them; He split the rock, and water gushed out. But there is no peace, says the Lord, for the wicked.

notes:
  - ref: 1
    phrase: are come forth out of the waters of Judah
    kind: bom
    title: The waters of Judah, and the waters of baptism
    body: |
      The Hebrew reads *mimmê yĕhûdâ*, “from the waters of Judah,” an unusual expression for descent from an ancestor. It may be a poetic image of a family line as a stream flowing from its source. Many scholars instead suspect a one-letter slip for *mimmĕʿê yĕhûdâ*, “from the loins (literally, the inward parts) of Judah,” the idiom used for offspring in verse 19 (“the offspring of thy bowels”). The New Revised Standard Version adopts that emendation. Either way, the phrase is about pedigree: these people are the genuine descendants of Judah.

      The current Book of Mormon reads, “are come forth out of the waters of Judah, **or out of the waters of baptism**” ([[1 Ne. 20:1]]). This phrase is not in the 1830 or 1837 editions. Joseph Smith added it in the 1840 edition, which he revised. It is best understood not as a restored ancient reading but as a prophetic gloss, an inspired commentary written into the text, applying Isaiah’s words to covenant Israel in the latter days. (Joseph also added clarifying words elsewhere, for example in [[1 Ne. 11:18]] and [[1 Ne. 11:21]].)

      The gloss fits the verse closely. Isaiah’s complaint is that these people have the right birth and the right words, and they “swear by the name of the LORD,” but “not in truth, nor in righteousness.” Latter-day Saints enter the covenant through the waters of baptism and take the Lord’s name upon them ([[D&C 20:37]]). The warning transfers directly: a covenant name without covenant living is exactly what Isaiah condemns.
    sources: [isaiah-in-bom, paul-40-66, blenkinsopp]
  - ref: 2
    phrase: and stay themselves upon the God of Israel
    kind: words
    title: Leaning on God, or claiming to
    body: |
      “Stay themselves upon” (*nismākû ʿal*) means “lean on” or “rely on.” It is the same verb used of trusting God in [[Isa. 26:3]] (“whose mind is stayed on thee”) and of leaning a hand on a sacrifice ([[Lev. 1:4]]). In the Hebrew, verse 2 continues the description of verse 1 without an explicit negative, so it has to be read with irony: they *claim* to rely on the God of Israel.

      The Book of Mormon removes the ambiguity: “Nevertheless, they call themselves of the holy city, **but they do not stay themselves** upon the God of Israel” ([[1 Ne. 20:2]]). The irony becomes a direct accusation. This is one of the clearest cases in [[1 Ne. 20]] where the Book of Mormon makes explicit what the Hebrew leaves implicit. Whether it reflects an older text or an interpretive clarification can’t be settled from manuscripts, since no ancient witness has the negative, but it states the verse’s meaning accurately.

      The two claims in the verse, citizenship in the holy city and reliance on God, are the security blanket Jeremiah attacked in the same generation: “Trust ye not in lying words, saying, The temple of the LORD, The temple of the LORD” ([[Jer. 7:4]]).
    sources: [isaiah-in-bom, oswalt]
  - ref: 4
    phrase: thy neck is an iron sinew, and thy brow brass
    kind: symbol
    title: A neck of iron and a forehead of bronze
    body: |
      Two images of stubbornness. The neck is the part of an ox that bears the yoke; an ox that stiffens its neck refuses to be led. That is the background of the Lord’s repeated description of Israel in the wilderness: “it is a stiffnecked people” ([[Ex. 32:9]]). Here the neck isn’t just stiff; its tendon is iron. A forehead of bronze (“brass” in the King James, which uses the word for any copper alloy) is a face that can’t blush, the brazenness Ezekiel described when he said “all the house of Israel are impudent and hardhearted” ([[Ezek. 3:7]]).

      It is worth noticing whom Nephi was reading this to. He had spent years with brothers who were, in his own words, “swift to do iniquity but slow to remember the Lord” ([[1 Ne. 17:45]]). He chose a chapter in which the Lord openly calls His people obstinate, and then keeps working with them anyway. Nephi said he read Isaiah “that I might more fully persuade them to believe in the Lord their Redeemer” ([[1 Ne. 19:23]]). The chapter models the patience Nephi needed: God is not naive about human stubbornness, and He doesn’t let it end the relationship.
  - ref: 6
    phrase: I have shewed thee new things from this time, even hidden things, and thou didst not know them
    kind: words
    title: Why God tells the future
    body: |
      Chapters 40–48 repeatedly contrast the “former things” and the “new things” ([[Isa. 41:22]]; [[Isa. 42:9]]; [[Isa. 43:18–19]]; [[Isa. 46:9–10]]). Verses 3–8 explain the logic behind the contrast, and it is psychologically sharp. The Lord announced the former things long in advance, so that when they happened Israel could not say, “Mine idol hath done them” (verse 5). Now He reveals new things suddenly, things “created now, and not from the beginning,” so that Israel cannot say, “Behold, I knew them” (verse 7). Old prophecy defeats idolatry. New revelation defeats complacency.

      What exactly are the former and new things? Scholars disagree. Many critical scholars (Westermann, Blenkinsopp) take the former things to be Cyrus’s early conquests, already under way, and the new things to be the coming fall of Babylon and release of the exiles. Traditional interpreters (Oswalt, for example) take the former things to be earlier prophecies fulfilled in Israel’s history, and the new things to include the whole coming work of redemption. The text doesn’t force a choice; its argument works either way.

      Latter-day Saints will hear an echo of their own claim to continuing revelation. The Lord tells Nephi’s latter-day readers, “because that I have spoken one word ye need not suppose that I cannot speak another; for my work is not yet finished” ([[2 Ne. 29:9]]). Isaiah’s point applies to religious people in every age: it is possible to know the old revelations so well that new ones sound impossible.
    sources: [westermann, blenkinsopp, oswalt]
  - ref: 9
    phrase: For my name’s sake will I defer mine anger
    kind: words
    title: For His name’s sake
    body: |
      Verses 9 and 11 give the only reason for mercy the chapter offers, and it isn’t Israel’s merit. It is the Lord’s own name: “for mine own sake, even for mine own sake, will I do it: for how should my name be polluted?” In Hebrew thought a name is more than a label. It is reputation and presence. The nations know the Lord through what happens to His people, so if Israel perished in exile, His name would be “profaned” among them, and the world would conclude that Babylon’s gods were stronger.

      Moses used the same argument when he pleaded for Israel after the golden calf: “Wherefore should the Egyptians speak, and say, For mischief did he bring them out?” ([[Ex. 32:12]]). Ezekiel, a contemporary of the exile, made it the explicit basis of restoration: “I do not this for your sakes, O house of Israel, but for mine holy name’s sake” ([[Ezek. 36:22]]).

      This can sound cold, as if God cares about His image more than His people. But the effect is the opposite. Because His faithfulness rests on His own character and not on Israel’s performance, it can’t be exhausted by Israel’s failures. “I will not give my glory unto another” (verse 11) is, in context, a promise: He will not let another god claim His people.
    sources: [paul-40-66, childs]
  - ref: 10
    phrase: Behold, I have refined thee, but not with silver; I have chosen thee in the furnace of affliction
    kind: words
    title: Chosen, or tested, in the furnace
    body: |
      This verse has an interesting textual history, and three witnesses read it three ways.

      - **The Masoretic Text** (the standard medieval Hebrew text behind the King James Version) reads *bĕḥartîkā*, “I have chosen thee.”
      - **The Great Isaiah Scroll** from Qumran (1QIsaᵃ, copied around 125 BC) reads *bḥntykh*, “I have tested thee.” The two words differ by a single letter (*r* versus *n*), which look similar in some Hebrew scripts. “Tested” fits the metallurgical image of refining, and several modern translations adopt it (the New Revised Standard Version reads “I have tested you in the furnace of adversity”).
      - **The Book of Mormon** keeps “chosen” but omits the puzzling phrase “but not with silver”: “For, behold, I have refined thee, I have chosen thee in the furnace of affliction” ([[1 Ne. 20:10]]).

      “But not with silver” is obscure in Hebrew too (*wĕlōʾ bĕkesep*). It may mean that Israel was refined but, unlike silver, yielded no pure metal, or that the Lord didn’t refine them as intensely as silver requires, lest they be consumed. Neither reading is certain.

      The “furnace” recalls Egypt, which Deuteronomy calls “the iron furnace” out of which the Lord took Israel ([[Deut. 4:20]]). Exile is Egypt again, and Babylon is another furnace. Both the Masoretic and the Qumran readings say something true. Affliction is where the Lord tests His people, and it is also, surprisingly, where He chooses them. Malachi pictures the Lord who “shall sit as a refiner and purifier of silver” ([[Mal. 3:3]]), and the Lord told Joseph Smith in Liberty Jail that “all these things shall give thee experience, and shall be for thy good” ([[D&C 122:7]]).
    sources: [great-isaiah-scroll, dss-bible, tov-textual, paul-40-66]
  - ref: 12
    phrase: I am he; I am the first, I also am the last
    kind: christ
    title: '“I am he”'
    body: |
      “I am he” translates two short Hebrew words, *ʾănî hûʾ*, which recur throughout these chapters as a solemn self-declaration of the Lord ([[Isa. 41:4]]; [[Isa. 43:10]], [[Isa. 43:13]], [[Isa. 43:25]]; [[Isa. 46:4]]). The Greek Septuagint regularly renders it *egō eimi*, “I am.” When Jesus says in John’s Gospel, “if ye believe not that I am he, ye shall die in your sins” ([[John 8:24]]), the Greek is *egō eimi*, and many scholars hear a deliberate echo of Isaiah’s divine formula. That connection is widely accepted in New Testament scholarship, though how much Christological weight it carries is debated.

      “I am the first, I also am the last” is claimed by the risen Christ in Revelation: “I am Alpha and Omega, the beginning and the end, the first and the last” ([[Rev. 22:13]]). In the Kirtland Temple He introduced Himself the same way: “I am the first and the last; I am he who liveth, I am he who was slain” ([[D&C 110:4]]). For Latter-day Saints this is not an echo but an identification: the Lord who speaks in Isaiah 48 is Jehovah, the premortal Christ.
    sources: [bauckham-jesus-god, paul-40-66]
  - ref: 14
    phrase: 'The LORD hath loved him: he will do his pleasure on Babylon'
    kind: history
    title: The one the Lord loves
    body: |
      “Him” is Cyrus, named in [[Isa. 44:28]] and [[Isa. 45:1]]. It is striking that the Lord says He “loved” a foreign king who did not know Him ([[Isa. 45:4]]). The Hebrew may also be read, “the one whom the LORD loves will do His pleasure on Babylon.” Either way, Cyrus is not a free agent; he carries out the Lord’s purpose.

      Cyrus told a different story. The **Cyrus Cylinder**, the clay proclamation he issued after taking Babylon in 539 BC, says that Marduk, Babylon’s own god, searched the lands for a righteous king, called Cyrus by name, and made him march on Babylon, going at his side like a friend. Cyrus claimed to be the chosen of Babylon’s god. Isaiah claims he is the instrument of Israel’s God. The competing claims are exactly the contest these chapters stage: which god actually directs history?

      The Book of Mormon adds a line: “The Lord hath loved him; yea, and **he will fulfil his word which he hath declared by them**” ([[1 Ne. 20:14]]). The addition puts the emphasis back on prophecy: what the Lord declared through His messengers, He fulfills.
    sources: [cyrus-cylinder, anet, bd-cyrus]
  - ref: 16
    phrase: and now the Lord GOD, and his Spirit, hath sent me
    kind: christ
    title: Who is speaking?
    body: |
      This line is abrupt. For fifteen verses the Lord has been speaking in the first person. Now someone says the Lord God “hath sent me.” Who?

      Interpreters give several answers:

      - **The prophet himself.** Many critical scholars (Westermann, Blenkinsopp) think the prophet briefly steps forward, perhaps in a later editorial addition, to claim that his message is authorized.
      - **The servant.** Others see the servant of the Lord, who speaks in the first person in the very next chapter ([[Isa. 49:1–6]]), anticipating his entrance.
      - **The Messiah.** Christian interpreters since the church fathers have read the line as the Son speaking of being sent by the Father and the Spirit.

      The Hebrew adds its own ambiguity: “his Spirit” can be the second subject (“the Lord God and His Spirit have sent me”) or a second object (“the Lord God has sent me, and His Spirit”). The King James translators chose the first.

      The Book of Mormon rephrases the previous clause, but keeps the line: “from the beginning, from the time that it was declared have I spoken; and the Lord God, and his Spirit, hath sent me” ([[1 Ne. 20:16]]). A Latter-day Saint reading notices that the same voice has just said “I am the first, I also am the last” (verse 12) and “from the time that it was, there am I” (verse 16). If that speaker is Jehovah, the premortal Christ, then He here speaks of being sent by the Father, with the Spirit, which fits the Latter-day Saint understanding of three distinct members of the Godhead. That is a plausible reading, not the only one the text allows, and it should be offered as such.
    sources: [westermann, blenkinsopp, oswalt, childs]
  - ref: 18
    phrase: O that thou hadst hearkened to my commandments! then had thy peace been as a river, and thy righteousness as the waves of the sea
    kind: symbol
    title: Peace like a river
    body: |
      This is one of the most tender lines in Isaiah, and it is a lament. The Lord speaks less like a judge than like a grieving parent: “O that thou hadst hearkened.” He said the same thing through Moses: “O that there were such an heart in them, that they would fear me, and keep all my commandments always” ([[Deut. 5:29]]). And Jesus, weeping over Jerusalem, said, “how often would I have gathered thy children together… and ye would not!” ([[Matt. 23:37]]).

      In a dry land, the image is precise. Most streams in Israel are wadis that flow only in the rainy season. A river (*nāhār*) is permanent. Waves never stop coming. Peace (*šālôm*, wholeness and well-being) and righteousness would have been constant, not seasonal.

      Nephi would have heard an echo of his own family. When Lehi camped in the wilderness beside a river that emptied into the Red Sea, he said to Laman, “O that thou mightest be like unto this river, continually running into the fountain of all righteousness!” ([[1 Ne. 2:9]]). Father and prophet used the same image and the same wistful “O that.”

      The verse also implies something about commandments. The Lord describes Himself in verse 17 as the one “which teacheth thee to profit.” His commandments are not arbitrary tests. They are the channel that peace would have flowed through.
    sources: [sc-knowhy-5]
  - ref: 20
    phrase: Go ye forth of Babylon, flee ye from the Chaldeans, with a voice of singing declare ye
    kind: structure
    title: The new exodus
    body: |
      This is the climax of chapters 40–48: the command to leave. Everything in these chapters, the comfort, the idol satires, the calling of Cyrus, has been leading here. The first exodus left Egypt in haste and fear; this one is announced “with a voice of singing,” and its news is to reach “the end of the earth.” Later Isaiah will add that this time Israel “shall not go out with haste, nor go by flight” ([[Isa. 52:12]]).

      The command became a refrain in later scripture. Jeremiah: “Flee out of the midst of Babylon” ([[Jer. 51:6]]). Revelation: “Come out of her, my people, that ye be not partakers of her sins” ([[Rev. 18:4]]). In the Restoration, the Lord repeats it to His latter-day people: “Go ye out from Babylon. Be ye clean that bear the vessels of the Lord” ([[D&C 133:5]]), and “Go ye out from among the nations, even from Babylon, from the midst of wickedness, which is spiritual Babylon” ([[D&C 133:14]]).

      For Nephi and his family, the command wasn’t a metaphor. They had literally fled Jerusalem shortly before Babylon destroyed it. Nephi was reading the story of his own exodus.
  - ref: 21
    phrase: he caused the waters to flow out of the rock for them
    kind: christ
    title: Water from the rock
    body: |
      The return from Babylon is described in the language of the first exodus, when Moses struck the rock at Horeb and water came out ([[Ex. 17:6]]; [[Num. 20:11]]). The verbs are past tense, as if the journey were already over; this is the *prophetic perfect*, the Hebrew habit of describing a certain future event as though it has already happened.

      No surviving historical source describes miracles of water on the road back from Babylon, and most scholars read the verse as poetry that interprets the return as a second exodus. The theological point is continuity: the God who provided in the Sinai desert provides now.

      Paul reads the first exodus rock christologically: “they drank of that spiritual Rock that followed them: and that Rock was Christ” ([[1 Cor. 10:4]]). Nephi, in his own desert, rehearsed the same event to his brothers: “Moses… smote the rock, and there came forth water” ([[1 Ne. 17:29]]). The water from the rock is the Lord’s gift in the wilderness, in every wilderness.
  - ref: 22
    phrase: There is no peace, saith the LORD, unto the wicked
    kind: words
    title: A boundary marker
    body: |
      This short verse marks a structural division. Almost the same words close [[Isa. 57:21]] (“There is no peace, saith my God, to the wicked”), and chapter 66 ends with another warning about the fate of the wicked ([[Isa. 66:24]]). Many interpreters, going back to the nineteenth-century commentator Franz Delitzsch, have seen chapters 40–66 as three sections of nine chapters each (40–48, 49–57, 58–66), each closing with a warning to the wicked. The pattern is widely noticed, though scholars debate how intentional it is.

      The line also completes this chapter’s argument. Verse 18 said Israel’s peace could have been “as a river.” Now the chapter says where peace cannot flow. Alma put it memorably: “wickedness never was happiness” ([[Alma 41:10]]).

      The Book of Mormon adds a clause that ties the warning to the rescue just described: “**And notwithstanding he hath done all this, and greater also,** there is no peace, saith the Lord, unto the wicked” ([[1 Ne. 20:22]]). Deliverance from Babylon doesn’t guarantee peace. Even a people led out of bondage and given water from the rock can remain wicked, as the wilderness generation did, and as Nephi’s brothers did.
    sources: [oswalt, childs]

christ: |
  The speaker in this chapter calls Himself “the first” and “the last” (verse 12), “thy Redeemer, the Holy One of Israel” (verse 17), and the one who gave water from the rock (verse 21). The New Testament and latter-day revelation apply every one of these to Jesus Christ ([[Rev. 22:13]]; [[D&C 110:4]]; [[1 Cor. 10:4]]).

  The chapter also shows the character of that Redeemer. He is not deceived about His people. He calls them obstinate and treacherous “from the womb” (verse 8). Yet He defers His anger, refines instead of destroying, and grieves over what they have lost: “O that thou hadst hearkened.” That is the same Jesus who wept over Jerusalem ([[Luke 19:41–42]]) and who, in the Book of Mormon, stood among the survivors of destruction and said, “will ye not now return unto me… that I may heal you?” ([[3 Ne. 9:13]]).

explore: |
  - **Nephi’s use of Isaiah.** Read [[1 Ne. 19:22–24]], [[1 Ne. 20–21]], and Nephi’s explanation in [[1 Ne. 22]].
  - **Compare the texts.** Read [[Isa. 48]] and [[1 Ne. 20]] side by side, and mark every difference. Which ones change the meaning?
  - **For His name’s sake.** Read [[Ex. 32:11–14]], [[Num. 14:13–19]], and [[Ezek. 36:20–32]].
  - **Leaving Babylon.** Read [[Isa. 48:20–21]], [[Isa. 52:11–12]], [[Rev. 18:1–5]], and [[D&C 133:4–15]].
  - **The first and the last.** Trace the phrase from [[Isa. 41:4]] and [[Isa. 44:6]] to [[Rev. 1:17–18]] and [[D&C 110:4]].

parallels:
