chapter: 64
title: Oh That Thou Wouldest Rend the Heavens
tagline: 'The people’s lament reaches its climax: they beg the Lord to tear open the sky and come down as He did at Sinai, confess that even their righteous deeds are soiled, and plead as clay in the hands of their Father and potter.'
when: 'Setting: after the temple’s destruction in 586 BC and before its rebuilding in 515 BC; applied to the Second Coming in latter-day revelation, 1831'

setting: |
  Chapter 64 completes the lament that began at [[Isa. 63:7]]. (The chapter division falls in a slightly different place in the Hebrew Bible, where the English verse 1 is the last line of chapter 63, so Hebrew verse numbers in this chapter run one lower than the English.) The people have remembered the Lord’s kindness in the Exodus, confessed that they grieved His Spirit, and called Him Father. Now they ask Him to act.

  The situation is desperate. “Zion is a wilderness,” and the temple, “our holy and our beautiful house,” has been “burned up with fire” (verses 10–11). That describes Jerusalem between its destruction by the Babylonians in 586 BC ([[2 Kgs. 25:8–9]]) and the completion of the second temple in 515 BC ([[Ezra 6:15]]). For readers who take the chapter as Isaiah’s, it is a prophetic lament for a disaster he foresaw a century before it came.

  In the revelation of November 1831 that also quotes chapter 63, the Lord gives verses 1–5 as the prayer of His servants in the last days, and He answers it: the mountains will flow down at His presence when He comes ([[D&C 133:40–45]]).

thread: |
  Isaiah 64 is about **asking God to come down**, and about what the people discover when they ask.

  The chapter begins with a bold wish: “Oh that thou wouldest rend the heavens, that thou wouldest come down” (verse 1). They want another Sinai, a God who shows Himself so powerfully that mountains melt and nations tremble (verses 1–3). And they remember that He has done more than anyone has seen or heard for those who wait for Him (verse 4).

  But as they pray, they face themselves. If He came down, what would He find? “We are all as an unclean thing, and all our righteousnesses are as filthy rags” (verse 6). No one even calls on His name (verse 7). The prayer for His coming turns into a confession.

  So the people fall back on the only claim they have left, their relationship: “But now, O LORD, thou art our father; we are the clay, and thou our potter” (verse 8). They cannot make themselves clean, but they are His work. They end with a question that is also a plea: “wilt thou hold thy peace?” (verse 12). The next chapter is the Lord’s answer.

sections:
  - range: 1-4
    heading: Come down
    plain: |
      Oh, that You would tear open the heavens and come down, so that the mountains would quake at Your presence, as fire sets twigs ablaze and makes water boil, to make Your name known to Your enemies and make the nations tremble before You! When You did awesome things we did not expect, You came down, and the mountains quaked before You. Since ancient times no one has heard, no ear has perceived, no eye has seen any God besides You, who acts on behalf of those who wait for Him.
  - range: 5-7
    heading: We have sinned
    plain: |
      You come to help those who gladly do right, who remember You in Your ways. But You were angry, because we sinned; we have been in our sins a long time, and can we be saved? All of us have become like someone unclean, and all our righteous acts are like a polluted garment. We all wither like a leaf, and our sins carry us away like the wind. No one calls on Your name or stirs himself to take hold of You, for You have hidden Your face from us and handed us over to our sins.
  - range: 8-12
    heading: We are the clay
    plain: |
      But now, Lord, You are our Father. We are the clay, and You are our potter; we are all the work of Your hand. Do not be so very angry, Lord; do not remember our sins forever. Please look on us, for we are all Your people. Your holy cities have become a wilderness. Zion is a wilderness, Jerusalem a desolation. Our holy and beautiful temple, where our ancestors praised You, has been burned with fire, and all that we treasured lies in ruins. After all this, Lord, will You hold Yourself back? Will You keep silent and punish us beyond measure?

notes:
  - ref: 1
    phrase: Oh that thou wouldest rend the heavens, that thou wouldest come down
    kind: christ
    title: Tear open the heavens
    body: |
      “Rend” is *qāraʿ*, “to tear,” the verb used for tearing clothes in grief ([[2 Sam. 13:31]]). The people imagine the sky as a curtain between them and God, and they ask Him to rip it open and come through.

      Mark’s Gospel seems to answer the prayer. When Jesus came up out of the water at His baptism, Mark says He “saw the heavens opened” ([[Mark 1:10]]). Matthew and Luke use the ordinary Greek word for “opened,” but Mark’s word is *schizō*, “to tear.” The heavens were torn. Mark uses the same verb only once more, at the end of his Gospel, when Jesus dies: “the veil of the temple was rent in twain from the top to the bottom” ([[Mark 15:38]]). Many scholars think Mark chose the word with Isaiah 64 in mind. The Gospel opens and closes with a tearing, as God comes down and the way to His presence opens.

      Latter-day revelation places the prayer in the mouths of the Lord’s servants in the last days, “calling upon the name of the Lord day and night, saying: O that thou wouldst rend the heavens” ([[D&C 133:40]]). And it gives the answer immediately: “it shall be answered upon their heads; for the presence of the Lord shall be as the melting fire that burneth” ([[D&C 133:41]]). The prayer of Isaiah 64 will be answered at the Second Coming.
    sources: [bdb, oswalt]
  - ref: 3
    phrase: 'When thou didst terrible things which we looked not for, thou camest down, the mountains flowed down at thy presence'
    kind: restoration
    title: Mountains that flow
    body: |
      The people are remembering Sinai, when “the whole mount quaked greatly” and the Lord “descended upon it in fire” ([[Ex. 19:18]]). Deborah’s song used the same words: “The mountains melted from before the LORD, even that Sinai” ([[Judg. 5:5]]). “Flowed down” (*nāzōllû*) can be read either as “flowed,” the verb for running water, or as “quaked”; the King James translators kept the image of mountains running like liquid. The fire that makes water boil in verse 2 continues the picture. The Lord’s presence is so intense that solid rock runs like water.

      The people want the same event again: “Oh that thou wouldest… come down.” In verse 3 they remember it in the past tense: “thou camest down.”

      When the Lord quoted these verses in 1831, He changed the tenses. What Isaiah remembered, the revelation promises: “O Lord, thou shalt come down to make thy name known to thine adversaries… Yea, when thou comest down, and the mountains flow down at thy presence” ([[D&C 133:42–44]]). Sinai becomes a preview of the Second Coming. Other passages describe the same event: “the mountains shall be molten under him” ([[Micah 1:4]]); “every valley shall be exalted, and every mountain and hill shall be made low” ([[Isa. 40:4]]).
    sources: [bdb, oswalt]
  - ref: 4
    phrase: neither hath the eye seen, O God, beside thee, what he hath prepared for him that waiteth for him
    kind: restoration
    title: Eye hath not seen
    body: |
      The Hebrew is compact and a little uneven, but its point is that no one has ever seen or heard of any God besides the Lord who acts for those who wait for Him. Waiting (*ḥākâ*) is not passive. It is the hopeful waiting of [[Isa. 40:31]]: “they that wait upon the LORD shall renew their strength.”

      Paul quoted the verse loosely, apparently blending it with other phrases, to describe the wisdom God has revealed through His Spirit: “Eye hath not seen, nor ear heard, neither have entered into the heart of man, the things which God hath prepared for them that love him” ([[1 Cor. 2:9]]). In Paul’s use, the verse describes not a mighty act in history but the hidden things of God that the Spirit makes known.

      Latter-day scripture uses the verse both ways. The revelation that quotes chapters 63–64 renders it “how great things thou hast prepared for him that waiteth for thee” ([[D&C 133:45]]). The vision of the degrees of glory opens with the Lord’s promise to reveal “the wonders of eternity,” and uses Paul’s phrasing: “things which eye has not seen, nor ear heard, nor yet entered into the heart of man” ([[D&C 76:10]]). And at Bountiful, the Nephites said of the Savior’s prayer for them, “The eye hath never seen, neither hath the ear heard, before, so great and marvelous things as we saw and heard Jesus speak unto the Father” ([[3 Ne. 17:16]]).
    sources: [oswalt, paul-40-66]
  - ref: 5
    phrase: 'in those is continuance, and we shall be saved'
    kind: words
    title: A verse no one is sure of
    body: |
      The second half of verse 5 is one of the most difficult lines in Isaiah. The Hebrew is *bāhem ʿôlām wənîwwāšēaʿ*, literally something like “in them forever, and we shall be saved.” The King James translators rendered it “in those is continuance, and we shall be saved,” taking “those” to mean the Lord’s ways. Most modern translations read it as a despairing question: “we have been in our sins a long time; shall we be saved?” Others emend the text slightly.

      No reading is certain, and it is worth saying so plainly. Hebrew poetry is often compressed, and a few lines in the Old Testament have not come down in a form anyone can translate with confidence.

      What is clear is the movement of the verse. It starts with confidence: “Thou meetest him that rejoiceth and worketh righteousness.” The Lord comes to help those who do right gladly. Then it turns: “behold, thou art wroth; for we have sinned.” The people cannot claim to be the ones He meets. Interestingly, when the Lord quoted this chapter in latter-day revelation, He kept the first half of the verse and left out the difficult second half ([[D&C 133:44]]).
    sources: [paul-40-66, blenkinsopp]
  - ref: 6
    phrase: all our righteousnesses are as filthy rags
    kind: words
    title: Filthy rags
    body: |
      This line is often quoted to mean that human good works are worthless before God. The context is more specific. “Filthy rags” is *beged ʿiddîm*, literally a garment of menstruation, a cloth that made a person ritually unclean under the law of Moses ([[Lev. 15:19–24]]). The line before it says, “we are all as an unclean thing.” The people are describing themselves as ritually defiled, unfit to come into God’s presence, and they recognize that anything a defiled person touches becomes defiled too ([[Hag. 2:13–14]]). Their righteous acts, *ṣidqōtênû*, are real acts, but they are stained by the condition of the people who did them.

      The point is not that obedience does not matter. Isaiah’s book is full of calls to “do justice” ([[Isa. 56:1]]) and to keep the true fast (58:6–7). The point is that a people in sin cannot purify themselves by adding good deeds on top. Mormon made a similar point: a gift given without real intent “profiteth him nothing” ([[Moro. 7:6]]). And Nephi taught that it is “by grace that we are saved, after all we can do” ([[2 Ne. 25:23]]).

      “We all do fade as a leaf” recalls the first chapter of Isaiah, where the idolaters would be “as an oak whose leaf fadeth” ([[Isa. 1:30]]). The book is drawing its threads together. In chapter 61 the same people were given “the garment of praise” and “the robe of righteousness” ([[Isa. 61:3]]; [[Isa. 61:10]]). The soiled garment of verse 6 is exactly what the Lord offers to exchange.
    sources: [bdb, oswalt]
  - ref: 8
    phrase: we are the clay, and thou our potter; and we all are the work of thy hand
    kind: symbol
    title: The clay and the potter
    body: |
      Isaiah has used the potter image twice before, both times as a rebuke. People who questioned God were like clay telling the potter he had no understanding ([[Isa. 29:16]]), or asking, “What makest thou?” ([[Isa. 45:9]]). Here the people use the image themselves, and it becomes a plea. They are not arguing with the potter; they are asking Him to remember that they are His work.

      Jeremiah went down to a potter’s house and watched him rework a spoiled vessel into another one “as seemed good to the potter to make it” ([[Jer. 18:4]]). The lesson was that the Lord could reshape Israel. That is what the people ask for here. They have admitted that they are unclean and faded (verse 6). A potter does not throw away marred clay while it is still soft; he starts again.

      The verse joins the potter to the Father: “thou art our father; we are the clay.” Both images say the same thing. We did not make ourselves, and the one who made us has not finished. Paul used the image to insist on God’s sovereignty ([[Rom. 9:20–21]]); Isaiah uses it to appeal to His faithfulness.
    sources: [oswalt]
  - ref: 11
    phrase: Our holy and our beautiful house, where our fathers praised thee, is burned up with fire
    kind: history
    title: The burned temple
    body: |
      In 586 BC the Babylonian commander Nebuzaradan “burnt the house of the LORD, and the king’s house, and all the houses of Jerusalem” ([[2 Kgs. 25:9]]). For the survivors this was more than a building lost. The temple was where heaven and earth met, the place where the Lord had put His name ([[1 Kgs. 8:29]]). The book of Lamentations mourns the same loss: “The Lord hath cast off his altar, he hath abhorred his sanctuary” ([[Lam. 2:7]]).

      The people’s description is poignant: “our holy and our beautiful house, where our fathers praised thee.” It is “our” house, the place of family memory, where generations had worshipped. The same feeling came over the old men who remembered Solomon’s temple when the foundation of the second temple was laid: they “wept with a loud voice” while the younger people shouted for joy ([[Ezra 3:12]]).

      Latter-day Saints know something of this loss. The Nauvoo Temple, dedicated in 1846 as the Saints were leaving the city, was burned by an arsonist in 1848 and later toppled by a tornado. It was rebuilt on the same site and dedicated in 2002.
    sources: [oswalt, blenkinsopp, bd-temple]
  - ref: 12
    phrase: wilt thou hold thy peace, and afflict us very sore?
    kind: liken
    title: Will You keep silent?
    body: |
      The lament ends with a question, not a resolution. “Wilt thou refrain thyself” uses the verb the Lord used for His own restraint in the time of Babylon: “I have long time holden my peace; I have been still, and refrained myself” ([[Isa. 42:14]]). “Hold thy peace” is *ḥāšâ*, the verb of 57:11 and 62:1.

      It is a real question, and scripture lets it stand. Many psalms end in hope, but some end in the dark ([[Ps. 88]]). Joseph Smith prayed from Liberty Jail in almost the same words: “O God, where art thou? And where is the pavilion that covereth thy hiding place? How long shall thy hand be stayed?” ([[D&C 121:1–2]]). The Lord’s answer came: “My son, peace be unto thy soul” ([[D&C 121:7]]).

      Isaiah’s answer comes in the next verse. The Lord replies, “I am sought of them that asked not for me; I am found of them that sought me not” ([[Isa. 65:1]]), and a few verses later, “I will not keep silence” ([[Isa. 65:6]]). He was never silent because He did not care. The lament is not the end of the story; it is the prayer that the rest of the book answers.
    sources: [oswalt]

christ: |
  The people prayed for God to tear open the heavens and come down. In Jesus He did: at His baptism, Mark says, the heavens were torn open ([[Mark 1:10]]), and at His death the temple veil was torn ([[Mark 15:38]]). He came to people whose “righteousnesses are as filthy rags” and offered them His own robe of righteousness. He is the potter who reshapes marred clay, and He will come again, as latter-day revelation promises in the words of this chapter, when “the mountains flow down at thy presence” ([[D&C 133:44]]).

liken: |
  - Have I ever prayed, “Oh that thou wouldest rend the heavens”? What happened?
  - Do I try to clean myself up with more good deeds, instead of bringing my stained garment to the Lord to exchange?
  - Is anyone around me calling on His name and stirring themselves up “to take hold of” Him? Am I?
  - Can I let myself be clay? What part of my life am I still trying to shape on my own?
  - When heaven seems silent, can I keep asking, as this chapter does?

explore: |
  - **The prayer answered.** Read [[Isa. 64:1–5]] alongside [[D&C 133:38–45]] and notice the changes in tense.
  - **Torn heavens.** Read [[Mark 1:9–11]] and [[Mark 15:37–39]].
  - **Eye hath not seen.** Compare [[Isa. 64:4]], [[1 Cor. 2:9–10]], [[D&C 76:5–10]], and [[3 Ne. 17:15–17]].
  - **The potter.** Read [[Isa. 29:16]], [[Isa. 45:9]], [[Isa. 64:8]], and [[Jer. 18:1–6]].
  - **Laments.** Read [[Ps. 74]] and [[Lam. 5]], two prayers from the same years.

