chapter: 65
title: New Heavens and a New Earth
tagline: The Lord answers the lament, saying He has held out His hands all day to a people who would not come; He will spare the good grapes in the cluster, separate His servants from the rebels, and create a new heaven, a new earth, and a Jerusalem of joy.
when: 'Setting: the community in Judah, late sixth century BC; taken up in Revelation and in latter-day revelation on the Millennium'

setting: |
  Chapters 65 and 66 are the Lord’s answer to the lament of 63:7–64:12, and the conclusion of the book. The people asked, “wilt thou hold thy peace?” ([[Isa. 64:12]]). He answers that He has not been silent or hidden. He has been holding out His hands all day, and they did not come (verses 1–2).

  The answer divides the community in two. On one side are “my servants,” “mine elect,” “my people that have sought me”; on the other, “ye… that forsake the LORD” (verses 8–15). The word “servants” appears seven times in the chapter. The single servant of chapters 42–53 has become a faithful community, and it is no longer the same as Israel as a whole. The text draws the line by faithfulness, not by family.

  Verses 17–25 are one of the great visions of the Bible: new heavens and a new earth, long life, work that is not in vain, and peace among animals. The New Testament takes up the new creation ([[2 Pet. 3:13]]; [[Rev. 21:1–4]]), and latter-day revelation uses verses 20–22 to describe the Millennium ([[D&C 101:30–31]]).

thread: |
  Isaiah 65 is about **who responds when God calls**.

  The chapter opens with a painful irony. God has made Himself available to people who did not even ask, and He has stretched out His hands all day to His own people, who turned away (verses 1–2). They were busy with other religions: rites in gardens and among the graves, forbidden food, and a smug holiness that tells others to keep away (verses 3–5).

  The central statement comes in verse 12: “when I called, ye did not answer; when I spake, ye did not hear.” The whole future divides on that. The Lord will not destroy the whole cluster of grapes, because there is still good wine in it (verse 8). His servants will eat, drink, sing, and receive a new name; those who would not answer will go hungry (verses 13–15).

  Then the chapter ends with the answer reversed. In the new creation, God says, “before they call, I will answer; and while they are yet speaking, I will hear” (verse 24). The people who once would not answer God are replaced by a people God answers before they finish speaking.

sections:
  - range: 1-7
    heading: I held out My hands all day
    plain: |
      I let Myself be sought by those who did not ask for Me; I let Myself be found by those who did not look for Me. To a nation that did not call on My name, I said, “Here I am, here I am.” All day long I held out My hands to a rebellious people, who walk in a way that is not good, following their own ideas, a people who continually provoke Me to My face, sacrificing in gardens and burning incense on brick altars, who sit among the graves and spend the night in secret places, who eat pork and whose pots hold broth of unclean meat, who say, “Keep your distance! Don’t come near me, for I am too holy for you!” These people are smoke in My nostrils, a fire that burns all day. Look, it is written before Me: I will not keep silent, but I will repay, repay them fully, for your sins and your ancestors’ sins together, says the Lord, because they burned incense on the mountains and insulted Me on the hills. I will measure out to them in full payment for what they have done.
  - range: 8-16
    heading: My servants and you
    plain: |
      This is what the Lord says: When juice is still found in a cluster of grapes, people say, “Don’t destroy it; there is a blessing in it.” So I will do for the sake of My servants: I will not destroy them all. I will bring out descendants from Jacob, and from Judah heirs to My mountains. My chosen ones will inherit them, and My servants will live there. Sharon will become a pasture for flocks, and the Valley of Achor a resting place for herds, for My people who have sought Me. But you who abandon the Lord and forget My holy mountain, who set a table for the god Fortune and fill bowls of mixed wine for the god Destiny, I will destine you for the sword, and all of you will bow down to be slaughtered. For I called and you did not answer; I spoke and you did not listen. You did evil in My sight and chose what does not please Me. So this is what the Lord God says: My servants will eat, but you will go hungry; My servants will drink, but you will go thirsty; My servants will rejoice, but you will be put to shame. My servants will sing from joy of heart, but you will cry out from anguish of heart and wail from a broken spirit. You will leave your name to My chosen ones as a curse word, and the Lord God will put you to death, but He will give His servants another name. Whoever invokes a blessing in the land will do so by the God of truth, and whoever swears an oath in the land will swear by the God of truth. For the troubles of the past will be forgotten and hidden from My eyes.
  - range: 17-25
    heading: New heavens and a new earth
    plain: |
      Look, I am creating new heavens and a new earth; the former things will not be remembered or come to mind. So be glad and rejoice forever in what I am creating, for I am creating Jerusalem to be a joy and her people a delight. I will rejoice over Jerusalem and delight in My people; the sound of weeping and crying will no longer be heard in her. Never again will there be an infant there who lives only a few days, or an old man who does not live out his years. Whoever dies at a hundred will be thought a mere youth, and whoever fails to reach a hundred will be considered cursed. They will build houses and live in them; they will plant vineyards and eat their fruit. They will not build for others to live in or plant for others to eat. For My people will live as long as trees, and My chosen ones will fully enjoy the work of their hands. They will not labor in vain or bear children doomed to disaster, for they will be a people blessed by the Lord, they and their descendants with them. Before they call I will answer; while they are still speaking I will hear. The wolf and the lamb will feed together, the lion will eat straw like the ox, and dust will be the serpent’s food. They will neither harm nor destroy on all My holy mountain, says the Lord.

notes:
  - ref: 1
    phrase: I am sought of them that asked not for me; I am found of them that sought me not
    kind: words
    title: Found by those who did not look
    body: |
      The lament ended by asking whether God would stay silent ([[Isa. 64:12]]). This verse is His reply, and it turns the question around. The Hebrew verbs are in a form (the *niphal*) that can mean “I let myself be sought… I let myself be found.” God was available all along. The problem was that no one asked.

      “A nation that was not called by my name” echoes the lament’s own complaint, “they were not called by thy name” ([[Isa. 63:19]]). In the context of Isaiah, both verses 1 and 2 probably describe Israel: God kept saying “Behold me, behold me” (*hinnēnî*, “Here I am,” the same word as [[Isa. 58:9]]) to His own people, who did not call on Him.

      Paul read the two verses as describing two groups. Verse 1 he applied to the Gentiles, who found God without looking for Him: “Esaias is very bold, and saith, I was found of them that sought me not” ([[Rom. 10:20]]). Verse 2 he applied to Israel: “But to Israel he saith, All day long I have stretched forth my hands unto a disobedient and gainsaying people” ([[Rom. 10:21]]). Paul’s wording follows the Greek Septuagint closely. His reading goes beyond the immediate context, but it fits the direction of the whole last division of Isaiah, which opened with foreigners welcomed to the Lord’s house ([[Isa. 56:6–7]]).
    sources: [mt-sefaria, gesenius-grammar, lxx-rahlfs, greek-nt, delitzsch]
  - ref: 2
    phrase: I have spread out my hands all the day unto a rebellious people
    kind: scripture
    title: Hands spread out all day
    body: |
      Spreading out the hands was the posture of prayer and of pleading ([[1 Kgs. 8:22]]; [[Ex. 9:29]]). Here God takes that posture toward His people. He is the one pleading, and He does it “all the day,” without giving up.

      The Book of Mormon returns to this image several times, usually in the form of an arm stretched out. In Isaiah’s earlier refrain, “his hand is stretched out still” meant judgment ([[Isa. 9:12]]). But for mercy Nephi used a different image, the arm: “I will be merciful unto them, saith the Lord God, if they will repent and come unto me; for mine arm is lengthened out all the day long” ([[2 Ne. 28:32]]). Jacob, after quoting Zenos’s allegory of the olive tree, said of the Lord, “he stretches forth his hands unto them all the day long; and they are a stiffnecked and a gainsaying people” ([[Jacob 6:4]]), language that closely matches verse 2 and Paul’s wording in Romans. And the Lord said to the Nephites after the great destruction, “how oft would I have gathered you as a hen gathereth her chickens” ([[3 Ne. 10:5]]).

      Early Christian writers saw another picture in the outstretched hands. Justin Martyr, writing in the second century, set verse 2 beside “They pierced my hands and my feet” among his prophecies of the cross. That is a devotional reading, but it captures what the verse says. The God who is pleading has not withdrawn His arms.
    sources: [justin-apology]
  - ref: 5
    phrase: 'Which say, Stand by thyself, come not near to me; for I am holier than thou'
    kind: words
    title: Holier than thou
    body: |
      The English expression “holier-than-thou,” attested from 1841, comes from this verse in the King James Version. The people described in verses 3–5 practice forbidden rites: sacrifice in sacred gardens (compare [[Isa. 1:29]]), incense on brick altars instead of the uncut stone the law required ([[Ex. 20:25]]), nights spent among tombs (perhaps offering sacrifices to the dead), and meals of pork and unclean broth ([[Lev. 11:7]]). And after all that, they claim to be too holy for anyone else to touch.

      The Hebrew verb, *qədaštîkā*, is odd. It may mean simply “I am holy to you,” or, read with different vowels, “I would make you holy,” as if their holiness would rub off on anyone who came too close. Either way, it describes people who have made their religion into a barrier against others. Jesus described a Pharisee who prayed, “God, I thank thee, that I am not as other men are” ([[Luke 18:11]]). The Book of Mormon’s Zoramites stood on the Rameumptom and thanked God “that we are a chosen and a holy people” ([[Alma 31:18]]).

      The Lord’s reaction is vivid: “These are a smoke in my nose.” The holiness that was supposed to rise to Him like incense has become an irritant.
    sources: [mt-sefaria, bdb, delitzsch, etymonline-holier]
  - ref: 8
    phrase: 'As the new wine is found in the cluster, and one saith, Destroy it not; for a blessing is in it'
    kind: symbol
    title: A blessing in the cluster
    body: |
      At harvest, a vintner finds a cluster with some rotten grapes. Someone says, “Destroy it not; for a blessing is in it”: there is still good juice there. The same Hebrew words, *ʾal-tašḥēt*, “Destroy not,” stand in the headings of four psalms ([[Ps. 57]]; [[Ps. 58]]; [[Ps. 59]]; [[Ps. 75]]), where the King James Version leaves them untranslated as “Al-taschith.”

      The Lord applies the saying to Israel. He will not destroy the whole people, because His servants are in it. The rotten grapes do not spoil the good ones; the good ones save the cluster. This is Isaiah’s old doctrine of the remnant ([[Isa. 1:9]]; [[Isa. 6:13]]), now joined to the new word “servants.”

      Latter-day Saints will hear the Lord of the vineyard in Zenos’s allegory, who looks at a corrupted tree and keeps saying, “spare it a little longer” ([[Jacob 5:50–51]]), because some good fruit may yet be preserved. Verse 10 adds a similar promise of renewal: the Valley of Achor, named for Israel’s trouble after Achan’s sin at Jericho ([[Josh. 7:24–26]]), will become a place for herds to rest. Hosea made the same valley “a door of hope” ([[Hosea 2:15]]).
    sources: [mt-sefaria]
  - ref: 11
    phrase: that prepare a table for that troop, and that furnish the drink offering unto that number
    kind: words
    title: Fortune and Destiny
    body: |
      The King James Version hides two proper names here. “That troop” is *Gad*, and “that number” is *Menî*. Both were gods, Fortune and Destiny. People set out tables of food and bowls of mixed wine for them, hoping for good luck. Gad is named often in Phoenician and Aramaic inscriptions (and a place in Israel was called Baal-gad, [[Josh. 11:17]]); Menî, “apportionment,” may be related to Manāt, a goddess of fate worshipped in Arabia.

      Verse 12 makes a grim pun on the second name: “Therefore will I *number* (*mānîtî*) you to the sword.” Those who trusted Destiny will get the destiny they chose.

      The practice is worth noticing because it is so ordinary. These people did not reject the Lord outright. They simply hedged their bets, setting a table for luck as well. The Lord calls it forsaking Him and forgetting His holy mountain. Nephi drew the opposite conclusion from his own life: “I will not put my trust in the arm of flesh” ([[2 Ne. 4:34]]).
    sources: [mt-sefaria, bdb, delitzsch]
  - ref: 16
    phrase: he that sweareth in the earth shall swear by the God of truth
    kind: christ
    title: The God of Amen
    body: |
      “The God of truth” is, in Hebrew, *ʾĕlōhê ʾāmēn*, literally “the God of Amen.” The lexicon lists no other place in the Old Testament where *amen* is used as a title of God. The word comes from *ʾāman*, “to be firm, reliable,” the same root as “believe” and “faithful.” To say “amen” is to say “this is reliable.” The God of Amen is the God whose word holds.

      In the new order, people will bless themselves and swear oaths by that God, not by Fortune and Destiny (verse 11). The contrast is between gods of chance and a God of certainty.

      The New Testament gives the title to Christ. To the church at Laodicea He introduces Himself as “the Amen, the faithful and true witness” ([[Rev. 3:14]]), a title very close to this verse’s. And Paul wrote, “all the promises of God in him are yea, and in him Amen” ([[2 Cor. 1:20]]). Every promise in Isaiah is reliable because the one who makes it is Amen.
    sources: [mt-sefaria, bdb, delitzsch]
  - ref: 17
    phrase: For, behold, I create new heavens and a new earth
    kind: words
    title: A new creation
    body: |
      “Create” is *bārāʾ*, the verb of [[Gen. 1:1]], used in the Bible only with God as its subject. It appears three times in verses 17–18: new heavens and a new earth, Jerusalem a rejoicing, her people a joy. Isaiah has promised new things before ([[Isa. 43:18–19]]; [[Isa. 48:6–7]]); here the promise reaches its limit, a new creation. “The former shall not be remembered” means that the old troubles (verse 16) will lose their hold on memory, not that the past is erased.

      The idea became central to the hope of Jews and Christians. Peter wrote, “we, according to his promise, look for new heavens and a new earth, wherein dwelleth righteousness” ([[2 Pet. 3:13]]), and John saw it: “I saw a new heaven and a new earth: for the first heaven and the first earth were passed away” ([[Rev. 21:1]]).

      The Restoration adds that the new earth is this earth, renewed. “We believe… that the earth will be renewed and receive its paradisiacal glory” ([[A of F 1:10]]). Moroni recorded Ether’s prophecy: “there shall be a new heaven and a new earth; and they shall be like unto the old save the old have passed away, and all things have become new” ([[Ether 13:9]]). And the Lord said, “there shall be a new heaven and a new earth. For all old things shall pass away, and all things shall become new” ([[D&C 29:23–24]]). The earth is not discarded; it is redeemed, like the people who live on it.
    sources: [mt-sefaria, bdb, gs-millennium]
  - ref: 20
    phrase: for the child shall die an hundred years old
    kind: scripture
    title: The age of a tree
    body: |
      This vision is not quite heaven. People still build houses, plant vineyards, have children, and die, though at a great age (verses 20–23). A person who dies at a hundred will be thought young. The passage describes a transformed earth where death still exists. One nineteenth-century commentary put the contrast this way: [[Isa. 25:8]] promises the final destruction of death’s power (“He will swallow up death in victory”), while this verse describes only its limitation.

      Latter-day revelation answers the puzzle with the doctrine of the Millennium. The Lord quoted this passage when He described the thousand years of peace: “In that day an infant shall not die until he is old; and his life shall be as the age of a tree; And when he dies he shall not sleep, that is to say in the earth, but shall be changed in the twinkling of an eye” ([[D&C 101:30–31]]; compare [[D&C 63:51]]). Isaiah’s picture fits the Millennium exactly: a renewed earth, long mortal lives, and death transformed into an instant change rather than a sleep in the grave.

      Verses 21–23 reverse the curses of the covenant, as [[Isa. 62:8–9]] did: people will live in the houses they build and eat the fruit they plant ([[Deut. 28:30]]), and they will not “bring forth for trouble,” bearing children only to lose them. Work and family, the two places where the Fall is felt most sharply ([[Gen. 3:16–19]]), are healed.
    sources: [delitzsch, gs-millennium]
  - ref: 24
    phrase: before they call, I will answer; and while they are yet speaking, I will hear
    kind: structure
    title: Before they call
    body: |
      This verse closes a circle in the chapter. In verse 12 the Lord said, “when I called, ye did not answer.” The lament complained, “there is none that calleth upon thy name” ([[Isa. 64:7]]). Here the direction reverses: the people call, and God answers before they finish.

      It is the relationship the Lord wanted from the beginning. Jesus described it to His disciples: “your Father knoweth what things ye have need of, before ye ask him” ([[Matt. 6:8]]). That is not a reason to stop praying, since Jesus went on to teach the Lord’s Prayer; it is a reason to pray with confidence. The Book of Mormon records a moment when this verse was fulfilled almost literally. When the Nephite disciples prayed to Jesus, “they were filled with desire,” and “it was given unto them what they should pray” ([[3 Ne. 19:24]]).
  - ref: 25
    phrase: The wolf and the lamb shall feed together, and the lion shall eat straw like the bullock
    kind: symbol
    title: The wolf and the lamb
    body: |
      Verse 25 condenses Isaiah’s earlier vision of the peaceable kingdom: “The wolf also shall dwell with the lamb… and the lion shall eat straw like the ox… They shall not hurt nor destroy in all my holy mountain” ([[Isa. 11:6–9]]). The book’s first great picture of the Messiah’s reign returns here near its end.

      One phrase is new: “dust shall be the serpent’s meat.” It recalls the curse on the serpent in Eden, “dust shalt thou eat all the days of thy life” ([[Gen. 3:14]]). In the new creation, peace comes to every creature except the serpent, whose sentence stands. The enemy behind the Fall does not share in the restoration.

      Latter-day revelation describes the same peace: “in that day the enmity of man, and the enmity of beasts, yea, the enmity of all flesh, shall cease from before my face” ([[D&C 101:26]]). Nephi quoted Isaiah 11 twice, once as part of the brass plates and once in his own closing prophecy of the last days ([[2 Ne. 21:6–9]]; [[2 Ne. 30:12–15]]).

christ: |
  Christ is the Lord whose hands are “spread out… all the day,” who says “Behold me, behold me” to a people that will not come ([[Jacob 6:4]]; [[3 Ne. 10:5]]). He is “the Amen, the faithful and true witness” ([[Rev. 3:14]]), in whom every promise of God is sure. And He is the one who makes all things new: “Behold, I make all things new” ([[Rev. 21:5]]). The Millennium that Isaiah describes and latter-day revelation expands is His reign, when the curse is lifted from work and family, death becomes a change in the twinkling of an eye, and nothing hurts or destroys in all His holy mountain.

explore: |
  - **The hands held out.** Read [[Isa. 65:1–2]], [[Rom. 10:19–21]], [[2 Ne. 28:32]], and [[Jacob 6:4–5]].
  - **New heavens and a new earth.** Read [[Isa. 65:17–25]], [[Isa. 66:22]], [[2 Pet. 3:10–13]], [[Rev. 21:1–5]], and [[Ether 13:9]].
  - **The Millennium.** Read [[D&C 101:23–34]] and [[D&C 63:49–51]] alongside [[Isa. 65:20–25]].
  - **The peaceable kingdom.** Compare [[Isa. 11:6–9]], [[Isa. 65:25]], and [[2 Ne. 30:12–15]].

