chapter: 14
title: How Art Thou Fallen, O Lucifer
tagline: Israel sings a taunt over the fallen tyrant of Babylon, and Latter-day Saints see behind the king the one who first said, “I will be like the most High.”
when: 'Isaiah’s ministry in Judah; verses 28–32 are dated to the year King Ahaz died'

setting: |
  Chapter 14 continues the oracle against Babylon from chapter 13 and adds two short oracles: one against Assyria (verses 24–27) and one against Philistia (verses 28–32).

  The heart of the chapter is a **taunt song** (verses 4–23) that liberated Israel will sing over the dead king of Babylon. It is one of the most powerful poems in the Bible, and it contains the famous lines about **Lucifer**, “son of the morning,” who wanted to ascend above the stars of God and was cast down to the pit. Latter-day Saints read those lines as describing not only a proud human king but Satan himself. Modern revelation applies the name Lucifer to him ([[D&C 76:25–27]]; [[Moses 4:1–4]]).

  Nephi quoted the chapter as [[2 Ne. 24]]. It was the last chapter of his long quotation of Isaiah 2–14, and immediately afterward he gave his “keys” for understanding Isaiah ([[2 Ne. 25:1–8]]).

thread: |
  Isaiah 14 is about **the one who tried to climb too high**, and it reads like a play in three scenes.

  **Scene one: the earth breathes again (verses 3–8).** The oppressor is dead. The whole earth is at rest and breaks into singing. Even the cedars of Lebanon rejoice: *since you fell, no lumberjack has come to cut us down.*

  **Scene two: the welcome in the underworld (verses 9–11).** In Sheol, the world of the dead, the ghosts of former kings rise from their thrones to greet the newcomer with mockery: “Art thou also become weak as we?” His music has stopped. His bed is maggots and his blanket is worms.

  **Scene three: the fall from heaven (verses 12–20).** Now the poem soars to its most famous lines. The king is called *Helel ben Shachar*, “shining one, son of the dawn,” which the Latin Bible translated *Lucifer*. He had said in his heart five times, “I will”: *I will ascend… I will exalt my throne… I will sit… I will ascend… I will be like the most High.* And the answer is one line: “Yet thou shalt be brought down to hell.”

  Those five “I will”s are the anatomy of pride. They are also the exact opposite of the Son’s answer in the premortal council: “Father, **thy** will be done, and the glory be thine forever” ([[Moses 4:2]]). Isaiah’s poem mocks a human tyrant, but it exposes the pattern of the first rebel, who wanted God’s throne and ended in the pit.

sections:
  - range: 1-3
    heading: Mercy on Jacob
    plain: |
      The Lord will have mercy on Jacob and choose Israel again, and settle them in their own land. Foreigners will join them and attach themselves to Jacob’s family. Nations will bring Israel home, and Israel will rule over those who once oppressed them. The Lord will give you rest from your pain, turmoil, and harsh slavery.
  - range: 4-11
    heading: The taunt over the king of Babylon
    plain: |
      Then you will sing this taunt about the king of Babylon: “How the oppressor has come to an end! How the golden city has come to an end! The Lord has broken the club of the wicked, the scepter of the tyrants who struck nations with endless blows and ruled them in anger. Now the whole earth is at rest and quiet, and people break into song. Even the cypress trees and cedars of Lebanon celebrate: ‘Since you were laid low, no woodcutter comes to cut us down.’ The realm of the dead below stirs to meet you. It wakes the spirits of the dead, the former leaders of the earth, and makes kings rise from their thrones. They all say to you, ‘You too have become weak like us!’ Your pomp and the sound of your harps have gone down to the grave. Maggots are your bed and worms your blanket.”
  - range: 12-21
    heading: Fallen from heaven
    plain: |
      “How you have fallen from heaven, shining star, son of the dawn! You who conquered nations have been cut down to the ground. You said in your heart, ‘I will climb to heaven; I will raise my throne above God’s stars; I will sit on the mountain of the assembly in the far north; I will rise above the clouds; I will make myself like the Most High.’ But you are brought down to the realm of the dead, to the depths of the pit. Those who see you stare and wonder: ‘Is this the man who shook the earth and made kingdoms tremble, who turned the world into a desert, destroyed its cities, and never let his prisoners go home?’ Other kings lie in state in their own tombs, but you are thrown out of your grave like a rejected branch, covered with the slain, trampled like a corpse. You won’t be buried with them, because you destroyed your own land and killed your own people. The descendants of evildoers will never be renowned. Prepare to slaughter his sons for their fathers’ sins, so they will not rise to take over the earth and fill it with their cities.”
  - range: 22-27
    heading: The Lord’s purpose stands
    plain: |
      “I will rise against them,” says the Lord of hosts. “I will wipe out Babylon’s name and survivors, offspring and descendants. I will turn it into a swamp and a home for owls, and I will sweep it with the broom of destruction.” The Lord of hosts has sworn: “As I have planned, so it will be; as I have purposed, so it will stand. I will break the Assyrian in My land and trample him on My mountains. His yoke will be lifted from My people and his burden from their shoulders.” This is the plan for the whole earth; this is the hand stretched out over all nations. The Lord of hosts has planned it, and who can stop Him? His hand is stretched out, and who can turn it back?
  - range: 28-32
    heading: A warning to Philistia
    plain: |
      This oracle came in the year King Ahaz died. Don’t celebrate, Philistia, because the rod that struck you is broken. From that snake’s root will come a viper, and its offspring will be a fiery flying serpent. The poorest will have food, and the needy will lie down in safety, but I will kill your root with famine and destroy your survivors. Wail, city gate! Cry out, city! Melt away, all Philistia! Smoke is coming from the north, and no one in its ranks falls behind. What answer shall we give to the messengers of the nations? “The Lord has founded Zion, and in her His afflicted people will find refuge.”

notes:
  - ref: 1
    phrase: the strangers shall be joined with them, and they shall cleave to the house of Jacob
    kind: scripture
    title: Strangers who join Israel
    body: |
      Right after the fall of Babylon, the first thing Isaiah announces is mercy for Israel, and then a surprise: **foreigners** will join themselves to the house of Jacob. The gathering of Israel was never meant to be exclusive. Ruth the Moabitess is the model: “thy people shall be my people, and thy God my God” ([[Ruth 1:16]]).

      Isaiah develops this beautifully later: strangers who “join themselves to the LORD” will be brought to His holy mountain ([[Isa. 56:6–7]]). The Book of Mormon teaches that “as many of the Gentiles as will repent are the covenant people of the Lord” ([[2 Ne. 30:2]]), and the Savior promised that Gentiles who come unto Him will “be numbered among my people, O house of Israel” ([[3 Ne. 21:6]]; see [[3 Ne. 21:22]]; [[Abr. 2:10]]).
    sources: [lds-scriptures]
  - ref: 2
    phrase: they shall take them captives, whose captives they were
    kind: bom
    title: Returning to lands of promise
    body: |
      The reversal is complete: the captors become captives. Nephi’s version expands the verse with a latter-day promise: “And the people shall take them and bring them to their place; **yea, from far unto the ends of the earth; and they shall return to their lands of promise**” ([[2 Ne. 24:2]]).

    sources: [lds-scriptures]
  - ref: 4
    phrase: thou shalt take up this proverb against the king of Babylon
    kind: words
    title: A taunt song
    body: |
      “Proverb” here (*mashal*) doesn’t mean a wise saying. It means a **taunt**, a satirical song mocking a fallen enemy.

      That tells us how to read verses 4–21. It is poetry, exaggerated and ironic, not a sober biography. Latter-day Saint readers take it to tell the truth about its target, and in this case about the one who stands behind him (see verse 12).
    sources: [isaiah-in-bom]
  - ref: 8
    phrase: the fir trees rejoice at thee, and the cedars of Lebanon
    kind: history
    title: Cedars felled and a morning star descending
    body: |
      The taunt makes “two clear allusions to two well-known pieces of Babylonian literature,” and in each it changes the outcome for Babylon’s king. The trees’ relief that “no feller is come up against us” recalls the expedition to the cedar forests in the *Gilgamesh* epic, except that here the one who is felled is the Babylonian king, who is “laid down.”

      The second allusion is the morning star of verses 12–16, which Latter-day Saints read of Satan as well as of the king (see the note on verse 12). As a picture of the king, it compares well with the *Descent of Ishtar*, in which Ishtar, the morning star, goes down to the netherworld, the world of the dead. In the Babylonian story Ishtar comes back up; in Isaiah the king is brought down to hell and remains there.
    sources: [isaiah-in-bom, lds-scriptures]
  - ref: 9
    phrase: Hell from beneath is moved for thee to meet thee at thy coming
    kind: words
    title: A reception committee in Sheol
    body: |
      “Hell” here is again *Sheol*, the world of departed spirits (see [[Isa. 5:14]]). Isaiah imagines the spirits of dead kings rising from ghostly thrones to greet the newcomer. It’s a grimly funny scene. Their greeting is pure mockery: “Art thou also become weak as we? art thou become like unto us?”

      However powerful the king was in life, he arrives among the dead as weak as the rest. Alma taught that the spirits of the wicked are “cast out into outer darkness” and remain in that state until the resurrection ([[Alma 40:13–14]]).
    sources: [bd-sheol, lds-scriptures]
  - ref: 12
    phrase: How art thou fallen from heaven, O Lucifer, son of the morning!
    kind: words
    title: Lucifer, son of the morning
    body: |
      The Hebrew phrase is *helel ben shachar*, “shining one, son of the dawn.” It is the **morning star**, which rises before the sun and is named for its brilliance. The Latin translated *helel* as *lucifer*, “light-bearer,” and the King James translators kept that word as a name.

      In its immediate context, the taunt is against the king of Babylon (verse 4). A common scholarly reading takes it as aimed only at a human king, and one form of that reading holds that applying it to the fall of an angel has no warrant in the text. Latter-day Saints understand that the poem also describes **Satan**, the being who stands behind every proud tyrant, and modern revelation equates Lucifer with him. Joseph Smith and Sidney Rigdon saw “an angel of God who was in authority in the presence of God” who rebelled and “was thrust down from the presence of God and the Son… he was **Lucifer, a son of the morning**” ([[D&C 76:25–26]]). They too cried, “he is fallen! is fallen, even a son of the morning!” ([[D&C 76:27]]). Jesus said, “I beheld Satan as lightning fall from heaven” ([[Luke 10:18]]).

      The Book of Mormon may show this reading at work six centuries before Christ. Lehi told his son Jacob, “I, Lehi, according to the things which I have read, must needs suppose that an angel of God, according to that which is written, had fallen from heaven; wherefore, he became a devil” ([[2 Ne. 2:17]]). Genesis does not say where the devil came from, so Lehi was reasoning from something else he had read, and this chapter, which Nephi later quoted ([[2 Ne. 24:12]]), is a likely text. That is a suggestion, not something the text states.
    sources: [bd-lucifer, sc-knowhy-43, delitzsch, lds-scriptures]
  - ref: 13
    phrase: I will ascend into heaven, I will exalt my throne above the stars of God
    kind: christ
    title: Five “I will”s
    body: |
      Verses 13–14 hold five boasts that begin “I will”:

      1. I will ascend into heaven,
      2. I will exalt my throne above the stars of God,
      3. I will sit also upon the mount of the congregation,
      4. I will ascend above the heights of the clouds,
      5. I will be like the most High.

      The five make a ladder of self-exaltation that ends in trying to replace God. Pride is the common thread in the fall of every nation Isaiah addresses in chapters 2–14, and the king of Babylon here has been described as “typified as Lucifer.” Now set it beside the premortal council. Lucifer said, “I will be thy son… surely I will do it; wherefore **give me thine honor**.” The Beloved Son said, “Father, **thy will be done**, and the glory be thine forever” ([[Moses 4:1–2]]).

      Satan’s program was “I will.” The Savior’s was “thy will.” Christ “descended below all things” and was exalted ([[D&C 88:6]]). Lucifer tried to ascend above all things and fell.
    sources: [isaiah-in-bom, lds-scriptures]
  - ref: 13
    phrase: I will sit also upon the mount of the congregation, in the sides of the north
    kind: history
    title: The mountain of the gods
    body: |
      The third “I will” aims at “the mount of the congregation, in the sides of the north,” and the Book of Mormon glossary renders the last phrase “in the farthest north.” The king is made to speak in the idiom of his own people, who did not have God’s dwelling in their midst as Israel did, and who placed the seat of deity on the northern mountains. His boast is that he will take a seat among the divine assembly.
    sources: [delitzsch, isaiah-in-bom]
  - ref: 15
    phrase: Yet thou shalt be brought down to hell, to the sides of the pit
    kind: symbol
    title: From the heights to the pit
    body: |
      After five soaring “I will”s, one line brings everything down: “Yet thou shalt be brought down.” The phrase “sides of the pit” echoes “sides of the north” (verse 13); the Hebrew uses the same word (*yarkete*) for both. He wanted the highest corner of heaven and got the lowest corner of the grave.

      It is the principle Isaiah has been teaching since chapter 2: everything that exalts itself will be brought low, and “the LORD alone shall be exalted in that day” ([[Isa. 2:11–17]]).
    sources: [delitzsch, lds-scriptures]
  - ref: 16
    phrase: Is this the man that made the earth to tremble
    kind: scripture
    title: '“Is this the man?”'
    body: |
      Those who see the fallen tyrant “narrowly look” upon him and ask, *Is this really him? The one who shook the earth?*

      Nephi’s vision of the latter days says Satan’s power will ultimately be broken: “because of the righteousness of his people, Satan has no power; wherefore, he cannot be loosed for the space of many years” ([[1 Ne. 22:26]]).
    sources: [lds-scriptures]
  - ref: 17
    phrase: that opened not the house of his prisoners
    kind: christ
    title: A tyrant who kept the prison locked
    body: |
      One charge sums up this king: he never let his prisoners go home.

      Contrast the One Isaiah will later describe, anointed “to proclaim liberty to the captives, and the opening of the prison to them that are bound” ([[Isa. 61:1]]; [[Luke 4:18]]). President Joseph F. Smith saw the fulfillment in the spirit world, where the Son of God appeared “declaring liberty to the captives who had been faithful” and organized the preaching of the gospel to the rest ([[D&C 138:18]]; [[D&C 138:29–32]]). Isaiah himself was there ([[D&C 138:42]]).
    sources: [lds-scriptures]
  - ref: 19
    phrase: thou art cast out of thy grave like an abominable branch
    kind: history
    title: Denied a burial
    body: |
      Other kings “lie in glory, every one in his own house” (verse 18), in their royal tombs. This one is thrown out like a rotten branch and left lying like a carcass, trampled, not worth a place in the common grave. The picture is a battlefield where the dead are covered over and the king of Babylon is left exposed.

      Latter-day scripture describes a different exclusion for the one who rebelled: those who “keep not their first estate shall not have glory in the same kingdom with those who keep their first estate” ([[Abr. 3:26]]).
    sources: [delitzsch, lds-scriptures]
  - ref: 19
    phrase: as the raiment of those that are slain
    kind: bom
    title: “Remnant” or “raiment”
    body: |
      Where the King James Version reads “as the raiment of those that are slain,” the Book of Mormon reads “the remnant of those that are slain” ([[2 Ne. 24:19]]). The Hebrew word is *lebush*, “garment, clothing, raiment,” so the King James reading is the one the Hebrew supports.

      The difference may be a copyist’s slip in the Book of Mormon manuscripts. For most of the Isaiah quotations the original manuscript is no longer extant, and where it survives it sometimes restores a King James reading that was lost in copying. Single-word differences between words that look alike therefore “may simply be due to copying errors,” and “remnant” for “raiment” is listed among the possible examples, not as an established one.
    sources: [isaiah-in-bom, bdb, lds-scriptures]
  - ref: 24
    phrase: Surely as I have thought, so shall it come to pass
    kind: structure
    title: What the Lord purposes stands
    body: |
      After all the tyrant’s “I will”s, the Lord speaks, and He swears an oath: “as I have purposed, so shall it stand.” Proud rulers make plans. The Lord’s purpose stands.

      Verse 27 ends with a transformed version of the old refrain. In chapters 5–10, “his hand is stretched out still” was a warning to Israel. Now: “his hand is stretched out, and who shall turn it back?” It is a declaration that no power on earth or in hell can stop His plan. The Lord told Joseph Smith the same: “The works, and the designs, and the purposes of God cannot be frustrated, neither can they come to naught” ([[D&C 3:1]]).
    sources: [lds-scriptures]
  - ref: 25
    phrase: I will break the Assyrian in my land, and upon my mountains tread him under foot
    kind: history
    title: Assyria broken in Judah
    body: |
      This short oracle (verses 24–27) predicts that Assyria would be broken “in my land… upon my mountains,” that is, in Judah itself. The Assyrian army was struck down there ([[Isa. 37:36–37]]).

      The oracle is set beside the one against Babylon. Because Assyria’s fall had already happened, it served as a pledge that the still-unfulfilled word against Babylon would also come true.
    sources: [delitzsch, lds-scriptures]
  - ref: 29
    phrase: his fruit shall be a fiery flying serpent
    kind: words
    title: A fiery flying serpent
    body: |
      This oracle is dated to the year King Ahaz died. The Philistines were celebrating because “the rod that smote thee is broken.” Isaiah warns them not to rejoice: from the serpent’s root will come something worse, a viper, and then “a fiery flying serpent.” Who the rod and the serpent are is debated. One reading takes the rod as the Davidic scepter that had once held the Philistines in subjection, and reads the viper as Hezekiah and the flying serpent as the Messiah (so the Targum).

      The Hebrew for “fiery serpent” is *saraph*, the same word as the **seraphim** of [[Isa. 6:2]] and the “fiery serpents” of the wilderness ([[Num. 21:6]]).

      Nephi borrowed Isaiah’s phrase. Retelling the wilderness story to his brothers, he said the Lord “sent fiery flying serpents among them” ([[1 Ne. 17:41]]). Numbers and Deuteronomy never say the serpents flew; Isaiah does, here and in [[Isa. 30:6]], where the creatures belong to the Negev, the southern desert where Israel wandered.
    sources: [sc-knowhy-316, delitzsch, lds-scriptures]
  - ref: 29
    phrase: out of the serpent’s root shall come forth a cockatrice
    kind: symbol
    title: A serpent as a king’s emblem
    body: |
      A serpent could be the emblem of a king. Serpents were part of royal symbolism: in Egypt the upright cobra, called the uraeus, was placed on the heads of pharaohs, and in Israel some royal seals from the eighth century BC use a winged seraph (a fiery serpent; see the note above on the word).

      On that basis the oracle can be read as picturing a future king, the “fiery flying serpent,” who will deliver Zion. That is an inference from the emblem, not something the verses say. The note above gives the older reading, through the Targum, that the flying serpent is the Messiah.
    sources: [sc-knowhy-657]
  - ref: 32
    phrase: That the LORD hath founded Zion, and the poor of his people shall trust in it
    kind: history
    title: The answer to give the nations
    body: |
      The chapter ends with a question: what answer should be given to the messengers of the nations? The answer is “the LORD hath founded Zion, and the poor of his people shall trust in it.”

      The answer rests on a place the Lord Himself founded, and on a people, especially the poor and afflicted, who trust in it. Latter-day revelation speaks of the stakes of Zion as a refuge: they are to be “a defense, and… a refuge from the storm” ([[D&C 115:6]]).
    sources: [lds-scriptures]

christ: |
  Isaiah 14 teaches about Christ by contrast. Lucifer said “I will” five times and wanted to be “like the most High.” The Son said “thy will be done” ([[Moses 4:2]]). Though He was in the form of God, He “made himself of no reputation… and became obedient unto death” ([[Philip. 2:6–8]]). Lucifer tried to ascend and fell. Christ descended and was exalted.

  The tyrant “opened not the house of his prisoners.” Christ came to open the prison ([[Isa. 61:1]]; [[D&C 138:42]]). And the chapter’s final word, that “the LORD hath founded Zion” and the poor may trust in it, points to the One who is Zion’s sure foundation ([[Isa. 28:16]]).

explore: |
  - **The fall of Lucifer across scripture.** Read [[Isa. 14:12–15]], [[Luke 10:18]], [[Rev. 12:7–9]], [[D&C 29:36–38]], [[D&C 76:25–29]], [[Moses 4:1–4]], and [[Abr. 3:27–28]]. What does each add?
  - **A parallel lament.** Compare this taunt with Ezekiel’s lament over the king of Tyre ([[Ezek. 28:11–19]]).
  - **Nephi’s bridge.** Read [[2 Ne. 25:1–8]], which comes right after Nephi quoted this chapter. Why do you think he gave his keys for understanding Isaiah at this point?

parallels:
  - ref: 2 Ne. 24
    note: Nephi quotes the chapter, the end of his long quotation of Isaiah 2–14.
    primary: true
  - ref: D&C 76:25–27
    note: '“He was Lucifer, a son of the morning… he is fallen!”'
  - ref: Moses 4:1–4
    note: Satan’s rebellion in the premortal council.

sources: [bd-lucifer, bd-sheol, bdb, delitzsch, isaiah-in-bom, sc-knowhy-43, sc-knowhy-316, sc-knowhy-657, lds-scriptures]
