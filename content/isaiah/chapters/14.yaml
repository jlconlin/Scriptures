chapter: 14
title: How Art Thou Fallen, O Lucifer
tagline: Israel sings a taunt over the fallen tyrant of Babylon, and behind the king stands the one who first said, “I will be like the most High.”
when: 'Prophesied c. 700s BC; 14:28–32 dated to the year Ahaz died, c. 715 BC'

setting: |
  Chapter 14 continues the oracle against Babylon from chapter 13 and adds two short oracles: one against Assyria (verses 24–27) and one against Philistia (verses 28–32).

  The heart of the chapter is a **taunt song** (verses 4–23) that liberated Israel will sing over the dead king of Babylon. It is one of the most powerful poems in the Bible, and it contains the famous lines about **Lucifer**, “son of the morning,” who wanted to ascend above the stars of God and was cast down to the pit. Latter-day Saints, together with Christians through the centuries, have read those lines as describing not only a proud human king but Satan himself. Modern revelation confirms that reading ([[D&C 76:25–27]]; [[Moses 4:1–4]]).

  Nephi quoted the chapter as [[2 Ne. 24]]. It was the last chapter of his long quotation of Isaiah 2–14, and immediately afterward he gave his “keys” for understanding Isaiah ([[2 Ne. 25:1–8]]).

thread: |
  Isaiah 14 is about **the one who tried to climb too high**, and it reads like a play in three scenes.

  **Scene one: the earth breathes again (verses 3–8).** The oppressor is dead. The whole earth is at rest and breaks into singing. Even the cedars of Lebanon rejoice: *since you fell, no lumberjack has come to cut us down.*

  **Scene two: the welcome in the underworld (verses 9–11).** In Sheol, the world of the dead, the ghosts of former kings rise from their thrones to greet the newcomer with mockery: “Art thou also become weak as we?” His music has stopped. His bed is maggots and his blanket is worms.

  **Scene three: the fall from heaven (verses 12–20).** Now the poem soars to its most famous lines. The king is called *Helel ben Shachar*, “shining one, son of the dawn,” which the Latin Bible translated *Lucifer*. He had said in his heart five times, “I will”: *I will ascend… I will exalt my throne… I will sit… I will ascend… I will be like the most High.* And the answer is one line: “Yet thou shalt be brought down to hell.”

  Those five “I will”s are the anatomy of pride. They are also the exact opposite of the Son’s answer in the premortal council: “Father, **thy** will be done, and the glory be thine forever” ([[Moses 4:2]]). Isaiah’s poem mocks a human tyrant, but it exposes the pattern of the first rebel, who wanted God’s throne and ended in the pit. Every proud power in history, from Babylon to our own day, follows his script, and every one of them ends the same way: “Is this the man that made the earth to tremble?”

sections:
  - range: 1-3
    heading: Mercy on Jacob
    plain: |
      The Lord will have mercy on Jacob and choose Israel again, and settle them in their own land. Foreigners will join them and attach themselves to Jacob’s family. Nations will bring Israel home, and Israel will rule over those who once oppressed them. The Lord will give you rest from your pain, turmoil, and harsh slavery.
  - range: 4-11
    heading: The taunt over the king of Babylon
    plain: |
      Then you will sing this taunt about the king of Babylon: “How the oppressor has come to an end! How his fury has ended! The Lord has broken the club of the wicked, the scepter of the tyrants who struck nations with endless blows and ruled them in anger. Now the whole earth is at rest and quiet, and people break into song. Even the pine trees and cedars of Lebanon celebrate: ‘Since you were laid low, no woodcutter comes to cut us down.’ The realm of the dead below stirs to meet you. It wakes the spirits of the dead, the former leaders of the earth, and makes kings rise from their thrones. They all say to you, ‘You too have become weak like us!’ Your pomp and the sound of your harps have gone down to the grave. Maggots are your bed and worms your blanket.”
  - range: 12-21
    heading: Fallen from heaven
    plain: |
      “How you have fallen from heaven, shining star, son of the dawn! You who conquered nations have been cut down to the ground. You said in your heart, ‘I will climb to heaven; I will raise my throne above God’s stars; I will sit on the mountain of the assembly in the far north; I will rise above the clouds; I will make myself like the Most High.’ But you are brought down to the realm of the dead, to the depths of the pit. Those who see you stare and wonder: ‘Is this the man who shook the earth and made kingdoms tremble, who turned the world into a desert, destroyed its cities, and never let his prisoners go home?’ Other kings lie in state in their own tombs, but you are thrown out of your grave like a rejected branch, covered with the slain, trampled like a corpse. You won’t be buried with them, because you destroyed your own land and killed your own people. The descendants of the wicked will never be remembered. Prepare to slaughter his sons for their fathers’ sins, so they will not rise to take over the earth and fill it with their cities.”
  - range: 22-27
    heading: The Lord’s purpose stands
    plain: |
      “I will rise against them,” says the Lord of hosts. “I will wipe out Babylon’s name and survivors, offspring and descendants. I will turn it into a swamp and a home for owls, and I will sweep it with the broom of destruction.” The Lord of hosts has sworn: “As I have planned, so it will be; as I have purposed, so it will stand. I will break the Assyrian in My land and trample him on My mountains. His yoke will be lifted from My people and his burden from their shoulders.” This is the plan for the whole earth; this is the hand stretched out over all nations. The Lord of hosts has planned it, and who can stop Him? His hand is stretched out, and who can turn it back?
  - range: 28-32
    heading: A warning to Philistia
    plain: |
      This oracle came in the year King Ahaz died. Don’t celebrate, Philistia, because the rod that struck you is broken. From that snake’s root will come a viper, and its offspring will be a fiery flying serpent. The poorest will have food, and the needy will lie down in safety, but I will kill your root with famine and destroy your survivors. Wail, city gate! Cry out, city! Melt away, all Philistia! Smoke is coming from the north, and not one soldier will fall out of rank. What answer shall we give to the messengers of the nations? “The Lord has founded Zion, and in her His afflicted people will find refuge.”

notes:
  - ref: 1
    phrase: the strangers shall be joined with them, and they shall cleave to the house of Jacob
    kind: scripture
    title: Strangers who join Israel
    body: |
      Right after the fall of Babylon, the first thing Isaiah announces is mercy for Israel, and then a surprise: **foreigners** will join themselves to the house of Jacob. The gathering of Israel was never meant to be exclusive. Ruth the Moabitess is the model: “thy people shall be my people, and thy God my God” ([[Ruth 1:16]]).

      Isaiah develops this beautifully later: strangers who “join themselves to the LORD” will be brought to His holy mountain ([[Isa. 56:6–7]]). The Book of Mormon teaches that “as many of the Gentiles as will repent are the covenant people of the Lord” ([[2 Ne. 30:2]]), and the Savior promised that Gentiles who come unto Him will “be numbered among my people, O house of Israel” ([[3 Ne. 21:6]]; see [[3 Ne. 21:22]]; [[Abr. 2:10]]).
  - ref: 2
    phrase: they shall take them captives, whose captives they were
    kind: bom
    title: Returning to lands of promise
    body: |
      The reversal is complete: the captors become captives. In the ancient setting, it describes Israel’s restoration after exile. Nephi’s version expands the verse with a latter-day promise: “And the people shall take them and bring them to their place; **yea, from far unto the ends of the earth; and they shall return to their lands of promise**” ([[2 Ne. 24:2]]).

      That phrase, “lands of promise,” is a Book of Mormon theme. It reflects the understanding that Israel’s gathering reaches beyond one small land to all the places the Lord has promised His covenant people ([[1 Ne. 22:12]]; [[2 Ne. 6:11]]; [[2 Ne. 9:2]]).
  - ref: 4
    phrase: thou shalt take up this proverb against the king of Babylon
    kind: words
    title: A taunt song
    body: |
      “Proverb” here (*mashal*) doesn’t mean a wise saying. It means a **taunt**, a satirical song mocking a fallen enemy. The poem that follows uses the rhythm of a Hebrew funeral lament (the *qinah* meter, with lines that limp: three beats, then two) but fills it with mockery rather than grief. It’s a mock funeral dirge.

      That tells us how to read verses 4–21. It is poetry, exaggerated and ironic, not a sober biography. But like all great satire, it tells the truth about its target, and in this case about the spiritual power behind him.
  - ref: 8
    phrase: the fir trees rejoice at thee, and the cedars of Lebanon
    kind: history
    title: Even the trees are relieved
    body: |
      This isn’t just poetic fancy. Mesopotamian kings bragged about cutting the cedars of Lebanon for their palaces and temples, and at least one Babylonian inscription carved in Lebanon records Nebuchadnezzar’s logging there. The great cedar forests were stripped over centuries of imperial building.

      So the trees have reason to celebrate the tyrant’s death: “no feller is come up against us.” Creation itself groans under wicked rulers and rejoices when they fall ([[Rom. 8:19–22]]; [[Moses 7:48]]).
  - ref: 9
    phrase: Hell from beneath is moved for thee to meet thee at thy coming
    kind: words
    title: A reception committee in Sheol
    body: |
      “Hell” here is again *Sheol*, the world of departed spirits (see [[Isa. 5:14]]). Isaiah imagines the spirits of dead kings rising from ghostly thrones to greet the newcomer. It’s a grimly funny scene. Their greeting is pure mockery: “Art thou also become weak as we? art thou become like unto us?”

      Death is the great equalizer. However powerful the king was in life, he enters the spirit world with nothing. Alma taught that the spirits of the wicked are “cast out into outer darkness” awaiting the resurrection ([[Alma 40:13–14]]), and the Savior taught that “there is nothing covered, that shall not be revealed” ([[Matt. 10:26]]).
    sources: [bd-sheol]
  - ref: 11
    phrase: the worm is spread under thee, and the worms cover thee
    kind: symbol
    title: A bed of maggots
    body: |
      Kings were buried in splendor, on fine beds, with rich coverings. This king’s “bed” is maggots and his “blanket” is worms. It is the ugliest possible reversal of royal luxury. His music (“the noise of thy viols”) has gone silent.

      Nephi’s version adds a small but evocative detail: “the noise of thy viols **is not heard**” ([[2 Ne. 24:11]]).
  - ref: 12
    phrase: How art thou fallen from heaven, O Lucifer, son of the morning!
    kind: words
    title: Lucifer, son of the morning
    body: |
      The Hebrew phrase is *helel ben shachar*, “shining one, son of the dawn.” It is almost certainly a name for the **morning star** (the planet Venus), which rises brilliantly before dawn and then fades as the sun comes up. It is a perfect image for a king who shone brightly for a moment and was eclipsed. The Latin Vulgate translated *helel* as *lucifer*, “light-bearer,” and the King James translators kept that word as a name.

      In its immediate context, the taunt is against the king of Babylon (verse 4). But Latter-day Saints, like most Christians through the centuries, understand that the poem also describes **Satan**, the being who stands behind every proud tyrant. Modern revelation confirms it. Joseph Smith and Sidney Rigdon saw “an angel of God who was in authority in the presence of God” who rebelled and “was thrust down from the presence of God and the Son… he was **Lucifer, a son of the morning**” ([[D&C 76:25–26]]). They too cried, “he is fallen! is fallen, even a son of the morning!” ([[D&C 76:27]]). Jesus said, “I beheld Satan as lightning fall from heaven” ([[Luke 10:18]]).

      The Book of Mormon may show this reading at work six centuries before Christ. Lehi told his son Jacob, “I, Lehi, according to the things which I have read, must needs suppose that an angel of God, according to that which is written, had fallen from heaven; wherefore, he became a devil” ([[2 Ne. 2:17]]). Genesis says nothing of a fallen angel, so Lehi was reasoning from something else on the brass plates, and this chapter, which his son Nephi later copied from them ([[2 Ne. 24:12]]), is the likeliest text.
    sources: [bd-lucifer, sc-knowhy-43]
  - ref: 13
    phrase: I will ascend into heaven, I will exalt my throne above the stars of God
    kind: christ
    title: Five “I will”s
    body: |
      Count them in verses 13–14:

      1. I will ascend into heaven,
      2. I will exalt my throne above the stars of God,
      3. I will sit also upon the mount of the congregation,
      4. I will ascend above the heights of the clouds,
      5. I will be like the most High.

      This is the anatomy of pride: a ladder of self-exaltation that ends in trying to replace God. Now set it beside the premortal council. Lucifer said, “I will be thy son… surely I will do it; wherefore **give me thine honor**.” The Beloved Son said, “Father, **thy will be done**, and the glory be thine forever” ([[Moses 4:1–2]]).

      Satan’s program was “I will.” The Savior’s was “thy will.” Every choice between pride and humility is a small version of that council. Christ “descended below all things” and was exalted ([[D&C 88:6]]). Lucifer tried to ascend above all things and fell.
  - ref: 13
    phrase: I will sit also upon the mount of the congregation, in the sides of the north
    kind: history
    title: The mountain of the gods
    body: |
      In Canaanite mythology the gods met in council on a sacred mountain in the far north, Mount Zaphon. The Hebrew word for “north” is *tsaphon*. The tyrant wants to sit in the divine council itself, as an equal among the gods.

      For Israel, the true “mount of the congregation” was Zion, “the city of the great King… on the sides of the north” ([[Ps. 48:2]]). The tyrant wants to take the seat that belongs to God alone. Isaiah’s answer is that there is a council in heaven, but its throne is not up for grabs.
  - ref: 15
    phrase: Yet thou shalt be brought down to hell, to the sides of the pit
    kind: symbol
    title: From the heights to the pit
    body: |
      After five soaring “I will”s, one line brings everything down: “Yet thou shalt be brought down.” The phrase “sides of the pit” deliberately echoes “sides of the north” (verse 13). He wanted the highest corner of heaven and got the lowest corner of the grave.

      It is the principle Isaiah has been teaching since chapter 2. Everything that exalts itself will be brought low, and “the LORD alone shall be exalted in that day” ([[Isa. 2:11–17]]).
  - ref: 16
    phrase: Is this the man that made the earth to tremble
    kind: scripture
    title: '“Is this the man?”'
    body: |
      Those who see the fallen tyrant “narrowly look” at him: they squint in disbelief. *Is this really him? The one who shook the earth?* Evil always looks smaller in retrospect than it did in its day.

      Nephi’s vision of the latter days says Satan’s power will ultimately be broken: “because of the righteousness of his people, Satan has no power; wherefore, he cannot be loosed for the space of many years” ([[1 Ne. 22:26]]). Whatever frightens us most now, whether a temptation, an addiction, or a force in the world, will someday look as small as this fallen king.
  - ref: 17
    phrase: that opened not the house of his prisoners
    kind: christ
    title: A tyrant who kept the prison locked
    body: |
      One charge sums up this king: he never let his prisoners go home. Assyrian and Babylonian kings deported whole populations and held them for generations.

      Contrast the One Isaiah will later describe, anointed “to proclaim liberty to the captives, and the opening of the prison to them that are bound” ([[Isa. 61:1]]; [[Luke 4:18]]). President Joseph F. Smith saw the fulfillment in the spirit world, where the Son of God appeared “declaring liberty to the captives who had been faithful” and organized the preaching of the gospel to the rest ([[D&C 138:18]]; [[D&C 138:29–32]]). Isaiah himself was there ([[D&C 138:42]]). Lucifer locks the prison; Christ opens it.
  - ref: 19
    phrase: thou art cast out of thy grave like an abominable branch
    kind: history
    title: Denied a burial
    body: |
      In the ancient world, the worst fate for a king was not death but being denied an honorable burial. Other kings “lie in glory, every one in his own house” (verse 18), in their royal tombs. This one is thrown out like a rotten branch, lying among the unburied dead and trampled.

      Some scholars have suggested that Isaiah’s audience would have thought of the Assyrian king Sargon II, who died on a battlefield in 705 BC and whose body was never recovered, a scandal in Assyria. Whether or not Isaiah had a specific king in mind, the image fits Satan even better: because he did not keep his “first estate,” he was denied a second estate, mortal life with a body, altogether ([[Abr. 3:26–28]]).
  - ref: 24
    phrase: Surely as I have thought, so shall it come to pass
    kind: structure
    title: What the Lord purposes stands
    body: |
      After all the tyrant’s “I will”s, the Lord speaks, and He swears an oath: “as I have purposed, so shall it stand.” Proud rulers make plans. Only God’s purposes are guaranteed.

      Verse 27 ends with a transformed version of the old refrain. In chapters 5–10, “his hand is stretched out still” was a warning to Israel. Now: “his hand is stretched out, and who shall turn it back?” It is a declaration that no power on earth or in hell can stop His plan. The Lord told Joseph Smith the same: “The works, and the designs, and the purposes of God cannot be frustrated, neither can they come to naught” ([[D&C 3:1]]).
  - ref: 25
    phrase: I will break the Assyrian in my land, and upon my mountains tread him under foot
    kind: history
    title: Fulfilled in 701 BC
    body: |
      This short oracle (verses 24–27) predicts that Assyria would be broken “in my land… upon my mountains,” that is, in Judah itself. That happened in 701 BC, when Sennacherib’s army, camped around Jerusalem, was struck down in a single night ([[Isa. 37:36–37]]).

      The fulfillment of this near prophecy was meant to give confidence in the far one. If the Lord could break Assyria at the gates of Jerusalem, He could also break Babylon, and one day every proud power.
  - ref: 29
    phrase: his fruit shall be a fiery flying serpent
    kind: words
    title: A fiery flying serpent
    body: |
      This oracle is dated to the year King Ahaz died (about 715 BC). The Philistines were celebrating because “the rod that smote thee is broken,” probably the death of an Assyrian king. Isaiah warns them not to rejoice: from the serpent’s root will come something worse, a viper, and then “a fiery flying serpent.”

      The Hebrew for “fiery serpent” is *saraph*, the same root as the **seraphim** of [[Isa. 6:2]] and the “fiery serpents” of the wilderness ([[Num. 21:6]]). The image is of a deadly, fast-striking enemy. Assyria had not finished with Philistia.

      Nephi borrowed Isaiah’s phrase. Retelling the wilderness story to his brothers, he said the Lord “sent fiery flying serpents among them” ([[1 Ne. 17:41]]). Numbers and Deuteronomy never say the serpents flew; Isaiah does, here and in [[Isa. 30:6]], where the creatures belong to the Negev, the southern desert where Israel wandered.
    sources: [sc-knowhy-316]
  - ref: 32
    phrase: That the LORD hath founded Zion, and the poor of his people shall trust in it
    kind: history
    title: The answer to give the nations
    body: |
      The chapter ends with a question: when foreign ambassadors come asking what Judah will do in the crisis, what should they be told? The answer is simple and profound: “the LORD hath founded Zion, and the poor of his people shall trust in it.”

      Not alliances, not armies, but a place the Lord Himself founded, and a people, especially the poor and afflicted, who find refuge in it. It’s a lovely description of what the Church and its stakes are meant to be ([[D&C 115:6]]). When the world asks us what we are relying on, that remains the best answer.

christ: |
  Isaiah 14 teaches about Christ by contrast. Lucifer said “I will” five times and wanted to be “like the most High.” The Son said “thy will be done” ([[Moses 4:2]]). Though He was in the form of God, He “made himself of no reputation… and became obedient unto death” ([[Philip. 2:6–8]]). Lucifer ascended and fell. Christ descended and was exalted.

  The tyrant “opened not the house of his prisoners.” Christ came to open every prison ([[Isa. 61:1]]; [[D&C 138:42]]). And the chapter’s final word, that “the LORD hath founded Zion” and the poor may trust in it, points to the One who is Zion’s sure foundation ([[Isa. 28:16]]).

liken: |
  - Pride often speaks in the first person. Listen for “I will” in my own inner voice this week. Where is it pushing out “thy will”?
  - What looks as terrifying as the king of Babylon in my life right now? Can I imagine the day when I’ll look at it and ask, “Is this the thing that made the earth tremble?”
  - The fallen king “opened not the house of his prisoners.” Is there anyone I am keeping in a prison of resentment or unforgiveness?
  - When people ask what I rely on, can I answer like verse 32?

explore: |
  - **The fall of Lucifer across scripture.** Read [[Isa. 14:12–15]], [[Luke 10:18]], [[Rev. 12:7–9]], [[D&C 29:36–38]], [[D&C 76:25–29]], [[Moses 4:1–4]], and [[Abr. 3:27–28]]. What does each add?
  - **A parallel lament.** Ezekiel’s dirge over the king of Tyre ([[Ezek. 28:11–19]]) also seems to look past a human king to a fallen heavenly being. Compare the two.
  - **Nephi’s bridge.** Read [[2 Ne. 25:1–8]], which comes right after Nephi quoted this chapter. Why do you think he gave his keys for understanding Isaiah at this point?

