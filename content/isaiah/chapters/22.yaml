chapter: 22
title: The Valley of Vision and the Key of David
tagline: Jerusalem parties on its rooftops and fortifies its walls but never looks to its Maker, and a proud steward is replaced by a servant who holds the key.
when: 'Probably c. 701 BC, around Sennacherib’s invasion'

setting: |
  After a run of oracles against other nations (chapters 13–21), Isaiah turns to a surprising target: **Jerusalem itself**, which he calls “the valley of vision.” The irony is intentional. The city of prophets and visions has become spiritually blind.

  The historical setting is probably the Assyrian crisis around 701 BC, when Sennacherib invaded in Hezekiah’s reign. Verses 8–11 describe defensive measures of the kind Hezekiah took: checking the arsenal, repairing breaches in the wall, tearing down houses to strengthen it, and redirecting the water supply ([[2 Chr. 32:2–5]]; [[2 Kgs. 20:20]]).

  The second half of the chapter (verses 15–25) zooms in on two officials in Hezekiah’s court. **Shebna**, a proud steward, is building himself a grand tomb. **Eliakim**, a faithful servant, will replace him and receive “the key of the house of David.” These verses become important in the New Testament, where the Savior applies the key to Himself ([[Rev. 3:7]]).

thread: |
  Isaiah 22 is about **looking in the wrong direction**.

  In the first half, Jerusalem has gone up on its rooftops, “a joyous city” (verse 2), sure of itself. But Isaiah refuses to join the party. He weeps bitterly (verse 4), because he sees what’s coming, and because he sees what’s missing.

  Verses 8–11 list everything Jerusalem did right from a military point of view. They inspected the weapons in “the house of the forest.” They surveyed the breaches in the walls. They collected water in the lower pool. They counted the houses and tore some down to thicken the wall. They built a reservoir between the walls. It was a thorough and competent civil-defense effort. And then comes the verdict: “**but ye have not looked unto the maker thereof, neither had respect unto him that fashioned it long ago**” (verse 11).

  They looked at walls, water, and weapons, everything except God. And when the Lord called them to repentance, they threw a feast: “let us eat and drink; for to morrow we shall die” (verse 13).

  The second half tells the same story through two men. **Shebna** looked at himself. He was carving a magnificent tomb to secure his legacy (verse 16), and he will be tossed away “like a ball” (verse 18). **Eliakim** is called “my servant,” receives the robe and the key, and becomes “a nail in a sure place” (verses 20–23). Even he, as the final verses warn, can bear only so much weight. The only one who can hold everything hung on Him is the true Holder of the key.

sections:
  - range: 1-7
    heading: A city partying on its rooftops
    plain: |
      This is the oracle about the Valley of Vision. What is wrong with you, that you have all gone up to the rooftops? You noisy, excited, partying city! Your dead didn’t die by the sword or in battle. All your leaders ran away together and were captured without a shot from a bow. Everyone who was caught was taken prisoner, even those who fled far away. So I said, “Look away from me; let me weep bitterly. Don’t try to comfort me over the destruction of my people.” For the Lord God of hosts has a day of panic, trampling, and confusion in the Valley of Vision, a day of battering down walls and crying out to the mountains. Elam takes up the quiver, with chariots and horsemen, and Kir uncovers the shield. Your finest valleys are full of chariots, and horsemen take positions at the gates.
  - range: 8-14
    heading: Everything but God
    plain: |
      Judah’s defenses were stripped away. In that day you looked to the weapons in the House of the Forest. You saw the many breaches in the walls of the City of David. You stored water in the lower pool. You counted the houses of Jerusalem and tore some down to strengthen the wall. You built a reservoir between the two walls for the water of the old pool. But you did not look to the One who made it, or consider the One who fashioned it long ago. In that day the Lord God of hosts called you to weep and mourn, to shave your heads and wear sackcloth. Instead there was celebration and joy, slaughtering cattle and sheep, eating meat and drinking wine: “Let’s eat and drink, for tomorrow we die!” The Lord of hosts revealed this in my hearing: “This sin will not be atoned for as long as you live.”
  - range: 15-25
    heading: Shebna and Eliakim
    plain: |
      The Lord God of hosts says: “Go to Shebna, the steward in charge of the palace, and say: What are you doing here, and who gave you permission to cut out a tomb for yourself here, carving a grave on the heights and a resting place in the rock? The Lord is about to grab you and hurl you away. He will roll you up tightly like a ball and throw you into a wide land. There you will die, and your splendid chariots will be there too, a disgrace to your master’s house. I will remove you from office and pull you down from your position. In that day I will call My servant Eliakim son of Hilkiah. I will dress him in your robe, fasten your sash on him, and hand your authority over to him. He will be a father to the people of Jerusalem and the house of Judah. I will place the key of the house of David on his shoulder. What he opens, no one can shut; what he shuts, no one can open. I will drive him like a peg into a firm place, and he will be a seat of honor for his father’s house. They will hang on him the whole weight of his father’s house: all its descendants and relatives, all the small vessels, from bowls to jars. In that day,” says the Lord of hosts, “the peg driven into the firm place will give way. It will be cut off and fall, and the load hanging on it will crash down. The Lord has spoken.”

notes:
  - ref: 1
    phrase: The burden of the valley of vision
    kind: words
    title: The valley of vision
    body: |
      “The valley of vision” names Jerusalem: it was Isaiah’s home and the place where he received his visions and revelations. The title sets up the oracle’s irony, since the city of visions cannot see what matters (verse 11).

      Jesus lamented the same blindness: “If thou hadst known, even thou, at least in this thy day, the things which belong unto thy peace! but now they are hid from thine eyes” ([[Luke 19:42]]).
    sources: [ot-manual-14, lds-scriptures]
  - ref: 1
    phrase: that thou art wholly gone up to the housetops
    kind: history
    title: Celebrating on the rooftops
    body: |
      Houses in Jerusalem had flat roofs, and people could gather on them ([[Judg. 16:27]]). Here the whole city goes up, and one reading is that they look out together at the approaching army, eager for battle and sure of victory.

      Isaiah can’t join them. He sees that their leaders ran away and were captured without a fight (verse 3), and that their confidence is misplaced.
    sources: [delitzsch, lds-scriptures]
  - ref: 4
    phrase: I will weep bitterly, labour not to comfort me
    kind: scripture
    title: Weeping while others celebrate
    body: |
      Isaiah stands apart from the crowd, weeping “because of the spoiling of the daughter of my people.” His words are in the voice of lament, the same note that is continued in Jeremiah’s weeping over the people ([[Jer. 9:1]]; [[Lam. 1:16]]).

      Jesus wept over Jerusalem as His disciples rejoiced and praised God ([[Luke 19:37–41]]).
    sources: [delitzsch, lds-scriptures]
  - ref: 8
    phrase: the armour of the house of the forest
    kind: history
    title: The House of the Forest
    body: |
      This was Solomon’s great hall, “the house of the forest of Lebanon,” so named because of its rows of cedar pillars ([[1 Kgs. 7:2–5]]). Solomon hung gold shields there ([[1 Kgs. 10:16–17]]), and the verse itself shows it holding weapons in Isaiah’s day.

      In the crisis, Judah’s first instinct was to check the arsenal. The problem, as verse 11 makes clear, is preparation *instead of* turning to God.
    sources: [delitzsch, lds-scriptures]
  - ref: 11
    phrase: Ye made also a ditch between the two walls for the water of the old pool
    kind: history
    title: Hezekiah’s water system
    body: |
      Hezekiah “stopped the upper watercourse of Gihon, and brought it straight down to the west side of the city of David” ([[2 Chr. 32:30]]). The tunnel, about 1,770 feet long through limestone rock, brought the Gihon spring’s water inside the walls as a defense against a possible Assyrian attack, and it is still in use today. An inscription near its Siloam end tells how the workmen, digging from both ends, met.

      Isaiah doesn’t condemn the engineering. He condemns the heart behind it.
    sources: [bd-hezekiahs-tunnel, lds-scriptures]
  - ref: 11
    phrase: but ye have not looked unto the maker thereof, neither had respect unto him that fashioned it long ago
    kind: words
    title: The key verse
    body: |
      After a long list of competent preparations, this is the one line that matters. They looked at the walls, the water, the weapons, and the houses. They did not look at **the One who made it** and fashioned it “long ago.”

      The Hebrew verb “looked” (*nabat*) is the same one used in verse 8 (“thou didst look… to the armour”). They looked hard at the wrong thing.
    sources: [biblehub-interlinear]
  - ref: 13
    phrase: let us eat and drink; for to morrow we shall die
    kind: scripture
    title: '“Eat, drink, for tomorrow we die”'
    body: |
      The Lord called for mourning and repentance (verse 12), and the people responded with a feast, indulging their passions rather than repenting.

      Paul quotes the line in his argument about the resurrection ([[1 Cor. 15:32]]). Nephi foresaw that in the last days many would say, “Eat, drink, and be merry, for tomorrow we die; and it shall be well with us” ([[2 Ne. 28:7–8]]), and that others would add that God will justify a little sin.
    sources: [ot-manual-14, lds-scriptures]
  - ref: 15
    phrase: Shebna, which is over the house
    kind: history
    title: A proud steward and his tomb
    body: |
      “Over the house” was the office of steward of the royal household, one closely tied to the king’s own authority. Shebna held that office, and he was using it to cut himself a rock tomb “on high,” a monument to his own importance. Later Shebna appears as “scribe,” with Eliakim over the house ([[Isa. 36:3]]; [[2 Kgs. 18:18]]).
    sources: [delitzsch, bd-eliakim, ot-manual-14]
  - ref: 18
    phrase: toss thee like a ball into a large country
    kind: symbol
    title: Tossed like a ball
    body: |
      Shebna built a tomb to make sure he would be remembered in Jerusalem forever. Instead, the Lord will roll him up tightly and hurl him “like a ball” into a wide land, where he will die far from the tomb he cut. Jesus’ parable of the rich man who built bigger barns ends in a similar reversal: “Thou fool, this night thy soul shall be required of thee” ([[Luke 12:16–21]]).
    sources: [delitzsch, lds-scriptures]
  - ref: 22
    phrase: the key of the house of David will I lay upon his shoulder
    kind: christ
    title: The key of David
    body: |
      Eliakim receives Shebna’s robe, sash, and authority, and above all “the key of the house of David.” The key is placed on his shoulder, not in his hand, because it was the king’s own key; the steward held it only in the king’s stead. The power of the keys included deciding who would be received into the king’s service.

      “He shall open, and none shall shut; and he shall shut, and none shall open.” The risen Christ echoes these words of Himself: “These things saith he that is holy, he that is true, he that hath the key of David, he that openeth, and no man shutteth; and shutteth, and no man openeth” ([[Rev. 3:7]]). The key of the house of David, the right to rule, is a symbol of a right that rests on the holy priesthood and was centered in Christ.

      Latter-day Saints will also think of the priesthood **keys** Jesus gave to Peter ([[Matt. 16:19]]) and restored in our day ([[D&C 27:12–13]]; [[D&C 110:11–16]]), which authorize the opening and sealing of heaven. The Book of Mormon gives the same authority to Nephi the son of Helaman, in words that echo Peter’s: “whatsoever ye shall seal on earth shall be sealed in heaven; and whatsoever ye shall loose on earth shall be loosed in heaven” ([[Hel. 10:7]]). Like Elijah, Nephi used it quite literally to shut the heavens and then to open them again for rain ([[Hel. 11:4–17]]). Because “seal” and “loose” can also mean “close” and “open,” this may be how Nephi understood his power to shut the heavens.
    sources: [delitzsch, ot-manual-14, sc-knowhy-348, sc-knowhy-182, lds-scriptures]
  - ref: 23
    phrase: I will fasten him as a nail in a sure place
    kind: symbol
    title: A peg in a firm place
    body: |
      A “nail” here is a **peg**, and the verse’s comparison is to a tent-peg driven in firmly. Eliakim will be a dependable support, and a seat of honor, for his family.

      Verses 24–25 then add a warning. His relatives will hang their whole weight on him, every cup and every jar, and eventually the peg gives way. Faithful readers differ on what this means. One commentator reads verse 25 as Eliakim’s own fall, through the nepotism his power invited. A Latter-day Saint reading instead takes the nail as messianic, symbolizing the cross, and the Savior as the nail in a sure place on whom the redeemed hang. A different “sure foundation” is named in [[Isa. 28:16]] and [[Hel. 5:12]].
    sources: [delitzsch, ot-manual-14, sc-knowhy-647, lds-scriptures]
christ: |
  Isaiah 22 points to Christ in two ways. First, it exposes what He came to replace: a city that trusted its walls and a steward who trusted his tomb. “Ye have not looked unto the maker thereof” (verse 11), and Christ is the Maker ([[John 1:3]]; [[Mosiah 3:8]]).

  Second, it gives us one of His titles. He is the one who holds “the key of David,” who opens so that no one can shut and shuts so that no one can open ([[Rev. 3:7]]). Eliakim was a faithful servant but a fallible peg. On this reading, Christ is the nail in a sure place, the one on whom the redeemed and their offspring can safely hang.

explore: |
  - **Hezekiah’s preparations.** Read [[2 Chr. 32:1–8]]. Notice that Hezekiah both built walls *and* said, “with us is the LORD our God to help us.” How does that balance compare with the people in Isaiah 22?
  - **The key of David.** Compare Isaiah 22:20–23 with [[Rev. 3:7–8]] and [[Matt. 16:18–19]].
  - **Shebna and Eliakim later.** Follow them in [[Isa. 36:3]], [[Isa. 36:22]], and [[Isa. 37:2]].

