chapter: 22
title: The Valley of Vision and the Key of David
tagline: Jerusalem parties on its rooftops and fortifies its walls but never looks to its Maker, and a proud steward is replaced by a servant who holds the key.
when: 'Probably c. 701 BC, around Sennacherib’s invasion'

setting: |
  After oracles against Babylon, Moab, Damascus, Egypt, and Arabia, Isaiah turns to a surprising target: **Jerusalem itself**, which he calls “the valley of vision.” The irony is intentional. The city of prophets and visions has become spiritually blind.

  The historical setting is almost certainly the Assyrian crisis around 701 BC. Verses 8–11 describe exactly the defensive measures Hezekiah took when Sennacherib invaded: checking the arsenal, repairing breaches in the wall, tearing down houses to strengthen it, and redirecting the water supply ([[2 Chr. 32:2–5]]; [[2 Kgs. 20:20]]). Archaeologists have found evidence of each.

  The second half of the chapter (verses 15–25) zooms in on two officials in Hezekiah’s court. **Shebna**, a proud steward, is building himself a grand tomb. **Eliakim**, a faithful servant, will replace him and receive “the key of the house of David.” These verses become important in the New Testament, where the Savior applies the key to Himself ([[Rev. 3:7]]).

thread: |
  Isaiah 22 is about **looking in the wrong direction**.

  In the first half, Jerusalem is celebrating on its rooftops, “a joyous city” (verse 2), perhaps because the Assyrian army withdrew or seemed to. But Isaiah refuses to join the party. He weeps bitterly (verse 4), because he sees what’s coming, and because he sees what’s missing.

  Verses 8–11 list everything Jerusalem did right from a military point of view. They inspected the weapons in “the house of the forest.” They surveyed the breaches in the walls. They collected water in the lower pool. They counted the houses and tore some down to thicken the wall. They built a reservoir between the walls. It was a thorough and competent civil-defense effort. And then comes the verdict: “**but ye have not looked unto the maker thereof, neither had respect unto him that fashioned it long ago**” (verse 11).

  They looked at walls, water, and weapons, everything except God. And when the Lord called them to repentance, they threw a feast: “let us eat and drink; for to morrow we shall die” (verse 13).

  The second half tells the same story through two men. **Shebna** looked at himself. He was carving a magnificent tomb to secure his legacy (verse 16), and he will be tossed away “like a ball” (verse 18). **Eliakim** is called “my servant,” receives the robe and the key, and becomes “a nail in a sure place” (verses 20–23). Even he, as the final verses warn, can bear only so much weight. The only one who can hold everything hung on Him is the true Holder of the key.

sections:
  - range: 1-7
    heading: A city partying on its rooftops
    plain: |
      This is the oracle about the Valley of Vision. What is wrong with you, that you have all gone up to the rooftops? You noisy, excited, partying city! Your dead didn’t die by the sword or in battle. All your leaders ran away together and were captured without a shot from a bow. Everyone who was caught was taken prisoner, even those who fled far away. So I said, “Look away from me; let me weep bitterly. Don’t try to comfort me over the destruction of my people.” For the Lord God of hosts has a day of panic, trampling, and confusion in the Valley of Vision, a day of battering down walls and crying out to the mountains. Elam takes up the quiver, with chariots and horsemen, and Kir uncovers the shield. Your finest valleys are full of chariots, and horsemen take positions at the gates.
  - range: 8-14
    heading: Everything but God
    plain: |
      Judah’s defenses were stripped away. In that day you looked to the weapons in the House of the Forest. You saw the many breaches in the walls of the City of David. You stored water in the lower pool. You counted the houses of Jerusalem and tore some down to strengthen the wall. You built a reservoir between the two walls for the water of the old pool. But you did not look to the One who made it, or consider the One who planned it long ago. In that day the Lord God of hosts called you to weep and mourn, to shave your heads and wear sackcloth. Instead there was celebration and joy, slaughtering cattle and sheep, eating meat and drinking wine: “Let’s eat and drink, for tomorrow we die!” The Lord of hosts revealed this in my hearing: “This sin will not be atoned for as long as you live.”
  - range: 15-25
    heading: Shebna and Eliakim
    plain: |
      The Lord God of hosts says: “Go to Shebna, the steward in charge of the palace, and say: What are you doing here, and who gave you permission to cut out a tomb for yourself here, carving a grave on the heights and a resting place in the rock? The Lord is about to grab you and hurl you away. He will roll you up tightly like a ball and throw you into a wide land. There you will die, and your splendid chariots will be there too, a disgrace to your master’s house. I will remove you from office and pull you down from your position. In that day I will call My servant Eliakim son of Hilkiah. I will dress him in your robe, fasten your sash on him, and hand your authority over to him. He will be a father to the people of Jerusalem and the house of Judah. I will place the key of the house of David on his shoulder. What he opens, no one can shut; what he shuts, no one can open. I will drive him like a peg into a firm place, and he will be a seat of honor for his father’s house. They will hang on him the whole weight of his father’s house: all its descendants and relatives, all the small vessels, from bowls to jars. In that day,” says the Lord of hosts, “the peg driven into the firm place will give way. It will be cut off and fall, and the load hanging on it will crash down. The Lord has spoken.”

notes:
  - ref: 1
    phrase: The burden of the valley of vision
    kind: words
    title: The valley of vision
    body: |
      Jerusalem sits on hills, not in a valley, though it is surrounded by valleys (Kidron, Hinnom, and the central Tyropoeon). “Valley of vision” is probably an ironic title. Jerusalem was the place of visions, the city where prophets like Isaiah saw the Lord. But in this oracle it can’t see what matters.

      Jesus lamented the same blindness: “If thou hadst known, even thou, at least in this thy day, the things which belong unto thy peace! but now they are hid from thine eyes” ([[Luke 19:42]]).
  - ref: 1
    phrase: that thou art wholly gone up to the housetops
    kind: history
    title: Celebrating on the rooftops
    body: |
      Houses in Jerusalem had flat roofs used as living space, and people gathered on them to watch events in the streets or to celebrate ([[Judg. 16:27]]). Here the whole city is on the rooftops cheering. Perhaps the Assyrian army had withdrawn for a moment, or perhaps they were celebrating a temporary reprieve.

      Isaiah can’t join them. He sees that their leaders ran away and were captured without a fight (verse 3), and that the real danger hasn’t passed. There is a kind of celebration that is really denial.
  - ref: 4
    phrase: I will weep bitterly, labour not to comfort me
    kind: liken
    title: Weeping while others celebrate
    body: |
      Isaiah stands apart from the crowd, weeping “because of the spoiling of the daughter of my people.” The phrase “daughter of my people” is tender, the language of a parent grieving over a child.

      Being out of step with a celebrating crowd is lonely. Prophets often are. Jeremiah was called “the weeping prophet” for the same reason ([[Jer. 9:1]]; [[Lam. 1:16]]). Jesus wept over Jerusalem as the crowds shouted hosanna ([[Luke 19:37–41]]).
  - ref: 8
    phrase: the armour of the house of the forest
    kind: history
    title: The House of the Forest
    body: |
      This was Solomon’s great hall, “the house of the forest of Lebanon,” so named because of its rows of cedar pillars ([[1 Kgs. 7:2–5]]). Solomon hung gold shields there ([[1 Kgs. 10:16–17]]), and by Isaiah’s day it apparently served as the royal armory.

      In the crisis, Judah’s first instinct was to check the arsenal. There’s nothing wrong with preparation. The problem, as verse 11 makes clear, is preparation *instead of* turning to God.
  - ref: 10
    phrase: the houses have ye broken down to fortify the wall
    kind: history
    title: The Broad Wall
    body: |
      This verse has been strikingly confirmed by archaeology. In the 1970s, excavations in Jerusalem’s Jewish Quarter led by Nahman Avigad uncovered a massive section of city wall about seven meters (23 feet) thick, now called the **Broad Wall**. It dates to the late 700s BC, the time of Hezekiah, and it was built right through the foundations of existing houses, which were demolished to make room for it.

      You can still see a section of it in Jerusalem today. It is a physical reminder of Isaiah’s point. The people worked very hard on their walls. What they neglected was the Maker.
  - ref: 11
    phrase: Ye made also a ditch between the two walls for the water of the old pool
    kind: history
    title: Hezekiah’s water system
    body: |
      Water was Jerusalem’s greatest vulnerability in a siege, because its main spring, the Gihon, lay outside the walls. Hezekiah “stopped the upper watercourse of Gihon, and brought it straight down to the west side of the city of David” ([[2 Chr. 32:30]]) through a tunnel carved over 530 meters (1,750 feet) through solid rock. It still carries water today. An inscription carved by the workmen describing the moment the two tunneling teams met was found in 1880.

      Isaiah doesn’t condemn the engineering. He condemns the heart behind it.
    sources: [siloam-inscription, bd-siloam, bd-hezekiah]
  - ref: 11
    phrase: but ye have not looked unto the maker thereof, neither had respect unto him that fashioned it long ago
    kind: liken
    title: The key verse
    body: |
      After a long list of competent preparations, this is the one line that matters. They looked at the walls, the water, the weapons, and the houses. They did not look at **the One who made it all** and who planned these events “long ago.”

      The Hebrew verb “looked” (*nabat*) is the same one used in verse 8 (“thou didst look… to the armour”). They looked hard at the wrong thing. It’s easy to do the same: to put enormous effort into our own defenses while giving the Lord a passing glance. The Lord’s counsel in modern times is to prepare *and* to trust: “if ye are prepared ye shall not fear” ([[D&C 38:30]]), and “seek ye first the kingdom of God” ([[3 Ne. 13:33]]).
  - ref: 13
    phrase: let us eat and drink; for to morrow we shall die
    kind: restoration
    title: '“Eat, drink, for tomorrow we die”'
    body: |
      The Lord called for mourning and repentance (verse 12), and the people responded with a feast, fatalistic and defiant: *if we’re going to die anyway, let’s enjoy ourselves.*

      The line became proverbial. Paul quoted it to show what life looks like without faith in the resurrection ([[1 Cor. 15:32]]). Nephi foresaw that in the last days many would say, “Eat, drink, and be merry, for tomorrow we die; and it shall be well with us” ([[2 Ne. 28:7–8]]), and that others would add that God will justify a little sin. The attitude hasn’t changed in 2,700 years.
  - ref: 15
    phrase: Shebna, which is over the house
    kind: history
    title: A proud steward and his tomb
    body: |
      “Over the house” was the title of the royal steward, the highest official in the palace, something like a prime minister. Shebna held that office, and he was using it to build himself a magnificent rock-cut tomb “on high,” a monument to his own importance.

      Archaeologists found a fascinating inscription in the village of Silwan, across the Kidron Valley from ancient Jerusalem. Carved over a rock-cut tomb, it reads that this is the tomb of “…yahu who is over the house.” The beginning of the name is broken off. Some scholars have suggested it was Shebna’s tomb (Shebnayahu is a longer form of the name). It can’t be proven, but it fits remarkably well. Later, Shebna appears demoted to “scribe,” with Eliakim as steward ([[Isa. 36:3]]; [[2 Kgs. 18:18]]).
  - ref: 18
    phrase: toss thee like a ball into a large country
    kind: symbol
    title: Tossed like a ball
    body: |
      Shebna built a tomb to make sure he would be remembered in Jerusalem forever. Instead, the Lord will roll him up tightly and hurl him “like a ball” into a wide land, perhaps a prophecy of exile, where he will die far from his fancy tomb.

      It’s a vivid picture of how fragile our efforts to secure our own legacy are. Jesus told a parable about a rich man who built bigger barns, and God said to him, “Thou fool, this night thy soul shall be required of thee” ([[Luke 12:16–21]]).
  - ref: 22
    phrase: the key of the house of David will I lay upon his shoulder
    kind: christ
    title: The key of David
    body: |
      Eliakim receives Shebna’s robe, sash, and authority, and above all “the key of the house of David.” In ancient palaces, keys were large wooden objects, and the steward might literally carry one on his shoulder as a badge of office. Whoever held the key controlled access to the king.

      “He shall open, and none shall shut; and he shall shut, and none shall open.” The risen Christ applies these exact words to Himself: “These things saith he that is holy, he that is true, he that hath the key of David, he that openeth, and no man shutteth; and shutteth, and no man openeth” ([[Rev. 3:7]]). He is the true steward of the house of David, the one who controls access to the Father.

      Latter-day Saints will also think of the priesthood **keys** Jesus gave to Peter ([[Matt. 16:19]]) and restored in our day ([[D&C 27:12–13]]; [[D&C 110:11–16]]), which authorize the opening and sealing of heaven.
  - ref: 23
    phrase: I will fasten him as a nail in a sure place
    kind: symbol
    title: A peg in a firm place
    body: |
      A “nail” here is a **peg**, a wooden or metal peg driven firmly into a wall to hang household vessels on. Eliakim will be a dependable support on which his family can hang its honor. Some readers have seen in the phrase a foreshadowing of the nails of the crucifixion, but the Hebrew picture is simply a secure peg.

      Verses 24–25 then add a warning. His relatives will hang their whole weight on him, every cup and every jar, and eventually even this secure peg gives way. No human leader, however faithful, can bear the full weight of everyone’s hopes. There is only one “sure foundation” that can ([[Isa. 28:16]]; [[Hel. 5:12]]).

christ: |
  Isaiah 22 points to Christ in two ways. First, it exposes what He came to replace: a city that trusted its walls and a steward who trusted his tomb. “Ye have not looked unto the maker thereof” (verse 11), and Christ is the Maker ([[John 1:3]]; [[Mosiah 3:8]]).

  Second, it gives us one of His titles. He is the one who holds “the key of David,” who opens so that no one can shut and shuts so that no one can open ([[Rev. 3:7]]). Eliakim was a faithful servant but a fallible peg. Christ is the peg that never gives way, the one on whom the whole weight of His Father’s house can safely hang.

liken: |
  - In my current challenges, where am I “looking”? Am I checking my walls, water, and weapons more carefully than I’m seeking the Lord (verse 11)?
  - Is there any way I’m building a “tomb on high,” investing in my own legacy or reputation more than in the Lord’s work?
  - Am I hanging more weight on a human “peg” (a leader, a spouse, a friend) than any person can bear? What would it mean to hang it on Christ instead?
  - When the Lord calls to repentance, do I respond with sackcloth or with a feast?

explore: |
  - **Hezekiah’s preparations.** Read [[2 Chr. 32:1–8]]. Notice that Hezekiah both built walls *and* said, “with us is the LORD our God to help us.” How does that balance compare with the people in Isaiah 22?
  - **The key of David.** Compare Isaiah 22:20–23 with [[Rev. 3:7–8]] and [[Matt. 16:18–19]].
  - **Shebna and Eliakim later.** Follow them in [[Isa. 36:3]], [[Isa. 36:22]], and [[Isa. 37:2]].

sources: [bd-eliakim, bd-hezekiah, bd-jerusalem, siloam-inscription, ot-manual-14, oswalt]
