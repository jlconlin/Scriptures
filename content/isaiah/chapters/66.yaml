chapter: 66
title: As One Whom His Mother Comforteth
tagline: The Lord who fills heaven and earth looks for a humble heart that trembles at His word; Zion gives birth to a nation in a day; the Lord comforts His people as a mother; and survivors are sent to the ends of the earth to gather the nations.
when: 'Setting: the community in Judah, late sixth century BC; the last chapter of the book'

setting: |
  The last chapter of Isaiah finishes the Lord’s answer to the lament of 63:7–64:12 and brings the whole book to a close. It gathers threads from everywhere. It opens with the temple (verses 1–2), as chapter 56 did; it returns to the divided community of chapter 65, “ye that tremble at his word” and the brethren who cast them out (verse 5); it pictures Zion as a mother, as chapters 49–54 did; and it ends where chapter 56 began, with foreigners brought to the holy mountain and some of them made priests (verses 18–21).

  The chapter also echoes the book’s first chapter. Isaiah 1 began with rebels who “have rebelled against me,” worship the Lord did not want, sacred gardens, and a fire that “none shall quench” ([[Isa. 1:2]]; [[Isa. 1:11–15]]; [[Isa. 1:29–31]]). Chapter 66 ends with the same things: rejected sacrifices (verse 3), gardens (verse 17), and the men that “have transgressed against me,” in the same Hebrew phrase, whose fire “shall not be quenched” (verse 24), with the same Hebrew verb as chapter 1’s “none shall quench.” The book ends where it began.

  Jesus quoted the last verse in His warning about hell ([[Mark 9:43–48]]), and Stephen quoted the first verse in his defense before the Sanhedrin ([[Acts 7:48–50]]).

thread: |
  Isaiah 66 is about **what the Lord looks for**.

  He does not need anything people can build. Heaven is His throne and the earth His footstool; His hand made everything (verses 1–2). What He looks at is a person: “him that is poor and of a contrite spirit, and trembleth at my word” (verse 2). Sacrifice without that heart is no better than murder or idolatry (verse 3).

  The rest of the chapter shows what the Lord does for such people. Those who tremble at His word have been cast out by their own brethren; He promises to appear to their joy (verse 5). Zion, who seemed barren, gives birth before her labor even begins (verses 7–9). The Lord comforts His people “as one whom his mother comforteth” (verse 13). And He sends survivors out to the farthest nations, to bring back their brothers and sisters as an offering, and He takes some of the foreigners for priests (verses 18–21).

  The book that began with a rebellious people ends with a gathered one: “all flesh” coming to worship, Sabbath after Sabbath (verse 23). The final verse is a sober reminder that the invitation can be refused. But the Lord has been looking all along for the humble, and the chapter ends with the whole world invited to join them.

sections:
  - range: 1-6
    heading: The heart that trembles at My word
    plain: |
      This is what the Lord says: Heaven is My throne, and the earth is My footstool. What house could you build for Me? Where would My resting place be? My hand made all these things, and so they came to be, says the Lord. But this is the one I look to: the one who is humble and contrite in spirit and trembles at My word. Whoever slaughters an ox also kills a person; whoever sacrifices a lamb also breaks a dog’s neck; whoever presents a grain offering also offers pig’s blood; whoever burns incense also praises an idol. They have chosen their own ways and delight in their abominations. So I will choose harsh treatment for them and bring on them what they fear. For when I called, no one answered; when I spoke, they did not listen. They did evil in My sight and chose what does not please Me. Hear the word of the Lord, you who tremble at His word: Your own people who hate you and exclude you because of My name have said, “Let the Lord be glorified, so that we may see your joy!” But they will be put to shame. Listen! An uproar from the city, a sound from the temple! It is the sound of the Lord repaying His enemies what they deserve.
  - range: 7-14
    heading: A nation born in a day
    plain: |
      Before she went into labor, she gave birth; before her pains came, she delivered a son. Who has ever heard of such a thing? Who has ever seen such things? Can a land be born in a single day, or a nation be delivered in a moment? Yet no sooner was Zion in labor than she gave birth to her children. “Would I bring to the moment of birth and not deliver?” says the Lord. “Would I, who deliver, close the womb?” says your God. Rejoice with Jerusalem and be glad for her, all you who love her; rejoice greatly with her, all you who mourned over her, so that you may nurse and be satisfied at her comforting breasts, drink deeply and delight in her overflowing abundance. For this is what the Lord says: I will extend peace to her like a river, and the wealth of nations like a flooding stream. You will nurse and be carried on her hip and bounced on her knees. As a mother comforts her child, so I will comfort you, and you will be comforted over Jerusalem. When you see this, your heart will rejoice, and your bodies will flourish like grass. The Lord’s hand will be made known to His servants, and His fury to His enemies.
  - range: 15-17
    heading: The Lord comes with fire
    plain: |
      Look, the Lord will come with fire, and His chariots are like a whirlwind, to repay with furious anger and to rebuke with flames of fire. For with fire and with His sword the Lord will judge all flesh, and many will be slain by the Lord. Those who consecrate and purify themselves to enter the gardens, following one in the center, who eat pork, vermin, and mice, will come to an end together, says the Lord.
  - range: 18-24
    heading: All flesh will come to worship
    plain: |
      I know their deeds and their thoughts. The time is coming to gather all nations and languages, and they will come and see My glory. I will set a sign among them, and I will send some of those who survive to the nations: to Tarshish, to Put and Lud (famous archers), to Tubal and Greece, and to the distant islands that have not heard of My fame or seen My glory. They will proclaim My glory among the nations. And they will bring all your brothers and sisters from all the nations as an offering to the Lord, on horses, in chariots and wagons, on mules and camels, to My holy mountain in Jerusalem, says the Lord, just as the Israelites bring their grain offerings to the house of the Lord in clean vessels. And I will take some of them also as priests and Levites, says the Lord. For just as the new heavens and the new earth that I make will endure before Me, says the Lord, so your descendants and your name will endure. From one New Moon to the next and from one Sabbath to the next, all humanity will come to worship before Me, says the Lord. And they will go out and look on the corpses of those who rebelled against Me. Their worm will not die, their fire will not be quenched, and they will be loathsome to all humanity.

notes:
  - ref: 1
    phrase: 'The heaven is my throne, and the earth is my footstool: where is the house that ye build unto me?'
    kind: christ
    title: A house for the Lord?
    body: |
      At the dedication of the first temple, Solomon asked the same question: “will God indeed dwell on the earth? behold, the heaven and heaven of heavens cannot contain thee; how much less this house that I have builded?” ([[1 Kgs. 8:27]]). Isaiah’s audience was rebuilding the temple after the exile, and the Lord reminds them that no building can hold Him. That is not a rejection of the temple; the next verses assume a working temple, and the chapter ends with worship in it (verses 20–23). It is a warning against thinking that the building itself secures His presence.

      Verse 3 makes the warning sharp. The Hebrew sets pairs side by side with no connecting words: “slaughterer of an ox, killer of a man; sacrificer of a lamb, breaker of a dog’s neck.” The King James Version supplies “as if” (in italics), and modern translations such as the NRSVUE and NIV supply “like”: sacrifice offered without the right heart is as bad as murder. The point is the one Isaiah made at the start of the book: “To what purpose is the multitude of your sacrifices unto me?” ([[Isa. 1:11]]).

      Jesus used the first line when He taught His disciples not to swear oaths: “neither by heaven; for it is God’s throne: Nor by the earth; for it is his footstool” ([[Matt. 5:34–35]]). Stephen quoted verses 1–2 to the council that would stone him: “the most High dwelleth not in temples made with hands” ([[Acts 7:48–50]]). Jesus had said of His own body, “Destroy this temple, and in three days I will raise it up” ([[John 2:19]]). The place the Lord chose to dwell was finally a person.
    sources: [mt-sefaria, kjv-blb, nrsvue, niv, delitzsch]
  - ref: 2
    phrase: to him that is poor and of a contrite spirit, and trembleth at my word
    kind: words
    title: Those who tremble at His word
    body: |
      This is the chapter’s answer to the question of verse 1. The Lord who fills heaven and earth looks with favor on “him that is poor (*ʿānî*) and of a contrite spirit (*nəkēh-rûaḥ*).” It is the same humble person with whom He promised to dwell in [[Isa. 57:15]]. And one more description is added: he “trembleth at my word.”

      “Trembleth” is *ḥārēd*. The word appears again in verse 5, “ye that tremble at his word,” and in the book of Ezra, where it describes the faithful who supported Ezra’s reforms: “every one that trembled at the words of the God of Israel” ([[Ezra 9:4]]; compare [[Ezra 10:3]]). Today the most strictly observant Jews are called *Ḥaredim*, “those who tremble” in the presence of God, the same word as in verse 5.

      Trembling at the word is not terror. It is taking the word so seriously that it shakes you. The Book of Mormon describes the same humility in those who received King Benjamin’s words: they had “viewed themselves in their own carnal state, even less than the dust of the earth,” and cried for mercy ([[Mosiah 4:2]]). The Lord asks for “a broken heart and a contrite spirit” ([[3 Ne. 9:20]]). A person like that is the Lord’s real house.
    sources: [mt-sefaria, southwood-foreigner, britannica-ultra-orthodox]
  - ref: 5
    phrase: Your brethren that hated you, that cast you out for my name’s sake
    kind: words
    title: Cast out by their brethren
    body: |
      This verse shows a painful situation inside the community. The people who tremble at the Lord’s word have been rejected by their own “brethren,” who hate them and “cast you out” (*mənaddêkem*, “thrust away, exclude from association in worship”; the same root later gave the term for formal excommunication, *niddûy*). The persecutors even mock them in pious language: “Let the LORD be glorified,” that is, “If your God is so great, let Him show it.”

      The Lord answers: “he shall appear to your joy, and they shall be ashamed.” The faithful will be vindicated, and those who excluded them will be embarrassed.

      Jesus warned His disciples of the same experience: “They shall put you out of the synagogues: yea, the time cometh, that whosoever killeth you will think that he doeth God service” ([[John 16:2]]). And He blessed them for it: “Blessed are ye, when men shall hate you, and when they shall separate you from their company… for the Son of man’s sake” ([[Luke 6:22]]). Latter-day Saints who remember the early persecutions, or who have been rejected by family or friends for their faith, will recognize the verse. It also carries a warning for insiders. The people who cast out others “for my name’s sake” were sure they were defending God.
    sources: [mt-sefaria, bdb, delitzsch]
  - ref: 8
    phrase: 'for as soon as Zion travailed, she brought forth her children'
    kind: symbol
    title: A nation born in a day
    body: |
      Zion gives birth without labor pains, all at once: “shall a nation be born at once?” The image answers a cry from much earlier in the book. When the Assyrians surrounded Jerusalem, King Hezekiah sent messengers to Isaiah saying, “the children are come to the birth, and there is not strength to bring forth” ([[Isa. 37:3]]). It was a picture of total helplessness: a mother in labor too weak to deliver. The people of chapter 26 said the same: “we have been in pain, we have as it were brought forth wind” ([[Isa. 26:18]]).

      Verse 9 answers them directly: “Shall I bring to the birth, and not cause to bring forth? saith the LORD.” The Lord does not start what He will not finish. The barren woman of chapter 54, who was told to “enlarge the place of thy tent” ([[Isa. 54:1–2]]), now has her children, and they come all at once.

      Revelation uses a similar image of a woman who gives birth to a “man child” ([[Rev. 12:1–5]]). Joseph Smith’s inspired revision of that chapter identifies the woman as the Church and the child as “the kingdom of our God and his Christ.” The birth of Zion’s children is the sudden gathering of a people that the Lord has been preparing through centuries of labor.
    sources: [jst-rev-12]
  - ref: 13
    phrase: As one whom his mother comforteth, so will I comfort you
    kind: christ
    title: Comfort, at the end
    body: |
      The second half of Isaiah opened with “Comfort ye, comfort ye my people” ([[Isa. 40:1]]). The verb, *niḥam*, runs through the chapters that follow ([[Isa. 49:13]]; [[Isa. 51:3]]; [[Isa. 51:12]]; [[Isa. 52:9]]; [[Isa. 61:2]]), and here it appears three times in one verse, its last use in the book. The comfort promised at the beginning is delivered at the end.

      And the Lord compares Himself to a mother. Verses 11–12 picture Jerusalem as a nursing mother, with her children fed, carried on her hip, and bounced on her knees. Verse 13 moves from the city to the Lord Himself: “As one whom his mother comforteth, so will I comfort you.” Isaiah has used this kind of image before: “Can a woman forget her sucking child… yet will I not forget thee” ([[Isa. 49:15]]); and “now will I cry like a travailing woman” ([[Isa. 42:14]]). The God of Isaiah is described as a warrior (chapter 63), a husband (chapter 54), a father (chapters 63–64), and here a mother. None of these images is enough alone.

      Jesus used a maternal image of Himself as He wept over Jerusalem: “how often would I have gathered thy children together, even as a hen gathereth her chickens under her wings” ([[Matt. 23:37]]), and He said it again to the Nephites after the great destruction ([[3 Ne. 10:4–6]]). He also promised “another Comforter” ([[John 14:16]]), the Holy Ghost, so that the comfort would continue.
    sources: [mt-sefaria]
  - ref: 19
    phrase: I will send those that escape of them unto the nations
    kind: history
    title: Sent to the nations
    body: |
      This verse is one of the clearest pictures in the Old Testament of missionaries being sent to other nations. The Lord will “set a sign” among the gathered peoples and send “those that escape,” the survivors, to places that “have not heard my fame, neither have seen my glory.” The list reaches the edges of the known world: Tarshish in the far west (probably Tartessus in Spain), Pul (the Septuagint reads Put), Lud, Tubal, Javan (the Septuagint translates it “Greece”), and “the isles afar off.” All but Pul appear in the table of nations ([[Gen. 10:2–22]]). Those who survived judgment become the ones who carry the news.

      Then comes a striking reversal (verse 20): the nations bring “all your brethren” back to Jerusalem “for an offering unto the LORD… in a clean vessel.” The scattered Israelites are brought home by Gentiles, as a pure offering. Paul described his own mission to the Gentiles in the same terms, as a priestly service “that the offering up of the Gentiles might be acceptable” ([[Rom. 15:16]]), and he planned to go as far as Spain ([[Rom. 15:24]]).

      The Restoration continues the pattern. The Lord commanded, “send forth the elders of my church unto the nations which are afar off; unto the islands of the sea” ([[D&C 133:8]]), and He added from Isaiah, “be ye clean that bear the vessels of the Lord” ([[D&C 133:5]]).
    sources: [mt-sefaria, lxx-rahlfs, delitzsch, bd-tarshish]
  - ref: 21
    phrase: And I will also take of them for priests and for Levites, saith the LORD
    kind: history
    title: Foreigners as priests
    body: |
      This is the most surprising promise in the chapter. In Israel, priests had to be descendants of Aaron, and Levites of Levi. After the exile, the returning community checked genealogies carefully, and men who could not prove their descent were, “as polluted, put from the priesthood” ([[Ezra 2:62]]). Here the Lord says He will take priests and Levites from among “them.” Some have taken “them” to mean the returning Israelites; but that would promise nothing new, and the more natural reading is the nations who bring Israel home (verse 20).

      The promise completes the frame of Isaiah 56–66. Chapter 56 opened with the foreigner who had “joined himself” (*nilwâ*, the verb behind the name Levi) to the Lord, and promised that his sacrifices would be accepted on the altar ([[Isa. 56:6–7]]). Chapter 61 called Israel “the Priests of the LORD” ([[Isa. 61:6]]). Now foreigners themselves become priests and Levites. The circle of those who may serve has widened as far as it can go.

      Verses 22–23 then promise that the new people will last as long as the new heavens and new earth, and that “all flesh” will come to worship “from one sabbath to another.” The Sabbath, the covenant sign that the foreigner and the eunuch kept in chapter 56 ([[Isa. 56:4–6]]), becomes the rhythm of the whole world’s worship.
    sources: [delitzsch]
  - ref: 24
    phrase: for their worm shall not die, neither shall their fire be quenched
    kind: words
    title: The last verse
    body: |
      The book ends with a hard image. The worshippers go out from Jerusalem and see the bodies of those who rebelled, with worms and fire that never end. The picture is probably drawn from the Valley of Hinnom below the city, the place of child sacrifice ([[Isa. 57:5]]; [[Jer. 7:31]]). Jeremiah prophesied that it would be renamed “the valley of slaughter” and filled with the dead ([[Jer. 7:32]]), so by Lehi’s time the valley was already tied in people’s minds to burning and judgment. Its Hebrew name, *gê hinnōm*, became *Gehenna*, the New Testament word for hell.

      Jesus quoted this verse three times in one saying, warning His disciples to cut off whatever causes them to sin rather than “be cast into hell fire: Where their worm dieth not, and the fire is not quenched” ([[Mark 9:47–48]]). Latter-day revelation applies the same words to the sons of perdition: “where their worm dieth not, and the fire is not quenched” ([[D&C 76:44]]).

      What is the fire? King Benjamin, who knew the image, was careful to use it as a comparison. The unrepentant feel guilt, pain, and anguish “like an unquenchable fire” ([[Mosiah 2:38]]), and he explains its source: an “awful view of their own guilt and abominations, which doth cause them to shrink from the presence of the Lord” ([[Mosiah 3:25]]). The fire is the soul’s own knowledge of what it has done, in the presence of a holy God. Latter-day revelation adds that “endless” and “eternal” describe God’s punishment, not necessarily its length: “Endless is my name” ([[D&C 19:6–12]]).

      The last word of the book, “abhorring” (*dērāʾôn*), appears in only one other place in the Bible: “some to everlasting life, and some to shame and everlasting contempt” ([[Dan. 12:2]]). Jewish tradition has long felt the weight of this ending. When the book is read aloud in the synagogue, verse 23 is repeated after verse 24, so that the reading ends with all flesh coming to worship before the Lord. That is a fair reading of the chapter too. The warning is real, but it is not the Lord’s last word to those who tremble at His word.
    sources: [mt-sefaria, bdb, delitzsch, sc-knowhy-81]

christ: |
  The Lord who says “heaven is my throne” came to dwell in a body, a temple not made with hands ([[John 2:19–21]]). He looks for the humble who tremble at His word, and He was Himself cast out by His own ([[John 1:11]]). He comforts His people like a mother and would gather them like a hen gathers her chicks ([[Matt. 23:37]]; [[3 Ne. 10:4–6]]). He sent His disciples “unto the uttermost part of the earth” ([[Acts 1:8]]), and in the latter days He sends them again. And He is the one who warned most clearly of the worm that does not die, because He came to save people from it.

liken: |
  - Do I tremble at the Lord’s word, taking it seriously enough to be changed by it?
  - Have I ever been “cast out” for my faith, or have I ever cast someone out while sure I was defending God?
  - Where have I felt, like Hezekiah, that the children had come to the birth with no strength to bring forth? What does verse 9 say to that?
  - How has the Lord comforted me “as one whom his mother comforteth”?
  - Whom could I help bring home, as the nations bring “all your brethren” in verse 20?

explore: |
  - **The book’s frame.** Read [[Isa. 1:1–31]] and then [[Isa. 66:1–24]], looking for repeated words and images.
  - **God’s dwelling.** Read [[1 Kgs. 8:27–30]], [[Isa. 57:15]], [[Isa. 66:1–2]], [[Acts 7:44–50]], and [[John 2:18–22]].
  - **Comfort.** Trace *niḥam* from [[Isa. 40:1–2]] through [[Isa. 49:13–15]], [[Isa. 51:12]], [[Isa. 52:9]], [[Isa. 61:2]], and [[Isa. 66:13]].
  - **The gathering of the nations.** Compare [[Isa. 2:2–4]], [[Isa. 56:6–8]], [[Isa. 60:3–9]], and [[Isa. 66:18–23]].

