chapter: 24
title: The Earth Turned Upside Down
tagline: Because the everlasting covenant is broken, the whole earth reels like a drunkard, until the Lord reigns in Zion so gloriously that the sun is ashamed.
when: 'A vision of the last days'

setting: |
  Chapters 24–27 form one cycle of prophecies, last-days (eschatological) in character. After the oracles against individual nations in chapters 13–23, Isaiah zooms out to the whole earth. The names of particular countries mostly disappear. Instead we hear about “the earth,” “the world,” “the city of confusion,” and “that day.” Critics have long debated when the cycle was written, but its historical details fade into pictures of the last days, and these chapters are read as prophecies of the dispensation of the fulness of times.

  These four chapters alternate between **judgment** and **song**. Chapter 24 describes the earth collapsing under the weight of sin. Chapters 25 and 26 are hymns of praise for deliverance, including the promise that death will be swallowed up and the dead will rise. Chapter 27 ends with the Lord slaying the dragon and gathering His people one by one.

  Latter-day Saints have a special interest in chapter 24, because verse 5 describes the apostasy in terms the Lord Himself repeated in the preface to the Doctrine and Covenants ([[D&C 1:15]]).

thread: |
  Isaiah 24 is about **what happens to the earth when its covenant with God is broken**. The key is verse 5.

  The chapter opens with the Lord turning the earth “upside down” (verse 1). Every social distinction collapses. Priest and people, master and servant, lender and borrower all suffer alike (verse 2). No class, wealth, or office offers protection.

  Then Isaiah explains *why*. “The earth also is defiled under the inhabitants thereof; because they have **transgressed the laws, changed the ordinance, broken the everlasting covenant**” (verse 5). The earth itself is pictured as defiled by the sins of those who live on it, and so “the curse” devours it (verse 6). The party ends, and the wine turns bitter (verses 7–11). “The city of confusion” is broken down (verse 10).

  Yet even here, a few olives cling to the tree after the harvest (verse 13), and from the ends of the earth come songs of praise (verses 14–16). Then the earth staggers like a drunkard and collapses like a flimsy hut (verse 20). The powers in heaven and on earth are gathered like prisoners into a pit, and “after many days shall they be visited” (verse 22).

  The chapter ends with a blaze of glory. When the Lord reigns in Zion, His radiance is so great that “the moon shall be confounded, and the sun ashamed” (verse 23). The world built on a broken covenant falls apart. The world built on the Lord’s reign outshines the sun.

sections:
  - range: 1-6
    heading: The broken covenant
    plain: |
      Look! The Lord is about to empty the earth and lay it waste. He will twist its surface and scatter its people. It will be the same for everyone: people and priest, servant and master, maid and mistress, buyer and seller, lender and borrower, creditor and debtor. The earth will be completely emptied and plundered. The Lord has spoken. The earth dries up and withers; the world wastes away; even its proud people wilt. The earth is polluted by those who live on it, because they have broken the laws, changed the ordinance, and violated the everlasting covenant. So a curse consumes the earth, and those who live on it are left desolate. The earth’s inhabitants are burned up, and only a few are left.
  - range: 7-13
    heading: The party is over
    plain: |
      The new wine dries up and the vine withers; all the merrymakers groan. The cheerful drums are silent, the noise of the partygoers has stopped, and the joyful harp is still. No one drinks wine with singing anymore, and beer tastes bitter. The city of chaos is broken down; every house is barred shut. People cry in the streets for wine. All joy has faded, and gladness is banished from the land. The city is left in ruins, and its gate is battered to pieces. It will be like this throughout the earth: like an olive tree that has been beaten, like the few grapes left after the harvest.
  - range: 14-16
    heading: Songs from the ends of the earth
    plain: |
      Those who are left raise their voices and shout for joy. From the west they proclaim the Lord’s majesty. So in the east give glory to the Lord; in the islands of the sea, praise the name of the Lord, the God of Israel. From the ends of the earth we hear songs: “Glory to the Righteous One!” But I said, “I’m wasting away, I’m wasting away! Woe to me! Traitors betray; traitors betray treacherously.”
  - range: 17-23
    heading: The earth reels, and the Lord reigns
    plain: |
      Terror, pit, and trap await you, people of the earth! Whoever flees at the sound of terror will fall into the pit, and whoever climbs out of the pit will be caught in the trap. The floodgates of heaven are opened, and the foundations of the earth shake. The earth is utterly broken, split apart, and violently shaken. The earth staggers like a drunk and sways like a hut in the wind. Its rebellion weighs it down; it falls and will not rise again. In that day the Lord will punish the powers in the heavens above and the kings on the earth below. They will be herded together like prisoners in a pit and locked in a prison, and after many days they will be visited. The moon will be embarrassed and the sun ashamed, for the Lord of hosts will reign on Mount Zion and in Jerusalem, and His glory will shine before His elders.

notes:
  - ref: 1
    phrase: turneth it upside down
    kind: words
    title: The earth turned upside down
    body: |
      The Hebrew verb means to *twist* or *distort*, and here it is the earth’s surface (literally its “face”) that is distorted. Everything the world took for granted is overturned.

      The King James Version uses the same English phrase in the New Testament, where enemies of the early Christians complained that the apostles “have turned the world upside down” ([[Acts 17:6]]).
    sources: [bdb, lds-scriptures]
  - ref: 2
    phrase: as with the people, so with the priest
    kind: structure
    title: No one is exempt
    body: |
      Verse 2 lists six pairs of social opposites: people and priest, servant and master, maid and mistress, buyer and seller, lender and borrower, creditor and debtor. In ordinary life, those pairs mark differences of standing. In the day of judgment, those distinctions don’t matter. Hosea said the same: “there shall be, like people, like priest” ([[Hosea 4:9]]).

      It’s a leveling vision. Neither religious office nor wealth nor status can protect anyone from the consequences of a broken covenant. The Lord told the early Saints that His judgments would begin “upon my house” ([[D&C 112:24–26]]).
    sources: [delitzsch, lds-scriptures]
  - ref: 5
    phrase: they have transgressed the laws, changed the ordinance, broken the everlasting covenant
    kind: scripture
    title: The apostasy described
    body: |
      Isaiah describes a world that has **transgressed the laws**, **changed the ordinance**, and **broken the everlasting covenant**. The “everlasting covenant” in the Old Testament can refer to God’s covenant with Noah and all the earth ([[Gen. 9:16]]) and to His covenant with Abraham ([[Gen. 17:7]]).

      In the preface to the Doctrine and Covenants, the Lord described the condition of the world before the Restoration in almost identical terms: “they have strayed from mine ordinances, and have broken mine everlasting covenant” ([[D&C 1:15]]). He then explained that this is why He called Joseph Smith: “that mine everlasting covenant might be established” ([[D&C 1:17–23]]). The Lord also calls baptism “a new and an everlasting covenant” and the fulness of the gospel “mine everlasting covenant” ([[D&C 22:1]]; [[D&C 66:2]]).

      The passage “could be used to speak of apostasy in any day,” and the Lord’s use of the same words in the preface to the Doctrine and Covenants applies them to the world before the Restoration.
    sources: [lds-scriptures, ot-manual-15]
  - ref: 5
    phrase: The earth also is defiled under the inhabitants thereof
    kind: symbol
    title: A polluted earth
    body: |
      Isaiah pictures the earth itself as defiled by the sins of those who live on it. The law of Moses taught that bloodshed and immorality defile the land itself ([[Num. 35:33–34]]; [[Lev. 18:24–28]]).

      Latter-day scripture takes this even further. Enoch heard the earth itself mourn: “Wo, wo is me, the mother of men; I am pained, I am weary, because of the wickedness of my children. When shall I rest?” ([[Moses 7:48]]). The earth is not a neutral stage. It responds to how its inhabitants live, and it will one day be cleansed and sanctified ([[D&C 88:17–20]]; [[D&C 88:25–26]]).
    sources: [lds-scriptures]
  - ref: 6
    phrase: therefore the inhabitants of the earth are burned, and few men left
    kind: scripture
    title: Burned, with few left
    body: |
      Fire as the instrument of the final judgment appears throughout scripture. Malachi foresaw that “the day cometh, that shall burn as an oven” ([[Mal. 4:1]]). The Lord told the Saints that “after today cometh the burning” and that “all the proud and they that do wickedly shall be as stubble” ([[D&C 64:23–24]]). Nephi taught that the righteous “need not fear,” for they will be preserved “even if it so be as by fire” ([[1 Ne. 22:17]]).

      “Few men left” recalls the remnant, the olives left on the tree in verse 13.
    sources: [lds-scriptures]
  - ref: 10
    phrase: The city of confusion is broken down
    kind: words
    title: The city of chaos
    body: |
      “Confusion” here is *tohu*, the word used in [[Gen. 1:2]] for the earth before creation: “without form” (*tohu vavohu*). The “city of *tohu*” is a city returning to chaos, a world undoing creation.

      Isaiah never names this city. It can be read as the world’s own city, the center of a world estranged from God. The Lord’s preface to the Doctrine and Covenants speaks of “Babylon the great” in the same way ([[D&C 1:16]]). Its doors are shut, its wine runs out, and its joy is “darkened” (verse 11).
    sources: [delitzsch, oshb-wlc, lds-scriptures]
  - ref: 13
    phrase: as the shaking of an olive tree, and as the gleaning grapes when the vintage is done
    kind: symbol
    title: Gleanings again
    body: |
      Isaiah reuses the image from [[Isa. 17:6]]: after the olive tree is beaten and the grapes are harvested, a few remain. Even in a worldwide judgment, the Lord preserves a remnant.

      Zenos’s allegory of the olive tree has the same hope. After the vineyard is nearly ruined, the Lord of the vineyard and His servants labor one last time, and at the end He can say, “I have preserved the natural fruit” ([[Jacob 5:74–75]]).
    sources: [lds-scriptures]
  - ref: 15
    phrase: in the isles of the sea
    kind: scripture
    title: Praise from the isles of the sea
    body: |
      Right after the vision of devastation, songs break out from the ends of the earth: from “the sea” (the west), from “the fires” (probably the east, the region of sunrise), and from “the isles of the sea,” the distant coastlands. The songs come from every direction, and the survivors are singing.

      Book of Mormon peoples saw themselves in that phrase: “we are upon an isle of the sea” ([[2 Ne. 10:20]]). The Lord told Nephi, “I remember those who are upon the isles of the sea” ([[2 Ne. 29:7]]).
    sources: [delitzsch, lds-scriptures]
  - ref: 16
    phrase: My leanness, my leanness, woe unto me!
    kind: words
    title: Isaiah’s interruption
    body: |
      Just as the songs of glory begin, Isaiah interrupts himself: “My leanness, my leanness,” or *I waste away!* He can’t join the celebration yet, because he sees the suffering that must come first.

      The Hebrew of the second half is a remarkable tongue-twister. The root *bagad* (“to deal treacherously”) appears five times in a row: *bogedim bagadu, ubeged bogedim bagadu*. The repetition suggests betrayal on every side.
    sources: [bdb, delitzsch, oshb-wlc]
  - ref: 18
    phrase: the windows from on high are open
    kind: symbol
    title: The floodgates of heaven
    body: |
      “The windows of heaven were opened” is the language of Noah’s flood ([[Gen. 7:11]]), and the Hebrew word for “windows” is the same here. Isaiah’s picture echoes the Flood: openings above, foundations below shaking.

      Malachi uses the same word in the opposite direction, for the blessings the Lord will pour out on those who pay tithing: “I will… open you the windows of heaven” ([[Mal. 3:10]]). The same windows can release judgment or blessing.
    sources: [oshb-wlc, lds-scriptures]
  - ref: 20
    phrase: The earth shall reel to and fro like a drunkard
    kind: scripture
    title: The earth staggers like a drunkard
    body: |
      This striking image is repeated in modern revelation: “the earth shall tremble and reel to and fro as a drunken man” ([[D&C 88:87]]; see [[D&C 49:23]]). The Lord uses it for the signs that will precede His Second Coming.

      “Removed like a cottage” pictures the earth *swaying like a hut*. The Hebrew word for the hut is the one used for the “lodge in a garden of cucumbers” of [[Isa. 1:8]]. The world that seemed so solid turns out to be as flimsy as a shelter in a field.
    sources: [oshb-wlc, lds-scriptures]
  - ref: 22
    phrase: after many days shall they be visited
    kind: scripture
    title: Prisoners in the pit, visited
    body: |
      “The host of the high ones” is read as powers in the heavens, set over against “the kings of the earth.” Together they are gathered like prisoners into a pit and shut up, “and after many days shall they be visited.”

      Whether “visited” means punished or looked after is debated, and the wording seems deliberately open. In the Latter-day Saint reading, the prisoners are those in the spirit world awaiting the preaching of the gospel. The Restoration made that doctrine plain: the Savior and His messengers visit the spirits in prison. Peter wrote that Christ “went and preached unto the spirits in prison” ([[1 Pet. 3:18–20]]; [[1 Pet. 4:6]]), and President Joseph F. Smith saw how the Lord organized that work ([[D&C 138:29–37]]). Satan himself will be bound for a thousand years and loosed “for a little season” afterward ([[Rev. 20:1–3]]; [[D&C 88:110–111]]).
    sources: [delitzsch, ot-manual-15, lds-scriptures]
  - ref: 23
    phrase: the moon shall be confounded, and the sun ashamed
    kind: christ
    title: Glory that outshines the sun
    body: |
      When the Lord of hosts reigns in Zion, His glory will be so great that the sun and moon look embarrassed by comparison. The modern revelation describing His coming uses almost the same words: “so great shall be the glory of his presence that the sun shall hide his face in shame, and the moon shall withhold its light” ([[D&C 133:49]]).

      John saw the holy city that “had no need of the sun, neither of the moon, to shine in it: for the glory of God did lighten it, and the Lamb is the light thereof” ([[Rev. 21:23]]; see [[Isa. 60:19–20]]). The chapter that began with the earth turned upside down ends with the Lord reigning in Zion “before his ancients gloriously”: His elders, like the seventy elders of Israel who saw God on Sinai ([[Ex. 24:9–11]]).
    sources: [delitzsch, lds-scriptures]

  - ref: 1
    phrase: Behold, the LORD maketh the earth empty
    kind: history
    title: When were chapters 24–27 written?
    body: |
      Chapters 24–27 are generally known as the “Isaiah Apocalypse,” and when they were written is disputed. They contain “some ideas that one also finds in later apocalyptic literature,” the kind of visionary writing found in Daniel and the Book of Enoch. One view, which finds “advanced apocalyptic speculation” in them, sets their completion as late as the 160s BC; another, which finds them apocalyptic “only in a very wide sense,” takes that as proof that Isaiah wrote them; others fall between.

      By one “conservative estimate,” 65 to 75 percent of the language of 24:1–27:1 is also found in “the work acknowledged to come from the great prophet of the eighth century” (on that way of dividing the book, see [How to Read Isaiah](/isaiah/guides/how-to-read-isaiah/)). The figure counts shared vocabulary, and it has been read both ways. An argument from the Hebrew of these chapters, presented at a scholarly conference in 2017, holds that they were “likely written well before Lehi left Jerusalem,” where many scholars had assumed a date long after.
    sources: [skjoldal-isa-24-27, sc-knowhy-471]

christ: |
  Isaiah 24 ends with Jesus Christ reigning in Zion in glory so bright the sun is ashamed ([[D&C 133:49]]; [[Rev. 21:23]]). That is where the whole collapse is heading.

  The chapter also shows why His covenant needed to be restored. The earth’s inhabitants broke the everlasting covenant (verse 5), and the Lord answered by restoring it through the Prophet Joseph Smith ([[D&C 1:15–22]]). And the prisoners “visited” after many days (verse 22) recall the Savior who went to the spirit world to proclaim liberty ([[1 Pet. 3:18–20]]; [[D&C 138:18]]).

explore: |
  - **The apostasy and the Restoration.** Read Isaiah 24:5 with [[D&C 1:12–23]], [[Amos 8:11–12]], and [[2 Thes. 2:1–3]].
  - **Signs of His coming.** Compare Isaiah 24:18–23 with [[D&C 88:86–94]] and [[D&C 133:40–49]].
  - **The spirits in prison.** Read Isaiah 24:21–22, [[Isa. 42:7]], [[Isa. 61:1]], and [[D&C 138]].

sources: [ot-manual-15, delitzsch, bdb, oshb-wlc, lds-scriptures, skjoldal-isa-24-27, sc-knowhy-471]
