chapter: 27
title: The Dragon Slain and the Vineyard Restored
tagline: The Lord defeats Leviathan, sings a new song over His vineyard, and gathers His children one by one at the sound of the great trumpet.
when: '“In that day,” the last days'

setting: |
  Chapter 27 closes the “Isaiah apocalypse” (chapters 24–27). It has four movements, three of them introduced by “in that day”: the slaying of **Leviathan** (verse 1); a new **Song of the Vineyard** (verses 2–6); a reflection on how the Lord disciplines Israel “in measure” (verses 7–11); and the **gathering** of Israel at the sound of a great trumpet (verses 12–13).

  The second vineyard song is best read side by side with the first one in [[Isa. 5:1–7]]. In chapter 5 the Lord’s vineyard produced wild grapes, and He tore down its wall. In chapter 27 He guards it night and day, and it fills the world with fruit. Something has changed.

thread: |
  Isaiah 27 is a chapter of **reversals**, where the story of judgment turns into the story of restoration.

  It begins with a cosmic battle (verse 1). **Leviathan**, the twisting sea-serpent and dragon of ancient myth, a symbol of chaos and evil, is slain by the Lord’s great sword. Before the vineyard can flourish, the power that threatens it must be destroyed.

  Then comes the new vineyard song (verses 2–6), and its tone is completely different from chapter 5. There the Lord said: “I will take away the hedge… I will also command the clouds that they rain no rain upon it” ([[Isa. 5:5–6]]). Here He says: “I the LORD do keep it; I will water it every moment… I will keep it night and day.” In chapter 5 He looked for grapes and found wild grapes. Here, “Israel shall blossom and bud, and fill the face of the world with fruit.” And instead of anger: “Fury is not in me.” The only enemies left are briars and thorns, and even they are offered peace: “let him take hold of my strength, that he may make peace with me.”

  Verses 7–11 explain how the change happened. The Lord disciplined Israel, but “in measure” (verse 8). He didn’t destroy them as He destroyed their oppressors. His discipline purged their idolatry.

  And the chapter ends with the gathering (verses 12–13). Like a farmer beating out olives or threshing grain, the Lord will harvest His people from the Euphrates to the Nile, and they will be gathered **“one by one.”** Then the great trumpet sounds, and the lost and outcast come home to worship on the holy mountain.

  The Gardener who once tore down His vineyard now guards it every moment, because the vineyard is His, and He never stopped loving it.

sections:
  - range: '1'
    heading: Leviathan slain
    plain: |
      In that day the Lord will punish Leviathan, the fleeing serpent, Leviathan the twisting serpent, with His fierce, great, and powerful sword. He will slay the monster of the sea.
  - range: 2-6
    heading: A new song of the vineyard
    plain: |
      In that day, sing about a fruitful vineyard: “I, the Lord, watch over it. I water it continually. I guard it day and night so no one can harm it. I am not angry. If only there were briars and thorns confronting Me! I would march against them and burn them all up. Or else let them cling to Me for protection; let them make peace with Me. Yes, let them make peace with Me.” In days to come Jacob will take root, Israel will bud and blossom and fill the whole world with fruit.
  - range: 7-11
    heading: Discipline in measure
    plain: |
      Has the Lord struck Israel as He struck those who struck Israel? Has Israel been killed as its killers were killed? No. By warfare and exile You contended with her, measuring the punishment. With His fierce breath He drove her out, as on a day when the east wind blows. So this is how Jacob’s guilt will be atoned for, and this will be the full fruit of removing his sin: when he crushes all the altar stones to pieces like chalk, and no Asherah poles or incense altars are left standing. The fortified city is deserted, abandoned like the wilderness. Calves graze there and lie down, stripping its branches. When its branches are dry, they are broken off, and women use them to make fires. For this is a people without understanding, so their Maker has no compassion on them, and their Creator shows them no favor.
  - range: 12-13
    heading: Gathered one by one
    plain: |
      In that day the Lord will thresh from the Euphrates River to the Wadi of Egypt, and you, people of Israel, will be gathered up one by one. And in that day a great trumpet will sound. Those who were perishing in Assyria and those exiled in Egypt will come and worship the Lord on the holy mountain in Jerusalem.

notes:
  - ref: 1
    phrase: leviathan the piercing serpent, even leviathan that crooked serpent
    kind: history
    title: Leviathan
    body: |
      **Leviathan** was a many-headed sea monster in ancient Near Eastern mythology, a symbol of chaos. In the Canaanite texts discovered at Ugarit (Ras Shamra) in Syria, a sea monster called *Lotan* (the same name) is described in almost exactly Isaiah’s words: “the fleeing serpent… the twisting serpent.” Isaiah borrows that famous description, and the effect is powerful. The chaos monster that Canaanite gods battled is simply slain by the Lord.

      Elsewhere in scripture, Leviathan represents the untamable forces God alone controls ([[Job 41]]; [[Ps. 74:13–14]]; [[Ps. 104:26]]). John saw the same creature in its final form: “the great dragon… that old serpent, called the Devil, and Satan” ([[Rev. 12:9]]; [[Rev. 20:2]]). Before the vineyard can be safe, the dragon must be destroyed.
    sources: [bd-leviathan]
  - ref: 2
    phrase: In that day sing ye unto her, A vineyard of red wine
    kind: symbol
    title: The second vineyard song
    body: |
      This song deliberately answers the first Song of the Vineyard in [[Isa. 5:1–7]]. Compare them:

      | Isaiah 5 | Isaiah 27 |
      |---|---|
      | It brought forth wild grapes (5:2) | A vineyard of red wine (27:2) |
      | I will take away the hedge (5:5) | I will keep it night and day (27:3) |
      | I will command the clouds that they rain no rain (5:6) | I will water it every moment (27:3) |
      | There shall come up briers and thorns (5:6) | Briers and thorns are burned or make peace (27:4–5) |
      | He looked for judgment, but behold oppression (5:7) | Israel shall fill the world with fruit (27:6) |

      The same vineyard, the same Gardener, and a completely different outcome. What changed? The Lord’s discipline did its work (verses 7–9), and His covenant love never ended.
  - ref: 3
    phrase: I will water it every moment
    kind: liken
    title: Watered every moment
    body: |
      “Every moment” and “night and day”: the Lord’s care for His vineyard is constant. He doesn’t check on it once a season. He waters it continually and guards it without rest.

      Zenos’s allegory has the same devotion. The Lord of the vineyard personally digs, prunes, dungs, and nourishes His trees, and says, “It grieveth me that I should lose this tree” ([[Jacob 5:7]]; see [[Jacob 5:41]]; [[Jacob 5:47]]). The Psalmist says, “he that keepeth thee will not slumber” ([[Ps. 121:3–4]]). No moment of our lives is outside His watering.
  - ref: 4
    phrase: Fury is not in me
    kind: christ
    title: '“Fury is not in me”'
    body: |
      After chapters of the Lord’s anger (“his anger is not turned away” in [[Isa. 5:25]] and [[Isa. 9:12–10:4]]), this is a startling statement: “Fury is not in me.” The anger has been spent, and what remains is love for the vineyard.

      His remaining hostility is directed only at the briars and thorns that would choke His vines. Even they are offered a choice (verse 5). It’s a picture of the Savior, whose anger is always aimed at what destroys His people, and whose deepest nature is mercy ([[Ex. 34:6–7]]; [[Ps. 103:8–9]]).
  - ref: 5
    phrase: let him take hold of my strength, that he may make peace with me
    kind: christ
    title: Take hold of My strength
    body: |
      The Lord offers even His enemies a way out: “let him take hold of my strength.” The phrase can mean grasping His *stronghold*, taking refuge in Him, as a fugitive might grab the horns of the altar for sanctuary ([[1 Kgs. 1:50]]). And the Lord repeats it for emphasis: “he shall make peace with me.”

      This is the gospel invitation. Jacob pleaded with his people to “be reconciled unto him through the atonement of Christ” ([[Jacob 4:11]]). The Lord says, “mine arm of mercy is extended towards you, and whosoever will come, him will I receive” ([[3 Ne. 9:14]]). Peace with God comes not from our own strength, but from taking hold of His.
  - ref: 6
    phrase: Israel shall blossom and bud, and fill the face of the world with fruit
    kind: restoration
    title: Filling the world with fruit
    body: |
      This is one of Isaiah’s great promises of the latter-day gathering. Jacob “takes root,” and Israel blossoms until its fruit covers the face of the earth.

      Latter-day Saints see the promise being fulfilled as the restored gospel spreads to every nation. Zenos’s allegory ends the same way. After the last great labor in the vineyard, the trees “had become again the natural fruit,” and the Lord of the vineyard rejoiced that His fruit was good ([[Jacob 5:74–75]]). The Lord told Joseph Smith that the gospel would “roll forth… until it has filled the whole earth” ([[D&C 65:2]]; see [[Dan. 2:34–35]]).
  - ref: 8
    phrase: In measure, when it shooteth forth, thou wilt debate with it
    kind: liken
    title: Discipline in measure
    body: |
      “In measure” (*besasseʾah*) means *with measured, moderated punishment*. The Lord disciplined Israel, but not as He destroyed its enemies (verse 7). “He stayeth his rough wind in the day of the east wind”: even in the scorching east wind of judgment, He holds back the full blast.

      This is how the Lord chastens those He loves: carefully, proportionately, and for a purpose ([[Heb. 12:5–11]]; [[D&C 95:1]]). Jeremiah heard the same promise: “I will correct thee in measure, and will not leave thee altogether unpunished” ([[Jer. 30:11]]). He knows exactly how much we can bear ([[1 Cor. 10:13]]; [[Alma 13:28]]).
  - ref: 9
    phrase: By this therefore shall the iniquity of Jacob be purged
    kind: words
    title: The fruit of repentance
    body: |
      “Purged” is again *kipper*, the atonement verb (as in [[Isa. 6:7]]). How is Jacob’s iniquity atoned for? Verse 9 answers: when Israel crushes its pagan altar stones to powder like chalk and leaves no idols standing. The purpose of the discipline was to end idolatry.

      Repentance always includes forsaking. The Lord told Joseph Smith, “By this ye may know if a man repenteth of his sins—behold, he will confess them and forsake them” ([[D&C 58:43]]).
  - ref: 12
    phrase: ye shall be gathered one by one, O ye children of Israel
    kind: restoration
    title: Gathered one by one
    body: |
      The Lord “beats off” (threshes, as with olives or grain) the whole region from the Euphrates to the Wadi of Egypt, the ideal boundaries of the promised land ([[Gen. 15:18]]). But the gathering is not a mass relocation. It happens **one by one**.

      Jeremiah said something similar: “I will take you one of a city, and two of a family, and I will bring you to Zion” ([[Jer. 3:14]]). That is exactly how the latter-day gathering has worked: individuals and families choosing to come to Christ and make covenants, one conversion at a time. The Savior’s own ministry had the same pattern. At Bountiful He blessed the Nephite children “one by one” and let the multitude come to Him “one by one” to feel the prints in His hands ([[3 Ne. 11:15]]; [[3 Ne. 17:21]]).
  - ref: 13
    phrase: the great trumpet shall be blown
    kind: restoration
    title: The great trumpet
    body: |
      A great trumpet (the *shofar*, a ram’s horn) summoned Israel to assemble and announced the Jubilee, the year of release and return ([[Lev. 25:9–10]]). Here it calls home those “ready to perish in the land of Assyria” and “the outcasts in the land of Egypt,” the scattered of Israel, to worship on the holy mountain.

      Jesus said that at His coming He would send His angels “with a great sound of a trumpet, and they shall gather together his elect from the four winds” ([[Matt. 24:31]]; [[JS—M 1:37]]). The Doctrine and Covenants speaks of the trumps that will sound before His coming ([[D&C 29:13]]; [[D&C 88:92–110]]). Moroni is often depicted with a trumpet on Latter-day Saint temples, a symbol of the everlasting gospel being preached to every nation ([[Rev. 14:6]]; [[D&C 133:36–37]]).

christ: |
  Isaiah 27 shows Jesus Christ as the **Dragon-Slayer** who defeats Leviathan, the old serpent ([[Rev. 12:9]]; [[Gen. 3:15]]). He is the **Gardener** who waters His vineyard every moment and says, “Fury is not in me” (verses 3–4). He offers even His enemies peace: “let him take hold of my strength” (verse 5). And He is the **Shepherd** who gathers His people one by one (verse 12), as He blessed the Nephite children one by one ([[3 Ne. 17:21]]).

  The whole chapter is a picture of His Atonement at work. The chaos is defeated, the discipline is measured, sin is purged, and His people are brought home to worship Him on His holy mountain.

liken: |
  - Compare Isaiah 5 and Isaiah 27. Which vineyard song describes my life right now? What might move me from the first to the second?
  - “Take hold of my strength, that he may make peace with me” (verse 5). What part of my life needs to be reconciled to God? What would it look like to take hold of His strength instead of my own?
  - The Lord disciplines “in measure” (verse 8). Can I see His measured care in the hard things I’ve been through?
  - The gathering happens “one by one.” Who is one person I could help come closer to the Savior?

explore: |
  - **Two vineyard songs.** Read [[Isa. 5:1–7]] and [[Isa. 27:2–6]] side by side, then read [[Jacob 5:70–77]]. How does each vineyard story end?
  - **The dragon.** Trace the serpent and dragon through [[Gen. 3:15]], [[Isa. 27:1]], [[Isa. 51:9]], [[Rev. 12:7–9]], and [[Rev. 20:1–3]].
  - **One by one.** Read [[3 Ne. 11:14–17]] and [[3 Ne. 17:21–24]]. What does “one by one” teach about how the Savior gathers?

parallels:
  - ref: Isa. 5:1–7
    note: The first Song of the Vineyard, which this chapter reverses.
  - ref: Jacob 5
    note: Zenos’s allegory of the tame and wild olive trees.

