chapter: 11
title: The Stem of Jesse and the Second Gathering
tagline: A shoot from a stump, a King who judges rightly, a world where the wolf lies down with the lamb, and a banner raised to gather Israel home.
when: 'In Isaiah’s day, under the shadow of Assyria; “about to be fulfilled” in 1823'

setting: |
  Chapter 10 ended with the Lord felling the proud forest of Assyria. Chapter 11 begins in the same forest, but the tree it looks at is Judah’s. The royal line of David, once a mighty tree, was reduced by its apostasy to a **stump**. Isaiah sees a shoot rising from that stump.

  This chapter holds a unique place in the Restoration. On the night of September 21, 1823, the angel Moroni quoted it to Joseph Smith, “saying that it was about to be fulfilled” ([[JS—H 1:40]]). Fifteen years later the Lord answered specific questions about it by revelation ([[D&C 113:1–6]]). Nephi quoted the whole chapter ([[2 Ne. 21]]), and he quoted verses 4–9 again when describing the Millennium ([[2 Ne. 30:9–15]]).

  So Isaiah 11 isn’t only ancient prophecy. According to an angel, it describes the work that began with the Restoration.

thread: |
  Isaiah 11 moves from **one Person** to **a whole world** to **a gathered people**, and the thread that ties them together is the phrase “in that day.”

  **The King (verses 1–5).** A shoot grows from the stump of Jesse (David’s father), and the Spirit of the Lord rests on him in its fullness. He judges not by appearances but with righteousness, and he defends the poor and the meek. The revelation in [[D&C 113:1–2]] identifies the Stem of Jesse in these verses: “It is Christ.”

  **The world He makes (verses 6–9).** Under His reign, creation itself is healed. The predator lies down with its prey, children play safely near snakes, and “they shall not hurt nor destroy in all my holy mountain.” Why? “For the earth shall be full of the knowledge of the LORD, as the waters cover the sea.” Peace on earth follows from knowing God.

  **The people He gathers (verses 10–16).** A “root of Jesse” stands as an **ensign**, and the Lord sets His hand “the second time” to recover His scattered people from every direction. Ephraim and Judah, bitter rivals, are reconciled. The Lord makes a highway home, “like as it was to Israel in the day that he came up out of the land of Egypt.”

  The first exodus brought Israel out of one country. The **second gathering** brings them from the whole world. And it is led by the same Lord, now revealed as the King from Jesse’s stump. That is why Moroni chose this chapter. Moroni told Joseph Smith that this chapter “was about to be fulfilled” ([[JS—H 1:40]]).

sections:
  - range: 1-5
    heading: A shoot from the stump of Jesse
    plain: |
      A shoot will grow from the stump of Jesse, and a branch from its roots will bear fruit. The Spirit of the Lord will rest on Him: the Spirit of wisdom and understanding, of counsel and might, of knowledge and the fear of the Lord. He will delight in fearing the Lord. He won’t judge by what He sees or decide by what He hears. He will judge the poor with righteousness and defend the humble of the earth fairly. His word will strike the earth like a rod, and the breath of His lips will destroy the wicked. Righteousness and faithfulness will be the belt around His waist.
  - range: 6-9
    heading: The peaceable kingdom
    plain: |
      The wolf will live with the lamb, and the leopard will lie down with the young goat. The calf, the young lion, and the fattened steer will be together, and a little child will lead them. The cow and the bear will graze side by side; their young will lie down together, and the lion will eat straw like an ox. A nursing baby will play near a cobra’s hole, and a toddler will put his hand in a viper’s nest. No one will hurt or destroy anywhere on My holy mountain, because the earth will be as full of the knowledge of the Lord as the sea is full of water.
  - range: 10-16
    heading: The Lord gathers His people a second time
    plain: |
      In that day the Root of Jesse will stand as a banner for the peoples. The nations will seek Him, and His resting place will be glorious. In that day the Lord will reach out His hand a second time to reclaim the remnant of His people from Assyria, Egypt, upper Egypt, Cush, Elam, Babylonia, Hamath, and the islands of the sea. He will raise a banner for the nations and gather the exiles of Israel and the scattered people of Judah from the four corners of the earth. Ephraim’s jealousy will vanish and Judah’s hostility will end. Ephraim won’t envy Judah, and Judah won’t harass Ephraim. Together they will overcome their enemies. The Lord will dry up the gulf of the Egyptian sea and sweep His hand over the Euphrates, splitting it into seven streams so people can cross in sandals. There will be a highway for the remnant of His people coming from Assyria, just as there was for Israel when they came up out of Egypt.

notes:
  - ref: 1
    phrase: a rod out of the stem of Jesse
    kind: scripture
    title: Stem, rod, and branch in D&C 113
    body: |
      The Hebrew word translated “stem” (*gezaʿ*) is the stock of a tree, here the stump of one that has been felled. Jesse was King David’s father. So the “stem of Jesse” is the royal family of David, cut down to a stump because of its apostasy, as in the felled trees of [[Isa. 6:13]] and [[Isa. 10:33–34]].

      In March 1838 the Lord answered questions about this verse by revelation:

      - **The Stem of Jesse** “spoken of in the 1st, 2d, 3d, 4th, and 5th verses” is **Christ** ([[D&C 113:1–2]]). Verses 1–5, which describe the Spirit-filled, righteous Judge, are about Him.
      - **The rod** that comes out of the Stem is “a servant in the hands of Christ, who is partly a descendant of Jesse as well as of Ephraim, or of the house of Joseph, on whom there is laid much power” ([[D&C 113:3–4]]).

      The revelation does not name the servant. Many Latter-day Saints have viewed Joseph Smith as the rod, but the text leaves the identification open. What is clear is that Christ, the Stem, is the source, and His servant draws power from Him.
    sources: [delitzsch, bdb, sc-knowhy-50, lds-scriptures]
  - ref: 1
    phrase: a Branch shall grow out of his roots
    kind: christ
    title: The Branch
    body: |
      The parallel line uses a different Hebrew word, *netser*, meaning a sprout or shoot. “Branch” is also a title of the coming King in [[Isa. 4:2]], [[Jer. 23:5]], and [[Zech. 6:12]].

      Matthew says Jesus lived in Nazareth to fulfill what “was spoken by the prophets, He shall be called a Nazarene” ([[Matt. 2:23]]). One commentator hears in Matthew’s wording an echo of *netser*: the shoot, at first so humble and insignificant, was a despised Nazarene. That is a possible link, not a certain one.
    sources: [bdb, delitzsch, lds-scriptures]
  - ref: 2
    phrase: the spirit of the LORD shall rest upon him
    kind: christ
    title: The fullness of the Spirit
    body: |
      The Spirit “rests” on Him: it isn’t a passing visit but a permanent dwelling. Then Isaiah lists six qualities in three pairs:

      - **wisdom and understanding**: the intellectual life
      - **counsel and might**: the practical life
      - **knowledge and the fear of the LORD**: the direct relation to God

      Together with “the spirit of the LORD” itself, that makes seven. Commentators have connected these seven with the seven torches burning before God’s throne in [[Rev. 4:5]].

      The fulfillment is described at Jesus’s baptism, when the Spirit descended and remained on Him ([[John 1:32–33]]; [[1 Ne. 11:27]]). John the Baptist testified that God “giveth not the Spirit by measure unto him” ([[John 3:34]]; see [[D&C 93:12–17]]).
    sources: [delitzsch, lds-scriptures]
  - ref: 3
    phrase: he shall not judge after the sight of his eyes
    kind: christ
    title: A Judge who sees the heart
    body: |
      Human judges rely on what they can see and hear, so appearances, reputations, and eloquent testimony sway them. This King won’t be fooled by any of it. As the Lord told Samuel, “man looketh on the outward appearance, but the LORD looketh on the heart” ([[1 Sam. 16:7]]).

      Verse 4 shows who benefits most: “with righteousness shall he judge the poor.” The powerless, who never get a fair hearing in human courts (see [[Isa. 1:23]]; [[Isa. 10:1–2]]), finally get a perfect Judge. Jesus taught, “Judge not according to the appearance, but judge righteous judgment” ([[John 7:24]]).
    sources: [lds-scriptures]
  - ref: 4
    phrase: he shall smite the earth with the rod of his mouth
    kind: symbol
    title: A rod made of words
    body: |
      His weapon is His **word**. He needs no army. Paul describes the Lord destroying the wicked one “with the spirit of his mouth” ([[2 Thes. 2:8]]), and John saw a sharp sword going out of His mouth ([[Rev. 1:16]]; [[Rev. 19:15]]). In the Doctrine and Covenants, the Lord says His word is “quick and powerful, sharper than a two-edged sword” ([[D&C 6:2]]).

      When Nephi quoted this passage about the last days, he added that the Lord would “cause a great division among the people,” destroying the wicked and sparing the righteous ([[2 Ne. 30:10]]).
    sources: [lds-scriptures]
  - ref: 5
    phrase: righteousness shall be the girdle of his loins
    kind: symbol
    title: Dressed for action
    body: |
      A *girdle* was a waistcloth or belt that fastened the clothes together. So righteousness and faithfulness aren’t ornaments for this King. They are the band that holds all His qualities and powers together.

      Paul uses the same image for the armor of God: “having your loins girt about with truth” ([[Eph. 6:14]]; [[D&C 27:15–16]]).
    sources: [delitzsch, bdb, lds-scriptures]
  - ref: 6
    phrase: The wolf also shall dwell with the lamb
    kind: scripture
    title: The peaceable kingdom
    body: |
      Look at the pairs in verses 6–8: wolf and lamb, leopard and young goat, lion and calf, bear and cow, cobra and baby. In every pair, a predator lies down with its natural prey. The violence built into the natural order is undone.

      Latter-day revelation speaks of the same end of enmity: “in that day the enmity of man, and the enmity of beasts, yea, the enmity of all flesh, shall cease from before my face” ([[D&C 101:26]]). The earth will be renewed and receive its paradisiacal glory ([[A of F 1:10]]). Nephi quoted these verses to describe the Millennium ([[2 Ne. 30:12–15]]).

      And the one who leads this new creation? “A little child.” The King who rules over this kingdom came as a child Himself ([[Isa. 9:6]]).
    sources: [lds-scriptures]
  - ref: 8
    phrase: the cockatrice’ den
    kind: words
    title: What is a cockatrice?
    body: |
      The King James translators rendered a Hebrew word for a venomous snake as *cockatrice*; its exact identification is uncertain, but it is a viper of some kind. The *asp* in the first half of the verse translates a different word, for a venomous serpent, perhaps the cobra.

      So the verse says a nursing baby will play by a cobra’s hole, and a toddler will reach into a viper’s nest, and neither will be harmed. It is an unforgettable picture of total safety.
    sources: [bdb]
  - ref: 9
    phrase: the earth shall be full of the knowledge of the LORD, as the waters cover the sea
    kind: scripture
    title: Why the violence ends
    body: |
      This line explains everything before it. The wolf and lamb don’t make peace because they have been caged. The earth is at peace because it is *full of the knowledge of the Lord*, as completely as water fills the ocean basins. Habakkuk repeats the promise ([[Hab. 2:14]]).

      The Millennium will be a time of revelation. The Lord “shall reveal all things” ([[D&C 101:32–34]]), and no one will need to teach his neighbor to know the Lord, “for they shall all know me” ([[Jer. 31:34]]). Peace follows knowing God.
    sources: [lds-scriptures]
  - ref: 10
    phrase: there shall be a root of Jesse, which shall stand for an ensign of the people
    kind: scripture
    title: The root of Jesse and the ensign
    body: |
      Now a **root** of Jesse stands as an **ensign**, a banner lifted high for the nations to see and rally to. Paul quotes this verse to show that the Gentiles would come to Christ ([[Rom. 15:12]]).

      The Doctrine and Covenants gives a further interpretation. The root of Jesse is “a descendant of Jesse, as well as of Joseph, unto whom rightly belongs the priesthood, and the keys of the kingdom, for an ensign, and for the gathering of my people in the last days” ([[D&C 113:5–6]]). Many Latter-day Saints have seen the Prophet Joseph Smith here, since he received the keys of the gathering from Moses in the Kirtland Temple ([[D&C 110:11]]). As with the rod, the revelation itself doesn’t name him.

      Either way, the ensign is connected to priesthood keys and the gathering. The Lord later said the everlasting covenant itself was sent “to be a standard for my people” ([[D&C 45:9]]). And the risen Lord gave the Nephites a signal of their own by which to know that the gathering had begun: “I give unto you a sign,” He said, and the sign was the coming forth of their record to the Gentiles and from them to Lehi’s descendants ([[3 Ne. 21:1–7]]). It fits that Moroni, the last keeper of that record, quoted this chapter to Joseph Smith four years before the plates were entrusted to him.
    sources: [gs-ensign, sc-knowhy-50, lds-scriptures]
  - ref: 11
    phrase: the Lord shall set his hand again the second time to recover the remnant of his people
    kind: scripture
    title: The second time
    body: |
      If this is the *second* time, what was the first? Verse 16 answers: the Exodus from Egypt. The second redemption is the counterpart of the first, and it reaches the whole earth.

      The Book of Mormon repeatedly applies this verse to the last days. Nephi said that “the Lord will set his hand again the second time to restore his people from their lost and fallen state,” and he immediately connected it with Isaiah’s later phrase: “he will proceed to do a marvelous work and a wonder” ([[2 Ne. 25:17]]; see [[2 Ne. 29:1]]). Jacob taught that the second gathering would come when the scattered “shall come to the knowledge of their Redeemer” ([[2 Ne. 6:14]]), and he tied it to Zenos’s allegory: the day the Lord sets His hand the second time is “the last time that the servants of the Lord shall go forth in his power to nourish and prune his vineyard” ([[Jacob 6:2]]).

      Joseph Smith used the phrase to date that day. In the Kirtland Temple in 1836 he saw his brother Alvin in the celestial kingdom and “marveled how it was that he had obtained an inheritance in that kingdom, seeing that he had departed this life before the Lord had set his hand to gather Israel the second time, and had not been baptized for the remission of sins” ([[D&C 137:6]]). The revelation thus places the second gathering already under way in 1836 and ties it to baptism.

      The keys to this gathering were restored when Moses appeared in the Kirtland Temple in 1836 ([[D&C 110:11]]). President Russell M. Nelson has called the gathering of Israel “the most important thing taking place on earth today.”
    sources: [nelson-hope-israel, sc-knowhy-290, delitzsch, lds-scriptures]
  - ref: 11
    phrase: the islands of the sea
    kind: scripture
    title: Upon the isles of the sea
    body: |
      The list of places in verse 11 sweeps across the known world: **Assyria** and **Egypt**, the two great powers of Isaiah’s day, then **Pathros** (Upper Egypt) and **Cush** (still farther south), **Elam** (east of the Tigris), **Shinar** (the plain south of where the Tigris and Euphrates meet), **Hamath** (in Syria), and finally “the islands of the sea,” the islands and coastlands of the Mediterranean.

      Book of Mormon prophets took that last phrase personally. Jacob told his people, far from Jerusalem, “we have been led to a better land, for the Lord has made the sea our path, and we are upon an isle of the sea” ([[2 Ne. 10:20]]). He added, “great are the promises of the Lord unto them who are upon the isles of the sea,” for “the Lord remembereth all them who have been broken off” ([[2 Ne. 10:21–22]]). Isaiah’s list included them.
    sources: [delitzsch, lds-scriptures]
  - ref: 12
    phrase: from the four corners of the earth
    kind: symbol
    title: From the four corners
    body: |
      The “outcasts of Israel” and the “dispersed of Judah” will both be gathered “from the four corners” of the earth. The Hebrew word for “corners” is also the word for a wing or an extremity. The expression means every direction, the whole world.

      Note that both halves of the covenant people are included: Israel and Judah. That sets up the reconciliation of verse 13.
    sources: [bdb, delitzsch]
  - ref: 13
    phrase: Ephraim shall not envy Judah, and Judah shall not vex Ephraim
    kind: scripture
    title: Ephraim and Judah reconciled
    body: |
      Ephraim (the northern kingdom) and Judah (the southern) had been rivals ever since the kingdom split after Solomon ([[1 Kgs. 12]]), and in Isaiah’s day they were at war ([[Isa. 7:1–2]]). Isaiah promises that in the gathering the rivalry will end.

      Ezekiel acted out the same promise with two sticks, one for Judah and one for Joseph and Ephraim, joined into one in his hand ([[Ezek. 37:15–22]]). Latter-day revelation connects the “stick of Ephraim” with the Book of Mormon ([[D&C 27:5]]; see [[2 Ne. 3:12]]). The Bible (Judah’s record) and the Book of Mormon (Joseph’s record) now grow together, “unto the confounding of false doctrines and laying down of contentions.” Some Latter-day Saints see the reconciliation of the two records as a beginning of the reconciliation of the tribes; that is a devotional reading, not something Isaiah states.
    sources: [lds-scriptures]
  - ref: 15
    phrase: make men go over dryshod
    kind: symbol
    title: A new exodus
    body: |
      Verses 15–16 retell the Exodus on a grander scale. The Lord puts under the ban the “tongue” of the Egyptian sea, the Red Sea, as He parted it at the Exodus. He sweeps His hand over “the river” (the Euphrates) and splits it into seven shallow streams, so that people can cross in sandals, “dryshod.” Then there is a **highway** home, “like as it was to Israel in the day that he came up out of the land of Egypt.”

      The Doctrine and Covenants uses similar imagery for the gathering of the lost tribes: “an highway shall be cast up in the midst of the great deep” ([[D&C 133:26–27]]). Isaiah develops the highway image beautifully in [[Isa. 35:8–10]] and [[Isa. 40:3–4]].
    sources: [delitzsch, lds-scriptures]

christ: |
  By revelation, we know that the Stem of Jesse in verses 1–5 is Christ ([[D&C 113:1–2]]). He is the shoot from David’s stump, resting in the fullness of the Spirit ([[John 3:34]]). He is the Judge who sees the heart and defends the poor. He is the King whose word is His sword and whose belt is righteousness.

  His reign produces the peaceable kingdom of verses 6–9, when enmity ends and the earth is full of the knowledge of the Lord. And it is His covenant people He gathers from the four corners of the earth in verses 10–16. The Exodus pointed to Him, and the second gathering is His work, with His servants holding the keys.

explore: |
  - **Moroni’s visit.** Read [[JS—H 1:36–41]]. Moroni quoted Malachi 3–4, Isaiah 11, Acts 3, and Joel 2. What do these passages have in common?
  - **D&C 113.** Read the whole revelation. How does it change how you read Isaiah 11:1–10 and Isaiah 52:1–2?
  - **The millennial kingdom.** Compare Isaiah 11:6–9 with [[Isa. 65:17–25]], [[2 Ne. 30:9–18]], and [[D&C 101:23–34]].
  - **Two sticks.** Read [[Ezek. 37:15–28]] with [[2 Ne. 3:11–12]] and [[D&C 27:5]].

