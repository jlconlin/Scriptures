chapter: 12
title: A Song for the Day of Salvation
tagline: The first part of Isaiah ends with a hymn, the song Israel will sing after the second exodus.
when: '“In that day,” the day of gathering and redemption'

setting: |
  Isaiah 12 is a six-verse chapter and the finale of the book’s first section. Chapters 1–12 began with the Lord’s charge against a rebellious people ([[Isa. 1:2–4]]). They end with that people singing.

  The setting is “in that day,” the day of the second gathering described at the end of chapter 11. And the model is clear. When Israel crossed the Red Sea in the first exodus, Moses and the people sang a song of deliverance ([[Ex. 15:1–21]]). Chapter 11 ended with a new exodus, the sea dried up and a highway home. Chapter 12 is the song they will sing on the other side. It even quotes Moses’s song directly.

  Nephi included the chapter as [[2 Ne. 22]], the end of his quotation of Isaiah 2–12; its heading reads it as a millennial day when “all men will praise the Lord.” (He goes on to Isaiah 13–14 in 2 Nephi 23–24.)

thread: |
  After eleven chapters of warnings, woes, and wars, Isaiah 12 is pure worship. It has two short stanzas, each introduced by “in that day… say” (verses 1 and 4).

  The first stanza (verses 1–3) is **personal**. The singer is one individual (“I will praise thee… thou comfortedst **me**”). It tells a story of grace in one sentence: *You were angry with me, Your anger turned away, and You comforted me.* That is the whole arc of chapters 1–11 compressed into a testimony. Then comes the center of the song: “God is my salvation; I will trust, and not be afraid.” It’s the answer to Ahaz, who was afraid and would not trust ([[Isa. 7:2–12]]).

  The second stanza (verses 4–6) turns **outward**. Now the singers are plural (“shall ye say”), and they are told to declare His doings “among the people” and make them “known in all the earth.” Personal salvation becomes a message for the world.

  The key word is **salvation**, *yeshuʿah*, three times in two verses. Isaiah’s own name means “The Lord is salvation,” and *Jesus* is the Greek form of the name *Joshua* or *Jeshua*, “Savior.” The first part of Isaiah ends by singing, in effect, the Savior’s name.

sections:
  - range: 1-3
    heading: '“God is my salvation”'
    plain: |
      In that day you will say: “I will praise You, Lord! You were angry with me, but Your anger has turned away and You have comforted me. God is my salvation. I will trust and not be afraid. The Lord, Jehovah, is my strength and my song; He has become my salvation.” With joy you will draw water from the wells of salvation.
  - range: 4-6
    heading: Make it known in all the earth
    plain: |
      In that day you will say: “Give thanks to the Lord! Call on His name. Tell the nations what He has done, and proclaim that His name is exalted. Sing to the Lord, for He has done glorious things. Let this be known in all the earth. Shout and sing for joy, people of Zion, for great is the Holy One of Israel among you!”

notes:
  - ref: 1
    phrase: though thou wast angry with me, thine anger is turned away, and thou comfortedst me
    kind: structure
    title: The refrain answered
    body: |
      Five times in chapters 5–10 we heard the ominous refrain: “For all this his anger is not turned away, but his hand is stretched out still” ([[Isa. 5:25]]; [[Isa. 9:12]]; [[Isa. 9:17]]; [[Isa. 9:21]]; [[Isa. 10:4]]). Now, at last: “**thine anger is turned away**.” The refrain has been answered.

      And in its place: “thou comfortedst me.” The Hebrew verb (*nicham*) is the same one that opens the second half of the book: “Comfort ye, comfort ye my people” ([[Isa. 40:1]]). One psalm has the same movement: “his anger endureth but a moment; in his favour is life: weeping may endure for a night, but joy cometh in the morning” ([[Ps. 30:5]]).
    sources: [lds-scriptures, oshb-wlc]
  - ref: 2
    phrase: Behold, God is my salvation
    kind: christ
    title: Singing the Savior’s name
    body: |
      “Salvation” in Hebrew is *yeshuʿah*. It appears twice in this verse and again in verse 3. Isaiah’s own name means “The Lord is salvation,” and *Jesus* is the Greek form of *Joshua* or *Jeshua*, “Savior.” The angel told Joseph, “thou shalt call his name JESUS: for he shall save his people from their sins” ([[Matt. 1:21]]).

      So when Isaiah sings “God is my salvation… he also is become my salvation,” the song’s key word and the Savior’s name belong together. The singer does not say God gives salvation; God *becomes* it. Hearing the Savior’s name in the song is this chapter’s own reading, not something the text says.
    sources: [oshb-wlc, bdb, bd-isaiah, bd-jesus, lds-scriptures]
  - ref: 2
    phrase: I will trust, and not be afraid
    kind: history
    title: Ahaz’s lesson, finally learned
    body: |
      This line quietly answers the whole crisis of chapters 7–8. King Ahaz was afraid (“his heart was moved… as the trees of the wood are moved with the wind,” [[Isa. 7:2]]) and would not trust. He sent to Assyria for help instead ([[2 Kgs. 16:7]]). Isaiah told him, “Take heed, and be quiet; fear not” ([[Isa. 7:4]]), and “let him be your fear” ([[Isa. 8:13]]).

      Now the redeemed sing the lesson Ahaz never learned: *I will trust, and not be afraid.*
    sources: [lds-scriptures]
  - ref: 2
    phrase: the LORD JEHOVAH is my strength and my song; he also is become my salvation
    kind: words
    title: Quoting Moses at the Red Sea
    body: |
      This line is almost a word-for-word quotation of the song Moses and Israel sang after crossing the Red Sea: “The LORD is my strength and song, and he is become my salvation” ([[Ex. 15:2]]). The same words appear again in [[Ps. 118:14]]. Isaiah’s verse echoes Moses’s song, and the doubled divine name here (*Yah YHWH*, “LORD JEHOVAH”) has been read as the new song surpassing the old. The gathering of chapter 11 is a **new exodus**, and the redeemed sing the old song with new meaning.

      The King James Version usually prints the divine name as “LORD” in small capitals; here it prints “JEHOVAH.”
    sources: [lds-scriptures, delitzsch, oshb-wlc, bd-jehovah]
  - ref: 3
    phrase: with joy shall ye draw water out of the wells of salvation
    kind: christ
    title: Wells of salvation
    body: |
      The verse promises water drawn “with joy” from many “wells.” Just as Israel was miraculously supplied with water in the desert, so God promises many sources of salvation.

      John sets Jesus’s invitation at the Feast of Tabernacles ([[John 7:2]]): on “the last day, that great day of the feast,” Jesus stood and cried, “If any man thirst, let him come unto me, and drink” ([[John 7:37–38]]). John does not cite Isaiah 12 there, but the water of salvation and the invitation to drink belong together. Compare His words to the woman at the well: “whosoever drinketh of the water that I shall give him shall never thirst” ([[John 4:14]]).
    sources: [delitzsch, lds-scriptures]
  - ref: 4
    phrase: declare his doings among the people
    kind: scripture
    title: A song for the whole world
    body: |
      The second stanza turns outward: *declare* His doings, *make mention* of His name, make it “known in all the earth” (verse 5). The saved become witnesses. That’s the missionary impulse of the gathering. Those who have drawn water from the wells of salvation can’t help telling others where the water is.

      Ammon’s joy in his missionary labors sounds like this chapter: “Behold, who can glory too much in the Lord? Yea, who can say too much of his great power, and of his mercy?” ([[Alma 26:16]]; see [[Alma 26:8]]).
    sources: [lds-scriptures]
  - ref: 6
    phrase: great is the Holy One of Israel in the midst of thee
    kind: christ
    title: The Holy One in the midst
    body: |
      The song ends with the title “the Holy One of Israel,” which appears in [[Isa. 1:4]] as the one Israel had provoked to anger. Now He is not far off and offended. He is “**in the midst of thee**.”

      That is the fulfillment of the name *Immanuel*, “God with us” ([[Isa. 7:14]]; [[Isa. 8:10]]). The first twelve chapters of Isaiah move from a God who hides His face ([[Isa. 8:17]]) to a God who dwells in the midst of Zion. The same promise closes the book of Ezekiel, whose new Jerusalem is named “The LORD is there” ([[Ezek. 48:35]]), and it is the hope of the Millennium ([[D&C 45:59]]).
    sources: [lds-scriptures]

christ: |
  Isaiah 12 is a song *to* Jesus Christ and *about* Him. He is **JEHOVAH**, the LORD whose anger has turned away (verse 1). He is **salvation** itself, *Yeshuʿah*, the word at the heart of the Savior’s name (verse 2; [[Matt. 1:21]]). He is the one who invited the thirsty to come and drink at the Feast of Tabernacles ([[John 7:37–38]]). And He is **the Holy One of Israel in the midst** of His people, Immanuel, God with us (verse 6).

  The first section of Isaiah began with a people who didn’t know their Master ([[Isa. 1:3]]). It ends with a people who know Him so well they can’t stop singing about Him.

explore: |
  - **Two songs of the sea.** Read [[Ex. 15:1–21]] and Isaiah 12 together. What does Isaiah borrow from Moses? What’s new?
  - **The feast and the water.** Read [[John 7:2]] and [[John 7:37–39]]. How does knowing Isaiah 12:3 change how you hear Jesus’s invitation?
  - **The shape of Isaiah 1–12.** Skim chapters 1 and 12 side by side. How has the relationship between the Lord and His people changed?

