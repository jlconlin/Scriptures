chapter: 37
title: Hezekiah Spreads the Letter Before the Lord
tagline: A frightened king goes to the temple, lays the enemy’s letter before the Lord, and prays, and the Lord answers through Isaiah.
when: '701 BC'

setting: |
  Chapter 36 ended with Hezekiah’s officials returning with their clothes torn, reporting the Rabshakeh’s threats. Chapter 37 tells how Hezekiah responded and how the Lord delivered Jerusalem.

  It’s worth remembering how dire the situation was. Assyria had already taken Judah’s fortified cities ([[Isa. 36:1]]), and now a second message demanded Jerusalem’s surrender.

  This chapter contains Hezekiah’s request for Isaiah’s prayers, a letter and a prayer, Isaiah’s answer with a taunt-song against Sennacherib and a sign for the survivors, and the deliverance itself.

thread: |
  Isaiah 37 shows **what faith does in a crisis**, and it gives us one of scripture’s most practical models of prayer.

  Hezekiah’s first response is humility. He tears his clothes, puts on sackcloth, goes to the house of the Lord, and sends for the prophet (verses 1–2). His message to Isaiah is honest about his helplessness: “the children are come to the birth, and there is not strength to bring forth” (verse 3). Isaiah’s answer: “Be not afraid” (verse 6).

  Then the Assyrians send a second threat, this time in writing (verses 9–13). And Hezekiah does something beautiful. He takes the letter up to the temple and “spread it before the LORD” (verse 14). He literally lays the enemy’s words out in front of God.

  His prayer (verses 15–20) is a model. He begins with who God is: the Lord of hosts, enthroned above the cherubim, the only God, the Creator. He asks God to see and hear. He admits the facts honestly: yes, Assyria has destroyed the nations and their gods, because those gods were only wood and stone. And he asks for deliverance with a purpose beyond his own safety: “that all the kingdoms of the earth may know that thou art the LORD, even thou only.”

  The Lord’s answer comes through Isaiah (verses 21–35). It begins with a taunt-song in which “the virgin, the daughter of Zion” laughs at the Assyrian king (verse 22). Sennacherib thought his conquests were his own doing. The Lord says: “Hast thou not heard long ago, how I have done it?” (verse 26). The Lord says He will lead the king of Assyria home with a hook in his nose (verse 29). He “shall not come into this city, nor shoot an arrow there” (verse 33).

  And that night, “the angel of the LORD went forth” (verse 36). By morning the threat was gone.

  The chapter answers the question of chapter 36. “What confidence is this?” It is confidence in a God who hears prayer.

sections:
  - range: 1-7
    heading: Hezekiah goes to the house of the Lord
    plain: |
      When King Hezekiah heard this, he tore his clothes, put on sackcloth, and went into the temple of the Lord. He sent Eliakim the palace administrator, Shebna the secretary, and the leading priests, all wearing sackcloth, to the prophet Isaiah son of Amoz. They told him: “This is what Hezekiah says: This day is a day of distress, rebuke, and disgrace, as when children come to the moment of birth and there is no strength to deliver them. Perhaps the Lord your God will hear the words of the field commander, whom his master the king of Assyria sent to ridicule the living God, and will rebuke him for those words. So pray for the remnant that still survives.” When King Hezekiah’s officials came to Isaiah, Isaiah said to them, “Tell your master, ‘This is what the Lord says: Do not be afraid of what you have heard, those words with which the servants of the king of Assyria have blasphemed Me. Listen! I am going to put a spirit in him so that when he hears a certain report, he will return to his own country, and there I will have him cut down with the sword.’”
  - range: 8-13
    heading: A letter from the enemy
    plain: |
      When the field commander heard that the king of Assyria had left Lachish, he withdrew and found the king fighting against Libnah. Then Sennacherib received a report that Tirhakah, king of Cush (Ethiopia), was marching out to fight against him. So he sent messengers to Hezekiah with this message: “Don’t let the God you depend on deceive you when He says, ‘Jerusalem will not be given into the hands of the king of Assyria.’ Surely you have heard what the kings of Assyria have done to all the countries, destroying them completely. And will you be delivered? Did the gods of the nations my predecessors destroyed rescue them? Where is the king of Hamath or the king of Arpad?”
  - range: 14-20
    heading: Hezekiah’s prayer
    plain: |
      Hezekiah received the letter from the messengers and read it. Then he went up to the temple of the Lord and spread it out before the Lord. And Hezekiah prayed to the Lord: “Lord of hosts, God of Israel, enthroned between the cherubim, You alone are God over all the kingdoms of the earth. You made heaven and earth. Turn Your ear, Lord, and hear; open Your eyes, Lord, and see. Listen to all the words Sennacherib has sent to ridicule the living God. It is true, Lord, that the Assyrian kings have laid waste all these peoples and their lands. They have thrown their gods into the fire and destroyed them, for they were not gods but only wood and stone, shaped by human hands. Now, Lord our God, deliver us from his hand, so that all the kingdoms of the earth may know that You, Lord, are the only God.”
  - range: 21-35
    heading: The Lord’s answer through Isaiah
    plain: |
      Then Isaiah sent a message to Hezekiah: “This is what the Lord, the God of Israel, says: Because you have prayed to Me concerning Sennacherib, this is the word the Lord has spoken against him: Virgin Daughter Zion despises and mocks you; Daughter Jerusalem tosses her head as you flee. Who is it you have ridiculed and blasphemed? Against whom have you raised your voice and lifted your eyes in pride? Against the Holy One of Israel! Through your messengers you have ridiculed the Lord. You said, ‘With my many chariots I have climbed the highest mountains. I have cut down its tallest cedars. I have dug wells and dried up the streams of Egypt.’ Have you not heard? Long ago I planned it. Now I have brought it to pass, that you have turned fortified cities into piles of stone. Their people were like grass sprouting on a roof, scorched before it grows up. But I know where you are, when you come and go, and how you rage against Me. Because your raging and insolence have reached My ears, I will put My hook in your nose and My bit in your mouth, and I will make you return by the way you came. This will be the sign for you, Hezekiah: This year you will eat what grows by itself, and the second year what springs from that. But in the third year sow and reap, plant vineyards and eat their fruit. Once more a remnant of the kingdom of Judah will take root below and bear fruit above. For out of Jerusalem will come a remnant, and out of Mount Zion a band of survivors. The zeal of the Lord of hosts will accomplish this. So this is what the Lord says about the king of Assyria: He will not enter this city or shoot an arrow here. He will not come before it with shield or build a siege ramp against it. By the way that he came he will return; he will not enter this city, declares the Lord. I will defend this city and save it, for My sake and for the sake of David My servant.”
  - range: 36-38
    heading: The deliverance
    plain: |
      Then the angel of the Lord went out and struck down the Assyrian camp, and by morning the army was no more. So Sennacherib king of Assyria broke camp and withdrew. He returned to Nineveh and stayed there. Later, while he was worshiping in the temple of his god Nisroch, his sons Adrammelek and Sharezer killed him with the sword and escaped to the land of Ararat. And Esarhaddon his son succeeded him as king.

notes:
  - ref: 1
    phrase: he rent his clothes, and covered himself with sackcloth, and went into the house of the LORD
    kind: history
    title: The first response
    body: |
      Compare this king with his father. When Ahaz faced a crisis, he refused even to ask the Lord for a sign and sent to Assyria for help ([[Isa. 7:10–12]]; [[2 Kgs. 16:7]]). When Hezekiah faces a greater crisis, his first move is to humble himself and go to the house of the Lord. His second is to send for the prophet.

      The Book of Mormon shows the same instinct in Nephite leaders who sought the Lord when armies threatened ([[Alma 43:23–24]]; [[3 Ne. 3:12–15]]).
    sources: [lds-scriptures]
  - ref: 3
    phrase: the children are come to the birth, and there is not strength to bring forth
    kind: symbol
    title: No strength to deliver
    body: |
      This is a painful image. A woman in labor, at the very moment of birth, has no strength left to deliver the child. Hezekiah is saying: *We have reached the critical moment, and we cannot finish this ourselves.*

      Isaiah had used a similar image for Israel’s failed efforts: “we have as it were brought forth wind” ([[Isa. 26:18]]). Later he puts the Lord in the role of the one who brings to birth: “Shall I bring to the birth, and not cause to bring forth? saith the LORD” ([[Isa. 66:9]]).
    sources: [lds-scriptures]
  - ref: 4
    phrase: to reproach the living God
    kind: words
    title: The living God
    body: |
      Hezekiah calls the Lord “the living God,” a pointed contrast with the dead gods of Hamath, Arpad, and Sepharvaim that the Rabshakeh listed ([[Isa. 36:19]]). The Assyrian had lumped the Lord in with idols. Hezekiah’s phrasing corrects that from the start: the Lord is alive. Idols are not.

      The same phrase appears in David’s words about Goliath: “who is this uncircumcised Philistine, that he should defy the armies of the living God?” ([[1 Sam. 17:26]]). Peter used it in his great confession of Jesus: “Thou art the Christ, the Son of the living God” ([[Matt. 16:16]]).
    sources: [lds-scriptures]
  - ref: 6
    phrase: Be not afraid of the words that thou hast heard
    kind: scripture
    title: '“Be not afraid of the words”'
    body: |
      Notice what the Lord tells Hezekiah not to fear: not the army, but “the words.” The Rabshakeh’s power in chapter 36 was mostly verbal: threats, arguments, half-truths, and mockery. 

      Isaiah gave Ahaz the same counsel earlier: “fear not, neither be fainthearted” ([[Isa. 7:4]]). The Lord told the Saints in a time of persecution: “fear not what man can do, for God shall be with you forever and ever” ([[D&C 122:9]]).
    sources: [lds-scriptures]
  - ref: 9
    phrase: he heard say concerning Tirhakah king of Ethiopia
    kind: history
    title: Tirhakah
    body: |
      **Tirhakah** (Taharqa) was one of the Ethiopian (Cushite) rulers of Egypt’s 25th Dynasty. The Bible Dictionary describes Ethiopia, or Cush, as the land south of Egypt’s frontier (see also [[Isa. 18:1]]).

      There is a chronological puzzle here. Tirhakah became king some years after 701 BC, yet verse 9 calls him “king.” One proposal is that in 701 he commanded the troops of his uncle Shabaka, some thirteen years before he became king. Either way, the rumor of an advancing army was one of the pressures that turned Sennacherib’s attention away from Jerusalem, just as Isaiah had said he would “hear a rumour” (verse 7).
    sources: [bd-ethiopia, delitzsch, luckenbill-annals, lds-scriptures]
  - ref: 14
    phrase: Hezekiah went up unto the house of the LORD, and spread it before the LORD
    kind: history
    title: Spreading the letter before the Lord
    body: |
      This is one of the most memorable images in the Old Testament. Hezekiah receives a threatening letter, reads it, walks up to the temple, and unrolls it before the Lord, as if to say, *Look at this. Read what they wrote about You.*

      Alma likewise counseled his people to pray about their fields, their flocks, their households, and their enemies ([[Alma 34:17–27]]).
    sources: [lds-scriptures]
  - ref: 16
    phrase: O LORD of hosts, God of Israel, that dwellest between the cherubims, thou art the God, even thou alone
    kind: structure
    title: A model prayer
    body: |
      Hezekiah’s prayer (verses 16–20) has a clear shape:

      1. **Who God is** (verse 16): the Lord of hosts, enthroned between the cherubim above the ark in the temple, the only God, the Creator of heaven and earth. He starts with worship, not with his problem.
      2. **A request for God’s attention** (verse 17): “Incline thine ear… open thine eyes.”
      3. **An honest account of the facts** (verses 18–19): Assyria really has destroyed nations. He doesn’t pretend the danger isn’t real.
      4. **The request** (verse 20): “save us from his hand.”
      5. **The purpose** (verse 20): “that all the kingdoms of the earth may know that thou art the LORD, even thou only.”

      The last part is the most striking. Hezekiah asks for deliverance so that the Lord’s name will be known, not just so that he will be safe. The Savior taught a similar order in the prayer He gave: first “Hallowed be thy name,” then “give us this day our daily bread” ([[Matt. 6:9–11]]; [[3 Ne. 13:9–11]]).
    sources: [bd-cherubim, lds-scriptures]
  - ref: 22
    phrase: The virgin, the daughter of Zion, hath despised thee, and laughed thee to scorn
    kind: symbol
    title: Zion laughs at the conqueror
    body: |
      The Lord’s answer opens with an image that turns everything upside down. Instead of cowering before the Assyrian king, “the virgin, the daughter of Zion” laughs at him and tosses her head as he retreats.

      Her confidence doesn’t come from her own strength. It comes from who defends her. The Psalm says, “He that sitteth in the heavens shall laugh” at the nations that plot against Him ([[Ps. 2:4]]).
    sources: [lds-scriptures]
  - ref: 26
    phrase: Hast thou not heard long ago, how I have done it; and of ancient times, that I have formed it?
    kind: scripture
    title: '“I planned it long ago”'
    body: |
      Sennacherib boasted about his conquests: the mountains he climbed, the cedars he cut, the rivers he dried up (verses 24–25). The Lord replies: *Didn’t you know? I planned all of this long ago. You were only the instrument.* It is the same lesson as the axe boasting against the one who swings it ([[Isa. 10:15]]).

      Even when evil seems powerful and self-directed, it operates within limits the Lord has set. He knows the proud man’s “abode, and thy going out, and thy coming in, and thy rage against me” (verse 28).
    sources: [lds-scriptures, delitzsch]
  - ref: 29
    phrase: therefore will I put my hook in thy nose, and my bridle in thy lips
    kind: history
    title: A hook in the nose
    body: |
      The image is of an animal led and held in check by a ring through its nose and a bridle in its mouth. The Lord says He will do this to the king of Assyria: He will put His hook in Sennacherib’s nose and His bridle in his mouth, and lead him home the way he came. The conqueror becomes the led animal, like a wild beast subdued by force. Ezekiel uses the same image for the final enemy of God’s people ([[Ezek. 38:4]]).
    sources: [lds-scriptures, delitzsch]
  - ref: 31
    phrase: the remnant that is escaped of the house of Judah shall again take root downward, and bear fruit upward
    kind: symbol
    title: Roots down, fruit up
    body: |
      After Assyria’s conquest of Judah’s fortified cities, the Lord gives Hezekiah a sign (verse 30). For two years the people will eat whatever grows on its own. In the third year they will sow and harvest normally again.

      Then comes one of Isaiah’s loveliest images of the remnant: it “shall again take root downward, and bear fruit upward.” Alma taught that the word of God, planted and nourished, “shall take root” and grow into a tree “springing up unto everlasting life” ([[Alma 32:37–41]]). Paul prayed that the Saints would be “rooted and grounded in love” ([[Eph. 3:17]]).
    sources: [lds-scriptures]
  - ref: 35
    phrase: For I will defend this city to save it for mine own sake, and for my servant David’s sake
    kind: christ
    title: For My sake, and for David’s sake
    body: |
      Why does the Lord save Jerusalem? The reasons given are “for mine own sake” and “for my servant David’s sake,” the latter pointing to the covenant He had made with David that his house would endure ([[2 Sam. 7:12–16]]).

      Jesus Christ is the Son of David through whom that covenant is fulfilled ([[Luke 1:32–33]]).
    sources: [lds-scriptures]
  - ref: 36
    phrase: Then the angel of the LORD went forth, and smote in the camp of the Assyrians
    kind: history
    title: The deliverance
    body: |
      The deliverance is described very briefly. In a single night “the angel of the LORD” struck the Assyrian camp, and by morning the army that had threatened Jerusalem was gone. It is the fulfillment of Isaiah’s earlier prophecies: “at eveningtide trouble; and before the morning he is not” ([[Isa. 17:14]]), and “then shall the Assyrian fall with the sword, not of a mighty man” ([[Isa. 31:8]]).

      Scripture doesn’t say how the angel struck the camp. Sennacherib’s own annals, as noted in chapter 36, say he shut Hezekiah up in Jerusalem “like a caged bird,” and the Assyrian account does not mention the city’s capture.
    sources: [lds-scriptures, luckenbill-annals]
  - ref: 38
    phrase: as he was worshipping in the house of Nisroch his god, that Adrammelech and Sharezer his sons smote him with the sword
    kind: history
    title: Sennacherib’s end
    body: |
      Sennacherib went home to Nineveh and reigned about twenty more years. He was murdered in 681 BC, on the twentieth of Tebet, while worshipping in the temple of his god, and his son **Esar-haddon** overcame the rebels and took the throne, as the verse says.

      The irony is sharp. The king who mocked the Lord for being unable to protect His people died in the house of his own god, which couldn’t protect him. It fulfilled Isaiah’s word in verse 7: “I will cause him to fall by the sword in his own land.”
    sources: [lds-scriptures, bd-sennacherib, luckenbill-annals]

christ: |
  In Isaiah 37, Hezekiah prays to “the LORD of hosts, God of Israel, that dwellest between the cherubims,” the premortal Jesus Christ (Jehovah), whose presence rested above the mercy seat of the ark in the temple ([[Ex. 25:22]]). He is **the living God** in contrast to idols of wood and stone (verses 4, 17, 19).

  He saves Jerusalem “for mine own sake, and for my servant David’s sake” (verse 35), and He is Himself the promised Son of David. The deliverance came in the night, and by morning the enemy was gone. As a devotional echo, the night and morning of the deliverance recall the Resurrection: the darkest night, and then, “very early in the morning,” an empty tomb ([[Mark 16:2–6]]).

explore: |
  - **The parallel accounts.** Compare Isaiah 37 with [[2 Kgs. 19]] and [[2 Chr. 32:20–23]].
  - **Model prayers.** Compare Hezekiah’s prayer with Solomon’s at the temple dedication ([[1 Kgs. 8:22–30]]), Jehoshaphat’s in a similar crisis ([[2 Chr. 20:5–12]]), and the prayer the Savior taught ([[3 Ne. 13:9–13]]).
  - **The remnant.** Trace the promise of verses 31–32 through [[Isa. 10:20–22]] and [[2 Kgs. 19:30–31]].

parallels:
  - ref: 2 Kgs. 19
    note: The parallel account in Kings.
  - ref: 2 Chr. 32:20–23
    note: The Chronicler’s summary of the prayer and deliverance.

sources: [bd-sennacherib, bd-cherubim, bd-ethiopia, delitzsch, luckenbill-annals, ot-manual-16, lds-scriptures]
