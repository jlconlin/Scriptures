chapter: 13
title: The Burden of Babylon
tagline: The Lord musters an army against the proudest city on earth, and the day of the Lord darkens sun, moon, and stars.
when: 'Prophesied c. 700s BC; Babylon fell to the Medes and Persians in 539 BC; a type of the last days'

setting: |
  With chapter 13 the book shifts to a new section: **oracles against the nations** (chapters 13–23). Isaiah turns from Judah to its neighbors and to the great powers, one after another, to show that every nation answers to Israel’s God.

  It is striking that the first oracle is against **Babylon**. In Isaiah’s day, Assyria was the superpower and Babylon was a restless subject city. But Isaiah looks past his own century to the empire that would one day destroy Jerusalem (587 BC), and then fall itself to the Medes and Persians (539 BC). He even names the Medes (verse 17).

  Babylon matters in Isaiah because it becomes a **symbol**. From the Tower of Babel onward ([[Gen. 11:1–9]]), Babylon stands for human pride organized into a civilization, the world that sets itself against God. John uses it that way in Revelation ([[Rev. 17–18]]), and so does the Lord in modern revelation: “Babylon the great, which shall fall” ([[D&C 1:16]]); “Go ye out from Babylon” ([[D&C 133:5]]; [[D&C 133:14]]). So Isaiah 13 is both history and prophecy of the last days.

  Nephi quoted this chapter as [[2 Ne. 23]], and his version has some of the most significant differences from the King James text anywhere in the Book of Mormon Isaiah chapters.

thread: |
  Isaiah 13 is built on a startling reversal: **the Lord raises a banner, and the proudest city on earth is flattened.**

  The chapter opens with a military summons (verses 2–5). A banner goes up on a bare hill, a hand waves, and troops pour in from “the end of heaven.” The Lord is mustering an army. We might expect that army to be Israel’s. It isn’t. It is a coalition of nations the Lord has “sanctified,” consecrated as His instruments.

  Then the scope explodes (verses 6–13). This isn’t just a siege. It is “the day of the LORD.” Hearts melt, faces burn, stars go dark, the heavens shake, and the earth moves out of its place. The Lord announces His target: “I will punish the world for their evil… and will cause the arrogancy of the proud to cease” (verse 11). Babylon has become the whole proud world.

  Finally the focus narrows again to the literal city (verses 17–22). The Medes, who can’t be bribed, will come. Babylon, “the glory of kingdoms,” will be like Sodom: uninhabited, a home for jackals and owls.

  The lesson runs through all of Isaiah: **the higher the pride, the harder the fall.** The Book of Mormon version adds a line at the end that changes the tone of the whole chapter: “For I will destroy her speedily; yea, for I will be merciful unto my people, but the wicked shall perish” ([[2 Ne. 23:22]]). The fall of Babylon is judgment on the proud and mercy for the Lord’s people, who are finally set free.

sections:
  - range: 1-5
    heading: The Lord musters His army
    plain: |
      This is the oracle about Babylon that Isaiah saw. Raise a banner on a bare hilltop! Shout to the soldiers and wave them on into the nobles’ gates. I have commanded My consecrated warriors and summoned My mighty ones to carry out My anger. Listen to the roar on the mountains, like a vast crowd: the uproar of kingdoms and nations gathering. The Lord of hosts is mustering an army for battle. They come from far away, from the ends of the heavens, the Lord and the weapons of His wrath, to destroy the whole land.
  - range: 6-16
    heading: The day of the Lord
    plain: |
      Wail, for the day of the Lord is near! It will come like destruction from the Almighty. Every hand will go limp and every heart will melt. People will be terrified, gripped with pain like a woman in labor, staring at each other with faces flushed. The day of the Lord is coming, cruel with fury and burning anger, to make the land desolate and destroy its sinners. The stars and constellations will not shine, the sun will be dark when it rises, and the moon will give no light. I will punish the world for its evil and the wicked for their sins. I will end the arrogance of the proud and humble the pride of tyrants. I will make people scarcer than pure gold, rarer than gold from Ophir. I will shake the heavens, and the earth will move from its place. Like a hunted gazelle or sheep with no shepherd, everyone will run back to his own people and land. Whoever is caught will be killed, and the horrors of war will fall on their families.
  - range: 17-22
    heading: Babylon becomes a ruin
    plain: |
      I am stirring up the Medes against them, who don’t care about silver and can’t be bought with gold. Their bows will cut down the young men, and they will show no mercy to children. Babylon, the jewel of kingdoms, the pride of the Chaldeans, will be overthrown like Sodom and Gomorrah. It will never be inhabited again. No nomad will pitch a tent there, and no shepherd will rest his flock there. Desert animals will live in it, its houses will be full of howling creatures, ostriches will nest there, and wild goats will leap about. Hyenas will howl in its fortresses and jackals in its luxurious palaces. Its time is almost here; its days will not be extended.

notes:
  - ref: 1
    phrase: The burden of Babylon
    kind: words
    title: What is a “burden”?
    body: |
      “Burden” translates the Hebrew *massaʾ*, from the verb *nasaʾ*, “to lift up.” It can mean a load that is carried, or an utterance “lifted up” by the voice, an oracle. In the prophets it usually introduces a message of judgment against a nation. Isaiah uses it for each of the oracles in chapters 13–23 (Babylon, Moab, Damascus, Egypt, and others).

      The double meaning is fitting. The prophet “lifts up” his voice to pronounce it, and the message is a heavy weight laid on the nation, and on the prophet who has to carry it.
  - ref: 2
    phrase: Lift ye up a banner upon the high mountain
    kind: symbol
    title: The banner again
    body: |
      This is the same image as the “ensign” of [[Isa. 5:26]] and [[Isa. 11:12]], a signal raised on a bare hilltop so troops can see where to gather. Here it summons an army against Babylon.

      Notice how Isaiah uses a single image in two directions. The banner raised to gather the Lord’s people home ([[Isa. 11:12]]) is also a banner raised to gather judgment against the proud. The same God, the same kind of signal, and very different outcomes depending on which side of it we stand on.
  - ref: 3
    phrase: I have commanded my sanctified ones
    kind: restoration
    title: '“My sanctified ones”'
    body: |
      “Sanctified ones” means consecrated or set apart. In ancient Israel, soldiers kept themselves ritually holy on campaign ([[Deut. 23:9–14]]; [[1 Sam. 21:5]]). Here even foreign armies are “sanctified” in the sense that the Lord has designated them for His purpose, just as He called Assyria His “rod” ([[Isa. 10:5]]).

      Nephi’s text changes the last line in an important way: “for mine anger **is not upon** them that rejoice in my highness” ([[2 Ne. 23:3]]). In the Book of Mormon, the phrase becomes a promise. Those who rejoice in the Lord’s majesty are exempt from the wrath about to fall. That reading prepares for the chapter’s final promise of mercy ([[2 Ne. 23:22]]).
  - ref: 6
    phrase: the day of the LORD is at hand
    kind: restoration
    title: The day of the Lord
    body: |
      “The day of the LORD” is a technical phrase in the prophets. It is the time when the Lord personally intervenes in history to judge the wicked and deliver the righteous ([[Joel 2:1–11]]; [[Amos 5:18–20]]; [[Zeph. 1:14–18]]). Each historical “day of the Lord,” such as the fall of Babylon, is a preview of the final one at the Second Coming.

      Latter-day revelation speaks of “the great and dreadful day of the Lord” ([[D&C 110:14–16]]; [[Mal. 4:5]]). Modern scripture also gives the reassurance Isaiah’s audience needed: “if ye are prepared ye shall not fear” ([[D&C 38:30]]).
    sources: [gs-second-coming]
  - ref: 8
    phrase: they shall be in pain as a woman that travaileth
    kind: symbol
    title: Labor pains
    body: |
      Childbirth is one of the prophets’ most common images for the day of the Lord. It comes suddenly, it can’t be stopped once it begins, and it is intensely painful ([[Jer. 30:6]]; [[1 Thes. 5:3]]). Jesus used the same image for the signs before His coming: “all these are the beginning of sorrows,” literally *birth pangs* ([[Matt. 24:8]]).

      But labor pains have a purpose. They end in new life. Isaiah will later use the image hopefully: Zion “travailed” and “brought forth her children” ([[Isa. 66:7–9]]). The anguish of the last days is the birth of a new world.
  - ref: 10
    phrase: the sun shall be darkened in his going forth
    kind: restoration
    title: Signs in the heavens
    body: |
      The sun, moon, and stars going dark is part of the traditional imagery of the day of the Lord ([[Joel 2:10]]; [[Joel 2:31]]). Jesus repeated it in His prophecy of the last days: “the sun be darkened, and the moon shall not give her light, and the stars shall fall from heaven” ([[Matt. 24:29]]; [[JS—M 1:33]]). Modern revelation confirms that these signs will precede His coming ([[D&C 29:14]]; [[D&C 45:42]]; [[D&C 88:87]]).

      Whether these signs are literal, symbolic, or both, the message is the same. The powers that seemed permanent will be shaken, and only the Lord will remain as a source of light ([[Isa. 60:19–20]]).
  - ref: 11
    phrase: I will punish the world for their evil
    kind: liken
    title: Babylon becomes “the world”
    body: |
      Notice that the target has grown from a city to “the world.” That’s the moment Babylon becomes a symbol. In the scriptures, Babylon stands for the whole system of pride, wealth, power, and self-indulgence that sets itself against God ([[Rev. 18:2–5]]). The Lord told the early Saints that “every man walketh in his own way, and after the image of his own god, whose image is in the likeness of the world,” an idol that “shall perish in Babylon, even Babylon the great, which shall fall” ([[D&C 1:16]]).

      The call to us is to leave it: “Go ye out from Babylon. Be ye clean that bear the vessels of the Lord” ([[D&C 133:5]]). “Go ye out from among the nations, even from Babylon, from the midst of wickedness, which is spiritual Babylon” ([[D&C 133:14]]). We don’t leave Babylon by moving. We leave it by changing what we love.
    sources: [bd-babylon]
  - ref: 12
    phrase: I will make a man more precious than fine gold
    kind: words
    title: More precious than gold
    body: |
      In context, this is a grim statement. So many will die that people will be *rarer* than the finest gold from **Ophir**, a distant land famous for its gold ([[1 Kgs. 9:28]]). “Precious” here means scarce.

      Readers have sometimes lifted the line out of context as a statement about human worth. That idea is true (see [[D&C 18:10]]: “the worth of souls is great in the sight of God”), but it isn’t what this verse means. It’s a good example of why context matters in Isaiah.
  - ref: 15
    phrase: Every one that is found shall be thrust through
    kind: restoration
    title: The Book of Mormon narrows the judgment
    body: |
      Verses 15–16 describe the horrors of ancient siege warfare in unflinching terms. War was brutal, and the prophets did not hide it.

      Nephi’s version of verse 15 has a significant difference: “Every one that is **proud** shall be thrust through; yea, and every one that is joined **to the wicked** shall fall by the sword” ([[2 Ne. 23:15]]). The judgment is aimed at the proud and those who align themselves with wickedness, not simply at whoever happens to be found. It fits the theme of verse 11, “I will cause the arrogancy of the proud to cease.”
  - ref: 17
    phrase: I will stir up the Medes against them
    kind: history
    title: The Medes, named in advance
    body: |
      The **Medes** were an Iranian people east of Mesopotamia. In Isaiah’s day they were a loose collection of tribes. Over the next century they became a major power, helped Babylon destroy Assyria (612 BC), and then joined with the Persians under Cyrus the Great. In 539 BC, the combined Medo-Persian army took Babylon, reportedly without a major battle ([[Dan. 5:28–31]]).

      Isaiah’s detail that they “shall not regard silver” fits. No bribe or tribute would turn them back. Babylon’s wealth could not save it.
    sources: [bd-media, bd-persia, bd-cyrus]
  - ref: 19
    phrase: Babylon, the glory of kingdoms, the beauty of the Chaldees’ excellency
    kind: history
    title: The glory of kingdoms
    body: |
      At its height under Nebuchadnezzar (605–562 BC), Babylon was the most magnificent city in the world. It had massive double walls, the blue-glazed Ishtar Gate, a great ziggurat, and palaces along the Euphrates. Nebuchadnezzar looked out over it and boasted, “Is not this great Babylon, that I have built… by the might of my power, and for the honour of my majesty?” ([[Dan. 4:30]]).

      The “Chaldees” (Chaldeans) were the dynasty that ruled Babylon in that period. Isaiah calls the city their “beauty” and “excellency,” their pride. And he promises it will end like Sodom and Gomorrah.
  - ref: 20
    phrase: It shall never be inhabited
    kind: history
    title: Babylon today
    body: |
      Babylon did not disappear overnight in 539 BC. Cyrus took it largely intact, and it remained an important city under the Persians and even Alexander the Great. But it declined steadily, and by the early centuries after Christ it was largely abandoned. Its ruins, about fifty miles south of Baghdad in modern Iraq, have been excavated since the 1800s. It has never again been a great living city.

      Isaiah’s detail that not even a nomad would pitch a tent there captures the sense of a place so desolate and cursed that people avoided it.
  - ref: 21
    phrase: satyrs shall dance there
    kind: words
    title: Satyrs, owls, and dragons
    body: |
      The King James translators used some colorful words here. **Satyrs** translates *seʿirim*, literally “hairy ones.” The word can mean wild goats, and it is also used for goat-demons ([[Lev. 17:7]]). **Owls** is probably ostriches. **Dragons** (verse 22) translates *tannim*, which means jackals. **Wild beasts of the islands** are probably hyenas.

      The picture is of a ruined city inhabited only by desert creatures and, perhaps, by the eerie presences people imagined in such places. The proud city has become a haunt of wild things. John borrowed this image for the fall of latter-day Babylon: “the habitation of devils, and the hold of every foul spirit” ([[Rev. 18:2]]).
  - ref: 22
    phrase: her time is near to come, and her days shall not be prolonged
    kind: christ
    title: '“I will be merciful unto my people”'
    body: |
      The King James text ends the chapter on a note of doom. Nephi’s version adds a sentence that changes the chapter’s emotional center: “For I will destroy her speedily; **yea, for I will be merciful unto my people, but the wicked shall perish**” ([[2 Ne. 23:22]]).

      That addition makes explicit what the next verse, [[Isa. 14:1]], goes on to say: “For the LORD will have mercy on Jacob.” The destruction of Babylon is not an end in itself. It is how the Lord frees His captive people. The Savior’s judgments always have that double edge: justice on the oppressor, mercy for the oppressed.

christ: |
  Where is Christ in a chapter of judgment on Babylon? He is **the Lord of hosts** who musters the armies (verse 4), the one whose day this is. And He is the One Nephi’s text reveals in the final line: “I will be merciful unto my people” ([[2 Ne. 23:22]]).

  The fall of Babylon in scripture is always tied to the triumph of the Lamb. In Revelation, after Babylon falls, the next scene is the marriage supper of the Lamb and the Lord riding forth as “KING OF KINGS, AND LORD OF LORDS” ([[Rev. 19:6–16]]). Pride’s city falls so that His kingdom can come.

liken: |
  - Babylon is a spiritual location as much as a geographic one ([[D&C 133:14]]). Where does “Babylon” have a foothold in my life: in what I watch, what I buy, what I admire, or what I envy?
  - The Medes “shall not regard silver” (verse 17). Babylon’s wealth couldn’t save it. What am I relying on that would be useless on the day of the Lord?
  - The Lord promises, “if ye are prepared ye shall not fear” ([[D&C 38:30]]). What would make me less afraid of the signs of the times?

explore: |
  - **Two Babylons.** Read Isaiah 13, [[Jer. 50–51]], and [[Rev. 17–18]] together. How does John reuse Isaiah and Jeremiah’s images for the last days?
  - **Nephi’s text.** Compare Isaiah 13 with [[2 Ne. 23]], especially verses 3, 15, and 22. How do the differences change the chapter’s message?
  - **Leaving Babylon.** Read [[D&C 133:4–15]]. What does the Lord ask His people to do in response to Babylon?

parallels:
  - ref: 2 Ne. 23
    note: Nephi quotes the chapter, with significant differences in verses 3, 15, and 22.
    primary: true
  - ref: Rev. 18
    note: John’s vision of the fall of latter-day Babylon.
  - ref: D&C 133:5–14
    note: The Lord’s command to go out from Babylon.

sources: [bd-babylon, bd-assyria, ot-manual-14, parry-understanding, oswalt]
