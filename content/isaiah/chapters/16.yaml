chapter: 16
title: Shelter the Outcasts
tagline: Moab is invited to seek refuge in Zion, where a throne will be established in mercy, but pride keeps the door closed.
when: 'In Isaiah’s time'

setting: |
  Chapter 16 continues the oracle against Moab from chapter 15. It has three movements. First, a surprising turn toward Zion: tribute of lambs is to go to Jerusalem, and Moab’s refugees plead for shelter there (verses 1–5). This part contains one of Isaiah’s messianic glimpses, a throne “established in mercy” in the tabernacle of David. Second, Moab’s **pride**, and Isaiah’s lament as its vineyards wither (verses 6–12). Third, a dated postscript: within three years Moab’s glory will be humbled (verses 13–14).

thread: |
  Isaiah 16 poses a question that runs through the whole Bible: **when disaster comes, where will you go for refuge?**

  Moab’s refugees are wandering like birds pushed out of a nest (verse 2). The summons is remarkable. Send tribute of lambs to Jerusalem, “the mount of the daughter of Zion” (verse 1). In other words, turn to Zion’s king for protection. Then, in verses 3–4, comes a plea for shelter: “hide the outcasts; bewray not him that wandereth.” Enemies are to become refugees and guests.

  Why would this work? Because in Zion “in mercy shall the throne be established,” with a righteous King on it in “the tabernacle of David” (verse 5). The Davidic King of Isaiah 9 is the one who can shelter Moab.

  But verse 6 turns to what Moab has been. “We have heard of the pride of Moab; he is very proud” (verse 6). The words pile up: pride, haughtiness, arrogance, wrath. In verse 12 Moab wearies itself at its own high place and prays to no effect. This chapter can be read as saying that pride is what keeps Moab from the refuge. Another reading takes verses 3–4 as the humbled Moabites’ own petition, with verse 6 recalling the pride that brought them low.

  So Isaiah weeps again, this time over Moab’s vineyards, now trampled and silent (verses 7–11). On the first reading, the saddest thing about this chapter isn’t Moab’s destruction. It is the open door Moab would not walk through.

sections:
  - range: 1-5
    heading: Seek refuge in Zion
    plain: |
      Send lambs as tribute to the ruler of the land, from Sela across the desert to Mount Zion. Moab’s women are like birds pushed from the nest, fluttering at the fords of the Arnon. “Give us advice! Make a decision! Shade us as though it were night even at noon. Hide the refugees; don’t betray the fugitives. Let Moab’s outcasts live among you; be their shelter from the destroyer.” When the oppressor is gone and the destruction has ended, a throne will be established in steadfast love. A faithful King will sit on it in the house of David, one who judges fairly, seeks justice, and is quick to do what is right.
  - range: 6-12
    heading: The pride of Moab
    plain: |
      We have heard about Moab’s pride. It is enormous: arrogance, conceit, and fury, and its boasting is empty. So Moab wails for Moab. Everyone mourns for the raisin cakes of Kir-hareseth, completely ruined. Heshbon’s fields wither, and so do the vines of Sibmah. Rulers of the nations have trampled its best vines, which once spread to Jazer, into the desert, and across the sea. So I weep with Jazer for the vines of Sibmah. I drench you with my tears, Heshbon and Elealeh, because the harvest shouts are gone. Joy is gone from the orchards. No one sings in the vineyards, and no one treads grapes in the presses. I have ended the harvest shouting. My heart moans for Moab like a harp, my inner self for Kir-hareseth. When Moab wears itself out at its high place and goes to its shrine to pray, it will do no good.
  - range: 13-14
    heading: Within three years
    plain: |
      This is what the Lord said about Moab in the past. But now the Lord says: “Within three years, counted as exactly as a hired worker counts his contract, Moab’s splendor and its great population will be brought into contempt. Only a few will be left, small and weak.”

notes:
  - ref: 1
    phrase: Send ye the lamb to the ruler of the land
    kind: history
    title: Moab’s lambs
    body: |
      Moab raised sheep. Scripture remembers that King Mesha of Moab “was a sheepmaster, and rendered unto the king of Israel an hundred thousand lambs, and an hundred thousand rams, with the wool” as annual tribute ([[2 Kgs. 3:4]]). Lambs sent to Jerusalem, “from Sela to the wilderness,” are a ruler’s tribute: Moab is to turn to the house of David for protection.

      Latter-day Saints may also hear a deeper resonance. The lamb sent “unto the mount of the daughter of Zion” may call to mind the Lamb of God, whose sacrifice opens refuge to every nation ([[John 1:29]]; [[1 Ne. 10:10]]).
    sources: [delitzsch, lds-scriptures]
  - ref: 2
    phrase: as a wandering bird cast out of the nest
    kind: symbol
    title: Birds pushed from the nest
    body: |
      The women of Moab flutter like a bird driven from its nest at the fords of the **Arnon**, a river on Moab’s own soil. It’s a tender image of vulnerability.

      Compare the Savior’s lament: “how often would I have gathered thy children together, even as a hen gathereth her chickens under her wings, and ye would not!” ([[Matt. 23:37]]; [[3 Ne. 10:4–6]]). Here the Savior’s offer and Isaiah’s picture of Moab’s refugees meet: the question is whether the wandering will come to shelter.
    sources: [delitzsch, lds-scriptures]
  - ref: 3
    phrase: hide the outcasts; bewray not him that wandereth
    kind: words
    title: Sheltering refugees
    body: |
      *Bewray* is an old word meaning to reveal or betray. The plea is: hide the fugitives, and don’t hand them over to their pursuers. “Make thy shadow as the night in the midst of the noonday” asks for a shelter dark enough that the pursuer cannot see them, even at noon.

      The law of Moses repeatedly commanded kindness to the stranger, “for ye were strangers in the land of Egypt” ([[Deut. 10:19]]; [[Lev. 19:33–34]]). The Savior taught that welcoming a stranger is welcoming Him ([[Matt. 25:35–40]]). Here Zion is asked to shelter even the refugees of a hostile nation.
    sources: [delitzsch, lds-scriptures]
  - ref: 5
    phrase: in mercy shall the throne be established
    kind: christ
    title: A throne built on mercy
    body: |
      “Mercy” here is *chesed*, a word for kindness that is used of the Lord’s faithfulness to His covenants, including the one with David. The throne in “the tabernacle of David” will be built on that foundation, and its King will judge with truth and be quick to do what is right.

      This is the same Davidic King Isaiah has already described ([[Isa. 9:6–7]]). The Aramaic Targum takes the verse as messianic, and “grace and truth” and “justice and righteousness” are the marks of those times. Amos promised that the Lord would “raise up the tabernacle of David that is fallen” ([[Amos 9:11]]), and at the Jerusalem council James quoted Amos to show that the Gentiles were now being gathered into it ([[Acts 15:13–17]]). The throne of Jesus Christ is where outcasts, even from Moab, find refuge.
    sources: [delitzsch, bdb, lds-scriptures]
  - ref: 6
    phrase: We have heard of the pride of Moab; he is very proud
    kind: words
    title: Pride keeps the door closed
    body: |
      The Hebrew piles up words of the same stem: pride, proud, haughtiness. It’s as if Isaiah can’t find enough words, and the heaping-up shows how completely pride had taken hold of Moab. And he adds that Moab’s boasting is empty: “his lies shall not be so.”

      On one reading, this is why the refuge of verses 1–5 goes untaken. President Ezra Taft Benson taught that the central feature of pride is enmity, toward God and toward others, and that we “pit our will against God’s.” Moab prays at its own shrine (verse 12) rather than before Zion’s King.
    sources: [benson-pride, delitzsch]
  - ref: 8
    phrase: the vine of Sibmah
    kind: symbol
    title: Moab’s vineyards
    body: |
      The vineyards of **Sibmah**, **Heshbon**, and **Jazer** are the ones Isaiah mourns. He pictures their vines spreading so far that their tendrils reach into the desert and “over the sea” (which sea is uncertain; one proposal is a large pool at Jazer). Now foreign “lords of the heathen” have trampled them.

      It is the Song of the Vineyard ([[Isa. 5:1–7]]) in a new key. Israel is not the only vineyard that can be trampled when it bears pride instead of good fruit.
    sources: [delitzsch]
  - ref: 11
    phrase: my bowels shall sound like an harp for Moab
    kind: words
    title: A heart that moans like a harp
    body: |
      The Hebrew word for **bowels** means the inner organs, and in this verse it is used figuratively for the seat of the emotions, as we speak of the “heart.” To say “my bowels sound like a harp” is to say that grief is vibrating through me like plucked strings, a low moaning that won’t stop.

      Isaiah uses the same word for the Lord’s own compassion: “the sounding of thy bowels and of thy mercies toward me” ([[Isa. 63:15]]; [[Jer. 31:20]] does the same). Alma described the Savior being “filled with mercy, according to the flesh” ([[Alma 7:12]]), and the risen Christ said to the Nephites, “my bowels are filled with compassion towards you… my bowels are filled with mercy” ([[3 Ne. 17:6–7]]). Isaiah’s grief for Moab is a small reflection of the Lord’s own.
    sources: [bdb, lds-scriptures]
  - ref: 14
    phrase: Within three years, as the years of an hireling
    kind: words
    title: Counted exactly
    body: |
      A hired laborer remitted nothing of his working time and gave nothing extra. So “three years, as the years of an hireling” is meant exactly: three years, rather under than over. Isaiah uses the same expression in [[Isa. 21:16]].

      The prophecy was dated. Isaiah was willing to put a clock on the Lord’s word, as he did in [[Isa. 8:1–4]].
    sources: [delitzsch, lds-scriptures]

christ: |
  The center of this chapter is verse 5: a throne established in **mercy** (*chesed*), in the tabernacle of David, with a King who judges in truth and hurries to do right. That is Jesus Christ, the Son of David, whose throne is a refuge for outcasts from every nation, including Moab.

  The chapter also shows two ways to respond to Him. One is to send the lamb to Zion (verse 1) and find shelter. The other is to stay proud and pray at your own high place (verses 6, 12). He offers His covert “from the face of the spoiler” (verse 4) to all. On the reading followed here, Moab’s tragedy was refusing it.

explore: |
  - **The tabernacle of David.** Read [[Amos 9:11–12]] and [[Acts 15:13–17]]. How did the early Church understand the rebuilding of David’s tabernacle?
  - **The Lord’s compassion.** Compare Isaiah’s “bowels” for Moab with [[Isa. 63:15]], [[3 Ne. 17:6–7]], and [[Alma 7:11–12]].
  - **Pride.** Read President Ezra Taft Benson’s “Beware of Pride” (April 1989) and compare its description with Isaiah 16:6.

parallels:
  - ref: Jer. 48:29–47
    note: Jeremiah’s use of the lament over Moab’s pride and vineyards.

sources: [benson-pride, delitzsch, bdb, ot-manual-14, lds-scriptures]
