chapter: 5
title: The Song of the Vineyard
tagline: A love song that turns into a verdict, six woes against a self-satisfied people, and a banner raised to the nations.
when: 'Mid-eighth century BC, probably in the reigns of Uzziah and Jotham'

setting: |
  Isaiah 5 opens with a performance, probably from the prosperous days of Uzziah and Jotham. Isaiah steps forward like a singer and announces a love song about his friend’s vineyard. Vineyards were familiar and beloved, and every hearer knew the work of clearing a hillside and planting it.

  Then the song goes wrong, the audience is asked to judge, and too late they realize they are the defendants. It is the same trap the prophet Nathan set for King David ([[2 Sam. 12:1–7]]).

  The chapter then pronounces six “woes” on the sins of prosperous Judah and ends with an ominous army summoned from far away. Nephi included the chapter as [[2 Ne. 15]], and its central question, “What could have been done more to my vineyard?”, echoes through Zenos’s allegory in [[Jacob 5]].

thread: |
  Isaiah 5 is a parable that becomes a mirror. The song moves in three stages.

  **The Lord’s care (verses 1–2).** Everything a vinedresser could do is done: the best hill, the stones cleared, the choicest vines, a watchtower, a winepress carved in the rock in hopeful expectation of a harvest. Then comes the heartbreaking line: “and it brought forth wild grapes.”

  **The audience’s verdict (verses 3–6).** The singer turns to the crowd: *You judge. What more could I have done?* No one can name anything. So he announces what he will do: remove the hedge, break the wall, let it go wild, and command the clouds not to rain. That last detail gives the game away. Only God commands the clouds. This vinedresser is the Lord.

  **The reveal (verse 7).** “The vineyard of the LORD of hosts is the house of Israel.” The final line is a pun that is impossible to miss in Hebrew: He looked for *mishpat* (justice) and found *mispach* (violence); for *tsedaqah* (righteousness) and heard *tseʿaqah* (a cry of distress).

  The six woes that follow (verses 8–23) are the “wild grapes” named one by one: greed for land, drunken partying, mocking God’s timing, redefining good and evil, arrogance, and corrupt courts. The chapter ends by answering the song’s threat. The Lord raises an ensign, whistles, and a relentless army arrives (verses 26–30). In Isaiah’s day that army was Assyria. Latter-day Saints also hear in the ensign a promise of gathering.

  The chapter’s question is the one that should stop us: *What could have been done more?* When a life bears wild grapes, the problem is never a lack of care from the Gardener.

sections:
  - range: 1-7
    heading: A love song about a vineyard
    plain: |
      Let me sing a song for my dear friend about his vineyard. He had a vineyard on a fertile hill. He dug it up, cleared the stones, planted the best vines, built a watchtower, and carved out a winepress. He expected good grapes, but it produced sour, wild ones. Now, people of Jerusalem and Judah, you be the judge: what more could I have done for my vineyard? So here is what I’ll do: I’ll tear down its hedge and wall, let it be trampled and overgrown, and command the clouds not to rain on it. The vineyard of the Lord is the house of Israel. He looked for justice and found violence; for righteousness, and heard a cry of distress.
  - range: 8-17
    heading: Woe to the greedy and the partiers
    plain: |
      Woe to you who buy up house after house and field after field until you own everything and live alone in the land. Your mansions will stand empty, and your huge vineyards will yield almost nothing. Woe to you who start drinking at dawn and party all night with music and wine but never notice what the Lord is doing. My people will go into exile without knowing it. Death is opening its mouth wide for them. The proud will be humbled, and the holy God will show Himself holy through justice. Lambs will graze in the ruins of the rich.
  - range: 18-25
    heading: Woe to those who scoff and twist the truth
    plain: |
      Woe to you who drag your sins behind you like a cart on a rope and scoff, “Let God hurry up and do something so we can see it!” Woe to you who call evil good and good evil, who swap darkness for light and bitter for sweet. Woe to you who think you are so wise. Woe to you who are champions at drinking and take bribes to let the guilty go free and deny justice to the innocent. You will burn like dry straw, because you rejected the law of the Lord. His anger has struck His people, and still His hand is stretched out.
  - range: 26-30
    heading: An ensign to the nations
    plain: |
      He will raise a banner for the distant nations and whistle for them from the ends of the earth. Here they come, fast! None of them are tired or stumbling; none sleep; not a belt is loose or a sandal strap broken. Their arrows are sharp, their horses’ hooves like flint, their chariot wheels like a whirlwind. They roar like lions, seize their prey, and carry it off. In that day the land will be dark with distress.

notes:
  - ref: 1
    phrase: Now will I sing to my wellbeloved a song of my beloved touching his vineyard
    kind: symbol
    title: A song with a trap in it
    body: |
      “Wellbeloved” and “beloved” are words from love poetry (the Hebrew *dod*, “beloved,” is the lover’s word in the Song of Solomon). So Isaiah’s audience would have expected a tender, harmless song.

      That’s the trap. By the time the listeners realize the song is about **them**, they have already judged the case (verse 3). It’s how Nathan confronted David ([[2 Sam. 12:1–7]]) and how Jesus confronted the chief priests with His own parable of a vineyard, which uses the same hedge, winepress, and tower ([[Matt. 21:33–45]]).
    sources: [bdb, delitzsch]
  - ref: 2
    phrase: gathered out the stones thereof
    kind: history
    title: Everything a vinedresser could do
    body: |
      Each detail in verse 2 represents labor and hope. The hill was too steep for a plough, so the owner dug it by hand with a hoe and cleared out the stones. The **choicest vine** (Hebrew *soreq*) was a prized variety, a bluish-red grape. The **tower** guarded and adorned the vineyard. The **winepress** was a trough cut into the rock so that it would last, and cutting it before the vines had produced anything was an act of confident hope.

      Nothing was skipped. That is the point of verse 4.

      Ancient readers saw in these details Israel’s own history and worship. The Aramaic paraphrase of Isaiah known as the Targum renders verse 2, “I built my sanctuary in the midst of them; and I gave also mine altar to make an atonement for their sins.” Delitzsch likewise reads the winepress as the temple and the tower as Jerusalem. When Jesus retold the song in the temple courts, with its hedge, winepress, and tower ([[Matt. 21:33]]), the chief priests “perceived that he spake of them” ([[Matt. 21:45]]).
    sources: [delitzsch, bdb, targum-isaiah-pauli]
  - ref: 2
    phrase: it brought forth wild grapes
    kind: words
    title: Stinking grapes
    body: |
      The Hebrew *beʾushim* comes from a root meaning *to be bad* or *to smell bad*. It names the grapes of a wild vine and also good-stock grapes that have spoiled or failed to ripen: stinking, worthless fruit from a vine that looked right.

      Jesus taught the same principle: “by their fruits ye shall know them” ([[Matt. 7:16–20]]). And in Zenos’s allegory, the Lord of the vineyard grieves that “there are all kinds of bad fruit” in spite of His labor ([[Jacob 5:32]]).
    sources: [delitzsch, bdb]
  - ref: 4
    phrase: What could have been done more to my vineyard, that I have not done in it?
    kind: scripture
    title: The question of Jacob 5
    sources: [lds-scriptures]
    body: |
      This question is the emotional heart of the chapter, and it has a remarkable echo in the Book of Mormon. In Zenos’s allegory of the olive tree, the Lord of the vineyard weeps and asks: “What could I have done more for my vineyard?” ([[Jacob 5:41]]). He asks it again and again ([[Jacob 5:47]]; [[Jacob 5:49]]).

      Zenos and Isaiah both saw Israel as a planting the Lord tended with infinite patience. In Zenos’s allegory the question comes as grief: the Lord of the vineyard “wept” as he asked it ([[Jacob 5:41]]). And unlike Isaiah’s song, Zenos’s allegory goes on: the Lord and His servants labor “with their mights” one last time, and the vineyard bears good fruit again ([[Jacob 5:61–75]]). Isaiah will reach that hope too ([[Isa. 27:2–6]]).
  - ref: 6
    phrase: I will also command the clouds that they rain no rain upon it
    kind: words
    title: The vinedresser gives Himself away
    body: |
      Up to this point, the audience might think the vineyard owner is Isaiah’s human friend. But no farmer can command the clouds. In this line the singer’s identity slips out: the owner is the Lord of heaven and earth, who controls the rain ([[Deut. 11:13–17]]; [[1 Kgs. 17:1]]).

      Verse 7 then makes the application explicit. The hedge and wall that guarded the vineyard come down, and it becomes open ground for grazing and trampling ([[Isa. 5:5]]).
    sources: [delitzsch]
  - ref: 7
    phrase: he looked for judgment, but behold oppression; for righteousness, but behold a cry
    kind: words
    title: A pun that stings
    body: |
      This line is one of the most famous wordplays in the Bible. In Hebrew:

      - He looked for *mishpat* (justice), but behold *mispach* (violence; the word occurs only here, and lexicons usually take it as “bloodshed,” though some read it as forcible seizure of another’s property).
      - He looked for *tsedaqah* (righteousness), but behold *tseʿaqah* (an outcry, the scream of the oppressed).

      The words sound almost the same but mean opposite things, just as wild grapes look almost like good grapes. Judah had the *appearance* of justice and righteousness, but what the Lord actually heard was the cry of victims. The same “cry” (*tseʿaqah*) is what rose up from Sodom ([[Gen. 18:20–21]]).
    sources: [bdb, delitzsch]
  - ref: 8
    phrase: Woe unto them that join house to house, that lay field to field
    kind: history
    title: Buying up the land
    body: |
      Under the law of Moses, each family’s land was an inheritance from God that could not be permanently sold. It returned to the family in the Jubilee year ([[Lev. 25:23–28]]). In Isaiah’s day the wealthy were still adding house to house and field to field. Micah condemned the same thing ([[Micah 2:1–2]]), and the story of Naboth’s vineyard shows how far a king would go to get land ([[1 Kgs. 21]]).

      The result is loneliness: “that they may be placed alone in the midst of the earth.” Greed builds estates and destroys community.
    sources: [delitzsch]
  - ref: 12
    phrase: they regard not the work of the LORD, neither consider the operation of his hands
    kind: history
    title: Too busy celebrating to notice God
    body: |
      The problem in verses 11–12 isn’t music. Harps and pipes were used in temple worship ([[Ps. 150:3–5]]). The problem is a life so full of entertainment and indulgence that the Lord’s work goes unnoticed. The party starts at dawn and runs late into the night, and no one ever pauses to ask what God is doing.

      Verse 13 draws the conclusion: “my people are gone into captivity, because they have no knowledge.” The Hebrew is closer to “without knowing,” and the exile comes on them unawares. Hosea has a related line: “My people are destroyed for lack of knowledge” ([[Hosea 4:6]]). Captivity begins as inattention.
    sources: [delitzsch]
  - ref: 14
    phrase: hell hath enlarged herself, and opened her mouth without measure
    kind: words
    title: The open mouth of Sheol
    body: |
      “Hell” here is *Sheol*, the Hebrew word for the world of the dead. The Bible Dictionary calls it “the abode of departed spirits,” and the KJV translates it variously as “grave,” “pit,” or “hell.” Here it is personified as a monster with a gaping, bottomless mouth and throat.

      The irony is sharp. The partiers of verses 11–12 opened their mouths for wine. Now Death opens its mouth for them. Isaiah will later promise that the Lord will “swallow up death in victory” ([[Isa. 25:8]]).
    sources: [bd-sheol, delitzsch]
  - ref: 18
    phrase: draw iniquity with cords of vanity, and sin as it were with a cart rope
    kind: symbol
    title: Dragging sin behind you
    body: |
      Picture a man harnessed to a cart, dragging it behind him with a rope. These people aren’t stumbling into sin; they are hauling it around deliberately and laboriously. “Cords of vanity” are cords of falsehood or deceit.

      Nephi used a related image: the devil “leadeth them by the neck with a flaxen cord, until he bindeth them with his strong cords forever” ([[2 Ne. 26:22]]). The image moves from a flaxen cord to strong cords that bind forever.
    sources: [delitzsch, lds-scriptures]
  - ref: 19
    phrase: Let him make speed, and hasten his work, that we may see it
    kind: scripture
    title: '“Let God hurry up”'
    body: |
      These are scoffers, the skeptics the Psalms and Proverbs call fools and scorners. When Isaiah warned of judgment, they mocked: *If the Holy One of Israel has a plan, let’s see it. Tell Him to hurry up.* Peter warned of the same attitude in the last days: “Where is the promise of his coming?” ([[2 Pet. 3:3–4]]). The Book of Mormon records unbelievers saying the time for Christ’s birth had passed ([[3 Ne. 1:5–9]]).

      Delay is not denial. The Lord’s timing is part of His mercy ([[2 Pet. 3:9]]).
    sources: [delitzsch, lds-scriptures]
  - ref: 20
    phrase: Woe unto them that call evil good, and good evil
    kind: scripture
    title: Redefining good and evil
    body: |
      This verse describes a society that doesn’t merely do evil but *renames* it, putting darkness for light and bitter for sweet. Once good and evil trade labels, repentance becomes almost impossible, because no one believes there is anything to repent of.

      Mormon taught how to judge rightly: “every thing which inviteth to do good, and to persuade to believe in Christ, is sent forth by the power and gift of Christ… but whatsoever thing persuadeth men to do evil, and believe not in Christ, and deny him, and serve not God, then ye may know with a perfect knowledge it is of the devil” ([[Moro. 7:16–17]]). Nephi also warned of those in the last days who would say “there is no harm in this” ([[2 Ne. 28:8]]).
    sources: [lds-scriptures]
  - ref: 21
    phrase: wise in their own eyes
    kind: scripture
    title: Wise in their own eyes
    body: |
      Isaiah’s fifth woe targets those too proud to take correction. Proverbs gives the antidote: “Be not wise in thine own eyes: fear the LORD, and depart from evil” ([[Prov. 3:7]]).

      Jacob gave the Book of Mormon’s most careful statement on the subject. Learning is not the problem: “to be learned is good if they hearken unto the counsels of God.” The danger is that “when they are learned they think they are wise, and they hearken not unto the counsel of God” ([[2 Ne. 9:28–29]]).
    sources: [delitzsch, lds-scriptures]
  - ref: 25
    phrase: For all this his anger is not turned away, but his hand is stretched out still
    kind: symbol
    title: The outstretched hand
    body: |
      This refrain will return four more times ([[Isa. 9:12]]; [[Isa. 9:17]]; [[Isa. 9:21]]; [[Isa. 10:4]]). The sentence itself shows what it means: in spite of all the punishment so far (“for all this”), the Lord’s anger has not turned away; on the contrary (“but”), His hand is still out. The Hebrew *yādô nəṭûyâ* pictures a hand stretched out over someone, poised to strike. A stele from Ugarit shows a warrior god in the same pose, an upraised arm holding a weapon overhead. Earlier in this same verse the same verb describes a blow already landed: “he hath stretched forth his hand against them, and hath smitten them.” The refrain is a warning that the judgments are not finished. Yet this is not abandonment: the Lord has not given up on His people, and the warning is meant to bring repentance.

      Many Latter-day Saints hear the outstretched hand as a sign of mercy. The Book of Mormon does picture a merciful arm, but with a different idiom. The Lord says through Nephi, “I will be merciful unto them… if they will repent and come unto me; for mine arm is lengthened out all the day long” ([[2 Ne. 28:32]]), and Jacob pleads with his people to repent “while his arm of mercy is extended towards you in the light of the day” ([[Jacob 6:5]]). In English, “stretched out” and “extended” sound like the same gesture; in the scriptures they are nearly opposites. Both belong to the same God, and which one we meet depends on whether we turn.
    sources: [gee-hand-lord, sc-knowhy-49, delitzsch, biblehub-interlinear, lds-scriptures]
  - ref: 26
    phrase: he will lift up an ensign to the nations from far
    kind: symbol
    title: An ensign and a whistle
    body: |
      An **ensign** is a banner or standard raised on a hill as a rallying point. To **hiss** is to whistle, the way a beekeeper whistled to call bees (see [[Isa. 7:18]]). In Isaiah’s immediate context, the Lord is summoning a foreign army, Assyria, to carry out the judgment of verses 5–6. Verses 27–30 describe that army: tireless, disciplined, and unstoppable.

      Latter-day Saints have also read the ensign as a symbol of the Book of Mormon and the restored Church, lifted up to gather Israel from the ends of the earth. That is how Isaiah himself uses the image elsewhere ([[Isa. 11:12]]; [[Isa. 49:22]]; [[Isa. 62:10]]), and how the Lord uses it in modern revelation ([[D&C 45:9]]; [[D&C 64:42]]). Both readings teach the same truth: the Lord directs the movements of nations to accomplish His purposes, whether in judgment or in gathering.
    sources: [gs-ensign, delitzsch]
  - ref: 27
    phrase: None shall be weary nor stumble among them
    kind: prophets
    title: Trains and airplanes?
    body: |
      Elder LeGrand Richards suggested that verses 26–29 describe the modern gathering of Israel. In his reading, the horses’ “hoofs… like flint” and “wheels like a whirlwind” are trains, the lions’ “roaring” is the sound of airplanes, and since trains and airplanes do not stop for night, “none shall slumber nor sleep.” Isaiah “could hardly have mentioned them by name,” so he described them with the images he had.

      It is an imaginative and faith-filled application. It is also good to recognize that in Isaiah’s original setting these verses describe the Assyrian army as an instrument of judgment. Both can be true: Nephi’s habit was to “liken all scriptures unto us” ([[1 Ne. 19:23]]).
    sources: [richards-israel, ot-manual-13, delitzsch, lds-scriptures]

christ: |
  The Vinedresser of Isaiah 5 is the Lord Jehovah, the premortal Jesus Christ, who planted Israel, tended it, and wept over its wild grapes. Jesus retold this song in the temple during the last week of His life ([[Matt. 21:33–45]]). In His version, the owner sends servants and then his own son, whom the tenants kill. The Vinedresser Himself would come into the vineyard and be rejected by it.

  In Zenos’s allegory the Lord of the vineyard labors alongside His servants for the last time ([[Jacob 5:72]]). And the Lord whose hand is raised in warning in this chapter’s refrain is the same Lord whose arm of mercy is extended all the day long, and whose hands bear the marks of crucifixion ([[3 Ne. 11:14–15]]). He warns in order to save.

explore: |
  - **Three vineyards.** Read Isaiah 5:1–7, [[Jacob 5]], and [[Matt. 21:33–45]] together. What does each add? How does Zenos’s ending differ from Isaiah’s?
  - **The second vineyard song.** Isaiah returns to the vineyard in [[Isa. 27:2–6]] with a very different tone. What has changed?
  - **Six woes.** Compare this chapter’s woes with the “woes” Jacob pronounces in [[2 Ne. 9:27–38]]. Jacob had just read Isaiah to his people ([[2 Ne. 6–8]]); do you see his influence?

parallels:
  - ref: 2 Ne. 15
    note: Nephi quotes the chapter.
    primary: true
  - ref: Jacob 5:41–49
    note: '“What could I have done more for my vineyard?”'
  - ref: Matt. 21:33–45
    note: Jesus retells the vineyard parable to the chief priests.

