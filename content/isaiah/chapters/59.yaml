chapter: 59
title: The Redeemer Shall Come to Zion
tagline: The prophet explains that sin, not a weak God, keeps salvation away; the people confess that they are groping in darkness; and the Lord, finding no one to intervene, puts on His armor and comes Himself.
when: 'Setting: the community in Judah, late sixth century BC; quoted by Paul, c. AD 57'

setting: |
  Chapter 58 ended with a people asking why God did not see their fasting. Chapter 59 widens the question: why has the salvation promised in chapters 40–55 not come? The chapter moves in three steps, and the pronouns mark them. First the prophet accuses: “your iniquities… your sins” (verses 1–8). Then the people confess: “we wait for light… we grope… our sins testify against us” (verses 9–15). Finally the Lord acts: “he saw… his arm brought salvation” (verses 16–21). The confession is spoken in the first person plural, with the prophet standing at the head of his people as the leader of their prayer.

  The last verses set up the center of this division. The Lord comes as a warrior and Redeemer (verses 16–20), and He places His Spirit and His words on someone for all generations (verse 21). Chapter 60 answers the darkness of verses 9–10 with “Arise, shine; for thy light is come,” and chapter 61 begins, “The Spirit of the Lord GOD is upon me.”

  Paul quoted this chapter twice in Romans: verses 7–8 in his argument that all have sinned ([[Rom. 3:15–17]]), and verses 20–21 in his promise that “all Israel shall be saved” ([[Rom. 11:26–27]]). The armor of verse 17 became the armor of God in Ephesians and in the Doctrine and Covenants.

thread: |
  Isaiah 59 is about **what happens when there is no one to save**.

  The chapter begins by clearing God of blame. His hand is not too short and His ear is not deaf (verse 1). The distance comes from the other side: “your iniquities have separated between you and your God” (verse 2). The prophet then describes a society where no one pleads for truth, where schemes hatch like snake eggs and the paths are crooked (verses 3–8).

  In verse 9 the people stop defending themselves. They admit they are walking in darkness and groping like the blind, and that their sins testify against them (verses 9–13). Truth has fallen in the street (verse 14).

  Then the Lord looks for someone to step in and finds “no man… no intercessor” (verse 16). So He does it Himself. He puts on righteousness as a breastplate and salvation as a helmet and comes to repay His enemies and redeem His people (verses 16–20). The chapter’s answer to human helplessness is not a better human effort but a divine Redeemer. And it ends with a covenant: His Spirit and His words will stay with His people, generation after generation (verse 21).

sections:
  - range: 1-8
    heading: Your iniquities have separated you
    plain: |
      Look: the Lord’s hand is not too short to save, nor His ear too dull to hear. It is your sins that have separated you from your God. Your sins have hidden His face from you, so that He does not hear. Your hands are stained with blood and your fingers with guilt. Your lips speak lies, and your tongue mutters wickedness. No one sues justly; no one goes to court honestly. They rely on empty words and tell lies; they conceive trouble and give birth to evil. They hatch viper’s eggs and weave spider webs. Whoever eats their eggs dies, and when one is crushed, a snake comes out. Their webs are useless for clothing; they cannot cover themselves with what they make. Their deeds are evil deeds, and violence is in their hands. Their feet run to do evil, and they rush to shed innocent blood. Their thoughts are evil thoughts; ruin and destruction mark their roads. They don’t know the way of peace, and there is no justice in their paths. They have made their roads crooked, and no one who walks on them will know peace.
  - range: 9-15
    heading: We grope like the blind
    plain: |
      So justice is far from us, and righteousness does not reach us. We look for light, but everything is dark; for brightness, but we walk in gloom. We feel our way along the wall like the blind, groping like people without eyes. We stumble at noon as if it were night; in desolate places we are like the dead. We all growl like bears and moan like doves. We look for justice, but there is none; for salvation, but it is far from us. For our offenses are many before You, and our sins testify against us. Our offenses are with us, and we know our sins: rebelling against the Lord and denying Him, turning our backs on our God, talking oppression and revolt, conceiving lies in our hearts and speaking them. So justice is driven back, and righteousness stands far off; truth has stumbled in the public square, and honesty cannot enter. Truth is nowhere to be found, and whoever turns from evil becomes a target. The Lord saw it, and He was displeased that there was no justice.
  - range: 16-21
    heading: His own arm brought salvation
    plain: |
      He saw that there was no one, and He was appalled that no one intervened. So His own arm brought salvation, and His own righteousness sustained Him. He put on righteousness as His breastplate and the helmet of salvation on His head; He put on garments of vengeance and wrapped Himself in zeal as a cloak. He will repay each according to what they have done: wrath to His enemies, retribution to His foes; He will repay the islands what they deserve. From the west people will fear the name of the Lord, and from the rising of the sun they will revere His glory. When the enemy comes in like a flood, the Spirit of the Lord will raise a standard against him. “The Redeemer will come to Zion, to those in Jacob who turn from their sins,” says the Lord. “As for Me, this is My covenant with them,” says the Lord. “My Spirit, who is on you, and My words that I have put in your mouth will not leave your mouth, or the mouths of your children, or the mouths of their descendants, from now on and forever,” says the Lord.

notes:
  - ref: 2
    phrase: But your iniquities have separated between you and your God
    kind: words
    title: What separates
    body: |
      Verse 1 answers a suspicion the people have voiced before. Earlier in the book the Lord asked, “Is my hand shortened at all, that it cannot redeem?” ([[Isa. 50:2]]). A “short hand” was an idiom for weakness; the inhabitants of cities that fell to Assyria were literally “short of hand” ([[Isa. 37:27]], “of small power”). When the promised salvation did not come, the people assumed the problem was God’s: He was unable, or He was not listening.

      Verse 2 relocates the problem. “Separated” is the verb *bādal*, the word used in creation when God “divided the light from the darkness” ([[Gen. 1:4]]) and, three chapters earlier, the word the foreigner used when he feared the Lord had “utterly separated” him from His people ([[Isa. 56:3]]). The foreigner feared a barrier God had set up. Here the only real barrier is sin, and the people built it themselves. Their sins “have hid his face from you,” reversing the priestly blessing, “The LORD make his face shine upon thee” ([[Num. 6:25]]).

      The verse presents the distance as one that can be closed. A God with a short arm could not help; a God separated by sin can be approached by turning from sin. The chapter ends exactly there: the Redeemer comes “unto them that turn from transgression” (verse 20).
    sources: [mt-sefaria, bdb]
  - ref: 5
    phrase: They hatch cockatrice’ eggs, and weave the spider’s web
    kind: symbol
    title: Snake eggs and spider webs
    body: |
      Two images describe the schemes of verse 4. The first is venomous: the people “hatch cockatrice’ eggs” (*ṣipʿônî*, a venomous snake). Whoever eats the eggs dies; whoever crushes one releases a snake. Their plans are deadly whether you accept them or oppose them.

      The second image is futile: “they weave the spider’s web,” and “their webs shall not become garments.” A web takes skill and looks like cloth, but no one can wear it. The people “cover themselves” with their works, and the covering is useless.

      Keep the clothing image in mind. At the end of the chapter the Lord clothes Himself: He puts on righteousness, salvation, vengeance, and zeal (verse 17). The people cannot make a garment that covers them. Chapter 61 uses the same clothing image: “he hath clothed me with the garments of salvation, he hath covered me with the robe of righteousness” ([[Isa. 61:10]]).
    sources: [mt-sefaria, delitzsch]
  - ref: 7
    phrase: 'Their feet run to evil, and they make haste to shed innocent blood'
    kind: christ
    title: Paul’s evidence that all have sinned
    body: |
      Verse 7 echoes Proverbs almost word for word: “their feet run to evil, and make haste to shed blood” ([[Prov. 1:16]]). There it described a gang of robbers. Isaiah applies it to the whole society.

      Paul went further. In the opening chapters of Romans he argues that both Jews and Gentiles stand in need of Christ, and he closes the argument with a chain of Old Testament quotations. Most come from the Psalms (“There is none righteous, no, not one,” [[Rom. 3:10]]), and in the middle he quotes these verses: “Their feet are swift to shed blood: Destruction and misery are in their ways: And the way of peace have they not known” ([[Rom. 3:15–17]]). His conclusion: “all have sinned, and come short of the glory of God” ([[Rom. 3:23]]).

      Paul was reading the chapter the way it reads itself. Isaiah’s accusation in verses 1–8 leads straight into the people’s confession in verses 9–15 and then to the Lord’s intervention in verses 16–20. Romans follows the same order: accusation, universal guilt, and then the righteousness of God revealed in Christ ([[Rom. 3:21–26]]).
  - ref: 10
    phrase: We grope for the wall like the blind
    kind: history
    title: The covenant curse
    body: |
      With verse 9 the people stop arguing and confess. Their confession borrows the language of the covenant curses Moses pronounced on Israel if they broke the covenant: “thou shalt grope at noonday, as the blind gropeth in darkness, and thou shalt not prosper in thy ways” ([[Deut. 28:29]]). They recognize their own situation in it: the consequences the covenant described.

      The confession also reverses the promises of the chapter before. There the Lord promised that “thy light rise in obscurity, and thy darkness be as the noonday” ([[Isa. 58:10]]). Here the people say, “we wait for light, but behold obscurity… we stumble at noonday as in the night.” The very words of the promise have become a description of their failure.

      The prophet here stands with his people rather than above them, leading them in the confession. [Light Rising on Zion](/isaiah/themes/light/) follows the light through the book.
    sources: [delitzsch]
  - ref: 16
    phrase: 'he saw that there was no man, and wondered that there was no intercessor: therefore his arm brought salvation unto him'
    kind: christ
    title: No intercessor
    body: |
      The Lord looks for someone to intervene and finds no one. Ezekiel described the same search: “I sought for a man among them, that should make up the hedge, and stand in the gap before me for the land… but I found none” ([[Ezek. 22:30]]).

      “Intercessor” is *mapgîaʿ*, from the verb *pāgaʿ*, “to meet, intervene.” Isaiah used the same verb twice in the fourth Servant Song: “the LORD hath laid on him the iniquity of us all” (*hipgîaʿ*), and he “made intercession for the transgressors” (*yapgîaʿ*) ([[Isa. 53:6]]; [[Isa. 53:12]]). The people have no intercessor of their own; the one who intercedes in the book is the servant. See [The Servant Songs](/isaiah/themes/servant-songs/#song-4).

      So the Lord acts with “his arm,” an image that has run through these chapters: “Awake, awake, put on strength, O arm of the LORD” ([[Isa. 51:9]]); “to whom is the arm of the LORD revealed?” ([[Isa. 53:1]]). Chapter 63 has a matching verse, where the Lord comes from Edom with red garments: “I looked, and there was none to help… therefore mine own arm brought salvation unto me” ([[Isa. 63:5]]). Latter-day revelation applies that passage to the Savior’s Second Coming ([[D&C 133:46–51]]). He is the one who stood in the gap when no one else could. [The Arm of the Lord](/isaiah/themes/arm-of-the-lord/#alone) follows the image through the book.
    sources: [mt-sefaria, bdb]
  - ref: 17
    phrase: For he put on righteousness as a breastplate, and an helmet of salvation upon his head
    kind: scripture
    title: The armor of God
    body: |
      Here the Lord dresses for battle. Righteousness is His breastplate, salvation His helmet, vengeance His clothing, and zeal His cloak. This is the Divine Warrior of ancient Israel’s poetry, the Lord who fights for His people ([[Ex. 15:3]]).

      The New Testament took this armor and gave it to believers. Paul told the Thessalonians to put on “the breastplate of faith and love; and for an helmet, the hope of salvation” ([[1 Thess. 5:8]]). In Ephesians he developed it into the full armor of God: “having on the breastplate of righteousness… And take the helmet of salvation, and the sword of the Spirit, which is the word of God” ([[Eph. 6:14–17]]). The Lord repeated the Ephesians passage in a revelation to Joseph Smith in 1830, with changes, calling it “my whole armor” and “the sword of my Spirit” ([[D&C 27:15–18]]).

      There is a real change between Isaiah and Paul. In Isaiah, only God wears the armor, because there was “no man” to fight (verse 16). In Paul, His people wear it too. The Book of Mormon has a prophet making the same move six centuries before Paul. Lehi, near the end of his life, urged his sons, “Awake, my sons; put on the armor of righteousness” ([[2 Ne. 1:23]]), which is probably a loose echo of this verse from the brass plates. The pieces of armor they wear are His own qualities: righteousness, salvation, truth, and His word. The saints are protected by being clothed in what the Lord is. Note what Paul and the revelation leave out: “the garments of vengeance” remain the Lord’s alone.
    sources: [sc-knowhy-378]
  - ref: 19
    phrase: When the enemy shall come in like a flood, the Spirit of the LORD shall lift up a standard against him
    kind: words
    title: A flood and a standard
    body: |
      The Hebrew of this line is hard to translate, and the King James wording is one of two readings. It is *kî-yābôʾ kannāhār ṣār rûaḥ YHWH nōsəsâ bô*. Almost every word can be read two ways.

      The King James translators took *ṣār* as a noun, “enemy,” and connected *nōsəsâ* with *nēs*, “banner” or “standard,” the ensign Isaiah uses elsewhere ([[Isa. 11:12]]). That gives: “When the enemy comes in like a flood, the Spirit of the LORD will raise a standard against him.”

      The other reading, followed by modern translations such as the NRSVUE and NIV, takes *ṣār* as an adjective, “narrow” or “pent-up,” describing a river forced through a narrow channel and therefore swift, and *nōsəsâ* as a form of *nûs*, “to drive on.” *Rûaḥ* can mean “wind” or “breath” as well as “Spirit.” That gives: “for he will come like a pent-up stream that the wind of the LORD drives on” (NRSVUE). On this reading the one coming like a flood is not the enemy but the Lord Himself, the Warrior of verses 16–18, and the verse continues the description of His coming.

      The modern reading suits the context, since verse 18 has just described the Lord repaying His enemies. Latter-day revelation uses the language of the standard in a related way: “Arise and shine forth, that thy light may be a standard for the nations” ([[D&C 115:5]]), words that combine this verse with the next chapter’s “Arise, shine” ([[Isa. 60:1]]).
    sources: [mt-sefaria, bdb, nrsvue, niv]
  - ref: 20
    phrase: And the Redeemer shall come to Zion
    kind: christ
    title: The Redeemer to Zion
    body: |
      The Redeemer (*gōʾēl*) is the kinsman who buys back a relative from slavery or debt; see [[Isa. 54:5]]. He comes “to Zion, and unto them that turn from transgression in Jacob.” Salvation comes to Zion, but specifically to those who turn. Verse 2 said sin separates; verse 20 says the Redeemer comes to those who turn from it.

      Paul quoted verses 20–21 near the climax of his discussion of Israel’s future: “And so all Israel shall be saved: as it is written, There shall come out of Sion the Deliverer, and shall turn away ungodliness from Jacob: For this is my covenant unto them, when I shall take away their sins” ([[Rom. 11:26–27]]). Paul’s wording mostly follows the Greek Septuagint, but where the Hebrew says the Redeemer comes *to* Zion (and the Septuagint, “for the sake of Zion”), Paul says He comes *out of* Zion. Paul does not explain the change. Read within his letter, it fits his argument that the Redeemer who came to Zion goes out from it to the nations and will finally turn Jacob back. In the Septuagint, it is the Redeemer who turns ungodliness away from Jacob, rather than Jacob who turns from transgression. The two texts give both sides: the Redeemer turns Jacob, and Jacob turns.

      Latter-day Saints read Romans 11 as a prophecy of the latter-day gathering of Israel, when the covenant people will be restored to “the knowledge of their Redeemer” (compare [[1 Ne. 15:14]]).
    sources: [mt-sefaria, lxx-rahlfs, greek-nt]
  - ref: 21
    phrase: My spirit that is upon thee, and my words which I have put in thy mouth, shall not depart out of thy mouth
    kind: structure
    title: Spirit and word, generation after generation
    body: |
      The chapter closes with a covenant, and it switches suddenly to a single person, “thee.” Someone has received the Lord’s Spirit and His words, and they will not depart from him, from his children, or from his children’s children, forever.

      The language combines two promises from earlier in the book. The servant was given the Spirit: “I have put my spirit upon him” ([[Isa. 42:1]]). And the Lord said to His servant people, “I have put my words in thy mouth” ([[Isa. 51:16]]; compare the promise of a prophet like Moses, [[Deut. 18:18]]). The very next words in the book, after chapter 60’s interlude, are spoken by someone who has received exactly this: “The Spirit of the Lord GOD is upon me” ([[Isa. 61:1]]).

      For Latter-day Saints the verse describes a pattern of continuing revelation: a people who keep receiving the Spirit and the word, not only one prophet in one generation. The Lord told early missionaries that “whatsoever they shall speak when moved upon by the Holy Ghost shall be scripture” ([[D&C 68:4]]). And the promise to “thy seed’s seed” is the kind of promise made to Lehi and Joseph, that the Lord’s words would reach their distant descendants ([[2 Ne. 3:18–21]]).

christ: |
  The chapter turns on the moment when the Lord “saw that there was no man, and wondered that there was no intercessor” (verse 16). Christ is the answer: the servant who “made intercession for the transgressors” ([[Isa. 53:12]]), the arm of the Lord bared, the Redeemer who comes to Zion. Paul read verses 20–21 as a promise of what Christ will yet do for Israel ([[Rom. 11:26–27]]), and latter-day revelation applies the matching scene in chapter 63 to His Second Coming ([[D&C 133:46–52]]). He wears righteousness and salvation, and He shares them with those who put on His armor.

explore: |
  - **The armor of God.** Compare [[Isa. 59:16–17]], [[Eph. 6:10–18]], and [[D&C 27:15–18]].
  - **No one to help.** Read [[Isa. 59:15–21]] next to [[Isa. 63:1–6]] and [[D&C 133:46–52]].
  - **Paul’s use of Isaiah 59.** Read [[Rom. 3:9–26]] and [[Rom. 11:25–27]].

