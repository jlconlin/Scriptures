chapter: 42
title: Behold My Servant
tagline: The first Servant Song introduces a gentle chosen one who brings justice to the nations, while Israel, the Lord’s other servant, remains blind and deaf.
when: 'Addressed to Israel in exile'

setting: |
  Verses 1–4 are the first of the four **Servant Songs**, poems about a servant of the Lord who has a mission to Israel and to the nations and who, in the later songs, suffers for others. [The Servant Songs](/isaiah/themes/servant-songs/) page traces all four and the long debate over who the servant is.

  The tension at the center of that debate is already visible here. In chapter 41 the servant was plainly Israel ([[Isa. 41:8]]), but the servant of 42:1–7 is given a mission to the nations and is himself to be “a covenant of the people” (verse 6), and by the end of the chapter the servant Israel is blind and deaf (verse 19). Some readers take the servant to be Israel as a whole and Christians have traditionally taken him to be the Savior. Matthew applies the song to Jesus ([[Matt. 12:15–21]]).

thread: |
  Isaiah 42 is a portrait of **two servants**.

  The first appears in verses 1–9. He is chosen, upheld, and filled with the Spirit. His mission is enormous: to bring justice (*mišpāṭ*) to the nations, to be a covenant for the people and a light for the Gentiles, to open blind eyes and free prisoners. But his manner is astonishingly gentle. He doesn’t shout in the streets. He won’t break a bent reed or snuff out a flickering wick. And he won’t be broken or snuffed out himself until justice is established (verses 2–4).

  The chapter then bursts into a hymn of praise (verses 10–12), and the Lord steps forward as a warrior, and in the next breath, as a woman in labor, crying out after long silence (verses 13–14). He will lead the blind by roads they don’t know (verse 16).

  And then the second servant appears: “Who is blind, but my servant? or deaf, as my messenger that I sent?” (verse 19). This servant is Israel, which has seen much and noticed nothing, been plundered and imprisoned, and still “laid it not to heart” (verse 25).

  The juxtaposition is the chapter’s message. The Lord’s servant was supposed to open blind eyes, and the servant people is blind. Later songs return to the question. In the second, the servant’s work is to “bring Jacob again to” the Lord ([[Isa. 49:5]]), and Christian readers have seen in him a Servant who does for Israel what Israel could not do.

sections:
  - range: 1-4
    heading: The gentle servant
    plain: |
      “Here is My servant, whom I support, My chosen one, in whom I delight. I have put My Spirit on him, and he will bring justice to the nations. He will not shout or raise his voice or make it heard in the streets. He will not break a bruised reed, and he will not put out a smoldering wick. He will faithfully bring justice. He will not grow faint or be crushed until he has established justice on earth. The distant coastlands wait for his teaching.”
  - range: 5-9
    heading: A covenant and a light
    plain: |
      This is what God, the Lord, says, who created the heavens and stretched them out, who spread out the earth and everything that comes from it, who gives breath to the people on it and life to those who walk on it: “I, the Lord, have called you for a righteous purpose. I will hold your hand and protect you. I will make you a covenant for the people and a light to the nations, to open blind eyes, to bring prisoners out of the dungeon, and those who sit in darkness out of the prison. I am the Lord. That is My name. I will not give My glory to anyone else, or My praise to idols. The earlier predictions have come true, and now I announce new things. Before they spring up, I tell you about them.”
  - range: 10-12
    heading: A new song
    plain: |
      Sing a new song to the Lord, sing His praise from the ends of the earth, you who sail the sea and everything in it, you coastlands and all who live there. Let the desert and its towns raise their voices, the villages where Kedar lives. Let the people of Sela sing for joy and shout from the mountaintops. Let them give glory to the Lord and declare His praise in the coastlands.
  - range: 13-17
    heading: The warrior and the woman in labor
    plain: |
      The Lord goes out like a mighty warrior. Like a soldier He stirs up His zeal. He shouts, He roars, He triumphs over His enemies. “I have kept silent for a long time. I have held Myself back. But now, like a woman in labor, I will cry out, gasping and panting. I will lay waste the mountains and hills and dry up all their vegetation. I will turn rivers into dry land and dry up the pools. I will lead the blind by a road they don’t know. I will guide them on paths they have never traveled. I will turn the darkness in front of them into light and make the rough places smooth. These are the things I will do, and I will not abandon them.” Those who trust in idols and say to metal images, “You are our gods,” will be turned back in shame.
  - range: 18-25
    heading: The blind servant
    plain: |
      “Listen, you deaf! Look, you blind, so you can see! Who is blind but My servant, or deaf like the messenger I send? Who is as blind as the one who is perfect, as blind as the servant of the Lord? You have seen many things, but you pay no attention. Your ears are open, but you don’t listen.” The Lord was pleased, for the sake of His righteousness, to make His teaching great and glorious. But this is a people plundered and looted, all of them trapped in pits and hidden in prisons. They have become plunder with no one to rescue them, loot with no one saying, “Give it back.” Which of you will listen to this, pay attention, and hear from now on? Who handed Jacob over to be plundered, and Israel to robbers? Wasn’t it the Lord, against whom we sinned? They refused to walk in His ways and would not obey His teaching. So He poured out on them His burning anger and the violence of war. It surrounded them with flames, but they didn’t understand. It burned them, but they didn’t take it to heart.

notes:
  - ref: 1
    phrase: Behold my servant, whom I uphold; mine elect, in whom my soul delighteth; I have put my spirit upon him
    kind: christ
    title: '“In whom my soul delighteth”'
    body: |
      When Jesus was baptized, the voice from heaven said, “This is my beloved Son, in whom I am well pleased” ([[Matt. 3:17]]). The wording is close to this verse’s “mine elect, in whom my soul delighteth,” and at the Jordan the Spirit also descended on Jesus ([[Matt. 3:16]]), as in Isaiah’s “I have put my spirit upon him.” When Matthew later applies these verses to Jesus, he has the Lord say, “my beloved, in whom my soul is well pleased” ([[Matt. 12:18]]), so the two passages speak in nearly the same terms.

      Matthew makes the connection explicit. After Jesus heals many and tells them not to make Him known, Matthew quotes verses 1–4 in full as fulfilled in Him ([[Matt. 12:15–21]]).
    sources: [lds-scriptures]
  - ref: 3
    phrase: A bruised reed shall he not break, and the smoking flax shall he not quench
    kind: christ
    title: The bruised reed and the smoking wick
    body: |
      A reed (*qāneh*) that is “bruised” (*rāṣûṣ*) is cracked, and therefore half-broken already; the same phrase is used of a weak staff in [[2 Kgs. 18:21]], as a metaphor for a weak person. “Smoking flax” is a wick (*pištâ kēhâ*, “a dimly burning wick”), one that is burning feebly and very nearly out. One might expect a cracked reed to be snapped off and a failing wick to be pinched out.

      The servant does neither. One reading finds more here than is said: He will not destroy a life that is dying out, but will save it. Matthew quotes this verse right after Jesus restores a man’s withered hand and heals the crowds that followed him ([[Matt. 12:13–21]]). The Savior’s ministry was full of people others had written off: lepers ([[Luke 5:12–13]]), a woman who had bled for twelve years ([[Mark 5:25–34]]), a thief on a cross ([[Luke 23:42–43]]).

      There is also a beautiful wordplay in the next verse, visible only in Hebrew. The servant “shall not fail” (*lōʾ yikheh*, “will not be dimmed”), the same root as the dimly burning wick, “nor be discouraged” (*lōʾ yārûṣ*, “will not be crushed”), the same root as the bruised reed. Each word points back to the image in verse 3. He won’t crush the crushed, and He won’t be crushed Himself. He won’t snuff out the flickering, and He won’t flicker out Himself. Isaiah 53 will show what it cost Him: “he was bruised for our iniquities” ([[Isa. 53:5]]).
    sources: [bdb, delitzsch, biblehub-interlinear]
  - ref: 4
    phrase: the isles shall wait for his law
    kind: words
    title: Justice and teaching for the nations
    body: |
      The word *mišpāṭ* (“judgment”) occurs three times in verses 1–4. It means “justice, right, rectitude,” both as an attribute of God and as something God requires of people, and in verse 4, alongside *tôrâ*, it has the sense of divine law. One reading takes it here as divine right, “religion as the law of life.” The servant’s mission is to establish it “in the earth,” not just in Israel.

      “His law” is *tôrâ*, “direction, instruction, law,” and instruction is the first of its senses. Isaiah 2 pictured the nations streaming to Zion because “out of Zion shall go forth the law” ([[Isa. 2:3]]). Here the far-off islands wait for the servant’s *tôrâ*, which one reading takes as a longing already present among the nations.

      Latter-day Saints see the same universal scope in the Book of Mormon’s promise that the gospel will go “unto every nation, kindred, tongue, and people” ([[2 Ne. 26:13]]).
    sources: [bdb, delitzsch, biblehub-interlinear]
  - ref: 6
    phrase: give thee for a covenant of the people, for a light of the Gentiles
    kind: christ
    title: A covenant and a light
    body: |
      The servant doesn’t just *make* a covenant. He *is* one: “I will give thee for a covenant of the people.” He appears “not only as one who is the medium of a covenant to the nation, and of light to the Gentiles, but as being himself the people’s covenant and heathen’s light,” the one in whom a new covenant between Israel and the Lord is made. In him the covenant becomes a person.

      “A light of the Gentiles” (or “of the nations,” *gôyim*) will return in the second Servant Song ([[Isa. 49:6]]). When the aged Simeon held the infant Jesus in the temple, he blessed God for “A light to lighten the Gentiles, and the glory of thy people Israel” ([[Luke 2:32]]).

      The Lord uses the same language for the latter-day covenant people. He tells priesthood holders that they are to “continue in my goodness, a light unto the Gentiles, and through this priesthood, a savior unto my people Israel” ([[D&C 86:11]]). The servant’s calling is shared with those who take His name. [Light Rising on Zion](/isaiah/themes/light/) follows the light through the book.
    sources: [delitzsch]
  - ref: 7
    phrase: to bring out the prisoners from the prison, and them that sit in darkness out of the prison house
    kind: scripture
    title: Freeing the prisoners
    body: |
      Verse 22 pictures the people as snared in holes and hidden in prison houses, which can be read as a picture of exile. The deliverance of verse 7 has been read as “not only redemption from bodily captivity, but from spiritual bondage also.” Jesus read a similar passage, [[Isa. 61:1]], in the synagogue at Nazareth as a description of His mission ([[Luke 4:18]]).

      Latter-day Saints hear the same language of prisoners and darkness in what scripture says about Christ’s ministry to the dead. Peter wrote that Christ “went and preached unto the spirits in prison” ([[1 Pet. 3:18–19]]). Joseph Smith rejoiced that through temple ordinances for the dead “the prisoners shall go free” ([[D&C 128:22]]), and Joseph F. Smith saw the Savior organize His messengers to “carry the light of the gospel to them that were in darkness” ([[D&C 138:30]]). It is a fitting echo of verse 7, a mission that doesn’t stop at the grave.
    sources: [delitzsch]
  - ref: 8
    phrase: 'I am the LORD: that is my name: and my glory will I not give to another'
    kind: words
    title: '“That is my name”'
    body: |
      The Hebrew is *ʾănî YHWH hûʾ šĕmî*, “I am YHWH; that is My name.” The divine name, which the KJV represents by “LORD” in small capitals, was made known to Moses ([[Ex. 3:14–15]]; [[Ex. 6:2–3]]). One reading hears in it how truly the Lord stands alone: recalling His acts from the earliest times, He cannot let the honor due to Him be transferred to sham gods. He won’t share His glory with idols.

      Latter-day Saints understand *YHWH*, Jehovah, as the name of the premortal Jesus Christ. The Book of Mormon speaks of Him as “Jehovah” ([[2 Ne. 22:2]]; [[Moro. 10:34]]), and He appeared in the Kirtland Temple and said, “I am the first and the last; I am he who liveth, I am he who was slain; I am your advocate with the Father” ([[D&C 110:4]]).
    sources: [bd-jehovah, delitzsch, biblehub-interlinear]
  - ref: 14
    phrase: 'I have long time holden my peace; I have been still, and refrained myself: now will I cry like a travailing woman'
    kind: symbol
    title: The silence of God, and a cry of labor
    body: |
      Verses 13 and 14 put two images side by side that no one would expect together. First the Lord marches out like a warrior with a battle cry. Then He speaks of Himself as a woman in labor, gasping and panting. Isaiah uses feminine images for God elsewhere too (compare [[Isa. 49:15]]; [[Isa. 66:13]]). Here the point of the image is not gentleness but intensity. It is the panting of labor, and on one reading some great thing that the Lord has long carried is now about to be born.

      Before the cry comes a confession: “I have long time holden my peace.” The captivity had lasted several decades, which, on one reading, seems in the Lord’s love for His people an “eternity” of restraint. The Lord doesn’t deny the silence. He acknowledges that He held back, and He promises that it is ending.

      Joseph Smith, after months in Liberty Jail, cried, “O God, where art thou? And where is the pavilion that covereth thy hiding place?” ([[D&C 121:1]]). The Lord’s answer began, “My son, peace be unto thy soul” ([[D&C 121:7]]).
    sources: [delitzsch]
  - ref: 16
    phrase: I will bring the blind by a way that they knew not
    kind: scripture
    title: Paths they have not known
    body: |
      The road of deliverance is not one anyone has mapped. The Lord will lead the blind, people who can’t see the road, and He will make darkness light and the crooked straight in front of them. The unknown ways can be read as the ways of deliverance, “known to Him alone.”

      Nephi’s family knew what that was like. In the wilderness, the Lord promised: “I will also be your light in the wilderness; and I will prepare the way before you” ([[1 Ne. 17:13]]). They didn’t have a map. They had a Liahona that worked “according to the faith and diligence and heed which we did give unto them” ([[1 Ne. 16:28]]).

      The promise ends, “These things will I do unto them, and not forsake them.” The promise isn’t that the blind will see the road. It’s that He won’t leave them on it.
    sources: [delitzsch]
  - ref: 19
    phrase: Who is blind, but my servant? or deaf, as my messenger that I sent?
    kind: scripture
    title: The blind servant and the Joseph Smith Translation
    body: |
      The servant who was supposed “to open the blind eyes” (verse 7) is now called blind himself, which is jarring right after the first Servant Song. In context, the “servant” of verses 18–25 is Israel, the people who “would not walk in his ways” (verse 24). One reading also ties the “messenger whom I send” back to the servant of verses 1–7.

      The Joseph Smith Translation reworks verses 19–23 significantly. Instead of “Who is blind, but my servant?” it reads: “For I will send my servant unto you who are blind; yea, a messenger to open the eyes of the blind, and unstop the ears of the deaf; and they shall be made perfect notwithstanding their blindness, if they will hearken unto the messenger, the Lord’s servant” ([[JST, Isa. 42:19–20]]). In the JST the blind servant becomes the servant sent *to* the blind. The JST also has, for verse 22 (KJV 21), “The Lord is not well pleased with such a people, but for his righteousness’ sake he will magnify the law and make it honorable.”

      How should we understand such changes? The JST “to some extent assists in restoring the plain and precious things that have been lost from the Bible.” Whatever its relation to the original text, this reading brings the passage into harmony with verses 1–7. The Hebrew can also be read coherently on its own terms: Israel was called to be a servant and a light, and failed. The JST and the Hebrew together show both halves of the story, the servant Israel that was blind and the Servant who comes to heal the blind.
    sources: [jst-isa-42, bd-jst, delitzsch, biblehub-interlinear]
  - ref: 25
    phrase: it hath set him on fire round about, yet he knew not; and it burned him, yet he laid it not to heart
    kind: scripture
    title: Burned, and still not learning
    body: |
      The chapter ends with an image of someone standing in a fire and not noticing. Israel had suffered “the strength of battle” ([[Isa. 42:25]]) and had not “laid it to heart,” that is, had not reflected on why.

      Verse 24 is candid about the cause: “Did not the LORD, he against whom we have sinned?” Notice the shift to “we.” On one reading the prophet identifies himself with the exiles in their sin, as in [[Isa. 6:5]], “I am a man of unclean lips.” Verse 25 can be taken to mean that the war-fury raged without result, since Israel was not brought to reflection.

      The Book of Mormon describes the same pattern, suffering that doesn’t produce reflection, and its opposite. After terrible war, Mormon notes, “many had become hardened, because of the exceedingly great length of the war; and many were softened because of their afflictions” ([[Alma 62:41]]). Pain doesn’t automatically teach: the same war hardened some and softened others.
    sources: [delitzsch]

christ: |
  The New Testament identifies the servant of Isaiah 42 with Jesus, first at His baptism, when the Father’s voice spoke of One “in whom I am well pleased” and the Spirit descended on Him ([[Matt. 3:16–17]]), and then explicitly in [[Matt. 12:15–21]]. The Savior’s ministry matched the song’s surprising gentleness: He healed quietly, told people not to publicize it, and never discarded the bruised reed or the smoldering wick. He was “a covenant of the people” and “a light of the Gentiles,” and He opened blind eyes literally and spiritually ([[John 9]]).

  Isaiah 42 also sets up the logic of the Atonement. Israel, the servant people, was blind and failed its mission. The Servant, who has been called the “embodied idea of Israel,” takes up that mission and completes it, and by doing so opens the eyes of the blind servant. The wordplay of verses 3–4 points ahead to Isaiah 53: He will not be crushed until justice is established, and yet “he was bruised for our iniquities.”

explore: |
  - **The four Servant Songs.** Read them side by side on [The Servant Songs](/isaiah/themes/servant-songs/) page and trace how the servant’s suffering grows.
  - **The servant in the New Testament.** Compare [[Matt. 3:16–17]], [[Matt. 12:15–21]], [[Luke 2:25–32]], and [[Acts 13:47]].
  - **The Joseph Smith Translation.** Read [[JST, Isa. 42:19–23]] alongside the KJV and ask what each emphasizes.
  - **God as a woman in labor.** Compare [[Isa. 42:14]], [[Isa. 49:15]], [[Isa. 66:7–13]], and [[Matt. 23:37]].
  - **Redemption of the dead.** Read [[1 Pet. 3:18–20]], [[1 Pet. 4:6]], [[D&C 128:22]], and [[D&C 138:29–37]].

parallels:
  - ref: Matt. 12:15–21
    note: Matthew quotes verses 1–4 as fulfilled in Jesus.
  - ref: JST, Isa. 42:19–23
    note: Joseph Smith’s revision of the blind-servant passage.
  - ref: Luke 2:25–32
    note: Simeon calls the infant Jesus “a light to lighten the Gentiles.”

sources: [delitzsch, biblehub-interlinear, bdb, jst-isa-42, bd-jst, bd-jehovah, lds-scriptures]
