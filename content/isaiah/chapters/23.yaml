chapter: 23
title: Tyre, Merchant of the Nations
tagline: The world’s greatest trading city is silenced, and then its profits are turned into “holiness to the LORD.”
when: 'During Isaiah’s ministry, about 740–701 BC'

setting: |
  The last of the oracles against the nations (chapters 13–23) is about **Tyre**, the great Phoenician port city on the coast north of Israel, together with its older sister city **Sidon** (Zidon). Sidon was the older city; Tyre gained the lead in the Assyrian era, and when hard pressed it moved the seat of its trade and wealth to a small island just offshore. Phoenicia was the center of the world’s trade in this period, and Tyre secured its profits through colonies. Hiram of Tyre supplied cedar for Solomon’s temple ([[1 Kgs. 5:1–12]]).

  So Isaiah’s collection of oracles, which began with Babylon, the great political and military power, ends with Tyre, the great **commercial** power. Between them they represent the two faces of worldly pride: conquest and commerce.

  The chapter ends with one of the most surprising turns in Isaiah: Tyre’s wealth becomes “holiness to the LORD.”

thread: |
  Isaiah 23 is about what happens to **wealth that serves only itself**.

  The chapter opens with the ships of Tarshish, the great merchant fleet, arriving home from a long voyage to find their harbor destroyed. They hear the news at Cyprus (“Chittim”) on the way back (verse 1). Wailing spreads around the Mediterranean: Sidon, Egypt, Tarshish. The sea itself speaks like a bereaved mother: “I travail not… neither do I nourish up young men” (verse 4).

  Then comes the question (verse 8): who planned this against Tyre, “the crowning city, whose merchants are princes”? The answer: “The LORD of hosts hath purposed it, to stain the pride of all glory” (verse 9). The Lord who humbled Babylon’s military pride now humbles Tyre’s commercial pride.

  But the chapter doesn’t end in silence. After “seventy years,” Tyre will revive and go back to trading. Isaiah calls it a “harlot” (verse 17), a city that joins itself to every kingdom of the world. And then comes the twist (verse 18): “her merchandise and her hire shall be **holiness to the LORD**.” Her profits won’t be hoarded. They will feed and clothe those who dwell before the Lord.

  Wealth itself is not the enemy in Isaiah. **Pride** is. The same money that made Tyre proud can be consecrated. That is the direction of the law of consecration ([[D&C 82:17–19]]).

sections:
  - range: 1-7
    heading: Howl, ye ships of Tarshish
    plain: |
      This is the oracle about Tyre. Wail, you ships of Tarshish! Tyre is destroyed, with no house left and no harbor to enter. The news reached them from Cyprus. Be silent, you people of the coast, you merchants of Sidon, whose sailors crossed the sea and made you rich. Across the great waters came grain from the Nile; the harvest of the river was her income, and she became the marketplace of nations. Be ashamed, Sidon, for the sea, the stronghold of the sea, has spoken: “I have never been in labor or given birth; I have never raised sons or daughters.” When the news reaches Egypt, they will be in anguish over the report about Tyre. Cross over to Tarshish; wail, you people of the coast! Is this your joyful city, founded in ancient times, whose people traveled to settle distant lands?
  - range: 8-14
    heading: Who planned this?
    plain: |
      Who planned this against Tyre, the city that crowned kings, whose merchants were princes and whose traders were honored everywhere? The Lord of hosts planned it, to humble all proud splendor and to bring down all who were honored on the earth. Spread out over your land like the Nile, daughter of Tarshish; there is no longer any harbor. The Lord has stretched out His hand over the sea and made kingdoms tremble. He has commanded that Canaan’s strongholds be destroyed. He said, “You will celebrate no more, crushed virgin daughter of Sidon. Get up, cross over to Cyprus; even there you will find no rest.” Look at the land of the Chaldeans, a people that no longer exists! Assyria made it a place for desert creatures. They raised their siege towers, stripped its fortresses, and left it a ruin. Wail, you ships of Tarshish, for your stronghold is destroyed!
  - range: 15-18
    heading: Tyre’s wages made holy
    plain: |
      In that day Tyre will be forgotten for seventy years, the lifetime of a king. At the end of seventy years, Tyre will be like the prostitute in the song: “Take a harp, go around the city, forgotten prostitute! Play well and sing many songs, so you will be remembered.” At the end of seventy years the Lord will deal with Tyre. She will go back to her trade and do business with all the kingdoms of the world. But her profits and earnings will be set apart for the Lord. They won’t be stored up or hoarded. Her profits will go to those who live in the Lord’s presence, to give them plenty of food and fine clothing.

notes:
  - ref: 1
    phrase: Howl, ye ships of Tarshish
    kind: symbol
    title: Ships coming home to nothing
    body: |
      “Ships of Tarshish” came to mean ships of the largest size, suitable for long voyages; Tarshish itself was probably Tartessus in Spain. The verse pictures Phoenician trading vessels coming home and hearing the news at **Chittim** (Cyprus): their home port is gone. “There is no house, no entering in.”

      The chapter opens and closes its first half with the same cry (verses 1 and 14). Isaiah has already named the ships of Tarshish among the proud things the day of the Lord would humble ([[Isa. 2:16]]).
    sources: [bd-tarshish, bd-chittim, delitzsch]
  - ref: 4
    phrase: I travail not, nor bring forth children
    kind: symbol
    title: The sea as a childless mother
    body: |
      The sea itself speaks here, more closely “the fortress of the sea,” the rock-island on which Tyre stood. Robbed of her children, she is like a barren woman.

      Compare [[Isa. 54:1]], where childless Zion is told to sing because her children will be more than those of the married wife.
    sources: [delitzsch]
  - ref: 8
    phrase: the crowning city, whose merchants are princes
    kind: words
    title: Merchants who are princes
    body: |
      Tyre’s merchants were honored by their fellow citizens as great ones: “princes,” “the honourable of the earth.” In Tyre, money was the path to honor.

      Verse 9 gives the Lord’s purpose: “to stain the pride of all glory.” The Book of Mormon repeatedly shows how quickly riches can turn into pride and class division ([[Alma 4:6–12]]; [[3 Ne. 6:10–15]]). Jacob’s counsel is the antidote: “before ye seek for riches, seek ye for the kingdom of God” ([[Jacob 2:18–19]]).
    sources: [ot-manual-14, lds-scriptures]
  - ref: 13
    phrase: Behold the land of the Chaldeans; this people was not
    kind: history
    title: Assyria or Babylon?
    body: |
      Verse 13 is difficult. One question is whether the power that ruins Tyre here is Assyria or Chaldea (Babylon), and Delitzsch treats it as a question of how to read the verse. On his reading, as the text stands, “they” (the Chaldeans) have laid bare Tyre’s palaces and made her a heap of rubble. The plain-words paraphrase above follows the other way of reading it. Either way the point for the chapter is the same: Tyre’s island walls and wealth will not save her.
    sources: [delitzsch]
  - ref: 15
    phrase: Tyre shall be forgotten seventy years, according to the days of one king
    kind: words
    title: Seventy years
    body: |
      “Seventy years” is the span of a long human lifetime ([[Ps. 90:10]]), “the days of one king.” It is also the number Jeremiah gave for the Babylonian captivity ([[Jer. 25:11–12]]; [[Jer. 29:10]]). Delitzsch reads it as a fixed period (ten sevens) that coincides with Jeremiah’s seventy years, the length of Chaldean rule. A more general reading is that the seventy years “may refer to her coming judgments.”

      After that time, Tyre will try to get noticed again, like a forgotten courtesan walking the city with her harp (verse 16). Delitzsch notes that the prophecy here takes the tone of a popular song.
    sources: [delitzsch, ot-manual-14]
  - ref: 17
    phrase: shall commit fornication with all the kingdoms of the world
    kind: symbol
    title: Commerce as harlotry
    body: |
      Why would Isaiah call trade “fornication”? Tyre, like Babylon, is read as representing the world and joining in its wickedness. The prophets use sexual unfaithfulness as a metaphor for any relationship that betrays covenant loyalty ([[Isa. 1:21]]).

      Revelation uses the same image for Babylon, the great harlot “with whom the kings of the earth have committed fornication,” whose fall makes the merchants of the earth weep “for no man buyeth their merchandise any more” ([[Rev. 17:2]]; [[Rev. 18:3]]; [[Rev. 18:11–19]]).
    sources: [ot-manual-14]
  - ref: 18
    phrase: her merchandise and her hire shall be holiness to the LORD
    kind: scripture
    title: '“Holiness to the LORD”'
    body: |
      This is the stunning turn at the end. Tyre goes back to business, but now her profits are “holiness to the LORD.” They won’t be “treasured nor laid up,” hoarded, but will provide food and “durable clothing” for “them that dwell before the LORD.”

      “Holiness to the LORD” was the inscription on the gold plate worn on the high priest’s turban ([[Ex. 28:36–38]]). Zechariah foresaw a day when even “the bells of the horses” and ordinary cooking pots in Jerusalem would bear it ([[Zech. 14:20–21]]), when everything, even the mundane, is consecrated. 
      The idea is the heart of the **law of consecration**: property and profit dedicated to the Lord and used to care for the poor, “every man according to his wants and his needs” ([[D&C 82:17–19]]; see [[D&C 42:30–33]]). Delitzsch notes that this is not the conversion of Tyre but something approaching it: her gain would no longer be capitalized but would supply Israel, the people who dwell before the Lord. The verse is read as the world’s merchandise finally being put to proper use in building the kingdom of Jehovah.
    sources: [delitzsch, ot-manual-14]

christ: |
  The chapter’s last verse shows the Savior’s redemptive power reaching even commerce: Tyre’s wages become “holiness to the LORD.” There’s a beautiful New Testament echo. Jesus traveled to “the coasts of Tyre and Sidon,” where He healed the daughter of a Gentile woman whose persistent faith astonished Him ([[Mark 7:24–30]]; [[Matt. 15:21–28]]). He said that if His mighty works had been done in Tyre and Sidon, they would have repented ([[Matt. 11:21–22]]). Paul found a community of disciples at Tyre who knelt and prayed with him on the beach ([[Acts 21:3–6]]).

  The merchant city that Isaiah saw humbled became a place where people knelt before Jesus Christ.

explore: |
  - **Tyre in scripture.** Read [[Ezek. 26–28]] alongside Isaiah 23. How does Ezekiel develop Isaiah’s picture?
  - **Babylon the merchant.** Compare Isaiah 23 with [[Rev. 18:9–19]]. What does John take from Tyre’s imagery for Babylon?
  - **Holiness to the Lord.** Trace the phrase through [[Ex. 28:36]], [[Zech. 14:20–21]], and the law of consecration in [[D&C 42:30–39]].

sources: [bd-isaiah, bd-tyre, bd-tarshish, bd-chittim, ot-manual-14, delitzsch, lds-scriptures]
