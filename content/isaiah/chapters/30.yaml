chapter: 30
title: '“In Returning and Rest Shall Ye Be Saved”'
tagline: Envoys trek to Egypt with treasure, the people tell prophets to prophesy smooth things, and the Lord waits to be gracious.
when: 'c. 703–701 BC, as Judah negotiated with Egypt against Assyria'

setting: |
  Chapter 30 is the third “woe” of this section, and it addresses a specific policy. Around 703–701 BC, King Hezekiah’s advisers sent envoys to Egypt to negotiate a military alliance against Assyria. Isaiah considered this a spiritual betrayal. Judah was trusting Pharaoh instead of the Lord, and doing it without even asking the Lord’s prophet ([[Isa. 30:2]]).

  The chapter is famous for several beloved verses: “In returning and rest shall ye be saved; in quietness and in confidence shall be your strength” (verse 15); “thine eyes shall see thy teachers” (verse 20); and “This is the way, walk ye in it” (verse 21). Those comforting promises make more sense once you see the stubborn, anxious people they were first spoken to.

thread: |
  Isaiah 30 is about **two kinds of speed**: the frantic rush of a people who won’t trust God, and the patient waiting of a God who wants to be gracious.

  The chapter opens with motion. Envoys hurry “down into Egypt” (verse 2). Caravans of donkeys and camels loaded with treasure trek through the dangerous southern desert, full of lions and snakes, to buy help from a nation that “shall not profit them” (verse 6). Isaiah gives Egypt a mocking nickname: “Rahab-sit-still,” the dragon that does nothing (verse 7).

  Then the Lord names the deeper problem (verses 9–11). These are “children that will not hear.” They tell the seers, “See not,” and the prophets, “Prophesy not unto us right things, speak unto us smooth things.” They are even tired of hearing about “the Holy One of Israel.”

  Verse 15 is the turning point: “In returning and rest shall ye be saved; in quietness and in confidence shall be your strength: **and ye would not**.” Instead they said, “No; for we will flee upon horses” (verse 16). Isaiah replies with grim wit: *very well, you’ll flee, and your pursuers will be faster.*

  And then comes the surprise (verse 18). Even after all this, “**therefore will the LORD wait, that he may be gracious unto you**.” They wouldn’t wait for Him, so He waits for them. The rest of the chapter describes what His grace will bring. He will answer at the sound of their cry (verse 19). He will give them teachers they can see and a voice behind them saying, “This is the way, walk ye in it” (verses 20–21). There will be rain, harvest, abundant light, and the healing of wounds (verses 23–26). And Assyria, the power they feared, will be broken by the Lord’s voice alone (verses 27–33).

  The contrast is the lesson. Panic runs to Egypt; faith rests and waits. And even when we choose panic, the Lord waits to be gracious.

sections:
  - range: 1-7
    heading: Running to Egypt
    plain: |
      “Woe to the rebellious children,” says the Lord, “who carry out plans that are not Mine and make alliances not by My Spirit, piling sin on sin. They go down to Egypt without asking Me, looking for protection from Pharaoh and shelter in Egypt’s shadow. But Pharaoh’s protection will be your shame, and Egypt’s shade your disgrace. Though their officials are at Zoan and their envoys have reached Hanes, everyone will be ashamed of a people who can’t help them.” This is an oracle about the animals of the Negev: Through a land of hardship and distress, of lions, vipers, and darting snakes, the envoys carry their riches on donkeys’ backs and their treasures on camels’ humps to a people that can’t help them, to Egypt, whose help is worthless. That’s why I call her “Rahab the Do-Nothing.”
  - range: 8-14
    heading: '“Speak unto us smooth things”'
    plain: |
      Now go and write this on a tablet and inscribe it in a scroll, so it will be a witness for the days to come: these are rebellious people, deceitful children who refuse to listen to the Lord’s instruction. They say to the seers, “Stop seeing visions!” and to the prophets, “Don’t tell us what is right. Tell us pleasant things; prophesy illusions. Get out of the way, leave this path, and stop confronting us with the Holy One of Israel!” So the Holy One of Israel says: “Because you have rejected this message and relied on oppression and deceit, this sin will be like a high wall, cracked and bulging, that suddenly collapses in an instant. It will shatter like a clay pot smashed so completely that not a piece is left big enough to scoop coals from a fireplace or water from a cistern.”
  - range: 15-17
    heading: In returning and rest
    plain: |
      The Lord God, the Holy One of Israel, says: “In repentance and rest is your salvation; in quietness and trust is your strength. But you would have none of it. You said, ‘No, we will flee on horses.’ So you will flee! You said, ‘We will ride off on swift horses.’ So your pursuers will be swift! A thousand of you will flee at the threat of one; at the threat of five you will all run away, until you are left like a flagpole on a mountaintop, like a banner on a hill.”
  - range: 18-26
    heading: The Lord waits to be gracious
    plain: |
      Yet the Lord waits to be gracious to you; He rises to show you mercy. For the Lord is a God of justice. Blessed are all who wait for Him. People of Zion who live in Jerusalem, you will weep no more. He will be gracious to you when you cry for help; as soon as He hears, He will answer you. Although the Lord gives you the bread of adversity and the water of affliction, your teachers will no longer hide; you will see them with your own eyes. Whether you turn to the right or the left, your ears will hear a voice behind you saying, “This is the way; walk in it.” Then you will treat your silver-plated idols and gold-covered images as unclean and throw them away like filthy rags, saying, “Away with you!” He will send rain for the seed you sow, and the food from the land will be rich and plentiful. Your cattle will graze in broad meadows, and the oxen and donkeys that work the soil will eat seasoned fodder. On every high mountain and hill, streams of water will flow in the day of great slaughter, when the towers fall. The moon will shine like the sun, and the sunlight will be seven times brighter, like the light of seven full days, when the Lord binds up His people’s injuries and heals the wounds He inflicted.
  - range: 27-33
    heading: The Lord’s voice breaks Assyria
    plain: |
      Look! The Lord Himself comes from far away, burning with anger, in thick rising smoke. His lips are full of wrath, and His tongue is a consuming fire. His breath is like a rushing torrent rising up to the neck, sifting the nations in the sieve of destruction and putting a bit in the mouths of the peoples to lead them astray. And you will sing as on the night of a holy festival. Your hearts will rejoice as when people go up with flutes to the mountain of the Lord, to the Rock of Israel. The Lord will make His majestic voice heard and show His arm coming down with raging anger and consuming fire, with cloudburst, storm, and hail. The voice of the Lord will shatter Assyria; He will strike them with His rod. Every stroke the Lord lays on them with His punishing club will be to the music of drums and harps as He fights them in battle. Topheth has long been prepared; it has been made ready for the king. Its fire pit is deep and wide, with plenty of fire and wood; the breath of the Lord, like a stream of burning sulfur, sets it ablaze.

notes:
  - ref: 1
    phrase: that take counsel, but not of me
    kind: scripture
    title: Counsel, but not of Me
    body: |
      The first charge is subtle and searching. The people **did** take counsel and make plans. They just didn’t take them from the Lord. They made alliances (“cover with a covering,” possibly a libation poured to seal a treaty) “but not of my spirit.” Verse 2 adds that they went to Egypt “and have not asked at my mouth.” They never consulted the prophet.

      Jacob warned of the same danger: “seek not to counsel the Lord, but to take counsel from his hand” ([[Jacob 4:10]]). Alma counseled, “Counsel with the Lord in all thy doings, and he will direct thee for good” ([[Alma 37:37]]). Many of our mistakes aren’t rebellions. They are decisions we simply never took to the Lord.
  - ref: 6
    phrase: The burden of the beasts of the south
    kind: history
    title: A dangerous caravan through the Negev
    body: |
      This mini-oracle pictures the envoys’ journey south through the **Negev** desert toward Egypt, “a land of trouble and anguish.” It was a dangerous route, full of lions, vipers, and the “fiery flying serpent” (the *saraph*, as in [[Isa. 14:29]]). The caravan’s donkeys and camels are loaded with treasure to pay Egypt for its help.

      It’s a picture of how much effort and wealth people will spend running toward the wrong source of help, and how little they get in return. Egypt “shall not profit them.”

      Isaiah was not the only ancient writer to put flying serpents in the deserts between Judah and Egypt. The Greek historian Herodotus, two and a half centuries later, went to a gorge in Arabia “to make inquiries concerning the winged serpents” and reported heaps of their bones; he described the creature as shaped like a water snake, with wings like a bat’s (*Histories* 2.75–76). The seraph-serpents of the wilderness story ([[Num. 21:6]]), which Nephi also calls “fiery flying serpents” ([[1 Ne. 17:41]]), belonged to this same country.
    sources: [herodotus-rawlinson, sc-knowhy-646]
  - ref: 7
    phrase: Their strength is to sit still
    kind: words
    title: Rahab the Do-Nothing
    body: |
      The Hebrew of this line is a clever insult. It can be read as calling Egypt “**Rahab who sits still**” or “Rahab the Do-Nothing.” *Rahab* (not the woman of Jericho, a different word) was the name of a mythical sea monster of chaos, and it became a poetic nickname for Egypt ([[Ps. 87:4]]; [[Isa. 51:9]]). Egypt looked like a fearsome dragon, but when it came time to act, it would just sit there.

      That is exactly what happened. When Sennacherib invaded Judah in 701 BC, an Egyptian and Cushite army marched out to meet him, and the Assyrians defeated it at Eltekeh. Egypt was no help.
    sources: [bd-rahab, bd-egypt]
  - ref: 8
    phrase: write it before them in a table, and note it in a book, that it may be for the time to come for ever and ever
    kind: scripture
    title: Written for the time to come
    body: |
      Because the people refused to listen, the Lord told Isaiah to write the message down on a tablet and in a scroll, as a witness “for the time to come for ever and ever.” When the prophecy came true, the written record would prove that the Lord had warned them.

      This is one reason we have Isaiah’s words at all. The Lord told Nephi and later prophets the same thing: write for a future generation ([[2 Ne. 25:8]]; [[2 Ne. 26:15–17]]; [[Morm. 8:34–35]]). Moroni wrote to us “as if ye were present” ([[Morm. 8:35]]). Isaiah, too, was writing for readers he would never meet, including us.
  - ref: 10
    phrase: Prophesy not unto us right things, speak unto us smooth things, prophesy deceits
    kind: scripture
    title: '“Speak unto us smooth things”'
    body: |
      This may be one of the most honest descriptions of human nature in scripture. The people don’t say, “Lie to us.” They say, in effect, *Tell us what makes us comfortable.* “Smooth things” are flattering, easy messages. They even ask the seers not to see: “See not.”

      Samuel the Lamanite described exactly this attitude: “if a man shall come among you and shall say: Do this, and there is no iniquity; do that and ye shall not suffer… ye will receive him, and say that he is a prophet” ([[Hel. 13:27]]). Paul warned of a time when people “will not endure sound doctrine; but after their own lusts shall they heap to themselves teachers, having itching ears” ([[2 Tim. 4:3]]).

      True prophets don’t always say smooth things. That’s one way to recognize them.
  - ref: 11
    phrase: cause the Holy One of Israel to cease from before us
    kind: words
    title: Tired of the Holy One of Israel
    body: |
      This line is almost comic. Isaiah used the title “the Holy One of Israel” constantly (see [[Isa. 1:4]]). The people are sick of hearing it: *Stop talking to us about the Holy One of Israel!*

      And Isaiah’s response? The very next verse begins: “Wherefore thus saith **the Holy One of Israel**.” He uses it again in verse 15. He won’t stop. The one subject people most wanted to avoid was the one they most needed.
  - ref: 13
    phrase: as a breach ready to fall, swelling out in a high wall
    kind: symbol
    title: A bulging wall
    body: |
      Picture a tall mud-brick or stone wall with a crack in it, bulging outward more and more until, suddenly, the whole thing collapses. Sin works like that. Damage accumulates quietly until the collapse comes “suddenly at an instant.”

      Verse 14 adds another image: a clay pot smashed so thoroughly that there isn’t a single shard big enough to scoop a coal from the hearth or dip water from a cistern. Broken pottery was usually reused; this is complete ruin. Only the Potter can remake such a vessel ([[Jer. 18:1–6]]).
  - ref: 15
    phrase: In returning and rest shall ye be saved; in quietness and in confidence shall be your strength
    kind: words
    title: Returning, rest, quietness, confidence
    body: |
      This is the heart of the chapter and one of Isaiah’s most treasured verses. Four words describe the path of faith:

      - **Returning** (*shuvah*): repentance, turning back to God.
      - **Rest** (*nachat*): ceasing from frantic self-reliance.
      - **Quietness** (*hashqet*): calm, undisturbed trust.
      - **Confidence** (*bitchah*): trust and security in the Lord.

      This is not passivity. It is where real strength lies. It’s the same counsel Isaiah gave Ahaz: “Take heed, and be quiet; fear not” ([[Isa. 7:4]]). The Lord gave the Saints similar counsel in times of turmoil: “be still and know that I am God” ([[D&C 101:16]]).

      And then the four saddest words in the chapter: “**and ye would not**.”
  - ref: 16
    phrase: we will flee upon horses; therefore shall ye flee
    kind: words
    title: Wordplay on flight
    body: |
      Isaiah turns their own words against them with a pun. They said, “We will flee (*nanus*) upon horses” (meaning *we’ll charge ahead on warhorses*). The Lord replies: “therefore shall ye flee (*tenusun*),” in retreat. They said, “We will ride upon the swift.” He replies: *then your pursuers will be swift.*

      Verse 17 reverses a promise from the law. Moses had promised that faithful Israel would put enemies to flight, “one chase a thousand” ([[Deut. 32:30]]; see [[Josh. 23:10]]). Faithless Judah will be the opposite: “one thousand shall flee at the rebuke of one.”
  - ref: 18
    phrase: therefore will the LORD wait, that he may be gracious unto you
    kind: christ
    title: The Lord waits to be gracious
    body: |
      This verse is astonishing in context. The people refused to wait on the Lord. They insisted on horses and Egypt. And yet “therefore will the LORD **wait**, that he may be gracious unto you.” He waits for them. He is like the father in the parable of the prodigal son, watching the road “when he was yet a great way off” ([[Luke 15:20]]).

      The verse ends with a beatitude: “blessed are all they that wait for him.” The same Hebrew verb (*chakah*) describes both the Lord waiting for us and our waiting for Him. There is a mutual waiting. He waits to be gracious; we wait to receive His grace. The Lord told the Saints, “mine arm is lengthened out all the day long” ([[2 Ne. 28:32]]).
  - ref: 19
    phrase: he will be very gracious unto thee at the voice of thy cry; when he shall hear it, he will answer thee
    kind: scripture
    title: He answers when He hears
    body: |
      “When he shall hear it, he will answer thee.” There is no delay between the cry and the answer in this verse. Isaiah later says it even more strongly: “before they call, I will answer; and while they are yet speaking, I will hear” ([[Isa. 65:24]]).

      That doesn’t mean every prayer is answered the way we want or as fast as we want. But it does mean every sincere cry is heard, and the Lord is already moving toward us.
  - ref: 20
    phrase: yet shall not thy teachers be removed into a corner any more, but thine eyes shall see thy teachers
    kind: words
    title: Teachers you can see
    body: |
      Even in hard times, with “the bread of adversity, and the water of affliction,” the Lord promises that their teachers will no longer be hidden away “into a corner.” The people had told their prophets to stop seeing (verse 10). Now the teachers will be in plain view.

      The Hebrew word for “thy teachers” (*moreka*) can also be read as singular, “thy Teacher,” and some interpreters see here the Lord Himself as the Teacher His people will see. Latter-day Saints may think of both. The Lord has restored prophets and apostles whom we can see and hear ([[Eph. 4:11–14]]; [[D&C 1:38]]), and He Himself is the Master Teacher, “a teacher come from God” ([[John 3:2]]).
  - ref: 21
    phrase: This is the way, walk ye in it
    kind: scripture
    title: A voice behind you
    body: |
      This is one of the most beautiful promises of personal revelation in the Old Testament. When you’re at a fork in the road, about to turn right or left, “thine ears shall hear a word behind thee, saying, This is the way, walk ye in it.”

      Notice that the voice comes from *behind*, like a shepherd walking behind the flock and calling direction, or a parent guiding a child who walks ahead. Latter-day Saints recognize that voice as the Holy Ghost. Nephi promised that “the Holy Ghost… will show unto you all things what ye should do” ([[2 Ne. 32:5]]; see [[2 Ne. 31:21]]). The Lord told Oliver Cowdery, “I will tell you in your mind and in your heart, by the Holy Ghost” ([[D&C 8:2]]). President Russell M. Nelson has taught that in coming days it will not be possible to survive spiritually without the constant influence of the Holy Ghost.
    sources: [nelson-revelation]
  - ref: 26
    phrase: in the day that the LORD bindeth up the breach of his people, and healeth the stroke of their wound
    kind: christ
    title: The Lord binds up and heals
    body: |
      The chapter’s promises of rain, harvest, and dazzling light culminate here: the Lord “bindeth up the breach of his people, and healeth the stroke of their wound.” The breaking and wounding came as consequences of their choices, but the binding and healing come from Him.

      This theme runs through Isaiah. No one would bind up the nation’s wounds in [[Isa. 1:6]] or [[Isa. 3:7]]. Now the Lord Himself does it. He is the one anointed “to bind up the brokenhearted” ([[Isa. 61:1]]), and “with his stripes we are healed” ([[Isa. 53:5]]).
  - ref: 29
    phrase: Ye shall have a song, as in the night when a holy solemnity is kept
    kind: history
    title: A song in the night
    body: |
      “A holy solemnity” kept at night most likely refers to **Passover**, the festival celebrated at night to commemorate Israel’s deliverance from Egypt ([[Ex. 12:42]]). The irony is rich. Judah was running to Egypt for help, but its real deliverance would be a new Passover, with the Lord Himself destroying the enemy while His people sang.

      That happened in 701 BC. The Assyrian army surrounding Jerusalem was struck down in one night ([[Isa. 37:36]]).
  - ref: 33
    phrase: For Tophet is ordained of old
    kind: history
    title: Tophet
    body: |
      **Tophet** was a place in the Valley of Hinnom just south of Jerusalem where apostate Israelites had burned children as sacrifices to Molech ([[2 Kgs. 23:10]]; [[Jer. 7:31–32]]). It was the most horrifying place imaginable. Here Isaiah pictures it as a huge funeral pyre prepared for the king of Assyria, lit by the breath of the Lord.

      The Valley of Hinnom (*Ge-Hinnom*) later gave its name to **Gehenna**, the New Testament word often translated “hell” ([[Matt. 5:22]]; [[Mark 9:43–47]]). The fire Isaiah describes for Assyria became an image of final judgment.

christ: |
  Isaiah 30 shows Jesus Christ as the **Lord who waits to be gracious** (verse 18), watching for His wandering people like the father of the prodigal son. He is the one who answers **“at the voice of thy cry”** (verse 19), the **Teacher** whom His people will see (verse 20), and the source of the quiet **voice behind** us, “This is the way, walk ye in it” (verse 21). He **binds up the breach** and **heals the stroke** of our wounds (verse 26).

  The chapter’s great invitation, “in returning and rest shall ye be saved; in quietness and in confidence shall be your strength,” is fulfilled in the rest He offers: “Come unto me… and I will give you rest” ([[Matt. 11:28]]).

liken: |
  - Where am I “going down to Egypt,” rushing toward a solution without first asking the Lord (verse 2)?
  - Do I prefer “smooth things” from leaders, teachers, or media? How do I respond when I hear something true that I don’t want to hear?
  - What would “returning and rest… quietness and confidence” (verse 15) look like in the situation that worries me most right now?
  - When have I heard the “voice behind” me saying, “This is the way”? How can I listen for it more carefully?

explore: |
  - **Trusting Egypt.** Read Isaiah 30 with [[Isa. 31:1–3]] and [[Isa. 36:4–9]]. How did Assyria itself mock Judah’s trust in Egypt?
  - **Waiting on the Lord.** Compare [[Isa. 30:18]], [[Isa. 40:31]], [[Isa. 64:4]], and [[Ps. 27:14]].
  - **Personal revelation.** Read Isaiah 30:21 with [[1 Kgs. 19:11–12]], [[Hel. 5:30]], [[D&C 8:2–3]], and [[D&C 85:6]].

sources: [bd-egypt, bd-rahab, ot-manual-15, parry-understanding, oswalt, herodotus-rawlinson, sc-knowhy-646]
