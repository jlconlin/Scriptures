    note: Babylon the great says “I sit a queen, and am no widow,” and falls in one day.
  - ref: Zeph. 2:15
    note: Nineveh says “I am, and there is none beside me.”
  - ref: D&C 1:16
    note: Babylon the great, the world that walks after its own gods, shall fall.

