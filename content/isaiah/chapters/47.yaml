chapter: 47
title: The Fall of the Lady of Kingdoms
tagline: Proud Babylon, who said “I am, and none else beside me,” is ordered off her throne into the dust, and her astrologers cannot save her.
when: 'Looks ahead to Babylon’s fall in 539 BC'

setting: |
  Chapter 46 showed Babylon’s gods carried off like baggage. Chapter 47 turns to the city herself. It is a mocking lament over a fallen enemy, like the proverb Isaiah was told to “take up” against the king of Babylon ([[Isa. 14:4–21]]). The city is personified as a pampered queen who is suddenly stripped of her throne and put to work as a slave.

  In the sixth century BC Babylon was the capital of the ancient Near East. Nebuchadnezzar is credited with rebuilding it as its most splendid city: the blue walls and the Ishtar Gate, the great ziggurat *Etemenanki* (“house of the foundation of heaven on earth,” also known as the tower of Babel), and the temple of Marduk, *Esagila*. The city was also the birthplace of astrology and the home of magic.

  The poem predicts a sudden and total fall. What happened in history was more complicated, and worth knowing. Cyrus’s army entered Babylon in 539 BC “without battle,” and the city remained an important center under the Persians, Alexander the Great, and the Seleucid kings. Its decline came gradually; when the emperor Trajan arrived in AD 116–117 he was disappointed by the ruins. The empire fell in a matter of days. The city faded over centuries. And Babylon as a symbol, in Revelation and in latter-day revelation, outlasted both.

thread: |
  Isaiah 47 is about **pride that imitates God**, and how it falls.

  The poem opens with a reversal. The “virgin daughter of Babylon,” once “tender and delicate,” is ordered off her throne to sit in the dust. She has to grind grain at the millstone, the lowest work of a slave woman, strip off her veil, and wade across rivers into exile (verses 1–3). Babylon had done this to others. Now it is done to her.

  Why? The Lord admits that He handed Israel over to Babylon as punishment (verse 6). But Babylon went too far: “thou didst shew them no mercy; upon the ancient hast thou very heavily laid thy yoke.” And Babylon’s arrogance grew beyond cruelty into blasphemy. Twice she says, “I am, and none else beside me” (verses 8, 10), the very words the Lord has been using of Himself throughout these chapters ([[Isa. 45:5–6]], [[Isa. 45:18]], [[Isa. 45:21–22]]). Babylon has claimed to be God.

  The punishment fits the claim. The one who said “I shall not sit as a widow” loses husband and children “in one day” (verses 8–9). The one who trusted in “wisdom and… knowledge” (verse 10) finds that her astrologers and stargazers, who charted the heavens every month, can’t even warm themselves by their own fire (verses 13–14). Everyone she relied on wanders off, and “none shall save thee” (verse 15).

  Babylon never became a real “lady for ever.” That title belongs to no human power. The chapter warns every age that the proud city always says the same thing, and always falls the same way.

sections:
  - range: 1-4
    heading: Off the throne and into the dust
    plain: |
      Come down and sit in the dust, virgin daughter of Babylon. Sit on the ground without a throne, daughter of the Chaldeans. You will no longer be called soft and delicate. Take millstones and grind flour. Remove your veil, lift up your skirt, bare your legs, and wade through the rivers. Your nakedness will be exposed, and your shame will be seen. I will take vengeance, and I will spare no one. Our Redeemer, whose name is the Lord of hosts, is the Holy One of Israel.
  - range: 5-7
    heading: No mercy for the elderly
    plain: |
      Sit in silence and go into darkness, daughter of the Chaldeans. You will no longer be called the queen of kingdoms. I was angry with My people. I profaned My inheritance and handed them over to you. You showed them no mercy. Even on the elderly you laid a very heavy yoke. You said, “I will be the queen forever.” You didn’t take these things to heart or think about how it would all end.
  - range: 8-11
    heading: '“I am, and none else beside me”'
    plain: |
      So now listen, you lover of luxury, who sit securely and say to yourself, “I am, and there is no one else. I will never be a widow or lose my children.” Both of these things will come on you suddenly, in a single day: the loss of children and widowhood. They will come on you in full measure, in spite of your many sorceries and all your powerful spells. You felt secure in your wickedness. You said, “No one sees me.” Your wisdom and knowledge led you astray, and you said to yourself, “I am, and there is no one else.” But disaster will come on you, and you won’t know how to charm it away. Calamity will fall on you, and you won’t be able to buy it off. Ruin you don’t expect will come on you suddenly.
  - range: 12-15
    heading: Let the astrologers save you
    plain: |
      So keep at your spells and your many sorceries, which you have practiced since your youth. Perhaps you will succeed; perhaps you will strike terror. You are worn out by all your advisers. Let your astrologers come forward and save you, those who study the heavens and gaze at the stars and make predictions month by month about what will happen to you. Look, they are like straw; fire will burn them up. They can’t even save themselves from the flames. This is no fire of coals to keep warm by, no hearth to sit beside. That is all they will be to you, those you have worked with and traded with since your youth. Each of them will wander off his own way. There will be no one to save you.

notes:
  - ref: 1
    phrase: 'Come down, and sit in the dust, O virgin daughter of Babylon, sit on the ground: there is no throne'
    kind: symbol
    title: The virgin daughter of Babylon
    body: |
      Hebrew poetry often personifies cities as women: “the daughter of Zion” ([[Isa. 1:8]]), “the virgin, the daughter of Zion” ([[Isa. 37:22]]). “Virgin daughter” (*bĕtûlat bat*) is one of these personifications. “Virgin” marks her as a city not yet dishonored, the unconquered oppressor, now threatened with shameful humiliation.

      Now she is ordered down from her throne to sit in the dust, the posture of mourning ([[Job 2:8]]; [[Lam. 2:10]]). The reversal is precise. In [[Isa. 52:2]] the Lord will tell captive Zion to do the opposite: “Shake thyself from the dust; arise, and sit down, O Jerusalem.” The two cities trade places. The proud city comes down; the humbled city is raised up.
    sources: [bdb, delitzsch]
  - ref: 2
    phrase: 'Take the millstones, and grind meal: uncover thy locks, make bare the leg, uncover the thigh, pass over the rivers'
    kind: history
    title: At the millstone
    body: |
      Grinding grain at the mill was low, menial service, the work of servants and captives. The plague on the firstborn in Egypt reached from Pharaoh’s son “unto the firstborn of the maidservant that is behind the mill” ([[Ex. 11:5]]). The Philistines humiliated the captured Samson by making him grind in the prison house ([[Judg. 16:21]]).

      The rest of the verse describes a woman being marched into exile: the veil removed, skirts lifted to wade across rivers. The queen leaves her palace as a prisoner of war, laying aside all modesty to wade through the rivers beside which she had lived. Verse 3 carries the humiliation further, and Isaiah uses the language of exposure frankly; the point is total disgrace.

      The words “I will not meet thee as a man” at the end of verse 3 are obscure. The Hebrew verb *pāgaʿ* means “to meet,” and it can be a friendly meeting as well as a hostile one. Several commentators therefore read the clause as “I will receive no one” or “I will pardon no one,” which gives the sense “I will spare no one.”
    sources: [bdb, delitzsch]
  - ref: 6
    phrase: thou didst shew them no mercy; upon the ancient hast thou very heavily laid thy yoke
    kind: words
    title: The instrument that went too far
    body: |
      The Lord is candid: He was angry with Israel and gave them into Babylon’s hand. Babylon was His instrument of judgment, as Assyria had been earlier ([[Isa. 10:5–7]]). But being an instrument didn’t license cruelty. Babylon “didst shew them no mercy,” and even laid a crushing yoke on the elderly.

      The book of Lamentations remembers exactly that: “Princes are hanged up by their hand: the faces of elders were not honoured” ([[Lam. 5:12]]). Zechariah states the principle: “I was but a little displeased, and they helped forward the affliction” ([[Zech. 1:15]]). God may permit judgment, but the chapter holds those who carry it out accountable for how they do it.

      The Book of Mormon has a comparable picture: the Lord tells Nephi that the Lamanites will be a scourge to his people “to stir them up in remembrance of me” ([[2 Ne. 5:25]]).
    sources: [delitzsch, lds-scriptures]
  - ref: 7
    phrase: And thou saidst, I shall be a lady for ever
    kind: words
    title: '“A lady for ever”'
    body: |
      “Lady” is *gĕberet*, “lady, queen,” or “mistress of servants,” the feminine counterpart of a word for “master.” It is also the word used of a household mistress ([[Gen. 16:4]], where Sarai is Hagar’s “mistress”). In verse 5 Babylon is “the lady of kingdoms.”

      Babylon’s mistake was not just pride. It was a failure of imagination: “thou didst not lay these things to thy heart, neither didst remember the latter end of it.” She never considered that her position might end. Empires, companies, reputations, and people all make this mistake. What has always been seems as if it always will be. The psalm headed “A Prayer of Moses” asks for the opposite wisdom: “So teach us to number our days, that we may apply our hearts unto wisdom” ([[Ps. 90:12]]).
    sources: [bdb, delitzsch, lds-scriptures]
  - ref: 8
    phrase: I am, and none else beside me; I shall not sit as a widow, neither shall I know the loss of children
    kind: words
    title: Babylon claims the divine name
    body: |
      “I am, and none else beside me” (*ʾănî wĕʾapsî ʿôd*) is almost exactly what the Lord says of Himself in the preceding chapters: “I am the LORD, and there is none else” ([[Isa. 45:5]], [[Isa. 45:6]], [[Isa. 45:18]]; compare [[Isa. 46:9]]). Babylon repeats it twice (verses 8, 10). The wording sounds like self-deification. Zephaniah records Nineveh saying the same words before its fall: “I am, and there is none beside me” ([[Zeph. 2:15]]).

      The book of Revelation echoes the passage in its vision of the fall of “Babylon the great.” She says in her heart, “I sit a queen, and am no widow, and shall see no sorrow,” and therefore “shall her plagues come in one day” ([[Rev. 18:7–8]]). Isaiah’s Babylon has become the type of every proud, worldly power that sets itself up in God’s place.

      Latter-day revelation uses the same symbol. The Lord describes a world in which “every man walketh in his own way, and after the image of his own god, whose image is in the likeness of the world,” and He calls it “Babylon the great, which shall fall” ([[D&C 1:16]]). He commands His people, “Go ye out from Babylon” ([[D&C 133:5]], [[D&C 133:14]]). In these passages Babylon reads less as a place on a map than as a way of living.
    sources: [delitzsch, lds-scriptures]
  - ref: 10
    phrase: Thy wisdom and thy knowledge, it hath perverted thee
    kind: history
    title: Knowledge that misleads
    body: |
      Babylon was the cultural capital of the ancient Near East, and its scholars kept astronomical records for centuries (see the note on verse 13). The “wisdom and knowledge” in view include her policy and strategy and, above all, her magical arts. Isaiah doesn’t sneer at learning as such. His point is that Babylon’s wisdom “perverted” her, led her astray, because it fed her conviction that “none seeth me.”

      Jacob, Nephi’s brother, made the same point about his own people: “When they are learned they think they are wise, and they hearken not unto the counsel of God… But to be learned is good if they hearken unto the counsels of God” ([[2 Ne. 9:28–29]]). The problem is never knowledge. It is knowledge that forgets it is accountable.
    sources: [delitzsch, livius-babylon, livius-astronomical-diaries]
  - ref: 13
    phrase: Let now the astrologers, the stargazers, the monthly prognosticators, stand up, and save thee
    kind: history
    title: The stargazers of Babylon
    body: |
      The three terms describe real Babylonian specialists. “Astrologers” (*hōbĕrê šāmayim*) is literally something like “dissectors of the heavens,” those who carve the sky into sections. “Stargazers” (*haḥōzîm bakkôkābîm*) are those who look at the stars with interest. The “monthly prognosticators” (*môdîʿim leḥŏdāšîm*, “those who make known with every new moon”) picked out the most important events and prepared a calendar for the state each month.

      Babylonian scholars really did this. The great omen series *Enūma Anu Enlil*, seventy tablets of celestial omens, explained what the movements of sky and moon foretold for the king. The **Astronomical Diaries**, observations recorded in Babylon from 652/651 to 61/60 BC, are among the longest research programs in history. Their method of observing, recording, and looking for regularities came down to us through the Greeks.

      Isaiah’s challenge is not to their accuracy but to their power: “stand up, and save thee.” The Lord, who calls every star by name ([[Isa. 40:26]]), is the one who rules the heavens they watched.
    sources: [delitzsch, livius-astronomical-diaries]
  - ref: 14
    phrase: there shall not be a coal to warm at, nor fire to sit before it
    kind: words
    title: No fire to warm by
    body: |
      This line recalls the idol-maker of chapter 44 who warmed himself by the fire made from half his god and said, “Aha, I am warm” ([[Isa. 44:16]]). Here the fire is not a cozy hearth. It is a devouring fire of judgment, no comforting coal-fire to warm oneself by, and it burns Babylon’s advisers like stubble ([[Mal. 4:1]] uses the same image).

      There is a grim humor in it. The astrologers are consumed by a fire that doesn’t even give off useful heat. Everything Babylon trusted turns out to be not only useless but dangerous.
    sources: [delitzsch]
  - ref: 15
    phrase: they shall wander every one to his quarter; none shall save thee
    kind: history
    title: Everyone goes home
    body: |
      The chapter ends with Babylon’s business partners, the merchants who had traded with her “from thy youth,” simply scattering, each to his own place. No one fights for her. No one mourns. When the market closes, the traders leave.

      Revelation expands this into a whole lament of the merchants who stand far off, weeping over Babylon because “no man buyeth their merchandise any more” ([[Rev. 18:11]]). The relationships Babylon built were transactional, and transactional relationships end when the transaction does.

      The contrast with Israel could hardly be stronger. The Lord promises to carry His people to old age ([[Isa. 46:4]]) and never to forget them ([[Isa. 49:15]]). The final words of chapter 47 are “none shall save thee.” The Lord has already said of Himself, “beside me there is no saviour” ([[Isa. 43:11]]).
    sources: [delitzsch]

christ: |
  In the middle of the mocking lament comes a single line of worship: “As for our redeemer, the LORD of hosts is his name, the Holy One of Israel” (verse 4). Babylon says “I am, and none else beside me.” Israel’s Redeemer is the only one who can truly say that, and He uses His power not to crush but to redeem. The proud city is brought down to the dust; the Redeemer raises the humble from it ([[Isa. 52:2]]).

  Jesus Christ is that Redeemer. He is the opposite of Babylon in every way. She exalted herself and was humbled; He “humbled himself, and became obedient unto death… Wherefore God also hath highly exalted him” ([[Philip. 2:8–9]]). She showed no mercy to the aged; He is “the Lord Omnipotent” who came down “among the children of men… healing the sick” ([[Mosiah 3:5]]).

explore: |
  - **Babylon as a symbol.** Read [[Isa. 13–14]], [[Isa. 47]], [[Jer. 50–51]], [[Rev. 17–18]], [[D&C 1:16]], and [[D&C 133:5–14]].
  - **Proud cities.** Compare Babylon’s boast with Nineveh’s in [[Zeph. 2:13–15]] and Tyre’s in [[Ezek. 28:1–10]].
  - **Learning and humility.** Read [[2 Ne. 9:28–29]], [[2 Ne. 28:4–15]], and [[D&C 88:118]].
  - **The two daughters.** Read [[Isa. 47:1–3]] and [[Isa. 52:1–2]] side by side.

