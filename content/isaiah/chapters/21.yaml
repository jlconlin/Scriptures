chapter: 21
title: 'Watchman, What of the Night?'
tagline: A watchman sees Babylon fall, a voice from Edom calls out in the dark, and desert caravans hide from the sword.
when: 'Isaiah’s ministry (740–701 BC), looking ahead to the fall of Babylon to the Medes and Persians'

setting: |
  Chapter 21 contains three short, cryptic oracles, each with a riddle-like title:

  - **“The desert of the sea”** (verses 1–10) turns out to be Babylon (verse 9).
  - **“Dumah”** (verses 11–12) means “silence.” It is probably a wordplay on *Edom*; the speaker calls from **Seir**, Edom’s mountain country.
  - **“Arabia”** (verses 13–17) concerns desert tribes: Dedan, Tema, and Kedar.

  The first oracle is intensely personal. Isaiah describes how the vision affected him physically. And the whole chapter is full of **watching**: watchmen, watchtowers, questions shouted into the night.

thread: |
  The unifying image of Isaiah 21 is the **watchman**: someone who stands on the wall through the long night, peering into the dark, waiting to see what is coming.

  In the first oracle, the Lord tells Isaiah to post a watchman (verse 6). The watchman stands “continually… in the daytime” and “whole nights” (verse 8). At last he sees riders approaching and cries out the news: “**Babylon is fallen, is fallen**” (verse 9). What looked invincible is gone, and its idols lie shattered on the ground.

  In the second oracle, someone calls to the watchman from Edom, out of the darkness: “Watchman, what of the night? Watchman, what of the night?” (verse 11). How much longer until morning? The answer is honest and haunting: “The morning cometh, and also the night.” Deliverance is coming, and so is more darkness. Then, an invitation: “if ye will enquire, enquire ye: return, come” (verse 12).

  In the third oracle, desert caravans hide from the sword, and kind neighbors bring water and bread to refugees (verses 13–15).

  Taken together, the chapter describes what it is like to live in a world of shifting empires and long nights. The prophet’s role is to watch, to tell the truth about what he sees, and to keep inviting people to *return, come*. Latter-day Saints know that role well. The Lord has set “watchmen upon the walls” in our day too ([[Isa. 62:6]]; [[D&C 101:44–54]]).

sections:
  - range: 1-10
    heading: Babylon is fallen
    plain: |
      This is the oracle about the Desert by the Sea. Like whirlwinds sweeping through the south, an invader comes from the desert, from a terrifying land. I have been shown a harsh vision: the traitor betrays, the destroyer destroys. Attack, Elam! Besiege, Media! I will end all the groaning Babylon caused. The vision fills me with anguish, like a woman in labor. I am staggered by what I hear and terrified by what I see. My heart pounds; I shake with fear. The twilight I longed for has become a nightmare. They set the table, spread the rugs, and eat and drink. Get up, officers, and oil your shields! The Lord told me: “Go, post a watchman and have him report what he sees.” When he sees chariots with teams of horses, riders on donkeys and camels, let him watch carefully. Then the watchman cried like a lion: “My lord, I stand on the watchtower all day, and I stay at my post all night. Look! Here come riders, horsemen in pairs.” Then he called out: “Fallen, fallen is Babylon! All the images of her gods lie shattered on the ground!” My people, threshed and crushed on the threshing floor, I have told you what I heard from the Lord of hosts, the God of Israel.
  - range: 11-12
    heading: Watchman, what of the night?
    plain: |
      This is the oracle about Dumah. Someone calls to me from Seir: “Watchman, how much of the night is left? Watchman, how much longer?” The watchman answers: “Morning is coming, but night is coming too. If you want to ask, then ask. Come back again.”
  - range: 13-17
    heading: Refugees in the desert
    plain: |
      This is the oracle about Arabia. You caravans of Dedanites, you will camp among the desert thickets. People of Tema, bring water to the thirsty; meet the fugitives with bread. They are running from the sword, from the drawn sword, the bent bow, and the heat of battle. The Lord told me: “Within one year, counted exactly as a hired worker counts, all the splendor of Kedar will end. The few archers left, the warriors of Kedar, will be very few. The Lord, the God of Israel, has spoken.”

notes:
  - ref: 1
    phrase: The burden of the desert of the sea
    kind: history
    title: The desert by the sea
    body: |
      The title is a riddle, and verse 9 solves it: this is **Babylon**. Babylon sat on a dry plain beside the Euphrates, which before flood-control dams were built overflowed each spring, so the city stood both in a desert and on a sea. Jeremiah calls Babylon “O thou that dwellest upon many waters” ([[Jer. 51:13]]).

      Babylon first appears in Isaiah’s own story as a friendly visitor: its king Merodach-baladan sent letters and a present to Hezekiah ([[Isa. 39:1–2]]). This oracle says that this empire too will fall.
    sources: [delitzsch, ot-manual-14, lds-scriptures]
  - ref: 2
    phrase: 'Go up, O Elam: besiege, O Media'
    kind: history
    title: Elam and Media
    body: |
      **Elam** was a mountainous country east of Babylonia, and **Media** lay between the Caspian Sea and Elam. Isaiah hears the command for them to attack Babylon. Medes and Persians under Cyrus captured Babylon, as Isaiah had also foreseen in [[Isa. 13:17]].

      “All the sighing thereof have I made to cease” means the Lord will end the groaning that Babylon’s oppression had caused. The fall of Babylon is liberation.
    sources: [bd-elam, bd-media, ot-manual-14, delitzsch, lds-scriptures]
  - ref: 3
    phrase: Therefore are my loins filled with pain
    kind: history
    title: A prophet shaken by his own vision
    body: |
      Verses 3–4 are remarkably personal. Isaiah describes his body reacting to the vision: cramping pain, the pangs of labor, a feverish pounding heart, terror. The darkness of evening, which he loved, has become a time of dread.

      Revelation is not always comfortable. Daniel “fainted, and was sick certain days” after one vision ([[Dan. 8:27]]). After seeing the fall of his people in vision, Nephi said that his afflictions were “great above all” ([[1 Ne. 15:4–5]]). Prophets feel the weight of what they are shown.
    sources: [ot-manual-14, delitzsch, lds-scriptures]
  - ref: 5
    phrase: Prepare the table, watch in the watchtower, eat, drink
    kind: history
    title: Feasting as the enemy arrives
    body: |
      Verse 5 is a jarring snapshot: people are setting the table and eating and drinking, and suddenly the cry goes up, “arise, ye princes, and anoint the shield!” Shield leather was oiled so that blows would glance off, and the call shows the officers had to be roused to prepare for battle.

      Daniel records a feast of this kind on the night Babylon fell. King Belshazzar held a great feast for a thousand of his lords, and “In that night was Belshazzar the king of the Chaldeans slain” ([[Dan. 5:1–30]]). Taking Isaiah’s banquet to be that night is a probable reading, not a certainty.
    sources: [delitzsch, lds-scriptures]
  - ref: 6
    phrase: Go, set a watchman, let him declare what he seeth
    kind: scripture
    title: The watchman
    body: |
      Isaiah’s watchman is tireless: “I stand continually upon the watchtower in the daytime, and I am set in my ward whole nights” (verse 8).

      The Lord told Ezekiel, “I have made thee a watchman unto the house of Israel” ([[Ezek. 3:17]]), and said that if a watchman sees danger and does not warn, the blood of those lost would be required at his hand ([[Ezek. 33:1–9]]). In the latter days the Lord gave a parable about a nobleman’s vineyard whose servants began to build a tower but questioned its need, and the enemy came by night and broke down the hedge ([[D&C 101:43–62]]).
    sources: [lds-scriptures]
  - ref: 9
    phrase: Babylon is fallen, is fallen
    kind: scripture
    title: '“Babylon is fallen, is fallen”'
    body: |
      This cry echoes across scripture. John heard an angel proclaim, “Babylon is fallen, is fallen, that great city” ([[Rev. 14:8]]; [[Rev. 18:2]]). In modern revelation, the Lord says that an angel will one day sound his trump, saying of the great church of the devil, “she is fallen who made all nations drink of the wine of the wrath of her fornication; she is fallen, is fallen!” ([[D&C 88:105]]).

      Isaiah adds a significant detail: “all the graven images of her gods he hath broken unto the ground.” Babylon’s fall exposes its gods as powerless. The theme returns in [[Isa. 46:1–2]], where Babylon’s idols Bel and Nebo are carted off like baggage.
    sources: [lds-scriptures, delitzsch]
  - ref: 10
    phrase: O my threshing, and the corn of my floor
    kind: symbol
    title: Israel on the threshing floor
    body: |
      Isaiah addresses his own people as “my threshing,” those who have been beaten and carried captive into Babylon, like grain on a threshing floor.

      The message of Babylon’s fall is for *them*. The threshing is not the end. Later Isaiah promises that Israel itself will become a threshing instrument that makes mountains into chaff ([[Isa. 41:15–16]]).
    sources: [ot-manual-14, lds-scriptures]
  - ref: 11
    phrase: Watchman, what of the night? Watchman, what of the night?
    kind: words
    title: '“Watchman, what of the night?”'
    body: |
      A voice from Seir, Edom’s mountain country, calls to the watchman in the dark: *How much of the night is left?* The question is repeated in a slightly different form, which expresses heightened, anxious urgency.

      The watchman’s reply is honest: “The morning cometh, and also the night.” On one reading, morning will dawn but night will swallow it again; he doesn’t offer false comfort. Then he adds an invitation: “if ye will enquire, enquire ye: return, come.” The word “return” (*shuv*) means to turn back, and it is the way of repentance: the answer comes to those who turn.
    sources: [delitzsch]
  - ref: 14
    phrase: The inhabitants of the land of Tema brought water to him that was thirsty
    kind: history
    title: Kindness in the desert
    body: |
      The third oracle concerns Arabian tribes. The trading caravans of **Dedan** are driven off the caravan road by spreading war and have to camp in the wilderness. The people of **Tema** are urged to meet the refugees with water and bread. (“Prevented” in 1611 English means *came to meet*.)

      In the middle of an oracle of judgment is a small, bright picture of hospitality: meeting the thirsty and hungry with what they need. It anticipates Jesus’s words, “I was thirsty, and ye gave me drink” ([[Matt. 25:35]]), and King Benjamin’s teaching to “succor those that stand in need” ([[Mosiah 4:16–19]]).
    sources: [delitzsch, lds-scriptures]

christ: |
  The watchman on the tower, faithful day and night, reporting exactly what he sees, is the Lord's own image for a prophet: “I have set thee a watchman unto the house of Israel” ([[Ezek. 33:7]]).

explore: |
  - **The fall of Babylon.** Read Isaiah 21:1–10 with [[Dan. 5]] and [[Rev. 18]]. What details connect them?
  - **Watchmen.** Trace the watchman through [[Isa. 21:6–12]], [[Isa. 52:8]], [[Isa. 56:10]], [[Isa. 62:6]], [[Ezek. 33:1–9]], and [[D&C 101:43–62]].

sources: [bd-isaiah, bd-elam, bd-media, ot-manual-14, delitzsch, lds-scriptures]
