chapter: 17
title: A Few Olives Left at the Top
tagline: Damascus and Ephraim, allies against Judah, fall together, but a remnant turns to look at its Maker.
when: 'c. 735–732 BC; Damascus fell to Assyria in 732, Samaria in 722'

setting: |
  The oracle is titled “the burden of Damascus,” but it quickly becomes an oracle against **Ephraim** (the northern kingdom of Israel) too. That makes sense historically. These are the two allies of the Syro-Ephraimite war that terrified Ahaz in chapter 7. Isaiah had told Ahaz not to fear them because both would soon be broken ([[Isa. 7:4–9]]; [[Isa. 8:4]]). This chapter describes that breaking. Assyria took Damascus in 732 BC and deported its people ([[2 Kgs. 16:9]]), and Samaria fell ten years later.

  The chapter ends with a short, vivid poem (verses 12–14) about roaring nations who vanish overnight. It fits Assyria’s sudden defeat at Jerusalem in 701 BC.

thread: |
  Isaiah 17 is about **harvest**, and about what’s left after one.

  Damascus becomes a heap of ruins and Ephraim’s glory wastes away (verses 1–4). Then Isaiah reaches for farm images. The judgment will be like a reaper sweeping up an armful of grain in the fertile Valley of Rephaim near Jerusalem (verse 5). But reapers always miss a little. After olive harvesters beat the branches, “two or three berries” cling to the top bough and “four or five” to the outer branches (verse 6). That’s the **remnant**: a handful of olives left after the harvest.

  And what does that remnant do? “At that day shall a man look to his Maker” (verse 7). For the first time, he stops looking at the altars and idols he made himself (verse 8). Judgment has stripped away everything else, and he finally looks at the one who made *him*.

  Verses 10–11 name the root problem: “thou hast forgotten the God of thy salvation.” Ephraim planted pretty gardens for foreign gods, gardens that sprouted overnight and came to nothing. That is the lesson of the whole chapter. **What we plant apart from God may sprout quickly, but the harvest is grief.** What God preserves, even if it’s only a few olives at the top of the tree, lasts.

sections:
  - range: 1-6
    heading: Damascus and Ephraim fall together
    plain: |
      This is the oracle about Damascus. Damascus will stop being a city and become a heap of ruins. The towns of Aroer will be deserted and left to flocks, with no one to scare them. Ephraim’s fortresses will disappear, and so will Damascus’s kingdom. What remains of Syria will be like Israel’s faded glory. In that day Jacob’s glory will fade and his healthy body will waste away. It will be like a reaper gathering grain in the Valley of Rephaim. Yet a few will be left, like olives left on a tree after it is beaten: two or three at the very top, four or five on the fruitful branches.
  - range: 7-11
    heading: Looking to the Maker
    plain: |
      In that day people will look to their Maker and turn their eyes to the Holy One of Israel. They won’t look to the altars they built or respect the sacred poles and incense altars they made. Their strong cities will be abandoned like the places the earlier inhabitants abandoned before Israel, and there will be desolation. Because you have forgotten the God who saves you and haven’t remembered the Rock who is your fortress, you plant pleasant gardens and set out imported vines. The day you plant them, you make them grow, and the next morning they bud. But the harvest vanishes in a day of sickness and incurable pain.
  - range: 12-14
    heading: Roaring nations, gone by morning
    plain: |
      Listen to the roar of many nations, raging like the roaring sea! Hear the nations rush like mighty waters! But when God rebukes them, they flee far away, driven like chaff on the hills in the wind, like tumbleweed before a storm. In the evening, terror; by morning, they are gone. This is what happens to those who plunder us and rob us.

notes:
  - ref: 1
    phrase: Damascus is taken away from being a city, and it shall be a ruinous heap
    kind: history
    title: The fall of Damascus
    body: |
      **Damascus**, capital of Aram (Syria), was one of the oldest cities in the world and a major power in Isaiah’s day. In 732 BC, answering Ahaz’s plea, Tiglath-pileser III captured it, deported its people to Kir, and executed King Rezin ([[2 Kgs. 16:9]]). Damascus did not remain a heap forever, and it has been rebuilt many times, but as the capital of an independent kingdom it was finished.

      For readers of Isaiah, this is a fulfilled prophecy they can check. Isaiah had told Ahaz not to fear Rezin ([[Isa. 7:4–9]]), and within a few years Rezin was dead.
    sources: [bd-damascus, bd-syria]
  - ref: 3
    phrase: The fortress also shall cease from Ephraim
    kind: history
    title: Why Ephraim is in an oracle against Damascus
    body: |
      Ephraim (the northern kingdom of Israel) had allied itself with pagan Damascus against its own brother Judah ([[Isa. 7:1–2]]). Isaiah’s point is that the two allies will share the same fate. Ephraim chose to stand with Damascus, and it will fall with Damascus.

      The phrase “as the glory of the children of Israel” is ironic. The remnant of Syria will be as glorious as Israel, which is to say, not glorious at all (verse 4). Who we align ourselves with matters.
  - ref: 5
    phrase: as he that gathereth ears in the valley of Rephaim
    kind: history
    title: The Valley of Rephaim
    body: |
      The **Valley of Rephaim** was a fertile plain just southwest of Jerusalem, well known to Isaiah’s audience as good farmland. It was also where David had defeated the Philistines ([[2 Sam. 5:17–25]]). Isaiah’s hearers could picture reapers there sweeping armfuls of grain.

      The image is of a thorough harvest. Ephraim will be gathered up and carried off, just as Assyria deported the ten tribes in 722 BC ([[2 Kgs. 17:6]]).
  - ref: 6
    phrase: two or three berries in the top of the uppermost bough
    kind: symbol
    title: Olives at the top of the tree
    body: |
      Olives were harvested by beating the branches with long sticks so the fruit fell onto cloths spread below. A few olives always remained, too high or too far out to reach. The law of Moses commanded Israelites not to go back and strip the tree bare. The leftovers were for the poor, the stranger, the fatherless, and the widow ([[Deut. 24:20]]).

      That is Isaiah’s picture of the **remnant**: a few olives left after the harvest. It is also an image of grace. God deliberately leaves something behind. Isaiah uses the same image for the last days in [[Isa. 24:13]]. And for Latter-day Saints, the olive tree immediately calls to mind Zenos’s allegory, in which the Lord of the vineyard preserves the natural branches and grafts them back in ([[Jacob 5:52–60]]).
  - ref: 7
    phrase: At that day shall a man look to his Maker
    kind: liken
    title: Looking to the Maker
    body: |
      This is the turning point of the chapter. After the harvest of judgment, the survivors finally look up, not to the altars “the work of his hands,” but to “his Maker,” the Holy One of Israel.

      Notice the contrast between **Maker** and **made**. Idolatry is trusting what we have made. Faith is trusting the One who made us. It often takes loss to make that distinction clear. Alma taught that people are sometimes “compelled to be humble,” and that it is far better to humble ourselves without being compelled ([[Alma 32:13–16]]).
  - ref: 8
    phrase: either the groves, or the images
    kind: words
    title: Groves and images
    body: |
      “Groves” (*asherim*) were wooden poles or sacred trees representing the Canaanite goddess Asherah. “Images” (*chammanim*) were probably incense altars. Both were features of the hilltop shrines Israel kept building despite the prophets’ warnings.

      The Bible Dictionary entry for *Grove* explains that the KJV translators misunderstood the word, which refers to a cult object rather than a stand of trees. Ephraim had filled its land with these, and they will not save it.
    sources: [bd-grove, bd-idol]
  - ref: 10
    phrase: Because thou hast forgotten the God of thy salvation
    kind: christ
    title: The God of thy salvation, the Rock of thy strength
    body: |
      Here is the diagnosis: not a lack of religion, but **forgetting**. Forgetting is one of the great dangers the Book of Mormon warns about. The Nephite cycle began, again and again, when the people forgot the Lord in their prosperity ([[Hel. 12:2]]; [[Alma 46:8]]).

      Two titles stand out: “**God of thy salvation**” (*Elohe yishʿekh*, the salvation root again, as in [[Isa. 12:2]]) and “**the rock of thy strength**.” Helaman taught his sons to build “upon the rock of our Redeemer, who is Christ, the Son of God” ([[Hel. 5:12]]). Remembering is why we take the sacrament: to “always remember him” ([[Moro. 4:3]]).
  - ref: 10
    phrase: therefore shalt thou plant pleasant plants, and shalt set it with strange slips
    kind: history
    title: Gardens that sprout overnight
    body: |
      “Pleasant plants” and “strange slips” (foreign cuttings) probably refer to the **little ritual gardens** planted in honor of fertility gods like Adonis or Tammuz. In the ancient Mediterranean world, worshippers planted seeds in shallow pots or beds and forced them to sprout quickly, in a few days, as a symbol of the god’s return to life. The plants shot up and then withered just as fast.

      Verse 11 matches that description exactly: planted in the day, sprouting by morning, and then a harvest of nothing but grief. Religion that promises quick results without covenant faithfulness produces the same crop.
  - ref: 12
    phrase: Woe to the multitude of many people, which make a noise like the noise of the seas
    kind: symbol
    title: Nations like the roaring sea
    body: |
      To ancient Israelites, the sea was a symbol of chaos, restless, threatening, and uncontrollable. Isaiah compares the massed armies of the nations to a roaring sea and rushing waters. It’s a terrifying sound.

      But the Lord has only to “rebuke” them, and they scatter like chaff blown off a hilltop threshing floor, or like tumbleweeds before a storm (verse 13). The Lord who once rebuked the waters of the Red Sea ([[Ps. 106:9]]) later stilled a storm on Galilee with a word: “Peace, be still” ([[Mark 4:39]]).
  - ref: 14
    phrase: at eveningtide trouble; and before the morning he is not
    kind: history
    title: Gone by morning
    body: |
      This line reads like a preview of the most dramatic deliverance in Isaiah. In 701 BC, Sennacherib’s army surrounded Jerusalem. That night, “the angel of the LORD went forth, and smote in the camp of the Assyrians a hundred and fourscore and five thousand: and when they arose early in the morning, behold, they were all dead corpses” ([[Isa. 37:36]]).

      The Psalms put the same truth tenderly: “weeping may endure for a night, but joy cometh in the morning” ([[Ps. 30:5]]). What terrifies us at evening may be gone by morning.

christ: |
  Two titles in this chapter point to Jesus Christ: “**the God of thy salvation**” and “**the rock of thy strength**” (verse 10). He is the Maker to whom the remnant finally looks (verse 7). The Book of Mormon calls Him “the rock of our Redeemer,” the sure foundation on which the storms cannot prevail ([[Hel. 5:12]]).

  The olives left at the top of the tree (verse 6) are a picture of His mercy: even in judgment, He deliberately leaves a remnant to gather. And the nations roaring like the sea (verse 12) fall silent at His rebuke, as the sea of Galilee did ([[Mark 4:39]]).

liken: |
  - What “pleasant plants” am I tempted to plant: things that promise quick results but don’t come from covenant faithfulness?
  - Sometimes it takes a “harvest,” a loss, to make me look to my Maker. What has loss taught me to see more clearly?
  - What helps me not to “forget the God of my salvation” in good times? How can the sacrament be more of a remembering for me?
  - What roaring “sea” am I facing right now? Can I trust that by morning it may be gone?

explore: |
  - **Gleanings.** Read [[Deut. 24:19–22]], [[Ruth 2]], and [[Isa. 24:13]]. How does the law of gleaning illuminate Isaiah’s picture of the remnant?
  - **Forgetting and remembering.** Trace the Nephite cycle in [[Hel. 12:1–6]]. How does Isaiah 17:10 describe the same pattern?
  - **Rock imagery.** Follow the “rock” through [[Isa. 26:4]], [[Isa. 28:16]], [[Isa. 44:8]], [[Hel. 5:12]], and [[3 Ne. 11:39–40]].

sources: [bd-damascus, ot-manual-14, parry-understanding, oswalt]
