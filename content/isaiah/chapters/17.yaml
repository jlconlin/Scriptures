chapter: 17
title: A Few Olives Left at the Top
tagline: Damascus and Ephraim, allies against Judah, fall together, but a remnant turns to look at its Maker.
when: 'Damascus fell to Assyria about 733 BC; Samaria in 721 BC'

setting: |
  The oracle is titled “the burden of Damascus,” but it quickly becomes an oracle against **Ephraim** (the northern kingdom of Israel) too. That makes sense historically. These are the two allies of the Syro-Ephraimite war that terrified Ahaz in chapter 7. Isaiah had told Ahaz not to fear them because both would soon be broken ([[Isa. 7:4–9]]; [[Isa. 8:4]]). This chapter describes that breaking. Assyria took Damascus about 733 BC and carried its people captive ([[2 Kgs. 16:9]]), and Samaria fell in 721 BC.

  The chapter ends with a short, vivid poem (verses 12–14) about roaring nations who vanish overnight. The older commentary tradition reads it as about the destruction of Assyria’s imperial army, whose sudden end Isaiah later records ([[Isa. 37:36]]).

thread: |
  Isaiah 17 is about **harvest**, and about what’s left after one.

  Damascus becomes a heap of ruins and Ephraim’s glory wastes away (verses 1–4). Then Isaiah reaches for farm images. The judgment will be like a reaper sweeping up an armful of grain in the Valley of Rephaim near Jerusalem (verse 5). But reapers always miss a little. After olive harvesters beat the branches, “two or three berries” cling to the top bough and “four or five” to the outer branches (verse 6). That’s the **remnant**: a handful of olives left after the harvest.

  And what does that remnant do? “At that day shall a man look to his Maker” (verse 7). For the first time, he stops looking at the altars and idols he made himself (verse 8). Judgment has stripped away everything else, and he finally looks at the one who made *him*.

  Verses 10–11 name the root problem: “thou hast forgotten the God of thy salvation.” Ephraim planted pleasant gardens set with foreign vines, gardens that sprouted overnight and ended in a harvest of grief. What Ephraim planted apart from God came to nothing; what God preserves, even if it’s only a few olives at the top of the tree, remains.

sections:
  - range: 1-6
    heading: Damascus and Ephraim fall together
    plain: |
      This is the oracle about Damascus. Damascus will stop being a city and become a heap of ruins. The towns of Aroer will be deserted and left to flocks, with no one to scare them. Ephraim’s fortresses will disappear, and so will Damascus’s kingdom. What remains of Syria will be like Israel’s faded glory. In that day Jacob’s glory will fade and his healthy body will waste away. It will be like a reaper gathering grain in the Valley of Rephaim. Yet a few will be left, like olives left on a tree after it is beaten: two or three at the very top, four or five on the fruitful branches.
  - range: 7-11
    heading: Looking to the Maker
    plain: |
      In that day people will look to their Maker and turn their eyes to the Holy One of Israel. They won’t look to the altars they built or respect the Asherah poles and incense altars they made. Their strong cities will be abandoned like the places the earlier inhabitants abandoned before Israel, and there will be desolation. Because you have forgotten the God who saves you and haven’t remembered the Rock who is your fortress, you plant pleasant gardens and set out imported vines. The day you plant them, you make them grow, and the next morning they bud. But the harvest is a heap in a day of grievous wounds and incurable sorrow.
  - range: 12-14
    heading: Roaring nations, gone by morning
    plain: |
      Listen to the roar of many nations, raging like the roaring sea! Hear the nations rush like mighty waters! But when God rebukes them, they flee far away, driven like chaff on the hills in the wind, like whirling dust before a storm. In the evening, terror; by morning, they are gone. This is what happens to those who plunder us and rob us.

notes:
  - ref: 1
    phrase: Damascus is taken away from being a city, and it shall be a ruinous heap
    kind: history
    title: The fall of Damascus
    body: |
      **Damascus** was an ancient city of Syria. When Ahaz appealed to Assyria for help against Syria and Israel ([[2 Kgs. 16:7]]), Tiglath-pileser took Damascus, carried its people captive to Kir, and slew King Rezin ([[2 Kgs. 16:9]]). The Bible Dictionary dates the capture to about 733 BC.

      Isaiah had told Ahaz not to fear Rezin ([[Isa. 7:4–9]]), and within a few years Rezin was dead.
    sources: [bd-damascus, lds-scriptures]
  - ref: 3
    phrase: The fortress also shall cease from Ephraim
    kind: history
    title: Why Ephraim is in an oracle against Damascus
    body: |
      Ephraim (the northern kingdom of Israel) had joined Damascus against Judah ([[Isa. 7:1–2]]). Isaiah’s point is that the two allies share one fate. In one older reading, Ephraim lost the fortified cities that defended it, Damascus lost its standing as a kingdom, and the remnant of Aram was carried off as the proud citizens of Israel were.
    sources: [delitzsch, lds-scriptures]
  - ref: 5
    phrase: as he that gathereth ears in the valley of Rephaim
    kind: history
    title: The Valley of Rephaim
    body: |
      The **Valley of Rephaim** was a broad plain southwest of Jerusalem, known for its wheat fields. It was also where the Philistines spread out against David ([[2 Sam. 5:17–25]]).

      The image is of a thorough harvest: the gleaners leave only an ear or two lying about. Ephraim’s people were in fact carried off to Assyria ([[2 Kgs. 17:6]]), about 721 BC according to the Bible Dictionary.
    sources: [delitzsch, bd-captivities, lds-scriptures]
  - ref: 6
    phrase: two or three berries in the top of the uppermost bough
    kind: symbol
    title: Olives at the top of the tree
    body: |
      Olives were harvested by beating the branches with a stick, and a few always remained on the highest branches or hidden under the leaves. The law of Moses told Israelites not to go over the boughs again; what was left was for the stranger, the fatherless, and the widow ([[Deut. 24:20]]).

      That is Isaiah’s picture of the **remnant**: a few olives left after the harvest. God leaves something behind. Isaiah uses the same image for the last days in [[Isa. 24:13]]. Latter-day Saint readers may also think of Zenos’s allegory, in which the Lord of the vineyard grafts the natural branches back into the tree ([[Jacob 5:52–60]]).
    sources: [delitzsch, lds-scriptures]
  - ref: 7
    phrase: At that day shall a man look to his Maker
    kind: structure
    title: Looking to the Maker
    body: |
      This is the turning point of the chapter. After the harvest of judgment, the survivors finally look up, not to the altars “the work of his hands,” but to “his Maker,” the Holy One of Israel.

      Notice the contrast between **Maker** and **made**: the survivors turn from “the work of his hands” to “his Maker.” Alma taught that people are sometimes “compelled to be humble,” and that those who humble themselves without being compelled are more blessed ([[Alma 32:13–16]]).
    sources: [lds-scriptures]
  - ref: 10
    phrase: Because thou hast forgotten the God of thy salvation
    kind: christ
    title: The God of thy salvation, the Rock of thy strength
    body: |
      Here is the diagnosis: not a lack of religion, but **forgetting**. Forgetting is one of the great dangers the Book of Mormon warns about. The Nephite cycle began, again and again, when the people forgot the Lord in their prosperity ([[Hel. 12:2]]; [[Alma 46:8]]).

      Two titles stand out: “**God of thy salvation**” and “**the rock of thy strength**.” Helaman taught his sons to build “upon the rock of our Redeemer, who is Christ, the Son of God” ([[Hel. 5:12]]). The sacrament prayer asks that we “always remember him” ([[Moro. 4:3]]).
    sources: [lds-scriptures]
  - ref: 10
    phrase: therefore shalt thou plant pleasant plants, and shalt set it with strange slips
    kind: history
    title: Gardens that sprout overnight
    body: |
      “Pleasant plants” and “strange slips” (foreign cuttings) are read in one older commentary as Ephraim’s cultivation of foreign, sensual forms of worship and its alliance with a stranger, the king of Damascus. On that reading the overnight growth is the alliance quickly flowering into the plan of a joint attack on Judah.

      Verse 11 then ends in “a heap in the day of grief and of desperate sorrow.” The quick growth ends in a harvest of grief.
    sources: [delitzsch]
  - ref: 12
    phrase: Woe to the multitude of many people, which make a noise like the noise of the seas
    kind: symbol
    title: Nations like the roaring sea
    body: |
      Isaiah compares the massed armies of the nations to a roaring sea and rushing waters. It’s a terrifying sound.

      But the Lord has only to “rebuke” them, and they scatter like chaff blown off a hilltop threshing floor, or like dust whirled up by a storm (verse 13). The Lord who once rebuked the Red Sea ([[Ps. 106:9]]) later stilled a storm on Galilee with a word: “Peace, be still” ([[Mark 4:39]]).
    sources: [delitzsch, lds-scriptures]
  - ref: 14
    phrase: at eveningtide trouble; and before the morning he is not
    kind: history
    title: Gone by morning
    body: |
      Verses 12–14 describe nations that rage in the evening and are gone by morning. One older commentary reads this as the destruction of Assyria’s imperial army and points to its fulfillment in Isaiah 37:36: “the angel of the LORD went forth, and smote in the camp of the Assyrians a hundred and fourscore and five thousand: and when they arose early in the morning, behold, they were all dead corpses” ([[Isa. 37:36]]).
    sources: [delitzsch, lds-scriptures]

christ: |
  Two titles in this chapter point to Jesus Christ: “**the God of thy salvation**” and “**the rock of thy strength**” (verse 10). He is the Maker to whom the remnant finally looks (verse 7). The Book of Mormon calls Him “the rock of our Redeemer,” the sure foundation on which the storms cannot prevail ([[Hel. 5:12]]).

  The olives left at the top of the tree (verse 6) are a picture of His mercy: even in judgment, He deliberately leaves a remnant to gather. And the nations roaring like the sea (verse 12) fall silent at His rebuke, as the sea of Galilee did ([[Mark 4:39]]).

explore: |
  - **Gleanings.** Read [[Deut. 24:19–22]], [[Ruth 2]], and [[Isa. 24:13]]. How does the law of gleaning illuminate Isaiah’s picture of the remnant?
  - **Forgetting and remembering.** Trace the Nephite cycle in [[Hel. 12:1–6]]. How does Isaiah 17:10 describe the same pattern?
  - **Rock imagery.** Follow the “rock” through [[Isa. 26:4]], [[Isa. 28:16]], [[Isa. 44:8]], [[Hel. 5:12]], and [[3 Ne. 11:39–40]].

sources: [bd-damascus, bd-captivities, delitzsch, lds-scriptures]
