chapter: 19
title: '“Blessed Be Egypt My People”'
tagline: The Lord rides into Egypt on a cloud and dismantles its wisdom, its economy, and its gods, and then He heals it, until Egypt and Assyria worship beside Israel.
when: 'Late 700s–early 600s BC, with a vision reaching to the last days'

setting: |
  Egypt was the most tempting ally in Judah’s world. It was ancient, wealthy, famous for its wisdom, and close by. Throughout Isaiah’s ministry, Judah’s leaders kept looking to Egypt for help against Assyria, and Isaiah kept warning them not to ([[Isa. 30:1–7]]; [[Isa. 31:1–3]]).

  Isaiah 19 has two very different halves. The first (verses 1–15) is judgment. The Lord comes into Egypt, sets Egyptians against each other, dries up the Nile economy, and makes its famous wise men look foolish. In the century after Isaiah, Egypt did suffer civil strife, Assyrian invasion (Esarhaddon took Memphis in 671 BC), and foreign rule.

  The second half (verses 16–25) is one of the most astonishing passages in the Old Testament. Five times Isaiah says “in that day,” and each step brings Egypt closer to the Lord until, in the final verse, God calls Egypt “my people” and Assyria “the work of my hands,” and sets them beside Israel as a blessing in the earth.

thread: |
  The key to Isaiah 19 is verse 22: “the LORD shall smite Egypt: he shall **smite and heal** it.” The chapter is built on that pair of verbs.

  **The smiting (verses 1–15).** The Lord takes apart everything Egypt trusted, one piece at a time: its **gods** tremble (verse 1), its **social order** collapses into civil war (verse 2), its **spirit** and **counsel** fail, and people turn to mediums (verse 3). Its **independence** goes to a cruel master (verse 4). Its **economy**, which depended entirely on the Nile, dries up. The fishermen, the flax workers, and the weavers are all ruined (verses 5–10). And its famous **wisdom** turns to foolishness. The royal counselors of Zoan and Memphis stagger like drunks (verses 11–15). Everything Judah admired about Egypt proves hollow.

  **The healing (verses 16–25).** Then the direction reverses. Five “in that day” steps move Egypt from terror, to speaking the language of Canaan, to building an altar to the Lord, to crying out and receiving “a saviour,” to knowing and worshipping the Lord. The final step reaches Assyria too. A highway connects Egypt and Assyria, the two superpowers that had crushed Israel between them, and all three worship together.

  Isaiah’s audience would have been stunned. The Lord’s purpose was never just to punish Judah’s enemies. It was to **bring them home**. That is why He smites: so that He can heal.

sections:
  - range: 1-4
    heading: The Lord rides into Egypt
    plain: |
      This is the oracle about Egypt. Look! The Lord rides on a swift cloud and comes to Egypt. Egypt’s idols tremble before Him, and Egypt’s heart melts. “I will stir up Egyptian against Egyptian: brother will fight brother, neighbor against neighbor, city against city, kingdom against kingdom. Egypt’s spirit will fail within it, and I will confuse its plans. They will consult idols, the spirits of the dead, mediums, and spiritists. I will hand Egypt over to a harsh master, and a fierce king will rule them,” says the Lord God of hosts.
  - range: 5-10
    heading: The Nile runs dry
    plain: |
      The waters of the Nile will dry up, and the riverbed will be parched and dry. The canals will stink, and Egypt’s streams will dwindle and dry up. Reeds and rushes will wither. The plants along the Nile and everything sown there will dry up, blow away, and vanish. The fishermen will groan and lament, all who cast hooks into the Nile and spread nets on the water. The flax workers and linen weavers will despair. Egypt’s cloth makers will be crushed, and all its hired workers will be sick at heart.
  - range: 11-15
    heading: The wise men of Egypt
    plain: |
      The officials of Zoan are complete fools, and Pharaoh’s wisest advisers give stupid advice. How can you tell Pharaoh, “I come from a line of wise men, descended from ancient kings”? Where are your wise men now? Let them tell you what the Lord of hosts has planned for Egypt. The officials of Zoan have become fools, and the leaders of Memphis are deceived. The heads of its tribes have led Egypt astray. The Lord has poured into them a spirit of confusion, and they make Egypt stagger in everything it does, like a drunk staggering in his vomit. No one in Egypt, head or tail, palm branch or reed, can do anything.
  - range: 16-25
    heading: Egypt and Assyria come to the Lord
    plain: |
      In that day the Egyptians will tremble when the Lord raises His hand against them. Even the name of Judah will terrify Egypt, because of what the Lord has planned. In that day five cities in Egypt will speak the language of Canaan and swear allegiance to the Lord of hosts. One will be called the City of the Sun. In that day there will be an altar to the Lord in the middle of Egypt and a monument to the Lord at its border. It will be a sign and a witness to the Lord in Egypt. When they cry to the Lord because of their oppressors, He will send them a savior and defender to rescue them. The Lord will make Himself known to Egypt, and the Egyptians will know the Lord. They will worship with sacrifices and offerings, make vows to the Lord, and keep them. The Lord will strike Egypt, striking and healing, and they will turn to the Lord. He will listen to their prayers and heal them. In that day there will be a highway from Egypt to Assyria. Assyrians will go to Egypt and Egyptians to Assyria, and they will worship together. In that day Israel will be the third, along with Egypt and Assyria, a blessing in the middle of the earth. The Lord of hosts will bless them, saying, “Blessed be Egypt My people, Assyria the work of My hands, and Israel My inheritance.”

notes:
  - ref: 1
    phrase: the LORD rideth upon a swift cloud
    kind: symbol
    title: The Rider on the clouds
    body: |
      In Canaanite poetry, the storm god Baal was called “the Rider of the Clouds.” Israel’s poets deliberately claimed that title for the Lord: He is the one who truly “rideth upon the heavens” ([[Ps. 68:4]]; [[Ps. 104:3]]). Isaiah pictures Him riding a cloud like a war chariot straight into Egypt, and Egypt’s idols shake.

      The image of the Lord coming on the clouds became part of the prophecies of the Son of Man ([[Dan. 7:13]]) and of the Second Coming: “they shall see the Son of man coming in the clouds of heaven with power and great glory” ([[Matt. 24:30]]; [[D&C 45:44]]).
  - ref: 2
    phrase: I will set the Egyptians against the Egyptians
    kind: history
    title: Egypt divided
    body: |
      Egypt had a long history of splitting into rival kingdoms. In Isaiah’s century, the country was fractured among local dynasts before the Cushite 25th Dynasty reunited it by force. Rivalries and civil conflict continued, and the Assyrians exploited them when they invaded in the 670s–660s BC.

      Isaiah’s point is spiritual as well as political. A nation that abandons the true source of unity will turn on itself. Jesus said, “every kingdom divided against itself is brought to desolation” ([[Matt. 12:25]]).
    sources: [bd-egypt]
  - ref: 5
    phrase: the river shall be wasted and dried up
    kind: history
    title: Egypt without the Nile
    body: |
      Egypt was, as the Greek historian Herodotus famously put it, “the gift of the Nile.” Nearly all of its agriculture, fishing, papyrus, and linen depended on the river’s annual flood. Verses 5–10 walk through the economy one sector at a time. The **reeds and papyrus** wither. The **fishermen**, whether they fish with a hook (“angle”) or a net, have nothing to catch. The **flax workers and weavers** who made Egypt’s famous fine linen are ruined. Even those who built fish ponds and dams despair.

      For an Egyptian, a dry Nile was the end of the world. Isaiah is saying the Lord controls the very thing Egypt trusted most.
  - ref: 11
    phrase: the princes of Zoan are fools
    kind: history
    title: The wisdom of Egypt
    body: |
      Egypt was famous for its wisdom literature and its learned royal counselors. “Moses was learned in all the wisdom of the Egyptians” ([[Acts 7:22]]). **Zoan** (Tanis, in the Nile delta) and **Noph** (Memphis, the ancient capital) were royal cities. The counselors proudly claimed descent from wise men and ancient kings (verse 11).

      Isaiah’s taunt is sharp: if you are so wise, tell Pharaoh what the Lord of hosts has planned. They can’t. Human wisdom that doesn’t know God’s purposes is, in the end, foolishness ([[1 Cor. 1:19–20]], quoting [[Isa. 29:14]]; [[2 Ne. 9:28–29]]).
  - ref: 14
    phrase: as a drunken man staggereth in his vomit
    kind: symbol
    title: Staggering counselors
    body: |
      It’s a crude image, and deliberately so. Egypt’s dignified wise men are pictured as drunks reeling and slipping in their own vomit. The Lord has “mingled a perverse spirit” among them, a spirit of dizziness and confusion. Isaiah will use the image of drunkenness again for Israel’s own leaders ([[Isa. 28:7–8]]; [[Isa. 29:9–10]]).

      Spiritual confusion is often the first judgment on those who reject God’s counsel. The Book of Mormon notes how the Lord sometimes lets people be “led away” by their own foolish imaginations ([[Alma 30:13–18]]; [[Hel. 13:29]]).
  - ref: 18
    phrase: five cities in the land of Egypt speak the language of Canaan
    kind: history
    title: Speaking the language of Canaan
    body: |
      “The language of Canaan” is Hebrew. Isaiah foresees Hebrew-speaking communities in Egypt who swear allegiance to the Lord. That began to happen soon. Jewish communities existed in Egypt from Jeremiah’s time onward ([[Jer. 44:1]]), including a military colony at Elephantine far up the Nile. In the Hellenistic era, Alexandria had one of the largest Jewish populations in the world, and it was there that the Hebrew scriptures were first translated into Greek.

      “The city of destruction” is a notable textual puzzle. The Hebrew *ʿir haheres* (“city of destruction”) differs by one letter from *ʿir haḥeres*, “city of the **sun**,” the Hebrew name for Heliopolis, and some ancient manuscripts read it that way. Most modern translations follow “City of the Sun.”
    sources: [great-isaiah-scroll, blenkinsopp]
  - ref: 19
    phrase: there be an altar to the LORD in the midst of the land of Egypt
    kind: history
    title: An altar in Egypt
    body: |
      This is surprising. Normally the law restricted sacrifice to one sanctuary ([[Deut. 12:5–14]]). Isaiah pictures an altar to the Lord in the heart of Egypt and a pillar (a memorial monument) at its border, like the witness stones the patriarchs set up ([[Gen. 28:18–22]]; [[Josh. 22:26–27]]).

      The pillar is a second surprise. The Hebrew is *maṣṣēbâ*, a standing stone, and Deuteronomy forbids Israel to set one up: “Neither shalt thou set thee up any image; which the LORD thy God hateth” ([[Deut. 16:22]]), because such stones so often marked the shrines of other gods. Yet the same word describes the pillar Jacob raised at Bethel and the twelve pillars Moses set beside the altar at Sinai, one for each tribe, when Israel entered the covenant ([[Ex. 24:4]]). Isaiah’s altar and pillar in Egypt are that kind: markers that a covenant has been made and that the land belongs to the Lord.

      Remarkably, in the second century BC a Jewish priest named Onias IV built a temple at Leontopolis in Egypt and, according to the historian Josephus, justified it by citing this very prophecy of Isaiah. But Isaiah’s vision is larger than any one building. It describes Egyptians themselves coming to worship the God of Israel.
    sources: [biblehub-interlinear, sc-knowhy-870]
  - ref: 20
    phrase: he shall send them a saviour, and a great one, and he shall deliver them
    kind: christ
    title: A Savior for Egypt
    body: |
      This verse deliberately echoes the book of Judges, where Israel cried to the Lord under oppression and He “raised up a deliverer” ([[Judg. 3:9]]; [[Judg. 3:15]]). The Hebrew word there, *moshiaʿ*, is the same word translated “saviour” here. Now the pattern applies to Egypt. When Egypt cries to the Lord, He will send a savior to them too.

      The ultimate Savior is Jesus Christ. There is a poignant connection here. As an infant, Jesus Himself was carried into Egypt for refuge, “that it might be fulfilled… Out of Egypt have I called my son” ([[Matt. 2:13–15]]). The Savior of the world found shelter in the very land Isaiah said would one day receive a savior.
  - ref: 22
    phrase: he shall smite and heal it
    kind: scripture
    title: Smite and heal
    body: |
      This is the key to the chapter, and to much of Isaiah. The Lord’s discipline has a purpose beyond itself: “he shall smite and heal it: and they shall return even to the LORD… and shall heal them.” Hosea says the same about Israel: “he hath torn, and he will heal us; he hath smitten, and he will bind us up” ([[Hosea 6:1]]).

      This isn’t a guarantee that every hardship is a direct punishment. But it does mean that the Lord can turn our wounds into the very places where healing begins. Alma was “racked… with the pains of a damned soul,” and when he cried out to Jesus, his soul “was filled with joy as exceeding as was my pain” ([[Alma 36:16–20]]). The goal of the smiting is always the healing.
  - ref: 23
    phrase: there be a highway out of Egypt to Assyria
    kind: symbol
    title: A highway between enemies
    body: |
      Egypt and Assyria were the two superpowers that fought over Israel’s land for centuries, marching their armies back and forth along the coastal highway through Judah. Isaiah pictures that same highway becoming a road of worship, with Egyptians and Assyrians traveling to visit each other, and worshipping the Lord together.

      The highway is one of Isaiah’s favorite images for the Lord’s work of gathering ([[Isa. 11:16]]; [[Isa. 35:8]]; [[Isa. 40:3]]; [[Isa. 62:10]]). Here it reconciles bitter enemies. The gospel does that ([[Eph. 2:13–16]]; [[4 Ne. 1:15–17]]).
  - ref: 25
    phrase: Blessed be Egypt my people, and Assyria the work of my hands, and Israel mine inheritance
    kind: scripture
    title: '“Egypt my people”'
    body: |
      It is hard to overstate how shocking this verse would have been to Isaiah’s audience. “My people” was Israel’s covenant title ([[Ex. 6:7]]). “The work of my hands” and “mine inheritance” were terms of special belonging. Now the Lord bestows these titles on **Egypt**, the land of Israel’s slavery, and **Assyria**, the empire that had just destroyed the northern kingdom.

      This is the Abrahamic covenant in its fullness: “in thee shall all families of the earth be blessed” ([[Gen. 12:3]]; [[Abr. 2:9–11]]). Israel becomes “a blessing in the midst of the land” (verse 24), not by being exclusive but by bringing the nations to God. The Book of Mormon teaches the same: the Lord “inviteth them all to come unto him… and all are alike unto God,” Jew and Gentile ([[2 Ne. 26:33]]).
    sources: [bd-abraham-covenant]

christ: |
  Isaiah 19 is a portrait of the Savior’s redemptive reach. The Lord rides on the clouds in judgment (verse 1), as Christ will at His coming ([[Matt. 24:30]]). But His goal is healing: “he shall smite and heal” (verse 22). He sends Egypt “a saviour, and a great one” (verse 20), and the great Savior of the world was sheltered in Egypt as a child ([[Matt. 2:13–15]]).

  The chapter’s ending, with Egypt, Assyria, and Israel worshipping together, is fulfilled in the gospel of Jesus Christ, who “hath broken down the middle wall of partition” between peoples ([[Eph. 2:14]]). In Him, even the oldest enemies can become “my people.”

liken: |
  - What is my “Egypt,” something impressive that I’m tempted to trust instead of the Lord (money, expertise, a wise-seeming plan)?
  - Can I see a time when the Lord “smote and healed” me, when something painful became the beginning of healing?
  - Who are the “Egypt” and “Assyria” in my world: people I find it hardest to imagine as the Lord’s people? What does verse 25 ask of me toward them?

explore: |
  - **Egypt in Isaiah.** Compare Isaiah 19 with [[Isa. 20]], [[Isa. 30:1–7]], and [[Isa. 31:1–3]]. What’s the common warning? How does chapter 19’s ending change the picture?
  - **Blessed be Egypt.** Compare verse 25 with [[Gen. 12:1–3]], [[Abr. 2:9–11]], and [[2 Ne. 26:33]].
  - **Enemies reconciled.** Read [[4 Ne. 1:15–17]]. How does the Nephite golden age fulfill the spirit of Isaiah 19:23–25?

sources: [bd-egypt, bd-assyria, ot-manual-14, oswalt, blenkinsopp, sc-knowhy-870]
