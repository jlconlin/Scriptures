chapter: 57
title: The High and Lofty One
tagline: While the righteous die unnoticed and the people chase idols on every hilltop, the God who inhabits eternity announces where else He lives, with the crushed and humble, and offers peace to the far and the near.
when: 'Setting: the community in Judah, late sixth century BC; the idolatry it describes recalls the reign of Manasseh, c. 690–640 BC'

setting: |
  Chapter 57 continues the accusation that began at 56:9. The blind watchmen and drinking shepherds were the leaders; now the prophet turns to the people. The first two verses mourn the righteous, who die without anyone noticing. Verses 3–13 are one of the harshest passages in Isaiah, a courtroom speech against a people who have given themselves to idols, told in the language of adultery. Then the tone changes completely. Verses 14–21 are among the most tender in the book: God, who lives in the high and holy place, also lives with the humble, and He promises to heal.

  The idolatry described here (child sacrifice in the valleys, rites among the stones of the streambeds, offerings to the dead) is the religion Isaiah’s own contemporaries practiced, especially under King Manasseh ([[2 Kgs. 21:1–16]]). Whether it survived into the period after the exile is debated; see the note on verse 5.

  The chapter ends with the refrain “There is no peace, saith my God, to the wicked,” which also closes chapter 48. The two refrains divide chapters 40–66 into three nearly equal parts.

thread: |
  Isaiah 57 is about **where God lives**.

  The idolaters look for the divine everywhere except where He is. They go down to the valleys and the streambeds, up to the “lofty and high mountain,” behind the doors of their houses, and even down to Sheol, pouring out offerings and perfume (verses 5–9). They wear themselves out and never admit it is hopeless (verse 10). Meanwhile the righteous die, and no one thinks about why (verse 1).

  Verse 15 answers them. The true God is higher than any mountain they climb: “the high and lofty One that inhabiteth eternity.” And He also lives in a place they never thought to look: “with him also that is of a contrite and humble spirit.” The word for “contrite” means crushed, and it is the word Isaiah used for the servant who was “bruised for our iniquities” ([[Isa. 53:5]]). God lives at both extremes, in the highest heaven and in the lowest heart.

  So the chapter ends with an offer. God will stop contending, heal, and create “peace, peace to him that is far off, and to him that is near” (verse 19). Only the wicked, restless as the sea, are left without peace, and that is by their own choice (verses 20–21).

sections:
  - range: 1-2
    heading: The righteous taken away
    plain: |
      The righteous die, and nobody takes it to heart. The faithful are taken away, and nobody understands that the righteous are taken away to spare them from the evil to come. They enter into peace; those who walked uprightly rest on their beds.
  - range: 3-13
    heading: Children of the sorceress
    plain: |
      But you, come here, you children of a sorceress, offspring of an adulterer and a prostitute! Whom are you mocking? At whom do you sneer and stick out your tongue? Aren’t you a brood of rebels, a lying race? You burn with lust among the oaks and under every green tree; you slaughter your children in the valleys, under the overhanging rocks. Your share is among the smooth stones of the streambed; they, they are your lot. You have poured out drink offerings and brought grain offerings to them. Should I be satisfied with this? You have set your bed on a high and lofty mountain, and gone up there to offer sacrifice. Behind your door and doorpost you have put your reminder. You have uncovered yourself for someone other than Me, climbed into your bed and made it wide, made a bargain with them, and loved their bed when you saw it. You went to the king with oil and multiplied your perfumes; you sent your messengers far away and sank all the way down to Sheol. You were wearied by your long journey, but you never said, “It’s hopeless.” You found new strength, so you didn’t give up. Whom did you fear so much that you lied, and didn’t remember Me or give Me a thought? Isn’t it because I have been silent for so long that you don’t fear Me? I will expose your “righteousness” and your deeds, and they won’t help you. When you cry out, let your collection of idols save you! The wind will carry them all off; a breath will take them away. But whoever takes refuge in Me will inherit the land and possess My holy mountain.
  - range: 14-21
    heading: With the contrite and humble
    plain: |
      And it will be said: Build up, build up, prepare the road! Remove every obstacle from My people’s path. For this is what the high and exalted One says, who lives forever, whose name is Holy: I live in a high and holy place, and also with the one who is crushed and humble in spirit, to revive the spirit of the humble and the heart of the crushed. I will not accuse forever or always be angry, for then the spirit would grow faint before Me, the very breath of life that I made. I was angry because of his sinful greed; I struck him and hid My face in anger, but he kept turning back to his own way. I have seen his ways, but I will heal him. I will guide him and restore comfort to him and to those who mourn for him, creating praise on their lips. Peace, peace to those far and near, says the Lord, and I will heal them. But the wicked are like the tossing sea, which cannot rest, whose waves churn up mud and mire. “There is no peace,” says my God, “for the wicked.”

notes:
  - ref: 1
    phrase: none considering that the righteous is taken away from the evil to come
    kind: liken
    title: Taken away from the evil to come
    body: |
      The death of a good person often looks like a loss with no meaning. Isaiah says it can be a rescue. The righteous is “taken away” (*neʾĕsap*, gathered, the verb used when a person is “gathered to his people” at death) from the evil that is coming. The Lord made the same promise to King Josiah: “thou shalt be gathered into thy grave in peace; and thine eyes shall not see all the evil which I will bring upon this place” ([[2 Kgs. 22:20]]). Josiah died before Babylon destroyed Jerusalem.

      Verse 2 describes what comes next: “He shall enter into peace: they shall rest in their beds.” The beds here are graves, but the language is gentle. The Book of Mormon describes the same state: the spirits of the righteous “are received into a state of happiness, which is called paradise, a state of rest, a state of peace” ([[Alma 40:12]]). Revelation calls the dead who die in the Lord “blessed… that they may rest from their labours” ([[Rev. 14:13]]).

      The complaint of the verse is that “no man layeth it to heart.” The people do not ask what the deaths mean. Jewish tradition holds that Isaiah himself was put to death under Manasseh, and many readers have seen that tradition behind [[Heb. 11:37]]; whether or not it is historical, it gives the verse a poignant edge.
    sources: [oswalt, bdb]
  - ref: 5
    phrase: slaying the children in the valleys under the clifts of the rocks
    kind: history
    title: The religion of the valleys
    body: |
      The practices in verses 5–9 were real. “Under every green tree” is the stock phrase for the hilltop shrines of fertility worship ([[Deut. 12:2]]; [[Jer. 2:20]]). Child sacrifice took place in the Valley of Hinnom below Jerusalem, at a site called Tophet: “to burn their sons and their daughters in the fire; which I commanded them not, neither came it into my heart” ([[Jer. 7:31]]). King Manasseh “made his son pass through the fire” ([[2 Kgs. 21:6]]), and King Josiah later defiled Tophet so that no one could do it again ([[2 Kgs. 23:10]]).

      Verse 9 may refer to the same cult. “Thou wentest to the king” is *lammelek*; with different vowels (the original Hebrew text had none) it would read *lammōlek*, “to Molech,” the god to whom children were offered ([[Lev. 18:21]]). The next line, “didst debase thyself even unto hell” (*šəʾôl*, the world of the dead), suggests rites for the dead or consultation of spirits, which Isaiah condemned early in the book ([[Isa. 8:19]]). Both readings are hypotheses, but they fit the passage.

      This raises a dating question. These are the sins of the kingdom of Judah before the exile, the sins Isaiah’s contemporaries committed. Some scholars think the passage preserves an older, pre-exilic oracle placed here; others think such practices survived among those who never went to Babylon. For readers who take the book as Isaiah’s, the passage is simply what it appears to be: a description of the religion of his own day, set within a prophecy that reaches beyond it.
    sources: [blenkinsopp, paul-40-66, bd-high-places]
  - ref: 6
    phrase: 'Among the smooth stones of the stream is thy portion; they, they are thy lot'
    kind: words
    title: A portion among the stones
    body: |
      The Hebrew has a pun that English cannot keep. “Among the smooth stones” is *bəḥalləqê*; “thy portion” is *ḥelqēk*. Both come from the letters *ḥ-l-q*. The people have chosen smooth stones, perhaps standing stones in a streambed used as cult objects, as their share in life.

      “Portion” and “lot” are the language of Israel’s inheritance. When the land was divided by lot, each tribe received its portion. The Levites received none, because the Lord said, “I am thy part and thine inheritance” ([[Num. 18:20]]). The psalmist claimed the same: “The LORD is the portion of mine inheritance and of my cup: thou maintainest my lot” ([[Ps. 16:5]]). Isaiah’s audience has traded that portion for a few smooth rocks.

      The Lord’s question, “Should I receive comfort in these?”, uses the verb *niḥam*, the word that opened chapter 40: “Comfort ye, comfort ye my people.” The God who comforts His people is asked to be comforted by their offerings to stones. He will not be.
    sources: [bdb, paul-40-66]
  - ref: 8
    phrase: Behind the doors also and the posts hast thou set up thy remembrance
    kind: symbol
    title: A reminder behind the door
    body: |
      Moses told Israel to write the Lord’s words “upon the posts of thy house, and on thy gates” ([[Deut. 6:9]]), so that every trip in or out of the house would remind them of Him. Jews still do this with the *mezuzah*, a small case holding [[Deut. 6:4–9]] fixed to the doorpost.

      Isaiah’s audience has done the opposite. Behind the door and the doorpost they have “set up thy remembrance” (*zikrônēk*), a token of another god. The exact object is unknown; it may have been a household idol or an amulet. The point is where it is. Moses put the reminder of the Lord where everyone would see it. They put another reminder where no one would.

      The rest of the verse turns idolatry into adultery, as Hosea, Jeremiah, and Ezekiel also did ([[Hosea 2:2–13]]; [[Jer. 3:6–9]]; [[Ezek. 16]]). The image is uncomfortable on purpose. The covenant was a marriage, and chasing other gods was unfaithfulness to a husband.
    sources: [oswalt, paul-40-66]
  - ref: 11
    phrase: have not I held my peace even of old, and thou fearest me not?
    kind: liken
    title: When God is silent
    body: |
      Why did the people stop fearing God? Because He had been quiet. Judgment did not fall right away, so they concluded it never would. The Preacher described the same reasoning: “Because sentence against an evil work is not executed speedily, therefore the heart of the sons of men is fully set in them to do evil” ([[Eccl. 8:11]]).

      God’s silence runs through the last chapters of Isaiah. Earlier He said, “I have long time holden my peace… now will I cry like a travailing woman” ([[Isa. 42:14]]). In chapter 64 the people will ask Him, “wilt thou hold thy peace, and afflict us very sore?” ([[Isa. 64:12]]), and in chapter 65 He answers, “I will not keep silence, but will recompense” ([[Isa. 65:6]]). The silence is patience, not indifference: the Lord “is longsuffering to us-ward, not willing that any should perish” ([[2 Pet. 3:9]]).

      The verse also asks a sharper question: “of whom hast thou been afraid… that thou hast lied?” The people feared something, just not the Lord. Idolatry is often driven by fear, the wish to cover every possibility and keep every power on one’s side.
    sources: [oswalt]
  - ref: 14
    phrase: take up the stumblingblock out of the way of my people
    kind: symbol
    title: Prepare the way, again
    body: |
      “Cast ye up, cast ye up, prepare the way” repeats the highway of chapter 40: “Prepare ye the way of the LORD… make straight in the desert a highway for our God” ([[Isa. 40:3]]). There the road ran through the desert from Babylon, and the obstacles were mountains and valleys. Here the people are already home, and the obstacles are moral: a “stumblingblock” (*mikšôl*) in the way of the Lord’s people. The last division of Isaiah takes the images of chapters 40–55 and applies them to a community that has returned but not yet repented. Chapter 62 will use the highway image once more ([[Isa. 62:10]]).

      Paul gave the same command to the Saints at Rome: “that no man put a stumblingblock or an occasion to fall in his brother’s way” ([[Rom. 14:13]]). Sometimes the obstacle in the road is us.
    sources: [oswalt, blenkinsopp]
  - ref: 15
    phrase: For thus saith the high and lofty One that inhabiteth eternity, whose name is Holy
    kind: words
    title: The high and lofty One
    body: |
      “High and lofty” (*rām wənissāʾ*) is the phrase of Isaiah’s call vision: “I saw also the Lord sitting upon a throne, high and lifted up” ([[Isa. 6:1]]). The same pair described the servant, who “shall be exalted and extolled, and be very high” ([[Isa. 52:13]]). Isaiah uses it only of God and of His servant.

      “That inhabiteth eternity” (*šōkēn ʿad*) can also be read “who dwells forever.” Either way it sets God outside time. Latter-day scripture gives Him a similar name: “Endless is my name; for I am without beginning of days or end of years” ([[Moses 1:3]]).

      The verb “inhabit,” *šākan*, is the key word of the verse. It is the verb of the tabernacle (*miškān*, “dwelling place”): “let them make me a sanctuary; that I may dwell among them” ([[Ex. 25:8]]). Later Jewish writers derived from it the word *Shekhinah*, God’s dwelling presence. In this verse God dwells in two places at once. He says “I dwell in the high and holy place,” and in the same breath, “with him also that is of a contrite and humble spirit.”
    sources: [bdb, oswalt]
  - ref: 15
    phrase: with him also that is of a contrite and humble spirit
    kind: christ
    title: The crushed and the humble
    body: |
      “Contrite” is *dakkāʾ*, literally “crushed.” It is the same root Isaiah used four chapters earlier for the servant: “he was bruised (*mədukkāʾ*) for our iniquities” and “it pleased the LORD to bruise him” ([[Isa. 53:5]]; [[Isa. 53:10]]). The God who is high and lifted up lives with the crushed, and the servant who would be high and lifted up was first crushed Himself. Whether Isaiah intended the echo is uncertain, but the book places it there for readers to find.

      The Psalms had already said it: “The sacrifices of God are a broken spirit: a broken and a contrite heart, O God, thou wilt not despise” ([[Ps. 51:17]]). The Book of Mormon makes it the offering that replaces animal sacrifice. After His death, the Savior told the Nephites, “ye shall offer for a sacrifice unto me a broken heart and a contrite spirit” ([[3 Ne. 9:20]]), and Lehi taught that Christ’s own sacrifice answers the law “unto all those who have a broken heart and a contrite spirit” ([[2 Ne. 2:7]]). In the Sabbath commandment of latter-day revelation, it is the one sacrifice named ([[D&C 59:8]]).

      The purpose of God’s dwelling with such people is stated twice: “to revive.” He does not live with the crushed to keep them crushed. He comes to bring them back to life.
    sources: [bdb, oswalt]
  - ref: 19
    phrase: Peace, peace to him that is far off, and to him that is near
    kind: christ
    title: Peace to the far and the near
    body: |
      God says He will not contend forever, “for the spirit should fail before me, and the souls which I have made” (verse 16). If His anger never ended, the people He created could not survive it. The psalmist said the same: “He will not always chide: neither will he keep his anger for ever” ([[Ps. 103:9]]).

      Instead He creates “the fruit of the lips,” praise, and speaks the double word “Peace, peace” (*šālôm šālôm*), the Hebrew way of saying “perfect peace” (compare [[Isa. 26:3]], where “perfect peace” is literally “peace, peace”). It goes “to him that is far off, and to him that is near.” In context, the far off are probably the scattered exiles and the near those in the land.

      Paul read the verse more broadly. Writing to Gentile converts at Ephesus, he said Christ “is our peace, who hath made both one,” and that He “came and preached peace to you which were afar off, and to them that were nigh” ([[Eph. 2:14–17]]). The far off are the Gentiles; the near are Israel. Peter used the same words on the day of Pentecost: “the promise is unto you, and to your children, and to all that are afar off” ([[Acts 2:39]]). The chapter that began with the foreigner and the eunuch (56:3–8) is still expanding.
    sources: [oswalt, paul-40-66]
  - ref: 21
    phrase: There is no peace, saith my God, to the wicked
    kind: words
    title: A refrain that divides the book
    body: |
      This line appeared once before, almost word for word, at the end of chapter 48: “There is no peace, saith the LORD, unto the wicked” ([[Isa. 48:22]]; [[1 Ne. 20:22]]). Many readers have noticed that the two refrains divide chapters 40–66 into three parts of nine chapters each: 40–48, 49–57, and 58–66. The third part ends with an even grimmer image of the wicked (66:24). Whether the arrangement is deliberate is debated, but the refrain clearly marks a boundary.

      The image before it explains the refrain. The wicked are “like the troubled sea, when it cannot rest.” Peace is not withheld from them arbitrarily; restlessness is their nature. The sea churns up “mire and dirt” from its own bottom. Jude used the same picture for false teachers: “raging waves of the sea, foaming out their own shame” ([[Jude 1:13]]). Alma put it in five words: “wickedness never was happiness” ([[Alma 41:10]]).

      The contrast with verse 19 is deliberate. Peace was offered to everyone, far and near. The only ones without it are those who will not stop churning long enough to receive it.
    sources: [oswalt, childs]

christ: |
  Verse 15 describes the God who came down. “The high and lofty One,” the Lord Isaiah saw on His throne ([[Isa. 6:1]]; [[John 12:41]]), chose to dwell with the crushed, and became “bruised for our iniquities” Himself ([[Isa. 53:5]]). He asks for the offering that matches His own: “a broken heart and a contrite spirit” ([[3 Ne. 9:20]]). And He is the peace offered to the far and the near, the one who “hath made both one” ([[Eph. 2:14]]).

liken: |
  - When a righteous person I love dies, do I “lay it to heart”? Can I see death as the Lord’s gathering and rest, not only as loss?
  - What have I set up “behind the doors,” some reminder or loyalty I keep where others won’t see it?
  - Have I mistaken the Lord’s patience for His absence?
  - Where does God live in my life, only in the “high and holy place” of formal worship, or also in the places where I feel crushed?
  - Am I a stumbling block in someone else’s way, or am I helping clear the road?

explore: |
  - **Where God dwells.** Read [[Ex. 25:8]], [[1 Kgs. 8:27]], [[Isa. 57:15]], [[Isa. 66:1–2]], and [[John 1:14]].
  - **A broken heart and a contrite spirit.** Trace the phrase through [[Ps. 51:17]], [[2 Ne. 2:7]], [[3 Ne. 9:19–20]], [[Moro. 6:2]], and [[D&C 59:8]].
  - **Peace to the far and the near.** Read [[Isa. 57:19]] with [[Eph. 2:11–22]].
  - **Rest for the righteous dead.** Read [[Alma 40:11–14]] and [[D&C 138:15–24]].

parallels:
  - ref: Eph. 2:17
    note: Paul applies verse 19 to Gentiles (far off) and Jews (near), made one in Christ.
  - ref: 3 Ne. 9:20
    note: The risen Lord asks for “a broken heart and a contrite spirit”; compare verse 15.
  - ref: Isa. 48:22
    note: The same refrain as verse 21 closes chapter 48.

