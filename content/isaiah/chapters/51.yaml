chapter: 51
title: Awake, Awake
tagline: The Lord calls the faithful to look back to the quarry they were cut from, the people call on the Lord’s arm to wake up, and the Lord answers by calling Jerusalem to wake up and taking the cup of staggering out of her hand.
when: 'Addressed to the exiles in Babylon; read by Jacob to the Nephites, about 559–545 BC'

setting: |
  Chapter 51 belongs with the first two verses of chapter 52; the chapter break falls in the middle of a unit. The passage is built out of two sets of triple commands. First the Lord says “Hearken” three times (verses 1, 4, 7), to those who “follow after righteousness,” to “my people,” and to those who “know righteousness.” Then comes a series of three “Awake, awake” cries. The first is the people’s prayer to the Lord’s arm (verse 9). The second and third are the Lord’s answer, addressed to Jerusalem (verse 17) and to Zion (52:1). The people ask God to wake up. God replies that it is Jerusalem who has been lying unconscious.

  The audience is the same discouraged community as in chapters 49 and 50: exiles who believe the Lord has forgotten them ([[Isa. 49:14]]) or divorced their mother ([[Isa. 50:1]]). Chapter 51 answers them with memory. It points them back to Abraham and Sarah, to the Creation, and to the crossing of the Red Sea, and argues from what God has done to what He will do.

  Jacob read this chapter to the Nephites immediately after chapter 50, and he continued straight through [[Isa. 52:1–2]] before stopping ([[2 Ne. 8]]). He chose where to stop: his quotation ends just before the next “For thus saith the LORD” (52:3). His text differs from the KJV in many verses, most of them in small ways, but in verses 19–20 in a way that changes the meaning.

thread: |
  Isaiah 51 is about **waking up**, and about who needs to.

  It starts with people who are awake to righteousness but afraid. The Lord tells them to look back: at the quarry they were cut from, Abraham and Sarah, one old couple through whom He made a nation (verses 1–3). Then look up: the heavens will vanish like smoke, but His salvation won’t (verses 4–6). Then look around: the people who mock you are moth food (verses 7–8).

  Encouraged, the people cry out, “Awake, awake, put on strength, O arm of the LORD” (verse 9). You slew the sea monster; You dried up the sea; do it again. The Lord answers with reassurance: “I, even I, am he that comforteth you. Who art thou, that thou shouldest be afraid of a man that shall die?” (verse 12). He is not the one who has been asleep.

  Then He turns the cry around: “Awake, awake, stand up, O Jerusalem” (verse 17). Jerusalem is sprawled in the street, drunk on the cup of God’s wrath, with none of her children able to lift her up. The chapter ends with the Lord taking the cup out of her hand and giving it to her oppressors (verses 22–23). The prayer asked God to rouse Himself. The answer is that He never slept; His people did. And the thing that wakes them is His taking away the cup they could not stop drinking.

sections:
  - range: 1-3
    heading: Look to the quarry
    plain: |
      Listen to Me, you who pursue what is right and seek the Lord. Look at the rock you were cut from, at the quarry you were dug out of. Look at Abraham your father and at Sarah who gave birth to you. When I called him, he was only one man, and I blessed him and made him many. So the Lord will comfort Zion. He will comfort all her ruins. He will make her wilderness like Eden and her desert like the garden of the Lord. Joy and gladness will be found there, thanksgiving and the sound of song.
  - range: 4-6
    heading: A law and a light for the peoples
    plain: |
      Pay attention to Me, My people; listen to Me, My nation. Instruction will go out from Me, and My justice will become a light for the peoples. My righteousness is close; My salvation is on its way, and My arm will bring justice to the peoples. The distant coastlands wait for Me and put their hope in My arm. Look up at the sky and down at the earth. The sky will vanish like smoke, the earth will wear out like clothing, and its inhabitants will die like gnats. But My salvation will last forever, and My righteousness will never fail.
  - range: 7-8
    heading: Don’t fear the scoffers
    plain: |
      Listen to Me, you who know what is right, you who have My law in your hearts. Don’t be afraid of people’s scorn or shaken by their insults. The moth will eat them up like a garment, and the worm will eat them like wool. But My righteousness will last forever, and My salvation for all generations.
  - range: 9-11
    heading: '“Awake, O arm of the Lord”'
    plain: |
      Wake up, wake up, arm of the Lord, and clothe Yourself with strength! Wake up as You did in days long ago, in generations past. Weren’t You the one who hacked Rahab to pieces and pierced the sea dragon? Weren’t You the one who dried up the sea, the waters of the great deep, and made a road through the depths so the redeemed could cross? Those the Lord has ransomed will come home. They will enter Zion singing, crowned with everlasting joy. Gladness and joy will overtake them, and sorrow and sighing will run away.
  - range: 12-16
    heading: I am the one who comforts you
    plain: |
      I, yes I, am the one who comforts you. Who are you to be afraid of mortals, who die, of human beings, who wither like grass? You have forgotten the Lord your Maker, who stretched out the heavens and laid the foundations of the earth. All day long you live in terror of the oppressor’s rage, as if he were about to destroy you. But where is the oppressor’s rage now? The prisoner bent in chains will soon be set free; he will not die in the dungeon, and he will not lack bread. For I am the Lord your God, who stirs up the sea so that its waves roar; the Lord of Hosts is My name. I have put My words in your mouth and sheltered you in the shadow of My hand, to plant the heavens, to lay the foundations of the earth, and to say to Zion, “You are My people.”
  - range: 17-23
    heading: Awake, Jerusalem; the cup is taken away
    plain: |
      Wake up, wake up! Stand up, Jerusalem! You have drunk from the Lord’s hand the cup of His wrath. You have drained the goblet that makes people stagger, to the last drop. Of all the children she bore, none is there to guide her; of all the children she raised, none takes her by the hand. Two disasters have struck you, and who will grieve with you? Ruin and destruction, famine and sword. Who will comfort you? Your children have collapsed. They lie at the corner of every street like an antelope caught in a net, full of the Lord’s wrath, of your God’s rebuke. So listen to this, you who are afflicted and drunk, but not with wine. This is what your Lord says, the Lord your God, who defends His people: Look, I have taken out of your hand the cup that makes you stagger. You will never drink from the goblet of My wrath again. I will put it into the hands of your tormentors, who said to you, “Lie down, so we can walk over you.” And you made your back like the ground, like a street for them to walk on.

notes:
  - ref: 1
    phrase: look unto the rock whence ye are hewn, and to the hole of the pit whence ye are digged
    kind: symbol
    title: The quarry you were cut from
    body: |
      The image is a stone quarry. “The hole of the pit” is *maqqebet bôr*, literally “the excavation of a pit,” which BDB glosses as a quarry and pairs with “rock.” The listeners are building stones, and verse 2 identifies the quarry: “Abraham your father, and… Sarah that bare you.”

      Elsewhere in scripture the Lord Himself is Israel’s rock: “Of the Rock that begat thee thou art unmindful” ([[Deut. 32:18]]). Here the rock is a human ancestor, and the point is humility as much as pride. Israel came from a single couple whose marriage was long unfruitful. Whatever it has become, it was carved out by God’s hand.

      John the Baptist turned the image against those who thought ancestry was enough: “God is able of these stones to raise up children unto Abraham” ([[Matt. 3:9]]). The Restoration broadens the quarry in the other direction. The Lord promised Abraham that “as many as receive this Gospel shall be called after thy name, and shall be accounted thy seed” ([[Abr. 2:10]]), and Paul told the Gentile Galatians, “if ye be Christ’s, then are ye Abraham’s seed” ([[Gal. 3:29]]). One looks to Abraham and Sarah not only as ancestors but as the pattern of what covenant makes out of unpromising stone.
    sources: [bdb, lds-scriptures]
  - ref: 2
    phrase: for I called him alone, and blessed him, and increased him
    kind: words
    title: One man
    body: |
      “Alone” is *ʾeḥād*, “one.” The argument is from small to great. The exiles are few and discouraged, but Abraham was one man when he was called, and the Lord made him the root of a multitude. Hebrews puts it strongly: “Therefore sprang there even of one, and him as good as dead, so many as the stars of the sky” ([[Heb. 11:12]]).

      Ezekiel uses the same phrase, “Abraham was one,” for the opposite purpose. After word came that Jerusalem had fallen, the people left in the ruined land said: “Abraham was one, and he inherited the land: but we are many; the land is given us for inheritance” ([[Ezek. 33:21–24]]). Ezekiel rejected their claim and named their sins ([[Ezek. 33:25–26]]). Here the same fact is given to the discouraged as a reason for hope: their small numbers are no obstacle.

      The Book of Mormon text ends the verse at “blessed him” and lacks “and increased him” ([[2 Ne. 8:2]]). The difference is small and its cause is uncertain. The Masoretic Text has a final verb (*wĕʾarbēhû*, “and multiplied him”).
    sources: [bdb, delitzsch, oshb-wlc, lds-scriptures]
  - ref: 3
    phrase: he will make her wilderness like Eden, and her desert like the garden of the LORD
    kind: scripture
    title: Eden restored
    body: |
      Zion’s ruins will become Eden. The word “comfort” (*niḥam*) appears twice in the first line, recalling the opening of this division: “Comfort ye, comfort ye my people” ([[Isa. 40:1]]). Delitzsch hears the promise of 40:1 becoming “the comforting fact of fulfilment.”

      The logic runs from verse 2. The same God who turned one couple into a nation can turn a ruin into a garden. Ezekiel pictured the same reversal: “This land that was desolate is become like the garden of Eden” ([[Ezek. 36:35]]). The expected response is the sound of worship, “thanksgiving, and the voice of melody.”

      The promise reaches past the exiles’ return. Delitzsch reads the paradise of this verse as part of “the new world of righteousness and salvation,” and Latter-day scripture speaks of the same horizon: “the earth will be renewed and receive its paradisiacal glory” ([[A of F 1:10]]).
    sources: [delitzsch, lds-scriptures]
  - ref: 5
    phrase: mine arms shall judge the people; the isles shall wait upon me, and on mine arm shall they trust
    kind: words
    title: The arm of the Lord
    body: |
      The Lord’s “arm” (*zĕrôaʿ*) is the image of His power in action; Delitzsch calls the restoration of Zion “a work of the arm of Jehovah, i.e., of the manifestation of His might.” The Lord brought Israel out of Egypt “with an outstretched arm” ([[Deut. 26:8]]). In Isaiah 40–53 it becomes a thread. The Lord comes “and his arm shall rule for him” ([[Isa. 40:10]]). The arm is called on: “Awake… O arm of the LORD” (51:9). Then comes the announcement, “The LORD hath made bare his holy arm in the eyes of all the nations” ([[Isa. 52:10]]). And the fourth Servant Song opens with a question, “to whom is the arm of the LORD revealed?” ([[Isa. 53:1]]), and goes on to describe a servant who is despised and rejected. [The Arm of the Lord](/isaiah/themes/arm-of-the-lord/) follows the thread through the book.

      The Masoretic Text reads “my arms” (plural) in the first line and “my arm” (singular) in the second. The Book of Mormon has the singular both times, “mine arm shall judge the people” ([[2 Ne. 8:5]]), which makes the two lines match and fits the singular in verse 9. Delitzsch, working from the Hebrew, says that for the second line “the singular only was suitable.”

      Verses 4–5 also extend the scope of the promise. The “law” (*tôrâ*, “direction, instruction” in BDB) that goes out from God becomes “a light of the people,” and the distant “isles” wait for it. This picks up [[Isa. 2:3]] (“out of Zion shall go forth the law”), as Delitzsch notes, and the servant’s mission to be “a light to the Gentiles” ([[Isa. 49:6]]).
    sources: [bdb, delitzsch, oshb-wlc, lds-scriptures]
  - ref: 6
    phrase: the heavens shall vanish away like smoke, and the earth shall wax old like a garment
    kind: words
    title: Smoke, old clothes, and gnats
    body: |
      The most permanent things people can see, the sky and the earth, are temporary. The sky will disperse “like smoke”; the earth will wear out like clothing. [[Ps. 102:25–27]] uses the same image, and Hebrews applies that psalm to the Son: “they shall perish; but thou remainest; and they all shall wax old as doth a garment” ([[Heb. 1:11]]). Jesus said, “Heaven and earth shall pass away, but my words shall not pass away” ([[Matt. 24:35]]).

      The KJV’s “they that dwell therein shall die **in like manner**” translates *kĕmô-kēn*. The Septuagint reads it that way (“shall die in like manner”), and Delitzsch defends a sense close to it, “like so,” that is, like nothing. But BDB notes that *kēn* may instead be a noun for a gnat (or a louse; compare the plague of *kinnîm* in [[Ex. 8:16]]), calls the meaning “dubious,” and says most moderns take it as “gnat.” The NRSVUE reads “die like gnats,” with “in like manner” as its alternative. The gnat reading fits the pattern of the verse, which compares each thing to something flimsy: smoke, a worn garment, gnats. Either reading works; the gnat reading is sharper.

      Latter-day scripture speaks of the same end and renewal: “the heaven and the earth shall be consumed and pass away, and there shall be a new heaven and a new earth” ([[D&C 29:23]]). Against that horizon the Lord sets the only permanent thing: “my salvation shall be for ever.”
    sources: [bdb, delitzsch, lxx-rahlfs, nrsvue, lds-scriptures]
  - ref: 7
    phrase: the people in whose heart is my law; fear ye not the reproach of men, neither be ye afraid of their revilings
    kind: bom
    title: The law in the heart, and the finger-pointing
    body: |
      The Book of Mormon reads, “the people in whose heart **I have written** my law” ([[2 Ne. 8:7]]). That wording echoes the new covenant of Jeremiah: “I will put my law in their inward parts, and write it in their hearts” ([[Jer. 31:33]]). Paul described the Corinthian Saints as a letter “written not with ink, but with the Spirit of the living God; not in tables of stone, but in fleshy tables of the heart” ([[2 Cor. 3:3]]). Whether the Book of Mormon reading is original or an inspired clarification, it names the source of the people’s steadiness: God has written it into them.

      What threatens those people is not violence but contempt. “Reproach” (*ḥerpâ*) is a taunt or scorn cast on someone; “revilings” (*giddûpîm*) are reviling words (BDB). Lehi saw the same danger in his dream: people in a great and spacious building “were in the attitude of mocking and pointing their fingers” at those eating the fruit, and some “were ashamed” and fell away ([[1 Ne. 8:27–28]]). Nephi and his family made a different choice: “we heeded them not” ([[1 Ne. 8:33]]).

      Verse 8 gives the reason not to fear. The mockers are clothing for moths, the same image used for the servant’s accusers in [[Isa. 50:9]]. The scorn is loud, but it won’t last.
    sources: [bdb, lds-scriptures]
  - ref: 9
    phrase: Awake, awake, put on strength, O arm of the LORD
    kind: structure
    title: Three wake-up calls
    body: |
      The imperative is *ʿûrî ʿûrî*, “wake up, wake up,” a feminine singular form that agrees with *zĕrôaʿ*, “arm,” which BDB lists as a feminine noun. It is a bold prayer; Delitzsch notes that the church calls to the arm three times, “Awake.” The Psalms use similar language: “Awake, why sleepest thou, O Lord?” ([[Ps. 44:23]]). The people feel that God has been inactive, and they ask Him to act as He did “in the ancient days.”

      The Lord responds with a doubled command of His own, and He turns it back on them: “Awake, awake, stand up, O Jerusalem” (verse 17), and then “Awake, awake; put on thy strength, O Zion” ([[Isa. 52:1]]). The wording of 52:1 echoes this verse. The people asked God’s arm to put on strength. God tells Zion to put on *her* strength.

      The Restoration gives that command a specific meaning. Asked what Isaiah meant by “Put on thy strength, O Zion,” the Lord told Joseph Smith that “to put on her strength is to put on the authority of the priesthood, which she, Zion, has a right to by lineage; also to return to that power which she had lost” ([[D&C 113:8]]). Read with that answer in mind, this chapter describes a two-sided waking. The people ask for God’s power to be shown. God answers by restoring His power to His people.
    sources: [bdb, delitzsch, oshb-wlc, lds-scriptures]
  - ref: 9
    phrase: Art thou not it that hath cut Rahab, and wounded the dragon?
    kind: history
    title: Rahab and the dragon
    body: |
      This Rahab is not the woman of Jericho, the only Rahab the *Bible Dictionary* lists ([[Josh. 2:1]]); the names are different words in Hebrew (*rahab* here, which BDB glosses “storm, arrogance”; *rāḥāb* for the woman). This Rahab is a sea monster. The “dragon” (*tannîn*) is, in BDB’s words, a “serpent, dragon, sea-monster,” the same word used in [[Isa. 27:1]] beside Leviathan.

      Images like these are found across the ancient Near East and stood for the powers of chaos. The Old Testament knows the imagery and uses it for the Lord: “Thou hast broken Rahab in pieces, as one that is slain” ([[Ps. 89:10]]); “Thou didst divide the sea by thy strength: thou brakest the heads of the dragons in the waters” ([[Ps. 74:13]]). In [[Job 26:12]], the KJV’s “the proud” is *rahab*, which BDB lists there as the sea monster.

      Isaiah’s move is to bring the myth down into history. Verse 10 identifies the monster-slaying with a real event, drying the sea “for the ransomed to pass over,” which is the Exodus. BDB lists Rahab as an emblematic name for Egypt ([[Isa. 30:7]]; [[Ps. 87:4]]), and Delitzsch reads the dragon as Pharaoh in particular ([[Ezek. 29:3]]). On that reading the “monster” God defeated was Pharaoh’s empire and the “sea” He split was the Red Sea. The Lord doesn’t just win cosmic battles; He wins them in history, for a real people. The exiles in Babylon, beside another empire and other waters, are invited to expect the same.

      The Book of Mormon reads “Art thou not **he**” in verses 9 and 10 ([[2 Ne. 8:9–10]]), a personal pronoun for the arm. The change is small, but it fits the Lord’s answer in verse 12: “I, even I, am he.” Jacob, having read these verses to his people, named the monster the Lord ultimately defeats: “that awful monster, death and hell” ([[2 Ne. 9:10]]; see the note on [[Isa. 27:1]]).
    sources: [bd-rahab, bdb, delitzsch, oshb-wlc, sc-knowhy-34, lds-scriptures]
  - ref: 11
    phrase: Therefore the redeemed of the LORD shall return, and come with singing unto Zion
    kind: history
    title: Songs of everlasting joy
    body: |
      This verse is nearly identical to [[Isa. 35:10]]; Delitzsch counts one small difference in form, and otherwise the two passages are “word for word the same.” The repetition ties the return from exile into a single theme across the book.

      Two words for rescue frame the verse. The “ransomed” of verse 10 are *gĕʾûlîm*, from *gāʾal*, the verb for a kinsman who buys back a relative from slavery (compare [[Lev. 25:47–49]]). The “redeemed” here are *pĕdûyîm*, from *pādâ*, to pay a ransom. The Lord has done both.

      The Book of Mormon adds a word: “everlasting joy **and holiness** shall be upon their heads” ([[2 Ne. 8:11]]). The return is a moral as well as a geographic one. Latter-day scripture uses the verse’s language for the latter-day gathering: the righteous “shall come to Zion, singing with songs of everlasting joy” ([[D&C 45:71]]), and the scattered Saints will “return, and come to their inheritances, they and their children, with songs of everlasting joy” ([[D&C 101:18]]).
    sources: [delitzsch, bdb, oshb-wlc, lds-scriptures]
  - ref: 12
    phrase: who art thou, that thou shouldest be afraid of a man that shall die
    kind: words
    title: Afraid of a man that shall die
    body: |
      The Lord’s answer to “Awake” begins with an emphatic doubled pronoun: *ʾānōkî ʾānōkî hûʾ*, “I, I am He.” The Book of Mormon makes the doubling even stronger: “I am he; yea, I am he that comforteth you” ([[2 Ne. 8:12]]). “I am He” is a recurring formula in these chapters ([[Isa. 43:10]]; [[Isa. 43:25]]; [[Isa. 48:12]]), and Jesus uses the same words: “if ye believe not that I am he, ye shall die in your sins” ([[John 8:24]]).

      Then comes the question: who are you to fear a mortal? The oppressor “shall be made as grass,” the image of [[Isa. 40:6–8]]. The real problem, verse 13 says, is not the size of the threat but a lapse of memory: you “forgettest the LORD thy maker.” Fear of man grows when the memory of God shrinks. And the Lord asks, almost dryly, “where is the fury of the oppressor?” Delitzsch takes the question as looking ahead: “There is not a trace of him to be seen.”

      The Lord rebuked the young Joseph Smith for exactly this fear after the loss of the manuscript: “you should not have feared man more than God” ([[D&C 3:7]]). Years later, in Liberty Jail, He told him, “fear not what man can do, for God shall be with you forever and ever” ([[D&C 122:9]]).

      Verse 14 is one of the more obscure verses in the chapter. “The captive exile” translates *ṣōʿeh*, which BDB glosses “one stooping (under a burden)” and notes that some would emend to “marching.” Delitzsch takes it as an exile bent in fetters in Babylon. The sense seems to be that release is coming soon, before he dies in the pit.
    sources: [delitzsch, bdb, oshb-wlc, lds-scriptures]
  - ref: 16
    phrase: I have put my words in thy mouth, and I have covered thee in the shadow of mine hand
    kind: christ
    title: In the shadow of His hand
    body: |
      Who is “thee”? The context suggests Israel, but the language is the language of the servant, who said, “in the shadow of his hand hath he hid me” ([[Isa. 49:2]]). It is also the language of prophetic calling. The Lord promised to raise up a prophet like Moses and “put my words in his mouth” ([[Deut. 18:18]]). He hid Moses in a cleft of the rock and said He would “cover thee with my hand while I pass by” ([[Ex. 33:22]]). Isaiah uses the same phrase again in [[Isa. 59:21]] to describe a covenant with Israel: “my words which I have put in thy mouth, shall not depart out of thy mouth.”

      The ambiguity may be deliberate. Israel was called to carry God’s words, and the servant of the Songs does what Israel did not ([[Isa. 50:5]]). Jesus said, “the word which ye hear is not mine, but the Father’s which sent me” ([[John 14:24]]); He is the one who speaks only what is put in His mouth, and through Him a people come to share that calling.

      The purpose clause is enormous: “that I may plant the heavens, and lay the foundations of the earth, and say unto Zion, Thou art my people.” Carrying God’s word is connected to creation itself, and the goal of creating is a people. Delitzsch stresses that the planter, founder, and speaker here is the Lord, not Israel, and that the “new creation of the world” and the “restoration of Israel to favour” are both His work.
    sources: [delitzsch, lds-scriptures]
  - ref: 17
    phrase: which hast drunk at the hand of the LORD the cup of his fury
    kind: symbol
    title: The cup of staggering
    body: |
      Jerusalem lies in the street like someone who has drunk herself unconscious. The image of God’s judgment as a cup that nations are forced to drink appears throughout the prophets: “Take the wine cup of this fury at my hand, and cause all the nations… to drink it” ([[Jer. 25:15]]); “in the hand of the LORD there is a cup… all the wicked of the earth shall wring them out, and drink them” ([[Ps. 75:8]]). Revelation uses it for the last judgment: “the wine of the wrath of God” ([[Rev. 14:10]]).

      “The cup of trembling” is *kôs hattarʿēlâ*, the cup of reeling (BDB) or staggering. The word translated “dregs,” *qubbaʿat*, is rare, which BDB glosses “cup.” Jerusalem has drained the goblet, and she has done it at “the hand of the LORD.” Isaiah doesn’t soften it: the exile was God’s judgment.

      Then comes one of the saddest details in the chapter. A drunk person needs someone to take her home. But “there is none to guide her among all the sons whom she hath brought forth” (verse 18). Her children are lying in the streets too (verse 20), caught “as a wild bull in a net” (*tôʾ*, which BDB glosses “antelope,” and Delitzsch takes as one caught in a hunter’s net). A generation that should have supported her is as helpless as she is.
    sources: [bdb, delitzsch, lds-scriptures]
  - ref: 19
    phrase: These two things are come unto thee
    kind: bom
    title: '“These two sons”'
    body: |
      Here the Book of Mormon differs in a way that changes the meaning. In the KJV, the “two things” are two pairs of disasters: “desolation, and destruction, and the famine, and the sword.” The Hebrew has “two” (*šĕtayim*) followed by four disasters; Delitzsch takes them as two kinds of evil, devastation and ruin for the land, famine and sword for its people. The Book of Mormon reads:

      > These two **sons** are come unto thee, who shall be sorry for thee—thy desolation and destruction, and the famine and the sword… Thy sons have fainted, **save these two** ([[2 Ne. 8:19–20]]).

      In this reading, amid Jerusalem’s disasters, two of her sons come to her, and they alone have not collapsed. They are the ones who will “be sorry for” her, that is, show her compassion, and perhaps take her by the hand, which verse 18 says none of her sons would do.

      The text doesn’t say who the two sons are. One possible connection is with the two witnesses of [[Rev. 11:3–12]], who prophesy in Jerusalem, are killed, and lie in its street before being raised. Latter-day revelation identifies those witnesses as “two prophets that are to be raised up to the Jewish nation in the last days, at the time of the restoration” ([[D&C 77:15]]). The shared images (two figures, Jerusalem, bodies in the street) invite the comparison, but it is an inference from those images, not a revealed identification.
    sources: [delitzsch, oshb-wlc, lds-scriptures]
  - ref: 22
    phrase: Behold, I have taken out of thine hand the cup of trembling
    kind: christ
    title: The cup taken away
    body: |
      The Lord who handed Jerusalem the cup now takes it away. He speaks as the God “that pleadeth the cause of his people,” using the verb *yārîb*, which Delitzsch glosses as “their advocate or defender”; the same root appears in the servant’s courtroom in [[Isa. 50:8]]. The judge has become the defense attorney. And the cup doesn’t just disappear. It goes to someone else: “I will put it into the hand of them that afflict thee” (verse 23).

      The Gospels use the image of a cup too. They describe Jesus in Gethsemane praying, “O my Father, if it be possible, let this cup pass from me” ([[Matt. 26:39]]), and then accepting it: “the cup which my Father hath given me, shall I not drink it?” ([[John 18:11]]). The first words of the risen Lord to the Nephites were, “I have drunk out of that bitter cup which the Father hath given me” ([[3 Ne. 11:11]]). In latter-day revelation He describes what that cost: suffering that caused Him “to tremble because of pain, and to bleed at every pore… and would that I might not drink the bitter cup, and shrink” ([[D&C 19:18]]).

      Isaiah does not say that the servant drinks Jerusalem’s cup; in verse 23 the cup passes to the oppressors. The connection to Christ comes from reading the chapter with the fourth Servant Song that follows, where the servant bears “the iniquity of us all” ([[Isa. 53:6]]). And the English overlap between the “cup of trembling” and the Savior who trembled is an echo in translation: the Hebrew word means “reeling” (BDB), not trembling. What the passages share is the picture itself: here a cup is taken out of Jerusalem’s hand, and in the Gospels the Savior drinks the cup the Father gave Him. [The Cup of the Lord’s Fury](/jeremiah/themes/cup-of-fury/) follows the cup through Jeremiah.
    sources: [delitzsch, bdb, oshb-wlc, lds-scriptures]

christ: |
  The chapter is built around a question and an answer. The people ask the Lord’s arm to wake up and put on strength. The Lord answers, “I, even I, am he that comforteth you,” and then does something they didn’t ask for: He takes the cup of wrath out of Jerusalem’s hand.

  For Latter-day Saints, both halves point to Jesus Christ. The arm of the Lord is about to be revealed, and in chapter 53 it turns out to be a man of sorrows ([[Isa. 53:1–3]]). The cup taken from Jerusalem is the kind of cup He prayed would pass and then drank to the dregs: “I have drunk out of that bitter cup which the Father hath given me” ([[3 Ne. 11:11]]). The comfort of this chapter is not that judgment stops mattering. It is that someone else takes the cup out of our hands.

explore: |
  - **The three “awakes.”** Read [[Isa. 51:9–11]], [[Isa. 51:17–23]], and [[Isa. 52:1–2]] together, then [[D&C 113:7–10]].
  - **The arm of the Lord.** Trace it through [[Isa. 40:10]], [[Isa. 51:5–9]], [[Isa. 52:10]], and [[Isa. 53:1]].
  - **The sea monster.** Compare verse 9 with [[Ps. 74:12–17]], [[Ps. 89:9–10]], [[Job 26:12–13]], and [[Isa. 27:1]].
  - **The cup.** Read [[Jer. 25:15–29]], [[Matt. 26:36–46]], [[3 Ne. 11:10–11]], and [[D&C 19:16–19]].
  - **Jacob’s text.** Compare the chapter verse by verse with [[2 Ne. 8]], especially verses 7, 11, 12, and 19–20.

parallels:
  - ref: 2 Ne. 8
    note: Jacob reads the whole chapter, and continues through 52:1–2, with many variants, including “these two sons.”
    primary: true
  - ref: Isa. 35:10
    note: Verse 11 is nearly identical.
  - ref: D&C 113:7–10
    note: The Lord explains the related “Awake, awake” of 52:1–2.
  - ref: Rev. 11:3–12
    note: Two witnesses in Jerusalem, one possible echo of the “two sons” of the Book of Mormon text.
  - ref: 1 Ne. 8:26–33
    note: The mockers in the great and spacious building.
  - ref: Matt. 26:39
    note: The Savior accepts the cup.

