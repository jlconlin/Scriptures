chapter: 62
title: A New Name
tagline: Someone refuses to be silent until Zion shines; the city once called Forsaken is renamed My Delight and Married, watchmen are posted to give the Lord no rest, and the highway is opened for the coming of salvation.
when: 'Setting: the community in Judah, late sixth century BC; echoed at the Triumphal Entry, AD 30'

setting: |
  Chapter 62 closes the three central chapters of Isaiah’s last division (60–62). Chapter 60 described Zion’s light; chapter 61 the anointed messenger and his work; this chapter is about Zion’s identity. Its key device is renaming. Zion has been called “Forsaken” and “Desolate”; she will be called “My delight is in her” and “Married,” “Sought out” and “A city not forsaken.”

  The speaker at the beginning is not identified. It may be the anointed one of 61:1, continuing his mission, or the prophet, or the Lord Himself. The Hebrew verb for “hold my peace” is the one the Lord used for His own silence ([[Isa. 57:11]]; [[Isa. 64:12]]; [[Isa. 65:6]]), so the voice may be the Lord announcing that the time of silence is over. Either reading makes good sense.

  The chapter reuses images from all over the book: the watchmen (52:8, 56:10), the highway (40:3, 57:14), the standard (11:12, 49:22), the reward that comes with the Lord (40:10), and the bride (49:18, 54:5–6, 61:10). Matthew heard verse 11 in the Triumphal Entry ([[Matt. 21:5]]).

thread: |
  Isaiah 62 is about **names**, and about persistence until the names come true.

  Zion’s old names described her condition: *ʿăzûbâ*, “Forsaken,” and *šəmāmâ*, “Desolate” (verse 4). Her new names describe the Lord’s feelings toward her: “Hephzibah” (my delight is in her) and “Beulah” (married). The Lord Himself will give them (verse 2), and by the end of the chapter her people will be called “The holy people, The redeemed of the LORD,” and the city, “Sought out, A city not forsaken” (verse 12).

  But the names are a promise, not yet a fact. So the chapter is full of people who will not be quiet. The speaker of verse 1 “will not hold my peace… until.” The watchmen on the walls “shall never hold their peace day nor night” (verse 6). They are told to “give him no rest, till he establish” Jerusalem (verse 7). The chapter shows what to do with a promise that has not yet been fulfilled: keep praying it back to the one who made it until it is.

sections:
  - range: 1-5
    heading: Zion’s new names
    plain: |
      For Zion’s sake I will not keep silent, and for Jerusalem’s sake I will not rest, until her righteousness shines out like the dawn and her salvation like a blazing torch. The nations will see your righteousness, and all kings your glory. You will be called by a new name that the Lord Himself will give. You will be a glorious crown in the Lord’s hand, a royal diadem in the palm of your God. No longer will you be called Forsaken, or your land called Desolate. Instead you will be called My Delight Is in Her, and your land Married, for the Lord delights in you, and your land will be married. As a young man marries a young woman, so your sons (or, your Builder) will marry you; as a bridegroom rejoices over his bride, so your God will rejoice over you.
  - range: 6-9
    heading: Watchmen who give Him no rest
    plain: |
      I have posted watchmen on your walls, Jerusalem; they will never be silent, day or night. You who call on the Lord, take no rest for yourselves, and give Him no rest until He establishes Jerusalem and makes her the praise of the earth. The Lord has sworn by His right hand and His mighty arm: “Never again will I give your grain as food to your enemies, and never again will foreigners drink the new wine you worked for. Those who harvest it will eat it and praise the Lord, and those who gather the grapes will drink the wine in the courts of My sanctuary.”
  - range: 10-12
    heading: Prepare the way
    plain: |
      Go through, go through the gates! Prepare the way for the people. Build up, build up the highway! Clear away the stones. Raise a banner for the nations. The Lord has proclaimed to the ends of the earth: “Say to Daughter Zion, ‘Look, your Savior comes! His reward is with Him, and His recompense goes before Him.’” They will be called the Holy People, the Redeemed of the Lord; and you will be called Sought Out, the City No Longer Forsaken.

notes:
  - ref: 1
    phrase: For Zion’s sake will I not hold my peace
    kind: words
    title: I will not hold my peace
    body: |
      Silence has been a theme of these chapters. The Lord asked the idolaters, “have not I held my peace even of old, and thou fearest me not?” ([[Isa. 57:11]]). Soon the people will ask Him, “wilt thou hold thy peace, and afflict us very sore?” ([[Isa. 64:12]]). The verb in all three places is *ḥāšâ*, to be still or silent.

      If the speaker here is the Lord, the verse is His answer to that complaint before it is even made: the silence is ending, and He will not rest until Zion’s righteousness “go forth as brightness, and the salvation thereof as a lamp that burneth.” If the speaker is the prophet or the anointed one of chapter 61, the verse is a vow of persistent intercession: he will keep speaking to God on Zion’s behalf until she shines. The verse works either way, and the rest of the chapter needs both: a God who has decided to act, and servants who will not stop asking Him to.

      The images of verse 1 continue chapter 60. There Zion’s light came from the Lord rising on her ([[Isa. 60:1]]). Here her own righteousness and salvation blaze out like dawn and a torch, visible to the nations (verse 2).
    sources: [mt-sefaria]
  - ref: 2
    phrase: thou shalt be called by a new name, which the mouth of the LORD shall name
    kind: scripture
    title: A new name from the Lord’s mouth
    body: |
      In the Bible, a new name given by God marks a new identity and a covenant. Abram became Abraham when the Lord promised to make him “a father of many nations” ([[Gen. 17:5]]). Jacob became Israel after wrestling through the night: “Thy name shall be called no more Jacob, but Israel” ([[Gen. 32:28]]). A name given by God is not a label; it describes what He is making the person into.

      Zion’s new name comes “from the mouth of the LORD,” and the next verses give several: Hephzibah, Beulah, Sought Out. The New Testament carries the promise to individuals. The risen Christ promises the one who overcomes “a new name written, which no man knoweth saving he that receiveth it” ([[Rev. 2:17]]), and He will write on him “the name of the city of my God, which is new Jerusalem” ([[Rev. 3:12]]). Latter-day revelation connects the white stone and new name with the celestial kingdom ([[D&C 130:11]]).

      In the Book of Mormon, King Benjamin’s people received a new name by covenant, the name of Christ: “ye shall be called the children of Christ, his sons, and his daughters” ([[Mosiah 5:7]]). Verse 3 adds how the Lord regards the renamed people: they are “a crown of glory in the hand of the LORD.” The crown is not on His head but in His hand, held and admired, like a treasure He has made.
  - ref: 4
    phrase: but thou shalt be called Hephzi-bah, and thy land Beulah
    kind: words
    title: Hephzibah and Beulah
    body: |
      “Forsaken” is *ʿăzûbâ*. “Hephzibah,” *ḥepṣî-bāh*, means “my delight is in her.” It was the name of the mother of Manasseh ([[2 Kgs. 21:1]]).

      “Beulah,” *bəʿûlâ*, means “married.” The land, once “Desolate,” is married. Isaiah has used this picture before: the Lord as the husband who takes back His abandoned wife ([[Isa. 54:5–7]]). Here the marriage is complete.

      Notice the reason given: “for the LORD delighteth (*ḥāpēṣ*) in thee.” It is the same root as “Hephzibah.” The new name is simply a statement of how the Lord feels about her. In chapter 58 the people were rebuked for pursuing their own *ḥēpeṣ*, their own pleasure ([[Isa. 58:3]]; [[Isa. 58:13]]). Here the Lord’s *ḥēpeṣ*, His delight, is Zion herself.
    sources: [mt-sefaria, bdb, bd-hephzibah, bd-beulah]
  - ref: 5
    phrase: so shall thy sons marry thee
    kind: words
    title: Your sons, or your Builder?
    body: |
      “So shall thy sons marry thee” is an odd image: sons marrying their mother. The Hebrew consonants are *bnyk*. The traditional vowels read them *bānayik*, “your sons.” But the same letters can be read *bōnayik*, “your builder,” and modern translations such as the NRSVUE and NIV take it that way: “as a young man marries a young woman, so shall your Builder marry you.” The next line supports it: “as the bridegroom rejoiceth over the bride, so shall thy God rejoice over thee.” The Builder is God. The psalmist gave Him the title: “The LORD doth build up Jerusalem: he gathereth together the outcasts of Israel” ([[Ps. 147:2]]).

      Whichever reading is original, the last line is clear. God rejoices over Zion as a bridegroom over his bride. Zephaniah used the same picture: the Lord “will rejoice over thee with joy; he will rest in his love, he will joy over thee with singing” ([[Zeph. 3:17]]). The God of Isaiah is not a reluctant rescuer. He is glad.
    sources: [mt-sefaria, nrsvue, niv]
  - ref: 6
    phrase: ye that make mention of the LORD, keep not silence
    kind: words
    title: Give Him no rest
    body: |
      In chapter 56, Israel’s watchmen were blind and asleep, guard dogs that could not bark ([[Isa. 56:10]]). Here the Lord sets new watchmen on the walls, and they “shall never hold their peace day nor night.” Their job is not only to watch for enemies. They are “ye that make mention of the LORD” (*hammazkîrîm*), literally “the remembrancers,” people whose task is to remind. The *mazkîr* at the royal court was the official who kept the king informed ([[2 Sam. 8:16]], “recorder”). These watchmen remind God of His promises.

      And they are told to be relentless: “keep not silence, and give him no rest, till he establish, and till he make Jerusalem a praise in the earth.” It is a remarkable instruction. The Lord asks to be pestered. Jesus taught the same with a parable of a widow who kept coming to an unjust judge until he gave in, told so that people would know “that men ought always to pray, and not to faint” ([[Luke 18:1–8]]).

      The Lord applied that parable to the Saints in 1833, after they were driven from Jackson County, Missouri: “Now, unto what shall I liken the children of Zion? I will liken them unto the parable of the woman and the unjust judge” ([[D&C 101:81]]). The latter-day Zion, like Isaiah’s, was a promise not yet fulfilled, and the Lord’s counsel was the same: keep asking.
    sources: [mt-sefaria, bdb, dc-101-heading]
  - ref: 8
    phrase: Surely I will no more give thy corn to be meat for thine enemies
    kind: history
    title: Eating what you planted
    body: |
      For a farming people, the worst curse was to work a whole season and watch someone else eat the harvest. The covenant curses in Deuteronomy included exactly that: “thou shalt plant a vineyard, and shalt not gather the grapes thereof” and “The fruit of thy land, and all thy labours, shall a nation which thou knowest not eat up” ([[Deut. 28:30]]; [[Deut. 28:33]]). After the return, Nehemiah heard the people complain that their fields and vineyards were mortgaged to pay the Persian king’s tax ([[Neh. 5:3–4]]).

      Here the Lord swears, “by his right hand, and by the arm of his strength,” that the curse is lifted. Those who harvest will eat, and they will eat “in the courts of my holiness,” as the law directed for the festival tithe, eaten in joy before the Lord at the sanctuary ([[Deut. 14:22–26]]). Work will be rewarded, and the reward will become worship. Chapter 65 repeats the promise: “They shall not build, and another inhabit; they shall not plant, and another eat” ([[Isa. 65:22]]).
  - ref: 10
    phrase: cast up, cast up the highway; gather out the stones; lift up a standard for the people
    kind: symbol
    title: The last highway
    body: |
      The highway is one of Isaiah’s great images, and this is its last appearance. In chapter 11 the Lord promised “an highway for the remnant of his people” from Assyria ([[Isa. 11:16]]). In chapter 35 it was “The way of holiness” ([[Isa. 35:8]]). In chapter 40 a voice cried, “Prepare ye the way of the LORD” ([[Isa. 40:3]]). In chapter 57 the obstacles on the road were the people’s sins ([[Isa. 57:14]]). Here the command is doubled for urgency: “Go through, go through… cast up, cast up… gather out the stones.”

      “Lift up a standard for the people” recalls the ensign of [[Isa. 11:12]] and [[Isa. 49:22]], the banner raised so the scattered can find their way home. Latter-day revelation connects the ensign with the restored gospel: the Lord sent His “everlasting covenant into the world, to be a light to the world, and to be a standard for my people, and for the Gentiles to seek to it” ([[D&C 45:9]]).

  - ref: 11
    phrase: Say ye to the daughter of Zion, Behold, thy salvation cometh; behold, his reward is with him, and his work before him
    kind: christ
    title: Tell the daughter of Zion
    body: |
      When Jesus rode into Jerusalem on a donkey, Matthew explained the event with a quotation that combines two prophets: “Tell ye the daughter of Sion, Behold, thy King cometh unto thee, meek, and sitting upon an ass” ([[Matt. 21:5]]). Most of it comes from Zechariah: “Rejoice greatly, O daughter of Zion… behold, thy King cometh unto thee” ([[Zech. 9:9]]). But the opening words, “Tell ye the daughter of Sion,” are from this verse. Matthew heard Isaiah’s announcement of salvation and Zechariah’s humble king as the same event.

      “Thy salvation cometh” translates *yišʿēk bāʾ*, and the word for salvation, *yešaʿ*, shares its root with the name *Yēšûaʿ* (Joshua), which the lexicon explains as “the LORD is salvation” and of which “Jesus” is the Greek form: “thou shalt call his name JESUS: for he shall save his people from their sins” ([[Matt. 1:21]]). The pronoun that follows is personal: “his reward is with him.” Salvation is not an abstract event; it is a person who comes.

      The second half repeats [[Isa. 40:10]] exactly, so this line ties the beginning of chapters 40–66 to their center. The final chapter of the Bible uses it for the Second Coming: “behold, I come quickly; and my reward is with me, to give every man according as his work shall be” ([[Rev. 22:12]]).
    sources: [mt-sefaria, bdb, bd-jesus]
  - ref: 12
    phrase: 'and thou shalt be called, Sought out, A city not forsaken'
    kind: words
    title: Sought out
    body: |
      The chapter ends with four more names. The people are “The holy people” (compare [[Ex. 19:6]]) and “The redeemed of the LORD.” The city is “A city not forsaken,” the reversal of the name “Forsaken” in verse 4. And she is “Sought out,” *dərûšâ*, a passive form of the verb “to seek.” She is the one who is looked for.

      Zion is not the one doing the seeking. Earlier in the book, the people were told to “Seek ye the LORD while he may be found” ([[Isa. 55:6]]), and that remains true. But her final name says that the Lord is seeking her. Ezekiel pictured the Lord as a shepherd who says, “I, even I, will both search my sheep, and seek them out” ([[Ezek. 34:11]]). Jesus described His own mission the same way: “For the Son of man is come to seek and to save that which was lost” ([[Luke 19:10]]).

    sources: [mt-sefaria, bdb]

christ: |
  The chapter’s center is the announcement “Behold, thy salvation cometh; behold, his reward is with him” (verse 11). Matthew heard it when Jesus rode into Jerusalem ([[Matt. 21:5]]), and Revelation hears it in His Second Coming ([[Rev. 22:12]]). He is the Bridegroom who rejoices over His bride, the Builder who rebuilds Jerusalem, and the Shepherd who seeks until He finds. The new name the Lord gives His people is His own name: “ye shall be called the children of Christ” ([[Mosiah 5:7]]).

explore: |
  - **New names.** Read [[Gen. 17:1–8]], [[Gen. 32:24–30]], [[Mosiah 5:7–12]], and [[Rev. 2:17]].
  - **Persistent prayer.** Read [[Isa. 62:6–7]] with [[Luke 18:1–8]] and [[D&C 101:81–92]].
  - **Zion as a bride.** Read [[Isa. 54:4–8]], [[Isa. 61:10]], [[Isa. 62:4–5]], and [[Rev. 21:2]].
  - **The highway.** Trace it through [[Isa. 11:16]], [[Isa. 35:8–10]], [[Isa. 40:3–5]], [[Isa. 57:14]], and [[Isa. 62:10]].

parallels:
