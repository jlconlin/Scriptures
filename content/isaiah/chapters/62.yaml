    note: Matthew combines verse 11 with Zech. 9:9 at the Triumphal Entry.
  - ref: Rev. 22:12
    note: “My reward is with me,” at the Second Coming; compare verse 11.
  - ref: D&C 101:81
    note: The Lord tells the Saints to importune Him, like the widow in the parable.

