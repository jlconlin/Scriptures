chapter: 54
title: Enlarge the Place of Thy Tent
tagline: The childless woman is told to sing and make room for more children than she can house, the abandoned wife is taken back with a promise as sure as the one made to Noah, and the storm-battered city is rebuilt in jewels.
when: 'Addressed to the exiles, c. 540 BC; quoted in full by the risen Savior, AD 34'

setting: |
  After the fourth [Servant Song](/isaiah/themes/servant-songs/#song-4), the focus returns to Zion, the woman of chapters 49–52: the bereaved mother, the divorced wife, the captive daughter. The chapter answers each of those images in turn. The barren woman will have more children than she can house (verses 1–3). The forsaken wife will be taken back for good (verses 4–10). The city “tossed with tempest” will be rebuilt in jewels, and no weapon will prevail against her (verses 11–17).

  The risen Savior quoted the whole chapter to the Nephites at the close of His prophecy of the latter-day gathering, introducing it with “And then shall that which is written come to pass” ([[3 Ne. 22:1]]). He then commanded them to search Isaiah, “for great are the words of Isaiah” ([[3 Ne. 23:1]]). His text differs from the King James Version only in small ways.

thread: |
  Isaiah 54 is about **what the servant’s suffering produces: a family**.

  The chapter before ended with a startling promise about a servant who dies childless: “he shall see his seed” ([[Isa. 53:10]]). Chapter 54 opens with a childless woman told to sing, because “more are the children of the desolate than the children of the married wife.” Her tent is too small for them. Her “seed” will spread to the right and the left (verse 3). Her children will all be “taught of the LORD” (verse 13).

  Every image in the chapter is a relationship restored. A mother receives children she never bore. A wife her husband sent away “for a small moment” is taken back “with everlasting kindness.” A ruined city is rebuilt by the one who let it fall. And the chapter ends with a word that has not appeared before in this part of Isaiah: not the servant, but “the servants of the LORD” (verse 17). From here to the end of the book the servant is never singular again. The one servant has become many.

sections:
  - range: 1-3
    heading: Sing, O barren
    plain: |
      Sing, you who never had a child! Break into song and shout, you who never went into labor, because the deserted woman will have more children than the woman who has a husband, says the Lord. Make the place of your tent larger. Stretch out your tent curtains; don’t hold back. Lengthen your ropes and drive your stakes in deep, because you will spread out to the right and to the left. Your descendants will take possession of nations and fill the deserted cities.
  - range: 4-10
    heading: Your Maker is your husband
    plain: |
      Don’t be afraid; you will not be shamed. Don’t be embarrassed; you will not be disgraced. You will forget the shame of your youth and no longer remember the disgrace of your widowhood. For your Maker is your husband; the Lord of Hosts is His name. The Holy One of Israel is your Redeemer; He is called the God of the whole earth. The Lord has called you back like a wife who was deserted and heartbroken, like a young bride who was rejected, says your God. For a brief moment I left you, but with great compassion I will bring you back. In a surge of anger I hid My face from you for a moment, but with everlasting love I will have mercy on you, says the Lord your Redeemer. To Me this is like the days of Noah: just as I swore that the waters of Noah would never again cover the earth, so I have sworn that I will not be angry with you or rebuke you. The mountains may move and the hills shake, but My love will not leave you, and My covenant of peace will not be shaken, says the Lord, who has compassion on you.
  - range: 11-17
    heading: A city of jewels
    plain: |
      You afflicted city, battered by storms and not comforted: I will set your stones in colored mortar and lay your foundations with sapphires. I will make your towers of rubies, your gates of sparkling stones, and all your walls of precious stones. All your children will be taught by the Lord, and great will be their peace. You will be established in righteousness. You will be far from oppression and have nothing to fear, far from terror, for it will not come near you. If anyone attacks you, it will not be My doing; whoever attacks you will fall because of you. I created the blacksmith who fans the coals and forges a weapon for its work, and I created the destroyer who wields it. No weapon forged against you will succeed, and you will refute every tongue that accuses you. This is the inheritance of the servants of the Lord, and their vindication comes from Me, says the Lord.

notes:
  - ref: 1
    phrase: Sing, O barren, thou that didst not bear
    kind: symbol
    title: The barren woman
    body: |
      The childless woman is one of scripture’s most persistent images of hope. Israel’s story begins with barren women who became mothers by God’s intervention: Sarah, “that bare you” ([[Isa. 51:2]]), Rebekah, Rachel, and later Hannah, who sang, “the barren hath born seven” ([[1 Sam. 2:5]]). Each birth showed that Israel’s future depended on God, not on human strength.

      Here the barren woman is Zion herself, emptied by exile. The promise is not only that she will have children, but that she will have more than “the married wife,” more than she had before she was abandoned. The next verse tells her to plan for them.

      The New Testament applies the verse to the Church. Paul quotes it after contrasting the earthly Jerusalem with “Jerusalem which is above… the mother of us all”: “Rejoice, thou barren that bearest not… for the desolate hath many more children than she which hath an husband” ([[Gal. 4:26–27]]). The children of the barren woman are the believers, Jew and Gentile, born through the promise rather than by natural descent.
    sources: [oswalt, paul-40-66]
  - ref: 2
    phrase: 'Enlarge the place of thy tent, and let them stretch forth the curtains of thine habitations: spare not, lengthen thy cords, and strengthen thy stakes'
    kind: scripture
    title: Stakes of Zion
    body: |
      The image is a nomad’s tent, like the tents of the patriarchs and of Israel in the wilderness. To make room for more people, you add curtains, let out the ropes, and drive the stakes deeper so the larger tent will stand. Growth and stability go together: longer cords need stronger stakes.

      The Restoration took the image and made it the name of the Church’s basic regional unit. In 1833 the Lord told the Saints that when Zion itself was full, “then I have other places which I will appoint unto them, and they shall be called stakes, for the curtains or the strength of Zion” ([[D&C 101:21]]). He had already said that “Zion must increase in beauty, and in holiness; her borders must be enlarged; her stakes must be strengthened” ([[D&C 82:14]]). Every stake of the Church is, by name, a peg holding up Isaiah’s tent.

      Moroni used this verse, joined with [[Isa. 52:1–2]], in the last words of the Book of Mormon: “strengthen thy stakes and enlarge thy borders forever” ([[Moro. 10:31]]).
    sources: [gs-stake]
  - ref: 4
    phrase: thou shalt forget the shame of thy youth, and shalt not remember the reproach of thy widowhood any more
    kind: words
    title: The shame of youth and widowhood
    body: |
      Zion’s history is told as a woman’s life. “The shame of thy youth” probably refers to Israel’s early unfaithfulness, from the golden calf onward; Jeremiah and Ezekiel use the same picture of a young wife who strayed ([[Jer. 3:24–25]]). “The reproach of thy widowhood” is the exile, when Zion lived as though her husband were dead. A widow in ancient Israel was among the most vulnerable people in society, and the law repeatedly commanded that she be protected ([[Deut. 24:17]]).

      The promise is not that the past will be excused but that it will be forgotten, the way a person forgets an old humiliation once life has moved on.

      The Nephite text repeats a line: “thou shalt forget the shame of thy youth, and shalt not remember the reproach of thy youth, and shalt not remember the reproach of thy widowhood any more” ([[3 Ne. 22:4]]). The repetition could be for emphasis or could have come in through copying; there is no way to tell.
    sources: [oswalt, isaiah-in-bom]
  - ref: 5
    phrase: For thy Maker is thine husband
    kind: christ
    title: The Maker as husband
    body: |
      The prophets often describe the covenant between the Lord and Israel as a marriage. Hosea’s whole book is built on it: “I will betroth thee unto me for ever” ([[Hosea 2:19]]). Isaiah’s version here stacks up titles: the husband is the Maker, “the LORD of hosts,” the Redeemer, the Holy One of Israel, “the God of the whole earth.” The one who made Zion is the one who married her, and He has not stopped being either.

      “Redeemer” (*gōʾēl*) adds a family-law image. In Israel a *gōʾēl* was the near kinsman who bought back family land, freed a relative from slavery, or, in the book of Ruth, married the widow to preserve the family ([[Ruth 3:9–13]]). Zion is a widow, and her Redeemer is also her husband.

      The New Testament and latter-day revelation give the bridegroom a name. Jesus called Himself the bridegroom ([[Matt. 9:15]]); Revelation looks forward to “the marriage of the Lamb” ([[Rev. 19:7]]); and the Lord warned the latter-day Saints to prepare: “Behold and lo, the Bridegroom cometh; go ye out to meet him” ([[D&C 133:10]]). When the Savior recited this chapter to the Nephites, He was speaking of Himself.
    sources: [bdb, sc-knowhy-216]
  - ref: 7
    phrase: For a small moment have I forsaken thee; but with great mercies will I gather thee
    kind: words
    title: A small moment
    body: |
      Verses 7–8 balance two lengths of time. The forsaking lasted “a small moment”; the mercy is “everlasting.” The wrath was “a little wrath”; the kindness is permanent. The Lord does not deny that He hid His face. He puts it in proportion.

      “In a little wrath” translates an unusual phrase, *šeṣep qeṣep*, “a flood of wrath” or “a surge of anger.” The rare first word appears nowhere else in the Bible, and it seems to have been chosen partly for its rhyme with the second. The “kindness” that answers it is *ḥesed ʿôlām*, “everlasting covenant love,” the loyal love that keeps a covenant after the other party has broken it.

      From inside the moment, of course, it doesn’t feel small. In Liberty Jail, after months of confinement, Joseph Smith heard the same measure applied to his own suffering: “My son, peace be unto thy soul; thine adversity and thine afflictions shall be but a small moment” ([[D&C 121:7]]). The measure is God’s, not ours, and it is given as a promise, not as a dismissal of the pain.
    sources: [bdb, paul-40-66]
  - ref: 9
    phrase: for as I have sworn that the waters of Noah should no more go over the earth
    kind: scripture
    title: The oath to Noah and the return of Zion
    body: |
      After the Flood the Lord swore that “neither shall there any more be a flood to destroy the earth,” and set the rainbow in the cloud as a token ([[Gen. 9:11–13]]). Isaiah compares that oath to this one. The exile was Zion’s flood. It will not happen again, and the promise is as sure as the rainbow.

      The Joseph Smith Translation of Genesis makes the connection between Noah’s covenant and Zion explicit. In it the Lord says that when He sees the bow, He will “remember the everlasting covenant, which I made unto thy father Enoch; that, when men should keep all my commandments, Zion should again come on the earth, the city of Enoch which I have caught up unto myself” ([[JST, Gen. 9:21]]). The rainbow is a token not only that the earth will not be flooded again, but that Zion will return. Isaiah’s comparison of the Noah covenant with the Lord’s covenant with Zion fits that reading closely.

      The Nephite text of this verse lacks the final words “nor rebuke thee” ([[3 Ne. 22:9]]).
    sources: [matthews-plainer, isaiah-in-bom]
  - ref: 10
    phrase: For the mountains shall depart, and the hills be removed
    kind: scripture
    title: When the mountains departed
    body: |
      In the ancient world nothing seemed more permanent than mountains; Habakkuk called them “the everlasting mountains” ([[Hab. 3:6]]). The Lord says His kindness is more permanent still. The mountains may go, but “my kindness shall not depart from thee, neither shall the covenant of my peace be removed.”

      For the Nephites who heard the Savior quote this verse, the image was not hypothetical. Earlier that year, in the storm and earthquakes that preceded His coming, “in the place of the city there became a great mountain” ([[3 Ne. 8:10]]).
    sources: [sc-knowhy-216]
  - ref: 11
    phrase: I will lay thy stones with fair colours, and lay thy foundations with sapphires
    kind: symbol
    title: A city of jewels
    body: |
      “Fair colours” is *pûk*, the dark cosmetic powder used as eye paint (Jezebel “painted her face” with it, [[2 Kgs. 9:30]]). Here it is the mortar. The city’s stones will be set in eye-paint, as if the city itself were being made beautiful for her husband. The jewels that follow are hard to identify: *sappîr* was probably lapis lazuli, deep blue with gold flecks; the “agates” and “carbuncles” were bright red or sparkling stones.

      Sapphire has a history in scripture. Under the feet of the God of Israel on Sinai was “a paved work of a sapphire stone, and as it were the body of heaven in his clearness” ([[Ex. 24:10]]). A city founded on sapphire is built on the pavement of God’s own dwelling.

      John saw the fulfillment in the New Jerusalem, whose foundations “were garnished with all manner of precious stones. The first foundation was jasper; the second, sapphire” ([[Rev. 21:19]]). The afflicted city “tossed with tempest” becomes the holy city.
    sources: [bdb, paul-40-66]
  - ref: 13
    phrase: And all thy children shall be taught of the LORD
    kind: christ
    title: Taught of the Lord
    body: |
      “Taught of the LORD” is *limmûdê YHWH*, “disciples of the LORD.” It is the same word the servant used for himself: “the tongue of the learned,” that is, of a disciple, who is taught “morning by morning” ([[Isa. 50:4]]). The servant was the Lord’s disciple; now all of Zion’s children will be. It echoes the new covenant in Jeremiah: “they shall all know me, from the least of them unto the greatest” ([[Jer. 31:34]]).

      Jesus quoted this verse to explain who comes to Him: “It is written in the prophets, And they shall be all taught of God. Every man therefore that hath heard, and hath learned of the Father, cometh unto me” ([[John 6:45]]).

      Among the Nephites the promise was fulfilled literally. The risen Savior blessed their children one by one ([[3 Ne. 17:11–24]]), and later “he did teach and minister unto the children,” and “he did loose their tongues, and they did speak unto their fathers great and marvelous things, even greater than he had revealed unto the people” ([[3 Ne. 26:14]]).
    sources: [bdb, sc-knowhy-216]
  - ref: 17
    phrase: No weapon that is formed against thee shall prosper
    kind: history
    title: No weapon formed against thee
    body: |
      Zion’s enemies cannot win because the Lord made both their weapons and their warriors. He created “the smith that bloweth the coals in the fire,” who makes the weapon, and “the waster,” who uses it (verse 16). Both are His creatures, so neither can act outside His control. Zion’s safety rests not on her walls but on who made the weapons.

      The promise has two parts. No weapon will succeed, and every accusing tongue will be answered: Zion will win in court as well as in battle. The courtroom language recalls the servant’s confidence: “who will contend with me?… who is mine adversary?” ([[Isa. 50:8]]).

      Latter-day revelation applied the verse to the Church in its early, vulnerable years. When critics were attacking the Church in 1831, the Lord told Joseph Smith and Sidney Rigdon to answer them publicly and promised, “there is no weapon that is formed against you shall prosper” ([[D&C 71:9]]). At the dedication of the Kirtland Temple Joseph prayed for the Saints “that no weapon formed against them shall prosper” ([[D&C 109:25]]). The promise is to the covenant people as a whole; it has never meant that individual Saints would escape all harm.
  - ref: 17
    phrase: This is the heritage of the servants of the LORD
    kind: christ
    title: From servant to servants
    body: |
      “Servants,” in the plural, appears here for the first time in chapters 40–66. In chapters 41–53, “servant” occurs twenty times, always singular: sometimes Israel, sometimes the individual of the [Servant Songs](/isaiah/themes/servant-songs/). From this verse to the end of the book it occurs eleven times, always plural: “the servants of the LORD” ([[Isa. 56:6]]; [[Isa. 65:13–15]]; [[Isa. 66:14]]).

      The change follows directly from chapter 53. The servant who died childless “shall see his seed” ([[Isa. 53:10]]); his mission, to “justify many” ([[Isa. 53:11]]), produces many who share his name. Abinadi drew the same conclusion when he asked, “who shall be his seed?” and answered that they are those who believed the prophets, “for these are they whose sins he has borne” ([[Mosiah 15:11–12]]).

      Their “heritage” (*naḥălâ*) is the word for an inherited portion of the promised land. Their “righteousness,” or vindication, “is of me, saith the LORD.” The servants inherit what the servant won.
    sources: [blenkinsopp, oswalt]

christ: |
  Chapter 54 is what chapter 53 makes possible. The servant was “cut off out of the land of the living” without children, yet “he shall see his seed.” Here those children arrive: a barren woman with more children than she can house, all of them “taught of the LORD,” and at the end a new name for them, “the servants of the LORD.”

  The Savior made the connection Himself. After teaching the Nephites about the gathering of Israel, He recited this chapter to them, promising a restored marriage, a covenant of peace that would outlast the mountains, and children taught by the Lord. He had already blessed their children one by one ([[3 Ne. 17:21–24]]), and later He taught those children Himself and loosed their tongues ([[3 Ne. 26:14]]). The one who calls Himself Zion’s husband and Redeemer ([[Isa. 54:5]]) is Jesus Christ.

liken: |
  - Where in my life does God seem to be asking me to “enlarge the place of my tent,” to make room for more than I thought I could hold?
  - Longer cords need stronger stakes. What anchors me firmly enough to grow without being pulled loose?
  - Is there a “small moment” of forsakenness I am living through now? What would it mean to measure it against “everlasting kindness”?
  - What does it mean for me to be “taught of the LORD,” and not only taught about Him?
  - The servant’s suffering produced servants. In what ways am I being asked to share His name and His work?

explore: |
  - **The barren who bear.** Read [[Gen. 21:1–7]], [[1 Sam. 2:1–10]], [[Luke 1:5–25]], and [[Gal. 4:21–31]].
  - **Stakes of Zion.** Read [[D&C 82:14]], [[D&C 101:17–22]], [[D&C 133:9]], and [[Moro. 10:31]].
  - **The Noah covenant and Zion.** Read [[Gen. 9:8–17]] with [[JST, Gen. 9:21–25]] and [[Moses 7:62–64]].
  - **The Savior’s version.** Read [[3 Ne. 20:10–22:17]], then [[3 Ne. 23:1–5]], and notice what follows the chapter.
  - **From servant to servants.** Read [[Isa. 53:10–12]], [[Isa. 54:17]], and [[Isa. 65:8–16]].

