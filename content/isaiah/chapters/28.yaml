chapter: 28
title: Line upon Line
tagline: Drunken leaders mock the prophet’s teaching as baby talk, trust a covenant with death, and ignore the tried and precious cornerstone.
when: 'Late 700s BC, before Samaria’s fall and while Judah’s leaders courted Egypt’s help against Assyria'

setting: |
  Chapter 28 begins a new section of Isaiah (chapters 28–33) built around a series of **woes**. Each one opens with “Woe” (*hoy*): [[Isa. 28:1]]; [[Isa. 29:1]]; [[Isa. 29:15]]; [[Isa. 30:1]]; [[Isa. 31:1]]; [[Isa. 33:1]]. The setting is the last decades of the 700s BC. The northern kingdom is about to fall to Assyria, and Judah’s leaders are negotiating with Egypt for protection against Assyria. Isaiah considers that treaty a disastrous act of faithlessness.

  The chapter opens by condemning Samaria (Ephraim), which sits on its hill like a wreath of flowers on the head of a drunk (verses 1–4). Then it turns to Jerusalem’s own leaders, and they turn out to be no better (verses 7–22).

  This chapter holds special meaning for this website, because it is where the phrase **“line upon line”** comes from (verses 10 and 13). The notes explain how a phrase first used by drunken scoffers to mock Isaiah became one of the Lord’s own descriptions of how He teaches.

thread: |
  Isaiah 28 is about **how God teaches, and why some people can’t learn**.

  The chapter’s leaders are literally drunk. Priests and prophets stagger with wine, “they err in vision, they stumble in judgment,” and their banquet tables are covered in vomit (verses 7–8). When Isaiah tries to teach them, they sneer (verses 9–10). *Who does he think he’s teaching? Toddlers just off the breast?* And they mimic his teaching as though it were baby talk: *tsav latsav, tsav latsav, qav laqav, qav laqav*, “precept upon precept… line upon line.”

  God’s answer is sobering (verses 11–13). If they won’t hear His plain, simple teaching, which was meant to give them “rest” and “refreshing” (verse 12), then He will speak to them in another language, understood here as the foreign tongue of Assyrian soldiers. The simple lessons they mocked will become the very thing they stumble over.

  Their alternative to God’s teaching is a clever political deal, a “covenant with death” (verse 15) that they think will keep them safe when the flood comes. God answers with a **stone**: “a tried stone, a precious corner stone, a sure foundation” in Zion (verse 16). Their refuge of lies will be swept away, but whoever builds on that stone “shall not make haste,” shall not panic.

  The chapter ends with a quiet parable about a farmer (verses 23–29). He doesn’t plow forever. He sows each seed in its place and threshes each crop the right way, heavy for some and gentle for others, because “his God doth instruct him.” The Lord is like that farmer. His discipline is measured and His teaching is patient. Precept upon precept, line upon line, here a little and there a little: that is exactly how the Lord teaches those willing to learn. The drunk leaders mocked it. The Restoration embraces it.

sections:
  - range: 1-6
    heading: The fading wreath of Samaria
    plain: |
      Woe to Samaria, the proud crown of Ephraim’s drunkards, its glorious beauty now a fading flower, sitting at the head of a fertile valley, the city of those overcome by wine! The Lord has someone mighty and strong, like a hailstorm, a destructive wind, or a flood of overflowing water, who will throw it to the ground. The proud crown of Ephraim’s drunkards will be trampled underfoot. Its fading beauty will be like the first ripe fig of summer: whoever sees it picks it and eats it right away. In that day the Lord of hosts Himself will be a glorious crown and a beautiful wreath for the remnant of His people. He will be a spirit of justice for the one who sits in judgment and strength for those who turn back the attack at the gate.
  - range: 7-13
    heading: Mocking the prophet’s lessons
    plain: |
      But these leaders also stagger from wine and reel from beer. Priests and prophets stagger, confused by wine; they reel when they see visions and stumble when they give judgments. Every table is covered with vomit and filth; there is no clean spot. “Whom will he teach knowledge? Whom will he make understand the message? Children just weaned from milk, just taken from the breast? For it is rule on rule, rule on rule, line on line, line on line, a little here, a little there.” For with stammering lips and a foreign tongue God will speak to this people. He had told them, “This is the place of rest; let the weary rest. This is the place of refreshment.” But they would not listen. So the Lord’s word to them will become “rule on rule, line on line, a little here, a little there,” so that they will go, fall backward, and be broken, snared, and captured.
  - range: 14-22
    heading: A covenant with death, or a cornerstone
    plain: |
      So hear the Lord’s word, you scoffers who rule this people in Jerusalem. You boast, “We have made a covenant with death, an agreement with the grave. When the overwhelming flood sweeps through, it won’t touch us, because we’ve made lies our refuge and falsehood our hiding place.” So the Lord God says: “Look! I am laying a stone in Zion, a tested stone, a precious cornerstone for a sure foundation. Whoever believes will not panic. I will make justice the measuring line and righteousness the plumb line. Hail will sweep away your refuge of lies, and water will flood your hiding place. Your covenant with death will be canceled, and your agreement with the grave will not stand. When the overwhelming flood sweeps through, it will beat you down. Morning after morning, day and night, it will sweep through. Merely understanding the report will bring distress.” The bed is too short to stretch out on, and the blanket too narrow to wrap around you. The Lord will rise up as He did at Mount Perazim and rouse Himself as in the Valley of Gibeon, to do His work, His strange work, and perform His task, His strange task. Now stop mocking, or your chains will get heavier. I have heard from the Lord God of hosts about a destruction decreed against the whole land.
  - range: 23-29
    heading: The parable of the farmer
    plain: |
      Listen and hear my voice; pay attention and hear what I say. Does a farmer plow all day long? Does he keep breaking up and harrowing the soil forever? When he has leveled the surface, doesn’t he sow dill and scatter cumin, plant wheat, barley, and spelt each in its place? His God instructs him and teaches him the right way. Dill isn’t threshed with a heavy sledge, and a cartwheel isn’t rolled over cumin. Dill is beaten out with a stick, and cumin with a rod. Grain for bread must be threshed, but not forever; he drives his cart wheels and horses over it, but he doesn’t crush it. All this also comes from the Lord of hosts, who is wonderful in counsel and magnificent in wisdom.

notes:
  - ref: 1
    phrase: Woe to the crown of pride, to the drunkards of Ephraim
    kind: history
    title: Samaria, a wreath on a drunkard’s head
    body: |
      Samaria, the capital of Ephraim (the northern kingdom), was built by Omri on a strong hill, and Isaiah describes it as sitting “on the head of the fat valleys” (verse 1). He turns that setting into satire. Samaria is like the flower wreath worn by a partygoer at a banquet, already wilting on the head of a drunk.

      The Assyrians took the city after a three-year siege, as Isaiah predicts here. The “hasty fruit before the summer” (verse 4) is a fig that ripens early, which anyone who sees it plucks and eats at once. Samaria would be swallowed that quickly.
    sources: [bd-samaria, bd-ephraim, ot-manual-15, delitzsch]
  - ref: 5
    phrase: In that day shall the LORD of hosts be for a crown of glory, and for a diadem of beauty
    kind: christ
    title: The Lord Himself as a crown
    body: |
      Right after the fading, drunken wreath of verses 1–4, Isaiah offers a different crown. The Lord Himself will be “a crown of glory” and “a diadem of beauty” to the remnant of His people.

      Paul spoke of “a crown of righteousness” laid up for those who love the Lord’s appearing ([[2 Tim. 4:8]]), and Peter of “a crown of glory that fadeth not away” ([[1 Pet. 5:4]]). Samaria’s crown faded. His does not.
    sources: [lds-scriptures]
  - ref: 7
    phrase: the priest and the prophet have erred through strong drink
    kind: scripture
    title: Leaders who can’t see straight
    body: |
      The problem isn’t only that the leaders drink. It is that their drunkenness corrupts their spiritual work: “they err in vision, they stumble in judgment.” The prophets can’t see straight, and the priests can’t judge straight.

      The law forbade priests to drink when serving in the tabernacle, “that ye may put difference between holy and unholy” ([[Lev. 10:8–10]]). The Word of Wisdom’s promise of “great treasures of knowledge, even hidden treasures” ([[D&C 89:19]]) is the positive side of this warning.
    sources: [lds-scriptures]
  - ref: 10
    phrase: For precept must be upon precept, precept upon precept; line upon line, line upon line; here a little, and there a little
    kind: words
    title: Line upon line, and the mockers who said it first
    body: |
      In context, these words are spoken by Isaiah’s **mockers**. The Hebrew is a string of short, repetitive syllables:

      > *tsav latsav tsav latsav / qav laqav qav laqav / zeʿer sham zeʿer sham*

      It sounds like a babble of short, clipped syllables, and that’s the point. The drunken leaders of verse 9 ridicule Isaiah’s teaching as petty, endless nagging: *He treats us like toddlers! Rule upon rule, line upon line, a bit here, a bit there!* On one reading, the repeated short words imitate the heavy babbling of drunken scoffers, with *zeʿer* (“little”) adding to the ridicule.

      And yet the phrase became one of the most treasured descriptions of how God actually teaches. The Lord Himself used it in the Book of Mormon: “I will give unto the children of men line upon line, precept upon precept, here a little and there a little; and blessed are those who hearken unto my precepts, and lend an ear unto my counsel, for they shall learn wisdom” ([[2 Ne. 28:30]]). He repeated it in modern revelation ([[D&C 98:12]]; [[D&C 128:21]]).

      The scoffers were right about the method and wrong about its value. God does teach in small, repeated pieces, not because the lessons are childish but because that is how real understanding grows ([[D&C 50:24]]). This site takes its name from that promise.
    sources: [oshb-wlc, delitzsch, lds-scriptures]
  - ref: 11
    phrase: For with stammering lips and another tongue will he speak to this people
    kind: history
    title: Another tongue
    body: |
      God’s response to the mockery is a warning. If they refuse to understand His simple teaching in their own language, He will “speak” to them through people whose language they can’t understand at all. On this reading they are the Assyrian invaders, whose speech would sound to Judeans like stammering. The lesson they wouldn’t learn from a prophet, they will learn from an army.

      Paul quoted this verse in his discussion of the gift of tongues, as a sign to unbelievers ([[1 Cor. 14:21–22]]).
    sources: [delitzsch, lds-scriptures]
  - ref: 12
    phrase: This is the rest wherewith ye may cause the weary to rest; and this is the refreshing
    kind: christ
    title: Rest for the weary
    body: |
      This is what the Lord had actually been offering: **rest** for the weary and **refreshing**. “Yet they would not hear.”

      Jesus made the same offer: “Come unto me, all ye that labour and are heavy laden, and I will give you rest… For my yoke is easy, and my burden is light” ([[Matt. 11:28–30]]). Peter spoke of “times of refreshing” that come from the presence of the Lord ([[Acts 3:19]]).
    sources: [delitzsch, lds-scriptures]
  - ref: 13
    phrase: that they might go, and fall backward, and be broken, and snared, and taken
    kind: scripture
    title: When simple truth becomes a stumbling block
    body: |
      This verse is sobering. The same “line upon line” teaching that brings wisdom to those who hearken ([[2 Ne. 28:30]]) becomes a stumbling block to those who mock it. They “fall backward, and be broken, and snared, and taken”: five verbs of downfall.

      In Nephi’s record the “line upon line” promise is immediately followed by its opposite: “from them that shall say, We have enough, from them shall be taken away even that which they have” ([[2 Ne. 28:30]]). Receiving truth adds light; rejecting it takes light away ([[Alma 12:9–11]]).
    sources: [lds-scriptures]
  - ref: 15
    phrase: We have made a covenant with death, and with hell are we at agreement
    kind: history
    title: A covenant with death
    body: |
      On one reading, this is Isaiah’s scathing description of Judah’s treaty with **Egypt** (see [[Isa. 30:1–7]]; [[Isa. 31:1–3]]); a pact with underworld gods may be meant instead. The leaders were confident: *when the Assyrian flood comes, it won’t touch us. We’ve made a deal.* Isaiah calls it what it really is: an agreement with death and Sheol, a “refuge of lies.”

      Either way, the leaders trusted something other than the Lord for protection, and Isaiah calls it a lie.
    sources: [delitzsch, ot-manual-15]
  - ref: 16
    phrase: Behold, I lay in Zion for a foundation a stone, a tried stone, a precious corner stone, a sure foundation
    kind: christ
    title: The tried and precious cornerstone
    body: |
      Against the “refuge of lies,” God lays a **stone** in Zion. It is **tried** (a stone of proving, tested and self-proving), **precious**, a **cornerstone**, and a **sure foundation**.

      The New Testament identifies this stone as Jesus Christ ([[1 Pet. 2:4–8]]; [[Rom. 9:33]]; [[Eph. 2:20]]). The Book of Mormon does too. Jacob foresaw that the Jews would reject “the stone upon which they might build and have safe foundation,” and that it would later become “the great, and the last, and the only sure foundation” ([[Jacob 4:15–17]]). Helaman used Isaiah’s language to counsel his sons: build “upon the rock of our Redeemer, who is Christ, the Son of God… a sure foundation, a foundation whereon if men build they cannot fall” ([[Hel. 5:12]]).

      “He that believeth shall not make haste” can be read as saying the believer will not flee but stand firm. The Greek translation (Septuagint) has the believer “by no means” put to shame, and Paul and Peter quote it in that form ([[Rom. 10:11]]; [[1 Pet. 2:6]]).
    sources: [delitzsch, ot-manual-15, lxx-rahlfs, lds-scriptures]
  - ref: 17
    phrase: Judgment also will I lay to the line, and righteousness to the plummet
    kind: symbol
    title: The measuring line and the plumb line
    body: |
      The verse borrows from the building trades: a **line** for measuring and a **plummet** (a plumb bob, a weight on a cord that shows true vertical). God will build His Zion with justice and righteousness as His measuring tools. Anything crooked won’t stand.

      Notice the wordplay with verse 10: the scoffers mocked “line upon line” (*qav laqav*), and here God uses the very same word, *qav*, for His measuring line of justice. The “line” they mocked becomes the line that measures them.
    sources: [oshb-wlc, delitzsch, ot-manual-15]
  - ref: 20
    phrase: For the bed is shorter than that a man can stretch himself on it
    kind: symbol
    title: A bed too short, a blanket too narrow
    body: |
      This was probably a proverb, and a vivid one. Picture trying to sleep on a bed too short to stretch out on, under a blanket too narrow to cover you. However you twist and turn, part of you is always uncomfortable and exposed.

      That’s what the leaders’ political arrangements are like. They seem to promise rest and security, but they never actually cover everything.
    sources: [delitzsch]
  - ref: 21
    phrase: that he may do his work, his strange work; and bring to pass his act, his strange act
    kind: history
    title: His strange act
    body: |
      At **Mount Perazim** the Lord broke through David’s enemies “as the breach of waters” ([[2 Sam. 5:20]]). At **Gibeon** He gave David a second victory over the Philistines ([[1 Chr. 14:13–16]]). Both were victories *for* Israel. Now Isaiah says the Lord will rise up the same way, but this time against His own unfaithful people. That’s why it is His “strange work” and “strange act”: He must act toward His own people as He once acted toward their enemies.

      The Lord used this exact language in modern revelation about the redemption of Zion and the troubles of the last days: “that I may proceed to bring to pass my act, my strange act, and perform my work, my strange work, that men may discern between the righteous and the wicked” ([[D&C 101:95]]).
    sources: [delitzsch, lds-scriptures]
  - ref: 24
    phrase: Doth the plowman plow all day to sow?
    kind: symbol
    title: The parable of the farmer
    body: |
      The chapter ends with a wisdom parable. A farmer doesn’t plow forever; plowing is only to prepare for planting. He sows each kind of seed in its proper place. The **fitches** and **cummin** are scattered, while the **wheat**, **barley** and **rie** each go “in their place.”

      At harvest, he threshes each crop appropriately. The lighter crops are beaten out with a staff or rod, and nobody runs a threshing sledge or cartwheel over them. Grain for bread needs heavier threshing, though not without limit (see the note on verse 28).

      The point: the farmer knows what each crop needs, because “his God doth instruct him.” The parable is read as a picture of God teaching and disciplining His people with the same wisdom: He punishes in order that He may bless ([[Isa. 27:8]]).
    sources: [delitzsch, lds-scriptures]
  - ref: 28
    phrase: he will not ever be threshing it
    kind: symbol
    title: Threshing, but not forever
    body: |
      Threshing is necessary to separate the grain from the husk, but the farmer “will not ever be threshing it.” The point is bread, not destruction.

      Applied to the Lord’s discipline, the image says He knows how much is enough, and that it will not last forever. Paul put it this way: God “will not suffer you to be tempted above that ye are able” ([[1 Cor. 10:13]]; see [[Alma 13:28]]). And the Lord told Joseph Smith in Liberty Jail, “thine adversity and thine afflictions shall be but a small moment” ([[D&C 121:7]]).
    sources: [delitzsch, lds-scriptures]

christ: |
  Isaiah 28 gives us one of the great titles of Jesus Christ: the **tried stone, the precious corner stone, the sure foundation** laid in Zion (verse 16), identified by Peter, Paul, Jacob, and Helaman ([[1 Pet. 2:6]]; [[Hel. 5:12]]; [[Jacob 4:15–17]]). He is also the **crown of glory** that doesn’t fade (verse 5), the one who offers **rest to the weary** (verse 12; [[Matt. 11:28–30]]), and the one “wonderful in counsel” whose wisdom guides even the farmer (verse 29).

  And He is the Teacher who teaches “line upon line, precept upon precept.” He didn’t give the Nephites everything at once. He told them to go home, ponder, and pray, and come back the next day ([[3 Ne. 17:2–3]]). 

explore: |
  - **Line upon line.** Read Isaiah 28:9–13, then [[2 Ne. 28:26–31]], [[D&C 98:11–12]], [[D&C 50:24]], and [[D&C 128:21]]. How does the Restoration transform the phrase?
  - **The cornerstone.** Trace it through [[Ps. 118:22]], [[Isa. 8:14]], [[Isa. 28:16]], [[Matt. 21:42]], [[1 Pet. 2:4–8]], [[Jacob 4:15–17]], and [[Hel. 5:12]].
  - **The strange act.** Read [[D&C 101:89–101]]. In what setting did the Lord quote Isaiah 28:21?

parallels:
  - ref: 2 Ne. 28:30
    note: The Lord promises to teach “line upon line, precept upon precept.”
  - ref: 1 Pet. 2:6
    note: Peter identifies the cornerstone as Christ.
  - ref: D&C 101:95
    note: The Lord’s “strange act” in the latter days.

sources: [ot-manual-15, delitzsch, bd-samaria, bd-ephraim, lxx-rahlfs, oshb-wlc, lds-scriptures]
