chapter: 43
title: I Have Called Thee by Thy Name
tagline: The Lord who created and redeemed Israel promises to walk with them through water and fire, calls them His witnesses, and announces a new exodus, while still confronting their sins.
when: 'Addressed to the exiles in Babylon (6th century BC)'

setting: |
  Chapter 42 ended with Israel in the fire, burned and still not understanding ([[Isa. 42:25]]). Chapter 43 opens with two words that change everything: “But now.” The fire is still there (verse 2), but the relationship has not changed.

  The chapter alternates between tender **salvation oracles** addressed to Israel (verses 1–7, 14–21) and **trial scenes** in which the Lord argues His case (verses 8–13, 22–28). In the first trial, Israel is called as a witness for the Lord against the nations. In the second, Israel is the defendant.

  Behind the whole chapter stands the memory of the **Exodus**. The Lord who made a path through the sea (verse 16) is about to do something even greater. For exiles in Babylon, the question was whether that story was only history or could happen again.

thread: |
  Isaiah 43 is about **belonging**. Its central sentence is the last line of verse 1: “I have called thee by thy name; thou art mine.”

  Everything flows from that. Because Israel belongs to the Lord, He will be with them in the waters and the fire (verse 2). He will pay any price to get them back, even Egypt and Cush as ransom, “since thou wast precious in my sight… and I have loved thee” (verses 3–4). He will gather His sons and daughters from every direction (verses 5–7).

  Belonging also means a job. In the courtroom scene, the nations are challenged to produce witnesses for their gods, and no one comes forward. So the Lord calls His own: “Ye are my witnesses… that I am he” (verse 10). The blind and deaf servant of chapter 42 is summoned to testify, not because they have seen perfectly, but because they have been saved.

  Then comes a promise so big that it overshadows even the Exodus. “Remember ye not the former things… Behold, I will do a new thing” (verses 18–19): a road through the wilderness and rivers in the desert.

  The chapter ends with honesty. Israel has not been faithful. They wearied the Lord with their sins, and made Him, in a startling phrase, their servant (verse 24). And yet: “I, even I, am he that blotteth out thy transgressions for mine own sake” (verse 25). Belonging to the Lord doesn’t depend on Israel’s record. It depends on His.

sections:
  - range: 1-7
    heading: '“Thou art mine”'
    plain: |
      But now this is what the Lord says, the One who created you, Jacob, and formed you, Israel: “Don’t be afraid, for I have redeemed you. I have called you by name; you are Mine. When you pass through the waters, I will be with you, and the rivers will not sweep over you. When you walk through the fire, you will not be scorched, and the flame will not burn you. For I am the Lord your God, the Holy One of Israel, your Savior. I have given Egypt as your ransom, Cush and Seba in your place. Because you are precious in My sight and honored, and because I love you, I will give people in exchange for you and nations in exchange for your life. Don’t be afraid, for I am with you. I will bring your descendants from the east and gather you from the west. I will say to the north, ‘Give them up!’ and to the south, ‘Don’t hold them back!’ Bring My sons from far away and My daughters from the ends of the earth, everyone who is called by My name and whom I created for My glory. I formed him; yes, I made him.”
  - range: 8-13
    heading: '“Ye are my witnesses”'
    plain: |
      Bring out the people who are blind though they have eyes, who are deaf though they have ears. All the nations are gathered together, and the peoples are assembled. Which of them can announce this, or tell us what happened before? Let them bring their witnesses to prove they are right, or let them listen and say, “It is true.” “You are My witnesses,” says the Lord, “and My servant whom I have chosen, so that you may know and believe Me and understand that I am He. No god was formed before Me, and there will be none after Me. I, I am the Lord, and there is no savior besides Me. I announced it, I saved you, and I proclaimed it, and there was no foreign god among you. You are My witnesses,” says the Lord, “that I am God. From the very beginning I am He. No one can rescue anyone from My hand. When I act, who can stop it?”
  - range: 14-21
    heading: A new thing
    plain: |
      This is what the Lord says, your Redeemer, the Holy One of Israel: “For your sake I will send an army against Babylon and bring down all its defenses, and the Chaldeans’ shouts of triumph will turn to cries of lament. I am the Lord, your Holy One, the Creator of Israel, your King.” This is what the Lord says, who made a road through the sea and a path through the mighty waters, who led out the chariots and horses, the army and the warriors together, and they lay down and never rose again, snuffed out like a wick: “Don’t dwell on the past. Don’t keep thinking about what happened long ago. Look, I am doing something new! It is already springing up. Don’t you see it? I will make a road in the wilderness and rivers in the desert. The wild animals will honor Me, the jackals and the ostriches, because I provide water in the wilderness and rivers in the desert to give drink to My chosen people, the people I formed for Myself, who will proclaim My praise.”
  - range: 22-28
    heading: Israel on trial, and grace
    plain: |
      “But you haven’t called on Me, Jacob. You have grown tired of Me, Israel. You haven’t brought Me sheep for burnt offerings or honored Me with your sacrifices. I didn’t burden you with demands for grain offerings or weary you with demands for incense. You didn’t buy Me fragrant cane with your money or satisfy Me with the fat of your sacrifices. Instead, you burdened Me with your sins; you wearied Me with your wrongdoing. I, I am the One who wipes out your transgressions for My own sake, and I will not remember your sins. Remind Me; let’s argue the case together. State your case so you may be proved right. Your first ancestor sinned, and your spokesmen rebelled against Me. So I disgraced the leaders of the sanctuary, and I handed Jacob over to destruction and Israel to ridicule.”

notes:
  - ref: 1
    phrase: But now thus saith the LORD that created thee, O Jacob, and he that formed thee, O Israel
    kind: words
    title: Created and formed
    body: |
      Isaiah uses two creation verbs for Israel. “Created” is *bārāʾ*, which the standard Hebrew lexicon describes as “always of divine activity,” and which it lists for Israel as a nation (verse 1, verse 15) and for the seed of Israel (verse 7). “Formed” is *yāṣar*, the verb for a potter shaping clay; the lexicon gives Adam’s formation in [[Gen. 2:7]] and Israel as a people in verses 1 and 21. Verse 7 will add a third, *ʿāśâ*, “made.”

      The point is that Israel is not merely a nation that happens to worship the Lord. It is a people He made, the way He formed the first man. The exile is not the undoing of Israel, because the Creator has not stopped creating. Latter-day Saints will think of the Lord’s words to Moses: “this is my work and my glory—to bring to pass the immortality and eternal life of man” ([[Moses 1:39]]). Verse 7 says nearly the same: “I have created him for my glory.”
    sources: [bdb, delitzsch, biblehub-interlinear]
  - ref: 1
    phrase: 'Fear not: for I have redeemed thee, I have called thee by thy name; thou art mine'
    kind: words
    title: '“I have called thee by thy name”'
    body: |
      In Scripture, a name often marks a relationship. Adam named the animals ([[Gen. 2:19–20]]). The Lord renamed Abram, Sarai, and Jacob ([[Gen. 17:5]], [[Gen. 17:15]]; [[Gen. 32:28]]). Here the Lord calls Israel by name and adds, in the Hebrew, “to me you are” (*lî ʾattâ*), which the KJV renders “thou art mine.” Delitzsch takes “I have called thee by thy name” as pointing back to Israel’s call to be the Lord’s peculiar people.

      The verb “redeemed” (*gāʾal*) is the kinsman’s verb, which the lexicon notes is used of Yahweh redeeming Israel from exile in verse 1 and as Redeemer in [[Isa. 41:14]] and verse 14. “I have redeemed” is in the Hebrew perfect tense, and Delitzsch reads the perfects of verse 1 as looking back, especially to the redemption from Egypt, as a pledge for the promises that follow.

      The Book of Mormon connects being named with covenant. King Benjamin told his people that because of their covenant they would be called “the children of Christ, his sons, and his daughters,” and he urged them to “take upon you the name of Christ” ([[Mosiah 5:7–8]]). Latter-day Saints renew that covenant every week when they promise to “take upon them the name of thy Son” ([[Moro. 4:3]]). “Thou art mine” is the Lord’s side of that covenant.
    sources: [delitzsch, bdb, biblehub-interlinear]
  - ref: 2
    phrase: When thou passest through the waters, I will be with thee
    kind: scripture
    title: Through the waters, through the fire
    body: |
      Notice the preposition: *through*. The Lord doesn’t promise that Israel will avoid the waters or the fire. He promises to be with them in both. Delitzsch reads the promise as rescue “from the midst of the greatest dangers, from which there is apparently no escape,” and compares [[Ps. 66:12]] and [[Dan. 3:17]], [[Dan. 3:27]].

      The waters recall Israel’s crossings of the Red Sea and the Jordan ([[Ex. 14:21–22]]; [[Josh. 3:14–17]]). The fire recalls Shadrach, Meshach, and Abed-nego, who walked in the furnace with a fourth figure “like the Son of God,” and came out with not a hair singed ([[Dan. 3:25–27]]).

      Latter-day Saints sing this promise in the fourth and fifth verses of “How Firm a Foundation”: “When through the deep waters I call thee to go, the rivers of sorrow shall not thee o’erflow… When through fiery trials thy pathway shall lie, my grace, all sufficient, shall be thy supply.” Joseph Smith was told in Liberty Jail that even “if thou be cast into the deep,” “all these things shall give thee experience, and shall be for thy good” ([[D&C 122:7]]).
    sources: [delitzsch, hymn-how-firm]
  - ref: 3
    phrase: I gave Egypt for thy ransom, Ethiopia and Seba for thee
    kind: christ
    title: The ransom
    body: |
      “Ransom” is *kōper*, which the lexicon defines as the price of a life ([[Ex. 21:30]]; [[Ex. 30:12]]). The lexicon also ties it to the verb *kippēr*, “to cover over, pacify, atone”: at [[Isa. 47:11]] it notes that one could pacify by payment of a *kōper*, “see Isaiah 43:3.” The Day of Atonement is *yôm hakkippurîm*, a related noun ([[Lev. 23:27]]).

      Historically, the verse may refer to Persia’s conquest of Egypt. The Bible Dictionary says that after the Persian supremacy “Egypt was invaded by Cambyses and became a province of the Persian empire.” Delitzsch notes that Egypt fell to Cambyses rather than to Cyrus, but holds that this does no violence to the promise: Egypt and its neighbors were subjugated by the new Persian power, and through it the Jews recovered their liberty. “Ethiopia” is Cush, which the Bible Dictionary places south of Egypt, and the lexicon puts Seba “clearly” in the south as well. That reading is a hypothesis, and the poetry may simply be saying that no price is too high.

      The reason for the ransom is the most tender line in the chapter: “Since thou wast precious in my sight… and I have loved thee” (verse 4). The New Testament takes the logic of ransom to its limit. Jesus said that He came “to give his life a ransom for many” ([[Mark 10:45]]). The Lord in Isaiah gives nations to buy back Israel. In the Gospels He gives Himself.
    sources: [bdb, delitzsch, bd-egypt, bd-ethiopia]
  - ref: 6
    phrase: bring my sons from far, and my daughters from the ends of the earth
    kind: prophets
    title: Sons and daughters from the ends of the earth
    body: |
      The gathering in verses 5–6 comes from all four directions. The Lord commands the north to “give up” and the south not to “keep back,” which Delitzsch takes as a command to give up what they have unrighteously held, with the exiles helped on their way by the nations.

      Daughters are named alongside sons, as in the Lord’s promise to pour out His Spirit, when “your sons and your daughters shall prophesy” ([[Joel 2:28]]).

      Latter-day Saints read this as a description of the latter-day gathering of Israel, which President Russell M. Nelson called “the most important thing taking place on earth today.” The Book of Mormon teaches that the gathering is both physical and spiritual: Israel is gathered “home to the lands of their inheritance” and also “to the true church and fold of God” ([[2 Ne. 9:2]]).
    sources: [delitzsch, nelson-hope-israel]
  - ref: 10
    phrase: Ye are my witnesses, saith the LORD, and my servant whom I have chosen
    kind: scripture
    title: '“Ye are my witnesses”'
    body: |
      In the trial of verses 8–13, the nations are invited to bring witnesses for their gods (verse 9). None appear. So the Lord calls His own witnesses, and the witnesses are the blind and deaf people of verse 8. That’s the surprise. Delitzsch takes “bring out” in verse 8 as bringing them to the place of judgment, and the point as this: the gods are dumb and cannot call witnesses, but the Lord can appeal to what He has enabled His people to experience. They are not qualified because their sight is perfect. They are qualified because they are the people He saved (verse 12).

      The call to witness is repeated in [[Isa. 44:8]], and it became the charge of the Church. The risen Christ told the apostles, “ye shall be witnesses unto me” ([[Acts 1:8]]). At the waters of Mormon, Alma asked those being baptized to “stand as witnesses of God at all times and in all things, and in all places” ([[Mosiah 18:9]]). The Book of Mormon opens with the testimonies of the Three and Eight Witnesses, and the Lord told Joseph Smith and Oliver Cowdery that “in the mouth of two or three witnesses shall every word be established” ([[D&C 6:28]]).
    sources: [delitzsch, biblehub-interlinear]
  - ref: 10
    phrase: before me there was no God formed, neither shall there be after me
    kind: words
    title: '“Before me there was no God formed”'
    body: |
      Isaiah 40–48 is full of declarations that there is no other God ([[Isa. 44:6]]; [[Isa. 45:5–7]], [[Isa. 45:21–22]]; [[Isa. 46:9]]). In the courtroom of chapter 43 the rhetoric is aimed at the gods of the nations gathered there (verse 9).

      Notice the verb: no god was “formed,” *yāṣar*, which the lexicon lists here in the passive (“before me a god was not formed”) and, elsewhere, for the carver of idols in [[Isa. 44:9–10]]. The contrast is between the Lord and **manufactured** gods. Delitzsch says that any being that could precede or follow the Lord as divine would be a contradiction, since the gods of the heathen are artificial and temporal images. The Lord was not made, and no god made by hands came before Him or will outlast Him.

      Latter-day Saints, who believe in a Godhead of three distinct persons and in the potential of God’s children to become like Him, sometimes wonder how to read such verses. The context gives the key. Isaiah is not addressing the relationship between the Father and the Son; he is denying the reality of idols and rival gods. For Israel, there is one God to worship and one Savior (verse 11), and there has never been another. The Bible Dictionary says that Jehovah “is the premortal Jesus Christ,” and the Book of Mormon teaches that He acts in perfect unity with the Father ([[3 Ne. 11:27]]).
    sources: [bdb, delitzsch, bd-jehovah]
  - ref: 11
    phrase: I, even I, am the LORD; and beside me there is no saviour
    kind: christ
    title: No other Savior
    body: |
      “Saviour” is *môšîaʿ*, which the lexicon lists under the verb *yāšaʿ*, “to save,” at verse 11 and verse 3. The same root lies behind names. The lexicon glosses Isaiah’s name (*Yĕšaʿyāhû*) as “salvation of Yah” (the Bible Dictionary: “The Lord is salvation”), and says of Joshua’s name (*Yĕhôšûaʿ*, later *Yēšûaʿ*) that it “came to be associated with” *yāšaʿ*, comparing [[Matt. 1:21]]. The angel told Joseph to call Mary’s son Jesus, “for he shall save his people from their sins.”

      Peter makes the same exclusive claim for Jesus: “Neither is there salvation in any other: for there is none other name under heaven given among men, whereby we must be saved” ([[Acts 4:12]]). King Benjamin said the same: “there shall be no other name given nor any other way nor means whereby salvation can come unto the children of men, only in and through the name of Christ, the Lord Omnipotent” ([[Mosiah 3:17]]). For Latter-day Saints, the Savior who speaks in Isaiah 43 and the Savior of the Gospels are the same person.
    sources: [bdb, bd-isaiah, delitzsch]
  - ref: 19
    phrase: Behold, I will do a new thing; now it shall spring forth; shall ye not know it?
    kind: scripture
    title: A new exodus
    body: |
      Verses 16–17 describe the Exodus: the path through the sea, Pharaoh’s chariots lying down and never rising, snuffed out like a wick. Delitzsch says the redemption from Egypt was “a type and pledge” of the deliverance from Babylon. Then comes a surprise: “Remember ye not the former things” (verse 18). After all Isaiah’s appeals to Israel’s history, he tells them not to dwell on it. Delitzsch does not hear a call for “utter forgetfulness” but for looking forward rather than backward: the new thing “eclipses the old.”

      Jeremiah makes the same prediction: the day will come when people no longer swear by the God “that brought up the children of Israel out of the land of Egypt,” but by the God who “brought up the children of Israel from the land of the north, and from all the lands whither he had driven them” ([[Jer. 16:14–15]]). Elder Russell M. Nelson has drawn “instructive parallels” between the exodus from Egypt and the Latter-day Saint pioneers’ exodus from the United States.

      For the exiles, the “new thing” was the return from Babylon. Christians read it as pointing beyond that to Christ, in whom “old things are passed away; behold, all things are become new” ([[2 Cor. 5:17]]). [The New Exodus and the Highway](/isaiah/themes/new-exodus/) follows the road through the book.
    sources: [delitzsch, nelson-exodus-repeated]
  - ref: 24
    phrase: but thou hast made me to serve with thy sins, thou hast wearied me with thine iniquities
    kind: christ
    title: The God who serves
    body: |
      Verses 23–24 contain a striking wordplay. The Lord says: “I have not caused thee to serve (*heʿĕbadtîkā*) with an offering.” Then: “thou hast made me to serve (*heʿĕbadtanî*) with thy sins.” The same verb is turned around. The lexicon notes a “perhaps play on meanings” here: to make serve and to weary. God didn’t burden Israel with demands; Israel burdened God. Delitzsch says the sins of Israel pressed on the Lord “as a burden does upon a servant,” and that His love took on that burden and worked to blot it out.

      Nine chapters later the image becomes a person. The Servant of the Lord “hath borne our griefs, and carried our sorrows… the LORD hath laid on him the iniquity of us all” ([[Isa. 53:4–6]]). In Isaiah 43 the Lord complains that Israel has made Him carry their sins. In Isaiah 53 He carries them willingly.
    sources: [bdb, delitzsch, biblehub-interlinear]
  - ref: 25
    phrase: I, even I, am he that blotteth out thy transgressions for mine own sake, and will not remember thy sins
    kind: christ
    title: For Mine own sake
    body: |
      This verse follows immediately after the accusation. There’s no “therefore,” no condition, no pause. Israel has wearied God with sins, and He says, *I am the one who wipes them out.*

      “Blotteth out” is *māḥâ*, “wipe, wipe out,” which the lexicon shows for wiping a written curse into water ([[Num. 5:23]]) and Jerusalem wiped “as a man wipeth a dish” ([[2 Kgs. 21:13]]). And He does it “for mine own sake,” not because Israel has earned it. Delitzsch hears in the tripled “I, I, He” that this is “a sovereign act of His absolute freedom,” founded “only in God.”

      Peter preached, “Repent ye therefore, and be converted, that your sins may be blotted out” ([[Acts 3:19]]). Alma explained how: the Son of God suffers “that he might take upon him the sins of his people, that he might blot out their transgressions according to the power of his deliverance” ([[Alma 7:13]]). The promise that He “will not remember” sins appears again in latter-day scripture ([[D&C 58:42]]).
    sources: [bdb, delitzsch]
  - ref: 27
    phrase: Thy first father hath sinned, and thy teachers have transgressed against me
    kind: history
    title: The first father and the interpreters
    body: |
      Who is Israel’s “first father”? Delitzsch reports that some take him to be Adam, but argues that Adam was the forefather of the human race, not of Israel, and that the reference is to **Abraham**, “the first of the three from whom the origin and election of Israel were dated.” The point in any case is that Israel’s sin is not new. It runs back to the beginning of the family.

      “Thy teachers” is *mĕlîṣêkā*, “your interpreters” or “spokesmen.” The lexicon gives it as “interpreter” in [[Gen. 42:23]] and, figuratively, “intermediaries between God and man” here. Delitzsch takes them to be the prophets and priests who stood between the Lord and Israel. They had themselves rebelled.

      The Lord’s answer to a history of failure is not to pretend it didn’t happen. Verse 25 comes first: He blots out sins. Verse 28 then acknowledges the consequences: the exile really happened. Delitzsch reads the “profanation” of the “princes of the sanctuary” as their being hurried into a foreign land. Grace and consequences both stand.
    sources: [delitzsch, bdb, biblehub-interlinear]

christ: |
  The God who speaks in Isaiah 43 calls Himself Creator, Redeemer, Savior, and King, and says that there is no Savior besides Him (verse 11). Peter says of Jesus that “there is none other name under heaven given among men, whereby we must be saved” ([[Acts 4:12]]), and Latter-day Saints recognize the Jehovah of Isaiah as the premortal Christ.

  The chapter also sketches, in advance, the shape of His Atonement. He pays a ransom for Israel because they are precious to Him (verses 3–4), as Jesus gave His life “a ransom for many.” He is made to “serve” with Israel’s sins and wearied by their iniquities (verse 24), a picture fulfilled in the Servant who bore “the iniquity of us all” ([[Isa. 53:6]]). And He blots out transgressions “for mine own sake” (verse 25), on the strength of His own merits and mercy. The promise that He will be with His people in the waters and the fire is the promise of Immanuel, God with us.

explore: |
  - **The Exodus in Isaiah 40–55.** Trace the new-exodus theme through [[Isa. 40:3–5]], [[Isa. 43:16–21]], [[Isa. 48:20–21]], [[Isa. 51:9–11]], and [[Isa. 52:11–12]].
  - **Witnesses.** Compare [[Isa. 44:8]], [[Acts 1:8]], [[Mosiah 18:8–10]], and the testimonies of the Three and Eight Witnesses.
  - **Names and covenant.** Read [[Mosiah 5:7–12]], [[Moro. 4:3]], and [[Rev. 2:17]].
  - **Ransom and atonement.** Trace *kōper* and *kippēr* through [[Ex. 30:11–16]], [[Lev. 16]], and [[Mark 10:45]].
  - **The gathering.** Read [[Jer. 16:14–16]], [[1 Ne. 22:10–12]], and [[3 Ne. 20:29–33]].

parallels:
  - ref: Jer. 16:14–15
    note: A greater gathering will overshadow the Exodus.
  - ref: Acts 4:12
    note: No other name under heaven by which we must be saved.
  - ref: Mosiah 18:8–10
    note: Baptism as a covenant to stand as witnesses of God.

