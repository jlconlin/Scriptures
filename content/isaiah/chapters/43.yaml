chapter: 43
title: I Have Called Thee by Thy Name
tagline: The Lord who created and redeemed Israel promises to walk with them through water and fire, calls them His witnesses, and announces a new exodus, while still confronting their sins.
when: 'Addressed to the exiles, c. 550–540 BC'

setting: |
  Chapter 42 ended with Israel in the fire, burned and still not understanding ([[Isa. 42:25]]). Chapter 43 opens with two words that change everything: “But now.” The fire is still there (verse 2), but the relationship has not changed.

  The chapter continues the pattern of Isaiah 40–48, alternating between tender **salvation oracles** addressed to Israel (verses 1–7, 14–21) and **trial scenes** in which the Lord argues His case (verses 8–13, 22–28). In the first trial, Israel is called as a witness for the Lord against the nations. In the second, Israel is the defendant.

  Behind the whole chapter stands the memory of the **Exodus**. The Lord who made a path through the sea (verse 16) is about to do something even greater. For exiles in Babylon, the question was whether that story was only history or could happen again.

thread: |
  Isaiah 43 is about **belonging**. Its central sentence is the last line of verse 1: “I have called thee by thy name; thou art mine.”

  Everything flows from that. Because Israel belongs to the Lord, He will be with them in the waters and the fire (verse 2). He will pay any price to get them back, even Egypt and Cush as ransom, “since thou wast precious in my sight… and I have loved thee” (verses 3–4). He will gather His sons and daughters from every direction (verses 5–7).

  Belonging also means a job. In the courtroom scene, the nations are challenged to produce witnesses for their gods, and no one comes forward. So the Lord calls His own: “Ye are my witnesses… that I am he” (verse 10). The blind and deaf servant of chapter 42 is summoned to testify, not because they have seen perfectly, but because they have been saved.

  Then comes a promise so big that it overshadows even the Exodus. “Remember ye not the former things… Behold, I will do a new thing” (verses 18–19): a road through the wilderness and rivers in the desert.

  The chapter ends with honesty. Israel has not been faithful. They wearied the Lord with their sins, and made Him, in a startling phrase, their servant (verse 24). And yet: “I, even I, am he that blotteth out thy transgressions for mine own sake” (verse 25). Belonging to the Lord doesn’t depend on Israel’s record. It depends on His.

sections:
  - range: 1-7
    heading: '“Thou art mine”'
    plain: |
      But now this is what the Lord says, the One who created you, Jacob, and formed you, Israel: “Don’t be afraid, for I have redeemed you. I have called you by name; you are Mine. When you pass through the waters, I will be with you, and the rivers will not sweep over you. When you walk through the fire, you will not be scorched, and the flame will not burn you. For I am the Lord your God, the Holy One of Israel, your Savior. I have given Egypt as your ransom, Cush and Seba in your place. Because you are precious in My sight and honored, and because I love you, I will give people in exchange for you and nations in exchange for your life. Don’t be afraid, for I am with you. I will bring your descendants from the east and gather you from the west. I will say to the north, ‘Give them up!’ and to the south, ‘Don’t hold them back!’ Bring My sons from far away and My daughters from the ends of the earth, everyone who is called by My name and whom I created for My glory. I formed him; yes, I made him.”
  - range: 8-13
    heading: '“Ye are my witnesses”'
    plain: |
      Bring out the people who are blind though they have eyes, who are deaf though they have ears. All the nations are gathered together, and the peoples are assembled. Which of them can announce this, or tell us what happened before? Let them bring their witnesses to prove they are right, or let them listen and say, “It is true.” “You are My witnesses,” says the Lord, “and My servant whom I have chosen, so that you may know and believe Me and understand that I am He. No god was formed before Me, and there will be none after Me. I, I am the Lord, and there is no savior besides Me. I announced it, I saved you, and I proclaimed it, and there was no foreign god among you. You are My witnesses,” says the Lord, “that I am God. From the very beginning I am He. No one can rescue anyone from My hand. When I act, who can stop it?”
  - range: 14-21
    heading: A new thing
    plain: |
      This is what the Lord says, your Redeemer, the Holy One of Israel: “For your sake I will send an army against Babylon and bring down all its defenses, and the Chaldeans’ shouts of triumph will turn to cries of lament. I am the Lord, your Holy One, the Creator of Israel, your King.” This is what the Lord says, who made a road through the sea and a path through the mighty waters, who led out the chariots and horses, the army and the warriors together, and they lay down and never rose again, snuffed out like a wick: “Don’t dwell on the past. Don’t keep thinking about what happened long ago. Look, I am doing something new! It is already springing up. Don’t you see it? I will make a road in the wilderness and rivers in the desert. The wild animals will honor Me, the jackals and the ostriches, because I provide water in the wilderness and rivers in the desert to give drink to My chosen people, the people I formed for Myself, who will proclaim My praise.”
  - range: 22-28
    heading: Israel on trial, and grace
    plain: |
      “But you haven’t called on Me, Jacob. You have grown tired of Me, Israel. You haven’t brought Me sheep for burnt offerings or honored Me with your sacrifices. I didn’t burden you with demands for grain offerings or weary you with demands for incense. You didn’t buy Me fragrant cane with your money or satisfy Me with the fat of your sacrifices. Instead, you burdened Me with your sins; you wearied Me with your wrongdoing. I, I am the One who wipes out your transgressions for My own sake, and I will not remember your sins. Remind Me; let’s argue the case together. State your case so you may be proved right. Your first ancestor sinned, and your spokesmen rebelled against Me. So I disgraced the leaders of the sanctuary, and I handed Jacob over to destruction and Israel to ridicule.”

notes:
  - ref: 1
    phrase: But now thus saith the LORD that created thee, O Jacob, and he that formed thee, O Israel
    kind: words
    title: Created and formed
    body: |
      Isaiah uses two creation verbs for Israel. “Created” is *bārāʾ*, the verb of [[Gen. 1:1]], used in the Hebrew Bible only with God as its subject. “Formed” is *yāṣar*, the verb for a potter shaping clay, the verb of [[Gen. 2:7]], where the Lord “formed man of the dust of the ground.” Verse 7 will add a third, *ʿāśâ*, “made.”

      The point is that Israel is not merely a nation that happens to worship the Lord. It is a people He made, the way He made the first human beings. The exile is not the undoing of Israel, because the Creator has not stopped creating. Latter-day Saints will think of the Lord’s words to Moses: “this is my work and my glory—to bring to pass the immortality and eternal life of man” ([[Moses 1:39]]). Verse 7 says nearly the same: “I have created him for my glory.”
    sources: [bdb]
  - ref: 1
    phrase: 'Fear not: for I have redeemed thee, I have called thee by thy name; thou art mine'
    kind: words
    title: '“I have called thee by thy name”'
    body: |
      In the ancient world, to name something was to claim it. Adam named the animals ([[Gen. 2:19–20]]). The Lord renamed Abram, Sarai, and Jacob when He made covenants with them ([[Gen. 17:5]], [[Gen. 17:15]]; [[Gen. 32:28]]). A king’s name inscribed on a building marked it as his.

      The verb “redeemed” (*gāʾal*) is the kinsman’s verb from [[Isa. 41:14]]. The Lord speaks of the redemption in the past tense, as already done, even though the exiles are still in Babylon. Scholars call this the **prophetic perfect**: the prophet describes a future event in the Hebrew perfect tense (normally used for completed action) because it is so certain that it can be spoken of as done.

      The Book of Mormon connects being named with covenant. King Benjamin told his people that because of their covenant they would be called “the children of Christ, his sons, and his daughters,” and he urged them to “take upon you the name of Christ” ([[Mosiah 5:7–8]]). Latter-day Saints renew that covenant every week when they promise to “take upon them the name of thy Son” ([[Moro. 4:3]]). “Thou art mine” is the Lord’s side of that covenant.
  - ref: 2
    phrase: When thou passest through the waters, I will be with thee
    kind: scripture
    title: Through the waters, through the fire
    body: |
      Notice the preposition: *through*. The Lord doesn’t promise that Israel will avoid the waters or the fire. He promises to be with them in both.

      The waters recall Israel’s crossings of the Red Sea and the Jordan ([[Ex. 14:21–22]]; [[Josh. 3:14–17]]). The fire recalls nothing in Israel’s history yet. But readers of Daniel will think of Shadrach, Meshach, and Abed-nego, who walked in the furnace with a fourth figure “like the Son of God,” and came out with not a hair singed ([[Dan. 3:25–27]]).

      Latter-day Saints sing this promise in the third and fourth verses of “How Firm a Foundation”: “When through the deep waters I call thee to go, the rivers of sorrow shall not thee o’erflow… When through fiery trials thy pathway shall lie, my grace, all sufficient, shall be thy supply.” Joseph Smith was told in Liberty Jail that even “if thou be cast into the deep,” “all these things shall give thee experience, and shall be for thy good” ([[D&C 122:7]]).
    sources: [hymn-how-firm]
  - ref: 3
    phrase: I gave Egypt for thy ransom, Ethiopia and Seba for thee
    kind: christ
    title: The ransom
    body: |
      “Ransom” is *kōper*, the price paid to release a person from a penalty or from captivity ([[Ex. 21:30]]; [[Ex. 30:12]]). It comes from the same root as *kippēr*, “to atone,” and *Yom Kippur*, the Day of Atonement.

      Historically, the verse may refer to the Persian conquest of Egypt under Cyrus’s son Cambyses in 525 BC. Persia freed Israel, and was, so to speak, “paid” with Egypt and the lands to its south (Ethiopia, that is, Cush, and Seba). That is a plausible reading, and many commentators hold it, but it is a hypothesis. The poetry may simply be saying that no price is too high.

      The reason for the ransom is the most tender line in the chapter: “Since thou wast precious in my sight… and I have loved thee” (verse 4). The New Testament takes the logic of ransom to its limit. Jesus said that He came “to give his life a ransom for many” ([[Mark 10:45]]). The Lord in Isaiah gives nations to buy back Israel. In the Gospels He gives Himself.
    sources: [paul-40-66, blenkinsopp]
  - ref: 6
    phrase: bring my sons from far, and my daughters from the ends of the earth
    kind: prophets
    title: Sons and daughters from the ends of the earth
    body: |
      The gathering in verses 5–6 comes from all four directions. The Lord commands the north to “give up” and the south not to “keep back,” as if the compass points were jailers.

      Notice that daughters are named alongside sons, which is less common in the prophetic gathering passages than one might expect. The same pairing appears in the Lord’s promise to pour out His Spirit, when “your sons and your daughters shall prophesy” ([[Joel 2:28]]).

      Latter-day Saints read this as a description of the latter-day gathering of Israel, which President Russell M. Nelson called “the most important thing taking place on earth today.” The Book of Mormon teaches that the gathering is both physical and spiritual: Israel is gathered “home to the lands of their inheritance” and also “to the true church and fold of God” ([[2 Ne. 9:2]]).
    sources: [nelson-hope-israel, nelson-gathering]
  - ref: 10
    phrase: Ye are my witnesses, saith the LORD, and my servant whom I have chosen
    kind: scripture
    title: '“Ye are my witnesses”'
    body: |
      In the trial of verses 8–13, the nations are invited to bring witnesses for their gods (verse 9). None appear. So the Lord calls His own witnesses, and the witnesses are the blind and deaf people of verse 8. That’s the surprise. They are not qualified because their sight is perfect. They are qualified because they are the people He saved (verse 12).

      The call to witness is repeated in [[Isa. 44:8]], and it became the charge of the Church. The risen Christ told the apostles, “ye shall be witnesses unto me” ([[Acts 1:8]]). At the waters of Mormon, Alma asked those being baptized to “stand as witnesses of God at all times and in all things, and in all places” ([[Mosiah 18:9]]). The Book of Mormon itself begins with the testimonies of witnesses, and the Lord told Joseph Smith and Oliver Cowdery that “in the mouth of two or three witnesses shall every word be established” ([[D&C 6:28]]).
  - ref: 10
    phrase: before me there was no God formed, neither shall there be after me
    kind: words
    title: '“Before me there was no God formed”'
    body: |
      Isaiah 40–48 contains the most emphatic statements of **monotheism** in the Hebrew Bible ([[Isa. 44:6]]; [[Isa. 45:5–7]], [[Isa. 45:21–22]]; [[Isa. 46:9]]). Many historians of religion think Israel’s faith developed from worshipping one God among many (sometimes called *monolatry*) toward the conviction that no other gods exist at all, and they see these chapters as a high point of that development. Others argue that the conviction is much older. Either way, the rhetoric here is aimed squarely at the gods of Babylon.

      Notice the verb: no god was “formed,” *yāṣar*, the craftsman’s word used for idols in [[Isa. 44:9–10]]. The contrast is between the Lord and **manufactured** gods. The Lord was not made, and no god made by hands came before Him or will outlast Him.

      Latter-day Saints, who believe in a Godhead of three distinct persons and in the potential of God’s children to become like Him, sometimes wonder how to read such verses. The context gives the key. Isaiah is not addressing the relationship between the Father and the Son; he is denying the reality of idols and rival gods. For Israel, there is one God to worship and one Savior (verse 11), and there has never been another. Latter-day Saints understand that God of Israel, Jehovah, to be the premortal Jesus Christ, who acts in perfect unity with the Father ([[3 Ne. 11:27]]).
    sources: [paul-40-66, bd-jehovah]
  - ref: 11
    phrase: I, even I, am the LORD; and beside me there is no saviour
    kind: christ
    title: No other Savior
    body: |
      “Saviour” is *môšîaʿ*, from the verb *yāšaʿ*, “to save.” It is the root of the names Joshua, Isaiah (*Yĕšaʿyāhû*, “the LORD saves”), and Jesus (*Yēšûaʿ*). The angel told Joseph to call Mary’s son Jesus, “for he shall save his people from their sins” ([[Matt. 1:21]]).

      The New Testament applies the exclusive claim of this verse to Jesus: “Neither is there salvation in any other: for there is none other name under heaven given among men, whereby we must be saved” ([[Acts 4:12]]). King Benjamin said the same: “there shall be no other name given nor any other way nor means whereby salvation can come unto the children of men, only in and through the name of Christ, the Lord Omnipotent” ([[Mosiah 3:17]]). For Latter-day Saints, the Savior who speaks in Isaiah 43 and the Savior of the Gospels are the same person.
  - ref: 13
    phrase: I will work, and who shall let it?
    kind: words
    title: '“Who shall let it?”'
    body: |
      In 1611, the English verb *let* could mean “to hinder,” the opposite of its modern meaning. (It survives in the tennis term “let” and the legal phrase “without let or hindrance.”) So “who shall let it?” means “who can stop it?” Paul’s “he who now letteth will let” in [[2 Thes. 2:7]] uses the same sense.

      The first half of the verse is also worth a look. “Before the day was I am he” can be read “from eternity I am He” or “from this day on I am He.” The Hebrew *miyyôm* is ambiguous. Either way, the Lord is claiming both past and future.
  - ref: 19
    phrase: Behold, I will do a new thing; now it shall spring forth; shall ye not know it?
    kind: scripture
    title: A new exodus
    body: |
      Verses 16–17 describe the Exodus: the path through the sea, Pharaoh’s chariots lying down and never rising, snuffed out like a wick. Then comes a surprise: “Remember ye not the former things” (verse 18). After all Isaiah’s appeals to Israel’s history, he tells them not to dwell on it. The new thing will be so great that it will overshadow the old one.

      Jeremiah makes the same prediction: the day will come when people no longer swear by the God “that brought up the children of Israel out of the land of Egypt,” but by the God who “brought up the children of Israel from the land of the north, and from all the lands whither he had driven them” ([[Jer. 16:14–15]]). Latter-day Saint leaders have often read Jeremiah’s promise as describing the latter-day gathering.

      For the exiles, the “new thing” was the return from Babylon. For Christians, it points beyond that to Christ, in whom “old things are passed away; behold, all things are become new” ([[2 Cor. 5:17]]).
    sources: [nelson-gathering]
  - ref: 20
    phrase: the dragons and the owls
    kind: words
    title: Jackals and ostriches
    body: |
      The KJV’s “dragons” translates *tannîm*, which in passages like this almost certainly means **jackals**, desert scavengers whose howling at night was a sign of desolation ([[Isa. 13:22]]; [[Isa. 34:13]]). The similar word *tannîn* can mean a sea monster, and the translators of 1611 didn’t always distinguish the two. The “owls” are *bĕnôt yaʿănâ*, probably **ostriches** (compare [[Job 30:29]]; [[Lam. 4:3]]).

      So the scene is not mythological. It is a wilderness so well watered that even the animals of the wasteland give thanks. Elsewhere in Isaiah, jackals and ostriches mark a ruin (for example [[Isa. 34:13]]). Here they are praising God for water. The creatures of desolation become a choir.
    sources: [halot]
  - ref: 24
    phrase: but thou hast made me to serve with thy sins, thou hast wearied me with thine iniquities
    kind: christ
    title: The God who serves
    body: |
      Verses 23–24 contain one of the most remarkable wordplays in Isaiah. The Lord says: “I have not caused thee to serve (*lōʾ heʿĕbadtîkā*) with an offering.” Then: “thou hast made me to serve (*heʿĕbadtanî*) with thy sins.” The same verb is turned around. God didn’t burden Israel with demands; Israel burdened God. The Lord became, so to speak, the servant who carries their sins.

      There’s another play in verse 24: “Thou hast bought me no sweet cane (*qāneh*) with money (*qānîtā*, ‘you bought’).” And “filled me” is *hirwîtānî*, “you saturated me,” as with water, but with sins instead of sacrificial fat.

      Nine chapters later the image becomes a person. The Servant of the Lord “hath borne our griefs, and carried our sorrows… the LORD hath laid on him the iniquity of us all” ([[Isa. 53:4–6]]). In Isaiah 43 the Lord complains that Israel has made Him carry their sins. In Isaiah 53 He carries them willingly.
    sources: [paul-40-66, westermann]
  - ref: 25
    phrase: I, even I, am he that blotteth out thy transgressions for mine own sake, and will not remember thy sins
    kind: christ
    title: For Mine own sake
    body: |
      This verse follows immediately after the accusation. There’s no “therefore,” no condition, no pause. Israel has wearied God with sins, and He says, *I am the one who wipes them out.*

      “Blotteth out” is *māḥâ*, to wipe clean, like wiping writing off a tablet or a dish ([[2 Kgs. 21:13]]). And He does it “for mine own sake,” not because Israel has earned it, but because of who He is.

      Peter preached, “Repent ye therefore, and be converted, that your sins may be blotted out” ([[Acts 3:19]]). Alma explained how: the Son of God suffers “that he might take upon him the sins of his people, that he might blot out their transgressions according to the power of his deliverance” ([[Alma 7:13]]). The promise that He “will not remember” sins appears again in latter-day scripture ([[D&C 58:42]]).
  - ref: 27
    phrase: Thy first father hath sinned, and thy teachers have transgressed against me
    kind: history
    title: The first father and the interpreters
    body: |
      Who is Israel’s “first father”? Some commentators suggest Adam, but in context most take it to be **Jacob**, the ancestor whose name Israel bears, who deceived his father and brother. Hosea had already used Jacob’s story as an indictment ([[Hosea 12:2–4]]). Others suggest Abraham. The point in any case is that Israel’s sin is not new. It runs back to the beginning of the family.

      “Thy teachers” is *mĕlîṣêkā*, “your interpreters” or “spokesmen.” The same word describes the interpreter between Joseph and his brothers ([[Gen. 42:23]]). Israel’s prophets, priests, and leaders, who were supposed to mediate between God and the people, had themselves rebelled.

      The Lord’s answer to a history of failure is not to pretend it didn’t happen. Verse 25 comes first: He blots out sins. Verse 28 then acknowledges the consequences: the exile really happened. Grace and consequences both stand.

christ: |
  The God who speaks in Isaiah 43 calls Himself Creator, Redeemer, Savior, and King, and says that there is no Savior besides Him (verse 11). The New Testament gives that name to Jesus ([[Acts 4:12]]), and Latter-day Saints recognize the Jehovah of Isaiah as the premortal Christ.

  The chapter also sketches, in advance, the shape of His Atonement. He pays a ransom for Israel because they are precious to Him (verses 3–4), as Jesus gave His life “a ransom for many.” He is made to “serve” with Israel’s sins and wearied by their iniquities (verse 24), a picture fulfilled in the Servant who bore “the iniquity of us all” ([[Isa. 53:6]]). And He blots out transgressions “for mine own sake” (verse 25), on the strength of His own merits and mercy. The promise that He will be with His people in the waters and the fire is the promise of Immanuel, God with us.

explore: |
  - **The Exodus in Isaiah 40–55.** Trace the new-exodus theme through [[Isa. 40:3–5]], [[Isa. 43:16–21]], [[Isa. 48:20–21]], [[Isa. 51:9–11]], and [[Isa. 52:11–12]].
  - **Witnesses.** Compare [[Isa. 44:8]], [[Acts 1:8]], [[Mosiah 18:8–10]], and the testimonies of the Three and Eight Witnesses.
  - **Names and covenant.** Read [[Mosiah 5:7–12]], [[Moro. 4:3]], and [[Rev. 2:17]].
  - **Ransom and atonement.** Trace *kōper* and *kippēr* through [[Ex. 30:11–16]], [[Lev. 16]], and [[Mark 10:45]].
  - **The gathering.** Read [[Jer. 16:14–16]], [[1 Ne. 22:10–12]], and [[3 Ne. 20:29–33]].

parallels:
  - ref: Jer. 16:14–15
    note: A greater gathering will overshadow the Exodus.
  - ref: Acts 4:12
    note: No other name under heaven by which we must be saved.
  - ref: Mosiah 18:8–10
    note: Baptism as a covenant to stand as witnesses of God.

sources: [westermann, paul-40-66, childs, blenkinsopp, hymn-how-firm, nelson-gathering, parry-understanding]
