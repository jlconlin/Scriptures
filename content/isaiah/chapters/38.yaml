chapter: 38
title: Fifteen Years and a Song of Thanks
tagline: King Hezekiah turns his face to the wall and prays, the Lord adds fifteen years to his life, and the king writes a psalm of gratitude.
when: 'During the Assyrian crisis of Hezekiah’s reign'

setting: |
  Chapters 38 and 39 are not in chronological order with 36 and 37. Verse 6 promises that the Lord *will* deliver Jerusalem from Assyria, so Hezekiah’s illness came before the deliverance described in chapter 37. The arithmetic points the same way: Hezekiah reigned twenty-nine years ([[2 Kgs. 18:2]]), and fifteen more were promised here, so the illness fell around the fourteenth year of his reign, the year [[Isa. 36:1]] dates Sennacherib’s invasion.

  Why tell the story out of order? The text itself suggests an answer. Chapters 36–37 close out the Assyrian threat that runs through the first half of the book, and chapter 39 ends with a word about Babylon ([[Isa. 39:6]]). Chapter 38 sits between them, and it is the most personal panel: the Lord ties the king’s life and the city’s rescue together in a single promise (verse 6).

  The chapter has two parts: the story of Hezekiah’s illness and healing (verses 1–8, 21–22), and a psalm Hezekiah wrote after he recovered (verses 9–20). The parallel account in [[2 Kgs. 20:1–11]] is shorter in some ways and fuller in others. It omits the psalm but includes details Isaiah leaves out, such as the promise that Hezekiah would go up to the temple “on the third day.”

thread: |
  Isaiah 38 is about **what a person learns when life is given back**.

  The story begins with a hard message. Isaiah tells the king, “Set thine house in order: for thou shalt die, and not live” (verse 1). Hezekiah turns his face to the wall, prays, and weeps. And before Isaiah has even left the palace grounds ([[2 Kgs. 20:4]]), the Lord sends him back: “I have heard thy prayer, I have seen thy tears: behold, I will add unto thy days fifteen years” (verse 5). As a sign, the shadow on the stairway of Ahaz moves backward ten steps (verse 8). Time itself runs backward for a man whose time had run out.

  Then Hezekiah writes a song. It moves from despair to gratitude. First he describes what it felt like to face death: his life being folded up like a shepherd’s tent and cut off like cloth from a loom, moaning like a dove (verses 10–14). Then comes the turn: “thou hast in love to my soul delivered it from the pit… for thou hast cast all my sins behind thy back” (verse 17). He ends by resolving to spend his added years praising the Lord and teaching his children (verses 19–20).

  The chapter shows a God who hears prayer and sees tears, and who can revise a pronounced sentence. It also shows that healing came through both a miracle and ordinary means, since Isaiah prescribed a poultice of figs (verse 21). And it gently raises a question every person who has been given more time must answer: *What will I do with the years the Lord adds?* Chapter 39 will show that Hezekiah’s own answer was mixed.

sections:
  - range: 1-3
    heading: '“Thou shalt die, and not live”'
    plain: |
      About that time Hezekiah became mortally ill. The prophet Isaiah son of Amoz came to him and said, “This is what the Lord says: Give your final instructions to your household, because you are going to die. You will not recover.” Hezekiah turned his face to the wall and prayed to the Lord: “Please, Lord, remember how I have lived before You faithfully and wholeheartedly, and how I have done what is good in Your eyes.” And Hezekiah wept bitterly.
  - range: 4-8
    heading: Fifteen years and a sign
    plain: |
      Then the word of the Lord came to Isaiah: “Go and tell Hezekiah, ‘This is what the Lord, the God of your ancestor David, says: I have heard your prayer. I have seen your tears. I am adding fifteen years to your life. I will rescue you and this city from the king of Assyria, and I will defend this city. And this is the sign from the Lord that He will do what He has promised: I am going to make the shadow that has gone down the stairway of Ahaz go back ten steps.’” And the sunlight went back up the ten steps it had already gone down.
  - range: 9-14
    heading: 'Hezekiah’s psalm: facing death'
    plain: |
      This is what Hezekiah king of Judah wrote after he had been sick and had recovered:

      I said, “In the middle of my life I must go through the gates of the grave. I am robbed of the rest of my years.” I said, “I will never again see the Lord in the land of the living. I will never again look on another human being among those who live in the world.” My home is pulled up and taken from me like a shepherd’s tent. Like a weaver I have rolled up my life, and He cuts me loose from the loom. Between morning and night You bring me to an end. I waited quietly until morning, but like a lion He crushed all my bones. Between morning and night You bring me to an end. I chirped like a swift or a thrush. I moaned like a dove. My eyes grew tired from looking up to heaven. Lord, I am overwhelmed. Stand as my guarantor!
  - range: 15-20
    heading: 'Hezekiah’s psalm: life given back'
    plain: |
      What can I say? He has spoken to me, and He Himself has done it. I will walk humbly all my years because of the bitterness I went through. Lord, by such things people live, and my spirit finds life in them too. You have restored me and let me live. Look: my bitterness has turned into peace. In Your love You kept me from the pit of destruction, because You have thrown all my sins behind Your back. The grave cannot thank You. Death cannot praise You. Those who go down to the pit cannot hope for Your faithfulness. The living, only the living, can thank You, as I do today. Fathers will tell their children about Your faithfulness. The Lord has saved me. So we will play my songs on stringed instruments all the days of our lives in the house of the Lord.
  - range: 21-22
    heading: The figs and the sign
    plain: |
      Isaiah had said, “Have them bring a cake of pressed figs and put it on the boil, and he will recover.” And Hezekiah had asked, “What will be the sign that I will go up to the house of the Lord?”

notes:
  - ref: 1
    phrase: Set thine house in order
    kind: words
    title: '“Set thine house in order”'
    body: |
      The Hebrew is short and blunt: *ṣaw lĕbêtekā*, “give command to your house.” Isaiah is telling the king to make known his last will to his family: settle the succession, make arrangements, say what needs to be said. Ahithophel did the same before his death ([[2 Sam. 17:23]]), and dying patriarchs gave such charges to their sons ([[Gen. 49:33]]; [[1 Kgs. 2:1–4]]).

      The instruction is not only practical. For a king of David’s line, the “house” was also the dynasty ([[2 Sam. 7:11–16]]). At this point Hezekiah apparently had no heir: Manasseh was twelve when he began to reign ([[2 Kgs. 21:1]]), so he was born about three years *into* the added fifteen. The survival of David’s line was riding on this one sick man.
    sources: [delitzsch, lds-scriptures]
  - ref: 2
    phrase: Hezekiah turned his face toward the wall
    kind: history
    title: Face to the wall
    body: |
      Why the wall? The text doesn’t explain. The natural reading is a sick man turning away from the room to retire into himself and to God. The Savior counseled, “when thou prayest, enter into thy closet, and when thou hast shut thy door, pray to thy Father which is in secret” ([[Matt. 6:6]]). A dying king in a crowded palace has no closet, so he makes one out of a wall.

      His prayer (verse 3) may sound self-justifying to modern ears: *remember how I have walked before You.* But “a perfect heart” is the whole, undivided heart that Kings asks of a king ([[1 Kgs. 8:61]]; [[1 Kgs. 15:14]]), and Hezekiah’s reforms were his record of it ([[2 Kgs. 18:3–6]]). “In truth” means without wavering or hypocrisy. He is not boasting. He is appealing to what he has done in the Lord’s service, the way Nehemiah later prays, “Remember me, O my God, for good” ([[Neh. 13:31]]).
    sources: [delitzsch, lds-scriptures]
  - ref: 5
    phrase: I have heard thy prayer, I have seen thy tears
    kind: christ
    title: A sentence revised
    body: |
      Verse 1 sounds final: “thou shalt die, and not live.” Two verses later the Lord adds fifteen years. Did God change His mind?

      The Bible treats many prophetic pronouncements as conditional even when they are stated without conditions. The Lord explains the principle through Jeremiah: if a nation He has threatened “turn from their evil, I will repent of the evil that I thought to do unto them” ([[Jer. 18:7–10]]). Jonah announced Nineveh’s destruction with no escape clause, and Nineveh was spared when it repented ([[Jonah 3:4–10]]). The Lord tells the Latter-day Saints the same thing about His own commands: “I, the Lord, command and revoke, as it seemeth me good” ([[D&C 56:4]]). The announced outcome is real, but it is a response to present conditions, and prayer is one of the conditions.

      Notice what moved the Lord: not an argument, but prayer and tears. He introduces Himself as “the God of David thy father,” reminding Hezekiah that the covenant with David is still in force. Jesus Christ is the one who “in the days of his flesh… offered up prayers and supplications with strong crying and tears unto him that was able to save him from death, and was heard” ([[Heb. 5:7]]).
    sources: [lds-scriptures]
  - ref: 8
    phrase: Behold, I will bring again the shadow of the degrees, which is gone down in the sun dial of Ahaz, ten degrees backward
    kind: history
    title: The shadow on the stairs of Ahaz
    body: |
      The KJV’s “degrees” and “sun dial” both translate one Hebrew word, *maʿălôt*, which means **steps**. The same word stands in the titles of the “Songs of Degrees” (Psalms 120–134). The picture is a stairway or stepped platform of Ahaz on which a shadow climbed or descended step by step. The text doesn’t say how the device was built or whether it was designed as a clock.

      How did the shadow go back? Scripture says only that the Lord did it. Latter-day Saint readers can set beside it Mormon’s comment that when the Lord seems to make the sun go back, “surely it is the earth that moveth and not the sun” ([[Hel. 12:14–15]]). Mormon’s point is not an astronomical mechanism but the Lord’s power over the whole created order.
    sources: [delitzsch, lds-scriptures]
  - ref: 9
    phrase: The writing of Hezekiah king of Judah
    kind: words
    title: '“The writing,” or “a psalm”?'
    body: |
      Hezekiah’s song (verses 9–20) has a superscription just like the psalms: author, occasion, and genre. Compare the songs of thanks in [[Jonah 2]] and [[1 Sam. 2:1–10]].

      The word translated “writing” is *miktāb*. One commentator observes that the song could just as well have been headed *miktām*, the rare word that stands over [[Ps. 16]] and [[Ps. 56]], “Michtam of David,” since it has the characteristics of that kind of psalm. That is one scholar’s suggestion, not a certainty. Either way the effect is the same: a son of David, rescued from death, sings like David.

      The song moves in three stages: a retrospective lament (verses 10–14), how the Lord promised help and then kept the promise (verses 15–17), and the vow of praise (verses 18–20). The superscription also says Hezekiah wrote it after he recovered, as a song of thanksgiving, not during his illness.
    sources: [delitzsch, lds-scriptures]
  - ref: 11
    phrase: I shall not see the LORD, even the LORD, in the land of the living
    kind: words
    title: '“The LORD, even the LORD”'
    body: |
      The Hebrew here doesn’t use the full divine name *YHWH*. It says *Yāh, Yāh*, the name doubled. The repetition is like a sob.

      What Hezekiah fears is not pain but separation. To die is to leave “the land of the living,” where the Lord is worshipped in the temple, and to go where no one sees Him. That idea runs through the psalm, and it leads to one of the chapter’s most important theological questions (see the note on verse 18).
    sources: [biblehub-interlinear, delitzsch]
  - ref: 12
    phrase: 'removed from me as a shepherd’s tent: I have cut off like a weaver my life'
    kind: symbol
    title: A tent pulled down, cloth cut from the loom
    body: |
      Hezekiah uses two images from ordinary work. A shepherd’s tent is a nomad’s dwelling, pulled up and carried off. And a weaver who finishes a piece rolls up the cloth and cuts the threads that tie it to the loom. Death is the moment the cloth is cut free.

      Paul uses the tent image for the mortal body: “if our earthly house of this tabernacle were dissolved, we have a building of God… eternal in the heavens” ([[2 Cor. 5:1]]). Peter, expecting death, wrote, “shortly I must put off this my tabernacle” ([[2 Pet. 1:14]]). Hezekiah sees the tent coming down. Paul and Peter know there is another house waiting.
    sources: [delitzsch, lds-scriptures]
  - ref: 14
    phrase: O LORD, I am oppressed; undertake for me
    kind: christ
    title: '“Undertake for me”: be my surety'
    body: |
      The Hebrew verb is *ʿorbēnî*, from *ʿārab*, “to stand surety” or “to guarantee” someone. It is the verb Judah uses when he pledges his own life for Benjamin: “I will be surety for him; of my hand shalt thou require him” ([[Gen. 43:9]]). Job uses it when he asks God to be his guarantor, since no one else will ([[Job 17:3]]).

      So Hezekiah is not just saying “help me.” He is saying, in effect: *There is pressure on me like an unmerciful creditor’s. Be bail for me.*

      The New Testament gives Jesus exactly this role. He is “made a surety of a better testament” ([[Heb. 7:22]]). The Book of Mormon uses the same logic when it describes Christ as one who stands between us and justice, “having… taken upon himself their iniquity and their transgressions, having redeemed them, and satisfied the demands of justice” ([[Mosiah 15:9]]). Hezekiah’s cry, “undertake for me,” is one Christ has answered.
    sources: [delitzsch, biblehub-interlinear, lds-scriptures]
  - ref: 17
    phrase: thou hast in love to my soul delivered it from the pit of corruption
    kind: words
    title: Held back from the pit
    body: |
      Verse 17 is the hinge of the psalm. It opens by doubling a word: *mar-lî mār*, “bitter to me, bitter.” The doubling gives the word superlative force. The bitterness was real, but it has become peace.

      The next line says God *ḥāšaqtā* my soul out of the pit, the verb for love as a firm inward bond. The KJV’s “in love to my soul” keeps that sense, and one commentator hears in it that God “loved him out” of the pit. The suffering, on this reading, was a chastisement of love.

      Elihu’s speech in Job speaks of a messenger who says, “Deliver him from going down to the pit: I have found a ransom” ([[Job 33:24]]). That ransom is exactly what Hezekiah asked for in verse 14.
    sources: [delitzsch, biblehub-interlinear, lds-scriptures]
  - ref: 17
    phrase: for thou hast cast all my sins behind thy back
    kind: christ
    title: Sins behind His back
    body: |
      To put something behind your back is to treat it as something you do not wish to be reminded of. Hezekiah connects his physical healing with forgiveness. When the Savior healed the paralyzed man, He first said, “Son, thy sins be forgiven thee” ([[Mark 2:5]]).

      Scripture has a whole vocabulary for what the Lord does with forgiven sin. He casts it “into the depths of the sea” ([[Micah 7:19]]), removes it “as far as the east is from the west” ([[Ps. 103:12]]), blots it out and does not remember it ([[Isa. 43:25]]). The Lord told the Latter-day Saints, “he who has repented of his sins, the same is forgiven, and I, the Lord, remember them no more” ([[D&C 58:42]]).
    sources: [delitzsch, lds-scriptures]
  - ref: 18
    phrase: For the grave cannot praise thee, death can not celebrate thee
    kind: words
    title: Can the dead praise God?
    body: |
      “The grave” here is *šĕʾôl*, Sheol, the Hebrew name for the realm of the dead. Hezekiah’s argument, which appears in several psalms, is that the dead cannot praise God, so God should keep him alive to do it: “In death there is no remembrance of thee: in the grave who shall give thee thanks?” ([[Ps. 6:5]]; compare [[Ps. 88:10–12]]).

      This is an accurate report of how most of the Old Testament speaks about death. Sheol is silent, and the hope of resurrection comes into sharper focus only in a few passages, among them Isaiah’s own “Thy dead men shall live” ([[Isa. 26:19]]) and [[Dan. 12:2]]. This comfortless view of the future state is common in the Psalms, and its decisive removal came only through the progress of salvation history. Revelation often comes “line upon line” ([[Isa. 28:10]]).

      Latter-day revelation opens the rest of the picture. The spirits of the dead are not silent. Christ went and “preached unto the spirits in prison” ([[1 Pet. 3:18–19]]), and President Joseph F. Smith saw the righteous dead “filled with joy and gladness… rejoicing together because the day of their deliverance was at hand” ([[D&C 138:15]]). Hezekiah was right that the living have a special opportunity: “this life is the time for men to prepare to meet God” ([[Alma 34:32]]). He was wrong that the dead can’t praise.
    sources: [bd-sheol, delitzsch, lds-scriptures]
  - ref: 19
    phrase: the father to the children shall make known thy truth
    kind: history
    title: Telling the children
    body: |
      Hezekiah’s vow ends with teaching. The added years are for praise, and praise includes passing the story on. Moses commanded Israel to teach the Lord’s works “diligently unto thy children” ([[Deut. 6:7]]), and the Psalms repeat the ideal: “We will not hide them from their children, shewing to the generation to come the praises of the LORD” ([[Ps. 78:4]]).

      There is a painful irony here. Manasseh was not yet born when Hezekiah wrote this, and he became the most wicked king in Judah’s history ([[2 Kgs. 21:1–16]]). The text doesn’t say what Manasseh was taught, but it reports that late in his life he humbled himself and repented ([[2 Chr. 33:12–13]]). 
    sources: [delitzsch, lds-scriptures]
  - ref: 21
    phrase: Let them take a lump of figs, and lay it for a plaster upon the boil
    kind: history
    title: A poultice of figs
    body: |
      The healing came by miracle and by medicine together. Figs were a well-known remedy, used to bring a swelling to a head. The word for “boil,” *šĕḥîn*, means an abscess; the same word is used for the plague of boils in Egypt ([[Ex. 9:9]]). The cake of figs was not expected to work as a specific cure; it served what the Lord had already said would happen.

      Latter-day Saints will recognize the pattern. The Lord promised healing by faith and also instructed that the sick who lack that faith “shall be nourished with all tenderness, with herbs and mild food” ([[D&C 42:43]]). Faith and medicine are not rivals. The prophet who promised fifteen years also asked for figs.

      One textual detail: verses 21–22 stand out of order. In [[2 Kgs. 20:7–8]] the same material appears in its natural place, before the sign. One suggestion is that the verses were left out of their place at the close of verse 6 by oversight and then added in the margin, where they now stand. That would explain why they read like an afterthought.
    sources: [delitzsch, lds-scriptures]
  - ref: 22
    phrase: What is the sign that I shall go up to the house of the LORD?
    kind: christ
    title: Up to the temple on the third day
    body: |
      In Kings the promise is more specific: “on the third day thou shalt go up unto the house of the LORD” ([[2 Kgs. 20:5]]). A king under a sentence of death is raised up and goes to the temple on the third day.

      It would be too much to call this a prophecy of the Resurrection; neither Isaiah nor Kings presents it that way. But Hosea uses the same pattern for Israel’s restoration: “in the third day he will raise us up, and we shall live in his sight” ([[Hosea 6:2]]). The Son of David who was actually dead, not merely sick unto death, rose on the third day, and He told Mary Magdalene, “I ascend unto my Father, and your Father” ([[John 20:17]]).
    sources: [lds-scriptures]

christ: |
  Hezekiah is a son of David under a sentence of death, who prays with tears and is heard. The New Testament describes Jesus in almost exactly those terms: “in the days of his flesh, when he had offered up prayers and supplications with strong crying and tears unto him that was able to save him from death, and was heard” ([[Heb. 5:7]]). The difference is that Hezekiah was spared death, and Christ was saved *through* it.

  Hezekiah’s cry in verse 14, “undertake for me,” asks for a guarantor who will pay a debt the sufferer cannot pay. Jesus is that surety ([[Heb. 7:22]]). The psalm’s turning point, “thou hast cast all my sins behind thy back” (verse 17), describes what His Atonement accomplishes. And Hezekiah’s fear that the dead cannot praise God (verse 18) is answered by Christ’s visit to the spirit world, where the righteous dead sang praises and “bowed the knee and acknowledged the Son of God as their Redeemer” ([[D&C 138:23]]).

explore: |
  - **The parallel accounts.** Compare Isaiah 38 with [[2 Kgs. 20:1–11]] and [[2 Chr. 32:24–26]]. What does each add, and why might Isaiah’s version include the psalm?
  - **Other songs of deliverance.** Read Hezekiah’s psalm alongside [[Jonah 2]], [[Ps. 30]], and [[Ps. 116]]. All three move from the pit to praise.
  - **The surety.** Follow the verb *ʿārab* from Judah’s pledge for Benjamin ([[Gen. 43:9]]; [[Gen. 44:32–33]]) to [[Heb. 7:22]].
  - **Death and the spirit world.** Trace the development from Sheol in the Psalms to [[Dan. 12:2]], [[1 Pet. 3:18–20]], [[1 Pet. 4:6]], and [[D&C 138]].
  - **Isaiah’s hinge.** Read chapters 36–39 as a unit and ask how Hezekiah’s personal story mirrors Jerusalem’s.

parallels:
  - ref: 2 Kgs. 20:1–11
    note: The same account, without the psalm, with the fig poultice and sign in their natural order.
  - ref: 2 Chr. 32:24–26
    note: The Chronicler’s brief summary, which adds that Hezekiah’s heart was lifted up afterward.
  - ref: Hel. 12:14–15
    note: Mormon on the Lord’s power over the earth and sun.

sources: [bd-hezekiah, delitzsch, biblehub-interlinear, bd-sheol, lds-scriptures]
