chapter: 38
title: Fifteen Years and a Song of Thanks
tagline: King Hezekiah turns his face to the wall and prays, the Lord adds fifteen years to his life, and the king writes a psalm of gratitude.
when: 'c. 703–701 BC, shortly before the Assyrian siege'

setting: |
  Chapters 38 and 39 are not in chronological order with 36 and 37. Verse 6 promises that the Lord *will* deliver Jerusalem from Assyria, so Hezekiah’s illness came before the deliverance described in chapter 37. Isaiah placed these two chapters last on purpose. Chapter 39 introduces Babylon, and that sets the stage for chapters 40–66, which speak to the exiles in Babylon.

  The chapter has two parts: the story of Hezekiah’s illness and healing (verses 1–8, 21–22), and a psalm Hezekiah wrote after he recovered (verses 9–20). The parallel account in [[2 Kgs. 20:1–11]] is shorter and does not include the psalm.

thread: |
  Isaiah 38 is about **what a person learns when life is given back**.

  The story begins with a hard message. Isaiah tells the king, “Set thine house in order: for thou shalt die, and not live” (verse 1). Hezekiah turns his face to the wall, prays, and weeps. And before Isaiah has even left the palace grounds ([[2 Kgs. 20:4]]), the Lord sends him back: “I have heard thy prayer, I have seen thy tears: behold, I will add unto thy days fifteen years” (verse 5). As a sign, the shadow on the stairway of Ahaz moves backward ten steps (verse 8).

  Then Hezekiah writes a song. It moves from despair to gratitude. First he describes what it felt like to face death: his life being folded up like a shepherd’s tent and cut off like cloth from a loom, moaning like a dove (verses 10–14). Then comes the turn: “thou hast in love to my soul delivered it from the pit… for thou hast cast all my sins behind thy back” (verse 17). He ends by resolving to spend his added years praising the Lord and teaching his children (verses 19–20).

  The chapter shows a God who hears prayer and sees tears. It also shows that healing came through both a miracle and ordinary means, since Isaiah prescribed a poultice of figs (verse 21). And it gently raises a question every person who has been given more time must answer: *What will I do with the years the Lord adds?*
