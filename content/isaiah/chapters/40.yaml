chapter: 40
title: Comfort Ye My People
tagline: A voice in the wilderness announces that Israel’s hard service is over, the Lord is coming, and the Creator who numbers the stars gives strength to the weary.
when: 'Addressed to the exiles in Babylon (6th century BC)'

setting: |
  Chapter 39 ended with a prophecy that Judah’s treasures and princes would be carried to Babylon. Chapter 40 begins as if that had already happened. The readers are exiles. Jerusalem lies in ruins, the temple is gone ([[2 Kgs. 25:8–9]]), and many feel that the Lord has turned away from them (verse 27). No king or date is named, and Isaiah himself is never mentioned in chapters 40–66.

  That shift is the main reason many modern scholars hold that chapters 40–55 come from an anonymous prophet among the exiles (“Second Isaiah” or “Deutero-Isaiah”), with chapters 56–66 later still (“Third Isaiah”). They point to the Babylonian setting and to the naming of Cyrus ([[Isa. 44:28]]; [[Isa. 45:1]]). Others have defended Isaiah’s authorship of the whole book, pointing to what the two halves share: the name “Holy One of Israel,” the interchange of Jacob and Israel, and a common manner of speaking. More recent work reads the book as a deliberately shaped whole, and the opening verses of chapter 40, widely treated as the introduction to a new section, are central to that discussion.

  Latter-day Saints have their own evidence to weigh. Nephi read Isaiah to his people from the brass plates, which were brought out of Jerusalem before it fell ([[1 Ne. 19:22–23]]), and he and Jacob quote Isaiah 48 through 52:2 ([[1 Ne. 20–21]]; [[2 Ne. 7–8]]). The risen Savior spoke of the words of Isaiah he had just quoted, and commanded the Nephites to search them ([[3 Ne. 20:11]]; [[3 Ne. 23:1–3]]). For readers who accept the Book of Mormon as history, that places at least part of 40–66 before the exile. See [How to Read Isaiah](/isaiah/guides/how-to-read-isaiah/) for more. Whatever position one takes, the chapters are *addressed* to exiles, and reading them that way is the key to understanding them.

thread: |
  Isaiah 40 answers one question: **can a defeated people still trust their God?**

  The chapter opens with a divine command whose audience is not named (some read it as the heavenly council; see the first note). Voices are commanded to comfort Jerusalem: her “warfare,” her term of hard service, is over, and her sin is pardoned (verses 1–2). A voice calls for a highway through the desert for the Lord Himself (verses 3–5). Another voice is told to cry, and asks what there is to say, since all flesh is grass. The answer: yes, people wither, “but the word of our God shall stand for ever” (verses 6–8). And Zion is told to climb a mountain and announce the good news to the cities of Judah: “Behold your God!” He comes with power, and He comes as a shepherd carrying lambs (verses 9–11).

  Then the tone changes to argument. Isaiah elsewhere pictures Babylon’s gods loaded onto animals and carried ([[Isa. 46:1]]; [[Isa. 46:7]]). Here he answers with a series of rhetorical questions. Who measured the oceans in His palm? Who advised Him? What can you compare Him to? A statue that a craftsman has to set up so it won’t fall over? (verses 12–26). The nations are a drop in a bucket. The rulers wither. The stars, which Babylon’s stargazers read ([[Isa. 47:13]]), are His host, and He calls every one by name.

  The chapter ends by turning that cosmic argument into pastoral care. “Why sayest thou, O Jacob… My way is hid from the LORD?” (verse 27). The God who never grows tired gives strength to those who have none, and “they that wait upon the LORD shall renew their strength” (verse 31). The greatness of God is not an argument for His distance. It is the reason He can carry the weary.

sections:
  - range: 1-2
    heading: Comfort Jerusalem
    plain: |
      “Comfort, comfort My people,” says your God. “Speak tenderly to Jerusalem, and announce to her that her hard service is over, that her guilt has been paid for, that she has received from the Lord’s hand double for all her sins.”
  - range: 3-5
    heading: A highway in the desert
    plain: |
      A voice calls out: “Clear a way for the Lord in the wilderness. Build a straight highway in the desert for our God. Every valley will be raised and every mountain and hill made low. The uneven ground will become level and the rough places a plain. Then the glory of the Lord will be revealed, and all humanity together will see it, for the Lord Himself has spoken.”
  - range: 6-8
    heading: The word that stands forever
    plain: |
      A voice said, “Cry out!” And I asked, “What should I cry out?” “All people are grass, and all their faithfulness is like wildflowers. The grass withers and the flowers fade when the breath of the Lord blows on them. Yes, the people are grass. The grass withers and the flowers fade, but the word of our God stands forever.”
  - range: 9-11
    heading: '“Behold your God!”'
    plain: |
      Zion, herald of good news, climb up on a high mountain. Jerusalem, herald of good news, raise your voice and shout; raise it and don’t be afraid. Tell the cities of Judah, “Here is your God!” Look, the Lord God comes with strength, and His arm rules for Him. His reward is with Him, and what He has won goes before Him. He tends His flock like a shepherd. He gathers the lambs in His arms and carries them close to His heart. He gently leads the mothers of the young.
  - range: 12-17
    heading: The God who needs no counselor
    plain: |
      Who has measured the oceans in the hollow of his hand, or marked off the sky with the width of his fingers? Who has held the dust of the earth in a basket, or weighed the mountains on a scale and the hills in a balance? Who has directed the Spirit of the Lord, or advised Him as His counselor? Whom did He consult, and who taught Him the right way? Who gave Him knowledge or showed Him the path of understanding? The nations are like a drop in a bucket. They are no more than dust on the scales. He picks up the islands like fine powder. All of Lebanon’s forests would not be enough fuel for His altar, and all its animals would not be enough for a burnt offering. All the nations are as nothing before Him. He regards them as less than nothing, as emptiness.
  - range: 18-26
    heading: To whom will you compare Him?
    plain: |
      To whom, then, will you compare God? What image will you set beside Him? An idol? A craftsman casts it, a goldsmith overlays it with gold and makes silver chains for it. A person too poor for that chooses wood that won’t rot and looks for a skilled craftsman to set up an idol that won’t topple over. Don’t you know? Haven’t you heard? Haven’t you been told from the beginning? Haven’t you understood since the earth was founded? God sits enthroned above the circle of the earth, and its people are like grasshoppers. He stretches out the heavens like a curtain and spreads them out like a tent to live in. He reduces rulers to nothing and makes the judges of the earth meaningless. They are barely planted, barely sown, barely rooted in the ground, when He blows on them and they wither, and a storm carries them off like straw. “To whom will you compare Me, or who is My equal?” asks the Holy One. Look up and see: who created all these? He leads out the stars like an army, one by one, and calls each one by name. Because of His great power and mighty strength, not one of them is missing.
  - range: 27-31
    heading: Strength for the weary
    plain: |
      Jacob, why do you say, and Israel, why do you complain, “My situation is hidden from the Lord, and my God ignores my case”? Don’t you know? Haven’t you heard? The Lord is the everlasting God, the Creator of the whole earth. He never grows tired or weary, and no one can measure His understanding. He gives strength to the weary and power to those who are exhausted. Even young people grow tired and weary, and strong young men stumble and fall. But those who hope in the Lord will renew their strength. They will soar on wings like eagles. They will run and not grow weary. They will walk and not grow faint.

notes:
  - ref: 1
    phrase: Comfort ye, comfort ye my people, saith your God
    kind: words
    title: Who is being told to comfort?
    body: |
      The Hebrew imperatives (*naḥămû*, “comfort”; *dabbĕrû*, “speak”; *qirʾû*, “cry”) are plural: “Comfort, all of you.” Who is being addressed? The verse doesn’t say.

      A widely discussed modern proposal (1953) reads the scene as the **heavenly council**, the assembly of divine attendants around the Lord’s throne that Isaiah saw in chapter 6 ([[Isa. 6:1–8]]; compare [[1 Kgs. 22:19–22]]). On this reading God commands His messengers, and their voices answer (verses 3 and 6). Others treat the passage as the call of a new prophet, since a voice asks, “What shall I cry?” (verse 6).

      The doubled word is typical of these chapters: “Awake, awake” ([[Isa. 51:9]]; [[Isa. 52:1]]), “I, even I” ([[Isa. 43:11]]; [[Isa. 51:12]]). Delitzsch says the word is repeated “because of its urgency.” After thirty-nine chapters dominated by warnings, the first word of the new section is *comfort*, twice.
    sources: [seitz-divine-council, delitzsch, biblehub-interlinear]
  - ref: 2
    phrase: Speak ye comfortably to Jerusalem
    kind: words
    title: Speak to her heart
    body: |
      “Speak comfortably” is literally *dabbĕrû ʿal-lēb*, “speak to the heart.” It is the language of winning someone over. Shechem “spake kindly unto” Dinah, literally to her heart ([[Gen. 34:3]]). Boaz “spoken friendly” to Ruth, again to her heart ([[Ruth 2:13]]). And in Hosea the Lord promises to win back unfaithful Israel: “I will allure her, and bring her into the wilderness, and speak comfortably unto her” ([[Hosea 2:14]]). Delitzsch hears this earlier prophecy behind Isaiah’s verse.

      So the Lord is not just announcing that the exile is over. He is winning Jerusalem over again. That marriage imagery will become explicit later: “thy Maker is thine husband” ([[Isa. 54:5]]).
    sources: [biblehub-interlinear, delitzsch]
  - ref: 2
    phrase: 'that her warfare is accomplished, that her iniquity is pardoned: for she hath received of the LORD’s hand double for all her sins'
    kind: words
    title: Hard service and “double”
    body: |
      The word for “warfare,” *ṣābāʾ*, is the word behind “Lord of hosts.” It means an army, and by extension war and service. BDB lists this verse under “hard service of troubled life,” with Job’s complaint: “Is there not an appointed time to man upon earth?” ([[Job 7:1]]), where “appointed time” is *ṣābāʾ*. Jerusalem’s enlistment is up.

      “Her iniquity is pardoned” uses *nirṣâ*, from *rāṣâ*, which BDB glosses here as “her punishment is accepted (as satisfactory).” The same root is used of sacrifices being “accepted” ([[Lev. 1:4]]) and of the land paying off its sabbaths ([[Lev. 26:34]]): the debt has been satisfied.

      “Double for all her sins” is harder. It could mean that Jerusalem has suffered twice what her sins deserved, which would be a strange thing for a just God to admit. Delitzsch rejects that: Jerusalem had not suffered more than her sins deserved, but God’s compassion regarded what justice had required as superabundant, so that nothing is left for further punishment. Others take “double” as the double favor that follows. BDB glosses the noun “the double,” here “of retribution.” (Compare [[Ex. 22:4]] and [[Ex. 22:7]], where theft is repaid double.) Either way, the message is that the account is closed. Latter-day Saints may hear an echo of the Atonement here, but in context the verse speaks of Israel’s own suffering in exile, not a substitute.
    sources: [bdb, delitzsch, biblehub-interlinear]
  - ref: 3
    phrase: The voice of him that crieth in the wilderness, Prepare ye the way of the LORD
    kind: christ
    title: A voice in the wilderness
    body: |
      This verse can be punctuated two ways. The Hebrew accents (the Masoretic cantillation marks, which guide how the text is chanted and parsed) join “in the wilderness” to the command: *A voice cries out: “In the wilderness prepare the way of the LORD.”* The Greek Septuagint, the Targum, and the Gospels attach “in the wilderness” to the voice: *The voice of one crying in the wilderness: “Prepare the way.”* The KJV follows the second.

      Both readings have had a long life. All four Gospels apply the verse to **John the Baptist**, whose preaching in the wilderness prepared for Jesus ([[Matt. 3:3]]; [[Mark 1:3]]; [[Luke 3:4–6]]; [[John 1:23]]). Some six hundred years before John, Lehi had prophesied of a prophet who would “prepare the way of the Lord” and “cry in the wilderness” ([[1 Ne. 10:7–8]]).

      In its first setting the highway is for the Lord Himself, coming to His people through the desert, like a new Exodus: Delitzsch notes that He went through the desert to redeem Israel out of Egypt, and that His people were to look for Him again by the same road.

      The Lord has repeated the call in our dispensation: “Prepare ye the way of the Lord, and make his paths straight, for the hour of his coming is nigh” ([[D&C 33:10]]; compare [[D&C 65:1]]).
    sources: [delitzsch, lxx-rahlfs, biblehub-interlinear]
  - ref: 4
    phrase: Every valley shall be exalted, and every mountain and hill shall be made low
    kind: scripture
    title: Mountains made low
    body: |
      Delitzsch pictures the crier as a king’s outrider, who sees that the road the king will travel is put into good condition; here the road runs through a pathless desert. Isaiah’s version is on a geological scale.

      Luke quotes the passage at length, through “all flesh shall see the salvation of God” ([[Luke 3:4–6]]), and the Joseph Smith Translation of Luke 3 extends it: the JST appendix summarizes that chapter as saying that Christ will come as prophesied to bring salvation, and that “in the fulness of times, He will come again to judge the world.” Latter-day revelation applies the same words to the earth at the Second Coming. The Saints are to look “for the valleys to be exalted, and for the mountains to be made low” ([[D&C 49:23]]; compare [[D&C 109:74]]; [[D&C 133:22]]).

      There is a moral reading too, and Luke’s context invites it. John’s preaching leveled people: the proud were brought low and the humble lifted up ([[Luke 3:10–14]]). The same pattern runs through Mary’s song: “He hath put down the mighty from their seats, and exalted them of low degree” ([[Luke 1:52]]).

      The Book of Mormon records the road-building undone. At the Savior’s death, in the land northward “the highways were broken up, and the level roads were spoiled, and many smooth places became rough” ([[3 Ne. 8:13]]). That pairing of “smooth” and “rough” matches Luke’s paraphrase (“the rough ways shall be made smooth,” [[Luke 3:5]]) better than Isaiah’s own wording, as a Scripture Central KnoWhy observes, and here it runs backward. Before that year ended, the Lord Himself came down to the survivors at the temple in Bountiful ([[3 Ne. 10:18]]; [[3 Ne. 11:8]]).
    sources: [delitzsch, jst-lk-3, sc-knowhy-754]
  - ref: 6
    phrase: The voice said, Cry. And he said, What shall I cry?
    kind: words
    title: '“And I said”: a variant in the Great Isaiah Scroll'
    body: |
      The Masoretic Text reads “and **he** said” (*wĕʾāmar*). The Septuagint reads “and **I** said” (*kai eipa*), and modern translations such as the NRSVUE and NIV follow it. The Great Isaiah Scroll from Qumran (1QIsaᵃ) may support “I”: its consonants can be read “and I said,” though some have read them as “and she said.” The difference is small in Hebrew, but it changes the passage: with “I,” a prophetic figure speaks in the first person, and verses 1–8 read more like a call narrative, much like Isaiah’s own call in chapter 6, where he also answered a heavenly voice ([[Isa. 6:8–11]]).
    sources: [seitz-divine-council, biblehub-interlinear, lxx-rahlfs, nrsvue, niv, great-isaiah-scroll]
  - ref: 8
    phrase: 'The grass withereth, the flower fadeth: but the word of our God shall stand for ever'
    kind: words
    title: Grass and the word
    body: |
      Grass and wildflowers do not last once the wind passes over them: “For the wind passeth over it, and it is gone” ([[Ps. 103:16]]). The “spirit” (*rûaḥ*) of the Lord in verse 7 is the same word as “wind”; BDB lists this verse under “wind of heaven.” Delitzsch takes it as the breath of God the Creator, “whose most characteristic elementary manifestation is the wind.” Human glory, even that of Israel’s oppressors, is that transient.

      The “goodliness” of verse 6 is *ḥesed*, a word usually translated “mercy” or “lovingkindness.” BDB gives this verse a sense of its own, “lovely appearance,” and notes that the Greek (“glory,” as Peter quotes it) may reflect a different original reading. On either reading the point is that even the best of what people have fades. Only God’s word stays.

      Peter quotes verses 6–8 and adds an interpretation: “And this is the word which by the gospel is preached unto you” ([[1 Pet. 1:24–25]]). The promise is personal: “though the heavens and the earth pass away, my word shall not pass away, but shall all be fulfilled” ([[D&C 1:38]]).
    sources: [bdb, delitzsch, lxx-rahlfs]
  - ref: 9
    phrase: O Zion, that bringest good tidings, get thee up into the high mountain
    kind: christ
    title: The herald of good tidings
    body: |
      “That bringest good tidings” translates *mĕbaśśeret*, a feminine participle of the verb *bāśar*, “to bear tidings” (BDB). The Greek translators rendered it with *euangelizomai*, the verb behind *euangelion*, “gospel.” Delitzsch notes that this verb lies at the root of the New Testament *euangelizein*. This is one of the Old Testament roots of the word *gospel*.

      Grammatically, the phrase can mean either “Zion, the herald of good news” (Zion herself announces it to the cities of Judah) or “herald of good news to Zion.” The KJV takes the first, and Delitzsch defends it. The Hebrew allows both.

      The message itself is short: *hinnēh ʾĕlōhêkem*, “Behold your God!” Isaiah will develop the herald image in [[Isa. 52:7]], “How beautiful upon the mountains are the feet of him that bringeth good tidings,” which Abinadi applied to Christ and to all who publish peace ([[Mosiah 15:14–18]]).
    sources: [biblehub-interlinear, bdb, lxx-rahlfs, delitzsch, seitz-divine-council]
  - ref: 11
    phrase: 'He shall feed his flock like a shepherd: he shall gather the lambs with his arm, and carry them in his bosom'
    kind: christ
    title: The mighty arm that carries lambs
    body: |
      Verse 10 and verse 11 use the same body part in opposite ways. In verse 10 the Lord’s **arm** rules with strength, the arm of a conqueror. In verse 11 the same arm gathers lambs and carries them against His chest. Isaiah refuses to separate God’s power from His tenderness.

      Delitzsch explains the picture: the shepherd takes in his arm the lambs that cannot keep pace, carries them in the fold of his garment, and does not overdrive the nursing mothers ([[Gen. 33:13]]). Jesus claimed the image: “I am the good shepherd” ([[John 10:11]]). Nephi, drawing on Isaiah, promised that the Holy One of Israel “gathereth his children from the four quarters of the earth; and he numbereth his sheep, and they know him” ([[1 Ne. 22:25]]). And the risen Lord told the Nephites that they were the “other sheep” He had spoken of in Jerusalem ([[3 Ne. 15:21]]).
    sources: [delitzsch]
  - ref: 13
    phrase: Who hath directed the Spirit of the LORD, or being his counsellor hath taught him?
    kind: history
    title: A God with no advisers
    body: |
      Verses 12–14 are a string of questions like the Lord’s questions to Job ([[Job 38:4–5]]). Delitzsch reads verses 13–14 as a reminder of God’s omniscience, which “precludes all instruction from without,” and takes “the Spirit of Jehovah” to be the Spirit that moved on the waters at creation. Isaiah insists that Israel’s God consulted no one.

      Paul quotes this verse, following the Greek “mind of the Lord” (*noun Kyriou*), to close his long meditation on God’s ways: “For who hath known the mind of the Lord? or who hath been his counsellor?” ([[Rom. 11:34]]; compare [[1 Cor. 2:16]]).

      Latter-day Saints, who believe in a premortal council in heaven ([[Abr. 3:22–28]]), might pause here. But the councils of the Restoration are councils in which God presides and His children are taught. The point of Isaiah’s question stands: God’s wisdom is not borrowed from anyone.
    sources: [delitzsch, lxx-rahlfs]
  - ref: 26
    phrase: he calleth them all by names by the greatness of his might, for that he is strong in power; not one faileth
    kind: history
    title: He calls the stars by name
    body: |
      Isaiah elsewhere mocks Babylon’s “stargazers” ([[Isa. 47:13]]), and the exiles lived under that sky. Isaiah tells them to look up and see not gods, but an army (“their host”; BDB lists this word among the terms for the sun, moon, and stars) that God leads out “by number” and calls by name. Delitzsch pictures a general leading out his army, with not one of the innumerable host left behind.

      Latter-day revelation expands the vision. The Lord told Moses that His creations are “innumerable… unto man; but all things are numbered unto me, for they are mine and I know them” ([[Moses 1:35]]). Abraham saw the stars and was told which were the governing ones ([[Abr. 3:1–10]]). He was also shown the premortal spirits and told, “thou wast chosen before thou wast born” ([[Abr. 3:22–23]]).

      That is the logic of the chapter’s last section. If He knows every star by name, He hasn’t lost track of Jacob.
    sources: [delitzsch, bdb]
  - ref: 31
    phrase: But they that wait upon the LORD shall renew their strength
    kind: words
    title: Waiting as hope
    body: |
      “Wait upon” is *qôwê*, from *qāwâ*, “wait for” (BDB). It is not passive waiting in line. Delitzsch describes the Old Testament’s words for faith as “trust, hope, and longing,” and the verb is used of a watchman waiting for dawn in the same spirit ([[Ps. 130:5–6]]). BDB thinks the verb “probably” meant originally “twist, stretch,” then the tension of enduring and waiting.

      “Renew” is *ḥālap*. In this stem BDB glosses it “change for the better, renew,” with “strength” as its object here; the basic sense is to pass on, change, or substitute. The Septuagint reads “shall exchange strength” (*allaxousin ischyn*). One can hear in it a trade: those who hope in the Lord give up their strength for His.

      The Lord had told Israel at Sinai, “I bare you on eagles’ wings, and brought you unto myself” ([[Ex. 19:4]]).
    sources: [bdb, biblehub-interlinear, lxx-rahlfs, delitzsch]
  - ref: 31
    phrase: they shall run, and not be weary; and they shall walk, and not faint
    kind: scripture
    title: The Word of Wisdom’s promise
    body: |
      Latter-day Saints know these words from the promise at the end of the Word of Wisdom: those who obey “shall run and not be weary, and shall walk and not faint” ([[D&C 89:20]]). The Lord takes Isaiah’s promise to the exiles and attaches it to a law of health, and then adds that the destroying angel “shall pass by them, as the children of Israel” ([[D&C 89:21]]). Two exodus images, the eagle’s wings and the Passover, frame the promise.

      Notice the order in Isaiah: soaring, then running, then walking. It sounds like an anticlimax, but it’s realistic. Most of discipleship is walking. The promise that matters most on an ordinary day may be the last one: to keep going and not faint.

christ: |
  All four Gospels open Jesus’s ministry with Isaiah 40:3. John the Baptist was the voice in the wilderness, and Jesus was the Lord whose way he prepared. The Gospel writers took Isaiah’s “our God” and applied it to Jesus without hesitation. For Latter-day Saints that is exactly right: the Lord (Jehovah) who promised to come to Zion is Jesus Christ.

  The good news the herald announces in verse 9 is “Behold your God!” and it is the root of the word *gospel*. The God who comes “with strong hand” also carries lambs in His bosom (verses 10–11), and Jesus called Himself the Good Shepherd. The chapter’s final promise, strength to the weary, is His invitation: “Come unto me, all ye that labour and are heavy laden, and I will give you rest” ([[Matt. 11:28]]).

explore: |
  - **The voice in the wilderness.** Compare [[Matt. 3:1–3]], [[Luke 3:2–6]], [[John 1:19–23]], and [[1 Ne. 10:7–10]].
  - **The good-news herald.** Trace *bāśar* through [[Isa. 41:27]], [[Isa. 52:7]], [[Isa. 61:1]], and [[Mosiah 15:13–18]].
  - **God as Creator.** Read verses 12–26 alongside [[Job 38–39]], [[Ps. 104]], and [[Moses 1:27–39]].
  - **The idol satires.** Read [[Isa. 41:6–7]], [[Isa. 44:9–20]], and [[Isa. 46:1–7]] as a series.

parallels:
  - ref: Matt. 3:1–3
    note: John the Baptist as the voice in the wilderness (also Mark 1:2–3; Luke 3:4–6; John 1:23).
  - ref: 1 Ne. 10:7–10
    note: Lehi prophesies of the forerunner who would prepare the way of the Lord.
  - ref: 1 Pet. 1:24–25
    note: Peter quotes verses 6–8 and applies “the word” to the gospel.
  - ref: D&C 89:18–21
    note: The Word of Wisdom’s promise borrows verse 31.

sources: [delitzsch, seitz-divine-council, biblehub-interlinear, bdb, lxx-rahlfs, nrsvue, niv, great-isaiah-scroll, jst-lk-3, sc-knowhy-754]
