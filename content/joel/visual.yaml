alt: A river runs through open hill country and splits round a gravel bar. On its left bank a bare grey hillside with a few leafless trees and a scorched patch lies under a dark storm cloud; on its right bank green slopes, a wheat field, trees in leaf and small streams lie in clear light after rain.
