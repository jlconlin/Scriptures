summary: >-
  Joel is a reversal. Locusts, drought and fire strip the land under a darkened sky,
  and the prophet sees in it the day of the Lord. The people are called to turn, and
  the Lord answers: rain in its season, green pastures, every streambed running, and
  His Spirit poured out. The image sets the two parts of the book side by side across
  a river, the way a land looks when a storm has passed over part of it.
motifs:
  - A river coming through open hill country from the far distance, left of center, nearly straight and then splitting round a gravel bar.
  - "The left bank, the smaller part (Joel 1:7–12, 19–20; 2:2–3): a bare grey hillside with a scorched patch, four leafless pale trees standing far apart, and a dry stream bed, under a heavy dark storm cloud."
  - "The right bank, the larger part (Joel 2:21–23; 3:18): green slopes of new grass, one field of pale gold wheat, a few trees in full leaf, and thin bright streams running down into the river, under a clear sky after rain."
composition: >-
  A broad, uncluttered landscape from a high viewpoint, built from a few large
  shapes, with nothing in rows or evenly spaced. One light source, the sun out of
  frame at the upper right: shadows fall to the left, and the left bank is dim only
  because the cloud lies over it. The river is the brightest thing in the picture,
  and the picture as a whole is light. No sun or moon in the sky, no buildings, no
  wall, no locusts, no animals, no figures, and no object in the foreground.
# “What's in this picture” under the image on the book page: one line for each thing, with the verse it shows.
key:
  - '**The bare grey bank under the storm cloud** is the land after the locusts and the drought: “the field is wasted,” the fig tree’s branches “made white,” “the fire hath devoured the pastures of the wilderness” ([[Joel 1:7]]; [[Joel 1:10]]; [[Joel 1:19]]).'
  - '**The green bank in clear light, with its wheat and running streams,** is the Lord’s answer: “the pastures of the wilderness do spring,” “the floors shall be full of wheat,” and “all the rivers of Judah shall flow with waters” ([[Joel 2:22]]; [[Joel 2:24]]; [[Joel 3:18]]).'
  - '**The river between them** is the book’s turn from the wasted land to the green one, when the Lord answers His people’s fast ([[Joel 2:18–19]]).'
