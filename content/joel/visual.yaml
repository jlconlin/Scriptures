summary: >-
  Joel opens with an alarm: a ram's horn blown in Zion as the sky goes dark, the sun
  hidden and the moon turned to blood before the day of the Lord. The book turns when
  the Lord answers, and what He sends is poured out: rain first, then His Spirit. The
  image is the night of that turn, seen from the wall of Zion: a red moon on one side of the
  sky, and rain beginning to fall into the valley on the other.
motifs:
  - "Most important: a wide valley between dark hills at night, seen from a height, a few simple dark shapes with one thin pale thread of water along its floor (Joel 3:14, 18). The valley and the sky are the subject of the picture."
  - "Most important: a deep indigo night sky filling more than half the picture, with a low, full, dull red moon at the upper left, partly veiled by a dark cloud (Joel 2:10, 31), and on the right fine slanted lines of rain falling into the valley (Joel 2:23)."
  - "Low in the foreground: the top of a stone wall running along the bottom edge as a low dark band, with nothing on it (Joel 2:1)."
composition: >-
  A broad, calm night landscape. The wall's top is a low dark band across the bottom
  of the picture; everything above it is valley and sky. The left of the sky is dry
  and dark under the red moon; rain falls on the right, and where it falls the far
  slopes are a little lighter. One cool light throughout, as from the moon: indigo,
  slate and grey-blue, with the dull red of the moon the only warm color. Nothing is
  lit warmly from the front. Drawn as a flat, clearly illustrated picture with
  simplified shapes and gently graded areas of color, like a printed poster, not a
  photograph. No trees in the foreground, no sunrise, no sunbeams, no golden light,
  no buildings, no locusts, no figures, and no horn or any other object on the wall.
alt: A wide dark valley at night under a dull red moon half hidden by cloud, with rain falling on its far side, seen from the top of a stone wall.
status: proposed
