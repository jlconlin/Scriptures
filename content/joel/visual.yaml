summary: >-
  Joel opens with an alarm: a ram's horn blown in Zion as the sky goes dark, the sun
  hidden and the moon turned to blood before the day of the Lord. The book turns when
  the Lord answers, and what He sends is poured out: rain first, then His Spirit. The
  image is the horn on the wall at that turn, under a dark sky that has begun to give
  rain.
motifs:
  - "Most important, large and close in the right foreground: a single ram's horn (a shofar) lying flat on its side on the top of a city wall of fitted stone, so that its whole curve is seen from the side (Joel 2:1, 15). Its shape is one continuous sweeping arc, like a crescent or a wide letter C, the curve a ram's horn has on the animal's head: no straight stem and no sudden bend, and it must not look like a smoking pipe, a drinking horn or a cow's horn. It widens gradually and evenly from a small blunt tip at one end to an open mouth at the other, and that mouth faces sideways along the wall, not upward. Flattened in section, with close natural ridges across it along its whole length. Pale tan and cream, matte. It is the one large form in the picture."
  - "Most important: a night sky of deep indigo filling the upper two thirds, with a low, full, dull red moon at the upper left, partly veiled by a dark drifting cloud (Joel 2:10, 31)."
  - "Beyond and below the wall, a wide valley between dark hills, seen from above, with fine slanted lines of rain falling into it from the right side of the sky and a thin thread of water catching a little pale light on the valley floor (Joel 2:23; 3:18)."
composition: >-
  A view from the top of a high wall at night, looking out and down. The wall's flat
  stone top runs along the bottom of the picture, with the horn resting on it at the
  right. The valley opens beyond it. The left of the sky is dry and dark under the
  red moon; rain falls on the right. Cool indigo and slate throughout, with the red of
  the moon and the pale horn as the only warm notes. Drawn as a flat, clearly illustrated picture with simplified shapes and graded areas of color, as a printed poster is, not as a photograph: the valley is a few simple dark shapes, without photographic detail. No trees in the foreground, no
  sunrise, no sunbeams, no golden light, no buildings beyond the wall, no locusts,
  no figures.
alt: A ram's horn lies on top of a stone wall at night, above a wide dark valley where rain is falling, under a dull red moon half hidden by cloud.
status: proposed
