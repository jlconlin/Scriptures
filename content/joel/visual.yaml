summary: >-
  Joel begins with a land stripped to the bark by locusts and drought, and with the
  Lord's call to turn to Him even now. The book turns on His answer: rain in its
  season, threshing floors full of wheat, the years the locust ate restored, and His
  Spirit poured out on all flesh. The image rests on that turn from bare ruin to
  poured-out gift, quietly and without spectacle.
motifs:
  - A single fig tree, its bark stripped pale and its branches bare, with the first small green leaves and shoots returning along the lower limbs (Joel 1:7; 2:22). It is the one large form in the scene.
  - Soft rain falling in slanted lines from a bright break in the cloud onto the dry hills and the tree, a gentle gift and not a storm (Joel 2:23, 28).
  - A small stone threshing floor at the foot of the tree with a modest, gold heap of wheat on it (Joel 2:24).
composition: >-
  A dry hillside in the hill country of Judah in the quiet after a hard season. The
  stripped fig tree stands left of center as the focal point, with the threshing floor
  and its wheat at its foot, lit by low gold light. A break in the cloud at the upper
  right lets the rain fall in soft slanted lines across the middle ground, so that the
  nearest earth is dry and pale and the far slopes are touched with fresh green.
  Low distant hills sit under the open sky. No locusts, no buildings, no figures,
  and nothing broken or burning.
alt: A bare, pale-barked fig tree with new green leaves stands beside a small stone threshing floor holding a heap of wheat, while light rain falls from a break in the clouds over dry hills.
status: proposed
