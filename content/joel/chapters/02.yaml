chapter: 2
title: Turn Ye Even to Me
tagline: A trumpet sounds in Zion as an army darkens the sky. The Lord says it is not too late to turn, and He answers the fast with rain, with the years the locust ate, and with His Spirit poured out on all flesh.
when: 'Undated; Judah, between the 800s B.C. and the return from Babylon'

setting: |
  The book of Joel carries no date, and the Church’s reference works leave it open: the prophet “may have lived sometime between the reign of Joash, before 850 B.C., and the return of the tribe of Judah from captivity in Babylon.” Chapter 1 describes the drought and the locusts that were its occasion (the locusts are named at [[Joel 1:4]]; see the note on [[Joel 1:6]]).

  This chapter is the middle of one continuous prophecy, and the book turns inside it. Verses 1–11 sound an alarm over an invasion of the land. Verses 12–17 are “a plea to the Lord’s people for repentance and reform.” From verse 18 the Lord answers. The heading in the Church’s edition reads the opening scene as the last days: “War and desolation will precede the Second Coming.”

  Later scripture quotes the last five verses. Peter quoted them on the day of Pentecost ([[Acts 2:16–21]]), the angel Moroni quoted them to Joseph Smith in 1823 ([[JS—H 1:41]]), and Paul quoted verse 32 ([[Rom. 10:13]]). In the Hebrew Bible these verses “form a separate chapter by themselves,” so that Joel has four chapters there, and verses 28–32 of this chapter are its 3:1–5.

thread: |
  Two trumpet blasts divide the chapter. The first (verse 1) is an alarm: something is coming against Zion. The second (verse 15) opens with the same Hebrew words and calls a fast. Between them stands the Lord’s invitation, “turn ye even to me” (verse 12).

  From verse 18 on, the Lord answers what came before, often phrase for phrase. The invader “hath done great things” (verse 20), and in the next verse “the LORD will do great things”; the Hebrew phrase is the same. In chapter 1 the land mourned and the beasts groaned ([[Joel 1:10]]; [[Joel 1:18]]), and here each is told not to fear (verses 21–22). The priests asked that the Lord’s heritage not be made a reproach (verse 17), and He says it will be one no more (verse 19). The eaten years are repaid (verse 25).

  Then the answer goes past what was asked. The priests’ prayer asked that the people be spared. “Afterward” the Lord pours out His Spirit as He has poured out rain (verse 28). The day of the Lord opened the chapter as a threat to Zion. It closes the chapter as a day when there is deliverance in Zion for whoever calls on His name (verse 32).

sections:
  - range: 1-11
    heading: The alarm, and the army
    plain: |
      Blow the ram’s horn in Zion and sound the alarm on My holy mountain. Let everyone in the land tremble, for the day of the LORD is coming and is near: a day of darkness and gloom, of cloud and thick darkness. Spread over the mountains like the dawn comes a people great and strong, such as has never been and will not be again for generations. Fire goes before them and flame behind. The land ahead of them is like the garden of Eden; behind them it is a desolate wilderness, and nothing escapes. They look like horses and run like horsemen. They sound like chariots on the mountain tops, like fire crackling in stubble, like an army in battle order. Peoples are in anguish before them, and every face is in gloom. They run like warriors and scale the wall like soldiers; each keeps to his own path and none breaks rank or crowds another, and weapons do not stop them. They rush on the city, run along the wall, climb into the houses, and come in at the windows like a thief. The earth quakes and the heavens tremble before them; sun and moon go dark and the stars stop shining. The LORD gives voice before His army, for His camp is very great and the one who carries out His word is strong. The day of the LORD is great and very terrible. Who can endure it?
  - range: 12-14
    heading: Even now, turn
    plain: |
      Yet even now, says the LORD, turn to Me with all your heart, with fasting, weeping, and mourning. Tear your heart and not your clothes, and turn to the LORD your God, for He is gracious and merciful, slow to anger, and full of kindness, and He relents from sending harm. Who knows whether He will turn and relent, and leave a blessing behind Him: a grain offering and a drink offering for the LORD your God?
  - range: 15-17
    heading: The second trumpet
    plain: |
      Blow the ram’s horn in Zion, set apart a fast, call a solemn assembly. Gather the people and sanctify the congregation: the elders, the children, even nursing infants. Let the bridegroom leave his room and the bride her wedding canopy. Let the priests, the LORD’s ministers, weep between the porch and the altar and say: Spare Your people, O LORD, and do not make Your heritage a reproach, with the nations ruling over them. Why should it be said among the peoples, Where is their God?
  - range: 18-20
    heading: The Lord answers
    plain: |
      Then the LORD will be jealous for His land and have pity on His people. The LORD will answer them: I am sending you grain, wine, and oil, and you will have enough, and I will no longer make you a reproach among the nations. I will remove the northerner far from you and drive him into a dry and desolate land, his front toward the eastern sea and his rear toward the western sea, and the stench of him will rise, because he has done great things.
  - range: 21-27
    heading: Fear not, O land
    plain: |
      Do not fear, O land; be glad and rejoice, for the LORD will do great things. Do not fear, beasts of the field, for the wilderness pastures are green, the tree bears its fruit, and the fig tree and the vine give their full yield. Be glad, children of Zion, and rejoice in the LORD your God, for He has given you the early rain, and He sends down the rain for you, early rain and latter rain. The threshing floors will be full of wheat and the vats will overflow with wine and oil. I will repay you for the years that the locusts ate, My great army that I sent among you. You will eat plenty and be satisfied and praise the name of the LORD your God, who has dealt wondrously with you, and My people will never be put to shame. You will know that I am in the midst of Israel, that I am the LORD your God and there is no other, and My people will never be put to shame.
  - range: 28-32
    heading: The Spirit, the signs, and deliverance
    plain: |
      Afterward I will pour out My Spirit on all flesh. Your sons and daughters will prophesy, your old men will dream dreams, and your young men will see visions. Even on the servants and the handmaids I will pour out My Spirit in those days. I will show wonders in the heavens and on the earth: blood, fire, and pillars of smoke. The sun will be turned to darkness and the moon to blood before the great and terrible day of the LORD comes. And whoever calls on the name of the LORD will be delivered, for in mount Zion and in Jerusalem there will be deliverance, as the LORD has said, and among the remnant whom the LORD calls.

notes:
  - ref: 2
    phrase: as the morning spread upon the mountains
    kind: words
    title: Dawn, or blackness
    body: |
      The Hebrew word is *shachar*, “dawn,” so the oddity of a dark day that arrives like morning is in the Hebrew too. “Dawn” is its ordinary meaning, and it has also been read here as “blackness,” which would match the cloud and thick darkness named just before it. A modern translation takes that course: “Like blackness spread upon the mountains.” The Septuagint, the ancient Greek translation, keeps the dawn and says what is spreading: “a numerous and strong people shall be spread upon the mountains as the morning.”

      With either word, what spreads over the mountains is the “great people and a strong” of the next line.
    sources: [oshb-wlc, bdb, nrsvue, lxx-rahlfs]

  - ref: 2
    phrase: a great people and a strong
    kind: history
    title: Locusts or soldiers
    body: |
      What comes in verses 2–11 is described by comparison to an army, and later in the chapter the Lord calls the locusts His army. Their appearance is “as the appearance of horses”; they run “as horsemen,” “like mighty men,” “like men of war”; they sound “like the noise of chariots.” Each of these is a comparison. They darken the sky, strip the land, climb walls and houses, and come in at the windows. When the Lord answers, He names His army: “the locust … the cankerworm, and the caterpiller, and the palmerworm, my great army which I sent among you” (verse 25; the four names are at [[Joel 1:4]]). The army of verse 11 is likewise “his army.”

      One line recalls an earlier swarm. “There hath not been ever the like, neither shall be any more after it” is close to what Exodus says of the locusts sent on Egypt: “before them there were no such locusts as they, neither after them shall be such” ([[Ex. 10:14]]). There too “the land was darkened” ([[Ex. 10:15]]).

      The picture does not stay with insects. The heavens tremble, sun and moon go dark, and the day is “the day of the LORD” (verses 10–11). The heading in the Church’s edition gives the Church’s reading: “War and desolation will precede the Second Coming.” On that reading the swarm is the figure and an army is what is foretold, the locusts being “a metaphor for an invading army overrunning the land.” One Church reading is more specific and takes these verses for “the battle of Armageddon” (see the note on [[Joel 3:12]]). It compares them with Ezekiel’s Gog, who comes “out of the north parts … a great company, and a mighty army” ([[Ezek. 38:15]]). John’s vision has the image too, locusts whose shapes “were like unto horses prepared unto battle” ([[Rev. 9:7]]).

      The two steps belong together. A real drought and plague of locusts was likely the occasion, and the prophecies made after it tell of signs that come before the Second Coming of Jesus Christ.
    sources: [lds-scriptures, ot-minute-joel, ot-manual-7, scripture-helps-hosea]

  - ref: 8
    phrase: when they fall upon the sword, they shall not be wounded
    kind: words
    title: Weapons do not stop them
    body: |
      The Hebrew of this line can be read as saying that weapons do not halt the advance. “Sword” is a general Hebrew word for a “missile, weapon.” The verb the King James gives as “be wounded” means to “cut off, break off,” and the lexicon takes its unstated object here to be “their course,” that is, they do not stop. So a modern translation has “they burst through the weapons and are not halted.”

      The Septuagint reads nearer to the King James: “they fall upon their weapons, yet shall they in no wise be destroyed.” Either way the line may simply be saying that “the armaments used against the invaders will be ineffectual.”
    sources: [oshb-wlc, bdb, nrsvue, lxx-rahlfs, ot-manual-7]

  - ref: 12
    phrase: Therefore also now
    kind: structure
    title: Yet even now
    body: |
      “Therefore also now” is “Yet even now”: with the army at the wall and the day at hand, the Lord says it is not too late. Verse 11 ended on a question, “who can abide it?” These verses answer it. No one can abide that day who does not turn to the Lord with all the heart.

      The Hebrew verb for “turn” is used three times in three verses. The people are told “turn ye even to me” (verse 12) and “turn unto the LORD your God” (verse 13), and then it is said of the Lord: “who knoweth if he will return” (verse 14). They are asked to turn in the hope that He will.
    sources: [nrsvue, oshb-wlc, pike-great-dreadful-day]

  - ref: 13
    phrase: repenteth him of the evil
    kind: scripture
    title: The Lord’s character, and what He repents of
    body: |
      The reason given for turning is the Lord’s character, in words close to those He spoke of Himself at Sinai. There He proclaimed His name to Moses: “The Lord, The Lord God, merciful and gracious, longsuffering, and abundant in goodness and truth” ([[Ex. 34:6]]). Joel’s list is close to that one and ends with a clause Exodus does not have: He “repenteth him of the evil.”

      Jonah has the list in the same form as Joel, and speaks it as a complaint: “I knew that thou art a gracious God, and merciful, slow to anger, and of great kindness, and repentest thee of the evil” ([[Jonah 4:2]]). Nineveh’s king asks the question of verse 14 almost in Joel’s words, “Who can tell if God will turn and repent” ([[Jonah 3:9]]).

      “Repent” here is not repentance from sin, and “the evil” is the harm threatened. The verb is *nacham*, to “be sorry, rue, suffer grief, repent,” and in this verse it is repenting “for ill done to others,” as in Moses’s plea after the golden calf ([[Ex. 32:12]]) and Jonah’s Nineveh. A modern translation has “relenting from punishment.”

      Joseph Smith’s revision removes the difficulty by giving the repentance to the people. Verse 13 becomes “and repent, and turn unto the Lord your God,” with the promise that “he will turn away the evil from you,” and verse 14 begins “Therefore repent.” The notes on [[Gen. 6:6]] and [[Hos. 11:8]] take up the same verb.
    sources: [lds-scriptures, bdb, oshb-wlc, nrsvue]

  - ref: 14
    phrase: leave a blessing behind him
    kind: history
    title: A blessing to give back
    body: |
      The blessing hoped for is enough grain and wine to bring an offering again. The locusts had ended the offerings at the temple: “The meat offering and the drink offering is cut off from the house of the LORD” ([[Joel 1:9]]). “Meat offering” is what modern translations call “a grain offering.” Joseph Smith’s revision makes the purpose plain: the Lord may leave a blessing “that you may offer a meat offering.”
    sources: [lds-scriptures, nrsvue]

  - ref: 17
    phrase: between the porch and the altar
    kind: history
    title: Where the priests stand, and what they plead
    body: |
      The priests are to stand in front of the temple door and plead the Lord’s own name. “Between the porch and the altar” is “between the porch of the temple and the altar of burnt-offering, i.e., immediately in front of the door of the holy place.” Ezekiel was shown the same spot put to the opposite use, with men standing “between the porch and the altar” whose backs were to the temple ([[Ezek. 8:16]]; see the note there).

      The prayer pleads what is the Lord’s. It says “thy people” and “thine heritage,” and it asks what the nations will conclude: “Where is their God?” A psalm prays the same way: “Wherefore should the heathen say, Where is their God?” ([[Ps. 79:10]]). So did Moses after the golden calf: “Wherefore should the Egyptians speak, and say, For mischief did he bring them out” ([[Ex. 32:12]]).

      In the King James the fear is “that the heathen should rule over them.” A modern translation reads the clause as mockery: “a byword among the nations.” The Lord’s reply takes up the priests’ word: “I will no more make you a reproach among the heathen” (verse 19).
    sources: [keil-joel, lds-scriptures, nrsvue]

  - ref: 18
    phrase: Then will the LORD be jealous for his land
    kind: words
    title: The Lord’s answer, past or future
    body: |
      The Hebrew verbs of this verse can be read as telling what the Lord then did, and not only what He will do: “Then the LORD became jealous for his land and had pity on his people.” On one reading of the verbs here, and of “will answer and say” in verse 19, “the grammar requires that we should take” them “as statements of what actually occurred.” The Septuagint has the past too: “But the Lord was jealous of his land, and spared his people.” The same verb form can also be “used in a prophetic announcement of the future,” and the King James reads it so here.

      The difference bears on a question the chapter otherwise leaves open, whether anyone kept the fast. Read as narrative, these verses record that “in consequence of the penitential prayer of the priests, the Lord displayed His mercy to His people.” The book never describes the fast: it goes from the prayer the priests were given straight to the Lord’s reply. On that reading a reader has “to supply the execution of the prophet’s command between” verses 17 and 18.

      “Jealous” is the Lord’s zeal for what is His. What moves Him is “his land” and “his people,” and “thy people” was the priests’ plea in verse 17.
    sources: [oshb-wlc, keil-joel, nrsvue, lxx-rahlfs, lds-scriptures]

  - ref: 20
    phrase: the northern army
    kind: history
    title: The northerner
    body: |
      The Hebrew has only “the northern one,” and who that is depends on how verses 1–11 are read. The King James supplies “army.” The word is defined as “northern one, northerner, invader from north,” and is applied in this verse to the locust swarm.

      Two details fit a swarm. It is driven into the sea at both ends, front into “the eastern sea” and rear into “the western sea,” that is, the Dead Sea and the Mediterranean. And it leaves a stench. Jerome wrote of seeing Judea covered by swarms that the wind drove into both seas, and that when the shores were heaped with dead locusts “their corruption and stench became so noxious, that even the atmosphere was corrupted.” The difficulty is the direction, since locusts “generally come to Palestine from the south.” The old reply is that “Locusts come and go with all winds.”

      The north is also where the prophets look for invaders. “Out of the north an evil shall break forth upon all the inhabitants of the land” ([[Jer. 1:14]]; see the note on [[Jer. 1:13]]), and Gog comes “out of the north parts” ([[Ezek. 38:15]]). The Church’s footnote on “remove” sends the reader to Gog’s fall ([[Ezek. 39:3]]).

      The verse ends with the reason, “because he hath done great things,” and the next verse takes the phrase from him: “the LORD will do great things.”
    sources: [oshb-wlc, bdb, keil-joel, nrsvue, lds-scriptures]

  - ref: 23
    phrase: the former rain moderately
    kind: words
    title: Early rain, or a teacher
    body: |
      The Hebrew behind “the former rain moderately” can be read two ways, and both readings are old. The first word, *moreh*, is two nouns spelled alike, “(early) rain” and “teacher,” and the second word is “righteousness.” So the phrase is either the early rain “for righteousness” (the King James’s “moderately”; a modern translation’s “the early rain for your vindication”) or “the teacher for righteousness.”

      The Latin Vulgate and “most of the Rabbins and earlier commentators” took “teacher”; “most of the Calvinistic and modern commentators” took “early rain,” and *moreh* certainly means rain later in this same verse. The Septuagint has neither: “he has given you food fully.” The modern translation that prints “vindication” adds the note “Meaning of Heb uncertain.”

      The setting is rain. In that land rain “begins to fall in October and continues in November and early December,” which is the early or former rain, and the latter rain “comes in March and April.” Verse 24 goes on to full threshing floors, and the Church’s footnotes on the verse point to other promises of rain ([[Deut. 11:14]]; [[Zech. 10:1]]).

      “In the first month” is uncertain too. The Septuagint and a modern translation have “as before.” Another reading takes it as “first,” answered by the “afterward” of verse 28 (see the note there).
    sources: [oshb-wlc, bdb, keil-joel, nrsvue, lxx-rahlfs, bd-rain, lds-scriptures]

  - ref: 25
    phrase: I will restore to you the years that the locust hath eaten
    kind: words
    title: Harvests repaid
    body: |
      What is promised back is harvests, and the repayment is in kind. A modern translation has “I will repay you for the years that the swarming locust has eaten,” and the Septuagint, “I will recompense you for the years.” The verses on either side say with what: full floors, overflowing vats, eating “in plenty.” The promise is spoken to the people who were called to the fast.

      The Lord also says whose the locusts were: “my great army which I sent among you.” The four names are those of [[Joel 1:4]].

      A wider reading takes the years as “generations of oppression for scattered and rejected Israel,” so that the repayment is Israel’s restoration to the covenant. That is a reading of the figure, beyond what the verse describes.
    sources: [nrsvue, lxx-rahlfs, ot-manual-7]

  - ref: 28
    phrase: afterward
    kind: words
    title: What “afterward” follows
    body: |
      “Afterward” puts the gift of the Spirit after the rain and the repaid years of verses 23–27. One older reading ties the word to the end of verse 23, taking the last word there as “first”: “First of all the pouring out of a plentiful rain,” and “after that, the pouring out of the spiritual blessing.”

      The verb carries the rain over into the promise. To “pour out” is to give “in rich abundance, like a rain-fall.”

      Peter, quoting the verse, puts a date where Joel has “afterward”: “And it shall come to pass in the last days, saith God, I will pour out of my Spirit upon all flesh” ([[Acts 2:17]]).
    sources: [keil-joel, lds-scriptures]

  - ref: 28
    phrase: I will pour out my spirit upon all flesh
    kind: scripture
    title: Peter’s day and Moroni’s
    body: |
      Peter said at Pentecost that this was what was happening, and Moroni said in 1823 that it was not yet fulfilled; the Church reads the prophecy as having more than one fulfilment. When the Spirit came on the disciples and the crowd supposed them drunk, Peter answered, “this is that which was spoken by the prophet Joel” ([[Acts 2:16]]), and quoted these five verses. Moroni quoted the same five to Joseph Smith and “said that this was not yet fulfilled, but was soon to be” ([[JS—H 1:41]]).

      One Latter-day Saint scholar felt the two statements pull apart: if Peter meant that the prophecy was fulfilled that day, “we shall have to differ with him.” The two need not be set against each other. Pentecost was one fulfilment, and the prophecy “applied to more than one period of history.”

      The later fulfilment has been placed in more than one time. The manifestations that followed the dedication of the Kirtland Temple have “often been described as a ‘Pentecostal season.’” President Gordon B. Hinckley looked wider. From the day of the First Vision, he said in 2001, “there has been a tremendous cascade of enlightenment poured out upon the world,” and “The vision of Joel has been fulfilled.” He went on from Joel’s words to the “scientific discovery” of those years. Another reading holds that “the complete and ultimate fulfilment of this prophecy will be during the Millennium,” while many of its gifts “are indeed had among the faithful today.” And the signs of verses 30–31 belong to the same five verses; the scholar who felt the difficulty assumed that “a great part of this scripture yet awaits fulfillment.”
    sources: [lds-scriptures, sperry-moroni-expounds, scripture-helps-hosea, wilson-holy-spirit, sc-knowhy-651, hinckley-fulness-of-times]

  - ref: 29
    phrase: upon the servants and upon the handmaids
    kind: symbol
    title: Down the household to the servants
    body: |
      The list runs through a household until it reaches those with the least standing in it. It names sons and daughters, old men and young men, and then “the servants” and “the handmaids,” whom a modern translation calls “the male and female slaves.” In the Old Testament the gifts of the Spirit “functioned … among a select few.” Moses had wished that all the Lord’s people were prophets, “and that the Lord would put his spirit upon them!” ([[Num. 11:29]]). Joel’s promise has been read as the answer to that wish, a time when the Spirit’s work “would have no distinctions for gender, age, rank, intelligence, or birthright.”

      The Septuagint has “my servants” and “my handmaids,” and Peter’s quotation reads the same way: “on my servants and on my handmaidens” ([[Acts 2:18]]). There the servants are the Lord’s.
    sources: [nrsvue, wilson-holy-spirit, lxx-rahlfs, lds-scriptures]

  - ref: 31
    phrase: the great and the terrible day of the LORD
    kind: scripture
    title: Great and terrible
    body: |
      “Great” here means momentous, not pleasant, and Malachi’s promise of Elijah uses the same phrase. In Hebrew “this expression is worded exactly the same in both Joel 2:31 and Malachi 4:5,” though the King James has “terrible” here and “dreadful” there ([[Mal. 4:5]]; see the note there). “Terrible” is from the verb “to fear,” and means something “to be feared or dreaded.” In a passage of darkness, blood, and fire, “great” does not describe “the joy the righteous will experience after Jesus has returned.” The phrase means “the significantly dreadful day of the Lord,” and that day is the Second Coming of Jesus Christ.

      The Septuagint has “the great and glorious day,” and Peter’s quotation in the King James has “that great and notable day” ([[Acts 2:20]]).

      In the Doctrine and Covenants the Lord repeats verses 30–31 of this chapter in His own voice, nearly line for line: “And they shall see signs and wonders, for they shall be shown forth in the heavens above, and in the earth beneath. And they shall behold blood, and fire, and vapors of smoke. And before the day of the Lord shall come, the sun shall be darkened, and the moon be turned into blood, and the stars fall from heaven” ([[D&C 45:40–42]]). The darkened sun and moon are also in verse 10 and in [[Joel 3:15]]; the day is first named at [[Joel 1:15]].
    sources: [pike-great-dreadful-day, lxx-rahlfs, lds-scriptures]

  - ref: 32
    phrase: whosoever shall call on the name of the LORD shall be delivered
    kind: christ
    title: The name that delivers
    body: |
      The “LORD” whose name delivers is Jehovah, and the New Testament applies the verse to Jesus Christ. Peter ends his quotation with this line, “whosoever shall call on the name of the Lord shall be saved” ([[Acts 2:21]]), and the rest of his sermon says who that Lord is: “God hath made that same Jesus, whom ye have crucified, both Lord and Christ” ([[Acts 2:36]]). Asked what to do, he answers with the name: “be baptized every one of you in the name of Jesus Christ” ([[Acts 2:38]]). Paul quotes the line a few sentences after writing “if thou shalt confess with thy mouth the Lord Jesus” ([[Rom. 10:9]]; [[Rom. 10:13]]). The Hebrew here is the divine name, and “Jehovah is the premortal Jesus Christ.”

      The verse uses one Hebrew verb twice. Whoever “shall call” on the LORD is delivered, and the remnant are those “whom the LORD shall call.” The people call on Him, and He calls them.

      The deliverance is placed “in mount Zion and in Jerusalem.” One reading takes these as two places: “in mount Zion [the New Jerusalem] and in [Old] Jerusalem.” Another sees the promise kept as the righteous “repent and gather to the stakes and temples of Zion.” Both are readings.
    sources: [lds-scriptures, bd-jehovah, oshb-wlc, ot-minute-joel, pike-great-dreadful-day]

christ: |
  Joel says that the Lord will pour out His Spirit, and that whoever calls on the name of the LORD will be delivered. Peter’s sermon at Pentecost gives both to Jesus. Of the outpouring he says: “being by the right hand of God exalted, and having received of the Father the promise of the Holy Ghost, he hath shed forth this, which ye now see and hear” ([[Acts 2:33]]). Of the name, see the note on verse 32.

  The One who says in this chapter “turn ye even to me” and “I am in the midst of Israel” is that same Jehovah. The word of His promise in verse 32 has a wider use: “deliverance in the Old Testament is often associated with the Atonement of the Savior.”

explore: |
  - **Peter’s whole sermon.** [[Acts 2:14–39]], from the quotation of Joel to “the promise is unto you, and to your children.”
  - **The signs in the Lord’s own voice.** [[D&C 45:39–44]]; [[D&C 29:14]]; [[Matt. 24:29]].
  - **The Lord’s name and character.** [[Ex. 34:5–7]], read beside verse 13 and [[Jonah 4:2]].
  - **Moroni’s use of these verses.** The Scripture Central KnoWhy “Why Did Moroni Quote from the Book of Joel?” gathers what Latter-day Saint writers have said about verses 28–32 and the Restoration.

parallels:
  - ref: Acts 2:16–21
    note: Peter quotes verses 28–32 at Pentecost, with “in the last days” for “afterward” and ending at “shall be saved.”
  - ref: JS—H 1:41
    note: Moroni quotes verses 28–32 to Joseph Smith and says they are “not yet fulfilled.”
  - ref: D&C 45:40–42
    note: The Lord repeats the signs of verses 30–31 nearly line for line.
  - ref: Rom. 10:13
    note: Paul quotes verse 32 of calling on the Lord Jesus.

