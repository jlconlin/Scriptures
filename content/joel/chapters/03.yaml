chapter: 3
title: The Valley Where the Lord Judges
tagline: The Lord summons the nations to a valley whose name is their verdict, and the armies that come for a battle find a harvest. Then the book ends where the Lord is, in Zion, with wine on the hills and a spring from His house.
when: 'Undated; Judah, sometime between the 800s and the 400s B.C.'

setting: |
  This chapter finishes the Lord’s answer to the fast, an answer that began at [[Joel 2:18]]. He has promised rain, the lost harvests, and His Spirit on all flesh. Now He turns to the nations. “In those days, and in that time” reaches back to the “afterward” of [[Joel 2:28]] (see the note on verse 1): the outpouring of the Spirit and the judgment of the nations belong to one time. (In Hebrew Bibles this chapter is chapter 4.)

  The book carries no date; its prophecy “may have been spoken as early as the reign of Joash, before 850 B.C., or even so late as after the Return.” The chapter does not date the wrongs it lists either. A people has been scattered, a land divided, children sold; the peoples named are Judah’s neighbors, and no occasion is given.

  The heading in the Church’s edition reads the chapter of the end: the nations at war, and multitudes in the valley of decision “as the Second Coming draws near.” On one Latter-day Saint reading, “The third and last chapter of the prophecy makes reference to the latter days when Israel is to be gathered,” and its close describes “The blessed state of Israel’s redeemed.”

  Later scripture draws on the chapter. John sees its sickle and its winepress ([[Rev. 14:14–20]]), and the Lord repeats its sixteenth verse of His own coming ([[D&C 133:21]]).

thread: |
  The chapter is a trial, and the verdict is in the name of the place. The Lord brings the nations down to the valley of Jehoshaphat, “Jehovah judges,” and states the charge: they scattered His people, divided His land, and sold children for wine (verses 1–8). Then comes the summons. Consecrate a war, hammer your farm tools into weapons, come up (verses 9–12). The nations come armed for a battle and find a harvest in which they are the crop (verse 13). Sentence falls in “the valley of decision” under a dark sky (verses 14–15).

  From there every line is about where the Lord is. He roars from Zion, He is a refuge for His people, He dwells in Zion (verses 16–17, 21).

  The ending also takes up the book’s beginning. In chapter 1 the new wine was cut off, the streambeds dried up, and the offerings stopped at the house of the Lord. Here the mountains drip new wine, every streambed of Judah runs, and a spring rises from that house (verse 18). The Hebrew words for the wine and the streambeds are the same in both places.

sections:
  - range: 1-3
    heading: The nations summoned and charged
    plain: |
      In those days, when I bring back the captives of Judah and Jerusalem, I will gather all nations and bring them down into the valley of Jehoshaphat. There I will enter into judgment with them over My people and My heritage Israel, whom they scattered among the nations. They divided My land. They cast lots for My people; they gave a boy as the price of a harlot and sold a girl for wine to drink.
  - range: 4-8
    heading: The coast repaid in kind
    plain: |
      And what are you to Me, Tyre and Zidon and all the regions of Philistia? Are you paying Me back for something? If you are, I will swiftly turn your deed back on your own head. You took My silver and My gold and carried My treasures into your temples. You sold the children of Judah and Jerusalem to the Greeks, to remove them far from their own border. I will rouse them out of the place where you sold them and turn your deed back on your own head: I will sell your sons and daughters into the hand of Judah, and they will sell them to the Sabeans, a people far off. The LORD has spoken.
  - range: 9-13
    heading: The summons to war, and the harvest
    plain: |
      Proclaim this among the nations: Make ready for war, wake the warriors, let every fighting man come up. Beat your plowshares into swords and your pruning hooks into spears; let the weak man say, “I am strong.” Gather, all you nations round about. (Bring down Your mighty ones there, O LORD.) Let the nations rouse themselves and come up to the valley of Jehoshaphat, for there I will sit to judge them all. Put in the sickle, for the harvest is ripe. Come, tread, for the press is full and the vats overflow, for their wickedness is great.
  - range: 14-17
    heading: The day in the valley, and the Lord in Zion
    plain: |
      Multitudes upon multitudes in the valley of decision, for the day of the LORD is near there. Sun and moon grow dark and the stars stop shining. The LORD roars from Zion and His voice sounds from Jerusalem, and heaven and earth shake; but the LORD is the hope of His people and the strength of the children of Israel. Then you will know that I am the LORD your God, dwelling in Zion, My holy mountain. Jerusalem will be holy, and strangers will pass through her no more.
  - range: 18-21
    heading: The land restored
    plain: |
      In that day the mountains will drip new wine and the hills flow with milk; all the streams of Judah will run with water, and a spring will come out of the house of the LORD and water the valley of Shittim. Egypt will be a desolation and Edom a desolate wilderness, for their violence against the children of Judah and the innocent blood they shed. But Judah will be inhabited for ever, and Jerusalem from generation to generation. I will cleanse their blood that I have not cleansed (the note on verse 21 gives the ways this line is read), for the LORD dwells in Zion.

notes:
  - ref: 1
    phrase: when I shall bring again the captivity of Judah and Jerusalem
    kind: words
    title: More than captives coming home
    body: |
      “Bring again the captivity” is a set Hebrew phrase for the Lord’s reversing a people’s ruin, and a modern translation gives it as “when I restore the fortunes of Judah and Jerusalem.” It is a fixed expression, “restore the captivity of,” with the Lord as its subject. Among the places it stands is Moses’s promise to a scattered Israel: “the LORD thy God will turn thy captivity, and have compassion upon thee, and will return and gather thee from all the nations” ([[Deut. 30:3]]). So the phrase can cover more than prisoners walking home.

      The verse also says when. “In those days, and in that time” picks up the “afterward” of [[Joel 2:28]], and the two “are connected in Joel’s prophecy.” The days when the Spirit is poured out are the days when the nations are judged.
    sources: [bdb, nrsvue, ot-minute-joel, oshb-wlc]

  - ref: 2
    phrase: the valley of Jehoshaphat
    kind: words
    title: A valley named for its verdict
    body: |
      Jehoshaphat means “Jehovah judges,” and the valley is named for what happens in it. The name is built from the divine name and the verb *shaphat*, to judge: “Jehovah-judged.” The verse plays on it at once. “Plead” is that same verb, so the Lord brings the nations to the valley of *Yehoshaphat* to *nishpat* with them, and a modern translation has “I will enter into judgment with them there.” Verse 12 makes the play a second time: “there will I sit to judge.” The verb occurs in Joel only in these two verses, each time beside the name.

      Where is it? The name “does not occur anywhere else in either the Old or New Testament, excepting here and in Joel 3:12.” The traditional answer is the Kidron: “East of Jerusalem, between the city and the mount of Olives.” That tradition is old, reported from Eusebius and Jerome. The name has also been read as a symbol more than an address: “there is no valley or place called Jehoshaphat,” so that it “probably symbolizes God’s place of judgment.” The two need not exclude each other. On one reading the name was “formed by Joel” from the judgment, and the place it is given to lies “in or near Jerusalem,” where verse 16 has the Lord’s voice sound.

      King Jehoshaphat saw a league of invading nations destroyed, and some have looked to the valley of that deliverance for the name. But that valley was called something else afterward, “The valley of Berachah, unto this day” ([[2 Chr. 20:26]]), and the connection has been rejected for that reason.
    sources: [strongs-concordance, oshb-wlc, nrsvue, keil-joel, ot-minute-joel, bd-jehoshaphat-valley-of, lds-scriptures]

  - ref: 3
    phrase: they have cast lots for my people
    kind: history
    title: People divided like plunder
    body: |
      The charge is that Judah’s people were shared out by lot, which is what scripture shows conquerors doing with a fallen city. Nahum says it of a conquered city’s nobles: “they cast lots for her honourable men” ([[Nahum 3:10]]). Obadiah says it of Jerusalem on the day it fell, when foreigners “cast lots upon Jerusalem” ([[Obad. 1:11]]). The rest of the verse gives the prices. A boy was traded for a prostitute and a girl for wine, which the buyers then drank.

      The Lord speaks of all of it as His own. In four verses He says “my people” twice, “my heritage Israel,” “my land,” “my silver and my gold,” and “my goodly pleasant things.”

      Which scattering and which division of the land are meant, the verses do not say. On one Latter-day Saint reading these are “the Gentile nations who shall be judged because they have scattered Israel,” in the latter days when Israel is gathered.
    sources: [lds-scriptures, sperry-moroni-expounds]

  - ref: 4
    phrase: O Tyre, and Zidon, and all the coasts of Palestine
    kind: history
    title: The traders of the coast, repaid in kind
    body: |
      The three named are Judah’s neighbors on the Mediterranean shore, and their sentence copies their crime. Tyre was a trading seaport, and Zidon the chief city of Phoenicia. “Palestine” here is not the whole land. The Hebrew is *Pelesheth*, Philistia, and “coasts” is a word for a “circuit, boundary, territory”: “all the regions of Philistia.” The Philistines held the lowland along the coast from Joppa to the Egyptian desert, and it is their name that later became “Palestine,” a title for the whole Holy Land.

      They are charged with taking the Lord’s silver and gold into their own temples (verse 5) and with selling the children of Judah “unto the Grecians” (verse 6). The Hebrew has the sons of the *Yevanim*, the people of Javan, who was counted the ancestor of the Greeks. Ezekiel’s list of Tyre’s trade has Javan among those who “traded the persons of men” in its market ([[Ezek. 27:13]]; see the note there). Amos charges Philistine Gaza and Tyre alike with handing over captives; of Tyre he says “they delivered up the whole captivity to Edom” ([[Amos 1:9]]). Joel does not say which raid or which sale he means.

      The sellers sent Judah’s children away “that ye might remove them far from their border.” Their own sons and daughters will be sold in their turn to the Sabeans, “a people far off.” A Sabean is “a Shebaite or descendant of Sheba,” and the descendants of one Sheba “gave their name to a portion of southern Arabia.” The Lord says twice, in verses 4 and 7, that He will “return your recompence upon your own head.”
    sources: [bd-tyre, bd-zidon, bd-philistines, bd-javan, bd-sheba, bdb, strongs-concordance, nrsvue, oshb-wlc, lds-scriptures]

  - ref: 9
    phrase: Prepare war
    kind: words
    title: A war made holy
    body: |
      “Prepare” is the Hebrew verb “sanctify”: the nations are told to consecrate a war. A modern translation has “Consecrate yourselves for war.” The verb means to “be set apart, consecrated,” and in Isaiah the Lord calls His own warriors “my sanctified ones” ([[Isa. 13:3]]; see the note there).

      Joel has used this verb three times before, each time of Judah’s fast and assembly: “Sanctify ye a fast” ([[Joel 1:14]]; [[Joel 2:15]]) and “sanctify the congregation” ([[Joel 2:16]]). This is its fourth and last use in the book.

      The speaker is still the Lord, and He speaks through messengers. “Proclaim ye” is a plural command, given to heralds who are to carry the summons “among the Gentiles.” (“Gentiles” in this verse and “heathen” in verses 11 and 12 are one Hebrew word, *goyim*, nations.)
    sources: [oshb-wlc, bdb, nrsvue]

  - ref: 10
    phrase: Beat your plowshares into swords, and your pruninghooks into spears
    kind: scripture
    title: Isaiah’s line turned around
    body: |
      This is the promise of Isaiah and Micah run backward: a call to arms where theirs is a disarming. In their vision the nations “shall beat their swords into plowshares, and their spears into pruninghooks” ([[Isa. 2:4]]; [[Micah 4:3]]). Joel has the same Hebrew verb for “beat” and the same words for plowshares and pruninghooks. In Isaiah the nations go up to the Lord’s mountain to be taught, and He “shall judge among the nations” ([[Isa. 2:4]]). In Joel they are told to “come up” armed, and He sits “to judge” them (verse 12). See the note on [[Isa. 2:4]] for the promise itself.

      “Let the weak say, I am strong” belongs to the same call to arms. “Strong” is *gibbor*, a warrior, the same word as the “mighty men” of verse 9; a modern translation has the weakling say “I am a warrior.”

      The footnote in the Church’s edition points from this line to [[2 Cor. 12:10]] and [[Ether 12:27]], where the weak are made strong by the Lord’s grace. In Joel’s own sentence the words are part of the summons to the nations’ armies.
    sources: [oshb-wlc, nrsvue, lds-scriptures]

  - ref: 11
    phrase: thither cause thy mighty ones to come down, O LORD
    kind: words
    title: A prayer in the middle of the summons
    body: |
      In the middle of the summons the voice turns from the nations to the Lord and asks for His army. The commands around it are plural and addressed to the nations. This one is singular and addressed to the LORD: “thither bring down thy heroes.” It has been read as the place where the prophet himself “steps in with a prayer addressed to the Lord.”

      The “mighty ones” are *gibborim*, the word used for the nations’ “mighty men” in verse 9 and for the weak man’s boast in verse 10. The nations wake their warriors, and the prophet asks for the Lord’s. They have been understood as “heavenly hosts, or angels,” and a psalm uses the same word of angels: “ye his angels, that excel in strength” ([[Ps. 103:20]]), where the Hebrew behind “excel” is this word.

      The verse is hard in Hebrew. A modern translation marks it “Meaning of Heb uncertain,” and the ancient Greek translation has no prayer at all at this point, only “let the timid become a warrior.”
    sources: [oshb-wlc, bdb, keil-joel, nrsvue, lxx-rahlfs]

  - ref: 12
    phrase: there will I sit to judge all the heathen round about
    kind: prophets
    title: Is this Armageddon?
    body: |
      Joel never uses the name Armageddon, but the gathering he describes has been read as the last scenes of the battle called by it. The name is John’s. The kings of the earth are gathered “into a place called in the Hebrew tongue Armageddon” ([[Rev. 16:16]]). It is the Greek form of the Hebrew *Har Megiddon*, the mountain of Megiddo, and Megiddo lies some 75 miles north of Jerusalem, while Joel’s valley is by tradition beside Jerusalem (see the note on verse 2). But the name has come to stand for the whole war: “A great and final conflict taking place at the Second Coming of the Lord is called the battle of Armageddon.” In that wider sense Joel’s passage “seems to refer to the final scenes of the battle of Armageddon in Jerusalem,” and “Many biblical scholars identify this as the Battle of Armageddon.”

      Elder Joseph Fielding Smith set Joel beside Zephaniah and Zechariah as prophets who all declare that in the last day “the nations of the earth would gather against Jerusalem,” and added, “when that time comes, the Lord is going to come out of His hiding place.” Zechariah’s wording is close to Joel’s: “I will gather all nations against Jerusalem to battle” ([[Zech. 14:2]]).

      Joel’s own verb for what the Lord does there is “sit,” and the purpose is “to judge.” The note on [[Ezek. 38:8]] sorts out the names given to the last battles.
    sources: [bd-armageddon, ot-manual-7, ot-minute-joel, lds-scriptures]

  - ref: 13
    phrase: Put ye in the sickle, for the harvest is ripe
    kind: scripture
    title: Two harvests, and the nations are the crop
    body: |
      The judgment is pictured as two harvests together, grain cut with the sickle and grapes trodden in the press, and John’s Revelation takes up both. There one “like unto the Son of man” sits on a cloud with a sharp sickle ([[Rev. 14:14]]), and an angel cries to him in nearly Joel’s words: “Thrust in thy sickle, and reap: for the time is come for thee to reap; for the harvest of the earth is ripe” ([[Rev. 14:15]]). Then the clusters are gathered and cast “into the great winepress of the wrath of God” ([[Rev. 14:19]]).

      “The fats overflow” (the footnote gives “vats”) repeats a promise from the chapter before: “the fats shall overflow with wine and oil” ([[Joel 2:24]]). The Hebrew noun and verb are the same, and Joel uses them nowhere else. There the full vats were the Lord’s gift after the locusts. Here the reason they are full is “for their wickedness is great.” The treading itself, which Isaiah shows the Lord doing alone, is explained in the note on [[Isa. 63:3]].

      In Restoration scripture the sickle is also the missionary’s. The call to the work says that “the field is white already to harvest; and lo, he that thrusteth in his sickle with his might, the same layeth up in store that he perisheth not” ([[D&C 4:4]]). Ammon’s praise of his brothers “sounds very much like Joel 3:13”: “the field was ripe, and blessed are ye, for ye did thrust in the sickle” ([[Alma 26:5]]). The image is one, a field reaped when it is ripe, and scripture uses it both for souls gathered in and for wickedness cut down.
    sources: [lds-scriptures, oshb-wlc, sc-knowhy-133]

  - ref: 14
    phrase: the valley of decision
    kind: words
    title: Whose decision it is
    body: |
      “Decision” here is most likely a verdict handed down, more than a choice the multitudes are making. The Hebrew word, *charuts*, is defined for this verse as “strict decision,” and it comes from a verb meaning to “cut, sharpen, decide.” The ancient Greek translation has simply “the valley of judgment.” So this is the valley of Jehoshaphat under a second name (see the note on verse 2): “Eternal fate will be decided at that location.”

      A reader may hear in the English word crowds making up their minds. The lexicon does not say whose decision it is. The Greek word points to the Judge, and so does verse 12, where the Lord sits “to judge” in this valley.

      “The day of the LORD is near” is the fifth and last time the book names that day (see the note on [[Joel 1:15]]; [[Joel 2:1]]; [[Joel 2:11]]; [[Joel 2:31]]). The phrase in Joel has been read of one day throughout: it “always refers to the Second Coming.” The dark sun and moon of the next verse have also come before ([[Joel 2:10]]; [[Joel 2:31]]).
    sources: [bdb, lxx-rahlfs, ot-minute-joel, vandyke-ogden-twelve, oshb-wlc]

  - ref: 16
    phrase: the LORD will be the hope of his people
    kind: christ
    title: The roar and the refuge
    body: |
      The Lord who roars from Zion and the Lord who shelters His people are one, and modern revelation gives His name. “Hope” translates a Hebrew word for “refuge, shelter,” used again and again “of God as the refuge of his people.” A modern translation has “a refuge for his people” and “a stronghold for the people of Israel.” One voice shakes heaven and earth, and the same Lord is the place to hide.

      Amos opens his book with the first half of this verse, and with the same Hebrew verb for “roar”: “The LORD will roar from Zion, and utter his voice from Jerusalem” ([[Amos 1:2]]). The Doctrine and Covenants repeats the line of the Savior, who “shall stand upon the mount of Olivet” ([[D&C 133:20]]): “he shall utter his voice out of Zion, and he shall speak from Jerusalem” ([[D&C 133:21]]).

      In another revelation He tells the scene Himself. When He sets His foot on the mount, “the heavens also shall shake” ([[D&C 45:48]]), and “the Lord shall utter his voice, and all the ends of the earth shall hear it” ([[D&C 45:49]]). Then the Jews ask about the wounds in His hands and feet, and He answers, “I am Jesus that was crucified. I am the Son of God” ([[D&C 45:52]]). Joel’s next verse begins, “So shall ye know that I am the LORD your God.” The revelation has nearly the same words: “Then shall they know that I am the Lord” ([[D&C 45:52]]). The two have been read together: “then Judah will know that Christ is the Lord their God, for He will stand on the Mount of Olives.”

      How His people come to that refuge has been put in the Restoration’s terms: the protection Joel promises “will happen as they repent and gather to the stakes and temples of Zion.”
    sources: [bdb, nrsvue, oshb-wlc, lds-scriptures, ot-manual-7, pike-great-dreadful-day]

  - ref: 17
    phrase: there shall no strangers pass through her any more
    kind: words
    title: Who the strangers are
    body: |
      The “strangers” shut out of Jerusalem are those not of Israel, and the Hebrew word has enemies chiefly in view. “Strangers” in the Old Testament are Gentiles, and the promise has been read as one of purity: “no strange god nor impure people will be permitted to enter or pass through the city. This promise is yet to be fulfilled.”

      The Hebrew word, *zarim*, is defined for this verse as “foreigners (as such usually enemies),” and a modern translation has “never again will foreigners invade her.” The foreigner who settles in the land is a different Hebrew word, *ger*, and Ezekiel gives him an inheritance among the tribes ([[Ezek. 47:22]]; see the note there).
    sources: [bdb, oshb-wlc, niv, ot-manual-7]

  - ref: 18
    phrase: a fountain shall come forth of the house of the LORD
    kind: symbol
    title: What chapter 1 lost, given back
    body: |
      The verse takes up, in the same Hebrew words, what the first chapter mourned. The “new wine” that was “cut off from your mouth” ([[Joel 1:5]]) now drips from the mountains; the Hebrew word stands in Joel only in those two verses. The “rivers of waters” that were “dried up” ([[Joel 1:20]]) are, in the same Hebrew word, “all the rivers of Judah” that now run. A modern translation calls them “streambeds.” And the house of the Lord, from which the offerings were “cut off” ([[Joel 1:9]]), is where the spring rises.

      The spring waters “the valley of Shittim.” Shittim means “Acacias,” and a modern translation has “the valley of acacias.” The name belongs to the district east of the Jordan, opposite Jericho, where Israel camped before crossing, and the valley Joel means has been described as “an extremely dry valley located near the Dead Sea.”

      Ezekiel follows that water at length, from the threshold of the house down to the Dead Sea: see the note on [[Ezek. 47:1]] and [Waters out of the Sanctuary](/ezekiel/themes/waters-out-of-the-sanctuary/).
    sources: [oshb-wlc, nrsvue, niv, bd-shittim, ot-minute-joel]

  - ref: 19
    phrase: Egypt shall be a desolation, and Edom shall be a desolate wilderness
    kind: history
    title: Why Egypt and Edom
    body: |
      Egypt and Edom are named for bloodshed, and they have been read as standing for every power that has done violence to the Lord’s people. The charge against both is “violence against the children of Judah” and “innocent blood.” On one reading “their land” is “the land of the Egyptians and Edomites, not of the Judaeans,” and the blood is that of Israelites killed there, in Egypt “more especially by the command to slay all the Hebrew boys.” A modern translation takes the land as Judah’s: “in whose land they have shed innocent blood.” Either way, the two nations “had both thereby become types of the power of the world in its hostility to God.”

      Edom was later known as Idumea, and modern revelation uses that name for the world: the Lord “shall come down in judgment upon Idumea, or the world” ([[D&C 1:36]]). The notes on [[Ezek. 35:5]] and [[Ezek. 35:14]] follow Edom’s history and that name.
    sources: [keil-joel, nrsvue, lds-scriptures, bd-edom]

  - ref: 21
    phrase: I will cleanse their blood that I have not cleansed
    kind: words
    title: Cleansed, or avenged
    body: |
      The line can be read as a promise to pardon blood-guilt or as a promise to avenge blood, and translators divide. The Hebrew verb, used twice, comes from a root meaning to “be clean, free from guilt, innocent,” and its King James renderings elsewhere include “acquit” and “cleanse.” Word for word the Hebrew is “I will hold innocent their blood that I have not held innocent.” The verb was “chosen with reference to” the “innocent blood” of verse 19, a word from the same root.

      It has been taken three ways.

      - **Avenge.** The ancient Greek translation has “I will make inquisition for their blood, and will by no means leave it unavenged.” Two modern translations read it so: “I will avenge their blood, and I will not clear the guilty,” or, as a question, “Shall I leave their innocent blood unavenged?” The blood is Judah’s, shed by the nations.
      - **Cleanse by punishing.** Keeping the Hebrew as it stands, the Lord will “wipe away or expunge blood-guiltiness by punishment”: the wrong done to His people, “which has hitherto remained unpunished,” will be answered.
      - **Acquit.** One translation’s footnote offers “I will acquit their bloodguilt that I have not acquitted”: an acquittal where the other two have vengeance.

      The question is not settled. On any of the three the verse gives the same reason: “for the LORD dwelleth in Zion.” “Dwelleth” is the participle used in verse 17, “dwelling in Zion,” and Joel has the verb only in these two verses.
    sources: [bdb, strongs-concordance, oshb-wlc, nrsvue, niv, esv, lxx-rahlfs, keil-joel]

christ: |
  The Judge who sits in the valley is Jesus Christ. The Church’s edition says so in its footnotes: the one on “judge” in verse 12 points to “TG Jesus Christ, Judge,” and the one on “the LORD” in verse 16 to “TG Jesus Christ, Second Coming.” The Savior said it of Himself: “the Father judgeth no man, but hath committed all judgment unto the Son” ([[John 5:22]]). The note on verse 16 follows the roaring voice of that verse to the Mount of Olives, where He shows His wounds and says who He is.

  The book does not end in the valley. It ends with a dwelling, “the LORD dwelleth in Zion,” and with water from His house. John’s last vision names the source of that water and the one who dwells there: “a pure river of water of life, clear as crystal, proceeding out of the throne of God and of the Lamb” ([[Rev. 22:1]]), in a city where “the throne of God and of the Lamb shall be in it” ([[Rev. 22:3]]).

explore: |
  - **The same day in other prophets.** [[Zech. 14:1–9]], [[Ezek. 38:18–23]], and [[Zeph. 3:8]].
  - **The Lord’s own account.** [[D&C 45:47–53]] and [[D&C 133:19–25]], read beside verses 14–17.
  - **The sickle and the winepress.** [[Rev. 14:14–20]] and [[Isa. 63:1–6]].
  - **The whole book in eight points.** Sidney B. Sperry’s “Moroni Expounds Old Testament Scriptures” (*Journal of Book of Mormon Studies* 4, no. 1) outlines Joel as a prophecy of the latter days and sets the Doctrine and Covenants beside it.

