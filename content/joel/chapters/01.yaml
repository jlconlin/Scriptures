chapter: 1
title: What the Locust Left
tagline: Locusts and drought have stripped Judah down to the bark. Joel calls everyone, from the drinkers to the priests, to mourn, then to fast and gather at the house of the LORD, because he sees in the ruin the approach of the day of the LORD.
when: 'Undated; Judah, perhaps as early as the 800s B.C. or as late as after the return from Babylon'

setting: |
  The book gives its prophet a name and a father and nothing more: no king, no year, no enemy. Joel was “a prophet of Judah,” and when he spoke is not known. The Bible Dictionary allows anything from “the reign of Joash, before 850 B.C.” to a time “after the Return” from Babylon, and the Church’s newest study help leaves the date open.

  The occasion is clearer than the date. “The occasion of the prophecy was a severe visitation of drought and locusts,” and the Guide to the Scriptures sums up this chapter as a call for a solemn assembly in the house of the Lord. The newest help adds that Joel’s prophecies tell of signs that come before the Second Coming of Jesus Christ. How a plague in Judah and the last days belong together is taken up in the note on verse 6.

  Joel is one continuous prophecy. Ruin fills this chapter and the first half of the next, a call to turn back follows ([[Joel 2:12–17]]), and from [[Joel 2:18]] the Lord answers. Chapter 1 is all ruin: it ends with a prayer that has not yet been answered.

  One line of the chapter stands nearly word for word in Isaiah ([[Isa. 13:6]]; see the note on verse 15), and the locusts with lions’ teeth come back in the Revelation of John.

thread: |
  The chapter is a lament that turns into a summons. It names no sin and makes no promise. It describes a loss and tells Judah what to do about it.

  First the event itself, which no one living has seen the like of and which is to be told for generations (verses 2–4). Then the prophet calls the people group by group, each named by what it has lost: the drinkers their wine (verse 5), a mourner in sackcloth the husband of her youth (verse 8), the farmers and vinedressers their wheat, barley and fruit (verse 11), the priests their offering (verse 13). The losses climb from the cup to the altar.

  At verse 14 the wailing becomes a command: set apart a fast, gather everyone to the house of the LORD, and cry to Him. Verse 15 says why the matter is so urgent. The plague is the edge of something larger, “the day of the LORD.” In the last two verses the prophet does what he has asked of everyone else, and the animals of the field join him.

  Three words hold the chapter together. Food, wine and offering are “cut off” (verses 5, 9, 16; one Hebrew verb). Everything is “dried up” or “withered” (verses 10, 12, 17, 20). And twice it is joy that has gone, from the people (verse 12) and from the house of God (verse 16).

sections:
  - range: 1-4
    heading: Something to tell the grandchildren
    plain: |
      The word of the LORD that came to Joel, son of Pethuel. Listen, elders, and all who live in the land: has anything like this happened in your time, or in your fathers’ time? Tell your children about it, and let them tell their children, and those children the generation after. What one kind of locust left, the next ate; what that one left, a third ate; and what the third left, a fourth finished.
  - range: 5-7
    heading: A nation with a lion’s teeth
    plain: |
      Wake up, you drunkards, and weep; wail, all you who drink wine, for the new wine has been taken from your mouths. A nation has come up against my land, strong and too many to count, with the teeth of a lion. It has laid my vine waste and splintered my fig tree. It has stripped the bark and thrown it away, and the branches are left white.
  - range: 8-12
    heading: The land in mourning
    plain: |
      Lament like a young woman in sackcloth, mourning the husband of her youth. The grain offering and the drink offering are cut off from the house of the LORD, and the priests, the LORD’s ministers, mourn. The field is ruined and the ground mourns: the grain is destroyed, the new wine is dried up, the oil fails. Be ashamed, farmers; wail, vinedressers, for the wheat and the barley, because the harvest of the field is lost. The vine is dried up and the fig tree droops; pomegranate, palm and apple, every tree of the field has withered, and joy has withered away from the people.
  - range: 13-14
    heading: A fast and a solemn assembly
    plain: |
      Put on sackcloth and lament, you priests; wail, you who serve at the altar. Come and spend the night in sackcloth, ministers of my God, for the grain offering and the drink offering are withheld from the house of your God. Set apart a fast and call a solemn assembly. Gather the elders and everyone who lives in the land to the house of the LORD your God, and cry to the LORD.
  - range: 15-18
    heading: The day of the LORD is near
    plain: |
      Alas for the day! The day of the LORD is near, and it comes as destruction from the Almighty. Has not the food been cut off before our eyes, and joy and gladness from the house of our God? The seed has shrivelled under the clods, the storehouses are desolate, the barns are broken down, because the grain has withered. How the animals groan! The herds of cattle wander, bewildered, because they have no pasture, and the flocks of sheep are left desolate.
  - range: 19-20
    heading: The prophet and the animals cry out
    plain: |
      To You, O LORD, I cry, for fire has devoured the pastures of the wilderness and flame has burned every tree of the field. Even the wild animals cry out to You, because the streams have dried up and fire has devoured the pastures of the wilderness.

notes:
  - ref: 2
    phrase: Hath this been in your days, or even in the days of your fathers?
    kind: scripture
    title: A possible echo of the locust plague of Egypt
    body: |
      Joel’s opening question and his charge to tell the children are close to the words with which the Lord announced the locusts of Egypt, and may be meant to recall them. Moses was to warn Pharaoh of a swarm “which neither thy fathers, nor thy fathers’ fathers have seen” ([[Ex. 10:6]]), and Israel was to “tell in the ears of thy son, and of thy son’s son” what the Lord had done there ([[Ex. 10:2]]). Joel asks the elders whether the like has happened in their days or their fathers’, and tells them to hand the account down three generations. The opening has been called “an unmistakeable allusion to Exodus 10:2.”

      If Joel has Egypt in mind, the plague that once fell on Israel’s oppressor has now come on Israel’s own land. The law had said it could: “Thou shalt carry much seed out into the field, and shalt gather but little in; for the locust shall consume it” ([[Deut. 28:38]]). On this reading Joel is thinking of both at once, the judgments by which the Lord brought His people out of Egypt and “the punishment with which Moses threatened the transgressors of the law.” The allusion is a commentator’s inference from the shared wording. Joel does not name Egypt.
    sources: [keil-joel]

  - ref: 4
    phrase: That which the palmerworm hath left hath the locust eaten
    kind: words
    title: Four words for the locust
    body: |
      Joel uses four Hebrew words for the insect, and what distinguishes one from another is not known. They are *gazam*, *arbeh*, *yeleq* and *chasil*. The standard lexicon defines three of them only as “a kind of locust” and the fourth as “locusts.” An older dictionary derives the four from roots meaning to devour, to increase, to lick up and to ravage, but the origin of the four words is “generally unknown, although theories exist for each,” so “the English translations are only approximate.” A modern translation says in a footnote that the precise meaning of the four is uncertain; another renders them “cutting,” “swarming,” “hopping” and “destroying” locusts.

      Two explanations are common. The four may be different kinds of locust, or one locust at four stages of its growth. The Church’s footnote on the verse allows either, and the Church’s Student Manual prefers the stages. With the origin of the words unknown, the words themselves do not settle it.

      What the verse does with the four is clearer than what they are. Each clause begins with what the one before it left, a form sometimes called a ladder, and it continues the ladder of verse 3: you, your children, their children, another generation. “The four generations parallel the four varieties of pests.” Each swarm eats the leavings of the last, and by the fourth nothing remains.

      *Arbeh*, apparently the common kind, is the locust of the plague in Egypt and of the law’s warning (see the note on verse 2). When the Lord promises to restore what was eaten, He names the same four in another order ([[Joel 2:25]]).
    sources: [bdb, strongs-concordance, parry-climactic, niv, nrsvue, lds-scriptures, ot-manual-7]

  - ref: 6
    phrase: a nation is come up upon my land
    kind: history
    title: A real plague, and what Joel saw through it
    body: |
      The Church’s reference works take the locusts and the drought as something Judah had lived through, and the prophecy as looking through them to the last days. The book centers on a prophecy made after Judah “was smitten with a severe drought and with locusts.” The newest of the Church’s helps says the same with a “likely,” and adds that the prophecies tell of signs preceding the Second Coming. The land has known such swarms into modern times: plagues are recorded there in 1845, 1892, 1899 and 1904, and one at Jerusalem in 1915.

      The Church’s footnote on verse 4 reads the insects as a figure, a comparison for invading or conquering armies. A short Latter-day Saint commentary agrees: by “the metaphor of four stages of locusts destroying the land, Joel prophesied of a future invasion by conquering armies.”

      One Latter-day Saint scholar went further. He held that “most of the book of Joel has reference to the latter days and has little or nothing to do with events of Joel’s own day.” The locusts, on his view, are “idioms and allusions peculiar to his own day,” used because a prophet describes the future in the terms of his own time, and the events of this chapter “represent general destruction and mourning on the earth” before the day of the Lord. His argument starts from what Moroni told Joseph Smith. He took it to mean that the day named in [[Joel 2:31]] had not yet come, and verse 15 of this chapter, he reasoned, “must refer to the same event.” Another scholar concludes that “every word in the book refers to the latter days.”

      These readings differ on whether Joel had watched a plague. Each of them looks to the last days. This page follows the newest of the Church’s helps: a plague that Judah had likely known is the occasion, and the day it announces lay ahead of Joel and lies ahead still.
    sources: [gs-joel, scripture-helps-hosea, lds-scriptures, ot-minute-joel, sperry-moroni-expounds, sc-knowhy-651]

  - ref: 6
    phrase: whose teeth are the teeth of a lion
    kind: symbol
    title: Insects described as an army
    body: |
      The comparison in verses 6 and 7 runs from a swarm to an army, and its details are a locust’s. What has “come up” is called a nation, strong and beyond counting. Its weapons are its teeth, and what it attacks is a vine and a fig tree. On one reading “the locusts are represented as a warlike people, because they devastate the land like a hostile army.” Calling insects a people is at home in Hebrew: Proverbs calls the ants “a people not strong” ([[Prov. 30:25]]) and says in the same breath, “The locusts have no king, yet go they forth all of them by bands” ([[Prov. 30:27]]).

      Verse 7 is exact about the damage. “Barked my fig tree” is in Hebrew a noun, “a snapping or splintering”: the swarm has made the tree into splinters, then stripped it and left the branches white. An old description of locusts quoted beside this verse reports the same thing: “Even the bark of trees is nibbled with their teeth, so that the injury is not confined to one year alone.”

      Whose land “my land” is, the verse does not say. One commentator takes the speaker to be “the prophet, who speaks in the name of the people.” Later in the book it is the Lord who says “my land” ([[Joel 3:2]]).

      The image returns, enlarged, in [[Joel 2:4–7]].
    sources: [keil-joel, bdb]

  - ref: 8
    phrase: Lament like a virgin girded with sackcloth
    kind: symbol
    title: A young woman in sackcloth
    body: |
      The mourner Joel holds up is a young woman who has lost the man she was to marry, if one modern translation’s rendering is right. The Hebrew word for “virgin” describes a young woman still living in her father’s house, yet she mourns “the husband of her youth.” That translation resolves the tension by reading “the betrothed of her youth”: she was pledged and not yet married.

      The command “Lament” is feminine singular in Hebrew, so one woman is addressed, and the verse does not say who she is. The calls before and after it go to groups of Judah’s people, and Hebrew prophets often speak of a whole people as a young woman: this same word serves for the “personification of nations.” The hearer may therefore be the people, or their land, as one figure; the text leaves it unsaid.
    sources: [oshb-wlc, bdb, niv]

  - ref: 9
    phrase: The meat offering and the drink offering is cut off
    kind: history
    title: Why the stopped offering is the worst loss
    body: |
      The grain offering and the drink offering belonged to the sacrifice offered at the temple every morning and evening, so their failure meant that Israel’s daily worship could not go on. “Meat” here has its older sense of food. The offering was chiefly of grain, with wine, and “no burnt or peace offering was complete without it.” The law set the daily measure: with each lamb “a tenth deal of flour mingled with the fourth part of an hin of beaten oil; and the fourth part of an hin of wine for a drink offering” ([[Ex. 29:40]]).

      Flour, oil and wine are exactly what verse 10 says are gone: the grain is wasted, the new wine is dried up, the oil fails. The verse need not mean that the altar already stood empty. On one reading it says “that any further offering is rendered impossible by the failure of meal, wine, and oil.” Part of the offering went on the altar, and “the remainder was usually eaten by the priests.”

      The chapter names the offering twice (verses 9 and 13) and comes back to the house of God a third time (verse 16), and the priests are the last called and are called at the greatest length. The same commentator puts the stakes as high as they can go: “Israel could not suffer any greater calamity than the suspension of the daily sacrifice; for this was a practical suspension of the covenant relation.” When Joel later dares to hope that the Lord will relent, the blessing he hopes for is this one restored: “even a meat offering and a drink offering unto the LORD your God” ([[Joel 2:14]]).
    sources: [bd-meat-offering, keil-joel]

  - ref: 11
    phrase: Be ye ashamed, O ye husbandmen
    kind: words
    title: Dried up and ashamed in one word
    body: |
      In Hebrew the verb for the wine and the vine “dried up” (verses 10 and 12) and the command to the farmers, “Be ye ashamed,” are almost the same form, so the withering of the crop and the shame of the men who grew it are said in one sound. The form can come from a verb meaning to be dry or from one meaning to be ashamed. The command in verse 11 “must be from” the verb for shame. The ancient versions, “and some moderns,” took every one of Joel’s forms from the verb for drying, while the standard lexicon judges that all of them could be “consistently assigned” to shame.

      Translators have to choose in each verse. The Hebrew does not make them. “Joy is withered away from the sons of men” (verse 12) may rather be joy put to shame, which the lexicon finds the easier sense. Only in verse 20, of the streams, is the verb plainly the one for drying.
    sources: [bdb]

  - ref: 14
    phrase: Sanctify ye a fast, call a solemn assembly
    kind: scripture
    title: A fast and a solemn assembly, in Judah and in Kirtland
    body: |
      The fast and the assembly Joel calls for are emergency ones, proclaimed for the crisis and not fixed by the calendar. “Solemn assembly” translates a Hebrew word for a “sacred assembly.” The law uses it for the closing day of a feast, when work stopped: “it is a solemn assembly; and ye shall do no servile work therein” ([[Lev. 23:36]]). Joel’s assembly, here and in [[Joel 2:15]], is the one the lexicon marks as “occasional,” called for a crisis and not by the calendar. The fast is of the same kind. The Day of Atonement “appears to be the only fast ordered by the law,” so this one is proclaimed for the emergency. Joel’s counsel has been summed up in two phrases, “turn to me” and “gather to the temple and pray.”

      The phrase returns in modern revelation, in passages the Church’s Topical Guide sets beside this verse. The Lord told the Saints in Kirtland to “call a solemn assembly” ([[D&C 88:70]]), and when they were slow to build the house for it He reminded them of the purpose: “that your fastings and your mourning might come up into the ears of the Lord of Sabaoth” ([[D&C 95:7]]). Fasting, a solemn assembly and the Lord’s house stand together there as they do in Joel’s verse.
    sources: [bdb, bd-fasts, vandyke-ogden-twelve, lds-scriptures]

  - ref: 15
    phrase: the day of the LORD is at hand, and as a destruction from the Almighty shall it come
    kind: words
    title: The day of the LORD, and destruction from Shaddai
    body: |
      Here the prophet says what the plague means: it is the approach of “the day of the LORD.” This is the first of five times the book names that day (the others are [[Joel 2:1]], [[Joel 2:11]], [[Joel 2:31]] and [[Joel 3:14]]). The phrase “refers to a time when the Lord brings judgment to the wicked and deliverance to the righteous.” In this verse only the first half is in view. Amos had to say the same to people who looked forward to it: “the day of the LORD is darkness, and not light” ([[Amos 5:18]]). In Joel the phrase has been read as one that “always refers to the Second Coming.”

      In “a destruction from the Almighty” the two Hebrew words sound alike: *shod* from *Shaddai*. An older dictionary derives the divine name from the verb “to destroy.” The standard lexicon calls its origin “dubious,” so the likeness is safest taken as one of sound.

      Nearly the same line stands in Isaiah’s prophecy against Babylon ([[Isa. 13:6]]). Which prophet had the line from the other is left open: Isaiah may have quoted Joel, “but it may be that Joel quoted Isaiah.” For “the great and the terrible day,” see [[Joel 2:31]] and the note on [[Mal. 4:5]].
    sources: [scripture-helps-hosea, vandyke-ogden-twelve, bdb, strongs-concordance, ot-manual-7]

  - ref: 17
    phrase: The seed is rotten under their clods
    kind: words
    title: 'A line of rare words: seed shrivelled, not rotted'
    body: |
      The first clause of this verse is made of words found almost nowhere else, and “rotten” is probably the wrong picture. The verb is cited from this verse alone, with the meaning “shrivel”: “the grains have shrivelled.” The noun for “seed” occurs only here, and so does the noun behind “clods,” a word defined as “shovel.” “Clods” follows Jewish interpreters, and the “meaning of clause” is rated “dubious.” A modern translation prints “The seed shrivels under the clods” with a footnote that the Hebrew is uncertain. The ancient Greek translators read something else altogether: “The heifers have started at their mangers.”

      If “shrivel” is right, the verse belongs with the drought in the lines around it (withered grain, streams dried up) and not with damp.
    sources: [bdb, nrsvue, lxx-rahlfs]

  - ref: 20
    phrase: The beasts of the field cry also unto thee
    kind: words
    title: The animals pant toward God
    body: |
      The chapter ends with the prophet doing what he has told everyone else to do, and with the animals doing it beside him. “O LORD, to thee will I cry” (verse 19) is the first prayer in the book. Then the wild animals “cry also unto thee.” The Hebrew verb, which the King James Version translates only as “cry” and “pant,” is the one in the psalmist’s line: “As the hart panteth after the water brooks, so panteth my soul after thee, O God” ([[Ps. 42:1]]). In the psalm the thirsty deer is a comparison for a soul. Here the animals are the ones longing, and the water is what has gone: “the rivers of waters are dried up.”

      Whether the “fire” of these two verses is flame or the burning of the drought the text does not say; the dried streams stand beside it. The Church’s footnote on “fire” in verse 19 sends the reader on to passages about the burning of the last days, among them [[D&C 45:41]].

      The animals get an answer of their own when the book turns: “Be not afraid, ye beasts of the field: for the pastures of the wilderness do spring” ([[Joel 2:22]]).
    sources: [strongs-concordance, oshb-wlc, lds-scriptures]

christ: |
  The Church’s footnote on the mourning land of verse 10 points to a revelation in which the speaker names Himself: “I am Jesus Christ, the Savior of the world” ([[D&C 43:34]]). There He says that He has called to the nations “by the voice of famines and pestilences of every kind,” and that He “would have saved you with an everlasting salvation” ([[D&C 43:25]]).

  The day that verse 15 announces leads to Him as well: Joel’s prophecies tell of signs “preceding the Second Coming of Jesus Christ.” The chapter stops with the cry going up and no reply. The reply begins at [[Joel 2:18]] and reaches the promise that “whosoever shall call on the name of the LORD shall be delivered” ([[Joel 2:32]]).

explore: |
  - **The locusts of Egypt.** [[Ex. 10:1–20]], read beside verses 2–4.
  - **The warning in the law.** [[Deut. 28:38–42]].
  - **“Yet have ye not returned unto me.”** [[Amos 4:6–11]], five calamities with one refrain.
  - **The four insects again.** [[Joel 2:25]], where the Lord promises to restore the years they ate.
  - **Joel’s locusts in John’s vision.** [[Rev. 9:3–10]].
  - **The solemn assembly in this dispensation.** [[D&C 88:70–76]], [[D&C 88:117–119]] and [[D&C 95:7]].
  - **The whole book as a prophecy of the last days.** The section on Joel in the article “Moroni Expounds Old Testament Scriptures” outlines the book in eight points.

