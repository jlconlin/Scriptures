chapter: 3
claims:
  # ---- when ----
  - where: 'when'
    claim: 'The date of Joel’s prophecy is uncertain, from before 850 B.C. to after the Return'
    key: bd-joel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/joel?lang=eng'
    quote: 'The date of his prophecy is uncertain; it may have been spoken as early as the reign of Joash, before 850 B.C., or even so late as after the Return.'

  # ---- setting ----
  - where: 'setting'
    claim: '“In those days” of 3:1 is connected with the “afterward” of 2:28'
    key: ot-minute-joel
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-joel'
    quote: 'These references to a future time are connected in Joel’s prophecy.'
  - where: 'setting'
    claim: 'The Hebrew text has a fourth chapter of Joel, which is the King James chapter 3'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Joel.xml'
    quote: '<chapter osisID="Joel.4">'
  - where: 'setting'
    claim: 'A modern translation notes that 3:1 is 4:1 in Hebrew'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Joel%203&version=NRSVUE'
    quote: '4.1 in Heb'
  - where: 'setting'
    claim: 'The date is uncertain'
    key: bd-joel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/joel?lang=eng'
    quote: 'it may have been spoken as early as the reign of Joash, before 850 B.C., or even so late as after the Return'
  - where: 'setting'
    claim: 'The Church’s chapter heading places the valley of decision as the Second Coming draws near'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/joel/3?lang=eng'
    quote: 'All nations will be at war—Multitudes will stand in the valley of decision as the Second Coming draws near—The Lord will dwell in Zion.'
  - where: 'setting'
    claim: 'Sperry reads chapter 3 of the latter days and the gathering of Israel'
    key: sperry-moroni-expounds
    url: 'https://scripturecentral.org/archive/periodicals/journal-article/moroni-expounds-old-testament-scriptures'
    quote: 'The third and last chapter of the prophecy makes reference to the latter days when Israel is to be gathered.'
  - where: 'setting'
    claim: 'Sperry’s outline calls the chapter’s close the blessed state of Israel’s redeemed'
    key: sperry-moroni-expounds
    url: 'https://scripturecentral.org/archive/periodicals/journal-article/moroni-expounds-old-testament-scriptures'
    quote: 'The blessed state of Israel’s redeemed.'

  # ---- thread ----
  - where: 'thread'
    claim: 'The name Jehoshaphat means “Jehovah judges”'
    key: ot-minute-joel
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-joel'
    quote: 'The name means “Jehovah judges,” and the “valley of Jehoshaphat” probably symbolizes God’s place of judgment.'
  - where: 'thread'
    claim: 'The Hebrew word for “new wine” in 3:18 is the word of 1:5 (H6071)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Joel.xml'
    quote: 'עָסִ֗יס'
  - where: 'thread'
    claim: 'The Hebrew word for “rivers” in 3:18 is the word of 1:20 (H650)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Joel.xml'
    quote: 'אֲפִיקֵ֥י'

  # ---- sections ----
  - where: 'section 1 plain'
    claim: '“Plead with them” is to enter into judgment with them'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Joel%203&version=NRSVUE'
    quote: 'I will enter into judgment with them there'
  - where: 'section 2 plain'
    claim: '“The coasts of Palestine” are the regions of Philistia'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Joel%203&version=NRSVUE'
    quote: 'all the regions of Philistia'
  - where: 'section 2 plain'
    claim: '“The Grecians” are the Greeks'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Joel%203&version=NRSVUE'
    quote: 'You have sold the people of Judah and Jerusalem to the Greeks'
  - where: 'section 3 plain'
    claim: '“Heathen” is nations, and “fats” is vats'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Joel%203&version=NRSVUE'
    quote: 'The vats overflow'
  - where: 'section 3 plain'
    claim: '“Let the heathen be wakened” is the nations rousing themselves'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Joel%203&version=NRSVUE'
    quote: 'Let the nations rouse themselves'

  # ---- note 3:1 ----
  - where: 'note 3:1 “More than captives coming home”'
    claim: 'A modern translation renders the phrase “restore the fortunes”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Joel%203&version=NRSVUE'
    quote: 'when I restore the fortunes of Judah and Jerusalem'
  - where: 'note 3:1 “More than captives coming home”'
    claim: 'BDB lists “restore the captivity of” as a set phrase'
    key: bdb
    url: 'https://biblehub.com/hebrew/7622.htm'
    quote: 'in phrase restore the captivity of'
  - where: 'note 3:1 “More than captives coming home”'
    claim: 'BDB lists Deuteronomy 30:3 and Joel 4:1 (3:1) among the uses of the phrase of Israel or Judah'
    key: bdb
    url: 'https://biblehub.com/hebrew/7622.htm'
    quote: 'Deuteronomy 30:3; Jeremiah 29:14'
  - where: 'note 3:1 “More than captives coming home”'
    claim: 'The noun in 3:1 is shevut (H7622)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Joel.xml'
    quote: 'שְׁב֥וּת'
  - where: 'note 3:1 “More than captives coming home”'
    claim: '“In those days” and “afterward” are connected'
    key: ot-minute-joel
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-joel'
    quote: 'These references to a future time are connected in Joel’s prophecy.'

  # ---- note 3:2 ----
  - where: 'note 3:2 “A valley named for its verdict”'
    claim: 'The name means “Jehovah judges”; there is no known valley of the name; it probably symbolizes the place of judgment'
    key: ot-minute-joel
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-joel'
    quote: 'In Israel, there is no valley or place called Jehoshaphat. The name means “Jehovah judges,” and the “valley of Jehoshaphat” probably symbolizes God’s place of judgment.'
  - where: 'note 3:2 “A valley named for its verdict”'
    claim: 'The name is formed from the divine name and shaphat, “Jehovah-judged”'
    key: strongs-concordance
    url: 'https://biblehub.com/hebrew/3092.htm'
    quote: 'From Yhovah and shaphat; Jehovah-judged; Jehoshaphat, the name of six Israelites; also of a valley near Jerusalem'
  - where: 'note 3:2 “A valley named for its verdict”'
    claim: '“Plead” in 3:2 is the verb shaphat (H8199), in the Niphal'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Joel.xml'
    quote: 'וְ/נִשְׁפַּטְתִּ֨י'
  - where: 'note 3:2 “A valley named for its verdict”'
    claim: '“To judge” in 3:12 is the same verb; it occurs in Joel only in 3:2 and 3:12'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Joel.xml'
    quote: 'לִ/שְׁפֹּ֥ט'
  - where: 'note 3:2 “A valley named for its verdict”'
    claim: 'The name in 3:2 and 3:12 (H3092)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Joel.xml'
    quote: 'יְהֽוֹשָׁפָ֑ט'
  - where: 'note 3:2 “A valley named for its verdict”'
    claim: 'A modern translation: “enter into judgment”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Joel%203&version=NRSVUE'
    quote: 'I will enter into judgment with them there'
  - where: 'note 3:2 “A valley named for its verdict”'
    claim: 'The name occurs nowhere else in the Bible and was formed by Joel from the judgment'
    key: keil-joel
    url: 'https://biblehub.com/commentaries/kad/joel/3.htm'
    quote: 'the name, which does not occur anywhere else in either the Old or New Testament, excepting here and in Joel 3:12, is formed by Joel'
  - where: 'note 3:2 “A valley named for its verdict”'
    claim: 'Keil seeks the valley in or near Jerusalem'
    key: keil-joel
    url: 'https://biblehub.com/commentaries/kad/joel/3.htm'
    quote: 'is unquestionably to be sought for, according to this chapter (as compared with Zechariah 14:4), in or near Jerusalem'
  - where: 'note 3:2 “A valley named for its verdict”'
    claim: 'Church tradition, from Eusebius and Jerome, assigns it to the Kidron'
    key: keil-joel
    url: 'https://biblehub.com/commentaries/kad/joel/3.htm'
    quote: 'has correctly assigned it to the valley of the Kidron, on the eastern side of Jerusalem'
  - where: 'note 3:2 “A valley named for its verdict”'
    claim: 'The tradition is reported from Eusebius and Jerome'
    key: keil-joel
    url: 'https://biblehub.com/commentaries/kad/joel/3.htm'
    quote: 'The tradition of the church (see Euseb. and Jerome in the Onom.'
  - where: 'note 3:2 “A valley named for its verdict”'
    claim: 'Some connect the name with King Jehoshaphat’s victory (2 Chronicles 20); Keil rejects it because that valley was named the valley of blessing'
    key: keil-joel
    url: 'https://biblehub.com/commentaries/kad/joel/3.htm'
    quote: 'is not the valley in which the judgment upon several heathen nations took place under Jehoshaphat (2 Chronicles 20), and which received the name of Valley of blessing'
  - where: 'note 3:2 “A valley named for its verdict”'
    claim: 'The Bible Dictionary places the valley east of Jerusalem'
    key: bd-jehoshaphat-valley-of
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehoshaphat-valley-of?lang=eng'
    quote: 'East of Jerusalem, between the city and the mount of Olives, referred to in Joel 3:2, 12.'
  - where: 'note 3:2 “A valley named for its verdict”'
    claim: 'After Jehoshaphat’s deliverance the valley was named Berachah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/20?lang=eng'
    quote: 'therefore the name of the same place was called, The valley of Berachah, unto this day'

  # ---- note 3:3 ----
  - where: 'note 3:3 “People divided like plunder”'
    claim: 'Lots were cast for a conquered city’s nobles'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/nahum/3?lang=eng'
    quote: 'they cast lots for her honourable men, and all her great men were bound in chains'
  - where: 'note 3:3 “People divided like plunder”'
    claim: 'Foreigners cast lots upon Jerusalem when its forces were carried captive'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/obad/1?lang=eng'
    quote: 'foreigners entered into his gates, and cast lots upon Jerusalem'
  - where: 'note 3:3 “People divided like plunder”'
    claim: 'Sperry reads the nations as the Gentile nations judged for scattering Israel, in the latter days'
    key: sperry-moroni-expounds
    url: 'https://scripturecentral.org/archive/periodicals/journal-article/moroni-expounds-old-testament-scriptures'
    quote: 'Reference is also made to the Gentile nations who shall be judged because they have scattered Israel'

  # ---- note 3:4 ----
  - where: 'note 3:4 “The traders of the coast, repaid in kind”'
    claim: 'Tyre was a commercial seaport'
    key: bd-tyre
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tyre?lang=eng'
    quote: 'an important commercial and seaport town of Syria'
  - where: 'note 3:4 “The traders of the coast, repaid in kind”'
    claim: 'Zidon was the chief city of Phoenicia'
    key: bd-zidon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zidon?lang=eng'
    quote: 'In ancient times it was the most important city of Phoenicia'
  - where: 'note 3:4 “The traders of the coast, repaid in kind”'
    claim: 'The Hebrew behind “Palestine” is Pelesheth (H6429)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Joel.xml'
    quote: 'פְּלָ֑שֶׁת'
  - where: 'note 3:4 “The traders of the coast, repaid in kind”'
    claim: '“Coasts” is gelilot: circuit, boundary, territory'
    key: bdb
    url: 'https://biblehub.com/hebrew/1552.htm'
    quote: 'noun feminine circuit, boundary, territory'
  - where: 'note 3:4 “The traders of the coast, repaid in kind”'
    claim: 'A modern translation: “all the regions of Philistia”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Joel%203&version=NRSVUE'
    quote: 'all the regions of Philistia'
  - where: 'note 3:4 “The traders of the coast, repaid in kind”'
    claim: 'The Philistines held the coastal lowland; Gaza was one of their five cities'
    key: bd-philistines
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/philistines?lang=eng'
    quote: 'the rich lowland on the Mediterranean coast from Joppa to the Egyptian desert. They formed a confederation of five chief cities, namely, Ashdod, Gaza, Ashkelon, Gath, and Ekron'
  - where: 'note 3:4 “The traders of the coast, repaid in kind”'
    claim: 'The Philistines’ name became “Palestine” for the whole land'
    key: bd-philistines
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/philistines?lang=eng'
    quote: 'the name of the territory of these enemies of the Jews has become one familiar title (Palestine) for all of the Holy Land'
  - where: 'note 3:4 “The traders of the coast, repaid in kind”'
    claim: '“The Grecians” is in Hebrew the sons of the Yevanim (H3125)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Joel.xml'
    quote: 'הַ/יְּוָנִ֑ים'
  - where: 'note 3:4 “The traders of the coast, repaid in kind”'
    claim: 'Javan was regarded as the founder of the Greek race'
    key: bd-javan
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/javan?lang=eng'
    quote: 'Son of Japheth; regarded as the founder of the Greek race'
  - where: 'note 3:4 “The traders of the coast, repaid in kind”'
    claim: 'Amos charges Gaza and Tyre with delivering up captives'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/amos/1?lang=eng'
    quote: 'because they delivered up the whole captivity to Edom, and remembered not the brotherly covenant'
  - where: 'note 3:4 “The traders of the coast, repaid in kind”'
    claim: 'A Sabean is a Shebaite'
    key: strongs-concordance
    url: 'https://biblehub.com/hebrew/7615.htm'
    quote: 'a Shebaite or descendant of Sheba'
  - where: 'note 3:4 “The traders of the coast, repaid in kind”'
    claim: 'The descendants of one Sheba gave their name to part of southern Arabia'
    key: bd-sheba
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sheba?lang=eng'
    quote: 'his descendants gave their name to a portion of southern Arabia'

  # ---- note 3:9 ----
  - where: 'note 3:9 “A war made holy”'
    claim: '“Prepare” in 3:9 is the verb qadash (H6942), a plural imperative'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Joel.xml'
    quote: 'קַדְּשׁ֖וּ'
  - where: 'note 3:9 “A war made holy”'
    claim: 'The same verb stands in 1:14, 2:15 and 2:16; four times in Joel (hebrew.mjs joel --word 6942)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Joel.xml'
    quote: 'קַדְּשׁוּ'
  - where: 'note 3:9 “A war made holy”'
    claim: 'The verb means to be set apart, consecrated'
    key: bdb
    url: 'https://biblehub.com/hebrew/6942.htm'
    quote: 'verb denominative be set apart, consecrated'
  - where: 'note 3:9 “A war made holy”'
    claim: 'A modern translation: “Consecrate yourselves for war”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Joel%203&version=NRSVUE'
    quote: 'Consecrate yourselves for war'
  - where: 'note 3:9 “A war made holy”'
    claim: '“Gentiles” (3:9) and “heathen” (3:11, 12) are both goyim (H1471)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Joel.xml'
    quote: 'בַּ/גּוֹיִ֔ם'

  # ---- note 3:10 ----
  - where: 'note 3:10 “Isaiah’s line turned around”'
    claim: 'Joel 3:10 has the verb “beat” (H3807) and “plowshares” (H855)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Joel.xml'
    quote: 'אִתֵּי/כֶם֙'
  - where: 'note 3:10 “Isaiah’s line turned around”'
    claim: 'Isaiah 2:4 has the same verb and the same nouns for plowshares (H855) and pruninghooks (H4211)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Isa.xml'
    quote: 'לְ/מַזְמֵר֔וֹת'
  - where: 'note 3:10 “Isaiah’s line turned around”'
    claim: '“Strong” in 3:10 is gibbor (H1368), the word for the “mighty men” of 3:9'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Joel.xml'
    quote: 'גִּבּ֥וֹר'
  - where: 'note 3:10 “Isaiah’s line turned around”'
    claim: 'A modern translation has the weakling say “I am a warrior”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Joel%203&version=NRSVUE'
    quote: 'I am a warrior'
  - where: 'note 3:10 “Isaiah’s line turned around”'
    claim: 'The Church’s footnote on “strong” points to 2 Corinthians 12:10 and Ether 12:27'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/joel/3?lang=eng'
    quote: '2 Cor. 12:10; Heb. 11:34; Ether 12:27; D&C 50:16'

  # ---- note 3:11 ----
  - where: 'note 3:11 “A prayer in the middle of the summons”'
    claim: 'The verb in 3:11b is a singular imperative of “go down” (H5181)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Joel.xml'
    quote: 'הַֽנְחַ֥ת'
  - where: 'note 3:11 “A prayer in the middle of the summons”'
    claim: 'BDB translates the clause'
    key: bdb
    url: 'https://biblehub.com/hebrew/5181.htm'
    quote: 'thither bring down thy heroes'
  - where: 'note 3:11 “A prayer in the middle of the summons”'
    claim: 'Keil reads 3:11b as Joel’s prayer'
    key: keil-joel
    url: 'https://biblehub.com/commentaries/kad/joel/3.htm'
    quote: 'It is not till Joel 3:11 that Joel steps in with a prayer addressed to the Lord'
  - where: 'note 3:11 “A prayer in the middle of the summons”'
    claim: '“Mighty ones” is gibborim (H1368), as in 3:9 and 3:10'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Joel.xml'
    quote: 'גִּבּוֹרֶֽי/ךָ'
  - where: 'note 3:11 “A prayer in the middle of the summons”'
    claim: 'The mighty ones are understood as heavenly hosts or angels'
    key: keil-joel
    url: 'https://biblehub.com/commentaries/kad/joel/3.htm'
    quote: 'The heroes of Jehovah are heavenly hosts, or angels, who execute His commands'
  - where: 'note 3:11 “A prayer in the middle of the summons”'
    claim: 'Psalm 103:20 uses gibbor (H1368) of the angels'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'גִּבֹּ֣רֵי'
  - where: 'note 3:11 “A prayer in the middle of the summons”'
    claim: 'A modern translation marks the verse as uncertain'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Joel%203&version=NRSVUE'
    quote: 'Meaning of Heb uncertain'
  - where: 'note 3:11 “A prayer in the middle of the summons”'
    claim: 'The Septuagint has no prayer in 3:11'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/joel/3.htm'
    quote: 'gather yourselves there; let the timid become a warrior'

  # ---- note 3:12 ----
  - where: 'note 3:12 “Is this Armageddon?”'
    claim: 'Armageddon is a Greek transliteration of Har Megiddon'
    key: bd-armageddon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/armageddon?lang=eng'
    quote: 'A Greek transliteration from the Hebrew Har Megiddon, or “Mountain of Megiddo.”'
  - where: 'note 3:12 “Is this Armageddon?”'
    claim: 'Megiddo is about 75 miles north of Jerusalem'
    key: bd-armageddon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/armageddon?lang=eng'
    quote: 'The valley of Megiddo is in the western portion of the plain of Esdraelon about 75 miles north of Jerusalem.'
  - where: 'note 3:12 “Is this Armageddon?”'
    claim: 'The final conflict at the Second Coming is called the battle of Armageddon'
    key: bd-armageddon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/armageddon?lang=eng'
    quote: 'A great and final conflict taking place at the Second Coming of the Lord is called the battle of Armageddon.'
  - where: 'note 3:12 “Is this Armageddon?”'
    claim: 'The Student Manual reads the passage of the final scenes of Armageddon in Jerusalem'
    key: ot-manual-7
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-7?lang=eng'
    quote: 'This passage seems to refer to the final scenes of the battle of Armageddon in Jerusalem, when the great earthquake will strike the massive army'
  - where: 'note 3:12 “Is this Armageddon?”'
    claim: 'Many scholars identify the scene as Armageddon'
    key: ot-minute-joel
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-joel'
    quote: 'Many biblical scholars identify this as the Battle of Armageddon.'
  - where: 'note 3:12 “Is this Armageddon?”'
    claim: 'Elder Joseph Fielding Smith, as the manual prints him: Joel, Zephaniah and Zechariah all proclaim the gathering against Jerusalem'
    key: ot-manual-7
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-7?lang=eng'
    quote: 'We find Joel, Zephaniah, Zechariah, all proclaiming that in this last day'
  - where: 'note 3:12 “Is this Armageddon?”'
    claim: 'Elder Smith: the nations would gather against Jerusalem'
    key: ot-manual-7
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-7?lang=eng'
    quote: 'that the nations of the earth would gather against Jerusalem'
  - where: 'note 3:12 “Is this Armageddon?”'
    claim: 'Elder Smith: the Lord will come out of His hiding place'
    key: ot-manual-7
