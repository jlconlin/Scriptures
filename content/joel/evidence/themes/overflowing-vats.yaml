page: overflowing-vats
claims:
  # ---------- opening ----------
  - where: 'opening'
    claim: 'Joel 2:24 and 3:13 as quoted; footnote 2:24a and 3:13d “fats”: OR vats; footnote 3:13c “press”: Rev. 14:19; D&C 76:107; footnote 3:12b “judge”: TG Jesus Christ, Judge; 3:13a “sickle”: Alma 26:5; D&C 4:4'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/joel/3?lang=eng'
    quote: 'Put ye in the sickle, for the harvest is ripe: come, get you down; for the press is full, the fats overflow; for their wickedness is great.'
  - where: 'opening'
    claim: 'Joel 2:24 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/joel/2?lang=eng'
    quote: 'And the floors shall be full of wheat, and the fats shall overflow with wine and oil.'
  - where: 'opening'
    claim: 'yeqeb (H3342) and šûq (H7783, hiphil hēšîqû) stand together in Joel only at 2:24 and 3:13; šûq in the Old Testament only there and Ps. 65:9 (a different stem)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Joel.xml'
    quote: 'הֵשִׁ֨יקוּ֙'
  - where: 'opening'
    claim: '2:24 wĕhēšîqû hayyĕqābîm'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Joel.xml'
    quote: 'וְ/הֵשִׁ֥יקוּ'
  - where: 'opening'
    claim: 'Ps. 65:9 (Heb. 65:10) tĕšōqĕqehā, the only other occurrence of šûq, God the subject'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'וַ/תְּשֹׁ֪קְקֶ֡/הָ'
  - where: 'opening'
    claim: 'Ps. 65:9 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/65?lang=eng'
    quote: 'Thou visitest the earth, and waterest it'
  - where: 'opening'
    claim: 'Keil on 2:24: the hiphil of šûq “only here and Joel 3:13, to run over, to overflow; pilel, Psalm 65:10”'
    key: keil-joel
    url: 'https://biblehub.com/commentaries/kad/joel/2.htm'
    quote: 'hiphil only here and Joel 3:13, to run over, to overflow; pilel, Psalm 65:10'
  - where: 'opening'
    claim: 'Joel 2:25 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/joel/2?lang=eng'
    quote: 'And I will restore to you the years that the locust hath eaten'
  - where: 'opening'
    claim: 'Keil on 3:13: the words of 2:24 “here figuratively employed”'
    key: keil-joel
    url: 'https://biblehub.com/commentaries/kad/joel/3.htm'
    quote: 'is used in Joel 2:24 to denote the most abundant harvest; here it is figuratively employed'
  - where: 'opening'
    claim: 'Cambridge on 3:13: “The same words (in a literal sense) Joel 2:24.”'
    key: cambridge-joel
    url: 'https://biblehub.com/commentaries/cambridge/joel/3.htm'
    quote: 'The same words (in a literal sense) Joel 2:24.'
  - where: 'opening'
    claim: 'BDB on šûq: “the vats overflow with must, so (accusative omitted) Joel 4:13” (= KJV 3:13), the two verses in one entry'
    key: bdb
    url: 'https://biblehub.com/hebrew/7783.htm'
    quote: 'Joel 2:24 the vats overflow with must, so (accusative omitted) Joel 4:13'
  - where: 'opening'
    claim: 'Connection made by this page: Joel’s two overflows are one measure used first of mercy (2:24, the Lord repays) and then of judgment (3:13, the nations’ wickedness is full); Keil, Cambridge and BDB note the repeated words and the figurative use, none reads the two as the book’s one measure'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/joel/3?lang=eng'
    quote: 'for the press is full, the fats overflow; for their wickedness is great'
  - where: 'opening'
    claim: 'D&C 76:107 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/76?lang=eng'
    quote: 'I have overcome and have trodden the wine-press alone, even the wine-press of the fierceness of the wrath of Almighty God.'
  # ---------- section “Cut off from your mouth” ----------
  - where: 'section “Cut off from your mouth”'
    claim: 'Joel 1:5, 9, 10 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/joel/1?lang=eng'
    quote: 'Awake, ye drunkards, and weep; and howl, all ye drinkers of wine, because of the new wine; for it is cut off from your mouth.'
  - where: 'section “Cut off from your mouth”'
    claim: 'kārat (H3772) in Joel only at 1:5, 1:9, 1:16'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Joel.xml'
    quote: 'נִכְרַ֖ת'
  - where: 'section “Cut off from your mouth”'
    claim: 'Student Manual 7-5: Judah “drunken with the wine of iniquity”; “The vineyard was to be cut off: Judah would be humbled by the Lord’s almighty hand so they could be drunken no more.”'
    key: ot-manual-7
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-7?lang=eng'
    quote: 'Judah had become drunken with the wine of iniquity and would have cause to weep and to howl'
  - where: 'section “Cut off from your mouth”'
    claim: 'Student Manual 7-5: “The vineyard was to be cut off … so they could be drunken no more.”'
    key: ot-manual-7
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-7?lang=eng'
    quote: 'The vineyard was to be cut off: Judah would be humbled by the Lord’s almighty hand so they could be drunken no more.'
  - where: 'section “Cut off from your mouth”'
    claim: 'ʿāsîs (H6071) in Joel only at 1:5 and 3:18; tîrôš (H8492) at 1:10, 2:19, 2:24'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Joel.xml'
    quote: 'עָסִ֕יס'
  - where: 'section “Cut off from your mouth”'
    claim: '1:10 tîrôš'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Joel.xml'
    quote: 'תִּיר֖וֹשׁ'
  - where: 'section “Cut off from your mouth”'
    claim: 'BDB on ʿāsîs: “sweet wine (properly pressed out juice)”; Joel 1:5; 4:18; Amos 9:13; in simile Isa. 49:26'
    key: bdb
    url: 'https://biblehub.com/hebrew/6071.htm'
    quote: 'sweet wine (properly pressed out juice)'
  - where: 'section “Cut off from your mouth”'
    claim: 'BDB on tîrôš: “must, fresh or new wine”'
    key: bdb
    url: 'https://biblehub.com/hebrew/8492.htm'
    quote: 'must, fresh or new wine'
  # ---------- section “The fats shall overflow with wine and oil” ----------
  - where: 'section “The fats shall overflow with wine and oil”'
    claim: 'Joel 2:12–13, 19, 23, 24, 25 as quoted; footnote 2:24a “fats”: OR vats'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/joel/2?lang=eng'
    quote: 'turn ye even to me with all your heart, and with fasting, and with weeping, and with mourning'
  - where: 'section “The fats shall overflow with wine and oil”'
    claim: 'Joel 2:19 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/joel/2?lang=eng'
    quote: 'Behold, I will send you corn, and wine, and oil, and ye shall be satisfied therewith'
  - where: 'section “The fats shall overflow with wine and oil”'
    claim: 'Keil on 2:24: “the counterpart to Joel 1:10-12”'
    key: keil-joel
    url: 'https://biblehub.com/commentaries/kad/joel/2.htm'
    quote: 'the counterpart to Joel 1:10-12'
  - where: 'section “The fats shall overflow with wine and oil”'
    claim: 'Cambridge on 2:24: “The reversal of Joel 1:10-12.”'
    key: cambridge-joel
    url: 'https://biblehub.com/commentaries/cambridge/joel/2.htm'
    quote: 'The reversal of Joel 1:10-12.'
  - where: 'section “The fats shall overflow with wine and oil”'
    claim: 'Connection made by this page: in Ps. 65:9 and Joel 2:24 the overflow is the Lord’s giving (God watering the earth; the Lord sending the rain, 2:23), while 3:13 gives another cause, “for their wickedness is great”; the contrast is the page’s, no commentary read remarks on it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/joel/2?lang=eng'
    quote: 'he will cause to come down for you the rain, the former rain, and the latter rain in the first month.'
  - where: 'section “The fats shall overflow with wine and oil”'
    claim: 'Student Manual 7-10: the years of the locust “indicate generations of oppression for scattered and rejected Israel”; Israel restored to the covenant'
    key: ot-manual-7
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-7?lang=eng'
    quote: 'indicate generations of oppression for scattered and rejected Israel'
  # ---------- section “The press is full, the fats overflow” ----------
