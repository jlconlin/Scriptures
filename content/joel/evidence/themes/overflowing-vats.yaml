page: overflowing-vats
claims:
  - where: 'opening'
    claim: 'The noun yeqevim (vats) stands in Joel only at 2:24 and 3:13 (occurrences --hebrew 3342: 2; same for shuq 7783)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Joel.xml'
    quote: 'הַ/יְקָבִ֖ים'
  - where: 'opening'
    claim: 'The verb shuq (Hiphil perfect, overflow) in 2:24'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Joel.xml'
    quote: 'וְ/הֵשִׁ֥יקוּ'
  - where: 'opening'
    claim: 'The verb shuq (Hiphil perfect, overflow) in 3:13 (Hebrew 4:13) and the noun yeqevim'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Joel.xml'
    quote: 'הֵשִׁ֨יקוּ֙'
  - where: 'opening'
    claim: 'The Church footnote on “fats” gives “vats”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/joel/2?lang=eng'
    quote: 'OR vats'
  - where: 'opening'
    claim: 'BDB sets 2:24 and 3:13 (Joel 4:13) side by side: the vats overflow with must, so … Joel 4:13'
    key: bdb
    url: 'https://biblehub.com/hebrew/7783.htm'
    quote: 'the vats overflow with must, so (accusative omitted) Joel 4:13'
  - where: 'section “Cut off from your mouth”'
    claim: '1:5 the new wine is cut off from your mouth (karat, Niphal)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Joel.xml'
    quote: 'נִכְרַ֖ת'
  - where: 'section “Cut off from your mouth”'
    claim: '1:9 the offering is cut off from the house of the LORD (karat, Hophal; same root)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Joel.xml'
    quote: 'הָכְרַ֥ת'
  - where: 'section “Cut off from your mouth”'
    claim: 'Church footnote text of 1:5 and 1:9 as KJV: the new wine cut off from the mouth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/joel/1?lang=eng'
    quote: 'because of the new wine; for it is cut off from your mouth.'
  - where: 'section “The fats shall overflow”'
    claim: '2:19 the LORD answers: I will send you corn, wine and oil'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/joel/2?lang=eng'
    quote: 'Behold, I will send you corn, and wine, and oil, and ye shall be satisfied therewith'
  - where: 'section “The fats shall overflow”'
    claim: '2:24 floors full (malé) and vats overflow with wine and oil'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Joel.xml'
    quote: 'וּ/מָלְא֥וּ'
  - where: 'section “The press is full, the fats overflow”'
    claim: '3:13 the press is full (malé, the verb used of the floors in 2:24)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Joel.xml'
    quote: 'מָ֣לְאָה'
  - where: 'section “The press is full, the fats overflow”'
    claim: '3:13 states the reason: their wickedness is great (rabbah ra''atam)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Joel.xml'
    quote: 'רָעָתָֽ/ם'
  - where: 'section “The press is full, the fats overflow”'
    claim: 'Connection made by this page: 2:24 and 3:13 set side by side, one set of words, a harvest given and a judgment pictured as a harvest'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/joel/3?lang=eng'
    quote: 'for the press is full, the fats overflow; for their wickedness is great.'
  - where: 'section “The press is full, the fats overflow”'
    claim: 'Connection made by this page (2:24 side)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/joel/2?lang=eng'
    quote: 'the floors shall be full of wheat, and the fats shall overflow with wine and oil.'
  - where: 'section “The press is full, the fats overflow”'
    claim: '3:12 the heathen come up to the valley of Jehoshaphat, where the LORD will sit to judge'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/joel/3?lang=eng'
    quote: 'for there will I sit to judge all the heathen round about.'
  - where: 'section “Who treads”'
    claim: 'Church footnote 13c on “press” gives Rev. 14:19 and D&C 76:107'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/joel/3?lang=eng'
    quote: 'Rev. 14:19; D&C 76:107.'
  - where: 'section “Who treads”'
    claim: 'Rev. 14:14 one like unto the Son of man with a sickle; footnote 14a is TG Jesus Christ, Son of Man'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/14?lang=eng'
    quote: 'upon the cloud one sat like unto the Son of man, having on his head a golden crown, and in his hand a sharp sickle.'
  - where: 'section “Who treads”'
    claim: 'Rev. 14:16 he that sat on the cloud reaped the earth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/14?lang=eng'
    quote: 'And he that sat on the cloud thrust in his sickle on the earth; and the earth was reaped.'
  - where: 'section “Who treads”'
    claim: 'Rev. 14:19–20 an angel gathers the vine into the great winepress of the wrath of God; it was trodden (passive, no treader named)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/14?lang=eng'
    quote: 'the angel thrust in his sickle into the earth, and gathered the vine of the earth, and cast it into the great winepress of the wrath of God.'
  - where: 'section “Who treads”'
    claim: 'Rev. 14:20 the winepress was trodden'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/14?lang=eng'
    quote: 'And the winepress was trodden without the city'
  - where: 'section “Who treads”'
    claim: 'Rev. 19:13, 15 the rider called The Word of God treadeth the winepress'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/19?lang=eng'
    quote: 'and he treadeth the winepress of the fierceness and wrath of Almighty God.'
  - where: 'section “Who treads”'
    claim: 'Rev. 19:13 his name is called The Word of God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/19?lang=eng'
    quote: 'his name is called The Word of God.'
  - where: 'section “Who treads”'
    claim: 'D&C 76:107 I have overcome and have trodden the wine-press alone'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/76?lang=eng'
    quote: 'I have overcome and have trodden the wine-press alone, even the wine-press of the fierceness of the wrath of Almighty God.'
  - where: 'section “Who treads”'
    claim: 'D&C 88:106 the Lamb of God hath trodden the wine-press alone'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/88?lang=eng'
    quote: 'The Lamb of God hath overcome and trodden the wine-press alone'
  - where: 'section “Who treads”'
    claim: 'Church footnote 12b on “judge” in Joel 3:12 is TG Jesus Christ, Judge'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/joel/3?lang=eng'
    quote: 'TG Jesus Christ, Judge.'
  - where: 'section “The mountains shall drop down new wine”'
    claim: '3:18 the mountains drop new wine (asis); the word is also 1:5; only those two verses in Joel (occurrences --hebrew 6071: 2)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Joel.xml'
    quote: 'עָסִ֗יס'
  - where: 'section “The mountains shall drop down new wine”'
    claim: '1:5 uses the same word asis for the new wine'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Joel.xml'
    quote: 'עָסִ֕יס'
  - where: 'section “The mountains shall drop down new wine”'
    claim: '3:18 text: hills flow with milk; a fountain shall come forth of the house of the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/joel/3?lang=eng'
    quote: 'a fountain shall come forth of the house of the LORD'
  - where: 'section “The mountains shall drop down new wine”'
    claim: 'Connection made by this page: the new wine cut off in 1:5 set beside the new wine dripping in 3:18 as loss and return (shared word asis)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Joel.xml'
    quote: 'יִטְּפ֧וּ'
  - where: 'section “The mountains shall drop down new wine”'
    claim: '3:13 names no wine (the verse as quoted)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/joel/3?lang=eng'
    quote: 'Put ye in the sickle, for the harvest is ripe'
  - where: 'section “Through Jesus Christ”'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: 'section “Through Jesus Christ”'
    claim: 'Connection made by this page: the LORD who says I will send you corn, wine and oil (2:19) set beside the one who says there will I sit to judge (3:12); the vats overflow in the verses that follow each (2:24; 3:13)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/joel/2?lang=eng'
    quote: 'Yea, the LORD will answer and say unto his people'
  - where: 'section “Cut off from your mouth”'
    claim: 'The verb cut off (karat, Strong’s 3772) is also in 1:16, of food (occurrences --hebrew 3772: 1:5, 1:9, 1:16)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/joel/1?lang=eng'
    quote: 'Is not the meat cut off before our eyes'
  - where: 'section “The mountains shall drop down new wine”'
    claim: 'The new wine of 1:10 is tirosh (Strong’s 8492), a different word from the asis of 1:5 and 3:18'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Joel.xml'
    quote: 'תִּיר֖וֹשׁ'
  - where: 'section “The mountains shall drop down new wine”'
    claim: 'Tirosh is the word translated wine in 2:19'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Joel.xml'
    quote: 'וְ/הַ/תִּיר֣וֹשׁ'
  - where: 'section “The mountains shall drop down new wine”'
    claim: 'Tirosh is the word translated wine in 2:24 (occurrences --hebrew 8492: 1:10, 2:19, 2:24)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Joel.xml'
    quote: 'תִּיר֥וֹשׁ'
  - where: 'section “Who treads”'
    claim: 'The Church’s footnote on winepress at Rev. 14:19 points to Isa. 63:3, Joel 3:13, Rev. 19:15 and D&C 88:106'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/14?lang=eng'
    quote: 'Isa. 63:3 (3–4); Joel 3:13; Rev. 19:15; D&C 88:106.'
  - where: 'section “Who treads”'
    claim: 'In D&C 76:106–107 the speaker of I have trodden the wine-press alone is Christ, delivering up the kingdom to the Father'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/76?lang=eng'
    quote: 'When he shall deliver up the kingdom, and present it unto the Father, spotless, saying: I have overcome and have trodden the wine-press alone'
  - where: 'section “Through Jesus Christ”'
    claim: 'The name Jehovah is printed in the King James text as LORD in small capitals'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'the name is generally denoted by Lord or God, printed in small capitals'
  - where: 'section “Through Jesus Christ”'
    claim: '3:12 the LORD says there will I sit to judge'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/joel/3?lang=eng'
    quote: 'for there will I sit to judge all the heathen round about'
  - where: 'section “Through Jesus Christ”'
    claim: '2:24 the vats shall overflow with wine and oil'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/joel/2?lang=eng'
    quote: 'the fats shall overflow with wine and oil'
  - where: 'section “Through Jesus Christ”'
    claim: '3:13 the vats overflow'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/joel/3?lang=eng'
    quote: 'for the press is full, the fats overflow'
