    url: 'https://biblehub.com/commentaries/kad/joel/3.htm'
    quote: 'figuratively employed to denote the great mass of men who are ripe for the judgment'
  - where: 'section “The press is full, the fats overflow”'
    claim: 'Keil on 3:13: “their wickedness is great,” which recals Genesis 6:5'
    key: keil-joel
    url: 'https://biblehub.com/commentaries/kad/joel/3.htm'
