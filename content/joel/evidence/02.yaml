chapter: 2
claims:
  # ---- when ----
  - where: 'when'
    claim: 'The date of Joel’s life is uncertain: between Joash (before 850 B.C.) and the return from Babylon'
    key: gs-joel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/joel?lang=eng'
    quote: 'The date of his life is uncertain—he may have lived sometime between the reign of Joash, before 850 B.C., and the return of the tribe of Judah from captivity in Babylon.'
  - where: 'when'
    claim: 'Joel was a prophet of Judah'
    key: bd-joel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/joel?lang=eng'
    quote: 'A prophet of Judah. The date of his prophecy is uncertain'

  # ---- setting ----
  - where: 'setting'
    claim: 'The Guide to the Scriptures gives the range of dates'
    key: gs-joel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/joel?lang=eng'
    quote: 'he may have lived sometime between the reign of Joash, before 850 B.C., and the return of the tribe of Judah from captivity in Babylon'
  - where: 'setting'
    claim: 'The occasion of the prophecy was drought and locusts'
    key: bd-joel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/joel?lang=eng'
    quote: 'The occasion of the prophecy was a severe visitation of drought and locusts.'
  - where: 'setting'
    claim: 'Verses 12–17 are a plea for repentance; verses 17–27 the Lord’s pity and blessing (an outline of the book)'
    key: sperry-moroni-expounds
    url: 'https://scripturecentral.org/archive/periodicals/journal-article/moroni-expounds-old-testament-scriptures'
    quote: 'This constitutes a plea to the Lord’s people for repentance and reform.'
  - where: 'setting'
    claim: 'The Church edition’s chapter heading reads the chapter of the time before the Second Coming'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/joel/2?lang=eng'
    quote: 'War and desolation will precede the Second Coming'
  - where: 'setting'
    claim: 'Peter quoted the passage at Pentecost and Moroni quoted it to Joseph Smith'
    key: bd-joel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/joel?lang=eng'
    quote: 'His prophecy of the outpouring of the Spirit (2:28–32) was quoted by Peter on the day of Pentecost (Acts 2:17), and by the angel Moroni to Joseph Smith (JS—H 1:41).'
  - where: 'setting'
    claim: 'Moroni’s visit was in 1823'
    key: scripture-helps-hosea
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/45-hosea-1-6-10-14-joel?lang=eng'
    quote: 'on the evening of September 21, 1823, the angel Moroni appeared to Joseph Smith and quoted Joel 2:28–32'
  - where: 'setting'
    claim: 'In the Hebrew Bible verses 28–32 are a separate chapter and Joel has four chapters'
    key: sperry-moroni-expounds
    url: 'https://scripturecentral.org/archive/periodicals/journal-article/moroni-expounds-old-testament-scriptures'
    quote: 'in the Hebrew Bible the verses quoted by Moroni form a separate chapter by themselves, as the book of Joel is there divided into four chapters, rather than three, as in the King James Version'
  - where: 'setting'
    claim: 'Joel 2:28 is 3:1 in the Hebrew numbering'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Joel%202&version=NRSVUE'
    quote: '2.28 3.1 in Heb'

  # ---- thread ----
  - where: 'thread'
    claim: 'Verses 1 and 15 open with the same Hebrew words, “blow the trumpet” (H8628, H7782); this is the form in verse 1'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Joel.xml'
    quote: 'תִּקְע֨וּ'
  - where: 'thread'
    claim: 'Verse 15 has the same verb and noun'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Joel.xml'
    quote: 'תִּקְע֥וּ'
  - where: 'thread'
    claim: '“Done great things” in verse 20 and “do great things” in verse 21 are the same Hebrew verb (H1431, with H6213); verse 20’s form'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Joel.xml'
    quote: 'הִגְדִּ֖יל'
  - where: 'thread'
    claim: 'Verse 21’s form of the same verb'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Joel.xml'
    quote: 'הִגְדִּ֥יל'
  - where: 'thread'
    claim: 'In chapter 1 the land mourns and the beasts groan'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/joel/1?lang=eng'
    quote: 'How do the beasts groan!'
  - where: 'thread'
    claim: '“Pour out” compares the gift of the Spirit to rain'
    key: keil-joel
    url: 'https://biblehub.com/commentaries/kad/joel/2.htm'
    quote: 'to pour out, signifies communication in rich abundance, like a rain-fall or water-fall'

  # ---- sections ----
  - where: 'section 1 plain'
    claim: 'The trumpet is the shofar, or ram’s horn'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/joel/2?lang=eng'
    quote: 'HEB shofar, or ram’s horn.'
  - where: 'section 1 plain'
    claim: '“Gather blackness” is an idiom for gloom'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/joel/2?lang=eng'
    quote: 'Hebrew idiom meaning “gloom.”'
  - where: 'section 1 plain'
    claim: 'Verse 8: weapons do not halt them'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Joel%202&version=NRSVUE'
    quote: 'they burst through the weapons'
  - where: 'section 1 plain'
    claim: 'Verse 11: “who can endure it?”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Joel%202&version=NRSVUE'
    quote: 'terrible indeed—who can endure it?'
  - where: 'section 2 plain'
    claim: '“Yet even now”; “relenting from punishment”; “a grain offering”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Joel%202&version=NRSVUE'
    quote: 'Yet even now, says the Lord,'
  - where: 'section 2 plain'
    claim: 'The “meat offering” is a grain offering'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Joel%202&version=NRSVUE'
    quote: 'a grain offering and a drink offering'
  - where: 'section 3 plain'
    claim: 'The bride’s “closet” is a wedding canopy'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/joel/2?lang=eng'
    quote: 'HEB wedding canopy.'
  - where: 'section 4 plain'
    claim: 'The Hebrew of verse 20 has “the northerner”; the seas are the eastern and the western'
    key: bdb
    url: 'https://biblehub.com/hebrew/6830.htm'
    quote: 'northern one, northerner, invader from north Joel 2:20'
  - where: 'section 5 plain'
    claim: '“Fats” are vats'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/joel/2?lang=eng'
    quote: 'OR vats.'
  - where: 'section 5 plain'
    claim: 'Verse 25: “I will repay you”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Joel%202&version=NRSVUE'
    quote: '25 I will repay you for the years'

  # ---- notes ----
  - where: 'note 2:2 “Dawn, or blackness”'
    claim: 'The Hebrew word in verse 2 is shachar (H7837)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Joel.xml'
    quote: 'כְּ/שַׁ֖חַר'
  - where: 'note 2:2 “Dawn, or blackness”'
    claim: 'The word means dawn; BDB lists Joel 2:2 there and records that others read “blackness,” parallel to cloud and thick darkness'
    key: bdb
    url: 'https://biblehub.com/hebrew/7837.htm'
    quote: 'Joel 2:2 (al. blackness,'
  - where: 'note 2:2 “Dawn, or blackness”'
    claim: 'BDB’s gloss is “dawn”'
    key: bdb
    url: 'https://biblehub.com/hebrew/7837.htm'
    quote: 'noun masculineGenesis 19:15 dawn'
  - where: 'note 2:2 “Dawn, or blackness”'
    claim: 'The NRSVUE reads blackness'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Joel%202&version=NRSVUE'
    quote: 'Like blackness spread upon the mountains'
  - where: 'note 2:2 “Dawn, or blackness”'
    claim: 'The Septuagint keeps the morning and makes the people the subject'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/joel/2.htm'
    quote: 'a numerous and strong people shall be spread upon the mountains as the morning'

  - where: 'note 2:2 “Locusts or soldiers”'
    claim: 'The heading reads the chapter as war and desolation before the Second Coming'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/joel/2?lang=eng'
    quote: 'War and desolation will precede the Second Coming'
  - where: 'note 2:2 “Locusts or soldiers”'
    claim: 'Exodus 10:14–15 says of Egypt’s locusts that there were none such before or after, and that the land was darkened'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/10?lang=eng'
    quote: 'before them there were no such locusts as they, neither after them shall be such'
  - where: 'note 2:2 “Locusts or soldiers”'
    claim: 'The locusts are read as a metaphor for an invading army'
    key: ot-minute-joel
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-joel'
    quote: 'a “nation” of locusts was a metaphor for an invading army overrunning the land'
  - where: 'note 2:2 “Locusts or soldiers”'
    claim: 'The Student Manual reads verses 2–11 as the battle of Armageddon and compares Revelation 9 and Ezekiel 38'
    key: ot-manual-7
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-7?lang=eng'
    quote: 'An event of the latter days known as the battle of Armageddon is described in these verses.'
  - where: 'note 2:2 “Locusts or soldiers”'
    claim: 'The manual’s comparison with John and Ezekiel'
    key: ot-manual-7
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-7?lang=eng'
    quote: 'Compare this language with that of John and Ezekiel when they describe the battle of Armageddon in Revelation 9:1–10 and Ezekiel 38:8–9.'
  - where: 'note 2:2 “Locusts or soldiers”'
    claim: 'Gog comes out of the north parts with a mighty army'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/38?lang=eng'
    quote: 'out of the north parts, thou, and many people with thee, all of them riding upon horses, a great company, and a mighty army'
  - where: 'note 2:2 “Locusts or soldiers”'
    claim: 'John’s locusts are shaped like horses prepared for battle'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/9?lang=eng'
    quote: 'the shapes of the locusts were like unto horses prepared unto battle'
  - where: 'note 2:2 “Locusts or soldiers”'
    claim: 'Scripture Helps: the prophecies followed a real drought and locust plague and tell of signs before the Second Coming'
    key: scripture-helps-hosea
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/45-hosea-1-6-10-14-joel?lang=eng'
    quote: 'were likely made after the land of Judah was afflicted with a severe drought and a plague of locusts. These prophecies tell of many signs preceding the Second Coming of Jesus Christ.'


  - where: 'note 2:8 “Weapons do not stop them”'
    claim: 'The word for “sword” in verse 8 is shelach (H7973)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Joel.xml'
    quote: 'הַ/שֶּׁ֛לַח'
  - where: 'note 2:8 “Weapons do not stop them”'
    claim: 'Shelach is a missile or weapon; Joel 2:8 is listed'
    key: bdb
    url: 'https://biblehub.com/hebrew/7973.htm'
    quote: 'noun [masculine] missile, weapon, sprout (late)'
  - where: 'note 2:8 “Weapons do not stop them”'
    claim: 'The verb (H1214) is “cut off, break off”'
    key: bdb
    url: 'https://biblehub.com/hebrew/1214.htm'
    quote: 'verb cut off, break off, gain by violence'
  - where: 'note 2:8 “Weapons do not stop them”'
    claim: 'In Joel 2:8 BDB takes the omitted object to be their course: they do not stop'
    key: bdb
    url: 'https://biblehub.com/hebrew/1214.htm'
    quote: 'object omitted their course, i.e. stop Joel 2:8'
  - where: 'note 2:8 “Weapons do not stop them”'
    claim: 'The NRSVUE rendering'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Joel%202&version=NRSVUE'
    quote: 'they burst through the weapons and are not halted'
  - where: 'note 2:8 “Weapons do not stop them”'
    claim: 'The Septuagint rendering'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/joel/2.htm'
    quote: 'they fall upon their weapons, yet shall they in no wise be destroyed'
  - where: 'note 2:8 “Weapons do not stop them”'
    claim: 'The Student Manual: the phrase may mean the weapons used against the invaders are ineffectual'
    key: ot-manual-7
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-7?lang=eng'
    quote: 'may simply be a way of saying that the armaments used against the invaders will be ineffectual'

  - where: 'note 2:12 “Yet even now”'
    claim: 'The NRSVUE has “Yet even now”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Joel%202&version=NRSVUE'
    quote: 'Yet even now, says the Lord,'
  - where: 'note 2:12 “Yet even now”'
    claim: 'Verses 12–13 answer the question of verse 11: no one can abide the day who does not turn to the Lord with all the heart'
    key: pike-great-dreadful-day
    url: 'https://byustudies.byu.edu/article/the-great-and-dreadful-day-of-the-lord-the-anatomy-of-an-expression'
    quote: 'the great and terrible day of the Lord, is that no one can who does not'
  - where: 'note 2:12 “Yet even now”'
    claim: '“Turn” in verse 12 is the verb shuv (H7725)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Joel.xml'
    quote: 'שֻׁ֥בוּ'
  - where: 'note 2:12 “Yet even now”'
    claim: '“Turn” in verse 13 is the same verb'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Joel.xml'
    quote: 'וְ/שׁ֖וּבוּ'
  - where: 'note 2:12 “Yet even now”'
    claim: '“Return” in verse 14, said of the Lord, is the same verb'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Joel.xml'
    quote: 'יָשׁ֣וּב'

  - where: 'note 2:13 “The Lord’s character, and what He repents of”'
    claim: 'The Lord’s proclamation of His name at Sinai'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/34?lang=eng'
    quote: 'The Lord, The Lord God, merciful and gracious, longsuffering, and abundant in goodness and truth'
  - where: 'note 2:13 “The Lord’s character, and what He repents of”'
    claim: 'Jonah 4:2 has the list in the same English form as Joel 2:13'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jonah/4?lang=eng'
    quote: 'for I knew that thou art a gracious God, and merciful, slow to anger, and of great kindness, and repentest thee of the evil'
  - where: 'note 2:13 “The Lord’s character, and what He repents of”'
    claim: 'The king of Nineveh’s question'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jonah/3?lang=eng'
    quote: 'Who can tell if God will turn and repent, and turn away from his fierce anger, that we perish not?'
  - where: 'note 2:13 “The Lord’s character, and what He repents of”'
    claim: 'The verb in verse 13 is nacham (H5162)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Joel.xml'
    quote: 'וְ/נִחָ֖ם'
  - where: 'note 2:13 “The Lord’s character, and what He repents of”'
    claim: 'Nacham: be sorry, rue, suffer grief, repent'
    key: bdb
    url: 'https://biblehub.com/hebrew/5162.htm'
    quote: 'be sorry, rue, suffer grief, repent, of one''s own doings'
  - where: 'note 2:13 “The Lord’s character, and what He repents of”'
    claim: 'BDB lists Joel 2:13 with Exodus 32:12, 14 and Jonah 3:10; 4:2 under repenting for ill done to others'
    key: bdb
    url: 'https://biblehub.com/hebrew/5162.htm'
    quote: 'for ill done to others Exodus 32:12,14 (J), Jeremiah 18:8; Joel 2:13; Jonah 3:10; Jonah 4:2'
  - where: 'note 2:13 “The Lord’s character, and what He repents of”'
    claim: 'The NRSVUE rendering'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Joel%202&version=NRSVUE'
    quote: 'and relenting from punishment'
  - where: 'note 2:13 “The Lord’s character, and what He repents of”'
    claim: 'The Joseph Smith Translation of verse 13 (the Church edition’s footnote 13b)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/joel/2?lang=eng'
    quote: 'and repent, and turn unto the Lord your God; for he is gracious and merciful, slow to anger, and of great kindness, and he will turn away the evil from you.'
  - where: 'note 2:13 “The Lord’s character, and what He repents of”'
    claim: 'The Joseph Smith Translation of verse 14 (footnote 14a)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/joel/2?lang=eng'
    quote: 'Therefore repent, and who knoweth but he will return and leave a blessing behind him'

  - where: 'note 2:14 “A blessing to give back”'
    claim: 'The offerings were cut off in chapter 1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/joel/1?lang=eng'
    quote: 'The meat offering and the drink offering is cut off from the house of the Lord'
  - where: 'note 2:14 “A blessing to give back”'
    claim: 'The “meat offering” is a grain offering'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Joel%202&version=NRSVUE'
    quote: 'a grain offering and a drink offering'
  - where: 'note 2:14 “A blessing to give back”'
    claim: 'The Joseph Smith Translation of verse 14 (footnote 14a)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/joel/2?lang=eng'
    quote: 'that you may offer a meat offering'

  - where: 'note 2:17 “Where the priests stand, and what they plead”'
    claim: 'The place is between the temple porch and the altar of burnt offering, in front of the door of the holy place'
    key: keil-joel
    url: 'https://biblehub.com/commentaries/kad/joel/2.htm'
    quote: 'between the porch of the temple and the altar of burnt-offering, i.e., immediately in front of the door of the holy place'
