    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Joel%202&version=NRSVUE'
    quote: 'a byword among the nations.'

  - where: 'note 2:18 “The Lord’s answer, past or future”'
    claim: 'The verb “be jealous” in verse 18 is a narrative past form (morphology code Vpw3ms)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Joel.xml'
    quote: 'וַ/יְקַנֵּ֥א'
  - where: 'note 2:18 “The Lord’s answer, past or future”'
    claim: 'The NRSVUE translates verse 18 as past'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Joel%202&version=NRSVUE'
    quote: '18 Then the Lord became jealous for his land and had pity on his people.'
  - where: 'note 2:18 “The Lord’s answer, past or future”'
    claim: 'The grammar requires the verbs of verses 18–19 to be statements of what occurred'
    key: keil-joel
    url: 'https://biblehub.com/commentaries/kad/joel/2.htm'
    quote: 'The grammar requires that we should take the imperfects with Vav consec. in these clauses, as statements of what actually occurred.'
  - where: 'note 2:18 “The Lord’s answer, past or future”'
    claim: 'Verses 18–19 are a historical statement that the Lord showed mercy in consequence of the priests’ prayer'
    key: keil-joel
    url: 'https://biblehub.com/commentaries/kad/joel/2.htm'
    quote: 'in consequence of the penitential prayer of the priests, the Lord displayed His mercy to His people'
  - where: 'note 2:18 “The Lord’s answer, past or future”'
    claim: 'The keeping of the fast is to be supplied between verses 17 and 18'
    key: keil-joel
    url: 'https://biblehub.com/commentaries/kad/joel/2.htm'
    quote: 'We have rather simply to supply the execution of the prophet''s command between Joel 2:17 and Joel 2:18.'
  - where: 'note 2:18 “The Lord’s answer, past or future”'
    claim: 'The same verb form is sometimes used in a prophetic announcement of the future'
    key: keil-joel
    url: 'https://biblehub.com/commentaries/kad/joel/2.htm'
    quote: 'are either really or apparently used in a prophetic announcement of the future'
  - where: 'note 2:18 “The Lord’s answer, past or future”'
    claim: 'The Septuagint has the past tense'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/joel/2.htm'
    quote: 'But the Lord was jealous of his land, and spared his people.'
  - where: 'note 2:18 “The Lord’s answer, past or future”'
    claim: 'The Church edition’s footnote on “jealous” gives “zealous”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/joel/2?lang=eng'
    quote: 'HEB zealous.'

  - where: 'note 2:20 “The northerner”'
    claim: 'The Hebrew of verse 20 has one word, “the northerner” (H6830), with no word for army'
