chapter: 1
claims:
  # ---- when / setting ----
  - where: 'when'
    claim: 'The date of Joel’s prophecy is uncertain: as early as Joash (before 850 B.C.) or as late as after the return from Babylon'
    key: bd-joel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/joel?lang=eng'
    quote: 'The date of his prophecy is uncertain; it may have been spoken as early as the reign of Joash, before 850 B.C., or even so late as after the Return.'
  - where: 'setting'
    claim: 'Joel was a prophet of Judah; the date may be as early as Joash or as late as after the Return'
    key: bd-joel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/joel?lang=eng'
    quote: 'A prophet of Judah. The date of his prophecy is uncertain; it may have been spoken as early as the reign of Joash, before 850 B.C., or even so late as after the Return.'
  - where: 'setting'
    claim: 'The occasion was drought and locusts'
    key: bd-joel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/joel?lang=eng'
    quote: 'The occasion of the prophecy was a severe visitation of drought and locusts.'
  - where: 'setting'
    claim: 'There are traces of Joel in Revelation'
    key: bd-joel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/joel?lang=eng'
    quote: 'There are also traces of Joel in Revelation.'
  - where: 'setting'
    claim: 'The Church’s newest help leaves the date open and says the prophecies tell of signs preceding the Second Coming'
    key: scripture-helps-hosea
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/45-hosea-1-6-10-14-joel?lang=eng'
    quote: 'It is unclear when his ministry took place. The book of Joel contains prophecies that were likely made after the land of Judah was afflicted with a severe drought and a plague of locusts. These prophecies tell of many signs preceding the Second Coming of Jesus Christ.'
  - where: 'setting'
    claim: 'The Guide to the Scriptures sums up chapter 1 as a call for a solemn assembly in the house of the Lord'
    key: gs-joel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/joel?lang=eng'
    quote: 'Chapter 1 is a call for a solemn assembly in the house of the Lord.'
  - where: 'setting'
    claim: 'Joel 1:15 and Isaiah 13:6 have the same line'
    key: bdb
    url: 'https://biblehub.com/hebrew/7706.htm'
    quote: 'Joel 1:15 = Isaiah 13:6'
  - where: 'setting'
    claim: 'Locusts with lions’ teeth appear in Revelation 9'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/9?lang=eng'
    quote: 'And they had hair as the hair of women, and their teeth were as the teeth of lions.'

  # ---- thread ----
  - where: 'thread'
    claim: '“Cut off” in verses 5, 9 and 16 is one Hebrew verb (karat, Strong’s 3772)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Joel.xml'
    quote: 'נִכְרַ֖ת'
  - where: 'thread'
    claim: 'The verb for drying or withering (yavesh, Strong’s 3001) stands in verses 10, 12, 17 and 20'
    key: bdb
    url: 'https://biblehub.com/hebrew/3001.htm'
    quote: 'be dried up: of water Genesis 8:7 (J), Isaiah 19:5; 1 Kings 17:7; Jeremiah 50:38; Joel 1:20'

  # ---- sections ----
  - where: 'section 1 plain'
    claim: '“Old men” is elders'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/joel/1?lang=eng'
    quote: 'HEB elders.'
  - where: 'section 2 plain'
    claim: '“Barked my fig tree” is literally made it a splintering'
    key: bdb
    url: 'https://biblehub.com/hebrew/7111.htm'
    quote: 'noun feminine a snapping or splintering'
  - where: 'section 3 plain'
    claim: '“Corn” is grain; “meat offering” is the grain offering'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/joel/1?lang=eng'
    quote: 'OR grain.'
  - where: 'section 3 plain'
    claim: 'Modern rendering: grain offering; the fig tree droops; the oil fails'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Joel%201&version=NRSVUE'
    quote: 'The grain offering and the drink offering are cut off'
  - where: 'section 5 plain'
    claim: '“Meat” in verse 16 is food; “garners” are storehouses'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/joel/1?lang=eng'
    quote: 'OR food.'
  - where: 'section 5 plain'
    claim: 'The seed has shrivelled (not rotted)'
    key: bdb
    url: 'https://biblehub.com/hebrew/5685.htm'
    quote: 'the grains have shrivelled'
  - where: 'section 5 plain'
    claim: 'The herds wander'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Joel%201&version=NRSVUE'
    quote: 'The herds of cattle wander about'
  - where: 'section 6 plain'
    claim: 'Wild animals; watercourses dried up'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Joel%201&version=NRSVUE'
    quote: 'Even the wild animals cry to you'

  # ---- note 1:2 ----
  - where: 'note 1:2 “A possible echo of the locust plague of Egypt”'
    claim: 'Joel 1:2–3 alludes to Exodus 10:2 and 10:6'
    key: keil-joel
    url: 'https://biblehub.com/commentaries/kad/joel/1.htm'
    quote: 'the question whether such a thing has occurred, and the charge, Tell it to your children, etc., there is an unmistakeable allusion to Exodus 10:2'
  - where: 'note 1:2 “A possible echo of the locust plague of Egypt”'
    claim: 'Joel thinks of the Egyptian judgments together with the punishment threatened in Deuteronomy 28:38–42'
    key: keil-joel
    url: 'https://biblehub.com/commentaries/kad/joel/1.htm'
    quote: 'the judgments through which Jehovah had effected the redemption of His people out of Egypt, in connection with the punishment with which Moses threatened the transgressors of the law (Deuteronomy 28:38-39, Deuteronomy 28:42)'

  # ---- note 1:4 ----
  - where: 'note 1:4 “Four words for the locust”'
    claim: 'gazam: locusts (collective); only Joel 1:4; 2:25; Amos 4:9'
    key: bdb
    url: 'https://biblehub.com/hebrew/1501.htm'
    quote: 'locusts (collective)'
  - where: 'note 1:4 “Four words for the locust”'
    claim: 'arbeh: a kind of locust; the word of Exodus 10 and Deuteronomy 28:38'
    key: bdb
    url: 'https://biblehub.com/hebrew/697.htm'
    quote: 'a kind of locust (usually interpreted as the multitudinous'
  - where: 'note 1:4 “Four words for the locust”'
    claim: 'arbeh is the locust of Exodus 10 and Deuteronomy 28:38'
    key: bdb
    url: 'https://biblehub.com/hebrew/697.htm'
    quote: 'as destructive Exodus 10:4,12,13,14 (twice in verse)'
  - where: 'note 1:4 “Four words for the locust”'
    claim: 'yeleq: a kind of locust'
    key: bdb
    url: 'https://biblehub.com/hebrew/3218.htm'
    quote: 'a kind of locust, absolute'
  - where: 'note 1:4 “Four words for the locust”'
    claim: 'chasil: a kind of locust'
    key: bdb
    url: 'https://biblehub.com/hebrew/2625.htm'
    quote: 'a kind of locust (singular collective)'
  - where: 'note 1:4 “Four words for the locust”'
    claim: 'Strong derives gazam from a root meaning to devour'
    key: strongs-concordance
    url: 'https://biblehub.com/hebrew/1501.htm'
    quote: 'From an unused root meaning to devour; a kind of locust -- palmer-worm.'
  - where: 'note 1:4 “Four words for the locust”'
    claim: 'Strong derives arbeh from a verb meaning to increase'
    key: strongs-concordance
    url: 'https://biblehub.com/hebrew/697.htm'
    quote: 'From rabah; a locust (from its rapid increase) -- grasshopper, locust.'
  - where: 'note 1:4 “Four words for the locust”'
    claim: 'Strong derives yeleq from a root meaning to lick up'
    key: strongs-concordance
    url: 'https://biblehub.com/hebrew/3218.htm'
    quote: 'From an unused root meaning to lick up; a devourer; specifically, the young locust -- cankerworm, caterpillar.'
  - where: 'note 1:4 “Four words for the locust”'
    claim: 'Strong derives chasil from a verb meaning to consume: the ravager'
    key: strongs-concordance
    url: 'https://biblehub.com/hebrew/2625.htm'
    quote: 'the ravager, i.e. A locust -- caterpillar.'
  - where: 'note 1:4 “Four words for the locust”'
    claim: 'The etymologies of the four words are generally unknown, so the English is approximate'
    key: parry-climactic
    url: 'https://rsc.byu.edu/sites/default/files/pub_content/pdf/2%20Climactic%20Expressions.pdf'
    quote: 'used for four kinds of locusts is generally unknown, although theories exist for each'
  - where: 'note 1:4 “Four words for the locust”'
    claim: 'The English translations are only approximate'
    key: parry-climactic
    url: 'https://rsc.byu.edu/sites/default/files/pub_content/pdf/2%20Climactic%20Expressions.pdf'
    quote: 'For this reason, the English translations are only approximate.'
  - where: 'note 1:4 “Four words for the locust”'
    claim: 'Joel 1:3–4 is a climactic form (ladder); four generations parallel four pests'
    key: parry-climactic
    url: 'https://rsc.byu.edu/sites/default/files/pub_content/pdf/2%20Climactic%20Expressions.pdf'
    quote: 'The four generations parallel the four varieties of pests in the second sequence'
  - where: 'note 1:4 “Four words for the locust”'
    claim: 'The form is called climax, Greek for ladder'
    key: parry-climactic
    url: 'https://rsc.byu.edu/sites/default/files/pub_content/pdf/2%20Climactic%20Expressions.pdf'
    quote: 'identified a significant figure of speech in the Bible that he labeled climax (Greek for ladder )'
  - where: 'note 1:4 “Four words for the locust”'
    claim: 'Joel 2:25 names the same four in another order'
    key: parry-climactic
    url: 'https://rsc.byu.edu/sites/default/files/pub_content/pdf/2%20Climactic%20Expressions.pdf'
    quote: 'But in Joel 2:25 God restores to his people all that was destroyed in Joel 1:4'
  - where: 'note 1:4 “Four words for the locust”'
    claim: 'NIV footnote: the precise meaning of the four words is uncertain'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Joel%201&version=NIV'
    quote: 'The precise meaning of the four Hebrew words used here for locusts is uncertain.'
  - where: 'note 1:4 “Four words for the locust”'
    claim: 'NRSVUE renders cutting, swarming, hopping, destroying locust'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Joel%201&version=NRSVUE'
    quote: 'What the cutting locust left,'
  - where: 'note 1:4 “Four words for the locust”'
    claim: 'The Church’s footnote allows varieties or stages of growth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/joel/1?lang=eng'
    quote: 'four varieties (or stages of growth) of locusts'
  - where: 'note 1:4 “Four words for the locust”'
    claim: 'The Student Manual takes the four as stages in the life of a locust'
    key: ot-manual-7
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-7?lang=eng'
    quote: 'These Hebrew terms refer to the stages of development in the life of a locust.'

  # ---- note 1:6 real plague ----
  - where: 'note 1:6 “A real plague, and what Joel saw through it”'
    claim: 'The Guide to the Scriptures: the prophecy was made after drought and locusts'
    key: gs-joel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/joel?lang=eng'
    quote: 'The book centers on a prophecy that Joel made after the land of Judah was smitten with a severe drought and with locusts'
  - where: 'note 1:6 “A real plague, and what Joel saw through it”'
    claim: 'Scripture Helps: “likely” after drought and locusts; signs preceding the Second Coming'
    key: scripture-helps-hosea
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/45-hosea-1-6-10-14-joel?lang=eng'
    quote: 'prophecies that were likely made after the land of Judah was afflicted with a severe drought and a plague of locusts. These prophecies tell of many signs preceding the Second Coming of Jesus Christ.'
  - where: 'note 1:6 “A real plague, and what Joel saw through it”'
    claim: 'Locust plagues in Palestine in 1845, 1892, 1899, 1904'
    key: sperry-moroni-expounds
    url: 'https://scripturecentral.org/archive/periodicals/journal-article/moroni-expounds-old-testament-scriptures'
    quote: 'Other plagues are known to have overtaken portions of Palestine also in the years 1845, 1892, 1899, and 1904.'
  - where: 'note 1:6 “A real plague, and what Joel saw through it”'
    claim: 'A locust plague at Jerusalem in 1915'
    key: sperry-moroni-expounds
    url: 'https://scripturecentral.org/archive/periodicals/journal-article/moroni-expounds-old-testament-scriptures'
    quote: 'gives a very vivid description of Jerusalem’s locust plague of that year'
  - where: 'note 1:6 “A real plague, and what Joel saw through it”'
    claim: 'The Church’s footnote on verse 4: invading or conquering armies are compared to locusts'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/joel/1?lang=eng'
    quote: 'IE The invading or conquering armies are compared to four varieties (or stages of growth) of locusts.'
  - where: 'note 1:6 “A real plague, and what Joel saw through it”'
    claim: 'Old Testament Minute: the locusts are a metaphor for a future invasion'
    key: ot-minute-joel
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-joel'
    quote: 'Using the metaphor of four stages of locusts destroying the land, Joel prophesied of a future invasion by conquering armies.'
  - where: 'note 1:6 “A real plague, and what Joel saw through it”'
    claim: 'Sperry: most of the book refers to the latter days'
    key: sperry-moroni-expounds
    url: 'https://scripturecentral.org/archive/periodicals/journal-article/moroni-expounds-old-testament-scriptures'
    quote: 'most of the book of Joel has reference to the latter days and has little or nothing to do with events of Joel’s own day'
  - where: 'note 1:6 “A real plague, and what Joel saw through it”'
    claim: 'Sperry: the locusts are idioms of Joel’s own day; a prophet speaks of the future in terms of his own time'
    key: sperry-moroni-expounds
    url: 'https://scripturecentral.org/archive/periodicals/journal-article/moroni-expounds-old-testament-scriptures'
    quote: 'one ought to find in his prophecy idioms and allusions peculiar to his own day, even when he was referring to the future'
  - where: 'note 1:6 “A real plague, and what Joel saw through it”'
    claim: 'Sperry: a prophet speaks in terms of his own day to describe the future'
    key: sperry-moroni-expounds
    url: 'https://scripturecentral.org/archive/periodicals/journal-article/moroni-expounds-old-testament-scriptures'
    quote: 'a prophet almost always speaks in terms of events and customs of his own day to describe events that belong to the future'
  - where: 'note 1:6 “A real plague, and what Joel saw through it”'
    claim: 'Sperry: Joel 1 represents general destruction before the day of the Lord'
    key: sperry-moroni-expounds
    url: 'https://scripturecentral.org/archive/periodicals/journal-article/moroni-expounds-old-testament-scriptures'
    quote: 'The locust plague and other events mentioned in Joel 1 represent general destruction and mourning on the earth prior to “the day of the Lord” mentioned in Joel 1:15.'
  - where: 'note 1:6 “A real plague, and what Joel saw through it”'
    claim: 'Sperry argues from Moroni: Joel 1:15 must refer to the same event as Joel 2:31, which Moroni said had not yet come'
    key: sperry-moroni-expounds
    url: 'https://scripturecentral.org/archive/periodicals/journal-article/moroni-expounds-old-testament-scriptures'
    quote: 'This expression must refer to the same event as “the terrible day of the Lord” mentioned in Joel 2:31, as quoted to Joseph Smith by Moroni.'
  - where: 'note 1:6 “A real plague, and what Joel saw through it”'
    claim: 'Kent P. Jackson, as the KnoWhy quotes him: every word in the book refers to the latter days'
    key: sc-knowhy-651
    url: 'https://scripturecentral.org/knowhy/why-did-moroni-quote-from-the-book-of-joel'
    quote: 'This led Jackson to conclude that “every word in the book refers to the latter days—from the time of the Prophet Joseph Smith into the Millennium.”'

  # ---- note 1:6 teeth ----
  - where: 'note 1:6 “Insects described as an army”'
    claim: 'The locusts are pictured as a warlike people'
    key: keil-joel
    url: 'https://biblehub.com/commentaries/kad/joel/1.htm'
    quote: 'the locusts are represented as a warlike people, because they devastate the land like a hostile army'
  - where: 'note 1:6 “Insects described as an army”'
    claim: 'Proverbs 30:25–27 speaks of ants and locusts as a people'
    key: keil-joel
    url: 'https://biblehub.com/commentaries/kad/joel/1.htm'
    quote: 'In Proverbs 30:25-26, not only are the ants described as a people'
  - where: 'note 1:6 “Insects described as an army”'
    claim: 'The Hebrew of “barked” is a noun, a snapping or splintering'
    key: bdb
    url: 'https://biblehub.com/hebrew/7111.htm'
    quote: 'noun feminine a snapping or splintering'
  - where: 'note 1:6 “Insects described as an army”'
    claim: 'Locusts nibble the bark of trees, so the injury lasts beyond one year (Ludolf, quoted by Keil)'
    key: keil-joel
    url: 'https://biblehub.com/commentaries/kad/joel/1.htm'
    quote: 'Even the bark of trees is nibbled with their teeth, so that the injury is not confined to one year alone.'
  - where: 'note 1:6 “Insects described as an army”'
    claim: '“My land” is the prophet’s, speaking for the people, on Keil’s reading'
    key: keil-joel
    url: 'https://biblehub.com/commentaries/kad/joel/1.htm'
    quote: 'does not refer to Jehovah, but to the prophet, who speaks in the name of the people, so that it is the land of the people of God'

  # ---- note 1:8 ----
  - where: 'note 1:8 “A young woman in sackcloth”'
    claim: 'The imperative “Lament” is feminine singular (morphology Vqv2fs)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Joel.xml'
    quote: 'אֱלִ֕י'
  - where: 'note 1:8 “A young woman in sackcloth”'
    claim: 'bethulah: a virgin living in her father’s house'
    key: bdb
    url: 'https://biblehub.com/hebrew/1330.htm'
    quote: 'house as a virgin Genesis 24:16'
  - where: 'note 1:8 “A young woman in sackcloth”'
    claim: 'The word is used in the personification of nations'
    key: bdb
    url: 'https://biblehub.com/hebrew/1330.htm'
    quote: 'personification of nations'
  - where: 'note 1:8 “A young woman in sackcloth”'
    claim: 'NIV: the betrothed of her youth'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Joel%201&version=NIV'
    quote: 'grieving for the betrothed of her youth.'

  # ---- note 1:9 ----
  - where: 'note 1:9 “Why the stopped offering is the worst loss”'
    claim: 'The meat offering: “meat” is food; chiefly grain; no burnt or peace offering complete without it'
    key: bd-meat-offering
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/meat-offering?lang=eng'
    quote: 'The Minchah consisted chiefly of grain (or flour and cakes made from grain) and wine, seasoned with salt, and offered with incense. The Minchah could not be offered with a sin offering, but no burnt or peace offering was complete without it.'
  - where: 'note 1:9 “Why the stopped offering is the worst loss”'
    claim: '“Meat” has the older sense of food'
    key: bd-meat-offering
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/meat-offering?lang=eng'
    quote: 'The English word meat in this context is used in the older sense of “food.”'
  - where: 'note 1:9 “Why the stopped offering is the worst loss”'
    claim: 'Part went on the altar; the priests ate the rest; it was part of the daily burnt offering'
    key: bd-meat-offering
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/meat-offering?lang=eng'
    quote: 'Part was placed on the altar of burnt offering; the remainder was usually eaten by the priests in a holy place'
  - where: 'note 1:9 “Why the stopped offering is the worst loss”'
    claim: 'It was an important part of the daily (morning and evening) sacrifice'
    key: bd-meat-offering
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/meat-offering?lang=eng'
    quote: 'It was such an important part of the daily burnt offering that the term is sometimes used to denote the whole morning or evening sacrifice'
  - where: 'note 1:9 “Why the stopped offering is the worst loss”'
    claim: 'The phrase refers chiefly to the daily morning and evening sacrifice; the verse says further offering is impossible'
    key: keil-joel
    url: 'https://biblehub.com/commentaries/kad/joel/1.htm'
    quote: 'has already ceased; but simply that any further offering is rendered impossible by the failure of meal, wine, and oil'
  - where: 'note 1:9 “Why the stopped offering is the worst loss”'
    claim: 'Stopping the daily sacrifice was the greatest calamity: a practical suspension of the covenant relation'
    key: keil-joel
    url: 'https://biblehub.com/commentaries/kad/joel/1.htm'
    quote: 'Now Israel could not suffer any greater calamity than the suspension of the daily sacrifice; for this was a practical suspension of the covenant relation'

  # ---- note 1:11 ----
  - where: 'note 1:11 “Dried up and ashamed in one word”'
    claim: 'The imperative of 1:11 must be from the verb “be ashamed,” to which all the forms in Joel may be assigned'
    key: bdb
    url: 'https://biblehub.com/hebrew/3001.htm'
    quote: 'must be from'
  - where: 'note 1:11 “Dried up and ashamed in one word”'
    claim: 'All the cases in Joel may be consistently assigned to the verb for shame'
    key: bdb
    url: 'https://biblehub.com/hebrew/3001.htm'
    quote: 'to which all these cases in Joel may be consistently assigned'
  - where: 'note 1:11 “Dried up and ashamed in one word”'
    claim: 'The ancient versions and some moderns derived all the forms in Joel from the verb “be dry”'
    key: bdb
    url: 'https://biblehub.com/hebrew/954.htm'
    quote: 'by ancient versions and some moderns'
  - where: 'note 1:11 “Dried up and ashamed in one word”'
    claim: 'The verb for drying recurs at 1:17 and 1:20'
    key: bdb
    url: 'https://biblehub.com/hebrew/3001.htm'
    quote: 'In like manner might be taken Joel 1:10,12 (twice in verse); Joel 1:17'

  # ---- note 1:14 ----
  - where: 'note 1:14 “A fast and a solemn assembly, in Judah and in Kirtland”'
    claim: 'atsarah: a sacred assembly; of feast days in the law; “occasional” in Joel 1:14 and 2:15'
    key: bdb
    url: 'https://biblehub.com/hebrew/6116.htm'
    quote: 'sacred assembly'
  - where: 'note 1:14 “A fast and a solemn assembly, in Judah and in Kirtland”'
    claim: 'Joel’s two uses are the occasional ones'
    key: bdb
    url: 'https://biblehub.com/hebrew/6116.htm'
    quote: 'occasional, Joel 1:14; Joel 2:15'
  - where: 'note 1:14 “A fast and a solemn assembly, in Judah and in Kirtland”'
    claim: 'The Day of Atonement is the only fast the law commands'
    key: bd-fasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/fasts?lang=eng'
    quote: 'The Day of Atonement appears to be the only fast ordered by the law.'
  - where: 'note 1:14 “A fast and a solemn assembly, in Judah and in Kirtland”'
    claim: 'Joel’s counsel summed up as “turn to me” and “gather to the temple and pray”'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'His counsel could be summarized in two phrases: “turn to me” and “gather to the temple and pray.”'
  - where: 'note 1:14 “A fast and a solemn assembly, in Judah and in Kirtland”'
    claim: 'D&C 95:7: the solemn assembly, with fasting and mourning, commanded in connection with the Lord’s house at Kirtland'
    key: lds-scriptures
