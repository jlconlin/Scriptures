chapter: 7
claims:
  - where: setting
    claim: 'One older reading calls the sayings of the chapter proverbs of that which is better'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/7.htm'
    quote: 'A fourth proverb of that which is better (מן טוב) presents, like the third, the fools and the wise over against each other'
  - where: setting
    claim: 'The Student Manual gives the theme of 7:13–29 as resignation to the will of God'
    key: ot-manual-proverbs
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-2?lang=eng'
    quote: 'The theme here is resignation to the will of God.'

  - where: 'section 2 plain'
    claim: 'The “gift” of 7:7 is a bribe, and “mad” can be read “foolish”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes%207&version=NRSVUE'
    quote: 'Surely oppression makes the wise foolish, and a bribe corrupts the heart.'

  - where: 'note 7:2 “The house of mourning”'
    claim: 'The house of mourning is a house where someone has died; mourning lasted seven days'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/7.htm'
    quote: 'A house is meant in which there is sorrow on account of a death; the lamentation continued for seven days'
  - where: 'note 7:2 “The house of mourning”'
    claim: 'The going is a visit to show sympathy and comfort the mourners, as in John 11:31'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/7.htm'
    quote: 'The going into the house of mourning is certainly thought of as a visit for the purpose of showing sympathy and of imparting consolation during the first seven days of mourning (John 11:31).'
  - where: 'note 7:2 “The house of mourning”'
    claim: 'The living take to heart that they too must die'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/7.htm'
    quote: 'the survivor takes it to heart, viz., this, that he too must die'
  - where: 'note 7:2 “The house of mourning”'
    claim: 'The saying is still more in the spirit of the New Testament (Luke 6:25)'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/7.htm'
    quote: 'Still more in the spirit of the N.T. (cf. e.g., Luke 6:25) are these words of this singular book which stands on the border of both Testaments'
  - where: 'note 7:2 “The house of mourning”'
    claim: 'How the saying agrees with 2:24 perplexed the Talmudists'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/7.htm'
    quote: 'How this saying agrees with Koheleth''s ultimatum: There is nothing better than to eat and drink, etc. (Ecclesiastes 2:24, etc.), the Talmudists have been utterly perplexed to discover'
  - where: 'note 7:2 “The house of mourning”'
    claim: 'Modern translations read 7:3 “the heart is made glad”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes%207&version=NRSVUE'
    quote: 'Sorrow is better than laughter, for by sadness of countenance the heart is made glad.'
  - where: 'note 7:2 “The house of mourning”'
    claim: 'Modern translations read 7:3 “the heart is made glad”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes%207&version=ESV'
    quote: 'Sorrow is better than laughter, for by sadness of face the heart is made glad.'

  - where: 'note 7:6 “Thorns under a pot”'
    claim: 'Sir is a noun meaning “pot,” and Eccl. 7:6 is among its uses'
    key: bdb
    url: 'https://biblehub.com/hebrew/5518.htm'
    quote: 'in simile Micah 3:3; Job 41:23; Ecclesiastes 7:6.'
  - where: 'note 7:6 “Thorns under a pot”'
    claim: 'A second noun sir means “thorn”; at 7:6 it is the sound of thorns crackling as they burn under the pot'
    key: bdb
    url: 'https://biblehub.com/hebrew/5518.htm'
    quote: 'Ecclesiastes 7:6 as the sound of thorns (crackling as they burn) under the pot.'

  - where: 'note 7:7 “A gift that blinds”'
    claim: 'Modern translations render the “gift” as a bribe, and “mad” as foolish'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes%207&version=NRSVUE'
    quote: 'Surely oppression makes the wise foolish, and a bribe corrupts the heart.'
  - where: 'note 7:7 “A gift that blinds”'
    claim: 'Modern translations render the “gift” as a bribe'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes%207&version=NIV'
    quote: 'Extortion turns a wise person into a fool, and a bribe corrupts the heart.'
  - where: 'note 7:7 “A gift that blinds”'
    claim: 'A modern translation’s cross references set Deut. 16:19 beside 7:7'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes%207&version=ESV'
    quote: 'Ecclesiastes 7:7 : Deut. 16:19; See Prov. 17:8'
  - where: 'note 7:7 “A gift that blinds”'
    claim: 'The Church’s footnote gives “a fool” for “mad”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/eccl/7?lang=eng'
    quote: '“mad”: OR a fool (foolish).'

  - where: 'note 7:12 “Wisdom that gives life”'
    claim: 'Modern translations: wisdom preserves the life of the one who has it'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes%207&version=ESV'
    quote: 'the advantage of knowledge is that wisdom preserves the life of him who has it'
  - where: 'note 7:12 “Wisdom that gives life”'
    claim: '“Excellency” in 7:12 is yitron (3504), “advantage”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/ecclesiastes/7-12.htm'
    quote: '3504 [e] wə·yiṯ·rō·wn וְיִתְר֣וֹן and the advantage'
  - where: 'note 7:12 “Wisdom that gives life”'
    claim: '“Profit” in 1:3 is the same word, yitron (3504)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/ecclesiastes/1-3.htm'
    quote: '3504 [e] yiṯ·rō·wn יִּתְר֖וֹן profit [is]'
  - where: 'note 7:12 “Wisdom that gives life”'
    claim: 'The Student Manual: the Preacher here comes close to the truth of D&C 130:17–19'
    key: ot-manual-proverbs
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-2?lang=eng'
    quote: 'In this verse the Preacher comes close to the truth expressed in Doctrine and Covenants 130:17–19.'
  - where: 'note 7:12 “Wisdom that gives life”'
    claim: 'D&C 130:18: intelligence attained in this life rises in the resurrection'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/130?lang=eng'
    quote: 'Whatever principle of intelligence we attain unto in this life, it will rise with us in the resurrection.'

  - where: 'note 7:14 “Good days and bad, from God”'
    claim: 'Verses 13–14 are a proverb of devout submission to God’s providence'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/7.htm'
    quote: 'There now follows a proverb of devout submission to the providence of God'
  - where: 'note 7:14 “Good days and bad, from God”'
    claim: 'The older reading sets Job 2:10 beside “God hath made the one … the other”'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/7.htm'
    quote: 'But: in the day of misfortune observe, i.e., perceive and reflect: God has also made (cf. Job 2:10) the latter'
  - where: 'note 7:14 “Good days and bad, from God”'
    claim: 'Modern translations read the last clause of the future'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes%207&version=NIV'
    quote: 'Therefore, no one can discover anything about their future.'
  - where: 'note 7:14 “Good days and bad, from God”'
    claim: 'Modern translations read the last clause of what comes after'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes%207&version=NRSVUE'
    quote: 'God has made the one as well as the other, so that mortals may not find out anything that comes after them.'
  - where: 'note 7:14 “Good days and bad, from God”'
    claim: 'The older reading: “after him” means after this life'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/7.htm'
    quote: 'But aharav is never (not at Ecclesiastes 6:12) equals in the future, lying out from the present of a man; but always equals after his present life.'
  - where: 'note 7:14 “Good days and bad, from God”'
    claim: 'The older reading: man passes through the whole school of life with nothing left unexperienced'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/7.htm'
    quote: 'God causes man to experience good and evil that he may pass through the whole school of life, and when he departs hence that nothing may be outstanding (in arrears) which he has not experienced.'

  - where: 'note 7:15 “The just man that perisheth”'
    claim: 'Righteousness is sometimes not rewarded in this life; do the right thing anyway'
    key: sc-knowhy-868
    url: 'https://scripturecentral.org/knowhy/why-does-ecclesiastes-talk-so-much-about-vanity'
    quote: 'Sometimes righteousness is not rewarded in this life. … A summation of Ecclesiastes'' message could be that doing the right thing does not always work out the way one might hope, but we ought to do the right thing anyway.'
  - where: 'note 7:15 “The just man that perisheth”'
    claim: 'God will balance things at the final judgment'
    key: sc-knowhy-868
    url: 'https://scripturecentral.org/knowhy/why-does-ecclesiastes-talk-so-much-about-vanity'
    quote: 'God will balance things accordingly at final judgement, whether things work out in this life or not.'
  - where: 'note 7:15 “The just man that perisheth”'
    claim: 'The book may be, like Job, a balancing corrective to the assurance that God visibly prospers the righteous in mortality'
    key: barlow-public-relations
    url: 'http://mi.byu.edu/old-testament-reflections/ecclesiastes-has-a-public-relations-problem'
    quote: 'serve as a balancing corrective to the widely held assurance, in both ancient and modern times, that God will dependably prosper the righteous and punish the wicked in visible, material ways in mortality?'
  - where: 'note 7:15 “The just man that perisheth”'
    claim: 'Barlow sets Matt. 5:45 beside the book'
    key: barlow-public-relations
    url: 'http://mi.byu.edu/old-testament-reflections/ecclesiastes-has-a-public-relations-problem'
    quote: 'Against this thought, and like Ecclesiastes, Jesus noticed that God “maketh his sun to rise on the evil and on the good [alike], and sendeth rain on the just and on the unjust” (Matthew 5:45).'

  - where: 'note 7:16 “Righteous over much”'
    claim: 'Modern translations: “too righteous”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes%207&version=NRSVUE'
    quote: 'Do not be too righteous, and do not act too wise; why should you destroy yourself?'
  - where: 'note 7:16 “Righteous over much”'
    claim: 'Modern translations: “overrighteous”'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes%207&version=NIV'
    quote: 'Do not be overrighteous, neither be overwise— why destroy yourself?'
  - where: 'note 7:16 “Righteous over much”'
    claim: 'A modern translation of 7:18: “will avoid all extremes”'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes%207&version=NIV'
    quote: 'Whoever fears God will avoid all extremes.'
  - where: 'note 7:16 “Righteous over much”'
    claim: 'Righteousness and wisdom are worth striving for, but carried past measure they destroy a man'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/7.htm'
    quote: 'righteousness and wisdom are good and wholesome, and worth striving for; but even in these a transgressing of the right measure is possible'
  - where: 'note 7:16 “Righteous over much”'
    claim: 'A man becomes a caricature and perishes, or is removed by those he provokes'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/7.htm'
    quote: 'because he thereby becomes a caricature, and either perishes rushing from one extreme into another, or is removed out of the way by others whose hatred he provokes'
  - where: 'note 7:16 “Righteous over much”'
    claim: 'The verse cannot counsel a measure of sin; sinning carries its own condemnation'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/7.htm'
    quote: 'in this form the good counsel at once appears as impossible, for it would be immoral, since "sinning," in all circumstances, is an act which carries in itself its own sentence of condemnation'
  - where: 'note 7:16 “Righteous over much”'
    claim: 'The counsel is not to be a narrow rigorist, yet not to loose the reins'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/7.htm'
    quote: 'He means to say: be not a narrow rigorist, - enjoy life, accommodate thyself to life; but let not the reins be too loose'
  - where: 'note 7:16 “Righteous over much”'
    claim: 'He who fears God acquits himself of both'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/7.htm'
    quote: 'he who fears God will set himself free from all, will acquit himself of the one as well as of the other, will perform both, and thus preserve the golden via media'

  - where: 'note 7:16 “Righteous over much”'
    claim: 'A modern translation of 7:18: “shall succeed with both”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes%207&version=NRSVUE'
    quote: 'for the one who fears God shall succeed with both.'

  - where: 'note 7:26 “Snares, nets and bands”'
    claim: 'The Church’s footnote points “bitter” in 7:26 to Prov. 5:4'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/eccl/7?lang=eng'
    quote: '“bitter”: Prov. 5:4.'
  - where: 'note 7:26 “Snares, nets and bands”'
    claim: 'The Church’s footnote points “taken” in 7:26 to Prov. 2:19'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/eccl/7?lang=eng'
    quote: '“taken”: Prov. 2:19.'
  - where: 'note 7:26 “Snares, nets and bands”'
    claim: 'Modern translation: “the woman who is a trap”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes%207&version=NRSVUE'
    quote: 'I found more bitter than death the woman who is a trap, whose heart is nets, whose hands are fetters'
  - where: 'note 7:26 “Snares, nets and bands”'
    claim: 'Modern translation of 7:29: “human beings”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes%207&version=NRSVUE'
    quote: 'See, this alone I found, that God made human beings straightforward, but they have devised many schemes.'
  - where: 'note 7:26 “Snares, nets and bands”'
    claim: 'Modern translation: “the woman who is a snare”'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes%207&version=NIV'
    quote: 'the woman who is a snare,'
  - where: 'note 7:26 “Snares, nets and bands”'
    claim: 'A modern translation supplies “upright” in 7:28'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes%207&version=NIV'
    quote: 'I found one upright man among a thousand, but not one upright woman'

  - where: explore
    claim: 'Abinadi’s words in Mosiah 12:27 echo the wisdom passages on applying the heart, Ps. 90:12 and Eccl. 7:25 among them'
    key: sc-knowhy-644
    url: 'https://scripturecentral.org/knowhy/what-does-it-mean-to-apply-your-heart-to-understanding'
    quote: 'Abinadi’s words echo several passages in ancient Israel’s wisdom literature that speak of the heart being “applied” in order to gain wisdom, knowledge, or understanding.'
