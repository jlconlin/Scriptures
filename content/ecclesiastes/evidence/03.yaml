chapter: 3
claims:
  # setting
  - where: 'setting'
    claim: 'Scripture Helps describes chapters 3–10 as examples that worldly wealth does not last and frustration is unavoidable'
    key: scripture-helps-proverbs
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/35-proverbs-1-4-15-16-22-31-ecclesiastes-1-3-11-12?lang=eng'
    quote: 'Ecclesiastes 3–10: The Preacher explains through many examples that worldly wealth does not last, and frustration in this life is unavoidable.'
  - where: 'setting'
    claim: 'The seminary guide summarizes chapter 3: good and bad come to all; man’s works pass, God’s are eternal'
    key: seminary-intro-eccl
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-study-guide-for-home-study-seminary-students-2015/introduction-to-ecclesiastes?lang=eng'
    quote: 'Ecclesiastes 3. The preacher explains that good and bad things happen to everyone. The works of man do not last. The works of God, however, are eternal.'
  - where: 'setting'
    claim: 'Verses 1–11 are among the most often quoted in Ecclesiastes'
    key: ot-manual-proverbs
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-2?lang=eng'
    quote: 'These verses are among those most often quoted from Ecclesiastes.'

  # thread
  - where: 'note 3:1 “Times that God appoints”'
    claim: 'The Hebrew word for “season” is zeman'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Eccl.xml'
    quote: 'זְמָ֑ן'
  - where: 'note 3:1 “Times that God appoints”'
    claim: 'BDB: zeman is a late noun meaning appointed time, used at Eccl. 3:1'
    key: bdb
    url: 'https://biblehub.com/hebrew/2165.htm'
    quote: 'זְמָ֑ן noun masculine (late) appointed time, time … singular זְמָ֑ן Nehemiah 2:6; Ecclesiastes 3:1'
  - where: 'note 3:1 “Times that God appoints”'
    claim: 'Ecclesiastes indicates God is in control in 3:9–18, though His ways are inscrutable'
    key: pike-spirit-eccl
    url: 'https://rsc.byu.edu/let-us-reason-together/spirit-returns-god-ecclesiastes-127'
    quote: 'So, while Ecclesiastes does indicate that God is in control (for example, 3:9–18; 7:13–14), the inscrutability of God and his ways in this difficult world is repeatedly underscored.'

  # note 3:5
  - where: 'note 3:5 “Casting and gathering stones”'
    claim: 'One older reading: stones thrown on a field ruin it (2 Kgs. 3:19, 25); gathered and removed, the field is cultivated'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/3.htm'
    quote: 'by the throwing of stones a field is destroyed, 2 Kings 3:25, or as expressed at 2 Kings 3:19 is marred; and by gathering the stones together and removing them (which is called סקּל), it is brought under cultivation.'
  - where: 'note 3:5 “Casting and gathering stones”'
    claim: 'The same reading sets embracing beside the hostile throwing of stones'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/3.htm'
    quote: 'the loving action of embracing stands beside the hostile, purposely injurious throwing of stones into a field'
  - where: 'note 3:5 “Casting and gathering stones”'
    claim: 'Israel’s armies marred Moab’s land with stones'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/3?lang=eng'
    quote: 'and on every good piece of land cast every man his stone, and filled it'

  # note 3:11
  - where: 'note 3:11 “Eternity in their heart”'
    claim: 'The Hebrew word rendered “the world” is ha’olam'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Eccl.xml'
    quote: 'הָ/עֹלָם֙'
  - where: 'note 3:11 “Eternity in their heart”'
    claim: 'BDB: ’olam means long duration, antiquity, futurity'
    key: bdb
    url: 'https://biblehub.com/hebrew/5769.htm'
    quote: 'עוֺלָם439 noun masculine long duration, antiquity, futurity'
  - where: 'note 3:11 “Eternity in their heart”'
    claim: 'BDB places Eccl. 3:11 under “age (duration) of the world”'
    key: bdb
    url: 'https://biblehub.com/hebrew/5769.htm'
    quote: 'k. = age (duration) of the world: את העלם נתן בְּלִבָּם Ecclesiastes 3:11 the age of the world he hath set'
  - where: 'note 3:11 “Eternity in their heart”'
    claim: 'BDB lists Eccl. 3:14 “for ever” under ’olam, of divine existence'
    key: bdb
    url: 'https://biblehub.com/hebrew/5769.htm'
    quote: '׳כל אשׁר יעשׂה האלהים יהיה לע Ecclesiastes 3:14.'
  - where: 'note 3:11 “Eternity in their heart”'
    claim: '“For ever” in 3:14 is le’olam, the same word'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Eccl.xml'
    quote: 'לְ/עוֹלָ֔ם'
  - where: 'note 3:11 “Eternity in their heart”'
    claim: 'NIV: “set eternity in the human heart”'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+3&version=NIV'
    quote: 'He has also set eternity in the human heart; yet no one can fathom … what God has done from beginning to end.'
  - where: 'note 3:11 “Eternity in their heart”'
    claim: 'ESV: “put eternity into man’s heart”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+3&version=ESV'
    quote: 'Also, he has put eternity into man''s heart, yet so that he cannot … find out what God has done from the beginning to the end.'
  - where: 'note 3:11 “Eternity in their heart”'
    claim: 'NRSVue: “a sense of past and future into their minds”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+3&version=NRSVUE'
    quote: 'moreover, he has put a sense of past and future into their minds, yet they cannot find out what God has done from the beginning to the end.'
  - where: 'note 3:11 “Eternity in their heart”'
    claim: 'The Septuagint reads “the whole world”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/ecclesiastes/3.htm'
    quote: 'he has also set the whole world in their heart, that man might not find out the work which God has wrought from the beginning even to the end.'
  - where: 'note 3:11 “Eternity in their heart”'
    claim: 'One Latter-day Saint reading hears a lament: a sense of the eternal implanted, but man left yearning'
    key: barlow-public-relations
    url: 'http://mi.byu.edu/old-testament-reflections/ecclesiastes-has-a-public-relations-problem'
    quote: 'which seems to mourn that God has implanted a sense of the eternal and the divine inside human consciousness, but left us yearning, orphaned, and ignorant.'
  - where: 'note 3:11 “Eternity in their heart”'
    claim: 'Another: the natural man cannot comprehend all God’s works in mortality'
    key: ot-minute-ecclesiastes
    url: 'https://scripturecentral.org/archive/books/book-chapter/ecclesiastes-13-1112'
    quote: 'the natural man will not be able to comprehend all God’s works while in this mortal life.'

  # note 3:15
  - where: 'note 3:15 “God seeks what has gone by”'
    claim: 'The Hebrew word is nirdaf, a participle of radaph'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Eccl.xml'
    quote: 'נִרְדָּֽף'
  - where: 'note 3:15 “God seeks what has gone by”'
    claim: 'BDB: “God seeketh the pursued (i.e. what has disappeared, is past, but dubious)”'
    key: bdb
    url: 'https://biblehub.com/hebrew/7291.htm'
    quote: 'Ecclesiastes 3:15 God seeketh the pursued (i.e. what has disappeared, is past, but dubious).'
  - where: 'note 3:15 “God seeks what has gone by”'
    claim: 'NRSVue: “God seeks out what has gone by”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+3&version=NRSVUE'
    quote: 'That which is already has been, that which is to be already is, and God seeks out what has gone by.'
  - where: 'note 3:17 “God shall judge”'
    claim: 'After the injustice of 3:16, the Preacher finds consolation in God’s eventual judgment (3:17)'
    key: pike-spirit-eccl
    url: 'https://rsc.byu.edu/let-us-reason-together/spirit-returns-god-ecclesiastes-127'
    quote: 'After observing the lack of justice in mortal life (3:16) but finding some consolation in God’s eventual just judgment (3:17), the Teacher turns to the resolute nature of death (3:18).'
  - where: 'note 3:17 “God shall judge”'
    claim: 'The Bible Dictionary: lasting value is obedience, since all things will be examined in God’s judgment'
    key: bd-ecclesiastes
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ecclesiastes?lang=eng'
    quote: 'the only activity of lasting and permanent value comes from obedience to God’s commandments, since all things will be examined in the judgment that God will render on man.'
  - where: 'note 3:17 “God shall judge”'
    claim: 'The book returns to judgment at 11:9 and 12:14'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/eccl/12?lang=eng'
    quote: 'For God shall bring every work into judgment, with every secret thing, whether it be good, or whether it be evil.'

  # note 3:19
  - where: 'note 3:19 “One breath for man and beast”'
    claim: 'BDB: barar at 3:18 means test, prove: “that God may prove them”'
    key: bdb
    url: 'https://biblehub.com/hebrew/1305.htm'
    quote: '4 test, prove Ecclesiastes 3:18 לְבָרָם הָאֱלֹהִים that God may prove them (RV)'
  - where: 'note 3:19 “One breath for man and beast”'
    claim: 'NRSVue 3:18: “God is testing them to show that they are but animals”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+3&version=NRSVUE'
    quote: 'I said to myself with regard to humans that God is testing them to show that they are but animals.'
  - where: 'note 3:19 “One breath for man and beast”'
    claim: 'The Hebrew word for “breath” in 3:19 is ruach, singular'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Eccl.xml'
    quote: 'וְ/ר֥וּחַ'
  - where: 'note 3:19 “One breath for man and beast”'
    claim: 'Ruach in 3:19–21 is singular; it is the life breath all have until death, not spirit personages'
    key: pike-spirit-eccl
    url: 'https://rsc.byu.edu/let-us-reason-together/spirit-returns-god-ecclesiastes-127'
    quote: 'with rûaḥ in all three instances designating the life breath or animating essence that all humans and animals have until death—“they all have one rûaḥ.” … it is clear that in this passage rûaḥ was not used to indicate spirit personages.'
  - where: 'note 3:19 “One breath for man and beast”'
    claim: 'Singular, not “spirits of” as in Num. 16:22; so KJV and most modern translations read “breath” in 3:19'
    key: pike-spirit-eccl
    url: 'https://rsc.byu.edu/let-us-reason-together/spirit-returns-god-ecclesiastes-127'
    quote: 'Significantly, the rûaḥ of animals and of people is represented in this passage with a singular term, not a plural one (not “spirits of,” as occurs in Numbers 16:22 and 27:16).[24] Thus the KJV and most modern English translations render the occurrence of rûaḥ in Ecclesiastes 3:19 with “breath.”'
  - where: 'note 3:19 “One breath for man and beast”'
    claim: 'Modern translations read 3:21 as a question “whether”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+3&version=ESV'
    quote: 'Who knows whether … the spirit of man goes upward and the spirit of the beast goes down into the earth?'
  - where: 'note 3:19 “One breath for man and beast”'
    claim: 'The Septuagint reads 3:21 as a question “whether it goes upward”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/ecclesiastes/3.htm'
    quote: 'And who has seen the spirit of the sons of man, whether it goes upward? and the spirit of the beast, whether it goes downward to the earth?'
  - where: 'note 3:19 “One breath for man and beast”'
    claim: 'One older reading: all the old translators read 3:21 as a question'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/3.htm'
    quote: 'The interrogative meaning of העלה and הירדת is recognised by all the old translators: lxx, Targ., Syr., Jerome, Venet., Luther.'
  - where: 'note 3:19 “One breath for man and beast”'
    claim: 'The same: the vowel pointing removes the question to bring the verse into accord with 12:7'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/3.htm'
    quote: 'we must allow that the punctation seeks, by the removal of the two interrog. ha (ה), to place that which is here said in accord with Ecclesiastes 12:7.'
  - where: 'note 3:19 “One breath for man and beast”'
    claim: 'The pointed word in 3:21 has the article (“that goeth up”)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Eccl.xml'
    quote: 'הָ/עֹלָ֥ה'
  - where: 'note 3:19 “One breath for man and beast”'
    claim: 'On the same older reading, 3:22 means what comes after death is beyond knowing, so enjoy the present'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/3.htm'
    quote: 'How it will be with the spirit of a man when he dies, who knows? What will be after death is thus withdrawn from human knowledge. Thus it is best to enjoy the present'

  # christ
  - where: 'christ'
    claim: 'The Father has committed all judgment to the Son'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/5?lang=eng'
    quote: 'For the Father judgeth no man, but hath committed all judgment unto the Son:'
  - where: 'christ'
    claim: 'In Christ all shall be made alive'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-cor/15?lang=eng'
    quote: 'For as in Adam all die, even so in Christ shall all be made alive.'
  - where: 'note 3:15 “God seeks what has gone by”'
    claim: 'NIV: “God will call the past to account,” with “calls back the past” in its footnote'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+3&version=NIV'
    quote: 'and God will call the past to account.'
  - where: 'note 3:15 “God seeks what has gone by”'
    claim: 'NIV footnote: “God calls back the past”'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+3&version=NIV'
    quote: 'Or God calls back the past'
  - where: 'note 3:19 “One breath for man and beast”'
    claim: 'Pike: in 3:21 the spirit of people goes upward, presumably to God'
    key: pike-spirit-eccl
    url: 'https://rsc.byu.edu/let-us-reason-together/spirit-returns-god-ecclesiastes-127'
    quote: 'And the spirit [rûaḥ] of people (Heb., bĕnēy-hāʾādām) goes “upward,” presumably meaning to God.'
  - where: 'setting'
    claim: 'Chapters 1–2 end with the Preacher calling his works vanity'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/eccl/2?lang=eng'
    quote: 'behold, all was vanity and vexation of spirit'
