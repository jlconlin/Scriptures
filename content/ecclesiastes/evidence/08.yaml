chapter: 8
claims:
  - where: setting
    claim: 'Modern translations'' cross-references tie 8:6 to 3:1 and 3:17'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+8&version=ESV'
    quote: 'Ecclesiastes 8:6 : ch. 3:1, 17'
  - where: setting
    claim: 'The NRSVue cross-reference at 8:6 is also 3:1, 17'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+8&version=NRSVUE'
    quote: '8.6 : Eccl 3.1, 17'
  - where: thread
    claim: 'Modern translations'' cross-references tie 8:17 back to 8:7'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+8&version=NRSVUE'
    quote: '8.17 : v 7; Job 5.9; Ps 73.16; Eccl 3.11; Rom 11.33'
  - where: section 2 plain
    claim: 'A modern translation renders 8:5–6 “the proper time and the just way”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+8&version=ESV'
    quote: 'the wise heart will know the proper time and the just way. 6 For there is a time and a way for everything, although man''s trouble lies heavy on him.'
  - where: 'note 8:1 “A face changed by wisdom”'
    claim: 'A modern translation renders the line “the hardness of his face is changed”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+8&version=ESV'
    quote: 'A man''s wisdom makes his face shine, and the hardness of his face is changed.'
  - where: 'note 8:1 “A face changed by wisdom”'
    claim: 'Another modern translation reads “arrogance changes one’s face,” and cross-references Deut. 28:50'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+8&version=NRSVUE'
    quote: 'Being wise makes one’s face shine, but arrogance changes one’s face.'
  - where: 'note 8:1 “A face changed by wisdom”'
    claim: 'One older reading: the Hebrew phrase is that of Deut. 28:50, meaning hardness or boldness of countenance; wisdom transfigures the countenance'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/8.htm'
    quote: 'that intellectual and ethical transfiguration of the countenance is meant … az panim, Deuteronomy 28:50 … stiffness, hardness, rudeness of countenance equals boldness, want of bashfulness, regardlessness'
  - where: 'note 8:2 “The oath of God”'
    claim: 'The Hebrew reads “the oath of God” (shevu''at ''elohim)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Eccl.xml'
    quote: 'שְׁבוּעַ֥ת'
  - where: 'note 8:2 “The oath of God”'
    claim: 'A modern translation reads “God''s oath to him,” with the alternative “your oath to God”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+8&version=ESV'
    quote: 'Keep the king''s command, because of God''s oath to him. … Ecclesiastes 8:2 Or because of your oath to God'
  - where: 'note 8:2 “The oath of God”'
    claim: 'Another modern translation reads “because you took an oath before God”'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+8&version=NIV'
    quote: 'Obey the king’s command, I say, because you took an oath before God.'
  - where: 'note 8:2 “The oath of God”'
    claim: 'The NRSVue reads “your sacred oath” and cross-references Ezek. 17:18'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+8&version=NRSVUE'
    quote: 'Keep the king’s command, and because of your sacred oath … 8.2 : Ezek 17.18'
  - where: 'note 8:2 “The oath of God”'
    claim: 'One older reading: the king is an earthly king, the subject''s faithfulness a religious duty, compared with Rom. 13:5; the prophets condemned breach of faith with the Assyrian or Chaldean'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/8.htm'
    quote: 'The faithfulness of subjects, Koheleth says, is a religious duty … Ecclesiastes 8:2 accords with Romans 13:5 … any breach of faith committed against the Assyrian or Chaldean oppressor, e.g., Isaiah 28:15; Isaiah 30:1; Ezekiel 17:15'
  - where: 'note 8:2 “The oath of God”'
    claim: 'On that reading “the king” is not God'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/8.htm'
    quote: 'In any case, it is not God who is meant here by "the king;" the words: "and that because of the oath of God," render this impossible'
  - where: 'note 8:8 “No power over the wind”'
    claim: 'The NRSVue renders ruach “wind,” with the footnote “Or breath”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+8&version=NRSVUE'
    quote: 'No one has power over the wind to restrain the wind or power over the day of death … 8.8 Or breath'
  - where: 'note 8:8 “No power over the wind”'
    claim: 'The NIV has “wind,” with the footnote “over the human spirit to retain it”'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+8&version=NIV'
    quote: 'As no one has power over the wind to contain it, so no one has power over the time of their death. … Ecclesiastes 8:8 Or over the human spirit to retain it'
  - where: 'note 8:8 “No power over the wind”'
    claim: 'The ESV keeps “retain the spirit” and cross-references Deut. 20:5–8 at “discharge”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+8&version=ESV'
    quote: 'No man has power to retain the spirit, or power over the day of death. There is no discharge from war … Ecclesiastes 8:8 : See Deut. 20:5-8'
  - where: 'note 8:8 “No power over the wind”'
    claim: 'The Hebrew word, twice in the line, is ruach'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Eccl.xml'
    quote: 'בָּ/ר֨וּחַ֙'
  - where: 'note 8:8 “No power over the wind”'
    claim: 'Pike: none of the 23 occurrences of ruach in Ecclesiastes besides 12:7 convincingly means a spirit personage'
    key: pike-spirit-eccl
    url: 'https://rsc.byu.edu/let-us-reason-together/spirit-returns-god-ecclesiastes-127'
    quote: 'In fact, in none of the 23 occurrences of rûaḥ in Ecclesiastes, not counting 12:7, does rûaḥ convincingly have the meaning of spirit personage.'
  - where: 'note 8:10 “Forgotten, or praised”'
    claim: 'Most Hebrew manuscripts read “forgotten”; some Hebrew manuscripts, the Septuagint and the Vulgate read “praised”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+8&version=ESV'
    quote: 'Then I saw the wicked buried. They used to go in and out of the holy place and were praised in the city where they had done such things. … Some Hebrew manuscripts, Septuagint, Vulgate; most Hebrew manuscripts forgotten'
  - where: 'note 8:10 “Forgotten, or praised”'
    claim: 'The NIV also reads “receive praise,” from some Hebrew manuscripts and the Septuagint'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+8&version=NIV'
    quote: 'I saw the wicked buried—those who used to come and go from the holy place and receive praise in the city where they did this. … Some Hebrew manuscripts and Septuagint (Aquila); most Hebrew manuscripts and are forgotten'
  - where: 'note 8:10 “Forgotten, or praised”'
    claim: 'The NRSVue corrects “buried” and reads “boast,” following the Greek'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+8&version=NRSVUE'
    quote: 'Then I saw the wicked approaching to sacrifice; they go in and out of the holy place, and they boast in the city that they have done such things. … 8.10 Cn: Heb buried … 8.10 Gk: Heb they were forgotten'
  - where: 'note 8:11 “Judgment delayed”'
    claim: 'President Eyring taught that the effects of choices are sure but often delayed for a purpose, so that choosing the right builds faith'
    key: eyring-priceless-heritage
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2014/04/a-priceless-heritage-of-hope?lang=eng'
    quote: 'Those effects are sure. Yet they are often delayed for a purpose. If the blessings were immediate, choosing the right would not build faith.'
  - where: 'note 8:11 “Judgment delayed”'
    claim: 'President Eyring: since sorrow is delayed, it takes faith to seek forgiveness early'
    key: eyring-priceless-heritage
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2014/04/a-priceless-heritage-of-hope?lang=eng'
    quote: 'And since sorrow is also sometimes greatly delayed, it takes faith to feel the need to seek forgiveness for sin early rather than after we feel its sorrowful and painful effects.'
  - where: 'note 8:11 “Judgment delayed”'
    claim: 'The seminary teacher manual sets that teaching beside Eccl. 8:11–13'
    key: seminary-ot-teacher-115
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-song-of-solomon/lesson-115-ecclesiastes-and-the-song-of-solomon?lang=eng'
    quote: 'Ecclesiastes 8:11–13. Delayed punishment for the wicked'
  - where: 'note 8:14 “Well with the God-fearing, and yet the just fare as the wicked”'
    claim: 'A modern translation: “the righteous who get what the wicked deserve”'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+8&version=NIV'
    quote: 'the righteous who get what the wicked deserve, and the wicked who get what the righteous deserve.'
  - where: 'note 8:14 “Well with the God-fearing, and yet the just fare as the wicked”'
    claim: 'Barlow: the author doubts the world''s fairness, citing 8:14'
    key: barlow-public-relations
    url: 'http://mi.byu.edu/old-testament-reflections/ecclesiastes-has-a-public-relations-problem'
    quote: 'The author doubts the world’s fairness, for ofttimes “the righteous … get what the wicked deserve, and the wicked … get what the righteous deserve” (8:14, NIV; cf. 9:11–12).'
  - where: 'note 8:14 “Well with the God-fearing, and yet the just fare as the wicked”'
    claim: 'Barlow: the book may serve as a balancing corrective to the assurance that God prospers the righteous visibly in mortality'
    key: barlow-public-relations
    url: 'http://mi.byu.edu/old-testament-reflections/ecclesiastes-has-a-public-relations-problem'
    quote: 'serve as a balancing corrective to the widely held assurance, in both ancient and modern times, that God will dependably prosper the righteous and punish the wicked in visible, material ways in mortality?'
  - where: 'note 8:14 “Well with the God-fearing, and yet the just fare as the wicked”'
    claim: 'KnoWhy #868: righteousness is sometimes not rewarded in this life; God will balance things at the final judgment'
    key: sc-knowhy-868
    url: 'https://scripturecentral.org/knowhy/why-does-ecclesiastes-talk-so-much-about-vanity'
    quote: 'Sometimes righteousness is not rewarded in this life. … obeying God is the right thing to do, and God will balance things accordingly at final judgement, whether things work out in this life or not.'
  - where: 'note 8:15 “Eat, drink, and be merry”'
    claim: 'KnoWhy #410 lists 8:15 among texts quoted in later books and alluded to in the Book of Mormon (2 Ne. 28:7)'
    key: sc-knowhy-410
    url: 'https://scripturecentral.org/knowhy/what-parts-of-the-old-testament-were-on-the-plates-of-brass'
    quote: 'a text quoted in Ecclesiastes 8:15 is alluded to in 2 Nephi 28:7'
  - where: 'note 8:15 “Eat, drink, and be merry”'
    claim: 'KnoWhy #410: both the Book of Mormon and later biblical texts may quote earlier books on the plates of brass'
    key: sc-knowhy-410
    url: 'https://scripturecentral.org/knowhy/what-parts-of-the-old-testament-were-on-the-plates-of-brass'
    quote: 'it is likely that both the Book of Mormon and the biblical texts written after Lehi’s family left Jerusalem are quoting earlier books that were on the plates of brass but that no longer exist.'
  - where: 'note 8:15 “Eat, drink, and be merry”'
    claim: 'The words of 2 Ne. 28:7–8 and Luke 12:19 compared with Eccl. 8:15'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/28?lang=eng'
    quote: 'Eat, drink, and be merry, for tomorrow we die; and it shall be well with us.'
  - where: 'note 8:15 “Eat, drink, and be merry”'
    claim: 'Modern translations'' cross-references tie 8:15 to 2:24 and the other passages on eating and drinking'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+8&version=NRSVUE'
    quote: '8.15 : Eccl 2.24; 3.12, 13; 5.18; 9.7'
  - where: 'note 8:17 “The work no one can find out”'
    claim: 'A modern translation: “Even though a wise man claims to know”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+8&version=ESV'
    quote: 'However much man may toil in seeking, he will not find it out. Even though a wise man claims to know, he cannot find it out.'
  - where: 'note 8:17 “The work no one can find out”'
    claim: 'The NRSVue cross-references 8:17 to Job 5:9, Eccl. 3:11 and Rom. 11:33'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+8&version=NRSVUE'
    quote: '8.17 : v 7; Job 5.9; Ps 73.16; Eccl 3.11; Rom 11.33'
  - where: setting
    claim: 'Nephi''s prophecy in 2 Ne. 28:7 alludes to the text of 8:15'
    key: sc-knowhy-410
    url: 'https://scripturecentral.org/knowhy/what-parts-of-the-old-testament-were-on-the-plates-of-brass'
    quote: 'a text quoted in Ecclesiastes 8:15 is alluded to in 2 Nephi 28:7'
  - where: christ
    claim: 'The scriptures quoted: John 5:22; 1 Cor. 15:19'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/5?lang=eng'
    quote: 'For the Father judgeth no man, but hath committed all judgment unto the Son:'
  - where: 'note 8:11 “Judgment delayed”'
    claim: 'The seminary manual introduces President Eyring''s teaching under Eccl. 8:11–13'
    key: seminary-ot-teacher-115
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-song-of-solomon/lesson-115-ecclesiastes-and-the-song-of-solomon?lang=eng'
    quote: 'do not seem to suffer consequences for it. President Henry B. Eyring of the First Presidency taught:'
  - where: 'note 8:15 “Eat, drink, and be merry”'
    claim: 'KnoWhy #410 takes Ecclesiastes to be written after Lehi left Jerusalem'
    key: sc-knowhy-410
    url: 'https://scripturecentral.org/knowhy/what-parts-of-the-old-testament-were-on-the-plates-of-brass'
    quote: 'Books that were almost certainly written after Lehi left Jerusalem, like 1 Chronicles, Nehemiah, Job, Ecclesiastes'
