chapter: 6
claims:
  - where: section 2 plain
    claim: 'The “one place” of 6:6 is the “one place” of 3:20'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/6.htm'
    quote: 'The "one place" is, as at Ecclesiastes 3:20, the grave and Hades, into which all the living fall.'
  - where: 'note 6:2 “Riches without the power to enjoy them”'
    claim: 'A modern translation renders 6:2 “God does not enable them to enjoy these things”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+6&version=NRSVUE'
    quote: 'yet God does not enable them to enjoy these things, but a stranger enjoys them'
  - where: 'note 6:2 “Riches without the power to enjoy them”'
    claim: 'The ESV cross-references at 6:2 point to 5:19 and Luke 12:20'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+6&version=ESV'
    quote: 'Ecclesiastes 6:2 : [ch. 5:19; Luke 12:20]'
  - where: 'note 6:3 “No burial”'
    claim: 'In the Old Testament an unburied body was a disgrace and a sign of divine judgment'
    key: sc-knowhy-586
    url: 'https://scripturecentral.org/knowhy/why-were-the-unburied-dead-so-troubling-to-the-jaredites'
    quote: 'Such a fate was seen by many ancient peoples not only as a tragedy, as it would be today, but a disgrace and an indication of divine judgment.'
  - where: 'note 6:3 “No burial”'
    claim: 'The ideal afterlife in the Hebrew Bible was tied to the tomb'
    key: sc-knowhy-586
    url: 'https://scripturecentral.org/knowhy/why-were-the-unburied-dead-so-troubling-to-the-jaredites'
    quote: 'The ideal afterlife in the Hebrew Bible was bound to the tomb'
  - where: 'note 6:3 “No burial”'
    claim: 'The KnoWhy lists Ecclesiastes 6:3–5 among the passages on the unburied'
    key: sc-knowhy-586
    url: 'https://scripturecentral.org/knowhy/why-were-the-unburied-dead-so-troubling-to-the-jaredites'
    quote: 'See Deuteronomy 28:26; 1 Kings 16:3–4; 21:24; 2 Kings 9:10, 30–37; Jeremiah 8:1–3; 14:16; 16:4–6; 22:19; 25:33; Ecclesiastes 6:3–5.'
  - where: 'note 6:3 “No burial”'
    claim: 'Modern revelation: lack of burial does not harm departed spirits'
    key: sc-knowhy-586
    url: 'https://scripturecentral.org/knowhy/why-were-the-unburied-dead-so-troubling-to-the-jaredites'
    quote: 'Today, modern revelation sheds great light on post-mortal life, and it is clear that a lack of burial will not have negative consequences upon departed spirits.'
  - where: 'note 6:3 “Better off than he: the stillborn”'
    claim: 'A modern translation renders it “a stillborn child” and reads 6:4–5 of the child (“it”)'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+6&version=ESV'
    quote: 'I say that (I)a stillborn child is better off than he. 4 For it comes in vanity and goes in darkness, and in darkness its name is covered.'
  - where: 'note 6:3 “Better off than he: the stillborn”'
    claim: 'Another modern translation: the stillborn has not seen the sun, yet finds rest rather than he'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+6&version=NRSVUE'
    quote: 'moreover, it has not seen the sun or known anything, yet it finds rest rather than he.'
  - where: 'note 6:7 “Soul, appetite and desire: one word”'
    claim: 'The Hebrew word in 6:2, 3, 7 and 9 is nephesh (H5315)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Eccl.xml'
    quote: 'נָ֑פֶשׁ'
  - where: 'note 6:7 “Soul, appetite and desire: one word”'
    claim: 'BDB: nephesh, soul, living being, life, self, person, desire, appetite'
    key: bdb
    url: 'https://biblehub.com/hebrew/5315.htm'
    quote: 'soul, living being, life, self, person, desire, appetite, emotion, and passion'
  - where: 'note 6:7 “Soul, appetite and desire: one word”'
    claim: 'BDB: in Ecclesiastes the nephesh craves, lacks and is filled with good things, at 6:2, 3, 7, 9'
    key: bdb
    url: 'https://biblehub.com/hebrew/5315.htm'
    quote: 'the נפשׁ craves, lacks, and is filled with good things: Ecclesiastes 2:24; Ecclesiastes 4:8; Ecclesiastes 6:2,3,7,9; Ecclesiastes 7:28.'
  - where: 'note 6:7 “Soul, appetite and desire: one word”'
    claim: 'The Hebrew of 6:7 says the appetite is not “filled”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+6&version=ESV'
    quote: 'Ecclesiastes 6:7 Hebrew filled'
  - where: 'note 6:7 “Soul, appetite and desire: one word”'
    claim: 'A modern translation renders 6:8 “know how to conduct themselves before the living”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+6&version=NRSVUE'
    quote: 'And what do the poor have who know how to conduct themselves before the living?'
  - where: 'note 6:7 “Soul, appetite and desire: one word”'
    claim: 'One older reading: mouth and soul are not contrasted as body and spirit; the stomach could be named'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/6.htm'
    quote: 'instead of the soul the stomach could also be named; for it is the soul longing, and that after the means from without of self-preservation, that is here meant'
  - where: 'note 6:7 “Soul, appetite and desire: one word”'
    claim: 'The same: the poor man keeps his social position, the wise controls desire, and desire is present in both'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/6.htm'
    quote: 'what the poor, who, although poor, yet knows how to maintain his social position? … The wise seeks to control his desire … But desire is present in both; and they have in this nothing above the fool'
  - where: 'note 6:7 “Soul, appetite and desire: one word”'
    claim: 'The same: the wandering of the soul is its endless unrest; to have and enjoy is better than hungering and longing'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/6.htm'
    quote: 'the soul which does not become full or satisfied goes out, and seeks and reaches not its aim. … for to have and to enjoy is better than this constant Hungern und Lungern hungering and longing.'
  - where: 'note 6:11 “Many things, or many words”'
    claim: 'Modern translations render 6:11 “The more words, the more vanity”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+6&version=NRSVUE'
    quote: '11 The more words, the more vanity, so how is one the better?'
  - where: 'note 6:11 “Many things, or many words”'
    claim: 'Another modern translation: “The more words, the more vanity”; 6:10 man not able to dispute with one stronger'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+6&version=ESV'
    quote: 'and it is known what man is, and that he is not able to (Q)dispute with one stronger than he. 11 The more words, the more vanity'
  - where: 'note 6:11 “Many things, or many words”'
    claim: 'One older reading: devarim here means words, not things, because the dispute is in words'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/6.htm'
    quote: 'The dispute (objection), דּין, takes place in words; דּברים here will thus not mean "things" (Hengst., Ginsb., Zckl., Bullock, etc.), but "words."'
  - where: 'note 6:11 “Many things, or many words”'
    claim: 'The same: man''s whole being is known beforehand, and he cannot speak against the higher hand that forms his fate'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/6.htm'
    quote: 'the whole being of a man, whether of this one or that one, at all times and on all sides, is previously known … Against this formation of his nature and of his fate by a higher hand, man cannot utter a word.'
  - where: 'note 6:11 “Many things, or many words”'
    claim: 'The same: such words bring no advantage'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/6.htm'
    quote: 'because they are resultless, they bring no advantage for man'
  - where: 'note 6:12 “What shall be after him”'
    claim: 'The ESV cross-references join 6:12 to 3:22 and 2:18'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+6&version=ESV'
    quote: 'Ecclesiastes 6:12 : [ch. 2:18; 3:22]'
  - where: 'note 6:12 “What shall be after him”'
    claim: 'The NRSVue cross-references for 6:12 include Ps. 39:6 and James 4:14'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+6&version=NRSVUE'
    quote: '6.12 : Ps 39.6; Eccl 8.7; Jas 4.14'
  - where: 'note 6:12 “What shall be after him”'
    claim: 'A modern translation: “the few days of their vain life, which they pass like a shadow”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+6&version=NRSVUE'
    quote: 'For who knows what is good for mortals while they live the few days of their vain life, which they pass like a shadow? For who can tell them what will be after them under the sun?'
