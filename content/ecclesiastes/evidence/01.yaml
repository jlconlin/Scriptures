chapter: 1
claims:
  # setting
  - where: setting
    claim: 'Ecclesiastes is the Greek rendering of the book’s Hebrew name, rendered Preacher'
    key: bd-ecclesiastes
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ecclesiastes?lang=eng'
    quote: 'A Greek translation of the Hebrew Koheleth, a word meaning “one who convenes an assembly,” sometimes rendered Preacher.'
  - where: setting
    claim: 'In 1:1–11 and 12:8–14 the text speaks of the Preacher in the third person, which may suggest a compiler'
    key: seminary-intro-eccl
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-study-guide-for-home-study-seminary-students-2015/introduction-to-ecclesiastes?lang=eng'
    quote: 'In Ecclesiastes 1:1–11 and 12:8–14, the text refers to the preacher in the third person. This may suggest that someone other than the preacher compiled his writings and teachings sometime after they were given.'
  - where: setting
    claim: 'Chapters 1–2: everything in this life is fleeting; the Preacher’s futile efforts to find meaning through worldly means'
    key: scripture-helps-proverbs
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/35-proverbs-1-4-15-16-22-31-ecclesiastes-1-3-11-12?lang=eng'
    quote: 'Ecclesiastes 1–2: The Preacher states that everything in this life is fleeting and will not last. To support this conclusion, he shares futile efforts he made to find meaning and purpose in life through worldly means.'
  - where: setting
    claim: 'The thoughts of 1:2–11 stand as the motto of the book'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/1.htm'
    quote: 'these are the thoughts of the book which stand as its motto, Ecclesiastes 1:2-11.'
  - where: setting
    claim: 'The book is a collection of poems and aphorisms shaped into a single treatise'
    key: barlow-public-relations
    url: 'http://mi.byu.edu/old-testament-reflections/ecclesiastes-has-a-public-relations-problem'
    quote: 'First, the book is a poem. More precisely, it is a collection of poems and aphorisms, glued together by strands of prose and shaped into a single treatise.'
  - where: setting
    claim: 'Everything the Preacher says is to be taken in the context of his conclusion in 12:13–14'
    key: seminary-intro-eccl
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-study-guide-for-home-study-seminary-students-2015/introduction-to-ecclesiastes?lang=eng'
    quote: 'Everything that he says, therefore, must be taken in context of his final conclusion in Ecclesiastes 12:13–14 that all of our works in this life will one day be judged by God.'
  - where: setting
    claim: 'The Preacher is a believer who often speaks as if he were not'
    key: seminary-intro-eccl
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-study-guide-for-home-study-seminary-students-2015/introduction-to-ecclesiastes?lang=eng'
    quote: 'although the preacher is a believer, he often poses questions and makes statements as if he were not.'

  # thread
  - where: thread
    claim: 'The four examples of 1:4–7 show a restless activity with no end pervading the world, summed up in verse 8'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/1.htm'
    quote: 'a restless activity reaching no visible conclusion and end, always beginning again anew, pervades the whole world-all things, he says, summarizing, are in labour'
  - where: thread
    claim: 'Verse 9 takes in what is done in nature and among men, the natural and the historical'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/1.htm'
    quote: 'The double clause, quod fuit ... quod factum est, comprehends that which is done in the world of nature and of men-the natural and the historical.'
  - where: thread
    claim: 'The claim of verse 9 invites contradiction, and verse 10 answers it'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/1.htm'
    quote: 'The bold clause, neque est quidquam novi sub sole, challenges contradiction; the author feels this, as the next verse shows.'
  - where: thread
    claim: 'In 1:13 the sore trouble God has given is the seeking and surveying with wisdom'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/1.htm'
    quote: '"And I gave my heart to seek and to hold survey with wisdom over all that is done under the sun: a sore trouble it is which God has given to the children of men to be exercised therewith."'
  - where: thread
    claim: 'The Preacher acknowledged God in his pursuit of wisdom in 1:13'
    key: ot-minute-ecclesiastes
    url: 'https://scripturecentral.org/archive/books/book-chapter/ecclesiastes-13-1112'
    quote: 'The Preacher acknowledged God in his pursuit of understanding and wisdom. In verse 13, he mentioned the “sore travail” that God has given us.'

  # sections
  - where: section 4 plain
    claim: 'Verse 13: the Hebrew of “sore travail” is literally “evil business,” of little profit'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/eccl/1?lang=eng'
    quote: 'HEB (literally) “evil business”; i.e., that which is of little profit.'
  - where: section 4 plain
    claim: 'Verse 14: “vexation of spirit” is Hebrew “striving after wind”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/eccl/1?lang=eng'
    quote: 'HEB striving after wind; thus, frustration.'
  - where: section 5 plain
    claim: 'Verse 16: “I am come to great estate” is Hebrew “I have become great”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/eccl/1?lang=eng'
    quote: 'HEB I have become great.'
  - where: section 2 plain
    claim: 'Verse 8: all things are in restless labour, wearied, not wearisome to tell'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/1.htm'
    quote: 'for יגע does not denote that which causes weariness, but that which suffers weariness'

  # note 1:1
  - where: 'note 1:1 “Who the Preacher is”'
    claim: 'Ecclesiastes is a Greek translation of Koheleth, “one who convenes an assembly”'
    key: bd-ecclesiastes
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ecclesiastes?lang=eng'
    quote: 'A Greek translation of the Hebrew Koheleth, a word meaning “one who convenes an assembly,” sometimes rendered Preacher.'
  - where: 'note 1:1 “Who the Preacher is”'
    claim: 'Other renderings of qōhelet are “Assembler” and “Teacher”; the name comes into English through the Septuagint’s Ekklēsiastēs'
    key: pike-spirit-eccl
    url: 'https://rsc.byu.edu/let-us-reason-together/spirit-returns-god-ecclesiastes-127'
    quote: 'The KJV and some other English translations render this Hebrew term (qōhelet) as “Preacher,” but other possibilities include “Assembler” and “Teacher.” The English title “Ecclesiastes” derives from the Greek rendition of qōhelet in the Septuagint (Ekklēsiastēs).'
  - where: 'note 1:1 “Who the Preacher is”'
    claim: 'The lexicon gives “collector (of sentences)” as well as preacher'
    key: bdb
    url: 'https://biblehub.com/hebrew/6953.htm'
    quote: 'collector (of sentences), or (AV RV) preacher'
  - where: 'note 1:1 “Who the Preacher is”'
    claim: 'Scripture Helps: the Preacher is traditionally thought to be King Solomon'
    key: scripture-helps-proverbs
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/35-proverbs-1-4-15-16-22-31-ecclesiastes-1-3-11-12?lang=eng'
    quote: 'The book of Ecclesiastes records the reflections of a man called the Preacher, who is traditionally thought to be King Solomon.'
  - where: 'note 1:1 “Who the Preacher is”'
    claim: 'Phrases in 1:1, 12, 16 are meant to imply Solomon; his name is never used; the language is later; scholars attribute the book to an unknown writer five to seven centuries after Solomon'
    key: pike-spirit-eccl
    url: 'https://rsc.byu.edu/let-us-reason-together/spirit-returns-god-ecclesiastes-127'
    quote: 'certain phrases in the early chapters of the book are intended to imply such a connection (for example, 1:1, 12, 16; 2:7, 9). However, his name is never actually mentioned in Ecclesiastes, some passages argue against Solomonic authorship, and the style and language of the book are generally seen as deriving from later in Israelite history.'
  - where: 'note 1:1 “Who the Preacher is”'
    claim: 'Scholars tend to attribute the book to an unknown individual five to seven centuries after Solomon'
    key: pike-spirit-eccl
    url: 'https://rsc.byu.edu/let-us-reason-together/spirit-returns-god-ecclesiastes-127'
    quote: 'Thus biblical scholars tend to attribute the authorship of Ecclesiastes to some unknown individual living five to seven centuries after Solomon.'
  - where: 'note 1:1 “Who the Preacher is”'
    claim: 'Little is known of the writer beyond his own description of himself'
    key: seminary-intro-eccl
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-study-guide-for-home-study-seminary-students-2015/introduction-to-ecclesiastes?lang=eng'
    quote: 'Little is known about the writer of Ecclesiastes beyond his own description of himself as a “son of David, king in Jerusalem” (Ecclesiastes 1:1).'
  - where: 'note 1:1 “Who the Preacher is”'
    claim: 'A Latter-day Saint devotional reading takes the clues of 1:1, 12, 16 as pointing to Solomon'
    key: ot-minute-ecclesiastes
    url: 'https://scripturecentral.org/archive/books/book-chapter/ecclesiastes-13-1112'
    quote: 'The fact that the Preacher was the son of King David leads us to believe that the Preacher was Solomon. There are other indications in Ecclesiastes that the writer was Solomon.'
  - where: 'note 1:1 “Who the Preacher is”'
    claim: 'The epilogue describes the Preacher teaching the people and setting in order many proverbs'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/eccl/12?lang=eng'
    quote: 'he still taught the people knowledge; yea, he gave good heed, and sought out, and set in order many proverbs.'

  # note 1:2
  - where: 'note 1:2 “Vanity is a vapor”'
    claim: 'The Hebrew hevel behind “vanity” is not about pride in one’s appearance'
    key: sc-knowhy-868
    url: 'https://scripturecentral.org/knowhy/why-does-ecclesiastes-talk-so-much-about-vanity'
    quote: 'However, the Hebrew term hevel, rendered as vanity in the King James Bible, is not about pride in one’s appearance, but something a little more complicated.'
  - where: 'note 1:2 “Vanity is a vapor”'
    claim: 'Hebel means something like mist, vapor, a puff of air'
    key: barlow-public-relations
    url: 'http://mi.byu.edu/old-testament-reflections/ecclesiastes-has-a-public-relations-problem'
    quote: 'However, the Hebrew word (hebel) behind them means something more like “mist” or “vapor,” “a puff of air.”'
  - where: 'note 1:2 “Vanity is a vapor”'
    claim: 'Psalm 39:5 uses hevel of everyone as a mere breath'
    key: sc-knowhy-868
    url: 'https://scripturecentral.org/knowhy/why-does-ecclesiastes-talk-so-much-about-vanity'
    quote: 'surely everyone stands as a mere breath [hevel].” This verse suggests that everything, including life itself, is ephemeral and impossible to hold on to, like a breath.'
  - where: 'note 1:2 “Vanity is a vapor”'
    claim: 'Much in life is like trying to hold vapor in one’s hands'
    key: sc-knowhy-868
    url: 'https://scripturecentral.org/knowhy/why-does-ecclesiastes-talk-so-much-about-vanity'
    quote: 'Thus, much in life is “vanity,” like a person attempting to hold on to vapor with their hands: an impossible task.'
  - where: 'note 1:2 “Vanity is a vapor”'
    claim: 'The Preacher’s thought begins and ends with this lament (1:2; 12:8)'
    key: barlow-public-relations
    url: 'http://mi.byu.edu/old-testament-reflections/ecclesiastes-has-a-public-relations-problem'
    quote: 'The thought of the “Teacher” or “Preacher” that constitutes the book of Ecclesiastes begins and ends with a lament about human aspirations and human affairs: “Vanity of vanities, all is vanity” (1:2; 12:8).'
  - where: 'note 1:2 “Vanity is a vapor”'
    claim: 'Barlow’s paraphrase of the opening thought: life as a fleeting vapor that cannot be grasped'
    key: barlow-public-relations
    url: 'http://mi.byu.edu/old-testament-reflections/ecclesiastes-has-a-public-relations-problem'
    quote: 'Taken this way, the thought that opens and closes Ecclesiastes may carry the sense of “ Life is as a fleeting vapor, which cannot be grasped.”'
  - where: 'note 1:2 “Vanity is a vapor”'
    claim: 'Barlow sets the sense beside Jacob’s lament in Jacob 7:26'
    key: barlow-public-relations
    url: 'http://mi.byu.edu/old-testament-reflections/ecclesiastes-has-a-public-relations-problem'
    quote: 'Might this sense, crafted by the weary, poetic Teacher, be put in fruitful conversation with Jacob’s striking lament in The Book of Mormon?'

  # note 1:3
  - where: 'note 1:3 “Under the sun”'
    claim: 'The book seems pessimistic but must be read in the light of “under the sun,” “from a worldly point of view”'
    key: bd-ecclesiastes
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ecclesiastes?lang=eng'
    quote: 'The book of Ecclesiastes seems permeated with a pessimistic flavor but must be read in the light of one of its key phrases: “under the sun” (1:9), meaning “from a worldly point of view.”'
  - where: 'note 1:3 “Under the sun”'
    claim: '“Under the sun” is another way of saying “during mortality”'
    key: seminary-ot-teacher-115
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-song-of-solomon/lesson-115-ecclesiastes-and-the-song-of-solomon?lang=eng'
    quote: 'Explain that the phrase “under the sun” is another way of saying “during mortality.”'
  - where: 'note 1:3 “Under the sun”'
    claim: 'Yitron, “advantage, profit,” occurs only in Ecclesiastes'
    key: bdb
    url: 'https://biblehub.com/hebrew/3504.htm'
    quote: 'יִתְרוֺן noun [masculine] advantage, profit, only Ecclesiastes'

  # note 1:4
  - where: 'note 1:4 “The round of the world”'
    claim: 'The earth’s stability is only the foil to the endless growth and decay of the generations'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/1.htm'
    quote: 'the stability of the earth appears to him only as the foil of the growth and decay everlastingly repeating themselves.'
  - where: 'note 1:4 “The round of the world”'
    claim: 'The sun is a second example of ceaseless change with perpetual sameness'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/1.htm'
    quote: 'This, which he thinks of in contrast with the earth, is to him a second example of ceaseless change with perpetual sameness. As the generations of men come and go, so also does the sun.'
  - where: 'note 1:4 “The round of the world”'
    claim: 'The word for the sun’s hastening means panting'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/1.htm'
    quote: 'שׁואף (panting, hastening)'
  - where: 'note 1:4 “The round of the world”'
    claim: 'Verse 8: things are not wearisome to tell but themselves suffer weariness'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/1.htm'
    quote: 'for יגע does not denote that which causes weariness, but that which suffers weariness'
  - where: 'note 1:4 “The round of the world”'
    claim: 'All things are restless, giving the impression of fatigue'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/1.htm'
    quote: 'all things, he says, summarizing, are in labour, i.e., are restless, hastening on, giving the impression of fatigue.'
  - where: 'note 1:4 “The round of the world”'
    claim: 'The unrest of things without is matched by the unrest of the mind'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/1.htm'
    quote: 'to the unrest of things without corresponds the unrest of the mind'
  - where: 'note 1:4 “The round of the world”'
    claim: 'The restless activity around us communicates itself to us, so that we find no rest'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/1.htm'
    quote: 'the force with which the restless activity which surrounds us lays hold of and communicates itself to us, so that we also find no rest and contentment.'

  # note 1:14
  - where: 'note 1:14 “Striving after wind”'
    claim: 'The Church’s footnote: Hebrew “striving after wind; thus, frustration”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/eccl/1?lang=eng'
    quote: 'HEB striving after wind; thus, frustration.'
  - where: 'note 1:14 “Striving after wind”'
    claim: 'Re‘ut means longing, striving, and occurs with ruach in 1:14; 2:11, 17, 26; 4:4; 6:9'
    key: bdb
    url: 'https://biblehub.com/hebrew/7469.htm'
    quote: 'II. רְעוּת noun feminine longing, striving; — construct, רוּחַ ׳הֶבֶל וּר Ecclesiastes 1:14; Ecclesiastes 2:11,17,26; Ecclesiastes 4:4; Ecclesiastes 6:9'
  - where: 'note 1:14 “Striving after wind”'
    claim: 'Ruach in Ecclesiastes sometimes clearly means wind (1:6); in “vexation of spirit,” nine times, it is now often rendered “striving after wind”'
    key: pike-spirit-eccl
    url: 'https://rsc.byu.edu/let-us-reason-together/spirit-returns-god-ecclesiastes-127'
    quote: 'Sometimes it clearly refers to the wind (for example, 1:6; 11:4). And it occurs (nine times) in the expression “vexation of spirit” (KJV; rĕʿût rûaḥ; for example, 1:14, 17; 4:4), which is now often rendered as “striving after wind”'
  - where: 'note 1:14 “Striving after wind”'
    claim: 'Verse 15 confirms the judgment of verse 14'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/1.htm'
    quote: 'The judgment contained in the words, "vanity and a striving after the wind," is confirmed: "That which is crooked cannot become straight; and a deficit cannot be numerable,"'
  - where: 'note 1:14 “Striving after wind”'
    claim: 'One older reading: verse 15 refers to labour and research under the sun; the observer finds faults and wants but can bring no help'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/1.htm'
    quote: 'But the preceding statement refers only to labour under the sun, and to philosophical research and observation directed thereto.'
  - where: 'note 1:14 “Striving after wind”'
    claim: 'With all his wisdom the observer can bring no help'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/1.htm'
    quote: 'he has only lamentation over it, for with all his wisdom he can bring no help.'

  # note 1:18
  - where: 'note 1:18 “Wisdom that brings grief”'
    claim: 'Come, Follow Me: the Preacher gave his heart to know wisdom but still found vexation and much grief (1:17–18)'
    key: cfm-ot-2026-37
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/37?lang=eng'
    quote: 'The Preacher quoted in Ecclesiastes observed that he “gave [his] heart to know wisdom” but still found “vexation of spirit” and “much grief” (Ecclesiastes 1:17–18).'
  - where: 'note 1:18 “Wisdom that brings grief”'
    claim: 'Proverbs’ main message is that seeking wisdom makes life go well; Ecclesiastes seems to say it is not that simple'
    key: cfm-ot-2026-37
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/37?lang=eng'
    quote: 'Its main message is that if you seek wisdom—especially God’s wisdom—life will go well. But Proverbs is followed by the book of Ecclesiastes, which seems to say, “It’s not that simple.”'
  - where: 'note 1:18 “Wisdom that brings grief”'
    claim: 'The two books teach similar truths; 12:13 is the same principle as Proverbs 3:5'
    key: cfm-ot-2026-37
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/37?lang=eng'
    quote: 'And yet, while the two books look at life from different perspectives, they teach similar truths.'
  - where: 'note 1:18 “Wisdom that brings grief”'
    claim: 'Wisdom literature holds that wise living brings happiness; Ecclesiastes more than other books emphasizes the frustration of finding meaning'
    key: pike-spirit-eccl
    url: 'https://rsc.byu.edu/let-us-reason-together/spirit-returns-god-ecclesiastes-127'
    quote: 'Wisdom literature generally presents life lessons learned through experience and observation, with the view that “wise” and principled living brings happiness, contentment, and prosperity. Ecclesiastes, however, more than other biblical literature, rather pessimistically emphasizes the challenge and frustration of finding meaning in mortal life'
  - where: christ
    claim: 'The Student Manual: the purpose of Ecclesiastes is to help us remember there is meaning only through God and His commandments'
    key: ot-manual-proverbs
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-2?lang=eng'
    quote: 'The purpose of Ecclesiastes is not to grind us down between futility and despair but to help us remember that there is meaning only through God and keeping His commandments.'
  - where: christ
    claim: 'The Church’s footnote at 1:3 sets “profit” beside Matt. 16:26 and 2 Ne. 9:51'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/eccl/1?lang=eng'
    quote: '1 Sam. 12:21; Matt. 16:26; 2 Ne. 9:51.'
  - where: christ
    claim: '1 Cor. 15:19–20 read'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-cor/15?lang=eng'
    quote: 'If in this life only we have hope in Christ, we are of all men most miserable.'
  - where: christ
    claim: '2 Ne. 9:51 read'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/9?lang=eng'
    quote: 'come unto the Holy One of Israel, and feast upon that which perisheth not, neither can be corrupted'

  # explore
  - where: explore
    claim: 'Barlow’s essay takes up the book’s poetry and how to hold its pessimism with the gospel'
    key: barlow-public-relations
    url: 'http://mi.byu.edu/old-testament-reflections/ecclesiastes-has-a-public-relations-problem'
    quote: 'How might we hold it together with our optimistic view of a purposeful life, a loving and redeeming Lord, and an exalted eternal horizon? Let us first revisit poetry’s connection to faith'
