chapter: 5
claims:
  - where: setting
    claim: 'The King James 5:1 is 4:17 in the Hebrew text'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Eccl.xml'
    quote: 'Eccl.4.17'
  - where: setting
    claim: 'The Greek numbers the same way: the King James 5:2 is its 5:1'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/ecclesiastes/5.htm'
    quote: '2(5:1) Be not hasty with thy mouth'
  - where: setting
    claim: 'The Student Manual calls 5:1–17 the most positive verses in the book, given as brief proverbs'
    key: ot-manual-proverbs
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-2?lang=eng'
    quote: 'These verses are the most positive in Ecclesiastes. The counsel given here is in the form of brief proverbs or wise sayings.'

  - where: 'note 5:1 “Hearing before sacrifice”'
    claim: 'The house of God is the temple; “to hear” means hearing the word of God there, a hearing that leads to obedience'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/5.htm'
    quote: 'The "house of God" is like the "house of Jahve," 2 Samuel 12:20; Isaiah 37:1, the temple'
  - where: 'note 5:1 “Hearing before sacrifice”'
    claim: 'Hearing the word of God, a hearing that leads to obedience'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/5.htm'
    quote: 'but "to hear," - viz. the word of God, which is to be heard in the house of God, - whereby, it is true, a hearing is meant which leads to obedience.'
  - where: 'note 5:1 “Hearing before sacrifice”'
    claim: 'The verse agrees with Prov. 21:3, and Samuel’s word in 1 Sam. 15:22 echoes through the Psalms and prophets'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/5.htm'
    quote: 'The most recent canonical Chokma-book agrees with Proverbs 21:3 in this depreciation of sacrifice. … The great word of Samuel, 1 Samuel 15:22., that self-denying obedience to God is better than all sacrifices, echoes through the whole of the Psalms.'
  - where: 'note 5:1 “Hearing before sacrifice”'
    claim: 'Samuel: to obey is better than sacrifice'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/15?lang=eng'
    quote: 'Behold, to obey is better than sacrifice, and to hearken than the fat of rams.'

  - where: 'note 5:3 “Dreams and many words”'
    claim: 'Words before God should be few because God is exalted above man as heaven above earth'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/5.htm'
    quote: 'As the heavens, God''s throne, are exalted above the earth, the dwelling-place of man, so exalted is the heavenly God above earthly man, standing far beneath him; therefore ought the words of a man before God to be few'
  - where: 'note 5:3 “Dreams and many words”'
    claim: 'Verse 3 is a comparison: where words are many, there is folly'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/5.htm'
    quote: 'Few ought the words to be; for where they are many, it is not without folly. This is what is to be understood, Ecclesiastes 5:2, by the comparison'
  - where: 'note 5:3 “Dreams and many words”'
    claim: 'The dreams come not from labor, which gives sweet sleep (5:12), but from self-vexing striving after ends beyond reach'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/5.htm'
    quote: 'not: by much labour; for labour in itself, as the expenditure of strength making one weary, has as its consequence, Ecclesiastes 5:11, sweet sleep undisturbed by dreams; but: by much self-vexation in a man''s striving after high and remote ends beyond what is possible'
  - where: 'note 5:3 “Dreams and many words”'
    claim: 'The Septuagint reads “multitude of trial”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/ecclesiastes/5.htm'
    quote: 'For through the multitude of trial a dream comes; and a fool''s voice is with a multitude of words.'

  - where: 'note 5:4 “A vow is paid”'
    claim: 'Deuteronomy: a vow is not to be slack in paying'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/23?lang=eng'
    quote: 'When thou shalt vow a vow unto the Lord thy God, thou shalt not slack to pay it: for the Lord thy God will surely require it of thee; and it would be sin in thee.'
  - where: 'note 5:4 “A vow is paid”'
    claim: 'Vows were of dedication or abstinence, and often entreating, offered to obtain a favor'
    key: bd-vows
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/vows?lang=eng'
    quote: 'These were of two kinds: (a) dedication—some person or thing was given to the Lord (Lev. 27:1–24); (b) abstinence—a promise made to abstain from some lawful act or enjoyment (Num. 6:3).'
  - where: 'note 5:4 “A vow is paid”'
    claim: 'Vows often had an entreating character'
    key: bd-vows
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/vows?lang=eng'
    quote: 'Vows often had an entreating character; they were offered in order to obtain some favor from Jehovah (Gen. 28:20; 2 Sam. 15:7–8).'

  - where: 'note 5:6 “An angel, a messenger, or a priest”'
    claim: 'BDB: mal’ak here probably means a priest, as in Mal. 2:7'
    key: bdb
    url: 'https://biblehub.com/hebrew/4397.htm'
    quote: 'c. priest Malachi 2:7, probably Ecclesiastes 5:5 (RV angel).'
  - where: 'note 5:3 “Dreams and many words”'
    claim: 'Few, well-chosen words before God'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/5.htm'
    quote: 'few, well-chosen reverential words, in which one expresses his whole soul.'
  - where: 'note 5:6 “An angel, a messenger, or a priest”'
    claim: 'Malachi calls the priest the messenger of the LORD'
    key: bdb
    url: 'https://biblehub.com/hebrew/4397.htm'
    quote: 'Malachi 2:7 – “For the lips of a priest should preserve knowledge… for he is the messenger of the LORD of Hosts.”'
  - where: 'note 5:6 “An angel, a messenger, or a priest”'
    claim: 'Delitzsch takes the messenger as a title of the priest; the Targum reads an angel of judgment; the Septuagint and Syriac read “before God”'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/5.htm'
    quote: 'Without doubt hammǎlāch is an official byname of a priest, and that such as was in common use at the time of the author. … By this word the Targ. understands the angel to whom the execution of the sentence of punishment shall be committed on the day of judgment'
  - where: 'note 5:6 “An angel, a messenger, or a priest”'
    claim: 'The Septuagint and Syriac read “before God”'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/5.htm'
    quote: 'The lxx and Syr. translate "before God,"'
  - where: 'note 5:6 “An angel, a messenger, or a priest”'
    claim: 'The “error” is the shegagah of the sacrificial law (Num. 15:25); the man tells the priest his vow was an inadvertence and offers less'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/5.htm'
    quote: 'such passages relating to the law of sacrifice as Numbers 15:22-26, from which the words ki shegagah hi (Numbers 15:25) originate. We have to suppose that he who has made a vow, and has not kept it, comes to terms with God with an easier and less costly offering'
  - where: 'note 5:6 “An angel, a messenger, or a priest”'
    claim: 'He explains before the priest that the vow escaped him inconsiderately'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/5.htm'
    quote: 'in the confession (ודּוּי) which he makes before the priest he explains that the vow was a shegagah, a declaration that inconsiderately escaped him.'
  - where: 'note 5:6 “An angel, a messenger, or a priest”'
    claim: 'Numbers 15:25: forgiven, for it is ignorance'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/15?lang=eng'
    quote: 'And the priest shall make an atonement for all the congregation of the children of Israel, and it shall be forgiven them; for it is ignorance'
  - where: 'note 5:6 “An angel, a messenger, or a priest”'
    claim: 'The Septuagint reads “in the presence of God”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/ecclesiastes/5.htm'
    quote: 'Suffer not thy mouth to lead thy flesh to sin; and say not in the presence of God, It was an error'
  - where: 'note 5:6 “An angel, a messenger, or a priest”'
    claim: 'A modern translation: “the temple messenger,” “My vow was a mistake”'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes%205&version=NIV'
    quote: 'And do not protest to the temple messenger, “My vow was a mistake.”'
  - where: 'note 5:6 “An angel, a messenger, or a priest”'
    claim: 'A modern translation: “before the messenger”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes%205&version=NRSVUE'
    quote: 'do not say before the messenger that it was a mistake'

  - where: 'note 5:7 “Fear God instead”'
    claim: 'The Septuagint: there is evil in many dreams and words, but fear God'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/ecclesiastes/5.htm'
    quote: 'For there is evil in a multitude of dreams and vanities and many words: but fear thou God.'

  - where: 'note 5:8 “Officials over officials”'
    claim: 'Modern translations read a chain of officials watching one another'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes%205&version=NRSVUE'
    quote: 'for the high official is watched by a higher, and there are yet higher ones over them. 9 But all things considered, this is an advantage for a land: a king for a plowed field.'
  - where: 'note 5:8 “Officials over officials”'
    claim: 'NIV: one official eyed by a higher; the king profits from the fields'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes%205&version=NIV'
    quote: 'for one official is eyed by a higher one, and over them both are others higher still. 9 The increase from the land is taken by all; the king himself profits from the fields.'
  - where: 'note 5:8 “Officials over officials”'
    claim: 'ESV: a king committed to cultivated fields'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes%205&version=ESV'
    quote: '9 But this is gain for a land in every way: a king committed to cultivated fields.'
  - where: 'note 5:8 “Officials over officials”'
    claim: 'Some interpreters read the chain as officials over officials with God the Most High over them all'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/5.htm'
    quote: 'over him who is high, who oppresses those under him, there stands one who is higher, who in turn oppresses him, and thereby becomes the executor of punishment upon him; and that these, the high and the higher, have over them a Most High, viz., God, who will bring them to an account'
  - where: 'note 5:8 “Officials over officials”'
    claim: 'Delitzsch rejects the reading of God here: the verse explains injustice by the despotic state, the officials watching one another for advantage'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/5.htm'
    quote: 'in Ecclesiastes 5:7 the author seeks to explain the want of legal order from the constitution of a despotic state as distinguished from patriarchal government.'
  - where: 'note 5:8 “Officials over officials”'
    claim: 'The watching is hostile, each waiting to gain advantage over the one above'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/5.htm'
    quote: 'in the sense of hostile watching, as at 1 Samuel 19:11; 2 Samuel 11:16, as B. Bardach understands it: "he watches for the time when he may gain the advantage over him who is high'
  - where: 'note 5:8 “Officials over officials”'
    claim: 'Delitzsch reads 5:9 as praise of a king devoted to the tilled land'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/5.htm'
    quote: '"But the advantage of a country consists always in a king given to the arable land."'

  - where: 'note 5:20 “God answers, or keeps him busy, with joy”'
    claim: 'Modern translations: God keeps him occupied with joy'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes%205&version=NRSVUE'
    quote: 'For they will scarcely brood over the days of their lives because God keeps them occupied with the joy of their hearts.'
  - where: 'note 5:20 “God answers, or keeps him busy, with joy”'
    claim: 'ESV: God keeps him occupied with joy in his heart'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes%205&version=ESV'
    quote: 'For he will not much remember the days of his life because God keeps him occupied with joy in his heart.'
  - where: 'note 5:20 “God answers, or keeps him busy, with joy”'
    claim: 'BDB lists a verb ʿanah “be occupied, busied with,” found only in Ecclesiastes'
    key: bdb
    url: 'https://biblehub.com/hebrew/6031.htm'
    quote: 'II. [עָנָה] verb be occupied, busied with (ב), only Ecclesiastes'
  - where: 'note 5:20 “God answers, or keeps him busy, with joy”'
    claim: 'BDB places 1:13 and 3:10 under the sense “be occupied”'
    key: bdb
    url: 'https://biblehub.com/hebrew/6031.htm'
    quote: 'Qal Infinitive עֲנוֺתִ Ecclesiastes 1:13; Ecclesiastes 3:10.'

  - where: christ
    claim: 'Jesus: lay up treasures in heaven'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/6?lang=eng'
    quote: 'But lay up for yourselves treasures in heaven, where neither moth nor rust doth corrupt, and where thieves do not break through nor steal:'
  - where: christ
    claim: 'The rich fool says eat, drink, and be merry'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/12?lang=eng'
    quote: 'And I will say to my soul, Soul, thou hast much goods laid up for many years; take thine ease, eat, drink, and be merry.'
  - where: 'note 5:1 “Hearing before sacrifice”'
    claim: 'Saul saved animals to sacrifice'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/15?lang=eng'
    quote: 'Saul is commanded to smite and destroy the Amalekites and all that they have—He saves some animals to sacrifice'
  - where: 'note 5:8 “Officials over officials”'
    claim: 'A Most High who punishes is a consolation, not an explanation; that reading would accord with 3:17'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/5.htm'
    quote: 'And that above them both one who is Most High stands, who will punish injustice and avenge it, is a consolatory argument against vexation, but is no explanatory reason of the phenomenon'
  - where: 'note 5:8 “Officials over officials”'
    claim: 'The reading of God accords with 3:17'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/5.htm'
    quote: 'the thought in which Ecclesiastes 5:7 climactically terminates accords essentially with Ecclesiastes 3:17.'
  - where: 'note 5:8 “Officials over officials”'
    claim: 'Verse 9 has puzzled interpreters'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/5.htm'
    quote: 'What impossibilities have been found here, even by the most recent expositors!'
