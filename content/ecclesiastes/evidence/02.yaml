chapter: 2
claims:
- where: "setting"
  claim: "The Preacher's search began at 1:12–13, as king, seeking out by wisdom all that is done under heaven"
  key: "lds-scriptures"
  url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/eccl/1?lang=eng'
  quote: 'And I gave my heart to seek and search out by wisdom concerning all things that are done under heaven'

- where: "setting"
  claim: "Scripture Helps treats chapters 1–2 together as the Preacher's futile efforts to find meaning through worldly means"
  key: "scripture-helps-proverbs"
  url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/35-proverbs-1-4-15-16-22-31-ecclesiastes-1-3-11-12?lang=eng'
  quote: 'Ecclesiastes 1–2: The Preacher states that everything in this life is fleeting and will not last. To support this conclusion, he shares futile efforts he made to find meaning and purpose in life through worldly means.'

- where: "setting"
  claim: "The seminary guide: he sought pleasure, built great works and gained riches, and none of it satisfied him"
  key: "seminary-intro-eccl"
  url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-study-guide-for-home-study-seminary-students-2015/introduction-to-ecclesiastes?lang=eng'
  quote: 'He sought after frivolity and pleasure, built “great works” (Ecclesiastes 2:4), and gained riches, but he found that none of it satisfied him.'

- where: "setting"
  claim: "The Church's footnotes at verses 4 and 8 point to Solomon's buildings and gold in 1 Kings"
  key: "lds-scriptures"
  url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/eccl/2?lang=eng'
  quote: '8a “gold”: 1 Kgs. 9:28; 10:10 (10–14).'

- where: "thread"
  claim: "One older reading of 2:12: no one who comes after the king will reach a different result, so his test stands"
  key: "delitzsch-ecclesiastes"
  url: 'https://biblehub.com/commentaries/kad/ecclesiastes/2.htm'
  quote: 'a king, especially such an one as Solomon was, has in the means at his disposal and in the extent of his observation so much more than everyother, that no one who comes after him will reach a different experience.'

- where: "thread"
  claim: "A modern translation of 2:12: what can the king's successor do? Only what has already been done"
  key: "nrsvue"
  url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+2&version=NRSVUE'
  quote: 'for what can the king’s successor do? Only what has already been done.'

- where: "thread"
  claim: "The chapter's movements: pleasure (1–3), possessions (4–8), the verdict (9–11), wisdom and folly (12–16), hating life (17), labor and the successor (18–23), God's gift (24–26)"
  key: "ot-minute-ecclesiastes"
  url: 'https://scripturecentral.org/archive/books/book-chapter/ecclesiastes-13-1112'
  quote: 'He was anguished over the fact that all his earthly labor would be futile, especially since the credit for his labor would possibly be acquired by his regal successor, who could either be “a wise man or a fool.”'

- where: "thread"
  claim: "Having used his wisdom to weigh his possessions, the Preacher found them vanity (2:9–11)"
  key: "ot-minute-ecclesiastes"
  url: 'https://scripturecentral.org/archive/books/book-chapter/ecclesiastes-13-1112'
  quote: 'He initially found joy in those things. However, having used the wisdom that he had acquired, he considered the value of all his assets. In the end, he only found vanity and displeasure in such worldly things.'

- where: 'note 2:3 “Pleasure tested with wisdom in charge”'
  claim: "“Give myself unto wine” is literally to draw (cheer) my flesh with wine, a late usage"
  key: "bdb"
  url: 'https://biblehub.com/hebrew/4900.htm'
  quote: '7 (late) cheer (draw, attract, gratify) בַּיַּיִן ׳מ אֶתבְּֿשָׂרִי Ecclesiastes 2:3'

- where: 'note 2:3 “Pleasure tested with wisdom in charge”'
  claim: "“Acquainting mine heart with wisdom” is a participle: my heart behaving itself in wisdom"
  key: "bdb"
  url: 'https://biblehub.com/hebrew/5090.htm'
  quote: '2 figurative וְלִבִּי נֹהֵג בַּחָכְמָה Ecclesiastes 2:3 my heart behaving itself in wisdom'

- where: 'note 2:3 “Pleasure tested with wisdom in charge”'
  claim: "A modern translation of 2:1 and 2:3: a test of pleasure; cheer my body with wine, my mind still guiding me with wisdom"
  key: "nrsvue"
  url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+2&version=NRSVUE'
  quote: 'I said to myself, “Come now, I will make a test of pleasure; enjoy yourself.” … I searched with my mind how to cheer my body with wine—my mind still guiding me with wisdom—and how to lay hold on folly'

- where: 'note 2:3 “Pleasure tested with wisdom in charge”'
  claim: "A Latter-day Saint reading: he depended on his own acquired wisdom to guide him in judging what was good"
  key: "ot-minute-ecclesiastes"
  url: 'https://scripturecentral.org/archive/books/book-chapter/ecclesiastes-13-1112'
  quote: 'He depended on the strength of his own acquired wisdom to guide him in comprehending what was good and what was not good for God’s children while in mortality.'

- where: 'note 2:8 “Musical instruments, or something else”'
  claim: "Shiddah veshiddoth: meaning unknown; only in Eccl. 2:8; the Greek read cupbearers"
  key: "bdb"
  url: 'https://biblehub.com/hebrew/7705.htm'
  quote: 'שִׁדָּה noun feminine meaning unknown; — only singular and plural שִׁדָּה וְשִׁדּוֺת Ecclesiastes 2:8, apparently appositive of תַּעֲנגֻוֺת (ᵐ5 οἰνοχόον καὶ οἰνοχόας'

- where: 'note 2:8 “Musical instruments, or something else”'
  claim: "The Greek translation: a butler and female cupbearers"
  key: "lxx-rahlfs"
  url: 'https://biblehub.com/sep/ecclesiastes/2.htm'
  quote: 'I procured me singing men and singing women, and delights of the sons of men, a butler and female cupbearers.'

- where: 'note 2:8 “Musical instruments, or something else”'
  claim: "A modern translation: delights of the flesh, many concubines"
  key: "nrsvue"
  url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+2&version=NRSVUE'
  quote: 'I got singers, both men and women, and delights of the flesh, many concubines.'

- where: 'note 2:14 “One event for the wise and the fool”'
  claim: "Miqreh: accident, chance, fortune; what befalls"
  key: "bdb"
  url: 'https://biblehub.com/hebrew/4745.htm'
  quote: 'מִקְרֶה noun masculine1Samuel 6:9 accident, chance, fortune; — absolute ׳מ 1 Samuel 6:9 +; construct מִקְרֵה Ecclesiastes 2:15'

- where: 'note 2:14 “One event for the wise and the fool”'
  claim: "The KnoWhy: the wise and the unwise all die, so wisdom is vanity in that its benefits are impermanent"
  key: "sc-knowhy-868"
  url: 'https://scripturecentral.org/knowhy/why-does-ecclesiastes-talk-so-much-about-vanity'
  quote: 'In other words, those who are wise and those who are not are all going to die (see verse 16). Thus, in this sense, being wise is “vanity,” because the benefits of being wise are impermanent and sometimes not realized in this life.'

- where: 'note 2:24 “Eating and drinking from the hand of God”'
  claim: "The Preacher calls the same enjoyment the gift of God at 3:13"
  key: "lds-scriptures"
  url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/eccl/3?lang=eng'
  quote: 'And also that every man should eat and drink, and enjoy the good of all his labour, it is the gift of God.'

- where: 'note 2:24 “Eating and drinking from the hand of God”'
  claim: "The verb rendered “hasten” in 2:25 means to feel, enjoy pleasure"
  key: "bdb"
  url: 'https://biblehub.com/hebrew/2363.htm'
  quote: 'Qal Imperfect3masculine singular מִּי יאֹכַל וּמִי יָחוּשׁ Ecclesiastes 2:25 who can eat and who can feel (i.e. enjoy pleasure)?'

- where: 'note 2:24 “Eating and drinking from the hand of God”'
  claim: "Most Hebrew manuscripts read “apart from me”; some Hebrew manuscripts, the Greek and the Syriac “apart from him”"
  key: "esv"
  url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+2&version=ESV'
  quote: 'Ecclesiastes 2:25 Some Hebrew manuscripts, Septuagint, Syriac; most Hebrew manuscripts apart from me'

- where: 'note 2:24 “Eating and drinking from the hand of God”'
  claim: "A modern translation of 2:25: apart from him who can eat or who can have enjoyment?"
  key: "nrsvue"
  url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+2&version=NRSVUE'
  quote: '25 for apart from him who can eat or who can have enjoyment?'

- where: 'note 2:24 “Eating and drinking from the hand of God”'
  claim: "The Greek of 2:25: who shall eat, or who shall drink, without him?"
  key: "lxx-rahlfs"
  url: 'https://biblehub.com/sep/ecclesiastes/2.htm'
  quote: '25For who shall eat, or who shall drink, without him?'

- where: 'note 2:24 “Eating and drinking from the hand of God”'
  claim: "The Church's footnote at 2:24 points to Luke 12:19–21"
  key: "lds-scriptures"
  url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/eccl/2?lang=eng'
  quote: '24a “soul”: Luke 12:19 (19–21).'

- where: 'note 2:24 “Eating and drinking from the hand of God”'
  claim: "A Latter-day Saint reading sets 2:24–26 beside 2 Ne. 2:25: joy comes from virtue and wisdom, not worldly pursuits"
  key: "ot-minute-ecclesiastes"
  url: 'https://scripturecentral.org/archive/books/book-chapter/ecclesiastes-13-1112'
  quote: 'The Preacher was not in total despair about worldly endeavors. From 2 Nephi 2:25 we read, “Men are, that they might have joy.” Joy comes from the pursuit of virtue and wisdom rather than the pursuit of worldly things.'

- where: 'note 2:26 “The sinner’s gathering, and what is vanity”'
  claim: "The Church's footnote at 2:26 points to Prov. 13:22"
  key: "lds-scriptures"
  url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/eccl/2?lang=eng'
  quote: '26a “good”: Prov. 13:22.'

- where: 'note 2:26 “The sinner’s gathering, and what is vanity”'
  claim: "One older reading: the good and the sinner are truly so, not by arbitrary decree; the sinner sins without regarding God; the thought is that of Prov. 13:22"
  key: "delitzsch-ecclesiastes"
  url: 'https://biblehub.com/commentaries/kad/ecclesiastes/2.htm'
  quote: 'the unreasonable thought that good or bad is what God''s arbitrary ordinance and judgment stamp it to be, is wholly foreign to him. … one who sins in the sight of God, i.e., without regarding Him … the thought is the same as that at Proverbs 13:22'

- where: 'note 2:26 “The sinner’s gathering, and what is vanity”'
  claim: "One older reading refers “this also is vanity” to the striving after enjoyment, not to the heaping up or to God's gifts"
  key: "delitzsch-ecclesiastes"
  url: 'https://biblehub.com/commentaries/kad/ecclesiastes/2.htm'
  quote: 'viz., this striving after enjoyment in and of the labour - it is "vain," for the purpose and the issue lie far apart'

- where: 'note 2:26 “The sinner’s gathering, and what is vanity”'
  claim: "A Latter-day Saint reading: the sinner, because of evil deeds, receives only sorrow, which is the vanity of verse 26"
  key: "ot-minute-ecclesiastes"
  url: 'https://scripturecentral.org/archive/books/book-chapter/ecclesiastes-13-1112'
  quote: 'The sinner also has an opportunity to feel joy, but because of their evil deeds, they only receive sorrow, which is of no benefit: “This also is vanity and vexation of spirit” (verse 26).'

- where: "christ"
  claim: "Paul on hope in this life only, and Christ risen; in Christ all made alive"
  key: "lds-scriptures"
  url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-cor/15?lang=eng'
  quote: 'If in this life only we have hope in Christ, we are of all men most miserable.'

- where: "christ"
  claim: "The Savior came that they might have life more abundantly"
  key: "lds-scriptures"
  url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/10?lang=eng'
  quote: 'I am come that they might have life, and that they might have it more abundantly.'

- where: "explore"
  claim: "The rich man's barns, the passage the footnote at 2:24 points to"
  key: "lds-scriptures"
  url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/12?lang=eng'
  quote: 'So is he that layeth up treasure for himself, and is not rich toward God.'

- where: "setting"
  claim: "The footnote at verse 4 points to Solomon's buildings in 1 Kgs. 7:1–12"
  key: "lds-scriptures"
  url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/eccl/2?lang=eng'
  quote: '4a “builded”: 1 Kgs. 7:1 (1–12).'
