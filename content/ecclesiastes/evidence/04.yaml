chapter: 4
claims:
  - where: setting
    claim: 'The observation of 4:1 is different from that of 3:16, though related to it'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/4.htm'
    quote: 'Incorrectly Hahn: And anew I saw, - the observation is different from that of Ecclesiastes 3:16, though cognate.'
  - where: setting
    claim: 'Scripture Helps: in chapters 3–10 the Preacher shows through many examples that worldly wealth does not last and frustration is unavoidable'
    key: scripture-helps-proverbs
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/35-proverbs-1-4-15-16-22-31-ecclesiastes-1-3-11-12?lang=eng'
    quote: 'Ecclesiastes 3–10: The Preacher explains through many examples that worldly wealth does not last, and frustration in this life is unavoidable.'
  - where: setting
    claim: 'The seminary guide: in chapters 4–8 the Preacher names what leads to an unfulfilled life, including oppressing others and gathering wealth to have more than another'
    key: seminary-intro-eccl
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-study-guide-for-home-study-seminary-students-2015/introduction-to-ecclesiastes?lang=eng'
    quote: 'He also identifies things that will surely lead to an unfulfilled life, including oppressing others, accumulating wealth for no other purpose than to have more than another, and failing to seek wisdom.'
  - where: setting
    claim: 'One older reading: the section 1:12–4:16 ends here, and the narrative gives way to a series of proverbs'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/4.htm'
    quote: 'The section Ecclesiastes 1:12-4:16, to which we have prefixed the superscription, "Koheleth''s Experiences and their Results," has now reached its termination'
  - where: setting
    claim: 'Narrative sections end in series of proverbs in which the preacher''s “I” retires'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/4.htm'
    quote: 'the narrative sections, in which Koheleth, on the ground of his own experiences and observations, registers the vanities of earthly life, terminate in series of proverbs in which the I of the preacher retires behind the objectivity of the exhortations'

  - where: thread
    claim: 'After the lone man of 4:8, the Preacher goes on to show the value of companionship'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/4.htm'
    quote: 'he now proceeds to show the value of companionship and the miseries of isolation'

  - where: 'section 2 plain'
    claim: 'All toil and skill come from one person''s envy of another'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+4&version=NRSVUE'
    quote: 'Then I saw that all toil and all skill in work come from one person’s envy of another.'
  - where: 'section 3 plain'
    claim: '“Bereave my soul of good” means deprive myself'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/eccl/4?lang=eng'
    quote: '“bereave my soul”: OR deprive myself.'
  - where: 'section 4 plain'
    claim: 'The youth was born poor in the kingdom'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+4&version=NRSVUE'
    quote: 'One can indeed come out of prison to reign, even though born poor in the kingdom.'
  - where: 'section 4 plain'
    claim: 'All the living follow the youth who replaced the king; there was no end of those he led'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+4&version=NRSVUE'
    quote: 'I saw all the living who, moving about under the sun, follow that youth who replaced the king; 16 there was no end to all those people whom he led.'

  - where: 'note 4:4 “Skill born of rivalry”'
    claim: 'Kishron means skill, success; “all skill of work” is skilful work'
    key: bdb
    url: 'https://biblehub.com/hebrew/3788.htm'
    quote: 'כִּשְׁרוֺן noun [masculine] skill, success; — … construct כָּלכִּֿשְׁרוֺן הַמַּעֲשֶׂה Ecclesiastes 4:4 all skill of work = skilful work.'
  - where: 'note 4:4 “Skill born of rivalry”'
    claim: 'Qin''ah, jealousy, is used at 4:4 of rivalry'
    key: bdb
    url: 'https://biblehub.com/hebrew/7068.htm'
    quote: 'of rivalry Ecclesiastes 4:4; Ecclesiastes 9:6'
  - where: 'note 4:4 “Skill born of rivalry”'
    claim: 'A modern translation: all toil and skill come from envy of another'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+4&version=NRSVUE'
    quote: 'Then I saw that all toil and all skill in work come from one person’s envy of another.'
  - where: 'note 4:5 “Folded hands and full fists”'
    claim: 'One older reading: the folded hands are those of Prov. 6:10; the idle man feeds on his own flesh and wastes away; indolence is self-destruction'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/4.htm'
    quote: 'indolence is self-destruction: … He layeth his hands together (Proverbs 6:10-24:33), … for instead of nourishing himself by the labour of his hands, he feeds on his own flesh, and thus wasteth away.'
  - where: 'note 4:5 “Folded hands and full fists”'
    claim: 'The same reading: verse 6 stands in contrast to verse 5, and “quietness” is not the rest of sloth but rest from labour that robs a man of himself'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/4.htm'
    quote: 'נחת signifies here, as little as it does anywhere else, the rest of sloth; but rest, in contrast to such activity in labour as robs a man of himself, to the hunting after gain and honour which never has enough'
  - where: 'note 4:5 “Folded hands and full fists”'
    claim: 'The Church''s footnote at “handful” points to Prov. 15:16'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/eccl/4?lang=eng'
    quote: '“handful”: Prov. 15:16.'

  - where: 'note 4:12 “The threefold cord”'
    claim: 'The Church''s footnote at “Two” (4:9) points to Moses 3:24'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/eccl/4?lang=eng'
    quote: '“Two”: Moses 3:24.'
  - where: 'note 4:12 “The threefold cord”'
    claim: 'A Latter-day Saint reading: the threefold cord teaches marriage as husband, wife and God woven together'
    key: richardson-ephesians
    url: 'https://rsc.byu.edu/go-ye-all-world/ephesians-unfolding-mysteries-through-revelation'
    quote: 'God’s form of marriage is succinctly taught in the metaphor of “a threefold cord” (Ecclesiastes 4:12). By weaving a husband, wife, and God together like a traditional hemp cord (rope), a couple receives power that goes beyond their abilities'

  - where: 'note 4:2 “Better the dead, and better the unborn”'
    claim: 'What the Preacher says is read in the light of his final conclusion in 12:13–14, that God will judge every work'
    key: seminary-intro-eccl
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-study-guide-for-home-study-seminary-students-2015/introduction-to-ecclesiastes?lang=eng'
    quote: 'although the preacher is a believer, he often poses questions and makes statements as if he were not. Everything that he says, therefore, must be taken in context of his final conclusion in Ecclesiastes 12:13–14 that all of our works in this life will one day be judged by God.'

  - where: 'note 4:13 “The king who stopped learning”'
    claim: 'The verb is passive, be instructed, admonished, warned; 4:13 means one who knows not how to take admonition'
    key: bdb
    url: 'https://biblehub.com/hebrew/2094.htm'
    quote: 'Infinitive construct לְהִזָּהֵר Ecclesiastes 4:13 … be instructed, admonished, warned (passive of Hiph`il) … אֲשֶׁר לֹא יָדַע לְהִזָּהֵר Ecclesiastes 4:13 who knoweth not how to take admonition'
  - where: 'note 4:13 “The king who stopped learning”'
    claim: 'A modern translation: who will no longer take advice'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+4&version=NRSVUE'
    quote: 'Better is a poor but wise youth than an old but foolish king who will no longer take advice.'
  - where: 'note 4:13 “The king who stopped learning”'
    claim: 'Brigham Young quoted 4:13 and spoke of converts who grew and then stopped growing'
    key: ot-manual-proverbs
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-2?lang=eng'
    quote: 'President Brigham Young quoted Ecclesiastes 4:13 … They improved, their minds expanded … But some of them, when they had gained a little spiritual strength and knowledge, apparently stopped in their growth. … Like the fruit-trees, they have ceased to grow and increase and bear the fruits of the Spirit.'

  - where: 'note 4:14 “The youth from prison”'
    claim: 'One older reading: the clause cannot mean “become poor”; the youth was born poor'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/4.htm'
    quote: 'נולד רש cannot mean "to become poor."'
  - where: 'note 4:14 “The youth from prison”'
    claim: 'A modern translation: born poor in the kingdom'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+4&version=NRSVUE'
    quote: 'One can indeed come out of prison to reign, even though born poor in the kingdom.'
  - where: 'note 4:14 “The youth from prison”'
    claim: 'The “second” is the youth, second on the throne after the king reckoned first'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/4.htm'
    quote: 'Hence השׁני is not the youth as second son of his father, but as second on the throne, in relation to the dethroned king reckoned as the first.'
  - where: 'note 4:14 “The youth from prison”'
    claim: 'A modern translation: the child is a youth'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+4&version=NRSVUE'
    quote: 'Better is a poor but wise youth than an old but foolish king'
  - where: 'note 4:14 “The youth from prison”'
    claim: 'A modern translation: all the living follow the youth who replaced the king'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+4&version=NRSVUE'
    quote: 'I saw all the living who, moving about under the sun, follow that youth who replaced the king'
  - where: 'note 4:14 “The youth from prison”'
    claim: 'Interpreters proposed historical figures, Jeroboam and Antiochus the Great among them'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/4.htm'
    quote: 'In his Comm., Hitz. guesses first of Jeroboam … Bttcher regards Antiochus the Great as the original of the ילד.'
  - where: 'note 4:14 “The youth from prison”'
    claim: 'The same reading finds the case for Antiochus stands on a feeble foundation'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/4.htm'
    quote: 'Thus, far from making it probable that the Book of Koheleth originated in the time of the Diadochs, this combination of Bttcher''s also stands on a feeble foundation, and falls in ruins when assailed.'
  - where: 'note 4:14 “The youth from prison”'
    claim: 'The older reading takes the point as the Preacher''s: the hopes placed in the young king proved delusions, confirming that all under the sun is vain'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/4.htm'
    quote: 'the hopes which his contemporaries placed in the young king, who had seized the throne and conquered their hearts, afterwards proved to be delusions; and also this history, at first so beautiful, and afterwards so hateful, contributed finally to the confirmation of the truth, that all under the sun is vain.'
