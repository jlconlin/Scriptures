chapter: 10
claims:
  - where: setting
    claim: 'The Church’s footnote at 10:1 points back to Eccl. 9:18 (and to Josh. 7)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/eccl/10?lang=eng'
    quote: 'Josh. 7:11 (1, 11–12); Eccl. 9:18.'
  - where: setting
    claim: 'The Student Manual calls chapter 10 primarily a collection of proverbs, differing little from Proverbs apart from their pessimism'
    key: ot-manual-proverbs
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-2?lang=eng'
    quote: 'This chapter is primarily a collection of proverbs. The unifying theme seems to be that without God life is vanity without purpose. Aside from their pessimistic outlook, these proverbs differ little from those in the book of Proverbs.'
  - where: setting
    claim: 'Scripture Helps groups chapters 3–10: worldly wealth does not last and frustration is unavoidable'
    key: scripture-helps-proverbs
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/35-proverbs-1-4-15-16-22-31-ecclesiastes-1-3-11-12?lang=eng'
    quote: 'Ecclesiastes 3–10: The Preacher explains through many examples that worldly wealth does not last, and frustration in this life is unavoidable.'
  - where: setting
    claim: 'The seminary guide reads chapters 9–10 together: wisdom is worth more than riches or power'
    key: seminary-intro-eccl
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-study-guide-for-home-study-seminary-students-2015/introduction-to-ecclesiastes?lang=eng'
    quote: 'Ecclesiastes 9–10. The preacher asserts that both the wicked and the righteous will experience tragedy. Everyone has a limited amount of time on this earth and will benefit much more from gaining wisdom than from gaining riches or power.'

  - where: section 1 plain
    claim: 'A little folly outweighs wisdom and honor; the fool shows everyone that he is a fool'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes%2010&version=NRSVUE'
    quote: 'so a little folly outweighs wisdom and honor. 2 The heart of the wise inclines to the right, but the heart of a fool to the left. 3 Even when fools walk on the road, they lack sense and show to everyone that they are fools.'
  - where: section 2 plain
    claim: 'Do not leave your post; calmness lays great offenses to rest'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes%2010&version=NIV'
    quote: 'If a ruler’s anger rises against you, do not leave your post; calmness can lay great offenses to rest.'
  - where: section 3 plain
    claim: 'Breaking through a wall; splitting logs; wisdom helps one to succeed'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes%2010&version=ESV'
    quote: 'and (K)a serpent will bite him who breaks through a wall. 9 (L)He who quarries stones is hurt by them, and he who (M)splits logs is endangered by them. 10 If the iron is blunt, and one does not sharpen the edge, he must use more strength, but wisdom helps one to succeed.'
  - where: section 3 plain
    claim: 'If the snake bites before it is charmed, there is no advantage in a charmer'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes%2010&version=NRSVUE'
    quote: 'If the snake bites before it is charmed, there is no advantage in a charmer.'
  - where: section 4 plain
    claim: 'The words of a wise man’s mouth win him favor (or are gracious)'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes%2010&version=ESV'
    quote: '12 The words of a wise man''s mouth (O)win him favor, but (P)the lips of a fool consume him.'
  - where: section 4 plain
    claim: 'Fools talk on and on; they do not even know the way to town'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes%2010&version=NRSVUE'
    quote: '14 yet fools talk on and on. No one knows what is to happen, and who can tell anyone what the future holds? 15 The toil of fools wears them out, for they do not even know the way to town.'
  - where: section 5 plain
    claim: 'Through sloth the roof sinks in and the house leaks; money meets every need'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes%2010&version=NRSVUE'
    quote: '18 Through sloth the roof sinks in, and through indolence the house leaks.(K) 19 Feasts are made for laughter, wine gladdens life, and money meets every need.'

  - where: 'note 10:1 “A little folly outweighs wisdom”'
    claim: 'Modern translations read the second line as a weighing: a little folly outweighs wisdom and honor'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes%2010&version=NRSVUE'
    quote: '10 Dead flies make the perfumer’s ointment give off a foul odor; so a little folly outweighs wisdom and honor.'
  - where: 'note 10:1 “A little folly outweighs wisdom”'
    claim: 'The ESV reads the same'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes%2010&version=ESV'
    quote: 'Dead flies make (A)the perfumer''s ointment give off a stench; so a little folly outweighs wisdom and honor.'

  - where: 'note 10:2 “The right hand and the left”'
    claim: 'Modern translations read the heart as inclining to the right or the left'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes%2010&version=NRSVUE'
    quote: '2 The heart of the wise inclines to the right, but the heart of a fool to the left.'
  - where: 'note 10:2 “The right hand and the left”'
    claim: 'The right is a figure for what is right, the left for what is wrong; the right is where calling and duty point'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/10.htm'
    quote: 'and that which is situated to the right of a man is figuratively a designation of the right; and that to the left, a designation of the wrong. … that which lies to the right, as that lying at a man''s right hand, is that to which his calling and duty point him'
  - where: 'note 10:2 “The right hand and the left”'
    claim: 'In verse 3 the fool shows everyone how foolish he is'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes%2010&version=NIV'
    quote: '3 Even as fools walk along the road, they lack sense and show everyone(B) how stupid they are.'

  - where: 'note 10:4 “Yielding, or calmness”'
    claim: 'The word is marpe’, healing, cure, health; at this verse, composure'
    key: bdb
    url: 'https://biblehub.com/hebrew/4832.htm'
    quote: 'noun masculineEcclesiastes 10:4 healing, cure, health (usually figurative)'
  - where: 'note 10:4 “Yielding, or calmness”'
    claim: 'BDB: alone it means composure at Eccl. 10:4; the healing tongue of Prov. 15:4 is a soothing tongue; Prov. 12:18 has it as health'
    key: bdb
    url: 'https://biblehub.com/hebrew/4832.htm'
    quote: '2 figurative of person, health, profit, Proverbs 4:22 ("" חַיִּים), Proverbs 12:18; … compare ׳מ alone = composure Ecclesiastes 10:4; לְשׁוֺן ׳מ Eccl 15:4 healing of the tongue, = a soothing tongue (Toy).'
  - where: 'note 10:4 “Yielding, or calmness”'
    claim: 'The ESV notes that the Hebrew is “healing” and translates “calmness”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes%2010&version=ESV'
    quote: 'Ecclesiastes 10:4 Hebrew healing'
  - where: 'note 10:4 “Yielding, or calmness”'
    claim: 'Calmness will undo great offenses; do not leave your post'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes%2010&version=NRSVUE'
    quote: '4 If the anger of the ruler rises against you, do not leave your post, for calmness will undo great offenses.'
  - where: 'note 10:4 “Yielding, or calmness”'
    claim: 'Calmness can lay great offenses to rest'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes%2010&version=NIV'
    quote: 'calmness can lay great offenses to rest.'

  - where: 'note 10:11 “The babbler is the charmer”'
    claim: 'The word for “enchantment” means whispering, charming; here serpent-charming'
    key: bdb
    url: 'https://biblehub.com/hebrew/3908.htm'
    quote: 'לַ֫חַשׁ noun [masculine] a whispering, charming … 1 serpent-charming Ecclesiastes 10:11'
  - where: 'note 10:11 “The babbler is the charmer”'
    claim: 'The “babbler” is ba’al hallashon, a phrase on the word for tongue, used of the serpent-charmer'
    key: bdb
    url: 'https://biblehub.com/hebrew/3956.htm'
    quote: 'also ׳בַּעַל הַלּ Ecclesiastes 10:11 (of serpent-charmer)'
  - where: 'note 10:11 “The babbler is the charmer”'
    claim: 'BDB glosses the phrase “charmer”'
    key: bdb
    url: 'https://biblehub.com/hebrew/1167.htm'
    quote: 'הלשׁון ׳ב charmer Ecclesiastes 10:11'
  - where: 'note 10:11 “The babbler is the charmer”'
    claim: 'Modern translation: if the snake bites before it is charmed, there is no advantage in a charmer'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes%2010&version=NRSVUE'
    quote: '11 If the snake bites before it is charmed, there is no advantage in a charmer.'
  - where: 'note 10:11 “The babbler is the charmer”'
    claim: 'Another: the charmer receives no fee'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes%2010&version=NIV'
    quote: '11 If a snake bites before it is charmed, the charmer receives no fee.'

  - where: 'note 10:16 “When thy king is a child”'
    claim: 'The Church’s footnote at “child” points to Isa. 3:4 (4–5, 12)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/eccl/10?lang=eng'
    quote: 'Isa. 3:4 (4–5, 12).'
  - where: 'note 10:16 “When thy king is a child”'
    claim: 'Isaiah: children as princes, children as oppressors, in Judah’s judgment'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/3?lang=eng'
    quote: 'And I will give children to be their princes, and babes shall rule over them.'
  - where: 'note 10:16 “When thy king is a child”'
    claim: 'One modern translation reads “servant,” with “child” in its footnote'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes%2010&version=NIV'
    quote: '16 Woe to the land whose king was a servant(O) and whose princes feast in the morning. … Ecclesiastes 10:16 Or king is a child'
  - where: 'note 10:16 “When thy king is a child”'
    claim: 'Others keep “child”; the princes of verse 17 feast at the proper time'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes%2010&version=NRSVUE'
    quote: '16 Alas for you, O land, when your king is a child and your princes feast in the morning!(I) 17 Happy are you, O land, when your king is a nobleman, and your princes feast at the proper time— for strength and not for drunkenness!'

  - where: 'note 10:19 “Money answereth all things”'
    claim: 'Modern translations: money meets every need / answers everything / is the answer for everything'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes%2010&version=NRSVUE'
    quote: '19 Feasts are made for laughter, wine gladdens life, and money meets every need.'
  - where: 'note 10:19 “Money answereth all things”'
    claim: 'ESV: money answers everything'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes%2010&version=ESV'
    quote: '19 Bread is made for laughter, and (V)wine gladdens life, and (W)money answers everything.'
  - where: 'note 10:19 “Money answereth all things”'
    claim: 'NIV: money is the answer for everything'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes%2010&version=NIV'
    quote: 'and money is the answer for everything.'
  - where: 'note 10:19 “Money answereth all things”'
    claim: 'One older reading: wicked princes like those of 10:16 are thought of, though not directly as the subject'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/10.htm'
    quote: 'By עשׂים, wicked princes are without doubt thought of-but not immediately'
  - where: 'note 10:19 “Money answereth all things”'
    claim: 'The laughter is that which 2:2 calls mad'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/10.htm'
    quote: 'שׂחוק is laughter, as that to which he utters the sentence (Ecclesiastes 2:2): Thou art mad.'
  - where: 'note 10:19 “Money answereth all things”'
    claim: 'Duty-forgetting idlers who need wine to cheer their life'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/10.htm'
    quote: 'but here the subject of discourse is duty-forgetting idlers, to whom chiefly wine must be brought (Isaiah 5:12) to cheer their life'
  - where: 'note 10:19 “Money answereth all things”'
    claim: 'They can feast because they have money; the older reading prefers Jerome’s rendering, unto money are all things obedient'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/10.htm'
    quote: 'And they can feast and drink, for they have money … better thus, after Jerome, the'
  - where: 'note 10:19 “Money answereth all things”'
    claim: 'The rendering the older reading prefers'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/10.htm'
    quote: 'unto money are all things obedient.'

  - where: 'note 10:20 “A bird of the air”'
    claim: 'The proverb makes the same point as “walls have ears”'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/10.htm'
    quote: 'As to its meaning, it is the same as the proverb quoted by the Midrash: "walls have ears."'
  - where: 'note 10:20 “A bird of the air”'
    claim: 'The bedchamber is the innermost room, where one thinks oneself safe (2 Kgs. 6:12)'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/10.htm'
    quote: 'in his bed-chamber, the innermost room of the house, where one thinks himself free from treachery, and thus may utter whatever he thinks without concealment (2 Kings 6:12)'
  - where: 'note 10:20 “A bird of the air”'
    claim: 'The warning rests on prudence and also, after 8:2, on religion'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/10.htm'
    quote: 'there is now a warning given which has for its motive not only prudence, but also, according to Ecclesiastes 8:2, religiousness.'
  - where: 'note 10:20 “A bird of the air”'
    claim: 'The Septuagint renders “thought” as conscience'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/ecclesiastes/10.htm'
    quote: '20Even in thy conscience, curse not the king; and curse not the rich in thy bedchamber'
  - where: 'note 10:20 “A bird of the air”'
    claim: 'Elisha tells the king of Israel the words spoken in the bedchamber of the king of Syria'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/6?lang=eng'
    quote: 'but Elisha, the prophet that is in Israel, telleth the king of Israel the words that thou speakest in thy bedchamber.'

  - where: christ
    claim: 'At Nazareth all wondered at the gracious words from Jesus’ mouth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/4?lang=eng'
    quote: 'And all bare him witness, and wondered at the gracious words which proceeded out of his mouth.'
  - where: christ
    claim: 'Every idle word will be accounted for at the judgment'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/12?lang=eng'
    quote: 'But I say unto you, That every idle word that men shall speak, they shall give account thereof in the day of judgment.'
