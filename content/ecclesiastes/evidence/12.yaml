    url: 'https://scripturecentral.org/knowhy/why-does-ecclesiastes-talk-so-much-about-vanity'
    quote: 'According to the preacher, obeying God is the right thing to do, and God will balance things accordingly at final judgement, whether things work out in this life or not.'

