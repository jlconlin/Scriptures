chapter: 12
claims:
  # setting
  - where: setting
    claim: '12:1–7 are the Teacher’s closing words, on old age and the grave, after the encouragement to enjoy youth in 11:9–10'
    key: pike-spirit-eccl
    url: 'https://rsc.byu.edu/let-us-reason-together/spirit-returns-god-ecclesiastes-127'
    quote: 'including the encouragement to enjoy life, especially in one’s youth (11:9–10), the closing words from the Teacher, in Ecclesiastes 12:1–7, emphasize the long, dark days of misery encountered in old age and the inevitability of the grave.'
  - where: setting
    claim: 'What follows in 12:8–14 is not presented as the Teacher’s words'
    key: pike-spirit-eccl
    url: 'https://rsc.byu.edu/let-us-reason-together/spirit-returns-god-ecclesiastes-127'
    quote: 'What follows in 12:8–14 is not presented as the Teacher’s words.'
  - where: setting
    claim: 'The Bible Dictionary: chapters 11–12 are the most spiritual part of the book; obedience is of lasting value since all will be judged'
    key: bd-ecclesiastes
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ecclesiastes?lang=eng'
    quote: 'The most spiritual part of the book appears in chapters 11 and 12, where it is concluded that the only activity of lasting and permanent value comes from obedience to God’s commandments, since all things will be examined in the judgment that God will render on man.'
  - where: setting
    claim: 'Scripture Helps on chapters 11–12: obedience is of lasting importance because we will die and God will judge'
    key: scripture-helps-proverbs
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/35-proverbs-1-4-15-16-22-31-ecclesiastes-1-3-11-12?lang=eng'
    quote: 'He concludes that obedience to God’s commandments is of lasting importance because one day we will die and God will judge us according to the way we lived.'

  # thread
  - where: thread
    claim: 'A modern translation renders verses 1, 2 and 6 each with “before”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+12&version=NRSVUE'
    quote: '12 Remember your creator in the days of your youth, before the days of trouble come … 2 before the sun and the light and the moon and the stars are darkened … 6 before the silver cord is snapped'

  # section plains
  - where: section 2 plain
    claim: 'The Hebrew of “long home” is “his everlasting house” (beth ʿolamo)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Eccl.xml'
    quote: 'עוֹלָמ֔/וֹ'
  - where: section 2 plain
    claim: 'A modern translation: “all must go to their eternal home”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+12&version=NRSVUE'
    quote: 'because all must go to their eternal home, and the mourners will go about the streets'
  - where: section 5 plain
    claim: 'The Hebrew of “acceptable words” is “words of delight”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/eccl/12?lang=eng'
    quote: '10a “acceptable words”: HEB words of delight.'
  - where: section 5 plain
    claim: 'A modern translation: “like nails firmly fixed are the collected sayings”; “Of anything beyond these, my child, beware”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+12&version=NRSVUE'
    quote: '11 The sayings of the wise are like goads, and like nails firmly fixed are the collected sayings that are given by one shepherd.(F) 12 Of anything beyond these, my child, beware.'
  - where: section 6 plain
    claim: 'A modern translation: “that is the whole duty of everyone”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+12&version=NRSVUE'
    quote: 'Fear God, and keep his commandments, for that is the whole duty of everyone.'

  # note 12:1
  - where: 'note 12:1 “Remember before”'
    claim: 'Verses 1, 2 and 6 each open with ʿad asher lo (“until … not,” before)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Eccl.xml'
    quote: 'עַ֣ד'
  - where: 'note 12:1 “Remember before”'
    claim: 'A modern translation renders all three “before”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+12&version=NRSVUE'
    quote: 'before the days of trouble come and the years draw near when you will say, “I have no pleasure in them”; 2 before the sun and the light and the moon and the stars are darkened'
  - where: 'note 12:1 “Remember before”'
    claim: 'The closing words of 12:1–7 emphasize the misery of old age and the grave; “no pleasure” (12:1) belongs to old age'
    key: pike-spirit-eccl
    url: 'https://rsc.byu.edu/let-us-reason-together/spirit-returns-god-ecclesiastes-127'
    quote: 'The finality of this termination comes after the lamentable burdens of those who live to older age, in which there is “no pleasure” (12:1).'
  - where: 'note 12:1 “Remember before”'
    claim: 'A Latter-day Saint reading: chapter 12 continues 11:9’s counsel to the young to find joy before old age takes over'
    key: ot-minute-ecclesiastes
    url: 'https://scripturecentral.org/archive/books/book-chapter/ecclesiastes-13-1112'
    quote: 'At the end of chapter 11, the Preacher encouraged the youth to be happy. In this chapter, he continued with that wisdom and counseled youth to find pleasure in that stage of life—before old age takes over'

  # note 12:3
  - where: 'note 12:3 “The house of an old man”'
    claim: 'A Latter-day Saint reading: analogies of being elderly; senses dimmed, strong men bowed, teeth lost, long home as death'
    key: ot-minute-ecclesiastes
    url: 'https://scripturecentral.org/archive/books/book-chapter/ecclesiastes-13-1112'
    quote: 'The Preacher went on to give several analogies of being elderly: potentially senses would be dimmed (“darkened”), strong men would become bowed over, some would lose their teeth (“grinders”), opportunities would be lost (“doors shall be shut”)'
  - where: 'note 12:3 “The house of an old man”'
    claim: 'Verse 2: the darkening of mind and senses, the winter of life'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/12.htm'
    quote: 'Ere the mind and the senses begin to be darkened, and the winter of life with its clouds and storms approaches'
  - where: 'note 12:3 “The house of an old man”'
    claim: 'The body as the house of the inner man, in ruin in old age; the keepers are the arms and hands'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/12.htm'
    quote: 'The most common biblical figures of the relation of the spirit or the soul to the body is … that of the body as of the house of the inner man. This house, as that of an old man, is on all sides in a ruinous condition. The shomrē habbayith are the arms terminating in the hands'
  - where: 'note 12:3 “The house of an old man”'
    claim: 'The Targum (following the Midrash) reads the keepers, strong men, grinders and window-watchers as knees, arms, teeth and eyes; these are mostly correct'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/12.htm'
    quote: 'Here also the Targ. principally follows the Midrash: it translates the watchers of the house by "thy knees;" strong men by "thine arms;" the women at the mill by "the teeth of thy mouth;" the women who look out at the window by "thine eyes." These interpretations for the most part are correct'
  - where: 'note 12:3 “The house of an old man”'
    claim: 'The strong men are the legs; the grinders are the teeth'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/12.htm'
    quote: 'Anshē hěhhayil designates the legs … To maidens who grind … the corn by means of a hand-mill are compared the teeth'
  - where: 'note 12:3 “The house of an old man”'
    claim: 'The almond blossom is an emblem of old age’s white hair'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/12.htm'
    quote: 'which strews the ground with its blossoms, which have gradually become white like snow-flakes, is an emblem of the winter of old age with its falling silvery hair.'
  - where: 'note 12:3 “The house of an old man”'
    claim: 'The grasshopper that becomes a burden: the failing strength of the thighs'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/12.htm'
    quote: 'the allegory now proceeds to the impairing of the elasticity of the highs and of their power of bearing a load'
  - where: 'note 12:3 “The house of an old man”'
    claim: '“Everlasting house” is a name for the grave'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/12.htm'
    quote: '"Everlasting house" is the name for the grave of the dead'
  - where: 'note 12:3 “The house of an old man”'
    claim: 'The Hebrew of “long home” is “his everlasting house”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Eccl.xml'
    quote: 'עוֹלָמ֔/וֹ'
  - where: 'note 12:3 “The house of an old man”'
    claim: 'A modern translation: “eternal home”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+12&version=NRSVUE'
    quote: 'because all must go to their eternal home'
  - where: 'note 12:3 “The house of an old man”'
    claim: 'A Latter-day Saint scholar glosses the long home as the grave'
    key: pike-spirit-eccl
    url: 'https://rsc.byu.edu/let-us-reason-together/spirit-returns-god-ecclesiastes-127'
    quote: '“man goeth to his long home [the grave], and the mourners go about the streets” (12:5)'
  - where: 'note 12:3 “The house of an old man”'
    claim: 'A Latter-day Saint reading of verse 6: vessels that hold water break and water is spilled, a symbol of life, with 2 Sam. 14:14'
    key: ot-minute-ecclesiastes
    url: 'https://scripturecentral.org/archive/books/book-chapter/ecclesiastes-13-1112'
    quote: 'In verse 6, the Preacher compared death to a broken bowl, pitcher, and cistern. All these objects hold water and when they break, water is spilled. Water is often seen as a symbol of life in the scriptures.'
  - where: 'note 12:3 “The house of an old man”'
    claim: 'An older reading of verse 6: the silver cord is the soul, the lamp hanging by it the body'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/12.htm'
    quote: '"The silver cord equals the soul directing and bearing the body as living; the lamp hanging by this silver cord equals the body animated by the soul, and dependent on it'
  - where: 'note 12:3 “The house of an old man”'
    claim: 'On the same reading the pitcher at the fountain is the heart'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/12.htm'
    quote: 'the pitcher at the fountain or well … is without doubt the heart which beats to the last breath of the dying man'
  - where: 'note 12:3 “The house of an old man”'
    claim: 'Verses 6–7 picture the dissolution of the body and the separation of soul and body'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/12.htm'
    quote: 'the third brings to view the dissolution of the life of the body, by which the separation of the soul and the body, and the return of both to their original condition is completed.'

  # note 12:7
  - where: 'note 12:7 “The spirit returns to God”'
    claim: 'The chapter heading: at death the spirit returns to God; the footnotes list the verse under the antemortal existence of man and man a spirit child of Heavenly Father'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/eccl/12?lang=eng'
    quote: 'At death the spirit will return to God who gave it'
  - where: 'note 12:7 “The spirit returns to God”'
    claim: 'The Topical Guide lists 12:7 under man as a spirit child of Heavenly Father, and the Guide to the Scriptures under premortal life'
    key: pike-spirit-eccl
    url: 'https://rsc.byu.edu/let-us-reason-together/spirit-returns-god-ecclesiastes-127'
    quote: 'the Topical Guide cites Ecclesiastes 12:7 among other scriptures under the entry “Man, a Spirit Child of Heavenly Father.” Likewise, 12:7 is cited under the entry “Premortal Life” in Guide to the Scriptures.'
  - where: 'note 12:7 “The spirit returns to God”'
    claim: 'President Lee quoted 12:7 and reasoned that we could not return to a place we had never been'
    key: lee-understanding-who-we-are
    url: 'https://www.churchofjesuschrist.org/study/ensign/1974/01/understanding-who-we-are-brings-self-respect?lang=eng'
    quote: 'Obviously we could not return to a place where we had never been, so we are talking about death as a process as miraculous as birth, by which we return to “our Father who art in heaven,”'
  - where: 'note 12:7 “The spirit returns to God”'
    claim: 'President Lee’s address was given at general conference, October 5, 1973'
    key: lee-understanding-who-we-are
    url: 'https://www.churchofjesuschrist.org/study/ensign/1974/01/understanding-who-we-are-brings-self-respect?lang=eng'
    quote: 'Address delivered at the Friday morning session, October 5, 1973'
  - where: 'note 12:7 “The spirit returns to God”'
    claim: 'The seminary guide: chapters 11–12 teach that our spirits will return to God and He will judge us'
    key: seminary-intro-eccl
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-study-guide-for-home-study-seminary-students-2015/introduction-to-ecclesiastes?lang=eng'
    quote: 'obedience to God’s commandments is of lasting importance because one day we will die, our spirits will return to God, and He will judge us according to the way we lived during our mortal lives.'
  - where: 'note 12:7 “The spirit returns to God”'
    claim: 'A Latter-day Saint devotional reading: at the end of the book the Preacher acknowledged that our spirits live on and return to God'
    key: ot-minute-ecclesiastes
    url: 'https://scripturecentral.org/archive/books/book-chapter/ecclesiastes-13-1112'
    quote: 'at the end of the book, the Preacher acknowledged that our spirits would live on and return to God.'
  - where: 'note 12:7 “The spirit returns to God”'
    claim: 'The word for spirit in 12:7 is ruach'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Eccl.xml'
    quote: 'וְ/הָ/ר֣וּחַ'
  - where: 'note 12:7 “The spirit returns to God”'
    claim: 'A modern translation: “the breath returns to God who gave it”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+12&version=NRSVUE'
    quote: 'and the dust returns to the earth as it was, and the breath returns to God who gave it.'
  - where: 'note 12:7 “The spirit returns to God”'
    claim: 'Pike: ruach rarely designates a spirit being in the Old Testament; in 3:21 and 12:7 it accords with the breath of life in Genesis'
    key: pike-spirit-eccl
    url: 'https://rsc.byu.edu/let-us-reason-together/spirit-returns-god-ecclesiastes-127'
    quote: 'It rarely occurs therein to designate a spirit being or personage. The occurrence of rûaḥ in Ecclesiastes 3:21 and 12:7 … appears in harmony with statements in Genesis 2:7 (with nĕšāmâ) and 6:17; 7:15, 22.'
  - where: 'note 12:7 “The spirit returns to God”'
    claim: 'Pike: the singular ruach in these passages differs from the plural “spirits” of Alma 40:11'
    key: pike-spirit-eccl
    url: 'https://rsc.byu.edu/let-us-reason-together/spirit-returns-god-ecclesiastes-127'
    quote: 'There is thus a marked distinction between the use of this biblical language and imagery … and between the plural form “spirits” in Alma 40:11'
  - where: 'note 12:7 “The spirit returns to God”'
    claim: 'Pike’s reading: the body returns to dust and a divinely originating life breath, perhaps the Light of Christ, returns to God'
    key: pike-spirit-eccl
    url: 'https://rsc.byu.edu/let-us-reason-together/spirit-returns-god-ecclesiastes-127'
    quote: 'My understanding of Ecclesiastes 12:7 is that mortal bodies return to the dust, and, to use a poetic figure of speech, a divinely originating rûaḥ, a life breath or life force, leaves the body. This animating power, perhaps the Light of Christ,'
  - where: 'note 12:7 “The spirit returns to God”'
    claim: 'Pike: the verse itself does not teach premortality, which does not detract from its reality'
    key: pike-spirit-eccl
    url: 'https://rsc.byu.edu/let-us-reason-together/spirit-returns-god-ecclesiastes-127'
    quote: 'But the biblical verse itself (12:7) does not teach that doctrine. This does not detract from the reality of spirit persons created by God and of the premortal existence of these spirits. It just means that support for such realities must be sought elsewhere.'

  # note 12:9
  - where: 'note 12:9 “Another voice speaks of the Preacher”'
    claim: 'The third person in 1:1–11 and 12:8–14 may suggest a compiler'
    key: seminary-intro-eccl
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-study-guide-for-home-study-seminary-students-2015/introduction-to-ecclesiastes?lang=eng'
    quote: 'In Ecclesiastes 1:1–11 and 12:8–14, the text refers to the preacher in the third person. This may suggest that someone other than the preacher compiled his writings and teachings sometime after they were given.'
  - where: 'note 12:9 “Another voice speaks of the Preacher”'
    claim: 'Scripture Helps’ endnote: many scholars believe 12:9–14 were a later addition'
    key: scripture-helps-proverbs
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/35-proverbs-1-4-15-16-22-31-ecclesiastes-1-3-11-12?lang=eng'
    quote: 'Many scholars believe that verses 9–14 in Ecclesiastes 12 were a later addition to Ecclesiastes'
  - where: 'note 12:9 “Another voice speaks of the Preacher”'
    claim: 'Pike: verses 9–10 describe the Teacher as a sage; 11–14 give summary instruction from a later author or editor'
    key: pike-spirit-eccl
    url: 'https://rsc.byu.edu/let-us-reason-together/spirit-returns-god-ecclesiastes-127'
    quote: 'Verses 9–10 describe the Teacher as a sage, while verses 11–14 provide summary instruction and encouragement from the later author or editor.'
  - where: 'note 12:9 “Another voice speaks of the Preacher”'
    claim: 'Barlow calls the writer of 12:13 a second author who appended a summary judgment'
    key: barlow-public-relations
    url: 'http://mi.byu.edu/old-testament-reflections/ecclesiastes-has-a-public-relations-problem'
    quote: 'our citing the second author who later appended his or her summary judgment to the body of the book, saying “here is the conclusion of the matter: Fear God and keep his commandments.”'
  - where: 'note 12:9 “Another voice speaks of the Preacher”'
    claim: 'The Bible Dictionary: the epilogue sets forth the main conclusions of the writer'
    key: bd-ecclesiastes
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ecclesiastes?lang=eng'
    quote: 'The epilogue (Eccl. 12:9–14) sets forth the main conclusions at which the writer has arrived.'
  - where: 'note 12:9 “Another voice speaks of the Preacher”'
    claim: 'KnoWhy #868: the Preacher knew life was ephemeral but taught wisdom anyway'
    key: sc-knowhy-868
    url: 'https://scripturecentral.org/knowhy/why-does-ecclesiastes-talk-so-much-about-vanity'
    quote: 'The preacher knew that things in life were ephemeral, and that things did not work out the way people might hope most of the time, but he taught people wisdom anyway.'

  # note 12:11
  - where: 'note 12:11 “Goads, nails, and one shepherd”'
    claim: 'One older reading: goads are for driving on; the proverbs of the wise incite to self-reflection and noble effort'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/12.htm'
    quote: 'darevonoth also are goads, but designed for driving on, thus stimuli (Jerome); and is there a more natural commendation for the proverbs of the wise men than that they incite to self-reflection, and urge to all kinds of noble effort?'
  - where: 'note 12:11 “Goads, nails, and one shepherd”'
    claim: 'The lexicon: asuppah means a gathering or collection'
    key: bdb
    url: 'https://biblehub.com/hebrew/627.htm'
    quote: 'asuppah: Gathering, collection, storehouse'
  - where: 'note 12:11 “Goads, nails, and one shepherd”'
    claim: 'A modern translation: “like nails firmly fixed are the collected sayings that are given by one shepherd”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+12&version=NRSVUE'
    quote: 'like nails firmly fixed are the collected sayings that are given by one shepherd.'
  - where: 'note 12:11 “Goads, nails, and one shepherd”'
    claim: 'One older reading: “masters of assemblies” are the collected sayings themselves, fixed like nails, a help to memory and understanding; Ecclesiastes is such a collection'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/12.htm'
    quote: 'Of such it may properly be said, that they are like nails driven in, for they are secured against separations … and their being fixed in such connection not only is a help to the memory, but also to the understanding of them. The Book of Koheleth itself is such an asuppah'
  - where: 'note 12:11 “Goads, nails, and one shepherd”'
    claim: 'One older reading: the one shepherd is God, who cares as a shepherd for those who fear Him; Koheleth and Proverbs have one fountain'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/12.htm'
    quote: 'have yet one fountain with the Solomonic Book of Proverbs, - God, the one God, who guides and cares as a shepherd for all who fear Him'
  - where: 'note 12:11 “Goads, nails, and one shepherd”'
    claim: 'Verse 12: “my son” as in Proverbs; a warning against too much reading, pointing to the one thing needful'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/12.htm'
    quote: 'warning against too much reading, and finally pointing once more to the one thing needful … With "my son," the teacher of wisdom here, as in the Book of Proverbs, addresses the disciple who places himself under his instruction.'
  - where: 'note 12:11 “Goads, nails, and one shepherd”'
    claim: 'A modern translation of 12:12: “Of anything beyond these, my child, beware”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+12&version=NRSVUE'
    quote: 'Of anything beyond these, my child, beware. Of making many books there is no end, and much study is a weariness of the flesh.'

