chapter: 9
claims:
  - where: setting
    claim: 'On one older reading, 9:1 gives the reason for what 8:17 says, that no one can find out God’s work'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/9.htm'
    quote: 'With ki follows the verification of what is said in Ecclesiastes 8:17, "is unable to find out," from the fact of men, even the best and the wisest of men, being on all sides conditioned.'
  - where: setting
    claim: 'What meets a man lies before him, in the future, beyond his power'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/9.htm'
    quote: 'love, hatred, and generally all things, stand before man; God causes them to meet him (cf. the use of הקרה); they belong to the future, which is beyond his power.'
  - where: setting
    claim: 'The Church’s study guide sums up chapters 9–10: tragedy for wicked and righteous; wisdom better than riches or power'
    key: seminary-intro-eccl
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-study-guide-for-home-study-seminary-students-2015/introduction-to-ecclesiastes?lang=eng'
    quote: 'Ecclesiastes 9–10. The preacher asserts that both the wicked and the righteous will experience tragedy. Everyone has a limited amount of time on this earth and will benefit much more from gaining wisdom than from gaining riches or power.'
  - where: setting
    claim: '“Under the sun” means from the world’s point of view'
    key: bd-ecclesiastes
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ecclesiastes?lang=eng'
    quote: 'must be read in the light of one of its key phrases: “under the sun” (1:9), meaning “from a worldly point of view.”'

  - where: thread
    claim: 'A modern translation divides the chapter into 1–6, 7–10 and 11–18'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+9&version=ESV'
    quote: 'Death Comes to All … Enjoy Life with the One You Love … Wisdom Better Than Folly'
  - where: thread
    claim: 'On one older reading, the counsel of 9:7–10 follows from there being only one life'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/9.htm'
    quote: 'From this, that there is only one life, one life on this side of eternity, he deduces the exhortation to enjoy the one as much as possible'
  - where: thread
    claim: 'On one older reading, 9:7–10 is the author’s most personal utterance, the conclusion that runs through the book'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/9.htm'
    quote: 'is the most distinct personal utterance of the author, his ceterum censeo which pervades the whole book'

  - where: section 1 plain
    claim: 'The love or hatred of verse 1, rendered as a modern translation does'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+9&version=ESV'
    quote: 'Whether it is love or hate, man does not know; both are before him.'
  - where: section 1 plain
    claim: '“Sweareth” means makes a covenant; “feareth an oath” means avoids committing himself'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/eccl/9?lang=eng'
    quote: '“sweareth”: IE makes a covenant. … “feareth an oath”: IE avoids committing himself.'
  - where: section 2 plain
    claim: '“God now accepteth” rendered “has already approved”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+9&version=ESV'
    quote: 'for God has already approved what you do.'
  - where: section 2 plain
    claim: '“Vanity” in Ecclesiastes means fleeting'
    key: bd-ecclesiastes
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ecclesiastes?lang=eng'
    quote: 'as used in Ecclesiastes it means “transitory” or “fleeting.”'
  - where: section 3 plain
    claim: 'A cruel net, rendered as a modern translation does'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+9&version=NRSVUE'
    quote: 'Like fish taken in a cruel net or like birds caught in a snare'
  - where: section 3 plain
    claim: '“Bulwarks” rendered siegeworks'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+9&version=ESV'
    quote: 'a great king came against it and besieged it, building great siegeworks against it.'

  - where: 'note 9:2 “One event for the righteous and the wicked”'
    claim: 'The Church’s footnotes gloss “sweareth” and “feareth an oath”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/eccl/9?lang=eng'
    quote: '“sweareth”: IE makes a covenant. … “feareth an oath”: IE avoids committing himself.'
  - where: 'note 9:2 “One event for the righteous and the wicked”'
    claim: 'The footnote on “event” points to 2:14'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/eccl/9?lang=eng'
    quote: '“event”: Eccl. 2:14.'
  - where: 'note 9:2 “One event for the righteous and the wicked”'
    claim: 'A Latter-day Saint reading: like Job, the book corrects the assurance that God prospers the righteous visibly in mortality'
    key: barlow-public-relations
    url: 'http://mi.byu.edu/old-testament-reflections/ecclesiastes-has-a-public-relations-problem'
    quote: 'like the book of Job, serve as a balancing corrective to the widely held assurance, in both ancient and modern times, that God will dependably prosper the righteous and punish the wicked in visible, material ways in mortality?'
  - where: 'note 9:2 “One event for the righteous and the wicked”'
    claim: 'The same reading sets Matt. 5:45 beside it'
    key: barlow-public-relations
    url: 'http://mi.byu.edu/old-testament-reflections/ecclesiastes-has-a-public-relations-problem'
    quote: 'Against this thought, and like Ecclesiastes, Jesus noticed that God “maketh his sun to rise on the evil and on the good [alike], and sendeth rain on the just and on the unjust” (Matthew 5:45).'

  - where: 'note 9:4 “A living dog and a dead lion”'
    claim: 'On one older reading, the dog in scripture is a filthy masterless beast, the emblem of what is low or contemptible'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/9.htm'
    quote: 'The dog, which occurs in the Holy Scriptures only in relation to a shepherd''s dog (Job 30:1), and as for the rest, appears as a voracious filthy beast, roaming about without a master, is the proverbial emblem of that which is common, or low, or contemptible'
  - where: 'note 9:4 “A living dog and a dead lion”'
    claim: 'The “dead dog” of 1 Samuel 24 is an example; the lion is the king of beasts'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/9.htm'
    quote: '"dead dog," 1 Samuel 24:15; 2 Samuel 9:8; 2 Samuel 16:9. The lion, on the other hand, is the king, or, as Agur (Proverbs 30:30) calls it, the hero among beasts.'
  - where: 'note 9:4 “A living dog and a dead lion”'
    claim: 'The apparent contradiction with 4:2: there life seen in its unhappy experiences, here as a good that allows enjoyment'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/9.htm'
    quote: 'there he views life pessimistically in its, for the most part, unhappy experiences, while here he regards it in itself as a good affording the possibility of enjoyment.'
  - where: 'note 9:4 “A living dog and a dead lion”'
    claim: 'Only the living have a joyful spirit; from this the Preacher draws the counsel to enjoy life'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/9.htm'
    quote: 'for only he who belongs to the class of living beings has a joyful spirit, has a spirit of enterprise'
  - where: 'note 9:4 “A living dog and a dead lion”'
    claim: 'Verse 5 makes the comparison with irony'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/9.htm'
    quote: 'He sarcastically verifies his comparison in favour of a living dog.'

  - where: 'note 9:5 “What the dead know”'
    claim: 'The Bible Dictionary: 9:5 and 9:10 are observations under the sun, not pronouncements on the soul after death'
    key: bd-ecclesiastes
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ecclesiastes?lang=eng'
    quote: 'These should not be construed as theological pronouncements on the condition of the soul after death; rather, they are observations by the Preacher about how things appear to men on the earth “under the sun.”'
  - where: 'note 9:5 “What the dead know”'
    claim: 'The seminary manual: the Preacher wrote as if there were no life after death'
    key: seminary-ot-teacher-115
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-song-of-solomon/lesson-115-ecclesiastes-and-the-song-of-solomon?lang=eng'
    quote: 'It is important to remember that the author of Ecclesiastes, the Preacher, wrote as if there is no life after death.'
  - where: 'note 9:5 “What the dead know”'
    claim: 'Not a doctrinal declaration; the manual sets Alma 34:34 and D&C 138:30 beside the verses'
    key: seminary-ot-teacher-115
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-song-of-solomon/lesson-115-ecclesiastes-and-the-song-of-solomon?lang=eng'
    quote: '(see Alma 34:34; D&C 138:30). Therefore, the writer of Ecclesiastes was not making a doctrinal declaration that nobody thinks, feels, or works after they die'
  - where: 'note 9:5 “What the dead know”'
    claim: 'The footnote at verse 3 points to Alma 40:11–12'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/eccl/9?lang=eng'
    quote: '“dead”: Alma 40:11 (11–12).'
  - where: 'note 9:5 “What the dead know”'
    claim: 'Alma learned from an angel that spirits are taken home to God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/40?lang=eng'
    quote: 'it has been made known unto me by an angel, that the spirits of all men, as soon as they are departed from this mortal body'
  - where: 'note 9:5 “What the dead know”'
    claim: 'The Savior appointed messengers to preach to the spirits of the dead'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/138?lang=eng'
    quote: 'commissioned them to go forth and carry the light of the gospel to them that were in darkness, even to all the spirits of men; and thus was the gospel preached to the dead.'
  - where: 'note 9:5 “What the dead know”'
    claim: 'D&C 138 is President Joseph F. Smith’s vision'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/138?lang=eng'
    quote: '1–10, President Joseph F. Smith ponders upon the writings of Peter'

  - where: 'note 9:7 “God has already approved”'
    claim: 'A modern translation: God has long ago approved'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+9&version=NRSVUE'
    quote: 'for God has long ago approved what you do.'
  - where: 'note 9:7 “God has already approved”'
    claim: 'Another modern translation: God has already approved'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+9&version=ESV'
    quote: 'for God has already approved what you do.'
  - where: 'note 9:7 “God has already approved”'
    claim: 'One older reading rejects the explanation that the man’s moral conduct pleased God'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/9.htm'
    quote: 'Incorrectly, the Targ., Rashi, Hengst. Ginsb., and Zckl. explain: For thy moral conduct and effort have pleased Him long ago'
  - where: 'note 9:7 “God has already approved”'
    claim: 'The word means “long ago”: God permitted the enjoyment beforehand, so there is no room for scruples'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/9.htm'
    quote: 'more correctly, Hitzig: Long ago God has beforehand permitted this thy conduct, so that thou hast no room for scruples about it.'
  - where: 'note 9:7 “God has already approved”'
    claim: 'Enjoyment is God’s will, and to be had as He wills'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/9.htm'
    quote: 'for it is the will of God that we should enjoy life, thus it is self-evident that we have to enjoy it as He wills it to be enjoyed.'
  - where: 'note 9:7 “God has already approved”'
    claim: 'A Latter-day Saint reading cites 9:7 for the Lord’s pleasure in sacrifices, beside Moses 5:11'
    key: sc-knowhy-372
    url: 'https://scripturecentral.org/knowhy/why-is-joy-associated-with-temple-work-in-the-scriptures'
    quote: 'we can know that the Lord is pleased with our sacrifices. It was after offering animal sacrifices that Adam and Eve learned of the “joy of our redemption” (Moses 5:11). As the preacher exclaimed: “Go thy way, eat thy bread with joy'

  - where: 'note 9:8 “White garments”'
    claim: 'On one older reading, white garments contrast with mourning and express festal joy'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/9.htm'
    quote: 'The white garments, לבּנים, are in contrast to the black robes of mourning, and thus are an expression of festal joy, of a happy mood'
  - where: 'note 9:8 “White garments”'
    claim: 'The Church’s footnote points to Alma 5'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/eccl/9?lang=eng'
    quote: '“white”: Alma 5:21 (21, 24, 27).'
  - where: 'note 9:8 “White garments”'
    claim: 'Alma 5:27, garments made white through the blood of Christ'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/5?lang=eng'
    quote: 'That your garments have been cleansed and made white through the blood of Christ, who will come to redeem his people from their sins?'

  - where: 'note 9:10 “With thy might”'
    claim: 'Modern translations read Sheol for “the grave”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+9&version=ESV'
    quote: 'for there is no work or thought or knowledge or wisdom in Sheol, to which you are going.'
  - where: 'note 9:10 “With thy might”'
    claim: 'Modern translations read Sheol for “the grave”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+9&version=NRSVUE'
    quote: 'for there is no work or thought or knowledge or wisdom in Sheol, to which you are going.'
  - where: 'note 9:10 “With thy might”'
    claim: 'The Church’s footnotes at verse 10 point to Alma 34:33 and D&C 130:18'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/eccl/9?lang=eng'
    quote: '“knowledge”: 2 Ne. 9:13 (13–14); D&C 130:18. … “grave”: Alma 34:33.'
  - where: 'note 9:10 “With thy might”'
    claim: 'Amulek: this life is the time to prepare and perform labors'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/34?lang=eng'
    quote: 'For behold, this life is the time for men to prepare to meet God; yea, behold the day of this life is the day for men to perform their labors.'
  - where: 'note 9:10 “With thy might”'
    claim: 'D&C 130:18, intelligence rises with us'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/130?lang=eng'
    quote: 'Whatever principle of intelligence we attain unto in this life, it will rise with us in the resurrection.'

  - where: 'note 9:11 “Time and chance”'
    claim: 'On one older reading, the Hebrew says these things do not belong to the swift and strong as their own'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/9.htm'
    quote: 'The five times repeated ל is that of property, of that, viz., by virtue of which one is master of that which is named, has power over it, disposes of it freely.'
  - where: 'note 9:11 “Time and chance”'
    claim: 'Fleetness is no guarantee of reaching the goal'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/9.htm'
    quote: 'their fleetness is yet no guarantee that on account of it they will reach the goal.'
  - where: 'note 9:11 “Time and chance”'
    claim: 'The battle belongs to the Lord (1 Sam. 17:47); bread and riches depend on circumstances, finally conditioned by God'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/9.htm'
    quote: 'means that much rather it belongs to the Lord, 1 Samuel 17:47. … depends on times and circumstances which lie beyond the control of man, and is thus, in the final result, conditioned by God'
  - where: 'note 9:11 “Time and chance”'
    claim: 'Brigham Young on the verse: do not fret over property'
    key: ot-manual-proverbs
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-2?lang=eng'
    quote: 'Do not fret, nor be so anxious about property, nor think that when you have gathered treasures, they alone will produce joy and comfort; for it is not so.'
  - where: 'note 9:11 “Time and chance”'
    claim: 'Brigham Young: the Lord gives the increase'
    key: ot-manual-proverbs
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-2?lang=eng'
    quote: 'The Lord gives the increase: he makes rich whom he pleases.'
  - where: 'note 9:11 “Time and chance”'
    claim: 'The footnote at “swift” points to Mosiah 4:27'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/eccl/9?lang=eng'
    quote: '“swift”: Amos 2:14 (14–15); Mosiah 4:27.'

  - where: 'note 9:15 “The poor wise man”'
    claim: 'On one older reading, the story is actual history, perhaps like the wise woman of Abel-beth-maacha'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/9.htm'
    quote: 'it was saved by the wisdom of the poor man (perhaps in the same way as Abel-beth-maacha, 2 Samuel 20, by the wisdom of a woman).'
  - where: 'note 9:15 “The poor wise man”'
    claim: 'The man remained poor'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/9.htm'
    quote: 'no man thought of him, as he deserved to have been thought of, as the saviour of the city; he was still poor, and remained so'
  - where: 'note 9:15 “The poor wise man”'
    claim: 'The wise woman of the besieged city speaks to Joab'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/20?lang=eng'
    quote: 'Then cried a wise woman out of the city, Hear, hear; say, I pray you, unto Joab, Come near hither, that I may speak with thee.'

  - where: christ
    claim: 'The Church’s footnote at verse 16 points to Mark 6:2–3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/eccl/9?lang=eng'
    quote: '“wisdom”: Mark 6:2 (2–3).'
  - where: christ
    claim: 'Paul: if in this life only we have hope in Christ we are most miserable; but Christ is risen'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-cor/15?lang=eng'
    quote: 'If in this life only we have hope in Christ, we are of all men most miserable.'
