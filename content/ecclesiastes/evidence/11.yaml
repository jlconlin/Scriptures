chapter: 11
claims:
  # setting
  - where: 'setting'
    claim: 'Scripture Helps: in chapters 11–12 the Preacher invites all to enjoy life as God’s gift and concludes that obedience matters because God will judge'
    key: scripture-helps-proverbs
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/35-proverbs-1-4-15-16-22-31-ecclesiastes-1-3-11-12?lang=eng'
    quote: 'Ecclesiastes 11–12: The Preacher invites everyone to enjoy life as a gift from God. He concludes that obedience to God’s commandments is of lasting importance because one day we will die and God will judge us according to the way we lived.'
  - where: 'setting'
    claim: 'The Bible Dictionary: the most spiritual part of the book is chapters 11 and 12'
    key: bd-ecclesiastes
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ecclesiastes?lang=eng'
    quote: 'The most spiritual part of the book appears in chapters 11 and 12, where it is concluded that the only activity of lasting and permanent value comes from obedience to God’s commandments'
  - where: 'setting'
    claim: 'A modern translation divides the chapter at verse 7: diligence (1–6), youth and old age (7–)'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+11&version=NRSVUE'
    quote: '§ The Value of Diligence … § Youth and Old Age'

  # thread
  - where: 'thread'
    claim: 'Verses 3–6: nature’s outcomes, counsel not to let them stop one’s work, the uncertainty of life, and counsel to proceed anyway'
    key: pike-spirit-eccl
    url: 'https://rsc.byu.edu/let-us-reason-together/spirit-returns-god-ecclesiastes-127'
    quote: 'And verse 4 counsels against letting the forces of nature unduly impact what needs to be accomplished in life … Verse 5 further highlights the uncertain nature of life … The Teacher concludes this concept in verse 6 by counseling us to proceed with what needs to be done, despite life’s uncertainties.'
  - where: 'thread'
    claim: 'Verse 10: youth is transitory and soon passes'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/11.htm'
    quote: 'for youth, destined for and disposed to joy, is hevel, i.e., transitory, and only too soon passes away.'

  - where: 'thread'
    claim: 'The book repeatedly stresses the inscrutability of God and His ways'
    key: pike-spirit-eccl
    url: 'https://rsc.byu.edu/let-us-reason-together/spirit-returns-god-ecclesiastes-127'
    quote: 'So, while Ecclesiastes does indicate that God is in control (for example, 3:9–18; 7:13–14), the inscrutability of God and his ways in this difficult world is repeatedly underscored.'

  # note 11:1
  - where: 'note 11:1 “Generosity, or a venture”'
    claim: 'Scripture Helps: traditionally a metaphor for generosity without expecting immediate return'
    key: scripture-helps-proverbs
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/35-proverbs-1-4-15-16-22-31-ecclesiastes-1-3-11-12?lang=eng'
    quote: 'This phrase has traditionally been understood as a metaphor to act generously to others without expecting immediate return and generosity may be repaid over time.'
  - where: 'note 11:1 “Generosity, or a venture”'
    claim: 'NIV reads verses 1–2 as trade and investment'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+11&version=NIV'
    quote: 'Ship your grain across the sea; after many days you may receive a return. 2 Invest in seven ventures, yes, in eight; you do not know what disaster may come upon the land.'
  - where: 'note 11:1 “Generosity, or a venture”'
    claim: 'Breitenstein reads verse 2 as giving beyond what is asked without knowing the outcome'
    key: ot-minute-ecclesiastes
    url: 'https://scripturecentral.org/archive/books/book-chapter/ecclesiastes-13-1112'
    quote: 'Verse 2 can be interpreted to mean that we should go the extra mile in giving and doing, even if we do not know the outcome.'
  - where: 'note 11:1 “Generosity, or a venture”'
    claim: 'The verb in verse 1 is shallach, “send”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Eccl.xml'
    quote: 'שַׁלַּ֥ח'
  - where: 'note 11:1 “Generosity, or a venture”'
    claim: 'The Septuagint: “Send forth thy bread upon the face of the water”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/ecclesiastes/11.htm'
    quote: 'Send forth thy bread upon the face of the water: for thou shalt find it after many days.'

  # note 11:3
  - where: 'note 11:3 “As the tree falls”'
    claim: 'In context, verse 3 names matter-of-fact outcomes in nature'
    key: pike-spirit-eccl
    url: 'https://rsc.byu.edu/let-us-reason-together/spirit-returns-god-ecclesiastes-127'
    quote: 'Ecclesiastes 11:3 mentions what appear to be matter-of-fact outcomes in the natural world such as, “If the clouds be full of rain, they empty themselves upon the earth.”'
  - where: 'note 11:3 “As the tree falls”'
    claim: 'Brigham Young tied the line to death and judgment'
    key: ot-manual-proverbs
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-2?lang=eng'
    quote: 'And I do know that as we lie down, so judgment will find us, and that is scriptural; ‘as the tree falls so it shall lie,’ or, in other words, as death leaves us so judgment will find us.” (In Journal of Discourses, 4:52–53.)'
  - where: 'note 11:3 “As the tree falls”'
    claim: 'Breitenstein: in verse 3 the Preacher understood that at death we remain what we became'
    key: ot-minute-ecclesiastes
    url: 'https://scripturecentral.org/archive/books/book-chapter/ecclesiastes-13-1112'
    quote: 'In verse 3, the Preacher understood that when we die we will remain what we became. We will be judged for our actions and thoughts up to that point.'

  # note 11:5
  - where: 'note 11:5 “The wind, or the spirit”'
    claim: 'The Hebrew is ruach, the word translated “wind” in verse 4'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Eccl.xml'
    quote: 'הָ/ר֔וּחַ'
  - where: 'note 11:5 “The wind, or the spirit”'
    claim: 'Two main interpretations: wind (from verse 4) or the life-giving spirit (from the womb)'
    key: pike-spirit-eccl
    url: 'https://rsc.byu.edu/let-us-reason-together/spirit-returns-god-ecclesiastes-127'
    quote: '(1) rûaḥ refers to the wind, which makes sense, given the reference to clouds and wind (rûaḥ) in the previous verse; and (2) rûaḥ refers to the spirit or breath that gives life, which makes sense given the reference to the growth of a fetus in a mother’s womb'
  - where: 'note 11:5 “The wind, or the spirit”'
    claim: 'Those who rendered “spirit” meant the animating spirit in all creatures, not spirit personages; using the verse to support a reading of 12:7 is problematic'
    key: pike-spirit-eccl
    url: 'https://rsc.byu.edu/let-us-reason-together/spirit-returns-god-ecclesiastes-127'
    quote: 'it is problematic to use it as support for interpreting the occurrence of rûaḥ in 12:7. And given the theological orientation of those involved … those who rendered rûaḥ as “spirit” were thinking of the divinely given animating spirit in all creatures … not spirit personages created by God.'
  - where: 'note 11:5 “The wind, or the spirit”'
    claim: 'The Septuagint reads “the way of the wind”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/ecclesiastes/11.htm'
    quote: 'Among whom none knows what is the way of the wind: as the bones are hid in the womb of a pregnant woman'
  - where: 'note 11:5 “The wind, or the spirit”'
    claim: 'NIV: “the path of the wind”'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+11&version=NIV'
    quote: 'As you do not know the path of the wind, or how the body is formed in a mother’s womb'
  - where: 'note 11:5 “The wind, or the spirit”'
    claim: 'NRSVue: “how the breath comes to the bones”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+11&version=NRSVUE'
    quote: 'Just as you do not know how the breath comes to the bones in the mother’s womb, so you do not know the work of God, who makes everything.'
  - where: 'note 11:5 “The wind, or the spirit”'
    claim: 'ESV’s footnote: some manuscripts read “the way the spirit comes to the bones”; most read “the way of the wind, or how the bones grow”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+11&version=ESV'
    quote: 'Ecclesiastes 11:5 Some Hebrew manuscripts, Targum; most Hebrew manuscripts As you do not know the way of the wind, or how the bones grow in the womb'

  # note 11:8
  - where: 'note 11:8 “The days of darkness”'
    claim: 'The Church’s footnote at “darkness” points to Eccl. 12:1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/eccl/11?lang=eng'
    quote: 'Eccl. 12:1.'
  - where: 'note 11:8 “The days of darkness”'
    claim: '12:1–7 dwell on the dark days of old age and the grave'
    key: pike-spirit-eccl
    url: 'https://rsc.byu.edu/let-us-reason-together/spirit-returns-god-ecclesiastes-127'
    quote: 'the closing words from the Teacher, in Ecclesiastes 12:1–7, emphasize the long, dark days of misery encountered in old age and the inevitability of the grave.'
  - where: 'note 11:8 “The days of darkness”'
    claim: 'Breitenstein: darkness disrupts the day, but only for a time'
    key: ot-minute-ecclesiastes
    url: 'https://scripturecentral.org/archive/books/book-chapter/ecclesiastes-13-1112'
    quote: 'We should rejoice in each new day. When rejoicing, we need to remember that evil and darkness can still disrupt the day. But that disruption is only temporary—a bright new day will follow.'

  # note 11:9
  - where: 'note 11:9 “The heart, the eyes, and the judgment”'
    claim: 'The Septuagint (Brenton) reads “blameless, but not in the sight of thine eyes”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/ecclesiastes/11.htm'
    quote: 'walk in the ways of thy heart blameless, but not in the sight of thine eyes: yet know that for all these things God will bring thee into judgement.'
  - where: 'note 11:9 “The heart, the eyes, and the judgment”'
    claim: 'One older reading: the Greek “not” was added in view of Num. 15:39, and the Targum also softens the line'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/11.htm'
    quote: 'This "not" (μή), which is wanting in A.C., is an interpolation, in view of the warning, Numbers 15:39, against following the impulse of the heart and of the eyes; the Targ. also therefore has: "be prudent with reference to the sight of thine eyes."'
  - where: 'note 11:9 “The heart, the eyes, and the judgment”'
    claim: 'The same: the softening is unneeded, since the call to enjoyment comes with the warning of judgment'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/11.htm'
    quote: 'But this moralizing of the text is superfluous, since the call to the youthful enjoyment of life is accompanied with the nota bene: but know that God will bring thee to an account for all this'
  - where: 'note 11:9 “The heart, the eyes, and the judgment”'
    claim: 'Num. 15:39 warns against seeking after one’s own heart and eyes'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/15?lang=eng'
    quote: 'and that ye seek not after your own heart and your own eyes, after which ye use to go a whoring:'
  - where: 'note 11:9 “The heart, the eyes, and the judgment”'
    claim: 'One older reading of verse 10: free oneself of what harms the inner and outer man, for youth is hebel, transitory'
    key: delitzsch-ecclesiastes
    url: 'https://biblehub.com/commentaries/kad/ecclesiastes/11.htm'
    quote: 'He ought to free himself from that which is injurious to the inner and the outer man … for youth, destined for and disposed to joy, is hevel, i.e., transitory, and only too soon passes away.'

  # christ
  - where: 'christ'
    claim: 'Elder Gong: through the Atonement all things are restored; like bread upon the water, restoration returns what is good'
    key: gong-hosanna-hallelujah
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2020/04/31gong?lang=eng'
    quote: 'A second promise of Easter and our Lord’s Atonement is that, spiritually, “all things shall be restored to their proper order.” This spiritual restoration reflects our works and desires. Like bread upon the water, it restores “that which is good,” “righteous,” “just,” and “merciful.”'
  - where: 'christ'
    claim: 'Alma 41:15: what is sent out returns and is restored'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/41?lang=eng'
    quote: 'For that which ye do send out shall return unto you again, and be restored'
  - where: 'christ'
    claim: 'The Father has committed all judgment to the Son'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/5?lang=eng'
    quote: 'For the Father judgeth no man, but hath committed all judgment unto the Son:'
  - where: 'christ'
    claim: 'Gal. 6:9: in due season we shall reap if we faint not'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/gal/6?lang=eng'
    quote: 'And let us not be weary in well doing: for in due season we shall reap, if we faint not.'
  - where: 'note 11:5 “The wind, or the spirit”'
    claim: 'ESV’s text follows the reading “the way the spirit comes to the bones”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Ecclesiastes+11&version=ESV'
    quote: 'As you do not know the way the spirit comes to the bones in the womb of a woman with child'
