summary: >-
  Ecclesiastes ends with a poem of old age and death, given in things that break: the silver
  cord loosed, the golden bowl broken, the pitcher broken at the fountain (12:6), while the
  almond tree flourishes (12:5). The image shows that moment at a spring: broken vessels
  beside running water, under a tree in blossom.
motifs:
  - "Most important: a clay water pitcher lying broken on the flat stones at a spring, one large piece fallen away, its water spilled across the stones (Ecclesiastes 12:6)."
  - "Important: a golden bowl tipped on its side on the stones to the right of the pitcher, with a silver chain lying loose from it (Ecclesiastes 12:6)."
  - "Supporting: an almond tree in white blossom arching over the top of the picture, a few petals fallen on the stones (Ecclesiastes 12:5)."
  - "Setting: the spring, water falling from a low wall of pale stone into a shallow stone-edged pool."
composition: >-
  A close view at the edge of a spring in warm early-morning light from the left. The broken
  pitcher is the focal point, just left of center in the foreground, with the golden bowl and
  its chain to the right of it; the almond tree rises at the left and arches across the top.
  Beyond the pool, olive-green hills with a few cypresses fade into a pale clear sky.
key:
  - '**The broken pitcher** with its water spilled on the stones is the Preacher''s picture of death: “or the pitcher be broken at the fountain” ([[Eccl. 12:6]]).'
  - '**The fallen golden bowl and its loose silver chain** belong to the same verse: “Or ever the silver cord be loosed, or the golden bowl be broken” ([[Eccl. 12:6]]).'
  - '**The almond tree in blossom** is one of the earlier images of old age: “and the almond tree shall flourish” ([[Eccl. 12:5]]).'
  - '**The spring** still runs beside what has broken. The poem ends with what follows death: “Then shall the dust return to the earth as it was: and the spirit shall return unto God who gave it” ([[Eccl. 12:7]]).'
asset: /assets/ecclesiastes-book-art.jpg
alt: In the morning light, a clay pitcher lies broken on stones beside a spring, its water spilled. A golden bowl and its loose silver chain lie nearby, under an almond tree in white blossom. The spring falls from a stone wall into a pool.
status: approved
