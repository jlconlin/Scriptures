chapter: 8
title: Who Is as the Wise Man?
tagline: The Preacher counsels loyalty to the king, finds that no one rules the day of death, sees judgment delayed and the just faring as the wicked, still knows it shall be well with those who fear God, and ends with a work of God no wise man can find out.
when: "The Preacher's reflections"

setting: |
  Chapter 8 is about what wisdom can and cannot do. It opens by praising the wise man and closes by saying that even a wise man cannot find out the work of God. Between the two he turns to the court of a king, to the day of death, and to justice that does not come when it should.

  Two earlier passages stand behind the chapter. Modern translations' cross-references join the “time and judgment” of verse 6 to the poem of times and to the judgment God will bring ([[Eccl. 3:1]]; [[Eccl. 3:17]]). The mirth of verse 15 is the same gift of eating and drinking that the Preacher has praised since [[Eccl. 2:24]]. Here he sets it beside the sight of the righteous treated as the wicked, and Nephi's prophecy of false teachers in [[2 Ne. 28:7–8]] uses its words.

  On “vanity” (*hebel*, a breath or vapor) see [[Eccl. 1:2]]; on “under the sun,” the frame of the book, see [[Eccl. 1:3]].

thread: |
  Who is like the wise man? Wisdom shows in his face. The Preacher's first counsel to him is practical: keep the king's command, because of the oath sworn before God, and don't walk out on the king or join in a bad cause, since a king does as he pleases. Whoever keeps the command comes to no harm, and the wise heart knows there is a right time and way for everything. But man does not know what will happen, and four things are out of his hands: the wind, the day of his death, release from that war, and escape for the wicked.

  Then he looks at injustice. The wicked are buried with honor, or forgotten, and judgment against evil is slow, so people set their hearts on doing it. Against that he sets what he knows: it will be well with those who fear God, and not with the wicked. And against that he sets what he sees: the just get what the wicked deserve, and the wicked what the just deserve. He does not reconcile the two. He commends mirth instead, the eating and drinking God gives in a man's labor.

  The last two verses end where the chapter began, with the wise. Day and night he has watched the business of the earth, and he concludes that no one, however wise, can find out the work of God; the cross-references of modern translations tie this back to verse 7, that man “knoweth not that which shall be.”

sections:
  - range: 1-1
    heading: The face of the wise
    plain: |
      Who is like the wise man? Who knows what things mean? Wisdom makes a man's face shine, and the hardness of his face is changed (see the note).
  - range: 2-9
    heading: The king's word and the day of death
    plain: |
      I counsel you: keep the king's command, because of the oath of God (see the note). Don't be quick to leave his presence, and don't take part in an evil cause, for he does whatever he pleases. The king's word has power, and who can say to him, “What are you doing?” Whoever keeps the command will meet no harm, and a wise heart knows the proper time and the just way, for everything has its time and way, though man's trouble lies heavy on him. He does not know what is coming, and no one can tell him when it will come. No one has power over the wind (or the breath) to hold it back, and no one has power over the day of death; there is no discharge from that war, and wickedness will not rescue those who practice it (see the note). All this I saw as I gave my mind to everything done under the sun, at a time when one man rules over another to his hurt.
  - range: 10-15
    heading: Justice delayed, and mirth commended
    plain: |
      Then I saw the wicked buried, who used to go in and out of the holy place, and they were forgotten in the city where they had done such things, or, in another reading of the text, praised there (see the note). This too is vanity. Because the sentence against an evil deed is not carried out quickly, people's hearts are fully set on doing evil. Though a sinner does evil a hundred times and lives long, I know it will be well with those who fear God, who stand in awe before Him. It will not be well with the wicked, and his days, like a shadow, will not be prolonged, because he does not fear God. Yet there is a vanity on the earth: righteous people are treated as the wicked deserve, and wicked people as the righteous deserve. This too is vanity. So I commend enjoyment, because a man has nothing better under the sun than to eat, drink and be glad; that will stay with him in his labor all the days of the life God gives him under the sun.
  - range: 16-17
    heading: The work no one can find out
    plain: |
      When I set my mind to know wisdom and to watch the business done on the earth, where people's eyes see no sleep day or night, then I saw all the work of God: no one can find out what is done under the sun. However hard a man works to search it out, he will not find it; even if a wise man claims to know it, he cannot find it.

notes:
  - ref: 1
    phrase: the boldness of his face shall be changed
    kind: symbol
    title: A face changed by wisdom
    body: |
      The face in verse 1 shows what wisdom does to the person who has it: the line says that wisdom makes the face shine and softens its hardness. The King James “boldness” is not courage: a modern translation has “the hardness of his face is changed.” On one older reading the Hebrew phrase is the one behind the nation “of fierce countenance” in [[Deut. 28:50]], and it means “stiffness, hardness, rudeness of countenance equals boldness, want of bashfulness, regardlessness.” On that reading the change is more than a brighter look: it is an “intellectual and ethical transfiguration of the countenance,” the inner change made visible.

      Another modern translation reads the second line as a contrast instead: “Being wise makes one's face shine, but arrogance changes one's face.” Either way, the face is where wisdom, or its lack, can be seen.
    sources: [esv, nrsvue, delitzsch-ecclesiastes]
  - ref: 2
    phrase: in regard of the oath of God
    kind: history
    title: The oath of God
    body: |
      The “oath of God” ties keeping the king's command to God, though whose oath it is the Hebrew does not say: it reads only “the oath of God,” and modern translations differ: “because you took an oath before God,” “because of your sacred oath,” or “because of God's oath to him,” with “your oath to God” in the margin.

      On one older reading the king is an earthly king, not God (the words about the oath “render this impossible”), and “The faithfulness of subjects, Koheleth says, is a religious duty”; the same reading compares Paul in [[Rom. 13:5]] and notes that Israel's prophets condemned “any breach of faith committed against the Assyrian or Chaldean oppressor.” A modern translation's cross-reference points to the same chapter of Ezekiel: its judgment on the king of Judah who rebelled against Babylon, “Seeing he despised the oath by breaking the covenant” ([[Ezek. 17:18]]).

      The counsel that follows (verses 3–4) adds a practical reason: a king “doeth whatsoever pleaseth him,” and no one can say to him, “What doest thou?”
    sources: [oshb-wlc, niv, nrsvue, esv, delitzsch-ecclesiastes]
  - ref: 8
    phrase: There is no man that hath power over the spirit to retain the spirit
    kind: words
    title: No power over the wind
    body: |
      The “spirit” of verse 8 is the Hebrew *ruach*, which can mean wind or breath as well as spirit, and modern translations divide over it. Some read “No one has power over the wind to restrain the wind,” with “breath” in the margin; another keeps “No man has power to retain the spirit.” Read as wind, the line is a comparison: as no one can hold back the wind, no one controls the day of his death. Read as breath, it says the same thing directly: no one can keep his breath from leaving him. Neither reading makes it the spirit as a person: in none of the 23 occurrences of *ruach* in Ecclesiastes outside 12:7, this verse among them, does the word “convincingly have the meaning of spirit personage.” On man's breath, see [[Eccl. 3:19]]; on the spirit that returns to God, [[Eccl. 12:7]].

      The “discharge in that war” finishes the thought. A modern translation's cross-reference points to the law that sent some men home before a battle, the man with a new house, a new vineyard or a betrothed wife, and the fearful ([[Deut. 20:5–8]]). In the verse the war is the day of death: from it no one is sent home, and wickedness does not deliver those given to it.
    sources: [oshb-wlc, nrsvue, niv, esv, pike-spirit-eccl]
  - ref: 10
    phrase: they were forgotten in the city where they had so done
    kind: words
    title: Forgotten, or praised
    body: |
      The text of verse 10 is uncertain, and the reading changes what the Preacher saw. Most Hebrew manuscripts have “forgotten,” as the King James does: the wicked, who came and went from the holy place, die and are forgotten in the city where they did their deeds. Some Hebrew manuscripts and the Septuagint have “praised,” and modern translations follow them: the wicked were buried and “were praised in the city where they had done such things.” On that reading the vanity is that the wicked are honored at their burial in the very place where their deeds were done, which leads into verse 11. A third translation corrects the Hebrew further, reading “approaching to sacrifice” for “buried” and “boast” for “forgotten.”
    sources: [esv, niv, nrsvue]
  - ref: 11
    phrase: sentence against an evil work is not executed speedily
    kind: prophets
    title: Judgment delayed
    body: |
      The Preacher observes that when judgment is slow, people take the delay as permission. The note at [[Isa. 57:11]] sets the verse beside Isaiah's people, who stopped fearing God because He was silent. Beside verses 11–13, which speak of delayed punishment for the wicked, stands the teaching of President Henry B. Eyring on why such effects wait: the effects of choices “are sure. Yet they are often delayed for a purpose. If the blessings were immediate, choosing the right would not build faith.” The delay works the other way too: “since sorrow is also sometimes greatly delayed, it takes faith to feel the need to seek forgiveness for sin early rather than after we feel its sorrowful and painful effects.”

      The Preacher gives his own answer in the next two verses: though a sinner does evil a hundred times, “yet surely I know that it shall be well with them that fear God” (on the fear of God, see [[Eccl. 5:7]]).
    sources: [eyring-priceless-heritage, seminary-ot-teacher-115]
  - ref: 14
    phrase: there be just men, unto whom it happeneth according to the work of the wicked
    kind: scripture
    title: Well with the God-fearing, and yet the just fare as the wicked
    body: |
      Verses 12–14 set what the Preacher knows against what he sees, and he leaves the two side by side. He “surely” knows it shall be well with those who fear God and not with the wicked (verses 12–13); in the next breath he reports that the just are treated “according to the work of the wicked,” or, as a modern translation has it, “the righteous who get what the wicked deserve.” He calls it vanity and goes on (verse 15) without explaining it.

      A Latter-day Saint reading takes the verse as part of what the book is for. Here the author “doubts the world's fairness,” and the book may “serve as a balancing corrective to the widely held assurance, in both ancient and modern times, that God will dependably prosper the righteous and punish the wicked in visible, material ways in mortality.” On another, of the book as a whole, “Sometimes righteousness is not rewarded in this life,” and the book's answer is its end: obeying God is right, “and God will balance things accordingly at final judgement, whether things work out in this life or not” ([[Eccl. 12:13–14]]; on judgment, see [[Eccl. 3:17]]).
    sources: [niv, barlow-public-relations, sc-knowhy-868]
  - ref: 15
    phrase: to eat, and to drink, and to be merry
    kind: scripture
    title: Eat, drink, and be merry
    body: |
      The Preacher's “eat, and … drink, and … be merry” is the gift of God he has praised since [[Eccl. 2:24]], and its words return in two warnings of scripture that mean something else by them. In the Book of Mormon, Nephi foresees false teachers who will say, “Eat, drink, and be merry, for tomorrow we die; and it shall be well with us,” and others who will add, “nevertheless, fear God—he will justify in committing a little sin” ([[2 Ne. 28:7–8]]). The Savior's rich fool says to his soul, “take thine ease, eat, drink, and be merry” ([[Luke 12:19]]), and God answers, “Thou fool, this night thy soul shall be required of thee” ([[Luke 12:20]]).

      The words differ where the meaning does. The Preacher's mirth is received in labor, “which God giveth him,” and it stands right after his certainty that it shall be well only with those who fear God (verses 12–13). Nephi's teachers use the same promises, “it shall be well” and “fear God,” to excuse sin; the rich fool takes his ease on what he has stored up, and both speak with death at hand: “tomorrow we die,” “this night.”

      On one Latter-day Saint reading, the words are “a text quoted in Ecclesiastes 8:15” that is “alluded to in 2 Nephi 28:7,” both perhaps drawing on an older book that was on the plates of brass. The reading assumes that Ecclesiastes was written after Lehi left Jerusalem (on the authorship, see [[Eccl. 1:1]]), and it is offered as a possibility, not a demonstration.
    sources: [lds-scriptures, nrsvue, sc-knowhy-410]
  - ref: 17
    phrase: a man cannot find out the work that is done under the sun
    kind: scripture
    title: The work no one can find out
    body: |
      The Preacher's conclusion is that God's work cannot be searched out by anyone, the wise included: “Even though a wise man claims to know, he cannot find it out,” as a modern translation renders the end of the verse. He has watched the business of the earth day and night, and what he sees is “all the work of God,” and the limit of his own sight. On the limits of wisdom, see [[Eccl. 1:18]]; on “the world” God set in the heart, so that no one “can find out the work that God maketh from the beginning to the end,” [[Eccl. 3:11]].

      A modern translation's cross-references set the verse beside two others that call God's ways unsearchable: God “doeth great things and unsearchable” ([[Job 5:9]]), and Paul's “O the depth of the riches both of the wisdom and knowledge of God! how unsearchable are his judgments, and his ways past finding out!” ([[Rom. 11:33]]).
    sources: [esv, nrsvue]

christ: |
  The Preacher holds two things together in verses 12–14: “it shall be well with them that fear God,” and the just are treated as the wicked, with no judgment yet in sight. Scripture puts that judgment in the Savior's hands: “the Father judgeth no man, but hath committed all judgment unto the Son” ([[John 5:22]]). Paul names what is at stake if the account is settled only under the sun: “If in this life only we have hope in Christ, we are of all men most miserable” ([[1 Cor. 15:19]]).

  The account the Preacher cannot see settled under the sun is in the Son's hands, and “God shall bring every work into judgment” ([[Eccl. 12:14]]). A disciple can keep faith while the reward is delayed, since the delay, as the note at verse 11 gives President Eyring's teaching, is there to build that faith.

explore: |
  - **Judgment delayed.** [[Isa. 57:11]], [[2 Pet. 3:9]] and [[Rom. 2:4–6]].
  - **The righteous who suffer.** [[Eccl. 7:15]], [[Ps. 73:1–17]] and [[Mal. 3:14–18]].
  - **Eat, drink, and be merry.** [[Eccl. 2:24–26]], [[2 Ne. 28:7–9]] and [[Luke 12:15–21]].
  - **Ways past finding out.** [[Isa. 55:8–9]], [[Rom. 11:33–36]] and [[D&C 76:2]].

