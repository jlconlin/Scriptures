chapter: 7
title: Better Is the End of a Thing
tagline: The Preacher sets the harder thing above the easier, mourning above feasting and patience above pride, bids man take good days and bad as God's work, warns against excess either way, and ends his search with one finding, that God made man upright.
when: "The Preacher's reflections"

setting: |
  Chapter 6 ended on two questions: “who knoweth what is good for man in this life,” and “who can tell a man what shall be after him under the sun?” ([[Eccl. 6:12]]). Chapter 7 begins with sayings about what is good, or better. Five of its first eight verses say that one thing is “better” than another, a form one older reading calls a “proverb of that which is better.” The words “after him” come back at verse 14, where God sets good days against bad “to the end that man should find nothing after him.”

  The chapter is partly a string of proverbs. Its subject is what wisdom can do and what it cannot: wisdom “giveth life to them that have it” (verse 12) and strengthens the wise “more than ten mighty men” (verse 19), and yet, the Preacher says, “it was far from me” (verse 23; on wisdom's limits, see [[Eccl. 1:18]]). The second half, verses 13–29, has for its theme “resignation to the will of God.” Two of the book's terms recur and are explained where they first appear: “vanity” (verses 6 and 15) at [[Eccl. 1:2]], and the fear of God (verse 18) at [[Eccl. 5:7]].

thread: |
  This is a string of sayings rather than an argument, but it moves. Verses 1–12 weigh what is **better**, and most of them prefer the harder thing: the day of death to the day of birth, the house of mourning to the house of feasting, sorrow to laughter, the rebuke of the wise to the song of fools, the end of a thing to its beginning, patience to pride. The wise man's heart is in the house of mourning (verse 4). Oppression and the bribe can undo even him (verse 7), and anger lives with fools (verse 9). The run ends on what wisdom gives that money cannot (verses 11–12).

  Verses 13–22 turn to **God's work**. Good days and bad both come from Him, and no one can straighten what He has made crooked (verses 13–14). The Preacher has seen the just man perish and the wicked man live long (verse 15), and he warns against excess either way, with the fear of God over both (verses 16–18). Wisdom makes the wise strong (verse 19), yet no man on earth is just and never sins (verse 20), and no one should listen to everything said of him, since he has cursed others himself (verses 21–22).

  Verses 23–29 report the **search** itself. He set out to be wise and found wisdom far off and deep (verses 23–24). He searched out “the reason of things” and found the woman whose heart is snares, one man in a thousand, and at the end one thing only: “God hath made man upright; but they have sought out many inventions” (verse 29).

sections:
  - range: 1-6
    heading: Better than feasting
    plain: |
      A good name is better than precious ointment, and the day of death better than the day of birth. It is better to go to a house where someone has died than to a house of feasting, because death is the end of everyone, and the living should take it to heart. Sorrow is better than laughter, for a sad face can make the heart better. The wise keep their hearts in the house of mourning; fools keep theirs in the house of merriment. It is better to listen to a wise man's rebuke than to the songs of fools, for a fool's laughter is like thorns crackling under a pot. That too is a passing breath.
  - range: 7-12
    heading: What wisdom gives
    plain: |
      Oppression turns a wise man into a fool, and a bribe corrupts the heart. The end of a thing is better than its beginning, and the patient in spirit are better than the proud. Don't be quick to anger, for anger lives in the heart of fools. Don't ask why the old days were better than these; it is not wisdom that asks that. Wisdom is good together with an inheritance, and it profits everyone who sees the sun. Wisdom shelters a man, and money shelters him, but knowledge has this advantage: wisdom keeps its owner alive.
  - range: 13-14
    heading: Good days and bad
    plain: |
      Consider what God has done: who can straighten what He has made crooked? When times are good, be glad; when they are bad, think: God has set the one beside the other, so that man can find out nothing that comes after him.
  - range: 15-18
    heading: Neither extreme
    plain: |
      In my fleeting life I have seen everything: a righteous man who perishes in his righteousness, and a wicked man who lives long in his wickedness. Don't be righteous to excess, and don't make yourself too wise; why ruin yourself? Don't be wicked to excess, and don't be a fool; why die before your time? It is good to hold on to the one and not let go of the other, for whoever fears God will come out of them all.
  - range: 19-22
    heading: No one without sin
    plain: |
      Wisdom makes the wise man stronger than ten mighty men in a city. Yet there is no righteous man on earth who does good and never sins. Don't pay attention to everything people say, or you may hear your servant curse you; you know in your own heart that you have often cursed others.
  - range: 23-29
    heading: What the search found
    plain: |
      I tested all this by wisdom. I said, “I will be wise,” but it was far from me. What is, is far off and very deep; who can find it out? I set my heart to know, to search, to seek out wisdom and the reason of things, and to know the wickedness of folly and the madness of foolishness. And I find more bitter than death the woman whose heart is snares and nets and whose hands are chains; the man who pleases God escapes her, but the sinner is caught by her. “See, this is what I found,” says the Preacher, “adding one thing to another to find the sum, which I am still seeking and have not found: one man among a thousand I found, but a woman among all these I did not find. See, this only have I found: God made man upright, but they have sought out many schemes.”

notes:
  - ref: 2
    phrase: It is better to go to the house of mourning
    kind: history
    title: The house of mourning
    body: |
      The house of mourning is a home where someone has died, and to go there was to visit the family and comfort them. In one older reading, “A house is meant in which there is sorrow on account of a death; the lamentation continued for seven days,” and the going is “a visit for the purpose of showing sympathy and of imparting consolation,” as the Jews came to comfort Mary at Bethany ([[John 11:31]]). Verse 1 has just set the day of death above the day of birth, and this verse gives the reason the house of mourning is better than a feast: death “is the end of all men; and the living will lay it to his heart,” that is, the survivor takes to heart “that he too must die.”

      Verse 3 goes further: “by the sadness of the countenance the heart is made better,” which modern translations render “the heart is made glad.” The same older reading finds this “still more in the spirit of the N.T.,” and sets beside it the Savior's “Woe unto you that laugh now! for ye shall mourn and weep” ([[Luke 6:25]]).

      A reader who remembers the Preacher's counsel to eat, drink and enjoy one's labor ([[Eccl. 2:24]]) will wonder how the two fit. They have long puzzled readers: how this saying agrees with that one “the Talmudists have been utterly perplexed to discover.” The Preacher sets the house of mourning here and eating and drinking there, and does not reconcile them.
    sources: [delitzsch-ecclesiastes, nrsvue, esv]
  - ref: 6
    phrase: as the crackling of thorns under a pot
    kind: symbol
    title: Thorns under a pot
    body: |
      The fool's laughter is compared to a sound: thorns crackling as they burn under a cooking pot. Hebrew has two nouns written with the same letters, *sir*, “pot,” and *sir*, “thorn,” and the line uses both: the *sirim*, thorns, under the *sir*, the pot. In the Hebrew the phrase is “the sound of thorns (crackling as they burn) under the pot.” The Preacher closes the image with his word for such laughter, “vanity,” a breath that is gone (see [[Eccl. 1:2]]).
    sources: [bdb]
  - ref: 7
    phrase: a gift destroyeth the heart
    kind: scripture
    title: A gift that blinds
    body: |
      The “gift” is a bribe, as modern translations render it: “a bribe corrupts the heart.” One of them sets beside the line the Law's command to judges: “thou shalt not wrest judgment; thou shalt not respect persons, neither take a gift: for a gift doth blind the eyes of the wise, and pervert the words of the righteous” ([[Deut. 16:19]]). For “mad” in the first line the Church's footnote gives “a fool,” and a modern translation reads “oppression makes the wise foolish.”
    sources: [nrsvue, niv, esv, lds-scriptures]
  - ref: 12
    phrase: wisdom giveth life to them that have it
    kind: scripture
    title: Wisdom that gives life
    body: |
      Wisdom and money both shelter a man, the Preacher says, but only wisdom keeps him alive. Modern translations read it so: wisdom “preserves the life of him who has it.” What the King James calls “the excellency of knowledge” is *yitron*, “advantage,” the same word as the “profit” the Preacher asked about at the start, “What profit hath a man of all his labour?” ([[Eccl. 1:3]]).

      In this verse the Preacher “comes close to the truth expressed in Doctrine and Covenants 130:17–19.” The revelation carries wisdom's advantage past the grave: “Whatever principle of intelligence we attain unto in this life, it will rise with us in the resurrection,” and the person who gains more knowledge “through his diligence and obedience” will “have so much the advantage in the world to come” ([[D&C 130:18–19]]).
    sources: [esv, biblehub-interlinear, ot-manual-proverbs, lds-scriptures]
  - ref: 14
    phrase: to the end that man should find nothing after him
    kind: words
    title: Good days and bad, from God
    body: |
      Verses 13–14 counsel submission to what God sends, “a proverb of devout submission to the providence of God,” in one older reading. No one can straighten what God has made crooked (compare [[Eccl. 1:15]]); in the good day be glad, and in the bad day “consider: God also hath set the one over against the other.” The same reading sets beside it Job's answer to his wife: “shall we receive good at the hand of God, and shall we not receive evil?” ([[Job 2:10]]).

      The last clause is hard, and readings divide. Modern translations take “after him” as the future: “no one can discover anything about their future,” or “so that mortals may not find out anything that comes after them.” The older reading holds that the phrase always means “after his present life,” and reads the clause so: “God causes man to experience good and evil that he may pass through the whole school of life, and when he departs hence that nothing may be outstanding (in arrears) which he has not experienced.” Both readings agree that God has made the good day and the bad alike.
    sources: [delitzsch-ecclesiastes, niv, nrsvue]
  - ref: 15
    phrase: there is a just man that perisheth in his righteousness
    kind: scripture
    title: The just man that perisheth
    body: |
      The Preacher reports what he has seen, and he does not soften it: the just man perishes in his righteousness, and the wicked man lives long in his wickedness. He says it again at [[Eccl. 8:14]]. A Latter-day Saint study of the book as a whole says that “Sometimes righteousness is not rewarded in this life,” and offers as one summary of its message that “doing the right thing does not always work out the way one might hope, but we ought to do the right thing anyway,” since “God will balance things accordingly at final judgement, whether things work out in this life or not” (the judgment is the subject of [[Eccl. 3:17]]).

      Another asks whether the book, like Job, might “serve as a balancing corrective to the widely held assurance, in both ancient and modern times, that God will dependably prosper the righteous and punish the wicked in visible, material ways in mortality.” The Savior observed the same of His Father, who “maketh his sun to rise on the evil and on the good, and sendeth rain on the just and on the unjust” ([[Matt. 5:45]]).
    sources: [sc-knowhy-868, barlow-public-relations]
  - ref: 16
    phrase: Be not righteous over much
    kind: words
    title: Righteous over much
    body: |
      The warning is against excess, as modern translations render it: “Do not be too righteous, and do not act too wise,” or “Do not be overrighteous, neither be overwise.” It follows directly on the just man who “perisheth in his righteousness” (verse 15), and the question that ends it, “why shouldest thou destroy thyself?”, names the danger. In one older reading, righteousness and wisdom “are good and wholesome, and worth striving for; but even in these a transgressing of the right measure is possible,” so that a man “becomes a caricature, and either perishes rushing from one extreme into another, or is removed out of the way by others whose hatred he provokes.”

      Verse 17 is the hard half: “Be not over much wicked.” The same reading denies that it allows a little sin, since that “would be immoral,” because “‘sinning,’ in all circumstances, is an act which carries in itself its own sentence of condemnation.” It hears instead “be not a narrow rigorist, - enjoy life, accommodate thyself to life; but let not the reins be too loose.” Verse 18 puts both warnings under the fear of God (on the phrase, see [[Eccl. 5:7]]): “he that feareth God shall come forth of them all.” Modern translations differ on the line: “Whoever fears God will avoid all extremes,” or “the one who fears God shall succeed with both”; the older reading, that he “will acquit himself of the one as well as of the other.”
    sources: [nrsvue, niv, delitzsch-ecclesiastes]
  - ref: 26
    phrase: the woman, whose heart is snares and nets, and her hands as bands
    kind: symbol
    title: Snares, nets and bands
    body: |
      The woman of verse 26 is drawn as a trap, with snares and nets for a heart and fetters for hands. Modern translations read “the woman who is a trap” or “the woman who is a snare,” and the Church's footnotes point to two lines of Proverbs about the strange woman, whose “end is bitter as wormwood” ([[Prov. 5:4]]) and of whom “None that go unto her return again” ([[Prov. 2:19]]; on her, see [[Prov. 2:16]]). The verse itself makes escape a matter of standing with God: “whoso pleaseth God shall escape from her; but the sinner shall be taken by her.”

      Verse 28 is harder: “one man among a thousand have I found; but a woman among all those have I not found.” A modern translation reads it with “upright” in both halves: “one upright man among a thousand, but not one upright woman.” The search then ends in verse 29 with the one thing he is sure of, and it is said of everyone: “God hath made man upright; but they have sought out many inventions,” which another modern translation renders “God made human beings straightforward, but they have devised many schemes.”
    sources: [nrsvue, niv, lds-scriptures]

christ: |
  The Preacher finds that “there is not a just man upon earth, that doeth good, and sinneth not” (verse 20). Paul says the same, “all have sinned, and come short of the glory of God,” and then says what the Preacher does not: they are “justified freely by his grace through the redemption that is in Christ Jesus” ([[Rom. 3:23–24]]). Lehi teaches that “there is no flesh that can dwell in the presence of God, save it be through the merits, and mercy, and grace of the Holy Messiah” ([[2 Ne. 2:8]]).

  No disciple is made safe by being righteous enough, since none “doeth good, and sinneth not.” The way into God's presence is the merits, mercy and grace of Christ.

explore: |
  - **Applying the heart.** Abinadi's charge to the priests of Noah, “ye have not applied your hearts to understanding” ([[Mosiah 12:27]]), takes up the wisdom books' phrase that the Preacher uses in verse 25, as does [[Ps. 90:12]].

