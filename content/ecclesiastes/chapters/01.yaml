chapter: 1
title: No New Thing under the Sun
tagline: The Preacher gives the book its motto, “all is vanity,” and asks what a man gains from all his labor. The generations, the sun, the wind and the rivers go round and arrive nowhere; then, speaking as king, he turns his wisdom on the world and finds that more knowledge brings more sorrow.
when: 'The Preacher, speaking as a son of David, king in Jerusalem'

setting: |
  “Ecclesiastes” is the Greek rendering of the book’s Hebrew name for its speaker, which the King James renders “the Preacher.” He calls himself “the son of David, king in Jerusalem,” and never gives his name; the note on verse 1 takes up the name and who he was. In 1:1–11, and again in 12:8–14, the text speaks of him in the third person, which “may suggest that someone other than the preacher compiled his writings and teachings sometime after they were given.” Between those two frames he speaks as “I.”

  Chapters 1–2 are the book’s first part: the Preacher states that everything in this life is fleeting and tells of his “futile efforts” to find meaning “through worldly means.” The book is a collection of poems and sayings “shaped into a single treatise,” and verses 2–11 are its motto. The Preacher is a believer who “often poses questions and makes statements as if he were not,” so what he says here is read in the light of the book’s conclusion, “Fear God, and keep his commandments” ([[Eccl. 12:13]]).

thread: |
  The chapter states a verdict and a question, and then tests the question twice. The verdict is verse 2: everything is a breath. The question is verse 3: what does a man have left over from all his work under the sun?

  The first test is the world itself (verses 4–11). Generations, sun, wind and rivers go round and arrive nowhere, and verse 8 sums them up. Verses 9–11 carry the same round into human history: what has been will be. The claim invites the objection “See, this is new,” and verse 10 meets it with “it hath been already of old time”; verse 11 adds that nothing past is remembered, and nothing to come will be.

  The second test is the Preacher’s own search (verses 12–18). Speaking as king, he sets out to search out by wisdom everything done under heaven, and he names God as the one who gave men this heavy task. He finds the chapter’s first “vexation of spirit” (verse 14), a proverb that what is crooked cannot be straightened (verse 15), and that the wisdom he has gathered beyond all before him brings grief in proportion (verse 18). The search goes on into chapter 2.

sections:
  - range: 1
    heading: The title
    plain: |
      These are the words of the Preacher, the son of David, king in Jerusalem.
  - range: 2-8
    heading: All is a breath, and nothing comes to rest
    plain: |
      “Breath of breaths,” says the Preacher, “breath of breaths; everything is a breath.” What does a person gain from all the work he labors at under the sun? One generation goes and another comes, but the earth stays for ever. The sun rises and the sun sets, and hurries back to the place where it rises. The wind blows south and turns north; round and round it goes, and comes back again on its circuit. All the rivers run into the sea, yet the sea is never full; to the place the rivers come from, there they go again. All things are wearied with their labor, more than anyone can tell. The eye is never satisfied with seeing, nor the ear filled with hearing.
  - range: 9-11
    heading: Nothing new, nothing remembered
    plain: |
      What has been is what will be, and what has been done is what will be done; there is nothing new under the sun. Is there anything of which someone can say, “Look, this is new”? It was already here long ago, in the ages before us. Former things are not remembered, and things yet to come will not be remembered by those who come after.
  - range: 12-15
    heading: The king’s search begins
    plain: |
      I, the Preacher, was king over Israel in Jerusalem. I set my heart to seek out and explore by wisdom everything that is done under heaven: it is an unhappy business that God has given people to be busy with. I have seen all the works that are done under the sun, and all of it is a breath and a striving after wind. What is crooked cannot be made straight, and what is missing cannot be counted.
  - range: 16-18
    heading: More wisdom, more sorrow
    plain: |
      I said to myself, “I have become great, and I have gained more wisdom than all who were in Jerusalem before me; my heart has seen much of wisdom and knowledge.” So I set my heart to know wisdom, and to know madness and folly, and I saw that this too is a striving after wind. For with much wisdom comes much grief, and whoever increases knowledge increases sorrow.

notes:
  - ref: 1
    phrase: The words of the Preacher
    kind: history
    title: Who the Preacher is
    body: |
      The Preacher is a son of David and a king who never gives his name. Little is known about him “beyond his own description of himself.”

      His title, *Qoheleth*, is the word the book is named for: it means “one who convenes an assembly,” and “Ecclesiastes” is the Septuagint’s Greek rendering of it. Other possible renderings are “Assembler” and “Teacher,” and the word can also mean “collector (of sentences).” The book’s closing verses describe his work: “he still taught the people knowledge; yea, he gave good heed, and sought out, and set in order many proverbs” ([[Eccl. 12:9]]).

      He is “traditionally thought to be King Solomon,” and one Latter-day Saint reading takes the phrases of verses 1, 12 and 16 (a son of David, king over Israel in Jerusalem, wiser than all before him there) as evidence that he was. A Latter-day Saint scholar grants that such phrases “are intended to imply such a connection,” but points out that “his name is never actually mentioned in Ecclesiastes.” Because “the style and language of the book are generally seen as deriving from later in Israelite history,” he adds, biblical scholars tend to assign it to an unknown writer “five to seven centuries after Solomon.”
    sources: [seminary-intro-eccl, bd-ecclesiastes, pike-spirit-eccl, bdb, scripture-helps-proverbs, ot-minute-ecclesiastes, lds-scriptures]

  - ref: 2
    phrase: Vanity of vanities
    kind: words
    title: Vanity is a vapor
    body: |
      “Vanity” in Ecclesiastes is not conceit but a breath. The Hebrew *hebel* “is not about pride in one’s appearance”; it means “something more like ‘mist’ or ‘vapor,’ ‘a puff of air.’” It is the word of [[Ps. 39:5]], where “everyone stands as a mere breath” (see the note there).

      In life, much is “like a person attempting to hold on to vapor with their hands: an impossible task.” The same cry returns at [[Eccl. 12:8]], so that the Preacher’s thought “begins and ends with a lament about human aspirations and human affairs.” Read that way, the motto may carry the sense “Life is as a fleeting vapor, which cannot be grasped.”

      This sense can be set beside Jacob’s farewell in the Book of Mormon, “our lives passed away like as it were unto us a dream” ([[Jacob 7:26]]). The comparison is a Latter-day Saint scholar’s proposal, not a claim that Jacob had Ecclesiastes in mind.
    sources: [sc-knowhy-868, barlow-public-relations]

  - ref: 3
    phrase: under the sun
    kind: symbol
    title: Under the sun
    body: |
      “Under the sun” is the frame of the whole book: the Preacher looks at life as it appears from the earth, and the bleakness of what he finds belongs to that view. The phrase is “another way of saying ‘during mortality,’” and the book “seems permeated with a pessimistic flavor but must be read in the light of” this phrase, meaning “from a worldly point of view.”

      The question the phrase frames is about “profit.” The Hebrew *yitron*, “advantage, profit,” is a word found only in Ecclesiastes, and the verse asks what advantage a man has from all his labor in this life.
    sources: [seminary-ot-teacher-115, bd-ecclesiastes, bdb]

  - ref: 4
    phrase: One generation passeth away, and another generation cometh
    kind: symbol
    title: The round of the world
    body: |
      On one older reading, the generations, the sun, the wind and the rivers of verses 4–7 are the Preacher’s first answer to his question: the world and the people in it move without rest and arrive nowhere. On that reading, the earth that “abideth for ever” is no comfort, since men pass while the ground under them stays: its stability “appears to him only as the foil of the growth and decay everlastingly repeating themselves.” The sun is “a second example of ceaseless change with perpetual sameness.” “Hasteth” in verse 5 renders a word meaning “panting, hastening,” part of the same restless motion. The wind and the rivers go round and come back.

      Verse 8 sums up the four pictures. On the same reading, “All things are full of labour” does not mean that they are wearisome to describe: the Hebrew word “does not denote that which causes weariness, but that which suffers weariness.” Everything is “restless, hastening on, giving the impression of fatigue.” And “to the unrest of things without corresponds the unrest of the mind”: the eye and the ear that are never satisfied are caught up in the same motion, “so that we also find no rest and contentment.”
    sources: [delitzsch-ecclesiastes]

  - ref: 14
    phrase: vexation of spirit
    kind: words
    title: Striving after wind
    body: |
      “Vexation of spirit” is “now often rendered as ‘striving after wind,’” the book’s phrase for an effort that comes to nothing. The “spirit” is *ruach* in its sense of wind, not the human spirit: the same word “clearly refers to the wind” in verse 6. The first word means “longing, striving.”

      Verse 15 confirms the verdict with a proverb: what is crooked cannot be made straight, and what is lacking cannot be counted. On one older reading it speaks of what the searcher finds in labor and research under the sun: wisdom shows him what is wrong in the world, but “with all his wisdom he can bring no help.”
    sources: [lds-scriptures, bdb, pike-spirit-eccl, delitzsch-ecclesiastes]

  - ref: 18
    phrase: in much wisdom is much grief
    kind: scripture
    title: Wisdom that brings grief
    body: |
      The Preacher’s last finding in the chapter is that the more he knows, the more he grieves. Here the book parts from Proverbs. Proverbs’ message is that if you seek wisdom, “especially God’s wisdom—life will go well”; Ecclesiastes “seems to say, ‘It’s not that simple,’” and the Preacher who “gave [his] heart to know wisdom” but still found “much grief” is the example. Wisdom literature generally holds that “‘wise’ and principled living brings happiness, contentment, and prosperity,” and Ecclesiastes, “more than other biblical literature,” stresses “the challenge and frustration of finding meaning in mortal life.” (What wisdom is in Proverbs is taken up at [[Prov. 1:2]].)

      This is not the book’s last word on wisdom. The two books look at life from different perspectives, yet they “teach similar truths,” and Ecclesiastes ends in the book’s conclusion, to fear God and keep His commandments ([[Eccl. 12:13]]).
    sources: [cfm-ot-2026-37, pike-spirit-eccl]

christ: |
  The Preacher asks what remains to a man when everything under the sun passes, and his book is written not “to grind us down between futility and despair but to help us remember that there is meaning only through God and keeping His commandments.” The Church’s footnote sets his question about “profit” beside the Savior’s question of what a man is profited if he gains the whole world and loses his own soul ([[Matt. 16:26]]), and beside Jacob’s warning against spending “your labor for that which cannot satisfy” ([[2 Ne. 9:51]]). Beside the Preacher’s “under the sun,” Paul names both the limit of a hope that stops at this life and what lies past it: “If in this life only we have hope in Christ, we are of all men most miserable. But now is Christ risen from the dead, and become the firstfruits of them that slept” ([[1 Cor. 15:19–20]]).

  For a disciple, work, learning and the passing generations still go by like a breath. Jacob names what lasts instead: to “come unto the Holy One of Israel, and feast upon that which perisheth not, neither can be corrupted” ([[2 Ne. 9:51]]). What the Preacher could not find under the sun is found in Christ, who rose from the dead as the firstfruits of all who die.

explore: |
  - **Life as a breath.** [[Ps. 39:4–6]], with the same word *hebel*.
  - **The book as a whole.** “Ecclesiastes Has a Public Relations Problem” (Maxwell Institute, *Old Testament Reflections*, 2026), a short essay on reading the book’s poetry and its uncertainty within the gospel.

