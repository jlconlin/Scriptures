chapter: 3
title: A Season for Everything
tagline: The Preacher sets every human act beside its opposite in a poem of times, finds that God has made each beautiful in its time and put eternity in the heart, sees wickedness where judgment should be, and watches man and beast go to the same dust.
when: 'The Preacher’s reflections'

setting: |
  Chapter 3 opens the long middle of the book. In chapters 1–2 the Preacher, speaking as king, tried wisdom, pleasure and great works and called them all “vanity” (see [[Eccl. 1:2]]), and he ended with the thought that to eat, drink and enjoy one’s labor is “from the hand of God” ([[Eccl. 2:24]]). Chapters 3–10 work through many examples to show that worldly wealth does not last and that frustration in this life cannot be avoided.

  Here the Preacher looks at time. The chapter has three parts: a poem of times (verses 1–8), his reflection on what God has set in them (verses 9–15), and what he saw of injustice and of death (verses 16–22). Its point is that good and bad come to everyone, and that the works of man pass while the works of God are eternal.

  Its opening lines are “among those most often quoted from Ecclesiastes.”

thread: |
  The Preacher begins with a list. Everything has its time, and he sets the times in pairs: born and die, plant and uproot, kill and heal, weep and laugh, war and peace (verses 1–8). The poem says nothing of who sets them, and his first question afterward is the question of chapter 1: what does a worker gain from his labor (verse 9)?

  His answer turns toward God. God gives men their work, has made everything beautiful in its time, and has set eternity in their hearts, though no one can trace His work from beginning to end (verses 10–11). So the best a man can do is rejoice, do good, and take his food and labor as God’s gift (verses 12–13). Then he speaks of God’s own work: what God does lasts for ever, nothing can be added to it or taken from it, and He does it so that men will fear Him (verses 14–15).

  Then he looks back at the world. In the place of judgment, where justice should be, he sees wickedness, and he consoles himself that God will judge the righteous and the wicked, for that too has its time (verses 16–17). But death makes no such distinction: man and beast die alike, share one breath, go to one dust, and no one can see where the breath goes (verses 18–21). He ends where chapter 2 ended. A man should rejoice in his work, for no one can show him what comes after (verse 22).

sections:
  - range: 1-8
    heading: A time for everything
    plain: |
      Everything has its appointed time, and every undertaking under heaven has its time. A time to be born and a time to die; a time to plant and a time to pull up what was planted. A time to kill and a time to heal; a time to tear down and a time to build up. A time to weep and a time to laugh; a time to mourn and a time to dance. A time to throw stones away and a time to gather stones together; a time to embrace and a time to hold back from embracing. A time to seek and a time to lose; a time to keep and a time to throw away. A time to tear and a time to sew; a time to be silent and a time to speak. A time to love and a time to hate; a time of war and a time of peace.
  - range: 9-15
    heading: What God has set in the heart
    plain: |
      What does a worker gain from all his labor? I have seen the labor God has given people to be occupied with. He has made everything beautiful in its time. He has also set eternity in their hearts, and yet no one can find out the work God does from beginning to end. I know there is no good for them except to rejoice and to do good as long as they live; and that everyone should eat and drink and enjoy the good of all his labor: that is God’s gift. I know that whatever God does lasts for ever; nothing can be added to it and nothing taken from it, and God has done it so that people will fear before Him. What is now has already been, and what is to come has already been, and God seeks out what has gone by.
  - range: 16-22
    heading: Judgment, and the one breath of man and beast
    plain: |
      And I saw something more under the sun: in the place of justice, wickedness was there; in the place of righteousness, wickedness was there too. I said to myself, “God will judge the righteous and the wicked, for there is a time there for every undertaking and every deed.” I said to myself about people that God is testing them, to show them that they are like animals. For what happens to people happens to animals; the same thing happens to both. As one dies, so does the other. They all have the same breath, and a man has no advantage over an animal, for everything is fleeting. All go to one place; all came from the dust, and all return to dust. Who knows about the spirit of man, that it goes upward, and the spirit of an animal, that it goes down into the earth? So I saw that there is nothing better than for a man to rejoice in his work, for that is his share. Who can bring him to see what will happen after him?

notes:
  - ref: 1
    phrase: To every thing there is a season
    kind: structure
    title: Times that God appoints
    body: |
      The poem opens with a word for appointed time, and the verses that follow it say who appoints the times. “Season” is *zeman*, a late Hebrew word for an “appointed time.” The poem itself names no one. It sets each human act beside its opposite, from birth and death to war and peace, and stops.

      The reflection that follows supplies the missing name. “He hath made every thing beautiful in his time” (verse 11); what God does “shall be for ever: nothing can be put to it, nor any thing taken from it” (verse 14); and when the Preacher turns to injustice he repeats the poem’s own words at God’s judgment, “for there is a time there for every purpose and for every work” (verse 17). In these verses the book does “indicate that God is in control,” while “the inscrutability of God and his ways in this difficult world is repeatedly underscored.”
    sources: [oshb-wlc, bdb, pike-spirit-eccl]

  - ref: 5
    phrase: A time to cast away stones, and a time to gather stones together
    kind: symbol
    title: Casting and gathering stones
    body: |
      Throwing stones and gathering them may be the ruining of a field and the clearing of one, though the text does not explain the line. On one older reading, “by the throwing of stones a field is destroyed,” as Israel’s armies did to Moab: they were to “mar every good piece of land with stones” ([[2 Kgs. 3:19]]), and “on every good piece of land cast every man his stone, and filled it” ([[2 Kgs. 3:25]]). By “gathering the stones together and removing them,” the same field “is brought under cultivation.”

      On that reading the second half of the verse is a contrast of the same kind: “the loving action of embracing stands beside the hostile, purposely injurious throwing of stones into a field.”
    sources: [delitzsch-ecclesiastes, lds-scriptures]

  - ref: 11
    phrase: he hath set the world in their heart
    kind: words
    title: Eternity in their heart
    body: |
      “The world” translates *ha’olam*, a word whose ordinary sense is “long duration, antiquity, futurity.” Modern translations such as the NIV and ESV read “eternity” here: “He has also set eternity in the human heart; yet no one can fathom what God has done from beginning to end.” Another has “a sense of past and future into their minds.” The King James “world” has support too: “age (duration) of the world” is one sense the word can have in this verse, and the Septuagint reads “he has also set the whole world in their heart.”

      The word comes back three verses later. Whatever God does “shall be for ever” (verse 14) is *le’olam*, the same word, used there of what God Himself does and of His lasting existence. So the verse holds two things together: every thing has its own time, and man has been given a sense of what outlasts every time, without the power to see God’s work “from the beginning to the end.”

      The line is heard in two ways. On one reading it “seems to mourn that God has implanted a sense of the eternal and the divine inside human consciousness, but left us yearning, orphaned, and ignorant.” On another it is a limit set by God for this life, so that “the natural man will not be able to comprehend all God’s works while in this mortal life.”
    sources: [oshb-wlc, bdb, niv, esv, nrsvue, lxx-rahlfs, barlow-public-relations, ot-minute-ecclesiastes]

  - ref: 15
    phrase: God requireth that which is past
    kind: words
    title: God seeks what has gone by
    body: |
      The last line of verse 15, that God seeks what has gone by, is uncertain in the Hebrew. Read word for word, it says that God seeks *nirdaf*, “the pursued,” a word explained here as “what has disappeared, is past,” though that sense is marked “dubious.” The King James “that which is past” takes that sense, and so does the rendering “God seeks out what has gone by.”

      On that reading the line finishes the thought of the first half: what is now has been before, what will be has been already, and what has gone into the past God “calls back.” Another rendering hears judgment instead: “God will call the past to account.”
    sources: [oshb-wlc, bdb, nrsvue, niv]

  - ref: 17
    phrase: God shall judge the righteous and the wicked
    kind: scripture
    title: God shall judge
    body: |
      The Preacher’s answer to the injustice he saw is that God will judge, and this is the first time the book says so. Verse 16 is a plain complaint: “under the sun” (see [[Eccl. 1:3]]), in the very places where justice should be done, “wickedness was there.” Then he finds “some consolation in God’s eventual just judgment.” The judgment has its own “time,” and the next verses turn straight to death.

      The book comes back to God’s judgment near its end. To the young man: “but know thou, that for all these things God will bring thee into judgment” ([[Eccl. 11:9]]). And at the very end: “For God shall bring every work into judgment, with every secret thing, whether it be good, or whether it be evil” ([[Eccl. 12:14]]). Chapters 11–12 draw the book’s conclusion from it: what has “lasting and permanent value” is obedience to God’s commandments, because all things will be examined in God’s judgment.
    sources: [pike-spirit-eccl, bd-ecclesiastes, lds-scriptures]

  - ref: 19
    phrase: yea, they have all one breath
    kind: words
    title: One breath for man and beast
    body: |
      What man and beast share, in verses 18–21, is *ruach*, the breath of life, and the Preacher’s point is that death treats them alike. Verse 18 sets it up: “that God might manifest them” means “that God may prove them,” or in another rendering, “God is testing them to show that they are but animals.” In verse 19 the word for “breath” is singular, “not ‘spirits of,’” and so the King James and most modern translations read “breath” there. In one Latter-day Saint reading, *ruach* in all three of its uses in these verses is “the life breath or animating essence that all humans and animals have until death,” and that here it “was not used to indicate spirit personages.”

      Verse 21 can be read two ways in the Hebrew. The Septuagint and modern translations make it a question about direction: “Who knows whether the spirit of man goes upward and the spirit of the beast goes down into the earth?” The vowel marks of the Hebrew text read it as the King James does, “the spirit of man that goeth upward.” On one older reading, “all the old translators” took it as a question, and the vowel marks are meant “to place that which is here said in accord with Ecclesiastes 12:7.” Either way the line opens with “Who knoweth.” Read as the King James reads it, the spirit of man goes “upward,” “presumably meaning to God.” Whether the spirit returns to God, and how the Church reads the verse that says so, is the subject of [[Eccl. 12:7]]; what the Preacher says of the dead is taken up at [[Eccl. 9:5]].

      Verse 22 draws his conclusion. On the same older reading, “what shall be after him” is what comes after death: “What will be after death is thus withdrawn from human knowledge. Thus it is best to enjoy the present.”
    sources: [bdb, nrsvue, esv, oshb-wlc, pike-spirit-eccl, lxx-rahlfs, delitzsch-ecclesiastes]

christ: |
  The Preacher saw wickedness in “the place of judgment” and trusted that “God shall judge the righteous and the wicked” (verses 16–17). The New Testament names the Judge: “For the Father judgeth no man, but hath committed all judgment unto the Son” ([[John 5:22]]). Beside “all are of the dust, and all turn to dust again” (verse 20) stands Paul’s “For as in Adam all die, even so in Christ shall all be made alive” ([[1 Cor. 15:22]]).

  Wrongs left standing in the place of judgment are left to the Son, who will judge them. The dust that takes man and beast alike is not the end for those who are made alive in Christ.

explore: |
  - **Judgment in Ecclesiastes.** [[Eccl. 11:9]] and [[Eccl. 12:13–14]], where the book ends.
  - **Dust and breath.** [[Gen. 2:7]], [[Gen. 3:19]], [[Ps. 49:12]] and [[Eccl. 12:7]].

