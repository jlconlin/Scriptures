chapter: 12
title: Remember Now Thy Creator
tagline: The Preacher’s last words call the young to remember their Creator before old age comes, pictured as a house falling into ruin, and death, when the dust returns to the earth and the spirit to God. Then another voice sums up his work and the whole matter, to fear God and keep His commandments, for God will judge every work.
when: 'The Preacher’s last words, and the epilogue'

setting: |
  Chapter 12 finishes a call that begins at [[Eccl. 11:9]], where the Preacher tells the young man to rejoice in his youth and to know that God will bring him into judgment. Its first seven verses are the Preacher’s closing words, and they “emphasize the long, dark days of misery encountered in old age and the inevitability of the grave.” Verse 8 repeats the cry of [[Eccl. 1:2]], now with “saith the preacher,” and from there the book speaks about him rather than in his voice: what follows in 12:8–14 “is not presented as the Teacher’s words” (the note on verse 9 takes up who is speaking). These last verses carry the book’s weight in the Church’s reading: the only work of lasting value is obedience to God’s commandments, because one day we will die and God will judge how we lived.

thread: |
  Verses 1–7 form one long sentence, and the chapter ends with a verdict. The sentence calls the young to remember their Creator before what comes after youth: the darkening sky, the house whose keepers tremble and whose windows grow dim, the almond tree in blossom, the broken cord and bowl. It ends where a life ends: the dust goes back to the earth, and the spirit to God (verse 7).

  Verse 8 gives the motto of [[Eccl. 1:2]] once more, in a voice that speaks of “the preacher,” and that voice goes on in verses 9–12. The Preacher was wise, taught the people, set proverbs in order, and wrote what was upright and true. The words of the wise goad and hold firm, and beyond them books go on without end. The last two verses give “the conclusion of the whole matter”: fear God, keep His commandments, for God will bring every work into judgment. The judgment the Preacher first named in [[Eccl. 3:17]] and promised the young man in [[Eccl. 11:9]] is the book’s last word.

sections:
  - range: 1-2
    heading: Remember before the evil days
    plain: |
      Remember your Creator while you are young, before the bad days come and the years draw near when you will say, “I take no pleasure in them”; before the sun and the light, the moon and the stars grow dark, and the clouds come back after the rain.
  - range: 3-5
    heading: The house in ruins
    plain: |
      It will be the day when the keepers of the house tremble, the strong men are bent, the grinders stop because they are few, and those who look out through the windows grow dim. The doors to the street are shut and the sound of the mill is low; one wakes at the voice of a bird, and all the singers are hushed. One is afraid of heights, and there are terrors on the road; the almond tree blossoms, the grasshopper becomes a burden, and desire fails. For man is going to his everlasting home, and the mourners go about the streets.
  - range: 6-7
    heading: Dust to the earth, the spirit to God
    plain: |
      Remember Him before the silver cord is loosed and the golden bowl broken, before the pitcher is shattered at the spring and the wheel broken at the well; and the dust goes back to the earth as it was, and the spirit goes back to God who gave it.
  - range: 8
    heading: All is vanity
    plain: |
      “Vanity of vanities,” says the Preacher, “all is vanity.”
  - range: 9-12
    heading: The Preacher and the words of the wise
    plain: |
      More than that: because the Preacher was wise, he went on teaching the people what he knew. He weighed, searched out and set in order many proverbs. The Preacher looked for words of delight, and what he wrote was upright, words of truth. The words of the wise are like goads, and the collected sayings are like nails driven firm; they are given by one shepherd. Beyond these, my son, take warning: there is no end to the making of many books, and much study wears out the body.
  - range: 13-14
    heading: The end of the matter
    plain: |
      Here is the end of the matter, now that all has been heard: Fear God and keep His commandments, for this is the whole duty of everyone. God will bring every deed into judgment, with every hidden thing, whether good or evil.

notes:
  - ref: 1
    phrase: Remember now thy Creator in the days of thy youth
    kind: structure
    title: Remember before
    body: |
      Verses 1–7 are a single sentence built on one command, to remember the Creator while young, and on three “befores.” The Hebrew *‘ad asher lo*, literally “until … not,” opens the clause in verse 1 (“while the evil days come not”), in verse 2 (“while the sun … be not darkened”) and in verse 6 (“or ever the silver cord be loosed”); a modern translation renders all three “before.” The picture of decline in verses 2–6 hangs on that one command, and the sentence closes in verse 7, at death.

      The “evil days” are old age, with “the lamentable burdens of those who live to older age, in which there is ‘no pleasure.’” The command comes straight after the Preacher’s counsel to the young man to rejoice in his youth, knowing that God will bring him into judgment ([[Eccl. 11:9]]). Chapter 12 can be read as continuing that counsel, for youth to find joy in that time of life “before old age takes over.”
    sources: [oshb-wlc, nrsvue, pike-spirit-eccl, ot-minute-ecclesiastes]

  - ref: 3
    phrase: the keepers of the house shall tremble
    kind: symbol
    title: The house of an old man
    body: |
      Verses 2–6 picture old age and death. A Latter-day Saint reading takes them as “analogies of being elderly”: the senses “dimmed (‘darkened’),” strong men “bowed over,” teeth lost (“grinders”), and the “long home” as death. On one older reading, verse 2’s darkened lights and returning clouds are the time when “the mind and the senses begin to be darkened, and the winter of life with its clouds and storms approaches.”

      The same older reading makes the house of verses 3–4 the body, pictured, as often in the Bible, as “the house of the inner man”: “This house, as that of an old man, is on all sides in a ruinous condition.” In this reading the keepers of the house are the arms and hands, the strong men the legs, the grinders the teeth, and those that look out of the windows the eyes. The almond tree in blossom (verse 5), whose petals turn “white like snow-flakes,” is “an emblem of the winter of old age with its falling silvery hair,” and the grasshopper that becomes a burden is the failing strength of the thighs. These identifications are that commentary’s; the text names none of them.

      The “long home” of verse 5 is the grave. The phrase means his everlasting house, which a modern translation renders “eternal home,” and “everlasting house” is a name “for the grave of the dead.”

      At verse 6 the readings part. In the Latter-day Saint reading the bowl, the pitcher and the wheel are vessels that hold water: when the bowl, the pitcher and the wheel at the cistern break, “water is spilled,” and water “is often seen as a symbol of life,” as in the wise woman’s words to David, “we must needs die, and are as water spilt on the ground, which cannot be gathered up again” ([[2 Sam. 14:14]]). In the older reading they are a lamp hung on a cord: “The silver cord equals the soul directing and bearing the body as living; the lamp hanging by this silver cord equals the body animated by the soul,” and the pitcher at the fountain is the heart. Both take verse 6 as the moment of death, which verse 7 then names.
    sources: [ot-minute-ecclesiastes, delitzsch-ecclesiastes, oshb-wlc, nrsvue, pike-spirit-eccl]

  - ref: 7
    phrase: the spirit shall return unto God who gave it
    kind: prophets
    title: The spirit returns to God
    body: |
      The Church reads this line of the spirit returning to God at death, and in some of its helps of the spirit that lived with Him before birth. In the chapter heading, “at death the spirit will return to God who gave it”; the Topical Guide lists the verse under “Man, a Spirit Child of Heavenly Father,” and the Guide to the Scriptures under “Premortal Life.” President Harold B. Lee, speaking in general conference in October 1973, quoted the verse and reasoned: “Obviously we could not return to a place where we had never been, so we are talking about death as a process as miraculous as birth.” In a Church seminary guide, chapters 11–12 teach that “one day we will die, our spirits will return to God, and He will judge us.”

      The Hebrew word is *ruach*, the word the Preacher used in [[Eccl. 3:19]] for the “one breath” that men and beasts share (see the note there), and a modern translation reads “the breath returns to God who gave it.” In the Old Testament *ruach* “rarely occurs therein to designate a spirit being or personage,” and its singular here differs from the plural “spirits” of [[Alma 40:11]]. Read beside the breath of life in Genesis, as one Latter-day Saint scholar reads it, the line means that the body returns to dust and “a divinely originating rûaḥ, a life breath or life force, leaves the body,” “perhaps the Light of Christ.” On that reading the verse itself does not teach premortal life: “This does not detract from the reality of spirit persons created by God and of the premortal existence of these spirits. It just means that support for such realities must be sought elsewhere.”

      The doctrine is stated plainly in Restoration scripture: “Man was also in the beginning with God” ([[D&C 93:29]]); Abraham was shown “the intelligences that were organized before the world was” ([[Abr. 3:22]]); and Alma learned from an angel “that the spirits of all men, as soon as they are departed from this mortal body … are taken home to that God who gave them life” ([[Alma 40:11]]). Whether Ecclesiastes 12:7 itself speaks of that spirit or of the breath of life, faithful readers answer differently; the doctrine does not rest on the choice.
    sources: [lds-scriptures, pike-spirit-eccl, lee-understanding-who-we-are, seminary-intro-eccl, oshb-wlc, nrsvue]

  - ref: 9
    phrase: because the preacher was wise, he still taught the people knowledge
    kind: history
    title: Another voice speaks of the Preacher
    body: |
      From verse 9 the book speaks of the Preacher in the third person, as it does in 1:1–11, which “may suggest that someone other than the preacher compiled his writings and teachings sometime after they were given.” “Many scholars believe that verses 9–14 in Ecclesiastes 12 were a later addition.” On one Latter-day Saint reading, verses 9–10 portray the Preacher as a sage and verses 11–14 are “summary instruction and encouragement from the later author or editor”; on another, the writer of verse 13 is “the second author.” Whoever wrote them, they are the book as it stands, and the epilogue “sets forth the main conclusions at which the writer has arrived.”

      What these verses say of the Preacher answers the cry of verse 8. Having found everything a breath, he went on teaching: he weighed, searched out and set in order many proverbs, and wrote what was upright, “even words of truth.” He “knew that things in life were ephemeral, and that things did not work out the way people might hope most of the time, but he taught people wisdom anyway.”
    sources: [seminary-intro-eccl, scripture-helps-proverbs, pike-spirit-eccl, barlow-public-relations, bd-ecclesiastes, sc-knowhy-868]

  - ref: 11
    phrase: The words of the wise are as goads
    kind: symbol
    title: Goads, nails, and one shepherd
    body: |
      The goad prods and the nail holds: the words of the wise spur the hearer on and stay fixed. On one older reading, these goads are “designed for driving on,” and the fitting praise of the proverbs of the wise is that “they incite to self-reflection, and urge to all kinds of noble effort.”

      The “masters of assemblies” can be read of persons or of the sayings themselves. The word *asuppot* means “gathering, collection,” and a modern translation reads “like nails firmly fixed are the collected sayings.” The older reading takes it that way: sayings gathered and set in order are “like nails driven in,” and their being fixed together is “a help to the memory, but also to the understanding of them”; Ecclesiastes itself is such a collection.

      The text does not name the “one shepherd.” In the older reading he is God, “who guides and cares as a shepherd for all who fear Him,” so that the words of the Preacher and the proverbs of Solomon have “one fountain.”

      Verse 12 turns to the student, “my son,” as the teacher addresses his disciple in Proverbs. A modern translation reads its warning as “Of anything beyond these, my child, beware,” and the older reading hears in it a caution against “too much reading” that points “once more to the one thing needful,” the conclusion that follows in verse 13.
    sources: [delitzsch-ecclesiastes, bdb, nrsvue]

  - ref: 13
    phrase: 'Fear God, and keep his commandments: for this is the whole duty of man'
    kind: words
    title: The whole duty of man
    body: |
      The book’s last counsel is to fear God and keep His commandments, and the Hebrew gives the reason without a word for “duty.” The Greek Septuagint renders the clause “for this is the whole man,” and a modern translation, supplying a word as the King James does, renders it “the whole duty of everyone.” (On the fear of God, see the note on [[Eccl. 5:7]].)

      “This one verse gives meaning to the entire book of Ecclesiastes.” Verse 14 gives its ground: God will bring every work into judgment, every secret thing, good or evil, the judgment the Preacher first named in [[Eccl. 3:17]]. That answers the complaint that runs through the book, that righteousness is not always rewarded under the sun: “obeying God is the right thing to do, and God will balance things accordingly at final judgement, whether things work out in this life or not.”
    sources: [oshb-wlc, lxx-rahlfs, nrsvue, ot-manual-proverbs, sc-knowhy-868]

christ: |
  The judgment of verse 14 is the Son’s ([[John 5:22]]); the Church’s footnote on “judgment” there points to the Topical Guide’s “Jesus Christ, Judge.” The Preacher’s last picture ends at the grave, with the dust returning to the earth; beside it Paul sets the Resurrection, in which all are made alive in Christ ([[1 Cor. 15:22]]).

  Alma’s counsel to his son, to which the Church’s footnote on “youth” in verse 1 points, applies the book’s conclusion to a disciple’s life: “learn wisdom in thy youth; yea, learn in thy youth to keep the commandments of God” ([[Alma 37:35]]). Every work and every secret thing of a disciple comes before the Son as Judge, whether or not keeping the commandments seems to change anything under the sun.

explore: |
  - **The spirits of the dead.** [[Alma 40:11–14]] and [[D&C 138]].
  - **The Son as Judge.** [[John 5:22–29]].

