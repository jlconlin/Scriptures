chapter: 4
title: Two Are Better Than One
tagline: The Preacher looks at the oppressed who have no comforter, at work driven by envy, at the lonely man who toils for no one, and at a king whose popularity passes. The one good he finds is a companion, and a threefold cord that is not quickly broken.
when: "The Preacher's reflections"

setting: |
  Chapter 4 carries on the Preacher's survey of what is done “under the sun.” He had already seen wickedness in “the place of judgment” ([[Eccl. 3:16]]), and “So I returned” takes up a related observation: now he looks at the oppressed themselves. The chapter belongs to the long middle of the book, chapters 3–10, where the Preacher shows “through many examples that worldly wealth does not last, and frustration in this life is unavoidable.” Chapters 4–8 name, among the things that lead to an unfulfilled life, “oppressing others” and “accumulating wealth for no other purpose than to have more than another.”

  One older reading takes 4:16 as the end of the first long section of the book, the Preacher's experiences from [[Eccl. 1:12]] on. From here his first-person accounts are followed by runs of proverbs, and chapter 5 opens with one. Chapter 4 does not name God; the turn toward Him comes in [[Eccl. 5:1–7]].

  For “vanity” see [[Eccl. 1:2]], and for “vexation of spirit,” striving after wind, see [[Eccl. 1:14]].

thread: |
  The chapter is five observations, three of them closed with “vanity” (verses 4, 8 and 16). The Preacher sees the tears of the oppressed and finds no one to comfort them (verses 1–3). He sees that work and skill are driven by rivalry with a neighbor, and sets the idle fool against the man with both fists full (verses 4–6). He sees a man alone, with no son or brother, who never stops working and never asks for whom he works (verses 7–8).

  From that lonely man the Preacher goes on to the value of companionship: two are better than one, because one lifts the other up when he falls, they keep each other warm, they stand together against an attacker, and a cord of three strands holds faster still (verses 9–12). The last observation turns to a king: a poor, wise youth is better than an old king who can no longer be warned, yet the crowds who follow the youth are followed in turn by a generation that takes no joy in him (verses 13–16).

sections:
  - range: 1-3
    heading: The oppressed have no comforter
    plain: |
      I turned and looked again at all the oppression done under the sun. There were the tears of the oppressed, and no one to comfort them; power was on the side of their oppressors, and still no one comforted them. So I counted the dead, who died long ago, more fortunate than the living, who are still alive; and more fortunate than both is the one who has never been born and has never seen the evil done under the sun.
  - range: 4-6
    heading: Work and envy
    plain: |
      I saw that all toil and all skill in work come from one person's rivalry with another. This too is vanity and striving after wind. The fool folds his hands and consumes himself. Better one handful with quiet than two fists full of toil and striving after wind.
  - range: 7-12
    heading: One alone, and two together
    plain: |
      I turned again and saw vanity under the sun. Here is a man all alone, with no son or brother. There is no end to his work, and his eyes are never satisfied with riches. He never asks, “For whom am I working, and depriving myself of good?” This too is vanity, a grievous task. Two are better than one, because they get a good return for their work. If they fall, one lifts the other up; but woe to the one who falls alone, with no one to help him up. If two lie down together they keep warm; how can one keep warm alone? One man may overpower a man who is alone, but two can stand against him, and a cord of three strands is not quickly broken.
  - range: 13-16
    heading: The old king and the youth
    plain: |
      A poor and wise youth is better than an old and foolish king who will no longer take a warning. For the youth comes out of prison to reign, though he was born poor in the kingdom. I saw all the living who walk under the sun follow the youth, the second, who stood up in the king's place. There was no end of the people he led. Yet those who come later will take no joy in him. This too is vanity and striving after wind.

notes:
  - ref: 2
    phrase: 'I praised the dead which are already dead more than the living which are yet alive'
    kind: scripture
    title: Better the dead, and better the unborn
    body: |
      Faced with oppression that no one relieves, the Preacher counts the dead more fortunate than the living, and the one never born more fortunate than both, because he “hath not seen the evil work that is done under the sun” (verse 3). This is his verdict on life as he sees it “under the sun” (see [[Eccl. 1:3]]). The Preacher is a believer who “often poses questions and makes statements as if he were not,” and what he says “must be taken in context of his final conclusion,” that God will judge every work (see [[Eccl. 12:13–14]]).

      He says close to the opposite later: “a living dog is better than a dead lion” ([[Eccl. 9:4]]). Both sayings stand in the book, and neither is its last word.
    sources: [seminary-intro-eccl]
  - ref: 4
    phrase: 'every right work, that for this a man is envied of his neighbour'
    kind: words
    title: Skill born of rivalry
    body: |
      The verse says that work and skill spring from rivalry, not that good work is envied. “Right work” renders *kishron*, “skill, success,” and the phrase means “skilful work.” “Envied” renders *qin'ah*, jealousy or zeal, used here “of rivalry.” A modern translation gives the sense plainly: “all toil and all skill in work come from one person's envy of another.” What makes the work “vanity” here is the rivalry behind it.
    sources: [bdb, nrsvue]
  - ref: 5
    phrase: 'The fool foldeth his hands together, and eateth his own flesh'
    kind: symbol
    title: Folded hands and full fists
    body: |
      Verses 5 and 6 set two failures side by side, idleness and endless toil. The fool folds his hands, the sluggard's gesture of [[Prov. 6:10]], and “eateth his own flesh”: in one older reading, “instead of nourishing himself by the labour of his hands, he feeds on his own flesh, and thus wasteth away,” so that “indolence is self-destruction.”

      Verse 6 turns to the other extreme. One hand full “with quietness” is better than both fists full of toil and striving after wind. The same reading takes “quietness” not as “the rest of sloth” but as rest “in contrast to such activity in labour as robs a man of himself, to the hunting after gain and honour which never has enough.” The Church's footnote at “handful” points to a proverb with the same comparison, little against much, which adds what the little is had with: “Better is little with the fear of the LORD than great treasure and trouble therewith” ([[Prov. 15:16]]).
    sources: [delitzsch-ecclesiastes, lds-scriptures]
  - ref: 12
    phrase: 'a threefold cord is not quickly broken'
    kind: symbol
    title: The threefold cord
    body: |
      The cord of three strands crowns the Preacher's case for companions. Two lift each other up (verse 10), keep each other warm (verse 11) and stand off an attacker (verse 12), and a cord of three strands holds faster still. The verse does not say who the third strand is.

      The Church's footnote at “Two” in verse 9 points to the first marriage, where husband and wife “shall be one flesh” ([[Moses 3:24]]). One Latter-day Saint reading takes the image further, as a likening: “God's form of marriage is succinctly taught in the metaphor of ‘a threefold cord,’” “weaving a husband, wife, and God together.”
    sources: [lds-scriptures, richardson-ephesians]
  - ref: 13
    phrase: 'who will no more be admonished'
    kind: prophets
    title: The king who stopped learning
    body: |
      The old king's folly is that he can no longer be warned. “Admonished” renders a passive form of the verb to warn, “be instructed, admonished, warned,” and the clause means one “who knoweth not how to take admonition”; a modern translation has “who will no longer take advice.” The poor youth has wisdom; the king has years and a throne, and has stopped listening.

      President Brigham Young quoted the verse in speaking of early converts who “improved, their minds expanded,” and of some who, “when they had gained a little spiritual strength and knowledge, apparently stopped in their growth”: “Like the fruit-trees, they have ceased to grow and increase and bear the fruits of the Spirit.”
    sources: [bdb, nrsvue, ot-manual-proverbs]
  - ref: 14
    phrase: 'For out of prison he cometh to reign'
    kind: history
    title: The youth from prison
    body: |
      The text names neither the king nor the youth. The “child” of verse 13 is a young man, “youth” in a modern translation, and he rises “out of prison” to the throne, though he was born poor: the King James “becometh poor” is read by one older reading and a modern translation as “born poor in the kingdom,” since the Hebrew phrase “cannot mean ‘to become poor.’” In verse 15 “the second child” is the same youth, in that reading “second on the throne, in relation to the dethroned king reckoned as the first,” and the King James “with the second child” is read in a modern translation as all the living following him.

      Interpreters have looked for the pair in history, Jeroboam and Antiochus the Great among the proposals; the older reading finds the case for Antiochus “stands on a feeble foundation.” It takes the point to be the Preacher's: “the hopes which his contemporaries placed in the young king … afterwards proved to be delusions,” confirming “that all under the sun is vain.” The crowds of verse 16 are without end, and those who come after them “shall not rejoice in him.”
    sources: [delitzsch-ecclesiastes, nrsvue]

christ: |
  The Preacher twice sees the oppressed with “no comforter” (verse 1), and pities the one who falls alone, who “hath not another to help him up” (verse 10). Jesus Christ promised His disciples, “I will not leave you comfortless: I will come to you” ([[John 14:18]]), and Alma taught that He would take upon Him the infirmities of His people “that he may know according to the flesh how to succor his people according to their infirmities” ([[Alma 7:12]]).

  Where the Preacher found no comforter, a disciple has one in the Savior, and has a people besides: those baptized in His name covenant to “mourn with those that mourn; yea, and comfort those that stand in need of comfort” ([[Mosiah 18:9]]).

