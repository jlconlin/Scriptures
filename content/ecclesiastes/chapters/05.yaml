chapter: 5
title: Let Thy Words Be Few
tagline: The Preacher counsels few words and kept vows in the house of God, then watches riches fail the man who loves them, and calls the power to enjoy one’s portion the gift of God.
when: The Preacher’s reflections

setting: |
  The chapter division falls a verse late here. The King James 5:1 is 4:17 in the Hebrew text (and in the Greek), so the counsel on going to the house of God belongs, in the Hebrew Bible, at the end of chapter 4. Chapter 4 closed on a king followed by endless crowds, in whom “they also that come after shall not rejoice”: “vanity and vexation of spirit” ([[Eccl. 4:16]]); chapter 5 turns from that to what a man should do and say before God.

  The first seven verses are direct counsel: watch your step at the temple, listen, keep your words few, pay what you vow, fear God. Verses 1–17 are “the most positive in Ecclesiastes,” counsel given “in the form of brief proverbs or wise sayings.” From verse 8 the Preacher returns to what he has seen “under the sun” (verse 13; see [[Eccl. 1:3]]): oppression in the province, and the man who loves silver and loses it. That subject, riches and the power to enjoy them, runs on into chapter 6. The chapter ends on its brightest note: eating, drinking and enjoying one’s labor is “the gift of God” (verse 19), a refrain explained at [[Eccl. 2:24]].

thread: |
  This is a string of sayings rather than an argument, but two things hold it together. The first half is about the **mouth**: the sacrifice of fools (verse 1), the hasty word (verse 2), the fool’s many words (verse 3), the vow spoken and not paid (verses 4–5), the excuse made before “the angel” (verse 6). Verse 2’s warning against a heart “hasty to utter any thing before God” runs through them all, and the half ends with “fear thou God” (verse 7).

  The second half is about **having**. The man who loves silver is never full (verse 10); more goods mean more mouths (verse 11); the laborer sleeps and the rich man cannot (verse 12); riches hoarded are lost, and he leaves the world as naked as he came (verses 13–17). Against that the Preacher sets what he has seen to be good: to eat, drink and enjoy one’s labor as one’s “portion,” with the power to do so given by God (verses 18–20). The contrast is not between rich and poor, since verse 19 speaks of a man to whom God has given riches, but between riches loved and hoarded (verses 10, 13) and riches received from God with the power to enjoy them (verse 19).

sections:
  - range: 1-7
    heading: Before God, few words
    plain: |
      Watch your step when you go to the house of God. To come near to listen is better than to offer the sacrifice of fools, who do not know that they are doing wrong. Don’t be quick with your mouth, and don’t let your heart hurry to say anything before God. God is in heaven and you are on earth, so let your words be few. As dreams come with too much business, a fool’s voice comes with too many words. When you make a vow to God, don’t put off paying it, for He takes no pleasure in fools. Pay what you have vowed. It is better not to vow than to vow and not pay. Don’t let your mouth make your body sin, and don’t tell the messenger that it was a mistake. Why should God be angry at what you say and destroy the work of your hands? Many dreams and many words are empty. Fear God instead.
  - range: 8-9
    heading: Officials over officials
    plain: |
      If you see the poor oppressed and justice and right violently twisted in a province, don’t be astonished at it: one high official is watched by a higher one, and there are higher ones over them both. Yet the yield of the land is for everyone; even the king is served by the field.
  - range: 10-17
    heading: Riches that do not satisfy
    plain: |
      Whoever loves silver will never have enough silver, and whoever loves wealth will never have enough income. This too is vanity. When goods increase, so do the people who consume them, and what does the owner gain except to look at them? The sleep of a working man is sweet, whether he eats little or much, but the rich man’s abundance will not let him sleep. I have seen a grievous evil under the sun: riches kept by their owner to his own harm. Those riches perish through evil toil, and when he has a son, there is nothing left in his hand. As he came from his mother’s womb, so he will go again, naked as he came, and he will take nothing from his labor that he can carry in his hand. This too is a grievous evil: exactly as he came, so he will go. What has he gained, after laboring for the wind? All his days he eats in darkness, with much grief, sickness and anger.
  - range: 18-20
    heading: The gift of God
    plain: |
      This is what I have seen to be good and fitting: to eat and drink and enjoy the good of all one’s labor under the sun, all the days of life that God gives, for that is one’s portion. And when God gives anyone riches and wealth, and the power to enjoy them, to accept his portion and rejoice in his labor, that is the gift of God. Such a man will not dwell much on the days of his life, because God answers him with the joy of his heart (or, keeps him busy with it).

notes:
  - ref: 1
    phrase: be more ready to hear, than to give the sacrifice of fools
    kind: scripture
    title: Hearing before sacrifice
    body: |
      The verse ranks listening at the temple above sacrifice offered without it. “The house of God” is the temple, and “to hear” in one older reading means to hear “the word of God, which is to be heard in the house of God,” a hearing “which leads to obedience.” The fools bring an offering without that hearing, and the verse says they “consider not that they do evil.”

      The same older reading sets the verse beside Proverbs, “To do justice and judgment is more acceptable to the LORD than sacrifice” ([[Prov. 21:3]]), and beside “the great word of Samuel” to Saul, who had kept back animals to sacrifice: “to obey is better than sacrifice, and to hearken than the fat of rams” ([[1 Sam. 15:22]]), a word it hears echoing “through the whole of the Psalms.”
    sources: [delitzsch-ecclesiastes, lds-scriptures]
  - ref: 3
    phrase: For a dream cometh through the multitude of business
    kind: symbol
    title: Dreams and many words
    body: |
      Verse 3 is a comparison that gives the reason for verse 2: as too much business fills the night with dreams, too many words fill a man’s mouth with folly. Verse 2 has already said why words before God should be few: “As the heavens, God’s throne, are exalted above the earth, the dwelling-place of man, so exalted is the heavenly God above earthly man,” and so a man’s words before Him ought to be “few, well-chosen reverential words.” Verse 3 adds that “where they are many, it is not without folly.”

      The “business” is not honest work. In the same older reading the dreams come “not: by much labour,” since labor brings “sweet sleep undisturbed by dreams” (verse 12), “but: by much self-vexation in a man’s striving after high and remote ends beyond what is possible.” The Septuagint has “through the multitude of trial a dream comes.” Verse 7 picks up both halves of the image again, “the multitude of dreams and many words.”
    sources: [delitzsch-ecclesiastes, lxx-rahlfs]
  - ref: 4
    phrase: When thou vowest a vow unto God, defer not to pay it
    kind: scripture
    title: A vow is paid
    body: |
      Verses 4–5 restate the law of Moses on vows nearly in its own words. Deuteronomy says, “When thou shalt vow a vow unto the LORD thy God, thou shalt not slack to pay it,” and that not to vow at all is no sin ([[Deut. 23:21–22]]). The Preacher gives the same rule, “Better is it that thou shouldest not vow, than that thou shouldest vow and not pay,” and adds his own reason: God “hath no pleasure in fools.”

      A vow in Israel gave something to the Lord or promised to abstain from something lawful, and vows “often had an entreating character; they were offered in order to obtain some favor from Jehovah.” Numbers puts the principle that the spoken word binds ([[Num. 30:2]]), and Proverbs warns against the vow made first and thought about afterward ([[Prov. 20:25]]).
    sources: [bd-vows, lds-scriptures]
  - ref: 6
    phrase: neither say thou before the angel, that it was an error
    kind: words
    title: An angel, a messenger, or a priest
    body: |
      “The angel” here is probably a priest, and “an error” is the plea of a sin committed unknowingly. The Hebrew *mal’akh* means “messenger,” human or heavenly, and one of its senses is “priest,” as in [[Mal. 2:7]] (“he is the messenger of the LORD of hosts”) and “probably” here. One modern translation keeps “the messenger” (“do not say before the messenger that it was a mistake”); another makes him a temple official: “do not protest to the temple messenger, ‘My vow was a mistake.’”

      The word “error” (*shegagah*) is the law’s word for a sin of ignorance, which a sacrifice could cover: “it shall be forgiven them; for it is ignorance” ([[Num. 15:25]]). One older reading puts the two together: the man who has not paid his vow comes to the priest with “an easier and less costly offering,” and calls his vow “a declaration that inconsiderately escaped him.” On that reading, the warning is against treating a broken promise to God as a slip of the tongue.

      Not every ancient reader saw a priest. The Aramaic Targum took the word as the angel who carries out judgment, and the Septuagint and the Syriac read “before God”: “say not in the presence of God, It was an error.” On any reading the excuse is made where God hears it.
    sources: [bdb, nrsvue, niv, delitzsch-ecclesiastes, lds-scriptures, lxx-rahlfs]
  - ref: 7
    phrase: but fear thou God
    kind: scripture
    title: Fear God instead
    body: |
      The command is the answer to everything verses 1–6 warned against. Dreams and many words are “vanities” (on the word, see [[Eccl. 1:2]]), and the Preacher sets the command against them. The Septuagint makes the contrast plainer: “there is evil in a multitude of dreams and vanities and many words: but fear thou God.” On what the fear of God means in the wisdom books, see [[Prov. 1:7]] and [[Ps. 111:10]]; the Preacher returns to the command in his conclusion ([[Eccl. 12:13]]).
    sources: [lxx-rahlfs]
  - ref: 8
    phrase: for he that is higher than the highest regardeth; and there be higher than they
    kind: history
    title: Officials over officials
    body: |
      Modern translations read the verse as saying that oppression is no surprise in a province run by ranks of officials, each watched by a higher one: “the high official is watched by a higher, and there are yet higher ones over them.” The King James “he that is higher than the highest regardeth” can sound like God, and some older interpreters read it that way, as officials over officials “and that these, the high and the higher, have over them a Most High, viz., God, who will bring them to an account.”

      One older reading turns that down. The verse explains why injustice should not astonish anyone, and a Most High who will punish it is “a consolatory argument against vexation, but is no explanatory reason of the phenomenon.” In that reading the verse explains “the want of legal order from the constitution of a despotic state,” where each official watches in a hostile sense, waiting “for the time when he may gain the advantage over him who is high.” It grants that the reading of God would agree with the Preacher’s “God shall judge the righteous and the wicked” ([[Eccl. 3:17]]), but takes verse 8 to describe how the province works.

      Verse 9 is obscure, and the translations differ widely: “this is an advantage for a land: a king for a plowed field”; “a king committed to cultivated fields”; “the king himself profits from the fields.” In the older reading it is the other side of verse 8: “the advantage of a country consists always in a king given to the arable land.”
    sources: [nrsvue, niv, esv, delitzsch-ecclesiastes]
  - ref: 20
    phrase: because God answereth him in the joy of his heart
    kind: words
    title: God answers, or keeps him busy, with joy
    body: |
      The verse says that the joy of a man who enjoys his portion comes from God, though the Hebrew verb can be read two ways. The King James “answereth” takes it as the verb “to answer.” Modern translations read a like-sounding verb that elsewhere in Ecclesiastes ([[Eccl. 1:13]]; [[Eccl. 3:10]]) means “be occupied, busied with”: “God keeps him occupied with joy in his heart,” or “God keeps them occupied with the joy of their hearts.”

      Either way, verse 20 gives the reason for verse 19 (“For…”): the man who has received his portion as “the gift of God” does not “much remember the days of his life,” because his joy comes from God (on the refrain, see [[Eccl. 2:24]]).
    sources: [nrsvue, esv, bdb]

christ: |
  The chapter sets two men side by side: one who loves silver and goes out of the world with nothing in his hand, and one to whom God gives the power to enjoy his portion. Beside the first stands the rich man of Jesus’ parable, who said to his soul, “eat, drink, and be merry,” the night his soul was required of him ([[Luke 12:19–20]]), and taught where treasure lasts: “lay up for yourselves treasures in heaven, where neither moth nor rust doth corrupt” ([[Matt. 6:20]]). The Preacher’s “gift of God” stands beside the Savior’s own promise, “I am come that they might have life, and that they might have it more abundantly” ([[John 10:10]]).

  A disciple’s treasure laid up in heaven is the kind not left behind at death, and the plain joy of work and bread can be received as God’s gift rather than as the reward of wealth.

explore: |
  - **Obedience and sacrifice.** Read [[1 Sam. 15:22]], [[Prov. 21:3]] and [[Hosea 6:6]] beside verse 1.
  - **Vows.** [[Num. 30:2]], [[Deut. 23:21–23]] and [[Prov. 20:25]] give the law and the warning that verses 4–6 assume.
  - **What a man carries out.** Set verses 10–17 beside [[Job 1:21]], [[Luke 12:13–21]] and Paul’s “we brought nothing into this world, and it is certain we can carry nothing out” ([[1 Tim. 6:7]]; read on through 6:10).

