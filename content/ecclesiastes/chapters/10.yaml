chapter: 10
title: A Little Folly
tagline: A string of sayings on the fool, the ruler and the tongue, where a little folly spoils a wise name, folly sits in high places, and even a thought against the king may fly abroad.
when: The Preacher’s reflections

setting: |
  Chapter 10 picks up straight from the last line of chapter 9. There the Preacher told of a poor wise man who saved a city and was forgotten, and ended, “Wisdom is better than weapons of war: but one sinner destroyeth much good” ([[Eccl. 9:18]]). The Church’s footnote at 10:1 sends the reader back to that verse.

  What follows “is primarily a collection of proverbs,” and apart from “their pessimistic outlook, these proverbs differ little from those in the book of Proverbs.” The Preacher’s own voice still breaks in once: “There is an evil which I have seen under the sun” (verse 5; on the phrase, see [[Eccl. 1:3]]). God is not named anywhere in the chapter.

  The chapter closes the long middle of the book, chapters 3–10, in which the Preacher shows “through many examples that worldly wealth does not last, and frustration in this life is unavoidable.” Read together, chapters 9 and 10 say that everyone has a limited time on earth and “will benefit much more from gaining wisdom than from gaining riches or power.” Chapters 11 and 12 follow, with the Preacher’s last counsel.

thread: |
  This is a string of sayings, not an argument, and the figure who returns in nearly every one is the **fool**. A little of his folly spoils a wise man’s name, his folly is set in high places, and his own walk, talk and labor give him away (verses 1–3, 6, 12–15). Against him stands wisdom, which “is profitable to direct” (verse 10), and the wise man whose words “are gracious” (verse 12).

  The other figure is **the ruler**. Two of the chapter’s counsels are about how to live under one: keep your post and your calm when he is angry (verse 4), and do not curse him even in thought (verse 20). Between, a ruler’s error turns the world upside down, with servants on horses and princes on foot (verses 5–7), and a land suffers whose king is a child and whose princes feast in the morning (verses 16–19). The sayings in the middle (verses 8–11) are about ordinary work, where every task has its hazard: the pit that turns on its digger (the proverb of [[Prov. 26:27]]), the wall with a snake in it, the blunt axe, the charmer who comes too late.

sections:
  - range: 1-3
    heading: A little folly
    plain: |
      A few dead flies make the perfumer’s ointment stink; so a little folly outweighs wisdom and honor. A wise man’s heart turns him to the right, and a fool’s heart to the left. Even when a fool walks along the road, his sense fails him, and he shows everyone that he is a fool.
  - range: 4-7
    heading: The ruler’s anger and the ruler’s error
    plain: |
      If the ruler’s anger rises against you, don’t leave your post, for calmness puts great offenses to rest. There is an evil I have seen under the sun, the kind of error that comes from a ruler: folly is set in high places, and the rich sit low. I have seen servants riding on horses, and princes walking on the ground like servants.
  - range: 8-11
    heading: Every work has its hazard
    plain: |
      Whoever digs a pit will fall into it, and whoever breaks through a wall will be bitten by a snake. Whoever quarries stones will be hurt by them, and whoever splits logs is in danger from them. If the iron is blunt and he does not sharpen the edge, he must put in more strength; but wisdom helps a man succeed. If the snake bites before it is charmed, the charmer gains nothing.
  - range: 12-15
    heading: The words of a fool
    plain: |
      The words of a wise man’s mouth win him favor, but a fool’s own lips swallow him up. His words begin in foolishness and end in wicked madness. The fool talks on and on, though no one knows what will happen; who can tell him what will come after him? A fool’s labor wears him out, for he does not even know the way to town.
  - range: 16-20
    heading: Kings, princes, and a careful tongue
    plain: |
      Woe to you, land, when your king is a child and your princes feast in the morning! Happy are you, land, when your king is of noble birth and your princes eat at the proper time, for strength and not for drunkenness. Through laziness the roof sinks in, and through idle hands the house leaks. A feast is made for laughter, and wine makes life merry, and money answers for everything. Don’t curse the king, not even in your thoughts, and don’t curse the rich in your bedroom, for a bird of the air will carry your voice, and something with wings will tell what you said.

notes:
  - ref: 1
    phrase: Dead flies cause the ointment of the apothecary to send forth a stinking savour
    kind: symbol
    title: A little folly outweighs wisdom
    body: |
      The image is of something small ruining something large and costly: a few dead flies spoil the whole of the perfumer’s ointment, and a little folly spoils a man’s name for wisdom and honor. Modern translations read the second line as a weighing: “so a little folly outweighs wisdom and honor.”
    sources: [nrsvue, esv]
  - ref: 2
    phrase: A wise man’s heart is at his right hand; but a fool’s heart at his left
    kind: symbol
    title: The right hand and the left
    body: |
      The proverb is about where each heart leads, not where it sits: modern translations read, “The heart of the wise inclines to the right, but the heart of a fool to the left.” The King James “is at his right hand” can sound like a statement about the body. In one older reading the right “is figuratively a designation of the right; and that to the left, a designation of the wrong,” and the right is “that to which his calling and duty point him.”

      Verse 3 then follows the fool out into the street. On the road his “wisdom faileth him,” and he “saith to every one that he is a fool”; a modern translation turns the line around, so that he shows everyone “how stupid they are.”
    sources: [nrsvue, niv, delitzsch-ecclesiastes]
  - ref: 4
    phrase: for yielding pacifieth great offences
    kind: words
    title: Yielding, or calmness
    body: |
      The word the King James renders “yielding” speaks of calm, so the counsel is to stay calm under a ruler’s anger. The Hebrew word, *marpe’*, means “healing, cure, health,” and here “composure”; modern translations read “calmness will lay great offenses to rest” or “calmness will undo great offenses.” The same word makes the “wholesome tongue” of [[Prov. 15:4]], “a soothing tongue,” and the tongue of the wise that “is health” ([[Prov. 12:18]]).

      “Leave not thy place” means to stay at one’s post (“do not leave your post”).
    sources: [bdb, esv, nrsvue, niv]
  - ref: 11
    phrase: Surely the serpent will bite without enchantment; and a babbler is no better
    kind: words
    title: The babbler is the charmer
    body: |
      The “babbler” is the snake charmer, and the proverb is about skill that comes too late. The word for “enchantment” means “a whispering, charming,” here “serpent-charming,” and the “babbler” is a phrase built on the word for “tongue,” meaning at this verse “charmer.” So modern translations read, “If the snake bites before it is charmed, there is no advantage in a charmer,” or “the charmer receives no fee.”

      In the King James, “a babbler is no better” can read as a jab at people who talk too much. In the Hebrew the charmer’s whispering, however skilled, is worth nothing once the snake has struck.
    sources: [bdb, nrsvue, niv]
  - ref: 16
    phrase: Woe to thee, O land, when thy king is a child
    kind: scripture
    title: When thy king is a child
    body: |
      A child on the throne is a sign of a land in trouble, and the Church’s footnote sends the reader to Isaiah, where it is part of Judah’s judgment: “I will give children to be their princes, and babes shall rule over them” ([[Isa. 3:4]]), and “children are their oppressors” ([[Isa. 3:12]]). Modern translations keep “child,” though one reads “Woe to the land whose king was a servant,” with “Or king is a child” in its footnote.

      The princes who “eat in the morning” are explained by verse 17, which sets the opposite beside them: princes who “feast at the proper time — for strength and not for drunkenness.”
    sources: [lds-scriptures, niv, nrsvue]
  - ref: 19
    phrase: but money answereth all things
    kind: history
    title: Money answereth all things
    body: |
      In one older reading, “money answereth all things” belongs to a picture of idle revelers like the princes of verses 16–18. Those who make a feast “for laughter” are “duty-forgetting idlers, to whom chiefly wine must be brought” to cheer their life, and “they can feast and drink, for they have money.” Modern translations give the clause as “money meets every need,” “money answers everything,” or “money is the answer for everything”; the same older reading prefers the rendering of Jerome, “unto money are all things obedient.”

      That reading also hears in the word “laughter” the Preacher’s own verdict on it in chapter 2: “I said of laughter, It is mad” ([[Eccl. 2:2]]).
    sources: [nrsvue, esv, niv, delitzsch-ecclesiastes]
  - ref: 20
    phrase: for a bird of the air shall carry the voice
    kind: symbol
    title: A bird of the air
    body: |
      In one older reading, the bird that carries what was said in private makes the point of the later proverb “walls have ears.” The bedchamber is “the innermost room of the house, where one thinks himself free from treachery.” The same reading points to a story in Kings that shows how far a word spoken there can travel: one of the king of Syria’s servants tells him that Elisha “telleth the king of Israel the words that thou speakest in thy bedchamber” ([[2 Kgs. 6:12]]).

      The verse reaches past speech to “thy thought”; the ancient Greek translation, the Septuagint, renders it “Even in thy conscience, curse not the king.” The same older reading finds the warning grounded “not only [in] prudence, but also, according to Ecclesiastes 8:2, religiousness,” where the Preacher counsels keeping “the king’s commandment, and that in regard of the oath of God” ([[Eccl. 8:2]]).
    sources: [delitzsch-ecclesiastes, lxx-rahlfs, lds-scriptures]

christ: |
  The chapter knows the wise man by his mouth: “The words of a wise man’s mouth are gracious,” while the fool “is full of words” and his own lips swallow him up (verses 12–14). The King James uses the same English word of Jesus in the synagogue at Nazareth, where all “wondered at the gracious words which proceeded out of his mouth” ([[Luke 4:22]]), and Jesus taught that words weigh at the judgment: “every idle word that men shall speak, they shall give account thereof in the day of judgment” ([[Matt. 12:36]]).

  A disciple will give account for words said in public and in private, and the gracious words the Preacher praises in the wise are the kind Nazareth heard from the Savior.

explore: |
  - **The pit and its digger.** Set verse 8 beside [[Ps. 7:15]] and [[Prov. 26:27]], and the note on the Proverbs verse.
  - **Servants who rule.** [[Prov. 19:10]] and [[Prov. 30:21–22]] beside verses 6–7; [[Isa. 3:1–12]] beside verse 16.
  - **The charmer and the tongue.** [[Ps. 58:4–5]] beside verse 11, and [[Prov. 15:1–4]] and [[James 3:2–10]] beside verses 12–14.

