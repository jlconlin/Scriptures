chapter: 9
title: Time and Chance
tagline: The Preacher finds one end for the righteous and the wicked, bids the living eat their bread with joy and work with their might, and sees time and chance overtake the swift, the strong and the wise.
when: The Preacher’s reflections

setting: |
  Chapter 9 picks up where chapter 8 ended. The Preacher had found that no one, however wise, can “find out the work that is done under the sun” ([[Eccl. 8:17]]), and on one older reading 9:1 gives the reason: the righteous and the wise “are in the hand of God,” and what will meet them lies ahead, “beyond his power.” Here he turns to death and to the chances of a life. He finds one end for the righteous and the wicked (verses 2–3, widening what he had said of the wise and the fool at [[Eccl. 2:14]]), a fate that does not wait on speed, strength or skill (verse 11), and a wise man no one remembers (verse 15). The Church’s study guide sums up chapters 9–10 this way: “both the wicked and the righteous will experience tragedy,” and everyone “will benefit much more from gaining wisdom than from gaining riches or power.”

  He speaks, as always, of what is seen “under the sun,” from the world’s point of view ([[Eccl. 1:3]]), and that frame matters most at verse 5, where he says the dead know nothing. Between the dark verses stands his call to joy (verses 7–10), the refrain first met at [[Eccl. 2:24]].

thread: |
  The chapter falls into three parts, as a modern translation’s headings mark them. In verses 1–6 **death comes to all**: one end for the clean and the unclean, for the one who sacrifices and the one who does not, and after it no more share in anything done under the sun. In verses 7–10 comes his **counsel for the meantime**: eat your bread with joy, wear white, love your wife, work with your might. One older reading ties the two together: because there is “only one life, one life on this side of eternity,” the Preacher “deduces the exhortation to enjoy the one as much as possible,” and this counsel is “the most distinct personal utterance of the author,” the conclusion the whole book keeps returning to.

  In verses 11–18 **chance** takes the place of death. The race is not to the swift, and a city saved by a poor man’s wisdom forgets him. Wisdom is still better than strength and better than weapons of war, but under the sun it goes unremembered and unheard, and one sinner can undo much good.

sections:
  - range: 1-6
    heading: One event unto all
    plain: |
      I took all this to heart and tried to make it plain: the righteous and the wise, and all they do, are in God’s hand. Whether it will be love or hatred, no one knows; all of it lies before them. The same thing comes to everyone: one end for the righteous and the wicked, for the good and the clean and the unclean, for the one who offers sacrifice and the one who does not. As it is with the good, so it is with the sinner; the one who makes a covenant by oath fares like the one who will not commit himself. This is an evil in all that is done under the sun, that one end comes to all. The hearts of men are full of evil, and madness is in their hearts while they live, and afterward they go to the dead. Whoever is still joined to the living has hope, for a living dog is better than a dead lion. The living know that they will die, but the dead know nothing and have no more reward, for even their memory is forgotten. Their love, their hatred and their envy have already perished, and they have no more share forever in anything done under the sun.
  - range: 7-10
    heading: Eat thy bread with joy
    plain: |
      Go, eat your bread with joy and drink your wine with a glad heart, for God has already approved what you do. Let your clothes always be white, and do not let your head lack oil. Enjoy life with the wife you love all the days of this fleeting life that God has given you under the sun, for that is your portion in life and in the labor you do under the sun. Whatever your hand finds to do, do it with all your strength, for there is no work, no planning, no knowledge and no wisdom in the grave, where you are going.
  - range: 11-18
    heading: Wisdom better than strength
    plain: |
      I saw again under the sun that the race does not go to the swift, nor the battle to the strong, nor bread to the wise, nor riches to the understanding, nor favor to the skillful: time and chance happen to them all. No one knows his time. Like fish caught in a cruel net and birds caught in a snare, people are caught in an evil time that falls on them suddenly. I also saw this example of wisdom under the sun, and it seemed great to me. There was a little city with few men in it. A great king came against it, surrounded it and built great siegeworks against it. In the city was a poor wise man, and by his wisdom he saved the city; yet no one remembered that poor man. So I said, wisdom is better than strength, yet the poor man’s wisdom is despised and his words are not heard. The quiet words of the wise are heard better than the shouting of a ruler among fools. Wisdom is better than weapons of war, but one sinner destroys much good.

notes:
  - ref: 2
    phrase: there is one event to the righteous, and to the wicked
    kind: scripture
    title: One event for the righteous and the wicked
    body: |
      The Preacher now says of the righteous and the wicked what he had said of the wise and the fool: one “event,” the same end, comes to both (the word is explained at [[Eccl. 2:14]]). He names them in pairs: the clean and the unclean, the one who sacrifices and the one who does not, and the one who “sweareth” and the one who “feareth an oath,” which the Church’s footnotes gloss as one who “makes a covenant” and one who “avoids committing himself.”

      The Preacher calls this “an evil” (verse 3). One Latter-day Saint reading asks whether the book, like Job, might serve “as a balancing corrective to the widely held assurance … that God will dependably prosper the righteous and punish the wicked in visible, material ways in mortality.” The same reading sets beside it what Jesus taught of His Father: “he maketh his sun to rise on the evil and on the good, and sendeth rain on the just and on the unjust” ([[Matt. 5:45]]).
    sources: [lds-scriptures, barlow-public-relations]
  - ref: 4
    phrase: a living dog is better than a dead lion
    kind: symbol
    title: A living dog and a dead lion
    body: |
      The proverb sets the lowest living thing above the noblest dead one. Apart from the shepherd’s dog, the dog in scripture, on one older reading, “appears as a voracious filthy beast, roaming about without a master,” and “is the proverbial emblem of that which is common, or low, or contemptible,” as when David asks Saul why he pursues “a dead dog” ([[1 Sam. 24:14]]). The lion is the king of beasts, “strongest among beasts” ([[Prov. 30:30]]). Dead, it has lost its strength and its dignity, and the meanest living thing is better off.

      The saying seems to take back the Preacher’s praise of “the dead which are already dead more than the living which are yet alive” ([[Eccl. 4:2]]). The same older reading answers that there “he views life pessimistically in its, for the most part, unhappy experiences, while here he regards it in itself as a good affording the possibility of enjoyment.” Life itself, on this reading, is the condition of the joy in verses 7–10: only the living have “a joyful spirit.” Verse 5 then states the dog’s advantage with some irony (“He sarcastically verifies his comparison”): the living at least know that they shall die.
    sources: [delitzsch-ecclesiastes]
  - ref: 5
    phrase: but the dead know not any thing
    kind: scripture
    title: What the dead know
    body: |
      The Church reads this verse, and verse 10 with it, as the Preacher’s view from “under the sun,” not as doctrine about the soul: they “should not be construed as theological pronouncements on the condition of the soul after death; rather, they are observations by the Preacher about how things appear to men on the earth ‘under the sun.’” The Preacher “wrote as if there is no life after death,” and so he “was not making a doctrinal declaration that nobody thinks, feels, or works after they die.” Seen from this world the dead are simply gone: they earn nothing more, they are forgotten, and their love and hatred have perished with them (verses 5–6).

      Restoration scripture teaches what lies beyond that view. The Church’s footnote at verse 3, where men “go to the dead,” points to Alma, to whom it was “made known … by an angel” that the spirits of all men, “whether they be good or evil, are taken home to that God who gave them life,” and that the righteous enter paradise, “a state of peace, where they shall rest from all their troubles and from all care, and sorrow” ([[Alma 40:11–12]]). And in the vision given to President Joseph F. Smith, the Savior appointed messengers “to carry the light of the gospel to them that were in darkness,” to all the spirits of men, “and thus was the gospel preached to the dead” ([[D&C 138:30]]).
    sources: [bd-ecclesiastes, seminary-ot-teacher-115, lds-scriptures]
  - ref: 7
    phrase: for God now accepteth thy works
    kind: words
    title: God has already approved
    body: |
      The verse gives the reason for joy: God has already approved it. Where the King James has “now,” modern translations read time past: “God has long ago approved what you do,” or “God has already approved what you do.” One Latter-day Saint reading takes the King James “accepteth thy works” as God’s pleasure in a worshipper’s offering, and quotes the line just after the “joy of our redemption” that Adam and Eve learned after their sacrifice ([[Moses 5:11]]): “we can know that the Lord is pleased with our sacrifices.” One older reading takes the line differently, and calls the sense that a man’s conduct has pleased God incorrect: God permitted this eating and drinking beforehand, “so that thou hast no room for scruples about it”; and since “it is the will of God that we should enjoy life, … we have to enjoy it as He wills it to be enjoyed.” The first reading hears approval of what a person has offered; the second, permission for the joy itself.

      This is the Preacher’s refrain on eating and drinking as God’s gift, explained at [[Eccl. 2:24]].
    sources: [nrsvue, esv, delitzsch-ecclesiastes, sc-knowhy-372]
  - ref: 8
    phrase: Let thy garments be always white
    kind: symbol
    title: White garments
    body: |
      White clothing belonged to a feast, not to mourning. On one older reading, white garments stand “in contrast to the black robes of mourning, and thus are an expression of festal joy, of a happy mood.” The Preacher asks for them “always,” every day of the life God has given.

      The Church’s footnote at “white” points to Alma’s questions to the church in Zarahemla ([[Alma 5:21]], 24, 27), where white garments are those “cleansed and made white through the blood of Christ, who will come to redeem his people from their sins” ([[Alma 5:27]]).
    sources: [delitzsch-ecclesiastes, lds-scriptures]
  - ref: 10
    phrase: Whatsoever thy hand findeth to do, do it with thy might
    kind: scripture
    title: With thy might
    body: |
      The Preacher’s reason for working with all one’s strength is that there is no work in the grave. Where the King James has “the grave,” modern translations keep the Hebrew name of the place of the dead: “in Sheol, to which you are going.” How the Church reads the Preacher’s picture of the dead is at verse 5.

      The Church’s footnote at “grave” points to Amulek, who taught that “this life is the time for men to prepare to meet God; yea, behold the day of this life is the day for men to perform their labors,” and that “if we do not improve our time while in this life, then cometh the night of darkness wherein there can be no labor performed” ([[Alma 34:32–33]]). And where the Preacher sees knowledge end at the grave, the footnote at “knowledge” points to the Lord’s teaching that “whatever principle of intelligence we attain unto in this life, it will rise with us in the resurrection” ([[D&C 130:18]]).
    sources: [esv, nrsvue, lds-scriptures]
  - ref: 11
    phrase: but time and chance happeneth to them all
    kind: prophets
    title: Time and chance
    body: |
      Speed, strength, wisdom, understanding and skill do not guarantee what they ought to win: the race, the battle, bread, riches, favor. On one older reading, the Hebrew says these things do not belong to the swift or the strong as their own possession, so that “their fleetness is yet no guarantee that on account of it they will reach the goal.” The battle belongs rather to the Lord, as David told Goliath (“the battle is the LORD’S,” [[1 Sam. 17:47]]), and the getting of bread and riches “depends on times and circumstances which lie beyond the control of man, and is thus, in the final result, conditioned by God.” Verse 12 adds that no one knows his time: like fish in a net or birds in a snare, people are caught when the evil time “falleth suddenly upon them.”

      Brigham Young drew a lesson from the verse for the Saints: “Do not fret, nor be so anxious about property, nor think that when you have gathered treasures, they alone will produce joy and comfort; for it is not so,” and “The Lord gives the increase: he makes rich whom he pleases.” The Church’s footnote at “swift” points to King Benjamin’s counsel that “it is not requisite that a man should run faster than he has strength” ([[Mosiah 4:27]]).
    sources: [delitzsch-ecclesiastes, ot-manual-proverbs, lds-scriptures]
  - ref: 15
    phrase: yet no man remembered that same poor man
    kind: history
    title: The poor wise man
    body: |
      The Preacher tells the story as something he saw, and he names no city, king or man. On one older reading it is “an actual history,” the city perhaps saved “in the same way as Abel-beth-maacha, 2 Samuel 20, by the wisdom of a woman”: there a wise woman of the besieged city called out to Joab and turned his army away ([[2 Sam. 20:16–22]]).

      The weight of the story falls on its last line. Wisdom did what strength could not, and the city forgot the man who saved it: “he was still poor, and remained so.” The Preacher draws the lesson in the next verse: “Wisdom is better than strength: nevertheless the poor man’s wisdom is despised, and his words are not heard” ([[Eccl. 9:16]]).
    sources: [delitzsch-ecclesiastes, lds-scriptures]

christ: |
  The Preacher sees the dead pass beyond every reward and memory under the sun (verses 5–6). Paul answers from beyond that frame: “If in this life only we have hope in Christ, we are of all men most miserable. But now is Christ risen from the dead, and become the firstfruits of them that slept” ([[1 Cor. 15:19–20]]).

  For a disciple, the one end that meets the righteous and the wicked under the sun is not the last word, because the risen Christ is the firstfruits of all who die. The joy and the work of verses 7–10 belong to a life that He will raise.

explore: |
  - **The righteous who suffer.** Set verses 1–3 beside the book of Job ([[Job 1:13–22]]) and [[Matt. 5:45]].
  - **The dead and the gospel.** Read [[Alma 40]] and [[D&C 138]] beside verses 5–6 and 10.

