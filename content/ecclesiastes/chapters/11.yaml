chapter: 11
title: Sow in the Morning
tagline: The Preacher tells his hearer to send out his bread and sow his seed though no one can know what will prosper, then bids the young rejoice in the light while it lasts, remembering the dark and the judgment of God.
when: 'The Preacher’s reflections'

setting: |
  Chapter 11 opens the last part of the book, chapters 11–12, in which the Preacher invites everyone to enjoy life “as a gift from God” and concludes that obedience matters because one day we will die and God will judge us. These two chapters are “the most spiritual part of the book.”

  The chapter has two parts, as a modern translation divides it. Verses 1–6 are counsel to act and to keep working in a world where the outcome cannot be known. Verses 7–10 turn to the young man, and they do not stop at the chapter’s end: the same address goes straight on into “Remember now thy Creator in the days of thy youth” ([[Eccl. 12:1]]) and the picture of old age that follows ([[Eccl. 12:2]]).

  Two things are said in full elsewhere: “vanity” (*hebel*, breath or vapor) at [[Eccl. 1:2]], and God’s judgment at [[Eccl. 3:17]].

thread: |
  The chapter turns on one phrase, “thou knowest not” (verses 2, 5, 6). The book has stressed again and again that God and His ways cannot be fathomed. Here the Preacher draws a practical conclusion from it. Since you cannot know, don’t wait to know.

  So send your bread out on the water, and spread what you have among seven or eight, since no one knows what evil is coming (verses 1–2). The clouds will rain when they are full and a tree will lie where it falls, whatever you do about it (verse 3). Whoever waits for the right wind will never plant (verse 4). You do not know the way of the wind, or how a child grows in the womb, and you do not know the work of God either (verse 5). So sow morning and evening, because you cannot tell which sowing will prosper (verse 6). The uncertainty that ran through the earlier chapters is now a reason to work.

  Then the light. Life is sweet, and a man should rejoice in all his years, but he should remember that the dark days will be many (verses 7–8). The young man is told to rejoice and follow his heart, and to know that God will judge him for all of it (verse 9). Let him put sorrow and evil away, for youth is a breath and soon passes (verse 10).

sections:
  - range: 1-6
    heading: Since you cannot know, sow
    plain: |
      Send your bread out over the water, for after many days you will find it again. Give a share to seven, even to eight, for you do not know what disaster may come upon the earth. When the clouds are full of rain they pour it out on the earth, and whether a tree falls to the south or to the north, where it falls, there it lies. Whoever keeps watching the wind will never sow, and whoever keeps looking at the clouds will never reap. Just as you do not know the way of the wind (or of the spirit), or how the bones of a child grow in a pregnant woman’s womb, so you do not know the work of God, who makes everything. Sow your seed in the morning, and in the evening don’t hold back your hand, for you do not know which will succeed, this or that, or whether both will do well alike.
  - range: 7-10
    heading: Rejoice, and remember
    plain: |
      Light is sweet, and it is good for the eyes to see the sun. However many years a man lives, let him rejoice in them all, and let him remember that the days of darkness will be many. Everything that comes is a passing breath. Rejoice, young man, while you are young, and let your heart cheer you in the days of your youth. Follow the ways of your heart and what your eyes see, but know that for all these things God will bring you into judgment. So put sorrow out of your heart and put away evil from your body, for childhood and youth are a passing breath.

notes:
  - ref: 1
    phrase: Cast thy bread upon the waters
    kind: symbol
    title: Generosity, or a venture
    body: |
      The line can be read as giving or as trading, and verse 2 follows it either way. The traditional reading is generosity: give without looking for a quick return, and it may come back to you in time.

      The Hebrew verb is *shallach*, “send,” not “cast,” and the Septuagint has “Send forth thy bread upon the face of the water.” A modern translation takes the sending as shipping: “Ship your grain across the sea; after many days you may receive a return. Invest in seven ventures, yes, in eight.” On that reading verse 2 counsels dividing one’s ventures. Read as giving, verse 2 means going “the extra mile in giving and doing, even if we do not know the outcome.”

      The two readings agree on the point the Preacher presses. Either way a man parts with something now and the return is out of sight, “after many days,” and the reason he gives in verse 2 is “thou knowest not what evil shall be upon the earth.”
    sources: [scripture-helps-proverbs, oshb-wlc, lxx-rahlfs, niv, ot-minute-ecclesiastes]

  - ref: 3
    phrase: in the place where the tree falleth, there it shall be
    kind: prophets
    title: As the tree falls
    body: |
      In its place the line is an observation about nature: clouds full of rain empty themselves, and a fallen tree stays where it fell. These appear to be matter-of-fact outcomes in the natural world, and verse 4 adds that whoever waits on the wind and the clouds will never sow or reap.

      Brigham Young gave the line a second sense, tying it to death and the judgment: “as we lie down, so judgment will find us, and that is scriptural; ‘as the tree falls so it shall lie,’ or, in other words, as death leaves us so judgment will find us.” A Latter-day Saint commentary takes this as the Preacher’s own meaning: “when we die we will remain what we became.” The verse can bear both senses, and the sources divide over which the Preacher intended.
    sources: [pike-spirit-eccl, ot-manual-proverbs, ot-minute-ecclesiastes]

  - ref: 5
    phrase: the way of the spirit
    kind: words
    title: The wind, or the spirit
    body: |
      “Spirit” here is *ruach*, the word the verse before translates “wind,” and translations have divided over which it means. A Latter-day Saint scholar sets out the two readings: the wind, “given the reference to clouds and wind (rûaḥ) in the previous verse,” or the spirit or breath that gives life, given the child growing in the womb in the second half of the verse. The Septuagint has “the way of the wind,” and so does a modern translation (“the path of the wind”); another joins the two halves, “how the breath comes to the bones in the mother’s womb.” The Hebrew manuscripts differ here too: most read “the way of the wind, or how the bones grow in the womb,” and some, with the Targum, “the way the spirit comes to the bones,” which another modern translation prints.

      Either way the point of the verse is that no one knows: not the wind’s path, not how a body forms in the womb, and not “the works of God who maketh all.” The same scholar concludes that, with its meaning so uncertain, it is problematic to use the verse as support for reading the “spirit” of [[Eccl. 12:7]], and that translators who wrote “spirit” here meant the life God gives every creature, “not spirit personages.”
    sources: [oshb-wlc, pike-spirit-eccl, lxx-rahlfs, niv, nrsvue, esv]

  - ref: 8
    phrase: let him remember the days of darkness
    kind: symbol
    title: The days of darkness
    body: |
      The days of darkness stand against the light of verse 7. The Church’s footnote at “darkness” points to the next chapter, where the young man is to remember his Creator “while the evil days come not, nor the years draw nigh, when thou shalt say, I have no pleasure in them” ([[Eccl. 12:1]]), and the sun and light are darkened in the picture of old age that follows ([[Eccl. 12:2]]). Those verses, a Latter-day Saint scholar writes, dwell on “the long, dark days of misery encountered in old age and the inevitability of the grave.” One Latter-day Saint commentary reads the verse more hopefully: “evil and darkness can still disrupt the day. But that disruption is only temporary—a bright new day will follow.”
    sources: [lds-scriptures, pike-spirit-eccl, ot-minute-ecclesiastes]

  - ref: 9
    phrase: walk in the ways of thine heart, and in the sight of thine eyes
    kind: scripture
    title: The heart, the eyes, and the judgment
    body: |
      The Preacher tells the young man to follow his heart and his eyes, and the law had said the opposite: “seek not after your own heart and your own eyes” ([[Num. 15:39]]). The Septuagint, in a standard English translation, reads “walk in the ways of thy heart blameless, but not in the sight of thine eyes.” On one older reading that “not” is missing from other Greek manuscripts and was added in view of the warning in Numbers, as the Targum also softens the line to “be prudent with reference to the sight of thine eyes”; and the softening is not needed, since the call to enjoy youth comes with its own warning: “but know thou, that for all these things God will bring thee into judgment.”

      So the verse is not license: the call to enjoy youth and the judgment stand in the same breath (judgment in the book is explained at [[Eccl. 3:17]]). On the same older reading, verse 10 tells the young man to free himself of what harms the inner and the outer man, because youth is *hebel*, “transitory, and only too soon passes away.”
    sources: [lxx-rahlfs, delitzsch-ecclesiastes, lds-scriptures]

christ: |
  The Preacher tells his hearer to send his bread out and to find it “after many days.” Alma speaks of a return like it: “that which ye do send out shall return unto you again, and be restored” ([[Alma 41:15]]), and Elder Gerrit W. Gong teaches that this restoration, a promise of the Lord’s Atonement, is “like bread upon the water,” restoring “that which is good,” “righteous,” “just,” and “merciful.” The judgment the young man is warned of in verse 9 belongs to the Savior, for the Father “hath committed all judgment unto the Son” ([[John 5:22]]).

  A disciple sows in the morning and the evening without seeing which seed will grow, and Paul’s promise is that “in due season we shall reap, if we faint not” ([[Gal. 6:9]]). The good a disciple sends out is not lost, for the Lord’s Atonement restores “that which is good,” and the joy of youth is lived before the Son, who will judge it.

explore: |
  - **The wind and the Spirit.** [[John 3:8]], where the Savior uses the wind no one can trace for everyone born of the Spirit.
  - **The young man’s address goes on.** [[Eccl. 12:1–7]].

