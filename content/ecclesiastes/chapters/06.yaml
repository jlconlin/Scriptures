  - **The soul that is not filled.** [[Isa. 55:1–2]], [[2 Ne. 9:50–51]] and [[John 6:35]].
  - **Days as a shadow.** [[Ps. 39:4–7]], [[Ps. 144:3–4]] and [[James 4:14]].

