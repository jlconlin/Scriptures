chapter: 6
title: What Is Good for Man
tagline: The Preacher sees a man given everything and not allowed to enjoy it, judges a stillborn child better off, finds that labor never fills the soul, and ends asking who can tell a man what is good or what comes after him.
when: "The Preacher's reflections"

setting: |
  Chapter 6 carries on the Preacher's look at riches from chapter 5. Its first line, “There is an evil which I have seen under the sun,” takes up the “sore evil which I have seen under the sun” of [[Eccl. 5:13]].

  Chapter 5 ended with a man to whom God gave riches “and hath given him power to eat thereof,” and the Preacher called that “the gift of God” ([[Eccl. 5:19]]; on the gift, see [[Eccl. 2:24]]). Chapter 6 opens with the opposite case: the same gifts, but no power to enjoy them. The chapter has no turn toward God like the end of chapter 5. It ends instead with two questions that no one “under the sun” can answer.

  Three of the book's terms recur here and are explained where they first appear: “vanity” (*hebel*, a breath or vapor) at [[Eccl. 1:2]], “under the sun” at [[Eccl. 1:3]], and “vexation of spirit” at [[Eccl. 1:14]].

thread: |
  The Preacher has just said that to eat and enjoy the good of one's labor is God's gift. Now he describes a man who has every gift but that one. God gives him riches, wealth and honor, and a stranger enjoys them. Give the same man a hundred children and a long life: if his soul is not filled with good and he dies unburied, a stillborn child is better off, for it at least has rest. Two thousand years would change nothing, since all go to the same place.

  The middle verses widen the complaint from the rich man to everyone. All labor feeds the mouth, and the appetite is never filled; on one older reading, neither the wise man nor the poor man who knows how to carry himself is better off than the fool, and having what is before one's eyes is better than desire that wanders. A single Hebrew word, the soul that desires, runs through the chapter (see the note at verse 7).

  The last three verses step back. What exists was named long ago; man cannot dispute with one stronger than he (on one older reading, God), and more words only add to the vanity. The chapter closes on two questions: who knows what is good for a man in his brief life, and who can tell him what will come after him?

sections:
  - range: 1-2
    heading: Riches that another enjoys
    plain: |
      The Preacher has seen an evil under the sun that weighs heavily on people. God gives a man riches, wealth and honor, so that he lacks nothing he desires, and then does not give him the power to enjoy them; a stranger enjoys them instead. That is vanity, a grievous ill.
  - range: 3-6
    heading: The stillborn and the man of a hundred children
    plain: |
      Suppose a man fathers a hundred children and lives many years, as long as you like; if his soul is not satisfied with good things, and he does not even receive a burial, the Preacher says a stillborn child is better off than he. The stillborn child comes in vanity and goes away in darkness, and darkness covers its name; it has never seen the sun or known anything, yet it has more rest than that man (on verses 3–5, see the note). Even if he lived a thousand years twice over and saw no good, do not all go to one place ([[Eccl. 3:20]])?
  - range: 7-9
    heading: The appetite that is never filled
    plain: |
      All a man's labor is for his mouth, and yet his appetite is never filled. What advantage has the wise man over the fool? What has the poor man who knows how to conduct himself before others (on verses 7–9, see the note)? Better what the eyes see than wandering desire. This too is vanity and a striving after wind.
  - range: 10-12
    heading: Who can tell a man
    plain: |
      Whatever exists was named long ago, and what man is has long been known: he cannot dispute with one who is stronger than he. The more words, the more vanity, and what does a man gain by them (see the note)? For who knows what is good for a man in his life, through the few days of his fleeting life that he passes like a shadow? Who can tell a man what will happen under the sun after he is gone?

notes:
  - ref: 2
    phrase: 'yet God giveth him not power to eat thereof, but a stranger eateth it'
    kind: scripture
    title: Riches without the power to enjoy them
    body: |
      God gives this man wealth but not the “power to eat thereof,” the power to enjoy it; a modern translation reads, “yet God does not enable them to enjoy these things, but a stranger enjoys them.” He lacks only what the Preacher has just called “the gift of God” ([[Eccl. 5:19]]).

      The same translation's cross-references also point to the Savior's parable of the rich man who built bigger barns and heard, “Thou fool, this night thy soul shall be required of thee: then whose shall those things be, which thou hast provided?” ([[Luke 12:20]]). That link is the translation's, not the Preacher's, but the two share the stranger who takes what a man has gathered.
    sources: [esv, nrsvue]
  - ref: 3
    phrase: and also that he have no burial
    kind: history
    title: No burial
    body: |
      To lie unburied was, for Israel as for many ancient peoples, a disgrace and not only a misfortune. The Old Testament warns the unrepentant that their bodies will be left to the beasts instead of buried, a fate many ancient peoples saw “not only as a tragedy, as it would be today, but a disgrace and an indication of divine judgment,” for “The ideal afterlife in the Hebrew Bible was bound to the tomb.” Jeremiah says of King Jehoiakim, “He shall be buried with the burial of an ass, drawn and cast forth beyond the gates of Jerusalem” ([[Jer. 22:19]]). So the man of verse 3, given a hundred children and many years, ends with neither enjoyment in life nor honor in death.
    sources: [sc-knowhy-586]
  - ref: 3
    phrase: an untimely birth is better than he
    kind: symbol
    title: 'Better off than he: the stillborn'
    body: |
      The “untimely birth” is a child born dead, and modern translations render it “a stillborn child.” Modern translations read verses 4 and 5 of that child, not of the rich man: where the King James has “he cometh in with vanity,” a modern translation reads “For it comes in vanity and goes in darkness, and in darkness its name is covered.” Yet “it has not seen the sun or known anything, yet it finds rest rather than he.”

      The Preacher does not say that the stillborn child is blessed, only that it has rest, while the man who had everything and enjoyed none of it did not; he gives it as his own verdict (“I say”).
    sources: [esv, nrsvue]
  - ref: 7
    phrase: the appetite is not filled
    kind: words
    title: 'Soul, appetite and desire: one word'
    body: |
      “Appetite” in verse 7 is the same Hebrew word that the King James renders “soul” in verses 2 and 3 and “desire” in verse 9: *nephesh*, “soul, living being, life, self, person, desire, appetite.” In Ecclesiastes it is the self that wants: “the נפשׁ craves, lacks, and is filled with good things,” in these very verses. The repeated word ties the chapter's complaints together. The rich man lacks nothing “for his soul” (verse 2), yet his soul is “not filled with good” (verse 3); every man labors for his mouth, and yet the soul is not “filled” (verse 7, where the King James says “appetite”). On one older reading, the mouth and the soul are not set against each other as body and spirit: “instead of the soul the stomach could also be named,” for it is “the soul longing” for what keeps it alive.

      On the same older reading, verses 8 and 9 are about that desire too. The poor man “that knoweth to walk before the living” is the poor who “know how to conduct themselves before the living,” as a modern translation has it. The poor man “yet knows how to maintain his social position,” and the wise man “seeks to control his desire”; nevertheless, “desire is present in both; and they have in this nothing above the fool.” So “the sight of the eyes,” having what is before one, is better than “the wandering of the desire,” the soul that “goes out, and seeks and reaches not its aim”: “to have and to enjoy is better than this constant … hungering and longing.”
    sources: [oshb-wlc, bdb, esv, nrsvue, delitzsch-ecclesiastes]
  - ref: 11
    phrase: Seeing there be many things that increase vanity
    kind: words
    title: Many things, or many words
    body: |
      Modern translations read the “many things” of verse 11 as many words: “The more words, the more vanity.” On one older reading the Hebrew here means not “things” but “words,” because verse 10 has just spoken of disputing, and “The dispute (objection) … takes place in words.”

      Verse 10 says that whatever comes to be was named long ago, and, in a modern translation, that man is not able to dispute with one stronger than he. On that reading the stronger one is God, and the verse means that “the whole being of a man … is previously known”: “Against this formation of his nature and of his fate by a higher hand, man cannot utter a word.” Arguing with God about one's lot only adds to the vanity, “because they are resultless, they bring no advantage for man.”
    sources: [nrsvue, esv, delitzsch-ecclesiastes]
  - ref: 12
    phrase: for who can tell a man what shall be after him under the sun?
    kind: scripture
    title: What shall be after him
    body: |
      The chapter's last question, what comes after a man, is one the Preacher has asked twice before, and one modern translation's cross-references join all three verses. He hated his labor because he must leave it “unto the man that shall be after me” ([[Eccl. 2:18]]), and after counseling a man to rejoice in his own works, “for that is his portion,” he asked, “who shall bring him to see what shall be after him?” ([[Eccl. 3:22]]). In 2:18, at least, what comes after a man is what happens on earth to what he leaves. Under the sun, no one can tell him.

      The first question is set in the same brief span: “the few days of their vain life, which they pass like a shadow,” in a modern translation, whose cross-references set beside it “every man walketh in a vain shew” ([[Ps. 39:6]]) and James's “what is your life? It is even a vapour” ([[James 4:14]]). On “vain life,” *hebel*, see [[Eccl. 1:2]].
    sources: [esv, nrsvue]

christ: |
  The Preacher ends with “who knoweth what is good for man in this life” and “who can tell a man what shall be after him” ([[Eccl. 6:12]]). Beside his rich man whose soul is “not filled with good” stands the Savior's promise of more abundant life ([[John 10:10]]; on that promise beside the Preacher's enjoyment, see chapter 2). The Preacher asks what will happen under the sun after a man is gone; beyond that horizon Alma gives what an angel made known to him: “the spirits of all men, as soon as they are departed from this mortal body, … are taken home to that God who gave them life” ([[Alma 40:11]]).

  A disciple's life is not measured by what the appetite can hold or an heir can take: the life Christ gives is more abundant than either, and at death the spirit is taken home to God.

