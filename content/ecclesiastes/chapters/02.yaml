chapter: 2
title: I Will Prove Thee with Mirth
tagline: Speaking as king, the Preacher tries pleasure, great works, wisdom and toil, finds that each ends in vanity, and then turns to the enjoyment that comes only from the hand of God.
when: 'The Preacher’s reflections'

setting: |
  Ecclesiastes 2 continues the search the Preacher began at 1:12. There he speaks as a king in Jerusalem who gave his heart “to seek and search out by wisdom concerning all things that are done under heaven” (on who he is, see [[Eccl. 1:1]]). Chapter 1 closed with wisdom itself found to bring grief ([[Eccl. 1:16–18]]). Chapter 2 tests what remains: pleasure and laughter, great works and possessions, wisdom weighed against folly once more, and the labor a man must leave behind him. Chapters 1–2 are one movement, the Preacher’s “futile efforts” to find meaning “through worldly means”: he seeks pleasure, builds “great works” and gathers riches, and none of it satisfies him.

  The king’s list in verses 4–9 is a royal one, and the Church’s footnotes point from it to Solomon’s buildings and gold ([[1 Kgs. 7:1–12]]; [[1 Kgs. 10:10–14]]); the text itself never names him. The key words of chapter 1 return here, and they are explained where they first appear: “vanity” at [[Eccl. 1:2]], “profit” and “under the sun” at [[Eccl. 1:3]], “vexation of spirit” at [[Eccl. 1:14]]. The chapter ends with enjoyment received “from the hand of God” (verse 24), a thought chapter 3 takes up again ([[Eccl. 3:13]]).

thread: |
  Ecclesiastes 2 reports a series of experiments. Each is tried in earnest and each is found wanting, until the Preacher turns to what only God gives.

  He begins with pleasure (verses 1–3), and he tries it deliberately, with his wisdom still guiding him (see the note on verse 3). Then he builds and gathers on a royal scale: houses, vineyards, gardens, pools, servants, herds, silver and gold, singers (verses 4–8). He becomes great, his wisdom stays with him, and he denies his heart no joy; the joy is real, and he calls it his “portion” of all his labor (verses 9–10). But when he looks at the whole, with that same wisdom, he finds “vanity and vexation of spirit,” and “no profit under the sun” (verse 11).

  Next he weighs wisdom against folly (verses 12–17). No one who comes after the king can do more than he has already done (verse 12); on one older reading, that means no successor will reach a different result. Wisdom is better than folly as light is better than darkness, yet the wise man dies like the fool and is forgotten like him (verses 13–16). So he hates life, because the work done under the sun grieves him (verse 17).

  Then comes labor itself (verses 18–23). He must leave all he built to a man who may be wise or a fool, and a man who worked with wisdom and skill hands his portion to one who never labored for it. His days are sorrow, and even at night his heart does not rest.

  The chapter ends on another note (verses 24–26). Nothing is better than to eat and drink and find good in one’s labor, and that enjoyment comes “from the hand of God,” who gives wisdom, knowledge and joy to the one who is good in His sight. The last words are still “vanity and vexation of spirit” (what they refer to is in the note on verse 26), and the search goes on in chapter 3.

sections:
  - range: 1-3
    heading: Pleasure put to the test
    plain: |
      I said to my heart, “Come now, I will test you with mirth; enjoy what is good.” But this too was vanity. Of laughter I said, “It is madness,” and of mirth, “What does it accomplish?” I set out to cheer my body with wine while my heart still behaved itself with wisdom, and to take hold of folly, until I could see what is good for people to do under heaven all the days of their life.
  - range: 4-11
    heading: The king’s great works
    plain: |
      I did great things. I built houses and planted vineyards. I made gardens and parks and planted every kind of fruit tree in them. I made pools of water to irrigate a forest of growing trees. I acquired male and female servants, and had servants born in my house. I owned more herds and flocks than anyone before me in Jerusalem. I gathered silver and gold, and the treasures of kings and provinces. I got men and women singers, and the delights of mankind, musical instruments of every sort. So I became great, greater than all before me in Jerusalem, and my wisdom stayed with me. I kept nothing from my eyes that they desired, and held my heart back from no joy; my heart rejoiced in all my work, and that joy was my share of all my work. Then I looked at everything my hands had done and all the effort I had spent, and it was all vanity and a striving after wind; there was no gain under the sun.
  - range: 12-17
    heading: Wisdom and folly, and one end for both
    plain: |
      I turned to consider wisdom, madness and folly. For what can anyone who comes after the king do? Only what has already been done. I saw that wisdom is better than folly, as light is better than darkness. The wise have eyes in their heads, but the fool walks in darkness. Yet I also saw that the same thing happens to both. I said to myself, “What happens to the fool will happen to me too. Why then have I been so wise?” And I said that this too is vanity. The wise are no more remembered than the fool; in days to come both will be forgotten. How does the wise man die? Just like the fool. So I hated life, because the work done under the sun weighed on me; all is vanity and a striving after wind.
  - range: 18-23
    heading: Labor left to another
    plain: |
      I hated all the work I had done under the sun, because I must leave it to the one who comes after me. And who knows whether he will be wise or a fool? Yet he will be master of everything I worked for and spent my wisdom on under the sun. This too is vanity. So I gave my heart up to despair over all my work under the sun. A man may work with wisdom, knowledge and skill, and then have to leave it all as the portion of someone who never worked for it. This too is vanity and a great evil. What does anyone get from all his labor and the strain of his heart under the sun? All his days are pain, and his work is grief; even at night his heart finds no rest. This too is vanity.
  - range: 24-26
    heading: The gift from God’s hand
    plain: |
      There is nothing better for a person than to eat and drink and let his soul find good in his work. This too, I saw, comes from the hand of God. For who can eat, or who can enjoy anything, more than I? To the person who is good in His sight God gives wisdom, knowledge and joy; but to the sinner He gives the task of gathering and heaping up, only to hand it over to the one who is good in God’s sight. This too is vanity and a striving after wind.

notes:
  - ref: 3
    phrase: yet acquainting mine heart with wisdom
    kind: words
    title: Pleasure tested with wisdom in charge
    body: |
      The Preacher’s trial of pleasure was a deliberate experiment, carried out with his judgment kept in control. In verse 1 he addresses his heart, “I will prove thee with mirth,” that is, put it to the test; a modern translation renders “I will make a test of pleasure.” Verse 3 says how he ran the test. “To give myself unto wine” means to “cheer” the flesh with wine. “Acquainting mine heart with wisdom” means “my heart behaving itself in wisdom,” or, as a modern translation has it, “my mind still guiding me with wisdom.”

      Verse 9 says that wisdom “remained with me.” The aim was to see “what was that good for the sons of men” to do under heaven. On a Latter-day Saint reading, he “depended on the strength of his own acquired wisdom to guide him in comprehending what was good and what was not good.” It was with that same wisdom that he weighed everything he had gained and found it vanity (verse 11).
    sources: [bdb, nrsvue, ot-minute-ecclesiastes]

  - ref: 8
    phrase: as musical instruments, and that of all sorts
    kind: words
    title: Musical instruments, or something else
    body: |
      No one knows for certain what the last words of verse 8 mean, and the King James “musical instruments, and that of all sorts” is one guess among several. The Hebrew words are found only in this verse and are of “meaning unknown.” The Greek translation took the words as servants who pour wine: “a butler and female cupbearers.” A modern translation reads “delights of the flesh, many concubines.”

      Whichever is right, the words close the list of what the king gathered for himself in verses 4–8, the possessions he looks back on in verse 11.
    sources: [bdb, lxx-rahlfs, nrsvue]

  - ref: 14
    phrase: one event happeneth to them all
    kind: scripture
    title: One event for the wise and the fool
    body: |
      The Preacher holds two findings side by side and lets neither cancel the other: wisdom is better than folly as light is better than darkness (verses 13–14), and yet the same thing happens to the wise and to the fool. The “event” is what befalls a person, and verse 16 names it: “how dieth the wise man? as the fool.” The wise and the foolish “are all going to die,” and so wisdom is called “vanity,” “because the benefits of being wise are impermanent and sometimes not realized in this life.” He does not take back verse 13: the wise still see where they walk. What wisdom cannot give is escape from death or from being forgotten (verse 16); what wisdom can and cannot do is taken up at [[Eccl. 1:18]].
    sources: [bdb, sc-knowhy-868]

  - ref: 24
    phrase: There is nothing better for a man, than that he should eat and drink
    kind: scripture
    title: Eating and drinking from the hand of God
    body: |
      The Preacher concludes that food, drink, and satisfaction in one’s work are good and come from God. The enjoyment is “in his labour,” not in place of it, and it comes “from the hand of God.” He says the same thing more plainly a chapter later: to “eat and drink, and enjoy the good of all his labour, it is the gift of God” ([[Eccl. 3:13]]).

      Verse 25 may give the reason, depending on how its last words are read. The verb rendered “hasten” here means to “feel (i.e. enjoy pleasure),” and the last words are a textual question. Most Hebrew manuscripts read “apart from me,” the basis of the King James “more than I”; some Hebrew manuscripts, the Greek and the Syriac read “apart from him.” A modern translation follows the second: “for apart from him who can eat or who can have enjoyment?” The Greek has “who shall eat, or who shall drink, without him?” On that reading, verse 25 explains verse 24: no one eats or enjoys anything except from God’s hand, and verse 26 goes on to say to whom He gives joy.

      The Church’s footnote sets the verse beside the rich man who says to his soul, “eat, drink, and be merry” ([[Luke 12:19–21]]); how the two differ is taken up at [[Eccl. 8:15]]. On a Latter-day Saint reading, these verses show that the Preacher “was not in total despair,” and they stand beside Lehi’s “men are, that they might have joy” ([[2 Ne. 2:25]]): “Joy comes from the pursuit of virtue and wisdom rather than the pursuit of worldly things.”
    sources: [lds-scriptures, bdb, esv, nrsvue, lxx-rahlfs, ot-minute-ecclesiastes]

  - ref: 26
    phrase: to the sinner he giveth travail, to gather and to heap up, that he may give to him that is good before God
    kind: scripture
    title: The sinner’s gathering, and what is vanity
    body: |
      Verse 26 says that God gives differently to the good and to the sinner. To the one who is good in His sight He gives wisdom, knowledge and joy; to the sinner He gives the toil of gathering what passes in the end to someone else. The Church’s footnote points to the proverb that says the same of wealth: “the wealth of the sinner is laid up for the just” ([[Prov. 13:22]]). On one older reading, “good” and “sinner” here describe what the people are, not labels God assigns at will (“the unreasonable thought that good or bad is what God's arbitrary ordinance and judgment stamp it to be, is wholly foreign to him”). The sinner is the one who sins “without regarding Him.”

      The closing “This also is vanity and vexation of spirit” is harder, because the text does not say what “this” is. On a Latter-day Saint reading it is the sinner’s lot: he too may feel joy, “but because of their evil deeds, they only receive sorrow, which is of no benefit.” One older reading takes it instead as the whole striving after enjoyment from one’s labor, which is “vain,” “for the purpose and the issue lie far apart.” Either way the chapter ends where the Preacher’s reasoning stands at this point, with God’s gift acknowledged and the search not yet finished.
    sources: [lds-scriptures, delitzsch-ecclesiastes, ot-minute-ecclesiastes]

christ: |
  Under the sun, the Preacher finds, the wise man dies as the fool and his labor passes to a stranger (verses 16–19). Beside that limit stands Paul’s hope beyond this life, in the risen Christ ([[1 Cor. 15:19–22]]; see [[Eccl. 1]]). Beside the Preacher’s enjoyment “from the hand of God” (verse 24) stands the Savior’s purpose: “I am come that they might have life, and that they might have it more abundantly” ([[John 10:10]]).

  What a disciple builds, gathers and learns cannot by itself outlast death; life beyond death is in Christ. The food, the work and the joy of an ordinary day are received from God’s hand.

explore: |
  - **The rich man’s barns.** Read [[Luke 12:15–21]], to which the footnote at verse 24 points, beside verses 18–24.
  - **Wise men die.** Read [[Ps. 49]], to which the footnote at verse 16 points.
  - **Enjoyment as God’s gift through the book.** Follow it from verse 24 through [[Eccl. 3:12–13]], [[Eccl. 5:18–20]] and [[Eccl. 9:7–9]] to [[Eccl. 11:9]].
  - **Hope beyond this life.** Read [[1 Cor. 15:19–22]].

