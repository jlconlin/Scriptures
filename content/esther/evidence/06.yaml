chapter: 6
claims:
  - where: 'when'
    claim: 'Ahasuerus of Esther is Xerxes, who began to reign in 486 B.C. (the basis of the approximate date)'
    key: bible-chron-ot
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bible-chron/old-testament?lang=eng'
    quote: '=Xerxes, 486–465.'
  - where: 'setting'
    claim: 'Chapters 6–8 form one part of the book in Scripture Helps’ outline: the plot told, Haman hanged, Mordecai honored, the edict reversed'
    key: scripture-helps-esther
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/30-esther?lang=eng'
    quote: 'Esther 6–8: Esther tells the king about Haman’s plot to kill the Jews. The king has Haman hanged, honors Mordecai, and allows Mordecai and Esther to reverse the edict to kill the Jews.'
  - where: 'setting'
    claim: 'Mordecai’s act was a few years before the night of chapter 6'
    key: scripture-helps-esther
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/30-esther?lang=eng'
    quote: 'prompting him to remember Mordecai’s heroic act from a few years prior.'
  - where: 'thread'
    claim: 'The Lord’s influence is implied in the king’s reading this part of the record'
    key: scripture-helps-esther
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/30-esther?lang=eng'
    quote: 'It is implied that the Lord’s influence led the king to read this particular part of the record, prompting him to remember Mordecai’s heroic act from a few years prior.'
  - where: 'thread'
    claim: 'Haman did for Mordecai what he hoped would be done for himself, and never got to do what he had planned'
    key: ot-manual-31
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-31?lang=eng'
    quote: 'Haman had the frustration and humiliation of doing for Mordecai what Haman had hoped was to be done for himself; moreover, he had no opportunity to do what he had planned to do to Mordecai.'
  - where: 'note 6:1 “The night the king could not sleep”'
    claim: 'The book read was an official record of events in the empire, and the Lord’s influence is implied in the king’s reading this part of it, a few years after Mordecai’s act'
    key: scripture-helps-esther
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/30-esther?lang=eng'
    quote: 'The book from which the king’s servants read was an official record of events in the Persian empire. … It is implied that the Lord’s influence led the king to read this particular part of the record, prompting him to remember Mordecai’s heroic act from a few years prior.'
  - where: 'note 6:1 “The night the king could not sleep”'
    claim: 'The Greek version names the Lord as the cause of the sleeplessness'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/esther/6.htm'
    quote: '1But the Lord removed sleep from the king that night: and he told his servant to bring in the books, the registers of daily events, to read to him.'
  - where: 'note 6:1 “The night the king could not sleep”'
    claim: 'The Greek version gives Haman’s counsellors a reason: the living God is with Mordecai'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/esther/6.htm'
    quote: 'thou wilt assuredly fall, and thou wilt not be able to withstand him, for the living God is with him.'
  - where: 'note 6:1 “The night the king could not sleep”'
    claim: 'The twenty-four hours between the banquets mattered: without the king prepared beforehand, a direct accusation of so favored a man might have been rejected'
    key: ot-manual-31
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-31?lang=eng'
    quote: 'What happened in those twenty-four hours was of the greatest importance (see chap. 6). … With Haman’s powerful position and favor in the eyes of the king (see Esther 3:1–2), a direct accusation by Esther might well have been rejected had the king not been prepared beforehand.'
  - where: 'note 6:8 “The king’s own robe, horse and crown”'
    claim: 'The Hebrew perfect means a robe the king himself has already worn, not an ordinary state robe; this was the highest honor a subject could be shown'
    key: keil-esther
    url: 'https://biblehub.com/commentaries/kad/esther/6.htm'
    quote: 'one which the king has himself already put on or worn. Hence it is not an ordinary state-robe … This was the highest mark of honour that could be shown to a subject.'
  - where: 'note 6:8 “The king’s own robe, horse and crown”'
    claim: '“His head” refers to the horse’s head, against most older interpreters, who took it as the honored man’s'
    key: keil-esther
    url: 'https://biblehub.com/commentaries/kad/esther/6.htm'
    quote: 'refers to the head of the horse, not to the head of the man to be honoured, as Clericus, Rambach, and most ancient expositors explain the words'
  - where: 'note 6:8 “The king’s own robe, horse and crown”'
    claim: 'Assyrian and Persian sculptures seem to show royal horses with three-pointed ornaments on their heads that may be a kind of crown'
    key: keil-esther
    url: 'https://biblehub.com/commentaries/kad/esther/6.htm'
    quote: 'certain Assyrian and ancient Persian sculptures, representing the horses of the king, and apparently those of princes, with ornaments on their heads terminating in three points, which may be regarded as a kind of crown.'
  - where: 'note 6:8 “The king’s own robe, horse and crown”'
    claim: 'The NIV reads a robe the king has worn and a horse with a royal crest on its head'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Esther+6%3A8&version=NIV'
    quote: 'have them bring a royal robe(A) the king has worn and a horse(B) the king has ridden, one with a royal crest placed on its head.'
  - where: 'note 6:8 “The king’s own robe, horse and crown”'
    claim: 'The ESV reads the crown on the horse’s head'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Esther+6%3A8&version=ESV'
    quote: 'let royal robes be brought, which the king has worn, (A)and the horse that the king has ridden, and on whose head (B)a royal crown is set.'
  - where: 'note 6:8 “The king’s own robe, horse and crown”'
    claim: 'Young’s literal rendering leaves “his head” as ambiguous as the King James'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/esther/6-8.htm'
    quote: 'let them bring in royal clothing that the king hath put on himself, and a horse on which the king hath ridden, and that the royal crown be put on his head,'
  - where: 'note 6:10 “Honor for Mordecai the Jew”'
    claim: 'The decree sealed with the king’s ring ordered the destruction of all Jews'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/3?lang=eng'
    quote: 'to destroy, to kill, and to cause to perish, all Jews, both young and old'
  - where: 'note 6:13 “What Haman’s own house foresaw”'
    claim: 'Haman’s advisers perhaps saw the divine protection the Hebrews often received; Haman was about to meet the fate he had set up for himself'
    key: breitenstein-esther-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/esther-1-10'
    quote: 'His advisors perhaps saw the divine protection that the Hebrews often received. As they were still talking, the king called for Haman to join him and Esther at the banquet. Haman was about to meet his fate, which he had unwittingly set up for himself.'
  - where: 'note 6:13 “What Haman’s own house foresaw”'
    claim: 'Zeresh, with Haman’s friends, had advised the gallows the night before'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/5?lang=eng'
    quote: 'Then said Zeresh his wife and all his friends unto him, Let a gallows be made of fifty cubits high'
  - where: 'christ'
    claim: 'The Lord’s influence is implied in the king’s sleepless reading'
    key: scripture-helps-esther
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/30-esther?lang=eng'
    quote: 'It is implied that the Lord’s influence led the king to read this particular part of the record'
  - where: 'christ'
    claim: 'Haman’s pride and anger lead to his downfall'
    key: cfm-ot-2026-32
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/32?lang=eng'
    quote: 'Esther 3; 5:9–14; 7: Pride and anger can lead to downfall. In the book of Esther, we learn from the faithfulness of Esther and Mordecai, but we also learn from the pride and anger of Haman.'
  - where: 'explore'
    claim: 'Mordecai’s public honor is set beside Joseph’s in Genesis 41:43'
    key: keil-esther
    url: 'https://biblehub.com/commentaries/kad/esther/6.htm'
    quote: 'and on the matter itself, Genesis 41:43.'
