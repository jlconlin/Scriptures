chapter: 10
claims:
  - where: 'setting'
    claim: 'Chapters 9–10 form the last part of the book in Scripture Helps’ outline: the Jews receive authority to kill their enemies and institute Purim'
    key: scripture-helps-esther
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/30-esther?lang=eng'
    quote: 'Esther 9–10: The Jews receive authority from the king to kill their enemies in the kingdom. They institute the Feast of Purim.'
  - where: 'setting'
    claim: 'Chapter 10’s heading: Mordecai stands next to Ahasuerus in power and might; Mordecai’s growing greatness in 9:4'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/9?lang=eng'
    quote: 'For Mordecai was great in the king’s house, and his fame went out throughout all the provinces: for this man Mordecai waxed greater and greater.'
  - where: 'thread'
    claim: 'The book’s outcome is a reversal of fortunes: Haman executed, Mordecai honored'
    key: scripture-helps-esther
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/30-esther?lang=eng'
    quote: 'Esther’s intervention saved her people. In a reversal of fortunes, Haman was executed and Mordecai was honored.'
  - where: 'note 10:1 “A levy on land and sea”'
    claim: 'The Hebrew mas elsewhere is a levy of forced labor (Solomon’s labor bands, the gang-overseers in Egypt, conquered peoples); in Esther 10:1 alone it is forced service, or possibly tribute, enforced payment'
    key: bdb
    url: 'https://biblehub.com/hebrew/4522.htm'
    quote: '4 forced service, serfdom (or possibly (in late passage) tribute = enforced payment, compare Late Hebrew, ᵑ7, see above), only of Ahasuerus'
  - where: 'note 10:1 “A levy on land and sea”'
    claim: 'Elsewhere mas is a labour-band raised by levy, as under Solomon, and the gang-overseers of Israel in Egypt'
    key: bdb
    url: 'https://biblehub.com/hebrew/4522.htm'
    quote: '1 labour-band, labour-gang, body of task-workers for public service, formed by levy upon the people by Solomon … 2. a. of labour-bands, slave-gangs of Israel in Egypt, only שָׂרֵי מִסִּים Exodus 1:11 (J) gang-overseers.'
  - where: 'note 10:1 “A levy on land and sea”'
    claim: 'The provinces paid their imposts mostly in produce of their labor, so their labor was a kind of service to the king'
    key: keil-esther
    url: 'https://biblehub.com/commentaries/kad/esther/10.htm'
    quote: 'As the provinces of the kingdom paid the imposts for the most part in natural produce, which they had reared or obtained by the labour of their hands, their labour (agriculture, cattle-keeping, etc.) was to a certain extent service rendered to the king.'
  - where: 'note 10:1 “A levy on land and sea”'
    claim: 'Verse 1 seems extraneous; Keil explains it as drawn from the chronicle the author used, telling at the close whence the king had the means for the splendor of chapter 1'
    key: keil-esther
    url: 'https://biblehub.com/commentaries/kad/esther/10.htm'
    quote: 'The matter of Esther 10:1 seems extraneous to the contents of our book … its author, before referring to his authorities, gives at its close the information contained in Esther 10:1, from the book of the chronicles of the kingdom'
  - where: 'note 10:2 “Written in the chronicles of Media and Persia”'
    claim: 'The footnotes to “chronicles” point to 1 Kings 14:19, 1 Chronicles 27:24 and Esther 6:1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/10?lang=eng'
    quote: 'are they not written in the book of the chronicles of the kings of Media and Persia?'
  - where: 'note 10:2 “Written in the chronicles of Media and Persia”'
    claim: 'The book read to the king in 6:1 was an official record of events in the Persian empire, mentioned elsewhere in Esther and in Ezra'
    key: scripture-helps-esther
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/30-esther?lang=eng'
    quote: 'The book from which the king’s servants read was an official record of events in the Persian empire. This record is also mentioned elsewhere in Esther and in Ezra.'
  - where: 'note 10:2 “Written in the chronicles of Media and Persia”'
    claim: 'Esther’s decree confirming Purim was entered in the book of chronicles of the kings (6:1; 10:2)'
    key: breitenstein-esther-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/esther-1-10'
    quote: 'Queen Esther also wrote a decree, confirming what Mordecai had established in his letter. The decree was entered into the book of chronicles of the kings (see 6:1; 10:2).'
  - where: 'note 10:3 “Second to the king, as Joseph and Daniel were”'
    claim: 'The Hebrew behind “next” is mishneh, second in rank; BDB lists Joseph’s “second chariot” (Gen. 41:43), the one “next to the king” (2 Chr. 28:7) and Esther 10:3 under the same sense'
    key: bdb
    url: 'https://biblehub.com/hebrew/4932.htm'
    quote: 'a. second, rank, ׳מִרְכֶּבֶת הַמּ Genesis 41:43 (J) … of person one second in rank … מִשְׁנֵה הַמֶּלֶךְ2Chronicles 28:7, לַמֶּלֶךְ ׳מ Esther 10:3'
  - where: 'note 10:3 “Second to the king, as Joseph and Daniel were”'
    claim: 'The footnotes set “advanced” beside Dan. 3:30, “Jew” beside Dan. 6:3 and “next” beside Gen. 41:40; the footnote at 4:14 points to Gen. 45:7'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/10?lang=eng'
    quote: 'For Mordecai the Jew was next unto king Ahasuerus, and great among the Jews'
  - where: 'note 10:3 “Second to the king, as Joseph and Daniel were”'
    claim: 'Mordecai’s place near the king relieved the Jews of much oppression and gave them a favorable place in the empire'
    key: ot-manual-31
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-31?lang=eng'
    quote: 'Having Mordecai near the king undoubtedly relieved the Jews of much oppression and gave them a favorable place in the empire.'
  - where: 'note 10:3 “Seeking the good of his people”'
    claim: 'The older first sense of “wealth” was prosperity, well-being (Webster’s first sense, 1828)'
    key: webster-1828
    url: 'https://webstersdictionary1828.com/Dictionary/wealth'
    quote: '1. Prosperity; external happiness.'
  - where: 'note 10:3 “Seeking the good of his people”'
    claim: 'The Hebrew tov here means welfare, prosperity, happiness; BDB cites it as the object of “seek” (darash) in Esther 10:3, and pairs it with shalom'
    key: bdb
    url: 'https://biblehub.com/hebrew/2896.htm'
    quote: '1 welfare, prosperity, happiness: "" שָׁלוֺם Isaiah 52:7 … of דרשׁ Esther 10:3'
  - where: 'note 10:3 “Seeking the good of his people”'
    claim: '“Seed” in Esther 10:3 is one’s nation, parallel with “people,” not descendants'
    key: bdb
    url: 'https://biblehub.com/hebrew/2233.htm'
    quote: '= one''s nation, as of same blood Esther 10:3 ("" עַם).'
  - where: 'christ'
    claim: 'The Savior taught that greatness among His disciples is service, after His own pattern; King Benjamin’s teaching on serving others as serving God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/20?lang=eng'
    quote: 'whosoever will be great among you, let him be your minister'
  - where: 'explore'
    claim: 'Joseph’s reading of his own rise as sent to preserve his family; Daniel preferred above the presidents; Purim’s letters written in the book'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/45?lang=eng'
    quote: 'to preserve you a posterity in the earth'
  - where: 'note 10:3 “Second to the king, as Joseph and Daniel were”'
    claim: 'Mordecai became the chief minister of the king'
    key: ot-manual-31
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-31?lang=eng'
    quote: 'Because he had prepared himself and was willing to become involved, he eventually became the chief minister of the king.'
