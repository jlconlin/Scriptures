chapter: 8
claims:
  - where: 'when'
    claim: 'Ahasuerus of Esther is Xerxes, who began to reign in 486 B.C. (the basis of the approximate date)'
    key: bible-chron-ot
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bible-chron/old-testament?lang=eng'
    quote: '=Xerxes, 486–465.'
  - where: 'when'
    claim: 'The date of the second decree is given in the verse'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/8?lang=eng'
    quote: 'Then were the king’s scribes called at that time in the third month, that is, the month Sivan, on the three and twentieth day thereof'
  - where: 'setting'
    claim: 'Xerxes began to reign in 486 B.C.'
    key: bible-chron-ot
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bible-chron/old-testament?lang=eng'
    quote: '=Xerxes, 486–465.'
  - where: 'setting'
    claim: 'Chapters 6–8 form one part of the book: the plot told, Haman hanged, Mordecai honored, the edict answered'
    key: scripture-helps-esther
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/30-esther?lang=eng'
    quote: 'Esther 6–8: Esther tells the king about Haman’s plot to kill the Jews. The king has Haman hanged, honors Mordecai, and allows Mordecai and Esther to reverse the edict to kill the Jews.'
  - where: 'setting'
    claim: 'Haman’s edict was still in force after his death and could not be revoked'
    key: keil-esther
    url: 'https://biblehub.com/commentaries/kad/esther/8.htm'
    quote: 'The chief enemy of the Jews was now destroyed; but the edict, written in the king''s name, sealed with the royal seal, and published in all the provinces of the kingdom, for the destruction of all the Jews on the 13th day of the twelfth month, was still in force'
  - where: 'setting'
    claim: 'Haman’s letters dated the thirteenth of the first month; Mordecai’s the twenty-third of the third; both for the thirteenth of Adar (the interval is the text’s arithmetic)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/3?lang=eng'
    quote: 'Then were the king’s scribes called on the thirteenth day of the first month'
  - where: 'thread'
    claim: 'The decree could not be undone, so Esther obtained a second decree letting the Jews defend themselves'
    key: scripture-helps-esther
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/30-esther?lang=eng'
    quote: 'The text notes that King Ahasuerus’s decree, which mandated the destruction of the Jews, could not be undone. So Esther persuaded the king to issue another decree allowing the Jews to defend themselves before the planned day of their own massacre.'
  - where: 'thread'
    claim: 'The joy of 8:17 answers the grief Haman’s edict caused in 4:3; Mordecai received Haman’s house, ring and place'
    key: keil-esther
    url: 'https://biblehub.com/commentaries/kad/esther/8.htm'
    quote: 'And in every province and city ... there was joy and a glad day, a feast day, comp. Esther 9:19, Esther 9:22, while Haman''s edict had caused grief and lamentation, Esther 4:3.'
  - where: 'section 3 plain'
    claim: 'The words of verse 10 mean swift horses from the royal studs'
    key: keil-esther
    url: 'https://biblehub.com/commentaries/kad/esther/8.htm'
    quote: 'means government, royal, or court studs.'
  - where: 'section 3 plain'
    claim: '“Power” in verse 11 is military power, an armed force'
    key: keil-esther
    url: 'https://biblehub.com/commentaries/kad/esther/8.htm'
    quote: 'all the power (חיל, military power) of the people and province that should assault them'
  - where: 'note 8:2 “Haman''s house and Haman''s ring”'
    claim: 'Haman’s property was confiscated; “the house of Haman” is the house with all that pertained to it'
    key: keil-esther
    url: 'https://biblehub.com/commentaries/kad/esther/8.htm'
    quote: 'By the execution of Haman, his property was confiscated, and the king decreed that the house of the Jews'' enemy should be given to Esther. The "house of Haman" undoubtedly means the house with all that pertained to it.'
  - where: 'note 8:2 “Haman''s house and Haman''s ring”'
    claim: 'Mordecai came before the king: received among the dignitaries with personal access; Esther had told him he was her kinsman and foster-father'
    key: keil-esther
    url: 'https://biblehub.com/commentaries/kad/esther/8.htm'
    quote: 'viz., her kinsman and foster-father, Esther 2:7. This information effected Mordochai''s appearance before the king, i.e., his reception into the number of the high dignitaries who beheld the face of the king, i.e., were allowed personal access to him'
  - where: 'note 8:2 “Haman''s house and Haman''s ring”'
    claim: 'The ring made Mordecai first minister; the seal gave royal edicts the force of law'
    key: keil-esther
    url: 'https://biblehub.com/commentaries/kad/esther/8.htm'
    quote: 'By this act Mordochai was advanced to the post of first minister of the king; comp. Genesis 41:42, 1 Macc. 6:15. The king''s seal gave the force of law to royal edicts, the seal taking the place of the signature.'
  - where: 'note 8:2 “Haman''s house and Haman''s ring”'
    claim: 'Mordecai advanced to Haman’s place'
    key: keil-esther
    url: 'https://biblehub.com/commentaries/kad/esther/8.htm'
    quote: 'The king bestowed the house of Haman on Esther, and advanced Mordochai to Haman''s place of prime minister'
  - where: 'note 8:2 “Haman''s house and Haman''s ring”'
    claim: 'The footnotes at 8:2 point to Gen. 41:42 and Esth. 3:10 '
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/8?lang=eng'
    quote: '2a “ring”: Gen. 41:42; Esth. 3:10.'
  - where: 'note 8:8 “A decree no one can reverse”'
    claim: 'The decree could not be undone; Esther persuaded the king to issue another letting the Jews defend themselves'
    key: scripture-helps-esther
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/30-esther?lang=eng'
    quote: 'The text notes that King Ahasuerus’s decree, which mandated the destruction of the Jews, could not be undone. So Esther persuaded the king to issue another decree allowing the Jews to defend themselves before the planned day of their own massacre.'
  - where: 'note 8:8 “A decree no one can reverse”'
    claim: 'The rule already stated at 1:19 (the text)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/1?lang=eng'
    quote: 'let it be written among the laws of the Persians and the Medes, that it be not altered'
  - where: 'note 8:9 “Letters to the Jews themselves”'
    claim: 'Haman’s letters addressed to lieutenants, governors and rulers (the text)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/3?lang=eng'
    quote: 'there was written according to all that Haman had commanded unto the king’s lieutenants, and to the governors that were over every province, and to the rulers of every people of every province'
  - where: 'note 8:10 “The king''s swift horses”'
    claim: 'NIV renders verse 10 as fast horses bred for the king'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Esther%208:10&version=NIV'
    quote: 'sent them by mounted couriers, who rode fast horses especially bred for the king.'
  - where: 'note 8:10 “The king''s swift horses”'
    claim: 'ESV renders verse 10 as swift horses from the royal stud'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Esther%208:10&version=ESV'
    quote: 'riding on (C)swift horses that were used in the king''s service, bred from the royal stud,'
  - where: 'note 8:11 “Whose little ones and women?”'
    claim: 'In the Hebrew “little ones and women” follow “those attacking them” with no possessive'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Esth.xml'
    quote: 'lemma="d/6696 b" morph="HTd/Vqrmpa" id="17cH4">הַ/צָּרִ֥ים</w> <w lemma="853" n="1.0" morph="HTo/Sp3mp" id="17ygk">אֹתָ֖/ם</w> <w lemma="2945" morph="HNcmsa" id="1772b">טַ֣ף</w>'
  - where: 'note 8:11 “Whose little ones and women?”'
    claim: 'The verb behind “assault” means to show hostility to, treat as foe'
    key: bdb
    url: 'https://biblehub.com/hebrew/6696.htm'
    quote: 'III. [צוּר] verb shew hostility to, treat as foe (with accusative of person)'
  - where: 'note 8:11 “Whose little ones and women?”'
    claim: 'NIV takes the women and children as the Jews’ own'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Esther%208:11&version=NIV'
    quote: 'the armed men of any nationality or province who might attack them and their women and children'
  - where: 'note 8:11 “Whose little ones and women?”'
    claim: 'ESV takes the children and women with the attacking force'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Esther%208:11&version=ESV'
    quote: 'any armed force of any people or province that might attack them, children and women included'
  - where: 'note 8:11 “Whose little ones and women?”'
    claim: 'NRSVue renders “their children, and their women”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Esther%208:11&version=NRSVUE'
    quote: 'any armed force of any people or province that might attack them, their children, and their women'
  - where: 'note 8:11 “Whose little ones and women?”'
    claim: 'Chapter 9 counts men in Shushan and records three times that the spoil was not taken (the text)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/9?lang=eng'
    quote: 'And in Shushan the palace the Jews slew and destroyed five hundred men.'
  - where: 'note 8:15 “Mordecai''s robes of office”'
    claim: 'Blue and white as in 1:6; crown and mantle of byssus and purple; the state garments of the first minister, not the garment of 6:8, a sign of his induction'
    key: keil-esther
    url: 'https://biblehub.com/commentaries/kad/esther/8.htm'
    quote: 'The garments in which Mordochai left the king are evidently the state garments of the first minister, which Mordochai received at his installation to his office, and, as such, no fresh token of royal favour, but only his actual induction in his new dignity, and a sign of this induction to all who saw him issue from the palace so adorned.'
  - where: 'note 8:15 “Mordecai''s robes of office”'
    claim: 'Blue and white compared with 1:6; the wide mantle'
    key: keil-esther
    url: 'https://biblehub.com/commentaries/kad/esther/8.htm'
    quote: 'Mordochai went out from the king in a garment of deep blue and white material (comp. Esther 1:6), and with a great crown of gold, and a mantle of byssus and purple. תּכריך, ἁπ. λεγ., in the Aramaean תּכריכא, a wide mantle or covering.'
  - where: 'note 8:15 “Mordecai''s robes of office”'
    claim: 'Light is a figure for prosperity'
    key: keil-esther
    url: 'https://biblehub.com/commentaries/kad/esther/8.htm'
    quote: 'light, is a figurative expression for prosperity.'
  - where: 'note 8:15 “Mordecai''s robes of office”'
    claim: 'The joy of 8:17 compared with 9:19 and set against the grief of 4:3'
    key: keil-esther
    url: 'https://biblehub.com/commentaries/kad/esther/8.htm'
    quote: 'there was joy and a glad day, a feast day, comp. Esther 9:19, Esther 9:22, while Haman''s edict had caused grief and lamentation, Esther 4:3.'
  - where: 'note 8:15 “Mordecai''s robes of office”'
    claim: 'The mourning when the first decree came (the text)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/4?lang=eng'
    quote: 'there was great mourning among the Jews, and fasting, and weeping, and wailing; and many lay in sackcloth and ashes.'
  - where: 'note 8:17 “Many became Jews”'
    claim: 'The verb (H3054) is a single word in the Hebrew of 8:17'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Esth.xml'
    quote: '<w lemma="3054" n="0.1" morph="HVtrmpa" id="17q6h">מִֽתְיַהֲדִ֔ים</w>'
  - where: 'christ'
    claim: 'Jesus read from Isa. 61 in Nazareth and declared the passage fulfilled (the text)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/4?lang=eng'
    quote: 'This day is this scripture fulfilled in your ears.'
  - where: 'explore'
    claim: 'Scripture threads for further study'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/9?lang=eng'
    quote: 'though it was turned to the contrary, that the Jews had rule over them that hated them'
  - where: 'note 8:8 “A decree no one can reverse”'
    claim: 'Scripture Helps compares 8:8 with 1:19 and Dan. 6:7–9'
    key: scripture-helps-esther
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/30-esther?lang=eng'
    quote: 'See Esther 8:8. Compare with Esther 1:19; Daniel 6:7–9.'
  - where: 'note 8:9 “Letters to the Jews themselves”'
    claim: 'The footnote at 8:10 points back to Haman’s letters, 3:12–13'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/8?lang=eng'
    quote: '10a “name”: Esth. 3:12 (12–13).'
  - where: 'note 8:10 “The king''s swift horses”'
    claim: 'The first word is a collective noun, steeds'
    key: bdb
    url: 'https://biblehub.com/hebrew/7409.htm'
    quote: 'רֶ֫כֶשׁ noun masculineEsther 8:10 collective steeds'
  - where: 'note 8:10 “The king''s swift horses”'
    claim: 'The second word is an adjective, royal, from Persian khshatra'
    key: bdb
    url: 'https://biblehub.com/hebrew/327.htm'
    quote: 'adjective (?) royal (from Persian Khshatra, lordship, realm, see Spiegl. with 215) plural הָאֲחַשְׁתְּרָנִים agreeing with הָרֶכֶשׁ Esther 8:10,14.'
  - where: 'note 8:10 “The king''s swift horses”'
    claim: 'The third is a foreign word of uncertain meaning related to words for a herd; usually “sons of the (royal) mares”'
    key: bdb
    url: 'https://biblehub.com/hebrew/7424.htm'
    quote: 'exact meaning dubious (compare Syriac herd; foreign word; … בְּנֵי הָרַמָּכִים Esther 8:10 usually sons of the (royal) mares, said of הָרֶכֶשׁ.'
  - where: 'note 8:11 “Whose little ones and women?”'
    claim: 'The footnote at 8:12 points back to 3:13'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/8?lang=eng'
    quote: '12a “one”: Esth. 3:13.'
  - where: 'note 8:11 “Whose little ones and women?”'
    claim: 'The word for “power” in 8:11 is used of an army'
    key: bdb
    url: 'https://biblehub.com/hebrew/2428.htm'
    quote: 'a powerful army (on form compare Sta§ 194 c); also (late) חֵיל הַצָּבָא 1 Chronicles 20:1; 2Chronicles 26:13, חֵיל עָם Esther 8:11'
  - where: 'note 8:11 “Whose little ones and women?”'
    claim: '“Stand for their life” rendered “defend their lives”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Esther%208:11&version=ESV'
    quote: 'to gather and defend their lives'
  - where: 'note 8:8 “A decree no one can reverse”'
    claim: 'With the ring the king had told Haman to do with the people as seemed good to him (the text)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/3?lang=eng'
    quote: 'The silver is given to thee, the people also, to do with them as it seemeth good to thee.'
  - where: 'note 8:9 “Letters to the Jews themselves”'
    claim: 'Haman’s copy was published to all people, that they should be ready (the text)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/3?lang=eng'
    quote: 'The copy of the writing for a commandment to be given in every province was published unto all people, that they should be ready against that day.'
  - where: 'note 8:15 “Mordecai''s robes of office”'
    claim: 'The apparel of chapter 6 was the king’s own, worn in a procession through the city (the text)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/6?lang=eng'
    quote: 'Then took Haman the apparel and the horse, and arrayed Mordecai, and brought him on horseback through the street of the city'
  - where: 'note 8:15 “Mordecai''s robes of office”'
    claim: 'The footnote on “apparel” points to Joseph’s investiture, Gen. 41:42'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/8?lang=eng'
    quote: '15a “apparel”: Gen. 41:42; Dan. 5:29.'
  - where: 'note 8:15 “Mordecai''s robes of office”'
    claim: 'Joseph arrayed in fine linen when Pharaoh gave him the ring (the text)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/41?lang=eng'
    quote: 'Pharaoh took off his ring from his hand, and put it upon Joseph’s hand, and arrayed him in vestures of fine linen'
  - where: 'note 8:17 “Many became Jews”'
    claim: 'The verb is a denominative, to become a Jew, cited only at Esther 8:17'
    key: bdb
    url: 'https://biblehub.com/hebrew/3054.htm'
    quote: '[יהד] verbdenominative Hithpa`el become a Jew — only participle מִתְיַהֲדִים Esther 8:17 many of the people of the land were becoming Jews.'
