chapter: 5
claims:
  # ---- when / setting / thread ----
  - where: 'when'
    claim: 'Ahasuerus (Xerxes) began to reign in 486 B.C., from which the twelfth year is reckoned'
    key: bible-chron-ot
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bible-chron/old-testament?lang=eng'
    quote: 'Xerxes, 486–465'
  - where: 'setting'
    claim: 'The twelfth year of Ahasuerus counts from his accession in 486 B.C.'
    key: bible-chron-ot
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bible-chron/old-testament?lang=eng'
    quote: 'Xerxes, 486–465'
  - where: 'setting'
    claim: 'Chapters 3–5 form one part of the book: Haman''s plan, Esther''s risk in going uninvited, the king''s kind reception and the banquet'
    key: scripture-helps-esther
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/30-esther?lang=eng'
    quote: 'Esther 3–5: Haman crafts a plan to destroy all the Jews in the kingdom after Mordecai refuses to bow down to him. Esther risks her life by going to see the king uninvited. The king receives her kindly and agrees to join Esther for a banquet along with Haman.'
  - where: 'thread'
    claim: 'The chapter''s two preparations for the morrow, and the night that follows (5:8, 12, 14; 6:1), are in the text'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/6?lang=eng'
    quote: 'On that night could not the king sleep'
  # ---- notes ----
  - where: 'note 5:1 “Royal apparel on the third day”'
    claim: 'The third day is counted from the day of Esther''s exchange with Mordecai; Keil reckons the fast at some 40 to 45 hours'
    key: keil-esther
    url: 'https://biblehub.com/commentaries/kad/esther/5.htm'
    quote: 'The third day must be counted from the day of the transaction between the queen and Mordochai (Esther 4:14); the first day being that on which it took place. … Thus the three days'' fast would last from the afternoon of the first to the forenoon of the third day, i.e., from 40 to 45 hours.'
  - where: 'note 5:1 “Royal apparel on the third day”'
    claim: 'The Hebrew says she "put on royalty," royal dignity; the expression is elliptical'
    key: keil-esther
    url: 'https://biblehub.com/commentaries/kad/esther/5.htm'
    quote: 'מלכוּת תּלבּשׁ, she put on royalty, royal dignity, i.e., arrayed herself in royal apparel. … The expression is elliptical'
  - where: 'note 5:1 “Royal apparel on the third day”'
    claim: 'The same word malkut names what she puts on and the king''s royal throne and royal house in the verse'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Esth.xml'
    quote: 'lemma="d/4438" n="0.1" morph="HTd/Ncfsa" id="17zjv">הַ/מַּלְכ֔וּת'
  - where: 'note 5:1 “Royal apparel on the third day”'
    claim: 'Esther asked for a fast of three days, night or day (4:16)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/4?lang=eng'
    quote: 'neither eat nor drink three days, night or day'
  - where: 'note 5:8 “A request held back a day”'
    claim: '"Half of the kingdom" appears to be a gesture rather than a serious offer'
    key: breitenstein-esther-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/esther-1-10'
    quote: 'That kind of offering is also seen elsewhere in the scriptures and appears to be only a gesture rather than a serious offer (see Mark 6:23).'
  - where: 'note 5:8 “A request held back a day”'
    claim: 'The Student Manual: the twenty-four hours of delay mattered (chapter 6); given Haman''s position, a direct accusation might have been rejected had the king not been prepared'
    key: ot-manual-31
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-31?lang=eng'
    quote: 'What happened in those twenty-four hours was of the greatest importance (see chap. 6). … With Haman’s powerful position and favor in the eyes of the king (see Esther 3:1–2), a direct accusation by Esther might well have been rejected had the king not been prepared beforehand.'
  - where: 'note 5:8 “A request held back a day”'
    claim: 'Esther begins "My petition and my request is;" and asks for a second banquet, promising to do as the king said on the morrow'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/5?lang=eng'
    quote: 'My petition and my request is'
  - where: 'note 5:9 “Neither rose nor trembled”'
    claim: 'The verb rendered "moved" (zua) means to tremble or quake in the presence of a powerful superior, as in Esther 5:9'
    key: bdb
    url: 'https://biblehub.com/hebrew/2111.htm'
    quote: 'tremble, quake, in presence of powerful superior Esther 5:9 (followed by מִמֶּנּוּ)'
  - where: 'note 5:9 “Neither rose nor trembled”'
    claim: 'Mordecai''s earlier refusal to bow (3:2, 5) and the decree hanging over his people (3:13; 4:1–3) are in the text'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/3?lang=eng'
    quote: 'But Mordecai bowed not, nor did him reverence.'
  - where: 'note 5:9 “Neither rose nor trembled”'
    claim: 'Haman obtained the decree against the Jews from the king (3:8–11)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/3?lang=eng'
    quote: 'let it be written that they may be destroyed'
  - where: 'note 5:13 “All this availeth me nothing”'
    claim: 'Come, Follow Me reads Haman in 5:9–14 as a lesson that pride and anger lead to downfall, and sends the reader to chapter 7 for the consequences'
    key: cfm-ot-2026-32
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/32?lang=eng'
    quote: 'Esther 3; 5:9–14; 7: Pride and anger can lead to downfall. … we also learn from the pride and anger of Haman. … What consequences did he face? (see Esther 7).'
  - where: 'note 5:13 “All this availeth me nothing”'
    claim: 'Come, Follow Me sets Proverbs 16:32 beside the passage'
    key: cfm-ot-2026-32
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/32?lang=eng'
    quote: 'See also Proverbs 16:32; Alma 5:28.'
  - where: 'note 5:13 “All this availeth me nothing”'
    claim: 'Haman''s ten sons are named in 9:7–10'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/9?lang=eng'
    quote: 'The ten sons of Haman the son of Hammedatha, the enemy of the Jews, slew they'
  - where: 'note 5:14 “A gallows fifty cubits high”'
    claim: 'The Hebrew word is ʿets, tree or wood; the pole on which the bodies of the slain were exposed, used in Esther for executing criminals'
    key: bdb
    url: 'https://biblehub.com/hebrew/6086.htm'
    quote: 'עֵץ of pole on which bodies of slain (criminals and others) were exposed (perhaps originally trees) … late (in Persian) used for executing criminals (? by hanging = gallows), תָּלָח עַלעֵֿץ Esther 2:23 8t. Esther.'
  - where: 'note 5:14 “A gallows fifty cubits high”'
    claim: 'The gallows was a wooden structure about seventy-five feet high, meant to be seen from afar, a public humiliation for those who opposed the king''s authority; Haman was hanged on it'
    key: belnap-fell-tree
    url: 'https://rsc.byu.edu/they-shall-grow-together/they-did-fell-tree'
    quote: 'The size of the gallows suggests that it was meant to be visible from a distance, which in turn suggests that the hanging was to be a public humiliation, perhaps highlighting the victims’ lack of “place.” Finally, the punishment of hanging came as a result of those who were in rebellion or who sought to overrule the king’s authority.'
  - where: 'note 5:14 “A gallows fifty cubits high”'
    claim: 'Fifty cubits is about seventy-five feet'
    key: belnap-fell-tree
    url: 'https://rsc.byu.edu/they-shall-grow-together/they-did-fell-tree'
    quote: 'constructs a “gallows” (ʿeṭ), approximately seventy-five feet high (fifty cubits), in order to hang Mordecai (see 5:14). Ironically, Haman himself is hanged on the gallows once his plot is revealed by Esther (see 7:9).'
  # ---- christ ----
  - where: 'christ'
    claim: 'The courage of these chapters is studied as Christlike courage'
    key: ot-institute-manual-30
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-institute-teacher-manual-2026/30-esther?lang=eng'
    quote: 'Consider inviting students to do one or both of the following to help them think more deeply about Christlike courage:'
  - where: 'christ'
    claim: 'The institute manual''s truth from these chapters: as we act in faith, God gives courage'
    key: ot-institute-manual-30
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-institute-teacher-manual-2026/30-esther?lang=eng'
    quote: 'students could identify a truth like the following: As we act in faith, God will give us courage.'
  - where: 'christ'
    claim: 'Fasting shows trust in the Lord and reliance on Him'
    key: cfm-ot-2026-32
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/32?lang=eng'
    quote: 'Esther 3–4; 5:2–3; 8:11–12: Fasting shows that I trust and rely on th…'
  - where: 'explore'
    claim: 'Come, Follow Me sets Isaiah 58:6–12 beside Esther''s fast'
    key: cfm-ot-2026-32
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/32?lang=eng'
    quote: 'See also Isaiah 58:6–12'
