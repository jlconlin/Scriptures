chapter: 3
claims:
  - where: when
    claim: 'Ahasuerus of Esther is Xerxes, reigning from 486 B.C.; the twelfth year is therefore about 474 B.C.'
    key: bible-chron-ot
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bible-chron/old-testament?lang=eng'
    quote: '=Xerxes, 486–465.'
  - where: setting
    claim: 'Scripture Helps outlines chapters 3–5 as Haman’s plan, Esther’s risk in going to the king, and the banquet.'
    key: scripture-helps-esther
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/30-esther?lang=eng'
    quote: 'Esther 3–5: Haman crafts a plan to destroy all the Jews in the kingdom after Mordecai refuses to bow down to him. Esther risks her life by going to see the king uninvited.'
  - where: setting
    claim: 'Ahasuerus (Xerxes) reigned from 486 B.C.; the twelfth year is about 474 B.C.'
    key: bible-chron-ot
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bible-chron/old-testament?lang=eng'
    quote: '=Xerxes, 486–465.'
  - where: setting
    claim: 'The dates (2:16; 3:7), Esther hiding her people (2:20), Mordecai’s deed recorded (2:21–23), Haman called the Jews’ enemy (3:10; 8:1), and the ring and day returning in chapters 8–9 are in the text.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/3?lang=eng'
    quote: 'And the king took his ring from his hand, and gave it unto Haman the son of Hammedatha the Agagite, the Jews’ enemy.'
  - where: thread
    claim: 'The Church’s footnote on “ring” at verse 10 points to Esther 8:2, where the ring passes to Mordecai.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/3?lang=eng'
    quote: '“ring”: Gen. 41:42; Esth. 8:2.'
  - where: section 1 plain
    claim: '“Whether Mordecai’s matters would stand” rendered as “whether Mordecai’s words would stand.”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Esther%203&version=ESV'
    quote: 'they told Haman, in order to see whether Mordecai''s words would stand, for he had told them that he was a Jew.'
  - where: section 3 plain
    claim: '“Perplexed” rendered “thrown into confusion”; the decree written to each province in its own script.'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Esther%203&version=ESV'
    quote: 'And the king and Haman sat down to drink, (Z)but the city of Susa was thrown into confusion.'
  - where: 'note 3:1 “Haman the Agagite”'
    claim: 'Agagite likely means a descendant of the Amalekite king Agag; the Amalekites were Israel’s long-standing enemies.'
    key: scripture-helps-esther
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/30-esther?lang=eng'
    quote: 'The account identifies Haman as an Agagite, which likely means he was a descendent of the Amalekite King Agag. The Amalekites were long-standing enemies of the Israelites.'
  - where: 'note 3:1 “Haman the Agagite”'
    claim: 'Mordecai, like Saul, descended from Benjamin; the lineage may be given to explain the hostility and Haman’s determination.'
    key: scripture-helps-esther
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/30-esther?lang=eng'
    quote: 'Mordecai, like Saul, was a descendant of Benjamin. The author may have included the lineage of Mordecai and Haman to explain some of their hostility toward each other and Haman’s determination to have the Jews killed'
  - where: 'note 3:1 “Haman the Agagite”'
    claim: 'Agag, spared by Saul and killed by Samuel; the name perhaps a title like Pharaoh.'
    key: bd-agag
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/agag?lang=eng'
    quote: 'An Amalekite king spared by Saul and killed by Samuel (1 Sam. 15:8–23); the name was perhaps a title (like Pharaoh among the Egyptians); see Num. 24:7.'
  - where: 'note 3:1 “Haman the Agagite”'
    claim: 'The Amalekites were at war with the Hebrews from Moses until Saul and David broke their power.'
    key: bd-amalek
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/amalek?lang=eng'
    quote: 'The Amalekites were at constant war with the Hebrews from the time of Moses (Ex. 17:8, etc.) till their power was broken by Saul and David'
  - where: 'note 3:1 “Haman the Agagite”'
    claim: 'The Church’s footnote on “Hammedatha” points to 1 Samuel 15:8–9.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/3?lang=eng'
    quote: '“Hammedatha”: 1 Sam. 15:8 (8–9).'
  - where: 'note 3:2 “Why Mordecai would not bow”'
    claim: 'Bowing to a political superior was not prohibited under the law of Moses; the refusal may stem from the Agagite/Amalekite hostility.'
    key: scripture-helps-esther
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/30-esther?lang=eng'
    quote: 'Bowing to a political superior was not prohibited under the law of Moses.'
  - where: 'note 3:2 “Why Mordecai would not bow”'
    claim: 'The refusal and Haman’s determination may have stemmed from the historic hostility.'
    key: scripture-helps-esther
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/30-esther?lang=eng'
    quote: 'Mordecai’s refusal to bow to Haman and Haman’s determination to have the Jews killed may have stemmed from the historic hostility between these two groups of people.'
  - where: 'note 3:2 “Why Mordecai would not bow”'
    claim: 'Bowing to mortals as respect is common (Abraham, Joseph’s brothers); it expresses submission; Mordecai refuses to recognize Haman’s status and position.'
    key: lane-worship
    url: 'https://rsc.byu.edu/ascending-mountain-lord/worship-bowing-down-serving-lord'
    quote: 'Another important biblical scene where bowing expresses relationships is the story of Esther, where Mordecai refuses to recognize the status and position of Haman.'
  - where: 'note 3:2 “Why Mordecai would not bow”'
    claim: 'Bowing expresses a relationship of submission; Abraham bowed to the children of Heth.'
    key: lane-worship
    url: 'https://rsc.byu.edu/ascending-mountain-lord/worship-bowing-down-serving-lord'
    quote: 'In all of these examples we can see the physical expression of a relationship of submission through the performance of bowing and prostration.'
  - where: 'note 3:2 “Why Mordecai would not bow”'
    claim: 'Modern rendering of verse 4: “whether Mordecai’s words would stand.”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Esther%203&version=ESV'
    quote: 'they told Haman, in order to see whether Mordecai''s words would stand, for he had told them that he was a Jew.'
  - where: 'note 3:2 “Why Mordecai would not bow”'
    claim: 'An older reading: Haman demanded worship, and Mordecai would not break the first commandment.'
    key: ot-manual-31
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-31?lang=eng'
    quote: 'Probably the inference is justified that Haman was demanding not mere allegiance but worship, and Mordecai would not break the first commandment.'
  - where: 'note 3:2 “Why Mordecai would not bow”'
    claim: 'The text’s stated reason (3:4) and Haman’s widening of his anger to Mordecai’s people (3:5–6).'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/3?lang=eng'
    quote: 'And he thought scorn to lay hands on Mordecai alone; for they had shewed him the people of Mordecai'
  - where: 'note 3:7 “Pur, the lot, and a day eleven months away”'
    claim: 'The text glosses Pur with the Hebrew word for lot, gôrāl.'
    key: hull-true-decision
    url: 'https://rsc.byu.edu/they-shall-grow-together/o-god-israel-give-true-decision'
    quote: 'This is the same term noted in Esther 3:7 in the Hebrew Bible: “they cast Pur, that is, the lot (gôrāl), before Haman,”'
  - where: 'note 3:7 “Pur, the lot, and a day eleven months away”'
    claim: 'Akkadian pūru means a lot and the dice used for lot-casting; the same term as in Esther 3:7.'
    key: hull-true-decision
    url: 'https://rsc.byu.edu/they-shall-grow-together/o-god-israel-give-true-decision'
    quote: 'In Akkadian, the term pūru, borrowed from the Sumerian BUR (“bowl”), shares the same semantic range, meaning a “lot,” the dice used for lot-casting'
  - where: 'note 3:7 “Pur, the lot, and a day eleven months away”'
    claim: 'Goral is the ordinary Hebrew word for a lot cast to decide questions.'
    key: bdb
    url: 'https://biblehub.com/hebrew/1486.htm'
    quote: 'a lot cast for the decision of questions'
  - where: 'note 3:7 “Pur, the lot, and a day eleven months away”'
    claim: 'Pur is the Persian word for “lot”; the lot was cast to choose the day to kill the Jews.'
    key: scripture-helps-esther
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/30-esther?lang=eng'
    quote: 'To determine which day to kill all the Jews in Persia, Haman and his attendants “cast Pur, that is, the lot.” … The Jewish feast of Purim gets its name from pur, the Persian word for “lot.”'
  - where: 'note 3:7 “Pur, the lot, and a day eleven months away”'
    claim: 'Scripture records many uses of lots for making a choice; Prov. 16:33 expresses a feeling about the Lord’s hand.'
    key: bd-lots-casting-of
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/lots-casting-of?lang=eng'
    quote: 'There are many instances in scripture of the use of lots for the purpose of making a choice (Lev. 16:8; Num. 26:55;'
  - where: 'note 3:7 “Pur, the lot, and a day eleven months away”'
    claim: 'Prov. 16:33 expresses a feeling on the Lord’s hand in the lot.'
    key: bd-lots-casting-of
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/lots-casting-of?lang=eng'
    quote: 'Prov. 16:33 expresses a feeling on the subject of the Lord’s hand in the matter.'
  - where: 'note 3:7 “Pur, the lot, and a day eleven months away”'
    claim: 'The lot was cast first for the day, then for the month.'
    key: ot-manual-31
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-31?lang=eng'
    quote: 'This he did by first casting pur, or lots, to determine the day for carrying out the decree—first for the day of the month and then for the month of the year'
  - where: 'note 3:7 “Pur, the lot, and a day eleven months away”'
    claim: 'The distant day allowed Esther and Mordecai time to save the people.'
    key: ot-manual-31
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-31?lang=eng'
    quote: 'The fact that the lot had fallen on a day some distance into the future allowed Esther and Mordecai time to save the people.'
  - where: 'note 3:7 “Pur, the lot, and a day eleven months away”'
    claim: 'Nearly eleven months between publication and execution; providence evident in Haman’s haste and the distant lot (a commentary’s reading).'
    key: keil-esther
    url: 'https://biblehub.com/commentaries/kad/esther/3.htm'
    quote: 'On the other hand, the providence of God overruling the event in the interest of the Jews, is unmistakeably evident both in Haman''s haste to satisfy his desire for vengeance, and in the falling of the lot upon so distant a day.'
  - where: 'note 3:7 “Pur, the lot, and a day eleven months away”'
    claim: 'Nearly eleven months between the publication and execution of the decree.'
    key: keil-esther
    url: 'https://biblehub.com/commentaries/kad/esther/3.htm'
    quote: 'This would place almost eleven, and in the remotest parts about ten months between the publication and execution of the decree.'
  - where: 'note 3:7 “Pur, the lot, and a day eleven months away”'
    claim: 'Purim named after Pur (9:26); the day “turned to the contrary” (9:1); Prov. 16:33.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/16?lang=eng'
    quote: 'The lot is cast into the lap; but the whole disposing thereof is of the Lord.'
  - where: 'note 3:8 “Haman’s case against “a certain people””'
    claim: 'The proposal was subtly calculated: suspicion of the Jews as unsociable and refractory; the money is the property of the slaughtered.'
    key: keil-esther
    url: 'https://biblehub.com/commentaries/kad/esther/3.htm'
    quote: 'This proposal was very subtilly calculated. First Haman casts suspicion on the Jews as a nation scattered abroad and dwelling apart, and therefore unsociable, - as refractory, and therefore dangerous to the state;'
  - where: 'note 3:8 “Haman’s case against “a certain people””'
    claim: 'The silver would be a very considerable sum, the property of the slaughtered.'
    key: keil-esther
    url: 'https://biblehub.com/commentaries/kad/esther/3.htm'
    quote: 'then he promises the king that their extermination will bring into the royal treasury a very considerable sum of money, viz., the property of the slaughtered.'
  - where: 'note 3:8 “Haman’s case against “a certain people””'
    claim: 'The king awards the silver to Haman lest he seem induced by money.'
    key: keil-esther
    url: 'https://biblehub.com/commentaries/kad/esther/3.htm'
    quote: 'Lest it should appear as though the king had been induced by the prospect held out of obtaining a sum of money, he awards this to Haman.'
  - where: 'note 3:8 “Haman’s case against “a certain people””'
    claim: 'The Church’s footnote on “pay” in verse 9 points to Esther 7:4.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/3?lang=eng'
    quote: '“pay”: Esth. 7:4.'
  - where: 'note 3:12 “Written in the king’s name and sealed”'
    claim: 'What is sealed with the king’s ring no man may reverse (8:8); the ring goes to Mordecai (8:2) and seals the second decree (8:10); footnote at 3:10.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/8?lang=eng'
    quote: 'for the writing which is written in the king’s name, and sealed with the king’s ring, may no man reverse.'
  - where: 'note 3:13 “Three verbs for one day”'
    claim: 'The second decree repeats the three verbs (8:11).'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/8?lang=eng'
    quote: 'to stand for their life, to destroy, to slay, and to cause to perish, all the power of the people and province that would assault them'
  - where: 'note 3:15 “The king drinks; the city is in confusion”'
    claim: 'The verb (buk, Niphal) means be confused, in confusion, said of a city at Esther 3:15.'
    key: bdb
    url: 'https://biblehub.com/hebrew/943.htm'
    quote: '— be confused, in confusion (of a city) Esther 3:15;'
  - where: 'note 3:15 “The king drinks; the city is in confusion”'
    claim: 'The verb in 3:15 is nevokhah, H943.'
    key: oshb-wlc
    url: 'https://biblehub.com/hebrew/943.htm'
    quote: 'verb perplex, confuse'
  - where: 'note 3:15 “The king drinks; the city is in confusion”'
    claim: 'Modern translation: “thrown into confusion.”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Esther%203&version=ESV'
    quote: 'And the king and Haman sat down to drink, (Z)but the city of Susa was thrown into confusion.'
  - where: 'note 3:15 “The king drinks; the city is in confusion”'
    claim: 'Verse 15 implies not all of Susa shared Haman’s animosity.'
    key: breitenstein-esther-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/esther-1-10'
    quote: 'Verse 15, however, implies that not all the people of Susa shared Haman’s animosity toward the Jews.'
  - where: christ
    claim: 'Jehovah is the premortal Jesus Christ.'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: christ
    claim: 'The Church’s footnote on “kill” at verse 13 points to D&C 121:23.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/3?lang=eng'
    quote: '“kill”: D&C 121:23.'
  - where: christ
    claim: 'D&C 121:23–24 text.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/121?lang=eng'
    quote: 'Behold, mine eyes see and know all their works, and I have in reserve a swift judgment in the season thereof, for them all;'
  - where: explore
    claim: 'D&C 121 is from Joseph Smith’s letters written in the jail at Liberty, Missouri.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/121?lang=eng'
    quote: 'Prayer and prophecies excerpted from two epistles to the Church dictated by Joseph Smith the Prophet while he was a prisoner in the jail at Liberty, Missouri'
