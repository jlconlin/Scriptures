chapter: 4
claims:
  - where: when
    claim: 'Ahasuerus is Xerxes, whose reign began in 486 B.C.; the twelfth year is counted from it'
    key: bible-chron-ot
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bible-chron/old-testament?lang=eng'
    quote: '=Xerxes, 486–465.'
  - where: setting
    claim: 'Xerxes (Ahasuerus) acceded in 486 B.C.; the twelfth year is about 474 B.C.'
    key: bible-chron-ot
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bible-chron/old-testament?lang=eng'
    quote: '=Xerxes, 486–465.'
  - where: setting
    claim: 'Chapters 3–5 form the part of the book in which Haman plots and Esther risks her life going to the king uninvited'
    key: scripture-helps-esther
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/30-esther?lang=eng'
    quote: 'Esther 3–5: Haman crafts a plan to destroy all the Jews in the kingdom after Mordecai refuses to bow down to him. Esther risks her life by going to see the king uninvited.'
  - where: thread
    claim: 'God is taken for granted in the book through its providential destiny (4:13–16) and its fasting for deliverance'
    key: bd-esther-book
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/esther-book-of?lang=eng'
    quote: 'He is everywhere taken for granted, as the book infers a providential destiny (Esth. 4:13–16) and speaks of fasting for deliverance.'
  - where: 'note 4:4 “Clothes Mordecai would not take”'
    claim: 'The clothes were sent so that Mordecai could enter the palace and tell Esther what had happened; he refused them'
    key: keil-esther
    url: 'https://biblehub.com/commentaries/kad/esther/4.htm'
    quote: 'sent to Mordochai raiment to put on instead of his sackcloth, evidently for the purpose of enabling him to enter the palace and give her the particulars of what had happened. But Mordochai did not accept the raiment.'
  - where: 'note 4:4 “Clothes Mordecai would not take”'
    claim: 'The sum of money is mentioned to show how eagerly Haman had urged the destruction'
    key: keil-esther
    url: 'https://biblehub.com/commentaries/kad/esther/4.htm'
    quote: 'This promise of Haman is here emphatically mentioned as the chief point, not so much for the purpose of raising the indignation of Esther to the highest pitch (Bertheau), as to show the resentment and eagerness with which Haman had urged the extermination of the Jews.'
  - where: 'note 4:11 “The law of the inner court”'
    claim: 'The Church’s reading: Esther may have avoided official channels so her message would not pass through Haman'
    key: scripture-helps-esther
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/30-esther?lang=eng'
    quote: 'One possibility is that Esther avoided this option to prevent her message from passing through Haman, who would have undermined her plan.'
  - where: 'note 4:11 “The law of the inner court”'
    claim: 'Among the Persians few could approach the king without being announced; anyone entering unannounced was put to death unless the sceptre spared him'
    key: keil-esther
    url: 'https://biblehub.com/commentaries/kad/esther/4.htm'
    quote: 'among the Persians, none, with the exception of a few individuals (Herod. iii. 118), were permitted to approach the king without being previously announced (Herod. iii. 140; Corn. Nepos, Conon, 3). Any one entering unannounced was punished with death, unless the king'
  - where: 'note 4:11 “The law of the inner court”'
    claim: 'One could ask to be announced; the thirty days suggest the king did not much wish to see her'
    key: keil-esther
    url: 'https://biblehub.com/commentaries/kad/esther/4.htm'
    quote: 'any who desired audience were allowed to announce themselves. Esther might, it seems, have done this. … Now, however, a whole month had passed without any invitation. Hence she concluded that the king did not much wish to see her'
  - where: 'note 4:11 “The law of the inner court”'
    claim: 'To be announced she would have had to state her cause at once; with Haman in favour, setting aside a sealed decree seemed impossible'
    key: keil-esther
    url: 'https://biblehub.com/commentaries/kad/esther/4.htm'
    quote: 'she would have been obliged immediately to make known to the king the cause of her desiring this interview. … To set aside an irrevocable decree sealed with the king''s seal, must have appeared to Esther an impossible undertaking.'
  - where: 'note 4:14 “Deliverance from another place”'
    claim: 'Living in the palace would not save Esther; Mordecai sensed the Jews would be delivered but did not know how; perhaps divine providence'
    key: breitenstein-esther-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/esther-1-10'
    quote: 'Mordecai sensed that the Jews would somehow be delivered. He did not know how that deliverance would come about (“deliverance [would] arise to the Jews from another place”). It is possible that he sensed divine providence would protect the Jews.'
  - where: 'note 4:14 “Deliverance from another place”'
    claim: 'Mordecai reminded Esther that living in the palace would not spare her'
    key: breitenstein-esther-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/esther-1-10'
    quote: 'Mordecai sent a response to Esther reminding her that just because she lived in the palace did not mean that she would escape death when all the other Jews in the kingdom were to be killed.'
  - where: 'note 4:14 “Deliverance from another place”'
    claim: 'The Greek has Mordecai tell Esther to call upon the Lord (4:8)'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/esther/4.htm'
    quote: 'Do thou call upon the Lord, and speak to the king concerning us, to deliver us from death.'
  - where: 'note 4:14 “Deliverance from another place”'
    claim: 'The Greek of 4:14 also speaks of help from another quarter'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/esther/4.htm'
    quote: 'help and protection will be to the Jews from another quarter; but thou and thy father''s house will perish'
  - where: 'note 4:14 “For such a time as this”'
    claim: 'Mordecai indicated the Lord may have placed Esther as queen to be His instrument in saving the Jews'
    key: scripture-helps-esther
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/30-esther?lang=eng'
    quote: 'Mordecai indicated that the Lord may have placed Esther in her position as queen so she could be His instrument in saving the Jews.'
  - where: 'note 4:14 “For such a time as this”'
    claim: 'The Church’s footnote at “time” points to Genesis 45:7'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/4?lang=eng'
    quote: '14b “time”: Gen. 45:7 (7–8).'
  - where: 'note 4:14 “For such a time as this”'
    claim: 'Elder Maxwell, of the people-opportunities in our circles: coincidence is not the word for the workings of an omniscient God'
    key: maxwell-brim-joy
    url: 'https://speeches.byu.edu/talks/neal-a-maxwell/brim-joy'
    quote: 'the people-opportunities allocated to us within our circles of friendship. You and I may call these intersectings “coincidence.” This word is understandable for mortals to use, but coincidence is not an appropriate word to describe the workings of an omniscient God. He does not do things by “coincidence” but instead by “divine design.”'
  - where: 'note 4:16 “A fast of three days”'
    claim: 'Fasting accompanied mourning, could be private or communal, and showed dependence on God (the KnoWhy’s own statement; its inner quotation is not printed); the Jews fasted for deliverance from the decree'
    key: sc-knowhy-135
    url: 'https://scripturecentral.org/knowhy/why-did-fasting-and-prayer-accompany-nephite-mourning'
    quote: 'Such fasting in scriptural times could be performed privately or as a community as a way to show “dependence on God and submission to his will.” Fasting played a prominent role … when the people all mourned and fasted for deliverance'
  - where: 'note 4:16 “The prayer the Greek adds”'
    claim: 'No prayer is recorded in the Hebrew; later Greek-writing Jewish authors imagined what Esther might have said; it survives in the Septuagint and the Apocrypha'
    key: sc-knowhy-863
    url: 'https://scripturecentral.org/knowhy/why-does-esther-s-apocryphal-prayer-matter'
    quote: 'One assumes that Esther prayed, at least silently, during her fast. However, no such prayer is recorded in the Hebrew version of the Book of Esther. Later Jewish authors writing in Greek likely felt the absence of such a prayer in the text and imagined what she might have said'
  - where: 'note 4:16 “The prayer the Greek adds”'
    claim: 'A line of the Greek prayer'
    key: sc-knowhy-863
    url: 'https://scripturecentral.org/knowhy/why-does-esther-s-apocryphal-prayer-matter'
    quote: 'According to the Greek version, Esther cries out, “Oh, my Lord, You only are our king; help me, I who am alone and do not have a helper other than You, because my moment of peril is at hand."'
  - where: 'note 4:16 “The prayer the Greek adds”'
    claim: 'The added chapters of Esther illustrate the hearing of prayer and God’s deliverances'
    key: bd-apocrypha
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/apocrypha?lang=eng'
    quote: 'The rest of the chapters of the Book of Esther. These chapters expand in greater detail the narrative of the canonical book. Their object is to illustrate the hearing of prayer and the deliverances from the Gentiles that God wrought for His people the Jews.'
  - where: 'note 4:16 “The prayer the Greek adds”'
    claim: 'D&C 91 on the Apocrypha: many true things, many interpolations by men'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/91?lang=eng'
    quote: 'There are many things contained therein that are not true, which are interpolations by the hands of men.'
  - where: 'note 4:16 “If I perish, I perish”'
    claim: 'Esther gathered her courage to stand firm for what was right'
    key: monson-may-you-have-courage
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2009/04/may-you-have-courage?lang=eng'
    quote: 'Esther had gathered her courage and would stand firm and immovable for that which was right.'
  - where: 'note 4:16 “If I perish, I perish”'
    claim: 'Through fasting, faith and courage Esther saved a nation'
    key: monson-may-you-have-courage
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2009/04/may-you-have-courage?lang=eng'
    quote: 'Esther, through fasting, faith, and courage, had saved a nation.'
  - where: christ
    claim: 'The Church reads the book as an illustration of God’s overruling providence'
    key: bd-esther-book
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/esther-book-of?lang=eng'
    quote: 'a most striking illustration of God’s overruling providence in history'
  - where: christ
    claim: 'Jehovah, the God of Israel, is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: christ
    claim: 'Fasting shows trust and reliance on the Lord'
    key: cfm-ot-2026-32
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/32?lang=eng'
    quote: 'Fasting shows that I trust and rely on the Lord'
  - where: christ
    claim: 'What seems chance is overseen by the Father; the Lord is in the small details, preparing us to lift others'
    key: rasband-divine-design
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2017/10/by-divine-design?lang=eng'
    quote: 'What may appear to be a random chance is, in fact, overseen by a loving Father in Heaven … The Lord is in the small details of our lives, and those incidents and opportunities are to prepare us to lift our families and others'
  - where: explore
    claim: 'KnoWhy #135 sets the fast of Esther 4 among the scriptural fasts that accompanied mourning'
    key: sc-knowhy-135
    url: 'https://scripturecentral.org/knowhy/why-did-fasting-and-prayer-accompany-nephite-mourning'
    quote: 'Fasting played a prominent role during a crucial moment in the story of Esther and Mordecai when the people all mourned and fasted for deliverance'
