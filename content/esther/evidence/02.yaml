chapter: 2
claims:
  - where: 'when'
    claim: 'Ahasuerus of Esther 1:1 is Xerxes, who came to the throne in 486 B.C.; the seventh year is therefore about 479 B.C.'
    key: bible-chron-ot
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bible-chron/old-testament?lang=eng'
    quote: '=Xerxes, 486–465.'
  - where: 'setting'
    claim: 'Xerxes acceded in 486 B.C.'
    key: bible-chron-ot
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bible-chron/old-testament?lang=eng'
    quote: '=Xerxes, 486–465.'
  - where: 'setting'
    claim: 'Some Jews returned after Cyrus conquered Babylon, but many remained in exile, including Esther'
    key: scripture-helps-esther
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/30-esther?lang=eng'
    quote: 'While some Jews had returned to Jerusalem after King Cyrus conquered Babylon in 539 BC, many remained in exile, including Esther.'
  - where: 'setting'
    claim: 'The date of verse 16 and the feast of the third year in 1:3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/2?lang=eng'
    quote: 'So Esther was taken unto king Ahasuerus into his house royal in the tenth month, which is the month Tebeth, in the seventh year of his reign.'
  - where: 'thread'
    claim: 'Come, Follow Me points to 2:21–23 among the ways the Lord made it possible for Esther to save the Jews'
    key: cfm-ot-2026-32
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/32?lang=eng'
    quote: 'Look for ways the Lord made it possible for her to save the Jews (see, for example, Esther 2:21–23; 3:10–14; 4:14–16).'
  - where: 'thread'
    claim: 'Scripture Helps finds the Lord''s influence implied in the reading of the record at 6:1'
    key: scripture-helps-esther
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/30-esther?lang=eng'
    quote: 'It is implied that the Lord’s influence led the king to read this particular part of the record, prompting him to remember Mordecai’s heroic act from a few years prior.'
  - where: 'thread'
    claim: 'The passive verbs of verses 8 and 16'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/2?lang=eng'
    quote: 'that Esther was brought also unto the king’s house, to the custody of Hegai, keeper of the women.'
  - where: 'note 2:5 “Mordecai, of the line of Kish”'
    claim: 'Jair, Shimei and Kish are probably noted ancestors, not three successive generations; Kish is Saul''s father (1 Sam. 9:1); genealogies give only a few noted names'
    key: keil-esther
    url: 'https://biblehub.com/commentaries/kad/esther/2.htm'
    quote: 'Jair, Shimei, and Kish can hardly mean the father, grandfather, and great-grandfather of Mordochai. On the contrary, if Jair were perhaps his father, Shimei and Kish may have been the names of renowned ancestors.'
  - where: 'note 2:5 “Mordecai, of the line of Kish”'
    claim: 'Kish is the father of Saul; genealogies generally give only a few noted names'
    key: keil-esther
    url: 'https://biblehub.com/commentaries/kad/esther/2.htm'
    quote: 'and Kish the father of Saul, 1 Chronicles 8:33; 1 Samuel 9:1; for in genealogical series only a few noted names are generally given'
  - where: 'note 2:5 “Mordecai, of the line of Kish”'
    claim: 'Mordecai, like Saul, descended from Benjamin; the author may have included the lineages of Mordecai and Haman to explain their hostility; Samuel killed Agag after Saul failed to'
    key: scripture-helps-esther
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/30-esther?lang=eng'
    quote: 'Mordecai, like Saul, was a descendant of Benjamin. The author may have included the lineage of Mordecai and Haman to explain some of their hostility toward each other'
  - where: 'note 2:5 “Mordecai, of the line of Kish”'
    claim: 'From Jeconiah''s captivity to Xerxes'' accession is 113 years; if “who” refers to Mordecai he would have been about 125 when made minister'
    key: keil-esther
    url: 'https://biblehub.com/commentaries/kad/esther/2.htm'
    quote: 'from the captivity of Jeconiah in the year 599 to the beginning of the reign of Xerxes (in the year 486) is a period of 113 years; hence, if the אשׁר is referred to Mordochai, he would … have become prime minister of that monarch at about the age of 125.'
  - where: 'note 2:5 “Mordecai, of the line of Kish”'
    claim: 'The relative “who” can refer to Kish (others) or to Mordecai (Keil''s preference), but loosely: he belonged to the captives through his forefathers, born in captivity; giving origin, not history'
    key: keil-esther
    url: 'https://biblehub.com/commentaries/kad/esther/2.htm'
    quote: 'the object being to give merely his origin and lineage, and not his history, it involves only the notion that he belonged to those Jews who were carried to Babylon by Nebuchadnezzar with Jeconiah, so that he, though born in captivity, was carried to Babylon in the persons of his forefathers.'
  - where: 'note 2:5 “Mordecai, of the line of Kish”'
    claim: 'Some refer “who” to Kish, who was carried away with Jeconiah, making Mordecai his great-grandson born in captivity'
    key: keil-esther
    url: 'https://biblehub.com/commentaries/kad/esther/2.htm'
    quote: 'Clericus, Baumgarten, and others refer the relative אשׁר to the last name, Kish, and understand that he was carried away with Jeconiah, while his great-grandson Mordochai was born in captivity.'
  - where: 'note 2:5 “Mordecai, of the line of Kish”'
    claim: 'The lineage and the carrying away with Jeconiah in verses 5–6'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/2?lang=eng'
    quote: 'Who had been carried away from Jerusalem with the captivity which had been carried away with Jeconiah king of Judah, whom Nebuchadnezzar the king of Babylon had carried away.'
  - where: 'note 2:8 “Brought into the king''s house”'
    claim: 'Esther found herself in a position she did not choose, citing 2:8'
    key: bingham-gardner-role-models
    url: 'https://rsc.byu.edu/vol-23-no-1-2022/empowering-young-adult-women-through-female-role-models-old-testament'
    quote: 'Unlike Rebecca, Esther found herself in a position she did not choose for herself. The scripture says she was “brought also unto the king’s house” (Esther 2:8).'
  - where: 'note 2:8 “Brought into the king''s house”'
    claim: 'Like Esther, some are in positions not ideal or of their own choosing but recognize others depend on them and are willing to serve'
    key: bingham-gardner-role-models
    url: 'https://rsc.byu.edu/vol-23-no-1-2022/empowering-young-adult-women-through-female-role-models-old-testament'
    quote: 'Like Esther, some may be in positions that are not ideal or of their own choosing but recognize the dependence of others on them and are willing to serve in those roles.'
  - where: 'note 2:8 “Brought into the king''s house”'
    claim: 'The second house of the women and the concubines (verse 14)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/2?lang=eng'
    quote: 'In the evening she went, and on the morrow she returned into the second house of the women, to the custody of Shaashgaz, the king’s chamberlain, which kept the concubines'
  - where: 'note 2:10 “A people kept hidden”'
    claim: 'Verses 10, 11 and 20: Mordecai''s charge, his daily walk, Esther''s obedience'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/2?lang=eng'
    quote: 'Esther had not yet shewed her kindred nor her people; as Mordecai had charged her: for Esther did the commandment of Mordecai, like as when she was brought up with him.'
  - where: 'note 2:10 “A people kept hidden”'
    claim: 'Esther reveals her people before the king and Haman at 7:4'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/7?lang=eng'
    quote: 'For we are sold, I and my people, to be destroyed, to be slain, and to perish.'
  - where: 'note 2:18 “A release to the provinces”'
    claim: 'The Hebrew word in 2:18 is hanachah (H2010)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Esth.xml'
    quote: 'וַ/הֲנָחָ֤ה'
  - where: 'note 2:18 “A release to the provinces”'
    claim: 'BDB: a giving of rest, perhaps holiday-making; from the verb to give rest; KJV “release”'
    key: bdb
    url: 'https://biblehub.com/hebrew/2010.htm'
    quote: 'הֲנָחָה noun feminine a giving of rest, i.e. perhaps holiday-making'
  - where: 'note 2:18 “A release to the provinces”'
    claim: 'The noun derives from the verb to give rest'
    key: bdb
    url: 'https://biblehub.com/hebrew/2010.htm'
    quote: 'Word Origin: [from H5117 (נוַּח - give rest)]'
  - where: 'note 2:5 “Mordecai, of the line of Kish”'
    claim: 'The Student Manual takes the one carried away as Mordecai''s great-grandfather, in the first deportation'
    key: ot-manual-31
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-31?lang=eng'
    quote: 'He was from the tribe of Benjamin, and his great-grandfather was apparently carried into captivity in the first Jewish deportation into Babylon.'
  - where: 'note 2:18 “A release to the provinces”'
    claim: 'BDB on the versions: the Vulgate has rest, the Septuagint aphesis, whence others take it as release from taxes or amnesty'
    key: bdb
    url: 'https://biblehub.com/hebrew/2010.htm'
    quote: 'ᵑ9 requies; but ᵐ5 ἄφεσις, whence al. release from taxes, or amnesty.'
  - where: 'note 2:18 “A release to the provinces”'
    claim: 'The Greek of 2:18 in English: a release to those under his dominion'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/esther/2.htm'
    quote: 'and he made a release to those who were under his dominion.'
  - where: 'note 2:23 “Written in the book, and left unrewarded”'
    claim: 'The book of the chronicles is an official record of events in the Persian empire; the Lord''s influence is implied in its reading at 6:1'
    key: scripture-helps-esther
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/30-esther?lang=eng'
    quote: 'The book from which the king’s servants read was an official record of events in the Persian empire. … It is implied that the Lord’s influence led the king to read this particular part of the record'
  - where: 'note 2:23 “Written in the book, and left unrewarded”'
    claim: 'Come, Follow Me lists 2:21–23 among the ways the Lord made it possible for Esther to save the Jews'
    key: cfm-ot-2026-32
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/32?lang=eng'
    quote: 'Look for ways the Lord made it possible for her to save the Jews (see, for example, Esther 2:21–23; 3:10–14; 4:14–16).'
  - where: 'note 2:23 “Written in the book, and left unrewarded”'
    claim: 'The plot, its report in Mordecai''s name, and the record (verses 21–23)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/2?lang=eng'
    quote: 'And the thing was known to Mordecai, who told it unto Esther the queen; and Esther certified the king thereof in Mordecai’s name.'
  - where: 'christ'
    claim: 'The Lord may have placed Esther as queen to be His instrument in saving the Jews'
    key: scripture-helps-esther
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/30-esther?lang=eng'
    quote: 'Mordecai indicated that the Lord may have placed Esther in her position as queen so she could be His instrument in saving the Jews.'
  - where: 'christ'
    claim: 'The institute manual''s truth: the Lord places us in situations where we can help others'
    key: ot-institute-manual-30
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-institute-teacher-manual-2026/30-esther?lang=eng'
    quote: 'The Lord places us in situations where we can help others and accomplish His will.'
  - where: 'christ'
    claim: 'The Lord can guide our path and prepare us to be instruments in His hands, through small details we may not recognize'
    key: cfm-ot-2026-32
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/32?lang=eng'
    quote: 'We might not always recognize the Lord’s influence in these “small details.” But we learn from Esther’s experience that He can guide our path and prepare us “for such a time” (Esther 4:14) when we can be instruments in His hands'
  - where: 'explore'
    claim: 'Scripture Helps cites Daniel 1:6–7 for exiles'' two names, at Hadassah and Esther'
    key: scripture-helps-esther
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/30-esther?lang=eng'
    quote: 'Like other exiled Jews in Persia, Esther had both a Hebrew name and a Persian name.'
