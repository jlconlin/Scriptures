chapter: 7
claims:
  - where: 'when'
    claim: 'Ahasuerus of Esther is Xerxes, who began to reign in 486 B.C. (the basis of the approximate date)'
    key: bible-chron-ot
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bible-chron/old-testament?lang=eng'
    quote: '=Xerxes, 486–465.'
  - where: 'setting'
    claim: 'Chapters 6–8 form one part of the book in Scripture Helps’ outline: Esther tells the plot, Haman hanged, Mordecai honored, the edict reversed'
    key: scripture-helps-esther
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/30-esther?lang=eng'
    quote: 'Esther 6–8: Esther tells the king about Haman’s plot to kill the Jews. The king has Haman hanged, honors Mordecai, and allows Mordecai and Esther to reverse the edict to kill the Jews.'
  - where: 'setting'
    claim: 'The second banquet included only Esther, the king and Haman'
    key: breitenstein-esther-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/esther-1-10'
    quote: 'On the second day of the banquet, which included only Esther, the king, and Haman, the king asked Esther what she requested of him.'
  - where: 'thread'
    claim: 'Esther’s request reveals that she is a Jew and that the king had been tricked or bribed into the decree'
    key: breitenstein-esther-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/esther-1-10'
    quote: 'By using that expression, Esther revealed to the king that she was a Jew. She also revealed that someone had tricked, or bribed, the king into ordering the annihilation of all Jews in his kingdom (see 3:9).'
  - where: 'note 7:3 “My life, and my people”'
    claim: 'By asking for her people with her life, Esther revealed she was a Jew; her request was that the king preserve her and her people'
    key: breitenstein-esther-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/esther-1-10'
    quote: 'Her request was that the king preserve her and her people. By using that expression, Esther revealed to the king that she was a Jew.'
  - where: 'note 7:3 “My life, and my people”'
    claim: 'Esther had kept her people hidden at Mordecai’s charge (2:10, 20); the king had already asked twice (5:6); the footnote links the petition to 5:6 and 9:12'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/7?lang=eng'
    quote: '2a “petition”: Esth. 5:6; 9:12.'
  - where: 'note 7:4 “Sold to be destroyed”'
    claim: 'The footnotes point “sold” to 3:9 and 4:7 and give the Hebrew sense of the last clause'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/7?lang=eng'
    quote: '4b “although”: HEB for that would not have damaged the king’s interests.'
  - where: 'note 7:4 “Sold to be destroyed”'
    claim: 'A Latter-day Saint reading: the king would lose a valuable labor pool, not to his benefit'
    key: breitenstein-esther-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/esther-1-10'
    quote: 'She suggested that if the king allowed the annihilation of all Jews in his kingdom, he would be losing a valuable labor pool. That would not be to the king’s benefit.'
  - where: 'note 7:10 “Haman on his own gallows”'
    claim: 'So shall it come to pass with Haman in the last days'
    key: jsp-letter-caldwell-1838
    url: 'https://www.josephsmithpapers.org/paper-summary/letter-to-the-church-in-caldwell-county-missouri-16-december-1838'
    quote: 'So shall it come to pass with poor Haman in the last days.'
  - where: 'note 7:5 “Who is he, and where is he?”'
    claim: 'The king asked who had tricked him into ordering the annihilation; Esther named Haman, who became afraid'
    key: breitenstein-esther-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/esther-1-10'
    quote: 'The king asked Esther who had tricked him into ordering the annihilation of the Hebrews in his kingdom. Esther declared that it was Haman. Haman, who was at the banquet, became afraid.'
  - where: 'note 7:5 “Who is he, and where is he?”'
    claim: 'Haman’s accusation never named the people (3:8); the king gave them over (3:11); Esther had not shown her people (2:10)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/3?lang=eng'
    quote: 'There is a certain people scattered abroad and dispersed among the people in all the provinces of thy kingdom'
  - where: 'note 7:8 “The couch and the covered face”'
    claim: 'Banquet guests reclined on couches; the “bed” may have been a couch; Haman likely fell on Esther’s couch to plead'
    key: ot-manual-31
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-31?lang=eng'
    quote: 'In the Middle East in ancient times, banquets were served to the guests as they reclined on pillows or couches. The Hebrew word translated in verse 8 as bed may have been a couch or a place of reclining.'
  - where: 'note 7:8 “The couch and the covered face”'
    claim: 'The king took Haman’s position as an assault; no suggestion by Esther about the punishment'
    key: ot-manual-31
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-31?lang=eng'
    quote: 'When the king returned to the banquet, he interpreted Haman’s position as a sexual advance and ordered his death. Thus, with no direct suggestion by Esther about what Haman’s punishment should be, circumstances brought about the swift execution'
  - where: 'note 7:8 “The couch and the covered face”'
    claim: 'Haman saw he had no mercy to expect from the king unless the queen interceded'
    key: keil-esther
    url: 'https://biblehub.com/commentaries/kad/esther/7.htm'
    quote: 'and hence that he had no mercy to expect from him, unless the queen should intercede for him.'
  - where: 'note 7:8 “The couch and the covered face”'
    claim: 'Haman fell as a suppliant at her feet; the king in anger credited him with the worst designs; the verb means to offer violence'
    key: keil-esther
    url: 'https://biblehub.com/commentaries/kad/esther/7.htm'
    quote: 'falling as a suppliant at her feet; and crediting Haman in the heat of his anger with the worst designs, he cried out: "Shall also violence be done to the queen before me in the house?"'
  - where: 'note 7:8 “The couch and the covered face”'
    claim: '“The word” is the sentence of death; covering the face began the execution'
    key: keil-esther
    url: 'https://biblehub.com/commentaries/kad/esther/7.htm'
    quote: 'הדּבר is not the speech of the king just reported, but the judicial sentence, the death warrant, i.e., the word to punish Haman with death. This is unmistakeably shown by the further statement: they covered Haman''s face.'
  - where: 'note 7:8 “The couch and the covered face”'
    claim: 'The sentence of death is not given in so many words by the narrator'
    key: keil-esther
    url: 'https://biblehub.com/commentaries/kad/esther/7.htm'
    quote: 'Without waiting for an explanation, the king, still more infuriated, passes sentence of death upon Haman. This is not given in so many words by the historian'
  - where: 'note 7:8 “The couch and the covered face”'
    claim: 'To cover the face was to begin carrying out the sentence'
    key: keil-esther
    url: 'https://biblehub.com/commentaries/kad/esther/7.htm'
    quote: 'To cover the face was indeed to begin to carry the sentence of death into execution.'
  - where: 'note 7:10 “Haman on his own gallows”'
    claim: 'Joseph Smith, from Liberty Jail, 16 December 1838: remember Haman and Mordecai; the Lord so ordered that Haman was hanged on his own gallows; so shall it be in the last days'
    key: jsp-letter-caldwell-1838
    url: 'https://www.josephsmithpapers.org/paper-summary/letter-to-the-church-in-caldwell-county-missouri-16-december-1838'
    quote: 'But we want you to remember Haman and Mordecai you know that Haman could not be satisfied so long as he saw Mordecai at the king’s gate, and he sought the life of Mordecai and the people of the jews. But the Lord so ordered that Haman was hanged upon his own gallows.'
  - where: 'note 7:10 “Haman on his own gallows”'
    claim: 'Those who treated the Saints like Haman shall be hanged on their own gallows, “or in other words shall fall”'
    key: jsp-letter-caldwell-1838
    url: 'https://www.josephsmithpapers.org/paper-summary/letter-to-the-church-in-caldwell-county-missouri-16-december-1838'
    quote: 'I say unto you that those who have thus vilely treated us like Haman shall be hanged upon their own gallows, or in other words shall fall'
  - where: 'note 7:10 “Haman on his own gallows”'
    claim: 'The copy transcribed as the featured version is Zina Huntington’s'
    key: jsp-letter-caldwell-1838
    url: 'https://www.josephsmithpapers.org/paper-summary/letter-to-the-church-in-caldwell-county-missouri-16-december-1838/1'
    quote: 'Featured version copied [between 16 Dec. 1838 and ca. May 1839]; handwriting of   Zina Huntington'
  - where: 'note 7:10 “Haman on his own gallows”'
    claim: 'Joseph wrote these words to comfort the scattered Saints after the expulsion from Missouri'
    key: underwood-jst-kjb
    url: 'https://rsc.byu.edu/king-james-bible-restoration/joseph-smith-king-james-bible'
    quote: 'After the Saints’ expulsion from Missouri, Joseph Smith endeavored to comfort the scattered Saints with these words'
  - where: 'thread'
    claim: 'Joseph Smith, in Liberty Jail, said the Lord so ordered Haman’s hanging'
    key: jsp-letter-caldwell-1838
    url: 'https://www.josephsmithpapers.org/paper-summary/letter-to-the-church-in-caldwell-county-missouri-16-december-1838'
    quote: 'But the Lord so ordered that Haman was hanged upon his own gallows.'
  - where: 'christ'
    claim: 'By sacrificing what is less important, disciples like Esther not only save themselves but become “literal saviors of others”'
    key: bingham-gardner-role-models
    url: 'https://rsc.byu.edu/vol-23-no-1-2022/empowering-young-adult-women-through-female-role-models-old-testament'
    quote: 'With that confidence we can be effective in sacrificing what is less important for that which is eternal, and by making that decision, not only save ourselves but be the literal saviors of others.'
  - where: 'christ'
    claim: 'Joseph Smith said the Lord so ordered Haman’s fall and applied it to the Saints’ persecutors in the last days'
    key: jsp-letter-caldwell-1838
    url: 'https://www.josephsmithpapers.org/paper-summary/letter-to-the-church-in-caldwell-county-missouri-16-december-1838'
    quote: 'So shall it come to pass with poor Haman in the last days.'
  - where: 'explore'
    claim: 'The footnotes at 7:9 and 7:10 point to Proverbs 11:5–6 and 1 Nephi 14:3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/7?lang=eng'
    quote: '9d “Hang”: Prov. 11:5 (5–6). … 10a “gallows”: Matt. 7:2 (1–2); 1 Ne. 14:3; D&C 10:26 (25–27).'
  - where: 'christ'
    claim: 'The footnote at 7:10 links Haman’s fall on his own gallows to Matthew 7:2'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/7?lang=eng'
    quote: '10a “gallows”: Matt. 7:2 (1–2); 1 Ne. 14:3; D&C 10:26 (25–27).'
