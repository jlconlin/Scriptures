chapter: 1
claims:
  - where: when
    claim: 'Ahasuerus of Esther 1:1 is Xerxes, reigning from 486; his third year is about 483 B.C.'
    key: bible-chron-ot
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bible-chron/old-testament?lang=eng'
    quote: '=Xerxes, 486–465.'
  - where: setting
    claim: 'The Ahasuerus of Esther 1:1 is identified with Xerxes (the setting follows Scripture Helps’ “commonly identified”)'
    key: bd-ahasuerus
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ahasuerus?lang=eng'
    quote: '(3) Esth. 1:1, where Ahasuerus is certainly to be identified with Xerxes.'
  - where: setting
    claim: 'Ahasuerus is commonly identified as Xerxes I, who ruled 486–465 B.C.; some Jews returned after 539 B.C. but many, Esther among them, stayed; Shushan was one of the capitals, where Nehemiah later served'
    key: scripture-helps-esther
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/30-esther?lang=eng'
    quote: 'King Ahasuerus, commonly identified as Xerxes I, who ruled Persia from 486 to 465 BC. While some Jews had returned to Jerusalem after King Cyrus conquered Babylon in 539 BC, many remained in exile, including Esther.'
  - where: setting
    claim: 'Shushan was one of the capitals of Persia, and Nehemiah served there'
    key: scripture-helps-esther
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/30-esther?lang=eng'
    quote: 'Esther lived in Shushan (also called Susa), which was one of the capitals of the Persian Empire. … Shushan was also where Nehemiah served as the cupbearer to King Artaxerxes'
  - where: setting
    claim: 'Scholars differ on the book’s historical accuracy; Joseph Smith made no changes; modern prophets speak of Esther as historical'
    key: scripture-helps-esther
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/30-esther?lang=eng'
    quote: 'While Bible scholars hold diverse views about the historical accuracy of the book of Esther … the Prophet Joseph Smith made no changes to Esther during his translation of the Bible, and modern prophets have spoken of Esther as a real historical figure'
  - where: setting
    claim: 'Chapters 1–2: the king removes Vashti and chooses Esther'
    key: scripture-helps-esther
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/30-esther?lang=eng'
    quote: 'Esther 1–2: King Ahasuerus is displeased by the conduct of Queen Vashti and removes her from the throne. Ahasuerus selects Esther as the new queen.'
  - where: setting
    claim: 'Ahasuerus is the Hebrew form of the Persian Khsyayarsha; Xerxes the Greek'
    key: ot-manual-31
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-31?lang=eng'
    quote: 'This name is a Hebrew transliteration of the Persian Khsyayarsha, better known in history as Xerxes (the Greek form of the name).'
  - where: setting
    claim: 'Artaxerxes, whom Nehemiah served, was the son of Xerxes'
    key: bd-artaxerxes
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/artaxerxes?lang=eng'
    quote: 'Longimanus. Son of Xerxes and king of Persia, 465–425 B.C.; hinders Jews from building (Ezra 4:7–23); gives commission to Ezra (6:14; 7:1–21; 8:1) and to Nehemiah (Neh. 2:1; 5:14; 13:6).'
  - where: setting
    claim: 'The book is anonymous and cannot be dated, but fits the reign of Ahasuerus'
    key: breitenstein-esther-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/esther-1-10'
    quote: 'The book of Esther was written anonymously; therefore, it cannot be dated. However, the story coincides well with the reign of King Ahasuerus of Persia.'
  - where: setting
    claim: 'The book never refers to God directly, yet takes Him for granted and illustrates His providence'
    key: bd-esther-book
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/esther-book-of?lang=eng'
    quote: 'The book contains no direct reference to God, but He is everywhere taken for granted … the book has a religious value as containing a most striking illustration of God’s overruling providence in history'
  - where: thread
    claim: 'The decree of 1:19 is the law that binds the king again at 8:8'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/1?lang=eng'
    quote: '19a “altered”: Esth. 8:8.'
  - where: thread
    claim: 'At her banquet Esther names Haman to the king as the adversary and enemy'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/7?lang=eng'
    quote: 'And Esther said, The adversary and enemy is this wicked Haman.'
  - where: 'note 1:4 “Half a year of display, then a week of feasting”'
    claim: 'Read closely, the text does not say the feast lasted 180 days; the banquet is the seven-day feast after the 180 days'
    key: keil-esther
    url: 'https://biblehub.com/commentaries/kad/esther/1.htm'
    quote: 'The text, however, does not say, that the feast lasted 180 days'
  - where: 'note 1:4 “Half a year of display, then a week of feasting”'
    claim: 'Read straight through, verses 3–4 describe one feast of 180 days, and a Latter-day Saint guide to the book takes them so'
    key: breitenstein-esther-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/esther-1-10'
    quote: 'Three years into his reign, Ahasuerus arranged a feast to which he invited all the high-ranking and powerful people around him. He wanted to show them his splendor and riches. The feast lasted one hundred and eighty days.'
  - where: 'note 1:4 “Half a year of display, then a week of feasting”'
    claim: 'Herodotus’ four years of preparation fit an assembly in the third year'
    key: keil-esther
    url: 'https://biblehub.com/commentaries/kad/esther/1.htm'
    quote: 'that Xerxes was four years preparing for this war, we receive also a corroboration of the particular mentioned in Esther 1:3, that he assembled his princes and nobles in the third year of his reign'
  - where: 'note 1:4 “Half a year of display, then a week of feasting”'
    claim: 'Purpose not stated; Keil, from Herodotus, takes the assembly as a council about the campaign against Greece; Xerxes prepared four years'
    key: keil-esther
    url: 'https://biblehub.com/commentaries/kad/esther/1.htm'
    quote: 'The purpose for which the king assembled the grandees of his kingdom around him in Susa fore a whole half-year is not stated … Xerxes, after the re-subjection of Egypt, summoned the chief men of his kingdom to Susa to take counsel with them concerning the campaign against Greece'
  - where: 'note 1:4 “Half a year of display, then a week of feasting”'
    claim: 'On this view the riches of the kingdom are the resources of the realm'
    key: keil-esther
    url: 'https://biblehub.com/commentaries/kad/esther/1.htm'
    quote: 'Herod. vii. 20, that Xerxes was four years preparing for this war … "the riches of his kingdom," etc., mentioned in Esther 1:4, must not be understood of the splendour and magnificence displayed in the entertainment of his guests, but referred to the greatness and resources of the realm'
  - where: 'note 1:4 “Half a year of display, then a week of feasting”'
    claim: 'Thermopylae and Salamis in 480 B.C.'
    key: bible-chron-ot
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bible-chron/old-testament?lang=eng'
    quote: 'Battles of Thermopylae and Salamis, 480.'
  - where: 'note 1:8 “A rule for the drinking”'
    claim: 'dath: decree, law, usage; a Persian loanword of the Persian period; used even of rules for drinking at a feast (1:8) and of the permanent laws of 1:19'
    key: bdb
    url: 'https://biblehub.com/hebrew/1881.htm'
    quote: 'decree, law, usage, only in Persian period … Persian loan-word, Old Persian dâta, law … 2 law, permanently valid and applicable … Esther 1:19 … even of rules for drinking at a feast Esther 1:8'
  - where: 'note 1:8 “A rule for the drinking”'
    claim: 'The verb ’anas, “compel,” in 1:8: none compelling (to drink)'
    key: bdb
    url: 'https://biblehub.com/hebrew/597.htm'
    quote: 'Qal Participle אֵין אֹנֵס namely, to drink Esther 1:8'
  - where: 'note 1:8 “A rule for the drinking”'
    claim: 'Custom had guests drink when the king drank; here the king let them drink as they wished'
    key: breitenstein-esther-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/esther-1-10'
    quote: 'Historians maintain that the culture of the time required that all those who attended a king’s feast drank while the king drank. However, at this particular feast, King Ahasuerus allowed his guests to drink according to their own desires.'
  - where: 'note 1:8 “A rule for the drinking”'
    claim: 'One translation reads verse 8 as wine in any quantity desired'
    key: ot-manual-31
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-31?lang=eng'
    quote: 'One feature of the banquet was a large amount of wine which, according to one translation of verse 8, was to be given to the guests in any quantity they desired'
  - where: 'note 1:12 “Why Vashti refused”'
    claim: 'The Bible Dictionary: she refused to show her beauty to the people and princes'
    key: bd-esther-book
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/esther-book-of?lang=eng'
    quote: 'Ahasuerus, king of Persia (most probably Xerxes), had decided to divorce his queen Vashti because she refused to show her beauty to the people and the princes.'
  - where: 'note 1:12 “Why Vashti refused”'
    claim: 'Vashti deposed for disobedience'
    key: bd-vashti
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/vashti?lang=eng'
    quote: 'Queen of Ahasuerus (Esth. 1–2); deposed for disobedience and replaced by Esther (1:12, 19; 2:17).'
  - where: 'note 1:12 “Why Vashti refused”'
    claim: 'The drinking was probably the reason; the guests were probably drunk; beneath a queen’s dignity'
    key: ot-manual-31
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-31?lang=eng'
    quote: 'That was probably the reason for Queen Vashti’s refusal to appear. After seven days of heavy drinking, the guests were probably quite inebriated, and she may have considered it beneath the dignity of the queen to parade before such a lot simply to display her beauty.'
  - where: 'note 1:12 “Why Vashti refused”'
    claim: 'Keil: she would not stake her dignity as queen and wife before inebriated guests'
    key: keil-esther
    url: 'https://biblehub.com/commentaries/kad/esther/1.htm'
    quote: 'The queen refused to appear at the king''s command as delivered by the eunuchs, because she did not choose to stake her dignity as a queen and a wife before his inebriated guests.'
  - where: 'note 1:12 “Why Vashti refused”'
    claim: 'The text: king merry with wine, summons with the crown, refusal, anger'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/1?lang=eng'
    quote: 'But the queen Vashti refused to come at the king’s commandment by his chamberlains: therefore was the king very wroth, and his anger burned in him.'
  - where: 'note 1:13 “Wise men who knew the times”'
    claim: '“Knew the times” in 1:13 means astrologers; the idiom is late; compare 1 Chr. 12:32; listed under “proper, suitable time”'
    key: bdb
    url: 'https://biblehub.com/hebrew/6256.htm'
    quote: 'b. proper, suitable time … hence (late) יוֺדְעֵי בִינָה לָעִתִּים 1 Chronicles 12:32, יִדְעֵי הָעִתִּים Esther 1:13 i.e. astrologers, etc.'
  - where: 'note 1:13 “Wise men who knew the times”'
    claim: '“Law and judgment” in 1:13 uses dath, as do 1:15 and 1:8'
    key: bdb
    url: 'https://biblehub.com/hebrew/1881.htm'
    quote: 'יֹדְעֵי דָּת וָדִין Esther 1:13 those that understood law and judgment'
  - where: 'note 1:13 “Wise men who knew the times”'
    claim: 'The footnote to “times” gives 1 Chr. 12:32'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/1?lang=eng'
    quote: '13b “times”: 1 Chr. 12:32; Matt. 16:3.'
  - where: 'note 1:19 “A decree that cannot be altered”'
    claim: 'The footnote to “altered” points to Esth. 8:8'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/1?lang=eng'
    quote: '19a “altered”: Esth. 8:8.'
  - where: 'note 1:22 “A law for every house, in every language”'
    claim: 'The footnote to “language” points to Esth. 8:9'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/1?lang=eng'
    quote: '22a “language”: Esth. 8:9.'
  - where: 'note 1:22 “A law for every house, in every language”'
    claim: 'The Hebrew ends “and speaking according to the language of his people”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Esth.xml'
    quote: 'וּ/מְדַבֵּ֖ר'
  - where: 'note 1:22 “A law for every house, in every language”'
    claim: 'ESV: every man master in his household and speak according to the language of his people'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Esther+1&version=ESV'
    quote: 'that every man be master in his own household and speak according to the language of his people.'
  - where: 'note 1:22 “A law for every house, in every language”'
    claim: 'NRSVue omits the clause, following the Greek'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Esther+1&version=NRSVUE'
    quote: '1.22 Compare Gk: Heb adds and speak according to the language of his people'
  - where: 'section 3 plain'
    claim: 'Plain rendering of 1:22 follows the Hebrew: master in his house and speak his people’s language'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Esther+1&version=ESV'
    quote: 'that every man be master in his own household and speak according to the language of his people.'
  - where: christ
    claim: 'God is everywhere taken for granted in the book'
    key: bd-esther-book
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/esther-book-of?lang=eng'
    quote: 'The book contains no direct reference to God, but He is everywhere taken for granted'
  - where: christ
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: christ
    claim: 'Jehovah is the name of the God of Israel'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'The covenant or proper name of the God of Israel.'
  - where: christ
    claim: 'The decree removing Vashti set up Esther’s opportunity to be chosen and to save her people'
    key: ot-manual-31
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-31?lang=eng'
    quote: 'The king agreed, the decree was made, and Vashti lost her place as queen, setting up the opportunity for Esther to be selected as one of the king’s wives and eventually to save her people.'
  - where: christ
    claim: 'The Lord’s influence is not always recognized; He can guide our path and prepare us to be instruments in His hands'
    key: cfm-ot-2026-32
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/32?lang=eng'
    quote: 'We might not always recognize the Lord’s influence in these “small details.” But we learn from Esther’s experience that He can guide our path and prepare us “for such a time” (Esther 4:14) when we can be instruments in His hands to fulfill His purposes.'
