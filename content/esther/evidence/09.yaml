chapter: 9
claims:
  - where: 'when'
    claim: 'Ahasuerus of Esther is Xerxes, who began to reign in 486 B.C. (the basis of the approximate date)'
    key: bible-chron-ot
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bible-chron/old-testament?lang=eng'
    quote: '=Xerxes, 486–465.'
  - where: 'setting'
    claim: 'The first decree could not be undone, so Esther persuaded the king to issue another allowing the Jews to defend themselves'
    key: scripture-helps-esther
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/30-esther?lang=eng'
    quote: 'King Ahasuerus’s decree, which mandated the destruction of the Jews, could not be undone. So Esther persuaded the king to issue another decree allowing the Jews to defend themselves before the planned day of their own massacre.'
  - where: 'setting'
    claim: 'Chapters 9–10 form the last part of the book: the Jews receive authority to kill their enemies and institute Purim to remember their deliverance'
    key: scripture-helps-esther
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/30-esther?lang=eng'
    quote: 'Esther 9–10: The Jews receive authority from the king to kill their enemies in the kingdom. They institute the Feast of Purim to commemorate their miraculous deliverance from Haman’s plan.'
  - where: 'setting'
    claim: 'The chapter moves from the fighting (1–15) to the rest and feasting (16–19) to the institution of Purim by Esther and Mordecai (20–32)'
    key: keil-esther
    url: 'https://biblehub.com/commentaries/kad/esther/9.htm'
    quote: 'At the queen''s desire, the king granted permission to the Jews in Susa to fight against their enemies on the following day also (Esther 9:11-15), while in the other towns … (Esther 9:16-19). The observance of this day of resting as a festival, under the name of Purim … was then instituted by Esther and Mordochai (Esther 9:20-32).'
  - where: 'thread'
    claim: 'The Jews were allowed to take plunder but did not'
    key: breitenstein-esther-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/esther-1-10'
    quote: 'The Hebrews were allowed to take plunder (see 8:11), but they did not.'
  - where: 'thread'
    claim: 'The name Purim was given in mockery of Haman’s lots'
    key: bd-feasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/feasts?lang=eng'
    quote: 'The name Purim (lots) was given in mockery of the lots Haman had cast to secure a day of good omen for his enterprise (Esth. 3:7).'
  - where: 'note 9:1 “The day turned to the contrary”'
    claim: 'The first decree could not be undone; the second allowed the Jews to defend themselves before the planned day'
    key: scripture-helps-esther
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/30-esther?lang=eng'
    quote: 'King Ahasuerus’s decree, which mandated the destruction of the Jews, could not be undone. So Esther persuaded the king to issue another decree allowing the Jews to defend themselves before the planned day of their own massacre.'
  - where: 'note 9:1 “The day turned to the contrary”'
    claim: 'The book is a striking illustration of God’s overruling providence'
    key: bd-esther-book
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/esther-book-of?lang=eng'
    quote: 'But the book has a religious value as containing a most striking illustration of God’s overruling providence in history'
  - where: 'note 9:1 “The day turned to the contrary”'
    claim: 'The footnote ties 9:1’s “commandment” to the decree of 3:13; the text of 8:8–12 and 9:22, 25'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/9?lang=eng'
    quote: '1a “commandment”: Esth. 3:13 (12–13).'
  - where: 'note 9:3 “Why the king’s officers helped”'
    claim: 'The text of 3:12, 8:2, 8:9 and 9:3–4'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/9?lang=eng'
    quote: 'helped the Jews; because the fear of Mordecai fell upon them'
  - where: 'note 9:10 “No hand on the spoil”'
    claim: 'The Jews were allowed to take plunder but did not; their focus was on defending themselves'
    key: breitenstein-esther-minute
    url: 'https://scripturecentral.org/archive/books/book-chapter/esther-1-10'
    quote: 'The Hebrews were allowed to take plunder (see 8:11), but they did not. They had put their focus only on defending themselves.'
  - where: 'note 9:10 “No hand on the spoil”'
    claim: 'The text of 3:13, 8:11 and 9:10, 15, 16; the footnote ties 9:2 to 8:11'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/9?lang=eng'
    quote: '2a “gathered”: Esth. 8:11.'
  - where: 'note 9:13 “A second day, and the ten sons hanged”'
    claim: 'The dead bodies were exposed for greater disgrace, by Hebrew and Persian custom, compare Deut. 21:22'
    key: keil-esther
    url: 'https://biblehub.com/commentaries/kad/esther/9.htm'
    quote: 'i.e., their dead bodies nailed on crosses - majoris infamiae causa, according to Hebrew and Persian custom; comp. Deuteronomy 21:22'
  - where: 'note 9:13 “A second day, and the ten sons hanged”'
    claim: 'In Esther hanging was the punishment of those in rebellion against the king’s authority, and (the size of the gallows suggests) a public humiliation; the point is made in full at 5:14'
    key: belnap-fell-tree
    url: 'https://rsc.byu.edu/they-shall-grow-together/they-did-fell-tree'
    quote: 'The size of the gallows suggests that it was meant to be visible from a distance, which in turn suggests that the hanging was to be a public humiliation … the punishment of hanging came as a result of those who were in rebellion or who sought to overrule the king’s authority.'
  - where: 'note 9:13 “A second day, and the ten sons hanged”'
    claim: 'The text of 5:14, 7:10, 9:10–15, 25 and Deut. 21:22–23'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/9?lang=eng'
    quote: 'let it be granted to the Jews which are in Shushan to do to morrow also according unto this day’s decree'
  - where: 'note 9:16 “Standing for their lives”'
    claim: 'The second decree allowed the Jews to defend themselves before the planned day of their own massacre'
    key: scripture-helps-esther
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/30-esther?lang=eng'
    quote: 'So Esther persuaded the king to issue another decree allowing the Jews to defend themselves before the planned day of their own massacre.'
  - where: 'note 9:16 “Standing for their lives”'
    claim: 'The Greek translation gives fifteen thousand slain in the provinces'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/esther/9.htm'
    quote: 'for they destroyed fifteen thousand of them on the thirteenth day of Adar, but took no spoil.'
  - where: 'note 9:16 “Standing for their lives”'
    claim: 'The text of 8:11 and 9:1–16: the same words “stand for their life,” the counts, “men” in Shushan'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/9?lang=eng'
    quote: '2a “gathered”: Esth. 8:11.'
  - where: 'note 9:19 “Why Purim has two days”'
    claim: 'The feast was held on the 14th and 15th of Adar'
    key: bd-feasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/feasts?lang=eng'
    quote: 'The feast was held on the 14th and 15th of Adar (the twelfth month).'
  - where: 'note 9:19 “Why Purim has two days”'
    claim: 'The text of 9:17–21: the provinces rested on the 14th, Shushan on the 15th, and the letter fixed both days'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/9?lang=eng'
    quote: 'made the fourteenth day of the month Adar a day of gladness and feasting'
  - where: 'note 9:22 “What the feast remembers”'
    claim: 'The text of 4:3 and 9:22–28'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/9?lang=eng'
    quote: 'and of sending portions one to another, and gifts to the poor'
  - where: 'note 9:26 “Purim, then and now”'
    claim: 'Purim instituted by Mordecai and confirmed by Esther; named in mockery of Haman’s lots; the book read in the synagogues'
    key: bd-feasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/feasts?lang=eng'
    quote: 'The Feast of Purim (called Mordecai’s Day) was instituted by Mordecai and confirmed by Esther … The name Purim (lots) was given in mockery of the lots Haman had cast … During the feast the whole book of Esther was read in the synagogues'
  - where: 'note 9:26 “Purim, then and now”'
    claim: 'Jews still keep Purim, with gifts and presents to the poor, and the story of Esther read in the synagogue'
    key: scripture-helps-esther
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/30-esther?lang=eng'
    quote: 'Today, Jews still observe the Feast of Purim. … It is celebrated with food, music, and other festivities, including exchanging gifts and giving presents to the poor. On Purim, Jews traditionally dress in costumes and gather at the synagogue, where the entire story of Esther is read or reenacted.'
  - where: 'note 9:26 “Purim, then and now”'
    claim: 'Purim is a regular work day, celebrated in the evening, with a serious message about persecution and God’s protection'
    key: keller-judaism
    url: 'https://rsc.byu.edu/light-truth/judaism'
    quote: 'Purim is a regular work day, but in the evening, all the children dress up as Xerxes, Esther, or Mordecai and go to the synagogue. … It is an evening of good fun with a very serious message to proclaim about Jewish persecution and the way God protects his people.'
  - where: 'note 9:26 “Purim, then and now”'
    claim: 'Purim is a minor festival'
    key: keller-judaism
    url: 'https://rsc.byu.edu/light-truth/judaism'
    quote: 'Hanukkah, like Purim, is a minor festival.'
  - where: 'note 9:26 “Purim, then and now”'
    claim: 'The text of 3:7, 9:20–32 and Leviticus 23 (Purim not among its feasts)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/9?lang=eng'
    quote: 'Wherefore they called these days Purim after the name of Pur.'
  - where: 'note 9:31 “The fastings and their cry”'
    claim: 'One reading: times of fasting and lamentation appointed within the days of Purim; the verse does not state when'
    key: keil-esther
    url: 'https://biblehub.com/commentaries/kad/esther/9.htm'
    quote: 'According to the injunctions of Esther and Mordochai, the Jews appointed for themselves and their descendants times also of fasting and lamentation in the days of Purim. … The times when the fasting and lamentation were to take place in the days of Purim, are not stated in this verse'
  - where: 'note 9:31 “The fastings and their cry”'
    claim: 'The 13th of Adar, first a feast for a Maccabean victory, later became a fast, the Fast of Esther, in preparation for the feast'
    key: bd-feasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/feasts?lang=eng'
    quote: 'The 13th of Adar, which was originally a feast to commemorate a Maccabean victory, afterwards became a fast, called the Fast of Esther, in preparation for the feast.'
  - where: 'note 9:31 “The fastings and their cry”'
    claim: 'The fastings point back to the fast of chapter 4 (footnote 31a); the text of 3:13 and 9:31–32'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/9?lang=eng'
    quote: '31a “fastings”: Esth. 4:3 (3, 16).'
  - where: 'christ'
    claim: 'Esth. 9:22’s “turned … from sorrow to joy” set beside the same words in John 16:20, 22 (quoted with references); shared words only'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/9?lang=eng'
    quote: 'As the days wherein the Jews rested from their enemies, and the month which was turned unto them from sorrow to joy'
