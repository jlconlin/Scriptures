  - where: 'section “If I perish”: what the story cannot do'
    claim: 'Connection made by this page: Esther’s “if I perish” is a condition not met (5:2), while the Advocate’s plea begins with “the sufferings and death of him who did no sin” (D&C 45:4) and His death destroys “him that had the power of death” (Heb. 2:14); her people’s deliverance does not come by her death, and the Advocate’s plea begins where her story cannot go.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/45?lang=eng'
    quote: 'behold the sufferings and death of him who did no sin'
  - where: 'section “If I perish”: what the story cannot do'
    claim: 'Connection made by this page: Three of Esther’s petitions rest on the king’s favour, offered with “if” (5:8; 7:3; 8:5), and what she pleads first is that favour, though she also argues the king’s loss (7:4) and that the thing “seem right” (8:5); Christ’s plea is not opposed to favour (“in whom thou wast well pleased”) but does not rest on it alone: He pleads His blood and asks to spare “these my brethren that believe on my name” (D&C 45:4–5). She pleads the king’s pleasure in her; He pleads His death.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/45?lang=eng'
    quote: 'in whom thou wast well pleased; behold the blood of thy Son which was shed'
  - where: 'section “If I perish”: what the story cannot do'
    claim: 'Connection made by this page: in Esther the enemy is hanged on the tree (7:10; 8:7; 9:25; the Hebrew “tree” behind the KJV “gallows”) and the advocate lives; the law calls the one so hanged “accursed of God” (Deut. 21:22–23, the same two roots), and in the gospel it is Christ, “made a curse for us,” who hangs on the tree (Gal. 3:13). Only this contrast is drawn: Haman is not a figure of Christ or of the devil, and Christ is not said to take Haman’s place.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/gal/3?lang=eng'
    quote: 'being made a curse for us: for it is written, Cursed is every one that hangeth on a tree'

