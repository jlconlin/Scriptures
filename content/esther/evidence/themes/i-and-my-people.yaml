  - where: 'section “He pleads that death”'
    claim: 'Connection made by this page: a likeness of structure only between Esther’s second writing, which meets the first without repealing it (8:8, 11), and mercy that does not rob justice but answers it through an atonement (Alma 42:15, 25). Two differences hold it there: Haman’s decree was wicked and God’s law is just; and the second decree only let the condemned fight for their lives, while the Atonement satisfies the demands of justice itself. The decree does not figure God’s law, nor the second decree the Atonement.'
