page: i-and-my-people
claims:
  # ---------- opening ----------
  - where: 'opening'
    claim: 'Esth. 1:19 as quoted: Vashti’s removal written so that it be not altered'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/1?lang=eng'
    quote: 'let it be written among the laws of the Persians and the Medes, that it be not altered'
  - where: 'opening'
    claim: 'Esth. 3:12 as quoted: Haman’s letters written in the king’s name and sealed with his ring'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/3?lang=eng'
    quote: 'in the name of king Ahasuerus was it written, and sealed with the king’s ring'
  - where: 'opening'
    claim: 'Esth. 8:5 as quoted: Esther asks to reverse Haman’s letters'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/8?lang=eng'
    quote: 'to reverse the letters devised by Haman'
  - where: 'opening'
    claim: 'Esth. 8:8 as quoted: the sealed writing may no man reverse'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/8?lang=eng'
    quote: 'the writing which is written in the king’s name, and sealed with the king’s ring, may no man reverse'
  - where: 'opening'
    claim: 'Esth. 8:11 as quoted: the second writing lets the Jews stand for their life'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/8?lang=eng'
    quote: 'to stand for their life'
  - where: 'opening'
    claim: 'The decree mandating the destruction of the Jews could not be undone; Esther secured a second decree'
    key: scripture-helps-esther
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/30-esther?lang=eng'
    quote: 'The text notes that King Ahasuerus’s decree, which mandated the destruction of the Jews, could not be undone.'
  - where: 'opening'
    claim: 'Esth. 4:16 as quoted in the opening'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/4?lang=eng'
    quote: 'if I perish, I perish'
  - where: 'opening'
    claim: 'Esth. 7:4 as quoted in the opening'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/7?lang=eng'
    quote: 'we are sold, I and my people'
  - where: 'opening'
    claim: 'Esth. 8:6 as quoted in the opening (“my people,” “my kindred”)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/8?lang=eng'
    quote: 'how can I endure to see the destruction of my kindred?'
  - where: 'opening'
    claim: 'The 2014 message on Christ as Advocate sets Esther among the female disciples of Jesus Christ who have followed His example (it does not call her an advocate or a type)'
    key: ensign-2014-advocate
    url: 'https://www.churchofjesuschrist.org/study/ensign/2014/07/the-divine-mission-of-jesus-christ-advocate?lang=eng'
    quote: 'Throughout the history of the Lord’s Church, female disciples of Jesus Christ have followed His example. Esther was faithful and courageous.'
  - where: 'opening'
    claim: 'The 1982 Student Manual’s chapter is titled “Esther: Queen of Persia and Advocate for Her People”; the title is not explained in the chapter'
    key: ot-manual-31
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-31?lang=eng'
    quote: 'Esther: Queen of Persia and Advocate for Her People'

  # ---------- Her people nor her kindred ----------
  - where: 'section “Her people nor her kindred”'
    claim: 'Esth. 2:10 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/2?lang=eng'
    quote: 'Esther had not shewed her people nor her kindred: for Mordecai had charged her that she should not shew it.'
  - where: 'section “Her people nor her kindred”'
    claim: 'Esth. 2:20: the narrator says again that she had not shewed her kindred, at Mordecai’s charge'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/2?lang=eng'
    quote: 'Esther had not yet shewed her kindred nor her people; as Mordecai had charged her'
  - where: 'section “Her people nor her kindred”'
    claim: 'Esth. 3:13 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/3?lang=eng'
    quote: 'to destroy, to kill, and to cause to perish, all Jews, both young and old, little children and women, in one day'
  - where: 'section “Her people nor her kindred”'
    claim: 'Esth. 4:8 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/4?lang=eng'
    quote: 'and to make request before him for her people'
  - where: 'section “Her people nor her kindred”'
    claim: 'Esth. 4:11 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/4?lang=eng'
    quote: 'there is one law of his to put him to death, except such to whom the king shall hold out the golden sceptre'
  - where: 'section “Her people nor her kindred”'
    claim: 'Esth. 4:13 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/4?lang=eng'
    quote: 'Think not with thyself that thou shalt escape in the king’s house, more than all the Jews.'
  - where: 'section “Her people nor her kindred”'
    claim: 'Esth. 4:14 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/4?lang=eng'
    quote: 'thou and thy father’s house shall be destroyed'
  - where: 'section “Her people nor her kindred”'
    claim: 'Esth. 4:16 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/4?lang=eng'
    quote: 'so will I go in unto the king, which is not according to the law: and if I perish, I perish'
  - where: 'section “Her people nor her kindred”'
    claim: '“Perish” in 4:16 is ʾābad (H6), Qal perfect 1st person singular, twice: the only first-person use in Esther (hebrew.mjs esther 4:16: HVqp1cs twice)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Esth.xml'
    quote: 'אָבַ֖דְתִּי'
  - where: 'section “Her people nor her kindred”'
    claim: 'H6 occurs 13 times in 11 verses of Esther (occurrences.mjs esther --hebrew H6: 3:9, 3:13, 4:7, 4:14, 4:16 twice, 7:4, 8:5, 8:11, 9:6, 9:12, 9:24 twice)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Esth.xml'
    quote: 'אָבָֽדְתִּי'
  - where: 'section “Her people nor her kindred”'
    claim: 'The decree’s “to cause to perish” at 3:13 is H6, Piel infinitive construct (hebrew.mjs esther 3:13: HC/R/Vpc)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Esth.xml'
    quote: 'וּ/לְ/אַבֵּ֣ד'
  - where: 'section “Her people nor her kindred”'
    claim: 'Mordecai’s “shall be destroyed” at 4:14 is H6, Qal imperfect 2nd plural (hebrew.mjs esther 4:14: HVqi2mp), the simple form as in 4:16'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Esth.xml'
    quote: 'תֹּאבֵ֑דוּ'
  - where: 'section “Her people nor her kindred”'
    claim: 'H6 is used of what the Jews are granted to do (8:11) and do (9:6) to their enemies (occurrences.mjs esther --hebrew H6)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Esth.xml'
    quote: 'וְ/אַבֵּ֔ד'
  - where: 'section “Her people nor her kindred”'
    claim: 'Esth. 8:11 (cited): the second decree’s “to destroy, to slay, and to cause to perish”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/8?lang=eng'
    quote: 'to destroy, to slay, and to cause to perish, all the power of the people and province that would assault them'
  - where: 'section “Her people nor her kindred”'
    claim: 'Esth. 9:6 (cited): the Jews slew and destroyed five hundred men'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/9?lang=eng'
    quote: 'the Jews slew and destroyed five hundred men'
  - where: 'section “Her people nor her kindred”'
    claim: 'Esther’s words at 4:16 are resignation, not despair, at what she had determined to do'
    key: ot-manual-31
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-31?lang=eng'
    quote: 'Her words are an expression not of despair but of resignation in light of what she had determined she had to do'
  - where: 'section “Her people nor her kindred”'
    claim: 'Connection made by this page: Esther’s “if I perish, I perish” (4:16) answers the decree (3:13) and Mordecai (4:14) in their own verb, ʾābad, and is its only first-person use in the book; the decree said it of all Jews, Mordecai of her, and she of herself. The echo is of the root (her form is nearer Mordecai’s simple verb than the decree’s intensive infinitive), and it shows a hidden Jew owning a sentence already hers, not an exempt one taking on another’s.'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Esth.xml'
    quote: 'אָבָֽדְתִּי'

  # ---------- We are sold, I and my people ----------
  - where: 'section “We are sold, I and my people”'
    claim: 'Esth. 5:2: the king holds out the sceptre'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/5?lang=eng'
    quote: 'the king held out to Esther the golden sceptre that was in his hand'
  - where: 'section “We are sold, I and my people”'
    claim: 'Esth. 5:4 as quoted: her request is a banquet for the king and Haman'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/5?lang=eng'
    quote: 'let the king and Haman come this day unto the banquet that I have prepared for him'
  - where: 'section “We are sold, I and my people”'
    claim: 'Esth. 5:8: at the banquet she asks for a second'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/5?lang=eng'
    quote: 'let the king and Haman come to the banquet that I shall prepare for them'
  - where: 'section “We are sold, I and my people”'
    claim: 'Esth. 7:3 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/7?lang=eng'
    quote: 'let my life be given me at my petition, and my people at my request'
  - where: 'section “We are sold, I and my people”'
    claim: 'Esth. 7:4 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/7?lang=eng'
    quote: 'For we are sold, I and my people, to be destroyed, to be slain, and to perish.'
  - where: 'section “We are sold, I and my people”'
    claim: 'Esth. 7:4 as quoted: “I had held my tongue”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/7?lang=eng'
    quote: 'But if we had been sold for bondmen and bondwomen, I had held my tongue'
  - where: 'section “We are sold, I and my people”'
    claim: '“To perish” at 7:4 is the same Piel infinitive construct as the decree’s at 3:13 (hebrew.mjs esther 7:4: HC/R/Vpc)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Esth.xml'
    quote: 'וּ/לְ/אַבֵּ֑ד'
  - where: 'section “We are sold, I and my people”'
    claim: 'Esth. 4:14 cited: Mordecai warns against holding her peace'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/4?lang=eng'
    quote: 'For if thou altogether holdest thy peace at this time'
  - where: 'section “We are sold, I and my people”'
    claim: '“Holdest thy peace” (4:14) and “held my tongue” (7:4) are one verb, ḥrš (H2790b), found in Esther only in these two verses (occurrences.mjs esther --hebrew H2790b: 4:14 twice, 7:4 once)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Esth.xml'
    quote: 'הֶחֱרַ֔שְׁתִּי'
  - where: 'section “We are sold, I and my people”'
    claim: 'Esth. 8:1 as quoted: the king gives Esther Haman’s house, and she had told what Mordecai was to her'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/8?lang=eng'
    quote: 'for Esther had told what he was unto her'
  - where: 'section “We are sold, I and my people”'
    claim: 'The edition’s footnote 8:1a (“what”) points back to Esth. 2:10'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/8?lang=eng'
    quote: 'Esth. 2:10'
  - where: 'section “We are sold, I and my people”'
    claim: 'Esth. 8:3 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/8?lang=eng'
    quote: 'fell down at his feet, and besought him with tears to put away the mischief of Haman the Agagite'
  - where: 'section “We are sold, I and my people”'
    claim: 'Esth. 8:6 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/8?lang=eng'
    quote: 'For how can I endure to see the evil that shall come unto my people? or how can I endure to see the destruction of my kindred?'
  - where: 'section “We are sold, I and my people”'
    claim: 'The rest of the Jews were to be saved after Esther and Mordecai had been saved; the edict could not be revoked'
    key: ot-manual-31
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-31?lang=eng'
    quote: 'The task of saving the rest of the Jews after Esther and Mordecai had been saved and exalted in the realm was complicated by the announced principle that any edict which had been issued in the king’s name could not be revoked.'
  - where: 'section “We are sold, I and my people”'
    claim: '“Kindred” is môledet (H4138), in Esther only at 2:10, 2:20 (“her kindred”) and 8:6 (“my kindred”) (occurrences.mjs esther --hebrew H4138: 3 occurrences in 3 verses)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Esth.xml'
    quote: 'מוֹלַדְתִּֽ/י'
  - where: 'section “We are sold, I and my people”'
    claim: '“Destruction” in 8:6 is H13, a noun (its only occurrence in Esther), not the verb H6 (occurrences.mjs esther --hebrew H13; hebrew.mjs esther 8:6: HR/Ncmsc)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Esth.xml'
    quote: 'בְּ/אָבְדַ֖ן'
  - where: 'section “We are sold, I and my people”'
    claim: 'Esth. 8:4: the sceptre held out a second time'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/8?lang=eng'
    quote: 'Then the king held out the golden sceptre toward Esther.'
  - where: 'section “We are sold, I and my people”'
    claim: 'Esth. 9:13 as quoted: her request for a second day and that Haman’s ten sons be hanged'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/9?lang=eng'
    quote: 'let it be granted to the Jews which are in Shushan to do to morrow also according unto this day’s decree, and let Haman’s ten sons be hanged upon the gallows'
  - where: 'section “We are sold, I and my people”'
    claim: 'Connection made by this page: read in order, 2:10 and 2:20 (“her people… her kindred,” unspoken), 4:16 (“I perish”), 7:3–4 (“I and my people”) and 8:6 (“my people… my kindred”) make one development: silence about her people, the sentence spoken of herself, herself and her people named as one, and a plea for them alone; the two nouns she was charged not to show (môledet only in these three verses) are the two she ends by claiming. No source traces the sequence; the arc is in her words, not in a count of audiences (the sceptre is held out twice, and 9:13 follows 8:6).'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/8?lang=eng'
    quote: 'how can I endure to see the destruction of my kindred?'

  # ---------- He also himself likewise took part of the same ----------
  - where: 'section “He also himself likewise took part of the same”'
    claim: 'Heb. 11:24–26 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/11?lang=eng'
    quote: 'Choosing rather to suffer affliction with the people of God, than to enjoy the pleasures of sin for a season;'
  - where: 'section “He also himself likewise took part of the same”'
    claim: 'Heb. 11:24, 26 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/11?lang=eng'
    quote: 'Esteeming the reproach of Christ greater riches than the treasures in Egypt'
  - where: 'section “He also himself likewise took part of the same”'
    claim: 'Heb. 2:11 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/2?lang=eng'
    quote: 'he is not ashamed to call them brethren'
  - where: 'section “He also himself likewise took part of the same”'
    claim: 'Heb. 2:14 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/2?lang=eng'
    quote: 'Forasmuch then as the children are partakers of flesh and blood, he also himself likewise took part of the same'
  - where: 'section “He also himself likewise took part of the same”'
    claim: 'Heb. 2:16 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/2?lang=eng'
    quote: 'but he took on him the seed of Abraham'
  - where: 'section “He also himself likewise took part of the same”'
    claim: 'Heb. 2:17 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/2?lang=eng'
    quote: 'in all things it behoved him to be made like unto his brethren'
  - where: 'section “He also himself likewise took part of the same”'
    claim: 'Advocate: one who pleads another’s cause; Jesus Christ is the Advocate with the Father'
    key: bd-advocate
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/advocate?lang=eng'
    quote: 'One who pleads another’s cause. Jesus Christ is the Advocate with the Father'
  - where: 'section “He also himself likewise took part of the same”'
    claim: 'D&C 45:4 as quoted: “him who did no sin”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/45?lang=eng'
    quote: 'behold the sufferings and death of him who did no sin'
  - where: 'section “He also himself likewise took part of the same”'
    claim: 'Connection made by this page: Esther’s choice to stand with her people under the decree is set beside Moses’s choice “to suffer affliction with the people of God,” which Hebrews calls “the reproach of Christ”: a like choice by one of God’s people in a king’s house, not the same, for Moses could have kept the pleasures of Egypt, while Esther, by Mordecai’s word (Esth. 4:13–14), could not have escaped. Hebrews does not have Esther in view, and the settings differ: Moses left the court, Esther keeps the crown and uses it.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/11?lang=eng'
    quote: 'Choosing rather to suffer affliction with the people of God'
  - where: 'section “He also himself likewise took part of the same”'
    claim: 'Connection made by this page: “I and my people” (Esth. 7:4) set beside “made like unto his brethren” (Heb. 2:11–17): each stands with the condemned and pleads for them, but Esther disclosed what she already was and was already under the sentence, while Christ, “him who did no sin,” was under no sentence and became what He was not, taking part of flesh and blood in order to die. Esther is not called a type of Christ.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/2?lang=eng'
    quote: 'he also himself likewise took part of the same; that through death he might destroy him that had the power of death'

