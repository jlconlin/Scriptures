chapter: 8
title: The Second Decree
tagline: Haman's house and ring pass to Esther and Mordecai, but his decree still stands; Esther pleads again, and a second decree, sealed with the same ring, lets the Jews stand for their lives.
when: 'The twenty-third day of the third month, Sivan (verse 9), in the twelfth year of Ahasuerus, about 474 B.C.'

setting: |
  Chapter 8 begins on the day Haman was hanged on the gallows he had built for Mordecai ([[Esth. 7:10]]). The king is still Ahasuerus, Xerxes, who began to reign in 486 B.C.; see [Persia and the Return](/old-testament/guides/persia-and-the-return/#rulers). The chapter closes the third part of the book, chapters 6–8, in which Esther exposes Haman's plot, the king hangs him and honors Mordecai, and Mordecai and Esther are allowed to answer the edict against the Jews.

  Haman is dead, but his work is not undone. His letters, written in the king's name and sealed with the king's ring on the thirteenth day of the first month, had gone to every province, ordering that every Jew be killed on the thirteenth day of Adar, the twelfth month ([[Esth. 3:12–13]]). Such a decree could not be revoked, and the day it named was still coming. Mordecai's answering letters are written on the twenty-third of Sivan, the third month (verse 9), some two months after Haman's and nearly nine months before the day both decrees name.

  The second decree follows the first closely, in its scribes, its seal, its posts and its date, and the notes on chapter 3 have already set the two side by side: the ring in [[Esth. 3:12]], the three verbs in [[Esth. 3:13]]. What the Jews did on the day itself is chapter 9.

thread: |
  The chapter turns from what can be reversed to what cannot. Everything personal is reversed at once: Haman's house goes to Esther, his ring and his place to Mordecai, and the man who sat in sackcloth outside the king's gate leaves the king's presence in royal apparel. But the decree Haman sealed still stands, and by the law of the Medes and Persians not even the king can recall it. So Esther must plead a second time, and what she obtains is not a cancellation but a second decree, sealed with the same ring, for the same day, that lets the Jews stand for their lives against any force that would assault them.

  The chapter ends as chapter 4 opened, with a decree reaching every province ([[Esth. 4:3]]), but the response is the opposite: where the first brought mourning, fasting and sackcloth, the second brings light, gladness, a feast and a good day (verses 16–17).

sections:
  - range: 1-2
    heading: Haman's house and ring
    plain: |
      That same day King Ahasuerus gave Queen Esther the house of Haman, the enemy of the Jews. Mordecai was admitted into the king's presence, because Esther had told the king how he was related to her. The king took off his signet ring, which he had taken back from Haman, and gave it to Mordecai. And Esther put Mordecai in charge of Haman's house.
  - range: 3-8
    heading: Esther pleads again
    plain: |
      Esther spoke to the king again. She fell at his feet and begged him with tears to undo the evil Haman the Agagite had planned against the Jews. The king held out the golden sceptre to Esther, and she rose and stood before him. She said: If it pleases the king, if I have found favor with him, if the thing seems right to the king, and if he is pleased with me, let an order be written to cancel the letters Haman son of Hammedatha the Agagite devised and wrote to destroy the Jews in all the king's provinces. For how can I bear to see the disaster that will come on my people? How can I bear to see my family destroyed? King Ahasuerus said to Queen Esther and to Mordecai the Jew: I have given Esther Haman's house, and he has been hanged on the gallows because he attacked the Jews. Now you write, for the Jews, whatever seems good to you, in the king's name, and seal it with the king's ring; for a document written in the king's name and sealed with his ring cannot be revoked by anyone.
  - range: 9-14
    heading: The second decree
    plain: |
      So the king's scribes were called on the twenty-third day of the third month, Sivan. Everything Mordecai ordered was written, to the Jews and to the satraps, governors and officials of the hundred and twenty-seven provinces from India to Ethiopia, to each province in its own script and each people in its own language, and to the Jews in their own script and language. Mordecai wrote in King Ahasuerus's name, sealed the letters with the king's ring, and sent them by mounted couriers on swift horses from the royal stables. The letters said that the king allowed the Jews in every city to gather and defend their lives: to destroy, kill and wipe out any armed force of any people or province that attacked them, little ones and women, and to take their goods as plunder, on one day in all the provinces of King Ahasuerus, the thirteenth day of the twelfth month, Adar. A copy of the document was to be issued as law in every province and published to every people, so that the Jews would be ready on that day to take vengeance on their enemies. The couriers on the royal horses went out in haste, pressed on by the king's command, and the decree was issued in the citadel of Shushan.
  - range: 15-17
    heading: Light and gladness
    plain: |
      Mordecai went out from the king's presence in royal robes of blue and white, with a great golden crown and a cloak of fine linen and purple, and the city of Shushan shouted for joy. For the Jews it was a time of light and gladness, joy and honor. In every province and every city where the king's order and decree arrived, there was joy and gladness among the Jews, a feast and a holiday. And many of the peoples of the land became Jews, because fear of the Jews had fallen on them.

notes:
  - ref: 2
    phrase: And Esther set Mordecai over the house of Haman
    kind: history
    title: Haman's house and Haman's ring
    body: |
      What Haman had is given to the two he meant to destroy. When he was executed his property was confiscated, and the king gave Esther “the house of Haman,” which means the household with everything that belonged to it. Esther in turn puts Mordecai over it.

      Mordecai himself is given more than a house. He “came before the king” (verse 1) once Esther had told the king what he was to her, her kinsman and the foster-father who had raised her ([[Esth. 2:7]]); to come before the king in this sense was to be received among the high officials who saw the king's face and had personal access to him ([[Esth. 1:14]]). Then the king gives him the signet ring he had taken back from Haman. The ring sealed royal edicts and gave them the force of law, so this act made Mordecai the king's first minister, in the place Haman had held. The ring's meaning is explained at [[Esth. 3:12]] and at Pharaoh's gift to Joseph ([[Gen. 41:42]]); what matters here is that the same seal that made Haman's decree law is now in Mordecai's hand, and he will need it (verses 8–10).
    sources: [keil-esther, lds-scriptures]

  - ref: 8
    phrase: may no man reverse
    kind: history
    title: A decree no one can reverse
    body: |
      The king cannot grant what Esther asked, the cancelling of Haman's letters, because a document written in his name and sealed with his ring could not be revoked. It is the rule that made Vashti's removal final ([[Esth. 1:19]]) and that held Darius to his own decree ([[Dan. 6:7–9]]): the law of the Medes and Persians, explained in the note on [[Dan. 6:8]], under which a king's sealed word bound the king himself. That is why Esther has to fall at his feet a second time (verse 3) though Haman is dead: his letters had gone to every province, and they still stood ([[Esth. 3:12–13]]).

      What the king can do is hand over the ring again. With it he had once told Haman to do with the Jews “as it seemeth good to thee” ([[Esth. 3:10–11]]); now he tells Esther and Mordecai to write “as it liketh you,” in his name, under his seal. The way out is not a repeal but a counter-decree. Haman's edict stays in the law, and beside it, for the same day (verse 12), stands a second one that lets the Jews defend themselves when that day comes.
    sources: [scripture-helps-esther, lds-scriptures]

  - ref: 9
    phrase: and to the Jews according to their writing, and according to their language
    kind: history
    title: Letters to the Jews themselves
    body: |
      Mordecai's letters name a reader Haman's did not: the Jews. The footnote at verse 10 points back to Haman's letters ([[Esth. 3:12–13]]), and the two go out the same way, by the king's scribes, in the king's name, under the king's ring, to every province in its own script and every people in its own language. But Haman's were addressed to the king's lieutenants, governors and rulers ([[Esth. 3:12]]), with a copy published so that the peoples “should be ready against that day” ([[Esth. 3:14]]). Mordecai's go to the same officials and, named apart from them, “to the Jews according to their writing, and according to their language.”

      The text gives the reason in its own words: the copy was published so “that the Jews should be ready against that day” (verse 13). The people the first decree was about are the people the second is written to.
    sources: [lds-scriptures]

  - ref: 10
    phrase: riders on mules, camels, and young dromedaries
    kind: words
    title: The king's swift horses
    body: |
      The King James list of mules, camels and dromedaries renders rare words, and together they describe horses. The first is a collective noun, steeds. The second, which returns in verse 14, is probably an adjective, “royal,” from the Persian *khshatra*, lordship or realm; the lexicon marks the part of speech with a question. The third is a foreign word of uncertain meaning, related to words for a herd; the phrase is usually taken as “sons of the (royal) mares.” Modern translations read the verse that way: couriers “who rode fast horses especially bred for the king,” or “swift horses that were used in the king's service, bred from the royal stud.”

      The point is speed. In verse 14 the couriers on the royal horses go out “being hastened and pressed on by the king's commandment.”
    sources: [bdb, niv, esv]

  - ref: 11
    phrase: all the power of the people and province that would assault them, both little ones and women
    kind: words
    title: Whose little ones and women?
    body: |
      The second decree echoes the first almost word for word. Haman's letters had ordered that all Jews be destroyed, killed and made to perish, “both young and old, little children and women,” and their goods taken as plunder ([[Esth. 3:13]]; see the note on the three verbs there). The footnote at verse 12 points back to that verse, and Mordecai's letters use the same three verbs, name little ones and women, grant plunder and fix the same day. What changes is whom the verbs fall on. The Jews are to “stand for their life,” to defend their lives, against “all the power” of any people or province “that would assault them”; the Hebrew word for “power” here is used of an armed force, an army, and the verb behind “assault” means to show hostility to or treat as a foe.

      Where “both little ones and women” belongs is a real question of grammar, and the translations divide on it. The Hebrew lists the words right after “them,” the Jews under attack, without saying whose women and children they are. Two modern translations take them as the Jews' own families, attacked with them: those “who might attack them and their women and children,” or who “might attack them, their children, and their women.” A third seems to set them with the attacking force: “any armed force of any people or province that might attack them, children and women included.” The grammar is left open; what the text makes plain is the decree's frame, that the Jews were to “stand for their life.”

      What the Jews actually did is told in chapter 9, and there the counts in Shushan are of men ([[Esth. 9:6]]; [[Esth. 9:15]]). The permission to plunder, which verse 11 grants as Haman's decree had, is the subject of chapter 9 too, where the Jews three times decline it.
    sources: [oshb-wlc, bdb, niv, esv, nrsvue, lds-scriptures]

  - ref: 15
    phrase: royal apparel of blue and white, and with a great crown of gold
    kind: symbol
    title: Mordecai's robes of office
    body: |
      Mordecai's new clothes show his new rank. He leaves the king in royal apparel of blue and white, colors that hung in the palace court at the king's feast ([[Esth. 1:6]]), with a great gold crown and a wide mantle of fine linen and purple. This is not the apparel of chapter 6, the robe “which the king useth to wear” ([[Esth. 6:8]]), in which Haman led him through the city for a day ([[Esth. 6:11–12]]). These garments are most likely the state dress of the first minister, received when he was installed in the office, as Joseph was “arrayed… in vestures of fine linen” when Pharaoh gave him his ring and set him over Egypt ([[Gen. 41:42]]). Anyone who saw Mordecai come out of the palace dressed so could see that he now held Haman's place.

      The city's response is the reverse of the earlier news. When Haman's decree reached the provinces there was “great mourning among the Jews, and fasting, and weeping, and wailing” ([[Esth. 4:3]]), and Mordecai himself had worn sackcloth ([[Esth. 4:1]]). Now Shushan rejoices, and the Jews have “light, and gladness, and joy, and honour” (verse 16), light being a figure for prosperity. In every province the decree brings “a feast and a good day” (verse 17), words that return in chapter 9 for the days of Purim ([[Esth. 9:19]]).
    sources: [keil-esther, lds-scriptures]

  - ref: 17
    phrase: many of the people of the land became Jews
    kind: words
    title: Many became Jews
    body: |
      “Became Jews” is a single Hebrew verb made from the word “Jew,” to become a Jew, and the lexicon finds it in this verse alone. The text gives one reason: “for the fear of the Jews fell upon them.” It does not say what becoming Jews involved for these people, whether it meant a change of worship or of allegiance, or how long it lasted, and no more can be claimed for it than the text gives. The same fear returns on the day itself, when “no man could withstand them; for the fear of them fell upon all people” ([[Esth. 9:2]]).
    sources: [bdb, oshb-wlc, lds-scriptures]

christ: |
  The Jews who had lain “in sackcloth and ashes” when the first decree came ([[Esth. 4:3]]) had “light, and gladness, and joy” when the second came, though the first was never revoked. Isaiah 61, the passage Jesus read in Nazareth and declared fulfilled in Himself ([[Luke 4:16–21]]), goes on to say that the Anointed One is sent “to comfort all that mourn” and to give “beauty for ashes, the oil of joy for mourning” ([[Isa. 61:1–3]]). Sorrow a disciple cannot undo is not the end of the account, for “weeping may endure for a night, but joy cometh in the morning” ([[Ps. 30:5]]).

explore: |
  - [[Esth. 3:12–15]] beside [[Esth. 8:9–14]]: Haman's decree and Mordecai's, clause by clause.
  - [[Dan. 6:8]]: the law of the Medes and Persians, which bound the king who made it.
  - [[Esth. 9:1–2]]: the day the two decrees named, “turned to the contrary.”

sources: [lds-scriptures, bible-chron-ot, scripture-helps-esther, keil-esther, bdb, niv, esv, nrsvue, oshb-wlc]
