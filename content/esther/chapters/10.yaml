chapter: 10
title: Next unto the King
tagline: The book closes on the king's power and on Mordecai, raised second in the empire and using his place to seek the good of his people.
when: 'Undated: a closing word on Ahasuerus and Mordecai''s greatness.'

setting: |
  Chapter 10 is three verses, the close of the book's last part (chapters 9–10), in which the Jews, given authority by the king's second decree, stood against their enemies and then fixed the Feast of Purim for every year. Chapter 9 ended with letters: Mordecai's, sent to all the Jews in the king's 127 provinces, and Esther's decree confirming them, which “was written in the book” ([[Esth. 9:29–32]]).

  Mordecai's rise had been building for several chapters. He sat at the king's gate ([[Esth. 2:19]]) and mourned in sackcloth before it ([[Esth. 4:1–2]]); he was led through the city in the king's own robe ([[Esth. 6:11]]), given the ring taken from Haman ([[Esth. 8:2]]) and royal apparel ([[Esth. 8:15]]); and “this man Mordecai waxed greater and greater” ([[Esth. 9:4]]). This chapter says where that rise ended. The king is still Ahasuerus (Xerxes); see [Persia and the Return](/old-testament/guides/persia-and-the-return/#rulers).

thread: |
  The book ends where it began, with the might of Ahasuerus. It opened on “the riches of his glorious kingdom and the honour of his excellent majesty” ([[Esth. 1:4]]), and it closes on a levy laid across his empire and “all the acts of his power and of his might” (verses 1–2). But the last word is not the king's. The verses move from his power to the record that holds it, and from the record to Mordecai, the man who had mourned in sackcloth before the king's gate and now stands second in the empire. That is the reversal of fortunes the whole book has told, Haman executed and Mordecai honored, stated in its final form.

  The final verse then says what Mordecai's greatness was for: he sought the good of his people and spoke peace to them all. A story that began with a king's display of glory ends with a Jew's rank spent on the welfare of others.

sections:
  - range: 1-2
    heading: The king's power and the record
    plain: |
      King Ahasuerus imposed a levy on the whole land and on the islands and coasts of the sea. All the deeds of his power and might, and a full account of the greatness to which the king raised Mordecai, are written in the official chronicles of the kings of Media and Persia.
  - range: 3-3
    heading: Mordecai, second to the king
    plain: |
      For Mordecai the Jew was second in rank to King Ahasuerus, great among the Jews, and well regarded by the great number of his fellow Jews. He worked for the good of his people and spoke for the peace and welfare of all his nation.

notes:
  - ref: 1
    phrase: laid a tribute upon the land, and upon the isles of the sea
    kind: words
    title: A levy on land and sea
    body: |
      The book's last chapter opens with a tax, and the Hebrew word for it is an unusual one. *Mas*, “tribute,” elsewhere names a levy of people rather than of money: a body of forced laborers, such as the labor bands Solomon raised from Israel, the gangs over which “taskmasters” were set in Egypt ([[Ex. 1:11]]), or a people put to forced work. Only here, of Ahasuerus, does it mean forced service laid on a realm, or possibly, in this late book, tribute in the sense of enforced payment. The two senses lie close together, since the provinces paid their imposts largely in produce, the fruit of their fields and herds, so that their labor was itself a kind of service to the king.

      Why the book should end on a tax is a fair question, and the text gives no reason. The verse “seems extraneous” to a story about the origin of Purim; one reading explains it as drawn from the Persian chronicle the next verse names: the book opened with the king's splendor (chapter 1), and its close tells briefly where the means for that splendor came from. That is a reading, not something the verse states; what the text itself does is set the king's reach, over land and sea, beside the greatness of Mordecai in the next breath.
    sources: [bdb, keil-esther]

  - ref: 2
    phrase: are they not written in the book of the chronicles of the kings of Media and Persia
    kind: history
    title: Written in the chronicles of Media and Persia
    body: |
      The closing question is the formula with which the books of Kings close a reign: the rest of a king's acts, “are they not written in the book of the chronicles of the kings of Israel?” The footnote points there ([[1 Kgs. 14:19]]; see the note on the chronicles there), and to the account kept at David's court ([[1 Chr. 27:24]]). The narrator of Esther ends his book the way Israel's historians ended a reign, by sending the reader to the royal record for the rest.

      The record named here is the Persian court's official record of events in the empire, and in this book it is not a mere archive: it has driven the plot. Mordecai's warning of the plot against the king was written in it ([[Esth. 2:23]]); it was read to the sleepless king, and so Mordecai was honored ([[Esth. 6:1–3]]; see [[Esth. 6:1]]); and “the book” in which Esther's decree confirming Purim was written ([[Esth. 9:32]]) is most likely the same chronicle. The record that once held Mordecai's forgotten service now holds “the declaration of the greatness of Mordecai” as well.
    sources: [lds-scriptures, scripture-helps-esther, breitenstein-esther-minute]

  - ref: 3
    phrase: Mordecai the Jew was next unto king Ahasuerus
    kind: scripture
    title: Second to the king, as Joseph and Daniel were
    body: |
      “Next unto” the king means second in rank: Mordecai had become the king's chief minister. The Hebrew *mishneh* is “second”: it is the word for the “second chariot” Joseph rode in Egypt ([[Gen. 41:43]]) and for the man “next to the king” in Judah ([[2 Chr. 28:7]]).

      The footnotes set Mordecai beside Joseph, to whom Pharaoh said “only in the throne will I be greater than thou” ([[Gen. 41:40]]), and beside Daniel and the three Hebrews, raised in the courts of Darius and Nebuchadnezzar ([[Dan. 6:3]]; [[Dan. 3:30]]). The footnote at Mordecai's charge to Esther, “who knoweth whether thou art come to the kingdom for such a time as this?”, also points to Joseph's own reading of his rise: God sent him before his brothers “to preserve you a posterity in the earth” ([[Esth. 4:14]]; [[Gen. 45:7]]). For the Jews of the empire, Mordecai's rank was no private honor: having him near the king relieved them of much oppression and gave them a favorable place in the empire, a judgment the verse's own close bears out (next note).
    sources: [bdb, lds-scriptures, ot-manual-31]

  - ref: 3
    phrase: seeking the wealth of his people, and speaking peace to all his seed
    kind: words
    title: Seeking the good of his people
    body: |
      The King James “wealth” does not mean riches. Its older first sense was prosperity, well-being, and the Hebrew behind it is *tov*, “good,” here in the sense of welfare and happiness: Mordecai was seeking the good of his people.

      “All his seed” likewise is not Mordecai's children or descendants. In this verse “seed” stands in parallel with “his people” and means his nation, those of the same blood. So the line describes a public office, not a family's fortune: the second man in the empire used his place to work for the welfare of the Jews and to speak for the peace of all of them. It is the book's last word on him, and it puts his greatness in what he did with it.
    sources: [webster-1828, bdb]

christ: |
  Mordecai's greatness ends in service: the man raised next to the king spends his rank “seeking the wealth of his people.” The Savior made that the rule of greatness in His kingdom, “whosoever will be great among you, let him be your minister,” and set Himself as its pattern: “the Son of man came not to be ministered unto, but to minister, and to give his life a ransom for many” ([[Matt. 20:26–28]]). Whatever place or influence a disciple is given is held for the good of others, and “when ye are in the service of your fellow beings ye are only in the service of your God” ([[Mosiah 2:17]]).

explore: |
  - [[Gen. 45:5–8]]: Joseph's own reading of his rise at Pharaoh's court, sent ahead “to preserve you a posterity in the earth.”
  - [[Dan. 6:1–3]]: Daniel set over the princes of the Persian king.
  - [[Esth. 9:20–32]]: the letters of Mordecai and Esther that fixed Purim, “written in the book.”

sources: [lds-scriptures, scripture-helps-esther, keil-esther, bdb, breitenstein-esther-minute, ot-manual-31, webster-1828]
