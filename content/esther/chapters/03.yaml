chapter: 3
title: 'Mordecai Bows Not, and Haman’s Decree'
tagline: Haman the Agagite is raised above the princes, and every servant at the gate bows to him but Mordecai. Haman casts the lot for a day, buys the king’s consent, and sends a decree sealed with the king’s ring to destroy every Jew in the empire.
when: 'The first month (Nisan) of the twelfth year of Ahasuerus, about 474 B.C. (verse 7); the decree is for the thirteenth day of Adar, eleven months later (verse 13).'

setting: |
  Chapter 3 opens the second part of the book, which the Church’s *Scripture Helps* outlines as chapters 3–5: Haman’s plan to destroy the Jews, Esther’s risk in going to the king, and her first banquet. Its date is the first month of the king’s twelfth year (verse 7). Counting from 486 B.C., when Ahasuerus (Xerxes) came to the throne, that is about 474 B.C. It is more than four years after Esther was made queen in the tenth month of the seventh year ([[Esth. 2:16–17]]). The Persian background is in [Persia and the Return](/old-testament/guides/persia-and-the-return/#rulers).

  Two things from chapter 2 stand behind this one. Esther has not made known her people ([[Esth. 2:20]]), so no one at court knows that the queen is a Jew. And Mordecai, who sits in the king’s gate, has saved the king’s life by exposing two of his chamberlains; the deed was written in the book of the chronicles ([[Esth. 2:21–23]]), but it is Haman, not Mordecai, whom the king now promotes.

  Haman is new to the story. He arrives with his whole descent attached, “the son of Hammedatha the Agagite,” and from verse 10 on the narrator gives him a title of his own, “the Jews’ enemy” (verse 10; [[Esth. 8:1]]). Everything this chapter sets in motion is answered later in the book: the king’s ring, the letters sent by post, and the day in Adar all come back in chapters 8 and 9.

thread: |
  The chapter moves from one man’s refusal to a whole people’s sentence. Mordecai will not bow to Haman (verse 2); within four verses Haman has decided that killing Mordecai alone is beneath him, and by the end of the chapter a decree to destroy “all Jews, both young and old, little children and women, in one day” is on its way to every province (verse 13). Each step makes the danger larger and harder to undo. Haman’s anger becomes a plan (verse 6), the lot fixes a date (verse 7), an accusation against a people he never names and an offer of silver win the king’s consent (verses 8–11), and the king’s ring turns the plan into law, written in the king’s name and sealed (verses 10–12).

  That last step is what the rest of the book has to answer. A writing “sealed with the king’s ring, may no man reverse” ([[Esth. 8:8]]), so the decree of this chapter is never cancelled. Instead, the same ring passes to Mordecai ([[Esth. 8:2]]) and seals a second decree for the same day ([[Esth. 8:10–12]]). The chapter ends with the two sides of the empire’s capital set against each other: the king and Haman sit down to drink, and the city is in confusion (verse 15).

sections:
  - range: 1-6
    heading: Haman exalted, Mordecai unbowed
    plain: |
      After these things King Ahasuerus promoted Haman, the son of Hammedatha the Agagite. He raised him and set his seat above all the officials who were with him. All the king’s servants at the king’s gate bowed and did reverence to Haman, because the king had commanded it. But Mordecai would not bow or do him reverence.

      The king’s servants at the gate said to Mordecai, Why do you disobey the king’s command? They said it to him day after day, and he would not listen. So they told Haman, to see whether Mordecai’s words would stand, for he had told them that he was a Jew. When Haman saw for himself that Mordecai did not bow or do him reverence, he was filled with rage. But he scorned to lay hands on Mordecai alone. They had told him who Mordecai’s people were, so Haman set out to destroy all the Jews throughout the whole kingdom of Ahasuerus, the people of Mordecai.
  - range: 7-11
    heading: The lot and the bargain
    plain: |
      In the first month, the month Nisan, in the twelfth year of King Ahasuerus, they cast Pur, that is, the lot, in Haman’s presence, day by day and month by month, and it fell on the twelfth month, the month Adar.

      Then Haman said to King Ahasuerus, There is a certain people scattered and dispersed among the peoples in all the provinces of your kingdom. Their laws are different from every other people’s, and they do not keep the king’s laws, so it is not in the king’s interest to tolerate them. If it please the king, let a decree be written for their destruction, and I will weigh out ten thousand talents of silver into the hands of the officials in charge, to bring into the king’s treasuries.

      The king took his ring from his hand and gave it to Haman, the son of Hammedatha the Agagite, the enemy of the Jews. And the king said to Haman, The silver is yours, and the people too: do with them whatever you think best.
  - range: 12-15
    heading: The decree sealed and sent
    plain: |
      On the thirteenth day of the first month the king’s scribes were summoned, and everything Haman ordered was written to the king’s lieutenants, to the governors over every province, and to the rulers of every people, to each province in its own writing and to each people in its own language. It was written in the name of King Ahasuerus and sealed with the king’s ring.

      Letters were sent by couriers to all the king’s provinces, ordering that all Jews, young and old, little children and women, be destroyed, killed and wiped out in one day, the thirteenth day of the twelfth month, the month Adar, and that their goods be taken as plunder. A copy of the writing was to be issued as law in every province and proclaimed to all the peoples, so that they would be ready for that day.

      The couriers went out in haste at the king’s command, and the decree was issued in Shushan the palace. The king and Haman sat down to drink, but the city of Shushan was thrown into confusion.

notes:
  - ref: 1
    phrase: Haman the son of Hammedatha the Agagite
    kind: history
    title: Haman the Agagite
    body: |
      The name “Agagite” most likely makes Haman a descendant of Agag, the king of the Amalekites whom Saul spared and Samuel put to death ([[1 Sam. 15:8–9]]; [[1 Sam. 15:32–33]]). The Church’s footnote on “Hammedatha” points to that chapter, and the descent is likely rather than certain. “Agag” was perhaps a title, like Pharaoh among the Egyptians.

      Either way the name carries a long history: the Amalekites were at war with the Hebrews from Moses’ time until Saul and David broke their power. That history, and why the Lord commanded Amalek remembered, are explained at [[Ex. 17:14]], [[Deut. 25:17]] and [[1 Sam. 15:33]].

      What matters for Esther is who faces Haman. Mordecai is “the son of Jair, the son of Shimei, the son of Kish, a Benjamite” ([[Esth. 2:5]]), and Saul too was a Benjamite, the son of Kish ([[1 Sam. 9:1–2]]). So the story likely sets a descendant of Agag against a Benjamite of Kish’s line, as Agag once faced Saul. The book’s giving of both men’s lineage may be meant to help explain the hostility between them and Haman’s resolve to have the Jews killed; the text itself does not say so. The note at [[Esth. 2:5]] takes up Mordecai’s line.
    sources: [scripture-helps-esther, bd-agag, bd-amalek, lds-scriptures]

  - ref: 2
    phrase: But Mordecai bowed not, nor did him reverence
    kind: history
    title: Why Mordecai would not bow
    body: |
      The only reason the text gives comes in verse 4: “he had told them that he was a Jew.” The servants who reported him to Haman wanted to see “whether Mordecai’s matters would stand,” or in a modern rendering “whether Mordecai’s words would stand.” The text never says why being a Jew led Mordecai to refuse the bow, and bowing in itself was no offense to Israel’s law: bowing to a political superior was not forbidden under the law of Moses, and Abraham “bowed himself to the people of the land” ([[Gen. 23:7]]).

      The gesture expressed a relationship of submission. To bow to Haman was to acknowledge his rank, so Mordecai’s refusal was a refusal to recognize Haman’s status and position, before all the king’s servants at the gate who had been commanded to bow. Why he would not grant Haman that may lie in Haman’s descent: the Agagite was an Amalekite, of Israel’s long-standing enemies, and the refusal (and Haman’s answer) may have grown from that old hostility. An older reading supposed instead that Haman “was demanding not mere allegiance but worship,” so that Mordecai “would not break the first commandment.” The text does not say Haman asked for worship, and that reading is a supposition.

      Haman’s answer reaches past the man to his people. He “thought scorn to lay hands on Mordecai alone,” because “they had shewed him the people of Mordecai” (verse 6). The verse names Mordecai’s people twice, and from here on Haman’s quarrel is with the people, not with the man.
    sources: [scripture-helps-esther, lane-worship, esv, ot-manual-31, lds-scriptures]

  - ref: 7
    phrase: they cast Pur, that is, the lot
    kind: words
    title: Pur, the lot, and a day eleven months away
    body: |
      *Pur* is the Persian word for “lot,” and the narrator translates it at once with the ordinary Hebrew word for a lot, *goral*. Akkadian has the same word, *pūru*, for a lot and for the dice used to cast it. The foreign word matters because the book names a feast after it: “they called these days Purim after the name of Pur” ([[Esth. 9:26]]).

      Israel cast lots too, to make a choice, as in dividing the land ([[Num. 26:55]]), and a proverb expresses a feeling about the Lord’s hand in the matter: “The lot is cast into the lap; but the whole disposing thereof is of the LORD” ([[Prov. 16:33]]). Here, though, the lot is cast “before Haman,” to choose the day on which the Jews would be killed. It was cast for the day and then for the month, “from day to day, and from month to month,” and it fell on the twelfth month, Adar (verse 13 gives the thirteenth day).

      That is the detail a reader should notice: the lot was cast in the first month and fell on the last. The decree was sent out at once (verse 12), so nearly eleven months stood between its publication and the day it named, and the distant day left Esther and Mordecai time to save the people. One reading goes further and finds “the providence of God overruling the event” unmistakable, both in Haman’s haste and in the lot falling on so distant a day. The book itself says nothing of who governed the lot; that is a reading of the story’s turns, and the book’s own verdict on the day comes in chapter 9, where it was “turned to the contrary” ([[Esth. 9:1]]).
    sources: [hull-true-decision, bdb, scripture-helps-esther, bd-lots-casting-of, ot-manual-31, keil-esther, lds-scriptures]

  - ref: 8
    phrase: There is a certain people scattered abroad and dispersed among the people
    kind: history
    title: Haman’s case against “a certain people”
    body: |
      Haman builds his case in steps. The people are scattered and dispersed through every province; their laws differ from everyone else’s; they do not keep the king’s laws; so it does not profit the king to let them be. One reading calls the proposal “very subtilly calculated”: it casts suspicion on the Jews as a people dwelling apart, and therefore unsociable, and as refractory, and therefore dangerous to the state. He never names the people, and the king never asks who they are. By the end of the chapter the king has handed over a nation he has not identified, and he will learn in chapter 7 that it is his own queen’s ([[Esth. 7:3–6]]).

      The offer in verse 9 sweetens the case. On that reading the ten thousand talents of silver, a very considerable sum, were to come from the property of those killed, so that the destruction would pay the king. The king’s answer, “The silver is given to thee, the people also” (verse 11), reads as a refusal of the money, and the same reading takes it as the king waving the payment away so as not to seem bought. But when Esther pleads for her people she says, “we are sold, I and my people” ([[Esth. 7:4]]), and the Church’s footnote on “pay” in verse 9 points to that verse. Whether silver changed hands or not, she calls the decree a sale.
    sources: [keil-esther, lds-scriptures]

  - ref: 12
    phrase: sealed with the king’s ring
    kind: history
    title: Written in the king’s name and sealed
    body: |
      The king’s signet ring was his authority in a form that could be handed over. When Ahasuerus “took his ring from his hand, and gave it unto Haman” (verse 10), he gave him the power to issue law in the king’s name; the same mark of office is explained at Pharaoh’s gift to Joseph ([[Gen. 41:42]]). Haman uses it at once: on the thirteenth day of the first month the decree is written “in the name of king Ahasuerus,” sealed with the ring, translated into every script and language of the empire, and sent out by post.

      The seal is what makes the decree so dangerous. When Esther later asks the king to reverse Haman’s letters, he answers that “the writing which is written in the king’s name, and sealed with the king’s ring, may no man reverse” ([[Esth. 8:8]]). The note at [[Dan. 6:8]] takes up that rule, the law of the Medes and Persians. Once the ring had sealed this decree, it stood: the king himself, when Esther pleads, does not recall it but allows a second writing.

      So the book answers the ring with the ring. The footnote on “ring” in verse 10 points to [[Esth. 8:2]], where the king takes back the ring he had given Haman and gives it to Mordecai, and with it Mordecai seals a second decree, written in the same king’s name, for the same thirteenth day of Adar ([[Esth. 8:10–12]]). That second decree is the subject of chapter 8.
    sources: [lds-scriptures]

  - ref: 13
    phrase: to destroy, to kill, and to cause to perish
    kind: words
    title: Three verbs for one day
    body: |
      The decree does not say simply “kill.” It heaps up three verbs, destroy, kill, cause to perish, and then spells out who is included: “all Jews, both young and old, little children and women, in one day,” and their goods were to be taken “for a prey.” Every Jew in every province was to die on the same day, and every people in the empire was told to be “ready against that day” (verse 14).

      The three verbs are not used only here. Esther repeats them to the king when she finally names the danger, “to be destroyed, to be slain, and to perish” ([[Esth. 7:4]]), and the second decree turns them back, in the same order, against “all the power of the people and province that would assault” the Jews ([[Esth. 8:11]]), for the same day ([[Esth. 8:12]]). The plunder returns too: three times chapter 9 records that the Jews, though permitted to take it, “laid they not their hand” on the spoil ([[Esth. 9:10]]; [[Esth. 9:15–16]]). What the second decree allowed and what the Jews did with it are taken up in chapters 8 and 9.
    sources: [lds-scriptures]

  - ref: 15
    phrase: the city Shushan was perplexed
    kind: words
    title: The king drinks; the city is in confusion
    body: |
      The chapter ends on a contrast. In the palace, “the king and Haman sat down to drink”; in the city, Shushan “was perplexed.” The Hebrew verb means to be confused or in confusion, and here it is said of a whole city; a modern translation renders it “thrown into confusion.” The capital where the decree was given did not receive it calmly, and one reading takes the verse to imply that not everyone in Susa shared Haman’s hatred of the Jews.

      The two men who set the slaughter in motion sit down together over wine as the couriers ride out. The next chapter begins with Mordecai in sackcloth in the city, and then “great mourning among the Jews” in every province ([[Esth. 4:1–3]]).
    sources: [bdb, oshb-wlc, esv, breitenstein-esther-minute]

christ: |
  The chapter never names the Lord, but the people Haman’s decree marks for death are the covenant people of Jehovah, who is the premortal Jesus Christ. Beside the word “kill” in verse 13, the Church’s footnote sets His own word about those who persecute His Saints: “Wo unto all those that discomfort my people, and drive, and murder, and testify against them, saith the Lord of Hosts” ([[D&C 121:23]]), and the next verse adds, “mine eyes see and know all their works” ([[D&C 121:24]]). A disciple who faces a hostile decision, made by people who have not even asked whom they are condemning, is not unseen: the Lord says of those who discomfort His people that His eyes see and know all their works.

explore: |
  - [[Ex. 17:8–16]] and [[1 Sam. 15]]: Amalek’s first attack on Israel, and Saul, the Benjamite son of Kish, sparing Agag.
  - [[Esth. 8:1–14]]: the ring given to Mordecai and the second decree, sealed for the same day.
  - [[Esth. 9:20–28]]: how the lot of verse 7 gave Purim its name.
  - [[Dan. 6:8]]: the law of the Medes and Persians, which could not be changed, and the note there on it.
  - [[D&C 121:1–25]]: the Lord’s answer to Joseph Smith in Liberty Jail on the suffering of His people, whose verse 23 the footnote to verse 13 cites.

