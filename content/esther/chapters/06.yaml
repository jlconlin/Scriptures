chapter: 6
title: The Night the King Could Not Sleep
tagline: A sleepless king hears the record of how Mordecai saved his life, and Haman, who came to ask for Mordecai's death, must lead him through the city in the king's own robe.
when: 'The night after Esther''s first banquet and the next day (5:8; 6:14), about 474 B.C.'

setting: |
  Chapter 5 ended with two plans laid for the same next day. Esther had invited the king and Haman to a second banquet, where she would make her request ([[Esth. 5:8]]). Haman, glad of the invitation but galled by Mordecai at the gate, had taken the advice of his wife and friends: build a gallows fifty cubits high, “and to morrow speak thou unto the king that Mordecai may be hanged thereon” ([[Esth. 5:14]]). The decree to destroy the Jews still stood for the thirteenth of Adar, months away.

  Chapter 6 is the night between, and the morning. It opens the third part of the book, chapters 6–8, in which Haman's plot is exposed, Haman is hanged, Mordecai is honored, and the edict against the Jews is answered. Everything in it hangs on an old debt: years before, Mordecai had uncovered a plot by two of the king's doorkeepers to kill him, and the affair “was written in the book of the chronicles before the king” ([[Esth. 2:21–23]]). The king is still Ahasuerus (Xerxes), in the twelfth year of his reign; see [Persia and the Return](/old-testament/guides/persia-and-the-return/#rulers).

thread: |
  This is the night the story turns. Up to now Haman has driven events; from here every move goes against him, and neither Esther nor Mordecai does anything to bring the turn about. A king cannot sleep, a servant reads from the right page of the record, and a man arrives at the door at the moment he is least wanted. The Hebrew names no cause for any of it, though the Lord's influence is implied in the king's choice of reading.

  The turn is told as an exact reversal. Haman comes to ask for Mordecai's death and is asked instead how to honor a man; he describes the honor he wants for himself and must give it, word for word, to Mordecai, so that he does for Mordecai what he hoped would be done for him and never speaks the request he came to make. Then his wise men and his wife, who with his friends had counselled the gallows, tell him he has “begun to fall” (verse 13). The chapter ends with Haman hurried off to the banquet where the rest of the fall waits ([[Esth. 7:1–10]]).

sections:
  - range: 1-3
    heading: The book read in the night
    plain: |
      That night the king could not sleep, so he ordered the book of records, the chronicles, to be brought, and it was read to him. In it was the account of how Mordecai had reported Bigthana and Teresh, two of the king's chamberlains who guarded the door, when they plotted to kill King Ahasuerus. The king asked: What honor or recognition has Mordecai been given for this? The servants who attended him said: Nothing has been done for him.
  - range: 4-9
    heading: Haman's advice
    plain: |
      The king said: Who is in the court? Haman had just come into the outer court of the palace to ask the king to hang Mordecai on the gallows he had built for him. The servants said: Haman is standing in the court. The king said: Let him come in. When Haman came in, the king asked him: What should be done for the man the king wants to honor? Haman thought to himself: Whom would the king want to honor more than me? So he answered: For the man the king wants to honor, have them bring a royal robe the king himself has worn, and the horse the king has ridden, with a royal crown set on its head. Let the robe and the horse be handed to one of the king's highest nobles, and let him dress the man the king wants to honor, lead him on horseback through the streets of the city, and call out before him: This is what is done for the man the king wants to honor.
  - range: 10-11
    heading: Mordecai in the street
    plain: |
      The king said to Haman: Hurry. Take the robe and the horse, as you have said, and do just that for Mordecai the Jew, who sits at the king's gate. Leave out nothing you have described. So Haman took the robe and the horse, dressed Mordecai, led him on horseback through the streets of the city, and called out before him: This is what is done for the man the king wants to honor.
  - range: 12-14
    heading: Haman's house
    plain: |
      Then Mordecai went back to the king's gate. But Haman hurried home in mourning, with his head covered. He told his wife Zeresh and all his friends everything that had happened to him. His advisers and his wife Zeresh said to him: If Mordecai, before whom you have begun to fall, is of Jewish descent, you will not overcome him; you will surely fall before him. While they were still talking with him, the king's chamberlains arrived and hurried Haman off to the banquet Esther had prepared.

notes:
  - ref: 1
    phrase: On that night could not the king sleep
    kind: history
    title: The night the king could not sleep
    body: |
      The chapter turns on a king's sleepless night, and the Hebrew text gives no cause for it. It is the night between Esther's two banquets, after Haman had the gallows made ([[Esth. 5:8]]; [[Esth. 5:14]]). The king has the official record of the empire read aloud, and the reading reaches a service done a few years before: Mordecai's warning of the plot against the king's life ([[Esth. 2:21–23]]). The king learns that nothing was ever done for Mordecai.

      The Lord's hand is implied rather than stated: His influence led the king to this part of the record, and so to Mordecai. The Greek translation says outright what the Hebrew leaves unsaid. It opens the chapter, “But the Lord removed sleep from the king that night,” and in verse 13 it gives Haman's counsellors a reason, “for the living God is with him.” The book as it stands in the King James Bible, translated from the Hebrew, keeps the silence and lets the timing carry the meaning.

      The timing matters for what comes next: the night falls between the banquets, before Esther names her enemy (see the note on [[Esth. 5:8]]).
    sources: [scripture-helps-esther, lxx-rahlfs]

  - ref: 8
    phrase: the crown royal which is set upon his head
    kind: words
    title: The king’s own robe, horse and crown
    body: |
      Haman asks for the king's own things, not for ordinary marks of favor. The King James “which the king useth to wear” sounds like a kind of robe; the Hebrew describes a robe “the king has worn,” one that had been on the king's own body. That was not an ordinary robe of state but the sovereign's personal garment, the highest honor a subject could be shown. The horse is likewise one “the king has ridden.”

      The last clause is ambiguous in English: “his head” could be the king's or the honored man's. Most older interpreters took it of the man, so that Haman would be asking for a crown on his own head. The Hebrew is better read of the horse, as the NIV and ESV render it: a horse the king has ridden, “one with a royal crest placed on its head.” No classical writer describes such an ornament, but certain Assyrian and ancient Persian sculptures seem to show three-pointed ornaments on the heads of the king's horses, and apparently of princes' horses. These may be a kind of crown, which would fit that reading.
    sources: [keil-esther, niv, esv, biblehub-interlinear]

  - ref: 10
    phrase: do even so to Mordecai the Jew
    kind: history
    title: Honor for Mordecai the Jew
    body: |
      The king names the man to be honored as “Mordecai the Jew,” while the decree sealed with his own ring, to destroy “all Jews, both young and old,” still stands ([[Esth. 3:10–13]]). The text does not say how the king learned who Mordecai was, or whether he remembered which people he had given over to Haman; it lets the two facts stand side by side until Esther joins them at the second banquet ([[Esth. 7:3–6]]).

      For Haman there is no way out. The king holds him to every word of his own proposal, “let nothing fail of all that thou hast spoken,” and Haman, who had wanted the honor for himself, is made to give it to the Jew he hated, with his own mouth proclaiming the words he had chosen for himself (verse 11).
    sources: [lds-scriptures]

  - ref: 13
    phrase: thou shalt not prevail against him, but shalt surely fall before him
    kind: history
    title: What Haman’s own house foresaw
    body: |
      The verdict on Haman's fortunes comes from his own household. He comes home in mourning with his head covered (verse 12; on the covered head, see the note at [[2 Sam. 15:30]]) and tells Zeresh and his friends everything. Zeresh, who with those friends had told him the night before to build the gallows ([[Esth. 5:14]]), now joins his wise men in telling him that if Mordecai is “of the seed of the Jews,” Haman will not prevail against him but will surely fall. The Hebrew gives no reason why Mordecai's people should decide it (the Greek translation supplies one; see the note on verse 1). These advisers perhaps saw the divine protection the Hebrews had often received.

      They have no time to say more. While they are still talking, the king's chamberlains arrive to hurry Haman to Esther's banquet (verse 14), where he would meet the fate he had unwittingly prepared for himself.
    sources: [breitenstein-esther-minute, lds-scriptures]

christ: |
  God is never named in this chapter, yet His influence is implied in a sleepless night and in the page of the record the king heard: a service done years before and never rewarded. Service that others overlook is not lost to the Lord, and He can bring it to light at the hour it matters. The chapter shows the other side as well. Haman's pride, which had built a gallows for one man, brings him to give the honor he wanted for himself to the man he hated; pride and anger lead toward a fall, and the fall begins here.

explore: |
  - [[Esth. 2:21–23]]: the service recorded in the chronicles and forgotten until this night.
  - [[Gen. 41:43]]: Joseph honored by Pharaoh, carried in the second chariot with a cry before him, “Bow the knee.”
  - [[Esth. 5:9–14]]: Haman's joy, his anger at Mordecai, and the gallows built the night before.

