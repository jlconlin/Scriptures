chapter: 4
title: For Such a Time as This
tagline: Mordecai mourns in sackcloth at the king’s gate and sends word to Esther that she must go to the king. She answers that the law forbids it; he answers that she may have come to the kingdom for this very hour. She calls a fast and resolves to go.
when: 'Just after the decree of chapter 3, in the first month of the twelfth year of Ahasuerus, about 474 B.C.'

setting: |
  Chapter 3 ended with Haman’s decree carried by the king’s posts to every province: on one day, “the thirteenth day of the twelfth month, which is the month Adar,” all Jews were to be destroyed, “both young and old, little children and women” ([[Esth. 3:13]]). In Shushan “the king and Haman sat down to drink; but the city Shushan was perplexed” ([[Esth. 3:15]]). Haman had cast the lot in the first month of the king’s twelfth year (3:7), about 474 B.C., and the day set for the killing was eleven months away.

  Chapter 4 stands in the middle of the book’s second part, chapters 3–5, in which Haman plots the destruction of the Jews and Esther risks her life by going to the king uninvited. Nothing in it happens before the king. After Mordecai’s mourning at the gate (verses 1–4), the chapter is an exchange of messages, carried first by Hatach, between Mordecai in the street before the gate and the queen inside the palace (verses 5–16). The Persian kings behind the story are in [Persia and the Return](/old-testament/guides/persia-and-the-return/#rulers).

thread: |
  The chapter asks Esther to act before any deliverance is in sight. Mordecai expects the Jews to be delivered, “from another place” if not through her (verse 14), and yet he will not let that hope excuse her: she is in the palace, and perhaps that is the reason she is there. Esther begins with the law that could cost her life (verse 11) and ends resolved to go to the king after three days of fasting, “which is not according to the law” (verse 16).

  God is not named once, yet in this chapter the book “infers a providential destiny” (verses 13–16) and “speaks of fasting for deliverance,” two of the ways He is “everywhere taken for granted.” The chapter that opened with Mordecai’s “loud and a bitter cry” (verse 1) closes with him doing “according to all that Esther had commanded him” (verse 17).

sections:
  - range: 1-3
    heading: Mourning at the gate
    plain: |
      When Mordecai learned everything that had been done, he tore his clothes, put on sackcloth and ashes, and went out into the middle of the city crying out loudly and bitterly. He came right up to the king’s gate, but no further, because no one dressed in sackcloth was allowed to enter it. And in every province the king’s decree reached, the Jews mourned with fasting, weeping and wailing, and many lay in sackcloth and ashes.
  - range: 4-9
    heading: Messages through Hatach
    plain: |
      When Esther’s maids and attendants told her, the queen was deeply distressed. She sent clothes for Mordecai to put on in place of his sackcloth, but he would not take them. So she called Hatach, one of the king’s attendants who had been assigned to serve her, and sent him to Mordecai to find out what this was and why.

      Hatach went out to Mordecai in the city square in front of the king’s gate. Mordecai told him everything that had happened to him, and the exact sum Haman had promised to pay into the king’s treasury to have the Jews destroyed. He gave him a copy of the decree published in Shushan to show Esther, and told him to urge her to go to the king, plead with him, and ask him for her people. Hatach came back and told Esther what Mordecai had said.
  - range: 10-14
    heading: The law, and Mordecai’s answer
    plain: |
      Esther sent Hatach back to Mordecai with this message: Everyone, from the king’s servants to the people of his provinces, knows that any man or woman who goes to the king in the inner court without being called has one sentence, death, unless the king holds out the golden sceptre and spares that person. And I have not been called to the king for thirty days.

      When Mordecai was told Esther’s words, he sent back this answer: Do not imagine that because you are in the king’s house you alone of all the Jews will escape. If you keep silent now, relief and deliverance will come to the Jews from somewhere else, but you and your father’s family will perish. And who knows whether you have come to the kingdom for just such a time as this?
  - range: 15-17
    heading: Esther’s fast
    plain: |
      Then Esther sent this reply to Mordecai: Go and gather all the Jews in Shushan, and fast for me. Do not eat or drink for three days, night or day. My maids and I will fast the same way. Then I will go to the king, though it is against the law, and if I perish, I perish. So Mordecai went and did everything Esther had told him.

notes:
  - ref: 4
    phrase: she sent raiment to clothe Mordecai
    kind: history
    title: Clothes Mordecai would not take
    body: |
      Esther’s gift of clothes was most likely meant to bring Mordecai inside to her, so that he could enter the palace and tell her himself what had happened. The text gives the rule that kept him out: “none might enter into the king’s gate clothed with sackcloth” (verse 2). He would not put the clothing on, and the text gives no reason.

      The news reached her another way: by Hatach, with the exact sum Haman had promised the treasury and a copy of the decree itself (verses 7–8).
    sources: [keil-esther]

  - ref: 11
    phrase: who is not called, there is one law of his to put him to death
    kind: history
    title: The law of the inner court
    body: |
      Esther’s first answer is a fact about the court, not an excuse: the law of the inner court applied to everyone, “whether man or woman,” and allowed one exception. Anyone who came to the king unsummoned was to die unless the king held out the golden sceptre to spare the person (the sceptre is held out at [[Esth. 5:2]]); among the Persians only a few people could approach the king without first being announced.

      Why Esther did not simply ask for an audience the text does not say. One possibility is that a request through the court’s ordinary channels would have carried her message through Haman, who would have undermined her plan. An older reading looks to the last clause, “I have not been called to come in unto the king these thirty days”: from a month without a summons Esther concluded that the king did not much wish to see her, and a request for an audience would have obliged her to state her cause at once, when setting aside a sealed decree must have looked impossible. Either way, verse 11 shows the full weight of what Mordecai was asking her to do.
    sources: [scripture-helps-esther, keil-esther]

  - ref: 14
    phrase: deliverance arise to the Jews from another place
    kind: words
    title: Deliverance from another place
    body: |
      Mordecai expects deliverance but cannot say how it will come, only that it will come “from another place.” He may have sensed that providence would protect the Jews, whether Esther spoke or not, but he does not say that God will deliver them.

      The same verse is hard on Esther. Her place in the king’s house will not save her when every other Jew is to die (verse 13), and if she keeps silent, deliverance will come without her while “thou and thy father’s house shall be destroyed.” His confidence that the Jews will be delivered does not make her silence safe.

      The Greek translation is less reserved. It has Mordecai tell Esther at verse 8, “Do thou call upon the Lord, and speak to the king concerning us, to deliver us from death,” though at verse 14 it too speaks only of help “from another quarter.” The Hebrew book, which the King James Version follows, keeps the name unspoken and the hope whole.
    sources: [breitenstein-esther-minute, lxx-rahlfs]

  - ref: 14
    phrase: who knoweth whether thou art come to the kingdom for such a time as this
    kind: prophets
    title: For such a time as this
    body: |
      Mordecai’s last question offers Esther a reason for her crown without claiming to know it. He puts it as “who knoweth”: the Lord may have put her on the throne to be His instrument for saving her people. The orphan taken into the king’s house in chapter 2 could have been brought there for a purpose no one could have seen at the time.

      The Church’s footnote at “time” points to Joseph, who said plainly at another foreign court what Mordecai only asks: “God sent me before you to preserve you a posterity in the earth, and to save your lives by a great deliverance” ([[Gen. 45:7]]). Joseph said it after the deliverance had come; Esther had to act before she could know.
    sources: [scripture-helps-esther, lds-scriptures]

  - ref: 16
    phrase: fast ye for me, and neither eat nor drink three days, night or day
    kind: history
    title: A fast of three days
    body: |
      Esther answers Mordecai by calling a total fast, with no food and no water, kept “night or day” by the Jews of Shushan for her and by Esther and her maidens with them. She went in to the king “on the third day” ([[Esth. 5:1]]).

      The Jews of the provinces were already fasting as they mourned (verse 3). In scripture fasting often went with mourning, kept privately or as a community as a way of showing dependence on God, and here the people fasted for deliverance from the decree. The book never says to whom the fast was offered.
    sources: [sc-knowhy-135]

  - ref: 16
    phrase: I also and my maidens will fast likewise
    kind: scripture
    title: The prayer the Greek adds
    body: |
      The Hebrew book records Esther’s fast but no prayer, and the Greek translation filled the silence. A reader may assume that Esther prayed during her fast, at least silently; later Jewish writers in Greek seem to have felt the absence and composed what she might have said as she prepared to go in to the king. Their prayer is part of the Greek Esther, and so of the Apocrypha. In it she cries, “Oh, my Lord, You only are our king; help me, I who am alone.”

      The added chapters of Esther exist “to illustrate the hearing of prayer and the deliverances from the Gentiles that God wrought for His people the Jews.” The Lord’s word on the Apocrypha as a whole is that “There are many things contained therein that are true” and “many things contained therein that are not true, which are interpolations by the hands of men” ([[D&C 91:1–2]]). So the prayer shows how some early Jewish readers filled the book’s silence, but it is the Greek’s wording, not Esther’s words in the book. How the Apocrypha came into some Bibles is told in [How It Came to Us](/old-testament/guides/how-it-came-to-us/).
    sources: [sc-knowhy-863, bd-apocrypha, lds-scriptures]

  - ref: 16
    phrase: if I perish, I perish
    kind: prophets
    title: If I perish, I perish
    body: |
      Esther’s last words in the chapter are a decision made without any assurance that she would live. She knows the law she quoted in verse 11 and goes anyway, “which is not according to the law,” having first asked for the fast.

      The fast and the decision together make the chapter a lesson in courage: Esther “had gathered her courage and would stand firm and immovable for that which was right,” and “Esther, through fasting, faith, and courage, had saved a nation.”

      The theme page [I and My People](/esther/themes/i-and-my-people/#her-people-nor-her-kindred) follows how Esther, who first kept her people hidden, comes to speak the decree's sentence of herself and then to plead for her people, and reads that movement beside Christ the Advocate.
    sources: [monson-may-you-have-courage]

christ: |
  The book never names the God who delivers, yet the Church reads it as an illustration of God’s overruling providence in history, and the God of Israel, Jehovah, is the premortal Jesus Christ. The fast Esther called is the same act by which a disciple still shows trust and reliance on the Lord before a hard task. What looks like chance in a disciple’s life is overseen by a loving Father, and the Lord is in its small details, which prepare a person to lift family and others, even when, as for Esther, what a particular event is for cannot be known at the time a person must act.

explore: |
  - [[Gen. 45:4–8]]: Joseph at Pharaoh’s court, the passage the footnote at verse 14 points to.
  - [[Esth. 5:1–3]]: the third day of the fast, and the sceptre held out.
  - [[Ezra 8:21–23]]: another fast in the Persian period, before a dangerous journey.
  - [[Alma 28:1–6]]: Nephite mourning with fasting, set beside Esther’s fast.
  - [[D&C 91]]: how to read the Apocrypha, where Esther’s prayer is found.

