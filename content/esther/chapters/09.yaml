chapter: 9
title: The Days of Purim
tagline: On the day Haman's lot had chosen, the Jews stand for their lives and prevail; then Mordecai and Esther write letters that make the days of rest a feast for every year.
when: 'The thirteenth and fourteenth days of Adar, the twelfth month (verses 1, 15), early in 473 B.C.; then the letters that fixed Purim for every year.'

setting: |
  Chapter 9 arrives at the day the whole book has been waiting for. In the twelfth year of Ahasuerus (Xerxes), Haman's lot had fallen on the thirteenth of Adar, the last month of the year, and a decree sealed with the king's ring had ordered every Jew in the empire killed on it, “both young and old, little children and women” ([[Esth. 3:13]]). That decree could not be undone. So Esther persuaded the king to issue another, sent out in the third month, allowing the Jews to defend themselves on the same day ([[Esth. 8:11–12]]). Both letters now stood, naming the same date, and Mordecai held Haman's place beside the king ([[Esth. 8:2]]; [[Esth. 8:15]]).

  The chapter opens the last part of the book, chapters 9–10, in which the Jews receive authority from the king to kill their enemies and institute the Feast of Purim to remember their deliverance. It moves from the fighting (verses 1–16), to the rest and feasting that followed (verses 17–19), to the letters of Mordecai and then of Esther that made those days a yearly feast (verses 20–32). The king is still Ahasuerus; see [Persia and the Return](/old-testament/guides/persia-and-the-return/#rulers).

thread: |
  This is the chapter of the great reversal carried to its end. The day the enemies of the Jews “hoped to have power over them” is “turned to the contrary” (verse 1), and the month that was to have been their destruction is “turned unto them from sorrow to joy, and from mourning into a good day” (verse 22). The two halves of the chapter belong together: the first tells what happened on the thirteenth and fourteenth of Adar, and the second makes the rest that followed into a memory to be kept by every family in every generation.

  The fighting is told in plain numbers and the text does not soften them. It also marks, three times, what the Jews did not do: though the king's decree allowed it, they laid no hand on the spoil. The feast the chapter founds is named for Haman's lot (verse 26), so the instrument of the plot becomes the name of the celebration, and its keeping includes food sent to neighbors, gifts to the poor, and “the matters of the fastings and their cry” (verse 31).

sections:
  - range: 1-4
    heading: The day turned to the contrary
    plain: |
      The thirteenth day of the twelfth month, Adar, came, the day when the king's command and decree were to be carried out, the day the enemies of the Jews had hoped to overpower them. Instead the opposite happened: the Jews overpowered those who hated them. In their cities in every province of King Ahasuerus, the Jews gathered to strike at those who sought to harm them, and no one could stand against them, because fear of them had fallen on every people. All the rulers of the provinces, the governors, the deputies and the king's officials supported the Jews, because fear of Mordecai had fallen on them. Mordecai was powerful in the king's house, and his fame spread through all the provinces; he grew more and more powerful.
  - range: 5-10
    heading: In Shushan
    plain: |
      So the Jews struck down all their enemies with the sword, killing and destroying them, and did as they chose to those who hated them. In Shushan the citadel the Jews killed five hundred men. They also killed Parshandatha, Dalphon, Aspatha, Poratha, Adalia, Aridatha, Parmashta, Arisai, Aridai and Vajezatha, the ten sons of Haman son of Hammedatha, the enemy of the Jews. But they did not touch the plunder.
  - range: 11-16
    heading: Esther's further request
    plain: |
      That day the number of those killed in Shushan the citadel was reported to the king. The king said to Queen Esther: The Jews have killed five hundred men in Shushan the citadel, and the ten sons of Haman. What must they have done in the rest of the king's provinces? Now, what is your petition? It will be granted. What more do you ask? It will be done. Esther said: If it pleases the king, let the Jews in Shushan be allowed to do tomorrow also what today's decree allowed, and let the bodies of Haman's ten sons be hung on the gallows. The king ordered it done. A decree was issued in Shushan, and Haman's ten sons were hung. The Jews in Shushan gathered on the fourteenth of Adar as well and killed three hundred men there, but they did not touch the plunder. The other Jews in the king's provinces also gathered, stood up for their lives and gained rest from their enemies. They killed seventy-five thousand of those who hated them, but they did not touch the plunder.
  - range: 17-19
    heading: Days of feasting and gladness
    plain: |
      This was on the thirteenth of Adar, and on the fourteenth they rested and made it a day of feasting and gladness. But the Jews in Shushan had gathered on both the thirteenth and the fourteenth, so they rested on the fifteenth and made that their day of feasting and gladness. That is why the Jews of the villages, who live in unwalled towns, keep the fourteenth of Adar as a day of gladness and feasting, a holiday, when they send portions of food to one another.
  - range: 20-28
    heading: Mordecai's letter
    plain: |
      Mordecai wrote down these events and sent letters to all the Jews in every province of King Ahasuerus, near and far, to establish that every year they should keep the fourteenth and fifteenth days of Adar as the days on which the Jews gained rest from their enemies, the month that was turned for them from sorrow to joy and from mourning to a holiday. They were to make them days of feasting and joy, of sending portions of food to one another and gifts to the poor. The Jews accepted as a custom what they had begun to do and what Mordecai had written to them. For Haman son of Hammedatha the Agagite, the enemy of all the Jews, had plotted to destroy them and had cast Pur, that is, the lot, to crush and destroy them. But when the matter came before the king, he ordered in writing that the wicked plot Haman had devised against the Jews should come back on his own head, and he and his sons were hanged on the gallows. That is why these days are called Purim, from the word Pur. So, because of everything in this letter, and what they had seen and what had happened to them, the Jews bound themselves, their descendants and all who joined them to keep these two days without fail, as written and at their appointed time, every year. These days are to be remembered and kept in every generation, in every family, province and city, so that the days of Purim never cease among the Jews and their memory never dies out among their descendants.
  - range: 29-32
    heading: Esther's letter
    plain: |
      Then Queen Esther, the daughter of Abihail, together with Mordecai the Jew, wrote with full authority to confirm this second letter about Purim. Letters were sent to all the Jews in the hundred and twenty-seven provinces of the kingdom of Ahasuerus, with words of peace and truth, to establish these days of Purim at their appointed times, as Mordecai the Jew and Queen Esther had charged them, and as the Jews had taken upon themselves and their descendants the observance of the fasts and their lamenting. Esther's command confirmed these practices of Purim, and it was written in the record.

notes:
  - ref: 1
    phrase: (though it was turned to the contrary, that the Jews had rule over them that hated them;)
    kind: history
    title: The day turned to the contrary
    body: |
      The verse names the day twice over, as the day the king's decree was to be carried out and as the day the enemies of the Jews “hoped to have power over them,” and then, in a parenthesis, says that the outcome was the opposite of that hope. The decree of [[Esth. 3:13]] was never withdrawn, because it could not be undone, so Esther had persuaded the king to issue a second, allowing the Jews to defend themselves before the day planned for their massacre ([[Esth. 8:8]]; [[Esth. 8:11]]). Both decrees came due on the thirteenth of Adar.

      Nothing in the first decree was cancelled; it was overtaken. The same word returns at verse 22 for the whole month, “turned unto them from sorrow to joy,” and verse 25 tells Haman's end as a reversal too, a wicked device that “should return upon his own head.” The narrator names no one as the cause of the turn. The Church's reading of the book as a whole is that it is “a most striking illustration of God’s overruling providence in history” (see the notes at [[Esth. 4:14]] and [[Esth. 6:1]]); this verse states only the outcome.
    sources: [scripture-helps-esther, bd-esther-book, lds-scriptures]

  - ref: 3
    phrase: because the fear of Mordecai fell upon them
    kind: history
    title: Why the king’s officers helped
    body: |
      The king's own officials, from the rulers of the provinces down to the “officers of the king,” took the side of the Jews, and the text gives the reason plainly: they feared Mordecai. Haman's decree had been sent to these same satraps and governors ([[Esth. 3:12]]), and the second decree went to them too ([[Esth. 8:9]]). Mordecai now wore the ring Haman had worn ([[Esth. 8:2]]), his fame had gone out through all the provinces, and he “waxed greater and greater” (verse 4). The officials who had received Haman's letters now feared the man who held Haman's place.
    sources: [lds-scriptures]

  - ref: 10
    phrase: but on the spoil laid they not their hand
    kind: history
    title: No hand on the spoil
    body: |
      Three times the chapter says the Jews did not take the plunder (verses 10, 15 and 16). Haman's decree had promised the killers the goods of the Jews, “to take the spoil of them for a prey” ([[Esth. 3:13]]), and the second decree gave the Jews the same right, in the same words, over those who attacked them ([[Esth. 8:11]]). They were allowed to take it and did not. The text gives no reason, but the refusal fits the way it tells the day: they fought those who “sought their hurt” (verse 2), and their focus was on defending themselves, not on what they might gain.
    sources: [breitenstein-esther-minute, lds-scriptures]

  - ref: 13
    phrase: let Haman’s ten sons be hanged upon the gallows
    kind: history
    title: A second day, and the ten sons hanged
    body: |
      Esther asks for a second day in Shushan and for Haman's ten sons to be hanged, and the text gives the reason for neither request. The first is a second day in Shushan, “to do to morrow also according unto this day's decree”; the king grants it, a decree is given in Shushan, and the Jews of the city gather again on the fourteenth (verses 14–15). What the second day was for, the book does not say. The second request is that Haman's ten sons, already killed (verse 10), be hanged on the gallows. Since they were dead, what she asks is that their bodies be exposed, for greater disgrace, by a custom Israel and Persia shared (compare [[Deut. 21:22–23]]). In Esther, hanging was the punishment of those who rebelled against the king's authority, and a public humiliation (on the gallows' height, see the note at [[Esth. 5:14]]).

      Haman had built his gallows for Mordecai ([[Esth. 5:14]]) and was hanged on it himself ([[Esth. 7:10]]); now his sons are hanged too, as verse 25 sums it up. The chapter tells it without comment.
    sources: [keil-esther, belnap-fell-tree, lds-scriptures]

  - ref: 16
    phrase: stood for their lives
    kind: history
    title: Standing for their lives
    body: |
      The numbers in verses 6–16 are given within a frame the text itself supplies. The second decree let the Jews “stand for their life” against “all the power of the people and province that would assault them” ([[Esth. 8:11]]), and this verse uses the same words: they gathered and “stood for their lives.” Those they fought are described throughout as people who “sought their hurt” (verse 2), their “enemies,” and “those that hated them” (verses 1, 5, 16). The second decree was, in short, permission for the Jews to defend themselves before the planned day of their own massacre.

      The text does not make the day gentler than it was. The Jews “did what they would unto those that hated them” (verse 5), killed five hundred men in the citadel on the first day and three hundred more in the city on the second, and in the provinces slew seventy-five thousand; the Greek translation of Esther gives the provincial figure as fifteen thousand. In Shushan the count is of men (verses 6, 15), and the chapter never says that women or children were killed; what the second decree's mention of “both little ones and women” means is taken up at [[Esth. 8:11]]. The verse also says how it ended: they “had rest from their enemies,” and that rest is what the feast of verses 17–22 marks.
    sources: [scripture-helps-esther, lxx-rahlfs, lds-scriptures]

  - ref: 19
    phrase: the Jews of the villages, that dwelt in the unwalled towns
    kind: history
    title: Why Purim has two days
    body: |
      The feast has two days because the fighting did. In the provinces the Jews fought on the thirteenth of Adar and rested on the fourteenth; in Shushan, where Esther's request added a second day, they fought on the thirteenth and fourteenth and rested on the fifteenth. Each celebrated the day after its fighting ended (verses 17–18). Verse 19 turns that into a custom for the Jews of the villages and unwalled towns, who keep the fourteenth, and Mordecai's letter then fixes both days for every year (verse 21). So the feast came to be held on the 14th and 15th of Adar.
    sources: [bd-feasts, lds-scriptures]

  - ref: 22
    phrase: the month which was turned unto them from sorrow to joy, and from mourning into a good day
    kind: history
    title: What the feast remembers
    body: |
      Mordecai's letter says exactly what is to be remembered: the rest, “the days wherein the Jews rested from their enemies,” and the turn of a whole month from sorrow to joy. The mourning had begun when the decree was published: “in every province… there was great mourning among the Jews, and fasting, and weeping, and wailing” ([[Esth. 4:3]]). The feast has three marks: feasting, portions sent to one another, and “gifts to the poor.”

      The Jews took it on themselves as something already begun (verse 23), and the next verses give the reason in brief: Haman's plot, his lot, and his device turned back on his own head (verses 24–25). Verses 27–28 then bind it on every generation, family, province and city, and on “all such as joined themselves unto them,” so that “the memorial of them” should not perish.
    sources: [lds-scriptures]

  - ref: 26
    phrase: they called these days Purim after the name of Pur
    kind: history
    title: Purim, then and now
    body: |
      The feast takes its name from the lot Haman cast to choose the day of destruction ([[Esth. 3:7]]; see the note there on *pur*), so the plot's own instrument names the celebration, a name given “in mockery of the lots Haman had cast.” It was instituted by Mordecai and confirmed by Esther (verses 20, 29–32). It is not one of the feasts of the law of Moses ([[Lev. 23:1–44]]), but a feast the Jews of Persia founded to remember a deliverance.

      Jews still keep it, with gifts to one another and presents to the poor much as verse 22 commands, and the whole story read in the synagogue. It is a minor festival and a regular working day, celebrated in the evening, and its fun carries “a very serious message to proclaim about Jewish persecution and the way God protects his people.”
    sources: [bd-feasts, scripture-helps-esther, keller-judaism, lds-scriptures]

  - ref: 31
    phrase: the matters of the fastings and their cry
    kind: history
    title: The fastings and their cry
    body: |
      The second letter, from Esther with Mordecai, adds something the first did not mention: the Jews took on themselves and their descendants “the matters of the fastings and their cry.” The text does not say when the fasting fell or what it was; one reading takes it as times of fasting and lamentation appointed within the days of Purim. The book's own fast is the one of chapter 4 (see the note at [[Esth. 4:16]]).

      A fixed fast came later. The thirteenth of Adar, the day named in Haman's decree ([[Esth. 3:13]]), had first been kept as a feast for a Maccabean victory, and afterward became a fast called the Fast of Esther, in preparation for the feast. That is later custom; the book itself sets no date for the fasting, and closes with Esther's decree “written in the book” (verse 32).
    sources: [keil-esther, bd-feasts, lds-scriptures]

christ: |
  The deliverance of Esther 9 is remembered as a month “turned… from sorrow to joy,” and the Savior used the same words for what His disciples would know: “ye shall be sorrowful, but your sorrow shall be turned into joy” ([[John 16:20]]); “I will see you again, and your heart shall rejoice, and your joy no man taketh from you” ([[John 16:22]]). The likeness is in the words; nothing in the text makes Purim a figure of Him. For a disciple, sorrow is not the last word, and the joy He promised is one no one can take away.

explore: |
  - [[Esth. 3:7–13]]: the lot and the first decree, which this chapter answers point by point.
  - [[Esth. 8:3–14]]: the second decree, and why the first could not simply be revoked.
  - [[Neh. 8:9–12]]: another day of sorrow turned to a feast, with portions sent to those who had nothing.
  - [[Esth. 4:1–3]] and [[Esth. 4:16]]: the mourning and the fast of chapter 4, the book's own fasting, beside the “fastings and their cry” of verse 31.

