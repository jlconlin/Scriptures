chapter: 5
title: Esther Goes In unto the King
tagline: On the third day of the fast Esther stands unbidden in the king’s court, is spared by the golden sceptre, and asks only that the king and Haman come to a banquet, and then to a second. Haman goes home glad, is undone by Mordecai’s refusal to rise, and on his wife’s advice builds a gallows for the morning.
when: 'The third day of the fast (verse 1; 4:16), in the twelfth year of Ahasuerus, about 474 B.C.'

setting: |
  The chapter picks up where Esther left Mordecai: “Go, gather together all the Jews that are present in Shushan, and fast ye for me… three days… and so will I go in unto the king, which is not according to the law” ([[Esth. 4:16]]). The law she means is the one she had quoted to him: anyone who came to the king in the inner court uncalled was put to death, “except such to whom the king shall hold out the golden sceptre, that he may live” ([[Esth. 4:11]]). Behind it stands Haman’s decree, sealed with the king’s ring in the first month of the twelfth year of Ahasuerus and set for the thirteenth of Adar, eleven months off ([[Esth. 3:7]]; [[Esth. 3:12–13]]). Counting from the king’s accession in 486 B.C., that is about 474 B.C.

  The chapter closes the second part of the book as *Scripture Helps* divides it (chapters 3–5): Haman’s plot, Esther’s risk in going to the king uninvited, and the king’s kind welcome and the banquet. Haman is now the highest of the princes ([[Esth. 3:1]]), and Mordecai still sits in the king’s gate. Esther has not yet told the king who her people are or who her enemy is; that waits for chapter 7. The next chapter opens on the night between Esther’s two banquets.

thread: |
  Esther 5 is a chapter of preparations for **tomorrow**, made by two people who do not know what the other is preparing.

  Esther comes out of the fast, puts on her royal apparel and is spared at the sceptre. The king offers her “to the half of the kingdom,” and she asks only for a banquet. At the banquet, asked a second time, she asks only that the king and Haman come again: “I will do to morrow as the king hath said” (verse 8).

  Haman leaves that banquet glad and is undone within a verse by the sight of Mordecai, who neither rises nor trembles. He counts his riches, his sons and his honors aloud and calls them nothing; his household tells him to build a gallows, “and to morrow speak thou unto the king” (verse 14).

  So the chapter ends with a banquet prepared for tomorrow and a gallows prepared for tomorrow. Between them comes a single night, and the next chapter begins: “On that night could not the king sleep” ([[Esth. 6:1]]).

sections:
  - range: 1-8
    heading: The queen in the inner court
    plain: |
      On the third day Esther dressed as queen and stood in the inner court of the palace, facing the king’s hall, while the king sat on his throne inside, facing the entrance. When the king saw Queen Esther standing in the court, he looked on her with favor and held out to her the golden sceptre in his hand, and Esther came near and touched its tip. The king said, “What is it, Queen Esther? What do you ask? Even if it is half the kingdom, it will be given you.” Esther answered, “If it pleases the king, let the king and Haman come today to the banquet I have prepared for him.” The king said, “Bring Haman quickly, so that we may do what Esther asks.” So the king and Haman came to her banquet. As they drank wine, the king asked Esther again, “What is your petition? It will be granted. What is your request? Up to half the kingdom, it will be done.” Esther answered, “My petition and my request is this: if I have found favor with the king, and if it pleases the king to grant what I ask, let the king and Haman come to another banquet that I will prepare for them, and tomorrow I will do as the king has said.”
  - range: 9-14
    heading: Haman’s gallows
    plain: |
      Haman went out that day happy and in high spirits. But when he saw Mordecai in the king’s gate, and Mordecai neither rose nor trembled before him, he was filled with rage against Mordecai. Still, he held himself in check and went home, and he sent for his friends and his wife Zeresh. He told them about his great wealth, his many sons, all the ways the king had honored him, and how the king had raised him above the princes and officials. “What is more,” Haman said, “Queen Esther let no one but me come with the king to the banquet she gave, and tomorrow I am invited to her again with the king. Yet none of this satisfies me as long as I see Mordecai the Jew sitting at the king’s gate.” His wife Zeresh and all his friends said to him, “Have a gallows set up, fifty cubits high, and in the morning ask the king to have Mordecai hanged on it. Then go to the banquet with the king and enjoy yourself.” Haman liked the idea and had the gallows built.

notes:
  - ref: 1
    phrase: Esther put on her royal apparel
    kind: history
    title: Royal apparel on the third day
    body: |
      The third day is the third day of the fast Esther asked of the Jews in Shushan and kept with her maidens: “neither eat nor drink three days, night or day” ([[Esth. 4:16]]). That she goes in “on the third day,” and not after three full days, can be reconciled by counting the day of her exchange with Mordecai as the first day; on that reckoning the fast ran some forty to forty-five hours, from the afternoon of the first day to the morning of the third.

      The Hebrew is shorter than the English: Esther “put on royalty,” royal dignity, with the word for garment left to be understood from the verb. The same noun (*malkût*, royalty or kingship) then names the king’s “royal throne” and “royal house” in the same verse. The woman who had sent word that she had not been called to the king for thirty days ([[Esth. 4:11]]) now stands in the inner court in that royalty, facing the king on his throne.
    sources: [keil-esther, oshb-wlc, lds-scriptures]

  - ref: 8
    phrase: let the king and Haman come to the banquet that I shall prepare for them
    kind: history
    title: A request held back a day
    body: |
      Twice the king offers Esther anything “to the half of the kingdom” (verses 3, 6; again at [[Esth. 7:2]]). An offer of that kind is made elsewhere in scripture ([[Mark 6:23]]) and seems to be “only a gesture rather than a serious offer”; what matters is that the king invites a request. Twice she answers with a banquet. The second time she seems about to make her request, “My petition and my request is;” (verse 7), and what follows is only an invitation to come again tomorrow, when she will “do… as the king hath said” and answer him.

      The text gives no reason for the delay. One reading is political: with Haman in power and in favor ([[Esth. 3:1–2]]), a direct accusation “might well have been rejected had the king not been prepared beforehand.” It is a reading of a silence. What the text does show is what fills the delay: before Esther names her enemy, the king’s sleepless night and Mordecai’s honor intervene ([[Esth. 6:1–11]]), and what happened in those twenty-four hours was “of the greatest importance.”
    sources: [breitenstein-esther-minute, ot-manual-31, lds-scriptures]

  - ref: 9
    phrase: that he stood not up, nor moved for him
    kind: words
    title: Neither rose nor trembled
    body: |
      “Moved” undersells the Hebrew. The verb (*zûaʿ*) means to “tremble, quake, in presence of powerful superior”; Mordecai neither stood up nor trembled before Haman. The first refusal was a matter of bowing: “Mordecai bowed not, nor did him reverence” ([[Esth. 3:2]]). Now a decree of death hangs over Mordecai and every Jew in the empire ([[Esth. 3:13]]), Mordecai himself has mourned in sackcloth ([[Esth. 4:1]]), and Haman is the man who obtained it ([[Esth. 3:8–11]]). Still Mordecai neither rises nor trembles before him.

      That is what undoes Haman. He has just come from the queen’s table “joyful and with a glad heart,” and one man sitting still in the gate fills him with rage. He holds it in for now (verse 10), but the rest of the chapter is what that rage does.
    sources: [bdb, lds-scriptures]

  - ref: 13
    phrase: Yet all this availeth me nothing
    kind: scripture
    title: All this availeth me nothing
    body: |
      Haman calls his household together to hear what he has: “the glory of his riches, and the multitude of his children,” his promotion above all the princes (verse 11; [[Esth. 3:1]]), and last the newest honor: the queen let no man but him come with the king to her banquet, and he is invited again tomorrow (verse 12). Then he cancels the whole list in one sentence: none of it is worth anything to him “so long as I see Mordecai the Jew sitting at the king’s gate.” Wealth, family and office are outweighed by a single man who will not acknowledge him.

      Pride and anger “can lead to downfall,” and chapter 7 shows where Haman’s led. The proverb set beside these verses for study is [[Prov. 16:32]]: “He that is slow to anger is better than the mighty; and he that ruleth his spirit than he that taketh a city.” His house later goes to Esther and his ring to Mordecai ([[Esth. 8:1–2]]), and the sons he counts are named among the dead ([[Esth. 9:7–10]]).
    sources: [cfm-ot-2026-32, lds-scriptures]

  - ref: 14
    phrase: Let a gallows be made of fifty cubits high
    kind: history
    title: A gallows fifty cubits high
    body: |
      “Gallows” is the King James word for the Hebrew *ʿēṣ*, “tree” or “wood.” Elsewhere in the Old Testament it can name the pole on which the bodies of the executed were exposed; in Esther, a late book of the Persian period, it is a means of execution, though whether by hanging, as “gallows” has it, is not certain. It is the same expression as for the plotters who were “hanged on a tree” ([[Esth. 2:23]]). Fifty cubits is about seventy-five feet. Its size suggests it was meant to be seen from a distance, and so that the hanging was to be a public humiliation.

      The advice turns on two words, “to morrow.” Haman is to speak to the king first and go “merrily” to the banquet afterward. He does go to the court early the next day to ask for Mordecai’s death ([[Esth. 6:4]]), but the night has intervened. The gallows he built that evening is the one on which he is hanged ([[Esth. 7:9–10]]); chapter 7 takes that up.
    sources: [bdb, belnap-fell-tree]

christ: |
  Esther went unbidden into the presence of one who held her life in his hand, for a people already under sentence of death ([[Esth. 4:8]]; [[Esth. 4:16]]), and she went at the end of a fast. Her courage is studied in these chapters as “Christlike courage,” and the truth drawn from them is that “as we act in faith, God will give us courage.” The same holds for a disciple now: courage is given to those who act in faith, and fasting is one way to show trust in the Lord and reliance on Him, and to strengthen that reliance.

explore: |
  - **The fast and the sceptre.** Read [[Esth. 4:11–17]] with [[Esth. 5:1–3]], and the law of the fast in [[Isa. 58:6–12]].
  - **Two preparations for tomorrow.** Read [[Esth. 5:8]] and [[Esth. 5:14]], then [[Esth. 6:1–4]] and [[Esth. 7:9–10]].
  - **Pride and its end.** Read [[Esth. 5:11–13]] with [[Prov. 16:32]], [[Alma 5:28]] and [[Esth. 9:7–10]].

