chapter: 1
title: The King’s Feast and Vashti’s Refusal
tagline: In the third year of his reign Ahasuerus shows his nobles the riches of his kingdom for half a year and feasts his capital for a week, and when Queen Vashti will not come at his command, his counsellors turn her refusal into a law for every house in the empire.
when: 'The third year of Ahasuerus (Xerxes), about 483 B.C. (verse 3), at Shushan (Susa).'

setting: |
  The book opens “in the days of Ahasuerus,” the king commonly identified as Xerxes I, who ruled Persia from 486 to 465 B.C. ([Persia and the Return](/old-testament/guides/persia-and-the-return/#rulers)). Ahasuerus is the Hebrew form of his Persian name, *Khsyayarsha*; Xerxes is the Greek. The feast of verse 3 falls in his third year, about 483 B.C. Some Jews had gone home to Jerusalem after Cyrus took Babylon in 539 B.C., but many stayed in the lands of their exile, Esther among them. Shushan, or Susa, was one of the empire’s capitals; later Nehemiah served Xerxes’ son Artaxerxes in the same palace ([[Neh. 1:1]]).

  The book was written anonymously and cannot be dated, though its story fits the reign of Ahasuerus well. Bible scholars hold diverse views about its historical accuracy; Joseph Smith made no changes to it in his translation of the Bible, and modern prophets have spoken of Esther as a real person, so the site reads it as history. The book never names God. Yet He “is everywhere taken for granted” in it, and it stands as “a most striking illustration of God’s overruling providence in history.”

  Chapters 1 and 2 belong together: the king removes Vashti, and then he chooses Esther. Chapter 1 has no Jew in it at all. It sets the stage: a court of feasts, wine, counsellors and decrees, and an empty place beside the king.

thread: |
  Chapter 1 is a portrait of power. For half a year the king displays “the riches of his glorious kingdom” (verse 4), then feasts his capital for seven days with royal wine “according to the state of the king” (verse 7). Everything in the palace moves at his word; even the drinking runs by royal rule (verse 8). Then one word does not move. The king who reigns over a hundred and twenty-seven provinces cannot bring his own wife before him, and his court answers with more law: a decree that cannot be altered, sent in every script and language, that every man bear rule in his own house.

  The chapter speaks of no purpose beyond the king’s. What it leaves behind is a queen’s place, to be given “unto another that is better than she” (verse 19). Its banquets and its law will both return: at a banquet of her own Esther will name Haman to the king as “the adversary and enemy” ([[Esth. 7:1–6]]), and the rule that a decree once written cannot be altered will bind the king again ([[Esth. 8:8]]).

sections:
  - range: 1-9
    heading: Half a year of glory and a week of feasting
    plain: |
      This happened in the days of Ahasuerus, the Ahasuerus who reigned over a hundred and twenty-seven provinces from India to Ethiopia. In those days, when King Ahasuerus sat on his royal throne in the citadel of Shushan, in the third year of his reign, he gave a feast for all his officials and servants. The army of Persia and Media and the nobles and governors of the provinces were before him, while for many days, a hundred and eighty days, he displayed the riches of his glorious kingdom and the splendor of his majesty.

      When those days were over, the king gave a seven-day feast for all the people in the citadel of Shushan, from the greatest to the least, in the court of the palace garden. There were hangings of white, green and blue, fastened with cords of fine linen and purple to silver rings and marble pillars, and couches of gold and silver on a pavement of red, blue, white and black marble. Drinks were served in golden cups, no two alike, and royal wine flowed freely, as befitted the king. The drinking went by the rule: no one was forced, for the king had told all the officers of his house to serve each man as he pleased. Queen Vashti also gave a feast for the women in the royal palace of King Ahasuerus.
  - range: 10-12
    heading: The queen refuses
    plain: |
      On the seventh day, when the king was merry with wine, he commanded the seven chamberlains who served him, Mehuman, Biztha, Harbona, Bigtha, Abagtha, Zethar and Carcas, to bring Queen Vashti before him wearing the royal crown, to show the people and the princes her beauty, for she was lovely to look at. But Queen Vashti refused to come at the king’s command brought by the chamberlains. The king was furious; his anger burned within him.
  - range: 13-22
    heading: A law for every house
    plain: |
      The king turned to the wise men who understood the times, for it was his custom to lay every matter before those who knew law and judgment. Closest to him were Carshena, Shethar, Admatha, Tarshish, Meres, Marsena and Memucan, the seven princes of Persia and Media, who saw the king’s face and held the highest seats in the kingdom. “By law,” he asked, “what is to be done with Queen Vashti, since she has not obeyed the command of King Ahasuerus brought by the chamberlains?”

      Memucan answered before the king and the princes: “Queen Vashti has wronged not only the king but all the princes and all the peoples in all the provinces of King Ahasuerus. Word of what the queen did will reach every woman, and they will look down on their husbands, saying, ‘King Ahasuerus commanded Queen Vashti to be brought before him, and she did not come.’ This very day the noble ladies of Persia and Media who have heard of it will say the same to all the king’s princes, and there will be no end of contempt and anger. If it please the king, let him issue a royal decree and have it written among the laws of the Persians and the Medes, so that it cannot be revoked: Vashti is never again to come before King Ahasuerus, and the king is to give her royal position to another woman who is better than she. When the king’s decree is proclaimed throughout his empire, vast as it is, all wives will honor their husbands, from the greatest to the least.”

      The king and the princes liked the advice, and the king did as Memucan said. He sent letters to all the royal provinces, to each province in its own script and to each people in its own language, that every man should be master in his own house and speak the language of his own people.

notes:
  - ref: 4
    phrase: even an hundred and fourscore days
    kind: history
    title: Half a year of display, then a week of feasting
    body: |
      Verses 3–4 can be read in two ways. Read straight through, they describe one feast that lasted the whole 180 days, and a Latter-day Saint guide to the book takes them so. Read more closely, verse 3 names a feast and verse 4 gives its occasion, 180 days in which the king showed his nobles and the commanders of Persia and Media the riches and greatness of his realm; the banquet is then the seven-day feast of verses 5–8, given “when these days were expired.” On that reading “the text, however, does not say, that the feast lasted 180 days.” Either way, half a year of royal display comes before the week of wine in which the story turns.

      Why gather the leaders of the empire at Susa for half a year? The book does not say; its interest is in what came of the feast. One older commentary proposes an answer from the Greek historian Herodotus, who tells that Xerxes summoned the chief men of his kingdom to Susa to take counsel about his campaign against Greece, and that he spent four years preparing for that war, which would fit an assembly in his third year. On that reading the assembly was a council of war, and “the riches of his glorious kingdom” were the resources of the realm laid before it. It remains a proposal. The great battles with the Greeks, at Thermopylae and Salamis, came in 480 B.C.
    sources: [breitenstein-esther-minute, keil-esther, bible-chron-ot]

  - ref: 8
    phrase: the drinking was according to the law; none did compel
    kind: words
    title: A rule for the drinking
    body: |
      The word translated “law” is *dath*, a Persian loanword (Old Persian *dâta*) meaning a decree, a law or a usage, used only in the Persian period. Its range runs from the permanent “laws of the Persians and the Medes” in verse 19 to, in the lexicon’s words, “even of rules for drinking at a feast,” here. In this court even the wine is served by royal rule.

      The rule itself is a negative: *’ein ’ones*, literally none compelling: no one was made to drink, and each guest drank “according to every man’s pleasure.” One explanation sets it against a custom that guests at a king’s feast drank when the king drank; at this feast the king set the custom aside and let each man drink as he chose. One translation takes the verse to mean that the guests were given wine in any quantity they desired. By the seventh day the king himself was “merry with wine” (verse 10), and the summons to Vashti came then.
    sources: [bdb, breitenstein-esther-minute, ot-manual-31]

  - ref: 12
    phrase: But the queen Vashti refused to come at the king’s commandment
    kind: history
    title: Why Vashti refused
    body: |
      The text tells what Vashti did and not why. It sets the scene with care: seven days of royal wine, a king “merry with wine,” and a summons by seven chamberlains to appear in her crown so that the people and the princes could look at her beauty (verses 10–11). Then it gives her refusal in a single line and moves straight to the king’s anger. What is remembered of her is only this: she “refused to show her beauty to the people and the princes,” and she was “deposed for disobedience.”

      One reading finds the reason in the scene itself. After a week of heavy drinking the guests were probably drunk, and she may have thought it beneath a queen’s dignity to be paraded before them for her looks. A nineteenth-century commentary reads it the same way: she would not stake her dignity as queen and wife before the king’s drunken guests. That is a likely reading of the circumstances, not something the narrator says. What the narrator does make plain is the result: “therefore was the king very wroth, and his anger burned in him.”
    sources: [lds-scriptures, bd-esther-book, bd-vashti, ot-manual-31, keil-esther]

  - ref: 13
    phrase: the wise men, which knew the times
    kind: words
    title: Wise men who knew the times
    body: |
      The king’s first advisers were men who read the times, most likely astrologers. “Knew the times” is a late Hebrew idiom, built on the word for the proper or suitable time; here it means, in the lexicon’s words, “astrologers, etc.,” and the lexicon sets it beside the men of Issachar “that had understanding of the times” ([[1 Chr. 12:32]]), the verse the footnote gives. The same verse adds that the king’s way was to lay every matter before “all that knew law and judgment,” where “law” is again *dath*.

      So a husband’s quarrel with his wife goes before the empire’s experts in the times and in the law, and the question put to them is a legal one: “What shall we do unto the queen Vashti according to law?” (verse 15). The seven princes who answer are the men nearest the throne, “which saw the king’s face, and which sat the first in the kingdom” (verse 14).
    sources: [bdb, lds-scriptures]

  - ref: 19
    phrase: let it be written among the laws of the Persians and the Medes, that it be not altered
    kind: history
    title: A decree that cannot be altered
    body: |
      Memucan asks for more than a royal order. He asks that it be entered among the laws of the Persians and the Medes, which could not be changed once written; the note on [[Dan. 6:8]] explains that law, under which a king’s own decree bound the king. Here it makes Vashti’s removal final: she is to come no more before the king, and her “royal estate” is to go “unto another that is better than she.”

      The decree outlasts the anger that produced it. When the king’s wrath was appeased he “remembered Vashti, and what she had done, and what was decreed against her” ([[Esth. 2:1]]); the decree stood, and his servants proposed a search for a new queen. The footnote to “altered” points ahead to chapter 8, where the same rule returns with far more at stake, for a decree written in the king’s name and sealed with his ring is one that “may no man reverse” ([[Esth. 8:8]]).
    sources: [lds-scriptures]

  - ref: 22
    phrase: that every man should bear rule in his own house
    kind: words
    title: A law for every house, in every language
    body: |
      The counsellors’ remedy is as wide as their fear. One queen’s example, Memucan says, will reach “all women” (verse 17), so the decree is to be published throughout the empire, “for it is great,” until “all the wives shall give to their husbands honour, both to great and small” (verse 20). The king sends it to every province in its own script and to every people in its own language. The footnote points to [[Esth. 8:9]], where Mordecai’s letters go out the same way.

      The last clause reads differently in the Hebrew. The King James Version has “that it should be published according to the language of every people,” but the Hebrew continues the decree itself: every man is to rule in his house, *umedabber kilshon ammo*, “and speak according to the language of his people,” as the English Standard Version renders it. The New Revised Standard Version Updated Edition leaves the clause out, following the Greek, which lacks it. What the clause was meant to secure the text does not explain; it is part of what the king commanded every household in the empire.
    sources: [lds-scriptures, oshb-wlc, esv, nrsvue]

christ: |
  Nothing in this chapter is done by God or said to Him: it is the king’s will, the king’s wine and the king’s counsellors. Yet the God the book takes for granted is the God of Israel, Jehovah, the premortal Jesus Christ. The decree that emptied the queen’s place set up the opportunity for Esther to be chosen and, in time, to save her people.

  The Lord can guide a disciple’s path and prepare him or her to be an instrument in His hands, often through events in which His influence is not recognized at the time.

