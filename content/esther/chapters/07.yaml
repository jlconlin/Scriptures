chapter: 7
title: Esther Names the Enemy
tagline: At the second banquet Esther asks for her life and her people's, names Haman as the enemy, and Haman is hanged on the gallows he had built for Mordecai.
when: 'The second banquet, the day after the first (5:8) and the same day Mordecai was honored (6:14), about 474 B.C.'

setting: |
  The day that began with Haman leading Mordecai through the city ends at Esther's table. The king's chamberlains had come to hurry Haman to the banquet while his own wife and friends were still telling him he had “begun to fall” ([[Esth. 6:13–14]]). Only three sit at the banquet, the king, the queen and Haman, though the king's chamberlains are in the room (verses 8–9). The decree sealed with the king's ring still stands for the thirteenth of Adar, months away ([[Esth. 3:12–13]]), and the king still does not know that the people it condemns are the queen's.

  This is the turn of the book's third part, chapters 6–8 in *Scripture Helps*' outline: Esther tells the king of Haman's plot, the king has Haman hanged and honors Mordecai, and the edict against the Jews is answered. Chapter 6 ended Haman's rise; chapter 7 ends Haman. The king is Ahasuerus (Xerxes), in the twelfth year of his reign (counting from his accession in 486 B.C., about 474 B.C.); see [Persia and the Return](/old-testament/guides/persia-and-the-return/#rulers). The gallows of verse 9 is explained at [[Esth. 5:14]]; chapter 8 takes up the decree that could not be revoked.

thread: |
  Everything in Esther 7 turns on one sentence finally spoken. Since chapter 2 Esther has held two things back: that she is a Jew ([[Esth. 2:10]]) and what she wants ([[Esth. 5:3–8]]). Asked a third time, she says both at once, “let my life be given me… and my people,” and in saying it she reveals that she is one of the condemned people and that the king had been tricked or bribed into condemning them.

  From there the chapter moves fast and every move is a reversal. The king who sealed the decree without asking whose it was now asks “Who is he, and where is he?” The man who had come to the palace to ask for Mordecai's life ends the evening begging the queen for his own. And the gallows Haman built for Mordecai the night before stands ready for him. The narrator names no hand behind any of it; Joseph Smith, reading the story from a jail in Missouri, did.

sections:
  - range: 1-2
    heading: The second banquet
    plain: |
      So the king and Haman came to dine with Queen Esther. On this second day, as they drank wine, the king asked Esther again: What is your petition, Queen Esther? It will be granted. What is your request? Up to half the kingdom, it will be done.
  - range: 3-6
    heading: The queen's petition
    plain: |
      Then Queen Esther answered: If I have found favor with you, O king, and if it pleases the king, let my life be given me—that is my petition—and my people's lives—that is my request. For we have been sold, I and my people, to be destroyed, killed, and wiped out. If we had only been sold as slaves, men and women, I would have kept quiet, for that would not have harmed the king's interests. King Ahasuerus said to Queen Esther: Who is he, and where is he, who has dared to plan such a thing? Esther said: The adversary and enemy is this wicked Haman. Then Haman was terrified before the king and the queen.
  - range: 7-8
    heading: Haman at the queen's couch
    plain: |
      The king rose from the wine in a rage and went out into the palace garden. Haman stayed behind to beg Queen Esther for his life, for he saw that the king had already decided his ruin. When the king came back from the garden into the banquet hall, Haman had fallen on the couch where Esther was reclining. The king said: Will he even assault the queen while I am in the house? As soon as the words left the king's mouth, they covered Haman's face.
  - range: 9-10
    heading: Haman's own gallows
    plain: |
      Then Harbonah, one of the king's chamberlains, said: Look, there is the gallows, fifty cubits high, that Haman made for Mordecai, the man who had spoken up for the king's good. It is standing at Haman's house. The king said: Hang him on it. So they hanged Haman on the gallows he had prepared for Mordecai, and the king's anger subsided.

notes:
  - ref: 3
    phrase: let my life be given me at my petition, and my people at my request
    kind: history
    title: My life, and my people
    body: |
      Esther's request reveals two secrets at once: that her own life is in danger, and that she belongs to the condemned people. The king has asked three times what she wants ([[Esth. 5:3]]; [[Esth. 5:6]]; verse 2), and at this second banquet she answers, with the same courteous opening she had used the day before ([[Esth. 5:8]]). She does not begin with Haman or with the decree. She begins with herself: “let my life be given me,” and then adds “my people.”

      That is the turn. Since the day she was taken into the palace she had kept her people and her kindred hidden, at Mordecai's charge ([[Esth. 2:10]]; [[Esth. 2:20]]). By joining “my people” to “my life,” she tells the king she is a Jew and that the decree he had sealed without asking whose it was ([[Esth. 3:8–11]]) reaches into his own house. Her request is that the king preserve her and her people together.

      The theme page [I and My People](/esther/themes/i-and-my-people/#we-are-sold) traces this plea from the hiding of [[Esth. 2:10]] to the plea for “my people” and “my kindred” ([[Esth. 8:6]]), and sets it beside Christ, who “took part of the same” ([[Heb. 2:14]]) and pleads His own death for His brethren.
    sources: [breitenstein-esther-minute, lds-scriptures]

  - ref: 4
    phrase: For we are sold, I and my people, to be destroyed, to be slain, and to perish
    kind: words
    title: Sold to be destroyed
    body: |
      “Sold” is the word that names the bargain. It points back to Haman's offer to pay ten thousand talents of silver into the king's treasury for the destruction of the Jews ([[Esth. 3:9]]), an offer Mordecai had reported to Esther down to “the sum of the money” ([[Esth. 4:7]]); the footnotes make the same link. The three verbs that follow are the decree's own, “to destroy, to kill, and to cause to perish” ([[Esth. 3:13]]; see the note there), now spoken by one of those it named.

      Then she measures her plea against the king's interest. Had they been sold as slaves, she would have kept silent. The King James clause that follows, “although the enemy could not countervail the king's damage,” is hard English for a hard Hebrew line; the footnote gives its sense as “for that would not have damaged the king's interests.” Slavery would have cost the king nothing, and Esther would not have troubled him with it. Death is another matter: one reading is that the king, by allowing every Jew in his kingdom to be killed, would be throwing away a valuable labor force, which was not to his benefit.
    sources: [breitenstein-esther-minute, lds-scriptures]

  - ref: 5
    phrase: Who is he, and where is he, that durst presume in his heart to do so?
    kind: history
    title: Who is he, and where is he?
    body: |
      The king's question shows that he had not known whose people he had condemned. Haman had asked for the destruction of “a certain people scattered abroad,” never naming them, and the king had answered, “the people also, to do with them as it seemeth good to thee” ([[Esth. 3:8–11]]). Now he hears that the people are the queen's and asks who has tricked him into ordering their annihilation.

      Esther's answer is one line, and Haman is sitting at the table: “The adversary and enemy is this wicked Haman” (verse 6). Haman, who had come to the palace that morning to ask for Mordecai's death ([[Esth. 6:4]]), became afraid.
    sources: [breitenstein-esther-minute, lds-scriptures]

  - ref: 8
    phrase: Haman was fallen upon the bed whereon Esther was
    kind: history
    title: The couch and the covered face
    body: |
      The “bed” was probably a banquet couch, and Haman most likely fell on it to plead for his life, not to attack the queen. At banquets in the ancient Near East guests reclined on pillows or couches, and the Hebrew word translated “bed” may mean such a place of reclining. When the king went out in his anger, Haman saw that his ruin was settled and that he had no mercy to expect from the king unless the queen interceded (verse 7). So, on the likeliest reading, he threw himself at Esther's feet on the couch where she reclined, and that is how the king found him.

      The king, in the heat of his anger, read the worst into it: “Will he force the queen also before me in the house?” He took Haman's posture as an assault on the queen. The narrator never states a sentence of death in so many words; on one older reading, “the word” that “went out of the king's mouth” is itself that sentence, and the covering of Haman's face shows it, for to cover a condemned man's face was to begin the execution. Esther never proposed what Haman's punishment should be; the king's anger, and then the gallows Haman had built himself (verse 9), brought it about.
    sources: [ot-manual-31, keil-esther]

  - ref: 10
    phrase: So they hanged Haman on the gallows that he had prepared for Mordecai
    kind: prophets
    title: Haman on his own gallows
    body: |
      The narrator tells Haman's end without comment and names no one behind it; Joseph Smith did. On 16 December 1838, writing from Liberty Jail to comfort the Saints scattered from Missouri, he reached for this verse: “we want you to remember Haman and Mordecai.” Haman, he wrote, “sought the life of Mordecai and the people of the jews. But the Lord so ordered that Haman was hanged upon his own gallows.” Then: “So shall it come to pass with poor Haman in the last days.” He applied it to those who had driven out the Saints and borne false witness against them: they “shall be hanged upon their own gallows, or in other words shall fall” (the Joseph Smith Papers transcribe the letter from Zina Huntington's copy). What the book leaves unsaid, the Prophet read as the Lord's ordering.

      The same exchange of places is one of the examples given in the note on “The wicked shall be a ransom for the righteous” at [[Prov. 21:18]]. The gallows prepared for one man held the other, and with that “was the king's wrath pacified.”
    sources: [jsp-letter-caldwell-1838, underwood-jst-kjb, lds-scriptures]

christ: |
  Haman fell into the death he had prepared for another. The footnote at verse 10 sets beside it the Savior's words, “with what judgment ye judge, ye shall be judged: and with what measure ye mete, it shall be measured to you again” ([[Matt. 7:2]]), a link that rests on that cross-reference; and Joseph Smith, in prison, read the story as the Lord's own ordering and as a pattern for the Saints' persecutors in the last days. Saints who are wronged can leave the reckoning to the Lord.

explore: |
  - [[Esth. 3:8–11]] with [[Esth. 7:3–6]]: the people the king gave away unnamed, and the queen who named them as her own.
  - [[Esth. 5:14]] with [[Esth. 7:9–10]]: the gallows built in the evening and used the next day.
  - [[Prov. 11:5–6]] and [[1 Ne. 14:3]]: the footnotes' witnesses that the wicked fall by their own snare.

sources: [lds-scriptures, bible-chron-ot, scripture-helps-esther, breitenstein-esther-minute, keil-esther, ot-manual-31, jsp-letter-caldwell-1838, underwood-jst-kjb]
