chapter: 2
title: Esther Made Queen
tagline: The king's servants gather the empire's fair young women to Shushan; an orphan of the exile is taken with them, keeps her people hidden as Mordecai charged her, and is crowned; and a plot overheard at the king's gate is written in the king's book and forgotten.
when: 'From after the feast of chapter 1 to the tenth month of the seventh year of Ahasuerus, about 479 B.C. (verse 16).'

setting: |
  Chapter 1 ended with Vashti put away and a decree sent to every province. Chapter 2 opens “after these things,” and its one date shows how long after: Esther is taken to the king in the month Tebeth “in the seventh year of his reign” (verse 16), four years after the feast of the third year ([[Esth. 1:3]]). Counting from the accession of Xerxes in 486 B.C., that is about 479 B.C. The battles of Thermopylae and Salamis, in 480, fall in those years; the book says nothing of them. The kings and their dates are set out in [Persia and the Return](/old-testament/guides/persia-and-the-return/#rulers).

  The chapter brings in the two people the story turns on. Some Jews had gone home to Jerusalem after Cyrus took Babylon, but many stayed in the east, Esther among them; here she and her cousin Mordecai are living in Shushan. The chapter moves from the king's servants' plan (verses 1–4) to Mordecai and the orphan he raised (verses 5–11), to Esther's year in the house of the women and her crowning (verses 12–18), and ends at the king's gate with a plot found out and set down in the royal chronicle (verses 19–23), a record the story comes back to in [[Esth. 6:1–3]].

thread: |
  Nothing in the chapter names God, and nearly everything in it is done *to* Esther: she “was brought also unto the king's house” (verse 8) and “was taken unto king Ahasuerus” (verse 16). What she does is obey Mordecai and keep quiet (verses 10, 20), take only what she is given (verse 15), and win favor. Yet the chapter sets the two pieces the deliverance will need. An orphan of the exile is made queen, and a Jew at the gate saves the king's life and is left unrewarded in the king's book. The Church's helps count Mordecai's discovery of the plot among the ways the Lord made the deliverance possible (the note at verse 23). The chapter tells all of it as court routine; only the rest of the book shows what it was for.

sections:
  - range: 1-4
    heading: The search for a new queen
    plain: |
      Some time later, when King Ahasuerus's anger had cooled, he remembered Vashti, what she had done and what had been decreed against her. So the servants who attended him said, “Let fair young virgins be sought for the king. Let the king appoint officers in every province of his kingdom to gather all the fair young virgins to the citadel of Shushan, to the house of the women, in the care of Hege the king's chamberlain, keeper of the women, and let their beauty treatments be given them. Then let the young woman who pleases the king be queen instead of Vashti.” The plan pleased the king, and he did it.
  - range: 5-11
    heading: Mordecai and Esther
    plain: |
      Now in the citadel of Shushan there was a Jew named Mordecai, son of Jair, son of Shimei, son of Kish, of the tribe of Benjamin. His family had been carried away from Jerusalem among the captives taken with Jeconiah king of Judah, whom Nebuchadnezzar king of Babylon had carried away. Mordecai had brought up Hadassah, that is, Esther, the daughter of his uncle, because she had neither father nor mother; the girl was lovely and beautiful, and when her parents died Mordecai had taken her as his own daughter. So when the king's order was proclaimed and many young women were gathered to Shushan into Hegai's care, Esther too was taken into the king's house, into the care of Hegai, keeper of the women. She pleased him and won his kindness. He quickly gave her her beauty treatments and her portions, with seven maids chosen for her from the king's house, and moved her and her maids to the best rooms in the house of the women. Esther had not made known her people or her family, because Mordecai had told her not to. Every day Mordecai walked in front of the court of the women's house to find out how Esther was and what was happening to her.
  - range: 12-18
    heading: Esther made queen
    plain: |
      Each young woman's turn to go in to King Ahasuerus came after twelve months of the regimen prescribed for the women: six months with oil of myrrh and six months with perfumes and other cosmetics. When she went in to the king, she was given whatever she asked to take with her from the house of the women to the king's house. She went in the evening, and in the morning she went back to a second house of the women, in the care of Shaashgaz, the king's chamberlain who kept the concubines. She did not go to the king again unless he delighted in her and called for her by name. When the turn came for Esther, the daughter of Abihail, Mordecai's uncle, whom Mordecai had taken as his daughter, she asked for nothing except what Hegai the king's chamberlain, keeper of the women, advised. And Esther won the favor of everyone who saw her. Esther was taken to King Ahasuerus in his royal house in the tenth month, the month Tebeth, in the seventh year of his reign. The king loved Esther more than all the other women, and she won his grace and favor more than all the virgins, so he set the royal crown on her head and made her queen instead of Vashti. Then the king gave a great banquet for all his princes and servants, Esther's banquet; he granted a rest to the provinces and gave gifts with royal generosity.
  - range: 19-23
    heading: A plot discovered at the gate
    plain: |
      When the virgins were gathered a second time, Mordecai was sitting in the king's gate. Esther still had not made known her family or her people, as Mordecai had told her, for Esther did what Mordecai said just as she had when he was bringing her up. In those days, while Mordecai sat in the king's gate, two of the king's chamberlains who guarded the door, Bigthan and Teresh, became angry and plotted to kill King Ahasuerus. Mordecai learned of it and told Queen Esther, and Esther told the king in Mordecai's name. The matter was investigated and found to be true, so both men were hanged on a tree, and it was written down in the book of the chronicles in the king's presence.

notes:
  - ref: 5
    phrase: the son of Kish, a Benjamite
    kind: history
    title: Mordecai, of the line of Kish
    body: |
      Mordecai's lineage is short and pointed: “the son of Jair, the son of Shimei, the son of Kish, a Benjamite.” Three names can hardly span the century and more between the exile and the reign of Xerxes, so Shimei and Kish may be a few noted ancestors rather than a grandfather and great-grandfather, as genealogies often give only noted names. Kish is the name of Saul's father, the Benjamite of [[1 Sam. 9:1]]. *Scripture Helps* notes that Mordecai, like Saul, was a descendant of Benjamin, and that the author may have given the lineage of Mordecai and of Haman to explain some of their hostility toward each other. Haman is “the Agagite” ([[Esth. 3:1]]), and Agag was the Amalekite king Saul spared ([[1 Sam. 15:8–9]]); that conflict belongs to chapter 3.

      Verse 6 raises a question of its own. In the Hebrew, “who had been carried away” can refer to Mordecai or to Kish. The Church's reading takes it of Kish: Mordecai's great-grandfather “was apparently carried into captivity in the first Jewish deportation into Babylon,” and Mordecai was born in exile. The dates explain why: the deportation with Jeconiah was about 113 years before Xerxes came to the throne, so if Mordecai himself had been carried away, even as a child, he would have been about 125 when he rose to power in the king's court. Another reading keeps “who” for Mordecai but takes it loosely, as giving his origin rather than his history: he belonged to the captives of Jeconiah through his forefathers and was himself born in exile. Either way the verse puts Mordecai among the families of the first captivity ([[2 Kgs. 24:14–15]]), still in the east generations later.
    sources: [lds-scriptures, scripture-helps-esther, ot-manual-31, keil-esther]

  - ref: 8
    phrase: Esther was brought also unto the king’s house
    kind: history
    title: Brought into the king's house
    body: |
      The text gives Esther no choice in what happens to her. The king's officers “gather together all the fair young virgins” (verse 3); Esther “was brought also unto the king's house” (verse 8); her turn comes and she “was taken unto king Ahasuerus” (verse 16). The system is described without comment: twelve months of preparation, one night with the king, and then the second house of the women, under the keeper of the concubines, where a woman stayed unless “the king delighted in her, and that she were called by name” (verses 12–14). Esther found herself “in a position she did not choose for herself,” and her story speaks to those in “positions that are not ideal or of their own choosing” who recognize that others depend on them and are willing to serve.

      What the text does let Esther do is small and telling. When each young woman went to the king, “whatsoever she desired was given her” to take with her (verse 13); Esther “required nothing but what Hegai… appointed” (verse 15). The chapter records the result three times over: she obtained Hegai's kindness (verse 9), the favor of “all them that looked upon her” (verse 15), and the king's “grace and favour” above all the others (verse 17).
    sources: [lds-scriptures, bingham-gardner-role-models]

  - ref: 10
    phrase: for Mordecai had charged her that she should not shew it
    kind: history
    title: A people kept hidden
    body: |
      The chapter says twice that Esther did not make known her people, and both times the only reason it gives is Mordecai's charge. Verse 10 states it; verse 20 repeats it after she is queen and adds her side: “Esther did the commandment of Mordecai, like as when she was brought up with him.” Why Mordecai wanted it hidden, the text does not say. What it does show is his care: he walked every day before the court of the women's house “to know how Esther did” (verse 11), and as queen she still heard from him (verse 22).

      The silence holds until Esther breaks it herself, before the king and Haman: “we are sold, I and my people” ([[Esth. 7:4]]).
    sources: [lds-scriptures]

  - ref: 18
    phrase: he made a release to the provinces
    kind: words
    title: A release to the provinces
    body: |
      The king's “release” was a grant of rest to the provinces, though what form it took is uncertain. The Hebrew noun is *hănāḥâ*, from the verb for giving rest, and the standard Hebrew lexicon defines it as “a giving of rest, i.e. perhaps holiday-making.” The ancient translations already differed: the Latin has a word for rest, while the Greek has *aphesis*, “release” (“he made a release to those who were under his dominion”), which some have taken as a release from taxes or an amnesty. With the gifts given “according to the state of the king,” the new queen's crowning brought the provinces some relief, a holiday perhaps, or a remission; the text does not say which. The banquet itself is named for her: “Esther's feast.”
    sources: [oshb-wlc, bdb, lxx-rahlfs]

  - ref: 23
    phrase: it was written in the book of the chronicles before the king
    kind: history
    title: Written in the book, and left unrewarded
    body: |
      The chapter ends with a deed recorded and nothing given for it. Mordecai, sitting in the king's gate, learns that two of the doorkeepers, Bigthan and Teresh, mean to kill the king; Esther tells the king “in Mordecai's name” (verse 22); the charge is investigated and proved, the two are hanged (on what that punishment was, see [[Esth. 5:14]]), and the matter is written “in the book of the chronicles before the king,” the official record of events in the empire. The text records no reward.

      The story returns to that page years later. On the night the king cannot sleep he has the record read to him, comes to Mordecai's report of the two doorkeepers, and asks, “What honour and dignity hath been done to Mordecai for this?” His servants answer, “There is nothing done for him” ([[Esth. 6:3]]). The book names no cause, but the Church's helps do: *Come, Follow Me* lists these verses among the ways the Lord made it possible for Esther to save the Jews, and *Scripture Helps* says it is implied that the Lord's influence led the king to read that part of the record ([[Esth. 6:1]]).
    sources: [lds-scriptures, scripture-helps-esther, cfm-ot-2026-32]

christ: |
  The book never names the Lord, but the Church's helps see His hand in Esther's rise: He may have placed her as queen to be His instrument in saving the Jews, and the truth drawn from her story is that “the Lord places us in situations where we can help others and accomplish His will.” For a disciple of Jesus Christ that hand reaches into places not chosen, as Esther's was not. He guides a path through small details that go unrecognized at the time, and prepares a person for the moment when he or she can be an instrument in His hands.

explore: |
  - **The record read.** [[Esth. 6:1–3]], the night the king hears of Mordecai's deed.
  - **The secret told.** [[Esth. 7:3–4]] and [[Esth. 8:1]].
  - **Kish and Agag.** [[1 Sam. 9:1–2]] and [[1 Sam. 15:8–9]], behind the enmity of [[Esth. 3:1–6]].
  - **Two names in exile.** [[Dan. 1:6–7]], which *Scripture Helps* sets beside Hadassah and Esther.
  - **The captivity with Jeconiah.** [[2 Kgs. 24:10–16]].

