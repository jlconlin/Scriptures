summary: >-
  Esther is a book told entirely through people: a Jewish queen in a Persian palace, her cousin Mordecai at
  the king's gate, a king on his throne, and a people under sentence of death who fast and pray for three
  days before she risks her life by going in to the king unbidden (Esther 4:1–3, 16; 5:1–2). The image holds
  that one moment and what stands behind it: outside the gate, Mordecai and the people in sackcloth fasting;
  inside, Esther in her royal apparel standing alone in the inner court, and the king holding out the golden
  sceptre to her. Her courage rests on their fast, and the open ground between the two halves is the distance
  she crossed.
figures: >-
  Human figures are allowed for Esther (author, 2026-11-13: “Where is Esther the queen? Where is Mordecai?
  Where is the king? What about the people fasting and praying?”): Esther, the king, Mordecai, and a small
  group of the fasting people. All are small in the frame, in the middle distance, fully robed in the dress
  of ancient Persia, drawn simply with no detailed faces; Esther is seen from behind or in profile, never
  posed toward the viewer. No other figures: no guards, courtiers or servants.
motifs:
  - "Primary: Esther standing alone at the threshold of the king's inner court (Esther 5:1), seen from behind and a little to the side, a slender woman in a long royal robe of deep blue with a simple gold circlet on her head and a veil falling down her back, her hands at her sides, standing still and upright on the open pale stone floor. She is the focal point: courage that goes in unbidden after fasting."
  - "The king seated on a raised throne at the far end of the court, facing Esther across the floor, a bearded figure in a long robe with a tall plain crown, holding out toward her a long slender golden sceptre with a small rounded knob at its tip, his arm extended so the sceptre points at her (Esther 5:2). He is smaller than Esther, because farther away."
  - "Outside the palace, to the left, beyond a tall open gateway: Mordecai sitting on the ground at the king's gate in rough dark sackcloth, ashes on his head, his head bowed (Esther 4:1–2), and behind him in the street a small group of six or seven people, also in plain dark sackcloth, kneeling and sitting on the ground with heads bowed in fasting and prayer (Esther 4:3, 16). They are small, quiet, and close together, and each is different: men and women, old and young, one with a child beside her, in sackcloth of different browns and greys, some with heads covered and some not."
composition: >-
  A wide landscape divided into two places with open ground between them. The left third is outside the
  palace, under the cool blue-grey light of early morning: a plain street of pale earth and the tall open
  gateway of the palace, where Mordecai sits at the gate and the small group of fasting people kneel behind
  him. The right two thirds is the inner court seen through and beyond the gateway: a broad floor of pale
  stone, plain square columns along the sides, warm golden light falling from high openings at the upper
  right, so shadows fall to the lower left. Esther stands on the open floor in the middle of the picture,
  nearer the viewer than the king, and the king's raised throne is at the far right end of the court, with
  the golden sceptre held out toward her catching the light. The two places are joined by the gateway and the
  long open floor, so the eye moves from the fasting people to Esther to the sceptre. No crowds, no banquet,
  no gallows, no weapons, no text or lettering anywhere.
