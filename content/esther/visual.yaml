alt: >-
  Outside a Persian palace gate, Mordecai and a few of his people, old and young, sit and kneel in sackcloth, fasting; inside,
  across a broad stone court, Queen Esther stands alone in a royal blue robe before the king, who holds out
  the golden sceptre to her from his throne.
key:
  - '**Mordecai, in sackcloth at the open gate,** is where the book puts him when he learned of the decree: he “put on sackcloth with ashes” and “came even before the king’s gate: for none might enter into the king’s gate clothed with sackcloth” ([[Esth. 4:1–2]]). He stops at the threshold, and from there he sent Esther word that she must go to the king for her people ([[Esth. 4:8]]).'
  - '**The people kneeling behind him,** old and young, a mother with her child among them, are the Jews under sentence of death. Wherever the decree came “there was great mourning among the Jews, and fasting, and weeping, and wailing” ([[Esth. 4:3]]). Then Esther asked for their fast: “gather together all the Jews that are present in Shushan, and fast ye for me, and neither eat nor drink three days” ([[Esth. 4:16]]).'
  - '**Esther, alone on the open floor of the court,** is the queen on the third day of that fast. She “put on her royal apparel, and stood in the inner court of the king’s house” ([[Esth. 5:1]]), though to come uncalled was death unless the king spared her ([[Esth. 4:11]]). She had said before she went, “so will I go in unto the king, which is not according to the law: and if I perish, I perish” ([[Esth. 4:16]]). The empty floor between the gate and the throne is the risk she took, and the people fasting behind her are what she went in for.'
  - '**The king on his throne, holding out the golden sceptre,** is the answer she could not count on: “she obtained favour in his sight: and the king held out to Esther the golden sceptre that was in his hand. So Esther drew near, and touched the top of the sceptre” ([[Esth. 5:2]]).'
