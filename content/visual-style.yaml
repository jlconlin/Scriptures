version: 1

# This is the visual identity for every generated book image. Book-specific meaning
# belongs in content/<book>/visual.yaml; do not copy these rules into individual briefs.
asset:
  aspectRatio: '16:9'
  # No pixel size: Codex's built-in image tool chooses it (1672x941 at 16:9, the size of
  # every book image on the site; author, 2026-10-04: “Those images look just fine”).
  quality: high

prompt:
  useCase: illustration-story
  assetType: wide book-page illustration for a scripture-study website
  style: >-
    A calm, high-fidelity digital editorial illustration with natural materials,
    restrained tonal layering, and a warm cinematic sense of light. Use clear,
    gently faceted forms and clean shape relationships, enriched by subtle natural
    texture and atmospheric depth. Mature and composed: neither cartoonish, a
    fine-art painting, nor a stock photograph.
  palette: >-
    Warm clay, muted olive, parchment cream, deep indigo, and restrained gold
    light, adapted only when a book's subject requires it.
  composition: >-
    A 16:9 landscape with one clear symbolic focal point, breathing room around
    it, and a quiet distant setting where helpful. The subject must remain clear
    at full-page width and at tablet size.
  constraints:
    - Symbolic rather than historical reconstruction.
    - No people, faces, literal sacred figures, text, lettering, logos, UI, or decorative frames.
    - No stock-photo look, exaggerated photographic depth of field, lens blur, hyper-detailed material texture, painterly brushwork, faux parchment, 3D render, or visible AI artifacts.
    - Preserve an illustrated first impression through clear silhouette, restrained faceting, and editorial composition; natural depth and subtle material texture are welcome.
    - Do not add motifs beyond the book brief.
    - Treat AI output as a candidate; it is never published until approved.
